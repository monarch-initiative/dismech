- name: Pre- and Postnatal Growth Failure
  biological_scale: ORGANISM
  description: >-
    Symmetric growth restriction beginning in utero and continuing postnatally
    is one of the most consistent features of the syndrome and is the systemic
    expression of a generalized proliferation deficit. Growth failure is
    reported as severe in several individuals and is present in essentially all
    molecularly confirmed cases.
  evidence:
  - reference: PMID:33913579
    reference_title: Identification of a novel pathogenic variant in CKAP2L and literature review in a child with Filippi syndrome and congenital talipes equinovarus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      characterized by pre- and postnatal growth retardation, microcephaly,
      distinctive facial appearance, developmental delay/intellectual
      disability, and variable syndactylies of the fingers and toes
    explanation: >-
      States pre- and postnatal growth retardation as a defining component of
      the clinical definition.
mechanistic_hypotheses:
- hypothesis_group_id: mitotic_proliferation_deficit_model
  hypothesis_label: Mitotic spindle / progenitor proliferation deficit model
  status: CANONICAL
  description: >-
    The established model: CKAP2L is a spindle-pole microtubule-associated
    protein required for bipolar spindle assembly and mitotic progression, and
    its biallelic loss produces multipolar spindles, chromosome missegregation,
    and cytokinesis failure. In the neural stem/progenitor compartment where the
    protein is enriched, this depletes the cortical progenitor pool and yields
    microcephaly; the same proliferation deficit is invoked, less directly, for
    the growth failure and craniodigital features.
  evidence:
  - reference: PMID:25439729
    reference_title: Mutations in CKAP2L, the human homolog of the mouse Radmis gene, cause Filippi syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings show that loss-of-function mutations in CKAP2L are a major
      cause of Filippi syndrome.
    explanation: >-
      Establishes CKAP2L loss of function as the principal disease mechanism.
- hypothesis_group_id: centrosomopathy_ciliary_model
  hypothesis_label: Centrosomopathy model (concurrent proliferation and ciliary defects)
  status: EMERGING
  description: >-
    A 2026 proposal that Filippi syndrome should be reclassified as a
    centrosomopathy in which CKAP2L loss simultaneously impairs mitosis and
    de-represses primary cilium elongation, with ciliary signalling contributing
    to the non-neural (craniofacial, digital, and possibly renal) features. The
    ciliary-length data are from human and mouse cell lines only; no patient
    tissue or clinical correlate has yet been reported, and the strongest
    in vivo test to date (the Ckap2l knockout mouse) produced no developmental
    phenotype at all.
  evidence:
  - reference: PMID:41370039
    reference_title: Filippi syndrome-associated CKAP2L modulates microtubule dynamics essential for mitosis and ciliary length regulation.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      these findings position CKAP2L as a multifunctional regulator of
      microtubule-based organelles and suggest that Filippi syndrome can be
      classified as a 'centrosomopathy' arising from concurrent defects in cell
      proliferation and ciliary function.
    explanation: >-
      The source of the emerging reclassification, stated by its authors as a
      suggestion rather than a demonstrated disease mechanism.

genetic:
- name: CKAP2L
  gene_term:
    preferred_term: CKAP2L
    term:
      id: hgnc:26877
      label: CKAP2L
  association: Causal
  notes: >-
    CKAP2L encodes cytoskeleton-associated protein 2-like, a spindle-pole
    protein (mouse homolog Radmis). Most reported pathogenic variants are
    truncating (frameshift, canonical splice site, or start-loss) in the
    amino-terminal half of the protein and are predicted to trigger
    nonsense-mediated decay, consistent with a loss-of-function mechanism; a
    single missense variant in trans with a frameshift variant has also been
    reported. Biallelic loss of function is a major cause of Filippi syndrome.
  evidence:
  - reference: PMID:25439729
    reference_title: "Mutations in CKAP2L, the human homolog of the mouse Radmis gene, cause Filippi syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings show that loss-of-function mutations in CKAP2L are a major cause of Filippi syndrome."
    explanation: Establishes biallelic loss-of-function CKAP2L variants as a major cause of Filippi syndrome.
  - reference: PMID:34921061
    reference_title: "Novel variants identified in CKAP2L in two siblings with Filippi syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing of the family identified a missense variant, c.2066G > A;p.(Arg689His), in trans with a frameshift variant, c.1169_1173del;p.(Ile390LysfsTer4), in CKAP2L"
    explanation: Reports the first missense variant (in trans with a frameshift variant) in CKAP2L-related Filippi syndrome.

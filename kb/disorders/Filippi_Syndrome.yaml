pathophysiology:
- name: CKAP2L Loss of Function at the Mitotic Spindle
  description: >-
    CKAP2L (cytoskeleton-associated protein 2-like), the human homolog of the
    mouse Radmis (radial fiber and mitotic spindle) protein, localizes to the
    mitotic spindle poles. Biallelic loss-of-function variants abolish CKAP2L at
    the spindle poles. The carboxy-terminal region of CKAP2L contains a
    cytoskeleton-associated protein-2 (CKAP2) domain homologous to CKAP2, a
    microtubule-associated protein involved in mitotic progression.
  cell_types:
  - preferred_term: Neural progenitor cell
    term:
      id: CL:0000047
      label: neural stem cell
  evidence:
  - reference: PMID:25439729
    reference_title: "Mutations in CKAP2L, the human homolog of the mouse Radmis gene, cause Filippi syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "dividing LCLs established from the individuals homozygous for the c.571dupA mutation did not show CKAP2L at the spindle poles."
    explanation: Demonstrates loss of CKAP2L at the spindle poles in patient-derived lymphoblastoid cell lines in culture.
  downstream:
  - target: Mitotic Spindle Disorganization and Chromosome Missegregation
- name: Mitotic Spindle Disorganization and Chromosome Missegregation
  description: >-
    Loss of CKAP2L from the spindle poles produces an increased number of
    disorganized spindle microtubules with multipolar configurations and
    defective chromosome segregation during mitosis of cells from affected
    individuals.
  cell_types:
  - preferred_term: Neural progenitor cell
    term:
      id: CL:0000047
      label: neural stem cell
  biological_processes:
  - preferred_term: Mitotic spindle organization
    term:
      id: GO:0007052
      label: mitotic spindle organization
    modifier: ABNORMAL
  - preferred_term: Chromosome segregation
    term:

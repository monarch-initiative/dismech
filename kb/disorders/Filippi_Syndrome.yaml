    evidence_source: MODEL_ORGANISM
    snippet: "it was rediscovered in mice as Radmis (radial fiber and mitotic spindle) and shown to play a pivotal role in cell division of neural progenitors."
    explanation: Establishes the CKAP2L/Radmis role in neural progenitor cell division (mouse model) underlying microcephaly.
  - reference: PMID:25439729

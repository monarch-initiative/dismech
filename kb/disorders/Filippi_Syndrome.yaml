name: Filippi Syndrome
creation_date: "2026-07-11T12:00:00Z"
disease_term:
  preferred_term: Filippi syndrome
  term:
    id: MONDO:0010092
    label: Filippi syndrome
synonyms:
- FLPIS
- Craniodigital syndrome, Filippi type
- Syndactyly type I with microcephaly and intellectual disability
description: >-
  Filippi syndrome (FLPIS) is a very rare autosomal recessive craniodigital
  disorder caused by biallelic loss-of-function variants in CKAP2L, the human
  homolog of the mouse Radmis gene, which encodes cytoskeleton-associated
  protein 2-like (CKAP2L). CKAP2L localizes to the mitotic spindle poles and is
  required for accurate spindle organization and chromosome segregation during
  the division of neural progenitor cells; loss of function produces
  disorganized, multipolar spindles and defective progenitor division. The core
  clinical picture comprises congenital microcephaly, pre- and postnatal growth
  failure, cutaneous syndactyly of the fingers and toes, distinctive
  craniofacial features (broad nasal bridge, underdeveloped alae nasi), and
  intellectual disability. Variable additional features include seizures,
  cryptorchidism in males, and dental and hair abnormalities. First described by
  Filippi in 1985 in three Sardinian siblings, fewer than ~40 molecularly or
  clinically diagnosed patients have been reported, and the phenotype overlaps
  with related craniodigital disorders, so the full clinical and genetic
  spectrum and genotype-phenotype correlation remain incompletely defined.
  Management is supportive and symptom-directed, including surgical correction
  of syndactyly, rehabilitative therapies, and genetic counseling.

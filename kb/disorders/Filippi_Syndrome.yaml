name: Filippi Syndrome
creation_date: '2026-07-12T07:27:01Z'
category: Mendelian
description: >
  Filippi syndrome (syndactyly type I with microcephaly and intellectual
  disability; craniodigital syndrome) is a very rare autosomal-recessive
  craniodigital disorder caused by biallelic loss-of-function mutations in
  CKAP2L, the human homolog of the mouse Radmis gene. It is characterized by
  microcephaly, pre- and postnatal growth failure, cutaneous syndactyly of the
  fingers and toes, distinctive craniofacial dysmorphism (broad nasal bridge,
  underdeveloped alae nasi), and variable neurodevelopmental impairment ranging
  from developmental delay to intellectual disability. CKAP2L encodes
  cytoskeleton-associated protein 2-like, a mitotic-spindle-associated protein
  essential for the cell division of neural progenitors; its loss produces
  disorganized, multipolar spindles and defective chromosome segregation,
  linking the microcephaly and growth failure to impaired neural-progenitor
  proliferation. Additional reported manifestations include seizures,
  cryptorchidism, dental and hair anomalies, and — in more recent reports —
  urinary-tract and skin-pigmentation abnormalities. Management is supportive
  and symptom-directed.

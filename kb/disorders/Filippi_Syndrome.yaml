discussions:
- discussion_id: mismatch_ckap2l_knockout_mouse_lacks_human_phenotype
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does a constitutive Ckap2l knockout mouse show no overt developmental
    abnormality — no microcephaly, no growth failure, no digit anomaly — when
    biallelic human CKAP2L loss of function causes a multiple-congenital-anomaly
    syndrome?
  attaches_to:
  - "pathophysiology#Neural Progenitor Division Failure"
  - "pathophysiology#Cortical Progenitor Pool Depletion"
  - "pathophysiology#Reduced Cortical Neuron Output and Postnatal Microcephaly"
  rationale: >-
    This is the sharpest open problem in the disorder's mechanism. The canonical
    model attributes human microcephaly to CKAP2L-dependent neural progenitor
    division, and the mouse ortholog radmis was the source of that model — yet
    the 2026 constitutive knockout produced only reduced male fertility with
    abnormally elongated sperm flagella, not the human developmental phenotype.
    Candidate explanations that would change how the mechanism should be curated
    include: (1) mouse-specific paralog redundancy (e.g. CKAP2) that human
    progenitors lack; (2) a human-specific requirement in outer radial glia and
    the OSVZ, the compartment responsible for primate cortical expansion and
    absent from lissencephalic mouse cortex — the same argument already recorded
    for other progenitor microcephalies in this KB; or (3) that the human
    phenotype does not in fact arise from the progenitor-proliferation arm at
    all. Until this is resolved, the mouse data support the cellular spindle
    phenotype but do not license the inference from spindle defect to human
    microcephaly.
  proposed_experiments:
  - experiment_id: exp_ckap2l_human_cortical_organoid
    name: CKAP2L-null human cortical organoid phenotyping
    description: >-
      Generate CKAP2L-null and patient-variant human iPSC-derived cortical
      organoids alongside isogenic controls and quantify apical and basal
      progenitor number, outer-radial-glia abundance, spindle orientation, and
      organoid size across corticogenesis.
    experiment_type:
      preferred_term: human iPSC-derived organoid disease modeling
    decision_criterion: >-
      The progenitor arm is supported for human biology if CKAP2L-null organoids
      show reduced progenitor number and organoid size relative to isogenic
      controls; a null result would argue that the mouse-based progenitor model
      does not explain the human phenotype.
  - experiment_id: exp_ckap2l_ckap2_paralog_redundancy
    name: Ckap2l/Ckap2 paralog-redundancy test in mouse cortex
    description: >-
      Compare Ckap2l single-knockout with Ckap2l;Ckap2 double-knockout mouse
      cortex for progenitor depletion, spindle phenotype, and brain size.
    experiment_type:
      preferred_term: mouse compound-knockout genetic interaction study
    decision_criterion: >-
      Paralog redundancy explains the absent single-knockout phenotype if the
      double knockout, but not the single knockout, reproduces progenitor
      depletion and reduced brain size.
  - experiment_id: exp_ckap2l_primary_human_progenitor_spindle
    name: Spindle phenotype in primary human neural progenitors
    description: >-
      Assay primary human fetal neural progenitors, or patient-derived cells
      differentiated to a progenitor state, for the multipolar-spindle and
      cytokinesis-failure phenotypes described in lymphoblastoid cells.
    experiment_type:
      preferred_term: primary human cell immunofluorescence assay
    decision_criterion: >-
      The cellular defect is relevant to the disease-affected cell type if
      multipolar spindles and cytokinesis failure are reproduced in human neural
      progenitors, not only in lymphoblastoid lines.
  evidence:
  - reference: PMID:41370039
    reference_title: Filippi syndrome-associated CKAP2L modulates microtubule dynamics essential for mitosis and ciliary length regulation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ckap2l knockout mice show no overt developmental abnormalities, with the
      exception of reduced male fertility, evidenced by decreased sperm count,
      impaired motility, and abnormally elongated flagella.
    explanation: >-
      Documents the failure of the constitutive mouse knockout to reproduce the
      human developmental phenotype — the mismatch itself.
- discussion_id: gap_syndactyly_mechanism_from_spindle_defect
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what tissue-level route does loss of a mitotic spindle protein produce
    cutaneous syndactyly of the fingers and toes — failure of interdigital
    programmed cell death, or a proliferation deficit in the autopod
    mesenchyme?
  attaches_to:
  - "pathophysiology#Impaired Craniofacial and Digital Morphogenesis"
  rationale: >-
    Digit separation depends on interdigital apoptosis, not on progenitor
    proliferation, so the canonical proliferation-deficit model does not
    obviously explain the digital half of the craniodigital phenotype. No
    published experiment connects CKAP2L to interdigital cell death or to the
    SHH/GLI3/HOXD patterning gradients that drive the limb/digit serial-homology
    module. This is why this entry declares conformance to the neural-progenitor
    centrosome-spindle module for the microcephaly arm but deliberately declines
    to declare conformance to limb_digit_patterning_serial_homology for the
    syndactyly arm, despite the phenotype being serially homologous across hands
    and feet. Resolving the route would either license that second conformance
    or establish a distinct apoptosis-based mechanism.
  proposed_experiments:
  - experiment_id: exp_ckap2l_interdigital_apoptosis
    name: Interdigital apoptosis versus proliferation in the autopod
    description: >-
      Examine autopod interdigital regions in a conditional limb-mesenchyme
      Ckap2l knockout (or an alternative model that expresses the digital
      phenotype) for reduced apoptosis versus reduced proliferation, using
      TUNEL/cleaved-caspase and mitotic-index staining at the embryonic stages
      of digit separation.
    experiment_type:
      preferred_term: conditional-knockout developmental histology study
    decision_criterion: >-
      Syndactyly is apoptosis-driven if interdigital TUNEL/cleaved-caspase
      signal is reduced with a preserved mitotic index, and
      proliferation-driven if the mitotic index falls with preserved
      interdigital cell death.
  - experiment_id: exp_ckap2l_hedgehog_gli3_limb_output
    name: Hedgehog/GLI3-repressor output in CKAP2L-deficient limb mesenchyme
    description: >-
      Test whether CKAP2L loss perturbs Hedgehog pathway activity and the
      GLI3-repressor gradient in limb mesenchyme, by transcriptional readout of
      Hedgehog target genes and GLI3 processing assays.
    experiment_type:
      preferred_term: signalling-pathway readout assay
    decision_criterion: >-
      Conformance to the limb/digit patterning module would become appropriate
      if CKAP2L loss measurably shifts GLI3 processing or Hedgehog target-gene
      output in limb mesenchyme.
- discussion_id: gap_centrosomopathy_reclassification_clinical_correlate
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  prompt: >-
    Should Filippi syndrome be reclassified as a centrosomopathy/ciliopathy, and
    is there a clinical correlate of the ciliary-length defect in patients?
  attaches_to:
  - "pathophysiology#Primary Cilium Elongation"
  - "pathophysiology#Impaired Craniofacial and Digital Morphogenesis"
  rationale: >-
    The reclassification proposal rests on cell-line data showing elongated
    primary cilia after CKAP2L depletion. The clinical spectrum contains two
    features that are suggestive of a ciliopathy — renal cysts and renal
    hypoplasia, reported in three families in 2024 — but the two observations
    have never been connected in the same patients, and syndactyly plus
    microcephaly are not by themselves ciliopathy-specific. If the link holds,
    conformance to ciliopathy_dysfunction (and possibly renal_cystogenesis)
    would become appropriate; on current evidence it would be premature.
  proposed_experiments:
  - experiment_id: exp_ckap2l_patient_fibroblast_cilium_length
    name: Cilium length and Hedgehog competence in patient fibroblasts
    description: >-
      Measure primary cilium length and Hedgehog-response competence in
      fibroblasts derived from individuals carrying biallelic CKAP2L variants,
      alongside isogenic or unaffected-relative controls.
    experiment_type:
      preferred_term: patient-derived primary fibroblast assay
    decision_criterion: >-
      The centrosomopathy model gains patient-level support if biallelic-variant
      fibroblasts show significantly elongated cilia and blunted Hedgehog
      response relative to controls.
  - experiment_id: exp_ckap2l_systematic_renal_imaging
    name: Systematic renal imaging in molecularly confirmed patients
    description: >-
      Image the kidneys of all reported and newly ascertained CKAP2L-confirmed
      patients to establish whether renal cysts and hypoplasia are recurrent
      rather than incidental.
    experiment_type:
      preferred_term: cross-sectional clinical imaging study
    decision_criterion: >-
      Renal involvement belongs in the core spectrum, and supports a ciliopathy
      reading, if cysts or hypoplasia are found in a substantial fraction of
      molecularly confirmed patients rather than only the three index families.
  evidence:
  - reference: PMID:38738944
    reference_title: "Filippi syndrome: Three new families suggest that urinary system abnormalities may belong to clinical spectrum of the disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the limited number of reported Filippi syndrome patients to date and
      the ongoing discovery of new clinical aspects of the disease, exploring
      its potential connection with kidney and skin pigmentation abnormalities
      could be valuable for future research.
    explanation: >-
      The authors themselves frame the renal association as provisional and in
      need of further study, which is why it supports only an emerging
      hypothesis.
- discussion_id: gap_genotype_phenotype_correlation_ckap2l
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is there a genotype-phenotype correlation in CKAP2L-related Filippi
    syndrome — in particular, do hypomorphic (missense) alleles explain the
    reported patients with milder neurodevelopmental outcome?
  attaches_to:
  - "pathophysiology#Reduced Cortical Neuron Output and Postnatal Microcephaly"
  rationale: >-
    Cognitive outcome ranges from severe intellectual disability with epilepsy
    to preserved intellect in an adolescent male, yet almost all reported
    alleles are frameshift and presumed complete loss of function, leaving the
    variability unexplained by allele class alone. The single reported missense
    allele has not been functionally characterized. With only 43 published
    patients — a mixture of molecularly confirmed and clinically diagnosed
    cases — the cohort is too small and too heterogeneous to support a
    correlation analysis, which the systematic review states explicitly.
  proposed_experiments:
  - experiment_id: exp_ckap2l_patient_registry_genotype_phenotype
    name: CKAP2L patient registry for genotype-phenotype analysis
    description: >-
      Establish an international CKAP2L patient registry with standardized
      neurodevelopmental, growth, and imaging assessment, restricted to
      molecularly confirmed cases, to power a genotype-phenotype analysis.
    experiment_type:
      preferred_term: multicentre patient registry study
    decision_criterion: >-
      A genotype-phenotype correlation exists if allele class or residual
      function stratifies neurodevelopmental outcome across the registry cohort.
  - experiment_id: exp_ckap2l_arg689his_functional_characterization
    name: Functional characterization of the p.Arg689His missense allele
    description: >-
      Assay the p.Arg689His variant for CKAP2L spindle-pole localization,
      microtubule binding, and rescue of the multipolar-spindle phenotype in
      CKAP2L-null cells.
    experiment_type:
      preferred_term: variant functional rescue assay
    decision_criterion: >-
      The allele is hypomorphic rather than null if it retains partial
      spindle-pole localization and partially rescues the spindle phenotype.
  evidence:
  - reference: PMID:42404495
    reference_title: "Clinical and Genetic Spectrum of Filippi Syndrome: A Systematic Review of Published Case Reports and Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further studies will be needed to delineate genotype-phenotype correlation
      and standardize treatment guidelines.
    explanation: >-
      The systematic review states the genotype-phenotype gap as an explicit
      conclusion.
notes: >-
  Diagnostic boundary. The literature distinguishes molecularly confirmed
  CKAP2L-related Filippi syndrome from "Filippi-like" overlapping craniodigital
  phenotypes, and the 2026 systematic review deliberately included both, which
  inflates the apparent phenotypic spectrum. Only about half of the individuals
  with a clinical Filippi diagnosis in the original replication cohort carried
  biallelic CKAP2L variants (4 of 8), so figures drawn from mixed cohorts should
  not be read as CKAP2L genotype-specific. This entry is scoped to
  CKAP2L-related disease (MONDO:0010092); phenotype frequencies taken from the
  systematic review are cohort-level, and the mechanism is anchored exclusively
  on molecularly confirmed evidence.


  Module conformance. The microcephaly arm conforms across four nodes of
  neural_progenitor_centrosome_spindle_dysfunction (perturbation → abnormal
  progenitor division → pool distortion → cortical output). Conformance to
  limb_digit_patterning_serial_homology is deliberately NOT declared even though
  the syndactyly is serially homologous across hands and feet, because no
  evidence links CKAP2L to the patterning-gradient trigger that module requires;
  see the syndactyly knowledge-gap discussion. Conformance to
  ciliopathy_dysfunction is likewise withheld pending a patient-level correlate
  of the cell-line ciliary phenotype.


  Historical note. The condition is also indexed as syndactyly type I with
  microcephaly and intellectual disability, and as Scott craniodigital syndrome;
  older reports predate the 2014 gene discovery and are clinical diagnoses only.
  Pre-2014 literature (including PMID:18553552) tested and excluded GJA1 before
  CKAP2L was known.

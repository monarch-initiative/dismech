- name: Impaired Craniofacial and Digital Morphogenesis
  biological_scale: TISSUE
  description: >-
    The craniodigital arm of the disorder: cutaneous syndactyly of the fingers
    and toes, together with the distinctive facies (broad, high nasal bridge,
    thin/underdeveloped alae nasi, micrognathia, high frontal hairline). This
    node is deliberately curated as an under-explained convergence point. The
    syndactyly is serially homologous — hands and feet are both affected — which
    is the pattern the limb/digit serial-homology module was built for, but no
    experiment links CKAP2L to the SHH/GLI3/HOXD patterning gradients that drive
    that module, so no conformance is asserted. Whether the digits fail to
    separate because interdigital cell death is reduced or because autopod
    progenitor proliferation is impaired is unresolved (see the knowledge-gap
    discussion).

animal_models:
- name: eEFSec-RNAi Drosophila
  species: Drosophila melanogaster
  genotype: RNAi knockdown of eEFSec
  genes:
  - preferred_term: EEFSEC
    term:
      id: hgnc:24614
      label: EEFSEC
  publication: PMID:39753114
  description: Drosophila with RNAi knockdown of the eEFSec ortholog, reported in the same study that
    defined the human disorder. The flies show progressive loss of motor function together with synaptic
    defects.
  modeled_mechanisms:
  - target: Progressive neurodegeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: UNKNOWN
    description: Progressive motor impairment with synaptic defects parallels the progressive motor
      decline of the human disorder.
    limitations: RNAi knockdown in an invertebrate is not the biallelic hypomorphic missense genotype
      of patients, and the abstract reports motor and synaptic readouts only, not the cerebellar hypoplasia
      and atrophy that define the human neurodegeneration.
    evidence:
    - reference: PMID:39753114
      reference_title: 'EEFSEC deficiency: A selenopathy with early-onset neurodegeneration.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: In line with the clinical phenotype, an eEFSec-RNAi Drosophila model displays progressive
        impairment of motor function, which is reflected in the synaptic defects in this model organisms.
      explanation: Shows that eEFSec knockdown in the fly produces progressive motor impairment with
        synaptic defects.

      explanation: Supports classification as an inborn error of selenocysteine metabolism.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:39753114
      reference_title: 'EEFSEC deficiency: A selenopathy with early-onset neurodegeneration.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Exome or genome sequencing identified six different bi-allelic EEFSEC variants in nine
        individuals from eight unrelated families.
      explanation: Supports classification as a Mendelian genetic disorder caused by bi-allelic EEFSEC
        variants.
  icimd_category:

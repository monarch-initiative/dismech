name: EEFSEC Deficiency
creation_date: '2026-07-06T05:15:58Z'
category: Metabolic Disorder
parents:
- Selenoprotein Biosynthesis Disorder
- Trace Element Metabolism Disorder
description: EEFSEC deficiency is an autosomal recessive selenoprotein synthesis disorder caused by biallelic
  EEFSEC variants. EEFSEC encodes the specialized selenocysteine-tRNA-specific eukaryotic elongation factor
  eEFSec, which promotes selenocysteinyl-tRNA delivery for UGA recoding during selenoprotein translation.
  Reduced EEFSEC function lowers selenoprotein levels, especially demonstrable in fibroblasts, and causes
  early-onset progressive neurodegeneration with global developmental delay, spasticity, ataxia, seizures,
  and cerebellar hypoplasia/atrophy.
synonyms:
- EEFSEC-related selenopathy with early-onset neurodegeneration
- eEFSec deficiency
- selenocysteine tRNA-specific eukaryotic elongation factor deficiency
notes: WP-079 seed identifier OMIM:607695 is an EEFSEC gene/locus record rather than a disease phenotype
  record. No exact local MONDO disease term was resolved, so disease_term is intentionally left unbound. No treatment
  is recorded because the only clinical source cited here (PMID:39753114) describes no management and
  mentions only potential targeted therapies.

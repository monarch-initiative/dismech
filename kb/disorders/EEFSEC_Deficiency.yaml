    notes: ICIMD category 22, "Disorders of trace elements and metals", other trace-element metabolism.
      EEFSEC deficiency is a selenocysteine metabolism disorder that impairs selenoprotein synthesis.
    evidence:
    - reference: PMID:39753114
      reference_title: 'EEFSEC deficiency: A selenopathy with early-onset neurodegeneration.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: This study identifies EEFSEC deficiency as an inborn error of selenocysteine metabolism.
      explanation: Supports classifying EEFSEC deficiency as a trace-element/selenocysteine metabolism
        disorder.

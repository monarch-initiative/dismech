  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:39753114
      reference_title: 'EEFSEC deficiency: A selenopathy with early-onset neurodegeneration.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: This study shows that bi-allelic selenocysteine tRNA-specific eukaryotic elongation factor
        (EEFSEC) variants cause selenoprotein deficiency, leading to progressive neurodegeneration.

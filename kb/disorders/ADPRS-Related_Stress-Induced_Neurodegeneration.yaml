- name: Persistent Serine-Mono(ADP-Ribose) Chromatin Scars
  biological_scale: MOLECULAR
  description: >-
    Serine is the dominant acceptor residue for ADP-ribosylation after DNA
    damage, and the modification is made by PARP1/PARP2 in complex with their
    cofactor HPF1 on core histones at the break site. When repair finishes, PARG
    removes the polymer but leaves the innermost ADP-ribose still esterified to
    the serine. Only ARH3 can remove that residue. In ARH3-deficient patient
    cells the leftover marks accumulate as mono(ADP-ribose) "chromatin scars" - a
    molecular record of recently repaired single-strand breaks. Endogenous
    mono(ADP-ribosyl)ation can persist throughout the cell cycle in
    ARH3-deficient cells; whether the persistent mark is itself toxic is
    disputed.

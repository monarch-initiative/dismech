      label: neuron
  notes: >-
    Conformance is declared to the axonal arm of
    `peripheral_axonal_degeneration` only. The module's demyelination arm
    (myelination and axon ensheathment DECREASED, Schwann cell) is deliberately
    NOT copied here: every published nerve conduction study in this disorder
    describes an axonal process, and no demyelinating neuropathy has been
    reported, so importing those module bindings would assert something the
    literature contradicts. No biological-process binding is copied: the
    module's remaining process, neuron apoptotic process, refers to neuronal
    soma death and is not established by evidence of distal axonal loss alone;
    no sufficiently specific axonal-degeneration GO process was verified for
    this node.
  evidence:
  - reference: PMID:30401461
    reference_title: "Bi-allelic ADPRHL2 Mutations Cause Neurodegeneration with Developmental Delay, Ataxia, and Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "key clinical features including developmental delay or regression, seizures, ataxia, and axonal (sensori-)motor neuropathy"
    explanation: Names axonal sensorimotor neuropathy as one of the four core features of the second founding cohort.
  - reference: PMID:38365196
    reference_title: "Delineation of ADPRHL2 Variants: Report of Two New Patients with Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "regression (28/43; 60.4%), axonal polyneuropathy (9/23; 39.1%)"
    explanation: Quantifies the neuropathy among pooled patients who underwent electrophysiological testing.
  - reference: PMID:34479984
    reference_title: "Biallelic ADPRHL2 mutations in complex neuropathy affect ADP ribosylation and DNA damage response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we present two families with a neuropathy predominant disorder and homozygous mutations in ADPRHL2"
    explanation: Documents a neuropathy-predominant pole of the ADPRS spectrum, in which peripheral nerve rather than the cerebellum is the leading site of disease.
  downstream:
  - target: Peripheral axonal neuropathy
    description: >-
      The tissue-level axonal degeneration is measured clinically as a
      length-dependent axonal sensorimotor neuropathy.
  - target: Muscle weakness
    description: >-
      Distal axonal loss contributes to the mixed central and peripheral muscle
      weakness reported in affected individuals.
  - target: Scoliosis
    description: >-
      Chronic weakness and neuropathy contribute to secondary spinal deformity
      in longer-surviving individuals.
  - target: Episodic Stepwise Neurological Deterioration
    description: >-
      Distal weakness and sensory loss add to the cumulative disability that
      defines the clinical course.
- name: Episodic Stepwise Neurological Deterioration
  biological_scale: ORGANISM
  description: >-
    The integrated clinical phenotype: not a smooth degenerative slope but a
    staircase, in which a febrile illness or other stressor produces an acute
    episode of ataxia, dystonia, seizures or encephalopathy from which recovery
    is partial. Between episodes the child may appear stable for months. The
    pattern explains two things that otherwise look contradictory in the
    literature - the frequent early misdiagnosis as episodic ataxia, an
    ion-channel disorder or an acute post-infectious cerebellitis, and the
    coexistence in the same disease of patients who die at 2 years and patients
    who reach 40. Whether variation in stressor exposure, residual ARH3 activity
    or another modifier explains that range remains unknown.
  evidence:
  - reference: PMID:33528672
    reference_title: "Episodic psychosis, ataxia, motor neuropathy with pyramidal signs (PAMP syndrome) caused by a novel mutation in ADPRHL2 (AHR3)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An index patient presented ataxia, postural tremor in the hands, and hallucinations at age 20 years, which had started after a viral infection."
    explanation: A worked example of a stress-precipitated episode, here in the adult-onset pole of the spectrum.
  - reference: PMID:33528672
    reference_title: "Episodic psychosis, ataxia, motor neuropathy with pyramidal signs (PAMP syndrome) caused by a novel mutation in ADPRHL2 (AHR3)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She had three more severe episodes in recent years, and her neurologic findings got progressively worse."
    explanation: "Documents the ratchet pattern directly: discrete episodes each followed by a worse baseline."
  - reference: PMID:35664652
    reference_title: "Child-Onset Cerebellar Ataxia Caused by Two Compound Heterozygous Variants in ADPRS Gene: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After a respiratory tract infection, a 30-month-old male patient presented with unsteady gait that rendered walking impossible without external help."
    explanation: Independent example of an infection-triggered acute loss of function in a young child.
  downstream:
  - target: Episodic ataxia
    description: >-
      Acute stress-associated episodes commonly manifest as episodic ataxia.
  - target: Seizures
    description: >-
      Seizures are a recurrent manifestation of the stress-associated
      neurological episodes.
  - target: Seizure precipitated by febrile infection
    description: >-
      An acute deterioration episode can manifest as a seizure during febrile
      infection.
  - target: Developmental regression
    description: >-
      Incomplete recovery after an episode is expressed as loss of previously
      acquired motor, language or swallowing skills.
  - target: Global developmental delay
    description: >-
      Repeated regression can leave a persistent global developmental deficit.
  - target: Dystonia
    description: >-
      Episodic dystonic posturing is a characteristic movement manifestation.
  - target: Psychosis
    description: >-
      At the adult-onset pole, stress-associated episodes may include psychosis.
  - target: Failure of Central Respiratory Control
    description: >-
      Repeated deterioration can culminate in central hypoventilation and
      respiratory failure, the most frequently reported route to death.
- name: Failure of Central Respiratory Control
  biological_scale: ORGANISM
  description: >-
    The usual terminal mechanism. Respiratory insufficiency in this disorder
    can be central rather than solely a consequence of neuromuscular weakness or
    aspiration: patients develop hypoventilation during sleep without infection,
    apnoeic episodes, and eventually require tracheostomy and long-term
    ventilation. Autonomic dysfunction - tachycardia, hypertension, abdominal
    distension and impaired sweating - can appear in the same phase. A brainstem
    substrate is clinically plausible but has not been demonstrated by pathology.
    Because a child can be alert and communicative on ventilatory support, this
    is the point where the disorder's management question becomes explicit
    rather than implicit.
  evidence:
  - reference: PMID:38365196
    reference_title: "Delineation of ADPRHL2 Variants: Report of Two New Patients with Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a neurodegenerative course complicated by central hypoventilation syndrome due to the same homozygous ADPRHL2 variant"
    explanation: Identifies central hypoventilation as a complication of the neurodegenerative course in two independently ascertained patients; the precise anatomical lesion was not demonstrated.
  - reference: PMID:39580621
    reference_title: "An ADPRS variant disrupts ARH3 stability and subcellular localization in children with neurodegeneration and respiratory failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two siblings with developmental delay, seizures, progressive muscle weakness, and respiratory failure following an episodic course"
    explanation: Independent sibling pair in whom respiratory failure is the defining late feature after an episodic course.
  downstream:
  - target: Central hypoventilation
    description: >-
      Central hypoventilation and respiratory failure are the direct clinical
      manifestations of failure of respiratory control.
  - target: Abnormality of the autonomic nervous system
    description: >-
      Autonomic manifestations can accompany respiratory deterioration,
      although their precise neuroanatomical substrate is unresolved.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_par_parthanatos_model
  hypothesis_label: Canonical PAR Accumulation and Parthanatos Model
  status: CANONICAL
  description: >-
    The model proposed by both 2018 founding papers and supported by the
    strongest chain of experimental evidence. Stress activates PARP1; ARH3
    deficiency prevents timely clearance of the resulting poly(ADP-ribose);
    PAR accumulates in nucleus and cytoplasm; free PAR triggers mitochondrial
    AIF release and caspase-independent parthanatos; repeated episodes of
    neuronal death produce the neurodegeneration. Its strongest support is that
    PARP inhibition rescues the phenotype in three independent systems - a
    Drosophila oxidative-challenge model, patient fibroblasts, and Arh3-knockout
    mice subjected to cerebral ischaemia-reperfusion. Its weakest link is that
    the human trigger, febrile illness, has never been shown to produce the
    proposed PAR burst in a patient.
  evidence:
  - reference: PMID:30100084
    reference_title: "Biallelic Mutations in ADPRHL2, Encoding ADP-Ribosylhydrolase 3, Lead to a Degenerative Pediatric Stress-Induced Epileptic Ataxia Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of the Drosophila paralog Parg showed lethality in response to oxidative challenge that was rescued by human ADPRHL2, suggesting functional conservation."
    explanation: Cross-species rescue supports functional conservation of the human protein in an oxidative-stress-response model.
  - reference: PMID:34019811
    reference_title: "Unrestrained poly-ADP-ribosylation provides insights into chromatin regulation and human disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we extend our findings to neurodegeneration, suggesting that patients with inherited ARH3 deficiency suffer from stress-induced pathogenic increase in PARylation that can be mitigated by PARP inhibition"
    explanation: The authors of the competing chromatin-scar arm converge on the PARylation model as the pathogenic one for patients, which is the main reason this group is marked CANONICAL.
- hypothesis_group_id: mar_chromatin_scar_transcriptional_model
  hypothesis_label: Mono(ADP-Ribose) Chromatin Scar and Transcriptional Deregulation Model
  status: ALTERNATIVE
  description: >-
    The alternative model. Because ARH3 is the only enzyme that can remove
    serine-linked mono(ADP-ribose), its loss leaves persistent ADP-ribose scars on
    core histones marking every recently repaired single-strand break. These
    scars suppress activating acetylation marks such as H3K9ac and deregulate
    transcription, and in post-mitotic neurons the effect would accumulate over
    years. This model has the attraction of explaining a chronic degenerative
    process without requiring a discrete death event, and it explains why the
    disorder is degenerative rather than purely episodic. Its problem is that
    the same laboratory subsequently reported that persistent MARylation is well
    tolerated whereas PARylation is toxic, which argues that the scars are a
    marker rather than the injury.
  evidence:
  - reference: PMID:32636369
    reference_title: "Pathogenic ARH3 mutations result in ADP-ribose chromatin scars during DNA strand break repair."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Collectively, these data indicate that ARH3 can act as an eraser of ADP-ribose chromatin scars at sites of PARP activity during DNA single-strand break repair."
    explanation: States the model's central claim, that ARH3's disease-relevant job is erasing chromatin scars at repaired breaks.
  - reference: PMID:34019811
    reference_title: "Unrestrained poly-ADP-ribosylation provides insights into chromatin regulation and human disease."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "endogenous MARylation persists on chromatin throughout the cell cycle, including mitosis, and is surprisingly well tolerated"
    explanation: Direct experimental argument against the mono(ADP-ribose) scar being the toxic species, which is why this model is recorded as ALTERNATIVE rather than as a second canonical arm.
genetic:
- name: ADPRS
  association: Bi-allelic inactivating variants (missense, nonsense, frameshift and splice), all converging on loss of ARH3 protein or activity
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: ADPRS
    term:
      id: hgnc:21304
      label: ADPRS
  notes: >-
    Nomenclature. HGNC:21304 is the current symbol ADPRS (ADP-ribosylserine
    hydrolase), verified with OAK on 2026-08-01. The former symbol ADPRHL2 is
    used by the MONDO definition, by both 2018 founding papers and by most case
    reports; ARH3 is the protein name used by the biochemical literature; two
    further typographical variants circulate - ADPRLH2 in the abstract of
    PMID:35664652 ("ADP-ribosylhydrolase-like 2 (ADPRS or ADPRLH2; OMIM:
    610624)") and AHR3 in the title of PMID:33528672. The gene MIM number is 610624 and the phenotype
    MIM number is 618170; a source citing "ADPRHL2 (OMIM: 618170)" as a gene
    identifier, as PMID:32746785 does, has conflated the two.

    Reference transcript. NM_017825.2 and NM_017825.3 are both used in the
    literature; variant coordinates below are as published.

    Allelic spectrum, with the caveat that it is drawn from a clinically
    ascertained, consanguinity-enriched series. In the 47-patient review,
    homozygous genotypes accounted for 45 of the reported patients and only
    two compound heterozygotes had been described at that point; further
    compound heterozygotes have since been reported (PMID:35664652,
    PMID:35222245, PMID:42015965). Missense variants were the commonest class
    (about half), followed by nonsense and frameshift. Exon 6 carried roughly
    half of the homozygous variants and exon 2 the recurrent Turkish allele.

    Named alleles with published functional data: p.Thr79Pro (recurrent, at
    least seven patients from unrelated Turkish families, protein
    destabilisation on expression in E. coli); p.Cys26Phe (protein instability
    and reduced function, PMID:34479984); p.Val335Gly (mild loss of expression
    with retained enzymatic activity but altered cytosolic/nuclear localisation
    and elevated nuclear ADP-ribosylation under stress, PMID:34479984);
    p.His182Arg (active-site residue; instability, degradation, and failure of
    nuclear localisation, PMID:39580621); p.Ala280Thr (no detectable protein on
    western blot, PMID:33528672); p.Leu162Pro in trans to p.Gln106* (severe
    reduction of protein with defective ADP-ribosylation removal,
    PMID:42015965); c.580C>T p.Gln194Ter with c.803-1G>A (nonsense-mediated
    decay plus intron 5 retention, PMID:35664652).

    A correction that should not be silently propagated. PMID:38365196 writes the
    recurrent Turkish allele as "c.235A > C" in its case descriptions and as
    "c.235C > A" in its discussion, for the same protein change p.(Thr79Pro).
    Threonine 79 is encoded ACG, and proline requires CCG, so the change must be
    c.235A>C; the "c.235C>A" spelling in that paper is an error. This entry uses
    c.235A>C.

    Not asserted, deliberately. No gnomAD constraint metric (pLI, o/e LoF,
    missense Z) and no carrier frequency is recorded anywhere in this entry:
    cached sources do not provide them and they were not looked up, so writing them
    would be unverifiable. No ClinGen gene-disease validity classification is
    quoted because the ClinGen data payload is absent from this checkout. No
    genotype-phenotype correlation is asserted beyond the observation, made
    explicitly by PMID:38365196, that the current data are insufficient to
    establish one; the suggestion in that paper that exon 2 missense alleles
    have earlier onset than exon 6 alleles rests on seven versus twelve patients
    and the authors themselves warn it may be misleading.
  evidence:
  - reference: PMID:30401461
    reference_title: "Bi-allelic ADPRHL2 Mutations Cause Neurodegeneration with Developmental Delay, Ataxia, and Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used exome sequencing to identify five different bi-allelic pathogenic ADPRHL2 variants in 12 individuals from 8 families"
    explanation: Establishes allelic heterogeneity at the locus in the second founding cohort.
  - reference: PMID:34479984
    reference_title: "Biallelic ADPRHL2 mutations in complex neuropathy affect ADP ribosylation and DNA damage response."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We characterized a novel C26F mutation, demonstrating protein instability and reduced protein function. Characterization of the recurrent V335G mutant demonstrated mild loss of expression with retained enzymatic activity."
    explanation: Documents two mechanistically distinct missense classes at this locus, one destabilising and one that preserves catalysis but mislocalises the enzyme.
  - reference: PMID:35664652
    reference_title: "Child-Onset Cerebellar Ataxia Caused by Two Compound Heterozygous Variants in ADPRS Gene: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified two novel compound heterozygous ADPRS variants: NM_017825.3:c.580C>T (p.Gln194Ter) and NM_017825.3:c.803-1G>A"
    explanation: Documents a compound heterozygous genotype with the reference transcript, in a locus whose published genotypes are overwhelmingly homozygous.
  - reference: PMID:35664652
    reference_title: "Child-Onset Cerebellar Ataxia Caused by Two Compound Heterozygous Variants in ADPRS Gene: A Case Report."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RNA sequencing indicated that the former mutation might cause nonsense-mediated mRNA decay. The c.803-1G>A variant was found to be a splice-site mutation that leads to the transcriptional retention of intron 5."
    explanation: Transcript-level characterisation showing that both alleles abolish normal product, which is the loss-of-function mechanism this locus requires.
phenotypes:
- name: Ataxia
  category: Neurologic
  diagnostic: true
  description: >-
    Ataxia is one of the two features named in the disorder's title and is a
    common reason affected children reach a neurologist. It may be episodic at
    first - discrete bouts of unsteadiness after a febrile illness, indistinguishable
    from an episodic ataxia or a post-infectious cerebellitis - and then becomes
    fixed and progressive, with truncal and appendicular components and a
    spastic-ataxic gait as pyramidal signs accumulate.
  phenotype_term:
    preferred_term: Ataxia
    term:
      id: HP:0001251
      label: Ataxia
  notes: >-
    No FrequencyEnum band is asserted, and the reason is a genuine disagreement
    between sources rather than caution for its own sake. HPO annotation for
    OMIM:618170 records HP:0001251 at 11/11 in the Danhauser cohort
    (PMID:30401461, retrieved 2026-08-01), which would be OBLIGATE. The pooled
    47-patient review records episodic or non-episodic ataxia in 17/47 (36.1%),
    which would be FREQUENT, because its denominator is every published patient
    including those for whom the datum could not be extracted. Those two numbers
    are not reconcilable into one band, so none is given.
  evidence:
  - reference: PMID:30401461
    reference_title: "Bi-allelic ADPRHL2 Mutations Cause Neurodegeneration with Developmental Delay, Ataxia, and Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "key clinical features including developmental delay or regression, seizures, ataxia, and axonal (sensori-)motor neuropathy"
    explanation: Names ataxia as one of the four core clinical features of the disorder.
- name: Episodic ataxia
  category: Neurologic
  diagnostic: true
  description: >-
    The episodic form of the ataxia is the most diagnostically useful single
    observation in the disorder, because it is what makes a clinician think of a
    channelopathy or a metabolic decompensation rather than a degenerative
    disease, and because it is the clinical read-out of the stress-conditional
    biochemistry. Episodes follow infection, fever or other stress, last days to
    weeks, and remit incompletely.
  phenotype_term:
    preferred_term: Episodic ataxia
    term:
      id: HP:0002131
      label: Episodic ataxia
  notes: >-
    Recorded as a separate phenotype from generalised ataxia deliberately: the
    two carry different diagnostic weight and different mechanistic
    implications, and a child may pass from one to the other. The HPO
    annotation set for OMIM:618170 does not include HP:0002131; this phenotype
    is curated from the primary reports.
  evidence:
  - reference: PMID:40493129
    reference_title: "Phenotypic Diversity in Stress-induced Childhood-Onset Neurodegeneration with Variable Ataxia and Seizures: Novel Associations with Parkinsonism, Icthyosis and Cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "presented with infection-triggered episodic ataxia and ichthyosis"
    explanation: Direct description of infection-triggered episodic ataxia as the presenting phenotype.
  - reference: PMID:38365196
    reference_title: "Delineation of ADPRHL2 Variants: Report of Two New Patients with Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ADPRHL2 variants should be considered in the context of episodic, stress-induced pediatric and adult-onset movement disorders and seizures."
    explanation: The systematic review's own diagnostic recommendation, which is built on the episodic stress-induced pattern.
- name: Seizures
  category: Neurologic
  diagnostic: true
  description: >-
    Seizures are the second feature named in the disorder's title. Bilateral
    tonic-clonic seizures predominate; absence and multifocal seizures are also
    recorded. Seizures are frequently the presenting event and can be febrile
    in the first instance, which contributes to the initial
    misclassification as simple febrile convulsions.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  notes: >-
    No frequency band is asserted because the best available source contradicts
    itself: Table 1 of PMID:38365196 reports seizure as a presenting symptom in
    16/47 (34%) but as a clinical symptom in only 11/47 (23.4%), which cannot
    both be complete counts. HPO annotation for OMIM:618170 (retrieved
    2026-08-01) records HP:0002069 bilateral tonic-clonic seizure at 13/16 and
    HP:0002121 absence seizure at 3/16 in the Ghosh cohort, and HP:0001250
    seizure at 6/11 in the Danhauser cohort. The broad seizure term is bound
    because the quoted disease-level evidence does not isolate one semiology;
    the narrower cohort observations remain documented here as context.
  evidence:
  - reference: PMID:30100084
    reference_title: "Biallelic Mutations in ADPRHL2, Encoding ADP-Ribosylhydrolase 3, Lead to a Degenerative Pediatric Stress-Induced Epileptic Ataxia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "developmental regression, and seizures in association with periods of stress, such as infections"
    explanation: Establishes seizures as a core feature and ties their occurrence to stress episodes.
- name: Seizure precipitated by febrile infection
  category: Neurologic
  diagnostic: true
  description: >-
    The specific link between fever and seizure activity is worth recording
    separately from seizures in general, because it is the phenotype most likely
    to be dismissed. A first febrile seizure in a toddler is common and usually
    benign; in this disorder it can be the opening event of a neurodegenerative
    illness, and the discriminator is what happens next - failure to return to
    the previous baseline over the following weeks.
  phenotype_term:
    preferred_term: Seizure precipitated by febrile infection
    term:
      id: HP:0032894
      label: Seizure precipitated by febrile infection
  notes: >-
    HP:0032894 was chosen over the clinical-modifier term HP:0025215 "Triggered
    by febrile illness", which was verified with OAK to sit under HP:0012823
    Clinical modifier rather than under HP:0000118 Phenotypic abnormality and
    therefore cannot be bound as a phenotype term in this schema.
    Case 2 of PMID:38365196 illustrates the pattern: a generalised seizure with
    fever at 2 years 7 months, followed within three weeks by loss of walking,
    speech and swallowing.
  evidence:
  - reference: PMID:38365196
    reference_title: "Delineation of ADPRHL2 Variants: Report of Two New Patients with Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "she had a generalized seizure with fever, lasting for 1 minute, and she gradually lost the ability to walk, speak, and swallow within the following 3 weeks"
    explanation: >-
      Case 2 of this report: a febrile generalised seizure is the presenting
      event, and the loss of walking, speech and swallowing over the following
      three weeks shows that the child did not return to her previous baseline.
      That combination is the claim - seizure precipitated by febrile infection
      as the opening event of a neurodegenerative course - rather than a benign
      febrile seizure.
- name: Developmental regression
  category: Neurologic
  diagnostic: true
  frequency: FREQUENT
  description: >-
    Loss of previously acquired motor, language and swallowing skills, typically
    in the aftermath of a stress episode, is the feature that converts a picture
    of episodic ataxia into a picture of neurodegeneration. It is the single most
    useful clinical discriminator against the benign mimics.
  phenotype_term:
    preferred_term: Developmental regression
    term:
      id: HP:0002376
      label: Developmental regression
  notes: >-
    The FREQUENT band (30-79%) is supported by the pooled figure of 60.4%
    quoted below. The numerator printed alongside that percentage in the
    abstract of PMID:38365196 ("28/43") is inconsistent with both the percentage
    and Table 1 of the same paper (26/43); the percentage is used. HPO
    annotation for OMIM:618170 records HP:0002376 at 10/16 in the Ghosh cohort
    (retrieved 2026-08-01), which is concordant.
  evidence:
  - reference: PMID:38365196
    reference_title: "Delineation of ADPRHL2 Variants: Report of Two New Patients with Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Triggering factors (28/47; 59.5%) and regression (28/43; 60.4%)"
    explanation: Provides the pooled frequency of developmental regression that supports the FREQUENT band.
  - reference: PMID:32746785
    reference_title: "Novel imaging and clinical phenotypes of CONDSIAS disorder caused by a homozygous frameshift variant of ADPRHL2: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over time, she developed complete motor and speech regression, bilateral sensorineural hearing loss, infrequent seizures, abdominal distension and gastrointestinal (GI) intolerance, and loss of consciousness."
    explanation: A worked individual example of complete motor and speech regression following the episodic course.
- name: Global developmental delay
  category: Neurologic
  description: >-
    Pre-existing developmental delay, often confined to expressive language, is
    present in a minority before the first episode; global delay becomes
    apparent in most patients as regression accumulates. A normal early
    developmental history is common and must not be used to exclude the
    diagnosis.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  notes: >-
    HPO annotation for OMIM:618170 records HP:0001263 at 10/12 in the Danhauser
    cohort (retrieved 2026-08-01). No band is asserted here because that
    denominator is one cohort and the pooled review separates pre-existing delay
    (16.2%) from regression (60.4%) in a way that cannot be recombined into a
    single frequency for this term.
  evidence:
  - reference: PMID:30401461
    reference_title: "Bi-allelic ADPRHL2 Mutations Cause Neurodegeneration with Developmental Delay, Ataxia, and Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a neurodegenerative disorder manifesting in childhood or adolescence with key clinical features including developmental delay or regression"
    explanation: Names developmental delay, alongside regression, as a core feature of the disorder.
- name: Cerebellar atrophy
  category: Neurologic
  frequency: FREQUENT
  description: >-
    Cerebellar atrophy, often with disproportionate involvement of the vermis, is
    the characteristic imaging finding and correlates with regional
    hypometabolism on FDG PET. It is acquired and progressive, and can be absent
    on an early scan.
  phenotype_term:
    preferred_term: Cerebellar atrophy
    term:
      id: HP:0001272
      label: Cerebellar atrophy
  notes: >-
    The FREQUENT band is based on the HPO annotation for OMIM:618170, which
    records HP:0001272 at 4/9 in the Ghosh cohort (retrieved 2026-08-01). The
    pooled 77.7% (28/36) figure quoted below combines cerebral and cerebellar
    atrophy with white matter change and therefore is not used to quantify
    cerebellar atrophy alone. The same HPO annotation records HP:0006855
    cerebellar vermis atrophy at 2/9.
  evidence:

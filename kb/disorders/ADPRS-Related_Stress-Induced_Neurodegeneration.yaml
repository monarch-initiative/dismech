- name: Failure of Poly(ADP-Ribose) Turnover under Stress
  biological_scale: MOLECULAR
  description: >-
    The acute arm. Oxidative and genotoxic stress activates PARP1, which
    accounts for the great majority of cellular ADP-ribosylation after DNA
    damage and builds long poly(ADP-ribose) chains within seconds. In a normal
    cell PARG and ARH3 together dismantle those chains on a timescale of
    minutes. An ARH3-deficient cell has only PARG, and the result is a larger and
    longer-lasting PAR burst in both the nucleus and the cytoplasm. This is the
    step at which the disorder becomes stress-conditional: basal ADP-ribosylation
    in ARH3-deficient cells can be close to normal, and the abnormality appears
    when the system is loaded. Patient fibroblasts show reduced viability on
    hydrogen peroxide challenge, and Arh3-knockout cells show PARP1 activation
    with increased nuclear and then cytoplasmic PAR.

- name: Deregulated Histone Acetylation and Transcription
  biological_scale: CELLULAR
  description: >-
    ARH3-deficient patient cells show reduced endogenous levels of activating
    chromatin modifications, most clearly H3K9 acetylation, and measurable
    deregulation of transcription. The causal direction was tested rather than
    assumed: prolonged PARP inhibition removes the scars and restores acetylation
    to normal, so the acetylation deficit is a consequence of the retained
    ADP-ribose and not an independent abnormality. In a long-lived post-mitotic
    neuron, which cannot dilute chromatin marks by division, a slowly
    accumulating transcriptional deficit of this kind is an attractive
    explanation for degeneration that appears only after years of normal
    function - but the link from this cellular phenotype to human
    neurodegeneration has not been demonstrated in neurons or in patient tissue.

    term:
      id: MONDO:0008840
      label: ataxia telangiectasia
  description: >-
    The prototype DNA-damage-response ataxia and the diagnosis most likely to be
    considered first in a young child with progressive ataxia and oculomotor
    abnormalities. It is both a clinical mimic and a mechanistic neighbour: ATM
    is the apex kinase of the double-strand-break response, whereas ADPRS acts on
    the ADP-ribosylation arm of the single-strand-break response, so the two
    disorders illustrate that lesions at different points of DNA-damage signalling
    converge on cerebellar degeneration.
  distinguishing_features:
  - Oculocutaneous telangiectasia, elevated alpha-fetoprotein, immunodeficiency and lymphoid malignancy risk are characteristic of ataxia telangiectasia and are not reported in ADPRS deficiency.
  - The ADPRS course is punctuated by discrete stress-triggered episodes with incomplete recovery, whereas ataxia telangiectasia progresses steadily without febrile precipitants.
  - Seizures are a core feature of ADPRS deficiency and are not typical of ataxia telangiectasia.
  - Central hypoventilation as a terminal event is characteristic of ADPRS deficiency; respiratory disease in ataxia telangiectasia is infective and aspiration-related.
  notes: >-
    MONDO:0008840 was verified with OAK, which returns `RO:0004003 HGNC:795 !
    ATM` and `xref: OMIM:208900`, and it matches the disease_term already bound
    in kb/disorders/Ataxia_Telangiectasia.yaml. No content was copied from that
    entry. No evidence item is attached because the contrast is a reasoned
    clinical comparison rather than a quotable finding.
- name: Ataxia with oculomotor apraxia type 1
  disease_term:
    preferred_term: ataxia, early-onset, with oculomotor apraxia and hypoalbuminemia
    term:
      id: MONDO:0008842
      label: ataxia, early-onset, with oculomotor apraxia and hypoalbuminemia
  description: >-
    Aprataxin deficiency is the closest mechanistic differential in the whole
    list. Aprataxin resolves abortive DNA ligation intermediates at
    single-strand breaks, the same repair pathway whose ADP-ribosylation
    signalling ARH3 terminates, and it produces childhood-onset cerebellar
    ataxia with oculomotor apraxia and axonal sensorimotor neuropathy - the same
    triad that ADPRS deficiency can produce.
  distinguishing_features:
  - Hypoalbuminaemia and hypercholesterolaemia are characteristic biochemical markers of aprataxin deficiency and are not features of ADPRS deficiency.
  - Aprataxin deficiency progresses steadily without stress-triggered episodic deterioration, which is the ADPRS signature.
  - Seizures, developmental regression and central hypoventilation are features of ADPRS deficiency and not of aprataxin deficiency.
  notes: >-
    MONDO:0008842 was verified with OAK, which returns `RO:0004003 HGNC:15984 !
    APTX` and `xref: OMIM:208920`. No evidence item is attached; the contrast is
    reasoned rather than quoted.
- name: Ataxia with oculomotor apraxia type 4
  disease_term:
    preferred_term: ataxia - oculomotor apraxia type 4
    term:
      id: MONDO:0014557
      label: ataxia - oculomotor apraxia type 4
  description: >-
    PNKP deficiency, another single-strand-break repair ataxia, with
    childhood-onset ataxia, oculomotor apraxia, axonal neuropathy and, unlike
    aprataxin deficiency, prominent dystonia and seizures. Of all the DNA-repair
    ataxias it is the one whose clinical picture overlaps ADPRS deficiency most
    closely, because it too combines a movement disorder with epilepsy.
  distinguishing_features:
  - PNKP disease produces a continuous rather than a stress-triggered episodic course; the febrile precipitant is the ADPRS discriminator.
  - Microcephaly is characteristic of the severe end of the PNKP spectrum (the allelic MCSZ phenotype) and is a minority finding in ADPRS deficiency.
  - Elevated alpha-fetoprotein and hypoalbuminaemia are variably reported in PNKP disease and are not features of ADPRS deficiency.
  notes: >-
    MONDO:0014557 was verified with OAK, which returns `RO:0004003 HGNC:9154 !
    PNKP` and `xref: OMIM:616267`. The allelic PNKP phenotype MCSZ
    (MONDO:0013254, microcephaly, seizures, and developmental delay) was also
    verified but is not curated as a separate differential. No evidence item is
    attached.
- name: Spinocerebellar ataxia, autosomal recessive, with axonal neuropathy 1
  disease_term:
    preferred_term: spinocerebellar ataxia, autosomal recessive, with axonal neuropathy 1
    term:
      id: MONDO:0011801
      label: spinocerebellar ataxia, autosomal recessive, with axonal neuropathy 1
  description: >-
    SCAN1, caused by TDP1 deficiency, completes the single-strand-break repair
    ataxia group. TDP1 removes trapped topoisomerase 1 adducts from DNA ends, the
    lesion immediately upstream of the repair step whose ADP-ribosylation
    signalling ARH3 terminates. It presents as cerebellar ataxia with a severe
    axonal sensorimotor neuropathy and distal wasting.
  distinguishing_features:
  - SCAN1 is not epileptic and has no stress-triggered episodic component.
  - Hypoalbuminaemia and hypercholesterolaemia occur in SCAN1 as in aprataxin deficiency, and are absent in ADPRS deficiency.
  notes: >-
    MONDO:0011801 was verified with OAK, which returns `RO:0004003 HGNC:18884 !
    TDP1` and `xref: OMIM:607250`. No evidence item is attached; this
    differential is included for mechanistic completeness of the
    single-strand-break repair group rather than because it is a likely clinical
    confusion.
- name: Biotin-responsive basal ganglia disease
  disease_term:
    preferred_term: biotin-responsive basal ganglia disease
    term:
      id: MONDO:0011841
      label: biotin-responsive basal ganglia disease
  description: >-
    An important treatable differential. SLC19A3 deficiency can present with a
    closely overlapping bedside picture - a young child who becomes acutely
    encephalopathic, dystonic and ataxic during a febrile illness, with partial
    recovery and stepwise decline - but has an established disease-specific
    biotin and thiamine treatment. This entry does not make an empiric-treatment
    recommendation; clinicians should follow current SLC19A3 guidance.
  distinguishing_features:
  - MRI in SLC19A3 deficiency shows bilateral symmetric caudate and putaminal signal change with swelling; ADPRS deficiency shows cerebral and cerebellar atrophy with white matter change and no basal ganglia predilection.
  - SLC19A3 deficiency responds to high-dose biotin and thiamine, sometimes within days; no such response is established for ADPRS deficiency.
  - Axonal sensorimotor polyneuropathy and central hypoventilation are features of ADPRS deficiency and not of SLC19A3 deficiency.
  notes: >-
    MONDO:0011841 was verified with OAK, which returns `RO:0004003 HGNC:16266 !
    SLC19A3` and `xref: OMIM:607483`. This differential is also relevant to the
    treatment section: PMID:40493129 reports two ADPRS patients who "responded
    favourably to treatment with high-dose vitamin supplementation", an
    uncontrolled observation whose interpretation is complicated by exactly this
    overlap. No evidence item is attached to the differential itself.
- name: Episodic ataxia type 2
  disease_term:
    preferred_term: episodic ataxia type 2
    term:
      id: MONDO:0007163
      label: episodic ataxia type 2
  description: >-
    The commonest clinical misdiagnosis at first presentation. CACNA1A-related
    episodic ataxia produces exactly the picture of a child with discrete attacks
    of ataxia precipitated by stress, exertion or intercurrent illness, and it is
    what the paediatric neurologist will think of first.
  distinguishing_features:
  - Episodic ataxia type 2 is autosomal dominant with an affected parent in most families; ADPRS deficiency is recessive and typically arises in a consanguineous family with unaffected parents.
  - Episodic ataxia type 2 responds to acetazolamide and 4-aminopyridine; ADPRS deficiency does not.
  - Between attacks, episodic ataxia type 2 patients recover to baseline apart from slowly progressive interictal ataxia; in ADPRS deficiency each episode leaves a lower baseline, with regression, seizures and neuropathy accumulating.
  - Axonal neuropathy, developmental regression and central hypoventilation do not occur in episodic ataxia type 2.
  notes: >-
    MONDO:0007163 was verified with OAK; the local adapter records no
    RO:0004003 gene relationship for this term, but its MONDO synonym list
    includes "CACNA1A hereditary episodic ataxia" and hgnc:1388 was
    independently confirmed as CACNA1A. Both facts were checked rather than
    recalled. No evidence item is attached.
- name: Encephalopathy due to GLUT1 deficiency
  disease_term:
    preferred_term: encephalopathy due to GLUT1 deficiency
    term:
      id: MONDO:0011724
      label: encephalopathy due to GLUT1 deficiency
  description: >-
    Another treatable mimic that is explicitly listed in the differential
    considered by clinicians who later diagnosed ADPRS deficiency. GLUT1
    deficiency produces early-onset epilepsy with paroxysmal exercise-induced
    dyskinesia and ataxia, with symptoms characteristically worse before meals
    and after exertion, and responds to a ketogenic diet.
  distinguishing_features:
  - A low cerebrospinal fluid glucose with a low CSF-to-blood glucose ratio is diagnostic of GLUT1 deficiency and is normal in ADPRS deficiency.
  - GLUT1 deficiency symptoms are precipitated by fasting and exertion and improve after eating; ADPRS episodes are precipitated by febrile illness and infection.
  - GLUT1 deficiency responds to a ketogenic diet; no dietary therapy is established for ADPRS deficiency.
  - Progressive cerebral and cerebellar atrophy and axonal neuropathy are features of ADPRS deficiency and not of GLUT1 deficiency.
  notes: >-
    MONDO:0011724 was verified with OAK, which returns `RO:0004003 HGNC:11005 !
    SLC2A1` and `xref: OMIM:606777`, matching the disease_term bound in
    kb/disorders/GLUT1_Deficiency_Syndrome.yaml. GLUT1 deficiency is named
    explicitly in the differential list considered for case 1 of PMID:38365196
    before the ADPRHL2 diagnosis was made. No evidence item is attached.
treatments:
- name: Multidisciplinary supportive care
  description: >-
    No disease-modifying therapy exists, and management is entirely supportive:
    developmental and educational support, physiotherapy for ataxia and
    spasticity, orthopaedic management of scoliosis and foot deformity,
    amplification for hearing loss, nutritional support and gastrostomy for
    dysphagia, and palliative-care involvement. The disorder's specific
    contribution to a supportive-care plan is anticipatory: the documented risk
    of respiratory failure may justify discussing ventilation preferences before
    a crisis, although no disorder-specific care guideline exists.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: BEHAVIORAL
  notes: >-
    Carried as a descriptor with no evidence item. No management guideline,
    natural-history study or treatment trial exists for this disorder, and the
    supportive measures listed are the standard-of-care response to the curated
    phenotypes rather than anything published for ADPRS deficiency. Attaching a
    snippet would be a claim/snippet mismatch.
- name: Ventilatory support and tracheostomy
  description: >-
    Long-term mechanical ventilation, usually via tracheostomy, has been used
    for central hypoventilation in reported patients. Individual case narratives
    describe regained consciousness and communication after ventilatory support,
    and a child who required tracheostomy at 2 years was sitting with truncal
    ataxia and walking with support a year later. These observations show
    survival with meaningful function in selected patients, but they do not
    establish comparative benefit or a disorder-specific ventilation threshold.
  treatment_term:
    preferred_term: mechanical ventilation
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Failure of Central Respiratory Control
    treatment_effect: RESTORES
    description: >-
      Mechanical ventilation restores gas exchange when central respiratory
      control is inadequate; it does not alter the neurodegenerative mechanism.
  notes: >-
    The clinical observations behind this recommendation - regained
    consciousness after ventilation, and the one-year follow-up of case 2 - are
    in the PDF-extracted full text of PMID:38365196, which carries ligature
    artefacts, so they are summarised here rather than quoted. The abstract's
    statement that the neurodegenerative course was "complicated by central
    hypoventilation syndrome" is quoted on the respiratory phenotype instead.
- name: Antiseizure medication
  description: >-
    Standard antiseizure medication for the tonic-clonic, absence and multifocal
    seizures. Levetiracetam and gabapentin have been used in reported patients,
    the latter for dyskinesia and spasticity as much as for seizures. There is no
    evidence that any particular agent is preferred in this disorder, and no
    evidence that seizure control alters the degenerative course.
  treatment_term:
    preferred_term: anticonvulsant therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Seizures
    treatment_effect: INHIBITS
    description: >-
      Antiseizure medication suppresses the symptomatic seizure manifestation
      without evidence that it alters neurodegeneration.
  notes: >-
    No evidence item is attached. The specific agents named are drawn from
    individual case narratives in the PDF-extracted full text of PMID:38365196
    rather than from any comparative study, and no publication addresses
    antiseizure drug choice in this disorder.
- name: PARP inhibition (investigational)
  description: >-
    The leading mechanistically rational disease-modifying strategy, with
    convergent preclinical support. If the disease is caused by an
    inability to clear PARP1-generated ADP-ribose, then reducing PARP1 output
    should rescue it, and it does - in a Drosophila oxidative-challenge model, in
    patient-derived fibroblasts, and in Arh3-knockout mice subjected to cerebral
    ischaemia-reperfusion. Prolonged PARP inhibition also clears the chromatin
    scars and restores histone acetylation in patient cells, so it addresses both
    proposed mechanisms. What is entirely absent is any human trial: no PARP
    inhibitor has been given to a patient with this disorder in a controlled
    setting, the licensed agents are oncology drugs with myelosuppressive
    toxicity and uncertain brain penetration, and the dose, timing (chronic
    prophylaxis versus treatment of an acute episode) and safety in a developing
    child are all unknown.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: poly(ADP-ribose) polymerase inhibitor
      term:
        id: NCIT:C62554
        label: Poly (ADP-Ribose) Polymerase Inhibitor
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Failure of Poly(ADP-Ribose) Turnover under Stress
    treatment_effect: INHIBITS
    description: >-
      PARP1 inhibition reduces the rate of ADP-ribose deposition, which
      compensates for the missing ARH3 removal step and keeps PAR below the
      threshold for parthanatos.
  evidence:
  - reference: PMID:30100084
    reference_title: "Biallelic Mutations in ADPRHL2, Encoding ADP-Ribosylhydrolase 3, Lead to a Degenerative Pediatric Stress-Induced Epileptic Ataxia Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Pharmacological inhibition of PARP also rescued the phenotype, suggesting the possibility of postnatal treatment for this genetic condition."
    explanation: The founding paper's own therapeutic proposal, based on rescue in the Drosophila model.
  - reference: PMID:30401461
    reference_title: "Bi-allelic ADPRHL2 Mutations Cause Neurodegeneration with Developmental Delay, Ataxia, and Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "it was rescued by expression of wild-type ADPRHL2 mRNA as well as treatment with a PARP1 inhibitor"
    explanation: Independent rescue of the stress-sensitivity phenotype in patient-derived fibroblasts by a PARP1 inhibitor.
  - reference: PMID:30830864
    reference_title: "PARP1 inhibition alleviates injury in ARH3-deficient mice and human cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "PARP1 inhibitors may attenuate the progression of neurodegeneration in affected patients with ARH3 deficiency."
    explanation: In vivo mouse evidence extended to an explicit therapeutic proposal for patients.
  - reference: PMID:36497109
    reference_title: "ARH Family of ADP-Ribose-Acceptor Hydrolases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Arh3-KO mice developed increased brain infarction following ischemia-reperfusion injury, which was reduced by PARP inhibitors."
    explanation: Summarises the in vivo brain-injury rescue that is the strongest organ-level evidence for this strategy. Classified OTHER because this is a review.
  notes: >-
    Deliberately not framed as an available treatment. No clinical trial of a
    PARP inhibitor in this disorder is registered to this curation's knowledge,
    and every supporting result is preclinical.
- name: Minocycline (off-label; rationale subsequently refuted)
  description: >-
    Minocycline was given off-label to at least one adult patient on the
    rationale that it acts as a PARP inhibitor and had shown benefit in the
    Drosophila model. That rationale has since been tested directly and does not
    hold: minocycline is a poor PARP1 inhibitor and had no effect on basal
    ADP-ribosylation in ARH3-deficient cells. This treatment is curated
    precisely because it is a negative result - it is the only instance in this
    disorder of a mechanistic hypothesis being taken to the bedside and then
    checked, and a curator or clinician reading only the 2024 report would
    conclude that a PARP-inhibitor treatment was available and reasonable.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: minocycline
      term:
        id: CHEBI:50694
        label: minocycline
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:37392332
    reference_title: "Expanding the Spectrum of Stress-Induced Childhood-Onset Neurodegeneration with Variable Ataxia and Seizures (CONDSIAS)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "we initiated experimental, off-label treatment with minocycline, a poly-ADP-polymerase (PARP) inhibitor, which has shown beneficial effects in a Drosophila fly model."
    explanation: Documents that minocycline was actually administered to a patient on a PARP-inhibition rationale. Marked PARTIAL because it reports an intention to treat and no outcome.
  - reference: PMID:42015965
    reference_title: "Novel ADPRS Missense Variant (p.Leu162Pro) Causes Stress-Induced Childhood-Onset Neurodegeneration With Ataxia and Seizures."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Our results using minocycline indicate that it is a poor PARP1 inhibitor and was ineffective in reducing basal ADP-ribosylation in ARH3-deficient cells."
    explanation: Direct experimental refutation of the molecular rationale for minocycline in this disorder.
  - reference: PMID:42015965
    reference_title: "Novel ADPRS Missense Variant (p.Leu162Pro) Causes Stress-Induced Childhood-Onset Neurodegeneration With Ataxia and Seizures."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "questioning the molecular rationale underlying the therapeutic use of minocycline in patients with CONDSIAS"
    explanation: The authors' own framing of their result as a challenge to the therapeutic rationale.
  notes: >-
    A separate off-label report proposed repurposing doxycycline, a related
    tetracycline, in a CONDSIAS patient (PMID:39417910, Acta Neurol Belg 2025).
    That reference was fetched and cached but its record contains only
    bibliographic metadata with no abstract, so nothing from it can be quoted
    and it is not curated as a treatment here. Given the minocycline result, any
    tetracycline-based PARP-inhibition rationale in this disorder should be
    treated as unsupported until tested directly.
- name: High-dose vitamin supplementation (uncontrolled)
  description: >-
    Two of three patients in one recent series were reported to respond
    favourably to high-dose vitamin supplementation. This is recorded because it
    is in the literature and a family may ask about it, not because it is
    supported. The observation is uncontrolled, the specific vitamins and doses
    are not extractable from the abstract, the third patient in the same series
    stabilised spontaneously without any intervention, and the natural history of
    this disorder includes spontaneous remission of episodes over weeks - all of
    which make a treatment effect impossible to separate from the disease's own
    fluctuation. There is also a confounder specific to this differential:
    high-dose biotin and thiamine are the established treatment for
    biotin-responsive basal ganglia disease, the closest treatable mimic.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:40493129
    reference_title: "Phenotypic Diversity in Stress-induced Childhood-Onset Neurodegeneration with Variable Ataxia and Seizures: Novel Associations with Parkinsonism, Icthyosis and Cataract."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients 2 and 3 responded favourably to treatment with high-dose vitamin supplementation, while patient 1 showed stable disease progression without specific therapeutic intervention, suggesting spontaneous stabilization of her condition."
    explanation: >-
      Marked PARTIAL rather than SUPPORT. The same sentence that reports the
      response also reports spontaneous stabilisation in an untreated patient,
      which is the source's own evidence that the disorder can stabilise without
      treatment and therefore that this uncontrolled observation cannot
      establish efficacy.
  notes: >-
    No `therapeutic_agent` is bound because the abstract does not name the
    vitamins or the doses, and guessing at biotin or thiamine on the basis of
    the SLC19A3 analogy would be fabrication.
- name: Avoidance and prompt management of physiological stressors
  description: >-
    The one intervention that follows directly from the mechanism: if episodes
    are precipitated by febrile illness, infection, surgery and physical stress,
    then aggressive antipyresis, early treatment of infection, up-to-date
    vaccination, avoidance of unnecessary surgery and careful perioperative
    planning are rational. It is worth stating explicitly that this is a
    mechanistic inference and not an evidence-based recommendation: no study has
    tested whether preventing or shortening febrile episodes changes the
    trajectory, and it is entirely possible that the neurological damage is
    driven by cumulative subclinical stress rather than by the clinically
    obvious episodes.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: BEHAVIORAL
  notes: >-
    No evidence item is attached, deliberately. The premise - that stress
    triggers episodes - is evidenced in the `pathophysiology:` and
    `progression:` sections. The inference that avoiding stress prevents damage
    is not evidenced anywhere and is flagged as an open question in the
    discussions section.
- name: Genetic counselling
  description: >-
    Autosomal recessive recurrence-risk counselling with carrier testing for the
    familial alleles. Particularly relevant here because most reported families
    are consanguineous, because affected siblings are common in the reported
    pedigrees (one family had nine affected members), and because the same
    genotype has produced very different courses within a family, so a sibling's
    prognosis cannot be read off the proband's.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  notes: >-
    No evidence item is attached. The recessive inheritance underpinning the
    recommendation is evidenced in the `inheritance:` block; the counselling
    recommendation itself is a clinical inference from that mode of inheritance
    rather than a published recommendation.
animal_models:
- species: Drosophila melanogaster
  genotype: Loss of the Drosophila Parg paralog, with human ADPRHL2 rescue
  category: Loss-of-function with cross-species rescue
  description: >-
    The model that established functional conservation and produced the first
    therapeutic lead. Loss of the fly Parg paralog causes lethality specifically
    in response to oxidative challenge - not at baseline - which reproduces the
    stress-conditional character of the human disease more faithfully than any
    other model. Two rescues were performed: expression of human ADPRHL2 rescued
    the lethality, establishing that the human protein performs the conserved
    function; and pharmacological PARP inhibition also rescued it, establishing
    that the lethality runs through PARP activity and is therefore druggable.

    An important limitation is in the model's own construction: the gene deleted
    is the Drosophila Parg paralog, not a fly orthologue of ADPRHL2, and
    Drosophila does not separate the PARG and ARH3 activities the way mammals
    do. The model therefore tests the pathway rather than the gene, and the
    rescue by human ADPRHL2 is what licenses reading it as a model of this
    disorder. It also has no nervous-system phenotype corresponding to ataxia,
    seizures or neuropathy - the read-out is organismal lethality.
  associated_phenotypes:
  - Lethality on oxidative challenge
  - Rescue by human ADPRHL2 expression
  - Rescue by pharmacological PARP inhibition
  evidence:
  - reference: PMID:30100084
    reference_title: "Biallelic Mutations in ADPRHL2, Encoding ADP-Ribosylhydrolase 3, Lead to a Degenerative Pediatric Stress-Induced Epileptic Ataxia Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of the Drosophila paralog Parg showed lethality in response to oxidative challenge that was rescued by human ADPRHL2, suggesting functional conservation."
    explanation: Describes the model, its stress-conditional phenotype and the cross-species rescue that validates it.
- species: Mus musculus
  genotype: Arh3 (Adprs) knockout
  category: Knockout
  description: >-
    Arh3-knockout mice are viable and do not spontaneously develop the human
    neurodegenerative phenotype, which is the central fact about this model and
    the reason it is used as a stress-challenge system rather than as a
    phenocopy. Subjected to cerebral ischaemia-reperfusion they show increased
    PAR accumulation, increased cell death and larger brain infarcts than
    wild-type animals, and both the injury and the infarct size are reduced by
    PARP inhibitors.

    The absence of a spontaneous phenotype is the key translational gap: the
    mouse tells us what ARH3 loss does when the animal is acutely injured, not
    what it does over years of ordinary life, and it is the latter that produces
    the human disease. This is recorded as a HUMAN_MODEL_MISMATCH discussion
    below rather than being glossed over. Whether Arh3-null mice have a cardiac
    phenotype was not established from any source read for this entry and no
    such claim is made here.
  associated_phenotypes:
  - Increased brain infarction after ischaemia-reperfusion, reduced by PARP inhibitors
  - Increased PAR accumulation and cell death under oxidative stress
  - No spontaneous neurodegenerative phenotype reported
  evidence:
  - reference: PMID:30830864
    reference_title: "PARP1 inhibition alleviates injury in ARH3-deficient mice and human cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the patient's fibroblasts and ARH3-deficient mice were more sensitive, respectively, to H2O2 stress and cerebral ischemia/reperfusion-induced PAR accumulation and cell death"
    explanation: Establishes the stress-challenge phenotype of the knockout mouse alongside the concordant patient-cell result.
  - reference: PMID:36497109
    reference_title: "ARH Family of ADP-Ribose-Acceptor Hydrolases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Arh3-KO mice developed increased brain infarction following ischemia-reperfusion injury, which was reduced by PARP inhibitors."
    explanation: States the brain-injury phenotype and its pharmacological rescue. Classified OTHER because this is a review.
discussions:
- discussion_id: adprs-fever-to-par-burst-unmeasured
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does a febrile illness actually produce the proposed PARP1 activation and
    poly(ADP-ribose) burst in a patient with ARH3 deficiency?
  rationale: >-
    This is the load-bearing unmeasured step of the whole model and the most
    important gap in the entry. The clinical observation that episodes follow
    fever is solid and replicated. The biochemistry that ARH3 loss impairs PAR
    clearance is solid. The bridge between them - that fever raises cellular
    oxidative or genotoxic burden enough to generate a pathogenic PAR burst - is
    entirely inferred. Every experimental stressor used in the literature is a
    surrogate: hydrogen peroxide, cerebral ischaemia-reperfusion, oxidative
    challenge in flies. None of these is fever, and the mechanisms by which a
    viral illness might raise neuronal ADP-ribosylation (systemic inflammation,
    raised temperature per se, metabolic demand, direct oxidative stress) have
    not been distinguished. The clinical stakes are direct: if fever acts
    through temperature, aggressive antipyresis is a treatment; if it acts
    through inflammatory signalling, antipyresis is irrelevant and
    anti-inflammatory or PARP-directed strategies are needed. Until this is
    resolved, the standard advice given to these families rests on an
    assumption.
  attaches_to:
  - "pathophysiology#Physiological Stressor"
  - "pathophysiology#Failure of Poly(ADP-Ribose) Turnover under Stress"
  proposed_experiments:
  - experiment_id: adprs-febrile-episode-par-biomarker
    name: Longitudinal ADP-ribosylation biomarker sampling through a febrile episode
    description: >-
      Serial peripheral blood mononuclear cell or skin-fibroblast sampling from
      consented patients before, during and after a natural febrile illness,
      assayed for mono- and poly-ADP-ribosylation by immunoblot and mass
      spectrometry, to test directly whether the proposed burst occurs and how
      its time course relates to the clinical episode.
  - experiment_id: adprs-fever-surrogate-dissection
    name: Dissection of fever surrogates in patient-derived neurons
    description: >-
      Expose patient iPSC-derived neurons to the separable components of a
      febrile illness - 40 degrees Celsius hyperthermia, interferon and IL-1
      beta inflammatory signalling, and metabolic loading - and measure
      ADP-ribosylation and viability for each, to identify which component is
      the operative trigger.
- discussion_id: adprs-mar-scar-versus-par-toxicity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the pathogenic species in ARH3 deficiency the persistent serine-linked
    mono(ADP-ribose) scar on chromatin, or the unrestrained poly(ADP-ribose)
    generated under stress?
  rationale: >-
    Two well-executed studies from overlapping groups give incompatible answers,
    and the answer determines what a therapy should do. PMID:32636369 shows that
    patient cells carry persistent mono(ADP-ribose) scars on core histones, that
    those scars suppress H3K9 acetylation and deregulate transcription, and that
    prolonged PARP inhibition removes them and restores acetylation - a chronic,
    stress-independent mechanism. PMID:34019811 then reports that persistent
    MARylation is well tolerated whereas persistent PARylation is highly toxic,
    and attributes patient disease to a stress-induced PARylation increase - an
    acute, stress-dependent mechanism. Both cannot be dominant. The distinction
    is not academic: a chronic scar mechanism argues for continuous low-dose
    PARP inhibition from diagnosis, whereas an acute PAR-toxicity mechanism
    argues for intermittent higher-dose intervention around stress episodes,
    which is a very different risk-benefit calculation in a child. It is also
    possible that both operate on different timescales, the scars producing the
    slow degenerative background and the PAR bursts producing the discrete
    episodes, which would explain the disorder's characteristic staircase
    course; no experiment has tested that synthesis.
  attaches_to:
  - "pathophysiology#Persistent Serine-Mono(ADP-Ribose) Chromatin Scars"
  - "pathophysiology#Deregulated Histone Acetylation and Transcription"
  - "pathophysiology#Failure of Poly(ADP-Ribose) Turnover under Stress"
  proposed_experiments:
  - experiment_id: adprs-neuronal-mar-par-separation
    name: Separation of MAR and PAR toxicity in post-mitotic neurons
    description: >-
      Compare ARH3-null, PARG-depleted and doubly perturbed human iPSC-derived
      neurons kept post-mitotic for months, measuring chromatin marks,
      transcriptome and survival, to determine whether the mono(ADP-ribose)
      scar becomes toxic on a neuronal timescale even though it is tolerated in
      dividing cells.
  - experiment_id: adprs-continuous-versus-pulsed-parp-inhibition
    name: Continuous versus stress-pulsed PARP inhibition in Arh3-knockout mice
    description: >-
      Compare continuous low-dose PARP inhibition against inhibition given only
      around an imposed stress challenge, in the same knockout cohort, using
      infarct size, neuronal survival and chromatin acetylation as endpoints, to
      establish which dosing logic the biology actually supports before any human
      trial is designed.
- discussion_id: adprs-no-chronic-model-of-the-disease
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does any available model reproduce chronic, spontaneous neurodegeneration
    from ARH3 loss, as opposed to acute injury after an imposed stressor?
  rationale: >-
    This is a model-fidelity problem rather than an absence of evidence, and it
    constrains everything that can be claimed about the disease. The Arh3
    knockout mouse is viable and has no reported spontaneous neurodegenerative
    phenotype; it becomes informative only when acutely injured by cerebral
    ischaemia-reperfusion. The Drosophila model deletes the Parg paralog rather
    than an ARH3 orthologue and reads out organismal lethality on oxidative
    challenge, with no ataxia, seizure or neuropathy phenotype. The patient
    material is dermal fibroblasts, a dividing cell type that can dilute
    chromatin marks by division and that has none of the properties - long axons,
    post-mitotic longevity, high oxidative metabolism - proposed to explain why
    neurons are the cells that die. So the two things the human disease actually
    consists of, chronic neurodegeneration and selective neuronal vulnerability,
    are the two things no model demonstrates. Every statement in this entry about
    why neurons fail is therefore inference from cell-type-general biology, and
    the entry marks those nodes accordingly.
  attaches_to:
  - "pathophysiology#Selective Neuronal Loss with Cerebellar and Cerebral Atrophy"
  - "pathophysiology#NAD+ Consumption and Bioenergetic Failure"
  proposed_experiments:
  - experiment_id: adprs-aged-knockout-mouse-phenotyping
    name: Longitudinal phenotyping of aged Arh3-knockout mice with repeated stress challenge
    description: >-
      Follow knockout and wild-type cohorts to old age with repeated sublethal
      inflammatory or hyperthermic challenges, with serial motor testing,
      cerebellar volumetry and nerve conduction, to test whether repeated stress
      rather than a single acute insult is what produces the degenerative
      phenotype.
  - experiment_id: adprs-patient-ipsc-cerebellar-organoids
    name: Patient iPSC-derived cerebellar organoids and motor neurons
    description: >-
      Derive cerebellar organoids and long-axon motor neurons from patients and
      from isogenic corrected controls, and measure ADP-ribosylation, chromatin
      acetylation, transcription and survival with and without stress, to test
      selective vulnerability in the affected cell types rather than in
      fibroblasts.
- discussion_id: adprs-neuropathology-absent
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the neuropathology of this disorder, and which neuronal populations
    are actually lost?
  rationale: >-
    The literature contains, as far as this curation can establish, exactly one
    neuropathological statement: that parthanatos was observed in neurons of a
    deceased sibling (PMID:30830864). There is no autopsy series, no regional
    quantification, no Purkinje cell count, no assessment of whether the white
    matter change on MRI is demyelination, gliosis or axonal loss, and no
    pathological localisation of the central respiratory-control failure,
    including whether brainstem respiratory nuclei are involved. Roughly 21 of
    the 47 published patients have died, so the material
    exists or existed. Without it, the imaging finding of cerebellar atrophy
    cannot be converted into a cellular mechanism, and this entry deliberately
    declines to bind Purkinje cells to the cerebellar node for that reason.
  attaches_to:
  - "pathophysiology#Selective Neuronal Loss with Cerebellar and Cerebral Atrophy"
  - "pathophysiology#AIF Release from Mitochondria and Parthanatos"
  - "pathophysiology#Failure of Central Respiratory Control"
  proposed_experiments:
  - experiment_id: adprs-brain-bank-autopsy-series
    name: Coordinated post-mortem neuropathology series
    description: >-
      Establish consented brain donation through the existing ADPRS family
      networks and examine regional neuronal loss, PAR and mono(ADP-ribose)
      immunohistochemistry, AIF localisation, white matter integrity and
      brainstem respiratory nuclei across several patients.
- discussion_id: adprs-does-stress-avoidance-help
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does preventing or shortening febrile episodes change the neurological
    trajectory, or is the damage driven by cumulative subclinical stress?
  rationale: >-
    Families are routinely advised to treat fever aggressively and avoid
    physical stress, and that advice is mechanistically reasonable, but it has
    never been tested and it may be wrong in an important way. A trigger was
    documented in only about 60% of published patients; the disorder still
    progresses in patients whose episodes are recognised and treated; and the
    persistent chromatin marks are reported at baseline in the alternative
    chromatin-scar model (PMID:32636369), although whether those marks are toxic
    is disputed. If
    most of the neuronal loss comes from ordinary background single-strand break
    repair rather than from the clinically visible crises, then stress avoidance
    is palliative rather than protective, and the burden it places on a family -
    school avoidance, activity restriction, anxiety around every viral illness -
    is being imposed without benefit. The question is answerable with existing
    patients and no new technology.
  attaches_to:
  - "pathophysiology#Physiological Stressor"
  - "pathophysiology#Episodic Stepwise Neurological Deterioration"
  proposed_experiments:
  - experiment_id: adprs-prospective-natural-history-registry
    name: Prospective international natural-history registry with episode diaries
    description: >-
      Enrol patients prospectively with structured recording of every febrile or
      stress event, its management, and standardised motor, cognitive and
      respiratory outcomes, to establish whether episode frequency and severity
      predict the rate of decline once genotype is accounted for. This would also
      supply the natural-history baseline that any future PARP-inhibitor trial
      will require and which does not currently exist.

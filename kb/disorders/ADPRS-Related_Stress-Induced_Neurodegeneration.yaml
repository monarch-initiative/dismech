- name: NAD+ Consumption and Bioenergetic Failure
  biological_scale: CELLULAR
  description: >-
    Each ADP-ribose transferred by PARP1 costs one NAD+. Unrestrained PARylation
    is therefore not only a signalling abnormality but a metabolic drain, and
    the normal turnover of PAR is part of how a cell restores its energy
    reservoir after a genotoxic insult. In an ARH3-deficient cell that restoration
    is impaired. This node is included because it is a standard and
    well-supported feature of PARP1 hyperactivation biology and because it offers
    a plausible reason why neurons - the most energy-demanding and least
    glycolytically flexible cells - are the ones that fail. It is marked
    HYPOTHETICAL for this disorder specifically: no measurement of NAD+ or of
    bioenergetic function has been published in ADPRS-deficient patient cells or
    tissue.

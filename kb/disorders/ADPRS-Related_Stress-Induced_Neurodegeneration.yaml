- name: Distal Axonal Degeneration of Peripheral Nerve
  biological_scale: TISSUE
  description: >-
    A length-dependent axonal, often sensorimotor, polyneuropathy is a core part
    of the phenotype and was prominent enough in one series that ADPRHL2
    homozygotes were identified in a cohort assembled for hereditary motor
    neuropathy rather than for neurodegeneration. Nerve conduction studies show
    axonal loss with relatively preserved conduction velocity; distal weakness,
    foot drop, pes cavus and hammer toes follow. The neuropathy is a genuine
    discriminator: it is what separates this disorder from the purely
    cerebellar ataxias in the differential, and its presence in a child with
    stress-triggered ataxia should redirect testing towards ADPRS.

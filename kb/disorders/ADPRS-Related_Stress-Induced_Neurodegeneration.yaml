diagnosis:
- name: Exome or genome sequencing with bi-allelic ADPRS variant interpretation
  description: >-
    Molecular diagnosis rests on identifying bi-allelic ADPRS variants against
    transcript NM_017825.2/NM_017825.3, and there are three interpretation
    points that follow from the published allelic spectrum. First, a
    conservative-looking missense change must not be dismissed: several of the
    best-characterised alleles are missense and abolish detectable protein.
    Second, the gene appears in older variant-call pipelines and databases under
    ADPRHL2, so a filter keyed on the current symbol alone can miss an existing
    annotation. Third, parental testing is required to establish that two
    variants are in trans, since heterozygotes are unaffected; and the historical
    predominance of homozygous genotypes reflects consanguineous ascertainment
    and must not be used as an argument against a compound heterozygous call.
  evidence:
  - reference: PMID:35664652
    reference_title: "Child-Onset Cerebellar Ataxia Caused by Two Compound Heterozygous Variants in ADPRS Gene: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified two novel compound heterozygous ADPRS variants: NM_017825.3:c.580C>T (p.Gln194Ter) and NM_017825.3:c.803-1G>A"
    explanation: Names the reference transcript a laboratory must use and documents that compound heterozygous genotypes occur.
  - reference: PMID:33528672
    reference_title: "Episodic psychosis, ataxia, motor neuropathy with pyramidal signs (PAMP syndrome) caused by a novel mutation in ADPRHL2 (AHR3)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Western blot analyses demonstrated that ADPRHL2 was not expressed in these patients."
    explanation: Supports the interpretive caution that a missense allele at this locus can behave as a complete null.
- name: Serial brain and spinal cord MRI
  description: >-
    Imaging serves two purposes and has one important pitfall. It documents the
    characteristic cerebral and cerebellar atrophy with white matter change and
    the spinal cord involvement, and repeated over time it demonstrates
    progression, which is what distinguishes this disorder from a static or
    post-infectious process. The pitfall is that in the pooled review 7 of the
    28 patients who ever had an abnormal MRI (25%) had a normal first scan and
    became abnormal only on follow-up, so a normal MRI during or shortly after
    a first episode does not exclude the diagnosis and should be repeated.
  notes: >-
    The normal-first-scan figure is not in the abstract and so is not carried by
    the snippet below. It comes from Table 1 of PMID:38365196, MRI findings
    block, row "Normal at first imaging study but abnormal during follow-up",
    which gives 7/28 (25) beneath "Abnormal 28/36 (77.7)". The running text of
    the same paper renders the numerator as n = 8 for the same 25%; 25% of 28 is
    7, so the table figure is used. That row is PDF-extracted text carrying a
    ligature in "first", which the reference validator does not fold, so it
    cannot be quoted as a snippet.
  evidence:
  - reference: PMID:38365196
    reference_title: "Delineation of ADPRHL2 Variants: Report of Two New Patients with Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cerebral and cerebellar atrophy with white matter changes (28/36; 77.7%) were the other clues"
    explanation: Establishes the imaging findings and their frequency among imaged patients.
- name: Nerve conduction studies and electromyography
  description: >-
    Electrophysiology looks for the axonal sensorimotor polyneuropathy, which is
    one of the most useful discriminators against the non-DNA-repair cerebellar
    ataxias and against the channelopathies. It was abnormal in the majority of
    the pooled patients tested, most often showing axonal polyneuropathy with or
    without sensory involvement.
  evidence:
  - reference: PMID:38365196
    reference_title: "Delineation of ADPRHL2 Variants: Report of Two New Patients with Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "regression (28/43; 60.4%), axonal polyneuropathy (9/23; 39.1%)"
    explanation: Quantifies the yield of electrophysiology among patients tested.
- name: Polysomnography and respiratory assessment
  description: >-
    Because central hypoventilation is a reported route to death and may first
    appear during sleep, sleep-time respiratory monitoring is a plausible
    surveillance measure. No study has established its yield, interval or effect
    on outcomes in this disorder.
  notes: >-
    No evidence item is attached. No published guideline, surveillance protocol
    or study of respiratory monitoring in this disorder exists; the
    recommendation is a clinical inference from the documented natural history
    (central hypoventilation as a cause of death, and sleep-onset
    hypoventilation without infection in case 2 of PMID:38365196). Attaching a
    snippet would misrepresent an inference as a published recommendation.

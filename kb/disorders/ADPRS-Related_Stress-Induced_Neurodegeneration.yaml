- name: AIF Release from Mitochondria and Parthanatos
  biological_scale: CELLULAR
  description: >-
    Parthanatos is a caspase-independent, PAR-dependent form of regulated cell
    death, and it is the effector step of the canonical model of this disorder.
    PARG liberates protein-free PAR from PARylated nuclear proteins; that free
    polymer reaches the cytoplasm and acts on mitochondria to release
    apoptosis-inducing factor, which translocates back to the nucleus and drives
    large-scale DNA cleavage. ARH3's protective role is to keep nuclear and
    cytoplasmic PAR below the threshold at which this happens, so ARH3 loss
    lowers the amount of stress needed to commit a cell to death. This is the
    node at which a transient febrile illness could plausibly convert into
    permanent neurological loss, and the ratchet-like clinical course - episodes
    followed by incomplete recovery - is what a threshold-crossing cell-death
    mechanism predicts.

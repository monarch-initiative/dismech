name: ADPRS-Related Stress-Induced Neurodegeneration
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and seizures
  term:
    id: MONDO:0100095
    label: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and seizures
description: >-
  Stress-induced childhood-onset neurodegeneration with variable ataxia and
  seizures (CONDSIAS) is an autosomal recessive neurodegenerative disorder
  caused by bi-allelic inactivating variants in ADPRS, the gene encoding
  ADP-ribosyl-acceptor hydrolase 3 (ARH3). ARH3 is the only human enzyme able
  to remove the terminal serine-linked mono(ADP-ribose) that PARP1/HPF1 deposits
  on chromatin at sites of DNA damage, and it acts in tandem with PARG to clear
  poly(ADP-ribose) from the nucleus, cytoplasm and mitochondrial matrix. Losing
  that eraser leaves the ADP-ribosylation arm of the DNA-damage response unable
  to switch itself off. The clinical signature that names the disorder follows
  directly from that: after normal or near-normal early development, affected
  children deteriorate in discrete steps precipitated by physiological stress -
  most characteristically febrile illness or infection, but also surgery,
  trauma, diarrhoea, exercise and cold-water immersion - with episodes of
  ataxia, dystonic posturing, seizures and developmental regression from which
  recovery is incomplete, so that the disorder ratchets downward rather than
  progressing smoothly. In the largest systematic review, covering 47 published
  patients from 12 articles, a triggering factor was documented in 59.5%
  (28/47), developmental regression in 60.4%, axonal polyneuropathy in 39.1%
  (9/23 tested), and cerebral and cerebellar atrophy with white matter change in
  77.7% (28/36 imaged); the fatality rate was 44.6% (21/47) at a median age of
  7 years. Respiratory failure and cardiopulmonary arrest are the main reported
  causes of death, and central hypoventilation is documented in some patients.
  The disorder is genuinely a spectrum: the same gene produces
  a lethal infantile-onset encephalopathy at one pole and, at the other,
  adults presenting in their twenties with episodic psychosis, ataxia and a
  motor neuropathy, or with an almost pure hereditary motor neuropathy. No
  disease-modifying therapy exists. PARP inhibition rescues relevant phenotypes
  in three preclinical systems (Drosophila, patient fibroblasts and
  stress-challenged Arh3-knockout mice), which is the strongest
  mechanistic lead in the field, but it has never been tested in a patient in a
  controlled way, and the one PARP-inhibitor-flavoured agent actually
  administered off-label to patients - minocycline - was subsequently shown to
  be a poor PARP1 inhibitor with no effect on ADP-ribosylation in
  ARH3-deficient cells.
parents:
- Inherited Neurodegenerative Disorder
synonyms:
- CONDSIAS
- childhood-onset stress-induced neurodegenerative ataxia-seizure syndrome
- ADPRHL2-related neurodegeneration
- ARH3 deficiency
- stress-induced epileptic ataxia syndrome
- PAMP syndrome
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      Essentially the entire reported morbidity is neurological: ataxia,
      seizures, developmental regression, dystonia, axonal sensorimotor
      neuropathy, spasticity, cerebral and cerebellar atrophy, and terminally
      central hypoventilation. Non-neurological findings are reported but are
      either downstream of neurological failure (central hypoventilation of
      unresolved neuroanatomical origin, cardiac arrhythmia and hypertension from autonomic
      dysfunction) or rare add-ons in single reports (ichthyosis, cataract,
      endocrine deficits). A single NEUROLOGIC chapter is therefore the correct
      assignment, and no second chapter is asserted.
    evidence:
    - reference: PMID:30100084
      reference_title: "Biallelic Mutations in ADPRHL2, Encoding ADP-Ribosylhydrolase 3, Lead to a Degenerative Pediatric Stress-Induced Epileptic Ataxia Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Affected individuals exhibited a pediatric-onset neurodegenerative disorder with progressive brain atrophy, developmental regression, and seizures in association with periods of stress, such as infections."
      explanation: The founding cohort description is entirely neurological, which is the basis for the single NEUROLOGIC chapter assignment.
notes: >-
  Entity verification and gene-symbol trap. The MONDO term was verified with OAK
  before any content was written: `runoak -i sqlite:obo:mondo info MONDO:0100095
  -O obo` gives `relationship: RO:0004003 HGNC:21304 ! ADPRS`, `xref:
  OMIM:618170`, `xref: Orphanet:694922`, `xref: DOID:0070352`, `xref:
  MEDGEN:1648391`, and the synonym CONDSIAS; `runoak -i sqlite:obo:mondo
  relationships -p RO:0004003 MONDO:0100095` returns the same single gene.
  `runoak -i sqlite:obo:hgnc info hgnc:21304` returns ADPRS. The MONDO
  definition text still names the gene by its FORMER symbol ADPRHL2, and the
  literature uses three names for one gene - ADPRS (current HGNC symbol),
  ADPRHL2 (former symbol, used by both 2018 founding papers and most case
  reports) and ARH3 (the protein, used by essentially all of the biochemistry).
  A PubMed search restricted to any one of those three names misses most of the
  evidence base; every search underlying this entry covered all three. HGNC has
  no record under the string ADPRHL2 (`runoak -i sqlite:obo:hgnc search
  "ADPRHL2"` returns nothing), so the alias mapping cannot be recovered from the
  HGNC adapter alone.

  NEC preflight, and the specific trap this disease carries. The dominant gene
  named across the clinical corpus is unambiguously ADPRHL2/ADPRS/ARH3, matching
  the MONDO definition, and every OMIM number asserted in the sources
  (OMIM:618170 for the disease, OMIM:610624 for the gene) matches the MONDO
  xref. One concrete confusion was found and discarded rather than curated: a
  PubMed query for `ADPRS[TIAB]` on 2026-08-01 returned roughly 100 records, and
  the large majority were Alzheimer disease neuroimaging and epidemiology papers
  in which "ADPRS" is an author-coined abbreviation for "Alzheimer's Disease
  Polygenic Risk Score", not the gene. Those records (for example
  PMID:42528531, PMID:42470526, PMID:42221673, PMID:41947717, PMID:41121378)
  were rejected as a block and none of their content appears here. This is a
  textbook acronym-collision NEC risk and it is recorded so the next curator
  does not have to rediscover it.

  Nomenclature caution on one differential. The disorder caused by the
  structurally unrelated hydrolase TARG1/OARD1/C6orf130 (a macrodomain
  ADP-ribosylglutamate hydrolase) is also a recessive neurodegenerative disease
  of ADP-ribosylation reversal, and its gene's aliases overlap confusingly with
  ADPRS in casual writing. It is a different gene and a different MONDO entity
  and is deliberately not curated here; no claim in this entry is sourced from
  TARG1 literature.

  Evidence base and its shape. This entry rests on two 2018 founding cohorts
  (PMID:30100084, 16 individuals from 6 families; PMID:30401461, 12 individuals
  from 8 families), one 2024 PRISMA systematic review aggregating 47 published
  patients from 12 articles up to 3 February 2023 (PMID:38365196), a set of
  individual case reports extending the phenotype, and a substantial
  biochemical/cell-biological literature on ARH3 that is largely independent of
  the clinical reports. The clinical and the mechanistic literatures are
  therefore of very different maturity: the enzymology is well worked out, the
  natural history is a pooled case-report series with no prospective cohort, no
  registry, and no natural-history study.

  Quantitative discipline. Every number in this entry's prose traces to a
  cached source that was read directly. The 47-patient aggregate figures
  (triggering factors 59.5%, regression 60.4%, axonal polyneuropathy 39.1%,
  cerebral/cerebellar atrophy 77.7%, fatality 44.6% at median 7 years, median
  onset 2 years) are from the abstract of PMID:38365196 and are quoted as
  snippets. Two internal inconsistencies in that source are recorded rather than
  smoothed over. First, its abstract gives regression as "28/43; 60.4%" while
  its Table 1 gives 26/43 (60.4%); 60.4% of 43 is 26.0, so the table is
  self-consistent and the abstract numerator appears to be a typographical
  error - the percentage, not the numerator, is used here. Second, its Table 1
  reports seizure as a presenting symptom in 16/47 (34%) but as a clinical
  symptom in only 11/47 (23.4%), which cannot both be complete; no frequency
  band is asserted for seizures as a result. Third, the same review writes the
  recurrent Turkish variant as both "c.235A > C" and "c.235C > A" in different
  sentences for the same p.(Thr79Pro) protein change; ACG->CCG requires c.235A>C,
  so c.235A>C is used here and the discrepancy is flagged in `genetic:`.

  Frequency bands are asserted only where a percentage is quotable from a
  cached abstract. HPO annotation fractions for OMIM:618170 (retrieved
  2026-08-01 from https://ontology.jax.org/api/network/annotation/OMIM:618170)
  are recorded in individual phenotype `notes:` because HPOA is not a
  snippet-validatable reference in this repository. Where the review's pooled
  denominator and the HPOA per-cohort denominator disagree - ataxia is 11/11 in
  the Danhauser cohort but 17/47 (36.1%) in the pooled review, because the
  review's denominator is all 47 patients including those for whom the datum was
  not extractable - no band is asserted at all.

  Deliberately absent sections and why. `histopathology:` is absent: the only
  neuropathological observation in the entire literature is the statement in
  PMID:30830864 that parthanatos was observed in neurons of a deceased sibling,
  with no systematic autopsy series, no Purkinje-cell counts and no white-matter
  pathology described anywhere. Asserting a histopathology section from that
  single sentence would over-read it; it is instead cited on the parthanatos
  pathophysiology node and flagged as a knowledge gap. `biochemical:` is absent:
  no diagnostic biomarker exists, and the obvious candidate assay
  (poly/mono-ADP-ribose immunoblot on patient fibroblasts) is a research tool
  with no reference interval. `clinical_trials:` is absent: no source read for
  this entry reports a registered interventional trial in this disorder, and no
  trial registry was queried directly, so the section is left empty rather than
  asserted to be empty.

  Structured-source evidence was unavailable in this checkout.
  `data/orphadata/` and `data/clingen/` contain only `MANIFEST.yaml` with no
  downloaded payload, so no Orphanet prevalence class (ORPHA:694922 exists as a
  MONDO xref) and no ClinGen gene-disease-validity classification could be
  consulted or quoted. Per scope rules the manifests were not touched. This is
  recorded as a gap, not as an assertion that no such records exist.

  Two further reports were retrieved and cached during the literature sweep but
  yielded no quotable text, so they support no claim in this entry and appear in
  no `references:` block. PMID:33426173 (Mishra et al., Mov Disord Clin Pract
  2021, "Dystonia and Myelopathy in a Case of Stress-Induced Childhood-Onset
  Neurodegeneration with Ataxia and Seizures") is indexed without an abstract;
  its subject matter, dystonia with myelopathy, is covered here from the
  systematic review's spinal-cord figures instead. PMID:39417910 (Eslamiyeh et
  al., Acta Neurol Belg 2025, "Repurposing doxycycline for a case of CONDSIAS
  Syndrome with a novel ADPRHL2 missense mutation") is a letter whose cached
  record contains only bibliographic metadata; it is referred to in the
  minocycline treatment's notes without a snippet. Both cache files are
  committed so that the negative result of the sweep is reproducible.

  No GeneReviews chapter for this disorder was found on PubMed on 2026-08-01,
  so the usual GeneReviews phenotype baseline is not available and the
  phenotype list here is built from the primary reports plus the systematic
  review.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Disease requires two damaging ADPRS alleles. Both founding cohorts were
    bi-allelic, and heterozygous parents are consistently reported as
    unaffected. Homozygosity strongly predominates over compound
    heterozygosity, which is a consequence of ascertainment through
    consanguineous families rather than a property of the locus: in the pooled
    review a history of consanguinity was present in 30 of 42 patients for whom
    it was recorded. Compound heterozygous genotypes are nonetheless documented
    (only 2 of the 47 patients in the pooled review, with further examples since:
    PMID:35664652, PMID:35222245, PMID:42015965).

    Penetrance is deliberately left unset rather than recorded as COMPLETE. No
    unaffected bi-allelic individual has been reported, which superficially
    argues for complete penetrance, but the entire literature is
    clinically ascertained case reports with no population screening, so
    non-penetrance could not have been detected even if it existed. The
    intra-familial variability that is reported - one adult sibling described as
    only mildly affected alongside a severely affected 8-year-old, and two of
    three affected sisters in the PAMP-syndrome family described as having
    "much milder phenotypes" than the index case - shows that expressivity is
    variable at fixed genotype, which is a separate question from penetrance and
    is the more clinically consequential one here. The consanguinity fraction
    (30/42) is from Table 1 of PMID:38365196, which is PDF-extracted full text
    rather than the cached abstract, so it is recorded here and not as an
    evidence snippet.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:30100084
    reference_title: "Biallelic Mutations in ADPRHL2, Encoding ADP-Ribosylhydrolase 3, Lead to a Degenerative Pediatric Stress-Induced Epileptic Ataxia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using linkage analysis and exome or genome sequencing, we identified recessive inactivating mutations in ADPRHL2 in six families."
    explanation: Establishes recessive inheritance of inactivating alleles in the founding six-family cohort.
  - reference: PMID:30401461
    reference_title: "Bi-allelic ADPRHL2 Mutations Cause Neurodegeneration with Developmental Delay, Ataxia, and Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used exome sequencing to identify five different bi-allelic pathogenic ADPRHL2 variants in 12 individuals from 8 families affected by a neurodegenerative disorder manifesting in childhood or adolescence"
    explanation: Independent replication of bi-allelic inheritance in a second, larger multi-family cohort.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No incidence or prevalence estimate of any kind has been published, so no
    numeric rate is recorded and `rate_per_100000` is deliberately left empty.
    The qualitative ULTRA_RARE band is taken from the explicit characterisation
    in the source literature rather than derived from a count. The published
    denominator as of this curation is 47 patients from 12 articles up to
    3 February 2023 (PMID:38365196), plus subsequent individual reports curated
    here (PMID:38365196's own two cases, PMID:39580621, PMID:40493129,
    PMID:42015965), so the true published total is now somewhat above 50. No
    founder effect is asserted at population level, although the authors of
    PMID:38365196 raise the possibility of one for the recurrent p.Thr79Pro
    allele in Turkey; ascertainment is heavily weighted towards consanguineous
    populations and towards centres running research exome sequencing. Table 2
    of PMID:32746785, which tabulates the nationality of each reported family,
    lists Turkey (three families), Iran (two), the United Arab Emirates,
    Pakistan and Lebanon alongside Italy, Germany, Kosovo, Poland and China;
    the pooled review records consanguinity in 30 of 42 patients for whom it was
    documented. That distribution reflects reporting and consanguinity
    patterns, not the true geographic range of the disorder.
  evidence:
  - reference: PMID:35664652
    reference_title: "Child-Onset Cerebellar Ataxia Caused by Two Compound Heterozygous Variants in ADPRS Gene: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an ultra-rare neurodegenerative autosomal recessive disorder"
    explanation: Explicit qualitative rarity characterisation, which is the basis for the ULTRA_RARE band in the absence of any quantitative estimate.
  - reference: PMID:38365196
    reference_title: "Delineation of ADPRHL2 Variants: Report of Two New Patients with Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total, 12 articles describing 47 patients were included in the final analysis."
    explanation: Establishes the published case denominator at the time of the most recent systematic review.
progression:
- phase: Normal or near-normal early development
  age_range: Birth to approximately 1-2 years
  notes: >-
    Most affected children are described as developmentally normal, or as having
    only mild isolated delay (commonly expressive language), before the first
    stress-related episode. In the pooled review 25.5% of patients for whom the
    datum was available had entirely normal milestones and a further 16.2% had
    pre-existing delay, so a normal early history neither supports nor excludes
    the diagnosis. Median age at symptom onset across 47 patients was 2 years,
    with a range from 0.7 to 25 years.
  evidence:
  - reference: PMID:38365196
    reference_title: "Delineation of ADPRHL2 Variants: Report of Two New Patients with Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median age at symptom onset was 2 (0.7-25) years"
    explanation: Quantifies onset age and its range across the pooled published cohort.
- phase: Stress-triggered episodic deterioration
  age_range: Early childhood onwards
  notes: >-
    The defining phase. Discrete episodes - ataxia, dystonic posturing or
    torticollis, seizures, encephalopathy, sudden loss of ambulation or speech -
    are precipitated by febrile illness, infection, surgery, trauma, diarrhoea,
    exercise or cold-water immersion. Recovery between episodes is partial, so
    each event leaves a lower baseline. Some episodes resolve spontaneously over
    weeks and are misread as benign, which is a documented cause of diagnostic
    delay: in the first case of PMID:38365196 the episodic head tilt attacks
    recurred about weekly over some two months and then resolved without any
    treatment, only to return six weeks before presentation and then increase in
    frequency and progress.
  evidence:
  - reference: PMID:38365196
    reference_title: "Delineation of ADPRHL2 Variants: Report of Two New Patients with Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Triggering factors (28/47; 59.5%) and regression (28/43; 60.4%), axonal polyneuropathy (9/23; 39.1%), and cerebral and cerebellar atrophy with white matter changes (28/36; 77.7%) were the other clues."
    explanation: Quantifies documented triggering factors and developmental regression across the pooled cohort. The numerator "28/43" for regression is inconsistent with the stated 60.4% and with Table 1 of the same paper (26/43); see the entry-level notes.
- phase: Progressive neurodegeneration
  age_range: Variable; typically within a few years of onset
  notes: >-
    Cumulative loss of motor and language function, spastic-ataxic quadriparesis,
    dysarthria and dysphagia, with progressive cerebral and cerebellar atrophy on
    serial imaging. Imaging can lag the clinical course: in the pooled review 7
    of the 28 patients with an abnormal MRI (25%) had a normal first study and
    became abnormal only on follow-up, so a normal early scan does not exclude
    the diagnosis.
  evidence:
  - reference: PMID:38365196
    reference_title: "Delineation of ADPRHL2 Variants: Report of Two New Patients with Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "who later had a neurodegenerative course complicated by central hypoventilation syndrome due to the same homozygous ADPRHL2 variant"
    explanation: Describes the progression from episodic presentation to a neurodegenerative course with brainstem respiratory involvement.
- phase: Respiratory failure and death
  age_range: Median age of death 7 years (range 2-34)
  notes: >-
    Respiratory failure and cardiopulmonary arrest are the usual terminal
    events, often central hypoventilation requiring tracheostomy rather than
    neuromuscular weakness alone. Survival is highly variable: the same
    aggregate that reports a median age at death of 7 years also reports living
    patients up to 40 years old, and a distinct adult-onset group presents in
    the third decade with a comparatively indolent course.
  evidence:
  - reference: PMID:38365196
    reference_title: "Delineation of ADPRHL2 Variants: Report of Two New Patients with Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fatality rate and median age of death were 44.6% (n = 21) and 7 (2-34) years, respectively."
    explanation: Quantifies mortality and age at death across the pooled published cohort.
pathophysiology:
- name: Bi-allelic Inactivating ADPRS Variants
  biological_scale: MOLECULAR
  description: >-
    The primary lesion is bi-allelic damage to ADPRS at 1p34.3, reported against
    transcript NM_017825.2/NM_017825.3. Missense, nonsense, frameshift and
    splice-site alleles are all represented and all converge on loss of ARH3
    protein or activity rather than on a gain of function or a dominant-negative
    effect. The missense alleles are not a mild class: p.Thr79Pro, p.Cys26Phe,
    p.His182Arg, p.Leu162Pro and p.Ala280Thr have each been shown biochemically
    to destabilise the protein, and in the PAMP-syndrome family the p.Ala280Thr
    protein was undetectable on western blot despite being a single amino-acid
    substitution. The practical consequence for variant interpretation is that a
    conservative-looking ADPRS missense change cannot be dismissed on in-silico
    grounds.
  genes:
  - preferred_term: ADPRS
    term:
      id: hgnc:21304
      label: ADPRS
  evidence:
  - reference: PMID:30100084
    reference_title: "Biallelic Mutations in ADPRHL2, Encoding ADP-Ribosylhydrolase 3, Lead to a Degenerative Pediatric Stress-Induced Epileptic Ataxia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using linkage analysis and exome or genome sequencing, we identified recessive inactivating mutations in ADPRHL2 in six families."
    explanation: Names the causal gene and characterises the alleles as inactivating in the founding cohort.
  - reference: PMID:33528672
    reference_title: "Episodic psychosis, ataxia, motor neuropathy with pyramidal signs (PAMP syndrome) caused by a novel mutation in ADPRHL2 (AHR3)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected patients had homozygous novel NM_017825.3:c.838G>A (p.Ala280Thr) mutations in a highly conserved region of ADPRHL2. Western blot analyses demonstrated that ADPRHL2 was not expressed in these patients."
    explanation: Demonstrates that a single missense substitution can abolish detectable protein, which is why missense alleles at this locus behave as null.
  - reference: PMID:39580621
    reference_title: "An ADPRS variant disrupts ARH3 stability and subcellular localization in children with neurodegeneration and respiratory failure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mechanistically, the ARH3H182R variant affects a highly conserved residue in the active site of ARH3, leading to protein instability, degradation, and, subsequently, reduced protein expression."
    explanation: Active-site missense alleles act by destabilising the protein rather than by producing a stable catalytically dead enzyme.
  downstream:
  - target: Loss of ARH3 Serine-ADP-Ribosylhydrolase Activity
    description: >-
      Every reported allele class - null, frameshift, splice and destabilising
      missense - converges on absent or severely reduced ARH3 protein and
      therefore on loss of its hydrolase activity.
- name: Loss of ARH3 Serine-ADP-Ribosylhydrolase Activity
  biological_scale: MOLECULAR
  description: >-
    ARH3 is a 39 kDa binuclear-magnesium metalloenzyme of the ARH family. It has
    two distinct, non-redundant activities relevant to this disease. The first
    is unique to it: ARH3 is the only human enzyme that cleaves the terminal
    seryl-ADP-ribosyl bond, that is, the single ADP-ribose left attached to a
    serine residue after PARG has trimmed the poly(ADP-ribose) chain. PARG
    cannot perform this step, so there is no redundancy and no compensation.
    The second is shared: ARH3 also hydrolyses poly(ADP-ribose) chains, acting
    in tandem with PARG on nuclear and cytoplasmic PAR and providing the
    principal PAR-degrading activity of the mitochondrial matrix, where PARG is
    scarce. Loss of ARH3 therefore removes one activity outright and reduces the
    reserve capacity of the other, which is why the resulting phenotype is
    unmasked by stress rather than being constant.
  genes:
  - preferred_term: ADPRS
    term:
      id: hgnc:21304
      label: ADPRS
  molecular_functions:
  - preferred_term: ADP-ribosylserine hydrolase activity
    modifier: DECREASED
    term:
      id: GO:0140292
      label: ADP-ribosylserine-[protein] hydrolase activity
  biological_processes:
  - preferred_term: protein de-ADP-ribosylation
    modifier: DECREASED
    term:
      id: GO:0051725
      label: protein de-ADP-ribosylation
  cellular_components:
  - preferred_term: nucleus
    term:
      id: GO:0005634
      label: nucleus
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  notes: >-
    Subcellular localisation is itself a disease mechanism at this locus and not
    merely a descriptive detail. Two independently characterised alleles are
    mislocalisation alleles: p.His182Arg fails to reach the nucleus
    (PMID:39580621) and p.Val335Gly retains mitochondrial localisation while
    showing altered cytosolic/nuclear distribution with near-normal basal
    activity but elevated nuclear ADP-ribosylation specifically under stress
    (PMID:34479984). The p.Val335Gly result is the cleanest published
    demonstration that the defect in this disease is conditional on stress
    rather than constitutive.
  evidence:
  - reference: PMID:28650317
    reference_title: "Serine ADP-ribosylation reversal by the hydrolase ARH3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we identified ARH3/ADPRHL2 as capable of efficiently and specifically removing Ser-ADPr of histones and other proteins"
    explanation: Original identification of ARH3 as the serine-ADP-ribosylhydrolase, the activity whose loss defines this disorder.
  - reference: PMID:34019811
    reference_title: "Unrestrained poly-ADP-ribosylation provides insights into chromatin regulation and human disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ARH3 is the only hydrolase able to remove serine-linked mono(ADP-ribose) (MAR) but is much less efficient than PARG against poly(ADP-ribose) (PAR) chains in vitro."
    explanation: Establishes both the non-redundancy of the serine-MAR activity and the relative weakness of the PAR activity, which together set the shape of the deficiency.
  - reference: PMID:34869334
    reference_title: "The Making and Breaking of Serine-ADP-Ribosylation in the DNA Damage Response."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "another enzyme, (ADP-ribosyl)hydrolase 3 (ARH3), specifically cleaves the terminal seryl-ADP-ribosyl bond, thus completing the chain degradation initiated by PARG"
    explanation: Places ARH3 as the obligatory final step of the two-enzyme chain-degradation relay. Classified OTHER because this is a review.
  - reference: PMID:24191052
    reference_title: "ADP-ribosyl-acceptor hydrolase 3 regulates poly (ADP-ribose) degradation and cell death during oxidative stress."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, we show an alternative PAR-degradation pathway, resulting from action of ADP ribosyl-acceptor hydrolase (ARH) 3."
    explanation: Establishes the second, PARG-parallel activity of ARH3 on poly(ADP-ribose), the activity lost in the cytoplasmic and nuclear compartments.
  - reference: PMID:33894202
    reference_title: "Structural and biochemical analysis of human ADP-ribosyl-acceptor hydrolase 3 reveals the basis of metal selectivity and different roles for the two magnesium ions."
    supports: SUPPORT

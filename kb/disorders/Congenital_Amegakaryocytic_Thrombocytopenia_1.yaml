pathophysiology:
- name: Biallelic MPL Loss of Function
  description: >-
    Nonsense, frameshift, splice-site and missense MPL variants remove or
    impair the thrombopoietin receptor. Null alleles truncate the protein
    before the intracellular signaling domains; many missense alleles cluster in
    the extracellular cytokine-receptor domain. Surface receptor expression on
    progenitors is absent in null cases and variably reduced with missense
    alleles.
  biological_scale: MOLECULAR

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 6-year disease-free survival (DFS) and overall survival (OS) were 66.9% and 85.6%, respectively."
    explanation: Registry outcomes.
  - reference: PMID:39289521
    reference_title: "Outcomes of patients undergoing allogeneic haematopoietic stem cell transplantation for congenital amegakaryocytic thrombocytopenia; a study on behalf of the PDWP of the EBMT."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 6-year cumulative incidence of graft-failure and second transplant were 25% and 17%, respectively."
    explanation: Graft failure is the main transplant problem.
- name: Platelet Transfusion
  description: >-
    Used transiently after diagnosis of severe thrombocytopenia and during the
    aplastic stage; red cell transfusion is added as pancytopenia advances.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: platelet transfusion
    term:
      id: NCIT:C15366
      label: Platelet Transfusion
  target_phenotypes:
  - preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: PMID:32703794
    reference_title: "CAMT-MPL: congenital amegakaryocytic thrombocytopenia caused by MPL mutations - heterogeneity of a monogenic disorder - a comprehensive analysis of 56 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-seven of 45 documented cases of our patient group received platelet transfusions, most of them transiently in a period immediately after diagnosis of severe thrombocytopenia and/or during the aplastic stage of the disease."
    explanation: Use of platelet transfusion in the cohort.
- name: Thrombopoietin Receptor Agonists (investigational)
  description: >-
    Not an established treatment. Null MPL alleles leave no receptor for
    these drugs to act on. In cell models, some missense receptors respond
    to an agonist that binds the transmembrane domain (the eltrombopag class)
    but not to thrombopoietin or to agonists that bind the extracellular
    domain, and the R464G receptor responded to eltrombopag only when mutant
    calreticulin was co-expressed. No clinical efficacy data in CAMT1 are
    available, and a pediatric review lists CAMT as a question for future
    study.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: eltrombopag
      term:
        id: CHEBI:85010
        label: eltrombopag
  target_mechanisms:
  - target: Loss of Thrombopoietin Receptor Signaling
  evidence:
  - reference: PMID:20188141
    reference_title: "F104S c-Mpl responds to a transmembrane domain-binding thrombopoietin receptor agonist: proof of concept that selected receptor mutations in congenital amegakaryocytic thrombocytopenia can be stimulated with alternative thrombopoietic agents."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "These findings suggest that a small subset of patients with congenital amegakaryocytic thrombocytopenia might respond to treatment with thrombopoietin receptor agonists, but that responsiveness will depend on the type of mutation and agonist used."
    explanation: Response is limited to particular missense receptors and agonist classes, shown only in cell lines.
  - reference: PMID:34010413
    reference_title: "CALR mutant protein rescues the response of MPL p.R464G variant associated with CAMT to eltrombopag."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "However, it unexpectedly restored a normal response to eltrombopag (ELT), but not to TPO."
    explanation: An eltrombopag response in a CAMT missense receptor required an added chaperone-like factor.
  - reference: PMID:38925157
    reference_title: "Update on the Use of Thrombopoietin-Receptor Agonists in Pediatrics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Moreover, studies on the implication of TPO-RA in treating rare inherited thrombocytopenias, such as Wiskott-Aldrich syndrome (WAS), congenital amegakaryocytic thrombocytopenia (CAMT), or MYH9-associated thrombocytopenia, deserve future attention."
    explanation: Use in CAMT is not established.
differential_diagnoses:

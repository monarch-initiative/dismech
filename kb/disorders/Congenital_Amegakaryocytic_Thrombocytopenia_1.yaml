genetic:
- name: MPL
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: MPL
    term:
      id: hgnc:7217
      label: MPL
  notes: >-
    Missense variants are the largest class (57% of alleles in the 56-patient
    cohort), with hotspots at codons 102-104 and at the prolines at 135-136.
    Nonsense (20%), frameshift (13%) and splice (10%) variants make up the
    rest. c.79+2T>A is an Ashkenazi Jewish founder variant. Somatic
    gain-of-function MPL variants cause myeloproliferative neoplasms and are a
    separate disease. No ClinGen gene-disease validity record for MPL and this
    disease is in the reference cache.
  evidence:
  - reference: PMID:11133753
    reference_title: "c-mpl mutations are the cause of congenital amegakaryocytic thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of the c-mpl gene revealed point mutations in 8 of 8 patients"
    explanation: MPL variants in every patient sequenced in the first series.
  - reference: PMID:32703794
    reference_title: "CAMT-MPL: congenital amegakaryocytic thrombocytopenia caused by MPL mutations - heterogeneity of a monogenic disorder - a comprehensive analysis of 56 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two hotspots (amino acids 102-104: 18 alleles, 12 patients; proline residues 135-136: six alleles, five patients) account for 21% of all mutated alleles."
    explanation: Missense hotspots.
  - reference: PMID:21489838
    reference_title: "A founder mutation in the MPL gene causes congenital amegakaryocytic thrombocytopenia (CAMT) in the Ashkenazi Jewish population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation, termed c.79+2T>A, is a T to A transversion in the invariant second base of the intron 1 donor splice site."
    explanation: Ashkenazi founder splice variant.
animal_models:
- name: Mpl knockout mouse
  species: Mus musculus
  genotype: Mpl-/-
  description: >-
    Targeted null allele of the thrombopoietin receptor. Mice are severely
    thrombocytopenic with few megakaryocytes and reduced progenitors of all
    lineages, but keep normal hematocrit and leukocyte counts and do not
    develop aplastic anemia.
  publication: PMID:8630375
  modeled_mechanisms:
  - target: Failure of Megakaryopoiesis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Megakaryocyte deficiency and severe thrombocytopenia from loss of Mpl alone.
    evidence:
    - reference: PMID:8630375
      reference_title: "Deficiencies in progenitor cells of multiple hematopoietic lineages and defective megakaryocytopoiesis in mice lacking the thrombopoietic receptor c-Mpl."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "c-mpl-deficient mice developed normally but were deficient in megakaryocytes and severely thrombocytopenic."
      explanation: Reproduces the megakaryocyte defect.
  - target: Hematopoietic Stem and Progenitor Cell Exhaustion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Reduced multilineage progenitors without progression to marrow aplasia.
    limitations: >-
      Mpl-/- mice keep normal blood counts outside the platelet lineage,
      whereas nearly all patients progress to pancytopenia; the human
      progression is not reproduced.
    evidence:
    - reference: PMID:8630375
      reference_title: "Deficiencies in progenitor cells of multiple hematopoietic lineages and defective megakaryocytopoiesis in mice lacking the thrombopoietic receptor c-Mpl."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Significantly, total hematopoietic progenitor cell numbers were also reduced in mpl-/- mice including multipotential, blast cell, and committed progenitors of multiple lineages."
      explanation: Multilineage progenitor reduction in the mouse.
    - reference: PMID:8630375
      reference_title: "Deficiencies in progenitor cells of multiple hematopoietic lineages and defective megakaryocytopoiesis in mice lacking the thrombopoietic receptor c-Mpl."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The hematocrit and numbers of mature circulating leukocytes were normal in mpl-/- mice"
      explanation: No pancytopenia in the mouse, the limit of this model.
experimental_models:
- name: CAMT patient-derived iPSC hematopoietic differentiation
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    iPSCs from a CAMT patient differentiated into hematopoietic progenitors and
    compared with normal iPSCs, with and without retroviral MPL
    re-expression. The authors chose this system because the Mpl knockout
    mouse does not reproduce the human marrow failure.
  publication: PMID:23908116
  modeled_mechanisms:
  - target: Loss of Thrombopoietin Receptor Signaling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Loss of multipotent progenitors and megakaryocyte-erythroid progenitors without MPL signaling.
    limitations: >-
      In vitro differentiation from a single patient line; the marrow niche and
      long-term stem-cell exhaustion are not modeled.
    evidence:
    - reference: PMID:23908116
      reference_title: "Congenital amegakaryocytic thrombocytopenia iPS cells exhibit defective MPL-mediated signaling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found that MPL signaling is essential for maintenance of the CD34+ multipotent hematopoietic progenitor (MPP) population and development of the CD41+GPA+ megakaryocyte-erythrocyte progenitor (MEP) population"
      explanation: Patient iPSCs reproduce the progenitor defects.

has_subtypes:
- name: CAMT I
  display_name: CAMT type I (complete MPL loss of function)
  description: >-
    Null MPL alleles (nonsense, frameshift and canonical splice variants)
    predicted to abolish receptor function. Platelet counts stay persistently
    low and pancytopenia develops early. This is a clinical and genotypic
    stratum within CAMT1, not a separate disease.
  genes:
  - preferred_term: MPL
    term:
      id: hgnc:7217
      label: MPL
  evidence:
  - reference: PMID:16470591
    reference_title: "MPL mutations in 23 patients suffering from congenital amegakaryocytic thrombocytopenia: the type of mutation predicts the course of the disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven different mutations predicted to lead to a complete loss of function of the thrombopoietin receptor were found in 13 patients belonging to group CAMT I with persistently low platelet counts and a fast progression into pancytopenia."
    explanation: Defines CAMT type I by null genotype and its clinical course.
- name: CAMT II
  display_name: CAMT type II (residual MPL function)
  description: >-
    Mainly missense MPL alleles, often in the extracellular domain, that leave
    some receptor activity. Platelet counts rise transiently above 50 x 10^9/L
    in the first years of life before aplasia develops; a few patients have
    not developed pancytopenia during follow-up.
  genes:
  - preferred_term: MPL
    term:
      id: hgnc:7217
      label: MPL
  evidence:
  - reference: PMID:16470591
    reference_title: "MPL mutations in 23 patients suffering from congenital amegakaryocytic thrombocytopenia: the type of mutation predicts the course of the disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine different missense mutations were detected in 10 patients of group CAMT II, characterized by a transient increase in platelet counts over 50 nl(-1) during the first years of life."

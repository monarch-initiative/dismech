  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  evidence:
  - reference: PMID:23908116
    reference_title: "Congenital amegakaryocytic thrombocytopenia iPS cells exhibit defective MPL-mediated signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that MPL signaling is essential for maintenance of the CD34+ multipotent hematopoietic progenitor (MPP) population and development of the CD41+GPA+ megakaryocyte-erythrocyte progenitor (MEP) population"
    explanation: Patient-derived iPSCs define the two cellular consequences of absent MPL signaling.
  - reference: PMID:23908116
    reference_title: "Congenital amegakaryocytic thrombocytopenia iPS cells exhibit defective MPL-mediated signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "impaired erythropoiesis and increased aberrant megakaryocyte production in CAMT iPSC-derived CD34+ HPCs, reflecting a difference in the expression of the transcription factor FLI1."
    explanation: MPL signaling sets the megakaryocyte-erythroid fate decision through FLI1 in patient cells.
  - reference: PMID:9831170
    reference_title: "Thrombopoietin and its receptor."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Upon ligand-induced Mpl homodimerization, the major signaling events for proliferation are mediated through the JAK2/STAT5 pathway, while differentiation might occur through a prolonged activation of the MAPK pathway."
    explanation: Normal MPL signaling routes lost in CAMT.
  downstream:

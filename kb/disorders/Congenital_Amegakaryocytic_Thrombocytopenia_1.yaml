- name: Hematopoietic Stem and Progenitor Cell Exhaustion
  description: >-
    Without MPL signaling, early multipotent progenitors of all lineages are
    depleted and the marrow becomes hypocellular, so isolated
    thrombocytopenia evolves into anemia, neutropenia and aplastic anemia. In
    the largest cohort only 7 of 49 patients had no sign of pancytopenia. Mpl
    knockout mice show reduced progenitors but keep normal non-platelet blood
    counts, so the progression to aplasia is more severe in humans than in the
    mouse.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: hematopoietic stem cell homeostasis
    modifier: DECREASED
    term:

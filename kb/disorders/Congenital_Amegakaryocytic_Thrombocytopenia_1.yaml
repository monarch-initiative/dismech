classifications:
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
notes: >-
  No GeneReviews chapter covers MPL-related CAMT. Non-hematological findings
  in the largest cohort (strabismus, nystagmus, brain anomalies, developmental
  delay) are recorded as sequelae of intracranial hemorrhage, following the
  cohort authors' reading; a direct role of MPL in the brain has been proposed
  but is not established. The cohort showed an unexplained female
  predominance (62.5%). Somatic activating MPL variants cause
  myeloproliferative neoplasms, which are not part of this entry.

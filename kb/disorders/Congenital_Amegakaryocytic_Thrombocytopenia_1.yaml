    evidence_source: HUMAN_CLINICAL
    snippet: "presenting as an isolated thrombocytopenia at birth progressing to pancytopenia due to exhaustion of hematopoietic progenitors."
    explanation: States progenitor exhaustion as the cause of progression to pancytopenia.
  - reference: PMID:12799278
    reference_title: "Thrombopoietin is essential for the maintenance of normal hematopoiesis in humans: development of aplastic anemia in patients with congenital amegakaryocytic thrombocytopenia."

treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    The only curative treatment, usually given for developing aplastic anemia.
    In an EBMT registry series of 66 patients, 6-year overall survival was
    85.6% and disease-free survival 66.9%, with graft failure in 25%.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_phenotypes:

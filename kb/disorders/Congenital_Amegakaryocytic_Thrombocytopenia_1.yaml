      explanation: Patient platelets and progenitors do not respond to thrombopoietin despite high ligand levels.
- name: Loss of Thrombopoietin Receptor Signaling
  description: >-
    Thrombopoietin cannot signal through MPL on megakaryocyte-lineage cells and
    on hematopoietic stem and progenitor cells. MPL has no kinase activity of
    its own; ligand-induced receptor dimerization normally signals through
    JAK2 and STAT5 for proliferation and through sustained MAPK activation for
    differentiation. Serum thrombopoietin is
    markedly raised in every patient tested, consistent with a receptor defect
    rather than a ligand defect. CAMT iPSC studies show MPL signaling is needed
    both to keep the multipotent progenitor pool and to direct
    megakaryocyte-erythroid progenitors toward megakaryopoiesis. In CAMT
    iPSC-derived progenitors, restoring MPL produced aberrant megakaryocytes
    at the expense of erythropoiesis, which the authors trace to altered
    expression of the transcription factor FLI1, so MPL signaling also sets
    the megakaryocyte-versus-erythroid fate balance.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: thrombopoietin-mediated signaling pathway
    modifier: DECREASED
    term:
      id: GO:0038163
      label: thrombopoietin-mediated signaling pathway

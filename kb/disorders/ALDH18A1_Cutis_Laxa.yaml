name: ALDH18A1-Related Autosomal Dominant Cutis Laxa Type 3
creation_date: "2026-04-04T00:00:00Z"
category: Mendelian
description: >
  ALDH18A1-related autosomal dominant cutis laxa type 3 (ADCL3) is an
  ultra-rare neurocutaneous connective-tissue disorder caused by specific de novo
  heterozygous missense variants in ALDH18A1. For p.Arg138Trp, functional
  studies support a dominant-negative effect on mitochondrial
  delta-1-pyrroline-5-carboxylate synthase (P5CS) and show a stable mutant
  protein with altered P5CS-complex organization and
  submitochondrial localization, reduced enzymatic activity, and delayed proline
  accumulation. Clinical manifestations include thin, translucent, wrinkled skin
  with a progeroid appearance, pre- and postnatal growth deficiency,
  developmental impairment, hypotonia, joint laxity, ocular opacity, and variable
  musculoskeletal and neuroimaging abnormalities. The tissue-level links from
  altered P5CS activity to these manifestations remain incompletely resolved.
disease_term:
  preferred_term: Autosomal dominant cutis laxa type 3
  term:

    wild-type P5CS but alters the structure or composition and submitochondrial
    localization of the P5CS complex. This dominant-negative state reduces
    overall P5CS enzymatic activity in patient cells. A comparable mechanism has
    not been directly demonstrated for the other ADCL-associated substitutions.

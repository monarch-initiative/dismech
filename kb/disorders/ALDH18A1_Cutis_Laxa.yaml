inheritance:
- name: Autosomal Dominant (de novo)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    All reported ALDH18A1-related ADCL probands whose parents underwent molecular
    testing had a de novo heterozygous pathogenic variant. If the variant is absent
    from parental leukocyte DNA, sibling recurrence risk is estimated at about 1%
    because gonadal mosaicism cannot be excluded.
  evidence:
  - reference: PMID:26320891
    reference_title: "Recurrent De Novo Mutations Affecting Residue Arg138 of Pyrroline-5-Carboxylate Synthase Cause a Progeroid Form of Autosomal-Dominant Cutis Laxa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A de novo origin was confirmed in all six probands for whom parental DNA was available."
    explanation: The landmark paper establishing ADCL3 confirms de novo origin of all characterized mutations.
  - reference: PMID:28228640
    reference_title: "Autosomal dominant cutis laxa with progeroid features due to a novel, de novo mutation in ALDH18A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report an 8-year-old male with a clinical diagnosis of autosomal dominant cutis laxa (ADCL) with progeroid features and a novel de novo missense mutation in ALDH18A1"
    explanation: Additional case report confirms de novo dominant inheritance at a residue other than Arg138.
  - reference: PMID:41570168
    reference_title: Neurocutaneous Disorders due to Mitochondrial Proline Synthesis Defects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >
      If the ALDH18A1 pathogenic variant found in the proband cannot be detected
      in the leukocyte DNA of either parent, the recurrence risk to sibs is
      estimated to be 1% because of the possibility of parental gonadal mosaicism.
    explanation: GeneReviews provides the recurrence-risk boundary for an apparently de novo ADCL variant.
genetic:
- name: ALDH18A1
  gene_term:
    preferred_term: ALDH18A1
    term:
      id: hgnc:9722
      label: ALDH18A1
  association: Causative
  features: >
    Recurrent de novo heterozygous missense mutations affecting residue Arg138 of
    P5CS (R138W, R138Q, R138L) have been reported in multiple affected
    individuals. A substitution at
    Arg126 (R126H) and a substitution at Ser134 (S134P) have also been described.
    Functional evidence for p.Arg138Trp shows stable mutant P5CS that interacts
    with wild-type protein but has altered submitochondrial distribution and
    complex organization, consistent with a dominant-negative mechanism. The
    same functional mechanism has not been directly established for p.Arg138Gln,
    p.Arg138Leu, p.Arg126His, or p.Ser134Pro.
  inheritance:
  - name: Autosomal Dominant
    evidence:
    - reference: PMID:26320891
      reference_title: "Recurrent De Novo Mutations Affecting Residue Arg138 of Pyrroline-5-Carboxylate Synthase Cause a Progeroid Form of Autosomal-Dominant Cutis Laxa."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "recurrent de novo mutations, affecting the highly conserved residue Arg138 of P5CS, cause an autosomal-dominant form of cutis laxa with progeroid features"
      explanation: The landmark paper directly states that de novo Arg138 mutations cause an autosomal-dominant form of the disorder.
  evidence:
  - reference: PMID:26320891
    reference_title: "Recurrent De Novo Mutations Affecting Residue Arg138 of Pyrroline-5-Carboxylate Synthase Cause a Progeroid Form of Autosomal-Dominant Cutis Laxa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found three heterozygous mutations in ALDH18A1 leading to amino acid substitutions of the same highly conserved residue, Arg138 in P5CS."
    explanation: Identifies the recurrent Arg138 mutations as the molecular basis of ADCL3.
  - reference: PMID:28228640
    reference_title: "Autosomal dominant cutis laxa with progeroid features due to a novel, de novo mutation in ALDH18A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of an individual with ALDH18A1-ADCL due to a substitution at a residue other than p.Arg138."
    explanation: Expands the mutational spectrum of ADCL3 beyond the Arg138 hotspot.
  - reference: PMID:40164711
    reference_title: "A novel case of autosomal-dominant cutis laxa caused by a de novo likely pathogenic variant in ALDH18A1: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      it is the first report of an individual with ALDH18A1-ADCL due to a
      substitution at a highly conserved residue, p.Ser134 of the P5CS protein.
    explanation: The 2025 report adds the de novo p.Ser134Pro-associated case to the ADCL3 variant spectrum.
mechanistic_hypotheses:
- hypothesis_group_id: dominant_negative_p5cs_model
  hypothesis_label: p.Arg138Trp-supported dominant-negative P5CS complex dysfunction
  status: CANONICAL
  description: >
    Patient-cell and heterologous-expression experiments directly show that
    p.Arg138Trp produces a stable mutant protein that interacts with wild-type
    P5CS but has altered complex organization and submitochondrial localization,
    reduced enzymatic activity, and delayed proline accumulation. Recurrent
    substitutions at Arg138 make a shared dominant-negative model plausible,
    but direct functional evidence is currently limited to p.Arg138Trp and does
    not establish the mechanism of p.Arg126His or p.Ser134Pro.
  evidence:
  - reference: PMID:26320891
    reference_title: "Recurrent De Novo Mutations Affecting Residue Arg138 of Pyrroline-5-Carboxylate Synthase Cause a Progeroid Form of Autosomal-Dominant Cutis Laxa."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      the P5CS-p.Arg138Trp protein was stable and able to interact with wild-type
      P5CS but showed an altered sub-mitochondrial distribution
    explanation: Functional work directly supports dominant-negative P5CS-complex dysfunction for p.Arg138Trp; extension to other variants is inferential.
- hypothesis_group_id: downstream_tissue_consequence_model
  hypothesis_label: Proposed downstream tissue consequences of altered P5CS metabolism
  status: EMERGING
  description: >
    Altered proline biosynthesis in extracellular-matrix synthesis is a plausible
    route from P5CS dysfunction to the connective-tissue phenotype, but the exact
    pathomechanisms for skin, musculoskeletal, neurodevelopmental, ocular, and
    vascular manifestations remain unknown. Redox, urea-cycle, tricarboxylic-acid,
    and oxidative-phosphorylation effects remain alternative possibilities rather
    than established intermediates in ADCL3.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK620405/
    reference_title: Neurocutaneous Disorders due to Mitochondrial Proline Synthesis Defects - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The exact pathomechanism remains unknown.
    explanation: The current GeneReview explicitly bounds the downstream tissue model as unresolved.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK620405/
    reference_title: Neurocutaneous Disorders due to Mitochondrial Proline Synthesis Defects - GeneReviews® - NCBI Bookshelf
    supports: PARTIAL
    evidence_source: OTHER
    snippet: Among them is altered proline biosynthesis in the context of extracellular matrix synthesis
    explanation: The current GeneReview presents the proline-to-extracellular-matrix link as one proposed mechanism.

treatments:
- name: Genetic Counseling
  description: >
    Genetic counseling should explain the usually de novo dominant mechanism.
    When the proband's variant is absent from parental leukocyte DNA, sibling
    recurrence risk is estimated at about 1% because gonadal mosaicism remains
    possible; reproductive testing options can be discussed once the familial
    variant is known.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:41570168
    reference_title: Neurocutaneous Disorders due to Mitochondrial Proline Synthesis Defects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >
      If the ALDH18A1 pathogenic variant found in the proband cannot be detected
      in the leukocyte DNA of either parent, the recurrence risk to sibs is
      estimated to be 1% because of the possibility of parental gonadal mosaicism.
    explanation: GeneReviews provides the counseling boundary for an apparently de novo ADCL variant.
- name: Supportive Care
  description: >
    There is no confirmed targeted therapy. Multidisciplinary supportive care
    includes speech and developmental therapies, physical and occupational
    therapy, mobility support when needed, orthopedic management of hip,
    contracture, scoliosis, or cervical-spine complications, ophthalmologic
    treatment for visual impairment, and cardiovascular care when indicated.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK620405/
    reference_title: Neurocutaneous Disorders due to Mitochondrial Proline Synthesis Defects - GeneReviews® - NCBI Bookshelf
    supports: PARTIAL
    evidence_source: OTHER
    snippet: There are no targeted therapies available for neurocutaneous disorders due to mitochondrial proline synthesis defects
    explanation: GeneReviews states that no targeted therapy is available for the broader disorder group; ADCL-specific therapeutic trials are not established.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK620405/
    reference_title: Neurocutaneous Disorders due to Mitochondrial Proline Synthesis Defects - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Supportive care to improve quality of life, maximize function, and reduce complications is recommended.
    explanation: GeneReviews recommends multidisciplinary supportive care rather than a disease-modifying therapy.
  - reference: PMID:41570168
    reference_title: Neurocutaneous Disorders due to Mitochondrial Proline Synthesis Defects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: physical therapy for motor delays and spastic diplegia; mobility devices for spastic diplegia; treatment of hip dislocation, scoliosis, and joint contractures per orthopedist; cervical spine fusion for atlantoaxial instability
    explanation: GeneReviews gives concrete supportive interventions for neurologic and orthopedic manifestations.
  - reference: PMID:41570168
    reference_title: Neurocutaneous Disorders due to Mitochondrial Proline Synthesis Defects.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: supplementation with arginine has been described in a limited number of individuals, but clinical benefit remains to be confirmed
    explanation: GeneReviews prevents amino-acid supplementation from being represented as established effective therapy.
- name: Multisystem surveillance
  description: >
    GeneReviews proposes longitudinal neurologic and developmental assessment,
    brain MRI and MRA, growth and orthopedic review, annual ocular assessment,
    periodic echocardiography, and pulmonary testing. These are expert-review
    recommendations for the broader mitochondrial proline-synthesis disorder
    group and should be individualized for ADCL.
  action_category: MONITORING
  treatment_term:
    preferred_term: clinical monitoring
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:41570168
    reference_title: Neurocutaneous Disorders due to Mitochondrial Proline Synthesis Defects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >
      Neurologic exam initially every six months then annually; EEG as clinically
      indicated; brain MRI every ten years or more frequently in those with
      imaging abnormalities or new neurologic concerns; monitor developmental
      progress and educational needs every six months initially then annually;
      assess growth at each visit; assess for orthopedic manifestations every six
      months until age one year then annually; anterior chamber evaluation to
      assess for corneal clouding and cataract annually; echocardiogram every
      three years or more frequently in those with abnormal findings; brain MR
      angiogram every ten years or more frequently in those with abnormal
      findings; peak flow measurements or pulmonary function tests every three
      years beginning at age eight years.
    explanation: The current expert review supplies a structured multisystem surveillance schedule.

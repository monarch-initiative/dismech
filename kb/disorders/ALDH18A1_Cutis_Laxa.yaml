diagnosis:
- name: Molecular genetic confirmation
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  description: >
    In a person with the characteristic neurocutaneous connective-tissue
    phenotype, diagnosis is established by identifying a specific heterozygous
    ALDH18A1 pathogenic variant associated with ADCL,
    typically de novo. An ALDH18A1 variant of uncertain significance neither
    establishes nor excludes the diagnosis.
  results: A specific heterozygous pathogenic ALDH18A1 variant associated with ADCL confirms the molecular diagnosis in the appropriate clinical context.
  evidence:
  - reference: PMID:41570168
    reference_title: Neurocutaneous Disorders due to Mitochondrial Proline Synthesis Defects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >
      characteristic clinical findings and identification of biallelic ALDH18A1
      or PYCR1 pathogenic variants or a de novo ALDH18A1 pathogenic variant
      associated with ALDH18A1-related ADCL.
    explanation: GeneReviews defines clinical-plus-molecular confirmation for the dominant subtype.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK620405/
    reference_title: Neurocutaneous Disorders due to Mitochondrial Proline Synthesis Defects - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: variant of uncertain significance) does not establish or rule out the diagnosis.

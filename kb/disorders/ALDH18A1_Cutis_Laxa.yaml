notes: >
  Phenotype scope follows subtype-specific evidence. The current GeneReviews
  chapter combines PYCR1-related ARCL, ALDH18A1-related ARCL, and
  ALDH18A1-related ADCL; its group-level intellectual-disability, autism, and
  ADHD statements do not identify which findings apply to ADCL and therefore
  are not modeled as ADCL phenotypes here. Lower-limb spasticity is retained
  because the full-text subtype table identifies spastic diplegia specifically
  in ALDH18A1-related ADCL. PMID:41570168 and the NBK620405 URL identify the same
  GeneReviews chapter; the URL cache supplies full-text passages absent from the
  PubMed abstract.

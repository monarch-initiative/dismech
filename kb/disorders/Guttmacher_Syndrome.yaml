description: |
  Guttmacher syndrome is an extremely rare, autosomal dominant malformation syndrome of the distal limbs and the distal genitourinary tract, allelic to hand-foot-genital syndrome (both caused by HOXA13, a homeobox transcription factor patterning the distal limb bud and the genital tract). It was described in 1993 in a single three-generation family (a man, his son, and his daughter) presenting with preaxial deficiencies of the hands and feet together with postaxial polydactyly of the hands, with glanular hypospadias in the affected males. Re-investigation of that family identified a heterozygous HOXA13 homeodomain missense variant (Q50L). Postaxial polydactyly of the hands and uniphalangeal second toes with absent nails are features not seen in hand-foot-genital syndrome, and on that basis the condition was judged a distinct entity, though the two disorders are increasingly regarded as ends of one HOXA13 phenotypic spectrum.

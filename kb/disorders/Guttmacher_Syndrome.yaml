pathophysiology:
- name: HOXA13 Homeodomain Missense Variant
  biological_scale: MOLECULAR
  description: |
    A heterozygous missense variant in the HOXA13 homeobox (c.1112A>T, Q50L) alters a key residue in the recognition helix of the homeodomain and is predicted to perturb the DNA-binding transcription-factor activity of HOXA13, with both a loss and a specific gain of function. The variant arose on an allele also carrying a 2-bp deletion in the gene's conserved promoter; that deletion produces no abnormality on its own but may contribute to the phenotype.
  genes:
  - preferred_term: HOXA13
    term:
      id: hgnc:5102
      label: HOXA13
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  evidence:
  - reference: PMID:11968094
    reference_title: A HOXA13 allele with a missense mutation in the homeobox and a dinucleotide deletion
      in the promoter underlies Guttmacher syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: affected individuals are heterozygous for a novel missense mutation in the HOXA13 homeobox
      (c.1112A>T; homeodomain residue Q50L)
    explanation: Identifies the causal HOXA13 homeodomain missense variant in the original family.
  - reference: PMID:11968094
    reference_title: A HOXA13 allele with a missense mutation in the homeobox and a dinucleotide deletion
      in the promoter underlies Guttmacher syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: The missense mutation, which alters a key residue in the recognition helix of the homeodomain,
      is likely to perturb HOXA13's DNA-binding properties, resulting in both a loss and a specific gain
      of function.
    explanation: States the predicted effect of the variant on HOXA13 DNA-binding transcription-factor
      activity.
  downstream:
  - target: Disrupted Autopod Patterning
    causal_link_type: DIRECT
    description: Perturbed HOXA13 transcription-factor activity disrupts patterning of the distal limb
      bud.
  - target: Disrupted Male Urethral Development
    causal_link_type: DIRECT
    description: The same HOXA13 defect disrupts development of the distal male urethra.
- name: Disrupted Autopod Patterning
  biological_scale: TISSUE
  description: |
    Loss of normal HOXA13-dependent regionalization of the autopod produces the combined preaxial deficiency and postaxial polydactyly of the hands and the distal foot anomalies. The mechanistic link from HOXA13 dysfunction to limb patterning is inferred from HOXA13's established role in distal limb morphogenesis; the limb abnormalities themselves are observed in the family.

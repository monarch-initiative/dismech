genetic:
- name: HOXA13
  gene_term:
    preferred_term: HOXA13
    term:
      id: hgnc:5102
      label: HOXA13
  association: Causative (provisional; single family)
  variant_origin: GERMLINE
  variants:
  - name: p.Gln50Leu (Q50L)
    description: |
      Heterozygous missense variant c.1112A>T in the HOXA13 homeobox, altering homeodomain residue 50 in the recognition helix. Found on an allele also carrying a 2-bp promoter deletion (-78_-79delGC).
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:11968094
      reference_title: A HOXA13 allele with a missense mutation in the homeobox and a dinucleotide deletion
        in the promoter underlies Guttmacher syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: affected individuals are heterozygous for a novel missense mutation in the HOXA13 homeobox
        (c.1112A>T; homeodomain residue Q50L), which arose on an allele already carrying a novel 2-bp
        deletion (-78-79delGC) in the gene's highly conserved promoter region
      explanation: Reports the causal missense variant and the cis promoter deletion in the original family.
  notes: |
    The gene-disease link rests on a single re-investigated family (Innis et al. 2002, PMID:11968094) and is marked provisional in OMIM (#176305); no independent validity tier is recorded here because no external body has classified HOXA13 for Guttmacher syndrome specifically. The only ClinGen gene-disease validity assertion for HOXA13 (CGGV:assertion_a138effd-f406-4791-b0eb-1f7f89c381d7-2025-07-22T160000.000Z, Definitive) is for hand-foot-genital syndrome (MONDO:0007698), a distinct MONDO entity, so it is not copied onto this entry. relationship_type is left unset and the free-text association records the provisional status.

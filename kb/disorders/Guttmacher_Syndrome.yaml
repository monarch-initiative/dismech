diagnosis:
- name: Clinical Evaluation of Distal Limb and Urogenital Anomalies
  description: |
    Clinical examination of the hands, feet, and external genitalia identifies the characteristic combination of preaxial deficiency of the thumbs and halluces, postaxial hand polydactyly, uniphalangeal second toes with absent nails, and glanular hypospadias in males, distinguishing Guttmacher syndrome from classic hand-foot-genital syndrome.
  diagnosis_term:
    preferred_term: Clinical Evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:8484413
    reference_title: Autosomal dominant preaxial deficiency, postaxial polydactyly, and hypospadias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report on 3 individuals, a man and his son and daughter, who were born with preaxial deficiencies
      of the hands and feet and postaxial polydactyly of the hands. Both males also had glandular hypospadias.
    explanation: Summarizes the diagnostic clinical constellation of distal limb and urogenital anomalies
      in Guttmacher syndrome.
  - reference: PMID:11968094
    reference_title: A HOXA13 allele with a missense mutation in the homeobox and a dinucleotide deletion
      in the promoter underlies Guttmacher syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The presence of features not seen in HFGS, however, including postaxial polydactyly of the
      hands and uniphalangeal 2(nd) toes with absent nails, suggests that it represents a distinct entity.
    explanation: Identifies the clinical findings that distinguish Guttmacher syndrome from typical hand-foot-genital
      syndrome.
- name: HOXA13 Molecular Genetic Testing
  description: |
    Sequence analysis of the HOXA13 coding region and promoter confirms the molecular diagnosis by detecting pathogenic homeobox missense variants (such as c.1112A>T, p.Gln50Leu) and associated cis-regulatory alleles.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:11968094
    reference_title: A HOXA13 allele with a missense mutation in the homeobox and a dinucleotide deletion
      in the promoter underlies Guttmacher syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: affected individuals are heterozygous for a novel missense mutation in the HOXA13 homeobox
      (c.1112A>T; homeodomain residue Q50L), which arose on an allele already carrying a novel 2-bp deletion
      (-78-79delGC) in the gene's highly conserved promoter region
    explanation: Molecular genetic analysis of HOXA13 establishes the genetic etiology in affected family
      members.
differential_diagnoses:
- name: Hand-foot-genital syndrome
  disease_term:
    preferred_term: hand-foot-genital syndrome
    term:
      id: MONDO:0007698
      label: hand-foot-genital syndrome
  description: |
    Allelic HOXA13-related disorder (its own dismech entry) with overlapping distal limb and genital features, including hypoplastic first digits and hypospadias.
  distinguishing_features:
  - Postaxial polydactyly of the hands and uniphalangeal second toes with absent nails occur in Guttmacher
    syndrome but not in hand-foot-genital syndrome; conversely, Mullerian (uterine) fusion anomalies in
    affected females are characteristic of hand-foot-genital syndrome and were not reported in the Guttmacher
    family. The two are increasingly viewed as one HOXA13 spectrum.
  evidence:
  - reference: PMID:11968094
    reference_title: A HOXA13 allele with a missense mutation in the homeobox and a dinucleotide deletion
      in the promoter underlies Guttmacher syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The presence of features not seen in HFGS, however, including postaxial polydactyly of the
      hands and uniphalangeal 2(nd) toes with absent nails, suggests that it represents a distinct entity.
    explanation: Gives the features that distinguish Guttmacher syndrome from hand-foot-genital syndrome.
  - reference: PMID:24934387
    reference_title: Severe manifestations of hand-foot-genital syndrome associated with a novel HOXA13
      mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Heterozygous HOXA13 mutations have been previously reported in hand-foot-genital syndrome
      and Guttmacher syndrome, which are variably associated with small nails, short distal and middle
      phalanges, short thumbs and halluces, but not absent nails.
    explanation: Frames hand-foot-genital and Guttmacher syndromes as variants of one HOXA13-related spectrum.
treatments:
- name: Surgical Correction
  description: |
    Surgical management as indicated: hypospadias repair in affected males and reconstructive or orthopaedic surgery for hand and foot anomalies.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Disrupted Autopod Patterning
    description: Reconstructive and orthopaedic surgery addresses structural hand and foot malformations
      resulting from abnormal autopod patterning.
  - target: Disrupted Male Urethral Development
    description: Surgical repair corrects glanular hypospadias resulting from disrupted distal male urethral
      development.
- name: Genetic Counseling
  description: |
    Genetic counseling for affected families given autosomal dominant inheritance and its recurrence risk.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
notes: |
  Guttmacher syndrome is curated as its own dismech Disease entry because it is a distinct MONDO/OMIM/Orphanet entity (MONDO:0008301; OMIM #176305; ORPHA:2957) with features - notably postaxial polydactyly of the hands and uniphalangeal second toes with absent nails - not seen in the allelic hand-foot-genital syndrome (MONDO:0007698), which has its own entry. The whole clinical picture derives from one three-generation family, and the HOXA13 gene-disease link is marked provisional in OMIM; later literature treats the two HOXA13 disorders as one phenotypic spectrum (PMID:24934387).

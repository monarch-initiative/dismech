discussions:
- discussion_id: mitochondrial_contribution_to_cardiomyopathy
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Dilated cardiomyopathy
  - phenotypes#Hypertrophic cardiomyopathy
  - phenotypes#Mitochondrial DNA depletion in muscle
  - phenotypes#Hepatomegaly
  prompt: >-
    Do all children with TOP3A Bloom-like disease have impaired mitochondrial
    DNA maintenance, and does it cause their cardiomyopathy?
  rationale: >-
    TOP3A also has a mitochondrial isoform needed to separate replicated mtDNA.
    Cardiomyopathy is not a Bloom syndrome feature. It occurred in several
    TOP3A children, and one had 87% muscle mtDNA depletion. Two Bloom-like
    alleles only partially rescued mtDNA loss in cells, and patient-derived
    cells from a later family had a respiration defect that a missense allele
    failed to rescue. Muscle mtDNA was measured in only one index patient, and
    no study has measured mtDNA in the heart of a Bloom-like patient. The
    pathograph therefore has no mitochondrial node. These phenotypes are left
    unconnected until mtDNA maintenance is shown to fail in every case, or the
    cardiomyopathy is shown to follow from it.
  evidence:
  - reference: PMID:30057030
    reference_title: "Mutations in TOP3A Cause a Bloom Syndrome-like Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical features of mitochondrial dysfunction are evident in several individuals with biallelic TOP3A mutations, consistent with the recently reported additional function of TopIIIα in mitochondrial DNA decatenation."
    explanation: The index study links the cardiac and mtDNA findings to the mitochondrial role, as an interpretation.
  - reference: PMID:29290614
    reference_title: "Topoisomerase 3α Is Required for Decatenation and Segregation of Human mtDNA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We here demonstrate that the mitochondrial isoform of topoisomerase 3α (Top3α) fulfills this function, acting independently of its nuclear role as a component of the Holliday junction-resolving BLM-Top3α-RMI1-RMI2 (BTR) complex."
    explanation: Establishes the mitochondrial decatenation function of TOP3A on which the hypothesis rests.
  - reference: PMID:37013609
    reference_title: "Pathological variants in TOP3A cause distinct disorders of mitochondrial and nuclear genome stability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both of these Bloom syndrome-associated variants also showed only a limited capacity to ameliorate the mtDNA copy number loss and structural phenotypes associated with TOP3A depletion in rescue experiments."
    explanation: Two Bloom-like alleles are defective for mtDNA maintenance in a cell rescue system.
  - reference: PMID:33631320
    reference_title: "Predominant cellular mitochondrial dysfunction in the TOP3A gene-caused Bloom syndrome-like disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, reduced mitochondrial ATP generation and oxygen consumption rates observed in TOP3A defective cells were rescued by over-expression of the wildtype TOP3A, but not TOP3A-D479G."
    explanation: Patient-cell respiration defect that a Bloom-like allele fails to rescue.
notes: >-
  Scope. This entry covers the childhood Bloom syndrome-like TOP3A disorder
  (OMIM:618097). It is kept separate from BLM-related Bloom syndrome
  (Bloom_Syndrome), which models the shared BTRR dissolution mechanism
  through BLM loss. Adult-onset TOP3A mitochondrial disease (ptosis, external
  ophthalmoplegia, myopathy, axonal neuropathy, multiple mtDNA deletions) has
  its own MONDO concept: MONDO:0020845, progressive external ophthalmoplegia
  with mitochondrial DNA deletions, autosomal recessive 5 (OMIM:618098). MONDO
  links TOP3A by RO:0004003 to both concepts, so that disease is not folded in
  here. The same applies to the childhood mitochondrial presentations without
  Bloom-like features (cardiomyopathy, Leigh-like disease, hearing loss)
  described by PMID:42478104, PMID:41075683 and PMID:42481970. EMBO Mol Med
  2023 (PMID:37013609) proposes that the Bloom-like presentation reflects more
  severe catalytic loss than the mitochondrial presentations. The
  mitochondrial phenotypes reported in Bloom-like patients (cardiomyopathy,
  muscle mtDNA depletion) are kept as phenotypes of this entry. They are not
  wired to a mechanism node; see the mitochondrial_contribution_to_cardiomyopathy
  discussion. No malignancy had been reported at publication, but all index
  patients were under 16 years old, and cancer risk is not established.
  No GeneReviews or StatPearls chapter names this disorder: `just
  check-genereviews --online` returned NO_CHAPTER for both against the
  2026-09-10 Bookshelf index and a live PubMed title search.

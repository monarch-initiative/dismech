    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "indicating that diagnostic cytogenetic assessment of SCE levels is predictive of TOP3A mutations as well as BLM mutations"
    explanation: States the diagnostic value of SCE testing for TOP3A disease.
  - reference: PMID:30057030
    reference_title: "Mutations in TOP3A Cause a Bloom Syndrome-like Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hence, analysis of other BTRR components is now warranted when elevated SCEs are detected."
    explanation: Recommends testing the BTRR genes when SCE is elevated.

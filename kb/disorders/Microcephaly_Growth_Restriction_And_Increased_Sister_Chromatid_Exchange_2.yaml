diagnosis:
- name: Sister chromatid exchange analysis
  description: >-
    BrdU differential staining of cultured lymphocytes or fibroblasts shows
    elevated SCE, as in BLM-related Bloom syndrome. An elevated SCE rate is
    therefore not specific to BLM and should prompt analysis of the other BTRR
    genes, including TOP3A.
  diagnosis_term:
    preferred_term: cytogenetic analysis
    term:
      id: NCIT:C18280
      label: Cytogenetic Analysis
  evidence:
  - reference: PMID:30057030

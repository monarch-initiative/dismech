name: Microcephaly, Growth Restriction, and Increased Sister Chromatid Exchange 2
creation_date: "2026-10-11T00:00:00Z"
category: Mendelian
parents:
- microcephaly, growth restriction and increased sister chromatid exchange
- chromosomal instability syndrome
description: >-
  Microcephaly, growth restriction, and increased sister chromatid exchange 2
  (MGRISCE2) is an autosomal recessive Bloom syndrome-like microcephalic
  primordial dwarfism caused by biallelic hypomorphic variants in TOP3A, which
  encodes topoisomerase III alpha. TOP3A is the decatenase of the
  BLM-TOP3A-RMI1-RMI2 (BTRR) complex that dissolves double Holliday junctions
  without crossover. The index series described ten children from seven
  families with prenatal-onset growth restriction, microcephaly and short
  stature, multiple cafe-au-lait macules, and a 3- to 6-fold increase in
  sister chromatid exchanges in cultured cells. Unlike BLM-related Bloom
  syndrome, none had the photosensitive malar rash, and no malignancy had been
  reported, although all were children. Several affected children also had
  dilated or hypertrophic cardiomyopathy, and one had marked muscle
  mitochondrial DNA depletion, findings attributed to the separate
  mitochondrial function of TOP3A.
disease_term:
  preferred_term: microcephaly, growth restriction, and increased sister chromatid exchange 2
  term:
    id: MONDO:0020628
    label: microcephaly, growth restriction, and increased sister chromatid exchange 2
synonyms:
- MGRISCE2
- TOP3A-related Bloom syndrome-like disorder
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0034991
      label: intrauterine growth restriction-congenital multiple café-au-lait macules-increased sister chromatid exchange syndrome
    mapping_predicate: skos:closeMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0034991 is the Orphanet-derived (ORPHA:508512) phenotype-defined
      concept whose definition describes this clinical picture without naming
      a gene. It is kept as a closeMatch rather than an exactMatch because it is
      defined by phenotype and could include BTRR disorders other than the
      TOP3A-defined OMIM:618097 entity.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry biallelic TOP3A variants (homozygous in most
    families, compound heterozygous in one), and all tested parents were
    heterozygous carriers.
  evidence:
  - reference: PMID:30057030
    reference_title: "Mutations in TOP3A Cause a Bloom Syndrome-like Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All variants identified were validated by Sanger capillary sequencing, and all parents were confirmed to be heterozygous carriers."
    explanation: >-
      Biallelic variants in affected children with heterozygous unaffected
      parents across the index families support autosomal recessive
      inheritance.
pathophysiology:
- name: Biallelic Hypomorphic TOP3A Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Most disease alleles are frameshifts expected to undergo nonsense-mediated
    decay, and patient fibroblasts show markedly reduced full-length
    topoisomerase III alpha. The index study interprets the alleles as severe
    hypomorphs rather than nulls, consistent with early embryonic lethality of
    complete Top3a loss in mice.
  genes:
  - preferred_term: TOP3A
    term:
      id: hgnc:11992
      label: TOP3A
  molecular_functions:
  - preferred_term: topoisomerase III alpha single-strand DNA decatenation activity
    modifier: DECREASED
    term:
      id: GO:0003917
      label: DNA topoisomerase type I (single strand cut, ATP-independent) activity
  evidence:
  - reference: PMID:30057030
    reference_title: "Mutations in TOP3A Cause a Bloom Syndrome-like Disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunoblotting demonstrated that the amount of full-length TopIIIα was substantially lower in total cell lysates from all three individuals than in cell lines from unrelated control individuals and parents"
    explanation: >-
      Patient-derived dermal fibroblasts (P1, P7, P8) directly show reduced
      TOP3A protein.
  - reference: PMID:30057030
    reference_title: "Mutations in TOP3A Cause a Bloom Syndrome-like Disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we conclude that all of the identified mutations result in marked but most likely hypomorphic loss of function of TopIIIα as a result of a reduction in the cellular amount of the protein"
    explanation: >-
      The authors' synthesis of the protein and biochemical data classifies
      the alleles as hypomorphic loss of function.
  - reference: PMID:37013609
    reference_title: "Pathological variants in TOP3A cause distinct disorders of mitochondrial and nuclear genome stability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "variants that cause a severe loss of enzymatic activity result in a Bloom syndrome-like disorder with mitochondrial phenotypes in childhood"
    explanation: >-
      Recombinant-enzyme and cellular rescue assays place the Bloom-like
      alleles at the severe end of TOP3A catalytic impairment.
  - reference: PMID:9448276
    reference_title: "Mammalian DNA topoisomerase IIIalpha is essential in early embryogenesis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "no viable top3alpha-/- homozygotes were found among over 100 progeny of top3alpha+/- intercrosses"
    explanation: >-
      Complete loss of Top3a is embryonic lethal in mice, which is why the
      surviving human genotypes are interpreted as hypomorphic rather than
      null.
  downstream:
  - target: Impaired BTRR Double Holliday Junction Dissolution
    description: >-
      Reduced TOP3A abundance limits the decatenation step that the BTRR
      complex needs to dissolve double Holliday junctions.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30057030
      reference_title: "Mutations in TOP3A Cause a Bloom Syndrome-like Disorder."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Therefore, these mutations would be predicted to severely compromise the decatenation activity of the BTRR complex in dHJ dissolution in vivo."
      explanation: >-
        The authors infer the dissolution defect from the protein loss and
        then test it with the SCE assay (next edge); the sentence itself is a
        prediction.
- name: Impaired BTRR Double Holliday Junction Dissolution
  biological_scale: MOLECULAR
  description: >-
    TOP3A, with BLM, RMI1 and RMI2, converts double Holliday junctions into a
    hemicatenane and then decatenates it, giving only non-crossover products.
    Loss of TOP3A decatenase capacity leaves these joint molecules to be
    resolved by structure-specific nucleases or carried into mitosis.
  biological_processes:
  - preferred_term: double-strand break repair via homologous recombination
    modifier: ABNORMAL
    term:
      id: GO:0000724
      label: double-strand break repair via homologous recombination
  evidence:
  - reference: PMID:30057030
    reference_title: "Mutations in TOP3A Cause a Bloom Syndrome-like Disorder."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: "TOP3A encodes topoisomerase III alpha (TopIIIα), which binds to BLM as part of the BTRR complex, and promotes dissolution of double Holliday junctions arising during homologous recombination."
    explanation: Establishes the normal function of TOP3A that is lost in this disorder.
  downstream:
  - target: Excess Sister Chromatid Crossover Recombination
    description: >-
      Joint molecules that are not dissolved are resolved by nucleases that
      can generate crossovers between sister chromatids.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30057030
      reference_title: "Mutations in TOP3A Cause a Bloom Syndrome-like Disorder."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "dissolution by the BTRR complex yields non-crossover products only; second, resolution by endonucleases that cleave Holliday junctions generate both non-crossovers and crossover products that are visualized as SCEs"
      explanation: >-
        States why loss of dissolution shifts processing to a
        crossover-generating route that is read out as SCE.
  - target: Persistent DNA Entanglements in Mitosis
    description: >-
      Undecatenated recombination or replication intermediates persist as
      sister-chromatid links into mitosis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30057030
      reference_title: "Mutations in TOP3A Cause a Bloom Syndrome-like Disorder."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Impaired dHJ decatenation can result in persistently entangled sister chromatids that impede chromosome segregation at mitosis."
      explanation: Links the decatenation defect to persistent mitotic entanglement.
- name: Excess Sister Chromatid Crossover Recombination
  biological_scale: CELLULAR
  description: >-
    Patient cells undergo excessive crossover recombination between sister
    chromatids. Elevated sister chromatid exchange on BrdU differential
    staining is modelled as the cellular readout of this state.
  biological_processes:
  - preferred_term: mitotic recombination
    modifier: INCREASED
    term:
      id: GO:0006312
      label: mitotic recombination
  evidence:
  - reference: PMID:30057030
    reference_title: "Mutations in TOP3A Cause a Bloom Syndrome-like Disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Therefore, excessive crossover recombination was evident in all tested individuals with TOP3A mutations"
    explanation: >-
      SCE assays in patient fibroblasts and stimulated lymphocytes showed
      crossover hyper-recombination in every individual tested.
  - reference: PMID:33631320
    reference_title: "Predominant cellular mitochondrial dysfunction in the TOP3A gene-caused Bloom syndrome-like disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TOP3A deficiency moderately increased sister chromatid exchanges and decreased cell proliferation compared with BLM or RMI2 deficiency"
    explanation: >-
      An independent family's cellular studies replicate the SCE increase,
      while noting it is more moderate than in BLM deficiency.
- name: Persistent DNA Entanglements in Mitosis
  biological_scale: CELLULAR
  description: >-
    TOP3A-deficient patient fibroblasts show increased chromatin bridges,
    lagging chromatin, and PICH-positive ultrafine DNA bridges at anaphase,
    reflecting sister-chromatid links that were not removed before mitosis.
  evidence:
  - reference: PMID:30057030
    reference_title: "Mutations in TOP3A Cause a Bloom Syndrome-like Disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Additionally, increased numbers of ultrafine DNA bridges (UFBs) were revealed by immunostaining for PICH on DAPI-negative regions"
    explanation: >-
      Ultrafine bridges in P1 fibroblasts directly visualise persisting
      sister-chromatid entanglement in mitosis.
  downstream:
  - target: Chromosome Segregation Errors and Genome Instability
    description: >-
      Entangled sister chromatids cause segregation errors, micronuclei, and
      DNA damage carried into the next cell cycle.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30057030
      reference_title: "Mutations in TOP3A Cause a Bloom Syndrome-like Disorder."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Altogether, we conclude that impaired dHJ decatenation in TopIIIα-deficient cells results in both abnormal recombination and mitotic errors that lead to accumulation of DNA damage."
      explanation: The patient-cell study concludes that the mitotic errors lead to DNA damage accumulation.
- name: Chromosome Segregation Errors and Genome Instability
  biological_scale: CELLULAR
  description: >-
    Patient fibroblasts show more micronucleated cells and more 53BP1 nuclear
    bodies in G1, markers of chromosome missegregation and of DNA damage
    transmitted between cell cycles. These measurements come from a single
    intensively studied patient cell line (P1).
  biological_processes:
  - preferred_term: chromosome segregation
    modifier: ABNORMAL
    term:
      id: GO:0007059
      label: chromosome segregation
  evidence:
  - reference: PMID:30057030
    reference_title: "Mutations in TOP3A Cause a Bloom Syndrome-like Disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "analysis of DAPI-stained cells demonstrated substantially more micronucleated cells in the P1 fibroblast cell line than in control and parental cell lines"
    explanation: Micronuclei are a direct cellular consequence of chromosome segregation errors.
  downstream:
  - target: Prenatal growth restriction
    description: >-
      Genome instability is proposed to reduce cell viability during
      development, restricting fetal growth. The step from cellular genome
      instability to reduced developmental cell number has not been
      demonstrated in human tissue.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30057030
      reference_title: "Mutations in TOP3A Cause a Bloom Syndrome-like Disorder."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "The resulting genome instability arising from persistent chromatin bridges40, 41 and micronuclei42 could therefore impair cell viability during development, causing microcephaly and global growth restriction."
      explanation: >-
        The authors propose, rather than demonstrate, that genome instability
        causes the growth restriction; the edge is marked as having unknown
        intermediates.
  - target: Microcephaly
    description: >-
      The same proposed loss of developmental cell viability is the favoured
      explanation for reduced head and brain growth; it is not directly
      demonstrated in developing human brain.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30057030
      reference_title: "Mutations in TOP3A Cause a Bloom Syndrome-like Disorder."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "The resulting genome instability arising from persistent chromatin bridges40, 41 and micronuclei42 could therefore impair cell viability during development, causing microcephaly and global growth restriction."
      explanation: The authors' proposed mechanism explicitly names microcephaly.
  - target: Short stature
    description: >-
      Postnatal short stature is the continuation of the global growth
      restriction attributed to genome instability.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30057030
      reference_title: "Mutations in TOP3A Cause a Bloom Syndrome-like Disorder."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Unresolved DNA recombination and/or replication intermediates persist into mitosis, leading to chromosome segregation defects and genome instability that most likely explain the growth restriction seen in these subjects and in Bloom syndrome."
      explanation: >-
        The authors attribute the growth restriction, including the postnatal
        component, to genome instability, with an explicit hedge.
  - target: Low body weight
    description: >-
      Postnatal low weight is part of the same global growth restriction.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30057030
      reference_title: "Mutations in TOP3A Cause a Bloom Syndrome-like Disorder."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Unresolved DNA recombination and/or replication intermediates persist into mitosis, leading to chromosome segregation defects and genome instability that most likely explain the growth restriction seen in these subjects and in Bloom syndrome."
      explanation: The authors attribute the global growth restriction to genome instability, with an explicit hedge.

name: Triple A Syndrome
category: Mendelian
creation_date: '2026-07-09T12:00:00Z'
synonyms:
- Allgrove syndrome
- AAA syndrome
- Achalasia-Addisonianism-Alacrima syndrome
- 3A syndrome
- Achalasia-alacrima-adrenal insufficiency neurologic disorder
description: 'Triple A syndrome (Allgrove syndrome) is a rare autosomal recessive
  multisystem disorder caused by biallelic loss-of-function variants in AAAS, which
  encodes the nuclear pore complex protein ALADIN (alacrima-achalasia-adrenal
  insufficiency neurologic disorder). It is defined by a clinical triad of achalasia
  of the esophageal cardia, alacrima (deficient tear production), and
  adrenocorticotropin (ACTH)-resistant adrenal insufficiency, frequently
  accompanied by a progressive central and peripheral neurodegenerative disorder
  and autonomic dysfunction. ALADIN is a component of the nuclear pore complex;
  disease-associated mutations mislocalize it from the nuclear envelope to the
  cytoplasm, selectively impairing the nucleocytoplasmic import of DNA-repair and
  antioxidant defense proteins. The resulting hypersensitivity to oxidative stress
  and accumulated DNA damage preferentially injure adrenocortical, neuronal, and
  secretory tissues, producing the characteristic pattern of tissue-specific
  degeneration. Management is supportive and organ-directed: glucocorticoid (and,
  where needed, mineralocorticoid) replacement for adrenal insufficiency,
  myotomy/dilation for achalasia, and ocular lubrication for alacrima.'

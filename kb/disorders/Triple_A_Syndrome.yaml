      explanation: Supports a cell-type-specific transport role whose failure underlies selective tissue degeneration.
- name: Tissue-specific cellular degeneration
  description: >-
    The ALADIN nucleocytoplasmic-transport defect selectively affects tissues
    with high expression and dependence, producing adrenocortical failure,
    peripheral and central neurodegeneration, autonomic dysfunction, lacrimal
    gland hypofunction (alacrima), and oesophageal motor dysfunction
    (achalasia). ALADIN is expressed in neuroendocrine and cerebral structures,
    consistent with a role in normal development and maintenance of the
    peripheral and central nervous systems.

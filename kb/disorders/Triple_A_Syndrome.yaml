  evidence:
  - reference: PMID:16467144
    reference_title: "ALADINI482S causes selective failure of nuclear protein import and hypersensitivity to oxidative stress in triple A syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cell survival assay showed hypersensitivity of I482Sf to l-buthionine-(S,R)-sulfoximine (BSO), a glutathione-depleting agent."
    explanation: Demonstrates hypersensitivity of patient cells to oxidative (glutathione-depleting) stress.
  - reference: PMID:16467144
    reference_title: "ALADINI482S causes selective failure of nuclear protein import and hypersensitivity to oxidative stress in triple A syndrome."
    supports: SUPPORT

  downstream:
  - target: Impaired nuclear import and oxidative stress susceptibility
- name: Impaired nuclear import and oxidative stress susceptibility
  description: >
    ALADIN localization to the nuclear pore complex is required for selective nuclear
    protein import. Mutant or truncated ALADIN localizes to the cytoplasm rather than to
    the nuclear pore complex, impairing import of proteins involved in DNA repair and
    oxidative-stress homeostasis and sensitizing cells to oxidative damage.
  biological_processes:

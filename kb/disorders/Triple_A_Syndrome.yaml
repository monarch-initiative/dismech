pathophysiology:
- name: ALADIN loss and nuclear pore complex mislocalization
  description: >-
    ALADIN is a WD-repeat nucleoporin that normally localizes to the nuclear
    pore complex (NPC), the sole gateway for nucleocytoplasmic transport.
    Disease-associated missense, nonsense, and frameshift AAAS mutations fail
    to target ALADIN to the NPC, leaving it mislocalized in the cytoplasm.
    Nuclear envelopes and NPCs are structurally normal, so disease arises from
    a defect in NPC function rather than structure.
  genes:
  - preferred_term: AAAS
    term:
      id: hgnc:13666
      label: AAAS
  biological_processes:
  - preferred_term: nucleocytoplasmic transport
    term:
      id: GO:0006913
      label: nucleocytoplasmic transport
  cellular_components:
  - preferred_term: nuclear pore
    term:
      id: GO:0005643
      label: nuclear pore
  evidence:
  - reference: PMID:12730363
    reference_title: "The nuclear pore complex protein ALADIN is mislocalized in triple A syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We showed previously that ALADIN localizes to nuclear pore complexes (NPCs), large multiprotein assemblies that are the sole sites of nucleocytoplasmic transport."
    explanation: Establishes ALADIN as a nuclear pore complex protein central to nucleocytoplasmic transport.
  - reference: PMID:12730363
    reference_title: "The nuclear pore complex protein ALADIN is mislocalized in triple A syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A variety of disease-associated missense, nonsense, and frameshift mutations failed to localize to NPCs and were found predominantly in the cytoplasm."
    explanation: Shows disease mutations mislocalize ALADIN away from the NPC into the cytoplasm.
  downstream:
  - target: Selective failure of nuclear protein import
    description: NPC mistargeting of ALADIN disrupts NPC function and selective nuclear import.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12730363
      reference_title: "The nuclear pore complex protein ALADIN is mislocalized in triple A syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "these findings indicate that defects in NPC function, rather than structure, give rise to triple A syndrome"
      explanation: Links ALADIN mislocalization to a functional NPC defect that drives disease.
- name: Selective failure of nuclear protein import
  description: >-
    Mistargeted ALADIN selectively impairs the karyopherin (importin)
    alpha/beta-mediated import pathway, decreasing nuclear accumulation of
    specific cargoes including the DNA single-strand-break repair protein
    aprataxin (APTX) and DNA ligase I, while sparing other import pathways.
  biological_processes:
  - preferred_term: protein import into nucleus
    term:
      id: GO:0006606
      label: protein import into nucleus
  cellular_components:
  - preferred_term: nuclear pore
    term:
      id: GO:0005643
      label: nuclear pore
  evidence:
  - reference: PMID:16467144
    reference_title: "ALADINI482S causes selective failure of nuclear protein import and hypersensitivity to oxidative stress in triple A syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ALADIN(I482S) affected a karyopherin-alpha/beta-mediated import pathway and decreased nuclear accumulations of aprataxin (APTX), a repair protein for DNA single-strand breaks (SSBs), and of DNA ligase I in I482Sf."
    explanation: Demonstrates selective impairment of nuclear import of DNA-repair proteins by mutant ALADIN.
  downstream:
  - target: Impaired DNA repair and oxidative stress hypersensitivity
    description: Reduced nuclear import of aprataxin and DNA ligase I compromises repair of DNA single-strand breaks.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16467144
      reference_title: "ALADINI482S causes selective failure of nuclear protein import and hypersensitivity to oxidative stress in triple A syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "indicating that ALADIN(I482S) selectively impaired transport of discrete import complexes through NPC"
      explanation: Selective import failure of repair factors links directly to a downstream DNA-repair deficit.
- name: Impaired DNA repair and oxidative stress hypersensitivity
  description: >-
    Deficient nuclear delivery of DNA single-strand-break repair machinery
    renders triple A syndrome cells hypersensitive to oxidative stress: on
    glutathione depletion, patient fibroblasts accumulate DNA single-strand
    breaks that they can no longer sufficiently repair. This nuclear oxidative
    vulnerability is proposed as a primary driver of the tissue-specific
    degeneration.
  biological_processes:
  - preferred_term: single strand break repair
    term:
      id: GO:0000012
      label: single strand break repair
  - preferred_term: DNA repair
    term:
      id: GO:0006281

name: Triple A Syndrome
category: Mendelian
creation_date: "2026-07-10T00:00:00Z"
synonyms:
- Allgrove syndrome
- AAA syndrome
- Achalasia-Addisonianism-Alacrima syndrome
- Adrenal insufficiency-achalasia-alacrima syndrome
- AAAS-related disorder
description: >
  Triple A syndrome (Allgrove syndrome) is a rare autosomal recessive
  multisystem disorder classically defined by the triad of achalasia,
  alacrima (deficient tear production), and adrenocorticotropin
  (ACTH)-resistant adrenal insufficiency, frequently accompanied by a
  progressive neurological phenotype (peripheral neuropathy, cerebellar
  ataxia, autonomic dysfunction, and mild dementia). It is caused by
  biallelic loss-of-function variants in AAAS, which encodes ALADIN, a
  WD-repeat protein of the nuclear pore complex. Disease-associated ALADIN
  mutants fail to localize to nuclear pore complexes and mislocalize to the
  cytoplasm, disrupting nucleocytoplasmic transport in a cell-type-specific
  manner and producing the tissue-restricted (adrenal, oesophageal, lacrimal,
  and neural) defects. Onset spans childhood to adulthood, and clinical
  manifestations are heterogeneous and can present late.

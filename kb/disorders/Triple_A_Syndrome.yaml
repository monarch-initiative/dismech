    explanation: Characterizes Triple A syndrome as a rare autosomal recessive disorder.
pathophysiology:
- name: AAAS Loss of Function and Defective ALADIN Nucleoporin
  description: >
    Biallelic loss-of-function variants in AAAS remove or truncate ALADIN, a
    WD-repeat protein of the nuclear pore complex. ALADIN normally localizes to
    nuclear pore complexes, the sole sites of nucleocytoplasmic transport.
  cell_types:
  - preferred_term: cortical cell of adrenal gland
    term:
      id: CL:0002097
      label: cortical cell of adrenal gland
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: nucleocytoplasmic transport
    term:
      id: GO:0006913
      label: nucleocytoplasmic transport
    modifier: DECREASED
  evidence:
  - reference: PMID:11062474
    reference_title: "Mutant WD-repeat protein in triple-A syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified a novel gene (AAAS) encoding a protein of 547 amino acids that is mutant in affected individuals"
    explanation: Identifies AAAS as the gene mutated in affected individuals with Triple A syndrome.
  - reference: PMID:11062474
    reference_title: "Mutant WD-repeat protein in triple-A syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The predicted product of AAAS, ALADIN (for alacrima-achalasia-adrenal insufficiency neurologic disorder), belongs to the WD-repeat family of regulatory proteins, indicating a new disease mechanism involved in triple-A syndrome."
    explanation: Establishes ALADIN as a WD-repeat protein and the product of AAAS.
  - reference: PMID:12730363
    reference_title: "The nuclear pore complex protein ALADIN is mislocalized in triple A syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We showed previously that ALADIN localizes to nuclear pore complexes (NPCs), large multiprotein assemblies that are the sole sites of nucleocytoplasmic transport."
    explanation: Localizes ALADIN to the nuclear pore complex, linking it to nucleocytoplasmic transport.
  downstream:
  - target: ALADIN Mislocalization and Impaired Nucleocytoplasmic Transport
    causal_link_type: DIRECT
    description: Disease-associated ALADIN mutants fail to reach the nuclear pore complex.
- name: ALADIN Mislocalization and Impaired Nucleocytoplasmic Transport
  description: >
    Disease-associated missense, nonsense, and frameshift ALADIN mutants fail
    to localize to nuclear pore complexes and accumulate in the cytoplasm.
    Because the nuclei and pore structures remain morphologically normal, the
    defect is one of nucleocytoplasmic transport function rather than pore
    structure, and its impact is cell-type-specific.
  biological_processes:
  - preferred_term: nucleocytoplasmic transport
    term:
      id: GO:0006913
      label: nucleocytoplasmic transport
    modifier: DECREASED
  evidence:
  - reference: PMID:12730363
    reference_title: "The nuclear pore complex protein ALADIN is mislocalized in triple A syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A variety of disease-associated missense, nonsense, and frameshift mutations failed to localize to NPCs and were found predominantly in the cytoplasm."
    explanation: Shows that pathogenic ALADIN mutants mislocalize away from the nuclear pore complex.
  - reference: PMID:12730363
    reference_title: "The nuclear pore complex protein ALADIN is mislocalized in triple A syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "these findings indicate that defects in NPC function, rather than structure, give rise to triple A syndrome"
    explanation: Attributes Triple A syndrome to a functional (transport) defect of the nuclear pore complex.
  downstream:
  - target: Tissue-Specific Adrenal, Oesophageal, Lacrimal, and Neural Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Impaired nucleocytoplasmic transport in vulnerable cell types produces
      the adrenal, oesophageal, lacrimal, and neurological features.
- name: Tissue-Specific Adrenal, Oesophageal, Lacrimal, and Neural Dysfunction
  description: >
    ALADIN dysfunction is thought to compromise a cell-type-specific role in
    regulating nucleocytoplasmic transport that is essential for maintenance
    and development of certain tissues, producing ACTH-resistant adrenal
    insufficiency (predominantly glucocorticoid deficiency), achalasia of the
    oesophageal cardia, alacrima, and progressive peripheral, central, and
    autonomic neurological involvement.
  cell_types:
  - preferred_term: cortical cell of adrenal gland
    term:
      id: CL:0002097
      label: cortical cell of adrenal gland
  biological_processes:
  - preferred_term: glucocorticoid biosynthetic process
    term:
      id: GO:0006704
      label: glucocorticoid biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:12730363
    reference_title: "The nuclear pore complex protein ALADIN is mislocalized in triple A syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We propose that ALADIN plays a cell type-specific role in regulating nucleocytoplasmic transport and that this function is essential for the proper maintenance andor development of certain tissues."
    explanation: Provides the mechanistic basis for the tissue-restricted phenotype of Triple A syndrome.
  - reference: PMID:11062474
    reference_title: "Mutant WD-repeat protein in triple-A syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "several lines of evidence indicate that triple-A syndrome results from the abnormal development of the autonomic nervous system"
    explanation: Links the neurological/autonomic features to abnormal autonomic nervous system development.
  downstream:
  - target: Primary adrenal insufficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Adrenocortical dysfunction produces ACTH-resistant (glucocorticoid-predominant) adrenal insufficiency.
  - target: Achalasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Enteric/autonomic dysfunction of the oesophageal cardia produces achalasia.
  - target: Alacrima
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Lacrimal gland dysfunction produces deficient tear production.
  - target: Peripheral neuropathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Progressive peripheral nerve involvement produces neuropathy.
  - target: Ataxia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Central nervous system involvement produces cerebellar ataxia.
  - target: Autonomic dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Autonomic nervous system involvement produces autonomic dysfunction.
  - target: Dementia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Progressive central nervous system involvement can produce mild dementia.

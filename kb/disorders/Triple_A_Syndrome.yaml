pathophysiology:
- name: AAAS/ALADIN nucleoporin loss of function
  description: >
    Biallelic loss-of-function variants in AAAS on chromosome 12q13 disrupt the
    WD-repeat nucleoporin ALADIN, a component of the nuclear pore complex. Most
    pathogenic alleles produce a truncated protein or mislocalize ALADIN from the
    nuclear pore to the cytoplasm.

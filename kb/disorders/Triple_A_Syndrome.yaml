- name: Oxidative stress hypersensitivity and impaired DNA repair
  description: 'Because nuclear import of DNA-repair and antioxidant defense
    proteins is compromised, ALADIN-deficient cells are hypersensitive to
    oxidative stress. Glutathione depletion (e.g., with buthionine sulfoximine) or
    hydrogen peroxide markedly reduces viability and impairs single-strand-break
    repair, and antioxidant treatment (N-acetylcysteine) is protective. Consequent
    DNA damage exceeding the limited DNA-repair capacity contributes to cell death
    in vulnerable tissues.'

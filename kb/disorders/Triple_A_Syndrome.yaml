genetic:
- name: AAAS pathogenic variants causing Triple A syndrome
  gene_term:
    preferred_term: AAAS
    term:
      id: hgnc:13666
      label: AAAS
  inheritance:
  - name: Autosomal recessive
    evidence:
    - reference: PMID:11062474
      reference_title: "Mutant WD-repeat protein in triple-A syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Triple-A syndrome (MIM 231550; also known as Allgrove syndrome) is an autosomal recessive disorder characterized by adrenocorticotropin hormone (ACTH)-resistant adrenal insufficiency, achalasia of the oesophageal cardia and alacrima."
      explanation: States that Triple A syndrome is an autosomal recessive disorder.
  variants:
  - name: AAAS c.938T>A (p.Val313Asp)
    description: >
      A missense AAAS variant in exon 10, identified in compound heterozygosity
      with a nonsense variant in a case of adult-onset Triple A syndrome.
    gene:
      preferred_term: AAAS
      term:
        id: hgnc:13666
        label: AAAS
    evidence:
    - reference: PMID:42415167
      reference_title: "Triple A syndrome with a new mutation pattern, first documented case in Austria: a case report with literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Long-read sequencing confirmed compound heterozygosity for two point mutations in the AAAS gene: a missense mutation, ENST00000209873.9:c.938T>A (p.Val313Asp) in exon 10, and a novel nonsense mutation, ENST00000209873.9:c.1264C>T (p.Gln422Ter) in exon 14."
      explanation: Identifies the missense AAAS variant confirmed in trans by long-read sequencing.
  - name: AAAS c.1264C>T (p.Gln422Ter)
    description: >
      A novel nonsense AAAS variant in exon 14, identified in compound
      heterozygosity with a missense variant.
    gene:
      preferred_term: AAAS
      term:
        id: hgnc:13666
        label: AAAS
    evidence:
    - reference: PMID:42415167
      reference_title: "Triple A syndrome with a new mutation pattern, first documented case in Austria: a case report with literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Long-read sequencing confirmed compound heterozygosity for two point mutations in the AAAS gene: a missense mutation, ENST00000209873.9:c.938T>A (p.Val313Asp) in exon 10, and a novel nonsense mutation, ENST00000209873.9:c.1264C>T (p.Gln422Ter) in exon 14."
      explanation: Identifies the novel nonsense AAAS variant.
  features: >
    Triple A syndrome is caused by biallelic loss-of-function variants in AAAS,
    encoding the WD-repeat nuclear pore protein ALADIN. Many truncating and
    missense mutations have been reported; a splice-donor founder mutation
    accounts for many North African cases.
treatments:
- name: Adrenal Hormone Replacement Therapy
  description: >
    Glucocorticoid (and, when mineralocorticoid deficiency is present,
    mineralocorticoid) replacement to treat the adrenal insufficiency
    component, using hydrocortisone and fludrocortisone.
  treatment_term:
    preferred_term: adrenal hormone replacement therapy
    term:
      id: MAXO:0001391
      label: adrenal hormone replacement therapy
    therapeutic_agent:
    - preferred_term: hydrocortisone
      term:
        id: CHEBI:17650
        label: cortisol
    - preferred_term: fludrocortisone
      term:
        id: CHEBI:50885
        label: fludrocortisone
  evidence:
  - reference: PMID:42415167
    reference_title: "Triple A syndrome with a new mutation pattern, first documented case in Austria: a case report with literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He was diagnosed with primary adrenal insufficiency in childhood and substituted with fludrocortisone and hydrocortisone."
    explanation: Documents hydrocortisone and fludrocortisone replacement for the adrenal insufficiency.
- name: Heller Myotomy
  description: >
    Surgical myotomy of the lower oesophageal sphincter to relieve achalasia,
    with endoscopic dilation as an adjunct.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: MAXO:0000004
      label: surgical procedure
  evidence:
  - reference: PMID:42415167
    reference_title: "Triple A syndrome with a new mutation pattern, first documented case in Austria: a case report with literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a 51-year-old male patient with recurring symptoms of dysphagia due to achalasia, who was previously treated by Heller myotomy and repeated endoscopic dilations"
    explanation: Documents Heller myotomy and endoscopic dilation used to treat the achalasia.
- name: Supportive and Ophthalmologic Care
  description: >
    Lubricating eye drops/artificial tears for alacrima and supportive
    management of the neurological features; there is no curative therapy.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care

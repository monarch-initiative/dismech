genetic:
- name: AAAS pathogenic variants
  gene_term:
    preferred_term: AAAS
    term:
      id: hgnc:13666
      label: AAAS
  features: 'Biallelic pathogenic variants in AAAS (chromosome 12q13), encoding the
    546/547-amino-acid WD-repeat nuclear pore protein ALADIN, cause triple A
    syndrome. Most variants are truncating (nonsense, frameshift, splice) and
    predict loss of function; a splice-donor founder mutation accounts for a strong
    founder effect in North African families. Compound heterozygosity is common.'

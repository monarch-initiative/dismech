notes: 'Triple A syndrome is a nucleoporin (ALADIN) disorder in which a
  cell-type-specific defect in nucleocytoplasmic transport, rather than a global
  transport failure, produces a strikingly tissue-restricted phenotype. The
  convergent oxidative-stress/DNA-repair mechanism links the adrenocortical and
  neuronal vulnerability, and provides the rationale for the observed protective
  effect of antioxidants in vitro (not yet an established clinical therapy). The
  classic triad may be incomplete at presentation and can evolve over decades, so
  genetic testing is recommended when two or more triad features (or associated
  neurological signs) are present. Adrenal insufficiency is the principal
  life-threatening manifestation and must be recognized and treated early.'

genetic:
- name: AAAS pathogenic variants
  gene_term:
    preferred_term: AAAS
    term:
      id: hgnc:13666
      label: AAAS
  association: Loss-of-function
  presence: Positive
  notes: >-
    AAAS encodes ALADIN, a 547-amino-acid WD-repeat protein of the nuclear pore
    complex. Truncating, missense, and splice-site variants are described;
    compound heterozygous point mutations (e.g., c.938T>A p.Val313Asp and the
    nonsense c.1264C>T p.Gln422Ter) have been confirmed in trans by long-read
    sequencing.
  evidence:
  - reference: PMID:11062474
    reference_title: "Mutant WD-repeat protein in triple-A syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified a novel gene (AAAS) encoding a protein of 547 amino acids that is mutant in affected individuals"
    explanation: Identifies AAAS as the causative gene of triple-A syndrome.
  - reference: PMID:42415167
    reference_title: "Triple A syndrome with a new mutation pattern, first documented case in Austria: a case report with literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-read sequencing confirmed compound heterozygosity for two point mutations in the AAAS gene: a missense mutation, ENST00000209873.9:c.938T>A (p.Val313Asp) in exon 10, and a novel nonsense mutation, ENST00000209873.9:c.1264C>T (p.Gln422Ter) in exon 14."
    explanation: Documents biallelic (compound heterozygous) AAAS variants confirmed in trans.

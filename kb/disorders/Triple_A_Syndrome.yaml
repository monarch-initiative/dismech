name: Triple A Syndrome
creation_date: '2026-07-13T23:30:00Z'
category: Genetic
synonyms:
- Allgrove syndrome
- AAA syndrome
- achalasia-addisonianism-alacrima syndrome
- adrenal insufficiency-achalasia-alacrima syndrome
- ALADIN deficiency
description: >-
  Triple A syndrome (Allgrove syndrome) is a rare autosomal recessive
  multisystem disorder caused by biallelic loss-of-function variants in AAAS,
  which encodes the nuclear pore complex protein ALADIN. It is classically
  defined by a triad of achalasia of the oesophageal cardia, alacrima
  (deficient tear secretion), and adrenocorticotropin (ACTH)-resistant primary
  adrenal insufficiency, with variable and often progressive neurological
  involvement (peripheral and central neuropathy, autonomic dysfunction,
  cerebellar ataxia, and mild dementia). Disease-associated ALADIN mutants fail
  to target the nuclear pore complex and selectively impair nucleocytoplasmic
  import of DNA-repair factors, rendering cells hypersensitive to oxidative
  stress; this cell-type-specific defect in nuclear transport underlies the
  degeneration of adrenocortical, neuronal, lacrimal, and oesophageal tissues.
  Clinical manifestations are heterogeneous and can present unusually late in
  life.

      label: response to oxidative stress
    modifier: ABNORMAL
  evidence:
  - reference: PMID:32533814
    reference_title: "Triple-A Syndrome (TAS): An In-Depth Overview on Genetic and Phenotype Heterogeneity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunohistochemical analysis showed that mutated or truncated ALADIN localizes to the cytoplasm rather than to the nuclear pore complex."
    explanation: Documents mislocalization of mutant ALADIN away from the nuclear pore complex.
  - reference: PMID:32533814
    reference_title: "Triple-A Syndrome (TAS): An In-Depth Overview on Genetic and Phenotype Heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the role of ALADIN as a member of the Nuclear Pore Complex not only implicated in the import of proteins involved in DNA repair and oxidative stress homeostasis but also in the strengthening of the mitotic spindle assembly"
    explanation: Links ALADIN nuclear-pore function to import of DNA-repair and oxidative-stress proteins.
  - reference: PMID:19703420
    reference_title: The transmembrane nucleoporin NDC1 is required for targeting of ALADIN to nuclear pore complexes.

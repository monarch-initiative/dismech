name: Triple A Syndrome
category: Mendelian
creation_date: '2026-07-13T00:00:00Z'
synonyms:
- Allgrove syndrome
- Triple-A syndrome
- AAA syndrome
- Achalasia-Addisonianism-Alacrima syndrome
- ACTH resistance with achalasia and alacrima
- AAAS-related disorder
description: >
  Triple A syndrome (Allgrove syndrome) is a rare autosomal recessive multisystem
  disorder classically defined by the triad of ACTH-resistant adrenal insufficiency,
  achalasia of the esophageal cardia, and alacrima (deficient tear production). It is
  caused in more than 90% of cases by biallelic loss-of-function variants in AAAS on
  chromosome 12q13, which encodes the WD-repeat nucleoporin ALADIN, a component of the
  nuclear pore complex. Mutant or truncated ALADIN mislocalizes from the nuclear pore
  to the cytoplasm and impairs selective nuclear import of proteins involved in DNA
  repair and oxidative-stress homeostasis, rendering cells (notably adrenal cortical
  cells and neurons) vulnerable to oxidative damage. Alacrima is typically the earliest
  and most consistent feature, while achalasia and adrenal insufficiency are the usual
  presenting manifestations; a progressive neurodegenerative phenotype (autonomic
  dysfunction, peripheral neuropathy, optic atrophy, amyotrophy) and dermatological
  changes (hyperpigmentation, palmoplantar hyperkeratosis) emerge over time. There is
  high phenotypic heterogeneity, and adrenal insufficiency may be life-threatening if
  unrecognized. Management is supportive and organ-directed: glucocorticoid (and where
  needed mineralocorticoid) replacement, treatment of achalasia by pneumatic dilatation
  or Heller myotomy, and artificial tears.

treatments:
- name: TNF Inhibitor Therapy
  description: >-
    Because ORAS is driven by dysregulated TNF signaling and TNF-induced cell
    death, TNF inhibition is mechanistically rational and ameliorates
    inflammation in patients. Agents used include the monoclonal antibodies
    infliximab and adalimumab and the receptor-fusion protein etanercept;
    because the class spans both antibody and fusion-protein platforms, no single
    therapeutic_modality value is asserted.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: infliximab
      term:
        id: NCIT:C1789
        label: Infliximab
    - preferred_term: adalimumab
      term:
        id: NCIT:C65216
        label: Adalimumab
    - preferred_term: etanercept
      term:
        id: NCIT:C2381
        label: Etanercept
  target_mechanisms:
  - target: Sensitisation to TNF-Induced Cell Death
    description: >-
      Neutralizing TNF interrupts the TNF signaling and TNF-induced death that
      drive ORAS inflammation.
    evidence:
    - reference: PMID:30804083
      reference_title: "OTULIN deficiency in ORAS causes cell type-specific LUBAC degradation, dysregulated TNF signalling and cell death."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Treatment with TNF inhibitors such as antibodies (e.g. infliximab) or TNF
        blockers (e.g. etanercept) effectively ameliorates inflammation, but there
        is currently no cure for ORAS.
      explanation: >-
        Documents that TNF inhibitors ameliorate ORAS inflammation, the target of
        this therapy.
  evidence:
  - reference: PMID:30804083
    reference_title: "OTULIN deficiency in ORAS causes cell type-specific LUBAC degradation, dysregulated TNF signalling and cell death."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with TNF inhibitors such as antibodies (e.g. infliximab) or TNF
      blockers (e.g. etanercept) effectively ameliorates inflammation, but there
      is currently no cure for ORAS.
    explanation: >-
      Direct evidence that TNF inhibition ameliorates inflammation in ORAS.
- name: IL-1 Blockade (anakinra)
  description: >-
    IL-1 blockade was tried but, unlike TNF inhibition, did not improve symptoms
    in a reported patient, consistent with TNF rather than IL-1 as the dominant
    driver.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anakinra
      term:
        id: NCIT:C38717
        label: Anakinra
  evidence:
  - reference: PMID:30804083
    reference_title: "OTULIN deficiency in ORAS causes cell type-specific LUBAC degradation, dysregulated TNF signalling and cell death."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      anakinra was added to the treatment regimen without any improvement of her
      symptoms
    explanation: >-
      Refutes efficacy of IL-1 blockade: the patient did not improve on anakinra.
- name: Hematopoietic Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  description: >-
    Allogeneic haematopoietic stem cell transplantation produced complete
    resolution of inflammation in a transplanted patient, demonstrating that
    haematopoietic cells drive the clinical disease. The disease relapsed nine
    months later as donor chimerism fell, so HSCT is potentially curative rather
    than an established cure.
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Systemic Autoinflammation
    description: >-
      Replacing the patient's haematopoietic compartment removes the
      OTULIN-deficient inflammatory cells that drive disease.
    evidence:
    - reference: PMID:30804083
      reference_title: "OTULIN deficiency in ORAS causes cell type-specific LUBAC degradation, dysregulated TNF signalling and cell death."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        haematopoietic cells are necessary for clinical manifestation of ORAS
      explanation: >-
        Establishes the haematopoietic compartment as the driver that transplant
        replaces.
  evidence:
  - reference: PMID:30804083
    reference_title: "OTULIN deficiency in ORAS causes cell type-specific LUBAC degradation, dysregulated TNF signalling and cell death."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      haematopoietic stem cell transplantation leads to complete resolution of
      inflammatory symptoms, including fevers, panniculitis and diarrhoea
    explanation: >-
      Documents complete resolution of ORAS inflammation immediately after
      transplant.
  - reference: PMID:30804083
    reference_title: "OTULIN deficiency in ORAS causes cell type-specific LUBAC degradation, dysregulated TNF signalling and cell death."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      relapsed with fevers, panniculitis and arthritis, albeit with less severe
      symptoms than before the transplantation
    explanation: >-
      Documents post-transplant relapse at nine months as donor chimerism fell,
      so the result is not an established cure.
diagnosis:
- name: Molecular and inflammatory-marker diagnosis
  description: >-
    Diagnosis rests on identifying biallelic OTULIN variants by gene or exome
    sequencing together with laboratory evidence of systemic inflammation
    (leukocytosis and elevated CRP/ESR).
  evidence:
  - reference: PMID:40734169
    reference_title: "Expanding the phenotypic and genetic spectrum of ORAS with novel homozygous variant in OTULIN gene: a case series and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      leukocytosis, and high inflammatory markers
    explanation: >-
      Laboratory inflammation (leukocytosis, high inflammatory markers)
      accompanies the molecular diagnosis.
  - reference: PMID:40734169
    reference_title: "Expanding the phenotypic and genetic spectrum of ORAS with novel homozygous variant in OTULIN gene: a case series and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing (WES) revealed a novel homozygous pathogenic
      mutation in the OTULIN gene
    explanation: >-
      Molecular diagnosis is by sequencing (whole-exome) identifying the biallelic
      OTULIN variant.
animal_models:
- name: Myeloid-specific Otulin knockout mouse (LysM-Cre)
  species: Mouse
  genotype: Otulin conditional knockout; LysM-Cre (myeloid-restricted deletion)
  publication: PMID:27523608
  modeled_mechanisms:
  - target: Increased Canonical NF-kB Signaling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Myeloid Otulin deletion reproduces the M1-Ub accumulation and spontaneous
      NF-kappaB activation of the human myeloid arm.
    limitations: >-
      The deletion is myeloid-restricted, so it models the myeloid NF-kappaB arm
      but does not spontaneously reproduce the panniculitis and diarrhoea of
      human ORAS.
    evidence:
    - reference: PMID:27523608
      reference_title: "The Deubiquitinase OTULIN Is an Essential Negative Regulator of Inflammation and Autoimmunity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        accumulation of M1-linked polyubiquitin and spontaneous NF-κB activation
        in myeloid cells
      explanation: >-
        The LysM-Cre myeloid Otulin knockout shows M1-Ub accumulation and
        spontaneous NF-kappaB activation.
prevalence:
- population: Reported ORAS case series and literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    ORAS is ultra-rare; a 2025 pooled case series and literature review totalled
    13 reported patients. That total includes heterozygous dominant-negative
    (p.C129S) cases, a distinct form from the autosomal-recessive disease this
    entry scopes; see the entry-level note.
  evidence:
  - reference: PMID:40734169
    reference_title: "Expanding the phenotypic and genetic spectrum of ORAS with novel homozygous variant in OTULIN gene: a case series and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients with ORAS observed in our series and reported literature (n = 13)
    explanation: >-
      Pooled series and literature review totals 13 reported ORAS patients.
notes: >-
  Named for the causal gene and the established names (otulipenia, ORAS); the
  MONDO label "autoinflammation, panniculitis, and dermatosis syndrome,
  autosomal recessive" (AIPDS) is retained as a synonym. OTULIN is M1
  (linear)-linkage-specific; the generic protein-deubiquitination GO term is used
  because no M1/linear-specific deubiquitination term is available. No mechanism
  module is conformed to: there is no dismech LUBAC / linear-ubiquitin / TNF-NF-kB
  autoinflammation module, consistent with the sibling LUBAC-axis entries (A20
  haploinsufficiency, HOIP deficiency), which are likewise unconformed. OTULIN
  haploinsufficiency (autosomal dominant; susceptibility to Staphylococcus aureus
  alpha-toxin-mediated necrosis; PMID:35587511) is a mechanistically distinct
  allelic disorder and is deliberately out of scope for this autosomal-recessive
  entry; it should be curated separately rather than folded in here. A
  heterozygous dominant-negative OTULIN variant (p.C129S) has also been reported
  (PMID:40734169) and is likewise outside this recessive entry's scope.

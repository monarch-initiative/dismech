- name: Impaired Linear Deubiquitination
  biological_scale: MOLECULAR
  description: >-
    OTULIN normally removes M1 (linear)-linked polyubiquitin assembled by LUBAC.
    Reduced activity leaves a defect in linear deubiquitination and accumulation
    of linear ubiquitin aggregates.

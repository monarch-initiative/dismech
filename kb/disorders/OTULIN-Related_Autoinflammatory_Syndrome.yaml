- name: Fibroblast LUBAC Degradation and Reduced TNF Signaling
  biological_scale: CELLULAR
  description: >-
    In OTULIN-deficient fibroblasts LUBAC is degraded and its recruitment to the
    TNF receptor signaling complex falls, so the fibroblast TNF-mediated signaling
    response is reduced rather than increased. This cell-type-specific LUBAC
    degradation is the defining result of Damgaard et al. 2019 and is the mirror
    image of the increased NF-kappaB seen in monocytes.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: tumor necrosis factor-mediated signaling pathway
    term:
      id: GO:0033209
      label: tumor necrosis factor-mediated signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:30804083
    reference_title: "OTULIN deficiency in ORAS causes cell type-specific LUBAC degradation, dysregulated TNF signalling and cell death."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      LUBAC recruitment and M1-linked Ub conjugation at the TNF-RSC are reduced,
      accompanied by impaired TNF signalling, decreased IL-8 secretion and
      sensitisation to TNF-induced cell death in the presence of CHX
    explanation: >-
      Documents reduced LUBAC recruitment and impaired (not increased) TNF
      signalling in patient fibroblasts, correcting the direction of the
      fibroblast TNF response.
  downstream:
  - target: Sensitisation to TNF-Induced Cell Death
    causal_link_type: DIRECT
- name: Sensitisation to TNF-Induced Cell Death
  biological_scale: CELLULAR
  description: >-
    Both patient fibroblasts and OTULIN-deficient monocytes are sensitised to
    TNF-induced death, and apoptotic cells are present in patient skin lesions,
    contributing to the panniculitis and tissue inflammation.
  cell_types:

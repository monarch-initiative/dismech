  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    ORAS is caused by biallelic (homozygous or compound heterozygous) hypomorphic
    loss-of-function OTULIN variants, reported in consanguineous and unrelated
    families.
  evidence:
  - reference: PMID:27559085
    reference_title: "Biallelic hypomorphic mutations in a linear deubiquitinase define otulipenia, an early-onset autoinflammatory disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two missense and one frameshift mutations in one Pakistani
      and two Turkish families with four affected patients.
    explanation: >-
      Documents biallelic OTULIN mutations across three families with four
      affected patients.
genetic:
- name: OTULIN variants
  gene_term:
    preferred_term: OTULIN
    term:
      id: hgnc:25118
      label: OTULIN
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic hypomorphic OTULIN variants cause ORAS. Reported classes are
    homozygous missense and frameshift variants (Zhou 2016, PMID:27559085), a
    canonical splice-site variant (Nabavi 2019, PMID:30796585), and an atypical
    late-onset compound-heterozygous case (Zinngrebe 2022, PMID:35170849); the
    first report (Damgaard 2016, PMID:27523608) described a homozygous missense
    in a consanguineous family. Specific variant notations (for example p.L272P,
    p.Y244C, p.G174Dfs*2, p.G281R, c.864+2T>C, the compound-het p.M86I/p.W167S,
    and p.V185F) are catalogued in Table 1 of PMID:40734169; the structured
    evidence here quotes the variant-class sentence rather than the table.

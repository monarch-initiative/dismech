name: OTULIN-Related Autoinflammatory Syndrome
creation_date: "2026-11-01T00:00:00Z"
category: Mendelian
description: >-
  OTULIN-related autoinflammatory syndrome (ORAS; otulipenia; AIPDS, autosomal
  recessive) is a severe, neonatal-onset systemic autoinflammatory disease caused
  by biallelic loss-of-function variants in OTULIN, a deubiquitinase that removes
  methionine-1 (M1, linear)-linked polyubiquitin conjugated by the linear
  ubiquitin chain assembly complex (LUBAC). Loss of OTULIN activity lets linear
  ubiquitin accumulate, which increases canonical NF-kappaB signaling and
  proinflammatory cytokine output and, in a cell-type-specific way, dysregulates
  TNF signaling and sensitises cells to TNF-induced death. Patients present in the
  neonatal period with recurrent fever, neutrophilic dermatitis and panniculitis,
  diarrhea, and failure to thrive. TNF-directed therapy is rational and
  haematopoietic stem cell transplantation can be curative, showing that
  haematopoietic cells drive the clinical disease.
synonyms:
- otulipenia
- ORAS
- OTULIN-related autoinflammatory syndrome
- autoinflammation, panniculitis, and dermatosis syndrome, autosomal recessive
- AIPDS
parents:
- hereditary disease
- autoinflammatory syndrome
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    ORAS is caused by biallelic (homozygous or compound heterozygous) hypomorphic
    loss-of-function OTULIN variants, reported in consanguineous and unrelated
    families.
  evidence:
  - reference: PMID:27559085
    reference_title: "Biallelic hypomorphic mutations in a linear deubiquitinase define otulipenia, an early-onset autoinflammatory disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two missense and one frameshift mutations in one Pakistani
      and two Turkish families with four affected patients.
    explanation: >-
      Documents biallelic OTULIN mutations across three families with four
      affected patients.

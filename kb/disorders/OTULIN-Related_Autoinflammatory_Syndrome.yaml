treatments:
- name: TNF Inhibitor Therapy
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    Because disease is driven by dysregulated TNF signaling and TNF-induced cell
    death, TNF-directed cytokine therapy is mechanistically rational and has been
    used to control inflammation.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: monoclonal antibody
      term:
        id: NCIT:C20401
        label: Monoclonal Antibody
  target_mechanisms:
  - target: Dysregulated TNF Signaling and TNF-Induced Cell Death
    description: >-
      Neutralizing TNF interrupts the dysregulated TNF signaling and TNF-induced
      death central to ORAS.
    evidence:
    - reference: PMID:27559085
      reference_title: "Biallelic hypomorphic mutations in a linear deubiquitinase define otulipenia, an early-onset autoinflammatory disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Levels of proinflammatory cytokines were significantly increased in the
        supernatants of stimulated primary cells and serum samples.
      explanation: >-
        The elevated proinflammatory cytokines (including TNF) are the target of
        cytokine-directed therapy.
  evidence:
  - reference: PMID:27559085
    reference_title: "Biallelic hypomorphic mutations in a linear deubiquitinase define otulipenia, an early-onset autoinflammatory disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This discovery adds to the emerging spectrum of human diseases caused by
      defects in the ubiquitin pathway and suggests a role for targeted cytokine
      therapies.
    explanation: >-
      The discovery report proposes targeted cytokine (including anti-TNF)
      therapy.
- name: Hematopoietic Cell Transplantation

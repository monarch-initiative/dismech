      an independent consanguineous family.
genetic:
- name: ZNF407
  gene_term:
    preferred_term: ZNF407
    term:
      id: hgnc:19904
      label: ZNF407
  relationship_type: CAUSATIVE
  notes: >
    ZNF407 (18q23) encodes a large Kruppel-type C2H2 zinc-finger transcription
    factor. Reported biallelic variants include homozygous c.2814_2816dup
    (p.Val939dup), homozygous c.2405G>T (p.Gly802Val), compound heterozygous
    c.2884C>G (p.Arg962Gly) / c.3642G>C (p.Lys1214Asn), and homozygous
    c.5054C>G (p.Ser1685Trp). This causative relationship is limited to the
    biallelic recessive disorder; earlier heterozygous observations are not
    included as evidence for it.
  evidence:
  - reference: PMID:32737394
    reference_title: "Biallelic ZNF407 mutations in a neurodevelopmental disorder with ID, short stature and variable microcephaly, hypotonia, ocular anomalies and facial dysmorphism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we detected homozygous c.2405G>T (p.Gly802Val) in the affected member of Family II and compound heterozygous variants c.2884C>G (p.Arg962Gly) and c.3642G>C (p.Lys1214Asn) in the affected member of Family III"
    explanation: >
      Documents additional homozygous and compound heterozygous ZNF407 variants
      in independent families, establishing biallelic ZNF407 variation as the
      molecular cause.
  - reference: PMID:24907849
    reference_title: "Mutations in zinc finger 407 [ZNF407] cause a unique autosomal recessive cognitive impairment syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A damaging c.C5054G mutation affecting an evolutionary highly conserved amino acid p.S1685W was identified in the ZNF407 gene at 18q23"
    explanation: >
      Identifies the founding homozygous ZNF407 variant (p.S1685W) at 18q23 in
      the first-reported family, establishing ZNF407 as the causal gene.
mechanistic_hypotheses:
- hypothesis_group_id: znf407_transcriptional_dysregulation
  hypothesis_label: ZNF407 transcriptional-dysregulation model
  status: EMERGING
  description: >-
    The current disease model proposes that biallelic damaging variants impair
    ZNF407 zinc-finger or cofactor function, altering transcription during fetal
    brain development and thereby causing the neurodevelopmental phenotype.
    Disease-specific support is limited to segregation and computational
    structural modeling of p.S1685W; no patient-derived neural assay has shown
    altered DNA occupancy, target-gene expression, or rescue. A 2024 study
    directly demonstrated ZFP407 cofactor activity in mouse adipocytes, but did
    not test human neurodevelopment or any disease allele.
  evidence:
  - reference: PMID:24907849
    reference_title: "Mutations in zinc finger 407 [ZNF407] cause a unique autosomal recessive cognitive impairment syndrome."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "Structural analyses of this mutation shows disruption of an H-bond"
    explanation: >-
      Structural modeling supports impaired zinc-finger geometry but does not
      directly demonstrate altered transcription in patient neural cells.
  - reference: PMID:38781157
    reference_title: "Molecular regulation of PPARγ/RXRα signaling by the novel cofactor ZFP407."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "ZFP407 was found to interact with the PPARγ/RXRα protein complex in the nucleus of adipocytes"
    explanation: >-
      Establishes transcriptional-cofactor activity in an adipocyte system, but
      only indirectly informs the neurodevelopmental disease mechanism.
pathophysiology:
- name: Predicted Impairment of ZNF407 Transcriptional-Regulatory Function
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >
    ZNF407 is annotated as a Kruppel-type C2H2 zinc-finger protein. Structural
    modeling of the biallelic p.S1685W allele predicts impaired target-DNA
    binding, while experiments in mouse adipocytes demonstrate ZFP407 cofactor
    activity in a non-neural context. Neither result directly establishes the
    molecular consequence of a disease allele in human neural cells; the
    extent of impairment and relevant neural targets remain unknown.
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  - preferred_term: zinc ion binding
    term:
      id: GO:0008270
      label: zinc ion binding

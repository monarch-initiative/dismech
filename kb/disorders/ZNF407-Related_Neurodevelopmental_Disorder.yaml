name: ZNF407-Related Neurodevelopmental Disorder
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
synonyms:
- short stature, impaired intellectual development, microcephaly, hypotonia, and ocular anomalies
- SIMHOA
- ZNF407-related intellectual disability
description: >
  ZNF407-related neurodevelopmental disorder is a rare autosomal recessive
  condition caused by biallelic loss-of-function variants in ZNF407 (18q23),
  which encodes a large Kruppel-type C2H2 zinc-finger protein that acts as a
  DNA-binding transcriptional regulator during brain development. OMIM/MONDO
  name the entity after its core clinical features: short stature, impaired
  intellectual development (intellectual disability), microcephaly, hypotonia,
  and ocular anomalies. Intellectual disability (mild to profound) is the
  obligate feature; short stature, microcephaly, developmental delay, hypotonia,
  dysarthria, hearing loss, visual problems, behavioural anomalies (including
  autistic features), delayed puberty and facial dysmorphism are variable.
  ZNF407 was first implicated in non-syndromic intellectual disability with
  autism through a balanced translocation disrupting the gene and linker-region
  missense variants that impair zinc-finger function. The recessive syndromic
  entity was delineated in a consanguineous Arab family homozygous for the
  founding p.S1685W linker variant (2014), then expanded allelically and
  phenotypically in additional families with biallelic variants (2020).
disease_term:
  preferred_term: short stature, impaired intellectual development, microcephaly, hypotonia, and ocular anomalies
  term:
    id: MONDO:0859198
    label: short stature, impaired intellectual development, microcephaly, hypotonia, and ocular anomalies
parents:
- Neurodevelopmental disorder
- Autosomal recessive disease
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence or incidence estimate has been published. The
    disorder is known from a small number of families/individuals reported in
    the literature: the founding consanguineous Arab family homozygous for
    p.S1685W (PMID:24907849, 2014), the consanguineous Pakistani family (Family I)
    and additional probands of different ethnic origins in the 2020 expansion
    (PMID:32737394), and earlier non-syndromic ID/autism cases (PMID:23195952).
    Ascertainment is genotype-first, so case counts are not a population rate.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Biallelic (homozygous or compound heterozygous) ZNF407 variants segregate
    with the phenotype in reported consanguineous and non-consanguineous
    families.
  evidence:
  - reference: PMID:32737394
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "by exome sequencing identified homozygous ZNF407 c.2814_2816dup (p.Val939dup) in four affected members"
    explanation: >
      Homozygous ZNF407 variant identified in multiple affected members of a
      consanguineous family, consistent with autosomal recessive inheritance.
  - reference: PMID:24907849
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A consanguineous Arab family is affected by an apparently novel autosomal recessive disorder characterized by cognitive impairment, failure-to-thrive, hypotonia and dysmorphic features"
    explanation: >
      Foundational report delineating the autosomal recessive ZNF407 disorder in
      an independent consanguineous family.
genetic:
- name: ZNF407
  gene_term:
    preferred_term: ZNF407
    term:
      id: hgnc:19904
      label: ZNF407
  relationship_type: CAUSATIVE
  notes: >
    ZNF407 (18q23) encodes a large Kruppel-type C2H2 zinc-finger transcription
    factor. Reported biallelic variants include homozygous c.2814_2816dup
    (p.Val939dup), homozygous c.2405G>T (p.Gly802Val), compound heterozygous
    c.2884C>G (p.Arg962Gly) / c.3642G>C (p.Lys1214Asn), and homozygous
    c.5054C>G (p.Ser1685Trp). Earlier non-syndromic ID/autism cases carried a
    translocation disrupting ZNF407 intron 3 and linker-region missense
    variants (Y460C, P1195A).
  evidence:
  - reference: PMID:32737394
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we detected homozygous c.2405G>T (p.Gly802Val) in the affected member of Family II and compound heterozygous variants c.2884C>G (p.Arg962Gly) and c.3642G>C (p.Lys1214Asn) in the affected member of Family III"
    explanation: >
      Documents additional homozygous and compound heterozygous ZNF407 variants
      in independent families, establishing biallelic ZNF407 variation as the
      molecular cause.
  - reference: PMID:23195952
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we demonstrate that mutations in the ZNF407 gene contribute to the pathogenesis of a group of ID patients with autism"
    explanation: >
      Earliest report implicating ZNF407 variants in intellectual disability
      with autism, via a gene-disrupting translocation and missense variants.
  - reference: PMID:24907849
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A damaging c.C5054G mutation affecting an evolutionary highly conserved amino acid p.S1685W was identified in the ZNF407 gene at 18q23"
    explanation: >
      Identifies the founding homozygous ZNF407 variant (p.S1685W) at 18q23 in
      the first-reported family, establishing ZNF407 as the causal gene.
pathophysiology:
- name: Loss of ZNF407 Zinc-Finger Transcription Factor Function
  biological_scale: MOLECULAR
  description: >
    ZNF407 is a Kruppel-type C2H2 zinc-finger protein that modulates gene
    expression by binding DNA. A translocation disrupting the gene reduces
    ZNF407 expression, and missense variants in the linker regions between
    zinc-finger structures are predicted to disrupt zinc-finger integrity,
    together implying loss of ZNF407 transcription-factor function as the
    molecular mechanism.
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  - preferred_term: zinc ion binding
    term:
      id: GO:0008270
      label: zinc ion binding
  downstream:
  - target: Impaired Neurodevelopment
  evidence:
  - reference: PMID:23195952
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations in genes encoding zinc finger proteins. These proteins modulate gene expression via binding to DNA"
    explanation: >
      Establishes ZNF407 as a DNA-binding zinc-finger protein that modulates
      gene expression, the molecular function lost in disease.
  - reference: PMID:23195952
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "both mutations may result in loss of ZNF407 function"
    explanation: >
      Linker-region missense variants are predicted to cause loss of ZNF407
      function, supporting a loss-of-function mechanism.
  - reference: PMID:24907849
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "decreased probability of binding to the target DNA sequence essentially eliminating the functionality of downstream domains and interfering with the expression of various genes under ZNF407 control during fetal brain development"
    explanation: >
      Structural analysis shows a linker-region variant reduces target-DNA
      binding, eliminating downstream zinc-finger function and dysregulating
      ZNF407-controlled genes during fetal brain development.
  - reference: PMID:24907849
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ZNF407 is a transcription factor with an essential role in brain development"
    explanation: >
      Establishes ZNF407 as a transcription factor essential for brain
      development, the process disrupted in this disorder.
- name: Impaired Neurodevelopment
  biological_scale: TISSUE
  description: >
    Loss of ZNF407-dependent transcriptional regulation during brain
    development is proposed to impair neurodevelopment, manifesting as
    intellectual disability, microcephaly, hypotonia and developmental delay.
  biological_processes:
  - preferred_term: nervous system development
    term:
      id: GO:0007399
      label: nervous system development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:32737394
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected individuals from families have intellectual disability (ID), ranging from mild to profound, and reduced motor and cognitive skills"
    explanation: >
      Impaired neurodevelopment manifests clinically as intellectual disability
      and reduced motor and cognitive skills in all affected individuals.

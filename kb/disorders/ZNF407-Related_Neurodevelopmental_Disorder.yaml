name: ZNF407-Related Neurodevelopmental Disorder
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
synonyms:
- short stature, impaired intellectual development, microcephaly, hypotonia, and ocular anomalies
- SIMHOA
- ZNF407-related intellectual disability
description: >
  ZNF407-related neurodevelopmental disorder is a rare autosomal recessive
  condition caused by biallelic damaging variants in ZNF407 (18q23), which
  encodes a large Kruppel-type C2H2 zinc-finger protein. Transcriptional
  impairment is predicted from structural modeling of one disease allele, and
  cofactor activity has been demonstrated only in mouse adipocytes. Complete
  loss of function has not been demonstrated for the reported biallelic
  missense and in-frame variants. OMIM/MONDO
  name the entity after its core clinical features: short stature, impaired
  intellectual development (intellectual disability), microcephaly, hypotonia,
  and ocular anomalies. Intellectual disability (mild to profound) is the
  obligate feature; short stature, microcephaly, developmental delay, hypotonia,
  dysarthria, hearing loss, visual problems, behavioural anomalies, delayed
  puberty and facial dysmorphism are variable.
  ZNF407 was first implicated in non-syndromic intellectual disability with
  autism through a balanced translocation disrupting the gene and heterozygous
  linker-region missense variants predicted to impair zinc-finger function;
  those observations do not establish the same recessive syndrome. The
  recessive syndromic entity was delineated in a consanguineous Arab family
  homozygous for the p.S1685W linker variant (2014), then expanded allelically
  and phenotypically in additional families with biallelic variants (2020).

  - reference: PMID:24907849
    reference_title: "Mutations in zinc finger 407 [ZNF407] cause a unique autosomal recessive cognitive impairment syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A consanguineous Arab family is affected by an apparently novel autosomal recessive disorder characterized by cognitive impairment, failure-to-thrive, hypotonia and dysmorphic features"

diagnosis:
- name: Reported Molecular Testing for Biallelic ZNF407 Variants
  description: >-
    Published families were identified through homozygosity mapping and/or
    exome sequencing, followed by segregation assessment of biallelic ZNF407
    variants in affected relatives where samples were available. These are the
    reported study workflows, not a formally established testing requirement;
    the literature does not establish a validated clinical scoring system or
    disease-specific functional assay.
  evidence:
  - reference: PMID:32737394
    reference_title: "Biallelic ZNF407 mutations in a neurodevelopmental disorder with ID, short stature and variable microcephaly, hypotonia, ocular anomalies and facial dysmorphism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "by exome sequencing identified homozygous ZNF407 c.2814_2816dup (p.Val939dup) in four affected members"
    explanation: >-
      Exome sequencing identified the homozygous variant in the largest
      published family.
  - reference: PMID:24907849
    reference_title: "Mutations in zinc finger 407 [ZNF407] cause a unique autosomal recessive cognitive impairment syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The family was studied by homozygosity mapping, candidate gene mutation screening and whole Exome Next Generation Sequencing"
    explanation: >-
      The founding family was solved through homozygosity mapping followed by
      sequence analysis.
discussions:
- discussion_id: znf407_neural_mechanism_translation
  prompt: >-
    Does impaired ZNF407 zinc-finger or cofactor activity alter a specific
    transcriptional program in human neural development, and do the reported
    biallelic variants act through the same mechanism?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Predicted Impairment of ZNF407 Transcriptional-Regulatory Function
  - pathophysiology#Impaired Neurodevelopment
  - pathophysiology#Impaired Somatic Development
  rationale: >-
    Disease-specific functional evidence is computational structural modeling
    of one missense allele. The direct experimental evidence for ZFP407 cofactor
    activity comes from mouse adipocytes and does not test neural cells, human
    development, or patient alleles. The reported recessive alleles also span
    missense and in-frame changes, so a uniform complete-loss-of-function model
    cannot be assumed. Resolving the relevant partners, targets, cell types, and
    allelic effects is necessary before the proposed transcriptional chain can
    be treated as established.
  evidence:
  - reference: PMID:24907849
    reference_title: "Mutations in zinc finger 407 [ZNF407] cause a unique autosomal recessive cognitive impairment syndrome."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The mutated gene product was studied by structural bioinformatics methods."
    explanation: >-
      The founding disease-specific functional analysis was computational
      rather than an assay in patient-derived neural cells.
  - reference: PMID:38781157
    reference_title: "Molecular regulation of PPARγ/RXRα signaling by the novel cofactor ZFP407."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ZFP407 was found to interact with the PPARγ/RXRα protein complex in the nucleus of adipocytes"
    explanation: >-
      The experimental cofactor evidence comes from adipocytes and therefore
      directly supports the stated human-neural translation gap.
  proposed_experiments:
  - experiment_id: znf407_patient_neural_isogenic_series
    name: Patient-derived neural isogenic allelic series
    description: >-
      Compare patient-derived iPSC neural progenitors and neurons with
      CRISPR-corrected controls, and engineer representative reported alleles in
      a shared background. Measure ZNF407 abundance and localization, chromatin
      occupancy, protein partners, transcriptomic effects, neuronal maturation,
      and rescue after correction or wild-type complementation.
    readouts:
    - name: Allele-specific ZNF407 molecular and neurodevelopmental phenotypes with rescue
      target: "pathophysiology#Predicted Impairment of ZNF407 Transcriptional-Regulatory Function"
- discussion_id: znf407_natural_history_and_frequency
  prompt: >-
    What are the unbiased phenotype frequencies, developmental trajectories,
    adult outcomes, and genotype-phenotype relationships of biallelic ZNF407
    disorder?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Intellectual disability
  - phenotypes#Short stature
  - phenotypes#Microcephaly
  rationale: >-
    The core literature contains only nine affected individuals from four
    families. Most detailed physical findings come from two brothers, while the
    later abstract reports a heterogeneous seven-person expansion. This is too
    small and ascertainment-dependent to establish penetrance for variable
    findings, long-term progression, adult prognosis, or robust allelic
    correlations.
  evidence:
  - reference: PMID:24907849
    reference_title: "Mutations in zinc finger 407 [ZNF407] cause a unique autosomal recessive cognitive impairment syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "both affected\nindividuals are males"
    explanation: >-
      The founding report contributes detailed observations from only two
      affected individuals in one family.
  - reference: PMID:32737394
    reference_title: "Biallelic ZNF407 mutations in a neurodevelopmental disorder with ID, short stature and variable microcephaly, hypotonia, ocular anomalies and facial dysmorphism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "five members of a consanguineous Pakistani family (Family I) plus two affected children from families of different ethnic origins"
    explanation: >-
      The later report adds seven affected individuals across three families,
      leaving natural history and unbiased frequencies unresolved.
  proposed_experiments:
  - experiment_id: znf407_international_natural_history_registry
    name: Genotype-first longitudinal natural-history cohort
    description: >-
      Assemble an international, genotype-first cohort with harmonized HPO
      phenotyping, developmental assessments, growth and pubertal trajectories,
      ophthalmologic and audiologic evaluations, and longitudinal follow-up.
    readouts:
    - name: Age-stratified phenotype frequencies and developmental trajectories
      target: "phenotypes#Intellectual disability"

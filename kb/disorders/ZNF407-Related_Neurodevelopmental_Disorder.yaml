prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence or incidence estimate has been published. The
    core biallelic syndrome is represented by nine published affected
    individuals from four families: two brothers in the founding consanguineous
    Arab family (PMID:24907849) and seven individuals from three families in the
    2020 expansion (PMID:32737394). The heterozygous translocation and missense
    cases reported in PMID:23195952 are not counted because they do not establish
    the same recessive entity. Ascertainment is genotype-first, so this case
    count is not a population rate.
  evidence:
  - reference: PMID:32737394
    reference_title: "Biallelic ZNF407 mutations in a neurodevelopmental disorder with ID, short stature and variable microcephaly, hypotonia, ocular anomalies and facial dysmorphism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous c.5054C>G (p.Ser1685Trp) has been reported in two brothers with an ID syndrome"
    explanation: >-
      The later cohort report directly summarizes the two affected brothers
      with the homozygous p.S1685W variant in the founding family.
  - reference: PMID:32737394
    reference_title: "Biallelic ZNF407 mutations in a neurodevelopmental disorder with ID, short stature and variable microcephaly, hypotonia, ocular anomalies and facial dysmorphism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "five members of a consanguineous Pakistani family (Family I) plus two affected children from families of different ethnic origins"
    explanation: >-
      The expansion describes seven affected individuals from three additional
      families, supporting the literature case count without implying a
      population prevalence.

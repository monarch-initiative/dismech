    explanation: Establishes the recurrence of the branch-site allele across every reported family.
  - reference: PMID:32518176
    reference_title: "NUBPL mitochondrial disease: new patients and review of the genetic and clinical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "was always found in cis with c.815-27T>C, but only two of four families had both variants"
    explanation: >-
      Establishes that the previously co-occurring c.166G>A change is separable from the
      branch-site allele. Quoted from mid-sentence because the clause opens with the protein
      designation in square brackets, which the reference validator strips from the query side
      (dismech#10192).
  - reference: PMID:23828044
    reference_title: "Insights into the pathogenic character of a common NUBPL branch-site mutation associated with mitochondrial disease and complex I deficiency using a yeast model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, the mutation is present in 1.2% of European haplotypes."
    explanation: >-
      The population frequency that makes the branch-site allele implausible as a fully
      penetrant dominant lesion and motivated the functional work.

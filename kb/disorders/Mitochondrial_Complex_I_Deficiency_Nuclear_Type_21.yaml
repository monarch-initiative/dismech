- population: Worldwide, reported cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare. Eight patients were on record when the disorder was reviewed, and that review
    added five more from four families, so the world literature is on the order of a dozen
    patients. No population rate has been estimated and none is asserted here.
  evidence:
  - reference: PMID:32518176
    reference_title: "NUBPL mitochondrial disease: new patients and review of the genetic and clinical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, only eight patients have been reported with this mitochondrial disorder."
    explanation: >-
      The count of reported patients at the time of review, which is the only occurrence figure
      available for this disorder.
biochemical:
- name: Isolated Complex I Deficiency
  presence: PRESENT
  readouts:
  - target: Mitochondrial Complex I Deficiency
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    interpretation: >-
      The respiratory chain enzyme assay is the direct measurement of the node it points at:
      an isolated complex I defect with the other complexes intact is what that node asserts.
    description: >-
      No endpoint_context is recorded. The assay is not being claimed as a diagnostic endpoint
      here, because this entry argues the MRI pattern has displaced it diagnostically; its role
      is to establish the biochemical lesion, not to find patients.
    evidence:
    - reference: PMID:23553477
      reference_title: "NUBPL mutations in patients with complex I deficiency and a distinct MRI pattern."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "The 4 tested patients had a respiratory chain complex І deficiency."
      explanation: >-
        The measurement and the node are the same quantity, so the sentence reporting the assay
        result in NUBPL patients supports the readout link directly.
  notes: >-
    An isolated deficiency of respiratory chain complex I with the other complexes intact. This
    is the biochemical phenotype that places the disorder in the nuclear complex I deficiency
    group and, historically, what selected patients for nuclear gene sequencing. Note the MRI
    pattern is now argued to make this assay unnecessary for diagnosis, so its role here is
    mechanistic rather than diagnostic.
  evidence:
  - reference: PMID:23553477
    reference_title: "NUBPL mutations in patients with complex I deficiency and a distinct MRI pattern."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 4 tested patients had a respiratory chain complex І deficiency."
    explanation: >-
      Biochemical confirmation in the imaging-selected cohort. Quoted verbatim including the
      Cyrillic capital I the source prints in place of a Latin I in "complex І".
- name: Reduced Spare Respiratory Capacity
  presence: PRESENT
  readouts:
  - target: Mitochondrial Complex I Deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    interpretation: >-
      Respirometry on patient fibroblasts reports the functional cost of the complex I defect:
      the deeper the deficiency, the less reserve the cell can call on above baseline demand.
    description: >-
      A functional consequence of the node rather than a measurement of it, which is why the
      supporting sentence is graded INDIRECT. No endpoint_context is recorded: this is a
      mechanistic characterisation in cultured patient cells, not a diagnostic, prognostic,
      monitoring or pharmacodynamic endpoint.
    evidence:
    - reference: PMID:32518176
      reference_title: "NUBPL mitochondrial disease: new patients and review of the genetic and clinical spectrum."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Mitochondrial function studies on patient fibroblasts showed significantly reduced spare respiratory capacity."
      explanation: >-
        The sentence reports the bioenergetic deficit in patient cells without naming complex I,
        so attributing it to the complex I deficiency node takes one inference step.
  notes: >-
    Measured in patient fibroblasts. Spare respiratory capacity is the reserve a cell can call
    on above baseline demand, which is why the deficit shows first in tissues whose energy
    demand fluctuates.
  evidence:
  - reference: PMID:32518176
    reference_title: "NUBPL mitochondrial disease: new patients and review of the genetic and clinical spectrum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mitochondrial function studies on patient fibroblasts showed significantly reduced spare respiratory capacity."
    explanation: The specific bioenergetic parameter measured, and the cell type it was measured in.
experimental_models:
- name: Yarrowia lipolytica Ind1 carrying the branch-site-derived altered C-terminus
  experimental_model_type: OTHER
  publication: PMID:23828044
  description: >-
    The human NUBPL branch-site variant c.815-27T>C is present in roughly 1.2% of European
    haplotypes, far too common to be assumed pathogenic. Its consequence was tested by
    reconstructing the resulting altered C-terminus in Ind1, the NUBPL homologue of the
    respiratory yeast Yarrowia lipolytica, which unlike Saccharomyces has a complete complex I.
  modeled_mechanisms:
  - target: NUBPL Loss of Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Establishes that the altered C-terminus destabilises the protein without affecting
      transcript level, and that this alone is enough to cause a null-like complex I phenotype.
    limitations: >-
      A yeast homologue, not the human protein, and the construct reproduces the predicted
      altered C-terminus rather than the human splice event itself. It therefore tests the
      consequence of the predicted protein change, not that human cells actually make that
      protein.
    readouts:
    - name: Ind1 protein level
      target: NUBPL Loss of Function
      direction: DECREASED
      interpretation: Locates the effect at the protein rather than the transcript level.
      evidence:
      - reference: PMID:23828044
        reference_title: "Insights into the pathogenic character of a common NUBPL branch-site mutation associated with mitochondrial disease and complex I deficiency using a yeast model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We demonstrate that the altered sequence did not affect IND1 mRNA stability, yet it led to a decrease in Ind1 protein level."
        explanation: The measurement separating protein instability from transcript loss.
    evidence:
    - reference: PMID:23828044
      reference_title: "Insights into the pathogenic character of a common NUBPL branch-site mutation associated with mitochondrial disease and complex I deficiency using a yeast model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The presented data confirms the deleterious impact of the altered C-terminus resulting from the branch-site mutation."
      explanation: >-
        The authors' conclusion that this model settles the pathogenicity question the allele
        frequency had raised.
- name: NUBPL patient fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:23553477
  description: >-
    Primary skin fibroblasts from patients carrying biallelic NUBPL variants. The system in
    which reduced NUBPL protein, reduced fully assembled complex I, and the placement of NUBPL
    early in the assembly pathway were all established.
  modeled_mechanisms:
  - target: Failure of Complex I Holoenzyme Assembly
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Patient-derived and human, so the assembly defect is measured in the disease genotype
      rather than inferred from a surrogate.
    limitations: >-
      Fibroblasts are not an affected tissue in this disorder, which is cerebellar and white
      matter. They report the assembly lesion faithfully but say nothing about why the
      neurological distribution is what it is.
    readouts:
    - name: Fully assembled complex I
      target: Failure of Complex I Holoenzyme Assembly
      direction: DECREASED
      interpretation: Direct measure of the holoenzyme deficit this node asserts.
      evidence:
      - reference: PMID:23553477
        reference_title: "NUBPL mutations in patients with complex I deficiency and a distinct MRI pattern."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "A strongly decreased amount of NUBPL protein and fully assembled complex I was found in patients' fibroblasts."
        explanation: Measures both the assembly factor and the assembled complex in the same cells.
external_assertions:
- name: OMIM mitochondrial complex I deficiency, nuclear type 21 record
  source: OMIM
  assertion_type: disease_record
  external_id: OMIM:618242
  url: https://omim.org/entry/618242
  description: >-
    OMIM phenotype record for MC1DN21. The review that anchors this entry cites both OMIM
    numbers in its opening sentence - "a cause of mitochondrial complex I deficiency (MIM
    613621, 618242)" - where 613621 is the earlier NUBPL-related complex I deficiency number
    and 618242 is the current MC1DN21 phenotype. Recorded here rather than under `mappings:`
    because the schema's DiseaseMappings container has only a mondo_mappings slot, with no OMIM
    mapping slot, and `external_assertions` is the pattern other disorder entries use for OMIM
    identifiers.
notes: >-
  A note on GeneReviews and on what this entry deliberately does not tag.

  There is no NUBPL-specific GeneReviews chapter. The nearest candidate is the Nuclear
  Gene-Encoded Leigh Syndrome Spectrum Overview (PMID:26425749), which sibling entries in this
  numbered family tag - MC1DN2 and MC1DN6 tag it and record in their own notes why it cannot be
  mined, while MC1DN24 records why it is deliberately not tagged. This entry follows MC1DN24
  and does not tag it, for a reason specific to NUBPL: the disease was defined by a white
  matter MRI pattern (cerebellar cortex, deep cerebral white matter, corpus callosum) rather
  than by the bilateral symmetric basal ganglia and brainstem lesions that define Leigh
  syndrome, and a Leigh-like picture is reported in only one of the five patients in the
  anchoring series. Tagging a Leigh spectrum overview here would assert a nosological placement
  the literature does not make. Recorded so the next curator does not re-litigate it.

  That single Leigh-like patient is not curated as a phenotype either, and the reason is a
  term gap rather than an oversight: HPO has no term for a Leigh-like or Leigh syndrome
  phenotype - Leigh syndrome is a MONDO disease concept - and binding a basal-ganglia or
  leukoencephalopathy term in its place would name a different finding than the source does.
  The source sentence is "and, in Patient 3, a Leigh-like phenotype." It is worth knowing about
  because it bears on how this disease relates to its sibling MC1DN entries, which is the same
  question the open discussion on this entry raises.

biochemical:
- name: Isolated Complex I Deficiency
  presence: PRESENT
  notes: >-
    An isolated deficiency of respiratory chain complex I with the other complexes intact. This
    is the biochemical phenotype that places the disorder in the nuclear complex I deficiency
    group and, historically, what selected patients for nuclear gene sequencing. Note the MRI
    pattern is now argued to make this assay unnecessary for diagnosis, so its role here is
    mechanistic rather than diagnostic.
  evidence:
  - reference: PMID:23553477
    reference_title: "NUBPL mutations in patients with complex I deficiency and a distinct MRI pattern."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 4 tested patients had a respiratory chain complex І deficiency."
    explanation: >-
      Biochemical confirmation in the imaging-selected cohort. Quoted verbatim including the
      Cyrillic capital I the source prints in place of a Latin I in "complex І".
- name: Reduced Spare Respiratory Capacity
  presence: PRESENT
  notes: >-
    Measured in patient fibroblasts. Spare respiratory capacity is the reserve a cell can call
    on above baseline demand, which is why the deficit shows first in tissues whose energy
    demand fluctuates.
  evidence:
  - reference: PMID:32518176
    reference_title: "NUBPL mitochondrial disease: new patients and review of the genetic and clinical spectrum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mitochondrial function studies on patient fibroblasts showed significantly reduced spare respiratory capacity."

inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic NUBPL variants, characteristically compound heterozygous rather than homozygous:
    the recurrent branch-site allele c.815-27T>C in trans with a second, family-specific
    variant. Reported second alleles include c.311T>C (p.Leu104Pro), c.693+1G>A and c.545T>C
    (p.Val182Ala).
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:32518176
    reference_title: "NUBPL mitochondrial disease: new patients and review of the genetic and clinical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing was used to identify patients with compound heterozygous NUBPL variants."
    explanation: >-
      States the compound heterozygous architecture directly. The sentence naming each trans
      allele could not be quoted: it carries the protein changes as bracketed spans
      (p.L104P, p.V182A), which the reference validator strips from the query side, so a
      verbatim quote of it fails to match (dismech#10192). The allele identities are recorded
      in this block's description instead.
  - reference: PMID:30897263
    reference_title: "Mitochondrial complex I NUBPL mutations cause combined dystonia with bilateral striatal necrosis and cerebellar atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compound heterozygous mutations were identified in the NUBPL gene in a small UK kindred. The gene lay in a region of positive linkage and segregated with disease in a family of six individuals."
    explanation: Independent segregation evidence for recessive inheritance in a separate kindred.
pathophysiology:
- name: NUBPL Loss of Function
  description: >-
    Biallelic NUBPL variants reduce functional NUBPL protein. The recurrent allele is the
    branch-site variant c.815-27T>C, present in all reported families and in roughly 1.2% of
    European haplotypes, which produces a frameshifted, altered C-terminus. Modelling that
    altered C-terminus in the yeast homologue Ind1 showed the mechanism is protein instability
    rather than transcript loss: mRNA was unaffected while protein level fell. Not every
    missense allele is equally damaging - p.Leu104Pro impaired complex I function in the yeast
    model while p.Val182Ala did not.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: NUBPL
    term:
      id: hgnc:20278
      label: NUBPL
  downstream:
  - target: Impaired Iron-Sulfur Cluster Delivery to the Complex I Peripheral Arm
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23828044
    reference_title: "Insights into the pathogenic character of a common NUBPL branch-site mutation associated with mitochondrial disease and complex I deficiency using a yeast model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We demonstrate that the altered sequence did not affect IND1 mRNA stability, yet it led to a decrease in Ind1 protein level."
    explanation: >-
      Locates the effect of the branch-site allele at the protein rather than the transcript
      level, which is the specific molecular claim this node makes.
  - reference: PMID:23828044
    reference_title: "Insights into the pathogenic character of a common NUBPL branch-site mutation associated with mitochondrial disease and complex I deficiency using a yeast model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The instability of mutant Ind1 resulted in a strong decrease in complex I activity and caused slow growth, resembling the phenotype of the deletion strain of IND1."
    explanation: >-
      Establishes that the instability is sufficient to reproduce a null-like complex I
      phenotype, which is what makes a 1.2%-frequency allele credible as pathogenic.
  - reference: PMID:32518176
    reference_title: "NUBPL mitochondrial disease: new patients and review of the genetic and clinical spectrum."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Complex I function in the yeast model was impacted by p.L104P but not p.V182A."
    explanation: >-
      Shows the missense alleles are not functionally equivalent, which bears on variant
      interpretation in this gene.
- name: Impaired Iron-Sulfur Cluster Delivery to the Complex I Peripheral Arm
  description: >-
    NUBPL is an iron-sulfur cluster assembly factor for complex I. Analysis of how mutant NUBPL
    affects assembly of the peripheral arm placed its role early in the complex I assembly
    pathway, at the stage where iron-sulfur clusters are inserted. The peripheral arm is the
    electron-transferring limb of the complex, so a cluster-insertion failure there prevents
    the holoenzyme being completed rather than degrading an assembled enzyme's performance.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: iron-sulfur cluster assembly for complex I
    modifier: DECREASED
    term:
      id: GO:0016226
      label: iron-sulfur cluster assembly
  downstream:
  - target: Failure of Complex I Holoenzyme Assembly
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23553477
    reference_title: "NUBPL mutations in patients with complex I deficiency and a distinct MRI pattern."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Analysis of the effect of mutated NUBPL on the assembly of the peripheral arm of complex I indicated that NUBPL is involved in assembly of iron-sulfur clusters early in the complex I assembly pathway."
    explanation: >-
      Places the lesion at iron-sulfur cluster insertion early in assembly, in patient
      fibroblasts, which is precisely what this node asserts.
- name: Failure of Complex I Holoenzyme Assembly
  description: >-
    Patient fibroblasts show a strongly decreased amount of both NUBPL protein and fully
    assembled complex I. cDNA complementation restoring NUBPL rescues the defect, which is what
    established causality in the original cohort rather than leaving the association
    correlative.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  downstream:
  - target: Mitochondrial Complex I Deficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23553477
    reference_title: "NUBPL mutations in patients with complex I deficiency and a distinct MRI pattern."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A strongly decreased amount of NUBPL protein and fully assembled complex I was found in patients' fibroblasts."
    explanation: >-
      Measures both the reduced assembly factor and the reduced assembled holoenzyme in the same
      patient cells.
  - reference: PMID:20818383
    reference_title: "High-throughput, pooled sequencing identifies mutations in NUBPL and FOXRED1 in human complex I deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "including cDNA complementation to show that mutations in NUBPL and FOXRED1 can cause complex I deficiency"
    explanation: >-
      The rescue experiment that establishes NUBPL mutations as causal for complex I deficiency
      rather than merely co-occurring with it.
- name: Mitochondrial Complex I Deficiency
  description: >-
    Complex I is the entry point of the respiratory chain, transferring electrons from NADH to
    ubiquinone while pumping protons. With the holoenzyme depleted, oxidative phosphorylation
    capacity falls. In patient fibroblasts the measurable consequence is significantly reduced
    spare respiratory capacity - the reserve a cell can call on above baseline demand - which
    is why tissues with high and fluctuating energy demand are affected first.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  molecular_functions:
  - preferred_term: NADH:ubiquinone oxidoreductase activity
    modifier: DECREASED
    term:
      id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity

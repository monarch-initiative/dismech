      Establishes that the altered C-terminus destabilises the protein without affecting
      transcript level, and that this alone is enough to cause a null-like complex I phenotype.
    limitations: >-
      A yeast homologue, not the human protein, and the construct reproduces the predicted
      altered C-terminus rather than the human splice event itself. It therefore tests the
      consequence of the predicted protein change, not that human cells actually make that
      protein.

- name: NUBPL patient fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:23553477
  description: >-
    Primary skin fibroblasts from patients carrying biallelic NUBPL variants. The system in
    which reduced NUBPL protein, reduced fully assembled complex I, and the placement of NUBPL
    early in the assembly pathway were all established.
  modeled_mechanisms:
  - target: Failure of Complex I Holoenzyme Assembly
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Patient-derived and human, so the assembly defect is measured in the disease genotype
      rather than inferred from a surrogate.
    limitations: >-
      Fibroblasts are not an affected tissue in this disorder, which is cerebellar and white
      matter. They report the assembly lesion faithfully but say nothing about why the
      neurological distribution is what it is.
    readouts:
    - name: Fully assembled complex I
      target: Failure of Complex I Holoenzyme Assembly
      direction: DECREASED
      interpretation: Direct measure of the holoenzyme deficit this node asserts.
      evidence:
      - reference: PMID:23553477
        reference_title: "NUBPL mutations in patients with complex I deficiency and a distinct MRI pattern."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "A strongly decreased amount of NUBPL protein and fully assembled complex I was found in patients' fibroblasts."
        explanation: Measures both the assembly factor and the assembled complex in the same cells.

- name: Cerebellar and Deep White Matter Degeneration
  description: >-
    The imaging signature is predominant abnormality of the cerebellar cortex, deep cerebral
    white matter and corpus callosum, with cerebellar atrophy. Why this particular distribution
    follows from a generalised complex I assembly defect is not established, so the edge from
    the bioenergetic lesion is recorded as indirect with unknown intermediates rather than as a
    direct consequence.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL

    The human NUBPL branch-site variant c.815-27T>C is present in roughly 1.2% of European
    haplotypes, far too common to be assumed pathogenic. Its consequence was tested by
    reconstructing the resulting altered C-terminus in Ind1, the NUBPL homologue of the
    respiratory yeast Yarrowia lipolytica, which unlike Saccharomyces has a complete complex I.
  modeled_mechanisms:
  - target: NUBPL Loss of Function

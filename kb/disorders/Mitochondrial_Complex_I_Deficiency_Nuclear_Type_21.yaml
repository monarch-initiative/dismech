diagnosis:
- name: MRI pattern recognition
  description: >-
    The NUBPL MRI pattern - cerebellar cortex, deep cerebral white matter and corpus callosum -
    is described as consistent and recognisable enough to make the diagnosis directly. The
    original authors state it obviates the need for other tests including muscle or fibroblast
    respiratory chain assays, which is a strong claim in a field where imaging is usually only
    supportive. It rests on six patients from five families plus one previously published case,
    so it is a small series, and this entry reports the claim with that limit rather than
    generalising it.
  evidence:
  - reference: PMID:23553477
    reference_title: "NUBPL mutations in patients with complex I deficiency and a distinct MRI pattern."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data show that NUBPL mutations are associated with a unique, consistent, and recognizable MRI pattern, which facilitates fast diagnosis and obviates the need for other tests, including assessment of mitochondrial complex activities in muscle or fibroblasts."
    explanation: The authors' diagnostic claim, in their own words including its scope.
  - reference: PMID:23553477
    reference_title: "NUBPL mutations in patients with complex I deficiency and a distinct MRI pattern."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Upon identification of the mutated gene, we analyzed the MRI of a previously published case with NUBPL mutations and found exactly the same pattern."
    explanation: >-
      The out-of-sample check on the pattern: a case not used to derive it showed the same
      imaging. One case, so supportive rather than a validation study.

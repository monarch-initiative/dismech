discussions:
- discussion_id: nubpl_two_phenotypes_one_disease
  kind: OPEN_QUESTION
  prompt: >-
    Are the leukoencephalopathy presentation and the dystonia-with-bilateral-striatal-necrosis
    presentation of NUBPL disease one phenotypic spectrum or two distinct entities?
  rationale: >-
    The review of the genetic and clinical spectrum notes explicitly that a group of patients
    reported as having NUBPL disease had a clinical picture different from the earlier patients,
    and does not resolve whether that reflects one spectrum or a different entity. The two
    published pictures differ in more than emphasis: the original series was ascertained by a
    white matter MRI pattern, while the UK kindred is dystonia-predominant with bilateral
    striatal necrosis and specifically preserved cognition. This matters for curation because
    the entry currently draws both tissue-level nodes downstream of the same complex I
    deficiency node, which presumes one spectrum. If they are separate entities that reading is
    wrong. Both edges are marked as indirect with unknown intermediates and both tissue nodes
    are PROVISIONAL for this reason.
  attaches_to:
  - pathophysiology#Bilateral Striatal Necrosis
  - pathophysiology#Cerebellar and Deep White Matter Degeneration
  evidence:
  - reference: PMID:32518176
    reference_title: "NUBPL mitochondrial disease: new patients and review of the genetic and clinical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five other patients were recently reported to have NUBPL disease but their clinical picture was different from the first eight patients."
    explanation: >-
      States the phenotypic discrepancy directly, without resolving it, which is what makes this
      an open question rather than a settled spectrum.
  - reference: PMID:32518176
    reference_title: "NUBPL mitochondrial disease: new patients and review of the genetic and clinical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, only eight patients have been reported with this mitochondrial disorder."
    explanation: >-
      The total reported cohort at the time of review, which is the sample the whole
      phenotypic question rests on and is small enough to matter.

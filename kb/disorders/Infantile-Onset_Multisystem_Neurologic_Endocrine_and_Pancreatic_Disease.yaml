genetic:
- name: PTRH2
  gene_term:
    preferred_term: PTRH2
    term:
      id: hgnc:24265
      label: PTRH2
  relationship_type: CAUSATIVE
  notes: >-
    PTRH2 on 17q23.1 encodes peptidyl-tRNA hydrolase 2, also called BIT1. It was
    not associated with any disease before 2014. Biallelic variants cause IMNEPD.

    The allele spectrum is unusual in being dominated by one recurrent missense
    change, p.Gln85Pro, across unrelated consanguineous Arab communities. That
    allele leaves transcription intact and destabilises the protein, which is why
    a missense change behaves as loss of function here.
  variants:
  - name: c.269_270delCT, p.Ala90fs
    description: >-
      Homozygous in the founding Yazidian-Turkish family of two affected
      siblings. A frameshift, and the allele that established the gene-disease
      relationship.
  - name: c.254A>C, p.Gln85Pro
    description: >-
      The recurrent missense allele, reported in multiple unrelated consanguineous
      families. Patient fibroblasts carrying it have normal PTRH2 mRNA and
      strongly reduced protein, so it acts by destabilising the protein rather
      than by preventing its transcription.
  evidence:
  - reference: PMID:25574476
    reference_title: "Mutations in PTRH2 cause novel infantile-onset multisystem disease with intellectual disability, microcephaly, progressive ataxia, and muscle weakness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a consanguineous family with two individuals with IMNEPD, we identified
      a homozygous frameshift mutation in the previously not disease-associated
      peptidyl-tRNA hydrolase 2 (PTRH2) gene.
    explanation: The gene-disease assertion and the founding allele.
  - reference: PMID:27129381
    reference_title: Phenotype variability of infantile-onset multisystem neurologic, endocrine, and pancreatic disease IMNEPD.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We further demonstrated the association of a homozygous nonsense mutation
      in the PTRH2 gene (MIM*608625) to IMNEPD through functional and molecular
      data in human and mouse [1].
    explanation: >-
      The authors' own summary of how the gene-disease link was established,
      naming the human and mouse evidence together. Note this sentence recites
      their earlier paper rather than reporting a new result.
    quote_role: BACKGROUND
animal_models:
- name: Purkinje-cell-specific Ptrh2 knockout mouse
  species: Mouse
  genotype: Ptrh2 LoxP x Pcp2-Cre, Purkinje-cell-specific conditional knockout
  publication: PMID:36219306
  description: >-
    The conditional knockout is what makes the cerebellar mechanism a claim about
    Purkinje cells rather than about the cerebellum in general. The constitutive
    knockout in the same paper is severely runted and dies by postnatal day 14,
    so it cannot be used to study a progressive adult phenotype at all; deleting
    Ptrh2 in Purkinje cells alone gives animals that survive to adulthood and
    develop ataxia.
  modeled_mechanisms:
  - target: Purkinje Cell Atrophy and Loss
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Reduced Purkinje cell size and density, stunted dendrites, lower
      phosphorylated ribosomal protein S6, and marked cell loss by adulthood,
      with progressive cerebellar atrophy and ataxia at the whole-animal level.
    limitations: >-
      The human counterpart is inferred from MRI atrophy; no human IMNEPD
      cerebellar tissue has been examined. And the model is a Purkinje-cell
      deletion, where patients are constitutive biallelic carriers, so it
      isolates the cell-autonomous contribution by construction and says nothing
      about how much of the human cerebellar phenotype is cell-autonomous.
    readouts:
    - name: Purkinje cell phosphorylated ribosomal protein S6
      target: Purkinje Cell Atrophy and Loss
      direction: DECREASED
      interpretation: Reduced mTOR pathway activity in the affected cells.
      evidence:
      - reference: PMID:36219306
        reference_title: PTRH2 is Necessary for Purkinje Cell Differentiation and Survival and its Loss Recapitulates Progressive Cerebellar Atrophy and Ataxia Seen in IMNEPD Patients.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          PCs of Ptrh2ΔPC mice had reduced cell size and density, stunted
          dendrites, and lower levels of ribosomal protein S6, a readout of the
          mammalian target of rapamycin pathway.
        explanation: The measurement and the authors' interpretation of the marker.
    - name: Gait and ataxia assessment
      target: Purkinje Cell Atrophy and Loss
      direction: ALTERED
      interpretation: >-
        Functional cerebellar deficit in the conditional knockout, matching the
        patients' ataxia.
      evidence:
      - reference: PMID:36219306
        reference_title: PTRH2 is Necessary for Purkinje Cell Differentiation and Survival and its Loss Recapitulates Progressive Cerebellar Atrophy and Ataxia Seen in IMNEPD Patients.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Ptrh2ΔPC PC specific knockout mice survived until adult age; however,
          they showed progressive cerebellar atrophy and functional cerebellar
          deficits with abnormal gait and ataxia.
        explanation: >-
          The behavioural and imaging phenotype, with the survival difference
          from the constitutive knockout stated in the same sentence.
    evidence:
    - reference: PMID:36219306
      reference_title: PTRH2 is Necessary for Purkinje Cell Differentiation and Survival and its Loss Recapitulates Progressive Cerebellar Atrophy and Ataxia Seen in IMNEPD Patients.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This suggests a molecular mechanism underlying the ataxia and cerebellar
        atrophy seen in patients with PTRH2 mutations leading to infantile-onset
        multisystem neurologic, endocrine, and pancreatic disease.
      explanation: >-
        The authors' own statement that the model is informative for the human
        disease, hedged as "suggests", which is the level at which this link is
        curated.

name: Infantile-Onset Multisystem Neurologic, Endocrine, and Pancreatic Disease
creation_date: "2026-09-17T16:17:48Z"
description: >-
  IMNEPD is the autosomal recessive multisystem disorder caused by biallelic
  PTRH2 variants, delineated in 2014 in two siblings of a consanguineous
  Yazidian-Turkish family. Roughly thirty patients have been published, almost
  all from consanguineous Middle Eastern and North African families, and a
  single recurrent missense allele, p.Gln85Pro, accounts for about half of them.

  The clinical picture is neurologically weighted despite the name. Motor delay,
  peripheral neuropathy, intellectual disability, distal muscle weakness,
  sensorineural hearing impairment and ataxia are the features reported most
  often; progressive cerebellar atrophy is the imaging correlate of the ataxia.
  The endocrine and pancreatic features that the name foregrounds -- exocrine
  pancreatic insufficiency, diabetes mellitus, hypothyroidism, liver abnormality
  -- are real but less consistent, and an entry read only from the disease name
  would overweight them.

  PTRH2 is a mitochondrial protein with two jobs, and which of them the disease
  runs through is not settled. It is a peptidyl-tRNA hydrolase, a translation
  quality-control enzyme. It is also an adhesion-regulated survival switch: bound
  to focal adhesion kinase in matrix-attached cells it supports survival
  signalling, and on matrix detachment it is released into the cytosol where it
  drives caspase-independent anoikis. The mechanism worked out in mouse runs
  through neither hydrolase chemistry nor anoikis directly, but through mTOR: a
  Purkinje-cell-specific Ptrh2 knockout loses phosphorylated ribosomal protein
  S6, develops stunted dendrites and atrophic Purkinje cells, and ends in
  progressive cerebellar atrophy and ataxia. That model is the strongest
  mechanistic evidence this disease has, and it is a mouse.

  There is no disease-modifying therapy. Management is supportive and
  multidisciplinary.
synonyms:
- IMNEPD
- IMNEPD1
- infantile-onset multisystem neurologic, endocrine, and pancreatic disease
- neurologic, endocrine, and pancreatic disease, multisystem, infantile-onset
- PTRH2-related multisystem disease

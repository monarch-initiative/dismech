discussions:
- discussion_id: gap_imnepd_which_ptrh2_function_causes_the_disease
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does IMNEPD run through PTRH2's peptidyl-tRNA hydrolase activity, its
    adhesion-regulated survival signalling, or neither directly?
  attaches_to:
  - "pathophysiology#PTRH2 Loss of Function"
  - "pathophysiology#Loss of Adhesion-Dependent Survival Signalling"
  rationale: >-
    PTRH2 has two well-characterised and unrelated functions, and the disease
    literature routes through a third observation, reduced mTOR activation, whose
    connection to either is unexplained. The hydrolase activity is a
    mitochondrial translation quality-control step; the BIT1 anoikis work is
    cell-biological, predates the disease by a decade, and has never been shown
    dysregulated in patient tissue. Neither has been tested against the disease
    by the obvious experiment: a separation-of-function allele. The recurrent
    p.Gln85Pro variant destabilises the protein and so removes both functions at
    once, which is why the commonest allele cannot distinguish them. The stake is
    not academic, because mTOR is druggable and the other two arms are not: if
    the cerebellar phenotype is an mTOR-deficit phenotype, an mTOR-directed
    intervention is a coherent thing to test, and if it is a translation
    quality-control failure it is not.
  proposed_experiments:
  - experiment_id: exp_imnepd_separation_of_function_alleles
    name: Hydrolase-dead versus adhesion-signalling-dead PTRH2 knock-in mice
    description: >-
      Generate knock-in mice carrying a catalytically dead PTRH2 and, separately,
      an allele that disrupts the FAK interaction while preserving hydrolase
      activity, and compare Purkinje cell size, phosphorylated S6 and gait
      against the conditional knockout. Either allele reproducing the phenotype
      would assign the disease to that arm; neither doing so would say the
      relevant function is a third one.
- discussion_id: gap_imnepd_extracerebellar_mechanism
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Is the pancreatic, thyroid, hepatic and peripheral nerve involvement in
    IMNEPD produced by the same mTOR-dependent cell attrition demonstrated in
    Purkinje cells, or by something else?
  attaches_to:
  - "pathophysiology#Post-Mitotic Cell Attrition Outside the Cerebellum"
  rationale: >-
    The cerebellar arm of this disease has a clean cell-autonomous mouse
    demonstration. No other organ does. The constitutive knockout, which would be
    the model for the multisystem phenotype, dies by postnatal day 14 and so
    cannot express a phenotype that in patients appears over years, with diabetes
    reported as late as age 12. Every extracerebellar edge in this entry is
    therefore an extrapolation from one cell type in one tissue, and the entry
    marks them INDIRECT_UNKNOWN_INTERMEDIATES for that reason. This is a
    model-fidelity gap rather than an absence of evidence: the evidence exists,
    in mouse, for a compartment that does not include the organs the disease is
    named after.
  proposed_experiments:
  - experiment_id: exp_imnepd_tissue_specific_conditional_knockouts
    name: Pancreatic and Schwann cell conditional Ptrh2 knockouts
    description: >-
      Delete Ptrh2 in pancreatic acinar cells and, separately, in Schwann cells,
      in animals that survive to adulthood, and test whether exocrine
      insufficiency and demyelinating neuropathy arise cell-autonomously with the
      same reduction in phosphorylated S6 seen in Purkinje cells.
notes: >-
  Scope. MONDO:0024189 was bound nowhere in kb/ before this entry, and no entry
  binds PTRH2. This is IMNEPD1, the PTRH2 form. A second locus has been proposed
  in the literature under a synergistic PTRH2 plus KIF1A model; that report is
  not curated here, because a two-gene synergy claim in one family is a different
  assertion from this entry's monogenic one and would need its own treatment.

  Frequencies. Eleven phenotypes carry a band, and all of them are assigned from
  measured percentages in the 2024 cohort update across 32 published patients,
  quoted directly: motor delay ~94%, neuropathy ~89%, intellectual disability
  87.5%, distal weakness 85.2%, hearing impairment 78.12%, ataxia ~77%, hand
  deformity ~58.1%, cerebellar atrophy 56.5%, deformity of the head and face
  53.3%, diabetes 40%, pancreatic abnormality ~33.3%, hypothyroidism ~21.9%,
  liver abnormality ~17.4%.

  An earlier draft of this entry carried none of those numbers, on the stated
  grounds that they were "not in that paper's abstract, which is what the
  reference cache holds". That was wrong, and it was wrong in a way worth
  recording rather than quietly fixing. `references_cache/PMID_39766776.md` is
  `content_type: full_text_xml`, six of this entry's seven caches are full text,
  and `just validate-kb-references` matches against full text where it is
  present. The percentages were sitting in the committed cache the whole time,
  with per-phenotype denominators in a table. The assumption that a cache holds
  only an abstract was never checked against the file's own `content_type`
  field, and it cost two phenotypes that are present in more than half of
  patients (hand deformity, deformity of the head and face) and a band on five
  more.

  Two bands moved as a direct result. Hearing impairment at 78.12% and ataxia at
  ~77% were VERY_FREQUENT in the draft, read across from the source's
  qualitative "most common" grouping; both are below the 80% threshold and are
  now FREQUENT. Reading a ranking as if it were a measurement pushed two
  phenotypes one band too high.

  Three phenotypes still carry no band, and the reason is now specific rather
  than blanket: seizures, developmental regression and severe speech delay are
  described in the case series but are not rows in the cohort table, so there is
  no denominator to band them from.

  What the mechanism claims. The cerebellar branch is the only one with a
  cell-autonomous demonstration, and it is a mouse conditional knockout. The
  extracerebellar branch is one coarse node with unqualified outgoing edges,
  which is an honest picture of the evidence rather than an unfinished one, and
  the HUMAN_MODEL_MISMATCH discussion records why. That node takes its inbound
  edges from the mTOR node and from the adhesion node; an earlier draft left it
  with none, so the whole extracerebellar branch hung off a node the graph never
  reached.

  Two phenotypes are deliberately left unwired. Hand deformity and deformity of
  the head and face are the commonest non-neurological features, and nothing
  located connects either to post-mitotic cell attrition, which is what the node
  above them claims. A dysmorphism is a morphogenesis phenotype and the node is
  a cell-survival one; drawing the edge would assert a developmental role for
  PTRH2 that no source in this entry supports. The anoikis arm is
  curated because it is what the protein does, with an explicit statement that no
  study has shown it dysregulated in patient tissue.

  Deep research. One OpenScientist run, committed; reference validation reports
  11 of 11 references resolved. `just preflight-dr` returned SKIP, which means
  unchecked, because MONDO records no causal gene for MONDO:0024189 and no OMIM
  xref either. Manual fallback: PTRH2 46 mentions against 7 for MFN1 and FKBP8
  and 5 for KIF1A, and the report's OMIM #616263 is IMNEPD1. Right entity.

  The run's term validation flagged three NCIT identifiers whose labels name
  entirely unrelated concepts: C158477 offered as "Pancreatic Enzyme
  Replacement" but named 5/10 HLA Match, C29099 as "Levothyroxine" but named
  Hydrocodone Bitartrate, C99277 as "Cochlear Implant" but named FUS/ATF1 Fusion
  Gene. None is bound here. Those three are exactly the treatments this disease
  needs terms for, so the effect of the check is that the entry carries one
  generic supportive-care treatment instead of three specific ones. That is the
  right outcome and it is not a satisfying one.

  What is deliberately absent. No datasets: block; no dataset specific to this
  disease was identified. No clinical_trials: block; none found. No
  environmental: block. No GeneReviews chapter exists for this disorder; `just
  check-genereviews` reports NO_CHAPTER, and that was confirmed after synonyms
  were written rather than before.

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic PTRH2 variants, homozygous in essentially every published family.
    Nearly all reported families are consanguineous, which is both how the gene
    was found -- homozygosity mapping plus exome sequencing in the founding
    family -- and why the allele spectrum is dominated by one recurrent missense
    change rather than by many private ones.
  evidence:
  - reference: PMID:25574476
    reference_title: "Mutations in PTRH2 cause novel infantile-onset multisystem disease with intellectual disability, microcephaly, progressive ataxia, and muscle weakness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a consanguineous family with two individuals with IMNEPD, we identified
      a homozygous frameshift mutation in the previously not disease-associated
      peptidyl-tRNA hydrolase 2 (PTRH2) gene.
    explanation: >-
      The founding observation: a homozygous variant in a consanguineous family,
      which is the segregation argument for recessive inheritance and the first
      link of this gene to any disease.
  - reference: PMID:27129381
    reference_title: Phenotype variability of infantile-onset multisystem neurologic, endocrine, and pancreatic disease IMNEPD.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report five further IMNEPD patients from two consanguineous
      families with a PTRH2 missense mutation and discuss their phenotype,
      thereby illustrating both core and variable features of IMNEPD.
    explanation: >-
      Independent consanguineous families with a different allele, which is what
      moved the gene-disease relationship past a single family.
prevalence:
- population: Published IMNEPD cases worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The disease is known from a few dozen published patients, almost all from
    consanguineous Middle Eastern and North African families. No population
    prevalence has been estimated and none should be inferred from the case
    count, because ascertainment is entirely through consanguineous pedigrees
    referred for exome sequencing.
  evidence:
  - reference: PMID:39766776
    reference_title: An Update of Phenotypic-Genotypic IMNEPD Cases and a Bioinformatics Analysis of the New PTRH2 Gene Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In this study, we describe a new case carrying a previously identified
      mutation, provide an updated analysis of the relative frequencies of the
      clinical features across all published cases (including the three latest
      studies), and perform a bioinformatics analysis of the newly identified
      PTRH2 protein variants from a structural perspective.
    explanation: >-
      Establishes that the evidence base for this disease is an aggregation of
      all published cases rather than any cohort, which is what bounds every
      frequency statement in this entry.
progression:
- phase: Infantile onset
  notes: >-
    Global developmental delay and motor delay are noticed in infancy or the
    first year. The founding siblings had postnatal microcephaly and growth
    retardation alongside the developmental delay, so the disorder is present but
    not obviously multisystem at presentation.
  evidence:
  - reference: PMID:25574476
    reference_title: "Mutations in PTRH2 cause novel infantile-onset multisystem disease with intellectual disability, microcephaly, progressive ataxia, and muscle weakness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The two affected children suffer from intellectual disability, postnatal
      microcephaly, growth retardation, progressive ataxia, distal muscle
      weakness, peripheral demyelinating sensorimotor neuropathy, sensorineural
      deafness, exocrine pancreas insufficiency, hypothyroidism, and show signs
      of liver fibrosis.
    explanation: >-
      The full phenotype of the founding family, which is the definition of the
      syndrome and the source for most of the individual phenotypes below.
- phase: Progressive cerebellar and peripheral nerve deterioration
  notes: >-
    Ataxia is progressive and tracks a cerebellar atrophy that is not present at
    birth: one reported patient had a normal brain MRI earlier and cerebellar
    atrophy on a later scan. The peripheral neuropathy is demyelinating and
    sensorimotor. This is the phase that distinguishes IMNEPD from a static
    developmental disorder.
  evidence:
  - reference: PMID:36949636
    reference_title: Novel PTRH2 gene variant causing IMNEPD (infantile-onset multisystem neurologic, endocrine, and pancreatic disease) in 2 Saudi siblings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain magnetic resonance imaging (MRI) recently reported cerebellar atrophy
      when compared to normal previous MRI
    explanation: >-
      Serial imaging in one patient showing the atrophy appearing over time,
      which is the observation that makes this a progressive rather than a
      congenital cerebellar phenotype.
- phase: Later endocrine and pancreatic involvement
  notes: >-
    Diabetes mellitus can appear well into childhood; one reported patient was
    diagnosed at age 12 with an HbA1c of 15.3%. So a child assessed early has not
    yet passed through the window in which the endocrine features of the disease
    name appear.
  evidence:
  - reference: PMID:36949636
    reference_title: Novel PTRH2 gene variant causing IMNEPD (infantile-onset multisystem neurologic, endocrine, and pancreatic disease) in 2 Saudi siblings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the age of 12 years, patient was diagnosed with insulin-dependent
      diabetes mellitus when hemoglobin A1c (HbA1c) was 15.3% but was not in
      ketoacidosis.
    explanation: >-
      A dated onset for the diabetes in one patient, which is what makes the
      endocrine involvement a later phase rather than a presenting feature.
pathophysiology:
- name: PTRH2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic PTRH2 variants. The reported alleles are the founding frameshift
    c.269_270delCT and the recurrent missense p.Gln85Pro, which accounts for
    about half of published cases and acts by destabilising the protein rather
    than by abolishing transcription: patient fibroblasts carrying it have normal
    PTRH2 mRNA and strongly reduced protein.
  genes:
  - preferred_term: PTRH2
    term:
      id: hgnc:24265
      label: PTRH2
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: peptidyl-tRNA hydrolase activity
    modifier: DECREASED
    term:
      id: GO:0004045
      label: peptidyl-tRNA hydrolase activity
  downstream:
  - target: Reduced mTOR Pathway Activation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The step the disease is understood through, and the one whose intermediate
      chemistry is missing. PTRH2 loss reduces mTOR activation in patient cells
      and in mutant mouse brain, but no published work shows how a
      peptidyl-tRNA hydrolase or an adhesion-signalling scaffold produces that.
    evidence:
    - reference: PMID:25574476
      reference_title: "Mutations in PTRH2 cause novel infantile-onset multisystem disease with intellectual disability, microcephaly, progressive ataxia, and muscle weakness."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Moreover, we link PTRH2 to the mTOR pathway and thus the control of cell
        size.
      explanation: >-
        The link asserted by the founding paper, on the strength of patient
        fibroblasts and mutant mice together. It is the claim this edge makes and
        it is stated at exactly this level of detail in the source.
  - target: Loss of Adhesion-Dependent Survival Signalling
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25574476
    reference_title: "Mutations in PTRH2 cause novel infantile-onset multisystem disease with intellectual disability, microcephaly, progressive ataxia, and muscle weakness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PTRH2 encodes a primarily mitochondrial protein involved in
      integrin-mediated cell survival and apoptosis signaling.
    explanation: >-
      What the protein is and where it acts, from the paper that connected it to
      disease.
  - reference: PMID:27129381
    reference_title: Phenotype variability of infantile-onset multisystem neurologic, endocrine, and pancreatic disease IMNEPD.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report five further IMNEPD patients with a different homozygous
      PTRH2 mutation, broaden the phenotypic spectrum of the disease and
      differentiate common symptoms and interindividual variability in IMNEPD
      associated with a unique mutation.
    explanation: >-
      A second allele in independent families. The phrase "associated with a
      unique mutation" is the report's own framing of why one recurrent allele
      dominates the published series.
- name: Loss of Adhesion-Dependent Survival Signalling
  biological_scale: CELLULAR
  description: >-
    PTRH2, as BIT1, is a mitochondrial protein released into the cytosol when a
    cell loses contact with the extracellular matrix, where it complexes with the
    Groucho/TLE protein AES and drives caspase-independent apoptosis. Attachment
    to fibronectin counteracts it. So the wild-type protein sits on both sides of
    a survival decision, and losing it removes both the death signal and the
    attachment-dependent survival arm.

    This node is the mechanism most often quoted for IMNEPD and the one least
    connected to it: the anoikis work is cell-biological and predates the
    disease, and no published study demonstrates dysregulated anoikis in patient
    tissue. It is recorded because it is what PTRH2 does, with the gap stated
    rather than bridged.
  biological_processes:
  - preferred_term: cell-matrix adhesion
    modifier: ABNORMAL
    term:
      id: GO:0007160
      label: cell-matrix adhesion
  evidence:
  - reference: PMID:15006356
    reference_title: A mitochondrial protein, Bit1, mediates apoptosis regulated by integrins and Groucho/TLE corepressors.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cytoplasmic Bit1 forms a complex with AES, a small Groucho/transducin-like
      enhancer of split (TLE) protein, and induces cell death with
      characteristics of caspase-independent apoptosis.
    explanation: >-
      The anoikis mechanism, established in cell culture ten years before PTRH2
      was linked to any disease. It describes the protein, not this disease.
  - reference: PMID:15006356
    reference_title: A mitochondrial protein, Bit1, mediates apoptosis regulated by integrins and Groucho/TLE corepressors.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cell attachment to fibronectin counteracts the apoptotic effect of Bit1 and
      AES.
    explanation: >-
      The adhesion dependence that makes this a switch rather than a constitutive
      death signal.
- name: Reduced mTOR Pathway Activation
  biological_scale: CELLULAR
  description: >-
    Reduced mTOR signalling, read out as lower phosphorylated ribosomal protein
    S6. It is present in patient fibroblasts and in mutant mouse brain, and in
    the Purkinje-cell-specific knockout it sits alongside reduced cell size,
    stunted dendrites and eventual cell loss. Because mTOR sets cell mass, this
    is the node that makes an atrophy phenotype out of a translation-and-adhesion
    protein.
  biological_processes:
  - preferred_term: TOR signaling
    modifier: DECREASED
    term:
      id: GO:0031929
      label: TOR signaling
  downstream:
  - target: Purkinje Cell Atrophy and Loss
    causal_link_type: DIRECT
    description: >-
      Demonstrated cell-autonomously: deleting Ptrh2 in Purkinje cells alone
      lowers pS6 in those cells and produces their atrophy and eventual loss.
    evidence:
    - reference: PMID:36219306
      reference_title: PTRH2 is Necessary for Purkinje Cell Differentiation and Survival and its Loss Recapitulates Progressive Cerebellar Atrophy and Ataxia Seen in IMNEPD Patients.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Loss of PTRH2 in PCs leads to downregulation of the mTOR pathway and PC
        atrophy.
      explanation: >-
        The authors' statement of the edge, from the conditional knockout that
        isolates it to the Purkinje cell.
  evidence:
  - reference: PMID:36219306
    reference_title: PTRH2 is Necessary for Purkinje Cell Differentiation and Survival and its Loss Recapitulates Progressive Cerebellar Atrophy and Ataxia Seen in IMNEPD Patients.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      PCs of Ptrh2ΔPC mice had reduced cell size and density, stunted dendrites,
      and lower levels of ribosomal protein S6, a readout of the mammalian target
      of rapamycin pathway.
    explanation: >-
      The mTOR readout measured in the cells that atrophy, with the marker named
      and its interpretation stated by the authors.
- name: Purkinje Cell Atrophy and Loss
  biological_scale: TISSUE
  description: >-
    Progressive loss of Purkinje cells, first as reduced size and density with
    stunted dendrites and later as frank loss. This is the cellular substrate of
    the cerebellar atrophy seen on serial MRI in patients, established
    cell-autonomously in a conditional mouse knockout rather than in human
    tissue.
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  downstream:
  - target: Ataxia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Cerebellar atrophy
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36219306
    reference_title: PTRH2 is Necessary for Purkinje Cell Differentiation and Survival and its Loss Recapitulates Progressive Cerebellar Atrophy and Ataxia Seen in IMNEPD Patients.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      By adulthood, there was a marked loss of PCs. Thus, we identify a cell
      autonomous requirement for PTRH2 in PC maturation and survival.
    explanation: >-
      The endpoint and the cell-autonomy claim, which together are why this node
      is placed between the mTOR node and the ataxia phenotype rather than beside
      them.
- name: Post-Mitotic Cell Attrition Outside the Cerebellum
  biological_scale: ORGANISM
  description: >-
    The same survival failure is proposed to explain the peripheral nerve,
    muscle, pancreatic, thyroid and liver features, on the argument that PTRH2 is
    highly expressed in developing tissue and maintains cell survival there. That
    is the founding paper's framing, and it is a general claim rather than a
    demonstrated route to any one organ: no conditional knockout outside the
    Purkinje cell has been reported, so this node is deliberately coarse and its
    outgoing edges are all INDIRECT_UNKNOWN_INTERMEDIATES.
  downstream:
  - target: Peripheral neuropathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Distal muscle weakness
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Sensorineural hearing impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Exocrine pancreatic insufficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Diabetes mellitus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hypothyroidism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormality of the liver
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Secondary microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:25574476
    reference_title: "Mutations in PTRH2 cause novel infantile-onset multisystem disease with intellectual disability, microcephaly, progressive ataxia, and muscle weakness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that PTRH2 is highly expressed in the developing brain and is a key
      determinant in maintaining cell survival during human tissue development.
    explanation: >-
      The general survival claim this node rests on. Note it is about the
      developing brain and human tissue development at large, not about pancreas,
      thyroid or nerve, which is why the edges below are unqualified as to
      intermediates.

genetic:
- name: PTRH2
  gene_term:
    preferred_term: PTRH2
    term:
      id: hgnc:24265
      label: PTRH2
  relationship_type: CAUSATIVE
  notes: >-
    PTRH2 on 17q23.1 encodes peptidyl-tRNA hydrolase 2, also called BIT1. It was
    not associated with any disease before 2014. Biallelic variants cause IMNEPD.

    The allele spectrum is unusual in being dominated by one recurrent missense
    change, p.Gln85Pro, across unrelated consanguineous Arab communities. That
    allele leaves transcription intact and destabilises the protein, which is why
    a missense change behaves as loss of function here.
  variants:
  - name: c.269_270delCT, p.Ala90fs
    description: >-
      Homozygous in the founding Yazidian-Turkish family of two affected
      siblings. A frameshift, and the allele that established the gene-disease
      relationship.
  - name: c.254A>C, p.Gln85Pro
    description: >-
      The recurrent missense allele, reported in multiple unrelated consanguineous
      families. Patient fibroblasts carrying it have normal PTRH2 mRNA and
      strongly reduced protein, so it acts by destabilising the protein rather
      than by preventing its transcription.
  evidence:
  - reference: PMID:25574476
    reference_title: "Mutations in PTRH2 cause novel infantile-onset multisystem disease with intellectual disability, microcephaly, progressive ataxia, and muscle weakness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a consanguineous family with two individuals with IMNEPD, we identified
      a homozygous frameshift mutation in the previously not disease-associated
      peptidyl-tRNA hydrolase 2 (PTRH2) gene.
    explanation: The gene-disease assertion and the founding allele.
  - reference: PMID:27129381
    reference_title: Phenotype variability of infantile-onset multisystem neurologic, endocrine, and pancreatic disease IMNEPD.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We further demonstrated the association of a homozygous nonsense mutation
      in the PTRH2 gene (MIM*608625) to IMNEPD through functional and molecular
      data in human and mouse [1].
    explanation: >-
      The authors' own summary of how the gene-disease link was established,
      naming the human and mouse evidence together. Note this sentence recites
      their earlier paper rather than reporting a new result.
    quote_role: BACKGROUND
animal_models:
- name: Purkinje-cell-specific Ptrh2 knockout mouse
  species: Mouse
  genotype: Ptrh2 LoxP x Pcp2-Cre, Purkinje-cell-specific conditional knockout
  publication: PMID:36219306
  description: >-
    The conditional knockout is what makes the cerebellar mechanism a claim about
    Purkinje cells rather than about the cerebellum in general. The constitutive
    knockout in the same paper is severely runted and dies by postnatal day 14,
    so it cannot be used to study a progressive adult phenotype at all; deleting
    Ptrh2 in Purkinje cells alone gives animals that survive to adulthood and
    develop ataxia.
  modeled_mechanisms:
  - target: Purkinje Cell Atrophy and Loss
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Reduced Purkinje cell size and density, stunted dendrites, lower
      phosphorylated ribosomal protein S6, and marked cell loss by adulthood,
      with progressive cerebellar atrophy and ataxia at the whole-animal level.
    limitations: >-
      The human counterpart is inferred from MRI atrophy; no human IMNEPD
      cerebellar tissue has been examined. And the model is a Purkinje-cell
      deletion, where patients are constitutive biallelic carriers, so it
      isolates the cell-autonomous contribution by construction and says nothing
      about how much of the human cerebellar phenotype is cell-autonomous.
    readouts:
    - name: Purkinje cell phosphorylated ribosomal protein S6
      target: Purkinje Cell Atrophy and Loss
      direction: DECREASED
      interpretation: Reduced mTOR pathway activity in the affected cells.
      evidence:
      - reference: PMID:36219306
        reference_title: PTRH2 is Necessary for Purkinje Cell Differentiation and Survival and its Loss Recapitulates Progressive Cerebellar Atrophy and Ataxia Seen in IMNEPD Patients.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          PCs of Ptrh2ΔPC mice had reduced cell size and density, stunted
          dendrites, and lower levels of ribosomal protein S6, a readout of the
          mammalian target of rapamycin pathway.
        explanation: The measurement and the authors' interpretation of the marker.
    - name: Gait and ataxia assessment
      target: Purkinje Cell Atrophy and Loss
      direction: ALTERED
      interpretation: >-
        Functional cerebellar deficit in the conditional knockout, matching the
        patients' ataxia.
      evidence:
      - reference: PMID:36219306
        reference_title: PTRH2 is Necessary for Purkinje Cell Differentiation and Survival and its Loss Recapitulates Progressive Cerebellar Atrophy and Ataxia Seen in IMNEPD Patients.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Ptrh2ΔPC PC specific knockout mice survived until adult age; however,
          they showed progressive cerebellar atrophy and functional cerebellar
          deficits with abnormal gait and ataxia.
        explanation: >-
          The behavioural and imaging phenotype, with the survival difference
          from the constitutive knockout stated in the same sentence.
    evidence:
    - reference: PMID:36219306
      reference_title: PTRH2 is Necessary for Purkinje Cell Differentiation and Survival and its Loss Recapitulates Progressive Cerebellar Atrophy and Ataxia Seen in IMNEPD Patients.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This suggests a molecular mechanism underlying the ataxia and cerebellar
        atrophy seen in patients with PTRH2 mutations leading to infantile-onset
        multisystem neurologic, endocrine, and pancreatic disease.
      explanation: >-
        The authors' own statement that the model is informative for the human
        disease, hedged as "suggests", which is the level at which this link is
        curated.
diagnosis:
- name: Exome or genome sequencing for biallelic PTRH2 variants
  description: >-
    The diagnosis is molecular. The gene was found by homozygosity mapping plus
    whole-exome sequencing in a consanguineous family, and subsequent cases have
    been found the same way. There is no biochemical or imaging test specific to
    the disease: cerebellar atrophy on MRI is supportive and appears late.
  evidence:
  - reference: PMID:25574476
    reference_title: "Mutations in PTRH2 cause novel infantile-onset multisystem disease with intellectual disability, microcephaly, progressive ataxia, and muscle weakness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed whole-exome sequencing followed by bioinformatic analysis and
      Sanger sequencing on affected and unaffected family members.
    explanation: >-
      The method that identified the gene, and the one used to diagnose since.
  - reference: PMID:36949636
    reference_title: Novel PTRH2 gene variant causing IMNEPD (infantile-onset multisystem neurologic, endocrine, and pancreatic disease) in 2 Saudi siblings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It showed a novel homozygous variant in PTRH2 gene classified as likely
      pathogenic according to American College of Medical Genetics
      classification
    explanation: >-
      A contemporary diagnosis by sequencing with ACMG classification, which is
      the current route.
treatments:
- name: Multidisciplinary supportive management
  description: >-
    No disease-modifying therapy exists. Management addresses the individual
    manifestations: developmental and rehabilitative support, audiological
    management, pancreatic enzyme and thyroid hormone replacement where indicated,
    and diabetes care. Nothing available targets PTRH2 or the mTOR deficit.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: multidisciplinary supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Post-Mitotic Cell Attrition Outside the Cerebellum
    description: >-
      Addresses the organ failures the attrition produces. It does not act on the
      attrition.
  evidence:
  - reference: PMID:31057140
    reference_title: "Infantile-Onset Multisystem Neurologic, Endocrine, and Pancreatic Disease: Case and Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical phenotyping enabled a targeted approach to the investigation and
      identification of a novel homozygous nonsense mutation in PTRH2
    explanation: >-
      Recognising the phenotype is what directs the workup, which is the only
      intervention in this disease that changes anything: there is no
      disease-modifying therapy, so the value of diagnosis is organ-directed
      supportive care and family counselling.
discussions:
- discussion_id: gap_imnepd_which_ptrh2_function_causes_the_disease
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does IMNEPD run through PTRH2's peptidyl-tRNA hydrolase activity, its
    adhesion-regulated survival signalling, or neither directly?
  attaches_to:
  - "pathophysiology#PTRH2 Loss of Function"
  - "pathophysiology#Loss of Adhesion-Dependent Survival Signalling"
  rationale: >-
    PTRH2 has two well-characterised and unrelated functions, and the disease
    literature routes through a third observation, reduced mTOR activation, whose
    connection to either is unexplained. The hydrolase activity is a
    mitochondrial translation quality-control step; the BIT1 anoikis work is
    cell-biological, predates the disease by a decade, and has never been shown
    dysregulated in patient tissue. Neither has been tested against the disease
    by the obvious experiment: a separation-of-function allele. The recurrent
    p.Gln85Pro variant destabilises the protein and so removes both functions at
    once, which is why the commonest allele cannot distinguish them. The stake is
    not academic, because mTOR is druggable and the other two arms are not: if
    the cerebellar phenotype is an mTOR-deficit phenotype, an mTOR-directed
    intervention is a coherent thing to test, and if it is a translation
    quality-control failure it is not.
  proposed_experiments:
  - experiment_id: exp_imnepd_separation_of_function_alleles
    name: Hydrolase-dead versus adhesion-signalling-dead PTRH2 knock-in mice
    description: >-
      Generate knock-in mice carrying a catalytically dead PTRH2 and, separately,
      an allele that disrupts the FAK interaction while preserving hydrolase
      activity, and compare Purkinje cell size, phosphorylated S6 and gait
      against the conditional knockout. Either allele reproducing the phenotype
      would assign the disease to that arm; neither doing so would say the
      relevant function is a third one.
- discussion_id: gap_imnepd_extracerebellar_mechanism
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Is the pancreatic, thyroid, hepatic and peripheral nerve involvement in
    IMNEPD produced by the same mTOR-dependent cell attrition demonstrated in
    Purkinje cells, or by something else?
  attaches_to:
  - "pathophysiology#Post-Mitotic Cell Attrition Outside the Cerebellum"
  rationale: >-
    The cerebellar arm of this disease has a clean cell-autonomous mouse
    demonstration. No other organ does. The constitutive knockout, which would be
    the model for the multisystem phenotype, dies by postnatal day 14 and so
    cannot express a phenotype that in patients appears over years, with diabetes
    reported as late as age 12. Every extracerebellar edge in this entry is
    therefore an extrapolation from one cell type in one tissue, and the entry
    marks them INDIRECT_UNKNOWN_INTERMEDIATES for that reason. This is a
    model-fidelity gap rather than an absence of evidence: the evidence exists,
    in mouse, for a compartment that does not include the organs the disease is
    named after.
  proposed_experiments:
  - experiment_id: exp_imnepd_tissue_specific_conditional_knockouts
    name: Pancreatic and Schwann cell conditional Ptrh2 knockouts
    description: >-
      Delete Ptrh2 in pancreatic acinar cells and, separately, in Schwann cells,
      in animals that survive to adulthood, and test whether exocrine
      insufficiency and demyelinating neuropathy arise cell-autonomously with the
      same reduction in phosphorylated S6 seen in Purkinje cells.
notes: >-
  Scope. MONDO:0024189 was bound nowhere in kb/ before this entry, and no entry
  binds PTRH2. This is IMNEPD1, the PTRH2 form. A second locus has been proposed
  in the literature under a synergistic PTRH2 plus KIF1A model; that report is
  not curated here, because a two-gene synergy claim in one family is a different
  assertion from this entry's monogenic one and would need its own treatment.

  Frequencies, and what was deliberately not taken. The deep-research report
  tabulates numeric frequencies for thirteen phenotypes (motor delay 94%,
  neuropathy 89%, intellectual disability 87.5%, and so on) attributed to the
  2024 cohort update. Those numbers are not in that paper's abstract, which is
  what the reference cache holds and what snippet validation can check, so none
  of them is curated. What the abstract does state is a ranking, that six named
  features are "the most common symptoms" and the rest fall into two lower
  bands, and that sentence is what the VERY_FREQUENT bands here rest on. Six
  phenotypes carry a band; the endocrine and pancreatic ones the disease is named
  after do not, because the source that ranks them places them below the top
  group without saying where.

  This is a real loss and it is worth naming: a reader wanting the 33% figure for
  exocrine pancreatic insufficiency will not find it here, and the reason is that
  the only accessible form of the source cannot support it. An entry that quoted
  the numbers from the report's table would look more complete and would be
  citing the deep-research run rather than the paper.

  What the mechanism claims. The cerebellar branch is the only one with a
  cell-autonomous demonstration, and it is a mouse conditional knockout. The
  extracerebellar branch is one coarse node with eight unqualified outgoing
  edges, which is an honest picture of the evidence rather than an unfinished
  one, and the HUMAN_MODEL_MISMATCH discussion records why. The anoikis arm is
  curated because it is what the protein does, with an explicit statement that no
  study has shown it dysregulated in patient tissue.

  Deep research. One OpenScientist run, committed; reference validation reports
  11 of 11 references resolved. `just preflight-dr` returned SKIP, which means
  unchecked, because MONDO records no causal gene for MONDO:0024189 and no OMIM
  xref either. Manual fallback: PTRH2 46 mentions against 7 for MFN1 and FKBP8
  and 5 for KIF1A, and the report's OMIM #616263 is IMNEPD1. Right entity.

  The run's term validation flagged three NCIT identifiers whose labels name
  entirely unrelated concepts: C158477 offered as "Pancreatic Enzyme
  Replacement" but named 5/10 HLA Match, C29099 as "Levothyroxine" but named
  Hydrocodone Bitartrate, C99277 as "Cochlear Implant" but named FUS/ATF1 Fusion
  Gene. None is bound here. Those three are exactly the treatments this disease
  needs terms for, so the effect of the check is that the entry carries one
  generic supportive-care treatment instead of three specific ones. That is the
  right outcome and it is not a satisfying one.

  What is deliberately absent. No datasets: block; no dataset specific to this
  disease was identified. No clinical_trials: block; none found. No
  environmental: block. No GeneReviews chapter exists for this disorder; `just
  check-genereviews` reports NO_CHAPTER, and that was confirmed after synonyms
  were written rather than before.

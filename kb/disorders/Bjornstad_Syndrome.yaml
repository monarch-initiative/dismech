- name: Hair Shaft Keratin Assembly Failure
  biological_scale: TISSUE
  description: >-
    Transmission electron microscopy in one Bjornstad patient showed wavy cuticle layers of variable thickness
    and loosely packed cortical keratin intermediate filaments. The authors localized the abnormalities below
    the infundibulum and proposed abnormal disulfide bonding; they did not directly measure a disulfide-bond
    defect or establish ROS as its cause. Ex vivo hair testing found reduced mechanical strength, consistent
    with the fragile, twisted shaft phenotype.

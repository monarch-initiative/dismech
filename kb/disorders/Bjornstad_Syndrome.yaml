classifications:
  mechanistic_category:
  - classification_value: mitochondrial disease
    notes: >-
      BCS1L is a nuclear-encoded mitochondrial assembly factor. Predominantly hair and hearing manifestations
      do not make this an mtDNA-inherited disorder.
    evidence:
    - reference: PMID:17314340
      reference_title: Missense mutations in the BCS1L gene as a cause of the Björnstad syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        BCS1L encodes a member of the AAA family of ATPases that is necessary for
        the assembly of complex III in the mitochondria.
      explanation: >-
        Identifies the causal gene as a mitochondrial respiratory chain assembly
        factor, which is what places this disorder in the mitochondrial category.
      quote_role: BACKGROUND
      directness: DIRECT
description: >-
  Bjornstad syndrome is a predominantly hair-and-hearing presentation of autosomal recessive BCS1L-related
  mitochondrial disease, characterized by pili torti, hair fragility and sensorineural hearing loss. Onset
  and hearing severity vary. BCS1L assists delivery of the folded Rieske iron-sulfur protein to respiratory
  complex III; pathogenic genotypes can impair assembly and alter cellular redox metabolism. The mechanisms
  determining cochlear and follicular vulnerability remain incompletely established. Most recognized cases
  have a restricted phenotype, but additional findings, including intellectual disability, have been reported.
  Severe multisystem BCS1L disorders overlap genetically and require a broader clinical assessment.
notes: >-
  This entry centers on the pili-torti and hearing-loss phenotype, while distinguishing severe multisystem
  BCS1L disease in the differential diagnosis. Published diagnostic labels overlap; an additional finding does
  not by itself establish a separate molecular disorder. Gene and variant effects depend on the complete biallelic
  genotype, and published protein numbering is retained as reported. The institutional PDF from the University
  of Medicine and Pharmacy at Ho Chi Minh City is the full text of PMID:34931354, whose PubMed record lacks
  an abstract. PMID:41466500 (late-onset alopecia) and PMID:41814923 (tofacitinib/minoxidil) are recent bibliographic
  leads; the retrieved records contained no abstract and full text was not obtained, so no patient details
  or treatment-response claims are derived from their titles.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  penetrance: UNKNOWN
  description: >-
    Molecularly established BCS1L-related Bjornstad syndrome is autosomal recessive. Both homozygous and compound-heterozygous
    genotypes occur, including a reported missense/nonsense combination. Protein residual function and clinical
    severity cannot be inferred solely from the variant class. Historical apparently dominant pedigrees predated
    identification of BCS1L and do not establish dominant BCS1L inheritance.
  evidence:
  - reference: PMID:17314340
    reference_title: Missense mutations in the BCS1L gene as a cause of the Björnstad syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Björnstad syndrome, an autosomal recessive disorder associated with
      sensorineural hearing loss and pili torti, is caused by mutation of a
      previously unidentified gene on chromosome 2q34-36.
    explanation: >-
      States the recessive mode of inheritance and the two defining clinical
      features together.
    quote_role: BACKGROUND
    directness: DIRECT
  - reference: PMID:24172246
    reference_title: Novel mutation in AAA domain of BCS1L causing Bjornstad syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel homozygous missense mutation c.901T>A was identified, which
      segregated with the disease in the family.
    explanation: >-
      Homozygosity for a missense allele segregating with disease in a large
      consanguineous family is direct evidence of recessive transmission.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:25895478
    reference_title: Exome sequencing reveals novel BCS1L mutations in siblings with hearing loss and hypotrichosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The siblings were compound heterozygotes, and the inheritance mode of autosomal recessive was postulated.
    explanation: >-
      The molecular report documents a compound-heterozygous family.
    quote_role: PRIMARY_RESULT
  - reference: PMID:11807445
    reference_title: 'Three members of a family with pili torti and sensorineural hearing loss: the Bjornstad syndrome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      We describe a family in which 3 members have the combination of pili torti and varying degrees of hearing
      loss inherited in an apparently autosomal dominant fashion.
    explanation: >-
      This pre-gene-discovery pedigree is a historical phenotypic observation, not evidence of a dominant BCS1L
      allele.
    quote_role: PRIMARY_RESULT

- name: BCS1L sequencing
  description: >-
    BCS1L sequencing with parental segregation can confirm a compatible recessive genotype; exome or broader
    hearing-loss testing can help in atypical presentations. Normal muscle respiratory-chain enzyme activities
    do not exclude BCS1L disease: this limitation was observed in intermediate and severe cases, rather than
    demonstrated to be specific to classic Bjornstad syndrome.

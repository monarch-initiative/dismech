      devoid of any pigment.
    explanation: >-
      Five affected members of one family, all with twisted hair fibers,
      documenting the phenotype within a single kindred.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  notes: >-
    A defining component of the conventional clinical diagnosis; available selected reports do not establish
    population penetrance or a quantitative frequency band.
- name: Sensorineural hearing impairment

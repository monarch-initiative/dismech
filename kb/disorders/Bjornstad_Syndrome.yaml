diagnosis:
- name: Hair-shaft microscopy
  description: >-
    Microscopic assessment identifies flattened and twisted hair shafts; electron microscopy documented these
    changes in the cited case. Hair findings need interpretation with audiology and molecular testing because
    pili torti occurs in multiple inherited and acquired conditions.
  evidence:
  - reference: url:https://cmb.ump.edu.vn/upload/userfiles/images/B%C3%80I%20B%C3%81O/2021_Alopecia%20and%20hearing%20loss%20in%20a%20boy.pdf

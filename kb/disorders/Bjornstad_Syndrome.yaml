      enzyme activities in the muscle of both patients
    explanation: >-
      The two tested patients had intermediate multisystem disease and GRACILE syndrome. Their normal muscle
      enzyme assays establish a broader diagnostic limitation, not a finding unique to mild Bjornstad disease.
    directness: INDIRECT
    quote_role: PRIMARY_RESULT

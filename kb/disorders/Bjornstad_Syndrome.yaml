differential_diagnoses:
- name: GRACILE syndrome
  description: >-
    A severe allelic BCS1L disorder with fetal growth restriction, aminoaciduria, cholestasis, iron overload,
    lactic acidosis and early death. Clinical severity and organ involvement depend on the complete genotype;
    a single residue-class rule does not reliably distinguish the syndromes.
  evidence:
  - reference: PMID:17314340
    reference_title: Missense mutations in the BCS1L gene as a cause of the Björnstad syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BCS1L mutations cause disease phenotypes ranging from highly restricted
      pili torti and sensorineural hearing loss (the Björnstad syndrome) to
      profound multisystem organ failure (complex III deficiency and the GRACILE
      syndrome).
    explanation: >-
      States the allelic relationship and the clinical distance between the two
      ends of the BCS1L spectrum.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: BCS1L-related complex III deficiency
  description: >-
    Broader BCS1L disease can involve renal tubulopathy, hepatic dysfunction, encephalopathy, seizures or neuropathy.
    Biochemical complex III impairment is variably detected across tissues. These multisystem presentations
    should not automatically be assigned to the predominantly hair-and-hearing phenotype.
  evidence:
  - reference: PMID:22991165
    reference_title: Clinical and biochemical features associated with BCS1L mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected members of the families have an identical mutation in this
      gene, mutations of which are recognized causes of Björnstad syndrome,
      GRACILE syndrome and a syndrome of neonatal tubulopathy, encephalopathy,
      and liver failure (MIM 606104) leading to isolated mitochondrial
      respiratory chain complex III deficiency.
    explanation: >-
      Enumerates the allelic BCS1L disorders that must be distinguished from the
      restricted Bjornstad phenotype.
    quote_role: BACKGROUND
    directness: DIRECT
- name: BCS1L Mitopathies (intermediate phenotypes)
  description: >-
    A proposed name for intermediate BCS1L phenotypes with variable renal, hepatic, neurologic and growth manifestations.
    Published labels overlap; assessment should characterize the organ findings and complete genotype rather
    than rely on the syndrome name alone.
  evidence:

pathophysiology:
- name: BCS1L Rieske Protein Insertion Failure
  biological_scale: MOLECULAR
  description: >-
    BCS1L is an inner-mitochondrial-membrane AAA ATPase that delivers the folded Rieske iron-sulfur protein,
    UQCRFS1, during complex III maturation. Disease-associated genotypes impair this assembly function to varying
    degrees. A Bjornstad-associated p.Arg183His protein retained partial UQCRFS1 binding in a HeLa-cell co-immunoprecipitation
    assay. This supports impaired substrate engagement for that allele but does not directly measure insertion
    kinetics. Neither normal ATP turnover nor an identical substrate-binding lesion has been established for
    every Bjornstad genotype.
  genes:
  - preferred_term: BCS1L
    term:
      id: hgnc:1020
      label: BCS1L
  genetic_context:
    gene:
      preferred_term: BCS1L
      term:
        id: hgnc:1020
        label: BCS1L
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Biallelic pathogenic genotypes with variable residual BCS1L function; both homozygous and compound-heterozygous
      states are reported, including a missense/nonsense pair. The molecular effect depends on the complete
      genotype and cannot be assigned from variant class alone.
  molecular_functions:
  - preferred_term: BCS1L-mediated translocation of folded Rieske protein
    term:
      id: GO:0008320
      label: transmembrane protein transporter activity
  biological_processes:
  - preferred_term: insertion of the Rieske iron-sulfur protein into the inner membrane
    modifier: DECREASED
    term:
      id: GO:0045039
      label: protein insertion into mitochondrial inner membrane
  evidence:
  - reference: PMID:40660675
    reference_title: "BCS1L-Associated Disease: 5'-UTR Variant Shifts the Phenotype Towards Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Co‐immunoprecipitation assays showed that p.L280F exhibited markedly reduced interaction with UQCRFS1,
      similar to the severe GRACILE‐associated S78G variant, whereas p.R183H retained partial binding (Figure
      3G).
    explanation: >-
      The HeLa-cell assay includes a Bjornstad-associated comparator, p.Arg183His. It measures protein association,
      not ATPase turnover or translocation rate.
    quote_role: PRIMARY_RESULT
  - reference: PMID:38821922
    reference_title: Conformations of Bcs1L undergoing ATP hydrolysis suggest a concerted translocation mechanism for folded iron-sulfur protein substrate.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      Our results show that Bcs1L transitions directly between the ATP and ADP conformations, with no indication
      of the existence of additional intermediate forms, supporting a concerted mechanism.
    explanation: >-
      Purified wild-type mouse Bcs1L with a bovine Rieske extrinsic-domain substrate informs normal transport
      architecture. It does not establish the molecular defect of a human Bjornstad allele.
    quote_role: PRIMARY_RESULT
  downstream:

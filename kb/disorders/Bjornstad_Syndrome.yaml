discussions:
- discussion_id: bjornstad_tissue_restriction
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do many BCS1L genotypes preferentially affect hearing and hair, while other genotypes cause broader
    organ disease?
  attaches_to:
  - pathophysiology#Excess Reactive Oxygen Species Production
  - pathophysiology#Cochlear Oxidative Injury
  rationale: >-
    Increased cellular ROS and a mitochondrial-content difference were observed in the original mutant comparison,
    but neither establishes why particular tissues are affected. The reviewed sources do not provide allele-matched
    cochlear and follicular measurements. Additional clinical manifestations can occur, so tissue restriction
    is relative. Comparable oxidative burden can have different consequences because tissues differ in repair,
    antioxidant capacity and energy demand.
  proposed_experiments:
  - experiment_id: bjornstad_allele_matched_tissue_ros
    name: Allele-matched tissue comparison of oxidative burden
    description: >-
      Compare matched biallelic Bjornstad and severe BCS1L genotypes in isogenic human iPSC-derived inner-ear,
      hair-follicle and hepatic models. Measure complex III assembly, respiration, ROS, cell survival and follicular
      organization, and add genetic correction plus independently verified ROS-lowering interventions.
    would_support:
    - pathophysiology#Cochlear Oxidative Injury
    supporting_outcome:
    - Cochlear and follicular dysfunction tracks with oxidative injury and improves when ROS is normalized, with effects distinguished from restoration of respiration.
    would_refute:
    - pathophysiology#Cochlear Oxidative Injury
    refuting_outcome:
    - Cochlear and follicular injury persists despite sustained normalization of ROS with multiple validated interventions, while BCS1L correction rescues the phenotype; this would argue against ROS as the principal mediator.
  evidence:
  - reference: PMID:17314340
    reference_title: Missense mutations in the BCS1L gene as a cause of the Björnstad syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      Mutations that cause the Björnstad syndrome illustrate the exquisite sensitivity of ear and hair tissues
      to mitochondrial function, particularly to the production of reactive oxygen species.
    explanation: >-
      This is the authors' mechanistic interpretation of the clinical and biochemical findings, not a direct
      tissue-specific oxidative-injury experiment.
    quote_role: PRIMARY_RESULT
- discussion_id: bjornstad_no_faithful_model
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Which experimental systems can reproduce the hair and hearing phenotype for clinically matched BCS1L genotypes?
  attaches_to:
  - pathophysiology#Complex III Assembly Defect
  rationale: >-
    The reviewed patient-cell, yeast, HeLa and purified-protein systems resolve assembly or substrate interactions
    but do not reproduce a cochlea and hair follicle together. Severe BCS1L animal models cannot automatically
    validate a predominantly hair-and-hearing mechanism. A disease-matched tissue model remains a gap in this
    evidence set; this is not an exhaustive claim that no relevant model exists.
  evidence:
  - reference: PMID:40660675
    reference_title: "BCS1L-Associated Disease: 5'-UTR Variant Shifts the Phenotype Towards Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Co‐immunoprecipitation assays showed that p.L280F exhibited markedly reduced interaction with UQCRFS1,
      similar to the severe GRACILE‐associated S78G variant, whereas p.R183H retained partial binding (Figure
      3G).
    explanation: >-
      The HeLa-cell assay includes a Bjornstad-associated comparator, p.Arg183His. It measures protein association,
      not ATPase turnover or translocation rate.
    quote_role: PRIMARY_RESULT
  - reference: PMID:38821922
    reference_title: Conformations of Bcs1L undergoing ATP hydrolysis suggest a concerted translocation mechanism for folded iron-sulfur protein substrate.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      Our results show that Bcs1L transitions directly between the ATP and ADP conformations, with no indication
      of the existence of additional intermediate forms, supporting a concerted mechanism.
    explanation: >-
      Purified wild-type mouse Bcs1L with a bovine Rieske extrinsic-domain substrate informs normal transport
      architecture. It does not establish the molecular defect of a human Bjornstad allele.
    quote_role: PRIMARY_RESULT
- discussion_id: bjornstad_variant_mechanisms
  kind: KNOWLEDGE_GAP
  prompt: Which biochemical steps distinguish individual Bjornstad genotypes from other BCS1L presentations?
  attaches_to:
  - pathophysiology#BCS1L Rieske Protein Insertion Failure
  rationale: >-
    The 2007 residue-interface versus ATP-site classification was a homology-based explanation of the alleles
    studied then. New wild-type structural work and residual Rieske binding by p.Arg183His refine the model
    but do not prove normal ATP turnover for every Bjornstad variant. Reported compound genotypes can pair
    alleles associated with different clinical spectra, including a missense/nonsense combination. Assays of
    the complete genotype and multiple steps in transport are needed.
  evidence:
  - reference: PMID:17314340
    reference_title: Missense mutations in the BCS1L gene as a cause of the Björnstad syndrome.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: DIRECT
    snippet: >-
      Patients with the Björnstad syndrome have mutations that alter residues involved in protein-protein interactions,
      whereas mutations in patients with complex III deficiency alter ATP-binding residues, as deduced from
      the crystal structure of a related AAA-family ATPase.
    explanation: >-
      The residue-role assignments are computational deductions for the original mutant set, not a universal
      clinical classification.
    quote_role: PRIMARY_RESULT
  - reference: PMID:40660675

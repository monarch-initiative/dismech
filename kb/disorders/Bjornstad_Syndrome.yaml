phenotypes:
- name: Pili torti
  category: Integumentary
  description: >-
    Flattened hair shafts twist around their long axis. Scalp hair is usually most affected, but other hair
    findings vary between reports. Pili torti is a defining sign in combination with hearing loss and is not
    specific to this syndrome alone.
  phenotype_term:
    preferred_term: Pili torti
    term:
      id: HP:0003777
      label: Pili torti
  evidence:

      similar to the severe GRACILE‐associated S78G variant, whereas p.R183H retained partial binding (Figure
      3G).
    explanation: >-
      The HeLa-cell assay includes a Bjornstad-associated comparator, p.Arg183His. It measures protein association,
      not ATPase turnover or translocation rate.
    quote_role: PRIMARY_RESULT
  - reference: PMID:39053894
    reference_title: 'Pathological variants in nuclear genes causing mitochondrial complex III deficiency: An update.'
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      However, despite these developments, the molecular pathological mechanisms underlying the clinical heterogeneity
      in different cases of mitochondrial cIII deficiency are still not fully comprehended.
    explanation: >-
      The review describes unresolved clinical heterogeneity across complex III disorders, providing broader

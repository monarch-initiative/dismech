    reference_title: Novel compound heterozygous mutations in BCS1L gene causing Bjornstad syndrome in two siblings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bjornstad syndrome is a rare condition characterized by pili torti and
      sensorineural hearing loss associated with pathological variations in
      BCS1L.
    explanation: >-
      The introduction identifies pili torti as a conventional defining feature; it does not estimate its population
      frequency.
    quote_role: BACKGROUND
    directness: DIRECT
  - reference: PMID:24172246
    reference_title: Novel mutation in AAA domain of BCS1L causing Bjornstad syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

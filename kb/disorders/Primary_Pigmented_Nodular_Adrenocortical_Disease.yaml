- name: Phosphodiesterase Loss and Impaired cAMP Degradation
  description: >-
    Germline reduced-function variants in the phosphodiesterases PDE11A and
    PDE8B impair cAMP degradation, and this is the second route into the same
    autonomous steroidogenic programme that PRKAR1A loss and PRKACA gain reach,
    with no lesion in either of those genes. PDE8B is cAMP-specific. Both genes
    were first linked to isolated micronodular adrenocortical disease, and MONDO
    files them as the PPNAD2 and PPNAD3 children of this entry's own term. The
    two are not equivalent in strength of evidence: inactivating PDE11A defects
    were described as low-penetrance predisposing factors, consistent with
    PDE11A variants frequently co-occurring with PRKAR1A variants in PPNAD
    cohorts, whereas the reported PDE8B mutation was shown to measurably alter
    the protein's cAMP-degrading capacity in vitro.

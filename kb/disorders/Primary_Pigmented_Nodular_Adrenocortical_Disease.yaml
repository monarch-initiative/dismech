      label: PDE11A
  association: Reduced-Function Variants
  relationship_type: CAUSATIVE
  subtype: PPNAD2
  variant_origin: GERMLINE
  notes: >-
    PDE11A is a dual cAMP/cGMP phosphodiesterase; reduced-function variants
    diminish cAMP degradation and enhance cAMP/PKA signaling. PDE11A variants
    were detected in PPNAD patients, often co-occurring with PRKAR1A. Graded
    CAUSATIVE because MONDO's PPNAD2 class is defined by PDE11A as the cause
    and a truncating PDE11A variant has been reported segregating with PPNAD in
    a family whose mother required bilateral adrenalectomy for severe Cushing
    syndrome. Penetrance is nonetheless variable: inactivating PDE11A defects
    were originally described as low-penetrance predisposing factors for
    micronodular adrenocortical disease, and the index patient carrying that
    segregating variant had only mild adrenal hypercortisolism with ostensibly
    normal adrenal imaging.

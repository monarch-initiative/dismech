- name: PRKACA Copy-Number Gain and Constitutive PKA Catalytic Activation
  description: >-
    Constitutional duplication or amplification of PRKACA, the gene encoding
    the catalytic subunit of protein kinase A, is a distinct germline lesion
    from PRKAR1A loss: the catalytic subunit is gained rather than the
    regulatory subunit lost, and the reported cases are attributed to
    constitutive activation of that catalytic subunit. Systematic screening of
    781 bilateral nodular adrenocortical disease index cases found PRKACA
    duplication only in patients whose pathology was PPNAD, and the duplication
    generates topologically associated neo-domains in tumour Hi-C maps.

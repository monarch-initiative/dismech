differential_diagnoses:
- name: Spondylometaphyseal dysplasia with corneal dystrophy
  description: >-
    The other spondylometaphyseal dysplasia with an eye phenotype, and a
    phospholipid-pathway disease like this one. The eye finding separates them:
    corneal clouding there, retinal dystrophy here.
  disease_term:
    preferred_term: spondylometaphyseal dysplasia with corneal dystrophy
    term:
      id: MONDO:0030074
      label: spondylometaphyseal dysplasia with corneal dystrophy
  distinguishing_features:
  - Corneal clouding rather than cone-rod retinal dystrophy
  - PLCB3 phosphoinositide signalling rather than PCYT1A phosphatidylcholine synthesis
  - Intellectual disability is part of the PLCB3 phenotype
  evidence:
  - reference: PMID:29122926
    reference_title: >-
      Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results connect a homozygous loss of function variant in PLCB3 with a new SMD associated with corneal dystrophy and developmental delay (SMDCD).
    explanation: >-
      Defines the comparator disorder and its distinguishing eye and
      neurodevelopmental features.
discussions:
- discussion_id: gap_smdcrd_tissue_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does impairing a housekeeping enzyme of phosphatidylcholine synthesis
    produce disease confined to cartilage, retina and adipose tissue, and what
    determines which of the three a given PCYT1A genotype affects?
  attaches_to:
  - pathophysiology#Impaired CDP-Choline Pathway Flux to Phosphatidylcholine
  - pathophysiology#Growth Plate and Vertebral Dysplasia
  - pathophysiology#Cone-Rod Photoreceptor Degeneration
  rationale: >-
    Phosphatidylcholine is the most abundant membrane phospholipid in every
    cell, yet PCYT1A variants produce three tissue-restricted diseases -
    lipodystrophy, SMD-CRD and isolated retinal dystrophy - rather than one
    generalised membrane disorder. The obvious hypothesis is that the affected
    tissues have unusually high membrane turnover, but that does not explain
    the partition between the three phenotypes, and the in vitro work shows the
    variants differ qualitatively rather than only in severity - one even
    increases constitutive activity. The discovery paper states plainly that
    the pathogenic mechanism and the full phenotypic spectrum remain to be
    worked out.
  evidence:
  - reference: PMID:24387991
    reference_title: Mutations in PCYT1A cause spondylometaphyseal dysplasia with cone-rod dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, the deregulation of the phosphatidylcholine pathway may play a role in multiple genetic diseases in humans, and further studies are necessary to uncover its precise pathogenic mechanisms and the entirety of its phenotypic spectrum.
    explanation: >-
      The authors' explicit statement that the mechanism and spectrum are
      unresolved.
  - reference: PMID:30559292
    reference_title: >-
      Disease-linked mutations in the phosphatidylcholine regulatory enzyme CCTalpha impair enzymatic activity and stability.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      These in vitro analyses on purified mutant CCTs will complement future measurements of their impact on PC synthesis in cultured cells and in tissues with a stringent requirement for CCTα.
    explanation: >-
      Frames the tissue-selectivity question as future work, and names the
      stringent-requirement hypothesis this gap asks about.

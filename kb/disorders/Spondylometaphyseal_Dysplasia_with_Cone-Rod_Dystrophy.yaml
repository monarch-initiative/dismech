name: Spondylometaphyseal Dysplasia with Cone-Rod Dystrophy
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Spondylometaphyseal dysplasia with cone-rod dystrophy (SMD-CRD; OMIM #608940) is
  an ultra-rare autosomal recessive disorder caused by biallelic variants in
  PCYT1A, encoding CCT-alpha, the rate-limiting enzyme of phosphatidylcholine
  synthesis through the Kennedy pathway. Postnatal growth deficiency produces
  severe short stature with rhizomelia and bowing of the lower limbs; radiographs
  show platyspondyly with anterior vertebral protrusions and progressive
  metaphyseal irregularity and cupping of shortened tubular bones. Early-onset,
  progressive visual impairment with a pigmentary maculopathy and
  electroretinographic cone-rod dysfunction is the feature that separates SMD-CRD
  from every other spondylometaphyseal dysplasia. The same gene produces two other
  phenotypes that share almost nothing clinically — congenital lipodystrophy with
  fatty liver, and isolated retinal dystrophy with no skeletal involvement at all —
  so PCYT1A is a case where genotype does not map cleanly onto organ involvement,
  and the biochemical basis of that split is unresolved. Enzymology of the disease
  alleles shows they are not uniformly hypomorphic: some destabilise the catalytic
  fold, one impairs the regulatory linker, and one deletion of the autoinhibitory
  helix actually increases constitutive activity roughly four-fold.

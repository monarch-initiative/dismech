diagnosis:
- name: Combined Skeletal and Retinal Assessment
  description: >-
    A child with a spondylometaphyseal dysplasia should have formal retinal
    assessment including electroretinography, because the cone-rod dystrophy is what
    identifies this entity and it may not be volunteered as a complaint in a young
    child. The converse also holds: the report of isolated PCYT1A retinal dystrophy
    was made only after whole-skeleton radiography, metabolic assessment, and liver
    ultrasound had been done specifically to exclude the skeletal and hepatic
    phenotypes.
  evidence:
  - reference: PMID:28272537
    reference_title: Mutations in the PCYT1A gene are responsible for isolated forms of retinal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A thorough clinical evaluation of the patients, with whole skeleton X-ray,
      metabolic assessment and liver ultrasound failed to reveal signs of skeletal
      dysplasia, metabolic and hepatic alterations.
    explanation: >-
      Documents the cross-system workup needed to place a PCYT1A patient within the
      three-phenotype spectrum.
- name: PCYT1A Sequencing
  description: >-
    Biallelic PCYT1A variants confirm the diagnosis. Because the same gene produces
    lipodystrophy and isolated retinal dystrophy, a molecular result must be
    interpreted against the clinical picture rather than read as diagnostic of
    SMD-CRD on its own.
  evidence:
  - reference: PMID:30559292
    reference_title: Disease-linked mutations in the phosphatidylcholine regulatory enzyme CCTα impair enzymatic activity and fold stability.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations in the gene encoding CCT
    explanation: >-
      The sentence continues to name the three distinct human pathologies caused by
      PCYT1A, which is why a molecular result alone does not fix the diagnosis.
differential_diagnoses:
- name: PCYT1A-Related Congenital Lipodystrophy
  description: >-
    Congenital generalised lipodystrophy type 5, with severe fatty liver disease and
    reduced HDL cholesterol, and at most modest short stature. Allelic with SMD-CRD
    but without retinal involvement or a spondylometaphyseal dysplasia.
  evidence:
  - reference: PMID:28272537
    reference_title: Mutations in the PCYT1A gene are responsible for isolated forms of retinal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PCYT1A mutations have also been linked to a distinct phenotype presenting with
      congenital lipodystrophy and fatty liver disease without any retinal
      involvement or signs of spondylometaphyseal dysplasia apart from a modest short
      stature
    explanation: Defines the lipodystrophy phenotype and its separation from SMD-CRD.
- name: PCYT1A-Related Isolated Retinal Dystrophy
  description: >-
    Isolated retinal dystrophy with no skeletal, metabolic, or hepatic involvement,
    established in three patients from two Italian families after deliberate
    exclusion of the other two phenotypes. A PCYT1A result in a patient with retinal
    disease does not imply a skeletal dysplasia is present or will develop.
  evidence:
  - reference: PMID:28272537
    reference_title: Mutations in the PCYT1A gene are responsible for isolated forms of retinal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified, by next generation sequencing, sequence variants affecting
      function in the PCYT1A gene in three young patients with isolated retinal
      dystrophy from two different Italian families
    explanation: Establishes the isolated-retinal phenotype as a distinct allelic outcome.
- name: Other Spondylometaphyseal Dysplasias
  description: >-
    Within ISDS group 12, spondyloenchondrodysplasia (ACP5), odontochondrodysplasia
    (TRIP11), SMD Sutcliffe or corner fracture type (FN1), SMD with corneal dystrophy
    (PLCB3), and chondrodysplasia-pseudohermaphroditism syndrome (HHAT) share the
    combined vertebral and metaphyseal pattern. Of these only the PLCB3 disorder also
    involves the eye, and it affects the cornea rather than the retina, so an
    electroretinogram separates them.
  notes: >-
    Recorded without an evidence item because it is a statement about ISDS group-12
    membership, whose per-disorder placements are not quotable from the nosology
    abstract; the provenance is recorded in the classifications block.
treatments:
- name: Low-Vision Support and Ophthalmological Surveillance
  description: >-
    No therapy alters the retinal degeneration. Management is regular
    ophthalmological assessment with low-vision aids, educational support, and
    counselling about the progressive course.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:28272537
    reference_title: Mutations in the PCYT1A gene are responsible for isolated forms of retinal dystrophy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected patients have early-onset, progressive visual impairment associated
      with a pigmentary maculopathy and electroretinographic evidence of cone-rod
      dysfunction.
    explanation: >-
      Establishes the progressive visual impairment that makes low-vision support the
      standing need; it evidences the need, not a trialled intervention, hence
      PARTIAL.
- name: Orthopaedic Management of Deformity
  description: >-
    Surgical and orthotic management of progressive lower-limb bowing and of the
    spinal deformity, as for skeletal dysplasias generally. No disease-specific
    orthopaedic protocol has been published.
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  therapeutic_modality: SURGERY
  notes: >-
    Curated without an evidence item because no management study of this disorder
    exists; the record names the deformities documented in the case reports as the
    targets of standard orthopaedic care rather than asserting a trialled
    intervention.
- name: Genetic Counseling
  description: >-
    Autosomal recessive inheritance carries a 25 percent recurrence risk. Counselling
    is complicated by the three-phenotype allelic spectrum: predicting whether a
    subsequent affected child will have the skeletal, the retinal, or both components
    is not currently possible from genotype.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:24387991
    reference_title: Mutations in PCYT1A cause spondylometaphyseal dysplasia with cone-rod dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spondylometaphyseal dysplasia with cone-rod dystrophy is a rare
      autosomal-recessive disorder
    explanation: >-
      Establishes the recessive inheritance that determines the recurrence-risk
      counselling.
discussions:
- discussion_id: pcyt1a_tissue_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Deficient Phosphatidylcholine Synthesis
  prompt: >-
    Why do PCYT1A variants produce three phenotypes — skeletal plus retinal,
    lipodystrophic, or retinal alone — when phosphatidylcholine is required by every
    cell?
  rationale: >-
    This is the central unexplained fact about the gene. Phosphatidylcholine is the
    main glycerophospholipid of all cellular membranes, yet PCYT1A disease strikes
    growth plate, retina, and adipose tissue in combinations that do not
    obviously nest inside one another: isolated retinal dystrophy occurs with a
    normal whole-skeleton survey, and lipodystrophy occurs with no retinal
    involvement at all. Enzymology complicates rather than resolves it, since the
    allele classes are heterogeneous — aggregation, fold destabilisation, altered Km,
    a linker defect, and one allele that increases constitutive activity — and no
    mapping from allele class to organ pattern has been proposed. Without that
    mapping, a PCYT1A genotype cannot be used to predict which organs will be
    affected, which is a live clinical problem and not only a mechanistic curiosity.
  evidence:
  - reference: PMID:28272537
    reference_title: Mutations in the PCYT1A gene are responsible for isolated forms of retinal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the first report showing that the PCYT1A gene can be responsible for
      isolated forms of retinal dystrophy, particularly without any skeletal
      involvement, thus further expanding the phenotypic spectrum induced by
      mutations in this gene.
    explanation: >-
      Demonstrates that the organ systems dissociate, which is what makes the
      selectivity a genuine gap rather than a matter of severity.
  - reference: PMID:30559292
    reference_title: Disease-linked mutations in the phosphatidylcholine regulatory enzyme CCTα impair enzymatic activity and fold stability.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      These in vitro analyses on purified mutant CCTs will complement future
      measurements of their impact on PC synthesis in cultured cells and in tissues
      with a stringent requirement for CCT
    explanation: >-
      The authors frame the tissue-specific requirement as the outstanding
      measurement, which is the gap recorded here.
  proposed_experiments:
  - experiment_id: exp_pcyt1a_allele_class_to_organ_mapping
    name: Map allele class to organ phenotype across the PCYT1A spectrum
    description: >-
      Assemble reported PCYT1A patients with genotype and full organ phenotyping, and
      test whether the biochemically defined allele classes — aggregating,
      fold-destabilising, kinetically impaired, linker, autoinhibitory-helix —
      predict skeletal, retinal, or adipose involvement. Complement with
      phosphatidylcholine flux measurement in patient-derived chondrocytes,
      retinal organoids, and adipocytes carrying matched genotypes.
    would_support:
    - pathophysiology#Deficient Phosphatidylcholine Synthesis
    supporting_outcome:
    - >-
      A consistent relationship between allele class and organ pattern, with flux
      deficits tracking the affected tissue, would establish reduced
      phosphatidylcholine synthesis as the operative mechanism and give a
      genotype-based prediction.
    would_refute:
    - pathophysiology#Deficient Phosphatidylcholine Synthesis
    refuting_outcome:
    - >-
      Equivalent phosphatidylcholine flux across affected and spared tissues from the
      same patient would move the mechanism away from bulk synthesis towards a
      localised or moonlighting function of CCT-alpha.
- discussion_id: pcyt1a_no_model_of_the_growth_plate_lesion
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Growth-Plate Failure with Metaphyseal and Vertebral Change
  prompt: >-
    By what route does reduced phosphatidylcholine synthesis disorder the growth
    plate?
  rationale: >-
    The retinal branch at least has a standing rationale — outer segments are
    membrane-dense and continuously renewed — but nothing comparable has been
    proposed for cartilage. Chondrocytes are not conspicuously
    phosphatidylcholine-demanding, and the disorder's skeletal lesion is
    specifically metaphyseal and vertebral rather than a generalised bone
    abnormality, which a bulk membrane-supply deficit does not obviously predict.
    The step from the metabolic defect to the growth plate is therefore curated with
    unknown intermediates and is the largest hole in the mechanism.
  evidence:
  - reference: PMID:24387991
    reference_title: Mutations in PCYT1A cause spondylometaphyseal dysplasia with cone-rod dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      further studies are necessary to uncover its precise pathogenic mechanisms and
      the entirety of its phenotypic spectrum
    explanation: The founding report states the mechanism as unresolved.
  proposed_experiments:
  - experiment_id: exp_pcyt1a_chondrocyte_lipidomics
    name: Lipidomic and differentiation phenotyping of PCYT1A-mutant chondrocytes
    description: >-
      Differentiate patient iPSCs carrying SMD-CRD genotypes into growth-plate-like
      chondrocytes, and measure membrane phospholipid composition, secretory capacity,
      hypertrophic differentiation, and matrix output against isogenic corrected
      controls, with and without exogenous phosphatidylcholine or choline
      supplementation.
    would_support:
    - pathophysiology#Growth-Plate Failure with Metaphyseal and Vertebral Change
    supporting_outcome:
    - >-
      A chondrocyte differentiation or secretion defect that is rescued by restoring
      phosphatidylcholine would close the gap between the metabolic lesion and the
      growth plate, and would nominate choline supplementation as a candidate
      intervention.
    would_refute:
    - pathophysiology#Deficient Phosphatidylcholine Synthesis
    refuting_outcome:
    - >-
      A chondrocyte phenotype that is not rescued by phosphatidylcholine repletion
      would indicate the growth-plate lesion does not run through bulk
      phosphatidylcholine supply.

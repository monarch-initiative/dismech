classifications:
  isds_skeletal_category:
  - classification_value: spondylometaphyseal_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), Table 1 group 12 "Spondylometaphyseal dysplasias (SMD)",
      entry NOS 12-0040, listed as "Spondylometaphyseal dysplasia with cone-rod
      dystrophy, PCYT1A-related" (AR, PCYT1A, MIM 608940). The two other
      PCYT1A phenotypes — congenital lipodystrophy and isolated retinal dystrophy —
      are not listed in the skeletal nosology and take no ISDS group, correctly:
      neither has a skeletal dysplasia to classify.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  rate_per_100000: 0.0
  notes: >-
    A handful of families have been reported since the gene was identified in 2014,
    the founding series comprising four affected individuals from two Brazilian
    families alongside an independently published cohort. No population-based
    prevalence estimate exists; rate_per_100000 is recorded as 0.0 only to mark that
    the true rate is far below the resolution of any published survey.
  evidence:
  - reference: PMID:24387991
    reference_title: Mutations in PCYT1A cause spondylometaphyseal dysplasia with cone-rod dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing of four individuals affected by this disorder from two
      Brazilian families identified two previously unreported homozygous mutations
      in PCYT1A.
    explanation: >-
      Gives the size of the founding molecularly defined series, establishing the
      cases-in-literature scale.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    SMD-CRD is autosomal recessive. Reported probands are homozygous or compound
    heterozygous for PCYT1A variants; heterozygous carriers are unaffected. Complete
    loss of CCT-alpha is presumed incompatible with life, so every disease genotype
    retains some enzymatic function.
  evidence:
  - reference: PMID:24387991
    reference_title: Mutations in PCYT1A cause spondylometaphyseal dysplasia with cone-rod dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spondylometaphyseal dysplasia with cone-rod dystrophy is a rare
      autosomal-recessive disorder
    explanation: States the inheritance pattern directly.
genetic:
- name: Biallelic PCYT1A Variants
  gene_term:
    preferred_term: PCYT1A
    term:
      id: hgnc:8754
      label: PCYT1A
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    PCYT1A encodes CCT-alpha, which has a catalytic domain, an amphipathic
    membrane-binding domain, a signal-transducing linker between them, and an
    autoinhibitory helix. Disease alleles fall in all of these. Missense variants in
    the catalytic core (V142M, P150A) produce aggregated enzyme that cannot be
    refolded; five variants lower the unfolding transition temperature of the
    catalytic domain and three of those alter substrate Km; R223S sits in the
    regulatory linker; and E280del removes a single residue from the autoinhibitory
    helix. Allele class therefore does not reduce to a single loss-of-function
    statement.
  evidence:
  - reference: PMID:30559292
    reference_title: Disease-linked mutations in the phosphatidylcholine regulatory enzyme CCTα impair enzymatic activity and fold stability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Over-expression of two missense variants in the catalytic domain (V142M and
      P150A) generated aggregated enzymes that could not be refolded after
      solubilization by denaturation.
    explanation: Establishes protein aggregation as one distinct allele class.
  - reference: PMID:30559292
    reference_title: Disease-linked mutations in the phosphatidylcholine regulatory enzyme CCTα impair enzymatic activity and fold stability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Five variants destabilized the catalytic domain-fold as assessed by lower
      transition temperatures for unfolding, and three of these manifested defects in
      substrate Km values.
    explanation: >-
      Separates fold destabilisation from kinetic impairment as two further allele
      classes.
  - reference: PMID:24387991
    reference_title: Mutations in PCYT1A cause spondylometaphyseal dysplasia with cone-rod dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This gene encodes the alpha isoform of the phosphate cytidylyltransferase 1
      choline enzyme, which is responsible for converting phosphocholine into
      cytidine diphosphate-choline, a key intermediate step in the
      phosphatidylcholine biosynthesis pathway.
    explanation: Names the encoded enzyme and the reaction it catalyses.
pathophysiology:
- name: Biallelic PCYT1A Variants
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous PCYT1A alleles affecting the catalytic

  downstream:
  - target: Impaired CCT-alpha Catalytic Function and Fold Stability
    causal_link_type: DIRECT
    description: >-
      The disease alleles act on the enzyme itself, by aggregation, by lowering the
      thermal stability of the catalytic fold, by altering substrate affinity, or by
      disrupting the lipid-sensing regulatory apparatus.
    evidence:
    - reference: PMID:30559292
      reference_title: Disease-linked mutations in the phosphatidylcholine regulatory enzyme CCTα impair enzymatic activity and fold stability.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        A mutation (R223S) in a signal-transducing linker between the catalytic and
        membrane-binding domains also impaired enzyme kinetics.
      explanation: >-
        Shows that alleles outside the catalytic domain still converge on impaired
        enzyme function.
- name: Impaired CCT-alpha Catalytic Function and Fold Stability
  biological_scale: MOLECULAR
  description: >-
    CCT-alpha is the rate-determining enzyme of the Kennedy pathway and is
    normally activated by binding to phosphatidylcholine-deficient membranes, which
    makes it a lipid sensor as well as a catalyst. Disease alleles impair that
    function in several distinct ways, and not all of them by simple reduction:
    E280del in the autoinhibitory helix raises lipid-independent constitutive
    activity around four-fold and, unexpectedly, also enhances the response to
    anionic lipid vesicles around four-fold.
  molecular_functions:
  - preferred_term: choline-phosphate cytidylyltransferase activity
    modifier: DYSREGULATED
    term:
      id: GO:0004105
      label: choline-phosphate cytidylyltransferase activity
  cellular_components:
  - preferred_term: nuclear envelope
    term:
      id: GO:0005635
      label: nuclear envelope
  evidence:
  - reference: PMID:30559292
    reference_title: Disease-linked mutations in the phosphatidylcholine regulatory enzyme CCTα impair enzymatic activity and fold stability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      CTP:phosphocholine cytidylyltransferase (CCT) is the key regulatory enzyme in
      phosphatidylcholine (PC) synthesis and is activated by binding to PC-deficient
      membranes.
    explanation: >-
      Establishes both the rate-limiting role and the membrane-sensing regulation
      that the disease alleles disturb.
  - reference: PMID:30559292
    reference_title: Disease-linked mutations in the phosphatidylcholine regulatory enzyme CCTα impair enzymatic activity and fold stability.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      a single amino acid deletion in the autoinhibitory helix increased the
      constitutive (lipid-independent) enzyme activity
    explanation: >-
      A gain of constitutive activity in a disease allele is why this node is
      curated as DYSREGULATED rather than simply DECREASED.
  downstream:
  - target: Deficient Phosphatidylcholine Synthesis
    causal_link_type: DIRECT
    description: >-
      Reduced flux through the rate-limiting step lowers phosphatidylcholine output.
      In patient fibroblasts this shows up inconsistently across alleles — for some
      variants both CCT-alpha levels and phosphatidylcholine synthesis fall, while
      others impair synthesis with little effect on enzyme levels — so the link
      between allele and flux is not uniform.
    evidence:
    - reference: PMID:30559292
      reference_title: Disease-linked mutations in the phosphatidylcholine regulatory enzyme CCTα impair enzymatic activity and fold stability.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        Previous analyses showed that for some disease-linked PCYT1A variants steady
        state levels of CCT
      explanation: >-
        The sentence goes on to note that other variants impair synthesis with little
        effect on enzyme levels, which is why this edge is graded PARTIAL rather than
        as a uniform dose relationship.
- name: Deficient Phosphatidylcholine Synthesis
  biological_scale: MOLECULAR
  description: >-
    Phosphatidylcholine is the principal glycerophospholipid of eukaryotic membranes
    and an essential component of all of them, which is what makes the tissue
    selectivity of this disorder hard to explain. The affected tissues are presumed
    to be those with a stringent requirement for CCT-alpha specifically, rather than
    those with the highest membrane turnover in general.
  biological_processes:
  - preferred_term: phosphatidylcholine biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006656
      label: phosphatidylcholine biosynthetic process
  evidence:
  - reference: PMID:28272537
    reference_title: Mutations in the PCYT1A gene are responsible for isolated forms of retinal dystrophy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PC is the main glycerophospholipid in eukaryotic cells and is an essential
      component of all cellular membranes.
    explanation: >-
      Establishes the ubiquity of the affected metabolite, which is the starting
      point for the tissue-selectivity problem.
  downstream:
  - target: Growth-Plate Failure with Metaphyseal and Vertebral Change
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      How reduced phosphatidylcholine synthesis produces a growth-plate lesion is
      not established. The founding report is explicit that further studies are
      needed to uncover the precise pathogenic mechanisms.
    evidence:
    - reference: PMID:24387991
      reference_title: Mutations in PCYT1A cause spondylometaphyseal dysplasia with cone-rod dystrophy.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        further studies are necessary to uncover its precise pathogenic mechanisms
        and the entirety of its phenotypic spectrum
      explanation: >-
        The authors state that the mechanism connecting the metabolic defect to the
        phenotype is unknown, which is what the unknown-intermediates grading records.
  - target: Cone-Rod Photoreceptor Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Photoreceptor outer segments are membrane-dense and are renewed continuously,
      which is the standard rationale for their vulnerability to a
      phosphatidylcholine synthesis defect. That rationale is plausible but has not
      been demonstrated for these alleles, and it does not by itself explain why some
      PCYT1A genotypes spare the retina entirely while others spare the skeleton.
    evidence:
    - reference: PMID:28272537
      reference_title: Mutations in the PCYT1A gene are responsible for isolated forms of retinal dystrophy.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This is the first report showing that the PCYT1A gene can be responsible for
        isolated forms of retinal dystrophy, particularly without any skeletal
        involvement, thus further expanding the phenotypic spectrum induced by
        mutations in this gene.
      explanation: >-
        Retinal involvement can occur entirely without skeletal disease, so the two
        downstream branches are separable and neither is a consequence of the other.

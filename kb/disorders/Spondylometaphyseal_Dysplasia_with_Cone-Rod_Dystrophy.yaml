name: Spondylometaphyseal dysplasia with cone-rod dystrophy
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Spondylometaphyseal dysplasia with cone-rod dystrophy (SMD-CRD) is a rare
  autosomal recessive disorder pairing severe short stature, progressive
  lower-limb bowing, flattened vertebral bodies and metaphyseal change with
  visual loss from a cone-rod retinal dystrophy. It is caused by biallelic
  PCYT1A variants. PCYT1A encodes CCTalpha, the rate-limiting enzyme of the
  Kennedy pathway, which converts phosphocholine to CDP-choline en route to
  phosphatidylcholine - the most abundant membrane phospholipid. The gene is a
  striking instance of one enzyme producing unrelated-looking diseases: the same
  gene causes lipodystrophy and isolated retinal dystrophy as well as SMD-CRD,
  and the variants behave heterogeneously at the protein level, some reducing
  CCTalpha abundance and others impairing catalysis with the protein present.
  Why a housekeeping lipid enzyme selects cartilage and photoreceptors - two
  tissues with unusually heavy membrane demands - is not established, and the
  discovery paper says as much.

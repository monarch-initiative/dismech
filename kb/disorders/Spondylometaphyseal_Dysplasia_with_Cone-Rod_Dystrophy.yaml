pathophysiology:
- name: Biallelic PCYT1A Variants Impairing CCTalpha
  biological_scale: MOLECULAR
  description: >-
    The disease variants do not act uniformly. Some reduce steady-state CCTalpha
    abundance in patient fibroblasts; others leave the protein present but
    impair phosphatidylcholine synthesis. In vitro, catalytic-domain missense
    variants aggregate irrecoverably, several destabilise the catalytic fold
    with measurable substrate Km defects, and one autoinhibitory-helix deletion
    paradoxically increases constitutive activity. That heterogeneity is why the
    same gene yields three different diseases.
  genes:
  - preferred_term: PCYT1A
    term:
      id: hgnc:8754
      label: PCYT1A
  evidence:
  - reference: PMID:30559292
    reference_title: >-
      Disease-linked mutations in the phosphatidylcholine regulatory enzyme CCTalpha impair enzymatic activity and stability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Previous analyses showed that for some disease-linked PCYT1A variants steady state levels of CCTα and PC synthesis were reduced in patient fibroblasts, but other variants impaired PC synthesis with little effect on CCT levels.
    explanation: >-
      Establishes that the variant class is functionally heterogeneous rather
      than a single loss-of-abundance mechanism.
  - reference: PMID:30559292
    reference_title: >-
      Disease-linked mutations in the phosphatidylcholine regulatory enzyme CCTalpha impair enzymatic activity and stability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Five variants destabilized the catalytic domain-fold as assessed by lower transition temperatures for unfolding, and three of these manifested defects in substrate Km values.
    explanation: >-
      Biophysical characterisation of the destabilising variant class.
  downstream:
  - target: Impaired CDP-Choline Pathway Flux to Phosphatidylcholine
    description: >-
      CCTalpha catalyses the rate-limiting step of the pathway, so impairing it
      restricts phosphatidylcholine synthesis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24387991
      reference_title: Mutations in PCYT1A cause spondylometaphyseal dysplasia with cone-rod dystrophy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This gene encodes the alpha isoform of the phosphate cytidylyltransferase 1 choline enzyme, which is responsible for converting phosphocholine into cytidine diphosphate-choline, a key intermediate step in the phosphatidylcholine biosynthesis pathway.
      explanation: >-
        Establishes the enzymatic step that the variants restrict.
- name: Impaired CDP-Choline Pathway Flux to Phosphatidylcholine
  biological_scale: CELLULAR
  description: >-
    Reduced synthesis of phosphatidylcholine, the most abundant membrane
    phospholipid. CCTalpha is itself membrane-sensing - it is activated by
    binding phosphatidylcholine-deficient membranes - so the enzyme normally
    sits in a feedback loop that maintains membrane composition, and a defective
    enzyme breaks that homeostatic loop rather than simply lowering output.
  biological_processes:
  - preferred_term: phosphatidylcholine biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006656
      label: phosphatidylcholine biosynthetic process
  evidence:
  - reference: PMID:30559292
    reference_title: >-
      Disease-linked mutations in the phosphatidylcholine regulatory enzyme CCTalpha impair enzymatic activity and stability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      CTP:phosphocholine cytidylyltransferase (CCT) is the key regulatory enzyme in phosphatidylcholine (PC) synthesis and is activated by binding to PC-deficient membranes.
    explanation: >-
      Establishes both the rate-limiting role and the membrane-sensing feedback
      described in this node.
  downstream:
  - target: Growth Plate and Vertebral Dysplasia
    description: >-
      Cartilage is one of the two tissues in which the phosphatidylcholine
      deficit produces disease.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24387991
      reference_title: Mutations in PCYT1A cause spondylometaphyseal dysplasia with cone-rod dystrophy.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thus, the deregulation of the phosphatidylcholine pathway may play a role in multiple genetic diseases in humans, and further studies are necessary to uncover its precise pathogenic mechanisms and the entirety of its phenotypic spectrum.
      explanation: >-
        The discovery paper's own hedged statement that the tissue-specific
        mechanism is not established, which is why this edge is marked
        indirect with unknown intermediates.
  - target: Cone-Rod Photoreceptor Degeneration
    description: >-
      The photoreceptor outer segment turns over its membrane continuously and
      is the other tissue where the deficit is expressed.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30559292
      reference_title: >-
        Disease-linked mutations in the phosphatidylcholine regulatory enzyme CCTalpha impair enzymatic activity and stability.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Mutations in the gene encoding CCTα (PCYT1A) cause three distinct pathologies in humans: lipodystrophy, spondylometaphyseal dysplasia with cone-rod dystrophy (SMD-CRD), and isolated retinal dystrophy.
      explanation: >-
        Establishes that retinal disease is one of the tissue-specific outcomes
        of PCYT1A variants, including in isolation.
- name: Growth Plate and Vertebral Dysplasia
  biological_scale: TISSUE
  description: >-
    Metaphyseal involvement with flattened vertebral bodies, producing severe
    short stature and progressive bowing of the lower limbs.
  evidence:
  - reference: PMID:24387991
    reference_title: Mutations in PCYT1A cause spondylometaphyseal dysplasia with cone-rod dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spondylometaphyseal dysplasia with cone-rod dystrophy is a rare autosomal-recessive disorder characterized by severe short stature, progressive lower-limb bowing, flattened vertebral bodies, metaphyseal involvement, and visual impairment caused by cone-rod dystrophy.
    explanation: >-
      Names the skeletal components of the phenotype.
- name: Cone-Rod Photoreceptor Degeneration
  biological_scale: TISSUE
  description: >-
    A cone-rod dystrophy causing progressive visual impairment. It is the
    feature that names the disorder and the one that separates it from every
    other spondylometaphyseal dysplasia except the PLCB3-related form, which has
    corneal rather than retinal disease.
  evidence:
  - reference: PMID:29122926
    reference_title: >-
      Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cone rod dystrophy is a feature of SMDCRD which is caused by loss-of-function variants in PCYT1A.
    explanation: >-
      Confirms the retinal phenotype and its attribution to PCYT1A, stated from
      outside the discovery group.

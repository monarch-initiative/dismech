notes: >-
  Curated as part of filling ISDS Nosology group 12 (Spondylometaphyseal
  dysplasias), which had no dismech entries. SMD-CRD is NOS 12-0040 in the 2023
  revision. The entry is scoped to the skeletal-plus-retinal phenotype only; the
  allelic congenital lipodystrophy and isolated retinal dystrophy are recorded as
  differentials rather than as subtypes, because neither carries a
  spondylometaphyseal dysplasia and neither is listed in the skeletal nosology. The
  two downstream branches from the metabolic node are both graded
  INDIRECT_UNKNOWN_INTERMEDIATES deliberately: the founding report states the
  pathogenic mechanism is unknown, and the organ dissociation across the allelic
  series means neither branch can be inferred from the other.

      reference_title: Alkhurma hemorrhagic fever in humans, Najran, Saudi Arabia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Univariate analysis indicated that the following were associated with
        Alkhurma virus infection: contact with domestic animals, feeding and
        slaughtering animals, handling raw meat products, drinking unpasteurized
        milk, and being bitten by a tick.
      explanation: >-
        Names the livestock, raw-animal-product and tick exposures associated
        with AHFV infection in the Najran study.
  evidence:
  - reference: PMID:21122217
    reference_title: Alkhurma hemorrhagic fever in humans, Najran, Saudi Arabia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After multivariate modeling, the following associations remained
      significant: animal contact, neighboring farms, and tick bites.
    explanation: >-
      Identifies the livestock and tick-associated exposure routes that remained
      significant after multivariable modeling.
  - reference: PMID:22860139
    reference_title: "Alkhurma viral hemorrhagic fever virus: proposed guidelines for detection, prevention, and control in Saudi Arabia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS

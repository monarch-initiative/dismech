      reproduces.
    evidence:
    - reference: PMID:33974139
      reference_title: Alkhumra hemorrhagic fever virus infection.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Dodd et al. infected C57BL/6J mice with AHFV and reported that the
        syndrome in mice was similar to the disease seen in human cases
      explanation: >-
        Identifies C57BL/6J mice as an AHFV model whose syndrome resembled
        human AHF.
  evidence:
  - reference: PMID:33974139
    reference_title: Alkhumra hemorrhagic fever virus infection.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In another study, Dodd et al. infected C57BL/6J mice with AHFV and

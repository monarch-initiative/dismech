environmental:
- name: Tick and Livestock Exposure
  description: >-
    Tick-infested areas and direct contact with livestock or raw livestock
    products increase AHFV exposure risk through infected ticks and
    epidemiologically linked sheep, goat and camel settings.
  effect: Increases risk of AHFV exposure through infected ticks or epidemiologically linked livestock material.
  notes: >-
    No exposure_term is bound because this combined exposure spans tick bites,
    tick-infested animal areas, livestock handling, slaughterhouse work, raw
    meat and unpasteurized milk rather than one atomic ECTO class.
  influences_mechanisms:
  - target: AHFV Cellular Genome Replication
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Tick bites and livestock-associated contact expose humans to AHFV, placing
      the exposure upstream of viral replication in newly infected cells.
    evidence:

diagnosis:
- name: AHFV RT-PCR
  description: >-
    Conventional or real-time RT-PCR on acute blood detects AHFV RNA and is part
    of the proposed confirmatory case definition.
  diagnosis_term:
    preferred_term: Polymerase Chain Reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:

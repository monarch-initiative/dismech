- name: Leukopenia and Thrombocytopenia
  biological_scale: ORGANISM
  description: >-
    AHF commonly produces leukopenia and thrombocytopenia, reflecting the
    hematologic arm of the acute hemorrhagic-fever syndrome.
  downstream:

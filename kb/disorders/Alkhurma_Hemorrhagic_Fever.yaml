name: Alkhurma Hemorrhagic Fever
creation_date: "2026-11-14T00:00:00Z"
category: Infectious
description: >-
  Alkhurma hemorrhagic fever is a Saudi/Arabian Peninsula tick-borne zoonotic
  viral hemorrhagic fever caused by Alkhumra hemorrhagic fever virus, a
  mammalian tick-borne orthoflavivirus that is a close Arabian subtype of the
  Kyasanur Forest disease virus species Orthoflavivirus kyasanurense. Human
  cases were first recognized among Jeddah butchers and later in Makkah and
  Najran; exposure is associated with infected ticks and with livestock or
  livestock products, especially sheep and camels, although the definitive
  vertebrate reservoir has not been established. Symptomatic disease is an acute
  febrile syndrome with headache, myalgia, vomiting, leukopenia,
  thrombocytopenia, transaminitis, hemorrhagic manifestations and occasional
  encephalitis. Early Jeddah and Makkah hospitalized cohorts had case-fatality
  estimates near 20-25%, whereas larger Najran and later southwestern Saudi
  series captured subclinical and outpatient infections and reported much lower
  mortality.
disease_term:
  preferred_term: Alkhurma hemorrhagic fever
  term:
    id: MONDO:0000310
    label: Alkhurma hemorrhagic fever
parents:
- Viral Hemorrhagic Fever
synonyms:
- Alkhumra hemorrhagic fever
- Alkhumra viral hemorrhagic fever
- AHF
- ALKHF
- ALKV infection
notes: >-
  Published papers variably spell the disease and virus as Alkhurma or
  Alkhumra. This entry keeps the MONDO label and file name, but the preferred
  virologic spelling in more recent literature is Alkhumra. No GeneReviews
  chapter exists for this acquired arboviral infection.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Alkhurma hemorrhagic fever ranges from subclinical infection to severe
    hemorrhagic or neurologic disease. The earliest hospitalized Jeddah and
    Makkah cohorts reported 20-25% mortality, but larger Najran and later Saudi
    outbreaks captured mild and outpatient cases and reported mortality near or
    below 1%.
  evidence:
  - reference: PMID:16038757
    reference_title: "Alkhumra virus infection, a new viral hemorrhagic fever in Saudi Arabia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute febrile flu-like illness with hepatitis (100%), hemorrhagic
      manifestations (55%), and encephalitis (20%) were the main clinical
      features. The case fatality was 25%.
    explanation: >-
      Documents the severe Makkah hospitalized presentation and early high
      case-fatality estimate.
  - reference: PMID:33974139
    reference_title: Alkhumra hemorrhagic fever virus infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The high AHFV-related mortality initially reported for the cohorts in
      Jeddah and Makkah was likely an overestimation of the real mortality due
      to selection bias, as it represented mortality among a small sample of sick
      patients who were all hospitalized.
    explanation: >-
      Explains why later broader series lowered the apparent mortality.
infectious_agent:
- name: Alkhumra hemorrhagic fever virus
  description: >-
    Alkhumra hemorrhagic fever virus is a positive-sense RNA mammalian
    tick-borne orthoflavivirus. Whole-genome and envelope analyses place the
    Arabian AHFV lineage as a close subtype of the same current NCBI/ICTV virus
    species as Indian Kyasanur Forest disease virus, Orthoflavivirus
    kyasanurense.
  infectious_agent_term:
    preferred_term: Alkhumra hemorrhagic fever virus
    term:
      id: NCBITaxon:3048170
      label: Orthoflavivirus kyasanurense
  evidence:
  - reference: PMID:21122217
    reference_title: Alkhurma hemorrhagic fever in humans, Najran, Saudi Arabia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Diagnostic testing identified a flavivirus as the etiologic agent
    explanation: >-
      Identifies the flavivirus later named AHFV as the cause of Alkhurma
      hemorrhagic fever.
  - reference: PMID:11554750
    reference_title: "Complete coding sequence of the Alkhurma virus, a tick-borne flavivirus causing severe hemorrhagic fever in humans in Saudi Arabia."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Independent analyses of the complete polyprotein and the envelope protein
      provided genetic and phylogenetic evidence that ALKV belongs to the
      tick-borne flavivirus group, within which it is most closely related to
      KFDV.
    explanation: >-
      Places AHFV within the tick-borne flaviviruses and closest to KFDV.
agent_life_cycle:
  description: >-
    AHFV has a tick-associated zoonotic ecology in western and southwestern
    Saudi Arabia. The soft tick Ornithodoros savignyi and hard tick Hyalomma
    dromedarii have both been implicated as vectors or reservoirs from which
    AHFV RNA or virus has been detected. Camels and sheep are epidemiologically
    linked livestock exposure hosts, but natural overt infection of a vertebrate
    reservoir has not yet been demonstrated. Humans are incidental hosts.
  hosts:
  - preferred_term: Ornithodoros savignyi
    role: candidate vector and reservoir host
    term:
      id: NCBITaxon:69826
      label: Ornithodoros savignyi
  - preferred_term: Hyalomma dromedarii
    role: candidate vector and reservoir host
    term:
      id: NCBITaxon:34626
      label: Hyalomma dromedarii
  - preferred_term: Dromedary camel
    role: livestock exposure host
    term:
      id: NCBITaxon:9838
      label: Camelus dromedarius
  - preferred_term: Sheep
    role: livestock exposure host
    term:
      id: NCBITaxon:9940
      label: Ovis aries
  - preferred_term: Human
    role: incidental host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  vectors:
  - Ornithodoros savignyi soft tick
  - Hyalomma dromedarii hard tick
  evidence:
  - reference: PMID:22860139
    reference_title: "Alkhurma viral hemorrhagic fever virus: proposed guidelines for detection, prevention, and control in Saudi Arabia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Based on limited data, vectors/reservoirs of AHFV presently include the
      soft tick Ornithodoros savignyi and the hard tick Hyalomma dromedarii
    explanation: >-
      Identifies the two tick species implicated in AHFV maintenance or
      transmission.
  - reference: PMID:22860139
    reference_title: "Alkhurma viral hemorrhagic fever virus: proposed guidelines for detection, prevention, and control in Saudi Arabia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Although AHFV has not been detected in animals, livestock that are often
      extensively ectoparasitized by these ticks have been epidemiologically
      linked with acute AHF in the Makkah and Najran regions
    explanation: >-
      Supports livestock as epidemiologically linked exposure hosts while
      keeping the vertebrate reservoir unresolved.
  - reference: PMID:17370534
    reference_title: Alkhurma hemorrhagic fever virus in Ornithodoros savignyi ticks.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      One Ornithodoros savignyi tick from Saudi Arabia contained AHFV RNA.
    explanation: >-
      Provides direct field detection of AHFV RNA in the soft tick.
transmission:
- name: Tick-bite transmission
  description: >-
    Humans can acquire AHFV from infected ticks; epidemiologic analyses link
    human infection to tick bites, and AHFV RNA has been detected directly in
    Ornithodoros savignyi ticks from camel resting places.
  evidence:
  - reference: PMID:21122217
    reference_title: Alkhurma hemorrhagic fever in humans, Najran, Saudi Arabia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After multivariate modeling, the following associations remained
      significant: animal contact, neighboring farms, and tick bites.
    explanation: >-
      Identifies tick bite as an independently associated exposure in the Najran
      case-control analysis.
  - reference: PMID:17370534
    reference_title: Alkhurma hemorrhagic fever virus in Ornithodoros savignyi ticks.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This is the first direct evidence that AHFV is a tickborne flavivirus and
      confirms the association between human AHFV cases and tickbite history.
    explanation: >-
      Links molecular tick detection to the tick-bite histories in human cases.
- name: Livestock and raw animal-product exposure
  description: >-
    Human infection is associated with close contact with domestic animals and
    with animal handling and slaughtering. Reported univariate exposures include
    feeding and slaughtering animals, handling raw meat, and drinking
    unpasteurized milk; multivariable analysis in Najran retained animal contact
    and neighboring farms.
  evidence:
  - reference: PMID:21122217
    reference_title: Alkhurma hemorrhagic fever in humans, Najran, Saudi Arabia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Univariate analysis indicated that the following were associated with
      Alkhurma virus infection: contact with domestic animals, feeding and
      slaughtering animals, handling raw meat products, drinking unpasteurized
      milk, and being bitten by a tick.
    explanation: >-
      Lists the livestock and raw-animal-product exposures associated with
      Najran infections.
  - reference: PMID:9196762
    reference_title: Isolation of a flavivirus related to the tick-borne encephalitis complex from human cases in Saudi Arabia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight of the 10 confirmed patients were working with sheep, and the
      disease may be a zoonotic viral infection.
    explanation: >-
      Ties the original Jeddah patient series to sheep-associated occupational
      exposure.
prevalence:
- population: Saudi Arabia, 1995-2020 recognized cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: >-
    AHF is a geographically focal Arabian Peninsula zoonosis; the 2022 narrative
    review summarized 604 confirmed Saudi cases from the 1995 discovery through
    2020, with Najran the largest reported focus.
  evidence:
  - reference: PMID:35280532
    reference_title: "Human Alkhumra hemorrhagic Fever: Emergence, history and epidemiological and clinical profiles."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Overall, 604 confirmed cases of AHF have been reported in Saudi Arabia
      since 1995
    explanation: >-
      Quantifies recognized confirmed Saudi AHF cases from discovery through the
      review's cutoff.
progression:
- phase: Acute febrile hemorrhagic illness
  notes: >-
    Symptomatic infection presents as acute fever with constitutional,
    gastrointestinal, hepatic, hematologic, hemorrhagic and sometimes central
    nervous system involvement; in the Najran cohort, 17 of 28 case-control
    study infections were subclinical, showing that recognized cases capture
    only part of the spectrum.
  evidence:
  - reference: PMID:20920527
    reference_title: "Alkhumra (Alkhurma) virus outbreak in Najran, Saudi Arabia: epidemiological, clinical, and laboratory characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical and laboratory features included fever (100%), headache (85.9%),
      malaise (85.9%), arthralgia (83.3%), anorexia (82.1%), myalgia (82.1%)
    explanation: >-
      Documents the dominant acute febrile clinical presentation in laboratory
      confirmed Najran cases.
  - reference: PMID:21122217
    reference_title: Alkhurma hemorrhagic fever in humans, Najran, Saudi Arabia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among ALKHF patients, 11 were hospitalized and 17 had subclinical
      infection.
    explanation: >-
      Documents the subclinical portion of the Najran infections.
pathophysiology:
- name: AHFV Systemic Flaviviral Infection
  biological_scale: ORGANISM
  description: >-
    After tick or livestock-associated exposure, AHFV establishes systemic
    human infection with viremia sufficient for molecular or serologic
    confirmation. The illness produces a febrile viral syndrome with hepatic,
    hematologic, hemorrhagic and neurologic manifestations.
  biological_processes:
  - preferred_term: response to virus
    modifier: INCREASED
    term:
      id: GO:0009615
      label: response to virus
  evidence:
  - reference: PMID:9196762
    reference_title: Isolation of a flavivirus related to the tick-borne encephalitis complex from human cases in Saudi Arabia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A flavivirus related to the tick-borne encephalitis complex was isolated
      from the blood of 6 male butchers
    explanation: >-
      Demonstrates blood-phase flaviviral infection in the original human cases.
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Headache
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Myalgia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Leukopenia and Thrombocytopenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hepatic Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hemorrhagic and Neurologic Manifestations
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Leukopenia and Thrombocytopenia
  biological_scale: ORGANISM
  description: >-
    AHF commonly produces leukopenia and thrombocytopenia, reflecting the
    hematologic arm of the acute hemorrhagic-fever syndrome.
  downstream:
  - target: Decreased total leukocyte count
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Thrombocytopenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

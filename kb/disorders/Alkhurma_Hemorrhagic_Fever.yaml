animal_models:
- name: Newborn Wistar rat intracranial AHFV meningoencephalitis model
  species: Rattus norvegicus
  genotype: Wild type
  background: Wistar
  publication: PMID:33974139
  description: >-
    Newborn Wistar rats inoculated intracranially with AHFV developed high brain
    viral titers, histologic meningoencephalitis and uniformly lethal neurologic
    disease within 3-7 days; neonatal intracranial challenge limits fidelity to
    natural tick- or livestock-acquired human AHF.
  associated_phenotypes:
  - Infectious encephalitis
  modeled_mechanisms:
  - target: Neurologic Manifestations
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The model reproduces lethal AHFV-associated central nervous system
      pathology, but it bypasses peripheral exposure by inoculating neonatal
      rats intracranially.
    evidence:
    - reference: PMID:33974139
      reference_title: Alkhumra hemorrhagic fever virus infection.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        All infected rats died 3–7 days after inoculation with AHFV. Postmortem
        histopathological examination of the brains confirmed meningoencephalitis
      explanation: >-
        Documents lethal AHFV meningoencephalitis in the neonatal Wistar rat
        model.
  evidence:
  - reference: PMID:33974139
    reference_title: Alkhumra hemorrhagic fever virus infection.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The inoculated rats developed neurological manifestations in the form of
      irritability, tremor, opisthotonos, convulsions, and spastic paresis
      ascending from the hind limbs to involve the whole body.
    explanation: >-
      Describes the neurologic phenotype elicited by AHFV in newborn Wistar
      rats.
- name: C57BL/6J mouse AHFV systemic disease model
  species: Mus musculus
  genotype: Wild type
  background: C57BL/6J
  publication: PMID:33974139
  description: >-
    AHFV-infected C57BL/6J mice have been reported to develop a syndrome

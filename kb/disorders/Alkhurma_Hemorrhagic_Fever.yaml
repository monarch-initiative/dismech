    reference_title: "Alkhurma viral hemorrhagic fever virus: proposed guidelines for detection, prevention, and control in Saudi Arabia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "AHFV RNA detected by real-time or conventional RT-PCR"
    explanation: >-
      Lists AHFV RNA detection by RT-PCR as confirmatory testing.
- name: AHFV serology
  description: >-
    Serologic diagnosis can use IgM capture ELISA or a four-fold IgG rise in
    paired sera by ELISA or immunofluorescence assay, with the caveat that
    flavivirus cross-reactivity can confound serology-only interpretation.
  diagnosis_term:
    preferred_term: Diagnostic Serology Testing
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  evidence:
  - reference: PMID:22860139
    reference_title: "Alkhurma viral hemorrhagic fever virus: proposed guidelines for detection, prevention, and control in Saudi Arabia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Four-fold antibody (IgG) rise in paired serum samples using ELISA or IFA
    explanation: >-
      Names paired-serum ELISA or IFA as serologic confirmation methods.
  - reference: PMID:22860139
    reference_title: "Alkhurma viral hemorrhagic fever virus: proposed guidelines for detection, prevention, and control in Saudi Arabia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the first patient was positive for West Nile Virus and dengue virus IgM.
      These initial results were ruled out as false positives by sequencing the
      amplicon product of a RT-PCR run using a genus-specific flavivirus primer.
    explanation: >-
      Documents a cross-reactive flavivirus serology pitfall that motivates
      molecular confirmation or neutralization.

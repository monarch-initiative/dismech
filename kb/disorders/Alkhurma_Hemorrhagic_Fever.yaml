review_notes: >-
  This entry deliberately splits AHF from Kyasanur forest disease even though
  current NCBI taxonomy places AHFV and KFDV in the same virus species:
  Alkhurma/Alkhumra is a Saudi and Arabian Peninsula zoonosis linked to
  Ornithodoros savignyi, Hyalomma dromedarii, camels, sheep and slaughterhouse
  exposures, while KFD is an Indian Western Ghats Haemaphysalis/forest disease
  with monkey sentinels. The AHFV vertebrate reservoir is unresolved; camels and
  sheep are therefore exposure hosts here, not proven reservoirs. The severe
  hemorrhagic node is modeled as conformance to the shared viral-hemorrhagic
  fever permeability module because AHF is clinically a viral hemorrhagic fever,
  but no AHFV-specific endothelial permeability assay comparable to the OHFV NS1
  study has been curated. Mosquito transmission has been hypothesized in the
  literature but is not curated as an established route because field studies
  and the 2012 guideline review describe it as unsubstantiated.

- name: Multidisciplinary supportive care and immunological surveillance
  description: >-
    Supportive skeletal, developmental, metabolic, and immunological management,
    including close surveillance for opportunistic or Epstein-Barr virus-driven
    complications of the severe immunodeficiency; no targeted mTOR- or
    SIK3-directed therapy has been clinically tested.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care

  notes: >-
    Molecularly confirmed in two affected siblings from a single consanguineous
    family (International Skeletal Dysplasia Registry R07-429A and R07-429B),
    with two additional ungenotyped clinically and radiographically similar
    cases noted in the defining report.
  evidence:
  - reference: PMID:30232230
    reference_title: "The PTH/PTHrP-SIK3 pathway affects skeletogenesis through altered mTOR signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified siblings (International Skeletal Dysplasia Registry numbers R07–429A and R07–429B) with radiographic characteristics similar to dominantly inherited JMC but with unique features that did not match any of the currently classified skeletal disorders. The affected siblings came from a consanguineous family, suggesting a recessively inherited disorder due to homozygosity for a mutation, identical by descent."
    explanation: >-
      Documents the single consanguineous family with two affected siblings in
      whom the disorder was molecularly delineated.

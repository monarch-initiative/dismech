pathophysiology:
- name: SIK3 R129C Impairs Kinase Activity
  biological_scale: MOLECULAR
  description: >-
    R129C sits in the SIK3 catalytic domain. The substitution exchanges a large
    positively charged residue for a small neutral one, which the defining
    report suggests alters local conformation near the substrate binding site or
    its positioning relative to the activation loop. Cell-free kinase assays
    against two substrate peptides confirm reduced phosphorylation by the mutant
    enzyme.
  molecular_functions:
  - preferred_term: protein serine/threonine kinase activity
    term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
    modifier: DECREASED
  genetic_context:
    gene:
      preferred_term: SIK3
      term:
        id: hgnc:29165
        label: SIK3
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
  evidence:
  - reference: PMID:30232230
    reference_title: "The PTH/PTHrP-SIK3 pathway affects skeletogenesis through altered mTOR signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The SIK3-mediated phosphorylation of both AMARA and CHKtide was significantly decreased in the presence SIK3R129C compared with WT SIK3"
    explanation: >-
      Cell-free kinase assays against two substrate peptides, establishing the
      loss of catalytic activity directly rather than by inference from the
      variant's position.
  - reference: PMID:30232230
    reference_title: "The PTH/PTHrP-SIK3 pathway affects skeletogenesis through altered mTOR signaling."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: INDIRECT
    snippet: "R129C substitution exchanges a large positively charged amino acid for a small neutral amino acid, possibly altering local conformation in the vicinity of the substrate binding site"
    explanation: >-
      The structural rationale for the loss of activity. Graded COMPUTATIONAL
      because it is a structure-based inference, and INDIRECT because the
      authors hedge it with "possibly"; the measured loss is the kinase-assay
      item above.
  downstream:
  - target: DEPTOR Accumulation and mTOR Downregulation
    description: >-
      SIK3 interacts with DEPTOR and drives its degradation; without kinase
      activity DEPTOR persists.
  - target: Nuclear Retention of HDAC4 and Blocked Chondrocyte Hypertrophy
    description: >-
      SIK3 phosphorylates HDAC4 to anchor it in the cytoplasm; without that
      phosphorylation HDAC4 remains nuclear.
- name: DEPTOR Accumulation and mTOR Downregulation
  biological_scale: MOLECULAR
  description: >-
    DEPTOR is a negative regulator of both mTOR complexes. SIK3 interacts with
    DEPTOR and its activity is required for DEPTOR turnover, so loss of SIK3
    kinase activity leaves DEPTOR elevated and mTORC1 and mTORC2 activity
    reduced, measurable as decreased phosphorylation of S6K1, S6 and AKT in
    patient cells. In control human growth plate, DEPTOR is highest in resting
    and proliferative chondrocytes and falls as cells commit to hypertrophy,
    which is the expression pattern a persistent DEPTOR signal would disturb.
  biological_processes:
  - preferred_term: TOR signaling
    term:
      id: GO:0031929
      label: TOR signaling
    modifier: DECREASED
  evidence:
  - reference: PMID:30232230
    reference_title: "The PTH/PTHrP-SIK3 pathway affects skeletogenesis through altered mTOR signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we observed decreased activity of mTOR complex 1 (mTORC1) and mTORC2 due to accumulation of DEPTOR, a negative regulator of both mTOR complexes"
    explanation: >-
      States the mechanism this node asserts, in the report that defined the
      disease.
  - reference: PMID:30232230
    reference_title: "The PTH/PTHrP-SIK3 pathway affects skeletogenesis through altered mTOR signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we observed a clear decrease in the phosphorylation of S6K1, S6 and AKT in the patient cells compared to control"
    explanation: >-
      The measurement behind the claim, made in the patient's own cells, and
      covering both complexes: S6K1 and S6 for mTORC1, AKT for mTORC2.
  - reference: PMID:30232230
    reference_title: "The PTH/PTHrP-SIK3 pathway affects skeletogenesis through altered mTOR signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Finally, knock-down of SIK3 resulted in increased DEPTOR concentration, phenocopying mutant kinase deficient SIK3."
    explanation: >-
      Knock-down reproduces the DEPTOR elevation, which is the control showing
      the effect follows from loss of SIK3 rather than from some other property
      of the R129C protein.
  downstream:
  - target: Growth Plate Chondrocyte Maturation Failure
    description: >-
      Reduced mTORC1 and mTORC2 activity perturbs chondrocyte proliferation and
      differentiation in the growth plate.
- name: Nuclear Retention of HDAC4 and Blocked Chondrocyte Hypertrophy
  biological_scale: CELLULAR
  description: >-
    SIK3 phosphorylates HDAC4 at its 14-3-3 binding sites, which anchors HDAC4
    in the cytoplasm and so releases MEF2 and RUNX2 to drive the hypertrophic
    programme. Without SIK3 activity HDAC4 stays in the nucleus, where it binds
    and blocks both transcription factors. This arm is established in mouse
    rather than in the patient, and is the second route by which the same lesion
    reaches the growth plate.
  cell_types:
  - preferred_term: hypertrophic chondrocyte
    term:
      id: CL:0000743
      label: hypertrophic chondrocyte
  biological_processes:
  - preferred_term: chondrocyte hypertrophy
    term:
      id: GO:0003415
      label: chondrocyte hypertrophy
    modifier: DECREASED
  evidence:
  - reference: PMID:22318228
    reference_title: "SIK3 is essential for chondrocyte hypertrophy during skeletal development in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Molecular and cellular analyses demonstrated that SIK3 was required for anchoring HDAC4 in the cytoplasm, thereby releasing MEF2C, a crucial facilitator of chondrocyte hypertrophy, from suppression by HDAC4 in nuclei."
    explanation: >-
      Establishes the HDAC4 mechanism this node asserts. The lesion is a mouse
      knockout rather than the human R129C allele; see the attached discussion.
  - reference: PMID:22318228
    reference_title: "SIK3 is essential for chondrocyte hypertrophy during skeletal development in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "HDAC4, a crucial repressor of chondrocyte hypertrophy, remained in the nuclei in SIK3-deficient chondrocytes, but was localized in the cytoplasm in wild-type hypertrophic chondrocytes."
    explanation: >-
      The direct observation of mislocalisation, which is the step the node is
      named for.
  - reference: PMID:33148508
    reference_title: "PTHrP targets salt-inducible kinases, HDAC4 and HDAC5, to repress chondrocyte hypertrophy in the growth plate."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inhibition of Sik3 kinase activity decreases phosphorylation of HDAC4 by Sik3 at binding sites for 14-3-3; lower levels of HDAC4 phosphorylation then allow HDAC4 nuclear translocation."
    explanation: >-
      Names the molecular step — 14-3-3 site phosphorylation — connecting kinase
      activity to HDAC4 localisation, independently of the knockout study.
  downstream:
  - target: Growth Plate Chondrocyte Maturation Failure
    description: >-
      Blocked hypertrophy means chondrocytes accumulate in the proliferative
      zone instead of maturing.
- name: Growth Plate Chondrocyte Maturation Failure
  biological_scale: TISSUE
  description: >-
    Chondrocytes fail to progress from proliferation to hypertrophy, so the
    growth plate expands and endochondral ossification is delayed. In
    SIK3-deficient mice this presents as marked expansion of growth plate and
    articular cartilage, accumulation of chondrocytes in the sternum, ribs and
    spine, and impaired skull bone formation — an axial and appendicular
    distribution matching the spondylo- and epimetaphyseal involvement named in
    the human disease.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: endochondral bone growth
    term:
      id: GO:0003416
      label: endochondral bone growth
    modifier: DECREASED
  evidence:
  - reference: PMID:22318228
    reference_title: "SIK3 is essential for chondrocyte hypertrophy during skeletal development in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Anatomical and histological analyses revealed marked expansion of the growth plate and articular cartilage regions in the limbs, accumulation of chondrocytes in the sternum, ribs and spine, and impaired skull bone formation in SIK3-deficient mice."
    explanation: >-
      Describes the tissue-level consequence and its distribution, which is what
      makes the mouse informative for a spondyloepimetaphyseal phenotype rather
      than a generic short-stature one.
  - reference: PMID:22318228
    reference_title: "SIK3 is essential for chondrocyte hypertrophy during skeletal development in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "SIK3-deficient mice showed dwarfism as they aged, whereas body size was unaffected during embryogenesis."
    explanation: >-
      Records that the growth deficit is postnatal in the mouse, which bears on
      when the human phenotype should be expected to declare itself.
  downstream:
  - target: Disproportionate Short Stature
    description: >-
      Failure of endochondral growth shortens the long bones and the spine.
  - target: Platyspondyly
    description: >-
      Vertebral body growth plates are affected along with the appendicular
      ones, producing flattened vertebral bodies.

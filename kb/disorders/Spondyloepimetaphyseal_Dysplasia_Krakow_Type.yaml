    explanation: >-
      Establishes autosomal recessive inheritance in a consanguineous pedigree,
      which underpins recessive recurrence and carrier counseling.
differential_diagnoses:
- name: Jansen metaphyseal chondrodysplasia
  disease_term:
    preferred_term: metaphyseal chondrodysplasia, Jansen type
    term:
      id: MONDO:0007982
      label: metaphyseal chondrodysplasia, Jansen type
  description: >-
    Caused by constitutive activation of PTH1R, the receptor upstream of SIK3.
    JMC chondrocytes show reduced SIK3 activity and the same DEPTOR elevation,
    so the two diseases converge on one mechanism from opposite directions — an
    activating receptor mutation and an inactivating kinase mutation. JMC is
    dominant, and the clinical discriminator is the PTH level rather than the
    calcium: both entities are reported with hypercalcaemia, but JMC suppresses
    PTH and PTHrP whereas the SEMD Krakow siblings had a normal parathyroid
    hormone concentration.
  distinguishing_features:
  - Autosomal dominant inheritance due to heterozygous activating PTH1R variants rather than autosomal recessive SIK3 loss of function
  - Hypercalcemia with suppressed serum PTH and PTHrP (versus normal PTH in SEMD Krakow type)
  - Absence of the severe unclassified immunodeficiency and neurodevelopmental/MRI abnormalities reported in SIK3 deficiency
  evidence:
  - reference: PMID:30232230
    reference_title: "The PTH/PTHrP-SIK3 pathway affects skeletogenesis through altered mTOR signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In humans, heterozygosity for an activating mutation in PTH1R produces metaphyseal chondrodysplasia Jansen Type (JMC) (7), a disorder characterized by hypercalcemia with suppressed concentration of PTH and PTHrP, short bowed limbs, and a distinctive radiographic pattern"
    explanation: >-
      Defines the genetic etiology and suppressed-PTH hypercalcemic profile of
      Jansen metaphyseal chondrodysplasia that distinguishes it clinically from
      SEMD Krakow type.
  - reference: PMID:30232230
    reference_title: "The PTH/PTHrP-SIK3 pathway affects skeletogenesis through altered mTOR signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "JMC-derived chondrocytes showed reduced SIK3 activity, elevated DEPTOR, and decreased mTORC1 and mTORC2 activity, indicating a common mechanism of disease."
    explanation: >-
      Establishes the downstream pathway convergence explaining the close
      radiographic overlap between JMC and SIK3 deficiency.
- name: Liberfarb syndrome
  disease_term:
    preferred_term: Liberfarb syndrome
    term:
      id: MONDO:0030045
      label: Liberfarb syndrome
  description: >-
    Biallelic variants in PISD, encoding mitochondrial phosphatidylserine
    decarboxylase, cause a single autosomal recessive spectrum curated in
    dismech under Liberfarb_syndrome (MONDO:0030045) that ranges from
    skeletal-predominant spondyloepimetaphyseal dysplasia (disproportionate
    short stature, platyspondyly, prominent epiphyses, and metaphyseal
    dysplasia) to multisystem eye, ear, bone, and brain disease. The skeletal
    presentation overlaps radiographically with SIK3-related SEMD but acts
    through mitochondrial phosphatidylethanolamine synthesis rather than
    PTH/PTHrP-SIK3-mTOR signaling.
  distinguishing_features:
  - Caused by biallelic pathogenic variants in PISD impairing mitochondrial phosphatidylethanolamine synthesis rather than SIK3
  - Often accompanied by early-onset retinal degeneration and sensorineural hearing loss at the severe end of the PISD/Liberfarb spectrum
  evidence:
  - reference: DOI:10.1111/cge.14549
    reference_title: "Novel biallelic <i>PISD</i> missense variants cause spondyloepimetaphyseal dysplasia with disproportionate short stature and fragmented mitochondrial morphology"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic variants in PISD cause a phenotypic spectrum ranging from short stature with spondyloepimetaphyseal dysplasia (SEMD) to a multisystem disorder affecting eyes, ears, bones, and brain."
    explanation: >-
      Establishes the PISD-related SEMD/Liberfarb spectrum (MONDO:0030045) as a
      distinct autosomal recessive spondyloepimetaphyseal dysplasia caused by
      PISD variants.
- name: SPONASTRIME dysplasia
  disease_term:
    preferred_term: spondyloepimetaphyseal dysplasia, sponastrime type
    term:
      id: MONDO:0010068
      label: spondyloepimetaphyseal dysplasia, sponastrime type
  description: >-
    Biallelic hypomorphic TONSL variants produce an autosomal recessive
    spondyloepimetaphyseal dysplasia within the same radiographic differential,
    characterized by spondylar anomalies, midface hypoplasia with a depressed
    nasal bridge, metaphyseal striations, and disproportionate short stature
    driven by replication-fork stalling and impaired homologous-recombination
    DNA repair.
  distinguishing_features:
  - Caused by biallelic hypomorphic variants in TONSL impairing DNA replication and RAD51-mediated homologous-recombination repair rather than SIK3 signaling
  - Characteristic metaphyseal striations and midface hypoplasia with a depressed nasal bridge rather than moth-eaten metaphyses and tibial transverse gaps
  evidence:
  - reference: PMID:30773278
    reference_title: "Hypomorphic Mutations in TONSL Cause SPONASTRIME Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole-exome sequencing (WES), we identified bi-allelic TONSL mutations in 10 of 13 individuals with SPONASTRIME dysplasia."
    explanation: >-
      Establishes biallelic TONSL variants as the molecular basis of
      SPONASTRIME dysplasia within the recessive SEMD differential.
  - reference: PMID:30773277
    reference_title: "Bi-allelic Variants in TONSL Cause SPONASTRIME Dysplasia and a Spectrum of Skeletal Dysplasia Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SPONASTRIME dysplasia is an autosomal-recessive spondyloepimetaphyseal dysplasia characterized by spine (spondylar) abnormalities, midface hypoplasia with a depressed nasal bridge, metaphyseal striations, and disproportionate short stature."
    explanation: >-
      Documents the defining clinical and radiographic features of SPONASTRIME
      dysplasia (spine abnormalities, midface hypoplasia with depressed nasal
      bridge, metaphyseal striations, and disproportionate short stature).
  - reference: PMID:30773277
    reference_title: "Bi-allelic Variants in TONSL Cause SPONASTRIME Dysplasia and a Spectrum of Skeletal Dysplasia Phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "functional studies revealed increased amounts of spontaneous replication fork stalling and chromosomal aberrations, as well as fewer camptothecin (CPT)-induced RAD51 foci in subject-derived cell lines"
    explanation: >-
      Demonstrates replication-fork stalling and defective RAD51-dependent
      homologous-recombination repair in TONSL-deficient patient cells.
discussions:
- discussion_id: semdk_human_arm_is_one_patient
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#SIK3
  prompt: >-
    Is SEMD Krakow type a single-family entity, and does R129C represent the
    allelic spectrum?
  rationale: >-
    The sources consulted describe one consanguineous family with two affected
    homozygous R129C siblings. Every claim in this entry that is specifically
    human — the kinase deficit, the DEPTOR elevation, the mTOR readouts — comes
    from those individuals' cells or from constructs carrying that allele, so
    the molecular arm rests on a single genotype however many patients carry
    it. The report itself narrows the gap without closing it: a literature case
    and an International Skeletal Dysplasia Registry case share the radiographic
    and clinical picture, but neither is molecularly confirmed, so neither
    extends the allelic spectrum. MONDO records no causal gene for the term,
    which is consistent with a thinly-evidenced gene-disease link rather than
    with an absent one. A second molecularly confirmed family, or a ClinGen
    gene-disease validity assertion, would settle both questions.
- discussion_id: semdk_hdac4_arm_is_mouse_knockout
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Nuclear Retention of HDAC4 and Blocked Chondrocyte Hypertrophy
  - pathophysiology#Growth Plate Chondrocyte Maturation Failure
  prompt: >-
    Does the HDAC4 arm of SIK3 function operate in the human R129C disease, or
    only in SIK3-null mouse?
  rationale: >-
    The HDAC4 nuclear-retention mechanism and the growth-plate tissue phenotype
    are both established in SIK3-deficient mice, which carry a null allele, not
    the human missense one. The defining human report characterises the
    DEPTOR/mTOR arm in patient cells and does not report HDAC4 localisation in
    them. The premise that R129C is a purely catalytic lesion does not hold: gene
    expression is unaffected, but SIK3 protein falls by more than 60% in cells
    from both siblings, so the allele is destabilising as well as
    kinase-impairing and sits closer to a null than a missense allele usually
    would. That makes the mouse comparison more apt than it first appears, and
    the question correspondingly sharper — whether a >60% protein reduction
    reaches the threshold at which the HDAC4 arm fails, given that the null
    does. HDAC4 localisation in patient cells would be the
    direct test.
  proposed_experiments:
  - experiment_id: semdk_hdac4_localisation_in_patient_cells
    name: HDAC4 localisation in R129C patient cells
    description: >-
      Compare HDAC4 subcellular localisation and 14-3-3-site phosphorylation in
      R129C patient fibroblasts or iPSC-derived chondrocytes against isogenic
      corrected controls, alongside the DEPTOR and mTOR readouts already
      established in those cells.
    would_support:
    - pathophysiology#Nuclear Retention of HDAC4 and Blocked Chondrocyte Hypertrophy
    supporting_outcome:
    - >-
      HDAC4 is retained in the nucleus in patient cells with reduced
      14-3-3-site phosphorylation, which would carry the mouse mechanism across
      to the human allele and make this a two-arm disease rather than a one-arm
      one with a mouse annotation.
    would_refute:
    - pathophysiology#Nuclear Retention of HDAC4 and Blocked Chondrocyte Hypertrophy
    refuting_outcome:
    - >-
      HDAC4 localisation is normal in patient cells despite the DEPTOR and mTOR
      changes, which would make the disease a selective mTOR-arm defect and
      would explain any phenotypic difference from the SIK3-null mouse.
- discussion_id: semdk_jmc_convergence
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#DEPTOR Accumulation and mTOR Downregulation
  prompt: >-
    If JMC and SEMD Krakow type converge on DEPTOR accumulation and reduced mTOR
    signalling, why do they not present alike?
  rationale: >-
    The defining report shows JMC patient cells carry the same DEPTOR elevation
    and reduced mTOR activity as the SIK3 mutant, and describes this as a common
    mechanism of disease. Yet JMC is dominant, suppresses PTH and PTHrP, and has
    its own radiographic pattern, while SEMD Krakow type is recessive and is
    reported with mild hypercalcaemia at a normal PTH. The calcium phenotype is
    therefore shared and the PTH response is what separates them, which is a
    sharper contrast than absence-versus-presence and sits closer to the
    receptor-level difference.
    Either the shared node is downstream of what distinguishes them — PTH1R
    signalling has effects outside the growth plate that SIK3 loss does not
    reproduce — or the convergence is narrower than the shared readouts suggest.
notes: >-
  No GeneReviews or StatPearls chapter covers spondyloepimetaphyseal dysplasia
  Krakow type. No ClinGen gene-disease validity assertion for SIK3 is present
  in the committed ClinGen export.

  Gene and nosology clarity: MONDO:0032571 (OMIM:618162) is caused by biallelic
  pathogenic variants in SIK3 (hgnc:29165), established via the MedGen/OMIM
  618162 concept and the defining report by Csukasi et al. 2018 (PMID:30232230)
  and placed in group 28 ("Skeletal disorders of parathyroid hormone signaling
  cascade") of the 2023 ISDS Nosology (PMID:36779427). It is distinct from the
  PISD-related spondyloepimetaphyseal dysplasia / Liberfarb syndrome spectrum
  (MONDO:0030045), which is curated in dismech under Liberfarb_syndrome and
  included here under differential_diagnoses. The eponym "Krakow type" honors
  senior author Deborah Krakow (PMID:30232230), not the city in Poland.

  Evidence scope: All molecularly confirmed human data derive from one
  consanguineous family with two homozygous p.Arg129Cys siblings (PMID:30232230).
  The cell-free kinase assay, DEPTOR accumulation, and reduced mTORC1/mTORC2
  phosphorylation were measured in those siblings' fibroblasts or R129C
  constructs, whereas the HDAC4 nuclear-retention arm and histological
  growth-plate expansion derive from Sik3-null mice (PMID:22318228,
  PMID:33148508; graded MODEL_ORGANISM with an attached HUMAN_MODEL_MISMATCH
  discussion).
  Disproportionate Short Stature cites the Sik3-null mouse because individual
  sibling anthropometric measurements were not printed in the main text of
  PMID:30232230 (Table S1 only). Epiphyseal Abnormality carries its HPO binding
  without a snippet because the only epiphyseal description in the main text of
  PMID:30232230 refers to an ungenotyped literature comparison case rather than
  the two SIK3-confirmed siblings.

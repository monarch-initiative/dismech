genetic:
- name: SIK3
  gene_term:
    preferred_term: SIK3
    term:
      id: hgnc:29165
      label: SIK3
  relationship_type: CAUSATIVE
  notes: >-
    Homozygous c.385C>T p.(Arg129Cys) in the catalytic domain. This is the only
    SIK3 allele reported for the entity in the sources consulted. MONDO records
    no causal gene for MONDO:0032571, so the gene-disease link here was
    established from the MedGen concept for OMIM 618162, which links to NCBI
    Gene 23387 (SIK3), and confirmed against the defining report.
  evidence:
  - reference: PMID:30232230
    reference_title: "The PTH/PTHrP-SIK3 pathway affects skeletogenesis through altered mTOR signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While investigating a new skeletal dysplasia caused by a homozygous mutation in the catalytic domain of SIK3"
    explanation: >-
      Establishes SIK3 as causative and locates the variant in the catalytic
      domain.
differential_diagnoses:
- name: Jansen metaphyseal chondrodysplasia
  description: >-
    Caused by constitutive activation of PTH1R, the receptor upstream of SIK3.
    JMC chondrocytes show reduced SIK3 activity and the same DEPTOR elevation,
    so the two diseases converge on one mechanism from opposite directions — an
    activating receptor mutation and an inactivating kinase mutation. JMC is
    dominant and is distinguished clinically by hypercalcaemia with suppressed
    PTH and PTHrP.
- name: PISD-related spondyloepimetaphyseal dysplasia
  description: >-
    A separate SEMD caused by biallelic variants in PISD, the mitochondrial
    phosphatidylserine decarboxylase, presenting with platyspondyly, large
    epiphyses and metaphyseal dysplasia. Radiographically overlapping and
    mechanistically unrelated — mitochondrial phospholipid synthesis rather than
    PTH/PTHrP-SIK3-mTOR signalling. PISD variants also cause Liberfarb syndrome,
    which dismech curates separately.
- name: SPONASTRIME dysplasia
  description: >-
    Biallelic TONSL variants produce a spondylo-epi-metaphyseal phenotype within
    the same radiographic differential.
discussions:
- discussion_id: semdk_human_arm_is_one_patient
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#SIK3
  prompt: >-
    Is SEMD Krakow type a single-family entity, and does R129C represent the
    allelic spectrum?
  rationale: >-
    The sources consulted describe one homozygous R129C proband. Every claim in
    this entry that is specifically human — the kinase deficit, the DEPTOR
    elevation, the mTOR readouts — comes from that individual's cells or from
    constructs carrying that allele. MONDO records no causal gene for the term,
    which is consistent with a thinly-evidenced gene-disease link rather than
    with an absent one. Further families, or a ClinGen gene-disease validity
    assertion, would settle both the allelic spectrum and the strength of the
    association.
- discussion_id: semdk_hdac4_arm_is_mouse_knockout
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Nuclear Retention of HDAC4 and Blocked Chondrocyte Hypertrophy
  - pathophysiology#Growth Plate Chondrocyte Maturation Failure
  prompt: >-
    Does the HDAC4 arm of SIK3 function operate in the human R129C disease, or
    only in SIK3-null mouse?
  rationale: >-
    The HDAC4 nuclear-retention mechanism and the growth-plate tissue phenotype
    are both established in SIK3-deficient mice, which carry a null allele, not
    the human missense one. The defining human report characterises the
    DEPTOR/mTOR arm in patient cells and does not report HDAC4 localisation in
    them. Since R129C leaves the protein expressed and reduces catalytic
    activity rather than abolishing the gene, the two arms could be
    differentially affected. HDAC4 localisation in patient cells would be the
    direct test.
  proposed_experiments:
  - experiment_id: semdk_hdac4_localisation_in_patient_cells
    name: HDAC4 localisation in R129C patient cells
    description: >-
      Compare HDAC4 subcellular localisation and 14-3-3-site phosphorylation in
      R129C patient fibroblasts or iPSC-derived chondrocytes against isogenic
      corrected controls, alongside the DEPTOR and mTOR readouts already
      established in those cells.
    would_support:
    - pathophysiology#Nuclear Retention of HDAC4 and Blocked Chondrocyte Hypertrophy
    supporting_outcome:
    - >-
      HDAC4 is retained in the nucleus in patient cells with reduced
      14-3-3-site phosphorylation, which would carry the mouse mechanism across
      to the human allele and make this a two-arm disease rather than a one-arm
      one with a mouse annotation.
    would_refute:
    - pathophysiology#Nuclear Retention of HDAC4 and Blocked Chondrocyte Hypertrophy
    refuting_outcome:
    - >-
      HDAC4 localisation is normal in patient cells despite the DEPTOR and mTOR
      changes, which would make the disease a selective mTOR-arm defect and
      would explain any phenotypic difference from the SIK3-null mouse.
- discussion_id: semdk_jmc_convergence
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#DEPTOR Accumulation and mTOR Downregulation
  prompt: >-
    If JMC and SEMD Krakow type converge on DEPTOR accumulation and reduced mTOR
    signalling, why do they not present alike?
  rationale: >-
    The defining report shows JMC patient cells carry the same DEPTOR elevation
    and reduced mTOR activity as the SIK3 mutant, and describes this as a common
    mechanism of disease. Yet JMC is dominant, features hypercalcaemia with
    suppressed PTH and PTHrP, and has its own radiographic pattern, while SEMD
    Krakow type is recessive and is not reported with a calcium phenotype.
    Either the shared node is downstream of what distinguishes them — PTH1R
    signalling has effects outside the growth plate that SIK3 loss does not
    reproduce — or the convergence is narrower than the shared readouts suggest.
notes: >-
  The causal gene is SIK3, not PISD. The claim issue for this curation (#11868)
  named PISD, which was wrong: PISD causes a radiographically similar but
  mechanistically unrelated SEMD, and also Liberfarb syndrome, which dismech
  curates separately. MONDO:0032571 records no causal gene at all, so
  `just preflight-dr` returns SKIP rather than resolving it; the assignment here
  was made from the MedGen concept for OMIM 618162, which links to NCBI Gene
  23387 (SIK3), and confirmed against the defining report. Both PISD SEMD papers
  are carried in the differential rather than cited as this disease.

  The eponym is an author surname, not a place. Deborah Krakow is an author on
  the defining report. Worth recording because "Krakow type" reads like a
  geographic eponym and invites a wrong inference about where the reported
  family came from.

  The human evidence in this entry is one homozygous R129C proband. The kinase
  assay, the DEPTOR elevation and the mTOR readouts are all from that
  individual's cells or from constructs carrying that allele. The HDAC4 arm and
  the growth-plate tissue phenotype are from SIK3-null mice, graded
  MODEL_ORGANISM, and carry a HUMAN_MODEL_MISMATCH discussion because a null
  allele is not the human missense one.

  Three phenotypes — platyspondyly, metaphyseal dysplasia and epiphyseal
  abnormality — carry no evidence item. They are the three components the
  disease name asserts, and the sources consulted contain no quotable sentence
  describing them in the reported patient: the defining report is a mechanism
  paper whose abstract does not itemise the skeletal findings. Quoting a PISD
  paper's platyspondyly sentence would attach a different disease's phenotype
  description to this entry, so they are curated with the ontology binding and
  no evidence instead. A curator with the full clinical description should add
  it.

  `evidence_source: MODEL_ORGANISM` on Disproportionate Short Stature is
  deliberate and slightly uncomfortable: the stature claim is supported here by
  the mouse, because the sources consulted state the human stature phenotype
  only through the disease name. Grading it HUMAN_CLINICAL would assert a
  patient measurement that is not quoted anywhere in this entry.

  `directness: INDIRECT` on the structural rationale for R129C records that the
  authors hedge it themselves ("possibly altering local conformation"). The
  measured loss of activity is the cell-free kinase assay, curated without that
  marker on the same node.

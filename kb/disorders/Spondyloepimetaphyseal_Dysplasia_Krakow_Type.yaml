name: Spondyloepimetaphyseal Dysplasia Krakow Type
creation_date: "2026-09-15T13:18:10Z"
category: Mendelian
description: >-
  Spondyloepimetaphyseal dysplasia Krakow type is a skeletal dysplasia caused by
  a homozygous mutation in the catalytic domain of SIK3, the salt-inducible
  kinase that sits between PTH/PTHrP signalling and the growth plate. The
  reported substitution, R129C, impairs SIK3 serine/threonine kinase activity;
  DEPTOR, a negative regulator of both mTOR complexes, is then no longer
  degraded and accumulates, and mTORC1 and mTORC2 activity fall.

  Two SIK3-dependent routes converge on the same growth-plate failure. SIK3
  normally phosphorylates HDAC4 to hold it in the cytoplasm, which frees MEF2
  and RUNX2 to drive chondrocyte hypertrophy; loss of SIK3 activity leaves HDAC4
  nuclear and blocks hypertrophy. Independently, loss of mTOR signalling through
  DEPTOR accumulation perturbs chondrocyte proliferation and differentiation.
  The result is a growth plate whose chondrocytes fail to progress to
  hypertrophy, and a spondyloepimetaphyseal phenotype.

  The disease sits in an instructive relationship with Jansen metaphyseal
  chondrodysplasia. JMC is caused by constitutive activation of PTH1R, the
  receptor upstream of SIK3, and JMC chondrocytes show reduced SIK3 activity
  with the same DEPTOR elevation — so an activating receptor mutation and an
  inactivating kinase mutation converge on one mechanism from opposite
  directions.

  The eponym is the surname of an author on the defining report, not the city.

biochemical:
- name: Urinary Glc3Man tetrasaccharide
  notes: >-
    Glc-alpha1-3-Glc-alpha1-3-Glc-alpha1-2-Man in urine, the free tetrasaccharide
    released by the endo-alpha-1,2-mannosidase bypass. It is the diagnostic
    analyte for this disease and the one test that has been abnormal in every
    affected proband examined.
  reference_ranges:
  - lower_bound: 0.0
    upper_bound: 5.0
    unit: umol/mmol{creatinine}
    population: reference population, method as published
    notes: >-
      No LOINC code is bound. Urinary Glc3Man is a specialist research assay
      with no LOINC counterpart, and no code is asserted rather than binding an
      approximate one. The interval is the reference stated by the group that
      developed and validated the quantitative method; patient values in that
      series ran from 34.1 to 618.0, so the separation from the reference is
      roughly an order of magnitude at the low end.
    evidence:
    - reference: PMID:36651519
      reference_title: "MOGS-CDG: Quantitative analysis of the diagnostic Glc(3) Man tetrasaccharide and clinical spectrum of six new cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Glc3 Man was increased in all six analyzed cases, ranging from 34.1 to 618.0 μmol/mmol creatinine (reference <5 μmol).
      explanation: >-
        The reference interval and the observed patient range in one sentence,
        from the paper that validated the quantitative method.
  evidence:
  - reference: PMID:35790351
    reference_title: "Clinical, biochemical and genetic characteristics of MOGS-CDG: a rare congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urine oligosaccharide analysis was consistently abnormal for all affected probands, whereas other biochemical analyses such as serum transferrin analysis was not consistently abnormal.
    explanation: >-
      Establishes this analyte as the consistently abnormal one, against the
      inconsistency of the standard CDG screen.
- name: Serum immunoglobulins, complement and creatine kinase
  notes: >-
    A secondary laboratory panel reported in the more completely characterised
    patients: low immunoglobulins, complement C3 and C4 deficiency, raised
    creatine kinase and C-reactive protein, dyslipidemia, coagulopathy, and
    reduced T-lymphocyte and natural-killer proportions with raised interleukin
    6. These are recorded as an observed panel from two patients rather than as
    established features of the disease.
  evidence:
  - reference: PMID:36158009
    reference_title: "Updated clinical and glycomic features of mannosyl-oligosaccharide glucosidase deficiency: Two case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Novel laboratory findings included peripheral leukocytosis with neutrophil predominance, elevated C-reactive protein and creatine kinase, dyslipidemia, coagulopathy, complement 3 and complement 4 deficiencies, decreased proportions of T lymphocytes and natural killer cells, and increased serum interleukin 6.
    explanation: >-
      The panel as reported. Described by its own authors as novel findings in
      two patients, which is why this entry does not assign a frequency to any
      of them.
genetic:
- name: MOGS
  association: Causal biallelic variant
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: MOGS
    term:
      id: hgnc:24862
      label: MOGS
  notes: >-
    Encodes mannosyl-oligosaccharide glucosidase, also called ER alpha-glucosidase
    I or glucosidase 1. Four exons, with exon 4 encoding the 64 kDa catalytic
    domain.

    No genotype-phenotype correlation has been established. The largest series
    states directly that severity varied by organ system with no definite
    genotype correlation, and the reported range is wide - from death at 74 days
    to children in their second decade. Prognostic counselling from the genotype
    is therefore not currently supportable.

    Variants of uncertain significance are the practical difficulty. Exome
    sequencing turns them up faster than functional validation can resolve them,
    which is precisely why the urinary tetrasaccharide assay matters: it is the
    orthogonal test that can confirm or exclude a candidate MOGS genotype.
  evidence:
  - reference: PMID:35790351
    reference_title: "Clinical, biochemical and genetic characteristics of MOGS-CDG: a rare congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The severity in each organ system was variable, without definite genotype correlation.
    explanation: >-
      The absence of a genotype-phenotype correlation, stated by the series best
      placed to find one.
  - reference: PMID:35790351
    reference_title: "Clinical, biochemical and genetic characteristics of MOGS-CDG: a rare congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular analysis, combined with biochemical testing, is important for diagnosis.
    explanation: >-
      The recommendation that molecular findings be paired with the biochemical
      assay rather than used alone.
  - reference: PMID:30587846
    reference_title: Compound heterozygous variants in MOGS inducing congenital disorders of glycosylation (CDG) IIb.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compound heterozygous variants of NM_006302:c.1239_1267dup,p.Asp414Leufs*17, c.544 G > A,p.Gly182Arg, and c.1698C > A,p.Asp566Glu in MOGS were identified.
    explanation: >-
      A worked compound heterozygous genotype including a frameshift allele,
      extending the spectrum beyond the original two missense variants.
treatments:
- name: Supportive and multidisciplinary care
  description: >-
    No disease-modifying treatment exists. Management is anticonvulsant control
    of the epilepsy, respiratory and feeding support, hepatic monitoring, and
    developmental therapies. Immunoglobulin replacement is a question rather than
    a recommendation here: the hypogammaglobulinemia is real but the infection
    burden is not what it predicts, so the usual indication for replacement does
    not straightforwardly apply.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Aberrant Neuronal Glycoprotein Function
    description: >-
      Supportive management is directed at the outputs of the neurological
      branch. It does not act on the glycan lesion, which is why the entry
      records no disease-modifying treatment.
  target_phenotypes:
  - preferred_term: Early infantile epileptic encephalopathy
    term:
      id: HP:0200134
      label: Epileptic encephalopathy
  notes: >-
    No evidence item is attached. The previous citation here was a methods
    sentence describing what the two studied siblings were assessed for, which
    does not support a management recommendation; it was removed rather than
    kept with an explanation conceding it did not support the claim. No cited
    source in this entry makes a management recommendation for MOGS-CDG, and an
    absent evidence item states that more honestly than a weak one.
- name: Anticonvulsant therapy
  description: >-
    Seizures are present in essentially every reported patient and are
    frequently drug-resistant, so anticonvulsant treatment is the intervention
    these children actually receive. No agent or regimen has been shown superior
    in this disease, and no source recommends one; in the longest-followed
    patient, epileptic spasms remitted by age seven while tonic seizures
    persisted to nineteen. The entry records the modality without naming a
    drug, because the literature does not.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Anticonvulsant Therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
  target_mechanisms:
  - target: Aberrant Neuronal Glycoprotein Function
    description: >-
      Symptomatic control of the seizure output of this node. It does not act on
      the node itself.
  target_phenotypes:
  - preferred_term: Early infantile epileptic encephalopathy
    term:
      id: HP:0200134
      label: Epileptic encephalopathy
  evidence:
  - reference: PMID:33058492
    reference_title: "Epilepsy and movement disorders in CDG: Report on the oldest-known MOGS-CDG patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epileptic spasms appeared in first months and ceased by the age of 7 years, while tonic seizures were still present at last assessment (19 years).
    explanation: >-
      The long-term seizure course under treatment. Cited to establish what
      anticonvulsant therapy achieves and does not achieve here, rather than as
      evidence that any particular agent works.
  - reference: PMID:33058492
    reference_title: "Epilepsy and movement disorders in CDG: Report on the oldest-known MOGS-CDG patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At birth she presented facial dysmorphism, marked hypotonia, and drug-resistant tonic seizures.
    explanation: >-
      Records the drug resistance, which is the reason this treatment is listed
      with no expectation of control rather than as effective management.
diagnosis:
- name: Urinary oligosaccharide analysis for Glc3Man
  description: >-
    The test that works, and it is not the one a CDG workup reaches for first.
    Serum transferrin isoelectric focusing is typically normal in MOGS-CDG, so
    the disease escapes the standard screen; urinary Glc3Man by mass spectrometry
    has been abnormal in every affected proband tested and is now quantifiable
    against a reference interval. Suspect the diagnosis on the clinical pattern -
    dysmorphism with hypotonia, seizures and developmental delay - and go
    straight to urine oligosaccharides rather than concluding from a normal
    transferrin that this is not a CDG.
  evidence:
  - reference: PMID:35790351
    reference_title: "Clinical, biochemical and genetic characteristics of MOGS-CDG: a rare congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In MOGS-CDG, urine oligosaccharide analysis via matrix-assisted laser desorption/ionisation time-of-flight mass spectrometry can be used as a reliable biochemical test for screening and confirmation of disease.
    explanation: >-
      Names the test and the role it plays, for both screening and confirmation.
  - reference: PMID:36651519
    reference_title: "MOGS-CDG: Quantitative analysis of the diagnostic Glc(3) Man tetrasaccharide and clinical spectrum of six new cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most CDG with abnormal N-glycosylation can be detected by transferrin screening, however, MOGS-CDG escapes this routine screening.
    explanation: >-
      States the screening failure that makes the urinary assay necessary rather
      than merely confirmatory.
  - reference: PMID:33261925
    reference_title: "Congenital disorders of glycosylation type IIb with MOGS mutations cause early infantile epileptic encephalopathy, dysmorphic features, and hepatic dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the isoelectric focusing of transferrin (IEF-T) of serum in this patient was normal, urinary excretion of Hex4 corresponding to Glc3Man was observed by mass spectrometry.
    explanation: >-
      A worked case of exactly the discordance the diagnostic advice turns on:
      normal transferrin, positive urinary tetrasaccharide.
differential_diagnoses:
- name: Other congenital disorders of glycosylation detectable by transferrin screening
  description: >-
    Most N-glycosylation CDG give an abnormal carbohydrate-deficient transferrin
    pattern. A normal transferrin result excludes many of them and does not
    exclude MOGS-CDG, which is the practical distinction.
  distinguishing_features:
  - Serum transferrin isoelectric focusing is typically normal in MOGS-CDG and abnormal in most N-glycosylation CDG.
  - Urinary Glc3Man tetrasaccharide is specific to the glucosidase I block.
  evidence:
  - reference: PMID:36651519
    reference_title: "MOGS-CDG: Quantitative analysis of the diagnostic Glc(3) Man tetrasaccharide and clinical spectrum of six new cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most CDG with abnormal N-glycosylation can be detected by transferrin screening, however, MOGS-CDG escapes this routine screening.
    explanation: >-
      The screening asymmetry that separates MOGS-CDG from the rest of the
      group.
- name: Pompe disease
  disease_term:
    preferred_term: Pompe disease
    term:
      id: MONDO:0009290
      label: glycogen storage disease II
  description: >-
    Named here for one specific reason: Pompe urine also carries a
    glucose-tetrasaccharide, so a urinary oligosaccharide screen can put the two
    on the same result. The MOGS-CDG species is Glc3Man and is separated by
    retention-time matching.
  distinguishing_features:
  - The MOGS-CDG urinary tetrasaccharide is Glc3Man and is identified by retention time against authentic MOGS-CDG urine.
  - Pompe disease has acid alpha-glucosidase deficiency and a myopathic or cardiac presentation rather than the dysmorphic-neurological pattern of MOGS-CDG.
  evidence:
  - reference: PMID:36651519
    reference_title: "MOGS-CDG: Quantitative analysis of the diagnostic Glc(3) Man tetrasaccharide and clinical spectrum of six new cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, Glc3 Man was specifically identified by retention time matching against authentic MOGS-CDG urine and compared with Pompe urine.
    explanation: >-
      The analytical step the assay developers took specifically to separate
      these two, which is why the differential is listed.
- name: UGGT1-congenital disorder of glycosylation
  disease_term:
    preferred_term: UGGT1-congenital disorder of glycosylation
    term:
      id: MONDO:0980705
      label: congenital disorder of glycosylation, type IIcc
  description: >-
    The nearest neighbour in the pathway. UGGT1 re-glucosylates misfolded
    glycoproteins to return them to the calnexin/calreticulin cycle, so
    UGGT1-CDG and MOGS-CDG break the same ER glycoprotein quality-control loop
    from opposite directions: MOGS removes the first glucose, UGGT1 puts one
    back. The clinical overlap is broad - developmental delay, seizures,
    dysmorphism, hepatic and respiratory involvement - and a normal transferrin
    pattern does not separate them.

    The separator is the urinary tetrasaccharide. Glc3Man accumulates only when
    the glucosidase I block leaves the triglucosylated glycan intact, so it is
    specific to MOGS-CDG and is not produced by a UGGT1 lesion.
  distinguishing_features:
  - Urinary Glc3Man tetrasaccharide is specific to the glucosidase I block and is the positive test for MOGS-CDG. It is the discriminator that does the work.
  - Scoliosis and polycystic kidneys mark the severe end of UGGT1-CDG and are not features of MOGS-CDG.
  - Microcephaly does NOT discriminate. It is near-universal in both, present in 10 of 11 reported MOGS-CDG patients with no negative column.
  - Cardiac involvement does NOT discriminate. It occurs in roughly six of the eleven reported MOGS-CDG patients as ASD, PFO, left ventricular hypertrophy, dilated cardiomyopathy or heart failure.
  - Biallelic pathogenic MOGS variants favour MOGS-CDG; biallelic pathogenic UGGT1 variants favour UGGT1-CDG.
  evidence:
  - reference: PMID:40267907
    reference_title: Bi-allelic UGGT1 variants cause a congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cardinal clinical features of UGGT1-CDG involve developmental delay, intellectual disability, seizures, characteristic facial features, and microcephaly in the majority (9/11 affected individuals for whom measurements were available).
    explanation: >-
      The cardinal features of UGGT1-CDG. Every one of them, microcephaly
      included, also occurs in MOGS-CDG, so this quote establishes the overlap
      and discriminates nothing. It is retained for that reason.
  - reference: PMID:40267907
    reference_title: Bi-allelic UGGT1 variants cause a congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The more severely affected individuals display congenital heart malformations, variable skeletal abnormalities including scoliosis, and hepatic and renal involvement, including polycystic kidneys mimicking autosomal recessive polycystic kidney disease.
    explanation: >-
      The severe-end features of UGGT1-CDG. Only scoliosis and the polycystic
      kidneys separate: cardiac malformation and hepatic involvement occur in
      MOGS-CDG too, so this quote is read for its skeletal and renal half only.
  - reference: PMID:40267907
    reference_title: Bi-allelic UGGT1 variants cause a congenital disorder of glycosylation.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      UGGT1 encodes UDP-glucose:glycoprotein glucosyltransferase 1, an enzyme critical for maintaining quality control of N-linked glycosylation.
    explanation: >-
      Places UGGT1 in the same quality-control loop MOGS acts on, which is why
      this differential is a pathway neighbour rather than a coincidental
      clinical mimic. Graded INDIRECT because it states the enzyme's role
      without comparing the two disorders.
  - reference: PMID:36158009
    reference_title: "Updated clinical and glycomic features of mannosyl-oligosaccharide glucosidase deficiency: Two case reports."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical, genetic, and glycomic features of all reported patients with mannosyl-oligosaccharide glucosidase deficiency...| Microcephaly | + | + | + | + | + | ND | + | + | + | + | + |
    explanation: >-
      Graded REFUTE against the idea that microcephaly separates these two
      disorders. Ten of the eleven reported MOGS-CDG patients have it and none is
      negative, so it is near-universal on both sides of this differential. This
      item exists because an earlier version of this entry asserted the opposite.
experimental_models:
- name: Patient skin fibroblast culture
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: patient and parental skin biopsy
  publication: PMID:12145188
  description: >-
    Cultured fibroblasts from patients and their heterozygous parents are the
    functional standard for this disease. They are where residual glucosidase I
    activity was quantified, where the specificity of the defect to that one
    enzyme was established, and where the compensatory endo-alpha-1,2-mannosidase
    increase was measured.
  modeled_mechanisms:
  - target: Endo-alpha-1,2-Mannosidase Bypass
    relationship: MEASURES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      The bypass was detected and quantified in this system, at both activity
      and transcript level, against control and parental cells.
    limitations: >-
      Fibroblasts are not a tissue affected in the disease. The bypass magnitude
      measured here may not be the magnitude in brain or liver, which is
      precisely the uncertainty the severity knowledge gap in this entry turns
      on.
    evidence:
    - reference: PMID:12145188
      reference_title: Processing of N-linked carbohydrate chains in a patient with glucosidase I deficiency (CDG type IIb).
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        By contrast, the patient's fibroblasts displayed a two- to threefold higher endo-alpha1,2-mannosidase activity, associated with an increased level of enzyme-specific mRNA-transcripts.
      explanation: >-
        The measurement this model is cited for, made in this system.
- name: Saccharomyces cerevisiae CWH41 knockout complementation assay
  experimental_model_type: OTHER
  organism:
    preferred_term: baker's yeast
    term:
      id: NCBITaxon:4932
      label: Saccharomyces cerevisiae
  publication: PMID:40674822
  description: >-
    A yeast strain lacking CWH41, the MOGS homolog, used as a functional
    complementation assay: the N-glycan profile of the knockout is restored when
    a working glucosidase I is supplied. It offers a route to testing whether a
    MOGS variant of uncertain significance retains activity, which is the
    practical difficulty this entry records in the genetic notes.
  modeled_mechanisms:
  - target: Loss of ER Alpha-Glucosidase I Activity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Deleting the homologous gene reproduces the enzymatic lesion and the
      resulting N-glycan profile change, which is what makes the strain usable
      as a readout of glucosidase I function.
    limitations: >-
      Yeast N-glycan processing diverges from human downstream of this step, so
      the assay reports on the enzyme rather than on the disease. It says
      nothing about any phenotype and was developed to characterise a
      prokaryotic MOGS rather than to model MOGS-CDG.
    evidence:
    - reference: PMID:40674822
      reference_title: Identification and characterization of a prokaryotic Mannosyl-oligosaccharide Glucosidase (MOGS) and establishment of a functional complementation assay for MOGS activity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        During the process, a functional complementation assay was established by examining the N-glycans profile of a CWH41 (MOGS homologous gene) knockout strain of Saccharomyces cerevisiae.
      explanation: >-
        Describes the assay and the strain it is built on.
    - reference: PMID:40674822
      reference_title: Identification and characterization of a prokaryotic Mannosyl-oligosaccharide Glucosidase (MOGS) and establishment of a functional complementation assay for MOGS activity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Using the assay system, the function of human MOGS and its disease related mutants were tested.
      explanation: >-
        States that the assay was actually run on disease-associated human
        variants, which is what makes it a route to resolving the variants of
        uncertain significance this entry's genetic notes flag.
classifications:
  icimd_category:
  - classification_value: n_linked_protein_glycosylation
    notes: >-
      MOGS encodes ER alpha-glucosidase I, which performs the first trimming
      step on the N-linked glycan after transfer. The lesion is confined to
      N-linked processing; no O-linked or lipid glycosylation defect is
      described in this disease.
    evidence:
    - reference: PMID:36651519
      reference_title: "MOGS-CDG: Quantitative analysis of the diagnostic Glc(3) Man tetrasaccharide and clinical spectrum of six new cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Most CDG with abnormal N-glycosylation can be detected by transferrin screening, however, MOGS-CDG escapes this routine screening.
      explanation: >-
        Places MOGS-CDG inside the N-glycosylation group, while noting the
        screening behaviour that makes it atypical within it.
mappings:
  icd10cm_mappings:
  - term:
      id: ICD10CM:E77.8
      label: Other disorders of glycoprotein metabolism
    mapping_predicate: skos:broadMatch
    mapping_justification: >-
      ICD-10-CM has no code for MOGS-CDG or for the congenital disorders of
      glycosylation individually. E77.8 is the residual glycoprotein-metabolism
      code the disease is assigned to, and it covers many unrelated disorders,
      so this is recorded as a broadMatch rather than an exact one. Per the
      MONDO coverage rule a broadMatch is a cross-reference and does not retire
      the concept from curation.
discussions:
- discussion_id: mogs_cdg_antiviral_target
  kind: EMERGING_HYPOTHESIS
  prompt: >-
    Can ER glucosidase inhibition be used as a broad-spectrum antiviral, and what
    would the MOGS-CDG phenotype predict about its safety?
  attaches_to:
  - pathophysiology#Impaired Viral Replication and Cellular Entry
  rationale: >-
    The human deficiency is the experiment, and it is a weaker experiment than it
    first appears. Patients with almost no glucosidase I activity do show
    impaired viral replication and entry, and one sibling pair showed limited
    clinical evidence of an infectious diathesis despite severe
    hypogammaglobulinemia. That pair is the whole of the survivability argument:
    across all 11 reported patients, recurrent infection is present in 10, and a
    patient from another pair had cytomegalovirus infection despite CMV being
    enveloped. So the target may well be effective; whether inhibiting it is
    survivable rests on two children, not on the disease. What the argument also
    does not establish is a therapeutic window. These patients also have
    a severe neurological and dysmorphic phenotype from lifelong constitutive
    loss, and nothing in the human data separates which of those consequences
    would follow acute pharmacological inhibition in an adult. The proposal is
    recorded as emerging on that basis.

    There is also a direct negative result, from the same group that made the
    original observation. Testing the FDA-approved alpha-glucosidase inhibitor
    miglustat against SARS-CoV-2 in vitro, they found the expected structural
    change in the spike and ACE2 glycans without the functional consequence:
    miglustat did not reproduce the resistance the human deficiency shows, and
    they say so. That does not refute the mechanism in the constitutive human
    deficiency, where the block is near-total and lifelong, but it is a concrete
    demonstration that partial pharmacological inhibition is not the same
    intervention, and it belongs beside the proposal rather than in a citation
    nobody reads.
  evidence:
  - reference: PMID:33245474
    reference_title: "N-Glycan Modification in Covid-19 Pathophysiology: In vitro Structural Changes with Limited Functional Effects."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Miglustat treatment in our in vitro model did not corroborate this assumption.
    explanation: >-
      The negative result. Graded REFUTE against the proposition that
      pharmacological alpha-glucosidase inhibition reproduces the antiviral
      phenotype of the genetic deficiency.
  - reference: PMID:33245474
    reference_title: "N-Glycan Modification in Covid-19 Pathophysiology: In vitro Structural Changes with Limited Functional Effects."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Miglustat produced no statistically significant effects on cytokine production following SARS-CoV-2 S glycoprotein stimulation of PBMC.
    explanation: >-
      A second null endpoint in the same study, on the immune rather than the
      entry side. It cuts the same way as the entry-assay null against the same
      proposition, so it is graded REFUTE alongside it.
  - reference: PMID:36158009
    reference_title: "Updated clinical and glycomic features of mannosyl-oligosaccharide glucosidase deficiency: Two case reports."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Contrary to previous findings of resistance to infection by glycosylation-dependent enveloped viruses...the elder sister in our report had evidence of cytomegalovirus (CMV, also an enveloped virus) infection.
    explanation: >-
      The strongest single counter-observation to this hypothesis, and the only
      one from patient data rather than from the same in-vitro model as the two
      nulls above. A MOGS-CDG patient acquired an enveloped-virus infection, and
      the reporting authors name the contradiction themselves. Quoted in the
      ellipsis form because the source's inline citation markers sit between the
      two clauses.
- discussion_id: mogs_cdg_bypass_and_severity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the extent of the endo-alpha-1,2-mannosidase bypass explain the wide
    severity range that genotype does not?
  attaches_to:
  - pathophysiology#Endo-alpha-1,2-Mannosidase Bypass
  rationale: >-
    Severity spans death at 74 days to survival into the second decade, and the
    largest series found no genotype correlation. The bypass is a candidate
    modifier that has never been tested as one: it was measured in a single
    patient's fibroblasts, and if its magnitude varies between individuals it
    would predict severity where the genotype does not. Measuring
    endo-alpha-1,2-mannosidase activity alongside urinary Glc3Man across the
    known cohort would settle it, and the samples to do that largely exist.
  proposed_experiments:
  - experiment_id: mogs_bypass_severity_correlation
    name: Correlate endo-alpha-1,2-mannosidase activity with clinical severity across the MOGS-CDG cohort
    description: >-
      Assay endo-alpha-1,2-mannosidase activity and transcript level in
      fibroblasts from genetically confirmed MOGS-CDG patients spanning the
      severity range, and test the association against a clinical severity score
      and against quantified urinary Glc3Man excretion.
    readouts:
    - name: Fibroblast endo-alpha-1,2-mannosidase activity
      target: pathophysiology#Endo-alpha-1,2-Mannosidase Bypass
      direction: INCREASED
      interpretation: >-
        A higher bypass activity in the milder end of the cohort would support
        the compensation acting as a severity modifier.
notes: >-
  What this entry deliberately does not claim. The viral-resistance finding is
  striking and has been repeated in secondary literature in stronger terms than
  the primary data support. Both cited sources hedge - "may explain a decreased
  susceptibility" and "at least in part" - and the observation rests on two
  siblings assessed for infection frequency, not on a controlled challenge. The
  pathophysiology node and its evidence explanations preserve those hedges. The
  antiviral-target proposal is filed as an EMERGING_HYPOTHESIS discussion rather
  than as a treatment.

  That paragraph was half-stated until review round 3, and the missing half
  changes what it means. It recorded that the observation rests on two siblings;
  it did not record what the other reported patients look like. The summary
  table in PMID:36158009 covers all eleven and shows recurrent infection in ten
  of them, with the single negative column being that same sibling pair. A
  patient from a separate pair had cytomegalovirus infection despite CMV being
  an enveloped virus, which the reporting authors flag as contrary to the
  resistance finding. So the honest scope of the antiviral observation is
  reduced susceptibility to some glycosylation-dependent enveloped viruses in
  the patients where it was looked for. It is not a clinical phenotype of
  MOGS-CDG, and earlier versions of this entry asserted that it was, in the
  disease description, on the pathophysiology node, and in the hypothesis
  rationale. All three have been narrowed.

  Immunoglobulin replacement is not recorded as a treatment, but the reason has
  been corrected. It was previously withheld partly on the grounds that the
  infection history is paradoxical. That reasoning does not survive the summary
  table in PMID:36158009: recurrent infection is present in 10 of 11 reported
  patients, so there is no disease-level paradox to argue from, only a sibling
  pair in whom the expected bacterial burden was not observed. The remaining and
  sufficient reason is the ordinary one: no source cited here recommends
  immunoglobulin replacement in MOGS-CDG, so the entry does not assert an
  indication. One of the reported patients did receive IVIG, recorded in the
  table as normal IgG and IgM afterwards, which is a data point rather than a
  recommendation. The question is raised in the supportive-care description
  instead of being answered.

  Naming. The entry name uses the current gene-based convention, MOGS-CDG.
  CDG-IIb, CDG type IIb, GCS1-CDG and glucosidase I deficiency are all in active
  use in the literature and are carried as synonyms; the older names dominate the
  pre-2015 papers this entry cites.

  No GeneReviews chapter exists for MOGS-CDG. PubMed was searched for "MOGS-CDG
  GeneReviews[All Fields]" (no results) and "congenital disorders of glycosylation
  GeneReviews[All Fields]" (four results: PMM2-CDG, SLC39A8-CDG, NGLY1-related
  congenital disorder of deglycosylation, and a retired N-linked glycosylation
  overview - none of them this disease). The phenotype baseline is therefore the
  2022 international series, the 2023 ten-case series, and the primary case
  reports.

  No conforms_to. kb/modules/congenital_disorder_of_glycosylation is the obvious
  candidate and does not fit. That module is keyed on a Protein Hypoglycosylation
  hub, routed through either an ER lipid-linked-oligosaccharide assembly defect
  (type I) or a Golgi processing and trafficking defect (type II). MOGS-CDG is
  neither: the glycan is assembled and transferred normally and the block is an
  ER trimming step, and the disease's own signature is that generalized
  hypoglycosylation does not occur - transferrin isoelectric focusing is normal
  because the endo-alpha-1,2-mannosidase bypass restores glycan maturation.
  Declaring conformance to the hypoglycosylation hub would assert the one thing
  this entry spends a pathophysiology node explaining does not happen.
  cytosolic_deglycosylation, er_protein_storage_disease and
  tsr_o_glycosylation_quality_control were checked and are each about a different
  substrate pool or compartment.

  ICD-11 is not mapped. The research report gives the linearization code 5C51.2,
  but icd11f_mappings in this repository take ICD-11 Foundation entity
  identifiers (numeric, e.g. icd11f:1369657886), and no source consulted here
  resolves 5C51.2 to one. The code is recorded in this note rather than converted
  by guesswork. OMIM #606056 and ORPHA:79328 have no slot on DiseaseMappings at
  all, which appears to be a schema gap rather than an omission here.

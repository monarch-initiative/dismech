- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic MOGS variants, homozygous or compound heterozygous. Carrier
    parents have roughly half-normal enzyme activity and are unaffected.
  evidence:
  - reference: PMID:35790351
    reference_title: "Clinical, biochemical and genetic characteristics of MOGS-CDG: a rare congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bi-allelic variants in MOGS were identified in 12 individuals from 11 families.
    explanation: >-
      The biallelic requirement across the largest assembled cohort.
  - reference: PMID:10788335
    reference_title: A novel disorder caused by defective biosynthesis of N-linked oligosaccharides due to glucosidase I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glucosidase I activities in cultured skin fibroblasts from both parents were found to be 50% of those of controls.
    explanation: >-
      The half-normal carrier activity that makes the trait recessive at the
      biochemical level as well as the clinical one.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population estimate exists. The published case count is the only figure:
    a single patient in 2000, four by 2018, ten characterised in 2023 and twelve
    from eleven families in the largest series. Reported numbers are still
    accumulating one family at a time.
  evidence:
  - reference: PMID:36651519
    reference_title: "MOGS-CDG: Quantitative analysis of the diagnostic Glc(3) Man tetrasaccharide and clinical spectrum of six new cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we clinically characterize ten MOGS-CDG cases including six previously unreported individuals, showing a phenotype characterized by dysmorphic features, global developmental delay, muscular hypotonia, and seizures in all patients and in a minority vision problems and hypogammaglobulinemia.
    explanation: >-
      The case count at the time of the most recent series, together with the
      phenotype frequencies used elsewhere in this entry.
  - reference: PMID:29235540
    reference_title: Characteristic dysmorphic features in congenital disorders of glycosylation type IIb.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mannosyl-oligosaccharide glucosidase (MOGS)-CDG (CDG type IIb) is an extremely rare CDG that has only been reported in three patients from two unrelated families.
    explanation: >-
      An earlier point on the same count, showing how sparse the literature was
      as recently as 2018.
pathophysiology:
- name: Biallelic MOGS Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Missense, frameshift and other variants on both MOGS alleles. The gene has
    four exons, with exon 4 encoding the 64 kDa catalytic domain, and both
    original disease alleles fall in that exon. Reintroducing either into
    wild-type glucosidase I abolished measurable activity, and the two acted
    differently on the protein: one retained weak affinity-resin binding and the
    other did not, so they disturb folding and active-site formation by different
    routes.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Loss of ER Alpha-Glucosidase I Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12145188
      reference_title: Processing of N-linked carbohydrate chains in a patient with glucosidase I deficiency (CDG type IIb).
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Incorporation of either mutation into wild-type glucosidase I resulted in the overexpression of enzyme mutants in COS 1 cells displaying no measurable catalytic activity.
      explanation: >-
        A direct functional test that each disease allele, on its own, abolishes
        the enzyme activity this edge asserts it removes.
  evidence:
  - reference: PMID:10788335
    reference_title: A novel disorder caused by defective biosynthesis of N-linked oligosaccharides due to glucosidase I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular studies showed that the patient was a compound heterozygote for two missense mutations in the glucosidase I gene: (1) one allele harbored a G-->C transition at nucleotide (nt) 1587, resulting in the substitution of Arg at position 486 by Thr (R486T), and (2) on the other allele a T-->C transition at nt 2085 resulted in the substitution of Phe at position 652 by Leu (F652L).
    explanation: >-
      The two founding disease alleles, with their positions and consequences.
  - reference: PMID:12145188
    reference_title: Processing of N-linked carbohydrate chains in a patient with glucosidase I deficiency (CDG type IIb).
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The Phe652Leu but not the Arg486Thr protein mutant showed a weak binding to a glucosidase I-specific affinity resin, indicating that the two amino acids affect polypeptide folding and active site formation differently.
    explanation: >-
      Shows the two alleles are not mechanistically equivalent, which is why
      this node describes a class of lesions rather than one.
- name: Loss of ER Alpha-Glucosidase I Activity
  biological_scale: MOLECULAR
  description: >-
    Residual activity in patient tissue is under 3 percent of control in liver
    and fibroblasts, and under 1 percent by kinetic assay in fibroblast extracts.
    The loss is specific: oligosaccharyltransferase, glucosidase II and
    Man9-mannosidase activities are unchanged, so the block is at one enzyme
    rather than across the pathway.
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  molecular_functions:
  - preferred_term: ER alpha-glucosidase I activity
    modifier: DECREASED
    term:
      id: GO:0004573
      label: Glc3Man9GlcNAc2 oligosaccharide glucosidase activity
  downstream:
  - target: Failure of the First N-Glycan Trimming Step
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:10788335
    reference_title: A novel disorder caused by defective biosynthesis of N-linked oligosaccharides due to glucosidase I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Enzymological studies on liver tissue and cultured skin fibroblasts revealed a severe glucosidase I deficiency. The residual activity was <3% of that of controls.
    explanation: >-
      The measured residual activity in patient tissue.
  - reference: PMID:12145188
    reference_title: Processing of N-linked carbohydrate chains in a patient with glucosidase I deficiency (CDG type IIb).
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      No significant differences in the activities of other processing enzymes, including oligosaccharyltransferase, glucosidase II, and Man(9)-mannosidase, were observed.
    explanation: >-
      Establishes that the defect is confined to this one enzyme, which is what
      lets the rest of the chain be attributed to it.
- name: Failure of the First N-Glycan Trimming Step
  biological_scale: MOLECULAR
  description: >-
    Glucosidase I removes the distal alpha-1,2-linked glucose from the
    Glc3Man9GlcNAc2 precursor immediately after it is transferred en bloc from
    dolichyl diphosphate to the nascent chain. Without that first cut the glycan
    cannot enter the maturation sequence, and a fraction of N-glycans is arrested
    at the Glc3Man9-7GlcNAc2 stage.
  biological_processes:
  - preferred_term: processing of protein-bound N-glycans
    modifier: DECREASED
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
  downstream:
  - target: Endo-alpha-1,2-Mannosidase Bypass
    causal_link_type: DIRECT
  - target: Destabilised Circulating Immunoglobulin
    causal_link_type: DIRECT
  - target: Impaired Viral Replication and Cellular Entry
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:10788335
    reference_title: A novel disorder caused by defective biosynthesis of N-linked oligosaccharides due to glucosidase I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glucosidase I is an important enzyme in N-linked glycoprotein processing, removing specifically distal alpha-1,2-linked glucose from the Glc3Man9GlcNAc2 precursor after its en bloc transfer from dolichyl diphosphate to a nascent polypeptide chain in the endoplasmic reticulum.
    explanation: >-
      Defines the reaction whose failure this node describes, and its position
      in the pathway.
  - reference: PMID:12145188
    reference_title: Processing of N-linked carbohydrate chains in a patient with glucosidase I deficiency (CDG type IIb).
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      despite the dramatically reduced glucosidase I activity, the bulk of the N-linked carbohydrate chains (>80%) in the patient's fibroblasts appeared to have been processed correctly, with only approximately 16% of the N-glycans being arrested at the Glc(3)-Man(9-7)-GlcNAc(2) stage.
    explanation: >-
      Quantifies how much of the glycan pool is actually arrested, which is
      smaller than the near-total enzyme loss would suggest and is the reason the
      bypass node exists.
- name: Endo-alpha-1,2-Mannosidase Bypass
  biological_scale: CELLULAR
  description: >-
    Patient fibroblasts show two- to threefold higher endo-alpha-1,2-mannosidase
    activity with a matching rise in its transcript. That enzyme cleaves
    internally to the glucose block, so it clears most glycans through an
    alternative route and releases the Glc3Man tetrasaccharide. This single
    compensation explains two otherwise puzzling observations at once: why the
    serum transferrin pattern is normal despite a near-complete enzyme loss, and
    where the diagnostic urinary tetrasaccharide comes from.
  biological_processes:
  - preferred_term: alternative oligosaccharide processing via endo-alpha-1,2-mannosidase
    modifier: INCREASED
    term:
      id: GO:0009313
      label: oligosaccharide catabolic process
  downstream:
  - target: Urinary Glc3Man Tetrasaccharide Excretion
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:12145188
    reference_title: Processing of N-linked carbohydrate chains in a patient with glucosidase I deficiency (CDG type IIb).
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      By contrast, the patient's fibroblasts displayed a two- to threefold higher endo-alpha1,2-mannosidase activity, associated with an increased level of enzyme-specific mRNA-transcripts.
    explanation: >-
      The measured compensatory increase, at both activity and transcript level.
  - reference: PMID:12145188
    reference_title: Processing of N-linked carbohydrate chains in a patient with glucosidase I deficiency (CDG type IIb).
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This points to the lack of glucosidase I activity being compensated for, to some extent, by increase in the activity of the pathway involving endo-alpha1,2-mannosidase; this would also explain the marked urinary excretion of Glc(3)-Man.
    explanation: >-
      The authors' own reading of the compensation, including the link to the
      urinary marker that this node's downstream edge asserts.
- name: Urinary Glc3Man Tetrasaccharide Excretion
  biological_scale: ORGANISM
  description: >-
    Glc-alpha1-3-Glc-alpha1-3-Glc-alpha1-2-Man appears in urine, and it is the
    one biochemical finding that has been abnormal in every affected proband
    tested. Quantified by liquid chromatography-mass spectrometry it ran from
    34.1 to 618.0 micromol per mmol creatinine against a reference below 5.
  evidence:
  - reference: PMID:36651519
    reference_title: "MOGS-CDG: Quantitative analysis of the diagnostic Glc(3) Man tetrasaccharide and clinical spectrum of six new cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glc3 Man was increased in all six analyzed cases, ranging from 34.1 to 618.0 μmol/mmol creatinine (reference <5 μmol).
    explanation: >-
      The quantified excretion with its reference interval, in every case
      tested.
  - reference: PMID:35790351
    reference_title: "Clinical, biochemical and genetic characteristics of MOGS-CDG: a rare congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urine oligosaccharide analysis was consistently abnormal for all affected probands, whereas other biochemical analyses such as serum transferrin analysis was not consistently abnormal.
    explanation: >-
      The consistency of the urinary marker set directly against the
      inconsistency of the standard CDG screen.
- name: Destabilised Circulating Immunoglobulin
  biological_scale: ORGANISM
  description: >-
    Immunoglobulins carry N-glycans, and glycan structure governs their
    stability and circulating half-life. In MOGS-CDG the hypogammaglobulinemia is
    a catabolic problem rather than a production one: the mechanism identified in
    the two studied siblings was a shortened immunoglobulin half-life.

    Serum glycomics names the specific defect behind that clearance. Patient IgG
    carries aberrant oligo-mannose and hybrid-type N-glycans, and its
    core-fucosylated complex di-antennary glycans are markedly reduced - while
    transferrin and alpha-1-antitrypsin move the other way, with increased
    sialylated species. The defect is therefore not uniform across serum
    glycoproteins, which is part of why transferrin-based CDG screening misses
    this disease.
  cell_types:
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  downstream:
  - target: Decreased circulating IgG concentration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24716661
    reference_title: "Glycosylation, hypogammaglobulinemia, and resistance to viral infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A shortened immunoglobulin half-life was determined to be the mechanism underlying the hypogammaglobulinemia.
    explanation: >-
      Identifies the mechanism as accelerated clearance, which is the specific
      claim of this node.
  - reference: PMID:27393411
    reference_title: "Immunological aspects of congenital disorders of glycosylation (CDG): a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CDG with major immunological involvement are ALG12-CDG, MAGT1-CDG, MOGS-CDG, SLC35C1-CDG and PGM3-CDG.
    explanation: >-
      Places MOGS-CDG among the small set of CDG in which immunological
      involvement is a major rather than incidental feature.
  - reference: PMID:35137040
    reference_title: Serum N-glycomics of a novel CDG-IIb patient reveals aberrant IgG glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We further detected aberrant oligo-mannose (Glc3Man7GlcNAc2) and hybrid type N-glycans on patient-derived IgGs and we attributed this defective glycosylation to be the reason for an increased IgG clearance.
    explanation: >-
      Identifies the glycan species on patient IgG and attributes the increased
      clearance to them, which is the molecular content behind the
      shortened-half-life claim above. Quoted with the authors' own "we
      attributed", since it is their inference rather than a measured
      half-life.
  - reference: PMID:35137040
    reference_title: Serum N-glycomics of a novel CDG-IIb patient reveals aberrant IgG glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      relative intensities of IgG-specific complex type di-antennary N-glycans with core-fucosylation were considerably reduced in the patient's serum whereas TF- and AAT-characteristic sialylated di- and tri-antennary N-glycans were increased
    explanation: >-
      The per-glycoprotein divergence recorded in this node's description, and
      an independent reason transferrin-based screening does not detect the
      disease.
- name: Impaired Viral Replication and Cellular Entry
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Enveloped viruses depend on host ER glucosidases to fold their own
    glycoproteins and on host glycan structures for receptor engagement, so the
    same block that destabilises immunoglobulin also handicaps the virus. This
    node is why the hypogammaglobulinemia does not translate into the expected
    infectious diathesis, and it is the observation that made ER glucosidases a
    broad-spectrum antiviral target.
  biological_processes:
  - preferred_term: viral entry mediated by receptor-glycan interaction
    modifier: DECREASED
    term:
      id: GO:0019065
      label: receptor-mediated endocytosis of virus by host cell
  evidence:
  - reference: PMID:24716661
    reference_title: "Glycosylation, hypogammaglobulinemia, and resistance to viral infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Impaired viral replication and cellular entry may explain a decreased susceptibility to infections.
    explanation: >-
      The proposed mechanism, quoted with the authors' own "may explain" so that
      the hedge is preserved rather than upgraded.
  - reference: PMID:25318123
    reference_title: Viral resistance of MOGS-CDG patients implies a broad-spectrum strategy against acute virus infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This paradox phenomenon is, at least in part, because the impaired N-linked glycan processing of the patients compromises their ability to support efficient replication and cellular entry of viruses.
    explanation: >-
      A second group's reading of the same observation, with its own hedge "at
      least in part".

    ten-case series calls hypogammaglobulinemia a minority feature; the
    eleven-patient summary table shows some-class hypogammaglobulinemia in every
    patient. Both are quoted below. The band follows the table, since it is the
    larger and more explicit count, and the narrower series is retained rather
    than discarded.


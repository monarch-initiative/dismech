      biochemical level as well as the clinical one.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population estimate exists. The published case count is the only figure,
    and it has moved steadily: a single patient in 2000, three from two families
    by 2018, ten characterised in 2023, twelve from eleven families in the
    largest phenotyping series, and about thirty published worldwide as of 2024.
    Reported numbers are still accumulating one family at a time.
  evidence:
  - reference: PMID:36651519
    reference_title: "MOGS-CDG: Quantitative analysis of the diagnostic Glc(3) Man tetrasaccharide and clinical spectrum of six new cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we clinically characterize ten MOGS-CDG cases including six previously unreported individuals, showing a phenotype characterized by dysmorphic features, global developmental delay, muscular hypotonia, and seizures in all patients and in a minority vision problems and hypogammaglobulinemia.
    explanation: >-
      The case count at the time of the most recent series, together with the
      phenotype frequencies used elsewhere in this entry.
  - reference: PMID:29235540
    reference_title: Characteristic dysmorphic features in congenital disorders of glycosylation type IIb.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mannosyl-oligosaccharide glucosidase (MOGS)-CDG (CDG type IIb) is an extremely rare CDG that has only been reported in three patients from two unrelated families.
    explanation: >-
      An earlier point on the same count, showing how sparse the literature was
      as recently as 2018.
  - reference: PMID:38498292
    reference_title: "Early onset epileptic and developmental encephalopathy and MOGS variants: a new diagnosis in the whole exome sequencing (WES) ERA : Report of a new patient and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

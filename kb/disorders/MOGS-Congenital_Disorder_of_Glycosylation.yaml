pathophysiology:
- name: Biallelic MOGS Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Missense, frameshift and other variants on both MOGS alleles. The gene has
    four exons, with exon 4 encoding the 64 kDa catalytic domain, and both
    original disease alleles fall in that exon. Reintroducing either into
    wild-type glucosidase I abolished measurable activity, and the two acted
    differently on the protein: one retained weak affinity-resin binding and the
    other did not, so they disturb folding and active-site formation by different
    routes.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Loss of ER Alpha-Glucosidase I Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12145188
      reference_title: Processing of N-linked carbohydrate chains in a patient with glucosidase I deficiency (CDG type IIb).
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Incorporation of either mutation into wild-type glucosidase I resulted in the overexpression of enzyme mutants in COS 1 cells displaying no measurable catalytic activity.
      explanation: >-
        A direct functional test that each disease allele, on its own, abolishes
        the enzyme activity this edge asserts it removes.
  evidence:
  - reference: PMID:10788335
    reference_title: A novel disorder caused by defective biosynthesis of N-linked oligosaccharides due to glucosidase I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular studies showed that the patient was a compound heterozygote for two missense mutations in the glucosidase I gene: (1) one allele harbored a G-->C transition at nucleotide (nt) 1587, resulting in the substitution of Arg at position 486 by Thr (R486T), and (2) on the other allele a T-->C transition at nt 2085 resulted in the substitution of Phe at position 652 by Leu (F652L).
    explanation: >-
      The two founding disease alleles, with their positions and consequences.
  - reference: PMID:12145188
    reference_title: Processing of N-linked carbohydrate chains in a patient with glucosidase I deficiency (CDG type IIb).
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The Phe652Leu but not the Arg486Thr protein mutant showed a weak binding to a glucosidase I-specific affinity resin, indicating that the two amino acids affect polypeptide folding and active site formation differently.
    explanation: >-
      Shows the two alleles are not mechanistically equivalent, which is why
      this node describes a class of lesions rather than one.
- name: Loss of ER Alpha-Glucosidase I Activity
  biological_scale: MOLECULAR
  description: >-
    Residual activity in patient tissue is under 3 percent of control in liver
    and fibroblasts, and under 1 percent by kinetic assay in fibroblast extracts.
    The loss is specific: oligosaccharyltransferase, glucosidase II and
    Man9-mannosidase activities are unchanged, so the block is at one enzyme
    rather than across the pathway.
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  molecular_functions:
  - preferred_term: ER alpha-glucosidase I activity
    modifier: DECREASED
    term:
      id: GO:0004573
      label: Glc3Man9GlcNAc2 oligosaccharide glucosidase activity
  downstream:
  - target: Failure of the First N-Glycan Trimming Step
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:10788335
    reference_title: A novel disorder caused by defective biosynthesis of N-linked oligosaccharides due to glucosidase I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Enzymological studies on liver tissue and cultured skin fibroblasts revealed a severe glucosidase I deficiency. The residual activity was <3% of that of controls.
    explanation: >-
      The measured residual activity in patient tissue.
  - reference: PMID:12145188
    reference_title: Processing of N-linked carbohydrate chains in a patient with glucosidase I deficiency (CDG type IIb).
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      No significant differences in the activities of other processing enzymes, including oligosaccharyltransferase, glucosidase II, and Man(9)-mannosidase, were observed.
    explanation: >-
      Establishes that the defect is confined to this one enzyme, which is what
      lets the rest of the chain be attributed to it.
- name: Failure of the First N-Glycan Trimming Step
  biological_scale: MOLECULAR
  description: >-
    Glucosidase I removes the distal alpha-1,2-linked glucose from the
    Glc3Man9GlcNAc2 precursor immediately after it is transferred en bloc from
    dolichyl diphosphate to the nascent chain. Without that first cut the glycan
    cannot enter the maturation sequence, and a fraction of N-glycans is arrested
    at the Glc3Man9-7GlcNAc2 stage.
  biological_processes:
  - preferred_term: processing of protein-bound N-glycans
    modifier: DECREASED
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
  downstream:
  - target: Endo-alpha-1,2-Mannosidase Bypass
    causal_link_type: DIRECT
  - target: Destabilised Circulating Immunoglobulin
    causal_link_type: DIRECT
  - target: Impaired Viral Replication and Cellular Entry
    causal_link_type: DIRECT
  - target: Aberrant Neuronal Glycoprotein Function
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The neurological branch. That the glycan block causes the encephalopathy
      is asserted in the literature at disease level; which neuronal
      glycoproteins carry it is not established, so the edge is typed as having
      unknown intermediates rather than as direct.
    evidence:
    - reference: PMID:33261925
      reference_title: "Congenital disorders of glycosylation type IIb with MOGS mutations cause early infantile epileptic encephalopathy, dysmorphic features, and hepatic dysfunction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        MOGS mutations cause congenital disorders of glycosylation type IIb (CDG-IIb or GCS1-CDG).
      explanation: >-
        The causal statement at gene-to-disease level, which is the level at
        which this edge is asserted.
  - target: Hepatic Glycoprotein Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The hepatic branch. Same epistemic status as the neurological one: the
      association is consistent across reported patients and the intervening
      steps are not worked out.
  - target: Disrupted Developmental Glycosylation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The dysmorphogenesis branch, accounting for the recognisable craniofacial
      and limb pattern and the generalized edema.
  - target: Cumulative Multisystem Glycoprotein Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The systemic burden that is not attributable to any single organ branch,
      and which determines outcome in the severe cases.
  evidence:
  - reference: PMID:10788335
    reference_title: A novel disorder caused by defective biosynthesis of N-linked oligosaccharides due to glucosidase I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glucosidase I is an important enzyme in N-linked glycoprotein processing, removing specifically distal alpha-1,2-linked glucose from the Glc3Man9GlcNAc2 precursor after its en bloc transfer from dolichyl diphosphate to a nascent polypeptide chain in the endoplasmic reticulum.
    explanation: >-
      Defines the reaction whose failure this node describes, and its position
      in the pathway.
  - reference: PMID:12145188
    reference_title: Processing of N-linked carbohydrate chains in a patient with glucosidase I deficiency (CDG type IIb).
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      despite the dramatically reduced glucosidase I activity, the bulk of the N-linked carbohydrate chains (>80%) in the patient's fibroblasts appeared to have been processed correctly, with only approximately 16% of the N-glycans being arrested at the Glc(3)-Man(9-7)-GlcNAc(2) stage.
    explanation: >-
      Quantifies how much of the glycan pool is actually arrested, which is
      smaller than the near-total enzyme loss would suggest and is the reason the
      bypass node exists.
- name: Aberrant Neuronal Glycoprotein Function
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Neuronal ion channels, adhesion molecules and receptors are N-glycosylated,
    and the standard account is that mishandling their glycans is what produces
    the encephalopathy. It is worth being clear that this is an inference from
    glycan biology plus a consistent clinical association, not a demonstrated
    step: no specific neuronal glycoprotein has been shown to be the one that
    matters, and no cited work measures a neuronal glycoprotein defect in a
    patient. It is recorded as HYPOTHETICAL for that reason, and the entry does
    not name a mechanism it cannot cite.

    What is well established is the clinical output. Seizures, hypotonia and
    developmental delay are present in essentially every reported patient, the
    seizures are frequently drug-resistant, and imaging shows progressive
    cortical and subcortical atrophy.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Epileptic encephalopathy
    causal_link_type: DIRECT
  - target: Generalized hypotonia
    causal_link_type: DIRECT
  - target: Global developmental delay
    causal_link_type: DIRECT
  - target: Cerebral atrophy
    causal_link_type: DIRECT
  - target: Dystonia
    causal_link_type: DIRECT
  - target: Thin corpus callosum
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Visual impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:33058492
    reference_title: "Epilepsy and movement disorders in CDG: Report on the oldest-known MOGS-CDG patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At birth she presented facial dysmorphism, marked hypotonia, and drug-resistant tonic seizures.
    explanation: >-
      The neurological presentation from birth in the longest-followed patient,
      including the drug resistance this node's downstream treatment claim
      depends on.
  - reference: PMID:38498292
    reference_title: "Early onset epileptic and developmental encephalopathy and MOGS variants: a new diagnosis in the whole exome sequencing (WES) ERA : Report of a new patient and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MOGS-CDG is a rare disorder affecting the processing of N-Glycans (CDG type II) and is characterized by prominent neurological involvement including hypotonia, developmental delay, seizures and movement disorders.
    explanation: >-
      States that neurological involvement is the prominent feature and names
      the four components this node feeds.
- name: Hepatic Glycoprotein Dysfunction
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Progressive hepatomegaly with raised transaminases, and in one reported pair
    coagulopathy, attributed to abnormal handling of hepatic and secreted
    glycoproteins including the glycosylated clotting factors. As with the
    neurological branch, the attribution is inference from glycan biology rather
    than a measured hepatic defect, and it is typed accordingly.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  downstream:
  - target: Hepatomegaly
    causal_link_type: DIRECT
  - target: Elevated circulating hepatic transaminase concentration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30587846
    reference_title: Compound heterozygous variants in MOGS inducing congenital disorders of glycosylation (CDG) IIb.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both cases presented progressive hepatomegaly and elevated hepatic enzymes.
    explanation: >-
      The hepatic phenotype and its progressive course in two siblings, which is
      the clinical output of this node.
- name: Disrupted Developmental Glycosylation
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The craniofacial and limb pattern is recognisable enough to have been
    proposed as a diagnostic hallmark, which is why it is modelled as a branch
    rather than left as an unattached list of findings. The mechanism is the
    least worked out of the three: glycoproteins govern developmental adhesion
    and signalling, and disrupting them plausibly produces this pattern, but
    nothing in the cited literature identifies the pathway.
  downstream:
  - target: Long eyelashes
    causal_link_type: DIRECT
  - target: Retrognathia
    causal_link_type: DIRECT
  - target: Overlapping fingers
    causal_link_type: DIRECT
  - target: Hirsutism
    causal_link_type: DIRECT
  - target: Generalized edema
    causal_link_type: DIRECT
  evidence:

name: MOGS-Congenital Disorder of Glycosylation
creation_date: "2026-09-09T14:05:00Z"
category: Mendelian
synonyms:
- MOGS-CDG
- CDG-IIb
- CDG type IIb
- congenital disorder of glycosylation type IIb
- GCS1-CDG
- glucosidase I deficiency
- carbohydrate deficient glycoprotein syndrome type IIb
description: >-
  MOGS-CDG is an autosomal recessive congenital disorder of glycosylation caused
  by biallelic MOGS variants. MOGS encodes ER alpha-glucosidase I, which performs
  the first obligate trimming step on a newly transferred N-glycan: removal of
  the outermost alpha-1,2-linked glucose from Glc3Man9GlcNAc2. Losing it blocks
  N-glycan maturation at its first move.

  Clinically it is a severe multisystem disease. Dysmorphic features, generalised
  hypotonia, global developmental delay and seizures are present in essentially
  all reported patients; hepatic dysfunction, hypoventilation, vision problems
  and hypogammaglobulinemia occur in some. Severity spans a neonatal course fatal
  at 74 days through to children alive in their second decade, with no genotype
  correlation established.

  Two things make this entry unusual. The first is an immunological paradox:
  patients have severe hypogammaglobulinemia and yet little clinical infection.
  The immunoglobulin defect is a shortened half-life of aberrantly glycosylated
  antibody rather than a failure to make it, and the same glycan block that
  destabilises immunoglobulin also impairs the replication and cellular entry of
  enveloped viruses. The deficiency subtracts from host defence and from viral
  fitness at once, which is what turned this ultra-rare disease into a proof of
  principle for ER glucosidase inhibitors as broad-spectrum antivirals.

  The second is a diagnostic trap. Serum transferrin isoelectric focusing, the
  standard CDG screen, is typically normal here, so the disease escapes the test
  that would otherwise find it. The reason is a partial metabolic bypass: with
  glucosidase I absent, endo-alpha-1,2-mannosidase activity rises and clears most
  glycans through an alternative route, leaving the bulk of N-glycoproteins
  correctly processed and releasing the Glc3Man tetrasaccharide into urine. That
  tetrasaccharide is the reliable diagnostic marker, and urine oligosaccharide
  analysis is the test that works.

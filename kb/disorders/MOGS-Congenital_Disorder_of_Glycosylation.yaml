    reference_title: A novel disorder caused by defective biosynthesis of N-linked oligosaccharides due to glucosidase I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical course was progressive and was characterized by the occurrence of hepatomegaly, hypoventilation, feeding problems, seizures, and fatal outcome at age 74 d.
    explanation: >-
      The multisystem sequence and its outcome in the index case, which is the
      claim this node makes.
  - reference: PMID:35790351
    reference_title: "Clinical, biochemical and genetic characteristics of MOGS-CDG: a rare congenital disorder of glycosylation."
    supports: SUPPORT

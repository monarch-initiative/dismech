    reference_title: Characteristic dysmorphic features in congenital disorders of glycosylation type IIb.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Importantly, a review of the features of all four patients revealed the recognizable clinical hallmarks of MOGS-CDG.
    explanation: >-
      Establishes that the dysmorphic pattern is consistent enough across
      patients to be treated as a single phenotypic output rather than
      incidental variation.
- name: Cumulative Multisystem Glycoprotein Dysfunction
  biological_scale: ORGANISM
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The whole-organism consequence of disturbing a modification carried by most
    secreted and membrane glycoproteins at once. It is modelled as its own node
    because the features it carries - feeding failure and respiratory
    insufficiency - are not attributable to any single organ branch and are what
    determine outcome: in the index case the sequence of hepatomegaly,
    hypoventilation, feeding problems and seizures ended in death at 74 days,
    while children with more residual function survive into their second decade.
  downstream:
  - target: Hypoventilation
    causal_link_type: DIRECT
  - target: Failure to thrive
    causal_link_type: DIRECT

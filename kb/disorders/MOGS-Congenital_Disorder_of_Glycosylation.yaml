      Records hypoventilation in the index case, in the sequence that ended in
      death at 74 days.
- name: Decreased circulating IgG concentration
  category: Immunologic
  description: >-
    Severe hypogammaglobulinemia, present in a minority of patients. The reason
    it does not behave like other severe antibody deficiencies is recorded in the
    pathophysiology: the antibody is cleared too fast rather than not made, and
    the same glycan block impairs the viruses.
  phenotype_term:
    preferred_term: Severe hypogammaglobulinemia
    term:
      id: HP:0004315
      label: Decreased circulating IgG concentration
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:24716661
    reference_title: "Glycosylation, hypogammaglobulinemia, and resistance to viral infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We evaluated two siblings with CDG-IIb who presented with multiple neurologic complications and a paradoxical immunologic phenotype characterized by severe hypogammaglobulinemia but limited clinical evidence of an infectious diathesis.
    explanation: >-
      The hypogammaglobulinemia and the absence of the expected infection burden
      in one sentence, which is the paradox this entry models.
  - reference: PMID:36651519
    reference_title: "MOGS-CDG: Quantitative analysis of the diagnostic Glc(3) Man tetrasaccharide and clinical spectrum of six new cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we clinically characterize ten MOGS-CDG cases including six previously unreported individuals, showing a phenotype characterized by dysmorphic features, global developmental delay, muscular hypotonia, and seizures in all patients and in a minority vision problems and hypogammaglobulinemia.
    explanation: >-
      Sets the frequency: hypogammaglobulinemia is a minority feature, unlike the
      universal neurological ones.

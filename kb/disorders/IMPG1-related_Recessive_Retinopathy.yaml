pathophysiology:
- name: Biallelic IMPG1 Loss of Function
  description: >-
    Both IMPG1 alleles carry a null variant (nonsense, canonical splice-site,
    exon-skipping splice variant) or a hypomorphic missense variant, so the
    photoreceptors secrete little or no functional SPACR into the
    interphotoreceptor matrix. In the founding families at least one allele was
    a nonsense or presumed frameshift allele, and a leaky splice variant
    (c.807+5G>A) skips exon 7 in about half of transcripts. Carriers of one null
    allele in recessive families are clinically unaffected or only
    subclinically affected, which is the basis for separating this entity from
    the dominant IMPG1 disease, where a heterozygous missense allele such as
    p.Leu238Arg is proposed to act dominantly within the matrix.

name: IMPG1-related Recessive Retinopathy
creation_date: "2026-10-30T23:00:13Z"
category: Mendelian
description: >-
  IMPG1-related recessive retinopathy is inherited retinal disease caused by
  biallelic pathogenic variants in IMPG1, which encodes interphotoreceptor
  matrix proteoglycan 1 (SPACR, also IPM150), a secreted glycoprotein made by
  rod and cone photoreceptors and deposited in the interphotoreceptor matrix
  (IPM) that fills the subretinal space between photoreceptor outer segments
  and the retinal pigment epithelium (RPE). Biallelic variants are null alleles
  (nonsense, canonical or leaky splice-site) or hypomorphic missense alleles,
  and are reported with two clinical presentations: an autosomal recessive
  vitelliform macular dystrophy with a central and sometimes multifocal
  autofluorescent subretinal deposit, decreased visual acuity and a moderately
  reduced electrooculogram Arden ratio, and an autosomal recessive retinitis
  pigmentosa with night blindness, bone-spicule pigmentation, vessel
  attenuation and reduced dark-adapted electroretinogram responses. The ClinGen
  Retina Gene Curation Expert Panel lumps both presentations into one entity
  because they share one mechanism, biallelic loss of IMPG1 function, and
  splits the dominant IMPG1 disease off as a separate entity. In Impg1 knockout
  mice, loss of SPACR disorganizes the IPM, misaligns outer segments, damages
  the apical RPE, and leads to late-onset accumulation of autofluorescent
  subretinal deposits and photoreceptor degeneration. Only a handful of
  biallelic families have been reported, and no disease-specific treatment
  exists.
disease_term:
  preferred_term: IMPG1-related recessive retinopathy
  term:
    id: MONDO:1040037
    label: IMPG1-related recessive retinopathy
synonyms:
- autosomal recessive IMPG1 retinopathy
- autosomal recessive IMPG1-related vitelliform macular dystrophy
- autosomal recessive IMPG1-related retinitis pigmentosa
parents:
- Ophthalmological Disease
- Retinal Dystrophy
- Inherited retinal dystrophy
notes: >-
  Relation to other entries. The dominant IMPG1 disease (MONDO:1040036,
  IMPG1-related dominant retinopathy) is a separate ClinGen entity and is not
  covered here. Vitelliform macular dystrophy 4 (MONDO:0014508, OMIM 616151)
  covers IMPG1 vitelliform macular dystrophy of either inheritance mode; MONDO
  places it under both adult-onset foveomacular vitelliform dystrophy and this
  term. It is bound as the IMPG1-related subtype of
  Adult_Onset_Foveomacular_Vitelliform_Dystrophy, which describes the dominant
  adult-onset form. This entry does not bind MONDO:0014508 as its own subtype
  term: its recessive vitelliform subtype is the biallelic part of VMD4 and maps
  to it with skos:broadMatch. The recessive retinitis pigmentosa presentation
  has no MONDO term of its own; OMIM 153870 (retinitis pigmentosa 91), which
  ClinGen cites for it, maps in MONDO to benign concentric annular macular
  dystrophy (MONDO:0007934), a dominant phenotype filed under MONDO:1040036.
  No GeneReviews chapter covers IMPG1 retinopathy.
has_subtypes:
- name: Recessive VMD
  display_name: Autosomal recessive IMPG1 vitelliform macular dystrophy
  description: >-
    Vitelliform macular dystrophy in individuals homozygous or compound
    heterozygous for IMPG1 variants: a round, autofluorescent, dome-shaped
    subfoveal deposit, in some families with additional multifocal extramacular
    vitelliform deposits, decreased visual acuity and a moderately decreased
    electrooculogram Arden ratio. Reported onset ranges from early childhood to
    adulthood. Heterozygous parents are asymptomatic or show only subclinical
    changes such as tiny extramacular deposits.
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0014508
        label: vitelliform macular dystrophy 4
      mapping_predicate: skos:broadMatch
      mapping_justification: >-
        VMD4 is defined by MONDO as any vitelliform macular dystrophy caused by
        IMPG1 mutation, whatever the inheritance mode, so it is broader than
        this biallelic subtype. The dominant adult-onset part of VMD4 is curated
        as the IMPG1-related subtype of
        Adult_Onset_Foveomacular_Vitelliform_Dystrophy.

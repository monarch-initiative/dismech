genetic:
- name: IMPG1
  gene_term:
    preferred_term: IMPG1
    term:
      id: hgnc:6055
      label: IMPG1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Biallelic germline variants: homozygous canonical splice-site c.807+1G>T,
    homozygous leaky splice-site c.807+5G>A, and compound heterozygous
    c.461T>C (p.Leu154Pro) with c.1519C>T (p.Arg507Ter) in the vitelliform
    families, and further biallelic missense, nonsense and splice variants in
    retinitis pigmentosa families. ClinGen scored eight variants in seven
    probands.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_d638e88c-feaa-4d84-a4e7-9b83481bfb0c-2023-09-07T160000.000Z
    evidence:
    - reference: CGGV:assertion_d638e88c-feaa-4d84-a4e7-9b83481bfb0c-2023-09-07T160000.000Z
      reference_title: "IMPG1 / IMPG1-related recessive retinopathy (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "IMPG1 | HGNC:6055 | IMPG1-related recessive retinopathy | MONDO:1040037 | AR | Definitive"
      explanation: ClinGen gene-disease validity record classifying this pair as Definitive.
  evidence:
  - reference: CGGV:assertion_d638e88c-feaa-4d84-a4e7-9b83481bfb0c-2023-09-07T160000.000Z
    reference_title: "IMPG1 / IMPG1-related recessive retinopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "cases caused by inherited biallelic IMPG1 variants have been lumped into a single disease entity, referred to as IMPG1-related recessive retinopathy"
    explanation: >-
      ClinGen defines this entity by biallelic IMPG1 variants, lumping
      recessive VMD and recessive RP.
  notes: >-
    Large recessive pedigrees have not been reported and segregation evidence
    did not contribute to the ClinGen score; the case basis is a small number of
    families.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic IMPG1 variants. ClinGen reports complete
    penetrance for biallelic genotypes, while heterozygous carriers in recessive
    families are unaffected or show only subclinical changes such as tiny
    extramacular vitelliform spots. The separate dominant IMPG1 disease is
    incompletely penetrant.
  evidence:
  - reference: CGGV:assertion_d638e88c-feaa-4d84-a4e7-9b83481bfb0c-2023-09-07T160000.000Z
    reference_title: "IMPG1 / IMPG1-related recessive retinopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "biallelic variants appear to be associated with complete penetrance, while monoallelic variants are generally incompletely penetrant"
    explanation: >-
      ClinGen describes complete penetrance for biallelic IMPG1 genotypes.
  - reference: PMID:23993198
    reference_title: Mutations in IMPG1 cause vitelliform macular dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the heterozygous asymptomatic parents showed only tiny vitelliform spots outside the macula"
    explanation: >-
      Heterozygous parents of the homozygous patients were asymptomatic, with
      only minor extramacular deposits.
animal_models:
- name: Impg1 knockout mouse (Olivier 2022)
  species: Mouse
  genotype: Impg1-/- (floxed exon 6 deleted by CMV-Cre)
  background: C57BL/6J
  publication: PMID:36140676
  description: >-
    Constitutive Impg1 knockout with no detectable retinal SPACR. Normal at 2
    months; from 9 months, autofluorescent subretinal deposits across the
    fundus, falling scotopic and photopic ERG amplitudes, outer retinal
    thinning, disorganized IPM and outer segments, and RPE damage, worsening
    by 14 months.
  evidence:
  - reference: PMID:36140676
    reference_title: SPACR Encoded by IMPG1 Is Essential for Photoreceptor Survival by Interplaying between the Interphotoreceptor Matrix and the Retinal Pigment Epithelium.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Impg1-/- mice provide a novel model for mechanistic investigations and the development of therapies for VMD and RP caused by IMPG1 pathogenic variants."
    explanation: The authors present the knockout as a model of IMPG1 retinopathy.
  modeled_mechanisms:
  - target: Subretinal Autofluorescent Material Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Autofluorescent hyperreflective deposits form between outer segments and RPE.
    limitations: >-
      Mice have no macula, so the deposits are scattered across the fundus
      rather than forming a single central vitelliform lesion; a single
      yolk-like dome was seen in one mouse only.
    evidence:
    - reference: PMID:36140676
      reference_title: SPACR Encoded by IMPG1 Is Essential for Photoreceptor Survival by Interplaying between the Interphotoreceptor Matrix and the Retinal Pigment Epithelium.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These autofluorescent spots in the Impg1−/− mice were also detectable by SD-OCT as hyperreflective deposits localized between the photoreceptors OS and the RPE"
      explanation: Shows the deposits sit in the same compartment as the human lesion.
  - target: Photoreceptor Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Late-onset, slowly progressive loss of rod and cone function and outer retinal thinning.
    limitations: >-
      Degeneration is mild and late (detectable from 9 months), and the mouse
      shows no pigment deposits, so the retinitis pigmentosa fundus picture is
      not reproduced.
    evidence:
    - reference: PMID:36140676
      reference_title: SPACR Encoded by IMPG1 Is Essential for Photoreceptor Survival by Interplaying between the Interphotoreceptor Matrix and the Retinal Pigment Epithelium.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "SD-OCT of Impg1-/- mice shows a degeneration of the photoreceptor layer"
      explanation: Outer retinal degeneration in the knockout.
- name: Impg1 knockout mouse (Salido 2020)
  species: Mouse
  genotype: Impg1-/- (global knockout)
  publication: PMID:32265257
  description: >-
    Independent global Impg1 knockout, examined up to 8 months: IMPG1 absent,
    chondroitin sulfate and PNA lectin staining lost from the outer-segment
    matrix, but no structural or ERG deficit and no subretinal lesions.
  evidence:
  - reference: PMID:32265257
    reference_title: Proteoglycan IMPG2 Shapes the Interphotoreceptor Matrix and Modulates Vision.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "No evident morphologic or functional deficits were found in mice lacking IMPG1."
    explanation: Reports no degeneration phenotype in this knockout line.
  modeled_mechanisms:
  - target: Interphotoreceptor Matrix Disorganization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Loss of chondroitin sulfate and cone PNA staining from the outer-segment matrix.
    limitations: Composition change only; no vacuolation or structural disorganization reported at the ages examined.
    evidence:
    - reference: PMID:32265257
      reference_title: Proteoglycan IMPG2 Shapes the Interphotoreceptor Matrix and Modulates Vision.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, the cone-specific marker PNA disappeared around the OS in the absence of IMPG1"
      explanation: Matrix composition changes without IMPG1.
  - target: Photoreceptor Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: No ERG or morphological deficit up to 8 months of age.
    limitations: >-
      Phenotyping stopped at 8 months, before the 9-month onset reported in the
      other Impg1 knockout line, and no fundus imaging was done, so a late
      phenotype was not excluded.
    evidence:
    - reference: PMID:32265257
      reference_title: Proteoglycan IMPG2 Shapes the Interphotoreceptor Matrix and Modulates Vision.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In 8-month-old animals, the ERG response from IMPG1 KO animals was identical to that from the wild-type littermate controls."
      explanation: Normal ERG at 8 months in this knockout line.
- name: impg1 morpholino knockdown medaka
  species: Medaka
  genotype: impg1 morpholino knockdown
  publication: PMID:32817297
  description: >-
    Transient morpholino ablation of impg1 (and, separately, impg2) in medaka
    embryos shortened rod and cone outer segments.
  evidence:
  - reference: PMID:32817297
    reference_title: Pathogenic variants in IMPG1 cause autosomal dominant and autosomal recessive retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using morpholino-mediated ablation of Impg1 and its paralog Impg2 in medaka fish, we confirmed a phenotype consistent with that observed in the families, including a decreased length of rod and cone photoreceptor outer segments."
    explanation: Outer-segment shortening after impg1 knockdown in fish.
  modeled_mechanisms:
  - target: Photoreceptor Outer Segment Disorganization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Shortened rod and cone outer segments in embryonic retina.
    limitations: >-
      Transient knockdown in developing fish retina reports outer-segment
      length only; it does not model the adult-onset course or the subretinal
      deposits.
discussions:
- discussion_id: impg1_mouse_knockout_discordance
  prompt: >-
    Do Impg1 knockout mice model the human recessive disease, given that one
    line shows no deficit up to 8 months and the other degenerates only from 9
    months, with deposits spread across a retina that has no macula?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Photoreceptor Degeneration
  - pathophysiology#Subretinal Autofluorescent Material Accumulation
  - animal_models#Mouse
  rationale: >-
    The two knockout lines disagree. The later line attributes the difference
    to age at phenotyping and to the absence of fundus imaging in the earlier
    study, but this has not been tested by examining both lines side by side at
    the same age. The mouse also lacks a cone-rich macula, so the central
    location of the human vitelliform lesion cannot be reproduced, and
    whether the mouse degeneration corresponds to the vitelliform or the
    retinitis pigmentosa presentation is unclear.
  evidence:
  - reference: PMID:36140676
    reference_title: SPACR Encoded by IMPG1 Is Essential for Photoreceptor Survival by Interplaying between the Interphotoreceptor Matrix and the Retinal Pigment Epithelium.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Surprisingly, Salido et al. generated Impg1−/−, Impg2−/−, and double mutant mice and found no evidence of morphological or functional deficits in the Impg1−/− model and only small deficits in the double mutant mice"
    explanation: The later knockout study acknowledges the discordant earlier result.
  proposed_experiments:
  - experiment_id: impg1_ko_matched_age_phenotyping
    name: Matched-age phenotyping of both Impg1 knockout lines
    description: >-
      Phenotype both knockout lines on the same background beyond 12 months
      with fundus autofluorescence, SD-OCT and ERG to test whether the
      discordance is due to age at examination.
    would_support:
    - pathophysiology#Photoreceptor Degeneration
- discussion_id: impg1_recessive_rp_versus_vmd
  prompt: >-
    What determines whether biallelic IMPG1 loss of function presents as
    vitelliform macular dystrophy or as retinitis pigmentosa?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - has_subtypes#Recessive VMD
  - has_subtypes#Recessive RP
  rationale: >-
    ClinGen lumps the two presentations on the basis of a shared mechanism and
    treats them as a spectrum, but only about seven biallelic probands have
    been scored and no genotype-phenotype rule separating them has been
    described. Whether residual function of hypomorphic or leaky splice
    alleles, the position of variants in the SEA or EGF-like domains, or
    modifier loci such as IMPG2 decides the presentation is not known.
  evidence:
  - reference: CGGV:assertion_d638e88c-feaa-4d84-a4e7-9b83481bfb0c-2023-09-07T160000.000Z
    reference_title: "IMPG1 / IMPG1-related recessive retinopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The phenotypic variability between them appears to represent a spectrum of disease rather than separate disease entities."
    explanation: >-
      ClinGen treats the RP and VMD presentations as one spectrum without
      stating what determines which develops.
references:
- reference: CGGV:assertion_d638e88c-feaa-4d84-a4e7-9b83481bfb0c-2023-09-07T160000.000Z
  title: IMPG1 / IMPG1-related recessive retinopathy (Definitive)

      photoreceptors, the cells whose matrix is affected.
  - reference: PMID:32265257
    reference_title: Proteoglycan IMPG2 Shapes the Interphotoreceptor Matrix and Modulates Vision.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In normal retina, IMPG1 and IMPG2 occupy distinct IPM compartments, represent the main source of chondroitin sulfate and are fundamental for the constitution of the cone-specific glycocalyx stained by the PNA (peanut agglutinin) lectin marker."
    explanation: >-
      Knockout mice show that IMPG1 is a main source of IPM chondroitin
      sulfate and is needed for the cone glycocalyx.
  - reference: PMID:32265257
    reference_title: Proteoglycan IMPG2 Shapes the Interphotoreceptor Matrix and Modulates Vision.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, the cone-specific marker PNA disappeared around the OS in the absence of IMPG1"
    explanation: >-
      Loss of IMPG1 alone changes the composition of the outer-segment matrix
      even in young mice without degeneration.
  - reference: PMID:29777959
    reference_title: Extracellular matrix component expression in human pluripotent stem cell-derived retinal organoids recapitulates retinogenesis in vivo and reveals an important role for IMPG1 and CD44 in the development of photoreceptors and interphotoreceptor matrix.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Blocking the action of CD44 and IMPG1 in pluripotent stem cell derived retinal organoids affected the development of photoreceptors, their inner/outer segments and connecting cilia and disrupted IPM formation, with IMPG1 having an earlier and more significant impact."
    explanation: >-
      Antibody blockade of IMPG1 in human retinal organoids disrupted IPM
      formation, supporting a role for IMPG1 in building the human matrix.
  downstream:
  - target: Photoreceptor Outer Segment Disorganization
    causal_link_type: DIRECT
    description: >-
      The matrix holds outer segments in alignment; when it is disorganized the
      outer segments lose their alignment and are shortened.
    evidence:
    - reference: PMID:36140676
      reference_title: SPACR Encoded by IMPG1 Is Essential for Photoreceptor Survival by Interplaying between the Interphotoreceptor Matrix and the Retinal Pigment Epithelium.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Alcian Blue staining of the IPM glycosaminoglycans showed that the photoreceptors of the Impg1−/− mice were disorganized with the loss of alignment of the photoreceptor OS."
      explanation: >-
        Staining of the IPM in knockout mice shows disorganized photoreceptors
        and loss of outer-segment alignment.
  - target: Apical Retinal Pigment Epithelium Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The authors of the knockout study propose that the disorganized matrix
      impairs the RPE, possibly by weakening outer-segment recognition and
      attachment before phagocytosis. This step is a stated hypothesis.
    evidence:
    - reference: PMID:36140676
      reference_title: SPACR Encoded by IMPG1 Is Essential for Photoreceptor Survival by Interplaying between the Interphotoreceptor Matrix and the Retinal Pigment Epithelium.

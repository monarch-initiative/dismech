    snippet: "The mechanism of pathogenicity appears to be biallelic loss of IMPG1 function conferred by null and/or hypomorphic variants."
    explanation: >-
      The ClinGen Retina GCEP summary, scored over seven biallelic probands,
      identifies biallelic loss of function as the disease mechanism.
  - reference: PMID:23993198
    reference_title: Mutations in IMPG1 cause vitelliform macular dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "According to this hypothesis, null mutations would lead to a full phenotype only in homozygous or compound heterozygous states."
    explanation: >-
      The founding study notes that in both recessive families at least one
      allele was a nonsense or presumed frameshift allele, consistent with
      recessive disease from loss of SPACR.
  - reference: PMID:28644393
    reference_title: "Mutations in the Genes for Interphotoreceptor Matrix Proteoglycans, IMPG1 and IMPG2, in Patients with Vitelliform Macular Lesions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The latter induced partial skipping of exon 7 of IMPG1 in an in vitro splicing assay."
    explanation: >-
      A minigene splicing assay showed that the homozygous c.807+5G>A variant
      found in a recessive VMD patient causes exon 7 skipping, a loss-of-function
      splicing defect.
  downstream:
  - target: Interphotoreceptor Matrix Disorganization
    causal_link_type: DIRECT
    description: >-
      Without SPACR, a main chondroitin sulfate proteoglycan of the IPM, the
      matrix around rod and cone outer segments is not assembled normally.
    evidence:
    - reference: PMID:36140676
      reference_title: SPACR Encoded by IMPG1 Is Essential for Photoreceptor Survival by Interplaying between the Interphotoreceptor Matrix and the Retinal Pigment Epithelium.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "transmission electron microscopy shows a disruption of the IPM and the retinal pigment epithelial cells"
      explanation: >-
        In Impg1 knockout mice, complete absence of SPACR disrupts the IPM on
        electron microscopy.
- name: Interphotoreceptor Matrix Disorganization
  description: >-
    SPACR is made by rod and cone photoreceptors and, with SPACRCAN (IMPG2),
    supplies most of the chondroitin sulfate of the interphotoreceptor matrix
    and the cone-specific glycocalyx. Loss of SPACR removes chondroitin sulfate
    and cone-associated PNA lectin staining from the outer-segment compartment
    of the matrix, and in older knockout mice the matrix becomes vacuolated and
    disorganized.

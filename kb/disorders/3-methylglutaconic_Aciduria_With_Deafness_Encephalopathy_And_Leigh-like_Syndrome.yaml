  - name: c.91+6T>C
    description: Homozygous noncanonical splice variant segregating in a large Iraqi family with variable complicated spastic paraplegia. Patient-cell RNA analysis showed abnormal splicing and preserved overall transcript levels; full-length protein was absent. Milder PG changes could reflect residual function or compensation, but neither explanation was proven.
    functional_effects:
    - function: SERAC1 phosphatidylglycerol remodeling activity
      description: Loss of the full-length protein with a milder phosphatidylglycerol remodeling defect than classic infantile alleles.

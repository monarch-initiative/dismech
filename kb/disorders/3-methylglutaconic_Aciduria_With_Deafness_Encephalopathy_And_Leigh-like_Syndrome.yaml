differential_diagnoses:
- name: Primary 3-methylglutaconic aciduria (AUH deficiency)
  description: AUH deficiency causes primary 3-methylglutaconic aciduria through defective leucine catabolism. MEGDEL is classified among secondary acidurias associated with phospholipid remodeling.
  evidence:
  - reference: PMID:23296368
    reference_title: 'Inborn errors of metabolism with 3-methylglutaconic aciduria as discriminative feature: proper classification and nomenclature.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: '"primary 3-methylglutaconic aciduria" formerly known as type I (3-methylglutaconyl-CoA hydratase deficiency, AUH defect) due to defective leucine catabolism'
    explanation: Names the primary disorder and the pathway that distinguishes it from the secondary group MEGDEL belongs to.
    quote_role: REVIEW_SYNTHESIS
- name: Other secondary 3-methylglutaconic acidurias
  description: Barth syndrome, Costeff syndrome, DNAJC19-related DCMA, and TMEM70-, CLPB- or TIMM50-related disorders can share secondary 3-methylglutaconic aciduria. Clinical patterns and molecular testing distinguish them.
  evidence:
  - reference: PMID:30114719
    reference_title: 'HTRA2 Defect: A Recognizable Inborn Error of Metabolism with 3-Methylglutaconic Aciduria as Discriminating Feature Characterized by Neonatal Movement Disorder and Epilepsy-Report of 11 Patients.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: due to defective phospholipid remodeling or mitochondrial membrane-associated disorders (mutations in TAZ, SERAC1, OPA3, CLPB, DNAJC19, TMEM70, TIMM50)
    explanation: Enumerates the group MEGDEL is differentiated within, including SERAC1 itself.
    quote_role: BACKGROUND
- name: ATAD3A-related Harel-Yoon syndrome
  description: GeneReviews includes ATAD3A-related Harel-Yoon syndrome in the genetic differential. Developmental delay, hypotonia and optic atrophy overlap with MEGDEL; axonal neuropathy and hypertrophic cardiomyopathy are additional features of the ATAD3A-related spectrum.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK195853/
    reference_title: SERAC1 Deficiency - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Global DD, hypotonia, optic atrophy, axonal neuropathy, hypertrophic cardiomyopathy
    explanation: The ATAD3A/Harel-Yoon row of GeneReviews Table 4 lists these findings in the genetic differential; the quote is the complete features cell.
- name: HTRA2 defect
  description: HTRA2-related disease can resemble severe neonatal MEGDEL through movement abnormalities, seizures and 3-methylglutaconic aciduria. Central hypopnea/apnea and neutropenia were prominent in the 11-person HTRA2 series, in which death occurred within the first month. This is one differential, not an established uniquely closest diagnosis.
  evidence:
  - reference: PMID:30114719
    reference_title: 'HTRA2 Defect: A Recognizable Inborn Error of Metabolism with 3-Methylglutaconic Aciduria as Discriminating Feature Characterized by Neonatal Movement Disorder and Epilepsy-Report of 11 Patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hallmark features were central hypopnea/apnea leading to respiratory insufficiency, seizures, neutropenia, 3-MGA-uria, tonus dysregulation, and dysphagia
    explanation: Gives the feature set that separates HTRA2 defect from MEGDEL despite the shared aciduria.
    directness: INDIRECT

    explanation: Segregation in one family shows the homozygous proband affected and heterozygous carriers unaffected.
has_subtypes:
- name: Infantile MEGDHEL
  display_name: Severe infantile MEGD(H)EL
  description: The classic presentation may begin with neonatal hypoglycemia, sepsis-like illness or liver dysfunction, followed by infantile hypotonia and developmental delay, and progressive dystonia, spasticity and hearing loss. Severe disability is common, but neonatal involvement and early death are not obligatory.
  evidence:
  - reference: PMID:24741715
    reference_title: SERAC1 Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: MEGD(H)EL syndrome is characterized by neonatal hypoglycemia, a sepsis-like clinical picture for which no infectious agent can be found, feeding problems, poor weight gain, muscular hypotonia, developmental delay, and liver involvement.
    explanation: Summarizes the classic infantile presentation.
    quote_role: REVIEW_SYNTHESIS
- name: Juvenile cHSP
  display_name: Juvenile-onset complicated hereditary spastic paraplegia
  description: A later-onset presentation with complicated spastic paraplegia and variable cognitive or other neurological involvement. In one large family, three affected siblings remained independently ambulant into adolescence or adulthood; a tested fibroblast line had a milder PG abnormality despite loss of full-length SERAC1. Residual activity was proposed, not demonstrated.
  evidence:
  - reference: PMID:28916646
    reference_title: 'SERAC1 deficiency causes complicated HSP: evidence from a novel splice mutation in a large family.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Three subjects presented with juvenile-onset oligosystemic cHSP, still able to walk several miles at age >10-20 years
    explanation: Defines the juvenile complicated-HSP presentation of SERAC1 deficiency.
- name: Adult dystonia
  display_name: Juvenile- or adult-onset generalized dystonia
  description: Later-onset generalized dystonia, sometimes with parkinsonian or pyramidal signs, occurs at the milder end of the spectrum. Cognitive or developmental difficulties may precede the movement disorder; individual reports vary in the strength of their molecular confirmation.
  evidence:
  - reference: PMID:37711114
    reference_title: SERAC1 Deficiency- A New Phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A 30-year-old patient with a moderate intellectual disability, developed, since the age of 25, a progressive loss of previous capacities
    explanation: Documents the adult-onset end of the SERAC1 deficiency spectrum.
  - reference: PMID:29686941
    reference_title: Adult-onset Generalized Dystonia as the Main Manifestation of MEGDEL Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At 24 years old, he had a few episodes of subacute encephalopathy triggered by fever and then developed cervical dystonia. Dystonia gradually worsened to become generalized dystonia.
    explanation: A longitudinal adult case broadens the age-at-onset spectrum.

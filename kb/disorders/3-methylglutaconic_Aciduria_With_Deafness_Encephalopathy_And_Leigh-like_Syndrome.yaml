progression:
- phase: Neonatal metabolic and hepatic crisis
  notes: Some infants present in the first days of life with hypoglycemia, sepsis-like illness, hepatic dysfunction and metabolic abnormalities. Severe liver failure or multiorgan failure can be fatal, but neonatal disease is variable and liver abnormalities often improve.
  evidence:
  - reference: PMID:34751152
    reference_title: Severe neonatal MEGDHEL syndrome with a homozygous truncating mutation in SERAC1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the diagnostic work-up of a newborn infant with a metabolic crisis, lethal multiorgan
      failure on day six of life, and increased excretion of 3-methylglutaconic acid, we found using
      whole genome sequencing a homozygous SERAC1 mutation indicating MEGDHEL syndrome
      (3-methylglutaconic aciduria with deafness-dystonia, hepatopathy, encephalopathy, and
      Leigh-like syndrome).
    explanation: >-
      Restores the homozygous SERAC1/MEGDHEL diagnosis of the neonate with lethal metabolic crisis.
      The selected clinical sentence does not supply every biochemical detail or demonstrate an
      intervention window.
- phase: Chronic progressive neurodegeneration
  notes: Infantile sensorineural deafness and truncal hypotonia, then severe psychomotor delay and regression, then progressive spasticity and dystonia with staged basal-ganglia degeneration.
  evidence:
  - reference: PMID:24741715
    reference_title: SERAC1 Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: By age two years, spasticity, dystonia, epilepsy, and progressive deafness prevent further psychomotor development and/or result in loss of acquired skills.
    explanation: Summarizes progression in the severe infantile phenotype.
    quote_role: REVIEW_SYNTHESIS
- phase: Milder later-onset course
  notes: Later-onset complicated spastic paraplegia or dystonia can progress more slowly. Some children improve developmental skills; variant class alone does not establish the trajectory.
  evidence:
  - reference: PMID:35781780
    reference_title: Hepatic histologic findings in a case of MEGDHEL syndrome due to SERAC1 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: her verbal and motor development has progressively improved and now, at 4 years of age, she has only speech and mild gross motor delays
    explanation: Records improvement rather than relentless regression in a mild case.
- phase: Variable survival
  notes: Survival cannot be summarized as inevitable early death. In the 67-person historical cohort, 16 individuals died at a median age of nine years; the cohort included survivors into adulthood. These are cohort observations, not a current population survival estimate.
  evidence:
  - reference: PMID:29205472
    reference_title: 'Progressive deafness-dystonia due to SERAC1 mutations: A study of 67 cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sixteen individuals passed away at a median age of 9 years (range = 5 days–16 years
    explanation: Reports deaths with their observed age distribution.
  - reference: PMID:29205472
    reference_title: 'Progressive deafness-dystonia due to SERAC1 mutations: A study of 67 cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Despite the severity of neurological impairment, most affected individuals survive into adulthood.
    explanation: The cohort discussion explicitly counters a universal early-lethal description.

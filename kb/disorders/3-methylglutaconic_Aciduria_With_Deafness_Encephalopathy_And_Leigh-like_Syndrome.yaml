biochemical:
- name: Phosphatidylglycerol 34:1 to 36:1 ratio
  notes: >-
    The disease-specific cellular biomarker, measured by lipidomics in
    cultured fibroblasts. The ratio is raised because PG-34:1 accumulates
    while PG-36:1 falls, and it is partially corrected by complementation with
    wild-type SERAC1. Milder alleles produce a milder shift.
  presence: INCREASED
  readouts:
  - target: Impaired Phosphatidylglycerol Remodeling
    relationship: READOUT_OF
    direction: POSITIVE
    interpretation: A raised PG34:1/PG36:1 ratio is the direct cellular measurement
      of the remodeling defect.
    evidence:
    - reference: PMID:22683713
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Complementation of patient fibroblasts with wild-type human SERAC1 by
        lentiviral infection led to a decrease and partial normalization of the mean
        ratio of phosphatidylglycerol-34:1 to phosphatidylglycerol-36:1
      explanation: Rescue of the ratio by wild-type protein ties the measurement to
        the mechanism.
  evidence:
  - reference: PMID:28916646
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'biomarker investigations (3-methyl-glutaconic acid, filipin staining
      and phosphatidylglycerols PG34:1/PG36:1)'
    explanation: Uses the ratio as a diagnostic biomarker in a clinical family study.
  - reference: PMID:28916646
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'These phosphatidylglycerol changes, however, were milder than in classic
      infantile-onset SERAC1 cases, which might partially explain the milder SERAC1
      phenotype'
    explanation: Links the magnitude of the biomarker shift to clinical severity.
- name: Urinary 3-methylglutaconic and 3-methylglutaric acid
  notes: >-
    Persistently elevated organic acids on urine GC/MS, the biochemical entry
    point to the diagnosis. Elevation is secondary to mitochondrial
    dysfunction rather than to a leucine catabolic block.
  presence: INCREASED
  readouts:
  - target: Secondary 3-Methylglutaconic Aciduria and Lactic Acidosis
    relationship: READOUT_OF
    direction: POSITIVE
    interpretation: Urine organic acid analysis is the standard assay reporting on
      this node.
    evidence:
    - reference: PMID:30114719
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Urinary organic acid analysis is a noninvasive and inexpensive test
        that can guide further genetic testing
      explanation: Establishes urine organic acids as the diagnostic readout.
  evidence:
  - reference: PMID:35223715
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The excretion of 3-methylglutaconic acid was found to be increased in
      our GC/MS analysis
    explanation: Reports the measurement in a confirmed patient.
- name: Free cholesterol accumulation on filipin staining
  notes: >-
    Abnormal, unevenly distributed unesterified cholesterol in patient
    fibroblasts, the cellular readout of the BMP deficit.
  presence: INCREASED
  readouts:
  - target: Bis(monoacylglycerol)phosphate Depletion and Free Cholesterol Accumulation
    relationship: READOUT_OF
    direction: POSITIVE
    interpretation: Filipin staining is the standard histochemical assay for the free
      cholesterol accumulation at this node.
    evidence:
    - reference: PMID:34751152
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Filipin staining showed uneven localization of unesterified cholesterol
      explanation: Reports the filipin assay result directly.
  evidence:
  - reference: PMID:22683713
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: leading to the accumulation of free cholesterol, as shown by abnormal
      filipin staining
    explanation: Original description of the filipin abnormality in patient cells.
histopathology:
- name: Mitochondrial hepatopathy with abnormal circular cristae
  description: >-
    Liver biopsy shows hepatocytes with granular cytoplasm and fine

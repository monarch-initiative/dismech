    explanation: GeneReviews recommends coordinated supportive care.
    quote_role: REVIEW_SYNTHESIS
- name: Neonatal Metabolic Crisis Management
  description: Urgent specialist management addresses hypoglycemia, hyperammonemia, coagulopathy and other organ dysfunction. In one severe neonatal case initially managed as a suspected urea-cycle disorder, protein was temporarily withheld, intravenous glucose and ammonia-lowering therapies were given, and continuous dialysis controlled ammonia. This empiric crisis regimen is not a disease-specific treatment protocol.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Hemodialysis
    term:
      id: NCIT:C15248
      label: Hemodialysis
  target_mechanisms:
  - target: Hyperammonemia
    description: Continuous hemodialysis removes ammonia during the hepatic crisis.
    evidence:
    - reference: PMID:38445077
      reference_title: 'Distinct neonatal hyperammonemia and liver synthesis dysfunction: case report of a severe MEGDHEL syndrome.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Due to high ammonia level, continuous hemodialysis was established immediately after admission
      explanation: Reports hemodialysis used specifically to control hyperammonemia.
  evidence:
  - reference: PMID:38445077
    reference_title: 'Distinct neonatal hyperammonemia and liver synthesis dysfunction: case report of a severe MEGDHEL syndrome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In addition, protein intake was stopped, and the patient anabolized with intravenous glucose. Temporary stabilization could be achieved after four days
    explanation: Describes the metabolic crisis protocol and its partial effect.
  notes: Stabilization in the reported case was temporary and the infant died of subsequent neurological and cardiocirculatory complications, so this is crisis management rather than a treatment that alters outcome.
- name: Individualized Hearing Rehabilitation
  description: Hearing aids and cochlear implants have been used, but expected benefit should be discussed with audiology and the family. In a 36-person retrospective hearing study, 22 received hearing aids and six subsequently received implants; only one implanted individual acquired spoken language, which became less clear with progression. Improved environmental interaction can still be meaningful. The auditory lesion is not consistently localized.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cochlear device implantation

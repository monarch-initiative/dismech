- name: Lpgat1 knockout mouse
  species: Mouse
  genotype: Lpgat1-/-
  publication: PMID:37917582
  description: A parallel phospholipid-remodeling model, not a SERAC1 genotype model. Lpgat1 deletion produces altered PG species, mitochondrial defects, aciduria, hearing impairment, hepatopathy and cardiomyopathy. It motivates a candidate pathway but does not establish LPGAT1 as a human MEGDEL gene.
  modeled_mechanisms:
  - target: Impaired Phosphatidylglycerol Remodeling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: LPGAT1-deficient cells and mice connect PG remodeling and mitochondrial PG transport, with a PG34:1/PG36:1 shift resembling SERAC1 deficiency.
    limitations: The perturbed gene is LPGAT1. Cardiomyopathy and mortality in these mice cannot be generalized to human SERAC1 disease. Precise PHB/TIM lipid-transfer activity remains unresolved.

    - reference: PMID:28916646
      reference_title: 'SERAC1 deficiency causes complicated HSP: evidence from a novel splice mutation in a large family.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: These phosphatidylglycerol changes, however, were milder than in classic infantile-onset SERAC1 cases, which might partially explain the milder SERAC1 phenotype
      explanation: A milder lipid abnormality in one tested family line is associated with the clinical phenotype; the mechanism remains uncertain.
  - name: Deletion of exons 2-4
    description: Multi-exon deletion allele, in trans with c.1601A>T (p.His534Leu), in a child whose development improved beyond clinical expectation.
    functional_effects:
    - function: SERAC1 phosphatidylglycerol remodeling activity
      description: Predicted loss of function from a multiexon deletion; the abstract classifies the allele as pathogenic without measuring protein abundance.
    evidence:
    - reference: PMID:35781780
      reference_title: Hepatic histologic findings in a case of MEGDHEL syndrome due to SERAC1 deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'biallelic novel SERAC1 mutations: (1) deletion of (at least) exons 2-4, pathogenic; and (2) c.1601A>T (p.H534L), likely pathogenic'
      explanation: Reports the structural allele and its pathogenicity assignment.
  notes: SERAC1 encodes a protein involved in phosphatidylglycerol remodeling and mitochondrial physiology. Disease-associated variants include truncating, splice, missense and multiexon deletion alleles. The effect on RNA, protein abundance and cellular function depends on the allele and has not been measured for every reported variant. A general genotype-phenotype correlation has not been established. LPGAT1-deficient mice reproduce several overlapping findings, but this does not establish LPGAT1 as a human MEGDEL gene.

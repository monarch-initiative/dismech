  - phenotypes#Infantile hepatopathy
  - phenotypes#3-Methylglutaconic aciduria
  rationale: The canine paper establishes a movement disorder and neuropathological overlap. Hearing and cognition were unassessed; liver and organic-acid measures were not reported. Direct phenotyping is needed before using this model for those disease manifestations. Normal findings would limit those particular model outcomes, not refute human disease mechanisms.
  evidence:

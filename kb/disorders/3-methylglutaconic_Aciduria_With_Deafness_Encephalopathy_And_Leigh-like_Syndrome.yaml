notes: This entry includes the infantile MEGD(H)EL, juvenile complicated spastic paraplegia and adult dystonia presentations within the SERAC1-deficiency spectrum. Their differences cannot be reduced to a proven residual-protein gradient. Frequencies from the 67-person retrospective cohort retain feature-specific denominators and are not population estimates; some newly described mild cases were not part of that cohort. The adult p.Arg411Cys case and its DBS follow-up retain a VUS limitation. No cochlear cell type is assigned because audiometry has not established a uniform anatomical lesion. The frequently quoted 0.09 per 100,000 estimate derives from genetic lifetime-risk modeling, not observed point prevalence; the model assumes Hardy-Weinberg equilibrium and fully penetrant biallelic variants. The full 2026 GeneReviews chapter and available primary full texts informed this review; several mechanistic papers remain accessible here only as abstracts.

      explanation: Records sensorineural hearing loss as a defining component.
- name: Hepatocellular Mitochondrial Injury
  biological_scale: TISSUE
  description: >-
    Mitochondrial hepatopathy with hepatocytes showing granular cytoplasm and
    fine intracytoplasmic lipid droplets, and abnormal circular mitochondrial
    cristae on electron microscopy. Clinically this ranges from persistently
    elevated transaminases to fulminant neonatal liver failure - which,
    distinctively, may occur without any transaminase elevation or
    cholestasis.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:35781780
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hepatocytes showed granular cytoplasm and fine intracytoplasmic lipid

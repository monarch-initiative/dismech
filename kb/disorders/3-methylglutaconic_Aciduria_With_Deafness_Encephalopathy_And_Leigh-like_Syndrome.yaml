progression:
- phase: Neonatal metabolic and hepatic crisis
  notes: >-
    Presentation in the first days of life with lactic acidosis, hepatopathy
    and, in the most severe cases, hyperammonemia and hypoglycemia without
    transaminase elevation or cholestasis. This is the critical intervention
    window and can be lethal within days.
  evidence:
  - reference: PMID:34751152
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a newborn infant with a metabolic crisis, lethal multiorgan failure on
      day six of life, and increased excretion of 3-methylglutaconic acid
    explanation: Documents the lethal neonatal crisis phase.
- phase: Chronic progressive neurodegeneration
  notes: >-
    Infantile sensorineural deafness and truncal hypotonia, then severe
    psychomotor delay and regression, then progressive spasticity and dystonia
    with staged basal-ganglia degeneration.
  evidence:
  - reference: PMID:25642805
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: severe developmental delay, and progressive spasticity
    explanation: Describes the chronic progressive neurological course.
- phase: Milder later-onset course
  notes: >-
    In patients with hypomorphic alleles the disease may present only in
    adolescence or adulthood as complicated spastic paraplegia or dystonia,
    and some children exceed expectations and partially improve.
  evidence:
  - reference: PMID:35781780
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: her verbal and motor development has progressively improved and now, at
      4 years of age, she has only speech and mild gross motor delays
    explanation: Records improvement rather than relentless regression in a mild case.

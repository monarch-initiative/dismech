      explanation: Reports the nonsense allele and its association with the severe end of the spectrum.
  - name: rs797045105 insertion
    description: Homozygous frameshift insertion identified by exome sequencing in an Iranian proband, heterozygous in both unaffected parents.
    functional_effects:
    - function: SERAC1 phosphatidylglycerol remodeling activity

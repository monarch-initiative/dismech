discussions:
- discussion_id: serac1_pathway_relationship
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How do SERAC1-dependent lipid remodeling and serine transport contribute to human disease?
  attaches_to:
  - pathophysiology#Impaired Phosphatidylglycerol Remodeling
  - mechanistic_hypotheses#serine_transport_mtdna
  rationale: Patient fibroblast lipid rescue and experimental serine/nucleotide rescue support complementary roles. ER-mitochondria contact-site and outer-membrane localization are not mutually exclusive. Their relationship and tissue-specific contributions remain uncertain; normal clinical mtDNA or respiratory assays do not exclude disease.
  evidence:
  - reference: PMID:22683713
    reference_title: Mutations in the phospholipid remodeling gene SERAC1 impair mitochondrial function and intracellular cholesterol trafficking and cause dystonia and deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Complementation of patient fibroblasts with wild-type human SERAC1 by lentiviral infection led to a decrease and partial normalization of the mean ratio of phosphatidylglycerol-34:1 to phosphatidylglycerol-36:1
    explanation: Wild-type complementation partially rescues the patient-cell lipid ratio.
  - reference: PMID:35235340
    reference_title: SERAC1 is a component of the mitochondrial serine transporter complex required for the maintenance of mitochondrial DNA.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: By interacting with the mitochondrial serine transporter protein SFXN1, SERAC1 facilitated and was required for SFXN1-mediated serine transport from the cytosol to the mitochondria
    explanation: The experimental study identifies SERAC1-dependent SFXN1 transport.
  - reference: PMID:35235340
    reference_title: SERAC1 is a component of the mitochondrial serine transporter complex required for the maintenance of mitochondrial DNA.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: both in vitro and in vivo supplementation of nucleosides/nucleotides restored mtDNA content and mitochondrial function
    explanation: Preclinical rescue supports nucleotide limitation in the experimental systems.
- discussion_id: canine_model_organ_coverage
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Which auditory, hepatic and biochemical features are reproduced in SERAC1-associated canine degeneration?
  attaches_to:

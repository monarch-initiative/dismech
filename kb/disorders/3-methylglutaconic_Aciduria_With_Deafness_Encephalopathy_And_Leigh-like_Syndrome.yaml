mechanistic_hypotheses:
- hypothesis_group_id: serine_transport_mtdna
  hypothesis_label: SERAC1 as an outer-membrane partner of the serine transporter SFXN1
  status: EMERGING
  description: >-
    An alternative model in which SERAC1 acts not as a phospholipid remodeling
    enzyme at the ER-mitochondria contact site but on the outer mitochondrial
    membrane, as a required partner of the mitochondrial serine transporter
    SFXN1. On this model the primary defect is a failure of serine import that
    starves the one-carbon cycle, unbalances the nucleotide pool and depletes
    mitochondrial DNA, making MEGD(H)EL a mtDNA depletion syndrome. The two
    models differ in the subcellular location they assign to SERAC1 and have
    not been reconciled; the therapeutic implication of the second, that
    nucleoside supplementation might help, does not follow from the first.
  evidence:
  - reference: PMID:35235340
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We found that SERAC1 localizes to the outer mitochondrial membrane and
      is a protein component of the one-carbon cycle
    explanation: States the alternative localization and function on which this hypothesis
      rests.
  - reference: PMID:22683713
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: We localized SERAC1 at the interface between the mitochondria and the
      endoplasmic reticulum in the mitochondria-associated membrane fraction that is
      essential for phospholipid exchange
    explanation: The original localization study places SERAC1 at the contact site
      rather than the outer mitochondrial membrane.
animal_models:
- name: Serac1 knockout mouse
  species: Mouse
  genotype: Serac1-/-
  publication: PMID:35235340
  description: >-
    A germline Serac1 null mouse reported to reproduce the major diagnostic
    clinical and biochemical features of MEGD(H)EL, and used to establish the
    serine-transport and mtDNA-depletion route and to show rescue by
    nucleoside supplementation.
  modeled_mechanisms:
  - target: Impaired Mitochondrial Serine Import and mtDNA Depletion
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: The mouse reproduces mtDNA depletion and the biochemical diagnostic
      phenotype, and nucleoside supplementation restores mtDNA content.
    limitations: >-
      The paper does not report whether the mouse reproduces the
      phosphatidylglycerol remodeling defect, the cholesterol trafficking
      abnormality or the staged basal-ganglia lesion, and its localization of
      SERAC1 to the outer mitochondrial membrane conflicts with the
      contact-site localization reported in patient cells.
    readouts:
    - name: Mitochondrial DNA content
      target: Impaired Mitochondrial Serine Import and mtDNA Depletion
      direction: DECREASED
      interpretation: mtDNA copy number is the primary molecular readout of this node
        in the model.
      evidence:
      - reference: PMID:35235340
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: which led to primary mitochondrial DNA (mtDNA) depletion in mice,
          HEK293T cells, and patient-derived immortalized lymphocyte cells
        explanation: Reports the mtDNA measurement in the knockout mouse and in patient-derived
          cells.
    - name: Mitochondrial DNA content after nucleoside supplementation
      target: Impaired Mitochondrial Serine Import and mtDNA Depletion
      direction: RESTORED
      interpretation: Restoration on supplementation shows the depletion is reversible
        and nucleotide-limited.
      evidence:
      - reference: PMID:35235340
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: both in vitro and in vivo supplementation of nucleosides/nucleotides
          restored mtDNA content and mitochondrial function
        explanation: Reports the rescue arm of the experiment.
    evidence:
    - reference: PMID:35235340
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: we generated Serac1-/- mice that mimic the major diagnostic clinical
        and biochemical phenotypes of the MEGD(H)EL syndrome
      explanation: States that the model reproduces the diagnostic phenotype, which
        is what makes it informative for this node.
- name: Canine multiple system degeneration
  species: Dog
  genotype: SERAC1 exon 15 nonsense (Kerry Blue Terrier) or exon 4 acceptor splice
    site 4 bp deletion (Chinese Crested)
  publication: PMID:39596578
  description: >-
    A naturally occurring, autosomal recessive SERAC1 movement disorder of
    Kerry Blue Terriers and Chinese Crested dogs, with complete
    genotype-phenotype concordance in large cohorts and in cross-bred compound
    heterozygotes.
  modeled_mechanisms:
  - target: Basal Ganglia Neurodegeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Affected dogs lose neurons from the putamen and caudate nucleus, the
      same striatal targets damaged in human MEGDEL, and develop a progressive
      movement disorder.
    limitations: >-
      The canine lesion extends beyond the human one, with Purkinje cell loss
      in the cerebellum and substantia nigra degeneration that are not
      features of MEGDEL, and the presentation is cerebellar ataxia and tremor
      rather than dystonia. Deafness, hepatopathy and 3-methylglutaconic
      aciduria are not documented in the dogs.
    readouts:
    - name: Neuronal loss in putamen and caudate nucleus
      target: Basal Ganglia Neurodegeneration
      direction: DECREASED
      interpretation: Post-mortem neuronal counts in the striatum are the histological
        correlate of the human basal-ganglia node.
      evidence:
      - reference: PMID:39596578
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Postmortem examination of the brains revealed Purkinje cell loss in
          the cerebellum and neuronal loss from the substantia nigra, putamen, and
          caudate nucleus
        explanation: Reports the striatal neuronal loss, and simultaneously the extra
          cerebellar and nigral involvement recorded as a limitation.
    evidence:
    - reference: PMID:39596578
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Variants in human SERAC1 are associated with disorders with a range
        of ages of disease onset and patterns of clinical signs, but that are all characterized
        by movement abnormalities similar to those of the dogs with CMSD
      explanation: The authors' own statement of why the canine disease is informative
        for the human movement disorder.
  evidence:
  - reference: PMID:39596578
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Genotyping of large cohorts of Kerry Blue Terriers and Chinese Crested
      dogs for the respective breed-specific SERAC1 variants showed complete concordance
      between genotype and disease phenotype
    explanation: Establishes that the canine phenotype is caused by the SERAC1 variants.

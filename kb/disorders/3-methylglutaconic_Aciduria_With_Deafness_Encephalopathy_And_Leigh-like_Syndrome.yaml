name: 3-methylglutaconic_Aciduria_With_Deafness_Encephalopathy_And_Leigh-like_Syndrome
category: Mendelian
creation_date: '2026-09-01T21:59:26Z'
description: >-
  MEGDEL syndrome (MEGD(H)EL when infantile hepatopathy is present) is an
  autosomal recessive neurometabolic disorder caused by biallelic loss of
  function of SERAC1, which encodes a phosphatidylglycerol remodeling enzyme
  acting at the contact site between mitochondria and the endoplasmic
  reticulum. Loss of SERAC1 shifts the phosphatidylglycerol pool towards
  PG-34:1 at the expense of PG-36:1, altering cardiolipin subspecies
  composition, depleting bis(monoacylglycerol)phosphate with consequent free
  cholesterol accumulation, and fragmenting the mitochondrial network with
  deficient calcium transfer from cytoplasm to mitochondria. The convergent
  bioenergetic failure produces secondary 3-methylglutaconic aciduria and
  lactic acidosis, and selectively damages the basal ganglia (a staged
  putaminal pattern with a pathognomonic dorsal-putaminal "eye" on MRI), the
  auditory system (sensorineural deafness), and the liver (infantile
  hepatopathy, which may present as neonatal liver failure without elevated
  transaminases or cholestasis). Severity tracks residual SERAC1 function:
  complete loss of function gives severe infantile MEGDHEL with early death,
  while hypomorphic splice and missense alleles give juvenile-onset
  complicated hereditary spastic paraplegia or, rarely, adult-onset dystonia.
  Roughly 100 patients have been reported worldwide and treatment is entirely
  supportive.
disease_term:
  preferred_term: 3-methylglutaconic aciduria with deafness, encephalopathy, and Leigh-like
    syndrome
  term:
    id: MONDO:0013875
    label: 3-methylglutaconic aciduria with deafness, encephalopathy, and Leigh-like
      syndrome
synonyms:
- MEGDEL syndrome
- MEGD(H)EL syndrome
- MEGDHEL syndrome
- SERAC1 deficiency
- 3-methylglutaconic aciduria type IV with sensorineural deafness, encephalopathy and
  Leigh-like syndrome
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic SERAC1 variants are required; most reported families are
    consanguineous with homozygous alleles, and heterozygous parents are
    unaffected.
  evidence:
  - reference: PMID:32684373
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: MEGDEL syndrome is an autosomal recessive disorder, clinically characterized
      by 3-methylglutaconic aciduria, psychomotor delay, muscle hypotonia, sensorineural
      deafness, and Leigh-like lesions on brain magnetic resonance imaging
    explanation: Review of 102 reported patients states the autosomal recessive mode
      of inheritance directly.
  - reference: PMID:33613893
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: with homozygous genotype in the patient and heterozygous genotype in her
      unaffected parents
    explanation: Segregation in one family shows the homozygous proband affected and
      heterozygous carriers unaffected.
has_subtypes:
- name: Infantile MEGDHEL
  display_name: Severe infantile MEGD(H)EL
  description: >-
    The classic and most severe presentation, caused by complete loss of
    SERAC1 function (truncating, frameshift or large-deletion alleles). It
    begins with a neonatal metabolic and hepatic crisis and progresses to
    sensorineural deafness, severe psychomotor delay, dystonia and spasticity
    with staged basal-ganglia degeneration. Outcome is poor with early death.
  evidence:
  - reference: PMID:32684373
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Treatment is supportive, and the outcome is usually poor with early death,
      except for the juvenile-onset type
    explanation: Distinguishes the severe infantile course from the juvenile-onset
      form.
- name: Juvenile cHSP
  display_name: Juvenile-onset complicated hereditary spastic paraplegia
  description: >-
    A markedly milder oligosystemic phenotype produced by hypomorphic alleles
    with residual SERAC1 activity, in which affected subjects remain ambulant
    well into the second and third decades. Phosphatidylglycerol remodeling is
    impaired but less severely than in the infantile form.
  evidence:
  - reference: PMID:28916646
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Three subjects presented with juvenile-onset oligosystemic cHSP, still
      able to walk several miles at age >10-20 years
    explanation: Defines the juvenile complicated-HSP presentation of SERAC1 deficiency.
- name: Adult dystonia
  display_name: Adult-onset dystonia-spasticity presentation
  description: >-
    The mildest end of the SERAC1 spectrum, in which a patient with
    long-standing moderate intellectual disability develops progressive loss
    of acquired skills and generalized dystonia only in adulthood.
  evidence:
  - reference: PMID:37711114
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A 30-year-old patient with a moderate intellectual disability, developed,
      since the age of 25, a progressive loss of previous capacities
    explanation: Documents the adult-onset end of the SERAC1 deficiency spectrum.
genetic:
- name: SERAC1
  gene_term:
    preferred_term: SERAC1
    term:
      id: hgnc:21061
      label: SERAC1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:22683713
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Using exome sequencing, we identify SERAC1 mutations as the cause of MEGDEL
      syndrome, a recessive disorder of dystonia and deafness with Leigh-like syndrome,
      impaired oxidative phosphorylation and 3-methylglutaconic aciduria
    explanation: Gene-discovery study establishing SERAC1 as the causal gene.
  - reference: PMID:23918762
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Homozygosity mapping identified a candidate locus on 6q25.2-6q26
    explanation: Independent mapping of the disease locus to the SERAC1 region.
  variants:
  - name: c.442C>T (p.Arg148*)
    description: Nonsense allele found in trans with c.438delC in a patient with MEGDEL
      syndrome, optic atrophy and myoclonic epilepsy.
    functional_effects:
    - function: SERAC1 phosphatidylglycerol remodeling activity
      description: Loss of function; the allele reduces or abolishes SERAC1 protein.
    evidence:
    - reference: PMID:24997715
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Whole exome sequencing revealed two loss-of-function mutations in SERAC1
        in trans: c.438delC (p.T147Rfs*22) and c.442C>T (p.R148X)'
      explanation: Reports both loss-of-function alleles and their phase.
  - name: c.1018delT
    description: Homozygous frameshift allele generating premature translation termination,
      reported in a Palestinian child.
    functional_effects:
    - function: SERAC1 phosphatidylglycerol remodeling activity
      description: Loss of function; the allele reduces or abolishes SERAC1 protein.
    evidence:
    - reference: PMID:25051967
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We identified a novel homozygous mutation in SERAC1 gene (c.1018delT)
        that generates frame shift and premature termination of protein translation
      explanation: Documents the frameshift allele and its predicted consequence.
  - name: c.1495A>G (p.Met499Val)
    description: Hypomorphic missense allele found in compound heterozygosity in a
      Chinese patient whose phenotype was complicated hereditary spastic paraplegia
      rather than classic MEGDEL.
    functional_effects:
    - function: SERAC1 phosphatidylglycerol remodeling activity
      description: Hypomorphic; residual activity is associated with the milder phenotype.
    evidence:
    - reference: PMID:35223715
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: a novel c.1495A>G (p.Met499Val) variant in exon 14 of SERAC1 inherited
        from the father
      explanation: Identifies the missense allele in the milder cHSP presentation.
  - name: Deletion of exons 2-4
    description: Multi-exon deletion allele, in trans with c.1601A>T (p.His534Leu),
      in a child whose development improved beyond clinical expectation.
    functional_effects:
    - function: SERAC1 phosphatidylglycerol remodeling activity
      description: Loss of function; the allele reduces or abolishes SERAC1 protein.
    evidence:
    - reference: PMID:35781780
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'biallelic novel SERAC1 mutations: (1) deletion of (at least) exons
        2-4, pathogenic; and (2) c.1601A>T (p.H534L), likely pathogenic'
      explanation: Reports the structural allele and its pathogenicity assignment.
  notes: >-
    SERAC1 (serine active site containing 1, 6q25.3) is the only gene
    associated with MEGDEL syndrome. It encodes a phosphatidylglycerol
    remodeling enzyme; reported disease alleles include nonsense, frameshift,
    canonical splice and multi-exon deletion variants, all of which reduce or
    abolish protein expression, plus hypomorphic missense alleles associated
    with the milder phenotypes. p.Phe471 (rs112780453) is reported as a benign
    variant and should not be treated as a disease allele.
pathophysiology:
- name: Biallelic SERAC1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Two loss-of-function SERAC1 alleles - nonsense, frameshift, canonical
    splice or multi-exon deletion - are the initiating lesion. Heterozygous
    carriers are unaffected.
  evidence:
  - reference: PMID:22683713
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Using exome sequencing, we identify SERAC1 mutations as the cause of MEGDEL
      syndrome, a recessive disorder of dystonia and deafness with Leigh-like syndrome,
      impaired oxidative phosphorylation and 3-methylglutaconic aciduria
    explanation: Establishes biallelic SERAC1 mutation as the cause of the disorder.
  downstream:
  - target: Absent or Mislocalized SERAC1 Protein
    causal_link_type: DIRECT
    description: Truncating alleles abolish protein expression; a C-terminal truncation
      that escapes degradation is mislocalized away from mitochondria.
    evidence:
    - reference: PMID:23918762
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Both mutations were found to lead to decreased or absent expression
        of SERAC1
      explanation: Directly links the causal alleles to loss of the protein.
- name: Absent or Mislocalized SERAC1 Protein
  biological_scale: MOLECULAR
  description: >-
    Patient fibroblasts carrying a homozygous truncating allele contain no
    detectable SERAC1 protein. A milder C-terminally truncated protein is
    expressed but is distributed throughout the cell instead of partially
    colocalizing with mitochondria, so the enzyme is absent from its site of
    action either way.
  cellular_components:
  - preferred_term: mitochondria-associated endoplasmic reticulum membrane
    term:
      id: GO:0044233
      label: mitochondria-associated endoplasmic reticulum membrane contact site
    modifier: DECREASED
  evidence:
  - reference: PMID:34751152
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In the patient fibroblasts, no SERAC1 protein was detected, the mitochondrial
      network was severely fragmented, and the cristae morphology was altered
    explanation: Demonstrates complete absence of the protein in patient cells.
  - reference: PMID:34751152
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the mutant protein with the a 45-amino acid C-terminal truncation was distributed
      throughout the cell, whereas wild-type SERAC1 partially colocalized with the
      mitochondrial marker MT-CO1
    explanation: Shows the alternative route to functional absence, mislocalization
      away from mitochondria.
  - reference: PMID:22683713
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We localized SERAC1 at the interface between the mitochondria and the
      endoplasmic reticulum in the mitochondria-associated membrane fraction that is
      essential for phospholipid exchange
    explanation: Establishes the normal site of action from which the protein is lost.
  downstream:
  - target: Impaired Phosphatidylglycerol Remodeling
    causal_link_type: DIRECT
    description: SERAC1 is the phosphatidylglycerol remodeling enzyme at this membrane,
      so its loss removes the remodeling activity.
    evidence:
    - reference: PMID:22683713
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Our data identify SERAC1 as a key player in the phosphatidylglycerol
        remodeling that is essential for both mitochondrial function and intracellular
        cholesterol trafficking
      explanation: Assigns the remodeling function to the lost protein.
  - target: Impaired Mitochondrial Serine Import and mtDNA Depletion
    causal_link_type: DIRECT
    hypothesis_groups:
    - serine_transport_mtdna
    description: In the alternative model, SERAC1 acts on the outer mitochondrial membrane
      as a partner of the serine transporter SFXN1, so its loss starves the one-carbon
      cycle.
    evidence:
    - reference: PMID:35235340
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: By interacting with the mitochondrial serine transporter protein SFXN1,
        SERAC1 facilitated and was required for SFXN1-mediated serine transport from
        the cytosol to the mitochondria
      explanation: Supports a second, transport-based consequence of losing SERAC1.
- name: Impaired Phosphatidylglycerol Remodeling
  biological_scale: MOLECULAR
  description: >-
    Without SERAC1, the phosphatidylglycerol pool of patient fibroblasts
    shifts towards PG-34:1 and away from PG-36:1. Lentiviral complementation
    with wild-type SERAC1 partially normalizes the ratio, establishing that
    the lipid change is a direct consequence of the enzyme deficiency rather
    than a downstream epiphenomenon.
  biological_processes:
  - preferred_term: phosphatidylglycerol remodeling
    term:
      id: GO:0006655
      label: phosphatidylglycerol biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:22683713
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A phospholipid analysis in patient fibroblasts showed elevated concentrations
      of phosphatidylglycerol-34:1
    explanation: Reports the primary lipid abnormality in patient cells.
  - reference: PMID:22683713
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Complementation of patient fibroblasts with wild-type human SERAC1 by
      lentiviral infection led to a decrease and partial normalization of the mean
      ratio of phosphatidylglycerol-34:1 to phosphatidylglycerol-36:1
    explanation: Rescue by wild-type protein shows the lipid defect is caused by SERAC1
      loss.
  downstream:
  - target: Altered Cardiolipin Subspecies Composition
    causal_link_type: DIRECT
    description: Phosphatidylglycerol is the immediate precursor of cardiolipin, so
      a shifted PG pool yields abnormal cardiolipin species.
    evidence:
    - reference: PMID:22683713
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: decreased concentrations of phosphatidylglycerol-36:1 species, resulting
        in an altered cardiolipin subspecies composition
      explanation: States the causal step from the PG shift to abnormal cardiolipin.
  - target: Bis(monoacylglycerol)phosphate Depletion and Free Cholesterol Accumulation
    causal_link_type: DIRECT
    description: The same remodeling defect lowers BMP, the late-endosomal lipid required
      for cholesterol egress.
    evidence:
    - reference: PMID:22683713
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We also detected low concentrations of bis(monoacyl-glycerol)-phosphate,
        leading to the accumulation of free cholesterol, as shown by abnormal filipin
        staining
      explanation: Links the lipid remodeling defect to BMP loss and cholesterol accumulation.
  - target: Mitochondrial Network Fragmentation and Deficient Calcium Transfer
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Loss of the remodeling enzyme at the ER-mitochondria interface disrupts
      the contact site itself; the intervening steps between the lipid change and the
      structural and calcium phenotypes are not established.
    evidence:
    - reference: PMID:34751152
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The structural and functional mitochondrial abnormalities, caused by
        the loss of SERAC1, suggest that the crucial disease mechanism is disrupted
        interplay between the ER and mitochondria
      explanation: Attributes the structural and calcium abnormalities to SERAC1 loss
        while describing the link as a suggested mechanism.
- name: Altered Cardiolipin Subspecies Composition
  biological_scale: MOLECULAR
  description: >-
    The shifted phosphatidylglycerol pool yields cardiolipin of abnormal acyl
    composition. Cardiolipin is required for assembly and stability of the
    respiratory chain supercomplexes, which is the route by which a
    phospholipid defect becomes a bioenergetic one.
  biological_processes:
  - preferred_term: cardiolipin metabolic process
    term:
      id: GO:0032048
      label: cardiolipin metabolic process
    modifier: DECREASED
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  evidence:
  - reference: PMID:22683713
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: decreased concentrations of phosphatidylglycerol-36:1 species, resulting
      in an altered cardiolipin subspecies composition
    explanation: Reports the altered cardiolipin composition directly.
  - reference: PMID:23296368
    supports: SUPPORT
    evidence_source: OTHER
    snippet: defect or Barth syndrome, SERAC1 defect or MEGDEL syndrome
    explanation: Classification review groups MEGDEL with Barth syndrome as a disorder
      of defective phospholipid remodelling, the class in which cardiolipin is the
      affected lipid.
  downstream:
  - target: Respiratory Chain Complex Deficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Abnormal cardiolipin is the presumed link to measured complex I, III
      and IV deficiency; the assembly intermediates have not been demonstrated in this
      disease.
    evidence:
    - reference: PMID:34751152
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: In liver mitochondria, complexes I, III, and IV were clearly decreased
      explanation: Establishes the complex deficiency; the cardiolipin route to it
        is inferred rather than measured here.
- name: Bis(monoacylglycerol)phosphate Depletion and Free Cholesterol Accumulation
  biological_scale: CELLULAR
  description: >-
    Low BMP impairs intracellular cholesterol trafficking, so unesterified
    cholesterol accumulates and is unevenly distributed, demonstrable by
    filipin staining in patient fibroblasts. This is a parallel cellular
    consequence of the same remodeling defect rather than a step on the
    bioenergetic route.
  biological_processes:
  - preferred_term: intracellular cholesterol transport
    term:
      id: GO:0008203
      label: cholesterol metabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:22683713
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We also detected low concentrations of bis(monoacyl-glycerol)-phosphate,
      leading to the accumulation of free cholesterol, as shown by abnormal filipin
      staining
    explanation: Reports both the BMP deficit and the resulting cholesterol accumulation.
  - reference: PMID:34751152
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Filipin staining showed uneven localization of unesterified cholesterol
    explanation: Independent replication of the cholesterol trafficking defect in a
      second patient line.
  downstream:
  - target: Mitochondrial Bioenergetic Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Cholesterol mistrafficking is presumed to contribute to organelle
      dysfunction, but no step connecting it quantitatively to ATP deficit has been
      demonstrated in MEGDEL.
    evidence:
    - reference: PMID:22683713
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: Our data identify SERAC1 as a key player in the phosphatidylglycerol
        remodeling that is essential for both mitochondrial function and intracellular
        cholesterol trafficking
      explanation: Places both mitochondrial function and cholesterol trafficking downstream
        of the same enzyme without demonstrating the link between them.
- name: Mitochondrial Network Fragmentation and Deficient Calcium Transfer
  biological_scale: CELLULAR
  description: >-
    Patient fibroblasts show a severely fragmented mitochondrial network with
    altered cristae morphology, and the calcium buffering function between
    cytoplasm and mitochondria is deficient. Liver ultrastructure in a second
    patient shows abnormal circular mitochondrial cristae.
  biological_processes:
  - preferred_term: mitochondrion organization
    term:
      id: GO:0007005
      label: mitochondrion organization
    modifier: DECREASED
  - preferred_term: mitochondrial calcium uptake
    term:
      id: GO:0006874
      label: intracellular calcium ion homeostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:34751152
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The calcium buffer function between cytoplasm and mitochondria was deficient
    explanation: Reports the calcium transfer defect directly.
  - reference: PMID:35781780
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The ultrastructural findings included abnormal circular mitochondrial cristae
    explanation: Confirms abnormal cristae in patient liver tissue, not only cultured
      cells.
  downstream:
  - target: Respiratory Chain Complex Deficiency
    causal_link_type: DIRECT
    description: Reduced calcium influx to mitochondria is proposed as the immediate
      cause of the secondary respiratory chain deficiency.
    evidence:
    - reference: PMID:34751152
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: leading to decreased influx of calcium to mitochondria and secondary
        respiratory chain deficiency
      explanation: States the causal step from deficient calcium influx to respiratory
        chain deficiency.
- name: Impaired Mitochondrial Serine Import and mtDNA Depletion
  biological_scale: MOLECULAR
  description: >-
    An alternative and not yet reconciled model places SERAC1 on the outer
    mitochondrial membrane as a partner of the serine transporter SFXN1. Loss
    of SERAC1 then impairs the one-carbon cycle, unbalances the nucleotide
    pool and depletes mitochondrial DNA. Hepatic mtDNA depletion has been
    observed in one patient, and nucleoside supplementation restored mtDNA
    content in the mouse and cell models.
  biological_processes:
  - preferred_term: mitochondrial DNA maintenance
    term:
      id: GO:0007005
      label: mitochondrion organization
    modifier: DECREASED
  evidence:
  - reference: PMID:35235340
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Loss of SERAC1 impaired the one-carbon cycle and disrupted the balance
      of the nucleotide pool, which led to primary mitochondrial DNA (mtDNA) depletion
    explanation: Reports the serine-transport route from SERAC1 loss to mtDNA depletion.
  - reference: PMID:23918762
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All affected children displayed biochemical features consistent with mitochondrial
      OXPHOS dysfunction including hepatic mitochondrial DNA depletion in one patient
    explanation: Human observation of hepatic mtDNA depletion consistent with this
      route.
  downstream:
  - target: Mitochondrial Bioenergetic Failure
    causal_link_type: DIRECT
    hypothesis_groups:
    - serine_transport_mtdna
    description: mtDNA depletion removes the templates for the mitochondrially encoded
      respiratory chain subunits.
    evidence:
    - reference: PMID:35235340
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: both in vitro and in vivo supplementation of nucleosides/nucleotides
        restored mtDNA content and mitochondrial function
      explanation: Rescue of mitochondrial function by restoring mtDNA content supports
        the depletion as the cause of the bioenergetic deficit in this model.
- name: Respiratory Chain Complex Deficiency
  biological_scale: CELLULAR
  description: >-
    Reduced activity and amount of respiratory chain complexes I, III and IV,
    measured in liver mitochondria. The deficiency is secondary to the
    phospholipid and contact-site defect, and is characteristically variable
    between tissues - respiratory chain activity in fresh muscle can be
    entirely normal, so a negative muscle biopsy does not exclude the
    diagnosis.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:34751152
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In liver mitochondria, complexes I, III, and IV were clearly decreased
    explanation: Direct measurement of the complex deficiency in patient liver.
  - reference: PMID:25051967
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: Plasma and cerebrospinal fluid lactate, plasma alanine, and respiratory
      chain complexes in fresh muscle were normal
    explanation: Contradicts a uniform respiratory chain deficiency across tissues;
      muscle can be normal in a genetically confirmed patient.
  downstream:
  - target: Mitochondrial Bioenergetic Failure
    causal_link_type: DIRECT
    description: Loss of complexes I, III and IV directly reduces ATP synthesis capacity.
    evidence:
    - reference: PMID:22683713
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: a recessive disorder of dystonia and deafness with Leigh-like syndrome,
        impaired oxidative phosphorylation and 3-methylglutaconic aciduria
      explanation: Names impaired oxidative phosphorylation as a defining feature of
        the disorder.
- name: Mitochondrial Bioenergetic Failure
  biological_scale: CELLULAR
  description: >-
    The convergence point of the cardiolipin, calcium and mtDNA branches:
    insufficient mitochondrial ATP production in tissues with high and
    sustained energy demand.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  evidence:
  - reference: PMID:23918762
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All affected children displayed biochemical features consistent with mitochondrial
      OXPHOS dysfunction
    explanation: Establishes OXPHOS dysfunction across the reported patient series.
  downstream:
  - target: Secondary 3-Methylglutaconic Aciduria and Lactic Acidosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: 3-methylglutaconic acid excretion in MEGDEL is a marker of mitochondrial
      dysfunction rather than a block in leucine catabolism; the biochemical steps
      generating it are not established.
    evidence:
    - reference: PMID:30114719
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 3-methylglutaconic aciduria (3-MGA-uria) is a marker for mitochondrial
        dysfunction
      explanation: States the marker relationship that makes this aciduria secondary.
  - target: Basal Ganglia Neurodegeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Energy failure damages the basal ganglia selectively, in the staged
      putaminal pattern characteristic of the disease; why the putamen is affected
      first is unknown.
    evidence:
    - reference: PMID:25642805
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: All patients presented a distinctive brain MRI pattern with five characteristic
        disease stages affecting the basal ganglia, especially the putamen
      explanation: Documents the selective basal-ganglia target of the energy deficit.
  - target: Cochlear and Auditory Pathway Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Sensorineural deafness is a near-universal feature; the cellular site
      of the auditory lesion in MEGDEL has not been established histologically.
    evidence:
    - reference: PMID:32684373
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: clinically characterized by 3-methylglutaconic aciduria, psychomotor
        delay, muscle hypotonia, sensorineural deafness
      explanation: Establishes sensorineural deafness as a defining consequence.
  - target: Hepatocellular Mitochondrial Injury
    causal_link_type: DIRECT
    description: Liver mitochondria carry the measured respiratory chain deficiency
      and the abnormal cristae, and infantile hepatopathy is a cardinal feature.
    evidence:
    - reference: PMID:23918762
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The present findings indicate that infantile hepatopathy is a cardinal
        feature of MEGDEL syndrome
      explanation: Establishes hepatic involvement as a core rather than incidental
        feature.
- name: Secondary 3-Methylglutaconic Aciduria and Lactic Acidosis
  biological_scale: ORGANISM
  description: >-
    Persistently increased urinary excretion of 3-methylglutaconic and
    3-methylglutaric acid, with elevated blood lactate and alanine. This is a
    secondary 3-methylglutaconic aciduria of the class defined by defective
    phospholipid remodeling, not a primary block in leucine catabolism as in
    AUH deficiency.
  evidence:
  - reference: PMID:27186703
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The patients were presented with 3-methylglutaconic acid and 3-methylglutaric
      aciduria
    explanation: Documents excretion of both organic acids in confirmed patients.
  - reference: PMID:37711114
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Biochemical abnormalities: elevated urinary 3 - metilglutaconic and 3-metilglutaric
      acids, high lactate and alanine in serum'
    explanation: Records the accompanying lactate and alanine elevation.
  downstream:
  - target: 3-Methylglutaconic aciduria
    causal_link_type: DIRECT
    description: The organic aciduria is itself the defining laboratory phenotype.
    evidence:
    - reference: PMID:30114719
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: consistently elevated urinary excretion of 3-methylglutaconic acid is
        the hallmark of a small but growing group of inborn errors of metabolism
      explanation: Confirms the aciduria as the observable hallmark.
  - target: Lactic acidosis
    causal_link_type: DIRECT
    description: Impaired oxidative phosphorylation shifts pyruvate to lactate.
    evidence:
    - reference: PMID:38445077
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: a pronounced lactate acidosis and in urine an increased excretion of
        3-methylglutaconic acid as well as other metabolites of mitochondrial energy
        metabolism
      explanation: Reports lactic acidosis together with the organic aciduria in a
        neonatal crisis.
- name: Basal Ganglia Neurodegeneration
  biological_scale: TISSUE
  description: >-
    Staged degeneration of the basal ganglia, beginning with pallidal T2
    change, progressing to swelling of the putamen and caudate nucleus with a
    spared dorsal-putaminal "eye", and finally to progressive putaminal
    involvement. The "eye" has not been reported in any other disorder and is
    pathognomonic.
  cell_types:
  - preferred_term: striatal neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: putamen
    term:
      id: UBERON:0001874
      label: putamen
  - preferred_term: caudate nucleus
    term:
      id: UBERON:0001873
      label: caudate nucleus
  - preferred_term: globus pallidus
    term:
      id: UBERON:0001875
      label: globus pallidus
  evidence:
  - reference: PMID:25642805
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In stage 1, T2 signal changes of the pallidum are present. In stage 2,
      swelling of the putamen and caudate nucleus is seen
    explanation: Defines the staged anatomical progression across 30 patients.
  - reference: PMID:25642805
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: has not been reported in other disorders, making it pathognomonic for
      MEDGEL and allowing diagnosis based on MRI findings
    explanation: Establishes the specificity of the putaminal sign for this disease.
  downstream:
  - target: Dystonia
    causal_link_type: DIRECT
    description: Loss of striatal output produces the generalized dystonia that names
      the dystonia-deafness syndrome.
    evidence:
    - reference: PMID:27186703
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: severe sensorineural deafness, progressive spasticity, dystonia, seizures,
        basal ganglia involvement
      explanation: Reports dystonia together with the basal ganglia lesion in the same
        patients.
  - target: Progressive spasticity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Spasticity accompanies the basal-ganglia disease and dominates the
      milder juvenile phenotype, though corticospinal involvement rather than the striatal
      lesion is likely to mediate it.
    evidence:
    - reference: PMID:25642805
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: a clinically and biochemically highly distinctive dystonia deafness
        syndrome accompanied by 3-methylglutaconic aciduria, severe developmental delay,
        and progressive spasticity
      explanation: Records progressive spasticity as part of the same clinical picture.
  - target: Leigh-like basal ganglia lesions
    causal_link_type: DIRECT
    description: The degeneration is what the MRI abnormality depicts.
    evidence:
    - reference: PMID:35223715
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Brain MRI scans showed a symmetric flake abnormal signal shadow in the
        bilateral basal ganglia
      explanation: Documents the imaging correlate of the basal-ganglia lesion.
- name: Cochlear and Auditory Pathway Degeneration
  biological_scale: TISSUE
  description: >-
    Bilateral sensorineural hearing loss, usually severe and evident in
    infancy, giving the "D" of the acronym. Whether the lesion is cochlear
    hair cell, spiral ganglion or central is not established in MEGDEL, so the
    anatomical binding here is to the cochlea rather than to a specific cell
    population.

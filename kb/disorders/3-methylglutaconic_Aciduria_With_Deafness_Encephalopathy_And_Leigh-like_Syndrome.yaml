    explanation: First detailed liver histology published for this syndrome.
  - reference: PMID:38445077
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: severe liver failure with distinct hyperammonemia and hypoglycemia without
      elevation of transaminases or cholestasis
    explanation: Documents the distinctive neonatal presentation of the hepatic lesion.
  downstream:
  - target: Infantile hepatopathy
    causal_link_type: DIRECT
    description: The hepatocellular mitochondrial lesion is expressed as the cardinal
      infantile hepatopathy.
    evidence:
    - reference: PMID:23918762
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The present findings indicate that infantile hepatopathy is a cardinal
        feature of MEGDEL syndrome
      explanation: Establishes the hepatopathy as a core feature of the disease.
  - target: Hyperammonemia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Loss of hepatic synthetic and detoxifying function during the neonatal
      crisis raises ammonia; the contribution of impaired ureagenesis versus catabolic
      load is not resolved.
    evidence:
    - reference: PMID:38445077
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Due to high ammonia level, continuous hemodialysis was established immediately
        after admission
      explanation: Records hyperammonemia severe enough to require dialysis in hepatic
        crisis.
  - target: Hypoglycemia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Impaired hepatic glucose output during the neonatal crisis.
    evidence:
    - reference: PMID:38445077
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: If a newborn presents with hyperammonemia, hypoglycemia and impaired

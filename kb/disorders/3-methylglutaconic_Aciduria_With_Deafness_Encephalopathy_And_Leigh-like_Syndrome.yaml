biochemical:
- name: Phosphatidylglycerol 34:1 to 36:1 ratio
  notes: An increased PG34:1/PG36:1 ratio in cultured fibroblasts supports defective remodeling. Partial rescue by wild-type SERAC1 supports causality. A milder ratio in one HSP-family line is not a validated predictor of severity for all variants.
  presence: INCREASED
  readouts:
  - target: Impaired Phosphatidylglycerol Remodeling
    relationship: READOUT_OF
    direction: POSITIVE
    interpretation: A raised PG34:1/PG36:1 ratio is the direct cellular measurement of the remodeling defect.
    evidence:
    - reference: PMID:22683713
      reference_title: Mutations in the phospholipid remodeling gene SERAC1 impair mitochondrial function and intracellular cholesterol trafficking and cause dystonia and deafness.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Complementation of patient fibroblasts with wild-type human SERAC1 by lentiviral infection led to a decrease and partial normalization of the mean ratio of phosphatidylglycerol-34:1 to phosphatidylglycerol-36:1
      explanation: Rescue of the ratio by wild-type protein ties the measurement to the mechanism.
  evidence:
  - reference: PMID:28916646
    reference_title: 'SERAC1 deficiency causes complicated HSP: evidence from a novel splice mutation in a large family.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: biomarker investigations (3-methyl-glutaconic acid, filipin staining and phosphatidylglycerols PG34:1/PG36:1)
    explanation: Uses the ratio as a diagnostic biomarker in a clinical family study.
  - reference: PMID:28916646
    reference_title: 'SERAC1 deficiency causes complicated HSP: evidence from a novel splice mutation in a large family.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These phosphatidylglycerol changes, however, were milder than in classic infantile-onset SERAC1 cases, which might partially explain the milder SERAC1 phenotype
    explanation: Links the magnitude of the biomarker shift to clinical severity.

mechanistic_hypotheses:
- hypothesis_group_id: serine_transport_mtdna
  hypothesis_label: SERAC1 as an outer-membrane partner of the serine transporter SFXN1
  status: EMERGING
  description: SERAC1-dependent SFXN1 serine transport supports mitochondrial one-carbon metabolism, nucleotide supply and mtDNA maintenance in experimental systems. This pathway could coexist with lipid remodeling. Its relative importance in human disease and its relationship to tissue-specific lipid and calcium abnormalities remain unresolved. Nucleoside/nucleotide rescue is preclinical.
  evidence:
  - reference: PMID:35235340
    reference_title: SERAC1 is a component of the mitochondrial serine transporter complex required for the maintenance of mitochondrial DNA.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: By interacting with the mitochondrial serine transporter protein SFXN1, SERAC1 facilitated and was required for SFXN1-mediated serine transport from the cytosol to the mitochondria
    explanation: The experimental study identifies SERAC1-dependent SFXN1 transport.
  - reference: PMID:35235340
    reference_title: SERAC1 is a component of the mitochondrial serine transporter complex required for the maintenance of mitochondrial DNA.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Loss of SERAC1 impaired the one-carbon cycle and disrupted the balance of the nucleotide pool, which led to primary mitochondrial DNA (mtDNA) depletion in mice, HEK293T cells, and patient-derived immortalized lymphocyte cells due to insufficient supply of nucleotides
    explanation: This proposed sequence was studied in mice and cellular models; it is not a universal clinical finding.
  - reference: PMID:35235340
    reference_title: SERAC1 is a component of the mitochondrial serine transporter complex required for the maintenance of mitochondrial DNA.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: both in vitro and in vivo supplementation of nucleosides/nucleotides restored mtDNA content and mitochondrial function
    explanation: Preclinical rescue supports nucleotide limitation in the experimental systems.
animal_models:
- name: Serac1 knockout mouse
  species: Mouse
  genotype: Serac1-/-
  publication: PMID:35235340
  description: Serac1-null mice were reported to reproduce major diagnostic clinical and biochemical features and support the serine-transport/mtDNA pathway. Nucleoside or nucleotide supplementation rescued mtDNA content and mitochondrial function experimentally.
  modeled_mechanisms:
  - target: Mitochondrial DNA Depletion
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: The mouse reproduces mtDNA depletion and the biochemical diagnostic phenotype, and nucleoside supplementation restores mtDNA content.
    limitations: The accessible source is an abstract. It does not resolve which lipid abnormalities or stage-specific human MRI lesions were reproduced, nor the contribution of each pathway to human disease. Preclinical rescue does not establish clinical efficacy or safety.
    readouts:
    - name: Mitochondrial DNA content
      target: Mitochondrial DNA Depletion
      direction: DECREASED
      interpretation: mtDNA copy number is the primary molecular readout of this node in the model.
      evidence:
      - reference: PMID:35235340
        reference_title: SERAC1 is a component of the mitochondrial serine transporter complex required for the maintenance of mitochondrial DNA.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: which led to primary mitochondrial DNA (mtDNA) depletion in mice, HEK293T cells, and patient-derived immortalized lymphocyte cells
        explanation: Reports the mtDNA measurement in the knockout mouse and in patient-derived cells.
    - name: Mitochondrial DNA content after nucleoside supplementation
      target: Mitochondrial DNA Depletion
      direction: RESTORED
      interpretation: Restoration on supplementation shows the depletion is reversible and nucleotide-limited.
      evidence:
      - reference: PMID:35235340
        reference_title: SERAC1 is a component of the mitochondrial serine transporter complex required for the maintenance of mitochondrial DNA.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: both in vitro and in vivo supplementation of nucleosides/nucleotides restored mtDNA content and mitochondrial function
        explanation: Reports the rescue arm of the experiment.
    evidence:
    - reference: PMID:35235340
      reference_title: SERAC1 is a component of the mitochondrial serine transporter complex required for the maintenance of mitochondrial DNA.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: we generated Serac1-/- mice that mimic the major diagnostic clinical and biochemical phenotypes of the MEGD(H)EL syndrome
      explanation: States that the model reproduces the diagnostic phenotype, which is what makes it informative for this node.
- name: Canine multiple system degeneration
  species: Dog
  genotype: SERAC1 exon 15 nonsense (Kerry Blue Terrier) or exon 4 acceptor splice site 4 bp deletion (Chinese Crested)
  publication: PMID:39596578
  description: Naturally occurring SERAC1-associated multiple system degeneration affects Kerry Blue Terriers and Chinese Crested dogs. Breed-specific variant concordance and affected compound-heterozygous crosses support genetic causation. Splice disruption was demonstrated for the Chinese Crested allele; loss of protein activity was not directly measured.
  modeled_mechanisms:
  - target: Basal Ganglia Neurodegeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Affected dogs lose neurons from the putamen and caudate nucleus, the same striatal targets damaged in human MEGDEL, and develop a progressive movement disorder.
    limitations: Published canine neuropathology includes Purkinje-cell, striatal and nigral neuronal loss with ataxia and tremor. Hearing and cognition were not assessed, and hepatic or urine organic-acid phenotyping was not reported. These are untested features, not established absences. The paper does not demonstrate canine lipid, serine-transport or mtDNA abnormalities.
    readouts:
    - name: Striatal neuronal abundance
      target: Basal Ganglia Neurodegeneration
      direction: DECREASED
      interpretation: Reported postmortem striatal neuronal loss provides a neuropathological correlate; the paper summarizes prior pathology rather than a new quantitative neuron-counting assay.

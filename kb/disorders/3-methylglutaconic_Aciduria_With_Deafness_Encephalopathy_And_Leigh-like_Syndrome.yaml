discussions:
- discussion_id: serac1_localization_conflict
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Where in the cell does SERAC1 act - at the mitochondria-associated ER membrane,
    or on the outer mitochondrial membrane?
  attaches_to:
  - pathophysiology#Absent or Mislocalized SERAC1 Protein
  - mechanistic_hypotheses#serine_transport_mtdna
  rationale: >-
    The gene-discovery study localized SERAC1 to the mitochondria-associated
    membrane fraction at the ER-mitochondria interface and assigned it a
    phospholipid remodeling role there. A later study using a knockout mouse
    placed it on the outer mitochondrial membrane as a partner of the serine
    transporter SFXN1, with a one-carbon-cycle and mtDNA-maintenance role. The
    two localizations imply different primary defects and different candidate
    treatments, and no study has tested them against each other. Until they
    are reconciled, this entry curates the phospholipid route as the main
    chain and the serine-transport route as an explicit hypothesis group.
  evidence:
  - reference: PMID:35235340
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We found that SERAC1 localizes to the outer mitochondrial membrane and
      is a protein component of the one-carbon cycle
    explanation: One side of the disagreement.
  - reference: PMID:22683713
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: We localized SERAC1 at the interface between the mitochondria and the
      endoplasmic reticulum in the mitochondria-associated membrane fraction that is
      essential for phospholipid exchange
    explanation: The other side of the disagreement.
- discussion_id: canine_model_organ_coverage
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Does the canine SERAC1 disorder model the non-neurological features of
    MEGDEL, or only the movement disorder?
  attaches_to:
  - pathophysiology#Cochlear and Auditory Pathway Degeneration
  - pathophysiology#Hepatocellular Mitochondrial Injury
  rationale: >-
    Canine multiple system degeneration is caused by SERAC1 loss and shares
    striatal neurodegeneration with the human disease, but the published
    description covers only the movement disorder and its neuropathology.
    Deafness, hepatopathy and 3-methylglutaconic aciduria - three of the four
    letters of the human acronym - are not reported in the dogs, and the
    canine lesion additionally involves the cerebellum and substantia nigra,
    which the human disease does not. So it is not known whether the dog fails
    to develop those features or whether nobody has looked, and the model
    cannot currently be used to study the auditory or hepatic mechanism.
  proposed_experiments:
  - experiment_id: canine_audiology_and_organic_acids
    name: Auditory, hepatic and organic-acid phenotyping of SERAC1 dogs
    description: >-
      Perform brainstem auditory evoked response testing, liver function and
      histology, and urine organic acid analysis on genotyped affected,
      carrier and wild-type Kerry Blue Terriers and Chinese Crested dogs.
    readouts:
    - name: Brainstem auditory evoked response threshold
      target: pathophysiology#Cochlear and Auditory Pathway Degeneration
      direction: INCREASED
      interpretation: A raised threshold in affected dogs would show the canine model
        does reach the auditory system.
    - name: Urinary 3-methylglutaconic acid
      target: pathophysiology#Hepatocellular Mitochondrial Injury
      direction: INCREASED
      interpretation: Organic aciduria in affected dogs would show the biochemical
        phenotype is conserved.
    would_support:
    - pathophysiology#Cochlear and Auditory Pathway Degeneration
    supporting_outcome:
    - Affected dogs show raised auditory brainstem response thresholds and increased
      urinary 3-methylglutaconic acid relative to genotyped littermate controls.
    would_refute:
    - pathophysiology#Cochlear and Auditory Pathway Degeneration
    refuting_outcome:
    - Affected dogs have normal hearing thresholds, normal liver histology and normal
      organic acids despite advanced striatal degeneration, showing the canine
      phenotype is restricted to the nervous system.
  evidence:
  - reference: PMID:39596578
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The associated pathologic lesions include degeneration of the cerebellum,
      caudate nucleus, and substantia nigra
    explanation: The published canine lesion description covers the nervous system
      only.
references:
- reference: PMID:22683713
  title: Mutations in the phospholipid remodeling gene SERAC1 impair mitochondrial
    function and intracellular cholesterol trafficking and cause dystonia and deafness.
- reference: PMID:23918762
  title: Infantile mitochondrial hepatopathy is a cardinal feature of MEGDEL syndrome
    (3-methylglutaconic aciduria type IV with sensorineural deafness, encephalopathy
    and Leigh-like syndrome) caused by novel mutations in SERAC1.
- reference: PMID:25642805
  title: 'Eyes on MEGDEL: distinctive basal ganglia involvement in dystonia deafness
    syndrome.'
- reference: PMID:34751152
  title: Severe neonatal MEGDHEL syndrome with a homozygous truncating mutation in
    SERAC1.
- reference: PMID:35235340
  title: SERAC1 is a component of the mitochondrial serine transporter complex required
    for the maintenance of mitochondrial DNA.
- reference: PMID:32684373
  title: MEGDEL Syndrome.
notes: >-
  Scope. This entry covers SERAC1 deficiency as a single disease with three
  severity bands recorded as subtypes, rather than splitting the juvenile
  complicated-HSP and adult dystonia presentations into separate entries. They
  share one gene, one biochemical signature and one mechanism, differ only by
  residual protein function, and MONDO carries a single concept.

  Terms deliberately not bound. The auditory node is bound to the cochlea
  rather than to a hair-cell type: no histological study localizes the
  auditory lesion in MEGDEL, and binding a cell type would assert more than
  the literature supports. Note that CL:0000598, suggested as "cochlear hair
  cell" by the deep-research report used for this entry, is in fact
  "pyramidal neuron" and must not be used for hair cells anywhere.

  Report corrections. Three claims in the source deep-research report were
  wrong and were not carried into this entry. It attributed the quote "Both
  mutations were found to lead to decreased or absent expression of SERAC1"
  to PMID:35943861; the sentence is in PMID:23918762, which is cited here
  instead. It stated that no Serac1 knockout mouse recapitulating MEGDEL had
  been published, while PMID:35235340 - which the same report cites - reports
  exactly such a mouse; the model is curated here. It gave NCIT:C15277 for
  Supportive Care, which is Mastectomy; the correct term NCIT:C15747 is used.
  It also offered HP:0002518 for Leigh-like basal ganglia lesions, which is
  "Abnormal periventricular white matter morphology"; HP:0002134 is used.

  influences_mechanisms:
  - target: PTCH1 Loss of Function
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Ultraviolet light does not inactivate PTCH1 directly: it creates
      pyrimidine-dimer lesions that are then mis-repaired into the
      UV-signature mutations found in this gene. The intermediates are known,
      hence indirect.
    evidence:
    - reference: PMID:17274935
      reference_title: "Basal cell carcinoma: review of epidemiology, pathogenesis, and associated risk factors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Ultraviolet light exposure is the most critical modifiable factor determining early expression and frequency of BCC development."
      explanation: >-
        Names ultraviolet light as the most critical modifiable factor
        determining how early and how often these tumours develop, consistent
        with it driving the initiating gene lesion.
  description: >-
    Chronic UV exposure is the primary risk factor for BCC development.

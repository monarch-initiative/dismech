  description: Smoothened inhibitors are currently being investigated for the treatment of several cancers. Vismodegib is approved for the treatment of locally advanced and metastatic basal cell carcinoma (BCC). The majority of BCC patients treated with vismodegib experience significant clinical benefit, however, a small number of patients develop resistance. Knowledge of resistance mechanisms can generate predictive biomarkers and is critical for the design of additional therapeutic strategies aimed at circumventing resistance.

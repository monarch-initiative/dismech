inheritance:
- name: Autosomal recessive
  description: >-
    All reported patients are homozygous for a truncating CPE variant and come
    from consanguineous families. Heterozygous relatives are unaffected, and mice
    heterozygous for a Cpe null allele are physiologically normal despite
    reduced enzyme activity.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:34383079
    reference_title: "BDV Syndrome: An Emerging Syndrome With Profound Obesity and Neurodevelopmental Delay Resembling Prader-Willi Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic truncating CPE variants are associated with BDV syndrome, a clinically recognizable monogenic recessive syndrome with childhood-onset obesity, neurodevelopmental delay, hypogonadotropic hypogonadism, and hypothyroidism."
    explanation: >-
      Defines the syndrome as monogenic recessive and caused by biallelic
      truncating CPE variants.
  - reference: PMID:26120850
    reference_title: "Truncating Homozygous Mutation of Carboxypeptidase E (CPE) in a Morbidly Obese Female with Type 2 Diabetes Mellitus, Intellectual Disability and Hypogonadotrophic Hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on a family history of consanguinity (the proband’s parents are first cousins) and the extreme phenotype of the proband, an autosomal recessive mode of inheritance was hypothesised."
    explanation: >-
      The index family is consanguineous and the proband homozygous, the pattern
      expected of a recessive trait.
  - reference: PMID:32936766
    reference_title: "A New Cause of Obesity Syndrome Associated with a Mutation in the Carboxypeptidase Gene Detected in Three Siblings with Obesity, Intellectual Disability and Hypogonadotropic Hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The parents were phenotypically normal heterozygous mutation carriers."
    explanation: >-
      Heterozygous parents of three affected siblings were phenotypically
      normal, supporting the statement that heterozygous relatives are
      unaffected.
  - reference: PMID:35618016
    reference_title: "Mice heterozygous for a null mutation of CPE show reduced expression of carboxypeptidase e mRNA and enzyme activity but normal physiology, behavior, and levels of neuropeptides."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Despite the decreased levels of Cpe expression, heterozygous CpeNeo mice are behaviorally and physiologically identical to wild-type mice, with normal levels of most neuropeptides."
    explanation: >-
      Mice carrying one Cpe null allele have reduced enzyme activity but are

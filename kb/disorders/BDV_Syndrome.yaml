genetic:
- name: CPE
  gene_term:
    preferred_term: CPE
    term:
      id: hgnc:2303
      label: CPE
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    All reported pathogenic alleles are homozygous truncating variants:
    c.76_98del p.(Glu26Argfs*68), c.361C>T p.(Arg121*) in two families,
    c.405C>A p.(Tyr135*), and c.994del p.(Ser333Alafs*22). Computational
    modelling suggests CPE is intolerant of missense change, so biallelic
    missense variants may also be pathogenic. A heterozygous missense variant,
    p.Arg283Trp, lowers enzyme activity and was associated with earlier onset of
    type 2 diabetes in Ashkenazi families; it is not a cause of BDV syndrome.
  evidence:
  - reference: PMID:32936766
    reference_title: "A New Cause of Obesity Syndrome Associated with a Mutation in the Carboxypeptidase Gene Detected in Three Siblings with Obesity, Intellectual Disability and Hypogonadotropic Hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RESULTS: WES analysis revealed a homozygous nonsense c.405C>A (p.Y135*) mutation in CPE."
    explanation: >-
      A second family with a homozygous truncating CPE variant.
  - reference: PMID:34383079
    reference_title: "BDV Syndrome: An Emerging Syndrome With Profound Obesity and Neurodevelopmental Delay Resembling Prader-Willi Syndrome."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Computational analysis indicated high conservation of CPE domains and intolerance to missense changes."
    explanation: >-
      Supports the possibility that biallelic missense variants are also
      pathogenic.
  - reference: PMID:11462236
    reference_title: "Missense polymorphism in the human carboxypeptidase E gene alters enzymatic activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Within these four families, patients who inherited one copy of this variant had much earlier age of onset for T2DM."
    explanation: >-
      Records the heterozygous p.Arg283Trp association with earlier type 2
      diabetes, distinct from the recessive syndrome.
animal_models:
- name: Cpe fat/fat mouse
  species: Mouse
  genotype: Cpe fat/fat (p.Ser202Pro) homozygous
  publication: PMID:7663508
  description: >-
    A spontaneous Cpe point mutation that destabilizes the enzyme and abolishes
    its activity. The mice develop adult-onset obesity, hyperproinsulinemia,
    hyperglycemia and infertility, and they are the source of most of what is
    known about the processing defect.
  modeled_mechanisms:
  - target: Impaired Proinsulin Processing
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Islets and pituitaries of the mutant mice lack CPE activity and process
      proinsulin abnormally.
    limitations: >-
      Mouse obesity is late-onset and slowly progressive, whereas human
      obesity begins in childhood; the diabetes is age, sex and strain
      dependent.
    evidence:
    - reference: PMID:7663508
      reference_title: "Hyperproinsulinaemia in obese fat/fat mice associated with a carboxypeptidase E mutation which reduces enzyme activity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, the fat mutation represents the first demonstration of an obesity-diabetes syndrome elicited by a genetic defect in a prohormone processing pathway."
      explanation: >-
        Establishes the mouse as a model of obesity-diabetes caused by a
        prohormone processing defect.
  - target: Impaired Pro-GnRH Processing
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Pro-GnRH processing is defective and fertility is lost.
    limitations: >-
      In male mice the infertility is mainly due to abnormal sexual behaviour,
      with normal basal gonadotropins, which differs from the low gonadotropins
      measured in patients.
    evidence:
    - reference: PMID:14715715
      reference_title: "Deficits in reproduction and pro-gonadotropin-releasing hormone processing in male Cpefat mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Basal serum gonadotropin contents are similar among wild-type, heterozygous, and homozygous mice."
      explanation: >-
        Shows where the mouse departs from the human hypogonadotropic
        phenotype.
- name: CpeNeo mouse
  species: Mouse
  genotype: Cpe Neo/Neo (expression-null) and Cpe Neo/+
  publication: PMID:35618016
  description: >-
    An expression-null allele. Homozygotes reproduce the fat/fat phenotype;
    heterozygotes have reduced CPE activity but are normal, supporting
    recessive inheritance.
  modeled_mechanisms:
  - target: Defective Prohormone C-Terminal Processing
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Homozygous null mice have greatly reduced neuropeptides, impaired
      fertility and adult-onset obesity.
    limitations: >-
      As in other Cpe mouse models, obesity is adult-onset rather than
      childhood-onset.
    evidence:
    - reference: PMID:35618016
      reference_title: "Mice heterozygous for a null mutation of CPE show reduced expression of carboxypeptidase e mRNA and enzyme activity but normal physiology, behavior, and levels of neuropeptides."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Homozygous CpeNeo/Neo mice show defects found in Cpefat/fat and/or Cpe global knockout (KO) mice, including greatly decreased levels of most neuropeptides, severely impaired fertility, depressive-like behavior, adult-onset obesity, and anxiety-like behavior."
      explanation: >-
        The null mouse reproduces the neuropeptide deficit and the endocrine
        phenotype.
    - reference: PMID:35618016
      reference_title: "Mice heterozygous for a null mutation of CPE show reduced expression of carboxypeptidase e mRNA and enzyme activity but normal physiology, behavior, and levels of neuropeptides."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Despite the decreased levels of Cpe expression, heterozygous CpeNeo mice are behaviorally and physiologically identical to wild-type mice, with normal levels of most neuropeptides."
      explanation: >-
        Heterozygous loss is tolerated, consistent with recessive disease.

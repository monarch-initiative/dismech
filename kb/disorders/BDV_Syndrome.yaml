discussions:
- discussion_id: no_disease_specific_therapy
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#
  prompt: >-
    Is there any therapy for BDV syndrome beyond replacement of the deficient
    hormone axes, and does the obesity respond to drugs that act downstream of
    the processing defect, such as melanocortin-4 receptor agonists?
  rationale: >-
    With so few patients reported, no treatment has been studied. Because the
    defect lies in peptide maturation rather than in a receptor, agents that act
    on intact receptors are a reasonable hypothesis, but the mouse data show the
    obesity is not explained by POMC processing alone, so a melanocortin agonist
    may correct only part of the drive to eat.
  evidence:
  - reference: PMID:39777073
    reference_title: "Exploring the therapeutic potential of precision medicine in rare genetic obesity disorders: a scientific perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "those with LEPR, PCSK1, or POMC deficiency can now be treated with the MC4R agonist setmelanotide."
    explanation: >-
      Setmelanotide is approved for the neighbouring processing defect, PCSK1
      deficiency, but not for CPE deficiency, which is the gap recorded here.
- discussion_id: heterozygote_phenotype
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#CPE
  prompt: >-
    Do heterozygous carriers of truncating CPE variants have any metabolic
    phenotype?
  rationale: >-
    Heterozygous null mice are normal and heterozygous relatives of patients are
    reported unaffected, but a heterozygous hypomorphic missense variant was
    associated with earlier type 2 diabetes in one family study. Carrier
    phenotypes have not been systematically examined.
  evidence:
  - reference: PMID:35618016
    reference_title: "Mice heterozygous for a null mutation of CPE show reduced expression of carboxypeptidase e mRNA and enzyme activity but normal physiology, behavior, and levels of neuropeptides."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results indicate that CPE is not a rate-limiting enzyme in the production of most neuropeptides, casting doubt upon studies claiming small decreases in CPE activity contribute to obesity or other physiological effects."
    explanation: >-
      Argues against a heterozygote phenotype, in tension with the human
      missense association.

- name: Defective Prohormone C-Terminal Processing
  biological_scale: CELLULAR
  description: >-
    Without CPE, the C-terminal basic residues left after prohormone convertase
    cleavage are not removed. Most neuropeptides and peptide hormones are
    therefore reduced, and processing intermediates carrying C-terminal lysine or
    arginine, which are undetectable in wild-type tissue, accumulate. Some
    peptides are only partly reduced because carboxypeptidase D can substitute
    for CPE in the trans-Golgi network and immature granules, and about a tenth
    are unaffected. The defect is not confined to one tissue: it affects the
    hypothalamus, pituitary and pancreatic islets, which is why several
    endocrine axes fail together.
  biological_processes:
  - preferred_term: peptide hormone processing
    term:
      id: GO:0016486
      label: peptide hormone processing
    modifier: DECREASED
  - preferred_term: neuropeptide processing
    term:
      id: GO:0061837
      label: neuropeptide processing
    modifier: DECREASED
  cell_types:
  - preferred_term: neuroendocrine cell
    term:
      id: CL:0000165
      label: neuroendocrine cell
  evidence:
  - reference: PMID:19014391
    reference_title: "Peptidomics of Cpe(fat/fat) mouse brain regions: implications for neuropeptide processing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Many peptides were greatly elevated in the Cpe(fat/fat) mice; these peptide processing intermediates with C-terminal Lys and/or Arg were generally not detectable in WT mice."
    explanation: >-
      Accumulation of basic-residue-extended intermediates is the biochemical
      signature of absent CPE.
  - reference: PMID:19014391
    reference_title: "Peptidomics of Cpe(fat/fat) mouse brain regions: implications for neuropeptide processing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Other peptides were only partially reduced in the Cpe(fat/fat) mice, indicating that another enzyme (presumably carboxypeptidase D) contributes to their biosynthesis."
    explanation: >-
      Partial compensation by carboxypeptidase D explains why the defect is
      severe but not complete.
  downstream:
  - target: Impaired Proinsulin Processing
    causal_link_type: DIRECT
  - target: Deficient Anorexigenic Neuropeptide Production
    causal_link_type: DIRECT
  - target: Impaired Pro-GnRH Processing
    causal_link_type: DIRECT
  - target: Impaired Pro-TRH Processing
    causal_link_type: DIRECT
- name: Impaired Proinsulin Processing
  biological_scale: CELLULAR
  description: >-
    In pancreatic beta cells, CPE trims the basic residues left on the
    proinsulin cleavage intermediates. Its loss leaves proinsulin and partly
    processed intermediates in the granule and in the circulation, and in mice
    the beta cells lack mature insulin granules. Elevated proinsulin has been
    measured in a patient. In the mouse, beta-cell-specific Cpe deletion alone
    raises proinsulin without causing obesity or diabetes, so the diabetes of
    the global defect probably also depends on the obesity and other axes.
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: insulin processing
    term:
      id: GO:0030070
      label: insulin processing
    modifier: DECREASED
  evidence:
  - reference: PMID:7663508
    reference_title: "Hyperproinsulinaemia in obese fat/fat mice associated with a carboxypeptidase E mutation which reduces enzyme activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We now demonstrate a defect in proinsulin processing associated with the virtual absence of CPE activity in extracts of fat/fat pancreatic islets and pituitaries."
    explanation: >-
      Establishes the proinsulin processing defect in the CPE-deficient mouse.
  - reference: PMID:37364047
    reference_title: "Deletion of Carboxypeptidase E in β-Cells Disrupts Proinsulin Processing but Does Not Lead to Spontaneous Development of Diabetes in Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Pancreatic β-cell-specific Cpe knockout mice (βCpeKO; Cpefl/fl x Ins1Cre/+) lack mature insulin granules and have elevated proinsulin in plasma; however, glucose-and KCl-stimulated insulin secretion in βCpeKO islets remained intact."
    explanation: >-
      Places the proinsulin defect in the beta cell itself, while showing that
      beta-cell loss alone does not abolish stimulated insulin secretion.
  downstream:
  - target: Elevated Circulating Proinsulin
    causal_link_type: DIRECT
  - target: Glucose Intolerance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Deficient Anorexigenic Neuropeptide Production
  biological_scale: CELLULAR
  description: >-
    CPE is needed to make many of the peptides that restrain feeding and raise
    energy expenditure, among them alpha- and beta-MSH from POMC,
    cholecystokinin, CART peptides and neurotensin. Their combined deficiency
    is thought to drive the hyperphagia and obesity. The obesity is not
    explained by POMC processing alone: mice lacking CPE only in POMC-expressing
    cells are not obese, so peptides made in other brain or peripheral cells must
    contribute.
  locations:
  - preferred_term: hypothalamus
    term:
      id: UBERON:0001898
      label: hypothalamus
  biological_processes:
  - preferred_term: processing of anorexigenic neuropeptides (MSH, CCK, CART, neurotensin)
    term:
      id: GO:0061837
      label: neuropeptide processing
    modifier: DECREASED
  evidence:
  - reference: PMID:26120850
    reference_title: "Truncating Homozygous Mutation of Carboxypeptidase E (CPE) in a Morbidly Obese Female with Type 2 Diabetes Mellitus, Intellectual Disability and Hypogonadotrophic Hypogonadism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The absence of functional CPE in mice also directly impairs the processing of many other anorexigenic hormones and neuropeptides including cholecystokinin, proinsulin, and proglucagon [4, 7, 11, 38, 39]."
    explanation: >-
      Summarizes the mouse evidence that CPE loss depletes several anorexigenic
      peptides.
    quote_role: BACKGROUND
  - reference: PMID:9275097
    reference_title: "Cholecystokinin (CCK) levels are greatly reduced in the brains but not the duodenums of Cpe(fat)/Cpe(fat) mice: a regional difference in the involvement of carboxypeptidase E (Cpe) in pro-CCK processing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Levels of amidated CCK were decreased by about 74% in whole brain of Cpe(fat)/Cpe(fat) mice in comparison to control mice, while levels of amidated CCK in intestine were only reduced by about 36%."
    explanation: >-
      Measures the loss of a satiety peptide, cholecystokinin, in the
      CPE-deficient brain.
  - reference: PMID:34333593
    reference_title: "Obesity, POMC, and POMC-processing Enzymes: Surprising Results From Animal Models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "We propose that obesity in animals lacking PC1/3 or CPE activity depends, at least in part, on deficient processing of peptides in non-POMC-expressing cells either in the brain and/or the periphery."
    explanation: >-
      Restricts the claim: the obesity-relevant peptide deficit extends beyond
      POMC neurons, which is why this node is not bound to POMC neurons alone.
  downstream:
  - target: Hyperphagia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:26120850
      reference_title: "Truncating Homozygous Mutation of Carboxypeptidase E (CPE) in a Morbidly Obese Female with Type 2 Diabetes Mellitus, Intellectual Disability and Hypogonadotrophic Hypogonadism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Therefore, the homozygous null mutation in the CPE gene is a plausible explanation for the proband’s hyperphagia and obesity, with multiple hormones/neuropeptides likely to be involved in the pathogenesis."
      explanation: >-
        Attributes the patient's hyperphagia and obesity to deficient
        processing of multiple hormones and neuropeptides.
- name: Impaired Pro-GnRH Processing
  biological_scale: CELLULAR
  description: >-
    Gonadotropin-releasing hormone is made from a precursor that requires CPE
    for its final processing. In Cpe fat/fat mice hypothalamic GnRH is reduced
    by roughly two thirds and C-terminally extended intermediates accumulate.
    Patients have low gonadotropins with low sex steroids. How much of the
    human hypogonadism this explains is open: in male mice the infertility owes
    more to abnormal sexual behaviour than to the gonadal axis.
  cell_types:
  - preferred_term: hypothalamic gonadotropin-releasing hormone neuron
    term:
      id: CL:0011111
      label: hypothalamic gonadotropin-releasing hormone neuron
  biological_processes:
  - preferred_term: peptide hormone processing
    term:
      id: GO:0016486
      label: peptide hormone processing
    modifier: DECREASED
  evidence:
  - reference: PMID:14715715
    reference_title: "Deficits in reproduction and pro-gonadotropin-releasing hormone processing in male Cpefat mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We have evaluated this hypothesis and found hypothalamic GnRH levels to be reduced by 65-78% and concentrations of pro-GnRH and C-terminal-extended intermediates to be high."
    explanation: >-
      Direct measurement of the pro-GnRH processing defect in CPE-deficient
      mice.
  - reference: PMID:14715715
    reference_title: "Deficits in reproduction and pro-gonadotropin-releasing hormone processing in male Cpefat mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Together, these findings show that CPE is a key enzyme for pro-GnRH processing in vivo; however, the reproductive deficits in Cpe(fat/fat) males appear to be due primarily to abnormal sexual behavior."
    explanation: >-
      Confirms the processing role and records the caveat that, in male mice,
      the reproductive failure is mainly behavioural.
  downstream:
  - target: Hypogonadotropic Hypogonadism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Impaired Pro-TRH Processing
  biological_scale: CELLULAR
  description: >-
    Thyrotropin-releasing hormone is cut from pro-TRH and trimmed by CPE. In Cpe
    fat/fat mice hypothalamic TRH falls by at least three quarters, extended
    TRH forms accumulate, thyroid hormone is reduced and the animals cannot
    maintain body temperature in the cold. This is the likely basis of the
    central hypothyroidism seen in most patients.
  cell_types:
  - preferred_term: parvocellular neurosecretory cell of the paraventricular nucleus
    term:
      id: CL:1001505
      label: parvocellular neurosecretory cell
  biological_processes:

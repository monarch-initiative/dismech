pathophysiology:
- name: CPE Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic truncating CPE variants (frameshift and nonsense) remove
    carboxypeptidase E. In the index patient no CPE transcript was detectable in
    blood RNA, consistent with nonsense-mediated decay. CPE is a zinc
    metallocarboxypeptidase that is enriched in the dense-core secretory granules
    of endocrine and neuroendocrine cells and is activated as the granule
    acidifies.
  genes:
  - preferred_term: CPE
    term:
      id: hgnc:2303
      label: CPE
  molecular_functions:
  - preferred_term: carboxypeptidase E metallocarboxypeptidase activity
    term:
      id: GO:0004181
      label: metallocarboxypeptidase activity
    modifier: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: neuroendocrine cell
    term:
      id: CL:0000165
      label: neuroendocrine cell
  evidence:
  - reference: PMID:26120850
    reference_title: "Truncating Homozygous Mutation of Carboxypeptidase E (CPE) in a Morbidly Obese Female with Type 2 Diabetes Mellitus, Intellectual Disability and Hypogonadotrophic Hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis detected no CPE expression in whole blood-derived RNA from the proband, consistent with nonsense-mediated decay."
    explanation: >-
      The founding human variant abolishes CPE expression, establishing loss of
      function as the molecular lesion.
  - reference: PMID:34383079
    reference_title: "BDV Syndrome: An Emerging Syndrome With Profound Obesity and Neurodevelopmental Delay Resembling Prader-Willi Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three individuals from 2 families shared the same CPE homozygous truncating variant c.361C > T, p.(Arg121*), while the fourth carried the c.994del, p.(Ser333Alafs*22) variant."
    explanation: >-
      Further affected individuals all carry homozygous truncating CPE variants.
  downstream:
  - target: Defective Prohormone C-Terminal Processing
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19014391
      reference_title: "Peptidomics of Cpe(fat/fat) mouse brain regions: implications for neuropeptide processing."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Most secretory pathway peptides were much lower in Cpe(fat/fat) mouse brain, relative to WT mouse brain, indicating that CPE plays a major role in their biosynthesis."
      explanation: >-
        Loss of CPE activity in the mouse lowers most mature secretory pathway
        peptides, the direct consequence of the enzyme defect.
  - target: Hippocampal Neurodegeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:18570185
      reference_title: "Absence of carboxypeptidase E leads to adult hippocampal neuronal degeneration and memory deficits."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "CPE-KO mice at 4 weeks of age and older, but not at 3 weeks of age, exhibited marked degeneration specifically of the pyramidal neurons in the hippocampal CA3 region which normally expresses high levels of CPE."
      explanation: >-
        Absence of CPE in the mouse is followed by degeneration of hippocampal
        CA3 pyramidal neurons. The quote does not say whether loss of enzyme
        activity or of CPE's neurotrophic role is responsible, which is why the
        link is marked as having unknown intermediates.
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

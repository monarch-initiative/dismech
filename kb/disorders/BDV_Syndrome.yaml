      snippet: "When Cpe(fat/fat) mice are exposed to cold, they cannot maintain their body temperatures, and this loss is associated with hypothalamic TRH depletion and reduction in thyroid hormone."
      explanation: >-
        Links hypothalamic TRH depletion to reduced thyroid hormone, the
        central form of hypothyroidism.
- name: Hippocampal Neurodegeneration
  biological_scale: TISSUE
  description: >-
    Besides its enzymatic role, CPE (also called neurotrophic factor-alpha1)
    supports neuron survival. Cpe knockout mice develop degeneration of the
    hippocampal CA3 pyramidal neurons from four weeks of age, with gliosis,
    absent long-term potentiation and memory deficits, and a neuron-specific
    knockout reproduces the learning and memory deficits without obesity or
    altered glucose metabolism. This is the leading mouse explanation for the
    intellectual disability, but it has not been examined in patients, and
    whether it depends on the enzyme activity or the non-enzymatic
    neurotrophic function is not settled.
  cell_types:
  - preferred_term: hippocampal CA3 pyramidal neuron
    term:
      id: CL:1001571
      label: hippocampal pyramidal neuron
  locations:
  - preferred_term: hippocampal formation
    term:
      id: UBERON:0002421
      label: hippocampal formation
  biological_processes:
  - preferred_term: hippocampal CA3 pyramidal neuron degeneration
    term:
      id: GO:0008219
      label: cell death
    modifier: INCREASED
  evidence:
  - reference: PMID:18570185
    reference_title: "Absence of carboxypeptidase E leads to adult hippocampal neuronal degeneration and memory deficits."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Additionally, CPE-KO mice at 4 weeks of age and older, but not at 3 weeks of age, exhibited marked degeneration specifically of the pyramidal neurons in the hippocampal CA3 region which normally expresses high levels of CPE."
    explanation: >-
      Shows CA3 pyramidal neuron degeneration in mice lacking CPE.
  - reference: PMID:37100779
    reference_title: "Carboxypeptidase E conditional knockout mice exhibit learning and memory deficits and neurodegeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Taken together, the results of this study demonstrate that specific neuronal CPE knockout leads to central nervous system dysfunction in mice, including learning and memory deficits, hippocampal Sub degeneration and impaired neurogenesis."
    explanation: >-
      Neuron-restricted loss of CPE is sufficient for neurodegeneration and
      cognitive deficits, separating them from the metabolic phenotype.
  downstream:
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:18570185
      reference_title: "Absence of carboxypeptidase E leads to adult hippocampal neuronal degeneration and memory deficits."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings taken together indicate that CPE is essential for the survival of adult hippocampal CA3 neurons to maintain normal cognitive function."
      explanation: >-
        Mouse evidence connecting CPE-dependent neuron survival to cognition;
        the step to human intellectual disability is an inference.

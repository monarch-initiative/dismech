      reference_title: "A New Cause of Obesity Syndrome Associated with a Mutation in the Carboxypeptidase Gene Detected in Three Siblings with Obesity, Intellectual Disability and Hypogonadotropic Hypogonadism."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cases presented in this study showed severe neurodevelopmental delay that may be linked to a loss of enzymatic activity of CPE and may be linked to defective cortical neuron development."
      explanation: >-
        The authors attribute the siblings' neurodevelopmental delay to loss of

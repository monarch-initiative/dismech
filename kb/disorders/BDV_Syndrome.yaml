    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Hypothalamic TRH is depressed by at least 75% compared with wild-type controls."
    explanation: >-
      Measures the TRH deficit caused by CPE loss in the mouse hypothalamus.
  downstream:
  - target: Central Hypothyroidism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:12270926
      reference_title: "Deficiencies in pro-thyrotropin-releasing hormone processing and abnormalities in thermoregulation in Cpefat/fat mice."
      supports: SUPPORT

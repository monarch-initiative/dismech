pathophysiology:
- name: Allele-Specific UBA1 Dysfunction
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    SMAX2-associated hemizygous variants cluster in exon 15 near the active
    adenylation domain, but they do not share one demonstrated biochemical defect.
    The recurrent synonymous c.1731C>T allele reduces UBA1 expression. In vitro,
    p.Met539Ile and p.Ser547Gly did not show statistically reduced adenylation,
    whereas p.Glu557Val showed a moderate reduction. The initiating lesion is
    therefore modeled as allele-specific UBA1 dysfunction rather than uniform
    adenylation failure or complete loss of UBA1 function.
  evidence:
  - reference: PMID:18179898
    reference_title: "Rare missense and synonymous variants in UBE1 are associated with X-linked infantile spinal muscular atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This resulted in detection of three rare novel variants in exon 15 of UBE1 that segregate with disease"
    explanation: Identifies UBA1 (UBE1) exon 15 variants segregating with XL-SMA as the disease-causing lesion.
  - reference: PMID:39762237
    reference_title: "A novel UBA1 gene mutation in a patient with infantile respiratory distress syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "UBA1 is an E1 ubiquitin-activating enzyme that initiates the ubiquitylation of target proteins and is thus a key component of the ubiquitin signaling pathway."
    explanation: Defines UBA1 as the E1 ubiquitin-activating enzyme that initiates ubiquitylation.
  - reference: PMID:39762237
    reference_title: "A novel UBA1 gene mutation in a patient with infantile respiratory distress syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This missense mutation was located with the AAD (active adenylation domain) of the protein, a known hotspot of SMAX2 mutations."
    explanation: Locates SMAX2 mutations in the active adenylation domain of UBA1.
  - reference: PMID:18179898
    reference_title: "Rare missense and synonymous variants in UBE1 are associated with X-linked infantile spinal muscular atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also demonstrated that the synonymous C-->T substitution leads to significant reduction of UBE1 expression and alters the methylation pattern of exon 15"
    explanation: Directly supports reduced expression for the recurrent synonymous allele, not a blanket loss-of-function assignment for every missense allele.
  - reference: PMID:29034082
    reference_title: "Functional characterizations of rare UBA1 variants in X-linked Spinal Muscular Atrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Missense variants p.M539I and p.S547G showed no statistically-reduced adenylation activity, despite their locations in the well-conserved AAD, while variant p.E557V showed a moderate decrease in activity"
    explanation: Directly distinguishes the preserved adenylation of p.Met539I/p.Ser547Gly from the moderate p.Glu557Val defect.
  downstream:
  - target: Candidate UBA1-Dependent Cellular Dysregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Different alleles may perturb splicing, binding partners, ubiquitin handling, or other UBA1-dependent processes through mechanisms not yet established in patient tissue.
- name: Candidate UBA1-Dependent Cellular Dysregulation
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    UBA1 is the initiating enzyme of the ubiquitin cascade, but human SMAX2 tissue
    has not shown a uniform decrease in ubiquitination or proteasomal degradation.
    Variant biochemistry instead points to allele-specific effects and possible
    non-catalytic mechanisms such as altered splicing or binding partners. This
    node keeps those candidate cellular routes explicit without projecting the
    decreased ubiquitination seen after experimental knockdown onto human pathology.
  evidence:
  - reference: PMID:23151135
    reference_title: "Targeting the ubiquitin E1 as a novel anti-cancer strategy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "UBA1 is the initial enzyme in the ubiquitination cascade and initiates the transfer of ubiquitin molecules to target proteins where they are degraded by the proteasome."
    explanation: Establishes UBA1 as the apex enzyme whose activity gates proteasomal degradation of ubiquitinated proteins.
  - reference: PMID:32315770
    reference_title: "The pivotal role of ubiquitin-activating enzyme E1 (UBA1) in neuronal health and neurodegeneration."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "UBA1 is thus of fundamental importance to the modulation of ubiquitin homeostasis and to all downstream ubiquitylation-dependent cellular processes, including proteolysis through the ubiquitin-proteasome system and selective autophagy."
    explanation: Links UBA1 impairment to disruption of ubiquitin homeostasis and ubiquitin-proteasome proteolysis.
  - reference: PMID:29034082
    reference_title: "Functional characterizations of rare UBA1 variants in X-linked Spinal Muscular Atrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results demonstrate a surprising shift from the likelihood of these XL-SMA mutations playing a damaging role in Uba1's enzymatic activity with Ubiquitin, to other roles such as altering UBA1 mRNA splicing via the disruption of splicing factor binding sites, similar to a mechanism in traditional SMA, or disrupting binding to other important in vivo binding partners."
    explanation: Supports keeping alternative allele-specific cellular routes open rather than asserting one ubiquitination-deficiency mechanism.
  downstream:
  - target: Anterior Horn Motor Neuron Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Human anterior-horn pathology is established, but the intervening allele-specific UBA1 mechanism is unknown.
  - target: Sensory Neuron and Tract Pathology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Human sensory involvement forms a separate branch from anterior-horn motor-neuron degeneration; its UBA1-dependent route is unknown.
  - target: Cerebellar Developmental and Degenerative Abnormalities
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Cerebellar pathology was observed in one detailed human autopsy, but its relationship to specific UBA1 alleles is unresolved.
  - target: Skeletal Muscle-Autonomous Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Muscle-targeted knockdown supports a parallel model-only tissue-autonomous branch whose fidelity to human SMAX2 remains untested.

genetic:
- name: UBA1
  association: Causative
  inheritance:
  - name: X-linked recessive inheritance
    inheritance_term:
      preferred_term: X-linked recessive inheritance
      term:
        id: HP:0001419
        label: X-linked recessive inheritance
  gene_term:
    preferred_term: UBA1
    term:
      id: hgnc:12469
      label: UBA1
  notes: >-
    UBA1 (ubiquitin-like modifier activating enzyme 1), the E1 ubiquitin-activating
    enzyme, on Xp11.3. Hemizygous pathogenic variants cluster in exon 15 / the
    active adenylation domain (e.g. p.Met539Ile, p.Ser547Gly, the c.1731C>T
    synonymous variant reducing expression). The synonymous allele has direct
    expression evidence; missense alleles are associated with altered structure or
    activity near the adenylation/ATP-binding region, so a uniform complete
    loss-of-function label is not assigned across all variants.
  evidence:
  - reference: PMID:18179898
    reference_title: "Rare missense and synonymous variants in UBE1 are associated with X-linked infantile spinal muscular atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two missense mutations (c.1617 G-->T, p.Met539Ile; c.1639 A-->G, p.Ser547Gly) present each in one XL-SMA family, and one synonymous C-->T substitution (c.1731 C-->T, p.Asn577Asn) identified in another three unrelated families"
    explanation: Identifies the causative UBA1 (UBE1) variants segregating with XL-SMA.
  - reference: PMID:18179898
    reference_title: "Rare missense and synonymous variants in UBE1 are associated with X-linked infantile spinal muscular atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "XL-SMA is part of a growing list of neurodegenerative disorders associated with defects in the ubiquitin-proteasome pathway"
    explanation: Places XL-SMA among ubiquitin-proteasome pathway neurodegenerative disorders without proving one identical biochemical consequence for all variants.
differential_diagnoses:
- name: SMN1-Related Proximal Spinal Muscular Atrophy
  description: >-
    Severe SMN1-related SMA can present with congenital or infantile hypotonia,
    areflexia, weakness, and motor-neuron loss. It is autosomal recessive and
    caused by biallelic SMN1 disruption, whereas SMAX2 is diagnosed through a
    hemizygous UBA1 pathogenic variant in a male. Arthrogryposis and fractures are
    especially useful SMAX2 clues but are not by themselves molecular diagnoses.
  distinguishing_features:
  - X-linked recessive inheritance (affected males) and UBA1 variants favor SMAX2; autosomal recessive SMN1 disruption favors proximal SMA.
  - Prominent congenital arthrogryposis and perinatal fractures favor SMAX2.
  - Normal SMN1 in SMAX2 versus biallelic SMN1 loss in proximal SMA.
  disease_term:
    preferred_term: spinal muscular atrophy
    term:
      id: MONDO:0001516
      label: spinal muscular atrophy
  evidence:
  - reference: PMID:18572081
    reference_title: "Spinal muscular atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is caused by homozygous disruption of the survival motor neuron 1 (SMN1) gene by deletion, conversion, or mutation."
    explanation: Supports the distinct SMN1 genetic basis of proximal SMA.
- name: Kennedy Disease
  description: >-
    Kennedy disease (X-linked spinal and bulbar muscular atrophy, SBMA) is also an
    X-linked lower motor neuron disease, but is adult-onset and caused by an
    androgen-receptor (AR) CAG trinucleotide repeat expansion, not an infantile
    exon-15 UBA1 variant, and lacks
    the congenital arthrogryposis and infantile lethality of SMAX2.
  distinguishing_features:
  - Adult midlife onset in Kennedy disease versus congenital/infantile onset in SMAX2.
  - AR CAG expansion versus an SMAX2-associated UBA1 variant.
  - Absence of congenital contractures/arthrogryposis in Kennedy disease.
  disease_term:
    preferred_term: Kennedy disease
    term:
      id: MONDO:0010735
      label: Kennedy disease
  evidence:
  - reference: PMID:35996994
    reference_title: "Identification of UBA1 as the causative gene of an X-linked non-Kennedy spinal-bulbar muscular atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Kennedy's disease is nearly exclusively caused by mutations in the androgen receptor encoding gene (AR)."
    explanation: Supports the distinct AR genetic basis of Kennedy disease.
- name: X-Linked Distal Spinal Muscular Atrophy Type 3
  description: >-
    SMAX3 is an ATP7A-related distal hereditary motor neuropathy with progressive
    distal weakness and atrophy. It is distinguished from congenital SMAX2 by its
    ATP7A basis, distal distribution, and generally later, slower course.
  distinguishing_features:
  - Pathogenic ATP7A variants favor SMAX3; pathogenic UBA1 variants favor SMAX2.
  - Distal progressive gait and hand/foot involvement favor SMAX3 over congenital generalized weakness with arthrogryposis.
  disease_term:
    preferred_term: X-linked distal spinal muscular atrophy type 3
    term:
      id: MONDO:0010338
      label: X-linked distal spinal muscular atrophy type 3
  evidence:
  - reference: PMID:25639447
    reference_title: "X-linked spinal muscular atrophy in mice caused by autonomous loss of ATP7A in the motor neuron."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "rare missense mutations in ATP7A that do not impact systemic copper homeostasis have been shown to cause X-linked spinal muscular atrophy type 3 (SMAX3), a distal hereditary motor neuropathy."
    explanation: Supports the ATP7A genetic basis and distal motor-neuropathy classification that distinguish SMAX3.
- name: UBA1-Related Non-Kennedy Spinal-Bulbar Muscular Atrophy
  description: >-
    A separate adult-onset X-linked spinal-bulbar phenotype has been reported in a
    family with UBA1 p.Ile500Thr. Shared gene identity does not make that adult
    phenotype SMAX2: age at onset, bulbar distribution, variant position, and lack
    of congenital arthrogryposis define an important allelic boundary.
  distinguishing_features:
  - Adult spinal-bulbar presentation versus prenatal/neonatal SMAX2 presentation.
  - UBA1 p.Ile500Thr in the reported adult pedigree versus the exon-15/AAD cluster typical of infantile SMAX2.
  evidence:
  - reference: PMID:35996994
    reference_title: "Identification of UBA1 as the causative gene of an X-linked non-Kennedy spinal-bulbar muscular atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A missense mutation in UBA1 (c.T1499C; p.Ile500Thr) was identified as the probable cause of the non-Kennedy SBMA in the pedigree."
    explanation: Supports a distinct UBA1-related non-Kennedy spinal-bulbar phenotype rather than extending SMAX2 indiscriminately to adult disease.
- name: Spinal Muscular Atrophy with Respiratory Distress Type 1
  description: >-
    SMARD1 is an autosomal recessive IGHMBP2 disorder with early respiratory
    failure and motor weakness. Diaphragmatic palsy and distal-predominant weakness
    favor SMARD1; congenital arthrogryposis/fractures, X-linked segregation, and a
    hemizygous UBA1 variant favor SMAX2.
  distinguishing_features:
  - Biallelic IGHMBP2 variants and autosomal recessive inheritance favor SMARD1.
  - Early diaphragmatic palsy with distal weakness favors SMARD1.
  disease_term:
    preferred_term: spinal muscular atrophy with respiratory distress type 1
    term:
      id: MONDO:0011436
      label: autosomal recessive distal spinal muscular atrophy 1
  evidence:
  - reference: PMID:11528396
    reference_title: "Mutations in the gene encoding immunoglobulin mu-binding protein 2 cause spinal muscular atrophy with respiratory distress type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we demonstrate that SMARD type 1 (SMARD1) results from mutations in the gene encoding immunoglobulin micro-binding protein 2 (IGHMBP2; on chromosome 11q13.2-q13.4)."
    explanation: Supports the distinct IGHMBP2 genetic basis of SMARD1.
diagnosis:
- name: Clinical Recognition and UBA1 Molecular Confirmation
  description: >-
    In a male with congenital hypotonia, areflexia, weakness, contractures and/or
    fractures, diagnosis is established by identifying a hemizygous pathogenic
    UBA1 variant. Testing must not stop at a negative SMN1 result when the SMAX2
    pattern is present.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:20301739
    reference_title: "Spinal Muscular Atrophy, X-Linked Infantile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of X-linked infantile spinal muscular atrophy is established in a male proband with suggestive clinical features and a hemizygous pathogenic variant in UBA1 identified by molecular genetic testing."
    explanation: Gives the exact clinical-plus-molecular diagnostic criterion.
- name: Family Variant Testing and Reproductive Testing
  description: >-
    Once a familial UBA1 pathogenic variant is known, test at-risk female relatives;
    prenatal and preimplantation genetic testing are possible. Counseling should
    also explain that de novo variants occur and that heterozygous females are
    usually, not necessarily invariably, unaffected.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301739
    reference_title: "Spinal Muscular Atrophy, X-Linked Infantile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once the UBA1 pathogenic variant has been identified in an affected family member, carrier testing for at risk female relatives and prenatal and preimplantation genetic testing are possible."
    explanation: Supports cascade carrier testing and reproductive testing after variant identification.
treatments:
- name: Respiratory and Airway Support
  description: >-
    Use airway-clearance and secretion-management techniques with noninvasive
    ventilatory support when possible; permanent invasive ventilation may be
    considered according to goals of care. This is supportive treatment, not an
    SMN-directed disease-modifying therapy.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301739
    reference_title: "Spinal Muscular Atrophy, X-Linked Infantile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "provide rigorous airway clearance techniques, secretion management, and, ideally, noninvasive ventilatory support, although tracheostomy with permanent mechanical ventilation can be considered"
    explanation: Supports the respiratory management measures listed here.
- name: Nutrition and Feeding Support
  description: Ensure adequate calories with supplementation and/or gastrostomy feeding when needed; monitor swallowing, reflux, constipation, and aspiration risk.
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  evidence:
  - reference: PMID:20301739
    reference_title: "Spinal Muscular Atrophy, X-Linked Infantile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Assure adequate caloric intake by caloric supplementation and/or gastrostomy feedings"
    explanation: Supports active nutritional assessment and enteral support when needed.
- name: Orthopedic and Rehabilitation Care
  description: Orthopedic follow-up plus physical and occupational therapy for contractures and progressive scoliosis.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:20301739
    reference_title: "Spinal Muscular Atrophy, X-Linked Infantile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Orthopedic consultation and physical and occupational therapy to manage contractures and progressive scoliosis."
    explanation: Supports multidisciplinary orthopedic and rehabilitation management.
- name: Genetic Counseling
  description: Counsel families about X-linked transmission, the possibility of de novo variants, testing of at-risk relatives, and reproductive options.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301739
    reference_title: "Spinal Muscular Atrophy, X-Linked Infantile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

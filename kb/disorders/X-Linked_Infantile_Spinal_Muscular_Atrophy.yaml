- phase: Classic severe infantile course
  age_range: Birth through infancy
  notes: >-
    Classic reported cases show congenital weakness and contractures followed by
    progressive respiratory failure and early death, but this should not be read as
    a universal survival estimate for every UBA1 genotype.
  evidence:
  - reference: PMID:23518311
    reference_title: "Clinical and neuropathological features of X-linked spinal muscular atrophy (SMAX2) associated with a novel mutation in the UBA1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He died from progressive respiratory failure at 4 months."
    explanation: Provides a directly observed severe natural-history example without converting a single case into a population survival rate.
- phase: Broader recognized spectrum
  age_range: Infancy through adulthood
  notes: >-
    Molecularly confirmed families include a mild, nonprogressive branch with
    autonomous adult survival as well as longer-surviving children with expanded
    manifestations. Lethal neonatal or early-infantile presentation is therefore
    not an adequate ascertainment definition, and prognosis should be interpreted
    allele by allele and family by family.

name: X-Linked Infantile Spinal Muscular Atrophy
creation_date: "2026-06-26T00:00:00Z"
category: Mendelian
description: >-
  X-linked infantile spinal muscular atrophy (XL-SMA; SMAX2; X-linked spinal
  muscular atrophy with arthrogryposis) is a rare UBA1-related neuromuscular
  disorder. Classic cases are hemizygous males with prenatal or neonatal onset of
  reduced fetal movement, severe hypotonia, areflexia, weakness, arthrogryposis,
  fractures, and progressive ventilatory failure. Most reported familial cases
  follow X-linked transmission through usually unaffected heterozygous females,
  although de novo hemizygous variants also occur. Human neuropathology confirms
  severe ventral/anterior-horn motor-neuron loss; one detailed autopsy also found
  sensory-system and cerebellar involvement, arguing that SMAX2 need not be a pure
  anterior-horn-cell disorder. UBA1 initiates ubiquitination, and the original
  synonymous allele reduces UBA1 expression, but the tissue and downstream pathway
  that determine selective neuromuscular injury remain unsettled. Model-organism
  work supports both neuronal proteostasis and muscle-autonomous contributions.
  SMAX2 is distinct from SMN1-related proximal SMA, AR-related Kennedy disease,
  ATP7A-related X-linked distal SMA type 3, and the recently described adult-onset
  UBA1-related non-Kennedy spinal-bulbar muscular atrophy.

    explanation: Supports counseling about recurrence risk for a heterozygous female.
discussions:
- discussion_id: gap_smax2_selective_tissue_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which UBA1-dependent substrates and cell types drive human SMAX2: motor and
    sensory neurons, skeletal muscle, or a combination, and how do individual
    exon-15 alleles alter those pathways?
  rationale: >-
    Human evidence establishes the variants, reduced expression for one synonymous
    allele, and neuronal pathology. Muscle-targeted knockdown now recapitulates key
    features in Drosophila and mice, but direct measurements in patient-derived
    motor neurons and muscle are missing. Treating proteasome failure as one settled
    motor-neuron-only chain would overstate the evidence.
  attaches_to:
  - pathophysiology#UBA1 E1 Ubiquitin-Activation Deficiency
  - pathophysiology#Impaired Ubiquitin-Proteasome Proteostasis
  - pathophysiology#Anterior Horn Motor Neuron Degeneration
  - pathophysiology#Skeletal Muscle-Autonomous Dysfunction
  evidence:
  - reference: PMID:42402962
    reference_title: "UBA1 knockdown dysregulates the levels of UBA1-sensitive proteins and impairs muscle function in Drosophila and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, it remains unexplored how UBA1 impacts the muscle proteome, and whether muscle weakness can arise from reducing UBA1 function solely in skeletal muscle."
    explanation: States the motivating tissue-mechanism question addressed in models but not yet resolved in human SMAX2.
- discussion_id: gap_smax2_sex_specific_ascertainment_and_prevalence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What are genotype-specific birth prevalence, survival, and penetrance in
    heterozygous females, including the role of X-inactivation and de novo variants?
  rationale: >-
    Reports are dominated by severely affected hemizygous male probands and
    multiplex families, while GeneReviews states that heterozygous females are
    usually unaffected and a recent case was de novo. This design cannot provide an
    unbiased female penetrance estimate, sex-specific rate, or genotype-specific
    natural history.
  attaches_to:
  - pathophysiology#UBA1 E1 Ubiquitin-Activation Deficiency
  evidence:
  - reference: PMID:20301739
    reference_title: "Spinal Muscular Atrophy, X-Linked Infantile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "females who inherit the pathogenic variant will be heterozygotes and will usually not be affected."
    explanation: The qualifier "usually" leaves female penetrance and modifiers unresolved.

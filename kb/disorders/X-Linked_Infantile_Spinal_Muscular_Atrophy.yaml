- name: Severe Neuromuscular Weakness and Hypotonia
  biological_scale: ORGANISM
  description: >-
    Lower-motor-neuron loss and denervation contribute to the severe congenital
    hypotonia, areflexia, and weakness of classic SMAX2. Progressive chest-muscle
    involvement produces ventilatory insufficiency. Model data leave open an
    additional muscle-autonomous contribution to weakness.
  cell_types:
  - preferred_term: Motor Neuron
    term:
      id: CL:0000100
      label: motor neuron
  evidence:
  - reference: PMID:20301739

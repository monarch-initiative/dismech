discussions:
- discussion_id: gap_smax2_human_model_allele_and_tissue_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do generic UBA1 knockdown models reproduce the allele-specific human SMAX2
    mechanism in motor neurons, sensory neurons, cerebellar cells, and skeletal
    muscle, given that p.Met539Ile and p.Ser547Gly retain adenylation activity
    whereas p.Glu557Val does not?
  rationale: >-
    Muscle-targeted UBA1 knockdown in Drosophila and mice reduces ubiquitination
    and muscle function, but it does not model a specific human exon-15 allele.
    Human biochemical assays show heterogeneous effects across missense variants,
    and patient tissue establishes motor, sensory, and cerebellar pathology without
    demonstrating reduced ubiquitination. The model result is therefore evidence
    for a testable muscle-autonomous route, not proof of the human mechanism.
  attaches_to:
  - pathophysiology#Allele-Specific UBA1 Dysfunction
  - pathophysiology#Candidate UBA1-Dependent Cellular Dysregulation
  - pathophysiology#Anterior Horn Motor Neuron Degeneration
  - pathophysiology#Sensory Neuron and Tract Pathology
  - pathophysiology#Skeletal Muscle-Autonomous Dysfunction
  proposed_experiments:
  - experiment_id: exp_smax2_isogenic_allele_tissue_panel
    name: Isogenic human SMAX2 allele-by-cell-type panel
    description: >-
      Introduce p.Met539Ile, p.Ser547Gly, p.Glu557Val, and c.1731C>T separately
      into one human iPSC background, differentiate matched motor neurons, sensory
      neurons, and skeletal muscle fibers, and compare them with corrected
      patient-derived lines and wild-type controls.
    experiment_type:
      preferred_term: isogenic iPSC allele-by-cell-type experiment
    model_systems:
    - name: Isogenic human iPSC-derived motor, sensory, and skeletal-muscle models
      description: Allele-matched human cultures tested separately and in motor-unit co-culture.
      experimental_model_type: IPSC_DERIVED_MODEL
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      cell_types:
      - preferred_term: motor neuron
        term:
          id: CL:0000100
          label: motor neuron
      - preferred_term: sensory neuron
        term:
          id: CL:0000101
          label: sensory neuron
      - preferred_term: skeletal muscle fiber
        term:
          id: CL:0008002
          label: skeletal muscle fiber
    readouts:
    - name: Allele-specific UBA1 reaction kinetics and ubiquitin conjugation
      target: pathophysiology#Allele-Specific UBA1 Dysfunction
      description: Measure adenylation, thioester formation, E2 transfer, global and substrate-specific ubiquitination, and proteasome flux in each cell type.
    - name: Cell-type injury and function
      target: pathophysiology#Candidate UBA1-Dependent Cellular Dysregulation
      description: Measure neuronal survival and axonal integrity, neuromuscular-junction formation, muscle contractility, and transcript splicing.
    decision_criterion: >-
      A human mechanism is supported only if an allele-specific molecular defect
      reproducibly precedes injury in the clinically implicated cell type; failure
      of knockdown-like ubiquitination changes in p.Met539Ile or p.Ser547Gly would
      refute a uniform adenylation/ubiquitination-deficiency model.
    would_support:
    - pathophysiology#Allele-Specific UBA1 Dysfunction
    - pathophysiology#Candidate UBA1-Dependent Cellular Dysregulation
    would_refute:
    - pathophysiology#Skeletal Muscle-Autonomous Dysfunction
  - experiment_id: exp_smax2_patient_tissue_ubiquitinome
    name: Genotype-resolved human SMAX2 multi-tissue profiling
    description: >-
      Prospectively collect fibroblasts, blood, clinically obtained muscle, and
      postmortem nervous tissue across severe and mild SMAX2 alleles, with matched
      neurologic disease and unaffected controls, and profile UBA1 isoforms,
      splicing, binding partners, ubiquitin conjugates, proteasome flux, and
      tissue pathology.
    experiment_type:
      preferred_term: genotype-resolved human multi-tissue study
    model_systems:
    - name: Human SMAX2 patient tissues and primary cultures
      description: Patient material stratified by UBA1 allele and clinical severity.
      experimental_model_type: PRIMARY_CELL_CULTURE
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    readouts:
    - name: Tissue-specific UBA1 mechanism
      target: pathophysiology#Candidate UBA1-Dependent Cellular Dysregulation
      description: Identify whether altered splicing, binding partners, ubiquitination, or proteasome flux co-segregates with tissue injury and allele severity.
    decision_criterion: >-
      Concordant allele- and tissue-specific molecular changes in human material
      must match the affected motor, sensory, cerebellar, or muscle compartment
      before an animal-knockdown mechanism is promoted to a human causal claim.
    would_support:
    - pathophysiology#Anterior Horn Motor Neuron Degeneration
    - pathophysiology#Sensory Neuron and Tract Pathology
    - pathophysiology#Cerebellar Developmental and Degenerative Abnormalities
    - pathophysiology#Skeletal Muscle-Autonomous Dysfunction
  evidence:
  - reference: PMID:42402962
    reference_title: "UBA1 knockdown dysregulates the levels of UBA1-sensitive proteins and impairs muscle function in Drosophila and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, it remains unexplored how UBA1 impacts the muscle proteome, and whether muscle weakness can arise from reducing UBA1 function solely in skeletal muscle."
    explanation: States the motivating tissue-mechanism question addressed in models but not yet resolved in human SMAX2.
  - reference: PMID:29034082
    reference_title: "Functional characterizations of rare UBA1 variants in X-linked Spinal Muscular Atrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data revealed that only one of the three XL-SMA missense variants impairs the Ubiquitin-adenylating ability of Uba1."
    explanation: The allele-specific biochemical result establishes why generic UBA1 knockdown cannot be assumed to model every human SMAX2 allele.
- discussion_id: gap_smax2_sex_specific_ascertainment_and_prevalence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What are genotype-specific birth prevalence, survival, and penetrance in
    heterozygous females, including the role of X-inactivation and de novo variants?
  rationale: >-
    Reports are dominated by severely affected hemizygous male probands and
    multiplex families, while GeneReviews states that heterozygous females are
    usually unaffected and a recent case was de novo. This design cannot provide an
    unbiased female penetrance estimate, sex-specific rate, or genotype-specific
    natural history.
  attaches_to:
  - pathophysiology#Allele-Specific UBA1 Dysfunction
  evidence:
  - reference: PMID:20301739
    reference_title: "Spinal Muscular Atrophy, X-Linked Infantile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "females who inherit the pathogenic variant will be heterozygotes and will usually not be affected."
    explanation: The qualifier "usually" leaves female penetrance and modifiers unresolved.

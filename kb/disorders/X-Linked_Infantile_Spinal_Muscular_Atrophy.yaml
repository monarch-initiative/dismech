    snippet: "Here we report a male infant who presented from birth with predominantly truncal hypotonia following an antenatal history of reduced fetal movements."
    explanation: Documents prenatal reduced movement followed by hypotonia at birth in a molecularly confirmed male.
- phase: Classic severe infantile course
  age_range: Birth through infancy
  notes: >-
    Classic reported cases show congenital weakness and contractures followed by
    progressive respiratory failure and early death, but this should not be read as
    a universal survival estimate for every UBA1 genotype.
  evidence:
  - reference: PMID:23518311
    reference_title: "Clinical and neuropathological features of X-linked spinal muscular atrophy (SMAX2) associated with a novel mutation in the UBA1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He died from progressive respiratory failure at 4 months."
    explanation: Provides a directly observed severe natural-history example without converting a single case into a population survival rate.
- phase: Broader recognized spectrum
  age_range: Infancy and early childhood
  notes: >-
    More recent molecularly confirmed reports include patients with ongoing
    neuromuscular symptoms after recovery from neonatal respiratory distress and
    families described as broadening the phenotype, so lethal neonatal presentation
    is not an adequate ascertainment definition by itself.
  evidence:
  - reference: PMID:39762237
    reference_title: "A novel UBA1 gene mutation in a patient with infantile respiratory distress syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We here report a case of infantile respiratory distress syndrome followed by continuing neuromuscular symptoms."
    explanation: Supports a molecularly confirmed presentation with continuing neuromuscular manifestations rather than immediate infantile death.
pathophysiology:
- name: UBA1 E1 Ubiquitin-Activation Deficiency
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Hemizygous pathogenic variants associated with infantile SMAX2 cluster in
    exon 15 near the active adenylation domain. The recurrent synonymous
    c.1731C>T allele reduces UBA1 expression; missense alleles are positioned near
    the ATP-binding/adenylation region, but their biochemical consequences are not
    identical and should not be collapsed into complete UBA1 loss, which is cell
    lethal.
  biological_processes:
  - preferred_term: protein ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: DECREASED
  evidence:
  - reference: PMID:18179898
    reference_title: "Rare missense and synonymous variants in UBE1 are associated with X-linked infantile spinal muscular atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This resulted in detection of three rare novel variants in exon 15 of UBE1 that segregate with disease"
    explanation: Identifies UBA1 (UBE1) exon 15 variants segregating with XL-SMA as the disease-causing lesion.
  - reference: PMID:39762237
    reference_title: "A novel UBA1 gene mutation in a patient with infantile respiratory distress syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "UBA1 is an E1 ubiquitin-activating enzyme that initiates the ubiquitylation of target proteins and is thus a key component of the ubiquitin signaling pathway."
    explanation: Defines UBA1 as the E1 ubiquitin-activating enzyme that initiates ubiquitylation.
  - reference: PMID:39762237
    reference_title: "A novel UBA1 gene mutation in a patient with infantile respiratory distress syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This missense mutation was located with the AAD (active adenylation domain) of the protein, a known hotspot of SMAX2 mutations."
    explanation: Locates SMAX2 mutations in the active adenylation domain of UBA1.
  - reference: PMID:18179898
    reference_title: "Rare missense and synonymous variants in UBE1 are associated with X-linked infantile spinal muscular atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also demonstrated that the synonymous C-->T substitution leads to significant reduction of UBE1 expression and alters the methylation pattern of exon 15"
    explanation: Directly supports reduced expression for the recurrent synonymous allele, not a blanket loss-of-function assignment for every missense allele.
  downstream:
  - target: Impaired Ubiquitin-Proteasome Proteostasis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Reduced or altered UBA1 can perturb ubiquitination and protein turnover, but the disease-relevant substrates and degree of impairment in human SMAX2 tissues remain unresolved.
- name: Impaired Ubiquitin-Proteasome Proteostasis
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    UBA1 sits at the apex of the ubiquitin cascade, making altered ubiquitination
    and protein turnover a plausible disease route. Experimental UBA1 knockdown
    reduces ubiquitination and changes a limited set of sensitive proteins, rather
    than demonstrating uniform failure of every UBA1-dependent process. Direct
    molecular measurements in human SMAX2 motor neurons and muscle are lacking.
  cell_types:
  - preferred_term: Motor Neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:23151135
    reference_title: "Targeting the ubiquitin E1 as a novel anti-cancer strategy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "UBA1 is the initial enzyme in the ubiquitination cascade and initiates the transfer of ubiquitin molecules to target proteins where they are degraded by the proteasome."
    explanation: Establishes UBA1 as the apex enzyme whose activity gates proteasomal degradation of ubiquitinated proteins.
  - reference: PMID:32315770
    reference_title: "The pivotal role of ubiquitin-activating enzyme E1 (UBA1) in neuronal health and neurodegeneration."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "UBA1 is thus of fundamental importance to the modulation of ubiquitin homeostasis and to all downstream ubiquitylation-dependent cellular processes, including proteolysis through the ubiquitin-proteasome system and selective autophagy."
    explanation: Links UBA1 impairment to disruption of ubiquitin homeostasis and ubiquitin-proteasome proteolysis.
  - reference: PMID:26432019
    reference_title: "UBA1: At the Crossroads of Ubiquitin Homeostasis and Neurodegeneration."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A common feature of these conditions is disruption of protein homeostasis."
    explanation: Frames disrupted protein homeostasis as the unifying mechanism of UBA1-linked neurodegeneration.
  - reference: PMID:42402962
    reference_title: "UBA1 knockdown dysregulates the levels of UBA1-sensitive proteins and impairs muscle function in Drosophila and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we examined Drosophila and mice with muscle-targeted UBA1 knockdown and found that this intervention reduces protein ubiquitination, muscle function, and lifespan."
    explanation: Model-organism evidence links partial UBA1 reduction to reduced ubiquitination and neuromuscular dysfunction; it does not establish the corresponding human tissue mechanism.
  downstream:
  - target: Anterior Horn Motor Neuron Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Altered UBA1-dependent homeostasis is a plausible upstream contributor to the observed human neuronal pathology, with the intervening substrates unknown.
  - target: Skeletal Muscle-Autonomous Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Muscle-targeted UBA1 knockdown can impair muscle in model organisms, raising a parallel tissue-autonomous hypothesis for SMAX2 weakness.
- name: Anterior Horn Motor Neuron Degeneration
  biological_scale: CELLULAR
  description: >-
    Degeneration and loss of anterior horn/ventral lower motor neurons is directly
    observed in human SMAX2. A detailed postmortem case additionally found sensory
    and cerebellar abnormalities, so the pathology should not be represented as
    exclusively motor neuronal.

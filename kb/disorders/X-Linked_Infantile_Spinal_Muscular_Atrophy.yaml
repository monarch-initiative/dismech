  prevalence_class: RARE
  notes: >-
    No population-based prevalence or birth-incidence estimate is established in
    the cited literature. Published reports repeatedly describe SMAX2 as rare and
    are dominated by affected male probands and multiplex X-linked families; this
    record therefore avoids a numeric rate.

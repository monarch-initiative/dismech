genetic:
- name: UBA1
  association: Causative
  inheritance:
  - name: X-linked recessive inheritance
    inheritance_term:
      preferred_term: X-linked recessive inheritance
      term:
        id: HP:0001419
        label: X-linked recessive inheritance
  gene_term:
    preferred_term: UBA1
    term:
      id: hgnc:12469
      label: UBA1
  notes: >-
    UBA1 (ubiquitin-like modifier activating enzyme 1), the E1 ubiquitin-activating
    enzyme, on Xp11.3. Hemizygous pathogenic variants cluster in exon 15 / the
    active adenylation domain (e.g. p.Met539Ile, p.Ser547Gly, the c.1731C>T
    synonymous variant reducing expression). The synonymous allele has direct
    expression evidence. Among tested missense alleles, p.Met539Ile and
    p.Ser547Gly retained adenylation activity in vitro while p.Glu557Val showed a
    moderate reduction, so neither a uniform adenylation defect nor complete
    loss-of-function is assigned across SMAX2 variants.
  evidence:
  - reference: PMID:18179898
    reference_title: "Rare missense and synonymous variants in UBE1 are associated with X-linked infantile spinal muscular atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two missense mutations (c.1617 G-->T, p.Met539Ile; c.1639 A-->G, p.Ser547Gly) present each in one XL-SMA family, and one synonymous C-->T substitution (c.1731 C-->T, p.Asn577Asn) identified in another three unrelated families"
    explanation: Identifies the causative UBA1 (UBE1) variants segregating with XL-SMA.
  - reference: PMID:18179898
    reference_title: "Rare missense and synonymous variants in UBE1 are associated with X-linked infantile spinal muscular atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "XL-SMA is part of a growing list of neurodegenerative disorders associated with defects in the ubiquitin-proteasome pathway"
    explanation: Places XL-SMA among ubiquitin-proteasome pathway neurodegenerative disorders without proving one identical biochemical consequence for all variants.
  - reference: PMID:29034082
    reference_title: "Functional characterizations of rare UBA1 variants in X-linked Spinal Muscular Atrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data revealed that only one of the three XL-SMA missense variants impairs the Ubiquitin-adenylating ability of Uba1."
    explanation: Establishes allele-specific rather than uniform adenylation impairment among the three tested missense variants.
differential_diagnoses:
- name: SMN1-Related Proximal Spinal Muscular Atrophy
  description: >-
    Severe SMN1-related SMA can present with congenital or infantile hypotonia,
    areflexia, weakness, and motor-neuron loss. It is autosomal recessive and
    caused by biallelic SMN1 disruption, whereas SMAX2 is diagnosed through a
    hemizygous UBA1 pathogenic variant in a male. Arthrogryposis and fractures are
    especially useful SMAX2 clues but are not by themselves molecular diagnoses.
  distinguishing_features:
  - X-linked recessive inheritance (affected males) and UBA1 variants favor SMAX2; autosomal recessive SMN1 disruption favors proximal SMA.
  - Prominent congenital arthrogryposis and perinatal fractures favor SMAX2.
  - Normal SMN1 in SMAX2 versus biallelic SMN1 loss in proximal SMA.
  - The unaffected thalamus in the detailed SMAX2 autopsy contrasts with reported thalamic involvement in typical SMN1-associated SMA.
  disease_term:
    preferred_term: spinal muscular atrophy
    term:
      id: MONDO:0001516
      label: spinal muscular atrophy
  evidence:
  - reference: PMID:18572081
    reference_title: "Spinal muscular atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is caused by homozygous disruption of the survival motor neuron 1 (SMN1) gene by deletion, conversion, or mutation."
    explanation: Supports the distinct SMN1 genetic basis of proximal SMA.
  - reference: PMID:23518311
    reference_title: "Clinical and neuropathological features of X-linked spinal muscular atrophy (SMAX2) associated with a novel mutation in the UBA1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to typical SMN1-associated SMA, the thalamus was unaffected."
    explanation: Supplies the neuropathologic discriminator stated above.
- name: Kennedy Disease
  description: >-
    Kennedy disease (X-linked spinal and bulbar muscular atrophy, SBMA) is also an
    X-linked lower motor neuron disease, but is adult-onset and caused by an
    androgen-receptor (AR) CAG trinucleotide repeat expansion, not an infantile
    exon-15 UBA1 variant, and lacks
    the congenital arthrogryposis and infantile lethality of SMAX2.
  distinguishing_features:
  - Adult midlife onset in Kennedy disease versus congenital/infantile onset in SMAX2.
  - AR CAG expansion versus an SMAX2-associated UBA1 variant.
  - Absence of congenital contractures/arthrogryposis in Kennedy disease.
  disease_term:
    preferred_term: Kennedy disease
    term:
      id: MONDO:0010735
      label: Kennedy disease
  evidence:
  - reference: PMID:20301508
    reference_title: "Spinal and Bulbar Muscular Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of SBMA is established in a male proband by the identification of a hemizygous expansion of a CAG trinucleotide repeat (>35 CAGs) in AR by molecular genetic testing."
    explanation: Directly supports the AR CAG-repeat molecular discriminator for Kennedy disease.
  - reference: PMID:20301508
    reference_title: "Spinal and Bulbar Muscular Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spinal and bulbar muscular atrophy (SBMA) is a gradually progressive neuromuscular disorder in which degeneration of lower motor neurons results in muscle weakness, muscle atrophy, and fasciculations in affected males."
    explanation: Supports the gradually progressive motor-neuron phenotype that contrasts with congenital SMAX2.
- name: X-Linked Distal Spinal Muscular Atrophy Type 3
  description: >-
    SMAX3 is an ATP7A-related distal hereditary motor neuropathy with progressive
    distal weakness and atrophy. It is distinguished from congenital SMAX2 by its
    ATP7A basis, distal distribution, and generally later, slower course.
  distinguishing_features:
  - Pathogenic ATP7A variants favor SMAX3; pathogenic UBA1 variants favor SMAX2.
  - Distal progressive gait and hand/foot involvement favor SMAX3 over congenital generalized weakness with arthrogryposis.
  disease_term:
    preferred_term: X-linked distal spinal muscular atrophy type 3
    term:
      id: MONDO:0010338
      label: X-linked distal spinal muscular atrophy type 3
  evidence:
  - reference: PMID:20170900
    reference_title: "Missense mutations in the copper transporter gene ATP7A cause X-linked distal hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified two unique ATP7A missense mutations (p.P1386S and p.T994I) in males with distal motor neuropathy in two families."
    explanation: Primary human-family evidence directly establishes the ATP7A basis of the distal motor neuropathy.
  - reference: PMID:20170900
    reference_title: "Missense mutations in the copper transporter gene ATP7A cause X-linked distal hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "certain missense mutations at this locus can cause a syndrome restricted to progressive distal motor neuropathy without overt signs of systemic copper deficiency."
    explanation: Directly supports the progressive distal distribution and absence of systemic copper-deficiency signs.
- name: UBA1-Related Non-Kennedy Spinal-Bulbar Muscular Atrophy
  description: >-
    A separate adult-onset X-linked spinal-bulbar phenotype has been reported in a
    family with UBA1 p.Ile500Thr. Shared gene identity does not make that adult
    phenotype SMAX2: age at onset, bulbar distribution, variant position, and lack
    of congenital arthrogryposis define an important allelic boundary.
  distinguishing_features:
  - Adult spinal-bulbar presentation versus prenatal/neonatal SMAX2 presentation.
  - UBA1 p.Ile500Thr in the reported adult pedigree versus the exon-15 variants reported in infantile SMAX2; both affect residues near the ATP-binding region, so location alone is not diagnostic.
  evidence:
  - reference: PMID:35996994
    reference_title: "Identification of UBA1 as the causative gene of an X-linked non-Kennedy spinal-bulbar muscular atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A missense mutation in UBA1 (c.T1499C; p.Ile500Thr) was identified as the probable cause of the non-Kennedy SBMA in the pedigree."
    explanation: Supports a distinct UBA1-related non-Kennedy spinal-bulbar phenotype rather than extending SMAX2 indiscriminately to adult disease.
- name: Spinal Muscular Atrophy with Respiratory Distress Type 1
  description: >-
    SMARD1 is an autosomal recessive IGHMBP2 disorder with early respiratory
    failure and motor weakness. Diaphragmatic palsy and distal-predominant weakness
    favor SMARD1; congenital arthrogryposis/fractures, X-linked segregation, and a
    hemizygous UBA1 variant favor SMAX2.
  distinguishing_features:
  - Biallelic IGHMBP2 variants and autosomal recessive inheritance favor SMARD1.
  - Early diaphragmatic palsy with distal weakness favors SMARD1.
  disease_term:
    preferred_term: spinal muscular atrophy with respiratory distress type 1
    term:
      id: MONDO:0011436
      label: autosomal recessive distal spinal muscular atrophy 1
  evidence:
  - reference: PMID:11528396
    reference_title: "Mutations in the gene encoding immunoglobulin mu-binding protein 2 cause spinal muscular atrophy with respiratory distress type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we demonstrate that SMARD type 1 (SMARD1) results from mutations in the gene encoding immunoglobulin micro-binding protein 2 (IGHMBP2; on chromosome 11q13.2-q13.4)."
    explanation: Supports the distinct IGHMBP2 genetic basis of SMARD1.
  - reference: PMID:35611426
    reference_title: "Spinal muscular atrophy with respiratory distress type 1 (SMARD1): a rare cause of hypotonia, diaphragmatic weakness, and respiratory failure in infants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The initial symptoms of patients with SMARD1 are respiratory distress and distal muscle weakness manifesting in the infantile period due to progressive degeneration of α-motor neurons."
    explanation: Directly supports early respiratory distress and distal-predominant weakness as clinical discriminators.
- name: Spinal Muscular Atrophy with Congenital Bone Fractures 2
  description: >-
    ASCC1-related SMABF2 can closely mimic SMAX2 through prenatal or neonatal
    hypotonia, congenital contractures, long-bone fractures, pulmonary hypoplasia,
    and respiratory distress. Biallelic ASCC1 variants and autosomal recessive
    inheritance favor SMABF2; a hemizygous UBA1 pathogenic variant and X-linked
    segregation favor SMAX2.
  distinguishing_features:
  - Biallelic ASCC1 variants and autosomal recessive inheritance favor SMABF2.
  - Prenatal long-bone fractures, congenital contractures, and respiratory distress overlap substantially and require molecular discrimination.
  disease_term:
    preferred_term: spinal muscular atrophy with congenital bone fractures 2
    term:
      id: MONDO:0014807
      label: spinal muscular atrophy with congenital bone fractures 2
  evidence:
  - reference: PMID:33931933
    reference_title: "Biallelic ASCC1 variants including a novel intronic variant result in expanded phenotypic spectrum of spinal muscular atrophy with congenital bone fractures 2 (SMABF2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spinal muscular atrophy with congenital bone fractures 2 (SMABF2), a type of arthrogryposis multiplex congenita (AMC), is characterized by congenital joint contractures, prenatal fractures of long bones, and respiratory distress and results from biallelic variants in ASCC1."
    explanation: Directly supports both the overlapping phenotype and the distinct biallelic ASCC1 etiology.
diagnosis:
- name: Supportive Clinical and Electrophysiologic Assessment
  description: >-
    No consensus clinical diagnostic criteria have been published. Congenital
    hypotonia, areflexia, weakness, contractures and/or fractures, male sex or
    X-linked segregation, EMG/NCS evidence of a neurogenic process, and negative
    SMN1 testing are supportive findings. They should prompt UBA1 testing but do
    not establish SMAX2 without a pathogenic or likely pathogenic UBA1 variant.
  diagnosis_term:
    preferred_term: electromyography procedure
    term:
      id: NCIT:C38056
      label: Electromyography
  evidence:
  - reference: PMID:32181232
    reference_title: "A Pathogenic Missense Variant (c.1617G>A, p.Met539Ile) in UBA1 Causing Infantile X-Linked Spinal Muscular Atrophy (SMAX2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The brain MRI of the proband's showed normal results but the electromyography results showed multiple peripheral neurogenic lesions."
    explanation: Directly supports EMG as a supportive neurogenic finding rather than a disease-specific diagnostic test.
  - reference: PMID:32181232
    reference_title: "A Pathogenic Missense Variant (c.1617G>A, p.Met539Ile) in UBA1 Causing Infantile X-Linked Spinal Muscular Atrophy (SMAX2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "normal SMN1 molecular sequencing, and male gender in a simple case or an X-linked manner of inheritance in families with multiple patients"
    explanation: Supports normal SMN1 testing as a useful exclusionary/supportive finding in the SMAX2 workup.
- name: UBA1 Molecular Confirmation and Variant Interpretation
  description: >-
    Establish the diagnosis in an affected male by identifying a hemizygous
    pathogenic or likely pathogenic UBA1 variant in the appropriate phenotype.
    A UBA1 variant of uncertain significance neither establishes nor excludes
    SMAX2; segregation, allele-specific functional data, and periodic
    reinterpretation are needed, especially given the heterogeneous effects of
    exon-15 variants.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:20301739
    reference_title: "Spinal Muscular Atrophy, X-Linked Infantile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of X-linked infantile spinal muscular atrophy is established in a male proband with suggestive clinical features and a hemizygous pathogenic variant in UBA1 identified by molecular genetic testing."
    explanation: Establishes the required clinical-plus-pathogenic-variant basis while excluding a VUS-only result from confirmation.
- name: Family Variant Testing and Recurrence Counseling
  description: >-
    Once a familial UBA1 pathogenic variant is known, test at-risk female relatives;
    prenatal and preimplantation genetic testing are possible. Counseling should
    explain that de novo variants occur, heterozygous females are usually but not
    invariably unaffected, and a negative maternal blood test does not reduce
    recurrence risk to zero because maternal germline mosaicism remains possible.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301739
    reference_title: "Spinal Muscular Atrophy, X-Linked Infantile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once the UBA1 pathogenic variant has been identified in an affected family member, carrier testing for at risk female relatives and prenatal and preimplantation genetic testing are possible."
    explanation: Supports cascade carrier testing and reproductive testing after variant identification.

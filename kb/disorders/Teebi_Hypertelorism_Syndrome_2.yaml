pathophysiology:
- name: Heterozygous CDH11 Extracellular Missense Variant
  description: >-
    A heterozygous missense variant alters a conserved residue in the
    extracellular cadherin repeats of cadherin-11, either at the EC1
    trans-dimer interface (Trp55, Glu140, Leu77) or in or near the
    calcium-binding linkers between EC domains (Asp260, Asn262, Pro266,
    Glu279, Val374). The variant protein is expressed at the cell surface at
    levels comparable to wild type, so the lesion alters what the protein does
    rather than how much of it is made.
  biological_scale: MOLECULAR
  genetic_context:
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    description: >-
      Germline, either de novo or inherited. functional_impact_category is left
      unset because the mechanism is unresolved: the founding authors favour a
      dominant-negative effect but do not exclude loss of function, and ClinGen
      also raises gain of function (see the discussion
      cdh11_ths_allelic_mechanism).
  genes:
  - preferred_term: CDH11
    term:
      id: hgnc:1750
      label: CDH11
  evidence:
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "affect residues of the extracellular cadherin repeats, each of which has been shown to be highly conserved among vertebrate orthologs and may contribute to the formation of cis and trans dimers"
    explanation: All founding variants are extracellular missense changes at conserved residues.
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Similar levels of protein expression of wild type and the mutants were observed by flow cytometry"
    explanation: The variant proteins are expressed normally in transduced L cells, arguing against reduced protein amount.
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results suggest that the identified missense variants exert a dominant negative effect, though a loss-of-function mechanism is also possible."
    explanation: The authors' mechanistic interpretation of their cell assays, explicitly left open.
  - reference: CGGV:assertion_d159047f-2ee5-4406-8def-c5fe63b7ffe8-2024-05-17T160000.000Z
    reference_title: "CDH11 / Teebi hypertelorism syndrome 2 (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity is unclear."
    explanation: ClinGen's 2024 assessment of the molecular mechanism.
  downstream:
  - target: Impaired Cadherin-11 Trans Adhesion
    description: >-
      Substitutions at the EC1 interface are predicted to disrupt the contacts
      that form the trans dimer, and linker substitutions are predicted to
      weaken calcium binding that stabilises the ectodomain; tested variants
      reduce homophilic binding in vitro.
    causal_link_type: DIRECT
- name: Impaired Cadherin-11 Trans Adhesion
  description: >-
    Cadherin-11 mediates calcium-dependent homophilic adhesion through trans
    dimers formed by its EC1 repeat, stabilised by calcium bound between EC
    domains. L cells expressing five tested TBHS2 variants bound immobilised
    cadherin-11 ectodomain poorly or not at all (three variants showed minimal
    binding and two weaker binding than wild type), consistent with structural
    predictions of disrupted trans-dimer contacts or calcium-binding pockets.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CDH11
    term:
      id: hgnc:1750
      label: CDH11
  molecular_functions:
  - preferred_term: cadherin binding involved in cell-cell adhesion
    term:
      id: GO:0098641
      label: cadherin binding involved in cell-cell adhesion
    modifier: DECREASED
  - preferred_term: calcium ion binding (predicted, linker variants)
    term:
      id: GO:0005509
      label: calcium ion binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: cell-cell adhesion mediated by cadherin
    term:
      id: GO:0044331
      label: cell-cell adhesion mediated by cadherin
    modifier: DECREASED
  evidence:
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results indicate that the CDH11 variants affect the cell-cell adhesion function, which was consistent with our structural modeling predictions."
    explanation: L-cell binding assays show reduced homophilic adhesion for all five variants tested.
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Six of the variants that cluster around the EC2-EC3 and EC3-EC4 linker regions are predicted to affect Ca2+ binding that is required for cadherin stability."
    explanation: >-
      Homology modelling predicts that the linker variants weaken calcium
      binding; this calcium-binding defect is predicted, not measured.
  - reference: PMID:37646430
    reference_title: "A Japanese patient with Teebi hypertelorism syndrome and a novel CDH11 EC1 domain variant."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "Cadherin-11 undergoes trans-dimerization via the EC1 domain to generate cadherin complexes."
    explanation: Background for why EC1 variants such as Leu77Phe are expected to impair trans adhesion.
  downstream:
  - target: Abnormal Focal Adhesion and Actin Cytoskeleton Organization
    description: >-
      In patient fibroblasts carrying p.(Glu279Gln), defective cadherin-11
      engagement is accompanied by immature focal adhesions, absent stress
      fibres and delayed lamellipodium formation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Accelerated Mesenchymal Cell Migration
    description: >-
      Reduced trans adhesion with retained intracellular signalling is proposed
      to release cells from adhesion-dependent restraint, so that they migrate
      faster.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33811546
      reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our results demonstrate heterozygous variants in CDH11, which decrease cell-cell adhesion and increase cell migratory behavior, cause a form of THS, as termed CDH11-related THS."
      explanation: The authors' summary of their cell assays, linking reduced adhesion to increased migratory behaviour.
- name: Abnormal Focal Adhesion and Actin Cytoskeleton Organization
  description: >-
    Fibroblasts from an affected individual (p.(Glu279Gln)) adhered to substrate
    normally in the first two hours but remained small and round, formed
    lamellipodia late with excess blebbing and ruffling, and carried many
    immature focal adhesions without actin stress fibres. Cadherin-11 itself
    was more abundant than in control fibroblasts and formed aggregates along
    actin bundles. These data come from a single patient line.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: focal adhesion assembly
    term:
      id: GO:0048041
      label: focal adhesion assembly
    modifier: ABNORMAL
  - preferred_term: stress fiber assembly
    term:
      id: GO:0043149
      label: stress fiber assembly
    modifier: DECREASED
  - preferred_term: lamellipodium assembly (delayed)
    term:
      id: GO:0030032
      label: lamellipodium assembly
    modifier: DECREASED
  cell_types:
  - preferred_term: patient dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Control fibroblasts rapidly spread on plastic surface, however, individual 12's fibroblasts remained smaller and rounder for a longer time, presenting delayed formation of lamellipodia and an abnormal membrane-protrusion dynamic with preferential formation of blebs and ruffles"
    explanation: Abnormal spreading and delayed lamellipodium formation in patient fibroblasts.
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "focal adhesion structures in the individual 12 were immature and actin stress fibers were absent"
    explanation: Immature focal adhesions and loss of stress fibres in patient fibroblasts.
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "An increased expression was observed in the affected individual's fibroblasts"
    explanation: >-
      Cadherin-11 is more abundant, not less, in patient fibroblasts, which is
      difficult to reconcile with simple loss of expression.
  downstream:
  - target: Accelerated Mesenchymal Cell Migration
    description: >-
      Immature focal adhesions and absent stress fibres are associated with
      faster, less restrained migration of the patient cells.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Accelerated Mesenchymal Cell Migration
  description: >-
    Patient fibroblasts closed an in vitro wound about twice as fast as control
    fibroblasts without any difference in proliferation, so the effect is on
    motility. This mirrors experimental cadherin-11 mutants in Xenopus in which
    the adhesive ectodomain is removed or disabled but the membrane-anchored
    cytoplasmic tail, which is sufficient to drive migration, is retained.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: fibroblast migration
    term:
      id: GO:0010761
      label: fibroblast migration
    modifier: INCREASED
  cell_types:
  - preferred_term: patient dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "individual 12's fibroblasts were able to colonize the cell-free zone approximately twofold faster than control cells"
    explanation: Wound-healing assay in patient fibroblasts.
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we observed no measurable differences in proliferation in three replicates between individual 12's fibroblasts and control fibroblasts"
    explanation: Faster wound closure is not explained by proliferation.
  - reference: PMID:19528317
    reference_title: "Cadherin-11 regulates protrusive activity in Xenopus cranial neural crest cells upstream of Trio and the small GTPases."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "We identified the cytoplasmic tail of Xcad-11 as both necessary and sufficient for proper CNC migration as long as it was linked to the plasma membrane."
    explanation: >-
      In Xenopus the membrane-anchored cytoplasmic tail, not the adhesive
      ectodomain, drives migration, which is how an extracellular missense
      variant could reduce adhesion while leaving pro-migratory signalling
      intact.
  downstream:
  - target: Dysregulated Cranial Neural Crest Cell Migration
    description: >-
      The founding authors propose that the same combination of reduced trans
      adhesion and increased migration perturbs embryonic craniofacial
      development. Extending it to cranial neural crest is extrapolated from
      fibroblasts and from Xenopus; it has not been observed in human or
      mammalian embryos.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33811546
      reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      directness: INDIRECT
      snippet: "We speculate that the missense variants in CDH11 reduced trans adhesion and increased cell migration may alter the critical gene expression in the early embryonic development and result in hypertelorism."
      explanation: Explicitly a speculation by the authors, not an observation.
- name: Dysregulated Cranial Neural Crest Cell Migration
  description: >-
    Cadherin-11 is the type II cadherin switched on as cranial neural crest
    cells undergo epithelial-to-mesenchymal transition, and it is strongly
    expressed in human embryonic facial mesenchyme, including palatal and
    dental mesenchyme and the developing eye and optic muscles. In Xenopus,
    cadherin-11 activity must be balanced: overexpression blocks neural crest
    migration, an ectodomain-deleted form causes premature emigration, and a
    form with disabled EC1 adhesive residues produces non-directional,
    incomplete migration. Whether TBHS2 variants perturb neural crest
    migration in human embryos is inferred, not shown.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: neural crest cell migration
    term:
      id: GO:0001755
      label: neural crest cell migration
    modifier: DYSREGULATED
  cell_types:
  - preferred_term: migratory cranial neural crest cell
    term:
      id: CL:0000008
      label: migratory cranial neural crest cell
  locations:
  - preferred_term: facial mesenchyme
    term:
      id: UBERON:0009891
      label: facial mesenchyme
  evidence:
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunohistochemical study demonstrates that CDH11 is strongly expressed in human facial mesenchyme."
    explanation: Places cadherin-11 in the tissue that forms the affected craniofacial structures.
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "including the central palatal mesenchyme, dental mesenchyme, the eye and optic muscles, and the tongue"
    explanation: Expression sites in 67 to 72 day human embryonic faces match the palatal, dental and ocular features.
  - reference: PMID:11688555
    reference_title: "Xenopus cadherin-11 restrains cranial neural crest migration and influences neural crest specification."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "By contrast, deltaeXcad-11 overexpression resulted in premature emigration of cells from the transplants."
    explanation: An ectodomain-deficient cadherin-11 accelerates neural crest emigration in vivo.
  - reference: PMID:24392028
    reference_title: "Cadherin-11 mediates contact inhibition of locomotion during Xenopus neural crest cell migration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Additionally, transplantation analyses revealed that CNC migratory behaviour in vivo is non-directional and incomplete when Xcad-11 adhesive function is impaired."
    explanation: Loss of cadherin-11 adhesive function disrupts directional cranial neural crest migration.
  downstream:
  - target: Abnormal Craniofacial Morphogenesis
    description: >-
      Mis-timed or non-directional migration of cranial neural crest-derived
      mesenchyme is proposed to alter the growth and spacing of the frontonasal
      and orbital structures. The intermediate steps are not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Abnormal Craniofacial Morphogenesis
  description: >-
    The net developmental outcome is a recognisable facial gestalt dominated by
    ocular hypertelorism, a broad or high forehead with a large anterior
    fontanelle, thick eyebrows, a short nose with a broad tip and depressed
    root, a thin upper lip, a small creased chin, and a high or cleft palate,
    with variable proptosis, ptosis, eyelid coloboma and small or late-erupting
    teeth. The facial structures involved are those in which cadherin-11 is
    strongly expressed in the human embryo.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: face morphogenesis
    term:
      id: GO:0060325
      label: face morphogenesis
    modifier: ABNORMAL
  locations:

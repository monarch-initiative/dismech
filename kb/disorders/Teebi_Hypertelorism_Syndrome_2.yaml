discussions:
- discussion_id: cdh11_ths_allelic_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do heterozygous extracellular CDH11 missense variants act as dominant
    negatives, as partial loss of function, or as gain of function, and why do
    they cause a different disorder from biallelic truncating variants?
  attaches_to:
  - pathophysiology#Heterozygous CDH11 Extracellular Missense Variant
  - pathophysiology#Impaired Cadherin-11 Trans Adhesion
  rationale: >-
    Five variants reduce homophilic adhesion when expressed alone in L cells,
    which cannot distinguish loss of function from interference with wild-type
    protein. The founding authors favour a dominant-negative effect but say loss
    of function is possible, and ClinGen states that the mechanism is unclear
    and raises gain of function or dominant negative. Patient fibroblasts
    express more cadherin-11 than controls, and Elsahy-Waters syndrome
    segregates recessively, implying unaffected carriers of truncating alleles;
    both argue against simple haploinsufficiency. No study has co-expressed
    variant and wild-type cadherin-11, and only one patient fibroblast line
    (p.(Glu279Gln)) has been examined.
  proposed_experiments:
  - experiment_id: cdh11_ths_coexpression_adhesion
    name: Wild-type and variant co-expression adhesion assay
    description: >-
      Co-express each TBHS2 variant with wild-type CDH11 at a 1:1 ratio in
      cadherin-null cells and measure homophilic aggregation and binding to
      cadherin-11 ectodomain, alongside a truncating Elsahy-Waters allele, to
      test whether the missense variants suppress wild-type adhesion.
  - experiment_id: cdh11_ths_knockin_mouse
    experiment_design: TARGETED_PERTURBATION
    name: Heterozygous Cdh11 missense knock-in mouse
    description: >-
      Generate heterozygous knock-in mice for an EC1 variant (Trp55Ser) and a
      linker variant (Asn262Ile) and assess interorbital distance, palate,
      heart and umbilical development, and cranial neural crest migration.
  - experiment_id: cdh11_ths_fibroblast_panel
    name: Multi-variant patient fibroblast panel
    description: >-
      Repeat the morphology, focal adhesion and wound-healing assays across
      fibroblasts from several unrelated patients with EC1 and linker variants
      to test whether accelerated migration is a general feature.
- discussion_id: cdh11_ths_extracranial_malformations
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How do heterozygous CDH11 variants produce the heart, umbilical, genital
    and limb anomalies of TBHS2?
  attaches_to:
  - phenotypes#Abnormal heart morphology
  - phenotypes#Abnormal umbilicus morphology
  - phenotypes#Hypospadias
  - phenotypes#Clinodactyly of the 5th finger
  - phenotypes#Cutaneous syndactyly
  rationale: >-
    These malformations are reported but no mechanism has been proposed for
    them. The craniofacial features are at least supported by strong
    cadherin-11 expression in human embryonic facial mesenchyme; comparable
    expression or functional data do not exist for the umbilical ring, genital
    tubercle or limb buds in this disorder. The only cardiac mechanistic data
    come from homozygous null mice with valve remodelling defects, and the
    human heart lesions are not specified in the cached report. The
    hypospadias, umbilical, limb and truncal skeletal phenotypes are therefore
    left without upstream mechanism nodes in this entry.

name: Teebi Hypertelorism Syndrome 2
creation_date: "2026-10-22T00:00:00Z"
category: Mendelian
synonyms:
- TBHS2
- CDH11-related Teebi hypertelorism syndrome
- CDH11-related THS
disease_term:
  preferred_term: Teebi hypertelorism syndrome 2
  term:
    id: MONDO:0030674
    label: Teebi hypertelorism syndrome 2
parents:
- Teebi Hypertelorism Syndrome
- Craniofacial malformation syndrome
description: >-
  Teebi hypertelorism syndrome 2 (TBHS2, OMIM 619736), also called
  CDH11-related Teebi hypertelorism syndrome, is a rare autosomal dominant
  craniofacial malformation syndrome caused by heterozygous missense variants
  in CDH11, which encodes the type II classical cadherin cadherin-11
  (OB-cadherin). It was delineated in 2021 in 19 individuals from 9 families;
  one further de novo case was reported in 2024. Ocular hypertelorism is
  present in every reported individual, with a broad or high forehead (often
  with a large anterior fontanelle), thick or broad eyebrows, a short nose with
  a broad tip and, characteristically, a depressed nasal root, a thin upper lip,
  a small chin with a horizontal crease, and a high or cleft palate. Heart
  defects, umbilical defects and hypospadias occur in a subset, minor hand and
  foot anomalies in about half, and development is normal or only mildly
  delayed in most. All reported variants are missense changes in the
  extracellular cadherin (EC) repeats, at residues that mediate
  trans-homodimerization (EC1) or calcium binding in the inter-domain linkers.
  Tested variants reduce cadherin-11 trans adhesion in vitro, and patient
  fibroblasts show immature focal adhesions, absent stress fibres and
  accelerated migration; the authors favour a dominant-negative effect but do
  not exclude loss of function. The disorder is allelic to, and phenotypically
  distinct from, autosomal recessive Elsahy-Waters syndrome caused by biallelic
  truncating CDH11 variants, and is distinguished from the SPECC1L-associated
  Teebi hypertelorism syndrome 1 chiefly by the depressed rather than broad or
  high nasal root.
notes: >-
  Scope: this entry covers only the CDH11-associated form. The parent concept
  Teebi hypertelorism syndrome (MONDO:0030639) also includes the
  SPECC1L-associated type 1 (MONDO:0800025), which is a separate disease and is
  listed here only as a differential. Many Teebi hypertelorism syndrome
  families described before 2015 have no molecular diagnosis, so features
  reported in that older literature are not attributed to this entry. Two
  primary reports exist (PMID:33811546, PMID:37646430); the PubMed queries
  "Teebi hypertelorism", "CDH11 variant craniofacial", "CDH11 de novo" and
  "cadherin-11 AND (hypertelorism OR craniofacial OR dysmorphic)", and a Europe
  PMC full-text query for "CDH11" AND "Teebi", returned no further patient
  reports on 2026-10-22. The 2026 perioperative case report PMID:41821721 that
  the "Teebi hypertelorism" query returns concerns a SPECC1L-confirmed patient
  and is not cited. Phenotype frequencies are taken from the 19-person founding
  cohort and are small-sample estimates.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous CDH11 missense variants cause the disorder. In the founding
    cohort five variants arose de novo and three segregated with the phenotype
    in multigenerational families, including one variant shared by all six
    affected members of an Australian family; the 2024 case was also de novo.
    Penetrance has not been formally estimated.
  evidence:
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "three were confirmed to have occurred de novo, two were dominantly inherited in two families with seven affected individuals"
    explanation: >-
      Of the first six variants identified, three were de novo and two
      segregated dominantly in families with seven affected individuals.
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants p.(Glu279Gln) and p.(Pro266Leu), were then confirmed de novo and the variant p.(Val374Glu) was shared among all six affected members of a family from Australia."
    explanation: >-
      Two further de novo variants and co-segregation of a third with the
      phenotype in all six affected members of one family support autosomal
      dominant inheritance.
  - reference: PMID:37646430
    reference_title: "A Japanese patient with Teebi hypertelorism syndrome and a novel CDH11 EC1 domain variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing identified a de novo heterozygous CDH11 variant"
    explanation: An independent de novo heterozygous case.
genetic:
- name: CDH11
  gene_term:
    preferred_term: CDH11
    term:
      id: hgnc:1750
      label: CDH11
  association: Causative
  variant_origin: GERMLINE
  presence: Heterozygous missense variant in an extracellular cadherin repeat
  notes: >-
    relationship_type is deliberately left unset. The schema defines CAUSATIVE
    as corresponding to ClinGen Definitive or Strong, and ClinGen classifies
    CDH11 for Teebi hypertelorism syndrome 2 as Moderate (autosomal dominant);
    no other GeneDiseaseRelationshipEnum value describes a disease-defining gene
    with moderate validity. All reported alleles are missense changes in EC1 to
    EC3 and their linkers; no truncating, whole-gene deletion or intracellular
    variant has been reported with this phenotype. Biallelic truncating CDH11
    variants instead cause the recessive Elsahy-Waters syndrome
    (kb/disorders/Elsahy-Waters_Syndrome.yaml), whose recessive segregation
    implies that heterozygous carriers of truncating alleles are unaffected;
    this is one reason the dominant missense alleles are not thought to act by
    simple haploinsufficiency.

diagnosis:
- name: Exome sequencing
  description: >-
    Diagnosis is molecular. All reported cases were identified by research or
    clinical exome sequencing in individuals with a clinical diagnosis of
    Teebi hypertelorism syndrome, with Sanger confirmation and parental
    testing to establish de novo occurrence or segregation. Because the
    phenotype overlaps SPECC1L-associated hypertelorism syndrome, both genes
    should be tested; a depressed nasal root favours CDH11.
  diagnosis_term:
    preferred_term: exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:37646430
    reference_title: "A Japanese patient with Teebi hypertelorism syndrome and a novel CDH11 EC1 domain variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing identified a de novo heterozygous CDH11 variant"
    explanation: Exome sequencing established the diagnosis in the 2024 case.
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is suggested that these eight individuals with a clinical diagnosis of THS without a molecular diagnosis should be considered for SPECC1L gene sequencing, and now including CDH11 as well."
    explanation: The authors recommend testing both genes in clinically diagnosed Teebi hypertelorism syndrome.
treatments:
- name: Genetic counseling
  description: >-
    No disease-specific therapy exists, and management of the individual
    malformations has not been described for this disorder specifically.
    Genetic counselling addresses autosomal dominant transmission and the
    variable expressivity seen within families.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Advances in our understanding of the emerging spectrum of THS and phenotype associated with heterozygous CDH11 variant will benefit families by facilitating counselling and aiding in reproductive decision making."
    explanation: The founding report identifies counselling and reproductive decision making as the main clinical use of the diagnosis.
differential_diagnoses:
- name: Teebi hypertelorism syndrome 1
  description: >-
    The SPECC1L-associated form of Teebi hypertelorism syndrome shares
    hypertelorism, a broad forehead, thick eyebrows and a thin upper lip, and
    also has heart and umbilical defects.
  disease_term:
    preferred_term: Teebi hypertelorism syndrome 1
    term:
      id: MONDO:0800025
      label: Teebi hypertelorism syndrome 1
  distinguishing_features:
  - The nasal root is broad or high in SPECC1L-associated disease and depressed in most CDH11-associated cases.
  - Craniosynostosis and diaphragmatic hernia occur occasionally with SPECC1L variants and were absent in the CDH11 cohort.
  evidence:
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared to individuals with SPECC1L-related hypertelorism syndrome with a high prevalence of broad/high nasal root, subjects with CDH11-related THS tend to have a depressed nasal root."
    explanation: The main facial discriminator.
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, craniosynostosis and diaphragmatic hernia were absent in our cohort, while they were occasionally observed in SPECC1L-associated hypertelorism syndrome"
    explanation: Malformations that point to SPECC1L.
- name: Elsahy-Waters syndrome
  description: >-
    The allelic autosomal recessive disorder caused by biallelic truncating
    CDH11 variants, curated as `Elsahy-Waters_Syndrome`. It shares
    hypertelorism and several facial features but is more severe.
  disease_term:
    preferred_term: Elsahy-Waters syndrome
    term:
      id: MONDO:0008885
      label: Elsahy-Waters syndrome
  distinguishing_features:
  - Elsahy-Waters syndrome is recessive and caused by biallelic truncating variants; TBHS2 is dominant and caused by heterozygous extracellular missense variants.
  - Global developmental delay and skeletal anomalies such as vertebral fusion are consistent in Elsahy-Waters syndrome and rare in TBHS2.
  - Heart and umbilical defects have been reported only in TBHS2.
  evidence:
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In general, CDH11-related THS is associated with a more variable, less severe phenotype with less pronounced dysmorphic features and generally normal or only mildly delayed development compared to CDH11-related EWS."
    explanation: Severity contrast between the two CDH11 disorders.
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are also differences in associated structural features, with cardiac or umbilical defects being features of CDH11-related THS and skeletal anomalies in CDH11-related EWS."
    explanation: Malformation contrast between the two CDH11 disorders.
  - reference: PMID:37646430
    reference_title: "A Japanese patient with Teebi hypertelorism syndrome and a novel CDH11 EC1 domain variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "THS and EWS may represent a spectrum of CDH11-related disorders."
    explanation: A later report suggests the boundary between the two may be less sharp.
animal_models:
- name: Xenopus ectodomain-deleted cadherin-11 graft
  species: Xenopus laevis
  genotype: Overexpression of Xcad-11 lacking the extracellular domain (deltaeXcad-11) in grafted cranial neural crest
  publication: PMID:11688555
  genes:
  - preferred_term: CDH11
    term:
      id: hgnc:1750
      label: CDH11
  description: >-
    Premigratory cranial neural crest from embryos injected with RNA for an
    ectodomain-deleted Xenopus cadherin-11 was grafted into uninjected hosts.
    The construct retains the membrane-anchored cytoplasmic tail but lacks the
    adhesive ectodomain, the region carrying every TBHS2 variant.
  modeled_mechanisms:
  - target: Dysregulated Cranial Neural Crest Cell Migration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Shows that a cadherin-11 lacking adhesive ectodomain function, expressed
      alongside endogenous cadherin-11, accelerates cranial neural crest
      emigration, the in vivo counterpart of the faster migration of patient
      fibroblasts.
    limitations: >-
      Overexpression of a large deletion construct in frog embryos, not a
      heterozygous missense allele at physiological dosage; no craniofacial
      morphology comparable to hypertelorism was assessed.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The perturbation is an overexpressed ectodomain deletion standing in
        for single missense substitutions in that ectodomain; it removes all
        extracellular function rather than impairing one contact.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Xenopus cranial neural crest migrates into pharyngeal pouches over a
        compressed timeline, so the timing and route of migration differ from
        the human frontonasal process.
    evidence:
    - reference: PMID:11688555
      reference_title: "Xenopus cadherin-11 restrains cranial neural crest migration and influences neural crest specification."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "By contrast, deltaeXcad-11 overexpression resulted in premature emigration of cells from the transplants."
      explanation: Ectodomain loss accelerates neural crest emigration.
    - reference: PMID:11688555
      reference_title: "Xenopus cadherin-11 restrains cranial neural crest migration and influences neural crest specification."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Xcad-11 expression must, however, be balanced, as overexpression prevents migration and leads to neural marker expression."
      explanation: Cadherin-11 dosage and activity must be balanced for normal neural crest behaviour.
- name: Xenopus EC1 adhesion-dead cadherin-11 (dn-Xcad-11)
  species: Xenopus laevis
  genotype: Xcad-11 carrying W2A, W4A and QAV-to-LKG substitutions in EC1, co-injected with Xcad-11 morpholino
  publication: PMID:24392028
  genes:
  - preferred_term: CDH11
    term:
      id: hgnc:1750
      label: CDH11
  description: >-
    A full-length Xenopus cadherin-11 in which the EC1 residues required for
    trans interaction, including the W2 tryptophan anchor, are substituted. W2
    corresponds to human Trp55, which is mutated in TBHS2 (p.(Trp55Ser)).
  modeled_mechanisms:
  - target: Dysregulated Cranial Neural Crest Cell Migration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Disabling the EC1 adhesive interface of cadherin-11 in vivo abolishes
      contact inhibition of locomotion and makes cranial neural crest migration
      non-directional and incomplete.
    limitations: >-
      The construct combines three substitutions and was tested on a
      morpholino knockdown background, not as a heterozygous allele alongside
      wild-type protein; frog craniofacial outcomes were limited to migration
      and fused branchial arches.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The triple EC1 substitution with endogenous knockdown models complete
        loss of trans adhesion, whereas a patient carries one missense allele
        and one wild-type allele.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Xenopus neural crest migration routes and timing differ from those that
        build the human midface and orbits.
    evidence:
    - reference: PMID:24392028
      reference_title: "Cadherin-11 mediates contact inhibition of locomotion during Xenopus neural crest cell migration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This construct contains amino acid substitutions in the homophilic binding pocket including the two tryptophanes (W2A, W4A) and an altered QAV motif (LKG) within the first extracellular domain that are necessary for Xcad-11 trans-interactions"
      explanation: Defines the EC1 adhesion-dead construct.
    - reference: PMID:24392028
      reference_title: "Cadherin-11 mediates contact inhibition of locomotion during Xenopus neural crest cell migration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Therefore, we conclude that for directional CNC migration the adhesive function of Xcad-11 is essential."
      explanation: Loss of EC1 adhesive function disrupts directional neural crest migration.

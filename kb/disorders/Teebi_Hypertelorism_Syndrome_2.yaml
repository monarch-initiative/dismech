- name: Abnormal Cardiac Morphogenesis
  description: >-
    About a quarter of individuals have a heart defect, which the founding
    authors identify as a feature that separates TBHS2 from Elsahy-Waters
    syndrome. The specific lesions are listed only in the supplementary tables
    and the mechanism is unknown. In mice, complete loss of cadherin-11 impairs
    semilunar valve remodelling, leaving thickened, stenotic valves, which
    shows that cadherin-11 has a role in cardiac valve development; how a
    heterozygous extracellular missense variant produces human heart defects
    has not been studied.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: heart development
    term:
      id: GO:0007507
      label: heart development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conversely, cardiac and umbilical defects were only found in individuals with heterozygous CDH11 missense variants and are not with any EWS patients."
    explanation: Heart defects are part of the TBHS2 phenotype.
  - reference: PMID:26188246
    reference_title: "Cadherin-11 coordinates cellular migration and extracellular matrix remodeling during aortic valve maturation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Mice that survive to adulthood maintain thickened and stenotic semilunar valves, but interestingly do not develop calcification."
    explanation: >-
      Cadherin-11 null mice show a cardiac valve remodelling defect; this is a
      loss-of-function model and only indirectly supports a cardiac role in
      the dominant human disorder.
  downstream:
  - target: Abnormal heart morphology
    description: Abnormal cardiac development produces structural heart defects in a subset.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

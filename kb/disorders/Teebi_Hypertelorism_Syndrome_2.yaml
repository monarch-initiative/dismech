  variants:
  - name: p.(Trp55Ser)
    description: >-
      c.164G>C in EC1. Trp55 is the conserved tryptophan anchor (W2 of the
      mature protein) that inserts into the partner molecule to form the trans
      dimer; modelling predicts loss of its hydrophobic contact with Pro141 of
      the partner chain. In L-cell adhesion assays this variant showed minimal
      binding to cadherin-11.
    type: missense variant
    gene:
      preferred_term: CDH11
      term:
        id: hgnc:1750
        label: CDH11
    evidence:
    - reference: PMID:33811546
      reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Replacement of Trp55 with serine, the side chain changing from a large aromatic residue to a small neutral one, was predicted to result in loss of a hydrophobic interaction with Pro141 from the partner chain"
      explanation: Structural modelling of the trans dimer interface.
  - name: p.(Glu279Gln)
    description: >-
      c.835G>C, a de novo variant near the EC2-EC3 linker. Fibroblasts from the
      carrier were used for the morphology, focal adhesion and wound-healing
      studies.
    type: missense variant
    gene:
      preferred_term: CDH11
      term:
        id: hgnc:1750
        label: CDH11
  - name: p.(Val374Glu)
    description: >-
      c.1121T>A, segregating with the phenotype in all six affected members of
      an Australian family.
    type: missense variant
    gene:
      preferred_term: CDH11
      term:
        id: hgnc:1750
        label: CDH11
  - name: p.(Leu77Phe)
    description: >-
      NM_001797.4:c.229C>T, a de novo EC1 variant in a Japanese boy. Leu77
      lines the hydrophobic pocket into which the partner cadherin-11 inserts
      during trans-dimerization.
    type: missense variant
    gene:
      preferred_term: CDH11
      term:
        id: hgnc:1750
        label: CDH11
    evidence:
    - reference: PMID:37646430
      reference_title: "A Japanese patient with Teebi hypertelorism syndrome and a novel CDH11 EC1 domain variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Residue Leu77 in this novel CDH11 variant lines a large hydrophobic pocket where side chains of the partner cadherin-11 insert to trans-dimerize, suggesting that the cadherin-11 structure might be altered in this variant."
      explanation: The authors' structural interpretation of the EC1 variant; no functional assay was performed.

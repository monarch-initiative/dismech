    term:
      id: UBERON:0009891
      label: facial mesenchyme
  evidence:
  - reference: PMID:33811546
    reference_title: "Pathogenic variants in CDH11 impair cell adhesion and cause Teebi hypertelorism syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This highlighted CDH11 protein is strongly expressed in the human developing face, in accordance with the human phenotype."
    explanation: Expression in the developing face matches the distribution of the malformations.

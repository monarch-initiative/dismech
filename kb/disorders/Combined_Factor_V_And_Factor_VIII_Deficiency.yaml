  classification: genetic
  description: >-
    Caused by biallelic LMAN1 variants, most of them null alleles
    (insertion/deletion, nonsense and splice-site). Accounts for roughly 70% of
    genotyped families. Founder alleles include LMAN1 c.89insG in Iranian/Iraqi
    Jewish families and c.2T>C (M1T) in Italian families.
  genes:
  - preferred_term: LMAN1
    term:
      id: hgnc:6631
      label: LMAN1
  evidence:
  - reference: PMID:9546392
    reference_title: "Mutations in the ER-Golgi intermediate compartment protein ERGIC-53 cause combined deficiency of coagulation factors V and VIII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA sequence analysis identified two different mutations, accounting for all affected individuals in nine families studied."
    explanation: >-
      The positional-cloning study that identified ERGIC-53 (LMAN1) variants as
      the cause of the disorder.
  - reference: PMID:39209292
    reference_title: "Clinical, Laboratory, Molecular, and Reproductive Aspects of Combined Deficiency of Factors V and VIII."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The testing should start with LMAN1, because in 70% of cases, mutations are found in this gene, followed by MCFD2 if no mutations are identified in LMAN1."
    explanation: Supports the approximate share of families explained by LMAN1.
  - reference: PMID:39209292
    reference_title: "Clinical, Laboratory, Molecular, and Reproductive Aspects of Combined Deficiency of Factors V and VIII."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Some mutations, such as c.89insG and c.2T > C (M1T) in LMAN1, which are prevalent in Iranian/Iraqi Jewish and Italian populations, may represent founder effects."
    explanation: Supports the founder alleles named in this subtype.
- name: Type 2
  display_name: Type 2 (MCFD2-related)
  subtype_term:
    preferred_term: factor 5 and Factor VIII, combined deficiency of, 2
    term:
      id: MONDO:0013331
      label: factor 5 and Factor VIII, combined deficiency of, 2
  classification: genetic
  description: >-
    Caused by biallelic MCFD2 variants, which include more missense alleles than
    LMAN1 does; all reported MCFD2 missense variants abolish binding to LMAN1.
    Clinically indistinguishable from type 1, though mean plasma factor V and
    factor VIII levels are somewhat lower.
  genes:
  - preferred_term: MCFD2
    term:
      id: hgnc:18451
      label: MCFD2
  evidence:
  - reference: PMID:12717434
    reference_title: "Bleeding due to disruption of a cargo-specific ER-to-Golgi transport complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show that inactivating mutations in MCFD2 cause F5F8D with a phenotype indistinguishable from that caused by mutations in LMAN1."
    explanation: >-
      Identifies MCFD2 as the second causal gene and states that the phenotype
      matches LMAN1-related disease, which is why the two are lumped here.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires two defective alleles of the same gene, LMAN1 or MCFD2.
    Heterozygous carriers are usually asymptomatic. Consanguinity is common
    among reported families.
  evidence:
  - reference: PMID:39209292
    reference_title: "Clinical, Laboratory, Molecular, and Reproductive Aspects of Combined Deficiency of Factors V and VIII."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The disease has an autosomal recessive mode of inheritance and therefore occurs with an equal incidence among males and females. Heterozygous mutation carriers usually do not have clinical manifestations."
    explanation: States the recessive inheritance and the asymptomatic carrier state.
pathophysiology:
- name: Biallelic LMAN1 Loss-of-Function Variants
  biological_scale: MOLECULAR
  subtypes:
  - Type 1
  description: >-
    Homozygous or compound heterozygous LMAN1 variants on chromosome 18q21. Most
    are null alleles that abolish LMAN1 protein expression; the rare missense
    variants (W67S, C475R) produce unstable protein or defective mannose and
    MCFD2 binding.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: LMAN1
    term:
      id: hgnc:6631
      label: LMAN1
  downstream:
  - target: LMAN1-MCFD2 Cargo Receptor Complex Disruption
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:9546392
    reference_title: "Mutations in the ER-Golgi intermediate compartment protein ERGIC-53 cause combined deficiency of coagulation factors V and VIII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunofluorescence and Western analysis of immortalized lymphocytes from patients homozygous for either of the two mutations demonstrate complete lack of expression of the mutated gene in these cells."
    explanation: Shows that the founder LMAN1 alleles are null, abolishing expression.
  - reference: PMID:23852824
    reference_title: "Combined deficiency of coagulation factors V and VIII: an update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Only two missense mutations have been identified in LMAN1, including W67S and C475R."
    explanation: Names the rare LMAN1 missense variants described in this node.
- name: Biallelic MCFD2 Loss-of-Function Variants
  biological_scale: MOLECULAR
  subtypes:
  - Type 2
  description: >-
    Homozygous or compound heterozygous MCFD2 variants on chromosome 2p21,
    including null alleles, a large 5' regulatory deletion, and missense or
    C-terminal truncating variants that disrupt the calcium-dependent EF-hand
    fold MCFD2 needs to bind LMAN1.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: MCFD2
    term:
      id: hgnc:18451
      label: MCFD2

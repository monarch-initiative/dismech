    quote_role: REVIEW_SYNTHESIS
    snippet: "The prevalence of this disease in the general population is estimated to be 1:1,000,000 and is significantly higher in regions where consanguineous marriages are permitted, such as the Mideast and South Asia."
    explanation: States the worldwide prevalence estimate normalised in this record.
diagnosis:
- name: Coagulation screen
  description: >-
    Prolonged prothrombin time and prolonged activated partial thromboplastin
    time together, which correct on mixing with normal plasma, prompt
    factor-specific assays.
  diagnosis_term:
    preferred_term: coagulation screening blood test
    term:
      id: NCIT:C217390
      label: Diagnostic Blood Testing
  evidence:
  - reference: PMID:39209292
    reference_title: "Clinical, Laboratory, Molecular, and Reproductive Aspects of Combined Deficiency of Factors V and VIII."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In F5F8D, according to a screening coagulogram, prolongation of activated partial thromboplastin time (aPTT) and prothrombin time (PT) is typical."
    explanation: States the screening abnormalities that prompt factor assays.
  - reference: PMID:39209292
    reference_title: "Clinical, Laboratory, Molecular, and Reproductive Aspects of Combined Deficiency of Factors V and VIII."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Tests involving mixing with normal plasma can correct aPTT and PT, thereby ruling out the presence of inhibitors."
    explanation: States the mixing study that rules out an inhibitor.
- name: Factor V and factor VIII activity assays
  description: >-
    The diagnosis rests on finding factor V and factor VIII activity reduced
    together, usually to 5-30% of normal, which separates this disorder from
    isolated factor V deficiency and from hemophilia A.
  diagnosis_term:
    preferred_term: coagulation factor activity assay
    term:
      id: NCIT:C217390
      label: Diagnostic Blood Testing
  measurements:
  - preferred_term: factor V activity
    term:
      id: LOINC:3193-0
      label: Coagulation factor V activity actual/normal in Platelet poor plasma by Coagulation assay
  - preferred_term: factor VIII activity
    term:
      id: LOINC:3209-4
      label: Coagulation factor VIII activity actual/normal in Platelet poor plasma by Coagulation assay
  evidence:
  - reference: PMID:23852824
    reference_title: "Combined deficiency of coagulation factors V and VIII: an update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Diagnosis is made on laboratory findings of decreased FV and FVIII levels in plasma, usually in the range of 5 to 30% of normal (typically 10–20%)."
    explanation: States that the diagnosis is made on combined reduction of factor V and factor VIII.
- name: LMAN1 and MCFD2 sequencing
  description: >-
    Confirms the diagnosis and assigns the subtype. LMAN1 is tested first
    because it explains about 70% of families, then MCFD2.
  diagnosis_term:
    preferred_term: LMAN1 and MCFD2 genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:39209292
    reference_title: "Clinical, Laboratory, Molecular, and Reproductive Aspects of Combined Deficiency of Factors V and VIII."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The testing should start with LMAN1, because in 70% of cases, mutations are found in this gene, followed by MCFD2 if no mutations are identified in LMAN1."
    explanation: States the order of molecular testing.
differential_diagnoses:
- name: Congenital factor V deficiency with type 1 von Willebrand disease
  description: >-
    Coinherited factor V deficiency and type 1 von Willebrand disease also lower
    both factor V and factor VIII, because low von Willebrand factor shortens
    factor VIII survival. Normal von Willebrand factor separates combined
    factor V and factor VIII deficiency.
  disease_term:
    preferred_term: congenital factor V deficiency
    term:
      id: MONDO:0009210
      label: congenital factor V deficiency
  evidence:
  - reference: PMID:23852824
    reference_title: "Combined deficiency of coagulation factors V and VIII: an update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "FV deficiency (parahemophilia) combined with type 1 von Willebrand disease can also present with decreases in FV and FVIII levels, due to the indirect effect of von Willebrand factor deficiency on FVIII stability."
    explanation: Names this combination as a mimic of combined factor V and factor VIII deficiency.
- name: Coinherited factor V deficiency and hemophilia A
  description: >-
    Chance coinheritance of the two single-factor deficiencies would produce the
    same laboratory picture but is extremely unlikely given how rare each is.
  disease_term:
    preferred_term: hemophilia A
    term:
      id: MONDO:0010602
      label: hemophilia A
  evidence:
  - reference: PMID:23852824
    reference_title: "Combined deficiency of coagulation factors V and VIII: an update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although chance coinheritance of parahemophilia and hemophilia A is a possibility, it is extremely unlikely due to the low frequency of both disorders in general population"
    explanation: Records coinheritance as a theoretical but unlikely differential.
treatments:
- name: Fresh frozen plasma
  description: >-
    The only available source of factor V, since no factor V concentrate exists.
    Used for bleeding episodes and to cover surgery, typically targeting factor V
    activity of about 15%. Plasma alone does not raise factor VIII enough, so it
    is combined with factor VIII concentrate or desmopressin.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Fresh Frozen Plasma Transfusion
    term:
      id: NCIT:C116475
      label: Fresh Frozen Plasma Transfusion
  target_mechanisms:
  - target: Reduced Plasma Factor V and Factor VIII
    treatment_effect: RESTORES
    description: Donor plasma supplies factor V (and some factor VIII).
  evidence:
  - reference: PMID:19141160
    reference_title: "Combined FV and FVIII deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Treatment of bleeding episodes requires a source of both FV and FVIII; replacement of FV is achieved through the use of fresh frozen plasma, and that of FVIII by desmopressin or specific FVIII concentrates, plasma-derived or recombinant FVIII products."
    explanation: Fresh frozen plasma is the means of replacing factor V.
  - reference: PMID:39209292
    reference_title: "Clinical, Laboratory, Molecular, and Reproductive Aspects of Combined Deficiency of Factors V and VIII."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, there are no available FV concentrates in clinical practice."
    explanation: Explains why plasma remains the only factor V source.
  - reference: PMID:39209292
    reference_title: "Clinical, Laboratory, Molecular, and Reproductive Aspects of Combined Deficiency of Factors V and VIII."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In case of bleeding or planned surgery, the therapeutic goal is to achieve a FV activity of 15% based on treatments of FV deficiency63,70,71 and a FVIII activity of at least 50% of the norm."
    explanation: Supports the factor V and factor VIII treatment targets.
- name: Factor VIII concentrate
  description: >-
    Plasma-derived or recombinant factor VIII, given with fresh frozen plasma for
    significant bleeding or surgery, because plasma alone cannot restore factor
    VIII to haemostatic levels.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: antihemophilic factor
      term:
        id: NCIT:C81122
        label: Antihemophilic Factor Human
  target_mechanisms:
  - target: Reduced Plasma Factor V and Factor VIII
    treatment_effect: RESTORES
    description: Replaces the factor VIII half of the deficiency.
  evidence:
  - reference: PMID:23852824
    reference_title: "Combined deficiency of coagulation factors V and VIII: an update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "the recommended therapy includes fresh frozen plasma (FFP), which provides FV, and FVIII concentrate, which compensates for the shorter half-life of plasma FVIII."
    explanation: Supports factor VIII concentrate alongside plasma.
- name: Desmopressin
  description: >-
    Releases stored factor VIII and von Willebrand factor from endothelial
    Weibel-Palade bodies; in one reported patient it roughly doubled factor VIII
    for 1-2 hours. Can replace
    factor VIII concentrate for minor procedures in patients whose baseline
    factor VIII is above about 15%; not suitable for long-term use because the
    stores deplete.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: desmopressin
      term:
        id: CHEBI:4450
        label: desmopressin
  target_mechanisms:
  - target: Reduced Plasma Factor V and Factor VIII
    treatment_effect: RESTORES
    description: Transiently raises plasma factor VIII; it does not raise factor V.
  evidence:
  - reference: PMID:23852824
    reference_title: "Combined deficiency of coagulation factors V and VIII: an update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In patients whose FVIII levels are at the higher end of the range (> 15% of normal), DDAVP could be used in lieu of FVIII concentrate for preventing bleeding in tooth extraction, labor, or other minor surgeries."
    explanation: Supports desmopressin in place of factor VIII concentrate for minor procedures.
  - reference: PMID:39209292
    reference_title: "Clinical, Laboratory, Molecular, and Reproductive Aspects of Combined Deficiency of Factors V and VIII."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Desmopressin is not recommended for long-term use due to the depletion effect."
    explanation: Supports the caution against long-term desmopressin use.
  - reference: PMID:39209292
    reference_title: "Clinical, Laboratory, Molecular, and Reproductive Aspects of Combined Deficiency of Factors V and VIII."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The mechanism of action of this drug involves a release of the stored VWF and FVIII from WPB and consequently an increase in the plasma levels of these coagulation factors."
    explanation: Supports the Weibel-Palade body release mechanism.
  - reference: PMID:23852824
    reference_title: "Combined deficiency of coagulation factors V and VIII: an update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "was shown to increase the FVIII level by more than twofold over 60 to 120 minutes in a patient with F5F8D"
    explanation: Supports the roughly twofold, 1-2 hour rise in factor VIII, observed in a single patient.
- name: Antifibrinolytic therapy
  description: >-
    Tranexamic acid or aminocaproic acid, given orally, intravenously or
    topically for mucocutaneous bleeding and as an adjunct around procedures.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tranexamic acid
      term:
        id: CHEBI:48669
        label: tranexamic acid
    - preferred_term: aminocaproic acid
      term:
        id: CHEBI:16586
        label: 6-aminohexanoic acid
  target_mechanisms:
  - target: Menorrhagia
    treatment_effect: MODULATES
    description: Inhibits fibrinolysis so clots at mucosal bleeding sites hold.
  - target: Epistaxis
    treatment_effect: MODULATES
    description: Inhibits fibrinolysis so clots at mucosal bleeding sites hold.
  - target: Gingival bleeding
    treatment_effect: MODULATES
    description: Inhibits fibrinolysis so clots at mucosal bleeding sites hold.
  evidence:
  - reference: PMID:39209292
    reference_title: "Clinical, Laboratory, Molecular, and Reproductive Aspects of Combined Deficiency of Factors V and VIII."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The following hemostatic agents can be highlighted: fibrinolysis inhibitors (tranexamic acid and aminocaproic acid) are prescribed for oral, intravenous, and topical administration."
    explanation: Supports antifibrinolytic use in this disorder.
- name: Recombinant activated factor VII
  description: >-
    Off-label bypass therapy reported for surgical bleeding that did not respond
    to plasma and factor VIII concentrate; it avoids plasma volume overload, but
    its safety in this disorder is not established.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: recombinant activated factor VII (eptacog alfa)
      term:
        id: NCIT:C81125
        label: Eptacog Alfa
  target_mechanisms:
  - target: Reduced Plasma Factor V and Factor VIII
    treatment_effect: BYPASSES
    description: >-
      Activated factor VII drives thrombin generation on the platelet surface
      without needing the missing factor V and factor VIII cofactors.
  evidence:
  - reference: PMID:23852824
    reference_title: "Combined deficiency of coagulation factors V and VIII: an update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In a case of F5F8D with persistent abdominal hematoma following surgery that combined FFP and FVIII concentrate infusions failed to control, FVIIa was successfully used to stop the bleeding complications."
    explanation: Reports successful rFVIIa use for refractory surgical bleeding.
  - reference: PMID:23852824
    reference_title: "Combined deficiency of coagulation factors V and VIII: an update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, the safety of off-label use of FVIIa in treating F5F8D remains to be established."
    explanation: Records rFVIIa as off-label with unestablished safety.
animal_models:
- name: Lman1 knockout mouse
  species: Mouse
  genotype: Lman1 -/- (gene trap)
  publication: PMID:21795745
  description: >-
    Plasma factor V, factor VIII and platelet factor V fall to about 50% of
    wild type, a milder reduction than in patients, with hepatocyte ER
    accumulation of alpha-1-antitrypsin and strain-dependent partial perinatal
    lethality.
  modeled_mechanisms:
  - target: Impaired ER-to-Golgi Export of Factor V and Factor VIII
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      Factor levels fall to about half of normal rather than the 5-30% seen in
      patients, and the strain-dependent perinatal lethality has no human
      counterpart.
    evidence:
    - reference: PMID:21795745
      reference_title: "Mice deficient in LMAN1 exhibit FV and FVIII deficiencies and liver accumulation of α1-antitrypsin."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Levels of plasma FV and FVIII, and platelet FV, are all reduced to ∼ 50% of wild-type in Lman1(-/-) mice, compared with the 5%-30% levels typically observed in human F5F8D patients."
      explanation: Reports the coordinate but milder factor reduction in the knockout.
  - target: Hepatocyte ER Retention of Alpha-1-Antitrypsin
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    limitations: >-
      The node itself rests on mouse and cell-line data; no corresponding
      finding has been reported in patients, so fidelity to human disease
      cannot be judged.
    evidence:
    - reference: PMID:21795745
      reference_title: "Mice deficient in LMAN1 exhibit FV and FVIII deficiencies and liver accumulation of α1-antitrypsin."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, the ER in Lman1(-/-) hepatocytes is slightly distended, with significant accumulation of α1-antitrypsin and GRP78."
      explanation: Reports hepatocyte ER accumulation of AAT in the knockout.
- name: Mcfd2 knockout mouse
  species: Mouse
  genotype: Mcfd2 -/-
  publication: PMID:29735583
  description: >-
    Plasma factor V and factor VIII are reduced further than in Lman1 knockout
    mice, mirroring the gene-level difference in patients, with normal survival.
  modeled_mechanisms:
  - target: Impaired ER-to-Golgi Export of Factor V and Factor VIII
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      Doubly deficient mice have the higher Lman1-null factor levels, implying
      an alternative export route whose relevance to patients is unknown.
    evidence:
    - reference: PMID:29735583
      reference_title: "Analysis of MCFD2- and LMAN1-deficient mice demonstrates distinct functions in vivo."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We now report that MCFD2-deficient mice generated by gene targeting also demonstrate reduced plasma FV and FVIII, with levels lower than those in LMAN1-deficient mice, similar to previous observations in LMAN1- and MCDF2-deficient humans."
      explanation: The knockout reproduces the reduced factor levels and the gene-level difference.
notes: >-
  The two genetic types (MONDO:0009206, LMAN1; MONDO:0013331, MCFD2) are lumped
  as has_subtypes because the genes encode the two subunits of one cargo
  receptor and the phenotype is indistinguishable. No mechanism module in
  kb/modules covers cargo-receptor-dependent ER export, so no conforms_to is
  declared. Isolated factor V deficiency is curated separately as
  Congenital_Factor_V_Deficiency. No GeneReviews chapter covers this disorder
  (Bookshelf index snapshot 2026-09-10), so the phenotype baseline rests on the
  2013 and 2025 reviews cited here.

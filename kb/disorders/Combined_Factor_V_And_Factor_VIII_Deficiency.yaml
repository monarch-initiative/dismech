    reference_title: "Combined deficiency of coagulation factors V and VIII: an update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Diagnosis is made on laboratory findings of decreased FV and FVIII levels in plasma, usually in the range of 5 to 30% of normal (typically 10–20%). No correlations of bleeding severity and the levels of FV and FVIII have been observed in F5F8D patients."
    explanation: States the typical factor range and the weak level-severity correlation.
  - reference: PMID:23852824
    reference_title: "Combined deficiency of coagulation factors V and VIII: an update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Recent reports also confirmed the previous observation that defects of two factors do not lead to more severe bleeding symptoms than single defect of FV or FVIII of similar degree."
    explanation: Supports the statement that the double deficiency is not more severe.
  - reference: PMID:18391077
    reference_title: "Genotype-phenotype correlation in combined deficiency of factor V and factor VIII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although there is considerable overlap, the mean levels of plasma FV and FVIII in patients with MCFD2 mutations are significantly lower than the corresponding levels in patients with LMAN1 mutations."
    explanation: Supports the gene-level difference in mean factor levels.
- name: Reduced Platelet Factor V
  biological_scale: CELLULAR
  description: >-
    About a fifth of circulating factor V is stored in platelet alpha-granules
    and is derived from plasma factor V by megakaryocyte endocytosis. In this
    disorder the platelet pool is reduced to the same degree as plasma factor V.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  evidence:
  - reference: PMID:18391077
    reference_title: "Genotype-phenotype correlation in combined deficiency of factor V and factor VIII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Measurement of platelet factor V (FV) levels in 7 F5F8D patients (4 with LMAN1 and 3 with MCFD2 mutations) demonstrated similar reductions to those observed for plasma FV."
    explanation: Direct measurement of reduced platelet factor V in patients.
- name: Hepatocyte ER Retention of Alpha-1-Antitrypsin
  biological_scale: CELLULAR
  description: >-
    The LMAN1-MCFD2 receptor also exports alpha-1-antitrypsin. Knockout mice
    and knockout hepatoma cells accumulate it in the hepatocyte endoplasmic
    reticulum and secrete less of it. No liver or lung consequence has been
    reported in patients, so this node has no clinical downstream.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  evidence:
  - reference: PMID:29735583
    reference_title: "Analysis of MCFD2- and LMAN1-deficient mice demonstrates distinct functions in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Comparable accumulation of AAT was observed in hepatocyte ER of singly and doubly deficient mice, demonstrating a role for LMAN1 and MCFD2 in efficient ER exit of AAT."
    explanation: Shows hepatocyte ER retention of AAT in LMAN1- and MCFD2-deficient mice.
  - reference: PMID:35322856
    reference_title: "LMAN1-MCFD2 complex is a cargo receptor for the ER-Golgi transport of α1-antitrypsin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we report that LMAN1 and MCFD2 knockout (KO) HepG2 and HEK293T cells display reduced AAT secretion and elevated intracellular AAT levels due to a delayed ER-to-Golgi transport of AAT."
    explanation: Cell-line evidence that the receptor exports AAT.

      label: F5
  - preferred_term: F8
    term:
      id: hgnc:3546
      label: F8
  downstream:
  - target: Reduced Plasma Factor V and Factor VIII
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:12717434
    reference_title: "Bleeding due to disruption of a cargo-specific ER-to-Golgi transport complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These findings suggest that the MCFD2-LMAN1 complex forms a specific cargo receptor for the ER-to-Golgi transport of selected proteins."
    explanation: Frames the disorder as a cargo-specific ER export defect.
  - reference: PMID:21795745
    reference_title: "Mice deficient in LMAN1 exhibit FV and FVIII deficiencies and liver accumulation of α1-antitrypsin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Levels of plasma FV and FVIII, and platelet FV, are all reduced to ∼ 50% of wild-type in Lman1(-/-) mice, compared with the 5%-30% levels typically observed in human F5F8D patients."
    explanation: >-
      LMAN1 knockout mice reproduce the coordinate reduction, confirming that
      loss of the receptor reduces export of both factors in vivo.
- name: Reduced Plasma Factor V and Factor VIII
  biological_scale: ORGANISM
  description: >-
    Plasma factor V and factor VIII activities fall together, usually to 5-30%
    of normal (typically 10-20%). Mean levels are lower in MCFD2-related than in
    LMAN1-related disease. Bleeding severity correlates poorly with factor
    levels, and two simultaneous deficiencies do not bleed more than a single
    factor V or factor VIII deficiency of similar degree.
  biological_processes:
  - preferred_term: blood coagulation
    modifier: DECREASED
    term:
      id: GO:0007596
      label: blood coagulation
  downstream:
  - target: Reduced Platelet Factor V
    causal_link_type: DIRECT
    description: >-
      Platelet factor V is taken up from plasma by megakaryocytes, so the
      platelet pool falls with plasma factor V.
    evidence:
    - reference: PMID:39209292
      reference_title: "Clinical, Laboratory, Molecular, and Reproductive Aspects of Combined Deficiency of Factors V and VIII."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "In humans, plasma FV is synthesized by hepatocytes and platelet FV is derived from plasma FV via endocytosis by megakaryocytes."
      explanation: Platelet factor V derives from the plasma pool, which is why it falls with plasma factor V.

    - reference: PMID:18391077
      reference_title: "Genotype-phenotype correlation in combined deficiency of factor V and factor VIII."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that a novel MCFD2 missense mutation identified here (D81Y) and 2 previously reported mutations (D89A and D122V) abolish MCFD2 binding to LMAN1."
      explanation: Patient MCFD2 missense variants abolish complex formation with LMAN1.
    - reference: PMID:17971482
      reference_title: "Deletion of 3 residues from the C-terminus of MCFD2 affects binding to ERGIC-53 and causes combined factor V and factor VIII deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Biochemical and structural analysis of the DeltaSLQ mutant demonstrated impaired binding to ERGIC-53 due to modification of the 3-dimensional structure of MCFD2."
      explanation: A patient-derived C-terminal MCFD2 truncation also impairs binding to LMAN1 (ERGIC-53).
  evidence:
  - reference: PMID:12717434
    reference_title: "Bleeding due to disruption of a cargo-specific ER-to-Golgi transport complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show that inactivating mutations in MCFD2 cause F5F8D with a phenotype indistinguishable from that caused by mutations in LMAN1."
    explanation: Establishes inactivating MCFD2 variants as the lesion in type 2.
  - reference: PMID:17971482
    reference_title: "Deletion of 3 residues from the C-terminus of MCFD2 affects binding to ERGIC-53 and causes combined factor V and factor VIII deficiency."

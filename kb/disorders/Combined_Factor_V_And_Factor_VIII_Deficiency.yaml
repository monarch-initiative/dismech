name: Combined Factor V and Factor VIII Deficiency
creation_date: "2026-10-31T18:30:00Z"
category: Mendelian
synonyms:
- F5F8D
- combined deficiency of factor V and factor VIII
- combined factor V and VIII deficiency
- familial multiple coagulation factor deficiency I
description: >-
  An autosomal recessive bleeding disorder in which plasma coagulation factor V
  and factor VIII are reduced together, usually to 5-30% of normal. It is not
  caused by variants in F5 or F8. Instead, biallelic loss-of-function variants
  in LMAN1 (ERGIC-53) or MCFD2 disrupt a two-subunit, calcium-dependent cargo
  receptor that carries both factors from the endoplasmic reticulum to the
  ER-Golgi intermediate compartment, so less of each is secreted.

  LMAN1 is a hexameric transmembrane mannose-binding lectin and MCFD2 a small
  soluble EF-hand protein. Missense variants in either gene act mainly by
  disrupting formation of the LMAN1-MCFD2 complex, and the two genetic types are
  clinically indistinguishable, so they are curated as subtypes of one entry
  with one pathograph. Patients with MCFD2 variants have on average somewhat
  lower factor levels than patients with LMAN1 variants, with wide overlap.

  Bleeding is mild to moderate: excessive bleeding after trauma, surgery,
  dental extraction, circumcision or childbirth is the most common
  presentation, with epistaxis, gingival bleeding, bruising and menorrhagia as
  the common spontaneous symptoms. Hemarthrosis, gastrointestinal bleeding,
  hematuria and intracranial hemorrhage are uncommon. Screening shows
  prolongation of both the prothrombin time and the activated partial
  thromboplastin time.

  There is no factor V concentrate, so treatment combines fresh frozen plasma
  (the only source of factor V) with factor VIII concentrate or desmopressin,
  plus antifibrinolytics, mostly on demand or around procedures.

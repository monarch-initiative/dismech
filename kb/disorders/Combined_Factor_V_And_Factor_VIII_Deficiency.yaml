    explanation: Documents the large 5' regulatory deletion and the C-terminal truncation in an MCFD2 patient.
- name: LMAN1-MCFD2 Cargo Receptor Complex Disruption
  biological_scale: MOLECULAR
  description: >-
    LMAN1 and MCFD2 form a calcium-dependent cargo receptor that cycles between
    the endoplasmic reticulum and the ER-Golgi intermediate compartment. The
    LMAN1 carbohydrate recognition domain holds separable binding sites for
    MCFD2 and for high-mannose glycans on factor V and factor VIII, and the
    MCFD2 EF-hand domains bind both LMAN1 and the cargo. Loss of either
    subunit, or any missense variant that prevents the two from associating,
    removes a functional receptor.
  cell_types:
  - preferred_term: hepatocyte, the site of factor V synthesis
    term:
      id: CL:0000182
      label: hepatocyte
  - preferred_term: endothelial cell, the site of factor VIII synthesis
    term:
      id: CL:0000115
      label: endothelial cell
  molecular_functions:
  - preferred_term: cargo receptor activity
    modifier: DECREASED
    term:
      id: GO:0038024
      label: cargo receptor activity
  cellular_components:
  - preferred_term: ER-Golgi intermediate compartment
    term:
      id: GO:0005793
      label: endoplasmic reticulum-Golgi intermediate compartment
  genes:
  - preferred_term: LMAN1
    term:
      id: hgnc:6631
      label: LMAN1
  - preferred_term: MCFD2
    term:
      id: hgnc:18451
      label: MCFD2
  downstream:
  - target: Impaired ER-to-Golgi Export of Factor V and Factor VIII
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16304051
      reference_title: "Combined deficiency of factor V and factor VIII is due to mutations in either LMAN1 or MCFD2."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "LMAN1 and MCFD2 form a protein complex that functions as a cargo receptor ferrying FV and FVIII from the endoplasmic reticulum to the Golgi."
      explanation: Links the receptor complex to the transport step it performs.
  - target: Hepatocyte ER Retention of Alpha-1-Antitrypsin
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23852824
    reference_title: "Combined deficiency of coagulation factors V and VIII: an update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Disrupting the LMAN1-MCFD2 receptor, complex formation is the primary molecular defect of missense mutations leading to F5F8D."
    explanation: States that loss of complex formation is the shared molecular defect.
  - reference: PMID:20817851
    reference_title: "Molecular basis of LMAN1 in coordinating LMAN1-MCFD2 cargo receptor formation and ER-to-Golgi transport of FV/FVIII."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, the CRD of LMAN1 contains distinct, separable binding sites for both its partner protein (MCFD2) and the cargo proteins (FV/FVIII)."
    explanation: Supports the receptor architecture described in this node.
  - reference: PMID:20007547
    reference_title: "EF-hand domains of MCFD2 mediate interactions with both LMAN1 and coagulation factor V or VIII."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results suggest that the EF-hand domains of MCFD2 contain separate binding sites for LMAN1 and FV/FVIII that are essential for cargo receptor formation and cargo loading in the ER."
    explanation: Supports the role of the MCFD2 EF-hand domains in the receptor.
  - reference: PMID:20142513
    reference_title: "Structural basis for the cooperative interplay between the two causative gene products of combined factor V and factor VIII deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The interaction is independent of sugar-binding of ERGIC-53 and involves most of the missense mutation sites of MCFD2 so far reported in F5F8D."
    explanation: >-
      The crystal structure places most patient MCFD2 missense sites at the
      LMAN1 (ERGIC-53) binding interface.
- name: Impaired ER-to-Golgi Export of Factor V and Factor VIII
  biological_scale: CELLULAR
  description: >-
    Without the cargo receptor, newly made factor V (in hepatocytes) and factor
    VIII (in endothelial cells) leave the endoplasmic reticulum
    inefficiently, so less of each is secreted. Export is reduced rather than
    abolished, which is why plasma levels fall to roughly 5-30% of normal
    rather than to zero.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: ER to Golgi transport of factor V and factor VIII
    modifier: DECREASED
    term:
      id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
  - preferred_term: secretion of factor V and factor VIII
    modifier: DECREASED
    term:
      id: GO:0009306
      label: protein secretion

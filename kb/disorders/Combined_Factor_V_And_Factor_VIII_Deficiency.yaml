genetic:
- name: LMAN1
  gene_term:
    preferred_term: LMAN1
    term:
      id: hgnc:6631
      label: LMAN1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: Type 1
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_31792b8d-aca4-4832-b7f7-1993611777d7-2019-11-27T170000.000Z
    subtype: Type 1
    evidence:
    - reference: CGGV:assertion_31792b8d-aca4-4832-b7f7-1993611777d7-2019-11-27T170000.000Z
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "LMAN1 | HGNC:6631 | factor V and factor VIII, combined deficiency of, type 1 | MONDO:0009206 | AR | Definitive"
      explanation: ClinGen's Hemostasis/Thrombosis GCEP classifies LMAN1 in type 1 disease (AR) as Definitive.
  notes: >-
    LMAN1 is on chromosome 18q21.32 and has 13 exons. Most pathogenic alleles are
    null; an adenine mononucleotide repeat in exon 8 is a mutational hotspot.
  evidence:
  - reference: PMID:16304051
    reference_title: "Combined deficiency of factor V and factor VIII is due to mutations in either LMAN1 or MCFD2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combined with our previous reports, we have identified LMAN1 or MCFD2 mutations as the causes of F5F8D in 71 of 76 families."
    explanation: LMAN1 and MCFD2 together explain nearly all genotyped families.
  - reference: PMID:39209292
    reference_title: "Clinical, Laboratory, Molecular, and Reproductive Aspects of Combined Deficiency of Factors V and VIII."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A string of mononucleotide repeat of nine adenines from nucleotide 904 to 912 in exon 8 of LMAN1 appears to be another mutation hotspot"
    explanation: Supports the exon 8 adenine-repeat hotspot named in the notes.
- name: MCFD2
  gene_term:
    preferred_term: MCFD2

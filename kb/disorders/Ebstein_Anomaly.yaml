name: Ebstein Anomaly
creation_date: '2026-08-09T00:00:00Z'
category: Complex
description: >
  Ebstein anomaly is a rare congenital malformation of the tricuspid valve and right
  ventricle in which the septal and posteroinferior leaflets fail to delaminate from
  the underlying ventricular myocardium during valvulogenesis. The functional leaflet
  hinge points are displaced apically into the right ventricular cavity, dividing the
  ventricle into a thin-walled "atrialized" proximal portion contiguous with the right
  atrium and a smaller distal functional chamber. The anterosuperior leaflet is
  typically large, redundant and fenestrated, with abnormal chordal and muscular
  attachments that further impair coaptation. The resulting tricuspid regurgitation,
  right atrial dilation, and right ventricular myopathy produce a clinical spectrum
  spanning fetal circular shunt and hydrops, neonatal cyanotic heart failure, and
  incidental diagnosis in an asymptomatic adult. An interatrial communication is
  present in most patients and permits right-to-left shunting with cyanosis and
  paradoxical embolism. Discontinuity of the central fibrous body at the abnormal
  atrioventricular junction leaves accessory atrioventricular pathways, making Ebstein
  anomaly the congenital heart defect most strongly associated with ventricular
  pre-excitation; atrial fibrillation and flutter dominate the arrhythmia burden in
  adults. Cone reconstruction of the tricuspid valve is the contemporary surgical
  standard, with the Starnes procedure reserved for the unrepairable neonate.

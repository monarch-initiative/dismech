- category: Respiratory
  name: Asthma
  description: >
    Reported commonly in children with SAD, alongside rhinitis. Worth
    recording as a comorbid feature rather than a complication: it is a
    frequent reason such children are already under specialist care, and
    recurrent "asthma exacerbations" in this group may be recurrent infection.
  phenotype_term:

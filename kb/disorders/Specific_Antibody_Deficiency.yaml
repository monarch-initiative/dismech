name: Specific Antibody Deficiency
creation_date: "2026-08-31T09:40:00Z"
category: Complex
disease_term:
  preferred_term: immunodeficiency due to selective anti-polysaccharide antibody deficiency
  term:
    id: MONDO:0019093
    label: immunodeficiency due to selective anti-polysaccharide antibody deficiency
description: >
  Specific antibody deficiency (SAD, also SPAD; ICD-10 D80.6) is a
  predominantly-antibody inborn error of immunity recognised by the IUIS, and
  it is defined by what a patient cannot do rather than by what they lack.
  Total IgG, IgA, IgM and the IgG subclasses are all normal, and the response
  to protein antigens is intact; what fails is the antibody response to
  unconjugated polysaccharide antigen, measured as titres after the 23-valent
  pneumococcal polysaccharide vaccine. Clinically the result is recurrent
  sinopulmonary infection with encapsulated bacteria - otitis media,
  sinusitis, pneumonia - in someone whose routine immunoglobulin panel is
  reassuringly normal.

  The mechanism is an immature-for-age failure of the T-independent type 2
  response. Unconjugated capsular polysaccharide has no peptide to present, so
  it cannot recruit T-cell help; it must activate B cells directly, and the
  cells able to do that mature late in childhood. The response is normally
  absent in healthy children under two and appears by about age two - which is
  why the diagnosis cannot be made before then. SAD is, in effect, that normal
  infant state persisting or recurring in an older child or adult.

  This entry is a deliberate test of how the dismech schema handles a disease
  with no locus. There is no causal gene: the origin and molecular defect are
  unknown, so the pathophysiology chain here starts at a cellular process
  rather than at a variant. It is also a disease whose case definition is
  contested at the level of the assay - how many serotypes, what titre, what
  fold rise - which means the boundary of the entity moves with the criteria
  used. Both facts are curated explicitly rather than smoothed over, and they
  are the two things a reader most needs to know before using this entry.

synonyms:
- specific antibody deficiency
- SAD
- SPAD
- selective antibody deficiency with normal immunoglobulins
- impaired polysaccharide responsiveness
- partial antibody deficiency
- selective anti-polysaccharide antibody deficiency

parents:
- Predominantly antibody deficiency
- Inborn error of immunity

notes: >
  No gene, and the entry says so structurally. There is no `genetic:` section
  because there is no causal gene to put in one: the defining review states
  the origin and molecular defect are unknown. Reviewers should read the
  absence as curated, not as an unfinished section. That also means the
  `category` here is `Complex` rather than `Mendelian`, and the entry cannot
  carry an `inheritance:` block.

  The case definition is the disease's largest uncertainty, and it is
  methodological rather than biological. Diagnosis rests on titres after
  PPSV23, and there is no consensus on the magnitude of response or the number
  of serotypes that counts as adequate; responses are age-dependent and
  probably serotype-dependent. Prevalence estimates in referral series
  consequently range from about 6% to 24% of children investigated for
  recurrent infection, which is a range about the criteria at least as much as
  about the populations. Every prevalence and severity statement in this entry
  is therefore tied to its stated criterion.

  A conjugate-vaccine trap worth knowing. Because PCV13 generates a
  T-dependent response, protective titres to serotypes contained in a
  conjugate vaccine the patient has already received do not exclude SAD.
  Testing has to use serotypes present in PPSV23 only - at least six of them
  by the US practice-parameter recommendation. A "normal" pneumococcal panel
  in a conjugate-vaccinated patient is one of the commonest ways this
  diagnosis is missed.

  Secondary and syndromic phenocopies. The SAD phenotype occurs inside other
  established immunodeficiencies - Wiskott-Aldrich syndrome, partial DiGeorge
  syndrome, NEMO deficiency - so a polysaccharide-response failure is a
  finding that needs a differential, not a diagnosis on its own. This entry
  covers the isolated entity.

  Treatment evidence is thin and the entry does not inflate it. Antibiotic
  prophylaxis is the mainstay by consensus, with no standardised regimen and
  no efficacy studies in SAD specifically; immunoglobulin therapy is
  recommended by expert guidelines on the strength of retrospective
  observation. Both treatments carry `directness: INDIRECT` for exactly that
  reason.

prevalence:
- population: Children investigated for recurrent infection (referral series)
  measure_type: POINT_PREVALENCE
  prevalence_class: COMMON
  rate_per_100000: 10000.0
  rate_low: 6000.0
  rate_high: 14000.0
  notes: >-
    6-14% across three paediatric series of 100, 45 and 100 children evaluated
    for recurrent infection. This is a prevalence within a referred and
    already-symptomatic population, not a population prevalence, and it moves
    with the serological criterion used. A separate chart review of 91 referred
    children reported 23.1%.
  evidence:
  - reference: PMID:28588580
    reference_title: "Specific Antibody Deficiency: Controversies in Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In three studies evaluating children for recurrent infection (n = 100, 45, and 100, respectively), SAD was found to occur in 6-14% of individuals"
    explanation: >-
      The paediatric referral-series estimate with its three denominators
      given explicitly.
- population: Adults with chronic rhinosinusitis (referral series)
  measure_type: POINT_PREVALENCE
  prevalence_class: COMMON
  rate_per_100000: 20000.0
  rate_low: 11600.0
  rate_high: 24000.0
  notes: >-
    11.6% in one retrospective series of 129 adults and 23-24% in two larger
    series (n = 239 and n = 595). The near-twofold spread between studies of
    the same clinical population is the clearest available measure of how much
    the diagnostic criterion matters.
  evidence:
  - reference: PMID:28588580
    reference_title: "Specific Antibody Deficiency: Controversies in Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in 1 retrospective study of 129 adults with chronic rhinosinusitis, 11.6% were diagnosed with SAD"
    explanation: >-
      The lower of the two adult rhinosinusitis estimates, with its
      denominator.
- population: Adults with SPAD, multicenter observational cohort
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Not an occurrence rate. Recorded because it is the only cohort that
    describes who adult patients actually are: 55 patients, median age 45 at
    diagnosis, 75% female, 38% with a coexisting allergic or inflammatory
    disorder. That sex ratio and comorbidity profile are what a clinician
    should have in mind when deciding whom to test.
  evidence:
  - reference: PMID:40097777
    reference_title: "Diagnosis, Characteristics, and Outcome of Selective Anti-polysaccharide Antibody Deficiencies In A Retrospective Cohort of 55 Adult Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conducted a multicenter observational study involving 55 adult patients with SPAD."
    explanation: >-
      The largest adult cohort. The demographics quoted in `notes` above -
      median age 45, 75% female, 38% with allergic or inflammatory
      comorbidity - are in the same sentence and the ones following it; the
      snippet stops before the first bracketed interquartile range, because
      the reference validator strips square-bracketed spans before matching.

- population: General population
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Unknown. SAD has been estimated to be the eighth most commonly identified
    inborn error of immunity globally, but registry figures rest on
    inconsistent definitions across centres and the condition is not reported
    in all regions, so that ranking cannot be converted into a rate.
  evidence:
  - reference: PMID:28588580
    reference_title: "Specific Antibody Deficiency: Controversies in Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of SAD in the general population is unclear"
    explanation: >-
      States directly that no population estimate exists, which is why this
      record carries a class of UNKNOWN rather than a computed rate.

has_subtypes:
- name: Mild
  display_name: Mild phenotype (multiple non-protective serotypes)
  description: >
    Multiple serotypes to which the patient did not generate protective titres
    or could not raise titres twofold. The mildest of the four working-group
    tiers and the commonest presentation.
- name: Moderate
  display_name: Moderate phenotype (protective titres to <50% or <70% of serotypes)
  description: >
    Protective titres to three or more serotypes, but to fewer than half of
    serotypes tested in children under six, or fewer than 70% in those over
    six. The age split matters: the same serological result means different
    things at different ages.
- name: Severe
  display_name: Severe phenotype (protective titres to two or fewer serotypes)
  description: >
    Protective titres against two or fewer serotypes, and the titres that are
    generated tend to be low.
- name: Memory
  display_name: Memory phenotype (adequate initial response, not sustained)
  description: >
    An initially adequate response to vaccination that is not sustained beyond
    six months. Named by analogy rather than by mechanism - pure polysaccharide
    vaccines do not generate a long-lived memory B-cell response in the first
    place, so "memory phenotype" describes patients who lose their PPSV23
    response faster than usual rather than patients with a demonstrated memory
    defect. Detecting it requires a second titre at six months, so it is missed
    by any protocol that measures only the four-week response.

mechanistic_hypotheses:
- hypothesis_group_id: ti2_marginal_zone_maturation_failure
  hypothesis_label: T-Independent Type 2 / Marginal-Zone Maturation Failure Model
  status: EMERGING
  description: >-
    The proposal is that SAD is a persistent or relapsing failure of the
    T-independent type 2 arm of humoral immunity - the pathway by which B
    cells respond to repetitive capsular polysaccharide without T-cell help,
    and which matures late, around the second year of life. The model explains
    the entity's defining dissociation (normal protein responses, absent
    polysaccharide responses), its age floor, and its infection pattern with
    encapsulated organisms. Its status is EMERGING rather than CANONICAL
    because no molecular lesion has been identified in this pathway in SAD
    patients; the strongest cellular correlate is reduced switched memory B
    cells, which is an association in a subset rather than a demonstrated
    cause.

pathophysiology:
- name: Failure of T-Independent Type 2 B Cell Activation
  biological_scale: CELLULAR
  description: >
    The core lesion, defined functionally because it cannot yet be defined
    molecularly. Unconjugated capsular polysaccharide is a repetitive
    carbohydrate with no peptide epitope, so it cannot be presented on MHC
    class II and cannot recruit T-cell help; it must instead crosslink the B
    cell receptor and activate B cells directly. In SAD that direct route
    fails while the T-dependent route - protein antigens, conjugate vaccines -
    works normally. The dissociation is the disease.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: marginal zone B cell
    term:
      id: CL:0000845
      label: marginal zone B cell of spleen
  biological_processes:
  - preferred_term: B cell activation
    modifier: DECREASED
    term:
      id: GO:0042113
      label: B cell activation
  - preferred_term: immunoglobulin production
    modifier: DECREASED
    term:
      id: GO:0002377
      label: immunoglobulin production
  evidence:
  - reference: PMID:28588580
    reference_title: "Specific Antibody Deficiency: Controversies in Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is a pure polysaccharide vaccine, meaning that it induces a T-cell-independent response by stimulating B-cells in the absence of T-helper cells"
    explanation: >
      Establishes that the failing test antigen works through the
      T-independent route, which is what makes this node the mechanism rather
      than a restatement of the assay.
  - reference: PMID:28588580
    reference_title: "Specific Antibody Deficiency: Controversies in Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SAD mimics the deficient immune response often seen in healthy young children and infants who are unable to mount a robust response to pure unconjugated polysaccharide antigens such as Streptococcus pneumoniae polysaccharide and Haemophilus influenzae type b capsular polysaccharide."
    explanation: >
      The developmental framing: the SAD state is the normal infant state
      persisting. This is the observation that grounds the maturation model
      and the age-two diagnostic floor.
  - reference: PMID:28588580
    reference_title: "Specific Antibody Deficiency: Controversies in Diagnosis and Management."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "The origin and underlying molecular defects of SAD are not known"
    explanation: >
      Graded NO_EVIDENCE because it is precisely a statement that no evidence
      identifies a molecular cause. It is curated here so that the absence of
      a molecular node in this entry is visibly a finding rather than an
      omission.
  downstream:
  - target: Reduced Switched Memory B Cell Compartment
    description: >-
      A reported cellular correlate in SAD patients, of uncertain causal
      direction.
    hypothesis_groups:
    - ti2_marginal_zone_maturation_failure
  - target: Absent Protective Anticapsular Antibody
    description: >-
      No opsonising antibody is generated against pneumococcal capsular
      serotypes.
    hypothesis_groups:
    - ti2_marginal_zone_maturation_failure

- name: Reduced Switched Memory B Cell Compartment
  biological_scale: CELLULAR
  description: >
    Decreased numbers of switched memory B cells have been reported in SAD
    patients. This is the closest thing the disease has to a cellular marker,
    and the entry is careful about what it supports: the observation is an
    association reported in a subset, the direction of causation is untested,
    and the cell type implicated is the one that carries T-dependent memory,
    which is not obviously the compartment that should fail in a
    T-independent-response disorder. It is curated because it is the only
    cellular finding on record, not because it is established.
  cell_types:
  - preferred_term: class switched memory B cell
    term:
      id: CL:0000972
      label: class switched memory B cell
  biological_processes:
  - preferred_term: isotype switching
    modifier: DECREASED
    term:
      id: GO:0045190
      label: isotype switching
  evidence:
  - reference: PMID:28588580
    reference_title: "Specific Antibody Deficiency: Controversies in Diagnosis and Management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "decreased numbers of switched memory B-cells, which may play a key role in the protection against infection with polysaccharide-encapsulated bacteria, have been reported in patients with SAD"
    explanation: >
      The only reported cellular correlate. INDIRECT because the source hedges
      it twice - "may play a key role", "have been reported" - and because it
      is cited secondhand in this review rather than measured in it.
  downstream:
  - target: Absent Protective Anticapsular Antibody
    description: >-
      Fewer memory B cells available to produce or sustain anticapsular
      antibody.
    hypothesis_groups:
    - ti2_marginal_zone_maturation_failure

- name: Absent Protective Anticapsular Antibody
  biological_scale: ORGANISM
  description: >
    The measurable endpoint and the diagnostic criterion at once: serotype
    -specific IgG against pneumococcal capsular polysaccharide fails to reach
    or to sustain protective titres after PPSV23. Note that this node is
    unusual in being simultaneously the mechanism's output and the assay that
    defines the disease, which is why the entity's boundary moves whenever the
    assay's cut-offs are renegotiated.
  biological_processes:
  - preferred_term: B cell mediated immunity
    modifier: DECREASED
    term:
      id: GO:0019724
      label: B cell mediated immunity
  evidence:
  - reference: PMID:32654695
    reference_title: "Diagnosis and management of Specific Antibody Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "defined by recurrent respiratory infections with normal immunoglobulins, but diminished antibody responses to polysaccharide antigens after vaccination with the 23 valent pneumococcal polysaccharide vaccine"
    explanation: >
      The case definition, which is also the statement of this node.
  - reference: PMID:28588580
    reference_title: "Specific Antibody Deficiency: Controversies in Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the definition of an adequate response to immunization remains controversial, including the magnitude of response and number of pneumococcal serotypes needed to determine a normal response"
    explanation: >
      Records that the threshold on this node is contested, which is the
      caveat every downstream claim in the entry inherits.
  downstream:
  - target: Recurrent Encapsulated-Organism Sinopulmonary Infection
    description: >-
      Loss of opsonisation against encapsulated respiratory pathogens.
    hypothesis_groups:
    - ti2_marginal_zone_maturation_failure

- name: Recurrent Encapsulated-Organism Sinopulmonary Infection
  biological_scale: ORGANISM
  description: >
    The clinical consequence: recurrent upper and lower respiratory tract
    infection, otitis media and sinusitis, with encapsulated bacteria. SAD is
    among the most commonly identified immune disorders in patients presenting
    with recurrent sinopulmonary infection, which is the practical reason to
    know about it - the presenting picture is common and the diagnosis is
    invisible on a standard immunoglobulin panel.
  evidence:
  - reference: PMID:28588580
    reference_title: "Specific Antibody Deficiency: Controversies in Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients are highly susceptible to severe respiratory tract infections with encapsulated bacteria, and SAD is one of the most commonly identified immune disorders in patients presenting with recurrent sinopulmonary infections"
    explanation: >
      Links the antibody defect to its organism-specific clinical
      consequence, and states the diagnostic yield in this presentation.

phenotypes:
- category: Immunologic
  name: Impaired Antibody Response to Unconjugated Pneumococcal Polysaccharide
  description: >
    The defining laboratory phenotype. Measured as serotype-specific IgG four
    weeks after PPSV23, and repeated at six months where a memory phenotype is
    suspected. The HP term used here is the severe-end term; milder tiers are
    captured by the `has_subtypes` entries.
  phenotype_term:
    preferred_term: Impaired specific antibody response
    term:
      id: HP:0012475
      label: Impaired specific antibody response
  evidence:
  - reference: PMID:28588580
    reference_title: "Specific Antibody Deficiency: Controversies in Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Specific antibody deficiency (SAD) is a primary immunodeficiency disease characterized by normal immunoglobulins (Igs), IgA, IgM, total IgG, and IgG subclass levels, but with recurrent infection and diminished antibody responses to polysaccharide antigens following vaccination."
    explanation: >
      The full case definition, including the normal immunoglobulin levels
      that are as definitional as the failed response.

- category: Immunologic
  name: Severely Absent Pneumococcal Polysaccharide Response
  subtype: Severe
  description: >
    The severe tier: protective titres against two or fewer serotypes, and
    those low. Recorded as a separate phenotype because HPO has a term at
    exactly this granularity, which makes the severity tier machine-queryable
    rather than only prose.
  phenotype_term:
    preferred_term: Complete or near-complete absence of specific antibody response to unconjugated pneumococcus polysaccharide
    term:
      id: HP:0410300
      label: Complete or near-complete absence of specific antibody response to unconjugated pneumococcus polysaccharide
    severity: SEVERE
  evidence:
  - reference: PMID:28588580
    reference_title: "Specific Antibody Deficiency: Controversies in Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A severe phenotype is described as producing protective titers against two or fewer serotypes, and those protective titers generated tend to be low."
    explanation: >
      Defines the severe tier in the working-group classification this
      entry's subtypes follow.

- category: Infectious
  name: Recurrent Sinopulmonary Infections

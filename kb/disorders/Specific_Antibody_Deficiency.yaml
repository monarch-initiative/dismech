    reference_title: "Specific Antibody Deficiency: Controversies in Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients typically present with recurrent upper and lower respiratory tract infections, otitis media, and sinusitis"
    explanation: >
      The presenting infection pattern, upper and lower tract together.

- category: Infectious
  name: Recurrent Otitis Media
  phenotype_term:
    preferred_term: Recurrent otitis media

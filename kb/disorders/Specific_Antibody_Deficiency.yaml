- category: Respiratory
  name: Bronchiectasis
  description: >
    The complication that makes delayed diagnosis costly rather than merely
    untidy. In the adult cohort, patients who had developed bronchiectasis had
    been symptomatic for a median of 122 months before diagnosis against 24
    months for those who had not - a fivefold difference, and the strongest
    argument in this entry for testing earlier rather than after another
    winter of antibiotics.

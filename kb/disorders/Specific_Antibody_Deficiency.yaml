diagnosis:
- name: Pneumococcal polysaccharide vaccine challenge with serotype-specific titres
  description: >
    The diagnostic test is a deliberate immunisation followed by titres:
    PPSV23, serotype-specific IgG at about four weeks, and - where an initial
    response is adequate but infections recur - a repeat at six months to
    catch the memory phenotype. Three constraints make this harder than it
    looks. The diagnosis cannot be made before age two, because failure to
    respond is normal below it. Serotypes present in any conjugate vaccine the
    patient has received must be excluded, and at least six PPSV23-only
    serotypes tested. And normal immunoglobulins, including IgG subclasses,
    are required - a low IgG points to common variable immunodeficiency
    instead.
  evidence:
  - reference: PMID:28588580
    reference_title: "Specific Antibody Deficiency: Controversies in Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "for patients who have previously received at least one dose of conjugate vaccine, normal antibody levels against serotypes in the conjugate vaccine do not exclude the diagnosis of SAD; thus, at least six serotypes should be tested that are present in PPSV23 only"
    explanation: >
      The conjugate-vaccine confound and the specific testing rule that
      handles it - the commonest way this diagnosis is missed.
  - reference: PMID:28588580
    reference_title: "Specific Antibody Deficiency: Controversies in Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a result, the diagnosis should not be conferred until after 2 years of age"
    explanation: >
      The age floor, which follows from the normal developmental immaturity of
      the polysaccharide response.
  - reference: PMID:28588580
    reference_title: "Specific Antibody Deficiency: Controversies in Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with CVID exhibit low IgG and usually IgA levels, and potentially low IgM levels, whereas patients with SAD exhibit normal IgG, IgA and IgM, and IgG subclass levels"
    explanation: >
      The differential against common variable immunodeficiency, stated in
      terms of the laboratory finding that separates them.
  - reference: PMID:28588580
    reference_title: "Specific Antibody Deficiency: Controversies in Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If the response is adequate, titers should be measured again 6 months after the vaccination in consideration of a possible"
    explanation: >
      The six-month repeat titre, which is the only way the memory phenotype
      is detected.


    term:
      id: HP:0000246
      label: Sinusitis
    temporality: CHRONIC
  description: >
    The characteristic adult presentation. Between 11.6% and 24% of adults
    referred with chronic rhinosinusitis in retrospective series were
    diagnosed with SAD, which makes this the single highest-yield clinical
    setting in which to test for it.
  evidence:

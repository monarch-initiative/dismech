    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Asthma and rhinitis are also commonly reported in children with SAD"
    explanation: >
      Records the reported association with asthma and rhinitis in the
      paediatric population.

discussions:
- discussion_id: spad_case_definition_instability
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Absent Protective Anticapsular Antibody
  - prevalence#
  prompt: >-
    What serological threshold - how many serotypes, what absolute titre, what
    fold rise, at what age - actually separates people who benefit from
    treatment for specific antibody deficiency from people who do not?
  rationale: >
    Every other uncertainty in this entry is downstream of this one. The
    prevalence range in adults with chronic rhinosinusitis, 11.6% to 24%
    across three retrospective series of the same clinical population, is
    largely a range about the criterion rather than about the populations. The
    four severity tiers are defined by the same contested numbers. And because
    the assay is the case definition, changing the cut-off does not
    reclassify patients within the disease - it changes who has the disease.

    Two things make this resolvable in principle rather than merely
    lamentable. Antibody responses are age-dependent and probably
    serotype-dependent, so a criterion that conditioned on both would be
    better founded than the current flat thresholds. And the outcome that
    matters - infection burden, and response to prophylaxis or immunoglobulin
    - is measurable, so a criterion could in principle be validated against it
    rather than set by consensus. Neither has been done, and the review states
    plainly that natural-history data are what is missing.
  evidence:
  - reference: PMID:28588580
    reference_title: "Specific Antibody Deficiency: Controversies in Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Confounding these issues, anti-polysaccharide antibody responses are age- and probably serotype dependent."
    explanation: >
      Names the two variables a validated criterion would have to condition
      on, and does so with the hedge ("probably") that shows the second is not
      yet established.
  - reference: PMID:32654695
    reference_title: "Diagnosis and management of Specific Antibody Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical immunologists struggle with diagnosis and treatment, because the definition of an adequate response to immunization remains controversial."
    explanation: >
      An independent statement, three years later, that the definitional
      problem is unresolved and that it is the reason management is difficult.
  proposed_experiments:
  - experiment_id: spad_criterion_outcome_validation
    name: Prospective validation of PPSV23 response criteria against infection outcome
    description: >-
      Follow a prospectively enrolled cohort presenting with recurrent
      sinopulmonary infection and normal immunoglobulins, measure
      serotype-specific titres at four weeks and six months using serotypes
      absent from any conjugate vaccine received, and test each candidate
      criterion for how well it predicts subsequent infection burden and
      response to prophylaxis - rather than how well it agrees with expert
      opinion.
    would_support:
    - pathophysiology#Absent Protective Anticapsular Antibody
    supporting_outcome:
    - >-
      One criterion separates patients by subsequent infection burden and by
      benefit from prophylaxis, giving the entity an outcome-anchored boundary
      and turning the four severity tiers into a graded prediction rather than
      a serological description.
    would_refute:
    - pathophysiology#Absent Protective Anticapsular Antibody
    refuting_outcome:
    - >-
      No threshold predicts infection burden or treatment benefit, which would
      mean the polysaccharide response measures something real but not the
      thing that makes these patients ill, and that SAD as currently defined is
      a laboratory finding rather than a disease entity.

treatments:
- name: Pneumococcal Conjugate Vaccination
  description: >
    Given first, and given for two reasons. Therapeutically, a conjugate
    vaccine drives a T-dependent response and so can generate protective
    titres by the route that is intact in SAD - including in patients
    vaccinated in early childhood, where repeating it may produce titres later
    in life. Diagnostically, it is why testing must use PPSV23-only serotypes.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: Vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  evidence:
  - reference: PMID:28588580
    reference_title: "Specific Antibody Deficiency: Controversies in Diagnosis and Management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "If patients have not received the conjugate pneumococcal vaccine, immunization with the conjugate vaccine with the largest number of serotypes available is recommended in all patients with recurrent infections."
    explanation: >
      The recommendation itself. INDIRECT because the source states in the
      same passage that conjugate-vaccine titre generation has not been
      studied in a SAD population, so the benefit is inferred from the
      preserved T-dependent pathway rather than demonstrated.
  - reference: PMID:28588580
    reference_title: "Specific Antibody Deficiency: Controversies in Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "pneumococcal conjugate vaccines were developed, which generate a T-cell-dependent antibody response and are effective in children under 2 years"
    explanation: >
      States the mechanistic rationale - conjugation converts the antigen to
      the T-dependent route, which is the arm SAD leaves intact.
  - reference: PMID:34290713
    reference_title: "The 13-Valent Pneumococcal Conjugate Vaccine Elicits Serological Response and Lasting Protection in Selected Patients With Primary Humoral Immunodeficiency."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "71.4%, 66.7% and 56.0% of the patients were protected at one, six and twelve months respectively"
    explanation: >
      Quantifies both the benefit and its limit: protection is real but wanes
      to roughly half of patients by twelve months, which bears on revaccination
      intervals. INDIRECT and important to read carefully - the 29 patients
      were common variable immunodeficiency or IgG subclass deficiency, not
      SPAD, so this is class-level evidence borrowed across a related
      population.

- name: Antibiotic Prophylaxis
  description: >
    The mainstay of management by consensus, and the entry is explicit that
    consensus is all it is. There is no standardised regimen, no efficacy
    study in SAD, and current practice is extrapolated from immunocompetent
    patients with recurrent otitis media, chronic rhinosinusitis and cystic
    fibrosis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Prophylaxis
    term:
      id: NCIT:C51993
      label: Antibiotic Prophylaxis
  evidence:
  - reference: PMID:28588580
    reference_title: "Specific Antibody Deficiency: Controversies in Diagnosis and Management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mainstay of therapy for patients with SAD is antibiotic prophylaxis. However, there is no consensus regarding the frequency and severity of infections warranting antibiotic prophylaxis and no standardized regimens and no studies of efficacy."
    explanation: >
      Records the treatment and, in the same sentence, that its evidence base
      in this disease is absent. INDIRECT for exactly that reason.
  - reference: PMID:28588580
    reference_title: "Specific Antibody Deficiency: Controversies in Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most cases of SAD present with a relatively mild clinical phenotype, and the consensus is that these should be initially treated with antibiotic prophylaxis."
    explanation: >
      Places prophylaxis as first-line for the majority phenotype, which is
      the practical treatment-sequencing claim.

- name: Immunoglobulin Replacement Therapy
  description: >
    Reserved for patients who fail prophylaxis or have a severe phenotype.
    Recommended by published expert guidelines and supported by retrospective
    observation; the source states that definitive data are lacking, and this
    entry does not imply otherwise.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Immunoglobulin Therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  evidence:
  - reference: PMID:40097777
    reference_title: "Diagnosis, Characteristics, and Outcome of Selective Anti-polysaccharide Antibody Deficiencies In A Retrospective Cohort of 55 Adult Patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "the mean (min-max) frequency of antibiotic courses decreased from 7.9 (2-18) to 0.7 (0-2) courses per year (p < 0.001)"
    explanation: >
      The only quantified treatment effect in this disease: an eleven-fold
      fall in antibiotic courses in 22 SPAD patients over a median 46 months.
      DIRECT because the cohort is SPAD patients and the outcome is measured,
      not inferred - though it is observational and uncontrolled, so it
      establishes the size of an association rather than an effect.
  - reference: PMID:40097777
    reference_title: "Diagnosis, Characteristics, and Outcome of Selective Anti-polysaccharide Antibody Deficiencies In A Retrospective Cohort of 55 Adult Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IgRT is effective in preventing recurrent infections."
    explanation: >
      The authors' own conclusion, recorded alongside the number it rests on

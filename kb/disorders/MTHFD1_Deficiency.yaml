inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic MTHFD1 variants, compound heterozygous in every family reported to date rather
    than homozygous. Reported allele pairs include a splice-site plus a missense variant, a
    missense plus a nonsense variant, and - in a family where standard exome analysis found only
    one heterozygous change - a maternal missense variant paired with a paternally inherited
    exon 13 deletion that was recovered only by manually inspecting exome coverage depth.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:21813566
    reference_title: "Novel inborn error of folate metabolism: identification by exome capture and sequencing of mutations in the MTHFD1 gene in a single proband."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both parents carry a single mutation and an unaffected sibling carries neither mutation."
    explanation: Segregation in the founding pedigree establishes biallelic recessive inheritance.
  - reference: PMID:27707659
    reference_title: "Precision Molecular Diagnosis Defines Specific Therapy in Combined Immunodeficiency with Megaloblastic Anemia Secondary to MTHFD1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A deletion involving exon 13 that was shared with their father was identified."
    explanation: >-
      The second, paternally inherited allele in this family is a structural deletion invisible
      to standard variant calling, which is why the case initially appeared monoallelic.
pathophysiology:
- name: MTHFD1 Trifunctional Enzyme Loss of Function
  description: >-
    Biallelic MTHFD1 variants disable the cytoplasmic trifunctional C1-tetrahydrofolate
    synthase. Reported alleles hit the enzyme in several ways: c.517C>T (p.Arg173Cys) alters a
    critical arginine in the NADP-binding site, c.727+1G>A and c.1674G>A disrupt splicing, an
    exon 13 deletion removes coding sequence outright, and c.673G>T (p.Glu225*) truncates the
    protein. The shared consequence is loss of the enzyme that condenses formate with
    tetrahydrofolate.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: MTHFD1
    term:
      id: hgnc:7432
      label: MTHFD1
  notes: >-
    No mouse model of this disease exists, and the reason is worth recording so nobody adds the
    wrong one. Homozygous Mthfd1 disruption in mouse is early embryonic lethal, so there is no
    viable null. The available Mthfd1S(+/-) mouse models the common R653Q synthetase
    polymorphism, which is a distinct entity from this Mendelian disorder - a low-penetrance
    susceptibility allele studied for neural tube and congenital heart defect risk, not a model
    of biallelic MTHFD1 deficiency. Human patient fibroblasts are therefore the only system in
    which this disease's mechanism has been measured.
  molecular_functions:

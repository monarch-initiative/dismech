      Quantifies residual protein. Note the dissociation: a fourth patient retained ~44% of
      control protein yet still had no detectable dehydrogenase activity, so protein level and
      catalytic function are not interchangeable readouts in this disease.
- name: Depletion of the Cytosolic One-Carbon-Loaded Folate Pool
  description: >-
    MTHFD1 is the primary entry point for single carbons into cytosolic folate metabolism,
    condensing formate with tetrahydrofolate to generate 10-formyl- and
    5,10-methylenetetrahydrofolate. Losing it starves the downstream folate-dependent pathways
    of activated one-carbon units. The starvation is not uniform: patient fibroblast flux
    measurements show it falls hardest on methionine synthesis, next on thymidylate synthesis,
    and not at all on purine synthesis.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

name: MTHFD1 Deficiency
category: Mendelian
creation_date: "2026-09-04T00:00:00Z"
synonyms:
- combined immunodeficiency and megaloblastic anemia with or without hyperhomocysteinemia
- CIMAH
- methylenetetrahydrofolate dehydrogenase 1 deficiency
- MTHFD1 deficiency
- C1-THF synthase deficiency
description: >-
  MTHFD1 deficiency is an autosomal recessive inborn error of folate-mediated one-carbon
  metabolism caused by biallelic loss-of-function variants in MTHFD1, which encodes the
  cytoplasmic trifunctional C1-tetrahydrofolate synthase. The single polypeptide carries
  three activities - 5,10-methylenetetrahydrofolate dehydrogenase, 5,10-methenyltetrahydrofolate
  cyclohydrolase, and 10-formyltetrahydrofolate synthetase - and is the principal entry point
  for one-carbon units into the cytosolic folate pool.

  The clinical core is megaloblastic anemia with a combined immunodeficiency severe enough to
  have been described as SCID, frequently with hyperhomocysteinemia and, in several patients,
  atypical hemolytic uremic syndrome. The "with or without hyperhomocysteinemia" in the MONDO
  label is real: one reported patient developed megaloblastic anemia, infection and autoimmune
  disease without ever becoming hyperhomocysteinemic, so the biochemical marker is not obligate
  and its absence does not exclude the diagnosis.

  What makes this entry worth reading rather than filing as one more folate disorder is that the
  causal pathway was actually discriminated rather than assumed. Two mechanisms were available a
  priori: impaired purine synthesis, the classical route to severe combined immunodeficiency, and
  impaired de novo thymidylate synthesis, the classical route to megaloblastic anemia. Flux
  measurements in patient fibroblasts settled it - formate incorporation into methionine fell by
  90% and into dTMP by 50%, while flux through de novo purine biosynthesis was unaffected. So a
  single lesion in nuclear de novo thymidylate biosynthesis, acting through uracil misincorporation
  and DNA double-strand breaks, accounts for both the anemia and the immunodeficiency. The purine
  route is not merely unproven here; it was looked for and was not there.

  The disorder is folate-responsive, which is unusual and clinically decisive. Folinic acid
  supplementation reversed the immune phenotype in one family to the point that all prophylactic
  therapy was discontinued, and the treatment target is the metabolic block rather than its
  downstream consequences.

treatments:
- name: Folinic Acid
  description: >-
    Reduced folate that bypasses the MTHFD1 block by supplying a one-carbon-loaded folate
    directly. It is disease-modifying rather than supportive: in one family folinic acid
    produced immune reconstitution sufficient to discontinue all prophylactic therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: folinic acid
      term:
        id: CHEBI:15640
        label: 5-formyltetrahydrofolic acid
  target_mechanisms:
  - target: Depletion of the Cytosolic One-Carbon-Loaded Folate Pool
    description: >-
      Supplies reduced folate downstream of the missing enzyme activity, restoring the
      one-carbon-loaded pool the mutant enzyme cannot generate.
  evidence:
  - reference: PMID:27707659
    reference_title: "Precision Molecular Diagnosis Defines Specific Therapy in Combined Immunodeficiency with Megaloblastic Anemia Secondary to MTHFD1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with folinic acid led to immune reconstitution, enabling discontinuation of all prophylactic therapies."
    explanation: >-
      Reports reversal of the immunological phenotype on folinic acid, establishing it as
      targeted rather than supportive therapy.
  - reference: PMID:27707659
    reference_title: "Precision Molecular Diagnosis Defines Specific Therapy in Combined Immunodeficiency with Megaloblastic Anemia Secondary to MTHFD1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Folinic acid was established as precision therapy to reverse the clinical and laboratory phenotype of this primary immunodeficiency."
    explanation: The authors' explicit designation of folinic acid as precision therapy.
  - reference: PMID:42301236
    reference_title: "MTHFD1 Deficiency in Two Unrelated Children: Highlights on Phenotypic Spectrum and Response to Folic Acid Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Precision therapy with prompt folate or folinic acid supplementation can significantly improve outcomes, as evidenced by the survival of one patient with minimal intervention."
    explanation: >-
      Reinforces folate as precision therapy, and the qualifier "prompt" is load-bearing: in the
      same report the second child died on day 18 of intensive care despite antibiotics,
      antifungals, IVIG and dexamethasone. The determinant of outcome is reaching the molecular
      diagnosis in time, not the intensity of supportive treatment.
- name: Folic Acid
  description: >-
    In at least one patient the regimen was successfully reduced to folic acid alone for
    long-term maintenance, so the fully reduced form is not always required.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: folic acid
      term:
        id: CHEBI:27470
        label: folic acid
  target_mechanisms:
  - target: Depletion of the Cytosolic One-Carbon-Loaded Folate Pool
    description: Raises folate availability to drive the residual pathway flux.
  evidence:
  - reference: PMID:25633902
    reference_title: "Characterization and review of MTHFD1 deficiency: four new patients, cellular delineation and response to folic and folinic acid treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "was successfully treated with a regime that included and was eventually reduced to folic acid"
    explanation: Documents long-term maintenance on folic acid alone in one patient.
- name: Hydroxocobalamin
  description: >-
    Given as part of the combination regimen in the patient with hyperhomocysteinemia and
    microangiopathy, and with folate in an independent SCID patient. Its role here is empiric
    and adjunctive rather than mechanistically targeted: the fibroblast studies this entry
    already cites show methionine formation in patient cells did not increase on cobalamin
    supplementation but did respond to folate, which places the block on the folate side. It is

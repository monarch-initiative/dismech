discussions:
- discussion_id: purine_versus_thymidylate_route_to_scid
  kind: INTERPRETATION
  prompt: >-
    Does the combined immunodeficiency in MTHFD1 deficiency arise from impaired purine
    synthesis, as in the classical purine-pathway SCIDs, or from impaired de novo thymidylate
    synthesis?
  rationale: >-
    Both routes were plausible before the flux experiment. Severe combined immunodeficiency is
    classically associated with impaired purine nucleotide metabolism (ADA and PNP deficiency),
    while megaloblastic anemia is classically associated with impaired de novo thymidylate
    biosynthesis - and this disorder has both phenotypes, so a two-lesion explanation was
    available. Labelled flux measurement in patient fibroblasts discriminated between them:
    purine biosynthesis was unaffected, so one lesion in thymidylate synthesis accounts for both
    arms. This is recorded because the resolved answer is easy to lose - the entry's causal
    chain now runs only through thymidylate, and a reader should know that the purine route was
    tested rather than overlooked.
  attaches_to:
  - pathophysiology#Lymphocyte Developmental and Proliferative Failure
  - pathophysiology#Impaired Nuclear de novo Thymidylate Biosynthesis
  evidence:
  - reference: PMID:25548164
    reference_title: "Human mutations in methylenetetrahydrofolate dehydrogenase 1 impair nuclear de novo thymidylate biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SCID has been associated with impaired purine nucleotide metabolism, whereas megaloblastic anemia has been associated with impaired de novo thymidylate (dTMP) biosynthesis."
    explanation: States the two competing prior expectations that the experiment was designed to separate.
  - reference: PMID:25548164
    reference_title: "Human mutations in methylenetetrahydrofolate dehydrogenase 1 impair nuclear de novo thymidylate biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results provide evidence that impaired nuclear de novo dTMP biosynthesis can lead to both megaloblastic anemia and SCID in MTHFD1 deficiency."
    explanation: The authors' conclusion that a single thymidylate lesion explains both phenotypes.

genetic:
- name: MTHFD1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  variants:
  - name: c.517C>T (p.Arg173Cys)
    description: >-
      Missense change to a critical arginine in the NADP-binding site. Recurrent: it is one of
      the two alleles in the founding proband and is homozygous in two unrelated Kuwaiti
      children, so it spans compound-heterozygous and homozygous genotypes.
    functional_effects:
    - function: MTHFD1 trifunctional C1-tetrahydrofolate synthase activity
      description: >-

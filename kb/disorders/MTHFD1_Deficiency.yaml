  - reference: PMID:25548164
    reference_title: "Human mutations in methylenetetrahydrofolate dehydrogenase 1 impair nuclear de novo thymidylate biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The flux of formate incorporation into methionine and dTMP was decreased by 90% and 50%, respectively, whereas formate flux through de novo purine biosynthesis was unaffected."
    explanation: >-
      Quantifies the differential depletion across the three downstream pathways in patient
      fibroblasts, and is the measurement that discriminates the causal route.
- name: Impaired Nuclear de novo Thymidylate Biosynthesis
  description: >-
    Nuclear conversion of dUMP to dTMP by thymidylate synthase requires
    5,10-methylenetetrahydrofolate, for which MTHFD1 is the main source. Patient fibroblasts
    show lower de novo dTMP synthesis with a compensatory rise in salvage-pathway dTMP, and
    MTHFD1 protein becomes enriched in the nucleus at the expense of the cytosol - the cell
    prioritising thymidylate synthesis over homocysteine remethylation when the enzyme is
    limiting. That prioritisation is why the methionine deficit is the larger of the two.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: de novo thymidylate (dTMP) biosynthesis
    modifier: DECREASED
    term:
      id: GO:0006231
      label: dTMP biosynthetic process
  downstream:
  - target: Uracil Misincorporation into Nuclear DNA
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25548164
    reference_title: "Human mutations in methylenetetrahydrofolate dehydrogenase 1 impair nuclear de novo thymidylate biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblasts exhibited enriched MTHFD1 in the nucleus, elevated uracil in DNA, lower rates of de novo dTMP synthesis, and increased salvage pathway dTMP biosynthesis relative to control fibroblasts."
    explanation: >-
      Directly measures the reduced de novo dTMP synthesis and the salvage-pathway compensation
      in cells from the affected proband.
- name: Uracil Misincorporation into Nuclear DNA
  description: >-
    When dTMP runs short the dUTP/dTTP ratio rises and DNA polymerase incorporates uracil in
    place of thymine. Uracil in DNA is elevated in patient fibroblasts. Base-excision repair
    then excises the misincorporated uracil, and when opposing lesions are excised close
    together the transient abasic sites and nicks are converted into strand breaks.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: base-excision repair of misincorporated uracil
    modifier: INCREASED
    term:
      id: GO:0006284
      label: base-excision repair
  downstream:
  - target: Genome Instability with DNA Double-Strand Breaks
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26853819
    reference_title: "MTHFD1 regulates nuclear de novo thymidylate biosynthesis and genome stability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Impairments in de novo thymidylate synthesis result in uracil misincorporation into DNA, which leads to single- and double-strand breaks during base-excision DNA repair."
    explanation: >-
      States the mechanism converting a nucleotide-pool imbalance into physical DNA damage, which
      is the step linking the metabolic lesion to the cellular phenotype.
- name: Genome Instability with DNA Double-Strand Breaks
  description: >-
    Patient fibroblasts carry more double-stranded DNA breaks than controls. Because the damage
    is generated during DNA replication, it falls hardest on the two most rapidly proliferating
    compartments in the body - erythroid precursors and developing lymphocytes - which is what
    gives this metabolic disorder its haematological and immunological presentation rather than
    a diffuse one.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: double-strand break repair burden
    modifier: INCREASED
    term:
      id: GO:0006302
      label: double-strand break repair
  downstream:
  - target: Megaloblastic Erythropoiesis
    causal_link_type: DIRECT
  - target: Lymphocyte Developmental and Proliferative Failure
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26853819
    reference_title: "MTHFD1 regulates nuclear de novo thymidylate biosynthesis and genome stability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblasts exhibited increased DNA damage (double-stranded DNA breaks) compare to control fibroblasts."
    explanation: >-
      Measures the double-strand break burden in patient cells. Quoted verbatim including the
      source's grammatical slip.
  - reference: PMID:26853819
    reference_title: "MTHFD1 regulates nuclear de novo thymidylate biosynthesis and genome stability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results provide strong evidence for the role of MTHFD1 in nuclear de novo dTMP biosynthesis, and connect impaired MTHFD1 specific activity to both megaloblastic anemia and SCID."
    explanation: >-
      The authors' own statement that this single pathway accounts for both arms of the clinical
      phenotype, which is the claim the downstream edges encode.
- name: Megaloblastic Erythropoiesis
  description: >-
    Replication-associated DNA damage and nucleotide-pool imbalance in erythroid precursors
    produce nuclear-cytoplasmic asynchrony: cytoplasmic maturation proceeds while nuclear
    division stalls, giving the enlarged precursors of megaloblastic marrow and an ineffective,
    macrocytic anemia.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: erythroid precursor
    term:
      id: CL:0000547
      label: proerythroblast
  downstream:
  - target: Megaloblastic anemia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25633902
    reference_title: "Characterization and review of MTHFD1 deficiency: four new patients, cellular delineation and response to folic and folinic acid treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The third patient developed megaloblastic anaemia, infection, autoimmune disease and moderate liver fibrosis but not hyperhomocysteinemia, and was successfully treated with a regime that included and was eventually reduced to folic acid."
    explanation: >-
      Documents megaloblastic anemia as a presenting feature, and in a patient without
      hyperhomocysteinemia, which separates this arm of the mechanism from the methionine arm.
- name: Lymphocyte Developmental and Proliferative Failure
  description: >-
    Developing lymphocytes are among the most rapidly dividing cells in the body and depend on
    de novo thymidylate for clonal expansion, so the same replication-linked DNA damage produces
    lymphopenia across all subsets and poor proliferative responses. The immune defect is
    quantitative and metabolic rather than a fixed developmental block: in one family in vitro
    dendritic cell and lymphocyte function was comparable to healthy volunteers despite
    lymphopenia and poor vaccine responses, and the whole phenotype reversed on folinic acid.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  downstream:
  - target: Combined immunodeficiency
    causal_link_type: DIRECT
  - target: Autoimmunity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Lymphopenia
    causal_link_type: DIRECT
  - target: Recurrent infections
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:27707659
    reference_title: "Precision Molecular Diagnosis Defines Specific Therapy in Combined Immunodeficiency with Megaloblastic Anemia Secondary to MTHFD1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Routine laboratory data showed lymphopenia involving all subsets and poor response to vaccines."
    explanation: >-
      Establishes the pan-subset lymphopenia and functional antibody failure that define the
      combined immunodeficiency.
  - reference: PMID:27707659
    reference_title: "Precision Molecular Diagnosis Defines Specific Therapy in Combined Immunodeficiency with Megaloblastic Anemia Secondary to MTHFD1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In vitro analysis of dendritic cell and lymphocyte function was comparable to that in healthy volunteers."
    explanation: >-
      Cells that are present function normally in vitro, supporting a defect of lymphocyte
      production and expansion rather than of intrinsic effector capacity.
  - reference: PMID:23296427
    reference_title: "Severe combined immunodeficiency resulting from mutations in MTHFD1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe the occurrence of severe combined immunodeficiency (SCID) with megaloblastic anemia, leukopenia, atypical hemolytic uremic syndrome, and neurologic abnormalities in which hydroxocobalamin and folate therapy provided partial immune reconstitution."
    explanation: >-
      An independent patient meeting SCID criteria. Note the reconstitution here was *partial*,
      where another family achieved full enough recovery to stop prophylaxis, so the degree of
      immune rescue is not uniform across patients.
- name: Impaired Homocysteine Remethylation to Methionine
  description: >-
    Remethylation of homocysteine to methionine by methionine synthase requires
    5-methyltetrahydrofolate derived from the MTHFD1-generated pool. This is the arm the cell
    sacrifices when MTHFD1 is limiting, and correspondingly it is the arm with the largest flux
    deficit - a 90% fall in formate incorporation into methionine. Patient fibroblasts show
    severely reduced methionine formation that does not respond to cobalamin supplementation but
    does respond to folic and folinic acid, locating the block on the folate side rather than
    the cobalamin side.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: L-methionine biosynthesis by homocysteine remethylation
    modifier: DECREASED
    term:
      id: GO:0071265
      label: L-methionine biosynthetic process
  downstream:
  - target: Systemic Homocysteine Accumulation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25633902
    reference_title: "Characterization and review of MTHFD1 deficiency: four new patients, cellular delineation and response to folic and folinic acid treatment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "which did not increase in cobalamin supplemented culture medium but was responsive to folic and folinic acid"
    explanation: >-
      The clause describes patient-fibroblast methionine formation from labelled formate, and
      localises the block to folate rather than cobalamin availability, which is what makes
      folate the rational therapy. Quoted from the clause after the isotope label because the
      validator strips bracketed spans from the query side.
- name: Systemic Homocysteine Accumulation
  description: >-
    Homocysteine that cannot be remethylated accumulates in blood. It is a frequent but not
    obligate feature - at least one reported patient with the full haematological and
    immunological phenotype never became hyperhomocysteinemic, which is the observation the
    MONDO label's "with or without" records.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  downstream:
  - target: Hyperhomocysteinemia
    causal_link_type: DIRECT
  - target: Thrombotic Microangiopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:21813566
    reference_title: "Novel inborn error of folate metabolism: identification by exome capture and sequencing of mutations in the MTHFD1 gene in a single proband."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An infant was investigated because of megaloblastic anaemia, atypical hemolytic uraemic syndrome, severe combined immune deficiency, elevated blood levels of homocysteine and methylmalonic acid, and a selective decreased synthesis of methylcobalamin in cultured fibroblasts."
    explanation: Documents elevated blood homocysteine in the founding case alongside aHUS.
- name: Thrombotic Microangiopathy
  description: >-
    Several patients have developed atypical hemolytic uremic syndrome with microangiopathy,
    the recognised vascular complication of severe remethylation defects. The mechanistic route
    from hyperhomocysteinemia to endothelial injury is not established in this disorder
    specifically, so the edge is recorded as indirect. Notably this arm is also the one that
    can leave permanent damage: in the second reported patient every feature resolved on
    treatment except the retinopathy.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  downstream:
  - target: Hemolytic-uremic syndrome
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25633902
    reference_title: "Characterization and review of MTHFD1 deficiency: four new patients, cellular delineation and response to folic and folinic acid treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The second patient presented with hyperhomocysteinemia, megaloblastic anaemia, HUS, microangiopathy and retinopathy; all except the retinopathy resolved after treatment with hydroxocobalamin, betaine and folinic acid."
    explanation: >-
      Documents microangiopathy and HUS co-occurring with hyperhomocysteinemia, and the
      incomplete reversibility of the retinal component.

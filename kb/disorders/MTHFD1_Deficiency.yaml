biochemical:
- name: Absent MTHFD1 Dehydrogenase Activity
  presence: PRESENT
  notes: >-
    Measured in cultured patient fibroblasts. Note the dissociation from protein level: three
    patients retained 4.8-14.3% of control MTHFD1 protein and a fourth about 44%, yet none had
    detectable dehydrogenase specific activity. Protein abundance is therefore not a
    substitute readout for enzyme function in this disease.
  evidence:
  - reference: PMID:32414565
    reference_title: "Biochemical analysis of patients with mutations in MTHFD1 and a diagnosis of methylenetetrahydrofolate dehydrogenase 1 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "There was no detectable methylenetetrahydrofolate dehydrogenase specific activity in extracts from any of the four patients."
    explanation: The direct enzymatic measurement, and the first reported in patients.
- name: Elevated Blood Homocysteine
  presence: PRESENT
  notes: >-
    Frequent but explicitly not obligate: one patient with the full haematological and
    immunological phenotype never became hyperhomocysteinemic.
  evidence:
  - reference: PMID:21813566
    reference_title: "Novel inborn error of folate metabolism: identification by exome capture and sequencing of mutations in the MTHFD1 gene in a single proband."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "elevated blood levels of homocysteine and methylmalonic acid"
    explanation: Raised homocysteine in the founding proband.
- name: Elevated Methylmalonic Acid
  presence: PRESENT
  notes: >-
    Raised methylmalonic acid in the founding case is the finding that makes this disorder look
    like a cobalamin defect on presentation. It is diagnostically load-bearing in the wrong
    direction, which is why the fibroblast cobalamin-versus-folate discrimination matters.
  evidence:
  - reference: PMID:21813566
    reference_title: "Novel inborn error of folate metabolism: identification by exome capture and sequencing of mutations in the MTHFD1 gene in a single proband."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "elevated blood levels of homocysteine and methylmalonic acid"
    explanation: Raised methylmalonic acid alongside homocysteine in the founding proband.
- name: Elevated Uracil in Nuclear DNA
  presence: PRESENT
  notes: >-
    The direct molecular readout of the thymidylate lesion, measured in patient fibroblasts
    alongside reduced de novo dTMP synthesis and increased salvage-pathway compensation.
  evidence:
  - reference: PMID:25548164
    reference_title: "Human mutations in methylenetetrahydrofolate dehydrogenase 1 impair nuclear de novo thymidylate biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblasts exhibited enriched MTHFD1 in the nucleus, elevated uracil in DNA, lower rates of de novo dTMP synthesis, and increased salvage pathway dTMP biosynthesis relative to control fibroblasts."
    explanation: Measures uracil misincorporation together with the pathway changes that produce it.
experimental_models:
- name: MTHFD1-deficient patient fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:25548164
  description: >-
    Cultured skin fibroblasts from affected patients. Because homozygous Mthfd1 disruption is
    early embryonic lethal in mouse and the only available mouse line models the common R653Q
    polymorphism rather than this disease, patient fibroblasts are the sole system in which the
    mechanism of MTHFD1 deficiency has been measured. Every mechanistic claim in this entry
    that is not a clinical observation comes from them.
  modeled_mechanisms:
  - target: Impaired Nuclear de novo Thymidylate Biosynthesis
    relationship: MEASURES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Patient-derived and human, carrying the disease genotype, so the thymidylate lesion is
      measured rather than inferred from a surrogate.
    limitations: >-
      Fibroblasts are not an affected tissue. The disease manifests in erythroid precursors and
      developing lymphocytes, and the argument that those compartments are hit hardest because
      they proliferate fastest is an inference from fibroblast measurements, not something
      shown in the affected cells.
    readouts:
    - name: Formate flux into dTMP
      target: Impaired Nuclear de novo Thymidylate Biosynthesis
      direction: DECREASED
      interpretation: Direct flux measure of the node, reduced by 50%.
      evidence:
      - reference: PMID:25548164
        reference_title: "Human mutations in methylenetetrahydrofolate dehydrogenase 1 impair nuclear de novo thymidylate biosynthesis."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The flux of formate incorporation into methionine and dTMP was decreased by 90% and 50%, respectively, whereas formate flux through de novo purine biosynthesis was unaffected."
        explanation: >-
          The measurement that both quantifies this node and, by the purine result, excludes the
          competing mechanism.
    evidence:
    - reference: PMID:25548164
      reference_title: "Human mutations in methylenetetrahydrofolate dehydrogenase 1 impair nuclear de novo thymidylate biosynthesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we examined the impact of MTHFD1 loss of function on folate-dependent purine, dTMP, and methionine biosynthesis in fibroblasts from the proband with MTHFD1 deficiency"
      explanation: Establishes the model system and what was measured in it.
  - target: Impaired Homocysteine Remethylation to Methionine
    relationship: MEASURES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      The same system localises the block to folate rather than cobalamin, which is the result
      that makes folate the rational therapy.
    limitations: >-
      A cell-autonomous readout: it says nothing about tissue-level homocysteine handling or
      about why some patients never become hyperhomocysteinemic.
    readouts:
    - name: Methionine formation from labelled formate
      target: Impaired Homocysteine Remethylation to Methionine
      direction: DECREASED
      interpretation: Reduced by 90%, the larger of the two flux deficits.
      evidence:
      - reference: PMID:25633902
        reference_title: "Characterization and review of MTHFD1 deficiency: four new patients, cellular delineation and response to folic and folinic acid treatment."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "which did not increase in cobalamin supplemented culture medium but was responsive to folic and folinic acid"
        explanation: >-
          The cobalamin-versus-folate discrimination, measured in the same fibroblast system.
diagnosis:
- name: Exome sequencing with explicit structural-variant review
  description: >-
    The diagnosis is molecular. Two features of these cases are worth carrying forward. First,
    the biochemical picture is misleading: the founding patient had a selective decrease in
    methylcobalamin synthesis in fibroblasts and raised methylmalonic acid, which points toward
    a cobalamin disorder rather than a folate one, and the fibroblast studies that resolved it
    showed the methionine defect was unresponsive to cobalamin but responsive to folate.
    Second, standard exome variant calling can find only one allele: in one family the paternal
    allele was an exon 13 deletion, recovered only by manually inspecting per-exon coverage
    depth after the phenotype made a second hit likely.
  evidence:
  - reference: PMID:27707659
    reference_title: "Precision Molecular Diagnosis Defines Specific Therapy in Combined Immunodeficiency with Megaloblastic Anemia Secondary to MTHFD1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In view of highly suggestive phenotype, we extended our bioinformatics interrogation for structural variants in the MTHFD1 gene by manual evaluation of the exome data for sequence depth coverage of all the exons."
    explanation: >-
      Documents that the second allele was found only by deliberate structural-variant review,
      which is the practical diagnostic lesson from this family.
  - reference: PMID:25633902
    reference_title: "Characterization and review of MTHFD1 deficiency: four new patients, cellular delineation and response to folic and folinic acid treatment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "which did not increase in cobalamin supplemented culture medium but was responsive to folic and folinic acid"
    explanation: >-
      The fibroblast discrimination that separates this disorder from the cobalamin disorders its
      biochemistry can mimic.

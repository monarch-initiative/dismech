genetic:
- name: IHH-containing 2q35 tandem duplication
  gene_term:
    preferred_term: IHH
    term:
      id: hgnc:5956
      label: IHH
  association: Candidate regulatory driver of the limb phenotype within a disease-associated multigene duplication
  variant_origin: GERMLINE
  notes: >-
    The locus-defined duplication is associated with the human phenotype.
    IHH is both duplicated and the proposed target of enhancer adoption, but
    the interval contains many other genes. Regulatory attribution of the
    limb phenotype does not establish an IHH cause for every neurological
    or craniofacial finding. No coding change altering IHH protein activity
    was established by these studies.
  evidence:
  - reference: PMID:22234151
    reference_title: A large duplication involving the IHH locus mimics acrocallosal syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Single-nucleotide polymorphism (SNP) array copy number analysis identified a ∼900-kb duplication of the IHH locus"
    explanation: The primary human family study identifies the structural allele at this locus.
variants:
- name: K1549/K1552 familial 913663 bp IHH-containing tandem duplication
  variant_type: duplication
  genomic_contexts:
  - coding sequence
  - intergenic region
  sequence_length: 913663
  gene:
    preferred_term: IHH
    term:
      id: hgnc:5956
      label: IHH
  regulatory_target_gene:
    preferred_term: IHH
    term:
      id: hgnc:5956
      label: IHH
  description: >-
    Identical tandem duplication in maternal half-siblings K1549 and K1552,
    resolved by long-range PCR and Sanger sequencing to hg18
    chr2:219583780-220497443, with a reported size of 913663 bp. The interval
    includes IHH and 29 additional genes or partial genes; the proximal
    junction is within CCDC108 exon 25. This family was subsequently studied
    as the polydactyly family P1 in Lupiáñez et al. (2015).

    POSTRE Table 1 Nr5 and Supplementary Data 3 cite that later study but
    report hg19 chr2:219907598-220954793. Those secondary bounds differ from
    the resolved primary interval and are not treated here as an exact
    synonym or a separate clinical allele. The primary hg18 coordinates
    remain the defining representation pending reconciliation.

    Patient-fibroblast 4C-seq supports altered IHH regulatory contacts.
    Ectopic limb expression and altered GLI3 processing are demonstrated
    in the Dbf mouse deletion, not directly in this human duplication, so
    the proposed GOE is qualified in the pathophysiology chain.
  evidence:
  - reference: PMID:22234151
    reference_title: A large duplication involving the IHH locus mimics acrocallosal syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We defined the exact breakpoints and showed that the duplications are identical tandem duplications in both sibs."
    explanation: >-
      The primary full text and Figure 4 identify the hg18 breakpoints and
      913663 bp size; the abstract confirms identity and tandem orientation
      in both siblings. Differing initial SNP-array extents were refined
      by breakpoint sequencing and are not separate alleles.
  - reference: PMID:25959774
    reference_title: Disruptions of topological chromatin domains cause pathogenic rewiring of gene-enhancer interactions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we applied 4C-seq to human adult fibroblasts (HAFs) and compared the results to data from the mutant mouse strains"
    explanation: >-
      The P1 patient sample carries the duplication from the previously
      reported family; 4C shows altered contacts but does not directly
      measure embryonic limb IHH expression.
  - reference: PMID:36999617
    reference_title: 'POSTRE: a tool to predict the pathological effects of human structural variants.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The coordinates of the SVs in positive control patients (Table 1 and Table 2)"
    explanation: >-
      POSTRE Table 1 Nr5 and Supplementary Data 3 provide the secondary
      hg19 interval and link the case to Lupiáñez et al. These coordinates
      are retained as unresolved provenance, not a second curated variant.
  functional_effects:
  - function: Altered IHH regulatory contacts
    type: Regulatory structural rearrangement
    regulatory_element_type: TAD_BOUNDARY
    regulatory_mechanism: Repositioning of a duplicated boundary and adjacent regulatory domains
    description: >-
      The human duplication permits ectopic contacts with centromeric EPHA4
      regulatory sequence. The proposed configuration is a newly organized
      domain rather than physical boundary deletion; the two duplicated
      copies were not resolved individually by 4C-seq.
  - function: Proposed gain of ectopic IHH expression
    type: Candidate regulatory expression consequence
    regulatory_element_type: ENHANCER
    affected_developmental_stage: Embryonic limb patterning; mouse evidence at E10.5-E11.5
    regulatory_mechanism: Proposed adoption of EPHA4 limb enhancers
    description: >-
      Spatially and temporally ectopic expression is directly demonstrated
      in the Dbf mouse deletion model. The corresponding expression effect
      remains provisional for the human tandem duplication; fibroblast
      chromatin contacts alone are not an expression assay.
diagnosis:
- name: Copy-number analysis and tandem-duplication breakpoint confirmation
  description: >-
    The reported family was investigated with SNP-array copy-number analysis,
    independent quantitative confirmation, and long-range PCR plus Sanger
    sequencing of the duplication junction. The resolved junction established
    that the two half-siblings carried the same tandem allele despite slightly
    different initial array extents.
  evidence:
  - reference: PMID:22234151
    reference_title: A large duplication involving the IHH locus mimics acrocallosal syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Single-nucleotide polymorphism (SNP) array copy number analysis identified a ∼900-kb duplication of the IHH locus, which was confirmed by an independent quantitative method."
    explanation: Documents the copy-number testing and independent confirmation in the original family.

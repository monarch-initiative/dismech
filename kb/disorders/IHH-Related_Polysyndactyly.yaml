name: IHH-Related Polysyndactyly
synonyms:
- IHH locus duplication-associated polysyndactyly
- Large 2q35 duplication-associated acrocallosal-like phenotype
category: Mendelian
creation_date: '2026-09-21T16:59:17Z'
description: >-
  A locus-defined congenital disorder associated with a large tandem duplication
  encompassing IHH and surrounding sequence at 2q35. Two maternal half-siblings
  shared the same duplication and severe polysyndactyly with craniofacial
  abnormalities. The surviving index patient also had corpus callosum agenesis
  and profound developmental impairment. Patient-fibroblast chromatin contacts
  support altered IHH regulation; ectopic embryonic limb expression is supported
  by a related mouse deletion model and remains unmeasured in the human duplication.
  This entry covers the large duplication family described by Yuksel-Apak et al.
  and subsequently studied as family P1 by Lupiáñez et al. It does not combine
  KIF7-related acrocallosal syndrome, IHH coding disorders, or the smaller IHH
  regulatory duplications associated with syndactyly and craniosynostosis.
disease_term:
  preferred_term: IHH locus duplication-associated polysyndactyly
  description: >-
    Descriptive locus-defined scope; no exact MONDO binding has been established
    for this large duplication-associated family.
parents:
- Congenital Limb Malformation
inheritance:
- name: Heterozygous duplication with suspected maternal gonadal mosaicism
  description: >-
    The identical tandem duplication occurred in two maternal half-siblings
    with different fathers. It was not detected in the healthy mother's blood.
    The authors inferred likely gonadal mosaicism; maternal germ cells were
    not directly tested, so this is not a demonstrated mosaicism measurement.
  evidence:
  - reference: PMID:22234151
    reference_title: A large duplication involving the IHH locus mimics acrocallosal syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A fetus from a second pregnancy of the mother by a different spouse showed similar craniofacial and limb malformations and the same duplication of the IHH-locus."
    explanation: Establishes recurrence of the same duplication in maternal half-siblings.
  - reference: PMID:22234151
    reference_title: A large duplication involving the IHH locus mimics acrocallosal syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No copy number changes were observed in the healthy mother."
    explanation: >-
      Absence from tested maternal blood contributed to the authors' inference
      of gonadal mosaicism; it does not demonstrate absence from all maternal tissues.
pathophysiology:
- name: Large Tandem Duplication Encompassing IHH and Adjacent Regulatory Sequence
  role: trigger
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: IHH
      term:
        id: hgnc:5956
        label: IHH
    variant_type: duplication
    genomic_contexts:
    - coding sequence
    - intergenic region
    variant_origin: GERMLINE
    description: >-
      The human K1549/K1552 allele is a 913663 bp tandem duplication at hg18
      chr2:219583780-220497443. It contains IHH and 29 additional genes or
      partial genes, with the proximal breakpoint in CCDC108, as reported in 2012.
  description: >-
    The physical lesion increases copy number of IHH and neighboring sequence
    and rearranges their relationship to the adjacent EPHA4 regulatory domain.
    The limb mechanism involves a candidate regulatory position effect in
    addition to coding overlap. Contributions of other duplicated genes to
    the broader craniofacial and neurodevelopmental phenotype remain unresolved.
  evidence:
  - reference: PMID:22234151
    reference_title: A large duplication involving the IHH locus mimics acrocallosal syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We defined the exact breakpoints and showed that the duplications are identical tandem duplications in both sibs."
    explanation: >-
      Long-range PCR and Sanger sequencing in the primary full text resolve
      the shared human allele to 913663 bp and the stated hg18 breakpoints.
      The abstract establishes that the two siblings have the same tandem allele.
  downstream:
  - target: Ectopic IHH Contacts with the EPHA4 Regulatory Domain
    description: >-
      The tandem duplication changes domain organization and creates abnormal
      contacts between IHH and the centromeric part of the EPHA4 domain.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25959774
      reference_title: Disruptions of topological chromatin domains cause pathogenic rewiring of gene-enhancer interactions.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the polydactyly-associated human duplication resulted in an overlapping, smaller interaction domain in the most centromeric region of the EPHA4 TAD"
      explanation: Patient-derived adult fibroblast 4C-seq links the duplication to altered regulatory contacts.
- name: Ectopic IHH Contacts with the EPHA4 Regulatory Domain
  role: central_effector
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    4C-seq in adult fibroblasts from the polydactyly patient P1 detects abnormal
    contacts between IHH and the centromeric EPHA4 domain. The duplication
    reorganizes the relative positions of genes, enhancers, and boundaries;
    it does not simply delete a boundary. Individual 4C reads could not be
    assigned unambiguously to the two duplicated copies, so the exact
    copy-specific interaction configuration remains inferred.
  gene:
    preferred_term: IHH
    term:
      id: hgnc:5956
      label: IHH
  biological_processes:
  - preferred_term: chromatin looping
    term:
      id: GO:0140588
      label: chromatin looping
    modifier: ABNORMAL
  evidence:
  - reference: PMID:25959774
    reference_title: Disruptions of topological chromatin domains cause pathogenic rewiring of gene-enhancer interactions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "our 4C-seq results show increased frequency of interaction of IHH (polydactyly family) and WNT6 (F-syndrome family) with centromeric parts of the EPHA4 domain"
    explanation: >-
      The IHH result concerns the polydactyly family; the WNT6 result is a
      separate F-syndrome comparison and is not assigned to this disorder.
  downstream:
  - target: Proposed Ectopic IHH Expression in Embryonic Limb Mesenchyme
    description: >-
      Exposure to EPHA4 limb enhancers is proposed to activate IHH in an
      inappropriate embryonic limb domain. The expression consequence is
      supported by the doublefoot deletion model, not measured in the human duplication.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25959774
      reference_title: Disruptions of topological chromatin domains cause pathogenic rewiring of gene-enhancer interactions.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "the target genes near the breakpoints were adopted by Epha4 enhancers which, in turn, results in their misexpression"
      explanation: >-
        Enhancer-contact and expression experiments support this mechanism in
        mutant mouse limbs. For Ihh, the tested allele is the Dbf deletion;
        transfer to the human tandem duplication is an inference.
- name: Proposed Ectopic IHH Expression in Embryonic Limb Mesenchyme
  role: central_effector
  biological_scale: MOLECULAR
  regulatory_category: GOE
  mechanism_confidence: PROVISIONAL
  description: >-
    Ectopic spatial and temporal IHH expression is the proposed consequence of
    enhancer adoption in the human duplication. In the doublefoot mouse
    deletion model, Ihh appears in distal limb mesenchyme at E10.5, before
    its normal limb expression, and at E11.5 resembles the Epha4 expression
    domain. The human duplication was not recreated in this experiment.
    IHH transcript was undetectable in the adult human fibroblasts used for
    chromatin-contact assays, so those assays do not establish ectopic
    transcription in human embryonic digits. GOE is therefore provisional for
    this human allele despite direct ectopic-expression evidence in the model.
  gene:
    preferred_term: IHH
    term:
      id: hgnc:5956
      label: IHH
  biological_processes:
  - preferred_term: gene expression
    term:
      id: GO:0010467
      label: gene expression
    modifier: INCREASED
  evidence:
  - reference: PMID:18272352
    reference_title: Polydactyly in the mouse mutant Doublefoot involves altered Gli3 processing and is caused by a large deletion in cis to Indian hedgehog.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "the onset of ectopic Indian hedgehog (Ihh) expression in the entire distal mesenchyme, except for the zone of polarising activity (ZPA), at E10.5"
    explanation: >-
      This is direct expression evidence for the Dbf mouse deletion and indirect
      support for the proposed expression effect of the human duplication.
  - reference: PMID:25959774
    reference_title: Disruptions of topological chromatin domains cause pathogenic rewiring of gene-enhancer interactions.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Misexpression of Ihh in the distal limb bud of Dbf mutants was previously demonstrated (Babbs et al., 2008) and comparison at E11.5 revealed a striking resemblance of the expression pattern with Epha4 in wild-type embryos"
    explanation: >-
      The 2015 comparison supports an EPHA4-like ectopic expression domain in
      Dbf mouse limbs; it is not an expression assay of the human duplication.
  downstream:
  - target: Abnormal Embryonic Digit Patterning
    description: >-
      Ectopic hedgehog signaling is a candidate cause of the altered digit
      number and pattern, supported by the Dbf model with unresolved transfer
      of the complete pathway to the human duplication.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Altered hedgehog signaling and GLI3 processing in the Dbf mouse model
    evidence:
    - reference: PMID:18272352
      reference_title: Polydactyly in the mouse mutant Doublefoot involves altered Gli3 processing and is caused by a large deletion in cis to Indian hedgehog.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "the preaxial polydactyly is attributable to a reduction in Gli3R resulting from ectopic Ihh expression"
      explanation: >-
        Model experiments connect ectopic Ihh to altered GLI3 processing and
        digit patterning, without demonstrating that pathway in the human duplication.
- name: Abnormal Embryonic Digit Patterning
  role: consequence
  biological_scale: TISSUE
  description: >-
    The human duplication is associated with severe polysyndactyly, including
    supernumerary digits and extensive cutaneous fusion. The limb phenotype
    is consistent with abnormal developmental digit patterning. The candidate
    IHH regulatory mechanism does not by itself explain the index patient's
    corpus callosum agenesis or profound developmental impairment.
  biological_processes:
  - preferred_term: embryonic digit morphogenesis
    term:
      id: GO:0042733
      label: embryonic digit morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:22234151
    reference_title: A large duplication involving the IHH locus mimics acrocallosal syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "extensive polysyndactyly of the hands and feet"
    explanation: The clinical malformation establishes abnormal digit number and separation.
  downstream:
  - target: Hand Polydactyly
    causal_link_type: DIRECT
  - target: Foot Polydactyly
    causal_link_type: DIRECT
  - target: Finger Syndactyly
    causal_link_type: DIRECT
  - target: Toe Syndactyly
    causal_link_type: DIRECT

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The p.Arg308Cys mutation in CSF3R leads to altered G-CSF receptor glycosylation and surface expression and abrogated downstream signaling"
      explanation: >-
        States that the surface-expression defect abrogates the receptor's
        downstream signalling, the next step in the chain.
  evidence:
  - reference: PMID:24753537
    reference_title: Inherited biallelic CSF3R mutations in severe congenital neutropenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "which resulted in perturbed N-glycosylation and aberrant localization to the cell surface"
    explanation: >-

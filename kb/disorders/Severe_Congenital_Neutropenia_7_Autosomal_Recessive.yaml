    reference_title: "Crohn's Disease Phenotype in a Patient With Severe Congenital Neutropenia Caused by CSF3R Variants: Exploring the Pathogenesis and Effects of Thalidomide Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These variants usually affect the extracellular domain of G‐CSFR, unlike somatic CSF3R variants, which usually affect the cytoplasmic region of G‐CSFR"
    explanation: >-
      Records that the germline SCN7 variants sit in the extracellular domain,
      contrasting them with the cytoplasmic-tail somatic variants of leukaemic
      evolution.
- name: Deficient Cell-Surface G-CSF Receptor
  description: >-
    Little or no functional G-CSFR reaches the plasma membrane. Extracellular
    missense variants such as p.Arg308Cys disrupt N-glycosylation and the
    receptor is retained in the endoplasmic reticulum; truncating variants
    abolish surface expression outright. Flow cytometry of patient neutrophils
    shows markedly reduced surface receptor.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: granulocyte colony-stimulating factor receptor activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0004902
      label: granulocyte colony-stimulating factor receptor activity
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    modifier: ABNORMAL
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
  downstream:

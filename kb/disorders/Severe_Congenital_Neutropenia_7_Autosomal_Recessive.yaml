      cell-surface receptor deficiency.
- name: Absent G-CSF/JAK-STAT Signaling in Granulocytic Precursors
  description: >-
    Without functional surface receptor, G-CSF cannot activate the Janus
    kinase / STAT3 and STAT5 cascade that normally transduces its signal.
    Patient and mutant-receptor cells show reduced STAT3/STAT5 phosphorylation
    on G-CSF stimulation; hypomorphic alleles retain partial signalling.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: granulocyte monocyte progenitor cell
    term:
      id: CL:0000557
      label: granulocyte monocyte progenitor cell
  biological_processes:
  - preferred_term: granulocyte colony-stimulating factor signaling pathway
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0038158
      label: granulocyte colony-stimulating factor signaling pathway
  - preferred_term: cell surface receptor signaling pathway via JAK-STAT
    modifier: DECREASED
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
  downstream:
  - target: Impaired Granulocytic Proliferation and Survival
    causal_link_type: DIRECT
  - target: Preserved Bone Marrow Granulocytic Maturation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      G-CSFR signalling is required for granulocyte expansion but is dispensable
      for terminal maturation, so precursors still mature even though the signal
      is lost.
  evidence:
  - reference: PMID:24753537
    reference_title: Inherited biallelic CSF3R mutations in severe congenital neutropenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cells expressing the mutant receptor showed reduced phosphorylation of STAT3 and STAT5, but signal transduction was not completely abrogated"
    explanation: >-
      Demonstrates the reduced JAK-STAT signalling produced by the mutant
      receptor, with residual activity for the hypomorphic allele.
  - reference: PMID:24753537
    reference_title: Inherited biallelic CSF3R mutations in severe congenital neutropenia.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "relies on Janus kinase activation for signal transduction through signal transducer and activator of transcription 3 and 5 (STAT3 and STAT5)"
    explanation: >-
      States the JAK-STAT3/STAT5 pathway that G-CSFR normally uses, the
      signalling that is lost here.
- name: Impaired Granulocytic Proliferation and Survival
  description: >-
    Loss of the pro-proliferative, pro-survival G-CSF signal reduces expansion
    of granulocytic progenitors and increases apoptosis of maturing neutrophils,
    so neutrophil output falls.

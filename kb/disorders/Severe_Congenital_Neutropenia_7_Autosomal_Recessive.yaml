name: Severe Congenital Neutropenia 7, Autosomal Recessive
category: Mendelian
creation_date: "2026-09-29T21:00:00Z"
synonyms:
- SCN7
- neutropenia, severe congenital, 7, autosomal recessive
- G-CSF receptor deficiency
- CSF3R deficiency
- Severe congenital neutropenia due to CSF3R deficiency
description: >-
  Severe congenital neutropenia type 7 is an autosomal recessive disorder of
  granulopoiesis caused by biallelic loss-of-function variants in CSF3R, the
  gene encoding the granulocyte colony-stimulating factor receptor (G-CSFR).
  The reported pathogenic variants cluster in the extracellular region of the
  receptor: a missense change near the WSXWS motif that perturbs N-glycosylation
  and leaves the receptor retained in the endoplasmic reticulum, or frameshift
  and nonsense variants that truncate the extracellular domain. Either way the
  cell surface carries little or no functional receptor, G-CSF cannot drive
  JAK-STAT3/STAT5 signalling in granulocytic precursors, and the absolute
  neutrophil count sits below 0.5 x 10^9/L from infancy with recurrent bacterial
  infection.
  Two features set SCN7 apart from the common ELANE and HAX1 forms. The bone
  marrow shows full granulocytic maturation rather than the promyelocyte
  maturation arrest of those diseases, reflecting G-CSFR-independent granulopoiesis
  that lets precursors mature but not expand. And because the block is at the
  receptor rather than upstream of it, recombinant G-CSF is generally
  ineffective at any dose; GM-CSF, which signals through a separate receptor
  (CSF2R), stimulates granulopoiesis in several reported patients, and
  haematopoietic stem cell transplantation is the option for refractory disease.
  This germline biallelic loss-of-function mechanism is mechanistically distinct
  from the somatic, truncating CSF3R mutations in the receptor cytoplasmic tail
  that are acquired on the path to leukaemia in G-CSF-treated ELANE/HAX1 SCN
  (curated separately under Severe Congenital Neutropenia 1), and from the
  germline activating CSF3R variants (e.g. T617N) that cause hereditary
  neutrophilia.

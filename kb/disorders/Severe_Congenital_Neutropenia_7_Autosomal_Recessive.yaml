genetic:
- name: CSF3R
  gene_term:
    preferred_term: CSF3R
    term:
      id: hgnc:2439
      label: CSF3R
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  frequency: a rare cause of severe congenital neutropenia (SCN type 7)
  case_fractions:
  - population: Turkish Severe Congenital Neutropenia Registry (216 patients)
    case_fraction_percent: 2.9
    cohort_size: 216
    notes: >-
      Biallelic CSF3R accounted for 6 of 216 registry patients in a population
      with high consanguinity, where HAX1 (36%) dominated. CSF3R is a rare
      subtype even where recessive SCN is common.
    evidence:
    - reference: PMID:31321910
      reference_title: "Homozygous c.130-131 ins A (pW44X) mutation in the HAX1 gene as the most common cause of congenital neutropenia in Turkey: Report from the Turkish Severe Congenital Neutropenia Registry."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Biallelic mutations of G6PC3 (n = 9, 4.3%), CSF3R (n = 6, 2.9%), and JAGN1 (n = 2, 1%) were also observed."
      explanation: >-
        Gives the CSF3R share of a national SCN registry and its denominator.
  variants:
  - name: p.Arg308Cys (c.922C>T)
    description: >-
      An extracellular missense variant near the WSXWS motif; reported
      homozygous in a consanguineous family, perturbing N-glycosylation and
      surface localization of the receptor.
  - name: Extracellular truncating variants
    description: >-
      Compound heterozygous frameshift/nonsense variants (e.g. c.948_963del
      p.Gly316fs and c.1245del p.Gly415fs) truncating the extracellular domain
      and abolishing surface expression.
  notes: >-
    All reported pathogenic SCN7 variants lie in the extracellular region of
    G-CSFR, distinguishing them from the somatic cytoplasmic-tail truncations
    acquired during leukaemic evolution of ELANE/HAX1 SCN, and from the germline
    activating variants (e.g. T617N) that cause hereditary neutrophilia.
  evidence:
  - reference: PMID:33108454
    reference_title: Heterozygous germ line CSF3R variants as risk alleles for development of hematologic malignancies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "biallelic germ line hypomorphic variants in CSF3R are a rare cause of severe congenital neutropenia, a hypoproliferative condition"
    explanation: >-
      States that biallelic germline hypomorphic CSF3R variants cause severe
      congenital neutropenia.
  - reference: PMID:33108454
    reference_title: Heterozygous germ line CSF3R variants as risk alleles for development of hematologic malignancies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Acquired activating heterozygous variants in CSF3R are the main cause of chronic neutrophilic leukemia, a hyperproliferative disorder."
    explanation: >-
      Contrasts the recessive loss-of-function mechanism of SCN7 with the
      acquired activating CSF3R variants of chronic neutrophilic leukemia.
prevalence:
- population: Worldwide (reported cases)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    An ultra-rare SCN subtype: as of November 2024, 18 CSF3R variants in 18
    patients had been reported globally. Severe congenital neutropenia overall
    has an incidence of roughly 1/200,000, of which CSF3R is a small fraction.
  evidence:
  - reference: PMID:42482462
    reference_title: "Crohn's Disease Phenotype in a Patient With Severe Congenital Neutropenia Caused by CSF3R Variants: Exploring the Pathogenesis and Effects of Thalidomide Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, 18 kinds of variants in CSF3R associated with SCN have been identified globally in 18 patients"
    explanation: >-
      Quantifies the total reported case count, supporting the ultra-rare class.
  - reference: PMID:34778134
    reference_title: "Efficacy of Low-Dose rhGM-CSF Treatment in a Patient With Severe Congenital Neutropenia Due to CSF3R Deficiency: Case Report of a Novel Biallelic CSF3R Mutation and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SCN is a group of rare congenital hematologic diseases caused by germline mutations with an incidence rate of ~1/200,000"
    explanation: >-
      Gives the overall SCN incidence against which CSF3R is a rare subtype.
diagnosis:
- name: Absolute neutrophil count
  presence: PRESENT
  description: >-
    A persistent absolute neutrophil count below 0.5 x 10^9/L from infancy is
    the entry criterion, as for all severe congenital neutropenia.
  evidence:
  - reference: PMID:34778134
    reference_title: "Efficacy of Low-Dose rhGM-CSF Treatment in a Patient With Severe Congenital Neutropenia Due to CSF3R Deficiency: Case Report of a Novel Biallelic CSF3R Mutation and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient presented with recurrent suppurative tonsillitis and decreased absolute neutrophil count <0.5 × 109/L."
    explanation: >-
      Illustrates the sub-0.5 x 10^9/L count that defines the disease.
- name: Bone marrow examination
  presence: PRESENT
  description: >-
    Marrow shows full granulocytic maturation rather than the promyelocyte
    maturation arrest of ELANE/HAX1 SCN, which is a diagnostic pointer toward a
    receptor-level defect.
  evidence:
  - reference: PMID:24753537
    reference_title: Inherited biallelic CSF3R mutations in severe congenital neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite peripheral SCN, all patients had morphologic evidence of full myeloid cell maturation in bone marrow"
    explanation: >-
      States the preserved marrow maturation that distinguishes SCN7 on
      aspirate.
- name: CSF3R molecular genetic testing
  presence: PRESENT
  description: >-
    Identification of biallelic loss-of-function CSF3R variants, usually by
    whole-exome or targeted sequencing with parental segregation, confirms the
    diagnosis.
  evidence:
  - reference: PMID:24753537
    reference_title: Inherited biallelic CSF3R mutations in severe congenital neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the p.Arg308Cys CSF3R variant segregated with the disease phenotype in an autosomal-recessive inheritance pattern"
    explanation: >-
      Molecular confirmation of biallelic CSF3R variants segregating recessively.
- name: G-CSF receptor signalling assay
  presence: PRESENT
  description: >-
    Flow cytometry shows reduced surface G-CSFR and blunted STAT3 phosphorylation
    after G-CSF, while GM-CSF still triggers STAT3 phosphorylation, functionally
    confirming a receptor-level block.
  evidence:
  - reference: PMID:42482462
    reference_title: "Crohn's Disease Phenotype in a Patient With Severe Congenital Neutropenia Caused by CSF3R Variants: Exploring the Pathogenesis and Effects of Thalidomide Treatment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "After rhGM‐CSF stimulation, neutrophils from both the control and the patient displayed STAT3 phosphorylation, whereas only the control neutrophils did so following rhG‐CSF stimulation"
    explanation: >-
      The functional signature: G-CSF fails to phosphorylate STAT3 in patient
      neutrophils while GM-CSF succeeds, localizing the defect to the G-CSF
      receptor.
treatments:
- name: GM-CSF (sargramostim)
  action_category: THERAPEUTIC
  description: >-
    Recombinant GM-CSF stimulates granulopoiesis through its own receptor
    (CSF2R), bypassing the defective G-CSF receptor, and has raised neutrophil
    counts and prevented infection in several reported SCN7 patients who were
    refractory to G-CSF.
  treatment_term:
    preferred_term: colony-stimulating factor therapy
    term:
      id: NCIT:C15515
      label: Colony-Stimulating Factor Therapy
    therapeutic_agent:
    - preferred_term: sargramostim
      term:
        id: CHEBI:749544
        label: sargramostim
  target_phenotypes:
  - preferred_term: Severely decreased neutrophil count
    term:
      id: HP:0025826
      label: Severely decreased neutrophil count
  target_mechanisms:
  - target: Profound Peripheral Neutropenia
    treatment_effect: BYPASSES
    description: >-
      GM-CSF acts through CSF2R rather than the defective G-CSFR, so it can
      drive granulopoiesis despite the receptor block.
    evidence:
    - reference: PMID:34778134
      reference_title: "Efficacy of Low-Dose rhGM-CSF Treatment in a Patient With Severe Congenital Neutropenia Due to CSF3R Deficiency: Case Report of a Novel Biallelic CSF3R Mutation and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "however, after rhGM-CSF (5 μg/kg, Topleucon, Amoytop Biotech, Xiamen, China) injection, ANC increased from 0.19 to 1.95 × 109/L"
      explanation: >-
        Shows GM-CSF raising the neutrophil count where G-CSF failed, acting on
        this node.
  evidence:
  - reference: PMID:34778134
    reference_title: "Efficacy of Low-Dose rhGM-CSF Treatment in a Patient With Severe Congenital Neutropenia Due to CSF3R Deficiency: Case Report of a Novel Biallelic CSF3R Mutation and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a small proportion of SCN patients with G-CSF receptor deficiency (i.e., due to biallelic loss-of-function mutations in the CSF3R gene) are refractory to G-CSF but respond to granulocyte macrophage colony-stimulating factor (GM-CSF) treatment"
    explanation: >-
      States the rationale for GM-CSF as the treatment for G-CSF-refractory
      CSF3R deficiency.
  - reference: PMID:34778134
    reference_title: "Efficacy of Low-Dose rhGM-CSF Treatment in a Patient With Severe Congenital Neutropenia Due to CSF3R Deficiency: Case Report of a Novel Biallelic CSF3R Mutation and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The responsiveness to rhGM-CSF of patients with CSF3R mutations can be attributed to granulocyte stimulation by GM-CSF and the activation of CSF2R"
    explanation: >-
      Names CSF2R as the receptor GM-CSF uses to bypass the G-CSFR defect.
- name: Recombinant G-CSF (generally ineffective)
  action_category: THERAPEUTIC
  description: >-
    Recombinant G-CSF, the mainstay for other SCN types, is generally
    ineffective in SCN7 because the defect is in the G-CSF receptor itself;
    patients typically fail to respond even at very high doses. A minority with
    hypomorphic alleles show partial responses. It is usually tried first but is
    not a durable option.
  treatment_term:
    preferred_term: colony-stimulating factor therapy
    term:
      id: NCIT:C15515
      label: Colony-Stimulating Factor Therapy
    therapeutic_agent:
    - preferred_term: filgrastim
      term:
        id: CHEBI:749461
        label: filgrastim
  evidence:
  - reference: PMID:24753537
    reference_title: Inherited biallelic CSF3R mutations in severe congenital neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the patients responded to treatment with recombinant human G-CSF"
    explanation: >-
      Documents the non-response to G-CSF that defines the clinical management
      problem in SCN7.
- name: Hematopoietic cell transplantation
  action_category: THERAPEUTIC
  description: >-
    Allogeneic haematopoietic stem cell transplantation is the option for
    patients refractory to both G-CSF and GM-CSF.
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  evidence:
  - reference: PMID:34778134
    reference_title: "Efficacy of Low-Dose rhGM-CSF Treatment in a Patient With Severe Congenital Neutropenia Due to CSF3R Deficiency: Case Report of a Novel Biallelic CSF3R Mutation and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hematopoietic stem cell transplantation can serve as a treatment option"
    explanation: >-
      States HSCT as a treatment option for refractory disease.
- name: Antimicrobial management
  action_category: THERAPEUTIC
  description: >-
    Prompt antibiotics for infections and long-term antimicrobial support are
    part of care, as for all severe congenital neutropenia.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:34778134
    reference_title: "Efficacy of Low-Dose rhGM-CSF Treatment in a Patient With Severe Congenital Neutropenia Due to CSF3R Deficiency: Case Report of a Novel Biallelic CSF3R Mutation and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all presented repeated infection and required long-term antibiotic treatments"
    explanation: >-
      Records the reliance on long-term antibiotics across the reported series.
animal_models:
- name: Csf3r-null mouse
  species: Mouse
  genotype: Csf3r homozygous null
  background: Targeted homozygous null mutation of the murine G-CSFR gene
  publication: PMID:8934575
  description: >-
    G-CSFR-deficient mice are neutropenic with reduced marrow granulocytic
    progenitors, impaired terminal differentiation and increased neutrophil
    apoptosis, and no promyelocyte maturation arrest, mirroring the human SCN7
    marrow.
  modeled_mechanisms:
  - target: Profound Peripheral Neutropenia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The knockout reproduces the circulating neutropenia of receptor loss.
    limitations: >-
      A whole-gene knockout models complete receptor loss; several human alleles
      are hypomorphic missense variants with residual signalling.
    evidence:
    - reference: PMID:8934575
      reference_title: Impaired production and increased apoptosis of neutrophils in granulocyte colony-stimulating factor receptor-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These data confirm a role for the G-CSFR as a major regulator of granulopoiesis in vivo"
      explanation: >-
        Establishes that G-CSFR loss produces the neutropenia phenotype in vivo.
  - target: Impaired Granulocytic Proliferation and Survival
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reduced progenitor expansion and increased neutrophil apoptosis, the
      cellular mechanism of the neutropenia.
    readouts:
    - name: Bone marrow granulocytic progenitor number
      target: Impaired Granulocytic Proliferation and Survival
      direction: DECREASED
      interpretation: Structural correlate of impaired progenitor expansion.
      evidence:
      - reference: PMID:8934575
        reference_title: Impaired production and increased apoptosis of neutrophils in granulocyte colony-stimulating factor receptor-deficient mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Hematopoietic progenitors are decreased in the bone marrow, and the expansion and terminal differentiation of these progenitors into granulocytes is impaired."
        explanation: Reports the reduced progenitors and impaired differentiation.
    evidence:
    - reference: PMID:8934575
      reference_title: Impaired production and increased apoptosis of neutrophils in granulocyte colony-stimulating factor receptor-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Neutrophils isolated from G-CSFR-deficient mice have an increased susceptibility to apoptosis, suggesting that the G-CSFR may also regulate neutrophil survival."
      explanation: >-
        Supports the increased-apoptosis component modelled here.
- name: csf3r zebrafish mutant
  species: Zebrafish
  genotype: Biallelic csf3r CRISPR/Cas9 mutant
  publication: PMID:28281657
  description: >-
    A CRISPR/Cas9 csf3r mutant with a persistent, stable reduction in neutrophil
    numbers, presented by its authors as a model of human CSF3R-dependent
    congenital neutropenia.
  modeled_mechanisms:
  - target: Profound Peripheral Neutropenia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Stable, life-long neutrophil deficiency from biallelic csf3r loss.
    limitations: >-
      A teleost model; neutrophil biology and infection spectrum differ from
      human, and the model captures the deficiency rather than the human
      infection phenotype.
    evidence:
    - reference: PMID:28281657
      reference_title: A GCSFR/CSF3R zebrafish mutant models the persistent basal neutrophil deficiency of severe congenital neutropenia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Biallelic csf3r mutant embryos are viable and have normal early survival, despite a substantial reduction of their neutrophil population size, and normal macrophage abundance."
      explanation: >-
        Reports the selective neutrophil deficiency recapitulating the human
        phenotype.
  evidence:
  - reference: PMID:28281657
    reference_title: A GCSFR/CSF3R zebrafish mutant models the persistent basal neutrophil deficiency of severe congenital neutropenia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These csf3r mutants are a new animal model of human CSF3R-dependent congenital neutropenia."
    explanation: >-
      The authors position the mutant as a model of human CSF3R-dependent
      congenital neutropenia.
discussions:
- discussion_id: scn7_severity_and_gmcsf_response
  kind: KNOWLEDGE_GAP
  prompt: >-
    What determines the wide severity range of SCN7, from neutropenia
    unresponsive to high-dose G-CSF to mild neutropenia needing no treatment,
    and can genotype predict responsiveness to GM-CSF?
  attaches_to:
  - genetic#CSF3R
  - treatments#GM-CSF (sargramostim)
  rationale: >-
    Reported patients span severe G-CSF-refractory disease to mild, untreated
    neutropenia, and GM-CSF response is not uniform; the small case count and
    allele heterogeneity leave the genotype-phenotype and genotype-response
    relationships unresolved.
notes: >-
  SCN7 is defined by germline biallelic loss-of-function of the G-CSF receptor.
  This is mechanistically distinct from two other CSF3R associations that must
  not be conflated with it: the somatic, cytoplasmic-tail truncating CSF3R
  mutations acquired by ELANE/HAX1 SCN clones on the path to MDS/AML (curated in
  Severe Congenital Neutropenia 1), and the germline activating CSF3R variants
  such as T617N that cause hereditary neutrophilia. The distinguishing clinical
  clues to SCN7 among the SCNs are full granulocytic maturation on marrow
  aspirate and non-response to G-CSF with response to GM-CSF. No GeneReviews
  chapter exists for CSF3R deficiency / SCN7 (checked against the committed
  Bookshelf index over the entry name and synonyms).

  Deep-research provenance. An OpenScientist report is committed alongside this
  entry and none of it was used. The report is about JAGN1 deficiency (SCN6),
  not CSF3R deficiency: it mentions JAGN1 48 times against CSF3R twice, and
  cites OMIM 616022 where MONDO:0014865 cross-references 617014.
  `just preflight-dr` returned WARN on exactly that mismatch. The report is kept
  for provenance and every claim in this entry was built from primary
  literature fetched and verified independently of it.

    snippet: "G-CSFR-deficient mice have decreased numbers of phenotypically normal circulating neutrophils. Hematopoietic progenitors are decreased in the bone marrow, and the expansion and terminal differentiation of these progenitors into granulocytes is impaired."
    explanation: >-
      The G-CSFR-knockout mouse shows exactly this impaired progenitor

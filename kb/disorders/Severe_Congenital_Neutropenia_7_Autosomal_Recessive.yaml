pathophysiology:
- name: Biallelic Loss-of-Function CSF3R Variants
  description: >-
    Homozygous or compound heterozygous loss-of-function variants in CSF3R,
    which encodes the G-CSF receptor. Reported alleles cluster in the
    extracellular region: a missense change (p.Arg308Cys) shortly preceding the
    conserved WSXWS motif, and frameshift/nonsense variants truncating the
    extracellular domain. This is the initiating germline lesion of SCN7 and is
    distinct from the somatic cytoplasmic-tail truncations acquired during
    leukaemic evolution of other SCN forms.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    gene:
      preferred_term: CSF3R
      term:
        id: hgnc:2439
        label: CSF3R
    description: >-
      Biallelic (homozygous or compound heterozygous) germline variants; the
      reported pathogenic variants affect the extracellular region of G-CSFR.
  genes:
  - preferred_term: CSF3R
    term:
      id: hgnc:2439
      label: CSF3R
  downstream:
  - target: Deficient Cell-Surface G-CSF Receptor

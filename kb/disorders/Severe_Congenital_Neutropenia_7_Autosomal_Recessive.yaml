- name: Preserved Bone Marrow Granulocytic Maturation
  description: >-
    Unlike ELANE- and HAX1-related SCN, which arrest at the promyelocyte stage,
    SCN7 marrow shows full granulocytic maturation. G-CSFR-independent pathways
    permit precursors to mature even though their numbers are low, which is the
    morphologic hallmark distinguishing this disease and a diagnostic clue.

datasets:
- accession: geo:GSE151141
  title: The major and minor spliceosome interact to regulate alternative splicing [PBMCs]
  description: Mutations in minor spliceosome components are linked to diseases such as Roifman syndrome, Lowry-Wood syndrome, and early-onset cerebellar ataxia (EOCA). Here we report that besides increased minor intron retention, Roifman syndrome and EOCA can also be characterized by elevated alternative splicing (AS) around minor introns. Consistent with the idea that the assembly/activity of the minor spliceosome informs AS in minor intron-containing genes (MIGs), inhibition of all minor spliceosome snRNAs led to upregulated AS.

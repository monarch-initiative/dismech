- category: Immunologic
  name: Autoimmunity and Immune Dysregulation
  phenotype_term:
    preferred_term: Autoimmunity
    term:
      id: HP:0002960
      label: Autoimmunity
  frequency: OCCASIONAL
  description: >-
    Newly recognized in 2026. Autoimmunity and systemic inflammation were
    identified as previously under-recognized features of the RNU4ATAC
    spectrum, with immunological investigation showing enhanced HLA-DR and PD-1
    expression on patient T cells - a pattern of T-cell activation and
    exhaustion. This matters clinically because the older picture of Roifman
    syndrome was a pure antibody deficiency, which would not predict
    autoimmunity.
  evidence:

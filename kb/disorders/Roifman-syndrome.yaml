      label: Type I diabetes mellitus
  frequency: OCCASIONAL
  description: >-
    New in 2026: screening 276 infants with diabetes for minor-spliceosome gene
    variants identified 12 unrelated individuals with biallelic RNU4ATAC
    variants, extending RNU4ATAC-opathy to include infancy-onset autoimmune
    diabetes - a feature the disorder was not previously known to carry. Half
    of those tested were islet-autoantibody positive, so the etiology is
    autoimmune rather than a pancreatic developmental failure.

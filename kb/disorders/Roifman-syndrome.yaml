name: Roifman-syndrome
creation_date: '2025-12-04T16:57:31Z'
description: >-
  Roifman syndrome is caused by biallelic mutations in RNU4ATAC, which encodes the U4atac small nuclear RNA component of the minor (U12-dependent) spliceosome.
  Defective minor-spliceosome function impairs splicing of a subset of essential genes, disrupting immune and somatic development.
  The result is a multisystem disorder with antibody deficiency and recurrent infections, growth retardation, intellectual disability, and dysmorphic features.
category: Genetic
parents:
- Immunodeficiency
- Skeletal Dysplasia
classifications:
  isds_skeletal_category:
  - classification_value: primordial_dwarfism_and_slender_bones
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 21 "Primordial dwarfism and slender bone
      dysplasias", NOS 21-0090 "Roifman syndrome, RNU4ATAC-related" (OMIM
      616651). This re-verifies against the 2023 table an assignment first
      taken from the 2019 revision (Mortier et al., PMID:31633310), Table 1
      group 19 "Primordial dwarfism and slender bones group", listed there as
      "Roifman syndrome". The committee lists Roifman syndrome as an entity
      distinct from the RNU4ATAC microcephalic osteodysplastic primordial
      dwarfism row (NOS 21-0080) despite the shared gene, so this entry is
      correctly a separate dismech file rather than an MOPD subtype.

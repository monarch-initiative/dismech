  sample_count: 8
  notes: Identified by GEO DataSets index search for Roifman-syndrome (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: ega:EGAS00001001098
  title: Compound heterozygous mutations in the noncoding RNU4ATAC gene cause Roifman Syndrome by disrupting minor intron splicing
  description: Roifman Syndrome is a rare congenital disorder characterized by growth retardation, cognitive delay, spondyloepiphyseal dysplasia and antibody deficiency. Given its prevalence in males, it was originally postulated to be X-linked. Whole genome sequencing revealed compound heterozygous rare variants disrupting highly conserved positions of the autosomal non-coding RNU4ATAC gene, a minor spliceosome component essential for minor intron splicing. Targeted sequencing confirmed allele segregation in six cases from four unrelated families.
  organism:
    preferred_term: human

pathophysiology:
- name: Biallelic RNU4ATAC Variants Sparing the 5' Stem-Loop
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    RNU4ATAC encodes U4atac, a non-protein-coding snRNA of the minor
    spliceosome. Roifman syndrome arises from compound heterozygous variants in
    which at least one allele spares the 5' stem-loop - typically one variant at
    the 5' stem-loop or the Sm-binding element and the second in stem II. This
    genotype rule is what separates Roifman syndrome from MOPD I: variants
    located exclusively in the 5' stem-loop give the severe lethal MOPD I
    phenotype, because that region is where U4atac binds the essential
    di-snRNP proteins.
  genes:
  - preferred_term: RNU4ATAC
    term:
      id: hgnc:34016
      label: RNU4ATAC
  downstream:
  - target: Defective U12-Type Minor Intron Splicing
  evidence:
  - reference: PMID:26522830
    reference_title: "Compound heterozygous mutations in the noncoding RNU4ATAC cause Roifman Syndrome by disrupting minor intron splicing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whole-genome sequencing of Roifman Syndrome patients to reveal compound heterozygous rare variants that disrupt highly conserved positions of the RNU4ATAC small nuclear RNA gene"
    explanation: >-
      Establishes compound heterozygous RNU4ATAC variants as the cause of
      Roifman syndrome.
  - reference: PMID:41808109
    reference_title: "Phenotypic spectrum of RNU4ATAC-related spliceosomopathies: four novel cases and integrated reevaluation of previously reported patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotypes carrying at least one variant that spares the 5\u2032 stem-loop are associated with a milder phenotype and later onset."
    explanation: >-
      States the genotype rule that places Roifman syndrome at the milder end of
      the RNU4ATAC spectrum, which is what this node asserts.
- name: Defective U12-Type Minor Intron Splicing
  biological_scale: MOLECULAR
  description: >-
    U4atac base-pairs U6atac and licenses it to catalyse excision of U12-type
    minor introns, which occur in roughly 750 human genes. Destabilizing U4atac
    causes intron retention and elevated alternative splicing in that gene set,
    shifting the tissue-specific distribution of mRNA isoforms. Because the
    affected gene set is small but functionally clustered, the downstream
    consequences are selective rather than global - which is why one snRNA
    lesion produces an immune, a skeletal and a ciliary phenotype rather than
    generalized cell failure.
  biological_processes:
  - preferred_term: U12-type (minor) intron splicing
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: DECREASED
  cellular_components:
  - preferred_term: U12-type (minor) spliceosome
    term:
      id: GO:0005689
      label: U12-type spliceosomal complex
  downstream:
  - target: Disturbed MAPK1 Splicing and Transitional B-Cell Arrest
  - target: Defective Megakaryocyte Differentiation
  - target: Secondary Primary Cilium Dysfunction
  - target: Renal Disease
    description: >-
      Newly recognized as under-recognized in the spectrum; attached to the
      splicing node because no organ-level mechanism has been proposed.
  evidence:
  - reference: PMID:41808109
    reference_title: "Phenotypic spectrum of RNU4ATAC-related spliceosomopathies: four novel cases and integrated reevaluation of previously reported patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Defective minor intron splicing as a consequence of deleterious biallelic variants in RNU4ATAC results in intron retention and elevated alternative splicing, affecting the tissue-specific distribution of mRNA isoforms."
    explanation: >-
      States the molecular consequence of U4atac destabilization.
  - reference: PMID:36802443
    reference_title: "Deficiency of the minor spliceosome component U4atac snRNA secondarily results in ciliary defects in human and zebrafish."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the human genome, about 750 genes contain one intron excised by the minor spliceosome."
    explanation: >-
      Gives the size of the affected gene set, which is what makes the
      downstream consequences selective.
- name: Disturbed MAPK1 Splicing and Transitional B-Cell Arrest
  biological_scale: CELLULAR
  description: >-
    The best-resolved arm of the mechanism. B-cell numbers are dramatically
    reduced and differentiation halts at the transitional B-cell stage. The
    block is not a shortage of survival signal: B-cell activating factor (BAFF)
    is abundantly available, yet development past the BAFF-dependent stage is
    crippled, because minor splicing of MAPK1 - the critical signalling
    component downstream of BAFF - is disturbed. So the cell has the ligand and
    lacks the ability to transduce it.
  cell_types:
  - preferred_term: transitional stage B cell
    term:
      id: CL:0000818
      label: transitional stage B cell
  biological_processes:
  - preferred_term: B cell differentiation
    term:
      id: GO:0030183
      label: B cell differentiation
    modifier: DECREASED
  downstream:
  - target: Hypogammaglobulinemia
  - target: Recurrent Infections
    description: >-
      Antibody deficiency from the B-cell maturation block is the proximate
      cause of the infection susceptibility.
  - target: Autoimmunity and Immune Dysregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Grouped with the B-cell arm as an immune consequence of disturbed minor
      splicing. The T-cell activation and exhaustion signature suggests the
      mechanism is broader than the B-cell block alone, and it has not been
      resolved.
  - target: Early-Onset Autoimmune Diabetes
    description: >-
      Islet autoimmunity in the context of the same immune dysregulation;
      impaired B-cell development and maturation is the shared transcriptomic
      finding across RNU4ATAC and RNU6ATAC cohorts.
  evidence:
  - reference: PMID:29391254
    reference_title: "Abnormal differentiation of B cells and megakaryocytes in patients with Roifman syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients exhibited a dramatic reduction in B-cell numbers, with differentiation halted at the transitional B-cell stage."
    explanation: >-
      The cellular arrest this node describes, measured in patients.
  - reference: PMID:29391254
    reference_title: "Abnormal differentiation of B cells and megakaryocytes in patients with Roifman syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite abundant B-cell activating factor availability, development past this B-cell activating factor-dependent stage was crippled, with disturbed minor splicing of the critical mitogen-activated protein kinase 1 signaling component."
    explanation: >-
      Identifies MAPK1 minor splicing as the specific lesion, and rules out BAFF
      availability as the limiting factor.
- name: Defective Megakaryocyte Differentiation
  biological_scale: CELLULAR
  description: >-
    A second haematopoietic lineage is affected independently of the B-cell
    arm: megakaryocyte differentiation is defective with inadequate generation
    of proplatelets, which accounts for the thrombocytopenia seen in some
    patients.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  biological_processes:
  - preferred_term: megakaryocyte differentiation
    term:
      id: GO:0030219
      label: megakaryocyte differentiation
    modifier: DECREASED
  downstream:
  - target: Thrombocytopenia
    description: >-
      Inadequate proplatelet generation is the direct route to the low
      platelet count.
  evidence:
  - reference: PMID:29391254
    reference_title: "Abnormal differentiation of B cells and megakaryocytes in patients with Roifman syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with Roifman syndrome demonstrated defects in megakaryocyte differentiation, with inadequate generation of proplatelets"
    explanation: >-
      The megakaryocyte arm, measured in the same patients.
- name: Secondary Primary Cilium Dysfunction
  biological_scale: CELLULAR
  description: >-
    Cilium assembly is over-represented among minor-intron-containing genes: 86
    cilium-related genes carry at least one minor intron, 23 of them
    ciliopathy-related. Primary cilium function is altered in patient
    fibroblasts and a u4atac zebrafish model shows ciliopathy-related traits, so
    ciliary dysfunction is a genuine downstream mechanism rather than a
    coincidental overlap. This is the arm that plausibly explains the skeletal,
    retinal and neurodevelopmental features that a purely haematopoietic
    mechanism cannot.
  biological_processes:
  - preferred_term: cilium assembly
    term:
      id: GO:0060271
      label: cilium assembly
    modifier: DECREASED
  downstream:
  - target: Growth Retardation
  - target: Intellectual Disability
  - target: Dysmorphic Facial Features
    description: >-
      Grouped with the other ciliopathy-consistent developmental features; the
      link is at the level of the affected gene set rather than a demonstrated
      craniofacial experiment.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Strabismus
    description: >-
      Curated as part of the ocular involvement of the spectrum. The specific
      route from ciliary dysfunction to strabismus is not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Spondyloepiphyseal Dysplasia
    description: >-
      Skeletal ciliopathy-consistent manifestation; cilium-related genes are
      enriched among minor-intron-containing genes.
  evidence:
  - reference: PMID:36802443
    reference_title: "Deficiency of the minor spliceosome component U4atac snRNA secondarily results in ciliary defects in human and zebrafish."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A gene ontology term enrichment analysis on minor intron-containing genes reveals that the cilium assembly process is over-represented, with no less than 86 cilium-related genes containing at least one minor intron, among which there are 23 ciliopathy-related genes."
    explanation: >-
      Quantifies the enrichment that makes ciliary dysfunction a predictable
      consequence of minor-splicing failure.
  - reference: PMID:36802443
    reference_title: "Deficiency of the minor spliceosome component U4atac snRNA secondarily results in ciliary defects in human and zebrafish."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "indicating ciliary dysfunction as a mechanism downstream of minor splicing defects"
    explanation: >-
      States the causal ordering this node asserts - ciliary dysfunction is
      secondary to the splicing defect, not a parallel lesion.

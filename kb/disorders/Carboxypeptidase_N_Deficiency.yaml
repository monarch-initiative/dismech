animal_models:
- name: Cpn1-null mouse
  species: Mouse
  genotype: Cpn1 knockout (targeted disruption of the small catalytic subunit)
  publication: PMID:19414808
  description: >-
    Targeted disruption of Cpn1 produces essentially absent plasma CPN activity. Mice are viable and fertile without
    gross developmental abnormalities, but become susceptible to experimental complement activation. Acute challenge
    does not reproduce the complete natural history of partial human deficiency.
  modeled_mechanisms:
  - target: Persistence of Active Anaphylatoxins
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Complete loss of the enzyme, with the resulting anaphylatoxin persistence
      read out as lethal sensitivity to complement activation.
    limitations: >-
      The mouse has complete enzyme loss, whereas measured human deficiency is partial. It demonstrates susceptibility
      to acute experimental complement activation rather than the spontaneous recurrent attacks of the human illness.
    readouts:
    - name: Survival after cobra venom factor-induced complement activation
      target: Persistence of Active Anaphylatoxins
      direction: DECREASED
      interpretation: >-
        Lethality on complement activation is the functional readout of
        uninactivated anaphylatoxin.
      evidence:
      - reference: PMID:19414808
        reference_title: Targeted disruption of the gene encoding the murine small subunit of carboxypeptidase N (CPN1) causes susceptibility to C5a anaphylatoxin-mediated shock.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: CPN1(-/-) mice were hypersensitive to lethal anaphylactic shock due to acute complement activation by cobra venom factor.
        explanation: The measurement itself, and its direction.
    evidence:
    - reference: PMID:19414808
      reference_title: Targeted disruption of the gene encoding the murine small subunit of carboxypeptidase N (CPN1) causes susceptibility to C5a anaphylatoxin-mediated shock.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: This hypersensitivity was completely resolved in CPN1(-/-)/C5aR(-/-) but not in CPN1(-/-)/C3aR(-/-) mice.
      explanation: >-
        Genetic epistasis in the model is what licenses treating it as informative
        about which anaphylatoxin drives the node.
    - reference: PMID:19414808
      reference_title: Targeted disruption of the gene encoding the murine small subunit of carboxypeptidase N (CPN1) causes susceptibility to C5a anaphylatoxin-mediated shock.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: CPN1−/− mice develop normally, displaying no gross abnormalities.
      explanation: >-
        Baseline phenotype differs from the provoked shock phenotype.
  - target: Mast Cell Histamine Release
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Antihistamine pretreatment reduced mortality following C5a challenge, supporting a histamine-mediated contribution.
    limitations: >-
      Antihistamine rescue supports a histamine-dependent component of acute mouse lethality; it does not establish
      histamine as the sole or necessary mediator of every spontaneous human attack.
    evidence:
    - reference: PMID:19414808
      reference_title: Targeted disruption of the gene encoding the murine small subunit of carboxypeptidase N (CPN1) causes susceptibility to C5a anaphylatoxin-mediated shock.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: This C5a-induced mortality was reduced to 20% when CPN1(-/-) mice were treated with an antihistamine before C5a challenge.
      explanation: The rescue experiment behind this link.
- name: Cpn and Cpb2 knockout vascular-leakage models
  species: Mouse
  genotype: Cpn knockout, Cpb2 knockout, and Cpb2/Cpn double knockout
  publication: PMID:34626062
  description: >-
    Skin irritation produces greater vascular leakage in either single knockout and the greatest leakage in double
    knockouts, without a baseline difference. This shows complementary protection by the two plasma carboxypeptidases.
  modeled_mechanisms:

biochemical:
- name: Plasma carboxypeptidase N activity
  presence: PRESENT
  notes: >-
    These studies measure catalytic activity, not simply CPN protein concentration. The original patient had 21%
    of normal activity; the 2024 abstract summarized 30–50% of the reference median, while the 2025 proband had
    67% of the normal mean. Residual activity varies across patients and methods. The 2024 article provides assay-specific
    reference intervals; they should not be treated as universal diagnostic thresholds.
  evidence:
  - reference: PMID:7437116
    reference_title: Familial carboxypeptidase N deficiency.

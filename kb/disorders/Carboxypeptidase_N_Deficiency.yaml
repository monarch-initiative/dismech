    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: H1 antihistamines, even at the highest dose (20 mg/d desloratadine), failed to relieve symptoms.
    explanation: >-
      Human treatment failure at maximal dose, against the claim that
      antihistamines treat this disease. This is the more relevant evidence of
      the two: the mouse experiment tests an acute C5a challenge, whereas this
      tests the spontaneous attacks patients actually have.
  - reference: PMID:38445235
    reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: symptoms in these families do not respond to H1 antihistamines, and prophylaxis currently recommended for HAE must therefore be adapted.
    explanation: >-
      The authors report lack of benefit across these families; this is not evidence that every possible patient
      or urticaria episode must be resistant.
  notes: >-
    Mouse pharmacological rescue and human treatment failure are retained with their distinct settings; neither
    proves the relative mediator contribution to every attack.
  action_category: THERAPEUTIC
- name: Plasma-derived C1 inhibitor
  action_category: THERAPEUTIC
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    Intravenous plasma-derived C1 inhibitor resolved laryngeal and cutaneous edema in the 2025 proband after incomplete
    icatibant response. Subcutaneous long-term prophylaxis subsequently nearly eliminated episodes. This is a single-patient
    observation despite normal baseline C1-inhibitor function, not controlled proof of efficacy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

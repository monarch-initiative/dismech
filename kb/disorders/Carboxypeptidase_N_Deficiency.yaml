name: Carboxypeptidase N Deficiency
creation_date: '2026-09-11T12:30:00Z'
category: Mendelian
synonyms:
- CPN deficiency
- kininase I deficiency
- CPN1 deficiency
- hereditary angioedema with normal C1 inhibitor due to carboxypeptidase N deficiency
- HAE-CPN
description: >-
  Carboxypeptidase N deficiency is a rare disorder of plasma peptide regulation associated with reduced activity
  of the CPN1-encoded catalytic subunit. Recurrent peripheral, abdominal or laryngeal angioedema can occur with
  urticaria. CPN normally removes C-terminal basic residues from kinins and complement anaphylatoxins, altering
  their receptor activity. In particular, des-Arg kinins lose B2-receptor activity but can act at B1 receptors;
  the products are not uniformly inert.

  Most early families were interpreted as showing recessive inheritance, with homozygous or compound heterozygous
  CPN1 variants. A later family with a heterozygous p.Thr245Met variant suggests possible dominant inheritance,
  but the independent contribution of that allele and proposed modifiers remains unresolved. Reported human deficiency
  is partial, with variable symptoms and treatment response. A drug trigger is not required in every case.

  Reduced mediator degradation is central to the proposed mechanism. Increased plasminogen-dependent kinin production
  is an additional hypothesis, not an established patient-level pathway. Evidence from knockout mice demonstrates
  susceptibility to experimental complement activation and vascular leakage but does not establish the relative
  contributions of kinins and histamine to each human attack.

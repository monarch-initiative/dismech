inheritance:
- name: Autosomal Recessive
  description: >-
    The original family and the 2024 series support recessive inheritance of marked enzyme deficiency. The later
    series includes homozygous p.Gly178Asp and compound heterozygous genotypes. Symptoms in some heterozygous relatives
    and the 2025 pedigree prevent a universal recessive-only clinical model.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:7437116
    reference_title: Familial carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The proband's sister had an equally depressed serum carboxypeptidase N level, and studies of other family members suggested an autosomal recessive inheritance of the enzyme deficiency.
    explanation: >-
      Family segregation of the enzyme level, which is what the recessive
      assignment rests on.
  - reference: PMID:38445235
    reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The variants were transmitted as an autosomal-recessive trait, and combinations of CPN1 alleles cosegregated with angioedema clinical symptoms in patients.
    explanation: >-
      The authors interpreted the four-family series as recessive; this is not a claim that all symptomatic relatives
      have two variants.
- name: Possible autosomal dominant inheritance
  description: >-
    A Japanese family showed vertical transmission of symptoms with heterozygous CPN1 p.Thr245Met in the proband
    and her mother. The authors propose dominant inheritance but acknowledge that one family cannot establish whether
    heterozygosity alone is sufficient.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: url:https://www.jstage.jst.go.jp/article/allergolint/74/3/74_479/_pdf
    reference_title: Dominant inheritance in hereditary angioedema associated with carboxypeptidase N deficiency
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The variant was present in the proband's symptomatic mother but absent in the proband's asymptomatic brother.
    explanation: >-
      Segregation in one family supports a possible dominant model, with unresolved modifier effects.
pathophysiology:
- name: CPN1 variants associated with reduced enzyme activity
  biological_scale: MOLECULAR
  description: >-
    Reported CPN1 genotypes include a frameshift with p.Gly178Asp in the original case, homozygous p.Gly178Asp,
    and compound heterozygous missense or synonymous variants in later families. Heterozygous p.Thr245Met was associated
    with partial deficiency in a 2025 family. Individual variant effects and the inheritance of symptoms require
    interpretation alongside segregation and enzyme assays; predicted splicing effects are not experimentally confirmed.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:12560874
    reference_title: DNA polymorphism and mutations in CPN1, including the genomic basis of carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In the genomic DNA of the proband, we discovered three CPN1 variants: (1) 385fsInsG, a frameshift mutation in exon 1 due to a single G insertion at nucleotide 385'
    explanation: >-
      The first molecular lesion identified in a biochemically documented case,
      establishing CPN1 as the affected gene.
  - reference: PMID:38445235
    reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We identified 3 variants of the CPN1 gene encoding the catalytic 55-kDa subunit of CPN: c.533G>A, c.582A>G, and c.734C>T.'
    explanation: >-
      Three alleles reported in four unrelated families, expanding the clinical and segregation evidence beyond
      the original family.
  - reference: PMID:38445235
    reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In family B, the proband II.1 was a female carrying homozygous variants
    explanation: >-
      Directly documents a homozygous genotype, rather than exclusively compound heterozygous cases.
  - reference: url:https://www.jstage.jst.go.jp/article/allergolint/74/3/74_479/_pdf
    reference_title: Dominant inheritance in hereditary angioedema associated with carboxypeptidase N deficiency
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing of the proband's blood DNA identi ﬁed a het-\nerozygous CPN1 variant (NM_001308:c.734C >T:p.T245M)"
    explanation: >-
      The 2025 proband carried one identified CPN1 variant; segregation and activity data do not by themselves prove
      a dominant molecular mechanism.
  downstream:
  - target: Reduced Plasma Carboxypeptidase N Activity
    causal_link_type: DIRECT
    description: >-
      Variants affecting the catalytic subunit can reduce plasma activity. The quantitative functional effect of
      each reported allele has not been established.
    evidence:
    - reference: PMID:38445235
      reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: CPN1 gene variants are associated with CPN deficiency and HAE-nC1-INH symptoms in 4 unrelated families.
      explanation: >-
        Association between CPN1 genotypes and reduced enzyme activity in four families; individual allele effects
        remain uncertain.
  mechanism_confidence: PROVISIONAL
- name: Reduced Plasma Carboxypeptidase N Activity
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CPN1
    term:
      id: hgnc:2312
      label: CPN1
  description: >-
    Human reports show partial loss of plasma CPN activity, with differing residual activity across individuals
    and laboratories. Reduced cleavage of terminal arginine or lysine changes the duration and receptor specificity
    of peptide signals. Activity is not interchangeable with protein concentration.
  molecular_functions:
  - preferred_term: plasma carboxypeptidase N catalytic activity
    modifier: DECREASED
    term:
      id: GO:0004181
      label: metallocarboxypeptidase activity
  evidence:
  - reference: PMID:14687935
    reference_title: 'Carboxypeptidase N: a pleiotropic regulator of inflammation.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: CPN cleaves carboxy-terminal arginines and lysines from peptides found in the bloodstream such as complement anaphylatoxins, kinins, and creatine kinase MM (CK-MM).
    explanation: >-
      Defines the reaction that is lost. Cited to a review because the substrate
      range is a synthesis across several primary studies rather than one result.
  - reference: PMID:7437116
    reference_title: Familial carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Inactivation of C3a and lysyl-bradykinin by his serum was markedly prolonged.
    explanation: >-
      The functional consequence measured directly in patient serum, rather than
      inferred from the enzyme level.
  - reference: PMID:38445235
    reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Affected patients displayed low CPN activity-30% to 50% of median value in plasma.
    explanation: >-
      Abstract summary of the four-family series; individual relatives have a broader range in the full tables.
  downstream:
  - target: Persistence of Active Anaphylatoxins
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:7437116
      reference_title: Familial carboxypeptidase N deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Carboxypeptidase N is a serum metalloenzyme that inactivates C3a, C4a, C5a, bradykinin, kalladin, and fibrinopeptides.
      explanation: >-
        Names the anaphylatoxins among the substrates whose inactivation the
        enzyme performs, which is the step this edge asserts is lost.
  - target: Persistence of B2 Receptor Kinins
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38445235
      reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: with subsequent transformation of kinin B2 receptor ligands into B1 receptor ligands
      explanation: >-
        Describes the conversion the enzyme normally performs. Without it, the
        kinin stays a B2-receptor ligand, which is the claim this edge makes.
  - target: Enhanced cell-surface plasminogen binding
    description: >-
      Reduced removal of cell-surface terminal lysines could increase plasminogen binding. This is an extrapolation
      from purified-enzyme experiments to patient deficiency.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:7593646
      reference_title: Plasma carboxypeptidases as regulators of the plasminogen system.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Purified carboxypeptidase N, which is constitutively active, and plasma carboxypeptidase B, which circulates as a zymogen, were both capable of significantly reducing plasminogen binding to cells.
      explanation: >-
        Demonstrates the normal enzyme effect in vitro; increased binding in CPN-deficient patients remains hypothetical.
  - target: Decreased circulating carboxypeptidase N activity
    description: >-
      Functional deficiency is detectable by a plasma enzyme assay.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38445235
      reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Affected patients displayed low CPN activity-30% to 50% of median value in plasma.
      explanation: >-
        Summary of activity in the selected clinical series.
- name: Persistence of Active Anaphylatoxins
  biological_scale: MOLECULAR
  description: >-
    Reduced terminal-arginine cleavage can prolong the activity of complement anaphylatoxins. C3a-desArg loses C3a-receptor
    binding, whereas C5a-desArg retains lower receptor affinity; cleavage does not make every product inert. Knockout-mouse
    experiments establish impaired cleavage and C5a-dependent shock, while the contribution to spontaneous human
    attacks remains incompletely measured.
  biological_processes:
  - preferred_term: inactivation of complement anaphylatoxins
    modifier: DECREASED
    term:
      id: GO:0043171
      label: peptide catabolic process
  evidence:
  - reference: PMID:19414808
    reference_title: Targeted disruption of the gene encoding the murine small subunit of carboxypeptidase N (CPN1) causes susceptibility to C5a anaphylatoxin-mediated shock.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: This hypersensitivity was completely resolved in CPN1(-/-)/C5aR(-/-) but not in CPN1(-/-)/C3aR(-/-) mice.
    explanation: >-
      Receptor epistasis identifying C5a, not C3a, as the anaphylatoxin whose
      persistence matters. This is the mouse; no equivalent human experiment exists.
  - reference: PMID:19414808
    reference_title: Targeted disruption of the gene encoding the murine small subunit of carboxypeptidase N (CPN1) causes susceptibility to C5a anaphylatoxin-mediated shock.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: C5a-desArg has significantly reduced affinity for the C5a receptor
    explanation: >-
      Biochemical background distinguishes reduced activity from complete inactivity.
    quote_role: BACKGROUND
  downstream:
  - target: Mast Cell Histamine Release
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:19414808
      reference_title: Targeted disruption of the gene encoding the murine small subunit of carboxypeptidase N (CPN1) causes susceptibility to C5a anaphylatoxin-mediated shock.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: This C5a-induced mortality was reduced to 20% when CPN1(-/-) mice were treated with an antihistamine before C5a challenge.
      explanation: >-
        Antihistamine rescue places histamine downstream of the persisting C5a,
        which is the step this edge asserts.
  mechanism_confidence: PROVISIONAL
- name: Persistence of B2 Receptor Kinins
  biological_scale: MOLECULAR
  description: >-
    Reduced cleavage of bradykinin and Lys-bradykinin can prolong B2-receptor signaling. CPN normally converts these
    peptides to des-Arg B1-receptor ligands. Clinical response to icatibant supports kinin involvement, but neither
    uniformly increased circulating bradykinin nor a purely catabolic explanation is established. The index patient
    had delayed serum kinin inactivation without elevated measured kinin activity during attacks.
  biological_processes:
  - preferred_term: bradykinin catabolic process
    modifier: DECREASED
    term:
      id: GO:0010815
      label: bradykinin catabolic process
  evidence:
  - reference: PMID:7437116
    reference_title: Familial carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Inactivation of C3a and lysyl-bradykinin by his serum was markedly prolonged.
    explanation: >-
      Direct measurement of delayed kinin inactivation in the proband's own serum.
  downstream:
  - target: Increased Microvascular Permeability
    description: >-
      Prolonged B2-receptor signaling is a plausible contributor to vascular leakage. Carboxypeptidase-deficient
      mice support this link, but the study did not measure bradykinin levels.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34626062
      reference_title: Both plasma basic carboxypeptidases, carboxypeptidase B2 and carboxypeptidase N, regulate vascular leakage activity in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Skin irritation increased vascular leakage most in Cpb2-/- /Cpn-/- , less in Cpb2-/- and Cpn-/- , and least in WT mice.
      explanation: >-
        Primary mouse experiment supports a vascular protective role for CPN.
    - reference: PMID:34626062
      reference_title: Both plasma basic carboxypeptidases, carboxypeptidase B2 and carboxypeptidase N, regulate vascular leakage activity in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Although BK levels were not determined, BK is the likely substrate for CPB2 and CPN in this model.
      explanation: >-
        The authors explicitly identify the substrate assignment as an inference.
  mechanism_confidence: PROVISIONAL
- name: Mast Cell Histamine Release
  biological_scale: CELLULAR
  description: >-
    C5a can trigger histamine release from mast cells and basophils. Elevated plasma histamine during attacks in
    the original patient and antihistamine protection in challenged knockout mice support a histamine-mediated component.
    Neither identifies the cellular source in patients, and antihistamine resistance in later families limits a
    histamine-only explanation.
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  biological_processes:
  - preferred_term: mast cell degranulation
    modifier: INCREASED
    term:
      id: GO:0043303
      label: mast cell degranulation
  evidence:
  - reference: PMID:7437116
    reference_title: Familial carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Plasma histamine was elevated during attacks, but serotonin and kinin activity were not.
    explanation: >-
      Attack-associated histamine release in the proband. Note the same sentence
      records that circulating kinin activity was not elevated, which is why the
      kinin arm of this entry is built on delayed inactivation rather than on
      measured kinin levels.
  downstream:
  - target: Increased Microvascular Permeability
    description: >-
      Histamine-mediated vascular effects are a plausible component of the phenotype; their contribution in individual
      patients is uncertain.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:19414808
      reference_title: Targeted disruption of the gene encoding the murine small subunit of carboxypeptidase N (CPN1) causes susceptibility to C5a anaphylatoxin-mediated shock.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Histamine causes vasodilation, increased vascular permeability, and smooth muscle contraction leading to broncho-constriction
      explanation: >-
        Physiological background cited in the mouse study; not a patient-specific permeability measurement.
      quote_role: BACKGROUND
  mechanism_confidence: PROVISIONAL
- name: Increased Microvascular Permeability
  biological_scale: TISSUE
  description: >-
    Excess vasoactive signaling can permit fluid extravasation into skin and mucosal tissues. The relative contributions
    of kinins, anaphylatoxins and histamine are not resolved in each patient. Experimental CPN deficiency increases
    vascular leakage after challenge.
  evidence:
  - reference: PMID:38445235
    reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Genetic CPN deficiency may contribute to bradykinin and anaphylatoxin accumulation, with synergistic effects in angioedema and urticarial symptoms.
    explanation: >-
      States the convergence of the two mediator arms on the same clinical
      endpoint, which is what this node represents. The authors' own hedge
      ("may contribute") is preserved rather than strengthened.
  - reference: PMID:34626062
    reference_title: Both plasma basic carboxypeptidases, carboxypeptidase B2 and carboxypeptidase N, regulate vascular leakage activity in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: There was no difference in vascular leakage without the challenge.
    explanation: >-
      The mouse vascular phenotype is challenge dependent.
  downstream:
  - target: Angioedema
    description: >-
      Vascular fluid leakage produces episodic subcutaneous and submucosal swelling.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38445235
      reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Patients presented with angioedema and urticaria, mainly on face/lips, but also with abdominal pain or laryngeal symptoms.
      explanation: >-
        Confirms the phenotype and its distribution across four further families.
  - target: Urticaria
    description: >-
      Superficial vascular leakage contributes to wheals, which can accompany angioedema but are not obligatory.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38445235
      reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Urticarial lesions in CPN-deficient patients developed frequently, but not consistently, in association with angioedema attacks.
      explanation: >-
        Documents the variable association of urticaria with attacks.
  - target: Abdominal pain
    description: >-
      Intestinal angioedema can produce painful abdominal attacks.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38445235
      reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Patients presented with angioedema and urticaria, mainly on face/lips, but also with abdominal pain or laryngeal symptoms.
      explanation: >-
        Supports abdominal involvement, without quantifying its frequency.
  - target: Laryngeal edema
    description: >-
      Upper-airway fluid extravasation can produce laryngeal swelling.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: url:https://www.jstage.jst.go.jp/article/allergolint/74/3/74_479/_pdf
      reference_title: Dominant inheritance in hereditary angioedema associated with carboxypeptidase N deficiency
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The proband, a Japanese female in the 40s age group, began experiencing episodic laryngeal edema and discomfort at age 36.
      explanation: >-

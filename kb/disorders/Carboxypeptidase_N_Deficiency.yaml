    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients presented with angioedema and urticaria, mainly on face/lips, but also with abdominal pain or laryngeal symptoms."
    explanation: >-
      Records urticaria alongside angioedema in the four-family series.

- name: Family evaluation and genetic counseling
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Evaluate relatives using clinical history and, when a familial pathogenic variant is established, targeted testing.
    Counseling should acknowledge the uncertain inheritance of symptoms and possible modifier effects rather than
    assume a single recurrence model for every family.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:40053270
    reference_title: 'Hereditary Angioedema with Normal C1 Inhibitor: an Updated International Consensus Paper on Diagnosis, Pathophysiology, and Treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Targeted genetic screening should be done on family members, irrespective of whether or not they have experienced angioedema, when HAE-nC1INH with a known pathogenic variant is identified
    explanation: >-
      General HAE-nC1INH expert guidance applied with CPN1-specific variant-interpretation limits.
    quote_role: REVIEW_SYNTHESIS
- name: Individualized attack plan and follow-up
  action_category: MONITORING
  description: >-
    Specialist follow-up should assess attack sites, triggers, response to acute therapy and need for prophylaxis.
    Access to on-demand treatment is important because upper-airway attacks can be serious; the available CPN1-specific
    treatment evidence remains limited.
  evidence:
  - reference: PMID:40053270
    reference_title: 'Hereditary Angioedema with Normal C1 Inhibitor: an Updated International Consensus Paper on Diagnosis, Pathophysiology, and Treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In all cases, it is recommended that ODT be made available for all patients.
    explanation: >-
      Expert recommendation for HAE-nC1INH broadly, not a CPN-specific trial result.
    quote_role: REVIEW_SYNTHESIS
diagnosis:
- name: Plasma carboxypeptidase N activity assay
  description: >-
    Measure plasma CPN catalytic activity in a specialist laboratory and interpret it alongside clinical findings
    and genetic analysis. Low activity can persist between attacks. Assay-specific reference ranges and other causes
    of reduced activity limit use of a universal threshold.
  diagnosis_term:
    preferred_term: plasma carboxypeptidase N activity measurement
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:7437116
    reference_title: Familial carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Of 172 sera from patients with chronic urticaria or angioedema, one had a remarkably depressed carboxypeptidase N level (21% of normal).
    explanation: >-
      The assay applied as a screen in the target population, and its yield.
  - reference: PMID:38445235
    reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CPN activity was measured according to a protocol modified from Skidgel23 using a FurylAcroyloyl-Ala-Lys substrate
    explanation: >-
      Specifies the assay used in the clinical series.
- name: CPN1 sequencing
  description: >-
    Sequence CPN1 and assess segregation and enzyme activity together. Novel variants require cautious interpretation;
    a rare or predicted damaging variant alone does not establish causality. The 2024 series reports both homozygous
    and compound heterozygous findings, and the later pedigree raises a possible dominant model.
  diagnosis_term:
    preferred_term: CPN1 gene sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:38445235
    reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We identified 3 variants of the CPN1 gene encoding the catalytic 55-kDa subunit of CPN: c.533G>A, c.582A>G, and c.734C>T.'
    explanation: >-
      Sequencing is what produced the molecular diagnosis in these families.
  - reference: PMID:40053270
    reference_title: 'Hereditary Angioedema with Normal C1 Inhibitor: an Updated International Consensus Paper on Diagnosis, Pathophysiology, and Treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A novel variant in one of the known genes needs to be considered a variant of unknown significance (VUS) and not a cause of HAE-nC1INH until confirmed by further research
    explanation: >-
      Consensus guidance against treating every rare sequence finding as diagnostic.
    quote_role: REVIEW_SYNTHESIS
- name: Complement and C1-inhibitor testing
  description: >-
    C4, C1-inhibitor antigen and C1-inhibitor function help distinguish classical C1-inhibitor deficiency from angioedema
    with normal C1 inhibitor. Normal results support that distinction but do not establish CPN deficiency.
  diagnosis_term:
    preferred_term: Laboratory Procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:40053270
    reference_title: 'Hereditary Angioedema with Normal C1 Inhibitor: an Updated International Consensus Paper on Diagnosis, Pathophysiology, and Treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Measure C4, C1INH antigen, and C1INH function (if available), even if the patient is taking a medication that may cause angioedema.
    explanation: >-
      Expert diagnostic recommendation.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:38445235
    reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Antigenic C1-INH and function were in the normal range for all individuals.
    explanation: >-
      Direct biochemical finding in the four-family study.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A small number of families has been reported. The 2025 family report counted seven families worldwide at publication;
    this is a literature count, not a prevalence estimate. The original finding of one low-activity sample among
    172 sera from patients selected for urticaria or angioedema is a referral-screen yield. Neither series supports
    population prevalence or penetrance estimates.
  evidence:
  - reference: PMID:7437116
    reference_title: Familial carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Of 172 sera from patients with chronic urticaria or angioedema, one had a remarkably depressed carboxypeptidase N level (21% of normal).
    explanation: >-
      The single denominator-bearing observation available, quoted for scale and
      explicitly not as a prevalence estimate.
  - reference: url:https://www.jstage.jst.go.jp/article/allergolint/74/3/74_479/_pdf
    reference_title: Dominant inheritance in hereditary angioedema associated with carboxypeptidase N deficiency
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "only seven families with HAE-\nCPN have been documented worldwide"
    explanation: >-
      Literature count stated in the 2025 report; it is not a current population rate.
discussions:
- discussion_id: inheritance_and_modifiers
  kind: KNOWLEDGE_GAP
  prompt: When is a heterozygous CPN1 variant sufficient to cause disease?
  attaches_to:
  - pathophysiology#CPN1 variants associated with reduced enzyme activity
  - genetic#CPN1
  rationale: >-
    The 2025 p.Thr245Met pedigree suggests dominant inheritance but includes an XPNPEP2 regulatory-region variant
    proposed as a modifier. Its effect on expression or enzyme activity was not measured in that family. The 2024
    series also raises KLKB1 and F12 modifier candidates. These findings do not establish oligogenic causation or
    variant-specific penetrance.
- discussion_id: kinin_generation_contribution
  kind: KNOWLEDGE_GAP
  prompt: How much does increased kinin production contribute beyond impaired peptide degradation?
  attaches_to:
  - pathophysiology#Enhanced cell-surface plasminogen binding
  - pathophysiology#Increased kinin generation
  rationale: >-
    Purified CPN reduces plasminogen binding to cells, and the clinical papers propose that its loss could increase
    plasmin-dependent kinin generation. Patient-level plasminogen binding and activation have not been directly
    quantified. Treatment responses and kininogen cleavage are compatible observations rather than proof of the
    complete pathway.
differential_diagnoses:
- name: C1-inhibitor-deficient hereditary or acquired angioedema
  description: >-
    Shares recurrent swelling but is distinguished by C1-inhibitor and complement testing.
  evidence:
  - reference: PMID:40053270
    reference_title: 'Hereditary Angioedema with Normal C1 Inhibitor: an Updated International Consensus Paper on Diagnosis, Pathophysiology, and Treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Measure C4, C1INH antigen, and C1INH function (if available), even if the patient is taking a medication that may cause angioedema.
    explanation: >-
      Expert diagnostic recommendation.
    quote_role: REVIEW_SYNTHESIS
- name: Mast-cell-mediated angioedema
  description: >-
    Urticaria alone does not distinguish the disorders. Assess clinical course and response to mast-cell-directed
    treatment; spontaneous attack resolution can confound response interpretation.
  evidence:
  - reference: PMID:40053270
    reference_title: 'Hereditary Angioedema with Normal C1 Inhibitor: an Updated International Consensus Paper on Diagnosis, Pathophysiology, and Treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Assessment of therapeutic response to conventional therapy is not always informative, as angioedema may resolve spontaneously.
    explanation: >-
      Clinical response requires cautious interpretation.
    quote_role: REVIEW_SYNTHESIS
- name: Medication-associated angioedema
  description: >-
    ACE-inhibitor or DPP-4-inhibitor exposure may mimic or exacerbate inherited susceptibility. Drug response alone
    does not prove a CPN1 genotype.
  evidence:
  - reference: PMID:40053270
    reference_title: 'Hereditary Angioedema with Normal C1 Inhibitor: an Updated International Consensus Paper on Diagnosis, Pathophysiology, and Treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Stop the suspected medication and assess response, which may take 1–2 months or longer depending on the frequency of the episodes.
    explanation: >-
      General diagnostic guidance for medication-associated swelling.
    quote_role: REVIEW_SYNTHESIS

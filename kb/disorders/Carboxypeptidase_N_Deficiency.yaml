        Comparative genetic experiment in mice.
    - reference: PMID:34626062
      reference_title: Both plasma basic carboxypeptidases, carboxypeptidase B2 and carboxypeptidase N, regulate vascular leakage activity in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: There was no difference in vascular leakage without the challenge.
      explanation: >-
        The challenge dependence limits extrapolation.
treatments:
- name: Withdrawal of bradykinin-pathway-inhibiting drugs
  description: >-
    Review and withdraw implicated drugs when clinically appropriate. In the related 2014 biochemical-deficiency
    case, attacks improved after lisinopril withdrawal and resolved only after sitagliptin withdrawal. The response
    does not establish drug exposure as necessary for hereditary CPN1 disease.
  target_mechanisms:
  - target: Persistence of B2 Receptor Kinins
    description: >-
      Relieves drug-induced inhibition of parallel peptide-disposal pathways; it does not restore the inherited
      CPN defect.
  evidence:
  - reference: PMID:24853572
    reference_title: Iatrogenic angioedema associated with ACEi, sitagliptin, and deficiency of 3 enzymes catabolizing bradykinin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A case is described of Angiotensin converting enzyme inhibitor (ACEi) and sitagliptin induced angioedema, where AO attacks decreased after the withdrawal of lisinopril but resolved only after the withdrawal of sitagliptin, an inhibitor of dipeptylpeptidase IV.
    explanation: >-
      Withdrawal response in one patient with multiple enzyme abnormalities and no established CPN1 genotype.
  action_category: THERAPEUTIC
- name: Icatibant
  description: >-
    On-demand B2-receptor blockade was associated with relief of severe episodes in the four-family series. In the
    2025 proband, skin symptoms improved but laryngeal discomfort persisted and was subsequently treated with plasma-derived
    C1 inhibitor. Responses are uncontrolled observations, not proof of universal efficacy.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: icatibant
      term:
        id: CHEBI:68556
        label: icatibant
  target_mechanisms:
  - target: Persistence of B2 Receptor Kinins
    description: >-
      Blocks signaling by the persistent B2-receptor ligands; it does not accelerate their degradation.
  target_phenotypes:
  - preferred_term: Angioedema
    term:
      id: HP:0100665
      label: Angioedema
  evidence:
  - reference: PMID:38445235
    reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Symptoms were relieved by 3 g/d tranexamic acid and 10 mg/d montelukast, and on-demand icatibant in case of severe episodes.
    explanation: >-
      On-demand use for severe episodes in family B. The sentence names three
      agents given together, so it supports the regimen rather than isolating
      icatibant's contribution.
  - reference: PMID:38445235
    reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Symptom relief was observed after taking 3 g/d tranexamic acid and on-demand icatibant.
    explanation: >-
      The same combination in an unrelated family, which is what makes this a
      reproduced observation rather than one family's regimen.
  - reference: PMID:38445235
    reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The effectiveness of icatibant on the relief of severe episodes in all 4 families suggests at least partial involvement of bradykinin in the clinical phenotype.
    explanation: >-
      The authors' own summary across all four families, and the strongest
      single statement of the response. It is also the sentence that makes
      icatibant mechanistic evidence and not only therapeutic: the response is
      what implicates bradykinin in the phenotype.
  - reference: url:https://www.jstage.jst.go.jp/article/allergolint/74/3/74_479/_pdf
    reference_title: Dominant inheritance in hereditary angioedema associated with carboxypeptidase N deficiency
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "rapidly improved skin symptoms, although laryngeal\ndiscomfort persisted."

environmental:
- name: Angiotensin-converting-enzyme inhibitor and dipeptidyl-peptidase-4 inhibitor exposure
  description: >-
    ACE inhibitors and DPP-4 inhibitors can worsen angioedema when parallel peptide-degrading pathways are impaired.
    A 2014 patient with reduced ACE, aminopeptidase P and CPN activity improved after lisinopril withdrawal and
    became attack-free after sitagliptin withdrawal. This related biochemical case did not establish an inherited
    CPN1 genotype and does not show that all CPN deficiency requires drug exposure.
  exposure_term:
    preferred_term: exposure to an angiotensin-converting-enzyme inhibitor or dipeptidyl-peptidase-4 inhibitor
    term:
      id: ECTO:0000509
      label: exposure to drug
  effect: Can exacerbate angioedema with reduced peptide-catabolizing activity
  influences_mechanisms:
  - target: Persistence of B2 Receptor Kinins
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Drug inhibition can further impair peptide disposal in a patient with reduced activity of several catabolic
      enzymes. The contribution attributable to CPN alone is unresolved.

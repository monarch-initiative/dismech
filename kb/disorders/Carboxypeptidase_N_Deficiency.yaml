genetic:
- name: CPN1
  gene_term:
    preferred_term: CPN1
    term:
      id: hgnc:2312
      label: CPN1
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    CPN1 encodes the 55-kDa catalytic subunit. Reported alleles are a frameshift
    (385fsInsG) and missense substitutions including G178D in the index case, and
    c.533G>A, c.582A>G and c.734C>T across four later families. No homozygous null
    genotype has been described, and every reported patient retains partial enzyme
    activity, so the human phenotype is a hypomorphic one. CPN2, encoding the large
    subunit that protects the catalytic subunit from clearance, is a plausible second
    locus but no CPN2 disease allele has been reported.
  evidence:
  - reference: PMID:12560874
    reference_title: "DNA polymorphism and mutations in CPN1, including the genomic basis of carboxypeptidase N deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although deficiency of carboxypeptidase N (MIM 212070) produces a severe allergic syndrome, no human mutations have ever been described."
    explanation: >-
      The stated gap this paper closed; it is the study that first tied the
      biochemical deficiency to CPN1.
  - reference: PMID:38445235
    reference_title: "Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CPN1 gene variants are associated with CPN deficiency and HAE-nC1-INH symptoms in 4 unrelated families."
    explanation: >-
      Independent replication of the gene-disease relationship in four families.
biochemical:
- name: Plasma carboxypeptidase N activity
  biomarker_term:
    preferred_term: carboxypeptidase N catalytic chain
    term:
      id: NCIT:C178693
      label: Carboxypeptidase N Catalytic Chain
    modifier: DECREASED
  presence: PRESENT
  notes: >-
    Reported activities are 21 per cent of normal in the index case and 30 to 50
    per cent of the plasma median in the later families. No numeric reference
    interval is recorded here: the two sources report activity as a percentage of
    their own laboratory median rather than in absolute units, and those are not
    interconvertible, so a reference_ranges block would state a precision the
    sources do not have.
  evidence:
  - reference: PMID:7437116
    reference_title: "Familial carboxypeptidase N deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 172 sera from patients with chronic urticaria or angioedema, one had a remarkably depressed carboxypeptidase N level (21% of normal)."
    explanation: >-
      Both the assay result in the index case and, incidentally, its rarity:
      one in 172 sera from a population selected for the phenotype.
environmental:
- name: Angiotensin-converting-enzyme inhibitor and dipeptidyl-peptidase-4 inhibitor exposure
  description: >-
    Bradykinin is disposed of by more than one enzyme, and carboxypeptidase N is
    the one that dominates only at high local concentrations. A drug that blocks a
    parallel route therefore converts a latent partial deficiency into symptomatic
    angioedema. The reported case is instructive because the deficiency was present
    both before the drugs were started and a year after they were stopped, while the
    attacks were not.
  exposure_term:
    preferred_term: exposure to an angiotensin-converting-enzyme inhibitor or dipeptidyl-peptidase-4 inhibitor
    term:
      id: ECTO:0000509
      label: exposure to drug
  effect: Unmasks a latent partial carboxypeptidase N deficiency
  influences_mechanisms:
  - target: Persistence of B2 Receptor Kinins
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Angiotensin-converting enzyme is the principal bradykinin-degrading route at
      physiological concentrations. Inhibiting it removes the compensation that
      keeps a partial carboxypeptidase N deficiency silent.
    evidence:
    - reference: PMID:24853572
      reference_title: "Iatrogenic angioedema associated with ACEi, sitagliptin, and deficiency of 3 enzymes catabolizing bradykinin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A case is described of Angiotensin converting enzyme inhibitor (ACEi) and sitagliptin induced angioedema, where AO attacks decreased after the withdrawal of lisinopril but resolved only after the withdrawal of sitagliptin, an inhibitor of dipeptylpeptidase IV."
      explanation: >-
        Attacks began on the drugs and resolved on their withdrawal in a patient
        with a measured carboxypeptidase N deficiency, which is the exacerbating
        relationship this link asserts.
  evidence:
  - reference: PMID:24853572
    reference_title: "Iatrogenic angioedema associated with ACEi, sitagliptin, and deficiency of 3 enzymes catabolizing bradykinin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ACE, aminopeptidase P and carboxypeptidase N were decreased down to 17%, 42%, 64% of median references values"
    explanation: >-
      Quantifies the combined enzyme deficit in the reported case. Note the
      carboxypeptidase N level here is 64 per cent, milder than in the index
      family, which is the point: it was tolerated until two other routes were
      blocked.
- name: Hormonal and physical triggers of attacks
  description: >-
    Attacks in the reported families were precipitated by identifiable triggers
    rather than arising at random: oral contraception, ovarian stimulation for
    in vitro fertilization, triptorelin, cold, and pressure. The oestrogen-related
    triggers are the ones with a mechanistic reading, since oestrogen raises
    factor XII expression and therefore contact-system kinin generation - the
    same input tranexamic acid reduces.
  exposure_term:
    preferred_term: exposure to an oestrogen-containing or gonadotropin-releasing-hormone agonist medication
    term:
      id: ECTO:0000509
      label: exposure to drug
  effect: Precipitates angioedema and urticaria attacks
  influences_mechanisms:
  - target: Persistence of B2 Receptor Kinins
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Raises kinin generation on a background where kinin disposal is already
      impaired. The intervening step is inferred from oestrogen's known effect on
      the contact system rather than measured in these patients.
    evidence:
    - reference: PMID:38445235
      reference_title: "Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "with symptoms starting when the proband was under oral contraception"
      explanation: >-
        Temporal association between starting an oestrogen-containing medication
        and symptom onset in the family B proband.
  evidence:
  - reference: PMID:38445235
    reference_title: "Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with symptoms starting when the proband was under oral contraception"
    explanation: >-
      The clearest single-sentence statement of a hormonal trigger in the series.
      The other reported triggers (cold, pressure, triptorelin, ovarian
      stimulation) appear only in a table and are described in the notes rather
      than quoted, since a table row is not a propositional quote.
  review_notes: >-
    The cold and pressure triggers reported in Table I of PMID:38445235 are not
    separately curated as environmental entries. They are real, but the only
    place they appear is a clinical-records table, and a quoted table cell would
    not substantively state the claim. Noted here so the omission is visible.
animal_models:
- name: Cpn1-null mouse
  species: Mouse
  genotype: Cpn1 knockout (targeted disruption of the small catalytic subunit)
  publication: PMID:19414808
  description: >-
    The only complete carboxypeptidase N deficiency that exists in any organism.
    Every reported human is partially deficient, so this model is the source of the
    mechanism's causal tests rather than a confirmation of them.
  modeled_mechanisms:
  - target: Persistence of Active Anaphylatoxins
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Complete loss of the enzyme, with the resulting anaphylatoxin persistence
      read out as lethal sensitivity to complement activation.
    limitations: >-
      The genotype is a complete null and every reported human genotype is
      hypomorphic, so the model is more severe than the disease. It also
      demonstrates susceptibility to acute experimental complement activation
      rather than the spontaneous recurrent attacks that define the human illness.
    readouts:
    - name: Survival after cobra venom factor-induced complement activation
      target: Persistence of Active Anaphylatoxins
      direction: DECREASED
      interpretation: >-
        Lethality on complement activation is the functional readout of
        uninactivated anaphylatoxin.
      evidence:
      - reference: PMID:19414808
        reference_title: "Targeted disruption of the gene encoding the murine small subunit of carboxypeptidase N (CPN1) causes susceptibility to C5a anaphylatoxin-mediated shock."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "CPN1(-/-) mice were hypersensitive to lethal anaphylactic shock due to acute complement activation by cobra venom factor."
        explanation: "The measurement itself, and its direction."
    evidence:
    - reference: PMID:19414808
      reference_title: "Targeted disruption of the gene encoding the murine small subunit of carboxypeptidase N (CPN1) causes susceptibility to C5a anaphylatoxin-mediated shock."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This hypersensitivity was completely resolved in CPN1(-/-)/C5aR(-/-) but not in CPN1(-/-)/C3aR(-/-) mice."
      explanation: >-
        Genetic epistasis in the model is what licenses treating it as informative
        about which anaphylatoxin drives the node.
  - target: Mast Cell Histamine Release
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Antihistamine pretreatment converts C5a challenge from uniformly lethal to
      mostly survivable, placing histamine release downstream of the persisting
      anaphylatoxin.
    limitations: >-
      Pharmacological rescue in an acute challenge model; it identifies histamine
      as a necessary mediator of that lethality without establishing that
      spontaneous human attacks are histamine-driven to the same degree.
    evidence:
    - reference: PMID:19414808
      reference_title: "Targeted disruption of the gene encoding the murine small subunit of carboxypeptidase N (CPN1) causes susceptibility to C5a anaphylatoxin-mediated shock."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This C5a-induced mortality was reduced to 20% when CPN1(-/-) mice were treated with an antihistamine before C5a challenge."
      explanation: "The rescue experiment behind this link."
treatments:
- name: Withdrawal of bradykinin-pathway-inhibiting drugs
  description: >-
    Stopping an angiotensin-converting-enzyme inhibitor, and a dipeptidyl-peptidase-4
    inhibitor where one is also being taken, restores the parallel routes of
    bradykinin disposal. In the one reported case the attacks did not resolve until
    both were withdrawn, which matters clinically: stopping the angiotensin-converting
    enzyme inhibitor alone was not enough.
  treatment_term:
    preferred_term: withdrawal of a bradykinin-pathway-inhibiting drug
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Persistence of B2 Receptor Kinins
    description: >-
      Removes the block on the alternative bradykinin-degrading pathways that the
      partial enzyme deficiency depends on.
  evidence:
  - reference: PMID:24853572
    reference_title: "Iatrogenic angioedema associated with ACEi, sitagliptin, and deficiency of 3 enzymes catabolizing bradykinin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A case is described of Angiotensin converting enzyme inhibitor (ACEi) and sitagliptin induced angioedema, where AO attacks decreased after the withdrawal of lisinopril but resolved only after the withdrawal of sitagliptin, an inhibitor of dipeptylpeptidase IV."
    explanation: >-
      Withdrawal resolved the attacks, which is the therapeutic claim. A single
      case, and the entry does not present it as more.
  notes: >-
    The binding is the generic pharmacotherapy action term because the intervention
    is stopping a drug rather than giving one, and NCIT has no clinical-action term
    for drug withdrawal that is reachable from Clinical Intervention or Procedure.
    The specificity is carried in the name and preferred_term instead.
- name: Icatibant
  description: >-
    A bradykinin B2 receptor antagonist, given on demand for severe episodes in
    three of the four reported families. It is the one pharmacological treatment
    here that acts directly on a node in this entry's pathograph: the persisting
    kinin cannot be cleared, so the receptor it acts on is blocked instead.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: icatibant
      term:
        id: CHEBI:68556
        label: icatibant
  target_mechanisms:
  - target: Persistence of B2 Receptor Kinins
    description: >-
      Antagonises the receptor the uncleaved kinin is acting on, which is the
      node itself rather than a downstream consequence of it.
  target_phenotypes:
  - preferred_term: Angioedema
    term:
      id: HP:0100665
      label: Angioedema
  evidence:
  - reference: PMID:38445235
    reference_title: "Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptoms were relieved by 3 g/d tranexamic acid and 10 mg/d montelukast, and on-demand icatibant in case of severe episodes."
    explanation: >-
      On-demand use for severe episodes in family B. The sentence names three
      agents given together, so it supports the regimen rather than isolating
      icatibant's contribution.
  - reference: PMID:38445235
    reference_title: "Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptom relief was observed after taking 3 g/d tranexamic acid and on-demand icatibant."
    explanation: >-
      The same combination in an unrelated family, which is what makes this a
      reproduced observation rather than one family's regimen.
  notes: >-
    Uncontrolled observations in a case series, and always alongside tranexamic
    acid, so no source here separates the effect of one agent from the other.
- name: Tranexamic acid prophylaxis
  description: >-
    The prophylactic backbone across the reported families: 3 g per day, with
    symptom relief in families A and B. Mechanistically it is a plasmin
    inhibitor, so it acts on the contact-system input to kinin generation rather
    than on the catabolic defect this disease actually has - it reduces how much
    bradykinin is made because the enzyme that should remove it is missing.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tranexamic acid
      term:
        id: CHEBI:48669
        label: tranexamic acid
  target_mechanisms:
  - target: Persistence of B2 Receptor Kinins
    description: >-
      Reduces kinin generation upstream. It does not restore carboxypeptidase N
      activity, so the node is relieved rather than corrected.
  evidence:
  - reference: PMID:38445235
    reference_title: "Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her mother I.2 and her brother II.2 were also symptomatic for angioedema, with symptom relief after taking 3 g/d tranexamic acid."
    explanation: >-
      Response in two further affected relatives, which is the closest this
      series comes to a within-family replication.
  - reference: PMID:38445235
    reference_title: "Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptom relief was observed after taking 3 g/d tranexamic acid and on-demand icatibant."
    explanation: "The proband's response, at the same dose."
  notes: >-
    Recorded as the most frequently used prophylactic agent in the series. The
    dose is consistent at 3 g/d across families; efficacy is by patient report
    in an uncontrolled series.
- name: Montelukast
  description: >-
    A leukotriene receptor antagonist added in family B alongside tranexamic
    acid. Leukotrienes are mast-cell mediators, so this targets the same arm the
    H1 antihistamine failed on - which is worth noting rather than assuming the
    arm is therapeutically dead.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: montelukast
      term:
        id: CHEBI:50730
        label: montelukast
  target_mechanisms:
  - target: Mast Cell Histamine Release
    description: >-
      Blocks the leukotriene mediators released alongside histamine, rather than
      histamine itself.
  evidence:
  - reference: PMID:38445235
    reference_title: "Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptoms were relieved by 3 g/d tranexamic acid and 10 mg/d montelukast, and on-demand icatibant in case of severe episodes."
    explanation: >-
      Used as part of the regimen in family B. The quote gives the dose and the
      co-administered agents; it does not isolate montelukast's contribution.
  notes: >-
    Reported in one family only, always in combination. Recorded because it is
    part of the regimen that worked where antihistamines did not, not because
    there is evidence it worked on its own.
- name: Antihistamine therapy
  description: >-
    Aimed at the mast-cell arm, and the evidence cuts both ways. The rationale is
    the elevated attack-time plasma histamine in the index patient and the
    antihistamine rescue in the Cpn1-null mouse. Against it, H1 antihistamines at
    maximal dose failed in the four reported families - which is what the
    bradykinin arm of the mechanism predicts, since nothing an H1 blocker does
    touches a B2-receptor ligand. Both results are recorded below.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antihistamine pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: histamine H1 receptor antagonist
      term:
        id: NCIT:C29578
        label: Histamine-1 Receptor Antagonist
  target_mechanisms:
  - target: Mast Cell Histamine Release
    description: >-
      Blocks the receptor for the mediator released by the persisting anaphylatoxin.
  evidence:
  - reference: PMID:19414808
    reference_title: "Targeted disruption of the gene encoding the murine small subunit of carboxypeptidase N (CPN1) causes susceptibility to C5a anaphylatoxin-mediated shock."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This C5a-induced mortality was reduced to 20% when CPN1(-/-) mice were treated with an antihistamine before C5a challenge."
    explanation: >-
      The mouse rescue. Recorded as model-organism evidence rather than as
      clinical support, and note the human result below runs the other way.
  - reference: PMID:38445235
    reference_title: "Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "H1 antihistamines, even at the highest dose (20 mg/d desloratadine), failed to relieve symptoms."
    explanation: >-
      Human treatment failure at maximal dose, against the claim that
      antihistamines treat this disease. This is the more relevant evidence of
      the two: the mouse experiment tests an acute C5a challenge, whereas this
      tests the spontaneous attacks patients actually have.
  notes: >-
    Retained rather than deleted because the two results answer different
    questions and both are worth a reader's attention: the mouse shows histamine
    is a necessary mediator of acute anaphylatoxin-driven lethality, and the
    human series shows blocking H1 does not control the clinical syndrome. Read
    together they argue the bradykinin arm dominates the phenotype, which is why
    the B2-receptor antagonist below is the treatment with an actual response.
diagnosis:
- name: Plasma carboxypeptidase N activity assay
  description: >-
    The diagnosis is biochemical first. Activity is reported against the
    laboratory's own median, and the reported patients fall between about a fifth
    and a half of it. Because the deficiency is partial and often latent, it is
    found by measuring it in someone with unexplained angioedema rather than by
    suspecting it up front.
  diagnosis_term:
    preferred_term: plasma carboxypeptidase N activity measurement
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:7437116
    reference_title: "Familial carboxypeptidase N deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 172 sera from patients with chronic urticaria or angioedema, one had a remarkably depressed carboxypeptidase N level (21% of normal)."
    explanation: >-
      The assay applied as a screen in the target population, and its yield.
  notes: >-
    NCIT has no carboxypeptidase N measurement term reachable from Clinical
    Intervention or Procedure, so the binding is the laboratory-procedure
    ancestor and the specific assay is carried in preferred_term.
- name: CPN1 sequencing
  description: >-
    Molecular confirmation, and the step that distinguishes a genetic deficiency
    from an acquired low level. Acquired depression of the enzyme is real: one of
    the 103 disease controls in the original survey had a low value in the setting
    of cirrhosis.
  diagnosis_term:
    preferred_term: CPN1 gene sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:38445235
    reference_title: "Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 3 variants of the CPN1 gene encoding the catalytic 55-kDa subunit of CPN: c.533G>A, c.582A>G, and c.734C>T."
    explanation: >-
      Sequencing is what produced the molecular diagnosis in these families.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than ten families have been reported: the index family from 1980 and its
    later molecular characterization, four unrelated families in 2024, and one
    iatrogenic case. No prevalence or incidence estimate exists and none is
    attempted. The only denominator-bearing figure in the literature is a screen of
    172 sera from patients already selected for chronic urticaria or angioedema,
    which found one case; that is a yield in an enriched population, not a
    population prevalence.
  evidence:
  - reference: PMID:7437116
    reference_title: "Familial carboxypeptidase N deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 172 sera from patients with chronic urticaria or angioedema, one had a remarkably depressed carboxypeptidase N level (21% of normal)."
    explanation: >-
      The single denominator-bearing observation available, quoted for scale and
      explicitly not as a prevalence estimate.
discussions:
- discussion_id: partial_deficiency_causality
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is partial carboxypeptidase N deficiency sufficient to cause angioedema on its
    own, or is it a susceptibility factor that requires a second hit to the
    bradykinin-disposal system?
  attaches_to:
  - pathophysiology#Reduced Plasma Carboxypeptidase N Activity
  - environmental#Angiotensin-converting-enzyme inhibitor and dipeptidyl-peptidase-4 inhibitor exposure
  rationale: >-
    Every reported human genotype is hypomorphic, retaining a fifth to a half of
    normal activity, and the one case with the best-documented temporal
    relationship became symptomatic only when two other bradykinin-degrading
    enzymes were also inhibited and remitted when they were released. Meanwhile the
    original index family had frequent spontaneous attacks with no such trigger
    recorded. The entry models the deficiency as causative because the four-family
    series reports segregation with symptoms, but the alternative reading, that it
    is a permissive background, is not excluded by anything published. No dose-response
    relationship between residual activity and attack frequency has been reported,
    which is the observation that would settle it.
- discussion_id: mitochondrial_cpn1_relevance
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the intracellular and mitochondrial pool of carboxypeptidase N contribute
    anything to the human disease?
  attaches_to:
  - pathophysiology#Biallelic CPN1 Loss of Function
  rationale: >-
    A mitochondrial pool of the enzyme has been described with substrates and
    consequences entirely unlike the plasma pool. Nothing in the reported human
    phenotype points to it, and no patient has been assessed for a cardiac or
    metabolic phenotype, so this entry models only the plasma enzyme. The gap is
    recorded because the omission is a decision, not an oversight: if the reported
    alleles also impair the intracellular pool, the disease description here is
    incomplete rather than wrong.

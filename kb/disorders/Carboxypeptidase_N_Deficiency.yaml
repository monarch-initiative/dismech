genetic:
- name: CPN1
  gene_term:
    preferred_term: CPN1
    term:
      id: hgnc:2312
      label: CPN1
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    CPN1 encodes the catalytic subunit. The original case carried a frameshift (historically 385fsInsG) and p.Gly178Asp.
    The 2024 families include homozygous p.Gly178Asp and compound heterozygosity involving p.Thr245Met or synonymous
    p.Glu194=. The proposed splice effect of p.Glu194= is computational, without patient RNA confirmation. The 2024
    authors report conflicting interpretation of p.Gly178Asp in ClinVar versus their segregation-based assessment;
    in-silico predictions are not equivalent to experimental proof. Heterozygous p.Thr245Met segregated with symptoms
    in one 2025 family. Variant-specific functional effects, penetrance and possible modifier contributions remain
    unresolved.
  evidence:
  - reference: PMID:12560874
    reference_title: DNA polymorphism and mutations in CPN1, including the genomic basis of carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In the genomic DNA of the proband, we discovered three CPN1 variants: (1) 385fsInsG, a frameshift mutation in exon 1 due to a single G insertion at nucleotide 385'
    explanation: >-
      Identifies a molecular finding, rather than quoting the paper's historical statement that no variants were
      previously known.
  - reference: PMID:38445235
    reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CPN1 gene variants are associated with CPN deficiency and HAE-nC1-INH symptoms in 4 unrelated families.
    explanation: >-
      Independent replication of the gene-disease relationship in four families.
  - reference: PMID:38445235
    reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: is predicted to affect splicing by activation of a cryptic exon acceptor site
    explanation: >-
      The proposed p.Glu194= splice effect is a computational prediction.
  - reference: url:https://www.jstage.jst.go.jp/article/allergolint/74/3/74_479/_pdf
    reference_title: Dominant inheritance in hereditary angioedema associated with carboxypeptidase N deficiency

experimental_models:
- name: Purified CPN treatment of U937 cells
  experimental_model_type: CELL_LINE
  cell_source: Immortalized human monocytoid U937 cells
  publication: PMID:7593646
  description: >-
    Purified plasma CPN reduced plasminogen binding to U937 cells; enzyme inhibition reversed the effect. The study
    also compared plasma carboxypeptidase B and whole-blood clot lysis.
  modeled_mechanisms:
  - target: Enhanced cell-surface plasminogen binding
    relationship: PERTURBS
    model_scale: CELLULAR
    description: >-
      Adding active enzyme decreases binding, the inverse of the proposed effect of deficiency.
    limitations: >-
      Neither patient-derived cells nor a CPN1-deficient cellular genotype was studied. Enhanced binding and kinin
      generation in patients were not measured. CPN did not reduce tPA-induced whole-blood clot lysis in the parallel
      assay.
    evidence:
    - reference: PMID:7593646
      reference_title: Plasma carboxypeptidases as regulators of the plasminogen system.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Purified carboxypeptidase N, which is constitutively active, and plasma carboxypeptidase B, which circulates as a zymogen, were both capable of significantly reducing plasminogen binding to cells.
      explanation: >-
        Purified CPN reduced cell-surface plasminogen binding. This supplies an inverse perturbation supporting
        the deficiency hypothesis, not a patient-derived disease model.
    - reference: PMID:7593646
      reference_title: Plasma carboxypeptidases as regulators of the plasminogen system.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Furthermore, plasma carboxypeptidase B, but not carboxypeptidase N, reduced the rate of whole blood clot lysis induced by tissue-type plasminogen activator.
      explanation: >-
        Separates the cell-binding result from the negative CPN clot-lysis experiment.

name: Carboxypeptidase N Deficiency
creation_date: "2026-09-11T12:30:00Z"
category: Mendelian
synonyms:
- CPN deficiency
- kininase I deficiency
- CPN1 deficiency
- hereditary angioedema with normal C1 inhibitor due to carboxypeptidase N deficiency
- HAE-CPN
description: >-
  Carboxypeptidase N deficiency is a recessive loss of the plasma zinc
  metallocarboxypeptidase that terminates the action of several potent vasoactive
  peptides at once. Carboxypeptidase N is made in the liver and circulates as a
  tetramer of two catalytic subunits, encoded by CPN1, and two large subunits that
  shield them from clearance. Its chemistry is minimal and its consequences are
  not: it removes a single C-terminal arginine or lysine, and that one residue is
  what distinguishes an active mediator from an inert des-Arg fragment. Its
  substrates include the complement anaphylatoxins C3a, C4a and C5a, bradykinin
  and kallidin.

  The disease is therefore a catabolic failure rather than an overproduction
  state, which is what separates it from the rest of hereditary angioedema.
  Bradykinin persists and keeps signalling at the endothelial B2 receptor;
  C5a persists and keeps signalling at C5aR on mast cells. Both converge on
  increased microvascular permeability, which is why affected people have deep
  subcutaneous and submucosal angioedema and superficial urticarial wheals
  together, rather than the textbook either/or.

  Two things about this entry are worth stating plainly. Only a handful of
  families have been reported, all of them with partial rather than absolute
  enzyme loss, so almost every human claim here rests on small numbers; the one
  complete-deficiency dataset is the Cpn1-null mouse, and it is recorded as
  model-organism evidence. And the deficiency is clinically latent until
  something else removes a parallel route of bradykinin disposal, which is why
  the angiotensin-converting-enzyme-inhibitor interaction is curated as an
  environmental factor rather than as a footnote.

  No pathophysiology node declares conforms_to. kb/modules/complement_dysregulation
  was read and rejected as a target: that module is built around unrestrained
  alternative-pathway amplification and terminal-pathway assembly, whereas the
  lesion here leaves complement activation itself normal and removes only the
  downstream inactivation of the anaphylatoxins it releases. Asserting conformance
  would claim a mechanism this disease does not have.
disease_term:
  preferred_term: carboxypeptidase N deficiency
  term:
    id: MONDO:0008910
    label: carboxypeptidase N deficiency
parents:
- Hereditary angioedema with normal C1 inhibitor
- Inborn error of metabolism
inheritance:
- name: Autosomal Recessive
  description: >-
    Segregation in the index family was consistent with autosomal recessive
    inheritance of the low enzyme level. Reported probands have been compound
    heterozygous rather than homozygous for null alleles, and the partial enzyme
    activity that results is the usual biochemical picture.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:7437116
    reference_title: "Familial carboxypeptidase N deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband's sister had an equally depressed serum carboxypeptidase N level, and studies of other family members suggested an autosomal recessive inheritance of the enzyme deficiency."
    explanation: >-
      Family segregation of the enzyme level, which is what the recessive
      assignment rests on.
pathophysiology:
- name: Biallelic CPN1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Variants in CPN1, which encodes the 55-kDa catalytic subunit, reduce the amount
    or the activity of that subunit. Reported alleles include a frameshift in exon
    1 and missense substitutions at conserved residues; probands carry two of them
    in trans rather than a single homozygous null.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: COMPOUND_HETEROZYGOUS
  evidence:
  - reference: PMID:12560874
    reference_title: "DNA polymorphism and mutations in CPN1, including the genomic basis of carboxypeptidase N deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the genomic DNA of the proband, we discovered three CPN1 variants: (1) 385fsInsG, a frameshift mutation in exon 1 due to a single G insertion at nucleotide 385"
    explanation: >-
      The first molecular lesion identified in a biochemically documented case,
      establishing CPN1 as the affected gene.
  - reference: PMID:38445235
    reference_title: "Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 3 variants of the CPN1 gene encoding the catalytic 55-kDa subunit of CPN: c.533G>A, c.582A>G, and c.734C>T."
    explanation: >-
      Three further alleles in four unrelated families, which is what moved CPN1
      from a single reported genotype to a reproducible one.
  downstream:
  - target: Reduced Plasma Carboxypeptidase N Activity
    causal_link_type: DIRECT
    description: >-
      The catalytic subunit is the enzyme; reducing it reduces measured plasma
      activity.
    evidence:
    - reference: PMID:38445235
      reference_title: "Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "CPN1 gene variants are associated with CPN deficiency and HAE-nC1-INH symptoms in 4 unrelated families."
      explanation: >-
        States the genotype-to-enzyme-activity step directly, in four families
        rather than one.
- name: Reduced Plasma Carboxypeptidase N Activity
  biological_scale: MOLECULAR
  description: >-
    Plasma carboxypeptidase N activity falls to roughly a fifth to a half of the
    reference median. The enzyme removes a single C-terminal arginine or lysine,
    so the loss is not of a degradative pathway but of the one step that converts
    an active mediator into an inactive des-Arg form.
  molecular_functions:
  - preferred_term: plasma carboxypeptidase N catalytic activity
    modifier: DECREASED
    term:
      id: GO:0004181
      label: metallocarboxypeptidase activity
  evidence:
  - reference: PMID:14687935
    reference_title: "Carboxypeptidase N: a pleiotropic regulator of inflammation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CPN cleaves carboxy-terminal arginines and lysines from peptides found in the bloodstream such as complement anaphylatoxins, kinins, and creatine kinase MM (CK-MM)."
    explanation: >-
      Defines the reaction that is lost. Cited to a review because the substrate
      range is a synthesis across several primary studies rather than one result.
  - reference: PMID:7437116
    reference_title: "Familial carboxypeptidase N deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inactivation of C3a and lysyl-bradykinin by his serum was markedly prolonged."
    explanation: >-
      The functional consequence measured directly in patient serum, rather than
      inferred from the enzyme level.
  downstream:
  - target: Persistence of Active Anaphylatoxins
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:7437116
      reference_title: "Familial carboxypeptidase N deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Carboxypeptidase N is a serum metalloenzyme that inactivates C3a, C4a, C5a, bradykinin, kalladin, and fibrinopeptides."
      explanation: >-
        Names the anaphylatoxins among the substrates whose inactivation the
        enzyme performs, which is the step this edge asserts is lost.
  - target: Persistence of B2 Receptor Kinins
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38445235
      reference_title: "Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "with subsequent transformation of kinin B2 receptor ligands into B1 receptor ligands"
      explanation: >-
        Describes the conversion the enzyme normally performs. Without it, the
        kinin stays a B2-receptor ligand, which is the claim this edge makes.
- name: Persistence of Active Anaphylatoxins
  biological_scale: MOLECULAR
  description: >-
    C3a, C4a and C5a are released normally, but are not converted to their des-Arg
    forms, so they go on signalling. The mouse data single out C5a: hypersensitivity
    to complement-driven shock in the Cpn1-null animal is abolished by removing the
    C5a receptor and not by removing the C3a receptor.
  biological_processes:
  - preferred_term: inactivation of complement anaphylatoxins
    modifier: DECREASED
    term:
      id: GO:0043171
      label: peptide catabolic process
  evidence:
  - reference: PMID:19414808
    reference_title: "Targeted disruption of the gene encoding the murine small subunit of carboxypeptidase N (CPN1) causes susceptibility to C5a anaphylatoxin-mediated shock."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This hypersensitivity was completely resolved in CPN1(-/-)/C5aR(-/-) but not in CPN1(-/-)/C3aR(-/-) mice."
    explanation: >-
      Receptor epistasis identifying C5a, not C3a, as the anaphylatoxin whose
      persistence matters. This is the mouse; no equivalent human experiment exists.
  downstream:
  - target: Mast Cell Histamine Release
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19414808
      reference_title: "Targeted disruption of the gene encoding the murine small subunit of carboxypeptidase N (CPN1) causes susceptibility to C5a anaphylatoxin-mediated shock."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This C5a-induced mortality was reduced to 20% when CPN1(-/-) mice were treated with an antihistamine before C5a challenge."
      explanation: >-
        Antihistamine rescue places histamine downstream of the persisting C5a,
        which is the step this edge asserts.
- name: Persistence of B2 Receptor Kinins
  biological_scale: MOLECULAR
  description: >-
    Bradykinin and kallidin keep their C-terminal arginine and therefore keep
    activating the endothelial B2 receptor instead of being converted to
    B1-receptor des-Arg ligands. Bradykinin generation is not increased; only its
    disposal is impaired, and this is what makes the disease a distinct endotype
    within hereditary angioedema with normal C1 inhibitor.
  biological_processes:
  - preferred_term: bradykinin catabolic process
    modifier: DECREASED
    term:
      id: GO:0010815
      label: bradykinin catabolic process
  evidence:
  - reference: PMID:7437116
    reference_title: "Familial carboxypeptidase N deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inactivation of C3a and lysyl-bradykinin by his serum was markedly prolonged."
    explanation: >-
      Direct measurement of delayed kinin inactivation in the proband's own serum.
  downstream:
  - target: Increased Microvascular Permeability
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38445235
      reference_title: "Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "mice lacking carboxypeptidase B2 (CPB2), CPN, or both plasma carboxypeptidases have enhanced vascular permeability implicating CPN deficiency in angioedema."
      explanation: >-
        The permeability step demonstrated in plasma-carboxypeptidase-deficient
        mice. Quoted from the human paper's introduction, but the result it
        reports is a mouse experiment, which is why it is graded MODEL_ORGANISM.
- name: Mast Cell Histamine Release
  biological_scale: CELLULAR
  description: >-
    Persisting C5a acts on C5aR on mast cells and basophils and triggers
    degranulation. In the index patient plasma histamine rose during attacks while
    serotonin and kinin activity did not, which is the human counterpart of the
    mouse antihistamine rescue.
  cell_types:
  - preferred_term: dermal mast cell
    term:
      id: CL:0000097
      label: mast cell
  biological_processes:
  - preferred_term: mast cell degranulation
    modifier: INCREASED
    term:
      id: GO:0043303
      label: mast cell degranulation
  evidence:
  - reference: PMID:7437116
    reference_title: "Familial carboxypeptidase N deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma histamine was elevated during attacks, but serotonin and kinin activity were not."
    explanation: >-
      Attack-associated histamine release in the proband. Note the same sentence
      records that circulating kinin activity was not elevated, which is why the
      kinin arm of this entry is built on delayed inactivation rather than on
      measured kinin levels.
  downstream:
  - target: Increased Microvascular Permeability
    causal_link_type: DIRECT
    description: >-
      Histamine and the other granule mediators raise permeability in the
      superficial dermal microvasculature, which is the wheal.
- name: Increased Microvascular Permeability
  biological_scale: TISSUE
  description: >-
    The two arms converge here. B2-receptor signalling on endothelium widens
    interendothelial junctions in the deeper subcutaneous and submucosal
    vasculature, and mast-cell mediators do the same in the superficial dermis.
    Plasma extravasates, and where it does determines whether the lesion is
    angioedema or a wheal.
  biological_processes:
  - preferred_term: positive regulation of vascular permeability
    modifier: INCREASED
    term:
      id: GO:0043117
      label: positive regulation of vascular permeability
  evidence:
  - reference: PMID:38445235
    reference_title: "Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic CPN deficiency may contribute to bradykinin and anaphylatoxin accumulation, with synergistic effects in angioedema and urticarial symptoms."
    explanation: >-
      States the convergence of the two mediator arms on the same clinical
      endpoint, which is what this node represents. The authors' own hedge
      ("may contribute") is preserved rather than strengthened.
  downstream:
  - target: Angioedema
    causal_link_type: DIRECT
  - target: Urticaria
    causal_link_type: DIRECT
phenotypes:
- category: Immunologic
  name: Angioedema
  description: >-
    Recurrent, non-pitting deep swelling of subcutaneous and submucosal tissue,
    predominantly of the face and lips. Attacks are episodic and can be very
    frequent; the index patient averaged about forty a year over eleven years.
  phenotype_term:
    preferred_term: Angioedema
    term:
      id: HP:0100665
      label: Angioedema
    temporality: RECURRENT
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:7437116
    reference_title: "Familial carboxypeptidase N deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient with a remarkably low carboxypeptidase N level was a 65-year-old man with an 11-year history of episodic angioedema occurring about 40 times per year."
    explanation: >-
      Establishes the phenotype and its attack frequency in the index case.
  - reference: PMID:38445235
    reference_title: "Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients presented with angioedema and urticaria, mainly on face/lips, but also with abdominal pain or laryngeal symptoms."
    explanation: >-
      Confirms the phenotype and its distribution across four further families.
- category: Dermatologic
  name: Urticaria
  description: >-
    Superficial wheals accompanying the angioedema. Their presence is diagnostically
    awkward, because urticaria is conventionally read as histamine-mediated and
    angioedema as bradykinin-mediated; here both mediators accumulate at once.
  phenotype_term:
    preferred_term: Urticaria
    term:
      id: HP:0001025
      label: Urticaria
  frequency: FREQUENT

- name: Enhanced cell-surface plasminogen binding
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Reduced CPN cleavage of terminal lysines could preserve cell-surface plasminogen-binding sites. Purified CPN
    reduces plasminogen binding in vitro, but enhanced binding has not been demonstrated in affected patients. The
    same experiments did not show that CPN reduced whole-blood clot lysis; results for plasma carboxypeptidase B
    cannot be transferred to CPN.
  evidence:
  - reference: PMID:7593646
    reference_title: Plasma carboxypeptidases as regulators of the plasminogen system.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Plasma reduced plasminogen binding to cells, and this effect could be ascribed to the activity of the plasma carboxypeptidases.
    explanation: >-
      In-vitro basis for the proposed inverse effect of enzyme deficiency.
  downstream:
  - target: Increased kinin generation
    description: >-
      Greater cell-surface plasminogen binding could facilitate plasmin activation and downstream kallikrein-kinin
      activation. The proposed intermediates have not been directly quantified in CPN-deficient patients.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38445235
      reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Accordingly, it is tempting to speculate that when CPN activity is decreased in plasma, plasmin activity is likely to increase, leaving the KKS prone to rapid activation.
      explanation: >-
        The clinical paper explicitly presents this mechanism as speculation.
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
- name: Increased kinin generation
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Increased plasmin-dependent activation of the kallikrein-kinin system could augment kinin production in addition
    to impaired degradation. Increased high-molecular-weight kininogen cleavage was reported during an attack in
    one family, but this does not establish the proposed plasminogen mechanism.
  evidence:
  - reference: PMID:38445235
    reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: An increased proportion of high-molecular-weight kininogen was cleaved in samples from proband II.1 in family B collected during angioedema attack compared with sample obtained during the intercritical period (not shown).
    explanation: >-
      Patient observation consistent with increased kinin generation; the underlying mechanism and quantitative
      data were not shown.
  downstream:
  - target: Persistence of B2 Receptor Kinins
    description: >-
      Additional kinin production could increase ligand availability on a background of impaired catabolism.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38445235
      reference_title: Hereditary angioedema with normal C1 inhibitor associated with carboxypeptidase N deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: This scenario is compatible with our observation of high-molecular-weight kininogen cleavage in plasma during acute symptoms in patients’ plasma with low CPN activity (not shown), leading to bradykinin production.
      explanation: >-
        Compatibility with the proposed pathway is not direct demonstration of its intermediates.

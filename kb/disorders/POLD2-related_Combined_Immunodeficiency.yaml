- name: Combined Cellular and Humoral Immune Deficiency
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    The patient has low CD4+ T, B and NK cell counts, and his infections improved on
    immunoglobulin replacement, so both arms of adaptive immunity are affected. B-cell numbers are
    low but maturation looks largely intact, with class-switched B cells present and normal
    somatic hypermutation in IgA and IgG. The humoral deficit is therefore one of numbers, with
    likely loss of T-cell help, rather than a block in B-cell differentiation. The infection
    spectrum fits a combined defect: recurrent sinopulmonary bacterial infection with
    bronchiectasis, recurrent skin abscesses, and chronic molluscum contagiosum, a viral skin
    infection that needs T cells to clear it. PROVISIONAL because the step from lymphopenia to
    each infection is inferred from one patient, not measured.
  cell_types:
  - preferred_term: lymphocyte
    term:
      id: CL:0000542
      label: lymphocyte
  evidence:
  - reference: PMID:31449058
    reference_title: "Polymerase δ deficiency causes syndromic immunodeficiency with replicative stress."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Here, we report on 2 patients with biallelic mutations affecting the POLD1 and POLD2 subunits of polymerase δ, who presented with developmental defects and combined immunodeficiency (CID)."
    explanation: The authors' classification of both patients, the POLD2 patient included, as CID.
  - reference: PMID:31449058
    reference_title: "Polymerase δ deficiency causes syndromic immunodeficiency with replicative stress."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Despite a reduction in B cell numbers, we found that B cell maturation was largely normal, as judged by the presence of class-switched B cells (CD27+IgD–) (Supplemental Figure 1C) and normal somatic hypermutation (SHM) patterns in the IgA and IgG loci of P1"
    explanation: B-cell maturation preserved in the POLD2 patient despite low B-cell numbers.
  downstream:
  - target: Combined Immunodeficiency
    causal_link_type: DIRECT
  - target: Decreased B Cell Count
    causal_link_type: DIRECT
  - target: Reduced NK Cell Count
    causal_link_type: DIRECT
  - target: Recurrent Respiratory Infections
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Persistent Molluscum Contagiosum
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Recurrent Cutaneous Abscesses
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Syndromic Growth and Neurodevelopmental Features
  biological_scale: ORGANISM
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The patient has short stature and severe intellectual disability with speech impairment,
    attention deficit and hyperactivity. The authors propose that the same replication-stress
    mechanism behind the immunodeficiency also explains the neurodevelopmental abnormalities,
    since polymerase delta is needed by every dividing progenitor. No non-haematopoietic tissue
    was examined, and with one patient from a consanguineous family a second recessive cause
    cannot be excluded. The link is therefore recorded as HYPOTHETICAL. The POLD1 patient of the
    same series has short stature, microcephaly and low IQ, so the developmental features recur
    across the polymerase delta deficiencies.
  evidence:
  - reference: PMID:31449058
    reference_title: "Polymerase δ deficiency causes syndromic immunodeficiency with replicative stress."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Our results suggest that loss of polymerase δ leads to replication stress–associated immunodeficiency and neurodevelopmental abnormalities in this syndrome."
    explanation: >-
      The authors' proposed link between the cellular replication defect and the
      neurodevelopmental features. INDIRECT because the cellular work was done in fibroblasts and
      lymphocytes, not neural cells.
  downstream:
  - target: Short Stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Severe Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hyperactivity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

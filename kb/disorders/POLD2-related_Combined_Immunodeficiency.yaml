discussions:
- discussion_id: pold2_cid_single_patient_syndrome
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do the short stature and severe intellectual disability belong to POLD2 deficiency itself, or
    do they need another explanation, given that the entity rests on one patient from a
    consanguineous family?
  rationale: >-
    The immune half of the phenotype has functional support in the patient's own cells: reduced
    complex, slowed S phase, replication lesions and poor T-cell proliferation, all reversed by
    wild-type POLD2 where rescue was tested. The developmental half has none. No neural or growth
    tissue was studied. A consanguineous family carries other homozygous regions, any of which could
    hold a second recessive cause. The argument for
    attribution is that the POLD1 patient of the same series also has short stature and
    intellectual impairment, and that the POLD3 deficiency carries neurodevelopmental delay. A
    second POLD2 family, or a hypomorphic Pold2 animal model, is what would settle it.
  attaches_to:
  - pathophysiology#Syndromic Growth and Neurodevelopmental Features
  - phenotypes#Short Stature
  - phenotypes#Severe Intellectual Disability
  evidence:
  - reference: PMID:31449058
    reference_title: "Polymerase δ deficiency causes syndromic immunodeficiency with replicative stress."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Our results suggest that loss of polymerase δ leads to replication stress–associated immunodeficiency and neurodevelopmental abnormalities in this syndrome."
    explanation: >-
      The authors put the neurodevelopmental link as a suggestion. Their cellular data come from
      fibroblasts and lymphocytes.
- discussion_id: pold2_cid_cancer_risk
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Does POLD2 deficiency predispose to cancer, through replication-associated DNA damage or
    through the T-cell defect?
  rationale: >-
    The patient's cells carry steady-state DNA lesions, and T-cell immunodeficiency on its own
    raises cancer risk through weak antitumour and antiviral immunity. Against that, the patient
    had no malignancy at 17, and DNA repair after exogenous damage was preserved. The authors
    recommend close monitoring for neoplasia and say a reliable estimate needs larger cohorts and
    longer follow-up. With one patient, no estimate is possible.
  attaches_to:
  - pathophysiology#Replication Stress and Replication-Associated DNA Lesions
  evidence:
  - reference: PMID:31449058
    reference_title: "Polymerase δ deficiency causes syndromic immunodeficiency with replicative stress."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "No malignant transformation has been detected in the patients described here"
    explanation: The observed absence of malignancy, the only outcome data available.
notes: >-
  Scope and lump/split. This entry covers POLD2 only. MONDO places POLD2-related combined
  immunodeficiency (MONDO:1010175) as its own term under non-severe combined immunodeficiency
  due to polymerase delta deficiency (MONDO:0800145), next to the POLD1 and POLD3 forms, which
  are curated separately as Immunodeficiency_120 and Immunodeficiency_122. The three share a
  mechanism, reduced polymerase delta output limiting lymphocyte proliferation. They differ in
  how the output is reduced, and POLD1 also has allele classes for cancer predisposition and
  MDPL that POLD2 lacks, so a separate entry follows the existing pattern.

  Patient attribution. The source paper (PMID:31449058) describes two patients: P1 with
  homozygous POLD2 p.Asp293Asn and P2 with compound heterozygous POLD1 variants. Only P1 belongs
  here. Every phenotype snippet names P1 or is the P1-specific sentence. Where a sentence covers
  both patients (reduced subunit expression, reduced T-cell proliferation), the explanation says
  so. P2's warts, microcephaly and hearing impairment are not recorded here.

  Frequencies. With a single patient no frequency band is set; each phenotype's notes field
  records "1 of 1 published patient".

  IUIS classification is left unset. The source does not place the disease in an IUIS table, and
  the sibling entries disagree (IMD120 uses combined immunodeficiency, IMD122 the syndromic
  table).

  GeneReviews baseline: `just check-genereviews` reports no GeneReviews or StatPearls chapter for
  this disease against the committed Bookshelf index. No Orphanet record for POLD2 deficiency was
  found in references_cache.

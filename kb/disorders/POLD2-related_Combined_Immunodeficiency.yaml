- name: Destabilisation of the Polymerase Delta Complex
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    POLD2 is the structural hub of polymerase delta, contacting both POLD1 and POLD3. The
    p.Asp293Asn protein is turned over faster than wild type, and the patient's stimulated
    lymphocytes and fibroblasts carry markedly reduced POLD1, POLD2 and POLD3 protein despite
    normal mRNA. The loss is in the amount of enzyme, not its quality: a complex assembled with
    the mutant subunit kept normal polymerase activity in a primer-extension assay. The cell
    therefore has less polymerase delta activity in total, which is what the decreased
    DNA-directed DNA polymerase activity below records. Re-expressing wild-type POLD2 in the
    patient's fibroblasts restored POLD1 and POLD3 levels, which places the instability on the
    POLD2 variant.

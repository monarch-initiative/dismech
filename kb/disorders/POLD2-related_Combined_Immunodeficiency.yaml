- name: Reduced Replication Origin Firing and Slowed S-Phase Progression
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    In the patient's fibroblasts, synchronised cells moved through S phase more slowly than
    control cells. DNA fibre analysis showed fewer new origin firing events and a faster fork
    speed. Faster forks are read as compensation for the reduced origin firing, the pattern also
    seen in GINS1 and polymerase epsilon deficiency. The authors attribute it to a rate-limiting
    amount of an essential replisome component.

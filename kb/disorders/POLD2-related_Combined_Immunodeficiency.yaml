- name: Replication Stress and Replication-Associated DNA Lesions
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Under unchallenged conditions the patient's fibroblasts show ATR checkpoint activation
    (CHK1 Ser345 and RPA Ser33 phosphorylation), about three times as many gamma-H2AX foci as
    controls, more RAD51 foci, and more 53BP1 nuclear bodies in G1. The G1 bodies mark
    under-replicated DNA carried into the next cell cycle. Re-expressing wild-type POLD2 cleared
    the G1 53BP1 bodies, which establishes that the POLD2 variant causes them. This is
    replication-derived damage. When the fibroblasts were challenged with a panel of genotoxic
    agents they were not hypersensitive, so the repair functions of polymerase delta are
    preserved at the reduced dose.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: DNA damage checkpoint signaling
    term:
      id: GO:0000077
      label: DNA damage checkpoint signaling
    modifier: INCREASED
  - preferred_term: DNA damage response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: INCREASED
  evidence:
  - reference: PMID:31449058
    reference_title: "Polymerase δ deficiency causes syndromic immunodeficiency with replicative stress."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "CHK1 phosphorylation on Ser345 could be strongly induced by the replication inhibitor hydroxyurea, but it was already apparent under basal conditions in P1 primary fibroblasts (Figure 4A), indicating persistent replication stress and checkpoint activation in P1 cells at steady state."
    explanation: Checkpoint activation at steady state in the POLD2 patient's fibroblasts.
  - reference: PMID:31449058
    reference_title: "Polymerase δ deficiency causes syndromic immunodeficiency with replicative stress."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Strikingly, in P1 fibroblasts, the average number of γ-H2AX foci per nucleus was increased to 18 as compared with 6 in healthy control cells under unchallenged, steady-state conditions"
    explanation: Increased double-strand-break foci without exogenous damage.
  - reference: PMID:31449058

name: POLD2-related Combined Immunodeficiency
category: Mendelian
creation_date: "2026-10-13T00:00:00Z"
synonyms:
- POLD2-related combined immunodeficiency
- Polymerase D2 deficiency
- POLD2 deficiency
- combined immunodeficiency due to POLD2 deficiency
disease_term:
  preferred_term: POLD2-related combined immunodeficiency
  term:
    id: MONDO:1010175
    label: POLD2-related combined immunodeficiency
description: >-
  POLD2-related combined immunodeficiency is the syndromic combined immunodeficiency caused by a
  biallelic hypomorphic variant in POLD2, the structural accessory subunit of DNA polymerase
  delta. One patient is published: P1 of the 2019 series that first described human polymerase
  delta deficiency, a boy from a consanguineous family homozygous for p.Asp293Asn in the POLD2
  phosphodiesterase domain.

  POLD2 is the scaffold of the polymerase delta heterotetramer, contacting both the catalytic
  subunit POLD1 and the accessory subunit POLD3. The p.Asp293Asn protein is unstable and binds
  POLD1 and POLD3 poorly, so the patient's cells carry less of all three subunits, although the
  mutant complex keeps normal polymerase activity when assembled in vitro. The disease therefore
  follows from too little polymerase delta, not from a less active enzyme. That separates it
  from the POLD1 form (IMD120), where the compound heterozygous alleles lower catalytic activity
  with the complex intact.

  Less polymerase delta limits replication origin firing and slows progression through S phase.
  The patient's fibroblasts show persistent replication stress with checkpoint activation at
  steady state, increased double-strand-break foci and 53BP1 nuclear bodies in G1, all of which
  were reversed by re-expressing wild-type POLD2. Repair of exogenous DNA damage was preserved.
  Lymphocytes, which must expand rapidly on demand, show the clearest functional failure: T
  cells from the patient proliferate poorly after stimulation and most remain in G1.

  Clinically the patient had recurrent respiratory infections from infancy leading to
  bronchiectasis by six months, chronic facial molluscum contagiosum, recurrent skin abscesses,
  CD4+ T, B and NK cell lymphopenia, short stature and severe intellectual disability with
  speech impairment, attention deficit and hyperactivity. Intravenous immunoglobulin with
  antibacterial and antifungal prophylaxis reduced the infections.
parents:
- Combined Immunodeficiency
- Inborn Errors of Immunity

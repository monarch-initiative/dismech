inheritance:
- name: Autosomal recessive inheritance
  description: >-
    The single patient is homozygous and the child of consanguineous parents, and the variant
    segregates with autosomal recessive inheritance in the family. The population genetics agree:
    POLD2 has a low pLI and a high pRec, so loss of one allele is predicted to be tolerated and
    loss of both is not.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:31449058
    reference_title: "Polymerase δ deficiency causes syndromic immunodeficiency with replicative stress."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Genetic analysis of P1 by exome sequencing revealed a homozygous missense variant (p.Asp293Asn; combined annotation–dependent depletion [CADD] score of 28.1) in the POLD2 gene (NM_006230), which displayed perfect segregation under the assumption of autosomal-recessive inheritance"
    explanation: >-
      Homozygosity and family segregation consistent with recessive inheritance in the one
      published POLD2 family.
  - reference: PMID:31449058
    reference_title: "Polymerase δ deficiency causes syndromic immunodeficiency with replicative stress."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    quote_role: PRIMARY_RESULT
    snippet: "Both genes show low pLI scores of 0.001 and 0.044, respectively, indicating a predicted tolerance to the loss of a single allele, and high pRec scores of 0.998 and 0.950, respectively, indicating a predicted high intolerance for a complete loss of function"
    explanation: >-
      The second value in each pair (pLI 0.044, pRec 0.950) is POLD2's. The constraint scores
      predict a recessive gene, which agrees with the observed inheritance. Graded COMPUTATIONAL
      because the claim rests on population-database constraint metrics, not on the family.
pathophysiology:
- name: Biallelic Hypomorphic POLD2 Variant
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    One genotype is published: homozygous missense p.Asp293Asn (NM_006230) in
    the POLD2 phosphodiesterase domain, absent from ExAC and 1000 Genomes. Structural modelling
    on the POLD2-POLD3 crystal structure predicts loss of a polar contact with Arg240. No null
    allele has been seen, and none is expected: POLD2 is essential in yeast and in mammalian cell
    screens, so a viable patient's allele must be hypomorphic.
  genes:
  - preferred_term: POLD2
    term:
      id: hgnc:9176
      label: POLD2
  genetic_context:
    genes:
    - preferred_term: POLD2
      term:
        id: hgnc:9176
        label: POLD2
    allele_type: missense variant (p.Asp293Asn) in the phosphodiesterase domain
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    notes: >-
      PARTIAL_LOSS_OF_FUNCTION because the mutant protein is unstable and binds its partners
      poorly but is not catalytically dead: a complex assembled with it in vitro retained normal
      polymerase activity.
  evidence:

      Repair of exogenous damage is preserved, so the lesions on this node come from
      replication, not from a repair defect.
  downstream:
  - target: Impaired T Cell Proliferation
    causal_link_type: DIRECT
- name: Impaired T Cell Proliferation
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The patient's T cells responded poorly to anti-CD3, anti-CD28, PHA and PMA-ionomycin, and
    after 48 hours of TCR stimulation most remained in G1. Activation markers (CD25, CD95) were
    upregulated normally and ERK phosphorylation was intact, so TCR signalling works and the
    defect lies in the replication the cells need to divide. The result held in in-vitro-expanded
    T cells, which excludes the patient's expanded TEMRA CD8+ population as the explanation.
    Expanded T cells also carried more 53BP1 foci than controls.

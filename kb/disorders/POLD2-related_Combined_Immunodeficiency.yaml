    query `POLD2[tiab] AND (immunodeficiency OR biallelic)`, run in October 2026, returned four
    records: PMID:31449058, PMID:31629014 (POLD1), PMID:37030525 and PMID:38099988 (both POLD3).
    None adds a POLD2 patient. The OpenScientist deep-research report committed with this entry
    (research/POLD2-related_Combined_Immunodeficiency-deep-research-openscientist.md) also found
    no second POLD2 case and describes the evidence as essentially a single index patient. No
    population estimate exists, so rate_per_100000 is left unset.

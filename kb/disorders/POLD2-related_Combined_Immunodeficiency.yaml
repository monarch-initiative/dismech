progression:
- phase: Infantile-onset recurrent infection
  notes: >-
    Recurrent respiratory infections began in infancy, with bronchiectasis by six months, chronic
    molluscum from three years and skin abscesses from five years. Short stature and severe
    intellectual disability were recognised at four years.
  evidence:
  - reference: PMID:31449058
    reference_title: "Polymerase δ deficiency causes syndromic immunodeficiency with replicative stress."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Patient 1 (P1), a 17-year-old male born to consanguineous parents, presented with recurrent upper and lower respiratory tract infections as frequently as 2 to 3 times per month, leading to bronchiectasis since the age of 6 months."
    explanation: Infantile onset of the infection phenotype.
- phase: Response to immunoglobulin replacement and prophylaxis
  notes: >-
    From seven years of age, immunoglobulin replacement with antibacterial and antifungal
    prophylaxis reduced respiratory infections and skin abscesses. The patient was 17 when
    reported, with no malignancy.
  evidence:
  - reference: PMID:31449058
    reference_title: "Polymerase δ deficiency causes syndromic immunodeficiency with replicative stress."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "After starting on regular intravenous Ig (IVIG) replacement, prophylactic antibiotic, and antifungal (trimethoprim-sulfamethoxazole and itraconazole) therapy at 7 years of age, he experienced a reduction in the number of episodes of respiratory infections and skin abscesses."
    explanation: The treated course in the POLD2 patient.
genetic:
- name: POLD2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: POLD2
    term:
      id: hgnc:9176
      label: POLD2
  notes: >-
    The causal gene, encoding the non-catalytic scaffold subunit of DNA polymerase delta. One
    homozygous missense allele (p.Asp293Asn) is published, and it destabilises the protein and
    its complex partners. The authors note that no POLD2 variant had previously been associated
    with human disease and that functionally validated somatic POLD2 variants are absent from
    COSMIC. POLD2 therefore lacks the dominant cancer-predisposition and MDPL allele classes that
    POLD1 has. The causal assignment rests on one family plus functional rescue (wild-type POLD2
    restored the complex and cleared the DNA lesions in patient fibroblasts). No ClinGen
    gene-disease validity classification was found, so gene_disease_validity is left unset.
  evidence:
  - reference: PMID:31449058
    reference_title: "Polymerase δ deficiency causes syndromic immunodeficiency with replicative stress."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Overexpression of POLD2 in P1 fibroblasts led to stabilization of the polymerase δ subunits POLD1 and POLD3 (Supplemental Figure 5B) and rescued the G1 53BP1 foci"
    explanation: Functional rescue by wild-type POLD2, the strongest single argument for causality.
  - reference: PMID:31449058
    reference_title: "Polymerase δ deficiency causes syndromic immunodeficiency with replicative stress."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The specific function of the POLD2 subunit has been poorly explored, despite its central structural role in interacting with both POLD1 and POLD3"
    explanation: >-
      POLD2's structural role in the complex, from this paper's introduction (hence BACKGROUND).
      This is the function the variant disrupts.

  title: "Silicosis."
has_subtypes:
- name: Chronic Silicosis
  display_name: Chronic (Simple) Silicosis
  description: >-
    The classic form, developing after 10-30 years of relatively low-level
    exposure. Characterized by small (<10 mm) rounded upper-zone nodules
    (simple nodular silicosis) that may coalesce into progressive massive
    fibrosis (complicated silicosis / conglomerate masses >10 mm).
- name: Accelerated Silicosis
  description: >-
    Develops 5-10 years after heavier exposure, with more rapid radiographic
    and functional progression than chronic silicosis. Increasingly reported in
    engineered-stone fabrication workers.
- name: Acute Silicosis
  display_name: Acute Silicosis (Silicoproteinosis)
  description: >-
    Develops within weeks to a few years of intense exposure to fine silica.
    Characterized histologically by alveolar filling with lipoproteinaceous
    material resembling pulmonary alveolar proteinosis (silicoproteinosis),
    rapidly progressive dyspnea, and high mortality.
pathophysiology:
- name: Alveolar Macrophage Uptake of Silica and Lysosomal Rupture
  description: >-
    Respirable crystalline silica particles (aerodynamic diameter <10 microns)
    deposit in the distal airways and alveoli, where they are phagocytosed by
    alveolar macrophages. The reactive silanol-rich particle surface damages the
    phagolysosomal membrane, causing lysosomal destabilization, cathepsin B
    release, and generation of reactive oxygen species. This is the initiating
    lesion of silicosis.
  role: trigger
  locations:
  - preferred_term: pulmonary alveolus
    term:
      id: UBERON:0002299
      label: alveolus of lung
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: phagocytosis
    term:
      id: GO:0006909
      label: phagocytosis
    modifier: INCREASED
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:18604214
    reference_title: "Silica crystals and aluminum salts activate the NALP3 inflammasome through phagosomal destabilization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      NALP3 activation required phagocytosis of crystals, and this uptake
      subsequently led to lysosomal damage and rupture.
    explanation: >-
      Establishes that alveolar/macrophage phagocytosis of silica crystals
      causes lysosomal (phagolysosomal) damage and rupture — the initiating
      cellular lesion of silicosis.
  - reference: PMID:18604214
    reference_title: "Silica crystals and aluminum salts activate the NALP3 inflammasome through phagosomal destabilization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      inhibition of either phagosomal acidification or cathepsin B activity
      impaired NALP3 activation.
    explanation: >-
      Implicates cathepsin B released on phagolysosomal rupture as the link
      between lysosomal damage and downstream inflammasome activation.
  downstream:
  - target: NLRP3 Inflammasome Activation and IL-1beta Release
- name: NLRP3 Inflammasome Activation and IL-1beta Release
  description: >-
    Lysosomal damage and cathepsin release trigger assembly of the NLRP3
    inflammasome in silica-laden macrophages, activating caspase-1, which cleaves
    pro-IL-1beta and pro-IL-18 into their active forms. Secreted IL-1beta and
    IL-18 drive recruitment of neutrophils and monocytes and amplify a chronic
    inflammatory response in the lung.
  role: driver
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: NLRP3 inflammasome complex assembly
    term:
      id: GO:0044546
      label: NLRP3 inflammasome complex assembly
    modifier: INCREASED
  - preferred_term: interleukin-1 beta production
    term:
      id: GO:0032611
      label: interleukin-1 beta production
    modifier: INCREASED
  evidence:
  - reference: PMID:18577586
    reference_title: "The Nalp3 inflammasome is essential for the development of silicosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Stimulation of macrophages with silica results in the activation of
      caspase-1 in a Nalp3-dependent manner. Macrophages deficient in components
      of the Nalp3 inflammasome were incapable of secreting the proinflammatory
      cytokines interleukin (IL)-1beta and IL-18 in response to silica.
    explanation: >-
      Directly demonstrates the NLRP3(Nalp3)-inflammasome/caspase-1 axis driving
      IL-1beta and IL-18 secretion in silica-exposed macrophages.
  - reference: PMID:18604214
    reference_title: "Silica crystals and aluminum salts activate the NALP3 inflammasome through phagosomal destabilization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      silica and aluminum salt crystals activated inflammasomes formed by the
      cytoplasmic receptor NALP3.
    explanation: >-
      Confirms crystalline silica as a direct activator of the NALP3(NLRP3)
      inflammasome.
  downstream:
  - target: Macrophage Death and Perpetuation of Inflammation
- name: Macrophage Death and Perpetuation of Inflammation
  description: >-
    Silica is cytotoxic to macrophages; dying macrophages release their silica
    load, which is re-phagocytosed by newly recruited macrophages, establishing a
    self-perpetuating cycle of cell death, re-uptake, and sustained inflammatory
    signaling that continues even after exposure ends. This "frustrated
    phagocytosis" underlies the progressive nature of silicosis.
  role: driver
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: macrophage apoptotic process
    term:
      id: GO:0071888
      label: macrophage apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:18604214
    reference_title: "Silica crystals and aluminum salts activate the NALP3 inflammasome through phagosomal destabilization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      silica crystal uptake can initiate apoptotic cell death with concomitant
      release of ingested silica particles, which are re-engulfed by other
      alveolar macrophages inducing a cycle of sustained inflammation
    explanation: >-
      Directly supports the "frustrated phagocytosis" cycle — silica-induced
      macrophage death releases silica that is re-engulfed by other macrophages,
      perpetuating inflammation.
  - reference: PMID:22534002
    reference_title: "Silicosis."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Impairment of lung function increases with disease progression, even after
      the patient is no longer exposed.
    explanation: >-
      Indirect clinical correlate of the self-perpetuating cycle — disease
      progresses after exposure ends — but does not itself demonstrate macrophage
      death or re-uptake. Evidence source OTHER (review); marked PARTIAL.
  downstream:
  - target: Alveolar Macrophage Uptake of Silica and Lysosomal Rupture
  - target: Fibroblast Activation and Silicotic Nodule Formation
- name: Fibroblast Activation and Silicotic Nodule Formation
  description: >-
    Sustained release of pro-fibrotic mediators (TGF-beta, PDGF, TNF-alpha)
    from activated macrophages recruits and activates fibroblasts, which
    differentiate into collagen-secreting myofibroblasts. Excess deposition of
    type I and III collagen produces the pathognomonic silicotic nodule — a
    concentric, whorled, hyalinized collagen nodule containing birefringent
    silica particles — and, when nodules coalesce, progressive massive fibrosis.
  role: central_effector
  conforms_to: "fibrotic_response#Mesenchymal Cell Activation"
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  cell_types:

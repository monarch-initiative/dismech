name: Silicosis
creation_date: "2026-07-16T00:00:00Z"
category: Environmental Lung Disease
parents:
- Pneumoconiosis
- Occupational Lung Disease
disease_term:
  preferred_term: silicosis
  term:
    id: MONDO:0005960
    label: silicosis
description: >-
  Silicosis is a fibrotic lung disease (pneumoconiosis) caused by the inhalation
  of respirable crystalline silica dust, most commonly quartz. It is one of the
  oldest recognized occupational diseases, historically affecting miners,
  quarry and foundry workers, sandblasters, and stonemasons; a contemporary
  epidemic is driven by the fabrication of engineered ("artificial") stone
  benchtops, which have a very high crystalline-silica content. Inhaled silica
  particles that reach the alveoli are phagocytosed by alveolar macrophages,
  destabilize the phagolysosome, and activate the NLRP3 inflammasome, driving a
  self-perpetuating cycle of macrophage death, re-uptake of silica, chronic
  inflammation, and fibroblast activation. The characteristic lesion is the
  silicotic nodule — a whorled, hyalinized collagen nodule containing birefringent
  silica particles, with upper-lobe predominance. Disease presents along a
  spectrum: chronic simple silicosis (after 10-30 years of exposure), accelerated
  silicosis (5-10 years), and acute silicosis / silicoproteinosis (after intense
  exposure over months to a few years). Nodules can coalesce into progressive
  massive fibrosis. Silica exposure also raises the risk of tuberculosis
  (silicotuberculosis), lung cancer, chronic obstructive pulmonary disease,
  chronic kidney disease, and autoimmune disease. There is no curative therapy;
  management is supportive and prevention through dust control is paramount.
classifications:
  harrisons_chapter:
  - classification_value: RESPIRATORY
  ilo_disease_category:
  - classification_value: pneumoconiosis_from_fibrogenic_mineral_dust
    notes: >-
      ILO List of Occupational Diseases (revised 2010), item 2.1.1
      "Pneumoconioses caused by fibrogenic mineral dust (silicosis,
      anthraco-silicosis, asbestosis)" — silicosis is named in the item text.
      Silicosis is occupational by definition, so unlike asthma or COPD there is
      no non-occupational form this assignment could over-claim.
  - classification_value: silicotuberculosis
    notes: >-
      ILO item 2.1.2 "Silicotuberculosis", listed separately from 2.1.1. Applies
      to the entry's silicotuberculosis presentation; silicosis markedly
      increases tuberculosis risk, and the ILO list treats the combination as a
      distinct recognised item.
  eu_occupational_category:
  - classification_value: silicosis
    notes: >-
      European schedule of occupational diseases (Commission Recommendation
      2003/670/EC as amended), Annex I item 301.11 "Silicosis", under chapter 3
      (diseases caused by inhalation). The European schedule is finer-grained
      here than the ILO list, which folds silicosis and asbestosis into the
      single item 2.1.1.
  - classification_value: silicosis_combined_pulmonary_tuberculosis
    notes: >-
      Annex I item 301.12 "Silicosis combined with pulmonary tuberculosis",
      the European counterpart of ILO item 2.1.2.
references:
- reference: PMID:22534002
  title: "Silicosis."
has_subtypes:
- name: Chronic Silicosis
  display_name: Chronic (Simple) Silicosis
  description: >-
    The classic and most common form, following prolonged relatively low-level
    exposure and usually appearing 10–30 years after first exposure.
    Characterized by small rounded upper-zone nodules (simple nodular
    silicosis) that may coalesce into progressive massive fibrosis (complicated
    silicosis / conglomerate masses). The three silicosis forms are separated by
    exposure intensity and time from exposure to symptom onset.
  evidence:
  - reference: PMID:25191413
    reference_title: "Silicosis among Stone- Cutter Workers: A Cross-Sectional Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "According to the intensity of exposures and onset of initiation of clinical symptoms silicosis is classified into three groups of acute, chronic and accelerated forms."
    explanation: "Sources the three-way subtype division used here, and the two axes (exposure intensity and time to symptom onset) that separate the forms."
  - reference: PMID:30053129
    reference_title: "A case of accelerated silicosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Silicosis, caused by inhaling dust containing free crystalline silica, typically has a chronic course, with the numbers of silicosis patients declining globally."
    explanation: "Confirms the chronic course as the typical form against which the accelerated and acute forms are the rarer exceptions."
  - reference: PMID:25191413
    reference_title: "Silicosis among Stone- Cutter Workers: A Cross-Sectional Study."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Chronic simple silicosis (resulting from long-term exposure to relatively low concentrations of silica dust and also usually appearing 10-30 years after first exposure)"
    explanation: Defines the standard chronic-silicosis exposure pattern and 10–30-year latency window.
- name: Accelerated Silicosis
  description: >-
    Follows higher-concentration exposure and conventionally develops 5–10 years
    after first exposure. A histologically confirmed case after roughly two years
    of very intense unprotected sandblasting illustrates an unusually fast extreme,
    rather than defining the subtype. Accelerated disease has correspondingly rapid
    radiographic and functional progression and a poor prognosis. Increasingly
    reported in engineered-stone fabrication workers.
  evidence:
  - reference: PMID:25191413
    reference_title: "Silicosis among Stone- Cutter Workers: A Cross-Sectional Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "According to the intensity of exposures and onset of initiation of clinical symptoms silicosis is classified into three groups of acute, chronic and accelerated forms."
    explanation: "Sources the three-way subtype division used here, and the two axes (exposure intensity and time to symptom onset) that separate the forms."
  - reference: PMID:30053129
    reference_title: "A case of accelerated silicosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The condition resulted from ~2 years of very intense exposure without appropriate personal protective equipment while sandblasting."
    explanation: "Histologically confirmed accelerated silicosis after only two years of very intense exposure, illustrating a fast extreme beyond the conventional 5–10-year window."
  - reference: PMID:25191413
    reference_title: "Silicosis among Stone- Cutter Workers: A Cross-Sectional Study."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "accelerated silicosis that develops 5–10 years after first exposure to higher concentrations of silica dust"
    explanation: Defines accelerated silicosis by higher exposure intensity and the standard 5–10-year latency window.
  - reference: PMID:30053129
    reference_title: "A case of accelerated silicosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The case demonstrates a rare but largely preventable disease with serious health effects and a poor prognosis."
    explanation: "Supports the rarity and poor prognosis of the accelerated form."
- name: Acute Silicosis
  display_name: Acute Silicosis (Silicoproteinosis)
  description: >-
    The rarest form, developing a few weeks to five years after intense exposure
    to fine silica. Characterized histologically by alveolar filling with
    lipoproteinaceous material resembling pulmonary alveolar proteinosis
    (silicoproteinosis), rapidly progressive dyspnea, and high mortality. Note
    that the silicoproteinosis histology and mortality claims rest on the wider
    clinical literature rather than on a source curated in this entry.
  evidence:
  - reference: PMID:25191413
    reference_title: "Silicosis among Stone- Cutter Workers: A Cross-Sectional Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "According to the intensity of exposures and onset of initiation of clinical symptoms silicosis is classified into three groups of acute, chronic and accelerated forms."
    explanation: "Sources the three-way subtype division used here, and the two axes (exposure intensity and time to symptom onset) that separate the forms."
  - reference: PMID:30053129
    reference_title: "A case of accelerated silicosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Much rarer are the acute and subacute forms."
    explanation: "Supports the rarity of the acute form relative to chronic silicosis; does not itself document the silicoproteinosis histology."
  - reference: PMID:25191413
    reference_title: "Silicosis among Stone- Cutter Workers: A Cross-Sectional Study."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "acute silicosis that develops a few weeks to five years after exposure to high concentrations of repairable silica dust"
    explanation: Defines acute silicosis by high-intensity exposure and a latency of weeks to five years.
pathophysiology:
- name: Alveolar Macrophage Phagocytosis of Respirable Silica
  description: >-
    Respirable crystalline silica particles (aerodynamic diameter <10 microns)
    deposit in the terminal bronchioles and alveoli, where they are recognized
    and internalized by alveolar macrophages via scavenger receptors. This
    uptake is the initiating event of silicosis.
  role: trigger
  locations:
  - preferred_term: pulmonary alveolus
    term:
      id: UBERON:0002299
      label: alveolus of lung
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: phagocytosis
    term:
      id: GO:0006909
      label: phagocytosis
    modifier: INCREASED
  downstream:
  - target: Phagolysosomal Membrane Rupture and Cathepsin B Release
  - target: Reactive Oxygen Species Generation
  evidence:
  - reference: PMID:18604214
    reference_title: "Silica crystals and aluminum salts activate the NALP3 inflammasome through phagosomal destabilization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      NALP3 activation required phagocytosis of crystals, and this uptake
      subsequently led to lysosomal damage and rupture.
    explanation: >-
      Establishes phagocytic uptake of silica crystals as the required first
      step that leads on to lysosomal damage.
- name: Phagolysosomal Membrane Rupture and Cathepsin B Release
  description: >-
    The reactive silanol-rich surface of internalized silica damages the
    phagolysosomal membrane, causing lysosomal destabilization and rupture with
    leakage of the protease cathepsin B into the cytosol.
  role: driver
  conforms_to: "nlrp3_inflammasome_activation#Activating Danger Signal"
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  downstream:
  - target: NLRP3 Inflammasome Assembly and Caspase-1 Activation
  evidence:
  - reference: PMID:18604214
    reference_title: "Silica crystals and aluminum salts activate the NALP3 inflammasome through phagosomal destabilization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      inhibition of either phagosomal acidification or cathepsin B activity
      impaired NALP3 activation.
    explanation: >-
      Implicates phagolysosomal acidification and released cathepsin B as the
      link between lysosomal rupture and downstream inflammasome activation.
- name: Reactive Oxygen Species Generation
  description: >-
    Silica surface radicals and mitochondrial dysfunction in silica-laden
    macrophages generate reactive oxygen species, which (together with potassium
    efflux) provide a second signal for inflammasome activation.
  role: driver
  conforms_to: "nlrp3_inflammasome_activation#Activating Danger Signal"
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: response to reactive oxygen species
    term:
      id: GO:0000302
      label: response to reactive oxygen species
    modifier: INCREASED
  downstream:
  - target: NLRP3 Inflammasome Assembly and Caspase-1 Activation
  evidence:
  - reference: PMID:18577586
    reference_title: "The Nalp3 inflammasome is essential for the development of silicosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Activation of the Nalp3 inflammasome by silica required both an efflux of
      intracellular potassium and the generation of reactive oxygen species.
    explanation: >-
      Demonstrates reactive oxygen species (with potassium efflux) as a required
      signal for silica-induced NLRP3 inflammasome activation.
- name: NLRP3 Inflammasome Assembly and Caspase-1 Activation
  description: >-
    Lysosomal rupture/cathepsin B and reactive oxygen species converge to drive
    assembly of the NLRP3-ASC-caspase-1 inflammasome in silica-laden macrophages,
    activating caspase-1.
  role: driver
  conforms_to: "nlrp3_inflammasome_activation#NLRP3 Inflammasome Assembly and Caspase-1 Activation"
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: NLRP3 inflammasome complex assembly
    term:
      id: GO:0044546
      label: NLRP3 inflammasome complex assembly
    modifier: INCREASED
  downstream:
  - target: IL-1beta and IL-18 Maturation and Secretion
  - target: Macrophage Pyroptosis and Silica Re-uptake
  evidence:
  - reference: PMID:18604214
    reference_title: "Silica crystals and aluminum salts activate the NALP3 inflammasome through phagosomal destabilization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      silica and aluminum salt crystals activated inflammasomes formed by the
      cytoplasmic receptor NALP3.
    explanation: >-
      Confirms crystalline silica as a direct activator of the NALP3(NLRP3)
      inflammasome.
  - reference: PMID:18577586
    reference_title: "The Nalp3 inflammasome is essential for the development of silicosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Stimulation of macrophages with silica results in the activation of
      caspase-1 in a Nalp3-dependent manner.
    explanation: >-
      Demonstrates NLRP3(Nalp3)-dependent caspase-1 activation on silica
      stimulation of macrophages.
- name: IL-1beta and IL-18 Maturation and Secretion
  description: >-
    Active caspase-1 cleaves pro-IL-1beta and pro-IL-18 into their mature forms,
    which are secreted to drive the downstream inflammatory response.
  role: driver
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: interleukin-1 beta production
    term:
      id: GO:0032611
      label: interleukin-1 beta production
    modifier: INCREASED
  downstream:
  - target: Neutrophilic Alveolitis and Inflammatory Amplification
  evidence:
  - reference: PMID:18577586
    reference_title: "The Nalp3 inflammasome is essential for the development of silicosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Macrophages deficient in components of the Nalp3 inflammasome were
      incapable of secreting the proinflammatory cytokines interleukin (IL)-1beta
      and IL-18 in response to silica.
    explanation: >-
      Shows NLRP3(Nalp3)-inflammasome-dependent secretion of mature IL-1beta and
      IL-18 in silica-exposed macrophages.
- name: Macrophage Pyroptosis and Silica Re-uptake
  description: >-
    Silica is cytotoxic to macrophages, triggering inflammatory cell death
    (pyroptosis/apoptosis). Dying macrophages release their silica load, which is
    re-engulfed by newly recruited macrophages — a self-perpetuating "frustrated
    phagocytosis" cycle that sustains inflammation even after exposure ends.
  role: driver
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: pyroptotic inflammatory response
    term:
      id: GO:0070269
      label: pyroptotic inflammatory response
    modifier: INCREASED
  - preferred_term: macrophage apoptotic process
    term:
      id: GO:0071888
      label: macrophage apoptotic process
    modifier: INCREASED
  downstream:
  - target: Alveolar Macrophage Phagocytosis of Respirable Silica
  - target: Neutrophilic Alveolitis and Inflammatory Amplification
  evidence:
  - reference: PMID:18604214
    reference_title: "Silica crystals and aluminum salts activate the NALP3 inflammasome through phagosomal destabilization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      silica crystal uptake can initiate apoptotic cell death with concomitant
      release of ingested silica particles, which are re-engulfed by other
      alveolar macrophages inducing a cycle of sustained inflammation
    explanation: >-
      Directly supports the frustrated-phagocytosis cycle — silica-induced
      macrophage death releases silica that is re-engulfed, perpetuating
      inflammation.
  - reference: PMID:22534002
    reference_title: "Silicosis."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Impairment of lung function increases with disease progression, even after
      the patient is no longer exposed.
    explanation: >-
      Indirect clinical correlate — disease progresses after exposure ends — but
      does not itself demonstrate macrophage death or re-uptake. Evidence source
      OTHER (review); marked PARTIAL.
- name: Neutrophilic Alveolitis and Inflammatory Amplification
  description: >-
    Secreted IL-1beta, IL-18, TNF-alpha, and chemokines recruit neutrophils and
    monocytes into the alveolar space, amplifying a chronic inflammatory response
    (alveolitis) that drives the transition to fibrosis.
  role: driver
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: neutrophil chemotaxis
    term:
      id: GO:0030593
      label: neutrophil chemotaxis
    modifier: INCREASED
  downstream:
  - target: Fibroblast-to-Myofibroblast Activation
  evidence:
  - reference: PMID:22534002
    reference_title: "Silicosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Phagocytosis of crystalline silica in the lung causes lysosomal damage,
      activating the NALP3 inflammasome and triggering the inflammatory cascade
      with subsequent fibrosis.
    explanation: >-
      Places the inflammatory cascade between inflammasome activation and
      fibrosis in the silicosis pathway. Evidence source OTHER (review).
- name: Fibroblast-to-Myofibroblast Activation
  description: >-
    Pro-fibrotic mediators (TGF-beta, PDGF, TNF-alpha) released by activated
    macrophages recruit and activate lung fibroblasts, driving their
    differentiation into collagen-secreting myofibroblasts — the central
    effector step of silicotic fibrosis.
  role: central_effector
  conforms_to: "fibrotic_response#Mesenchymal Cell Activation"
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  biological_processes:
  - preferred_term: TGF-beta receptor signaling
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: INCREASED
  downstream:
  - target: Excess Collagen Deposition and Silicotic Nodule Formation
  evidence:
  - reference: PMID:18577586
    reference_title: "The Nalp3 inflammasome is essential for the development of silicosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the inflammatory response and subsequent development of pulmonary fibrosis
      after inhalation of silica is dependent on the Nalp3 inflammasome.
    explanation: >-
      In vivo mouse evidence that the inflammasome-driven inflammatory response
      is required for the pulmonary fibrosis produced by fibroblast activation.
      Evidence source MODEL_ORGANISM (murine inhalation model).
- name: Excess Collagen Deposition and Silicotic Nodule Formation
  description: >-
    Activated myofibroblasts deposit excess type I and III collagen and other
    extracellular matrix, producing the pathognomonic silicotic nodule — a
    concentric, whorled, hyalinized collagen nodule containing birefringent
    silica particles — that coalesces into progressive massive fibrosis.
  role: effector
  conforms_to: "fibrotic_response#Excessive ECM Deposition"
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  cell_types:
  - preferred_term: myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  biological_processes:
  - preferred_term: collagen biosynthetic process
    term:
      id: GO:0032964
      label: collagen biosynthetic process
    modifier: INCREASED
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  evidence:
  - reference: PMID:22534002
    reference_title: "Silicosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Phagocytosis of crystalline silica in the lung causes lysosomal damage,
      activating the NALP3 inflammasome and triggering the inflammatory cascade
      with subsequent fibrosis.
    explanation: >-
      Supports fibrosis (excess ECM/collagen deposition) as the terminal outcome
      of the silicosis cascade. Evidence source OTHER (review).
environmental:
- name: Occupational Respirable Crystalline Silica Exposure
  exposure_term:
    preferred_term: exposure to respirable crystalline silica
    term:
      id: ECTO:7000030
      label: exposure to silica dust
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
      notes: >-
        Respirable crystalline silica is a mineral dust, classified as a
        chemical agent in the occupational-hygiene scheme (ILO section 1.1 /
        European schedule chapter 1), not as a physical agent.
    exposure_route:
    - classification_value: INHALATION
      notes: >-
        Only the respirable fraction reaching the alveoli is pathogenic; the
        route is what defines the exposure, hence "respirable" in the name.
    exposure_duration:
    - classification_value: CHRONIC
      notes: >-
        ATSDR chronic duration (365 days and longer), matching classic chronic
        silicosis after 10-30 years of exposure. Accelerated and acute silicosis
        follow INTERMEDIATE-duration heavy exposure, as in engineered-stone
        benchtop work.
    - classification_value: INTERMEDIATE
      notes: >-
        ATSDR intermediate duration (15-364 days), the exposure pattern behind
        acute silicosis/silicoproteinosis and the accelerated form driving the
        contemporary engineered-stone epidemic.
    iarc_carcinogen_group:
      classification_value: GROUP_1
      notes: >-
        IARC classifies crystalline silica dust in the form of quartz or
        cristobalite as Group 1, carcinogenic to humans (lung cancer). This is a
        hazard identification about the agent; the lung-cancer risk it refers to
        is a separate outcome from silicosis itself, though the two share the
        exposure. Silicosis is not a cancer.
    ghs_health_hazard_class:
    - classification_value: STOT_REPEATED_EXPOSURE
      notes: >-
        Silicosis is the archetypal specific target organ toxicity from repeated
        exposure — a non-lethal, organ-specific effect (lung) accumulating over
        prolonged exposure rather than an acute toxic response.
    exposome_domain:
    - classification_value: SPECIFIC_EXTERNAL
      notes: >-
        An identifiable individual-level occupational agent, in Wild's specific
        external domain rather than the general external environment.
  notes: >-
    Silicosis is caused by inhalation of respirable crystalline silica (quartz,
    cristobalite, tridymite). Classic high-risk work includes hard-rock mining,
    quarrying, tunneling, sandblasting, foundry work, ceramics, and stone
    masonry. A contemporary epidemic of accelerated and acute silicosis is
    driven by cutting and polishing engineered (artificial) stone benchtops,
    which contain a much higher proportion of crystalline silica than natural
    stone.
  evidence:
  - reference: PMID:39134395
    reference_title: "Autoimmune diseases, autoantibody status and silicosis in a cohort of 1238 workers from the artificial stone benchtop industry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A modern epidemic of silicosis is emerging internationally, associated
      with dry processing of engineered stone with high (>90%) RCS content.
    explanation: >-
      Documents the contemporary engineered/artificial-stone exposure driving a
      resurgent silicosis epidemic, and the very high respirable crystalline
      silica (RCS) content of the material.
  influences_mechanisms:
  - target: Alveolar Macrophage Phagocytosis of Respirable Silica
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Dust-generating work liberates crystalline silica in the respirable size
      range, which is what reaches the terminal bronchioles and alveoli to be
      internalized by alveolar macrophages.
    evidence:
    - reference: PMID:39134395
      reference_title: "Autoimmune diseases, autoantibody status and silicosis in a cohort of 1238 workers from the artificial stone benchtop industry."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A modern epidemic of silicosis is emerging internationally, associated
        with dry processing of engineered stone with high (>90%) RCS content.
      explanation: >-
        Ties the occupational process to the respirable crystalline silica
        content of the dust generated, the particulate species the alveolar
        macrophage then phagocytoses.
genetic:
- name: TNF
  gene_term:
    preferred_term: TNF
    term:
      id: hgnc:11892
      label: TNF
  association: >-
    Host susceptibility/severity modifier — TNF-alpha promoter polymorphisms
    (notably -238A and -308A) are associated with predisposition to, and greater
    severity of, silicosis among silica-exposed workers. These are common
    regulatory variants that amplify the TNF-alpha-driven inflammatory response
    to inhaled silica; they modify risk but are neither necessary nor sufficient
    without exposure.
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:11874815
    reference_title: "Polymorphisms in the tumor necrosis factor-alpha gene promoter may predispose to severe silicosis in black South African miners."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Susceptibility to silicosis is in part genetically determined.
    explanation: >-
      Establishes a heritable host-susceptibility component layered on the
      obligate silica exposure.
  - reference: PMID:11874815
    reference_title: "Polymorphisms in the tumor necrosis factor-alpha gene promoter may predispose to severe silicosis in black South African miners."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      miners with severe silicosis were significantly more likely than controls
      to have -238A
    explanation: >-
      Case-control association of the TNF-alpha -238A promoter allele with severe
      silicosis in exposed miners.
  notes: >-
    Additional candidate susceptibility/modifier loci reported in the literature
    include IL1RN (IL-1 receptor antagonist), IL1B, IL6, and the
    glutathione-S-transferase detoxification genes (GSTM1/GSTT1/GSTP1); effects
    are modest and population-dependent. No genome-wide-significant common causal
    locus is established, consistent with silicosis being an environmentally
    caused disease with polygenic susceptibility modification.
phenotypes:
- category: Respiratory
  name: Dyspnea
  description: >-
    Progressive exertional breathlessness is the cardinal symptom, reflecting
    restrictive and/or obstructive impairment from fibrosis.
  phenotype_term:
    preferred_term: Dyspnea
    term:

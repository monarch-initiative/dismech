datasets:
- accession: geo:GSE264182
  title: Iron-induced oxidative stress alters the transcriptome of bronchoalveolar lavage cells in silicosis
  description: Elevated iron levels are observed in silicosis patients, leading alveolar macrophages to increase ferritin production in response to this cellular stress. Our study employed a multi-omic approach to investigate how excess iron/ferritin influences the molecular profile of bronchoalveolar lavage (BAL) cells. Thirty-one participants were included, with RNA sequencing conducted on BAL cells from stone benchtop industry workers diagnosed with simple or complicated silicosis, compared to a cohort with no disease. BAL fluid (BALF) was analysed using gas chromatography-mass spectrometry (GC-MS) to screen for 498 volatile organic compounds (VOCs).
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 19
  publication: PMID:39485079
  notes: Identified by GEO DataSets index search for Silicosis (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE288887
  title: Pulmonary osteoclast-like cells in silica induced pulmonary fibrosis
  description: The pathophysiology of silicosis is poorly understood, limiting development of therapies for those who have been exposed to the respirable particle. We explored mechanisms of silica-induced pulmonary fibrosis in human lung samples collected from patients with occupational exposure to silica and in a longitudinal mouse model of silicosis using multiple modalities including whole-lung single-cell RNA sequencing and histological, biochemical, and physiologic assessments.
  organism:

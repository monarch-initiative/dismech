  evidence:
  - reference: PMID:22534002
    reference_title: "Silicosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Phagocytosis of crystalline silica in the lung causes lysosomal damage,
      activating the NALP3 inflammasome and triggering the inflammatory cascade
      with subsequent fibrosis.
    explanation: >-
      Links the upstream lysosomal-damage/NLRP3 inflammatory cascade to the
      downstream fibrotic effector step modeled by this node. Evidence source
      OTHER as this is a review article.
  - reference: PMID:18577586
    reference_title: "The Nalp3 inflammasome is essential for the development of silicosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the inflammatory response and subsequent development of pulmonary fibrosis
      after inhalation of silica is dependent on the Nalp3 inflammasome.
    explanation: >-
      In vivo mouse silica-inhalation evidence that inflammasome-driven
      inflammation is required for the pulmonary fibrosis that produces silicotic
      nodules. Evidence source MODEL_ORGANISM (murine inhalation model).
environmental:
- name: Occupational Respirable Crystalline Silica Exposure
  notes: >-
    Silicosis is caused by inhalation of respirable crystalline silica (quartz,
    cristobalite, tridymite). Classic high-risk work includes hard-rock mining,
    quarrying, tunneling, sandblasting, foundry work, ceramics, and stone
    masonry. A contemporary epidemic of accelerated and acute silicosis is
    driven by cutting and polishing engineered (artificial) stone benchtops,
    which contain a much higher proportion of crystalline silica than natural
    stone.
  evidence:
  - reference: PMID:39134395
    reference_title: "Autoimmune diseases, autoantibody status and silicosis in a cohort of 1238 workers from the artificial stone benchtop industry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A modern epidemic of silicosis is emerging internationally, associated
      with dry processing of engineered stone with high (>90%) RCS content.
    explanation: >-
      Documents the contemporary engineered/artificial-stone exposure driving a
      resurgent silicosis epidemic, and the very high respirable crystalline
      silica (RCS) content of the material.
genetic:
- name: TNF
  gene_term:
    preferred_term: TNF
    term:
      id: hgnc:11892
      label: TNF
  association: >-
    Host susceptibility/severity modifier — TNF-alpha promoter polymorphisms
    (notably -238A and -308A) are associated with predisposition to, and greater
    severity of, silicosis among silica-exposed workers. These are common
    regulatory variants that amplify the TNF-alpha-driven inflammatory response
    to inhaled silica; they modify risk but are neither necessary nor sufficient
    without exposure.
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:11874815
    reference_title: "Polymorphisms in the tumor necrosis factor-alpha gene promoter may predispose to severe silicosis in black South African miners."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Susceptibility to silicosis is in part genetically determined.
    explanation: >-
      Establishes a heritable host-susceptibility component layered on the
      obligate silica exposure.
  - reference: PMID:11874815
    reference_title: "Polymorphisms in the tumor necrosis factor-alpha gene promoter may predispose to severe silicosis in black South African miners."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      miners with severe silicosis were significantly more likely than controls
      to have -238A
    explanation: >-
      Case-control association of the TNF-alpha -238A promoter allele with severe
      silicosis in exposed miners.
  notes: >-
    Additional candidate susceptibility/modifier loci reported in the literature
    include IL1RN (IL-1 receptor antagonist), IL1B, IL6, and the
    glutathione-S-transferase detoxification genes (GSTM1/GSTT1/GSTP1); effects
    are modest and population-dependent. No genome-wide-significant common causal
    locus is established, consistent with silicosis being an environmentally
    caused disease with polygenic susceptibility modification.
phenotypes:
- category: Respiratory
  name: Dyspnea
  description: >-
    Progressive exertional breathlessness is the cardinal symptom, reflecting
    restrictive and/or obstructive impairment from fibrosis.
  phenotype_term:
    preferred_term: Dyspnea
    term:
      id: HP:0002094
      label: Dyspnea
    clinical_course: PROGRESSIVE
- category: Respiratory
  name: Cough
  description: Chronic cough, often with sputum production.
  phenotype_term:
    preferred_term: Cough
    term:
      id: HP:0012735
      label: Cough
    temporality: CHRONIC
- category: Respiratory
  name: Pulmonary Fibrosis
  description: >-
    Nodular interstitial fibrosis with upper-lobe predominance; coalescence
    produces progressive massive fibrosis.
  phenotype_term:
    preferred_term: Pulmonary fibrosis
    term:
      id: HP:0002206
      label: Pulmonary fibrosis
  evidence:
  - reference: PMID:22534002
    reference_title: "Silicosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Silicosis is a fibrotic lung disease caused by inhalation of free
      crystalline silicon dioxide or silica.
    explanation: >-
      Establishes pulmonary fibrosis as the defining pathological phenotype of
      silicosis. Evidence source OTHER as this is a review article.
- category: Respiratory
  name: Restrictive Ventilatory Defect
  description: Reduced lung volumes on pulmonary function testing as fibrosis advances.
  phenotype_term:
    preferred_term: Restrictive ventilatory defect
    term:
      id: HP:0002091
      label: Restrictive ventilatory defect
  evidence:
  - reference: PMID:22534002
    reference_title: "Silicosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Impairment of lung function increases with disease progression, even after
      the patient is no longer exposed.
    explanation: >-
      Supports progressive impairment of lung function (restrictive/obstructive
      deterioration) as disease advances. Evidence source OTHER (review).
- category: Respiratory
  name: Respiratory Insufficiency
  description: End-stage disease progresses to respiratory failure and cor pulmonale.
  phenotype_term:
    preferred_term: Respiratory insufficiency
    term:
      id: HP:0002093
      label: Respiratory insufficiency
    clinical_course: PROGRESSIVE
- category: Immunological
  name: Increased Susceptibility to Tuberculosis
  description: >-
    Silica impairs alveolar-macrophage killing of Mycobacterium tuberculosis,
    markedly increasing the risk of active and latent tuberculosis
    (silicotuberculosis).
  phenotype_term:
    preferred_term: Pulmonary tuberculosis
    term:
      id: HP:0032262
      label: Pulmonary tuberculosis
  evidence:
  - reference: PMID:22534002
    reference_title: "Silicosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mycobacterial diseases, airway obstruction, and lung cancer are associated
      with silica dust exposure.
    explanation: >-
      Supports the established association of silica exposure with mycobacterial
      (tuberculous) disease. Evidence source OTHER (review).
  - reference: PMID:17439668
    reference_title: "Silica, silicosis and tuberculosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      silicosis and silica dust-associated tuberculosis (TB), in particular, are
      the two diseases that remain high on the list of occupational health
      priorities in low-income countries
    explanation: >-
      A dedicated silica-TB review highlighting the strong link between silica
      exposure/silicosis and tuberculosis. Evidence source OTHER (review).
- category: Neoplastic
  name: Increased Lung Cancer Risk
  description: >-
    Crystalline silica is an IARC Group 1 human carcinogen; silica exposure and
    silicosis increase the risk of lung cancer, with a synergistic effect from
    cigarette smoking.
  phenotype_term:
    preferred_term: Neoplasm of the lung
    term:
      id: HP:0100526
      label: Neoplasm of the lung
  evidence:
  - reference: PMID:22534002
    reference_title: "Silicosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mycobacterial diseases, airway obstruction, and lung cancer are associated
      with silica dust exposure.
    explanation: >-
      Supports the established association of silica dust exposure with lung
      cancer. Evidence source OTHER (review).
- category: Respiratory
  name: Airway Obstruction
  description: >-
    Silica exposure is associated with chronic airflow obstruction / COPD,
    contributing to a mixed obstructive-restrictive pattern especially with
    concurrent smoking.
  phenotype_term:
    preferred_term: Airway obstruction
    term:
      id: HP:0006536
      label: Airway obstruction
  evidence:
  - reference: PMID:22534002
    reference_title: "Silicosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mycobacterial diseases, airway obstruction, and lung cancer are associated
      with silica dust exposure.
    explanation: >-
      Supports the association of silica dust exposure with airway obstruction.
      Evidence source OTHER (review).
- category: Immunological
  name: Autoantibody Positivity and Connective-Tissue Disease Association
  description: >-
    Silica is a potent immune adjuvant; exposed workers show elevated rates of
    antinuclear and extractable-nuclear antibodies and increased risk of
    connective-tissue/autoimmune disease (rheumatoid arthritis and Caplan
    syndrome, systemic sclerosis, SLE, ANCA-associated vasculitis).
  phenotype_term:
    preferred_term: Antinuclear antibody positivity
    term:
      id: HP:0003493
      label: Antinuclear antibody positivity
  evidence:
  - reference: PMID:39134395
    reference_title: "Autoimmune diseases, autoantibody status and silicosis in a cohort of 1238 workers from the artificial stone benchtop industry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proportion of workers with detectable ANAs or ENAs was considerably
      higher than the 5%-9% expected in the general population
    explanation: >-
      Cohort evidence that silica-exposed (artificial-stone) workers have
      autoantibody (ANA/ENA) positivity above general-population baseline,
      supporting the silica-autoimmunity association.
treatments:
- name: Silica Exposure Cessation and Dust Control
  description: >-
    Removal from further silica exposure and workplace dust-control measures are
    the foundation of management and the only effective form of prevention.
  treatment_term:
    preferred_term: therapeutic avoidance of environmental exposure
    term:
      id: MAXO:0000053
      label: therapeutic avoidance of environmental exposure
- name: Supportive Care
  description: >-
    Oxygen therapy, pulmonary rehabilitation, bronchodilators, vaccination, and
    management of complications. No therapy reverses established fibrosis.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
  evidence:
  - reference: PMID:22534002
    reference_title: "Silicosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      As yet, no curative treatment exists, but comprehensive management
      strategies help to improve quality of life and slow deterioration.
    explanation: >-
      Establishes that management is supportive — no curative therapy exists.
      Evidence source OTHER (review).
- name: Whole-Lung Lavage
  description: >-
    Considered in acute silicosis/silicoproteinosis to remove alveolar
    lipoproteinaceous material and dust.
  treatment_term:
    preferred_term: therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
- name: Lung Transplantation
  description: Definitive option for end-stage silicosis with respiratory failure.
  treatment_term:
    preferred_term: organ transplantation
    term:
      id: MAXO:0010039
      label: organ transplantation
- name: Pirfenidone (Investigational Antifibrotic)
  description: >-
    Pirfenidone, an oral antifibrotic approved for idiopathic pulmonary
    fibrosis, is being investigated for silicosis on the rationale that
    silicosis shares TGF-beta-driven fibrogenic mechanisms with IPF. It is
    investigational and not yet standard-of-care for silicosis.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Fibroblast Activation and Silicotic Nodule Formation
    treatment_effect: INHIBITS
    description: >-
      Pirfenidone attenuates TGF-beta-driven fibroblast-to-myofibroblast
      activation and collagen deposition, targeting the fibrotic effector node.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pirfenidone
      term:
        id: CHEBI:32016
        label: pirfenidone
  evidence:
  - reference: clinicaltrials:NCT05118256
    reference_title: "An Open, Randomised, Controlled and Unicenter Clinical Trial to Assess the Efficiency of Pirfenidone for the Reduction of Pulmonary Metabolic, Inflammatory and Fibrogenic Activity in Patients With Silicosis Due to Artificial Stone and PMF"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we decide to study the efficacy of pirfenidone in reducing metabolic,
      inflammatory, and fibrogenic lung disease in patients with artificial
      stone silicosis and progressive massive fibrosis (PMF).
    explanation: >-
      A clinical trial evaluating pirfenidone specifically in artificial-stone
      silicosis with PMF, supporting its investigational antifibrotic use.

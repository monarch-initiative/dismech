  description: >-
    Open, randomised, controlled single-center trial assessing pirfenidone for
    reducing pulmonary metabolic, inflammatory, and fibrogenic activity in
    patients with artificial-stone silicosis and progressive massive fibrosis.
  target_phenotypes:
  - preferred_term: Pulmonary fibrosis
    term:
      id: HP:0002206
      label: Pulmonary fibrosis
  evidence:
  - reference: clinicaltrials:NCT05118256
    reference_title: "An Open, Randomised, Controlled and Unicenter Clinical Trial to Assess the Efficiency of Pirfenidone for the Reduction of Pulmonary Metabolic, Inflammatory and Fibrogenic Activity in Patients With Silicosis Due to Artificial Stone and PMF"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the moment, there is no curative treatment for the disease, and the
      only therapeutic option is lung transplantation
    explanation: >-
      The trial rationale confirms the absence of curative therapy and motivates
      investigating antifibrotic pirfenidone in silicosis/PMF.

discussions:
- discussion_id: kmt2e_catalytic_activity
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does KMT2E have intrinsic histone methyltransferase activity, and does any
    such activity matter for ODLURO?
  attaches_to:
  - pathophysiology#KMT2E Haploinsufficiency
  - pathophysiology#Altered H3K4 Methylation and Transcriptional Regulation
  rationale: >-
    KMT2E is named as a lysine methyltransferase, but the crystal structure of
    its SET domain shows missing key residues and an obstructing loop, and the
    purified domain had no activity on histones or H3 peptides. An earlier study
    reported H3K4 mono- and di-methyltransferase activity dependent on
    O-GlcNAcylation of the SET domain in a myeloid cell line. The entry
    therefore binds the PHD-finger reader function rather than methyltransferase
    activity, and treats any H3K4 methylation change as indirect.
  evidence:
  - reference: PMID:27812132
    reference_title: "The Human Mixed Lineage Leukemia 5 (MLL5), a Sequentially and Structurally Divergent SET Domain-Containing Protein with No Intrinsic Catalytic Activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Accordingly, we show that MLL5 is devoid of any in vitro methyltransferase
      activity on full-length histones and histone H3 peptides.
    explanation: Structural and biochemical evidence against intrinsic activity.
  - reference: PMID:19377461
    reference_title: "GlcNAcylation of a histone methyltransferase in retinoic-acid-induced granulopoiesis."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      GlcNAcylation at Thr 440 in the MLL5 SET domain evokes its H3K4 HKMT
      activity and co-activates RARalpha in target gene promoters.
    explanation: Reports modification-dependent H3K4 methyltransferase activity, contradicting the inactive-SET view.
- discussion_id: kmt2e_neural_chromatin_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What chromatin and transcriptional changes does heterozygous KMT2E loss
    cause in developing human neurons, and is there a KMT2E DNA methylation
    episignature?
  attaches_to:
  - pathophysiology#Altered H3K4 Methylation and Transcriptional Regulation
  rationale: >-
    Evidence for KMT2E's chromatin function comes from myoblasts, myeloid and
    cancer cell lines. No patient-derived neuronal model, brain transcriptome or
    blood episignature for ODLURO was found (the PubMed query "(KMT2E OR MLL5)
    AND (episignature OR DNA methylation signature)" returned no ODLURO study),
    so the link from reduced dosage to the neurodevelopmental phenotype is
    unmeasured and the conformed module's central transcriptional node is not
    declared.
  evidence:
  - reference: PMID:19264965
    reference_title: "MLL5, a trithorax homolog, indirectly regulates H3K4 methylation, represses cyclin A2 expression, and promotes myogenic differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We have examined the epigenetic mechanisms operating in conditional
      quiescence by analyzing the function of a predicted chromatin regulator
      mixed lineage leukemia 5 (MLL5) in a culture model of reversible arrest.
    explanation: The chromatin evidence used here comes from a myoblast culture model, not neural tissue.
- discussion_id: kmt2e_sex_biased_expressivity
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is the male excess among reported individuals, and the higher epilepsy and
    lower autism rates in females, biological or an ascertainment effect?
  attaches_to:
  - phenotypes#Epilepsy
  - phenotypes#Autism
  rationale: >-
    Across published loss-of-function cases 41 were male and 15 female, a
    significant excess. The authors raise reduced penetrance or milder
    expressivity in females as possible explanations but have not tested them.
  evidence:
  - reference: PMID:34321323
    reference_title: "O'Donnell-Luria-Rodan syndrome: description of a second multinational cohort and refinement of the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      this sex distribution of 41 males to 15 females with putative
      loss-of-function variants (excluding 7 patients carrying missense variants
      with a suspected gain-of-function
    explanation: Quantifies the male excess.
  - reference: PMID:31079897
    reference_title: "Heterozygous Variants in KMT2E Cause a Spectrum of Neurodevelopmental Disorders and Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is possible that decreased penetrance or variable expressivity of the
      condition in females means that fewer female individuals with de novo
      protein-truncating variants come to diagnostic attention.
    explanation: The index authors' proposed, untested explanation.

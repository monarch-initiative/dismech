phenotypes:
- name: Global developmental delay
  category: Neurological
  frequency: VERY_FREQUENT
  description: >-
    Developmental delay across motor and language domains, evident in infancy.
    Pooled across 42 published individuals of all variant classes, 97% had
    global developmental delay.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
    onset:
      onset_category: INFANTILE
  evidence:
  - reference: PMID:38648332
    reference_title: "KMT2E-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KMT2E-related neurodevelopmental disorder (KMT2E-NDD) is a condition
      characterized by global developmental delay, variable intellectual
      disability (typically in the mild-to-moderate range), and hypotonia.
    explanation: GeneReviews lists global developmental delay as a defining feature.
  - reference: PMID:33111303
    reference_title: "Clinical Characteristics and Genotype-Phenotype Correlation in Children with KMT2E Gene-Related Neurodevelopmental Disorders: Report of Two New Cases and Review of Published Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The common features were global developmental delay (97%) followed by
      macrocephaly (35%), seizures (30%), and autism (25%).
    explanation: Pooled literature review (40 published plus 2 new cases) gives the very-frequent band.
- name: Delayed speech and language development
  category: Neurological
  frequency: VERY_FREQUENT
  description: >-
    Speech delay is the most consistent developmental feature: 38/46 (83%) in
    the combined loss-of-function cohorts. Most affected individuals become
    verbal. Language regression occurred in a few children.
  phenotype_term:
    preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  evidence:
  - reference: PMID:34321323

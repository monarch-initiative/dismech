      label: histone H3K4me3 reader activity
    modifier: DECREASED
  evidence:
  - reference: PMID:31079897
    reference_title: "Heterozygous Variants in KMT2E Cause a Spectrum of Neurodevelopmental Disorders and Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KMT2E is very depleted (presumably as a result of negative selection) for
      protein-truncating variants; there is a probability of loss-of-function
      intolerance (pLI) score of 1.0 and an observed/expected ratio of 0.01
    explanation: Population constraint indicates dosage sensitivity to loss of one allele.
  - reference: PMID:31079897
    reference_title: "Heterozygous Variants in KMT2E Cause a Spectrum of Neurodevelopmental Disorders and Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were no significant phenotypic differences between individuals with
      truncating variants in the terminal exon of the gene and those with
      earlier-truncating variants, suggesting a probable common pathophysiology
      of haploinsufficiency.
    explanation: Concordance of NMD-escaping and NMD-triggering truncations supports a dosage mechanism.
  - reference: PMID:37157895
    reference_title: "Genome sequencing identifies KMT2E-disrupting cryptic structural variant in a female with O'Donnell-Luria-Rodan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a patient from the 100,000 Genomes Project with a complex de
      novo structural variant within KMT2E leading to O'Donnell-Luria-Rodan
      syndrome.
    explanation: Gene disruption by a structural variant produces the same syndrome, consistent with loss of function.

- name: Altered H3K4 Methylation and Transcriptional Regulation
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Permissive-Repressive Chromatin State Imbalance"
  role: amplifier
  mechanism_confidence: PROVISIONAL
  biological_scale: MOLECULAR
  description: >-
    KMT2E is recruited to H3K4me3-marked euchromatin through its PHD finger and
    acts as a chromatin-associated transcriptional regulator. Knockdown in
    myoblasts reduced H3K4 methylation globally and at a target promoter, not
    through intrinsic methyltransferase activity but by altering expression of
    other histone-modifying enzymes (LSD1, SET7/9). All of this evidence comes
    from non-neural cell systems; the chromatin and transcriptional
    consequences of heterozygous loss in developing human neurons are unknown,
    so this node is not connected to the neurodevelopmental phenotypes and the
    module's central transcriptional node is not declared.
  cellular_components:
  - preferred_term: chromatin
    term:
      id: GO:0000785
      label: chromatin
  biological_processes:
  - preferred_term: regulation of DNA-templated transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: DECREASED
  evidence:
  - reference: PMID:23798402
    reference_title: "Molecular basis for chromatin binding and regulation of MLL5."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we show that MLL5 is recruited to gene-rich euchromatic regions via
      the interaction of its plant homeodomain finger with the histone mark
      H3K4me3.
    explanation: Establishes KMT2E (MLL5) recruitment to H3K4me3-marked chromatin via its PHD finger.
  - reference: PMID:24130829
    reference_title: "Solution NMR structure and histone binding of the PHD domain of human MLL5."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We further demonstrate that the PHD domain binds with similar affinity to
      histone H3 tail peptides di- and tri-methylated at lysine 4 (H3K4me2 and
      H3K4me3)
    explanation: Independent structural study confirming the PHD finger as an H3K4me2/me3 reader.
  - reference: PMID:19264965
    reference_title: "MLL5, a trithorax homolog, indirectly regulates H3K4 methylation, represses cyclin A2 expression, and promotes myogenic differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In knockdown cells, H3K4 methylation at the CCRE is reduced, reflecting
      quantitative global changes in methylation.
    explanation: Loss of MLL5 in cultured myoblasts reduces H3K4 methylation, the chromatin-state change this node represents.
  - reference: PMID:19264965
    reference_title: "MLL5, a trithorax homolog, indirectly regulates H3K4 methylation, represses cyclin A2 expression, and promotes myogenic differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      MLL5 appears to lack intrinsic histone methyl transferase activity, but
      regulates expression of histone-modifying enzymes LSD1 and SET7/9,
      suggesting an indirect mechanism.
    explanation: The H3K4 methylation change is indirect, through other chromatin enzymes.

- name: Amygdala Neuronal Development Abnormality
  role: downstream_mechanism
  mechanism_confidence: HYPOTHETICAL
  biological_scale: TISSUE
  subtypes:
  - Loss-of-function
  description: >-
    In Kmt2e heterozygous mice, amygdala glucose metabolism on FDG-PET is
    selectively reduced and amygdala neurons are more numerous and larger,
    alongside social deficit and anxiety-like behaviour. KMT2E expression in
    human amygdala falls after birth. Human imaging or neuropathological
    correlates have not been reported.
  cell_types:
  - preferred_term: amygdala neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: amygdala
    term:
      id: UBERON:0001876
      label: amygdala
  evidence:
  - reference: PMID:36534336
    reference_title: "KMT2E Haploinsufficiency Manifests Autism-Like Behaviors and Amygdala Neuronal Development Dysfunction in Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Whole-brain 18F-FDG-PET analysis identified that relative amygdala
      glycometabolism was selectively decreased in KMT2E+/- mice compared to
      wild-type mice.
    explanation: Imaging localizes the mouse abnormality to the amygdala.
  - reference: PMID:36534336
    reference_title: "KMT2E Haploinsufficiency Manifests Autism-Like Behaviors and Amygdala Neuronal Development Dysfunction in Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Additionally, KMT2E mRNA levels in human amygdala were significantly
      decreased after birth during brain development.
    explanation: Developmental expression pattern in human amygdala reported in the same study.
  downstream:
  - target: Autism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - kmt2e_amygdala_neuronal_branch
    evidence:
    - reference: PMID:36534336
      reference_title: "KMT2E Haploinsufficiency Manifests Autism-Like Behaviors and Amygdala Neuronal Development Dysfunction in Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Behavioral results revealed that KMT2E haploinsufficiency was sufficient
        to produce social deficit, accompanied by anxiety in mice.
      explanation: Social deficit in the same mice is the proposed behavioural readout of the amygdala change.
  - target: Anxiety
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - kmt2e_amygdala_neuronal_branch

- name: Impaired Microglial Phagocytosis
  role: downstream_mechanism
  mechanism_confidence: HYPOTHETICAL
  biological_scale: CELLULAR
  subtypes:
  - Loss-of-function
  description: >-
    Mll5 haploinsufficiency in mice reduces microglial phagocytosis through
    dysregulated TREM2-SGK3-GSK3B signalling, with neuronal hyperexcitability
    and autism-like behaviour; microglia derived from an individual with
    autism (not ODLURO) showed parallel reductions in MLL5 expression and
    phagocytosis. The GSK3B inhibitor lithium chloride rescued the deficit and
    the behaviour in mice. Not studied in individuals with ODLURO.
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: phagocytosis (microglial)
    term:
      id: GO:0006909
      label: phagocytosis
    modifier: DECREASED
  evidence:
  - reference: PMID:41997967
    reference_title: "Mll5 haploinsufficiency attenuates microglial phagocytosis through dysregulated TREM2-SGK3-GSK3β signaling and recapitulates ASD-like behaviors in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      By targeting this pathway, lithium chloride, a GSK3β inhibitor, rescues
      both microglial phagocytosis deficits and behavioral abnormalities in Mll5
      haploinsufficienct mice.
    explanation: Pharmacological rescue supports a causal role of the microglial pathway in the mouse behavioural phenotype.
  downstream:
  - target: Autism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - kmt2e_microglial_branch
    evidence:
    - reference: PMID:41997967
      reference_title: "Mll5 haploinsufficiency attenuates microglial phagocytosis through dysregulated TREM2-SGK3-GSK3β signaling and recapitulates ASD-like behaviors in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we demonstrate that Mll5 haploinsufficiency in mice impairs
        microglial phagocytosis, drives neuronal hyperexcitability, and
        recapitulates core ASD-like behaviors.
      explanation: Connects the microglial deficit to autism-like behaviour in mice.

- name: KMT2E Missense Altered Function
  role: trigger
  mechanism_confidence: HYPOTHETICAL
  biological_scale: MOLECULAR
  subtypes:
  - Missense
  description: >-
    De novo missense variants, which in the index cohort did not cluster (one
    in the PHD finger, one in the SET domain, two outside annotated domains),
    produce a more severe phenotype than truncating variants. Whether they act
    by gain of function, dominant-negative interference or another mechanism is
    untested. KMT2E is not constrained against missense variation in gnomAD.
  gene:
    preferred_term: KMT2E
    term:
      id: hgnc:18541
      label: KMT2E
  genetic_context:
    functional_impact_category: UNKNOWN
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    gene:
      preferred_term: KMT2E
      term:
        id: hgnc:18541
        label: KMT2E
  evidence:
  - reference: PMID:31079897
    reference_title: "Heterozygous Variants in KMT2E Cause a Spectrum of Neurodevelopmental Disorders and Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was no clustering of the missense variants; one is in the SET
      domain, one is in the PHD domain, and two are not in identified domains.
    explanation: Describes the positions of the missense variants.
  - reference: PMID:31079897
    reference_title: "Heterozygous Variants in KMT2E Cause a Spectrum of Neurodevelopmental Disorders and Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We hypothesize that the phenotype of epileptic encephalopathy could be
      variant specific and might relate to an alternate mechanism such as a
      gain-of-function or dominant-negative effect.
    explanation: States the altered-function mechanism as a hypothesis.
  downstream:
  - target: Epileptic encephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - kmt2e_missense_altered_function
    evidence:
    - reference: PMID:31079897
      reference_title: "Heterozygous Variants in KMT2E Cause a Spectrum of Neurodevelopmental Disorders and Epilepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Whereas, in our cohort, only approximately 14% of the individuals with
        protein-truncating variants have epilepsy, all of the individuals we
        report as having missense variants have epilepsy. This association met
        statistical significance (p = 0.0026, Fisher's exact test).
      explanation: Statistically links the missense class to epilepsy.
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - kmt2e_missense_altered_function
  - target: Severe global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:

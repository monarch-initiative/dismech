description: >-
  O'Donnell-Luria-Rodan syndrome (ODLURO; OMIM 618512), also called
  KMT2E-related neurodevelopmental disorder, is an autosomal dominant
  neurodevelopmental disorder caused by heterozygous pathogenic variants in
  KMT2E or by 7q22 microdeletions that include it. Most affected children have
  global developmental delay with prominent speech delay, intellectual function
  in the low-normal to mild-to-moderate intellectual disability range,
  hypotonia, postnatally emerging macrocephaly and a subtle facial gestalt;
  about a third have autism and a minority have epilepsy. Constipation and
  other functional gastrointestinal symptoms and sleep disturbance are common.
  Most variants are protein-truncating and arise de novo, and the truncating
  and deletion classes are thought to act by haploinsufficiency. A small group
  of individuals with de novo missense variants has a more severe phenotype
  with infantile-onset epileptic encephalopathy and microcephaly rather than
  macrocephaly. Reported cohorts are male-predominant, and among individuals
  with truncating variants epilepsy has been more frequent in females and
  autism in males. Despite its family name, KMT2E appears to lack intrinsic
  histone methyltransferase activity; its best-characterized molecular
  function is reading H3K4me3 through its PHD finger.
notes: >-
  Lump/split. MONDO (MONDO:0032793) and OMIM (618512) carry a single concept for
  all KMT2E variant classes, and this entry follows them. The phenotypic
  divergence between protein-truncating variants and gene deletions on one hand
  and de novo missense variants on the other is represented as two allelic
  has_subtypes rather than as separate entries, because the missense group is
  small (four individuals in the index cohort) and its distinct mechanism is a
  hypothesis the original authors flag as requiring validation. Large
  7q22.2-q22.3 deletions that also remove neighbouring genes are included under
  the loss-of-function subtype; they were associated with greater developmental
  delay than intragenic variants, which the index cohort attributes in part to
  the additional deleted genes. No Orphanet disorder record for this syndrome
  was found in the Orphadata product 1 file (searched for "Donnell" and
  "KMT2E"), and MONDO carries no ORPHA cross-reference for it.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    Autosomal dominant. Most probands whose parents have been tested have a de
    novo variant; rare inherited cases come from a parent who typically has
    mild intellectual disability.
    Each child of an affected individual has a 50% chance of inheriting the
    variant. Expressivity varies by variant class and by sex.
  evidence:
  - reference: PMID:38648332
    reference_title: "KMT2E-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KMT2E-NDD is an autosomal dominant disorder. Most probands reported to
      date with KMT2E-NDD whose parents have undergone molecular genetic testing
      have the disorder as the result of a de novo pathogenic variant.
    explanation: GeneReviews states the inheritance mode and the predominance of de novo variants.
  - reference: PMID:38648332
    reference_title: "KMT2E-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rarely, individuals diagnosed with KMT2E-NDD inherited a pathogenic
      variant from an affected parent who typically has mild intellectual
      disability. Each child of an individual with KMT2E-NDD has a 50% chance of
      inheriting the pathogenic variant.
    explanation: GeneReviews documents rare transmission from mildly affected parents and the 50% recurrence risk to offspring.
  - reference: PMID:34321323
    reference_title: "O'Donnell-Luria-Rodan syndrome: description of a second multinational cohort and refinement of the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of all 17 variants, 13 were confirmed de novo, 2 were proven to be not
      inherited maternally and paternal samples were unavailable, one variant in
      two brothers and another variant in an unrelated patient were inherited
      paternally.
    explanation: The second cohort quantifies de novo versus paternally transmitted variants.
  - reference: PMID:31079897
    reference_title: "Heterozygous Variants in KMT2E Cause a Spectrum of Neurodevelopmental Disorders and Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More than 70% of the individuals were male, and expressivity was variable
      by sex; epilepsy was more common in females and autism more common in
      males.
    explanation: The index cohort reports sex-dependent variable expressivity.
prevalence:
- population: Worldwide (published case series)
  measure_type: CASES_IN_LITERATURE
  notes: >-
    No population-based prevalence or birth-prevalence estimate exists. The
    second multinational cohort brought the published total to 63 individuals
    within about two years of the first description and argued that the
    disorder may be a relatively common single-gene cause of developmental
    delay and autism; that is an inference from ascertainment, not a measured
    rate.
  evidence:
  - reference: PMID:34321323
    reference_title: "O'Donnell-Luria-Rodan syndrome: description of a second multinational cohort and refinement of the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Shortly after the systematic description of ODLURO in 2019, our report now
      brings the number of known patients to 63.
    explanation: Case count in the literature at the time of the second cohort.
progression:
- phase: Infancy
  age_range: Birth to 2 years
  notes: >-
    Pregnancy and birth are usually uncomplicated. Head circumference is often
    high-normal at birth and crosses the 97th percentile within the first year.
    In the missense group, epileptic encephalopathy began in the neonatal
    period or by 6 months.
  evidence:
  - reference: PMID:34321323
    reference_title: "O'Donnell-Luria-Rodan syndrome: description of a second multinational cohort and refinement of the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our cohort, the more common presentation of macrocephaly was that of a
      high-normal occipitofrontal circumference (OFC) at birth, crossing the
      97th percentile within the first year of life, although this was not
      universal
    explanation: Describes postnatal emergence of macrocephaly during infancy.
  - reference: PMID:34321323
    reference_title: "O'Donnell-Luria-Rodan syndrome: description of a second multinational cohort and refinement of the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pregnancy and birth history were generally uncomplicated for these
      patients, except for the youngest patient of our cohort (patient 2).
    explanation: Perinatal course in the second cohort.
  - reference: PMID:31079897
    reference_title: "Heterozygous Variants in KMT2E Cause a Spectrum of Neurodevelopmental Disorders and Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individual 34 developed seizures at 6 months of age, and individuals 35
      and 36 both developed seizures in the neonatal period.
    explanation: Seizure onset timing in the missense-variant group.
- phase: Early childhood
  age_range: 1 to 5 years
  notes: >-
    In the index truncating-variant group, mean ages of independent walking and

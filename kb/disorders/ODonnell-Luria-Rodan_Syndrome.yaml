    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Speech delay | 17/18 (94%) | 21/28 (75%) | 38/46 (83%)"
    explanation: Combined frequency 38/46 across both loss-of-function cohorts.
  - reference: PMID:38648332
    reference_title: "KMT2E-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of affected individuals are verbal but experience speech
      delays with or without articulation problems.
    explanation: GeneReviews summary of the language phenotype.

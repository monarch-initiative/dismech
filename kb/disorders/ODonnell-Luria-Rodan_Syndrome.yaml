- name: Epilepsy
  category: Neurological
  frequency: OCCASIONAL
  subtype: Loss-of-function
  description: >-
    Epilepsy in 7/48 (15%) of the combined loss-of-function cohorts (4/26 of
    intragenic truncating variants in the index cohort, 3/4 of its
    microdeletions, 0/18 in the second cohort). In the index truncating group it
    was seen in 3/7 females and 1/19 males. No single seizure type or epilepsy
    syndrome predominates; focal seizures, childhood absence epilepsy and
    febrile seizures have been associated with truncating variants and
    deletions. GeneReviews gives about one third across all variant classes,
    and a systematic review of cases with epilepsy estimated 29%; these
    all-class figures include the missense and large-deletion groups, in which
    epilepsy is more frequent.

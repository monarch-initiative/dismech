- phase: Adolescence and adulthood
  notes: >-
    Few adolescents and adults have been described, so long-term outcome and
    adult-onset complications are not characterized.
  evidence:
  - reference: PMID:34321323
    reference_title: "O'Donnell-Luria-Rodan syndrome: description of a second multinational cohort and refinement of the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since there is so far only a smaller number of reports on teenagers and
      adults (10 patients in total, including the father/daughter/son trio in
      previous work7), conclusions about patients' long-term development and
      possible late-onset health problems in adulthood remain speculative at
      best.
    explanation: States that adult natural history is essentially undescribed.
has_subtypes:
- name: Loss-of-function
  display_name: Protein-truncating variants and KMT2E deletions
  description: >-
    Frameshift, nonsense and canonical or cryptic splice-site variants, gene
    disruption by structural variants, and 7q22 deletions removing KMT2E. This
    is the large majority of reported individuals and is associated with the
    milder, macrocephalic presentation. No phenotypic difference has been found
    between truncating variants predicted to undergo nonsense-mediated decay and
    those in the last exon predicted to escape it.
  genes:
  - preferred_term: KMT2E
    term:
      id: hgnc:18541
      label: KMT2E
  evidence:
  - reference: PMID:31079897
    reference_title: "Heterozygous Variants in KMT2E Cause a Spectrum of Neurodevelopmental Disorders and Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Almost all variants occurred de novo, and most were truncating. Most
      affected individuals with protein-truncating variants presented with mild
      intellectual disability.
    explanation: Establishes truncating variants as the predominant class with a milder phenotype.
  - reference: PMID:34321323
    reference_title: "O'Donnell-Luria-Rodan syndrome: description of a second multinational cohort and refinement of the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We did not detect a significant phenotypic difference between patients
      carrying variants predicted to lead to NMD, and patients carrying
      nonsense and frameshift variants in the last exon of KMT2E predicted to
      escape NMD.
    explanation: NMD-escaping and NMD-triggering truncations are clinically indistinguishable, consistent with one loss-of-function class.
- name: Missense
  display_name: De novo missense variants
  description: >-
    Rare de novo missense variants. In the index cohort all four carriers had
    epilepsy, three with infantile-onset epileptic encephalopathy, with more
    severe developmental delay and microcephaly in two of three measured. The
    mechanism is unresolved.
  genes:
  - preferred_term: KMT2E
    term:
      id: hgnc:18541
      label: KMT2E
  evidence:
  - reference: PMID:31079897
    reference_title: "Heterozygous Variants in KMT2E Cause a Spectrum of Neurodevelopmental Disorders and Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The group of four individuals with missense variants in KMT2E presented
      with the most severe developmental delays. Epilepsy was present in all
      individuals with missense variants, often manifesting as
      treatment-resistant infantile epileptic encephalopathy. Microcephaly was
      also common in this group.
    explanation: Defines the distinct, more severe missense-variant phenotype.
mechanistic_hypotheses:
- hypothesis_group_id: kmt2e_haploinsufficiency
  hypothesis_label: KMT2E haploinsufficiency
  status: CANONICAL
  applies_to_subtypes:
  - Loss-of-function
  description: >-
    Protein-truncating variants and deletions reduce KMT2E dosage and cause the
    disorder through haploinsufficiency. Support is genetic: extreme depletion
    of truncating variants in the general population, concordant phenotypes of
    intragenic truncations and gene deletions, and no difference between
    NMD-escaping and NMD-triggering truncations. Direct measurement of reduced
    KMT2E protein in patient cells has not been reported.
  evidence:
  - reference: PMID:31079897
    reference_title: "Heterozygous Variants in KMT2E Cause a Spectrum of Neurodevelopmental Disorders and Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, the individuals with chromosome 7q22.2-22.3 microdeletions
      encompassing KMT2E presented similarly to those with truncating variants,
      further supporting haploinsufficiency as the disease mechanism.
    explanation: Phenotypic concordance of deletions and truncations supports dosage loss.
  - reference: CGGV:assertion_2d0a0603-e446-4bb9-a202-4f8066a60c5a-2022-08-02T180000.000Z
    reference_title: "KMT2E / complex neurodevelopmental disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity is reported to be LOF."
    explanation: ClinGen records loss of function as the mechanism of pathogenicity.
- hypothesis_group_id: kmt2e_missense_altered_function
  hypothesis_label: Missense altered function (gain-of-function or dominant-negative)
  status: EMERGING
  applies_to_subtypes:
  - Missense
  description: >-
    The more severe epileptic encephalopathy phenotype of de novo missense
    variants may reflect a variant-specific gain-of-function or dominant-negative
    effect rather than haploinsufficiency. No functional study has tested this.
  evidence:
  - reference: PMID:31079897
    reference_title: "Heterozygous Variants in KMT2E Cause a Spectrum of Neurodevelopmental Disorders and Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haploinsufficiency versus gain-of-function or dominant-negative effects
      specific to these missense variants in KMT2E might explain this divergence
      in phenotype, but requires independent validation.
    explanation: The index cohort proposes, and explicitly does not establish, an altered-function mechanism.
- hypothesis_group_id: kmt2e_amygdala_neuronal_branch
  hypothesis_label: Amygdala neuronal development branch (mouse)
  status: EMERGING
  applies_to_subtypes:
  - Loss-of-function
  description: >-
    In Kmt2e heterozygous mice, social deficit and anxiety are accompanied by
    reduced amygdala glucose metabolism and increased numbers and soma size of
    amygdala neurons, proposed as the substrate of autism-like behaviour. Not
    yet examined in human tissue or human neuronal models.
  evidence:
  - reference: PMID:36534336
    reference_title: "KMT2E Haploinsufficiency Manifests Autism-Like Behaviors and Amygdala Neuronal Development Dysfunction in Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our findings support a causative role of KMT2E in ASD development and
      suggest that amygdala neuronal development abnormality is likely a major
      underlying mechanism.
    explanation: The mouse study proposes the amygdala branch.
- hypothesis_group_id: kmt2e_microglial_branch
  hypothesis_label: Microglial phagocytosis branch (mouse)
  status: EMERGING
  applies_to_subtypes:
  - Loss-of-function
  description: >-
    In Mll5 (Kmt2e) haploinsufficient mice, reduced microglial phagocytosis
    through TREM2-SGK3-GSK3B signalling is accompanied by neuronal
    hyperexcitability and autism-like behaviour, and lithium chloride rescued
    both the phagocytosis deficit and the behaviour. Not yet examined in
    individuals with ODLURO.
  evidence:
  - reference: PMID:41997967
    reference_title: "Mll5 haploinsufficiency attenuates microglial phagocytosis through dysregulated TREM2-SGK3-GSK3β signaling and recapitulates ASD-like behaviors in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we demonstrate that Mll5 haploinsufficiency in mice impairs
      microglial phagocytosis, drives neuronal hyperexcitability, and
      recapitulates core ASD-like behaviors.
    explanation: The mouse study proposes the microglial branch.
pathophysiology:
- name: KMT2E Haploinsufficiency
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component Haploinsufficiency"
  role: trigger
  mechanism_confidence: ESTABLISHED
  biological_scale: MOLECULAR
  subtypes:
  - Loss-of-function
  description: >-
    A heterozygous protein-truncating variant, splice-disrupting variant,
    structural variant or 7q22 deletion removes one functional copy of KMT2E.
    KMT2E is highly intolerant of truncating variation in gnomAD (pLI 1.0).
    Among the epigenetic-machinery classes of the conformed module, KMT2E is a
    reader rather than a writer: its PHD finger binds H3K4me3, and its SET
    domain is structurally and biochemically inactive (see the discussion on
    catalytic activity).
  gene:
    preferred_term: KMT2E
    term:
      id: hgnc:18541
      label: KMT2E
  genetic_context:

diagnosis:
- name: Molecular genetic testing
  description: >-
    Diagnosis is established by a heterozygous pathogenic KMT2E variant in a
    proband with suggestive findings. Intragenic variants are found by exome or
    genome sequencing and deletions by chromosomal microarray. There are no
    consensus clinical diagnostic criteria. Complex structural variants can be
    missed by standard exome and genome pipelines and have been found on
    reanalysis of genome data.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: A heterozygous pathogenic KMT2E variant or a deletion including KMT2E establishes the diagnosis.
  evidence:
  - reference: PMID:38648332
    reference_title: "KMT2E-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of KMT2E-NDD is established in a proband with suggestive
      findings and a heterozygous pathogenic variant in KMT2E identified by
      molecular genetic testing.
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:31079897
    reference_title: "Heterozygous Variants in KMT2E Cause a Spectrum of Neurodevelopmental Disorders and Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microdeletions were detected by chromosomal microarrays in some
      individuals, whereas all other individuals were found to have variants in
      KMT2E via exome or genome sequencing.
    explanation: Testing modalities by variant class.
  - reference: PMID:37157895
    reference_title: "Genome sequencing identifies KMT2E-disrupting cryptic structural variant in a female with O'Donnell-Luria-Rodan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case expands the mutational spectrum for this syndrome and highlights
      the importance of revisiting unsolved cases using better SV prioritisation
      tools and updated gene panels.
    explanation: A cryptic structural variant was found only on dedicated structural-variant reanalysis.
differential_diagnoses:
- name: Other KMT2-family and H3K4-related chromatinopathies
  description: >-
    Wiedemann-Steiner syndrome (KMT2A) and Kabuki syndrome (KMT2D) share
    developmental delay, intellectual disability, autism features, sleep
    disturbance and gastrointestinal symptoms, and neurobehavioral comparisons
    show overlapping profiles.
  distinguishing_features:
  - Macrocephaly in about half of the loss-of-function group.
  - Molecular confirmation of a KMT2E variant.
  evidence:
  - reference: PMID:34321323
    reference_title: "O'Donnell-Luria-Rodan syndrome: description of a second multinational cohort and refinement of the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ODLURO phenotypic spectrum has a considerable overlap with these
      disorders, which may suggest an underlying pathomechanistic similarity.
    explanation: Overlap with the other KMT2-family disorders.
  - reference: PMID:41137515
    reference_title: "Towards Characterizing the Developmental and Behavioral Profiles of ODLURO Syndrome: Shared Features With Wiedemann-Steiner Syndrome and Kabuki Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In brief, ODLURO shares similarities in neurobehavioral functioning with
      other disorders of H3K4 modulation of gene expression, warranting further
      systematic research with cross-syndrome comparisons
    explanation: Neurobehavioral overlap with Wiedemann-Steiner and Kabuki syndromes.
- name: CHD8-related neurodevelopmental disorder
  description: >-
    CHD8 truncating variants also cause mild to moderate intellectual
    disability, autism susceptibility and macrocephaly or overgrowth. One child
    in the second ODLURO cohort carried de novo truncating variants in both
    genes.
  distinguishing_features:
  - Molecular testing distinguishes the two and can identify dual diagnoses.
  evidence:
  - reference: PMID:34321323
    reference_title: "O'Donnell-Luria-Rodan syndrome: description of a second multinational cohort and refinement of the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nonsense variants in CHD8 have been robustly associated with mild to
      moderate ID and ASD susceptibility.
    explanation: Phenotypic overlap noted in the context of a dual diagnosis.
  - reference: PMID:34321323
    reference_title: "O'Donnell-Luria-Rodan syndrome: description of a second multinational cohort and refinement of the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, a large proportion of patients display overgrowth with
      increased height and/or macrocephaly.
    explanation: CHD8-related disorder shares macrocephaly with ODLURO.
- name: PTEN hamartoma tumor syndrome
  description: >-
    Macrocephaly with developmental delay or autism prompts PTEN testing; PTEN
    was tested and excluded in one ODLURO patient before KMT2E was found, and a
    child in the index cohort had pathogenic variants in both KMT2E and PTEN.
  distinguishing_features:
  - Molecular testing; a PTEN result does not exclude KMT2E and vice versa.
  evidence:
  - reference: PMID:37157895
    reference_title: "Genome sequencing identifies KMT2E-disrupting cryptic structural variant in a female with O'Donnell-Luria-Rodan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The large OFC at 11 years prompted Sanger sequencing and MLPA analysis of
      PTEN but no pathogenic variants were identified.
    explanation: PTEN was the first diagnostic consideration for macrocephaly in an ODLURO patient.
  - reference: PMID:31079897
    reference_title: "Heterozygous Variants in KMT2E Cause a Spectrum of Neurodevelopmental Disorders and Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individual 6 also had a de novo pathogenic PTEN (GenBank: NM_000314.6,
      MIM: 601728) c.493G>A (p.Gly165Arg) variant, which can also account for his
      macrocephaly.
    explanation: Dual KMT2E and PTEN diagnosis in the index cohort.
treatments:
- name: Antiseizure medication
  description: >-
    Seizures are treated with standard antiseizure medications chosen by seizure
    type; no drug has been studied specifically in ODLURO. In the index cohort,
    epilepsy with truncating variants was controlled with medication in almost
    all, whereas missense-variant epileptic encephalopathy was treatment
    resistant (a ketogenic diet did not help in one child). In a systematic
    review of cases with epilepsy, about 70% of those with medication records
    needed two or more drugs.

  notes: >-
    Heterozygous KMT2E variants (NM_182931) cause the disorder; ClinGen
    classifies KMT2E and autosomal dominant complex neurodevelopmental disorder
    (the ODLURO phenotype) as Definitive with a loss-of-function mechanism.
    Reported variant classes are frameshift, nonsense, canonical splice,
    synonymous variants creating cryptic splice sites, complex structural
    variants disrupting the gene, 7q22.2-q22.3 deletions (0.052 to 3.2 Mb) and rare
    de novo missense variants. Frameshifts in the last exon that escape
    nonsense-mediated decay and extend the protein occur and are clinically
    indistinguishable from earlier truncations. The gene is constrained against
    truncating (pLI 1.0) but not missense variation.

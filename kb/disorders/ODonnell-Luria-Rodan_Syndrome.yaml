  - reference: PMID:31079897
    reference_title: "Heterozygous Variants in KMT2E Cause a Spectrum of Neurodevelopmental Disorders and Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean age of independent walking in this group was 20 months (range 12

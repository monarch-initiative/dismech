    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HNF4A mutations cause hyperinsulinemia in utero in about 50% of patients leading to significant fetal macrosomia and subsequent neonatal hypoglycemia"
    explanation: >-
      Supports macrosomia and transient neonatal hypoglycemia as HNF4A-MODY
      features.
- name: Neonatal hypoglycemia
  description: >-
    Transient hyperinsulinemic neonatal hypoglycemia in HNF4A mutation carriers,
    typically resolving in childhood before diabetes develops later in life.
  subtype: HNF4A-MODY
  phenotype_term:

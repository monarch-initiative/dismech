    description: Progressive loss of insulin secretion gives sustained hyperglycaemia.
- name: Raised Glucokinase Threshold for Insulin Release
  description: Heterozygous inactivating GCK variants lower the beta cell's sensitivity to glucose, so
    insulin release begins at a higher glucose concentration. Fasting glucose is regulated at a raised
    but stable set point and does not progress.

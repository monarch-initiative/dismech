  genes:
  - preferred_term: CEL
    term:
      id: hgnc:1848
      label: CEL
  description: >-
    CEL-MODY (OMIM:609812). Caused by frameshift variants in the proximal VNTR
    of the carboxyl ester lipase gene, and distinctive among MODY forms in
    combining exocrine pancreatic disease with insulin-dependent diabetes.
  evidence:
  - reference: PMID:37726640
    reference_title: "Clinical and genetic characteristics of CEL-MODY (MODY8): a literature review and screening in Chinese individuals diagnosed with early-onset type 2 diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CEL-MODY is a very rare disease caused by frameshift mutations affecting the proximal VNTR segments of the CEL gene.
    explanation: Names the specific allele class that causes this subtype.
  - reference: PMID:37726640
    reference_title: "Clinical and genetic characteristics of CEL-MODY (MODY8): a literature review and screening in Chinese individuals diagnosed with early-onset type 2 diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CEL-MODY patients were nonobese and presented with exocrine pancreatic affection (e.g., chronic pancreatitis, low fecal elastase levels, pancreas atrophy and lipomatosis) followed by insulin-dependent diabetes.
    explanation: Gives the exocrine-plus-endocrine presentation that separates this subtype from the other MODY forms.
- name: maturity-onset diabetes of the young type 10

prevalence:
- population: Children and adolescents
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    MODY is the most common form of monogenic diabetes but is rare among all
    diabetes; the cited review reports it accounts for roughly 1-2% of diabetes
    in children and adolescents. This is a proportion of diabetes rather than a
    population rate, so measure_type is left UNKNOWN and no rate_per_100000 is
    asserted.
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Monogenic forms of diabetes account for approximately 1-2% of diabetes in children and adolescents"
    explanation: >-
      Quantifies MODY/monogenic diabetes as roughly 1-2% of diabetes in children
      and adolescents.
biochemical:
- name: C-peptide (preserved)
  notes: >-
    Unlike type 1 diabetes, MODY preserves endogenous insulin secretion, so
    C-peptide remains detectable years after diagnosis; together with negative
    pancreatic autoantibodies this distinguishes MODY from autoimmune type 1
    diabetes and flags antibody-negative, C-peptide-positive patients as
    candidates for genetic testing.
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biomarkers consistent with MODY include negative pancreatic autoantibodies and detectable C-peptide"
    explanation: >-
      Supports preserved (detectable) C-peptide with negative autoantibodies as a
      MODY biomarker distinguishing it from type 1 diabetes.
- name: High-sensitivity C-reactive protein (hsCRP)
  notes: >-
    HNF1A regulates hepatic CRP expression, so low hsCRP is a discriminating
    biomarker of HNF1A-MODY: hsCRP < 0.75 mg/l helps distinguish it from type 1
    and type 2 diabetes.
  subtype: HNF1A-MODY
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "high-sensitivity C-reactive protein (hsCRP) is a biomarker of HNF1A-MODY that can be used to distinguish it from type 1 and type 2 diabetes"
    explanation: >-
      Supports low hsCRP as an HNF1A-MODY-specific discriminating biomarker.

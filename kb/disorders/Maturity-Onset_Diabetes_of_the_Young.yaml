  genes:
  - preferred_term: INS
    term:
      id: hgnc:6081
      label: INS
  description: >-
    INS-MODY (OMIM:613370). Heterozygous insulin-gene variants most often cause
    neonatal diabetes but are an established rare cause of MODY; loss-of-function
    alleles that escape nonsense-mediated decay are strongly enriched in MODY
    cohorts and cosegregate with diabetes.
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: While in some cases individuals present with islet antibody-negative diabetes (also known as type 1B diabetes), there are reports of several families who carry heterozygous INS missense mutations that cosegregate with a MODY phenotype
    explanation: Establishes the familial INS-MODY phenotype this subtype names.
  - reference: PMID:41772234
    reference_title: "Systematic analysis of loss-of-function variants across MODY genes demonstrates gene-specific effects and expands the spectrum of INS variants causing MODY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Including replication in additional MODY patients, we identified eight families with 17 affected individuals carrying INS variants.
    explanation: Contemporary replication of INS as a MODY gene in a case-control burden design.

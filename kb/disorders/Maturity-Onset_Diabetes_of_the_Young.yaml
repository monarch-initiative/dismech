name: Maturity-Onset Diabetes of the Young
creation_date: "2026-07-25T00:00:00Z"
description: >-
  Maturity-onset diabetes of the young (MODY) is the most common form of
  monogenic diabetes: a clinically and genetically heterogeneous group of
  autosomal-dominant disorders caused by single-gene defects that impair
  pancreatic beta-cell development or glucose-stimulated insulin secretion,
  typically producing familial, non-ketotic, early-onset (usually before age 25)
  diabetes in lean, autoantibody-negative individuals with preserved C-peptide.
  MODY is mechanistically distinct from the three standalone diabetes types it
  sits beside in the Diabetes Mellitus grouping — it is neither the T-cell
  autoimmune beta-cell destruction of type 1, the peripheral insulin resistance
  of type 2, nor the undernutrition-associated beta-cell impairment of
  malnutrition-related (type 5) diabetes. Its defining feature is that the
  causative gene determines the mechanism, the clinical course, and — most
  importantly for care — the treatment: the two dominant subgroups behave very
  differently. GCK-MODY (MODY2) is a stable, mild, complication-free raised
  glucose set point that needs no pharmacotherapy, whereas the hepatocyte
  nuclear factor (transcription-factor) forms HNF1A-MODY (MODY3) and HNF4A-MODY
  (MODY1) are progressive, sulfonylurea-sensitive, and carry the same
  microvascular/macrovascular complication risk as common diabetes when
  glycemic control is inadequate. HNF1B-MODY (MODY5) additionally produces renal
  cysts and a broader developmental syndrome (RCAD). Correct genetic diagnosis
  therefore reclassifies patients frequently mislabeled as type 1 or type 2 and
  changes management.
category: Mendelian
parents:
- Diabetes Mellitus

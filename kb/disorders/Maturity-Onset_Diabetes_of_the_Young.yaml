- name: Beta-Cell Transcription Factor Deficiency
  description: Heterozygous loss of a transcription factor that drives pancreatic development and beta-cell
    gene expression, including the insulin gene and genes of glucose transport and metabolism. Insulin
    secretion declines progressively rather than being set at a fixed lower level.
  biological_scale: CELLULAR

    evidence_source: HUMAN_CLINICAL
    snippet: "Diabetes from HNF1B mutations is the result of both beta cell dysfunction and insulin resistance"
    explanation: This supports the dual beta-cell-dysfunction / insulin-resistance mechanism of HNF1B-MODY.
- name: KCNJ11
  gene_term:
    preferred_term: KCNJ11
    term:
      id: hgnc:6257
      label: KCNJ11
  association: Causative
  notes: >-
    Encodes the Kir6.2 subunit of the beta-cell ATP-sensitive potassium (KATP)
    channel. Most commonly causes neonatal diabetes but is a rare cause of MODY;
    included for the sulfonylurea-responsive KATP mechanism it shares with the
    transcription-factor forms. Not mapped to a dedicated KATP MODY subtype here.
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in KCNJ11, ABCC8, and INS most commonly cause neonatal diabetes but can be rare causes of MODY."
    explanation: This supports KCNJ11 as a rare MODY cause, chiefly a neonatal-diabetes gene.
- name: ABCC8
  gene_term:

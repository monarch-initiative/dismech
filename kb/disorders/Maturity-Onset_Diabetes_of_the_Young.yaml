    snippet: "The ABCC8 and KCNJ11 genes encode the sulfonylurea receptor 1 (SUR1) and inward rectifier potassium channel Kir6 (Kir6.2) subunits of the ATP-sensitive potassium (KATP) channel in the pancreatic beta cell, regulating insulin secretion."
    explanation: This supports ABCC8/KCNJ11 as KATP-channel genes underlying the sulfonylurea-responsive mechanism.
treatments:
- name: No Pharmacotherapy (GCK-MODY)
  description: >-
    GCK-MODY requires no glucose-lowering treatment outside pregnancy: oral
    agents and insulin do not alter its mild, regulated hyperglycemia and risk
    hypoglycemia without complication benefit. Correct genetic diagnosis exists
    largely to STOP unnecessary treatment.
  role: management
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the general consensus remains that pharmacological treatment is not required except during pregnancy, where management is based on fetal genotype"
    explanation: >-
      Supports the no-pharmacotherapy management standard for GCK-MODY, the
      treatment-defining consequence of correct subtype diagnosis.
- name: Low-Dose Sulfonylurea (HNF1A/HNF4A-MODY)
  description: >-
    Sulfonylurea sensitivity is the characteristic, treatment-defining feature of
    HNF1A-MODY and HNF4A-MODY: low-dose sulfonylureas (e.g., glyburide) are
    first-line and let many patients previously misdiagnosed as type 1 stop
    insulin. Sulfonylureas act on the beta-cell KATP channel to restore insulin
    secretion.
  role: treatment
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: glyburide
      term:
        id: CHEBI:5441
        label: glyburide
  target_mechanisms:
  - target: Beta-Cell KATP-Channel-Dependent Insulin Secretion
    treatment_effect: ACTIVATES
    description: >-
      Sulfonylureas bind SUR1 and close the beta-cell KATP channel directly,
      forcing depolarization and insulin exocytosis DOWNSTREAM of the HNF
      transcription-factor lesion. Because that effector node is intact in
      HNF1A/HNF4A-MODY, the drug restores secretion — this edge is the
      pathograph-level explanation of why sulfonylureas work in the
      transcription-factor forms but are unnecessary in GCK-MODY, whose benign
      set-point branch never reaches this effector deficit or the complication
      cascade.
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One of the most important and characteristic features of HNF1A-MODY is sensitivity to sulfonylureas (SU), which is the first-line treatment in HNF1A-MODY3."
    explanation: >-
      Supports low-dose sulfonylurea as first-line therapy in HNF1A-MODY.
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment is also with low-dose SUs, as described for HNF1A-MODY above."
    explanation: >-
      Supports extension of the sulfonylurea-first strategy to HNF4A-MODY.
- name: Insulin Therapy (HNF1B-MODY)
  description: >-
    HNF1B-MODY is less reliably sulfonylurea-responsive; while some patients
    respond to sulfonylureas or meglitinides, most are treated with insulin, and
    management must also address the associated renal and developmental disease.
  role: treatment
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Chronic Hyperglycemia and Vascular Complication Risk (Transcription-Factor MODY)
    treatment_effect: INHIBITS
    description: >-
      HNF1B-MODY couples beta-cell dysfunction with insulin resistance and is
      less reliably sulfonylurea-responsive, so it acts less on the KATP effector
      node; exogenous insulin instead replaces the deficient hormone and lowers
      chronic hyperglycemia directly, attenuating the downstream complication
      cascade.
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some patients may respond well to sulfonylureas or to meglitinides; however, the majority of these patients are treated with insulin."
    explanation: >-
      Supports insulin as the predominant treatment in HNF1B-MODY.
- name: Meglitinide (HNF1A/HNF4A-MODY alternative)
  description: >-
    Meglitinides are an alternative insulin secretagogue for transcription-factor
    MODY, acting on the same beta-cell KATP channel as sulfonylureas but with a
    shorter action and less hypoglycemia in some patients.
  role: treatment
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Beta-Cell KATP-Channel-Dependent Insulin Secretion
    treatment_effect: ACTIVATES
    description: >-
      Meglitinides, like sulfonylureas, close the beta-cell KATP channel to
      stimulate insulin secretion downstream of the HNF transcription-factor
      lesion, providing an alternative secretagogue that exploits the same intact
      effector node.
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other treatment options include meglitinides."
    explanation: >-
      Supports meglitinides as an alternative secretagogue option in HNF1A-MODY.
- name: Statin Therapy (HNF1A-MODY)
  description: >-
    HNF1A-MODY carries increased cardiovascular risk (despite characteristically
    elevated HDL), so guidelines recommend statin therapy from age 40.
  role: treatment
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with HNF1A-MODY should also be treated with statins by age 40 years due to increased cardiovascular risk"
    explanation: >-
      Supports statin therapy from age 40 in HNF1A-MODY for cardiovascular-risk
      reduction.

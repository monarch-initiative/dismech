name: Maturity-Onset Diabetes of the Young
creation_date: '2026-11-21T00:00:00Z'
category: Mendelian
description: 'Maturity-onset diabetes of the young (MODY) is autosomal dominant, non-autoimmune diabetes
  caused by a heterozygous variant in one of a set of genes governing pancreatic beta-cell development
  or insulin secretion, usually presenting in adolescence or early adulthood. The genes act by different
  routes: loss of a transcription factor (HNF1A, HNF4A, HNF1B, PDX1, NEUROD1, RFX6) gives progressive
  secretory failure; inactivating GCK variants raise the glucose threshold for insulin release and give
  mild, stable fasting hyperglycaemia; K-ATP channel (ABCC8, KCNJ11) and insulin-gene (INS) variants,
  which more often cause neonatal diabetes, are rare MODY causes; and CEL-MODY begins as exocrine pancreatic
  disease. The route sets the treatment: HNF1A-MODY responds to sulfonylureas, while GCK-MODY usually
  needs none.'
disease_term:
  preferred_term: maturity-onset diabetes of the young
  term:
    id: MONDO:0018911
    label: maturity-onset diabetes of the young
parents:
- Monogenic Diabetes
synonyms:
- MODY
notes: Curated as one genetically heterogeneous entry with a subtype per gene, the pattern this knowledge
  base uses for other locus-heterogeneous Mendelian diseases; a gene form with enough distinct mechanism
  and treatment content can later be promoted to its own entry with a curated_in pointer left here. MONDO
  also numbers MODY types 7 (KLF11), 9 (PAX4), 11 (BLK) and 14 (APPL1). Those genes are recorded as DISPUTED
  genetic rows rather than subtypes, because re-analysis against population and case-control data does
  not support them and ClinGen has refuted three of them; the evidence is on each row. MONDO's MODY type
  5 is the renal cysts and diabetes syndrome subtype here.
has_subtypes:
- name: maturity-onset diabetes of the young type 1
  subtype_term:
    preferred_term: maturity-onset diabetes of the young type 1
    term:
      id: MONDO:0007452
      label: maturity-onset diabetes of the young type 1
  classification: mondo_nested_subclass
  genes:
  - preferred_term: HNF4A
    term:
      id: hgnc:5024
      label: HNF4A
  description: >-
    HNF4A-MODY (OMIM:125850). One of the three commonest MODY forms, clinically
    close to HNF1A-MODY and likewise characterised by progressive loss of
    beta-cell function and sulfonylurea responsiveness.
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The clinical presentation of HNF4A-MODY patients is similar to that of HNF1A-MODY and is characterized by a progressive decline in beta cell function.
    explanation: Characterises the HNF4A form of MODY and its progressive beta-cell course.
- name: maturity-onset diabetes of the young type 2
  subtype_term:
    preferred_term: maturity-onset diabetes of the young type 2
    term:
      id: MONDO:0007453
      label: maturity-onset diabetes of the young type 2
  classification: mondo_nested_subclass
  genes:
  - preferred_term: GCK
    term:
      id: hgnc:4195
      label: GCK
  description: >-
    GCK-MODY (OMIM:125851). Heterozygous inactivating glucokinase variants raise
    the glucose set point at which beta cells release insulin, giving mild,
    stable, non-progressive fasting hyperglycaemia rather than a deteriorating
    secretory defect.
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Heterozygous inactivating GCK mutations lead to a decreased sensitivity of pancreatic beta cells in response to increasing glucose concentrations and consequently result in an increased set point for glucose-stimulated insulin secretion.
    explanation: States the glucose-sensing mechanism that distinguishes this subtype from the transcription-factor MODYs.
- name: maturity-onset diabetes of the young type 3
  subtype_term:
    preferred_term: maturity-onset diabetes of the young type 3
    term:
      id: MONDO:0010894
      label: maturity-onset diabetes of the young type 3
  classification: mondo_nested_subclass
  genes:
  - preferred_term: HNF1A
    term:
      id: hgnc:11621
      label: HNF1A
  description: >-
    HNF1A-MODY (OMIM:600496). The commonest MODY form in most series, with a
    glucose-stimulated insulin secretory defect that worsens over time and
    marked sulfonylurea sensitivity.
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Insulin secretion in response to glucose is reduced in patients with heterozygous HNF1A mutations, and secretory defects worsen over time as a result of the progressive beta cell dysfunction.
    explanation: States the progressive secretory defect that defines this subtype.
- name: maturity-onset diabetes of the young type 4
  subtype_term:
    preferred_term: maturity-onset diabetes of the young type 4
    term:
      id: MONDO:0011667
      label: maturity-onset diabetes of the young type 4
  classification: mondo_nested_subclass
  genes:
  - preferred_term: PDX1
    term:
      id: hgnc:6107
      label: PDX1
  description: >-
    PDX1-MODY (OMIM:606392). PDX1 encodes a transcription factor governing
    pancreatic development and beta-cell maturation; heterozygous variants are a
    rare, low-penetrance cause of MODY, while biallelic loss causes pancreatic
    agenesis.
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Mutations in PDX1 represent a rare subtype of monogenic diabetes and are associated with several disorders, including pancreatic agenesis (or congenital pancreatic hypoplasia), permanent neonatal diabetes, or MODY.
    explanation: Places PDX1 variants across the monogenic diabetes spectrum including MODY.
  - reference: PMID:40779032
    reference_title: "Rare Variants in NEUROD1 and PDX1 Are Low-Penetrance Causes of MODY, Whereas Those in APPL1 and WFS1 Are Not Associated With MODY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In contrast, variants in NEUROD1 and PDX1 were enriched, albeit at levels comparable to RFX6.
    explanation: Rare-variant burden evidence supporting PDX1 as a genuine, low-penetrance MODY gene.
- name: maturity-onset diabetes of the young type 6
  subtype_term:
    preferred_term: maturity-onset diabetes of the young type 6
    term:
      id: MONDO:0011668
      label: maturity-onset diabetes of the young type 6
  classification: mondo_nested_subclass
  genes:
  - preferred_term: NEUROD1
    term:
      id: hgnc:7762
      label: NEUROD1
  description: >-
    NEUROD1-MODY (OMIM:606394). Rare heterozygous NEUROD1 variants are enriched
    in MODY cohorts at a level comparable to the low-penetrance MODY gene RFX6,
    so the subtype is real but not highly penetrant.
  evidence:
  - reference: PMID:40779032
    reference_title: "Rare Variants in NEUROD1 and PDX1 Are Low-Penetrance Causes of MODY, Whereas Those in APPL1 and WFS1 Are Not Associated With MODY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In summary, rare heterozygous variants in NEUROD1 and PDX1 are low-penetrance causes of MODY, while those in APPL1 and WFS1 lack robust genetic evidence for causality and should not be included in MODY testing panels.
    explanation: The burden study's own summary of NEUROD1 as a low-penetrance MODY cause.
- name: maturity-onset diabetes of the young type 8
  subtype_term:
    preferred_term: maturity-onset diabetes of the young type 8
    term:
      id: MONDO:0012348
      label: maturity-onset diabetes of the young type 8

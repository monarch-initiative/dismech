- name: Glycosuria
  description: >-
    In HNF1A-MODY, reduced renal SGLT2-mediated glucose reabsorption produces
    glycosuria that can appear at near-normal blood glucose, a diagnostic clue.
  subtype: HNF1A-MODY
  phenotype_term:
    preferred_term: Glycosuria
    term:
      id: HP:0003076
      label: Glycosuria
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "due to the reduced glucose reabsorption by the kidney, glycosuria is frequently present"
    explanation: >-
      Supports glycosuria as a characteristic HNF1A-MODY feature.
- name: Fetal macrosomia and transient neonatal hypoglycemia
  description: >-
    HNF4A mutations cause in-utero hyperinsulinemia in about half of carriers,
    producing large-for-gestational-age birth weight and transient neonatal
    hypoglycemia before later beta-cell decline and diabetes.
  subtype: HNF4A-MODY
  phenotype_term:
    preferred_term: Large for gestational age

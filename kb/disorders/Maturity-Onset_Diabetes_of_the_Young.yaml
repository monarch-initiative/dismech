inheritance:
- name: Autosomal dominant monogenic beta-cell diabetes
  description: >-
    MODY is inherited in an autosomal-dominant manner with high penetrance;
    a single pathogenic variant in a beta-cell gene (most commonly GCK, HNF1A,
    HNF4A, or HNF1B) is sufficient to cause disease, producing the characteristic
    multigenerational family history of early-onset diabetes.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MODY represents a clinically heterogeneous group of autosomal-dominant disorders caused by mutations in genes involved in beta cell development and insulin secretion"
    explanation: >-
      Establishes MODY as an autosomal-dominant, single-gene group of beta-cell
      diabetes distinct from the autoimmune and insulin-resistant common types.
pathophysiology:
- name: Monogenic Beta-Cell Dysfunction
  description: >-
    The shared upstream lesion of all MODY forms: a heterozygous pathogenic
    variant in a gene required for pancreatic beta-cell development or
    glucose-stimulated insulin secretion. Rather than autoimmune destruction or
    peripheral insulin resistance, MODY is a primary, cell-autonomous defect in
    the beta cell's ability to sense glucose and secrete insulin appropriately.
    GCK, HNF1A, and HNF4A together account for roughly 85-90% of cases.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: insulin secretion
    term:
      id: GO:0030073
      label: insulin secretion
    modifier: ABNORMAL
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Monogenic diabetes is due to single gene defects that primarily affect beta cell function with more than 30 different genes reported."
    explanation: >-
      Supports MODY/monogenic diabetes as a single-gene beta-cell-function
      disorder, the shared upstream mechanism of this entry.
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations in GCK, HNF1A, and HNF4A are the most common causes of MODY, representing 52, 10, and 32% of MODY cases in the UK, respectively"
    explanation: >-
      Supports the dominance of the GCK/HNF1A/HNF4A subtypes among MODY cases.
  downstream:
  - target: GCK Glucose-Sensor Set-Point Shift
    description: >-
      The GCK-MODY branch: the causative lesion is in the glucokinase glucose
      sensor, resetting the threshold for insulin release rather than
      progressively destroying secretory capacity. This branch is benign — it
      does NOT connect to the chronic-hyperglycemia complication node — which is
      the graph-level reason GCK-MODY needs no glucose-lowering therapy.
    evidence:
    - reference: PMID:29931562
      reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Heterozygous inactivating GCK mutations lead to a decreased sensitivity of pancreatic beta cells in response to increasing glucose concentrations and consequently result in an increased set point for glucose-stimulated insulin secretion."
      explanation: >-
        Supports the GCK-arm branch: the monogenic lesion acts at the glucose
        sensor to reset the secretion set point.
  - target: HNF Transcription-Factor Network Failure and Progressive Secretory Decline
    description: >-
      The transcription-factor-MODY branch (HNF1A/HNF4A/HNF1B): the causative
      lesion is in a beta-cell transcription factor, progressively eroding the
      insulin-secretory program. This branch feeds the druggable KATP effector
      node and the chronic-hyperglycemia complication cascade.
    evidence:
    - reference: PMID:29931562
      reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Insulin secretion in response to glucose is reduced in patients with heterozygous HNF1A mutations, and secretory defects worsen over time as a result of the progressive beta cell dysfunction."
      explanation: >-
        Supports the HNF-arm branch: the monogenic lesion progressively reduces
        glucose-stimulated insulin secretion.
- name: GCK Glucose-Sensor Set-Point Shift
  description: >-
    In GCK-MODY (MODY2), heterozygous inactivating variants in glucokinase — the
    beta-cell glucose sensor that couples intracellular glucose concentration to
    insulin secretion — raise the glucose threshold at which insulin is released.
    The result is a regulated, upward-reset glucose set point producing mild,
    stable, non-progressive fasting hyperglycemia rather than progressive
    beta-cell failure. Because glucose homeostasis is merely reset (not
    deteriorating), GCK-MODY does not accrue the diabetic complication burden of
    other diabetes forms.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  molecular_functions:
  - preferred_term: glucokinase activity
    term:
      id: GO:0004340
      label: glucokinase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous inactivating GCK mutations lead to a decreased sensitivity of pancreatic beta cells in response to increasing glucose concentrations and consequently result in an increased set point for glucose-stimulated insulin secretion."
    explanation: >-
      Supports the raised glucose set-point mechanism of GCK-MODY.
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite lifelong hyperglycemia, patients with GCK mutations have a prevalence and severity of microvascular and macrovascular complications similar to that of controls without diabetes"
    explanation: >-
      Supports the complication-free course that distinguishes GCK-MODY from the
      transcription-factor MODY forms and from common diabetes.
- name: HNF Transcription-Factor Network Failure and Progressive Secretory Decline
  description: >-
    In the transcription-factor MODY forms (HNF1A/MODY3, HNF4A/MODY1,
    HNF1B/MODY5), the hepatocyte nuclear factors normally drive expression of the
    insulin gene and of genes for beta-cell glucose transport and metabolism.
    Loss of one functional allele progressively erodes glucose-stimulated insulin
    secretion, so unlike the stable GCK form these subtypes show worsening
    hyperglycemia over time and, with inadequate control, the full diabetic
    complication cascade.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: insulin secretion
    term:
      id: GO:0030073
      label: insulin secretion
    modifier: DECREASED
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In pancreatic beta cells, these transcription factors regulate the expression of the insulin gene as well as the expression of other genes involved in glucose transport and metabolism"
    explanation: >-
      Supports the transcription-factor mechanism shared by HNF1A/HNF4A/HNF1B
      MODY.
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Insulin secretion in response to glucose is reduced in patients with heterozygous HNF1A mutations, and secretory defects worsen over time as a result of the progressive beta cell dysfunction."
    explanation: >-
      Supports the progressive secretory decline of HNF1A-MODY, contrasting with
      the stable GCK form.
  downstream:
  - target: Beta-Cell KATP-Channel-Dependent Insulin Secretion
    description: >-
      The HNF transcription-factor program drives the insulin gene and the
      secretory machinery upstream of the KATP channel; its progressive failure
      under-drives glucose-stimulated insulin secretion. Crucially, the distal
      KATP-channel effector itself remains intact, so it can be pharmacologically
      forced — this is the graph-level reason HNF1A/HNF4A-MODY are
      sulfonylurea-sensitive.
    evidence:
    - reference: PMID:29931562
      reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In pancreatic beta cells, these transcription factors regulate the expression of the insulin gene as well as the expression of other genes involved in glucose transport and metabolism"
      explanation: >-
        Supports that the HNF program acts upstream of the KATP secretory
        effector, which the transcription-factor lesion does not itself destroy.
- name: Beta-Cell KATP-Channel-Dependent Insulin Secretion
  description: >-
    The final common effector of glucose-stimulated insulin secretion: beta-cell
    glucose metabolism raises the ATP/ADP ratio, closing the ATP-sensitive
    potassium (KATP) channel (Kir6.2/SUR1), which depolarizes the cell and
    triggers calcium-dependent insulin exocytosis. In the transcription-factor
    MODY forms this effector is structurally intact but under-driven by the
    failing HNF program; because sulfonylureas bind SUR1 and close the KATP
    channel directly, they bypass the upstream deficit and restore insulin
    secretion — the mechanistic basis of sulfonylurea sensitivity. (The same
    channel is the primary lesion in KCNJ11/ABCC8 neonatal diabetes.)
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: insulin secretion
    term:
      id: GO:0030073
      label: insulin secretion
    modifier: DECREASED
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ABCC8 and KCNJ11 genes encode the sulfonylurea receptor 1 (SUR1) and inward rectifier potassium channel Kir6 (Kir6.2) subunits of the ATP-sensitive potassium (KATP) channel in the pancreatic beta cell, regulating insulin secretion."
    explanation: >-
      Supports the KATP channel (SUR1/Kir6.2) as the beta-cell insulin-secretion
      effector and the molecular target of sulfonylureas.
  downstream:
  - target: Chronic Hyperglycemia and Vascular Complication Risk (Transcription-Factor MODY)
    description: >-
      When the failing HNF program under-drives this KATP-dependent secretory
      effector, insulin output is insufficient for the glucose load, producing
      the sustained hyperglycemia that enters the diabetic vascular-complication
      cascade.
    evidence:
    - reference: PMID:29931562
      reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Insulin secretion in response to glucose is reduced in patients with heterozygous HNF1A mutations, and secretory defects worsen over time as a result of the progressive beta cell dysfunction."
      explanation: >-
        Supports reduced insulin secretion as the proximate cause of the chronic
        hyperglycemia feeding the complication cascade.
- name: Chronic Hyperglycemia and Vascular Complication Risk (Transcription-Factor MODY)
  description: >-
    In the progressive transcription-factor MODY forms (HNF1A, HNF4A), sustained
    hyperglycemia is the shared entry point to the conserved diabetic
    vascular-complication cascade captured by the diabetic_vascular_complications
    module (chronic hyperglycemia -> oxidative and AGE-RAGE stress -> endothelial
    dysfunction and vascular inflammation -> micro- and macrovascular injury ->
    diabetic end-organ complications). Whatever the upstream route to
    hyperglycemia (here a monogenic beta-cell transcription-factor defect rather
    than autoimmunity or insulin resistance), the downstream complication
    mechanism is shared, and complication rates track glycemic control just as in
    common diabetes. GCK-MODY is the deliberate exception — its regulated,
    non-progressive glucose set point does not feed this cascade (see the GCK
    node), so this conformance is scoped to the transcription-factor forms.
  conforms_to: "diabetic_vascular_complications#Chronic Hyperglycemia"
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: glucose homeostasis
    term:
      id: GO:0042593
      label: glucose homeostasis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diabetic complications occur at rates similar to types 1 and type 2 diabetes and are strongly related to glycemic control."
    explanation: >-
      Supports that transcription-factor MODY (here HNF4A-MODY) shares the
      chronic-hyperglycemia complication cascade of common diabetes, the basis
      for conformance to the diabetic vascular-complications module.

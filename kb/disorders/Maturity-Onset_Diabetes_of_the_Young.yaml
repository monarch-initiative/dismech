      id: hgnc:11630
      label: HNF1B
  description: >-
    The HNF1B form, renal cysts and diabetes syndrome (OMIM:137920), also
    numbered MODY5. Diabetes here arises from combined beta-cell dysfunction and
    insulin resistance, and the renal and genital tract malformations often
    dominate the presentation; whole-gene deletions are a common mechanism.
  evidence:
  - reference: PMID:29931562

name: Neuronopathy, Distal Hereditary Motor, Autosomal Recessive 7
creation_date: "2026-09-18T00:00:00Z"
category: Genetic
description: >
  Autosomal recessive distal hereditary motor neuronopathy type 7 (HMNR7; also
  indexed as HMNMYO, "neuropathy, hereditary motor, with myopathic features")
  is caused by biallelic loss-of-function variants in VWA1, which encodes the
  von Willebrand factor A domain-related protein WARP — an extracellular matrix
  protein of muscle and peripheral nerve that interacts with collagen VI and
  perlecan. That is unusual for this family, whose other causal genes cluster on
  motor-axon housekeeping functions — chaperone-mediated protein quality
  control, axonal transport, tRNA charging and RNA metabolism,
  endoplasmic-reticulum function, cation channels — and the clinical picture
  departs from the family template in two ways that follow from it. First, the neuropathy is
  non-length-dependent: onset is distal, with foot deformity and foot drop in
  the first years of life, but weakness commonly involves the proximal lower
  limbs as severely as the distal ones, which is what prompts the differential
  against SMA with lower-extremity predominance rather than against a
  length-dependent dying-back neuropathy. Second, a myopathic component sits
  alongside the neurogenic one — raised creatine kinase, myopathic units on
  needle EMG in a minority, dystrophic muscle biopsies in a minority, and a
  vastus lateralis MRI pattern that mimics collagen VI-related myopathy — which
  led the two independent 2021 cohorts to name the condition differently
  (Deschauer et al. "neuromyopathy"; Pagnamenta et al. "hereditary motor
  neuropathy"). Whether the muscle involvement is a primary matrix lesion or a
  consequence of chronic denervation is unsettled and is curated here as an
  explicit controversy. A single 10 bp duplication in exon 1,
  NM_022834.5:c.62_71dup p.(Gly25ArgfsTer74), is a Western European founder
  allele carried by roughly 1 person in 441, and Pagnamenta et al. estimate that
  biallelic VWA1 variants may explain up to 1% of otherwise unsolved hereditary
  motor neuropathy in Europeans — so this is a rare disease with a common allele,
  and much of its burden is undiagnosed rather than absent. Disease course is
  slow; most reported patients remain ambulant into adult life.

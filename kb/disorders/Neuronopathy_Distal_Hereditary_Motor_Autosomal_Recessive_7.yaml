- name: Muscle Extracellular Matrix Remodeling
  biological_scale: TISSUE
  role: contested parallel lesion
  description: >
    An abnormality of the muscle extracellular space itself in patients lacking
    WARP, independent of any denervation. Proteomic profiling of patient white

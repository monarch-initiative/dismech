- category: Neurologic
  name: Motor axonal neuropathy
  frequency: OBLIGATE
  diagnostic: true
  description: >
    A pure or predominantly motor axonal neuropathy on nerve conduction
    studies: motor action potentials reduced or absent with conduction
    velocities preserved, and sensory studies normal in most patients. It is the
    finding on which the diagnosis is built. Sensory involvement is the
    exception rather than the rule — three of seventeen in the first cohort had
    an abnormal sensory examination, supported neurophysiologically in only one,
    and three of twenty in the second cohort had sensory involvement.
  phenotype_term:
    preferred_term: Motor axonal neuropathy
    term:
      id: HP:0007002
      label: Motor axonal neuropathy
  evidence:
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Available nerve conduction studies typically revealed findings consistent with a motor axonal neuropathy which was often interpreted as suggestive of a distal spinal muscular atrophy/hereditary motor neuropathy."
    explanation: Establishes the motor axonal pattern and the diagnostic label it is usually given.
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three isolated cases had an abnormal sensory examination and this was supported by neurophysiological evidence in only one of them showing asymmetrical sural nerve involvement (Family 6)."
    explanation: Quantifies how uncommon sensory involvement is, which is what keeps this a motor rather than sensorimotor neuropathy.

      snippet: "Nerve conduction studies consistently indicated axonal motor neuropathy with sensory involvement in three cases, accompanied by chronic neuropathic changes in needle EMG."
      explanation: Confirms the axonal motor pattern across the second large cohort.
  - target: Distal lower limb muscle weakness
    causal_link_type: DIRECT

- name: Impaired Motor Axon Outgrowth and Neuromuscular Junction Formation
  biological_scale: CELLULAR
  role: developmental effector step
  description: >
    In the zebrafish model, loss of the vwa1 orthologue significantly reduces
    spinal motor neuron growth measured across days 2 to 4 of development, with
    aberrant axon structures from day 3, sparser and disorganised myofibres, and
    significantly reduced synapse formation in skeletal muscle measured by
    acetylcholine receptor staining, followed by reduced locomotive behaviour. This places the defect early — at the point where motor
    axons grow out and form endplates — rather than at a later dying-back stage,
    which fits the human observation that foot deformity and tendon contracture
    are present from the first years of life and were congenital in two cases.
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: motor axon extension
    term:
      id: GO:0048675
      label: axon extension
    modifier: DECREASED
  - preferred_term: neuromuscular junction development
    term:
      id: GO:0007528
      label: neuromuscular junction development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CRISPR and morpholino vwa1 modelling in zebrafish demonstrated reductions in motor neuron axonal growth, synaptic formation in the skeletal muscles and locomotive behaviour."
    explanation: Summarises the three model readouts that define this node — axon growth, synapse formation, and locomotion.
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Phenotypic assessment of the vwa1 crispants/morphants demonstrated a prominent effect on motor neurons including shorter axons and abnormal growth."
    explanation: The primary axon-growth observation behind this node.
  notes: >-
    Marked PROVISIONAL because the whole node rests on a zebrafish model. No
    human material has been examined for a developmental axon-outgrowth or
    endplate defect, and the zebrafish also showed a jaw cartilage phenotype
    that the authors explicitly note is not seen in patients.
  downstream:
  - target: Non-Length-Dependent Motor Axon Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A developmental deficit in motor axon growth and endplate formation is
      offered by the authors as the origin of the human motor neuropathy, but

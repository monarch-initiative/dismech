genetic:
- name: VWA1
  gene_term:
    preferred_term: VWA1
    term:
      id: hgnc:30910
      label: VWA1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Biallelic loss-of-function variants in VWA1 are the sole established cause
    of this condition. The gene encodes the 445-amino-acid extracellular matrix
    protein WARP, whose highest expression among human tissues surveyed is in
    tibial nerve.
  evidence:
  - reference: PMID:33459760
    reference_title: "Bi-allelic truncating mutations in VWA1 cause neuromyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We detected six different truncating variants in 15 affected individuals from six families of German, Arabic, and Roma descent."
    explanation: Independent multi-family evidence for biallelic truncating VWA1 variants as the cause.
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified 17 individuals from 15 families with an autosomal-recessive, non-length dependent, hereditary motor neuropathy and rare biallelic variants in VWA1"
    explanation: The concurrent, independently ascertained cohort establishing the same gene-disease relationship.
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "In humans, VWA1 (von Willebrand factor A domain containing 1) encodes a 445 amino acid ECM protein that is also referred to as von Willebrand factor A domain related protein (WARP)."
    explanation: >-
      Gives the protein length and the WARP synonym; the sentence restates
      established gene-product biology rather than reporting a new result.
  - reference: PMID:35942667
    reference_title: Hereditary motor neuropathies.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Thanks to international cooperation between researchers, new genes have been implicated in dHMN, such as SORD and VWA1 ."
    explanation: A review of the family places VWA1 among its established causal genes.
  variants:
  - name: NM_022834.5:c.62_71dup p.(Gly25ArgfsTer74)
    description: >
      A 10 bp duplication in exon 1 of VWA1, expanding an existing 2-copy 10 bp
      repeat to 3 copies, producing a frameshift with a premature stop 74 codons
      downstream. It is the disease-defining allele: present in 14 of 15
      families in the first reported cohort and 12 of 15 in the second, and
      carried on a shared 220 kb European founder haplotype. Its GC-rich,
      repetitive context gives poor sequencing coverage, which is why the gene
      evaded discovery and why cases are still missed on standard exome
      pipelines. Maximum population allele frequency in gnomAD v4.0.0 is 0.093%
      in European non-Finnish and 0.118% in UK Biobank.
    clinical_significance: PATHOGENIC
    gene:
      preferred_term: VWA1
      term:
        id: hgnc:30910
        label: VWA1
    evidence:
    - reference: PMID:39502942
      reference_title: "Autosomal recessive VWA1-related disorder: comprehensive analysis of phenotypic variability and genetic mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This variant involves an expansion of a 10 bp repeat in Exon 1 of VWA1, leading to three copies instead of two compared with normal alleles."
      explanation: Describes the exact structure of the founder allele.
    - reference: PMID:39502942
      reference_title: "Autosomal recessive VWA1-related disorder: comprehensive analysis of phenotypic variability and genetic mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The maximum population allele frequency of the most common variant across all databases remained the highest in the European non-Finnish with 0.093% in gnomAD v4.0.0 and 0.118% in UK Biobank"
      explanation: Gives the population allele frequencies quoted in this record.
    - reference: PMID:33559681
      reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Haplotype analysis identified a shared 220 kb region suggesting that this founder mutation arose >7000 years ago."
      explanation: Establishes the founder haplotype and its estimated age.
    - reference: PMID:33559681
      reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This novel disease gene may have previously evaded detection because of high GC content, consequential low coverage and computational difficulties associated with robustly detecting repeat-expansions."
      explanation: Explains the technical reason this allele is missed, which is the entry's main diagnostic point.
  notes: >-
    Beyond the founder allele, the reported variant spectrum is dominated by
    truncating changes — stop-gains and frameshifts — with a small number of
    missense changes at proline residues. The second cohort reported 13
    additional variants, 11 of them previously undescribed, 12 seen in compound
    heterozygosity and 8 of those in trans with the founder allele. A reciprocal
    10 bp deletion at the same locus (c.62_71del10, p.G21Afs*12) is more
    common than the duplication in a Middle Eastern-enriched commercial cohort
    and was speculated by Pagnamenta et al. to be a second founder allele, but
    no biallelic case carrying it has been reported; it is recorded here as a
    lead, not as an established disease allele.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Both alleles of VWA1 must be inactivated. Homozygosity for the founder
    allele and compound heterozygosity for the founder allele with a second
    truncating variant are both common; consanguinity is reported but is not the
    usual setting — the fifteen families of the 2024 cohort were mostly
    non-consanguineous, with consanguinity in two, of Iranian and Pakistani
    origin. The reported pedigrees are
    overwhelmingly sporadic — only one of fifteen families in the first cohort
    had a positive family history.
  evidence:
  - reference: PMID:33459760
    reference_title: "Bi-allelic truncating mutations in VWA1 cause neuromyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings establish VWA1 as a new disease gene confidently implicated in this autosomal recessive neuromyopathic condition"
    explanation: States the mode of inheritance directly.
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Positive family history was reported only in Family 13, while the rest of the cases were sporadic."
    explanation: Records that the recessive condition presents sporadically in nearly all families.
prevalence:
- population: UK and Western European population
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 226.8
  rate_denominator: POPULATION
  notes: >-
    Carrier frequency for the single founder allele c.62_71dup, reported as
    approximately 1 in 441; 100000/441 = 226.8 per 100,000. This is a carrier
    rate for one allele, not a disease prevalence, and the two must not be
    compared. The same paper separately estimates the allele frequency of
    c.62_71dup at 1/847 in the European population, from which it infers that up
    to 100 individuals in the UK may be homozygous or compound heterozygous.
  evidence:
  - reference: PMID:39502942
    reference_title: "Autosomal recessive VWA1-related disorder: comprehensive analysis of phenotypic variability and genetic mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "reaffirming the 10 bp insertion-induced p.Gly25ArgfsTer74 as the most prevalent disease-causing allele, with a carrier frequency of ∼1 in 441 in the UK and Western European population"
    explanation: The source of the carrier frequency recorded here.
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No point prevalence has been published for this condition. As of the 2024
    review the published literature totalled 54 patients. That count is not a
    prevalence estimate and is widely believed to understate the disease: the
    gene's discoverers estimate biallelic VWA1 variants may account for up to 1%
    of unexplained hereditary motor neuropathy in Europeans, a diagnostic-yield
    fraction rather than a population rate.
  evidence:
  - reference: PMID:39502942
    reference_title: "Autosomal recessive VWA1-related disorder: comprehensive analysis of phenotypic variability and genetic mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Results are based on data from 54 patients (n = 20 from presented cohort and n = 34 from previous publications)."
    explanation: Gives the total number of patients reported in the literature at that time.
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we estimate that biallelic variants in VWA1 may be responsible for up to 1% of unexplained hereditary motor neuropathy cases in Europeans"
    explanation: The diagnostic-yield estimate that bounds how far the published case count understates the burden.
progression:
- phase: Congenital to early childhood onset
  age_range: birth to 12 years
  notes: >-
    Onset ranged from birth to 12 years in the second cohort. Symptom
    recognition in the first cohort was at a mean of 2.0 plus or minus 1.4 years,
    with tip-toe walking, foot deformity and Achilles contracture; independent
    walking was achieved at a mean of 1.6 plus or minus 0.8 years and was
    markedly delayed where equinovarus was severe. Foot deformity and tendon
    contracture were congenital in two cases.
  evidence:
  - reference: PMID:39502942
    reference_title: "Autosomal recessive VWA1-related disorder: comprehensive analysis of phenotypic variability and genetic mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nonetheless, early-onset foot deformities, contractures, and gait abnormalities have been consistently reported in nearly all individuals with VWA1-related disorder, suggesting an early or even infantile disease onset rather than adult onset."
    explanation: States the age of onset and the authors' correction of the earlier impression of adult onset.
- phase: Slowly progressive adult course with preserved ambulation
  age_range: second decade onward
  notes: >-
    Progression is very slow and in several patients static, with isolated
    reports of worsening after the fifth decade. Ambulation is usually retained:
    three of seventeen in the first cohort lost independent walking over a
    median disease duration of 36.5 years, and none of the twenty patients in
    the second cohort had. Cardiac and respiratory involvement were not
    reported, and no neurocognitive symptoms were observed.
  evidence:
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, the disease progression was very slow or even static in several cases. Isolated cases reported some clinical worsening after the fifth decade of life."
    explanation: Characterises the rate of progression over the long observed course.
  - reference: PMID:39502942
    reference_title: "Autosomal recessive VWA1-related disorder: comprehensive analysis of phenotypic variability and genetic mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No associated neurocognitive symptoms were observed. Cardiac or respiratory involvement was not reported. Despite the diverse clinical manifestations, all affected individuals exhibited a slow disease progression and remained ambulatory at the time of investigations."
    explanation: Records the absence of cardiac, respiratory and cognitive involvement and the preserved ambulation.
clinical_burden:
  burden_level: MODERATE
  rationale: >
    Lifelong motor disability from early childhood, but rarely loss of
    ambulation and no reported cardiac, respiratory or cognitive involvement.
    The dominant burden is diagnostic rather than functional: the condition is
    described as going unnoticed for years to decades, is routinely mistaken for
    Charcot-Marie-Tooth disease, spinal muscular atrophy, hereditary spastic
    paraplegia or a muscular dystrophy, and the causal allele is systematically
    missed by standard sequencing pipelines because of its GC-rich repetitive
    context. Patients in the reported cohorts had already been tested for
    Duchenne muscular dystrophy, facioscapulohumeral dystrophy, SMA and
    dystonia panels before the right gene was found.
  evidence:
  - reference: PMID:39502942
    reference_title: "Autosomal recessive VWA1-related disorder: comprehensive analysis of phenotypic variability and genetic mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given the broad phenotypic presentation of the condition, several other patients received preceding genetic investigations including neuropathy/neuromuscular disorder panel, movement disorder/dystonia panel, testing for Duchenne muscle dystrophy, facioscapulohumeral muscular dystrophy and SMA."
    explanation: Documents the diagnostic odyssey that is the main burden of this condition.
  - reference: PMID:39502942
    reference_title: "Autosomal recessive VWA1-related disorder: comprehensive analysis of phenotypic variability and genetic mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, VWA1 should be included in multiple gene panels covering hereditary neuropathies, muscle dystrophies, hereditary spastic paraplegia and SMA to reduce diagnostic delay and identify a large number of undiagnosed individuals."
    explanation: States the authors' own reading of the burden — diagnostic delay and a large undiagnosed population.
histopathology:
- name: Neurogenic atrophy with fibre type grouping
  frequency: FREQUENT
  diagnostic: true
  description: >
    Muscle biopsy in most patients shows chronic neurogenic change: neurogenic
    atrophy, fascicular grouping of type 1 fibres, thickening of the endomysium
    and perimysium. Four of seven biopsies in the first cohort were reported as
    showing clear neurogenic changes.
  finding_term:
    preferred_term: neurogenic muscle atrophy with fibre type grouping
  evidence:
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biopsy shows predominantly neuropathic aspects with neurogenic atrophy (arrow) and thickening of the endomysium and perimysium. Fascicular grouping of type 1 fibres implicates a chronic neurogenic process."
    explanation: Describes the neurogenic biopsy picture in a named patient.
  notes: >-
    finding_term is left unbound. HP:0033685 (Fiber type grouping) is the
    closest term and is curated as a separate phenotype above; it names one
    component of this composite picture, not the picture. Searched HP with
    runoak -i sqlite:obo:hp search 't~neurogenic atrophy' (no results) and
    't~Neurogenic muscle' (returns only HP:0003202 Skeletal muscle atrophy and
    HP:0003701 Proximal muscle weakness, neither of which is a biopsy finding).
- name: Myopathic and dystrophic features
  frequency: OCCASIONAL
  description: >
    A minority of biopsies show myopathic change alongside the neurogenic
    change: marked variation in fibre size, fibre hypertrophy, increased
    endomysial fibrosis with endomysial and perimysial fatty infiltration,
    rimmed vacuoles in one case, fibre lobulation and whorling of myofibrils in
    another, and a dystrophic pattern with multiple ring fibres in one patient
    of the second cohort. Collagen VI labelling was normal wherever it was
    assessed, which is the single most important negative finding in this
    disease.
  finding_term:
    preferred_term: myopathic change with increased endomysial connective tissue
  evidence:
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Marked variation in fibres size and increased endomysial fibrosis with mostly perimysial fatty infiltration. Rimmed vacuoles are shown with an arrow."
    explanation: Describes the myopathic features in a named patient biopsy.
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Where data were available, immunohistochemical labelling for collagen VI appeared normal."
    explanation: >-
      Records the normal collagen VI labelling, the negative result that argues
      against a collagen VI-like primary matrix myopathy.
  notes: >-
    finding_term is unbound for the same reason as the moth-eaten record below:
    HP:0100297 Increased endomysial connective tissue exists but is outside the
    NCIT-rooted HistopathologyFindingTerm enum, so it is bound on the matching
    category Histopathology phenotype instead. NCIT searched with runoak
    -i sqlite:obo:ncit search 'l~Fibrosis' and 'l~Myopathic'; no morphologic
    finding term for endomysial fibrosis or for myopathic muscle change was
    returned.
- name: Motheaten muscle fibers
  frequency: OCCASIONAL
  diagnostic: false
  description: >
    Moth-eaten fibres on NADH-TR staining, recorded in one patient biopsy of the
    first cohort and explicitly annotated there as a non-specific finding. It is
    curated because it is part of the published biopsy description, not because
    it discriminates.
  finding_term:
    preferred_term: Motheaten muscle fibers
  evidence:
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NADH-TR shows the presence of moth-eaten fibres (non-specific finding)."
    explanation: Records the finding together with the authors' own statement that it is non-specific.
  notes: >-
    finding_term is unbound here even though HP:0100298 Motheaten muscle fibers
    exists, because the HistopathologyFindingTerm dynamic enum is rooted in the
    NCIT Histopathology Result branch (plus HP:0025461) and HP:0100298 is not
    reachable from it. The HP term is bound instead on the matching
    category Histopathology phenotype, following the convention used by
    Bethlem_Myopathy and Ullrich_Congenital_Muscular_Dystrophy. NCIT was
    searched with runoak -i sqlite:obo:ncit search 'l~Muscle Fiber' and
    'l~Denervation'; neither returns a morphologic finding term for this
    appearance.
imaging_findings:
- name: Fatty replacement of vastus lateralis and anterior lower leg
  modality: MRI
  frequency: FREQUENT
  diagnostic: true
  description: >
    T1-weighted muscle MRI shows increased signal or fatty replacement
    predominantly in the vastus lateralis and the anterior compartment of the
    lower legs.
  phenotype_term:
    preferred_term: Fatty replacement of skeletal muscle
    term:
      id: HP:0012548
      label: Fatty replacement of skeletal muscle
  evidence:
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This displayed increased signal intensity or fatty replacement predominantly in the vastus lateralis and anterior compartment of the lower legs on T1-weighted sequences suggesting chronic denervation"
    explanation: Gives the distribution of the MRI change and the authors' reading of it as denervation.
- name: Gene-specific whole-body muscle MRI pattern
  modality: MRI
  frequency: FREQUENT
  diagnostic: true
  description: >
    In a whole-body muscle MRI series of non-5q spinal muscular atrophy, all
    five patients with VWA1 variants shared a reproducible pattern: selective
    gluteus maximus involvement with iliopsoas sparing, sparing of gracilis and
    sartorius despite severe quadriceps involvement, and predominant peroneus
    involvement with relative sparing of extensor digitorum. The pattern was not
    exclusive — it was also seen in single patients with VRK1 and HEXB variants
    — but it is specific enough to be proposed as a pre-test guide to which gene
    to sequence.
  evidence:
  - reference: PMID:42662709
    reference_title: "Whole-Body Muscle MRI in Non-5q Spinal Muscular Atrophy: Patterns, Genotype Prediction, and Diagnostic Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In VWA1-related SMA, the pattern included selective gluteus maximus and quadriceps involvement with iliopsoas, gracilis, and sartorius preservation, and predominant peroneal involvement with relative extensor digitorum longus sparing."
    explanation: Describes the gene-specific imaging pattern recorded here.
  - reference: PMID:42662709
    reference_title: "Whole-Body Muscle MRI in Non-5q Spinal Muscular Atrophy: Patterns, Genotype Prediction, and Diagnostic Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "but was not exclusive because similar patterns were observed in 1 patient with a VRK1 pathogenic variant"
    explanation: >-
      States that the VWA1 imaging pattern is not exclusive to VWA1, which is
      the limit on the diagnostic claim this record makes.
  - reference: PMID:42662709
    reference_title: "Whole-Body Muscle MRI in Non-5q Spinal Muscular Atrophy: Patterns, Genotype Prediction, and Diagnostic Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, confirmation in larger cohorts is needed, although this is constrained by the rarity of these disorders."
    explanation: The authors' own statement of how far the pattern has been validated, which bounds its use as a diagnostic clue.
- name: Outside-in fatty replacement of vastus lateralis resembling collagen VI myopathy
  modality: MRI
  frequency: OCCASIONAL
  description: >
    An outside-in gradient of fatty replacement within the vastus lateralis, the
    pattern characteristic of collagen VI-related myopathy, reported in a single
    Spanish patient and separately in three patients of the whole-body MRI
    series. It is the imaging counterpart of the argument that the muscle is
    primarily affected, since the protein WARP binds is the one whose disorders
    produce that pattern.
  phenotype_term:
    preferred_term: Fatty replacement of skeletal muscle
    term:
      id: HP:0012548
      label: Fatty replacement of skeletal muscle
  evidence:
  - reference: PMID:41331965
    reference_title: "A Distinctive MRI Pattern Resembling Type VI Collagen Myopathy in Novel VWA1-Related Distal Hereditary Motor Neuronopathy With Myopathic Features in a Patient From Spain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle magnetic resonance imaging showed a distinctive outside-in pattern of fatty replacement in the vastus lateralis, resembling that seen in type VI collagen-related myopathies."
    explanation: The case report describing the pattern.
  - reference: PMID:42662709
    reference_title: "Whole-Body Muscle MRI in Non-5q Spinal Muscular Atrophy: Patterns, Genotype Prediction, and Diagnostic Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A distinctive outside-in pattern of fatty replacement in the vastus lateralis, resembling that seen in type VI collagen-related myopathies, was observed in 3 patients"
    explanation: Independent replication of the same pattern in a separate cohort.
- name: Moth-eaten pattern on muscle ultrasound
  modality: ULTRASOUND
  frequency: OCCASIONAL
  description: >
    Muscle ultrasound of the lower leg shows a moth-eaten pattern — round dark
    areas of surviving motor units against a background of increased echo
    intensity — which is the appearance of long-standing denervation without
    reinnervation. Nerve ultrasound was normal in all three patients examined.
  evidence:
  - reference: PMID:39502942
    reference_title: "Autosomal recessive VWA1-related disorder: comprehensive analysis of phenotypic variability and genetic mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In Families 8 and 12, muscle ultrasound demonstrated a moth-eaten pattern in the lower leg muscles, which can be seen in long-standing denervation without reinnervation."
    explanation: Describes the ultrasound pattern and its interpretation.
  notes: >-
    No ontology term is bound to this imaging finding. HP:0100298 Motheaten
    muscle fibers exists and is curated separately as a histopathology
    phenotype, but it names a histological fibre appearance on NADH-TR, not
    this ultrasound pattern of surviving motor units against fibrosed muscle;
    the two share a descriptive word and not a referent. Searched with runoak
    -i sqlite:obo:hp search 't~moth', whose only muscle hit is HP:0100298.
treatments:
- name: Physical Therapy and Contracture Management
  therapeutic_modality: BEHAVIORAL
  description: >
    Rehabilitation aimed at the contractures and the gait. Achilles tendon
    contracture, foot plantar flexion, knee and hip flexion contractures are
    present in more than half of patients and appear early, so they are the
    component of the disease most open to non-pharmacological management.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Achilles tendon contracture
    term:
      id: HP:0001771
      label: Achilles tendon contracture
  - preferred_term: Tip-toe gait
    term:
      id: HP:0030051
      label: Tip-toe gait
  notes: >-
    No trial, cohort or case series of any intervention in VWA1-related disease
    has been published. Two PubMed searches were run and every returned title
    and abstract read: VWA1[Title/Abstract] (46 records) and
    VWA1 AND (therapy[sb] OR treatment OR trial) (10 records). Neither returned
    a therapeutic study of this disease; the hits in the second are cancer,
    stroke, glaucoma and wound-healing expression studies that mention the gene.
    This treatment is recorded without efficacy evidence because it is standard
    management for the contractures the disease produces, not because a source
    evaluates it here; it deliberately carries no evidence block rather than a
    manufactured one.
- name: Ankle-Foot Orthosis for Foot Drop
  therapeutic_modality: DEVICE
  description: >
    Orthotic support for the bilateral foot drop that is the commonest
    functional problem. The device concept is carried as a qualifier because
    NCIT's Brace/Orthosis term is a medical device and is not reachable from
    Clinical Intervention or Procedure, so it cannot sit in the treatment_term
    slot.
  treatment_term:
    preferred_term: ankle-foot orthosis fitting
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: ankle-foot orthosis
        term:
          id: NCIT:C86054
          label: Brace
  target_phenotypes:
  - preferred_term: Foot dorsiflexor weakness
    term:
      id: HP:0009027
      label: Foot dorsiflexor weakness
  notes: >-
    Recorded as standard supportive management for foot drop, not as an
    intervention evaluated in this disease. No VWA1-specific orthotic study
    exists; see the note on the physical therapy record for the search that
    established this.
- name: Orthopedic Surgery for Foot Deformity
  therapeutic_modality: SURGERY
  description: >
    Corrective surgery for the fixed foot deformities — talipes equinovarus in a
    third of patients, pes cavus in two thirds — and for the tendon
    contractures.
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_phenotypes:
  - preferred_term: Talipes equinovarus
    term:
      id: HP:0001762
      label: Talipes equinovarus
  - preferred_term: Pes cavus
    term:
      id: HP:0001761
      label: Pes cavus
  notes: >-
    No published series reports surgical outcomes in VWA1-related disease. The
    record names a management option for a documented deformity rather than
    asserting that it has been evaluated here.
- name: Genetic Counseling and Targeted Founder Allele Testing
  therapeutic_modality: OTHER
  description: >
    Counselling for an autosomal recessive condition in which one allele is
    common enough in Western Europe that two unrelated carriers meeting is the
    usual genetic setting rather than consanguinity. The practical corollary is
    diagnostic: the founder duplication sits in a GC-rich repeat that standard
    exome pipelines under-call, so the authors of both original cohorts
    recommend targeted testing of VWA1 exon 1 and relaxed quality-control
    filters when re-analysing unsolved neuropathy exomes.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reviewing previously unsolved exomes using lower QC filters may generate further diagnoses."
    explanation: The concrete diagnostic recommendation this record exists to carry.
  - reference: PMID:39502942
    reference_title: "Autosomal recessive VWA1-related disorder: comprehensive analysis of phenotypic variability and genetic mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The study highlights the potential of lower quality control filters in exome analysis to enhance diagnostic yield of VWA1 disease that may account for up to 1% of unexplained hereditary neuropathies."
    explanation: Independent restatement of the same recommendation with the yield it is expected to deliver.
animal_models:
- name: vwa1 CRISPR knockout and morpholino knockdown zebrafish
  species: Zebrafish
  genotype: vwa1 CRISPR crispant and antisense morpholino knockdown, Tg(olig2:dsRed) background
  background: Tg(olig2:dsRed) transgenic reporter line
  publication: PMID:33559681
  description: >
    CRISPR crispants and morpholino morphants targeting exons 1-2 of the
    zebrafish vwa1 orthologue, whose protein shares 64.7% similarity across a
    408 amino acid overlap with human VWA1. Both models showed shortened and
    aberrantly branching spinal motor axons from day 2, sparser and disorganised
    myofibres on phalloidin staining, significantly reduced acetylcholine
    receptor staining with alpha-bungarotoxin, and a consistent trend at 5 days
    toward reduced distance moved and reduced velocity. They also showed an
    irregular jaw cartilage phenotype the authors state is not seen in patients.
  genes:
  - preferred_term: VWA1
    term:
      id: hgnc:30910
      label: VWA1
  modeled_mechanisms:
  - target: Impaired Motor Axon Outgrowth and Neuromuscular Junction Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The model is the only experimental evidence that WARP loss affects motor
      axon growth and endplate formation, and it is what the node is built on.
    limitations: >-
      The readouts are developmental and were taken at 48-96 hours
      post-fertilisation; human patients are studied decades later, and no human
      material has been examined for an endplate or axon-outgrowth defect.
      Morpholino knockdown carries well-known off-target risk, although the
      concordance with the CRISPR crispant mitigates it. The model also produces
      a jaw cartilage phenotype the authors state is not seen in patients, so
      the phenotypic correspondence is partial in the other direction too.
    readouts:
    - name: Spinal motor axon length at 48-96 hours post-fertilisation
      target: Impaired Motor Axon Outgrowth and Neuromuscular Junction Formation
      direction: DECREASED
      interpretation: Direct morphometric measure of the motor axon outgrowth deficit.
      evidence:
      - reference: PMID:33559681
        reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Vwa1 Crispants (n = 29) and morphants (n = 26) showed significantly shortened axons compared to controls (n = 22)."
        explanation: Reports the measurement, its direction, and the group sizes.
    - name: Acetylcholine receptor clustering by alpha-bungarotoxin staining
      target: Impaired Motor Axon Outgrowth and Neuromuscular Junction Formation
      direction: DECREASED
      interpretation: Measures endplate formation in skeletal muscle of the knockdown/knockout larva.
      evidence:
      - reference: PMID:33559681
        reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "examination of neuromuscular junctions, by targeting the acetylcholine receptors (AChR) using alpha-bungarotoxin stain, revealed significantly reduced synaptic formation in the skeletal muscles"
        explanation: Reports the endplate measurement and its direction.
    evidence:
    - reference: PMID:33559681
      reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results established that vwa1 is required for the proper organization of skeletal muscles and in the formation of neuromuscular junctions."
      explanation: The authors' own conclusion that the model is informative for this node.
- name: Vwa1 (WARP) knockout mouse
  species: Mouse
  genotype: Vwa1 global knockout by targeted gene replacement (WARP-null)
  publication: PMID:19279005
  description: >
    The global WARP-null mouse predates the human disease and is what made VWA1
    a candidate gene. The mice are healthy, viable and fertile with no overt
    abnormality, but show a significantly delayed response to acute painful
    stimulus and impaired fine motor coordination; the collagen VI microfibrillar
    matrix is severely reduced and mislocalised in peripheral nerve, fibrillar
    collagen deposition in the nerve matrix is reduced, and adjacent Schwann cell
    basement membranes partially fuse. Articular cartilage, intervertebral disc
    and skeletal muscle showed no detectable abnormality and basement membranes
    formed normally, which is a point against the primary-muscle-lesion model.
    The delayed nociceptive response has no clear human counterpart: impaired
    nociception was not frequently seen in the patient series.
  genes:
  - preferred_term: VWA1
    term:
      id: hgnc:30910
      label: VWA1
  modeled_mechanisms:
  - target: Depletion of WARP from Nerve and Muscle Basement Membrane
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      The mouse supplies the ultrastructural nerve-matrix lesion that gives this
      node its content, since no human nerve has been examined this way.
    limitations: >-
      It recapitulates the nerve arm and fails the muscle arm — WARP-deficient
      mice showed no histological or behavioural muscle pathology, so the mouse
      cannot be used to argue for the muscle side of this node. It also shows
      impaired nociception that was not frequently seen in patients, so the
      species mismatch runs in both directions.
    evidence:
    - reference: PMID:19279005
      reference_title: "Mice lacking the extracellular matrix protein WARP develop normally but have compromised peripheral nerve structure and function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Our data demonstrate that although WARP is not essential for basement membrane formation or musculoskeletal development, it has critical roles in the structure and function of peripheral nerves."
      explanation: >-
        The knockout study's own summary of what the model shows: a peripheral
        nerve lesion, which is the arm of this node it recapitulates.
  - target: Muscle Extracellular Matrix Remodeling
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      The knockout mouse shows no muscle pathology at all, which is the
      strongest single piece of evidence against a primary muscle lesion.
    limitations: >-
      A negative result in a mouse does not rule out a human primary muscle
      lesion: the mouse was not examined with the proteomic or matrix-specific
      methods later applied to patient muscle, and mouse and human skeletal
      muscle matrix composition differ. The finding constrains the hypothesis
      rather than closing it.
    evidence:
    - reference: PMID:19279005
      reference_title: "Mice lacking the extracellular matrix protein WARP develop normally but have compromised peripheral nerve structure and function."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "In contrast, other WARP-deficient tissues such as articular cartilage, intervertebral discs, and skeletal muscle showed no detectable abnormalities, and basement membranes formed normally."
      explanation: >-
        The primary negative result: removing WARP produced no detectable
        skeletal muscle abnormality, which is what this link records the model
        as failing to recapitulate.
    - reference: PMID:33559681
      reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "WARP-null mice showed that WARP does not have a critical role in stabilizing the ECM localization of collagen VI in muscle as WARP-deficient mice expressed no histological or behavioural evidence of muscle pathology"
      explanation: >-
        The human-disease paper reading the same negative mouse result as an
        argument against a primary muscle-matrix lesion; restated there, hence
        BACKGROUND.
  notes: >-
    Curated from the primary knockout paper PMID:19279005 and the reporter-gene
    localisation paper PMID:18314316, both fetched into the reference cache for
    this entry. Where PMID:33559681 restates those findings its quotes are
    marked BACKGROUND so the two roles stay distinguishable.
diagnosis:
- name: VWA1 sequencing with attention to the exon 1 repeat
  description: >
    Molecular diagnosis rests on detecting biallelic VWA1 variants. The
    practical difficulty is specific and technical: the founder allele is a
    10 bp duplication in a GC-rich 10 bp repeat in exon 1, a context that gives
    low coverage and defeats standard variant callers, so the diagnosis is
    missed on otherwise adequate exome data. Both original cohorts recommend
    re-analysis of unsolved neuropathy exomes at relaxed quality-control
    thresholds, and targeted Sanger sequencing of exon 1 in a screening cohort
    of 1341 unsolved neuropathy patients yielded three further diagnoses.
  evidence:
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In an attempt to replicate the results obtained from genome/exome sequencing, 1341 DNA samples from two independent cohorts of patients (374 from UK, 967 from Germany) with unsolved neuropathies were tested for the p.G25Rfs*74 founder mutation by screening exon 1 using a Sanger sequencing approach. This yielded three additional diagnoses"
    explanation: Reports the targeted-screening yield in unsolved neuropathy cohorts.
- name: Mixed neurogenic and myopathic electrodiagnostic pattern
  description: >
    The combination that should raise the question of this gene: an axonal
    motor neuropathy with preserved conduction velocities and normal sensory
    responses, chronic neurogenic change on needle EMG, and in a minority
    superimposed myopathic units, with raised creatine kinase. A whole-body
    muscle MRI pattern of gluteus maximus and quadriceps involvement with
    gracilis and sartorius sparing adds a pre-test imaging clue.
  evidence:
  - reference: PMID:42662709
    reference_title: "Whole-Body Muscle MRI in Non-5q Spinal Muscular Atrophy: Patterns, Genotype Prediction, and Diagnostic Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gene-specific imaging signatures, particularly for VRK1, DYNC1H1, and VWA1, can guide targeted genetic testing and support interpretation of variants of uncertain significance."
    explanation: States the diagnostic use the imaging pattern is proposed for.
differential_diagnoses:
- name: Spinal muscular atrophy with lower extremity predominance (DYNC1H1, BICD2)
  description: >
    The closest mimic. Both present with lower-limb-predominant weakness that is
    proximal as much as distal, tendon contractures, foot and spinal deformity
    and a forward-stooped posture, and both can show myopathic muscle biopsies.
  distinguishing_features:
  - >
    In the VWA1 series the upper limbs were involved in more than half the cases
    irrespective of severity, which is not the pattern in SMA with lower
    extremity predominance.
  evidence:
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, in our series, the upper limbs were involved in more than half of the cases irrespective of the disease severity, unlike spinal muscular atrophy with lower extremity predominance."
    explanation: States the discriminating feature directly.
- name: Distal hereditary motor neuropathy type I
  description: >
    The paediatric subset of VWA1 patients with only distal lower limb weakness,
    wasting and foot contractures is clinically indistinguishable from typical
    dHMN type I at that stage.
  distinguishing_features:
  - >
    Weakness in VWA1 disease tends to progress proximally with age, which the
    authors give as the feature separating it from that presentation. Raised
    creatine kinase and any myopathic element are further pointers away from a
    pure motor neuropathy.
  evidence:
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A subset of paediatric cases in our cohort with only distal lower limb weakness, wasting, and foot contractures resembled the typical distal hereditary motor neuropathy type I presentation"
    explanation: States the resemblance and the stage at which it holds.
- name: Hereditary spastic paraplegia
  description: >
    Patients with hyperreflexia, upgoing plantars and lower limb spasticity can
    be routed into a hereditary spastic paraplegia workup.
  distinguishing_features:
  - >
    The underlying electrophysiology in VWA1 disease is an axonal motor
    neuropathy with chronic neurogenic change on EMG, so nerve conduction
    studies and needle EMG are what separate the two.
  evidence:
  - reference: PMID:39502942
    reference_title: "Autosomal recessive VWA1-related disorder: comprehensive analysis of phenotypic variability and genetic mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hyperreflexia, especially when combined with spasticity, might mimic conditions on the hereditary spastic paraplegia spectrum."
    explanation: Names the mimic and the features that create it.
- name: Collagen VI-related dystrophies
  description: >
    The outside-in vastus lateralis fatty replacement seen on muscle MRI in
    several VWA1 patients is the pattern of collagen VI-related myopathy, and
    WARP binds collagen VI, so the two are connected as well as confusable.
  distinguishing_features:
  - >
    Collagen VI immunolabelling of muscle is normal in VWA1 patients, and the
    electrophysiology is neurogenic rather than purely myopathic.
  evidence:
  - reference: PMID:41331965
    reference_title: "A Distinctive MRI Pattern Resembling Type VI Collagen Myopathy in Novel VWA1-Related Distal Hereditary Motor Neuronopathy With Myopathic Features in a Patient From Spain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In one of these reports, as in the current case, the MRI pattern mimicked that of type VI collagen disorders."
    explanation: Records the imaging mimicry between the two conditions.
- name: Juvenile amyotrophic lateral sclerosis
  description: >
    Tongue fasciculation or atrophy in a young patient with progressive weakness
    is a classic pointer to juvenile ALS, and it occurs in VWA1 disease.
  distinguishing_features:
  - >
    VWA1 disease progresses very slowly or is static over decades and preserves
    ambulation in almost all reported patients, with a median disease duration
    of 36.5 years in the first cohort.
  evidence:
  - reference: PMID:39502942
    reference_title: "Autosomal recessive VWA1-related disorder: comprehensive analysis of phenotypic variability and genetic mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tongue fasciculation and/or atrophy favours the diagnosis of juvenile amyotrophic lateral sclerosis associated with several genes including SETX, SPTLC1, SPTLC2, ALS2, FUS and SIGMAR1."
    explanation: States the diagnostic pull of the sign toward juvenile ALS.
discussions:
- discussion_id: vwa1_primary_or_secondary_myopathy
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is the muscle involvement in VWA1-related disease a primary lesion of the
    muscle extracellular matrix, or a secondary consequence of chronic
    denervation?
  attaches_to:
  - pathophysiology#Myopathic Change in Skeletal Muscle
  - pathophysiology#Muscle Extracellular Matrix Remodeling
  - pathophysiology#Chronic Neurogenic Denervation of Skeletal Muscle
  - mechanistic_hypotheses#denervation_secondary_myopathy
  - mechanistic_hypotheses#primary_muscle_matrix_lesion
  rationale: >
    The two cohorts that described the disease concurrently, in the same
    journal and the same year, named it differently, and the disagreement has
    not been resolved by any subsequent study. It is not a naming quibble: the answer
    determines whether the entity belongs with the motor neuropathies or with
    the muscular dystrophies for the purposes of gene-panel design, and it
    determines what a future therapy would have to reach.

    For a secondary process: needle EMG was neurogenic in 10 of 12 studies and
    myopathic in a minority; four of seven biopsies were purely neurogenic;
    collagen VI immunolabelling was normal wherever assessed; the WARP-null
    mouse has no detectable skeletal muscle abnormality at all; and the
    histological features attributed to myopathy are known to occur in
    chronically denervated muscle.

    For a primary process: WARP is expressed in skeletal muscle as well as
    nerve and binds collagen VI, whose own disorders are muscular dystrophies;
    creatine kinase is raised in most patients and reached 2400 U/L; muscle MRI
    in several patients shows an outside-in vastus lateralis pattern typical of
    collagen VI myopathy rather than of denervation; proteomics found increased
    C-reactive protein and NEFM in the extracellular space of patient muscle;
    and a whole-body MRI series in which gracilis and sartorius were spared in
    all five VWA1 patients reads that sparing as evidence for a direct muscle
    effect.

    What would settle it: WARP immunostaining of patient muscle and nerve
    alongside quantitative matrix analysis, in patients whose denervation burden
    is measured independently; or a conditional muscle-restricted Vwa1 knockout.
    Neither has been reported.
  evidence:
  - reference: PMID:39502942
    reference_title: "Autosomal recessive VWA1-related disorder: comprehensive analysis of phenotypic variability and genetic mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nevertheless, the true myopathic nature of the disease remained controversial, with some proposing a primarily neurogenic pathology and a secondary myopathic process."
    explanation: States that the question is open and names both positions, which is exactly what this discussion records.
  - reference: PMID:42662709
    reference_title: "Whole-Body Muscle MRI in Non-5q Spinal Muscular Atrophy: Patterns, Genotype Prediction, and Diagnostic Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is therefore possible that the preservation of the sartorius and gracilis muscles in SMA indicates a pathophysiologic mechanism involving direct muscle effects and may provide information useful for interpreting VUS."
    explanation: The most recent argument for a direct muscle effect, from an imaging pattern rather than from histology.
  - reference: PMID:38652110
    reference_title: "Proteomic studies in VWA1-related neuromyopathy allowed new pathophysiological insights and the definition of blood biomarkers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, there is no common consent if the muscular affection is a secondary pathology based on vulnerability and dysfunction of motoric axons or if a primary muscle pathology is rather part of the clinical picture."
    explanation: An independent statement that no consensus exists, from the group that set out to test the question.
- discussion_id: vwa1_upper_motor_neuron_signs
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do some patients with biallelic VWA1 variants have upper motor neuron
    signs, when the gene product is a peripheral nerve and muscle matrix protein
    and the largest cohort found none?
  attaches_to:
  - phenotypes#Hyperreflexia
  - phenotypes#Spasticity
  rationale: >
    The first cohort recorded largely normal muscle tone and uniformly negative
    Babinski signs across its 17 patients. A subsequent two-child report
    made upper motor neuron signs its title finding, and the 20-patient cohort
    that followed recorded hyperreflexia, spasticity in two and upgoing plantars
    in two. No mechanism has been proposed. The possibilities are not
    distinguished by any published data: ascertainment drift as the phenotype
    widened, a genuine central component of a protein that is also expressed in
    the vasculature of neural tissues, or coincidence in a population where one
    causal allele is carried by roughly one person in 441 and so will sometimes
    be found alongside an unrelated condition. The third possibility is
    specifically worth testing for a disease whose defining allele is this
    common, and no report has excluded it.
  evidence:
  - reference: PMID:35975723
    reference_title: "Upper motor neuron signs and early onset gait abnormalities in young children with bi-allelic VWA1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report two cases from nonconsanguineous families in North America that presented in early childhood with lower extremity weakness and prominent foot deformities, and were found to carry bi-allelic variants in VWA1."
    explanation: The report that introduced upper motor neuron signs into the phenotype, and its sample size.
  - reference: PMID:18314316
    reference_title: "The extracellular matrix protein WARP is a novel component of a distinct subset of basement membranes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "WARP is expressed in the vasculature of neural tissues and in basement membrane structures of the peripheral nervous system."
    explanation: >-
      Records the one piece of expression data that would make a central
      component biologically conceivable; it establishes vascular expression in
      neural tissue, not a corticospinal role.
notes: >-
  Curation decisions worth recording. (1) entry_type DISEASE rather than SUBTYPE.
  MONDO:0030977 is absent from kb/ on main, and VWA1 appears there only inside a
  quoted EMG snippet in Distal_Hereditary_Motor_Neuronopathy_Type_2A.yaml, which
  is an HSPB8-related dominant entry with no has_subtypes rows. The MONDO parent
  MONDO:0015363 is curated as Distal_Hereditary_Motor_Neuronopathy_Autosomal_Recessive,
  whose has_subtypes rows cover HMNR1/IGHMBP2, HMNR2/SIGMAR1, HMNR4/PLEKHG5 and
  RTN2 but not HMNR7. A separate entry was chosen because the causal gene is a
  basement-membrane matrix protein rather than a motor-neuron housekeeping
  protein, the neuropathy is non-length-dependent where the family template is
  length-dependent, and the disease carries a myopathic component the family
  template does not. The same precedent already exists in this KB: HMNR1/SMARD1
  is both a has_subtypes row on that umbrella and a standalone entry
  (Spinal_Muscular_Atrophy_with_Respiratory_Distress_Type_1). Adding a matching
  has_subtypes row to the umbrella, and adding this entry as a member of the
  Distal_Hereditary_Motor_Neuropathies grouping, are both warranted follow-ons;
  they were left out of this PR to avoid editing two heavily-referenced shared
  files concurrently with other curation work. (2) No conforms_to is declared.
  peripheral_axonal_degeneration was inspected and rejected: its chain runs
  through axonal-transport and mitochondrial bioenergetic failure to a node named
  Length-Dependent Nerve Fiber Dysfunction, and non-length-dependence is the
  defining feature of this disease rather than an incidental one.
  neuromuscular_transmission_failure was also inspected and rejected: it is
  organised around loss of the safety factor producing fatigable weakness with a
  decremental response to repetitive stimulation. Neither appears in the VWA1
  literature — grep for fatigab, decrement and repetitive nerve stim across the
  five cached VWA1 sources (PMID:33559681, PMID:33459760, PMID:39502942,
  PMID:38652110, PMID:42662709) returns no match in any of them. The zebrafish
  endplate finding is
  a developmental synapse-formation deficit, not a transmission-safety-factor
  lesion, so it does not license conformance either. (3) No GeneReviews chapter
  covers this disease; see the entry-level comment in the PR and the check
  recorded below. (4) Some phenotypes are deliberately left unwired in the causal
  graph — scoliosis, lumbar hyperlordosis, scapular winging, hyperreflexia,
  spasticity, joint hypermobility and dystonia. Each says so in its own
  description. No source states a mechanism for any of them in this disease.
review_notes: >-
  GeneReviews baseline: no GeneReviews chapter exists for VWA1-related disease.
  Checked offline against cache/bookshelf/genereviews.csv (958 chapters in the 2026-09-10 snapshot; no hit
  for VWA1, neuromyopathy, or distal hereditary motor neuropathy) and online
  against PubMed with genereviews[book] AND VWA1, which returns 0 records.
  GeneReviews does carry chapters on other hereditary motor and sensory
  neuropathies (MFN2, SH3TC2, GDAP1), none of which covers this gene or this
  entity. StatPearls likewise has no chapter; nothing in this KB treats
  StatPearls as a baseline in any case.

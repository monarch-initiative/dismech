- name: Non-Length-Dependent Motor Axon Loss
  biological_scale: TISSUE
  role: central effector step
  description: >
    Loss of motor axons producing reduced or absent compound motor action
    potentials with preserved conduction velocities — an axonal, not
    demyelinating, motor neuropathy — and normal sensory studies in most
    patients. The distinguishing feature of this disease is that the loss is not
    graded by axon length: three-quarters of the first cohort had simultaneous
    proximal and distal lower limb weakness, and in almost half of those the
    proximal weakness was the more severe. That is the opposite of the
    distal-first gradient that defines most of the distal hereditary motor
    neuropathies, and it is why this entry does not conform to the
    length-dependent peripheral axonal degeneration module.
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  evidence:
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Motor nerve action potentials from the lower limb nerves were reduced or undetectable with uniformly preserved conduction velocities. Sensory studies were overall normal."
    explanation: Establishes the lesion as motor axon loss rather than demyelination or a sensorimotor process.
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In almost half of those cases, weakness was more pronounced proximally, and one-quarter had equally weak proximal and distal muscle groups, raising the clinical suspicion of non-length dependent motor axonal neuropathy."
    explanation: Establishes the non-length-dependent distribution that separates this disease from the rest of the dHMN family.
  - reference: PMID:35942667
    reference_title: Hereditary motor neuropathies.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Distal hereditary motor neuropathies (dHMN) are a clinically and genetically diverse group of disorders that are characterized by length-dependent axonal degeneration of lower motor neurons."
    explanation: >-
      Gives the family definition this disease departs from: length-dependence
      is the defining feature of the dHMNs in general, and is absent here.
  downstream:

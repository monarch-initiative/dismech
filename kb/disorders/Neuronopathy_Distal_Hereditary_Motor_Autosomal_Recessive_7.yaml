mechanistic_hypotheses:
- hypothesis_group_id: denervation_secondary_myopathy
  hypothesis_label: Myopathic change is secondary to chronic denervation
  status: CANONICAL
  description: >
    On this model the only primary lesion is in the peripheral nerve: loss of
    WARP from the nerve basement membrane causes motor axon loss, and every
    muscle finding — raised creatine kinase, myopathic motor units on needle
    EMG, dystrophic features on biopsy, fatty replacement on MRI — is a
    downstream consequence of long-standing denervation and reinnervation.
    Pagnamenta et al. argued this explicitly, noting that the histological
    features classically attributed to myopathy are also found in chronically
    denervated muscle, and that collagen VI immunolabelling was normal in the
    patient biopsies where it was assessed.
  evidence:
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We speculate that a few findings of myopathic changes might be secondary to chronic denervation rather than indicating an additional myopathic disease process."
    explanation: States the canonical position — the myopathic findings are read as a consequence of denervation, not as a second primary lesion.
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Where data were available, immunohistochemical labelling for collagen VI appeared normal."
    explanation: >-
      The collagen VI partner of WARP is normally deposited in patient muscle,
      which is the observation the secondary-myopathy model leans on: the matrix
      abnormality expected of a primary muscle-matrix disease was not found.
- hypothesis_group_id: primary_muscle_matrix_lesion
  hypothesis_label: The muscle is primarily affected through its own extracellular matrix
  status: ALTERNATIVE
  description: >
    On this model WARP loss injures the muscle directly, because WARP is a
    constituent of the muscle extracellular matrix as well as of the nerve
    basement membrane, so the disease is a neuromyopathy with two primary
    targets rather than a neuropathy with a denervated muscle. The Deschauer
    cohort named the condition a neuromyopathy on combined myopathological and
    neurophysiological grounds; a proteomic study of patient white blood cells,
    plasma and muscle set out explicitly to test for primary muscle
    vulnerability and reported extracellular accumulation of C-reactive protein
    and of NEFM in patient muscle; and muscle MRI in two independent reports
    shows an outside-in vastus lateralis pattern of the kind seen in collagen
    VI-related myopathy rather than the pattern expected of denervation.
  evidence:
  - reference: PMID:33459760
    reference_title: "Bi-allelic truncating mutations in VWA1 cause neuromyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myopathological and neurophysiological findings were indicative of combined neurogenic and myopathic pathology."
    explanation: The cohort that named the condition a neuromyopathy states the combined pathology on which that name rests.
  - reference: PMID:38652110
    reference_title: "Proteomic studies in VWA1-related neuromyopathy allowed new pathophysiological insights and the definition of blood biomarkers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NEFM showed an increase in cells within the ECM in biopsies of all patients studied."
    explanation: >-
      A muscle-matrix abnormality found in every patient biopsy examined, offered
      by that study as evidence bearing on primary muscle involvement.
  - reference: PMID:41331965
    reference_title: "A Distinctive MRI Pattern Resembling Type VI Collagen Myopathy in Novel VWA1-Related Distal Hereditary Motor Neuronopathy With Myopathic Features in a Patient From Spain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle magnetic resonance imaging showed a distinctive outside-in pattern of fatty replacement in the vastus lateralis, resembling that seen in type VI collagen-related myopathies."
    explanation: >-
      An imaging pattern characteristic of a primary matrix myopathy rather than
      of denervation, in a muscle that is also a target of the collagen VI
      disorders WARP partners with.
pathophysiology:
- name: Biallelic VWA1 Loss-of-Function Variants
  biological_scale: MOLECULAR
  role: initiating genetic lesion
  mechanism_confidence: ESTABLISHED
  description: >
    Two loss-of-function alleles of VWA1, the gene encoding the extracellular
    matrix protein WARP. Reported alleles are predominantly frameshifts and
    stop-gains, with a small number of missense changes affecting proline
    residues; the disease-defining allele is the 10 bp exon 1 duplication
    NM_022834.5:c.62_71dup p.(Gly25ArgfsTer74), which was present in 14 of 15
    families in the first reported cohort and in 12 of 15 families in the 2024
    cohort. Both homozygosity for that allele and compound heterozygosity for it
    in trans with a second truncating variant are common.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic germline loss of function; both homozygous and compound
      heterozygous genotypes are reported, the latter usually with the founder
      allele in trans.
  genes:
  - preferred_term: VWA1
    term:
      id: hgnc:30910
      label: VWA1
  evidence:
  - reference: PMID:33459760
    reference_title: "Bi-allelic truncating mutations in VWA1 cause neuromyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing led us to identify bi-allelic loss of function variants in VWA1 as the molecular cause underlying a so far genetically undefined neuromuscular disorder."
    explanation: Establishes biallelic VWA1 loss of function as the molecular cause of the condition.
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A single disease-associated allele p.(G25Rfs*74), a 10-bp repeat expansion, was observed in 14/15 families and was homozygous in 10/15."
    explanation: Identifies the recurrent founder allele and its frequency within the first reported cohort.
  downstream:
  - target: Nonsense-Mediated Decay and Absence of WARP Protein
    causal_link_type: DIRECT
    description: >-
      The founder duplication shifts the reading frame and introduces a
      premature stop 74 codons downstream, and patient fibroblasts show both
      reduced transcript rescued by a nonsense-mediated decay inhibitor and no
      detectable protein.
    evidence:
    - reference: PMID:33559681
      reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Duplex reverse transcription polymerase chain reaction and immunoblotting using patient fibroblasts revealed that the founder allele results in partial nonsense mediated decay and an absence of detectable protein."
      explanation: Connects the founder allele directly to transcript decay and loss of the protein product.
- name: Nonsense-Mediated Decay and Absence of WARP Protein
  biological_scale: MOLECULAR
  role: molecular consequence of the lesion
  mechanism_confidence: ESTABLISHED
  description: >
    Transcripts carrying the premature termination codon are partially degraded
    by nonsense-mediated decay, and no WARP protein is detectable in patient
    dermal fibroblasts in either the cell layer or the conditioned medium,
    whereas control fibroblasts secrete detectable protein. In the mouse the
    protein is abundant in sciatic nerve and is efficiently deposited into the
    matrix, so the human null state removes a protein that is normally present
    at the site of disease.
  biological_processes:
  - preferred_term: nonsense-mediated decay of the mutant VWA1 transcript
    term:
      id: GO:0000184
      label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
    modifier: INCREASED
  molecular_functions:
  - preferred_term: WARP as a structural constituent of the extracellular matrix
    term:
      id: GO:0005201
      label: extracellular matrix structural constituent
    modifier: ABSENT
  evidence:
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, there was no detectable VWA1 in either the conditioned medium or cell layer of the patient’s fibroblast"
    explanation: Direct demonstration that the patient cell makes no detectable WARP protein to secrete or deposit.
  - reference: PMID:33559681
    reference_title: "An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A high level of VWA1 was detected in mouse sciatic nerve extraction. In the primary culture of mouse sciatic nerve, VWA1 was detectable in its cell layer (cytoplasm and ECM) but not in the conditioned medium, indicating the secreted VWA1 was able to deposit as ECM efficiently."
    explanation: >-
      Establishes that the protein lost in patients is normally abundant in
      peripheral nerve and is deposited into the matrix there.
  downstream:
  - target: Depletion of WARP from Nerve and Muscle Basement Membrane
    causal_link_type: DIRECT
    description: >-
      WARP is an extracellular matrix protein of muscle and peripheral nerve
      that binds collagen VI and perlecan, so an undetectable protein is an
      absent matrix constituent at those sites.
    evidence:

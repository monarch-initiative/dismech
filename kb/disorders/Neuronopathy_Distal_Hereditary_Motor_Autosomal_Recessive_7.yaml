        The primary binding result behind the two partner proteins named
        throughout this entry, and the authors' proposed bridging function.
- name: Depletion of WARP from Nerve and Muscle Basement Membrane
  biological_scale: TISSUE
  role: tissue-level matrix lesion
  description: >
    WARP is expressed in the basement membrane structures of the peripheral
    nervous system and is most abundant, among human tissues surveyed, in tibial
    nerve. Its loss leaves the nerve basement membrane structurally abnormal:
    electron microscopy of WARP-deficient mouse sciatic nerve shows partial
    fusion of the basement membranes of neighbouring axons, and collagen VI is
    reduced in regions of the peripheral nerve matrix. WARP is co-expressed with
    collagen VI in the endomysium of muscle, so the same deficit exists on the
    muscle side, but the mouse showed no histological or behavioural muscle
    pathology and collagen VI labelling is normal in patient muscle — which is
    why the muscle arm of this node is curated as contested rather than
    established.
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  locations:
  - preferred_term: tibial nerve
    term:
      id: UBERON:0001323
      label: tibial nerve
  biological_processes:
  - preferred_term: basement membrane organization
    term:
      id: GO:0071711
      label: basement membrane organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:18314316
    reference_title: "The extracellular matrix protein WARP is a novel component of a distinct subset of basement membranes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "WARP is expressed in the vasculature of neural tissues and in basement membrane structures of the peripheral nervous system. Furthermore, WARP is also expressed in the apical ectodermal ridge of developing limb buds, and in skeletal and cardiac muscle."
    explanation: >-
      The reporter-gene study that established where WARP sits — peripheral
      nerve basement membrane and skeletal muscle — which is what this node
      claims is depleted.
  - reference: PMID:19279005
    reference_title: "Mice lacking the extracellular matrix protein WARP develop normally but have compromised peripheral nerve structure and function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Further ultrastructural analysis revealed reduced fibrillar collagen deposition within the peripheral nerve extracellular matrix and abnormal partial fusing of adjacent Schwann cell basement membranes, suggesting an important function for WARP in stabilizing the association of the collagenous interstitial matrix with the Schwann cell basement membrane."
    explanation: >-
      The primary ultrastructural result defining the lesion at this node, and
      the authors' own statement of what WARP does there.
  - reference: PMID:19279005
    reference_title: "Mice lacking the extracellular matrix protein WARP develop normally but have compromised peripheral nerve structure and function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Immunostaining of WARP-interacting ligands demonstrated that the collagen VI microfibrillar matrix was severely reduced and mislocalized in peripheral nerves of WARP-null mice."
    explanation: >-
      Shows that WARP loss disorganises the collagen VI matrix specifically in
      nerve, which is the mechanistic content of this node's nerve arm.
  - reference: PMID:30768857
    reference_title: "WARP: A Unique Extracellular Matrix Component of Cartilage, Muscle, and Endothelial Cell Basement Membranes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The von Willebrand factor A-domain-related protein (WARP) encoded by the VWA1 gene, is an orphan extracellular matrix protein that is expressed in a subset of ECM structures but whose function is poorly understood."
    explanation: >-
      A review of the protein confirms its restricted matrix distribution and
      records that its normal function is not well understood, which bounds how
      strongly any mechanism below this node can be stated.

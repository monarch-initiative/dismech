      snippet: "The von Willebrand Factor A domain containing 1 protein, encoded by VWA1, is an extracellular matrix protein expressed in muscle and peripheral nerve. It interacts with collagen VI and perlecan, two proteins that are affected in hereditary neuromuscular disorders."
      explanation: >-
        States where the protein normally resides and what it binds; the citing

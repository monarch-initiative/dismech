    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, Skd3 variants linked to 3-methylglutaconic aciduria, a severe mitochondrial disorder, display diminished disaggregase activity (but not always reduced ATPase activity), which predicts disease severity."
    explanation: Patient variants lose disaggregase activity in proportion to clinical severity.
  - reference: PMID:32573439
    reference_title: Skd3 (human ClpB) is a potent mitochondrial protein disaggregase that is inactivated by 3-methylglutaconic aciduria-linked mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we establish that a mitochondrial AAA+ protein, Skd3 (human ClpB), couples ATP hydrolysis to protein disaggregation and reactivation."
    explanation: Defines the normal disaggregase function that the variants remove.
  - reference: PMID:32866687
    reference_title: Human CLPB forms ATP-dependent complexes in the mitochondrial intermembrane space.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In purified intact mitochondria, CLPB was protected against externally added proteinase K, but it was susceptible to degradation after disruption of the outer membrane, indicating that CLPB resides in the mitochondrial intermembrane space."
    explanation: Places CLPB in the intermembrane space.
  - reference: PMID:25597510
    reference_title: CLPB mutations cause 3-methylglutaconic aciduria, progressive brain atrophy, intellectual disability, congenital neutropenia, cataracts, movement disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "was supported further by in vitro evidence with the mutant peptides abolishing ATPase function"
    explanation: The patient missense variant p.Arg408Gly abolishes ATPase activity in vitro.
  - reference: PMID:25597511
    reference_title: CLPB variants associated with autosomal-recessive mitochondrial disorder with cataract, neutropenia, epilepsy, and methylglutaconic aciduria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The level of CLPB protein was markedly decreased in fibroblasts and liver of affected individuals."
    explanation: Patient tissues have markedly reduced CLPB protein.
  - reference: PMID:25650066
    reference_title: Disruption of CLPB is associated with congenital microcephaly, severe encephalopathy and 3-methylglutaconic aciduria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that CLPB expression is abolished in fibroblasts from the patients."
    explanation: A truncating genotype abolishes CLPB expression in patient cells.
  - reference: PMID:25595726
    reference_title: Bi-allelic CLPB mutations cause cataract, renal cysts, nephrocalcinosis and 3-methylglutaconic aciduria, a novel disorder of mitochondrial protein disaggregation.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "molecular modelling suggests that the mutations disrupt interactions between subunits so that the CLPB hexamer cannot form or is unstable, thus impairing its role as a protein disaggregase"
    explanation: Modelling predicts that two missense variants prevent oligomer assembly.

- name: Secondary Complex I Instability
  biological_scale: MOLECULAR
  description: >-
    In CLPB knockout cells, intermembrane space-facing complex I subunits
    aggregate and complex I becomes unstable. Shown in cultured cells; whether
    patients have a complex I defect, and whether it drives the
    neurological disease, has not been established.
  molecular_functions:
  - preferred_term: NADH dehydrogenase (ubiquinone) activity
    modifier: DECREASED

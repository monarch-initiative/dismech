    CLPB loss alters the composition of the mitochondrial calcium uniporter,
    reduces mitochondrial calcium uptake, lowers OPA1 and fragments the
    mitochondrial network. Patient fibroblasts show the same calcium and
    structural changes. Its contribution to clinical features is not
    established.

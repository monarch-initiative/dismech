        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The clpb morphants showed an abnormal touch-evoked response with increased swim velocity and tail beat frequency."
        explanation: Reports the behavioural measurement behind this readout.
    evidence:
    - reference: PMID:25650066
      reference_title: Disruption of CLPB is associated with congenital microcephaly, severe encephalopathy and 3-methylglutaconic aciduria.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Interestingly, knocking down clpb reduced the number of inhibitory glycinergic interneurons and increased a population of excitatory glutamatergic neurons in the spinal cord."
      explanation: Supports the morphant as informative for the interneuron node.
experimental_models:
- name: CLPB-knockout 32Dcl3 mouse myeloblastic cells
  experimental_model_type: CELL_LINE
  description: >-
    IL-3-dependent mouse myeloblastic cell line with CLPB knocked out,
    differentiated to neutrophils with G-CSF after IL-3 withdrawal.
  publication: PMID:39644357
  modeled_mechanisms:
  - target: Granulocytic Precursor Apoptosis and Impaired Neutrophil Differentiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      CLPB loss increases apoptosis at the onset of G-CSF-induced
      differentiation, while surviving cells express normal differentiation
      markers.
    limitations: >-
      A mouse cell line rather than human patient marrow, and surviving
      CLPB-deficient cells differentiated normally, so the model captures
      precursor loss rather than a differentiation block.
    evidence:
    - reference: PMID:39644357
      reference_title: Mitochondrial CLPB is a pro-survival factor at the onset of granulocytic differentiation of mouse myeloblastic cells.
      supports: SUPPORT
      evidence_source: IN_VITRO

    snippet: "the only variants which satisfied these criteria were c.1882C>T (p.Arg628Cys) and c.1915G>A (p.Glu639Lys) in the CLPB gene"
    explanation: A third independent family with compound heterozygous CLPB variants.
  - reference: PMID:41719910
    reference_title: "From genotype to outcome: Zygosity-specific insights in 63 cases of CLPB-related mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stop/stop genotypes were associated with greater disease burden than missense combinations."
    explanation: Genotype-severity correlation in the largest biallelic cohort.
pathophysiology:
- name: CLPB Disaggregase Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic variants reduce CLPB protein, abolish its expression, or leave a
    protein with impaired ATPase or disaggregase activity. Missense variants may
    prevent assembly of the functional oligomer. The residual disaggregase
    activity of patient variants, rather than their ATPase activity, predicts
    disease severity.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION

notes: >-
  Scope: this entry covers biallelic (autosomal recessive) CLPB deficiency,
  OMIM 616271. Specific heterozygous CLPB variants that act in a
  dominant-negative manner cause a separate autosomal dominant disorder,
  3-methylglutaconic aciduria type VIIA (MONDO:0859237), with neutropenia and
  in some patients epilepsy and developmental delay (PMID:34140661,
  PMID:34115842); it is a separate MONDO term and is not curated here. Those
  dominant-negative studies are cited in this entry only where they report the
  effect of CLPB loss itself. The only ClinGen gene-disease validity record for
  CLPB in cache/clingen/gene_validity.csv is for Leigh syndrome (MONDO:0009723,
  Limited), a different disease, so no gene_disease_validity assertion is
  recorded. Severity groups (mild, moderate, severe) follow the scoring system
  of Pronicka et al. 2017 and the GeneReviews chapter.

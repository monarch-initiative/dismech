- name: HAX1 Insolubility
  biological_scale: MOLECULAR
  description: >-
    HAX1, the protein mutated in Kostmann-type severe congenital neutropenia,
    is a CLPB substrate and partner; in reconstitution it also acts as a
    direct stimulatory cofactor that promotes CLPB oligomerization. In CLPB-deficient myeloblastic cells HAX1
    forms insoluble aggregates in mitochondria. CLPB and HAX1 together form a
    mitochondrial proteostasis axis with PRKD2 and HSP27 that is needed for
    neutrophil differentiation.
  genes:
  - preferred_term: HAX1
    term:
      id: hgnc:16915
      label: HAX1
  evidence:
  - reference: PMID:39644357
    reference_title: Mitochondrial CLPB is a pro-survival factor at the onset of granulocytic differentiation of mouse myeloblastic cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that CLPB-deficient 32Dcl3 cells showed a decreased mitochondrial membrane potential and increased levels of insoluble HAX1 aggregates in mitochondria, as compared to control cells."
    explanation: HAX1 aggregates in CLPB-knockout myeloblastic cells.
  - reference: PMID:35499078
    reference_title: HAX1-dependent control of mitochondrial proteostasis governs neutrophil granulocyte differentiation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we defined a potentially novel functional CLPB/HAX1/(PRKD2)/HSP27 axis with critical importance for the differentiation of neutrophil granulocytes"
    explanation: Places HAX1 and CLPB in one pathway required for neutrophil differentiation.
  - reference: PMID:42244541
    reference_title: HAX1 drives assembly and activation of the mitochondrial intermembrane space chaperone CLPB.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Through biochemical reconstitution, we here find that HAX1 is a direct stimulatory cofactor of CLPB. HAX1 promotes oligomerization of CLPB into an active disaggregase and stimulates the ATPase and refoldase activities of the oligomeric complex."
    explanation: >-
      Reconstitution shows that HAX1 is a stimulatory cofactor as well as a
      client of CLPB. This is a bioRxiv preprint, not yet peer reviewed.
  downstream:
  - target: Granulocytic Precursor Apoptosis and Impaired Neutrophil Differentiation

      evidence_source: OTHER
      quote_role: BACKGROUND
      directness: INDIRECT
      snippet: "It is currently thought that this accumulation is due to an underlying buildup of acetyl-CoA in the mitochondria from impaired function of the TCA cycle with ensuing formation of trans-3-methylglutaconyl CoA and its subsequent byproducts, including 3-MGA."
      explanation: States the acetyl-CoA build-up route from impaired mitochondrial function to 3-MGA.
- name: Secondary 3-Methylglutaconic Acid Accumulation
  biological_scale: ORGANISM
  description: >-
    Urinary 3-methylglutaconic acid is raised, as in other secondary
    (non-canonical) 3-methylglutaconic acidurias, by a route that is not
    known. Proposed routes include perturbation of mitochondrial membranes by
    protein aggregates, an extramitochondrial, peroxisomal HMG-CoA route
    driven by mitochondrial dysfunction, and the general secondary 3-MGA model
    of mitochondrial acetyl-CoA build-up from impaired TCA cycle function.

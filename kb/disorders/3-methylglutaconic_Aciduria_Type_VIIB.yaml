name: 3-Methylglutaconic Aciduria Type VIIB
creation_date: "2026-10-15T17:00:00Z"
category: Mendelian
description: >-
  3-methylglutaconic aciduria type VIIB (MGCA7B) is the autosomal recessive
  form of CLPB deficiency, caused by biallelic pathogenic variants in CLPB.
  CLPB (also called Skd3, the human ClpB homolog) is an ATP-dependent AAA+
  protein disaggregase of the mitochondrial intermembrane space that resolubilizes
  aggregated proteins, among them the anti-apoptotic protein HAX1. Loss of its
  disaggregase activity leads to protein aggregation in the intermembrane space,
  impaired granulocytic differentiation with congenital neutropenia, and a
  neurological disorder whose severity ranges from absent neurological
  involvement through intellectual disability with a progressive movement
  disorder and epilepsy to a neonatal encephalopathy with absent voluntary
  movements, hyperexcitability, respiratory insufficiency, progressive brain
  atrophy and death in the first months of life. Cataracts, renal cysts and
  nephrocalcinosis, and premature ovarian insufficiency in surviving females
  also occur. Urinary 3-methylglutaconic acid is raised, by a mechanism that is
  not known. Residual disaggregase activity of the patient variants tracks
  disease severity. Treatment is supportive, with granulocyte colony-stimulating
  factor for neutropenia and hematopoietic stem cell transplantation considered
  in patients without severe neurological disease.

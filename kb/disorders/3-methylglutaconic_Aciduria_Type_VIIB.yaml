    term:
      id: GO:0005758
      label: mitochondrial intermembrane space
  evidence:
  - reference: PMID:38270563
    reference_title: CLPB disaggregase dysfunction impacts the functional integrity of the proteolytic SPY complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Utilizing proteomic and biochemical approaches, we show a stress-specific aggregation phenotype in a CLPB-null environment and define the CLPB substrate profile."
    explanation: CLPB-null cells aggregate a defined set of substrates under stress.
  - reference: PMID:40118824
    reference_title: Dependence of mitochondrial calcium signalling and dynamics on the disaggregase, CLPB.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Upon CLPB loss, MICU1 and MICU2, regulators of the mitochondrial calcium uniporter complex (mtCU), and OPA1, a main mediator of mitochondrial fusion, become insoluble but the functional outcome remains unclear."
    explanation: Names calcium-uniporter regulators and OPA1 as aggregating substrates.
  downstream:

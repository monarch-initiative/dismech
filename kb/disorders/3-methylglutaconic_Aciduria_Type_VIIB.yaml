      explanation: Shows that the defect in this model is survival rather than differentiation.
discussions:
- discussion_id: gap_clpb_tissue_selectivity
  prompt: >-
    Why does loss of a ubiquitously expressed mitochondrial disaggregase
    produce neutropenia across the severity range but neurological disease of
    widely varying severity, and which CLPB substrates are limiting in
    granulocytic precursors versus neurons?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#HAX1 Insolubility
  - pathophysiology#Progressive Encephalopathy with Brain Atrophy
  - phenotypes#Congenital neutropenia
  rationale: >-
    The neutropenia has a candidate mechanism through HAX1 and the
    CLPB/HAX1/PRKD2/HSP27 axis, but no comparable substrate has been linked to
    neuronal loss, and the neurological severity tracks residual disaggregase
    activity without a known cell-specific explanation. Candidate links such as
    secondary complex I instability and impaired mitochondrial calcium uptake
    are shown only in cultured cells.
  evidence:
  - reference: PMID:32573439
    reference_title: Skd3 (human ClpB) is a potent mitochondrial protein disaggregase that is inactivated by 3-methylglutaconic aciduria-linked mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, Skd3 variants linked to 3-methylglutaconic aciduria, a severe mitochondrial disorder, display diminished disaggregase activity (but not always reduced ATPase activity), which predicts disease severity."
    explanation: Severity tracks residual activity, but the tissue pattern is unexplained.
  - reference: PMID:38270563
    reference_title: CLPB disaggregase dysfunction impacts the functional integrity of the proteolytic SPY complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "CLPB mutations are associated with 3-methylglutaconic aciduria and neutropenia; however, the molecular mechanism underscoring disease and the contribution of CLPB substrates to disease pathology remains unknown."
    explanation: States that the substrate contribution to disease is unknown.
- discussion_id: gap_clpb_3mga_origin
  prompt: >-
    How does loss of CLPB disaggregase activity raise urinary
    3-methylglutaconic acid?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Secondary 3-Methylglutaconic Acid Accumulation
  - mechanistic_hypotheses#aggregate_membrane_perturbation_3mga
  - mechanistic_hypotheses#ampk_peroxisomal_3mga
  - mechanistic_hypotheses#acetyl_coa_tca_3mga
  rationale: >-
    Three proposals exist, membrane perturbation by protein aggregates, an
    AMPK-driven peroxisomal HMG-CoA route, and the class-wide mitochondrial
    acetyl-CoA build-up model, and none has been tested in CLPB-deficient
    cells or patients. 3-methylglutaconic aciduria was also not
    observed in one series of patients with the dominant-negative form, a
    contrast that may help discriminate between them.
  evidence:
  - reference: PMID:31626852
    reference_title: "Mitochondrial dysfunction, AMPK activation and peroxisomal metabolism: A coherent scenario for non-canonical 3-methylglutaconic acidurias."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "its genesis in non-canonical (secondary) 3-MGAs, a growing-up group of disorders encompassing more than a dozen of inherited metabolic diseases, is a mystery still remaining unresolved for three decades"
    explanation: Records that the origin of secondary 3-MGA is unresolved.
  - reference: PMID:34115842
    reference_title: Heterozygous variants of CLPB are a cause of severe congenital neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, 3-methylglutaconic aciduria was not observed and, other than neutropenia, these clinical features were uncommon in our series."
    explanation: 3-MGA was absent in a heterozygous dominant-negative series, a contrast relevant to its origin.

- name: Intermembrane Space Protein Aggregation
  biological_scale: MOLECULAR
  description: >-
    Without CLPB, a set of intermembrane space and inner membrane proteins
    becomes insoluble, particularly under stress. Substrates include HAX1, the
    inner membrane quality-control proteins of the SPY complex (STOML2, PARL,
    YME1L1), HTRA2, the calcium uniporter regulators MICU1 and MICU2, the
    fusion protein OPA1, and intermembrane space-facing subunits of
    respiratory complex I.
  biological_processes:
  - preferred_term: protein refolding
    modifier: DECREASED
    term:
      id: GO:0042026
      label: protein refolding
  cellular_components:

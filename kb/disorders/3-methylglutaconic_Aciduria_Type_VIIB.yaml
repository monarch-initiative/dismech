animal_models:
- name: clpb zebrafish morphant (Wortmann 2015)
  species: Zebrafish
  genotype: clpb antisense morpholino knockdown
  publication: PMID:25597510
  description: >-
    Morpholino suppression of clpb in zebrafish embryos, with rescue by
    wild-type but not mutant human CLPB mRNA.
  modeled_mechanisms:
  - target: Progressive Encephalopathy with Brain Atrophy
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Knockdown produces a central nervous system phenotype consistent with
      cerebellar and cerebral atrophy, and patient alleles fail to rescue it.
    limitations: >-
      Morpholino knockdown is transient and dose-dependent rather than a
      germline null, the readout is in embryos rather than in a postnatal
      brain, and the abstract does not report neutropenia, cataract or
      3-methylglutaconic aciduria in the model.
    evidence:
    - reference: PMID:25597510
      reference_title: CLPB mutations cause 3-methylglutaconic aciduria, progressive brain atrophy, intellectual disability, congenital neutropenia, cataracts, movement disorder.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Suppression of clpb in zebrafish embryos induced a central nervous system phenotype that was consistent with cerebellar and cerebral atrophy that could be rescued by wild-type, but not mutant, human CLPB mRNA."
      explanation: Supports the morphant as informative for the brain atrophy node.
- name: clpb zebrafish morphant (Capo-Chichi 2015)
  species: Zebrafish
  genotype: clpb antisense morpholino knockdown
  publication: PMID:25650066
  description: >-
    Antisense morpholino knockdown of translation of the zebrafish clpb
    ortholog.
  modeled_mechanisms:
  - target: Spinal Inhibitory Interneuron Deficit and Motor Hyperexcitability
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Morphants show an abnormal touch-evoked response with increased swim
      velocity and tail beat frequency, and fewer inhibitory glycinergic
      interneurons in the spinal cord.
    limitations: >-
      Morpholino knockdown only; the interneuron finding has not been examined
      in patient tissue, and zebrafish spinal motor circuits are an indirect
      proxy for the neonatal hyperexcitability of patients.
    readouts:
    - name: Touch-evoked swimming response
      target: Spinal Inhibitory Interneuron Deficit and Motor Hyperexcitability
      direction: INCREASED
      interpretation: Behavioural correlate of motor hyperexcitability.
      evidence:

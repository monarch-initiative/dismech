      label: Autosomal recessive inheritance
  description: >-
    Homozygous or compound heterozygous CLPB variants, including missense,
    nonsense and frameshift alleles, with heterozygous unaffected parents.
  evidence:
  - reference: PMID:27891836
    reference_title: CLPB Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "CLPB deficiency associated with biallelic CLPB pathogenic variants is inherited in an autosomal recessive manner."
    explanation: GeneReviews states the recessive mode of inheritance for the biallelic form.
  - reference: PMID:27891836
    reference_title: CLPB Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "each sib of an affected individual has at conception a 25% chance of inheriting biallelic pathogenic variants and being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of inheriting neither of the familial CLPB pathogenic variants"
    explanation: GeneReviews gives the recessive recurrence risk for sibs of an affected child.
  - reference: PMID:25597511
    reference_title: CLPB variants associated with autosomal-recessive mitochondrial disorder with cataract, neutropenia, epilepsy, and methylglutaconic aciduria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through a combination of homozygosity mapping in the Greenlandic individuals and exome sequencing in the North American, we identified biallelic variants in the caseinolytic peptidase B homolog (CLPB)."
    explanation: Biallelic variants in five affected children from two populations support recessive inheritance.
  - reference: PMID:25650066
    reference_title: Disruption of CLPB is associated with congenital microcephaly, severe encephalopathy and 3-methylglutaconic aciduria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a homozygous truncating mutation (p.I562Tfs*23) in CLPB segregating with the disease in this family"
    explanation: A homozygous truncating allele segregates with disease in a consanguineous family.
  - reference: PMID:36170828
    reference_title: "Unique structural features govern the activity of a human mitochondrial AAA+ disaggregase, Skd3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Importantly, SCN-linked subunits sharply inhibit disaggregase activity, whereas MGCA7-linked subunits do not."
    explanation: >-
      Subunits carrying recessive MGCA7 variants do not poison wild-type CLPB
      in mixed hexamers, which explains why carriers of one such allele are
      unaffected, while dominant-negative SCN alleles cause the separate
      dominant disorder.
prevalence:
- population: Worldwide published and survey cases
  measure_type: CASES_IN_LITERATURE
  notes: >-
    A 2026 retrospective cohort assembled from the literature and a multicentre
    survey identified 41 individuals with biallelic CLPB variants (and 22 with
    monoallelic variants, who belong to the autosomal dominant form). This is a
    count of reported cases, not a population prevalence.
  evidence:
  - reference: PMID:41719910
    reference_title: "From genotype to outcome: Zygosity-specific insights in 63 cases of CLPB-related mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sixty-three individuals (41 biallelic, 22 monoallelic; 6 unpublished) with disease-causing CLPB variants were identified via literature review and a multicenter survey."
    explanation: Gives the number of biallelic cases known in 2026.

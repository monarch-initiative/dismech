    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing of two unrelated individuals and subsequent Sanger sequencing of 16 individuals with an overlapping phenotype identified a total of 14 rare, predicted deleterious alleles in CLPB in 14 individuals from 9 unrelated families."
    explanation: Gene-discovery report establishing CLPB in nine unrelated families.
  - reference: PMID:25597511
    reference_title: CLPB variants associated with autosomal-recessive mitochondrial disorder with cataract, neutropenia, epilepsy, and methylglutaconic aciduria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The causative variants included one missense variant, c.803C>T (p.Thr268Met), and two nonsense variants, c.961A>T (p.Lys321*) and c.1249C>T (p.Arg417*)."
    explanation: Independent simultaneous report of biallelic CLPB variants.

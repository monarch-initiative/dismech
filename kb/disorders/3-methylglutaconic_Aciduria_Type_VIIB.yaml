    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Loss of function of either protein drives aggregation of intermembrane space-facing subunits of complex I of the electron transport chain, resulting in secondary complex I dysfunction."
    explanation: Secondary complex I dysfunction follows CLPB loss in cultured cells.
  downstream:
  - target: Secondary 3-Methylglutaconic Acid Accumulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - ampk_peroxisomal_3mga
    - acetyl_coa_tca_3mga
    description: >-
      Hypothetical. Both class-wide models derive secondary 3-MGA from
      mitochondrial dysfunction; complex I instability is the mitochondrial
      dysfunction shown in CLPB-null cells, but no study has connected the two.
    evidence:
    - reference: PMID:31626852
      reference_title: "Mitochondrial dysfunction, AMPK activation and peroxisomal metabolism: A coherent scenario for non-canonical 3-methylglutaconic acidurias."

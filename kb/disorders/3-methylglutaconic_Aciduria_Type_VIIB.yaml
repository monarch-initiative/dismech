      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Human cells lacking Skd3 exhibit reduced solubility of various mitochondrial proteins, including anti-apoptotic Hax1."
      explanation: HAX1 is among the proteins that lose solubility without CLPB.
  - target: SPY Complex Dysfunction

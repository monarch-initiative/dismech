- name: SPY Complex Dysfunction
  biological_scale: MOLECULAR
  description: >-
    The inner membrane quality-control assembly of STOML2, PARL and YME1L1
    (SPY complex) depends on CLPB; CLPB deficiency impairs its function
    through protein aggregation in the intermembrane space. PARL also cleaves
    an autoinhibitory peptide from CLPB, which strongly enhances its
    disaggregase activity, so the two depend on each other. Its contribution
    to clinical features is not established.
  genes:
  - preferred_term: PARL
    term:
      id: hgnc:18253
      label: PARL
  evidence:
  - reference: PMID:38270563
    reference_title: CLPB disaggregase dysfunction impacts the functional integrity of the proteolytic SPY complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We illustrate an interplay between intermembrane space proteins including CLPB, HAX1, HTRA2, and the inner membrane quality control proteins (STOML2, PARL, YME1L1; SPY complex)"
    explanation: Defines the SPY complex and its interplay with CLPB.
  - reference: PMID:32573439
    reference_title: Skd3 (human ClpB) is a potent mitochondrial protein disaggregase that is inactivated by 3-methylglutaconic aciduria-linked mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A mitochondrial inner-membrane protease, PARL, removes an autoinhibitory peptide from Skd3 to greatly enhance disaggregase activity."
    explanation: PARL activates CLPB, the reciprocal link in this quality-control network.

- name: Progressive Encephalopathy with Brain Atrophy
  biological_scale: TISSUE
  description: >-
    The neurological disease ranges from nonprogressive intellectual
    disability to a prenatal-onset encephalopathy with progressive brain
    atrophy. In the severe form, neonatal neurological involvement (absent
    voluntary movements or hyperekplexia, hypotonia or hypertonia, swallowing
    problems, respiratory insufficiency and epilepsy) is the usual cause of
    death in the first months, and microcephaly is present at birth in some.

mechanistic_hypotheses:
- hypothesis_group_id: clpb_hax1_proteostasis_neutropenia
  hypothesis_label: CLPB-HAX1 Mitochondrial Proteostasis Model of Neutropenia
  status: EMERGING
  description: >-
    Loss of CLPB disaggregase activity leaves HAX1 and other intermembrane
    space proteins insoluble, disrupting a CLPB/HAX1/PRKD2/HSP27 axis needed
    for granulocytic differentiation, so that myeloid precursors undergo
    apoptosis at the onset of differentiation. The model is supported in
    cultured human and mouse myeloid cells and by the shared neutropenia of
    HAX1 deficiency; it has not been tested in patient marrow.
  evidence:
  - reference: PMID:35499078
    reference_title: HAX1-dependent control of mitochondrial proteostasis governs neutrophil granulocyte differentiation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we defined a potentially novel functional CLPB/HAX1/(PRKD2)/HSP27 axis with critical importance for the differentiation of neutrophil granulocytes"
    explanation: Defines the shared CLPB/HAX1 pathway in neutrophil differentiation.
  - reference: PMID:39644357
    reference_title: Mitochondrial CLPB is a pro-survival factor at the onset of granulocytic differentiation of mouse myeloblastic cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that CLPB-deficient 32Dcl3 cells showed a decreased mitochondrial membrane potential and increased levels of insoluble HAX1 aggregates in mitochondria, as compared to control cells."
    explanation: HAX1 aggregation in CLPB-deficient myeloid cells.
- hypothesis_group_id: aggregate_membrane_perturbation_3mga
  hypothesis_label: Aggregate-Induced Mitochondrial Membrane Perturbation as the Source of 3-MGA
  status: EMERGING
  description: >-
    Abnormal protein aggregates perturb mitochondrial membrane architecture,
    which is proposed to be the shared cause of 3-methylglutaconic aciduria in
    CLPB deficiency and in the membrane-lipid disorders Barth, Sengers and
    MEGDEL syndromes. Proposed from clinical and genetic data; not tested.
  evidence:
  - reference: PMID:25595726
    reference_title: Bi-allelic CLPB mutations cause cataract, renal cysts, nephrocalcinosis and 3-methylglutaconic aciduria, a novel disorder of mitochondrial protein disaggregation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "We now propose that perturbation of the mitochondrial membranes by abnormal protein aggregates leads to 3-methylglutaconic aciduria in CLPB deficiency."
    explanation: States the hypothesis.
- hypothesis_group_id: acetyl_coa_tca_3mga
  hypothesis_label: Mitochondrial Acetyl-CoA Build-up Route to 3-MGA
  status: ALTERNATIVE
  description: >-
    The current general model for secondary 3-methylglutaconic acidurias:
    impaired TCA cycle function causes mitochondrial acetyl-CoA to build up,
    which is converted through trans-3-methylglutaconyl-CoA to
    3-methylglutaconic acid. Stated for the disease class; not tested in
    CLPB-deficient cells.
  evidence:
  - reference: PMID:39787888
    reference_title: Untargeted metabolomics analysis as a potential screening tool for 3-methylglutaconic aciduria syndromes.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "It is currently thought that this accumulation is due to an underlying buildup of acetyl-CoA in the mitochondria from impaired function of the TCA cycle with ensuing formation of trans-3-methylglutaconyl CoA and its subsequent byproducts, including 3-MGA."
    explanation: States the class-wide hypothesis for secondary 3-MGA.
- hypothesis_group_id: ampk_peroxisomal_3mga
  hypothesis_label: AMPK-Driven Peroxisomal HMG-CoA Route to 3-MGA
  status: ALTERNATIVE
  description: >-
    A general scenario for secondary 3-methylglutaconic acidurias in which
    constitutive mitochondrial dysfunction activates AMPK, diverting
    cytoplasmic acetyl-CoA to peroxisomes where HMG-CoA is converted to
    3-methylglutaconate. The authors consider additional contributors for
    CLPB deficiency. Theoretical synthesis; not tested in CLPB cells.
  evidence:
  - reference: PMID:31626852
    reference_title: "Mitochondrial dysfunction, AMPK activation and peroxisomal metabolism: A coherent scenario for non-canonical 3-methylglutaconic acidurias."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "constitutive mitochondrial dysfunction induces AMPK activation which, by inhibiting early steps in cholesterol and fatty acid syntheses, pipelines cytoplasmic acetyl-CoA to peroxisomes where a rise in HMG-CoA followed by local dehydration and hydrolysis may lead to 3-MGA yield"
    explanation: States the alternative hypothesis.

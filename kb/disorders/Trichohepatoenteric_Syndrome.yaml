    evidence:
    - reference: PMID:29334452
      reference_title: "Trichohepatoenteric Syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        To reduce the burden of infections, immunoglobulins can be supplemented in those with low immunoglobulin levels or immunoglobulin functional abnormalities.
      explanation: >-

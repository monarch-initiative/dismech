diagnosis:
- name: TTC37 and SKIV2L sequencing
  description: >-
    Diagnosis is initially clinical, based on the five defining signs, and is
    confirmed by direct sequencing of TTC37 and SKIV2L. Because the two genotypes
    are clinically indistinguishable, both must be tested.
  evidence:
  - reference: PMID:23302111
    reference_title: "Syndromic diarrhea/Tricho-hepato-enteric syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis SD/THE is initially based on clinical findings and confirmed
      by direct sequencing of TTC37 and SKIV2L.
    explanation: >-
      States the diagnostic pathway - clinical recognition confirmed by
      sequencing both SKI complex genes.
  - reference: PMID:29334452
    reference_title: "Trichohepatoenteric Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of THES is established in a proband with biallelic pathogenic variants in either SKIC3 (formerly TTC37) or SKIC2 (formerly SKIV2L).
    explanation: >-
      The current GeneReviews diagnostic standard, and the source that fixes the
      present HGNC symbols SKIC3/SKIC2 against the older TTC37/SKIV2L used
      throughout the primary literature. Evidence source is OTHER because
      GeneReviews is a curated review.
- name: Surveillance for late complications
  description: >-
    THES requires scheduled surveillance rather than one-off diagnosis, because
    several of its complications appear after presentation. GeneReviews
    prescribes yearly assessment of liver function and size, immunoglobulin
    concentration and functionality, TSH for hypothyroidism, and any change in
    the diarrhea that might indicate inflammatory bowel disease, plus periodic
    developmental and speech assessment. The IBD item is notable: a change in
    bowel pattern in an already-diarrheal child is easy to attribute to the
    underlying enteropathy, which is precisely why it is called out.
  evidence:
  - reference: PMID:29334452
    reference_title: "Trichohepatoenteric Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Yearly assessment of: diarrhea for changes that could suggest inflammatory bowel disease; liver function and size; immunoglobulin serum concentration and functionality; TSH level for evidence of hypothyroidism.
    explanation: >-
      The GeneReviews surveillance schedule this record captures, including the
      IBD caution. Evidence source is OTHER because GeneReviews is a curated
      review.
  - reference: PMID:29334452
    reference_title: "Trichohepatoenteric Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Periodic assessment of: cognitive development, speech and language, and psychosocial skills for evidence of ID.
    explanation: >-
      The developmental component of the same surveillance schedule.
- name: Intestinal biopsy to exclude other causes
  description: >-
    Biopsy is used to distinguish THES from the other causes of intractable
    infantile diarrhea rather than to make the diagnosis positively: histology is
    non-specific and the brush border is ultrastructurally normal, which excludes
    the enterocyte-structural enteropathies.
  evidence:
  - reference: PMID:23302111
    reference_title: "Syndromic diarrhea/Tricho-hepato-enteric syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Differential diagnosis with the other causes of intractable diarrhea is
      easily performed by pathologic investigations.
    explanation: >-
      Supports the role of histopathology as a discriminator against the other
      congenital enteropathies rather than as a positive diagnostic test.
treatments:
- name: Parenteral Nutrition
  description: >-
    Most children require parenteral nutrition to maintain life and growth. The
    important prognostic difference from the enterocyte-structural enteropathies
    is that dependence is not necessarily permanent: some children can be weaned
    to full enteral feeding over time, and transplantation is not the expected
    endpoint.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Total Parenteral Nutrition
    term:
      id: NCIT:C29484
      label: Total Parenteral Nutrition
  target_mechanisms:
  - target: Intractable Infantile Diarrhea with a Structurally Normal Brush Border
    treatment_effect: BYPASSES
    description: >-
      Intravenous nutrition bypasses the failing intestine; it does not act on
      the SKI complex defect or restore transporter localization.
    evidence:
    - reference: PMID:23302111
      reference_title: "Syndromic diarrhea/Tricho-hepato-enteric syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        During their clinical course, most of the children require parenteral
        nutrition and often immunoglobulin supplementation. With time, some of
        them can be weaned off parenteral nutrition and immunoglobulin
        supplementation.
      explanation: >-
        Documents both the requirement for parenteral nutrition and the
        possibility of weaning, which distinguishes the prognosis here from the
        enterocyte-structural enteropathies.
    - reference: PMID:29334452
      reference_title: "Trichohepatoenteric Syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        To promote maximal weight gain and linear growth, most children initially require parenteral nutrition (PN). As tolerated, oral feeding (typically a semi-elemental diet) can be combined with PN.
      explanation: >-
        Gives the goal of parenteral nutrition and the stepwise reintroduction of
        oral semi-elemental feeding, which is the practical form the weaning
        takes. Evidence source is OTHER because GeneReviews is a curated review.
- name: Immunoglobulin Replacement
  description: >-
    Immunoglobulin supplementation addresses the defective antibody production
    that is one of the five defining features. GeneReviews states both the
    indication and the goal precisely: it is given to those with low
    immunoglobulin levels or demonstrated functional antibody abnormalities, in
    order to reduce the burden of infections. It is not given to every patient,
    and like parenteral nutrition it can sometimes be withdrawn with time as the
    humoral defect improves with age.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:29334452
    reference_title: "Trichohepatoenteric Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To reduce the burden of infections, immunoglobulins can be supplemented in those with low immunoglobulin levels or immunoglobulin functional abnormalities.
    explanation: >-
      States the indication (low or functionally abnormal immunoglobulins) and
      the therapeutic goal (reducing infection burden) recorded in this
      treatment's description. Evidence source is OTHER because GeneReviews is a
      curated review.
  - reference: PMID:23302111
    reference_title: "Syndromic diarrhea/Tricho-hepato-enteric syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      With time, some of
      them can be weaned off parenteral nutrition and immunoglobulin
      supplementation.
    explanation: >-
      Supports the claim that supplementation is not necessarily lifelong.
  target_mechanisms:

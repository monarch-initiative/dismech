discussions:
- discussion_id: thes_rna_surveillance_to_enteropathy
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does loss of a general cytoplasmic RNA-surveillance complex produce a
    severe, organ-selective enteropathy while the enterocyte brush border remains
    ultrastructurally normal?
  rationale: >-
    THES has a secure gene-to-disease link and an unusually clear molecular
    lesion, but the step from that lesion to the intestinal phenotype is the
    weakest part of the chain. The SKI complex is a housekeeping cofactor with no
    intestine-restricted role, yet the enteropathy is severe and early. The one
    intestinal observation available - reduced expression or mislocalization of
    several brush-border transporters, with a different profile in each patient
    and with basolateral Na/K-ATPase spared - is described by its authors as
    preliminary and does not identify which transcripts or proteins mediate the
    effect. The gap matters for classification as much as for biology: without it,
    THES cannot be assigned to any of the three epithelial CODE mechanism modules,
    and its causal edges to both outputs are typed
    INDIRECT_UNKNOWN_INTERMEDIATES rather than direct.
  proposed_experiments:
  - experiment_id: thes_patient_enteroid_transcriptomics
    name: Transcriptome-wide RNA stability profiling in THES patient enteroids
    description: >-
      Measure transcript half-lives and steady-state abundance genome-wide in
      patient-derived intestinal enteroids carrying TTC37 or SKIV2L variants
      versus controls, to identify which transcripts escape decay and whether the
      affected set is enriched for apical transporters or their trafficking
      machinery.
  - experiment_id: thes_transporter_localization_panel
    name: Systematic brush-border transporter localization panel across genotypes
    description: >-
      Quantify apical versus intracellular localization of the full panel of
      brush-border transporters in biopsies from a genotyped THES cohort, testing
      whether the patient-to-patient variability in profile tracks genotype,
      residual SKI complex function, or neither.
notes: >-
  THES deliberately conforms to none of the three epithelial CODE mechanism
  modules, and the reason is recorded here because the temptation to attach it is
  real. It is not enterocyte_polarity_trafficking_failure: that module requires
  loss of a functionally polarized apical surface, and the decisive finding in
  THES is that the enterocyte brush border is ultrastructurally NORMAL
  (PMID:20176027), with basolateral Na/K-ATPase localization also preserved. It
  is not electrolyte_transport_related_diarrhea: several transporters are
  affected with a different profile in each patient, rather than one named
  transporter failing in every patient, and the diarrhea has no
  ion-specific systemic signature. It is not diet_induced_osmotic_diarrhea: no
  dietary substrate is implicated and no elimination is therapeutic. The villous
  atrophy THES shares with the structural enteropathies is non-specific,
  improves with time, and does not correlate with diarrhea severity, so it should
  not be used to force a conformance.
  Gene symbol note: GeneReviews (PMID:29334452) uses the current HGNC symbols
  SKIC3 (formerly TTC37) and SKIC2 (formerly SKIV2L). This entry binds
  hgnc:23639 and hgnc:10898, which are those genes; the gene_term labels carry
  whatever the local HGNC cache reports, and the older symbols are retained in
  the prose because every cited primary paper uses them.
  Lump/split decision: MONDO:0009105 is an OMIM phenotypic series (OMIMPS:222470)
  with two gene-defined children, THES type 1 (TTC37) and type 2 (SKIV2L). They
  are curated here as has_subtypes of one entry rather than as two entries,
  because the sources describe them as clinically indistinguishable and both act
  by disabling the same complex - the split is molecular, not phenotypic. Should
  a genotype-phenotype difference be established, splitting would be
  straightforward since the subtypes already carry their genes.

name: Trichohepatoenteric Syndrome
creation_date: "2026-08-22T00:00:00Z"
category: Mendelian
synonyms:
- THES
- SD/THE
- syndromic diarrhea
- phenotypic diarrhea of infancy
- tricho-hepato-enteric syndrome
description: >-
  Trichohepatoenteric syndrome (THES), also called syndromic diarrhea, is a rare
  autosomal recessive multisystem disorder and the clearest example in the
  congenital diarrheas and enteropathies (CODEs) of an enteropathy caused by a
  defect in a housekeeping process rather than in any intestine-specific
  machinery. Biallelic variants in TTC37 (THES type 1) or SKIV2L (THES type 2)
  disable the two cofactor subunits of the human SKI complex, a heterotetrameric
  cofactor of the cytoplasmic RNA exosome that carries out mRNA surveillance and
  the decay of aberrant transcripts. This is a Mendelian disease of the RNA
  exosome pathway, and its phenotype is correspondingly multisystem: the
  classical form is defined by five signs - intractable diarrhea of infancy
  beginning in the first month of life, facial dysmorphism (prominent forehead
  and cheeks, broad nasal root, hypertelorism), woolly and easily removable hair
  with trichorrhexis nodosa, immunodeficiency from defective antibody
  production, and intrauterine growth restriction. Liver involvement (fibrosis,
  siderosis, cirrhosis) is inconsistent even between siblings and can precede
  the diarrhea. Mechanistically THES sits apart from the three main epithelial
  CODE classes: the enterocyte brush border is ultrastructurally NORMAL, so this
  is not an enterocyte-structural disease, yet multiple brush-border ion
  transporters show reduced expression or mislocalization with a different
  profile in each patient, so it is not a single-transporter defect either. The
  diarrhea is therefore attributed to loss of post-transcriptional control over
  many target proteins at once rather than to any one missing step. Most children
  require parenteral nutrition and immunoglobulin replacement, but - unlike the
  enterocyte-structural enteropathies - some can be weaned off both, and
  transplantation is not the expected endpoint.

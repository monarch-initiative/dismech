- name: Genetic Counseling
  description: >-
    THES is autosomal recessive, so each sibling of an affected child has a 25%
    chance of being affected and a 50% chance of being an unaffected carrier.
    Once both pathogenic variants are known in the family, carrier testing of
    at-risk relatives, prenatal testing and preimplantation genetic testing
    become available. Consanguinity is frequent in reported families, which
    raises the practical value of counseling.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:29334452
    reference_title: "Trichohepatoenteric Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: >-
      The recurrence risks quoted in this record. Evidence source is OTHER
      because GeneReviews is a curated review.
  - reference: PMID:29334452
    reference_title: "Trichohepatoenteric Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Once the SKIC2 or SKIC3 pathogenic variants have been identified in an affected family member, carrier testing of at-risk relatives, prenatal testing for a pregnancy at increased risk, and preimplantation genetic testing are possible.
    explanation: >-
      Supports the reproductive testing options offered once the family's
      variants are known.

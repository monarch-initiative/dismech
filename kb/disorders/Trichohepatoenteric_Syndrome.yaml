- name: Decreased Circulating Immunoglobulin Concentration
  category: Immunological
  description: >-
    Immunodeficiency from defective antibody production, with low serum
    immunoglobulins and poor immunological response to childhood vaccination.
    It often, but not always, improves with age, and many children need
    immunoglobulin replacement.
  phenotype_term:
    preferred_term: Decreased circulating immunoglobulin concentration
    term:
      id: HP:0004313
      label: Decreased circulating immunoglobulin concentration
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:20176027
    reference_title: "Mutations in TTC37 cause trichohepatoenteric syndrome (phenotypic diarrhea of infancy)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunodeficiency is a consistent feature with low serum concentrations of
      immunoglobulins (which often, but not always, improves with age) and a poor
      immunological response to childhood vaccination.
    explanation: >-
      Describes the immunodeficiency and its natural history; "a consistent
      feature" supports the VERY_FREQUENT band.
- name: Immunodeficiency
  category: Immunological
  description: >-
    THES appears in the IUIS classification of inborn errors of immunity on the
    strength of this feature, but its character is worth stating precisely: what
    is established is defective antibody production with low immunoglobulins and
    poor vaccine responses, and GeneReviews describes the immunodeficiency
    overall as "poorly characterized". No consistent cellular immune defect has
    been defined, and the humoral defect often improves with age. The
    immunodeficiency here is therefore a consequence of losing
    post-transcriptional control over many gene products, not a lesion in a
    named immune pathway - which is why THES sits among the syndromic rather than
    the mechanistically-defined immunodeficiencies.
  phenotype_term:
    preferred_term: Immunodeficiency
    term:
      id: HP:0002721
      label: Immunodeficiency
  evidence:
  - reference: PMID:29334452
    reference_title: "Trichohepatoenteric Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Additional findings include poorly characterized immunodeficiency, recurrent infections, skin abnormalities, and liver disease.
    explanation: >-
      GeneReviews names immunodeficiency as a feature of THES and, in the same
      clause, records that it is poorly characterized - the qualification this
      record is careful to preserve. Evidence source is OTHER because
      GeneReviews is a curated review.
  - reference: PMID:20176027
    reference_title: "Mutations in TTC37 cause trichohepatoenteric syndrome (phenotypic diarrhea of infancy)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunodeficiency is a consistent feature with low serum concentrations of
      immunoglobulins (which often, but not always, improves with age) and a poor
      immunological response to childhood vaccination.
    explanation: >-
      Identifies the one well-characterized component of the immune defect -
      impaired antibody production - and its tendency to improve with age.

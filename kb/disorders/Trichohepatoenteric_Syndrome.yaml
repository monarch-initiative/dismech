      cirrhosis (even before the onset of diarrhoea).
    explanation: >-
      Supports both the phenotype and the OCCASIONAL band, since the source
      describes hepatic involvement as inconsistent even within families.
diagnosis:
- name: TTC37 and SKIV2L sequencing
  description: >-
    Diagnosis is initially clinical, based on the five defining signs, and is
    confirmed by direct sequencing of TTC37 and SKIV2L. Because the two genotypes
    are clinically indistinguishable, both must be tested.
  evidence:
  - reference: PMID:23302111
    reference_title: "Syndromic diarrhea/Tricho-hepato-enteric syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis SD/THE is initially based on clinical findings and confirmed
      by direct sequencing of TTC37 and SKIV2L.
    explanation: >-
      States the diagnostic pathway - clinical recognition confirmed by
      sequencing both SKI complex genes.
- name: Intestinal biopsy to exclude other causes
  description: >-
    Biopsy is used to distinguish THES from the other causes of intractable
    infantile diarrhea rather than to make the diagnosis positively: histology is
    non-specific and the brush border is ultrastructurally normal, which excludes
    the enterocyte-structural enteropathies.
  evidence:
  - reference: PMID:23302111
    reference_title: "Syndromic diarrhea/Tricho-hepato-enteric syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Differential diagnosis with the other causes of intractable diarrhea is
      easily performed by pathologic investigations.
    explanation: >-
      Supports the role of histopathology as a discriminator against the other
      congenital enteropathies rather than as a positive diagnostic test.
treatments:
- name: Parenteral Nutrition
  description: >-
    Most children require parenteral nutrition to maintain life and growth. The
    important prognostic difference from the enterocyte-structural enteropathies
    is that dependence is not necessarily permanent: some children can be weaned
    to full enteral feeding over time, and transplantation is not the expected
    endpoint.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Total Parenteral Nutrition
    term:
      id: NCIT:C29484
      label: Total Parenteral Nutrition
  target_mechanisms:
  - target: Intractable Infantile Diarrhea with a Structurally Normal Brush Border
    treatment_effect: BYPASSES
    description: >-
      Intravenous nutrition bypasses the failing intestine; it does not act on
      the SKI complex defect or restore transporter localization.
    evidence:
    - reference: PMID:23302111
      reference_title: "Syndromic diarrhea/Tricho-hepato-enteric syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        During their clinical course, most of the children require parenteral
        nutrition and often immunoglobulin supplementation. With time, some of
        them can be weaned off parenteral nutrition and immunoglobulin
        supplementation.
      explanation: >-
        Documents both the requirement for parenteral nutrition and the
        possibility of weaning, which distinguishes the prognosis here from the
        enterocyte-structural enteropathies.
- name: Immunoglobulin Replacement
  description: >-
    Immunoglobulin supplementation addresses the defective antibody production
    that is one of the five defining features. Like parenteral nutrition it can
    sometimes be withdrawn with time as the humoral defect improves with age.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Multisystem Involvement Outside the Gut
    treatment_effect: INHIBITS
    description: >-
      Replacing immunoglobulin offsets the defective antibody production arm of
      the extraintestinal phenotype without acting on its cause.
    evidence:
    - reference: PMID:23302111
      reference_title: "Syndromic diarrhea/Tricho-hepato-enteric syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        most of the children require parenteral nutrition and often
        immunoglobulin supplementation
      explanation: >-
        Documents immunoglobulin supplementation as standard management for the
        immunodeficiency arm.

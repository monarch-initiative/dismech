genetic:
- name: TTC37 loss-of-function variants
  gene_term:
    preferred_term: TTC37
    term:
      id: hgnc:23639
      label: TTC37
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: THES type 1
  features: >-
    Biallelic TTC37 variants cause THES type 1. TTC37 encodes a
    tetratricopeptide-repeat protein (thespin) that is the human ortholog of the
    yeast SKI complex cofactor Ski3p. The gene was identified by autozygosity
    mapping to 5q14.3-5q21.2 followed by candidate sequencing. Because the
    protein acts in protein-protein interaction or chaperone-like roles within
    the complex, its loss has a multisystem effect attributed to abnormal
    stability or intracellular localization of its target proteins rather than
    to loss of one enzymatic activity.
  evidence:
  - reference: PMID:20176027
    reference_title: "Mutations in TTC37 cause trichohepatoenteric syndrome (phenotypic diarrhea of infancy)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing of candidate genes showed mutations in TTC37, which encodes the
      uncharacterized tetratricopeptide repeat protein, thespin.
    explanation: >-
      The gene-discovery report identifying TTC37 as the cause of THES.
  - reference: PMID:20176027
    reference_title: "Mutations in TTC37 cause trichohepatoenteric syndrome (phenotypic diarrhea of infancy)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TTC37 mutations have a multisystem effect, which may be owing to abnormal
      stability and/or intracellular localization of TTC37 target proteins.
    explanation: >-
      States the proposed mechanism by which a single gene defect produces the
      multisystem phenotype, and is explicitly hedged ("may be owing to"), which
      is why the corresponding causal edge is not typed as direct.
- name: SKIV2L loss-of-function variants
  gene_term:
    preferred_term: SKIV2L
    term:
      id: hgnc:10898
      label: SKIV2L
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: THES type 2
  features: >-
    Biallelic SKIV2L variants cause THES type 2, which is clinically
    indistinguishable from type 1. SKIV2L encodes the RNA helicase subunit of the
    same SKI complex. Its discovery is a clean worked example of
    mechanism-directed gene finding: because TTC37 was recognised as the ortholog
    of the yeast Ski-complex cofactor Ski3p, the authors sequenced a second
    Ski-complex gene in six TTC37-negative patients with typical disease and
    found mutations in all six. That both cofactors of one complex produce the
    same disease is the strongest evidence that the pathogenic unit is the
    complex rather than either protein.
  evidence:
  - reference: PMID:22444670
    reference_title: "SKIV2L mutations cause syndromic diarrhea, or trichohepatoenteric syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we explored a gene encoding another Ski-complex cofactor, SKIV2L, in six
      individuals presenting with typical syndromic diarrhea without variation in
      TTC37. We identified mutations in all six individuals.
    explanation: >-
      The gene-discovery report for THES type 2, and evidence that the two genes
      are alternative routes to one disease since the SKIV2L patients had typical
      disease without TTC37 variants.
  - reference: PMID:22444670
    reference_title: "SKIV2L mutations cause syndromic diarrhea, or trichohepatoenteric syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results show that mutations in genes encoding cofactors of the human
      Ski complex cause syndromic diarrhea, establishing a link between defects
      of the human exosome complex and a Mendelian disease.
    explanation: >-
      States the conclusion that defines this disease's mechanistic class - a
      Mendelian disease of the RNA exosome pathway.
pathophysiology:
- name: Loss of a Human SKI Complex Cofactor
  description: >-
    The initiating lesion. The SKI complex is a heterotetrameric cytoplasmic
    cofactor of the RNA exosome, and TTC37 and SKIV2L encode two of its subunits
    - a tetratricopeptide-repeat scaffold protein and an RNA helicase
    respectively. Biallelic loss of either subunit disables the complex, and
    because both routes produce clinically indistinguishable disease the
    pathogenic unit is the complex rather than either individual protein. This is
    a housekeeping lesion, not a gut-specific one: nothing about the SKI complex
    is intestine-restricted, which is why the resulting disease is multisystem
    and why the enteropathy needs explaining rather than being self-evident.
  role: trigger
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: SKIV2L RNA helicase activity
    term:
      id: GO:0003724
      label: RNA helicase activity
    modifier: LOSS_OF_FUNCTION
  cellular_components:
  - preferred_term: Ski complex
    term:
      id: GO:0055087
      label: Ski complex
  evidence:
  - reference: PMID:23302111
    reference_title: "Syndromic diarrhea/Tricho-hepato-enteric syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The aetiology is a defect in TTC37, a TPR containing protein, or in the RNA
      helicase SKIV2L, both constituting the putative human ski complex.
    explanation: >-
      Identifies the two subunits whose loss defines this node and states that
      both constitute the same complex. Evidence source is OTHER because this is
      a review.
  downstream:
  - target: Failure of Exosome-Mediated Cytoplasmic mRNA Surveillance
    causal_link_type: DIRECT
- name: Failure of Exosome-Mediated Cytoplasmic mRNA Surveillance
  description: >-
    The rate-limiting step. The SKI complex delivers transcripts to the
    cytoplasmic RNA exosome for degradation, so it is required both for normal
    mRNA turnover and for the decay of aberrant or nonfunctional transcripts.
    Losing it removes post-transcriptional quality control over the whole
    cytoplasmic transcriptome rather than over any particular gene product. This
    is the node that makes the disease multisystem, and it is also why THES
    resists the tidy trigger-to-organ logic of the other congenital diarrheas:
    the downstream consequences depend on which transcripts and proteins are most
    sensitive to loss of surveillance in each tissue, which is not fully
    characterised.
  role: central_effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Exosome-mediated mRNA decay
    term:
      id: GO:0000956
      label: nuclear-transcribed mRNA catabolic process
    modifier: DECREASED
  - preferred_term: RNA surveillance and turnover
    term:
      id: GO:0006401
      label: RNA catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:22444670
    reference_title: "SKIV2L mutations cause syndromic diarrhea, or trichohepatoenteric syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Ski complex is a multiprotein complex required for exosome-mediated RNA
      surveillance, including the regulation of normal mRNA and the decay of
      nonfunctional mRNA.
    explanation: >-
      States the function lost at this node - exosome-mediated RNA surveillance
      covering both normal mRNA regulation and decay of nonfunctional transcripts.
  downstream:
  - target: Dysregulated Abundance and Localization of Target Proteins
    causal_link_type: DIRECT
- name: Dysregulated Abundance and Localization of Target Proteins
  description: >-
    The proposed bridge between a general RNA-surveillance defect and the
    tissue-specific phenotypes, and the least certain step in the chain. Loss of
    the SKI complex is proposed to destabilize or mislocalize its downstream
    target proteins rather than eliminate one activity. In the intestine this is
    directly observable: several enterocyte brush-border ion transporters - NHE2,
    NHE3, aquaporin 7, the sodium-iodide symporter and H/K-ATPase - show reduced
    expression or mislocalization, and critically the profile differs between
    patients. Basolateral Na/K-ATPase localization is by contrast unaltered, so
    the effect is selective rather than a global collapse of membrane protein
    trafficking. The absence of a single consistent transporter defect is what
    distinguishes THES from the electrolyte-transport-related congenital
    diarrheas, where one named transporter fails in every patient.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Small-intestinal enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  biological_processes:
  - preferred_term: Apical membrane transporter localization
    term:
      id: GO:0072659
      label: protein localization to plasma membrane
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: Enterocyte brush border
    term:
      id: GO:0005903
      label: brush border
  evidence:
  - reference: PMID:20176027
    reference_title: "Mutations in TTC37 cause trichohepatoenteric syndrome (phenotypic diarrhea of infancy)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      showed reduced expression or mislocalization in all THES patients with
      different profiles for each
    explanation: >-
      Documents the multi-transporter, patient-variable abnormality this node
      describes; in the source this clause completes a sentence listing NHE2,
      NHE3, aquaporin 7, the sodium iodide symporter and H/K-ATPase. The quote is
      trimmed to start after that list because the source writes "[ATPase]" in
      brackets, and bracketed spans are stripped before snippet matching. The
      authors label these studies "preliminary", which the node description
      records rather than presenting as settled.
  - reference: PMID:20176027
    reference_title: "Mutations in TTC37 cause trichohepatoenteric syndrome (phenotypic diarrhea of infancy)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast the basolateral localization of Na/K ATPase was not altered.
    explanation: >-
      Establishes that the mislocalization is selective for apical transporters
      rather than a general failure of membrane protein delivery, which is what
      separates this node from the enterocyte-trafficking enteropathies.
  downstream:
  - target: Intractable Infantile Diarrhea with a Structurally Normal Brush Border
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Multisystem Involvement Outside the Gut
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Intractable Infantile Diarrhea with a Structurally Normal Brush Border
  description: >-
    The intestinal output, and the finding that fixes this disorder's position in
    the CODE nosology. Diarrhea begins in the first month of life - not at birth -
    and is severe enough to require parenteral nutrition. On biopsy the mucosa
    shows non-specific changes: initial subtotal villous atrophy that improves
    with time, with a variable mixed inflammatory infiltrate, and severity of
    diarrhea does not correlate with the histological change. Crucially the
    enterocyte brush border is ultrastructurally NORMAL, which excludes the
    enterocyte-structural mechanism of microvillus inclusion disease and tufting
    enteropathy despite the villous atrophy the two classes share.
  role: consequence
  biological_scale: ORGANISM
  locations:
  - preferred_term: Small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  evidence:
  - reference: PMID:20176027
    reference_title: "Mutations in TTC37 cause trichohepatoenteric syndrome (phenotypic diarrhea of infancy)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On microscopy intestinal changes are non-specific; initial subtotal villous
      atrophy improves with time (although severity of diarrhoea does not
      correlate with the histological change)
    explanation: >-
      Documents the non-specific, improving mucosal histology and its lack of
      correlation with symptom severity - evidence that the diarrhea is not
      driven by the architectural change.
  - reference: PMID:20176027
    reference_title: "Mutations in TTC37 cause trichohepatoenteric syndrome (phenotypic diarrhea of infancy)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The enterocyte brush border is ultrastructurally normal.
    explanation: >-
      The decisive negative finding placing THES outside the enterocyte-structural
      CODE class, and the reason this entry does not conform to
      enterocyte_polarity_trafficking_failure.
- name: Multisystem Involvement Outside the Gut
  description: >-
    The extraintestinal output, expected of a housekeeping-gene disorder and
    unusual among the congenital diarrheas. Hair is woolly, coarse, sparse and
    fragile with trichorrhexis nodosa; facial features are distinctive
    (hypertelorism, broad flat nasal bridge, prominent forehead); antibody
    production is defective, giving low immunoglobulins and poor response to
    childhood vaccination, though this often improves with age. Intrauterine
    growth restriction is one of the five defining signs. Liver involvement -
    hepatomegaly, fibrosis, siderosis, cirrhosis - is inconsistent even between
    siblings, occurs irrespective of parenteral nutrition, and can precede the
    onset of diarrhea, which is what establishes it as intrinsic to the disease
    rather than a complication of treatment.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:23302111
    reference_title: "Syndromic diarrhea/Tricho-hepato-enteric syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The classical form is characterized by 5 clinical signs: intractable
      diarrhea of infancy beginning in the first month of life, usually leading
      to failure to thrive and requiring parenteral nutrition; facial dysmorphism
      characterised by prominent forehead and cheeks, broad nasal root and
      hypertelorism; hair abnormalities described as woolly and easily removable;
      immune disorders resulting from defective antibody production; intrauterine
      growth restriction.
    explanation: >-
      Enumerates the five defining clinical signs of the classical form, four of
      which are the extraintestinal features of this node.
  - reference: PMID:20176027
    reference_title: "Mutations in TTC37 cause trichohepatoenteric syndrome (phenotypic diarrhea of infancy)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hepatic involvement is inconsistent, even among siblings, and irrespective
      of parenteral nutrition can include hepatomegaly, fibrosis, siderosis and
      cirrhosis (even before the onset of diarrhoea).
    explanation: >-
      Establishes the liver disease as intrinsic and variable rather than a
      consequence of parenteral nutrition, since it occurs irrespective of it and
      can precede the diarrhea.

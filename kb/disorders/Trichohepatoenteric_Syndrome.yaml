- population: Worldwide
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.1
  notes: >-
    Estimated prevalence 1/1,000,000 births, i.e. 0.1 per 100,000. An earlier

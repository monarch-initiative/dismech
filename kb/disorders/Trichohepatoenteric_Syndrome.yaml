inheritance:
- name: Autosomal recessive inheritance
  description: >-
    THES is autosomal recessive. Consanguinity is frequent in reported families;
    the gene-discovery study used autozygosity mapping in eight patients from
    consanguineous families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:

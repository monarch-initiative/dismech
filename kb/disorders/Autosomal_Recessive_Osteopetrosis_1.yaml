genetic:
- name: TCIRG1
  gene_term:
    preferred_term: TCIRG1
    term:
      id: hgnc:11647
      label: TCIRG1
  association: Causative
  relationship_type: CAUSATIVE
  notes: >
    Biallelic (homozygous or compound heterozygous) loss-of-function variants in
    TCIRG1 on chromosome 11q13.2, encoding the osteoclast-specific a3 subunit of
    the vacuolar H+-ATPase. The variant spectrum is dominated by nonsense,
    frameshift and splice-site alleles predicted to be null; missense alleles are
    a minority and at least one, p.Arg444Leu, is a loss of function by
    mistrafficking rather than by loss of catalytic residues. Splice-region
    substitutions are a large share of the total, which is why variants of
    uncertain significance in TCIRG1 often need a functional splicing assay
    rather than sequence-based prediction alone. Severity tracks residual a3
    function: hypomorphic splice alleles have been reported in adults with
    radiographic osteopetrosis and no neurological or haematological disease.
  evidence:
  - reference: PMID:10888887
    reference_title: "Defects in TCIRG1 subunit of the vacuolar proton pump are responsible for a subset of human autosomal recessive osteopetrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TCIRG1, encoding the osteoclast-specific 116-kD subunit of the vacuolar proton pump, is mutated in five of nine patients with a diagnosis of infantile malignant osteopetrosis"
    explanation: "The original report identifying TCIRG1 as a cause of infantile malignant osteopetrosis."
  - reference: PMID:11532986
    reference_title: "The mutational spectrum of human malignant autosomal recessive osteopetrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we have now established that ATP6i mutations are responsible for approximately 50% of patients affected by this disease"
    explanation: >-
      Quantifies the share of autosomal recessive osteopetrosis attributable to
      TCIRG1 across 44 unrelated families worldwide. ATP6i is a synonym of TCIRG1.
  - reference: PMID:11532986
    reference_title: "The mutational spectrum of human malignant autosomal recessive osteopetrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The vast majority of these mutations (40 out of 42 alleles, including seven deletions, two insertions, 10 nonsense substitutions and 21 mutations in splice sites) are predicted to cause severe abnormalities in the protein product and are likely to represent null alleles"
    explanation: "Establishes that the pathogenic variant spectrum is predominantly null alleles."
  - reference: PMID:15300850
    reference_title: "TCIRG1-dependent recessive osteopetrosis: mutation analysis, functional identification of the splicing defects, and in vitro rescue by U1 snRNA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "As substitutions in splicing regulatory sequences represented a large portion (40%; 44 alleles) of the TCIRG1 variations, we developed a functional splicing assay to distinguish between polymorphic variants and disease-causing mutations."
    explanation: >-
      Supports the note that splice-region substitutions are a large share of the
      TCIRG1 variant spectrum and need a functional assay to classify.
  - reference: PMID:28816234
    reference_title: "Novel mutations of TCIRG1 cause a malignant and mild phenotype of autosomal recessive osteopetrosis (ARO) in four Chinese families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The remaining one, a 24-year-old male from a consanguineous family, was diagnosed based on radiological findings but presented no neurological or hematological defects. He was homozygous for c.2236+6T>G in intron 18; this mutation influenced the splicing process."
    explanation: >-
      A hypomorphic splice allele giving survival to adulthood without neurological
      or haematological disease. This is the clearest published demonstration that
      residual a3 function, rather than the presence of biallelic TCIRG1 variants
      as such, sets the severity of this disease.
  - reference: PMID:22685294
    reference_title: "Osteopetrosis mutation R444L causes endoplasmic reticulum retention and misprocessing of vacuolar H+-ATPase a3 subunit."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the mutant glycoprotein localized to the ER instead of lysosomes and its oligosaccharide moiety was misprocessed"
    explanation: >-
      Shows that the R444L missense allele is a loss of function by ER retention
      and mistrafficking rather than by loss of a catalytic residue.
diagnosis:
- name: Molecular confirmation of biallelic TCIRG1 variants
  description: >
    The diagnosis is established by characteristic clinical, laboratory and
    imaging findings together with biallelic pathogenic TCIRG1 variants. Because
    rare heterozygous TCIRG1 variants have been reported in affected individuals,
    a single identified variant does not by itself exclude the diagnosis.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:40875877
    reference_title: "TCIRG1-Related Osteopetrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of TCIRG1-related osteopetrosis is established in a proband with characteristic clinical, laboratory, and imaging findings and biallelic pathogenic variants in TCIRG1 identified by molecular genetic testing."
    explanation: "The confirmatory test, from the GeneReviews chapter for this gene."
  - reference: PMID:40875877
    reference_title: "TCIRG1-Related Osteopetrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Note: Heterozygous TCIRG1 pathogenic variants have been rarely reported in individuals with TCIRG1-related osteopetrosis."
    explanation: >-
      The caveat that makes a single-variant result non-exclusionary, stated in the
      same chapter's diagnosis section.
- name: Skeletal survey
  description: >
    Radiographic diagnosis rests on generalized osteosclerosis with the
    characteristic bone-in-bone appearance and Erlenmeyer flask metaphyseal
    flaring, which develop toward the end of early childhood. Metaphyseal
    osteopetrorickets is present earlier and is easy to miss against the diffuse
    increase in density.
  diagnosis_term:
    preferred_term: skeletal survey radiography
    term:
      id: NCIT:C38092
      label: Skeletal Survey X-Ray
  evidence:
  - reference: PMID:42661684
    reference_title: "Osteopetrorickets and calcium homeostasis in children with osteopetrosis: an endocrinological single-center study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Osteopetrorickets is clinically important because it may be overlooked in the presence of diffusely increased bone density, although impaired mineralization may coexist with osteosclerosis."
    explanation: >-
      States the radiographic trap this diagnostic step has to avoid, which is why
      the mineralization defect is looked for separately from the sclerosis.
- name: Osteoclast-rich marrow histology
  description: >
    Bone marrow biopsy in this form shows osteoclasts present in normal or
    increased numbers, and non-functional. That is the bedside correlate of the
    entry's central mechanistic claim, and it is what separates TCIRG1
    osteopetrosis from the osteoclast-poor RANK/RANKL forms, which the
    radiographic appearance alone does not.
  diagnosis_term:
    preferred_term: bone marrow biopsy
    term:
      id: NCIT:C15193
      label: Bone Marrow Biopsy
  evidence:
  - reference: PMID:35981697
    reference_title: "Osteoclast rich osteopetrosis due to defects in the TCIRG1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TCIRG1 defects lead to inefficient bone resorption by nonfunctional osteoclasts seen in abundance on bone marrow biopsy, delineating this ARO as 'osteoclast-rich'"
    explanation: >-
      Names the biopsy finding and the classification it supports, which is the
      diagnostic value of the test here.
  - reference: PMID:10888887
    reference_title: "Defects in TCIRG1 subunit of the vacuolar proton pump are responsible for a subset of human autosomal recessive osteopetrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Osteoclasts are present in normal or elevated numbers in individuals affected by autosomal recessive osteopetrosis, suggesting that the defect is not in osteoclast differentiation, but in a gene involved in the functional capacity of mature osteoclasts"
    explanation: >-
      The original observation that osteoclast number is preserved, which is what
      makes the count diagnostically informative rather than merely descriptive.
treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >
    The only curative treatment. The osteoclast lineage is haematopoietic, so
    donor-derived monocyte precursors give rise to osteoclasts carrying a
    functional a3 subunit and bone resorption is restored. Transplantation
    corrects the mechanism but does not reverse damage already inflicted, so
    vision and hearing lost to cranial nerve compression before transplant do
    not recover; this is what makes early molecular diagnosis the main
    determinant of outcome rather than transplant technique.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic haematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Vacuolar Proton Pump Deficiency in Osteoclasts
    description: >-
      Replacing host osteoclast precursors with donor cells restores a3 subunit
      expression in the osteoclast lineage and so restores lacunar acidification.
    evidence:
    - reference: PMID:42162874
      reference_title: "Hematopoietic Stem Cell Transplantation in Infantile Osteopetrosis: Lessons from a Resource-Limited Setting."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The defective osteoclast differentiation or function is of hemopoietic origin, thus making Hematopoietic stem cell transplantation (HSCT) the only curative treatment option for this condition."
      explanation: >-
        States the reason transplantation targets this node: the defective cell
        lineage is haematopoietic and therefore replaceable.
  evidence:
  - reference: PMID:40875877
    reference_title: "TCIRG1-Related Osteopetrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hematopoietic stem cell therapy (HSCT) for those with hematologic failure with imminent vision loss, severe osteopetrosis with bone marrow failure, or severe osteopetrosis in children younger than age one year, ideally prior to age ten months."
    explanation: >-
      GeneReviews indication and timing for this gene. The "ideally prior to age ten
      months" threshold is the citable form of this entry's claim that outcome turns
      on how early the diagnosis is made.
  - reference: PMID:42162874
    reference_title: "Hematopoietic Stem Cell Transplantation in Infantile Osteopetrosis: Lessons from a Resource-Limited Setting."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OS and DFS for the study were 80%."
    explanation: >-
      Overall and disease-free survival in a 10-patient fully HLA-matched cohort,
      three of whom had confirmed TCIRG1 variants. The cohort is small and
      single-centre, so this figure is indicative rather than a population estimate.
  notes: >-
    The survival figure quoted here is from a 10-patient single-centre cohort
    that was not restricted to TCIRG1 and included one RANK case, so it should
    not be read as a TCIRG1-specific outcome.
- name: Recombinant Human Interferon Gamma-1b
  description: >
    Adjunctive, non-curative therapy used as a bridge to transplantation. It
    increases osteoclastic bone resorption and corrects the reduced leukocyte
    superoxide generation that accompanies the osteoclast defect, improving
    marrow space, haemoglobin and infection frequency without addressing the
    underlying V-ATPase lesion.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: interferon gamma-1b
      term:
        id: NCIT:C100089
        label: Interferon Gamma-1b
  dosing_interval: three times per week
  evidence:
  - reference: PMID:40875877
    reference_title: "TCIRG1-Related Osteopetrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interferon gamma-1b (IFN-γ1b) may be considered in infantile TCIRG1-related osteopetrosis, to serve as a bridge to HSCT."
    explanation: >-
      GeneReviews states the indication for this gene specifically, and states it as
      a bridge rather than a treatment, which is how this entry describes it.
  - reference: PMID:7753137
    reference_title: "Long-term treatment of osteopetrosis with recombinant human interferon gamma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After 6 months of therapy, all 14 patients had decreases in trabecular-bone area (determined by histomorphometric analysis of bone-biopsy specimens) and increases in bone marrow space (determined by marrow imaging), and the improvement was sustained in the 11 patients treated for 18 months."
    explanation: >-
      The trial evidence that interferon gamma-1b measurably increases resorption
      and reclaims marrow space in severe osteopetrosis.
  - reference: PMID:7753137
    reference_title: "Long-term treatment of osteopetrosis with recombinant human interferon gamma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean (+SD) hemoglobin concentration increased from 7.5 +/- 2.9 to 10.5 +/- 0.3 g per deciliter (P = 0.05), and superoxide generation by granulocyte-macrophage colonies increased (P < 0.001) after 18 months of therapy."
    explanation: >-
      Quantifies the haematological and leukocyte-function response, which is the
      basis for using it as a bridge rather than as a definitive treatment.
  notes: >-
    This trial predates routine molecular diagnosis and enrolled "severe
    osteopetrosis" rather than genotyped TCIRG1 patients, so the response cannot
    be attributed to the TCIRG1 form specifically. Note also that the trial
    reports increased osteoclastic resorption in cells that, in ARO1, cannot
    acidify at all; how much benefit is achievable through a null a3 subunit is
    not resolved by this study.
  review_notes: >-
    Dosing is 1.5 micrograms per kilogram per dose subcutaneously, three times
    per week, in the cited trial. dosing_interval_days is deliberately left
    unset because the schedule is three doses per week rather than one dose every
    N days, and forcing it to 2.33 would misrepresent the regimen.

animal_models:
- name: Atp6i (Tcirg1) knockout mouse
  species: Mouse
  genotype: Atp6i (Tcirg1) targeted null, homozygous
  publication: PMID:10581033
  description: >
    Targeted disruption of the murine Tcirg1 orthologue Atp6i. This is the model
    that localised the human lesion to extracellular acidification specifically:
    the knockout osteoclasts fail to acidify the resorption compartment while
    lysosomal proton pumping, renal microsomal proton transport, and systemic
    acid-base balance are all normal.
  modeled_mechanisms:
  - target: Vacuolar Proton Pump Deficiency in Osteoclasts
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Loss of the same subunit in the same cell type, with the same
      compartment-restricted acidification defect.
    limitations: >-
      The compartment specificity was shown in cultured osteoclast-like cells
      derived from the knockout rather than in situ at a resorption lacuna.
    readouts:
    - name: Extracellular acidification by osteoclast-like cells
      target: Vacuolar Proton Pump Deficiency in Osteoclasts
      direction: ABOLISHED
      interpretation: >-
        Direct measurement of the function this node claims is lost.
      evidence:
      - reference: PMID:10581033
        reference_title: "Atp6i-deficient mice exhibit severe osteopetrosis due to loss of osteoclast-mediated extracellular acidification."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Atp6i-/- osteoclast-like cells (OCLs) lose the function of extracellular acidification, but retain intracellular lysosomal proton pump activity"
        explanation: "Reports the abolished extracellular acidification alongside the preserved lysosomal activity."
    - name: Lysosomal pH in liver
      target: Vacuolar Proton Pump Deficiency in Osteoclasts
      direction: UNCHANGED
      interpretation: >-
        A negative result that bounds the node: the lesion does not extend to
        lysosomal acidification, so this is not a generalised V-ATPase failure.
      evidence:
      - reference: PMID:10581033
        reference_title: "Atp6i-deficient mice exhibit severe osteopetrosis due to loss of osteoclast-mediated extracellular acidification."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The pH in Atp6i-/- liver lysosomes and proton transport in microsomes of Atp6i-/- kidney are identical to that in wild-type mice."
        explanation: "Records the measurement showing lysosomal and renal proton handling are unaffected."
    evidence:
    - reference: PMID:10581033
      reference_title: "Atp6i-deficient mice exhibit severe osteopetrosis due to loss of osteoclast-mediated extracellular acidification."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "targeted disruption of Atp6i in mice results in severe osteopetrosis"
      explanation: >-
        Establishes that removing this subunit is sufficient to produce the disease
        phenotype, which is what makes the model informative for this node.
- name: oc/oc mouse
  species: Mouse
  genotype: oc/oc, spontaneous 1.6 kb deletion at the 5-prime end of Tcirg1
  publication: PMID:39314524
  description: >
    Spontaneous Tcirg1-deficient mutant carrying a 5-prime deletion that abolishes
    transcription of the proton-pump subunit. Lifespan is under three weeks. It is
    the model used for the lentiviral gene-therapy work that motivated the
    discontinued phase I trial NCT04525352.
  modeled_mechanisms:
  - target: Progressive Skeletal Sclerosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Generalised increase in skeletal density with marrow-cavity fibrosis and
      extramedullary haematopoiesis, matching the human skeletal and haematologic
      branches.
    limitations: >-
      Murine lifespan is under three weeks, so the model cannot express the
      progressive cranial nerve compression that dominates human morbidity, and
      skull foramen anatomy differs. Judgements about long-term neurological
      outcome do not transfer from it.
    evidence:
    - reference: PMID:39314524
      reference_title: "Correction of osteopetrosis in the neonate oc/oc murine model after lentiviral vector gene therapy and non-genotoxic conditioning."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The Tcirg1-defective oc/oc mouse model displays a short lifespan and high bone density, closely mirroring the human condition."
      explanation: "The authors' own statement of what the model reproduces, and of its short lifespan."
  - target: Bone Marrow Failure from Medullary Obliteration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Marrow-cavity fibrosis with extramedullary haematopoiesis, reversible by
      gene therapy in the model.
    limitations: >-
      Correction was measured over a murine lifespan; durability over the decades
      relevant to a transplanted child is not addressed.
    evidence:
    - reference: PMID:39314524
      reference_title: "Correction of osteopetrosis in the neonate oc/oc murine model after lentiviral vector gene therapy and non-genotoxic conditioning."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "lentiviral vector GT can revert the osteopetrotic bone phenotype, allowing long-term survival and reducing extramedullary haematopoiesis"
      explanation: >-
        Shows the marrow phenotype is present in the model and is reversed by
        restoring the missing subunit, which supports the causal direction of this node.

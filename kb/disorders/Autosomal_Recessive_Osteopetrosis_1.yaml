name: Autosomal Recessive Osteopetrosis 1
creation_date: '2026-02-13T00:31:42Z'
category: Mendelian
description: >
  Autosomal recessive osteopetrosis 1 (ARO1, OPTB1, malignant infantile
  osteopetrosis) is a severe sclerosing bone disease caused by biallelic
  loss-of-function variants in TCIRG1, encoding the osteoclast-specific a3
  subunit of the vacuolar H+-ATPase. TCIRG1 variants are the most frequent
  cause of infantile malignant osteopetrosis, accounting for roughly half of
  autosomal recessive osteopetrosis cases. Osteoclasts differentiate normally
  and are present in normal or elevated numbers, but cannot acidify the
  resorption lacuna, so bone mineral is never dissolved; this is what makes
  ARO1 an osteoclast-rich osteopetrosis, in contrast to the osteoclast-poor
  forms caused by defects in the RANK/RANKL differentiation axis. The defect
  is specific to extracellular acidification: lysosomal proton pumping and
  systemic acid-base balance are preserved, which separates ARO1 from carbonic
  anhydrase II deficiency. Failure of resorption produces dense but brittle
  bones, obliteration of the medullary cavity with marrow failure and
  compensatory extramedullary haematopoiesis, cranial nerve compression at
  unwidened skull foramina, and hypocalcaemia with secondary
  hyperparathyroidism and superimposed rickets. Without haematopoietic stem
  cell transplantation the disease is usually fatal within the first decade.
disease_term:
  preferred_term: autosomal recessive osteopetrosis 1
  term:
    id: MONDO:0009815
    label: autosomal recessive osteopetrosis 1
parents:
- Sclerosing Bone Dysplasias
inheritance:
- name: Autosomal Recessive
  description: >
    Autosomal recessive inheritance. Biallelic (homozygous or compound
    heterozygous) TCIRG1 variants.

    Typically, but not exclusively. GeneReviews records rare exceptions: one
    family with heterozygous variants and autosomal dominant osteopetrosis, and
    one individual with a heterozygous de novo variant. Those are quoted in the
    evidence below rather than smoothed away, because this entry is bound to
    MONDO:0009815 on the basis of gene identity and the exceptions bear on how
    firmly that identity is drawn.
  evidence:
  - reference: PMID:10888887
    reference_title: "Defects in TCIRG1 subunit of the vacuolar proton pump are responsible for a subset of human autosomal recessive osteopetrosis."
    supports: SUPPORT
    snippet: "TCIRG1, encoding the osteoclast-specific 116-kD subunit of the vacuolar proton pump, is mutated in five of nine patients with a diagnosis of infantile malignant osteopetrosis"
    explanation: "TCIRG1 mutations identified as a frequent cause of autosomal recessive osteopetrosis."
  - reference: PMID:40875877
    reference_title: "TCIRG1-Related Osteopetrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "each sib of an affected individual has at conception a 25% chance of having TCIRG1-related osteopetrosis, a 50% chance of being heterozygous, and a 25% chance of inheriting neither of the familial TCIRG1 pathogenic variants."
    explanation: >-
      The recurrence risk that follows from recessive inheritance, from the
      GeneReviews chapter for this gene.
  - reference: PMID:40875877
    reference_title: "TCIRG1-Related Osteopetrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous TCIRG1 pathogenic variants have been identified in affected individuals in one family with autosomal dominant osteopetrosis and one additional individual with a heterozygous de novo pathogenic variant."
    explanation: >-
      The caveat to the recessive model, recorded because this entry turns on gene
      and inheritance identity. It does not overturn autosomal recessive as the
      typical mode, but a strictly biallelic reading would be wrong.
classifications:
  isds_skeletal_category:
  - classification_value: osteopetrosis_and_related
    notes: >-
      ISDS Nosology and Classification of Genetic Skeletal Disorders, 2019
      revision (Mortier et al., PMID:31633310), Table 1 group 23 "Osteopetrosis
      and related disorders". The previous wording of this note named the
      TNFSF11 locus, which belongs to autosomal recessive osteopetrosis 2 and
      was carried over from this entry's earlier, incorrect MONDO binding.
prevalence:
- population: Global live births
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.4
  percentage: 1 in 250,000
  notes: >-
    Autosomal recessive osteopetrosis is estimated to occur in about 1 in
    250,000 births overall. Because biallelic TCIRG1 variants account for more
    than half of autosomal recessive osteopetrosis cases, autosomal recessive
    osteopetrosis 1 is the most common molecular subtype within this incidence
    estimate. The rate recorded here is the all-genotype figure, not a
    TCIRG1-specific one; no separate incidence estimate for the TCIRG1 form has
    been published.
  evidence:
  - reference: PMID:19232111
    reference_title: "Osteopetrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "autosomal recessive osteopetrosis (ARO) has an incidence of 1 in 250,000 births"
    explanation: >-
      This review gives the standard incidence estimate for autosomal recessive
      osteopetrosis.
  - reference: PMID:22231430
    reference_title: "Autosomal recessive osteopetrosis: report of 41 novel mutations in the TCIRG1 gene and diagnostic implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic mutations in the TCIRG1 gene, encoding for the a3 subunit of this pump, are responsible for more than one half of ARO patients."
    explanation: >-
      This study shows that TCIRG1-related disease represents the majority of
      autosomal recessive osteopetrosis cases, which is what lets the
      all-genotype incidence be carried over to this gene-specific entry as an
      upper bound.
pathophysiology:
- name: Vacuolar Proton Pump Deficiency in Osteoclasts
  biological_scale: CELLULAR
  description: >
    TCIRG1 encodes the a3 subunit of the vacuolar H+-ATPase (V-ATPase),
    which is specifically expressed in osteoclasts and essential for proton
    secretion into the resorption lacuna. Loss-of-function mutations abolish
    osteoclast acidification capacity, preventing dissolution of hydroxyapatite
    mineral in bone matrix. Osteoclasts differentiate normally and are present
    in normal or elevated numbers but cannot resorb bone.
  biological_processes:
  - preferred_term: Bone Resorption
    term:
      id: GO:0045453
      label: bone resorption
  cell_types:
  - preferred_term: Osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  evidence:
  - reference: PMID:10888887
    reference_title: "Defects in TCIRG1 subunit of the vacuolar proton pump are responsible for a subset of human autosomal recessive osteopetrosis."
    supports: SUPPORT
    snippet: "TCIRG1, encoding the osteoclast-specific 116-kD subunit of the vacuolar proton pump, is mutated in five of nine patients"
    explanation: "Identifies TCIRG1 and the vacuolar proton pump as the pathogenic target."
  - reference: PMID:10888887
    reference_title: "Defects in TCIRG1 subunit of the vacuolar proton pump are responsible for a subset of human autosomal recessive osteopetrosis."
    supports: SUPPORT
    snippet: "Osteoclasts are present in normal or elevated numbers in individuals affected by autosomal recessive osteopetrosis, suggesting that the defect is not in osteoclast differentiation, but in a gene involved in the functional capacity of mature osteoclasts"
    explanation: "Establishes that osteoclasts differentiate normally but are non-functional."
  - reference: PMID:10581033
    reference_title: "Atp6i-deficient mice exhibit severe osteopetrosis due to loss of osteoclast-mediated extracellular acidification."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Atp6i-/- osteoclast-like cells (OCLs) lose the function of extracellular acidification, but retain intracellular lysosomal proton pump activity"
    explanation: >-
      Establishes that the lesion is confined to extracellular acidification at the
      osteoclast-bone interface and spares lysosomal proton pumping, which is why
      the phenotype is skeletal rather than a generalised lysosomal disorder.
  - reference: PMID:35981697
    reference_title: "Osteoclast rich osteopetrosis due to defects in the TCIRG1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TCIRG1 defects lead to inefficient bone resorption by nonfunctional osteoclasts seen in abundance on bone marrow biopsy, delineating this ARO as 'osteoclast-rich'"
    explanation: >-
      Links the molecular lesion to the osteoclast-rich marrow histology that
      distinguishes this form from the osteoclast-poor RANK/RANKL forms.
  downstream:
  - target: Progressive Skeletal Sclerosis
    description: >-
      Loss of osteoclast proton-pump function prevents normal bone resorption
      and drives skeletal sclerosis.
  - target: Failure of Skeletal Calcium Mobilization
    causal_link_type: DIRECT
    description: >-
      The same failure to dissolve bone mineral means skeletal calcium cannot be
      released into the circulation.
- name: Progressive Skeletal Sclerosis
  biological_scale: TISSUE
  description: >
    Failure of osteoclast-mediated bone resorption leads to progressive
    accumulation of unremodeled bone, obliterating the medullary cavity
    and narrowing cranial nerve foramina.
  biological_processes:
  - preferred_term: Bone Remodeling
    term:
      id: GO:0046849
      label: bone remodeling
  evidence:
  - reference: PMID:10888887
    reference_title: "Defects in TCIRG1 subunit of the vacuolar proton pump are responsible for a subset of human autosomal recessive osteopetrosis."
    supports: SUPPORT
    snippet: "mutations in TCIRG1 are a frequent cause of autosomal recessive osteopetrosis in humans"
    explanation: "TCIRG1 deficiency causes progressive skeletal sclerosis from failed bone resorption."
  downstream:
  - target: Bone Marrow Failure from Medullary Obliteration
    description: >-
      Progressive accumulation of unresorbed bone obliterates marrow space.
  - target: Cranial Nerve Compression from Skull Thickening
    description: >-
      Progressive skull sclerosis narrows cranial nerve foramina.
  - target: Increased bone mineral density
    causal_link_type: DIRECT
  - target: Osteopetrosis
    causal_link_type: DIRECT
  - target: Recurrent fractures
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Bone pain
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Craniosynostosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Bone Marrow Failure from Medullary Obliteration
  biological_scale: ORGANISM
  description: >
    Progressive accumulation of unremodeled bone obliterates the medullary
    cavity, causing loss of hematopoietic marrow space with resultant
    pancytopenia. Compensatory extramedullary hematopoiesis in liver and
    spleen causes hepatosplenomegaly.
  biological_processes:
  - preferred_term: Hematopoiesis
    term:
      id: GO:0030097
      label: hemopoiesis
  evidence:
  - reference: PMID:10888887
    reference_title: "Defects in TCIRG1 subunit of the vacuolar proton pump are responsible for a subset of human autosomal recessive osteopetrosis."
    supports: SUPPORT
    snippet: "Infantile malignant autosomal recessive osteopetrosis (MIM 259700) is a severe bone disease with a fatal outcome, generally within the first decade of life"
    explanation: "The fatal outcome is primarily due to bone marrow failure from medullary obliteration."
  downstream:
  - target: Anemia
    causal_link_type: DIRECT
  - target: Thrombocytopenia
    causal_link_type: DIRECT
  - target: Recurrent infections
    causal_link_type: DIRECT
  - target: Recurrent respiratory infections
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Hepatosplenomegaly
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Pallor
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Failure to thrive
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Growth delay
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Cranial Nerve Compression from Skull Thickening
  biological_scale: TISSUE
  description: >
    Progressive skull thickening narrows cranial nerve foramina, causing
    optic nerve compression (blindness), facial nerve palsy, and
    sensorineural hearing loss.
  locations:
  - preferred_term: Cranium
    term:
      id: UBERON:0003128
      label: cranium
  downstream:
  - target: Optic nerve compression
    causal_link_type: DIRECT
  - target: Visual impairment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Hearing impairment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Hydrocephalus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Macrocephaly
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Neurodevelopmental delay
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Seizure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Failure of Skeletal Calcium Mobilization
  biological_scale: ORGANISM
  notes: >-
    This node reaches the same endpoint as
    defective_skeletal_mineralization#Impaired Hydroxyapatite Deposition at the
    Mineralization Front, but conforms_to is deliberately not declared. That
    module enumerates three routes to the endpoint, and its calciopenic node is
    scoped to reduced intestinal calcium absorption from insufficient calcitriol
    signalling or dietary calcium. Neither applies here: absorption and vitamin D
    signalling are intact, and the deficit is that the skeleton itself is
    unavailable as a calcium reservoir because osteoclasts cannot dissolve
    mineral. That is a fourth route the module does not cover, so declaring
    conformance would assert a mechanism this disease does not have. Worth raising
    with the module rather than papering over here.
  description: >
    Because osteoclasts cannot dissolve hydroxyapatite, the skeleton is
    unavailable as a calcium reservoir. Serum calcium falls, parathyroid hormone
    rises in compensation, and mineralization of newly laid osteoid fails.
    The result is rickets superimposed on a densely sclerotic skeleton, a
    combination easy to miss radiographically because the diffuse increase in
    bone density masks the impaired mineralization.

  evidence:
  - reference: PMID:42661684
    reference_title: "Osteopetrorickets and calcium homeostasis in children with osteopetrosis: an endocrinological single-center study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "secondary hyperparathyroidism from hypocalcemia, resulting in a paradoxical condition known as \u201costeopetrosis-rickets\u201d"
    explanation: >-
      States the causal sequence this node models: hypocalcaemia drives secondary
      hyperparathyroidism and the paradoxical coexistence of rickets with sclerosis.
  - reference: PMID:42661684
    reference_title: "Osteopetrorickets and calcium homeostasis in children with osteopetrosis: an endocrinological single-center study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Osteopetrorickets is clinically important because it may be overlooked in the presence of diffusely increased bone density, although impaired mineralization may coexist with osteosclerosis."
    explanation: >-
      Supports the statement that the sclerosis masks the mineralization defect,
      which is the diagnostic consequence of this node.
  downstream:
  - target: Hypocalcemia
    causal_link_type: DIRECT
  - target: Secondary hyperparathyroidism
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Rickets
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Seizure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
phenotypes:
- name: Increased bone mineral density

name: AFG2A-Related Encephalopathy
creation_date: '2026-08-01T00:00:00Z'
category: Mendelian
synonyms:
- AFG2A-RE
- SPATA5-related encephalopathy
- SPATA5 syndrome
- EHLMRS
- epilepsy, hearing loss, and mental retardation syndrome
- neurodevelopmental disorder with hearing loss, seizures, and brain abnormalities
- NEDHSB
- microcephaly-intellectual disability-sensorineural hearing loss-epilepsy-abnormal
  muscle tone syndrome
description: >-
  AFG2A-related encephalopathy is an ultra-rare autosomal recessive
  neurodevelopmental disorder caused by biallelic variants in AFG2A, the gene
  formerly and still most widely known as SPATA5. Its cardinal triad is
  congenital microcephaly, sensorineural hearing loss and epilepsy, on a
  background of severe to profound intellectual disability with absent speech,
  motor impairment that combines axial hypotonia with peripheral spasticity,
  cortical visual impairment and gastrointestinal dysfunction. When epilepsy is
  present, infantile epileptic spasms syndrome is the most frequently reported
  onset syndrome among individuals with detailed epilepsy data, and drug
  resistance occurs in most individuals with treatment data. The disorder can
  therefore present as a developmental and epileptic encephalopathy. AFG2A encodes an
  AAA+ ATPase that, together with AFG2B (SPATA5L1), C1orf109 and CINP, forms the
  55LCC complex; the complex drives the last cytoplasmic maturation step of the
  pre-60S ribosomal subunit and also governs replisome proteostasis. Loss of
  AFG2A function in neurons produces a mitochondrial fusion-fission imbalance,
  reduced ATP production and short axons, which is why the clinical picture is
  repeatedly mistaken for a primary mitochondrial disease.
disease_term:
  preferred_term: AFG2A-related encephalopathy
  term:
    id: MONDO:0014698
    label: microcephaly-intellectual disability-sensorineural hearing loss-epilepsy-abnormal
      muscle tone syndrome
parents:
- Developmental and epileptic encephalopathy
- Mendelian neurodevelopmental disorder
- Ribosome biogenesis disorder
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:26299366
      reference_title: Mutations in SPATA5 Are Associated with Microcephaly, Intellectual
        Disability, Seizures, and Hearing Loss.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Using whole-exome sequencing, we have identified in ten families 14
        individuals with microcephaly, developmental delay, intellectual disability,
        hypotonia, spasticity, seizures, sensorineural hearing loss, cortical visual
        impairment, and rare autosomal-recessive predicted pathogenic variants in
        spermatogenesis-associated protein 5 (SPATA5).
      explanation: >-
        A monogenic autosomal recessive disorder defined and diagnosed by exome
        sequencing belongs to the genetics chapter.
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:41933351
      reference_title: AFG2A-related encephalopathy, expanding the neurodevelopmental
        and epileptic spectrum.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "AFG2A-RE is an ultra-rare, recessive disorder, sometimes presenting\
        \ as a developmental and epileptic encephalopathy (DEE), characterised by\
        \ the triad of epilepsy, congenital microcephaly, and deafness, and typically\
        \ associated with intellectual disability, spasticity, and movement disorders."
      explanation: >-
        The presentation is dominated by epilepsy, intellectual disability,
        microcephaly and motor signs, which places the entity in the neurology
        chapter.
  - classification_value: DISORDER_OF_EAR
    evidence:
    - reference: PMID:28293831
      reference_title: Isolated Hearing Impairment Caused by SPATA5 Mutations in a
        Family with Variable Phenotypic Expression.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Our findings extend the phenotypic spectrum of SPATA5-associated diseases
        and indicate that SPATA5 defects may account for a fraction of isolated sensorineural
        hearing impairment cases.
      explanation: >-
        A confirmed biallelic AFG2A genotype can present as isolated
        sensorineural hearing impairment, supporting inclusion in the disorders
        of the ear chapter.
notes: >-
  Scope, naming and provenance notes for this entry.


  (1) GENE SYMBOL HISTORY - READ THIS FIRST. The causative gene is AFG2A
  (HGNC:18119). It was renamed from SPATA5 (spermatogenesis associated 5); older
  aliases in the literature include SPAF (spermatogenesis-associated factor) and
  AFG2. Essentially all clinical literature published between 2015 and 2024 uses
  SPATA5, and only papers from 2025 onward (PMID:41933351, PMID:40712368) use
  AFG2A. A PubMed title search on 2026-08-01 returned 12 records for SPATA5[TI]
  and 3 for AFG2A[TI], with no overlap, so searching either symbol alone misses
  most of the disease literature. The rename is also incompletely propagated
  through the ontology stack this repository uses: MONDO's
  `RO:0004003` axiom on MONDO:0014698 already reads `HGNC:18119 ! AFG2A`, but the
  HGNC adapter shipped with `sqlite:obo:hgnc` still returns `hgnc:18119 ! SPATA5`
  with `AFG2` and `SPAF` as exact synonyms. The `gene_term` bindings in this
  entry therefore carry the label `SPATA5`, because that is the label the term
  validator resolves; this is a lag in the cached HGNC build, not a curation
  error, and it must not be "fixed" to `AFG2A` until the adapter is refreshed.


  (2) NAMED-ENTITY CONFUSION WITH AFG2B / SPATA5L1. AFG2B (HGNC:28762, formerly
  SPATA5L1) is a DIFFERENT gene one suffix away from the old symbol of this one.
  Its biallelic variants cause a separate, clinically overlapping disorder
  (MONDO:0859206, neurodevelopmental disorder with hearing loss and spasticity;
  PMID:34626583). The two proteins are obligate partners inside the same 55LCC
  ATPase complex (PMID:38554706, PMID:40268917), so mechanism papers legitimately
  name both, and review articles discuss the two diseases side by side
  (PMID:41933351). Every clinical citation in this entry was checked for which
  gene the reported cohort actually carries variants in: PMID:26299366,
  PMID:27246907, PMID:27683084, PMID:28293831, PMID:29343804, PMID:30552426,
  PMID:33063670, PMID:34360601, PMID:36849973, PMID:40712368 and PMID:41933351 are
  all AFG2A/SPATA5 cohorts. PMID:34626583 is an AFG2B/SPATA5L1 cohort and is cited
  ONLY inside `differential_diagnoses`, never as support for a phenotype of this
  entry. The two structural/biochemical papers that study the complex as a whole
  (PMID:38554706, PMID:40268917) are cited for complex composition and function,
  not for any gene-specific clinical claim.


  (3) DISEASE NAME. The file is named for the clinically preferred current term.
  Three papers title the disorder "AFG2A-related encephalopathy" (PMID:41933351,
  PMID:40712368, PMID:40846618) and one titles it "SPATA5-related encephalopathy"
  (PMID:27246907); none uses "AFG2A-related neurodevelopmental disorder". The
  MONDO canonical label, the OMIM label (NEDHSB) and the older acronym EHLMRS are
  all recorded as synonyms.


  (4) NO GENEREVIEWS CHAPTER EXISTS. PubMed searches run on 2026-08-01 for
  "SPATA5[All Fields] AND GeneReviews[All Fields]", "AFG2A[All Fields] AND
  GeneReviews[All Fields]" and "AFG2A-related encephalopathy GeneReviews" each
  returned zero records; the single GeneReviews PMID surfaced by a broader
  phenotype-phrase search (PMID:20301382) is the chapter on Single Large-Scale
  Mitochondrial DNA Deletion Syndromes and is unrelated. The mandatory
  GeneReviews baseline therefore does not apply. The phenotype baseline used
  instead is the 2026 systematic review of 51 individuals (PMID:41933351), which
  is the largest published cohort, cross-checked against the earlier
  30-patient summary in PMID:29343804.


  (5) FREQUENCY DERIVATIONS. Bands come from published denominators, not from
  narrative language. PMID:41933351 pooled 51 individuals (45 from the literature
  plus 6 new) and reported per-feature percentages against feature-specific
  denominators: intellectual disability 97.92%, hearing loss 93.62%, microcephaly
  85.71% and absence of speech in all individuals with intellectual disability
  map to VERY_FREQUENT (80-100%); visual impairment 79.49%, epilepsy 38/51
  (74.5%), gastrointestinal symptoms 78.95%, hypotonia 71.74%, abnormal brain MRI
  68.29%, spasticity 60.87%, hypomyelination 39.02% and brain atrophy 34.15% map
  to FREQUENT (30-79%); thin corpus callosum 29.27% and dystonia 21.74% map to
  OCCASIONAL (5-29%). Three bands are deliberately OMITTED rather than guessed.
  Infantile epileptic spasms syndrome was reported in 16 of the 24 individuals
  with detailed epilepsy data (66.67%) but that is 16/51 (31%) of the whole
  cohort, so the band depends entirely on which denominator is chosen. Drug
  resistance was 82.35% of the 17 individuals with anti-seizure medication data,
  a denominator of seventeen that is both small and conditioned on having
  epilepsy. Mild lactate elevation was reported in two individuals described as
  being "in our cohort", which the review's discussion identifies as two of the
  authors' own five ketogenic-diet patients rather than two of the 51, so the
  denominator is genuinely unknown. All three raw numbers are recorded in the
  relevant `notes:` instead of being converted into bands. One band, inability
  to walk, is retained despite a subgroup denominator: the GMFCS percentages
  resolve exactly to n=22 rather than to the pooled 51, giving VERY_FREQUENT on
  the graded subgroup (19/22, 86.36%) and FREQUENT on the pooled cohort (19/51,
  37%). Both readings and the reason for preferring the former are recorded in
  that phenotype's `notes:`.


  (6) MITOCHONDRIAL LOCALISATION IS DISPUTED AND IS CURATED AS SUCH. The original
  1990s characterisation of SPAF/SPATA5 assigned it a mitochondrial
  matrix-targeting sequence and a role in mitochondrial morphogenesis during
  spermatogenesis, and PMID:26299366 repeats this. PMID:29343804 then showed
  directly that overexpressed SPATA5 is dominantly cytosolic in cortical neurons,
  SH-SY5Y, HeLa and COS7 cells and does not co-localise with a mitochondrial
  marker, while nevertheless demonstrating a real mitochondrial fusion-fission
  imbalance and ATP deficit on knockdown. The current mechanistic consensus
  (PMID:35354024, PMID:40268917) places AFG2A in cytoplasmic pre-60S ribosome
  maturation. The pathophysiology DAG in this entry therefore models the
  mitochondrial phenotype as a downstream consequence of AFG2A loss rather than
  as a direct mitochondrial-protein defect, and the mitochondrial node carries
  `mechanism_confidence: PROVISIONAL`. Calling this disorder a mitochondrial
  disease would be wrong; it merely mimics one.


  (7) STRUCTURED SOURCES SKIPPED, AND THE ABSENCE WAS CHECKED RATHER THAN ASSUMED.
  No Orphanet (ORPHA:457351), ClinGen gene-disease validity (CGGV) or ClinGen
  dosage (CGDS) record is cited. The cache does contain 327 ORPHA_* files, 478
  CGGV_* files and several CGDS_* files, so their absence here is specific, not
  general: `ls references_cache/ORPHA_457351.md` returns no such file, and
  `grep -l -i -e SPATA5 -e AFG2A CGGV_*.md CGDS_*.md` returns nothing. Generating
  the missing records would require bumping a structured-source
  `data/*/MANIFEST.yaml` pin; those pins are stale and un-refreshable (tracked in
  #7622) and the curation PR scope check forbids touching them, so the citation is
  skipped rather than fabricated. Note that the deep-research run reports a
  ClinGen Definitive AR classification for AFG2A evaluated 2024-07-23; that is
  almost certainly citable once the CGGV pin is refreshed.


  (7a) THE 2026 REVIEW IS ALREADY OUT OF DATE ON ONE POINT, AND THE ENTRY SAYS SO.
  PMID:41933351 states that no neurological disorders have been linked to the
  other components of the 55LCC complex, C1orf109 and CINP. PMID:40760247,
  published in Nature Cell Biology five months earlier, reports biallelic
  AIRIM/C1orf109 variants in eleven unrelated families with a closely overlapping
  neurodevelopmental phenotype and states that variants in AFG2A, AFG2B and CINP
  are associated with a range of neurodevelopmental disorders. The superseded
  sentence is retained in the entry as a REFUTE evidence item on the
  AIRIM/C1orf109 differential so that the contradiction is visible rather than
  silently resolved.


  (7b) TABLE 1 OF THE 2026 REVIEW WAS NOT TRANSCRIBED. The deep-research report
  identified three internal discrepancies between Table 1 of PMID:41933351 and the
  primary sources, the most consequential being a genotype inversion for the two
  Buchert 2016 families, which flips which allele is associated with absence of
  epilepsy. Every variant curated in the `variants:` block of this entry is
  therefore cited to the primary report (PMID:27246907, PMID:27683084,
  PMID:28293831, PMID:30552426) and not to the review table. No
  genotype-phenotype correlation is asserted anywhere in this entry; the review's
  own conclusion is that none was found.


  (8) DIFFERENTIAL DIAGNOSIS BINDINGS. Two of the four differentials carry a
  MONDO term. AFG2B-related disorder is bound to MONDO:0859206
  (`neurodevelopmental disorder with hearing loss and spasticity`), verified
  non-obsolete and confirmed by `runoak ancestors` NOT to be an ancestor of this
  entry's own anchor MONDO:0014698. The mitochondrial-disease mimic is bound to
  MONDO:0044970 (`mitochondrial disease`), also verified non-obsolete and not an
  ancestor of the anchor; note that the nearby label `mitochondrial disease`
  MONDO:0019055 IS obsolete and must not be used. The third differential,
  autosomal recessive nonsyndromic sensorineural hearing loss, is left UNBOUND:
  MONDO models that group only as numbered locus-specific entities (DFNB1A,
  DFNB2, DFNB3 ...), and picking any one of them would assert a locus that
  PMID:28293831 never implicates. No honest grouping term for it exists in the
  constrained ontology set, so the slot is left empty deliberately. The fourth,
  AIRIM/C1orf109-related neurodevelopmental disorder, is also UNBOUND because
  `runoak -i sqlite:obo:mondo search` returns no term for either "AIRIM" or
  "C1orf109"; the disorder was described in 2025 and MONDO has not yet minted an
  entity for it. Its gene resolves (hgnc:26039 ! C1orf109) but a gene identifier
  is not a disease term.


  (9) WHAT IS KNOWINGLY ABSENT. No treatment in this entry is disease-modifying;
  the ketogenic-diet evidence rests on four treated patients (PMID:40712368) and
  is curated as PARTIAL. No animal model of AFG2A deficiency is curated because
  the only in vivo work located is rat primary cortical neuron knockdown
  (PMID:29343804), which is a cell model rather than an organism model; the IMPC
  mouse-null result surfaced by the deep-research run has no PMID and is therefore
  recorded in a `discussions` entry rather than as evidence. Elevated blood copper
  was reported by PMID:27246907 in three children but has never been replicated
  and is recorded only in the diagnosis notes, not as a biochemical finding. No
  ClinGen gene-disease validity citation appears even though the deep-research run
  reports a Definitive AFG2A classification, for the structured-source reason in
  note (7). No survival, life-expectancy or quality-of-life claim is made; see the
  `afg2a_natural_history_gap` discussion. The mTOR rescue axis is curated as a
  pathophysiology observation only and NOT as a treatment, because it has been
  demonstrated in AIRIM/C1orf109 organoids and never in an AFG2A model.
inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic (homozygous or, more often, compound heterozygous) AFG2A variants
    are required. Heterozygous carriers, including the parents of affected
    children, are unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:27683084
    reference_title: SPATA5 mutations cause a distinct autosomal recessive phenotype
      of intellectual disability, hypotonia and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We thus independently confirm that bi-allelic pathogenic variants in
      SPATA5 cause a syndromic form of intellectual disability, and we delineate
      its clinical presentation.
    explanation: >-
      Independent confirmation, in a consanguineous family plus an unrelated
      compound heterozygous case, that the disorder is recessive.
  - reference: PMID:41933351
    reference_title: AFG2A-related encephalopathy, expanding the neurodevelopmental
      and epileptic spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AFG2A-RE is an ultra-rare, recessive disorder, sometimes presenting\
      \ as a developmental and epileptic encephalopathy (DEE), characterised by the\
      \ triad of epilepsy, congenital microcephaly, and deafness, and typically associated\
      \ with intellectual disability, spasticity, and movement disorders."
    explanation: The largest published cohort restates recessive inheritance.
prevalence:
- population: Global
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fifty-one individuals had been reported in total as of the 2026 systematic
    review (45 from the published literature plus 6 newly recruited). Earlier
    tallies were 30 patients in 2018 (PMID:29343804) and 37 as of 2019
    (PMID:33063670). No population prevalence estimate has been published, so the
    qualitative ULTRA_RARE tier is used with the case count recorded here rather
    than converting a case series into a rate.
  evidence:
  - reference: PMID:41933351
    reference_title: AFG2A-related encephalopathy, expanding the neurodevelopmental
      and epileptic spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A total of 51 individuals with AFG2A-RE were included, 29 males; mean
      age 8.35 years.
    explanation: >-
      The largest pooled cohort assembled to date numbers 51 individuals
      worldwide, which places the disorder in the ultra-rare tier.
progression:
- age_range: Birth to 2 years
  notes: >-
    Onset is in early infancy. Microcephaly is usually congenital, hearing loss
    and global developmental delay are apparent from the first months, and
    epileptic spasms typically emerge between 6 and 27 months.
  evidence:
  - reference: PMID:27246907
    reference_title: Characterization of SPATA5-related encephalopathy in early childhood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The three patients manifested microcephaly, psychomotor retardation,
      hypotonus or hypertonus, and bilateral hearing loss from early infancy.
    explanation: Documents onset of the cardinal features in early infancy.
  - reference: PMID:29343804
    reference_title: Compound heterozygous SPATA5 variants in four families and functional
      studies of SPATA5 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Symptoms start in early infancy with all of the patients developing global
      developmental delay with severely limited speech or no words, hearing impairment
      (most frequently sensorineural hearing loss, 77%), and a pathological EEG with
      symptomatic epilepsy being present in 73% of patients.
    explanation: Confirms early-infantile onset across the pooled 30-patient series.
- age_range: Childhood onwards
  notes: >-
    Long-term clinical trajectories have not been defined prospectively. Serial
    imaging in some children shows progressive cerebral atrophy. In the pooled
    retrospective literature, three of 51 individuals had died, at ages 3, 4.9
    and 13.4 years; two causes were unreported and one was respiratory failure,
    so these observations do not establish a survival estimate.
  evidence:
  - reference: PMID:27246907
    reference_title: Characterization of SPATA5-related encephalopathy in early childhood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Magnetic resonance imaging revealed hypomyelination, thin corpus callosum,
      and progressive cerebral atrophy.
    explanation: >-
      Documents that the cerebral atrophy component of the imaging phenotype is
      progressive rather than static.
  - reference: PMID:41933351
    reference_title: AFG2A-related encephalopathy, expanding the neurodevelopmental
      and epileptic spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All the individuals reported were alive, except for three (4.89%) who
      died at the ages of 3, 4.9 and 13.4 years
    explanation: >-
      Documents the three reported deaths without treating the retrospective
      proportion as a survival estimate.
pathophysiology:
- name: Biallelic AFG2A Loss of Function
  description: >-
    Biallelic pathogenic variants in AFG2A (formerly SPATA5) reduce the amount or
    the activity of an 892-amino-acid AAA+ ATPase. Most reported alleles are
    missense or small in-frame changes rather than complete nulls, and no
    individual carrying two unequivocal null alleles has been reported, which is
    consistent with hypomorphic rather than complete loss of function being
    compatible with life. The protein carries two conserved ATPase modules.
  role: root
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  gene:
    preferred_term: AFG2A
    term:
      id: hgnc:18119
      label: SPATA5
  cellular_components:
  - preferred_term: Cytosol
    term:
      id: GO:0005829
      label: cytosol
  downstream:
  - target: 55LCC ATPase Complex Dysfunction
    causal_link_type: DIRECT
    description: >-
      AFG2A is the catalytic core of the 55LCC complex, so reduced AFG2A ATPase
      activity is directly a deficiency of the complex.
  - target: Neuronal Mitochondrial Fusion-Fission Imbalance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Knockdown of the gene in rat cortical neurons shifts the mitochondrial
      fusion-fission balance, but the molecular steps between the ATPase defect
      and the mitochondrial phenotype have not been identified.
  - target: Skeletal Muscle Mitochondrial Pathology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Muscle biopsy in a genotyped patient shows a mitochondrial histochemical
      pattern and a dysregulated mitochondrial proteome.
  evidence:
  - reference: PMID:26299366
    reference_title: Mutations in SPATA5 Are Associated with Microcephaly, Intellectual
      Disability, Seizures, and Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: SPATA5 encodes a ubiquitously expressed member of the ATPase associated
      with diverse activities (AAA) protein family and is involved in mitochondrial
      morphogenesis during early spermatogenesis.
    explanation: Establishes the gene product as a ubiquitously expressed AAA ATPase.
  - reference: PMID:41933351
    reference_title: AFG2A-related encephalopathy, expanding the neurodevelopmental
      and epileptic spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Most of the variants were missense (58.82%), with others being frameshift
      (14.71%), nonsense (9.8%), deletion (6.68%), splice site/splice donor (6.68%),
      non-frameshift (1.96%) and start loss (0.98%).
    explanation: >-
      Shows that the majority of disease alleles are missense, supporting a
      hypomorphic rather than a complete-null mechanism.
- name: 55LCC ATPase Complex Dysfunction
  description: >-
    AFG2A does not act alone. It assembles with its paralogue AFG2B (SPATA5L1)
    and the heterodimeric partners C1orf109 and CINP into a 4:2:2:2 assembly
    named 55LCC, built from an N-terminal ring of C1orf109, CINP and the
    N-terminal domains of AFG2A and AFG2B sitting above two hexameric AAA+ ATPase
    rings. Reduced AFG2A activity therefore compromises a shared machine rather
    than a single enzyme, which is the structural reason AFG2A and AFG2B disease
    phenotypes overlap.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  protein_complexes:
  - preferred_term: 55LCC complex
  downstream:
  - target: Impaired Cytoplasmic Pre-60S Ribosomal Maturation
    causal_link_type: DIRECT
    description: >-
      The complex performs the terminal cytoplasmic maturation step on the
      pre-60S particle.
  - target: Replisome Proteostasis Failure
    causal_link_type: DIRECT
    description: >-
      The same complex extracts and licenses degradation of replisome components
      at damaged replication forks.
  evidence:
  - reference: PMID:40268917
    reference_title: Cryo-EM structure of the AAA+ SPATA5 complex and its role in
      human cytoplasmic pre-60S maturation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here we reveal that SPATA5 forms a 4:2:2:2 complex with SPATA5L1, C1orf109,
      and CINP.
    explanation: Defines the stoichiometry and composition of the complex by cryo-EM.
  - reference: PMID:38554706
    reference_title: The SPATA5-SPATA5L1 ATPase complex directs replisome proteostasis
      to ensure genome integrity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we identify replisome factor interactions with a protein complex\
      \ composed of AAA+ ATPases SPATA5-SPATA5L1 together with heterodimeric partners\
      \ C1orf109-CINP (55LCC)."
    explanation: Names the complex and its four components.
- name: Impaired Cytoplasmic Pre-60S Ribosomal Maturation
  description: >-
    In yeast the AFG2A orthologue Drg1 strips the assembly factor Rlp24, a
    placeholder for the ribosomal protein Rpl24, off pre-60S particles as soon as
    they reach the cytoplasm; the human equivalent step is performed by AFG2A
    within the 55LCC complex, with recognition of the pre-60S particle mediated
    by the human-specific subunit CINP. When AFG2A activity falls, large
    ribosomal subunits stall at this last maturation checkpoint.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: Ribosomal large subunit biogenesis
    term:
      id: GO:0042273
      label: ribosomal large subunit biogenesis
  - preferred_term: Ribosome assembly
    term:
      id: GO:0042255
      label: ribosome assembly
  cellular_components:
  - preferred_term: Preribosome, large subunit precursor
    term:
      id: GO:0030687
      label: preribosome, large subunit precursor
  downstream:
  - target: Reduced Global Protein Synthesis
    causal_link_type: DIRECT
    description: >-
      Fewer mature 60S subunits reach the translating pool, so bulk translation
      capacity falls.
  evidence:
  - reference: PMID:40268917
    reference_title: Cryo-EM structure of the AAA+ SPATA5 complex and its role in
      human cytoplasmic pre-60S maturation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In yeast, AAA+ protein Drg1 releases an assembly factor Rlp24, a placeholder
      for Rpl24, from pre-60S particles just exported to cytosol.
    explanation: >-
      Defines the conserved reaction that the human AFG2A complex is the
      orthologue of.
  - reference: PMID:35354024
    reference_title: Labeling of heterochronic ribosomes reveals C1ORF109 and SPATA5
      control a late step in human ribosome assembly.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We provide evidence that these factors, together with CINP and SPATA5L1,
      control a late step of human pre-60S maturation in the cytoplasm.
    explanation: >-
      A genome-wide loss-of-function screen with differential ribosome labelling
      places SPATA5 at a late cytoplasmic pre-60S step in human cells.
  - reference: PMID:31703473
    reference_title: "Shaping the Nascent Ribosome: AAA-ATPases in Eukaryotic Ribosome\
      \ Biogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO

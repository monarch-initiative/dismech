- name: AFG2A
  gene_term:
    preferred_term: AFG2A
    term:
      id: hgnc:18119
      label: SPATA5
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Biallelic pathogenic or likely pathogenic variants
  notes: >-
    AFG2A is the current HGNC-approved symbol for the gene published throughout
    the clinical literature as SPATA5. The gene lies at 4q28.1 and encodes an
    892-amino-acid AAA+ ATPase with two conserved ATPase modules. Forty-two
    different disease-associated variants had been reported across the 51 pooled
    individuals; the majority are compound heterozygous rather than homozygous,
    and four recurrent alleles (c.2081G>A, c.989_991del, c.251G>A and
    c.1714+1G>A) account for 42% of individuals. See the entry-level notes for
    the full symbol history and the reason the term label reads SPATA5.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Using whole-exome sequencing, we have identified in ten families 14 individuals
      with microcephaly, developmental delay, intellectual disability, hypotonia,
      spasticity, seizures, sensorineural hearing loss, cortical visual impairment,
      and rare autosomal-recessive predicted pathogenic variants in spermatogenesis-associated

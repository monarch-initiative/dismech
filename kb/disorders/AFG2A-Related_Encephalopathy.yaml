    snippet: We find that ribosome levels decrease during neuroepithelial differentiation,
      making differentiating cells particularly vulnerable to perturbations in ribosome
      biogenesis during this time.
    explanation: >-
      Supplies the tissue-specificity mechanism, but in organoids carrying
      AIRIM/C1orf109 rather than AFG2A variants, so support is partial.
  - reference: PMID:40760247
    reference_title: A programmed decline in ribosome levels governs human early neurodevelopment.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Enhancing mTOR activity suppresses the growth and developmental defects
      associated with AIRIM/C1orf109 variants.
    explanation: >-
      Identifies mTOR enhancement as a candidate rescue axis for 55LCC-complex
      ribosome biogenesis defects; untested in AFG2A.
- name: Replisome Proteostasis Failure
  description: >-
    The 55LCC complex has a second, ribosome-independent job: its ATPase activity
    is stimulated by replication fork DNA and it couples cysteine
    protease-dependent cleavage of replisome substrates to replication fork
    damage. Losing that activity produces ubiquitin-independent proteotoxicity,
    replication stress and chromosome instability. Whether this branch
    contributes to the human neurodevelopmental phenotype is proposed by the
    authors but not established in patient material, so the node is provisional.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:

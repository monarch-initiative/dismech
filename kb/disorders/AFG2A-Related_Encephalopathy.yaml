    evidence_source: HUMAN_CLINICAL
    snippet: Symptoms start in early infancy with all of the patients developing global
      developmental delay with severely limited speech or no words, hearing impairment
      (most frequently sensorineural hearing loss, 77%), and a pathological EEG with
      symptomatic epilepsy being present in 73% of patients.
    explanation: >-
      All patients in the pooled 30-case series had severely limited speech or no
      words.
  - reference: PMID:41933351
    reference_title: AFG2A-related encephalopathy, expanding the neurodevelopmental
      and epileptic spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Absence of speech was reported in all individuals with ID.
    explanation: Confirms absent speech in the whole intellectually disabled subgroup.
- name: Sensorineural hearing impairment
  category: Auditory
  description: >-
    Bilateral sensorineural hearing loss, usually detectable from early infancy,
    is one of the three cardinal features. It is the single most consistent
    finding across families and, in at least one sibling, has been the ONLY
    manifestation of a confirmed biallelic genotype.
  frequency: VERY_FREQUENT
  diagnostic: true
  notes: >-
    93.62% in the 51-individual pooled cohort; 77% specifically
    sensorineural in the earlier 30-patient summary.
  phenotype_term:

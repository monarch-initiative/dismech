- name: Infantile spasms
  category: Neurologic
  description: >-
    When epilepsy occurs, it most often declares itself as an infantile epileptic
    spasms syndrome in the first two years of life, with a mean onset around 9 to
    14 months. Epileptic spasms or tonic seizures typically emerge between 6 and
    12 months in the smaller Japanese series. In the reported IESS series,
    neither corticosteroids nor vigabatrin achieved seizure control.
  notes: >-
    Frequency band deliberately omitted. Infantile epileptic spasms syndrome was
    reported in 16 of the 24 individuals with detailed epilepsy data (66.67%),
    which is 16 of the whole 51-individual cohort (31%). The band would be
    FREQUENT on one denominator and would sit at the top of FREQUENT on the
    other, so the raw fractions are recorded here instead of an asserted band.

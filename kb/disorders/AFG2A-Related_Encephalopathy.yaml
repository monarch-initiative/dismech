    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Deficiency in the 55LCC complex elicited ubiquitin-independent proteotoxicity,
      replication stress, and severe chromosome instability.
    explanation: >-
      Establishes the cellular consequence of losing complex activity at the
      replication fork.
  - reference: PMID:38554706
    reference_title: The SPATA5-SPATA5L1 ATPase complex directs replisome proteostasis

phenotypes:
- name: Intellectual disability
  category: Neurologic
  description: >-
    Intellectual disability is essentially universal and is severe to profound in
    three quarters of those with graded data. Absence of speech was reported in
    every individual with intellectual disability. The single individual without
    intellectual disability in the pooled cohort was a toddler too young to
    assess, who had delayed gross motor development.
  frequency: VERY_FREQUENT
  notes: >-
    97.92% in the 51-individual pooled cohort; severity was
    moderate-to-severe in 25% and severe-to-profound in 75% of the 32 cases with
    graded data.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:41933351
    reference_title: AFG2A-related encephalopathy, expanding the neurodevelopmental
      and epileptic spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The most frequently described clinical features included intellectual
      disability (97.92%), hearing loss (93.62%), microcephaly (85.71%), visual impairment
      (79.49%), hypotonia (71.74%), spasticity (60.87%), and movement disorders (36.96%).
    explanation: Gives the pooled frequency from the largest cohort.
  - reference: PMID:27683084
    reference_title: SPATA5 mutations cause a distinct autosomal recessive phenotype
      of intellectual disability, hypotonia and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We examined an extended, consanguineous family with seven individuals
      with severe intellectual disability and microcephaly.
    explanation: Independent family documenting severe intellectual disability.
- name: Absent speech
  category: Neurologic
  description: >-
    No affected individual with intellectual disability has developed speech.
    Earlier series described severely limited speech or no words in all patients.
  frequency: VERY_FREQUENT
  phenotype_term:

diagnosis:
- name: Exome or genome sequencing
  description: >-
    The diagnosis is molecular. Multiple reported cohorts were ascertained by
    whole-exome sequencing, often after a clinical suspicion of a mitochondrial
    disorder or of an unexplained developmental and epileptic encephalopathy.
    The symbol in older reports and some resources is SPATA5.
  evidence:
  - reference: PMID:29343804
    reference_title: Compound heterozygous SPATA5 variants in four families and functional
      studies of SPATA5 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This study describes five patients with psychomotor developmental delay,
      microcephaly, epilepsy and hearing impairment, who were thought clinically to
      have a mitochondrial disease with subsequent whole-exome sequencing analysis
      detecting compound heterozygous variants in the SPATA5 gene.
    explanation: >-
      Illustrates the usual diagnostic route: a suspected mitochondrial disorder
      resolved by exome sequencing.
  - reference: PMID:30552426
    reference_title: "The role of recessive inheritance in early-onset epileptic encephalopathies:\
      \ a combined whole-exome sequencing and copy number study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Notably, we found the recessive gene SPATA5 causative in as much as 3%
      of our cohort, indicating that it may have been underdiagnosed in previous
      studies.
    explanation: >-
      Reports a selected-cohort diagnostic yield, which belongs with molecular
      diagnosis rather than population prevalence.
  - reference: PMID:41933351
    reference_title: AFG2A-related encephalopathy, expanding the neurodevelopmental
      and epileptic spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The prevalence of AFG2A-RE has been estimated at around 3% of early-onset
      developmental and epileptic encephalopathies
    explanation: >-
      The systematic review carries forward the selected-cohort
      diagnostic-yield estimate; this is not a population prevalence claim.
  notes: >-
    Papuc and colleagues identified causative biallelic SPATA5 variants in 2 of
    63 research participants with early-onset epileptic encephalopathy and 1 of
    39 diagnostic cases (3 of 102 combined, reported as 3%). This is a diagnostic
    yield in a selected cohort, not a population prevalence estimate.

    Elevated or high-normal blood copper was reported in the three Japanese
    children (PMID:27246907) but has never been replicated in any later cohort,
    so it is recorded here as an unreplicated observation and not curated as a
    biochemical feature of the disease.
- name: Audiological assessment
  description: >-
    Because sensorineural hearing loss is near-universal and may be the earliest
    or, rarely, the only sign, formal audiological assessment is an important
    component of evaluation, and biallelic AFG2A variants should be considered
    in apparently isolated sensorineural hearing impairment.
  evidence:
  - reference: PMID:28293831
    reference_title: Isolated Hearing Impairment Caused by SPATA5 Mutations in a Family
      with Variable Phenotypic Expression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our findings extend the phenotypic spectrum of SPATA5-associated diseases
      and indicate that SPATA5 defects may account for a fraction of isolated sensorineural
      hearing impairment cases.
    explanation: Supports including the gene in the workup of isolated hearing loss.
treatments:
- name: Ketogenic diet
  description: >-
    The ketogenic diet is the only intervention with disease-specific evidence.
    In a series of five genotyped patients, four received the diet for
    drug-resistant epilepsy with seizure reduction rates of 0%, 30%, 70% and
    100%; the patient who became seizure free is maintained on ketogenic diet
    monotherapy. Non-seizure benefits (social interaction, attention, motor
    function) were reported in three. Fibroblasts from these patients cultured in
    a ketogenic-diet-mimicking medium showed reversal of the mitochondrial
    morphology, dynamics and ATP abnormalities, giving a plausible mechanistic
    rationale. The evidence is a small uncontrolled series and is recorded as
    partial.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Ketogenic diet
    term:
      id: NCIT:C173168
      label: Ketogenic Diet
  notes: >-
    Four treated patients is the entire published experience. The 2026 review
    adds that neither corticosteroids nor vigabatrin achieved seizure control in
    the reported IESS series, which is why the diet is being explored.
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  - preferred_term: Infantile spasms
    term:
      id: HP:0012469
      label: Infantile spasms
  target_mechanisms:
  - target: Neuronal Mitochondrial Fusion-Fission Imbalance
    treatment_effect: RESTORES
    description: >-
      Fibroblasts from these same genotyped patients, cultured in a
      ketogenic-diet-mimicking medium, recovered the altered mitochondrial
      morphology and dynamics and the reduced ATP production. The diet is
      therefore hypothesised to act on this node rather than on a conventional
      anti-seizure target; the link is between a clinical response and an ex vivo
      readout in the same patients, not a demonstrated in vivo mechanism.
    evidence:
    - reference: PMID:40712368
      reference_title: "AFG2A-related encephalopathy: Effectiveness of ketogenic diet\
        \ in epilepsy and mitochondrial dynamics modulation."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: These abnormalities were significantly reversed when the fibroblasts
        were cultured in KD-MM.
      explanation: >-
        Direct evidence that the ketogenic-diet condition reverses the
        mitochondrial abnormality modelled by this node, in cells from treated
        patients.
  evidence:
  - reference: PMID:40712368
    reference_title: "AFG2A-related encephalopathy: Effectiveness of ketogenic diet\
      \ in epilepsy and mitochondrial dynamics modulation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Four patients received KD treatment for DRE, with seizure reduction\
      \ rates of 0 %, 30 %, 70 % and 100 %, respectively."
    explanation: >-
      The primary clinical outcome data, from an uncontrolled series of four
      treated patients.
  - reference: PMID:40712368
    reference_title: "AFG2A-related encephalopathy: Effectiveness of ketogenic diet\
      \ in epilepsy and mitochondrial dynamics modulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These abnormalities were significantly reversed when the fibroblasts were
      cultured in KD-MM.
    explanation: >-
      Patient fibroblasts in a ketogenic-diet-mimicking medium recover their
      mitochondrial phenotype, supplying the mechanistic rationale.
  - reference: PMID:41933351
    reference_title: AFG2A-related encephalopathy, expanding the neurodevelopmental
      and epileptic spectrum.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: The KD showed... efficacy in selected cases, particularly when initiated
      early.
    explanation: >-
      The systematic review's assessment, which stops short of recommending the
      diet as standard care. The elided word is "partial", split across a line
      break by a hyphen in the cached PDF text.
  - reference: PMID:41933351
    reference_title: AFG2A-related encephalopathy, expanding the neurodevelopmental
      and epileptic spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fourth individual (Patient ID 41), with refractory IESS, became\
      \ seizure free with the ketogenic diet (KD) and is now on KD monotherapy."
    explanation: >-
      Documents the single individual in the pooled cohort who achieved seizure
      freedom on ketogenic diet monotherapy.
- name: Anti-seizure medication polytherapy
  description: >-
    Most individuals with epilepsy require more than one anti-seizure medication
    and remain refractory. No agent has shown disease-specific superiority; the
    reported regimens span valproate, levetiracetam, lamotrigine, vigabatrin,
    ACTH, topiramate, zonisamide, clobazam, phenobarbital, rufinamide,
    cannabidiol and others. Only four of sixteen individuals with follow-up data
    achieved seizure freedom. In the reported IESS series, corticosteroids and
    vigabatrin did not achieve seizure control.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:41933351
    reference_title: AFG2A-related encephalopathy, expanding the neurodevelopmental
      and epileptic spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Epilepsy was often drug-resistant (82.35%).
    explanation: Establishes that most treated epilepsy is drug resistant.
  - reference: PMID:41933351
    reference_title: AFG2A-related encephalopathy, expanding the neurodevelopmental
      and epileptic spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As we recently reported, individuals with IESS do not achieve seizure\
      \ control with usual first-line treatment (neither corticosteroids nor vigabatrin)."
    explanation: >-
      Specifically records the failure of corticosteroids and vigabatrin, which
      is directly actionable for clinicians.
- name: Early hearing habilitation
  description: >-
    Sensorineural deafness is congenital and detectable on newborn or neonatal
    brainstem audiometry, so amplification or implantation can be started in the
    first months. One genotyped child received a hearing device before the age of
    two months after postnatal brainstem audiometry showed sensorineural
    deafness. No systematic outcome data for cochlear implantation in this
    disorder exist, and profound intellectual disability with cerebral visual
    impairment complicates candidacy assessment, so this is curated as supportive
    habilitation rather than as an intervention with demonstrated efficacy in
    this genotype.
  action_category: THERAPEUTIC
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing habilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  notes: >-
    The treatment term is deliberately the generic Rehabilitation action.
    NCIT:C157820 `Cochlear Implant` exists but denotes the device, not a clinical
    action, and is not reachable from NCIT:C25218, so it fails the
    TreatmentActionTerm dynamic enum. No NCIT clinical-action term for cochlear
    implantation or hearing-aid fitting was found by `runoak` search, so the
    nearest honest action term is used and the specificity is carried by
    `preferred_term`.
  target_phenotypes:
  - preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:34360601
    reference_title: Muscular and Molecular Pathology Associated with SPATA5 Deficiency
      in a Child with EHLMRS.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Postnatal brainstem audiometry showed sensorineural deafness, for which
      she received a hearing device before the age of two months.
    explanation: >-
      Single genotyped patient documenting that hearing habilitation is feasible
      within the first two months of life; no outcome is reported, hence PARTIAL.
differential_diagnoses:
- name: AFG2B-related neurodevelopmental disorder
  description: >-
    Caused by biallelic variants in AFG2B, the gene formerly called SPATA5L1 and
    therefore one character away from this disorder's own former gene symbol. The
    two proteins are partners in the same 55LCC ATPase complex, so the disorders
    overlap for a real mechanistic reason and are routinely discussed together.
    The discriminators are quantitative and developmental rather than absolute:
    in AFG2B disease sensorineural hearing loss is present in all affected
    individuals but only about half have any neurodevelopmental involvement at
    all, the neurodevelopmental phenotype is described as non-progressive and
    mixed with spastic-dystonic cerebral palsy prominent, and microcephaly is not
    a defining feature. In AFG2A disease microcephaly is present in around 86%,
    intellectual disability in around 98%, and the epilepsy is typically an
    infantile epileptic spasms syndrome.
  distinguishing_features:
  - Caused by AFG2B (SPATA5L1, HGNC:28762), not AFG2A (SPATA5, HGNC:18119)
  - Sensorineural hearing loss is universal but the neurodevelopmental phenotype is
    present in only about half of affected individuals
  - Neurodevelopmental involvement is described as non-progressive and mixed, with
    spastic-dystonic cerebral palsy prominent
  - Congenital microcephaly is not a cardinal feature, whereas it is one of the AFG2A
    triad
  - Periventricular leukomalacia and reduced white matter volume are reported, rather
    than the hypomyelination plus progressive cerebral atrophy pattern of AFG2A disease
  disease_term:
    preferred_term: AFG2B-related neurodevelopmental disorder
    term:
      id: MONDO:0859206
      label: neurodevelopmental disorder with hearing loss and spasticity
  evidence:
  - reference: PMID:34626583
    reference_title: Bi-allelic variants in SPATA5L1 lead to intellectual disability,
      spastic-dystonic cerebral palsy, epilepsy, and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 28 bi-allelic variants in SPATA5L1 associated with sensorineural\
      \ hearing loss in 47 individuals from 28 (26 unrelated) families. In addition,\
      \ 25/47 affected individuals (53%) presented with microcephaly, developmental\
      \ delay/intellectual disability, cerebral palsy, and/or epilepsy."
    explanation: >-
      Establishes the AFG2B cohort and the key quantitative discriminator, that
      only 53% have neurodevelopmental involvement.
  - reference: PMID:34626583
    reference_title: Bi-allelic variants in SPATA5L1 lead to intellectual disability,
      spastic-dystonic cerebral palsy, epilepsy, and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Collectively, our results indicate that bi-allelic SPATA5L1 variants\
      \ lead to a human disease characterized by sensorineural hearing loss (SNHL)\
      \ with or without a nonprogressive mixed neurodevelopmental phenotype."
    explanation: >-
      The authors' own summary, which contrasts with the progressive cerebral
      atrophy described in AFG2A disease.
  - reference: PMID:41933351
    reference_title: AFG2A-related encephalopathy, expanding the neurodevelopmental
      and epileptic spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in AFG2B, previously named SPATA5L1, are associated\
      \ with a... disorders characterized by overlapping clinical features, including\
      \ ID, neurodevelopmental delay... hearing loss, and dystonia"
    explanation: >-
      The AFG2A review itself flags the AFG2B disorder as the closest phenotypic
      neighbour. The elided words are "neurodevelopmental" and "epilepsy", each
      split across a line break by a hyphen in the cached PDF text.
- name: Primary mitochondrial disease
  description: >-
    This is the differential that actually costs patients time. Congenital
    microcephaly with deafness, cortical visual impairment, epilepsy, hypotonia
    and a mildly raised lactate is a classic mitochondrial presentation, and both
    the auditory and the optic nerve are selectively vulnerable to energy
    failure. Several published AFG2A cohorts were assembled precisely because the
    children were being investigated for suspected mitochondrial disease. The
    discriminator is that no consistent mitochondrial biomarker abnormality has
    been found in AFG2A disease: lactate is normal in all but a few individuals
    and is normal in urine and cerebrospinal fluid even in those, and acid-base
    balance, creatine kinase, pyruvate, organic acids, amino acids and carnitines
    are unremarkable. Mitochondrial DNA studies in the reported patients were
    normal. AFG2A dysfunction does produce secondary mitochondrial abnormalities,
    but the primary lesion is in cytoplasmic ribosome maturation, not in
    oxidative phosphorylation.
  distinguishing_features:
  - No consistent mitochondrial biomarker abnormality; lactate elevation is mild and
    confined to a small minority, and urine and cerebrospinal fluid lactate are normal
  - Mitochondrial DNA depletion, deletion and sequencing studies were normal in the
    reported patients
  - Congenital microcephaly with sensorineural deafness as an obligate pairing is unusual
    in primary mitochondrial disease
  - The primary molecular lesion is in cytoplasmic pre-60S ribosome maturation, with
    mitochondrial dysfunction as a secondary consequence
  disease_term:
    preferred_term: Mitochondrial disease
    term:
      id: MONDO:0044970
      label: mitochondrial disease
  evidence:
  - reference: PMID:41933351
    reference_title: AFG2A-related encephalopathy, expanding the neurodevelopmental
      and epileptic spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The cardinal clinical features of AFG2A-RE may mimic those of a mitochondrial
      disease.
    explanation: >-
      The systematic review names mitochondrial disease as the principal clinical
      mimic.
  - reference: PMID:29343804
    reference_title: Compound heterozygous SPATA5 variants in four families and functional
      studies of SPATA5 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Biallelic variants in the SPATA5 gene can affect mitochondria in cortical
      neurons and should be considered in patients with a neurodegenerative disorder
      and/or with clinical presentation resembling a mitochondrial disorder.
    explanation: >-
      Explicitly recommends considering this gene in patients presenting as
      mitochondrial disease.
  - reference: PMID:41933351
    reference_title: AFG2A-related encephalopathy, expanding the neurodevelopmental
      and epileptic spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two individuals in our cohort (Patient ID 43, 45)... a persistent mild\
      \ elevation of lactate (1.9-3.9 mmol/l) without other abnormalities in mitochondrial...\
      \ including acid-base balance, creatine kinase... organic acids, amino acids,\
      \ carnitines, oxidative stress markers, circulating cytokines, or mitochondrial\
      \ growth factors. No elevated lactate was detected in urine or cerebrospinal\
      \ fluid."
    explanation: >-
      Supplies the biochemical discriminator: the absence of a mitochondrial
      biomarker signature.
- name: Autosomal recessive nonsyndromic sensorineural hearing loss
  description: >-
    At the mild end of the AFG2A spectrum, a confirmed biallelic genotype can
    produce isolated sensorineural hearing impairment with no microcephaly,
    intellectual disability or epilepsy, as documented in the younger sister of a
    typically affected proband. Such an individual is indistinguishable on
    phenotype from nonsyndromic recessive deafness, and the diagnosis can only be
    made molecularly. The practical consequence runs in both directions: AFG2A
    belongs on hearing loss gene panels, and an apparently nonsyndromic deaf
    child with an AFG2A genotype has a recurrence risk for the full
    encephalopathy in siblings.
  distinguishing_features:
  - Indistinguishable clinically; separation is molecular only
  - Absence of microcephaly, intellectual disability, epilepsy and cortical visual
    impairment despite a confirmed biallelic AFG2A genotype
  - Within-family variability means a sibling of an isolated-deafness case may have
    the full encephalopathy
  notes: >-
    Deliberately left UNBOUND. MONDO models autosomal recessive nonsyndromic
    hearing loss only as numbered locus-specific entities (for example
    MONDO:0009076 autosomal recessive nonsyndromic hearing loss 1A,
    MONDO:0010807 ... 2, MONDO:0010860 ... 3), and binding any one of them would
    assert a specific locus that PMID:28293831 never implicates. No honest
    grouping term for the category exists within the ontology set this repository
    constrains itself to, so the slot is left empty rather than filled with an
    approximate term.
  evidence:
  - reference: PMID:28293831
    reference_title: Isolated Hearing Impairment Caused by SPATA5 Mutations in a Family
      with Variable Phenotypic Expression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the sister, the only manifestation was an isolated sensorineural hearing
      loss.
    explanation: >-
      Documents the isolated-deafness presentation that is clinically
      indistinguishable from nonsyndromic recessive hearing loss.
  - reference: PMID:28293831
    reference_title: Isolated Hearing Impairment Caused by SPATA5 Mutations in a Family
      with Variable Phenotypic Expression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our findings extend the phenotypic spectrum of SPATA5-associated diseases
      and indicate that SPATA5 defects may account for a fraction of isolated sensorineural
      hearing impairment cases.
    explanation: >-
      States the authors' inference that the gene contributes to apparently
      isolated hearing impairment.
- name: AIRIM/C1orf109-related neurodevelopmental disorder
  description: >-
    The third disease gene of the same 55LCC complex, described in 2025. Eleven
    unrelated families comprising eighteen individuals presented with severe
    global developmental delay and intellectual disability, muscular hypotonia
    with limb spasticity and dystonia, microcephaly, hearing and vision
    impairment and infantile seizures. This is close enough to AFG2A-related
    encephalopathy that the two are separable only by gene. It is included here
    partly because the 2026 AFG2A systematic review states that no neurological
    disorder has been linked to C1orf109 or CINP, a statement that this paper,
    published five months earlier, already contradicted; a curator relying on the
    review alone would omit this differential entirely.
  distinguishing_features:
  - Caused by AIRIM/C1orf109 (hgnc:26039), a different subunit of the same 55LCC
    complex
  - Hearing impairment is less consistent than in AFG2A disease (9 of 17 versus
    around 94%)
  - Reported seizure semiology is dominated by generalised tonic-clonic and myoclonic
    seizures and Lennox-Gastaut syndrome rather than by infantile epileptic spasms
    syndrome
  - Neuroimaging emphasises severe supratentorial atrophy with ex-vacuum ventricular
    dilatation, rather than the hypomyelination-predominant AFG2A pattern
  notes: >-
    Deliberately left UNBOUND. A `runoak` search of MONDO for both "AIRIM" and
    "C1orf109" returns no term, so no disease entity exists in MONDO for this
    disorder yet. The gene itself resolves (hgnc:26039 ! C1orf109) but a gene is
    not a disease term and must not be put in `disease_term`.
  evidence:
  - reference: PMID:40760247
    reference_title: A programmed decline in ribosome levels governs human early neurodevelopment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we describe variants in the ribosome biogenesis factor AIRIM/C1orf109
      that are primarily associated with neurodevelopmental disorders.
    explanation: >-
      Establishes AIRIM/C1orf109 as a third 55LCC neurodevelopmental disease
      gene.
  - reference: PMID:40760247
    reference_title: A programmed decline in ribosome levels governs human early neurodevelopment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of individuals from whom information was available concomitantly\
      \ showed muscular hypotonia accompanied by limb spasticity and dystonia (each\
      \ 11 of 17), microcephaly (14 of 17), as well as hearing (9 of 17) and vision\
      \ impairment (6 of 17)"
    explanation: >-
      Gives the AIRIM cohort's phenotype counts, which are the basis of the
      discriminators listed above.
  - reference: PMID:41933351
    reference_title: AFG2A-related encephalopathy, expanding the neurodevelopmental
      and epileptic spectrum.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, no... disorders have been linked to the other... of the\
      \ complex, C1orf109 and CINP, to date."
    explanation: >-
      Recorded as REFUTE because this sentence, from the most recent systematic
      review, is superseded by PMID:40760247. It is kept in the entry so the next
      curator sees the contradiction rather than rediscovering it. The elided
      words are "neurological" and "components", each split across a line break
      by a hyphen in the cached PDF text.
  - reference: PMID:40760247
    reference_title: A programmed decline in ribosome levels governs human early neurodevelopment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "human genetic studies have identified a growing number of allelic variants\
      \ in AFG2A, AFG2B and CINP that are specifically... with a range of NDDs, including\
      \ intellectual disabilities, seizures, hearing loss and microcephaly"
    explanation: >-
      The same authors record that CINP too is now a neurodevelopmental disease
      gene, which is the direct contradiction of the review sentence above. The
      elided word is "associated", split across a line break by a hyphen.
discussions:
- discussion_id: afg2a_mouse_null_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Can any constitutive mouse Afg2a model represent AFG2A-related
    encephalopathy, given that every reported human genotype retains partial
    ATPase function?
  attaches_to:
  - pathophysiology#Biallelic AFG2A Loss of Function
  rationale: >-
    No published human genotype combines two unambiguous null alleles: more than
    half of the 42 reported disease variants are missense and the remainder are
    always found in trans with a missense or in-frame allele. The disease is
    therefore hypomorphic. The IMPC constitutive knockout of the mouse orthologue
    is reported as embryonic lethal before organogenesis, which if correct means a
    complete null cannot model the human disorder at all and that a faithful model
    would have to be a knock-in of a patient hypomorphic allele or a conditional
    neural hypomorph. No such model has been published. The mouse phenotype is
    recorded here from an IMPC database entry surfaced by the deep-research run and
    is deliberately NOT cited as an evidence item, because it has no PMID and this
    entry does not cite un-fetchable sources.
  notes: >-
    Verification status: the missense-majority claim is cited in the entry from
    PMID:41933351. The mouse embryonic lethality claim is unverified against any
    cached reference and is recorded as an open question, not as an assertion.
- discussion_id: afg2a_mitochondrial_localisation_tension
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is the mitochondrial dysfunction in AFG2A deficiency a direct consequence of
    a mitochondrial pool of the protein, or is it secondary to reduced
    translational capacity?
  attaches_to:
  - pathophysiology#Neuronal Mitochondrial Fusion-Fission Imbalance
  rationale: >-
    The protein carries a putative mitochondrial matrix-targeting sequence and was
    originally described as a mitochondrial morphogenesis factor in
    spermatogenesis, and patient cells reproducibly show bioenergetic deficits.
    Against a direct mitochondrial role: the overexpressed protein is dominantly
    cytosolic in cortical neurons and does not co-localise with mitochondrial
    markers (PMID:29343804), no patient shows a consistent mitochondrial biomarker
    abnormality (PMID:41933351), respiratory chain findings are inconsistent
    between patients, and the established molecular function of the 55LCC complex
    is cytoplasmic ribosome maturation. The entry models the mitochondrial arm as
    downstream and provisional, but the question is genuinely open.
  evidence:
  - reference: PMID:29343804
    reference_title: Compound heterozygous SPATA5 variants in four families and functional
      studies of SPATA5 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: To our surprise the localization of overexpressed SPATA5 in cultured
      primary cortical neurons was dominantly cytosolic and clearly not co-localizing
      with the mitochondrial marker
    explanation: The observation that motivates the question.
  - reference: PMID:35354024
    reference_title: Labeling of heterochronic ribosomes reveals C1ORF109 and SPATA5
      control a late step in human ribosome assembly.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We provide evidence that these factors, together with CINP and SPATA5L1,
      control a late step of human pre-60S maturation in the cytoplasm.
    explanation: >-
      The established molecular function is cytoplasmic, which is the main
      argument against a primary mitochondrial role.
- discussion_id: afg2a_intrafamilial_variability
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Why do siblings carrying the identical biallelic AFG2A genotype range from
    isolated sensorineural hearing loss to full developmental and epileptic
    encephalopathy?
  attaches_to:
  - phenotypes#Sensorineural hearing impairment
  rationale: >-
    In the family reported in PMID:28293831 the proband had the typical
    encephalopathy while her younger sister's only manifestation was isolated
    sensorineural hearing loss, on the same two variants. Comparable variability
    in epilepsy status occurred within the large consanguineous family of
    PMID:27683084. No modifier gene has been identified. Plausible but untested
    candidates are variation in the other 55LCC subunits or in general ribosome
    biogenesis capacity. Until this is resolved, genotype cannot be used to
    counsel on severity.
  evidence:
  - reference: PMID:28293831
    reference_title: Isolated Hearing Impairment Caused by SPATA5 Mutations in a Family
      with Variable Phenotypic Expression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband had a similar clinical picture to the previous descriptions\
      \ of EHLMRS. In the sister, the only manifestation was an isolated sensorineural\
      \ hearing loss."
    explanation: >-
      Documents the two extremes of expressivity within a single sibship sharing
      the same two variants.
- discussion_id: afg2a_natural_history_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the natural history, life expectancy and quality-of-life burden of
    AFG2A-related encephalopathy?
  rationale: >-
    No prospective natural history study, survival curve, population prevalence
    estimate, carrier frequency or validated quality-of-life measurement exists.
    All fifty-one pooled individuals come from retrospective case reports and
    series, three of whom had died, at ages 3, 4.9 and 13.4 years, while two
    individuals from the attenuated consanguineous family were alive at 39 and 41
    years. The 2026 systematic review states directly that prospective natural
    history studies across multiple reference centres are needed. This entry
    therefore carries no survival or quality-of-life claims.

- name: Seizure
  category: Neurologic
  description: >-
    Epilepsy affects roughly three quarters of individuals. Generalised-onset
    seizures predominate, and the epilepsy is usually drug resistant, requiring
    polytherapy. A minority of individuals never develop seizures at all, so
    epilepsy is a frequent but not obligate feature despite the historical name
    of the syndrome.
  frequency: FREQUENT
  notes: >-
    38 of 51 individuals (74.5%) in the pooled cohort; 73% in the earlier
    30-patient summary. Drug resistance was reported in 82.35% of the 17
    individuals with anti-seizure medication data, but that denominator is small
    and conditioned on having epilepsy, so no separate frequency band is asserted
    for drug resistance.

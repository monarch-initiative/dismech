treatments:
- name: Orthopedic Correction of Joint Contracture
  description: >-
    Gradual correction of knee flexion contracture using a Taylor spatial frame,
    followed by bracing to maintain extension. Reported as safe and effective in
    a molecularly confirmed COLEC11 patient; knee flexion contracture was not
    previously recognised as part of the syndrome.
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:34589314
    reference_title: Management of Knee Flexion Contracture in a Child With 3MC Syndrome Using Taylor Spatial Frame.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      According to our findings, the TSF was the safest, most accurate, stable
      fixator, and most efficient solution for treating knee flexion
      contracture, resulting in high patient and family satisfaction.
    explanation: >-
      Reports the outcome of the intervention in a confirmed 3MC patient.
- name: Genetic Counseling
  description: >-
    Counselling for the autosomal recessive recurrence risk, which is
    substantial and actionable: a molecularly confirmed diagnosis enables
    alternative reproductive options and prenatal testing.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:32441374
    reference_title: 'Sacral protuberance with cleft lip and palate: Prenatal presentation of 3MC syndrome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3MC syndrome should be considered as part of the differential diagnosis
      when fetal ultrasound detects facial clefts and spinal defects, as the
      risk of recurrence is significant and a molecularly confirmed diagnosis
      allows for alternate reproductive options.
    explanation: >-
      States the recurrence risk and the reproductive consequence that make
      counselling actionable.
  notes: >-
    There is no disease-modifying therapy for 3MC syndrome. Management is
    symptomatic and surgical - orofacial cleft repair, correction of ptosis and
    blepharophimosis, craniosynostosis surgery where present, orthopedic
    correction of contractures, and audiologic rehabilitation for the hearing
    loss. Only the interventions with a citable 3MC-specific report are curated
    as treatments here; the rest are standard management of the individual
    malformations rather than of the syndrome.
progression:
- phase: Congenital and static
  notes: >-
    3MC syndrome is a congenital malformation syndrome. The structural
    anomalies are present at birth, are static rather than progressive, and
    survival to adulthood is documented. Prenatal detection is possible when
    fetal ultrasound shows facial clefting together with spinal or renal
    anomalies.
  evidence:
  - reference: PMID:32441374
    reference_title: 'Sacral protuberance with cleft lip and palate: Prenatal presentation of 3MC syndrome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fetal findings included bilateral cleft lip and palate, abnormality of the
      sacral spine, a right echogenic pelvic kidney, and brachycephaly.
    explanation: >-
      Documents the prenatally detectable findings, establishing congenital
      onset.
  - reference: PMID:29407414
    reference_title: Biallelic intragenic deletion in MASP1 in an adult female with 3MC syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We therefore expand the MASP1 associated mutational and clinical spectrum
      and describe the development of her clinical presentation over a period of
      21 years.
    explanation: >-
      A 21-year follow-up in an adult patient supports survival to adulthood and
      a non-lethal course.
animal_models:
- name: colec11 zebrafish morphant
  species: Zebrafish
  genotype: colec11 antisense morpholino knockdown (ATG and splice-site)
  publication: PMID:21258343
  description: >-
    Morpholino knockdown of colec11 in zebrafish embryos, rescued by
    co-injection of full-length COLEC11 mRNA.
  modeled_mechanisms:
  - target: Defective Cranial Neural Crest-Derived Craniofacial Morphogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Knockdown reproduces severe craniofacial cartilage malformation, the
      tissue-level phenotype of the human syndrome.
    limitations: >-
      Morpholino knockdown is transient and dose-dependent rather than a
      germline null, and zebrafish craniofacial cartilage does not map
      one-to-one onto the human facial skeleton. The report notes high mortality
      at higher doses, requiring lower doses for cartilage staining.
    readouts:
    - name: Alcian blue-stained craniofacial cartilage morphology
      target: Defective Cranial Neural Crest-Derived Craniofacial Morphogenesis
      direction: ALTERED
      interpretation: >-
        Reduced mandibular length and malformed anterior neurocranium, the
        structural correlate of the human craniofacial phenotype.
      evidence:
      - reference: PMID:21258343
        reference_title: Mutations in lectin complement pathway genes COLEC11 and MASP1 cause 3MC syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Striking differences in the craniofacial skeleton were observed
          compared with uninjected/standard morpholino injected embryos, such as
          reduced mandibular length (e.g. shortened Meckel and palatoquadrate
          cartilages), malformation of the anterior neurocranium with shortening
          of the trabeculae and the ethmoid plate, shortening and abnormal
          angulation of the ceratohyal cartilage
        explanation: >-
          Reports the specific craniofacial cartilage measurements behind this
          readout.
    evidence:
    - reference: PMID:21258343
      reference_title: Mutations in lectin complement pathway genes COLEC11 and MASP1 cause 3MC syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Zebrafish morphants for either gene develop pigmentary defects and
        severe craniofacial abnormalities.
      explanation: >-
        Supports treating the morphant as informative for the craniofacial
        morphogenesis node.
- name: Masp1/3 knockout mouse
  species: Mouse
  genotype: Masp1/3-/-
  publication: PMID:28794230
  description: >-
    Mouse lacking both MASP-1 and MASP-3, used to establish the maturase role of
    MASP-3 in pro-factor D conversion.
  modeled_mechanisms:
  - target: Impaired Pro-Factor D Maturation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the failure of pro-factor D conversion seen in patient serum.
    limitations: >-
      The knockout removes both MASP-1 and MASP-3, whereas human 3MC alleles
      cluster in the MASP-3-specific exon, so the model is broader than the
      human genotype. It models the biochemical node only, not the craniofacial
      phenotype.
    evidence:
    - reference: PMID:28794230
      reference_title: Analysis of Factor D Isoforms in Malpuech-Michels-Mingarelli-Carnevale Patients Highlights the Role of MASP-3 as a Maturase in the Alternative Pathway of Complement.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This view was challenged when it was shown that mice lacking
        mannose-binding lectin (MBL)-associated serine protease-1 (MASP-1) and
        MASP-3 contain zymogenic FD (pro-FD), and it is becoming evident that
        MASP-3 is implicated in pro-FD maturation.
      explanation: >-
        Establishes the mouse knockout as the model that first identified the
        pro-factor D maturation defect.
- name: Colec11 knockout mouse
  species: Mouse
  genotype: Colec11-/- (single knockout)
  publication: PMID:41774788
  description: >-
    Single-gene collectin-11 knockout, used as the control arm against which the
    complement double knockouts were compared.
  modeled_mechanisms:
  - target: Impaired Complement-Dependent Osteoclastogenesis
    relationship: FAILS_TO_RECAPITULATE
    fidelity: MODERATE
    description: >-
      Collectin loss on its own does not reproduce the skeletal phenotype in
      mice. This negative result is the reason the osteoclastogenesis node is
      curated as requiring a second complement hit rather than as a direct
      consequence of collectin deficiency.
    limitations: >-
      A negative result in mouse does not establish that human COLEC11 loss is
      skeletally silent: humans carry biallelic collectin loss on a different
      complement background, and the reported 3MC skeletal features
      (craniosynostosis, radioulnar synostosis) are developmental rather than
      the remodelling phenotype measured here. The finding constrains the
      mechanism; it does not transfer the negative to patients.
    evidence:
    - reference: PMID:41774788
      reference_title: Collectin-11 regulates osteoclastogenesis and bone maintenance via a complement-dependent mechanism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we demonstrate that CL-11 deletion alone does not produce skeletal
        abnormalities in mice
      explanation: >-
        States the negative result directly.
experimental_models:
- name: Human iPSC-derived osteoclasts
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Osteoclasts differentiated from human induced pluripotent stem cell lines,
    used to test whether the mouse collectin/complement dependence holds in
    human cells.
  publication: PMID:41774788
  modeled_mechanisms:
  - target: Impaired Complement-Dependent Osteoclastogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the CL-11 and complement dependence of osteoclast
      differentiation in human cells, which is what makes the mouse finding
      relevant to the human disease.
    limitations: >-
      iPSC-derived osteoclasts in culture lack the bone microenvironment and the
      mechanical loading that drive remodelling in vivo, and the cells are not
      3MC patient-derived, so the system tests the pathway rather than the
      patient genotype.
    readouts:
    - name: Osteoclast differentiation from human iPSC lines
      target: Impaired Complement-Dependent Osteoclastogenesis
      direction: DECREASED
      interpretation: >-
        Human confirmation of the collectin/complement requirement measured in
        the mouse ex vivo assay.
      evidence:
      - reference: PMID:41774788
        reference_title: Collectin-11 regulates osteoclastogenesis and bone maintenance via a complement-dependent mechanism.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          This dependence on CL-11 and complement was recapitulated in human
          OCLs derived from induced pluripotent stem cell lines.
        explanation: >-
          Reports the human osteoclast differentiation measurement behind this
          readout.
    evidence:
    - reference: PMID:41774788
      reference_title: Collectin-11 regulates osteoclastogenesis and bone maintenance via a complement-dependent mechanism.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This dependence on CL-11 and complement was recapitulated in human
        OCLs derived from induced pluripotent stem cell lines.
      explanation: >-
        Supports the human system as informative for the osteoclastogenesis
        node.
differential_diagnoses:
- name: Branchio-oto-renal spectrum
  description: >-
    Also presents with hearing loss and branchial/ear anomalies, but is
    autosomal dominant, EYA1/SIX-related, and features renal malformation and
    branchial fistulae rather than the 3MC periorbital gestalt, clefting and
    caudal appendage.
- name: Blepharophimosis-ptosis-epicanthus inversus syndrome
  description: >-
    Shares the periorbital gestalt (blepharophimosis, ptosis, epicanthus
    inversus) but is FOXL2-related, autosomal dominant, and lacks orofacial
    clefting, growth deficiency and the skeletal synostoses.
diagnosis:
- name: Molecular diagnosis by sequencing of MASP1, COLEC11 and COLEC10
  description: >-
    Diagnosis is confirmed by identifying biallelic pathogenic variants in one
    of the three genes, typically via exome sequencing or a targeted panel. In
    individuals of Ashkenazi Jewish ancestry, targeted testing for the COLEC10
    c.311G>T founder allele is warranted.

    Two documented false-negative routes matter when a molecular result comes
    back negative in a clinically convincing case. Some clinical exome panels
    carry only MASP1 and COLEC11, so a COLEC10 variant is not looked for at all;
    and intragenic deletions can escape routine variant-calling and be found
    only on direct inspection of the sequencing data. Both have produced
    initially unsolved 3MC cases.
  evidence:
  - reference: PMID:35943032
    reference_title: "Expanding the phenotypic spectrum of COLEC10-Related 3MC syndrome: A glimpse into COLEC10-Related 3MC syndrome in the Ashkenazi Jewish population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3MC syndrome should be in the differential diagnosis for individuals with
      short stature, radioulnar synostosis, cleft lip and cleft palate.
    explanation: >-
      States the clinical trigger for pursuing a molecular diagnosis. Graded
      against the "when to suspect" half of this entry only; the confirmatory
      sequencing claim is evidenced separately below.
  - reference: PMID:34740859
    reference_title: A novel COLEC10 mutation in a child with 3MC syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initial genetic analysis was based on clinical exome sequencing, where
      only MASP1 and COLEC11 genes are present, without evidence of pathogenic
      variants.
    explanation: >-
      Documents a false-negative caused by a clinical exome panel that omits
      COLEC10, which is why panel gene content has to be checked before a
      negative result is accepted.
  - reference: PMID:29407414
    reference_title: Biallelic intragenic deletion in MASP1 in an adult female with 3MC syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As the homozygous deletion in our patient was only found by thorough and
      visual evaluation of the whole exome sequencing data, such deletions might
      escape detection in some routine diagnostic workflows and might explain a
      few of the so far molecularly unconfirmed cases of 3MC syndrome.
    explanation: >-
      Documents the second false-negative route, intragenic deletions missed by
      routine variant-calling, and connects it to unsolved cases.
notes: >-
  Curated as a single Disease entry rather than three per-gene entries. The
  three genetic forms are clinically indistinguishable and their protein
  products act in one pathway — CL-K1 and CL-L1 form heteromeric complexes, and
  MASP-3 is the collectin-associated protease — so one pathograph covers all
  three. Per-gene detail is carried in has_subtypes and genetic.

  The entry deliberately keeps the alternative-complement-pathway consequence
  (impaired pro-factor D maturation) as a terminal node with no clinical
  sequela. This is the most likely place for a future curator to overreach: the
  gene names invite an immunodeficiency narrative that the clinical literature
  does not support.

      label: Autosomal recessive inheritance
  description: >-
    All three genetic forms of 3MC syndrome are inherited in an autosomal
    recessive manner. Affected individuals carry biallelic (homozygous or
    compound heterozygous) variants, and reported pedigrees are frequently
    consanguineous.
  evidence:
  - reference: PMID:21258343
    reference_title: Mutations in lectin complement pathway genes COLEC11 and MASP1 cause 3MC syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These rare autosomal recessive disorders exhibit a spectrum of
      developmental features, including characteristic facial dysmorphism, cleft
      lip and/or palate, craniosynostosis, learning disability and genital, limb
      and vesicorenal anomalies.
    explanation: >-
      States the autosomal recessive inheritance of the four constituent
      syndromes now unified as 3MC syndrome.
    quote_role: BACKGROUND
has_subtypes:
- name: 3MC1
  display_name: 3MC syndrome 1 (MASP1/MASP-3)
  description: >-
    Caused by biallelic MASP1 variants that impair MASP-3. Missense changes and deletions can affect the
    MASP-3-specific serine protease domain encoded by exon 12; earlier truncating variants can affect
    sequence shared with other MASP1 products. Pro-factor D maturation is additionally impaired.
  subtype_term:
    preferred_term: 3MC syndrome 1
    term:
      id: MONDO:0009770
      label: 3MC syndrome 1
  genes:
  - preferred_term: MASP1
    term:
      id: hgnc:6901
      label: MASP1
  evidence:
  - reference: PMID:21035106
    reference_title: MASP1 mutations in patients with facial, umbilical, coccygeal, and auditory findings of Carnevale, Malpuech, OSA, and Michels syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In one family, whole exome sequencing revealed a missense mutation, MASP1
      c.2059G>A (p.G687R), that cosegregated with the phenotype.
    explanation: >-
      Establishes MASP1 as a 3MC syndrome disease gene through cosegregation in
      a consanguineous family.
    quote_role: PRIMARY_RESULT
- name: 3MC2
  display_name: 3MC syndrome 2 (COLEC11/CL-K1)
  description: >-
    Caused by biallelic COLEC11 variants affecting CL-K1. Tested carbohydrate-recognition-domain
    missense variants impair secretion; truncating variants and multi-exon deletions are also reported.

- population: Ashkenazi Jewish
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1010.0
  notes: >-
    Variant-specific carrier frequency, not disease prevalence: 400/39,750 individuals of Ashkenazi Jewish
    descent in a larger screened cohort of 52,278 individuals of Jewish descent carried the likely founder
    COLEC10 c.311G>T (p.Gly104Val) allele.
  evidence:
  - reference: PMID:35943032
    reference_title: "Expanding the phenotypic spectrum of COLEC10-Related 3MC syndrome: A glimpse into COLEC10-Related 3MC syndrome in the Ashkenazi Jewish population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified nine individuals from five families of Ashkenazi Jewish descent with
      homozygosity of the c.311G > T (p.Gly104Val) variant in COLEC10 and phenotype consistent with
      3MC syndrome. Carrier frequency was calculated among 52,278 individuals of Jewish descent.
      Testing revealed 400 carriers out of 39,750 individuals of Ashkenazi Jewish descent, giving a
      carrier frequency of 1 in 99 or 1.01%. ... The c.311G > T (p.Gly104Val) variant likely
      represents a founder variant, and homozygosity is associated with features of 3MC syndrome.
    explanation: >-
      The COLEC10 p.Gly104Val founder variant was observed in nine affected individuals from five
      Ashkenazi Jewish families. Screening found 400 carriers among 39,750 Ashkenazi Jewish
      individuals (1.01%); this is carrier frequency, not affected-person prevalence.
    quote_role: PRIMARY_RESULT
treatments:
- name: Orthopedic Correction of Joint Contracture
  description: >-
    One child with COLEC11-related 3MC and bilateral fixed knee flexion contractures underwent sequential
    gradual correction using Taylor spatial frames, followed by casts and braces. Full knee extension
    was maintained for three months; foot deformities still required management. A single uncontrolled
    case does not establish superiority or general safety.
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:34589314
    reference_title: Management of Knee Flexion Contracture in a Child With 3MC Syndrome Using Taylor Spatial Frame.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In our reported patient, full extension of both knees was maintained for a total of three months
      using a cast and then a brace.
    explanation: >-
      Reports the observed short-term result and maintenance measures after frame correction.
  - reference: PMID:34589314
    reference_title: Management of Knee Flexion Contracture in a Child With 3MC Syndrome Using Taylor Spatial Frame.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      While the TSF technique restored full extension to both knees, the patient still has another deformity
      in both feet that requires further management.
    explanation: >-
      The intervention corrected the knees but did not resolve the separate foot deformities.
- name: Genetic Counseling
  description: >-
    Genetic counseling addresses autosomal recessive inheritance, family testing and reproductive options.
    Prenatal molecular testing is possible once the familial pathogenic variants are identified.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:32441374
    reference_title: 'Sacral protuberance with cleft lip and palate: Prenatal presentation of 3MC syndrome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3MC syndrome should be considered as part of the differential diagnosis
      when fetal ultrasound detects facial clefts and spinal defects, as the
      risk of recurrence is significant and a molecularly confirmed diagnosis
      allows for alternate reproductive options.
    explanation: >-
      States the recurrence risk and the reproductive consequence that make
      counselling actionable.
    quote_role: PRIMARY_RESULT
- name: Surgery for Craniosynostosis
  description: >-
    Cranioplasty was performed at five and eighteen months in the reported child with COLEC10-related
    3MC and congenital craniosynostosis. This is documented care in one case; no comparative treatment
    outcome was reported.
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:34636477
    reference_title: Whole-exome sequencing identified first homozygous frameshift variant in the COLEC10 gene in an Iranian patient causing 3MC syndrome type 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Clinical examination, presented craniosynostosis at birth, therefore, first cranioplasty was performed
      at 5 months old and second one at 18 months old.
    explanation: >-
      Documents cranial surgery in a molecularly confirmed patient without establishing a syndrome-specific
      surgical protocol.
  treatment_term:
    preferred_term: cranial reconstructive surgery
    term:
      id: NCIT:C25351
      label: Reconstructive Surgery
  notes: >-
    NCIT search `runoak -i ols:ncit search 't~cranio'` returned Craniotomy but no cranioplasty term; `runoak
    -i ols:ncit search 't~reconstructive'` returned NCIT:C25351 Reconstructive Surgery. The latter represents
    reconstruction without incorrectly equating it to opening the skull.
progression:
- phase: Congenital presentation and variable later development
  notes: >-
    Structural anomalies can be recognized prenatally or at birth. Developmental impairment is variable,
    and survival into adulthood is documented, including an adult without intellectual disability or short
    stature. The available reports do not establish that every manifestation remains static over life.
  evidence:
  - reference: PMID:32441374
    reference_title: 'Sacral protuberance with cleft lip and palate: Prenatal presentation of 3MC syndrome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fetal findings included bilateral cleft lip and palate, abnormality of the
      sacral spine, a right echogenic pelvic kidney, and brachycephaly.
    explanation: >-
      Documents the prenatally detectable findings, establishing congenital
      onset.
    quote_role: PRIMARY_RESULT
  - reference: PMID:29407414
    reference_title: Biallelic intragenic deletion in MASP1 in an adult female with 3MC syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We therefore expand the MASP1 associated mutational and clinical spectrum
      and describe the development of her clinical presentation over a period of
      21 years.
    explanation: >-
      A 21-year follow-up in an adult patient supports survival to adulthood and
      a non-lethal course.
    quote_role: PRIMARY_RESULT
  - reference: PMID:29407414
    reference_title: Biallelic intragenic deletion in MASP1 in an adult female with 3MC syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By trio exome sequencing we now identified a novel, homozygous 2kb
      deletion, partially affecting exon 12 in an adult female with the typical
      facial gestalt of 3MC syndrome and hearing loss, but without the main
      feature cleft lip/palate, and without intellectual disability, or short
      stature.
    explanation: >-
      Documents an intragenic deletion allele class and, separately, marked
      variable expressivity - a patient with the facial gestalt but none of
      clefting, intellectual disability or short stature.
    quote_role: PRIMARY_RESULT
animal_models:
- name: colec11 zebrafish morphant
  species: Zebrafish
  genotype: colec11 antisense morpholino knockdown (ATG and splice-site)
  publication: PMID:21258343
  description: >-
    Morpholino knockdown of colec11 in zebrafish embryos, rescued by
    co-injection of full-length COLEC11 mRNA.
  modeled_mechanisms:
  - target: Defective Cranial Neural Crest-Derived Craniofacial Morphogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Knockdown reproduces severe craniofacial cartilage malformation, the
      tissue-level phenotype of the human syndrome.
    limitations: >-
      Morpholino knockdown is transient and dose-dependent rather than a
      germline null, and zebrafish craniofacial cartilage does not map
      one-to-one onto the human facial skeleton. The report notes high mortality
      at higher doses, requiring lower doses for cartilage staining.
    readouts:
    - name: Alcian blue-stained craniofacial cartilage morphology
      target: Defective Cranial Neural Crest-Derived Craniofacial Morphogenesis
      direction: ALTERED
      interpretation: >-
        Reduced mandibular length and malformed anterior neurocranium, the
        structural correlate of the human craniofacial phenotype.
      evidence:
      - reference: PMID:21258343
        reference_title: Mutations in lectin complement pathway genes COLEC11 and MASP1 cause 3MC syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Striking differences in the craniofacial skeleton were observed
          compared with uninjected/standard morpholino injected embryos, such as
          reduced mandibular length (e.g. shortened Meckel and palatoquadrate
          cartilages), malformation of the anterior neurocranium with shortening
          of the trabeculae and the ethmoid plate, shortening and abnormal
          angulation of the ceratohyal cartilage
        explanation: >-
          Reports the specific craniofacial cartilage measurements behind this
          readout.
        quote_role: PRIMARY_RESULT
    evidence:
    - reference: PMID:21258343
      reference_title: Mutations in lectin complement pathway genes COLEC11 and MASP1 cause 3MC syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Zebrafish morphants for either gene develop pigmentary defects and
        severe craniofacial abnormalities.
      explanation: >-
        Supports treating the morphant as informative for the craniofacial
        morphogenesis node.
      quote_role: PRIMARY_RESULT
  - target: Impaired Neural Crest Cell Guidance
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The same colec11 perturbation alters neural crest streaming and location before craniofacial cartilage
      is assessed.
    limitations: >-
      Transient, dose-sensitive morpholino knockdown is not a patient-specific germline allele, and migration
      does not alone establish the route to each human feature.
    evidence:
    - reference: PMID:21258343
      reference_title: Mutations in lectin complement pathway genes COLEC11 and MASP1 cause 3MC syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        At 24 hpf, the organisation of streaming NCC through the somites is severely disrupted in the
        colec11 morphants and obviously truncated in the masp1 morphants
      explanation: >-
        Zebrafish morpholino perturbations alter neural crest distribution and streaming. The masp1 perturbation
        does not isolate MASP-3 from other gene products.
    - reference: PMID:21258343
      reference_title: Mutations in lectin complement pathway genes COLEC11 and MASP1 cause 3MC syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        In addition, we injected SOX10-eGFP zebrafish with colec11 and masp1 MO and observed at 48 hpf,
        ectopic NCC in the head, trunk and periphery
      explanation: >-
        Ectopic neural crest cells support dysregulated guidance rather than a uniform decrease in cell
        number.

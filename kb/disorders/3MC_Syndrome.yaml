  evidence:
  - reference: PMID:21258343
    reference_title: Mutations in lectin complement pathway genes COLEC11 and MASP1 cause 3MC syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each mutation segregated with the disease in every family.
    explanation: >-
      Cosegregation across the COLEC11 families supports causality.
- name: COLEC10
  gene_term:
    preferred_term: COLEC10
    term:
      id: hgnc:2220
      label: COLEC10
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic COLEC10 variants cause 3MC syndrome 3. The gene encodes collectin
    liver 1 (CL-L1), which forms heteromeric complexes with CL-K1.
  case_fractions:
  - population: Ashkenazi Jewish carrier screening cohort
    notes: >-
      Not a case fraction among 3MC patients but a population carrier frequency
      for the founder allele c.311G>T (p.Gly104Val); recorded here because it is
      the only quantitative population genetic estimate available for any 3MC
      gene.
    evidence:
    - reference: PMID:35943032
      reference_title: "Expanding the phenotypic spectrum of COLEC10-Related 3MC syndrome: A glimpse into COLEC10-Related 3MC syndrome in the Ashkenazi Jewish population."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Testing revealed 400 carriers out of 39,750 individuals of Ashkenazi
        Jewish descent, giving a carrier frequency of 1 in 99 or 1.01%.
      explanation: >-
        Quantifies the founder allele carrier frequency in the Ashkenazi Jewish
        population.
  evidence:
  - reference: PMID:28301481
    reference_title: COLEC10 is mutated in 3MC patients and regulates early craniofacial development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we define a new gene, COLEC10, also mutated in 3MC families and
      present novel mutations in COLEC11 and MASP1/3 genes in a further five
      families.
    explanation: >-
      Establishes COLEC10 as a 3MC disease gene.
  - reference: PMID:34740859
    reference_title: A novel COLEC10 mutation in a child with 3MC syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Segregation studies confirmed that both parents were carriers for the
      variant: interestingly they originate from the same area of Apulia in
      southern Italy.
    explanation: >-
      Documents a second, independent COLEC10 founder allele in southern Italy,
      alongside the Ashkenazi Jewish c.311G>T allele.
  - reference: PMID:34740859
    reference_title: A novel COLEC10 mutation in a child with 3MC syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, the variant affects the chemo-attractive feature of CL-L1, as
      HeLa cells migrate significantly less in response to the mutant protein
      compared to the wild-type one.
    explanation: >-
      Shows a distinct loss-of-function route for this allele: normal plasma
      levels but impaired chemoattractant activity, so secretion failure is not
      the only mechanism.

pathophysiology:
- name: Impaired CL-K1 Calcium Binding
  biological_scale: MOLECULAR
  description: >-
    Three tested COLEC11 carbohydrate-recognition-domain variants (Ser169Pro, Gly204Ser and Ser217 deletion)
    abolish calcium binding in recombinant fragments. The fragments can refold and oligomerize in vitro,
    but lack calcium-dependent stabilization.
  genes:
  - preferred_term: COLEC11
    term:
      id: hgnc:17213
      label: COLEC11
  molecular_functions:
  - preferred_term: calcium ion binding
    term:
      id: GO:0005509
      label: calcium ion binding
    modifier: DECREASED
  evidence:
  - reference: PMID:25912189
    reference_title: Molecular basis of sugar recognition by collectin-K1 and the effects of mutations associated with 3MC syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Interestingly, none of the mutations prevent folding or oligomerization of recombinant fragments
      containing the mutations in vitro. Instead, they prevent Ca(2+) binding by the carbohydrate-recognition
      domains of CL-K1.
    explanation: >-
      Recombinant fragments carrying Ser169Pro, Gly204Ser or Ser217 deletion lose calcium binding. Refolding
      in vitro does not exclude a biosynthetic folding defect in cells.
  downstream:
  - target: Reduced Extracellular CL-K1 Availability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Failure of calcium binding is proposed to compromise CL-K1 during biosynthesis and prevent secretion.
      Cellular quality-control recognition and degradation are plausible intermediates that were not directly
      demonstrated.
    evidence:
    - reference: PMID:25912189
      reference_title: Molecular basis of sugar recognition by collectin-K1 and the effects of mutations associated with 3MC syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        We propose that failure to bind Ca(2+) during biosynthesis leads to structural defects that prevent
        secretion of CL-K1, thus providing a molecular explanation of the genetic disorder.
      explanation: >-
        The authors propose this biosynthetic mechanism from calcium-binding and secretion experiments;
        the intervening quality-control steps remain unproven.
      directness: INDIRECT
  - target: Impaired CL-K1 Carbohydrate Binding
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Calcium normally stabilizes ligand-binding loops in the carbohydrate-recognition domain. The tested
      variants lose calcium binding and carbohydrate recognition; loop destabilization links these molecular
      effects.
    evidence:
    - reference: PMID:25912189
      reference_title: Molecular basis of sugar recognition by collectin-K1 and the effects of mutations associated with 3MC syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: >-
        failure to bind Ca 2+ destabilises the CRDs and exposes flexible loop regions.
      explanation: >-
        The authors infer the connection from structural, calcium-binding and ligand-binding measurements;
        the quoted wording retains the proposed nature of the explanation.
- name: Impaired CL-K1 Carbohydrate Binding
  biological_scale: MOLECULAR
  description: >-
    Recombinant CL-K1 fragments carrying the three tested 3MC-associated carbohydrate-recognition-domain
    variants fail to bind yeast invertase or the dextran chromatography matrix. These ligand-binding assays
    demonstrate functional loss even though the fragments assemble into trimers in vitro.
  molecular_functions:
  - preferred_term: carbohydrate binding
    term:
      id: GO:0030246
      label: carbohydrate binding
    modifier: DECREASED
  evidence:
  - reference: PMID:25912189
    reference_title: Molecular basis of sugar recognition by collectin-K1 and the effects of mutations associated with 3MC syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Both full-length CL-K1 and the wild-type fragment bound to the invertase, but the three variant
      fragments did not bind (Figure 6C).
    explanation: >-
      The assay directly measures loss of carbohydrate recognition in the recombinant variants. The corresponding
      developmental ligand has not been established.
- name: Reduced Extracellular CL-K1 Availability
  biological_scale: MOLECULAR
  description: >-
    Biallelic COLEC11 loss-of-function variants reduce functional extracellular CL-K1. Three tested carbohydrate-recognition-domain
    variants block secretion in mammalian cells, and Gly204Ser CL-K1 was undetectable in serum from two
    patients. This node does not assume that all COLEC11 variants share the same biosynthetic defect.

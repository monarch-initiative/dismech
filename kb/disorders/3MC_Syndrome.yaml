- name: Mouse Colec11-deficient bone-marrow-derived osteoclast cultures
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: Bone-marrow-derived cells from wild-type, Colec11 single-knockout, Colec11/C3 double-knockout and Colec11/Cfb double-knockout mice were differentiated using M-CSF and RANKL. Recombinant human CL-11 (0.9 micrograms/mL) with calcium was supplied during double-knockout rescue experiments.
  publication: PMID:41774788
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  modeled_mechanisms:
  - target: Impaired Complement-Dependent Osteoclastogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: The experimental system distinguishes modest single-knockout effects from pronounced combined-knockout effects and tests recombinant-protein rescue directly.
    limitations: This is ex-vivo differentiation. TRAP-positive multinucleated-cell area and nuclei per osteoclast are differentiation readouts; neither direct bone-resorption function nor prevention of in-vivo vertebral pathology was demonstrated by these assays. Figure 6 includes few independent donor animals for double knockouts despite multiple image measurements.
    readouts:

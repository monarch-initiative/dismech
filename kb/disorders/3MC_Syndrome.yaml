name: 3MC Syndrome
creation_date: "2026-08-29T00:00:00Z"
description: >-
  3MC syndrome is a rare autosomal recessive developmental disorder that unifies
  four historically separate eponymous conditions — Mingarelli, Malpuech,
  Michels and Carnevale syndromes — under a single molecular etiology. It is
  caused by biallelic loss-of-function variants in genes encoding components of
  the lectin complement pathway: MASP1 (which encodes the MASP-1 and MASP-3
  serine protease isoforms) and the collectins COLEC11 (CL-K1) and COLEC10
  (CL-L1), whose protein products form heteromeric complexes. The cardinal
  presentation is a distinctive craniofacial gestalt — hypertelorism,
  blepharophimosis, blepharoptosis and highly arched eyebrows — accompanied in
  many patients by cleft lip and/or palate, postnatal growth deficiency,
  cognitive impairment and hearing loss, with craniosynostosis, radioulnar
  synostosis and genital or vesicorenal anomalies in a minority. A caudal
  (coccygeal) appendage is an uncommon but strongly suggestive clinical clue.
  The mechanism is developmental rather than immunological: CL-K1 acts as a
  secreted guidance cue (chemoattractant) for migrating neural crest cells, and
  the malformed structures are predominantly those derived from cranial neural
  crest. Although MASP-3 additionally serves as the maturase that converts
  pro-factor D to mature factor D in the alternative complement pathway,
  patients retain detectable mature factor D and clinically significant
  immunodeficiency is not a feature of the syndrome.
category: Mendelian
parents:
- hereditary disease
synonyms:
- 3MC syndrome
- Malpuech-Michels-Mingarelli-Carnevale syndrome
- Carnevale syndrome
- Malpuech facial clefting syndrome
- Michels syndrome
- Mingarelli syndrome
- oculo-skeletal-abdominal syndrome

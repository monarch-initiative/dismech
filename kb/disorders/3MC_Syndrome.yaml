    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Plasma levels of CL-L1 in the patient and her parents were within normal range, suggesting that
      this variant does not modify transcription or secretion.
    explanation: >-
      Measured plasma abundance was normal in the Cys270Serfs*33 family; abundance alone does not demonstrate
      every step of transcription or secretion.
  - reference: PMID:34740859

  - preferred_term: lectin complement pathway activation
    term:
      id: GO:0001867
      label: complement activation, lectin pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:28301481
    reference_title: COLEC10 is mutated in 3MC patients and regulates early craniofacial development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The protein products of COLEC11 and COLEC10, CL-K1 and CL-L1
      respectively, form heteromeric complexes.
    explanation: >-
      Establishes that the two collectin gene products act as a physical
      complex, which is why variants in either produce the same syndrome.
  - reference: PMID:28301481
    reference_title: COLEC10 is mutated in 3MC patients and regulates early craniofacial development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrate how mutations in COLEC10 (c.25C>T; p.Arg9Ter, c.226delA;
      p.Gly77Glufs*66 and c.528C>G p.Cys176Trp) impair the expression and/or
      secretion of CL-L1 highlighting their pathogenicity.
    explanation: >-
      Shows the loss-of-function mechanism operates at the level of expression
      and secretion of CL-L1.
  - reference: PMID:21258343
    reference_title: Mutations in lectin complement pathway genes COLEC11 and MASP1 cause 3MC syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This suggests that the missense substitution in these patients leads to
      cellular retention of the protein.
    explanation: >-
      Documents impaired secretion, rather than absent transcript, as the
      consequence of a pathogenic CL-K1 missense allele.
  - reference: PMID:25912189
    reference_title: Molecular basis of sugar recognition by collectin-K1 and the effects of mutations associated with 3MC syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Interestingly, none of the mutations prevent folding or oligomerization of
      recombinant fragments containing the mutations in vitro. Instead, they
      prevent Ca(2+) binding by the carbohydrate-recognition domains of CL-K1.
    explanation: >-
      Pins the loss-of-function to failed calcium binding in the
      carbohydrate-recognition domain rather than misfolding, which is the
      molecular reason the protein is not secreted.
  - reference: PMID:25912189
    reference_title: Molecular basis of sugar recognition by collectin-K1 and the effects of mutations associated with 3MC syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We propose that failure to bind Ca(2+) during biosynthesis leads to
      structural defects that prevent secretion of CL-K1, thus providing a
      molecular explanation of the genetic disorder.
    explanation: >-
      States the proposed causal chain from calcium-binding failure to secretion
      failure to disease.
  downstream:
  - target: Impaired Complement-Dependent Osteoclastogenesis
    causal_link_type: DIRECT
    description: >-
      CL-11 is required for osteoclast differentiation, acting together with
      complement. Loss of the collectin impairs osteoclast differentiation
      directly, and supplementing CL-11 restores it.
    evidence:
    - reference: PMID:41774788
      reference_title: Collectin-11 regulates osteoclastogenesis and bone maintenance via a complement-dependent mechanism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ex vivo osteoclast (OCL) differentiation from bone marrow-derived cells
        of these double-knockout mice was profoundly impaired but was
        substantially restored by CL-11 supplementation.
      explanation: >-
        The rescue by CL-11 supplementation establishes the dependence of
        osteoclast differentiation on the collectin.
  - target: Impaired Neural Crest Cell Guidance
    causal_link_type: DIRECT
    description: >-
      CL-K1 is the secreted guidance cue itself, so loss of the collectin
      directly removes the chemoattractant signal that migrating neural crest
      cells follow.
    evidence:
    - reference: PMID:21258343
      reference_title: Mutations in lectin complement pathway genes COLEC11 and MASP1 cause 3MC syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Finally, we show that CL-K1 serves as a guidance cue for neural crest
        cell migration.
      explanation: >-
        Directly links the collectin to neural crest guidance, the step
        immediately downstream of its loss.
- name: Loss of MASP-3 Serine Protease Activity
  biological_scale: MOLECULAR
  description: >-
    Biallelic MASP1 variants clustered in exon 12 — the single exon encoding the
    serine protease domain unique to the MASP-3 isoform — yield enzymatically
    inactive protein. MASP1 also encodes MASP-1, which shares the heavy chain
    but has a distinct protease domain, so the exon-12 clustering is what makes
    MASP-3 the relevant isoform for 3MC syndrome.
  genes:
  - preferred_term: MASP1
    term:
      id: hgnc:6901
      label: MASP1
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic germline MASP1 alleles, clustered in exon 12. Reported classes
      are nonsense, missense within the MASP-3 protease domain, and intragenic
      deletion.
  molecular_functions:
  - preferred_term: MASP-3 serine endopeptidase activity
    term:
      id: GO:0004252
      label: serine-type endopeptidase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:28794230
    reference_title: Analysis of Factor D Isoforms in Malpuech-Michels-Mingarelli-Carnevale Patients Highlights the Role of MASP-3 as a Maturase in the Alternative Pathway of Complement.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We characterized the naturally occurring 3MC-associated MASP-3 mutants and
      found that they all yielded enzymatically inactive proteins.
    explanation: >-
      Directly demonstrates that the 3MC-associated MASP1 alleles abolish MASP-3
      catalytic activity.
  downstream:
  - target: Impaired Neural Crest Cell Guidance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      MASP-3 loss produces the same craniofacial phenotype as collectin loss,
      and the collectins are MASP-binding partners, but the substrate through
      which MASP-3 acts on neural crest migration has not been established. One
      proposed route is processing of IGFBP-5 and consequent modulation of
      insulin-like growth factor availability during craniofacial development.
    evidence:
    - reference: PMID:21035106
      reference_title: MASP1 mutations in patients with facial, umbilical, coccygeal, and auditory findings of Carnevale, Malpuech, OSA, and Michels syndromes.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The two mutations occur in a MASP1 isoform that has been reported to
        process IGFBP-5, thereby playing a critical role in insulin growth factor
        availability during craniofacial and muscle development.
      explanation: >-
        Offers a candidate intermediate for the MASP-3 route to craniofacial
        malformation. Graded PARTIAL because the paper reports the IGFBP-5
        substrate relationship as prior knowledge about the isoform rather than
        demonstrating it operates in these patients.
    - reference: PMID:25912189
      reference_title: Molecular basis of sugar recognition by collectin-K1 and the effects of mutations associated with 3MC syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        It binds to carbohydrates on pathogens to activate the lectin pathway of
        complement and together with its associated serine protease MASP-3
        serves as a guidance cue for neural crest development.
      explanation: >-
        Places MASP-3 with CL-K1 in the same neural crest guidance function,
        which is why loss of either produces the same developmental phenotype.
  - target: Impaired Pro-Factor D Maturation
    causal_link_type: DIRECT
    description: >-
      MASP-3 is the maturase that converts pro-factor D to mature factor D, so
      loss of its catalytic activity directly compromises this conversion.
    evidence:
    - reference: PMID:28794230
      reference_title: Analysis of Factor D Isoforms in Malpuech-Michels-Mingarelli-Carnevale Patients Highlights the Role of MASP-3 as a Maturase in the Alternative Pathway of Complement.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Using MASP-3-depleted human serum, serum from 3MC patients, and
        Masp1/3-/- mice, we found that lack of enzymatically active MASP-3, or
        complete MASP-3 deficiency, compromises the conversion of pro-FD to FD.
      explanation: >-
        Establishes the direct enzymatic dependence of factor D maturation on
        MASP-3 activity.
- name: Impaired Neural Crest Cell Guidance
  biological_scale: CELLULAR
  description: >-
    Loss of the secreted collectin guidance cue disrupts the directed migration
    of neural crest cells during embryogenesis. This is the step that converts a
    complement-pathway molecular defect into a developmental one, and it
    explains why the malformed structures in 3MC syndrome are predominantly
    neural crest derivatives rather than immune tissues.
  cell_types:
  - preferred_term: migratory neural crest cell
    term:
      id: CL:0000333
      label: migratory neural crest cell
  biological_processes:
  - preferred_term: neural crest cell migration
    term:
      id: GO:0001755
      label: neural crest cell migration
    modifier: DECREASED
  evidence:
  - reference: PMID:35943032
    reference_title: "Expanding the phenotypic spectrum of COLEC10-Related 3MC syndrome: A glimpse into COLEC10-Related 3MC syndrome in the Ashkenazi Jewish population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Syndromic features seen in 3MC syndrome are thought to be due to
      disruption of the chemoattractant properties that influence neural crest
      cell migration.
    explanation: >-
      States the accepted mechanistic model linking collectin loss to the
      clinical features through neural crest migration.
  downstream:
  - target: Defective Cranial Neural Crest-Derived Craniofacial Morphogenesis
    causal_link_type: DIRECT
    description: >-
      Cranial neural crest cells that fail to migrate correctly do not populate
      the facial primordia and pharyngeal arches, so the skeletal and soft
      tissue structures they would have formed are malformed.
    evidence:
    - reference: PMID:28301481
      reference_title: COLEC10 is mutated in 3MC patients and regulates early craniofacial development.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The main features include facial dysmorphism, craniosynostosis and cleft
        lip/palate; skeletal structures derived from cranial neural crest cells
        (cNCC).
      explanation: >-
        Identifies the malformed structures as cranial neural crest derivatives,
        the tissue-level consequence of the migration defect.
- name: Defective Cranial Neural Crest-Derived Craniofacial Morphogenesis
  biological_scale: TISSUE
  description: >-
    Failure of cranial neural crest-derived tissue to form normally produces the
    craniofacial phenotype: the periorbital gestalt, orofacial clefting,
    premature suture fusion, and middle/external ear anomalies underlying the
    hearing loss. Collectin expression in murine embryonic craniofacial
    cartilage and in the palatal base membrane places the proteins at the right
    time and place for this role.
  biological_processes:
  - preferred_term: neural crest cell development
    term:
      id: GO:0014032
      label: neural crest cell development
    modifier: DECREASED
  evidence:
  - reference: PMID:21258343
    reference_title: Mutations in lectin complement pathway genes COLEC11 and MASP1 cause 3MC syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      CL-K1 is highly expressed in embryonic murine craniofacial cartilage,
      heart, bronchi, kidney and vertebral bodies.
    explanation: >-
      Places CL-K1 expression in the developing craniofacial tissues affected in
      the syndrome.
  - reference: PMID:28301481
    reference_title: COLEC10 is mutated in 3MC patients and regulates early craniofacial development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show COLEC10 is expressed in the base membrane of the palate during
      murine embryo development.
    explanation: >-
      Places CL-L1 expression at the palatal shelf, the structure whose failure
      of fusion produces cleft palate.
- name: Impaired Complement-Dependent Osteoclastogenesis
  biological_scale: CELLULAR
  description: >-
    CL-11 is required for osteoclast differentiation and acts in concert with
    complement to maintain bone. This is a second, non-neural-crest route to
    skeletal disease in 3MC syndrome, and it is complement-dependent in a way
    the craniofacial arm is not.

    The genetic architecture matters and is unusual: CL-11 deletion alone does
    not produce a skeletal phenotype in mice. Bone loss appears only when
    collectin deficiency is combined with loss of MASP-2, factor B or C3, so
    complement acts here as a modifier rather than as the primary lesion.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: osteoclast differentiation
    term:
      id: GO:0030316
      label: osteoclast differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:41774788
    reference_title: Collectin-11 regulates osteoclastogenesis and bone maintenance via a complement-dependent mechanism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      combined deficiencies of CL-11 with complement components MASP-2 (lectin
      pathway), complement factors B, or C3 (alternative pathway amplification)
      result in marked vertebral bone loss and spinal curvature by 12 wk of age
    explanation: >-
      Establishes that the skeletal phenotype requires combined collectin and
      complement deficiency, which is what makes complement a modifier here.
  - reference: PMID:41774788
    reference_title: Collectin-11 regulates osteoclastogenesis and bone maintenance via a complement-dependent mechanism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      CL-11 and the membrane attack complex (C5b-9) colocalized to OCLs and
      their precursors in normal bone from embryonic development through to
      adulthood.
    explanation: >-
      Places CL-11 and terminal complement together at the osteoclast lineage
      across development, supporting a direct role rather than a bystander
      association.
  notes: >-
    Curated as a distinct route to skeletal disease, separate from the neural
    crest arm. Do not merge the two: the craniofacial malformations follow from
    a migration-guidance defect during embryogenesis, whereas this node is a
    complement-dependent bone-remodelling defect that continues postnatally and
    requires a second complement hit to manifest.
- name: Impaired Pro-Factor D Maturation
  biological_scale: MOLECULAR
  description: >-
    In the MASP1/MASP-3-deficient form, conversion of pro-factor D to mature
    factor D in the alternative complement pathway is compromised. Notably this
    is a biochemical consequence that does not translate into clinical
    immunodeficiency: 3MC patients retain detectable mature factor D, indicating
    a MASP-3-independent maturation route, and recurrent infection is not a
    feature of the syndrome.
  biological_processes:
  - preferred_term: alternative complement pathway activation
    term:
      id: GO:0006957
      label: complement activation, alternative pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:28794230
    reference_title: Analysis of Factor D Isoforms in Malpuech-Michels-Mingarelli-Carnevale Patients Highlights the Role of MASP-3 as a Maturase in the Alternative Pathway of Complement.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      although 3MC patients predominantly contain pro-FD, they also contain
      detectable levels of mature FD
    explanation: >-
      Supports impaired but incomplete loss of factor D maturation in patients,
      which is why this node is a biochemical finding rather than a clinical
      immunodeficiency. Graded PARTIAL because it establishes residual mature
      factor D without measuring downstream alternative-pathway competence.
  - reference: PMID:27535802
    reference_title: "MASP-3 is the exclusive pro-factor D activator in resting blood: the lectin and the alternative complement pathways are fundamentally linked."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      For this study we evolved a specific MASP-3 inhibitor and unambiguously
      proved that activated MASP-3 is the exclusive pro-FD activator in resting
      blood, which demonstrates a fundamental link between the lectin and
      alternative pathways.
    explanation: >-
      Establishes MASP-3 as the sole physiological pro-factor D activator in
      resting blood, which is what makes this node a predicted consequence of
      MASP-3 loss.
  notes: >-
    Curated deliberately as a node with no *immunological* clinical consequence.
    Do not attach an immunodeficiency phenotype to it without evidence of
    recurrent infection in 3MC patients; the cited work shows residual mature
    factor D.

    This is not the same as saying the complement axis is inert. In mice,
    combined loss of CL-11 with factor B or C3 produces vertebral bone loss that
    neither lesion causes alone (PMID:41774788), so alternative-pathway
    components act as modifiers of the skeletal phenotype. See Impaired
    Complement-Dependent Osteoclastogenesis. What the human literature does not
    support is an infectious-susceptibility phenotype.

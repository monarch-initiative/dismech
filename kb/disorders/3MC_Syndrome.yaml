    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      CL-K1 depletion disrupts neural crest distribution in zebrafish, and recombinant protein attracts
      neural crest cells in explants. The responding receptors and intervening signaling steps are unresolved.

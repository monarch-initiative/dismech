- name: Reduced Extracellular CL-L1 Availability
  biological_scale: MOLECULAR
  description: >-
    Some biallelic COLEC10 variants impair CL-L1 expression or secretion. Arg9Ter and Gly77Glufs*66 constructs
    yield no detectable protein, whereas Cys176Trp accumulates intracellularly with severely reduced secretion.
    This route is distinct from the Cys270Serfs*33 allele, which has normal measured plasma levels but
    impaired chemoattractant activity.
  genes:
  - preferred_term: COLEC10
    term:
      id: hgnc:2220
      label: COLEC10
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic COLEC10 variants affecting protein expression or secretion; compound heterozygous genotypes
      occur.
  evidence:
  - reference: PMID:28301481
    reference_title: COLEC10 is mutated in 3MC patients and regulates early craniofacial development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      We demonstrate how mutations in COLEC10 (c.25C>T; p.Arg9Ter, c.226delA; p.Gly77Glufs*66 and c.528C>G
      p.Cys176Trp) impair the expression and/or secretion of CL-L1 highlighting their pathogenicity.
    explanation: >-
      The tested truncating alleles eliminate detectable expressed protein; Cys176Trp permits intracellular
      expression but markedly reduces secretion.
  downstream:
  - target: Impaired Neural Crest Cell Guidance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced CL-L1 availability is proposed to disrupt craniofacial cell guidance. CL-L1 attracts HeLa
      cells and is expressed in developing palatal tissue, but a CL-L1-specific neural crest receptor
      or signaling route was not established.
    evidence:
    - reference: PMID:28301481
      reference_title: COLEC10 is mutated in 3MC patients and regulates early craniofacial development.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        We propose here that the role of CL-L1 and CL-K1 lies in regulating cell migration via cell attraction
        in 3MC syndrome.
      explanation: >-
        The extension from HeLa-cell chemoattraction to neural crest guidance is the authors' mechanistic
        proposal.
      directness: INDIRECT
- name: Impaired CL-L1 Chemoattractant Activity
  biological_scale: MOLECULAR
  description: >-
    The homozygous COLEC10 c.807_810delCTGT (p.Cys270Serfs*33) variant extends the protein and removes
    a conserved cysteine. Plasma CL-L1 levels were normal in the reported family, while mutant protein
    induced less HeLa-cell migration than wild type. Loss of extracellular function can therefore occur
    without reduced measured abundance.

  - reference: PMID:21035106
    reference_title: MASP1 mutations in patients with facial, umbilical, coccygeal, and auditory findings of Carnevale, Malpuech, OSA, and Michels syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In one family, whole exome sequencing revealed a missense mutation, MASP1
      c.2059G>A (p.G687R), that cosegregated with the phenotype.
    explanation: >-
      Establishes MASP1 as a 3MC syndrome disease gene through cosegregation in
      a consanguineous family.
- name: 3MC2
  display_name: 3MC syndrome 2 (COLEC11/CL-K1)
  description: >-
    Caused by biallelic COLEC11 variants. Missense substitutions can cause
    cellular retention of CL-K1 so that no protein is secreted, a
    loss-of-secretion mechanism rather than simple absence of transcript.
  subtype_term:
    preferred_term: 3MC syndrome 2

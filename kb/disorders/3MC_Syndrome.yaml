    description: Collectin-11 loss impairs osteoclast differentiation in experimental cells, with species- and complement-background-dependent effect sizes. Recombinant CL-11 partially rescues differentiation; the intervening signaling steps and their relevance to skeletal disease in 3MC patients remain incompletely established.

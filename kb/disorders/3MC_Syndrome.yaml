- name: Impaired Complement-Dependent Osteoclastogenesis
  biological_scale: CELLULAR
  description: Experimental loss of collectin-11 impairs osteoclast differentiation in mouse bone-marrow cultures and engineered healthy-donor human iPSC-derived cells. The effect is modest after isolated mouse Colec11 deletion and pronounced in Colec11/C3 or Colec11/Cfb double-knockout cultures; isolated human COLEC11 deletion already has a marked effect. Recombinant CL-11 partially rescues differentiation, and complement-convertase inhibition impairs differentiation in human cells. These results identify a candidate mechanism relevant to 3MC, without establishing osteoclast dysfunction as the cause of skeletal malformations in affected patients.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: osteoclast differentiation
    term:
      id: GO:0030316
      label: osteoclast differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:41774788
    reference_title: Collectin-11 regulates osteoclastogenesis and bone maintenance via a complement-dependent mechanism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: CL-11 deletion resulted in marked impairment of OCL differentiation, which was partially rescued by supplementation of the differentiation medium with recombinant CL-11.
    explanation: Engineered healthy-donor human iPSC-derived cells establish a cellular requirement and partial rescue, not a patient skeletal phenotype.
  - reference: PMID:41774788
    reference_title: Collectin-11 regulates osteoclastogenesis and bone maintenance via a complement-dependent mechanism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: By comparison, OCLs derived from Colec11−/− SKO mice exhibited only modest reductions in OCL number and size
    explanation: Single-gene mouse deficiency has a mild cellular effect despite its low frequency of overt spinal curvature.
  - reference: PMID:41774788
    reference_title: Collectin-11 regulates osteoclastogenesis and bone maintenance via a complement-dependent mechanism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: In contrast, Colec11−/−/C3−/− BMSCs exhibited pronounced reduction in multinucleated OCL formation, quantified by the microscopic area occupied by such cells
    explanation: The cellular readout is TRAP-positive multinucleated osteoclast formation/area, not a direct bone-resorption assay.
  - reference: PMID:41774788
    reference_title: Collectin-11 regulates osteoclastogenesis and bone maintenance via a complement-dependent mechanism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: In addition, treatment with Mirococept—a truncated complement receptor-1–based inhibitor of C3 and C5 convertases (23)—significantly reduced OCL formation, demonstrating that normal human OCL differentiation is complement-dependent.
    explanation: Pharmacologic C3/C5 convertase inhibition supports complement involvement; it is not a C3 gene-deletion experiment or proof that a specific linear complement sequence is necessary.
  notes: Terminal-complement deposition accompanies the cellular phenotype, but colocalization does not by itself demonstrate mediation. Recombinant CL-11 partly restores MAC deposition even in C3-deficient cultures; the authors propose a C3-bypass route rather than establish obligatory C3 dependence or direct C5 cleavage. PMX53 inhibition of C5aR1 had no significant effect under the tested non-inflammatory culture conditions. Postnatal vertebral pathology in combined-knockout mice is associated with the cellular findings; it does not isolate impaired osteoclast differentiation as the mediator of bone loss, and it is not equivalent to the developmental craniofacial abnormalities of human 3MC.
- name: Impaired Pro-Factor D Maturation
  biological_scale: MOLECULAR
  description: >-
    MASP-3 deficiency compromises conversion of pro-factor D to mature factor D. Tested patient samples
    predominantly contain pro-factor D but retain detectable mature factor D, consistent with an additional
    maturation route. Resting-plasma inhibition experiments establish MASP-3 dependence under those assay
    conditions; serum coagulation and patient measurements need separate interpretation.
  biological_processes:
  - preferred_term: protein maturation
    term:
      id: GO:0051604
      label: protein maturation
    modifier: DECREASED
  evidence:
  - reference: PMID:28794230
    reference_title: Analysis of Factor D Isoforms in Malpuech-Michels-Mingarelli-Carnevale Patients Highlights the Role of MASP-3 as a Maturase in the Alternative Pathway of Complement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      although 3MC patients predominantly contain pro-FD, they also contain
      detectable levels of mature FD
    explanation: >-
      Patient samples demonstrate incomplete maturation. Residual mature factor D does not by itself establish
      normal alternative-pathway activity or absence of clinical infection risk.
    quote_role: PRIMARY_RESULT
  - reference: PMID:27535802
    reference_title: "MASP-3 is the exclusive pro-factor D activator in resting blood: the lectin and the alternative complement pathways are fundamentally linked."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      For this study we evolved a specific MASP-3 inhibitor and unambiguously
      proved that activated MASP-3 is the exclusive pro-FD activator in resting
      blood, which demonstrates a fundamental link between the lectin and
      alternative pathways.
    explanation: >-
      Selective inhibitor experiments in resting human plasma establish the role of activated MASP-3 under
      the tested conditions. The paper distinguishes this from coagulated serum, where other proteases
      may contribute.
    quote_role: PRIMARY_RESULT
  notes: >-
    This is a biochemical consequence. No direct edge to the congenital craniofacial phenotype or to a
    clinical immunodeficiency is established by these experiments.

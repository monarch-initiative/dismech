- name: Human CRISPR COLEC11-knockout KOLF2 iPSC-derived osteoclasts
  experimental_model_type: IPSC_DERIVED_MODEL
  description: Healthy-donor KOLF2 iPSCs and paired CRISPR-edited COLEC11-deficient clones were differentiated through myeloid precursors to osteoclasts with M-CSF and RANKL. Recombinant human CL-11 with calcium tested rescue; Mirococept tested pharmacologic complement-convertase inhibition.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:41774788
  modeled_mechanisms:
  - target: Impaired Complement-Dependent Osteoclastogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Isolated COLEC11 deletion markedly reduces osteoclast differentiation in this human cellular system, and recombinant CL-11 partly restores it. Mirococept separately inhibits C3/C5 convertases and reduces osteoclast formation.
    limitations: Engineered healthy-donor cells are not 3MC patient-derived cells. Mirococept treatment is distinct from genetic deletion of C3 or another complement component; these interventions do not prove an obligatory linear C3-to-MAC route. Three independent differentiation experiments were reported, without a patient clinical or in-vivo bone endpoint.
    readouts:
    - name: TRAP-positive multinucleated osteoclast area after COLEC11 deletion
      target: Impaired Complement-Dependent Osteoclastogenesis
      direction: DECREASED
      interpretation: Deletion reduces differentiation relative to parental wild-type cells.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we define a new gene, COLEC10, also mutated in 3MC families and
      present novel mutations in COLEC11 and MASP1/3 genes in a further five
      families.
    explanation: >-
      Establishes COLEC10 as the third 3MC syndrome disease gene.
pathophysiology:
- name: Loss of Secreted Collectin CL-K1/CL-L1 Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic COLEC11 or COLEC10 variants abolish the function of the secreted
    collectins CL-K1 and CL-L1, which normally assemble into heteromeric
    complexes. Pathogenic missense alleles act not only by loss of protein but
    by impairing secretion — CL-K1 bearing the Gly204Ser substitution is
    retained intracellularly and is undetectable in patient serum.
  genes:
  - preferred_term: COLEC11
    term:
      id: hgnc:17213
      label: COLEC11
  - preferred_term: COLEC10
    term:
      id: hgnc:2220
      label: COLEC10
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic germline COLEC11 or COLEC10 alleles. Reported classes include
      missense substitutions that block secretion, frameshift and nonsense
      alleles, a multi-exon deletion, and at least one allele that is secreted
      normally but chemoattractively inert.
  molecular_functions:
  - preferred_term: calcium ion binding by the carbohydrate-recognition domain
    term:
      id: GO:0005509
      label: calcium ion binding
    modifier: DECREASED
  - preferred_term: carbohydrate binding
    term:
      id: GO:0030246
      label: carbohydrate binding
    modifier: DECREASED

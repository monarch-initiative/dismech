differential_diagnoses:
- name: Branchio-oto-renal spectrum
  description: >-
    Branchiootorenal spectrum disorder can overlap through hearing loss and urinary malformations. Its
    branchial cleft and ear findings, autosomal dominant inheritance and EYA1/SIX1 molecular diagnosis
    help distinguish it from 3MC.
  evidence:
  - reference: PMID:20301554
    reference_title: Branchiootorenal Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Branchiootorenal spectrum disorder (BORSD) is characterized by second branchial arch anomalies (e.g.,
      preauricular pits and branchial cleft sinuses or cysts) and malformations of the outer, middle,
      and inner ear associated with conductive, sensorineural, and/or mixed hearing impairment.
    explanation: >-
      Describes the overlapping and distinguishing phenotype of this differential, not 3MC.
  - reference: PMID:20301554
    reference_title: Branchiootorenal Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The molecular diagnosis of BORSD is established in a proband with suggestive findings and a heterozygous
      pathogenic variant in either EYA1 or SIX1 identified by molecular genetic testing.
    explanation: >-
      Identifies the genes of this alternative diagnosis.
  - reference: PMID:20301554
    reference_title: Branchiootorenal Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      BORSD is inherited in an autosomal dominant manner.
    explanation: >-
      Contrasts the inheritance pattern with autosomal recessive 3MC.
- name: Blepharophimosis-ptosis-epicanthus inversus syndrome
  description: >-
    FOXL2-related blepharophimosis, ptosis and epicanthus inversus syndrome overlaps strongly in eyelid
    morphology. Its almost always autosomal dominant inheritance and molecular cause distinguish it from
    3MC; primary ovarian insufficiency can occur in BPES type I.
  evidence:
  - reference: PMID:20301614
    reference_title: "Blepharophimosis, Ptosis, and Epicanthus Inversus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      BPES type I includes the four major features and primary ovarian insufficiency; BPES type II includes
      only the four major features.
    explanation: >-
      Describes BPES subtype context, without asserting that all other congenital anomalies are categorically
      absent.
  - reference: PMID:20301614
    reference_title: "Blepharophimosis, Ptosis, and Epicanthus Inversus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of BPES is established in a proband with suggestive findings and a heterozygous pathogenic
      variant in FOXL2 or its regulatory domain identified by molecular genetic testing.
    explanation: >-
      Supports FOXL2 as the alternative molecular diagnosis.
  - reference: PMID:20301614
    reference_title: "Blepharophimosis, Ptosis, and Epicanthus Inversus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      BPES is almost always inherited in an autosomal dominant manner.
    explanation: >-
      Provides the inheritance distinction.
diagnosis:
- name: Molecular diagnosis by sequencing of MASP1, COLEC11 and COLEC10
  description: >-
    Known-gene molecular confirmation identifies biallelic pathogenic variants in MASP1, COLEC11 or COLEC10, interpreted
    with the clinical phenotype. Confirm gene coverage and deletion detection when choosing or interpreting
    a sequencing assay: a 2021 case used a clinical exome panel that omitted COLEC10, and a MASP1 intragenic
    deletion in another case required careful visual review of exome data. These are documented historical
    assay limitations, not statements that all current panels have the same gaps. The likely Ashkenazi
    Jewish COLEC10 founder allele is relevant to variant interpretation, but a negative result for one
    allele does not exclude 3MC.
  evidence:
  - reference: PMID:35943032
    reference_title: "Expanding the phenotypic spectrum of COLEC10-Related 3MC syndrome: A glimpse into COLEC10-Related 3MC syndrome in the Ashkenazi Jewish population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3MC syndrome should be in the differential diagnosis for individuals with
      short stature, radioulnar synostosis, cleft lip and cleft palate.
    explanation: >-
      States the clinical trigger for pursuing a molecular diagnosis. Graded
      against the "when to suspect" half of this entry only; the confirmatory
      sequencing claim is evidenced separately below.
    quote_role: PRIMARY_RESULT
  - reference: PMID:34740859
    reference_title: A novel COLEC10 mutation in a child with 3MC syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initial genetic analysis was based on clinical exome sequencing, where
      only MASP1 and COLEC11 genes are present, without evidence of pathogenic
      variants.
    explanation: >-
      Documents a false-negative caused by a clinical exome panel that omits
      COLEC10, which is why panel gene content has to be checked before a
      negative result is accepted.
    quote_role: PRIMARY_RESULT
  - reference: PMID:29407414
    reference_title: Biallelic intragenic deletion in MASP1 in an adult female with 3MC syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As the homozygous deletion in our patient was only found by thorough and
      visual evaluation of the whole exome sequencing data, such deletions might
      escape detection in some routine diagnostic workflows and might explain a
      few of the so far molecularly unconfirmed cases of 3MC syndrome.
    explanation: >-
      Documents the second false-negative route, intragenic deletions missed by
      routine variant-calling, and connects it to unsolved cases.
    quote_role: PRIMARY_RESULT
  - reference: PMID:34636477
    reference_title: Whole-exome sequencing identified first homozygous frameshift variant in the COLEC10 gene in an Iranian patient causing 3MC syndrome type 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We confirmed the homozygous state for this variant in the proband and aborted fetus, as well as
      the heterozygote state in the parents by Sanger sequencing.
    explanation: >-
      Whole-exome sequencing identified the COLEC10 variant, subsequently confirmed with family segregation
      testing.
notes: >-
  The gene-specific forms are represented as subtypes of a shared developmental syndrome, with variant-specific
  molecular routes retained in the graph. Neural crest guidance is a model-supported explanation for craniofacial
  findings; direct complement dependence and the intervening developmental signals are unresolved. Factor
  D maturation is a separate biochemical consequence, and the osteoclast branch is experimentally supported
  but has not been established as the cause of human 3MC skeletal abnormalities. Clinical cohort counts
  and historical literature summaries describe their stated samples; they are not population penetrance
  estimates.
biochemical:
- name: Predominant pro-factor D with residual mature factor D
  presence: Predominant pro-factor D with detectable mature factor D
  context: MASP1/MASP-3 deficiency
  notes: >-
    Research isoelectric-focusing assays found impaired factor D maturation in patient samples. This is
    a mechanistic readout, not a validated standalone diagnostic test for all 3MC forms.
  evidence:
  - reference: PMID:28794230
    reference_title: Analysis of Factor D Isoforms in Malpuech-Michels-Mingarelli-Carnevale Patients Highlights the Role of MASP-3 as a Maturase in the Alternative Pathway of Complement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      although 3MC patients predominantly contain pro-FD, they also contain
      detectable levels of mature FD
    explanation: >-
      Patient samples demonstrate incomplete maturation. Residual mature factor D does not by itself establish
      normal alternative-pathway activity or absence of clinical infection risk.
    quote_role: PRIMARY_RESULT
discussions:
- discussion_id: gap_3mc_molecularly_unconfirmed_cases
  prompt: >-
    Which additional genetic causes or undetected variants account for clinically diagnosed 3MC cases
    without molecular confirmation in MASP1, COLEC11 or COLEC10?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    The 2017 COLEC10 discovery study reported that over 60% of its selected 3MC cohort remained without
    molecular confirmation after assessing the three known genes. The authors proposed additional loci.
    This historical cohort fraction is not a current diagnostic-yield estimate, and it does not by itself
    distinguish new loci from missed variants or clinical phenocopies.
  evidence:
  - reference: PMID:28301481
    reference_title: COLEC10 is mutated in 3MC patients and regulates early craniofacial development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Therefore, over 60% of our 3MC cohort is still without molecular
      confirmation of disease and that at least one further gene remains to be identified.
    explanation: >-
      The discovery study reports its remaining molecularly unconfirmed cohort and interprets it as
      evidence for additional loci; that interpretation is a hypothesis rather than proof of a new gene.

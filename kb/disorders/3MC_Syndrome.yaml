name: 3MC Syndrome
creation_date: "2026-08-29T00:00:00Z"
description: >-
  3MC syndrome is a rare autosomal recessive developmental disorder encompassing the historically named
  Mingarelli, Malpuech, Michels and Carnevale syndromes. Biallelic pathogenic variants in MASP1, COLEC11
  or COLEC10 disrupt MASP-3 or the proteins CL-K1 and CL-L1. Characteristic findings include hypertelorism,
  blepharophimosis, ptosis and highly arched eyebrows, with variable cleft lip or palate, hearing loss,
  growth deficiency, developmental or cognitive impairment, and skeletal, genital or urinary malformations.
  A caudal appendage can be a diagnostic clue. Experimental evidence implicates disturbed neural crest
  guidance in craniofacial development, but the intervening signals and the role of complement activation
  remain incompletely resolved. MASP-3 deficiency also impairs pro-factor D maturation, with residual
  mature factor D detected in patients. Recent osteoclast experiments identify a separate candidate role
  in bone maintenance whose contribution to human 3MC skeletal disease is not established.
category: Mendelian
parents:
- hereditary disease
synonyms:
- 3MC syndrome
- Malpuech-Michels-Mingarelli-Carnevale syndrome
- Carnevale syndrome
- Malpuech facial clefting syndrome
- Michels syndrome
- Mingarelli syndrome
- oculo-skeletal-abdominal syndrome

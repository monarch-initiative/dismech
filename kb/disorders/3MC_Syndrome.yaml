        supports: SUPPORT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: CL-11 deletion resulted in marked impairment of OCL differentiation, which was partially rescued by supplementation of the differentiation medium with recombinant CL-11.

    - name: Osteoclast formation during Mirococept treatment
      target: Impaired Complement-Dependent Osteoclastogenesis
      direction: DECREASED
      interpretation: Complement-convertase inhibition supports a role for complement in normal differentiation independently of the engineered COLEC11 deletion.
      evidence:

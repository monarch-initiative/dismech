animal_models:
- name: colec11 zebrafish morphant
  species: Zebrafish
  genotype: colec11 antisense morpholino knockdown (ATG and splice-site)
  publication: PMID:21258343
  description: >-
    Morpholino knockdown of colec11 in zebrafish embryos, rescued by
    co-injection of full-length COLEC11 mRNA.
  modeled_mechanisms:
  - target: Defective Cranial Neural Crest-Derived Craniofacial Morphogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Knockdown reproduces severe craniofacial cartilage malformation, the
      tissue-level phenotype of the human syndrome.
    limitations: >-
      Morpholino knockdown is transient and dose-dependent rather than a
      germline null, and zebrafish craniofacial cartilage does not map
      one-to-one onto the human facial skeleton. The report notes high mortality
      at higher doses, requiring lower doses for cartilage staining.
    readouts:
    - name: Alcian blue-stained craniofacial cartilage morphology
      target: Defective Cranial Neural Crest-Derived Craniofacial Morphogenesis
      direction: ALTERED
      interpretation: >-
        Reduced mandibular length and malformed anterior neurocranium, the
        structural correlate of the human craniofacial phenotype.
      evidence:
      - reference: PMID:21258343
        reference_title: Mutations in lectin complement pathway genes COLEC11 and MASP1 cause 3MC syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Striking differences in the craniofacial skeleton were observed
          compared with uninjected/standard morpholino injected embryos, such as
          reduced mandibular length (e.g. shortened Meckel and palatoquadrate
          cartilages), malformation of the anterior neurocranium with shortening
          of the trabeculae and the ethmoid plate, shortening and abnormal
          angulation of the ceratohyal cartilage
        explanation: >-
          Reports the specific craniofacial cartilage measurements behind this
          readout.
    evidence:
    - reference: PMID:21258343
      reference_title: Mutations in lectin complement pathway genes COLEC11 and MASP1 cause 3MC syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Zebrafish morphants for either gene develop pigmentary defects and
        severe craniofacial abnormalities.
      explanation: >-
        Supports treating the morphant as informative for the craniofacial
        morphogenesis node.
- name: Masp1/3 knockout mouse
  species: Mouse
  genotype: Masp1/3-/-
  publication: PMID:28794230
  description: >-
    Mouse lacking both MASP-1 and MASP-3, used to establish the maturase role of
    MASP-3 in pro-factor D conversion.
  modeled_mechanisms:
  - target: Impaired Pro-Factor D Maturation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the failure of pro-factor D conversion seen in patient serum.
    limitations: >-
      The knockout removes both MASP-1 and MASP-3, whereas human 3MC alleles
      cluster in the MASP-3-specific exon, so the model is broader than the
      human genotype. It models the biochemical node only, not the craniofacial
      phenotype.
    evidence:
    - reference: PMID:28794230
      reference_title: Analysis of Factor D Isoforms in Malpuech-Michels-Mingarelli-Carnevale Patients Highlights the Role of MASP-3 as a Maturase in the Alternative Pathway of Complement.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This view was challenged when it was shown that mice lacking
        mannose-binding lectin (MBL)-associated serine protease-1 (MASP-1) and
        MASP-3 contain zymogenic FD (pro-FD), and it is becoming evident that
        MASP-3 is implicated in pro-FD maturation.
      explanation: >-
        Establishes the mouse knockout as the model that first identified the
        pro-factor D maturation defect.
differential_diagnoses:
- name: Branchio-oto-renal spectrum
  description: >-
    Also presents with hearing loss and branchial/ear anomalies, but is
    autosomal dominant, EYA1/SIX-related, and features renal malformation and
    branchial fistulae rather than the 3MC periorbital gestalt, clefting and
    caudal appendage.
- name: Blepharophimosis-ptosis-epicanthus inversus syndrome
  description: >-
    Shares the periorbital gestalt (blepharophimosis, ptosis, epicanthus
    inversus) but is FOXL2-related, autosomal dominant, and lacks orofacial
    clefting, growth deficiency and the skeletal synostoses.
diagnosis:
- name: Molecular diagnosis by sequencing of MASP1, COLEC11 and COLEC10
  description: >-
    Diagnosis is confirmed by identifying biallelic pathogenic variants in one
    of the three genes, typically via exome sequencing or a targeted panel. In
    individuals of Ashkenazi Jewish ancestry, targeted testing for the COLEC10
    c.311G>T founder allele is warranted.
  evidence:
  - reference: PMID:35943032
    reference_title: "Expanding the phenotypic spectrum of COLEC10-Related 3MC syndrome: A glimpse into COLEC10-Related 3MC syndrome in the Ashkenazi Jewish population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3MC syndrome should be in the differential diagnosis for individuals with
      short stature, radioulnar synostosis, cleft lip and cleft palate.
    explanation: >-
      States the clinical trigger for pursuing a molecular diagnosis.
notes: >-
  Curated as a single Disease entry rather than three per-gene entries. The
  three genetic forms are clinically indistinguishable and their protein
  products act in one pathway — CL-K1 and CL-L1 form heteromeric complexes, and
  MASP-3 is the collectin-associated protease — so one pathograph covers all
  three. Per-gene detail is carried in has_subtypes and genetic.

  The entry deliberately keeps the alternative-complement-pathway consequence
  (impaired pro-factor D maturation) as a terminal node with no clinical
  sequela. This is the most likely place for a future curator to overreach: the
  gene names invite an immunodeficiency narrative that the clinical literature
  does not support.

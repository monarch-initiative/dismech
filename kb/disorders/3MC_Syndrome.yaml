genetic:
- name: MASP1
  gene_term:
    preferred_term: MASP1
    term:
      id: hgnc:6901
      label: MASP1
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic MASP1 variants cause 3MC syndrome 1. Exon-12 missense changes and deletions implicate the
    MASP-3-specific protease domain, while early truncating alleles such as p.Trp290Ter affect shared
    sequence. MASP-3 loss is central, but other isoforms may also be affected by some alleles.
  evidence:
  - reference: PMID:21035106
    reference_title: MASP1 mutations in patients with facial, umbilical, coccygeal, and auditory findings of Carnevale, Malpuech, OSA, and Michels syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the second family, Sanger sequencing of MASP1 revealed a nonsense
      mutation, MASP1 c.870G>A (p.W290X), that also cosegregated with the
      phenotype.
    explanation: >-
      A cosegregating nonsense allele supports loss of function as the disease
      mechanism.
    quote_role: PRIMARY_RESULT
  - reference: PMID:29407414
    reference_title: Biallelic intragenic deletion in MASP1 in an adult female with 3MC syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In MASP1, either truncating mutations or missense variants in exon 12
      encoding the C-terminal serine protease domain specific for isoform MASP-3
      are causative.
    explanation: >-
      The source distinguishes nonsense variants from missense variants in the MASP-3-specific exon; it
      does not place every nonsense variant in exon 12.
    quote_role: BACKGROUND
  - reference: PMID:29407414
    reference_title: Biallelic intragenic deletion in MASP1 in an adult female with 3MC syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By trio exome sequencing we now identified a novel, homozygous 2kb
      deletion, partially affecting exon 12 in an adult female with the typical
      facial gestalt of 3MC syndrome and hearing loss, but without the main
      feature cleft lip/palate, and without intellectual disability, or short
      stature.
    explanation: >-
      Documents an intragenic deletion allele class and, separately, marked
      variable expressivity - a patient with the facial gestalt but none of

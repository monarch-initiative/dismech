    snippet: "Finally, we find that patient cells have elevated levels of PPP1R15B mRNA and protein, suggesting activation of a compensatory program aimed at restoring cellular homeostasis which is ineffective due to PPP1R15B alteration."
    explanation: >-
      Documents the ineffective compensatory upregulation of the defective
      protein in patient cells.
  - reference: PMID:27640355
    reference_title: "Infantile Cirrhosis, Growth Impairment, and Neurodevelopmental Anomalies Associated with Deficiency of PPP1R15B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified compound heterozygous mutations \nin PPP1R15B resulting in increased levels of phosphorylated eukaryotic \ntranslation initiation factor 2α."
    explanation: >-
      A third family with compound heterozygous PPP1R15B variants shows the same
      biochemical consequence of raised phospho-eIF2-alpha.

- name: Chronic Attenuation of Cap-Dependent Translation Initiation
  description: >-
    Phosphorylated eIF2-alpha sequesters eIF2B and blocks regeneration of the
    eIF2-GTP/Met-tRNA ternary complex, so a sustained rise in basal
    phospho-eIF2-alpha chronically dampens global cap-dependent translation
    initiation. Because this is the constitutive (unstressed) arm of the
    integrated stress response rather than a transient stress response, the
    burden falls on tissues with high protein-synthetic and secretory demand
    and on rapidly proliferating progenitors.
  role: intermediate
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: regulation of translational initiation by eIF2 alpha phosphorylation
    term:
      id: GO:0010998
      label: regulation of translational initiation by eIF2 alpha phosphorylation
    modifier: INCREASED
  - preferred_term: translational initiation
    term:
      id: GO:0006413
      label: translational initiation
    modifier: DECREASED
  downstream:
  - target: Pancreatic Beta-Cell Secretory Failure and Apoptosis
    causal_link_type: DIRECT
    description: >-
      Beta cells are among the tissues most sensitive to translational and
      ER-stress imbalance because of their proinsulin biosynthetic load.
    evidence:
    - reference: PMID:26159176
      reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "PPP1R15B deficiency sensitizes β-cells to FFA- and ER stress–induced apoptosis and activates the intrinsic pathway of apoptosis via DP5, PUMA, and Bim-S."
      explanation: >-
        Connects loss of PPP1R15B function to beta-cell apoptosis, supporting
        this edge.
  - target: Impaired Brain Growth and Neurodevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Attributed to the translational demands of proliferating neural
      progenitors; the intervening steps between reduced translation and reduced
      brain growth are not established in human tissue.
    evidence:
    - reference: PMID:26307080
      reference_title: "Homozygous mutation in the eukaryotic translation initiation factor 2alpha phosphatase gene, PPP1R15B, is associated with severe microcephaly, short stature and intellectual disability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "PPP1R15B now joins the expanding list of translation-associated proteins which when \nmutated cause rare genetic diseases."
      explanation: >-
        Places the disorder in the class of translation-associated genes whose
        disruption causes neurodevelopmental disease, supporting the link from
        translational attenuation to impaired brain growth.
  - target: Hepatocellular Injury and Infantile Liver Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reported only in the compound heterozygous family; hepatocytes are another
      high-secretory cell type, but the route from raised phospho-eIF2-alpha to
      cirrhosis is not established and the allele dependence is unexplained.
    evidence:
    - reference: PMID:27640355
      reference_title: "Infantile Cirrhosis, Growth Impairment, and Neurodevelopmental Anomalies Associated with Deficiency of PPP1R15B."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "identified compound heterozygous mutations \nin PPP1R15B resulting in increased levels of phosphorylated eukaryotic \ntranslation initiation factor 2α."
      explanation: >-
        Links the same biochemical lesion (raised phospho-eIF2-alpha) to the
        family in which liver disease occurred. Marked PARTIAL because the paper
        establishes the association, not the intervening mechanism.
  - target: Impaired Somatic Growth
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Growth failure is cell-intrinsic rather than endocrine-mediated, but the
      steps from reduced translation to reduced stature are not delineated.
    evidence:
    - reference: PMID:26159176
      reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "these results are in keeping with bone dysplasia without marked disturbance of calcium metabolism, with severe growth retardation unrelated to pituitary or thyroid dysfunction."
      explanation: >-
        Excludes endocrine mediation of the growth failure, supporting a
        cell-intrinsic translational route for this edge.
  evidence:
  - reference: PMID:26307080
    reference_title: "Homozygous mutation in the eukaryotic translation initiation factor 2alpha phosphatase gene, PPP1R15B, is associated with severe microcephaly, short stature and intellectual disability."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "phosphorylated eIF2α attenuates protein \ntranslation."
    explanation: >-
      States the core mechanistic principle that phospho-eIF2-alpha attenuates
      translation, linking the phosphatase defect to reduced translation. This
      is background exposition in the paper's introduction, not primary data.

- name: Pancreatic Beta-Cell Secretory Failure and Apoptosis
  description: >-
    Pancreatic beta cells are exquisitely sensitive to translational and
    ER-stress imbalance because of their proinsulin biosynthetic load.
    PPP1R15B deficiency reduces cellular insulin content, blunts
    glucose-stimulated insulin secretion, and sensitizes beta cells to
    apoptosis both basally and under ER stress or free-fatty-acid exposure,
    acting through the intrinsic (mitochondrial) pathway via the BH3-only
    proteins DP5, PUMA and Bim. Important evidence caveat: this node rests on
    siRNA knockdown in rat INS-1E and primary rat beta cells, not on the R658C
    hypomorph and not on human tissue — no human beta-cell histopathology is
    available. The human data are in fact only partly concordant: affected
    individuals retain detectable glucagon-stimulated C-peptide and initially
    modest insulin requirements, so a secretory defect is better supported than
    outright loss of beta-cell mass.
  role: intermediate
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: insulin secretion involved in cellular response to glucose stimulus
    term:
      id: GO:0035773
      label: insulin secretion involved in cellular response to glucose stimulus
    modifier: DECREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  downstream:
  - target: Impaired Glucose Metabolism and Young-Onset Diabetes
    causal_link_type: DIRECT
    description: >-
      Loss of glucose-stimulated insulin secretion, compounded by beta-cell
      apoptosis, produces the clinical diabetes.
    evidence:
    - reference: PMID:26159176
      reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Glucose-stimulated insulin secretion is blunted by PPP1R15B deficiency in β-cells."
      explanation: >-
        Establishes the secretory failure that directly produces impaired
        glucose metabolism.
  evidence:
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PPP1R15B deficiency sensitizes β-cells to FFA- and ER stress–induced apoptosis and activates the intrinsic pathway of apoptosis via DP5, PUMA, and Bim-S."
    explanation: >-
      Identifies the apoptotic pathway by which PPP1R15B deficiency kills beta
      cells.
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Glucose-stimulated insulin secretion is blunted by PPP1R15B deficiency in β-cells."
    explanation: Directly states the secretory phenotype caused by PPP1R15B deficiency.

- name: Impaired Brain Growth and Neurodevelopment
  description: >-
    Chronically reduced translational output constrains the rapid protein
    synthesis required by proliferating neural progenitors during
    corticogenesis, yielding severe congenital microcephaly with impaired
    intellectual development. Structural neuroimaging in affected individuals
    shows white-matter rarefaction, delayed myelination, and hypoplasia of the
    brainstem and spinal cord, indicating that both neuron production and
    myelination are affected.
  role: consequence
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: regulation of translational initiation
    term:
      id: GO:0006446
      label: regulation of translational initiation
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:26307080
    reference_title: "Homozygous mutation in the eukaryotic translation initiation factor 2alpha phosphatase gene, PPP1R15B, is associated with severe microcephaly, short stature and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hypoplastic brainstem and cord, delayed myelination"
    explanation: >-
      Documents the neurodevelopmental phenotype including brainstem/cord
      hypoplasia and delayed myelination.
  - reference: PMID:26307080
    reference_title: "Homozygous mutation in the eukaryotic translation initiation factor 2alpha phosphatase gene, PPP1R15B, is associated with severe microcephaly, short stature and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the brainstem was small and there was decreased cerebellar volume"
    explanation: >-
      Neuroimaging evidence that the growth failure of the developing CNS extends
      beyond the cortex to brainstem and cerebellum.

- name: Impaired Somatic Growth
  description: >-
    Growth restriction begins prenatally (small for gestational age) and
    continues postnatally to produce severe short stature with low body weight
    and BMI. In the index family the growth failure was independent of
    pituitary or thyroid dysfunction and was accompanied by a mild bone
    dysplasia without disturbed calcium or phosphate metabolism, consistent
    with a cell-intrinsic translational constraint on growth rather than an
    endocrine axis defect.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these results are in keeping with bone dysplasia without marked disturbance of calcium metabolism, with severe growth retardation unrelated to pituitary or thyroid dysfunction."
    explanation: >-
      Establishes that growth failure is not secondary to pituitary or thyroid
      disease, supporting a cell-intrinsic mechanism.

- name: Hepatocellular Injury and Infantile Liver Failure
  description: >-
    A hepatic arm reported to date only in the compound heterozygous family:
    progressive cirrhosis of indeterminate etiology presenting in infancy and
    requiring liver transplantation at 7 and 22 months. Hepatocytes are, like
    beta cells, a high-secretory cell type plausibly vulnerable to sustained
    translational attenuation, but the mechanistic route from raised
    phospho-eIF2-alpha to cirrhosis is not established, and why this arm appears
    in the compound heterozygous family and not in the two R658C families is
    unresolved (see the genotype-phenotype discussion). Curated as a distinct,
    weakly connected branch rather than a general feature of the syndrome.
  role: consequence
  biological_scale: TISSUE
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:27640355
    reference_title: "Infantile Cirrhosis, Growth Impairment, and Neurodevelopmental Anomalies Associated with Deficiency of PPP1R15B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "developed cirrhosis of indeterminate etiology and required liver"
    explanation: >-
      Documents the hepatic phenotype that this node represents.
  - reference: PMID:27640355
    reference_title: "Infantile Cirrhosis, Growth Impairment, and Neurodevelopmental Anomalies Associated with Deficiency of PPP1R15B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first demonstration of PPP1R15B associated with liver disease \nexpands the phenotypic spectrum of PPP1R15B related diseases."
    explanation: >-
      Establishes hepatic disease as a genuine but spectrum-expanding
      manifestation of PPP1R15B deficiency.

- name: Impaired Glucose Metabolism and Young-Onset Diabetes
  description: >-
    Loss of functional beta-cell mass manifests as insulin-requiring diabetes
    presenting in the second-to-third decade, in one sibling with acute
    hyperglycemia and ketosis. Residual beta-cell function persists (detectable
    glucagon-stimulated C-peptide) and insulin requirements are initially
    modest, but the course can become brittle with marked glucose variability
    and severe hypoglycemia.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "diabetes presenting with an acute onset of hyperglycemia and ketosis at age 28 years."
    explanation: >-
      Documents young-adult-onset diabetes presenting with hyperglycemia and
      ketosis in an affected sibling.
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glucagon-stimulated C-peptide was detectable."
    explanation: Indicates retained partial beta-cell function.

mechanistic_hypotheses:
- hypothesis_group_id: bidirectional_eif2a_dysregulation
  hypothesis_label: Bidirectional eIF2-alpha dysregulation converges on beta-cell failure
  description: >-
    MSSGM2 (excess eIF2-alpha phosphorylation from phosphatase-subunit loss)
    and Wolcott-Rallison syndrome (deficient eIF2-alpha phosphorylation from
    EIF2AK3/PERK loss) are proposed to be mechanistic mirror images: departure
    from tightly regulated eIF2-alpha phosphorylation in either direction is
    deleterious to beta cells and other secretory tissues, producing
    overlapping syndromic diabetes with microcephaly and growth failure. This
    framing is well supported for the shared endpoint, but the reason
    particular tissues (brain, bone, liver) are selectively vulnerable, and why
    hepatic disease dominates in some families, is not established.
  status: EMERGING
  evidence:
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings support the concept that dysregulated eIF2α phosphorylation, whether decreased by mutation"
    explanation: >-
      States the bidirectional-dysregulation hypothesis directly, comparing
      PPP1R15B and EIF2AK3 disease.


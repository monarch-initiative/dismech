name: Microcephaly, Short Stature, and Impaired Glucose Metabolism 2
creation_date: "2026-07-31T19:30:00Z"
category: Mendelian
description: >-
  Microcephaly, short stature, and impaired glucose metabolism 2 (MSSGM2) is an
  ultra-rare autosomal recessive syndrome caused by biallelic variants in
  PPP1R15B, which encodes CReP (constitutive repressor of eIF2-alpha
  phosphorylation) — the constitutively expressed regulatory subunit that
  recruits protein phosphatase 1 (PP1/PPP1C) to eIF2-alpha in unstressed cells.
  The recurrent p.Arg658Cys substitution lies in the PP1-binding site; it
  reduces PPP1R15B-PPP1C interaction and eIF2-alpha dephosphorylation, so basal
  phospho-eIF2-alpha rises and cap-dependent translation initiation is
  chronically attenuated. This is the mechanistic mirror image of
  Wolcott-Rallison syndrome, where EIF2AK3/PERK loss lowers eIF2-alpha
  phosphorylation: dysregulation in either direction is deleterious to
  pancreatic beta cells and other high-secretory tissues. Clinically the two
  independently reported R658C families share congenital microcephaly with
  impaired intellectual development and severe short stature, together with
  skeletal, dental, hair and white-matter involvement. Autoantibody-negative,
  insulin-treated diabetes attributable to beta-cell apoptosis rather than
  autoimmunity was reported in the first family, presenting in the second-to-third
  decade; the siblings in the second family were last assessed at 5 years and 3
  years of age — well before that onset window — so the glucose phenotype appears
  age-dependent and cannot be excluded in young PPP1R15B-positive individuals. A
  third family with compound heterozygous PPP1R15B variants presented instead
  with infantile cirrhosis requiring liver transplantation, extending the
  phenotypic spectrum.
parents:
- Microcephaly
- Monogenic diabetes

differential_diagnoses:
- name: Wolcott-Rallison syndrome (EIF2AK3)
  description: >-
    The most important differential and the mechanistic mirror image: EIF2AK3
    /PERK loss lowers eIF2-alpha phosphorylation, whereas PPP1R15B loss raises
    it, yet both converge on syndromic diabetes with microcephaly, growth
    retardation and skeletal disease. The practical discriminators are onset and
    C-peptide — Wolcott-Rallison causes neonatal diabetes with beta-cell loss
    and undetectable C-peptide, while PPP1R15B causes later-onset diabetes with
    residual C-peptide.
  disease_term:
    preferred_term: Wolcott-Rallison syndrome
    term:
      id: MONDO:0009192
      label: Wolcott-Rallison syndrome
  evidence:
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the Wolcott-Rallison syndrome (with decreased eIF2α phosphorylation), neonatal diabetes is due to β-cell loss and C-peptide is undetectable (13), while DNAJC3, IER3IP1, and PPP1R15B mutations (with increased eIF2α phosphorylation) lead to permanent neonatal or young-onset diabetes with residual C-peptide levels"
    explanation: >-
      Gives the explicit clinical discriminator (C-peptide undetectable vs
      residual) between Wolcott-Rallison and PPP1R15B disease.
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous mutations in EIF2AK3 cause Wolcott-Rallison syndrome, a syndromic form of neonatal diabetes with epiphyseal dysplasia, growth retardation, and variable other manifestations including microcephaly"
    explanation: >-
      Establishes the overlapping phenotype that makes this the primary
      differential.

- name: DNAJC3- and IER3IP1-related syndromic diabetes
  description: >-
    Both raise eIF2-alpha phosphorylation like PPP1R15B and share beta-cell
    dysfunction, microcephaly and intellectual disability, so they are
    mechanistically adjacent and clinically overlapping. Distinguished by gene
    rather than by phenotype, which is why molecular testing is the diagnostic
    core.
  evidence:
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "and with syndromes caused by mutations in the ER cochaperone DNAJC3 and in the immediate early response 3 interacting protein 1 (IER3IP1), which both lead to higher levels of ER stress with more eIF2α phosphorylation"
    explanation: >-
      Names the two mechanistically adjacent disorders sharing raised
      eIF2-alpha phosphorylation.

- name: CACH/VWM (vanishing white matter disease, eIF2B)
  description: >-
    Mutations in eIF2B, the target of phosphorylated eIF2-alpha, cause childhood
    ataxia with CNS hypomyelination / vanishing white matter disease. Relevant
    here because MSSGM2 also produces white-matter rarefaction, delayed
    myelination and ataxia, so the leukoencephalopathy phenotype alone does not
    separate them; severe CACH/VWM can likewise be multisystem.
  disease_term:
    preferred_term: leukoencephalopathy with vanishing white matter
    term:
      id: MONDO:0800448
      label: leukoencephalopathy with vanishing white matter
  evidence:
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is notable that the mutations affecting the target of phosphorylated eIF2α, the guanine nucleotide exchange factor eIF2B, feature prominent neurodegenerative manifestations known as the CACH (childhood ataxia with central nervous system hypomyelination)/VWM (vanishing white matter disease) syndrome"
    explanation: >-
      Establishes the eIF2B/CACH-VWM disorders as part of the same pathway and
      therefore a differential for the white-matter phenotype.

treatments:
- name: Insulin Therapy
  description: >-
    Insulin replacement is the mainstay for the diabetes; both affected
    siblings in the index family were insulin treated. Initial requirements may
    be relatively low (~0.5 units/kg/day), reflecting residual beta-cell
    function, but the course may evolve to significant glucose variability with
    severe hypoglycemia and seizures, warranting careful titration and glucose
    monitoring.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: insulin
      term:
        id: CHEBI:145810
        label: insulin
  target_mechanisms:
  - target: Impaired Glucose Metabolism and Young-Onset Diabetes
    treatment_effect: BYPASSES
    description: >-
      Exogenous insulin replaces the hormone the failing beta-cell mass can no
      longer secrete; it does not correct the underlying eIF2-alpha phosphatase
      defect.
    evidence:
    - reference: PMID:26159176
      reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "He was treated with twice-daily insulin injections."
      explanation: >-
        Documents insulin replacement as the intervention applied to the
        diabetes node.
  evidence:
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He was treated with twice-daily insulin injections."
    explanation: Documents insulin therapy as the treatment used for the diabetes.
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "but evolved to significant glucose variability with severe hypoglycemia episodes and seizures."
    explanation: >-
      Documents the brittle course and hypoglycemia risk that shapes insulin
      management.

- name: Genetic Counseling
  description: >-
    Autosomal recessive inheritance carries a 25% recurrence risk for siblings,
    and both index families were consanguineous with two affected siblings each
    — the recurrence is documented, not theoretical. Counseling covers
    recurrence risk, carrier testing for at-risk relatives, and reproductive
    options. Framed as standard practice for a confirmed autosomal recessive
    disorder rather than a disease-specific validated protocol.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied two siblings with young-onset diabetes, intellectual disability, microcephaly, and short stature who were born to first-cousin consanguineous parents without diabetes"
    explanation: >-
      Documents consanguinity with unaffected carrier parents and two affected
      siblings, the recessive pedigree structure that grounds counseling.
      PARTIAL because the paper documents the genetics, not counseling
      practice itself.

- name: Liver Transplantation
  description: >-
    In the hepatic-predominant presentation, progressive infantile cirrhosis
    required liver transplantation in both affected siblings, at 7 and 22
    months of age.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Liver Transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  target_mechanisms:
  - target: Hepatocellular Injury and Infantile Liver Failure
    treatment_effect: BYPASSES
    description: >-
      Transplantation replaces the failed organ. It does not correct the
      underlying eIF2-alpha phosphatase defect, which persists in every other
      tissue, so it is organ salvage rather than disease-modifying therapy.
    evidence:
    - reference: PMID:27640355
      reference_title: "Infantile Cirrhosis, Growth Impairment, and Neurodevelopmental Anomalies Associated with Deficiency of PPP1R15B."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "required liver \ntransplantation; S1 at 7 months and S2 at 22 months."
      explanation: >-
        Documents transplantation as the intervention for the hepatic failure
        node.
  evidence:

genetic:
- name: PPP1R15B
  gene_term:
    preferred_term: PPP1R15B
    term:
      id: hgnc:14951
      label: PPP1R15B
  relationship_type: CAUSATIVE
  variants:
  - name: "p.Arg658Cys (c.1972G>A)"
    description: >-
      Recurrent homozygous missense variant in the C-terminal PP1-binding region,
      independently reported in two unrelated consanguineous families with the
      full microcephaly-short stature-diabetes syndrome. It weakens PPP1R15B-PP1
      binding and thereby reduces eIF2-alpha dephosphorylation.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:26307080
      reference_title: "Homozygous mutation in the eukaryotic translation initiation factor 2alpha phosphatase gene, PPP1R15B, is associated with severe microcephaly, short stature and intellectual disability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a homozygous missense mutation, c.1972G>A; p.Arg658Cys, in protein phosphatase 1, \nregulatory subunit 15b (PPP1R15B)"
      explanation: Specifies the recurrent variant at cDNA and protein level.
  - name: p.Asn423Asp
    description: >-
      Homozygous missense variant adjacent to helix H1 of the substrate-recruitment
      module, reported in a rare syndrome with microcephaly, developmental delay and
      intellectual disability. Mechanistically distinct from p.Arg658Cys: it reduces
      capture of the trimeric eIF2 substrate rather than binding of the PP1 catalytic
      subunit, converging on the same biochemical endpoint of deficient eIF2-alpha
      dephosphorylation. Diabetes was not established in the primary report, so this
      allele is best regarded as an overlapping PPP1R15B-related phenotype.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:38159565
      reference_title: "Recruitment of trimeric eIF2 by phosphatase non-catalytic subunit PPP1R15B."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "A homozygous N423D variant, adjacent to H1, reducing \nsubstrate binding and dephosphorylation was discovered in a rare syndrome with \nmicrocephaly, developmental delay, and intellectual disability."
      explanation: >-
        Establishes a second pathogenic allele acting through impaired substrate
        recruitment, and the phenotype in which it was found.
  evidence:
  - reference: PMID:26307080
    reference_title: "Homozygous mutation in the eukaryotic translation initiation factor 2alpha phosphatase gene, PPP1R15B, is associated with severe microcephaly, short stature and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a homozygous missense mutation, c.1972G>A; p.Arg658Cys, in protein phosphatase 1, \nregulatory subunit 15b (PPP1R15B)"
    explanation: Identifies the causal gene and the recurrent variant at cDNA and protein level.
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report the first homozygous mutation in the \nPPP1R15B gene"
    explanation: >-
      First report establishing PPP1R15B as the causal gene for the syndrome.


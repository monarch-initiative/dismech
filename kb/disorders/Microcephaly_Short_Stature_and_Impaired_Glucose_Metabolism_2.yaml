pathophysiology:
- name: Biallelic PPP1R15B (CReP) Variants Disrupting the PP1-Binding Site
  description: >-
    Biallelic PPP1R15B variants — recurrently the homozygous missense
    c.1972G>A; p.Arg658Cys — alter a conserved residue inside the PPP1C
    (protein phosphatase 1) binding domain of CReP. CReP is the constitutively
    expressed member of the PPP1R15 family and acts as the non-catalytic
    targeting subunit that presents eIF2-alpha to PP1 under basal, unstressed
    conditions. Damaging this interface is the initiating molecular lesion of
    the syndrome. A second, mechanistically distinct route to the same endpoint
    is the homozygous p.Asn423Asp variant adjacent to helix H1 of the
    substrate-recruitment module, which impairs capture of the trimeric eIF2
    substrate while leaving PP1 binding largely intact; both allele classes
    converge on deficient eIF2-alpha dephosphorylation.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: PPP1R15B
    term:
      id: hgnc:14951
      label: PPP1R15B
  molecular_functions:
  - preferred_term: protein phosphatase 1 binding
    term:
      id: GO:0008157
      label: protein phosphatase 1 binding
    modifier: DECREASED
  downstream:
  - target: Loss of CReP-Directed eIF2-alpha Dephosphorylation
    causal_link_type: DIRECT
    description: >-
      The PP1-binding-site substitution directly reduces PP1 recruitment and
      therefore eIF2-alpha dephosphorylation.
    evidence:
    - reference: PMID:26159176
      reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The R658C mutation decreases PP1 binding and eIF2α \ndephosphorylation and results in β-cell apoptosis."
      explanation: >-
        Directly links the variant to decreased PP1 binding and impaired
        eIF2-alpha dephosphorylation, establishing this causal edge.
  evidence:
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The R658C mutation in PPP1R15B affects a conserved amino acid within the domain important for protein phosphatase 1 (PP1) binding."
    explanation: >-
      Localizes the recurrent disease variant to the conserved PP1-binding
      domain of CReP, establishing the initiating molecular lesion.
  - reference: PMID:26307080
    reference_title: "Homozygous mutation in the eukaryotic translation initiation factor 2alpha phosphatase gene, PPP1R15B, is associated with severe microcephaly, short stature and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The p.R658C PPP1R15B mutation is located within the PPP1C binding site."
    explanation: Independently confirms the variant maps to the PPP1C binding site.
  - reference: PMID:38159565
    reference_title: "Recruitment of trimeric eIF2 by phosphatase non-catalytic subunit PPP1R15B."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A homozygous N423D variant, adjacent to H1, reducing \nsubstrate binding and dephosphorylation was discovered in a rare syndrome with \nmicrocephaly, developmental delay, and intellectual disability."
    explanation: >-
      Documents the alternative substrate-recruitment lesion converging on the
      same deficient eIF2-alpha dephosphorylation.

- name: Loss of CReP-Directed eIF2-alpha Dephosphorylation
  description: >-
    Reduced PPP1R15B-PPP1C interaction impairs the holophosphatase that
    dephosphorylates eIF2-alpha at Ser51 in unstressed cells. Patient-derived
    cells show diminished PPP1R15B-PPP1C complex formation with a consequent
    rise in phospho-eIF2-alpha. Patient cells also upregulate PPP1R15B mRNA and
    protein, an ineffective compensatory response because the encoded protein
    is itself defective.
  role: intermediate
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: peptidyl-serine dephosphorylation
    term:
      id: GO:0070262
      label: peptidyl-serine dephosphorylation
    modifier: DECREASED
  downstream:
  - target: Chronic Attenuation of Cap-Dependent Translation Initiation
    causal_link_type: DIRECT
    description: >-
      Raised basal phospho-eIF2-alpha is the direct mechanistic cause of reduced
      cap-dependent translation initiation.
    evidence:
    - reference: PMID:26307080
      reference_title: "Homozygous mutation in the eukaryotic translation initiation factor 2alpha phosphatase gene, PPP1R15B, is associated with severe microcephaly, short stature and intellectual disability."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "phosphorylated eIF2α attenuates protein \ntranslation."
      explanation: >-
        States the canonical mechanism by which increased phospho-eIF2-alpha
        attenuates translation, supporting this edge.
  evidence:
  - reference: PMID:26307080
    reference_title: "Homozygous mutation in the eukaryotic translation initiation factor 2alpha phosphatase gene, PPP1R15B, is associated with severe microcephaly, short stature and intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that patient cells have greatly diminished levels of PPP1R15B-PPP1C interaction, which results in increased eIF2α phosphorylation and resistance to cellular stress."
    explanation: >-

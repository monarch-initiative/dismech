diagnosis:
- name: Molecular Confirmation of Biallelic PPP1R15B Variants
  description: >-
    Diagnosis rests on molecular confirmation, since the clinical triad overlaps
    several other ER-stress/translation-associated syndromic diabetes disorders.
    Exome sequencing identified the causal variant in both index families, with
    confirmation and family segregation by Sanger sequencing or PCR-RFLP
    genotyping. In practice a broad exome/genome or a monogenic-diabetes panel
    containing PPP1R15B is the appropriate first-line test, with parental
    segregation to establish biallelic status.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we performed exome sequencing on patient 1’s genomic DNA and identified 18 rare homozygous autosomal variants after filtering"
    explanation: Documents exome sequencing as the diagnostic route to the causal variant.
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We confirmed these variants in patient 1 and genotyped them in patient 2 and in two nonaffected relatives (a grandmother and an aunt) by Sanger sequencing or PCR-RFLP genotyping."
    explanation: >-
      Documents the orthogonal confirmation and family segregation testing that
      establishes biallelic status.
  - reference: PMID:26307080
    reference_title: "Homozygous mutation in the eukaryotic translation initiation factor 2alpha phosphatase gene, PPP1R15B, is associated with severe microcephaly, short stature and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing identified a homozygous missense mutation, c.1972G>A; p.Arg658Cys, in protein phosphatase 1, \nregulatory subunit 15b (PPP1R15B)"
    explanation: Independent family diagnosed by the same exome-sequencing route.

- name: Distinguishing the Diabetes from Type 1 Diabetes
  description: >-
    Because the diabetes presents in youth and can debut with hyperglycemia and
    ketosis, it is readily mistaken for type 1 diabetes. Pancreatic autoantibody
    testing is the discriminator: the index patient was autoantibody-negative
    with detectable glucagon-stimulated C-peptide, indicating retained beta-cell
    function rather than autoimmune beta-cell destruction.
  diagnosis_term:
    preferred_term: autoantibody measurement
    term:
      id: NCIT:C181397
      label: Autoantibody Measurement
  evidence:
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type 1 diabetes–specific autoantibodies (islet cell antibody, GAD, IA2 antibodies) were negative."
    explanation: >-
      Autoantibody negativity is the key laboratory finding separating this
      disorder from type 1 diabetes.
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glucagon-stimulated C-peptide was detectable."
    explanation: >-
      Retained C-peptide indicates residual beta-cell function, unlike typical
      autoimmune type 1 diabetes.

biochemical:
- name: Hyperglycemia and Elevated HbA1c
  presence: Elevated
  notes: >-
    At diabetes diagnosis the index patient had marked hyperglycemia with a
    fasting glucose of 13.4 mmol/L and HbA1c 13.0% (119 mmol/mol), reflecting
    substantial pre-existing glycemic decompensation at presentation.
  evidence:
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fasting glucose was 13.4 mmol/L and HbA1c was 13.0% (119 mmol/mol)."
    explanation: Provides the quantitative glycemic markers at diabetes onset.

- name: Detectable C-Peptide
  presence: Detectable
  notes: >-
    Glucagon-stimulated C-peptide remained detectable, indicating preserved
    residual beta-cell function. This distinguishes the disorder from
    Wolcott-Rallison syndrome, in which C-peptide is undetectable, and supports
    a secretory defect rather than complete beta-cell loss.
  evidence:
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glucagon-stimulated C-peptide was detectable."
    explanation: Documents retained endogenous insulin secretory capacity.

- name: Elevated TSH
  presence: Elevated
  notes: >-
    Elevated TSH (9.53, reference 0.5-5.5 mIU/L) in the proband of the second
    R658C family, the biochemical basis of the hypothyroidism in that family.
    Discordant across families — the index family had normal thyroxine.
  reference_ranges:
  - lower_bound: 0.5
    upper_bound: 5.5
    unit: mIU/L
    population: pediatric
    notes: >-
      Interval as reported in the source alongside the patient value. The
      source publishes the unit as "mmol/l", which is not a valid unit for
      thyrotropin (a molar concentration rather than an activity
      concentration) and is almost certainly a typographical error; the
      standard unit mIU/L is recorded in this structured field, while the
      quoted snippet below preserves the published wording verbatim. The
      numeric values are unambiguous as a mild TSH elevation against a normal
      interval.
    evidence:

  description: >-
    Insulin-requiring, autoantibody-negative diabetes presenting in the
    second-to-third decade (ages 15 and 28 years in the index family). Onset may
    be acute with hyperglycemia and ketosis, and the course can become brittle
    with severe hypoglycemia and seizures. No `frequency` is asserted: diabetes
    is documented in 2 of the 4 reported R658C individuals, but the two who lack
    it were last assessed at 5 and 3 years of age, far below the reported onset
    window, so the observed fraction reflects age at ascertainment rather than a
    penetrance estimate.
  phenotype_term:
    preferred_term: Diabetes mellitus
    term:
      id: HP:0000819
      label: Diabetes mellitus
  evidence:
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "diabetes presenting with an acute onset of hyperglycemia and ketosis at age 28 years."
    explanation: Documents young-adult onset diabetes with ketosis.
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He was treated with twice-daily insulin injections."
    explanation: Indicates insulin dependence.
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type 1 diabetes–specific autoantibodies (islet cell antibody, GAD, IA2 antibodies) were negative."
    explanation: >-
      Establishes that the diabetes is autoantibody-negative, supporting a
      non-autoimmune, beta-cell-intrinsic mechanism.
  - reference: PMID:26307080
    reference_title: "Homozygous mutation in the eukaryotic translation initiation factor 2alpha phosphatase gene, PPP1R15B, is associated with severe microcephaly, short stature and intellectual disability."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "At her last clinical assessment at 5 years and 2 months of age"
    explanation: >-
      Diabetes is not reported in the second R658C family, but the proband was
      last assessed at 5 years 2 months — well before the second-to-third decade
      onset window — so this is uninformative about the glucose phenotype rather
      than evidence against it.


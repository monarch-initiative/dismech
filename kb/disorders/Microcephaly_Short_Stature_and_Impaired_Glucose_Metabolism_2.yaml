    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "required liver \ntransplantation; S1 at 7 months and S2 at 22 months."
    explanation: Documents liver transplantation in the hepatic presentation.

discussions:
- discussion_id: gap_ppp1r15b_genotype_phenotype_hepatic_vs_neuro
  prompt: >-
    Why do PPP1R15B variants produce a microcephaly-diabetes phenotype in some
    families and a hepatic-predominant infantile cirrhosis phenotype in others?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of CReP-Directed eIF2-alpha Dephosphorylation
  - phenotypes#Infantile Cirrhosis
  rationale: >-
    The two R658C families share a homozygous PP1-binding-site missense variant
    and a concordant neurodevelopmental/endocrine phenotype without reported
    liver disease, whereas the compound heterozygous family presented with
    infantile cirrhosis requiring transplantation. Whether this reflects
    allele-specific residual CReP activity, genetic background, or ascertainment
    is unresolved, and it directly affects prognostic counseling and
    surveillance.
  proposed_experiments:
  - experiment_id: exp_ppp1r15b_allele_series_residual_activity
    name: Allele-series comparison of residual CReP-PP1 activity
    description: >-
      Quantify PPP1R15B-PPP1C binding, basal phospho-eIF2-alpha, and
      translational output across the reported allele series in matched
      patient-derived cells to test whether hepatic-predominant alleles retain
      different residual activity than R658C.
  - experiment_id: exp_ppp1r15b_hepatic_surveillance
    name: Systematic hepatic surveillance in R658C individuals
    description: >-
      Prospectively assess transaminases, synthetic function, and elastography
      in molecularly confirmed R658C individuals to test whether subclinical
      liver involvement is present but unascertained.

- discussion_id: interp_ppp1r15b_inhibitors_directionally_counterproductive
  prompt: >-
    Would PPP1R15B/CReP inhibitors (e.g. Raphin1) or other agents that further
    raise phospho-eIF2-alpha be expected to worsen MSSGM2?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of CReP-Directed eIF2-alpha Dephosphorylation
  - pathophysiology#Pancreatic Beta-Cell Secretory Failure and Apoptosis
  rationale: >-
    PPP1R15B/CReP is an active drug target, and selective CReP inhibitors are
    being developed to raise phospho-eIF2-alpha therapeutically in other
    contexts. In MSSGM2 the defect is already excessive phospho-eIF2-alpha from
    deficient CReP function, so pharmacologically inhibiting the same node is
    directionally counterproductive rather than therapeutic. The concern is not
    purely theoretical: in rodent and human beta cells the eIF2-alpha
    phosphatase inhibitor salubrinal exacerbates cell death. This is a
    prescribing-relevant caution rather than an established clinical
    contraindication, since no such agent has been given to an affected
    individual; it is recorded here so the inference is explicit rather than
    left for a reader to reconstruct.
  proposed_experiments:
  - experiment_id: exp_ppp1r15b_inhibitor_directionality
    name: Directionality test of CReP inhibition in R658C beta cells
    description: >-
      Compare apoptosis and glucose-stimulated insulin secretion in
      R658C-knockin versus wild-type human beta cells exposed to selective
      CReP/PPP1R15B inhibitors, to test whether further raising
      phospho-eIF2-alpha worsens the beta-cell phenotype.
  evidence:
  - reference: PMID:38139150
    reference_title: "The PPP1R15 Family of eIF2-alpha Phosphatase Targeting Subunits (GADD34 and CReP)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "we will discuss several pharmacological inhibitors of \nGADD34 and/or CReP that show promise as treatments and the controversies as to \ntheir mechanism of action."
    explanation: >-
      Confirms that pharmacological CReP inhibitors exist and are under active
      development, making the directionality caution clinically relevant.
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "salubrinal actually exacerbates cell death through ER stress"
    explanation: >-
      Shows that pharmacologically raising phospho-eIF2-alpha harms beta cells,
      supporting the counterproductive-direction inference.

- discussion_id: gap_ppp1r15b_tissue_selectivity_and_isr_targeting
  prompt: >-
    Is the disorder's tissue selectivity explained by differential dependence on
    constitutive eIF2-alpha dephosphorylation, and can it be pharmacologically
    targeted?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Chronic Attenuation of Cap-Dependent Translation Initiation
  - pathophysiology#Pancreatic Beta-Cell Secretory Failure and Apoptosis
  rationale: >-
    CReP is ubiquitously expressed, yet disease burden falls on brain,
    pancreatic beta cells, bone, teeth and liver. Establishing which tissues
    depend most on basal eIF2-alpha dephosphorylation would clarify why these
    organs fail and whether modulating the integrated stress response could be
    therapeutic. This matters because the beta-cell phenotype is driven by
    apoptosis, which is in principle preventable if intervention precedes
    beta-cell loss.
  proposed_experiments:
  - experiment_id: exp_ppp1r15b_isogenic_tissue_panel
    name: Isogenic R658C-knockin human tissue panel
    description: >-
      Measure basal phospho-eIF2-alpha and translational output across isogenic
      R658C-knockin human iPSC-derived neurons, beta cells and hepatocytes to
      map differential dependence on constitutive eIF2-alpha dephosphorylation.
  - experiment_id: exp_ppp1r15b_isr_modulator_beta_cell_rescue
    name: ISR-modulator rescue in R658C beta cells
    description: >-
      Test whether integrated-stress-response modulators restore
      glucose-stimulated insulin secretion and reduce apoptosis in
      R658C-knockin human beta cells.

notes: >-
  No GeneReviews chapter exists for PPP1R15B-related disease as of this curation
  (a PubMed search for "PPP1R15B GeneReviews" returned no results), so the
  GeneReviews phenotype-baseline step was not applicable. The disorder is
  ultra-rare: MSSGM2 is defined by two independently reported consanguineous
  families homozygous for the same p.Arg658Cys variant, plus one compound
  heterozygous family with a hepatic-predominant presentation. Population
  prevalence is therefore not estimable and no prevalence records are asserted;
  frequency values are given only for the cardinal features present in all
  reported R658C individuals. MSSGM1 (MONDO:0000208, TRMT10A) is a distinct
  genetic entity with a deliberately similar clinical label and is not merged
  here.

  Hypothyroidism is discordant across families and is curated as such rather
  than as a constant feature: the proband of the second R658C family had an
  elevated TSH requiring replacement, whereas the index family's proband had
  explicitly normal thyroxine. Hepatic fibrosis/cirrhosis is review-aggregated
  for the R658C phenotype, so the Infantile Cirrhosis phenotype here is scoped
  strictly to the compound heterozygous family in which it was primarily
  reported, and should be widened only if primary R658C evidence emerges.

  Frequency discipline. `frequency:` is asserted only for microcephaly, short
  stature and intellectual disability — features documented in all four reported
  R658C individuals. It is deliberately omitted for diabetes, which is present
  in 2 of 4 but whose two negatives were assessed at 5 and 3 years of age,
  far below the second-to-third-decade onset window, making the observed
  fraction a statement about ascertainment age rather than penetrance.

  Deep-research provenance and a caution. This entry was curated with a falcon
  (Edison) deep-research run, retained at
  research/Microcephaly_Short_Stature_and_Impaired_Glucose_Metabolism_2-deep-research-falcon.md.
  Its substantive findings were independently verified against cached primary
  abstracts before use, and one error was caught in the process: the report
  cites the Abdulkarim 2015 paper as PMID:26310607, which is incorrect — the
  correct identifier is PMID:26159176 (verified via the cached record and the
  paper's DOI 10.2337/db15-0477). The report's genuine added value was
  surfacing the p.Asn423Asp substrate-recruitment allele (PMID:38159565),
  which is curated above.

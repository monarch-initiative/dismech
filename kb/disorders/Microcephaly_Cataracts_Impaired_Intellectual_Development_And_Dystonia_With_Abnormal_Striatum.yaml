genetic:
- name: KCNA4
  gene_term:
    preferred_term: KCNA4
    term:
      id: hgnc:6222
      label: KCNA4
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    One family and one allele. The gene was found by linkage (LOD 4.09 on
    chromosome 11), autozygosity mapping to a 12-gene block and exome
    sequencing; a screen of 266 cataract genes found no other segregating
    variant. No second family has been reported, so the gene-disease link rests
    on a single sibship.
  variants:
  - name: NM_002233:c.266G>A (p.Arg89Gln)
    type: missense
    description: >-
      Homozygous in all four patients, heterozygous in both parents. Absent from
      747 ethnically matched exomes and a further cohort of 428; seen twice in
      the heterozygous state in ExAC. It lies in a low-complexity segment rather
      than a defined functional domain, and reduces Kv1.4 current in Xenopus
      oocytes.
    evidence:
    - reference: PMID:27582084
      reference_title: "KCNA4 deficiency leads to a syndrome of abnormal striatum, congenital cataract and intellectual disability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The variant was fully segregated with the disease and absent in 747 ethnically matched exomes."
      explanation: Segregation and absence from matched controls.
    - reference: PMID:27582084
      reference_title: "KCNA4 deficiency leads to a syndrome of abnormal striatum, congenital cataract and intellectual disability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The variant was found twice in ExAC database in a heterozygous state."
      explanation: Population frequency.
  evidence:
  - reference: PMID:27582084
    reference_title: "KCNA4 deficiency leads to a syndrome of abnormal striatum, congenital cataract and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The second block expanded on chr11: 29.1–31 Mbp and contained 12 genes including KCNA4."
    explanation: Autozygosity mapping placed KCNA4 in the shared homozygous block.
  - reference: PMID:27582084
    reference_title: "KCNA4 deficiency leads to a syndrome of abnormal striatum, congenital cataract and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the variants were fully segregated in the family"
    explanation: Screening of cataract genes found no alternative segregating variant.
animal_models:
- name: Kcna4 (Kv1.4) knockout mouse
  species: Mouse
  genotype: Kcna4 targeted disruption, homozygous null
  publication: PMID:9547391
  notes: >-
    The cited knockout studies examined cardiac and cortical neuron currents.
    Their abstracts report no lens, head-size or striatal phenotyping, so the
    model cannot yet be said to recapitulate or fail to recapitulate the
    clinical features.
  modeled_mechanisms:
  - target: KCNA4 Loss of Function
    relationship: PERTURBS
    fidelity: LOW
    model_scale: MOLECULAR
    description: Targeted disruption abolishes Kv1.4 protein.
    limitations: >-
      Complete null allele, whereas the human R89Q allele reduces current only
      partly; mouse rather than human.
    evidence:
    - reference: PMID:9547391
      reference_title: "The transient outward current in mice lacking the potassium channel gene Kv1.4."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Kv1.4 RNA was truncated in Kv1.4-/- mice and protein expression was absent."
      explanation: Confirms loss of Kv1.4 protein in the knockout.
  - target: Reduced Neuronal A-Type Potassium Current
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Kv1.4-null cortical pyramidal neurons were used to dissect the Kv1.4 component of I(A).
    limitations: >-
      Cortical rather than striatal neurons, and null rather than the partial
      loss of function seen in patients; deletion also caused subunit-specific
      electrical remodelling.
    evidence:
    - reference: PMID:20371829
      reference_title: "Molecular dissection of I(A) in cortical pyramidal neurons reveals three distinct components encoded by Kv4.2, Kv4.3, and Kv1.4 alpha-subunits."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The experimental findings also demonstrate that the targeted deletion of the individual Kv alpha-subunits encoding components of I(A) results in electrical remodeling that is Kv alpha-subunit specific."
      explanation: Gene deletion of Kv1.4 alters neuronal I(A) and triggers remodelling.
diagnosis:
- name: Brain MRI
  description: >-
    MRI showed bilateral putaminal thinning with swelling of the caudate heads
    in every patient, an unusual pattern that, with bilateral cataract, prompts
    consideration of this disease.
  evidence:
  - reference: PMID:27582084
    reference_title: "KCNA4 deficiency leads to a syndrome of abnormal striatum, congenital cataract and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An unusual pattern was noted in the brains of all the four patients on MRI, which included bilateral thinning of the lentiform nucleus ( predominantly involving the putamina) and swelling of the caudate heads."
    explanation: Diagnostic imaging finding.
- name: Exome sequencing
  description: >-
    The causal variant was found by exome sequencing within an autozygous
    interval; metabolic screening, chromosomal analysis, array CGH and mtDNA
    sequencing were normal.
  evidence:
  - reference: PMID:27582084
    reference_title: "KCNA4 deficiency leads to a syndrome of abnormal striatum, congenital cataract and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chromosomal analysis and array CGH was normal. MtDNA sequencing was negative."
    explanation: Negative first-tier genetic tests before exome sequencing.
differential_diagnoses:
- name: KCNA4-related developmental and epileptic encephalopathy
  description: >-
    A de novo heterozygous KCNA4 p.V558L variant, also loss of function, was
    reported in a child with early-onset developmental and epileptic
    encephalopathy. It differs in inheritance and in having seizures, which
    have not been reported in the recessive family.
  evidence:
  - reference: PMID:40472070
    reference_title: "De novo missense variants of KCNA3, KCNA4, and KCNA6 cause early onset developmental epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study also extends the list of potassium channel genes implicated in human epilepsy, introducing Kv1.4 as a novel epilepsy-related gene."
    explanation: A distinct, dominant KCNA4 phenotype.
  - reference: PMID:40472070
    reference_title: "De novo missense variants of KCNA3, KCNA4, and KCNA6 cause early onset developmental epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "our patch-clamp analysis in a cell-based system reveals that all three mutations cause severe loss-of-function channel properties."
    explanation: >-
      Patch-clamp recordings show the de novo variants, including KCNA4
      p.V558L, cause loss of channel function.

mechanistic_hypotheses:
- hypothesis_group_id: kv14_striatal_neuron_vulnerability
  hypothesis_label: Reduced Kv1.4 A-type current makes striatal and other CNS neurons vulnerable
  status: EMERGING
  description: >-
    Proposed by the reporting authors: loss of the Kv1.4 component of the
    A-type potassium current increases neuronal vulnerability, so that early
    striatal neuron death produces the putaminal thinning, and neuronal
    dysfunction underlies the cognitive and behavioural features. The supporting
    data are from mouse striatal neurons lacking both Kv1.4 and Kv4.2 under
    ischaemic stress, not from KCNA4-deficient human neurons.
- hypothesis_group_id: kv14_lens_microcirculation
  hypothesis_label: Loss of lens potassium conductance disturbs the lens microcirculation
  status: EMERGING
  description: >-
    The reporting authors speculate that Kv1.4, together with Na/K pumps,
    contributes to the electromotive potential that drives the lens internal
    microcirculation, and that its loss could disturb lens homeostasis. They
    state that further work is needed before Kv1.4 can be implicated.

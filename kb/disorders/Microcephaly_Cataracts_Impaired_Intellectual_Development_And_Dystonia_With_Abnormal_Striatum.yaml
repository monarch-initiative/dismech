name: Microcephaly, Cataracts, Impaired Intellectual Development, and Dystonia with Abnormal Striatum
creation_date: "2026-10-27T00:00:00Z"
category: Mendelian
synonyms:
- MCIDDS
- syndrome of abnormal striatum, congenital cataract and intellectual disability
description: >-
  Autosomal recessive syndrome described in four siblings of one consanguineous
  Saudi family, homozygous for the KCNA4 missense variant p.Arg89Gln. KCNA4
  encodes Kv1.4, a rapidly inactivating (A-type) voltage-gated potassium
  channel. All four affected siblings had growth retardation, microcephaly,
  bilateral cataract, attention deficit hyperactivity disorder, impaired
  cognition (IQ 77-89), dystonia and an unusual MRI pattern of swollen caudate
  heads with thinned putamina; the neurological course was very slowly
  progressive. The variant reduces Kv1.4 whole-cell current in Xenopus oocytes.
  How a partial loss of Kv1.4 current produces the striatal and lens findings
  is not established. No second family has been reported, so every frequency
  in this entry comes from one sibship of four.
notes: >-
  The evidence base is two reports on the same family (PMID:23181898, clinical
  description and linkage to chromosome 11; PMID:27582084, identification of the
  KCNA4 variant). A de novo heterozygous KCNA4 missense variant (p.V558L) in a
  child with early-onset developmental and epileptic encephalopathy
  (PMID:40472070) is a different, dominant presentation and is not part of this
  entry. A check of the GeneReviews and StatPearls Bookshelf index found no
  chapter for this disease.

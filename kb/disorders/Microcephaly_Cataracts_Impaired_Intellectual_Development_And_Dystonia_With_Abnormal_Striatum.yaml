    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a consanguineous family of three girls and one boy affected with a novel syndrome involving the lens and the basal ganglia."
    explanation: The only reported family, four affected siblings.
pathophysiology:
- name: KCNA4 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    The homozygous missense variant NM_002233 c.266G>A p.(Arg89Gln) lies in a
    low-complexity segment of the Kv1.4 N-terminus, outside the inactivation,
    tetramerisation and pore domains. In Xenopus oocytes the mutant channel gave
    a smaller mean whole-cell current than wild type (14 versus 17 microamperes)
    while keeping rapid inactivation, which the authors interpret as a partial
    loss of function. Co-expression with wild type also lowered current, but
    the parents are unaffected heterozygotes.
  genes:
  - preferred_term: KCNA4
    term:
      id: hgnc:6222
      label: KCNA4
  molecular_functions:
  - preferred_term: voltage-gated potassium channel activity
    term:
      id: GO:0005249
      label: voltage-gated potassium channel activity
    modifier: DECREASED
  evidence:
  - reference: PMID:27582084
    reference_title: "KCNA4 deficiency leads to a syndrome of abnormal striatum, congenital cataract and intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The bar graph in figure 3B shows that cells injected with WT cRNA had a mean current amplitude (17±0.7 μA, n=8) that was significantly greater than those recorded from cells expressing the same amount of R89Q cRNA (14±0.9 μA, n=8, p<0.05)."
    explanation: Two-electrode voltage clamp of R89Q Kv1.4 in Xenopus oocytes shows reduced current.
  - reference: PMID:27582084
    reference_title: "KCNA4 deficiency leads to a syndrome of abnormal striatum, congenital cataract and intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, the mutation R89Q results in a loss of function in the Kv1.4 channel, leading to the observed decrease in the whole-cell current."
    explanation: Authors' interpretation of the electrophysiology as loss of function.
  - reference: PMID:27582084
    reference_title: "KCNA4 deficiency leads to a syndrome of abnormal striatum, congenital cataract and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a missense variant (p.Arg89Gln) in KCNA4 in four patients from a consanguineous family manifesting a novel syndrome of congenital cataract, abnormal striatum, intellectual disability and attention deficit hyperactivity disorder."
    explanation: The initiating genetic lesion in the affected siblings.
  downstream:
  - target: Reduced Neuronal A-Type Potassium Current
    causal_link_type: DIRECT
    description: >-
      Kv1.4 encodes one component of the neuronal A-type potassium current, so
      loss of Kv1.4 function is expected to reduce that component. This has
      been shown for Kv1.4 knockout cortical neurons in mouse, not for the R89Q
      variant in human neurons.
    evidence:
    - reference: PMID:20371829
      reference_title: "Molecular dissection of I(A) in cortical pyramidal neurons reveals three distinct components encoded by Kv4.2, Kv4.3, and Kv1.4 alpha-subunits."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the experiments here revealed that Kv1.4, Kv4.2, and Kv4.3 alpha-subunits encode distinct components of I(A) that together underlie the macroscopic I(A) in mouse (male and female) cortical pyramidal neurons"
      explanation: Kv1.4 encodes a distinct component of neuronal I(A), established by targeted gene deletion in mouse.
      directness: INDIRECT
  - target: Loss of Lens Transparency
    causal_link_type: UNKNOWN
    description: >-
      KCNA4 transcript is present in the mouse lens, but how Kv1.4 loss leads to
      cataract is unknown. The authors speculate that loss of lens fibre and
      epithelial potassium conductance could disturb the lens microcirculation,
      and state that this has not been tested.
    hypothesis_groups:
    - kv14_lens_microcirculation
    evidence:
    - reference: PMID:27582084
      reference_title: "KCNA4 deficiency leads to a syndrome of abnormal striatum, congenital cataract and intellectual disability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Analysis of KCNA4 transcript using RT-PCR indicated presence of the mRNA in the tested tissues"
      explanation: KCNA4 mRNA detected in adult mouse lens (with brain and retina), placing the channel in the affected tissue.
      directness: INDIRECT
    - reference: PMID:27582084
      reference_title: "KCNA4 deficiency leads to a syndrome of abnormal striatum, congenital cataract and intellectual disability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "However, the channel’s connection with the development of bilateral cataract remains unclear."
      explanation: The authors state that the lens mechanism is not established.
- name: Reduced Neuronal A-Type Potassium Current
  biological_scale: CELLULAR
  description: >-
    Kv1.4 is a rapidly inactivating channel that contributes to the fast
    repolarising phase of neuronal action potentials and is present in striatal
    neurons, cortex, hippocampus and substantia nigra. Its expected cellular
    consequence is a smaller Kv1.4-encoded component of the A-type current;
    this has not been measured in patient-derived neurons.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: potassium ion transmembrane transport
    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
    modifier: DECREASED
  evidence:
  - reference: PMID:27582084
    reference_title: "KCNA4 deficiency leads to a syndrome of abnormal striatum, congenital cataract and intellectual disability."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Kv1.4 is believed to contribute to the fast repolarising phase of action potentials and has been found in striatal neurons."
    explanation: Introduction of the gene-discovery paper summarising earlier work on Kv1.4 function and striatal expression.
    quote_role: BACKGROUND
  - reference: PMID:20371829
    reference_title: "Molecular dissection of I(A) in cortical pyramidal neurons reveals three distinct components encoded by Kv4.2, Kv4.3, and Kv1.4 alpha-subunits."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Recordings from neurons lacking both Kv4.2 and Kv4.3 (Kv4.2(-/-)/Kv4.3(-/-)) revealed that, although Kv1.4 encodes a minor component of I(A), the Kv1.4-encoded current was found in all the Kv4.2(-/-)/Kv4.3(-/-) cortical pyramidal neurons examined."
    explanation: Kv1.4 carries a minor but consistent component of the cortical neuronal A-type current in mouse.
  downstream:
  - target: Striatal Structural Abnormality
    causal_link_type: UNKNOWN
    description: >-
      The authors propose that the striatal thinning reflects early neuronal
      death, by analogy with the greater ischaemic vulnerability of cultured
      striatal neurons from mice lacking Kv1.4 and Kv4.2. This link is a
      hypothesis; it has not been tested for KCNA4 deficiency.
    hypothesis_groups:
    - kv14_striatal_neuron_vulnerability
    evidence:
    - reference: PMID:27582084
      reference_title: "KCNA4 deficiency leads to a syndrome of abnormal striatum, congenital cataract and intellectual disability."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The striatal thinning observed in our patients may be a result of early neuronal death, as previous investigation done on cultured striatal neurons from transgenic mice that lack Kv1.4 and Kv4.2 showed higher vulnerability to ischaemic insults."
      explanation: The authors' proposed link between Kv1.4 loss and striatal thinning, citing mouse culture data.
      directness: INDIRECT
  - target: Intellectual disability
    causal_link_type: UNKNOWN
    description: >-
      Impaired cognition is present in all four patients, but how Kv1.4 loss of
      function causes it is not known.
    hypothesis_groups:
    - kv14_striatal_neuron_vulnerability
    evidence:
    - reference: PMID:32655623
      reference_title: "Intellectual Disability and Potassium Channelopathies: A Systematic Review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Electrophysiological studies revealed loss-of-function as the mechanism responsible for this disorder (Kaya et al., 2016). Nevertheless, it remains unclear how KCNA4 loss-of-function may lead to ID, thus further studies are warranted."
      explanation: A systematic review places KCNA4 loss of function upstream of the intellectual disability while stating the mechanism is unresolved.
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
  - target: Attention deficit hyperactivity disorder
    causal_link_type: UNKNOWN
    description: >-
      ADHD is present in all four patients; no source proposes a specific
      mechanism, so the edge records only that the neuronal channel deficit is
      the presumed origin.
    hypothesis_groups:
    - kv14_striatal_neuron_vulnerability

- name: Loss of Peroxin-10 RING Ligase Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Peroxin-10 is a peroxisomal membrane protein with two transmembrane segments and a
    C3HC4 zinc-finger RING motif, with both termini facing the cytosol. The RING motif is
    the functional business end, and it is what the severe alleles remove.
  cellular_components:
  - preferred_term: peroxisomal membrane
    term:
      id: GO:0005778
      label: peroxisomal membrane
  evidence:
  - reference: PMID:9700193
    reference_title: "Mutations in PEX10 is the cause of Zellweger peroxisome deficiency syndrome of complementation group B."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Both the N- and C-terminal regions of Pex10p are exposed to the cytosol, as assessed
      by an expression study of epitope-tagged Pex10p.
    explanation: >-
      Establishes the topology that puts the RING motif on the cytosolic face, where the
      receptor it acts on arrives.
  - reference: PMID:10862081
    reference_title: "Phenotype-genotype relationships in PEX10-deficient peroxisome biogenesis disorder patients."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Although these results demonstrate serious flaws in the PEX10 functional
      complementation assay, they do suggest that the C-terminal zinc-binding domain is
      critical for PEX10 function.
    explanation: >-
      Supports the claim while carrying the authors' own caveat about the assay that
      produced it. Quoted whole rather than trimmed to the supportive clause, because a
      reader weighing this node needs the caveat as much as the conclusion. Marked
      INDIRECT: with the assay called into question by its own authors, the domain claim
      rests on the mutational pattern rather than on the activity measurements.
  downstream:
  - target: Failure of PEX5 Receptor Recycling
    description: >-
      The RING module's substrate is the matrix-protein receptor. Losing the ligase

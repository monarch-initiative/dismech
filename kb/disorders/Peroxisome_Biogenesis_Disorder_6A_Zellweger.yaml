discussions:
- discussion_id: residual_function_assay_reliability
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Loss of Peroxin-10 RING Ligase Function
  - pathophysiology#Biallelic Severe PEX10 Genotype
  prompt: >-
    How much residual peroxin-10 activity does a given PEX10 allele actually leave, given
    that the assay used to measure it was reported as unreliable by its own authors?
  rationale: >-
    The whole 6A-versus-6B distinction is a claim about residual function, and the
    quantitative instrument for that claim is the PEX10 functional complementation assay.
    That assay returned nearly normal activity for nonsense and frameshift alleles
    predicted to delete a third or two thirds of the protein, and its authors described the
    result as demonstrating serious flaws in the assay rather than as a finding about the
    alleles. The severity-versus-residual-function account survives, because it is carried
    independently by the mutational classes observed in the two phenotype groups. What does
    not survive is any specific activity figure for a specific PEX10 allele, and the
    consequence is practical: an allele of unknown severity cannot currently be assigned to
    6A or 6B on functional grounds, only on the crude grounds of whether it truncates.
  evidence:
  - reference: PMID:10862081
    reference_title: "Phenotype-genotype relationships in PEX10-deficient peroxisome biogenesis disorder patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Surprisingly, we observed that nonsense and frameshift mutations predicted to delete
      the C-terminal 2/3 (R125X) or 1/3 (c.704insA) of the protein displayed nearly normal
      PEX10 activity.
    explanation: The anomalous result that called the assay into question.
  - reference: PMID:10862081
    reference_title: "Phenotype-genotype relationships in PEX10-deficient peroxisome biogenesis disorder patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Although these results demonstrate serious flaws in the PEX10 functional
      complementation assay, they do suggest that the C-terminal zinc-binding domain is
      critical for PEX10 function.
    explanation: >-
      The authors' own assessment of their instrument. This is the sentence the knowledge
      gap exists to preserve: dismech has no structured way to attach a
      method-reliability caveat to the evidence items derived from that assay, so it is
      recorded here.
  - reference: PMID:19127411
    reference_title: "A PEX10 defect in a patient with no detectable defect in peroxisome assembly or metabolism in cultured fibroblasts."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite the abnormal metabolites detected in blood (phytanate, bile acid intermediates
      and pipecolate), analysis of multiple peroxisomal pathways in fibroblasts yielded
      normal results.
    explanation: >-
      A second, independent reason to distrust fibroblast assays for PEX10: a patient with a
      real PEX10 defect and abnormal blood metabolites had entirely normal fibroblast
      studies. That is a different failure mode from the complementation assay above -
      here the cells look normal rather than the assay misreporting activity - and together
      they are why this entry treats residual-function measurements as unreliable and why
      molecular analysis is the diagnostic route.
- discussion_id: matrix_import_to_migration_defect
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Loss of Peroxisomal Metabolic Function
  - phenotypes#Neuronal Migration Defect
  prompt: >-
    Which peroxisomal function, lost when matrix import fails, is the one that arrests
    cortical neuronal migration?
  rationale: >-
    Matrix import failure removes every peroxisomal matrix enzyme simultaneously, so the
    lesion offers no natural experiment: plasmalogen deficiency, very-long-chain fatty acid
    accumulation and defective docosahexaenoic acid handling all arrive together and any of
    them could be the operative one. Nothing cited here traces the route, and the causal
    edge in this entry is typed with unknown intermediates for that reason rather than as a
    hedge. It matters because it is the only place a therapy could act, and because the
    window closes before birth.
  evidence:
  - reference: PMID:26750748
    reference_title: "Peroxisome biogenesis disorders in the Zellweger spectrum: An overview of current diagnosis, clinical manifestations, and treatment guidelines."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Although we anticipate future progress in the development of more effective targeted
      interventions, the current guidelines are meant to provide a starting point for the
      management of these complex conditions in the context of personalized health care.
    explanation: >-
      A statement from a treatment-guideline review that targeted intervention remains
      prospective, which is what one would expect while the operative mechanism is
      unidentified. INDIRECT: it reports the state of therapy, not the state of mechanistic
      knowledge, and the connection between them is the inference.
notes: >-
  Lump/split decision: DISEASE, curated as the severe band of the PEX10 allelic series and
  not as a subtype of a PEX10 parent entry. The stub is retired accordingly.

  That decision follows repository precedent rather than being invented here. The KB
  already carries Peroxisome_Biogenesis_Disorder_1B, _2B, _3A_Zellweger, _4A_Zellweger,
  _4B, _11A_Zellweger and _11B as separate Disease entries at exactly this granularity,
  alongside the Peroxisome_Biogenesis_Disorder and Zellweger_Spectrum_Disorders parents,
  and the 4A/4B and 11A/11B pairs are the direct analogue of the 6A/6B pair. Nothing in
  kb/ binds MONDO:0013936 or names "peroxisome biogenesis disorder 6", so this duplicates
  nothing.

  PBD6B is deliberately NOT folded in as a has_subtypes row. On the 4A/4B precedent it
  would be a separate entry, and there is a substantive reason beyond consistency: the
  severity bands here are defined by residual function, and the survey that establishes
  that distinction found systematically different mutational classes in the two groups.
  Collapsing them would lose that. The third band at this locus, the late-onset ataxic
  form, is carried as a differential for the same reason.

  Two limitations of the curation are worth naming, because both concern how the evidence
  in this entry should be weighed and neither can be expressed structurally.

  First, sample size. The genotype-phenotype claim that separates 6A from 6B rests on four
  severe-band patients and one mild-band patient. The prevalence evidence item quotes the
  sentence that carries the number rather than a cleaner summary sentence, so a reader
  meets the denominator without having to look for it.

  Second, method reliability. The functional complementation assay behind every
  residual-activity statement about PEX10 was described by its own authors as seriously
  flawed. dismech's EvidenceItem has no slot for a method caveat, so the caveat is carried
  three ways instead: inside the quoted snippet (chosen whole rather than trimmed to its
  supportive clause), in the explanation, and as its own knowledge gap. A reader who only
  reads the node summary would not see it, which is the gap.

  Neuronal migration defect is bound to HP:0002269 (Abnormality of neuronal migration)
  rather than to a specific malformation term. The severe ZSD literature reports
  perisylvian polymicrogyria, but the GeneReviews sentence quoted here says only "neuronal
  migration defects", and binding the narrower term would assert more than the cited
  sentence supports.

  No animal models and no biochemical section. Neither is an omission of available content:
  no PEX10-specific animal model is reported in the sources cited here, and the
  peroxisomal biochemical panel is gene-agnostic and belongs on the spectrum entry.

  The deep-research report generated for this entry is committed alongside it under
  research/. Reference selection and every snippet were taken from the fetched reference
  cache rather than from the report.

- name: Failure of PEX5 Receptor Recycling
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    PEX5 carries matrix cargo to the peroxisome and must be ubiquitinated to be recycled
    rather than degraded. The RING peroxins supply that ubiquitin-ligase activity. This
    node is PROVISIONAL rather than ESTABLISHED because the demonstration is in yeast: the
    human step is inferred from a conserved architecture, and no source cited here measures
    PEX5 handling in PEX10-deficient human cells. The node is carried rather than dropped
    because it is the accepted account of why the import machinery fails, and because
    stating it as a node makes the inference visible instead of burying it in prose.
  cellular_components:
  - preferred_term: peroxisomal membrane
    term:
      id: GO:0005778
      label: peroxisomal membrane
  evidence:
  - reference: PMID:19687296
    reference_title: "Pex2 and pex12 function as protein-ubiquitin ligases in peroxisomal protein import."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      While polyubiquitinated Pex5 is degraded by the proteasome, monoubiquitinated Pex5 is
      destined for a new round of the receptor cycle.
    explanation: >-
      States the recycle-or-degrade switch this node describes. Yeast, hence INDIRECT.
  downstream:
  - target: Failure of Peroxisomal Matrix Protein Import
    description: >-
      A receptor that cannot be recycled cannot deliver further cargo.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:19687296
      reference_title: "Pex2 and pex12 function as protein-ubiquitin ligases in peroxisomal protein import."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The PTS1-dependent peroxisomal matrix protein import is facilitated by the receptor
        protein Pex5 and can be divided into cargo recognition in the cytosol, membrane
        docking of the cargo-receptor complex, cargo release, and recycling of the receptor.
      explanation: >-
        Places recycling as the final step of the import cycle, which is what makes its
        failure a cause of import failure. INDIRECT: yeast, and the step from a stalled
        cycle to the observed human import defect is not measured here.
- name: Failure of Peroxisomal Matrix Protein Import
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Peroxisomes are assembled and populated with membrane proteins but receive no matrix
    enzymes. The result is an organelle that exists and is empty, which is why the
    biochemical consequences are simultaneous across every peroxisomal pathway rather than
    confined to one. This is also the defect shared by every PBD complementation group, and
    it is what makes them one disease class.

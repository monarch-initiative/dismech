prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    PEX10 is one of the rarer complementation groups within an already rare spectrum. Two
    severe-band series exist and they are of different sizes: the founding
    genotype-phenotype survey assembled four Zellweger-phenotype PEX10 patients, and a
    Japanese survey reported eleven, all sharing a founder allele. The Japanese survey also
    gives a population rate, but it is for peroxisome biogenesis disorders as a whole in
    Japan rather than for PBD6A, so it is recorded as context rather than as this entry's
    prevalence.

    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, a more mildly affected PEX10-deficient neonatal adrenoleukodystrophy
      patient expressed a PEX10 allele with a missense mutation, H290Q, affecting the
      C-terminal zinc-binding domain of the PEX10 product.
    explanation: >-
      The genotype in the mild band, contrasted with the truncating alleles of the severe
      band in the same survey.
  - reference: PMID:28784167
    reference_title: "Identification of a novel mutation in PEX10 in a patient with attenuated Zellweger spectrum disorder: a case report."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a case of a patient with Zellweger spectrum disorder due to a novel mutation
      in the PEX10 gene, presenting with a mild late-onset neurological phenotype.
    explanation: >-
      A worked attenuated PEX10 case, which is what this differential row describes. Its
      value here is showing how far the milder band departs from this entry: presentation at
      age five with hearing impairment rather than at birth with hypotonia and seizures.
- name: PEX10-related ataxic form
  description: >-
    The mildest reported band at this locus: a late-onset cerebellar syndrome with mild
    intellectual impairment, described with mydriasis, hyperreflexia and involuntary head
    movement. It is the same gene reaching adulthood, and it is what makes PEX10 span the
    full severity range of the spectrum.
  distinguishing_features:
  - Adult presentation with cerebellar ataxia rather than neonatal multisystem disease
  - Compound heterozygosity including alleles that retain function
  evidence:

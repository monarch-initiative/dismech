progression:
- phase: First year of life - death without developmental progress
  notes: >-
    This is the prognostic fact that defines the severe band and separates it from PBD6B and
    the ataxic form at the same locus. It also explains the shape of the treatments section:
    the neurological outcome is determined by a migration defect completed before birth, so
    post-natal management is directed at comfort, feeding and the liver rather than at
    development.
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Infants with severe ZSD are significantly impaired and typically die during the first
      year of life, usually having made no developmental progress.
    explanation: >-
      States survival and developmental outcome for the severe band, which is the band this
      entry is scoped to.

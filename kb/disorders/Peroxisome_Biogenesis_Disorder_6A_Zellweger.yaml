name: Peroxisome Biogenesis Disorder 6A (Zellweger)
creation_date: "2026-09-10T00:00:00Z"
category: Mendelian
description: >-
  Peroxisome biogenesis disorder 6A is the severe, classic-Zellweger end of the
  PEX10-related Zellweger spectrum. PEX10 encodes peroxin-10, a peroxisomal membrane
  protein with a C-terminal C3HC4 RING finger. In yeast, each of the three RING peroxins -
  Pex2, Pex10 and Pex12 - has ubiquitin-ligase activity towards Pex5, the matrix-protein
  receptor, and that ubiquitination is what determines whether the receptor is recycled or
  degraded. The human counterpart is inferred from that conserved architecture rather than
  demonstrated directly in the sources cited here, which is why the receptor-recycling node
  below is typed PROVISIONAL. Without a functional RING module the import cycle stalls.

  The cell-biological signature is what makes this a disorder of biogenesis rather than
  of any single peroxisomal enzyme, and it was established directly in patient cells: a
  PEX10-deficient Zellweger fibroblast line contains plenty of peroxisomes and imports
  peroxisomal membrane proteins perfectly well, but imports essentially no matrix
  proteins. The organelle is built and then left empty, so every matrix enzyme is missing
  at once. Very-long-chain fatty acid oxidation, plasmalogen synthesis and bile-acid
  intermediate processing all fail together, and the resulting damage to the developing
  brain, liver and kidney is largely complete before birth.

  What separates 6A from 6B at the same locus is how much peroxin-10 function the genotype
  leaves, and unusually for a spectrum disorder that claim rests on a direct
  genotype-phenotype survey rather than on inference: all four PEX10-deficient Zellweger
  patients in the founding survey carried nonsense, frameshift or splice alleles removing
  large parts of the coding region, while the one mildly affected patient carried a
  missense allele in the zinc-binding domain. The gene also reaches a third, much milder
  band at the other extreme, a late-onset ataxic form, so PEX10 spans the whole spectrum
  from neonatal lethality to adult-onset cerebellar disease.

  A caution belongs in this entry rather than in a footnote. The functional complementation
  assay that quantifies residual PEX10 activity was reported by its own authors to have
  serious flaws, after it returned nearly normal activity for alleles predicted to delete
  most of the protein. The severity-versus-residual-function account survives that, because
  it is supported independently by the mutational classes seen in the two phenotype groups,
  but any specific residual-activity number for a PEX10 allele should be treated with the
  caution its authors asked for.

  The gene-agnostic downstream cascade shared by the whole spectrum is curated on the
  Zellweger Spectrum Disorders entry. What is carried here is what is PEX10-specific and
  what is specific to the severe band.
synonyms:
- PBD6A
- PEX10-related Zellweger syndrome
- peroxisome biogenesis disorder, complementation group B
- peroxisome biogenesis disorder, complementation group 7
- Zellweger syndrome due to PEX10 deficiency

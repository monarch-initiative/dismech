- name: Biallelic Severe PEX10 Genotype
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Both PEX10 alleles carry variants that remove or truncate the protein, in particular
    the C-terminal C3HC4 RING finger that carries its function. PBD6A is the subset of the
    PEX10 allelic series in which essentially no functional peroxin-10 is left, and that
    residual-function threshold, rather than gene identity, is what separates this entry
    from PBD6B and from the ataxic form at the same locus.

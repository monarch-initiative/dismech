diagnosis:
- name: Biochemical Peroxisomal Screen
  description: >-
    Plasma very-long-chain fatty acids with the ancillary peroxisomal analytes. Because the
    lesion is in biogenesis rather than in one enzyme, several pathways are abnormal
    together, which is what points to a PBD rather than to a single-enzyme peroxisomal
    disorder.
  evidence:
  - reference: PMID:26750748
    reference_title: "Peroxisome biogenesis disorders in the Zellweger spectrum: An overview of current diagnosis, clinical manifestations, and treatment guidelines."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Recent advances in biochemical methods for newborn screening and genetic testing have
      provided unprecedented opportunities for identifying patients at the earliest possible
      time and defining the molecular bases for their diseases.
    explanation: >-
      Supports biochemical screening as the entry route. INDIRECT: the quote states that
      such methods exist and are used, rather than naming the analytes.
- name: PEX Gene Panel Sequencing
  description: >-
    Molecular confirmation, which for this entry means identifying biallelic PEX10
    variants. Sequencing has replaced the cell-fusion complementation grouping through
    which the gene was originally found.
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of ZSD is established in a proband with the suggestive clinical and
      biochemical findings above by identification of biallelic pathogenic variants in one
      of the 13 known ZSD-PEX genes.
    explanation: States the confirmatory test and the gene set it covers.
treatments:
- name: Symptomatic and Supportive Management
  description: >-
    There is no disease-modifying therapy. Management is symptomatic across the affected
    organs, and in the severe band its aims are comfort and feeding rather than
    modification of the neurological outcome, which was determined before birth.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Treatment of manifestations: The focus is on symptomatic therapy and may include
      gastrostomy to provide adequate calories, hearing aids, cataract removal, glasses to
      correct refractive errors, supplementation of fat-soluble vitamins, and cholic acid
      supplementation
    explanation: >-
      States the management approach and its components for the spectrum. Note the
      list is spectrum-wide: several items (hearing aids, refractive correction) are
      relevant to the milder bands rather than to this entry, and the entry does not
      curate them as separate treatments here. The modality is OTHER rather than
      BEHAVIORAL: this row spans gastrostomy, surgery and vitamin supplementation, none of
      which is a behavioural intervention.
- name: Oral Cholic Acid
  description: >-
    The only therapy approved for Zellweger spectrum disorders, and the one item in the
    management list that acts on a mechanism rather than on a symptom. Loss of peroxisomal
    function disrupts bile acid synthesis, and the resulting liver disease can progress to
    cirrhosis within the first year - which for the severe band is the same window in which
    most affected infants die. It is adjunctive and it does not address the neurological
    outcome, which was determined before birth.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:34521419
    reference_title: "Cholbam® and Zellweger spectrum disorders: treatment implementation and management."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      In the absence of functional peroxisomes, bile acid synthesis is disrupted, and
      multisystem disease ensues with abnormalities in the brain, liver, kidneys, muscle,
      eyes, ears, and nervous system.
    explanation: >-
      Gives the mechanistic rationale, and ties it to the matrix-import failure this entry
      curates rather than to a symptom.
  - reference: PMID:34521419
    reference_title: "Cholbam® and Zellweger spectrum disorders: treatment implementation and management."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Liver disease may play an important role in morbidity and mortality, with hepatic
      fibrosis that can develop as early as the postnatal period and often progressing to
      cirrhosis within the first year of life.
    explanation: >-
      Establishes why the liver is the target, and on what timescale. For an entry whose
      progression section records death within the first year, that timing matters.
differential_diagnoses:
- name: Peroxisome biogenesis disorder 6B
  description: >-
    The milder band at the same locus. Distinguished not by gene but by residual peroxin-10
    function: the reported mildly affected patient carried a missense allele in the
    zinc-binding domain rather than the truncating alleles seen in the severe band.
  distinguishing_features:
  - No congenital malformations; progressive rather than static disease
  - At least one allele retaining residual peroxin-10 function
  - Survival beyond infancy
  evidence:
  - reference: PMID:10862081

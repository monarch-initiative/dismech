  - reference: PMID:10862081
    reference_title: "Phenotype-genotype relationships in PEX10-deficient peroxisome biogenesis disorder patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "All four PEX10-deficient Zellweger Syndrome (ZS) patients were found to have nonsense, frameshift, or splice site mutations that remove large portions of the PEX10 coding region."
    explanation: >-
      Quoted here for its denominator rather than its genotype claim. Four is the entire
      severe-band population of that survey, and that is the number a reader should have in
      mind for the genotype-phenotype statements it supports.
  - reference: PMID:12794690
    reference_title: "Genetic heterogeneity of peroxisome biogenesis disorders among Japanese patients: evidence for a founder haplotype for the most common PEX10 gene mutation."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

notes: >-
  Nomenclature flux: INTU-related OFD was initially classified within the "OFD
  type VI" group (Bruel et al., 2018, PMID:29451301) on the basis of the
  molar-tooth-sign / polydactyly phenotype, but OMIM and MONDO now anchor the
  INTU-specific disorder as a distinct entity, orofaciodigital syndrome 17
  (OFD17 / OFD XVII; OMIM:617926; MONDO:0033375). This entry is kept distinct
  from the OFD1-caused Orofaciodigital_Syndrome_Type_I (OFD1 gene). OFD17 is one
  branch of the broader INTU allelic spectrum, which also includes short-rib
  thoracic dysplasia 20 with polydactyly (SRTD20) and nephronophthisis; only a
  handful of OFD17 families have been reported, so phenotype frequencies are not
  yet well established and `frequency:` qualifiers are intentionally omitted.
prevalence:
- population: Published clinical reports (global)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Orofaciodigital syndrome 17 is an ultra-rare autosomal recessive ciliopathy
    with no population-based prevalence estimate; as of the 2022 clinical report
    by Yakar and Tatar, only three families with OFDS XVII had been described in
    the published literature (alongside two patients with INTU-related short-rib
    thoracic dysplasia 20 with polydactyly and one patient with INTU-related
    nephronophthisis).
  evidence:
  - reference: PMID:34623732
    reference_title: "INTU-related oral-facial-digital syndrome XVII: Clinical spectrum of a rare disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      INTU pathogenic variants have been reported in two patients with OFDS XVII,
      in two patients with short-rib thoracic dysplasia-20 with polydactyly
      (SRTD20), and one with nephronophthisis so far. We report the third family in
      the literature with OFDS XVII, with urogenital malformations as an additional
      finding.
    explanation: >-
      Documents that only three families with OFDS XVII have been reported in the
      medical literature, establishing its ultra-rare status.
progression:
- phase: Congenital and neonatal presentation
  age_range: Congenital to neonatal
  notes: >-
    Structural oral (lingual hamartoma/tongue nodules, high palate), craniofacial,
    digital (preaxial and postaxial polydactyly), cardiac, renal/urogenital, and
    midbrain-hindbrain (molar tooth sign) malformations arise during embryonic
    organogenesis and are present at birth, whereas global developmental delay is
    recognized during infancy and childhood.
  evidence:
  - reference: PMID:29451301
    reference_title: "INTU-related oral-facial-digital syndrome type VI: A confirmatory report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe here a child with preaxial and postaxial polydactyly, lingual
      hamartoma, a congenital heart defect, delayed development and cerebellar
      peduncles displaying the molar tooth sign.
    explanation: >-
      Documents the congenital structural malformations (polydactyly, lingual
      hamartoma, congenital heart defect, molar tooth sign) and pediatric
      developmental delay characteristic of INTU-related OFD syndrome.
  - reference: PMID:34623732
    reference_title: "INTU-related oral-facial-digital syndrome XVII: Clinical spectrum of a rare disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      OFDS XVII is a recently described subtype of OFDS that presents with
      developmental delay, facial dysmorphism, high palate, tongue nodules, brain
      malformations, cardiac anomaly, polydactyly, renal malformation, and various
      other findings.
    explanation: >-
      Summarizes the congenital malformation spectrum and developmental delay
      across reported OFDS XVII patients.

review_notes: >-
  This review synthesizes the published human clinical literature on INTU-related
  orofaciodigital syndrome 17 (PMID:28289185, PMID:29451301, PMID:34623732),
  representing the three reported OFDS XVII families, together with experimental
  characterization of INTU/CPLANE basal-body localization and ciliogenesis
  function (PMID:29581513). High-value sections added or enriched in this review
  include prevalence (CASES_IN_LITERATURE / ULTRA_RARE), congenital/neonatal
  progression, molecular and neuroimaging diagnosis, evidence-backed
  classifications and differential diagnoses (including OFD type I, the OFD type
  VI / Joubert spectrum, and allelic SRTD20), causal gene-to-mechanism grounding
  for INTU (hgnc:29239) via GO biological process and cellular component
  annotations, and downstream causal wiring from the Multisystem Pleiotropic
  Ciliopathy Phenotype node to all eight curated phenotypes. No disease-specific
  public transcriptomic or genomic dataset accession was identified in
  GEO/ArrayExpress for OFDS XVII, so datasets is explicitly set to an empty list.

diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Definitive diagnosis of orofaciodigital syndrome 17 requires molecular genetic
    testing (such as whole-exome sequencing or multigene ciliopathy panel
    sequencing) demonstrating biallelic pathogenic variants in INTU, which
    distinguishes OFDS XVII from the numerous other genetically heterogeneous
    oral-facial-digital and Joubert syndrome subtypes.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: >-
    Identification of homozygous or compound heterozygous pathogenic variants in
    INTU confirms the diagnosis.
  evidence:
  - reference: PMID:29451301
    reference_title: "INTU-related oral-facial-digital syndrome type VI: A confirmatory report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing and SNP array identified compound heterozygous
      variants in the INTU gene, which encodes a protein involved in the positioning
      of the ciliary basal body.
    explanation: >-
      Demonstrates that whole-exome sequencing and chromosomal microarray establish
      the molecular diagnosis of INTU-related OFD syndrome.
  - reference: PMID:28289185
    reference_title: "Fifteen years of research on oral-facial-digital syndromes: from 1 to 16 causal genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we present all our published and unpublished results for WES in 24
      cases with OFDS. We identified causal variants in five new genes (C2CD3,
      TMEM107, INTU, KIAA0753 and IFT57)
    explanation: >-
      Establishes whole-exome sequencing as the diagnostic modality identifying
      causal INTU variants in patients with oral-facial-digital syndrome.
- name: Brain Magnetic Resonance Imaging
  description: >-
    Brain MRI is indicated in the diagnostic evaluation of suspected INTU-related
    orofaciodigital syndrome to assess for hindbrain and cerebral malformations,
    particularly thickened and elongated superior cerebellar peduncles producing
    the molar tooth sign.
  diagnosis_term:
    preferred_term: brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: >-
    Axial neuroimaging may demonstrate cerebellar peduncle malformation with the
    molar tooth sign and associated cerebral anomalies.
  evidence:
  - reference: PMID:29451301
    reference_title: "INTU-related oral-facial-digital syndrome type VI: A confirmatory report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe here a child with preaxial and postaxial polydactyly, lingual
      hamartoma, a congenital heart defect, delayed development and cerebellar
      peduncles displaying the molar tooth sign.
    explanation: >-
      Documents the use of neuroimaging to detect the molar tooth sign in an
      INTU-related OFD patient.
treatments:
- name: Supportive and Multidisciplinary Care
  description: >-
    Management of OFD17 is supportive and symptomatic, coordinated across genetics,
    neurology, cardiology, nephrology, and craniofacial/orthopedic services to
    address the multisystem malformations and developmental delay.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Genetic Counseling
  description: >-
    Genetic counseling is indicated for families given the autosomal recessive
    inheritance and 25% sibling recurrence risk; molecular confirmation of
    biallelic INTU variants supports recurrence-risk counseling and reproductive
    options.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
differential_diagnoses:
- name: Orofaciodigital Syndrome Type I
  disease_term:
    preferred_term: orofaciodigital syndrome I
    term:
      id: MONDO:0010702
      label: orofaciodigital syndrome I
  description: >-
    OFD1 (the most frequent OFD subtype, caused by heterozygous variants in the
    X-linked OFD1 gene) shares the orofaciodigital triad of facial, oral, and
    digital anomalies as well as renal and cerebral malformations, but differs in
    gene, inheritance (X-linked dominant with male lethality), and the absence of
    the autosomal recessive INTU/CPLANE mechanism.
  distinguishing_features:
  - Heterozygous pathogenic variants in the X-linked OFD1 gene establish OFD type I, whereas biallelic pathogenic variants in INTU establish OFD17.
  - OFD type I follows X-linked dominant inheritance with typical male lethality, whereas OFD17 is autosomal recessive and affects both males and females.
  evidence:
  - reference: PMID:28289185
    reference_title: "Fifteen years of research on oral-facial-digital syndromes: from 1 to 16 causal genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequent, OFD type I, is caused by a heterozygous mutation in the
      OFD1 gene encoding a centrosomal protein. The wide clinical heterogeneity of
      OFDS suggests the involvement of other ciliary genes.
    explanation: >-
      Contrasts the most frequent OFD subtype (OFD type I, caused by heterozygous
      OFD1 mutations) with the other genetically distinct ciliary OFDS subtypes
      including INTU-related OFDS.
- name: Joubert Syndrome and Orofaciodigital Syndrome Type VI
  disease_term:
    preferred_term: orofaciodigital syndrome type 6
    term:
      id: MONDO:0010176
      label: orofaciodigital syndrome type 6
  description: >-
    Joubert syndrome and orofaciodigital syndrome type VI (Varadi-Papp syndrome, most
    commonly caused by CPLANE1/C5orf42 variants) share the molar tooth sign on brain
    MRI, lingual hamartomas, and preaxial/postaxial polydactyly; INTU-related OFD
    was initially grouped clinically within the OFD type VI spectrum before being
    delineated by genotype as OFD17.
  distinguishing_features:
  - Molecular genetic testing identifies biallelic pathogenic variants in INTU in OFD17 rather than CPLANE1 (C5orf42), TMEM216, or other Joubert/OFD6 genes.
  evidence:
  - reference: PMID:29451301
    reference_title: "INTU-related oral-facial-digital syndrome type VI: A confirmatory report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report of a second patient with INTU-related OFD syndrome and the
      further delineation of its neuroimaging and skeletal phenotype now allow
      INTU-related OFD syndromes to be classified within the OFD syndrome type VI
      group.
    explanation: >-
      Documents the close clinical and neuroimaging overlap between INTU-related
      OFD17 and the OFD syndrome type VI / Joubert spectrum.
- name: Short-Rib Thoracic Dysplasia 20 with Polydactyly
  disease_term:
    preferred_term: INTU-related skeletal ciliopathy
    term:
      id: MONDO:1060154
      label: INTU-related skeletal ciliopathy
  description: >-
    Short-rib thoracic dysplasia 20 with polydactyly (SRTD20) is an allelic
    autosomal recessive disorder also caused by biallelic pathogenic variants in
    INTU; it shares polydactyly, oral/craniofacial findings, and renal/visceral
    ciliopathy manifestations with OFD17 but is distinguished clinically by severe
    thoracic constriction and short-rib skeletal dysplasia.
  notes: >-
    Bound to MONDO:1060154 (INTU-related skeletal ciliopathy), the per-locus
    MONDO umbrella term for the INTU skeletal ciliopathy spectrum, as no
    SRTD20-specific MONDO term is present in the ontology cache.
  distinguishing_features:
  - Prominent narrow thorax, short ribs, and severe skeletal ciliopathy features characterize SRTD20, whereas OFD17 presents primarily with the orofaciodigital malformation complex, congenital heart defect, and molar tooth sign without lethal thoracic dystrophy.
  evidence:
  - reference: PMID:34623732
    reference_title: "INTU-related oral-facial-digital syndrome XVII: Clinical spectrum of a rare disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      INTU pathogenic variants have been reported in two patients with OFDS XVII,
      in two patients with short-rib thoracic dysplasia-20 with polydactyly
      (SRTD20), and one with nephronophthisis so far.
    explanation: >-
      Identifies short-rib thoracic dysplasia 20 with polydactyly (SRTD20) and
      nephronophthisis as the allelic disorders within the INTU-related ciliopathy
      spectrum that must be distinguished clinically from OFDS XVII.

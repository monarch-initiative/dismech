- name: Allogeneic hematopoietic cell transplantation
  description: >-
    Allogeneic HCT replaces the CD40LG-mutant hematopoietic system with donor
    cells that express functional CD40 ligand, and is the only curative treatment.
    Outcome depends heavily on timing: it should be performed before age ten years
    and before liver disease develops. In the largest cohort, overall survival did
    not differ between transplanted and non-transplanted patients across all
    diagnosis years, though transplant-associated hazard fell markedly from the
    late 1990s and survivors of transplantation had better performance scores.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Loss of Functional CD40 Ligand on Activated CD4+ T Cells
    treatment_effect: RESTORES
    description: >-
      Donor-derived T cells carry a wild-type CD40LG allele, restoring functional
      CD40 ligand expression and therefore both the B-cell help and the
      macrophage/dendritic-cell licensing arms of the mechanism.
    evidence:
    - reference: PMID:20301576
      reference_title: CD40 Ligand Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Hematopoietic stem cell transplantation (the only curative treatment
        currently available) is ideally performed before age ten years or prior to
        evidence of organ dysfunction.
      explanation: >-
        Identifies HCT as the only curative option, i.e. the only intervention
        that corrects rather than compensates for the underlying defect, and
        states the timing constraint.
  evidence:
  - reference: PMID:27697500
    reference_title: "Long-term outcomes of 176 patients with X-linked hyper-IgM syndrome treated with or without hematopoietic cell transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No difference in overall survival was observed between patients treated
      with or without HCT (P = .671).
    explanation: >-
      Qualifies the curative claim: across all diagnosis years the largest cohort
      found no overall survival advantage for transplantation.
  - reference: PMID:27697500
    reference_title: "Long-term outcomes of 176 patients with X-linked hyper-IgM syndrome treated with or without hematopoietic cell transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, risk associated with HCT decreased for diagnosis years 1987-1995;
      the hazard ratio was significantly less than 1 for diagnosis years
      1995-1999.
    explanation: >-
      Documents the improving risk profile of transplantation over time, which is
      the basis for continuing to offer it.
  - reference: PMID:27697500
    reference_title: "Long-term outcomes of 176 patients with X-linked hyper-IgM syndrome treated with or without hematopoietic cell transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among patients receiving HCT, 27 (40%) had graft-versus-host disease, and
      most deaths occurred within 1 year of transplantation.
    explanation: >-
      Records the substantial transplant-related morbidity that qualifies the
      decision to transplant.

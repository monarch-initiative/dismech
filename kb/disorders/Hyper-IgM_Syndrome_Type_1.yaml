- name: Failed CD40-Dependent Licensing of Macrophages and Dendritic Cells
  biological_scale: CELLULAR
  description: >-
    CD40L is required not only for B-cell help but for T-cell-mediated activation
    of the mononuclear phagocyte system. In its absence, patient monocyte-derived
    macrophages show defective fungicidal activity, a reduced oxidative burst,
    impaired inflammatory cytokine production, a globally dysregulated
    transcriptome, and failure to control Mycobacterium tuberculosis. Because
    these defects are largely corrected in vitro by exogenous IFN-gamma rather
    than by soluble CD40L, the block is downstream of the T-cell-macrophage
    conversation. This arm of the mechanism is why the disorder is a combined
    immunodeficiency and why the characteristic infections are opportunistic.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  biological_processes:
  - preferred_term: macrophage activation
    term:
      id: GO:0042116
      label: macrophage activation
    modifier: DECREASED
  - preferred_term: T cell costimulation
    term:
      id: GO:0031295
      label: T cell costimulation
    modifier: DECREASED
  evidence:
  - reference: PMID:27554817
    reference_title: "Human CD40 ligand deficiency dysregulates the macrophage transcriptome causing functional defects that are improved by exogenous IFN-γ."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Macrophages from CD40L-deficient patients exhibited defective fungicidal
      activity and reduced oxidative burst, both of which improved in the presence
      of rhIFN-γ but not sCD40L.
    explanation: >-
      Documents the specific macrophage functional defects caused by CD40L
      absence and their partial rescue by IFN-gamma.
  - reference: PMID:27554817
    reference_title: "Human CD40 ligand deficiency dysregulates the macrophage transcriptome causing functional defects that are improved by exogenous IFN-γ."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The absence of CD40L dysregulated the macrophage transcriptome, which was
      improved by rhIFN-γ.
    explanation: >-
      Establishes a transcriptome-wide macrophage program defect attributable to
      CD40L loss.
  - reference: PMID:27554817
    reference_title: "Human CD40 ligand deficiency dysregulates the macrophage transcriptome causing functional defects that are improved by exogenous IFN-γ."
    supports: SUPPORT

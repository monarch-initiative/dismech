- name: Cryptosporidium-Associated Biliary Tract Injury
  biological_scale: TISSUE
  description: >-
    Persistent Cryptosporidium infection of the biliary epithelium drives chronic
    cholangiocyte injury and progressive fibro-obliterative bile duct disease
    (sclerosing cholangitis), and the resulting chronic inflammation is the
    presumed substrate for biliary-tract malignancy. Liver disease is the single
    strongest predictor of mortality in this disorder, and hematopoietic cell
    transplantation performed before its onset is the principal way to prevent it.
  locations:
  - preferred_term: bile duct
    term:
      id: UBERON:0002394
      label: bile duct
  evidence:
  - reference: PMID:14663287
    reference_title: "The X-linked hyper-IgM syndrome: clinical and immunologic features of 79 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sclerosing cholangitis occurred in 5 patients and in 4 of these was
      associated with Cryptosporidium infection.
    explanation: >-
      Documents the association of sclerosing cholangitis with Cryptosporidium
      infection in a registry cohort.
  - reference: PMID:27697500
    reference_title: "Long-term outcomes of 176 patients with X-linked hyper-IgM syndrome treated with or without hematopoietic cell transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Liver disease was a significant predictor of overall survival (hazard
      ratio, 4.9; 95% confidence limits, 2.2-10.8; P < .001).
    explanation: >-
      Quantifies the mortality impact of the hepatobiliary arm of the disease.
  downstream:
  - target: Sclerosing cholangitis
    causal_link_type: DIRECT
    description: >-
      Chronic cryptosporidial cholangiocyte infection produces the sclerosing
      cholangitis phenotype.
    evidence:

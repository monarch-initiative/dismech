    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, a severe depletion of follicular dendritic cells, recognized by
      Abs against NGFR, CD21 and CD23, and lack of expression of the Ag
      recognized by KiM4p on these cells, are noticed.
    explanation: >-
      Documents the severe follicular dendritic cell depletion in patient lymphoid
      tissue.
  - reference: PMID:7539026
    reference_title: "Immunohistologic analysis of ineffective CD40-CD40 ligand interaction in lymphoid tissues from patients with X-linked immunodeficiency with hyper-IgM. Abortive germinal center cell reaction and severe depletion of follicular dendritic cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prominent primary B follicles are identified in the lymph nodes and in the
      extranodal lymphoid tissues from both cases
    explanation: >-
      Shows follicles arrested at the primary stage, i.e. germinal centers failing
      to form.
  downstream:
  - target: Decreased class-switched memory B cell proportion
    causal_link_type: DIRECT
    description: >-
      The germinal center is where class-switched memory B cells are generated;
      an abortive germinal center reaction leaves this compartment markedly
      reduced.
    evidence:
    - reference: PMID:20301576
      reference_title: CD40 Ligand Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Total numbers of B cells are normal but there is a marked reduction of
        class-switched memory B cells.
      explanation: >-
        Documents the depleted class-switched memory B-cell compartment that

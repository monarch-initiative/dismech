treatments:
- name: Immunoglobulin replacement therapy
  description: >-
    Intravenous or subcutaneous immunoglobulin replacement substitutes the IgG the
    patient cannot make and is the cornerstone of non-curative management. It was
    used in 95% of patients in the largest reported cohort.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Defective Immunoglobulin Class Switch Recombination
    treatment_effect: BYPASSES
    description: >-
      Exogenous pooled IgG supplies the switched isotype the patient's B cells
      cannot generate. It does not restore class switch recombination; it
      substitutes for its product.
    evidence:
    - reference: PMID:20301576
      reference_title: CD40 Ligand Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Ig replacement therapy (either intravenous or subcutaneous)
      explanation: >-
        GeneReviews identifies immunoglobulin replacement as treatment of
        manifestations, i.e. substitution for the missing switched isotypes.
  evidence:
  - reference: PMID:9255191
    reference_title: Clinical spectrum of X-linked hyper-IgM syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients received regular infusions of immunoglobulins.
    explanation: >-
      Documents universal use of immunoglobulin replacement in a 56-patient
      cohort.
- name: Pneumocystis jirovecii pneumonia prophylaxis
  description: >-
    Antimicrobial prophylaxis against Pneumocystis jirovecii, conventionally with
    trimethoprim-sulfamethoxazole, is standard from the time of diagnosis because
    Pneumocystis pneumonia is frequently the presenting and a potentially fatal
    infection. It was reported in 75% of patients in the largest cohort, including
    a quarter of patients who were not receiving it despite Pneumocystis having
    been their presenting illness.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: trimethoprim
      term:
        id: CHEBI:45924
        label: trimethoprim
    - preferred_term: sulfamethoxazole
      term:
        id: CHEBI:9332
        label: sulfamethoxazole
  target_phenotypes:

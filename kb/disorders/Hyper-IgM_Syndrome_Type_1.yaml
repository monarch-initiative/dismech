classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      CD40 ligand deficiency is an inborn error of immunity (primary
      immunodeficiency) and belongs with the disorders of the immune system.
    evidence:
    - reference: PMID:27697500
      reference_title: "Long-term outcomes of 176 patients with X-linked hyper-IgM syndrome treated with or without hematopoietic cell transplantation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        X-linked hyper-IgM syndrome (XHIGM) is a primary immunodeficiency with
        high morbidity and mortality compared with those seen in healthy
        subjects.
      explanation: >-
        Establishes XHIGM as a primary immunodeficiency, an immune-system
        disorder under the immunology/rheumatology Part.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A single-gene X-linked Mendelian disorder caused by hemizygous CD40LG
      pathogenic variants, with genetic counseling and carrier testing central to
      management.
    evidence:
    - reference: PMID:20301576
      reference_title: CD40 Ligand Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CD40 ligand deficiency is inherited in an X-linked manner.
      explanation: >-
        GeneReviews states the Mendelian X-linked basis of the disorder,
        supporting placement in the genetics Part.
  iuis_category:
    classification_value: combined immunodeficiency
    notes: >-
      The IUIS 2022 update places CD40 ligand (CD154) deficiency in Table 1,
      section 3, "Combined Immunodeficiency (CID), Generally Less Profound than
      SCID" - NOT among the predominantly antibody deficiencies of Table 3.
      Despite the immunoglobulin-centric name, the disorder is classified as a
      CID because CD40L is also required to license macrophages and dendritic
      cells, so cell-mediated immunity is impaired alongside the antibody defect.
    evidence:
    - reference: PMID:35748970
      reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        CD40 ligand (CD154) deficiency CD40LG XL 308230
      explanation: >-
        The IUIS classification-table row assigning CD40 ligand (CD154)
        deficiency, gene CD40LG, X-linked, OMIM 308230, within the section
        "3. Combined Immunodeficiency (CID), Generally Less Profound than SCID".
        The quoted row comes from the classification tables in the cached full
        text rather than from the abstract.
    - reference: PMID:27554817
      reference_title: "Human CD40 ligand deficiency dysregulates the macrophage transcriptome causing functional defects that are improved by exogenous IFN-γ."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        CD40 ligand (CD40L) deficiency predisposes to opportunistic infections,
        including those caused by fungi and intracellular bacteria.
      explanation: >-
        Susceptibility to fungal and intracellular bacterial pathogens is a
        cell-mediated-immunity defect, which is the substantive basis for the
        combined-immunodeficiency rather than antibody-deficiency assignment.
inheritance:
- name: X-linked recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    CD40LG lies at Xq26 and the disorder is transmitted as an X-linked recessive
    trait. Affected individuals are essentially always male hemizygotes;
    heterozygous female carriers are typically asymptomatic, although skewed
    X-chromosome inactivation can produce a range of manifestations.
  evidence:
  - reference: PMID:20301576
    reference_title: CD40 Ligand Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous females are typically asymptomatic but may have a range of
      clinical manifestations depending on X-chromosome inactivation.
    explanation: >-
      Documents the X-linked recessive transmission pattern, with carrier females
      generally unaffected.
  - reference: PMID:7678782
    reference_title: "The CD40 ligand, gp39, is defective in activated T cells from patients with X-linked hyper-IgM syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gene encoding gp39 was mapped to Xq26, the X chromosome region where
      the gene responsible for HIM had previously been mapped.
    explanation: >-
      Maps the causative gene to the X chromosome, establishing the X-linked
      basis of the disorder.
prevalence:

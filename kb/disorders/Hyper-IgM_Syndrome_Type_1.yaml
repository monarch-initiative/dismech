name: Hyper-IgM Syndrome Type 1
creation_date: "2026-08-27T01:46:30Z"
category: Genetic
synonyms:
- X-linked hyper-IgM syndrome
- XHIM
- XHIGM
- HIGM1
- CD40 ligand deficiency
- CD40L deficiency
- hyper-IgM syndrome due to CD40 ligand deficiency
- immunodeficiency with hyper IgM type 1
- immunodeficiency 3
- IHIS
description: >-
  Hyper-IgM syndrome type 1 (X-linked hyper-IgM syndrome, CD40 ligand deficiency)
  is an X-linked combined immunodeficiency caused by hemizygous loss-of-function
  variants in CD40LG, which encodes CD40 ligand (CD154), the activation-induced
  surface protein of CD4-positive T cells. Loss of CD40L abolishes engagement of
  CD40 on B cells, so B cells cannot undergo immunoglobulin class switch
  recombination and germinal centers fail to develop: serum IgG, IgA, and IgE are
  very low or absent while IgM is normal or elevated, and class-switched memory B
  cells are markedly reduced. The same molecular lesion abolishes CD40-dependent
  licensing of macrophages and dendritic cells, which is why the disorder behaves
  as a combined rather than a purely antibody deficiency and why affected boys are
  susceptible to opportunistic pathogens, most characteristically Pneumocystis
  jirovecii and Cryptosporidium. Most patients present in the first year of life
  with recurrent sinopulmonary infection, Pneumocystis pneumonia, and protracted
  diarrhea. Chronic neutropenia with oral ulceration is common, and
  Cryptosporidium-associated sclerosing cholangitis and biliary-tract malignancy
  dominate long-term morbidity and mortality. Management combines immunoglobulin
  replacement, Pneumocystis prophylaxis, and G-CSF for neutropenia; allogeneic
  hematopoietic cell transplantation is the only curative option.

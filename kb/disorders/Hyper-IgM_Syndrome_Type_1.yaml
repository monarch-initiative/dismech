    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The estimated minimal incidence was approximately 1/1,030,000 live births.
    explanation: >-
      Provides the registry-based occurrence estimate underlying this prevalence
      record.
genetic:
- name: CD40LG
  gene_term:
    preferred_term: CD40LG
    term:
      id: hgnc:11935
      label: CD40LG
  relationship_type: CAUSATIVE
  inheritance:
  - name: X-linked recessive
    inheritance_term:
      preferred_term: X-linked recessive inheritance
      term:
        id: HP:0001419
        label: X-linked recessive inheritance
  notes: >-
    CD40LG encodes CD40 ligand (CD154, gp39, TRAP), a type II transmembrane
    member of the TNF superfamily expressed on the surface of activated CD4+ T
    cells. Pathogenic variants are hemizygous and loss-of-function: point
    mutations in the extracellular domain that abolish CD40 binding, as well as
    variants causing absent or non-functional surface expression. B cells are
    intrinsically normal and respond to wild-type CD40L, so the defect is a T-cell
    lesion with B-cell consequences.
  evidence:
  - reference: PMID:7679801
    reference_title: "CD40 ligand gene defects responsible for X-linked hyper-IgM syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abnormalities in the CD40L gene were associated with an X-linked
      immunodeficiency in humans [hyper-IgM (immunoglobulin M) syndrome].
    explanation: >-
      Establishes CD40LG as the gene whose defects cause X-linked hyper-IgM
      syndrome.
  - reference: PMID:7679206
    reference_title: "Defective expression of T-cell CD40 ligand causes X-linked immunodeficiency with hyper-IgM."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we present evidence that point mutations in the TRAP gene give rise to
      nonfunctional or defective expression of TRAP on the surface of T cells in
      patients with HIGM1.
    explanation: >-
      Independent identification of loss-of-function point mutations in the
      CD40LG (TRAP) gene as the molecular cause.
  - reference: PMID:7678782
    reference_title: "The CD40 ligand, gp39, is defective in activated T cells from patients with X-linked hyper-IgM syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These patients expressed normal levels of gp39 mRNA, but these mRNAs encode
      defective gp39 proteins owing to mutations in the extracellular domain of
      gp39.
    explanation: >-
      Localizes the pathogenic variants to the extracellular (CD40-binding)
      domain, explaining the loss of function despite preserved transcription.
pathophysiology:
- name: Loss of Functional CD40 Ligand on Activated CD4+ T Cells
  biological_scale: MOLECULAR
  description: >-
    Hemizygous loss-of-function variants in CD40LG leave activated CD4+ T cells
    unable to display functional CD40 ligand (CD154/gp39/TRAP) at the cell
    surface. Some variants abolish surface expression entirely; others permit
    normal transcription but encode extracellular-domain mutants that cannot bind
    CD40. Either way the T cell loses its principal contact-dependent helper
    signal, and every downstream defect in this entry follows from this single
    molecular lesion.
  gene:
    preferred_term: CD40LG
    modifier: DECREASED
    term:
      id: hgnc:11935
      label: CD40LG
  genetic_context:
    gene:
      preferred_term: CD40LG
      term:
        id: hgnc:11935
        label: CD40LG
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Germline hemizygous CD40LG loss-of-function variants in males; the single X
      chromosome leaves no functional allele.
  cell_types:
  - preferred_term: activated CD4+ T helper cell
    term:
      id: CL:0000896
      label: activated CD4-positive, alpha-beta T cell
  evidence:
  - reference: PMID:7679801
    reference_title: "CD40 ligand gene defects responsible for X-linked hyper-IgM syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Activated T cells from the four affected patients failed to express
      wild-type CD40L, although their B cells responded normally to wild-type
      CD40L.
    explanation: >-
      Localizes the primary lesion to the activated T cell and shows the B-cell
      compartment is intrinsically intact.
  - reference: PMID:7679801
    reference_title: "CD40 ligand gene defects responsible for X-linked hyper-IgM syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Recombinant expression of two of the mutant CD40L complementary DNAs
      resulted in proteins incapable of binding to CD40 and unable to induce
      proliferation or IgE secretion from normal B cells.
    explanation: >-
      Demonstrates directly that the mutant proteins are loss-of-function for
      CD40 binding, supporting the functional_impact_category assignment.
  downstream:
  - target: Failed CD40 Engagement on B Cells
    causal_link_type: DIRECT
    description: >-
      Without functional CD40L on the T-cell surface, the cognate receptor CD40
      on the B cell is never engaged during T-B collaboration.
    evidence:
    - reference: PMID:7679206
      reference_title: "Defective expression of T-cell CD40 ligand causes X-linked immunodeficiency with hyper-IgM."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The resultant failure of TRAP to interact with CD40 on functionally
        intact B cells is responsible for the observed immunoglobulin isotype
        defect in HIGM1.
      explanation: >-
        States the direct causal step from absent CD40L to failed CD40
        engagement on otherwise normal B cells.
  - target: Failed CD40-Dependent Licensing of Macrophages and Dendritic Cells
    causal_link_type: DIRECT
    description: >-
      CD40 is also expressed by macrophages and dendritic cells, so the same
      missing ligand removes the T-cell-derived activation signal for the
      mononuclear phagocyte compartment.
    evidence:
    - reference: PMID:27554817
      reference_title: "Human CD40 ligand deficiency dysregulates the macrophage transcriptome causing functional defects that are improved by exogenous IFN-γ."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Absence of CD40L impairs macrophage development and function.
      explanation: >-
        Establishes that loss of CD40L directly compromises macrophage
        development and function, independent of the antibody defect.
  - target: Chronic neutropenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic or intermittent neutropenia is a well-documented consequence of
      CD40L deficiency, but the intervening steps between the CD40LG lesion and
      the granulocyte defect are not established; it responds to G-CSF, which is
      consistent with a myelopoietic rather than a purely peripheral-destruction
      mechanism.
    evidence:
    - reference: PMID:20301576
      reference_title: CD40 Ligand Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Neutropenia is common; thrombocytopenia and anemia are less commonly
        seen.
      explanation: >-
        Documents neutropenia as a common consequence of CD40 ligand deficiency
        without specifying the intermediate mechanism.
- name: Failed CD40 Engagement on B Cells
  biological_scale: CELLULAR
  description: >-
    CD40 is constitutively expressed on B cells and is functional in these
    patients, but it is never cross-linked because its ligand is absent. The
    B cell therefore never receives the contact-dependent second signal that,
    together with cytokines, drives activation, proliferation, differentiation,
    and isotype switching.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: CD40 signaling pathway
    term:
      id: GO:0023035
      label: CD40 signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:7678782
    reference_title: "The CD40 ligand, gp39, is defective in activated T cells from patients with X-linked hyper-IgM syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      B cells from HIM patients express functional CD40, but their T cells do not
      bind CD40-Ig.
    explanation: >-
      Shows the receptor side is intact and the failure is specifically in
      ligand-receptor engagement.
  - reference: PMID:7539026
    reference_title: "Immunohistologic analysis of ineffective CD40-CD40 ligand interaction in lymphoid tissues from patients with X-linked immunodeficiency with hyper-IgM. Abortive germinal center cell reaction and severe depletion of follicular dendritic cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The CD40 ligand (CD40L) is an activation-induced surface membrane protein
      expressed by CD4+ T helper cells in lymphoid follicles, and is involved in
      the contact-dependent signaling-mediated activation, proliferation, and
      differentiation of CD40+ B cells.
    explanation: >-
      Defines the contact-dependent CD40L-CD40 signal to B cells that is lost in
      this disorder.
  downstream:
  - target: Defective Immunoglobulin Class Switch Recombination
    causal_link_type: DIRECT
    description: >-
      CD40 cross-linking is the signal that, in the presence of lymphokines,
      licenses the B cell to switch from IgM to the downstream isotypes.
    evidence:
    - reference: PMID:7679206
      reference_title: "Defective expression of T-cell CD40 ligand causes X-linked immunodeficiency with hyper-IgM."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Crosslinking of CD40 on B cells induces, in the presence of lymphokines,
        immunoglobulin class switching from IgM to IgG, IgA or IgE.
      explanation: >-
        States the direct dependence of class switching on CD40 cross-linking,
        which is what fails here.
  - target: Abortive Germinal Center Reaction with Follicular Dendritic Cell Depletion
    causal_link_type: DIRECT
    description: >-
      Ineffective CD40/CD40L interaction in the lymphoid follicle prevents the
      germinal center reaction from proceeding beyond a primary follicle.
    evidence:
    - reference: PMID:7539026
      reference_title: "Immunohistologic analysis of ineffective CD40-CD40 ligand interaction in lymphoid tissues from patients with X-linked immunodeficiency with hyper-IgM. Abortive germinal center cell reaction and severe depletion of follicular dendritic cells."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        these data support the idea that ineffective CD40/CD40L interactions
        determine both abortive germinal center cell reaction as well as severe
        depletion and phenotypical abnormalities of follicular dendritic cells,
        thus impairing the functional development of B follicles.
      explanation: >-
        Directly links failed CD40/CD40L engagement to the abortive germinal
        center reaction in patient lymphoid tissue.
- name: Defective Immunoglobulin Class Switch Recombination
  biological_scale: CELLULAR
  description: >-
    Deprived of the CD40 signal, the B cell cannot execute isotype switching from
    IgM to IgG, IgA, or IgE. IgM production continues - and is in fact sustained
    or amplified by ongoing antigenic stimulation, particularly at mucosal
    surfaces - so the serum picture is very low or absent IgG, IgA, and IgE with
    normal to elevated IgM. Class-switched memory B cells, which are the product
    of successful switching, are correspondingly reduced.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: class switched memory B cell
    term:
      id: CL:0000972
      label: class switched memory B cell
  biological_processes:
  - preferred_term: immunoglobulin class switch recombination (isotype switching)
    term:
      id: GO:0045190
      label: isotype switching
    modifier: DECREASED
  evidence:
  - reference: PMID:7679801
    reference_title: "CD40 ligand gene defects responsible for X-linked hyper-IgM syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, these CD40L defects lead to a T cell abnormality that results in the
      failure of patient B cells to undergo immunoglobulin class switching.
    explanation: >-
      States the central mechanistic conclusion: the CD40L defect causes failure
      of B-cell class switching.
  - reference: PMID:20301576
    reference_title: CD40 Ligand Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Total numbers of B cells are normal but there is a marked reduction of
      class-switched memory B cells.
    explanation: >-
      Confirms that the defect is in switching rather than in B-cell development,
      and identifies the depleted class-switched memory compartment.
  - reference: PMID:7539026
    reference_title: "Immunohistologic analysis of ineffective CD40-CD40 ligand interaction in lymphoid tissues from patients with X-linked immunodeficiency with hyper-IgM. Abortive germinal center cell reaction and severe depletion of follicular dendritic cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recurrent or persisting antigenic stimulation in mucosal tissues is likely
      to play a major role in determining and maintaining elevated IgM serum
      levels.
    explanation: >-
      Explains why IgM is normal to elevated rather than merely unswitched:
      ongoing mucosal antigenic drive sustains IgM-only plasma cells.
  downstream:
  - target: Decreased circulating IgG concentration
    causal_link_type: DIRECT
    description: >-
      IgG cannot be produced because the switch from IgM to IgG requires the
      CD40-dependent recombination step.
    evidence:
    - reference: PMID:7679206
      reference_title: "Defective expression of T-cell CD40 ligand causes X-linked immunodeficiency with hyper-IgM."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        X chromosome-linked immunodeficiency with hyper-IgM (HIGM1, MIM number
        308230) is a rare disorder characterized by recurrent bacterial
        infections, very low or absent IgG, IgA and IgE, and normal to increased
        IgM and IgD serum levels.
      explanation: >-
        Documents the serum immunoglobulin pattern that results from the
        switching defect.
  - target: Increased circulating IgM level
    causal_link_type: DIRECT
    description: >-
      IgM synthesis is preserved and sustained by continued antigenic stimulation
      while no isotype switching consumes the IgM-committed pool.
    evidence:
    - reference: PMID:7679801
      reference_title: "CD40 ligand gene defects responsible for X-linked hyper-IgM syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This disease is characterized by elevated concentrations of serum IgM and
        decreased amounts of all other isotypes.
      explanation: >-
        Documents elevated IgM with reduction of all switched isotypes, the
        signature of the switching block.
  - target: Recurrent sinopulmonary infections
    causal_link_type: DIRECT
    description: >-
      Absent IgG leaves patients unable to opsonize encapsulated bacteria,
      producing the recurrent upper- and lower-respiratory tract infections that
      typically bring them to attention.
    evidence:
    - reference: PMID:20301576
      reference_title: CD40 Ligand Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CD40 ligand deficiency usually presents in infancy with recurrent upper-
        and lower-respiratory tract bacterial infections
      explanation: >-
        Links the humoral defect to the recurrent sinopulmonary bacterial
        infections that are the usual presentation.
- name: Abortive Germinal Center Reaction with Follicular Dendritic Cell Depletion
  biological_scale: TISSUE
  description: >-
    In patient lymph nodes and extranodal lymphoid tissue, B-cell follicles arrest
    as prominent primary follicles: germinal centers do not form, and the
    follicular dendritic cell network that normally supports affinity maturation
    is severely depleted and phenotypically abnormal. Intrafollicular CD4+ helper
    T cells are present in normal numbers and the paracortical T-cell area is
    architecturally intact, so the lesion is specific to the follicular B-cell
    compartment rather than a global lymphoid failure.
  cell_types:
  - preferred_term: follicular dendritic cell
    term:
      id: CL:0000442
      label: follicular dendritic cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:

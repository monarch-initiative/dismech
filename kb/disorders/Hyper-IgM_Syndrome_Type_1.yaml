  evidence:
  - reference: PMID:20301576
    reference_title: CD40 Ligand Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      antimicrobial prophylaxis for opportunistic infection against Pneumocysitis
      jirovecii pneumonia
    explanation: >-
      Establishes Pneumocystis prophylaxis as a standard component of management.

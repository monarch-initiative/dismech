notes: >-
  Naming and scope. This entry covers hyper-IgM syndrome type 1 specifically -
  the X-linked, CD40LG-mutant form (MONDO:0010626, OMIM 308230). It is one member
  of the broader "hyper-IgM syndrome" grouping (MONDO:0003947), which also
  includes autosomal recessive forms caused by AICDA, UNG, CD40, and others.
  Those are distinct diseases and are out of scope here.

  Classification caveat. The name is misleading about where this disorder sits
  nosologically. IUIS 2022 places CD40 ligand deficiency in Table 1 among the
  combined immunodeficiencies, not in Table 3 with the predominantly antibody
  deficiencies, because CD40L is required for macrophage and dendritic-cell
  licensing as well as for B-cell help. The opportunistic-infection profile
  (Pneumocystis, Cryptosporidium) is the clinical expression of that second arm.

  Diagnostic caveat. Only about half of patients in the US registry had frankly
  elevated serum IgM; a normal IgM does not exclude the diagnosis. IgG deficiency,
  present in all registry patients, is the more reliable laboratory finding.

  Mechanistic gap. The chronic neutropenia of CD40 ligand deficiency is well
  documented and G-CSF-responsive, but the causal path from the CD40LG lesion to
  the granulocyte defect is not established; the corresponding edge is curated as
  INDIRECT_UNKNOWN_INTERMEDIATES rather than assigned a mechanism the literature
  does not support.

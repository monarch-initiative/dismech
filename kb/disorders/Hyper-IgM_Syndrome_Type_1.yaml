    term:
      id: HP:0020102
      label: Pneumocystis jirovecii pneumonia
  target_mechanisms:
  - target: Failed CD40-Dependent Licensing of Macrophages and Dendritic Cells
    treatment_effect: BYPASSES
    description: >-
      Chemoprophylaxis suppresses the organism rather than repairing the
      macrophage and dendritic-cell activation defect that permits it.
    evidence:
    - reference: PMID:20301576
      reference_title: CD40 Ligand Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        antimicrobial prophylaxis for opportunistic infection against Pneumocysitis
        jirovecii pneumonia
      explanation: >-
        GeneReviews prescribes antimicrobial prophylaxis against Pneumocystis, an
        intervention aimed at the pathogen rather than the underlying immune

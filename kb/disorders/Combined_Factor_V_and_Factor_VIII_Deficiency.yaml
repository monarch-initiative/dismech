name: Combined Factor V and Factor VIII Deficiency
creation_date: "2026-10-31T20:30:00Z"
category: Mendelian
synonyms:
- F5F8D
- combined deficiency of factor V and factor VIII
- combined factor V and VIII deficiency
- familial multiple coagulation factor deficiency I
description: >-
  An autosomal recessive bleeding disorder in which plasma factor V and factor
  VIII are reduced together, usually to 5-30% of normal, producing a mild to
  moderate, predominantly mucocutaneous and provoked bleeding tendency. Neither
  coagulation factor gene is mutated. The defect lies in LMAN1 (ERGIC-53) or
  MCFD2, the two subunits of a calcium-dependent cargo receptor that cycles
  between the endoplasmic reticulum and the ER-Golgi intermediate compartment
  and ferries both factors out of the endoplasmic reticulum. Loss of either
  subunit slows secretion of factor V from hepatocytes and of factor VIII from
  endothelial cells, so both circulate at reduced levels. The two genetic types
  are clinically indistinguishable; MCFD2-deficient patients have on average
  somewhat lower factor levels. Bleeding is driven mainly by the factor VIII
  deficit, and the low factor V level may itself be partly protective.
disease_term:
  preferred_term: combined deficiency of factor V and factor VIII
  term:

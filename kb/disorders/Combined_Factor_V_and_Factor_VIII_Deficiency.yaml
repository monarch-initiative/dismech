treatments:
- name: Fresh frozen plasma
  description: >-
    The only source of factor V, since no factor V concentrate is licensed; it
    also supplies factor VIII. Used for significant bleeding or surgery. Where
    factor V is above about 10%, it may be unnecessary.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Fresh Frozen Plasma Transfusion
    term:
      id: NCIT:C116475
      label: Fresh Frozen Plasma Transfusion
  target_mechanisms:
  - target: Reduced Plasma Factor V and Factor VIII
    treatment_effect: RESTORES
    description: >-
      Donor plasma supplies both missing factors.
  evidence:
  - reference: PMID:39209292
    reference_title: "Clinical, Laboratory, Molecular, and Reproductive Aspects of Combined Deficiency of Factors V and VIII."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Fresh frozen plasma (FFP) is a source of both FV and FVIII and serves as a universal therapeutic option for patients with F5F8D."
    explanation: >-
      States the role of fresh frozen plasma.
  - reference: PMID:19598067
    reference_title: "Combined Factor V and Factor VIII Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Treatment of bleeding episodes requires a source of both FV and FVIII; replacement of FV is achieved only through use of fresh-frozen plasma (FFP) and replacement of FVIII by FFP and desmopressin or specific FVIII concentrates (plasma-derived or recombinant FVIII products)."
    explanation: >-
      States that factor V can be replaced only with fresh frozen plasma.
- name: Factor VIII concentrate
  description: >-
    Plasma-derived or recombinant factor VIII, given with plasma to compensate
    for the shorter half-life of plasma factor VIII, or alone for some
    procedures when factor V is adequate.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: coagulation factor VIII replacement therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: plasma-derived factor VIII concentrate
      term:
        id: NCIT:C81122
        label: Antihemophilic Factor Human
    - preferred_term: recombinant factor VIII concentrate
      term:
        id: NCIT:C81123
        label: Antihemophilic Factor, Human Recombinant
  target_mechanisms:
  - target: Reduced Plasma Factor V and Factor VIII
    treatment_effect: RESTORES
    description: >-
      Restores the factor VIII component of the deficit.
  evidence:
  - reference: PMID:23852824
    reference_title: "Combined deficiency of coagulation factors V and VIII: an update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "the recommended therapy includes fresh frozen plasma (FFP), which provides FV, and FVIII concentrate, which compensates for the shorter half-life of plasma FVIII."
    explanation: >-
      States the guideline regimen of plasma plus factor VIII concentrate.
- name: Desmopressin (DDAVP)
  description: >-
    Releases stored factor VIII and raises its level about twofold for 1-2 hours.
    Usable instead of factor VIII concentrate for minor procedures, and it
    corrects thrombin generation in patient platelet-rich plasma. Repeated doses
    lose effect.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: desmopressin
      term:
        id: CHEBI:4450
        label: desmopressin
  target_mechanisms:
  - target: Reduced Thrombin Generation
    treatment_effect: RESTORES
    description: >-
      Raising factor VIII restores thrombin generation.
  evidence:
  - reference: PMID:23852824
    reference_title: "Combined deficiency of coagulation factors V and VIII: an update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Desmopressin (DDAVP), a synthetic derivative of the antidiuretic hormone arginine vasopressin, was shown to increase the FVIII level by more than twofold over 60 to 120 minutes in a patient with F5F8D."
    explanation: >-
      States the factor VIII response to desmopressin.
  - reference: PMID:31558466
    reference_title: "Low factor V level ameliorates bleeding diathesis in patients with combined deficiency of factor V and factor VIII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DDAVP infusion induced a complete response in 5 F5F8D patients and a partial response in the remaining patient."
    explanation: >-
      Clinical response to desmopressin in six genotyped patients.
- name: Antifibrinolytic therapy
  description: >-
    Tranexamic acid, alone or with replacement therapy, for mucosal bleeding and
    procedures.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tranexamic acid
      term:
        id: CHEBI:48669
        label: tranexamic acid
  target_mechanisms:
  - target: Systemic Bleeding Tendency
    treatment_effect: MODULATES
    description: >-
      Stabilizes the clot that does form by inhibiting fibrinolysis.
  evidence:
  - reference: PMID:39209292
    reference_title: "Clinical, Laboratory, Molecular, and Reproductive Aspects of Combined Deficiency of Factors V and VIII."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Intravenous administration of tranexamic acid at 15 to 20 mg/kg can be applied in hospital settings as monotherapy or as part of a combination treatment."
    explanation: >-
      States the use of tranexamic acid.
- name: Recombinant activated factor VII
  description: >-
    A bypass agent used when plasma and factor VIII concentrate fail to control
    bleeding, or when plasma cannot be given.
  therapeutic_modality: OTHER
  notes: >-
    Tagged OTHER rather than PROTEIN_REPLACEMENT because factor VIIa replaces
    neither missing factor; it bypasses the factor VIII deficit.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: recombinant activated factor VII
      term:
        id: NCIT:C81125
        label: Eptacog Alfa
  target_mechanisms:
  - target: Reduced Thrombin Generation
    treatment_effect: BYPASSES
    description: >-
      Drives thrombin generation through the extrinsic pathway, bypassing the
      factor VIII deficit.
  evidence:
  - reference: PMID:23852824
    reference_title: "Combined deficiency of coagulation factors V and VIII: an update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In a case of F5F8D with persistent abdominal hematoma following surgery that combined FFP and FVIII concentrate infusions failed to control, FVIIa was successfully used to stop the bleeding complications."
    explanation: >-
      Records rescue use of factor VIIa.
animal_models:
- name: Lman1 knockout mouse
  species: Mouse
  genotype: Lman1-/-
  publication: PMID:21795745
  description: >-
    Plasma factor V and factor VIII and platelet factor V fall to about 50% of
    wild type, a milder deficiency than in patients. Hepatocyte ER is slightly
    distended with retained alpha1-antitrypsin, and there is strain-dependent,
    partially penetrant perinatal lethality not seen in humans.
  evidence:
  - reference: PMID:21795745
    reference_title: "Mice deficient in LMAN1 exhibit FV and FVIII deficiencies and liver accumulation of α1-antitrypsin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Levels of plasma FV and FVIII, and platelet FV, are all reduced to ∼ 50% of wild-type in Lman1(-/-) mice, compared with the 5%-30% levels typically observed in human F5F8D patients."
    explanation: >-
      Reports the combined factor deficiency in the knockout and how it compares
      with patients.
  modeled_mechanisms:
  - target: Reduced Plasma Factor V and Factor VIII
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Loss of LMAN1 reduces plasma factor V and factor VIII together, as in
      patients.
    limitations: >-
      The reduction is milder than in human patients (about 50% against 5-30%),
      and the strain-dependent perinatal lethality has no human counterpart.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse factor V and factor VIII fall only to about half of wild type,
        so the mouse shows a dependence on LMAN1 for secretion but understates
        the size of the human deficit.
    readouts:
    - name: Plasma factor V and factor VIII levels
      target: Reduced Plasma Factor V and Factor VIII
      direction: DECREASED
      interpretation: Concordant reduction of both factors in the knockout.
      evidence:
      - reference: PMID:21795745
        reference_title: "Mice deficient in LMAN1 exhibit FV and FVIII deficiencies and liver accumulation of α1-antitrypsin."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Levels of plasma FV and FVIII, and platelet FV, are all reduced to ∼ 50% of wild-type in Lman1(-/-) mice, compared with the 5%-30% levels typically observed in human F5F8D patients."
        explanation: >-
          Reports the measured reduction.
- name: Mcfd2 knockout mouse
  species: Mouse
  genotype: Mcfd2-/-
  publication: PMID:29735583
  description: >-
    Plasma factor V and factor VIII fall lower than in Lman1-null mice, matching
    the human genotype-phenotype difference, with normal survival. Doubly
    deficient mice have levels like Lman1-null mice, pointing to an alternative
    secretion route and distinct roles for the two subunits.

has_subtypes:
- name: F5F8D1
  display_name: Type 1 (LMAN1)
  subtype_term:
    preferred_term: factor V and factor VIII, combined deficiency of, type 1
    term:
      id: MONDO:0009206
      label: factor V and factor VIII, combined deficiency of, type 1
  description: >-
    Caused by biallelic LMAN1 variants, which account for roughly 70% of
    families. Most alleles are null, and patient cells lack LMAN1 protein; MCFD2
    is then no longer retained in the early secretory pathway. Founder alleles
    account for the Jewish (c.89insG, c.1149+2T>G) and Italian (M1T) clusters.
  genes:
  - preferred_term: LMAN1
    term:
      id: hgnc:6631
      label: LMAN1
  evidence:
  - reference: PMID:9546392
    reference_title: "Mutations in the ER-Golgi intermediate compartment protein ERGIC-53 cause combined deficiency of coagulation factors V and VIII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA sequence analysis identified two different mutations, accounting for all affected individuals in nine families studied."
    explanation: >-
      The positional-cloning study that identified ERGIC-53 (LMAN1) mutations as
      the cause in nine families.
  - reference: PMID:23852824
    reference_title: "Combined deficiency of coagulation factors V and VIII: an update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Likewise, two mutations in LMAN1 (c.89-90insG and c.1149 + 2T > G) account for all Jewish F5F8D patients."
    explanation: >-
      Supports the Jewish founder alleles named in this subtype's description.
  - reference: PMID:39209292
    reference_title: "Clinical, Laboratory, Molecular, and Reproductive Aspects of Combined Deficiency of Factors V and VIII."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Some mutations, such as c.89insG and c.2T > C (M1T) in LMAN1, which are prevalent in Iranian/Iraqi Jewish and Italian populations, may represent founder effects."
    explanation: >-
      Supports the Italian M1T founder allele named in this subtype's
      description.
- name: F5F8D2
  display_name: Type 2 (MCFD2)
  subtype_term:
    preferred_term: factor 5 and Factor VIII, combined deficiency of, 2
    term:
      id: MONDO:0013331
      label: factor 5 and Factor VIII, combined deficiency of, 2
  description: >-
    Caused by biallelic MCFD2 variants, roughly 30% of families overall but the
    predominant type in South Indian cohorts. LMAN1 protein is present at normal
    levels. Missense variants cluster in the EF-hand domains and abolish binding
    to LMAN1. Plasma factor V and factor VIII are on average lower than in type
    1, though the ranges overlap too much to predict the gene from the levels.
  genes:
  - preferred_term: MCFD2
    term:
      id: hgnc:18451
      label: MCFD2
  evidence:
  - reference: PMID:12717434
    reference_title: "Bleeding due to disruption of a cargo-specific ER-to-Golgi transport complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show that inactivating mutations in MCFD2 cause F5F8D with a phenotype indistinguishable from that caused by mutations in LMAN1."
    explanation: >-
      Identifies MCFD2 as the second locus and states that the phenotype matches
      type 1.
  - reference: PMID:18391077
    reference_title: "Genotype-phenotype correlation in combined deficiency of factor V and factor VIII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although there is considerable overlap, the mean levels of plasma FV and FVIII in patients with MCFD2 mutations are significantly lower than the corresponding levels in patients with LMAN1 mutations."
    explanation: >-
      The genotype-phenotype difference between the two types recorded in the
      description.
  - reference: PMID:17610559
    reference_title: "Mutations in the MCFD2 gene are predominant among patients with hereditary combined FV and FVIII deficiency (F5F8D) in India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of two common mutations (p.E71fs, c.149 + 5G > A) in MCFD2 gene in seven of nine patients, particularly the c.149 + 5G > A (55,6% of patients), suggests that this gene could be the first to be analysed during the genetic diagnosis of F5F8D in this population."
    explanation: >-
      Supports the predominance of MCFD2 in South Indian patients.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Both types require two defective alleles of the same gene, homozygous or
    compound heterozygous. The disorder clusters where consanguineous marriage is
    common.
  evidence:
  - reference: PMID:19598067
    reference_title: "Combined Factor V and Factor VIII Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Combined deficiency of factor V (FV) and factor VIII (FVIII) (F5F8D, or FV+FVIII) is a autosomal recessive bleeding disorder caused by mutations in genes encoding two components of the endoplasmic reticulum (ER)-Golgi intermediate compartment"
    explanation: >-
      States autosomal recessive inheritance and the two-gene basis.
pathophysiology:
- name: Biallelic LMAN1 or MCFD2 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous variants in LMAN1 (chromosome 18q21) or
    MCFD2 (chromosome 2p21). LMAN1 alleles are mostly null, giving complete loss
    of the protein; MCFD2 alleles include null alleles and EF-hand missense
    substitutions that abolish LMAN1 binding. Mutations in the two genes account
    for essentially every genetically resolved family.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: LMAN1
    term:
      id: hgnc:6631
      label: LMAN1
  - preferred_term: MCFD2
    term:
      id: hgnc:18451
      label: MCFD2
  downstream:
  - target: Loss of the LMAN1-MCFD2 Cargo Receptor Complex
    description: >-
      Either subunit's absence, or a missense change that prevents the two from
      binding, leaves no functional receptor.
  evidence:
  - reference: PMID:9546392
    reference_title: "Mutations in the ER-Golgi intermediate compartment protein ERGIC-53 cause combined deficiency of coagulation factors V and VIII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunofluorescence and Western analysis of immortalized lymphocytes from patients homozygous for either of the two mutations demonstrate complete lack of expression of the mutated gene in these cells."
    explanation: >-
      Shows that the founder LMAN1 alleles are null at the protein level.
  - reference: PMID:16304051
    reference_title: "Combined deficiency of factor V and factor VIII is due to mutations in either LMAN1 or MCFD2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combined with our previous reports, we have identified LMAN1 or MCFD2 mutations as the causes of F5F8D in 71 of 76 families."
    explanation: >-
      Supports that the two genes account for essentially all cases.
- name: Loss of the LMAN1-MCFD2 Cargo Receptor Complex
  biological_scale: MOLECULAR
  description: >-
    LMAN1 is a mannose-binding type 1 transmembrane lectin that cycles between
    the endoplasmic reticulum and the ER-Golgi intermediate compartment. MCFD2 is
    a soluble EF-hand protein with no retrieval signal of its own, held in the
    early secretory pathway by a calcium-dependent 1:1 complex with LMAN1. The
    EF-hand domains of MCFD2 carry separate binding sites for LMAN1 and for
    factor V and factor VIII. Cell rescue experiments indicate that MCFD2 does
    the cargo binding and LMAN1 mainly shuttles it.
  genes:
  - preferred_term: LMAN1
    term:
      id: hgnc:6631
      label: LMAN1
  - preferred_term: MCFD2
    term:
      id: hgnc:18451
      label: MCFD2
  molecular_functions:
  - preferred_term: factor V and factor VIII cargo receptor activity
    modifier: DECREASED
    term:
      id: GO:0038024
      label: cargo receptor activity
  downstream:
  - target: Impaired ER-to-Golgi Export of Factor V and Factor VIII
    description: >-
      Without the receptor, factor V and factor VIII are not efficiently packaged
      for export from the endoplasmic reticulum.
  evidence:
  - reference: PMID:12717434
    reference_title: "Bleeding due to disruption of a cargo-specific ER-to-Golgi transport complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MCFD2 is localized to the ERGIC through a direct, calcium-dependent interaction with LMAN1."
    explanation: >-
      Establishes that MCFD2 depends on LMAN1 for its localization.
  - reference: PMID:20007547
    reference_title: "EF-hand domains of MCFD2 mediate interactions with both LMAN1 and coagulation factor V or VIII."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results suggest that the EF-hand domains of MCFD2 contain separate binding sites for LMAN1 and FV/FVIII that are essential for cargo receptor formation and cargo loading in the ER."
    explanation: >-
      Locates the receptor-forming and cargo-binding sites on MCFD2.
  - reference: PMID:18391077
    reference_title: "Genotype-phenotype correlation in combined deficiency of factor V and factor VIII."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that a novel MCFD2 missense mutation identified here (D81Y) and 2 previously reported mutations (D89A and D122V) abolish MCFD2 binding to LMAN1."
    explanation: >-
      Shows that patient MCFD2 missense alleles act by preventing complex
      formation.
  - reference: PMID:20142513
    reference_title: "Structural basis for the cooperative interplay between the two causative gene products of combined factor V and factor VIII deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The interaction is independent of sugar-binding of ERGIC-53 and involves most of the missense mutation sites of MCFD2 so far reported in F5F8D."
    explanation: >-
      The crystal structure maps reported MCFD2 missense sites to the LMAN1
      interface.
  - reference: PMID:36490287
    reference_title: "Separate roles of LMAN1 and MCFD2 in ER-to-Golgi trafficking of FV and FVIII."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results suggest that cargo binding and transport are carried out by MCFD2 and that LMAN1 primarily serves as a shuttling carrier of MCFD2."
    explanation: >-
      Supports the division of labour between the subunits stated in the
      description.
- name: Impaired ER-to-Golgi Export of Factor V and Factor VIII
  biological_scale: CELLULAR
  description: >-
    Factor V is synthesized by hepatocytes and factor VIII by endothelial cells.
    Without the cargo receptor, both are exported from the endoplasmic reticulum
    inefficiently and secreted at reduced rates. The block is partial, not
    absolute, which is why factor levels fall to 5-30% rather than to zero.
  biological_processes:
  - preferred_term: ER-to-Golgi transport of factor V and factor VIII
    modifier: DECREASED
    term:
      id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
  cell_types:
  - preferred_term: hepatocyte, the site of factor V synthesis
    term:
      id: CL:0000182
      label: hepatocyte
  - preferred_term: endothelial cell, the site of factor VIII synthesis
    term:
      id: CL:0000115
      label: endothelial cell
  downstream:
  - target: Reduced Plasma Factor V and Factor VIII
    description: >-
      Reduced secretion lowers the circulating levels of both factors together.
  evidence:
  - reference: PMID:16304051
    reference_title: "Combined deficiency of factor V and factor VIII is due to mutations in either LMAN1 or MCFD2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LMAN1 and MCFD2 form a protein complex that functions as a cargo receptor ferrying FV and FVIII from the endoplasmic reticulum to the Golgi."
    explanation: >-
      States the transport step this node describes.
  - reference: PMID:36490287
    reference_title: "Separate roles of LMAN1 and MCFD2 in ER-to-Golgi trafficking of FV and FVIII."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "LMAN1 deficiency led to more profound decreases in FV/FVIII secretion in HEK293T and HepG2 cells than in HCT116 cells, suggesting that regulation of cargo transport by the LMAN1/MCFD2 pathway varies in different cell types."
    explanation: >-
      Shows reduced factor V and factor VIII secretion from LMAN1-deficient cells,
      including a hepatocyte-derived line.
  - reference: PMID:39209292
    reference_title: "Clinical, Laboratory, Molecular, and Reproductive Aspects of Combined Deficiency of Factors V and VIII."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In humans, plasma FV is synthesized by hepatocytes and platelet FV is derived from plasma FV via endocytosis by megakaryocytes."
    explanation: >-
      Supports the hepatocyte as the factor V-producing cell bound on this node.
  - reference: PMID:39209292
    reference_title: "Clinical, Laboratory, Molecular, and Reproductive Aspects of Combined Deficiency of Factors V and VIII."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In contrast, FVIII is synthesized in endothelial cells."
    explanation: >-
      Supports the endothelial cell as the factor VIII-producing cell bound on
      this node.
- name: Reduced Plasma Factor V and Factor VIII
  biological_scale: ORGANISM
  description: >-
    Plasma factor V and factor VIII activity and antigen fall together, usually
    to 5-30% of normal (typically 10-20%). Platelet factor V, which is taken up
    from plasma by megakaryocytes, falls in parallel. The concordant reduction of
    two otherwise unrelated factors is the diagnostic signature.
  downstream:
  - target: Reduced Thrombin Generation
    description: >-
      The factor VIII deficit limits intrinsic tenase activity and so thrombin
      generation.
  - target: Low Free Tissue Factor Pathway Inhibitor
    description: >-
      Factor V deficiency is accompanied by reduced free TFPI-alpha.
    evidence:
    - reference: PMID:39209292
      reference_title: "Clinical, Laboratory, Molecular, and Reproductive Aspects of Combined Deficiency of Factors V and VIII."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Recently, it was reported that FV deficiency is associated with reduced tissue factor pathway inhibitor α (TFPIα) levels, which protects FV-deficient patients from severe bleeding."
      explanation: >-
        States the association between factor V deficiency and reduced
        TFPI-alpha that this edge records.
  - target: Reduced coagulation factor V activity
  - target: Reduced factor VIII activity
  - target: Prolonged prothrombin time
  - target: Prolonged partial thromboplastin time
  evidence:
  - reference: PMID:23852824
    reference_title: "Combined deficiency of coagulation factors V and VIII: an update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Diagnosis is made on laboratory findings of decreased FV and FVIII levels in plasma, usually in the range of 5 to 30% of normal (typically 10–20%)."
    explanation: >-
      States the range of the concordant reduction.
  - reference: PMID:18391077
    reference_title: "Genotype-phenotype correlation in combined deficiency of factor V and factor VIII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Measurement of platelet factor V (FV) levels in 7 F5F8D patients (4 with LMAN1 and 3 with MCFD2 mutations) demonstrated similar reductions to those observed for plasma FV."
    explanation: >-
      Shows that the platelet factor V pool falls in parallel with plasma factor V.
- name: Reduced Thrombin Generation
  biological_scale: MOLECULAR
  description: >-
    In platelet-rich plasma from patients, thrombin generation is reduced, and
    normalizing factor VIII alone, or raising it with desmopressin, fully corrects
    it. The residual factor V is sufficient for thrombin generation, so the
    hypocoagulable state is attributed to the factor VIII deficit.
  biological_processes:
  - preferred_term: blood coagulation
    modifier: DECREASED
    term:
      id: GO:0007596
      label: blood coagulation
  downstream:
  - target: Systemic Bleeding Tendency
    description: >-
      Insufficient thrombin at sites of injury fails to secure haemostasis.
  evidence:
  - reference: PMID:31558466
    reference_title: "Low factor V level ameliorates bleeding diathesis in patients with combined deficiency of factor V and factor VIII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "however, it was fully corrected by normalizing FVIII or after 1-deamino-8-d-arginine vasopressin (DDAVP) infusion, indicating that the hypocoagulable state of F5F8D patients is associated with low FVIII levels."
    explanation: >-
      Attributes the reduced thrombin generation in patient platelet-rich plasma
      to the factor VIII deficit.
  - reference: PMID:39209292
    reference_title: "Clinical, Laboratory, Molecular, and Reproductive Aspects of Combined Deficiency of Factors V and VIII."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Restoring FVIII alone in F5F8D patient plasma led to normal thrombin generation."
    explanation: >-
      A review restatement of the same result.
- name: Low Free Tissue Factor Pathway Inhibitor
  biological_scale: MOLECULAR
  description: >-
    Patients have reduced free tissue factor pathway inhibitor alpha, which
    accompanies low factor V. In platelet-poor plasma, low TFPI-alpha and low
    factor V together reduce anticoagulant activity, and tissue-factor-triggered
    thrombin generation is paradoxically enhanced. In platelet-rich plasma, where
    the hypocoagulable state of the disease is measured, the same study found
    that low TFPI-alpha may have no effect on thrombin generation. The node is
    therefore not linked into the thrombin-generation chain. Whether it explains
    why the combined deficiency bleeds no worse than an isolated factor VIII
    deficiency of similar degree is unresolved.
  genes:
  - preferred_term: TFPI
    term:
      id: hgnc:11760
      label: TFPI
  molecular_functions:
  - preferred_term: tissue factor pathway inhibitor serine protease inhibitor activity
    modifier: DECREASED
    term:
      id: GO:0004867
      label: serine-type endopeptidase inhibitor activity
  evidence:
  - reference: PMID:31558466
    reference_title: "Low factor V level ameliorates bleeding diathesis in patients with combined deficiency of factor V and factor VIII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significantly lower free tissue factor pathway inhibitor (fTFPI) was found in F5F8D patients compared with healthy controls (P < .01)."
    explanation: >-
      Measures the reduced free TFPI in patients.
  - reference: PMID:31558466
    reference_title: "Low factor V level ameliorates bleeding diathesis in patients with combined deficiency of factor V and factor VIII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increasing FV concentrations by adding plasma FV to F5F8D plasma only caused a gradual decrease in thrombin generation, suggesting that low levels of TFPIα and FV cocontributed to the elevated thrombin generation by reducing anticoagulant effects."
    explanation: >-
      The platelet-poor plasma result: low TFPI-alpha and low factor V together
      raise thrombin generation.
  - reference: PMID:31558466
    reference_title: "Low factor V level ameliorates bleeding diathesis in patients with combined deficiency of factor V and factor VIII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, plasma and platelet FV in F5F8D PRP were sufficient to support normal thrombin generation, and low TFPIα may have no effect on thrombin generation."
    explanation: >-
      The platelet-rich plasma result that limits how strongly the counterweight
      can be stated.
  - reference: PMID:23852824
    reference_title: "Combined deficiency of coagulation factors V and VIII: an update."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Recent reports also confirmed the previous observation that defects of two factors do not lead to more severe bleeding symptoms than single defect of FV or FVIII of similar degree."
    explanation: >-
      The clinical observation this node is proposed to explain. INDIRECT because
      it states the observation, not the TFPI mechanism.
- name: Systemic Bleeding Tendency
  biological_scale: ORGANISM
  description: >-
    A mild to moderate bleeding diathesis. Bleeding after trauma, surgery,
    dental extraction, circumcision and childbirth is the most common
    presentation; spontaneous bleeding is mainly mucocutaneous, and joint,
    gastrointestinal, urinary and intracranial bleeding are uncommon. About half
    of patients bleed spontaneously and major bleeding is rare. Bleeding severity
    correlates poorly with factor levels, and some laboratory-affected siblings
    are asymptomatic.
  downstream:
  - target: Epistaxis
  - target: Gingival bleeding
  - target: Bruising susceptibility
  - target: Menorrhagia
  - target: Prolonged bleeding after surgery
  - target: Prolonged bleeding after dental extraction
  - target: Post-partum hemorrhage
  - target: Joint hemorrhage
  - target: Gastrointestinal hemorrhage
  - target: Hematuria
  - target: Intracranial hemorrhage
  evidence:
  - reference: PMID:19598067
    reference_title: "Combined Factor V and Factor VIII Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "F5F8D is characterized by concomitantly low levels (usually between 5% and 20%) of both FV and FVIII and is associated with a mild to moderate bleeding tendency."
    explanation: >-
      States the mild to moderate bleeding tendency.
  - reference: PMID:39209292
    reference_title: "Clinical, Laboratory, Molecular, and Reproductive Aspects of Combined Deficiency of Factors V and VIII."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Only 50% of patients exhibit spontaneous bleeding, with major bleeding occurring in just 5% of patients."
    explanation: >-
      Quantifies how often bleeding is spontaneous and how often major.
  - reference: PMID:23852824

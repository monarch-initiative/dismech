diagnosis:
- name: Coagulation screen
  description: >-
    Prolonged prothrombin time and activated partial thromboplastin time in a
    patient with bleeding prompt factor-specific assays. The PT and aPTT correct
    on mixing with normal plasma, excluding an inhibitor.
  diagnosis_term:
    preferred_term: coagulation screening blood test
    term:
      id: NCIT:C217390
      label: Diagnostic Blood Testing
  evidence:
  - reference: PMID:23852824
    reference_title: "Combined deficiency of coagulation factors V and VIII: an update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "F5F8D is suspected in bleeding patients with prolonged prothrombin time and activated partial thromboplastin time."
    explanation: >-
      States the screening picture that prompts the diagnosis.
- name: Factor V and factor VIII assays
  description: >-
    Concordantly reduced factor V and factor VIII, usually 5-30% of normal,
    confirm the diagnosis and distinguish it from isolated deficiency of either
    factor.
  diagnosis_term:
    preferred_term: coagulation factor assay
    term:
      id: NCIT:C217390
      label: Diagnostic Blood Testing
  evidence:
  - reference: PMID:23852824
    reference_title: "Combined deficiency of coagulation factors V and VIII: an update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Diagnosis is made on laboratory findings of decreased FV and FVIII levels in plasma, usually in the range of 5 to 30% of normal (typically 10–20%)."
    explanation: >-
      States the confirmatory finding.
- name: LMAN1 and MCFD2 sequencing
  description: >-
    Identifies the causative gene and variants; not yet routine. In South Indian
    patients MCFD2 is the more likely gene and may be sequenced first.
  diagnosis_term:
    preferred_term: LMAN1 and MCFD2 genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:17610559
    reference_title: "Mutations in the MCFD2 gene are predominant among patients with hereditary combined FV and FVIII deficiency (F5F8D) in India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of two common mutations (p.E71fs, c.149 + 5G > A) in MCFD2 gene in seven of nine patients, particularly the c.149 + 5G > A (55,6% of patients), suggests that this gene could be the first to be analysed during the genetic diagnosis of F5F8D in this population."
    explanation: >-
      Supports sequencing MCFD2 first in this population.

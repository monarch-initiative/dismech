discussions:
- discussion_id: gap_f5f8d_lman1_cargo_beyond_coagulation
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does loss of the LMAN1-MCFD2 receptor have any human consequence beyond
    factor V and factor VIII deficiency?
  rationale: >-
    Knockout mice retain alpha1-antitrypsin in hepatocyte ER and show
    strain-dependent perinatal lethality, implying other LMAN1-dependent cargoes,
    yet patients present with nothing but bleeding and their plasma
    alpha1-antitrypsin is not reduced. Whether hepatic retention occurs in
    patients, or other cargoes are affected, is unknown.
  attaches_to:

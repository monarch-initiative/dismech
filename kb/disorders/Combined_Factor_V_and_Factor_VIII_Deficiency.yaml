    snippet: "Comparison of relatively large cohorts of F5F8D in India, Iran, and Israel indicates that bleeding from trauma/surgery is the most frequently reported clinical manifestation."
    explanation: >-
      Names provoked bleeding as the most frequent manifestation across cohorts.

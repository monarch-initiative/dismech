notes: >-
  Scope: one entry for both genetic types, bound to the parent MONDO term, with
  the LMAN1 (type 1) and MCFD2 (type 2) forms as subtypes. The two genes encode
  the subunits of one cargo receptor, the clinical phenotype is the same, and
  the pathograph is shared; only the average factor levels differ. Coinheritance
  of hemophilia A with factor V deficiency produces a similar laboratory picture
  without an LMAN1 or MCFD2 defect and is recorded as a differential, not a
  subtype.

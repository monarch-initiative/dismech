name: Balkan Endemic Nephropathy
creation_date: '2026-09-01T14:00:00Z'
description: >-
  Balkan endemic nephropathy is a chronic tubulointerstitial kidney disease occurring
  in rural communities along the Danube basin, caused by long-term dietary exposure to
  aristolochic acid from Aristolochia clematitis seeds that contaminate locally grown
  and milled wheat. It is the environmental counterpart of aristolochic acid
  nephropathy, first recognised in users of herbal weight-loss preparations. Aristolochic
  acid is taken up by proximal tubular epithelium, forms persistent aristolactam-DNA
  adducts, and drives tubular cell death and progressive interstitial fibrosis, so the
  disease presents as slowly progressive kidney failure rather than acute injury. The
  same adducts produce a characteristic A:T to T:A transversion mutational signature and
  a high incidence of upper urinary tract urothelial carcinoma, which distinguishes this
  nephropathy from other chronic tubulointerstitial diseases.
categories:
- Environmental Health Disorder
- Toxic Exposure Disorder
category: Complex
parents:
- Chronic Kidney Disease
disease_term:
  preferred_term: Balkan endemic nephropathy
  term:
    id: MONDO:0007416
    label: Balkan nephropathy
pathophysiology:
- name: Dietary Aristolochic Acid Exposure and Proximal Tubular Uptake
  description: >-
    Aristolochic acid enters the diet when Aristolochia clematitis growing in
    wheat fields is harvested and milled with the grain and baked into household
    bread. Ingested aristolochic acid is taken up by proximal tubular epithelium,
    which is the same transport-dependent concentration step that makes the
    proximal tubule the target of nephrotoxic drugs.
  role: trigger
  biological_scale: CELLULAR
  conforms_to: "drug_induced_nephrotoxicity#Nephrotoxic Drug Exposure and Tubular Uptake"
  cell_types:
  - preferred_term: kidney proximal tubule epithelial cell
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  evidence:
  - reference: PMID:31054628
    reference_title: "Balkan Endemic Nephropathy and the Causative Role of Aristolochic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the causative factor was identified as the environmental phytotoxin
      aristolochic acid (AA) contained in Aristolochia clematitis, a common plant
      growing in wheat fields that was ingested through home-baked bread.
    explanation: >-
      Establishes the causative agent and the dietary route, which together
      define the exposure this node models.
  notes: >-
    This node conforms to a module whose trigger is a nephrotoxic DRUG. The agent
    here is a dietary phytotoxin rather than a prescribed drug, and the conformance
    is asserted on the shared mechanism - proximal tubular uptake concentrating a
    nephrotoxin in the epithelium - rather than on the agent being pharmaceutical.
    The Belgian outbreak, where the same toxin arrived as a herbal slimming
    preparation, sits between the two framings and is why the mechanism travels.
  downstream:
  - target: Aristolactam-DNA Adduct Formation
    causal_link_type: DIRECT
    description: >-
      Metabolically activated aristolochic acid forms covalent adducts with
      genomic DNA in the exposed tissue.
- name: Aristolactam-DNA Adduct Formation
  description: >-
    Activated aristolochic acid binds covalently to DNA, producing
    dA-aristolactam and dG-aristolactam adducts that persist in renal cortex for
    decades. These adducts do two distinct jobs in this disease: they are the
    biomarker that established causation, having been found in the renal cortex of
    patients with this nephropathy and not in other chronic renal disease; and
    they are themselves the mutagenic lesion that drives the associated urothelial
    cancer. That dual role is what separates this entry from a generic toxic
    tubulopathy.
  role: mechanism
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: DNA damage response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: INCREASED
  evidence:
  - reference: PMID:17620607
    reference_title: "Aristolochic acid and the etiology of endemic (Balkan) nephropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified dA-aristolactam (AL) and dG-AL DNA adducts in the renal cortex
      of patients with EN but not in patients with other chronic renal diseases.
    explanation: >-
      Human tissue evidence that the adducts are specific to this nephropathy
      rather than a general feature of chronic kidney disease, which is what makes
      them causally informative rather than merely present.
  - reference: PMID:31054628
    reference_title: "Balkan Endemic Nephropathy and the Causative Role of Aristolochic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The common molecular link between Balkan and Belgian nephropathy cases was
      the detection of aristolactam-DNA adducts in renal tissue and UTUC.
    explanation: >-
      Establishes the adduct as the shared molecular lesion across the dietary and
      herbal-exposure outbreaks, supporting it as the mechanism rather than an
      epiphenomenon of one setting.
  downstream:
  - target: Proximal Tubular Epithelial Cell Death and Interstitial Fibrosis
    causal_link_type: DIRECT
    description: >-
      Adduct burden and the resulting DNA damage response drive tubular cell loss.
  - target: A:T to T:A Transversion Signature and Urothelial Carcinogenesis
    causal_link_type: DIRECT
    description: >-
      The same adducts mispair during replication, producing the characteristic
      transversion signature in urothelium.
- name: Proximal Tubular Epithelial Cell Death and Interstitial Fibrosis
  description: >-
    Loss of proximal tubular epithelium with progressive interstitial fibrosis and
    tubular atrophy, producing insidious, slowly progressive chronic kidney disease
    rather than an acute injury with a recovery phase.
  role: central_effector
  biological_scale: TISSUE
  conforms_to: "drug_induced_nephrotoxicity#Proximal Tubular Epithelial Cell Death"
  cell_types:
  - preferred_term: kidney proximal tubule epithelial cell
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  evidence:
  - reference: PMID:31054628
    reference_title: "Balkan Endemic Nephropathy and the Causative Role of Aristolochic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Balkan endemic nephropathy is a chronic tubulointerstitial disease with
      insidious onset, slowly progressing to end-stage renal disease and
      frequently associated with urothelial carcinoma of the upper urinary tract
      (UTUC).
    explanation: >-
      Establishes the chronic tubulointerstitial character and the progression to
      end-stage renal disease.
  notes: >-
    PARTIAL CONFORMANCE, deliberately. The drug_induced_nephrotoxicity module
    models a dose-dependent ACUTE tubular necrosis arc ending in acute kidney
    injury. This disease shares the proximal tubular target and the cell-death
    step but not the time course: exposure is chronic and low-level over years,
    and the outcome is progressive fibrosis and end-stage renal disease rather than
    acute injury with a recovery phase. The entry therefore conforms at the uptake
    and cell-death nodes and deliberately does NOT declare conformance to the
    module's Acute Kidney Injury effector, because that would assert a time course
    this disease does not have.
- name: A:T to T:A Transversion Signature and Urothelial Carcinogenesis
  description: >-
    Aristolactam adducts mispair during replication to produce a highly
    characteristic A:T to T:A transversion signature, concentrated in TP53, and a
    high incidence of upper urinary tract urothelial carcinoma. This arm is what
    makes the exposure a carcinogenic as well as a nephrotoxic one, and the
    signature is specific enough to serve as a molecular fingerprint of prior
    aristolochic acid exposure in tumours worldwide.
  role: consequence
  biological_scale: MOLECULAR
  gene:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  locations:
  - preferred_term: ureter
    term:
      id: UBERON:0000056
      label: ureter
  evidence:
  - reference: PMID:31054628
    reference_title: "Balkan Endemic Nephropathy and the Causative Role of Aristolochic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These adducts are not only biomarkers of prior exposure to AA, but they also
      trigger urothelial malignancy by inducing specific mutations (A:T to T:A
      transversion) in critical genes of carcinogenesis, including the
      tumor-suppressor TP53.
    explanation: >-
      Links the adducts to the transversion signature and to TP53 specifically,
      which is the basis for modelling carcinogenesis as its own arm rather than a
      complication of the fibrosis.
  - reference: PMID:17620607
    reference_title: "Aristolochic acid and the etiology of endemic (Balkan) nephropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations at A:T pairs accounted for 89% of all p53 mutations, with 78% of
      these being A:T --> T:A transversions.
    explanation: >-
      Quantifies the dominance of the signature in human tumour tissue from the
      endemic population, supporting it as characteristic rather than incidental.
environmental:
- name: Dietary aristolochic acid from Aristolochia clematitis-contaminated grain
  description: >-
    Chronic low-level dietary exposure in rural Danube-basin communities, arising
    where Aristolochia clematitis grows as a weed in wheat fields and its seed is
    harvested, milled and baked with the grain. The exposure explains the disease's
    most distinctive epidemiological feature: it clusters in particular villages
    and runs in families without being inherited, because households share a grain
    supply rather than a genotype.
  exposure_term:
    preferred_term: dietary exposure to aristolochic acid
    term:
      id: ECTO:0000231
      label: exposure to chemical
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
    exposure_route:
    - classification_value: ORAL
    exposure_duration:
    - classification_value: CHRONIC
      notes: >-
        Years to decades of low-level dietary intake, which is what distinguishes
        this from the acute high-dose nephrotoxin exposures the conforming module
        was built around.
  influences_mechanisms:
  - target: Dietary Aristolochic Acid Exposure and Proximal Tubular Uptake
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Contaminated grain is the route by which aristolochic acid reaches the
      proximal tubule.
    evidence:
    - reference: PMID:17620607
      reference_title: "Aristolochic acid and the etiology of endemic (Balkan) nephropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Significant epidemiologic features of EN include its focal occurrence in
        certain villages and a familial, but not inherited, pattern of disease.
      explanation: >-
        The village-level clustering with a familial but non-inherited pattern is
        the epidemiological signature of a shared environmental exposure acting at
        this node, and is what distinguished this from a genetic nephropathy.
  notes: >-
    Bound to the substance-level ECTO:0000231 (exposure to chemical). ECTO was
    checked for an aristolochic-acid-specific exposure class and none is resolvable
    through the repository's ECTO adapter (sqlite:obo:ecto); note that a term
    resolving in OLS is not sufficient, since dismech does not validate ECTO
    against OLS. The specific agent and dietary route are carried in
    preferred_term, description and exposure_classifications.
  evidence:
  - reference: PMID:31054628
    reference_title: "Balkan Endemic Nephropathy and the Causative Role of Aristolochic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the causative factor was identified as the environmental phytotoxin
      aristolochic acid (AA) contained in Aristolochia clematitis, a common plant
      growing in wheat fields that was ingested through home-baked bread.
    explanation: >-
      Names the plant, the contamination route and the food vehicle, which is the
      exposure this entry models.

name: Balkan Endemic Nephropathy
creation_date: '2026-09-01T14:00:00Z'
description: >-
  Balkan endemic nephropathy is a chronic tubulointerstitial kidney disease occurring
  in rural communities along the Danube basin, caused by long-term dietary exposure to
  aristolochic acid from Aristolochia clematitis seeds that contaminate locally grown
  and milled wheat. It is the environmental counterpart of aristolochic acid
  nephropathy, first recognised in users of herbal weight-loss preparations. Aristolochic
  acid is taken up by proximal tubular epithelium, forms persistent aristolactam-DNA
  adducts, and drives tubular cell death and progressive interstitial fibrosis, so the
  disease presents as slowly progressive kidney failure rather than acute injury. The
  same adducts produce a characteristic A:T to T:A transversion mutational signature and
  a high incidence of upper urinary tract urothelial carcinoma, which distinguishes this
  nephropathy from other chronic tubulointerstitial diseases.
categories:
- Environmental Health Disorder
- Toxic Exposure Disorder
category: Complex
parents:
- Chronic Kidney Disease
disease_term:
  preferred_term: Balkan endemic nephropathy
  term:
    id: MONDO:0007416
    label: Balkan nephropathy
pathophysiology:
- name: Dietary Aristolochic Acid Exposure and Proximal Tubular Uptake
  description: >-
    Aristolochic acid enters the diet when Aristolochia clematitis growing in
    wheat fields is harvested and milled with the grain and baked into household
    bread. Ingested aristolochic acid is taken up by proximal tubular epithelium,
    which is the same transport-dependent concentration step that makes the
    proximal tubule the target of nephrotoxic drugs.
  role: trigger
  biological_scale: CELLULAR
  conforms_to: "drug_induced_nephrotoxicity#Nephrotoxic Drug Exposure and Tubular Uptake"
  cell_types:
  - preferred_term: kidney proximal tubule epithelial cell
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  evidence:
  - reference: PMID:31054628
    reference_title: "Balkan Endemic Nephropathy and the Causative Role of Aristolochic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the causative factor was identified as the environmental phytotoxin
      aristolochic acid (AA) contained in Aristolochia clematitis, a common plant
      growing in wheat fields that was ingested through home-baked bread.
    explanation: >-
      Establishes the causative agent and the dietary route, which together
      define the exposure this node models.
  notes: >-
    This node conforms to a module whose trigger is a nephrotoxic DRUG. The agent
    here is a dietary phytotoxin rather than a prescribed drug, and the conformance
    is asserted on the shared mechanism - proximal tubular uptake concentrating a
    nephrotoxin in the epithelium - rather than on the agent being pharmaceutical.
    The Belgian outbreak, where the same toxin arrived as a herbal slimming
    preparation, sits between the two framings and is why the mechanism travels.
  downstream:
  - target: Aristolactam-DNA Adduct Formation
    causal_link_type: DIRECT
    description: >-
      Metabolically activated aristolochic acid forms covalent adducts with
      genomic DNA in the exposed tissue.
- name: Aristolactam-DNA Adduct Formation
  description: >-
    Activated aristolochic acid binds covalently to DNA, producing
    dA-aristolactam and dG-aristolactam adducts that persist in renal cortex for
    decades. These adducts do two distinct jobs in this disease: they are the
    biomarker that established causation, having been found in the renal cortex of
    patients with this nephropathy and not in other chronic renal disease; and
    they are themselves the mutagenic lesion that drives the associated urothelial
    cancer. That dual role is what separates this entry from a generic toxic
    tubulopathy.
  role: mechanism
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: DNA damage response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: INCREASED
  evidence:
  - reference: PMID:17620607
    reference_title: "Aristolochic acid and the etiology of endemic (Balkan) nephropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified dA-aristolactam (AL) and dG-AL DNA adducts in the renal cortex
      of patients with EN but not in patients with other chronic renal diseases.
    explanation: >-
      Human tissue evidence that the adducts are specific to this nephropathy
      rather than a general feature of chronic kidney disease, which is what makes
      them causally informative rather than merely present.
  - reference: PMID:31054628
    reference_title: "Balkan Endemic Nephropathy and the Causative Role of Aristolochic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The common molecular link between Balkan and Belgian nephropathy cases was
      the detection of aristolactam-DNA adducts in renal tissue and UTUC.
    explanation: >-
      Establishes the adduct as the shared molecular lesion across the dietary and
      herbal-exposure outbreaks, supporting it as the mechanism rather than an
      epiphenomenon of one setting.
  downstream:
  - target: Proximal Tubular Epithelial Cell Death
    causal_link_type: DIRECT
    description: >-
      Adduct burden and the resulting DNA damage response drive tubular cell loss.
  - target: A:T to T:A Transversion Mutational Signature
    causal_link_type: DIRECT
    description: >-
      The same adducts mispair during replication, producing the characteristic
      transversion signature in urothelium.
- name: Proximal Tubular Epithelial Cell Death
  description: >-
    Loss of proximal tubular epithelium, the step the conforming module shares.
  role: central_effector
  biological_scale: TISSUE
  conforms_to: "drug_induced_nephrotoxicity#Proximal Tubular Epithelial Cell Death"
  downstream:
  - target: Tubulointerstitial Fibrosis and Progressive Renal Failure
    causal_link_type: DIRECT
    description: >-
      Sustained tubular cell loss provokes interstitial fibrosis and nephron
      dropout.
  cell_types:
  - preferred_term: kidney proximal tubule epithelial cell
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  evidence:
  - reference: PMID:31054628
    reference_title: "Balkan Endemic Nephropathy and the Causative Role of Aristolochic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Balkan endemic nephropathy is a chronic tubulointerstitial disease with
      insidious onset, slowly progressing to end-stage renal disease and
      frequently associated with urothelial carcinoma of the upper urinary tract
      (UTUC).
    explanation: >-
      Establishes the chronic tubulointerstitial character and the progression to
      end-stage renal disease.
  notes: >-
    PARTIAL CONFORMANCE, deliberately. The drug_induced_nephrotoxicity module
    models a dose-dependent ACUTE tubular necrosis arc ending in acute kidney
    injury. This disease shares the proximal tubular target and the cell-death
    step but not the time course: exposure is chronic and low-level over years,
    and the outcome is progressive fibrosis and end-stage renal disease rather than
    acute injury with a recovery phase. The entry therefore conforms at the uptake
    and cell-death nodes and deliberately does NOT declare conformance to the
    module's Acute Kidney Injury effector, because that would assert a time course
    this disease does not have.
- name: A:T to T:A Transversion Mutational Signature
  description: >-
    Aristolactam adducts mispair during replication to produce a highly
    characteristic A:T to T:A transversion signature, concentrated in TP53. The
    signature is specific enough to serve as a molecular fingerprint of prior
    aristolochic acid exposure, which is how the same exposure was later
    recognised in tumours worldwide. Split from the carcinoma it drives, since one
    is a molecular lesion and the other a tissue-level outcome.
  role: mechanism
  biological_scale: MOLECULAR
  gene:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  locations:
  - preferred_term: ureter
    term:
      id: UBERON:0000056
      label: ureter
  evidence:
  - reference: PMID:31054628
    reference_title: "Balkan Endemic Nephropathy and the Causative Role of Aristolochic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These adducts are not only biomarkers of prior exposure to AA, but they also
      trigger urothelial malignancy by inducing specific mutations (A:T to T:A
      transversion) in critical genes of carcinogenesis, including the
      tumor-suppressor TP53.
    explanation: >-
      Links the adducts to the transversion signature and to TP53 specifically,
      which is the basis for modelling carcinogenesis as its own arm rather than a
      complication of the fibrosis.
  - reference: PMID:17620607
    reference_title: "Aristolochic acid and the etiology of endemic (Balkan) nephropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations at A:T pairs accounted for 89% of all p53 mutations, with 78% of
      these being A:T --> T:A transversions.
    explanation: >-
      Quantifies the dominance of the signature in human tumour tissue from the
      endemic population, supporting it as characteristic rather than incidental.
  downstream:
  - target: Upper Urinary Tract Urothelial Carcinoma
    causal_link_type: DIRECT
    description: >-
      Transversion mutations in TP53 and other carcinogenesis genes transform
      urothelium.
- name: Upper Urinary Tract Urothelial Carcinoma
  description: >-
    Malignant transformation of upper urinary tract urothelium, frequent enough in
    endemic populations to be a defining feature rather than an incidental
    association. This is the tissue-level consequence of the molecular signature
    above, and it is why the exposure is carcinogenic as well as nephrotoxic.
  role: consequence
  biological_scale: TISSUE
  locations:
  - preferred_term: ureter
    term:
      id: UBERON:0000056
      label: ureter
  evidence:
  - reference: PMID:1618441
    reference_title: "Clinical features of Balkan endemic nephropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urothelial tumours are frequent, occurring in 2-47% of cases; tumour cells
      may be found in the urine.
    explanation: >-
      Clinical series evidence for the frequency of urothelial tumours in this
      population, with the reported range carried rather than a single figure.
  downstream:
  - target: Renal transitional cell carcinoma
    causal_link_type: DIRECT
- name: Tubulointerstitial Fibrosis and Progressive Renal Failure
  description: >-
    Interstitial fibrosis with tubular atrophy and nephron dropout, producing the
    insidious, slowly progressive chronic kidney disease that defines the
    nephropathy. Kept separate from tubular cell death because the module keeps
    the tissue response separate from the cell-death step, and because the
    interval between them here is years.
  role: consequence
  biological_scale: TISSUE
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  evidence:
  - reference: PMID:1618441
    reference_title: "Clinical features of Balkan endemic nephropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical picture of the disease is that of a slowly progressing
      tubulo-interstitial chronic nephritis.
    explanation: >-
      Characterises the tissue-level process and its time course, which is what
      separates this node from the acute injury the conforming module models.
  downstream:
  - target: Chronic kidney disease
    causal_link_type: DIRECT
  - target: Stage 5 chronic kidney disease
    causal_link_type: DIRECT
    description: >-
      Progression to end stage if the exposure continues.
  - target: Proteinuria
    causal_link_type: DIRECT
    description: >-
      Tubular injury produces low-molecular-weight proteinuria early.
  - target: Anemia
    causal_link_type: DIRECT
    description: >-
      Hyporegenerative anaemia, characteristically out of proportion to the degree
      of renal failure.
phenotypes:
- name: Chronic kidney disease
  description: >-
    Slowly progressive renal failure with an initial asymptomatic period, normal
    blood pressure until late, and no nephrotic oedema - a picture that separates
    it from glomerular disease.
  phenotype_term:
    preferred_term: Chronic kidney disease
    term:
      id: HP:0012622
      label: Chronic kidney disease
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:1618441
    reference_title: "Clinical features of Balkan endemic nephropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Blood pressure is normal, but in the advanced phase may be elevated.
    explanation: >-
      Supports the atypical feature that blood pressure stays normal until late,
      which is one of the things distinguishing this from other chronic
      nephropathies.
- name: Proteinuria
  description: >-
    Low-molecular-weight tubular proteinuria, present early and constant by the
    uraemic phase. Tubular rather than glomerular in type, matching the site of
    injury.
  phenotype_term:
    preferred_term: Low-molecular-weight tubular proteinuria
    term:
      id: HP:0003126
      label: Low-molecular-weight proteinuria
  evidence:
  - reference: PMID:1618441
    reference_title: "Clinical features of Balkan endemic nephropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Proteinuria of tubular type may be found early; in the uraemic phase it is
      constant.
    explanation: >-
      Establishes both the tubular character and the early timing, which is why
      preferred_term is more specific than the bound HP term.
- name: Anemia
  phenotype_term:
    preferred_term: Anemia
    term:
      id: HP:0001903
      label: Anemia
  evidence:
  - reference: PMID:1618441
    reference_title: "Clinical features of Balkan endemic nephropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Normo- or hypochromic normocytic hyporegenerative anaemia is a frequent
      finding.
    explanation: >-
      Characterises the anaemia as hyporegenerative, which is the feature that
      makes it disproportionate to the degree of renal failure.
- name: Renal transitional cell carcinoma
  description: >-
    Upper urinary tract urothelial carcinoma, the leading cause of death in this
    disease. It was modelled as a mechanism node before and not as a curated
    manifestation, which understated it.
  phenotype_term:
    preferred_term: Upper urinary tract urothelial carcinoma
    term:
      id: HP:0030409
      label: Renal transitional cell carcinoma
  evidence:
  - reference: PMID:1618441
    reference_title: "Clinical features of Balkan endemic nephropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urothelial tumours are frequent, occurring in 2-47% of cases; tumour cells
      may be found in the urine.
    explanation: >-
      Clinical series frequency for the tumour, carried as the reported range.
- name: Stage 5 chronic kidney disease
  description: >-
    End-stage renal disease, near-invariable if the exposure continues and the
    disease is untreated.
  phenotype_term:
    preferred_term: End-stage renal disease
    term:
      id: HP:0003774
      label: Stage 5 chronic kidney disease
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:31054628
    reference_title: "Balkan Endemic Nephropathy and the Causative Role of Aristolochic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Balkan endemic nephropathy is a chronic tubulointerstitial disease with
      insidious onset, slowly progressing to end-stage renal disease and
      frequently associated with urothelial carcinoma of the upper urinary tract
      (UTUC).
    explanation: >-
      States the progression to end-stage renal disease.
diagnosis:
- name: Absence of a pathognomonic feature
  description: >-
    There is no single diagnostic finding. Diagnosis rests on residence or origin
    in an endemic settlement, the tubulointerstitial picture with
    low-molecular-weight proteinuria, and exclusion of other causes. The
    aristolactam-DNA adducts and the TP53 fingerprint mutation in tumour tissue
    are the exposure-specific confirmations when tissue is available.
  evidence:
  - reference: PMID:31054628
    reference_title: "Balkan Endemic Nephropathy and the Causative Role of Aristolochic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There are no diagnostic features which are pathognomonic of BEN
    explanation: >-
      States the absence of a pathognomonic feature, which is why the diagnosis is
      built from exposure history plus pattern plus exclusion.
treatments:
- name: Renal replacement therapy
  description: >-
    Dialysis or transplantation at end stage, as for other causes of chronic
    kidney disease. Nothing reverses the nephropathy itself.
  treatment_term:
    preferred_term: Renal Replacement Therapy
    term:
      id: NCIT:C126400
      label: Renal Replacement Therapy
  evidence:
  - reference: PMID:31054628
    reference_title: "Balkan Endemic Nephropathy and the Causative Role of Aristolochic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients with established BEN should be treated like other CKD patients,
      with peritoneal dialysis, hemodialysis or renal transplantation in ESRD
      stage.
    explanation: >-
      Establishes that management of the kidney failure itself is generic.
- name: Prophylactic bilateral nephroureterectomy before transplantation
  description: >-
    The management step specific to this disease. Because the urothelium carries
    the same adduct burden as the kidney, a transplant recipient placed on
    immunosuppression is at high risk of urothelial cancer in the retained native
    tract. Removing it before transplantation is therefore prophylaxis against a
    tumour that has not yet appeared, which is not how transplant workup proceeds
    in other causes of end-stage renal disease.
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Upper Urinary Tract Urothelial Carcinoma
    treatment_effect: INHIBITS
    description: >-
      Removes the at-risk urothelium before immunosuppression is started.
  evidence:
  - reference: PMID:31054628
    reference_title: "Balkan Endemic Nephropathy and the Causative Role of Aristolochic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Bilateral nephroureterectomy should be performed in all BEN recipients
      younger than 65 years
    explanation: >-
      States the recommendation and its age threshold.
  - reference: PMID:31054628
    reference_title: "Balkan Endemic Nephropathy and the Causative Role of Aristolochic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      BEN patients are at high risk of developing UTUC and should undergo
      appropriate examinations to exclude urothelial cancers before being placed
      on the waiting list for kidney transplantation.
    explanation: >-
      Gives the reason the prophylaxis exists, which is what makes this
      disease-specific rather than generic transplant workup.
- name: mTOR inhibitor immunosuppression after transplantation
  description: >-
    Preferred immunosuppression in transplanted BEN patients, chosen for the
    cancer risk this disease carries rather than for graft reasons.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mTOR inhibitor
      term:
        id: NCIT:C2201
        label: mTOR Inhibitor
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Upper Urinary Tract Urothelial Carcinoma
    treatment_effect: INHIBITS
    description: >-
      The drug class is chosen for its antiproliferative effect on the urothelial
      cancer risk this disease carries, not for graft reasons, so it acts on the
      carcinoma node rather than on the nephropathy.
  evidence:
  - reference: PMID:31054628
    reference_title: "Balkan Endemic Nephropathy and the Causative Role of Aristolochic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Immunosuppression with mTOR inhibitors should be considered for
      BEN-transplanted patients.
    explanation: >-
      States the preference for mTOR-based immunosuppression in this population.
- name: Total nephroureterectomy for established UTUC
  description: >-
    Standard surgical therapy once upper tract urothelial carcinoma has been
    diagnosed, with a bladder cuff and regional lymphadenectomy.
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Upper Urinary Tract Urothelial Carcinoma
    treatment_effect: INHIBITS
    description: >-
      Resects the established tumour and its field.
  evidence:
  - reference: PMID:31054628
    reference_title: "Balkan Endemic Nephropathy and the Causative Role of Aristolochic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Regarding treatment of UTUC, total nephroureterectomy with excision of a
      bladder cuff around ureteral ostium and regional lymphadenectomy is
      standard therapy.
    explanation: >-
      States the standard operation and its extent.
biochemical:
- name: Alpha-1-microglobulin (tubular proteinuria)
  notes: >-
    The screening marker. Low-molecular-weight proteinuria is measured as
    alpha-1-microglobulin, and it is what the endemic-village screening protocol
    keys on, alongside eGFR, red cell count, dipstick urinalysis and urine
    cytology. It detects the tubular lesion before renal function falls.
  evidence:
  - reference: PMID:31054628
    reference_title: "Balkan Endemic Nephropathy and the Causative Role of Aristolochic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      determination of tubular proteinuria (α1-Microglobulin), estimated
      Glomerular Filtration Rate (according to CKD-EPI equation), red blood cell
      count, dipstick urinalysis and urine cytology.
    explanation: >-
      Names alpha-1-microglobulin as the tubular-proteinuria measurement in the
      screening panel, with the other components it sits beside.
- name: Aristolactam-DNA adducts and TP53 fingerprint mutation
  notes: >-
    The exposure-specific confirmation, and the only finding the source calls
    diagnostic. It requires tissue, so it confirms rather than screens.
  evidence:
  - reference: PMID:31054628
    reference_title: "Balkan Endemic Nephropathy and the Causative Role of Aristolochic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Detection of aristolactam-DNA adducts and TP53 fingerprint mutation is
      diagnostic
    explanation: >-
      States that the adducts with the fingerprint mutation are diagnostic, which
      is what separates them from the non-pathognomonic clinical picture.
environmental:
- name: Dietary aristolochic acid from Aristolochia clematitis-contaminated grain
  description: >-
    Chronic low-level dietary exposure in rural Danube-basin communities, arising
    where Aristolochia clematitis grows as a weed in wheat fields and its seed is
    harvested, milled and baked with the grain. The exposure explains the disease's
    most distinctive epidemiological feature: it clusters in particular villages
    and runs in families without being inherited, because households share a grain
    supply rather than a genotype.
  exposure_term:
    preferred_term: dietary exposure to aristolochic acid
    term:
      id: ECTO:0000231
      label: exposure to chemical
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
    exposure_route:
    - classification_value: ORAL
    exposure_duration:
    - classification_value: CHRONIC
      notes: >-
        Years to decades of low-level dietary intake, which is what distinguishes
        this from the acute high-dose nephrotoxin exposures the conforming module
        was built around.
  influences_mechanisms:
  - target: Dietary Aristolochic Acid Exposure and Proximal Tubular Uptake
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Contaminated grain is the route by which aristolochic acid reaches the
      proximal tubule.
    evidence:
    - reference: PMID:17620607
      reference_title: "Aristolochic acid and the etiology of endemic (Balkan) nephropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Significant epidemiologic features of EN include its focal occurrence in
        certain villages and a familial, but not inherited, pattern of disease.
      explanation: >-
        The village-level clustering with a familial but non-inherited pattern is
        the epidemiological signature of a shared environmental exposure acting at
        this node, and is what distinguished this from a genetic nephropathy.
  notes: >-
    Bound to the substance-level ECTO:0000231 (exposure to chemical). ECTO was
    checked for an aristolochic-acid-specific exposure class and none is resolvable
    through the repository's ECTO adapter (sqlite:obo:ecto); note that a term
    resolving in OLS is not sufficient, since dismech does not validate ECTO
    against OLS. The specific agent and dietary route are carried in
    preferred_term, description and exposure_classifications.
  evidence:
  - reference: PMID:31054628
    reference_title: "Balkan Endemic Nephropathy and the Causative Role of Aristolochic Acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the causative factor was identified as the environmental phytotoxin
      aristolochic acid (AA) contained in Aristolochia clematitis, a common plant
      growing in wheat fields that was ingested through home-baked bread.
    explanation: >-
      Names the plant, the contamination route and the food vehicle, which is the
      exposure this entry models.

    explanation: >-
      Review abstract supports systemic immunosuppression for thymoma-associated
      autoimmune complications that are not fully controlled by surgery.
- name: Immune Checkpoint Blockade
  description: >-
    PD-1/PD-L1 blockade (pembrolizumab, nivolumab, avelumab, atezolizumab) has
    activity in pretreated advanced thymic epithelial tumours but is used with
    caution in thymoma specifically. SAFETY CAVEAT: grade 3-5 immune-related
    adverse events occurred in 58.3% of thymoma patients versus 17.1% of thymic
    carcinoma patients in a meta-analysis of six phase I/II trials, so the
    benefit-risk balance is far less favourable in thymoma than in thymic
    carcinoma and close monitoring is required. The excess toxicity is modelled
    in this entry as the "Checkpoint-blockade-unmasked immune-related toxicity"
    pathophysiology node, downstream of the same central-tolerance failure that
    drives the spontaneous paraneoplastic syndromes.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pembrolizumab
      term:
        id: NCIT:C106432
        label: Pembrolizumab
  target_mechanisms:
  - target: PD-L1 Mediated Adaptive Immune Resistance
    treatment_effect: INHIBITS
    description: >-
      PD-1/PD-L1 blockade releases the inhibitory signal that thymoma cells
      impose on infiltrating effector T cells, which is the anti-tumour
      rationale for the drug. Note that the toxicity this therapy causes is
      modelled on a separate node reached from the central-tolerance arm, not
      from here.
    evidence:
    - reference: PMID:34568003
      reference_title: "Transcriptomic and Mutational Analysis Discovering Distinct Molecular Characteristics Among Chinese Thymic Epithelial Tumor Patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The high expression of PD-L1 in B2 and B3 thymomas support the potential
        application of immunotherapy on certain thymoma subtypes.
      explanation: >-
        Ties the drug to the specific PD-L1 node it acts on, and to the
        histotypes in which that node is active.
  evidence:
  - reference: PMID:36592506
    reference_title: "Immune checkpoint blockers in patients with unresectable or metastatic thymic epithelial tumours: A meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall response rate to ICB was 18.4%
    explanation: >-
      Establishes measurable but modest activity. Marked PARTIAL because the
      pooled cohort was 77% thymic carcinoma and only 23% thymoma, so the
      response estimate is not thymoma-specific.
  - reference: PMID:36592506
    reference_title: "Immune checkpoint blockers in patients with unresectable or metastatic thymic epithelial tumours: A meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our results suggest ICB as a potential strategy in patients with pretreated
      TET, mainly among patients with thymic carcinoma. Close monitoring is
      strongly advised to detect severe immune-toxicity.
    explanation: >-
      The authors' own conclusion steers checkpoint blockade toward thymic
      carcinoma rather than thymoma, which is why this treatment is recorded here
      with an explicit safety caveat rather than as standard therapy.
differential_diagnoses:
- name: Lymphoma
  description: >-
    The main alternative diagnosis for an anterior mediastinal mass in adults,
    and the one whose management diverges most sharply, since lymphoma is treated
    medically rather than by upfront resection.
  disease_term:
    preferred_term: mediastinal malignant lymphoma
    term:
      id: MONDO:0004021
      label: mediastinal malignant lymphoma
  distinguishing_features:
  - Second most common anterior mediastinal tumour in adults after thymic
    epithelial tumours, and far more prominent than thymic tumours in patients
    under 20 years.
  - Lacks the paraneoplastic autoimmune syndromes (myasthenia gravis, pure red
    cell aplasia, Good syndrome) that characterise thymoma.
  - Lacks the organotypic thymic architecture and the admixed immature T
    lymphocytes seen histologically in thymoma.
  - Requires tissue biopsy and medical therapy rather than upfront surgical
    resection, so misclassification changes management directly.
  evidence:
  - reference: PMID:38264756
    reference_title: "Epidemiology of thymomas and thymic carcinomas in the United States and Germany, 1999-2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among patients aged ≥20 years, TETs accounted for the most prevalent
      anterior mediastinal tumors (US/GER: 63%/64%), followed by lymphomas
      (14%/8%).
    explanation: >-
      Quantifies lymphoma as the leading non-thymic alternative for an adult
      anterior mediastinal mass.
- name: Mediastinal germ cell tumor
  description: >-
    The dominant anterior mediastinal tumour of children and young adults, in
    whom thymoma is rare.
  disease_term:
    preferred_term: mediastinal germ cell tumor
    term:
      id: MONDO:0021067
      label: mediastinal germ cell tumor
  distinguishing_features:
  - Predominates in patients under 20 years, an age band in which thymic
    epithelial tumours are distinctly uncommon.
  - Identifiable by serum tumour markers rather than by the autoimmune
    phenomenology that flags thymoma.
  evidence:
  - reference: PMID:38264756
    reference_title: "Epidemiology of thymomas and thymic carcinomas in the United States and Germany, 1999-2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For patients <20 years, predominant tumors included germ cell tumors
      (42%/14%), lymphomas (38%/53%), and TETs (10%/27%).
    explanation: >-
      Establishes the age-dependent inversion that makes germ cell tumour the
      leading differential in young patients.
discussions:
- discussion_id: gtf2i_mouse_no_autoimmunity
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Impaired thymic epithelial progenitor differentiation
  status: OPEN
  prompt: >-
    Why does the Gtf2i-mutant mouse reproduce the thymic epithelial architecture
    defect of human thymoma without reproducing the autoimmunity that defines the
    human disease?
  rationale: >-
    The mouse model recapitulates the upstream half of the dismech causal chain -
    aberrant thymic architecture, impaired medullary differentiation, a
    cortex-like epithelial signature - yet TCR repertoire analysis shows
    intrathymic selection remains efficient and no autoimmunity develops. That
    matters mechanistically, because the disease-level claim in this entry is
    that the medulla-poor architecture is what causes tolerance failure. The
    mouse dissociates the two, implying that either an additional human-specific
    factor is required (the CTLA-4 and PTPN22 risk polymorphisms reported in
    thymoma-associated myasthenia gravis are candidates) or that the relevant
    lesion is the frank neoplastic mass rather than the differentiation skew the
    transgenic reproduces. Curators should not treat this mouse as evidence for
    the autoimmunity arm of the graph.
  proposed_experiments:
  - experiment_id: exp_gtf2i_autoimmune_permissive_background
    name: Gtf2i L424H on autoimmune-permissive genetic backgrounds
    description: >-
      Cross the Gtf2i L424H allele onto autoimmune-permissive backgrounds, or
      combine it with the CTLA-4 and PTPN22 risk variants reported in human
      thymoma-associated myasthenia gravis, and re-assess autoantibody
      development and neuromuscular phenotype. A positive result would show the
      architecture defect is necessary but not sufficient for autoimmunity.
  - experiment_id: exp_gtf2i_mouse_human_epithelium_comparison
    name: Direct comparison of transgenic and human thymoma epithelium
    description: >-
      Compare TCR repertoire and tissue-restricted antigen expression in the
      transgenic epithelium against human thymoma tissue, to establish whether
      the mouse reaches the same degree of AIRE loss and MHC class II reduction
      that human thymomas show. If it does not, the mismatch is one of degree
      rather than of species-specific biology.
  evidence:
  - reference: PMID:36175547
    reference_title: "Human thymoma-associated mutation of the GTF2I transcription factor impairs thymic epithelial progenitor differentiation in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      TCR repertoire analysis of the cytopenic T cell compartment indicates
      efficient intrathymic selection; hence, despite marked homeostatic
      proliferation of T cell clones, autoimmunity is not observed.
    explanation: >-
      The model's authors state directly that autoimmunity does not develop,
      establishing the mismatch against the human phenotype.
  - reference: PMID:36175547
    reference_title: "Human thymoma-associated mutation of the GTF2I transcription factor impairs thymic epithelial progenitor differentiation in mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, our transgenic mouse model recapitulates some aspects of the
      pathophysiology of a genetically defined type of human thymoma.
    explanation: >-
      The deliberately hedged claim of only partial recapitulation is the
      authors' own scoping of the model's translational validity.
- discussion_id: mhc_class_ii_mg_paradox
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Reduced MHC class II antigen presentation
  status: OPEN
  prompt: >-
    If reduced MHC class II expression contributes to tolerance failure, why is
    better-preserved MHC class II expression the feature that actually tracks
    with the presence of myasthenia gravis?
  rationale: >-
    This entry curates reduced MHC class II antigen presentation as a
    tolerance-failure mechanism, and that reduction is real and most pronounced
    in WHO types A and AB. But in the same study, among all the abnormalities
    assessed, only better-preserved MHC class II levels were significantly
    associated with the presence of myasthenia gravis - and myasthenia gravis is
    clinically most frequent in types B1 and B2, not A and AB. A coherent reading
    is that two requirements pull in opposite directions: escape of autoreactive
    clones needs defective negative selection, but their activation still needs
    enough class II to present the neuromuscular autoantigen. This entry
    currently models only the first. Until this is resolved, the reduced-MHC
    class-II node should not be read as a monotonic driver of myasthenia gravis
    risk. Prospective sequencing data point the same way from a different
    direction: GTF2I mutation, which marks the same A/AB histotypes that carry
    the lowest class II, is prevalent specifically in patients WITHOUT myasthenia
    gravis. Any resolution has to account for both observations together.
  proposed_experiments:
  - experiment_id: exp_mhcii_mg_stratified_by_histotype
    name: MHC class II expression versus MG status stratified by WHO histotype
    description: >-
      Stratify MHC class II expression against myasthenia gravis status within
      each WHO histotype, so the histotype confound (A and AB have both the
      lowest class II and the least myasthenia gravis) is separated from any
      independent effect of class II level on risk.
  - experiment_id: exp_nmtec_restricted_class_ii
    name: nmTEC-restricted versus bulk tumour MHC class II
    description: >-
      Test whether MHC class II expression restricted to the neuromuscular
      antigen-expressing medullary thymic epithelial cell compartment, rather
      than bulk tumour class II, is what determines myasthenia gravis risk. This
      would reconcile the two directions by locating the requirement for class II
      in a specific niche.
  evidence:
  - reference: PMID:18567864
    reference_title: "Common cellular and diverse genetic basis of thymoma-associated myasthenia gravis: role of MHC class II and AIRE genes and genetic polymorphisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among all theses abnormalities, only better preserved expression levels of
      MHCII (P < 0.001) in thymomas were significantly associated with the
      presence of MG.
    explanation: >-
      States the observation that runs against a simple
      reduced-class-II-drives-MG reading, which is what makes this an open
      question rather than a settled mechanism.
- discussion_id: gtf2i_wildtype_driver_unknown
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#GTF2I-driven thymic epithelial transformation
  status: OPEN
  prompt: >-
    What drives the substantial fraction of thymomas that carry no GTF2I
    mutation and no other detectable somatic driver?
  rationale: >-
    The oncogenic arm of this entry is built almost entirely on GTF2I, which is
    honest to the evidence but covers only part of the disease. Prospective
    sequencing with a thymic-tumour-dedicated 77-gene panel found GTF2I mutations
    in 41 percent of patients and NO mutation at all in 39 percent, and the
    authors report a pattern of mutually exclusive and co-occurring mutations
    suggesting that GTF2I-wildtype thymoma has a distinct pathogenesis rather
    than being a diluted version of the same one. Curators should therefore not
    extend GTF2I-derived mechanism to thymoma as a whole. The gap is partly
    technical - epithelial cells were absent from some dissociated tumours, so
    the driver may be present but unsampled in a lymphocyte-dominated specimen -
    and partly biological, since a non-mutational (epigenetic or structural)
    driver would be invisible to a targeted panel by construction.
  proposed_experiments:
  - experiment_id: exp_gtf2i_wildtype_epithelium_enriched_wgs
    name: Epithelium-enriched whole-genome and methylome profiling of GTF2I-wildtype thymoma
    description: >-
      Apply whole-genome sequencing plus methylation and structural-variant
      calling to flow-sorted or laser-captured epithelial cells from
      GTF2I-wildtype thymomas, so that dilution by the abundant non-neoplastic
      thymocyte compartment cannot mask a driver, and so that non-coding and
      epigenetic drivers invisible to a targeted panel are within reach.
  evidence:
  - reference: PMID:41405018
    reference_title: "Somatic Mutations of Thymic Epithelial Tumors Identified in the Prospective THYMOGENE Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 39% of patients, no mutations were found in the 77 genes evaluated.
    explanation: >-
      Quantifies the fraction of thymic epithelial tumours with no identified
      driver even under dedicated targeted sequencing.
  - reference: PMID:41405018
    reference_title: "Somatic Mutations of Thymic Epithelial Tumors Identified in the Prospective THYMOGENE Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The absence of epithelial cells in some dissociated tumors highlights the
      challenge of identifying mutations in a subset of thymic epithelial tumors
      that lack the GTF2I mutation.
    explanation: >-
      Identifies the sampling artefact that makes part of this gap technical
      rather than biological, which is what the proposed experiment targets.
datasets:
- accession: geo:GSE284479
  title: Altered thymopoiesis in thymoma is associated with defects in negative selection machinery and decreased Treg abundance
  description: Thymomas are rare thymic epithelial tumors harboring a high but variable proportion of lymphocytes without obvious function. Auto-immunity is present in one third of patients at diagnosis. Herein, we performed a phenotypic, scRNAseq, and spatial analysis of both the T cells and tumoral cells. All stages of T cell development -from immature to mature- were present in the tumor suggesting active thymopoiesis in thymoma. However, multiple approaches suggest a maturation blockade at the DN-DP stages. In the mature T cell compartment, the frequency of Tregs was strongly decreased.

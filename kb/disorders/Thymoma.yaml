notes: >-
  Following the cancer curation guidance from issue 1198, this entry treats
  thymoma as the disease-level mechanism-graph unit. WHO histotypes and
  invasion status are represented as flat subtype facets grounded to NCIT,
  rather than as separate dismech disease pages.
classifications:
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    evidence:
    - reference: PMID:38264756
      reference_title: "Epidemiology of thymomas and thymic carcinomas in the United States and Germany, 1999-2019."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients aged 0-19 (n=478) and ≥20 years (n=17,459) diagnosed with
        malignant tumors of the anterior mediastinum were identified from the
        Surveillance, Epidemiology, and End Results registry (SEER)
      explanation: >-
        Thymoma is registered and analysed as a malignant neoplasm in national
        cancer registries, supporting an oncology classification.
  - classification_value: IMMUNE_RHEUMATOLOGIC
    evidence:
    - reference: PMID:40983285
      reference_title: "Management of Autoimmune Conditions Associated With Thymic Epithelial Tumors."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Thymic epithelial tumors are associated with diverse autoimmune
        manifestations, with 30% to 50% of patients developing at least one
        autoimmune condition.
      explanation: >-
        A third to a half of patients develop autoimmune disease, so thymoma
        also belongs to the immune/rheumatologic axis rather than oncology alone.

progression:
- phase: Adult-onset presentation
  age_range: sixth to seventh decade
  notes: >-
    Thymoma is an adult-onset tumor; registry series place the mean age at
    diagnosis near 60 years in both the US and Germany, with a male-to-female
    ratio close to 1.
  evidence:
  - reference: PMID:38264756
    reference_title: "Epidemiology of thymomas and thymic carcinomas in the United States and Germany, 1999-2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The male-to-female ratio was 1:1.09/1.03, and the mean age 59.48 ± 14.89/61.33 ± 13.94.
    explanation: >-
      Registry data establish the adult, near-sixth-decade onset and the
      approximately equal sex ratio.
- phase: Locally advanced and disseminated disease
  notes: >-
    Progression is captured clinically by Masaoka-Koga stage. Advanced
    (stage III/IV) disease is an independent predictor of worse overall
    survival after resection.
  evidence:
  - reference: PMID:42260490
    reference_title: "Comparative effectiveness of video-assisted thoracoscopic surgery versus open thymectomy for thymoma: a propensity score-matched analysis of 317 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Advanced Masaoka-Koga stage (III/IV) independently predicted worse OS
    explanation: >-
      Multivariable analysis of a surgical thymoma cohort supports Masaoka-Koga
      stage as an independent prognostic axis of disease progression.
- phase: Post-resection surveillance
  notes: >-
    Primary tumor size is an independent prognostic factor in resected thymoma
    (but not in thymic carcinoma), supporting size-aware long-term follow-up.
  evidence:
  - reference: PMID:39730963
    reference_title: "Prognostic Impact of Primary Tumor Size in Thymic Epithelial Tumor: An NCDB-Based Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tumor size in thymoma, but not in thymic carcinoma, was an important
      prognostic factor in the U.S.
    explanation: >-
      NCDB analysis supports tumor size as a thymoma-specific prognostic factor
      after resection.
has_subtypes:
- name: Type A thymoma
  classification: histological_pattern
  subtype_term:
    preferred_term: Type A thymoma
    term:
      id: NCIT:C6454
      label: Thymoma Type A
  description: >-
    Spindle-cell thymoma with relatively indolent clinical behavior and marked
    enrichment for GTF2I mutation.
  evidence:
  - reference: PMID:24974848
    reference_title: "A specific missense mutation in GTF2I occurs at high frequency in thymic epithelial tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We analyzed 28 thymic epithelial tumors (TETs) using next-generation
      sequencing and identified a missense mutation (chromosome 7
      c.74146970T>A) in GTF2I at high frequency in type A thymomas, a
      relatively indolent subtype.
    explanation: >-
      Human tumor sequencing links WHO type A thymoma to indolent biology and a
      strong GTF2I-mutant state.
- name: Type AB thymoma
  classification: histological_pattern
  subtype_term:
    preferred_term: Type AB thymoma
    term:
      id: NCIT:C6885
      label: Thymoma Type AB
  description: >-
    Mixed spindle-cell and lymphocyte-rich thymoma that shares much of the
    GTF2I-enriched molecular profile of type A thymoma.
  evidence:
  - reference: PMID:24974848
    reference_title: "A specific missense mutation in GTF2I occurs at high frequency in thymic epithelial tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a series of 274 TETs, we detected the GTF2I mutation in 82% of type A
      and 74% of type AB thymomas but rarely in the aggressive subtypes, where
      recurrent mutations of known cancer genes have been identified.
    explanation: >-
      Large human tumor series supports type AB thymoma as part of the
      GTF2I-enriched, less aggressive facet of thymoma.
- name: Type B1 thymoma
  classification: histological_pattern
  subtype_term:
    preferred_term: Type B1 thymoma
    term:
      id: NCIT:C6887
      label: Thymoma Type B1
  description: >-
    Cortical-like thymoma rich in immature T lymphocytes, generally showing less
    invasion than type B3 thymoma.
  evidence:
  - reference: PMID:15063231
    reference_title: "WHO histologic classification is a prognostic indicator in thymoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of invasion to neighboring organs increased according to
      tumor subtype in the order A (0%), AB (6%), B1 (19%), B2 (25%), B3 (42%),
      and C (89%).
    explanation: >-
      Positions type B1 on the invasion gradient below B2 and B3, supporting its
      intermediate place on the histologic subtype axis.
- name: Type B2 thymoma
  classification: histological_pattern
  subtype_term:
    preferred_term: Type B2 thymoma
    term:
      id: NCIT:C6888
      label: Thymoma Type B2
  description: >-
    Cortical thymoma with numerous lymphocytes and more conspicuous neoplastic
    epithelial cells; often associated with myasthenia gravis. It is the single
    most frequently assigned WHO histotype among thymomas.
  evidence:
  - reference: PMID:25521402
    reference_title: "Development of the international thymic malignancy interest group international database: an unprecedented resource for the study of a rare group of tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WHO type B2 was the most frequent histologic classification among thymomas,
      whereas squamous was the most common among thymic carcinomas.
    explanation: >-
      The ITMIG international database establishes type B2 as the most common
      thymoma histotype, supporting its prominence on the histologic subtype axis.
- name: Type B3 thymoma
  classification: histological_pattern
  subtype_term:
    preferred_term: Type B3 thymoma
    term:
      id: NCIT:C7997
      label: Thymoma Type B3
  description: >-
    Epithelial-predominant thymoma with higher local invasiveness and worse
    disease-free survival than type A/AB and B1/B2 thymomas.
  evidence:
  - reference: PMID:15063231
    reference_title: "WHO histologic classification is a prognostic indicator in thymoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of invasion to neighboring organs increased according to
      tumor subtype in the order A (0%), AB (6%), B1 (19%), B2 (25%), B3 (42%),
      and C (89%).
    explanation: >-
      Human surgical series supports higher invasive propensity in type B3
      thymoma than in lower-grade WHO thymoma histotypes.
  - reference: PMID:15063231
    reference_title: "WHO histologic classification is a prognostic indicator in thymoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease-free survival rates were 100% for types A and AB, 83% for
      types B1 and B2, 36% for type B3, and 28% for type C thymoma at 10 years.
    explanation: >-
      Long-term follow-up supports the prognostic distinction of type B3 within
      the thymoma histologic axis.
- name: Encapsulated thymoma
  classification: invasion_status
  subtype_term:
    preferred_term: encapsulated thymoma
    term:
      id: NCIT:C7386
      label: Encapsulated Thymoma
  description: >-
    Organ-confined thymoma without gross invasion, generally corresponding to a
    more resectable and clinically indolent presentation.
  evidence:
  - reference: PMID:15063231
    reference_title: "WHO histologic classification is a prognostic indicator in thymoma."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of invasion to neighboring organs increased according to
      tumor subtype in the order A (0%), AB (6%), B1 (19%), B2 (25%), B3 (42%),
      and C (89%).
    explanation: >-
      Supports a substantial non-invasive, organ-confined population within
      thymoma (no invasion at all in type A), which is what the encapsulated pole
      of this axis captures. Marked PARTIAL because the series reports invasion
      frequency by histotype rather than encapsulation status directly.
- name: Invasive thymoma
  classification: invasion_status
  subtype_term:
    preferred_term: invasive thymoma
    term:
      id: NCIT:C7904
      label: Invasive Malignant Thymoma
  description: >-
    Thymoma that invades neighboring structures or disseminates intrathoracically
    and more often requires multimodal treatment.
  evidence:
  - reference: PMID:20207296
    reference_title: "[Epithelial tumours of the thymus]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Their clinical behaviour varies widely, from a relative indolence to the
      potential of lymph node and/or systematic metastases.
    explanation: >-
      Review-level evidence supports an invasion-status facet within thymoma
      that is distinct from WHO histologic subtype.
pathophysiology:
- name: GTF2I-driven thymic epithelial transformation
  biological_scale: CELLULAR
  subtypes:
  - Type A thymoma
  - Type AB thymoma
  description: >-
    Recurrent GTF2I mutation defines a major molecular facet of type A and AB
    thymoma and promotes thymic epithelial proliferation and transformation.
  gene:
    preferred_term: GTF2I
    description: Recurrently mutated thymoma driver, usually p.L424H.
    modifier: ABNORMAL
    term:
      id: hgnc:4659
      label: GTF2I
  cell_types:
  - preferred_term: epithelial cell of thymus
    term:
      id: CL:0002293
      label: epithelial cell of thymus
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  locations:
  - preferred_term: thymus
    term:
      id: UBERON:0002370
      label: thymus
  evidence:
  - reference: PMID:24974848
    reference_title: "A specific missense mutation in GTF2I occurs at high frequency in thymic epithelial tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a series of 274 TETs, we detected the GTF2I mutation in 82% of type A
      and 74% of type AB thymomas but rarely in the aggressive subtypes, where
      recurrent mutations of known cancer genes have been identified.
    explanation: >-
      Human tumor sequencing supports GTF2I mutation as the defining molecular
      driver of the indolent A/AB thymoma facet.
  - reference: PMID:32034314
    reference_title: "Mutant GTF2I induces cell transformation and metabolic alterations in thymic epithelial cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our findings identify GTF2I mutation as a new oncogenic driver that is
      responsible for transformation of thymic epithelial cells.
    explanation: >-
      Cell-based functional evidence directly shows that mutant GTF2I can drive
      thymic epithelial transformation.
  - reference: PMID:36049655
    reference_title: "A Knock-In Mouse Model of Thymoma With the GTF2I L424H Mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We observed that the Gtf2i mutation impairs development of the thymic
      medulla and maturation of medullary thymic epithelial cells in young mice
      and causes tumor formation in the thymus of aged mice.
    explanation: >-
      Conditional knock-in of the human hotspot allele into Foxn1-positive thymic
      epithelium is sufficient to produce thymoma in vivo, raising the
      transformation claim above the in vitro evidence alone.
  - reference: PMID:36049655
    reference_title: "A Knock-In Mouse Model of Thymoma With the GTF2I L424H Mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Results of gene set variation assay analysis revealed that gene signatures
      of cortical thymic epithelial cells and thymic epithelial progenitor cells
      are also enriched in the thymomas of the knock-in mice, which mirrors the
      human counterparts in The Cancer Genome Atlas database.
    explanation: >-
      The murine tumours reproduce the cortical/progenitor transcriptional
      signature of human thymoma, supporting the model's relevance to the human
      transformation programme.
  downstream:
  - target: Metabolic stress survival program
    description: Mutant TFII-I supports stress-adapted growth states.
    evidence:
    - reference: PMID:32034314
      reference_title: "Mutant GTF2I induces cell transformation and metabolic alterations in thymic epithelial cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Gtf2i L424H knockin cells exhibited cell transformation, aneuploidy, and
        increase tumor growth and survival under glucose deprivation or DNA
        damage.
      explanation: >-
        Introducing the GTF2I lesion is sufficient to confer the stress-adapted
        survival state, supporting a causal edge from the transformation node to
        the metabolic program.
  - target: Impaired thymic epithelial progenitor differentiation
    description: >-
      Mutant GTF2I skews bipotent thymic epithelial progenitors away from
      medullary differentiation.
    evidence:
    - reference: PMID:36175547
      reference_title: "Human thymoma-associated mutation of the GTF2I transcription factor impairs thymic epithelial progenitor differentiation in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Phenotypic and molecular characterization of the mutant epithelium
        indicates that medullary differentiation is particularly affected as a
        result of impaired differentiation of bi-potent epithelial progenitors.
      explanation: >-
        A mouse model carrying the human thymoma GTF2I mutation shows that the
        driver lesion causally impairs medullary epithelial differentiation.

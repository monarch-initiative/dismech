- name: PD-L1 Mediated Adaptive Immune Resistance
  conforms_to: "immune_checkpoint_blockade#Adaptive Immune Resistance"
  biological_scale: CELLULAR
  subtypes:
  - Type B2 thymoma
  - Type B3 thymoma
  description: >-
    Thymoma tumour cells upregulate PD-L1 (CD274), engaging PD-1 on infiltrating
    effector T cells and suppressing anti-tumour cytotoxicity. Expression is not
    uniform across the histologic axis: it is high specifically in the
    lymphocyte-rich cortical types B2 and B3, which is the molecular rationale
    for offering checkpoint blockade in those subtypes. This node is the
    tumour-immune-evasion arm of the entry and is mechanistically separate from
    the central-tolerance arm, even though both converge on checkpoint-inhibitor
    therapy - one as the reason to give it, the other as the reason it is
    dangerous in thymoma.
  cell_types:
  - preferred_term: epithelial cell of thymus
    term:
      id: CL:0002293
      label: epithelial cell of thymus
  biological_processes:
  - preferred_term: negative regulation of T cell mediated immunity
    modifier: INCREASED
    term:
      id: GO:0002710
      label: negative regulation of T cell mediated immunity
  locations:
  - preferred_term: thymus
    term:
      id: UBERON:0002370
      label: thymus
  evidence:
  - reference: PMID:34568003
    reference_title: "Transcriptomic and Mutational Analysis Discovering Distinct Molecular Characteristics Among Chinese Thymic Epithelial Tumor Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found high expression of CD274 (PD-L1) in B2 and B3 thymoma samples, and
      validated its expression using immunohistochemistry (IHC).
    explanation: >-
      Transcriptomic detection confirmed at the protein level by IHC establishes
      PD-L1 upregulation in specific thymoma histotypes.
  - reference: PMID:34568003
    reference_title: "Transcriptomic and Mutational Analysis Discovering Distinct Molecular Characteristics Among Chinese Thymic Epithelial Tumor Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The high expression of PD-L1 in B2 and B3 thymomas support the potential
      application of immunotherapy on certain thymoma subtypes.
    explanation: >-
      The authors draw the therapeutic inference directly, which is what makes
      this node the treatment target rather than merely a descriptive finding.
- name: Checkpoint-blockade-unmasked immune-related toxicity
  biological_scale: ORGANISM
  description: >-
    Pharmacologic PD-1/PD-L1 blockade in thymoma removes a peripheral brake on
    a T-cell repertoire that was already incompletely purged of autoreactive
    clones, producing severe (grade 3-5) immune-related adverse events at a rate
    far above that seen in thymic carcinoma treated with the same agents. This
    node is a treatment-toxicity consequence of the same tolerance defect that
    drives the spontaneous paraneoplastic syndromes, not an independent
    mechanism.
  notes: >-
    Deliberately carries no biological_processes descriptor. The defective
    thymic selection that predisposes to this toxicity is modelled once,
    upstream, on "Central tolerance failure in the thymic microenvironment";
    repeating it here would duplicate a cause onto its own distal consequence.
    The evidence attached to this node is clinical irAE incidence and says
    nothing about any intrathymic process, so no descriptor would be
    evidence-supported here.
  evidence:
  - reference: PMID:36592506
    reference_title: "Immune checkpoint blockers in patients with unresectable or metastatic thymic epithelial tumours: A meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although immune checkpoint blockers (ICB) are a potential treatment
      strategy, their efficacy seems limited with an increased risk of
      immune-related adverse events (ir-AEs), thus hampering their application in
      daily clinical practice.
    explanation: >-
      Meta-analysis of six phase I/II trials establishes excess immune-related
      toxicity as the dominant limitation of checkpoint blockade in thymic
      epithelial tumours.
  - reference: PMID:36592506
    reference_title: "Immune checkpoint blockers in patients with unresectable or metastatic thymic epithelial tumours: A meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of grade 3-5 ir-AEs was 26.4%, with 17.1% in thymic
      carcinoma and 58.3% in thymoma.
    explanation: >-
      The thymoma-versus-carcinoma split quantifies the excess toxicity
      attributable to the thymoma-specific tolerance defect.

  - reference: PMID:32034314
    reference_title: "Mutant GTF2I induces cell transformation and metabolic alterations in thymic epithelial cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Gtf2i mutation also increased the expression of several glycolytic
      enzymes, cyclooxygenase-2, and caused modifications of lipid metabolism.
    explanation: >-
      The same in vitro study supports metabolic rewiring as a distinct
      downstream consequence of mutant GTF2I.
- name: Impaired thymic epithelial progenitor differentiation
  biological_scale: CELLULAR
  description: >-
    Mutant GTF2I blocks differentiation of bipotent thymic epithelial
    progenitors, with the medullary lineage disproportionately affected. The
    resulting epithelium is dominated by an immature, cortex-like signature and
    supports reduced thymopoietic activity. This is the mechanistic bridge
    between the GTF2I oncogenic axis and the medulla-poor architecture that
    underlies the tolerance defects downstream.
  gene:

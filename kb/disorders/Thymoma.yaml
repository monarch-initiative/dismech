    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Co-dominant expression of wild-type and mutated forms of Gtf2i in the mouse
      thymic epithelium is associated with aberrant thymic architecture and
      reduced thymopoietic activity.
    explanation: >-
      In vivo modelling of the human driver mutation supports aberrant thymic
      epithelial architecture and reduced thymopoiesis as a direct consequence.
  - reference: PMID:36175547
    reference_title: "Human thymoma-associated mutation of the GTF2I transcription factor impairs thymic epithelial progenitor differentiation in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The resulting gene expression signature is dominated by that of immature
      cortex-like thymic epithelial cells.
    explanation: >-
      The cortex-like, medulla-poor epithelial signature is the molecular
      counterpart of the cortex-dominant thymoma architecture seen in patients.
  downstream:
  - target: Central tolerance failure in the thymic microenvironment
    description: >-
      A medulla-poor, cortex-like epithelium lacks the compartment in which
      negative selection is normally enforced.
    evidence:
    - reference: PMID:18401674
      reference_title: "Immunological function of thymoma and pathogenesis of paraneoplastic myasthenia gravis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        this might imply that thymoma lacks the functional medulla where
        professional antigen-presenting cells are engaged in negative selection.
      explanation: >-

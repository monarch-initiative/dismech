    in MG patients aged 60 years and younger.
  notes: >-
    Titin is the major autoantigen recognised by anti-striated-muscle antibodies.
    Its diagnostic value is as a prompt to search for an underlying thymoma in a
    myasthenia gravis patient, not as a primary thymoma screening test.

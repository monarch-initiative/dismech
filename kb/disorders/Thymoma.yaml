  presence: present
  frequency: FREQUENT
  context: >-
    Measured in myasthenia gravis patients. The FREQUENT band is conditioned on
    the thymectomized MG cohort in which it was established (56 of 70 thymoma
    patients), NOT on unselected thymoma patients, in whom the rate is not
    established by this source.
  specificity: >-
    In thymectomized myasthenia gravis patients, anti-titin antibodies were
    present in 56/70 (80%) of those with thymoma versus 17/165 (10%) of those

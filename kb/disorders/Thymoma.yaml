      id: UBERON:0002370
      label: thymus
  evidence:
  - reference: PMID:41098393
    reference_title: "Pathogenesis of thymoma-associated myasthenia gravis: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Since thymomas are mainly composed of the cortex, with few medullae, MG
      may be caused by immature thymoma-derived T cells that fail to undergo
      negative selection and have not yet acquired sufficient self-tolerance.
    explanation: >-
      Transcriptomic and spatial analyses support negative-selection failure as
      a central mechanism linking thymoma to autoimmunity.
  - reference: PMID:18567864
    reference_title: "Common cellular and diverse genetic basis of thymoma-associated myasthenia gravis: role of MHC class II and AIRE genes and genetic polymorphisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Generation of autoreactive CD4(+) effector T cells and defective
      production of regulatory CD4(+) T cells inside thymomas contribute to the
      development of myasthenia gravis (MG) in >90% of MG(+) thymomas.
    explanation: >-
      Human thymoma studies support autoreactive effector-T-cell generation and
      deficient Treg production as distinct components of tolerance failure.
  downstream:
  - target: Neuromuscular autoantigen-expressing medullary epithelial niche
    description: Residual medullary-like niches can concentrate MG-relevant antigens.
    evidence:
    - reference: PMID:41098393
      reference_title: "Pathogenesis of thymoma-associated myasthenia gravis: a narrative review."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Medullary structures, although much smaller than those of the normal
        thymus, are present in thymomas with MG and MG-susceptible genes are
        clustered.
      explanation: >-
        Residual medullary structures persist specifically in MG-associated
        thymomas, supporting the edge from the tolerance-failing microenvironment
        to a focal autoantigen niche.
  - target: Myasthenia gravis
    description: Autoreactive T-cell escape supports pathogenic neuromuscular autoimmunity.
    evidence:
    - reference: PMID:18567864
      reference_title: "Common cellular and diverse genetic basis of thymoma-associated myasthenia gravis: role of MHC class II and AIRE genes and genetic polymorphisms."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Generation of autoreactive CD4(+) effector T cells and defective
        production of regulatory CD4(+) T cells inside thymomas contribute to the
        development of myasthenia gravis (MG) in >90% of MG(+) thymomas.
      explanation: >-
        Directly asserts the causal contribution of intratumoral tolerance
        failure to myasthenia gravis in the large majority of MG-positive cases.
    - reference: PMID:18401674
      reference_title: "Immunological function of thymoma and pathogenesis of paraneoplastic myasthenia gravis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        These findings suggest that thymoma generates autoreactive T cells
        causing autoimmunity.
      explanation: >-
        Independent review support for autoreactive T-cell export as the route
        from thymoma to autoimmune disease.
  - target: Pure red cell aplasia
    description: Immune dysregulation can suppress erythroid precursors.
    evidence:
    - reference: PMID:40983285
      reference_title: "Management of Autoimmune Conditions Associated With Thymic Epithelial Tumors."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Myasthenia gravis is the most common, followed by less frequent but
        notable conditions including pure red cell aplasia, Good's syndrome, and
        various neurologic, dermatologic, and systemic autoimmune disorders.
      explanation: >-
        Places pure red cell aplasia within the same thymic-dysfunction-driven
        autoimmune spectrum as myasthenia gravis.
  - target: Good syndrome
    description: Immune dysregulation can coexist with thymoma-associated immunodeficiency.
    evidence:
    - reference: PMID:37729389
      reference_title: "Good's syndrome: brief overview of an enigmatic immune deficiency."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        It was initially considered a thymoma-associated variant of primary
        antibody deficiencies with a reduced or absent number of mature B cells,
        but it later emerged that significant defects of T cell-mediated immune
        functions are the underlying cause of opportunistic infections.
      explanation: >-
        Supports T-cell-compartment dysfunction as the operative defect in Good
        syndrome, consistent with an origin in disturbed intrathymic T-cell
        development. Marked PARTIAL because the same review states that the
        pathophysiology of Good syndrome remains unknown, so the specific edge
        from thymoma tolerance failure to Good syndrome is not established.
  - target: Checkpoint-blockade-unmasked immune-related toxicity
    description: >-
      A pre-existing tolerance defect lowers the threshold for severe autoimmune
      toxicity when PD-1/PD-L1 checkpoints are pharmacologically removed.
    evidence:
    - reference: PMID:36592506
      reference_title: "Immune checkpoint blockers in patients with unresectable or metastatic thymic epithelial tumours: A meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The incidence of grade 3-5 ir-AEs was 26.4%, with 17.1% in thymic
        carcinoma and 58.3% in thymoma.
      explanation: >-
        Severe immune-related toxicity is over three times more frequent in
        thymoma than in thymic carcinoma treated with the same agents, which
        tracks the tolerance defect that distinguishes thymoma.

- name: Avoidance of nephrotoxic and liver-cyst-promoting exposures
  description: >-
    Avoid long-term nephrotoxic analgesic use, smoking and high-salt intake. In substantial
    PLD, discuss estrogen exposure and contraceptive or hormone-treatment alternatives with
    clinicians because estrogen can promote liver cyst growth.
  treatment_term:
    preferred_term: ADPKD risk-reduction counseling
    term:
      id: NCIT:C61547
      label: Counseling

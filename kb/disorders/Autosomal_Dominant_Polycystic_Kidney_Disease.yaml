- name: Reduced epithelial fatty acid oxidation
  description: >-
    Pkd1-deficient mouse renal epithelial cell lines show reduced fatty acid oxidation. The
    same study did not find increased glycolysis, and human therapeutic relevance remains unproven.
  evidence:
  - reference: PMID:27077126
    reference_title: Fatty Acid Oxidation is Impaired in An Orthologous Mouse Model of Autosomal Dominant Polycystic Kidney Disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: We found that renal epithelial cells lacking Pkd1 have cell autonomous defects in fatty acid oxidation.
    explanation: >-
      Paired immortalized mouse renal epithelial cell lines; the bulk kidney metabolomic signature
      is a separate model-organism observation.
  - reference: PMID:27077126
    reference_title: Fatty Acid Oxidation is Impaired in An Orthologous Mouse Model of Autosomal Dominant Polycystic Kidney Disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Changes in glycolysis were not observed (Fig. 3, c and d, and Supplementary Figure S5).
    explanation: This experiment does not support a universal switch to increased glycolysis.

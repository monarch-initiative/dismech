- name: Risk-based intracranial aneurysm screening
  description: >-
    Discuss screening in people with personal subarachnoid hemorrhage or family intracranial
    aneurysm, subarachnoid hemorrhage or unexplained sudden death who could benefit from treatment.
    Other situations, uncertain family history and patient preferences require shared decisions.
    Noncontrast time-of-flight MRA is preferred; negative high-risk screening may be repeated
    after an individualized 5–10-year interval.
  diagnosis_term:
    preferred_term: Risk-based intracranial aneurysm screening
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:20301424
    reference_title: Polycystic Kidney Disease, Autosomal Dominant.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: MRA examination for intracranial aneurysms in adults determined to be at high risk.

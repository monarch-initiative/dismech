datasets:
- accession: metabolomics_workbench:ST000878
  title: Fatty Acid Oxidation is Impaired in An Orthologous Mouse Model of Autosomal Dominant Polycystic Kidney Disease
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  data_type: METABOLOMICS
  notes: >-
    Mouse kidney metabolomics associated with PMID:27077126. The primary study analyzed 14 male
    kidneys, including eight Pkd1 mutants; bulk metabolite changes often tracked kidney disease
    burden. Its separate paired cell-line experiments found impaired fatty acid oxidation without
    increased glycolysis. This is a mouse tissue dataset, not a patient cohort or evidence of
    a clinically effective diet. The accession was independently resolved against Metabolomics
    Workbench during this review.
notes: >-
  The manual source-curation fallback research report and genuine falcon hypothesis exploration
  were both reviewed. Full GeneReviews and KDIGO 2025 were used with primary cilia, somatic-variant,
  NEK8, metabolic and trial papers. The obligate flow-calcium model is contested. Minor-gene
  phenotypes and historical catalog frequencies should not be generalized to typical PKD1/PKD2
  disease or vice versa. Unresolved mechanisms for incidental extrarenal associations are left
  unconnected rather than inferred from renal-cell evidence. The pituitary adenoma catalog association
  is not an established causal complication. The metabolic mouse dataset motivates investigation,
  not human dietary treatment. No new therapeutic efficacy is asserted for exploratory STING,
  DNA-structure or other hypothesis-report leads.
discussions:
- discussion_id: adpkd_second_hit_universality
  kind: KNOWLEDGE_GAP
  prompt: Which cysts require somatic second hits, and when do those hits occur?
  attaches_to:
  - pathophysiology#Somatic PKD1 or PKD2 inactivation in cyst epithelium
  rationale: >-
    Detection differed between epithelial-enriched samples and smaller whole cysts from end-stage
    kidneys. Variant phase, low-frequency structural variation and early disease remain incompletely
    assessed; neither a universal requirement nor its absence is established.
  status: OPEN
  evidence:
  - reference: PMID:39702469
    reference_title: Somatic mutation in autosomal dominant polycystic kidney disease revealed by deep sequencing human kidney cysts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Another major limitation is interpreting data from end-stage kidney, in which it is not
      possible to determine whether a somatic variant was present at cyst initiation or is a
      result of secondary end-stage disease processes.
    explanation: The primary paper states the temporal limitation directly.
- discussion_id: adpkd_metabolic_translation
  kind: KNOWLEDGE_GAP
  prompt: Does correcting fatty acid oxidation improve human ADPKD independently of established cyst burden?
  attaches_to:
  - pathophysiology#Reduced epithelial fatty acid oxidation
  rationale: >-
    The associated mouse dataset and paired cell assays implicate lipid metabolism but do not
    establish a human therapy. Sex, disease burden and model-specific absence of increased glycolysis
    limit generalization.
  status: OPEN
  evidence:
  - reference: PMID:27077126
    reference_title: Fatty Acid Oxidation is Impaired in An Orthologous Mouse Model of Autosomal Dominant Polycystic Kidney Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This study also suggests two important new lines for future investigation: how loss of
      Pkd1 results in a cell autonomous fatty acid oxidation defect and, more broadly, how altered
      cellular metabolism leads to dysregulation of tubular diameter and planar cell polarity.
    explanation: Authors identify unresolved upstream and downstream links after the mouse and cell experiments.
differential_diagnoses:
- name: Age-related simple kidney cysts
  description: >-
    A few incidental cysts without family history are not sufficient to diagnose ADPKD. Imaging
    modality, age, cyst distribution and extrarenal findings matter.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1246/pdf/Bookshelf_NBK1246.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1246/pdf/Bookshelf_NBK1246.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: benign simple cysts and other cystic diseases should be considered in the differential diagnosis.
    explanation: >-
      GeneReviews notes this differential when family history is absent; small cysts are frequent
      in otherwise healthy imaged adults.
- name: HNF1B-related kidney disease
  description: >-
    Cystic kidneys can overlap ADPKD, but early diabetes, hypomagnesemia, pancreatic disease
    and congenital urinary-tract anomalies suggest HNF1B-related disease.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1246/pdf/Bookshelf_NBK1246.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1246/pdf/Bookshelf_NBK1246.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Maturity-onset diabetes of the young, pancreatic disease, ↑ liver enzymes, hypomagnesemia,
      congenital kidney & urinary tract anomalies
    explanation: GeneReviews differential table gives distinguishing HNF1B features.
- name: Autosomal recessive polycystic kidney disease
  description: >-
    PKHD1-related recessive disease commonly presents neonatally with enlarged cystic kidneys
    and congenital hepatic fibrosis; severe early ADPKD remains a differential, so onset alone
    is insufficient.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1246/pdf/Bookshelf_NBK1246.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1246/pdf/Bookshelf_NBK1246.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Pulmonary hypoplasia, early-onset kidney failure, liver fibrosis rather than cysts, TKV ↓ over time (rather than ↑)
    explanation: GeneReviews differential table contrasts PKHD1-related ARPKD with typical ADPKD.
- name: Autosomal dominant tubulointerstitial kidney disease
  description: >-
    UMOD, MUC1 and related disorders can include renal cysts, but interstitial fibrosis and
    declining function without marked kidney enlargement predominate. Early gout suggests UMOD/REN
    disease. DNAJB11 and ALG5 phenotypes overlap this distinction.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1246/pdf/Bookshelf_NBK1246.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1246/pdf/Bookshelf_NBK1246.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Fibrosis rather than cysts is the major kidney phenotype.
    explanation: GeneReviews differential table states this discriminator for MUC1/UMOD-related disease.
- name: Tuberous sclerosis complex and PKD1-TSC2 contiguous deletion
  description: >-
    Angiomyolipomas, characteristic skin/brain lesions or cardiac rhabdomyomas suggest tuberous
    sclerosis. A contiguous deletion involving PKD1 and TSC2 can combine severe early cystic
    disease with tuberous sclerosis features.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1246/pdf/Bookshelf_NBK1246.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1246/pdf/Bookshelf_NBK1246.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Kidney angiomyolipomas, skin & brain manifestations, rhabdomyomas, lymphangioleiomyomatosis
    explanation: >-
      GeneReviews differential table lists tuberous sclerosis features and points to the PKD1-TSC2
      contiguous-deletion context.

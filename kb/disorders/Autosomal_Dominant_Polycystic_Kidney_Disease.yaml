    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Long-term administration of nephrotoxic agents, high levels of caffeine, high-salt diet,
      smoking, and obesity, and in individuals with severe PLD, use of estrogens and possibly
      progestogens.
    explanation: GeneReviews agents/circumstances to avoid; estrogen counseling is reinforced by KDIGO 2025.
diagnosis:
- name: Age- and family-history-specific kidney imaging
  description: >-
    In individuals with an affected first-degree relative and typical PKD1/PKD2 risk, ultrasound
    criteria include at least three total renal cysts at age 15–39, at least two in each kidney
    at 40–59, and at least four in each kidney at age 60 or above. MRI can resolve equivocal
    cases. A negative scan in a younger relative does not exclude all genotypes; criteria for
    incidental cysts without family history and for minor genes require separate assessment.
  diagnosis_term:
    preferred_term: Age- and family-history-specific kidney imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:20301424
    reference_title: Polycystic Kidney Disease, Autosomal Dominant.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of ADPKD is established in a proband with age-specific kidney imaging criteria
      and either an affected first-degree relative with ADPKD or a heterozygous pathogenic variant
      in PKD1, PKD2, or one of the less common associated genes (ALG5, ALG9, DNAJB11, GANAB,
      IFT140) identified by molecular genetic testing.
    explanation: GeneReviews establishes imaging plus family/genetic context.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1246/pdf/Bookshelf_NBK1246.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1246/pdf/Bookshelf_NBK1246.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The presence of three or more (unilateral or bilateral) kidney cysts in an individual age 15-39 years
    explanation: GeneReviews gives age-specific ultrasound criteria in a relative at 50% risk.
- name: Molecular confirmation and familial testing
  description: >-
    Use a cystic-kidney multigene assay appropriate to the phenotype. PKD1 pseudogene homology,
    copy-number variation and low-level mosaicism need assay-specific coverage; a negative routine
    panel or a variant of uncertain significance does not establish or exclude every form. Test
    a known familial pathogenic variant when evaluating relatives or related donors.
  diagnosis_term:
    preferred_term: Molecular confirmation and familial testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1246/pdf/Bookshelf_NBK1246.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1246/pdf/Bookshelf_NBK1246.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Multigene panels using next-generation sequencing should be carefully designed to maximize
      identification of a PKD1 pathogenic variant, which is complicated by several highly homologous
      pseudogenes
    explanation: GeneReviews explains a major assay-design limitation.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1246/pdf/Bookshelf_NBK1246.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1246/pdf/Bookshelf_NBK1246.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Specific analysis is required to detect exon or whole-gene deletions/duplications.
    explanation: Sequence-only testing does not capture every relevant variant class.
- name: MRI total kidney volume risk stratification
  description: >-
    Mayo Imaging Classification uses age and height-adjusted total kidney volume to predict
    progression in typical class-1 PKD1/PKD2 ADPKD. It does not establish the diagnosis and
    is not validated for atypical class-2 morphology or minor-gene forms. Prognosis incorporates
    eGFR trajectory and genotype where available.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:

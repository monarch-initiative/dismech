      ALG8,20 ALG9,21 DNAJB11,22 and GANAB,23 plus the ciliogenesis genes, IFT140 and NEK8.24,25
    explanation: This is introductory mechanistic synthesis, not a new functional experiment in the ALG8/ALG9 clinical cohort.
- name: Variant-dependent loss of ciliary polycystin-2 localization
  description: >-

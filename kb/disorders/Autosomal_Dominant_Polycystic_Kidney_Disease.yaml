    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Conservative treatment of flank pain includes nonopioid agents, tricyclic antidepressants,
      narcotic analgesics, and splanchnic nerve blockade.
    explanation: GeneReviews supplies management options; choice requires renal-function and adverse-effect assessment.
  target_phenotypes:

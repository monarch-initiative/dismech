- name: Somatic PKD1 or PKD2 inactivation in cyst epithelium
  description: >-
    Additional pathogenic somatic variants or loss of heterozygosity can further reduce polycystin
    dosage in focal cyst epithelium. Human evidence comes from end-stage nephrectomy cohorts
    and does not show that every cyst requires a detected second hit or establish its time of
    occurrence.

    term:
      id: HP:0030157
      label: Flank pain
- name: Treatment of kidney cyst infection
  description: >-
    Culture-guided antibiotics with adequate cyst penetration are required for suspected or
    confirmed kidney cyst infection, typically for 4–6 weeks under KDIGO guidance. This duration
    should not be transferred to uncomplicated lower urinary infection. Drug selection must
    consider susceptibility, renal function and adverse effects.
  treatment_term:
    preferred_term: Treatment of kidney cyst infection
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  evidence:
  - reference: url:https://kdigo.org/wp-content/uploads/2025/01/KDIGO-2025-ADPKD-Guideline_Executive-Summary.pdf
    reference_title: https://kdigo.org/wp-content/uploads/2025/01/KDIGO-2025-ADPKD-Guideline_Executive-Summary.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A lipid-soluble antibiotic (e.g., trimethoprim- sulfamethoxazole, ﬂuoroquinolone) may
      have better pene- tration into the cysts, and should be used if possible.
    explanation: >-
      KDIGO kidney-cyst infection guidance; adjacent full text specifies 4–6 weeks and cautions
      about fluoroquinolone adverse effects.

- name: Impaired polycystin maturation
  description: >-
    Disruption of endoplasmic-reticulum protein glycosylation or folding can reduce effective
    polycystin-1 maturation and trafficking. This is a shared mechanism for several minor-gene
    forms; individual proteins act at different maturation steps. ALG8 also belongs to this
    proteostasis group, although its clinical association is better established than the complete
    causal chain in patient kidneys.

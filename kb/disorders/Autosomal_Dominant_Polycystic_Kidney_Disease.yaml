name: Autosomal Dominant Polycystic Kidney Disease
creation_date: '2026-05-08T16:23:43Z'
category: Mendelian
description: >-
  Autosomal dominant polycystic kidney disease (ADPKD) is an inherited multisystem disorder,
  most often caused by PKD1 or PKD2 variants, with progressive renal epithelial cysts, frequent
  liver cysts and vascular complications. Reduced polycystin function permits cyst-promoting
  ciliary signaling; cAMP-dependent epithelial proliferation and fluid secretion contribute
  to expansion. The initiating ciliary signal and an obligatory flow-calcium sequence remain
  unresolved. Cyst burden and interstitial injury can lead to hypertension and kidney failure.
  Less common causal genes produce distinct patterns of kidney size, fibrosis, age at onset
  and liver involvement; typical PKD1/PKD2 prognostic models do not automatically apply to them.

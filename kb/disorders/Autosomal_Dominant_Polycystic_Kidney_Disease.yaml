- name: Renal parenchymal injury and fibrosis
  conforms_to: renal_cystogenesis#Nephron Loss and Progressive Kidney Failure
  description: >-
    Cyst-associated tissue remodeling, extracellular-matrix accumulation and fibrosis reduce
    functioning renal parenchyma. This tissue injury underlies declining filtration and eventual
    kidney failure in progressive disease.
  evidence:
  - reference: PMID:26877954
    reference_title: Cyst growth, polycystins, and primary cilia in autosomal dominant polycystic kidney disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      As the disease progresses, this leads to destruction of the normal renal parenchyma, massive
      renal enlargement, deterioration of renal function, and eventually renal failure in >50%
      of affected individuals by late adulthood
    explanation: This directly supports the renal-function decline node.
    quote_role: REVIEW_SYNTHESIS
  downstream:
  - target: Chronic kidney disease
    description: Loss of functional parenchyma manifests clinically as chronic kidney disease and declining eGFR.
    causal_link_type: DIRECT
  - target: Stage 5 chronic kidney disease
    description: Continued decline progresses to end-stage kidney disease in many affected individuals.
    causal_link_type: DIRECT

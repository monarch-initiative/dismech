    additional causes. This entry includes its renal spectrum; isolated liver disease also occurs.
treatments:
- name: Tolvaptan vasopressin V2 receptor antagonist therapy
  description: >-
    Tolvaptan slows kidney-volume growth and eGFR decline in selected adults with rapidly progressive
    ADPKD. KDIGO 2025 recommends initiation with eGFR at least 25 mL/min/1.73 m2 and documented
    rapid-progression risk; decisions above age 55 are individualized. Aquaresis requires reliable
    water access and interruption during volume depletion. Liver toxicity requires baseline
    and regular monitoring under local prescribing requirements. Trial eGFR benefits are not
    direct observations of a delay in dialysis.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tolvaptan
      term:
        id: CHEBI:32246
        label: tolvaptan
  target_phenotypes:
  - preferred_term: Renal cyst
    term:
      id: HP:0000107
      label: Renal cyst
  - preferred_term: Decreased glomerular filtration rate
    term:
      id: HP:0012213
      label: Decreased glomerular filtration rate
  target_mechanisms:
  - target: Increased renal epithelial cAMP signaling
    treatment_effect: INHIBITS
    description: Vasopressin V2 receptor antagonism lowers the cAMP drive that supports cyst epithelial proliferation and secretion.
    evidence:
    - reference: PMID:26877954
      reference_title: Cyst growth, polycystins, and primary cilia in autosomal dominant polycystic kidney disease.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Increased cAMP in cystic epithelium increases the activity of protein kinase A, which
        can result in increased cell proliferation and chloride-driven fluid secretion; features
        associated with cyst growth
      explanation: Mechanistic review supports the targeted cAMP pathway; randomized outcomes establish efficacy separately.
    - reference: PMID:23121377
      reference_title: Tolvaptan in patients with autosomal dominant polycystic kidney disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: >-
        Studies of animal models implicate the antidiuretic hormone arginine vasopressin and
        its second messenger adenosine-3′,5′-cyclic monophosphate (cAMP) as promoters of kidney-cyst
        cell proliferation and luminal fluid secretion.
      explanation: >-
        The TEMPO trial introduction summarizes the preclinical vasopressin-cAMP rationale;
        it is not a human mechanistic measurement.
  evidence:
  - reference: PMID:23121377
    reference_title: Tolvaptan in patients with autosomal dominant polycystic kidney disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tolvaptan, as compared with placebo, slowed the increase in total kidney volume and the
      decline in kidney function over a 3-year period in patients with ADPKD
    explanation: >-
      TEMPO 3:4 randomized 1445 adults aged 18–50 with total kidney volume at least 750 mL and
      preserved creatinine clearance. TKV increased 2.8% versus 5.5% yearly; discontinuation
      was 23% versus 14%. The full text reports aquaretic adverse effects and liver enzyme elevations.
  - reference: PMID:40126492
    reference_title: 'Autosomal Dominant Polycystic Kidney Disease: A Review.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The vasopressin type 2 receptor antagonist tolvaptan reduces the annual rate of eGFR decline
      by 0.98 to 1.27 mL/min/1.73 m2
    explanation: The 2025 review summarizes tolvaptan's effect on eGFR decline and its current indication.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:29105594
    reference_title: Tolvaptan in Later-Stage Autosomal Dominant Polycystic Kidney Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The change from baseline in the estimated GFR was -2.34 ml per minute per 1.73 m2 (95%
      confidence interval [CI], -2.81 to -1.87) in the tolvaptan group, as compared with -3.61
      ml per minute per 1.73 m2 (95% CI, -4.08 to -3.14) in the placebo group
    explanation: >-
      REPRISE primary endpoint over one year after a tolerability run-in; 1370 randomized, with
      1331 contributing to the primary analysis. The run-in selected patients able to tolerate
      treatment.
  - reference: url:https://kdigo.org/wp-content/uploads/2025/01/KDIGO-2025-ADPKD-Guideline_Executive-Summary.pdf
    reference_title: https://kdigo.org/wp-content/uploads/2025/01/KDIGO-2025-ADPKD-Guideline_Executive-Summary.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      We recommend initiating tolvaptan treatment in adults with ADPKD with an eGFR $25 ml/min/1.73
      m 2 who are at risk for rapidly progressive disease.
    explanation: >-
      KDIGO 2025 recommendation; the PDF text extraction encodes the at-least symbol as a dollar
      sign. The threshold is at least 25 mL/min/1.73 m2.
  - reference: url:https://kdigo.org/wp-content/uploads/2025/01/KDIGO-2025-ADPKD-Guideline_Executive-Summary.pdf
    reference_title: https://kdigo.org/wp-content/uploads/2025/01/KDIGO-2025-ADPKD-Guideline_Executive-Summary.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Frequent monitoring (monthly for the ﬁrst 18 months, and then every 3 months until drug
      discontinuation) of LFTs is mandatory in people treated with tolvaptan for ADPKD.
    explanation: KDIGO monitoring guidance; local regulatory schedules and product information govern prescribing.
  therapeutic_modality: SMALL_MOLECULE
- name: ACE inhibitor or angiotensin receptor blocker therapy
  description: >-
    Use an ACE inhibitor or an ARB as first-line blood-pressure therapy; avoid routine dual
    blockade. KDIGO targets differ by age, CKD stage and measurement method: in hypertensive
    adults aged 18–49 with G1–G2, home BP at or below 110/75 mm Hg if tolerated; at age 50 or
    above and/or G3–G5, standardized office systolic BP below 120 if tolerated. HALT-PKD reduced
    kidney-volume growth with intensive control but did not show an overall eGFR benefit.
  treatment_term:
    preferred_term: ACE inhibitor or angiotensin receptor blocker therapy
    term:
      id: NCIT:C172184
      label: Antihypertensive Therapy
    therapeutic_agent:
    - preferred_term: ACE Inhibitor

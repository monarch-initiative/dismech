    explanation: KDIGO recommends shared decisions about diagnosis in at-risk children, updating older categorical approaches.
- name: Individualized kidney pain management
  description: >-
    Investigate acute pain for hemorrhage, stones or infection. Persistent pain is managed stepwise
    with noninvasive measures and individualized analgesia; selected refractory cases require
    specialist cyst-directed procedures or nerve interventions. Long-term nephrotoxic analgesic
    exposure should be avoided.
  treatment_term:
    preferred_term: Individualized kidney pain management
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant transmission with age- and genotype-dependent expression. Each child
    of a heterozygous affected individual has a 50% chance of inheriting the familial variant.
    De novo disease and mosaicism can explain an absent family history; they do not establish
    incomplete penetrance. Hypomorphic PKD1 alleles and some minor-gene forms can have reduced
    penetrance.
  evidence:
  - reference: PMID:40126492
    reference_title: 'Autosomal Dominant Polycystic Kidney Disease: A Review.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Most persons with ADPKD have an affected parent, but de novo disease is suggested in 10% to 25% of families.
    explanation: This supports autosomal dominant familial transmission with occasional de novo disease.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:20301424
    reference_title: Polycystic Kidney Disease, Autosomal Dominant.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Each child of an individual who is heterozygous for an ADPKD-causing pathogenic variant
      has a 50% chance of inheriting the pathogenic variant.
    explanation: GeneReviews genetic counseling establishes transmission risk.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1246/pdf/Bookshelf_NBK1246.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1246/pdf/Bookshelf_NBK1246.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Family studies have identified nontruncating PKD1 variants that have reduced penetrance
      and are associated with much less severe disease
    explanation: GeneReviews distinguishes reduced penetrance of particular alleles from the dominant inheritance of the disorder.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_pkd1_pkd2_cilia_signaling_cystogenesis_model
  hypothesis_label: Canonical PKD1/PKD2 / Primary Cilium / Cystogenesis Model
  status: CANONICAL
  description: >-
    Reduced polycystin dosage and dysregulated ciliary signaling provide the central model of
    typical PKD1/PKD2 ADPKD. Somatic PKD1/PKD2 changes in human cysts support a cellular second-hit
    component, while dosage thresholds and timing modify expression. Conditional mouse epistasis
    shows that intact cilia can promote cyst growth after polycystin loss. cAMP drives cyst
    epithelial proliferation and secretion and is therapeutically targeted by V2-receptor antagonism.
    An obligatory fluid-flow-to-ciliary-calcium sequence is not established.
  notes: >-
    The genuine falcon hypothesis exploration is consumed with primary-source qualifications:
    Kif3a/Ift20 epistasis, not Ift88 in the cited experiment; 57/63 epithelial samples and 14/24
    whole cysts in distinct end-stage cohorts, not a universal second-hit frequency. Neither
    study phases every somatic hit or observes initiation directly. Calcium imaging challenges
    one proposed sensory mechanism, not the causal importance of PKD1/PKD2. Trial efficacy supports
    targeting the vasopressin-cAMP axis without proving the entire upstream model.
  evidence:
  - reference: PMID:30042192
    reference_title: Somatic Mutations in Renal Cyst Epithelium in Autosomal Dominant Polycystic Kidney Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Pathogenic somatic mutations in PKD1/2 genes were identified in all patients and in 90%
      of cysts (57 out of 63; Supplemental Table 2, Table 2).
    explanation: >-
      Nine nephrectomy patients with end-stage disease; 57/63 sequenced cyst epithelia, not
      57/63 patients or all cysts at initiation. Constitutional and somatic variants were not
      phased.
  - reference: PMID:39702469
    reference_title: Somatic mutation in autosomal dominant polycystic kidney disease revealed by deep sequencing human kidney cysts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      58% (14/24) of cysts had a detectable PKD1 somatic variant, with 5/6 participants having
      at least one cyst with a somatic variant.
    explanation: >-
      Six PKD1-positive patients with end-stage disease; smaller whole cysts, duplicate libraries
      and unique molecular identifiers. Sampling differs from epithelial enrichment. Structural
      variants, low-frequency loss of heterozygosity and variant phase were incompletely assessed.
  - reference: PMID:23892607
    reference_title: Loss of cilia suppresses cyst growth in genetic models of autosomal dominant polycystic kidney disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      In the current study, we combined inactivation of Pkd1 and Pkd2 with loss of Kif3a and
      Ift20 to show that structurally intact cilia are required to promote rapid cyst growth
      following loss of PC1 or PC2.
    explanation: >-
      Conditional mouse epistasis supports cyst-promoting signaling through retained cilia after
      polycystin loss. Effects depend on timing and model; Kif3a and Ift20 were the cilia genes
      tested.
  - reference: PMID:27007841
    reference_title: Primary cilia are not calcium-responsive mechanosensors.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Cilia-specific Ca(2+) influxes were not observed in physiological or even highly supraphysiological
      levels of fluid flow.
    explanation: >-
      Ratiometric imaging in mouse-derived tissues and cells challenges obligatory flow-induced
      ciliary calcium influx. It does not exclude non-calcium mechanosensation or every role
      of cellular calcium.

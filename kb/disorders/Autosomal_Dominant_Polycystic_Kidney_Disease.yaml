- name: Blood pressure surveillance
  description: >-
    Follow blood pressure throughout the disease course. KDIGO 2025 recommends annual standardized
    office assessment from age five in children and adolescents with or at risk for ADPKD, with
    ambulatory monitoring for selected higher-risk children. This updates the longer interval
    in the 2022 GeneReviews summary.
  diagnosis_term:

    reference_title: Polycystic Kidney Disease, Autosomal Dominant.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Treatment for hypertension may include ACE inhibitors or angiotensin II receptor blockers and diet modification.
    explanation: GeneReviews supports renin-angiotensin blockade.
  - reference: PMID:25399733
    reference_title: Blood pressure in early autosomal dominant polycystic kidney disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The annual percentage increase in total kidney volume was significantly lower in the low-blood-pressure
      group than in the standard-blood-pressure group (5.6% vs. 6.6%, P=0.006)
    explanation: >-
      HALT-PKD enrolled younger hypertensive participants with preserved eGFR; the volume endpoint
      does not establish an overall eGFR benefit or a benefit from dual blockade.
  - reference: url:https://kdigo.org/wp-content/uploads/2025/01/KDIGO-2025-ADPKD-Guideline_Executive-Summary.pdf
    reference_title: https://kdigo.org/wp-content/uploads/2025/01/KDIGO-2025-ADPKD-Guideline_Executive-Summary.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      For those aged $50 years and/or with CKD G3 –G5, we recommend a target mean systolic blood
      pressure of <120 mm Hg, if tolerated, assessed using standardized of ﬁce BP measurement.
    explanation: >-
      PDF extraction renders the at-least sign as a dollar sign; the clinical target refers
      to age 50 or above and/or CKD G3–G5, using standardized office measurement.
  - reference: PMID:25399733
    reference_title: Blood pressure in early autosomal dominant polycystic kidney disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A beneficial effect on cyst burden (rate of total kidney-volume growth) was not associated
      with an improvement in the slope of the estimated GFR.
    explanation: 'HALT-PKD full-text interpretation: TKV and eGFR outcomes must not be conflated.'
  - reference: url:https://kdigo.org/wp-content/uploads/2025/01/KDIGO-2025-ADPKD-Guideline_Executive-Summary.pdf
    reference_title: https://kdigo.org/wp-content/uploads/2025/01/KDIGO-2025-ADPKD-Guideline_Executive-Summary.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: We recommend avoiding any combination of ACEi, ARB, and direct renin- inhibitor therapy.

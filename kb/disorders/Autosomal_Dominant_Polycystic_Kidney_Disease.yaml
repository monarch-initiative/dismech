- name: Genetic counseling
  description: >-
    Counsel about variable expression, a 50% transmission risk for a heterozygous familial variant,
    cascade testing of adults, and prenatal or preimplantation testing when the familial variant
    is known. Childhood testing is a shared decision with the family and appropriate specialists;
    absence of symptoms does not establish absence of disease.
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301424
    reference_title: Polycystic Kidney Disease, Autosomal Dominant.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Once the ADPKD-causing pathogenic variant has been identified in an affected family member,
      prenatal and preimplantation genetic testing are possible.
    explanation: GeneReviews genetic counseling supports reproductive testing options.
  - reference: url:https://kdigo.org/wp-content/uploads/2025/01/KDIGO-2025-ADPKD-Guideline_Executive-Summary.pdf
    reference_title: https://kdigo.org/wp-content/uploads/2025/01/KDIGO-2025-ADPKD-Guideline_Executive-Summary.pdf

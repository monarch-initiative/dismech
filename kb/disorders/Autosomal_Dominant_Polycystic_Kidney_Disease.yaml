  - reference: url:https://kdigo.org/wp-content/uploads/2025/01/KDIGO-2025-ADPKD-Guideline_Executive-Summary.pdf
    reference_title: https://kdigo.org/wp-content/uploads/2025/01/KDIGO-2025-ADPKD-Guideline_Executive-Summary.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      We recommend screening for ICA in people with ADPKD and a personal history of SAH or a
      positive family history of ICA, SAH, or unexplained sudden death if the person will be
      eligible for treatment and has a reasonable life expectancy.
    explanation: >-
      Current guideline defines the high-risk screening population; other preferences and uncertain

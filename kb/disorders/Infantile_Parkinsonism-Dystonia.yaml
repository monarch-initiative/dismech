has_subtypes:
- name: Classic early-onset
  display_name: Classic early-onset DTDS
  description: >-
    Severe infantile-onset form (manifesting by age 6 months) associated with
    near-complete loss of DAT transport activity (0-5% residual activity).
    Affected infants present with irritability, feeding difficulties, axial
    hypotonia, and delayed motor development, followed by an early hyperkinetic
    movement disorder (chorea, ballismus, orolingual dyskinesia) that progresses
    to severe parkinsonism-dystonia, bulbar dysfunction, and recurrent status
    dystonicus.
  evidence:
  - reference: PMID:28749637
    reference_title: "SLC6A3-Related Dopamine Transporter Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Classic early-onset DTDS: Infants typically manifest nonspecific findings
      (irritability, feeding difficulties, axial hypotonia, and/or delayed motor
      development) followed by a hyperkinetic movement disorder (with features
      of chorea, dystonia, ballismus, orolingual dyskinesia). Over time,
      affected individuals develop parkinsonism-dystonia characterized by
      bradykinesia (progressing to akinesia), dystonic posturing, distal tremor,
      rigidity, and reduced facial expression.
    explanation: >-
      GeneReviews delineates classic early-onset DTDS as the infantile-onset end
      of the SLC6A3 phenotypic continuum.
  - reference: PMID:24613933
    reference_title: "Dopamine transporter deficiency syndrome: phenotypic spectrum from infancy to adulthood."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Impaired dopamine uptake was universally present, and more severely
      impacted in dopamine transporter mutants causing infantile-onset rather
      than juvenile-onset disease.
    explanation: >-
      Demonstrates that severe loss of residual DAT uptake underlies the
      classic infantile-onset subtype.
- name: Atypical later-onset
  display_name: Atypical later-onset DTDS
  description: >-
    Milder childhood-, adolescent-, or adult-onset form associated with higher
    residual DAT transport activity (approximately 8-10% of wild-type). Affected
    individuals have normal psychomotor development in infancy and early
    childhood, may manifest childhood attention-deficit/hyperactivity disorder
    (ADHD), and later develop progressive parkinsonism-dystonia with tremor,
    bradykinesia, variable tone, and dystonic posturing.
  evidence:
  - reference: PMID:28749637
    reference_title: "SLC6A3-Related Dopamine Transporter Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Atypical later-onset DTDS: Normal psychomotor development in infancy and
      early childhood. Attention-deficit/hyperactivity disorder (ADHD) is
      reported in childhood followed by later-onset manifestations of
      parkinsonism-dystonia with tremor, progressive bradykinesia, variable
      tone, and dystonic posturing.
    explanation: >-
      GeneReviews defines atypical later-onset DTDS with normal infantile
      development, childhood ADHD, and later-onset parkinsonism-dystonia.
  - reference: PMID:24613933
    reference_title: "Dopamine transporter deficiency syndrome: phenotypic spectrum from infancy to adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genotype-phenotype analysis in this cohort suggests that higher residual
      dopamine transporter activity is likely to contribute to postponing
      disease presentation in these later-onset adult cases.
    explanation: >-
      Links higher residual DAT transport function to delayed onset and slower
      progression in atypical juvenile and adult DTDS.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Almost all reported individuals inherit biallelic loss-of-function SLC6A3
    variants in an autosomal recessive manner; when both parents are
    heterozygous carriers, each sibling has at conception a 25% risk of being
    affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of
    being unaffected and non-carrier.
  evidence:
  - reference: PMID:28749637
    reference_title: "SLC6A3-Related Dopamine Transporter Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In most individuals reported to date, SLC6A3-related DTDS is caused by
      biallelic loss-of-function pathogenic variants and inherited in an
      autosomal recessive manner.
    explanation: >-
      GeneReviews establishes autosomal recessive inheritance as the predominant
      inheritance mode of SLC6A3-related DTDS.
  - reference: PMID:28749637
    reference_title: "SLC6A3-Related Dopamine Transporter Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If both parents are known to be heterozygous for an SLC6A3
      loss-of-function pathogenic variant, each sib of an affected individual
      has at conception a 25% chance of being affected, a 50% chance of being an
      asymptomatic carrier, and a 25% chance of being unaffected and not a
      carrier.
    explanation: >-
      Documents Mendelian sibling recurrence and carrier probabilities for
      autosomal recessive SLC6A3-related DTDS.
- name: Autosomal dominant (rare)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Rarely, autosomal dominant SLC6A3-related DTDS results from a heterozygous
    dominant-negative SLC6A3 pathogenic variant, conferring a 50% transmission
    risk to each offspring of an affected individual.
  evidence:
  - reference: PMID:28749637
    reference_title: "SLC6A3-Related Dopamine Transporter Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Autosomal dominant SLC6A3-related DTDS caused by a heterozygous
      dominant-negative SLC6A3 pathogenic variant has been reported in one
      individual to date.
    explanation: >-
      Documents rare autosomal dominant inheritance caused by a heterozygous
      dominant-negative SLC6A3 variant.
  - reference: PMID:28749637
    reference_title: "SLC6A3-Related Dopamine Transporter Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Each child of an individual with SLC6A3-related DTDS has a 50% chance of
      inheriting the dominant-negative SLC6A3 pathogenic variant.
    explanation: >-
      Documents the 50% offspring transmission risk for dominant-negative
      autosomal dominant DTDS.

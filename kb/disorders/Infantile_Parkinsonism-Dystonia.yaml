- name: Genetic Counseling
  description: >-
    Genetic counseling addresses autosomal recessive inheritance (25% sibling
    recurrence risk, 50% carrier probability when both parents are heterozygous)
    and rare dominant-negative autosomal dominant transmission (50% offspring
    risk); once familial SLC6A3 pathogenic variants are identified, carrier,
    prenatal, and preimplantation genetic testing are possible.

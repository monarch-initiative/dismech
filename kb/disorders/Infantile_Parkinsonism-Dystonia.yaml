discussions:
- discussion_id: dtds_human_neurodegeneration_unconfirmed
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does human SLC6A3-related dopamine transporter deficiency syndrome involve
    progressive apoptotic loss of midbrain dopaminergic neurons in vivo, as
    observed in patient iPSC-derived dopaminergic neurons and DAT knockout mice,
    or is human disease predominantly a functional nigrostriatal synaptopathy?
  attaches_to:
  - pathophysiology#Dopaminergic Neurodegeneration and Nigrostriatal Dysfunction
  rationale: >-
    The Dopaminergic Neurodegeneration and Nigrostriatal Dysfunction node rests
    on patient iPSC-derived midbrain dopaminergic neuron cultures (apoptotic
    neurodegeneration, TNF-alpha-mediated inflammation, and dopamine toxicity)
    and Slc6a3 knockout mice, whereas postmortem neuropathological studies of
    human DTDS brains have not been reported and conventional structural brain
    MRI in affected children and adults is typically normal. Clarifying whether
    structural nigrostriatal cell loss occurs in patients bears directly on the
    therapeutic window for late-stage gene replacement.
  evidence:
  - reference: PMID:34011628
    reference_title: "Gene therapy restores dopamine transporter expression and ameliorates pathology in iPSC and mouse models of infantile parkinsonism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using patient-derived induced pluripotent stem cells (iPSCs), we generated
      a midbrain dopaminergic (mDA) neuron model of DTDS that exhibited marked
      impairment of DAT activity, apoptotic neurodegeneration associated with
      TNFα-mediated inflammation, and dopamine toxicity.
    explanation: >-
      Establishes apoptotic dopaminergic neurodegeneration and TNF-alpha
      neuroinflammation in the human iPSC-derived cellular model.
  - reference: PMID:24613933
    reference_title: "Dopamine transporter deficiency syndrome: phenotypic spectrum from infancy to adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MRI brain imaging was normal in all those who had imaging for Cases 4–8
      and included standard axial and coronal T1, T2 sequences with FLAIR and
      diffusion-weighted imaging.
    explanation: >-
      Documents normal conventional brain MRI in human DTDS cohorts without
      direct histological confirmation of neuronal cell loss in patients.

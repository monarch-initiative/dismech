biochemical:
- name: Raised CSF HVA:5-HIAA Ratio
  presence: Positive
  notes: >-
    A characteristic diagnostic biochemical signature is raised cerebrospinal fluid
    homovanillic acid (HVA, a dopamine metabolite) with normal 5-hydroxyindoleacetic
    acid (5-HIAA), producing an elevated HVA:5-HIAA ratio (>4.0) that reflects
    increased dopamine turnover from impaired reuptake.
  evidence:
  - reference: PMID:24613933
    reference_title: "Dopamine transporter deficiency syndrome: phenotypic spectrum from infancy to adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cases 4 and 6–8 underwent neurotransmitter analysis and all found to have
      raised CSF HVA: HIAA ratio in keeping with DTDS (median ratio 7.2, range
      6.8–31.9, and normal ratio range 1.0–4.0, Table 2).
    explanation: >-
      Quantifies the characteristic elevated cerebrospinal fluid HVA:5-HIAA
      ratio in patients with classical DTDS.
  - reference: PMID:34011628
    reference_title: "Gene therapy restores dopamine transporter expression and ameliorates pathology in iPSC and mouse models of infantile parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Patients present with early infantile hyperkinesia, severe progressive childhood
      parkinsonism, and raised cerebrospinal fluid dopamine metabolites.
    explanation: >-
      Documents raised CSF dopamine metabolites, the basis for the elevated HVA:5-HIAA
      ratio used diagnostically.
diagnosis:
- name: Cerebrospinal Fluid Neurotransmitter Analysis via Lumbar Puncture
  description: >-
    Lumbar puncture measurement of cerebrospinal fluid monoamine metabolites
    demonstrates markedly elevated homovanillic acid (HVA) with normal
    5-hydroxyindoleacetic acid (5-HIAA), yielding a characteristic HVA:5-HIAA
    ratio above 4.0.
  diagnosis_term:

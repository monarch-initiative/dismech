    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Episodic status dystonicus, exacerbations of dystonia, and secondary orthopedic,
      gastrointestinal, and respiratory complications are common.
    explanation: >-
      GeneReviews documents dystonia and recurrent dystonic exacerbations as
      common features.
- name: Status Dystonicus
  description: >-
    Episodic status dystonicus (paroxysmal dystonic storm) is a common,
    life-threatening emergency manifestation of generalized dystonia in DTDS
    requiring acute intervention with benzodiazepines or chloral hydrate.

- name: SLC6A3 Molecular Genetic Testing
  description: >-
    Definitive diagnosis is established by molecular genetic sequencing
    identifying biallelic loss-of-function (or rarely heterozygous
    dominant-negative) pathogenic variants in SLC6A3.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:28749637
    reference_title: "SLC6A3-Related Dopamine Transporter Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of SLC6A3-related DTDS is established in a proband with
      characteristic clinical, laboratory, and imaging findings and either
      biallelic loss-of-function pathogenic variants in SLC6A3 or, rarely, a
      heterozygous dominant-negative pathogenic variant in SLC6A3 identified by
      molecular genetic testing.
    explanation: >-
      GeneReviews establishes SLC6A3 molecular genetic testing as the definitive
      diagnostic confirmation for DTDS.
- name: Dopamine Transporter SPECT Imaging
  description: >-
    Presynaptic dopamine transporter single-photon emission computed tomography
    (DAT SPECT) imaging is abnormal in DTDS and supports diagnostic evaluation,
    including differentiation of atypical juvenile- or adult-onset DTDS from
    other parkinsonian disorders, whereas conventional structural brain MRI is
    typically normal.
  diagnosis_term:
    preferred_term: Single Photon Emission Computed Tomography
    term:
      id: NCIT:C17203
      label: Single Photon Emission Computed Tomography
  evidence:
  - reference: PMID:24613933
    reference_title: "Dopamine transporter deficiency syndrome: phenotypic spectrum from infancy to adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      We advocate that in adolescents or adults with a clinical picture of
      juvenile parkinsonism (onset <20 years) investigations for DTDS should be
      considered, including: (i) CSF neurotransmitter studies; (ii) DAT SPECT
      scan (abnormal in DTDS) ( Kurian et al., 2011a ); and (iii) SLC6A3
      sequencing.
    explanation: >-
      Recommends DAT SPECT imaging alongside CSF neurotransmitter analysis and
      SLC6A3 sequencing in the diagnostic workup of DTDS.
  - reference: PMID:24613933
    reference_title: "Dopamine transporter deficiency syndrome: phenotypic spectrum from infancy to adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Our finding of this phenotypic spectrum and later disease onset is further
      corroborated by an abstract documenting a 40-years-old patient with
      early-onset Parkinson’s disease presenting with unilateral hand tremor at
      28 years, associated with abnormal DAT scan imaging.
    explanation: >-
      Documents abnormal DAT scan imaging in adult-onset compound-heterozygous
      SLC6A3-related DTDS.

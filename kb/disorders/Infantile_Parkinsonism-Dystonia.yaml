    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If both parents are known to be heterozygous for an SLC6A3
      loss-of-function pathogenic variant, each sib of an affected individual
      has at conception a 25% chance of being affected, a 50% chance of being an

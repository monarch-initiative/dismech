    attack` returned 0 terms, whereas the positive-control query `l~dystonia` on
    the same adapter returned 18 terms (including HP:0001332 Dystonia and
    HP:0002268 Paroxysmal dystonia). HP:0001332 Dystonia is already bound on its
    own phenotype row and would omit the acute life-threatening emergency state.

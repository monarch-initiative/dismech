  downstream:
  - target: Lactic Acidosis and Metabolic Decompensation
    causal_link_type: DIRECT
    description: >-
      Impaired oxidative phosphorylation forces reliance on anaerobic
      glycolysis, elevating systemic and cerebrospinal fluid lactate and

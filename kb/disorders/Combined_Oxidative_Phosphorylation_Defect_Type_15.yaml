genetic:
- name: MTFMT
  notes: >-
    MTFMT (15q22.31) encodes the mitochondrial methionyl-tRNA
    formyltransferase that generates fMet-tRNA(Met) for translation
    initiation. The recurrent c.626C>T allele is hypomorphic — it alters
    splicing but permits residual full-length protein — which is the accepted
    explanation for the comparatively mild course of MTFMT-related Leigh
    syndrome.
  gene_term:
    preferred_term: MTFMT
    term:
      id: hgnc:29666
      label: MTFMT
  relationship_type: CAUSATIVE
  variants:
  - name: MTFMT c.626C>T
    description: >-
      The recurrent founder allele, present in 11 of 13 index cases in the
      2014 cohort and among the most frequent disease alleles across OXPHOS
      disorders as a class.
    type: splice-affecting substitution
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:24461907
      reference_title: "Phenotypic spectrum of eleven patients and five novel MTFMT mutations identified by exome sequencing and candidate gene screening."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Being present in 11 out of 13 index cases the c.626C>T mutation is one of the most frequent disease alleles underlying OXPHOS disorders."
      explanation: The allele's dominance of the reported mutational spectrum.
    - reference: PMID:30911575
      reference_title: "Leigh syndrome caused by mutations in MTFMT is associated with a better prognosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sixteen pathogenic variants were identified, of which c.626C>T was the most common."
      explanation: Confirmed as the most common allele in the full 38-patient cohort.
  evidence:
  - reference: PMID:21907147
    reference_title: "Mutations in MTFMT underlie a human disorder of formylation causing impaired mitochondrial translation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using targeted sequencing of the mtDNA and nuclear exons encoding the mitochondrial proteome (MitoExome), we identified compound heterozygous mutations in MTFMT in two unrelated children presenting with Leigh syndrome and combined OXPHOS deficiency."
    explanation: The gene-discovery study establishing MTFMT as the cause of COXPD15.
pathophysiology:
- name: Loss of Mitochondrial Methionyl-tRNA Formyltransferase Activity
  biological_scale: MOLECULAR
  description: >-
    MTFMT formylates a portion of the mitochondrial Met-tRNA(Met) pool to
    produce fMet-tRNA(Met), the initiator species recognised by the
    mitochondrial translation initiation factor. In patient cells the
    fMet-tRNA(Met) pool collapses and the formylation profile of
    mitochondrially translated COX1 is abnormal — direct biochemical proof
    that the formylation step is lost.
  role: trigger
  genes:
  - preferred_term: MTFMT
    term:
      id: hgnc:29666
      label: MTFMT
  molecular_functions:
  - preferred_term: methionyl-tRNA formyltransferase activity
    term:
      id: GO:0004479
      label: methionyl-tRNA formyltransferase activity
    modifier: DECREASED
  downstream:
  - target: Impaired Mitochondrial Translation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21907147
      reference_title: "Mutations in MTFMT underlie a human disorder of formylation causing impaired mitochondrial translation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Patient fibroblasts exhibit severe defects in mitochondrial translation that can be rescued by exogenous expression of MTFMT."
      explanation: >-
        Rescue by re-expression proves the translation defect is caused by the
        loss of MTFMT rather than a parallel lesion.
  evidence:
  - reference: PMID:21907147
    reference_title: "Mutations in MTFMT underlie a human disorder of formylation causing impaired mitochondrial translation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "patient fibroblasts have dramatically reduced fMet-tRNA(Met) levels and an abnormal formylation profile of mitochondrially translated COX1"
    explanation: The biochemical demonstration that formylation is lost in patient cells.
- name: Impaired Mitochondrial Translation
  biological_scale: CELLULAR
  description: >-
    Without fMet-tRNA(Met), initiation on the mitochondrial ribosome is
    inefficient and synthesis of the thirteen mtDNA-encoded OXPHOS subunits
    falls. The index study settled a standing debate by showing that
    formylation is required for efficient translation in human mitochondria,
    despite yeast tolerating its loss.
  biological_processes:
  - preferred_term: mitochondrial translation initiation
    term:
      id: GO:0070124
      label: mitochondrial translational initiation
    modifier: DECREASED
  - preferred_term: mitochondrial translation
    term:
      id: GO:0032543
      label: mitochondrial translation
    modifier: DECREASED
  downstream:
  - target: Combined Respiratory Chain Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24461907
      reference_title: "Phenotypic spectrum of eleven patients and five novel MTFMT mutations identified by exome sequencing and candidate gene screening."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "All novel mutations predict a loss-of-function or result in a severe decrease in MTFMT protein in patients' fibroblasts accompanied by reduced steady-state levels of complex I and IV subunits."
      explanation: >-
        Loss of MTFMT protein tracks with reduced complex I and IV subunit
        levels, the step from failed translation to enzyme deficiency.
  evidence:
  - reference: PMID:21907147
    reference_title: "Mutations in MTFMT underlie a human disorder of formylation causing impaired mitochondrial translation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings demonstrate that MTFMT is critical for efficient human mitochondrial translation and reveal a human disorder of Met-tRNA(Met) formylation."
    explanation: The study's core mechanistic conclusion.
- name: Combined Respiratory Chain Deficiency
  biological_scale: CELLULAR
  description: >-
    The translation defect depresses all mtDNA-dependent complexes, measured
    clinically as combined respiratory-chain deficiency in a majority of
    patients and isolated complex I deficiency in a substantial minority —
    complex I and IV subunits are the consistently reduced species in
    fibroblasts.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  downstream:
  - target: Leigh Syndrome Spectrum Encephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Energy failure in the developing brain produces the symmetrical deep
      grey and white matter lesions of Leigh syndrome; the residual function
      of the common hypomorphic allele is the proposed reason the course is
      milder than in other nuclear Leigh genes.
  evidence:
  - reference: PMID:30911575
    reference_title: "Leigh syndrome caused by mutations in MTFMT is associated with a better prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Isolated complex I and combined respiratory chain deficiencies were identified in 31% and 59% of the cases, respectively."
    explanation: The biochemical distribution across the 38-patient cohort.
  - reference: PMID:30911575
    reference_title: "Leigh syndrome caused by mutations in MTFMT is associated with a better prognosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Reduction of the mitochondrial complex I and complex IV subunits was identified in the fibroblasts (13/13)."
    explanation: The consistent fibroblast biochemistry across every tested patient.

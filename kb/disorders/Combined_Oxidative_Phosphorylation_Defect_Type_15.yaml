- MTFMT deficiency
- MTFMT-related Leigh syndrome
- mitochondrial methionyl-tRNA formyltransferase deficiency
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A Mendelian defect of mitochondrial gene expression, diagnosed and
      managed as an inherited disorder rather than within one organ-system
      Part.
  - classification_value: NEUROLOGIC
    notes: >-
      The phenotype is a Leigh syndrome spectrum encephalopathy — basal
      ganglia, white matter and brainstem lesions with developmental delay,
      ataxia and hypotonia.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      An inborn error of mitochondrial energy metabolism with combined
      respiratory-chain deficiency.
  mechanistic_category:
  - classification_value: mitochondrial disease
  icimd_category:
  - classification_value: mtdna_transcript_processing_and_modification
    notes: >-
      MTFMT post-transcriptionally modifies the mitochondrial initiator
      Met-tRNA(Met) (N-formylation), placing the disorder among defects of
      mitochondrial gene expression, as for the tRNA-modification enzyme MTO1.

name: Combined Oxidative Phosphorylation Defect Type 15
creation_date: "2026-09-16T02:30:00Z"
category: Mendelian
disease_term:
  preferred_term: Combined oxidative phosphorylation defect type 15
  term:
    id: MONDO:0013987
    label: combined oxidative phosphorylation defect type 15
description: >-
  Combined oxidative phosphorylation defect type 15 (COXPD15) is caused by
  biallelic variants in MTFMT, the mitochondrial methionyl-tRNA
  formyltransferase. Metazoan mitochondria use a single tRNA(Met) for both
  translation initiation and elongation; MTFMT formylates a portion of the
  Met-tRNA(Met) pool to generate the fMet-tRNA(Met) that the mitochondrial
  initiation factor requires. Loss of MTFMT therefore cripples mitochondrial
  translation initiation, reducing synthesis of the thirteen mtDNA-encoded
  OXPHOS subunits and producing a combined respiratory-chain deficiency most
  visible in complexes I and IV.

  MTFMT was identified in 2011 by MitoExome sequencing of two children with
  Leigh syndrome and combined OXPHOS deficiency — simultaneously settling a
  debate about whether formylated initiator tRNA is required in human
  mitochondria. The clinical picture across the subsequently assembled cohorts
  is a Leigh syndrome spectrum disorder: developmental delay and motor
  symptoms presenting at a median of 14 months, symmetrical basal ganglia
  lesions, periventricular and subcortical white matter abnormalities, and
  brainstem lesions on MRI, with microcephaly, ataxia and muscular hypotonia
  recurring across families. The hypomorphic founder splice allele c.626C>T,
  present in most index cases, is one of the most frequent disease alleles in
  OXPHOS disorders generally, and its residual function is the accepted reason
  MTFMT-related Leigh syndrome runs a milder course than other nuclear Leigh
  genes: in the 38-patient natural-history cohort nearly three quarters of
  patients were alive at last review and 29% survived into adulthood.
parents:
- Combined Oxidative Phosphorylation Defect
- Mitochondrial Disease
- Leigh Syndrome Spectrum
synonyms:

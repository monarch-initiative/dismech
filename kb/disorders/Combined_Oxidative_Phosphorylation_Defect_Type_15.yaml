notes: >-
  Entry created as part of the mitochondrial tranche surfaced by the human
  genetic-interaction BPM pilot (experiments/human_gi_bpm/): MTFMT appears in
  the coherent mitochondrial translation/CoQ module of the Billmann 2026 HAP1
  map. The GeneReviews Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview
  (PMID:26425749) covers MTFMT among the nuclear Leigh genes and is tagged as
  the GeneReviews baseline; its abstract carries no quotable per-gene clinical
  detail, so phenotype evidence quotes the primary cohort papers instead.

  Deep-research provenance: the falcon report for this disease
  (research/Combined_Oxidative_Phosphorylation_Defect_Type_15-deep-research-falcon.md)
  is wholly about the wrong gene — every section names TACO1 (63 mentions,
  0 MTFMT), seeded by noisy OpenTargets association rows — and is unusable in
  full, not merely in its executive summary; it is retained only as a record of
  the provider error. The usable MTFMT deep-research artifact for this entry is
  the claude_code re-run
  (research/Combined_Oxidative_Phosphorylation_Defect_Type_15-deep-research-claude_code.md,
  75 MTFMT mentions, 0 TACO1). The correct MTFMT attribution was independently
  verified against MONDO:0013987 -> OMIM:614947 and the founding literature
  (PMID:21907147, PMID:24461907, PMID:30911575); no content from the TACO1
  report was used in this entry.

  description: >-
    Definitive diagnosis rests on identifying biallelic pathogenic MTFMT
    variants by exome sequencing, mitochondrial gene panel (MitoExome), or
    targeted sequencing; full exon 1 coverage and Sanger follow-up are needed
    when exome capture detects only a single heterozygous variant.

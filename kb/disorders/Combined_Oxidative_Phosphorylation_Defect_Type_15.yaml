progression:
- phase: Long-term outcome
  notes: >-
    MTFMT-related Leigh syndrome runs a milder course than most nuclear-gene
    Leigh syndromes: in the 38-patient cohort synthesis, 74% of patients were
    alive at last clinical review and 29% survived into adulthood — the basis
    for the "better prognosis" designation, attributed to the residual
    function of the common hypomorphic c.626C>T allele.
  evidence:
  - reference: PMID:30911575
    reference_title: "Leigh syndrome caused by mutations in MTFMT is associated with a better prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seventy-four percent of the patients were alive at their last clinical review (median 6.8 years, range: 14 months to 31 years, IQR 14.5 years)."
    explanation: Survival at last review in the cohort synthesis.
  - reference: PMID:30911575
    reference_title: "Leigh syndrome caused by mutations in MTFMT is associated with a better prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-nine percent of the patients survived into adulthood."
    explanation: Adult survival, unusual for a nuclear Leigh-syndrome gene.
treatments:
- name: Supportive Care
  description: >-
    There is no disease-modifying therapy; management follows general
    mitochondrial-disease supportive care — developmental support, management
    of dystonia and feeding, and surveillance for the complications of Leigh
    syndrome spectrum disease.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
notes: >-
  Entry created as part of the mitochondrial tranche surfaced by the human
  genetic-interaction BPM pilot (experiments/human_gi_bpm/): MTFMT appears in
  the coherent mitochondrial translation/CoQ module of the Billmann 2026 HAP1
  map. The GeneReviews Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview
  (PMID:26425749) covers MTFMT among the nuclear Leigh genes and is tagged as
  the GeneReviews baseline; its abstract carries no quotable per-gene clinical
  detail, so phenotype evidence quotes the primary cohort papers instead.

name: Combined Oxidative Phosphorylation Defect Type 15
creation_date: "2026-09-16T02:30:00Z"
category: Mendelian
disease_term:
  preferred_term: Combined oxidative phosphorylation defect type 15
  term:
    id: MONDO:0013987
    label: combined oxidative phosphorylation defect type 15
description: >-
  Combined oxidative phosphorylation defect type 15 (COXPD15) is caused by
  biallelic variants in MTFMT, the mitochondrial methionyl-tRNA
  formyltransferase. Metazoan mitochondria use a single tRNA(Met) for both
  translation initiation and elongation; MTFMT formylates a portion of the
  Met-tRNA(Met) pool to generate the fMet-tRNA(Met) that the mitochondrial
  initiation factor requires. Loss of MTFMT therefore cripples mitochondrial
  translation initiation, reducing synthesis of the thirteen mtDNA-encoded
  OXPHOS subunits and producing a combined respiratory-chain deficiency most
  visible in complexes I and IV.

  MTFMT was identified in 2011 by MitoExome sequencing of two children with
  Leigh syndrome and combined OXPHOS deficiency — simultaneously settling a
  debate about whether formylated initiator tRNA is required in human
  mitochondria. The clinical picture across the subsequently assembled cohorts
  is a Leigh syndrome spectrum disorder: developmental delay and motor
  symptoms presenting at a median of 14 months, symmetrical basal ganglia
  lesions, periventricular and subcortical white matter abnormalities, and
  brainstem lesions on MRI, with microcephaly, ataxia and muscular hypotonia
  recurring across families. The hypomorphic founder splice allele c.626C>T,
  present in most index cases, is one of the most frequent disease alleles in
  OXPHOS disorders generally, and its residual function is the accepted reason
  MTFMT-related Leigh syndrome runs a milder course than other nuclear Leigh
  genes: in the 38-patient natural-history cohort nearly three quarters of
  patients were alive at last review and 29% survived into adulthood.
parents:
- Combined Oxidative Phosphorylation Defect
- Mitochondrial Disease
- Leigh Syndrome Spectrum
synonyms:
- COXPD15
- combined oxidative phosphorylation deficiency 15
- combined oxidative phosphorylation deficiency type 15
- MTFMT deficiency
- MTFMT-related Leigh syndrome
- mitochondrial methionyl-tRNA formyltransferase deficiency
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A Mendelian defect of mitochondrial gene expression, diagnosed and
      managed as an inherited disorder rather than within one organ-system
      Part.
    evidence:
    - reference: PMID:21907147
      reference_title: "Mutations in MTFMT underlie a human disorder of formylation causing impaired mitochondrial translation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Using targeted sequencing of the mtDNA and nuclear exons encoding the mitochondrial proteome (MitoExome), we identified compound heterozygous mutations in MTFMT in two unrelated children presenting with Leigh syndrome and combined OXPHOS deficiency."
      explanation: Establishes biallelic MTFMT mutations as an autosomal recessive defect of mitochondrial gene expression.
  - classification_value: NEUROLOGIC
    notes: >-
      The phenotype is a Leigh syndrome spectrum encephalopathy — basal
      ganglia, white matter and brainstem lesions with developmental delay,
      ataxia and hypotonia.
    evidence:
    - reference: PMID:30911575
      reference_title: "Leigh syndrome caused by mutations in MTFMT is associated with a better prognosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MRI headings in MTFMT pathogenic variants included symmetrical basal ganglia changes (62%), periventricular and subcortical white matter abnormalities (55%), and brainstem lesions (48%)."
      explanation: Demonstrates central nervous system involvement across the 38-patient Leigh syndrome spectrum cohort.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      An inborn error of mitochondrial energy metabolism with combined
      respiratory-chain deficiency.
    evidence:
    - reference: PMID:30911575
      reference_title: "Leigh syndrome caused by mutations in MTFMT is associated with a better prognosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Isolated complex I and combined respiratory chain deficiencies were identified in 31% and 59% of the cases, respectively."
      explanation: Confirms inborn oxidative phosphorylation enzyme deficiency across patient samples.
  mechanistic_category:
  - classification_value: mitochondrial disease
    evidence:
    - reference: PMID:21907147
      reference_title: "Mutations in MTFMT underlie a human disorder of formylation causing impaired mitochondrial translation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our findings demonstrate that MTFMT is critical for efficient human mitochondrial translation and reveal a human disorder of Met-tRNA(Met) formylation."
      explanation: Establishes impaired mitochondrial protein synthesis as the primary disease mechanism.
  icimd_category:
  - classification_value: mtdna_transcript_processing_and_modification
    notes: >-
      MTFMT post-transcriptionally modifies the mitochondrial initiator
      Met-tRNA(Met) (N-formylation), placing the disorder among defects of
      mitochondrial gene expression, as for the tRNA-modification enzyme MTO1.
    evidence:
    - reference: PMID:21907147
      reference_title: "Mutations in MTFMT underlie a human disorder of formylation causing impaired mitochondrial translation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "patient fibroblasts have dramatically reduced fMet-tRNA(Met) levels and an abnormal formylation profile of mitochondrially translated COX1"
      explanation: Directly demonstrates defective N-formylation of mitochondrial Met-tRNA(Met).

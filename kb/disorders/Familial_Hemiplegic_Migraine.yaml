    significant excess of missense variants in CACNA1H relative to gnomAD
    controls, replicated in an independent Dutch cohort. The authors' reading -
    which this entry follows - is that hemiplegic migraine without a single
    causal mutation behaves as a complex trait, not that a fourth
    high-penetrance gene is waiting to be found. No pathophysiology node is
    curated for it.

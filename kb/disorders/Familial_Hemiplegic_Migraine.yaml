- name: Reduced Cortical Spreading Depression Threshold
  biological_scale: TISSUE
  description: >-
    The unifying node of the entry. Cortical spreading depression (CSD) is a
    slowly propagating wave of neuronal and glial depolarization that is the
    neurophysiological correlate of migraine aura. FHM1 and FHM2 knock-in mice
    both show a reduced CSD induction threshold and an increased propagation
    velocity in vivo, and NaV1.1 gain of function ignites CSD directly - so all
    three classical subtypes converge on a cortex that enters and propagates CSD
    too readily.

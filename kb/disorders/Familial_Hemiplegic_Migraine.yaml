- name: Atp1a2 W887R knock-in mouse (FHM2)
  species: Mouse
  genotype: Atp1a2 W887R knock-in, heterozygous (homozygotes die after birth)
  genes:
  - preferred_term: ATP1A2
    term:
      id: hgnc:800
      label: ATP1A2
  publication: PMID:21731499
  description: >-
    The first FHM2 model. It is the source of two separate claims in this entry: that the FHM2 variant
    acts by loss of the alpha2 pump through ER retention and proteasomal degradation, and that the
    resulting cortex has a lowered CSD threshold - the finding that lets FHM1 and FHM2 be drawn as
    converging on one node. It is also the entry's clearest negative result: heterozygous mutants
    have the cortical phenotype without any apparent clinical phenotype. The heterozygous FHM2 mouse
    - the genotype that matches the human heterozygous patient - shows no apparent clinical phenotype
    despite carrying the cortical CSD phenotype. The model reproduces the mechanism and not the disease.
    This is the negative result behind the entry's HUMAN_MODEL_MISMATCH discussion, and it is a substantive
    one: it means the step from a lowered CSD threshold to an episodic hemiparetic attack is not
    demonstrated in the one model where both could have been observed together. Mouse hemiparesis
    is also harder to ascertain than human hemiparesis, so absence of an apparent phenotype is weaker
    than a demonstration of absence - but it is what the cited work reports.

    FHM1 and FHM2 patients and controls, enrollment 20, completed 2006. Like the
    GTN study it is a mechanistic provocation paradigm, and it is the more
    directly relevant of the two here because it tests the CGRP pathway that
    underlies the modern migraine-specific drug classes in patients whose
    causal ion-transport lesion is known.

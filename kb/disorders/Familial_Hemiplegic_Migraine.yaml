    reference_title: Familial Hemiplegic Migraine.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Agents/circumstances to avoid: Vasoconstricting agents because of the risk
      of stroke; cerebral angiography as it may precipitate a severe attack.
    explanation: >-
      The GeneReviews Agents/Circumstances to Avoid section, recorded verbatim
      because it is a safety constraint.
  - reference: PMID:41552155
    reference_title: "Hemiplegic Migraine: An Imitator of Cerebrovascular Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Triptans and ergot derivatives are contraindicated because of their
      vasoconstrictive effects and potential risk of inducing ischemia.
    explanation: >-
      Names the specific drug classes that "vasoconstricting agents" refers to
      in the GeneReviews wording above, and states the reason.
- name: Genetic Counseling
  description: >-
    Autosomal dominant inheritance with a 50% recurrence risk per child. Once
    the family variant is known, prenatal and preimplantation genetic testing
    are possible.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301562
    reference_title: Familial Hemiplegic Migraine.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Each child of an individual with FHM has a 50% chance of inheriting the
      pathogenic variant. Once an FHM-causing pathogenic variant has been
      identified in an affected family member, prenatal testing for a pregnancy
      at increased risk and preimplantation genetic testing are possible.
    explanation: GeneReviews genetic counseling guidance.
- name: Neurologic Surveillance

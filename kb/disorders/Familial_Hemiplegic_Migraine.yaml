      preferred_term: ATP1A2
      term:
        id: hgnc:800
        label: ATP1A2
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous ATP1A2 variants acting through haploinsufficiency of the
      astrocytic alpha2 Na+/K+ pump.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:12539047
    reference_title: >-
      Haploinsufficiency of ATP1A2 encoding the Na+/K+ pump alpha2 subunit associated with familial
      hemiplegic migraine type 2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional data indicate that the putative pathogenetic mechanism is
      triggered by a loss of function of a single allele of ATP1A2.
    explanation: >-
      Establishes haploinsufficiency, not gain of function, as the FHM2
      molecular mechanism.
  - reference: PMID:21731499
    reference_title: >-
      Increased susceptibility to cortical spreading depression in the mouse model of familial hemiplegic
      migraine type 2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      mutations of the α2-subunit of the Na,K-ATPase, an isoform almost
      exclusively expressed in astrocytes in the adult brain
    explanation: >-
      Localizes the affected pump to astrocytes, which is what makes the FHM2
      mechanism a glial clearance defect rather than a neuronal channel defect.
  - reference: PMID:21731499
    reference_title: >-
      Increased susceptibility to cortical spreading depression in the mouse model of familial hemiplegic
      migraine type 2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The mutant α2 Na,K-ATPase protein was barely detectable in the brain of
      homozygous mutants and strongly reduced in the brain of heterozygous
      mutants, likely as a consequence of endoplasmic reticulum retention and
      subsequent proteasomal degradation
    explanation: >-
      Identifies the cell-biological route from variant to reduced pump
      function in the knock-in model.

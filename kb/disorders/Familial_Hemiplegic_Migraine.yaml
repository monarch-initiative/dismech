name: Familial Hemiplegic Migraine
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Familial hemiplegic migraine (FHM) is a rare autosomal dominant subtype of migraine with aura in
  which the aura obligatorily includes fully reversible motor weakness (hemiparesis) alongside visual,
  sensory, or language symptoms, in a proband with at least one affected first- or second-degree
  relative. Three genes encoding ion-transport proteins define the classical molecular subtypes -
  CACNA1A (Cav2.1, FHM1), ATP1A2 (astrocytic Na+/K+-ATPase alpha2, FHM2) and SCN1A (Nav1.1, FHM3)
  - and PRRT2 is now recognized as a fourth hemiplegic-migraine gene. Experimental models of the
  three classical ion-transport subtypes show facilitated cortical spreading depolarization, the
  leading physiological explanation for aura. The intervening route from PRRT2 loss to FHM attacks
  remains less resolved. FHM has served as a Mendelian model for migraine aura biology more generally.
synonyms:
- FHM
- hereditary hemiplegic migraine
disease_term:
  preferred_term: familial hemiplegic migraine
  term:
    id: MONDO:0000700
    label: familial hemiplegic migraine
parents:
- Migraine with aura
- Channelopathy
notes: >-
  Scope and boundaries with adjacent entries. This entry is the disease-centred view of hemiplegic
  migraine across all four genes; the gene-centred view of CACNA1A (which also spans episodic ataxia
  type 2, SCA6 and DEE42) lives in CACNA1A-Related Disorder, which already carries "Familial Hemiplegic
  Migraine Type 1" as a molecular subtype. Migraine with aura carries the general (non-hemiplegic)
  aura biology and explicitly excludes hemiplegic migraine from its scope; FHM-associated aura components,
  headache and additional manifestations are curated here with their clinical and molecular scope.
  Alternating Hemiplegia of Childhood is an ATP1A3 disorder that overlaps FHM through episodic hemiplegia
  and the Na+/K+-ATPase family but is a separate entity, curated as a differential diagnosis in both
  directions.

  Sporadic hemiplegic migraine (SHM) shares the ICHD phenotype and the same genes but by definition
  lacks an affected first- or second-degree relative; it is not curated here as a subtype because
  the family-history criterion, not the mechanism, is what separates it. It is roughly as common
  as FHM in population-based case-finding.

  PRRT2 is deliberately NOT curated as a numbered subtype, and specifically not as "FHM4". The FHM4
  designation does exist - OMIM %607516, mirrored by MONDO:0800335 "migraine, familial hemiplegic,
  4" - but it is a gene-less concept: MedGen's record for it (UID 334830, the concept MONDO:0800335
  mirrors) lists no associated gene, and MONDO gives it no definition, no OMIM gene cross-reference
  and no causal-gene relationship. PRRT2 is therefore not FHM4 under another name, and numbering
  it as a fourth subtype here would assert an equivalence the source ontologies do not make. Two
  further reasons keep PRRT2 in the genetic section: its mechanism (synaptic protein, loss of function)
  is not an ion-transport defect of the kind that unifies FHM1-3, and the authors who established
  PRRT2 as a hemiplegic-migraine gene state that the specific intervening route to hemiplegic attacks
  is not understood. GeneReviews describes disrupted synaptic neurotransmission and sodium/calcium-channel
  regulation after PRRT2 loss, but those synaptic effects do not by themselves establish the route
  to every FHM manifestation.

  External identifiers. The schema's DiseaseMappings container carries ICD-10-CM, ICD-11-F, MONDO
  and NCIT slots only, so two identifiers are recorded here instead: the OMIM phenotypic series OMIMPS:141500,
  which MONDO:0000700 already cross-references, and the per-subtype OMIM phenotype numbers, which
  are noted on each has_subtypes mapping. MONDO:0000700 carries no Orphanet cross-reference, so no
  ORPHA identifier is asserted for this entry.
prevalence:
- population: Denmark (nationwide case-finding, hemiplegic migraine overall)
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 10.0
  notes: >-
    The 0.01% figure is for hemiplegic migraine as a whole. The same study found
    familial and sporadic forms to be about equally frequent, so the familial
    form alone is roughly half this rate; a separate FHM-only prevalence has not
    been established, so the combined figure is recorded with this caveat rather
    than a derived number.
  evidence:
  - reference: PMID:12110112
    reference_title: An epidemiological survey of hemiplegic migraine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on the identified number of affected patients the prevalence of HM
      at the end of 1999 was estimated to be 0.01% in Denmark, where the
      familial and sporadic form were equally frequent.
    explanation: >-
      Nationwide capture-recapture case-finding gives the population prevalence
      of hemiplegic migraine and establishes that familial and sporadic forms
      contribute about equally.
- population: Reported literature estimate for FHM specifically
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 3.0
  notes: >-
    0.003%, i.e. about 3 per 100,000. This is the familial form alone, as
    against the 0.01% figure for hemiplegic migraine as a whole recorded above,
    and is consistent with the Danish finding that familial and sporadic forms
    are about equally frequent. It is a review's summary of several primary
    sources rather than a single measurement, so it is recorded alongside the
    Danish figure rather than replacing it.
  evidence:
  - reference: PMID:38674378
    reference_title: >-
      Unravelling the Genetic Landscape of Hemiplegic Migraine: Exploring Innovative Strategies and
      Emerging Approaches.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FHM is a rare disorder with an estimated low prevalence rate of 0.003%
    explanation: >-
      The FHM-specific prevalence estimate, distinct from the
      hemiplegic-migraine-overall figure recorded above.
- population: Denmark (nationwide case-finding, sex ratio)
  measure_type: POINT_PREVALENCE
  notes: Female predominance of 3:1 in the same nationwide survey.
  evidence:
  - reference: PMID:12110112
    reference_title: An epidemiological survey of hemiplegic migraine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The HM sex ratio (M:F) was 1:3."
    explanation: Establishes the female predominance of hemiplegic migraine.
progression:
- phase: Childhood onset and first years
  age_range: First attack under 18 years
  notes: >-
    In a genetically confirmed paediatric FHM cohort, attacks were infrequent
    from the outset - only four of nine patients had a further attack during the
    first year - and attack duration differed markedly by genotype, being far
    longer in the CACNA1A group than in the ATP1A2 group.
  evidence:
  - reference: PMID:37326332
    reference_title: >-
      Familial hemiplegic migraine in pediatric patients: A genetic, clinical,
      and follow-up study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean (SD) duration of HM attacks in the sample was 11.3 (17.1) h; 3.8
      (6.1) h in the ATP1A2 group, and 24.3 (23.5) h in the CACNA1A group.
    explanation: >-
      Quantifies attack duration and its genotype dependence. Nine patients
      across three centres, so the difference is a description of this cohort
      rather than an established genotype-phenotype rule.
- phase: Long-term follow-up
  age_range: Mean 7.4 years of follow-up from onset
  duration: Mean 7.4 years (range 3-10)
  notes: >-
    Over follow-up the course was benign in this cohort: attacks remained
    infrequent, improved with time, and no new neurological disorder or
    deterioration in neurological or cognitive function appeared. This is the
    natural-history counterpart of the severe-attack phenotypes recorded in
    phenotypes, and the two are not in conflict - severe attacks are real but
    are not the usual course.
  evidence:
  - reference: PMID:37326332
    reference_title: >-
      Familial hemiplegic migraine in pediatric patients: A genetic, clinical,
      and follow-up study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Over the course of follow-up, the attack frequency overall was 0.4
      attacks/year without a difference between the two groups (CACNA1A and
      ATP1A2).
    explanation: Quantifies long-term attack frequency.
  - reference: PMID:37326332
    reference_title: >-
      Familial hemiplegic migraine in pediatric patients: A genetic, clinical,
      and follow-up study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The study data show that most of our patients with early-onset FHM
      experienced infrequent and non-severe attacks, which improved over time.
    explanation: >-
      The authors' summary of the course. Nine patients, single-arm, so this is
      a cohort description rather than a prognosis, and no frequency band is
      asserted anywhere from it.
  - reference: PMID:37326332
    reference_title: >-
      Familial hemiplegic migraine in pediatric patients: A genetic, clinical,
      and follow-up study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the clinical course revealed neither the appearance of novel neurological
      disorders or a deterioration of basic neurological or cognitive
      functioning
    explanation: >-
      A negative finding worth recording: no progressive neurological or
      cognitive decline over a mean 7.4 years, which bounds the intellectual
      disability and cerebellar phenotypes curated elsewhere in this entry.
  - reference: PMID:20301562
    reference_title: Familial Hemiplegic Migraine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FHM is often earlier in onset than typical migraine, frequently beginning
      in the first or second decade; the frequency of attacks tends to decrease
      with age.
    explanation: >-
      The GeneReviews statement of onset and of the decline in attack frequency
      with age, which the paediatric cohort above is consistent with.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    FHM caused by a heterozygous pathogenic variant in ATP1A2, CACNA1A, PRRT2 or
    SCN1A is inherited in an autosomal dominant manner, with a 50% recurrence
    risk for each child of an affected individual. Because the FHM diagnosis
    itself requires an affected relative, most probands have an affected parent;
    apparently simplex cases may reflect a de novo variant or an asymptomatic
    transmitting parent.

    Penetrance is high but incomplete, and expressivity is markedly variable -
    within a single pedigree the same variant can produce infrequent pure
    hemiplegic attacks in one carrier and attacks with coma or prolonged
    hemiplegia in another. Both facts matter for counseling: an unaffected
    carrier parent is expected rather than anomalous, and a mild index case
    does not predict a mild course in relatives.
  penetrance: INCOMPLETE
  penetrance_percentage: "89 (CACNA1A mutation carriers; see the CACNA1A genetic record)"
  expressivity: VARIABLE
  evidence:
  - reference: PMID:20301562
    reference_title: Familial Hemiplegic Migraine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FHM and simplex hemiplegic migraine caused by a heterozygous ATP1A2,
      CACNA1A, PRRT2, or SCN1A pathogenic variant are inherited in an autosomal
      dominant manner.
    explanation: GeneReviews states the mode of inheritance for all four FHM genes.
  - reference: PMID:20301562
    reference_title: Familial Hemiplegic Migraine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with simplex hemiplegic migraine (i.e., individuals with an
      FHM-causing pathogenic variant and an apparently negative family history)
      may have a de novo pathogenic variant or a pathogenic variant inherited
      from an asymptomatic parent.
    explanation: >-
      Explains why an apparently sporadic presentation does not exclude a
      dominant FHM-gene variant.
  - reference: PMID:11439943
    reference_title: >-
      The clinical spectrum of familial hemiplegic migraine associated with
      mutations in a neuronal calcium channel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eighty-nine percent of the subjects with mutations had attacks of
      hemiplegic migraine.
    explanation: >-
      In 117 genotyped CACNA1A mutation carriers, 11% had no hemiplegic migraine
      attacks - a direct measurement of incomplete penetrance, and the source of
      the 89% figure recorded above. The denominator is CACNA1A carriers, so the
      number should not be read as a penetrance estimate for ATP1A2, SCN1A or
      PRRT2.
  - reference: PMID:11439943
    reference_title: >-
      The clinical spectrum of familial hemiplegic migraine associated with
      mutations in a neuronal calcium channel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hemiplegic migraine in subjects with mutations in CACNA1A has a broad
      clinical spectrum. This clinical variability is partially associated with
      the various types of mutations.
    explanation: >-
      Establishes variable expressivity and attributes it only partially to
      allele identity, which is why the variability is recorded as expressivity
      rather than as a genotype-phenotype rule.
  - reference: PMID:11439943
    reference_title: >-
      The clinical spectrum of familial hemiplegic migraine associated with
      mutations in a neuronal calcium channel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One third had severe attacks with coma, prolonged hemiplegia, or both,
      with full recovery.
    explanation: >-
      Quantifies the severe end of the expressivity range within the same
      carrier series.
  - reference: PMID:41552155
    reference_title: "Hemiplegic Migraine: An Imitator of Cerebrovascular Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These genes are transmitted in an autosomal dominant pattern with variable
      penetrance.
    explanation: >-
      A second source stating that penetrance is variable across the FHM genes
      generally, not only in CACNA1A families.
has_subtypes:
- name: FHM1
  display_name: Familial Hemiplegic Migraine Type 1 (CACNA1A)
  subtype_term:
    preferred_term: migraine, familial hemiplegic, 1
    term:
      id: MONDO:0020756
      label: migraine, familial hemiplegic, 1
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0020756
        label: migraine, familial hemiplegic, 1
      mapping_predicate: skos:exactMatch
      mapping_source: MONDO
      mapping_justification: semapv:ManualMappingCuration
      notes: >-
        MONDO carries a dedicated term for this numbered molecular subtype, so
        the mapping is exact rather than a narrowMatch under the MONDO:0000700
        parent. The corresponding OMIM phenotype entry is #141500; the schema's
        DiseaseMappings container has no OMIM slot, so that identifier is
        recorded here rather than as a separate mapping.
  classification: molecular
  description: >-
    Caused by heterozygous missense variants in CACNA1A encoding the alpha1A
    pore-forming subunit of the neuronal Cav2.1 (P/Q-type) voltage-gated calcium
    channel. The pathogenic variants act by gain of function, increasing
    presynaptic Ca2+ influx and glutamate release. Roughly 40-50% of CACNA1A-FHM
    families additionally show cerebellar signs, from nystagmus to a late-onset
    mild progressive ataxia, and the severe S218L allele is associated with
    coma and cerebral edema after minor head trauma.
  genes:
  - preferred_term: CACNA1A
    term:
      id: hgnc:1388
      label: CACNA1A
  evidence:
  - reference: PMID:8898206
    reference_title: >-
      Familial hemiplegic migraine and episodic ataxia type-2 are caused by
      mutations in the Ca2+ channel gene CACNL1A4.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In FHM, we found four different missense mutations in conserved functional
      domains.
    explanation: >-
      The original linkage and mutation study identifying missense variants in
      the brain P/Q-type calcium channel alpha1 subunit gene as the cause of FHM1.
  - reference: PMID:20301562
    reference_title: Familial Hemiplegic Migraine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 40%-50% of families with CACNA1A-FHM have cerebellar signs
      ranging from nystagmus to progressive, usually late-onset mild ataxia.
    explanation: >-
      Establishes the cerebellar phenotype that distinguishes FHM1 from the
      other molecular subtypes.
- name: FHM2
  display_name: Familial Hemiplegic Migraine Type 2 (ATP1A2)
  subtype_term:
    preferred_term: migraine, familial hemiplegic, 2
    term:
      id: MONDO:0011232
      label: migraine, familial hemiplegic, 2
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0011232
        label: migraine, familial hemiplegic, 2
      mapping_predicate: skos:exactMatch
      mapping_source: MONDO
      mapping_justification: semapv:ManualMappingCuration
      notes: >-
        MONDO carries a dedicated term for this numbered molecular subtype, so
        the mapping is exact rather than a narrowMatch under the MONDO:0000700
        parent. The corresponding OMIM phenotype entry is #602481; the schema's
        DiseaseMappings container has no OMIM slot, so that identifier is
        recorded here rather than as a separate mapping.
  classification: molecular
  description: >-
    Caused by heterozygous variants in ATP1A2 encoding the alpha2 subunit of the
    Na+/K+-ATPase, an isoform expressed almost exclusively in astrocytes in the
    adult brain. The variants act by loss of function of a single allele, and in
    the knock-in mouse the mutant protein is retained in the endoplasmic
    reticulum and degraded. Epilepsy is a particularly common comorbidity in
    ATP1A2-FHM.
  genes:
  - preferred_term: ATP1A2
    term:
      id: hgnc:800
      label: ATP1A2
  evidence:
  - reference: PMID:12539047
    reference_title: >-
      Haploinsufficiency of ATP1A2 encoding the Na+/K+ pump alpha2 subunit
      associated with familial hemiplegic migraine type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we show that mutations in the gene ATP1A2 that encodes the alpha2
      subunit of the Na+/K+ pump are associated with familial hemiplegic
      migraine type 2 (FHM2) linked to chromosome 1q23
    explanation: The gene-discovery study defining the FHM2 molecular subtype.
- name: FHM3
  display_name: Familial Hemiplegic Migraine Type 3 (SCN1A)
  subtype_term:
    preferred_term: migraine, familial hemiplegic, 3
    term:
      id: MONDO:0012320
      label: migraine, familial hemiplegic, 3
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0012320
        label: migraine, familial hemiplegic, 3
      mapping_predicate: skos:exactMatch
      mapping_source: MONDO
      mapping_justification: semapv:ManualMappingCuration
      notes: >-
        MONDO carries a dedicated term for this numbered molecular subtype, so
        the mapping is exact rather than a narrowMatch under the MONDO:0000700
        parent. The corresponding OMIM phenotype entry is #609634; the schema's
        DiseaseMappings container has no OMIM slot, so that identifier is
        recorded here rather than as a separate mapping.
  classification: molecular
  description: >-
    Caused by heterozygous missense variants in SCN1A encoding the neuronal
    Nav1.1 voltage-gated sodium channel, the same gene whose loss-of-function
    variants cause Dravet syndrome and other epilepsies. FHM3 variants act in
    the opposite direction, as gain of function, and Nav1.1 is the principal
    sodium channel of GABAergic interneurons - so FHM3 reaches cortical
    spreading depression by a route distinct from the glutamatergic
    FHM1/FHM2 mechanism.
  genes:
  - preferred_term: SCN1A
    term:
      id: hgnc:10585
      label: SCN1A
  evidence:
  - reference: PMID:16054936
    reference_title: >-
      Mutation in the neuronal voltage-gated sodium channel SCN1A in familial
      hemiplegic migraine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing of candidate genes in this region revealed a heterozygous
      missense mutation (Gln1489Lys) in the neuronal voltage-gated sodium
      channel gene SCN1A, mutations of which have been associated with epilepsy.
    explanation: The gene-discovery study defining the FHM3 molecular subtype.
  - reference: PMID:16054936
    reference_title: >-
      Mutation in the neuronal voltage-gated sodium channel SCN1A in familial
      hemiplegic migraine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dysfunction of the neuronal sodium channel SCN1A can cause familial
      hemiplegic migraine. Our findings have implications for the understanding
      of migraine aura. Moreover, our study reinforces the molecular links
      between migraine and epilepsy, two common paroxysmal disorders.
    explanation: >-
      Establishes both causation and the mechanistic link between FHM3 and the
      epilepsies caused by the same gene.
pathophysiology:
- name: Cav2.1 Calcium Channel Gain of Function
  biological_scale: MOLECULAR
  description: >-
    FHM1 missense variants in CACNA1A produce a gain of function of the neuronal
    Cav2.1 (P/Q-type) voltage-gated calcium channel. In the R192Q knock-in mouse
    the effect is measured directly as increased Cav2.1 current density in
    cerebellar neurons and enhanced neurotransmission at the neuromuscular
    junction.
  molecular_functions:
  - preferred_term: voltage-gated calcium channel activity
    term:
      id: GO:0005245
      label: voltage-gated calcium channel activity
    modifier: INCREASED
  genetic_context:
    gene:
      preferred_term: CACNA1A
      term:
        id: hgnc:1388
        label: CACNA1A
    allele_type: MISSENSE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Heterozygous missense variants in conserved functional domains of the
      alpha1A subunit; the archetypal pure-FHM allele is R192Q and the severe
      allele is S218L.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:15003170
    reference_title: >-
      A Cacna1a knockin migraine mouse model with increased susceptibility to cortical spreading
      depression.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We generated a knockin mouse model carrying the human pure FHM-1 R192Q
      mutation and found multiple gain-of-function effects. These include
      increased Ca(v)2.1 current density in cerebellar neurons, enhanced
      neurotransmission at the neuromuscular junction
    explanation: >-
      Direct electrophysiological demonstration that the FHM1 variant is a
      gain-of-function change in Cav2.1 channel activity.
  downstream:
  - target: Increased Cortical Glutamatergic Excitability
    description: >-
      Increased presynaptic calcium influx enhances release at cortical excitatory synapses in FHM1
      models.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19285472
      reference_title: >-
        Enhanced excitatory transmission at cortical synapses as the basis for facilitated spreading
        depression in Ca(v)2.1 knockin migraine mice.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We show gain of function of excitatory neurotransmission due to increased
        action-potential-evoked Ca(2+) influx and increased probability of
        glutamate release at pyramidal cell synapses but unaltered inhibitory
        neurotransmission at fast-spiking interneuron synapses.
      explanation: >-
        Establishes the synapse-specific enhancement of glutamate release as the
        cellular consequence of the FHM1 channel gain of function.
  - target: Purkinje Cell Firing Dysregulation
    description: >-
      S218L Cav2.1 gating increases Purkinje excitability and disrupts firing patterns.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23115190
      reference_title: Cerebellar ataxia by enhanced Ca(V)2.1 currents is alleviated by
        Ca2+-dependent K+-channel activators in Cacna1a(S218L) mutant mice.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here, we demonstrate that the S218L mutation causes a negative shift of voltage dependence
        of Ca(V)2.1 channels of mouse Purkinje cells and results in lowered thresholds for somatic
        action potentials and dendritic Ca(2+) spikes and in disrupted firing patterns.
      explanation: >-
        Purkinje-cell electrophysiology directly supports the S218L channel-to-firing relation. It
        does not generalize this effect to CACNA1A loss-of-function ataxias.
    hypothesis_groups:
    - fhm1_cerebellar
  - target: Cerebellar Neuronal Degeneration
    description: >-
      Selected FHM1 current abnormalities are proposed to produce Purkinje dysfunction and neuronal
      loss.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:25143767
      reference_title: Familial hemiplegic migraine and spreading depression.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        FHM1 with ataxia is attributable to specific mutations that differ from mutations that cause
        pure FHM1 and have peculiar consequences on cerebellar Cav2.1 currents that lead to profound
        Purkinje cell dysfunction and to neuronal loss with atrophy.
      explanation: >-
        The mechanistic review attributes cerebellar neuronal loss and atrophy to selected FHM1 current
        abnormalities. This synthesis supports a qualified degeneration route, not a human histological
        demonstration across all CACNA1A families.
      directness: INDIRECT
    hypothesis_groups:
    - fhm1_cerebellar
    intermediate_mechanisms:
    - Purkinje cell dysfunction
  - target: Attack-Associated Psychosis
    description: >-
      A chromosome-19-linked FHM/ataxia family prompted the authors' calcium-channel hypothesis for
      acute psychosis. Applying the Cav2.1 gain-of-function framework to that family remains provisional.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:10202246
      reference_title: Familial hemiplegic migraine with cerebellar ataxia and paroxysmal
        psychosis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        we hypothesize that a dysfunction of the mutated calcium channel may be involved not only
        in the development of hemiplegic migraine but also in the acute psychotic episodes observed
        in these patients.
      explanation: >-
        The family authors explicitly propose a calcium-channel explanation from chromosome-19 linkage
        and phenotype. This is a provisional attribution, without a confirmed molecular variant or
        intervening psychiatric pathway.
      directness: INDIRECT
    hypothesis_groups:
    - familial_psychosis
  - target: Cerebellar Ataxia
    description: >-
      R583Q gain-of-function physiology is the family authors' explanation of cerebellar ataxia;
      intervening circuitry is not reconstructed for those patients.

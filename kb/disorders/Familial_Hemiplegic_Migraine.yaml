    explanation: >-
      Establishes the K+-mediated, transmission-independent route from
      interneuron hyperactivity to CSD, which is what makes FHM3 mechanistically
      distinct from FHM1 and FHM2. Graded IN_VITRO because the experiments
      behind this claim - Hm1a application, optogenetic stimulation, and the
      receptor- and Ca2+-channel-blockade series that establishes the
      transmission independence - were performed in brain slices. The study's
      in vivo arm is recorded as its own item below.

    reference_title: "Hemiplegic Migraine: An Imitator of Cerebrovascular Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While evidence from randomized trials is unavailable, case series suggest
      potential benefit.
    explanation: >-
      States the strength of the evidence for these agents explicitly. No efficacy claim is made
      here, which limits inference.
  - reference: PMID:20301562
    reference_title: Familial Hemiplegic Migraine.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      a trial of prophylactic migraine medications (e.g., tricyclic
      antidepressants, beta-blockers, calcium channel blockers, anti-seizure
      medications) for all FHM types may be warranted for frequent attacks
    explanation: >-
      GeneReviews management guidance for prophylaxis across all FHM molecular
      subtypes.
  - reference: PMID:37247170
    reference_title: Hemiplegic Migraine.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Given the low prevalence of the disease, most studies regarding treatment
      are limited to case studies. There is still an important need for further
      and larger studies regarding management of these cases.
    explanation: >-
      Records the weakness of the treatment evidence base, which is why no
      efficacy claim is made here.
- name: Anti-Seizure Medication for Comorbid Epilepsy
  description: >-
    Anti-seizure treatment where seizures occur, which is particularly relevant
    in ATP1A2-FHM. Drug-resistant epilepsy is rare across all FHM genotypes.
  therapeutic_modality: SMALL_MOLECULE

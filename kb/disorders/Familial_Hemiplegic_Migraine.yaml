- name: CACNA1A
  gene_term:
    preferred_term: CACNA1A
    term:
      id: hgnc:1388
      label: CACNA1A
  subtype: FHM1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Encodes the alpha1A pore-forming subunit of the neuronal Cav2.1 (P/Q-type)
    voltage-gated calcium channel. FHM1 variants are missense and act by gain of
    function. Truncating variants in the same gene cause episodic ataxia type 2
    instead, making FHM1 and EA2 allelic channelopathies.

    CACNA1A is the one FHM gene with a directly measured penetrance figure. In
    a series of 117 genotyped carriers from families ascertained on hemiplegic
    migraine with or without cerebellar signs, 89% had hemiplegic migraine
    attacks and one third had severe attacks with coma, prolonged hemiplegia or
    both. Expressivity varies with the allele but only partially: 83% of
    carriers of the six cerebellar-associated mutations had nystagmus, ataxia
    or both, while three other mutations were associated with pure hemiplegic
    migraine.
  inheritance:
  - name: Autosomal dominant, incomplete penetrance (CACNA1A)
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    penetrance: INCOMPLETE
    penetrance_percentage: "89"
    expressivity: VARIABLE
    description: >-
      Gene-specific penetrance and expressivity for CACNA1A, measured in
      genotyped carriers rather than inferred from affected probands. Recorded
      here rather than only on the disease-level inheritance block because the
      denominator is CACNA1A carriers.
    evidence:
    - reference: PMID:11439943
      reference_title: >-
        The clinical spectrum of familial hemiplegic migraine associated with
        mutations in a neuronal calcium channel.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Genotyping of probands and relatives identified a total of 117 subjects
        with mutations whose clinical manifestations were assessed in detail.
      explanation: >-
        Establishes the carrier-based denominator, which is what makes the
        following figure a penetrance estimate rather than a case-series
        proportion.
    - reference: PMID:11439943
      reference_title: >-
        The clinical spectrum of familial hemiplegic migraine associated with
        mutations in a neuronal calcium channel.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Eighty-nine percent of the subjects with mutations had attacks of
        hemiplegic migraine.
      explanation: The penetrance measurement itself.
    - reference: PMID:11439943

    allele_type: MISSENSE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Heterozygous missense variants such as Q1489K in the fast-inactivation
      hinged-lid domain of Nav1.1.
  cell_types:

environmental:
- name: Minor head trauma
  description: >-
    Mild head injury is the best characterized attack trigger in FHM and the one
    with the clearest mechanistic reading. It does not cause the disorder; it
    precipitates an attack in a cortex whose spreading-depression threshold is
    already genetically lowered, and in the severe CACNA1A S218L allele the
    attack it precipitates can be a prolonged one with delayed cerebral edema
    and coma. The S218L knock-in mouse reproduces this: its cortex responds to
    a single weak stimulus with multiple spreading-depression events, which is
    the proposed reason a trivial injury has a non-trivial consequence.
  exposure_term:
    preferred_term: minor head trauma
  influences_mechanisms:
  - target: Reduced Cortical Spreading Depression Threshold
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      A weak mechanical stimulus is sufficient to ignite spreading depression in
      a cortex whose threshold is already lowered, which is the step at which
      trauma enters the causal chain.
    evidence:
    - reference: PMID:20186955
      reference_title: >-
        High cortical spreading depression susceptibility and migraine-associated
        symptoms in Ca(v)2.1 S218L mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The particularly low CSD threshold and the strong tendency to respond
        with multiple CSD events make the S218L cortex highly vulnerable to weak
        stimuli
      explanation: >-
        States the mechanism by which a weak stimulus such as minor trauma
        triggers spreading depression in this genotype. Mouse data, hence
        MODEL_ORGANISM.
  - target: Prolonged Attacks with Cerebral Edema and Impaired Consciousness
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      In patients carrying the S218L allele, minor head trauma is the reported
      precipitant of the severe attack phenotype with delayed cerebral edema and
      coma.
    evidence:
    - reference: PMID:19438926
      reference_title: >-
        The FHM1 mutation S218L, a severe clinical phenotype? A case report and
        review of the literature.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This CACNA1A mutation has been associated with HM, delayed cerebral
        oedema and coma following minor head trauma.
      explanation: >-
        The human observation linking minor head trauma to the severe attack
        phenotype in S218L carriers.
    - reference: PMID:20186955
      reference_title: >-
        High cortical spreading depression susceptibility and migraine-associated
        symptoms in Ca(v)2.1 S218L mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the S218L CACNA1A mutation causes a dramatic hemiplegic migraine syndrome
        that is associated with ataxia, seizures, and severe, sometimes fatal,
        brain edema often triggered by only a mild head trauma
      explanation: >-
        Restates the human trauma-edema association that this knock-in model was
        built to explain.
  evidence:
  - reference: PMID:38674378
    reference_title: >-
      Unravelling the Genetic Landscape of Hemiplegic Migraine: Exploring
      Innovative Strategies and Emerging Approaches
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common factors, such as viral infection, physical and emotional stress,
      and head trauma, have been found to trigger HM
    explanation: >-
      Establishes head trauma as a recognized trigger of hemiplegic migraine
      generally, not only in the S218L genotype.
  notes: >-
    exposure_term is left with a free-text preferred_term and no ontology
    binding. ECTO was searched for a head-trauma, head-injury, physical-trauma
    or mechanical-force exposure class and has none; the OLS ECTO index returns
    only chemical and anatomical hits for those strings. No term beats a wrong
    term, so nothing is bound here.

    Practical consequence recorded in the source literature: avoidance of
    contact sports and repetitive head injury is reasonable for patients whose
    severe attacks are trauma-triggered. That is a management inference from
    this trigger rather than a tested intervention, so it is not curated as a
    treatment.
- name: Physical and emotional stress
  description: >-
    Physical or emotional stress is a reported precipitant of attacks, in common
    with migraine generally. It is recorded as an attack trigger acting on the
    same threshold node, not as a cause of the disorder.
  exposure_term:
    preferred_term: physical or emotional stress
  influences_mechanisms:
  - target: Reduced Cortical Spreading Depression Threshold
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Named among the common precipitants of a hemiplegic migraine attack. The
      route from stress to the threshold node is not characterized, hence
      INDIRECT_UNKNOWN_INTERMEDIATES.
    evidence:
    - reference: PMID:38674378
      reference_title: >-
        Unravelling the Genetic Landscape of Hemiplegic Migraine: Exploring
        Innovative Strategies and Emerging Approaches
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Common factors, such as viral infection, physical and emotional stress,
        and head trauma, have been found to trigger HM
      explanation: Names physical and emotional stress as attack triggers.
  evidence:
  - reference: PMID:41552155
    reference_title: "Hemiplegic Migraine: An Imitator of Cerebrovascular Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the attacks are frequently triggered by factors such as stress, sleep
      disturbances, bright lights, or intense emotional stimuli
    explanation: >-
      A second source listing stress, and adding sleep disruption and sensory
      stimuli, among attack triggers.
  notes: >-
    ECTO has no exposure class for psychosocial or emotional stress, so
    exposure_term is left unbound, as it is for the head-trauma entry above.
    Sleep disruption and bright light are named in the second snippet but are
    not curated as their own entries, because neither source characterizes them
    beyond the list.
- name: Viral infection and febrile illness
  description: >-
    Intercurrent viral illness and fever are reported precipitants of attacks.
    Fever also occurs during severe attacks as a manifestation rather than a
    trigger, and the two are not the same claim - this entry is the trigger.
  exposure_term:
    preferred_term: viral infection
  influences_mechanisms:
  - target: Reduced Cortical Spreading Depression Threshold
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Named among the common precipitants of an attack. No mechanism connecting
      infection to the threshold node has been established, hence
      INDIRECT_UNKNOWN_INTERMEDIATES.
    evidence:
    - reference: PMID:38674378
      reference_title: >-
        Unravelling the Genetic Landscape of Hemiplegic Migraine: Exploring

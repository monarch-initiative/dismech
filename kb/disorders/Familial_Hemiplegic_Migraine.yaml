    snippet: >-
      Surveillance: Neurologic evaluation to assess change in attack frequency
      and/or seizures, development of movement disorder, developmental delay,
      and/or learning disability annually or more frequently for worsening
      symptoms.
    explanation: GeneReviews surveillance guidance.
diagnosis:
- name: ICHD-Based Clinical Diagnosis
  description: >-
    FHM is diagnosed clinically, on a three-part criterion set: the proband
    fulfils the criteria for migraine with aura, the aura includes fully
    reversible motor weakness together with visual, sensory or language
    symptoms, and at least one first- or second-degree relative has attacks
    meeting the same hemiplegic-migraine criteria. The third clause is what
    separates FHM from sporadic hemiplegic migraine; it is a statement about
    family history, not about mechanism.
  diagnosis_term:
    preferred_term: clinical diagnostic evaluation against the ICHD criteria
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  presence: >-
    Required. A molecular result is confirmatory but is not needed to make the
    diagnosis.
  evidence:
  - reference: PMID:20301562
    reference_title: Familial Hemiplegic Migraine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical diagnosis of FHM can be established in a proband: (1) who
      fulfills criteria for migraine with aura; (2) in whom the aura includes
      fully reversible motor weakness and visual, sensory, or language symptoms;
      and (3) who has at least one first- or second-degree relative with similar
      attacks that fulfill the diagnostic criteria for hemiplegic migraine.
    explanation: >-
      The GeneReviews Diagnosis/Testing statement of the three-part clinical
      criteria, which is what this diagnosis entry records.
  - reference: PMID:41552155
    reference_title: "Hemiplegic Migraine: An Imitator of Cerebrovascular Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      include recurrent episodes of migraine with fully reversible motor
      weakness and other aura symptoms (visual, sensory, or language-related)
    explanation: >-
      Restates the criteria in ICHD-3 terms and adds the aura timing, confirming
      that the GeneReviews formulation tracks the current classification.
  - reference: DOI:10.1186/s10194-021-01228-4
    reference_title: >-
      Reference programme: diagnosis and treatment of headache disorders and
      facial pain. Danish Headache Society, 3rd edition, 2020
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The guideline first describes how to examine and diagnose the headache
      patient and how headache treatment is organized in Denmark.
    explanation: >-
      A current national reference programme covering the examination and
      diagnosis of the headache patient, which is the general clinical framework
      within which the FHM-specific criteria above are applied. It is a
      consensus guideline rather than a study, hence evidence_source OTHER.
  - reference: DOI:10.1186/s10194-021-01228-4
    reference_title: >-
      Reference programme: diagnosis and treatment of headache disorders and
      facial pain. Danish Headache Society, 3rd edition, 2020
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The recommendations for the primary headaches and facial pain are largely
      in accordance with the European guidelines produced by the European
      Academy of Neurology.
    explanation: >-
      Records that this reference programme is concordant with the European
      Academy of Neurology guidance, so it is not a purely local convention.
  notes: >-
    The Danish reference programme is cached abstract-only, so the two quotes
    above are the strongest claims it can support here. It is cited for the
    general diagnostic framework, not for any FHM-specific criterion; the
    FHM-specific criteria come from GeneReviews and ICHD-3.
- name: Molecular Genetic Testing of ATP1A2, CACNA1A, PRRT2 and SCN1A
  description: >-
    Identification of a heterozygous pathogenic variant in one of the four
    hemiplegic-migraine genes establishes the molecular diagnosis and assigns
    the subtype. It is confirmatory rather than required: a large majority of
    clinically diagnosed patients are mutation-negative on these four genes,
    so a negative panel does not exclude FHM.
  diagnosis_term:
    preferred_term: molecular genetic testing of the hemiplegic-migraine genes
    term:
      id: NCIT:C15709
      label: Genetic Testing
  presence: >-
    Confirmatory. Positive in a minority of clinically diagnosed patients.
  evidence:
  - reference: PMID:20301562
    reference_title: Familial Hemiplegic Migraine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The molecular diagnosis can be established in a proband by identification
      of a heterozygous pathogenic variant in ATP1A2, CACNA1A, PRRT2, or SCN1A.
    explanation: >-
      The GeneReviews molecular-diagnosis sentence, naming the four genes that
      constitute the diagnostic panel.
  - reference: PMID:34649875
    reference_title: >-
      Hemiplegic Migraine Associated With PRRT2 Variations, A Clinical and
      Genetic Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PRRT2 should be regarded as the fourth autosomal dominant gene for
      hemiplegic migraine and screened in any affected patient, together with
      the 3 other main genes.
    explanation: >-
      Supports testing all four genes rather than the classical three, which is
      why PRRT2 appears in the panel above.
  - reference: PMID:41552155
    reference_title: "Hemiplegic Migraine: An Imitator of Cerebrovascular Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, routine genetic testing is not required for diagnosis and is
      reserved for atypical or severe cases.
    explanation: >-
      Establishes that the test is confirmatory rather than diagnostic, which is
      what the presence field records.
  - reference: PMID:41552155
    reference_title: "Hemiplegic Migraine: An Imitator of Cerebrovascular Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A Danish population-based study found that only 14% of familial hemiplegic
      migraine patients had mutations in these genes, suggesting additional
      unidentified genetic factors
    explanation: >-
      Quantifies the low diagnostic yield, which is why a negative panel does
      not exclude the clinical diagnosis. This is a review restating a
      population-based result rather than the primary report.
  - reference: DOI:10.3390/genes15040443
    reference_title: >-
      Unravelling the Genetic Landscape of Hemiplegic Migraine: Exploring
      Innovative Strategies and Emerging Approaches
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, approximately 75% of HM patients are negative for these
      mutations, indicating there are other genes involved in disease causation.
    explanation: >-
      An independent estimate of the proportion of clinically diagnosed patients
      left unexplained by the four-gene panel. Cited here in its DOI form
      because that is how the review was cached; the same review's full text is
      cited elsewhere in this entry as PMID:38674378.
- name: Neuroimaging to Exclude Stroke and Other Secondary Causes
  description: >-
    Because the motor deficit mimics an acute cerebrovascular event, patients
    are commonly imaged urgently. Structural imaging is typically normal in
    hemiplegic migraine, and its role is exclusion of infarction, haemorrhage
    and other secondary causes rather than positive confirmation of FHM.
  diagnosis_term:
    preferred_term: neuroimaging
    term:
      id: NCIT:C173635
      label: Neuroimaging
  presence: >-
    Typically normal. Used to exclude alternative diagnoses, not to confirm FHM.
  evidence:
  - reference: PMID:41552155
    reference_title: "Hemiplegic Migraine: An Imitator of Cerebrovascular Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given its overlapping presentation with cerebrovascular events, hemiplegic
      migraine can easily be mistaken for ischemic stroke or TIA.
    explanation: >-
      Establishes the differential that drives urgent imaging in a suspected
      attack.
  - reference: PMID:41552155
    reference_title: "Hemiplegic Migraine: An Imitator of Cerebrovascular Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although structural imaging is often normal in hemiplegic migraine, early
      presentation before symptom resolution can prompt unnecessary therapy.
    explanation: >-
      Records that a normal scan is the expected finding, so imaging is an
      exclusion test here. This is a single case report with a literature
      discussion, so no frequency is asserted.
  - reference: DOI:10.3389/fped.2023.1214837
    reference_title: >-
      Two pediatric patients with hemiplegic migraine presenting as acute
      encephalopathy: case reports and a literature review
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Physicians should consider HM in the differential diagnosis of patients
      presenting with somnolence, coma, or convulsion without structural,
      epileptic, infectious, or inflammatory explanation.
    explanation: >-
      States the paediatric version of the exclusion logic: once structural,
      epileptic, infectious and inflammatory causes are excluded, hemiplegic
      migraine belongs in the differential rather than being a diagnosis of
      last resort.
differential_diagnoses:
- name: Migraine with aura
  disease_term:
    preferred_term: migraine with aura
    term:
      id: MONDO:0005475
      label: migraine with aura
  description: >-
    FHM sits inside the migraine-with-aura category and shares its cortical
    spreading depression biology; what separates them is the obligatory
    reversible motor weakness in FHM and the family history requirement.
  distinguishing_features:
  - Motor weakness is obligatory in FHM and absent in ordinary migraine with aura.
  - FHM requires at least one affected first- or second-degree relative.
  - >-
    FHM deficits can last hours to days and outlast the headache, whereas typical
    aura symptoms resolve within an hour.
  - >-
    Familial non-hemiplegic migraine with aura is the nearer differential than
    sporadic migraine with aura, because it shares the familial aggregation
    without the motor weakness. It too differs from population migraine with
    aura - earlier onset, later cessation, more severe aura - so a family
    history plus a severe aura is not by itself evidence of FHM.
  evidence:
  - reference: PMID:20301562
    reference_title: Familial Hemiplegic Migraine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical diagnosis of FHM can be established in a proband: (1) who
      fulfills criteria for migraine with aura; (2) in whom the aura includes
      fully reversible motor weakness and visual, sensory, or language symptoms;
      and (3) who has at least one first- or second-degree relative with similar
      attacks that fulfill the diagnostic criteria for hemiplegic migraine.
    explanation: >-
      States the three criteria that separate FHM from ordinary migraine with
      aura.
  - reference: PMID:15196299
    reference_title: Clinical characteristics of 362 patients with familial migraine with aura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several clinical characteristics of familial NHMA differed from migraine
      with aura in the general population: firstly, the age at onset was lower,
      secondly, the age at cessation was higher, thirdly, aura symptoms were
      more severe and finally, the co-occurrence of migraine without aura was
      higher in familial NHMA.
    explanation: >-
      Characterizes familial non-hemiplegic migraine with aura, the sibling
      entity ascertained by the same Danish group and methodology as the FHM
      series used elsewhere in this entry. It shows that early onset and severe
      aura in a family are features of familial migraine with aura in general,
      not discriminators for FHM - the motor weakness is.
  - reference: PMID:15196299
    reference_title: Clinical characteristics of 362 patients with familial migraine with aura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Visual aura occurred in almost every NHMA attack.
    explanation: >-
      The comparator for the FHM aura profile: visual aura dominates familial
      non-hemiplegic attacks, whereas FHM attacks usually carry all four typical
      aura modalities together.
- name: Alternating hemiplegia of childhood
  disease_term:
    preferred_term: alternating hemiplegia of childhood
    term:
      id: MONDO:0016241
      label: alternating hemiplegia of childhood
  description: >-
    AHC shares episodic hemiplegia with FHM and, like FHM2, involves a
    Na+/K+-ATPase alpha subunit - but the two are different genes, not one
    shared locus. AHC is caused by ATP1A3 and FHM2 by ATP1A2, paralogous alpha
    isoforms of the same pump with different cellular distributions (ATP1A3 is
    neuronal, ATP1A2 astrocytic in the adult brain). The overlap is therefore
    family-level paralogy rather than allelism, and the inheritance patterns
    differ correspondingly: AHC is usually sporadic and de novo, whereas the
    FHM diagnosis requires an affected first- or second-degree relative.
  distinguishing_features:
  - >-
    AHC is an ATP1A3 disorder; ATP1A2 is the FHM2 gene, and sporadic AHC has not
    been attributed to ATP1A2.
  - >-
    AHC begins in infancy, typically before 18 months, with attacks that
    alternate sides, remit with sleep, and carry dystonia and nystagmus.
  - >-
    Headache is the dominant feature of an FHM attack and is not required in
    AHC; AHC additionally carries persistent developmental impairment between
    attacks, which FHM does not.
  - >-
    AHC arises mostly from de novo variants and is usually sporadic, whereas
    autosomal dominant transmission with an affected relative is definitional
    for FHM.
  evidence:
  - reference: PMID:22842232
    reference_title: De novo mutations in ATP1A3 cause alternating hemiplegia of childhood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This work identifies de novo ATP1A3 mutations as the primary cause of AHC
      and offers insight into disease pathophysiology by expanding the spectrum
      of phenotypes associated with mutations in ATP1A3.
    explanation: >-
      Establishes ATP1A3 as the AHC gene, which is what separates AHC from the
      ATP1A2-associated FHM2 subtype curated here.
  - reference: PMID:22842232
    reference_title: De novo mutations in ATP1A3 cause alternating hemiplegia of childhood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, no cases of sporadic AHC have been attributed to ATP1A2
      mutations.
    explanation: >-
      States the gene boundary directly: the FHM2 gene ATP1A2 does not account
      for sporadic AHC, so the shared Na+/K+-ATPase involvement is paralogy
      between two disorders rather than a shared cause.
- name: Sporadic hemiplegic migraine
  description: >-
    Clinically and genetically indistinguishable from FHM apart from the absence
    of an affected first- or second-degree relative; it is about as common as the
    familial form, and an apparently negative family history does not exclude an
    FHM-gene variant.
  distinguishing_features:
  - No affected first- or second-degree relative with hemiplegic attacks.
  - >-
    May carry a de novo variant in an FHM gene, or one inherited from an
    asymptomatic parent, so molecular testing does not distinguish the two.
  evidence:
  - reference: PMID:12110112
    reference_title: An epidemiological survey of hemiplegic migraine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      147 were familial HM from 44 different families, 105 were sporadic HM and
      39 were unclassifiable HM.
    explanation: >-
      Shows sporadic hemiplegic migraine to be comparably frequent in
      population-based case-finding.
- name: Stroke and transient ischemic attack
  description: >-
    Any condition causing transitory focal neurological signs enters the
    differential; the breadth of that differential is why neuroimaging and
    workup are recommended before settling on hemiplegic migraine, and it is the
    reason vasoconstricting agents are avoided.
  distinguishing_features:
  - >-
    FHM deficits develop gradually and are fully reversible, with a stereotyped
    attack pattern and a positive family history.
  - Neuroimaging, CSF analysis and EEG are used to exclude structural and vascular causes.
  evidence:
  - reference: PMID:32430436
    reference_title: Diagnostic and therapeutic aspects of hemiplegic migraine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The differential diagnosis of HM is broad, including other types of
      migraine and any condition that can cause transitory neurological signs
      and symptoms. Neuroimaging, cerebrospinal fluid analysis and
      electroencephalography are useful, but the diagnosis is clinical with a
      genetic confirmation.
    explanation: >-
      States the breadth of the differential and the role of investigations in
      excluding mimics.
animal_models:
- name: Cacna1a R192Q knock-in mouse (FHM1, pure hemiplegic migraine allele)
  species: Mouse
  genotype: Cacna1a R192Q knock-in (human pure FHM1 allele)
  genes:
  - preferred_term: CACNA1A
    term:
      id: hgnc:1388
      label: CACNA1A
  publication: PMID:15003170
  description: >-
    The founding FHM1 model, carrying the human R192Q allele that causes pure
    hemiplegic migraine without cerebellar signs. It supplies the in vivo
    measurement on which this entry's central mechanistic claim rests - a
    reduced cortical spreading depression threshold and increased propagation
    velocity in the intact animal - and, through the companion synaptic study,
    the reason for it: a synapse-specific gain of function at excitatory
    pyramidal-cell synapses with inhibitory transmission left intact.
  evidence:
  - reference: PMID:15003170
    reference_title: >-
      A Cacna1a knockin migraine mouse model with increased susceptibility to
      cortical spreading depression.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The R192Q FHM-1 mouse is a promising animal model to study migraine
      mechanisms and treatments.
    explanation: >-
      The authors' own framing of this knock-in as a model for the human
      mechanism, which is what the links below rely on.
  modeled_mechanisms:
  - target: Reduced Cortical Spreading Depression Threshold
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The in vivo CSD threshold and velocity measurement that grounds the
      unifying node of this entry.
    limitations: >-
      The threshold is measured as susceptibility to an experimentally applied
      stimulus in anaesthetised mouse cortex, which is not the same quantity
      as whatever initiates a spontaneous human attack. The mouse cortex is
      also lissencephalic and lacks the motor-cortex geometry a wave would
      have to traverse to produce human hemiparesis. This link is the
      structural counterpart of the HUMAN_MODEL_MISMATCH discussion.
    evidence:
    - reference: PMID:15003170
      reference_title: >-
        A Cacna1a knockin migraine mouse model with increased susceptibility to
        cortical spreading depression.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our data show that the increased susceptibility for CSD and aura in
        migraine may be due to cortical hyperexcitability.
      explanation: >-
        The authors' interpretation of what this model demonstrates about the
        threshold node, as distinct from the individual measurements recorded
        as readouts below.
    readouts:
    - name: Cortical spreading depression induction threshold
      target: Reduced Cortical Spreading Depression Threshold
      description: >-
        Stimulus intensity required to ignite CSD in the intact animal.
      direction: DECREASED
      biological_processes:
      - preferred_term: membrane depolarization during action potential
        term:
          id: GO:0086010
          label: membrane depolarization during action potential
        modifier: INCREASED
      interpretation: >-
        A lower induction threshold is the direct measurement behind the
        threshold node.
      evidence:
      - reference: PMID:15003170
        reference_title: >-
          A Cacna1a knockin migraine mouse model with increased susceptibility
          to cortical spreading depression.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          in the intact animal, a reduced threshold and increased velocity of
          cortical spreading depression
        explanation: >-
          Reports the threshold measurement in vivo.
    - name: Cortical spreading depression propagation velocity
      target: Reduced Cortical Spreading Depression Threshold
      description: >-
        Speed at which the depolarization wave travels across cortex.
      direction: INCREASED
      interpretation: >-
        Faster propagation accompanies the lowered threshold, so the cortex
        both enters and spreads CSD more readily.
      evidence:
      - reference: PMID:15003170
        reference_title: >-
          A Cacna1a knockin migraine mouse model with increased susceptibility
          to cortical spreading depression.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          a reduced threshold and increased velocity of cortical spreading
          depression (CSD; the likely mechanism for the migraine aura)
        explanation: >-
          Reports the propagation-velocity measurement in vivo.
  - target: Increased Cortical Glutamatergic Excitability
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Cortical microcultures and slices from this model show increased
      action-potential-evoked Ca2+ influx and increased glutamate release probability
      at pyramidal-cell synapses, with fast-spiking interneuron synapses
      unaltered - the synapse specificity that makes this an
      excitation-inhibition imbalance rather than a global change.
    limitations: >-
      Measured in microcultures and acute slices rather than in the intact
      animal, and the causative link to CSD is established in an in vitro CSD
      model.
    readouts:
    - name: Glutamate release probability at cortical pyramidal cell synapses
      target: Increased Cortical Glutamatergic Excitability
      direction: INCREASED
      biological_processes:
      - preferred_term: glutamate secretion
        term:
          id: GO:0014047
          label: glutamate secretion
        modifier: INCREASED
      interpretation: >-
        The presynaptic measurement that connects Cav2.1 gain of function to
        cortical hyperexcitability.
      evidence:
      - reference: PMID:19285472
        reference_title: >-
          Enhanced excitatory transmission at cortical synapses as the basis
          for facilitated spreading depression in Ca(v)2.1 knockin migraine
          mice.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          increased action-potential-evoked Ca(2+) influx and increased
          probability of glutamate release at pyramidal cell synapses but
          unaltered inhibitory neurotransmission at fast-spiking interneuron
          synapses
        explanation: >-
          Reports the synapse-specific presynaptic measurement. Neuronal
          microcultures and brain slices, hence IN_VITRO rather than
          MODEL_ORGANISM.
    evidence:
    - reference: PMID:19285472
      reference_title: >-
        Enhanced excitatory transmission at cortical synapses as the basis for
        facilitated spreading depression in Ca(v)2.1 knockin migraine mice.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Using an in vitro model of CSD, we show a causative link between
        enhanced glutamate release and CSD facilitation.
      explanation: >-
        Establishes that the synaptic change in this model is causative for
        CSD facilitation, which is why the model is treated as informative for
        this node.
- name: Cacna1a S218L knock-in mouse (FHM1, severe allele)
  species: Mouse
  genotype: Cacna1a S218L knock-in (human severe FHM1 allele)
  genes:
  - preferred_term: CACNA1A
    term:
      id: hgnc:1388
      label: CACNA1A
  publication: PMID:20186955
  description: >-
    The severe-allele counterpart of the R192Q model. It is the model that
    explains why a trivial head injury has a non-trivial consequence in S218L
    carriers: the mutant cortex not only has a lower CSD threshold than R192Q
    but responds to a single stimulus with repeated CSD events, making it
    vulnerable to weak stimuli. The two FHM1 models together give an
    allele-severity gradient that matches the human one.
  evidence:
  - reference: PMID:20186955
    reference_title: >-
      High cortical spreading depression susceptibility and
      migraine-associated symptoms in Ca(v)2.1 S218L mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cacna1a(S218L) mice faithfully mimic the associated clinical features of
      the human S218L syndrome.
    explanation: >-
      The authors' assessment of phenotypic correspondence, which is the basis
      for the HIGH fidelity assigned to the threshold link below.
  modeled_mechanisms:
  - target: Reduced Cortical Spreading Depression Threshold
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      An exaggerated version of the R192Q threshold phenotype, with multiple
      CSD events following a single trigger.
    limitations: >-
      The same anaesthetised-cortex and species caveats as the R192Q model
      apply. HIGH here refers to correspondence with the human S218L syndrome
      specifically, which is the narrowest and best-matched of the FHM
      genotype-phenotype pairings; it should not be read as a claim about FHM
      in general.
    evidence:
    - reference: PMID:20186955
      reference_title: >-
        High cortical spreading depression susceptibility and
        migraine-associated symptoms in Ca(v)2.1 S218L mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We introduced the S218L mutation into the mouse Cacna1a gene and studied
        the mechanisms for the S218L syndrome by analyzing the phenotypic,
        molecular, and electrophysiological consequences.
      explanation: >-
        Establishes that this is a knock-in of the human allele characterized
        phenotypically, molecularly and electrophysiologically, which is what
        makes it informative for the threshold node.
    readouts:
    - name: Cortical spreading depression triggering threshold and event count
      target: Reduced Cortical Spreading Depression Threshold
      description: >-
        Threshold, propagation velocity, and number of CSD events elicited by
        a single stimulus.
      direction: DECREASED
      interpretation: >-
        The vastly reduced threshold plus repeated events after one stimulus
        is what distinguishes the severe allele from R192Q, where one stimulus
        typically yields one event.
      evidence:
      - reference: PMID:20186955
        reference_title: >-
          High cortical spreading depression susceptibility and
          migraine-associated symptoms in Ca(v)2.1 S218L mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          an exquisite sensitivity to cortical spreading depression (CSD),
          with a vastly reduced triggering threshold, an increased propagation
          velocity, and frequently multiple CSD events after a single stimulus
        explanation: >-
          Reports the threshold, velocity and event-count measurements.
      - reference: PMID:20186955
        reference_title: >-
          High cortical spreading depression susceptibility and
          migraine-associated symptoms in Ca(v)2.1 S218L mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In contrast, mice bearing the R192Q CACNA1A mutation, which in
          humans causes a milder form of hemiplegic migraine, typically
          exhibit only a single CSD event after one triggering stimulus.
        explanation: >-
          The direct comparison with the milder allele, which is what makes
          the event count an allele-severity readout rather than an isolated
          number.
  - target: Prolonged Attacks with Cerebral Edema and Impaired Consciousness
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model was built to explain the trauma-triggered cerebral edema of
      the human S218L syndrome, and the authors present the low threshold and
      repeated CSD events as its mechanistic basis.
    limitations: >-
      PARTIALLY, not fully: the cited work offers the CSD phenotype as a
      proposed mechanistic basis for the severe human syndrome rather than
      reporting trauma-triggered cerebral edema as a measured outcome in the
      mouse. The link records the proposed explanation, not a reproduced
      clinical event.
    evidence:
    - reference: PMID:20186955
      reference_title: >-
        High cortical spreading depression susceptibility and
        migraine-associated symptoms in Ca(v)2.1 S218L mice.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        may provide a mechanistic basis for the dramatic phenotype seen in
        S218L mice and patients. Thus, the S218L mouse model may prove a
        valuable tool to further elucidate mechanisms underlying migraine,
        seizures, ataxia, and trauma-triggered cerebral edema.
      explanation: >-
        The authors' own claim is explicitly a proposal - may provide - which
        is why this link is PARTIALLY_RECAPITULATES and the evidence item is
        PARTIAL.
- name: Atp1a2 W887R knock-in mouse (FHM2)
  species: Mouse
  genotype: Atp1a2 W887R knock-in, heterozygous (homozygotes die after birth)
  genes:
  - preferred_term: ATP1A2
    term:
      id: hgnc:800
      label: ATP1A2
  publication: PMID:21731499
  description: >-
    The first FHM2 model. It is the source of two separate claims in this
    entry: that the FHM2 variant acts by loss of the alpha2 pump through ER
    retention and proteasomal degradation, and that the resulting cortex has a
    lowered CSD threshold - the finding that lets FHM1 and FHM2 be drawn as
    converging on one node. It is also the entry's clearest negative result:
    heterozygous mutants have the cortical phenotype without any apparent
    clinical phenotype.
  evidence:
  - reference: PMID:21731499
    reference_title: >-
      Increased susceptibility to cortical spreading depression in the mouse
      model of familial hemiplegic migraine type 2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We generated the first FHM2 knock-in mouse model carrying the human
      W887R mutation in the Atp1a2 orthologous gene.
    explanation: >-
      Establishes the model and its genotype.
  modeled_mechanisms:
  - target: Reduced Cortical Spreading Depression Threshold
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The FHM2 in vivo threshold and velocity measurement, matching the FHM1
      result and supporting the convergence drawn at this node.
    limitations: >-
      Same anaesthetised-cortex and species caveats as the FHM1 models. The
      astrocytic glutamate-clearance step that would connect the pump defect
      to the threshold is offered as a hypothesis in this work, not measured.
    evidence:
    - reference: PMID:21731499
      reference_title: >-
        Increased susceptibility to cortical spreading depression in the mouse
        model of familial hemiplegic migraine type 2.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The demonstration that FHM2 and FHM1 mutations share the ability to
        facilitate induction and propagation of CSD in mouse models further
        support the role of CSD as a key migraine trigger.
      explanation: >-
        The authors' statement of what this model contributes to the shared
        threshold node, which is the convergence claim that node makes.
    readouts:
    - name: Cortical spreading depression induction threshold and velocity
      target: Reduced Cortical Spreading Depression Threshold
      direction: DECREASED
      interpretation: >-
        The FHM2 counterpart of the FHM1 threshold readout, measured in vivo
        in the heterozygous mutant.
      evidence:
      - reference: PMID:21731499
        reference_title: >-
          Increased susceptibility to cortical spreading depression in the
          mouse model of familial hemiplegic migraine type 2.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In vivo analysis of cortical spreading depression (CSD), the
          phenomenon underlying migraine aura, revealed a decreased induction
          threshold and an increased velocity of propagation in the
          heterozygous FHM2 mouse.
        explanation: >-
          Reports the in vivo threshold and velocity measurements.
  - target: Astrocytic Na+/K+-ATPase Alpha2 Loss of Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The molecular lesion itself: mutant alpha2 protein is strongly reduced
      in the brain of heterozygous mutants, consistent with ER retention and
      proteasomal degradation.
    limitations: >-
      Protein loss is measured in mouse brain; the ER-retention and
      degradation mechanism is demonstrated in transfected cells rather than
      in vivo.
    evidence:
    - reference: PMID:21731499
      reference_title: >-
        Increased susceptibility to cortical spreading depression in the mouse
        model of familial hemiplegic migraine type 2.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        likely as a consequence of endoplasmic reticulum retention and
        subsequent proteasomal degradation, as we demonstrate in transfected
        cells
      explanation: >-
        The mechanism by which the variant produces loss of function. Graded
        IN_VITRO because the authors state that this part was shown in
        transfected cells rather than in the mouse.
    readouts:
    - name: Brain alpha2 Na,K-ATPase protein abundance
      target: Astrocytic Na+/K+-ATPase Alpha2 Loss of Function
      direction: DECREASED
      interpretation: >-
        Reduced protein rather than altered pump kinetics is the readout that
        makes this a loss-of-function node.
      evidence:
      - reference: PMID:21731499
        reference_title: >-
          Increased susceptibility to cortical spreading depression in the
          mouse model of familial hemiplegic migraine type 2.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The mutant alpha2 Na,K-ATPase protein was barely detectable in the
          brain of homozygous mutants and strongly reduced in the brain of
          heterozygous mutants
        explanation: >-
          Reports the protein-abundance measurement.
  - target: Reversible Hemiparetic Aura
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The heterozygous FHM2 mouse - the genotype that matches the human
      heterozygous patient - shows no apparent clinical phenotype despite
      carrying the cortical CSD phenotype. The model reproduces the mechanism
      and not the disease.
    limitations: >-
      This is the negative result behind the entry's HUMAN_MODEL_MISMATCH
      discussion, and it is a substantive one: it means the step from a
      lowered CSD threshold to an episodic hemiparetic attack is not
      demonstrated in the one model where both could have been observed
      together. Mouse hemiparesis is also harder to ascertain than human
      hemiparesis, so absence of an apparent phenotype is weaker than a
      demonstration of absence - but it is what the cited work reports.
    evidence:
    - reference: PMID:21731499
      reference_title: >-
        Increased susceptibility to cortical spreading depression in the mouse
        model of familial hemiplegic migraine type 2.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Homozygous Atp1a2(R887/R887) mutants died just after birth, while
        heterozygous Atp1a2(+/R887) mice showed no apparent clinical
        phenotype.
      explanation: >-
        Reports directly that the heterozygous model does not display a
        clinical phenotype, which is what a FAILS_TO_RECAPITULATE link
        asserts.

clinical_trials:
- name: NCT00541736
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    Glyceryl trinitrate (GTN) provocation in genotyped FHM patients and healthy
    volunteers, 30 participants, completed 2008. A mechanistic study, not a
    treatment trial: GTN reliably provokes migraine in ordinary migraine
    sufferers, so the question was whether an FHM gene defect changes that
    response. It is recorded here because it is one of only two registered
    interventional studies in this disorder, and because a negative or divergent
    provocation response bears on the entry's mechanism.
  target_phenotypes:
  - preferred_term: Headache
    term:
      id: HP:0002315
      label: Headache
  - preferred_term: Migraine with aura
    term:
      id: HP:0002077
      label: Migraine with aura
  evidence:
  - reference: clinicaltrials:NCT00541736

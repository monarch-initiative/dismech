  publication: PMID:20186955
  description: >-
    The severe-allele counterpart of the R192Q model. It is the model that explains why a trivial
    head injury has a non-trivial consequence in S218L carriers: the mutant cortex not only has a
    lower CSD threshold than R192Q but responds to a single stimulus with repeated CSD events, making
    it vulnerable to weak stimuli. The two FHM1 models together give an allele-severity gradient
    that matches the human one. The model was built to explain the trauma-triggered cerebral edema
    of the human S218L syndrome, and the authors present the low threshold and repeated CSD events
    as its mechanistic basis. PARTIALLY, not fully: the cited work offers the CSD phenotype as a
    proposed mechanistic basis for the severe human syndrome rather than reporting trauma-triggered
    cerebral edema as a measured outcome in the mouse. The link records the proposed explanation,
    not a reproduced clinical event.

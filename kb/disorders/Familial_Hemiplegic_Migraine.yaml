      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Common factors, such as viral infection, physical and emotional stress,
        and head trauma, have been found to trigger HM
      explanation: Names viral infection as an attack trigger.
  evidence:
  - reference: PMID:38674378
    reference_title: >-
      Unravelling the Genetic Landscape of Hemiplegic Migraine: Exploring
      Innovative Strategies and Emerging Approaches
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common factors, such as viral infection, physical and emotional stress,
      and head trauma, have been found to trigger HM
    explanation: >-
      Establishes viral infection as a recognized precipitant in hemiplegic
      migraine. Recorded at the entry level as well as on the mechanism link
      because the two are different claims - that the exposure is relevant to
      this disease at all, and that it acts on the threshold node.
  notes: >-
    No infectious agent is curated for this entry. Viral illness precipitates
    attacks in an already-susceptible brain; it is not an etiologic agent, and
    no specific organism is implicated.

treatments:
- name: Acetazolamide
  description: >-
    A carbonic anhydrase inhibitor, tried preferentially in CACNA1A-FHM. In one
    family with a CACNA1A R583Q variant the proband and her affected sister
    reported freedom from new FHM attacks on acetazolamide, although the
    cerebellar ataxia continued to progress. The evidence base is case-level, in
    keeping with the rarity of the disorder.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acetazolamide
      term:
        id: CHEBI:27690
        label: acetazolamide
  target_mechanisms:
  - target: Reversible Hemiparetic Aura
    description: >-
      Reported to abolish new hemiplegic attacks in an acetazolamide-responsive
      CACNA1A family, without effect on the progressive cerebellar deficit.
    evidence:
    - reference: PMID:10408534
      reference_title: >-
        A new CACNA1A gene mutation in acetazolamide-responsive familial
        hemiplegic migraine and ataxia.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The proband and her affected sister were treated with acetazolamide,
        reporting freedom from new FHM attacks but no benefit in the progression
        of ataxia.
      explanation: >-
        Supports an attack-preventive effect, but from two related individuals
        in one family with no control condition, hence PARTIAL.
  evidence:
  - reference: PMID:20301562
    reference_title: Familial Hemiplegic Migraine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A trial of acetazolamide for individuals with CACNA1A-FHM or a trial of
      prophylactic migraine medications (e.g., tricyclic antidepressants,
      beta-blockers, calcium channel blockers, anti-seizure medications) for all
      FHM types may be warranted for frequent attacks.
    explanation: >-
      GeneReviews management guidance recommending an acetazolamide trial
      specifically for the CACNA1A subtype.
- name: Acute Attack Analgesia with NSAIDs and Non-Narcotic Analgesics
  description: >-
    Acute treatment of the headache phase is analgesic rather than
    migraine-specific, because the migraine-specific acute drugs (triptans,
    ergots) are the ones contraindicated here. This is the practical
    counterpart of the avoidance entry below: what is left once the
    vasoconstrictors are removed.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:

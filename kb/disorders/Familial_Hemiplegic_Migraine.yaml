discussions:
- discussion_id: gap_fhm_shared_csd_convergence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do the three FHM genes lower the cortical spreading depression threshold
    through one shared final mechanism, or through separate routes that happen
    to converge on the same clinical outcome?
  attaches_to:
  - pathophysiology#Facilitated Cortical Spreading Depolarization
  - pathophysiology#Increased Cortical Glutamatergic Excitability
  - pathophysiology#Cortical Interneuron Hyperactivity
  rationale: >-
    FHM1 and FHM2 have experimentally supported glutamatergic routes to CSD; the W887R/+ clearance
    deficit is directly measured in the 2016 study. FHM3 differs: acute activation experiments and
    the L1649Q knock-in support interneuron spiking and potassium accumulation without requiring
    glutamatergic synaptic transmission for initiation. A universal quantitative threshold-setting
    mechanism across the three subtypes remains unresolved, and these data do not establish the PRRT2
    route.
  proposed_experiments:
  - experiment_id: exp_fhm_cross_subtype_csd_threshold
    name: Cross-subtype comparison of CSD threshold determinants
    description: >-
      Measure CSD threshold together with extracellular K+ and glutamate
      transients in FHM1 (CACNA1A), FHM2 (ATP1A2) and FHM3 (SCN1A) knock-in
      cortex under one protocol, then test whether blocking glutamatergic
      transmission or buffering extracellular K+ abolishes the threshold shift
      in each. A K+ manipulation that rescues all three, where glutamatergic
      blockade rescues only FHM1 and FHM2, would establish extracellular K+ as
      the shared final common path rather than glutamate.
  evidence:
  - reference: PMID:27354390
    reference_title: Defective glutamate and K+ clearance by cortical astrocytes in familial
      hemiplegic migraine type 2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using ceftriaxone treatment of FHM2 mutants and partial inhibition of glutamate transporters
      in wild-type mice, we obtain evidence that defective glutamate clearance can account for most
      of the facilitation of CSD initiation in FHM2-knockin mice
    explanation: >-
      CSD recordings in cortical slices after mutant-mouse treatment or transporter inhibition support
      a causal clearance contribution. Ceftriaxone produced only a small rescue and did not restore
      perisynaptic astrocytic transporter density; this is not evidence of clinical drug efficacy.
  - reference: PMID:34491914
    reference_title: Initiation of migraine-related cortical spreading depolarization by
      hyperactivity of GABAergic neurons and NaV1.1 channels.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we show that acute pharmacological activation of NaV1.1 (the main Na+ channel of interneurons)
      or optogenetic-induced hyperactivity of GABAergic interneurons is sufficient to ignite CSD
      in the neocortex by spiking-generated extracellular K+ build-up.
    explanation: >-
      Pharmacologic and optogenetic acute-slice experiments support the spiking/potassium route;
      they mimic FHM3 activity rather than carrying an FHM allele.
  - reference: PMID:34546973
    reference_title: Hyperexcitable interneurons trigger cortical spreading depression in an
      Scn1a migraine model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Brain slice recordings using K+-sensitive electrodes revealed an increase in extracellular
      K+ in the early phase of CSD in heterozygous mice, likely representing the mechanistic link
      between interneuron hyperactivity and CSD initiation.
    explanation: >-
      The L1649Q genetic model independently supports the potassium intermediary, which the authors
      explicitly qualify as likely.
    directness: INDIRECT
- discussion_id: mismatch_fhm_csd_human_attack
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the reduced cortical spreading depression threshold measured in FHM
    knock-in mice actually explain the hemiparetic aura of a human FHM attack?
  attaches_to:
  - pathophysiology#Facilitated Cortical Spreading Depolarization
  - phenotypes#Reversible Hemiparesis During Aura
  rationale: >-
    FHM1, FHM2 and FHM3 models show facilitated CSD, while the CSD-to-human-aura relation remains
    the leading clinical hypothesis rather than a directly recorded spontaneous FHM event. Qualified
    causal edges preserve that explanatory relation. Experimentally evoked thresholds measure susceptibility,
    and W887R heterozygotes showed no apparent clinical phenotype despite facilitated CSD. That negative
    result remains in animal-model evidence and limitations; it is not a clinical-restatement mechanism
    node.
  proposed_experiments:
  - experiment_id: exp_fhm_human_csd_correlate
    name: Non-invasive detection of a CSD correlate during a human FHM attack
    description: >-
      Capture spontaneous or provoked attacks in genotyped FHM patients using
      serial perfusion and diffusion MRI or MEG timed to aura onset, and test
      whether a propagating wavefront traverses the motor cortex with the
      timing and direction predicted by CSD, and whether its speed and
      threshold differ between FHM1, FHM2 and FHM3 carriers as the mouse models
      predict.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1388/
    reference_title: Familial Hemiplegic Migraine - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Accumulating evidence supports the hypothesis that the electrophysiologic correlate underlying
      migraine aura is cortical spreading depolarization (CSD)
    explanation: >-
      GeneReviews presents CSD as the hypothesized electrophysiologic basis of aura. Together with
      its clinical localization of aura to cortex or brainstem, this supports a qualified route to
      cortical motor, sensory, visual and language manifestations; it is not a direct recording during
      human FHM attacks.
    directness: INDIRECT
- discussion_id: fhm_brainstem_component_scope
  kind: INTERPRETATION
  status: OPEN
  prompt: Which individual aura components explain the reported brainstem composite?
  rationale: >-
    The 69% figure is for any basilar-type symptom in 147 Danish FHM patients. It cannot quantify
    vertigo, tinnitus, dysarthria, diplopia, hyperacusis or transient ataxia separately. The primary
    abstract establishes ordering and the composite, while the full phenotype table was unavailable
    through attempted publisher and author-copy routes. The later clinical review explicitly lists
    individual HM manifestations, whose familial-versus-simplex component denominators remain unresolved.
    No composite phenotype is used to duplicate its constituents.
  evidence:
  - reference: PMID:12023326
    reference_title: >-
      A population-based study of familial hemiplegic migraine suggests revised diagnostic criteria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, 69% had basilar migraine (BM) symptoms during FHM attacks.
    explanation: >-
      The Danish population-based study reports a 69% composite for any basilar-type symptoms in
      147 FHM patients. It does not give the individual component frequencies in the accessible abstract.
  - reference: PMID:12023326
    reference_title: >-
      A population-based study of familial hemiplegic migraine suggests revised diagnostic criteria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The order of the aura symptoms was usually visual, followed by sensory,
      aphasic, motor and, lastly, basilar-type migraine symptoms.
    explanation: >-
      The Danish FHM cohort reports the usual ordering of aura modalities, with basilar-type symptoms
      last. This supports the discussion of the composite's timing, not a frequency for any particular
      component.
  - reference: PMID:38674378
    reference_title: >-
      Unravelling the Genetic Landscape of Hemiplegic Migraine: Exploring Innovative Strategies and
      Emerging Approaches.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other accompanying features during the attacks may include seizure, fever,
      bilateral visual defects, brainstem aura with vertigo, ataxia,
      hyperacusia, dysarthria, disturbed consciousness, tinnitus, and, in severe
      cases, coma
    explanation: >-
      The later clinical review lists individual manifestations across hemiplegic migraine. It does
      not establish that this enumeration matches the components or denominators of the separate
      Danish FHM composite, and does not provide familial-only component frequencies.
  attaches_to: []
- discussion_id: fhm_residual_clinical_routes
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which routes account for brainstem, cognitive and febrile findings beyond the modeled
    cortical and severe-allele pathways?
  attaches_to:
  - phenotypes#Vertigo During Aura
  - phenotypes#Tinnitus During Aura
  - phenotypes#Dysarthria
  - phenotypes#Diplopia During Aura
  - phenotypes#Hyperacusis During Aura
  - phenotypes#Ataxia During Aura
  - phenotypes#Drowsiness During Attacks
  - phenotypes#Confusion During Attacks
  - phenotypes#Nystagmus
  - phenotypes#Fever During Severe Attacks
  - phenotypes#Intellectual Disability
  - phenotypes#Memory Impairment
  - phenotypes#Learning Disability
  - phenotypes#Nausea
  - phenotypes#Vomiting
  - phenotypes#Photophobia
  - phenotypes#Phonophobia
  rationale: >-
    The reviewed sources establish occurrence or syndrome/allele attribution, but do not resolve
    the particular upstream causal route for these findings. Brainstem localization alone does not
    establish cortical depolarization as the cause of each brainstem manifestation. Nystagmus is
    a cerebellar sign, but the S218L Purkinje firing experiment tests ataxia rather than ocular-motor
    dysfunction. Drowsiness and confusion are not automatically coma, and the severe-allele subcortical-spread
    hypothesis should not be transferred to all altered-awareness symptoms. Developmental disability
    in selected ATP1A2 variants and prolonged memory/learning problems are not all consequences of
    attack injury. Fever lacks a demonstrated thermoregulatory mechanism. The family authors' channel
    hypothesis covers the observed psychotic episodes, including anxiety and visual hallucinations.
    All three have the same provisional, family-scoped channel attribution; their unspecified intermediate
    circuits do not negate that broader hypothesis. These are attribution or translation gaps, not
    missing clinical observations. The reviewed FHM family data establish nausea, vomiting and sensory
    intolerance, but do not identify their autonomic or sensory-integration routes; a nociceptive
    pain mechanism alone does not establish these additional effects. The family authors' cerebellar
    attribution is represented by qualified channel-level links to coordination signs and Romberg
    instability, without asserting a specific balance-control intermediary.
  evidence:
  - reference: PMID:15159495
    reference_title: Variability of familial hemiplegic migraine with novel A1A2 Na+/K+-ATPase
      variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      D718N and P979L may predispose to seizures and mental retardation.
    explanation: >-
      The primary ATP1A2 family study attributes this developmental association to particular variants;
      it is not a general consequence of all FHM alleles.
  - reference: PMID:10202246
    reference_title: Familial hemiplegic migraine with cerebellar ataxia and paroxysmal
      psychosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report on a family with familial hemiplegic migraine and cerebellar ataxia with recurrent
      episodes of acute paranoid psychosis with anxiety and visual hallucinations associated with
      migraine attacks.
    explanation: >-
      The primary family report directly describes these attack-associated psychiatric observations.
      Linkage and phenotype supported a chromosome-19 hypothesis; a specific pathogenic CACNA1A variant
      was not established in this abstract.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1388/
    reference_title: Familial Hemiplegic Migraine - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Accumulating evidence supports the hypothesis that the electrophysiologic correlate underlying
      migraine aura is cortical spreading depolarization (CSD)
    explanation: >-
      GeneReviews presents CSD as the hypothesized electrophysiologic basis of aura. Together with
      its clinical localization of aura to cortex or brainstem, this supports a qualified route to
      cortical motor, sensory, visual and language manifestations; it is not a direct recording during
      human FHM attacks.
    directness: INDIRECT
- discussion_id: fhm_missing_candidate_scope
  kind: INTERPRETATION
  status: OPEN
  prompt: Which additional findings can be assigned specifically to familial hemiplegic
    migraine?
  rationale: >-
    Whole-source review added specific visual/sensory aura, brainstem components, prolonged cognitive
    and psychiatric findings. The R583Q father/daughter primary report directly supports nausea,
    vomiting, photophobia, phonophobia and specific cerebellar examination findings, independently
    of general migraine descriptions or management advice. Its two mutation-negative relatives are
    not counted as molecular FHM1. Pediatric encephalopathy pools mix familial and simplex cases;
    PRRT2 hypersomnia cohorts do not resolve a familial-only clinical denominator. Surveillance for
    developmental delay is advice rather than clinical occurrence. Serum cytokines are exploratory
    readouts and their causal role is a separate hypothesis.
  evidence:
  - reference: PMID:12023326
    reference_title: A population-based study of familial hemiplegic migraine suggests revised
      diagnostic criteria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FHM patients most often had all four 'typical' aura symptoms (visual, sensory, aphasic and
      motor symptoms) and all had at least two of these aura symptoms during FHM attacks.
    explanation: >-
      The primary familial cohort establishes typical aura modalities, but its accessible abstract
      does not quantify the additional associated symptoms.
  attaches_to: []
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
  channelopathy_category:
    classification_value: neurological channelopathy
    notes: >-
      ChannelopathyOrganSystemEnum classifies by affected organ system rather
      than by ion, and all three classical FHM subtypes act on cortical neurons
      and astrocytes, so the single neurological value covers the whole entry.
      The underlying transport lesions are heterogeneous - a calcium channel
      (CACNA1A/Cav2.1, FHM1), a sodium channel (SCN1A/Nav1.1, FHM3), and an ion
      pump rather than a channel (ATP1A2/Na+,K+-ATPase alpha2, FHM2) - so
      "channelopathy" is applied here in its broad ion-transport sense. PRRT2,
      the fourth hemiplegic-migraine gene, is a synaptic protein and is not a
      channelopathy locus at all; see the genetic section.
mappings:
  icd10cm_mappings:
  - term:
      id: ICD10CM:G43.4
      label: Hemiplegic migraine
    mapping_predicate: skos:broadMatch
    mapping_source: ICD10CM
    mapping_justification: semapv:ManualMappingCuration
    notes: >-
      Deliberately a broadMatch. ICD-10-CM G43.4 codes hemiplegic migraine as a
      whole and does not distinguish the familial form from the sporadic form,
      which this entry treats as a separate entity (see differential diagnoses).
      Its children encode intractability and status migrainosus rather than
      family history, so no narrower code corresponds to FHM.
  icd11f_mappings:
  - term:
      id: icd11f:1827007904
      label: Familial hemiplegic migraine
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: semapv:ManualMappingCuration
    notes: >-
      MONDO:0000700 cross-references icd11.foundation:1827007904, whose
      foundation-entity label matches this entry exactly. Unlike the ICD-10-CM
      code, the ICD-11 Foundation does separate the familial form from the
      sporadic one, so this mapping is exact.
mechanistic_hypotheses:
- hypothesis_group_id: cortical_aura
  hypothesis_label: Cortical spreading depolarization and focal aura
  status: CANONICAL
  description: >-
    The leading aura explanation, with indirect translation from model physiology to spontaneous
    human FHM.
- hypothesis_group_id: fhm3_potassium
  hypothesis_label: FHM3 spiking and potassium-mediated CSD initiation
  status: EMERGING
  description: >-
    Genetic L1649Q and acute activation experiments support a route distinct from glutamatergic initiation.
- hypothesis_group_id: csd_headache
  hypothesis_label: CSD-triggered meningeal sensitization
  status: EMERGING
  description: >-
    A proposed link to headache, not an obligatory causal ordering of aura and pain.
- hypothesis_group_id: severe_fhm1_spread
  hypothesis_label: Subcortical spread in severe FHM1
  status: EMERGING
  description: >-
    Allele-scoped mouse explanation for prolonged hemiplegia, coma and seizures, especially S218L.
- hypothesis_group_id: fhm1_cerebellar
  hypothesis_label: FHM1 cerebellar current abnormalities
  status: EMERGING
  description: >-
    Selected FHM1 alleles alter Purkinje firing or contribute to neuronal loss; this does not encompass
    all CACNA1A disorders.
- hypothesis_group_id: familial_psychosis
  hypothesis_label: Calcium-channel attribution of familial psychosis
  status: EMERGING
  description: >-
    An explicit chromosome-19 family hypothesis without a confirmed causal variant or defined psychiatric
    intermediary.
- hypothesis_group_id: fhm2_vasogenic_edema
  hypothesis_label: Case-scoped vasogenic edema
  status: EMERGING
  description: >-
    One severe ATP1A2-FHM attack showed barrier opening preceding edema, interpreted as vasogenic.
- hypothesis_group_id: severe_attack_injury
  hypothesis_label: Severe-attack neuronal injury and acquired cognitive decline
  status: EMERGING
  description: >-
    The childhood regression hypothesis draws on clinical course and juvenile-rat spreading-depression
    injury, not a proven universal developmental mechanism.
- hypothesis_group_id: cytokine_hypothesis
  hypothesis_label: Exploratory neuroimmune contribution in R583Q-FHM
  status: EMERGING
  description: >-
    Two-carrier serum observations motivate possible nociceptive and neurodegenerative cytokine actions.
    Reverse causation and effects shared with ordinary migraine remain unresolved.

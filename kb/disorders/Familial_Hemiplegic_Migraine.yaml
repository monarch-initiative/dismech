discussions:
- discussion_id: gap_fhm_shared_csd_convergence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do the three FHM genes lower the cortical spreading depression threshold
    through one shared final mechanism, or through separate routes that happen
    to converge on the same clinical outcome?
  attaches_to:
  - pathophysiology#Reduced Cortical Spreading Depression Threshold
  - pathophysiology#Increased Cortical Glutamatergic Excitability
  - pathophysiology#GABAergic Interneuron Hyperactivity and Extracellular Potassium Accumulation
  rationale: >-
    The convenient summary of FHM is that all three ion-transport defects raise
    cortical glutamatergic excitability and so lower the CSD threshold. FHM1 and
    FHM2 do fit that account - increased presynaptic Ca2+ influx and glutamate
    release in one case, impaired astrocytic glutamate and K+ clearance in the
    other. FHM3 does not. Nav1.1 is the principal sodium channel of GABAergic
    interneurons, and the experiment that established the FHM3 mechanism found
    that CSD could be ignited by interneuron hyperactivity through
    spiking-generated extracellular K+ build-up with neither GABAergic nor
    glutamatergic synaptic transmission required. Extracellular K+ accumulation
    is therefore a candidate common currency that would unify all three arms,
    but that unification has not been demonstrated: no study has measured the
    same threshold-setting variable across FHM1, FHM2 and FHM3 models under
    comparable conditions. This entry curates FHM3 as a parallel arm rather than
    folding it into the glutamatergic node, because asserting a single
    glutamate-mediated convergence would overstate what the evidence shows.
  proposed_experiments:
  - experiment_id: exp_fhm_cross_subtype_csd_threshold
    name: Cross-subtype comparison of CSD threshold determinants
    description: >-
      Measure CSD threshold together with extracellular K+ and glutamate
      transients in FHM1 (CACNA1A), FHM2 (ATP1A2) and FHM3 (SCN1A) knock-in
      cortex under one protocol, then test whether blocking glutamatergic
      transmission or buffering extracellular K+ abolishes the threshold shift
      in each. A K+ manipulation that rescues all three, where glutamatergic
      blockade rescues only FHM1 and FHM2, would establish extracellular K+ as
      the shared final common path rather than glutamate.
- discussion_id: mismatch_fhm_csd_human_attack
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the reduced cortical spreading depression threshold measured in FHM
    knock-in mice actually explain the hemiparetic aura of a human FHM attack?
  attaches_to:
  - pathophysiology#Reduced Cortical Spreading Depression Threshold
  - pathophysiology#Reversible Hemiparetic Aura
  rationale: >-
    The central mechanistic claim of this entry - that FHM variants lower the
    CSD threshold - rests on transgenic mouse data. The CSD-threshold node is
    supported entirely by MODEL_ORGANISM evidence, and the step from that
    threshold to the reversible motor weakness seen in patients is inferred
    rather than measured: CSD has not been recorded directly during a
    spontaneous human FHM attack, and the human evidence is indirect
    (aura semiology, imaging correlates, and the clinical genetics). The
    mismatch is mechanistically meaningful because mouse CSD threshold is
    assayed with an experimental stimulus applied to anaesthetised cortex,
    which measures susceptibility to provoked CSD rather than whatever
    initiates a spontaneous attack, and because the motor cortex representation
    that would have to be traversed to produce hemiparesis differs
    substantially between the lissencephalic mouse and the human brain. It is
    recorded as a HUMAN_MODEL_MISMATCH rather than a KNOWLEDGE_GAP because the
    model evidence is strong and reproducible; what is open is its
    translational validity, not its existence.

    The structural counterpart of this discussion is in animal_models: the
    R192Q, S218L and W887R knock-in links all carry the anaesthetised-cortex
    and species caveats in their limitations, and the FHM2 W887R model records
    a FAILS_TO_RECAPITULATE link against Reversible Hemiparetic Aura - the
    heterozygous mutant has the cortical CSD phenotype and no apparent clinical
    phenotype. That negative result is the sharpest form of the mismatch: the
    one model in which the threshold change and the clinical attack could have
    been observed together shows only the former.
  proposed_experiments:
  - experiment_id: exp_fhm_human_csd_correlate
    name: Non-invasive detection of a CSD correlate during a human FHM attack
    description: >-
      Capture spontaneous or provoked attacks in genotyped FHM patients using
      serial perfusion and diffusion MRI or MEG timed to aura onset, and test
      whether a propagating wavefront traverses the motor cortex with the
      timing and direction predicted by CSD, and whether its speed and
      threshold differ between FHM1, FHM2 and FHM3 carriers as the mouse models
      predict.
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
  channelopathy_category:
    classification_value: neurological channelopathy
    notes: >-
      ChannelopathyOrganSystemEnum classifies by affected organ system rather
      than by ion, and all three classical FHM subtypes act on cortical neurons
      and astrocytes, so the single neurological value covers the whole entry.
      The underlying transport lesions are heterogeneous - a calcium channel
      (CACNA1A/Cav2.1, FHM1), a sodium channel (SCN1A/Nav1.1, FHM3), and an ion
      pump rather than a channel (ATP1A2/Na+,K+-ATPase alpha2, FHM2) - so
      "channelopathy" is applied here in its broad ion-transport sense. PRRT2,
      the fourth hemiplegic-migraine gene, is a synaptic protein and is not a
      channelopathy locus at all; see the genetic section.
mappings:
  icd10cm_mappings:
  - term:
      id: ICD10CM:G43.4
      label: Hemiplegic migraine
    mapping_predicate: skos:broadMatch
    mapping_source: ICD10CM
    mapping_justification: semapv:ManualMappingCuration
    notes: >-
      Deliberately a broadMatch. ICD-10-CM G43.4 codes hemiplegic migraine as a
      whole and does not distinguish the familial form from the sporadic form,
      which this entry treats as a separate entity (see differential diagnoses).
      Its children encode intractability and status migrainosus rather than
      family history, so no narrower code corresponds to FHM.

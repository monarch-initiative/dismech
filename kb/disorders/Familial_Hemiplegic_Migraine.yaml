    reference_title: "Hemiplegic Migraine: An Imitator of Cerebrovascular Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute management focuses on pain control using nonsteroidal
      anti-inflammatory drugs (NSAIDs) and non-narcotic analgesics.
    explanation: >-
      States the acute-phase management approach. This is a narrative review

    reference_title: >-
      Mutation in the neuronal voltage-gated sodium channel SCN1A in familial hemiplegic migraine.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Whole-cell recordings in transiently transfected tsA201 cells expressing
      the highly homologous SCN5A sodium channel showed that the mutation
      induces a two-fold to four-fold accelerated recovery from fast
      inactivation without altering any of the other channel parameters
      investigated.
    explanation: >-
      The original functional characterization of the FHM3 Q1489K variant as an
      inactivation-kinetics gain of function. Note the recordings were made in
      a homologous surrogate channel (SCN5A), not Nav1.1 itself.
  - reference: PMID:34491914
    reference_title: >-
      Initiation of migraine-related cortical spreading depolarization by hyperactivity of GABAergic
      neurons and NaV1.1 channels.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We and others have provided evidence that, in contrast to epileptogenic
      mutations, FHM3 mutations cause gain of function of the channel, often
      increasing persistent current and inducing hyperexcitability of
      transfected GABAergic neurons in primary culture
    explanation: >-
      Confirms the gain-of-function direction across FHM3 alleles and places the
      effect in GABAergic neurons, contrasting it with epileptogenic SCN1A loss
      of function.
  - reference: PMID:34546973
    reference_title: Hyperexcitable interneurons trigger cortical spreading depression in an
      Scn1a migraine model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found L1649Q to cause a gain-of-function effect with an impaired Na+-channel inactivation
      and increased ramp Na+ currents leading to hyperactivity of fast-spiking inhibitory interneurons.
    explanation: >-
      Recordings from neurons of the L1649Q knock-in establish the FHM-specific channel-to-interneuron

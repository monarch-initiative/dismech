- name: Reversible Hemiparetic Aura
  biological_scale: ORGANISM
  description: >-
    The defining clinical expression of the mechanism. Cortical spreading
    depression through motor cortex and adjacent areas produces fully reversible
    motor weakness, obligatorily accompanied by at least one of visual, sensory
    or language aura. Deficits typically last under 72 hours but may persist for
    hours to days and outlast the headache. Onset is usually in the first or
    second decade and attack frequency decreases with age.

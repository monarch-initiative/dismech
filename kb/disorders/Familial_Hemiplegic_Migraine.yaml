- name: Impaired Astrocytic Glutamate and Potassium Clearance
  biological_scale: CELLULAR
  description: >-
    The FHM2-specific step. The astrocytic alpha2 Na+/K+ pump sustains the Na+
    electrochemical gradient that drives Na+-coupled glutamate transporters and
    contributes to extracellular K+ buffering. Reduced pump activity is proposed
    to make glutamate clearance from the synaptic cleft inefficient, raising
    cortical excitatory neurotransmission. This is explicitly a hypothesis in
    the source knock-in study rather than a directly measured clearance deficit,
    and is curated at that strength.

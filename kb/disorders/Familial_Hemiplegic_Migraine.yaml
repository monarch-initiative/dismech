clinical_trials:
- name: NCT00541736
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    Glyceryl trinitrate (GTN) provocation in genotyped FHM patients and healthy
    volunteers, 30 participants, completed 2008. A mechanistic study, not a
    treatment trial: GTN reliably provokes migraine in ordinary migraine
    sufferers, so the question was whether an FHM gene defect changes that
    response. It is recorded here because it is one of only two registered
    interventional studies in this disorder, and because a negative or divergent
    provocation response bears on the entry's mechanism.
  target_phenotypes:
  - preferred_term: Headache
    term:
      id: HP:0002315
      label: Headache
  - preferred_term: Migraine with aura
    term:
      id: HP:0002077
      label: Migraine with aura
  evidence:
  - reference: clinicaltrials:NCT00541736
    reference_title: >-
      Glyceryl-Trinitrate-Induced Headache in Patients With Familial Hemiplegic
      Migraine
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The aim of the present study is to explore the importance of migraine
      genes on the headache/migraine responses after GTN in FHM-patients and
      healthy volunteers.
    explanation: >-
      The registered aim, which establishes this as a gene-directed provocation
      study rather than a therapeutic trial.
  notes: >-
    Phase is NOT_APPLICABLE because the registry records the study as
    interventional with phase NA - a human provocation paradigm does not carry
    an FDA phase. No results are curated: the registry entry has no posted
    results and no linked publication was verified for this identifier, so
    nothing is asserted about the outcome.
- name: NCT00358839
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-

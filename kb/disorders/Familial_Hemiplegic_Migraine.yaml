    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agents/circumstances to avoid: Vasoconstricting agents because of the risk
      of stroke; cerebral angiography as it may precipitate a severe attack.
    explanation: >-
      The GeneReviews Agents/Circumstances to Avoid section, recorded verbatim
      because it is a safety constraint.
  - reference: PMID:41552155
    reference_title: "Hemiplegic Migraine: An Imitator of Cerebrovascular Disease."
    supports: SUPPORT

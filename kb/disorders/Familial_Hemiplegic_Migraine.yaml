- name: PRRT2
  gene_term:
    preferred_term: PRRT2
    term:
      id: hgnc:30500
      label: PRRT2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    A fourth autosomal dominant hemiplegic-migraine gene, recognized more
    recently than CACNA1A/ATP1A2/SCN1A and included in the GeneReviews molecular
    diagnostic criteria. PRRT2 encodes a synaptic protein rather than an ion
    transporter, and the same loss-of-function variants also cause paroxysmal
    kinesigenic dyskinesia, benign familial infantile epilepsy and other
    phenotypes. It is deliberately not curated as a numbered FHM subtype: the
    FHM4 designation (OMIM %607516 / MONDO:0800335) names a gene-less mapped
    locus rather than PRRT2, and the PRRT2 mechanism is not the ion-transport
    defect that unifies FHM1-3. See the entry notes for the full rationale.

    No PRRT2 pathophysiology node is curated. The variants are loss of function
    and the gene product is a synaptic protein, but the authors state explicitly
    that how PRRT2 loss produces hemiplegic migraine is not understood, so
    connecting it to the cortical spreading depression chain would be an
    inference the literature does not yet support.
  frequency: >-
    17% of pathogenic variants in a cohort of 697 consecutively screened
    hemiplegic-migraine probands

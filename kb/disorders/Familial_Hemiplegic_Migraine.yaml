      reference_title: Defective glutamate and K+ clearance by cortical astrocytes in familial
        hemiplegic migraine type 2.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here, we show reduced rates of glutamate and K(+) clearance by cortical astrocytes during
        neuronal activity and reduced density of GLT-1a glutamate transporters in cortical perisynaptic

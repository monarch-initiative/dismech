    reference_title: >-
      Initiation of migraine-related cortical spreading depolarization by
      hyperactivity of GABAergic neurons and NaV1.1 channels.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we show that acute pharmacological activation of NaV1.1 (the main
      Na+ channel of interneurons) or optogenetic-induced hyperactivity of
      GABAergic interneurons is sufficient to ignite CSD in the neocortex by
      spiking-generated extracellular K+ build-up. Neither GABAergic nor

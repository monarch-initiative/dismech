- name: Avoidance of Vasoconstricting Agents and Cerebral Angiography
  description: >-
    A management constraint rather than an intervention. GeneReviews lists
    vasoconstricting agents (which includes the triptans and ergots used in
    ordinary migraine) as agents to avoid because of stroke risk, and cerebral
    angiography as a circumstance to avoid because it may precipitate a severe
    attack. This is the main way FHM management diverges from typical migraine
    with aura.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747

- name: GABAergic Interneuron Hyperactivity and Extracellular Potassium Accumulation
  biological_scale: CELLULAR
  description: >-
    The FHM3-specific step, and a deliberate departure from the shared
    glutamatergic route. Because Nav1.1 is the main sodium channel of
    interneurons, FHM3 gain of function makes GABAergic neurons hyperexcitable.
    Pharmacological Nav1.1 enhancement or optogenetic activation of GABAergic
    interneurons is sufficient to ignite cortical spreading depression through
    spiking-generated extracellular K+ build-up, and neither GABAergic nor
    glutamatergic synaptic transmission is required for that initiation. The
    effect is neocortex-specific.

- name: Increased Cortical Glutamatergic Excitability
  biological_scale: CELLULAR
  description: >-
    The convergence point of the FHM1 and FHM2 arms. Increased presynaptic Ca2+
    influx (FHM1) and reduced astrocytic reuptake (FHM2) both raise glutamate
    concentration at cortical excitatory synapses, disrupting the
    excitation-inhibition balance in favour of neuronal hyperactivity. In FHM1
    mice the effect is synapse-specific: excitatory neurotransmission at
    pyramidal cell synapses is enhanced while inhibitory neurotransmission at
    fast-spiking interneuron synapses is unaltered.
  biological_processes:
  - preferred_term: glutamatergic synaptic transmission
    term:
      id: GO:0035249
      label: synaptic transmission, glutamatergic
    modifier: INCREASED
  molecular_functions: []

        id: CHEBI:6078
        label: ivermectin
  evidence:
  - reference: PMID:16714198
    reference_title: "Onchocerciasis--river blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ivermectin is, at present, the drug of choice for skin and ocular manifestations."
    explanation: The abstract identifies ivermectin as the drug of choice.
- name: Moxidectin therapy
  description: >-
    Moxidectin is an FDA-approved macrocyclic lactone for onchocerciasis treatment in
    individuals aged 12 years and older (8 mg single oral dose, approved 2018), offering
    an alternative to ivermectin with a more sustained microfilaricidal effect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: moxidectin
      term:
        id: NCIT:C73264

    reference_title: "Safety and Short-term Efficacy of a Single Dose of 2 mg Moxidectin in Loa loa-Infected Individuals"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 2018, the US Food and Drug Administration approved the macrocylic lactone moxidectin (MOX) at 8 mg dosage for onchocerciasis treatment in individuals aged ≥12 years."
    explanation: Documents FDA approval of moxidectin 8 mg for onchocerciasis treatment in 2018.
- name: Doxycycline (anti-Wolbachia therapy)
  description: >-
    A 6-week course of doxycycline 100 mg/day targets the obligate Wolbachia
    endosymbionts of Onchocerca volvulus. Wolbachia depletion is macrofilaricidal
    (sterilizes adult females) and reduces filarial load and ocular disease progression.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  evidence:
  - reference: PMID:16714198
    reference_title: "Onchocerciasis--river blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "100 mg/d of doxycycline for 6 weeks might be effective in reducing the filarial load and preventing ocular symptoms"
    explanation: Describes anti-Wolbachia effect of doxycycline in reducing filarial load and preventing ocular disease progression.
  target_mechanisms:
  - target: Wolbachia Endosymbiont-Driven Filarial Pathogenesis
    treatment_effect: INHIBITS
    description: Doxycycline depletes the obligate Wolbachia endosymbionts, which is macrofilaricidal and reduces filarial load and progression of ocular disease.

treatments:
- name: Ivermectin therapy
  description: >-
    Ivermectin (a macrocyclic lactone) is the drug of choice for skin and ocular
    manifestations of onchocerciasis. It kills microfilariae and is used in mass
    drug administration programs for disease control and elimination.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:

pathophysiology:
- name: Microfilarial Skin and Ocular Infiltration
  description: >-
    Onchocerca volvulus microfilariae migrate from subcutaneous nodules into the skin
    and anterior chamber of the eye. Their accumulation and death trigger host
    inflammatory responses causing dermatitis, hypopigmentation, and progressive
    ocular disease that can advance to blindness.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:16714198
    reference_title: "Onchocerciasis--river blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Onchocercal ocular disease covers a large spectrum of manifestations, which in severe cases, may lead to blindness."
    explanation: Microfilarial invasion of ocular tissue underlies the spectrum of onchocercal ocular disease progressing to blindness.
  downstream:
  - target: Dermatitis
    description: Microfilarial migration into the skin and the inflammatory response to dying microfilariae produce onchocercal dermatitis.
  - target: Pruritus
    description: The inflammatory reaction to microfilariae in the skin drives the severe itching characteristic of onchocerciasis.
  - target: Skin Hypopigmentation
    description: Chronic microfilaria-driven dermatitis leads to depigmentation ("leopard skin") changes.
  - target: Keratitis
    description: Microfilarial invasion of the cornea provokes inflammatory (sclerosing) keratitis.
  - target: Chorioretinitis
    description: Microfilarial invasion and death within the choroid and retina provoke posterior-segment inflammation (chorioretinitis).
  - target: Blindness
    description: Progressive ocular inflammation from microfilarial infiltration culminates in visual loss (river blindness).
  - target: Onchocercal Lymphadenitis and Lymphatic Fibrosis
    description: The chronic effects of onchocerciasis, including lymphadenitis, follow from ongoing microfilarial degeneration rather than from adult-worm encapsulation.
- name: Wolbachia Endosymbiont-Driven Filarial Pathogenesis
  description: >-
    Onchocerca volvulus harbors obligate Wolbachia endosymbionts that support filarial
    survival and reproduction and contribute to the severity of host inflammatory
    pathology. Targeting Wolbachia with doxycycline depletes adult worms and reduces
    progression of ocular disease.
  evidence:
  - reference: PMID:16714198
    reference_title: "Onchocerciasis--river blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "chemotherapeutic approach that targets filarial Wolbachia symbionts in the treatment and control of onchocerciasis, however, suggests that 100 mg/d of doxycycline for 6 weeks might be effective in reducing the filarial load and preventing ocular symptoms"
    explanation: Wolbachia endosymbionts are identified as a treatment target; doxycycline depletion reduces filarial load and prevents ocular symptoms.
  downstream:
  - target: Keratitis
    description: Wolbachia endosymbiont products amplify the corneal inflammatory response that drives sclerosing keratitis.
  - target: Chorioretinitis
    description: Wolbachia-driven inflammatory pathology contributes to posterior-segment chorioretinitis.
  - target: Blindness
    description: Wolbachia-driven inflammatory pathology contributes to progression of onchocercal ocular disease toward blindness.
- name: Adult Worm Encapsulation in Subcutaneous Nodules
  biological_scale: TISSUE
  description: >-
    Adult Onchocerca volvulus worms coil and become encapsulated by host fibrous
    tissue in subcutaneous nodules (onchocercomata).
  locations:
  - preferred_term: subcutaneous tissue
    term:
      id: UBERON:0002072
      label: hypodermis
  evidence:
  - reference: PMID:4070919
    reference_title: "Pathologic changes of human onchocerciasis: implications for future research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subcutaneous nodules contain coiled adult worms and have an outer layer of fibrous scar and a central inflammatory cell exudate, which may cavitate."
    explanation: Pathology review describes adult-worm encapsulation forming the fibrous subcutaneous nodule (onchocercoma).
  downstream:
  - target: Onchocercomata (Subcutaneous Nodules)
    description: Encapsulation of coiled adult worms in an outer layer of fibrous scar forms the palpable subcutaneous nodule.
- name: Onchocercal Lymphadenitis and Lymphatic Fibrosis
  biological_scale: TISSUE
  description: >-
    Draining lymph nodes respond to microfilaria-driven chronic inflammation with
    histiocytic hyperplasia and follicular atrophy, progressing to fibrosis that
    obstructs lymph flow.
  locations:
  - preferred_term: lymph node
    term:
      id: UBERON:0000029
      label: lymph node
  evidence:
  - reference: PMID:4070919
    reference_title: "Pathologic changes of human onchocerciasis: implications for future research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Onchocercal lymphadenitis is characterized initially by histiocytic hyperplasia and follicular atrophy and later by fibrosis and obstruction of lymph flow, a condition causing adenolymphocele (\"hanging groin\") and elephantiasis of the genitalia."
    explanation: Pathology review describes progressive lymph node fibrosis and lymphatic obstruction culminating in the adenolymphocele ("hanging groin") deformity.
  downstream:
  - target: Hanging Groin
    description: Progressive lymphatic fibrosis and obstruction of lymph flow produces adenolymphocele ("hanging groin") and genital elephantiasis.

  measure_type: CASES_IN_LITERATURE
  notes: >-
    146 FLD and 53 FED patients identified from 219 publications; a second systematic
    review counted 215 cases (154 FLD, 41 FED, 20 unclassified) from 33 ethnic groups.
    No population-based prevalence is available.
  evidence:
  - reference: PMID:35065092
    reference_title: "A systematic review of the natural history and biomarkers of primary lecithin:cholesterol acyltransferase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "We identified 146 FLD and 53 FED patients from 219 publications, showing that both syndromes are characterized by early corneal opacity and markedly reduced HDL-C levels."
    explanation: Case count in the largest systematic review.
  - reference: PMID:34256778
    reference_title: "LCAT deficiency: a systematic review with the clinical and genetic description of Mexican kindred."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

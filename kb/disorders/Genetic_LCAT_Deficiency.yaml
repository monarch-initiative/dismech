    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygosity for LCAT mutations underlies rare disorders characterized by HDL-cholesterol (HDL-c) deficiency while heterozygotes have half normal HDL-c levels."

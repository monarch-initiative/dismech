genetic:
- name: LCAT
  gene_term:
    preferred_term: LCAT
    term:
      id: hgnc:6522
      label: LCAT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    CAUSATIVE rests on about 200 published patients from many unrelated families with
    biallelic loss-of-function variants confirmed in expression assays. Whether a
    patient has FLD or FED depends on whether the alleles abolish activity on
    apoB-containing lipoproteins as well as on HDL; compound heterozygotes can be
    intermediate. Heterozygotes have about half-normal HDL cholesterol, and LCAT
    variants were found in 29% of Dutch patients referred with low HDL cholesterol.
    ClinGen has not curated LCAT.
  evidence:
  - reference: PMID:35065092
    reference_title: "A systematic review of the natural history and biomarkers of primary lecithin:cholesterol acyltransferase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "We identified 146 FLD and 53 FED patients from 219 publications, showing that both syndromes are characterized by early corneal opacity and markedly reduced HDL-C levels."
    explanation: Size of the patient literature.

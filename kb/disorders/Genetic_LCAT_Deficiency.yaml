    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The complete loss of cholesterol esterification impairs the removal of UC from the membrane of erythrocytes, thus causing increased fragility and hemolytic anemia"
    explanation: Review synthesis of the red cell mechanism.
  - reference: PMID:11278414
    reference_title: "Analysis of glomerulosclerosis and atherosclerosis in lecithin cholesterol acyltransferase-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "LCAT-KO mice had normochromic normocytic anemia with increased reticulocyte and target cell counts as well as decreased red blood cell osmotic fragility."
    explanation: Red cell phenotype in the knockout mouse.
  downstream:

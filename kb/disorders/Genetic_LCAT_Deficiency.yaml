    reference_title: "High prevalence of mutations in LCAT in patients with low HDL cholesterol levels in The Netherlands: identification and characterization of eight novel mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike previous reports, functional mutations in LCAT were found in 29% of patients with low HDL-c, thus constituting a common cause of low HDL-c in referred patients in The Netherlands."
    explanation: Heterozygous LCAT variants are common among referred low-HDL patients.
  variants:
  - name: p.Pro274Ser (c.820C>T)
    description: Homozygous in a large kindred with FLD and kidney disease; abolishes LCAT activity.
    evidence:
    - reference: PMID:31103331
      reference_title: "The P274S Mutation of Lecithin-Cholesterol Acyltransferase (LCAT) and Its Clinical Manifestations in a Large Kindred."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Homozygosity caused a complete loss of LCAT activity."
      explanation: Effect of the homozygous variant.
  - name: p.Gly71Arg and p.Arg140His

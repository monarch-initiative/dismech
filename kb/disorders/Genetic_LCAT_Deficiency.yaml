pathophysiology:
- name: LCAT Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic LCAT variants reduce the transfer of an acyl chain from
    phosphatidylcholine to cholesterol on plasma lipoproteins. FLD alleles abolish
    activity on both HDL and apoB-containing lipoproteins, whereas FED alleles abolish
    activity on HDL only; the phenotype depends on the position of the variant.
  genes:
  - preferred_term: LCAT
    term:
      id: hgnc:6522
      label: LCAT
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: Biallelic (homozygous or compound heterozygous) germline LCAT variants.
  molecular_functions:
  - preferred_term: lecithin:cholesterol acyltransferase activity
    term:
      id: GO:0004607
      label: phosphatidylcholine-sterol O-acyltransferase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:33867422
    reference_title: "Current Status of Familial LCAT Deficiency in Japan."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Lecithin cholesterol acyltransferase (LCAT) is a lipid-modification enzyme that catalyzes the transfer of the acyl chain from the second position of lecithin to the hydroxyl group of cholesterol (FC) on plasma lipoproteins to form cholesteryl acylester and lysolecithin."
    explanation: The enzyme's normal activity.
  - reference: PMID:33867422
    reference_title: "Current Status of Familial LCAT Deficiency in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The disease appears in two different phenotypes depending on the position of the gene mutation: familial LCAT deficiency (FLD, OMIM 245900) that lacks esterification activity on both HDL and ApoB-containing lipoproteins, and fish-eye disease (FED, OMIM 136120) that lacks activity only on HDL."
    explanation: The two forms differ in which lipoprotein substrates lose esterification.
  - reference: PMID:21901787
    reference_title: "High prevalence of mutations in LCAT in patients with low HDL cholesterol levels in The Netherlands: identification and characterization of eight novel mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All previously identified mutations are documented to cause loss of catalytic activity."
    explanation: Disease alleles are loss-of-function in functional assays.
  - reference: PMID:16216249
    reference_title: "Compound heterozygosity (G71R/R140H) in the lecithin:cholesterol acyltransferase (LCAT) gene results in an intermediate phenotype between LCAT-deficiency and fish-eye disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Determination of enzyme activities of recombinant LCAT proteins obtained upon transfection of COS-7 cells with plasmids containing G71R-LCAT or wild-type LCAT cDNA revealed very low alpha- and absence of beta-LCAT activity for the G71R mutant."
    explanation: Expressed patient allele with separately measured alpha- and beta-LCAT activity.
  downstream:
  - target: Impaired HDL Maturation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21901787
      reference_title: "High prevalence of mutations in LCAT in patients with low HDL cholesterol levels in The Netherlands: identification and characterization of eight novel mutations."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "Lecithin:cholesterol acyltransferase (LCAT) is crucial to the maturation of high-density lipoprotein (HDL)."
      explanation: LCAT is required for HDL maturation.
  - target: Lipoprotein X Accumulation
    description: Requires the complete loss of esterification seen in FLD.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37627492
      reference_title: "Abnormal Lipoproteins Trigger Oxidative Stress-Mediated Apoptosis of Renal Cells in LCAT Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "LCAT deficiency is characterized by an abnormal lipoprotein profile with severe reduction in plasma levels of high-density lipoprotein (HDL) cholesterol and the accumulation of lipoprotein X (LpX)."
      explanation: Lipoprotein X accumulates in LCAT deficiency.
  - target: Erythrocyte Membrane Cholesterol Excess
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:35065092
      reference_title: "A systematic review of the natural history and biomarkers of primary lecithin:cholesterol acyltransferase deficiency."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The complete loss of cholesterol esterification impairs the removal of UC from the membrane of erythrocytes, thus causing increased fragility and hemolytic anemia"
      explanation: Proposed mechanism of the anaemia.
- name: Impaired HDL Maturation
  biological_scale: MOLECULAR
  description: >-
    Without cholesterol esterification, discoidal pre-beta HDL is not converted to
    spherical alpha-HDL, so HDL particles stay small and HDL cholesterol is markedly
    reduced. Infused recombinant LCAT converts the small particles to mature alpha-HDL
    within hours.
  biological_processes:
  - preferred_term: HDL particle remodeling
    term:
      id: GO:0034375
      label: high-density lipoprotein particle remodeling
    modifier: DECREASED
  chemical_entities:
  - preferred_term: HDL cholesterol
    term:
      id: CHEBI:47775
      label: high-density lipoprotein cholesterol
    modifier: DECREASED
  evidence:
  - reference: PMID:4061122
    reference_title: "Evidence for deficiency of high density lipoprotein lecithin: cholesterol acyltransferase activity (alpha-LCAT) in fish eye disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Almost all free cholesterol of these HDL fractions became esterified and concomitantly the abnormally small fish eye disease HDL particles increased to a size in the range of that of normal HDL particles."
    explanation: Patient HDL matures when normal LCAT is supplied.
  - reference: PMID:27055967
    reference_title: "Familial lecithin:cholesterol acyltransferase deficiency: First-in-human treatment with enzyme replacement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After infusion, HDL-C rapidly increased, peaking near normal in 8 to 12 hours; analysis of HDL particles by various methods all revealed rapid sequential disappearance of preβ-HDL and small α-4 HDL and appearance of normal α-HDL."
    explanation: Recombinant LCAT matures HDL in a patient.
  downstream:
  - target: Decreased HDL cholesterol concentration
    causal_link_type: DIRECT
  - target: Corneal Lipid Deposition
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Lipoprotein X Accumulation
  biological_scale: MOLECULAR
  subtypes:
  - FLD
  description: >-
    In complete deficiency an abnormal multilamellar lipoprotein rich in unesterified
    cholesterol and phospholipid (lipoprotein X) accumulates in plasma. High plasma
    unesterified cholesterol predicts rapid loss of kidney function.
  evidence:
  - reference: PMID:26919698
    reference_title: "Lipoprotein X Causes Renal Disease in LCAT Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Human familial lecithin:cholesterol acyltransferase (LCAT) deficiency (FLD) is characterized by low HDL, accumulation of an abnormal cholesterol-rich multilamellar particle called lipoprotein-X (LpX) in plasma, and renal disease."
    explanation: Lipoprotein X is a defining feature of FLD.
  - reference: PMID:32998975
    reference_title: "Progression of chronic kidney disease in familial LCAT deficiency: a follow-up of the Italian cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, we identify high plasma unesterified cholesterol level as a predicting factor for rapid deterioration of kidney function."
    explanation: Unesterified cholesterol predicts kidney decline in a long-term cohort.
  downstream:
  - target: LCAT Nephropathy
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26919698
      reference_title: "Lipoprotein X Causes Renal Disease in LCAT Deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In conclusion, LpX is a nephrotoxic particle that in the absence of Lcat induces all of the histological and functional hallmarks of FLD and hence may serve as a biomarker for monitoring recombinant LCAT therapy."
      explanation: Administered lipoprotein X reproduces the FLD kidney lesion in Lcat-deficient mice.
    - reference: PMID:37627492
      reference_title: "Abnormal Lipoproteins Trigger Oxidative Stress-Mediated Apoptosis of Renal Cells in LCAT Deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Both LpX and HDL from LCAT-deficient carriers triggered oxidative stress in renal cells, which culminated in cell apoptosis."
      explanation: Patient lipoproteins injure podocytes and tubular cells in culture.
- name: Corneal Lipid Deposition
  biological_scale: TISSUE
  description: >-
    Unesterified cholesterol deposits in the cornea, producing diffuse corneal opacity
    that is often the first recognised sign and is found in both syndromes.
  evidence:
  - reference: PMID:35065092
    reference_title: "A systematic review of the natural history and biomarkers of primary lecithin:cholesterol acyltransferase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Both are characterized by very low levels of HDL-C and corneal opacities because of deposition of unesterified cholesterol (UC) in the cornea."
    explanation: The basis of the corneal opacity.
  - reference: PMID:3141686
    reference_title: "Familial LCAT deficiency and fish-eye disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Proteinuria and anaemia are common and there is marked corneal lipid deposition."
    explanation: Corneal lipid deposition in familial LCAT deficiency.
  downstream:
  - target: Corneal opacity
    causal_link_type: DIRECT
- name: LCAT Nephropathy
  biological_scale: TISSUE
  subtypes:
  - FLD
  description: >-
    Lipid deposition in glomeruli with basement membrane thickening, mesangial
    expansion and foam-cell infiltration; proteinuria and hematuria come first,
    followed by declining filtration. Tubular atrophy, glomerular sclerosis and
    complement fixation predict worse outcome, and the lesion recurs in most
    transplanted kidneys.
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  - preferred_term: mesangial cell
    term:
      id: CL:0000650
      label: mesangial cell
  evidence:
  - reference: PMID:31103331
    reference_title: "The P274S Mutation of Lecithin-Cholesterol Acyltransferase (LCAT) and Its Clinical Manifestations in a Large Kindred."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Kidney biopsy findings demonstrated lipid deposition causing glomerular basement membrane thickening, mesangial expansion, and \"foam-cell\" infiltration of kidney tissue."
    explanation: Kidney histology in an FLD kindred.
  - reference: PMID:35065092
    reference_title: "A systematic review of the natural history and biomarkers of primary lecithin:cholesterol acyltransferase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Proteinuria/hematuria were the first signs of renal impairment in FLD, followed by rapid decline of renal function."
    explanation: Course of the kidney disease.
  - reference: PMID:32618730
    reference_title: "Genetic, biochemical, and clinical features of LCAT deficiency: update for 2020."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Clinical manifestations of the disease include corneal opacification, anemia, and renal disease, which represents the major cause of morbidity and mortality in carriers."
    explanation: Kidney disease is the main cause of morbidity and mortality.
  downstream:
  - target: Proteinuria
    causal_link_type: DIRECT
  - target: Hematuria
    causal_link_type: DIRECT
  - target: Glomerular sclerosis
    causal_link_type: DIRECT
  - target: Chronic kidney disease
    causal_link_type: DIRECT
  - target: Stage 5 chronic kidney disease
    causal_link_type: DIRECT
- name: Erythrocyte Membrane Cholesterol Excess
  biological_scale: CELLULAR
  description: >-
    Without plasma esterification, unesterified cholesterol is not cleared from red
    cell membranes, which become fragile; the mouse knockout shows anaemia with

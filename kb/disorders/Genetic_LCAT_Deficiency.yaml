    quote_role: REVIEW_SYNTHESIS
    snippet: "Genetic lecithin:cholesterol acyltransferase (LCAT) deficiency is a rare, inherited, recessive disease, which manifests as two different syndromes: Familial LCAT deficiency (FLD) and Fish-eye disease (FED), characterized by low HDL-C and corneal opacity."
    explanation: Recessive inheritance of one disease with two syndromes.
  - reference: PMID:21901787

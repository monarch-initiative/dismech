animal_models:
- name: Lcat knockout mouse
  species: Mouse
  genotype: Lcat -/-
  publication: PMID:11278414
  description: >-
    Knockout mice have very low HDL, anaemia with target cells and reticulocytosis, and
    in one study a subset developed lipoprotein X, proteinuria and glomerulosclerosis;
    another colony had little endogenous lipoprotein X and no spontaneous kidney
    disease until lipoprotein X was administered. Aortic atherosclerosis is reduced,
    not increased.
  modeled_mechanisms:
  - target: Erythrocyte Membrane Cholesterol Excess
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Reproduces the red cell phenotype and anaemia.
    evidence:
    - reference: PMID:11278414
      reference_title: "Analysis of glomerulosclerosis and atherosclerosis in lecithin cholesterol acyltransferase-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "LCAT-KO mice had normochromic normocytic anemia with increased reticulocyte and target cell counts as well as decreased red blood cell osmotic fragility."
      explanation: Red cell phenotype in the knockout.
  - target: LCAT Nephropathy
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Kidney disease develops in only a subset of knockout mice, or only after
      lipoprotein X is given.
    limitations: >-
      Mice make little lipoprotein X on their own, so the human kidney lesion is
      reproduced inconsistently; the model shows that lipoprotein X is sufficient to
      cause it rather than how often it arises.
    evidence:
    - reference: PMID:11278414
      reference_title: "Analysis of glomerulosclerosis and atherosclerosis in lecithin cholesterol acyltransferase-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A subset of LCAT-KO mice accumulated lipoprotein X and developed proteinuria and glomerulosclerosis characterized by mesangial cell proliferation, sclerosis, lipid accumulation, and deposition of electron dense material throughout the glomeruli."
      explanation: Kidney disease in a subset of knockout mice.
    - reference: PMID:26919698
      reference_title: "Lipoprotein X Causes Renal Disease in LCAT Deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In conclusion, LpX is a nephrotoxic particle that in the absence of Lcat induces all of the histological and functional hallmarks of FLD and hence may serve as a biomarker for monitoring recombinant LCAT therapy."
      explanation: Administered lipoprotein X reproduces the lesion.
discussions:
- discussion_id: lcat-deficiency-atherosclerosis-risk
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does genetic LCAT deficiency raise atherosclerotic risk, and does the answer
    differ between FLD and FED?
  attaches_to:
  - phenotypes#Premature coronary artery atherosclerosis
  - genetic#LCAT
  rationale: >-
    Studies disagree. A systematic review reported more premature coronary disease in
    FED than FLD, and in heterozygous carriers FED alleles were associated with more
    and FLD alleles with less carotid atherosclerosis, which has been attributed to
    the loss of esterification on apoB-containing lipoproteins in FLD. In Italian
    families, carriers of either kind had less carotid atherosclerosis than controls,
    and in mice LCAT deficiency reduces atherosclerosis. Most data come from
    heterozygous carriers rather than from patients with the full syndromes.
  evidence:
  - reference: PMID:32618730
    reference_title: "Genetic, biochemical, and clinical features of LCAT deficiency: update for 2020."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The collection of large series of affected individuals is needed to answer various open questions on this rare disorder of lipid metabolism, such as the cause of renal damage in patients with complete LCAT deficiency and the cardiovascular risk in carriers of different LCAT gene mutations."
    explanation: A review names cardiovascular risk by allele type as an open question.

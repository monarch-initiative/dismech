name: Genetic LCAT Deficiency
creation_date: "2026-11-27T14:44:55Z"
category: Mendelian
disease_term:
  preferred_term: LCAT deficiency
  term:
    id: MONDO:0018999
    label: LCAT deficiency
synonyms:
- LCAT deficiency
- lecithin-cholesterol acyltransferase deficiency
- genetic lecithin:cholesterol acyltransferase deficiency
- primary lecithin:cholesterol acyltransferase deficiency
- inherited lecithin:cholesterol acyltransferase deficiency
- LCAT deficiency syndromes
description: >-
  Autosomal recessive deficiency of lecithin:cholesterol acyltransferase (LCAT),
  the plasma enzyme that transfers a fatty acyl chain from phosphatidylcholine to
  cholesterol and so forms the cholesteryl esters needed for HDL maturation. Biallelic
  LCAT variants cause two syndromes. In familial LCAT deficiency (FLD, Norum disease)
  esterification is lost on both HDL (alpha-LCAT activity) and apoB-containing
  lipoproteins (beta-LCAT activity); in fish-eye disease (FED) it is lost on HDL only.
  Both have markedly reduced HDL cholesterol and corneal opacity from unesterified
  cholesterol deposition. FLD adds anaemia, proteinuria and progressive kidney disease
  driven by the abnormal lipoprotein X, with renal failure at a median age of 46 and
  recurrence in transplanted kidneys. Heterozygotes have about half-normal HDL
  cholesterol. About 200 patients have been described. Treatment is supportive;
  recombinant LCAT, an HDL mimetic and cell-based gene therapy are investigational.
parents:
- hypoalphalipoproteinemia
- inborn errors of metabolism
notes: >-
  Lump/split: one entry with two subtypes. Familial LCAT deficiency (Norum disease,
  MONDO:0009515, OMIM 245900) and fish-eye disease (MONDO:0007620, OMIM 136120) are
  allelic syndromes of one enzyme deficiency. Reviews and the largest systematic
  review treat them together and separate them by residual activity on HDL versus
  apoB-containing lipoproteins (PMID:35065092, PMID:36473023), and patients with
  intermediate phenotypes occur (PMID:16216249). The shared mechanism (LCAT loss,
  failed HDL maturation, corneal deposition) is curated once, and the
  complete-deficiency branch (lipoprotein X, kidney disease, most of the anaemia) is
  scoped to the FLD subtype. The entry is bound to the MONDO parent (MONDO:0018999,
  ORPHA:650) with both MONDO children as subtypes. Name: the MONDO label LCAT
  deficiency also covers acquired LCAT deficiency from anti-LCAT autoantibodies
  (PMID:42178263), so the entry is named Genetic LCAT Deficiency, the wording of the
  MONDO and Orphanet definitions and of recent reviews (PMID:32618730). Familial LCAT
  deficiency is not used for the whole entry because it is the established name of
  the complete form. No GeneReviews chapter exists; ClinGen has not curated LCAT.
references:
- reference: PMID:35065092
  title: "A systematic review of the natural history and biomarkers of primary lecithin:cholesterol acyltransferase deficiency."
has_subtypes:
- name: FLD
  display_name: Familial LCAT deficiency (Norum disease)
  subtype_term:
    preferred_term: Norum disease
    term:
      id: MONDO:0009515
      label: Norum disease
  description: >-
    Complete LCAT deficiency: esterification is lost on both HDL and
    apoB-containing lipoproteins. Corneal opacity and very low HDL cholesterol are
    accompanied by anaemia, proteinuria and hematuria, and kidney disease that reaches
    stage III-V CKD in about half of reported patients. Lipoprotein X accumulates and
    is the main nephrotoxic particle.
  evidence:
  - reference: PMID:33867422
    reference_title: "Current Status of Familial LCAT Deficiency in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "FLD is also accompanied by anemia, proteinuria and progressive renal failure that eventually requires hemodialysis."
    explanation: Features that distinguish the complete form.
- name: FED
  display_name: Fish-eye disease
  subtype_term:
    preferred_term: fish eye disease
    term:
      id: MONDO:0007620
      label: fish eye disease
  description: >-
    Partial LCAT deficiency (alpha-LCAT deficiency): esterification is lost on HDL
    but retained on apoB-containing lipoproteins. Corneal opacity and very low HDL
    cholesterol without proteinuria or kidney disease; diagnosed later than FLD, and
    premature coronary disease is reported more often.
  evidence:
  - reference: PMID:4061122
    reference_title: "Evidence for deficiency of high density lipoprotein lecithin: cholesterol acyltransferase activity (alpha-LCAT) in fish eye disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fish eye disease according to this notion is classified as an alpha-LCAT deficiency in contrast to the classical LCAT deficiency which probably lacks both alpha- and beta-LCAT activities."
    explanation: The biochemical distinction between the two syndromes.
  - reference: PMID:34256778
    reference_title: "LCAT deficiency: a systematic review with the clinical and genetic description of Mexican kindred."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "There was a significantly greater risk of premature coronary artery disease in fish eye disease compared to familial LCAT deficiency."
    explanation: A clinical difference reported between the syndromes.
inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic LCAT variants, homozygous or compound heterozygous. Heterozygous
    carriers have about half-normal HDL cholesterol without the corneal or renal
    disease.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:35065092
    reference_title: "A systematic review of the natural history and biomarkers of primary lecithin:cholesterol acyltransferase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Syndromes associated with LCAT deficiency, a rare autosomal recessive condition, include fish-eye disease (FED) and familial LCAT deficiency (FLD)."
    explanation: States the mode of inheritance for both syndromes.
  - reference: PMID:36473023

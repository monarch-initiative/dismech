name: Autosomal Recessive Spondylometaphyseal Dysplasia, Megarbane Type
creation_date: "2026-08-31T10:30:00Z"
category: Mendelian
description: >-
  Autosomal recessive spondylometaphyseal dysplasia, Megarbane type (SMDMDM, also
  Megarbane-Dagher-Melki type) is an early-lethal skeletal dysplasia caused by biallelic
  variants in PAM16, the gene for the protein historically called MAGMAS. It is a
  skeletal dysplasia whose lesion is not in cartilage matrix, collagen, or a
  mineralisation pathway at all, but in the machinery that pulls nuclear-encoded
  proteins into the mitochondrial matrix.

  PAM16 is the J-like regulatory subunit of the presequence translocase-associated
  motor (PAM) that drives the TIM23 import channel. It heterodimerises with the
  J-domain of DNAJC19 and, through that pairing, sets how hard mitochondrial Hsp70
  pulls on an incoming precursor. Roughly sixty per cent of the mitochondrial proteome
  arrives through TIM23, so a partial failure of this motor is a partial failure of
  mitochondrial biogenesis everywhere at once. The reason the skeleton is what breaks
  is a matter of where and when the protein is needed: MAGMAS is expressed in the
  hypertrophic zone of the growth plate and in the primary spongiosa of trabecular
  bone, the two compartments in which a cartilage template is converted into bone, and
  not appreciably in the resting or proliferative chondrocytes above them.

  The disease allele in every reported Lebanese case is the same homozygous missense
  change, c.226A>G (p.Asn76Asp), lying in helix II of the J-like domain and shared on a
  1.9 Mb founder haplotype at 16p13.3. It is a hypomorph rather than a null: in yeast
  complementation it supports normal growth at 28 degrees and fails progressively at
  higher temperatures, which is consistent with children who are born alive and die at
  9 to 24 months rather than with embryonic lethality. When the mutant phenotype is
  forced, unprocessed Hsp60 precursor accumulates, the mitochondrial network fragments,
  pexophagy appears and the cells die.

  Clinically the four originally reported children shared pre- and postnatal growth
  retardation, developmental delay, a narrow thorax with short ribs, short limbs,
  severe platyspondyly at birth, square iliac bones, horizontal acetabula, delayed
  epiphyseal ossification and widened distal femoral metaphyses. What killed them
  differed by family and follows the two organs the mechanism most exposes: respiratory
  insufficiency, mechanically downstream of the small thorax, in the first family, and
  heart failure with severe cardiomegaly in the second. A fifth patient carrying the
  adjacent p.Gln74Pro allele has been reported with a milder course and longer
  survival, which is the only genotype-phenotype contrast the literature currently
  offers.
synonyms:
- SMDMDM
- Spondylometaphyseal dysplasia, Megarbane-Dagher-Melki type
- Chondrodysplasia, Megarbane-Dagher-Melki type
- PAM16 spondylodysplastic dysplasia
- MAGMAS-related spondylodysplastic dysplasia
- Autosomal recessive spondylometaphyseal dysplasia, Megarbane type

genetic:
- name: PAM16
  gene_term:
    preferred_term: PAM16
    term:
      id: hgnc:29679
      label: PAM16
  relationship_type: CAUSATIVE
  presence: PRESENT
  notes: >-
    The gene is also widely called MAGMAS in the primary literature; MONDO records the
    single relationship RO:0004003 HGNC:29679 for this disease and links no other
    disease term to this gene. The lowercase `hgnc:` prefix is this repository's
    canonical form.
  variants:
  - name: NM_016069:c.226A>G (p.Asn76Asp)
    description: >-
      The founder allele. Homozygous in all four children of the two unrelated
      consanguineous Lebanese families, absent from 550 Lebanese control chromosomes,
      and carried on a 1.9 Mb shared ancestral haplotype at 16p13.3. It substitutes a
      residue conserved across mammals and vertebrates in helix II of the J-like domain.
    gene:
      preferred_term: PAM16
      term:
        id: hgnc:29679
        label: PAM16
    type: MISSENSE
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:24786642
      reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "However, they display the same homozygous missense mutation, thus suggesting the existence of a founder mutation."
      explanation: Establishes the founder status of this allele across the two unrelated families.
    - reference: PMID:24786642
      reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Protein sequence alignments showed that the Asparagine at codon 76 in MAGMAS is well conserved among mammals and vertebrates"
      explanation: Cross-species conservation of the substituted residue, supporting pathogenicity.
  - name: p.Gln74Pro
    description: >-
      The second reported disease allele, homozygous in a single later patient with a
      milder course and longer survival than the four Lebanese children. It lies two
      residues from the founder allele in the same helix. The primary report of this
      patient is a paywalled letter with no retrievable abstract, so the allele and its
      milder phenotype are curated from two reviews that describe it rather than from
      the primary source.
    gene:
      preferred_term: PAM16
      term:
        id: hgnc:29679
        label: PAM16
    type: MISSENSE
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:33171986
      reference_title: "Skeletal Phenotypes Due to Abnormalities in Mitochondrial Protein Homeostasis and Import."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "More recently, a slightly milder phenotype of SMDMDM was also reported in another patient harboring a nearby variant in PAM16 (Q74P) [59]."
      explanation: Reports the second allele and its milder associated phenotype.
    - reference: PMID:39766801
      reference_title: "Hotspots for Disease-Causing Mutations in the Mitochondrial TIM23 Import Complex."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Structurally, the Gln74Pro mutation introduces a proline, which would certainly disrupt helix71–84."
      explanation: A structural prediction of how this allele disrupts the same helix that carries the founder allele.
  evidence:
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The finding of deleterious MAGMAS mutations in an early lethal skeletal dysplasia supports a key role for this mitochondrial protein in the ossification process."
    explanation: The gene-disease assertion made by the discovery paper.
  - reference: PMID:33171986
    reference_title: "Skeletal Phenotypes Due to Abnormalities in Mitochondrial Protein Homeostasis and Import."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a homozygous missense variant in PAM16 (N76D) was identified in both families [42]."
    explanation: Independent review confirmation that the same PAM16 allele accounts for both originally reported families.
diagnosis:
- name: Molecular genetic testing of PAM16
  description: >-
    The diagnosis is molecular. The radiographic pattern narrows the differential to
    the severe spondylodysplastic dysplasias but does not identify the gene, and the
    biochemical consequence of the defect has not been shown to produce a clinically
    usable metabolite or enzyme marker in patients. In a family of Lebanese ancestry a
    targeted test for the c.226A>G founder allele is the efficient first step;
    otherwise a skeletal dysplasia gene panel or exome sequencing is required, which is
    how both the original families and the milder patient were solved.
  evidence:
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the mutation was homozygous in the patients, heterozygous in the parents and in the unaffected sibs in both families."
    explanation: Sanger confirmation of the exome finding is the diagnostic test this entry describes.
- name: Skeletal radiographic survey
  description: >-
    Neonatal radiographs establish the phenotype: severe platyspondyly, short and
    sometimes cupped ribs with a bell-shaped thorax, square iliac bones, horizontal
    acetabula, hypoplastic ischia, short long bones with abnormal modelling and absent
    or delayed epiphyseal ossification. The pattern is what places the child in the
    severe spondylodysplastic group and prompts the molecular test.
  evidence:
  - reference: PMID:18925669
    reference_title: "Sib pair with previously unreported skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neonatal radiographs disclosed a bell-shaped thorax, short ribs, some with a cupped end, severe platyspondyly, square iliac bones, horizontal acetabula with medial and lateral spurs, hypoplastic ischia, short long bones, slight widening of the distal femoral metaphyses, and absence of epiphyseal ossification of the knees."
    explanation: The radiographic survey and its findings, as performed in the first family.
differential_diagnoses:
- name: Dilated cardiomyopathy with ataxia syndrome (DCMA)
  description: >-
    The allelic-partner disease. DNAJC19 encodes the J-protein that heterodimerises
    with MAGMAS through the very domain the founder allele damages, so DCMA and this
    disease are two failures of the same import motor read out in different tissues.
    The discovery paper explicitly asked why its patients did not have DCMA and
    proposed tissue redundancy in the MAGMAS/DNAJC19 subcomplex as the explanation.
  distinguishing_features:
  - DCMA is caused by DNAJC19 variants and this disease by PAM16 variants; both disrupt the same heterodimer from opposite sides.
  - DCMA presents with dilated cardiomyopathy, ataxia and 3-methylglutaconic aciduria and has no spondylometaphyseal dysplasia.
  - Ataxia was explicitly absent in the four originally reported PAM16 patients, and cardiomyopathy occurred in only one of the two families.
  - The severe congenital platyspondyly and delayed epiphyseal ossification that define this entity have no counterpart in DCMA.
  evidence:
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiomyopathy was observed exclusively in patients of the second family and ataxia was not present but all 4 cases died early before 2 years of age."
    explanation: The clinical contrast with DCMA drawn by the discovery paper itself.
- name: EVEN-PLUS syndrome (HSPA9-related)
  description: >-
    The other skeletal dysplasia of the same import machine. HSPA9 encodes mortalin,
    the mitochondrial Hsp70 that the PAM motor drives and that MAGMAS regulates, so
    EVEN-PLUS is a defect one component downstream of this disease. Both are severe
    spondylo-type dysplasias, and the pairing is the main reason this entity is best
    understood as a mitochondrial import disease rather than as a chondrodysplasia.
  distinguishing_features:
  - EVEN-PLUS is caused by HSPA9 variants; this disease by PAM16 variants.
  - EVEN-PLUS carries epiphyseal, vertebral, ear and nose anomalies with congenital heart disease; this entity is dominated by severe platyspondyly with metaphyseal change.
  - The two are separated by sequencing, not by radiographic pattern alone.
  evidence:
  - reference: PMID:33171986
    reference_title: "Skeletal Phenotypes Due to Abnormalities in Mitochondrial Protein Homeostasis and Import."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a few other disease genes encoding mitochondrial proteins have been linked to genetic skeletal disorders, where they have been classified as spondyloepimetaphyseal or severe spondysplastic dysplasias [8]"
    explanation: Places HSPA9 and PAM16 in the same class of mitochondrial skeletal disorders, which is what makes this a differential.
- name: Spondyloepimetaphyseal dysplasia, Bieganski type (AIFM1-related)
  disease_term:
    preferred_term: spondyloepimetaphyseal dysplasia, Bieganski type
    term:
      id: MONDO:0010275
      label: spondyloepimetaphyseal dysplasia, Bieganski type
  description: >-
    Another spondylo-dysplasia with a mitochondrial mechanism, curated in this KB as
    `kb/disorders/Spondyloepimetaphyseal_Dysplasia_Bieganski_Type.yaml`. It is included
    because it is the nearest structural analogue already in the knowledge base: a
    vertebral-plus-metaphyseal dysplasia in which the causal gene is mitochondrial
    rather than a matrix or collagen gene.
  distinguishing_features:
  - Bieganski type is X-linked and AIFM1-related; this entity is autosomal recessive and PAM16-related.
  - The AIFM1 disorder carries a prominent progressive neurological arm with hypomyelination, absent from the PAM16 phenotype.
  - AIFM1 acts in apoptosis and complex I biogenesis; PAM16 acts in presequence protein import.
- name: Other severe spondylodysplastic dysplasias
  description: >-
    The radiographic differential at presentation. The severe spondylodysplastic group
    contains achondrogenesis type 1A (TRIP11), Schneckenbecken dysplasia (SLC35D1),
    spondylometaphyseal dysplasia Sedaghatian type, fibrochondrogenesis (COL11A1) and
    opsismodysplasia (INPPL1); all present with severe congenital vertebral
    abnormalities and early lethality, and none is separable from this entity on
    radiographs alone.
  distinguishing_features:
  - Each member of the group has a distinct causal gene, so molecular testing rather than imaging resolves the differential.
  - This entity is the only member whose gene acts in mitochondrial protein import.
  evidence:
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The last international classification recognizes at least five distinct entities within this group of rare disorders"
    explanation: The discovery paper's own framing of the differential group into which it placed the new entity.
treatments:
- name: Genetic counselling and cascade carrier testing
  description: >-
    The only intervention this entry can support with evidence. Both original families
    were consanguineous and shared one founder allele on a defined haplotype, so
    carrier testing of relatives and reproductive counselling for a 25 per cent
    recurrence risk are concretely actionable in the Lebanese population in which the
    allele segregates. No disease-modifying therapy exists.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the mutation was homozygous in the patients, heterozygous in the parents and in the unaffected sibs in both families. We also demonstrated that the variation was absent in a set of 550 Lebanese control chromosomes."
    explanation: >-
      Establishes the carrier state in obligate heterozygotes and the absence of the
      allele from population controls, which is what makes targeted cascade carrier
      testing informative in this family and population.
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, they display the same homozygous missense mutation, thus suggesting the existence of a founder mutation."
    explanation: A founder allele on a shared haplotype is what makes a single targeted assay adequate for cascade testing.
experimental_models:
- name: pam16-null yeast complemented with human wild-type or p.Asn76Asp MAGMAS
  description: >-
    The system in which the disease allele was functionally proven. Saccharomyces
    cerevisiae pam16-delta strains were rescued with a plasmid expressing either
    wild-type or p.Asn76Asp human MAGMAS. The mutant supported growth at 28 degrees but
    grew slowly at 34 and was inviable at 36 degrees, more severely on non-fermentable
    than on fermentable medium; at the non-permissive temperature it accumulated
    unprocessed Hsp60, expressed MAGMAS at reduced levels, showed a fragmented
    mitochondrial network and underwent pexophagy. The temperature sensitivity is the
    informative part: it demonstrates a conditional hypomorph rather than a null, which
    matches a disease compatible with live birth and months of survival.
  experimental_model_type: OTHER
  organism:
    preferred_term: Saccharomyces cerevisiae
    term:
      id: NCBITaxon:4932
      label: Saccharomyces cerevisiae
  publication: PMID:24786642
  modeled_mechanisms:
  - target: Impaired TIM23/PAM-Dependent Import of Matrix Preproteins
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The human disease allele, expressed in place of the yeast ortholog, reproduces
      the import block that this node asserts.
    limitations: >-
      Yeast has no growth plate, no cardiomyocyte and no vertebral column, so the model
      speaks only to the conserved import chemistry and can say nothing about how that
      chemistry becomes a skeletal disease. The defect is also only expressed at
      non-physiological temperatures, so the assay reports a conditional phenotype
      rather than the constitutive one patients carry at 37 degrees.
    readouts:
    - name: Unprocessed Hsp60 precursor accumulation
      target: Impaired TIM23/PAM-Dependent Import of Matrix Preproteins
      direction: INCREASED
      interpretation: >-
        Precursor that fails to reach the matrix is not proteolytically matured, so its
        accumulation is a direct readout of the import block.
      evidence:
      - reference: PMID:24786642
        reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Non-processed mitochondrial Hsp60 was accumulated in significant amounts in the pam16D-MAG Asn76Asp strain when the mutant phenotype was induced"
        explanation: The measurement behind this readout.
    - name: Steady-state mutant MAGMAS protein level
      target: Impaired TIM23/PAM-Dependent Import of Matrix Preproteins
      direction: DECREASED
      interpretation: Confirms that the allele acts by destabilising the protein rather than by altering its activity alone.
      evidence:
      - reference: PMID:24786642
        reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The low expression level of MAGMAS detected in the mutant strain at the non permissive temperature indicates that the p.Asn76Asp mutation confers protein instability."
        explanation: The measurement behind this readout.
    evidence:
    - reference: PMID:24786642
      reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We further demonstrate that the mutation described here confers to yeast strains a temperature-sensitive phenotype, impairs the import of mitochondrial matrix pre-proteins and induces cell death."
      explanation: Supports treating this complementation system as informative for the import node.
  - target: Mitochondrial Network Fragmentation and Cell Death
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The same strains show the organellar collapse and death that this node asserts.
    limitations: >-
      Yeast mitochondrial dynamics and pexophagy are not identical to the human
      processes, and the phenotype again requires a temperature shift. Nothing here
      demonstrates that the same collapse occurs in a patient chondrocyte.
    readouts:
    - name: Mitochondrial network morphology
      target: Mitochondrial Network Fragmentation and Cell Death
      direction: ALTERED
      interpretation: Loss of the reticulated network in favour of punctate fragments.
      evidence:
      - reference: PMID:24786642
        reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Microscopic examination of mitochondria revealed an unhealthy feature in the mutant strain consisting in punctuate and highly fragmented mitochondria that differed from the normal reticulated mitochondrial network observed in WT MAGMAS expressing cells."
        explanation: The measurement behind this readout.
    evidence:
    - reference: PMID:24786642
      reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "A remarkable aspect (vacuole labeling), indicative of pexophagic degradation, was only observed in pam16D-MAG Asn76Asp cells grown at the non permissive temperature"
      explanation: Supports treating this system as informative for the organellar-failure node.
animal_models:
- name: Drosophila black-pearl (blp) hypomorph and RNAi knockdown
  species: Drosophila melanogaster
  genotype: blp hypomorphic allele; blp RNAi knockdown in Schneider cells
  description: >-
    The only in vivo animal work on this gene family that bears on the disease
    mechanism. Black-pearl is the Drosophila ortholog of MAGMAS/Pam16. Depleting it
    depolarises mitochondria, drops ATP by 60 per cent, raises reactive oxygen species
    3.5-fold and selectively cuts cytochrome c oxidase activity by 65 per cent; in
    hypomorphic larvae, plasmatocyte number and mitochondrial staining fall and
    N-acetylcysteine doubles viability, which is the strongest evidence that ROS is a
    causal effector rather than a bystander. It is not a model of the disease: the
    allele is a knockdown or hypomorph rather than the human missense change, and flies
    have no endochondral skeleton.
  publication: PMID:22700875
  modeled_mechanisms:
  - target: Mitochondrial Network Fragmentation and Cell Death
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Loss of the ortholog reproduces the bioenergetic and viability collapse that this
      node describes, and adds the ROS and cytochrome c oxidase measurements that the
      yeast work does not provide.
    limitations: >-
      The perturbation is a knockdown or hypomorphic allele of the fly ortholog, not
      the human p.Asn76Asp missense allele, so it models loss of the gene rather than
      the disease genotype, and it cannot address dosage. The readouts are in
      haemocytes and cultured Schneider cells, tissues with no relationship to the
      growth plate. Fidelity is graded LOW for those reasons rather than because any
      result is in doubt.
    readouts:
    - name: Cellular ATP level
      target: Mitochondrial Network Fragmentation and Cell Death
      direction: DECREASED
      interpretation: A 60 per cent fall in ATP is the bioenergetic consequence of losing the import-motor subunit.
      evidence:
      - reference: PMID:22700875
        reference_title: "Essential role of Drosophila black-pearl is mediated by its effects on mitochondrial respiration."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Proliferation-defective, Blp-deficient Drosophila Schneider cells exhibited mitochondrial membrane depolarization, a 60% decrease in ATP levels, increased amounts of ROS (3.5-fold), cell cycle arrest, and activation of autophagy that were associated with a selective 65% reduction of cytochrome c oxidase activity."
        explanation: >-
          The measurement behind this readout. Graded IN_VITRO because it was made in
          cultured Schneider cells rather than in the animal.
    - name: Reactive oxygen species
      target: Mitochondrial Network Fragmentation and Cell Death
      direction: INCREASED
      interpretation: A 3.5-fold ROS rise, rescued by N-acetylcysteine, which is the basis of the ROS hypothesis recorded in this entry.
      evidence:
      - reference: PMID:22700875
        reference_title: "Essential role of Drosophila black-pearl is mediated by its effects on mitochondrial respiration."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Loss of Blp decreases cytochrome c oxidase activity and uncouples oxidative phosphorylation, causing ROS production"
        explanation: >-
          The paper's own summary of the ROS result across its fly experiments, which
          include the whole-animal hypomorph arm.
    evidence:
    - reference: PMID:22700875
      reference_title: "Essential role of Drosophila black-pearl is mediated by its effects on mitochondrial respiration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Black-pearl (Blp) is a highly conserved, essential inner-mitochondrial membrane protein. The yeast Blp homologue, Magmas/Pam16, is required for mitochondrial protein transport, growth, and survival."
      explanation: >-
        Establishes the orthology that makes this fly model informative for a human
        PAM16 mechanism node.
  evidence:
  - reference: PMID:22700875
    reference_title: "Essential role of Drosophila black-pearl is mediated by its effects on mitochondrial respiration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "blp hypomorph larvae had a 35% decreased number of plasmatocytes with a 45% reduced active mitochondrial staining and their viability was increased 2-fold by administration of NAC"
    explanation: The whole-animal arm of the model, including the antioxidant rescue.
discussions:
- discussion_id: no_human_tissue_experiment
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the p.Asn76Asp allele impair mitochondrial protein import in human cells, and
    specifically in chondrocytes or osteoblasts?
  attaches_to:
  - pathophysiology#Impaired TIM23/PAM-Dependent Import of Matrix Preproteins
  - pathophysiology#Growth Plate Hypertrophic Zone and Primary Spongiosa Ossification Failure
  rationale: >-
    Every functional demonstration of the import defect is in yeast expressing the
    human allele. The expression work that makes the disease skeletal is
    immunohistochemistry on wild-type mouse growth plate and RT-PCR on control human
    chondrocytes and osteoblasts, neither of which carries the variant. No patient
    fibroblast, chondrocyte, iPSC-derived or organoid experiment has been reported, so
    the link from a demonstrated import block to a demonstrated ossification defect is
    inferred at exactly the step where the disease becomes skeletal. This is the single
    largest gap in the entry and the reason the corresponding causal edges are graded
    INDIRECT_UNKNOWN_INTERMEDIATES.
- discussion_id: patient_protein_level_discrepancy
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Is the protein destabilisation seen in yeast actually present in patients, given
    that PAM16 disease alleles have not been reported to lower steady-state PAM16
    levels in humans?
  attaches_to:
  - pathophysiology#PAM16 p.Asn76Asp Destabilisation of the MAGMAS J-Like Domain
  rationale: >-
    The yeast complementation system shows reduced mutant MAGMAS at the non-permissive
    temperature, and an in silico prediction agrees the substitution is destabilising.
    A 2024 review of TIM23 disease mutations nonetheless notes the opposite pattern
    for PAM16 in humans, contrasting it with DNAJC19, where disease alleles do lower
    protein levels. Both statements may be true if the yeast destabilisation is
    conditional on heat stress that patients do not experience, but as it stands the
    model result and the human observation point in different directions on the
    mechanism this entry places at the head of its pathograph.
  evidence:
  - reference: PMID:39766801
    reference_title: "Hotspots for Disease-Causing Mutations in the Mitochondrial TIM23 Import Complex."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "reports indicate that Tim14 gene mutations are more likely to reduce Tim14 protein levels, while Pam16 gene mutations are not reported to decrease steady-state Pam16 levels"
    explanation: States the human observation that this mismatch is drawn against.
- discussion_id: cardiac_branch_variability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why did cardiomyopathy occur in one family and not the other, on the same
    homozygous founder allele?
  attaches_to:
  - pathophysiology#Myocardial Energetic Failure and Cardiomegaly
  rationale: >-
    Four children shared one allele on one haplotype, yet two died of respiratory
    insufficiency and two of heart failure with severe cardiomegaly. The discovery
    paper raised functional redundancy in the MAGMAS/DNAJC19 subcomplex as one possible
    explanation for the absence of a full DCMA phenotype, but nothing distinguishes the
    two families genetically, and with four patients there is no power to separate a
    modifier from chance. The cardiac edge is therefore recorded as incompletely
    penetrant rather than as a uniform feature.
- discussion_id: surgical_management_source_inaccessible
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the operative and perioperative experience of spinal surgery in this
    disease?
  attaches_to:
  - treatments#
  - phenotypes#Severe platyspondyly
  rationale: >-
    One paper addresses management of the spinal deformity, Frank et al. 2026 in
    European Spine Journal (PMID:41369754, doi 10.1007/s00586-025-09671-6). It is
    behind a publisher paywall and neither PubMed nor Europe PMC carries an abstract;
    `just fetch-reference PMID:41369754` returns `content_type: unavailable` with an
    empty body, so no quotable substring exists and no evidence item can be built from
    it. It is therefore not cited anywhere in this entry and no surgical treatment is
    curated. Anyone with institutional access should read it and add the treatment,
    since it is the only published source on managing the deformity and, given that its
    authors include the Buenos Aires group that reported the p.Gln74Pro patient, it may
    also be the only long-term follow-up of a survivor.
references:
- reference: PMID:24786642
  title: The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia.
  findings:
  - statement: 'Mehawej et al. 2014, PLoS Genetics. The discovery paper: exome sequencing in both
      Lebanese families, the p.Asn76Asp founder allele, growth-plate expression, and the yeast complementation,
      import, morphology and pexophagy experiments. Open access, and the source of most of this entry''s
      mechanism.'
- reference: PMID:18925669
  title: Sib pair with previously unreported skeletal dysplasia.
  findings:
  - statement: Megarbane, Dagher and Melki 2008. The original clinical and radiographic description
      of the first family, and the report the eponym comes from.
- reference: PMID:24458487
  title: A second family with autosomal recessive spondylometaphyseal dysplasia and early death.
  findings:
  - statement: Megarbane et al. 2014. The second family, adding wormian bones, lumbar interpedicular
      narrowing, sacral changes and the fatal cardiomegaly.
- reference: PMID:33171986
  title: Skeletal Phenotypes Due to Abnormalities in Mitochondrial Protein Homeostasis and Import.
  findings:
  - statement: Zhao et al. 2020. Places this disease among the mitochondrial skeletal disorders alongside
      HSPA9, LONP1, AIFM1, IARS2 and PISD, and is the source used here for the complete case series
      including the milder p.Gln74Pro patient.
- reference: PMID:39766801
  title: Hotspots for Disease-Causing Mutations in the Mitochondrial TIM23 Import Complex.
  findings:
  - statement: Jain, Paz and Azem 2024. Reviews disease mutations across the TIM23 complex and supplies
      the structural and stability predictions for both PAM16 alleles, plus the observation about
      steady-state PAM16 levels in patients.
- reference: PMID:20053669
  title: Role of Magmas in protein transport and human mitochondria biogenesis.
  findings:
  - statement: Sinha et al. 2010. Establishes human MAGMAS as the Pam16 ortholog, its subcomplex
      with Pam18/DnaJC19, and that destabilising that subcomplex causes translocation defects, the
      general result of which the disease allele is a specific instance.
- reference: PMID:22700875
  title: Essential role of Drosophila black-pearl is mediated by its effects on mitochondrial respiration.
  findings:
  - statement: Roy et al. 2012. The Drosophila ortholog, with the ROS, ATP, cytochrome c oxidase
      and N-acetylcysteine rescue data behind the ROS hypothesis recorded here.
- reference: ORPHA:401979
  findings:
  - statement: Orphanet's record for the disease, used for the classification and for the definition-level
      phenotype statements. It carries no epidemiology data.
- reference: PMID:27354339
  title: A novel homozygous PAM16 mutation in a patient with a milder phenotype and longer survival.
  findings:
  - statement: 'Moosa et al. 2016, the primary report of the p.Gln74Pro patient. Listed for completeness
      and deliberately not used for any evidence item: the cached record is content_type unavailable
      with an empty body, so no exact quote can be taken from it. Its content reaches this entry
      only through the two reviews that describe it.'
- reference: PMID:41369754
  title: "Spine surgery in a rare case of Mégarbané-Dagher-Melki type spondylometaphyseal dysplasia. A Case Report."
  findings:
  - statement: 'Frank et al. 2026, the only paper on surgical management. Listed for completeness
      and deliberately not used for any evidence item, for the same reason: the cached record is
      content_type unavailable. See the corresponding knowledge gap.'
notes: >-
  Entity verification. `runoak -i sqlite:obo:mondo info MONDO:0013223 -O obo`, run
  2026-08-31, returns the label "autosomal recessive spondylometaphyseal dysplasia,
  Megarbane type", the definition "Any spondylodysplastic dysplasia in which the cause
  of the disease is a mutation in the PAM16 gene", xrefs OMIM:613320, Orphanet:401979,
  UMLS:C2750075, MEDGEN:413221, MESH:C567644, DOID:0112304 and GARD:0017667, the single
  relationship `RO:0004003 HGNC:29679 ! PAM16`, and the two superclasses MONDO:0016763
  and MONDO:0800080 that the stub recorded. `runoak -i sqlite:obo:mondo relationships
  --direction down -p RO:0004003 HGNC:29679` returns exactly one disease, this one, so
  unlike the SDHA or HMGCR situations there is no second PAM16 disease entity to
  separate.

  Named Entity Confusion. The gene has two names and only one of them is safe to search
  on. "MAGMAS" as a free-text query returns volcanology and a substantial cancer
  literature that uses MAGMAS as a chemoresistance drug target in glioblastoma, ovarian
  carcinoma and pituitary adenoma; none of it concerns this disease, and none of it is
  cited here. "PAM16" as free text additionally collides with PAM4 / PAM16 pulse
  amplitude modulation in optical communications engineering. Every reference in this
  entry was therefore selected from a PAM16 search combined with a skeletal, Megarbane
  or mitochondrial-import qualifier, and each was read before use. The deep-research
  report was run against MONDO:0013223 and preflighted with `just preflight-dr`, which
  returned PAM16 mentioned 38 times against a top rival of "PAM" at 11 - that rival is
  the PAM complex acronym from this disease's own mechanism, not a competing gene - and
  matched the report's OMIM identifier 613320 to MONDO's. One transcription error in
  that report was caught and not propagated: it gives the PROVEAN score for p.Asn76Asp
  as -24.021 where the primary paper reports -4.021.

  Allelic series, and what is not a separate disease. Two PAM16 disease alleles are
  published, p.Asn76Asp and p.Gln74Pro, two residues apart in the same helix of the
  J-like domain. Both reviews that discuss the second allele describe its patient as
  having SMDMDM with a milder course, not a different entity, and MONDO carries no
  second PAM16 disease term, so this is curated as one disease with an allelic series
  rather than as two entries or as parent-and-subtype. A search for a PAM16-related
  spastic paraplegia or other neurological entity was run and returned nothing:
  `PAM16 AND (spastic OR paraplegia)` in PubMed returns zero records, Europe PMC's
  `"PAM16" AND ("spastic" OR "paraplegia" OR "neurodegener")` returns only reviews of
  the import machinery, and MONDO links no such disease to HGNC:29679. The
  cardiomyopathy-plus-ataxia phenotype that does exist in this part of the machinery
  belongs to DNAJC19, not PAM16, and is curated here as a differential.

  Provenance limits worth knowing when extending this entry. Two of the five reported
  patients are described only in sources this repository cannot quote. PMID:27354339
  and PMID:41369754 both cache as `content_type: unavailable` with an empty body, so
  the p.Gln74Pro patient enters this entry only through PMID:33171986 and PMID:39766801,
  and the surgical experience does not enter it at all. Both are listed under
  `references` with that limitation stated rather than being cited for snippets. The
  2023 ISDS nosology (PMID:36779427) is cached as full text but without its group
  tables, which is why the `isds_skeletal_category` assignment carries a note and no
  evidence item.

  Module conformance. No `conforms_to` is declared. There is at present no
  mitochondrial protein-import module in `kb/modules/`, and the closest candidates are
  not appropriate: `mitochondrial_dysfunction` is framed around age-related
  accumulation rather than a germline hypomorph, `loss_of_proteostasis` is likewise an
  ageing module, and `defective_skeletal_mineralization` concerns calciopenic and
  phosphopenic rickets and mineralisation-inhibitor excess, which is a different
  mechanism from the one curated here. A `mitochondrial_protein_import_failure` module
  would have several conformers already present or implied in the literature - PAM16
  here, HSPA9 in EVEN-PLUS, DNAJC19 in DCMA and TIMM50 - and is proposed as follow-up
  work rather than created in this PR.

  preferred_term: autosomal recessive spondylometaphyseal dysplasia, Megarbane type
  term:
    id: MONDO:0013223
    label: autosomal recessive spondylometaphyseal dysplasia, Megarbane type
parents:
- Mitochondrial Disease
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      The defining and diagnostic features are skeletal: severe congenital
      platyspondyly, short ribs with a narrow thorax, square iliac bones, horizontal
      acetabula, short long bones with abnormal modelling and delayed epiphyseal
      ossification. The lethal complications are respiratory and cardiac, but both are
      consequences of the skeletal and mitochondrial lesion rather than the presenting
      problem, so a second chapter assignment is deliberately not made.
  isds_skeletal_category:
  - classification_value: severe_spondylodysplastic_dysplasias
    notes: >-
      The ISDS nosology group that MONDO itself places this disease in: `runoak -i
      sqlite:obo:mondo info MONDO:0013223 -O obo` (verified 2026-08-31) returns the two
      superclasses MONDO:0016763 spondylometaphyseal dysplasia and MONDO:0800080
      severe spondylodysplastic dysplasia, the latter being the nosology group that
      also holds achondrogenesis 1A, SMD Sedaghatian type and opsismodysplasia. No
      evidence item is attached because the cached full text of the 2023 nosology
      (PMID:36779427) does not carry the group tables, so no quotable substring exists
      for the assignment; the basis is the ontology relationship, recorded here.
  mechanistic_category:
  - classification_value: mitochondrial disease
    notes: >-
      A nuclear-encoded disorder of mitochondrial protein import. The mutated gene is
      nuclear, but the failing machine and the failing chemistry are mitochondrial, and
      the disease sits with EVEN-PLUS syndrome (HSPA9) and DCMA (DNAJC19) as a defect
      of the same TIM23/PAM import motor.

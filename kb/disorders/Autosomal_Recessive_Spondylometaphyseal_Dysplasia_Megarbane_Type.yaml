      narrowing, sacral changes and the fatal cardiomegaly.
- reference: PMID:33171986
  title: Skeletal Phenotypes Due to Abnormalities in Mitochondrial Protein Homeostasis and Import.
  findings:
  - statement: Zhao et al. 2020. Reviews mitochondrial skeletal disorders and the milder p.Gln74Pro

    severe cardiomegaly and fatal heart failure occurred in the second founder family. Mouse cardiac
    expression and conserved cellular bioenergetic functions support a myocardial hypothesis; ATP
    deficiency has not been measured in affected human myocardium, and the DNAJC19 cardiomyopathy
    analogy does not establish a dilated subtype in PAM16 disease.

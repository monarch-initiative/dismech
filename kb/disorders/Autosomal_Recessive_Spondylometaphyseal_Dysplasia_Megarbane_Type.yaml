name: Autosomal Recessive Spondylometaphyseal Dysplasia, Megarbane Type
creation_date: "2026-08-31T10:30:00Z"
category: Mendelian
description: 'Autosomal recessive spondylometaphyseal dysplasia, Megarbane-Dagher-Melki type (SMDMDM),
  is caused by biallelic PAM16 variants. PAM16 encodes MAGMAS, a regulator of the TIM23/PAM mitochondrial
  protein-import motor. The founder p.Asn76Asp allele impairs matrix-preprotein import, destabilizes
  MAGMAS and disrupts cell integrity in yeast under nonpermissive assay conditions. These experiments
  establish an allele effect in a model, not a human temperature threshold or a measured patient-tissue
  import defect.


  The four children in the two original Lebanese families had pre- and postnatal growth retardation,
  developmental delay, short limbs, a small thorax and severe congenital skeletal abnormalities. Platyspondyly
  and some other radiographic abnormalities improved with age, while short stature persisted. Two
  children died from respiratory insufficiency at nine months and two years; the other family''s two
  children had cardiomyopathy and died from heart failure around two years. A later p.Gln74Pro case
  had a milder course. A 2026 surgical report describes survival to 13 years with cervical instability,
  cord compression and progressive kyphoscoliosis; its full case report cites the 2016 report at molecular
  diagnosis but does not state the allele or establish an additional distinct patient.


  MAGMAS expression in mouse hypertrophic chondrocytes and primary spongiosa supports an ossification
  role. The molecular route to the human skeletal lesions remains provisional: neither expression
  localization nor yeast import failure proves a lesion confined to that ossification compartment.
  Bioenergetic and oxidative injury are supported by fly models, but their contribution to human growth-plate
  or myocardial disease has not been measured. Thoracic restriction is a plausible contributor to
  respiratory insufficiency; an additional intrinsic pulmonary defect has not been excluded.'
synonyms:
- SMDMDM
- Spondylometaphyseal dysplasia, Megarbane-Dagher-Melki type
- Chondrodysplasia, Megarbane-Dagher-Melki type
- PAM16 spondylodysplastic dysplasia
- MAGMAS-related spondylodysplastic dysplasia
- Autosomal recessive spondylometaphyseal dysplasia, Megarbane type

genetic:
- name: PAM16
  gene_term:
    preferred_term: PAM16
    term:
      id: hgnc:29679
      label: PAM16
  relationship_type: CAUSATIVE
  presence: PRESENT
  notes: >-
    The gene is also widely called MAGMAS in the primary literature; MONDO records the
    single relationship RO:0004003 HGNC:29679 for this disease and links no other
    disease term to this gene. The lowercase `hgnc:` prefix is this repository's
    canonical form.
  variants:
  - name: NM_016069:c.226A>G (p.Asn76Asp)
    description: >-
      The founder allele. Homozygous in all four children of the two unrelated
      consanguineous Lebanese families, absent from 550 Lebanese control chromosomes,
      and carried on a 1.9 Mb shared ancestral haplotype at 16p13.3. It substitutes a
      residue conserved across mammals and vertebrates in helix II of the J-like domain.
    gene:
      preferred_term: PAM16
      term:
        id: hgnc:29679
        label: PAM16
    type: MISSENSE
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:24786642
      reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "However, they display the same homozygous missense mutation, thus suggesting the existence of a founder mutation."
      explanation: Establishes the founder status of this allele across the two unrelated families.
    - reference: PMID:24786642
      reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Protein sequence alignments showed that the Asparagine at codon 76 in MAGMAS is well conserved among mammals and vertebrates"
      explanation: Cross-species conservation of the substituted residue, supporting pathogenicity.
  - name: p.Gln74Pro
    description: >-
      The second reported disease allele, homozygous in a single later patient with a
      milder course and longer survival than the four Lebanese children. It lies two
      residues from the founder allele in the same helix. The primary report of this
      patient is a paywalled letter with no retrievable abstract, so the allele and its
      milder phenotype are curated from two reviews that describe it rather than from
      the primary source.
    gene:
      preferred_term: PAM16
      term:
        id: hgnc:29679
        label: PAM16
    type: MISSENSE
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:33171986
      reference_title: "Skeletal Phenotypes Due to Abnormalities in Mitochondrial Protein Homeostasis and Import."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "More recently, a slightly milder phenotype of SMDMDM was also reported in another patient harboring a nearby variant in PAM16 (Q74P) [59]."
      explanation: Reports the second allele and its milder associated phenotype.
    - reference: PMID:39766801
      reference_title: "Hotspots for Disease-Causing Mutations in the Mitochondrial TIM23 Import Complex."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Structurally, the Gln74Pro mutation introduces a proline, which would certainly disrupt helix71–84."
      explanation: A structural prediction of how this allele disrupts the same helix that carries the founder allele.
  evidence:
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the mutation was homozygous in the patients, heterozygous in the parents and in the unaffected
      sibs in both families. We also demonstrated that the variation was absent in a set of 550 Lebanese
      control chromosomes.
    explanation: The founder variant segregates with disease in both families and was absent from
      the tested control chromosomes.
  - reference: PMID:33171986
    reference_title: "Skeletal Phenotypes Due to Abnormalities in Mitochondrial Protein Homeostasis and Import."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "a homozygous missense variant in PAM16 (N76D) was identified in both families [42]."
    explanation: Independent review confirmation that the same PAM16 allele accounts for both originally reported families.
diagnosis:
- name: Molecular genetic testing of PAM16
  description: >-
    The diagnosis is molecular. The radiographic pattern narrows the differential to
    the severe spondylodysplastic dysplasias but does not identify the gene, and the
    biochemical consequence of the defect has not been shown to produce a clinically
    usable metabolite or enzyme marker in patients. In a family of Lebanese ancestry a
    targeted test for the c.226A>G founder allele is the efficient first step;
    otherwise a skeletal dysplasia gene panel or exome sequencing is required, which is
    how both the original families and the milder patient were solved.
  evidence:
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the mutation was homozygous in the patients, heterozygous in the parents and in the unaffected sibs in both families."
    explanation: Sanger confirmation of the exome finding is the diagnostic test this entry describes.
- name: Skeletal radiographic survey
  description: >-
    Neonatal radiographs establish the phenotype: severe platyspondyly, short and
    sometimes cupped ribs with a bell-shaped thorax, square iliac bones, horizontal
    acetabula, hypoplastic ischia, short long bones with abnormal modelling and absent
    or delayed epiphyseal ossification. The pattern is what places the child in the
    severe spondylodysplastic group and prompts the molecular test.
  evidence:
  - reference: PMID:18925669
    reference_title: "Sib pair with previously unreported skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neonatal radiographs disclosed a bell-shaped thorax, short ribs, some with a cupped end, severe platyspondyly, square iliac bones, horizontal acetabula with medial and lateral spurs, hypoplastic ischia, short long bones, slight widening of the distal femoral metaphyses, and absence of epiphyseal ossification of the knees."
    explanation: The radiographic survey and its findings, as performed in the first family.
differential_diagnoses:
- name: Dilated cardiomyopathy with ataxia syndrome (DCMA)
  disease_term:
    preferred_term: dilated cardiomyopathy with ataxia syndrome
    term:
      id: MONDO:0012435
      label: 3-methylglutaconic aciduria type 5
  description: >-
    The allelic-partner disease. DNAJC19 encodes the J-protein that heterodimerises
    with MAGMAS through the very domain the founder allele damages, so DCMA and this
    disease are two failures of the same import motor read out in different tissues.
    The discovery paper explicitly asked why its patients did not have DCMA and
    proposed tissue redundancy in the MAGMAS/DNAJC19 subcomplex as the explanation.
  distinguishing_features:
  - DCMA is caused by DNAJC19 variants and this disease by PAM16 variants; both disrupt the same heterodimer from opposite sides.
  - DCMA presents with dilated cardiomyopathy, ataxia and 3-methylglutaconic aciduria and has no spondylometaphyseal dysplasia.
  - Ataxia was explicitly absent in the four originally reported PAM16 patients, and cardiomyopathy occurred in only one of the two families.
  - The severe congenital platyspondyly and delayed epiphyseal ossification that define this entity have no counterpart in DCMA.
  evidence:
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiomyopathy was observed exclusively in patients of the second family and ataxia was not present but all 4 cases died early before 2 years of age."
    explanation: The clinical contrast with DCMA drawn by the discovery paper itself.
- name: EVEN-PLUS syndrome (HSPA9-related)
  description: >-
    The other skeletal dysplasia of the same import machine. HSPA9 encodes mortalin,
    the mitochondrial Hsp70 that the PAM motor drives and that MAGMAS regulates, so
    EVEN-PLUS is a defect one component downstream of this disease. Both are severe
    spondylo-type dysplasias, and the pairing is the main reason this entity is best
    understood as a mitochondrial import disease rather than as a chondrodysplasia.
  distinguishing_features:
  - EVEN-PLUS is caused by HSPA9 variants; this disease by PAM16 variants.
  - EVEN-PLUS carries epiphyseal, vertebral, ear and nose anomalies with congenital heart disease; this entity is dominated by severe platyspondyly with metaphyseal change.
  - The two are separated by sequencing, not by radiographic pattern alone.
  evidence:
  - reference: PMID:33171986
    reference_title: "Skeletal Phenotypes Due to Abnormalities in Mitochondrial Protein Homeostasis and Import."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "a few other disease genes encoding mitochondrial proteins have been linked to genetic skeletal disorders, where they have been classified as spondyloepimetaphyseal or severe spondysplastic dysplasias [8]"
    explanation: Places HSPA9 and PAM16 in the same class of mitochondrial skeletal disorders, which is what makes this a differential.
- name: Spondyloepimetaphyseal dysplasia, Bieganski type (AIFM1-related)
  disease_term:
    preferred_term: spondyloepimetaphyseal dysplasia, Bieganski type
    term:
      id: MONDO:0010275
      label: spondyloepimetaphyseal dysplasia, Bieganski type
  description: >-
    Another spondylo-dysplasia with a mitochondrial mechanism, curated in this KB as
    `kb/disorders/Spondyloepimetaphyseal_Dysplasia_Bieganski_Type.yaml`. It is included
    because it is the nearest structural analogue already in the knowledge base: a
    vertebral-plus-metaphyseal dysplasia in which the causal gene is mitochondrial
    rather than a matrix or collagen gene.
  distinguishing_features:
  - Bieganski type is X-linked and AIFM1-related; this entity is autosomal recessive and PAM16-related.
  - The AIFM1 disorder carries a prominent progressive neurological arm with hypomyelination, absent from the PAM16 phenotype.
  - AIFM1 acts in apoptosis and complex I biogenesis; PAM16 acts in presequence protein import.
- name: Other severe spondylodysplastic dysplasias
  description: >-
    The radiographic differential at presentation. The severe spondylodysplastic group
    contains achondrogenesis type 1A (TRIP11), Schneckenbecken dysplasia (SLC35D1),
    spondylometaphyseal dysplasia Sedaghatian type, fibrochondrogenesis (COL11A1) and
    opsismodysplasia (INPPL1); all present with severe congenital vertebral
    abnormalities and early lethality, and none is separable from this entity on
    radiographs alone.
  distinguishing_features:
  - Each member of the group has a distinct causal gene, so molecular testing rather than imaging resolves the differential.
  - This entity is the only member whose gene acts in mitochondrial protein import.
  evidence:
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The last international classification recognizes at least five distinct entities within this group of rare disorders"
    explanation: The discovery paper's own framing of the differential group into which it placed the new entity.
treatments:
- name: Genetic counselling and cascade carrier testing
  description: Genetic counseling can address autosomal recessive recurrence in families with molecularly
    confirmed PAM16-related disease.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the mutation was homozygous in the patients, heterozygous in the parents and in the unaffected sibs in both families. We also demonstrated that the variation was absent in a set of 550 Lebanese control chromosomes."
    explanation: >-
      Establishes the carrier state in obligate heterozygotes and the absence of the
      allele from population controls, which is what makes targeted cascade carrier
      testing informative in this family and population.
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, they display the same homozygous missense mutation, thus suggesting the existence of a founder mutation."
    explanation: A founder allele on a shared haplotype is what makes a single targeted assay adequate for cascade testing.
- name: Staged spinal surgery
  description: One survivor underwent occipital decompression, C1 laminectomy and noninstrumented
    C0-C3 fusion at three years ten months for progressive instability and cord compression. Vertebral-artery
    injury, postoperative bleeding requiring re-exploration, and nonunion requiring revision complicated
    that cervical course. Later kyphoscoliosis correction at eleven years used staged anchors and
    graft, ten weeks of halo-gravity traction and growing rods; completion of that later construct
    was reported without complications. Spastic diparesis persisted at age thirteen. This single case
    does not establish general safety, effectiveness or neurological recovery.
  evidence:
  - reference: url:https://link.springer.com/article/10.1007/s00586-025-09671-6
    reference_title: Spine surgery in a rare case of Mégarbané-Dagher-Melki type spondylometaphyseal
      dysplasia. A Case Report | European Spine Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At 3 years the patient underwent occipital decompression and fusion due to spinal instability
      and cord compression at 4 years the diagnosis of spondylometaphyseal dysplasia Megarbane-Dagher-Melki
      type was made.
    explanation: Reports the cervical procedure and its indication.
  - reference: url:https://link.springer.com/article/10.1007/s00586-025-09671-6
    reference_title: Spine surgery in a rare case of Mégarbané-Dagher-Melki type spondylometaphyseal
      dysplasia. A Case Report | European Spine Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At this time, proximal and distal anchors were inserted with allogenic bone graft, followed
      by 10 weeks of halo-gravity traction. The growing rods system was then completed successfully
      without complications.
    explanation: This uncomplicated completion refers to the later growing-rod stage, not the earlier
      cervical fusion course.
  - reference: url:https://link.springer.com/article/10.1007/s00586-025-09671-6
    reference_title: Spine surgery in a rare case of Mégarbané-Dagher-Melki type spondylometaphyseal
      dysplasia. A Case Report | European Spine Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our patient had to undergo reoperation in the immediate postoperative period due to a
      bleeding complication and then after 3 months due to nonunion. After the revision surgery fusion
      was achieved.
    explanation: The discussion distinguishes early bleeding and nonunion revisions from the later
      thoracolumbar procedure.
  treatment_term:
    preferred_term: Orthopedic Surgical Procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Cervical spine instability
    treatment_effect: INHIBITS
    description: Fusion stabilizes the unstable cervical segment; the case achieved fusion after revision
      for nonunion.
    evidence:
    - reference: url:https://link.springer.com/article/10.1007/s00586-025-09671-6
      reference_title: Spine surgery in a rare case of Mégarbané-Dagher-Melki type spondylometaphyseal
        dysplasia. A Case Report | European Spine Journal | Springer Nature Link
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Our patient had to undergo reoperation in the immediate postoperative period due to
        a bleeding complication and then after 3 months due to nonunion. After the revision surgery
        fusion was achieved.
      explanation: The discussion distinguishes early bleeding and nonunion revisions from the later
        thoracolumbar procedure.
  - target: Spinal cord compression
    treatment_effect: INHIBITS
    description: Occipital decompression and C1 laminectomy were performed to relieve cord compression;
      persistent spastic diparesis precludes an inferred neurological recovery.
    evidence:
    - reference: url:https://link.springer.com/article/10.1007/s00586-025-09671-6
      reference_title: Spine surgery in a rare case of Mégarbané-Dagher-Melki type spondylometaphyseal
        dysplasia. A Case Report | European Spine Journal | Springer Nature Link
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: At 3 years the patient underwent occipital decompression and fusion due to spinal instability
        and cord compression at 4 years the diagnosis of spondylometaphyseal dysplasia Megarbane-Dagher-Melki
        type was made.
      explanation: Reports the cervical procedure and its indication.
  - target: Kyphoscoliosis
    treatment_effect: INHIBITS
    description: Staged fixation and halo traction gradually corrected the spinal deformity; the authors
      describe fusion and stability as the mechanical rationale.
    evidence:
    - reference: url:https://link.springer.com/article/10.1007/s00586-025-09671-6
      reference_title: Spine surgery in a rare case of Mégarbané-Dagher-Melki type spondylometaphyseal
        dysplasia. A Case Report | European Spine Journal | Springer Nature Link
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Initial anchor placement promoted local fusion, enhancing stability, while gradual
        correction with halo-traction lowered neurological risks.
      explanation: The authors explicitly explain the local fusion, stabilization and gradual correction
        rationale.
experimental_models:
- name: pam16-null yeast complemented with human wild-type or p.Asn76Asp MAGMAS
  description: Saccharomyces cerevisiae pam16-delta strains were complemented with wild-type or p.Asn76Asp
    human MAGMAS. Mutant growth was preserved at 28 degrees, slowed at 34 and absent at 36, particularly
    on non-fermentable medium. Nonpermissive conditions revealed Hsp60 precursor accumulation, reduced
    mutant protein, fragmented mitochondria and pexophagy. This establishes a conditional allele effect
    in yeast, without explaining human survival or predicting clinical responses to temperature.
  experimental_model_type: OTHER
  organism:
    preferred_term: Saccharomyces cerevisiae
    term:
      id: NCBITaxon:4932
      label: Saccharomyces cerevisiae
  publication: PMID:24786642
  modeled_mechanisms:
  - target: Impaired TIM23/PAM-Dependent Import of Matrix Preproteins
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The human disease allele, expressed in place of the yeast ortholog, reproduces
      the import block that this node asserts.
    limitations: >-
      Yeast has no growth plate, no cardiomyocyte and no vertebral column, so the model
      speaks only to the conserved import chemistry and can say nothing about how that
      chemistry becomes a skeletal disease. The defect is also only expressed at
      non-physiological temperatures, so the assay reports a conditional phenotype
      rather than the constitutive one patients carry at 37 degrees.
    readouts:
    - name: Unprocessed Hsp60 precursor accumulation
      target: Impaired TIM23/PAM-Dependent Import of Matrix Preproteins
      direction: INCREASED
      interpretation: >-
        Precursor that fails to reach the matrix is not proteolytically matured, so its
        accumulation is a direct readout of the import block.
      evidence:
      - reference: PMID:24786642
        reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Non-processed mitochondrial Hsp60 was accumulated in significant amounts in the pam16D-MAG Asn76Asp strain when the mutant phenotype was induced"
        explanation: The measurement behind this readout.
    - name: Steady-state mutant MAGMAS protein level
      target: Impaired TIM23/PAM-Dependent Import of Matrix Preproteins
      direction: DECREASED
      interpretation: Confirms that the allele acts by destabilising the protein rather than by altering its activity alone.
      evidence:
      - reference: PMID:24786642
        reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The low expression level of MAGMAS detected in the mutant strain at the non permissive temperature indicates that the p.Asn76Asp mutation confers protein instability."
        explanation: The measurement behind this readout.
    evidence:
    - reference: PMID:24786642
      reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We further demonstrate that the mutation described here confers to yeast strains a temperature-sensitive phenotype, impairs the import of mitochondrial matrix pre-proteins and induces cell death."
      explanation: Supports treating this complementation system as informative for the import node.
  - target: Mitochondrial Network Fragmentation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The same strains show the organellar fragmentation and pexophagy that this node
      asserts.
    limitations: >-
      Yeast mitochondrial dynamics and pexophagy are not identical to the human
      processes, and the phenotype again requires a temperature shift. Nothing here
      demonstrates that the same collapse occurs in a patient chondrocyte.
    readouts:
    - name: Mitochondrial network morphology
      target: Mitochondrial Network Fragmentation
      direction: ALTERED
      interpretation: Loss of the reticulated network in favour of punctate fragments.
      evidence:
      - reference: PMID:24786642
        reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Microscopic examination of mitochondria revealed an unhealthy feature in the mutant strain consisting in punctuate and highly fragmented mitochondria that differed from the normal reticulated mitochondrial network observed in WT MAGMAS expressing cells."
        explanation: The measurement behind this readout.
    evidence:
    - reference: PMID:24786642
      reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "A remarkable aspect (vacuole labeling), indicative of pexophagic degradation, was only observed in pam16D-MAG Asn76Asp cells grown at the non permissive temperature"
      explanation: Supports treating this system as informative for the organellar-failure node.
animal_models:
- name: Drosophila black-pearl (blp) hypomorph and RNAi knockdown
  species: Drosophila melanogaster
  genotype: blp hypomorphic allele; blp RNAi knockdown in Schneider cells
  genes:
  - preferred_term: black-pearl (blp)
    description: >-
      The Drosophila ortholog of PAM16/MAGMAS and the gene actually manipulated in this
      model. Left unbound: it is a fly gene with no HGNC identifier, and binding the
      human PAM16 CURIE here would assert that the model mutates a gene it does not.
  description: >-
    The only in vivo animal work on this gene family that bears on the disease
    mechanism. Black-pearl is the Drosophila ortholog of MAGMAS/Pam16. Depleting it
    depolarises mitochondria, drops ATP by 60 per cent, raises reactive oxygen species
    3.5-fold and selectively cuts cytochrome c oxidase activity by 65 per cent; in
    hypomorphic larvae, plasmatocyte number and mitochondrial staining fall and
    N-acetylcysteine doubles viability, which is the strongest evidence that ROS is a
    causal effector rather than a bystander. It is not a model of the disease: the
    allele is a knockdown or hypomorph rather than the human missense change, and flies
    have no endochondral skeleton.
  publication: PMID:22700875
  modeled_mechanisms:
  - target: Bioenergetic Failure and Cell Death
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Loss of the ortholog reproduces the bioenergetic and viability collapse this node
      describes, and quantifies it with the ATP, ROS and cytochrome c oxidase
      measurements the yeast work does not provide.
    limitations: >-
      The perturbation is a knockdown or hypomorphic allele of the fly ortholog, not
      the human p.Asn76Asp missense allele, so it models loss of the gene rather than
      the disease genotype, and it cannot address dosage. The readouts are in
      haemocytes and cultured Schneider cells, tissues with no relationship to the
      growth plate. Fidelity is graded LOW for those reasons rather than because any
      result is in doubt.
    readouts:

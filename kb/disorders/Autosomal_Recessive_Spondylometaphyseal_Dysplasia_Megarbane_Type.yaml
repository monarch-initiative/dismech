discussions:
- discussion_id: no_human_tissue_experiment
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the p.Asn76Asp allele impair mitochondrial protein import in human cells, and
    specifically in chondrocytes or osteoblasts?
  attaches_to:
  - pathophysiology#Impaired TIM23/PAM-Dependent Import of Matrix Preproteins
  - pathophysiology#Impaired Skeletal Ossification and Modeling
  rationale: Functional import measurements used yeast expressing the human founder allele; mouse
    growth-plate and control human cell expression establish tissue relevance. No patient chondrocyte
    import, bioenergetic or histological lesion is demonstrated in the reviewed sources. Qualified
    skeletal and cardiac paths are represented, while their tissue attribution remains provisional.
    Additional or extramitochondrial MAGMAS functions are proposed by the primary authors. The review
    also proposes steroidogenesis and other non-energetic mechanisms. ATP loss is therefore not assigned
    as the established cause of the skeletal phenotype; the broader import-to-ossification hypothesis
    is represented.
- discussion_id: patient_protein_level_discrepancy
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Are the yeast stability effects of PAM16 disease alleles reproduced in human tissues?
  attaches_to:
  - pathophysiology#PAM16 Dysfunction
  rationale: The founder allele reduces MAGMAS protein in yeast at nonpermissive temperature. The
    review says decreased steady-state PAM16 levels have not been reported; this is not a demonstrated
    normal measurement in patients and therefore does not establish an opposing human-model result.
    Human protein abundance and stability remain unmeasured in the sources reviewed.
  evidence:
  - reference: PMID:39766801
    reference_title: "Hotspots for Disease-Causing Mutations in the Mitochondrial TIM23 Import Complex."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "reports indicate that Tim14 gene mutations are more likely to reduce Tim14 protein levels, while Pam16 gene mutations are not reported to decrease steady-state Pam16 levels"
    explanation: The wording is absence of a reported decrease, not a measured normal patient level.
- discussion_id: cardiac_branch_variability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why did cardiomyopathy occur in one family and not the other, on the same
    homozygous founder allele?
  attaches_to:
  - pathophysiology#Myocardial Energetic Failure
  rationale: >-
    Four children shared one allele on one haplotype, yet two died of respiratory
    insufficiency and two of heart failure with severe cardiomegaly. The discovery
    paper raised functional redundancy in the MAGMAS/DNAJC19 subcomplex as one possible
    explanation for the absence of a full DCMA phenotype, but nothing distinguishes the
    two families genetically, and with four patients there is no power to separate a
    modifier from chance. The cardiac edge is therefore recorded as incompletely
    penetrant rather than as a uniform feature.
- discussion_id: surgical_followup_scope
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Does the surgical survivor correspond to the 2016 case, and what allele and longer-term
    outcomes can be confirmed?
  attaches_to:
  - phenotypes#Cervical spine instability
  - phenotypes#Kyphoscoliosis
  - treatments#Staged spinal surgery
  rationale: The fetched publisher HTML includes the full case report and discussion. It documents
    cervical complications and revision, later staged kyphoscoliosis correction, and persistent motor
    disability at age 13. The molecular-diagnosis sentence cites Moosa et al. 2016 (reference 4),
    and Fano V is a shared author, supporting a possible longitudinal relationship. Neither the cited
    sentence nor the article explicitly states the allele or establishes independent case identity;
    no additional unique patient or p.Gln74Pro genotype is inferred. A single case cannot establish
    population-level surgical effectiveness.
  evidence:
  - reference: url:https://link.springer.com/article/10.1007/s00586-025-09671-6
    reference_title: Spine surgery in a rare case of Mégarbané-Dagher-Melki type spondylometaphyseal
      dysplasia. A Case Report | European Spine Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a molecular test was performed and the diagnosis of spondylometaphyseal dysplasia Megarbane-Dagher-Melki
      type (SMD-MDM; OMIM 613320) was made
    explanation: This sentence cites reference 4, the 2016 Moosa report, in the full article. It supplies
      case provenance but no explicit allele.
  - reference: url:https://link.springer.com/article/10.1007/s00586-025-09671-6
    reference_title: Spine surgery in a rare case of Mégarbané-Dagher-Melki type spondylometaphyseal
      dysplasia. A Case Report | European Spine Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Neurological examination shows spastic diparesis with hypotonia, unchanged from the preoperative
      baseline.
    explanation: The full article supplies neurological follow-up, correcting the previous abstract-only
      access assumption.
- discussion_id: skeletal_patterning_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How does PAM16 dysfunction alter skull ossification, sacral formation or cervical proportions?
  attaches_to:
  - phenotypes#Wormian bones
  - phenotypes#Aplasia/Hypoplasia of the sacrum
  - phenotypes#Wide anterior fontanel
  - phenotypes#Short neck
  rationale: The sources document these findings but do not establish how PAM16 dysfunction alters
    skull ossification, sacral patterning or cervical proportions. The qualified endochondral growth
    and modeling path does not demonstrate these distinct anatomical mechanisms.
- discussion_id: craniofacial_and_abdominal_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which craniofacial developmental processes and abdominal tissue changes produce the recorded
    dysmorphism and protuberant abdomen?
  attaches_to:
  - phenotypes#Abnormal facial shape
  - phenotypes#Prominent forehead
  - phenotypes#Low-set ears
  - phenotypes#Depressed nasal bridge
  - phenotypes#Short nose
  - phenotypes#Anteverted nares
  - phenotypes#Broad nose
  - phenotypes#Protuberant abdomen
  rationale: The clinical sources describe these features without a demonstrated craniofacial developmental
    or abdominal mechanism. Expression localization and generic mitochondrial dysfunction do not establish
    causal attribution for each feature.
- discussion_id: growth_and_neuromotor_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: What explains fetal growth failure and developmental delay, and is hypotonia outside the
    surgical case central, muscular or secondary to illness?
  attaches_to:
  - phenotypes#Intrauterine growth retardation
  - phenotypes#Global developmental delay
  - phenotypes#Axial hypotonia
  rationale: Skeletal growth explains disproportionate linear stature, but the contributions of fetal
    systemic growth, CNS dysfunction, muscle disease or severe illness to these other findings are
    unresolved. The reviewed sources provide no patient tissue evidence that distinguishes them. The
    surgical survivor has a source-supported cervical myelopathy-associated hypotonia route, but this
    does not establish the cause in the earlier founder families.
- discussion_id: spinal_anatomy_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which vertebral or ligamentous defects cause atlantoaxial instability, and what drives progressive
    kyphoscoliosis?
  attaches_to:
  - phenotypes#Cervical spine instability
  - phenotypes#Kyphoscoliosis
  rationale: The full 2026 report identifies C1-C2 subluxation, associated canal narrowing and progressive
    kyphoscoliosis, but not the vertebral, ligamentous or regional growth defects producing the instability
    and deformity. The represented subluxation-to-stenosis-to-cord-compromise route is source-supported;
    the upstream tissue mechanism cannot be inferred solely from coexisting platyspondyly.
- discussion_id: survivor_mobility_and_airway_attribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: What proportion of nonambulation is orthopedic versus neurological, and is the subglottic
    stenosis congenital or acquired?
  attaches_to:
  - phenotypes#Inability to walk
  - phenotypes#Subglottic stenosis
  rationale: The survivor has substantial spinal deformity and spastic diparesis, but the report does
    not causally partition the failure to acquire walking. Subglottic stenosis is documented after
    earlier surgery without an etiological assessment. Neither disease membership nor prior instrumentation
    establishes the airway cause.
  evidence:
  - reference: url:https://link.springer.com/article/10.1007/s00586-025-09671-6
    reference_title: Spine surgery in a rare case of Mégarbané-Dagher-Melki type spondylometaphyseal
      dysplasia. A Case Report | European Spine Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: He has never ambulated. He relies on a transfer wheelchair for mobility but is unable
      to self-propel.
    explanation: The surgical survivor had never walked by age 13 and could not propel his transfer
      wheelchair. The relative orthopedic and neurological contributions are unresolved.
  - reference: url:https://link.springer.com/article/10.1007/s00586-025-09671-6
    reference_title: Spine surgery in a rare case of Mégarbané-Dagher-Melki type spondylometaphyseal
      dysplasia. A Case Report | European Spine Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: airway difficulties due to subglottic stenosis in the OR necessitated a tracheostomy,
      delaying surgery.
    explanation: Subglottic stenosis caused perioperative airway difficulty requiring tracheostomy
      at approximately ten years. The report does not establish whether this was congenital, acquired
      after earlier procedures, or attributable to PAM16 disease.
references:

mechanistic_hypotheses:
- hypothesis_group_id: ros_mediated_injury
  hypothesis_label: Reactive oxygen species as the effector between import failure and tissue injury
  status: EMERGING
  description: >-
    An alternative, or additional, account of how loss of PAM16 function injures cells.
    Rather than the injury being purely a shortfall of imported matrix proteins,
    MAGMAS has been shown to regulate reactive oxygen species, and loss of the
    Drosophila ortholog raises ROS, depolarises mitochondria and drops ATP, with
    N-acetylcysteine rescuing the resulting defects. If ROS is the proximate effector
    then an antioxidant is a candidate intervention, which no other part of this
    pathograph implies. The hypothesis is listed as emerging because every supporting
    experiment is in fly or in non-disease cell systems, and none uses a PAM16 disease
    allele or human skeletal tissue.
  evidence:
  - reference: PMID:22700875
    reference_title: "Essential role of Drosophila black-pearl is mediated by its effects on mitochondrial respiration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "blp hypomorph larvae had a 35% decreased number of plasmatocytes with a 45% reduced active mitochondrial staining and their viability was increased 2-fold by administration of NAC"
    explanation: An in vivo rescue by an antioxidant, which is the strongest available support for ROS being an effector rather than a bystander.

  - reference: PMID:33171986
    reference_title: "Skeletal Phenotypes Due to Abnormalities in Mitochondrial Protein Homeostasis and Import."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PAM16 (presequence translocase-associated motor 16), also known as MAGMAS (mitochondria-associated granulocyte macrophage colony-stimulating factor-signaling), is a critical mediator of mitochondrial protein import into the mitochondrial matrix via the TIM23 complex [53,54]."
    explanation: Review statement of the normal function whose loss this node describes.
  - reference: PMID:20053669

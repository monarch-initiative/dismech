inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic PAM16 variants. In both originally reported consanguineous Lebanese
    families the c.226A>G allele was homozygous in affected children and heterozygous
    in the unaffected parents and sibs, and was absent from 550 Lebanese control
    chromosomes.
  evidence:
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the mutation was homozygous in the patients, heterozygous in the parents and in the unaffected sibs in both families. We also demonstrated that the variation was absent in a set of 550 Lebanese control chromosomes."
    explanation: Segregation in two pedigrees plus absence from population controls establishes recessive inheritance of this allele.
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Five patients have been reported: four children from two unrelated consanguineous
    Lebanese families homozygous for p.Asn76Asp, and one later patient homozygous for
    p.Gln74Pro. No incidence, birth prevalence or carrier-frequency estimate has been
    published, and the Orphanet record for this disease carries no epidemiology data,
    so no numeric prevalence band is asserted here. ULTRA_RARE is the qualitative tier
    rather than a derived rate.
  evidence:
  - reference: PMID:33171986
    reference_title: "Skeletal Phenotypes Due to Abnormalities in Mitochondrial Protein Homeostasis and Import."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More recently, a slightly milder phenotype of SMDMDM was also reported in another patient harboring a nearby variant in PAM16 (Q74P) [59]."
    explanation: >-
      A 2020 review recording the additional patient beyond the two originally reported
      families, which with the four children of those families gives the five-patient
      total this record describes.
pathophysiology:
- name: PAM16 p.Asn76Asp Destabilisation of the MAGMAS J-Like Domain
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. The recurrent Lebanese allele c.226A>G replaces asparagine
    76 with aspartate in helix II of the C-terminal J-like domain of MAGMAS, the
    surface through which MAGMAS heterodimerises with the J-domain of DNAJC19. The
    substitution does not abolish the protein; it destabilises it, and the destabilised
    protein is present at reduced levels once the system is stressed. This is why the
    disease behaves as a hypomorph rather than as a null, and it is the molecular fact
    that the rest of the pathograph descends from.
  genetic_context:
    gene:
      preferred_term: PAM16
      term:
        id: hgnc:29679
        label: PAM16
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
    allele_type: MISSENSE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Homozygous germline NM_016069:c.226A>G (p.Asn76Asp). Graded as a partial rather
      than a complete loss of function because the allele complements a pam16-null
      yeast strain at permissive temperature and only fails as temperature rises.
  molecular_functions:
  - preferred_term: J-like co-chaperone regulation of the mitochondrial import motor
    modifier: DECREASED
    term:
      id: GO:0140662
      label: ATP-dependent protein folding chaperone
  locations:
  - preferred_term: mitochondrial inner membrane import motor
    description: >-
      Recorded here as the tissue in which MAGMAS is expressed at the relevant
      developmental stage, not as the subcellular site; the subcellular location is the
      matrix face of the mitochondrial inner membrane, for which no location term is
      bound in this slot.
    term:
      id: UBERON:0002483
      label: trabecular bone tissue
  downstream:
  - target: Impaired TIM23/PAM-Dependent Import of Matrix Preproteins
    causal_link_type: DIRECT
    description: >-
      A destabilised J-like domain weakens the MAGMAS/DNAJC19 subcomplex that regulates
      mitochondrial Hsp70, and so weakens the motor that pulls precursors through
      TIM23.
    evidence:
    - reference: PMID:24786642
      reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We further demonstrate that the mutation described here confers to yeast strains a temperature-sensitive phenotype, impairs the import of mitochondrial matrix pre-proteins and induces cell death."
      explanation: The discovery paper's own summary of the causal step from this allele to an import defect, demonstrated by yeast complementation.
  evidence:
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, the p.Asn76Asp mutation lies in the helix II of MAGMAS J-like domain."
    explanation: Locates the disease allele in the domain through which MAGMAS regulates the import motor.
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The low expression level of MAGMAS detected in the mutant strain at the non permissive temperature indicates that the p.Asn76Asp mutation confers protein instability."
    explanation: Direct measurement of the protein instability this node asserts, in the yeast complementation system.
  - reference: PMID:39766801
    reference_title: "Hotspots for Disease-Causing Mutations in the Mitochondrial TIM23 Import Complex."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "the Asn76Asp mutation is expected to disrupt hydrogen bonding and electrostatic interactions, thus affecting the stability of the protein. Indeed, the DUET webserver predicts this mutation to be highly destabilizing, with a −1.375 Kcal/mol change in energy"
    explanation: An in silico stability prediction independently agreeing that this substitution destabilises the protein.
- name: Impaired TIM23/PAM-Dependent Import of Matrix Preproteins
  biological_scale: MOLECULAR
  description: >-
    The proximate biochemical failure. TIM23 imports around sixty per cent of the
    mitochondrial proteome, and matrix-destined precursors reach the matrix only
    because the PAM motor, of which MAGMAS is the J-like regulator, provides the
    inward pull. With the mutant allele the motor is too weak: precursor proteins that
    should be imported and proteolytically matured accumulate in their unprocessed
    form. Hsp60 is the reporter used to demonstrate this, but the defect is generic to
    the presequence pathway rather than specific to any one cargo.
  biological_processes:
  - preferred_term: protein import into the mitochondrial matrix
    modifier: DECREASED
    term:
      id: GO:0030150
      label: protein import into mitochondrial matrix
  protein_complexes:
  - preferred_term: TIM23 presequence translocase-associated import motor (PAM)
    description: >-
      Tim44, Tim14/Pam18 (DNAJC19), Tim16/Pam16 (MAGMAS), mitochondrial Hsp70 and Mge1.
      No ontology identifier is bound: the complex is named in the cited literature but
      no term in the constrained ontology set represents it, and manufacturing a
      narrower match would be worse than leaving it unbound.
  downstream:
  - target: Mitochondrial Network Fragmentation and Cell Death
    causal_link_type: DIRECT
    description: >-
      Failure to import and mature matrix proteins degrades the organelle that depends
      on them, and the yeast system shows fragmentation, pexophagy and death appearing
      together with the import block.
    evidence:
    - reference: PMID:24786642
      reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Microscopic examination of mitochondria revealed an unhealthy feature in the mutant strain consisting in punctuate and highly fragmented mitochondria that differed from the normal reticulated mitochondrial network observed in WT MAGMAS expressing cells."
      explanation: The morphological consequence measured in the same strains in which import failure was demonstrated.
  - target: Growth Plate Hypertrophic Zone and Primary Spongiosa Ossification Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The step from a generic import defect to a specifically skeletal disease. What
      makes it skeletal is where the protein is expressed - the hypertrophic zone and
      the primary spongiosa - rather than any demonstrated chondrocyte-specific
      pathway. The intervening events in human cartilage have not been measured, and
      the link is graded accordingly.
    evidence:
    - reference: PMID:24786642
      reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Expression of the protein was mostly observed in the hypertrophic zone of the cartilage mainly at postnatal ages and in the primary spongiosa of trabecular bone."
      explanation: Immunolocalisation in wild-type mouse growth plate identifying the compartments in which the protein is required, which is the basis for the tissue specificity of the disease.
  evidence:
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Non-processed mitochondrial Hsp60 was accumulated in significant amounts in the pam16D-MAG Asn76Asp strain when the mutant phenotype was induced"
    explanation: Accumulation of an unprocessed precursor is the direct assay for a block in matrix import.
  - reference: PMID:33171986
    reference_title: "Skeletal Phenotypes Due to Abnormalities in Mitochondrial Protein Homeostasis and Import."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PAM16 (presequence translocase-associated motor 16), also known as MAGMAS (mitochondria-associated granulocyte macrophage colony-stimulating factor-signaling), is a critical mediator of mitochondrial protein import into the mitochondrial matrix via the TIM23 complex [53,54]."
    explanation: Review statement of the normal function whose loss this node describes.
  - reference: PMID:20053669
    reference_title: "Role of Magmas in protein transport and human mitochondria biogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, amino acid alterations in Magmas leads to reduced stability of the subcomplex with Pam18 that results in temperature sensitivity and in vivo protein translocation defects in yeast cells."
    explanation: Establishes, independently of the disease allele, that destabilising the MAGMAS/Pam18 subcomplex is sufficient to produce a translocation defect.
- name: Mitochondrial Network Fragmentation and Cell Death
  biological_scale: CELLULAR
  description: >-
    The cellular consequence. In the mutant-expressing cells the reticulated
    mitochondrial network breaks into punctate fragments, pexophagic degradation of
    peroxisomes appears, and viability is lost at the non-permissive temperature. The
    temperature dependence matters clinically: this is a conditional, dose-dependent
    collapse rather than an absolute one, which is what allows affected children to be
    born and to survive months rather than dying in utero.
  biological_processes:
  - preferred_term: mitochondrial network fragmentation
    modifier: INCREASED
    term:
      id: GO:0000266
      label: mitochondrial fission
  - preferred_term: pexophagy
    modifier: INCREASED
    term:
      id: GO:0000425
      label: pexophagy
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  downstream:
  - target: Growth Plate Hypertrophic Zone and Primary Spongiosa Ossification Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The inferred route by which a cell-level energetic and organellar failure is
      expressed as failure of the ossification front. No experiment in patient
      chondrocytes has been reported.
  - target: Myocardial Energetic Failure and Cardiomegaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The cardiac branch. Cardiomyopathy was present in one of the two families and
      absent in the other on the same homozygous allele, so the link from the cellular
      lesion to the heart is real but incompletely penetrant and its intermediates are
      unknown.
    evidence:
    - reference: PMID:24786642
      reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cardiomyopathy was observed exclusively in patients of the second family and ataxia was not present but all 4 cases died early before 2 years of age."
      explanation: Documents both that the cardiac branch occurs and that it is not uniform across families carrying the same allele.
  evidence:
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A remarkable aspect (vacuole labeling), indicative of pexophagic degradation, was only observed in pam16D-MAG Asn76Asp cells grown at the non permissive temperature"
    explanation: The peroxisomal arm of the organellar failure, measured in the mutant strain only.
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that MAGMAS is specifically expressed in trabecular bone and cartilage at early developmental stages and that the mutation leads to an instability of the protein."
    explanation: Ties the protein instability to the cellular phenotype described in this node.
- name: Growth Plate Hypertrophic Zone and Primary Spongiosa Ossification Failure
  biological_scale: TISSUE
  description: >-
    The tissue lesion that produces the radiographic disease. Endochondral ossification
    converts a cartilage template into bone at the hypertrophic zone of the growth
    plate and the primary spongiosa immediately beneath it; these are precisely the two
    compartments in which MAGMAS is expressed, and the compartments above them, the
    resting and proliferative chondrocytes, are where it is not detected. Failure
    localised to the ossification front rather than to matrix production accounts for
    the pattern seen on radiographs: severe platyspondyly, delayed or absent epiphyseal
    ossification, metaphyseal widening and cupping, and abnormal modelling of the long
    bones, with the vertebral changes improving somewhat with age in the survivors.
  cell_types:
  - preferred_term: hypertrophic chondrocyte
    term:
      id: CL:0000743
      label: hypertrophic chondrocyte
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: endochondral ossification
    modifier: DECREASED
    term:
      id: GO:0001958
      label: endochondral ossification
  - preferred_term: growth plate cartilage development
    modifier: ABNORMAL
    term:
      id: GO:0003417
      label: growth plate cartilage development
  locations:
  - preferred_term: hypertrophic zone of the long bone growth plate
    term:
      id: UBERON:0006772
      label: long bone epiphyseal plate hypertrophic zone
  - preferred_term: primary spongiosa of trabecular bone
    term:
      id: UBERON:0002483
      label: trabecular bone tissue
  - preferred_term: vertebra
    term:
      id: UBERON:0002412
      label: vertebra
  downstream:
  - target: Severe platyspondyly
    causal_link_type: DIRECT
  - target: Delayed epiphyseal ossification
    causal_link_type: DIRECT
  - target: Wide distal femoral metaphysis
    causal_link_type: DIRECT
  - target: Short long bone
    causal_link_type: DIRECT
  - target: Short ribs
    causal_link_type: DIRECT
  - target: Restrictive Thoracic Insufficiency
    causal_link_type: DIRECT
    description: >-
      Short ribs and a narrow, bell-shaped thorax constrain lung volume mechanically;
      this is the route by which a bone disease becomes a fatal respiratory one, and it
      was the cause of death in the first family.
  evidence:
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Expression of the protein was mostly observed in the hypertrophic zone of the cartilage mainly at postnatal ages and in the primary spongiosa of trabecular bone."
    explanation: Establishes that the affected compartments are exactly those in which the protein is normally present.
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skeletal features included severe platyspondyly at birth that improved somewhat over time, square iliac bones, horizontal acetabulae, short long bones with abnormal modeling, widening of the distal femoral metaphyses and delayed epiphyseal ossification"
    explanation: The radiographic phenotype in the four affected children that this tissue lesion produces.
  - reference: PMID:39766801
    reference_title: "Hotspots for Disease-Causing Mutations in the Mitochondrial TIM23 Import Complex."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the case of Pam16, both known mutations (https://omim.org/entry/613320, accessed on 30 October 2024) in the encoding gene (Table 1) lead to characteristic developmental skeletal abnormalities, such as platyspondyly and reduced length of the long bones, as well as craniofacial dysmorphism [77,88]."
    explanation: Confirms that both reported disease alleles converge on the same skeletal lesion, not only the founder allele.
- name: Myocardial Energetic Failure and Cardiomegaly
  biological_scale: TISSUE
  description: >-
    The cardiac branch, and the one that killed the second family. Cardiac muscle is
    among the most mitochondria-dense tissues and is a recurring casualty of TIM23/PAM
    motor defects: mutations in DNAJC19, the direct J-protein partner of MAGMAS, cause
    dilated cardiomyopathy with ataxia. Both affected sibs in the second family
    developed severe cardiomegaly and died of heart failure at about 24 months. The
    branch is deliberately kept separate from the skeletal one because it did not occur
    in the first family despite the identical homozygous allele.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  downstream:
  - target: Cardiomegaly
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24458487
    reference_title: "A second family with autosomal recessive spondylometaphyseal dysplasia and early death."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both sibs had a severe cardiomegaly and died at around 24 months from a heart failure."
    explanation: The clinical report of the cardiac branch in the second family.
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in DNAJC19 preventing MAGMAS/DNAJC19 dimerization have been shown to lead to dilated cardiomyopathy with ataxia syndrome (DCMA)"
    explanation: Establishes that disruption of the same heterodimer from the partner subunit produces a cardiomyopathy, which is the mechanistic rationale for a cardiac branch here.
- name: Restrictive Thoracic Insufficiency
  biological_scale: ORGANISM
  description: >-
    The respiratory branch, and the cause of death in the first family. It is
    mechanically rather than metabolically driven: short ribs and a bell-shaped,
    narrow thorax limit the volume the lungs can occupy and the excursion available for
    ventilation. Recording it as its own node keeps the two lethal routes distinct,
    because they are not the same failure and they did not affect the same family.
  locations:
  - preferred_term: thoracic cavity
    term:
      id: UBERON:0002224
      label: thoracic cavity
  downstream:
  - target: Respiratory insufficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:18925669
    reference_title: "Sib pair with previously unreported skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neonatal radiographs disclosed a bell-shaped thorax, short ribs, some with a cupped end, severe platyspondyly, square iliac bones, horizontal acetabula with medial and lateral spurs, hypoplastic ischia, short long bones, slight widening of the distal femoral metaphyses, and absence of epiphyseal ossification of the knees."
    explanation: Documents the thoracic geometry in the first family.
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "both affected sibs died at an early age from respiratory insufficiency (F1-IV.1 at age 9 months and F1-IV.3 at age 2 years) while heart failure was the cause of the early death, at age 2 years, in patients (F2-IV.2 and F2-IV.3) of the second family"
    explanation: Establishes respiratory insufficiency as the lethal endpoint of this branch and separates it from the cardiac branch.
mechanistic_hypotheses:
- hypothesis_group_id: ros_mediated_injury
  hypothesis_label: Reactive oxygen species as the effector between import failure and tissue injury
  status: EMERGING
  description: >-
    An alternative, or additional, account of how loss of PAM16 function injures cells.
    Rather than the injury being purely a shortfall of imported matrix proteins,
    MAGMAS has been shown to regulate reactive oxygen species, and loss of the
    Drosophila ortholog raises ROS, depolarises mitochondria and drops ATP, with
    N-acetylcysteine rescuing the resulting defects. If ROS is the proximate effector
    then an antioxidant is a candidate intervention, which no other part of this
    pathograph implies. The hypothesis is listed as emerging because every supporting
    experiment is in fly or in non-disease cell systems, and none uses a PAM16 disease
    allele or human skeletal tissue.
  evidence:
  - reference: PMID:22700875
    reference_title: "Essential role of Drosophila black-pearl is mediated by its effects on mitochondrial respiration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "blp hypomorph larvae had a 35% decreased number of plasmatocytes with a 45% reduced active mitochondrial staining and their viability was increased 2-fold by administration of NAC"
    explanation: An in vivo rescue by an antioxidant, which is the strongest available support for ROS being an effector rather than a bystander.

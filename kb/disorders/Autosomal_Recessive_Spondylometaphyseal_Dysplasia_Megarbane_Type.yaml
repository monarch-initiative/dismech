inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic PAM16 variants. In both originally reported consanguineous Lebanese
    families the c.226A>G allele was homozygous in affected children and heterozygous
    in the unaffected parents and sibs, and was absent from 550 Lebanese control
    chromosomes.
  evidence:
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the mutation was homozygous in the patients, heterozygous in the parents and in the unaffected sibs in both families. We also demonstrated that the variation was absent in a set of 550 Lebanese control chromosomes."
    explanation: Segregation in two pedigrees plus absence from population controls establishes recessive inheritance of this allele.
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: Four children from two consanguineous Lebanese families carried p.Asn76Asp, and the 2020
    review describes one later p.Gln74Pro patient. The 2026 surgical report describes a survivor aged
    13, and cites the 2016 report at molecular diagnosis; neither an explicit allele nor independent
    case identity is established. No population prevalence or carrier-frequency estimate is available;
    the literature counts are historical case descriptions, not a current exhaustive denominator.
  evidence:
  - reference: PMID:33171986
    reference_title: "Skeletal Phenotypes Due to Abnormalities in Mitochondrial Protein Homeostasis and Import."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "More recently, a slightly milder phenotype of SMDMDM was also reported in another patient harboring a nearby variant in PAM16 (Q74P) [59]."
    explanation: >-
      A 2020 review recording the additional patient beyond the two originally reported
      families, which with the four children of those families gives the five-patient
      total this record describes.
pathophysiology:
- name: PAM16 Dysfunction
  biological_scale: MOLECULAR
  description: Biallelic PAM16 missense variants cause SMDMDM. For the founder p.Asn76Asp allele,
    yeast complementation demonstrates conditional loss of MAGMAS stability, matrix-protein import
    and viability. The p.Gln74Pro allele is associated with a milder clinical course and has structural
    predictions, but equivalent allele-specific functional measurements are not reported in the reviewed
    sources. The yeast permissive-temperature phenotype supports residual function in that assay,
    without defining a human physiological threshold.
  genetic_context:
    gene:
      preferred_term: PAM16
      term:
        id: hgnc:29679
        label: PAM16
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
    allele_type: MISSENSE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Homozygous germline NM_016069:c.226A>G (p.Asn76Asp). Graded as a partial rather
      than a complete loss of function because the allele complements a pam16-null
      yeast strain at permissive temperature and only fails as temperature rises.
  biological_processes:
  - preferred_term: J-like negative regulation of the mtHsp70 import-motor ATPase
    modifier: DECREASED
    description: >-
      PAM16/MAGMAS is not itself an ATP-dependent chaperone; it lacks the HPD motif and
      the chaperone is mtHsp70/HSPA9. What it does is restrain the J-domain of DNAJC19
      so that the motor's ATPase is regulated rather than constitutive, which is why
      GO annotates the human protein with negative regulation of ATP-dependent activity
      by direct assay and assigns it no molecular-function term at all.
    term:
      id: GO:0032780
      label: negative regulation of ATP-dependent activity
  locations:
  - preferred_term: trabecular bone tissue
    description: >-
      The tissue in which MAGMAS is expressed at the relevant developmental stage. The
      subcellular site of the protein is the matrix face of the mitochondrial inner
      membrane; that is recorded as a GO cellular component on the import node rather
      than here, because this slot is bound to the anatomical-entity enum.
    term:
      id: UBERON:0002483
      label: trabecular bone tissue
  downstream:
  - target: Impaired TIM23/PAM-Dependent Import of Matrix Preproteins
    causal_link_type: DIRECT
    description: The p.Asn76Asp allele impairs matrix-preprotein import in yeast. A weakened MAGMAS/Pam18
      regulatory subcomplex provides a mechanistic interpretation; extension to p.Gln74Pro and human
      tissues remains untested.
    evidence:
    - reference: PMID:24786642
      reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We further demonstrate that the mutation described here confers to yeast strains a temperature-sensitive phenotype, impairs the import of mitochondrial matrix pre-proteins and induces cell death."
      explanation: The discovery paper's own summary of the causal step from this allele to an import defect, demonstrated by yeast complementation.
  - target: Mitochondrial Network Fragmentation
    description: The p.Asn76Asp allele disrupts mitochondrial network morphology in yeast. This is
      a parallel model consequence of PAM16 dysfunction; the experiment does not isolate an import-mediated
      route.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24786642
      reference_title: The impairment of MAGMAS function in human is responsible for a severe skeletal
        dysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Microscopic examination of mitochondria revealed an unhealthy feature in the mutant
        strain consisting in punctuate and highly fragmented mitochondria that differed from the normal
        reticulated mitochondrial network observed in WT MAGMAS expressing cells.
      explanation: Mutant-versus-wild-type yeast morphology supports an allele effect.
  - target: Bioenergetic Failure and Cell Death
    description: The founder allele induces yeast cell death; depletion of the fly ortholog impairs
      respiration and ATP production. These support a conserved cellular-injury branch, with different
      perturbations and assay systems.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24786642
      reference_title: The impairment of MAGMAS function in human is responsible for a severe skeletal
        dysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We further demonstrate that the mutation described here confers to yeast strains a
        temperature-sensitive phenotype, impairs the import of mitochondrial matrix pre-proteins and
        induces cell death.
      explanation: The disease allele induces cell death in yeast.
  evidence:
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Importantly, the p.Asn76Asp mutation lies in the helix II of MAGMAS J-like domain."
    explanation: >-
      Locates the disease allele in the domain through which MAGMAS regulates the
      import motor. Graded OTHER rather than HUMAN_CLINICAL because the statement is a
      domain-architecture assignment carried over from prior structural work, not an
      observation in patients.
  - reference: PMID:24786642
    reference_title: "The impairment of MAGMAS function in human is responsible for a severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The low expression level of MAGMAS detected in the mutant strain at the non permissive temperature indicates that the p.Asn76Asp mutation confers protein instability."
    explanation: Direct measurement of the protein instability this node asserts, in the yeast complementation system.
  - reference: PMID:39766801
    reference_title: "Hotspots for Disease-Causing Mutations in the Mitochondrial TIM23 Import Complex."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "the Asn76Asp mutation is expected to disrupt hydrogen bonding and electrostatic interactions, thus affecting the stability of the protein. Indeed, the DUET webserver predicts this mutation to be highly destabilizing, with a −1.375 Kcal/mol change in energy"
    explanation: An in silico stability prediction independently agreeing that this substitution destabilises the protein.
  - reference: PMID:33171986

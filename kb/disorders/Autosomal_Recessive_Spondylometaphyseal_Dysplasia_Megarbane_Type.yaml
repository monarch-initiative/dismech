notes: 'Entity verification. `runoak -i sqlite:obo:mondo info MONDO:0013223 -O obo`, run 2026-08-31,
  returns the label "autosomal recessive spondylometaphyseal dysplasia, Megarbane type", the definition
  "Any spondylodysplastic dysplasia in which the cause of the disease is a mutation in the PAM16 gene",
  xrefs OMIM:613320, Orphanet:401979, UMLS:C2750075, MEDGEN:413221, MESH:C567644, DOID:0112304 and
  GARD:0017667, the single relationship `RO:0004003 HGNC:29679 ! PAM16`, and the two superclasses
  MONDO:0016763 and MONDO:0800080 that the stub recorded. `runoak -i sqlite:obo:mondo relationships
  --direction down -p RO:0004003 HGNC:29679` returns exactly one disease, this one, so unlike the
  SDHA or HMGCR situations there is no second PAM16 disease entity to separate.

  Named Entity Confusion. The gene has two names and only one of them is safe to search on. "MAGMAS"
  as a free-text query returns volcanology and a substantial cancer literature that uses MAGMAS as
  a chemoresistance drug target in glioblastoma, ovarian carcinoma and pituitary adenoma; none of
  it concerns this disease, and none of it is cited here. "PAM16" as free text additionally collides
  with PAM4 / PAM16 pulse amplitude modulation in optical communications engineering. Every reference
  in this entry was therefore selected from a PAM16 search combined with a skeletal, Megarbane or
  mitochondrial-import qualifier, and each was read before use. The deep-research report was run against
  MONDO:0013223 and preflighted with `just preflight-dr`, which returned PAM16 mentioned 38 times
  against a top rival of "PAM" at 11 - that rival is the PAM complex acronym from this disease''s
  own mechanism, not a competing gene - and matched the report''s OMIM identifier 613320 to MONDO''s.
  One transcription error in that report was caught and not propagated: it gives the PROVEAN score
  for p.Asn76Asp as -24.021 where the primary paper reports -4.021.

  Allelic series, and what is not a separate disease. Two PAM16 disease alleles are published, p.Asn76Asp
  and p.Gln74Pro, two residues apart in the same helix of the J-like domain. Both reviews that discuss
  the second allele describe its patient as having SMDMDM with a milder course, not a different entity,
  and MONDO carries no second PAM16 disease term, so this is curated as one disease with an allelic
  series rather than as two entries or as parent-and-subtype. A search for a PAM16-related spastic
  paraplegia or other neurological entity was run and returned nothing: `PAM16 AND (spastic OR paraplegia)`
  in PubMed returns zero records, Europe PMC''s `"PAM16" AND ("spastic" OR "paraplegia" OR "neurodegener")`
  returns only reviews of the import machinery, and MONDO links no such disease to HGNC:29679. The
  cardiomyopathy-plus-ataxia phenotype that does exist in this part of the machinery belongs to DNAJC19,
  not PAM16, and is curated here as a differential.

  Provenance limits. The 2016 p.Gln74Pro primary report remains unavailable through the fetched PMID
  record, so its allelic interpretation relies on the two accessible reviews. The 2026 PMID and DOI
  records lack an abstract, but the fetched publisher HTML contains the full article. It cites the
  2016 Moosa report at molecular diagnosis and shares Fano V as an author, suggesting possible longitudinal
  follow-up without explicitly identifying the allele or establishing a distinct patient. Clinical
  details and episode-specific surgical outcomes are curated from that full text. The 2023 nosology
  cache omits group tables; the existing ontology-based classification note is retained.


  Module conformance. No `conforms_to` is declared. There is at present no mitochondrial protein-import
  module in `kb/modules/`, and the closest candidates are not appropriate: `mitochondrial_dysfunction`
  is framed around age-related accumulation rather than a germline hypomorph, `loss_of_proteostasis`
  is likewise an ageing module, and `defective_skeletal_mineralization` concerns calciopenic and phosphopenic
  rickets and mineralisation-inhibitor excess, which is a different mechanism from the one curated
  here. A `mitochondrial_protein_import_failure` module would have several conformers already present
  or implied in the literature - PAM16 here, HSPA9 in EVEN-PLUS, DNAJC19 in DCMA and TIMM50 - and
  is proposed as follow-up work rather than created in this PR.'

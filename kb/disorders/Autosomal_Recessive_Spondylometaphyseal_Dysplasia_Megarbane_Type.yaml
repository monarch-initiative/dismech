      follows the primary family reports.
- reference: PMID:39766801
  title: Hotspots for Disease-Causing Mutations in the Mitochondrial TIM23 Import Complex.
  findings:
  - statement: Jain et al. 2024. Reviews TIM23 mutations and structural predictions for both PAM16

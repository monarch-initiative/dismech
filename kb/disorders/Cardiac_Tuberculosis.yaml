- name: Profibrotic Pericardial Fluid Milieu
  subtypes:
  - Tuberculous pericarditis
  description: >-
    Pericardial fluid carries high interferon-gamma and IL-10 and low levels of
    the anti-fibrotic tetrapeptide AcSDKP, while blood carries high TGF-beta and
    IL-10. This compartmentalised profibrotic response is the proposed driver
    of the high propensity to constriction.
  biological_scale: MOLECULAR
  locations:
  - preferred_term: pericardial cavity
    term:
      id: UBERON:0001074
      label: pericardial cavity
  evidence:
  - reference: PMID:31940097

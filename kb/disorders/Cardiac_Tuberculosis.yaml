    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A profibrotic immune response characterizes TBP, with low levels of
      AcSDKP, high levels of γ-interferon and IL-10 in the pericardium, and high
      levels of TGF-β and IL-10 in the blood.
    explanation: >-
      Describes the profibrotic cytokine profile of tuberculous pericarditis.
  - reference: PMID:32420111
    reference_title: "Tuberculous pericardial disease: a focused update on diagnosis, therapy and prevention of complications."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These new insights may explain in part the high propensity to fibrosis
      associated with the condition
    explanation: >-
      Links the profibrotic pericardial fluid profile to the propensity to
      fibrosis.
  downstream:
  - target: Pericardial Fibrosis and Thickening
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-

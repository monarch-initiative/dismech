name: Cardiac Tuberculosis
creation_date: "2026-11-26T02:08:13Z"
description: >-
  Cardiac tuberculosis is Mycobacterium tuberculosis infection of the heart and
  its coverings. It is overwhelmingly tuberculous pericarditis: bacilli reach
  the pericardium by retrograde lymphatic spread from mediastinal nodes or by
  hematogenous dissemination, and a lymphocyte-dominated, interferon-gamma-rich
  response produces a fibrinous then exudative pericarditis with large
  serosanguineous effusions, cardiac tamponade, and in a minority progression
  through effusive-constrictive disease to fibrotic constrictive pericarditis.
  Myocardial tuberculosis is rare, often diagnosed post mortem, and presents
  with arrhythmia, heart failure and sudden cardiac death. HIV co-infection
  drives much of the current burden in sub-Saharan Africa and changes the
  presentation and natural history.
category: Infectious Disease
disease_term:
  preferred_term: cardiac tuberculosis
  term:
    id: MONDO:0000813
    label: cardiac tuberculosis
parents:
- Tuberculosis
- Extrapulmonary tuberculosis
synonyms:
- cardiac TB
- tuberculosis of the heart
notes: >-
  Scope. MONDO:0000813 has no MONDO children. Pericardial tuberculosis
  (MONDO:0005903, synonym tuberculous pericarditis) is a sibling under
  extrapulmonary tuberculosis rather than a child, and is recorded here as the
  dominant subtype; it is also a subtype row of Pericarditis.yaml, which curates
  pericarditis across all triggers. The MONDO definition of cardiac
  tuberculosis (from MeSH D014381, Tuberculosis, Cardiovascular) also mentions
  the blood vessels. This entry covers the heart only, the pericardium and the
  myocardium, which is what its label names; tuberculous aortitis and other
  vascular involvement are not curated here. The pathophysiology nodes are
  scoped to the pericardial or myocardial subtype with `subtypes`, so that no
  pericardial node is asserted of isolated myocardial disease. Seeded from
  research/Cardiac_Tuberculosis-deep-research-claude_code.md, used as leads
  only; every claim is supported by an evidence item quoting a cached
  abstract or full text.
infectious_agent:
- name: Mycobacterium tuberculosis
  infectious_agent_term:
    preferred_term: Mycobacterium tuberculosis
    term:
      id: NCBITaxon:1773
      label: Mycobacterium tuberculosis
  description: >-
    The acid-fast intracellular bacillus that causes tuberculosis; in cardiac
    tuberculosis it reaches the pericardium or myocardium from a pulmonary,
    nodal or disseminated focus.
  evidence:
  - reference: PMID:31940097
    reference_title: "Diagnosis and Management of Tuberculous Pericarditis: What Is New?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mycobacterium tuberculosis (Mtb) bacilli can enter the pericardium by
      retrograde lymphatic spread, hematogenous dissemination, or, uncommonly,
      by direct contiguous spread from adjacent infected structures such as the
      lungs, pleura, and spine
    explanation: >-
      Names M. tuberculosis as the organism that enters the pericardium in
      tuberculous pericarditis.
agent_life_cycle:
  description: >-
    M. tuberculosis is transmitted between humans as airborne droplet nuclei.
    Cardiac disease arises not from a separate exposure but from spread within
    an already infected host, from mediastinal or peribronchial lymph nodes or
    from the bloodstream.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Airborne Mycobacterium tuberculosis acquisition
  description: >-
    The host acquires M. tuberculosis by inhaling airborne bacilli. Cardiac
    involvement follows later, by spread within the host (see the pathophysiology
    node on spread to the heart), not by a separate transmission route.
- name: Retrograde lymphatic spread to the pericardium
  description: >-
    Within the infected host, bacilli reach the pericardium by retrograde
    lymphatic spread from mediastinal lymph nodes, the classical route in
    HIV-uninfected patients.
  evidence:
  - reference: PMID:31940097
    reference_title: "Diagnosis and Management of Tuberculous Pericarditis: What Is New?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mycobacterium tuberculosis (Mtb) bacilli can enter the pericardium by
      retrograde lymphatic spread, hematogenous dissemination, or, uncommonly,
      by direct contiguous spread from adjacent infected structures such as the
      lungs, pleura, and spine
    explanation: >-
      Lists retrograde lymphatic spread among the routes by which bacilli reach
      the pericardium.
- name: Hematogenous dissemination to the heart
  description: >-
    Bloodborne spread seeds the pericardium or myocardium, and is the most
    common route in HIV co-infected patients, in whom tuberculous pericarditis
    is more often part of disseminated disease.
  evidence:
  - reference: PMID:31940097
    reference_title: "Diagnosis and Management of Tuberculous Pericarditis: What Is New?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most common mechanism of Mtb spread in HIV co-infected individuals is
      via hematogenous dissemination
    explanation: >-
      Identifies hematogenous dissemination as the dominant route of pericardial
      seeding with HIV co-infection.
has_subtypes:
- name: Tuberculous pericarditis
  display_name: Tuberculous pericarditis
  subtype_term:
    preferred_term: pericardial tuberculosis
    term:
      id: MONDO:0005903
      label: pericardial tuberculosis
  description: >-
    Tuberculosis of the pericardium, by far the most common cardiac
    manifestation. It differs from myocardial tuberculosis in presentation
    (effusion, tamponade and constriction rather than arrhythmia), in diagnosis
    (pericardial fluid ADA, unstimulated interferon-gamma and culture), and in
    management (pericardiocentesis and pericardiectomy).
  evidence:
  - reference: PMID:41356306
    reference_title: Cardiovascular Complications from Tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cardiovascular involvement in tuberculosis primarily affects the
      pericardium, less often the myocardium, and the aorta
    explanation: >-
      Establishes the pericardium as the main site of cardiovascular
      tuberculosis, with the myocardium less often involved.
  - reference: PMID:41356306
    reference_title: Cardiovascular Complications from Tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In contrast, TB myocarditis may present with new-onset chest pain,
      dyspnea, and heart failure, accompanied by distinct ECG abnormalities,
      and echocardiography may reveal new myocardial dysfunctions, while no
      pericardial effusion may be present.
    explanation: >-
      Contrasts the presentation of myocardial with pericardial tuberculosis,
      the axis on which the two subtypes differ.
- name: Myocardial tuberculosis
  display_name: Tuberculous myocarditis
  description: >-
    Rare tuberculous involvement of the myocardium, as nodular caseating
    tubercles, miliary tubercles, or a diffuse infiltrative form associated
    with pericarditis. It differs from the pericardial subtype in presentation
    (ventricular arrhythmia, conduction disease, heart failure, sudden cardiac
    death), in being frequently diagnosed only at autopsy, and in prognosis,
    since the risk of sudden death is not reduced by antituberculous therapy.
    No MONDO term exists for it, so subtype_term is omitted.
  evidence:
  - reference: PMID:26327955
    reference_title: "Patterns and clinical manifestations of tuberculous myocarditis: a systematic review of cases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Three distinct forms of myocardial involvement are recognized: nodular
      tubercles of the myocardium (characterized by central caseation); miliary
      tubercles of the myocardium (resulting from hematogenous spread); and an
      uncommon diffuse infiltrative type associated with tuberculous
      pericarditis (characterized microscopically by giant cells and
      lymphocytes)
    explanation: >-
      Defines the three morphological forms of myocardial tuberculosis.
  - reference: PMID:26327955
    reference_title: "Patterns and clinical manifestations of tuberculous myocarditis: a systematic review of cases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: >-
      Tuberculosis is a rare cause of myocarditis. It is however associated
      with a high mortality when it occurs and is often diagnosed at
      post-mortem.
    explanation: >-
      Documents the rarity, high mortality and frequent post-mortem diagnosis
      that set the myocardial subtype apart.
prevalence:
- population: Patients with active tuberculosis
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Cardiac involvement is reported in about one per cent of patients with
    active tuberculosis. This is a share of tuberculosis cases, not a
    population prevalence or incidence, so no rate_per_100000 is asserted.
  evidence:
  - reference: PMID:18776964
    reference_title: Tuberculous effusive-constrictive pericarditis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Cardiac involvement occurs in approximately one per cent of patients
      suffering from active tuberculosis.
    explanation: >-
      Gives the approximate share of active tuberculosis with cardiac
      involvement, mainly pericardial.
- population: Patients with large pericardial effusion, Western Cape, South Africa
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Tuberculosis caused 69.5% (162 of 233) of large pericardial effusions at a
    Cape Town academic hospital, and 81 of 84 HIV-positive patients with a large
    effusion had tuberculous pericarditis. This is an aetiological fraction
    among effusions, not an occurrence rate.
  evidence:
  - reference: PMID:15962545
    reference_title: Epidemiology of pericardial effusions at a large academic hospital in South Africa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Tuberculous pericarditis was the most common cause of pericardial
      effusions (69.5%, n=162).
    explanation: >-
      Quantifies tuberculosis as the leading cause of large effusion in a high
      burden setting.
  - reference: PMID:15962545
    reference_title: Epidemiology of pericardial effusions at a large academic hospital in South Africa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Eighty-four patients (36.1%) were found to be HIV positive; 81 of these
      (96.4 %) had tuberculous pericarditis.
    explanation: >-
      Shows that nearly all large effusions in HIV-positive patients in this
      cohort were tuberculous.
environmental:
- name: HIV co-infection
  description: >-
    HIV infection is the main host modifier of tuberculous pericarditis in
    sub-Saharan Africa. It favours hematogenous dissemination, larger effusions
    with more myocardial involvement and haemodynamic compromise, and is
    associated with less progression to constriction.
  influences_mechanisms:
  - target: Mycobacterium tuberculosis Spread to the Heart
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In HIV co-infection, spread to the pericardium is most often by
      hematogenous dissemination as part of disseminated tuberculosis.
    evidence:
    - reference: PMID:22427006
      reference_title: Tuberculous pericarditis with and without HIV.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        In patients with HIV, because TB pericarditis more often occurs as part
        of a disseminated process, the infection itself has a greater impact on
        the morbidity and mortality.
      explanation: >-
        Links HIV co-infection to tuberculous pericarditis arising within
        disseminated disease.
  - target: Pericardial Fibrosis and Thickening
    environmental_effect: MODULATES
    causal_link_type: UNKNOWN
    description: >-
      HIV infection is associated with a lower incidence of constriction. The
      mechanism is not established; the cited studies report the association
      only.
    evidence:
    - reference: PMID:18523576
      reference_title: "HIV infection is associated with a lower incidence of constriction in presumed tuberculous pericarditis: a prospective observational study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        None of the 33 HIV seropositive patients developed constriction, but 8
        (24.2%, 95%CI 11.1-42.3%) of the 33 HIV seronegative patients did (P =
        0.005).
      explanation: >-
        Prospective multicentre cohort showing less constriction in HIV
        seropositive patients.
  evidence:
  - reference: PMID:22427006
    reference_title: Tuberculous pericarditis with and without HIV.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      HIV-associated TB pericarditis is a more aggressive disease with a greater
      degree of myocardial involvement.
    explanation: >-
      Describes the more aggressive course of HIV-associated disease.
  - reference: PMID:42568159
    reference_title: "The impact of HIV co-infection on presentation and outcome in adults with tuberculous pericarditis: Findings from the IMPI trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      HIV-infected (v. uninfected) patients were less likely to develop
      constrictive pericarditis (4.1% v. 10.0% at 1 year, p<0.0001 (hazard
      ratio (HR) 0.41, 95% confidence interval (CI) 0.27 - 0.63, p<0.0001)).
    explanation: >-
      In 1 370 IMPI trial participants, HIV co-infection was associated with
      less constriction at one year.
  - reference: PMID:42568159
    reference_title: "The impact of HIV co-infection on presentation and outcome in adults with tuberculous pericarditis: Findings from the IMPI trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      However, there was no difference in case fatality rate at 1 year (14.9%
      v. 12.2%, respectively, p=0.09; (HR 1.20, 95%CI 0.90 - 1.59, p=0.22)).
    explanation: >-
      In the same trial cohort HIV did not significantly raise one-year case
      fatality, qualifying earlier registry reports of higher HIV-associated
      mortality.
pathophysiology:
- name: Mycobacterium tuberculosis Spread to the Heart
  role: trigger
  description: >-
    Bacilli from a pulmonary, mediastinal nodal or disseminated focus reach the
    pericardium, or less often the myocardium, by retrograde lymphatic spread,
    hematogenous dissemination, or rarely direct extension.
  biological_scale: ORGANISM
  locations:
  - preferred_term: mediastinal lymph node
    term:
      id: UBERON:0002524
      label: mediastinal lymph node
  - preferred_term: pericardium
    term:
      id: UBERON:0002407
      label: pericardium
  evidence:
  - reference: PMID:31940097
    reference_title: "Diagnosis and Management of Tuberculous Pericarditis: What Is New?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mycobacterium tuberculosis (Mtb) bacilli can enter the pericardium by
      retrograde lymphatic spread, hematogenous dissemination, or, uncommonly,
      by direct contiguous spread from adjacent infected structures such as the
      lungs, pleura, and spine
    explanation: >-
      States the routes of pericardial seeding.
  - reference: PMID:26327955
    reference_title: "Patterns and clinical manifestations of tuberculous myocarditis: a systematic review of cases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The myocardium may be involved by hematogenous spread, by retrograde
      lymphatic spread from mediastinal lymph nodes or by direct invasion from
      the pericardium
    explanation: >-
      States the same routes for myocardial seeding, including retrograde
      spread from mediastinal nodes.
  downstream:
  - target: Multibacillary Pericardial Infection
    causal_link_type: DIRECT
    description: >-
      Seeded bacilli replicate within the pericardial space.
  - target: Tuberculous Myocardial Infiltration
    causal_link_type: DIRECT
    description: >-
      Hematogenous, lymphatic or contiguous spread seeds the myocardium.
- name: Multibacillary Pericardial Infection
  subtypes:
  - Tuberculous pericarditis
  description: >-
    Contrary to the older view of a paucibacillary hypersensitivity process,
    pericardial fluid in culture-positive tuberculous pericarditis can carry a
    high bacillary load, and a high load is associated with mortality. Standard
    rifampicin, ethambutol and pyrazinamide reach the pericardial fluid below
    their inhibitory concentrations, which may let this burden persist.
  biological_scale: TISSUE
  locations:
  - preferred_term: pericardial cavity
    term:
      id: UBERON:0001074
      label: pericardial cavity
  evidence:
  - reference: PMID:31940097
    reference_title: "Diagnosis and Management of Tuberculous Pericarditis: What Is New?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In at least some subsets of patients, TBP is, in fact, multibacillary
      with significant implications for both outcomes and ensuring that current
      drug regimens are effective at penetrating the pericardium to do their
      work.
    explanation: >-
      Reframes tuberculous pericarditis as multibacillary in at least some
      patients.
  - reference: PMID:26870789
    reference_title: Tuberculous Pericarditis is Multibacillary and Bacterial Burden Drives High Mortality.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Multivariable analysis based on time-to-death as an outcome on follow-up
      in a Cox proportional hazards model revealed a hazards-ratio of 3.57 (95%
      confidence interval: 1.27–10·00; p = 0.016) in patients > 29 years and
      2.91 (95% confidence interval: 1.03–8·21; p = 0.044) in patients with
      pericardial Mtb > 5.53 log10CFU/mL.
    explanation: >-
      In the IMPI registry, a high pericardial bacillary load independently
      predicted death.
  downstream:
  - target: Fibrinous Pericardial Inflammation
    causal_link_type: DIRECT
    description: >-
      Bacilli and their antigens in the pericardium elicit the early fibrinous
      inflammatory exudate.
- name: Fibrinous Pericardial Inflammation
  subtypes:
  - Tuberculous pericarditis
  description: >-
    The first, dry stage: fibrinous exudation with a neutrophilic response,
    relatively abundant mycobacteria and a loose organisation of macrophages
    and T cells into early granulomas. Clinically it is an acute pericarditis
    without effusion, and it is the least often seen stage.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: acute inflammatory response
    term:
      id: GO:0002526
      label: acute inflammatory response
    modifier: INCREASED
  - preferred_term: granuloma formation
    term:
      id: GO:0002432
      label: granuloma formation
    modifier: INCREASED
  locations:
  - preferred_term: pericardium
    term:
      id: UBERON:0002407
      label: pericardium
  evidence:
  - reference: PMID:31940097
    reference_title: "Diagnosis and Management of Tuberculous Pericarditis: What Is New?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Fibrinous exudation predominates; occurrence of polymorphonuclear
      leucytosis is first seen with relatively abundant mycobacteria. There is a
      loose organization of macrophages and T cells with early granuloma
      formation
    explanation: >-
      Describes the pathology of stage 1 tuberculous pericarditis.
  downstream:
  - target: Pericardial Th1 Lymphocytic Response
    causal_link_type: DIRECT
    description: >-
      The early granulomatous inflammation recruits antigen-specific T cells
      into the pericardium.
  - target: Chest pain
    causal_link_type: DIRECT
    description: >-
      Fibrinous pericardial inflammation produces pericarditic chest pain.
    evidence:
    - reference: PMID:31940097
      reference_title: "Diagnosis and Management of Tuberculous Pericarditis: What Is New?"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Patients present acute pericarditis with chest pain, pericardial
        friction rub, and widespread ST elevation without effusion
      explanation: >-
        Gives chest pain as the clinical manifestation of the dry stage.
  - target: Pericardial friction rub
    causal_link_type: DIRECT
    description: >-
      Fibrin-coated inflamed pericardial layers produce a friction rub.
    evidence:
    - reference: PMID:31940097
      reference_title: "Diagnosis and Management of Tuberculous Pericarditis: What Is New?"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Patients present acute pericarditis with chest pain, pericardial
        friction rub, and widespread ST elevation without effusion
      explanation: >-
        Gives the friction rub as a clinical manifestation of the dry stage.
- name: Pericardial Th1 Lymphocytic Response
  subtypes:
  - Tuberculous pericarditis
  description: >-
    CD4-positive effector memory T cells (CD8-positive T cells in HIV
    co-infection) accumulate in the pericardial fluid and secrete large amounts
    of interferon-gamma, the basis of the unstimulated interferon-gamma
    diagnostic test.
  biological_scale: CELLULAR
  conforms_to: "granuloma_formation#Th1 and TNF-Driven Macrophage Recruitment and Activation"
  cell_types:
  - preferred_term: CD4-positive effector memory T cell
    term:
      id: CL:0000905
      label: effector memory CD4-positive, alpha-beta T cell
  - preferred_term: CD8-positive T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: interferon-gamma production
    term:
      id: GO:0032609
      label: type II interferon production
    modifier: INCREASED
  locations:
  - preferred_term: pericardial cavity
    term:
      id: UBERON:0001074
      label: pericardial cavity
  evidence:
  - reference: PMID:31940097
    reference_title: "Diagnosis and Management of Tuberculous Pericarditis: What Is New?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      in HIV-uninfected TBP patients, pericardial fluid (PCF) lymphocytes are
      predominantly CD4+ effector memory T cells and the PCF lymphocytes in
      HIV-infected patients are dominated by CD8+ T cells
    explanation: >-
      Identifies the dominant pericardial T-cell populations with and without
      HIV.
  - reference: PMID:31940097
    reference_title: "Diagnosis and Management of Tuberculous Pericarditis: What Is New?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Gamma-interferon (IFN-γ) is produced in large amounts by both CD-4+ and
      CD-8+ T lymphocytes in the setting of TBP
    explanation: >-
      Supports increased interferon-gamma production by pericardial T cells.
  downstream:
  - target: Lymphocytic Exudative Pericardial Effusion
    causal_link_type: DIRECT
    description: >-
      The lymphocytic inflammatory response drives accumulation of a
      protein-rich exudate in the pericardial sac.
  - target: Profibrotic Pericardial Fluid Milieu
    causal_link_type: DIRECT
    description: >-
      The T-cell and macrophage response releases the cytokines that make up
      the profibrotic pericardial milieu.
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The systemic inflammatory response to tuberculous infection produces
      fever.
  - target: Night sweats
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Night sweats are a constitutional symptom of the tuberculous inflammatory
      response.
  - target: Weight loss
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Weight loss is a constitutional consequence of chronic tuberculous
      inflammation.
- name: Lymphocytic Exudative Pericardial Effusion
  subtypes:
  - Tuberculous pericarditis
  description: >-
    The second, effusive stage and the most common presentation: a
    lymphocyte-predominant, protein-rich, often bloodstained exudate
    accumulates, frequently in large volume.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: lymphocyte
    term:
      id: CL:0000542
      label: lymphocyte
  locations:
  - preferred_term: pericardial cavity
    term:
      id: UBERON:0001074
      label: pericardial cavity
  evidence:
  - reference: PMID:31940097
    reference_title: "Diagnosis and Management of Tuberculous Pericarditis: What Is New?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      There are predominantly lymphocytic exudates with monocytes and foam
      cells; presence of serosanguineous effusion is seen
    explanation: >-
      Describes the pathology of the effusive stage.
  - reference: PMID:31940097
    reference_title: "Diagnosis and Management of Tuberculous Pericarditis: What Is New?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A typical finding from the aspirated fluid is a protein-rich lymphocytic
      exudate that is frequently macroscopically bloodstained.
    explanation: >-
      Describes the aspirated pericardial fluid.
  downstream:
  - target: Pericardial effusion
    causal_link_type: DIRECT
    description: >-
      The accumulating exudate is the pericardial effusion seen on imaging.
  - target: Cardiac Compression by Pericardial Fluid
    causal_link_type: DIRECT
    description: >-
      A large or rapidly accumulating effusion raises intrapericardial pressure
      and compresses the cardiac chambers.
- name: Cardiac Compression by Pericardial Fluid
  subtypes:
  - Tuberculous pericarditis
  description: >-
    Fluid in the pericardial sac compresses the heart throughout the cardiac
    cycle, impairing filling and output and producing tamponade and the heart
    failure syndrome that dominates presentation.
  biological_scale: ORGANISM
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:31940097
    reference_title: "Diagnosis and Management of Tuberculous Pericarditis: What Is New?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      fluid accumulation within the pericardium which compresses the heart
      chambers throughout the cardiac cycle impeding both cardiac filling and

  phenotype_term:
    preferred_term: Ventricular fibrillation
    term:
      id: HP:0001663
      label: Ventricular fibrillation
  evidence:
  - reference: PMID:26327955
    reference_title: "Patterns and clinical manifestations of tuberculous myocarditis: a systematic review of cases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      It is mostly asymptomatic but may present with ventricular fibrillation,
      long QT syndrome, congestive heart failure, dilated cardiomyopathy and
      even sudden cardiac arrest.
    explanation: >-
      Ventricular fibrillation is a recognised presentation of tuberculous
      myocarditis.
- name: Sudden cardiac death
  subtype: Myocardial tuberculosis
  phenotype_term:
    preferred_term: Sudden cardiac death
    term:
      id: HP:0001645
      label: Sudden cardiac death
  evidence:
  - reference: PMID:26327955
    reference_title: "Patterns and clinical manifestations of tuberculous myocarditis: a systematic review of cases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: >-
      Eleven (68%) of the patients responded well to antituberculosis treatment
      with 5 (31%) fatalities from sudden cardiac death recorded
    explanation: >-
      Sudden cardiac death in about a third of pooled tuberculous myocarditis
      cases.
progression:
- phase: Dry stage
  notes: >-
    Stage 1, fibrinous exudation with early granulomas and acute pericarditis
    without effusion. The least common presentation.
  evidence:
  - reference: PMID:31940097
    reference_title: "Diagnosis and Management of Tuberculous Pericarditis: What Is New?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Dry stage (the least common form seen)
    explanation: >-
      Names the dry stage and its rarity.
- phase: Effusive stage
  notes: >-
    Stage 2, lymphocytic serosanguineous effusion with heart failure or
    tamponade. The most common presentation.
  evidence:
  - reference: PMID:31940097
    reference_title: "Diagnosis and Management of Tuberculous Pericarditis: What Is New?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Effusive stage (most common form seen)
    explanation: >-
      Names the effusive stage as the most common.
- phase: Effusive-constrictive stage
  notes: >-
    Between stages 2 and 3, visceral constriction coexists with a tense
    effusion, so tamponade and constrictive physiology overlap and the
    constriction becomes evident after drainage.
  evidence:
  - reference: PMID:31940097
    reference_title: "Diagnosis and Management of Tuberculous Pericarditis: What Is New?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Some patients present with a combination of both tamponade and
      constrictive physiology believed to be a stage between 2 and 3
      (effusive-constrictive)
    explanation: >-
      Places effusive-constrictive disease between the effusive and absorptive
      stages.
  - reference: PMID:18776964
    reference_title: Tuberculous effusive-constrictive pericarditis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Effusive-constrictive pericarditis is a clinical haemodynamic syndrome in
      which constriction by the visceral pericardium occurs in the presence of a
      tense effusion in a free pericardial space.
    explanation: >-
      Defines the effusive-constrictive syndrome.
- phase: Absorptive stage
  notes: >-
    Stage 3, the effusion is resorbed and caseation organises into fibrin and
    collagen, thickening the pericardium.
  evidence:
  - reference: PMID:31940097
    reference_title: "Diagnosis and Management of Tuberculous Pericarditis: What Is New?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      At this stage, there is absorption of effusion, granulomatous caseation
      becomes organized and perocardial thickening occurs due to fibrin
      deposition of collagen, and ultimately fibrosis
    explanation: >-
      Describes the absorptive stage.
- phase: Constrictive stage
  notes: >-
    Stage 4, a fibrocalcific pericardium contracts on the heart and impedes
    diastolic filling.
  evidence:
  - reference: PMID:31940097
    reference_title: "Diagnosis and Management of Tuberculous Pericarditis: What Is New?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Constructive scarring (the fibrosing visceral and parietal pericardium
      contracts on the cardiac chambers).
    explanation: >-
      Describes the constrictive stage. "Constructive" is the source's own
      wording.
diagnosis:
- name: Pericardiocentesis with pericardial fluid microbiology
  description: >-
    Definite tuberculous pericarditis is demonstration of tubercle bacilli in
    pericardial fluid or pericardial tissue; probable disease rests on
    tuberculosis elsewhere, a lymphocytic exudate with raised adenosine
    deaminase, or response to therapy. Culture is slow and of moderate
    sensitivity.
  evidence:
  - reference: PMID:16330703
    reference_title: Tuberculous pericarditis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A "definite" diagnosis of tuberculous pericarditis is based on the
      demonstration of tubercle bacilli in pericardial fluid or on a
      histological section of the pericardium
    explanation: >-
      States the criterion for definite tuberculous pericarditis.
  - reference: PMID:31940097
    reference_title: "Diagnosis and Management of Tuberculous Pericarditis: What Is New?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Culture of pericardial fluid remains the most widely used diagnostic test
      for TBP with sensitivity ranging between 53 and 75%; however, it takes at
      least 3 weeks to yield results
    explanation: >-
      Gives the sensitivity and turnaround of pericardial fluid culture.
- name: Pericardial fluid adenosine deaminase
  description: >-
    Raised adenosine deaminase activity in pericardial fluid is a sensitive
    adjunctive marker of a tuberculous cause.
  evidence:
  - reference: PMID:26636531
    reference_title: "Diagnostic accuracy of adenosine deaminase for tuberculous pericarditis: a meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The summary estimates of adenosine deaminase for diagnosing tuberculous
      pericarditis were listed as follows: sensitivity of 0.90 (95% CI:
      0.86-0.93), specificity of 0.86 (95% CI: 0.83-0.89)
    explanation: >-
      Meta-analysis of 11 studies giving pooled ADA accuracy.
  - reference: PMID:17121764
    reference_title: Diagnosing tuberculous pericarditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      pericardial fluid ADA >or=40 U/l had 87% sensitivity and 89% specificity
    explanation: >-
      Accuracy of a 40 U/l ADA cut-off in a prospective cohort of 233 patients
      with pericardial effusion.
- name: Pericardial fluid unstimulated interferon-gamma
  description: >-
    Unstimulated interferon-gamma in pericardial fluid, the product of the
    pericardial Th1 response, was more specific than adenosine deaminase and
    more sensitive than Xpert MTB/RIF in a prospective high-burden cohort.
  evidence:
  - reference: PMID:24942470
    reference_title: "Diagnostic accuracy of quantitative PCR (Xpert MTB/RIF) for tuberculous pericarditis compared to adenosine deaminase and unstimulated interferon-γ in a high burden setting: a prospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      uIFNγ offers superior accuracy for the diagnosis of microbiologically
      confirmed TBP compared to the ADA assay and the Xpert MTB/RIF test.
    explanation: >-
      Prospective Cape Town study of 151 patients comparing the three tests.
  - reference: PMID:17121764
    reference_title: Diagnosing tuberculous pericarditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Pericardial fluid IFN-gamma >or=50 pg/ml, concentration had 92%
      sensitivity, 100% specificity and a positive predictive value (PPV) of
      100% for the diagnosis of tuberculous pericarditis
    explanation: >-
      Earlier prospective cohort showing high accuracy of pericardial
      interferon-gamma.
- name: Pericardial fluid Xpert MTB/RIF
  description: >-
    Cartridge nucleic-acid amplification on pericardial fluid is highly
    specific and gives rifampicin resistance within hours, but misses about a
    third of cases.
  evidence:
  - reference: PMID:32802321
    reference_title: "Diagnostic test accuracy of Xpert MTB/RIF for tuberculous pericarditis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Xpert MTB/RIF had a robust specificity but unsatisfactory sensitivity in
      diagnosing TB pericarditis.
    explanation: >-
      Meta-analysis of nine studies of pericardial fluid Xpert MTB/RIF.
- name: Tygerberg clinical prediction score
  description: >-
    A clinical diagnostic index derived in Cape Town for patients with
    pericardial effusion in a high tuberculosis burden setting, for use where
    pericardial fluid tests are unavailable or pending. It combines five
    independently predictive features: fever, night sweats, weight loss, serum
    globulin above 40 g/l, and a peripheral blood leukocyte count below 10 x
    10^9/l.
  notes: >-
    The cited abstract reports the model's predictors and accuracy but not its
    item weights or its cut-off. Secondary sources give the cut-off as a score
    of 6 or more, or as more than 6, and disagree with each other; this entry
    does not assert either.
  evidence:
  - reference: PMID:17121764
    reference_title: Diagnosing tuberculous pericarditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Fever, night sweats, weight loss, serum globulin (>40 g/l) and peripheral
      blood leukocyte count (<10 x 10(9)/l) were independently predictive.
    explanation: >-
      Names the five predictors that make up the model.
  - reference: PMID:17121764
    reference_title: Diagnosing tuberculous pericarditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The derived prediction model had 86% sensitivity and 84% specificity when
      applied to the study population.
    explanation: >-
      Reports the model's accuracy in its derivation cohort of 233 patients;
      it has not been validated here against an external cohort.
treatments:
- name: Standard Four-Drug Antituberculous Therapy
  description: >-
    Isoniazid, rifampicin, pyrazinamide and ethambutol for six months, the
    standard of care. Pericardial fluid concentrations of rifampicin,
    ethambutol and pyrazinamide fall below their inhibitory concentrations,
    and only isoniazid reaches adequate levels, which may contribute to
    treatment failure and has prompted trials of higher rifampicin doses.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Multibacillary Pericardial Infection
    treatment_effect: INHIBITS
    description: >-
      Bactericidal therapy kills bacilli in the pericardium, limited by poor
      pericardial penetration of the sterilising drugs.
  - target: Tuberculous Myocardial Infiltration
    treatment_effect: INHIBITS
    description: >-
      Most myocardial tuberculosis responds to antituberculous therapy, though
      the risk of sudden death persists.
  evidence:
  - reference: PMID:16330703
    reference_title: Tuberculous pericarditis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment consists of the standard 4-drug antituberculosis regimen for 6
      months.
    explanation: >-
      States the standard regimen.
  - reference: PMID:26870790
    reference_title: Poor Penetration of Antibiotics Into Pericardium in Pericardial Tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Pericardial concentrations of the key sterilizing drugs for TB were below
      MIC, which could contribute to poor outcomes.
    explanation: >-
      Pharmacokinetic study in tuberculous pericarditis showing subtherapeutic
      pericardial drug levels.
  - reference: PMID:26327955
    reference_title: "Patterns and clinical manifestations of tuberculous myocarditis: a systematic review of cases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Almost all cases are responsive to anti-tuberculosis drug therapy, but the
      risk of sudden cardiac death from this condition is not reduced by the
      treatment
    explanation: >-
      Supports antituberculous therapy for myocardial tuberculosis, with its
      limitation.
- name: Pericardiocentesis
  description: >-
    Echocardiographic or fluoroscopic needle drainage of the pericardial fluid,
    the treatment of choice for tamponade, and diagnostic as well as
    therapeutic. Higher rates of drainage in recent cohorts coincide with
    lower constriction rates, which is circumstantial rather than trial
    evidence.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Pericardiocentesis
    term:
      id: NCIT:C52010
      label: Pericardiocentesis
  target_mechanisms:
  - target: Cardiac Compression by Pericardial Fluid
    treatment_effect: INHIBITS
    description: >-
      Evacuating the fluid relieves compression of the cardiac chambers.
  evidence:
  - reference: PMID:31940097
    reference_title: "Diagnosis and Management of Tuberculous Pericarditis: What Is New?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Echocardiographic- or fluoroscopic-guided needle pericardiocentesis
      remains the treatment of choice to evacuate the pericardium of
      compressive pericardial fluid and alleviate cardiac tamponade.
    explanation: >-
      Establishes pericardiocentesis as the treatment for tamponade.
- name: Adjunctive Prednisolone
  description: >-
    Six weeks of adjunctive prednisolone in the IMPI trial did not reduce the
    composite of death, tamponade or constriction, but reduced constriction and
    hospitalisation, at the cost of more HIV-associated cancer. Guidelines
    suggest it may be reasonable in HIV-negative patients and avoid it in HIV
    infection.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisolone
      term:
        id: CHEBI:8378
        label: prednisolone
  target_mechanisms:
  - target: Pericardial Fibrosis and Thickening
    treatment_effect: INHIBITS
    description: >-
      Prednisolone reduced the incidence of constrictive pericarditis,
      consistent with damping the fibrotic organisation of the exudate.
  evidence:
  - reference: PMID:25178809
    reference_title: Prednisolone and Mycobacterium indicus pranii in tuberculous pericarditis.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      There was no significant difference in the primary outcome between
      patients who received prednisolone and those who received placebo (23.8%
      and 24.5%, respectively; hazard ratio, 0.95; 95% confidence interval
      [CI], 0.77 to 1.18; P=0.66)
    explanation: >-
      Refutes a benefit of prednisolone on the IMPI composite primary outcome
      in 1400 adults.
  - reference: PMID:25178809
    reference_title: Prednisolone and Mycobacterium indicus pranii in tuberculous pericarditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Prednisolone therapy, as compared with placebo, was associated with
      significant reductions in the incidence of constrictive pericarditis
      (4.4% vs. 7.8%; hazard ratio, 0.56; 95% CI, 0.36 to 0.87; P=0.009) and
      hospitalization
    explanation: >-
      Supports a reduction in constriction with prednisolone, the basis for
      targeting the fibrosis node.
  - reference: PMID:31940097
    reference_title: "Diagnosis and Management of Tuberculous Pericarditis: What Is New?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the European Society of Cardiology pericardial disease guidelines
      recommend that it may be reasonable to use adjunctive corticosteroids at a
      tapering dose of 120 mg of prednisolone over 6 weeks in patients with TBP
      without HIV infection, and to avoid their use in HIV-infected individuals
      because of the increased risk of malignancy
    explanation: >-
      Summarises the guideline position by HIV status.
- name: Mycobacterium indicus pranii Immunotherapy
  description: >-
    Five injections of heat-killed Mycobacterium indicus pranii over three
    months, tested in the IMPI factorial trial. It had no effect on the
    composite outcome and increased HIV-associated cancer, so it is not
    recommended; it is recorded here as a tested and refuted intervention.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: Immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
  evidence:
  - reference: PMID:25178809
    reference_title: Prednisolone and Mycobacterium indicus pranii in tuberculous pericarditis.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In patients with tuberculous pericarditis, neither prednisolone nor M.
      indicus pranii had a significant effect on the composite of death,
      cardiac tamponade requiring pericardiocentesis, or constrictive
      pericarditis.
    explanation: >-
      Refutes clinical benefit of M. indicus pranii immunotherapy.
  - reference: PMID:25178809
    reference_title: Prednisolone and Mycobacterium indicus pranii in tuberculous pericarditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Both prednisolone and M. indicus pranii, each as compared with placebo,
      were associated with a significant increase in the incidence of cancer
    explanation: >-
      Records the cancer harm signal for both interventions.
- name: Pericardiectomy
  description: >-
    Surgical resection of the pericardium, the definitive treatment of
    constriction. Many experts try antituberculous therapy first for
    noncalcific constriction and operate on non-responders after 4 to 8 weeks.
    Perioperative mortality in tuberculous series is around 6 to 9%, and
    ascites and longer symptom duration predict death, which argues for early
    operation.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Pericardiectomy
    term:
      id: NCIT:C51643
      label: Pericardiectomy
  target_mechanisms:
  - target: Pericardial Constriction of Diastolic Filling
    treatment_effect: INHIBITS
    description: >-
      Removing the constricting pericardium restores diastolic filling.
  evidence:
  - reference: PMID:16330703
    reference_title: Tuberculous pericarditis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Surgical resection of the pericardium remains the appropriate treatment
      for constrictive pericarditis.
    explanation: >-
      Establishes pericardiectomy as the treatment of constriction.
  - reference: PMID:16330703
    reference_title: Tuberculous pericarditis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      many experts recommend a trial of medical therapy for noncalcific
      pericardial constriction, and pericardiectomy in nonresponders after 4 to
      8 weeks of antituberculosis chemotherapy
    explanation: >-
      Describes the usual timing of surgery.
  - reference: PMID:16776460
    reference_title: "Chronic constrictive tuberculous pericarditis: risk factors and outcome of pericardiectomy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Perioperative mortality was 8.6%. During follow-up (mean 66.4 +/- 56.4),
      late mortality rates at 5 and 10 years were 1.6% and 9.7%, respectively.
    explanation: >-
      Perioperative and late mortality in 70 patients undergoing
      pericardiectomy for tuberculous constriction.
  - reference: PMID:12959199
    reference_title: "Pericardiectomy for chronic constrictive tuberculous pericarditis: risks and predictors of survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      At the 1-year follow-up examination, improved functional status was
      noted in 88% of patients.
    explanation: >-
      Functional improvement after pericardiectomy for tuberculous
      constriction.
clinical_trials:
- name: NCT00810849
  phase: PHASE_III
  status: COMPLETED
  description: >-
    IMPI trial. A 2-by-2 factorial trial in 1400 adults with definite or
    probable tuberculous pericarditis, two thirds HIV-infected, of adjunctive
    prednisolone and of Mycobacterium indicus pranii immunotherapy against
    placebo, with a composite of death, tamponade requiring pericardiocentesis
    or constriction as the primary outcome. Neither reduced the primary
    outcome.
  target_phenotypes:
  - preferred_term: Constrictive pericarditis
    term:
      id: HP:0002563
      label: Constrictive pericarditis
  - preferred_term: Cardiac tamponade
    term:
      id: HP:0033415
      label: Cardiac tamponade
  evidence:
  - reference: clinicaltrials:NCT00810849
    reference_title: A Trial of Adjunctive Prednisolone and Mycobacterium w Immunotherapy in Tuberculous Pericarditis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The investigators are proposing to conduct a clinical trial in which
      people who are on antituberculosis treatment for pericardial tuberculosis
      will be randomly allocated to receive either prednisolone or a matching
      placebo tablet, or Mycobacterium w injection or placebo injection.
    explanation: >-
      Registry record describing the IMPI factorial design.
- name: NCT02673879
  phase: PHASE_III
  status: UNKNOWN
  description: >-
    IMPI-2 trial of complete percutaneous pericardial drainage facilitated by
    intrapericardial alteplase against conventional pericardiocentesis in
    large tuberculous and non-tuberculous effusions, aimed at reducing
    constriction. The registry status is unknown.
  target_phenotypes:
  - preferred_term: Constrictive pericarditis
    term:
      id: HP:0002563
      label: Constrictive pericarditis
  - preferred_term: Pericardial effusion
    term:
      id: HP:0001698
      label: Pericardial effusion
  evidence:
  - reference: clinicaltrials:NCT02673879
    reference_title: A Trial of Complete Percutaneous Pericardial Drainage Facilitated by Intrapericardial Alteplase Compared to Conventional Pericardiocentesis When Indicated in Adults With Large Pericardial Effusion Due to Tuberculous and Non-tuberculous Pericarditis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The Second Investigation of the Management of Pericarditis (IMPI-2)
      Trial will compare the effectiveness and safety of complete percutaneous
      pericardial drainage facilitated by intrapericardial alteplase
    explanation: >-
      Registry record describing the IMPI-2 design.
- name: NCT04521803
  phase: PHASE_II
  status: COMPLETED
  description: >-
    IMPI-3, a phase 2b randomised, placebo-controlled, double-blind trial of
    high-dose rifampicin (35 mg/kg) against standard dosing (10 mg/kg) added
    to first-line antituberculous therapy for effusive tuberculous
    pericarditis, testing whether higher dosing raises pericardial fluid
    rifampicin exposure and speeds mycobacterial clearance. It follows from
    the finding that standard doses reach the pericardium below inhibitory
    concentrations. No results are cited here.
  target_phenotypes:
  - preferred_term: Pericardial effusion
    term:
      id: HP:0001698
      label: Pericardial effusion
  evidence:
  - reference: clinicaltrials:NCT04521803
    reference_title: IMPI-3 - A Randomized Controlled Trial of High vs. Standard Dose Rifampicin for Effusive Tuberculous Pericarditis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The investigators hypothesise that high dose RIF (RIF35) will increase
      pericardial fluid RIF exposure and so enhance mycobacterial clearance,
      compared to standard of care dosing (RIF10).
    explanation: >-
      Registry record stating the IMPI-3 hypothesis.

inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous NPR2 loss-of-function variants segregate with short stature in
    an autosomal dominant pattern. De novo variants also occur. Expressivity is
    variable, and some heterozygous family members have heights within or near
    the normal range.
  evidence:
  - reference: PMID:24001744
    reference_title: "Heterozygous mutations in natriuretic peptide receptor-B (NPR2) gene as a cause of short stature in patients initially classified as idiopathic short stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These three mutations segregated with short stature phenotype in an
      autosomal dominant pattern (height SD score ranged from -4.5 to -1.7).
    explanation: >-
      Family segregation of three functionally deficient heterozygous NPR2
      variants with short stature establishes dominant inheritance.
  - reference: PMID:25703509
    reference_title: "Heterozygous mutations in natriuretic peptide receptor-B (NPR2) gene as a cause of short stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We enrolled 192 unrelated patients with short stature and 192 controls of
      normal height and identified seven heterozygous NPR2 missense or splice
      site mutations all in the short stature patients, including one de novo
      splice site variant.
    explanation: >-
      A case-control sequencing study found heterozygous NPR2 variants only in
      short patients, including one de novo variant.
genetic:
- name: NPR2
  gene_term:
    preferred_term: NPR2
    term:
      id: hgnc:7944
      label: NPR2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Heterozygous missense, splice-site and truncating variants. Missense alleles
    act through ER retention, loss of catalytic activity, or dominant-negative
    interference with the wild-type subunit. Truncating alleles act by
    haploinsufficiency. Gain-of-function NPR2 variants cause the opposite
    phenotype (overgrowth; epiphyseal chondrodysplasia, Miura type).
  notes: >-
    No ClinGen gene-disease validity assertion for NPR2 and this disease was found
    in the local ClinGen cache, so gene_disease_validity is left unset.
  evidence:
  - reference: PMID:25703509
    reference_title: "Heterozygous mutations in natriuretic peptide receptor-B (NPR2) gene as a cause of short stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With these data, we were able to rigorously verify that NPR2 functional
      haploinsufficiency contributes to short stature.
    explanation: >-
      Case-control sequencing plus functional testing establishes heterozygous
      NPR2 loss of function as a cause of short stature.
  - reference: PMID:16384845
    reference_title: "Heterozygous mutations in natriuretic peptide receptor-B (NPR2) are associated with short stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have shown that heterozygous mutations in NPR2 are associated with
      short stature.
    explanation: >-
      The first family-based study of heterozygous carriers of an AMDM allele
      showed reduced stature compared with non-carrier relatives.
  - reference: PMID:35455946
    reference_title: "Novel NPR2 Gene Mutations Affect Chondrocytes Function via ER Stress in Short Stature."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function (LOF) mutations in NPR2 cause acromesomelic dysplasia, Maroteaux type (AMDM #602875), and short stature with nonspecific skeletal abnormalities (SNSK #616255)"
    explanation: >-
      Places SNSK with AMDM as the two NPR2 loss-of-function disorders.
pathophysiology:
- name: Heterozygous NPR2 Loss-of-Function Variant
  description: >-
    A single pathogenic NPR2 allele, germline and frequently inherited from a
    similarly short parent, initiates the disease. Allele classes include
    missense, splice-site and truncating variants spread across the
    ligand-binding, kinase-homology and guanylyl-cyclase domains.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: NPR2
    term:
      id: hgnc:7944
      label: NPR2
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:40424589
    reference_title: "Clinical Characteristics and Response to Growth Hormone Treatment in 27 Children With Heterozygous NPR2 Variants: Real-World Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of these variants, 5 were truncating, 11 were non-truncating, and 2 were
      splice site. Most were located in the ligand binding domain or kinase
      homology domain (KHD).
    explanation: >-
      A national registry cohort documents the allelic spectrum and domain
      distribution of heterozygous NPR2 variants.
  downstream:
  - target: Reduced CNP-Stimulated NPR-B cGMP Production
    causal_link_type: DIRECT
    description: >-
      Mutant receptors fail to generate cGMP in response to CNP and, for
      dominant-negative alleles, also suppress the wild-type receptor. This
      leaves heterozygotes with less than normal NPR-B output.
    evidence:
    - reference: PMID:24001744
      reference_title: "Heterozygous mutations in natriuretic peptide receptor-B (NPR2) gene as a cause of short stature in patients initially classified as idiopathic short stature."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Cells transfected with the three mutants failed to produce cyclic GMP
        after treatment with C-type natriuretic peptide.
      explanation: Patient alleles directly abolish CNP-stimulated cGMP generation.
- name: Reduced CNP-Stimulated NPR-B cGMP Production
  description: >-
    NPR-B is a homodimeric receptor guanylyl cyclase. Heterozygous variants lower
    CNP-stimulated cGMP output by three routes: loss of one functional allele
    (haploinsufficiency); retention of misfolded receptor in the endoplasmic
    reticulum; or dominant-negative poisoning of wild-type subunits by
    catalytically dead mutant receptors that still reach the cell surface. The
    route varies by allele.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: NPR2
    term:
      id: hgnc:7944
      label: NPR2
  molecular_functions:
  - preferred_term: guanylate cyclase activity
    term:
      id: GO:0004383
      label: guanylate cyclase activity
    modifier: DECREASED
  - preferred_term: natriuretic peptide receptor activity
    term:
      id: GO:0016941
      label: natriuretic peptide receptor activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: receptor guanylyl cyclase signaling pathway
    term:
      id: GO:0007168
      label: receptor guanylyl cyclase signaling pathway
    modifier: DECREASED
  - preferred_term: cGMP biosynthetic process
    term:
      id: GO:0006182
      label: cGMP biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:24001744
    reference_title: "Heterozygous mutations in natriuretic peptide receptor-B (NPR2) gene as a cause of short stature in patients initially classified as idiopathic short stature."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cells cotransfected with mutant and wild-type-NPR-B (1:1) showed a
      significant decrease in cGMP levels after C-type natriuretic peptide
      stimulation in comparison with cells cotrasnfected with empty vector and
      wild type, suggesting a dominant-negative effect.
    explanation: >-
      Co-expression mimicking the heterozygous state shows mutant receptors
      suppress wild-type cGMP output.
  - reference: PMID:24471569
    reference_title: "Identification and functional characterization of two novel NPR2 mutations in Japanese patients with short stature."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      R110C was defective in trafficking from the endoplasmic reticulum to the
      Golgi apparatus. In contrast, Q417E showed clear cell surface expression.
    explanation: >-
      Two dominant-negative alleles reach the same outcome by different routes,
      one through ER retention and one at the cell surface.
  - reference: PMID:26075495
    reference_title: "Heterozygous NPR2 Mutations Cause Disproportionate Short Stature, Similar to Léri-Weill Dyschondrosteosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Six were demonstrated to affect NPR-B cell trafficking and/or its ability
      to synthesize cyclic GMP (cGMP) under response to natriuretic peptide
      precursor C/brain natriuretic peptide stimulation.
    explanation: >-
      Functional characterization of variants from disproportionate short
      stature referrals confirms trafficking and catalytic defects.
  - reference: PMID:17652215
    reference_title: "Intact kinase homology domain of natriuretic peptide receptor-B is essential for skeletal development."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, L658F mutant impaired wild-type NPR-B-mediated cGMP
      production in a dose-dependent manner, suggesting that short stature
      found in L658F heterozygote can be caused by its dominant-negative effect.
    explanation: >-
      A kinase-homology-domain allele binds CNP normally but inhibits wild-type
      receptor output, explaining short stature in heterozygous parents.
  downstream:
  - target: Growth-Plate Chondrocyte Differentiation Deficit
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced cGMP-dependent restraint of FGF-induced ERK1/2 activation
    description: >-
      CNP/cGMP signalling normally restrains FGF-driven ERK activation in
      chondrocytes. Less NPR-B output weakens that brake, which reduces
      chondrocyte differentiation and hypertrophy.
    evidence:
    - reference: PMID:15869918
      reference_title: "Complementary antagonistic actions between C-type natriuretic peptide and the MAPK pathway through FGFR-3 in ATDC5 cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        CNP and 8-bromo-cGMP strongly and dose-dependently inhibited the
        induction of ERK phosphorylation by FGF2 and FGF18 without changing the
        level of FGFR-3
      explanation: >-
        Establishes the cGMP-mediated restraint on FGF-induced ERK activation
        in chondrocytes that reduced NPR-B output weakens.
    - reference: PMID:23065701
      reference_title: "A novel loss-of-function mutation in Npr2 clarifies primary role in female reproduction and reveals a potential therapy for acromesomelic dysplasia, Maroteaux type."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mutant tibiae have increased levels of the activated form of ERK1/2,
        consistent with the idea that natriuretic peptide receptor type 2
        (NPR2) signaling inhibits the activation of the MEK/ERK mitogen
        activated protein kinase pathway.
      explanation: >-
        The homozygous Npr2 mutant mouse shows ERK disinhibition in growing
        bone. Heterozygosity is expected to have a partial effect, so this is
        indirect support.
- name: Growth-Plate Chondrocyte Differentiation Deficit
  description: >-
    In growth-plate chondrocytes, reduced NPR-B signalling impairs
    differentiation toward the hypertrophic state. Some misfolded mutant
    receptors also add endoplasmic-reticulum stress and chondrocyte apoptosis.

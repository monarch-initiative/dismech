      A clinically relevant increase in BMI (a mean gain in the BMI SDS of
      +1.41), a characteristic previously not reported in NPR2 individuals, was
      observed.
    explanation: A single cohort reports a rise in BMI SDS in heterozygous NPR2 individuals.
diagnosis:
- name: Gene Panel or Exome Sequencing in Idiopathic or Familial Short Stature
  description: >-
    The phenotype is nonspecific, so the diagnosis is usually made by sequencing
    NPR2 in children first classified as idiopathic, familial, or SGA short
    stature, or SHOX-negative Leri-Weill-like short stature. Reported
    diagnostic yields are about 2-7% depending on the cohort.
  evidence:
  - reference: PMID:24001744
    reference_title: "Heterozygous mutations in natriuretic peptide receptor-B (NPR2) gene as a cause of short stature in patients initially classified as idiopathic short stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified heterozygous NPR2 mutations in 6% of patients initially
      classified as ISS.
    explanation: Yield in a Brazilian ISS cohort of 47 patients.
  - reference: PMID:24471569
    reference_title: "Identification and functional characterization of two novel NPR2 mutations in Japanese patients with short stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified heterozygous NPR2 mutations in 2% of Japanese patients with short stature.
    explanation: Yield in 101 Japanese patients with short stature.
  - reference: PMID:31990356
    reference_title: "NPR2 Variants Are Frequent among Children with Familiar Short Stature and Respond Well to Growth Hormone Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In 5/87 children (5.7%), a (likely) pathogenic variant in the NPR2 gene was identified
    explanation: Yield in a cohort with familial short stature.
  - reference: PMID:35741827
    reference_title: "Heterozygous NPR2 Variants in Idiopathic Short Stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of ten heterozygous pathogenic/likely pathogenic NPR2 variants
      and two heterozygous NPR2 variants of uncertain significance were
      detected in twelve participants (frequency of causal variants: 10/150,
      6.7%).
    explanation: Yield in 150 children with idiopathic short stature.
  - reference: PMID:26075495
    reference_title: "Heterozygous NPR2 Mutations Cause Disproportionate Short Stature, Similar to Léri-Weill Dyschondrosteosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Thus, NPR2 should be screened in the SHOX-negative LWD referrals.
    explanation: Supports NPR2 testing in SHOX-negative disproportionate short stature.
differential_diagnoses:
- name: Acromesomelic Dysplasia, Maroteaux Type
  disease_term:
    preferred_term: acromesomelic dysplasia, Maroteaux type
    term:
      id: MONDO:0011275
      label: acromesomelic dysplasia 1, Maroteaux type
  description: >-
    The allelic recessive disorder caused by biallelic NPR2 loss of function.
    It gives severe disproportionate acromesomelic short stature rather than
    the mild phenotype of heterozygotes.
  distinguishing_features:
  - Biallelic rather than heterozygous NPR2 variants.
  - Severe short stature with acromesomelic limb shortening and marked brachydactyly.
  evidence:
  - reference: PMID:32720985
    reference_title: "Short Stature is Progressive in Patients with Heterozygous NPR2 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic NPR2 mutations cause severe skeletal dysplasia (AMDM), whereas
      heterozygous mutations lead to a subtler phenotype characterized by
      progressive short stature with by increasing loss of height potential
      with age.
    explanation: Contrasts the biallelic and heterozygous phenotypes within one family.
- name: SHOX Deficiency (Leri-Weill Dyschondrosteosis)
  description: >-
    SHOX haploinsufficiency gives disproportionate short stature that heterozygous
    NPR2 variants can mimic. Madelung deformity favours SHOX deficiency.
  distinguishing_features:
  - Madelung deformity has not been reported in heterozygous NPR2 patients.
  - SHOX or SHOX-enhancer defect on molecular testing.
  evidence:
  - reference: PMID:26075495
    reference_title: "Heterozygous NPR2 Mutations Cause Disproportionate Short Stature, Similar to Léri-Weill Dyschondrosteosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, no patient has yet presented with Madelung deformity.
    explanation: Absence of Madelung deformity separates NPR2 patients from classic LWD.
- name: ACAN-Related Short Stature
  description: >-
    Heterozygous ACAN variants are another common growth-plate cause of
    idiopathic short stature, typically with advanced bone age and early growth
    cessation.
  distinguishing_features:
  - Advanced bone age and premature growth cessation point to ACAN; bone age is
    more often delayed in heterozygous NPR2 carriers (9 of 12 probands in one
    cohort).
  evidence:
  - reference: PMID:41967490
    reference_title: "A phase II basket trial of vosoritide in children with RASopathies, ACAN, and NPR2 deficiency."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with heterozygous mutations in ACAN present with short
      stature, often with advanced bone age and premature growth cessation (5).
    explanation: Describes the overlapping ACAN short-stature phenotype and its distinguishing bone-age pattern.
treatments:
- name: Somatropin Therapy
  action_category: THERAPEUTIC
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    Recombinant human growth hormone is widely used, often under idiopathic or
    SGA short-stature indications. Early reports described little response.
    Larger cohorts report height gains, greater in prepubertal than in pubertal
    children, with variable individual response. No controlled trial in this
    disease has been reported.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Somatropin
      term:
        id: NCIT:C837
        label: Somatropin
  target_phenotypes:
  - preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  evidence:
  - reference: PMID:40424589
    reference_title: "Clinical Characteristics and Response to Growth Hormone Treatment in 27 Children With Heterozygous NPR2 Variants: Real-World Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After 2 years of GH treatment, median height gain SDS in prepubertal
      children was 1.2 (0.8 to 1.4) and in pubertal children 0.5 (0.3 to 0.9).
    explanation: Registry data show height gain on GH, uncontrolled.
  - reference: PMID:31990356
    reference_title: "NPR2 Variants Are Frequent among Children with Familiar Short Stature and Respond Well to Growth Hormone Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The growth velocity in the first year of GH treatment accelerated by 3.6
      to 4.2 cm/year; the height improved by 1.2 to 1.8 SD over 5 years of
      treatment.
    explanation: Five children with familial short stature showed a sustained response.
  - reference: PMID:24001744
    reference_title: "Heterozygous mutations in natriuretic peptide receptor-B (NPR2) gene as a cause of short stature in patients initially classified as idiopathic short stature."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three of these patients were treated with recombinant human GH (33-50
      μg/kg · d) without significant height SD score change during therapy.
    explanation: An early series reported no meaningful response.
  - reference: PMID:35741827
    reference_title: "Heterozygous NPR2 Variants in Idiopathic Short Stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The response to GH treatment was variable (SDS height gain ranging from -0.01 to +0.74).
    explanation: Documents variable individual response.
- name: Vosoritide (Investigational)
  action_category: THERAPEUTIC
  therapeutic_modality: PEPTIDE
  description: >-
    Vosoritide is a CNP analogue approved for achondroplasia. In a phase 2
    open-label basket trial (NCT04219007) it increased annualized growth velocity
    in children with heterozygous NPR2 deficiency among other genetic short
    stature groups. It is investigational for this indication. Slipped capital
    femoral epiphysis and genu valgum were seen in the basket trial but not in
    the NPR2 subgroup.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vosoritide
      term:
        id: NCIT:C152918
        label: Vosoritide
  target_phenotypes:
  - preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  target_mechanisms:
  - target: Reduced CNP-Stimulated NPR-B cGMP Production
    treatment_effect: ACTIVATES
    description: >-
      The CNP analogue stimulates the remaining functional NPR-B receptors and
      raises cGMP signalling in growth-plate chondrocytes.
    evidence:
    - reference: PMID:41967490
      reference_title: "A phase II basket trial of vosoritide in children with RASopathies, ACAN, and NPR2 deficiency."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Vosoritide, a C-type natriuretic peptide analog that inhibits this
        pathway, has been approved for use in achondroplasia.
      explanation: >-
        Identifies vosoritide as a CNP analogue. The pathway it inhibits is the
        MAPK cascade downstream of the receptor; acting as a CNP analogue, it
        stimulates NPR-B and raises cGMP, which is the ACTIVATES edge recorded
        here, and the MAPK inhibition is a consequence of that.
  evidence:
  - reference: PMID:41967490
    reference_title: "A phase II basket trial of vosoritide in children with RASopathies, ACAN, and NPR2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The increase in AGV was seen in all genetic subgroups.
    explanation: Growth velocity rose in the NPR2 subgroup as in the other subgroups of the trial.
  - reference: PMID:42678892
    reference_title: "Slipped Capital Femoral Epiphysis during Vosoritide Therapy for Short Stature: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the basket trial, SCFE was observed in 2/12 participants with ACAN
      mutations, 1/11 with RASopathy but not in the 7 participants with NPR2
      mutations or 24 with hypochondroplasia.
    explanation: Safety signal context; no SCFE occurred in the NPR2 subgroup.
animal_models:
- name: Npr2 pwe/pwe mouse
  species: Mouse
  genotype: Npr2 pwe/pwe (L313X premature stop codon), homozygous
  publication: PMID:23065701
  description: >-
    A recessive loss-of-function Npr2 allele that models acromesomelic dysplasia,
    Maroteaux type. It shows the growth-plate consequence of losing NPR-B signalling
    and the ERK disinhibition behind it. Because it is biallelic, it bears on the
    mechanism of the heterozygous disease but not on its size.
  modeled_mechanisms:
  - target: Growth-Plate Chondrocyte Differentiation Deficit
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Npr2 loss shrinks the proliferative and hypertrophic zones of the growth
      plate and raises activated ERK1/2 in the tibia, the chondrocyte deficit this
      node describes.
    limitations: >-
      Homozygous null rather than heterozygous, so the deficit is far larger than
      in patients with one variant allele; the model says nothing about the
      dominant-negative alleles some heterozygotes carry.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        The mouse is homozygous for a loss-of-function Npr2 allele, the genotype of
        acromesomelic dysplasia, Maroteaux type, not the heterozygous genotype this
        entry describes. It shows the direction of the mechanism, not the size of
        the partial deficit that one remaining allele leaves.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse long-bone growth plates do not fuse at sexual maturity as human ones
        do, and longitudinal growth runs over weeks rather than the years of human
        childhood, so the timing of the deficit and its effect on final height do
        not transfer directly to patients.
    readouts:
    - name: Growth-plate proliferative and hypertrophic zone size
      target: Growth-Plate Chondrocyte Differentiation Deficit
      direction: DECREASED
      interpretation: Histological correlate of the chondrocyte deficit.
      evidence:
      - reference: PMID:23065701
        reference_title: "A novel loss-of-function mutation in Npr2 clarifies primary role in female reproduction and reveals a potential therapy for acromesomelic dysplasia, Maroteaux type."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We determined that the loss of Npr2 causes a reduction in the
          hypertrophic and proliferative zones of the growth plate, but
          mineralization of skeletal elements is normal.
        explanation: Reports the growth-plate zone reduction in Npr2 pwe/pwe mice.
    - name: Activated ERK1/2 in tibia
      target: Growth-Plate Chondrocyte Differentiation Deficit
      direction: INCREASED
      interpretation: >-
        Loss of the cGMP restraint on ERK that the upstream edge of this node
        describes.
      evidence:
      - reference: PMID:23065701
        reference_title: "A novel loss-of-function mutation in Npr2 clarifies primary role in female reproduction and reveals a potential therapy for acromesomelic dysplasia, Maroteaux type."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Mutant tibiae have increased levels of the activated form of ERK1/2,
          consistent with the idea that natriuretic peptide receptor type 2
          (NPR2) signaling inhibits the activation of the MEK/ERK mitogen
          activated protein kinase pathway.
        explanation: Reports raised ERK1/2 activation in mutant tibiae.
    evidence:
    - reference: PMID:23065701
      reference_title: "A novel loss-of-function mutation in Npr2 clarifies primary role in female reproduction and reveals a potential therapy for acromesomelic dysplasia, Maroteaux type."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We determined that the loss of Npr2 causes a reduction in the
        hypertrophic and proliferative zones of the growth plate, but
        mineralization of skeletal elements is normal.
      explanation: Supports treating this model as informative for the chondrocyte node.
  - target: Reduced Endochondral Longitudinal Bone Growth
    relationship: RESCUES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      MEK1/2 inhibitors restore growth of cultured fetal mutant tibiae, placing
      ERK disinhibition between Npr2 loss and the bone-growth deficit.
    limitations: >-
      The rescue was shown in fetal tibia explants, not in living animals or
      postnatal bone, and in a homozygous null rather than a heterozygous model.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        The mouse is homozygous for a loss-of-function Npr2 allele, the genotype of
        acromesomelic dysplasia, Maroteaux type, not the heterozygous genotype this
        entry describes. It shows the direction of the mechanism, not the size of
        the partial deficit that one remaining allele leaves.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse long-bone growth plates do not fuse at sexual maturity as human ones
        do, and longitudinal growth runs over weeks rather than the years of human
        childhood, so the timing of the deficit and its effect on final height do
        not transfer directly to patients.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Explant culture removes the systemic and postnatal growth context, so the
        rescue shows a cell-autonomous growth-plate mechanism but not the
        childhood height deficit the node leads to.
    evidence:
    - reference: PMID:23065701
      reference_title: "A novel loss-of-function mutation in Npr2 clarifies primary role in female reproduction and reveals a potential therapy for acromesomelic dysplasia, Maroteaux type."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Treatment of fetal tibiae explants with mitogen activated protein kinase
        1 and 2 inhibitors U0126 and PD325901 rescues the Npr2(pwe/pwe) growth
        defect
      explanation: MEK inhibition reverses the bone-growth defect in mutant tibia explants.
  evidence:
  - reference: PMID:23065701
    reference_title: "A novel loss-of-function mutation in Npr2 clarifies primary role in female reproduction and reveals a potential therapy for acromesomelic dysplasia, Maroteaux type."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The Npr2(pwe/pwe) mouse is a model for the human skeletal dysplasia
      acromesomelic dysplasia, Maroteaux type (AMDM).
    explanation: >-
      Establishes the model, and that it models the biallelic NPR2 disease rather
      than this one.

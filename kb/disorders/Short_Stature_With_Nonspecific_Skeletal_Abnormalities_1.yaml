name: Short Stature With Nonspecific Skeletal Abnormalities 1
creation_date: "2026-10-20T00:00:00Z"
category: Mendelian
description: >-
  Short stature with nonspecific skeletal abnormalities 1 (SNSK) is an autosomal
  dominant growth disorder caused by heterozygous loss-of-function variants in
  NPR2, which encodes natriuretic peptide receptor B (NPR-B), the guanylyl
  cyclase receptor for C-type natriuretic peptide (CNP). It is the heterozygous,
  allelic counterpart of acromesomelic dysplasia, Maroteaux type, which is caused
  by biallelic NPR2 loss of function. Reduced CNP-stimulated cGMP production,
  through haploinsufficiency or dominant-negative interference with the
  wild-type receptor, weakens the CNP/NPR-B restraint on MAPK signalling in
  growth-plate chondrocytes and limits endochondral longitudinal bone growth.
  Affected individuals have mild to moderate short stature, often first
  classified as idiopathic or familial short stature. The deficit can become
  more pronounced with age. Mild disproportion and minor hand findings such as
  short metacarpals or clinodactyly are common but not consistent.
synonyms:
- SNSK
- NPR2-related short stature
- heterozygous NPR2 deficiency
disease_term:
  preferred_term: short stature with nonspecific skeletal abnormalities 1
  term:

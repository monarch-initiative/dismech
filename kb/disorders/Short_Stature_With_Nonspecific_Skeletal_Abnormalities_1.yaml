- category: Growth
  name: Increased Body Mass Index
  description: >-
    Reported in one cohort, where BMI SDS rose during follow-up in heterozygous
    probands. Earlier reports found a normal BMI in NPR2 carriers, and the
    authors note that the rise may partly reflect height SDS staying flat
    while weight SDS increases.
  phenotype_term:

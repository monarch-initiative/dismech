name: Short Stature With Nonspecific Skeletal Abnormalities 1
creation_date: "2026-10-20T00:00:00Z"
category: Mendelian
description: >-
  Short stature with nonspecific skeletal abnormalities 1 (SNSK) is an autosomal
  dominant growth disorder caused by heterozygous loss-of-function variants in
  NPR2, which encodes natriuretic peptide receptor B (NPR-B), the guanylyl
  cyclase receptor for C-type natriuretic peptide (CNP). It is the heterozygous,
  allelic counterpart of acromesomelic dysplasia, Maroteaux type, which is caused
  by biallelic NPR2 loss of function. Reduced CNP-stimulated cGMP production,
  through haploinsufficiency or dominant-negative interference with the
  wild-type receptor, weakens the CNP/NPR-B restraint on MAPK signalling in
  growth-plate chondrocytes and limits endochondral longitudinal bone growth.
  Affected individuals have mild to moderate short stature, often first
  classified as idiopathic or familial short stature. The deficit can become
  more pronounced with age. Mild disproportion and minor hand findings such as
  short metacarpals or clinodactyly are common but not consistent.
synonyms:
- SNSK
- NPR2-related short stature
- heterozygous NPR2 deficiency
disease_term:
  preferred_term: short stature with nonspecific skeletal abnormalities 1
  term:
    id: MONDO:0014551
    label: short stature with nonspecific skeletal abnormalities 1
parents:
- Skeletal Dysplasia
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous NPR2 loss-of-function variants segregate with short stature in
    an autosomal dominant pattern. De novo variants also occur. Expressivity is
    variable, and some heterozygous family members have heights within or near
    the normal range.
  evidence:
  - reference: PMID:24001744
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These three mutations segregated with short stature phenotype in an
      autosomal dominant pattern (height SD score ranged from -4.5 to -1.7).
    explanation: >-
      Family segregation of three functionally deficient heterozygous NPR2
      variants with short stature establishes dominant inheritance.
  - reference: PMID:25703509
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We enrolled 192 unrelated patients with short stature and 192 controls of
      normal height and identified seven heterozygous NPR2 missense or splice
      site mutations all in the short stature patients, including one de novo
      splice site variant.
    explanation: >-
      A case-control sequencing study found heterozygous NPR2 variants only in
      short patients, including one de novo variant.
genetic:
- name: NPR2
  gene_term:
    preferred_term: NPR2
    term:
      id: hgnc:7944
      label: NPR2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Heterozygous missense, splice-site and truncating variants. Missense alleles
    act through ER retention, loss of catalytic activity, or dominant-negative
    interference with the wild-type subunit. Truncating alleles act by
    haploinsufficiency. Gain-of-function NPR2 variants cause the opposite
    phenotype (overgrowth; epiphyseal chondrodysplasia, Miura type).
  notes: >-
    No ClinGen gene-disease validity assertion for NPR2 and this disease was found
    in the local ClinGen cache, so gene_disease_validity is left unset.
  evidence:
  - reference: PMID:25703509
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With these data, we were able to rigorously verify that NPR2 functional
      haploinsufficiency contributes to short stature.
    explanation: >-
      Case-control sequencing plus functional testing establishes heterozygous
      NPR2 loss of function as a cause of short stature.
  - reference: PMID:16384845
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have shown that heterozygous mutations in NPR2 are associated with
      short stature.
    explanation: >-
      The first family-based study of heterozygous carriers of an AMDM allele
      showed reduced stature compared with non-carrier relatives.
  - reference: PMID:35455946
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function (LOF) mutations in NPR2 cause acromesomelic dysplasia, Maroteaux type (AMDM #602875), and short stature with nonspecific skeletal abnormalities (SNSK #616255)"
    explanation: >-
      Places SNSK with AMDM as the two NPR2 loss-of-function disorders.
pathophysiology:
- name: Heterozygous NPR2 Loss-of-Function Variant
  description: >-
    A single pathogenic NPR2 allele, germline and frequently inherited from a
    similarly short parent, initiates the disease. Allele classes include
    missense, splice-site and truncating variants spread across the
    ligand-binding, kinase-homology and guanylyl-cyclase domains.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: NPR2
    term:
      id: hgnc:7944
      label: NPR2
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:40424589
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of these variants, 5 were truncating, 11 were non-truncating, and 2 were
      splice site. Most were located in the ligand binding domain or kinase
      homology domain (KHD).
    explanation: >-
      A national registry cohort documents the allelic spectrum and domain
      distribution of heterozygous NPR2 variants.
  downstream:
  - target: Reduced CNP-Stimulated NPR-B cGMP Production
    causal_link_type: DIRECT
    description: >-
      Mutant receptors fail to generate cGMP in response to CNP and, for
      dominant-negative alleles, also suppress the wild-type receptor. This
      leaves heterozygotes with less than normal NPR-B output.
    evidence:
    - reference: PMID:24001744
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Cells transfected with the three mutants failed to produce cyclic GMP
        after treatment with C-type natriuretic peptide.
      explanation: Patient alleles directly abolish CNP-stimulated cGMP generation.
- name: Reduced CNP-Stimulated NPR-B cGMP Production
  description: >-
    NPR-B is a homodimeric receptor guanylyl cyclase. Heterozygous variants lower
    CNP-stimulated cGMP output by three routes: loss of one functional allele
    (haploinsufficiency); retention of misfolded receptor in the endoplasmic
    reticulum; or dominant-negative poisoning of wild-type subunits by
    catalytically dead mutant receptors that still reach the cell surface. The
    route varies by allele.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: NPR2
    term:
      id: hgnc:7944
      label: NPR2
  molecular_functions:
  - preferred_term: guanylate cyclase activity
    term:
      id: GO:0004383
      label: guanylate cyclase activity
    modifier: DECREASED
  - preferred_term: natriuretic peptide receptor activity
    term:
      id: GO:0016941
      label: natriuretic peptide receptor activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: receptor guanylyl cyclase signaling pathway
    term:
      id: GO:0007168
      label: receptor guanylyl cyclase signaling pathway
    modifier: DECREASED
  - preferred_term: cGMP biosynthetic process
    term:
      id: GO:0006182
      label: cGMP biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:24001744
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cells cotransfected with mutant and wild-type-NPR-B (1:1) showed a
      significant decrease in cGMP levels after C-type natriuretic peptide
      stimulation in comparison with cells cotrasnfected with empty vector and
      wild type, suggesting a dominant-negative effect.
    explanation: >-
      Co-expression mimicking the heterozygous state shows mutant receptors
      suppress wild-type cGMP output.
  - reference: PMID:24471569
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      R110C was defective in trafficking from the endoplasmic reticulum to the
      Golgi apparatus. In contrast, Q417E showed clear cell surface expression.
    explanation: >-
      Two dominant-negative alleles reach the same outcome by different routes,
      one through ER retention and one at the cell surface.
  - reference: PMID:26075495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Six were demonstrated to affect NPR-B cell trafficking and/or its ability
      to synthesize cyclic GMP (cGMP) under response to natriuretic peptide
      precursor C/brain natriuretic peptide stimulation.
    explanation: >-
      Functional characterization of variants from disproportionate short
      stature referrals confirms trafficking and catalytic defects.
  - reference: PMID:17652215
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, L658F mutant impaired wild-type NPR-B-mediated cGMP
      production in a dose-dependent manner, suggesting that short stature
      found in L658F heterozygote can be caused by its dominant-negative effect.
    explanation: >-
      A kinase-homology-domain allele binds CNP normally but inhibits wild-type
      receptor output, explaining short stature in heterozygous parents.
  downstream:
  - target: Growth-Plate Chondrocyte Differentiation Deficit
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced cGMP-dependent restraint of FGF-induced ERK1/2 activation
    description: >-
      CNP/cGMP signalling normally restrains FGF-driven ERK activation in
      chondrocytes. Less NPR-B output weakens that brake, which reduces
      chondrocyte differentiation and hypertrophy.
    evidence:
    - reference: PMID:15869918
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        CNP and 8-bromo-cGMP strongly and dose-dependently inhibited the
        induction of ERK phosphorylation by FGF2 and FGF18 without changing the
        level of FGFR-3
      explanation: >-
        Establishes the cGMP-mediated restraint on FGF-induced ERK activation
        in chondrocytes that reduced NPR-B output weakens.
    - reference: PMID:23065701
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mutant tibiae have increased levels of the activated form of ERK1/2,
        consistent with the idea that natriuretic peptide receptor type 2
        (NPR2) signaling inhibits the activation of the MEK/ERK mitogen
        activated protein kinase pathway.
      explanation: >-
        The homozygous Npr2 mutant mouse shows ERK disinhibition in growing
        bone. Heterozygosity is expected to have a partial effect, so this is
        indirect support.
- name: Growth-Plate Chondrocyte Differentiation Deficit
  description: >-
    In growth-plate chondrocytes, reduced NPR-B signalling impairs
    differentiation toward the hypertrophic state. Some misfolded mutant
    receptors also add endoplasmic-reticulum stress and chondrocyte apoptosis.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: growth plate cartilage chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  - preferred_term: hypertrophic chondrocyte
    term:
      id: CL:0000743
      label: hypertrophic chondrocyte
  biological_processes:
  - preferred_term: chondrocyte hypertrophy
    term:
      id: GO:0003415
      label: chondrocyte hypertrophy
    modifier: DECREASED
  - preferred_term: CNP-dependent restraint of the ERK1/2 cascade
    term:
      id: GO:0070373
      label: negative regulation of ERK1 and ERK2 cascade
    modifier: DECREASED
  locations:
  - preferred_term: growth plate cartilage
    term:
      id: UBERON:0004129
      label: growth plate cartilage
  evidence:
  - reference: PMID:35455946
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we found that ATDC5 cells with mutant NPR2 gene showed decreased
      differentiation, as evidenced by lower expression of ColII, ColX, and
      BMP4 and higher expression of Sox9.
    explanation: >-
      Chondrogenic cells expressing patient NPR2 variants, including SNSK
      alleles, show impaired differentiation.
  - reference: PMID:35455946
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Moreover, the apoptosis rate was elevated in ATDC5 cells expressing the mutant NPR2 gene.
    explanation: Mutant receptor expression also increases chondrocyte apoptosis.
  downstream:
  - target: Reduced Endochondral Longitudinal Bone Growth
    causal_link_type: DIRECT
    description: >-
      Fewer and less fully differentiated hypertrophic chondrocytes limit
      longitudinal elongation of endochondral bones.
    evidence:
    - reference: PMID:15869918
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In the organ-cultured fetal mouse tibias, CNP and FGF18 counteracted on
        the longitudinal bone growth, and both the size and number of
        hypertrophic chondrocytes.
      explanation: >-
        In intact tibia, CNP signalling controls hypertrophic chondrocyte size
        and number together with longitudinal bone growth.
- name: Reduced Endochondral Longitudinal Bone Growth
  description: >-
    Partial loss of NPR-B signalling reduces longitudinal bone growth less than
    biallelic loss does. The deficit accumulates through childhood and gives
    mild to moderate short stature, sometimes with mild limb disproportion and
    short hand bones.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: endochondral bone growth
    term:
      id: GO:0003416
      label: endochondral bone growth
    modifier: DECREASED
  - preferred_term: endochondral ossification
    term:
      id: GO:0001958
      label: endochondral ossification
    modifier: DECREASED
  locations:
  - preferred_term: growth plate cartilage
    term:
      id: UBERON:0004129
      label: growth plate cartilage
  evidence:
  - reference: PMID:24471569
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      C-type natriuretic peptide-natriuretic peptide receptor B (NPR-B)
      signaling is critical for endochondral ossification, which is responsible
      for longitudinal growth in limbs and vertebrae.
    explanation: >-
      States the role of CNP/NPR-B in endochondral longitudinal growth that
      heterozygous variants impair.
  - reference: PMID:32720985
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic NPR2 mutations cause severe skeletal dysplasia (AMDM), whereas
      heterozygous mutations lead to a subtler phenotype characterized by
      progressive short stature with by increasing loss of height potential
      with age.
    explanation: >-
      A family carrying both genotypes shows a dosage relationship: heterozygous
      growth impairment is milder than biallelic.
  downstream:
  - target: Short Stature
    causal_link_type: DIRECT
    description: Reduced longitudinal bone growth directly lowers attained height.
    evidence:
    - reference: PMID:16384845
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Height z-scores of these carriers were -1.8 +/- 1.1 (mean +/- sd), which
        was significantly less than the 23 noncarrier family members (-0.4 +/-
        0.8, P < 0.0005) and the general population (P < 0.0005).
      explanation: Heterozygous carriers are measurably shorter than non-carrier relatives.
  - target: Progressive Postnatal Height Deficit
    causal_link_type: DIRECT
    description: >-
      Because the growth deficit acts throughout childhood, the height SDS of
      heterozygous children falls as they grow.
    evidence:
    - reference: PMID:32720985
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Height z-scores progressively and significantly decreased as
        NPR2-heterozygous children matured, while remaining constant in their
        wild-type siblings.
      explanation: Longitudinal family data show progressive loss of height SDS in heterozygotes.
  - target: Mild Disproportionate Short Stature
    causal_link_type: DIRECT
    description: >-
      Limb growth is affected somewhat more than trunk growth in some patients,
      giving mild disproportion.
    evidence:
    - reference: PMID:40424589
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mild features suggestive of a skeletal dysplasia were found in 89%,
        most frequently mild disproportion and dysmorphic features of the hands.
      explanation: Mild disproportion is the most common skeletal sign in a 27-child registry cohort.
  - target: Short Metacarpals
    causal_link_type: DIRECT
    description: Reduced growth of short tubular bones of the hand gives short metacarpals.
    evidence:
    - reference: PMID:35741827
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In three probands (P4, P5, and P7), we found additional skeletal
        findings, such as a shortened metacarpal bone of the fourth and fifth
        finger, a slightly shortened proximal part of the lower and upper
        extremities, clinodactyly and micrognathia
      explanation: Short fourth and fifth metacarpals were recorded in heterozygous probands.
  - target: Clinodactyly
    causal_link_type: DIRECT
    description: Altered growth of the phalanges can give finger clinodactyly.
    evidence:
    - reference: PMID:35741827
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In three probands (P4, P5, and P7), we found additional skeletal
        findings, such as a shortened metacarpal bone of the fourth and fifth
        finger, a slightly shortened proximal part of the lower and upper
        extremities, clinodactyly and micrognathia
      explanation: Clinodactyly was recorded among the minor skeletal findings in heterozygous probands.
  - target: Small for Gestational Age
    causal_link_type: DIRECT
    description: >-
      Reduced prenatal longitudinal growth can show as small-for-gestational-age
      birth length in some heterozygotes.
    evidence:
    - reference: PMID:30602027
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Six of the eight patients carried variants in genes associated with
        growth plate development, indicating that mild forms of skeletal
        dysplasia could be a cause of growth disorders in this group of
        patients.
      explanation: >-
        In a cohort of SGA children with isolated short stature, NPR2 is one of
        the growth-plate genes the authors link to prenatal growth deficit.
phenotypes:
- category: Growth
  name: Short Stature
  frequency: VERY_FREQUENT
  description: >-
    Mild to moderate short stature, usually around -2 to -3 SDS and ranging to
    about -4.5 SDS. Patients are usually first classified as idiopathic or
    familial short stature.
  phenotype_term:
    preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  evidence:
  - reference: PMID:24001744
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected patients have mild and variable degrees of short stature without
      a distinct phenotype.
    explanation: The defining feature is mild, variable short stature without a recognizable syndrome.
  - reference: PMID:40424589
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Median (IQR) baseline height SDS was -2.9 (-3.3 to -2.4).
    explanation: Quantifies the typical height deficit in a 27-child cohort.
- category: Growth
  name: Progressive Postnatal Height Deficit
  description: >-
    Height SDS declines as heterozygous children grow, so the deficit is often
    more marked at older ages than in early childhood.
  phenotype_term:
    preferred_term: Postnatal growth retardation
    term:
      id: HP:0008897
      label: Postnatal growth retardation
  evidence:
  - reference: PMID:32720985
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Height z-scores progressively and significantly decreased as
      NPR2-heterozygous children matured, while remaining constant in their
      wild-type siblings.
    explanation: Longitudinal family data show the progressive loss of height SDS.
- category: Skeletal
  name: Mild Disproportionate Short Stature
  frequency: FREQUENT
  description: >-
    Mild limb-trunk disproportion is common in clinic and registry cohorts. Some
    patients resemble Leri-Weill dyschondrosteosis without Madelung deformity.
    Family-based studies have also reported proportionate short stature, so
    disproportion is not required.
  phenotype_term:
    preferred_term: Disproportionate short stature
    term:
      id: HP:0003498
      label: Disproportionate short stature
  evidence:
  - reference: PMID:40424589
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mild features suggestive of a skeletal dysplasia were found in 89%, most
      frequently mild disproportion and dysmorphic features of the hands.
    explanation: Mild disproportion was the most frequent skeletal sign.
  - reference: PMID:26075495
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All pathogenic mutations were detected in the suspected LWD referral
      group (∼3%).
    explanation: >-
      Pathogenic heterozygous NPR2 variants were found among patients referred
      for disproportionate, Leri-Weill-like short stature.
  - reference: PMID:16384845
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: However, there was no difference in body proportion between carriers and noncarriers.
    explanation: >-
      In the first family studied, carriers were short but not disproportionate,
      so disproportion is not a constant feature.
  - reference: PMID:32720985
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous relatives had proportionate short stature (height z-scores
      -2.06 ± 0.97, median ± SD) compared with their wild-type siblings (-1.37
      ± 0.59).
    explanation: A second family reported proportionate short stature in heterozygotes.
- category: Skeletal
  name: Short Metacarpals

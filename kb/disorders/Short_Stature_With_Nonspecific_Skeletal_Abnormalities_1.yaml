  evidence:
  - reference: PMID:35455946
    reference_title: "Novel NPR2 Gene Mutations Affect Chondrocytes Function via ER Stress in Short Stature."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we found that ATDC5 cells with mutant NPR2 gene showed decreased
      differentiation, as evidenced by lower expression of ColII, ColX, and
      BMP4 and higher expression of Sox9.
    explanation: >-
      Chondrogenic cells expressing patient NPR2 variants, including SNSK
      alleles, show impaired differentiation.
  - reference: PMID:35455946
    reference_title: "Novel NPR2 Gene Mutations Affect Chondrocytes Function via ER Stress in Short Stature."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Moreover, the apoptosis rate was elevated in ATDC5 cells expressing the mutant NPR2 gene.
    explanation: Mutant receptor expression also increases chondrocyte apoptosis.
  downstream:
  - target: Reduced Endochondral Longitudinal Bone Growth
    causal_link_type: DIRECT
    description: >-
      Fewer and less fully differentiated hypertrophic chondrocytes limit
      longitudinal elongation of endochondral bones.
    evidence:
    - reference: PMID:15869918
      reference_title: "Complementary antagonistic actions between C-type natriuretic peptide and the MAPK pathway through FGFR-3 in ATDC5 cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In the organ-cultured fetal mouse tibias, CNP and FGF18 counteracted on
        the longitudinal bone growth, and both the size and number of
        hypertrophic chondrocytes.
      explanation: >-
        In intact tibia, CNP signalling controls hypertrophic chondrocyte size
        and number together with longitudinal bone growth.
- name: Reduced Endochondral Longitudinal Bone Growth
  description: >-
    Partial loss of NPR-B signalling reduces longitudinal bone growth less than
    biallelic loss does. The deficit accumulates through childhood and gives
    mild to moderate short stature, sometimes with mild limb disproportion and
    short hand bones.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: endochondral bone growth
    term:
      id: GO:0003416
      label: endochondral bone growth
    modifier: DECREASED
  - preferred_term: endochondral ossification
    term:
      id: GO:0001958
      label: endochondral ossification
    modifier: DECREASED
  locations:
  - preferred_term: growth plate cartilage
    term:
      id: UBERON:0004129
      label: growth plate cartilage
  evidence:
  - reference: PMID:24471569
    reference_title: "Identification and functional characterization of two novel NPR2 mutations in Japanese patients with short stature."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      C-type natriuretic peptide-natriuretic peptide receptor B (NPR-B)
      signaling is critical for endochondral ossification, which is responsible
      for longitudinal growth in limbs and vertebrae.
    explanation: >-
      States the role of CNP/NPR-B in endochondral longitudinal growth that
      heterozygous variants impair.
  - reference: PMID:32720985
    reference_title: "Short Stature is Progressive in Patients with Heterozygous NPR2 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic NPR2 mutations cause severe skeletal dysplasia (AMDM), whereas
      heterozygous mutations lead to a subtler phenotype characterized by
      progressive short stature with by increasing loss of height potential
      with age.
    explanation: >-
      A family carrying both genotypes shows a dosage relationship: heterozygous
      growth impairment is milder than biallelic.
  downstream:
  - target: Short Stature
    causal_link_type: DIRECT
    description: Reduced longitudinal bone growth directly lowers attained height.
    evidence:
    - reference: PMID:16384845
      reference_title: "Heterozygous mutations in natriuretic peptide receptor-B (NPR2) are associated with short stature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Height z-scores of these carriers were -1.8 +/- 1.1 (mean +/- sd), which
        was significantly less than the 23 noncarrier family members (-0.4 +/-
        0.8, P < 0.0005) and the general population (P < 0.0005).
      explanation: Heterozygous carriers are measurably shorter than non-carrier relatives.
  - target: Progressive Postnatal Height Deficit
    causal_link_type: DIRECT
    description: >-
      Because the growth deficit acts throughout childhood, the height SDS of
      heterozygous children falls as they grow.
    evidence:
    - reference: PMID:32720985
      reference_title: "Short Stature is Progressive in Patients with Heterozygous NPR2 Mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Height z-scores progressively and significantly decreased as
        NPR2-heterozygous children matured, while remaining constant in their
        wild-type siblings.
      explanation: Longitudinal family data show progressive loss of height SDS in heterozygotes.
  - target: Mild Disproportionate Short Stature
    causal_link_type: DIRECT
    description: >-
      Limb growth is affected somewhat more than trunk growth in some patients,
      giving mild disproportion.
    evidence:
    - reference: PMID:40424589
      reference_title: "Clinical Characteristics and Response to Growth Hormone Treatment in 27 Children With Heterozygous NPR2 Variants: Real-World Data."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mild features suggestive of a skeletal dysplasia were found in 89%,
        most frequently mild disproportion and dysmorphic features of the hands.
      explanation: Mild disproportion is the most common skeletal sign in a 27-child registry cohort.
  - target: Short Metacarpals
    causal_link_type: DIRECT
    description: Reduced growth of short tubular bones of the hand gives short metacarpals.
    evidence:
    - reference: PMID:35741827
      reference_title: "Heterozygous NPR2 Variants in Idiopathic Short Stature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In three probands (P4, P5, and P7), we found additional skeletal
        findings, such as a shortened metacarpal bone of the fourth and fifth
        finger, a slightly shortened proximal part of the lower and upper
        extremities, clinodactyly and micrognathia
      explanation: Short fourth and fifth metacarpals were recorded in heterozygous probands.
  - target: Clinodactyly
    causal_link_type: DIRECT
    description: Altered growth of the phalanges can give finger clinodactyly.
    evidence:
    - reference: PMID:35741827
      reference_title: "Heterozygous NPR2 Variants in Idiopathic Short Stature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In three probands (P4, P5, and P7), we found additional skeletal
        findings, such as a shortened metacarpal bone of the fourth and fifth
        finger, a slightly shortened proximal part of the lower and upper
        extremities, clinodactyly and micrognathia
      explanation: Clinodactyly was recorded among the minor skeletal findings in heterozygous probands.
  - target: Small for Gestational Age
    causal_link_type: DIRECT
    description: >-
      Reduced prenatal longitudinal growth can show as small-for-gestational-age
      birth length in some heterozygotes.
    evidence:
    - reference: PMID:30602027
      reference_title: "Multigene Sequencing Analysis of Children Born Small for Gestational Age With Isolated Short Stature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Four of the genes are associated with growth plate development, IHH (n =
        2), NPR2 (n = 2), SHOX (n = 1), and ACAN (n = 1)
      explanation: >-
        In a cohort of SGA children with isolated short stature, two carried
        NPR2 variants, linking the NPR2 growth-plate deficit to prenatal growth
        restriction.

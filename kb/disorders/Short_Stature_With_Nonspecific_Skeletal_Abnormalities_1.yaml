        entry describes. It shows the direction of the mechanism, not the size of
        the partial deficit that one remaining allele leaves.
    - divergence_type: SPECIES_MISMATCH
      materiality: IMMATERIAL
      description: >-
        Mouse growth plates do not fuse at sexual maturity and mouse longitudinal
        growth runs over weeks, but this link claims only that NPR-B loss lowers
        CNP-stimulated cGMP output, which does not depend on growth-plate timing.
    evidence:
    - reference: PMID:15572448
      reference_title: "Critical roles of the guanylyl cyclase B receptor in endochondral ossification and development of female reproductive organs."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        C-type natriuretic peptide-dependent increases of guanylyl cyclase B
        activity, but not basal enzyme activity, appeared to be required for the
        progression of endochondral ossification.
      explanation: >-
        Places the bone defect of null mice on loss of CNP-stimulated GC-B
        activity. This is an inference stated by the authors rather than a
        direct cGMP readout, hence INDIRECT.

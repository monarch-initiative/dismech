    reference_title: "Heterozygous NPR2 Variants in Idiopathic Short Stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 8.8% participants born small for their gestational age (SGA) carried the NPR2 causal variant.
    explanation: NPR2 variants were found among SGA-born children with short stature.
  - reference: PMID:30602027
    reference_title: "Multigene Sequencing Analysis of Children Born Small for Gestational Age With Isolated Short Stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four of the genes are associated with growth plate development, IHH (n =
      2), NPR2 (n = 2), SHOX (n = 1), and ACAN (n = 1)
    explanation: Two of 55 SGA children with isolated short stature carried NPR2 variants.
- category: Skeletal
  name: Delayed Bone Age
  description: >-
    Bone age is delayed in most, but not all, heterozygous probands; a minority
    have advanced bone age.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Delayed bone age

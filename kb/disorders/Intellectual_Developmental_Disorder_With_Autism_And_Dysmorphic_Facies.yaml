      evidence_source: IN_VITRO
      snippet: "Functionally, PDZD8 is required for LE/lys positioning and neurite outgrowth, which is dependent on the lipid transfer activity of the SMP domain."
      explanation: Neurite outgrowth needs PDZD8 lipid transfer at endolysosome contacts.
    - reference: PMID:40156832

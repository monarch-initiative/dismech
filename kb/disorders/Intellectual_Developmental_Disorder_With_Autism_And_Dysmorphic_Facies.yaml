      reference_title: "PDZD8 Disruption Causes Cognitive Impairment in Humans, Mice, and Fruit Flies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The PDZD8 c.2197_2200del variant deletes four base pairs in exon 5, introducing a frameshift and PTC (Figure 1C and Table 2) absent from gnomAD."
      explanation: Identity of the family A variant.
  evidence:
  - reference: PMID:35227461
    reference_title: "PDZD8 Disruption Causes Cognitive Impairment in Humans, Mice, and Fruit Flies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous premature termination codons in PDZD8, encoding an endoplasmic reticulum-anchored lipid transfer protein, showed cosegregation with syndromic ID in both families."
    explanation: First report linking PDZD8 to the disorder.
  - reference: PMID:40016860
    reference_title: "Autistic behavior is a common outcome of biallelic disruption of PDZD8 in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intellectual developmental disorder with autism and dysmorphic facies (IDDADF) is a rare syndromic intellectual disability (ID) caused by homozygous disruption of PDZD8 (PDZ domain-containing protein 8), an integral endoplasmic reticulum (ER) protein."
    explanation: Confirmation in a third family.

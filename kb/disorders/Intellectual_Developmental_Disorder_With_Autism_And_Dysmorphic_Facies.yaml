    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results suggest that protrudin and PDZD8 cooperatively promote endosome maturation by mediating ER-LyLE tethering and lipid extraction at MCSs, thereby maintaining neuronal polarity and integrity."
    explanation: Endosome maturation depends on PDZD8 tethering and lipid extraction.
  - reference: PMID:40156832
    reference_title: "PDZD8 promotes autophagy at ER-lysosome membrane contact sites to regulate activity-dependent synaptic growth."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "PDZD8 accelerates autophagic flux by promoting lysosome maturation at ER-late endosome/lysosome MCSs."
    explanation: In Drosophila neurons PDZD8 promotes lysosome maturation and autophagy.

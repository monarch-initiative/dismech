name: Intellectual Developmental Disorder With Autism And Dysmorphic Facies
creation_date: "2026-10-23T02:07:54Z"
category: Mendelian
parents:
- Neurodevelopmental disorder
- Syndromic intellectual disability
synonyms:
- IDDADF
- PDZD8-related intellectual developmental disorder
description: >-
  An autosomal recessive syndromic intellectual disability caused by
  homozygous premature termination codons in PDZD8, an endoplasmic reticulum
  (ER) transmembrane lipid transfer protein that tethers the ER to late
  endosomes/lysosomes and to mitochondria. Six affected individuals from three
  consanguineous families (Omani, Emirati and Afghan) have been reported,
  homozygous for p.(Q30*), p.(Y298*) or p.(S733*). All six have developmental
  delay, intellectual disability (severe in four), autistic behaviour (autism
  spectrum disorder diagnosed in five) and facial dysmorphism, with orbital
  hypertelorism, malar flattening, a myopathic or hypotonic face and an open
  mouth. Mild muscle weakness, epilepsy, myopia, marfanoid habitus or short
  stature, scoliosis and ADHD occur in some. Pdzd8 mutant mice show reduced
  preweaning viability, repetitive jumping, social recognition deficits,
  impaired long-term spatial memory and reduced hippocampal long-term
  potentiation, and fly knockdown impairs long-term memory. Cellular studies
  place PDZD8 at ER-endolysosome contacts, where its lipid transfer promotes
  endosome maturation, lipophagy and neurite outgrowth, and at ER-mitochondria
  contacts, where it couples synaptic ER calcium release to mitochondrial
  uptake. Management is supportive.

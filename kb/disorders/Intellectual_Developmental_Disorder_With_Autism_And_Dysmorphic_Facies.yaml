- name: Impaired Endolysosome Maturation
  biological_scale: CELLULAR
  description: >-
    Without PDZD8-mediated lipid supply at ER-late endosome/lysosome contacts,
    endosome maturation fails. PDZD8- or protrudin-depleted mouse neurons form
    abnormal large vacuoles, and in Drosophila PDZD8 is needed for lysosome
    maturation and autophagic flux at these contacts.

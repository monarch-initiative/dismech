genetic:
- name: PDZD8
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: PDZD8
    term:
      id: hgnc:26974
      label: PDZD8
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    No ClinGen gene-disease validity assertion was found for this pair. Three
    families with three different homozygous truncating variants support the
    association. gnomAD constraint metrics indicate PDZD8 is extremely
    intolerant of loss-of-function variation, yet heterozygous relatives do
    not have the syndrome.
  variants:
  - name: NM_173791.5:c.88C>T (p.Gln30Ter)
    type: nonsense
    variant_type: single nucleotide variant
    description: >-
      Homozygous in family C (Afghan origin, two affected siblings). Exon 1.
      One heterozygote in gnomAD v4.1.0.
    evidence:
    - reference: PMID:40016860
      reference_title: "Autistic behavior is a common outcome of biallelic disruption of PDZD8 in humans and mice."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "identified a homozygous nonsense variant in PDZD8 exon 1"
      explanation: Identity of the family C variant.
  - name: NM_173791.5:c.894C>G (p.Tyr298Ter)
    type: nonsense
    variant_type: single nucleotide variant
    description: Homozygous in family B (Emirati, one affected boy). Exon 2. Absent from gnomAD.
    evidence:
    - reference: PMID:35227461
      reference_title: "PDZD8 Disruption Causes Cognitive Impairment in Humans, Mice, and Fruit Flies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "revealed a homozygous nonsense variant in PDZD8 exon 2"
      explanation: Identity of the family B variant.
  - name: NM_173791.5:c.2197_2200del (p.Ser733Ter)
    type: frameshift
    variant_type: deletion
    description: >-
      Homozygous in family A (Omani, three affected siblings). A 4-bp deletion
      in the last exon introducing a frameshift and premature termination
      codon. Absent from gnomAD.
    evidence:

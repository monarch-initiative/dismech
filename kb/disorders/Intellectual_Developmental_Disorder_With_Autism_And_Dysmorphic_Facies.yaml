animal_models:
- name: Pdzd8tm1b mouse
  species: Mouse
  genotype: Pdzd8tm1b homozygous (exon 3 replaced by lacZ cassette; p.F333Nfs1*), C57BL/6NTac
  publication: PMID:35227461
  description: >-
    Homozygous mice have reduced preweaning viability, smaller body and
    brain size, spontaneous repetitive hindlimb jumping, impaired long-term
    spatial memory, reduced long-term potentiation after maximal
    stimulation, impaired social recognition and social odour
    discrimination, dark-phase hyperactivity and increased metabolic rate.
  modeled_mechanisms:
  - target: Hippocampal Synaptic Plasticity Deficit
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reduced hippocampal LTP and impaired long-term spatial memory.
    limitations: >-
      The LTP deficit appears only with maximal 3x theta burst stimulation and
      not with submaximal protocols; spatial learning itself is intact.
    evidence:
    - reference: PMID:35227461
      reference_title: "PDZD8 Disruption Causes Cognitive Impairment in Humans, Mice, and Fruit Flies."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice homozygous for a premature termination codon in Pdzd8 exhibited brain structural, hippocampal spatial memory, and synaptic plasticity deficits."
      explanation: The model shows the plasticity and memory deficits.
  - target: Impaired Neurite Outgrowth and Synapse Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: UNKNOWN
    model_scale: TISSUE
    description: Increased dendritic spine density and reduced adult neurogenesis in mutant brain.
    limitations: >-
      Spine density is increased rather than reduced, so the direction of the
      synaptic change differs from the reduced neurite outgrowth seen in
      cultured cells; neurite outgrowth itself was not measured in the mouse.
    evidence:
    - reference: PMID:40016860
      reference_title: "Autistic behavior is a common outcome of biallelic disruption of PDZD8 in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In the brain, Pdzd8tm1b mice exhibit increased levels of accessory olfactory bulb volume, primary olfactory cortex volume, dendritic spine density, and ER stress- and mitochondrial fusion-related transcripts, as well as decreased levels of cerebellar nuclei volume and adult neurogenesis."
      explanation: Spine density and neurogenesis changes in the mutant mouse brain.
  - target: Autistic Behavior
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Repetitive jumping and impaired social recognition and social odour discrimination.
    limitations: >-
      Sociability itself is unaltered, and a second Pdzd8 null line on a
      different background showed no social deficit.
    evidence:
    - reference: PMID:40016860
      reference_title: "Autistic behavior is a common outcome of biallelic disruption of PDZD8 in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In addition to impairments in social recognition and social odor discrimination, Pdzd8tm1b mice exhibit increases in locomotor activity (dark phase only) and metabolic rate (both lights-on and dark phases), and decreased plasma triglyceride in males."
      explanation: Social recognition deficits in mutant mice.
- name: Drosophila PDZD8 knockdown
  species: Fruit fly
  genotype: RNAi knockdown of the PDZD8 ortholog
  publication: PMID:35227461
  description: Knockdown flies have impaired long-term courtship-based memory.
  modeled_mechanisms:

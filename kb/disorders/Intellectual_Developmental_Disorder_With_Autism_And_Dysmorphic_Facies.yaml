pathophysiology:
- name: PDZD8 Biallelic Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Both PDZD8 alleles carry a premature termination codon (p.Q30* in exon 1,
    p.Y298* in exon 2, p.S733* in the last exon). Any protein escaping
    nonsense-mediated decay would keep the ER transmembrane anchor but lack
    the C-terminal regions that bind protrudin, late-endosome/lysosome
    phospholipids and Rab7, so no functional full-length protein is expected.
    PDZD8's SMP domain binds and transfers glycerophospholipids and ceramides
    between membranes, and the protein tethers the ER to late
    endosomes/lysosomes and to mitochondria. These activities are the gene's
    established functions; they were not measured on the patient alleles.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS

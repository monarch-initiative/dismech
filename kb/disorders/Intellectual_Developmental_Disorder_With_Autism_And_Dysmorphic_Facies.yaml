      explanation: Long-term memory deficit in knockdown flies.
discussions:
- discussion_id: iddadf_nonneural_features
  prompt: >-
    Which PDZD8 function explains the muscle weakness, facial dysmorphism and
    short stature of IDDADF, and which of the two contact-site roles
    (ER-endolysosome lipid transfer or ER-mitochondria calcium coupling)
    drives the neurodevelopmental phenotype?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Muscle Weakness
  - phenotypes#Facial Dysmorphism
  - phenotypes#Short Stature
  - pathophysiology#Impaired ER-Mitochondria Calcium Coupling
  - pathophysiology#Impaired Endolysosome Maturation
  rationale: >-
    The mechanistic evidence comes from cultured cells, flies and mice; no
    patient cells have been studied, and PDZD8 protein is not detectable in
    blood. The mouse studies link the cognitive phenotype to synaptic
    plasticity and brain lipid accumulation but do not separate the
    endolysosomal and mitochondrial roles. No source cited here addresses
    the muscle, craniofacial or growth features, and in family A a second
    homozygous ANKRD2 variant may contribute to the myopathy.
  evidence:
  - reference: PMID:35227461
    reference_title: "PDZD8 Disruption Causes Cognitive Impairment in Humans, Mice, and Fruit Flies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The lack of PDZD8 protein in human blood limits our ability to detect truncated PDZD8 proteins (31)."
    explanation: Patient protein studies have not been possible from blood.
notes: >-
  Six individuals in three consanguineous families are published
  (PMID:35227461, PMID:40016860). Frequencies are given as counts out of six
  where the 2025 report tabulates them. Single-patient findings not modelled
  here include congenital heart defect, cleft palate, amblyopia,
  obsessive-compulsive behaviour, aggression and insomnia. PDZD8 lies in the
  distal 10q deletion region, but heterozygous relatives in these families
  do not have the syndrome. No GeneReviews chapter was found.

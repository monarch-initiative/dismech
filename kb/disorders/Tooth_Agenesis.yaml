- name: TSPEAR-related
  display_name: TSPEAR-related tooth agenesis
  subtype_term:
    preferred_term: selective tooth agenesis type 10
    term:
      id: MONDO:0859339
      label: tooth agenesis, selective, 10
  description: >-
    TSPEAR encodes a protein involved in tooth development that is expressed
    predominantly in the enamel knot, the structure that coordinates patterning of
    the developing tooth cusps. Biallelic loss-of-function
    variants produce abnormalities of tooth number and shape - tooth agenesis
    together with conical teeth - with complete penetrance for the dental
    phenotype, while features in other ectodermal-derived organs appear in a
    minority of patients. The same biallelic genotypes are also named as
    autosomal recessive ectodermal dysplasia 14 (MONDO:0032584, OMIM 618180),
    so selective tooth agenesis 10 (OMIM 620173) and ectodermal dysplasia 14 are
    two named points on one allelic spectrum whose dental component is the
    constant feature. Sensorineural hearing loss, once part of the TSPEAR
    phenotype description, is curated separately and contested; see
    Autosomal_Recessive_Nonsyndromic_Hearing_Loss_98.
  genes:
  - preferred_term: TSPEAR
    term:
      id: hgnc:1268
      label: TSPEAR
  inheritance:
  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:41195743
    reference_title: "Genotypes and Phenotypes of Patients With TSPEAR-Related Disorder: Evidence of a Predominant Dental Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Abnormalities in tooth number and shape (conical teeth and tooth agenesis
      with a variable number of missing teeth) were found in all affected
      individuals.
    explanation: >-
      Establishes tooth agenesis with conical teeth as the constant finding in a
      cohort of eleven patients from seven families with biallelic TSPEAR
      variants.
  - reference: PMID:41195743
    reference_title: "Genotypes and Phenotypes of Patients With TSPEAR-Related Disorder: Evidence of a Predominant Dental Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Our results demonstrate that individuals with biallelic variants in TSPEAR
      show complete penetrance for dental manifestations, but not for other
      ectodermal abnormalities.
    explanation: >-
      Source for the claim that the dental phenotype is fully penetrant while
      other ectodermal features are not, which is what makes a tooth-agenesis
      subtype row the right home for this gene.
  - reference: PMID:37009414
    reference_title: "Clinical, genetic, epidemiologic, evolutionary, and functional delineation of TSPEAR-related autosomal recessive ectodermal dysplasia 14."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Combining data from new and previously published individuals established
      that ARED14 is primarily characterized by dental anomalies such as conical
      tooth cusps and hypodontia, like those seen in individuals with
      WNT10A-related odontoonychodermal dysplasia.
    explanation: >-
      Supports treating ectodermal dysplasia 14 and selective tooth agenesis 10
      as one allelic spectrum with a predominantly dental presentation.


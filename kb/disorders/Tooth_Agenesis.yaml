    in every affected individual reported. A zebrafish double knockout reproduces
    the clinical features and phenocopies fin-regeneration abnormalities of
    wnt10a knockout fish, which has been taken to suggest that TSPEAR and WNT10A
    interact; that interaction is a hypothesis in the source rather than an
    established link, and is not asserted as an edge here.

has_subtypes:
- name: WNT10A-related
  display_name: WNT10A-related tooth agenesis
  description: >-
    The single most common molecular cause of isolated (nonsyndromic) hypodontia
    and oligodontia. WNT10A is a WNT ligand acting in the canonical WNT/beta-catenin
    pathway during epithelial-mesenchymal signaling. Inheritance is both
    autosomal dominant and autosomal recessive; biallelic variants tend to
    produce more severe (oligodontia) phenotypes. This row deliberately carries
    no subtype_term: the MONDO class for selective tooth agenesis 4
    (MONDO:0007881) is already bound as a subtype of
    Odonto-Onycho-Dermal_Dysplasia, where the milder end of the WNT10A allelic
    spectrum is curated, so binding it again here would claim the same concept
    twice.
  genes:
  - preferred_term: WNT10A
    term:
      id: hgnc:13829
      label: WNT10A

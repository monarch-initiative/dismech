- name: GREM2-related
  display_name: GREM2-related tooth agenesis
  subtype_term:
    preferred_term: selective tooth agenesis type 9
    term:
      id: MONDO:0014999
      label: tooth agenesis, selective, 9
  description: >-
    GREM2 (gremlin 2) encodes a BMP antagonist, placing this subtype in the BMP
    arm of odontogenic signaling rather than in the WNT or ectodysplasin arms. The
    reported malformations are isolated tooth agenesis together with microdontia,
    short tooth roots, taurodontism, sparse and slow-growing hair, and dry and
    itchy skin; inheritance is autosomal dominant with incomplete penetrance and
    expressivity varies even within a family. Of the tooth-agenesis
    gene-disease relationships ClinGen has assessed, this is the only one graded
    below Definitive: the Craniofacial Malformations Gene Curation Expert Panel
    classifies GREM2-selective tooth agenesis 9 as Limited, so this row records a
    real but thinly evidenced entity rather than a settled one.

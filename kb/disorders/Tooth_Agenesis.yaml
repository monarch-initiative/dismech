    reference_title: GREMLIN 2 Mutations and Dental Anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Here, we demonstrate for the first time that GREM2 mutations are associated
      with human malformations, which include isolated tooth agenesis,
      microdontia, short tooth roots, taurodontism, sparse and slow-growing hair,
      and dry and itchy skin.
    explanation: >-
      The report that first linked GREM2 variants to human isolated tooth
      agenesis, and the source of the accompanying dental and ectodermal features
      described in this row.
  - reference: PMID:26416033
    reference_title: GREMLIN 2 Mutations and Dental Anomalies.

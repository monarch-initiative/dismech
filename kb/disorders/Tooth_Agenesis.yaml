- name: Enamel Knot Signaling Disruption
  description: >-
    The enamel knot is the structure that coordinates patterning of the developing
    tooth cusps. TSPEAR expression in the developing tooth is restricted to the
    enamel knot, and biallelic TSPEAR loss of function

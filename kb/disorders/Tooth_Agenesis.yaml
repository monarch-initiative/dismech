pathophysiology:
- name: WNT/beta-catenin Signaling Deficiency
  description: >-
    Canonical WNT/beta-catenin signaling is central to the reciprocal epithelial-mesenchymal
    interactions that initiate and pattern the tooth germ. Loss-of-function
    variants in the WNT ligands WNT10A and WNT10B and the co-receptor
    LRP6 reduce pathway activation, while truncating AXIN2 variants dysregulate
    the pathway; either inhibition or aberrant stimulation of WNT signaling can
    prevent normal tooth development.
  genes:

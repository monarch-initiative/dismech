- name: BMP Antagonist Dysregulation
  description: >-
    Odontogenesis depends on BMP signaling as well as on WNT and ectodysplasin
    signaling, and GREM2 is a tooth-agenesis gene acting on the BMP arm. GREM2
    encodes a BMP antagonist that regulates BMPs during embryogenesis and tissue
    development, and Bmp4 has an established role in tooth development. Variants reported in individuals with tooth agenesis
    lowered GREM2 transcriptional activity in a dental cell system, and Grem2-null
    mice have small malformed incisors, so this node represents disturbed BMP
    antagonism in the developing tooth germ rather than a measured direction of
    net BMP signaling, which the cited sources do not report.

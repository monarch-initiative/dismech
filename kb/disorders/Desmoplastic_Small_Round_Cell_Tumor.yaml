name: Desmoplastic Small Round Cell Tumor
creation_date: '2026-01-26T02:55:13Z'
description: >-
  Desmoplastic small round cell tumor (DSRCT) is a highly aggressive mesenchymal
  malignancy characterized by the pathognomonic EWSR1-WT1 fusion gene resulting
  from t(11;22)(p13;q12). This fusion combines the transcriptional activation
  domain of EWSR1 with the DNA-binding zinc fingers of WT1, creating an aberrant
  transcription factor. DSRCT predominantly affects adolescent and young adult
  males, typically presenting with diffuse peritoneal involvement and bulky
  abdominal masses. Despite aggressive multimodal treatment, prognosis remains
  poor with 5-year survival rates under 20%. The unique biology of DSRCT reflects
  its hybrid phenotype with expression of epithelial, mesenchymal, and neural
  markers.
categories:
- Sarcoma
- Soft Tissue Sarcoma
- Rare Cancer
synonyms:
- DSRCT
- Desmoplastic small round cell tumour
- Desmoplastic small round-cell tumor
- Desmoplastic small round-cell neoplasm
- Polyphenotypic small round cell tumor
parents:
- small round cell tumor
has_subtypes:
- name: Intra-Abdominal DSRCT
  description: >-
    The classic presentation with multiple peritoneal implants studding the
    abdominal cavity. Primary tumor may arise from the peritoneum, omentum,
    or mesentery.
- name: Extra-Abdominal DSRCT
  description: >-
    Rare cases arising in other locations including paratesticular region,
    ovary, pleura, or soft tissues. Shares the same EWSR1-WT1 fusion and
    histologic features.
pathophysiology:
- name: EWSR1-WT1 Fusion Oncogene
  description: >-
    The t(11;22)(p13;q12) translocation fuses EWSR1 on chromosome 22 with WT1
    on chromosome 11. The resulting fusion protein contains the potent
    transcriptional activation domain of EWSR1 fused to the zinc finger
    DNA-binding domain of WT1. This chimeric transcription factor activates
    aberrant gene expression programs including PDGFA. The chimeric transcripts
    join the amino-terminal domain of EWS in frame to the last three zinc
    fingers of WT1, in both alternatively spliced forms. Silencing the fusion
    in two tumour cell lines showed that they depend on it, and the two
    isoforms of the fusion, which differ in the DNA-binding domain, were both
    needed to generate xenograft tumours that resemble primary disease.
  evidence:
  - reference: PMID:8187063
    reference_title: "Fusion of the EWS and WT1 genes in the desmoplastic small round cell tumor."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Southern blot analysis revealed recurrent rearrangement of both EWS, located at 22q12, and rearranged in other tumor-specific translocations in Ewing's sarcoma and clear cell sarcoma, and of WT1, the gene at 11p13 involved in a subset of Wilms' tumor."
    explanation: >-
      The first molecular study of the translocation, in a panel of five
      tumours: both genes were rearranged.
  - reference: PMID:7862627
    reference_title: "Characterization of the genomic breakpoint and chimeric transcripts in the EWS-WT1 gene fusion of desmoplastic small round cell tumor."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chimeric transcripts corresponding to the fusion gene were detected in four of six cases studied."
    explanation: >-
      The study that characterised the genomic breakpoint found the chimeric
      transcripts in four of six tumours.
  - reference: PMID:7862627
    reference_title: "Characterization of the genomic breakpoint and chimeric transcripts in the EWS-WT1 gene fusion of desmoplastic small round cell tumor."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of these transcripts show an in-frame fusion of RNA encoding the amino-terminal domain of EWS to both alternatively spliced forms of the last three zinc fingers of the DNA-binding domain of WT1."
    explanation: >-
      The structure of the fusion transcripts: the amino-terminal domain of
      EWS joined in frame to the last three zinc fingers of WT1, in both
      splice forms.
  - reference: PMID:32345977
    reference_title: "Desmoplastic small round cell tumor is dependent on the EWS-WT1 transcription factor."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: "We show a clear dependence of the tumor on EWS-WT1 in two different cell lines, BER and JN-DSCRT-1."
    explanation: >-
      Selective silencing of the fusion in two tumour cell lines showed that
      they depend on it. Cell-line work, hence IN_VITRO.
  - reference: PMID:39198430
    reference_title: "EWS-WT1 fusion isoforms establish oncogenic programs and therapeutic vulnerabilities in desmoplastic small round cell tumors."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "Similar to wild type WT1, EWS-WT1 has two isoforms that differ in their DNA binding domain and we find that they have distinct DNA binding profiles and are both required to generate viable tumors that resemble primary DSRCT."
    explanation: >-
      The two isoforms of the fusion bind DNA differently, and both were
      needed for tumour formation. The tumours were xenografts in mice, grown
      from mesothelial cells made to express the isoforms, so the item is
      graded MODEL_ORGANISM.
  - reference: PMID:20066421
    reference_title: "[Cystic desmoplastic small round cell tumor: tumor development from cystic-\"mesothelioblastic\" areas?]."
    supports: SUPPORT
    snippet: "Using microdissection techniques, EWS-WT1-gene fusion transcripts were detected in the cystic (single-cell-layered), the papillary and the solid tumor proliferations (exon 7 of EWS on chromosome 22 with exon 8 of WT1 on chromosome 11)."
    explanation: "Supports the presence of EWS-WT1 fusion transcripts in DSRCT."

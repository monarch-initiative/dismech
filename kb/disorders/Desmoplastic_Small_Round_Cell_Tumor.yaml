- name: Malignant Mesothelioma
  description: >-
    Named in the differential diagnosis of round cell neoplasms. DSRCT
    generally originates from the serosal surface of the abdominal cavity.
    Mesothelioma is curated separately as Malignant Mesothelioma, and its

biochemical:
- name: EWSR1-WT1 Fusion Detection
  notes: >-
    RT-PCR or FISH detection of the EWSR1-WT1 fusion is diagnostic. The fusion
    is virtually pathognomonic for DSRCT and not seen in other tumors.
- name: Multiphenotypic Markers
  notes: >-
    Immunohistochemistry shows characteristic co-expression of cytokeratin,
    desmin (often with paranuclear dot pattern), and WT1 (C-terminus antibody
    positive, which detects the fusion protein).
genetic:
- name: EWSR1-WT1 Fusion
  association: Somatic Fusion Oncogene
  notes: >-
    The t(11;22)(p13;q12) translocation creates the EWSR1-WT1 fusion in
    virtually all DSRCT cases. This fusion is both diagnostic and represents
    the primary oncogenic driver.
  evidence:
  - reference: PMID:8187063
    reference_title: "Fusion of the EWS and WT1 genes in the desmoplastic small round cell tumor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consistent comigration of the rearranged EWS and WT1 bands in multiple enzyme digests indicated fusion of the genomic sequences, presumably due to the translocation t(11;22) (p13;q12)."
    explanation: "Molecular characterization establishing the EWS-WT1 genomic fusion from the t(11;22)(p13;q12) translocation in DSRCT."
differential_diagnoses:
- name: Ewing Sarcoma
  description: >-
    Both are small round cell sarcomas in which the EWS gene is rearranged,
    and a 2021 review names Ewing sarcoma first among the round cell neoplasms
    in the differential diagnosis. The gene expression signatures of the two
    fusions overlap strikingly, although their DNA-binding partners are
    different types of transcription factor. The review notes that increased
    androgen receptor expression distinguishes DSRCT from Ewing sarcoma.
    PDGFA, a target of the EWS-WT1 fusion, was expressed in the tumour cells
    of primary DSRCT and absent in Ewing sarcomas with an EWS-FLI
    translocation. It is curated separately as Ewing Sarcoma.
  distinguishing_features:
  - The EWS-WT1 translocation, shown by PCR or FISH, distinguishes DSRCT from the other round cell neoplasms
  - Increased androgen receptor expression in DSRCT
  - PDGFA expressed in the tumour cells of DSRCT and absent in the Ewing sarcomas examined
  disease_term:
    preferred_term: Ewing sarcoma
    term:
      id: MONDO:0012817
      label: Ewing sarcoma
  evidence:
  - reference: PMID:33525546
    reference_title: "Desmoplastic Small Round Cell Tumor: A Review of Main Molecular Abnormalities and Emerging Therapy."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The differential diagnosis of DSRCTs can be made with a spectrum of other round cell neoplasms, which includes ES, rhabdomyosarcoma, small cell carcinoma and mesothelioma"
    explanation: >-
      A 2021 review lists the round cell neoplasms that enter the differential
      diagnosis; ES is Ewing sarcoma.
  - reference: PMID:33525546
    reference_title: "Desmoplastic Small Round Cell Tumor: A Review of Main Molecular Abnormalities and Emerging Therapy."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "There are many similarities between DSRCT and Ewing Sarcoma (ES) family tumors. Most of these tumors carry the EWS translocation. However, one important molecular aberration that distinguishes DSRCT from ES is the increased Androgen Receptor (AR) expression"
    explanation: >-
      The same review: the two share an EWS translocation, and increased
      androgen receptor expression distinguishes DSRCT.
  - reference: PMID:33525546
    reference_title: "Desmoplastic Small Round Cell Tumor: A Review of Main Molecular Abnormalities and Emerging Therapy."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "DSRCT is distinguished from the other neoplasms by the presence of EWS-WT1 translocation, ideally performed by PCR or FISH or by immunohistochemistry staining if the former are not available."
    explanation: >-
      The same review: the EWS-WT1 translocation is what separates DSRCT from
      the others, and it gives the methods in order of preference.
  - reference: PMID:9354795
    reference_title: "The EWS-WT1 translocation product induces PDGFA in desmoplastic small round-cell tumour."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "PDGFA was expressed within tumour cells in primary DSRT specimens, but it was absent in Wilms tumours expressing WT1 and Ewing sarcomas with an EWS-Fli translocation."
    explanation: >-
      In tissue, PDGFA was expressed in the tumour cells of DSRCT and absent
      in Ewing sarcomas with an EWS-FLI translocation. The abstract does not
      give the number of tumours examined.
  - reference: PMID:32345977
    reference_title: "Desmoplastic small round cell tumor is dependent on the EWS-WT1 transcription factor."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: "Surprisingly, there is striking overlap between the EWS-WT1 and EWS-FLI1 gene signatures, despite the fact that the DNA-binding domain of the fusion proteins, WT1 and FLI1, is structurally unique and classified as different types of transcription factors."
    explanation: >-
      A cell-line study of the genes downstream of the fusion: the signatures
      of the two fusions overlap. IN_VITRO.

datasets:
- accession: ega:EGAS00001007934
  title: Multi-Layered Molecular Profiling Informs the Diagnosis and Targeted Therapy of Desmoplastic Small Round Cell Tumor
  description: Desmoplastic small round cell tumor (DSRCT) is an ultra-rare soft tissue sarcoma with dismal prognosis and limited therapeutic options. Here, we identified individual therapeutic targets in a cohort of 30 DSRCT patients by use of multilayered molecular profiling (genomic, transcriptomic, and (phospho-)proteomic analyses) within the DKFZ NCT DKTK MASTER program. 28 of the 30 patients received at least one personalized treatment recommendation. In line with the observation that DSRCTs are an entity with a low mutational load, most of the treatment recommendations were based on target gene or -protein expression.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Desmoplastic Small Round Cell Tumor"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'

  downstream:
  - target: Multiphenotypic Differentiation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The fusion is taken to drive the tumour's expression of epithelial,
      mesenchymal and neural markers together. The link is indirect. The
      fusion is shown to control the gene expression programme that
      characterises primary tumours, and the first molecular study proposed
      that the partner gene of EWS accounts for the biological differences
      between the tumours that carry an EWS fusion. No study cited here shows
      which target genes produce the mixed marker expression.
    evidence:
    - reference: PMID:39198430
      reference_title: "EWS-WT1 fusion isoforms establish oncogenic programs and therapeutic vulnerabilities in desmoplastic small round cell tumors."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      snippet: "We show that EWS-WT1 is a powerful chromatin activator controlling an oncogenic gene expression program that characterizes primary tumors."
      explanation: >-
        The fusion controls the gene expression programme of the tumour. The
        work combined chromatin occupancy and three-dimensional chromatin
        profiles in tumour cell lines, hence IN_VITRO. It does not single out
        the marker genes, so the support for this edge is indirect.
    - reference: PMID:8187063
      reference_title: "Fusion of the EWS and WT1 genes in the desmoplastic small round cell tumor."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "The different translocation partners of the EWS gene, all of which are putative or definite transcription factor genes, may be responsible for the biological differences between DSRCT, Ewing's sarcoma, and clear cell sarcoma."
      explanation: >-
        The authors' proposal, in the study that found the fusion: the partner
        gene explains how the tumours differ. A proposal, stated with 'may
        be'.
  - target: PDGFA Activation
    causal_link_type: DIRECT
    description: >-
      Expression of the fusion protein induced the endogenous PDGFA gene in an
      inducible cell model, and wild-type WT1 did not regulate it. In tissue,
      PDGFA was expressed within the tumour cells of primary tumours and was
      absent in Wilms tumours expressing WT1 and in Ewing sarcomas with an
      EWS-FLI translocation.
    evidence:
    - reference: PMID:9354795
      reference_title: "The EWS-WT1 translocation product induces PDGFA in desmoplastic small round-cell tumour."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      snippet: "Expression of EWS-WT1 induced the expression of endogenous platelet-derived growth factor-A (PDGFA), a potent secreted mitogen and chemoattractant whose promoter contains the many potential WT1-binding sites."
      explanation: >-
        Osteosarcoma cell lines with inducible expression of the fusion:
        switching the fusion on induced the endogenous PDGFA gene, whose
        promoter has potential WT1-binding sites.
    - reference: PMID:9354795
      reference_title: "The EWS-WT1 translocation product induces PDGFA in desmoplastic small round-cell tumour."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      snippet: "Native PDGFA was not regulated by wild-type WT1, indicating a difference in target gene specificity between this tumour suppressor and its oncogenic derivative."
      explanation: >-
        The same cell model: wild-type WT1 did not regulate PDGFA, so the
        induction is a property of the fusion.
    - reference: PMID:9354795
      reference_title: "The EWS-WT1 translocation product induces PDGFA in desmoplastic small round-cell tumour."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "PDGFA was expressed within tumour cells in primary DSRT specimens, but it was absent in Wilms tumours expressing WT1 and Ewing sarcomas with an EWS-Fli translocation."
      explanation: >-
        In primary tumour specimens PDGFA was expressed in the tumour cells,
        and it was absent in the two comparison tumours, which carry WT1 or
        another EWS fusion.
- name: PDGFA Activation
  description: >-
    EWSR1-WT1 directly activates transcription of PDGFA, creating an autocrine
    growth loop that stimulates tumor cell proliferation and may contribute
    to the characteristic desmoplastic stromal reaction.
  evidence:
  - reference: PMID:9354795
    reference_title: "The EWS-WT1 translocation product induces PDGFA in desmoplastic small round-cell tumour."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression of EWS-WT1 induced the expression of endogenous platelet-derived growth factor-A (PDGFA), a potent secreted mitogen and chemoattractant whose promoter contains the many potential WT1-binding sites."
    explanation: "Inducible EWS-WT1 expression directly upregulates PDGFA, supporting the PDGFA-activation autocrine loop."
  - reference: PMID:9354795
    reference_title: "The EWS-WT1 translocation product induces PDGFA in desmoplastic small round-cell tumour."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the oncogenic fusion of EWS to WT1 in DSRT results in the induction of PDGFA, a potent fibroblast growth factor that contributes to the characteristic reactive fibrosis associated with this unique tumour."
    explanation: "Links PDGFA induction to the characteristic desmoplastic/reactive fibrosis of DSRCT."
  biological_processes:

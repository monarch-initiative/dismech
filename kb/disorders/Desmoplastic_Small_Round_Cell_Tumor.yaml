  downstream:
  - target: Desmoplastic Stromal Reaction
    causal_link_type: DIRECT
    description: >-
      PDGFA is a growth factor for fibroblasts, and the study that identified
      it as a target of the fusion concluded that it contributes to the
      reactive fibrosis around the nests of tumour cells. The conclusion rests
      on the expression of PDGFA in the tumour cells. The response of the
      stromal fibroblasts was not measured.
    evidence:
    - reference: PMID:9354795
      reference_title: "The EWS-WT1 translocation product induces PDGFA in desmoplastic small round-cell tumour."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "the oncogenic fusion of EWS to WT1 in DSRT results in the induction of PDGFA, a potent fibroblast growth factor that contributes to the characteristic reactive fibrosis associated with this unique tumour."
      explanation: >-
        The authors' conclusion: PDGFA, induced by the fusion, is a fibroblast
        growth factor that contributes to the reactive fibrosis. 'Contributes'
        is their word, and the fibrosis itself was not an experimental
        readout.
- name: Desmoplastic Stromal Reaction
  description: >-
    Nests of tumour cells are separated by an abundant fibrous stroma, the
    feature the tumour is named for. The first series of 19 cases listed an
    intense desmoplastic reaction among the main features of the entity, and a
    later study describes massive reactive fibrosis surrounding the nests of
    tumour cells.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:1709557
    reference_title: "Intra-abdominal desmoplastic small round-cell tumor. Report of 19 cases of a distinctive type of high-grade polyphenotypic malignancy affecting young individuals."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "nesting pattern of growth; focal rhabdoid features; intense desmoplastic reaction"
    explanation: >-
      Part of the list of main features in the first series of 19 cases, which
      gave the tumour its name.
  - reference: PMID:9354795
    reference_title: "The EWS-WT1 translocation product induces PDGFA in desmoplastic small round-cell tumour."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Desmoplastic small round-cell tumour (DSRT) is a multiphenotypic primitive tumour characterized by massive reactive fibrosis surrounding nests of tumour cells."
    explanation: >-
      The opening description of the tumour in the study that identified PDGFA
      as a target of the fusion.
  - reference: PMID:22550424
    reference_title: "Desmoplastic small round cell tumor: current management and recent findings."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is based on histological analysis of biopsies which typically show small round blue cells in nests separated by an abundant desmoplastic stroma."
    explanation: >-
      A 2012 review: the stroma is part of the histological picture on which
      the diagnosis rests.
- name: Multiphenotypic Differentiation
  description: >-
    DSRCT displays a unique multiphenotypic immunophenotype with co-expression
    of epithelial (cytokeratin, EMA), mesenchymal (vimentin, desmin), and neural
    (NSE) markers. This reflects the aberrant differentiation program driven
    by EWSR1-WT1.
  evidence:
  - reference: PMID:8187063
    reference_title: "Fusion of the EWS and WT1 genes in the desmoplastic small round cell tumor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a primitive histological appearance with prominent desmoplasia and striking divergent, multilineage differentiation."
    explanation: "Documents the divergent multilineage (multiphenotypic) differentiation characteristic of DSRCT."
  - reference: PMID:1709557
    reference_title: "Intra-abdominal desmoplastic small round-cell tumor. Report of 19 cases of a distinctive type of high-grade polyphenotypic malignancy affecting young individuals."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "features, more than any other member of this group, the capacity for simultaneous multidirectional phenotypical expression"
    explanation: >-
      The first series of 19 cases: among the small round cell tumours of
      childhood, this one stands out for expressing several lineages at once.
  - reference: PMID:33525546
    reference_title: "Desmoplastic Small Round Cell Tumor: A Review of Main Molecular Abnormalities and Emerging Therapy."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "In immunohistochemistry, there is an expression of desmin, membrane antigen (EMA), cytokeratins (AE1/AE3 and CAM5.2) and neural markers (neuron-specific enolase and CD57), and smaller numbers expressing chromogranin, synaptophysin, CD56, neurofilament protein and S100 protein"
    explanation: >-
      A 2021 review lists the markers: desmin, epithelial membrane antigen and
      cytokeratins, and neural markers, with other markers in smaller numbers
      of tumours.

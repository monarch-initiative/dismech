    snippet: >-
      It is an extremely rare autosomal recessive disorder (estimated prevalence of 1 in
      1,000,000), which is usually diagnosed during childhood, although it can remain
      undetected until adulthood.
    explanation: Gives the prevalence estimate and the age at diagnosis.
- population: Reported cases in the literature to 2021
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Forty-two reported cases, half of them in the Turkish population - an ascertainment
    concentration that follows from the disorder's recessive inheritance and the role of
    consanguinity.
  evidence:
  - reference: PMID:33996798
    reference_title: "Keutel Syndrome, a Review of 50 Years of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Forty-two cases have been reported so far, with half in Turkish population (Table 1)."
    explanation: Gives the cumulative case count and its geographic concentration.
progression:
- phase: Infancy - recurrent otitis media and unremarkable examination
  notes: >-
    Many patients are normal at birth. Recurrent otitis media in infancy is a common early
    thread, and it feeds into the hearing loss that becomes a persistent problem.
  evidence:
  - reference: PMID:37252084
    reference_title: "Tracheobronchial Tree Ossification in a 5-Year-Old Boy with Keutel Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He had no obvious abnormalities at birth but suffered from recurrent episodes of
      infectious otitis media during infancy.
    explanation: Documents a normal newborn examination followed by recurrent otitis media.
- phase: Childhood - diagnosis, usually via the facial or cardiac findings
  notes: >-
    Diagnosis is usually made in childhood. In practice it is triggered either by the
    facial appearance and brachytelephalangism or by a heart murmur, since peripheral
    pulmonary artery stenosis is present in almost all patients and can be found
    incidentally.
  evidence:
  - reference: PMID:37252084
    reference_title: "Tracheobronchial Tree Ossification in a 5-Year-Old Boy with Keutel Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Finally, at the age of 5 years, after an accidental auscultation of a systolic
      murmur, he was referred to our center for further investigation.
    explanation: Documents a diagnosis reached through incidental cardiac auscultation.
- phase: Long-term - good prognosis, determined by pulmonary complications
  notes: >-
    Unlike most entries in its nosology group, Keutel syndrome is not lethal and most
    patients do well. What sets life expectancy is the severity of the pulmonary
    complications, which is why surveillance is directed at the pulmonary arteries, the
    airway, and hearing rather than at the skeleton.
  evidence:
  - reference: PMID:33996798
    reference_title: "Keutel Syndrome, a Review of 50 Years of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prognosis of KS is good in most patients and their life expectancy mostly depends
      on the severity of the pulmonary complications.
    explanation: States the prognosis and what determines it.
pathophysiology:
- name: Matrix Gla Protein Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic MGP variants produce a non-functional matrix Gla protein. MGP is a 10-kD
    extracellular matrix protein of the Gla family - the family that also contains
    osteocalcin and the vitamin-K-dependent coagulation factors - whose glutamate residues
    are gamma-carboxylated using vitamin K as cofactor. It is the gamma-carboxyglutamate
    residues that give the mature protein its high affinity for calcium, phosphate, and
    hydroxyapatite, so a protein that is not properly made or not properly carboxylated
    cannot bind the mineral it is meant to control.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    gene:
      preferred_term: MGP
      term:
        id: hgnc:7060
        label: MGP
    description: >-
      Biallelic germline loss-of-function variants. The three variants in the original
      mapping study - a single-base deletion, a splice-acceptor change, and a missense
      change - all predict a non-functional protein, and parental consanguinity is common.
  biological_processes:
  - preferred_term: peptidyl-glutamic acid carboxylation
    term:
      id: GO:0017187
      label: peptidyl-glutamic acid carboxylation
  - preferred_term: negative regulation of biomineral tissue development
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0070168
      label: negative regulation of biomineral tissue development
  evidence:
  - reference: PMID:9916809
    reference_title: "Mutations in the gene encoding the human matrix Gla protein cause Keutel syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutational analysis of MGP in three unrelated probands identified three different
      mutations: c.69delG, IVS1-2A-->G and c.113T-->A. All three mutations predict a
      non-functional MGP.
    explanation: Establishes loss of function of MGP as the molecular lesion in three unrelated families.
  - reference: PMID:9916809
    reference_title: "Mutations in the gene encoding the human matrix Gla protein cause Keutel syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      All members of this family have glutamic acid residues modified to gamma-carboxyglutamic
      acids (Gla) by a specific gamma-carboxylase using vitamin K as a cofactor.
    explanation: >-
      States the vitamin-K-dependent post-translational modification that the protein's
      mineral-binding capacity depends on.
  downstream:
  - target: Loss of Active Inhibition of Extracellular Matrix Calcification
    description: >-
      Without a functional mineral-binding Gla protein in the matrix, the brake on
      calcification is removed in the tissues that express it.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:9916809
      reference_title: "Mutations in the gene encoding the human matrix Gla protein cause Keutel syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The modified glutamic acid residues of Gla proteins confer a high affinity for
        mineral ions such as calcium, phosphate and hydroxyapatite crystals, the mineral
        components of the skeletal ECM.
      explanation: >-
        Explains the physical basis for the protein's action on mineral, and hence for what
        is lost.
- name: Loss of Active Inhibition of Extracellular Matrix Calcification
  biological_scale: TISSUE
  description: >-
    The central mechanistic claim of this disorder, and the one that generalized beyond
    it: extracellular matrix calcification in soft tissue is actively inhibited, not
    merely not induced. MGP is expressed by the two cell types that build an uncalcified
    matrix - vascular smooth muscle cells and chondrocytes - and those are exactly the
    tissues that mineralize when it is lost.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: biomineral tissue development
    modifier: INCREASED
    term:
      id: GO:0031214
      label: biomineral tissue development
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: PMID:9052783
    reference_title: "Spontaneous calcification of arteries and cartilage in mice lacking matrix GLA protein."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results indicate that ECM calcification must be actively inhibited in soft
      tissues.
    explanation: >-
      States the general principle that the knockout phenotype established, and which this
      disorder is the human instance of.
  - reference: PMID:9052783
    reference_title: "Spontaneous calcification of arteries and cartilage in mice lacking matrix GLA protein."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A candidate molecule is matrix GLA protein (Mgp), a mineral-binding ECM protein
      synthesized by vascular smooth-muscle cells and chondrocytes, two cell types that
      produce an uncalcified ECM.
    explanation: >-
      Identifies the expressing cell types and, in doing so, predicts which tissues are at
      risk.
  downstream:
  - target: Abnormal Cartilage Calcification
    description: >-
      Cartilage that should stay uncalcified mineralizes - larynx, tracheobronchial tree,
      ears, nose, and ribs.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33996798
      reference_title: "Keutel Syndrome, a Review of 50 Years of Literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        abnormal cartilage calcification in the larynx, the respiratory tract, the ears,
        the nose and the ribs
      explanation: Enumerates the cartilages that calcify in patients.
  - target: Peripheral Pulmonary Artery Stenosis
    description: >-
      The vascular arm of the same lesion. Multiple peripheral pulmonary artery stenoses
      are found in almost all patients and are the finding that governs prognosis.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Loss of MGP-mediated inhibition of mineralization in vascular smooth muscle, with mural calcification and segmental narrowing of the peripheral pulmonary arteries.
    evidence:
    - reference: PMID:37252084
      reference_title: "Tracheobronchial Tree Ossification in a 5-Year-Old Boy with Keutel Syndrome: A Case Report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Computed tomography angiography confirmed calcification and segmental stenosis in
        the peripheral pulmonary arteries.
      explanation: >-
        Imaging shows calcification and stenosis together in the same vessels, which is the
        observation that links the vascular narrowing to the calcification mechanism.
  - target: Midface Hypoplasia
    description: >-
      Underdevelopment of the midface, with depressed nasal bridge, hypoplastic nasal alae,
      and sloping forehead. Nasal cartilage is among the cartilages affected, so the
      craniofacial phenotype is plausibly the same lesion in a different site, though the
      developmental route is not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Brachytelephalangism
    description: >-
      Shortening and broadening of the first to fourth distal phalanges with punctate
      epiphyses, characteristically sparing the fifth. This is the feature that places the
      disorder in the chondrodysplasia punctata group.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Epiphyseal Stippling
    description: >-
      Punctate epiphyses in the shortened distal phalanges - the chondrodysplasia punctata
      finding itself.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Abnormal Cartilage Calcification
  biological_scale: TISSUE
  description: >-
    Pathological mineralization of cartilage across multiple sites. In the airway it
    progresses to frank ossification of the tracheobronchial tree, and in the ear
    cartilage, biopsies have shown direct ossification without preceding tissue reaction -
    which is the histological reading of a lost inhibitor rather than an inflammatory or
    reactive process.
  biological_processes:
  - preferred_term: cartilage development
    modifier: ABNORMAL
    term:
      id: GO:0051216
      label: cartilage development
  evidence:
  - reference: PMID:37252084
    reference_title: "Tracheobronchial Tree Ossification in a 5-Year-Old Boy with Keutel Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biopsies of ear cartilages have shown direct ossification without any tissue reaction
      or calcification, resulting in neurosensory and conductive hearing loss.
    explanation: >-
      The histological pattern - direct ossification with no tissue reaction - and its link
      to the hearing loss.
  downstream:
  - target: Tracheal Calcification
    causal_link_type: DIRECT
    description: Calcification and ossification of the tracheobronchial cartilage, visible on chest radiography.
  - target: Calcification of the Auricular Cartilage
    causal_link_type: DIRECT
    description: >-
      Direct ossification of the ear cartilage, the site whose histology was examined.
  - target: Mixed Hearing Impairment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Direct ossification of auricular and middle-ear cartilage, giving both conductive and sensorineural components.
    description: >-
      Hearing loss, mild to severe, unilateral or bilateral, and mixed in character - the
      conductive element following the ossified cartilage directly.
- name: Peripheral Pulmonary Artery Stenosis
  biological_scale: ORGANISM
  description: >-
    Multiple stenoses of the peripheral pulmonary arteries, present in almost all patients.
    They raise right ventricular afterload and can lead to pulmonary hypertension,
    tricuspid regurgitation, and right ventricular hypertrophy and dysfunction. This node,
    not the skeletal phenotype, determines the patient's prognosis.
  evidence:
  - reference: PMID:33996798
    reference_title: "Keutel Syndrome, a Review of 50 Years of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional symptoms found in almost all patients include multiple peripheral pulmonary
      artery stenoses
    explanation: Establishes the near-universal presence of the pulmonary artery stenoses.
  downstream:
  - target: Pulmonary Arterial Hypertension
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Fixed obstruction to pulmonary arterial flow with elevated pulmonary vascular resistance.
    description: >-
      Pulmonary hypertension with right-heart consequences follows from the fixed
      obstruction.
    evidence:
    - reference: PMID:37252084
      reference_title: "Tracheobronchial Tree Ossification in a 5-Year-Old Boy with Keutel Syndrome: A Case Report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Transthoracic echocardiography illustrated peripheral pulmonary artery stenosis,
        moderate tricuspid regurgitation, and pulmonary hypertension.
      explanation: Documents the stenoses together with pulmonary hypertension in one patient.

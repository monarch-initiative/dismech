animal_models:
- name: Mgp-null mouse
  species: Mouse
  genotype: Mgp knockout, homozygous null
  publication: PMID:9052783
  description: >-
    The knockout that established the mechanism before the human gene was known, and which
    is described in the review literature as a faithful model of the human syndrome. Null
    mice develop to term and then die within two months of arterial calcification leading
    to blood-vessel rupture, with inappropriate calcification of cartilage including the
    growth plate.
  modeled_mechanisms:
  - target: Loss of Active Inhibition of Extracellular Matrix Calcification
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The knockout demonstrated that MGP loss is sufficient for spontaneous calcification of
      both arteries and cartilage, which is the mechanism the human disorder instantiates.
      Its explanatory role was not merely confirmatory: the mouse phenotype is what made MGP
      the compelling candidate in the human linkage interval.
    limitations: >-
      The mouse phenotype is considerably more severe on the vascular side than the human
      disorder - null mice die within two months of vessel rupture, whereas Keutel patients
      generally have a good prognosis - so the model overstates the vascular lethality even
      while capturing the mechanism.
    readouts:
    - name: Spontaneous arterial calcification with vessel rupture
      target: Loss of Active Inhibition of Extracellular Matrix Calcification
      direction: INCREASED
      interpretation: Mineralization of an arterial matrix that is normally kept uncalcified.
      evidence:
      - reference: PMID:9052783
        reference_title: "Spontaneous calcification of arteries and cartilage in mice lacking matrix GLA protein."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Mice that lack Mgp develop to term but die within two months as a result of
          arterial calcification which leads to blood-vessel rupture.
        explanation: Reports the vascular calcification phenotype and its lethality.
    - name: Inappropriate cartilage calcification including the growth plate
      target: Loss of Active Inhibition of Extracellular Matrix Calcification
      direction: INCREASED
      interpretation: >-
        The cartilage arm of the same lesion, and the direct counterpart of the human
        cartilage calcification.
      evidence:
      - reference: PMID:9052783
        reference_title: "Spontaneous calcification of arteries and cartilage in mice lacking matrix GLA protein."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Mgp-deficient mice additionally exhibit inappropriate calcification of various
          cartilages, including the growth plate, which eventually leads to short stature,
          osteopenia and fractures.
        explanation: Reports the cartilage calcification and its skeletal consequences.
    evidence:
    - reference: PMID:33996798
      reference_title: "Keutel Syndrome, a Review of 50 Years of Literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        While studies on Mgp -/- mouse, a faithful model of KS, show that pathologic mineral
        deposition (ectopic calcification) in cartilaginous and vascular tissues is the
        primary cause underlying many of these abnormalities, the mechanisms explaining how
        MGP prevents abnormal calcification remain poorly understood.
      explanation: >-
        The review calls the knockout a faithful model of the human syndrome, and in the same
        sentence marks the limit of what it has explained.
differential_diagnoses:
- name: Chondrodysplasia punctata, including Conradi's disease
  disease_term:
    preferred_term: chondrodysplasia punctata
    term:
      id: MONDO:0019701
      label: chondrodysplasia punctata
  description: >-
    Not a theoretical differential: the review literature records that the shared features -
    midface hypoplasia, abnormal cartilage calcification, brachytelephalangism, peripheral
    pulmonary stenosis - have caused Keutel syndrome to be misdiagnosed as chondrodysplasia
    punctata. Since the ISDS nosology places Keutel syndrome inside the CDP group, this is
    a differential within a family rather than across families.
  distinguishing_features:
  - Keutel syndrome has multiple peripheral pulmonary artery stenoses in almost all patients; these are not a feature of the other CDPs
  - Keutel syndrome calcifies cartilage that should never mineralize (larynx, trachea, ears, nose) rather than showing transient epiphyseal stippling that resolves
  - Keutel syndrome is autosomal recessive with normal serum calcium and phosphate and no diagnostic sterol or plasmalogen abnormality
  evidence:
  - reference: PMID:33996798
    reference_title: "Keutel Syndrome, a Review of 50 Years of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      are also observed in other disorders (for example, chondrodysplasia punctata or
      Conradi's disease), leading to the misdiagnosis of some forms of KS into another
      disease (Say et al., 1973)
    explanation: Documents actual misdiagnosis as chondrodysplasia punctata.
discussions:
- discussion_id: mgp_inhibition_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Active Inhibition of Extracellular Matrix Calcification
  - treatments#Symptomatic management of hypertension and respiratory complications
  prompt: >-
    By what molecular mechanism does matrix Gla protein prevent calcification of cartilage
    and vascular matrix?
  rationale: >-
    That MGP is a calcification inhibitor is established from both directions - the null
    mouse calcifies spontaneously, and the human loss-of-function disorder reproduces it -
    and the physical basis is at least sketched, since gamma-carboxyglutamate residues bind
    calcium, phosphate, and hydroxyapatite. What is not established is how that binding
    translates into inhibition: whether MGP sequesters mineral ions, caps nascent
    hydroxyapatite crystals, antagonizes BMP signalling in the matrix, or acts by some
    combination. The review that marks the syndrome's fiftieth year states the gap plainly
    and draws the practical consequence - it is why there is no cure and why treatment is
    symptomatic. This is an unusually well-posed gap: the disorder, the knockout, and the
    protein's chemistry are all in hand, and what is missing is the step between them.
  evidence:
  - reference: PMID:33996798
    reference_title: "Keutel Syndrome, a Review of 50 Years of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the mechanisms explaining how MGP prevents abnormal calcification remain poorly
      understood. This has negative implication for the development of a cure for KS.
    explanation: States the gap and links it directly to the absence of a therapy.
- discussion_id: vitamin_k_dependence_therapeutic_angle
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Matrix Gla Protein Loss of Function
  prompt: >-
    Does the vitamin-K dependence of MGP carboxylation offer any therapeutic leverage in
    patients whose MGP variants leave a partially functional protein?
  rationale: >-
    MGP requires vitamin-K-dependent gamma-carboxylation to bind mineral, so its activity
    has a cofactor-dependent step that a null allele destroys but a hypomorphic one might
    only limit. The reported MGP variants include a missense change alongside frameshift and
    splice alleles, and intrafamilial phenotypic variability has been described - both
    consistent with a range of residual function. Whether vitamin K status modifies the
    phenotype in such patients has not, as far as this entry's sources go, been tested. The
    question is worth recording because it is one of the few angles on a disorder for which
    only symptomatic treatment exists, and because the same vitamin-K axis connects this
    entry to CDPX1, the other brachytelephalangic entity in the same nosology group, whose
    enzyme is warfarin-sensitive and which has vitamin-K-deficiency phenocopies.
  evidence:
  - reference: PMID:9916809
    reference_title: "Mutations in the gene encoding the human matrix Gla protein cause Keutel syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      All members of this family have glutamic acid residues modified to gamma-carboxyglutamic
      acids (Gla) by a specific gamma-carboxylase using vitamin K as a cofactor.
    explanation: >-
      Establishes the vitamin-K-dependent step on which the question turns. Note this
      supports the biochemistry only; no source cited here tests a vitamin-K intervention in
      patients.
notes: >-
  Curated as its own dismech entry because the ISDS 2023 nosology lists it as its own row
  (NOS 23-0040). It is the least typical member of its group - the mechanism is loss of an
  inhibitor of mineralization rather than a defect in a biosynthetic pathway, and the
  clinically dominant feature is cardiovascular - but the placement is sound: three quarters
  of genotyped patients have brachytelephalangism with punctate epiphyses, and the syndrome
  has been misdiagnosed as chondrodysplasia punctata in practice. A member of the
  Chondrodysplasia_Punctata grouping.

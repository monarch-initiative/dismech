name: Keutel Syndrome
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Keutel syndrome is an autosomal recessive disorder of abnormal cartilage calcification
  with peripheral pulmonary artery stenosis and midface hypoplasia, caused by biallelic
  loss-of-function variants in MGP, which encodes matrix Gla protein. Its mechanism runs
  in the opposite direction from most skeletal dysplasias: nothing fails to mineralize,
  something fails to *stop* mineralizing. Matrix Gla protein is a small extracellular
  matrix protein secreted by chondrocytes and vascular smooth muscle cells - precisely
  the two cell types that are supposed to build an uncalcified matrix - and its glutamate
  residues are gamma-carboxylated by a vitamin-K-dependent carboxylase, which is what
  gives the mature protein its high affinity for calcium, phosphate, and hydroxyapatite.
  Losing it removes an active brake, and the tissues that most need that brake calcify:
  laryngeal, tracheobronchial, costal, nasal, and auricular cartilage, and in some
  patients the arteries. The gene was reached by homozygosity mapping and picked out of
  the linked interval on the strength of a mouse phenotype - Mgp-null mice, which
  calcify their arteries fatally and their cartilages progressively, had already
  established that extracellular matrix calcification must be actively inhibited in soft
  tissue rather than merely not induced. Keutel syndrome sits in the chondrodysplasia
  punctata group of the skeletal nosology, and it earns the placement: about three
  quarters of patients have brachytelephalangism with punctate epiphyses, and the review
  literature records that the syndrome's core features overlap chondrodysplasia punctata
  closely enough that cases have been misdiagnosed as Conradi's disease. The prognosis is
  generally good and depends mainly on the pulmonary complications, but no
  disease-modifying therapy exists and the mechanism by which MGP prevents abnormal
  calcification remains poorly understood.
synonyms:
- KTLS
- Pulmonic stenosis, brachytelephalangism, and calcification of cartilages
- Pulmonic stenosis-brachytelephalangism-calcification of cartilages syndrome
disease_term:
  preferred_term: Keutel syndrome
  term:
    id: MONDO:0009495
    label: Keutel syndrome
parents:
- Chondrodysplasia Punctata
- Congenital Limb Malformation
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      An autosomal recessive Mendelian multisystem disorder diagnosed by genetic testing.
  - classification_value: CARDIOVASCULAR
    notes: >-
      The manifestation that determines prognosis is cardiovascular - multiple peripheral
      pulmonary artery stenoses, with pulmonary hypertension and right-heart consequences -
      and it is often what brings the patient to attention, in one reported case an
      incidentally auscultated murmur.
  isds_skeletal_category:
  - classification_value: chondrodysplasia_punctata
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 23 "Chondrodysplasia punctata (CDP) group", row
      NOS 23-0040 "Keutel syndrome, MGP-related" (MIM 245150). Carried forward from the
      2019 revision (Mortier et al., PMID:31633310), where the group was numbered 21.
      The placement is worth a note because Keutel syndrome is the group's mechanistic
      inverse - the other members fail to mineralize cartilage correctly, whereas here an
      inhibitor of mineralization is lost - and because its dominant clinical problem is
      cardiovascular rather than skeletal. It nonetheless belongs: brachytelephalangism
      with punctate epiphyses is present in about three quarters of genotyped patients,
      and the clinical overlap with chondrodysplasia punctata is close enough to have
      caused documented misdiagnosis. Note also that MGP is vitamin-K-dependent, which
      places Keutel syndrome and CDPX1 - the group's other brachytelephalangic entity, and
      one whose enzyme is warfarin-sensitive with vitamin-K-deficiency phenocopies - on a
      shared thematic axis the nosology does not itself draw.

  notes: >-
    Estimated at 1 in 1,000,000 in the 50-year review. The review itself argues the figure
    is probably an underestimate, since mild and intrafamilially variable cases may go
    undetected and since the core features overlap other disorders well enough to cause
    misdiagnosis.

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic variants are required and parental consanguinity is common, which is why
    homozygosity mapping succeeded and why reported cases cluster geographically.
    Intrafamilial phenotypic variability has been reported, so a mildly affected sibling
    may go unrecognized.
  evidence:
  - reference: PMID:33996798
    reference_title: "Keutel Syndrome, a Review of 50 Years of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although parental consanguinity is prevalent in KS, pregnancy is normal (except for
      one reported case of repeated miscarriages) and blood parameters, including calcium
      and phosphate serum levels, are usually unremarkable.
    explanation: >-
      States the prevalence of consanguinity, and separately the important negative that
      serum calcium and phosphate are normal.
biochemical:
- name: Serum calcium and phosphate
  notes: >-
    A diagnostically important *negative*. Serum calcium and phosphate are usually
    unremarkable, so this is not a disorder of mineral homeostasis - the lesion is local
    control of where mineral is allowed to deposit, not how much of it circulates. A normal
    mineral panel therefore does not argue against the diagnosis.
  evidence:
  - reference: PMID:33996798

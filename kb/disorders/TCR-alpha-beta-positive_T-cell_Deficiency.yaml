diagnosis:
- name: Lymphocyte immunophenotyping for TCR-alpha-beta and gamma-delta subsets
  description: >-
    Flow cytometry showing absent or near-absent CD3+TCRαβ+ cells with a preserved or expanded
    gamma-delta compartment and normal B and NK cells. This pattern is what separates TRAC
    deficiency from SCID, where both T cell lineages are missing, and it is the step that was not
    performed in one reported newborn.
  evidence:
  - reference: PMID:41103553
    reference_title: Two different forms of inherited human TCRα chain deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunophenotyping for these two patients revealed normal natural killer (NK) and B cell levels,
      a predominance of TCR-γδ+ T cells, and a complete absence of TCR-αβ+ T cells
    explanation: Gives the diagnostic flow-cytometry pattern.
- name: TRAC sequencing
  description: Confirmation by sequencing TRAC, by targeted Sanger or by exome sequencing.
  evidence:
  - reference: PMID:33909184
    reference_title: "Skewed TCR Alpha, but not Beta, Gene Rearrangements and Lymphoma Associated with a Pathogenic TRAC Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In view of the markedly decreased TCR αβ T lymphocytes, we performed Sanger sequencing of the
      TRAC gene and detected a homozygous G-to-A nucleotide substitution at the last nucleotide of
      exon 3, immediately following the translation termination codon
    explanation: Shows the immunophenotype prompting targeted TRAC sequencing.
- name: Newborn screening by T cell receptor excision circles
  description: >-
    One patient was found presymptomatically through SCID newborn screening on a low TREC result and
    transplanted before any infection, so TRAC deficiency can present as a screen-positive newborn.
  evidence:
  - reference: PMID:41103553
    reference_title: Two different forms of inherited human TCRα chain deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a third report, Garkaby et al. described an asymptomatic individual identified through SCID
      newborn screening with low T cell receptor excision circle (TREC) levels.
    explanation: Records ascertainment through TREC-based newborn screening.
treatments:
- name: Hematopoietic Stem Cell Transplantation
  description: >-
    The only treatment reported to be curative. Patients with the complete form need it urgently, as
    in SCID; two patients with the hypomorphic allele were transplanted at six and seven years, and
    one Iranian patient was transplanted successfully at 22 months.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Arrest of Alpha-Beta Thymocyte Selection
    description: Donor progenitors carry wild-type TRAC, restoring alpha-beta thymopoiesis.
  evidence:
  - reference: PMID:41103553
    reference_title: Two different forms of inherited human TCRα chain deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Morgan et al. reported two patients with recurrent viral and bacterial infections who underwent
      hematopoietic stem cell transplantation (HSCT) at the ages of 6 and 7 years
    explanation: Records transplantation as the treatment used in the founding patients.
- name: Immunoglobulin Replacement and Antimicrobial Prophylaxis
  description: >-
    Supportive management used in the Indian kindred, with monthly intravenous immunoglobulin plus
    cotrimoxazole and itraconazole prophylaxis. It did not prevent progression to death from
    pulmonary disease in two of the three siblings.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:33909184
    reference_title: "Skewed TCR Alpha, but not Beta, Gene Rearrangements and Lymphoma Associated with a Pathogenic TRAC Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He was commenced on monthly intravenous immunoglobulin replacement and prophylactic
      cotrimoxazole and itraconazole.
    explanation: Records the supportive regimen used.
differential_diagnoses:
- name: Severe combined immunodeficiency
  description: >-
    In SCID both alpha-beta and gamma-delta T cells are missing. In TRAC deficiency the gamma-delta
    compartment is preserved and expanded, which is the distinguishing flow-cytometry finding.
  distinguishing_features:
  - Gamma-delta T cells preserved or expanded rather than absent.
  evidence:
  - reference: PMID:41103553
    reference_title: Two different forms of inherited human TCRα chain deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic defects that result in the absence of all T cells, including both αβ and γδ T cells,
      are classified as severe combined immunodeficiency (SCID), a life-threatening condition
      requiring immediate hematopoietic stem cell transplantation (HSCT) in affected newborns.
    explanation: Defines SCID by the loss of both lineages, which is what TRAC deficiency spares.
- name: DOCK8 deficiency
  description: >-
    Shares extensive cutaneous warts, eczema and high IgE, and was the first diagnosis considered in
    the Indian kindred. DOCK8 sequencing was normal.
  distinguishing_features:
  - Normal DOCK8 sequencing.
  - Absent TCR-alpha-beta T cells with expanded gamma-delta cells.
  evidence:
  - reference: PMID:33909184
    reference_title: "Skewed TCR Alpha, but not Beta, Gene Rearrangements and Lymphoma Associated with a Pathogenic TRAC Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While the clinical phenotype of first 2 siblings mimicked DOCK8 deficiency, no pathogenic
      variants in the DOCK8 gene were demonstrated upon targeted sequencing.
    explanation: Records that DOCK8 deficiency was considered first and excluded by sequencing.
- name: RAG1, RAG2, DCLRE1C and non-homologous end joining defects
  description: >-
    These also skew the TCR alpha repertoire, but in the opposite direction, sparing distal gene
    segments, whereas TRAC deficiency preferentially uses the most upstream V and most downstream J
    segments.
  distinguishing_features:
  - Distal TRAV and TRAJ segments infrequently used, rather than preferentially used.
  evidence:
  - reference: PMID:33909184
    reference_title: "Skewed TCR Alpha, but not Beta, Gene Rearrangements and Lymphoma Associated with a Pathogenic TRAC Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is in sharp contrast to the skewing of the TRA repertoire observed in patients with RAG1,
      RAG2, DCLRE1C, and NHEJ defects, where distal TRAV and TRAJ gene segments are infrequently used
    explanation: States the opposite repertoire skew that separates these causes.
notes: >-
  Fewer than a dozen patients have been reported, from Pakistan, India and Iran, so no frequency
  values are recorded. The 2025 study counts six patients in four families before the two it adds.

  A founder effect for the hypomorphic c.*+1G>A allele across India and Pakistan was raised as a
  possibility by the 2021 report, and all five patients carrying it come from that region. It is
  recorded here as the authors put it, a possibility, rather than as an established founder variant.

  The defining laboratory finding, a reduced proportion of TCR-alpha-beta T cells, has no HPO term.
  HPO carries Increased and Decreased gamma-delta T cell proportion, and many CD4 and CD8 subset
  terms, but nothing for the alpha-beta subset, so that finding is modelled as a pathophysiology
  node and through the gamma-delta expansion rather than as a bound phenotype.

  Early death is recorded in the Complete subtype's description and in the pathophysiology prose
  rather than as a phenotype. HP:0001522 Death in infancy sits in HPO's mortality branch rather than
  under Phenotypic abnormality, so it is outside the PhenotypeTerm dynamic enum and cannot be bound
  in a phenotype slot.

  No GeneReviews chapter covers TRAC deficiency, by disease name or through the gene.

  ClinGen rates TRAC Moderate for this disease in the SCID-CID GCEP. The assertion is recorded in
  gene_disease_validity, and the gene's own notes say why relationship_type is still CAUSATIVE.

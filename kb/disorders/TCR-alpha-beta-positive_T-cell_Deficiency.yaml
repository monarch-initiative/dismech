name: TCR-alpha-beta-positive T-cell Deficiency
creation_date: "2026-11-18T11:48:17Z"
category: Mendelian
description: >-
  TCRα chain deficiency is an autosomal recessive inborn error of immunity in which biallelic TRAC
  variants stop the T cell receptor alpha constant region from assembling a surface TCRαβ complex.
  Thymocytes cannot complete alpha-beta selection, so TCRαβ-positive T cells are absent from blood
  while γδ T cells, B cells and NK cells are preserved and the γδ compartment expands. The severity
  tracks how much residual TCRαβ the allele leaves. A hypomorphic splice allele leaves a small
  CD3-low TCRαβ-low subset and produces a combined immunodeficiency with recurrent sinopulmonary and
  viral infection, bronchiectasis, warts, lymphoproliferation, autoimmunity and a risk of lymphoma,
  with survival into the second decade. Premature stop codons leave none, and produce a SCID-like
  illness with disseminated BCG infection and death in infancy or early childhood. Fewer than a dozen
  patients have been reported.
disease_term:
  preferred_term: TCR-alpha-beta-positive T-cell deficiency
  term:

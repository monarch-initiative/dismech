inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Every reported patient is homozygous for a TRAC variant, in consanguineous or geographically
    clustered families from Pakistan, India and Iran. Heterozygous parents are unaffected.
  evidence:
  - reference: PMID:41103553
    reference_title: Two different forms of inherited human TCRα chain deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal recessive (AR) TCRα chain deficiency, resulting from rare variants of the TCRα
      constant chain (TRAC), has been reported in six patients from four unrelated families from
      Pakistan
    explanation: States the recessive mode and the reported cohort.
  - reference: PMID:21206088
    reference_title: Mutation in the TCRα subunit constant gene (TRAC) leads to a human immunodeficiency disorder characterized by a lack of TCRαβ+ T cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe two families with an autosomal recessive inherited immunodeficiency disorder
      characterized by increased susceptibility to infection and autoimmunity.
    explanation: The founding report states autosomal recessive inheritance.
has_subtypes:
- name: Complete
  display_name: Complete TCRα deficiency (SCID-like)
  description: >-
    Premature stop codons abolish surface TCRαβ entirely. The illness behaves like severe combined
    immunodeficiency, with disseminated BCG infection after vaccination and death in infancy or
    early childhood unless transplanted. Recognised by premature termination variants such as
    p.Trp65*, p.Ser116* and p.Arg121*, by no residual surface TCRαβ in a cell-based assay, and by a
    SCID-like course with early death or early transplantation.
  evidence:
  - reference: PMID:41103553
    reference_title: Two different forms of inherited human TCRα chain deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe two children with biallelic premature stop codons in TRAC. These mutations
      result in a complete loss of TCRαβ expression on the cell surface and an absence of αβ T cells,
      leading to severe immunodeficiency and early death.
    explanation: Defines the complete form and its outcome.
- name: Partial
  display_name: Partial (hypomorphic) TCRα deficiency (CID-like)
  description: >-
    The recurrent splice allele c.*+1G>A retains partial activity, leaving a small CD3-low
    TCRαβ-low T cell subset. The course is a combined immunodeficiency rather than SCID, with
    survival into the second decade. Recognised by the hypomorphic splice allele c.*+1G>A at the
    last base of exon 3, by a residual CD3-low TCRαβ-low T cell subset, and by the longer survival.
  evidence:
  - reference: PMID:41103553
    reference_title: Two different forms of inherited human TCRα chain deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings show that complete TCRα deficiency causes a SCID-like clinical presentation,
      whereas partial TCRα deficiency is associated with milder clinical outcomes and longer survival.
    explanation: States the two-form split that these subtypes record.
genetic:
- name: TRAC
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: TRAC
    term:
      id: hgnc:12029
      label: TRAC
  gene_disease_validity:
  - validity_classification: MODERATE
    classified_by: CLINGEN
    external_id: CGGV:assertion_a49ea507-7acb-4bed-be28-140120adf9fe-2025-07-17T160000.000Z
    evidence:
    - reference: CGGV:assertion_a49ea507-7acb-4bed-be28-140120adf9fe-2025-07-17T160000.000Z
      reference_title: TRAC / TCR-alpha-beta-positive T-cell deficiency (Moderate)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "TRAC | HGNC:12029 | TCR-alpha-beta-positive T-cell deficiency | MONDO:0014160 | AR | Moderate | SOP11 | SCID-CID Gene Curation Expert Panel"
      explanation: ClinGen's SCID-CID expert panel rates TRAC and this MONDO disease Moderate.
  notes: >-
    TRAC encodes the constant region of the T cell receptor alpha chain, which is required for the
    TCRαβ heterodimer to reach the cell surface. Four disease alleles are known. Three are premature
    stop codons in the Ig-like or transmembrane domains and are complete loss of function in a
    Jurkat reconstitution assay. The fourth, c.*+1G>A, sits at the last base of exon 3 immediately
    after the stop codon and was long read as loss of function; the 2025 study shows it is
    hypomorphic, which is what separates the two clinical forms.
    relationship_type is CAUSATIVE while ClinGen rates the pair Moderate, so check-gene-validity
    reports this record as overstated. The reading is deliberate. Biallelic TRAC variants are
    sufficient to cause the disease in a mendelian sense, and three alleles were shown to abolish
    surface TCR complex assembly in a reconstitution assay in which wild type restored it. ClinGen's
    Moderate reflects how few patients have been reported rather than doubt about the mechanism, and
    the tier itself is recorded in gene_disease_validity, which is where strength belongs.
  evidence:
  - reference: PMID:21206088
    reference_title: Mutation in the TCRα subunit constant gene (TRAC) leads to a human immunodeficiency disorder characterized by a lack of TCRαβ+ T cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic linkage studies mapped the disorder to chromosomal region 14q11.2, and a homozygous
      guanine-to-adenine substitution was identified at the last base of exon 3 immediately following
      the translational termination codon in the TCRα subunit constant gene (TRAC).
    explanation: Identifies TRAC as the causative gene and names the founding allele.
  variants:
  - name: c.*+1G>A
    description: >-
      Partial form. Substitution of the last base of exon 3. It causes skipping of exon 3 and, in vitro, retains
      partial activity through intron 3 retention, which preserves the canonical coding sequence.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:41103553
      reference_title: Two different forms of inherited human TCRα chain deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Cells transduced with the c.+1G>A construct displayed a partial stabilization of CD3ε and
        TCRβ on the surface
      explanation: Demonstrates residual activity, which is the basis for calling the allele hypomorphic.
  - name: p.Trp65*
    description: Complete form. Frameshift deletion c.195_208del producing a premature stop codon; private to one family.
    clinical_significance: PATHOGENIC
  - name: p.Arg121*
    description: Complete form. Nonsense substitution c.361C>T; present in gnomAD v4.1 at very low frequency.
    clinical_significance: PATHOGENIC
  - name: p.Ser116*
    description: >-
      Complete form. Nonsense variant c.347C>G, reported in a newborn identified by low TREC on SCID screening and
      transplanted before infection.
    clinical_significance: PATHOGENIC
pathophysiology:
- name: Biallelic TRAC Loss-of-Function or Hypomorphic Variant
  biological_scale: MOLECULAR
  description: >-
    A homozygous TRAC variant, either a premature stop codon in the Ig-like or transmembrane domain
    or the hypomorphic splice allele at the last base of exon 3. The splice allele removes exon 3,
    stripping part of the connecting peptide and the whole transmembrane and cytoplasmic region.
    The bound molecular function is the only one GO annotates to TRAC, from an experimental report.
    It is narrower than the receptor's role, because alpha-beta T cells also recognise peptide on MHC
    class I, so read it as the gene's annotated activity rather than as a claim that only class II
    recognition is lost.
  genes:
  - preferred_term: TRAC
    term:
      id: hgnc:12029
      label: TRAC
  molecular_functions:
  - preferred_term: MHC class II receptor activity
    term:
      id: GO:0032395
      label: MHC class II receptor activity
    modifier: LOSS_OF_FUNCTION
  genetic_context:
    description: >-
      Germline homozygous TRAC variant. The three premature stop codons are complete loss of
      function; the recurrent splice allele is hypomorphic, so this node is tagged
      PARTIAL_LOSS_OF_FUNCTION to cover both rather than asserting complete loss for an allele the
      entry itself calls hypomorphic. The per-subtype distinction is carried by has_subtypes and by
      each variant record.
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS
  evidence:
  - reference: PMID:41103553
    reference_title: Two different forms of inherited human TCRα chain deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This abnormal splicing removes part of the connecting domain and the entire transmembrane and
      cytoplasmic domains of TCRα
    explanation: Describes what the hypomorphic splice allele removes from the protein.
  downstream:
  - target: Failure to Assemble a Surface TCR-alpha-beta Complex
    causal_link_type: DIRECT
- name: Failure to Assemble a Surface TCR-alpha-beta Complex
  biological_scale: MOLECULAR
  description: >-
    Without an intact constant region the alpha chain cannot stabilise CD3 and the beta chain at the
    membrane, so no functional TCRαβ reaches the cell surface. Reconstituting TCRα-deficient Jurkat
    cells with each premature-stop allele fails to restore surface CD3ε, TCRβ or TCRαβ, or the CD69
    activation marker.
  cellular_components:
  - preferred_term: T cell receptor complex
    term:
      id: GO:0042101
      label: T cell receptor complex
    modifier: DECREASED
  evidence:
  - reference: PMID:41103553
    reference_title: Two different forms of inherited human TCRα chain deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transduction with the WT TRAC restored the expression of a functional TCRαβ complex on the cell
      surface, whereas the p.Trp65*, p.Ser116*, and p.Arg121* variants failed to restore the surface
      expression of CD3ε, TCRβ, TCRαβ, or the CD69 activation marker
    explanation: >-
      Directly demonstrates the assembly failure for each complete-loss allele, with wild type as the
      positive control.
  - reference: PMID:21206088
    reference_title: Mutation in the TCRα subunit constant gene (TRAC) leads to a human immunodeficiency disorder characterized by a lack of TCRαβ+ T cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that T cells from affected individuals were profoundly impaired for surface expression
      of the TCRαβ complex.
    explanation: Confirms the same defect in patient T cells for the hypomorphic allele.
  downstream:
  - target: Arrest of Alpha-Beta Thymocyte Selection
    causal_link_type: DIRECT
- name: Arrest of Alpha-Beta Thymocyte Selection
  biological_scale: CELLULAR
  description: >-
    Thymocytes require a surface TCRαβ to be positively selected, so the alpha-beta lineage cannot
    complete development. The gamma-delta lineage, which does not need TRAC, is unaffected and comes
    to dominate the peripheral T cell pool.
  cell_types:
  - preferred_term: alpha-beta T cell
    term:
      id: CL:0000789
      label: alpha-beta T cell
  biological_processes:
  - preferred_term: alpha-beta T cell differentiation
    term:
      id: GO:0046632
      label: alpha-beta T cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:41103553
    reference_title: Two different forms of inherited human TCRα chain deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunophenotyping for these two patients revealed normal natural killer (NK) and B cell levels,
      a predominance of TCR-γδ+ T cells, and a complete absence of TCR-αβ+ T cells
    explanation: >-
      Shows the lineage-specific block: alpha-beta cells absent while NK and B cells and the
      gamma-delta lineage are preserved.
  downstream:
  - target: Loss of Alpha-Beta T Cell Adaptive Immunity
    causal_link_type: DIRECT
  - target: Increased gamma-delta T cell proportion
    causal_link_type: DIRECT
- name: Loss of Alpha-Beta T Cell Adaptive Immunity
  biological_scale: ORGANISM
  description: >-
    Alpha-beta T cells carry conventional MHC-restricted help and cytotoxicity, so their absence
    leaves defective control of bacteria, mycobacteria and herpesviruses, and defective tolerance.
    The 2025 study settles a question the founding report had left open: alpha-beta T cells are not
    redundant, and the apparent protection seen in the first patients came from the residual TCRαβ
    their hypomorphic allele allowed.
  biological_processes:
  - preferred_term: T cell receptor signaling pathway
    term:
      id: GO:0050852
      label: T cell receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:41103553
    reference_title: Two different forms of inherited human TCRα chain deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, we clarify the non-redundant role of αβ T cells in humans.
    explanation: States the conclusion that alpha-beta T cells are not redundant.
  - reference: PMID:41103553
    reference_title: Two different forms of inherited human TCRα chain deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      P1, a girl, presented recurrent cytomegalovirus (CMV) disease and disseminated Bacillus
      Calmette–Guérin (BCG) infection (BCG-osis) after vaccination, with an onset of disease at the
      age of 20 days.
    explanation: >-
      The infection burden itself, in a patient with no residual TCR-alpha-beta: herpesvirus disease
      and disseminated infection with an attenuated mycobacterial vaccine strain from the first
      weeks of life.
  downstream:
  - target: Recurrent respiratory infections
    causal_link_type: DIRECT
  - target: Recurrent viral infections
    causal_link_type: DIRECT
  - target: Combined immunodeficiency
    causal_link_type: DIRECT
  - target: Immune Dysregulation and Loss of Tolerance
    causal_link_type: DIRECT
- name: Immune Dysregulation and Loss of Tolerance
  biological_scale: ORGANISM
  description: >-
    Alpha-beta T cells are also the lineage that enforces peripheral tolerance, so their loss brings
    autoimmunity, atopy with raised IgE and eosinophilia, and uncontrolled lymphoproliferation. In
    the Indian kindred this extended to EBV-driven B cell lymphoma in infancy.
  evidence:
  - reference: PMID:21206088
    reference_title: Mutation in the TCRα subunit constant gene (TRAC) leads to a human immunodeficiency disorder characterized by a lack of TCRαβ+ T cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the absence of TCRαβ+ T cells in the affected individuals was associated with immune
      dysregulation and autoimmunity, they had a surprising level of protection against infection.
    explanation: Links the absence of alpha-beta T cells to immune dysregulation and autoimmunity.
  downstream:
  - target: Autoimmune hemolytic anemia
    causal_link_type: DIRECT
  - target: Lymphadenopathy
    causal_link_type: DIRECT
  - target: Non-Hodgkin lymphoma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Increased circulating IgE concentration
    causal_link_type: DIRECT
  - target: Increased total eosinophil count
    causal_link_type: DIRECT

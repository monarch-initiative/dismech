progression:
- phase: Fulminant invasive phase
  notes: >-
    After exposure the infection progresses rapidly, with invasive disease
    advancing to multiple organ dysfunction syndrome.
  evidence:
  - reference: PMID:31325061
    reference_title: >-
      Epidemiology, pathogenetic mechanism, clinical characteristics, and
      treatment of Vibrio vulnificus infection: a case report and literature
      review.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      rapid symptom progression and signs of multiple organ dysfunction
      syndrome (MODS)
    explanation: >-
      Supports the fulminant, rapidly progressive tempo to multiorgan
      dysfunction that defines this phase.
- phase: Critical treatment window
  notes: >-
    Outcome hinges on how quickly antibiotics and surgical source control are
    started; treatment delayed beyond three days post-injury or symptom onset is
    an independent predictor of death.
  evidence:
  - reference: PMID:24419406
    reference_title: >-
      Prognostic factor of mortality and its clinical implications in patients
      with necrotizing fasciitis caused by Vibrio vulnificus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      treatment delayed beyond 3 days is an independent factor indicating a poor
      prognosis
    explanation: >-
      Establishes the three-day treatment window as the dominant modifiable
      determinant of mortality.


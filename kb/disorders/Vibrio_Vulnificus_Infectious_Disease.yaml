- name: Decreased total leukocyte count
  phenotype_term:
    preferred_term: Decreased total leukocyte count
    term:
      id: HP:0001882
      label: Decreased total leukocyte count
  description: >-
    Leukopenia (leukocytes below 10,000 cells/mm3) at presentation was
    associated with higher mortality in a V. vulnificus necrotizing-fasciitis
    series.
  evidence:
  - reference: PMID:24419406
    reference_title: >-
      Prognostic factor of mortality and its clinical implications in patients
      with necrotizing fasciitis caused by Vibrio vulnificus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      leukocytes < 10,000 cells/mm(3), platelets < 100,000/mm(3), serum

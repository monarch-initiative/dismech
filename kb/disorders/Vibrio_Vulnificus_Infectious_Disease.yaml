diagnosis:
- name: Culture and V. vulnificus PCR
  description: >-
    Diagnosis is made by culturing V. vulnificus from blood, wound or bulla
    aspirate, or stool, with hemolysin/cytolysin gene PCR available for rapid
    direct detection from clinical specimens.
  evidence:
  - reference: PMID:9738039
    reference_title: Direct identification of Vibrio vulnificus in clinical specimens by nested PCR.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Seventeen (94.4%) of the 18 V. vulnificus culture-positive specimens were
      positive by the nested PCR. Eight (42.1%) of the 19 culture-negative
      samples gave positive nested PCR results.
    explanation: >-
      Supports direct nested PCR of serum and bulla aspirates as a molecular
      diagnostic adjunct in septicemic V. vulnificus specimens.

treatments:
- name: Early combination antibiotic therapy
  description: >-
    Severe suspected V. vulnificus infection is treated urgently with active
    combination antibiotics, classically a third-generation cephalosporin plus a
    tetracycline.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: ceftriaxone
      term:
        id: CHEBI:29007
        label: ceftriaxone
    - preferred_term: ceftazidime
      term:
        id: CHEBI:3508
        label: ceftazidime
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
    - preferred_term: minocycline
      term:
        id: CHEBI:50694
        label: minocycline
  target_mechanisms:
  - target: Vulnibactin-Mediated Iron Acquisition
    treatment_effect: INHIBITS
    description: >-
      Effective antibiotic therapy lowers the viable bacterial burden before
      iron-supported replication can drive fulminant sepsis.
  - target: Cytokine-Driven Septic Shock
    treatment_effect: INHIBITS
    description: >-
      Bacterial killing limits the inflammatory stimulus for septic shock.
  evidence:
  - reference: PMID:9333050
    reference_title: In vitro synergism between cefotaxime and minocycline against Vibrio vulnificus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      We conclude that cefotaxime and minocycline acted synergistically in
      inhibiting V. vulnificus in vitro.
    explanation: >-
      Supports a cephalosporin-tetracycline combination as directly active
      against V. vulnificus.
  - reference: PMID:24419406
    reference_title: >-
      Prognostic factor of mortality and its clinical implications in patients
      with necrotizing fasciitis caused by Vibrio vulnificus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A multidisciplinary treatment protocol for necrotizing fasciitis caused by
      V. vulnificus was developed in our institute, namely, ceftriaxone or
      ceftazidime combined with doxycycline or minocycline followed by an
      emergency fasciotomy and intensive care unit admission.
    explanation: >-
      Documents paired antibiotic and surgical ICU management in a 100-patient
      V. vulnificus necrotizing fasciitis series.
- name: Emergency surgical debridement or fasciotomy
  description: >-
    Necrotizing wound infection requires immediate surgical source control with
    fasciotomy, repeated debridement, and amputation when needed.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: VvpE Metalloprotease Tissue Destruction
    treatment_effect: INHIBITS
    description: >-
      Surgical source control removes necrotic and infected soft tissue to limit
      protease-driven local progression and systemic spread.
  evidence:
  - reference: PMID:24419406
    reference_title: >-
      Prognostic factor of mortality and its clinical implications in patients
      with necrotizing fasciitis caused by Vibrio vulnificus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      treatment delayed beyond 3 days is an independent factor indicating a poor
      prognosis
    explanation: >-
      Supports prompt treatment and source control rather than delayed
      intervention in V. vulnificus necrotizing fasciitis.
- name: Supportive and critical care
  description: >-
    Invasive disease and septic shock require fluid resuscitation, vasopressor
    support, and organ support in intensive care alongside antibiotics and
    wound management.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Cytokine-Driven Septic Shock
    treatment_effect: MODULATES
    description: >-
      Hemodynamic and organ support counteract the systemic consequences of the
      septic-shock cascade without acting on the bacterium directly.
  evidence:
  - reference: PMID:17853628
    reference_title: "Vibrio vulnificus infection: diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment of V vulnificus infection includes antibiotics, aggressive wound
      therapy, and supportive care.
    explanation: >-
      Names supportive care as the third arm of V. vulnificus management

clinical_burden:
  burden_level: HIGH
  rationale: >-
    V. vulnificus carries exceptionally high case-fatality, with primary
    septicemia lethal in more than half of patients and necrotizing wound
    disease requiring emergency surgery and intensive care.
  evidence:
  - reference: PMID:17853628
    reference_title: "Vibrio vulnificus infection: diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Case-fatality rates are greater than 50 percent for primary septicemia and
      about 15 percent for wound infections.
    explanation: >-
      Quantifies the high case-fatality that drives the overall clinical burden.
  - reference: PMID:24419406
    reference_title: >-
      Prognostic factor of mortality and its clinical implications in patients
      with necrotizing fasciitis caused by Vibrio vulnificus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Eighteen patients died (18 % mortality)
    explanation: >-
      Reports 18% mortality in a 100-patient necrotizing-fasciitis series.

animal_models:
- name: vuuA deletion infant-mouse model
  species: Mouse
  genotype: V. vulnificus vuuA internal deletion mutant
  publication: PMID:10639413
  description: >-
    Infant-mouse infection with a ferric-vulnibactin receptor (vuuA) deletion
    mutant tests the requirement of siderophore-mediated iron acquisition for
    growth and virulence.
  modeled_mechanisms:
  - target: Vulnibactin-Mediated Iron Acquisition
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Deleting the VuuA receptor removes transferrin/vulnibactin iron use, the
      step the node asserts drives bacterial expansion.
    limitations: >-
      Infant-mouse models require artificial iron loading to reproduce the human
      susceptibility seen in cirrhosis and hemochromatosis, so they test the
      pathway rather than the human host state.
    evidence:
    - reference: PMID:10639413
      reference_title: >-
        Cloning and characterization of vuuA, a gene encoding the Vibrio
        vulnificus ferric vulnibactin receptor.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        An internal deletion of the V. vulnificus vuuA gene resulted in the loss
        of expression of the 72-kDa protein and the loss of the ability to use
        transferrin or vulnibactin as a source of iron.
      explanation: >-
        Shows the VuuA receptor is required for the iron acquisition this node
        models.
- name: MARTX effector-domain deletion intragastric mouse model
  species: Mouse
  genotype: V. vulnificus MARTX effector-domain deletion mutant
  publication: PMID:28060924
  description: >-
    Intragastric mouse infection with a MARTX effector-domain deletion mutant
    tests the toxin's role in intestinal barrier breach and systemic spread.
  modeled_mechanisms:
  - target: MARTX-Mediated Intestinal Barrier Breach
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The effector-domain deletion abolishes dissemination from the intestine,
      recapitulating the barrier-breach step by loss of function.
    limitations: >-
      A murine intragastric model may not reproduce the human predisposing
      iron-overload context that governs clinical foodborne disease.
    evidence:
    - reference: PMID:28060924
      reference_title: >-
        The Effector Domain Region of the Vibrio vulnificus MARTX Toxin Confers
        Biphasic Epithelial Barrier Disruption and Is Essential for Systemic
        Spread from the Intestine.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        The MARTX effector domain region is essential for bacterial
        dissemination from the intestine, but dissemination occurs in the
        absence of overt intestinal tissue pathology.
      explanation: >-
        Supports the MARTX-dependent escape from the intestine this node models.

discussions:
- discussion_id: murine_cytokine_translational_validity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Cytokine-Driven Septic Shock
  prompt: >-
    Does the murine TNF-alpha/IL-1beta/IL-6 cytokine response that correlates
    with fatality reflect the human septic-shock cascade of V. vulnificus
    infection?
  rationale: >-
    The quantitative link between bacterial burden, proinflammatory cytokines,
    and fatality rests on a mouse model; whether the same dose-response holds in
    human invasive disease is not established, and murine innate-immune signaling
    differs from human.
- discussion_id: iron_loading_model_dependence
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Vulnibactin-Mediated Iron Acquisition
  prompt: >-
    Do mouse iron-acquisition models, which require artificial iron loading to
    reproduce susceptibility, capture the human cirrhosis/hemochromatosis host
    state that permits explosive growth?
  rationale: >-
    Iron-acquisition virulence is demonstrated in infant mice given exogenous
    iron, a manipulation that stands in for the chronic iron-overloaded human
    host; the translational fidelity of that substitution is the open question.

review_notes: >-
  The deep-research report gave specific NCIT identifiers for ceftriaxone,
  ceftazidime, doxycycline, minocycline, and debridement that resolve to
  unrelated concepts, so those bad bindings are not used: antibiotics use the
  generic Antibiotic Therapy term with CHEBI-bound therapeutic agents, and
  surgical debridement uses the generic Surgical Procedure term. The report's
  HP:0200041 bulla suggestion resolves to Skin erosion, so hemorrhagic bullae
  are bound to the HPO blistering parent HP:0008066 (no specific
  hemorrhagic-bulla descendant exists) alongside Cellulitis and Ecchymosis.

  Deliberately lumped. The septicemic, wound, and gastrointestinal
  presentations are kept in one entry as presentations of a single
  organism-driven process rather than split into has_subtypes rows: they share
  the same pathogen, the same iron-dependent growth, capsule, and secreted-toxin
  arsenal, and differ chiefly in inoculation route, which the pathograph already
  models through its ingestion and wound branches.

name: Vibrio Vulnificus Infectious Disease
creation_date: "2026-09-30T07:37:07Z"
description: >-
  Vibrio vulnificus infectious disease is an acute marine Gram-negative
  bacterial infection acquired from raw or undercooked shellfish or from
  seawater exposure of an open wound. It can cause primary septicemia,
  necrotizing wound infection, and gastroenteritis, with cirrhosis, iron
  overload, and other immunocompromising conditions predisposing to fulminant
  bacteremia and septic shock.
category: Infectious Disease
disease_term:
  preferred_term: vibrio vulnificus infectious disease
  term:
    id: MONDO:0043297
    label: vibrio vulnificus infectious disease
parents:
- Vibrio Infectious Disease
synonyms:
- Vibrio vulnificus infection
- Vibrio vulnificus disease or disorder
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:21367733
      reference_title: "Vibrio vulnificus oysters: pearls and perils."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Infection with this organism, which is often associated with eating raw
        oysters, is the leading cause of seafood-related deaths in the United
        States.
      explanation: >-
        Frames V. vulnificus as a lethal foodborne bacterial pathogen acquired
        from oysters.
infectious_agent:
- name: Vibrio vulnificus
  description: >-
    V. vulnificus is the halophilic marine bacterial species that defines
    Vibrio vulnificus infectious disease in MONDO.
  infectious_agent_term:
    preferred_term: Vibrio vulnificus
    term:
      id: NCBITaxon:672
      label: Vibrio vulnificus
  evidence:
  - reference: PMID:31325061
    reference_title: >-
      Epidemiology, pathogenetic mechanism, clinical characteristics, and
      treatment of Vibrio vulnificus infection: a case report and literature
      review.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Vibrio vulnificus is a Gram-negative bacterium that belongs to the
      Vibrionaceae family.
    explanation: >-
      Identifies V. vulnificus as the Gram-negative Vibrionaceae agent of the
      infection.

transmission:
- name: Raw shellfish ingestion and seawater wound inoculation
  description: >-
    Human infection is acquired either by eating contaminated raw or
    undercooked shellfish, especially oysters, or by exposing an open wound to
    warm marine or brackish water that contains V. vulnificus.
  evidence:
  - reference: PMID:17853628
    reference_title: "Vibrio vulnificus infection: diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The first is an overwhelming primary septicemia caused by consuming raw or
      undercooked seafood, particularly raw oysters. The second is a necrotizing
      wound infection acquired when an open wound is exposed to warm seawater
      with high concentrations of V. vulnificus.
    explanation: >-
      Summarizes the two major routes into primary septicemia and necrotizing
      wound infection.

environmental:
- name: Warm coastal water and oyster exposure
  description: >-
    V. vulnificus persists in warm coastal and estuarine water and concentrates
    in filter-feeding oysters, creating foodborne and wound exposure hazards.
  influences_mechanisms:
  - target: Marine Exposure or Raw-Oyster Ingestion
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Oysters and warm seawater carry the organism to the gut or directly into
      wounded skin.
  evidence:
  - reference: PMID:7488992
    reference_title: Lower extremity manifestations of Vibrio vulnificus infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      V. vulnificus is found as part of the normal flora of the Gulf of Mexico,
      Atlantic, and Pacific coastal waters and is often isolated from the filter
      feeding shellfish of these regions.
    explanation: >-
      Links the marine reservoir and filter-feeding shellfish to the exposure
      sources for human infection.
- name: Chronic liver disease and iron overload
  description: >-
    Cirrhosis, hereditary hemochromatosis, and other iron-overloaded or
    immunocompromised states lower the host barrier to bloodstream growth by
    increasing iron availability.
  influences_mechanisms:
  - target: Vulnibactin-Mediated Iron Acquisition
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Transferrin saturation and excess iron provide an exploitable substrate
      for bacterial siderophore-mediated iron uptake.
  evidence:
  - reference: PMID:1872665
    reference_title: "Hemochromatosis, iron and septicemia caused by Vibrio vulnificus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Vibrio vulnificus is killed by normal human blood but grows rapidly in
      blood from patients with hemochromatosis.
    explanation: >-
      Directly demonstrates iron-overload blood as a permissive ex vivo human
      environment for V. vulnificus growth.
  - reference: PMID:20546636
    reference_title: "Vibrio illness in Florida, 1998-2007."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Almost half of individuals reported an underlying health condition. Risk
      of death was associated with any underlying condition and increased with
      the number of conditions
    explanation: >-
      Shows in a 1998-2007 Florida Vibrio surveillance series that underlying
      illness increased mortality risk.

pathophysiology:
- name: Marine Exposure or Raw-Oyster Ingestion
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Eating contaminated oysters introduces V. vulnificus to the intestine,
    whereas direct marine-water contact inoculates wounded skin and subcutaneous
    tissue.
  locations:
  - preferred_term: intestine
    term:
      id: UBERON:0000160
      label: intestine
  - preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  downstream:
  - target: Vulnibactin-Mediated Iron Acquisition
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Deposited bacteria must secure host iron to expand from the inoculation
      site.
  evidence:
  - reference: PMID:31325061
    reference_title: >-
      Epidemiology, pathogenetic mechanism, clinical characteristics, and
      treatment of Vibrio vulnificus infection: a case report and literature
      review.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Vibrio vulnificus infection mainly manifests clinical subtypes such as
      primary sepsis, traumatic infection, and gastroenteritis, with rapid
      symptom progression and signs of multiple organ dysfunction syndrome
      (MODS).
    explanation: >-
      Identifies septicemic, traumatic wound, and gastrointestinal clinical
      routes as the main syndromes.
- name: Vulnibactin-Mediated Iron Acquisition
  biological_scale: MOLECULAR
  description: >-
    V. vulnificus uses the VuuA ferric-vulnibactin receptor and the
    vulnibactin siderophore program to capture transferrin-bound iron, allowing
    rapid growth in iron-permissive cirrhotic or hemochromatotic host fluids.
  downstream:
  - target: Capsular Serum Resistance
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Expanded bacterial populations must withstand complement and serum
      killing to disseminate through blood.
  evidence:
  - reference: PMID:10639413
    reference_title: >-
      Cloning and characterization of vuuA, a gene encoding the Vibrio
      vulnificus ferric vulnibactin receptor.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      An internal deletion of the V. vulnificus vuuA gene resulted in the loss
      of expression of the 72-kDa protein and the loss of the ability to use
      transferrin or vulnibactin as a source of iron.
    explanation: >-
      Shows that the VuuA receptor is required for the transferrin and
      vulnibactin iron use central to pathogen growth.
- name: Capsular Serum Resistance
  biological_scale: CELLULAR
  description: >-
    Encapsulated opaque V. vulnificus cells produce capsular polysaccharide that
    protects the bacterium from normal human serum, enabling survival during
    bloodstream spread.
  locations:
  - preferred_term: blood
    term:
      id: UBERON:0000178
      label: blood
  downstream:
  - target: MARTX-Mediated Intestinal Barrier Breach
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      In foodborne disease, serum-resistant organisms that expand in the gut can
      breach the epithelial barrier.
  - target: Cytolysin and Metalloprotease Soft-Tissue Injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      In wound disease, serum-resistant organisms that expand in skin and
      fascia deliver additional cytolytic and proteolytic virulence factors.
  evidence:
  - reference: PMID:27859050
    reference_title: >-
      Capsular polysaccharide production and serum survival of Vibrio vulnificus
      are dependent on antitermination control by RfaH.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      the rfaH mutant produced negligible CPS and was highly sensitive to
      killing by normal human serum, results which indicate that RfaH is likely
      essential for virulence in this bacterium.
    explanation: >-
      Connects capsule production to V. vulnificus serum resistance in normal
      human serum.
- name: MARTX-Mediated Intestinal Barrier Breach
  biological_scale: CELLULAR
  description: >-
    During intragastric infection, the RtxA1 MARTX toxin forms membrane pores
    and translocates effector domains into intestinal epithelial cells,
    disrupting epithelial barrier function before overt cell lysis and enabling
    dissemination from the gut.
  cell_types:
  - preferred_term: epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  downstream:
  - target: Cytokine-Driven Septic Shock
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Barrier failure allows enteric bacteria to disseminate systemically and
      trigger innate inflammatory sepsis.
  evidence:
  - reference: PMID:28060924
    reference_title: >-
      The Effector Domain Region of the Vibrio vulnificus MARTX Toxin Confers
      Biphasic Epithelial Barrier Disruption and Is Essential for Systemic
      Spread from the Intestine.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      The MARTX effector domain region is essential for bacterial dissemination
      from the intestine, but dissemination occurs in the absence of overt
      intestinal tissue pathology.
    explanation: >-
      Supports MARTX-dependent escape from the intestinal route in a mouse
      intragastric infection model.
- name: Cytolysin and Metalloprotease Soft-Tissue Injury
  biological_scale: TISSUE
  description: >-
    VvhA cytolysin, MARTX toxin, VvpE metalloprotease, siderophore activity,
    capsule, pili, and motility factors together equip wound-inoculated strains
    for epithelial and endothelial injury that presents as cellulitis,
    hemorrhagic lesions, and necrotizing fasciitis.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  downstream:
  - target: Cytokine-Driven Septic Shock
    causal_link_type: DIRECT
    description: >-
      Soft-tissue invasion can enter blood and seed fatal systemic
      inflammation.
  evidence:
  - reference: PMID:23351134
    reference_title: Presence of virulence markers in environmental Vibrio vulnificus strains.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      cytolysin (haemolysin), RTX toxin, metalloprotease, siderophores, capsular
      polysaccharide, adhesion structures (like type IV pili), and polar and
      lateral flagella, involved in swimming and swarming
    explanation: >-
      Documents the toxin, protease, siderophore, capsule, adhesion, and
      motility virulence-factor classes carried by environmental V. vulnificus
      strains.
- name: Cytokine-Driven Septic Shock
  biological_scale: ORGANISM
  description: >-
    Disseminated invasive infection elicits high TNF-alpha, interleukin-1 beta,
    and IL-6 responses that track with fatality in experimental infection and
    clinically appear as sepsis, hypotension, disseminated intravascular
    coagulation, and multiorgan dysfunction.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:17446960
    reference_title: >-
      Synergistic antimicrobial effect of cefotaxime and minocycline on
      proinflammatory cytokine levels in a murine model of Vibrio vulnificus
      infection.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Serum levels of tumor necrosis factor-alpha, interleukin (IL)-1 beta, and
      IL-6 post-infection were found to be inoculum dose-dependent and
      positively correlated to the subsequent fatality rate in the infected
      mice.
    explanation: >-
      Links bacterial burden to inflammatory cytokines and fatality in invasive
      V. vulnificus infection.

phenotypes:
- name: Sepsis
  phenotype_term:
    preferred_term: Sepsis
    term:
      id: HP:0100806
      label: Sepsis
  description: >-
    Primary septicemia can follow ingestion, and wound disease can secondarily
    disseminate to sepsis or septic shock.
  evidence:
  - reference: PMID:17853628
    reference_title: "Vibrio vulnificus infection: diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Most patients, including those with primary infection, develop sepsis and
      severe cellulitis with rapid development to ecchymoses and bullae.
    explanation: >-
      Lists sepsis among the common manifestations of primary V. vulnificus
      infection.
- name: Cellulitis
  phenotype_term:
    preferred_term: Cellulitis
    term:
      id: HP:0100658
      label: Cellulitis
  description: >-
    V. vulnificus wound infection causes severe, rapidly progressive cellulitis.
  evidence:
  - reference: PMID:17853628
    reference_title: "Vibrio vulnificus infection: diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Most patients, including those with primary infection, develop sepsis and
      severe cellulitis with rapid development to ecchymoses and bullae.
    explanation: >-
      Directly documents severe cellulitis in V. vulnificus infection.
- name: Necrotizing fasciitis
  phenotype_term:
    preferred_term: Fasciitis
    term:
      id: HP:0100537
      label: Fasciitis
  description: >-
    Necrotizing fasciitis is a severe V. vulnificus wound syndrome requiring
    early surgical source control; HPO has no specific necrotizing-fasciitis
    descendant, so Fasciitis is bound.
  evidence:
  - reference: PMID:24419406
    reference_title: >-
      Prognostic factor of mortality and its clinical implications in patients
      with necrotizing fasciitis caused by Vibrio vulnificus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Early diagnosis and prompt treatment within 3 days post-injury or symptom
      onset should be the goal for treating patients with necrotizing fasciitis
      caused by V. vulnificus.
    explanation: >-
      Supports necrotizing fasciitis as a named V. vulnificus wound
      manifestation.
- name: Ecchymosis
  phenotype_term:
    preferred_term: Ecchymosis
    term:
      id: HP:0031364
      label: Ecchymosis
  description: >-
    Hemorrhagic skin injury can accompany rapidly progressive cellulitis and
    bullous wound infection.
  evidence:
  - reference: PMID:7488992
    reference_title: Lower extremity manifestations of Vibrio vulnificus infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Both syndromes demonstrate characteristic skin lesions of the trunk and
      extremities that present as hemorrhagic bullae and progress to necrotic
      ulcerations.
    explanation: >-
      Documents hemorrhagic skin lesions in both primary septicemic and wound
      forms of V. vulnificus infection.
- name: Hypotension
  phenotype_term:
    preferred_term: Hypotension
    term:
      id: HP:0002615
      label: Hypotension
  description: >-
    Severe invasive disease can progress to septic shock with hypotension.
  evidence:
  - reference: PMID:31325061
    reference_title: >-
      Epidemiology, pathogenetic mechanism, clinical characteristics, and
      treatment of Vibrio vulnificus infection: a case report and literature
      review.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In susceptible individuals, a traumatic infection could be fatal, causing
      severe wound infection and even septic shock, and may require amputation.
    explanation: >-
      Identifies septic shock as a severe outcome of traumatic V. vulnificus
      infection; hypotension is the HPO representation of the shock state.
- name: Fever
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  description: >-
    Fever can accompany fulminant septicemic V. vulnificus infection.

diagnosis:
- name: Culture and V. vulnificus PCR
  description: >-
    Diagnosis is made by culturing V. vulnificus from blood, wound or bulla
    aspirate, or stool, with hemolysin/cytolysin gene PCR available for rapid
    direct detection from clinical specimens.
  evidence:
  - reference: PMID:9738039
    reference_title: Direct identification of Vibrio vulnificus in clinical specimens by nested PCR.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Seventeen (94.4%) of the 18 V. vulnificus culture-positive specimens were
      positive by the nested PCR. Eight (42.1%) of the 19 culture-negative
      samples gave positive nested PCR results.
    explanation: >-
      Supports direct nested PCR of serum and bulla aspirates as a molecular
      diagnostic adjunct in septicemic V. vulnificus specimens.

treatments:
- name: Early combination antibiotic therapy
  description: >-
    Severe suspected V. vulnificus infection is treated urgently with active
    combination antibiotics, classically a third-generation cephalosporin plus a
    tetracycline.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Vulnibactin-Mediated Iron Acquisition
    treatment_effect: INHIBITS
    description: >-
      Effective antibiotic therapy lowers the viable bacterial burden before
      iron-supported replication can drive fulminant sepsis.
  - target: Cytokine-Driven Septic Shock
    treatment_effect: INHIBITS
    description: >-
      Bacterial killing limits the inflammatory stimulus for septic shock.
  evidence:
  - reference: PMID:9333050
    reference_title: In vitro synergism between cefotaxime and minocycline against Vibrio vulnificus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      We conclude that cefotaxime and minocycline acted synergistically in
      inhibiting V. vulnificus in vitro.
    explanation: >-
      Supports a cephalosporin-tetracycline combination as directly active
      against V. vulnificus.
  - reference: PMID:24419406
    reference_title: >-
      Prognostic factor of mortality and its clinical implications in patients
      with necrotizing fasciitis caused by Vibrio vulnificus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A multidisciplinary treatment protocol for necrotizing fasciitis caused by
      V. vulnificus was developed in our institute, namely, ceftriaxone or
      ceftazidime combined with doxycycline or minocycline followed by an
      emergency fasciotomy and intensive care unit admission.
    explanation: >-
      Documents paired antibiotic and surgical ICU management in a 100-patient
      V. vulnificus necrotizing fasciitis series.
- name: Emergency surgical debridement or fasciotomy
  description: >-
    Necrotizing wound infection requires immediate surgical source control with
    fasciotomy, repeated debridement, and amputation when needed.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Cytolysin and Metalloprotease Soft-Tissue Injury
    treatment_effect: INHIBITS
    description: >-
      Surgical source control removes necrotic and infected soft tissue to limit
      toxin-driven local progression and systemic spread.
  evidence:
  - reference: PMID:24419406
    reference_title: >-
      Prognostic factor of mortality and its clinical implications in patients
      with necrotizing fasciitis caused by Vibrio vulnificus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      treatment delayed beyond 3 days is an independent factor indicating a poor
      prognosis
    explanation: >-
      Supports prompt treatment and source control rather than delayed
      intervention in V. vulnificus necrotizing fasciitis.

review_notes: >-
  Duplicate preflight found no Vibrio-named local files under kb/disorders,
  stubs, research, or history/disorders; ignored-inclusive local and origin/main
  searches for MONDO:0043297 and Vibrio vulnificus found only incidental text;
  all-state GitHub PR and issue searches returned no Vibrio vulnificus work.
  Deep research requested falcon but fell back to OpenScientist, producing
  research/Vibrio_Vulnificus_Infectious_Disease-deep-research-openscientist.md
  with 34/34 references resolved and 18/34 references judged on-topic. The
  report passed manual identity review after preflight-dr returned SKIP for this
  non-Mendelian MONDO term. Term validation set needs_review because the report
  gave unrelated NCIT identifiers for ceftriaxone, ceftazidime, doxycycline,
  minocycline, and debridement; this entry omits those bad specific NCIT terms
  and uses generic Antibiotic Therapy and Surgical Procedure bindings instead.
  The report's HP:0200041 bulla suggestion resolved to Skin erosion in the local
  cache, so the bullous wound syndrome is represented with Cellulitis,
  Ecchymosis, and the HPO parent Fasciitis.

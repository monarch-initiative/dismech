- name: Preganglionic Lesion Without Postganglionic Lewy Pathology
  description: >-
    In the minority of patients whose PAF is the premotor phase of MSA, the
    preganglionic autonomic lesion is not accompanied by postganglionic noradrenergic
    Lewy pathology. In MSA, insoluble alpha-synuclein is deposited in glia rather than
    as neuronal Lewy bodies. These patients have higher supine norepinephrine, a
    preganglionic pattern of sweat loss, severe bladder dysfunction and raised CSF
    neurofilament light chain, and they go on to MSA.
  biological_scale: CELLULAR
  notes: >-
    No cell type is bound: the glial alpha-synuclein pathology of MSA is documented in
    established MSA, not in patients who still carry the PAF diagnosis.
  evidence:
  - reference: PMID:24095130
    reference_title: "Pure autonomic failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Insoluble deposits of α-synuclein are found in glia in MSA, whereas they take the form of neuronal cytoplasmic inclusions called Lewy bodies in PAF and PD."
    explanation: Contrasts the glial synucleinopathy of MSA with neuronal Lewy bodies in PAF.
  - reference: PMID:34669076
    reference_title: "Different phenoconversion pathways in pure autonomic failure with versus without Lewy bodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Conversely, PAF without these features leaves open the possibility of premotor MSA."
    explanation: PAF lacking the postganglionic Lewy lesion may be premotor MSA.
  downstream:
  - target: Preganglionic Intermediolateral Column Neuron Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - prodromal_msa_paf
    evidence:
    - reference: PMID:34669076
      reference_title: "Different phenoconversion pathways in pure autonomic failure with versus without Lewy bodies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Both PAF phenotypes involve a sympathetic preganglionic lesion, but only Lewy body PAF, PD, and DLB entail a postganglionic noradrenergic lesion."
      explanation: The non-Lewy form carries the preganglionic lesion without the postganglionic one.
  - target: Spread to Central Nervous System (Phenoconversion)
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - prodromal_msa_paf
    evidence:
    - reference: PMID:33881777
      reference_title: "Alpha-Synuclein Oligomers and Neurofilament Light Chain Predict Phenoconversion of Pure Autonomic Failure."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The PMCA reaction was markedly different in five samples with maximum fluorescence and reaction kinetics previously described in MSA patients; all of these patients later developed MSA."
      explanation: An MSA-type seeding profile at PAF presentation precedes conversion to MSA.
- name: Preganglionic Intermediolateral Column Neuron Loss
  description: >-
    Sympathetic preganglionic neurons in the thoracic intermediolateral cell column are
    lost alongside the ganglionic lesion, removing central drive to the sympathetic
    ganglia. Both pathological forms of PAF are thought to involve this preganglionic
    lesion.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: sympathetic preganglionic neuron
    term:
      id: CL:0000107
      label: autonomic neuron
  notes: >-
    CL has no sympathetic preganglionic neuron class (runoak -i ols:cl info
    "l~preganglionic" returns nothing). CL:0011103 sympathetic neuron is defined as
    primarily adrenergic and so does not fit cholinergic preganglionic neurons; the
    broader autonomic neuron is bound instead.
  evidence:
  - reference: PMID:9255396
    reference_title: "The distribution of Lewy bodies in pure autonomic failure: autopsy findings and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by autonomic failure without other neurological deficits and histopathologically by cell loss in intermediolateral columns and sympathetic ganglia"
    explanation: Neuropathological hallmark of preganglionic and ganglionic cell loss.
  - reference: PMID:27338613
    reference_title: "Pure Autonomic Failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Autonomic failure in PAF is caused by neuronal degeneration of pre- and postganglionic sympathetic and parasympathetic neurons in the thoracic spinal cord and paravertebral autonomic ganglia."
    explanation: Review locating the lesion in pre- and postganglionic autonomic neurons.
  - reference: PMID:34669076
    reference_title: "Different phenoconversion pathways in pure autonomic failure with versus without Lewy bodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Both PAF phenotypes involve a sympathetic preganglionic lesion, but only Lewy body PAF, PD, and DLB entail a postganglionic noradrenergic lesion."
    explanation: The preganglionic lesion is shared by Lewy and non-Lewy forms of PAF.
  downstream:
  - target: Failure of Baroreflex-Mediated Vasoconstriction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Postganglionic Sympathetic Noradrenergic Denervation
  description: >-
    Postganglionic sympathetic noradrenergic terminals are lost from the heart, renal
    cortex, blood vessels and skin. Cardiac 18F-dopamine and 11C-methylreboxetine PET
    show reduced noradrenergic innervation, and skin biopsy shows marked postganglionic
    denervation of autonomic adnexa, in contrast to the largely preserved peripheral
    innervation of MSA. Denervation is accompanied by length-dependent somatic and
    autonomic small-fibre loss.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: sympathetic noradrenergic neuron
    term:
      id: CL:3000002
      label: sympathetic noradrenergic neuron
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:16269589
    reference_title: "Cardiac and extracardiac sympathetic denervation in Parkinson's disease with orthostatic hypotension and in pure autonomic failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both the PD+OH group and the PAF group had decreased 6-(18)F-fluorodopamine-derived radioactivity in the heart (P < 0.0001) and renal cortex (P = 0.02 and P = 0.005, respectively)."
    explanation: PET evidence of cardiac and renal sympathetic denervation in PAF.
  - reference: PMID:32945121
    reference_title: "Cardiac sympathetic innervation and vesicular storage in pure autonomic failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PAF entails moderately decreased cardiac sympathetic innervation and a substantial vesicular storage defect in residual nerves."
    explanation: Combined 11C-MRB and 18F-dopamine PET shows moderate denervation.
  - reference: PMID:20660924
    reference_title: "Autonomic innervation in multiple system atrophy and pure autonomic failure."
    supports: SUPPORT

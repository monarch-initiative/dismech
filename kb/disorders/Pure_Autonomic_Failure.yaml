progression:
- phase: Adult-onset insidious autonomic failure
  age_range: Middle to late adulthood (pooled mean onset about 63 years)
  notes: >-
    Onset is insidious in adulthood or old age. Most non-orthostatic autonomic symptoms
    begin close to the onset of orthostatic hypotension, while dream enactment behaviour
    tends to appear years later.
  evidence:
  - reference: ORPHA:441
    reference_title: "Pure autonomic failure"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Age of onset: Elderly"
    explanation: Orphanet records elderly (and adult) onset.
  - reference: PMID:42081229
    reference_title: "Phenoconversion in Pure Autonomic Failure: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A total of 9 studies comprising 900 individuals with PAF (mean ... age at onset, 63.1 ... years; 63.8% male) were included."
    explanation: Pooled mean age at onset across nine longitudinal cohorts.
  - reference: PMID:40053259
    reference_title: "The phenotype of \"pure\" autonomic failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median time to dream enactment behavior onset from orthostatic hypotension was 7.00 years (1.55-13.50). Other autonomic symptoms tended to occur near orthostatic hypotension."
    explanation: Timeline of symptom onset in patients who retained the PAF phenotype.
- phase: Chronic progressive peripheral autonomic failure
  duration: Years to decades; median survival about 15 years from orthostatic symptom onset
  notes: >-
    Autonomic failure worsens on repeat testing. Survival is longer than in the other
    synucleinopathies and depends mainly on age and orthostatic hypotension severity.
    Many patients retain the pure phenotype until death.
  evidence:
  - reference: PMID:40397689
    reference_title: "Pure autonomic failure: a natural history study of the Queen Square cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median survival of patients with PAF was 15 years from orthostatic symptoms onset and was mostly influenced by age and the severity of orthostatic hypotension."
    explanation: Largest single-centre natural-history cohort (n=281, median 10 years follow-up).
  - reference: PMID:40397689
    reference_title: "Pure autonomic failure: a natural history study of the Queen Square cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "repeat testing indicated worsening of autonomic failure during the disease course"
    explanation: Autonomic failure progresses over time.
  - reference: PMID:40053259
    reference_title: "The phenotype of \"pure\" autonomic failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 202 patients, 133 remained pure autonomic failure with median follow-up time of 9.05 years"
    explanation: A majority of patients keep the PAF phenotype over prolonged follow-up.
  - reference: PMID:27338613
    reference_title: "Pure Autonomic Failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The prognosis for survival of PAF is better than for the other synucleinopathies."
    explanation: Review comparing prognosis across synucleinopathies.
- phase: Phenoconversion to a central synucleinopathy
  duration: About 5 percent per year in pooled data (12 percent per year in one prospective cohort)
  notes: >-
    Roughly a quarter to a third of patients presenting with PAF develop Parkinson
    disease, dementia with Lewy bodies or multiple system atrophy. Conversion to MSA
    clusters in the first years of follow-up, whereas conversion to Lewy body disorders
    occurs at a steadier rate. The annual-risk estimates differ between the
    eight-centre prospective cohort and the meta-analysis.
  evidence:
  - reference: PMID:42081229
    reference_title: "Phenoconversion in Pure Autonomic Failure: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "270 of 900 individuals with PAF (30%) experienced phenoconversion to a central α-synucleinopathy (12% to MSA, 11% to DLB, 7% to PD) with a pooled incidence rate of 5.09 per 100 person-years"
    explanation: Meta-analysis of nine longitudinal studies.
  - reference: PMID:42081229
    reference_title: "Phenoconversion in Pure Autonomic Failure: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Phenoconversion rates for MSA (pooled incidence rate, 1.96; 95% CI, 1.29-2.99) were highest in the first years of follow-up, whereas Lewy body disorders showed more constant phenoconversion rates"
    explanation: Different temporal profiles for MSA versus Lewy body conversion.
  - reference: PMID:38366572
    reference_title: "Phenoconversion in pure autonomic failure: a multicentre prospective longitudinal cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with PAF have an estimated 12% (95% CI: 9-15%) per year annual risk following study entry of phenoconverting to a manifest CNS synucleinopathy."
    explanation: Eight-centre prospective cohort estimate of annual conversion risk.
  - reference: PMID:28093795
    reference_title: "Natural history of pure autonomic failure: A United States prospective cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Within 4 years of follow-up, 25 of 74 subjects (34%) developed dementia with Lewy bodies (n = 13), Parkinson disease (n = 6), or multiple system atrophy (n = 6)."
    explanation: US prospective cohort phenoconversion rate.
  - reference: PMID:32546656
    reference_title: "Predicting phenoconversion in pure autonomic failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 275 patients with PAF at presentation, 67 (24%) phenoconverted to a synucleinopathy with motor or cognitive involvement"
    explanation: Mayo Clinic retrospective cohort conversion rate.
  - reference: PMID:40397689
    reference_title: "Pure autonomic failure: a natural history study of the Queen Square cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of these, 33% (91) converted to a more widespread synucleinopathy, and 41% (115) died during follow-up, of whom 53% (61) retained a PAF phenotype."
    explanation: Queen Square cohort conversion and mortality.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Neurogenic orthostatic hypotension is disabling, causing recurrent syncope, falls
    and inability to stand for long, and is frequently complicated by supine
    hypertension that constrains treatment. About a third of patients go on to a central
    synucleinopathy. Survival is nonetheless longer than in MSA, PD or DLB.
  evidence:
  - reference: PMID:28717053
    reference_title: "Pure autonomic failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients experience symptomatic hypotension that requires them to sit, squat or lie down to prevent syncope."
    explanation: Describes the day-to-day functional burden of orthostatic hypotension.
  - reference: PMID:34176285
    reference_title: "Predictors of the Pressor Response to the Norepinephrine Transporter Inhibitor, Atomoxetine, in Neurogenic Orthostatic Hypotension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "nOH results in cerebral hypoperfusion7 with lightheadedness, dizziness, syncope, and falls8 all being common symptoms, which contribute to morbidity, disability, and death in this population."
    explanation: Links nOH to morbidity, disability and death in synucleinopathies including PAF.
pathophysiology:
- name: Catecholaldehyde (DOPAL) Autotoxicity in Noradrenergic Neurons
  description: >-
    Dopamine that leaks from storage vesicles into the neuronal cytoplasm is deaminated
    by monoamine oxidase to 3,4-dihydroxyphenylacetaldehyde (DOPAL), an obligate
    intermediate of dopamine metabolism normally detoxified by aldehyde dehydrogenase.
    DOPAL binds covalently to the lysine-rich alpha-synuclein molecule and oligomerizes
    it far more efficiently than dopamine itself does, and the resulting oligomers
    impair vesicular storage, returning more dopamine to the cytoplasm. This is the
    catecholaldehyde hypothesis, and it is the step put forward to explain why
    alpha-synuclein precipitates in catecholaminergic neurons rather than elsewhere.
    It is placed upstream of aggregation on in vitro, postmortem and computational
    grounds only: DOPAL has not been measured in sympathetic neurons of living
    patients, and whether it accumulates in PAF specifically is unresolved.
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  cell_types:
  - preferred_term: sympathetic noradrenergic neuron
    term:
      id: CL:3000002
      label: sympathetic noradrenergic neuron
  biological_processes:
  - preferred_term: monoamine oxidase-catalysed deamination of cytoplasmic dopamine
    modifier: INCREASED
    term:
      id: GO:0042420
      label: dopamine catabolic process
  chemical_entities:
  - preferred_term: 3,4-dihydroxyphenylacetaldehyde (DOPAL)
    modifier: INCREASED
    term:
      id: CHEBI:27978
      label: 3,4-dihydroxyphenylacetaldehyde
  evidence:
  - reference: PMID:34206133
    reference_title: "The Catecholaldehyde Hypothesis for the Pathogenesis of Catecholaminergic Neurodegeneration: What We Know and What We Do Not Know."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "The catecholaldehyde is produced via oxidative deamination catalyzed by monoamine oxidase (MAO) acting on cytoplasmic dopamine. DOPAL is autotoxic, in that it can harm the same cells in which it is produced."
    explanation: >-
      States the biochemical route to DOPAL and its autotoxicity. Indirect for PAF: the
      chemistry is established in vitro and in animal tissue, not in patients.
  - reference: PMID:34206133
    reference_title: "The Catecholaldehyde Hypothesis for the Pathogenesis of Catecholaminergic Neurodegeneration: What We Know and What We Do Not Know."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "tends to precipitate in catecholaminergic neurons in Lewy body diseases, because DOPAL potently oligomerizes, quinonizes, and aggregates"
    explanation: >-
      This is the reason the node exists: it offers a mechanism for the cell-type
      selectivity of the aggregation that PAF shares with the other Lewy body diseases.
  - reference: PMID:31744850
    reference_title: "3,4-Dihydroxyphenylacetaldehyde Is More Efficient than Dopamine in Oligomerizing and Quinonizing α-Synuclein."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "DOPAL was far more potent than DA both in oligomerizing and forming quinone-protein adducts with (quinonizing) AS."
    explanation: >-
      Cell-free and cultured-cell comparison establishing that the DOPAL route, not
      spontaneous dopamine oxidation, is the efficient one. No patient tissue involved.
  downstream:
  - target: Peripheral Autonomic Alpha-Synuclein Aggregation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      DOPAL oligomerizes and quinonizes alpha-synuclein, which is proposed as the
      proximate chemical cause of aggregation in catecholaminergic neurons. The steps
      between an oligomer formed in vitro and a Lewy body in a human sympathetic
      ganglion are not established.
    hypothesis_groups:
    - catecholaldehyde_autotoxicity
    evidence:
    - reference: PMID:32372682
      reference_title: "\"Sick-but-not-dead\": multiple paths to catecholamine deficiency in Lewy body diseases."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: "DOPAL potently oligomerizes, aggregates, and forms quinone-protein adducts with (\u201cquinonizes\u201d) AS and many other intra-cellular proteins"
      explanation: >-
        States the proposed chemical step from DOPAL to aggregated alpha-synuclein in a
        review that treats PAF as one of the diseases concerned.
- name: Peripheral Autonomic Alpha-Synuclein Aggregation
  description: >-
    Misfolded, phosphorylated alpha-synuclein accumulates as Lewy bodies and Lewy
    neurites predominantly in peripheral autonomic neurons: sympathetic ganglion
    neurons and their distal axons in the heart, adrenal region, bladder and skin. CSF
    seeding assays are positive in nearly all patients, and cutaneous phosphorylated
    alpha-synuclein is found at every biopsy site. The initiating trigger is unknown.
    A rare clinically diagnosed case without any synuclein pathology shows that the
    clinical label is not always a synucleinopathy.
  biological_scale: MOLECULAR
  conforms_to: "loss_of_proteostasis#Misfolded-Protein Aggregation"
  cell_types:
  - preferred_term: sympathetic noradrenergic neuron
    term:
      id: CL:3000002
      label: sympathetic noradrenergic neuron
  biological_processes:
  - preferred_term: inclusion body assembly
    term:
      id: GO:0070841
      label: inclusion body assembly
  genes:
  - preferred_term: SNCA
    term:
      id: hgnc:11138
      label: SNCA
  locations:
  - preferred_term: sympathetic ganglion
    term:
      id: UBERON:0001806
      label: sympathetic ganglion
  evidence:
  - reference: PMID:34392300
    reference_title: "Pure autonomic failure and the differential diagnosis of autonomic peripheral neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Pure autonomic failure (PAF) is a peripheral autonomic neurodegenerative disease caused by alpha-synuclein deposition that is predominantly confined to peripheral autonomic neurons."
    explanation: Review defining PAF as a peripherally confined alpha-synucleinopathy.
  - reference: PMID:9255396
    reference_title: "The distribution of Lewy bodies in pure autonomic failure: autopsy findings and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Postmortem findings included typical and atypical Lewy bodies in the substantia nigra, locus ceruleus, substantia innominata, and sympathetic ganglia, as well as in autonomic axons in the epicardial fat, autonomic nerve fascicles in periadrenal adipose tissue, and autonomic nerves in the muscularis of the urinary bladder."
    explanation: Autopsy showing Lewy bodies in sympathetic ganglia and distal autonomic axons.
  - reference: PMID:33881777
    reference_title: "Alpha-Synuclein Oligomers and Neurofilament Light Chain Predict Phenoconversion of Pure Autonomic Failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "αSyn-PMCA is almost invariably positive in the CSF of patients with PAF establishing this condition as α-synucleinopathy."
    explanation: CSF seed amplification establishes aggregated alpha-synuclein in vivo.
  - reference: PMID:26606657
    reference_title: "Skin nerve misfolded α-synuclein in pure autonomic failure and Parkinson disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "abnormal α-synuclein deposits were found in all analyzed skin samples in PAF but in only 49% of samples with a higher positivity rate at the proximal site in IPD"
    explanation: Diffuse peripheral nerve alpha-synuclein deposition in PAF.
  - reference: PMID:31178336
    reference_title: "Small fiber neuropathy and phosphorylated alpha-synuclein in the skin of E46K-SNCA mutation carriers."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "All E46K-SNCA carriers had moderate to severe p-synuclein deposits and small fiber neurodegeneration in different epidermal and dermal structures including nerve fascicles and glands, especially in carriers with Pure Autonomic Failure"
    explanation: >-
      Two carriers of the pathogenic SNCA E46K variant presented as PAF and had the
      heaviest cutaneous phosphorylated alpha-synuclein, so altered alpha-synuclein is
      sufficient to produce a PAF phenotype. Sporadic PAF carries no such variant, which
      makes this indirect support for the aggregation node.
  - reference: PMID:14736756
    reference_title: "Association between cardiac denervation and parkinsonism caused by alpha-synuclein gene triplication."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results indicate that both parkinsonism and cardiac sympathetic denervation can result from an excess of normal synuclein."
    explanation: >-
      In the SNCA-triplication (Iowa) kindred, cardiac sympathetic denervation
      cosegregates with the triplication, linking alpha-synuclein excess to the
      noradrenergic lesion PAF shares; the affected members had parkinsonism, not PAF.
  - reference: PMID:28188385
    reference_title: "Pure autonomic failure without synucleinopathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In pure autonomic failure, sympathetic noradrenergic denervation can occur without concurrent Lewy bodies or alpha-synuclein deposition in the brain or sympathetic ganglion tissue."
    explanation: >-
      A single autopsied clinically diagnosed PAF case had sympathetic denervation with
      no alpha-synuclein pathology, so the aggregation node does not hold for every
      patient carrying the clinical label.

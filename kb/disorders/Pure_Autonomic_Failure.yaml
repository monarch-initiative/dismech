discussions:
- discussion_id: paf_what_initiates_aggregation
  prompt: >-
    What starts alpha-synuclein aggregating in peripheral autonomic neurons in PAF, and
    does the catecholaldehyde DOPAL accumulate in those neurons before the aggregates
    appear?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Catecholaldehyde (DOPAL) Autotoxicity in Noradrenergic Neurons
  - pathophysiology#Peripheral Autonomic Alpha-Synuclein Aggregation
  - mechanistic_hypotheses#catecholaldehyde_autotoxicity
  rationale: >-
    The entry's canonical chain begins at aggregation, and the aggregation node says the
    initiating trigger is unknown. The catecholaldehyde node upstream of it rests on
    cell-free chemistry, postmortem tissue from other Lewy body diseases and a
    computational model; nothing has measured DOPAL, aldehyde dehydrogenase activity or
    the DOPAC:DOPAL ratio in sympathetic tissue from patients with PAF. The gap matters
    for more than completeness, because the two interventions the hypothesis implies -
    inhibiting monoamine oxidase to make less DOPAL, and antioxidant treatment to stop
    its oxidation - are both available, and PAF is the one Lewy body disease where the
    affected neurons are accessible by skin and vein biopsy. The author of the
    hypothesis lists the PAF form of the question explicitly as unanswered.
  posed_by: "dismech curation (PR #15556)"
  posed_date: '2026-10-26T00:00:00Z'
  evidence:
  - reference: PMID:34206133
    reference_title: "The Catecholaldehyde Hypothesis for the Pathogenesis of Catecholaminergic Neurodegeneration: What We Know and What We Do Not Know."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Do DOPAL and αS ascend together in the periphery in \u201cbody-first\u201d PD or PAF?"
    explanation: >-
      The review poses this PAF-specific question in its own list of what the field does
      not know, which is the gap recorded here.
  - reference: PMID:34206133
    reference_title: "The Catecholaldehyde Hypothesis for the Pathogenesis of Catecholaminergic Neurodegeneration: What We Know and What We Do Not Know."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The extent to which DOPAL toxicity is mediated by interactions with αS, and vice versa, is poorly understood."
    explanation: States that the direction of causation between the two upstream nodes is unsettled.
  proposed_experiments:
  - experiment_id: paf_dopal_in_accessible_sympathetic_tissue
    name: Catecholaldehyde measurement in biopsied sympathetic tissue from PAF patients
    description: >-
      Quantify DOPAL, DOPAC, the DOPAC:DOPAL ratio and aldehyde dehydrogenase activity
      in forearm vein and skin biopsies from patients with PAF, from patients with the
      non-Lewy preganglionic form, and from controls, in the same samples used to assay
      tyrosine hydroxylase and VMAT2. The vein-biopsy protocol that established the
      vesicular storage defect in PAF already yields the tissue; what has not been
      measured is the aldehyde.
    would_support:
    - pathophysiology#Catecholaldehyde (DOPAL) Autotoxicity in Noradrenergic Neurons
    - mechanistic_hypotheses#catecholaldehyde_autotoxicity
    supporting_outcome:
    - A raised DOPAL level or a lowered DOPAC:DOPAL ratio in PAF sympathetic tissue, tracking the vesicular storage defect in the same samples, would support the autotoxic step acting in this disease rather than only in vitro.
    would_refute:
    - pathophysiology#Catecholaldehyde (DOPAL) Autotoxicity in Noradrenergic Neurons
    - mechanistic_hypotheses#catecholaldehyde_autotoxicity
    refuting_outcome:
    - Normal DOPAL handling in sympathetic tissue carrying heavy alpha-synuclein deposits would refute the catecholaldehyde step in PAF and leave aggregation as the entry point of the chain.
  - experiment_id: paf_dopal_longitudinal_prodrome
    name: Longitudinal catecholaldehyde and vesicular-storage markers across phenoconversion
    description: >-
      Follow a PAF cohort already undergoing serial cardiac 18F-dopamine PET and CSF
      seed amplification, adding catecholaldehyde-pathway markers at each visit, to test
      whether the aldehyde burden moves before or after the storage defect and the
      seeding signal. The computational model of this mechanism predicts a specific
      three-phase order, which makes it falsifiable by serial measurement.
    would_support:
    - mechanistic_hypotheses#catecholaldehyde_autotoxicity
    supporting_outcome:
    - Aldehyde-pathway change preceding measurable loss of vesicular sequestration, in the order the model predicts, would support the loop running in the direction the hypothesis claims.
    would_refute:
    - mechanistic_hypotheses#catecholaldehyde_autotoxicity
    refuting_outcome:
    - Aldehyde change appearing only after denervation is established would make it a consequence of the lesion rather than its cause.
  - experiment_id: paf_dopal_loop_in_ipsc_sympathetic_neurons
    name: Reconstruction of the catecholaldehyde loop in human iPSC-derived sympathetic
      neurons
    description: >-
      Impose the aldehyde burden on the cell type this entry is about. Human pluripotent
      stem cells are differentiated to postganglionic sympathetic neurons, aldehyde
      dehydrogenase is inhibited to raise DOPAL without adding it from outside, and
      alpha-synuclein oligomer load, vesicular norepinephrine storage and stimulated
      norepinephrine release are measured in the same cultures. The existing cell models
      of the catecholaldehyde step use a neuroblastoma line, mouse cortical neurons or a
      glial line, and supply DOPAL in the medium, so neither the affected cell type nor
      the endogenous route to the aldehyde has been tested; these neurons secrete
      norepinephrine on activation, which is the quantity PAF loses. A patient-derived
      line is deliberately not the design here. PAF is sporadic with no causal gene, so an
      unselected patient line carries no lesion to express, which is why the protocol's
      established use is a Mendelian autonomic disease rather than this one.
    model_systems:
    - name: Human iPSC-derived postganglionic sympathetic neurons
      description: >-
        Sympathetic neurons differentiated from human pluripotent stem cells by way of
        neural crest, maintained as monocultures or co-cultured with iPSC-derived
        cardiomyocytes. They carry tyrosine hydroxylase, fire action potentials, secrete
        norepinephrine on stimulation, and in co-culture drive the beating rate of the
        myocytes they innervate, so the noradrenergic functions this entry's nodes describe
        are all directly measurable.
      experimental_model_type: IPSC_DERIVED_MODEL
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      cell_types:
      - preferred_term: iPSC-derived postganglionic sympathetic neuron
        term:
          id: CL:3000002
          label: sympathetic noradrenergic neuron
      culture_system: >-
        Feeder-free monolayer differentiation through neural crest, with an optional
        neurocardiac co-culture arm against iPSC-derived cardiomyocytes
      publication: PMID:32822546
      evidence:
      - reference: PMID:32822546
        reference_title: Functional coculture of sympathetic neurons and cardiomyocytes
          derived from human-induced pluripotent stem cells.
        supports: SUPPORT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: secreted norepinephrine upon activation, and generated synaptic and action
          currents
        explanation: >-
          Establishes that the platform reports stimulated norepinephrine release, the
          function whose failure defines this disease.
      - reference: PMID:30702809
        reference_title: Autonomic Neurons with Sympathetic Character Derived From Human
          Pluripotent Stem Cells.
        supports: SUPPORT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: the character of postganglionic sympathetic neurons from human pluripotent
          stem cells
        explanation: The differentiation protocol, which targets the postganglionic neuron
          that bears the lesion in PAF.
      - reference: PMID:30702809
        reference_title: Autonomic Neurons with Sympathetic Character Derived From Human
          Pluripotent Stem Cells.
        supports: SUPPORT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: This protocol has been used to generate autonomic neurons from healthy
          embryonic stem cells as well as from patient-derived induced pluripotent stem
          cells
        explanation: >-
          Records that the platform has carried patient lines before, which is what makes
          the design feasible rather than speculative.
      modeled_mechanisms:
      - target: Catecholaldehyde (DOPAL) Autotoxicity in Noradrenergic Neurons
        relationship: MEASURES
        fidelity: MODERATE
        model_scale: CELLULAR
        description: >-
          Supplies the cell type the node names, so the aldehyde burden, the oligomer load
          and the storage defect can be measured in one system and in the right neuron
          rather than inferred across three unrelated ones.
        limitations: >-
          These neurons are weeks old and were never exposed to whatever initiates the
          disease, so a loop demonstrated in them shows the mechanism can run in a human
          sympathetic neuron, not that it is what runs in a patient.
        divergences:
        - divergence_type: CAUSE_UNREPRESENTED
          materiality: QUALIFYING
          description: >-
            PAF has no causal lesion to encode, so the aldehyde burden has to be imposed
            pharmacologically by inhibiting aldehyde dehydrogenase. The model therefore
            tests whether the loop can run, and cannot establish that it starts this way in
            the disease.
        - divergence_type: TEMPORAL_SCOPE
          materiality: QUALIFYING
          description: >-
            A culture runs for weeks against a disease that takes decades and whose own
            progression node is measured in years of serial imaging, so an acute aldehyde
            challenge stands in for chronic accumulation.
        - divergence_type: BOUNDARY_OMISSION
          materiality: IMMATERIAL
          description: >-
            Preganglionic input, the baroreflex arc and the vasculature are outside the
            model. Immaterial to this experiment, whose claims are confined to events
            inside the postganglionic neuron.
    readouts:
    - name: Intraneuronal DOPAL and DOPAC to DOPAL ratio after aldehyde dehydrogenase inhibition
      target: pathophysiology#Catecholaldehyde (DOPAL) Autotoxicity in Noradrenergic Neurons
      direction: INCREASED
      interpretation: >-
        Confirms the intended perturbation was achieved from the cell's own dopamine rather
        than supplied from outside, which is what the existing cell models cannot show.
    - name: Alpha-synuclein oligomer load in sympathetic neurons
      target: pathophysiology#Peripheral Autonomic Alpha-Synuclein Aggregation
      direction: INCREASED
      interpretation: >-
        Tests whether an endogenously generated aldehyde burden is sufficient to aggregate
        alpha-synuclein in the cell type that aggregates it in patients.
    - name: Vesicular norepinephrine content and stimulated release
      target: pathophysiology#Noradrenergic Vesicular Storage and Synthesis Defect
      direction: DECREASED
      interpretation: >-
        The return arm of the loop, measured as the function PAF loses rather than as
        dopamine leak from a vesicle preparation.
    decision_criterion: >-
      The three readouts are read in order. An aldehyde rise followed by oligomer
      accumulation followed by loss of vesicular storage establishes that the loop can run
      in a human sympathetic neuron. An aldehyde rise with no oligomer accumulation places
      the burden of the hypothesis back on the cell-free chemistry.
    would_support:
    - pathophysiology#Catecholaldehyde (DOPAL) Autotoxicity in Noradrenergic Neurons
    - mechanistic_hypotheses#catecholaldehyde_autotoxicity
    supporting_outcome:
    - >-
      Oligomer accumulation and loss of vesicular norepinephrine storage following an
      endogenously generated aldehyde burden, in human sympathetic neurons, would move the
      catecholaldehyde step off cell-free chemistry and out of the wrong cell types for the
      first time.
    would_refute:
    - pathophysiology#Catecholaldehyde (DOPAL) Autotoxicity in Noradrenergic Neurons
    - mechanistic_hypotheses#catecholaldehyde_autotoxicity
    refuting_outcome:
    - >-
      A raised aldehyde burden that leaves alpha-synuclein unaggregated and storage intact
      in the cell type the hypothesis is about would weigh against the step, and would
      suggest the oligomerisation seen in neuroblastoma and glial lines depends on
      conditions those systems impose.
- discussion_id: paf_peripheral_aggregate_seeding_mismatch
  prompt: >-
    Can alpha-synuclein aggregates taken from human peripheral sympathetic ganglia
    actually seed and propagate pathology, as the mouse fibril-injection model of PAF
    assumes?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Peripheral Autonomic Alpha-Synuclein Aggregation
  - pathophysiology#Spread to Central Nervous System (Phenoconversion)
  - animal_models#Mouse
  rationale: >-
    The animal model in this entry seeds pathology by injecting synthetic preformed
    fibrils into the ganglia of mice overexpressing mutant human alpha-synuclein, and
    the pathology then spreads along autonomic pathways into the central nervous
    system. That result is the main experimental support for the phenoconversion node.
    But when Lewy-body aggregates purified from the stellate ganglia of Parkinson
    disease patients were inoculated into mouse brain, they produced neither pathology
    nor degeneration, while aggregates from the same patients' substantia nigra did.
    So the seeding competence demonstrated in the model may be a property of synthetic
    fibrils in a transgenic host rather than of the human peripheral aggregate the
    model stands for. This is a mismatch rather than a missing experiment: evidence
    exists on both sides and points in opposite directions, and what is unresolved is
    whether the human peripheral aggregate propagates at all.
  posed_by: "dismech curation (PR #15556)"
  posed_date: '2026-10-26T00:00:00Z'
  evidence:
  - reference: PMID:29422109
    reference_title: "Lack of pathogenic potential of peripheral α-synuclein aggregates from Parkinson's disease patients."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "intracerebral inoculation of SG-derived LB into mice did not trigger long-term nigrostriatal neurodegeneration nor α-synuclein pathology"
    explanation: >-
      Human sympathetic-ganglion aggregates failed to seed, in the same assay in which
      nigral aggregates from the same patients succeeded.
  - reference: PMID:29422109
    reference_title: "Lack of pathogenic potential of peripheral α-synuclein aggregates from Parkinson's disease patients."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Our results argue against a putative pathogenic capacity of peripheral α-synuclein aggregates to promote α-synuclein pathology in the brain, propagate between neuronal networks or induce neurodegeneration."
    explanation: >-
      The authors' own reading of the negative result, which contradicts what the
      fibril-injection model is taken to show about peripheral-to-central spread.
  - reference: PMID:32071315
    reference_title: "Autonomic ganglionic injection of α-synuclein fibrils as a model of pure autonomic failure α-synucleinopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "induces spreading of α-Syn pathology only through the autonomic pathway to both the central nervous system (CNS) and the autonomic innervation of peripheral organs bidirectionally"
    explanation: "The other side of the mismatch: synthetic fibrils in the transgenic host do spread."
  proposed_experiments:
  - experiment_id: paf_ganglion_aggregate_seeding_competence
    name: Seeding competence of PAF-derived ganglionic aggregates
    description: >-
      Purify alpha-synuclein aggregates from sympathetic ganglia of autopsy-confirmed
      PAF cases, rather than from Parkinson disease cases or from synthetic fibrils, and
      test them both in seed amplification assays and by inoculation into the ganglia of
      wild-type and TgM83 mice. The published negative result used Parkinson disease
      stellate ganglia and inoculated the brain, so it leaves the PAF aggregate and the
      peripheral route untested.
    would_support:
    - pathophysiology#Spread to Central Nervous System (Phenoconversion)
    supporting_outcome:
    - Pathology propagating from the injected ganglion in a wild-type host would support peripheral-to-central spread as a mechanism of phenoconversion in PAF, independent of transgene overexpression.
    would_refute:
    - pathophysiology#Spread to Central Nervous System (Phenoconversion)
    refuting_outcome:
    - A PAF-derived aggregate that seeds in vitro but propagates in no host would make the model's spread result an artefact of synthetic fibrils and would leave phenoconversion unexplained by propagation.
- discussion_id: no_exposure_epidemiology
  kind: KNOWLEDGE_GAP
  attaches_to:
  - environmental#
  prompt: >-
    Has any environmental, occupational or lifestyle exposure been studied as a
    risk factor for pure autonomic failure?
  rationale: >-
    This entry carries no environmental section because no exposure study of
    this disease was found, not because exposures were judged irrelevant. A
    deep-research sweep of exposure epidemiology across the
    alpha-synucleinopathies returned substantial literature for Parkinson
    disease, a single unreplicated case-control study for multiple system
    atrophy, one multicentre case-control study for isolated REM sleep
    behaviour disorder and one for dementia with Lewy bodies, and nothing at
    all for this disease. The gap matters because the exposure findings that do
    exist do not agree with one another across these diseases: smoking is
    inversely associated with Parkinson disease, positively associated with
    isolated REM sleep behaviour disorder and null in dementia with Lewy
    bodies, and occupational pesticide exposure is positive in Parkinson
    disease and null in multiple system atrophy under a formal job-exposure
    matrix. Nothing can therefore be inferred about this disease from its
    neighbours, and an exposure profile for a condition whose pathology is
    largely restricted to the peripheral autonomic nervous system would bear
    directly on whether peripheral-onset disease has a distinct trigger.
  notes: >-
    Recorded as an absence of evidence rather than as evidence of absence. The
    searches run were disease-named exposure queries across the
    synucleinopathies; a dedicated search strategy for this disease, including
    its synonyms and the older Bradbury-Eggleston designation, has not been
    run and might surface case series that a cross-disease sweep missed.
notes: >-
  PAF is sporadic and has no causal gene; SNCA is recorded on pathophysiology nodes as
  the gene of the aggregating protein, not as a genetic cause. Rare pathogenic SNCA
  lesions (the E46K variant, gene triplication) can produce PAF or its cardiac
  noradrenergic lesion and are cited as indirect evidence on the aggregation node.

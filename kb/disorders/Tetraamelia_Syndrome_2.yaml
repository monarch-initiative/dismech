      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:29769720
    reference_title: "RSPO2 inhibition of RNF43 and ZNRF3 governs limb development independently of LGR4/5/6."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report an allelic series of recessive RSPO2 mutations in humans that cause tetra-amelia syndrome, which is characterized by lung aplasia and a total absence of the four limbs."
    explanation: Establishes recessive RSPO2 mutations as the cause of this form of tetra-amelia syndrome.
pathophysiology:
- name: Biallelic RSPO2 Loss of Function
  description: >-
    Recessive RSPO2 alleles, ranging from an upstream point variant to nonsense,
    frameshift, and terminal intron-exon deletions, reduce or abolish R-spondin 2
    function. The mutant proteins show impaired binding both to the LGR4/5/6
    receptors and to the RNF43/ZNRF3 ligases.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
  genes:
  - preferred_term: RSPO2
    term:
      id: hgnc:28583
      label: RSPO2
  evidence:
  - reference: PMID:29769720
    reference_title: "RSPO2 inhibition of RNF43 and ZNRF3 governs limb development independently of LGR4/5/6."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies revealed impaired binding to the LGR4/5/6 receptors and the RNF43 and ZNRF3 transmembrane ligases, and reduced WNT potentiation, which correlated with allele severity."
    explanation: Functional testing of the patient alleles shows loss of receptor and ligase binding.
  downstream:
  - target: Unopposed RNF43 and ZNRF3 Activity with Reduced WNT Potentiation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29769720
      reference_title: "RSPO2 inhibition of RNF43 and ZNRF3 governs limb development independently of LGR4/5/6."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional studies revealed impaired binding to the LGR4/5/6 receptors and the RNF43 and ZNRF3 transmembrane ligases, and reduced WNT potentiation, which correlated with allele severity."
      explanation: Loss of RNF43/ZNRF3 binding by the mutant alleles is accompanied by reduced WNT potentiation, graded by allele severity.
- name: Unopposed RNF43 and ZNRF3 Activity with Reduced WNT Potentiation
  description: >-
    RSPO2 acts as a direct antagonistic ligand of the transmembrane E3 ligases
    RNF43 and ZNRF3. Without it, these ligases remain active and WNT/beta-catenin
    signalling in responsive tissues is not amplified. The limb-relevant activity
    does not require the LGR4/5/6 receptors: a ubiquitous triple Lgr4/5/6 knockout
    mouse does not reproduce the Rspo2 loss-of-function phenotype, whereas
    concurrent loss of rnf43 and znrf3 in Xenopus produces supernumerary limbs,
    the mirror image of amelia.
  biological_scale: CELLULAR
  genes:
  - preferred_term: RNF43
    term:
      id: hgnc:18505
      label: RNF43
  - preferred_term: ZNRF3
    term:
      id: hgnc:18126
      label: ZNRF3
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:29769720
    reference_title: "RSPO2 inhibition of RNF43 and ZNRF3 governs limb development independently of LGR4/5/6."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results establish that RSPO2, without the LGR4/5/6 receptors, serves as a direct antagonistic ligand to RNF43 and ZNRF3, which together constitute a master switch that governs limb specification."
    explanation: Identifies RNF43/ZNRF3 antagonism, not LGR4/5/6 signalling, as the RSPO2 activity that controls limb specification.
  - reference: PMID:29769720
    reference_title: "RSPO2 inhibition of RNF43 and ZNRF3 governs limb development independently of LGR4/5/6."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Instead, we found that the concurrent deletion of rnf43 and znrf3 in Xenopus embryos was sufficient to trigger the outgrowth of supernumerary limbs."
    explanation: >-
      Loss of the two ligases produces the opposite of amelia, which supports
      their unopposed activity as the step through which RSPO2 loss acts.
  downstream:
  - target: Failure of Apical Ectodermal Ridge Maintenance
  - target: Reduced Lung Branching Morphogenesis
  - target: Reduced WNT Signalling in the Branchial Arch
- name: Failure of Apical Ectodermal Ridge Maintenance
  description: >-
    Rspo2 is expressed in the apical ectodermal ridge (AER) of all limb buds. In
    Rspo2-null mice the AER is induced normally, but expression of AER markers
    (Fgf8, Fgf4) and of beta-catenin targets within the AER is not maintained,
    and Shh signalling in the limb is reduced. Without a maintained AER the limb
    bud cannot grow out; in mice the defect is most severe distally and in the
    hindlimb, whereas human null alleles abolish all four limbs.
  biological_scale: TISSUE
  locations:
  - preferred_term: apical ectodermal ridge
    term:
      id: UBERON:0004356
      label: apical ectodermal ridge
  - preferred_term: limb bud
    term:
      id: UBERON:0004347
      label: limb bud
  biological_processes:
  - preferred_term: embryonic limb morphogenesis
    term:
      id: GO:0030326
      label: embryonic limb morphogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:17904116
    reference_title: "Mouse R-spondin2 is required for apical ectodermal ridge maintenance in the hindlimb."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although the initiation of the expression of apical ectodermal ridge (AER)-specific genes, including fibroblast growth factor 8 (FGF8) and FGF4 occurred normally, the maintenance of these marker expressions was significantly defective in the hindlimb of Rspo2(-/-) mice."
    explanation: Shows the AER forms but is not maintained without Rspo2.
  - reference: PMID:17904116
    reference_title: "Mouse R-spondin2 is required for apical ectodermal ridge maintenance in the hindlimb."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Consistent with the ligand role of R-spondins in the Wnt/beta-catenin signaling pathway, expression of Axin2 and Sp8, targets for beta-catenin signaling, within AER was greatly reduced in Rspo2(-/-) embryos."
    explanation: Links the AER defect to reduced WNT/beta-catenin signalling.
  - reference: PMID:18067586
    reference_title: "R-spondin2 expression in the apical ectodermal ridge is essential for outgrowth and patterning in mouse limb development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This study shows that Rspo2 is critical for maintenance of the AER and for growth and patterning in limb development."
    explanation: Independent Rspo2 knockout confirming the AER maintenance role.
  downstream:
  - target: Tetraamelia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18067586
      reference_title: "R-spondin2 expression in the apical ectodermal ridge is essential for outgrowth and patterning in mouse limb development."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "This study shows that Rspo2 is critical for maintenance of the AER and for growth and patterning in limb development."
      explanation: >-
        In mice, loss of AER maintenance produces limb truncation rather than
        complete amelia, so the step to total limb absence in humans is inferred
        from the more severe human null phenotype.
- name: Reduced Lung Branching Morphogenesis
  description: >-
    R-spondin 2 signalling through the canonical WNT pathway is needed for
    branching of the developing lung. Hypomorphic Rspo2 mice have hypoplastic
    lungs with reduced branching and reduced WNT reporter activity, and further
    loss of WNT co-receptor function (Lrp6) makes the hypoplasia more severe. In
    humans with RSPO2 null alleles the lungs fail to form.
  biological_scale: TISSUE
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  biological_processes:
  - preferred_term: epithelial tube branching involved in lung morphogenesis
    term:
      id: GO:0060441
      label: epithelial tube branching involved in lung morphogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:18256198
    reference_title: "R-spondin 2 is required for normal laryngeal-tracheal, lung and limb morphogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Rspo2(Tg/Tg) lung defects were associated with reduced branching, a reduction in TOPGAL reporter activity, and reduced expression of the downstream Wnt target Irx3."
    explanation: Shows reduced lung branching with reduced WNT signalling in an Rspo2 hypomorph.
  downstream:
  - target: Bilateral lung agenesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18256198
      reference_title: "R-spondin 2 is required for normal laryngeal-tracheal, lung and limb morphogenesis."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Interbreeding the Rspo2(Tg) and Lrp6(-) alleles resulted in more severe defects consisting of marked lung hypoplasia and absence of tracheal-bronchial rings, laryngeal structures and all limb skeletal elements."
      explanation: >-
        Graded loss of Rspo2/WNT signalling produces graded lung hypoplasia in
        mice; human lung aplasia is taken as the extreme of this series.
- name: Reduced WNT Signalling in the Branchial Arch
  description: >-

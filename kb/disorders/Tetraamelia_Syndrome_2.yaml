    A recessive 50-kb deletion removing three coding exons of bovine RSPO2
    segregates with tetradysmelia, a severe reduction of all limb parts distal to
    the shoulder and pelvic girdles.
  modeled_mechanisms:
  - target: Biallelic RSPO2 Loss of Function
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: Naturally occurring recessive RSPO2 null allele in a large mammal producing four-limb reduction.
    evidence:
    - reference: PMID:33176673
      reference_title: "A 50-kb deletion disrupting the RSPO2 gene is associated with tetradysmelia in Holstein Friesian cattle."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We identified a 50-kb deletion on BTA14 that disrupts the coding sequence of the RSPO2 gene and is associated with bovine tetradysmelia."
      explanation: A natural RSPO2 loss-of-function allele causing reduction of all four limbs.

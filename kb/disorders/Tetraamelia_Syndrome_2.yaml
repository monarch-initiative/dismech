name: Tetraamelia Syndrome 2
creation_date: '2026-10-08T00:00:00Z'
description: >-
  Tetraamelia syndrome 2 (TETAMS2) is an autosomal recessive, typically lethal
  malformation syndrome caused by biallelic loss-of-function variants in RSPO2,
  which encodes the secreted WNT-potentiating ligand R-spondin 2. Affected fetuses
  lack all four limbs or retain only rudimentary appendages, and have aplasia of
  the lungs; orofacial clefting and mandibular hypoplasia are also recorded.
  RSPO2 normally amplifies WNT/beta-catenin signalling by antagonising the
  transmembrane E3 ligases RNF43 and ZNRF3, which otherwise clear WNT receptors
  from the cell surface. The human allelic series showed that the severity of
  the limb phenotype tracks the degree to which each allele loses this activity.
  Mouse Rspo2 mutants place the defect in failed maintenance of the apical
  ectodermal ridge of the limb bud, reduced lung branching, and reduced WNT
  signalling in the branchial arch. TETAMS2 is genetically distinct from
  tetraamelia syndrome 1, which is caused by WNT3.
category: Mendelian
parents:
- Congenital Disorder
- Limb Malformation
synonyms:
- TETAMS2
- RSPO2-related tetra-amelia
disease_term:
  preferred_term: tetraamelia syndrome 2
  term:
    id: MONDO:0060732
    label: tetraamelia syndrome 2
notes: >-
  The human disease is known from a single report of an allelic series of
  recessive RSPO2 mutations (PMID:29769720), whose PubMed abstract is the only
  text of that paper available to the reference cache. Phenotypes beyond limb
  absence and lung aplasia are therefore cited from the OMIM-derived summary
  table in the bovine tetradysmelia paper (PMID:33176673) and are marked as
  background quotes. A PubMed search for "RSPO2 AND (fetus OR fetal OR prenatal
  OR case report OR homozygous)" and for "tetra-amelia OR tetraamelia" (run
  2026-10-08) found no further human RSPO2 case reports. No treatment is
  described for this prenatally lethal condition, so no treatments are curated. No GeneReviews
  chapter covers this disease (Bookshelf index snapshot of 2026-09-10 plus a
  live PubMed title search).
inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic RSPO2 variants. The original report describes recessive mutations
    forming an allelic series in which phenotype severity follows residual
    protein function.
  inheritance_term:

  - reference: PMID:9467018
    reference_title: "Identification of a mutation in DLX3 associated with tricho-dento-osseous (TDO) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identification of a 4 bp deletion in human DLX3 which correlates with the TDO phenotype in six families"
    explanation: >-
      Discovery of DLX3 as the TDO gene by positional cloning in the 17q21
      linkage interval, with the deletion segregating in six families.
  - reference: PMID:9361034
    reference_title: "Genetic linkage of the tricho-dento-osseous syndrome to chromosome 17q21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we obtained conclusive evidence for linkage of the TDO syndrome locus to markers on chromosome 17q21"
    explanation: Places the TDO locus at 17q21, the interval containing DLX3.
  - reference: ORPHA:3352
    reference_title: "Tricho-dento-osseous syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "DLX3 | distal-less homeobox 3 | hgnc:2916 | Disease-causing germline mutation(s) (loss of function) in"
    explanation: Orphanet gene-disease row naming DLX3 (hgnc:2916) as disease-causing.
  - reference: PMID:21252474
    reference_title: "DLX3 homeodomain mutations cause tricho-dento-osseous syndrome with novel phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After mutational analysis of DLX3, we identified 2 missense mutations affecting the conserved homeodomain. We suggest that TDO is essentially caused by loss of function and haploinsufficiency of DLX3."
    explanation: >-
      Homeodomain missense alleles in two Finnish families extend the allelic
      spectrum and support a loss-of-function mechanism for those alleles.
  variants:
  - name: c.571_574delGGGG (4-bp deletion, founder allele)
    type: frameshift deletion
    variant_type: deletion
    clinical_significance: PATHOGENIC
    description: >-
      Recurrent 4-bp deletion causing a frameshift that replaces the C-terminal
      region downstream of the homeodomain. Shared, with a common surrounding
      haplotype, by the North Carolina and Virginia kindreds in which TDO was
      first characterized, indicating descent from a common ancestor. The
      mutant protein acts as a dominant negative.
    evidence:
    - reference: PMID:9467018
      reference_title: "Identification of a mutation in DLX3 associated with tricho-dento-osseous (TDO) syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The observed mutation is predicted to cause a frameshift and premature termination codon, resulting in a functionally altered DLX3."
      explanation: States the predicted frameshift consequence of the founder deletion.
    - reference: PMID:9783705
      reference_title: "A common DLX3 gene mutation is responsible for tricho-dento-osseous syndrome in Virginia and North Carolina families."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings suggest that all people with TDO who have been evaluated have inherited the same DLX3 gene deletion mutation from a common ancestor."
      explanation: Shared haplotype across kindreds supports a founder allele.
  - name: c.561_562delCT (C-terminal frameshift, attenuated phenotype)
    type: frameshift deletion
    variant_type: deletion
    description: >-
      Two-base deletion just upstream of the founder allele, first reported as
      autosomal dominant amelogenesis imperfecta with taurodontism and later
      shown to cause attenuated TDO with milder hair, tooth and bone findings.
      The literature numbers it both c.560_561delCT and c.561_562delCT.
    evidence:
    - reference: PMID:18203197
      reference_title: "DLX3 c.561_562delCT mutation causes attenuated phenotype of tricho-dento-osseous syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The present study shows that the DLX3 c.560_561delCT mutation causes an attenuated TDO phenotype with less severe hair, tooth, and bone manifestations compared with individuals having the DLX3 c.571_574delGGGG mutation."
      explanation: Kindred phenotyping showing this allele produces attenuated TDO.
    - reference: PMID:18362318
      reference_title: "DLX3 mutation in a new family and its phenotypic variations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This study clearly showed that the c.561_562delCT mutation had not only enamel defects, but also other clinical phenotypes resembling those of TDO syndrome."
      explanation: An independent Korean family with the same allele shows extra-dental TDO features.
  - name: c.533A>G (p.Gln178Arg) homeodomain missense
    type: missense
    variant_type: single nucleotide variant
    description: >-
      De novo homeodomain missense allele found in a Chinese patient with
      typical TDO; it is the allele behind the patient-derived bone marrow
      stromal cell and iPSC models.
    evidence:
    - reference: PMID:26104267
      reference_title: "Morphological analyses and a novel de novo DLX3 mutation associated with tricho-dento-osseous syndrome in a Chinese family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Finally, genetic analysis revealed a novel de novo missense mutation c.533A>G (p.Q178R) in the conserved homeodomain of the DLX3 gene."
      explanation: Identifies the de novo homeodomain missense allele.
  - name: c.574delG, c.476G>T (p.Arg159Leu) and whole-gene DLX3 deletion
    type: frameshift, missense and whole-gene deletion
    description: >-
      Three alleles reported in UK families ascertained through amelogenesis
      imperfecta. All gave amelogenesis imperfecta and taurodontism with
      attenuated systemic TDO features. The whole-gene deletion is the clearest
      evidence that DLX3 haploinsufficiency alone is pathogenic.
    evidence:
    - reference: PMID:30095208
      reference_title: "Novel DLX3 variants in amelogenesis imperfecta with attenuated tricho-dento-osseous syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "For all three families, the phenotypes were shown to consist of AI and taurodontism, together with other attenuated features of TDO."
      explanation: Clinical outcome of the three alleles.
    - reference: PMID:30095208
      reference_title: "Novel DLX3 variants in amelogenesis imperfecta with attenuated tricho-dento-osseous syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a heterozygous deletion of the entire DLX3 coding region were identified in our families"
      explanation: Whole-gene heterozygous deletion as a cause of attenuated TDO.
  - name: c.604_605del (p.Ser202*) truncating frameshift
    type: frameshift deletion
    variant_type: deletion
    description: >-
      C-terminal truncating allele in a Chinese family with atypical TDO and
      enamel dysplasia; affected deciduous enamel was thinner, softer and lower
      in calcium than control enamel.
    evidence:
    - reference: PMID:38006713
      reference_title: "A novel DLX3 mutation causes tricho-dento-osseous syndrome with abnormal enamel structure and formation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We found a new DLX3 mutation in a Chinese family with enamel dysplasia"
      explanation: Reports the allele in an affected family.
  - name: c.516+1_516+2insA splice-site variant
    type: splice site insertion
    variant_type: insertion
    description: >-
      First pathogenic DLX3 splice-site variant. Minigene analysis showed two
      aberrant transcripts; the proband had a mesenchymal-dominant dental
      phenotype (severe dentin hypoplasia, hypertaurodontism) while relatives
      carrying the same allele showed epithelial-dominant enamel and hair
      anomalies.
    evidence:
    - reference: PMID:41774401
      reference_title: "Differential Effects of DLX3 Mutations Drive Phenotypic Variability in Tricho-Dento-Osseous Syndrome via Direct Activation of WNT10A."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The proband with the splice-site mutation displayed a mesenchymal-dominant phenotype with severe dentin hypoplasia, enlarged pulp chambers, and hypertaurodontism but nearly normal enamel, whereas the mother and sister showed epithelial-dominant anomalies, including enamel hypoplasia and kinky hair."
      explanation: Intrafamilial variability with one splice-site allele.
    - reference: PMID:41774401
      reference_title: "Differential Effects of DLX3 Mutations Drive Phenotypic Variability in Tricho-Dento-Osseous Syndrome via Direct Activation of WNT10A."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Minigene analysis demonstrated that c.516+1_516+2insA generated two aberrant transcripts encoding p.Val173Aspfs*28 and p.Arg120_Val173del."
      explanation: Splicing consequence of the variant.
  notes: >-
    The molecular effect is allele-dependent: the founder C-terminal frameshift
    acts as a dominant negative in cell assays, while homeodomain missense,
    splice-site and whole-gene-deletion alleles point to loss of function and
    haploinsufficiency, so no single functional_impact_category is recorded.
    ClinGen has no gene-disease validity record for DLX3 and TDO in the cached
    export (cache/clingen/gene_validity.csv has no DLX3 row), so no
    gene_disease_validity assertion is recorded.
pathophysiology:
- name: DLX3 Transcription Factor Dysfunction
  biological_scale: MOLECULAR
  description: >-
    DLX3 is a homeodomain transcription factor required for terminal
    differentiation programs in tooth, bone, hair and epidermis. The founder
    c.571_574delGGGG protein reaches the nucleus but cannot bind the canonical
    DLX3 element, has defective transactivation and lowers the activity of
    co-expressed wild-type DLX3, a dominant-negative effect. Homeodomain
    missense, splice-site and whole-gene-deletion alleles instead indicate loss
    of function and haploinsufficiency. The molecular lesion is therefore
    reduced DLX3-dependent transcription, reached by different routes for
    different alleles.
  genes:
  - preferred_term: DLX3
    term:
      id: hgnc:2916
      label: DLX3
  molecular_functions:
  - preferred_term: DLX3 sequence-specific transcription factor activity
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
    modifier: DECREASED
  evidence:
  - reference: PMID:18492670
    reference_title: "Molecular consequences of a frameshifted DLX3 mutant leading to Tricho-Dento-Osseous syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunocytochemical analysis revealed that both DLX3(WT) and DLX3(TDO) recombinant proteins are targeted to the nucleus. However, as demonstrated by electrophoresis mobility shift assay, DLX3(TDO) is not able to bind to the canonical Dlx3 binding site."
    explanation: The founder mutant protein is nuclear but fails to bind DNA.
  - reference: PMID:18492670
    reference_title: "Molecular consequences of a frameshifted DLX3 mutant leading to Tricho-Dento-Osseous syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, the transcriptional activity of DLX3(WT) is significantly reduced in the presence of the mutated isoform, indicating that DLX3(TDO) has a dominant negative effect on DLX3(WT) transcriptional activity."
    explanation: Dominant-negative suppression of wild-type DLX3 transactivation in osteoblastic and keratinocyte cell lines.
  - reference: PMID:21252474
    reference_title: "DLX3 homeodomain mutations cause tricho-dento-osseous syndrome with novel phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After mutational analysis of DLX3, we identified 2 missense mutations affecting the conserved homeodomain. We suggest that TDO is essentially caused by loss of function and haploinsufficiency of DLX3."
    explanation: Homeodomain missense alleles support loss of function for those alleles.
  - reference: PMID:18203197
    reference_title: "DLX3 c.561_562delCT mutation causes attenuated phenotype of tricho-dento-osseous syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Careful phenotyping of individuals with allelic DLX3 mutations reveals marked differences in phenotypic severity indicating that the carboxy-terminus of the DLX3 protein is critical in determining its function during development in these different tissues."
    explanation: Allelic severity differences tie the C-terminal region to DLX3 function across tissues.
  downstream:
  - target: Impaired Ameloblast Differentiation and Enamel Matrix Gene Transactivation
    causal_link_type: DIRECT
    description: Mutant DLX3 fails to transactivate enamel matrix protein genes in ameloblasts.
    evidence:
    - reference: PMID:38006713
      reference_title: "A novel DLX3 mutation causes tricho-dento-osseous syndrome with abnormal enamel structure and formation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "A luciferase reporter assay demonstrated that this mutation significantly reduced the transactivation activity of DLX3 on Amelx/Odam/Klk4."
      explanation: Reduced transactivation of enamel matrix gene promoters by mutant DLX3.
  - target: Disrupted Odontoblast Differentiation and Dentin Formation
    causal_link_type: DIRECT
    description: >-
      DLX3 drives odontoblastic gene expression, including direct activation of
      WNT10A; reduced DLX3 function is proposed to disturb dentin formation.
    evidence:
    - reference: PMID:41774401
      reference_title: "Differential Effects of DLX3 Mutations Drive Phenotypic Variability in Tricho-Dento-Osseous Syndrome via Direct Activation of WNT10A."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In cultured human dental pulp cells, DLX3 overexpression upregulated the odontoblastic markers DSPP, MMP20, and WNT10A."
      explanation: DLX3 induces odontoblastic markers in human dental pulp cells.
  - target: Reduced Osteoclast Differentiation and Bone Resorption
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26836061
      reference_title: "DLX3 negatively regulates osteoclastic differentiation through microRNA-124."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The results showed that the expression of osteoclastogenesis-related genes as well as tartrate-resistant acid phosphatase-positive multinucleated cells were lower in WT-DLX3 and MT-DLX3, but higher in Dlx3-shRNA compared with control cells."
      explanation: Wild-type and Q178R DLX3 both suppress osteoclastogenesis in RAW 264.7 cells.
  - target: Enhanced Osteoblast Lineage Commitment
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17950683
      reference_title: "A 4 bp deletion mutation in DLX3 enhances osteoblastic differentiation and bone formation in vitro."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results demonstrate that the DLX3 deletion mutation associated with TDO enhances mesenchymal cell differentiation to an osteoblastic lineage rather than a myoblastic lineage by changing the fate of mesenchymal cells."
      explanation: The founder allele shifts mesenchymal cells toward the osteoblast lineage in vitro.
  - target: Delayed Osteoprogenitor Senescence
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27924851
      reference_title: "Senescence: novel insight into DLX3 mutations leading to enhanced bone formation in Tricho-Dento-Osseous syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Both DLX3 mutations (c.533 A>G and c.571_574delGGGG) delayed cellular senescence when they were introduced into pre-osteoblastic cells MC3T3-E1."
      explanation: Two TDO alleles delay senescence of pre-osteoblastic cells.
  - target: Hair Follicle Dysplasia
    causal_link_type: UNKNOWN
    description: >-
      Supported only by a naturally occurring DLX3 frameshift in a calf whose
      skin biopsies showed follicular dysplasia; the follicular lesion in human
      TDO has not been characterized histologically.
    evidence:
    - reference: PMID:28670783
      reference_title: "A de novo germline mutation of DLX3 in a Brown Swiss calf with tricho-dento-osseus-like syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "The calf had a dull kinky coat with mild hypotrichosis, and teeth with brown staining and enamel defects. Histological examination of skin biopsies was compatible with a follicular dysplasia."
      explanation: >-
        A DLX3 frameshift in cattle co-occurs with follicular dysplasia and a
        kinky coat; non-human, single animal.
- name: Impaired Ameloblast Differentiation and Enamel Matrix Gene Transactivation
  biological_scale: CELLULAR
  description: >-
    In ameloblast-lineage cells, a TDO-associated DLX3 truncation impairs
    differentiation and lowers expression of enamel matrix protein genes
    (Amelx, Tuft1, Klk4, Ambn, Odam), reducing the matrix that mineralizes into
    enamel. The resulting enamel is thin, poorly mineralized and structurally
    disordered.
  cell_types:
  - preferred_term: ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  biological_processes:
  - preferred_term: ameloblast differentiation
    term:
      id: GO:0036305
      label: ameloblast differentiation
    modifier: DECREASED
  - preferred_term: amelogenesis
    term:
      id: GO:0097186
      label: amelogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:38006713
    reference_title: "A novel DLX3 mutation causes tricho-dento-osseous syndrome with abnormal enamel structure and formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In an immortalized ameloblast-lineage cell (ALC) line, this mutation affected ameloblast differentiation and downregulated the expression levels of enamel matrix protein (EMP) genes (Amelx, Tuft1, Klk4, Ambn, Odam)."
    explanation: Mutant DLX3 impairs ameloblast differentiation and enamel matrix gene expression.
  downstream:
  - target: Generalized Enamel Hypoplasia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38006713
      reference_title: "A novel DLX3 mutation causes tricho-dento-osseous syndrome with abnormal enamel structure and formation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "this mutation may affect ameloblast differentiation by inhibiting the transcriptional activity of Amelx/Odam/Klk4, thereby interfering with enamel formation"
      explanation: Authors' conclusion linking the ameloblast defect to defective enamel formation.
  - target: Enamel Hypomineralization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38006713
      reference_title: "A novel DLX3 mutation causes tricho-dento-osseous syndrome with abnormal enamel structure and formation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Compared with control teeth, the mutant enamel showed a significant decrease in thickness, hardness and calcium content and an increase in magnesium content."
      explanation: Mutant enamel is thinner and less mineralized, the tissue outcome of the ameloblast defect.
- name: Disrupted Odontoblast Differentiation and Dentin Formation
  biological_scale: CELLULAR
  description: >-
    DLX3 activates odontoblastic genes in dental pulp cells, including WNT10A
    through a conserved enhancer. Reduced DLX3 function is proposed to disturb
    odontoblast differentiation and dentin formation, giving thin dentin and
    the enlarged pulp chambers of taurodontism. The evidence is human genetic
    and cell based; it is strongest for alleles with a mesenchymal-dominant
    dental phenotype.
  cell_types:
  - preferred_term: odontoblast
    term:
      id: CL:0000060
      label: odontoblast
  biological_processes:
  - preferred_term: odontoblast differentiation
    term:
      id: GO:0071895
      label: odontoblast differentiation
    modifier: DECREASED
  - preferred_term: dentinogenesis
    term:
      id: GO:0097187
      label: dentinogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:41774401
    reference_title: "Differential Effects of DLX3 Mutations Drive Phenotypic Variability in Tricho-Dento-Osseous Syndrome via Direct Activation of WNT10A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Chromatin immunoprecipitation and reporter assays further revealed that DLX3 directly activates WNT10A via a conserved enhancer"
    explanation: DLX3 directly activates WNT10A, a candidate effector of dentin formation.
  downstream:
  - target: Taurodontia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:41774401

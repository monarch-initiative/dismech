name: Tricho-dento-osseous Syndrome
creation_date: "2026-10-27T12:20:54Z"
description: >-
  Tricho-dento-osseous syndrome (TDO) is a rare, highly penetrant autosomal
  dominant ectodermal dysplasia caused by heterozygous variants in DLX3, the
  distal-less homeobox 3 transcription factor gene at 17q21. It is named for
  its three principal tissues: hair (kinky or curly hair at birth that
  straightens in about half of affected people by adolescence), teeth
  (generalized thin and pitted enamel hypoplasia with hypomineralization, and
  severe taurodontism with enlarged pulp chambers, most diagnostically in the
  mandibular first permanent molars), and bone (thickened, sclerotic calvarium
  and skull base, poor mastoid pneumatization, and increased appendicular and
  axial bone mineral density). Brittle nails, a Class III skeletal pattern with
  a short mandibular ramus, and periapical abscesses secondary to the weak
  enamel and large pulp chambers are common. The recurrent founder allele is a
  4-bp deletion (c.571_574delGGGG) that frameshifts the C-terminal region just
  after the homeodomain; the mutant protein enters the nucleus but cannot bind
  DNA and suppresses wild-type DLX3 activity. Homeodomain missense, other
  frameshift, splice-site and whole-gene-deletion alleles are also reported,
  and several of them produce an attenuated, dental-predominant phenotype that
  overlaps DLX3-related amelogenesis imperfecta with taurodontism.
  Mechanistically, mutant DLX3 reduces enamel matrix gene transactivation in
  ameloblasts, disturbs odontoblast and dentin formation, and, in bone,
  suppresses osteoclast differentiation and resorption. Management is
  preventive and restorative dental care.

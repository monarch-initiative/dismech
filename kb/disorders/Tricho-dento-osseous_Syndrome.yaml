  evidence:
  - reference: PMID:22969805
    reference_title: "Tricho-dento-osseous syndrome: diagnosis and dental management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This paper proposes treatment approaches that include preventive, restorative, endodontic, prosthetic, and surgical options to management."
    explanation: Endodontic treatment is among the recommended options.
- name: Implant-Supported Fixed Prosthodontic Rehabilitation
  description: >-
    Fixed implant-supported prosthodontic rehabilitation of an adult after
    tooth loss, reported in a single case using a facially driven digital
    workflow.
  treatment_term:
    preferred_term: Implant-supported fixed prosthodontic restoration
    term:
      id: NCIT:C60718
      label: Dental Restoration
  evidence:
  - reference: PMID:39237422
    reference_title: "Fixed prosthodontic rehabilitation using a facially driven fully digital workflow of a patient with syndromic amelogenesis imperfecta associated with a rare form of ectodermal dysplasia, tricho-dento-osseous (TDO) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The facially driven digital workflow streamlined the rehabilitation and allowed for functional, esthetic, and psychosocial improvements in a timely manner."
    explanation: Single-patient report of functional, esthetic and psychosocial benefit.
animal_models:
- name: Col1a1-driven mutant DLX3 transgenic mouse
  species: Mouse
  genotype: Tg(2.3 kb Col1a1 promoter-DLX3 c.571_574delGGGG)
  publication: PMID:18996110
  description: >-
    Transgenic mice expressing the founder allele in osteoblasts under the
    2.3 kb Col1a1 promoter. Femora show markedly increased trabecular bone
    volume and density, with reduced osteoclast differentiation and number,
    lower serum TRACP 5b and CTX, and higher serum IFN-gamma.
  modeled_mechanisms:
  - target: Reduced Osteoclast Differentiation and Bone Resorption
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reproduces reduced osteoclastogenesis and resorption with high trabecular bone mass.
    limitations: >-
      Promoter-driven transgene expression restricted to the osteoblast lineage,
      on top of two wild-type Dlx3 alleles, rather than endogenous
      heterozygosity; enamel and hair features are not modeled.
    evidence:
    - reference: PMID:18996110
      reference_title: "In vivo impact of a 4 bp deletion mutation in the DLX3 gene on bone development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Microcomputed tomographic analyses demonstrated markedly increased trabecular bone volume and bone mineral density in femora from TG mice."
      explanation: The model reproduces the high bone mass of TDO.
- name: dlx3b mutant zebrafish
  species: Zebrafish
  genotype: dlx3b-/- (TALEN-induced)
  publication: PMID:32117623
  description: >-
    Homozygous dlx3b mutants show early dorsal spinal curvature and
    pharyngeal-tooth enameloid with abnormal surface and reduced mineral
    content, with downregulated SCPP genes including odam.
  modeled_mechanisms:
  - target: Impaired Ameloblast Differentiation and Enamel Matrix Gene Transactivation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Reduced enameloid mineralization and SCPP gene expression.
    limitations: >-
      Fish enameloid is not mammalian enamel, zebrafish carries duplicated dlx3
      paralogues, and the mutants are homozygous rather than heterozygous.
    evidence:
    - reference: PMID:32117623
      reference_title: "Mutant dlx3b disturbs normal tooth mineralization and bone formation in zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "SEM revealed morphological surface changes in pharyngeal teeth enameloid, accompanied by a decrease in the mineral content detected by EDS."
      explanation: Enameloid mineralization defect in dlx3b mutants.
- name: Brown Swiss calf with a de novo DLX3 frameshift
  species: Cattle
  genotype: DLX3 heterozygous de novo 10-bp frameshift in exon 3
  publication: PMID:28670783
  description: >-
    A single naturally occurring case with a kinky coat, mild hypotrichosis,
    follicular dysplasia, thin enamel, large pulp cavities and thickened skull
    bones. The frameshift replaces the second C-terminal transactivation
    domain.
  modeled_mechanisms:
  - target: Hair Follicle Dysplasia
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    description: Follicular dysplasia with a kinky coat.
    limitations: Single animal; no replication or functional work.
    evidence:
    - reference: PMID:28670783
      reference_title: "A de novo germline mutation of DLX3 in a Brown Swiss calf with tricho-dento-osseus-like syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Histological examination of skin biopsies was compatible with a follicular dysplasia."
      explanation: Follicular dysplasia in the DLX3-mutant calf.
notes: >-
  Phenotype frequencies differ widely between the prospective kindred studies of
  the founder allele, where enamel hypoplasia and taurodontism were universal,
  and a 2025 meta-analysis of case literature that pooled them at about 70%;
  frequency is left unset where the two disagree. Orphanet (ORPHA:3352) supplies
  the frequency band where no primary cohort reports one. There is no
  GeneReviews or StatPearls chapter for TDO (`just check-genereviews --online`
  returns NO_CHAPTER for both against the name and all synonyms).

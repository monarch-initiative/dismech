inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous DLX3 variants segregate as a highly penetrant autosomal
    dominant trait with marked intra- and interfamilial variability in hair,
    dental and skeletal expression. De novo cases are documented.
  expressivity: VARIABLE
  evidence:
  - reference: PMID:9361034
    reference_title: "Genetic linkage of the tricho-dento-osseous syndrome to chromosome 17q21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tricho-dento-osseous syndrome (TDO), MIM# 190320, is transmitted as a highly penetrant autosomal dominant trait that is characterized by variable clinical expression."
    explanation: >-
      Four multiplex North Carolina families (63 members, 39 affected) establish
      highly penetrant autosomal dominant transmission with variable expression.
  - reference: PMID:9783705
    reference_title: "A common DLX3 gene mutation is responsible for tricho-dento-osseous syndrome in Virginia and North Carolina families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variable clinical phenotype observed in these North Carolina and Virginia families, which share a common gene mutation, suggests that clinical variability is not the result of genetic heterogeneity at the major locus"
    explanation: >-
      Families sharing one DLX3 allele still differ clinically, so the variable
      expressivity is not explained by locus heterogeneity.

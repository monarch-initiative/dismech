diagnosis:
- name: Clinical and Radiographic Diagnostic Criteria with DLX3 Testing
  description: >-
    The clinical diagnosis rests on generalized enamel defects, severe
    taurodontism especially of the mandibular first permanent molars,
    autosomal dominant inheritance, and at least one minor feature (nail
    defects, bone sclerosis, or curly hair in early life). Molecular testing of
    DLX3, including deletion analysis because a whole-gene deletion is a
    reported cause, confirms the diagnosis and is needed for de novo and
    attenuated cases that do not meet the pedigree or minor-feature criteria.
  evidence:
  - reference: PMID:22969805
    reference_title: "Tricho-dento-osseous syndrome: diagnosis and dental management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Diagnostic criteria are based on the generalized enamel defects, severe taurodontism especially of the mandibular first permanent molars, an autosomal dominant mode of inheritance, and at least one of the other features (i.e., nail defects, bone sclerosis, and curly, kinky or wavy hair present at a young age that may straighten out later)."
    explanation: States the clinical diagnostic criteria.
  - reference: PMID:30095208
    reference_title: "Novel DLX3 variants in amelogenesis imperfecta with attenuated tricho-dento-osseous syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a heterozygous deletion of the entire DLX3 coding region were identified in our families"
    explanation: A whole-gene deletion means sequencing alone can miss the diagnosis.
differential_diagnoses:
- name: DLX3-related amelogenesis imperfecta with taurodontism (AIHHT)
  description: >-
    Hypomaturation-hypoplastic amelogenesis imperfecta with taurodontism
    (MONDO:0007093) is curated as the AIHHT subtype of the
    Amelogenesis_Imperfecta entry, bound to the same DLX3 (hgnc:2916). It is
    allelic with TDO at the attenuated end of a severity continuum: the
    c.561_562delCT allele first reported as AIHHT was later shown to cause
    attenuated TDO with hair, nail and bone involvement, while one AIHHT family
    carried no DLX3 or DLX7 variant at all. Hair and bone findings and true
    taurodontism of the mandibular first permanent molar favour TDO.
  distinguishing_features:
  - Curly or kinky hair at birth
  - Increased cranial and appendicular bone density
  - Severe taurodontism of the mandibular first permanent molar
  evidence:
  - reference: PMID:10466415
    reference_title: "Tricho-dento-osseous syndrome and amelogenesis imperfecta with taurodontism are genetically distinct conditions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results suggest that AI-HHT and TDO are two genetically distinct conditions."
    explanation: An AIHHT family without a DLX3 variant shows AIHHT is not always allelic with TDO.
  - reference: PMID:18203197
    reference_title: "DLX3 c.561_562delCT mutation causes attenuated phenotype of tricho-dento-osseous syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously, the DLX3 c.561_562delCT mutation was associated with autosomal dominant amelogenesis imperfecta with taurodontism."
    explanation: The same DLX3 allele has been labelled both AIHHT and attenuated TDO.
treatments:
- name: Preventive and Restorative Dental Management
  description: >-
    Multidisciplinary dental care aimed at preventing sensitivity, caries,
    abscesses and loss of occlusal vertical dimension from attrition of the
    hypoplastic enamel, and at restoring function and appearance. Options
    include preventive measures, restorations and crowns, endodontic
    treatment, prosthetics and surgery. No disease-modifying therapy exists.
  treatment_term:
    preferred_term: Dental restoration
    term:
      id: NCIT:C60718
      label: Dental Restoration
  target_phenotypes:
  - preferred_term: Generalized hypoplasia of dental enamel
    term:
      id: HP:0006282
      label: Generalized hypoplasia of dental enamel
  - preferred_term: Periapical tooth abscess
    term:
      id: HP:0030758
      label: Periapical tooth abscess
  evidence:
  - reference: PMID:22969805
    reference_title: "Tricho-dento-osseous syndrome: diagnosis and dental management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The aim of treatment is to prevent problems such as sensitivity, caries, dental abscesses, and loss of occlusal vertical dimension through attrition of hypoplastic tooth structure."
    explanation: States the goals of dental management.
  - reference: PMID:22969805
    reference_title: "Tricho-dento-osseous syndrome: diagnosis and dental management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This paper proposes treatment approaches that include preventive, restorative, endodontic, prosthetic, and surgical options to management."
    explanation: Lists the dental treatment modalities used.
  - reference: PMID:35003563
    reference_title: "Dental management of tricho-dento-osseous syndrome in adolescent patients: Literature review and case presentation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This article emphasizes the importance of a multidisciplinary approach for the dental management of patients suffering TDO."
    explanation: Case report and review supporting team-based dental care.
- name: Endodontic Treatment
  description: >-
    Root canal treatment for pulp exposure or periapical infection; the
    enlarged taurodontic pulp chambers make it technically demanding.
  treatment_term:

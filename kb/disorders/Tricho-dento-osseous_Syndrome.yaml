      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "whereas disrupted regulation of WNT10A underlies dentin defects and taurodontism"
      explanation: Authors' conclusion connecting disturbed DLX3-WNT10A regulation to taurodontism.
- name: Reduced Osteoclast Differentiation and Bone Resorption
  biological_scale: CELLULAR
  description: >-
    Mutant DLX3 suppresses osteoclastogenesis. In transgenic mice expressing
    the founder allele in osteoblasts, osteoclast differentiation, osteoclast
    number and serum resorption markers fall while serum IFN-gamma rises, and
    trabecular bone volume and density increase without an increase in dynamic
    bone formation rate. In RAW 264.7 cells, wild-type and Q178R DLX3 suppress
    osteoclastogenesis through microRNA-124 and NFATc1.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: osteoclast differentiation
    term:
      id: GO:0030316
      label: osteoclast differentiation
    modifier: DECREASED
  - preferred_term: bone resorption
    term:
      id: GO:0045453
      label: bone resorption
    modifier: DECREASED
  evidence:
  - reference: PMID:18996110
    reference_title: "In vivo impact of a 4 bp deletion mutation in the DLX3 gene on bone development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Osteoclastic differentiation capacities of bone marrow monocytes were reduced in TG mice in the presence of osteoclastogenic factors and the numbers of TRAP(+) osteoclasts on distal metaphyseal trabecular bone surfaces were significantly decreased."
    explanation: Reduced osteoclast differentiation and number in founder-allele transgenic mice.
  - reference: PMID:26836061
    reference_title: "DLX3 negatively regulates osteoclastic differentiation through microRNA-124."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results indicate that DLX3 negatively regulates osteoclastic differentiation through microRNA-124, which is partially responsible for the increased bone density in TDO patient."
    explanation: Cell-based mechanism for DLX3 suppression of osteoclastogenesis.
  downstream:
  - target: Increased Bone Mineral Density
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18996110
      reference_title: "In vivo impact of a 4 bp deletion mutation in the DLX3 gene on bone development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These data demonstrate that increased levels of IFN-gamma decrease osteoclast bone resorption activities, contributing to the enhanced trabecular bone volume and mineral density in these TG mice."
      explanation: Reduced resorption accounts for increased bone volume and density in the mouse model.
- name: Enhanced Osteoblast Lineage Commitment
  biological_scale: CELLULAR
  description: >-
    The founder allele pushes multipotent mesenchymal cells toward the
    osteoblast lineage and accelerates osteoblast maturation in vitro. This is
    not a uniform property of TDO alleles: Q178R patient-derived stromal cells
    show reduced osteogenic potential, and founder-allele transgenic mice show
    no increase in dynamic bone formation in vivo.
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: osteoblast differentiation
    term:
      id: GO:0001649
      label: osteoblast differentiation
    modifier: INCREASED
  evidence:
  - reference: PMID:17950683
    reference_title: "A 4 bp deletion mutation in DLX3 enhances osteoblastic differentiation and bone formation in vitro."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This DLX3 mutation also accelerates the differentiation of osteoprogenitor cells to osteoblasts at later stages of osteogenesis."
    explanation: The founder allele accelerates osteoblast differentiation in vitro.
  - reference: PMID:18996110
    reference_title: "In vivo impact of a 4 bp deletion mutation in the DLX3 gene on bone development."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "However, TG mice did not show enhanced dynamic bone formation rates in in vivo fluorochrome double labeling experiments."
    explanation: >-
      In vivo, the founder-allele transgenic mouse does not form bone faster,
      against enhanced osteoblast activity as the main cause of high bone mass.
  - reference: PMID:27924851
    reference_title: "Senescence: novel insight into DLX3 mutations leading to enhanced bone formation in Tricho-Dento-Osseous syndrome."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Here we show that the DLX3 mutation (c.533 A>G; Q178R) attenuates osteogenic potential and senescence of bone mesenchymal stem cells (BMSCs) isolated from a TDO patient"
    explanation: Patient-derived Q178R stromal cells show reduced, not enhanced, osteogenic potential.
  downstream:
  - target: Increased Bone Mineral Density
    causal_link_type: UNKNOWN
    description: >-
      Proposed from cell culture; the in vivo contribution is contested by the
      REFUTE items on this node.
- name: Delayed Osteoprogenitor Senescence
  biological_scale: CELLULAR
  description: >-
    TDO alleles delay senescence of bone marrow mesenchymal stem cells and
    pre-osteoblasts, extending their functional lifespan. This is proposed to
    reconcile reduced per-cell osteogenic potential with the high bone mass of
    TDO.
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  evidence:
  - reference: PMID:27924851
    reference_title: "Senescence: novel insight into DLX3 mutations leading to enhanced bone formation in Tricho-Dento-Osseous syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both DLX3 mutations (c.533 A>G and c.571_574delGGGG) delayed cellular senescence when they were introduced into pre-osteoblastic cells MC3T3-E1."
    explanation: Delayed senescence with two TDO alleles.
  downstream:
  - target: Increased Bone Mineral Density
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27924851
      reference_title: "Senescence: novel insight into DLX3 mutations leading to enhanced bone formation in Tricho-Dento-Osseous syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The delayed senescence of BMSCs leads to increased bone formation by compensating decreased osteogenic potentials with more generations and extended functional lifespan."
      explanation: Authors' model linking delayed senescence to increased bone formation.
- name: Hair Follicle Dysplasia
  biological_scale: TISSUE
  description: >-
    Abnormal hair-follicle differentiation is the presumed basis of the
    congenital kinky hair, by analogy with the follicular dysplasia found in a
    DLX3-mutant calf. In human TDO, scanning electron microscopy of hair shafts
    has not shown a consistent ultrastructural abnormality, and why the hair
    often straightens after infancy is unexplained.
  biological_processes:
  - preferred_term: hair follicle development
    term:
      id: GO:0001942
      label: hair follicle development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:28670783
    reference_title: "A de novo germline mutation of DLX3 in a Brown Swiss calf with tricho-dento-osseus-like syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Histological examination of skin biopsies was compatible with a follicular dysplasia."
    explanation: Follicular dysplasia in a DLX3-mutant calf with a kinky coat.
  - reference: PMID:8028872
    reference_title: "Tricho-dento-osseous syndrome. Features of the hair and teeth."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "This study indicates that although hair with tricho-dento-osseous syndrome often is clinically curly, it can be straight, and it does not appear to have unique ultrastructural features that are of diagnostic benefit."
    explanation: Human TDO hair shafts showed no distinctive ultrastructure in this small sample.
  downstream:
  - target: Curly Hair at Birth
    causal_link_type: UNKNOWN
    description: Inferred from co-occurrence in the calf; not demonstrated in human TDO.

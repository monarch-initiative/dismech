diagnosis:
- name: Lymphocyte Subset Immunophenotyping
  description: >
    Flow cytometric enumeration of NK cells is the entry point: a profoundly
    reduced NK count in a child with intrauterine growth retardation and
    chronic neutropenia is the syndrome's recognisable signature, and the
    pairing is the discriminating feature.
  evidence:
  - reference: PMID:28414293
    reference_title: "Inherited GINS1 deficiency underlies growth retardation along with neutropenia and NK cell deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The association of neutropenia and NK cell deficiency, which is unusual among primary immunodeficiencies and bone marrow failures, was due to a blockade in the bone marrow and was mildly symptomatic."
    explanation: >
      The unusual pairing of neutropenia with NK cell deficiency is what makes
      the combined immunophenotype diagnostically informative.

- name: Bone Marrow Examination
  description: >
    Marrow analysis distinguishes a central maturation blockade from
    peripheral consumption and shows the dysplastic changes reported in
    several patients.
  evidence:
  - reference: PMID:28414293
    reference_title: "Inherited GINS1 deficiency underlies growth retardation along with neutropenia and NK cell deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myelodysplasia was documented in bone marrow analysis."
    explanation: >
      Marrow examination is what demonstrated the dysplastic changes underlying
      the peripheral cytopenias.

- name: Molecular Genetic Testing of GINS1
  description: >
    Confirmatory. Biallelic GINS1 variants establish the diagnosis; because
    complete loss of function is lethal, a plausible genotype must retain
    residual activity on at least one allele.
  evidence:
  - reference: PMID:28414293
    reference_title: "Inherited GINS1 deficiency underlies growth retardation along with neutropenia and NK cell deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We discovered compound heterozygous rare mutations in Go-Ichi-Ni-San (GINS) complex subunit 1 (GINS1, also known as PSF1) in the 5 patients."
    explanation: >
      Biallelic GINS1 variants are the molecular diagnostic criterion.


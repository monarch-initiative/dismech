genetic:
- name: GINS1
  gene_term:
    preferred_term: GINS1
    term:
      id: hgnc:28980
      label: GINS1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  review_notes: >-
    `relationship_type: CAUSATIVE` is recorded here with a caveat. The
    schema's own definition of CAUSATIVE corresponds to ClinGen "Definitive"
    or "Strong" gene-disease validity, and the 2026 review states that
    interpretations of implicated variants remain conflicting and that there
    is a lack of consensus around the role of GINS1 in disease. The
    justification for CAUSATIVE rather than DISPUTED or UNKNOWN is the
    functional evidence: patient-fibroblast phenotypes rescued by wild-type
    GINS1, which is ACMG PS3-level support. The honest label would be
    somewhere around ClinGen "Moderate" or "Limited", and
    `GeneDiseaseRelationshipEnum` has no value between CAUSATIVE
    (Definitive/Strong) and DISPUTED (Disputed/Refuted) to carry that.
  notes: >
    GINS1 (also known as PSF1) encodes one of the four subunits of the GINS
    complex, which together with CDC45 and the MCM2-7 hexamer forms the CMG
    replicative helicase. All five reported patients are compound
    heterozygotes. Complete biallelic loss is not represented among patients
    and is not expected to be: homozygous null mutations of GINS
    component-encoding genes are embryonic lethal in mice. The measured
    residual activity of 3-16% is therefore the disease-relevant quantity, and
    it behaves differently toward the two clinical arms - grading growth
    retardation and the cellular phenotype, but not the immune phenotype.
  evidence:
  - reference: PMID:28414293
    reference_title: "Inherited GINS1 deficiency underlies growth retardation along with neutropenia and NK cell deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We discovered compound heterozygous rare mutations in Go-Ichi-Ni-San (GINS) complex subunit 1 (GINS1, also known as PSF1) in the 5 patients."
    explanation: >
      Establishes GINS1 as the causal gene and the compound heterozygous
      allelic architecture.
  - reference: PMID:28414293
    reference_title: "Inherited GINS1 deficiency underlies growth retardation along with neutropenia and NK cell deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The residual levels of GINS1 activity reached 3% to 16% in patients' cells, depending on their GINS1 genotype, and correlated with the severity of growth retardation and the in vitro cellular phenotype."
    explanation: >
      Quantifies the hypomorphic residual activity and its genotype
      dependence.


name: Combined Immunodeficiency Due To GINS1 Deficiency
creation_date: "2026-08-30T18:30:00Z"
category: Mendelian
disease_term:
  preferred_term: combined immunodeficiency due to GINS1 deficiency
  term:
    id: MONDO:0044725
    label: combined immunodeficiency due to GINS1 deficiency
description: >
  Combined immunodeficiency due to GINS1 deficiency (IMD55; OMIM 617827) is an
  ultra-rare autosomal recessive inborn error of immunity caused by biallelic
  hypomorphic variants in GINS1 (also called PSF1), one of the four subunits of
  the GINS complex within the eukaryotic CMG (CDC45-MCM2-7-GINS) replicative
  helicase. The disorder was defined in a single 2017 report of five patients
  from four kindreds, every one of whom showed the same triad of intrauterine
  growth retardation, chronic neutropenia and natural killer (NK) cell
  deficiency. Because complete loss of a GINS subunit is embryonic lethal, all
  disease alleles are partial: patient cells retain roughly 3-16% of normal
  GINS1 activity. That residual activity is not enough for normal replication,
  and patient fibroblasts show impaired GINS complex assembly, basal
  replication stress, impaired checkpoint signalling, defective cell cycle
  control and genomic instability, all rescued by wild-type GINS1.

  Two features make this entry mechanistically interesting rather than merely
  another replication-defect syndrome. First, the haematological lesion is a
  maturation blockade inside the bone marrow rather than peripheral
  destruction, and it falls on two lineages - granulocytes and NK cells - whose
  co-occurrence is described in the source as unusual among primary
  immunodeficiencies and bone marrow failures. Second, the amount of residual
  GINS1 activity tracks the severity of growth retardation and the in vitro
  cellular phenotype but does not track the immunological phenotype, which was
  uniform across genotypes. A single quantitative molecular defect therefore
  produces one dose-dependent arm and one apparently thresholded arm, which is
  the central open question of the entry.

  GINS1 sits alongside MCM4, MCM10 and GINS4 as CMG-helicase components in
  which biallelic hypomorphic variants cause human NK cell deficiency.

synonyms:
  - IMD55
  - immunodeficiency 55
  - CID due to GINS1 deficiency
  - GINS1 deficiency
  - combined immunodeficiency with intrauterine growth retardation-NK cell deficiency-neutropenia

parents:
  - Inborn error of immunity
  - Natural killer cell deficiency
  - Combined immunodeficiency

classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    evidence:
    - reference: PMID:36809597
      reference_title: "Unwinding the Role of the CMG Helicase in Inborn Errors of Immunity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Though rare, the deficiency of several genes has been described as underlying causes of NKD, including MCM4, GINS1, MCM10, and GINS4, all of which are involved in the eukaryotic CMG helicase."
      explanation: >
        Places GINS1 deficiency among the inborn errors of immunity that cause
        NK cell deficiency, which is Harrison's immune/rheumatologic Part.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:28414293
      reference_title: "Inherited GINS1 deficiency underlies growth retardation along with neutropenia and NK cell deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We discovered compound heterozygous rare mutations in Go-Ichi-Ni-San (GINS) complex subunit 1 (GINS1, also known as PSF1) in the 5 patients."
      explanation: >
        A biallelic Mendelian disorder defined by compound heterozygous GINS1
        variants, placing it in Harrison's genetics Part.
  iuis_category:
    classification_value: innate immunity defect
    notes: >-
      Grouped with MCM4, MCM10 and GINS4 as CMG-helicase causes of NK cell
      deficiency, an innate-immunity defect. Note the tension with the MONDO
      label and the OMIM title, both of which call this a *combined*
      immunodeficiency: the T-cell compartment is measurably affected (low
      CD8+ T cells in early childhood in the two patients tested, slightly
      reduced in vitro T-cell proliferation in all patients), so the
      combined-immunodeficiency label is not simply wrong. The IUIS placement
      here reflects which lineage carries the defining and most consistent
      lesion, not a claim that T cells are spared.
    evidence:
    - reference: PMID:36809597
      reference_title: "Unwinding the Role of the CMG Helicase in Inborn Errors of Immunity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Natural killer cell deficiency (NKD) is one such IEI where natural killer (NK) cells are the main immune lineage affected."
      explanation: >-
        Frames NKD as an inborn error of immunity acting principally on an
        innate effector lineage, which is the basis for the IUIS innate/intrinsic
        immunity assignment.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    All five reported patients carry compound heterozygous GINS1 variants;
    parents are obligate heterozygous carriers and are unaffected.
  evidence:
  - reference: PMID:28414293
    reference_title: "Inherited GINS1 deficiency underlies growth retardation along with neutropenia and NK cell deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal recessive, partial GINS1 deficiency impairs DNA replication and underlies intra-uterine (and postnatal) growth retardation, chronic neutropenia, and NK cell deficiency."
    explanation: >
      States the inheritance mode and the partial (hypomorphic) nature of the
      biallelic defect directly.

notes: >
  Ultra-rare. The disease-defining series is five patients from four kindreds
  (Cottineau et al., J Clin Invest 2017); a 2026 review (Mackley et al., Clin
  Genet) puts the total published cohort at nine individuals. Numbers
  throughout this entry are therefore counts out of five or out of nine, never
  frequencies, and every `frequency` value is left unset rather than computed
  from a cohort this small. Where a claim comes from the 2017 series the
  denominator is five; where it comes from the 2026 review it is nine. Individual
  patients also carried findings that are almost certainly not part of the
  core syndrome (osteosarcoma in P2, glaucoma in P5); these are recorded with
  that caveat rather than presented as disease features.

  No `conforms_to` was declared. The obvious candidate module,
  `genomic_instability_aging`, is explicitly framed for the aging process and
  its natural conformers are the DNA-repair-deficiency progeroid syndromes;
  GINS1 deficiency is a constitutional replication-initiation defect whose
  output is a developmental and haematopoietic maturation failure, not
  age-dependent damage accumulation. Forcing conformance would have asserted a
  chain the source does not support. If a replication-stress module facing
  development rather than aging is ever created, this entry and IMD80 (MCM10)
  are its first two conformers.

pathophysiology:
- name: Biallelic Hypomorphic GINS1 Variants
  biological_scale: MOLECULAR
  description: >
    Compound heterozygous GINS1 variants reduce, but never abolish, functional
    GINS1 protein. Complete loss is not a possible disease state: homozygous
    null mutations of GINS component-encoding genes are embryonic lethal in
    mice, so every viable patient genotype is a partial one.
  genes:
  - preferred_term: GINS1
    term:
      id: hgnc:28980
      label: GINS1
    modifier: DECREASED
  genetic_context:
    description: >-
      Compound heterozygous hypomorphic GINS1 alleles retaining 3-16% of
      normal activity. Complete biallelic loss is not represented among
      patients and is expected to be embryonic lethal, so the disease state
      is necessarily partial rather than complete loss of function.
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  biological_processes:
  - preferred_term: DNA replication initiation
    modifier: DECREASED
    term:
      id: GO:0006270
      label: DNA replication initiation
  evidence:
  - reference: PMID:28414293
    reference_title: "Inherited GINS1 deficiency underlies growth retardation along with neutropenia and NK cell deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We discovered compound heterozygous rare mutations in Go-Ichi-Ni-San (GINS) complex subunit 1 (GINS1, also known as PSF1) in the 5 patients."
    explanation: >
      Establishes the causal genotype shared by all five reported patients.
  - reference: PMID:28414293
    reference_title: "Inherited GINS1 deficiency underlies growth retardation along with neutropenia and NK cell deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The GINS complex is essential for eukaryotic DNA replication, and homozygous null mutations of GINS component-encoding genes are embryonic lethal in mice."
    explanation: >
      Mouse null data establish why only hypomorphic alleles are compatible
      with life, which is why this node is a partial rather than complete
      loss of function.
  downstream:
  - target: Impaired GINS/CMG Replicative Helicase Assembly
    description: Reduced GINS1 protein cannot support normal assembly of the GINS complex.

- name: Impaired GINS/CMG Replicative Helicase Assembly
  biological_scale: MOLECULAR
  description: >
    Patient fibroblasts assemble the GINS complex poorly. Residual GINS1
    activity in patient cells was quantified at roughly 3% to 16% of normal
    and varied with genotype. Because GINS is one of the three modules of the
    CMG helicase, defective GINS assembly translates directly into reduced
    replicative helicase availability at origins.
  molecular_functions:
  - preferred_term: DNA replication origin binding
    modifier: DECREASED
    term:
      id: GO:0003688
      label: DNA replication origin binding
  evidence:
  - reference: PMID:28414293
    reference_title: "Inherited GINS1 deficiency underlies growth retardation along with neutropenia and NK cell deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The patients' fibroblasts displayed impaired GINS complex assembly, basal replication stress, impaired checkpoint signaling, defective cell cycle control, and genomic instability, which was rescued by WT GINS1."
    explanation: >
      Direct patient-cell demonstration of defective GINS assembly, with
      wild-type rescue establishing that GINS1 is the responsible component.
  - reference: PMID:28414293
    reference_title: "Inherited GINS1 deficiency underlies growth retardation along with neutropenia and NK cell deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The residual levels of GINS1 activity reached 3% to 16% in patients' cells, depending on their GINS1 genotype, and correlated with the severity of growth retardation and the in vitro cellular phenotype."
    explanation: >
      Quantifies the residual activity of the hypomorphic alleles and
      establishes a dose-response relationship with the cellular phenotype.
  - reference: PMID:36809597
    reference_title: "Unwinding the Role of the CMG Helicase in Inborn Errors of Immunity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The CMG helicase is composed of 11 subunits of the CDC45-MCM-GINS complexes (12) and is responsible for unwinding double-stranded DNA and recruiting polymerases for DNA replication"
    explanation: >
      Establishes GINS as a constituent module of the CMG helicase, which is
      why a GINS1 defect is a replicative helicase defect.
  downstream:
  - target: Replication Stress with Impaired Checkpoint Signaling
    description: Reduced CMG helicase availability stalls and slows replication forks.

- name: Replication Stress with Impaired Checkpoint Signaling
  biological_scale: CELLULAR
  description: >
    Patient cells carry basal replication stress together with impaired
    checkpoint signalling. The combination matters: a cell under replication
    stress that can still signal the checkpoint arrests and repairs, whereas
    one that cannot signal proceeds through the cycle carrying unresolved
    replication problems. It is this second state that converts a quantitative
    shortage of helicase into genomic damage.
  biological_processes:
  - preferred_term: DNA replication checkpoint signaling
    modifier: DECREASED
    term:
      id: GO:0000076
      label: DNA replication checkpoint signaling
  - preferred_term: cellular response to DNA damage stimulus
    modifier: INCREASED
    term:
      id: GO:0006974
      label: DNA damage response
  evidence:
  - reference: PMID:28414293
    reference_title: "Inherited GINS1 deficiency underlies growth retardation along with neutropenia and NK cell deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The patients' fibroblasts displayed impaired GINS complex assembly, basal replication stress, impaired checkpoint signaling, defective cell cycle control, and genomic instability, which was rescued by WT GINS1."
    explanation: >
      Reports basal replication stress and impaired checkpoint signalling as
      co-occurring cellular phenotypes in patient fibroblasts.
  - reference: PMID:36809597
    reference_title: "Unwinding the Role of the CMG Helicase in Inborn Errors of Immunity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Replication stress, DNA damage, and cell cycle arrest are among the cellular phenotypes attributed to loss of function variants in CMG helicase proteins."
    explanation: >
      Generalizes replication stress and DNA damage as the shared cellular
      consequence across CMG helicase inborn errors, of which GINS1 is one.
  downstream:
  - target: Defective Cell Cycle Control and Genomic Instability
    description: Unchecked replication stress propagates into cycle dysregulation and DNA damage.

- name: Defective Cell Cycle Control and Genomic Instability
  biological_scale: CELLULAR
  description: >
    Patient fibroblasts show defective cell cycle control and genomic
    instability, both rescued by wild-type GINS1. The functional cost of this
    state is borne disproportionately by cell types that must undergo rapid
    proliferative expansion, which is the link to both the growth and the
    haematopoietic arms of the disease.
  biological_processes:
  - preferred_term: cell cycle checkpoint signaling
    modifier: DECREASED
    term:
      id: GO:0000075
      label: cell cycle checkpoint signaling
  evidence:
  - reference: PMID:28414293
    reference_title: "Inherited GINS1 deficiency underlies growth retardation along with neutropenia and NK cell deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The patients' fibroblasts displayed impaired GINS complex assembly, basal replication stress, impaired checkpoint signaling, defective cell cycle control, and genomic instability, which was rescued by WT GINS1."
    explanation: >
      Reports defective cell cycle control and genomic instability in patient
      cells, with wild-type GINS1 rescue confirming causality.
  downstream:
  - target: Bone Marrow Maturation Blockade of Granulocyte and NK Lineages
    description: >
      Proliferation-dependent haematopoietic maturation fails, producing the
      combined neutropenia and NK cell deficiency.
  - target: Restricted Somatic Growth
    description: >
      Reduced proliferative capacity across somatic tissues restricts intrauterine
      and postnatal growth, in a manner graded by residual GINS1 activity.

- name: Bone Marrow Maturation Blockade of Granulocyte and NK Lineages
  biological_scale: TISSUE
  description: >
    The neutropenia and the NK cell deficiency are both central, not
    peripheral: the source locates the defect as a blockade in the bone
    marrow. This is the entry's defining lesion, and the co-occurrence of
    these two particular lineages is explicitly noted as unusual among primary
    immunodeficiencies and bone marrow failures.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:
  - preferred_term: myeloid cell differentiation
    modifier: DECREASED
    term:
      id: GO:0030099
      label: myeloid cell differentiation
  evidence:
  - reference: PMID:28414293
    reference_title: "Inherited GINS1 deficiency underlies growth retardation along with neutropenia and NK cell deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The association of neutropenia and NK cell deficiency, which is unusual among primary immunodeficiencies and bone marrow failures, was due to a blockade in the bone marrow and was mildly symptomatic."
    explanation: >
      Locates the lesion in the bone marrow rather than the periphery, and
      records the unusual pairing of the two affected lineages.
  downstream:
  - target: Impaired NK Cell Differentiation
    description: The marrow blockade removes the NK lineage's developmental output.

- name: Impaired NK Cell Differentiation
  biological_scale: CELLULAR
  description: >
    NK cells are disproportionately affected relative to other lymphoid
    lineages, a pattern shared across the CMG-helicase immunodeficiencies.
    Why remains unresolved; the review literature states plainly that the
    reason has not been elucidated. Two hypotheses raised in the source are
    that pre-BCR/pre-TCR signalling gives developing B and T cells a
    proliferative rescue that innate lymphoid precursors lack, and that
    DNA-integrity machinery may simply be regulated differently in lineages
    that do not undergo antigen-receptor rearrangement.
  cell_types:
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  biological_processes:
  - preferred_term: natural killer cell differentiation
    modifier: DECREASED
    term:
      id: GO:0001779
      label: natural killer cell differentiation
  evidence:
  - reference: PMID:36809597
    reference_title: "Unwinding the Role of the CMG Helicase in Inborn Errors of Immunity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Specifically, NKD due to helicase variants manifests as impaired NK cell differentiation and maturation leading to significant functional impairment and resulting viral infections in affected individuals"
    explanation: >
      States the shared NK differentiation lesion across the CMG helicase
      immunodeficiencies, GINS1 among them.
  - reference: PMID:36809597
    reference_title: "Unwinding the Role of the CMG Helicase in Inborn Errors of Immunity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CMG helicase function is required in any actively proliferating cell, and the reason why NK cells are seemingly particularly susceptible to damaging variants has not been elucidated."
    explanation: >
      Records explicitly that the lineage selectivity of this mechanism is
      unexplained, which is the substance of the knowledge gap below.
  downstream:
  - target: Susceptibility to Herpesvirus and Other Viral Infection
    description: Loss of NK effector output impairs control of herpesviruses in particular.

- name: Susceptibility to Herpesvirus and Other Viral Infection
  biological_scale: ORGANISM
  description: >
    The clinical consequence of NK deficiency is disproportionate difficulty
    controlling herpesviruses, whose principal immune-evasion strategy -
    downregulating HLA class I - is precisely what renders an infected cell
    visible to NK cells. Reported patients had prolonged acute CMV and
    varicella zoster infections, severe necrotizing varicella, and recurrent
    herpes simplex episodes.
  evidence:
  - reference: PMID:36809597
    reference_title: "Unwinding the Role of the CMG Helicase in Inborn Errors of Immunity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is thought that herpes viruses act to evade cytotoxic T lymphocyte responses primarily by downregulating HLA-I expression in infected host cells, which consequently renders them susceptible to killing by natural killer cells"
    explanation: >
      Gives the immunological reason why NK deficiency produces a
      herpesvirus-weighted rather than a general infection susceptibility.

- name: Restricted Somatic Growth
  biological_scale: ORGANISM
  description: >
    Growth restriction begins in utero and in most patients continues after
    birth. Unlike the immunological arm, this arm is dose-dependent: severity
    tracked the residual GINS1 activity measured in patient cells. In one
    patient the growth failure was refractory to enteral, parenteral and
    growth hormone support, indicating a cell-intrinsic proliferative limit
    rather than a nutritional deficit.
  evidence:
  - reference: PMID:28414293
    reference_title: "Inherited GINS1 deficiency underlies growth retardation along with neutropenia and NK cell deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The residual levels of GINS1 activity reached 3% to 16% in patients' cells, depending on their GINS1 genotype, and correlated with the severity of growth retardation and the in vitro cellular phenotype."
    explanation: >
      Establishes the dose-dependence of the growth arm on residual GINS1
      activity, in contrast to the immunological arm. Graded IN_VITRO because
      the quoted measurement is made in patient-derived cells; the clinical
      growth phenotype it is correlated against is reported elsewhere.

mechanistic_hypotheses:
- hypothesis_group_id: lineage_selective_replication_failure
  hypothesis_label: NK and granulocyte lineages are selectively vulnerable to partial CMG helicase loss
  status: EMERGING
  description: >
    A single, uniform quantitative defect in replicative helicase assembly
    produces a strikingly non-uniform cellular outcome, sparing T and B
    lymphocyte numbers largely while removing NK cells and blocking
    granulopoiesis. The proposed explanations are that antigen-receptor-driven
    proliferative signals (pre-BCR, pre-TCR) rescue adaptive lineages that
    innate lymphoid precursors cannot access, and that DNA-integrity control
    may be wired differently in lineages that do not perform programmed
    DNA breakage. Neither has been demonstrated.

discussions:
- discussion_id: gins1_nk_lineage_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired NK Cell Differentiation
  prompt: >-
    Why does a ubiquitous, quantitatively uniform defect in replicative
    helicase assembly selectively remove the NK lineage while largely sparing
    T and B cell numbers?
  rationale: >-
    Every cell in the body needs the CMG helicase, and the defect is present
    in every cell, yet the immune lesion is lineage-restricted. Until this is
    explained, the causal edge from the cellular replication phenotype to the
    NK phenotype is a correlation observed across four genes (MCM4, GINS1,
    MCM10, GINS4) rather than a mechanism. The review literature states the
    question is unresolved.
  evidence:
  - reference: PMID:36809597
    reference_title: "Unwinding the Role of the CMG Helicase in Inborn Errors of Immunity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CMG helicase function is required in any actively proliferating cell, and the reason why NK cells are seemingly particularly susceptible to damaging variants has not been elucidated."
    explanation: >-
      The source states directly that the lineage selectivity is unexplained.

- discussion_id: gins1_activity_phenotype_dissociation
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired GINS/CMG Replicative Helicase Assembly
  - pathophysiology#Restricted Somatic Growth
  prompt: >-
    Why does residual GINS1 activity grade the growth phenotype but not the
    immunological phenotype?
  rationale: >-
    The same measurement (3-16% residual activity) correlates with growth
    retardation severity and with the in vitro cellular phenotype, yet the
    immunological phenotype was uniform across genotypes. Either the immune
    lineages sit below a threshold that even the mildest allele fails to
    clear, or the immune arm is driven by something other than bulk residual
    activity. Distinguishing these would need patients with milder alleles
    than any so far reported, and with n=5 the observed uniformity is also
    consistent with the series simply being too small to resolve a gradient.
  evidence:
  - reference: PMID:28414293
    reference_title: "Inherited GINS1 deficiency underlies growth retardation along with neutropenia and NK cell deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The levels of GINS1 activity did not influence the immunological phenotype, which was uniform."
    explanation: >-
      States the dissociation between residual enzyme activity and the immune
      phenotype that this gap is about.

- discussion_id: gins1_gene_disease_validity_consensus
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#GINS1
  prompt: >-
    Is the GINS1 gene-disease relationship established at ClinGen
    "Definitive"/"Strong" level, or only at "Moderate"/"Limited"?
  rationale: >-
    Nine published individuals, no ClinGen gene-disease validity assertion,
    and a 2026 review stating explicitly that variant interpretations remain
    conflicting. The functional rescue data are strong for the individual
    alleles, but allele-level functional evidence and gene-level validity are
    different claims. This entry records CAUSATIVE because the alternatives in
    the controlled vocabulary (DISPUTED, UNKNOWN) would misstate the evidence
    more badly, not because Definitive/Strong has been demonstrated.
  evidence:
  - reference: PMID:41689265
    reference_title: "Expanding Phenotype of GINS1 Deficiency: A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "interpretations of implicated variants remain conflicting, demonstrating a lack of consensus around the role of GINS1 in disease"
    explanation: >-
      States that the gene-disease relationship itself is not settled, which
      is what this gap is about.


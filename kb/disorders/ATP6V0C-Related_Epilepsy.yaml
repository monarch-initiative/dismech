    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We describe heterozygous point variants in ATP6V0C, encoding the c-subunit in the membrane bound integral domain of the vacuolar H+-ATPase, in 27 patients with neurodevelopmental abnormalities with or without epilepsy.
    explanation: Defines the founding neurodevelopmental spectrum.
- name: Dravet-like developmental and epileptic encephalopathy
  description: Two adult men had infantile febrile seizures followed by multiple afebrile seizure types and status epilepticus, severe intellectual disability, autism and motor abnormalities. Development plateaued around age four without reported regression.
  evidence:
  - reference: PMID:40085430
    reference_title: Variants in ATP6V0C are associated with Dravet-like developmental and epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

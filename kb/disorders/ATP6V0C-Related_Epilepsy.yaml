- name: Caenorhabditis elegans homozygous patient-equivalent knock-ins
  species: Nematode (Caenorhabditis elegans)
  genotype: 'CRISPR–Cas9 knock-ins: vha-3 G69A (human G63A), vha-2 F143L (human F137L), vha-3 L156F (human L150F); homozygous'
  publication: PMID:36074901
  description: >-
    Homozygous ortholog knock-ins reduced body size and lifespan and increased age-associated paralysis. Day-one movement in physiological M9 was normal; osmotic stress exposed variant-dependent motor abnormalities. A fourth A95T-equivalent homozygous line was sterile and excluded from subsequent assays. Aldicarb hypersensitivity supports altered synaptic signaling without resolving whether acetylcholine or GABA signaling is primarily affected.

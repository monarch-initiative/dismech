  - target: ATP6V0C Heterozygous Variant
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Patient-equivalent substitutions impair organismal function in homozygous worm orthologues.
    limitations: >-
      The human disorder is heterozygous; these are homozygous ortholog knock-ins. Growth, lifespan, motility and aldicarb paralysis are indirect readouts, not measurements of human epilepsy, neuronal transmitter cargo or selective inhibitory release.
    evidence:
    - reference: PMID:36074901
      reference_title: "ATP6V0C variants impair V-ATPase function causing a neurodevelopmental disorder often associated with epilepsy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the expression of selected patient variants in Caenorhabditis elegans led to reduced growth, motor dysfunction and reduced lifespan"
      explanation: >-
        In vivo expression of patient variants is deleterious.
    - reference: PMID:36074901
      reference_title: ATP6V0C variants impair V-ATPase function causing a neurodevelopmental disorder often associated with epilepsy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Mutations were knocked-in via CRISPR–Cas9, and homozygous worms were studied.
      explanation: Methods establish the knock-in design and zygosity.
    - reference: PMID:36074901

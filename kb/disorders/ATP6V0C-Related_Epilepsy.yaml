- name: Impaired Synaptic Vesicle Acidification and Neurotransmitter Loading
  description: >-
    The synaptic-vesicle-cycle step specific to this disorder. The proton
    electrochemical gradient generated by the vesicular V-ATPase drives the
    vesicular transporters that fill vesicles with neurotransmitter, so a reduced
    gradient is expected to underfill vesicles. The synaptic_vesicle_cycle module
    has no loading node; its protein deficiency node, which names neurotransmitter
    loading in its scope, is matched by the variant node above.
  biological_scale: CELLULAR

    directness: DIRECT
    snippet: The identification of P/LP ATP6V0C variants in two unrelated adult patients with typical DS-like phenotype expands the clinical spectrum of ATP6V0C-associated epilepsy to include DS-like DEE.
    explanation: Two adult cases establish a severe presentation without implying that all ATP6V0C-related epilepsy is Dravet-like.
  - reference: PMID:40085430
    reference_title: Variants in ATP6V0C are associated with Dravet-like developmental and epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Normal early development, followed by development delay and plateau around age 4 years, without regression.
    explanation: The longitudinal report distinguishes plateau from regression.
diagnosis:
- name: Molecular diagnosis and segregation analysis
  description: Trio exome sequencing identified the causal or likely causal ATP6V0C variants in the two adult Dravet-like cases; chromosomal microarray excluded copy-number alternatives. Familial presentations were investigated by exome sequencing and segregation testing. Interpretation integrates variant evidence and phenotype rather than diagnosing from fever sensitivity or a VUS alone.
  evidence:
  - reference: PMID:40085430
    reference_title: Variants in ATP6V0C are associated with Dravet-like developmental and epileptic encephalopathy.
    supports: SUPPORT

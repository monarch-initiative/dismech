      snippet: One patient variant (p.F137L) showed levels of fluorescence intensity that were comparable to wild-type rescue.
      explanation: The fluorescence readout was not abnormal for every patient-equivalent variant.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Yeast vacuoles are not human synaptic vesicles. Null complementation does not reproduce heterozygous wild-type/mutant coexpression or establish dominant-negative action; LysoSensor is an indirect readout of pump function.

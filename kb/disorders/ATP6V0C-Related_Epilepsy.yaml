    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that abnormal ATP6V0C function can, at the severe end of the clinical spectrum, be associated with Dravet-like phenotype."
    explanation: >-
      Two adults with clinically classic Dravet syndrome carried de novo ATP6V0C
      variants.

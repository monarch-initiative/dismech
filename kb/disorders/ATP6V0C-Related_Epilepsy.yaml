      label: Dravet syndrome
  description: >-
    The severe end of ATP6V0C-related epilepsy can meet clinical criteria for
    Dravet syndrome. The distinction matters for treatment, because SCN1A-directed
    therapies do not apply.
  distinguishing_features:
  - A pathogenic ATP6V0C variant with no SCN1A variant favors this disorder.

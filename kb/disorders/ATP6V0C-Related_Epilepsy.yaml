discussions:
- discussion_id: atp6v0c_cellular_routes
  prompt: Which cellular defects connect ATP6V0C dysfunction to neurodevelopmental impairment and epilepsy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced V-ATPase Proton Pumping
  rationale: The founding study proposes combined effects on synaptic signaling, trans-Golgi trafficking and lysosomal/autophagic function. Evidence from other V-ATPase genes motivates these possibilities but does not establish the corresponding pathway defects in ATP6V0C patient neurons. Worm aldicarb sensitivity cannot by itself distinguish GABA from acetylcholine dysfunction. Direct cellular measurements would be needed to resolve the relative contributions.
  evidence:
  - reference: PMID:36074901
    reference_title: ATP6V0C variants impair V-ATPase function causing a neurodevelopmental disorder often associated with epilepsy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: We hypothesize that the epilepsy and other neurodevelopmental phenotypes seen in patients with pathogenic V-ATPase variants may be due to a combinatorial effect of impaired synaptic signalling, trafficking and sorting of various membrane bound proteins, and defects along the endomembrane system including the lysosomal/autophagy degradation pathway.
    explanation: The authors explicitly frame these cellular routes as a hypothesis.
prevalence:
- population: 'ATP6V0C-related neurodevelopmental disorder: ascertainment context of the Mattison 2023 report'
  measure_type: UNKNOWN
  notes: The founding report raised under-ascertainment because ATP6V0C was absent from commercial epilepsy/intellectual-disability panels at that time. This is a historical testing caveat, not a claim about current panel content or a quantitative prevalence estimate.
  evidence:
  - reference: PMID:36074901
    reference_title: ATP6V0C variants impair V-ATPase function causing a neurodevelopmental disorder often associated with epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The prevalence of neurodevelopmental disorders, including epilepsy, resulting from variants in ATP6V0C is probably underestimated as this gene, to the best of our knowledge, is not currently included on commercially available epilepsy or intellectual disability gene panels.
    explanation: Study-era ascertainment limitation; no numerical population prevalence follows from it.

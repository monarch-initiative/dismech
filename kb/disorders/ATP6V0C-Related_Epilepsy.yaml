    Treatment evidence is limited to individual cases and small series. One mild familial proband became seizure-free on valproate; another became seizure-free after lamotrigine was added to valproate and nitrazepam. In the adult Dravet-like report, patient 1 improved after switching carbamazepine/phenytoin to valproate, while patient 2 still had monthly seizures on valproate, levetiracetam and lamotrigine and had worsened during a zonisamide trial. These observations do not establish a preferred regimen or general drug contraindications.

- name: Familial febrile seizures and epilepsy with febrile seizures plus
  description: 'A reported mild presentation, rather than a separate molecular subtype: six affected members of two families had infantile febrile seizures and normal development; the two probands also developed afebrile seizures.'
  evidence:
  - reference: PMID:35600075
    reference_title: ATP6V0C Is Associated With Febrile Seizures and Epilepsy With Febrile Seizures Plus.

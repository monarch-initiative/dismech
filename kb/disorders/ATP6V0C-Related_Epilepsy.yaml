name: ATP6V0C-Related Epilepsy
creation_date: "2026-10-01T00:00:00Z"
description: >-
  An early-onset epilepsy and neurodevelopmental disorder caused by heterozygous,
  usually de novo, variants in ATP6V0C, which encodes the c subunit of the
  membrane-embedded V0 domain of the vacuolar H+-ATPase (V-ATPase). The c subunits
  form the proteolipid ring through which the pump translocates protons, and on
  synaptic vesicles that proton gradient drives neurotransmitter loading. The
  phenotype is a spectrum: at the mild end, familial febrile seizures and epilepsy
  with febrile seizures plus with normal development; most reported individuals
  have developmental delay, intellectual disability and seizures beginning in the
  first two years of life, frequently fever-sensitive; at the severe end, a
  Dravet-like developmental and epileptic encephalopathy. Corpus callosum
  hypoplasia and cardiac abnormalities occur in a minority. ATP6V0C is also
  the gene thought to drive the neurodevelopmental phenotype of 16p13.3
  microdeletions that remove it together with TBC1D24 and PDPK1.
category: Mendelian
parents:
- Epilepsy
- Neurodevelopmental Disorder
synonyms:
- ATP6V0C-related neurodevelopmental disorder
- ATP6V0C deficiency
disease_term:
  preferred_term: epilepsy, early-onset, 3, with or without developmental delay
  term:
    id: MONDO:0958196
    label: epilepsy, early-onset, 3, with or without developmental delay
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    Several dozen individuals are reported, the largest series being 27 patients.
    The founding cohort study judges the true frequency to be underestimated
    because the gene was absent from commercial epilepsy and intellectual
    disability panels when it was described.
  evidence:
  - reference: PMID:36074901
    reference_title: "ATP6V0C variants impair V-ATPase function causing a neurodevelopmental disorder often associated with epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of neurodevelopmental disorders, including epilepsy, resulting from variants in ATP6V0C is probably underestimated as this gene, to the best of our knowledge, is not currently included on commercially available epilepsy or intellectual disability gene panels."
    explanation: >-
      Records that no population prevalence exists and that ascertainment is
      likely incomplete.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous variants act dominantly. Most arise de novo, with somatic
    mosaicism in a few probands; in milder fever-associated families the variant
    cosegregates with affected relatives.
  evidence:
  - reference: PMID:36074901
    reference_title: "ATP6V0C variants impair V-ATPase function causing a neurodevelopmental disorder often associated with epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Second, in 24 patients where biologic parent DNA was available, the variants were found to have occurred de novo."
    explanation: >-
      De novo occurrence of heterozygous variants in every tested trio of the
      founding cohort supports dominant action.
  - reference: PMID:35600075
    reference_title: "ATP6V0C Is Associated With Febrile Seizures and Epilepsy With Febrile Seizures Plus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified two heterozygous ATP6V0C mutations that co-segregated with the disease in two unrelated families with six individuals affected."
    explanation: >-
      Cosegregation of heterozygous variants with febrile seizures in two
      pedigrees shows familial dominant transmission at the mild end.
  - reference: PMID:36074901
    reference_title: "ATP6V0C variants impair V-ATPase function causing a neurodevelopmental disorder often associated with epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients 4, 9, 15 and 19 were each found to be mosaic for their identified ATP6V0C variant."
    explanation: >-
      Four of 27 founding-cohort patients carry their variant in mosaic form.
mechanistic_hypotheses:
- hypothesis_group_id: vesicle_loading_deficit
  hypothesis_label: >-
    Reduced V-ATPase pumping underfills synaptic vesicles and lowers transmitter
    release
  status: EMERGING
  description: >-
    Patient variants reduce V-ATPase activity, which is measured. The downstream
    steps are inferred from the pump's known role: a smaller synaptic vesicle
    proton gradient should reduce transmitter loading and therefore release, and
    altered release should disturb network excitability. None of these steps has
    been measured in neurons carrying patient alleles.
  evidence:
  - reference: PMID:29652249
    reference_title: "Clathrin coat controls synaptic vesicle acidification by blocking vacuolar ATPase activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Newly-formed synaptic vesicles (SVs) are rapidly acidified by vacuolar adenosine triphosphatases (vATPases), generating a proton electrochemical gradient that drives neurotransmitter loading."
    explanation: >-
      States the general dependency of vesicle loading on V-ATPase pumping that
      the hypothesis assumes.
- hypothesis_group_id: v0c_fusion_facilitation
  hypothesis_label: >-
    Loss of a proton-pump-independent c-subunit role in vesicle fusion
  status: EMERGING
  description: >-
    The c subunit binds the v-SNARE VAMP2, and acute inactivation of the c subunit
    in neurons rapidly inhibits transmission. A patient variant could therefore
    reduce release independently of acidification. Whether V0 subunits have a
    direct fusion role is debated, and this route has not been tested for any
    ATP6V0C patient variant.
  evidence:
  - reference: PMID:30155790
    reference_title: "Chromophore-Assisted Light Inactivation of the V-ATPase V0c Subunit Inhibits Neurotransmitter Release Downstream of Synaptic Vesicle Acidification."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "The c-subunit interacts with the v-SNARE VAMP2 and facilitates neurotransmission."
    explanation: >-
      Establishes the pump-independent role that a c-subunit variant could
      disturb.
pathophysiology:
- name: ATP6V0C Heterozygous Variant
  conforms_to: "synaptic_vesicle_cycle#Synaptic Vesicle Cycle Protein Deficiency"
  description: >-
    Heterozygous germline variants in ATP6V0C, the c subunit of the V0
    proton-translocating domain of the V-ATPase. Two routes to reduced function are
    proposed. Truncating, stop-loss and whole-gene-deletion alleles act through
    haploinsufficiency, supported by halved transcript levels in a stop-loss
    carrier. Missense variants facing the a subunit are modelled as jamming the
    rotary mechanism and are proposed to act dominant-negatively; that second
    route is inferred from structure, not measured. The synaptic-vesicle-cycle
    step affected is neurotransmitter loading.
  notes: >-
    Germline is the typical origin; four of 27 founding-cohort patients are
    mosaic, and the mosaic carriers tend to have milder seizure histories.

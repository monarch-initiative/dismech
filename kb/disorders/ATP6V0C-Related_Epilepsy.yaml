notes: >-
  No GeneReviews chapter covers this disorder. Developmental delay and intellectual
  disability are not wired into the pathograph: the sources describe them alongside
  the epilepsy but do not establish whether they follow from seizures, from the
  synaptic defect directly, or from impaired endolysosomal acidification, which the
  founding study names as a possible contributor.

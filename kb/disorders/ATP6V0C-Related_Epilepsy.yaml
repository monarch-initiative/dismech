  evidence:
  - reference: PMID:36074901
    reference_title: "ATP6V0C variants impair V-ATPase function causing a neurodevelopmental disorder often associated with epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In summary, we report 27 patients with heterozygous ATP6V0C variants who presented with developmental delay, early onset epilepsy and intellectual disability."
    explanation: >-
      Founding cohort for the gene-disease relationship.
  - reference: PMID:37161035
    reference_title: "ATP6V0C gene variants were identified in individuals with epilepsy, with or without developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified de novo heterozygous variants (p.Arg119Trp, p.Val99_Ser102del, c.260_263 + 11delinsGCCCA) in the ATP6V0C gene, which encodes a subunit of vacuolar ATPase."
    explanation: >-
      Independent replication with missense, in-frame deletion and splice variants.
  - reference: PMID:33090716
    reference_title: "Haploinsufficiency of ATP6V0C possibly underlies 16p13.3 deletions that cause microcephaly, seizures, and neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Analysis of loss of function constraint metrics, transcript-aware evaluation of the population variants, GeVIR scores, analysis of reported pathogenic point variants, detailed review of the known functions of gene products and their animal models showed that the haploinsufficiency of ATP6V0C likely underlies the phenotype of this condition."
    explanation: >-
      Identifies ATP6V0C as the dosage-sensitive gene within 16p13.3 deletions.
differential_diagnoses:
- name: Dravet syndrome
  disease_term:
    preferred_term: Dravet syndrome
    term:
      id: MONDO:0100135
      label: Dravet syndrome
  description: >-
    The severe end of ATP6V0C-related epilepsy can meet clinical criteria for
    Dravet syndrome. The distinction matters for treatment, because SCN1A-directed
    therapies do not apply.
  distinguishing_features:
  - A pathogenic ATP6V0C variant with no SCN1A variant favors this disorder.
  evidence:
  - reference: PMID:40085430
    reference_title: "Variants in ATP6V0C are associated with Dravet-like developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that abnormal ATP6V0C function can, at the severe end of the clinical spectrum, be associated with Dravet-like phenotype."
    explanation: >-
      Two adults with clinically classic Dravet syndrome carried de novo ATP6V0C
      variants.
  - reference: PMID:40085430
    reference_title: "Variants in ATP6V0C are associated with Dravet-like developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is relevant, as these patients would not qualify for disease-modifying antisense nucleotide or gene therapies targeting SCN1A."
    explanation: >-
      States the treatment consequence of distinguishing the two disorders.

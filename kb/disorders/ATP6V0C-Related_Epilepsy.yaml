genetic:
- name: ATP6V0C
  gene_term:
    preferred_term: ATP6V0C
    term:
      id: hgnc:855
      label: ATP6V0C
  association: Causative
  relationship_type: CAUSATIVE
  presence: Positive
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  notes: >-
    Missense variants predominate in the founding 27-patient cohort (22 patients); four frameshifts and one stop-loss were also reported. Independent cases include an in-frame deletion and a splice-region indel. The founding series includes three previously published patients, including the stop-loss RNA case, so the reports should not be summed as independent cohorts. Multigene deletions support a possible dosage contribution but do not isolate ATP6V0C. Patient 13 also had biallelic LZTR1 variants and hypertrophic cardiomyopathy/mitral valve abnormalities; these cardiac findings cannot be confidently attributed to ATP6V0C.
  evidence:
  - reference: PMID:36074901
    reference_title: "ATP6V0C variants impair V-ATPase function causing a neurodevelopmental disorder often associated with epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In summary, we report 27 patients with heterozygous ATP6V0C variants who presented with developmental delay, early onset epilepsy and intellectual disability."
    explanation: >-
      Founding cohort for the gene-disease relationship.
  - reference: PMID:37161035
    reference_title: "ATP6V0C gene variants were identified in individuals with epilepsy, with or without developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified de novo heterozygous variants (p.Arg119Trp, p.Val99_Ser102del, c.260_263 + 11delinsGCCCA) in the ATP6V0C gene, which encodes a subunit of vacuolar ATPase."
    explanation: >-
      Independent replication with missense, in-frame deletion and splice variants.
  - reference: PMID:33090716
    reference_title: "Haploinsufficiency of ATP6V0C possibly underlies 16p13.3 deletions that cause microcephaly, seizures, and neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Analysis of loss of function constraint metrics, transcript-aware evaluation of the population variants, GeVIR scores, analysis of reported pathogenic point variants, detailed review of the known functions of gene products and their animal models showed that the haploinsufficiency of ATP6V0C likely underlies the phenotype of this condition."
    explanation: >-
      In-silico prioritization proposes ATP6V0C as a contributor to the deletion phenotype; the observation does not isolate single-gene causality.
  - reference: PMID:36074901
    reference_title: ATP6V0C variants impair V-ATPase function causing a neurodevelopmental disorder often associated with epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Patient 13 has biallelic variants in LZTR1, which has been associated with Noonan-like syndrome
    explanation: A second genetic diagnosis limits attribution of this patient's cardiac findings.

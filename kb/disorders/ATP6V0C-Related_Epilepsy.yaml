experimental_models:
- name: Yeast VMA3 null-complementation assay
  experimental_model_type: OTHER
  description: Twelve patient-equivalent missense variants were introduced into yeast VMA3 and expressed in vma3-null cells. Nine gave little or no LysoSensor fluorescence, G63A and L150F retained intermediate fluorescence, and F137L was comparable to wild type in that assay. Calcium-sensitive growth provided an additional functional readout, including impairment of F137L at higher calcium concentrations.
  publication: PMID:36074901
  modeled_mechanisms:
  - target: Reduced V-ATPase Proton Pumping
    description: Ortholog complementation probes residual V-ATPase function through vacuolar acidification and calcium-sensitive growth.
    evidence:
    - reference: PMID:36074901
      reference_title: ATP6V0C variants impair V-ATPase function causing a neurodevelopmental disorder often associated with epilepsy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: When the uptake of LysoSensor was measured, we saw that nine variants were associated with little to no fluorescence, indicating significant reduction or loss of V-ATPase activity.
      explanation: Variant-dependent acidification impairment in the yeast assay.
    - reference: PMID:36074901
      reference_title: ATP6V0C variants impair V-ATPase function causing a neurodevelopmental disorder often associated with epilepsy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT

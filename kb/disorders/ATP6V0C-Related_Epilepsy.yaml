    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: They all displayed favorable outcomes without intellectual or developmental abnormalities, although afebrile seizures or frequent seizures occurred.
    explanation: Normal development in the two reported families contrasts with the neurodevelopmental presentations.
- name: Neurodevelopmental disorder with or without epilepsy
  description: The founding 27-patient series included developmental delay and intellectual disability, variable MRI findings and frequent early-onset epilepsy. Some individuals, including mosaic carriers, had no reported seizures. These are clinical presentations within a spectrum, not established allele-specific categories.
  evidence:
  - reference: PMID:36074901
    reference_title: ATP6V0C variants impair V-ATPase function causing a neurodevelopmental disorder often associated with epilepsy.
    supports: SUPPORT

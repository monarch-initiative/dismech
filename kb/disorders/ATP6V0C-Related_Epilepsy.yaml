    explanation: >-
      Valproate monotherapy controlled seizures in a familial case.
  - reference: PMID:35600075
    reference_title: "ATP6V0C Is Associated With Febrile Seizures and Epilepsy With Febrile Seizures Plus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The myoclonic seizures responded well to LTG, which potentially produce seizure aggravation in patients with SCN1A mutations."
    explanation: >-
      Lamotrigine controlled myoclonic seizures, a response that contrasts with

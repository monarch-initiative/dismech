  description: >-
    Pan-neuronal Vha16-3 RNAi prolonged electroshock recovery in third-instar larvae. Pretreatment with levetiracetam, topiramate, lamotrigine or valproate shortened recovery versus vehicle; phenytoin did not significantly change it at the same 2 mM food concentration. These experiments do not establish comparative clinical efficacy.

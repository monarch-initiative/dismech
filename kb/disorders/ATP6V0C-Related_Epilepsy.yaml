name: ATP6V0C-Related Epilepsy
creation_date: "2026-10-01T00:00:00Z"
description: >-
  An epilepsy and neurodevelopmental disorder caused by heterozygous, often de novo, variants in ATP6V0C, encoding the c subunit of the membrane V0 domain of the vacuolar H+-ATPase. Its clinical spectrum includes familial febrile seizures or epilepsy with febrile seizures plus and normal development, developmental delay and intellectual disability with or without epilepsy, and Dravet-like developmental and epileptic encephalopathy persisting into adulthood. Seizures often begin in infancy or early childhood and can be fever-sensitive. Callosal or cerebellar vermian abnormalities and delayed myelination occur in some patients; brain MRI can also be normal. Yeast and invertebrate experiments support impaired V-ATPase function, but the intervening mechanisms producing the human neurological phenotype remain incompletely resolved. ATP6V0C is a proposed contributor to overlapping multigene 16p13.3 deletion phenotypes; these deletions do not isolate its effect.
category: Mendelian
parents:
- Epilepsy
- Neurodevelopmental Disorder
synonyms:
- ATP6V0C-related neurodevelopmental disorder
- ATP6V0C deficiency

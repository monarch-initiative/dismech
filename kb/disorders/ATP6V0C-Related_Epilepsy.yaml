  - reference: PMID:35600075
    reference_title: "ATP6V0C Is Associated With Febrile Seizures and Epilepsy With Febrile Seizures Plus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening for ATP6V0C mutations would help differentiating patients with Dravet syndrome caused by SCN1A mutations, which presented similar clinical manifestation but different responses to antiepileptic treatment."
    explanation: >-

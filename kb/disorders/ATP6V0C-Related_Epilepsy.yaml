- name: 16p13.3 microdeletion including TBC1D24, ATP6V0C and PDPK1
  description: >-
    Contiguous 16p13.3 deletions that remove ATP6V0C with neighbouring genes cause
    developmental delay, intellectual disability, seizures and, unlike point
    variants, frequent microcephaly. ATP6V0C haploinsufficiency is thought to
    drive the neurodevelopmental phenotype; chromosomal microarray rather than
    sequencing makes the diagnosis.
  distinguishing_features:
  - Microcephaly is common in the deletion.
  - Detected by chromosomal microarray.
  evidence:
  - reference: PMID:30245510
    reference_title: "A new microdeletion syndrome involving TBC1D24, ATP6V0C, and PDPK1 causes epilepsy, microcephaly, and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that 16p13.3 microdeletions resulting in simultaneous haploinsufficiencies of TBC1D24, ATP6V0C, and PDPK1 cause a novel rare contiguous gene deletion syndrome of microcephaly, developmental delay, intellectual disability, and epilepsy."
    explanation: >-
      Defines the contiguous-deletion syndrome that includes ATP6V0C.
  - reference: PMID:39273013
    reference_title: "V-ATPase Dysfunction in the Brain: Genetic Insights and Therapeutic Opportunities."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "despite the presence of the epilepsy gene TBC1D24 in the genomic deletion, ATP6V0C haploinsufficiency was proposed as the primary contributor to the clinical features"
    explanation: >-
      A 2024 review of V-ATPase brain disorders summarizes why ATP6V0C, rather
      than TBC1D24, is held to drive the deletion phenotype.
animal_models:
- name: Drosophila pan-neuronal Vha16-3 knockdown
  species: Fruit fly (Drosophila melanogaster)
  genotype: elaV-GAL4 > Vha16-3 (CG32090) RNAi
  publication: PMID:36074901
  description: >-
    Pan-neuronal RNAi knockdown of the ATP6V0C orthologue prolongs recovery from
    electroshock-induced seizure-like behaviour in larvae. Levetiracetam and
    topiramate reverse it most strongly; phenytoin does not.
  modeled_mechanisms:
  - target: Neuronal Hyperexcitability and Seizure Susceptibility
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reduced neuronal dosage of the orthologue produces increased seizure
      susceptibility in vivo.
    limitations: >-
      Knockdown models haploinsufficiency only, not the proposed dominant-negative
      missense effect, and larval electroshock recovery is a proxy for human
      seizures.
    evidence:
    - reference: PMID:36074901
      reference_title: "ATP6V0C variants impair V-ATPase function causing a neurodevelopmental disorder often associated with epilepsy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Knockdown of the Drosophila orthologue of ATP6V0C increases seizure duration."
      explanation: >-
        Neuronal knockdown increases seizure duration.
    - reference: PMID:36074901
      reference_title: "ATP6V0C variants impair V-ATPase function causing a neurodevelopmental disorder often associated with epilepsy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Lamotrigine (LAM) and valproate (VAL) were also effective, but not phenytoin (PHY)."
      explanation: >-
        Drug responses in the knockdown larvae, including the lack of a
        phenytoin effect.
- name: Caenorhabditis elegans patient-variant expression
  species: Nematode (Caenorhabditis elegans)
  genotype: Transgenic expression of selected ATP6V0C patient variants
  publication: PMID:36074901
  description: >-
    Expressing selected patient missense variants in worms reduces growth,
    worsens motor function and shortens lifespan, consistent with a deleterious
    effect of the missense alleles.
  modeled_mechanisms:
  - target: ATP6V0C Heterozygous Variant
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Patient missense alleles are deleterious when expressed in vivo.
    limitations: >-
      Worm readouts are growth, motility and lifespan, not seizures or
      neurodevelopment.
    evidence:
    - reference: PMID:36074901
      reference_title: "ATP6V0C variants impair V-ATPase function causing a neurodevelopmental disorder often associated with epilepsy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the expression of selected patient variants in Caenorhabditis elegans led to reduced growth, motor dysfunction and reduced lifespan"
      explanation: >-
        In vivo expression of patient variants is deleterious.
treatments:
- name: Antiseizure Medication
  description: >-
    No disease-specific therapy exists. Reported responses are from case series:
    valproate controlled seizures in a familial case and lamotrigine was effective
    for myoclonic seizures. The reporting authors note that treatment response
    differs from SCN1A-related Dravet syndrome, which is one reason a molecular
    diagnosis matters. In the Drosophila model, levetiracetam and topiramate gave
    the strongest rescue.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:

  - reference: PMID:33190975
    reference_title: "Novel de novo mutation substantiates ATP6V0C as a gene causing epilepsy with intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "real-time PCR demonstrated that the patient's ATP6V0C RNA level was approximately half of that in her parents, suggesting haploinsufficiency as a pathomechanism."
    explanation: >-
      Halved transcript in a stop-loss carrier supports haploinsufficiency for
      that allele class.
  - reference: PMID:36074901
    reference_title: "ATP6V0C variants impair V-ATPase function causing a neurodevelopmental disorder often associated with epilepsy."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: INDIRECT
    snippet: "Therefore, we speculate that missense variants and those predicted to escape NMD act via a dominant negative mechanism, while nonsense variants and microdeletions containing ATP6V0C act via haploinsufficiency as demonstrated by our Drosophila data"
    explanation: >-
      States the two proposed allele-class mechanisms; the dominant-negative half
      is the authors' inference from structural modelling.
  downstream:
  - target: Reduced V-ATPase Proton Pumping
    causal_link_type: DIRECT
    description: >-
      Patient variants placed in the yeast c-subunit null strain fail to restore
      vacuolar acidification.
    evidence:
    - reference: PMID:36074901
      reference_title: "ATP6V0C variants impair V-ATPase function causing a neurodevelopmental disorder often associated with epilepsy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "When the uptake of LysoSensor was measured, we saw that nine variants were associated with little to no fluorescence, indicating significant reduction or loss of V-ATPase activity."
      explanation: >-
        Patient variants expressed in vma3-null yeast give little or no
        acidification, a direct readout of reduced pump activity.
  - target: Impaired V0c-Dependent Facilitation of Vesicle Fusion
    causal_link_type: DIRECT
    hypothesis_groups:
    - v0c_fusion_facilitation
    description: >-
      Proposed only; no study has tested a patient variant for this effect.
- name: Reduced V-ATPase Proton Pumping
  description: >-
    Loss of c-subunit function reduces proton translocation by the V-ATPase,
    lowering the acidification of the organelles it serves, including synaptic
    vesicles, endosomes and lysosomes. Measured for patient variants in yeast
    vacuoles; not yet measured in patient neurons.

name: Mitochondrial Complex I Deficiency, Nuclear Type 35
creation_date: "2026-11-27T14:24:30Z"
description: >-
  Mitochondrial complex I deficiency nuclear type 35 (MC1DN35) is the autosomal
  recessive complex I deficiency caused by biallelic variants in NDUFB10, an
  accessory subunit of the distal membrane arm (PD module) of complex I. NDUFB10
  is imported into the intermembrane space by the CHCHD4 (Mia40) disulfide relay,
  where it acquires disulfide bonds before it is assembled; patient variants
  reduce NDUFB10 protein, stall complex I assembly at a late stage and cause
  isolated complex I deficiency. Only two families have been reported. The first
  patient, compound heterozygous for a truncating allele and a cysteine
  substitution that blocks import, had fatal neonatal lactic acidosis with
  cardiomyopathy. Two siblings homozygous for a deep intronic variant that
  creates a cryptic exon had bilateral sensorineural hearing loss, growth delay,
  a radial ray anomaly, developmental regression and apnoea, and died at 11 and
  14 months.
category: Mendelian
parents:
- Mitochondrial Complex I Deficiency
synonyms:
- MC1DN35
- mitochondrial complex 1 deficiency, nuclear type 35

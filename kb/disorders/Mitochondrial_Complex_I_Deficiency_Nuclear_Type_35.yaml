- name: Impaired Intermembrane-Space Import of NDUFB10
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    NDUFB10 is a substrate of the intermembrane space oxidoreductase CHCHD4, with
    which it interacts transiently and from which it acquires disulfide bonds
    during import. The Cys107Ser substitution impairs this oxidation and the
    accumulation of NDUFB10 in mitochondria, and the non-imported precursor is
    degraded. This step applies to the missense allele of the first patient.
  biological_processes:
  - preferred_term: CHCHD4-dependent oxidative import of NDUFB10
    modifier: DECREASED
    term:
      id: GO:0160203
      label: protein import into the intermembrane space via the disulfide relay system
  evidence:
  - reference: PMID:28040730
    reference_title: "Mutations in the accessory subunit NDUFB10 result in isolated complex I deficiency and illustrate the critical role of intermembrane space import for complex I holoenzyme assembly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that during its mitochondrial import and maturation NDUFB10
      transiently interacts with CHCHD4 and acquires disulfide bonds.
    explanation: >-
      NDUFB10 is imported by the disulfide relay.
  - reference: PMID:28040730
    reference_title: "Mutations in the accessory subunit NDUFB10 result in isolated complex I deficiency and illustrate the critical role of intermembrane space import for complex I holoenzyme assembly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutation of cysteine residue 107 in NDUFB10 impaired oxidation and
      efficient mitochondrial accumulation of the protein and resulted in
      degradation of non-imported precursors.
    explanation: >-
      The patient missense allele blocks import.
  downstream:
  - target: Stalled Late-Stage Complex I Assembly
    causal_link_type: DIRECT
- name: Stalled Late-Stage Complex I Assembly
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    With too little NDUFB10, assembly of the holoenzyme is perturbed at the 830 kDa
    stage, most complex I subunits fall in patient fibroblasts, and other
    respiratory chain complexes are unaffected. In NDUFB10 knockout cells the
    distal membrane-arm (PD) module is lost, the proximal (PP) module falls, and
    supercomplex formation is impaired.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  cellular_components:
  - preferred_term: respiratory chain complex I
    term:
      id: GO:0045271
      label: respiratory chain complex I
  evidence:
  - reference: PMID:28040730
    reference_title: "Mutations in the accessory subunit NDUFB10 result in isolated complex I deficiency and illustrate the critical role of intermembrane space import for complex I holoenzyme assembly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Protein expression of NDUFB10 was decreased in muscle and heart, and less so
      in the liver and fibroblasts, resulting in the perturbed assembly of the
      holoenzyme at the 830 kDa stage.
    explanation: >-
      Late-stage assembly defect in patient tissues.
  - reference: PMID:33169436
    reference_title: "Multiomic analysis elucidates Complex I deficiency caused by a deep intronic variant in NDUFB10."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunoblot and quantitative proteomic analysis of fibroblasts revealed
      decreased abundance of Complex I subunits, providing evidence of isolated
      Complex I deficiency.
    explanation: >-
      Loss of complex I subunits in the second family.
  - reference: PMID:36952351
    reference_title: "Loss of respiratory complex I subunit NDUFB10 affects complex I assembly and supercomplex formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This likely is due to loss of proton pumping since the CI P P -module is
      downregulated and the P D -module is completely abolished in NDUFB10 knock
      outs.
    explanation: >-
      Module-level consequence of NDUFB10 loss in knockout cells.
  - reference: PMID:36952351
    reference_title: "Loss of respiratory complex I subunit NDUFB10 affects complex I assembly and supercomplex formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      NDUFB10 knockout was correlated with a decrease of SCAF1, a supercomplex
      assembly factor, and a reduction of respiration and mitochondrial membrane
      potential.
    explanation: >-
      Supercomplex and respiration effects of the knockout.
  downstream:

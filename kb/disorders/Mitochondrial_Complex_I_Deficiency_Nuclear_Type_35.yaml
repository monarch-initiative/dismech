  notes: >-
    NDUFB10 at 16p13.3 is the gene of OMIM 619003 (MC1DN35), as MedGen's record
    for the disorder states; the MONDO term for it currently carries no causal
    gene. relationship_type is left UNKNOWN rather than CAUSATIVE because only two
    families have been reported and ClinGen rates NDUFB10 Moderate for
    mitochondrial disease (MONDO:0044970, autosomal recessive), a lumped term
    whose tier is therefore not copied into gene_disease_validity.

    Alleles: a truncating variant with absent protein in trans with p.Cys107Ser
    in the first patient, and homozygous NM_004548.3:c.131-442G>C, a
    deep intronic variant creating a 94-nucleotide cryptic exon, in two siblings
    of a consanguineous family of Pakistani origin.

      Exome sequencing revealed compound heterozygous mutations in NDUFB10, which
      encodes an accessory subunit located within the PD part of complex I.
    explanation: >-
      Biallelic variants in the first patient.
  - reference: PMID:33169436
    reference_title: "Multiomic analysis elucidates Complex I deficiency caused by a deep intronic variant in NDUFB10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      was found to be homozygous in both affected siblings and heterozygous in the
      unaffected parents
    explanation: >-
      Recessive segregation in the second family.
pathophysiology:
- name: Biallelic NDUFB10 Variants
  conforms_to: "complex_i_deficiency#Complex I Biogenesis or Repair Failure"
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The reported genotypes are a premature stop codon with absent protein in
    trans with p.Cys107Ser, and a homozygous deep intronic variant,
    c.131-442G>C, that activates a cryptic exon and leads to nonsense-mediated
    decay. Both lower the amount of NDUFB10. NDUFB10 is an accessory, non-catalytic
    subunit of the distal membrane arm (PD module), so its lost activity is
    structural.
  genes:
  - preferred_term: NDUFB10
    term:
      id: hgnc:7696
      label: NDUFB10
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Loss of function through absent or reduced NDUFB10 protein; the intronic
      allele leaves some normally spliced transcript.
  molecular_functions:
  - preferred_term: NDUFB10 structural role in the complex I distal membrane arm
    modifier: DECREASED
    term:
      id: GO:0005198
      label: structural molecule activity
  evidence:
  - reference: PMID:28040730
    reference_title: "Mutations in the accessory subunit NDUFB10 result in isolated complex I deficiency and illustrate the critical role of intermembrane space import for complex I holoenzyme assembly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One mutation resulted in a premature stop codon and absent protein, while the
      second mutation replaced the highly conserved cysteine 107 with a serine
      residue.
    explanation: >-
      The first patient's alleles.
  - reference: PMID:33169436
    reference_title: "Multiomic analysis elucidates Complex I deficiency caused by a deep intronic variant in NDUFB10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cryptic exon contained a rare intronic variant that was homozygous in
      both affected siblings.
    explanation: >-
      The second family's allele.

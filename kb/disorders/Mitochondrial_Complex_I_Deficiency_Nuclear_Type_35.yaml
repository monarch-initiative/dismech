discussions:
- discussion_id: mc1dn35_phenotype_from_two_families
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are hearing loss and the radial ray anomaly part of NDUFB10 disease, or
    features of the second family alone?
  attaches_to:
  - "phenotypes#Sensorineural Hearing Impairment"
  - "phenotypes#Thumb Hypoplasia"
  rationale: >-
    The two families differ: neonatal lactic acidosis with cardiomyopathy in one,
    hearing loss, a radial ray anomaly and infantile apnoea in the other, from a
    consanguineous family in which two paternal cousins also have hearing
    impairment. With three patients, the phenotype of this disorder cannot yet be
    separated from family-specific findings.
  proposed_experiments:
  - experiment_id: exp_mc1dn35_case_finding
    name: Ascertain further NDUFB10 patients
    description: >-
      Search exome, genome and RNA sequencing data from complex I-deficient
      patients for biallelic NDUFB10 variants, including deep intronic ones, and
      record hearing and limb findings in each.
notes: >-
  No GeneReviews chapter covers this disorder. The phenotypes come from the two
  published families (PMID:28040730, cached as an abstract only, and
  PMID:33169436, cached in full). No treatment is reported, so there is no
  treatments block.

  The MONDO label writes the complex number as an Arabic 1; the entry name follows
  the OMIM title and the rest of the series, and the MONDO label is kept as a
  synonym.

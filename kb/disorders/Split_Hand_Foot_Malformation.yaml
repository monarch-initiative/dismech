pathophysiology:
- name: Deletion of DYNC1I1 Exonic Limb Enhancers
  biological_scale: MOLECULAR
  role: trigger
  subtypes:
  - SHFM1
  genetic_context:
    variant_type: deletion
    genomic_contexts:
    - coding sequence
    - intron
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    allele_type: partial DYNC1I1-SLC25A13 deletion retaining DLX5 and DLX6
    genes:
    - preferred_term: DYNC1I1
      term:
        id: hgnc:2963
        label: DYNC1I1
    - preferred_term: SLC25A13
      term:
        id: hgnc:10983
        label: SLC25A13
    affected_regions:
    - name: DYNC1I1 exon 15-associated limb enhancer
      chromosomal_region: 7q21.3
      regulatory_element_type: ENHANCER
      within_gene:
        preferred_term: DYNC1I1
        term:
          id: hgnc:2963
          label: DYNC1I1
      description: >-
        Exon 15 and flanking intronic sequence form an experimentally tested
        limb enhancer. The exon and its 5-prime intronic flank cooperate in
        zebrafish reporter assays; the coding exon alone does not reproduce
        the full activity of the tested fragment.
    - name: DYNC1I1 exon 17-associated limb enhancer
      chromosomal_region: 7q21.3
      regulatory_element_type: ENHANCER
      within_gene:
        preferred_term: DYNC1I1
        term:
          id: hgnc:2963
          label: DYNC1I1
      description: >-
        The exon 17-associated fragment has anterior limb-mesenchyme enhancer
        activity in mouse embryos. This identifies the affected element
        within a larger deletion, not the boundaries of the entire deletion.
  description: >-
    The family 2 deletion reported by Lango Allen et al. removes the DYNC1I1
    exon 15- and exon 17-associated limb enhancers together with additional
    DYNC1I1 and SLC25A13 exons. DLX5 and DLX6 remain disomic. The physical
    loss includes protein-coding sequence, but the proposed limb mechanism
    is loss of regulation of the intact DLX5/DLX6 genes. DYNC1I1 and SLC25A13
    are annotated here for sequence overlap, without attributing all effects
    of the multigene deletion to either protein.
  evidence:
  - reference: PMID:24459211
    reference_title: "Next generation sequencing of chromosomal rearrangements in patients with split-hand/split-foot malformation provides evidence for DYNC1I1 exonic enhancers of DLX5/6 expression in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genome sequencing of the deletion breakpoints showed that the DLX5 and DLX6 genes are disomic but the putative DYNC1I1 exon 15 and 17 enhancers are deleted."
    explanation: Establishes enhancer deletion with retention of both target genes in family 2.
  - reference: PMID:24459211
    reference_title: "Next generation sequencing of chromosomal rearrangements in patients with split-hand/split-foot malformation provides evidence for DYNC1I1 exonic enhancers of DLX5/6 expression in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "partially encompassing exons 11–18 of the SLC25A13 gene and exons 14–17 of the DYNC1I1 gene"
    explanation: Defines the coding overlap of the larger deletion containing the named enhancers.
  - reference: PMID:22442009
    reference_title: "Coding exons function as tissue-specific enhancers of nearby genes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results demonstrate that the exonic sequences are necessary but not sufficient for full enhancer activity."
    explanation: >-
      Zebrafish deletion-series assays of DYNC1I1 eExon 15 show that the
      exon and its 5-prime intronic flank cooperate, so the named enhancer
      is not asserted to be only the coding exon.
  - reference: PMID:22442009
    reference_title: "Coding exons function as tissue-specific enhancers of nearby genes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "DYNC1I1 eExon 17 drove specific LacZ expression in the anterior limb mesenchyme"
    explanation: Establishes the limb activity of the human exon 17-associated fragment in E11.5 mouse reporter assays.
  downstream:
  - target: Impaired DLX5-DLX6 Limb Regulation After Enhancer Deletion
    causal_link_type: DIRECT
    description: >-
      Removing the enhancer-bearing interval is proposed to reduce normal
      developmental regulation of the intact DLX5/DLX6 genes; the patients'
      embryonic limb expression was not measured.
    evidence:
    - reference: PMID:24459211
      reference_title: "Next generation sequencing of chromosomal rearrangements in patients with split-hand/split-foot malformation provides evidence for DYNC1I1 exonic enhancers of DLX5/6 expression in humans."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "This result suggests that DYNC1I1 exons 15 and 17 act as tissue-specific enhancers of DLX5/6 expression in humans as well as in mouse and zebrafish."
      explanation: The authors infer the regulatory consequence from the deletion and the model-organism enhancer studies.
- name: Impaired DLX5-DLX6 Limb Regulation After Enhancer Deletion
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  subtypes:
  - SHFM1
  genes:
  - preferred_term: DLX5
    term:
      id: hgnc:2918
      label: DLX5
  - preferred_term: DLX6
    term:
      id: hgnc:2919
      label: DLX6
  description: >-
    Loss of the DYNC1I1 exonic enhancer region is proposed to impair DLX5/DLX6
    expression during limb development. Human enhancer fragments drive limb
    reporters in mice, and the endogenous mouse exon 15-associated region
    contacts Dlx5/Dlx6 promoters in the E11.5 apical ectodermal ridge. These
    experiments support enhancer function and candidate targets; they do not
    measure the expression change in the human deletion carriers. DYNC1I1
    is the enhancer host and is not itself expressed in the assayed mouse
    embryonic limb.
  evidence:
  - reference: PMID:22442009
    reference_title: "Coding exons function as tissue-specific enhancers of nearby genes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results show that Dync1i1 eExon 15 is in close proximity with Dlx5/6 promoter regions in the developing AER at E11.5, supporting its proposed role as an enhancer during limb development."
    directness: INDIRECT
    explanation: Mouse embryonic chromatin-contact assays support the distal targets, independently of coding overlap.
  - reference: PMID:22442009
    reference_title: "Coding exons function as tissue-specific enhancers of nearby genes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, Dync1i1 and Hdac9 were not detected in mouse E11.5 limbs but expressed in the mouse adult cortex and heart, respectively"
    directness: INDIRECT
    explanation: The assayed limb enhancer activity is distinct from expression of its DYNC1I1 host gene.
  - reference: PMID:24459211
    reference_title: "Next generation sequencing of chromosomal rearrangements in patients with split-hand/split-foot malformation provides evidence for DYNC1I1 exonic enhancers of DLX5/6 expression in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This result suggests that DYNC1I1 exons 15 and 17 act as tissue-specific enhancers of DLX5/6 expression in humans as well as in mouse and zebrafish."
    explanation: Human deletion mapping supports the proposed regulatory mechanism without directly measuring limb expression.
  downstream:
  - target: Apical Ectodermal Ridge Maintenance Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Altered regulation of the DLX5/DLX6 developmental program is proposed to
      connect enhancer loss to the shared SHFM limb-development mechanism.
    evidence:
    - reference: PMID:22442009
      reference_title: "Coding exons function as tissue-specific enhancers of nearby genes."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Disruption of both Dlx5 and Dlx6 in mice leads to a split hand and foot malformation (SHFM) phenocopy"
      quote_role: BACKGROUND
      explanation: >-
        The paper relates its enhancer findings to prior mouse loss-of-function
        evidence; this supports a developmental connection, not an assay of
        AER failure in the human enhancer-deletion carriers.
- name: Apical Ectodermal Ridge Maintenance Failure
  description: >-
    The unifying mechanism across SHFM loci is failure to maintain normal
    apical ectodermal ridge (AER) function during limb development. The AER is
    the epithelial signaling center at the distal tip of the limb bud that
    sustains outgrowth of the underlying mesenchyme. SHFM-associated mutations
    converge on dysregulation of FGF8 in the central portion of the AER,
    failure of AER stratification, and disruption of reciprocal Wnt-BMP-FGF
    signaling between the AER and progress-zone mesenchyme. The central-ray
    defect reflects loss of this signaling specifically in the median AER.

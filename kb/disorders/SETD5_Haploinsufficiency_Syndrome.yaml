notes: >-
  No GeneReviews chapter exists for SETD5 haploinsufficiency syndrome, for MRD23, or
  for 3p25.3 microdeletion syndrome; PubMed searches for
  "SETD5 GeneReviews[All Fields]" and for GeneReviews restricted to SETD5/3p25.3
  returned zero records on 2026-07-31. The phenotype baseline therefore rests on the
  two large clinical series (PMID:39603091, PMID:28881385), the National Brain Gene
  Registry cohort (PMID:40265665), the support-group survey (PMID:42468298), and the
  original gene-discovery reports (PMID:24680889, PMID:25138099) rather than on an
  expert-curated chapter. Orphanet has obsoleted its standalone entry for this
  concept (ORPHA:404440), which is a nosology signal - not a statement that the
  single-gene entity is invalid - and is discussed under `discussions`.
inheritance:
- name: Autosomal dominant
  description: >-
    The disorder is autosomal dominant. Most pathogenic SETD5 variants arise de novo,
    but familial transmission from a mildly affected or apparently unaffected parent
    is documented, so penetrance is incomplete and expressivity is variable.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:24680889
    reference_title: "De novo loss-of-function mutations in SETD5, encoding a methyltransferase in a 3p25 microdeletion syndrome critical region, cause intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All mutations were compatible with de novo dominant inheritance.
    explanation: >-
      The gene-discovery cohort established dominant inheritance with de novo
      occurrence for all seven loss-of-function variants.
  - reference: PMID:27375234
    reference_title: SETD5 loss-of-function mutation as a likely cause of a familial syndromic intellectual disability with variable phenotypic expression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present the first familial case of a SETD5 mutation contributing to a phenotype of congenital heart defects and dysmorphic features, with variable expression, in two siblings and their father.
    explanation: >-
      Documents vertical transmission across two generations with variable
      expression, consistent with autosomal dominant inheritance.
- name: Incomplete penetrance
  description: >-
    Penetrance of pathogenic SETD5 variants is incomplete. An apparently unaffected
    carrier mother and a carrier mother of normal intelligence with two affected twin
    sons have both been reported, and a transmitting father had only mild
    intellectual impairment.
  evidence:
  - reference: PMID:28881385
    reference_title: "Expansion and further delineation of the SETD5 phenotype leading to global developmental delay, variable dysmorphic features, and reduced penetrance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also present an apparently unaffected carrier mother of an affected individual and a carrier mother with normal intelligence and affected twin sons.
    explanation: >-
      Directly documents non-penetrant and minimally penetrant carriers.
  - reference: PMID:39603091
    reference_title: Neurological and psychiatric phenotype of a multicenter cohort of patients with SETD5-related neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in the SETD5 gene cause a neurodevelopmental disorder characterized by intellectual disability, autism, and facial dysmorphisms, with incomplete penetrance.
    explanation: >-
      The largest recent multicenter cohort explicitly characterizes the condition as
      incompletely penetrant.
mechanistic_hypotheses:
- hypothesis_group_id: setd5_h3k36me3_catalytic
  hypothesis_label: SETD5 as a Catalytic H3K36 Methyltransferase
  status: ALTERNATIVE
  description: >-
    Under this model SETD5 is a genuine SET-domain lysine methyltransferase that
    directly deposits H3K36me3 on active gene bodies, and haploinsufficiency causes
    disease by reducing that mark, desynchronizing RNA polymerase II elongation and
    corrupting RNA maturation and splicing.
  notes: >-
    Held as ALTERNATIVE rather than CANONICAL because the competing scaffold model is
    supported by independent enzymology; the two are not yet reconciled. If this model
    is correct, catalytic-activity restoration is conceptually a therapeutic target.
  evidence:
  - reference: PMID:31515109
    reference_title: SETD5 Regulates Chromatin Methylation State and Preserves Global Transcriptional Fidelity during Brain Development and Neuronal Wiring.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Notably, we demonstrated that SETD5 directly deposits H3K36me3, which is essential to allow on-time RNA elongation dynamics.
    explanation: >-
      The primary experimental claim of direct catalytic H3K36me3 deposition by SETD5.
- hypothesis_group_id: setd5_corepressor_scaffold
  hypothesis_label: SETD5 as a Catalytically Inert Co-Repressor Scaffold
  status: ALTERNATIVE
  description: >-
    Under this model SETD5 lacks intrinsic methyltransferase activity and instead
    scaffolds a co-repressor complex containing HDAC3, NCoR, G9a, and PAF1;
    haploinsufficiency then acts by failure of corepressor recruitment and altered
    histone acetylation rather than by loss of a methyl mark. Notably, SETD5 lacks the
    PHD finger present in its SET-domain homologues, which is part of the
    enzymological argument.
  notes: >-
    Both hypotheses converge on the same downstream node - aberrant RNA polymerase II
    elongation and transcriptional infidelity - so the disease model is robust to the
    controversy even though the molecular mechanism is not settled. See the
    gap_setd5_catalytic_activity discussion.
  evidence:
  - reference: PMID:36875494
    reference_title: "Structure, activity and function of the lysine methyltransferase SETD5."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, there is evidence that SETD5 lacks the methyltransferase activity but scaffolds a co- repressor complex, including HDAC3, NCoR, G9a, and PAF1, which couples selective deacetylation of H3K9ac with methylation of this residue
    explanation: >-
      States the scaffold model and names the co-repressor partners; classified OTHER
      because it is a review synthesizing primary enzymology.
  - reference: PMID:36875494
    reference_title: "Structure, activity and function of the lysine methyltransferase SETD5."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The yeast SET3 and SET4, Drosophila UpSET, and human MLL5 are homologous to SETD5 over their SET domains and, except for SETD5, contain a PHD ﬁnger
    explanation: >-
      Provides the comparative-domain argument that SETD5 is structurally atypical
      among its SET-domain homologues.
pathophysiology:
- name: SETD5 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Heterozygous nonsense, frameshift, and splice-disrupting SETD5 variants introduce
    premature termination codons whose transcripts are degraded by nonsense-mediated
    decay, halving functional SETD5 dosage. Whole-gene 3p25.3 microdeletions that
    remove one SETD5 allele converge on the same mechanism. CRISPR/Cas9 modelling of
    two patient intragenic variants demonstrated nonsense-mediated decay directly.
  genes:
  - preferred_term: SETD5
    term:
      id: hgnc:25566
      label: SETD5
  cell_types:
  - preferred_term: neural stem cell
    term:
      id: CL:0000047
      label: neural stem cell
  evidence:
  - reference: PMID:25138099
    reference_title: Loss-of-function variants of SETD5 cause intellectual disability and the core phenotype of microdeletion 3p25.3 syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      CRISPR/Cas9 mutation modelling of the two intragenic variants demonstrated nonsense-mediated decay of the resulting transcripts, pointing to a loss-of-function (LoF) and haploinsufficiency as the common disease-causing mechanism of intragenic SETD5 sequence variants and SETD5-containing microdeletions.
    explanation: >-
      Provides the direct experimental demonstration that patient variants trigger
      nonsense-mediated decay and therefore act by haploinsufficiency.
  - reference: PMID:24680889
    reference_title: "De novo loss-of-function mutations in SETD5, encoding a methyltransferase in a 3p25 microdeletion syndrome critical region, cause intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      were identified in SETD5, a gene predicted to encode a methyltransferase. All mutations were compatible with de novo dominant inheritance.
    explanation: >-
      Identifies SETD5 as the mutated gene and confirms de novo dominant occurrence
      of the seven truncating variants in the gene-discovery cohort.
  - reference: PMID:32793091
    reference_title: SETD5 Gene Haploinsufficiency in Three Patients With Suspected KBG Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all the three patients the pathogenic mechanism of the SETD5 alteration is haploinsufficiency.
    explanation: >-
      Independent clinical confirmation that both intragenic variants and a 3p25.3
      deletion act through SETD5 haploinsufficiency.
  downstream:
  - target: Impaired H3K36 Methylation and Chromatin Regulation
    description: >-
      Reduced SETD5 dosage lowers deposition of the H3K36me3 mark on active gene
      bodies.
    hypothesis_groups:
    - setd5_h3k36me3_catalytic
    - setd5_corepressor_scaffold
    evidence:
    - reference: PMID:31515109
      reference_title: SETD5 Regulates Chromatin Methylation State and Preserves Global Transcriptional Fidelity during Brain Development and Neuronal Wiring.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mechanistically, Setd5 inactivation in neural stem cells, zebrafish, and mice equally affects genome-wide levels of H3K36me3 on active gene bodies.
      explanation: >-
        Directly links Setd5 loss to a genome-wide reduction of the H3K36me3 mark
        across three model systems.
  - target: Dysregulated rDNA Expression and Reduced Translation
    description: >-
      SETD5 recruits the HDAC3 complex to the rDNA promoter; reduced SETD5 attenuates
      rDNA transcription.
    evidence:
    - reference: PMID:32299058
      reference_title: The Autism-Related Protein SETD5 Controls Neural Cell Proliferation through Epigenetic Regulation of rDNA Expression.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        SETD5 recruited the HDAC3 complex to the rDNA promoter, resulting in removal of the histone mark H4K16ac and its reader protein TIP5, a repressor of rDNA expression.
      explanation: >-
        Establishes the direct SETD5-HDAC3-TIP5 route from SETD5 dosage to rDNA
        promoter regulation.
- name: Impaired H3K36 Methylation and Chromatin Regulation
  biological_scale: MOLECULAR
  description: >-
    SETD5 contains a SET domain and a putative PHD domain and is best characterized as
    depositing H3K36 methylation, though whether SETD5 itself is catalytically active
    as a histone methyltransferase remains debated; it also acts through
    HDAC-containing corepressor complexes that control chromatin accessibility. In
    Setd5-deficient neural stem cells, zebrafish, and mice, genome-wide H3K36me3 on
    active gene bodies is reduced.
  cell_types:
  - preferred_term: neural stem cell
    term:
      id: CL:0000047
      label: neural stem cell
  molecular_functions:
  - preferred_term: histone H3K36 methyltransferase activity
    term:
      id: GO:0046975
      label: histone H3K36 methyltransferase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:31515109
    reference_title: SETD5 Regulates Chromatin Methylation State and Preserves Global Transcriptional Fidelity during Brain Development and Neuronal Wiring.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Notably, we demonstrated that SETD5 directly deposits H3K36me3, which is essential to allow on-time RNA elongation dynamics.
    explanation: >-
      Directly attributes H3K36me3 deposition to SETD5 and connects it to elongation
      kinetics.
  - reference: PMID:36875494
    reference_title: "Structure, activity and function of the lysine methyltransferase SETD5."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      SET domain-containing 5 (SETD5) is an uncharacterized member of the protein lysine methyltransferase family and is best known for its transcription machinery by methylating histone H3 on lysine 36 (H3K36).
    explanation: >-
      Review-level statement of SETD5's H3K36-directed activity; classified OTHER
      because it is an expert synthesis rather than primary data.
  - reference: PMID:37264456
    reference_title: SETD5 haploinsufficiency affects mitochondrial compartment in neural cells.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The direct function of SETD5 as histone methyltransferase activity is debated
    explanation: >-
      Records the explicit uncertainty about SETD5's intrinsic catalytic activity,
      which is why this node is framed as chromatin regulation rather than as a
      settled enzymatic defect.
  downstream:
  - target: Aberrant RNA Polymerase II Elongation and Transcriptional Infidelity
    description: >-
      Loss of the H3K36me3 mark on gene bodies desynchronizes RNA polymerase II
      elongation. This is the convergent hub where the catalytic and scaffold
      hypotheses meet: whichever molecular route is correct, transcriptional
      infidelity is the shared consequence.
    hypothesis_groups:
    - setd5_h3k36me3_catalytic
    - setd5_corepressor_scaffold
    evidence:
    - reference: PMID:31515109
      reference_title: SETD5 Regulates Chromatin Methylation State and Preserves Global Transcriptional Fidelity during Brain Development and Neuronal Wiring.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Hence, Setd5 gene loss leads to abnormal transcription, with impaired RNA maturation causing detrimental effects on gene integrity and splicing.
      explanation: >-
        Directly connects the chromatin defect to abnormal transcription and splicing.
- name: Aberrant RNA Polymerase II Elongation and Transcriptional Infidelity
  biological_scale: MOLECULAR
  description: >-
    SETD5 governs RNA polymerase II dynamics through its interaction with the HDAC3
    and PAF1 complexes and through the H3K36me3 mark it places on gene bodies. When
    SETD5 dosage falls, elongation timing is disturbed, RNA maturation and splicing
    are impaired, and developmental gene expression programmes are dysregulated.
  cell_types:
  - preferred_term: neural stem cell
    term:
      id: CL:0000047
      label: neural stem cell
  biological_processes:
  - preferred_term: transcription by RNA polymerase II
    term:
      id: GO:0006366
      label: transcription by RNA polymerase II
    modifier: ABNORMAL
  - preferred_term: regulation of gene expression
    term:
      id: GO:0010468
      label: regulation of gene expression
    modifier: ABNORMAL
  - preferred_term: "mRNA splicing, via spliceosome"
    term:
      id: GO:0000398
      label: "mRNA splicing, via spliceosome"
    modifier: ABNORMAL
  evidence:
  - reference: PMID:30455454
    reference_title: Haploinsufficiency of the intellectual disability gene SETD5 disturbs developmental gene expression and cognition.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our data additionally indicate that Setd5 regulates RNA polymerase II dynamics and gene transcription via its interaction with the Hdac3 and Paf1 complexes, findings potentially explaining the gene expression defects observed in Setd5-haploinsufficient mice.
    explanation: >-
      Identifies the HDAC3/PAF1 route by which Setd5 controls RNA polymerase II
      dynamics and gene transcription.
  - reference: PMID:31515109
    reference_title: SETD5 Regulates Chromatin Methylation State and Preserves Global Transcriptional Fidelity during Brain Development and Neuronal Wiring.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Hence, Setd5 gene loss leads to abnormal transcription, with impaired RNA maturation causing detrimental effects on gene integrity and splicing.
    explanation: >-
      Directly documents transcriptional infidelity and splicing defects following
      Setd5 loss.
  downstream:
  - target: Mitochondrial Fragmentation and Bioenergetic Deficit in Neural Cells
    description: >-
      Transcriptional aberration at mitochondria-associated genes is the proximate
      cause of the mitochondrial phenotype.
    evidence:
    - reference: PMID:37264456
      reference_title: SETD5 haploinsufficiency affects mitochondrial compartment in neural cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mitochondrial impairment is facilitated by transcriptional aberrations originated by the decrease of the SETD5 enzyme.
      explanation: >-
        Explicitly places the mitochondrial defect downstream of SETD5-driven
        transcriptional aberration.
  - target: Impaired Neural Progenitor Proliferation and Cortical Neurogenesis
    description: >-
      Disturbed developmental gene expression impairs the proliferative dynamics of
      neural progenitors.
    evidence:
    - reference: PMID:31515109
      reference_title: SETD5 Regulates Chromatin Methylation State and Preserves Global Transcriptional Fidelity during Brain Development and Neuronal Wiring.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Herein, we found that Setd5 haploinsufficiency impairs the proliferative dynamics of neural progenitors and synaptic wiring of neurons, ultimately resulting in behavioral deficits in mice.
      explanation: >-
        Directly links the transcriptional defect to impaired neural progenitor
        proliferation.
- name: Dysregulated rDNA Expression and Reduced Translation
  biological_scale: MOLECULAR
  description: >-
    SETD5 positively regulates ribosomal DNA transcription by recruiting the HDAC3
    complex to the rDNA promoter, removing the H4K16ac mark and its reader TIP5, a
    repressor of rDNA expression. SETD5 depletion attenuates rDNA expression and
    global translational activity, with selective loss of cyclin D1 translation;
    ablating TIP5 in SETD5-deficient cells rescues the phenotype, establishing the
    epistatic order.
  cell_types:
  - preferred_term: neural stem cell
    term:
      id: CL:0000047
      label: neural stem cell
  biological_processes:
  - preferred_term: rRNA processing
    term:
      id: GO:0006364
      label: rRNA processing
    modifier: DECREASED
  - preferred_term: translational elongation
    term:
      id: GO:0006414
      label: translational elongation
    modifier: DECREASED
  evidence:
  - reference: PMID:32299058
    reference_title: The Autism-Related Protein SETD5 Controls Neural Cell Proliferation through Epigenetic Regulation of rDNA Expression.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Depletion of SETD5 attenuated rDNA expression, translational activity, and neural cell proliferation, whereas ablation of TIP5 in SETD5-deficient cells rescued these effects.
    explanation: >-
      Direct experimental chain from SETD5 depletion to reduced rDNA expression,
      translation, and proliferation, with genetic rescue establishing causality.
  - reference: PMID:32299058
    reference_title: The Autism-Related Protein SETD5 Controls Neural Cell Proliferation through Epigenetic Regulation of rDNA Expression.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Translation of cyclin D1 mRNA was specifically down-regulated in SETD5-insufficient cells.
    explanation: >-
      Identifies the specific translational target linking the rDNA defect to
      cell-cycle progression.
  downstream:
  - target: Impaired Neural Progenitor Proliferation and Cortical Neurogenesis
    description: >-
      Reduced rDNA output and cyclin D1 translation constrain neural cell
      proliferation.
    evidence:
    - reference: PMID:32299058
      reference_title: The Autism-Related Protein SETD5 Controls Neural Cell Proliferation through Epigenetic Regulation of rDNA Expression.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our results thus suggest that SETD5 positively regulates rDNA expression via an HDAC3-mediated epigenetic mechanism and that such regulation is essential for translation of cyclin D1 mRNA and neural cell proliferation.
      explanation: >-
        States the authors' conclusion that the rDNA-cyclin D1 axis is essential for
        neural cell proliferation.
- name: Mitochondrial Fragmentation and Bioenergetic Deficit in Neural Cells
  biological_scale: CELLULAR
  description: >-
    In Setd5-haploinsufficient neural stem cells, neurons, and mouse cortex,
    mitochondria are fragmented, mitochondrial membrane potential and ATP production
    are reduced, and mitochondria are mislocalized with fewer organelles in neurites
    and synapses. The authors explicitly caution that they cannot place this defect
    within the causal hierarchy of the disease.
  cell_types:

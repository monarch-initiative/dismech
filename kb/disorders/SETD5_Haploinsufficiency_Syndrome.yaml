- species: Mouse
  genotype: Setd5 heterozygous null and cardiopharyngeal-mesoderm conditional mutant
  description: >-
    A separate mouse study identified Setd5 while screening embryonic-lethal mutants
    for 22q11.2-deletion-like cardiovascular phenotypes. Setd5 haploinsufficiency
    produced double outlet right ventricle and perimembranous ventricular septal
    defect, and conditional mutagenesis showed Setd5 is required in cardiopharyngeal
    mesoderm for heart-tube progression. This is the strongest mechanistic
    corroboration for the congenital heart defects seen in affected humans, although
    the specific mouse lesions are not the same as the human mitral valve prolapse and
    VSD/PDA reported to date.

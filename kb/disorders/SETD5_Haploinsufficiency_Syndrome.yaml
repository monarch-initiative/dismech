    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Low levels of SETD5 resulted in fragmented mitochondria, reduced mitochondrial membrane potential, and ATP production both in neural precursors and neurons.
    explanation: >-
      Directly documents the mitochondrial structural and bioenergetic phenotype in
      two neural cell types.
  - reference: PMID:37264456
    reference_title: SETD5 haploinsufficiency affects mitochondrial compartment in neural cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mitochondria were also mislocalized in mutant neurons, with reduced organelles within neurites and synapses.
    explanation: >-
      Documents mitochondrial mislocalization away from neurites and synapses,
      connecting the organelle defect to synaptic compartments.
  - reference: PMID:37264456
    reference_title: SETD5 haploinsufficiency affects mitochondrial compartment in neural cells.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM

  evidence:
  - reference: PMID:39603091
    reference_title: Neurological and psychiatric phenotype of a multicenter cohort of patients with SETD5-related neurodevelopmental disorder.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other psychiatric comorbidities include autism, ADHD, psychotic disorder and other internalizing and externalizing symptoms.
    explanation: >-
      Establishes the composition of the treatable psychiatric population in a
      multicenter cohort. PARTIAL because the cohort characterizes the phenotype and
      does not evaluate any pharmacological intervention.
  - reference: PMID:42468298
    reference_title: Expanding the Phenotype of SETD5-Related Disorder Through a Facebook Support Group.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common features included developmental delay (96%), hypotonia (78%), intellectual disability (75%), gait abnormality (59%), vision problems (51%), constipation (47%), and anxiety (47%).
    explanation: >-
      Quantifies anxiety at 47%, the largest single psychiatric target. PARTIAL because
      this is a parent-reported survey of burden, not a treatment study.
  - reference: PMID:24680889
    reference_title: "De novo loss-of-function mutations in SETD5, encoding a methyltransferase in a 3p25 microdeletion syndrome critical region, cause intellectual disability."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Behavioral problems, including obsessive-compulsive disorder, hand flapping with ritualized behavior, and autism, were prominent features.
    explanation: >-
      Independent cohort documenting the obsessive-compulsive and ritualized-behavior
      component of the treatable population. PARTIAL because no intervention is
      reported.
- name: Recombinant Growth Hormone Therapy
  description: >-
    Recombinant growth hormone was given from age 12 to a girl with a de novo SETD5
    variant and severe short stature (-5.22 SDS) in an overlap phenotype spanning
    MRD23, Cornelia de Lange, and KBG syndromes; growth velocity increased
    significantly over two years. This is a single case and is not established therapy
    for the disorder.
  action_category: THERAPEUTIC
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Growth delay
    term:
      id: HP:0001510
      label: Growth delay
  notes: >-
    Evidence strength is deliberately low. This is n=1, uncontrolled, and short
    stature was normal in all seven individuals of the original SETD5 cohort, so this
    is not generalizable guidance. It is recorded because it is the only reported
    pharmacological intervention with a measured outcome in this disorder.
  evidence:
  - reference: PMID:40869907
    reference_title: "Two Years of Growth Hormone Therapy in a Child with Severe Short Stature Due to Overlap Syndrome with a Novel SETD5 Gene Mutation: Case Report and Review of the Literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recombinant growth hormone therapy (rhGH) was started at the age of 12 years. After both one year (+3.16 SDS) and two years (+2.9 SDS), the growth rate significantly increased compared with the pre-therapy period.
    explanation: >-
      Documents the measured growth response; PARTIAL because it is an uncontrolled
      single case.
  - reference: PMID:40869907
    reference_title: "Two Years of Growth Hormone Therapy in a Child with Severe Short Stature Due to Overlap Syndrome with a Novel SETD5 Gene Mutation: Case Report and Review of the Literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the first case of a patient with overlap syndrome due to SETD5 mutation treated with rhGH.
    explanation: >-
      The authors state this is the first such case, confirming that the evidence base
      is a single report.

genetic:
- name: SETD5
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: SETD5
    term:
      id: hgnc:25566
      label: SETD5
  notes: >-
    Heterozygous germline loss-of-function variants (nonsense, frameshift, splice
    site) in SETD5 at 3p25.3 cause the disorder through haploinsufficiency. MONDO
    asserts RO:0004003 from MONDO:0014336 to HGNC:25566 (SETD5); this was verified
    with OAK before curation as the NEC anchor. SETD5 is intolerant to loss-of-function
    variation (pLI = 1) but not to missense variation, which is why LoF alleles rather
    than missense alleles dominate the pathogenic spectrum. In the National Brain Gene
    Registry cohort, 6 of 11 unique variants were nonsense, 4 frameshift, and 1 splice
    site.
  evidence:
  - reference: PMID:24680889
    reference_title: "De novo loss-of-function mutations in SETD5, encoding a methyltransferase in a 3p25 microdeletion syndrome critical region, cause intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we screened a cohort of 996 individuals with ID for variants in 565 known or candidate genes by using a targeted next-generation sequencing approach
    explanation: >-
      Establishes the ascertainment design of the cohort in which SETD5 loss of
      function was validated as a cause of intellectual disability.
  - reference: PMID:40265665
    reference_title: Expansion of the Genotypic and Phenotypic Spectrum of SETD5 Disorder Using Data From the National Brain Gene Registry.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the cohort, there were 11 unique pathogenic/likely pathogenic variants in 13 individuals from 11 different families. Of these 11 unique variants, 6 were nonsense, 4 were frameshift, and one was splice site.
    explanation: >-
      Quantifies the truncating-variant-dominated mutational spectrum in a registry
      cohort.
  - reference: PMID:31474762
    reference_title: "The pleiotropy associated with de novo variants in CHD4, CNOT3, and SETD5 extends to moyamoya angiopathy."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      SETD5 is intolerant to LoF variation (pLI = 1) but not missense variation (Z-score = −0.04).
    explanation: >-
      Population constraint metrics support haploinsufficiency as the mechanism and
      explain why missense alleles are less often pathogenic.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Diagnosis rests on identification of a heterozygous pathogenic SETD5 sequence
    variant, typically by trio exome sequencing performed for unexplained
    developmental delay or intellectual disability. Because the facial gestalt is
    non-specific, diagnosis is genotype-driven rather than gestalt-driven.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:25138099
    reference_title: Loss-of-function variants of SETD5 cause intellectual disability and the core phenotype of microdeletion 3p25.3 syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To identify further genes involved in ID, we performed WES in 250 patients with unexplained ID and their unaffected parents and included exomes of 51 previously sequenced child-parents trios in the analysis.
    explanation: >-
      Documents trio exome sequencing as the diagnostic modality that identifies
      SETD5 variants in unexplained intellectual disability.
  - reference: PMID:24680889
    reference_title: "De novo loss-of-function mutations in SETD5, encoding a methyltransferase in a 3p25 microdeletion syndrome critical region, cause intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prior to mutation analysis, the clinical features alone were not sufﬁcient or consistent for clinicians to delineate this syndrome. In none of the individuals we report was a 3p25 microdeletion syndrome clinically suspected.
    explanation: >-
      Establishes that clinical gestalt is insufficient and that molecular testing is
      the necessary diagnostic route.
- name: Chromosomal Microarray Analysis
  description: >-
    Chromosomal microarray detects the 3p25.3 microdeletions that remove SETD5 and is
    complementary to sequencing; a deletion involving THUMPD3, SETD5, and THUMPD3-AS1
    yields the same haploinsufficiency mechanism as an intragenic variant.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    A deletion encompassing SETD5 at 3p25.3 supports the diagnosis; the boundary
    between the single-gene entity and the contiguous-gene syndrome depends on which
    additional genes the deletion removes.
  evidence:
  - reference: PMID:32793091
    reference_title: SETD5 Gene Haploinsufficiency in Three Patients With Suspected KBG Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Array CGH analyses identified in P1 a pathogenic deletion at 3p25.3, involving the THUMPD3, SETD5, and THUMPD3-AS1 genes.
    explanation: >-
      Documents array CGH detection of the SETD5-containing 3p25.3 deletion.
  - reference: PMID:25138099
    reference_title: Loss-of-function variants of SETD5 cause intellectual disability and the core phenotype of microdeletion 3p25.3 syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chromosomal microarray diagnostics further identified four de novo non-recurrent microdeletions encompassing SETD5.
    explanation: >-
      Documents microarray identification of SETD5-encompassing deletions.
- name: DNA Methylation Episignature Testing
  description: >-
    Genome-wide DNA methylation profiling of peripheral blood using the clinically
    validated EpiSign assay resolves two problems that sequencing alone does not.
    First, it reclassifies SETD5 variants of uncertain significance: in a 400-person
    routine diagnostic neurodevelopmental cohort, methylation profiles supported the
    pathogenicity of variants previously called VUS and were diagnostically concordant
    with SETD5 among the disease-associated genes. Second, it addresses the KBG /
    Cornelia de Lange / SETD5 differential curated in `differential_diagnoses` below -
    although not by cleanly separating the entities, because SETD5 truncating variants
    match a combined KBGS_MRD23 episignature shared with ANKRD11-related KBG syndrome,
    reflecting the same ANKRD11-SETD5-HDAC3 convergence recorded in the KBG Syndrome
    and Cornelia de Lange Syndrome differentials. Disorder-specific secondary
    episignatures and MDS clustering are needed on top of the combined classifier to
    assign a case to one syndrome or the other.
  diagnosis_term:
    preferred_term: DNA methylation episignature (EpiSign) testing
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  results: >-
    A blood methylation profile matching the combined KBGS_MRD23 episignature supports
    the pathogenicity of a SETD5 sequence variant of uncertain significance. A
    non-matching profile does not exclude the diagnosis: three ANKRD11/SETD5 VUS in the
    same cohort showed no episignature concordant with KBGS_MRD23, and one ANKRD11
    truncating carrier was also episignature-negative.
  notes: >-
    The two general EpiSign catalogue papers suggested for this entry
    (PMID:32109418, the 42-syndrome episignature mapping study, and PMID:34906459,
    the chromatinopathy EpiSign cohort) do not name SETD5 or MRD23 anywhere in their
    cached abstracts, so neither can be cited for the SETD5-specific claim.
    PMID:32109418 is cited here only for the general principle that blood
    episignatures are used to interpret ambiguous genetic test results;
    PMID:34906459 is not cited at all. The SETD5-specific evidence comes from
    PMID:41957673, whose cached record is full text rather than abstract-only.
  evidence:
  - reference: PMID:41957673
    reference_title: "Chromatinopathies: clinically overlapping disorders, revealing novel variants and their DNA methylation signatures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      methylation profiles supported the pathogenicity of several variants previously classified as VUS and demonstrated diagnostic concordance with known disease-associated genes including ANKRD11, SETD5, KMT2A, KDM5C, CHD8, and others.
    explanation: >-
      Names SETD5 explicitly among the genes for which EpiSign methylation profiling
      was diagnostically concordant and supported reclassification of variants
      previously called VUS - the reclassification use case for this disorder.
  - reference: PMID:41957673
    reference_title: "Chromatinopathies: clinically overlapping disorders, revealing novel variants and their DNA methylation signatures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all other identified individuals with truncating variants inANKRD11andSETD5matched the established combined episignatures associated with both syndromes, KBGS_MRD23. Despite the range of MVPs in the positive cases shown in Fig.2, additional MDS clustering plots and disorder specific secondary episignatures for KBGS and MRD23 were used to add confidence to our final reporting.
    explanation: >-
      Establishes that the SETD5 episignature is a combined KBGS_MRD23 classifier
      shared with ANKRD11/KBG syndrome, and that secondary disorder-specific
      episignatures are required to resolve the KBG-versus-SETD5 differential. The
      gene symbols run together in the cached full text because the source marks them
      up in italics; the snippet is quoted byte-exactly.
  - reference: PMID:41957673
    reference_title: "Chromatinopathies: clinically overlapping disorders, revealing novel variants and their DNA methylation signatures."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three variants inANKRD11andSETD5,classified as VUS did not show episignatures concordant with KBGS_MRD23 (Table1).
    explanation: >-
      Bounds the test's negative predictive value: an episignature-negative result does
      not reclassify or exclude a SETD5 VUS. PARTIAL because the report does not
      establish a sensitivity figure for SETD5 specifically.
  - reference: PMID:32109418
    reference_title: Evaluation of DNA Methylation Episignatures for Diagnosis and Phenotype Correlations in 42 Mendelian Neurodevelopmental Disorders.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Peripheral blood episignatures can be used for diagnostic testing as well as for the interpretation of ambiguous genetic test results.
    explanation: >-
      Establishes the general clinical-utility principle for blood episignature testing
      in Mendelian neurodevelopmental disorders. PARTIAL and deliberately scoped: this
      abstract does not name SETD5 or MRD23, so it supports the modality but not the
      SETD5-specific claim, which rests on PMID:41957673.
differential_diagnoses:
- name: 3p25.3 Microdeletion Syndrome
  disease_term:
    preferred_term: 3p25.3 microdeletion syndrome
    term:
      id: MONDO:0018564
      label: 3p25.3 microdeletion syndrome
  description: >-
    A contiguous-gene deletion syndrome whose critical region contains THUMPD3, SETD5,
    and THUMPD3-AS1 within a 124 kb interval. SETD5 is regarded as the principal
    driver of the neurodevelopmental core, so the two entities share most clinical
    features - but they are separate entities because deletions can remove additional
    genes and are detected by a different assay.
  distinguishing_features:
  - >-
    Molecular: an intragenic SETD5 sequence variant defines the single-gene entity;
    a copy-number loss at 3p25.3 defines the microdeletion syndrome. The deletion may
    remove THUMPD3 and THUMPD3-AS1 in addition to SETD5, and larger 3p25-p26 deletions
    remove substantially more.
  - >-
    Clinical: the larger, more distal 3p deletions add low birth weight, microcephaly,
    telecanthus, ptosis, micrognathia, cleft palate, and congenital heart disease -
    features that are not characteristic of isolated SETD5 loss of function.
  - >-
    Assay: chromosomal microarray detects the deletion; sequencing detects the
    intragenic variant. Either may be the first-line test depending on presentation.
  evidence:
  - reference: PMID:24680889
    reference_title: "De novo loss-of-function mutations in SETD5, encoding a methyltransferase in a 3p25 microdeletion syndrome critical region, cause intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deﬁning the minimum common overlap of deletions in multiple individuals has reduced the critical region for 3p25 microdeletion syndrome to three genes within a 124 kb interval.
    explanation: >-
      Defines the three-gene critical region that distinguishes the contiguous-gene
      syndrome from the single-gene entity.
  - reference: PMID:24680889
    reference_title: "De novo loss-of-function mutations in SETD5, encoding a methyltransferase in a 3p25 microdeletion syndrome critical region, cause intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a clinical syndrome characterized by ID, low birth weight, microcephaly, telecanthus, ptosis, micro- gnathia, cleft palate, and congenital heart disease
    explanation: >-
      Enumerates the distal-deletion features that are not characteristic of isolated
      SETD5 loss of function.
  - reference: PMID:24680889
    reference_title: "De novo loss-of-function mutations in SETD5, encoding a methyltransferase in a 3p25 microdeletion syndrome critical region, cause intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SETD5 lies within the critical interval for 3p25 microdeletion syndrome. The individuals with SETD5 mutations showed phenotypic similarity to those previously reported with a deletion in 3p25, and thus loss of SETD5 might be sufficient to account for many of the clinical features observed in this condition.
    explanation: >-
      States the driver-gene relationship, the basis for treating SETD5
      haploinsufficiency as the principal contributor while keeping the deletion
      syndrome a separate entity.
- name: KBG Syndrome
  disease_term:
    preferred_term: KBG syndrome
    term:
      id: MONDO:0007846
      label: KBG syndrome
  description: >-
    ANKRD11-related KBG syndrome shares intellectual disability, developmental delay,
    behavioral features, and a partly overlapping facial appearance with SETD5
    haploinsufficiency, and individuals with SETD5 variants have been referred with
    suspected KBG syndrome. The two remain distinct clinical entities.
  distinguishing_features:
  - >-
    Gene: ANKRD11 (KBG) versus SETD5. The proteins physically interact and both engage
    HDAC3, which is the likely reason for the phenotypic convergence.
  - >-
    Hand anomalies characteristic of KBG syndrome were absent in two of three SETD5
    patients referred with suspected KBG, and expert review did not find a satisfactory
    KBG facial resemblance.
  evidence:
  - reference: PMID:32793091
    reference_title: SETD5 Gene Haploinsufficiency in Three Patients With Suspected KBG Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whilst there is significant phenotypic overlap between the above-mentioned conditions, however, they still remain distinct clinical entities.
    explanation: >-
      Directly supports keeping SETD5 haploinsufficiency, KBG syndrome, and 3p25.3
      deletion syndrome as separate entities despite overlap.
  - reference: PMID:32793091
    reference_title: SETD5 Gene Haploinsufficiency in Three Patients With Suspected KBG Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of note, two out of the three patients do not show hand anomalies consistent with KBGS, which are good diagnostic clues for differential diagnosis
    explanation: >-
      Identifies hand anomalies as the discriminating clinical clue.
  - reference: PMID:32793091
    reference_title: SETD5 Gene Haploinsufficiency in Three Patients With Suspected KBG Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Interestingly, the ANKRD11 and SETD5 proteins physically interact at the molecular level as demonstrated by spectrometry assays performed in mouse embryonic stem cells and mouse neural progenitor cells
    explanation: >-
      Provides the molecular basis for the phenotypic overlap between the two
      disorders.
- name: Cornelia de Lange Syndrome
  disease_term:
    preferred_term: Cornelia de Lange syndrome
    term:
      id: MONDO:0016033
      label: Cornelia de Lange syndrome
  description: >-
    SETD5 variants have been reported in individuals ascertained with Cornelia de
    Lange-overlapping phenotypes, driven largely by the shared eyebrow findings
    (synophrys, full broad eyebrows) and developmental delay.
  distinguishing_features:
  - >-
    Gene: the cohesin-pathway genes (NIPBL and others) versus SETD5; the overlap has
    led to SETD5 being grouped with the "cohesin-related" syndromes.
  evidence:
  - reference: PMID:32793091
    reference_title: SETD5 Gene Haploinsufficiency in Three Patients With Suspected KBG Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Currently, mutations in both SETD5 and ANKRD11 genes have been identified in patients with Cornelia de Lange (CdL) syndrome overlapping phenotypes, resulting in the terminology of “cohesin-related” syndromes
    explanation: >-
      Documents the Cornelia de Lange-overlapping presentations that make CdL a
      relevant differential.
  - reference: PMID:40869907
    reference_title: "Two Years of Growth Hormone Therapy in a Child with Severe Short Stature Due to Overlap Syndrome with a Novel SETD5 Gene Mutation: Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SEDT5 gene variants have been described in patients with KBG and Cornelia de Lange (CdL) syndromes.
    explanation: >-
      Independent confirmation that SETD5 variants present as KBG- and CdL-overlapping
      phenotypes.
- name: SETD1B-Related Neurodevelopmental Disorder
  disease_term:
    preferred_term: SETD1B-related neurodevelopmental disorder
    term:
      id: MONDO:0033559
      label: intellectual developmental disorder with seizures and language delay
  description: >-
    A paralogue-adjacent chromatin disorder that is a named-entity-confusion hazard
    rather than a close clinical mimic. SETD1B-NDD is caused by heterozygous SETD1B
    (HGNC:29187, 12q24.31) loss-of-function variants and is dominated by epilepsy,
    including myoclonic absences, in most affected individuals.
  distinguishing_features:
  - >-
    Gene and locus: SETD1B at 12q24.31 versus SETD5 at 3p25.3; different HGNC IDs
    (HGNC:29187 versus HGNC:25566) and different MONDO/OMIM entities
    (MONDO:0033559/OMIM:619000 versus MONDO:0014336/OMIM:615761).
  - >-
    Seizures occur in most individuals with SETD1B-NDD but in only about 14% of the
    SETD5 multicenter cohort, so epilepsy burden is a useful clinical discriminator.
  evidence:
  - reference: PMID:39603091
    reference_title: Neurological and psychiatric phenotype of a multicenter cohort of patients with SETD5-related neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epilepsy was present in about 14 % of patients, including different types of seizures as epileptic spasms, focal motor, and non-motor seizures.
    explanation: >-
      Establishes the low SETD5 epilepsy burden that distinguishes it from the
      epilepsy-dominated SETD1B disorder; the SETD1B side of the comparison is
      curated in the separate SETD1B-Related_Neurodevelopmental_Disorder entry.
prevalence:
- population: Individuals ascertained for unexplained intellectual disability
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence estimate exists for this disorder. The only quantitative
    figures in the literature are diagnostic yields within intellectual-disability
    cohorts: 7/996 (0.7%) in the UK10K targeted-sequencing cohort and 2/301 (0.7%) in
    an exome cohort. These are yields conditional on ascertainment for intellectual
    disability, not population rates, and are deliberately not converted into a
    rate_per_100000.
  evidence:
  - reference: PMID:24680889
    reference_title: "De novo loss-of-function mutations in SETD5, encoding a methyltransferase in a 3p25 microdeletion syndrome critical region, cause intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This analysis provides sufficient evidence that rare de novo LoF mutations in SETD5 are a relatively frequent (0.7%) cause of ID.
    explanation: >-
      Gives the 0.7% diagnostic yield in the 996-person intellectual-disability
      cohort described in the same abstract.
  - reference: PMID:25138099
    reference_title: Loss-of-function variants of SETD5 cause intellectual disability and the core phenotype of microdeletion 3p25.3 syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present report of two SETD5 LoF variants in 301 patients demonstrates a prevalence of 0.7% and thus SETD5 variants as a relatively frequent cause of ID.
    explanation: >-
      Independently replicates the 0.7% yield in a separate exome cohort.
treatments:
- name: Developmental and Educational Support
  description: >-
    Early intervention, speech and language therapy, occupational and physical
    therapy, and individualized educational support address the core developmental
    phenotype. No disease-modifying therapy exists; management is symptomatic and
    anticipatory.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_phenotypes:
  - preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  notes: >-
    There is no GeneReviews management chapter for this disorder, so the evidence
    below establishes the treatable phenotype targets rather than an evaluated
    intervention protocol. The specific therapy modalities named here are standard
    neurodevelopmental care, not SETD5-specific recommendations.
  evidence:
  - reference: PMID:42468298
    reference_title: Expanding the Phenotype of SETD5-Related Disorder Through a Facebook Support Group.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Findings expand the phenotypic spectrum and inform prognosis, surveillance, and management.
    explanation: >-
      Supports phenotype-directed management as the current standard of care; it does
      not evaluate any specific intervention.
  - reference: PMID:24680889
    reference_title: "De novo loss-of-function mutations in SETD5, encoding a methyltransferase in a 3p25 microdeletion syndrome critical region, cause intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Older children had required special schooling because of their ID and behavioral problems, although some attended mainstream school at a young age but required educational statements and extra support.
    explanation: >-
      Directly documents the educational support requirements of affected children.
- name: Antiseizure Medication
  description: >-
    Standard antiseizure medication is used in the minority of individuals who develop
    epilepsy. No SETD5-specific agent or protocol has been established, seizure types
    are heterogeneous, and drug-resistant epilepsy has been reported.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  notes: >-
    No therapeutic_agent is recorded because no specific drug has been evaluated for
    this disorder; naming one would overstate the evidence.
  evidence:
  - reference: PMID:39603091
    reference_title: Neurological and psychiatric phenotype of a multicenter cohort of patients with SETD5-related neurodevelopmental disorder.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epilepsy was present in about 14 % of patients, including different types of seizures as epileptic spasms, focal motor, and non-motor seizures.
    explanation: >-
      Establishes the treatable epilepsy population and its heterogeneity; the cohort
      does not evaluate antiseizure medication efficacy.
  - reference: PMID:40462669
    reference_title: A Novel Epilepsy Phenotype in a Young Girl With a Pathogenic SETD5 Gene Variant.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings confirm that epilepsy may arise after SETD5 variants, with subtle clinical manifestations that may overlap with behavioral phenomena in children who also exhibit cognitive and behavioral comorbidities.
    explanation: >-
      Supports vigilance for subtle seizures that may be mistaken for behavioral
      events, which is the practical prerequisite for treating them.
- name: Psychiatric and Behavioral Pharmacotherapy
  description: >-
    Psychotropic medication is used as standard neurodevelopmental care for the
    psychiatric and behavioral burden of this disorder - anxiety in about 47%, plus
    ADHD, psychotic disorder, and obsessive-compulsive/ritualized behavior. Treatment
    follows general psychiatric practice for the individual symptom cluster; no
    SETD5-specific agent, dose, or protocol has been evaluated.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Anxiety
    term:
      id: HP:0000739
      label: Anxiety
  - preferred_term: Attention deficit hyperactivity disorder
    term:
      id: HP:0007018
      label: Attention deficit hyperactivity disorder
  - preferred_term: Psychosis
    term:
      id: HP:0000709
      label: Psychosis
  - preferred_term: Compulsive behaviors
    term:
      id: HP:0000722
      label: Compulsive behaviors
  notes: >-
    No therapeutic_agent is recorded because no drug has been evaluated in this
    disorder; naming one would overstate the evidence. This follows the same
    convention as the Antiseizure Medication entry. The evidence below is PARTIAL
    throughout and establishes only the size and composition of the treatable
    psychiatric population - none of the cited studies measures the efficacy, safety,
    or comparative effectiveness of any psychotropic drug in SETD5 haploinsufficiency,
    and one source notes that subtle seizures can be mistaken for behavioral
    phenomena, so a psychiatric attribution should not be assumed before

discussions:
- discussion_id: nec_setd5_vs_3p253_deletion
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Should the single-gene SETD5 haploinsufficiency entity and the contiguous 3p25.3
    microdeletion syndrome be modelled as one entity or two?
  rationale: >-
    dismech keeps them as two entities. SETD5 is now regarded as the principal driver
    of the 3p25.3 deletion neurodevelopmental phenotype - the critical region was
    narrowed to a 124 kb three-gene interval, and SETD5 loss of function reproduces
    the core features - which is a strong lumping argument. Against lumping: (i) 3p25.3
    deletions vary in size and can remove THUMPD3, THUMPD3-AS1, and, in the larger
    3p25-p26 deletions, many additional genes, adding features (low birth weight,
    microcephaly, telecanthus, cleft palate) that are not characteristic of isolated
    SETD5 loss of function; (ii) MONDO models them as distinct terms with distinct
    OMIM anchors; (iii) the diagnostic assay differs (microarray versus sequencing);
    and (iv) authors who deeply phenotyped both explicitly argue the overlapping
    chromatin disorders "still remain distinct clinical entities" and that lumping is
    unhelpful for families. This entry therefore scopes to the intragenic-variant
    entity anchored on MONDO:0014336 / OMIM:615761 / HGNC:25566, and records the
    deletion syndrome as a differential diagnosis. A separate consideration:
    Orphanet has obsoleted its own standalone term for this concept (ORPHA:404440),
    which shows the boundary is genuinely contested at the nosology level.
  evidence:
  - reference: PMID:32793091
    reference_title: SETD5 Gene Haploinsufficiency in Three Patients With Suspected KBG Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whilst there is significant phenotypic overlap between the above-mentioned conditions, however, they still remain distinct clinical entities. This is important for long term support to patients and families, as there are differences and subtleties in both clinical features and neurodevelopmental profiles between these conditions which become apparent only when patients are deeply phenotyped.
    explanation: >-
      Directly argues for keeping the overlapping SETD5 / 3p25.3-deletion / KBG
      entities separate, which is the split rationale adopted here.
  - reference: PMID:24680889
    reference_title: "De novo loss-of-function mutations in SETD5, encoding a methyltransferase in a 3p25 microdeletion syndrome critical region, cause intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The individuals with SETD5 mutations showed phenotypic similarity to those previously reported with a deletion in 3p25, and thus loss of SETD5 might be sufficient to account for many of the clinical features observed in this condition.
    explanation: >-
      States the driver-gene relationship that motivates the lumping argument, kept
      visible alongside the split decision.
  - reference: ORPHA:404440
    reference_title: "OBSOLETE: Intellectual disability-facial dysmorphism syndrome due to SETD5 haploinsufficiency"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      OBSOLETE: Intellectual disability-facial dysmorphism syndrome due to SETD5 haploinsufficiency
    explanation: >-
      Orphanet has retired its standalone term for this concept in the 2025-12-09
      snapshot. This is recorded as PARTIAL because obsoleting an Orphanet code is a
      nosology-management action whose rationale is not stated in the record; it shows
      the boundary is contested but does not by itself argue for lumping.
  attaches_to:
  - "pathophysiology#SETD5 Haploinsufficiency"
- discussion_id: gap_setd5_catalytic_activity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is SETD5 itself a catalytically active histone methyltransferase, or does it act
    principally as a scaffold within HDAC3- and PAF1-containing complexes?
  rationale: >-
    The mechanism nodes in this entry deliberately avoid asserting a settled enzymatic
    defect. One study demonstrates that SETD5 directly deposits H3K36me3, while other
    groups describe the direct methyltransferase activity as debated and emphasize
    scaffolding through HDAC-containing complexes. The answer matters because it
    determines whether a catalytic-rescue therapeutic strategy is even conceptually
    available.
  evidence:
  - reference: PMID:37264456
    reference_title: SETD5 haploinsufficiency affects mitochondrial compartment in neural cells.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The direct function of SETD5 as histone methyltransferase activity is debated
    explanation: >-
      States the open question directly.
  - reference: PMID:31515109
    reference_title: SETD5 Regulates Chromatin Methylation State and Preserves Global Transcriptional Fidelity during Brain Development and Neuronal Wiring.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Notably, we demonstrated that SETD5 directly deposits H3K36me3, which is essential to allow on-time RNA elongation dynamics.
    explanation: >-
      Presents the opposing evidence that SETD5 does deposit the mark directly.
  attaches_to:
  - "pathophysiology#Impaired H3K36 Methylation and Chromatin Regulation"
- discussion_id: mismatch_setd5_mitochondrial_hierarchy
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the mitochondrial fragmentation and bioenergetic deficits seen in Setd5+/- mouse
    neural cells occur in human SETD5-haploinsufficient neurons, and where do they sit
    in the causal hierarchy of the human disease?
  rationale: >-
    The mitochondrial phenotype is well characterized in mouse neural stem cells,
    neurons, and cortex, but has not been demonstrated in human patient-derived neural
    cells, and the authors explicitly state that they can only speculate about its
    position in the pathological hierarchy. Whether it is a driver, a parallel
    consequence of transcriptional dysregulation, or an epiphenomenon determines
    whether mitochondrial-targeted intervention is worth pursuing.
  evidence:
  - reference: PMID:37264456
    reference_title: SETD5 haploinsufficiency affects mitochondrial compartment in neural cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found several defects in the mitochondrial compartment; however, we can only speculate about their position in the hierarchy of the pathological mechanisms at the basis of the disease.
    explanation: >-
      The authors' own statement of the translational and causal uncertainty.
  - reference: PMID:37264456
    reference_title: SETD5 haploinsufficiency affects mitochondrial compartment in neural cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We investigated in vitro neural stem cells as well as the brain of the Setd5 haploinsufficiency mouse model interrogating its transcriptome, analyzing mitochondrial structure, biochemical composition, and dynamics, as well as mitochondrial functionality.
    explanation: >-
      Establishes that the evidence base is entirely a mouse model plus derived neural
      stem cells, not human patient tissue.
  proposed_experiments:
  - experiment_id: exp_setd5_patient_ipsc_mitochondrial_phenotyping
    name: Patient-derived iPSC neural mitochondrial phenotyping
    description: >-
      Derive iPSC neural progenitors and cortical neurons from individuals with
      confirmed SETD5 loss-of-function variants alongside isogenic corrected controls,
      and measure mitochondrial morphology, membrane potential, ATP production, and
      axonal/synaptic mitochondrial localization. This tests whether the mouse
      mitochondrial phenotype is reproduced in human SETD5-haploinsufficient neurons.
  - experiment_id: exp_setd5_mitochondrial_epistasis
    name: Epistasis test placing the mitochondrial defect in the causal hierarchy
    description: >-
      Determine whether restoring rDNA output (for example by TIP5 ablation, which
      already rescues the proliferation defect) or correcting RNA polymerase II
      elongation also rescues the mitochondrial phenotype. Rescue would place the
      mitochondrial defect downstream of transcriptional dysregulation; failure to
      rescue would place it in a parallel branch.
  attaches_to:
  - "pathophysiology#Mitochondrial Fragmentation and Bioenergetic Deficit in Neural Cells"
- discussion_id: gap_setd5_penetrance_modifiers
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What determines whether a carrier of a SETD5 loss-of-function variant is severely
    affected, mildly affected, or clinically unaffected?
  rationale: >-
    Penetrance is incomplete and expressivity is highly variable: an apparently
    unaffected carrier mother, a carrier mother of normal intelligence with two
    affected twin sons, and a transmitting father with only mild intellectual
    impairment have all been reported, while the same class of truncating variant
    produces moderate-to-severe intellectual disability in others. No modifier -
    genetic background, variant position, transcript usage, sex, or mosaicism - has
    been established. This directly affects genetic counseling and recurrence-risk
    communication.
  evidence:
  - reference: PMID:28881385
    reference_title: "Expansion and further delineation of the SETD5 phenotype leading to global developmental delay, variable dysmorphic features, and reduced penetrance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest that the phenotype of SETD5 is more complex and variable than previously presented.
    explanation: >-
      States the variability problem that this gap addresses.
  - reference: PMID:27375234
    reference_title: SETD5 loss-of-function mutation as a likely cause of a familial syndromic intellectual disability with variable phenotypic expression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, the father demonstrated only mild intellectual impairment.
    explanation: >-
      Documents a minimally affected transmitting parent within a family carrying the
      same variant as more severely affected children.
  attaches_to:
  - "pathophysiology#SETD5 Haploinsufficiency"
- discussion_id: gap_setd5_moyamoya_surveillance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is cerebrovascular imaging surveillance for moyamoya angiopathy warranted in
    individuals with pathogenic SETD5 variants?
  rationale: >-
    Bilateral moyamoya angiopathy has been reported with a de novo SETD5 frameshift
    variant and with two rare SETD5 missense variants, but the ascertainment ran from
    moyamoya cohorts to variants rather than the reverse, and the authors state that
    the SETD5-moyamoya association still requires validation and that penetrance must
    be assessed before imaging can be recommended. Because moyamoya causes childhood
    strokes and is treatable, resolving this is clinically consequential.
  evidence:
  - reference: PMID:31474762
    reference_title: "The pleiotropy associated with de novo variants in CHD4, CNOT3, and SETD5 extends to moyamoya angiopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional studies to assess the penetrance of MMA are required before we can recommend imaging for all the patients carrying de novo variants in CHD4, CNOT3, and SETD5
    explanation: >-
      The authors explicitly frame surveillance as an unresolved question pending
      penetrance data.
  - reference: PMID:31474762
    reference_title: "The pleiotropy associated with de novo variants in CHD4, CNOT3, and SETD5 extends to moyamoya angiopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data indicate that rare variants in CHD4 and CNOT3 predispose to MMA in the presence and absence of DD; additional data are required to validate an association between SETD5 rare variants and MMA.
    explanation: >-
      Distinguishes the validated CHD4/CNOT3 associations from the still-unvalidated
      SETD5 association.
  attaches_to:
  - "pathophysiology#Extra-Neural Developmental Involvement"

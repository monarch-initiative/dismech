  biological_scale: ORGANISM
  description: >-
    Beyond the nervous system, SETD5 haploinsufficiency is associated with skeletal
    anomalies (scoliosis, kyphosis, leg-length discrepancy), congenital heart defects,
    gastrointestinal and abdominal-wall anomalies, inguinal hernia, and hypospadias.

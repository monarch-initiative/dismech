name: SETD5 Haploinsufficiency Syndrome
creation_date: "2026-07-31T18:30:00Z"
category: Mendelian
synonyms:
- intellectual disability-facial dysmorphism syndrome due to SETD5 haploinsufficiency
- MRD23
- intellectual developmental disorder, autosomal dominant 23
- autosomal dominant intellectual disability 23
- SETD5-related neurodevelopmental disorder
- SETD5 disorder
description: >-
  Intellectual disability-facial dysmorphism syndrome due to SETD5
  haploinsufficiency (MRD23; OMIM 615761) is an autosomal dominant
  neurodevelopmental disorder caused by heterozygous loss-of-function variants in
  SETD5 (HGNC:25566), which encodes a SET domain-containing chromatin regulator at
  3p25.3. Truncating variants trigger nonsense-mediated decay, so haploinsufficiency
  is the disease mechanism. The core phenotype is global developmental delay with
  disproportionate speech and language impairment, intellectual disability of
  variable severity, autism spectrum and other behavioral or psychiatric features,
  hypotonia and gait abnormality, and a recognizable but non-specific facial gestalt
  (prominent high forehead, full or synophrys-like eyebrows, long tubular nose,
  upslanting palpebral fissures, large low-set ears, long philtrum, thin upper lip).
  Skeletal anomalies, congenital heart defects, gastrointestinal and genitourinary
  anomalies, and epilepsy occur in a minority. Penetrance is incomplete and
  expressivity is variable, including mildly affected or apparently unaffected
  transmitting parents.

  Entity scope (NEC boundary, see `discussions`): this entry covers the single-gene
  SETD5 disorder caused by an intragenic SETD5 sequence variant. It is deliberately
  kept distinct from (i) the contiguous 3p25.3/3p- microdeletion syndrome, in which
  SETD5 is regarded as the principal driver of the neurodevelopmental core but where
  additional deleted genes can contribute, and (ii) the paralogue-adjacent chromatin
  disorders it is most often confused with - SETD2 (Luscan-Lumish syndrome), SETD1A,
  SETD1B, and the physically neighbouring SETBP1 (Schinzel-Giedion syndrome and
  SETBP1 haploinsufficiency disorder) - which are separate gene-disease entities and
  are handled here only as differential diagnoses.

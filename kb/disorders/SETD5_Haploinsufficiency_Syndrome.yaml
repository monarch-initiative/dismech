- name: Genetic Counseling
  description: >-
    Counseling should cover autosomal dominant inheritance, the usual de novo
    occurrence, the 50% transmission risk from an affected individual, and - critically
    for this disorder - incomplete penetrance, since apparently unaffected and mildly
    affected carrier parents have been documented. Parental testing is therefore
    important before assuming de novo status.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240

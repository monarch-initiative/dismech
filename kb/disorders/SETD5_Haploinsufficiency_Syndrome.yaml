      counseling.
animal_models:
- species: Mouse
  genotype: Setd5 heterozygous null (Setd5+/-)
  description: >-
    The Setd5 null mouse is embryonic lethal; the heterozygote is viable and is the
    principal model. It reproduces cognitive impairment, behavioral inflexibility,
    delayed ultrasonic vocalization ontogeny, altered social recognition, hyperactivity,
    reduced synaptic density and cortical network hypoconnectivity, a deep-layer
    cortical neuron deficit, MRI-detectable brain anatomical differences, neural crest
    defect-associated phenotypes, and mitochondrial fragmentation with reduced ATP
    production.
  genes:
  - preferred_term: SETD5
    term:
      id: hgnc:25566
      label: SETD5
  associated_phenotypes:
  - Cognitive impairment and behavioral inflexibility
  - Delayed ontogenetic profile of ultrasonic vocalization
  - Reduced synaptic density and cortical network hypoconnectivity
  - Deficit of deep-layer cortical neurons

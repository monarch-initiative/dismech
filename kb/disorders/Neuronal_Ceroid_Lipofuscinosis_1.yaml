references:
- reference: PMID:10191108
  title: "A rapid fluorogenic palmitoyl-protein thioesterase assay: pre- and postnatal diagnosis of INCL."
  findings:
  - statement: Fluorogenic palmitoyl-protein thioesterase enzyme testing demonstrates profound PPT1 deficiency in leukocytes, fibroblasts, plasma, cerebrospinal fluid, and prenatal cells across infantile and variant juvenile CLN1 presentations.
- reference: PMID:20301601
  title: "Neuronal Ceroid Lipofuscinoses Overview."
  tags:
  - GeneReviews
  findings: []
- reference: PMID:23838030
  title: "Classification and natural history of the neuronal ceroid lipofuscinoses."
  findings:
  - statement: Classic infantile CLN1 begins between 6 and 24 months with rapid psychomotor regression, ataxia, myoclonus, seizures, and visual failure.
  - statement: Early-stage classic CLN1 exhibits early electroretinogram extinction and generalized cerebral atrophy with thalamic and basal ganglia T2 hypointensity.
  - statement: Later-onset CLN1 phenotypes have more protracted courses but still progress to premature death.
- reference: PMID:24997880
  title: "Oral cysteamine bitartrate and N-acetylcysteine for patients with infantile neuronal ceroid lipofuscinosis: a pilot study."
  findings:
  - statement: Pilot combination therapy with oral cysteamine bitartrate and N-acetylcysteine (NCT00028262) depleted leukocyte granular osmiophilic deposits and delayed progression to isoelectric EEG without arresting brain atrophy or retinal degeneration.
  - statement: Longitudinal assessment of infantile CLN1 documented progressive cerebral atrophy, electronegative electroretinogram decline, decelerating head growth, and feeding difficulties requiring gastrostomy.
- reference: PMID:34000449
  title: "Management of CLN1 Disease: International Clinical Consensus."
  findings:
  - statement: CLN1 disease causes developmental delay, psychomotor regression, seizures, ataxia, movement disorders, visual impairment, and early death.
- reference: PMID:38211816
  title: "Disruption of lysosomal nutrient sensing scaffold contributes to pathogenesis of a fatal neurodegenerative lysosomal storage disease."
  findings:
  - statement: CLN1 disease is caused by CLN1/PPT1 loss of function.
  - statement: PPT1 catalyzes depalmitoylation of S-palmitoylated proteins.
- reference: PMID:38798824
  title: "Akap5 links synaptic dysfunction to neuroinflammatory signaling in a mouse model of infantile neuronal ceroid lipofuscinosis."
  findings:
  - statement: CLN1 neurons accumulate autofluorescent lysosomal storage material.
  - statement: PPT1 loss disrupts synaptic protein trafficking and neuroinflammatory signaling.
- reference: PMID:40333988
  title: "Niemann Pick C1 mistargeting disrupts lysosomal cholesterol homeostasis contributing to neurodegeneration in a Batten disease model."
  findings:
  - statement: PPT1 deficiency misroutes NPC1 and activates mTORC1 through lysosomal cholesterol dysregulation.
- reference: clinicaltrials:NCT00028262
  title: "A Combination Therapy With Cystagon and N-Acetylcysteine for INCL Patients"
  findings:
  - statement: Completed ClinicalTrials.gov trial evaluating oral Cystagon (cysteamine bitartrate) plus N-acetylcysteine in children with infantile neuronal ceroid lipofuscinosis.
- reference: clinicaltrials:NCT00337636
  title: "A Phase I Study of the Safety and Preliminary Effectiveness of Human CNS Stem Cells (HuCNS-SC) in Patients With Neuronal Ceroid Lipofuscinosis Caused by Palmitoyl Protein Thioesterase 1 (PPT1) or Tripeptidyl Peptidase 1 (TPP-I) Deficiency"
  findings:
  - statement: Completed Phase I trial evaluating intracerebral transplantation of human CNS stem cells with temporary immunosuppression in PPT1- and TPP1-deficient NCL.

diagnosis:
- name: PPT1 Enzymatic Activity Assay
  description: >-
    Fluorometric biochemical assay of palmitoyl-protein thioesterase 1 (PPT1)
    demonstrates profoundly deficient enzymatic activity in leukocytes,
    fibroblasts, plasma, cerebrospinal fluid, or prenatal samples across
    infantile and variant juvenile CLN1 presentations.
  diagnosis_term:
    preferred_term: enzyme activity assay
    term:
      id: NCIT:C64430
      label: Protein or Enzyme Type Measurement
  presence: Deficient palmitoyl-protein thioesterase 1 activity
  notes: >-
    An OLS search of NCIT for "enzyme activity assay" and "palmitoyl-protein
    thioesterase" returned analyte-specific LOINC concepts (such as lactate
    dehydrogenase activity) and the general property term NCIT:C180567 (Enzyme
    Activity) rather than a generic diagnostic enzyme-activity assay procedure,
    so NCIT:C64430 (Protein or Enzyme Type Measurement) is retained to match
    sibling NCL curation.
  evidence:
  - reference: PMID:10191108
    reference_title: "A rapid fluorogenic palmitoyl-protein thioesterase assay: pre- and postnatal diagnosis of INCL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PPT activity was readily detectable in fibroblasts, leukocytes, amniotic fluid cells, chorionic villi, plasma, and cerebrospinal fluid from controls. PPT activity was profoundly deficient in these tissues and fluids from INCL patients."
    explanation: >-
      Demonstrates diagnostic measurement of profoundly deficient PPT1 enzymatic
      activity across leukocytes, fibroblasts, plasma, CSF, and prenatal tissues
      in INCL patients.
  - reference: PMID:10191108
    reference_title: "A rapid fluorogenic palmitoyl-protein thioesterase assay: pre- and postnatal diagnosis of INCL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similarly, a deficiency of PPT activity was demonstrated in patients with the variant juvenile NCL with GROD. These results show the feasibility of rapid pre- and postnatal diagnosis of INCL and its variants."
    explanation: >-
      Confirms diagnostic utility of fluorogenic PPT1 enzyme activity testing
      across infantile and later-onset variant CLN1 disease.
  - reference: PMID:23838030
    reference_title: "Classification and natural history of the neuronal ceroid lipofuscinoses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In all forms of CLN1 disease, granular osmiophilic deposits are present on electron microscopy and correlate with palmitoyl-protein thioesterase 1 deficiency."
    explanation: >-
      Confirms that PPT1 enzyme deficiency correlates with CLN1 pathology across
      all age-at-onset forms.

      Establishes PPT1/CLN1 molecular testing within the core diagnostic gene
      set for neuronal ceroid lipofuscinosis.
- name: Ultrastructural Electron Microscopy for Granular Osmiophilic Deposits
  description: >-
    Transmission electron microscopy of peripheral or neural tissue demonstrates
    characteristic granular osmiophilic deposits (GRODs) across infantile,
    late-infantile, juvenile, and adult CLN1 presentations.
  diagnosis_term:
    preferred_term: transmission electron microscopy
    term:
      id: NCIT:C18216
      label: Transmission Electron Microscopy
  presence: Granular osmiophilic deposits
  evidence:
  - reference: PMID:23838030
    reference_title: "Classification and natural history of the neuronal ceroid lipofuscinoses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In all forms of CLN1 disease, granular osmiophilic deposits are present on electron microscopy and correlate with palmitoyl-protein thioesterase 1 deficiency."
    explanation: >-
      Demonstrates that electron microscopy detects granular osmiophilic
      deposits across all clinical forms of CLN1 disease.
- name: Brain Magnetic Resonance Imaging
  description: >-
    Brain MRI in early-stage classic CLN1 disease demonstrates generalized
    cerebral atrophy accompanied by T2 hypointensity of the thalamus and basal
    ganglia.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  presence: Generalized cerebral atrophy with thalamic and basal ganglia T2 hypointensity
  evidence:
  - reference: PMID:23838030
    reference_title: "Classification and natural history of the neuronal ceroid lipofuscinoses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the early stages there is generalized cerebral atrophy, and hypointensity on T2-weighted images of thalamus and basal ganglia."
    explanation: >-
      Documents the characteristic early-stage neuroimaging findings on T2
      brain MRI in CLN1 disease.
treatments:
- name: Individualized Multidisciplinary Supportive and Palliative Care
  description: >-
    No curative disease-modifying therapy is approved for CLN1 disease.
    International clinical consensus recommends family-centered,
    multidisciplinary supportive and palliative management adapted across
    disease progression to address seizures, movement disorders, feeding, and
    quality of life.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:34000449
    reference_title: "Management of CLN1 Disease: International Clinical Consensus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A family-centered approach is supported, and individualized, multidisciplinary care is emphasized in the recommendations."
    explanation: >-
      International clinical consensus establishes individualized,
      multidisciplinary supportive care as the standard of management for CLN1
      disease.
  - reference: PMID:34000449
    reference_title: "Management of CLN1 Disease: International Clinical Consensus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Goals and strategies should be periodically reevaluated and adapted to patients' current needs, with a primary aim of optimizing patient and family quality of life."
    explanation: >-
      Supports longitudinal adaptation of supportive and palliative care goals
      to optimize quality of life in CLN1 disease.
- name: Experimental hematopoietic stem/progenitor cell gene therapy
  description: >
    Lentiviral hPPT1-overexpressing HSPC therapy is a preclinical,
    disease-targeted strategy for CLN1. It is not established clinical care, but
    it supports the biological plausibility of PPT1 restoration.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: PPT1 lysosomal depalmitoylation failure
    treatment_effect: RESTORES
    description: >-
      Transplanted HSPCs overexpressing human PPT1 engraft in the CNS as
      microglia-like progeny and restore PPT1 enzymatic activity.
  evidence:
  - reference: PMID:36876653
    reference_title: "An innovative hematopoietic stem cell gene therapy approach benefits CLN1 disease in the mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "transplantation of HSPCs over-expressing hPPT1 by lentiviral gene transfer enhances the therapeutic benefit of HSPCs transplant"
    explanation: >-
      Mouse-model data support PPT1-restoring HSPC gene therapy as a
      disease-targeted experimental CLN1 strategy.
notes: >-
  GeneReviews lists only the umbrella chapter Neuronal Ceroid Lipofuscinoses
  Overview (PMID:20301601, NBK1428), which caches in Bookshelf as a brief
  purpose statement without clinical characteristics, and no dedicated
  PPT1/CLN1-specific GeneReviews chapter exists; clinical phenotype and
  diagnostic coverage is therefore anchored on NCL natural-history and CLN1
  international consensus literature (PMID:23838030, PMID:34000449,
  PMID:35628533).

  description: >-
    No curative disease-modifying therapy is approved for CLN1 disease.
    International clinical consensus recommends family-centered,
    multidisciplinary supportive and palliative management adapted across
    disease progression to address seizures, movement disorders, feeding, and
    quality of life.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:34000449
    reference_title: "Management of CLN1 Disease: International Clinical Consensus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A family-centered approach is supported, and individualized, multidisciplinary care is emphasized in the recommendations."
    explanation: >-
      International clinical consensus establishes individualized,
      multidisciplinary supportive care as the standard of management for CLN1
      disease.
  - reference: PMID:34000449
    reference_title: "Management of CLN1 Disease: International Clinical Consensus."
    supports: SUPPORT
    evidence_source: OTHER

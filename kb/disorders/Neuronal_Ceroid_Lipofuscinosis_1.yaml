    explanation: >-
      Supports longitudinal adaptation of supportive and palliative care goals
      to optimize quality of life in CLN1 disease.
- name: Investigational Oral Cysteamine Bitartrate and N-Acetylcysteine Combination Therapy
  description: >-
    Repurposed combination pharmacotherapy with oral cysteamine bitartrate
    (Cystagon) and N-acetylcysteine evaluated in an open-label pilot trial
    (NCT00028262) in children with infantile CLN1 disease. Both nucleophilic,
    antioxidant small molecules cleave S-acyl thioester linkages
    non-enzymatically; treatment depleted peripheral leukocyte granular
    osmiophilic deposits and delayed time to isoelectric EEG, but did not halt
    progressive brain atrophy, retinal degeneration, or developmental loss.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cysteamine
      term:
        id: CHEBI:17141
        label: cysteamine
    - preferred_term: N-acetyl-L-cysteine
      term:
        id: CHEBI:28939
        label: N-acetyl-L-cysteine
  target_mechanisms:
  - target: PPT1 lysosomal depalmitoylation failure
    treatment_effect: BYPASSES
    description: >-
      Cysteamine and N-acetylcysteine act as nucleophilic thioester-cleaving and
      antioxidant small molecules that bypass PPT1 enzymatic deficiency to
      deplete ceroid granular osmiophilic deposits in peripheral leukocytes.
    evidence:
    - reference: PMID:24997880
      reference_title: "Oral cysteamine bitartrate and N-acetylcysteine for patients with infantile neuronal ceroid lipofuscinosis: a pilot study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Nevertheless, in all of our patients a combination of these drugs mediated depletion of GRODs. It is possible that some of these effects are due to the combination of nucleophilic and anti-oxidant effects of these drugs."
      explanation: >-
        Demonstrates that combined cysteamine bitartrate and N-acetylcysteine
        depletes ceroid storage (GRODs) in INCL patients via nucleophilic and
        antioxidant activity.
  evidence:
  - reference: PMID:24997880
    reference_title: "Oral cysteamine bitartrate and N-acetylcysteine for patients with infantile neuronal ceroid lipofuscinosis: a pilot study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the first follow-up visit, peripheral leukocytes in all nine patients showed virtually complete depletion of GRODs."
    explanation: >-
      Documents complete peripheral leukocyte GROD depletion in nine children
      treated with oral cysteamine bitartrate and N-acetylcysteine.
  - reference: PMID:24997880
    reference_title: "Oral cysteamine bitartrate and N-acetylcysteine for patients with infantile neuronal ceroid lipofuscinosis: a pilot study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the children acquired new developmental skills, and their retinal function decreased progressively. Average time to isoelectric EEG (52 months, SD 13) was longer than reported previously (36 months)."
    explanation: >-
      Records both the modest delay in progression to isoelectric EEG and the
      continued retinal and developmental decline despite therapy.
  - reference: clinicaltrials:NCT00028262
    reference_title: "A Combination Therapy With Cystagon and N-Acetylcysteine for INCL Patients"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study will examine the effectiveness of a drug called Cystagon in treating infantile neuronal ceroid lipofuscinosis (INCL), a progressive neurological disease affecting children."
    explanation: >-
      ClinicalTrials.gov record for the completed NIH combination trial of
      Cystagon and N-acetylcysteine in infantile CLN1 disease.
- name: Experimental hematopoietic stem/progenitor cell gene therapy
  description: >
    Lentiviral hPPT1-overexpressing HSPC therapy is a preclinical,
    disease-targeted strategy for CLN1. It is not established clinical care, but
    it supports the biological plausibility of PPT1 restoration.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: PPT1 lysosomal depalmitoylation failure
    treatment_effect: RESTORES
    description: >-
      Transplanted HSPCs overexpressing human PPT1 engraft in the CNS as
      microglia-like progeny and restore PPT1 enzymatic activity.
    evidence:
    - reference: PMID:36876653
      reference_title: "An innovative hematopoietic stem cell gene therapy approach benefits CLN1 disease in the mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "transplantation of HSPCs over-expressing hPPT1 by lentiviral gene transfer enhances the therapeutic benefit of HSPCs transplant"
      explanation: >-
        Supports lentiviral hPPT1 delivery via CNS-engrafting HSPCs to restore
        deficient PPT1 activity in the CLN1 mouse model.
  evidence:
  - reference: PMID:36876653
    reference_title: "An innovative hematopoietic stem cell gene therapy approach benefits CLN1 disease in the mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "transplantation of HSPCs over-expressing hPPT1 by lentiviral gene transfer enhances the therapeutic benefit of HSPCs transplant"
    explanation: >-
      Mouse-model data support PPT1-restoring HSPC gene therapy as a
      disease-targeted experimental CLN1 strategy.
clinical_trials:
- name: NCT00028262
  phase: PHASE_IV
  status: COMPLETED
  description: >-
    Open-label NIH pilot trial of oral cysteamine bitartrate (Cystagon,
    60 mg/kg/day) combined with oral N-acetylcysteine (60 mg/kg/day) in 10
    enrolled children (9 evaluable) with infantile CLN1 disease carrying severe
    PPT1 mutations. Treatment achieved near-complete depletion of peripheral
    leukocyte granular osmiophilic deposits and delayed progression to
    isoelectric EEG relative to historical natural history, without halting
    cerebral atrophy or retinal degeneration (published in PMID:24997880).
  evidence:
  - reference: clinicaltrials:NCT00028262
    reference_title: "A Combination Therapy With Cystagon and N-Acetylcysteine for INCL Patients"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study will examine the effectiveness of a drug called Cystagon in treating infantile neuronal ceroid lipofuscinosis (INCL), a progressive neurological disease affecting children."
    explanation: >-
      ClinicalTrials.gov registry summary for the completed NIH Cystagon and
      N-acetylcysteine trial in infantile CLN1 disease.
  - reference: PMID:24997880
    reference_title: "Oral cysteamine bitartrate and N-acetylcysteine for patients with infantile neuronal ceroid lipofuscinosis: a pilot study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest that combination therapy with cysteamine bitartrate and N-acetylcysteine is associated with delay of isoelectric EEG, depletion of GRODs, and subjective benefits as reported by parents and physicians."
    explanation: >-
      Peer-reviewed report of NCT00028262 outcomes in nine evaluable children
      with infantile CLN1 disease.
- name: NCT00337636
  phase: PHASE_I
  status: COMPLETED
  description: >-
    Open-label Phase I safety and preliminary effectiveness study of surgical
    intracerebral transplantation of human central nervous system stem cells
    (HuCNS-SC) with 12 months of post-transplant immunosuppression in children
    with infantile or late-infantile NCL caused by PPT1 (CLN1) or TPP1 (CLN2)
    deficiency.
  evidence:
  - reference: clinicaltrials:NCT00337636
    reference_title: "A Phase I Study of the Safety and Preliminary Effectiveness of Human CNS Stem Cells (HuCNS-SC) in Patients With Neuronal Ceroid Lipofuscinosis Caused by Palmitoyl Protein Thioesterase 1 (PPT1) or Tripeptidyl Peptidase 1 (TPP-I) Deficiency"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Participation in this study will involve screening assessments, surgery to implant HuCNS-SC, medication to suppress the immune system, and a series of follow-up assessments."
    explanation: >-
      ClinicalTrials.gov registry summary for the Phase I HuCNS-SC intracerebral
      transplantation trial in PPT1- and TPP1-deficient NCL.
notes: >-
  GeneReviews lists only the umbrella chapter Neuronal Ceroid Lipofuscinoses
  Overview (PMID:20301601, NBK1428), which caches in Bookshelf as a brief
  purpose statement without clinical characteristics, and no dedicated
  PPT1/CLN1-specific GeneReviews chapter exists; clinical phenotype and
  diagnostic coverage is therefore anchored on NCL natural-history and CLN1
  international consensus literature (PMID:23838030, PMID:34000449,
  PMID:35628533).

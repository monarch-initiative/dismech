  - reference: PMID:26129644
    reference_title: "Identification of a novel mutation in RIPK4 in a kindred with phenotypic features of Bartsocas-Papas and CHAND syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, however, our patients did not have cleft lip/palate, a
      common feature encountered in Bartsocas-Papas syndrome.
    explanation: >-
      Absence of clefting in the RIPK4-confirmed CHAND family.
diagnosis:
- name: Clinical Recognition and Molecular Genetic Testing
  description: >-
    The diagnosis is suspected in a child born with ankyloblepharon who has
    curly, sparse hair and dysplastic nails without orofacial clefting, and is
    confirmed by finding biallelic pathogenic RIPK4 variants. TP63 should be
    tested as well, since AEC syndrome is the main differential and the
    clinical overlap is large; the RIPK4 gene was found only after TP63 had
    been excluded. Clinical classification alone is unreliable across this
    group of ectodermal dysplasias.
  evidence:
  - reference: PMID:26129644
    reference_title: "Identification of a novel mutation in RIPK4 in a kindred with phenotypic features of Bartsocas-Papas and CHAND syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings indicate that making an accurate diagnosis based only on the
      prevailing clinical symptoms is challenging.
    explanation: >-
      Supports molecular confirmation over clinical classification.
  - reference: PMID:15347331
    reference_title: "Ectodermal dysplasia showing clinical overlap between AEC, Rapp-Hodgkin and CHAND syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case highlights the difficulties in trying to classify the ectodermal
      dysplasia syndromes on clinical features alone.
    explanation: >-
      Clinical overlap between CHAND, AEC and Rapp-Hodgkin syndromes.
treatments:
- name: Surgical Separation of Ankyloblepharon
  description: >-
    The fused eyelid margins are separated surgically, typically in early
    infancy. Management is otherwise supportive; there is no disease-modifying
    therapy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical division of eyelid adhesion
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:29440852
    reference_title: "Rare Variant of Ankyloblepharon-ectodermal Defect-cleft Lip/Cleft Palate Syndrome: Curly Hair-ankyloblepharon-nail Disease Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Parents gave history that at the time of birth, her both eyelids were
      fused partially, which was surgically corrected by an ophthalmologist at
      1 month of age.
    explanation: >-
      Surgical correction of ankyloblepharon in infancy in a CHAND patient.
  target_mechanisms:
  - target: Ankyloblepharon
    description: >-
      Mechanically separates the fused lid margins; it does not address the
      underlying RIPK4 defect.
animal_models:
- name: Ripk4 knockout mouse
  species: Mouse
  genotype: Ripk4(-/-)
  publication: PMID:12194825
  description: >-
    Constitutive Ripk4 knockout. The mice die perinatally with abnormal
    epidermal differentiation and fusion of external orifices. As a null, it
    models the severe end of the RIPK4 allelic series (Bartsocas-Papas
    syndrome) more closely than the hypomorphic CHAND genotype.
  modeled_mechanisms:
  - target: Defective Keratinocyte Differentiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Shows that RIPK4 is required cell autonomously for keratinocyte
      differentiation.
    limitations: >-
      Complete loss of Ripk4 in mouse, whereas CHAND patients are homozygous for
      a missense variant outside the kinase domain that is proposed to be
      hypomorphic; the mouse phenotype is lethal and broader than CHAND.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse skin and hair follicle biology differ from human, and the eyelids
        of mice are physiologically fused at birth, so the human ankyloblepharon
        cannot be read directly from mouse eyelid status.
    evidence:
    - reference: PMID:12194825
      reference_title: "RIP4 is an ankyrin repeat-containing kinase essential for keratinocyte differentiation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        RIP4 deficiency in mice results in perinatal lethality associated with
        abnormal epidermal differentiation.
      explanation: >-
        The knockout's keratinocyte differentiation defect.
  - target: Periderm Defect and Epithelial Fusion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Ripk4-null embryos show abnormal periderm, apical E-cadherin
      mislocalization and epithelial fusions.
    limitations: >-
      Null allele; the fusions in the knockout are far more extensive than the
      eyelid-limited fusion of CHAND syndrome.
    evidence:
    - reference: PMID:25430793
      reference_title: "A novel RIPK4-IRF6 connection is required to prevent epithelial fusions characteristic for popliteal pterygium syndromes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Receptor-interacting protein kinase 4 (RIPK4)-deficient mice have
        epidermal defects and fusion of all external orifices.
      explanation: >-
        Epithelial fusion phenotype of the knockout.
discussions:
- discussion_id: chand_versus_ripk4_spectrum
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#
  prompt: >-
    Is CHAND syndrome a distinct disease or the mild end of a single RIPK4
    spectrum that runs through attenuated Bartsocas-Papas syndrome to the lethal
    pterygium phenotype?
  rationale: >-
    Molecular evidence for CHAND syndrome rests on two families with the same
    homozygous variant, p.Glu284Lys. Attenuated RIPK4 cases without pterygia
    have also been reported under the Bartsocas-Papas name, and their phenotype
    (ankyloblepharon, sparse hair, dysplastic nails) overlaps CHAND except for
    clefting. The proposed genotype-phenotype rule, kinase-domain variants
    severe and the extra-domain variant mild, has not been tested by measuring
    the activity of p.Glu284Lys. Until it is, whether CHAND deserves its own
    entry or belongs inside a RIPK4-related spectrum entry is open. This entry
    keeps it separate, following MONDO and OMIM.
  evidence:
  - reference: PMID:26129644
    reference_title: "Identification of a novel mutation in RIPK4 in a kindred with phenotypic features of Bartsocas-Papas and CHAND syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data raise the question if CHAND syndrome indeed is a distinct entity.
    explanation: >-
      The discovering authors pose the question directly.
  - reference: PMID:33713555
    reference_title: "A novel homozygous RIPK4 variant in a family with severe Bartsocas-Papas syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RIPK4 variants are associated with a wide range of clinical features
      ranging from milder ectodermal dysplasia to severe BPS.
    explanation: >-
      States the allelic range of RIPK4 phenotypes.
  - reference: PMID:23610050
    reference_title: "Exome analysis in clinical practice: expanding the phenotype of Bartsocas-Papas syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consequently, we expand the phenotype of Bartsocas-Papas syndrome to an
      attenuated presentation resembling Hay-Wells syndrome, lacking lethality
      and pterygia.
    explanation: >-
      An attenuated RIPK4 phenotype without pterygia, reported under the
      Bartsocas-Papas name, that approaches CHAND.
  - reference: PMID:25691407
    reference_title: "Expanding the genetic and phenotypic spectrum of popliteal pterygium disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also demonstrate that mutations in RIPK4 can cause features with a
      range of severity along the PPS-BPS spectrum
    explanation: >-
      Variable severity of RIPK4 disease within the pterygium spectrum.
  - reference: PMID:35220430
    reference_title: "RIPK4 regulates cell-cell adhesion in epidermal development and homeostasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we studied the functional effects of two novel receptor-interacting
      protein kinase 4 (RIPK4) missense mutations identified in siblings with an
      autosomal recessive ED with cutaneous syndactyly, palmoplantar
      hyperkeratosis and orofacial synechiae.
    explanation: >-
      A further recessive RIPK4 ectodermal dysplasia, intermediate between CHAND
      and Bartsocas-Papas syndrome, that fits neither named entity.
  proposed_experiments:
  - experiment_id: ripk4_e284k_activity_assay
    name: p.Glu284Lys kinase and IRF6 activation assay
    description: >-
      Measure RIPK4 p.Glu284Lys kinase activity and its ability to activate
      IRF6 in keratinocytes, alongside kinase-domain Bartsocas-Papas variants,
      to test whether residual activity tracks clinical severity.

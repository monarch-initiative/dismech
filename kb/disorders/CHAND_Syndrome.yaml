name: CHAND Syndrome
creation_date: "2026-10-16T12:00:00Z"
description: >-
  CHAND syndrome (curly hair, ankyloblepharon, nail dysplasia) is a very rare
  autosomal recessive ectodermal dysplasia in which affected children are born
  with partial fusion of the eyelid margins (ankyloblepharon) and have sparse,
  curly scalp hair and small, dysplastic nails, without the orofacial clefting
  that accompanies ankyloblepharon in AEC (Hay-Wells) syndrome. It was described
  in 1971 as a dominant trait in an inbred family and later reinterpreted as
  recessive. The molecular cause is biallelic variants in RIPK4, a
  serine/threonine kinase with ankyrin repeats that is a direct transcriptional
  target of p63 and phosphorylates IRF6 to drive keratinocyte differentiation.
  The same homozygous RIPK4 missense variant, p.Glu284Lys, lying just outside
  the kinase domain, has been found in both molecularly confirmed CHAND
  families. RIPK4 kinase-domain variants cause Bartsocas-Papas syndrome 1, a
  severe and often lethal popliteal pterygium syndrome, so CHAND is the mild end
  of a RIPK4 allelic series. This entry keeps the two diseases separate; the
  reasoning is in notes and in the discussions section.
synonyms:
- CHANDS
- curly hair-ankyloblepharon-nail dysplasia syndrome
- curly hair, ankyloblepharon, nail dysplasia
category: Genetic
parents:
- Ectodermal Dysplasia
disease_term:
  preferred_term: CHAND syndrome
  term:
    id: MONDO:0008959
    label: CHAND syndrome
notes: >-
  Relationship to Bartsocas-Papas syndrome 1 (MONDO:0009901, also RIPK4). The
  two are allelic: both are autosomal recessive, both are caused by biallelic
  RIPK4 variants, and RIPK4 variants have been reported across a continuous
  range from an ectodermal dysplasia without pterygia to the lethal pterygium
  phenotype. They are nevertheless curated as separate entries rather than
  as a has_subtypes row here. MONDO, OMIM (214350 and 263650) and Orphanet keep
  them as distinct diseases, and MONDO places Bartsocas-Papas syndrome 1 under
  popliteal pterygium syndrome rather than under CHAND. Bartsocas-Papas
  syndrome 1 adds mechanisms that are not true of CHAND (popliteal and other
  pterygia, oral synechiae and filiform bands between the jaws, limb reduction
  and synostosis, genital hypoplasia, perinatal lethality), so it cannot be a
  subtype of an entry whose pathograph must hold for every case. Nesting the
  severe, better-known disease under the name of the milder one would also
  invert their clinical relationship. If the field converges on a single RIPK4
  spectrum, the right container is a gene-named RIPK4 entry or a grouping, not
  this entry. Bartsocas-Papas syndrome 1 has its own curation stub.

  No GeneReviews chapter exists for CHAND syndrome or for RIPK4-related disease;
  the baseline is the primary literature.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The original 1971 family was interpreted as autosomal dominant, but further
    pedigree data from the same consanguineous kindred showed recessive
    inheritance with quasi-dominant transmission through repeated consanguineous
    matings. The molecularly confirmed families are homozygous for a RIPK4
    variant that segregates recessively.
  evidence:
  - reference: PMID:490586
    reference_title: "Re-evaluation of CHANDS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional pedigree data obtained after the original report indicate that
      the mode of inheritance is more likely to be autosomal recessive, with an
      instance of quasi-dominant transmission as a result of multiple
      consanguineous matings in the family.
    explanation: >-
      Revises the inheritance of the original CHANDS family from dominant to
      recessive on extended pedigree data.
  - reference: PMID:26129644
    reference_title: "Identification of a novel mutation in RIPK4 in a kindred with phenotypic features of Bartsocas-Papas and CHAND syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequent analysis of affected and non-affected family members showed
      that mutation c.850G>A (p.Glu284Lys) in RIPK4 was in complete segregation
      with the disease phenotype, in accordance with an autosomal recessive
      inheritance pattern
    explanation: >-
      Molecular confirmation of recessive inheritance in a consanguineous
      Kuwaiti kindred with CHAND syndrome.
genetic:
- name: RIPK4
  gene_term:
    preferred_term: RIPK4
    term:
      id: hgnc:496
      label: RIPK4
  relationship_type: CAUSATIVE
  variants:
  - name: c.850G>A (p.Glu284Lys)
    description: >-
      Homozygous missense variant found in the three affected children of the
      Kuwaiti kindred and in the independent CHAND patient reported by Busa and
      colleagues. It lies just C-terminal to the serine/threonine kinase domain,
      whereas the Bartsocas-Papas syndrome missense variants cluster inside that
      domain; the original authors proposed this location as the reason for the
      milder phenotype. No functional assay of p.Glu284Lys has been reported.
    type: MISSENSE
    evidence:
    - reference: PMID:26129644
      reference_title: "Identification of a novel mutation in RIPK4 in a kindred with phenotypic features of Bartsocas-Papas and CHAND syndromes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Whereas in Bartsocas-Papas syndromes missense mutations are usually
        located within the serin/threonin kinase of RIPK4, the mutation detected
        in our family resides just outside of the kinase domain, which could
        explain the milder phenotype.
      explanation: >-
        Locates p.Glu284Lys outside the kinase domain and states the authors'
        genotype-phenotype hypothesis.
    - reference: PMID:28940926
      reference_title: "Confirmation that RIPK4 mutations cause not only Bartsocas-Papas syndrome but also CHAND syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The patient with CHAND syndrome harbored the same mutation as the one
        identified in the family previously reported.
      explanation: >-
        Independent recurrence of the same homozygous variant in a second CHAND
        patient.
  evidence:
  - reference: PMID:26129644
    reference_title: "Identification of a novel mutation in RIPK4 in a kindred with phenotypic features of Bartsocas-Papas and CHAND syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After exclusion of pathogenic mutations in TP63 we performed homozygosity
      mapping, followed by exome sequencing of one affected individual.
    explanation: >-
      Gene discovery route for CHAND syndrome, after exclusion of the AEC
      syndrome gene.
  - reference: PMID:28940926
    reference_title: "Confirmation that RIPK4 mutations cause not only Bartsocas-Papas syndrome but also CHAND syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We thus confirm the implication of RIPK4 gene in CHAND syndrome in
      addition to Bartsocas-Papas syndrome and discuss genotype/phenotype
      correlations.
    explanation: >-
      Second report confirming RIPK4 as the CHAND syndrome gene.
  notes: >-
    Biallelic RIPK4 variants cause CHAND syndrome. The gene was identified by
    homozygosity mapping and exome sequencing in a consanguineous Kuwaiti
    kindred after TP63, the AEC syndrome gene, had been excluded, and was
    confirmed in an unrelated patient carrying the same homozygous variant. The
    disease-specific evidence is therefore two families sharing one variant. No
    ClinGen gene-disease validity assertion was found for RIPK4 and CHAND
    syndrome, so no gene_disease_validity tier is recorded.
pathophysiology:
- name: RIPK4 Kinase Signaling Deficiency
  biological_scale: MOLECULAR
  description: >-
    RIPK4 is an ankyrin-repeat serine/threonine kinase expressed in
    keratinocytes and required for their differentiation. In CHAND syndrome
    both alleles carry p.Glu284Lys, just outside the kinase domain. The
    kinase-domain variants that cause Bartsocas-Papas syndrome abolish
    catalytic activity in reporter assays; the CHAND variant has not been
    tested, and the proposal that it is a partial loss of function explaining
    the milder phenotype is an inference from its position.
  genes:
  - preferred_term: RIPK4
    term:
      id: hgnc:496
      label: RIPK4
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    description: >-
      Homozygous germline RIPK4 p.Glu284Lys in both molecularly confirmed CHAND
      families.
  molecular_functions:
  - preferred_term: protein serine/threonine kinase activity
    term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:26129644
    reference_title: "Identification of a novel mutation in RIPK4 in a kindred with phenotypic features of Bartsocas-Papas and CHAND syndromes."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alternatively, CHAND and Bartsocas-Papas syndrome might be allelic
      disorders or RIPK4 mutations could confer varying degrees of phenotypic
      severity, depending on their localization within or outside functionally
      important domains.
    explanation: >-
      The CHAND authors' model that the variant's position outside the kinase
      domain gives a lesser degree of RIPK4 dysfunction; a hypothesis, not a
      measurement.
  - reference: PMID:22197489
    reference_title: "Mutations in RIPK4 cause the autosomal-recessive form of popliteal pterygium syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Luciferase reporter assays also demonstrated that these mutations are
      critical for the catalytic activity of RIPK4.
    explanation: >-
      Shows that disease-causing RIPK4 kinase-domain variants (in
      Bartsocas-Papas syndrome) impair catalytic activity; cited as the
      allelic-series anchor for a kinase-signaling defect, not as a measurement
      of p.Glu284Lys.
  notes: >-
    modifier DECREASED rather than LOSS_OF_FUNCTION because the variant is
    proposed to be hypomorphic and no assay of it exists. functional_impact_category
    is left unset on genetic_context for the same reason.
  downstream:
  - target: Impaired p63-RIPK4-IRF6 Differentiation Signaling
    causal_link_type: DIRECT
- name: Impaired p63-RIPK4-IRF6 Differentiation Signaling
  biological_scale: MOLECULAR
  description: >-
    RIPK4 sits in a transcriptional and signaling axis of surface ectoderm. p63,
    the master regulator of stratified epithelia mutated in AEC syndrome,
    directly activates RIPK4 transcription. RIPK4 in turn phosphorylates IRF6,
    the transcription factor mutated in Van der Woude and popliteal pterygium
    syndromes, at Ser413 and Ser424, activating it and moving it into the
    nucleus, where it induces the differentiation regulators GRHL3 and OVOL1.
    Loss of RIPK4 therefore weakens the IRF6-dependent differentiation
    program. This shared axis is why CHAND syndrome overlaps clinically with
    AEC syndrome (ankyloblepharon, ectodermal dysplasia) and why the RIPK4 and
    IRF6 pterygium syndromes resemble each other.
  genes:
  - preferred_term: RIPK4
    term:
      id: hgnc:496
      label: RIPK4
  biological_processes:
  - preferred_term: keratinocyte differentiation
    term:
      id: GO:0030216
      label: keratinocyte differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:22197488
    reference_title: "Exome sequence identifies RIPK4 as the Bartsocas-Papas syndrome locus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We have further demonstrated that RIPK4 is a direct transcriptional target
      of the protein p63, a master regulator of stratified epithelial
      development
    explanation: >-
      Places RIPK4 downstream of p63, the AEC syndrome gene, explaining the
      CHAND-AEC phenotypic overlap.
  - reference: PMID:25246526
    reference_title: "Receptor-interacting protein kinase 4 and interferon regulatory factor 6 function as a signaling axis to regulate keratinocyte differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Gene knockdown and overexpression studies indicated that the RIPK4-IRF6
      signaling axis controls the expression of key transcriptional regulators
      of keratinocyte differentiation, including Grainyhead-like 3 and OVO-like
      1.
    explanation: >-
      Defines the RIPK4-IRF6 axis and its downstream differentiation
      regulators in keratinocytes.
  - reference: PMID:25246526
    reference_title: "Receptor-interacting protein kinase 4 and interferon regulatory factor 6 function as a signaling axis to regulate keratinocyte differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Gene promoter reporter and in vitro kinase assays, coimmunoprecipitation
      experiments, and confocal microscopy demonstrated that RIPK4 directly
      regulates IRF6 trans-activator activity and nuclear translocation.
    explanation: >-
      Shows that RIPK4 directly activates IRF6, the step lost when RIPK4 kinase
      signaling fails.
  downstream:
  - target: Defective Keratinocyte Differentiation
    causal_link_type: DIRECT
- name: Defective Keratinocyte Differentiation
  biological_scale: CELLULAR
  description: >-
    Without RIPK4, keratinocytes do not complete their differentiation program.
    Ripk4-null mice die perinatally with abnormal epidermal differentiation, the
    defect is cell autonomous to the keratinocyte lineage, and Ripk4-null skin
    grafted onto a normal host develops abnormal hair follicles and epidermal
    dysplasia. In the human disease this is the cellular basis for dysplasia of
    the ectodermal appendages (hair and nails) and for failed separation of
    epithelial surfaces.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: keratinocyte differentiation
    term:
      id: GO:0030216
      label: keratinocyte differentiation
    modifier: DECREASED
  - preferred_term: epidermis development
    term:
      id: GO:0008544
      label: epidermis development
    modifier: DECREASED
  evidence:
  - reference: PMID:12194825
    reference_title: "RIP4 is an ankyrin repeat-containing kinase essential for keratinocyte differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      RIP4 deficiency in mice results in perinatal lethality associated with
      abnormal epidermal differentiation.
    explanation: >-
      Establishes the keratinocyte differentiation defect of RIPK4 loss in vivo.
  - reference: PMID:12194825
    reference_title: "RIP4 is an ankyrin repeat-containing kinase essential for keratinocyte differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      RIP4 functions cell autonomously within the keratinocyte lineage.
    explanation: >-
      Places the defect in the keratinocyte itself.
  - reference: PMID:35220430
    reference_title: "RIPK4 regulates cell-cell adhesion in epidermal development and homeostasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Impaired activity of the RIPK4 kinase resulted both in altered epithelial
      differentiation and defective cell adhesion.
    explanation: >-
      Human patient-derived keratinocytes carrying recessive RIPK4 missense
      variants show the differentiation defect, together with a cell-adhesion
      defect that bears on the epithelial fusion branch.
  downstream:
  - target: Periderm Defect and Epithelial Fusion
    causal_link_type: DIRECT
  - target: Hair Follicle and Ectodermal Appendage Dysplasia
    causal_link_type: DIRECT
- name: Periderm Defect and Epithelial Fusion
  biological_scale: TISSUE
  description: >-
    The periderm is a transient superficial epithelial layer that keeps
    apposed embryonic epithelia, including the eyelid margins, from adhering.
    In Ripk4-deficient mice periderm development is abnormal and E-cadherin is
    mislocalized to the apical membrane of the outer peridermal cells, so
    epithelial surfaces fuse; all external orifices are fused in the knockout,
    and the fusions depend on E-cadherin. Ankyloblepharon in CHAND syndrome is
    the human manifestation of this defect at the eyelid margins; in the
    severe, kinase-domain RIPK4 disease the same failure also produces oral
    synechiae and pterygia.
  cell_types:
  - preferred_term: peridermal cell
    term:
      id: CL:0000078
      label: peridermal cell
  biological_processes:
  - preferred_term: eyelid development in camera-type eye
    term:
      id: GO:0061029
      label: eyelid development in camera-type eye
    modifier: ABNORMAL
  evidence:
  - reference: PMID:25430793
    reference_title: "A novel RIPK4-IRF6 connection is required to prevent epithelial fusions characteristic for popliteal pterygium syndromes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we describe that RIPK4 deficiency in mice causes epithelial fusions
      associated with abnormal periderm development and aberrant ectopic
      localization of E-cadherin on the apical membrane of the outer peridermal
      cell layers.
    explanation: >-
      Mechanism linking RIPK4 loss to epithelial fusion through the periderm.
  - reference: PMID:29317263
    reference_title: "Keratinocyte-Specific Ablation of RIPK4 Allows Epidermal Cornification but Impairs Skin Barrier Formation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show here that the epithelial fusions observed in RIPK4 full knockout
      (KO) mice are E-cadherin dependent, as keratinocyte-specific deletion of
      E-cadherin in RIPK4 full KO mice rescued the tail-to-body fusion and
      fusion of oral epithelia.
    explanation: >-
      Genetic rescue showing the fusions require E-cadherin.
  notes: >-
    The mouse data are from Ripk4 null animals, which model the severe end of
    the RIPK4 spectrum. That the hypomorphic CHAND allele confines this defect
    to the eyelid margins is an inference from the phenotype, not a measured
    result. ABNORMAL is used for the eyelid process because the defect is a
    failure of lid-margin separation rather than a change in the amount of a
    process.
  downstream:
  - target: Ankyloblepharon
    causal_link_type: DIRECT
- name: Hair Follicle and Ectodermal Appendage Dysplasia
  biological_scale: TISSUE
  description: >-
    Defective keratinocyte differentiation disturbs the ectodermal appendages
    built from keratinocytes. Ripk4-null skin grafted onto a normal host forms
    abnormal hair follicles, which underlies the sparse, curly, light-coloured
    scalp hair of CHAND syndrome. The nail dysplasia is attributed to the same
    keratinocyte differentiation defect in the nail unit by analogy; no study
    has examined the nail apparatus in RIPK4 deficiency.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: hair follicle development
    term:
      id: GO:0001942
      label: hair follicle development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:12194825
    reference_title: "RIP4 is an ankyrin repeat-containing kinase essential for keratinocyte differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Instead, abnormal hair follicle development and epidermal dysplasia,
      indicative of progression into a more pathologic state, are observed.
    explanation: >-
      Hair follicle development is abnormal in RIPK4-deficient skin.
  downstream:
  - target: Curly Hair
    causal_link_type: DIRECT
  - target: Sparse Scalp Hair
    causal_link_type: DIRECT
  - target: Nail Dysplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred from the keratinocyte differentiation defect; nail-unit biology
      of RIPK4 deficiency has not been studied.

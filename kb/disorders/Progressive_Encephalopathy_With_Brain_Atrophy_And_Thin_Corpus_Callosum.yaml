animal_models:
- name: Drosophila TBCD mutant olfactory projection neurons
  species: Fruit fly
  genotype: TBCD loss-of-function mutant, MARCM single-cell clones, with or without human TBCD transgene rescue
  publication: PMID:27666374
  description: >-
    Mosaic projection neurons homozygous for a TBCD mutation show microtubule
    disruption, ectopic dendrite arborization, axon shortening and
    degeneration. Wild-type human TBCD rescues the defects; the
    patient-derived missense alleles rescue poorly, which is the in vivo
    demonstration that they are loss of function.
  modeled_mechanisms:
  - target: Defective Neuronal Microtubule Dynamics and Neurite Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Single-neuron readout of microtubule integrity, axon growth and
      dendrite targeting after TBCD loss, with allele-specific rescue.
    limitations: >-
      An invertebrate sensory circuit; it reports neuronal morphogenesis, not
      the human sequence of cortical atrophy, epilepsy and respiratory
      failure, and the alleles are tested as transgenes over a null rather
      than as hypomorphs.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Fly projection neurons stand in for human cortical and cerebellar
        neurons; the rescue assay establishes the direction of effect of the
        patient alleles, not their effect on a mammalian brain.
    evidence:
    - reference: PMID:27666374
      reference_title: "Biallelic TBCD Mutations Cause Early-Onset Neurodegenerative Encephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "The in vivo experiments using olfactory projection neurons in Drosophila melanogaster indicated that the TBCD mutations caused loss of function."
      explanation: >-
        The patient alleles fail to rescue.
    - reference: PMID:25653356
      reference_title: "Linking cell surface receptors to microtubules: tubulin folding cofactor D mediates Dscam functions during neuronal morphogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Single-cell clones of projection neurons homozygous for the TBCD mutation displayed disruption of microtubules, resulting in ectopic arborization of dendrites, and axon degeneration."
      explanation: >-
        The baseline mutant phenotype.
- name: Zebrafish morpholino tbcd knockdown
  species: Zebrafish
  genotype: Morpholino-mediated TBCD knockdown; TBCD overexpression arm
  publication: PMID:27807845
  description: >-
    Knockdown recapitulated several pathological features of the human
    disease, and overexpression was also deleterious, confirming the
    dependence of development on a correct TBCD level.
  modeled_mechanisms:
  - target: Neuronal Loss, Gliosis and Progressive Brain Atrophy
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Whole-embryo morphological readout of TBCD depletion.
    limitations: >-
      A transient morpholino knockdown in an embryo, with the off-target and
      dosage caveats of that method; the abstract does not specify which
      human features were reproduced.
    evidence:
    - reference: PMID:27807845
      reference_title: "Microcephaly, intractable seizures and developmental delay caused by biallelic variants in TBCD: further delineation of a new chaperone-mediated tubulinopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Morpholino-mediated TBCD knockdown in zebrafish recapitulated several key pathological features of the human disease, and TBCD overexpression in the same model confirmed previous studies documenting an obligate dependency on proper TBCD levels during development."
      explanation: >-
        Knockdown and overexpression both perturb development.
- name: Mouse in utero Tbcd shRNA knockdown
  species: Mouse
  genotype: In utero electroporation of Tbcd shRNA into embryonic cortical progenitors
  publication: PMID:28158450
  description: >-
    Acute suppression of Tbcd in the developing cortex impairs progenitor
    proliferation and radial migration of newborn neurons, placing TBCD among
    the cortical-development genes; it is a knockdown, not a patient-allele
    model, and no germline Tbcd mouse model of the disease has been reported.
  modeled_mechanisms:

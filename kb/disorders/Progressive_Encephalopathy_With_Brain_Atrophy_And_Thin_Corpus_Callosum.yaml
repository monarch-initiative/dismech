- name: Impaired Alpha/Beta-Tubulin Heterodimer Assembly
  biological_scale: MOLECULAR
  description: >-
    Alpha- and beta-tubulin cannot fold or pair without the TBCA-TBCE cofactor
    machine; TBCD and TBCE hold beta- and alpha-tubulin in a supercomplex until
    TBCC triggers GTP hydrolysis and release of the native heterodimer. Mutant
    TBCD is partially compromised in this pathway, and patient fibroblasts show
    a decreased soluble alpha/beta-tubulin pool.
  biological_processes:
  - preferred_term: tubulin heterodimer assembly
    modifier: DECREASED
    term:
      id: GO:0007021
      label: tubulin complex assembly
  evidence:
  - reference: PMID:28158450
    reference_title: "Infantile neurodegenerative disorder associated with mutations in TBCD, an essential gene in the tubulin heterodimer assembly pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional analyses of the mutant proteins revealed a partially compromised ability to participate in the heterodimer assembly pathway."
    explanation: >-
      Direct assay of mutant TBCD in the assembly pathway.
  - reference: PMID:27666370
    reference_title: "Biallelic Mutations in TBCD, Encoding the Tubulin Folding Cofactor D, Perturb Microtubule Dynamics and Cause Early-Onset Encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Reduced or defective TBCD function resulted in decreased soluble α/β-tubulin levels and accelerated microtubule polymerization in fibroblasts from affected subjects, demonstrating an overall shift toward a more rapidly growing and stable microtubule population."
    explanation: >-
      The soluble heterodimer pool is reduced in patient cells.
  - reference: PMID:23973072
    reference_title: "Tubulin-specific chaperones: components of a molecular machine that assembles the α/β heterodimer."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "There is free exchange of β-tubulin between TBCA and TBCD, and of α-tubulin between TBCB and TBCE, resulting in the formation of TBCD/β and TBCE/α, respectively."
    explanation: >-
      TBCD's place in the assembly pathway.
  - reference: PMID:23973072
    reference_title: "Tubulin-specific chaperones: components of a molecular machine that assembles the α/β heterodimer."
    supports: SUPPORT
    evidence_source: IN_VITRO

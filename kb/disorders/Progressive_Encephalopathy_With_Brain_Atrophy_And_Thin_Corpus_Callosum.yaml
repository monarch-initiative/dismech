progression:
- phase: Infantile onset and regression
  notes: >-
    Normal or near-normal birth, then delayed development or stagnation in
    the first months with first medical attention at 4-9 months in the Faroese
    cohort; regression and seizure onset follow within the first two years.
  evidence:
  - reference: PMID:31569255
    reference_title: "Developmental Regression and Epilepsy of Infancy with Migrating Focal Seizures Caused by TBCD Mutation: A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The review of 33 previously reported patients revealed that the age at the onset was very early, and all the patients had presentations during the first year of life."
    explanation: >-
      Onset in the first year of life across the reported cases.
- phase: Progressive neurodegeneration and early death
  notes: >-
    Progressive atrophy with spastic tetraplegia, loss of swallowing and
    respiratory failure. Survival is genotype dependent: median death at 24
    months in the Faroese founder cohort, death at 3 years in one Chinese
    sibling, survival to the late teens in severe Turkish siblings, and an
    attenuated adult phenotype in a p.Arg294Gln homozygote.
  evidence:
  - reference: PMID:29921875
    reference_title: "A Faroese founder variant in TBCD causes early onset, progressive encephalopathy with a homogenous clinical course."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients had similar age of onset as the previously reported patients (n = 24), but much shorter survival, which could be caused by either differences in supportive treatment, or alternatively, that shorter survival is intrinsic to the Faroese phenotype."
    explanation: >-
      Survival differs by genotype and possibly by supportive care.
  - reference: PMID:39853547
    reference_title: "Phenotypic variability in progressive encephalopathy with brain atrophy and thin corpus callosum: insights from two families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings contribute to the expanding phenotypic spectrum of PEBAT and suggesting that modifier genes or epigenetic factors may influence disease severity."
    explanation: >-

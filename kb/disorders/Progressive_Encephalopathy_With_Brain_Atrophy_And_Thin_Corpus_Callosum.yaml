name: Progressive Encephalopathy With Brain Atrophy And Thin Corpus Callosum
creation_date: "2026-10-13T00:00:00Z"
category: Mendelian
parents:
- hereditary disease
- Neurodevelopmental Disorder
- Epilepsy
description: >-
  Autosomal recessive early-onset neurodegenerative encephalopathy caused by
  biallelic hypomorphic variants in TBCD, encoding tubulin-folding cofactor D,
  one of the five tubulin-specific chaperones that assemble the alpha/beta-tubulin
  heterodimer. Reduced TBCD abundance and defective binding to beta-tubulin, ARL2
  and TBCE lower the soluble tubulin pool, accelerate microtubule polymerization
  and hyperstabilize microtubules, disturbing mitotic spindle organization in
  dividing cells and axon and dendrite maintenance in neurons. Infants present
  in the first year with developmental delay followed by regression, intractable
  seizures, hypotonia evolving to spastic tetraplegia with muscle weakness and
  atrophy, acquired microcephaly and optic atrophy; brain MRI shows progressive
  diffuse cerebral and cerebellar atrophy with a thin corpus callosum and delayed
  myelination. Spinal motor neuron degeneration contributes to weakness and
  respiratory failure. Severity tracks residual TBCD function: a Faroese founder
  allele gives a homogeneous course with median death at two years, while some
  compound-heterozygous or homozygous missense genotypes give mild
  neurodevelopmental disease. Management is supportive. The MONDO label is
  "early-onset progressive diffuse brain atrophy-microcephaly-muscle
  weakness-optic atrophy syndrome"; OMIM:617193 (PEBAT).
synonyms:
- PEBAT
- early-onset progressive diffuse brain atrophy-microcephaly-muscle weakness-optic atrophy syndrome
- encephalopathy, progressive, early-onset, with brain atrophy and thin corpus callosum
- TBCD-related encephalopathy
- TBCD-related early-onset neurodegenerative encephalopathy
- tubulin folding cofactor D deficiency
disease_term:
  preferred_term: Progressive encephalopathy with brain atrophy and thin corpus callosum
  term:
    id: MONDO:0044646
    label: early-onset progressive diffuse brain atrophy-microcephaly-muscle weakness-optic atrophy syndrome
notes: >-
  No GeneReviews chapter exists for TBCD-related encephalopathy (NCBI Bookshelf
  index snapshot 2026-09-10), so the phenotype baseline is taken from the two
  2016 gene-discovery series, the Faroese founder cohort and the ClinGen
  evidence summary. The ClinGen Brain Malformations GCEP lumps OMIM:617193
  (PEBAT) and ORPHA:496641 with MONDO:0044646 as one entity. Two papers (PMID:36527993, PMID:39853547) print OMIM
  numbers for the disease that are respectively a typo (617913) and the TBCD gene
  entry (604649); the disease entry is OMIM:617193. A similarly named
  KIF1A-related encephalopathy is a distinct disease and is not covered by
  this entry.
prevalence:
- population: Faroe Islands (founder allele c.3099C>G, p.Asn1033Lys)
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 2600.0
  notes: >-
    Heterozygous carrier frequency of 2.6% for the Faroese founder allele among
    population controls; the authors derive an expected disease incidence of
    roughly 1 in 1,444 births in the Faroe Islands from it. Neither figure is a
    worldwide estimate.
  evidence:
  - reference: PMID:29921875
    reference_title: "A Faroese founder variant in TBCD causes early onset, progressive encephalopathy with a homogenous clinical course."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "p.(Asn1033Lys), which we show has a high carrier frequency in the Faroese population (2.6%)."
    explanation: >-
      Source of the Faroese carrier frequency.
- population: Worldwide (published cases)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Thirty-three patients had been reported by the 2020 literature review; the
    2025 series counts 55 reported patients. No population-based prevalence has
    been measured outside the Faroese founder population.
  evidence:
  - reference: PMID:31569255
    reference_title: "Developmental Regression and Epilepsy of Infancy with Migrating Focal Seizures Caused by TBCD Mutation: A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The review of 33 previously reported patients revealed that the age at the onset was very early, and all the patients had presentations during the first year of life."
    explanation: >-
      Literature case count at the time of the review, and the uniformly
      infantile onset.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Homozygous or compound heterozygous TBCD variants inherited from unaffected
    carrier parents. Founder alleles are documented in the Faroe Islands
    (p.Asn1033Lys) and among Cochin Jews (p.Ala475Thr), where the Israeli
    Ministry of Health offers carrier screening; consanguinity is common but not
    required.
  evidence:
  - reference: CGGV:assertion_d1ac5fbd-0d8e-4b6e-a8c4-d21f966a350f-2025-03-13T190000.000Z
    reference_title: "TBCD / early-onset progressive diffuse brain atrophy-microcephaly-muscle weakness-optic atrophy syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "TBCD | HGNC:11581 | early-onset progressive diffuse brain atrophy-microcephaly-muscle weakness-optic atrophy syndrome | MONDO:0044646 | AR | Definitive"
    explanation: >-
      ClinGen records the mode of inheritance as autosomal recessive.
  - reference: PMID:34943336
    reference_title: "Novel Compound Heterozygous Variants in TBCD Gene Associated with Infantile Neurodegenerative Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we identified two novel TBCD variants, c.1340C>T (p.Ala447Val), and c.817+2T>C, presented as compound heterozygotes in two affected siblings born to unaffected carrier parents."
    explanation: >-
      Compound heterozygosity with unaffected carrier parents in a
      non-consanguineous family.
  - reference: PMID:37394437
    reference_title: "[MOH SCREENING FOR TBCD IN COCHIN JEWS: COLLABORATION BETWEEN MEDICAL, RESEARCH AND COMMUNITY MEMBERS IN ACHIEVING PUBLIC HEALTH GOALS]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing for the girls revealed the homozygous TBCD variant c.1423G>A (p.Ala475Thr)."
    explanation: >-
      The Cochin Jewish founder allele, homozygous in two affected sisters.
genetic:
- name: TBCD
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: TBCD
    term:
      id: hgnc:11581
      label: TBCD
  notes: >-
    TBCD (17q25.3) encodes tubulin-folding cofactor D, a HEAT-repeat protein
    that binds beta-tubulin and the GTPase ARL2 and, with TBCE and TBCC,
    assembles and disassembles the alpha/beta-tubulin heterodimer. Reported
    alleles are mostly missense, with a few nonsense, splice and intragenic
    deletion alleles; no patient has been reported with two null alleles, which
    together with the fibroblast data (residual TBCD at roughly 10-40% of
    control) supports a hypomorphic mechanism. Reported variants include
    p.Met387Arg, p.Tyr760*, p.Arg772Cys, p.Ala921Thr, p.Pro937Arg,
    p.Pro1122Leu, p.Leu229Arg, p.Thr374Met, p.Arg377Gln, p.Ala626Thr,
    p.Thr994Met, p.Val1105Met, p.Ala475Thr, p.Ala586Val, p.Asn1033Lys,
    p.Ala447Val, p.His77Arg and p.Arg294Gln.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_d1ac5fbd-0d8e-4b6e-a8c4-d21f966a350f-2025-03-13T190000.000Z
    evidence:
    - reference: CGGV:assertion_d1ac5fbd-0d8e-4b6e-a8c4-d21f966a350f-2025-03-13T190000.000Z
      reference_title: "TBCD / early-onset progressive diffuse brain atrophy-microcephaly-muscle weakness-optic atrophy syndrome (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "TBCD | HGNC:11581 | early-onset progressive diffuse brain atrophy-microcephaly-muscle weakness-optic atrophy syndrome | MONDO:0044646 | AR | Definitive"
      explanation: >-
        ClinGen Brain Malformations GCEP Definitive classification, 13 March
        2025.
  evidence:
  - reference: PMID:27666374
    reference_title: "Biallelic TBCD Mutations Cause Early-Onset Neurodegenerative Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "By whole-exome sequencing, we identified biallelic TBCD mutations in eight affected individuals from the four families."
    explanation: >-
      Gene discovery in four families.
  - reference: PMID:27666370
    reference_title: "Biallelic Mutations in TBCD, Encoding the Tubulin Folding Cofactor D, Perturb Microtubule Dynamics and Cause Early-Onset Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We report that biallelic mutations in TBCD, encoding one of the five co-chaperones required for assembly and disassembly of the αβ-tubulin heterodimer, the structural unit of microtubules, cause a disease with neurodevelopmental and neurodegenerative features characterized by early-onset cortical atrophy, secondary hypomyelination, microcephaly, thin corpus callosum, developmental delay, intellectual disability, seizures, optic atrophy, and spastic quadriplegia."
    explanation: >-
      Independent simultaneous gene discovery in five families.
  - reference: CGGV:assertion_d1ac5fbd-0d8e-4b6e-a8c4-d21f966a350f-2025-03-13T190000.000Z
    reference_title: "TBCD / early-onset progressive diffuse brain atrophy-microcephaly-muscle weakness-optic atrophy syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In summary, TBCD is definitively associated with autosomal recessive TBCD-related early-onset neurodegenerative encephalopathy."
    explanation: >-
      Expert gene-level assessment.
  variants:
  - name: p.Asn1033Lys (c.3099C>G)
    description: >-
      Faroese founder missense allele; all eight Faroese patients were
      homozygous, with a homogeneous severe course and much shorter survival
      than previously reported patients.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:29921875
      reference_title: "A Faroese founder variant in TBCD causes early onset, progressive encephalopathy with a homogenous clinical course."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The patients had similar age of onset as the previously reported patients (n = 24), but much shorter survival, which could be caused by either differences in supportive treatment, or alternatively, that shorter survival is intrinsic to the Faroese phenotype."
      explanation: >-
        The founder genotype's distinctive survival.
  - name: p.Ala475Thr (c.1423G>A)
    description: >-
      Recurrent missense allele in families of Cochin Jewish and south Indian
      origin; patient fibroblasts retain about 10% of control TBCD abundance.
      Found homozygous in an Indian child who also carried a homozygous FGG
      truncating allele.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:28158450
      reference_title: "Infantile neurodegenerative disorder associated with mutations in TBCD, an essential gene in the tubulin heterodimer assembly pathway."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found a reduced intracellular abundance of TBCD in patient fibroblasts to about 10% (in the case of A475T) or 40% (in the case of A586V) compared to age-matched wild type controls."
      explanation: >-
        Residual TBCD abundance for this allele.
    - reference: PMID:29769041
      reference_title: "Cortical atrophy and hypofibrinogenemia due to FGG and TBCD mutations in a single family: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The study describes a male child from consanguineous family presented with hypofibrinogenemia, diffuse cortical atrophy, microcephaly, hypertonia and axonal motor neuropathy."
      explanation: >-
        The blended-phenotype case carrying this allele.
  - name: p.His77Arg (c.230A>G)
    description: >-
      Missense allele associated with milder disease: homozygous in a child
      with absence seizures and slight developmental delay, and in trans with
      an exon 28-39 deletion in a boy with refractory migrating focal seizures
      and regression.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:39853547
      reference_title: "Phenotypic variability in progressive encephalopathy with brain atrophy and thin corpus callosum: insights from two families."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In contrast, Family 2, Case 3 (F2C3), with the homozygous c.230A > G, p.(His77Arg) variant, presented a milder phenotype, including absence seizures, slight developmental delay, and less pronounced neuroanatomical abnormalities."
      explanation: >-
        Mild homozygous presentation.
    - reference: PMID:31569255
      reference_title: "Developmental Regression and Epilepsy of Infancy with Migrating Focal Seizures Caused by TBCD Mutation: A Case Report and Review of the Literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic analyses of the family members revealed a compound heterozygous variant of c.230A > G (p.H77R) in the proband and deletion of exons 28 to 39 of TBCD, which has not been previously reported and was inherited from his carrier parents."
      explanation: >-
        The same allele in trans with a multi-exon deletion gave severe
        disease, consistent with the second allele setting residual function.
  - name: p.Arg772Cys (c.2314C>T)
    description: >-
      Recurrent missense allele reported in the original Japanese series and
      homozygous in two Turkish siblings with severe regression, spastic
      tetraplegia, seizures and brain atrophy.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:39853547
      reference_title: "Phenotypic variability in progressive encephalopathy with brain atrophy and thin corpus callosum: insights from two families."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In Family 1, two siblings (F1C1 and F1C2) harboring the homozygous c.2314C > T, p.(Arg772Cys) variant exhibited severe neurodevelopmental regression, spastic tetraplegia, seizures, and brain atrophy."
      explanation: >-
        Severe homozygous presentation.
pathophysiology:
- name: Biallelic Hypomorphic TBCD Variants
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous germline TBCD variants, mostly
    missense, with occasional nonsense, splice-site and intragenic deletion
    alleles. The absence of biallelic null genotypes and the retained 10-40%
    TBCD abundance in patient fibroblasts indicate partial loss of function;
    ClinGen records the mechanism as loss of function.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Homozygous in consanguineous and founder families, compound heterozygous
      elsewhere; residual function of the mutant proteins is proposed to set
      clinical severity.
  genes:
  - preferred_term: TBCD
    term:
      id: hgnc:11581
      label: TBCD
  evidence:
  - reference: PMID:27666374
    reference_title: "Biallelic TBCD Mutations Cause Early-Onset Neurodegenerative Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "A total of seven mutations were found: five missense mutations, one nonsense, and one splice site mutation resulting in a frameshift."
    explanation: >-
      Allele classes in the discovery series.
  - reference: PMID:27666374
    reference_title: "Biallelic TBCD Mutations Cause Early-Onset Neurodegenerative Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The wide range of clinical severity seen in this neurodegenerative encephalopathy may result from the residual function of mutant TBCD proteins."
    explanation: >-
      The hypomorphic interpretation of the allelic series.
  - reference: CGGV:assertion_d1ac5fbd-0d8e-4b6e-a8c4-d21f966a350f-2025-03-13T190000.000Z
    reference_title: "TBCD / early-onset progressive diffuse brain atrophy-microcephaly-muscle weakness-optic atrophy syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The mechanism of pathogenicity appears to be loss of function."
    explanation: >-
      ClinGen's statement of mechanism.
  - reference: PMID:27666370
    reference_title: "Biallelic Mutations in TBCD, Encoding the Tubulin Folding Cofactor D, Perturb Microtubule Dynamics and Cause Early-Onset Encephalopathy."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    quote_role: PRIMARY_RESULT
    snippet: "Molecular dynamics simulations predicted long-range and/or local structural perturbations associated with the disease-causing mutations."
    explanation: >-
      In silico prediction that the missense changes perturb TBCD structure.
  downstream:
  - target: Reduced TBCD Abundance and Defective Cofactor Binding
    causal_link_type: DIRECT
    description: >-
      Missense alleles destabilize the protein or impair its binding to
      beta-tubulin, ARL2 and TBCE; the splice allele is subject to
      nonsense-mediated decay.
- name: Reduced TBCD Abundance and Defective Cofactor Binding
  biological_scale: MOLECULAR
  description: >-
    Mutant TBCD is unstable, with fibroblast abundance reduced to roughly
    10-40% of control for the alleles tested, and a subset of mutants bind
    beta-tubulin, ARL2 or TBCE poorly. TBCD normally holds beta-tubulin within
    the TBCD-TBCE-ARL2 cage and, with TBCC, stimulates GTP hydrolysis on the
    heterodimer; both the chaperone and the GTPase-activating activities are
    compromised.
  molecular_functions:

discussions:
- discussion_id: pebat_neuronal_death_mechanism
  prompt: >-
    By what cellular route does a reduced supply of alpha/beta-tubulin
    heterodimers, with hyperstable microtubules, kill postmitotic neurons in
    the human cortex and cerebellum after a period of normal early
    development?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Defective Neuronal Microtubule Dynamics and Neurite Degeneration
  - pathophysiology#Neuronal Loss, Gliosis and Progressive Brain Atrophy
  rationale: >-
    The biochemical lesion and the autopsy end state are both documented, but
    the intermediate steps are inferred: fly neurons show axon degeneration,
    fibroblasts show hyperstable microtubules and spindle defects, and the
    single autopsy shows Purkinje cell cactus formations that the authors
    compare to mitochondrial disease, raising the possibility that impaired
    microtubule-based transport of mitochondria contributes. No human
    neuronal model, differentiated from the isogenic iPSC pair, has been
    reported.
  posed_by: dismech curation
  posed_date: "2026-10-23T00:00:00Z"
- discussion_id: pebat_development_versus_degeneration
  prompt: >-
    How much of the microcephaly and cortical volume loss is a prenatal
    neurodevelopmental defect of progenitor proliferation and migration, and
    how much is postnatal neurodegeneration?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Disorganized Mitotic Spindle and Impaired Cortical Progenitor Proliferation and Migration
  rationale: >-
    Mouse in utero knockdown shows a requirement for Tbcd in cortical
    proliferation and migration, yet patients are born with normal head
    circumference, develop secondary microcephaly, and their neuropathology
    is degenerative rather than malformative; patient fibroblasts show
    spindle disorganization without a proliferation defect. Whether the
    developmental phenotype of the mouse knockdown applies to hypomorphic
    human alleles is unresolved.
  posed_by: dismech curation
  posed_date: "2026-10-23T00:00:00Z"
- discussion_id: pebat_severity_modifiers
  prompt: >-
    What determines the wide range of severity, from death at two years to
    mild neurodevelopmental disease, and is residual TBCD function sufficient
    to explain it?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic Hypomorphic TBCD Variants
  rationale: >-
    Residual function of the mutant proteins is the proposed determinant, but
    quantitative TBCD abundance is available for only a few alleles, the same
    p.His77Arg allele gives mild disease when homozygous and severe disease in
    trans with a deletion, and the Faroese cohort's shorter survival could
    reflect supportive care rather than genotype. Modifier genes have been
    proposed but not identified.
  posed_by: dismech curation
  posed_date: "2026-10-23T00:00:00Z"

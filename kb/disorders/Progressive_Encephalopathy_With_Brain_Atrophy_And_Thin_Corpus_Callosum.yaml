    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "We show that recombinant human TBCD functions indistinguishably from its nonrecombinant bovine counterpart in in vitro CCT-driven folding reactions, in tubulin disruption reactions, and in tubulin GTPase activating protein assays in which TBCD and TBCC stimulate GTP hydrolysis by β-tubulin at a heterodimer concentration far below that required for polymerization into microtubules."
    explanation: >-
      The wild-type activities that the mutants compromise: tubulin folding,
      heterodimer disruption and GTPase activation.
  - reference: PMID:41461644
    reference_title: "Cryo-EM structures of the tubulin cofactors reveal the molecular basis of alpha/beta-tubulin biogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "TBCD, TBCE, and Arl2 form a heterotrimeric cage-like assembly, we term TBC-DEG, around the αβ-tubulin heterodimer."
    explanation: >-

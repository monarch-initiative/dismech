    snippet: "The patient has been treated with a combination of terbinafine and itraconazole for 3 months with a good clinical response."
    explanation: Demonstrates clinical efficacy of terbinafine combined with itraconazole.
- name: Cryosurgery (Liquid Nitrogen Cryotherapy)
  description: >-
    Locally destructive cryosurgery, typically combined with systemic
    itraconazole or terbinafine to prevent lymphatic spread or recurrence, is a
    principal physical adjunct for localized or plaques-stage chromoblastomycosis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Cryosurgery
    term:
      id: NCIT:C15215
      label: Cryosurgery
  evidence:
  - reference: DOI:10.1186/s12879-025-11475-4
    reference_title: "Chromoblastomycosis in Peru: a retrospective review of 13 cases"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine patients (69%) received oral itraconazole (200–400 mg/day) combined with cryosurgery; two (15%) received itraconazole alone; and two (15%) received itraconazole combined with terbinafine (500 mg/day)."
    explanation: Clinical series showing combined oral itraconazole plus cryosurgery as the most frequently employed regimen.
- name: Surgical Excision of Localized Lesions
  description: >-
    Wide surgical excision is effective for early, small, well-circumscribed
    chromoblastomycosis lesions or selected antifungal-refractory localized
    plaques, typically paired with systemic antifungal coverage.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Excision

pathophysiology:
- name: Chromoblastomycosis Lanosterol 14-alpha-Demethylation by CYP51 (ERG11)
  description: >-
    The dematiaceous fungi that cause chromoblastomycosis depend on fungal sterol
    14-alpha-demethylase in the ergosterol pathway. This normal Cyp51/Erg11
    enzyme activity is the disease-local therapeutic vulnerability inhibited by
    the itraconazole component of combination antifungal therapy.
  role: therapeutic_vulnerability
  biological_scale: MOLECULAR
  conforms_to: >-
    fungal_ergosterol_synthesis_inhibition#Lanosterol
    14-alpha-Demethylation by CYP51 (ERG11)
  biological_processes:
  - preferred_term: Ergosterol Biosynthetic Process
    term:
      id: GO:0006696
      label: ergosterol biosynthetic process
  molecular_functions:
  - preferred_term: Sterol 14-Demethylase Activity
    term:
      id: GO:0008398
      label: sterol 14-demethylase activity
  evidence:
  - reference: PMID:33374996
    reference_title: >-
      Sterol 14α-Demethylase Ligand-Binding Pocket-Mediated Acquired and
      Intrinsic Azole Resistance in Fungal Pathogens.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The fungal cytochrome P450 enzyme sterol 14α-demethylase (SDM) is a key
      enzyme in the ergosterol biosynthesis pathway.
    explanation: >-
      Review evidence establishes the conserved fungal sterol-demethylase
      activity duplicated by this chromoblastomycosis target node.
  downstream:
  - target: Chromoblastomycosis Ergosterol Production
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - removal of the lanosterol 14-alpha-methyl group
    - completion of downstream sterol-biosynthetic reactions
    description: >-
      Cyp51-mediated lanosterol demethylation permits the remaining fungal
      sterol reactions that yield ergosterol.
    evidence:
    - reference: PMID:31643715
      reference_title: Antifungal Agents.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Imidazole and triazole antifungal drugs inhibit cytochrome P450
        14α-demethylase which is responsible for converting lanosterol to
        ergosterol, which blocks cell membrane synthesis in fungi.
      explanation: >-
        The reference explicitly connects the fungal demethylase step to
        conversion of lanosterol into ergosterol and membrane synthesis.

- name: Chromoblastomycosis Ergosterol Production
  description: >-
    Completion of sterol biosynthesis produces ergosterol for the plasma
    membranes of the dematiaceous fungi that cause chromoblastomycosis. This is
    the normal molecular output downstream of the azole target.
  role: effector
  biological_scale: MOLECULAR
  conforms_to: fungal_ergosterol_synthesis_inhibition#Ergosterol Production
  biological_processes:
  - preferred_term: Ergosterol Metabolic Process
    term:
      id: GO:0008204
      label: ergosterol metabolic process
  evidence:
  - reference: PMID:1543672
    reference_title: >-
      Terbinafine: mode of action and properties of the squalene epoxidase
      inhibition.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Treated fungi accumulate squalene while becoming deficient in ergosterol,
      an essential component of fungal cell membranes.
    explanation: >-
      Biochemical evidence identifies ergosterol as the pathway product and an
      essential fungal-membrane component.
  downstream:
  - target: Chromoblastomycosis Ergosterol-Dependent Plasma-Membrane Organization
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - ergosterol insertion into the fungal plasma membrane
    - sterol-dependent membrane packing and membrane-protein organization
    description: >-
      Ergosterol produced by the causal fungi is incorporated into their plasma
      membranes, where it supports membrane organization.
    evidence:
    - reference: PMID:1543672
      reference_title: >-
        Terbinafine: mode of action and properties of the squalene epoxidase
        inhibition.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Treated fungi accumulate squalene while becoming deficient in ergosterol,
        an essential component of fungal cell membranes.
      explanation: >-
        The evidence identifies ergosterol as an essential fungal-membrane
        component, supporting this indirect production-to-organization edge.

- name: Chromoblastomycosis Ergosterol-Dependent Plasma-Membrane Organization
  description: >-
    Ergosterol incorporation supports organization and integrity of the plasma
    membranes of chromoblastomycosis-causing fungi. This node records the normal
    cellular output of ergosterol biosynthesis rather than drug-induced
    depletion or fungal killing.
  role: consequence
  biological_scale: CELLULAR
  conforms_to: >-

    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results indicate that F. pedrosoi is sensed by the NLRP3 inflammasome, which induces caspase-1 activation and production of IL-18. Moreover, IL-18 plays a crucial role in activating Th1 cells and controlling fungal loads during chromoblastomycosis."
    explanation: Contrasting experimental chromoblastomycosis evidence showing that NLRP3/caspase-1/IL-18-driven Th1 activation is required to control Fonsecaea pedrosoi loads, underscoring why a Th2/Treg-skewed and PD-1/PD-L1-exhausted T-cell response fails to clear dermal infection.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory tests included positive direct microscopic examinations (78.3%) and mycological cultures (69.6%), identifying 14 cases of Fonsecaea pedrosoi and one case of Exophiala janselmei."
    explanation: Demonstrates mycological culture positivity in 69.6% of cases to identify the causative dematiaceous fungal species.
treatments:
- name: Itraconazole Component of Combination Therapy
  description: >-
    Oral itraconazole (200-400 mg/day for months to years) is the standard
    systemic triazole antifungal used as initial monotherapy or combined with
    terbinafine, cryosurgery, or surgical excision in chromoblastomycosis,
    inhibiting fungal Cyp51 sterol 14-alpha-demethylase.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: itraconazole
      term:
        id: CHEBI:6076
        label: itraconazole
  target_mechanisms:
  - target: Chromoblastomycosis Lanosterol 14-alpha-Demethylation by CYP51 (ERG11)
    treatment_effect: INHIBITS
    description: >-
      Itraconazole inhibits fungal Cyp51/Erg11 sterol 14-alpha-demethylase,
      blocking conversion of lanosterol to ergosterol.
    evidence:
    - reference: PMID:31643715
      reference_title: Antifungal Agents.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Imidazole and triazole antifungal drugs inhibit cytochrome P450 14α-demethylase which is responsible for converting lanosterol to ergosterol, which blocks cell membrane synthesis in fungi. Examples of imidazoles include ketoconazole (1981: Nizoral) and clotrimazole (1975: Mycelex). Examples of triazoles include fluconazole (1990: Diflucan), itraconazole (1992: Sporanox), posaconazole (2006: Noxafil) and voriconazole (2002: Vfend)."
      explanation: >-
        States the triazole class mechanism and explicitly lists itraconazole as
        a member inhibiting fungal cytochrome P450 14-alpha-demethylase.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0012562
    reference_title: "A global chromoblastomycosis strategy and development of the global chromoblastomycosis working group"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Itraconazole is typically noted as the initial therapeutic choice for chromoblastomycosis, but cure rates range from 15% to 80% [27,35–37]."
    explanation: Establishes oral itraconazole as the standard initial systemic antifungal therapy for chromoblastomycosis.
  - reference: PMID:20711281
    reference_title: "Chromoblastomycosis Caused by Phialophora richardsiae."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient has been treated with a combination of terbinafine and itraconazole for 3 months with a good clinical response."
    explanation: Documents clinical response to itraconazole combined with terbinafine in human chromoblastomycosis.
- name: Terbinafine Antifungal Therapy
  description: >-
    Oral terbinafine is a systemic allylamine antifungal used as monotherapy or
    in combination with itraconazole, surgery, or cryotherapy for
    chromoblastomycosis, inhibiting fungal squalene epoxidase (Erg1) to deplete
    ergosterol and accumulate squalene.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

treatments:
- name: Itraconazole Component of Combination Therapy
  description: >-
    Itraconazole was used together with terbinafine for three months in the
    cited chromoblastomycosis case. This treatment record models only the
    itraconazole component and does not assert itraconazole monotherapy or
    first-line status. The separate terbinafine/Erg1 branch is not modeled in
    this minimal Cyp51 conformer.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: itraconazole
      term:
        id: CHEBI:6076
        label: itraconazole
  target_mechanisms:
  - target: Chromoblastomycosis Lanosterol 14-alpha-Demethylation by CYP51 (ERG11)
    treatment_effect: INHIBITS
    description: >-
      Itraconazole is the triazole component of this combination and inhibits
      the fungal Cyp51/Erg11 sterol-demethylase target.
    evidence:
    - reference: PMID:31643715
      reference_title: Antifungal Agents.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Imidazole and triazole antifungal drugs inhibit cytochrome P450
        14α-demethylase which is responsible for converting lanosterol to
        ergosterol, which blocks cell membrane synthesis in fungi. Examples of
        imidazoles include ketoconazole (1981: Nizoral) and clotrimazole (1975:
        Mycelex). Examples of triazoles include fluconazole (1990: Diflucan),
        itraconazole (1992: Sporanox), posaconazole (2006: Noxafil) and
        voriconazole (2002: Vfend).
      explanation: >-
        The reference states the triazole class mechanism and explicitly lists
        itraconazole as a member of that class.
  evidence:
  - reference: PMID:20711281
    reference_title: Chromoblastomycosis Caused by Phialophora richardsiae.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient has been treated with a combination of terbinafine and
      itraconazole for 3 months with a good clinical response.
    explanation: >-
      This human case supports disease-specific use of itraconazole together
      with terbinafine; it does not establish itraconazole monotherapy or
      first-line status.

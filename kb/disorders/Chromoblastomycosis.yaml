    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, patients with CBM exhibited a significant increase in the number of CD4+ and CD8+ cells associated with a high density of IL-10-, IL-17-, and IFN-γ-producing cells, indicating the presence of a chronic and mixed cellular immune response, which was also independent of fungal load. A significant increase in the number of PD-1+ and PD-L1+ cells was observed, which may be associated with the maintenance of the fungus in the skin and the progression of the disease."
    explanation: Human lesion immunophenotyping demonstrates high IL-10/IL-17/IFN-gamma cellular infiltrate and upregulated PD-1+/PD-L1+ exhaustion markers associated with fungal persistence and progression.
  - reference: DOI:10.1371/journal.pone.0322127
    reference_title: "IL-18 production is required for the generation of a Th1 response during experimental chromoblastomycosis"

transmission:
- name: Traumatic skin inoculation
  description: >-
    Cutaneous implantation of environmental conidia or hyphal fragments into the
    dermis and subcutis via penetrating thorns, wood splinters, or agricultural
    trauma to exposed skin, without human-to-human transmission.
  evidence:
  - reference: PMID:20711281
    reference_title: "Chromoblastomycosis Caused by Phialophora richardsiae."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The infection usually follows traumatic inoculation by a penetrating thorn or splinter wound."
    explanation: Establishes traumatic transcutaneous inoculation by plant thorns or splinters as the typical transmission route.
  - reference: PMID:29261968
    reference_title: "Chromoblastomycosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The indolent infection begins with the cutaneous inoculation of fungi, usually through some portion of the fungal cell capable of reproduction or propagation (eg, conidia, mycelia), into exposed skin, typically due to trauma."
    explanation: Details traumatic cutaneous implantation of environmental fungal conidia or mycelia into exposed skin.
agent_life_cycle:
  description: >-
    Causative Chaetothyriales fungi grow saprophytically as melanized filamentous
    mycelia and conidia in soil, decaying wood, and plant debris. Humans are
    incidental dead-end hosts infected by traumatic transcutaneous implantation,
    within whom environmental hyphae and conidia undergo dimorphic transition into
    thick-walled, melanin-pigmented muriform (sclerotic) cells that multiply by
    planar septation in dermal and subcutaneous tissue.
  hosts:
  - preferred_term: human
    role: incidental host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  life_cycle_stages:
  - name: Environmental saprophytic mycelia and conidia
    description: Melanized filamentous hyphae and reproductive conidia persisting on plant debris, thorns, and soil prior to cutaneous implantation.
    evidence:
    - reference: PMID:29261968
      reference_title: "Chromoblastomycosis."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The indolent infection begins with the cutaneous inoculation of fungi, usually through some portion of the fungal cell capable of reproduction or propagation (eg, conidia, mycelia), into exposed skin, typically due to trauma."
      explanation: Identifies environmental conidia and mycelia as the infective propagules inoculated into skin.
  - name: Tissue-invasive muriform (sclerotic) bodies
    description: Thick-walled, dark-brown multicellular fungal clusters formed in host dermis and subcutis that resist oxidative and enzymatic host defenses.
    evidence:
    - reference: DOI:10.1371/journal.pntd.0012562
      reference_title: "A global chromoblastomycosis strategy and development of the global chromoblastomycosis working group"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Melanin was shown to protect the transformation of hyphae and conidia into pigmented muriform bodies (sclerotic) with an increase in the thickness of the cell wall that provides a potentially resistance mechanism to host immune responses and antifungal drugs."
      explanation: Documents dimorphic transition of inoculated hyphae and conidia into thick-walled pigmented muriform bodies in host tissue.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0012562
    reference_title: "A global chromoblastomycosis strategy and development of the global chromoblastomycosis working group"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Chromoblastomycosis is an implantation mycosis and is known to be acquired when fungi enter the skin after a traumatic transcutaneous injury. Melanized, filamentous fungi cause chromoblastomycosis and produce melanin in both reproductive and vegetative cells."
    explanation: Summarizes environmental melanized filamentous growth and traumatic implantation into human skin.
progression:
- phase: Chronic progressive subcutaneous infection
  notes: >-
    Lesions begin months after cutaneous trauma as an erythematous macule or
    painless papule and slowly progress over years (median diagnostic delay ~4
    years) into verrucous, hyperkeratotic plaques, nodules, cauliflower-like
    tumors, and ulcerated fibrotic lesions complicated by secondary bacterial
    infection and lymphedema.
  evidence:
  - reference: PMID:29261968
    reference_title: "Chromoblastomycosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The infection has wide morphologic variability but typically begins as a pink-to-red macule or papule and evolves in later stages to a verrucous, hyperkeratotic plaque, tumor, or nodule; ultimately, the slow-growing, warty (eg, cauliflower-like) lesions may ulcerate."
    explanation: Characterizes the indolent clinical evolution from initial macule/papule to verrucous plaques, nodules, and ulcerating warty masses.
  - reference: DOI:10.3390/jof10030168
    reference_title: "Chromoblastomycosis in French Guiana: Epidemiology and Practices, 1955–2023"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lesions were mostly observed on the lower limbs (78.3%), with a median time to diagnosis of four years."
    explanation: Quantifies lower-extremity predominance and multi-year indolent progression prior to diagnosis.
pathophysiology:
- name: Dimorphic Transformation into Melanin-Rich Muriform (Sclerotic) Bodies
  description: >-
    Following traumatic implantation into the dermis and hypodermis,
    chromoblastomycosis-causing hyphae and conidia transform into thick-walled,
    melanin-pigmented muriform (sclerotic) bodies whose cell-wall dihydroxynaphthalene
    melanin and chitin shield the fungus against proteolytic enzymes, reactive
    oxygen/nitrogen species, phagocytosis, and antifungal clearance.
  role: trigger
  biological_scale: CELLULAR
  conforms_to: "granuloma_formation#Persistent Indigestible Stimulus"
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  - preferred_term: hypodermis
    term:
      id: UBERON:0002072
      label: hypodermis
  evidence:
  - reference: DOI:10.1371/journal.pntd.0012562
    reference_title: "A global chromoblastomycosis strategy and development of the global chromoblastomycosis working group"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Melanin was shown to protect the transformation of hyphae and conidia into pigmented muriform bodies (sclerotic) with an increase in the thickness of the cell wall that provides a potentially resistance mechanism to host immune responses and antifungal drugs."
    explanation: Establishes transformation into thick-walled melanized muriform bodies as the key persistent tissue virulence state resisting host immunity.
  downstream:
  - target: Melanin-Mediated Resistance to Macrophage Killing
    causal_link_type: DIRECT
    description: Melanized thick-walled muriform cells resist macrophage phagocytosis and oxidative/proteolytic killing.
    evidence:
    - reference: DOI:10.1371/journal.pntd.0012562
      reference_title: "A global chromoblastomycosis strategy and development of the global chromoblastomycosis working group"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Melanin may play a role in the virulence of chromoblastomycosis-causing fungi with potential mechanisms such as protection against proteolytic enzymes, protection against oxygen or nitrogen derivatives, or reduction of phagocytosis [9]."
      explanation: Explains how fungal cell-wall melanin impairs phagocytosis and oxidative/proteolytic macrophage clearance.
  - target: Mixed Suppurative and Granulomatous Dermal Inflammation
    causal_link_type: DIRECT
    description: Persistent indigestible muriform bodies nucleate chronic pyogranulomatous dermal inflammation.
- name: Melanin-Mediated Resistance to Macrophage Killing
  description: >-
    Thick-walled melanized muriform cells resist macrophage phagocytosis,
    proteolytic degradation, and reactive oxygen/nitrogen killing, impairing
    intracellular elimination and leaving viable fungal clusters persisting in
    the dermis and subcutis.

    reference_title: "Chromoblastomycosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Diagnosis of chromoblastomycosis requires the identification of multicellular clusters of pigmented fungal cells, which produce a characteristic finding called sclerotic bodies (ie, muriform bodies, copper pennies, medlar bodies) on a potassium hydroxide stain or with histopathologic analysis of a skin biopsy."
    explanation: Establishes visualization of pigmented sclerotic/muriform bodies on KOH direct microscopy as diagnostic of chromoblastomycosis.
  - reference: DOI:10.1371/journal.pntd.0012562
    reference_title: "A global chromoblastomycosis strategy and development of the global chromoblastomycosis working group"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Diagnosis of chromoblastomycosis depends heavily on clinical expertise and access to direct mycological examination (e.g., potassium hydroxide preparation) or histopathology. Identification of muriform bodies provides a confirmed diagnosis, but it is dependent on obtaining a sample from a correct location on the lesion and having materials and technical expertise in microscopy [29]."
    explanation: Confirms direct KOH mycological microscopy for muriform bodies as a primary confirmatory diagnostic modality.
- name: Skin Biopsy and Histopathologic Examination
  description: >-
    Punch or shave skin biopsy demonstrates epidermal hyperplasia and mixed
    suppurative-granulomatous dermal inflammation containing dark-brown,
    thick-walled muriform (Medlar) bodies, distinguishing chromoblastomycosis
    from squamous cell carcinoma and other verrucous infections.
  diagnosis_term:
    preferred_term: Skin Biopsy
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  evidence:
  - reference: DOI:10.7759/cureus.73619
    reference_title: "Treatment-Resistant Chromoblastomycosis Successfully Managed With Surgical Excision"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The diagnosis is made by visualization of the thick-walled pigmented structures referred to as sclerotic bodies (also known as Medlar bodies or muriform bodies) or pigmented septate hyphae or both on a biopsy specimen of the lesion."
    explanation: Confirms skin biopsy visualization of sclerotic/Medlar/muriform bodies as definitive histopathologic diagnosis.
- name: Mycological Culture for Etiologic Species Identification
  description: >-
    Fungal culture of skin scrapings or biopsy tissue isolates slow-growing
    melanized colonies, enabling genus and species identification (such as
    Fonsecaea pedrosoi or Cladophialophora carrionii), though microscopy confirms
    tissue muriform bodies.
  diagnosis_term:
    preferred_term: Microbial Culture Procedure
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  evidence:
  - reference: DOI:10.3390/jof10030168

  description: >-
    Chronic human chromoblastomycosis skin lesions exhibit Th2 and regulatory
    T-cell association alongside a mixed CD4+ and CD8+ infiltrate with high
    densities of IL-10-, IL-17-, and IFN-gamma-producing cells and markedly
    increased PD-1+ and PD-L1+ exhausted immune cells, permitting fungal
    maintenance in the skin and disease progression even when IFN-gamma is
    present.

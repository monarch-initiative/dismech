review_notes: >-
  Deliberately lumped. Chromoblastomycosis is caused by multiple melanized
  Chaetothyriales species — predominantly Fonsecaea pedrosoi, Fonsecaea
  monophora, Fonsecaea nubica, Cladophialophora carrionii, Phialophora verrucosa,
  Rhinocladiella aquaspersa, and occasionally Exophiala species — and presents
  across clinical lesion morphotypes (nodular, verrucous, tumoral, plaque, and
  cicatricial). This entry curates chromoblastomycosis as a single Disease entity
  rather than splitting by fungal species or lesion morphotype because all
  etiologic agents share traumatic cutaneous implantation, conversion into
  pathognomonic thick-walled pigmented muriform (sclerotic) bodies in host
  dermis, mixed suppurative-granulomatous inflammation with epidermal
  hyperplasia, direct KOH/histopathologic muriform-body diagnosis, and shared
  systemic antifungal (itraconazole, terbinafine) and physical/surgical
  management.

name: Chromoblastomycosis
creation_date: '2026-01-26T15:56:41Z'
category: Infectious Disease
synonyms:
- chromomycosis
- verrucous dermatitis
- cladosporiosis
- Fonseca disease
- Pedroso disease
description: >-
  Chromoblastomycosis is a chronic, slowly progressive subcutaneous implantation
  mycosis and World Health Organization-recognized neglected tropical disease
  caused by melanized (dematiaceous) Chaetothyriales fungi, most commonly
  Fonsecaea pedrosoi, Fonsecaea monophora, Fonsecaea nubica, Cladophialophora
  carrionii, Phialophora verrucosa, and Rhinocladiella aquaspersa. Following
  traumatic transcutaneous inoculation of environmental conidia or hyphal
  fragments from plant debris or soil into exposed skin (most frequently the
  lower limbs of outdoor workers), the fungi undergo dimorphic conversion into
  thick-walled, melanin-rich muriform (sclerotic or Medlar) bodies that divide by
  internal septation and resist macrophage killing. Persistent tissue infection
  elicits mixed suppurative and granulomatous dermal inflammation accompanied by
  marked epidermal hyperplasia, hyperkeratosis, and progressive dermal fibrosis,
  evolving over months to years from papules into verrucous or cauliflower-like
  plaques, nodules, tumoral masses, and ulcers, with late complications including
  lymphedema, secondary bacterial infection, and rare squamous cell carcinoma.

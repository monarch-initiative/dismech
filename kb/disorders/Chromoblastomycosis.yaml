  - reference: DOI:10.3390/jof10030168
    reference_title: "Chromoblastomycosis in French Guiana: Epidemiology and Practices, 1955–2023"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgery should be recommended for recent and limited lesions."
    explanation: Supports surgical excision for recent, localized chromoblastomycosis lesions.
  - reference: PMID:29261968
    reference_title: "Chromoblastomycosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although other differential diagnoses may include infectious and noninfectious verrucous lesions, the treatment of chromoblastomycosis includes surgical removal for mild disease and antifungal therapy for moderate-to-severe disease."
    explanation: Establishes surgical removal as standard management for mild, localized chromoblastomycosis.
- name: Topical Imiquimod Immunomodulatory Adjunctive Therapy
  description: >-
    Topical imiquimod (a Toll-like receptor 7 agonist immune response modifier)
    enhances local innate and Th1 cellular immune responses against persistent
    dermal fungi and accelerates lesion regression when combined with oral
    itraconazole and terbinafine.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: imiquimod
      term:
        id: CHEBI:36704
        label: imiquimod
  target_mechanisms:
  - target: Th2/Treg-Skewed Immune Response with PD-1/PD-L1 Upregulation
    treatment_effect: MODULATES
    description: Imiquimod stimulates local cutaneous cellular antifungal immunity to counteract regulatory/exhausted host immune persistence.
    evidence:
    - reference: DOI:10.1186/s12941-024-00718-y
      reference_title: "Successful management of chromoblastomycosis utilizing conventional antifungal agents and imiquimod therapy"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Imiquimod, acting as an immune response modifier, boosts the host’s immune response against CBM, and controls scar hyperplasia, thereby reducing the treatment duration."
      explanation: Documents topical imiquimod augmenting the host immune response against chromoblastomycosis alongside systemic antifungals.
  evidence:
  - reference: DOI:10.1186/s12941-024-00718-y
    reference_title: "Successful management of chromoblastomycosis utilizing conventional antifungal agents and imiquimod therapy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present a case of CBM in Guangdong with characteristic reflectance confocal microscopy manifestations, effectively managed through a combination of itraconazole, terbinafine, and imiquimod, shedding light on novel strategies for managing this challenging condition."
    explanation: Human clinical case report demonstrating effective combination therapy with itraconazole, terbinafine, and topical imiquimod.
notes: >-
  No GeneReviews chapter covers chromoblastomycosis in the NCBI Bookshelf index;
  the NCBI Bookshelf StatPearls chapter (PMID:29261968) is tagged in references.
  In disease refractory to itraconazole and terbinafine, second-generation
  triazoles (posaconazole, voriconazole), flucytosine combination regimens,
  local heat therapy, and photodynamic therapy have been used as salvage or
  adjunctive options depending on regional availability.

      snippet: Like late osteocytes, they develop a dendritic morphology and
        express SOST/sclerostin and fibroblast growth factor 23 (FGF-23),
        regulated by parathyroid hormone (PTH) and 1,25-dihydroxyvitamin D(3).
      explanation: Establishes that the regulated sclerostin readout is present,
        which is what this link claims the model measures.
- name: 3D bone organoid with coupled osteoblast-osteoclast remodeling
  experimental_model_type: ORGANOID
  namo_type: namo:Organoid
  description: >-
    A human bone organoid built by letting marrow stromal cell-derived
    osteoblasts mineralize an endosteal-like matrix for 21 days, then adding
    marrow macrophage-derived osteoclasts to restore resorption. It is the
    closest available non-animal system to the coupled remodeling unit this
    entry models, and it reports the same CTX-1 resorption marker used
    clinically.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: Osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  - preferred_term: Bone marrow mesenchymal stromal cell
    term:
      id: CL:0000134
      label: mesenchymal stem cell
  publication: PMID:34173283
  notes: >-
    Developed and validated for myeloma bone disease, not for osteoporosis. The
    normal-bone arm of the platform is what is relevant here; no published
    application to age-related or postmenopausal bone loss is recorded, and it
    carries no aging axis.
  modeled_mechanisms:
  - target: Bone Remodeling Imbalance
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reconstitutes both arms of the remodeling unit in human cells, with
      osteoblastic mineralization and osteoclastic resorption in the same
      construct.
    limitations: >-
      The imbalance is imposed by adding myeloma plasma cells, not by estrogen
      withdrawal or aging, so the disease-relevant driver is a different one. It
      is short-term (weeks), has no vasculature, no marrow adipocyte
      compartment, and no mechanical loading, so neither the senescence nor the
      marrow-lineage node in this entry can be studied in it.
    readouts:
    - name: Type I collagen C-telopeptide release from the organoid
      target: Bone Remodeling Imbalance
      direction: INCREASED
      interpretation: Uses the same resorption marker as the clinical CTX assay,
        so the in vitro and clinical readouts are directly comparable.
      evidence:
      - reference: PMID:34173283
        reference_title: "A functional three-dimensional microphysiological human model of myeloma bone disease."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: increases levels of CTX-1, and decreased expression of
          osteoblastic genes
        explanation: Reports the coupled shift toward resorption that this link
          claims the organoid reproduces.
    evidence:
    - reference: PMID:34173283
      reference_title: "A functional three-dimensional microphysiological human model of myeloma bone disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: On day 22, bone marrow macrophage (BMM)-derived osteoclasts (OCs)
        were introduced to enhance the resorptive capability of the model and
        recapitulate the balanced homeostatic nature of skeletal remodeling.
      explanation: Documents that both arms of the remodeling unit are present,
        which is the basis for treating this as a model of remodeling balance.

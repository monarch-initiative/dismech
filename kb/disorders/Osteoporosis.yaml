computational_models:
- name: QCT-based finite element model of the proximal femur
  model_type: PHYSIOLOGICAL
  description: >-
    A patient-specific structural model built from a quantitative CT scan of the
    hip, solving for femoral strength and for the ratio of the load a fall would
    impose to the strength available to resist it. It is the computational
    counterpart of this entry's claim that microarchitecture and geometry carry
    fracture risk that areal BMD alone does not.
  modeled_mechanisms:
  - target: Microarchitectural Deterioration
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Turns the structural deterioration this node describes into a mechanical
      quantity that prospectively predicts hip fracture, and the load-to-strength
      ratio stays predictive after adjustment for areal BMD.
    limitations: >-
      Resolves geometry and density at CT scale, so it does not represent
      trabecular connectivity or cortical porosity directly, and it says nothing
      about the cellular mechanisms upstream. Validated here in older men; the
      cohort is not the population most affected.
    readouts:
    - name: Load-to-strength ratio adjusted for areal BMD
      target: Microarchitectural Deterioration
      direction: INCREASED
      interpretation: Retained prediction after BMD adjustment is what shows the
        model captures structural information beyond density.
      evidence:
      - reference: PMID:19049327
        reference_title: "Finite element analysis of the proximal femur and hip fracture risk in older men."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "When adjusted additionally for aBMD, the load-to-strength ratio
          remained significantly associated with fracture (HR = 3.1, 95% CI:
          1.6-6.1)."
        explanation: The BMD-adjusted hazard ratio is the specific result behind
          this readout.
  publication: PMID:19049327
  evidence:
  - reference: PMID:19049327
    reference_title: "Finite element analysis of the proximal femur and hip fracture risk in older men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These results provide insight into hip fracture etiology and
      demonstrate the ability of FE-based biomechanical analysis of QCT scans to
      prospectively predict hip fractures in men.
    explanation: Prospective case-cohort validation in 3549 community-dwelling
      men establishes the model as predictive rather than merely descriptive.
- name: Bone cell population dynamics model of the remodeling unit
  model_type: KINETIC
  description: >-
    A differential-equation model of autocrine and paracrine signalling between
    osteoblast and osteoclast lineages at a single remodeling site, solving for
    cell population dynamics and the resulting change in bone mass. It is the
    formal counterpart of this entry's Bone Remodeling Imbalance node.
  modeled_mechanisms:
  - target: Bone Remodeling Imbalance
    relationship: MEASURES
    fidelity: LOW
    description: >-
      Reproduces a single remodeling cycle, self-sustaining cycling, and unstable
      runaway remodeling from one parameter set, and identifies autocrine
      regulation of osteoclasts as the parameter that decides which regime the
      system occupies.
    limitations: >-
      A single-site abstraction with lumped parameters and no spatial structure,
      no osteocyte compartment, and no aging or estrogen axis, so it cannot
      represent the senescence or marrow-lineage nodes in this entry. Its
      pathological regime was matched to Paget disease rather than to
      osteoporosis.
    evidence:
    - reference: PMID:14499354
      reference_title: "Mathematical model predicts a critical role for osteoclast autocrine regulation in the control of bone remodeling."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: the mathematical model revealed that interactions among
        osteoblasts and osteoclasts result in complex, nonlinear system behavior,
        which cannot be deduced from studies of each cell type alone
      explanation: States what the model contributes over single-cell-type
        reasoning, which is the reason to record it against the imbalance node.
  publication: PMID:14499354
  notes: >-
    No committed dismech-perturb run exists for this model; it is recorded as
    published external work, not as an executable model in this repository.
  evidence:
  - reference: PMID:14499354
    reference_title: "Mathematical model predicts a critical role for osteoclast autocrine regulation in the control of bone remodeling."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Parametric analysis demonstrated that the mode of dynamic behavior
      in the system depends strongly on the regulation of osteoclasts by
      autocrine factors, such as transforming growth factor beta.
    explanation: Identifies the parameter that determines system behaviour, the
      model's substantive prediction.

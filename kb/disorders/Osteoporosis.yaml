discussions:
- discussion_id: mismatch_op_rodent_cortical_remodeling
  prompt: >-
    Almost everything known about the cellular mechanism of age-related bone loss
    comes from mice and rats, whose skeletons have no osteonal remodeling of
    cortical bone and continue growing slowly after puberty. Human cortical bone
    loss proceeds largely through intracortical Haversian remodeling, a
    compartment that does not exist in the rodent. When an aged mouse gains
    cortical porosity, is that the same process that produces cortical porosity
    in an ageing human, or a structurally different route to a phenotype that
    merely looks alike on microCT?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  rationale: >-
    This is not a general caveat about rodents; it is specific and consequential.
    The cortical compartment carries most of the fracture burden after age 65,
    and cortical porosity is the parameter that intervention studies in mice
    report. If the murine gain in porosity arises without Haversian remodeling,
    then the mechanistic step being modelled is absent from the model, and a
    treatment effect on murine cortical bone cannot be assumed to transfer. The
    same limitation constrains the OVX rat, which is the FDA-designated
    preclinical model. Note the mismatch is partial rather than total: the
    cancellous arm and the refilling defect are shared, and this entry records
    those links at moderate fidelity for that reason.
  attaches_to:
  - pathophysiology#Microarchitectural Deterioration
  - animal_models#Aged mouse skeleton as a model of human age-related bone loss
  - animal_models#Ovariectomized rat
  evidence:
  - reference: PMID:23689830
    reference_title: "The relevance of mouse models for investigating age-related bone loss in humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Unlike the human skeleton, however, the murine skeleton continues to
      grow slowly after puberty and lacks osteonal remodeling of cortical bone.
    explanation: States the structural mismatch precisely and is the reason this
      is recorded as HUMAN_MODEL_MISMATCH rather than a knowledge gap.
  - reference: PMID:23689830
    reference_title: "The relevance of mouse models for investigating age-related bone loss in humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Knowledge of the causes of skeletal fragility in mice should
      therefore be applicable to humans if inherent limitations are recognized.
    explanation: The author's own conditional endorsement - the model is usable
      but only with the mismatch made explicit, which is what this record does.
- discussion_id: gap_op_senescent_burden_stratification
  prompt: >-
    Clearing senescent cells causally reverses age-related bone loss in old mice,
    yet a phase 2 trial of intermittent dasatinib plus quercetin in
    postmenopausal women missed its primary endpoint: CTx did not differ from
    control at 20 weeks. Formation rose transiently, and in an exploratory
    subgroup with the highest T cell p16 burden both markers moved and radius BMD
    increased. Is senescent cell burden the effect modifier that decides who
    responds, and is there a measurable threshold below which senolytic therapy
    should not be expected to work?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    The mouse work is unusually strong - genetic and pharmacological clearance
    agree, the effect is absent in young animals, and the in vitro SASP
    experiment supplies the mechanism - so a negative human primary endpoint is
    more likely to reflect patient selection, dose, or timing than a false
    preclinical result. Postmenopausal women shortly after menopause are
    oestrogen-deficient rather than necessarily senescence-burdened, so the trial
    may have been run in the population least likely to respond. The subgroup
    finding is exploratory and underpowered and must not be read as a positive
    result; it is a hypothesis about stratification. Resolving this decides
    whether senolytics are an osteoporosis therapy at all, or a therapy for a
    definable high-burden subset.
  attaches_to:
  - pathophysiology#Senescent Cell Accumulation in the Bone Microenvironment
  - pathophysiology#Osteocyte Senescence and SASP Acquisition
  evidence:
  - reference: PMID:28825716
    reference_title: "Targeting cellular senescence prevents age-related bone loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In aged (20- to 22-month-old) mice with established bone loss,
      activation of the INK-ATTAC caspase 8 in senescent cells or treatment with
      senolytics or the JAKi for 2-4 months resulted in higher bone mass and
      strength and better bone microarchitecture than in vehicle-treated mice.
    explanation: The preclinical result whose failure to translate defines this
      gap.
  - reference: PMID:38956196
    reference_title: "Effects of intermittent senolytic therapy on bone metabolism in postmenopausal women: a phase 2 randomized controlled trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: intermittent D + Q treatment did not reduce bone resorption in the
      overall group of postmenopausal women
    explanation: The negative primary endpoint in humans, which contradicts a
      direct read-across from the mouse result.
  - reference: PMID:38956196
    reference_title: "Effects of intermittent senolytic therapy on bone metabolism in postmenopausal women: a phase 2 randomized controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: our exploratory analyses indicate that further studies are needed
      testing the hypothesis that the underlying senescent cell burden may
      dictate the clinical response to senolytics
    explanation: The trialists' own framing of the stratification hypothesis this
      gap is asking about.
- discussion_id: gap_op_marrow_adiposity_direction
  prompt: >-
    Marrow adipose volume rises with age, is higher again in osteoporosis at
    matched age, and is inversely correlated with trabecular bone volume. The
    shared osteoblast-adipocyte precursor makes lineage diversion the natural
    reading. But the human evidence is cross-sectional biopsy data, which cannot
    separate diversion of the precursor from passive filling of space vacated by
    lost bone. Which is it, and does marrow fat contribute causally to bone loss
    or merely mark it?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    The distinction changes what the marrow lineage node is for. If adipogenic
    diversion is causal, the precursor allocation step is a therapeutic target
    and marrow fat is a candidate biomarker of formation failure; if marrow fat
    is a space-filling consequence, it is neither. This entry currently asserts
    the lineage-shift reading in a pathophysiology node, so the uncertainty
    should be visible next to it rather than left implicit.
  attaches_to:
  - pathophysiology#Marrow Stromal Lineage Shift Toward Adipogenesis
  evidence:
  - reference: PMID:11708718
    reference_title: "Adipocyte tissue volume in bone marrow is increased with aging and in patients with osteoporosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The cellular and molecular mechanisms mediating these changes remain

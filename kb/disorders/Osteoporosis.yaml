- name: IDG-SW3 osteoblast-to-osteocyte differentiation line
  experimental_model_type: CELL_LINE
  namo_type: namo:CellLineModel
  description: >-
    A conditionally immortalized line that traverses the whole
    osteoblast-to-late-osteocyte transition in culture and expresses
    SOST/sclerostin under PTH and 1,25-dihydroxyvitamin D3 control. That makes it
    the accessible in vitro system for the sclerostin axis this entry targets
    pharmacologically with romosozumab.
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  cell_types:
  - preferred_term: Osteocyte
    term:
      id: CL:0000137
      label: osteocyte
  culture_system: 3D matrix or 2D osteogenic culture at 37 C without interferon gamma
  publication: PMID:21735478
  modeled_mechanisms:
  - target: Bone Remodeling Imbalance
    relationship: MEASURES
    fidelity: LOW
    description: >-
      Provides a readout of sclerostin production and its hormonal regulation,
      the formation-side brake in the remodeling unit.
    limitations: >-
      Murine and conditionally immortalized. It reconstructs a differentiation
      trajectory, not a remodeling unit - there are no osteoclasts in it, so the
      balance this entry models cannot be observed directly.
    evidence:
    - reference: PMID:21735478
      reference_title: "Cell line IDG-SW3 replicates osteoblast-to-late-osteocyte differentiation in vitro and accelerates bone formation in vivo."
      supports: SUPPORT

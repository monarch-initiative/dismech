    evidence:
    - reference: PMID:9421234
      reference_title: "Establishment of an osteocyte-like cell line, MLO-Y4."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: This newly established cell line should prove useful for studying
        the effects of mechanical stress on osteocyte function and for
        determining the means whereby osteocytes communicate with other bone
        cells such as osteoblasts and osteoclasts.
      explanation: The authors' stated purpose matches the mechanism this link

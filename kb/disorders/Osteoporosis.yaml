- population: United States adults aged 50 years and older (NHANES 2005-2010)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 10300.0
  notes: >-
    Densitometric definition (T-score <= -2.5 at femoral neck or lumbar spine) in a
    nationally representative survey; a further 43.9% had low bone mass.
  evidence:
  - reference: PMID:24771492
    reference_title: "The recent prevalence of osteoporosis and low bone mass in the United States based on bone mineral density at the femoral neck or lumbar spine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Based on an overall 10.3% prevalence of osteoporosis, we estimated
      that in 2010, 10.2 million older adults had osteoporosis.
    explanation: Nationally representative DXA-based prevalence estimate for a
      single well-characterised population.
pathophysiology:
- name: Osteocyte Senescence and SASP Acquisition
  conforms_to: "cellular_senescence#Senescence-Associated Secretory Phenotype"
  biological_scale: CELLULAR
  description: >-
    With advancing age, osteocytes - the long-lived, terminally differentiated,
    non-dividing cells that orchestrate remodeling - upregulate p16INK4a and
    acquire a senescence-associated secretory phenotype. Osteocytes and myeloid
    cells are the two bone-resident populations that predominantly develop the
    SASP, and the secretome impairs osteoblast mineralization while enhancing
    osteoclast-progenitor survival. This is the aging arm of the entry: it is
    distinct from estrogen deficiency and operates in both sexes.
  cell_types:
  - preferred_term: Osteocyte
    term:
      id: CL:0000137
      label: osteocyte
  biological_processes:
  - preferred_term: Cellular Senescence
    modifier: INCREASED
    term:
      id: GO:0090398
      label: cellular senescence
  downstream:
  - target: Senescent Cell Accumulation in the Bone Microenvironment
    causal_link_type: DIRECT
    description: >-
      Senescent cells are apoptosis-resistant, so once the rate at which they
      arise outpaces immune clearance they accumulate in the bone
      microenvironment.
  - target: RANKL/OPG Dysregulation
    causal_link_type: DIRECT
    description: >-
      Senescent-cell conditioned medium enhances osteoclast-progenitor survival
      and osteoclastogenesis, converging on the same resorption-favouring state
      that estrogen loss produces by a different route.
    evidence:
    - reference: PMID:28825716
      reference_title: "Targeting cellular senescence prevents age-related bone loss in mice."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: senescent-cell conditioned medium impaired osteoblast
        mineralization and enhanced osteoclast-progenitor survival, leading to
        increased osteoclastogenesis
      explanation: Establishes that the secreted SASP, rather than the senescent
        cell itself, is what acts on the osteoblast and osteoclast compartments.
  evidence:
  - reference: PMID:27341653
    reference_title: "Identification of Senescent Cells in the Bone Microenvironment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: senescent myeloid cells and senescent osteocytes predominantly
      develop the SASP
    explanation: Identifies the osteocyte as one of the two SASP-developing
      populations in bone, which is why this node is scoped to osteocytes.
  - reference: PMID:27341653
    reference_title: "Identification of Senescent Cells in the Bone Microenvironment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "revealed significantly more senescent osteocytes in old compared
      with young bone cortices (11% versus 2%, p < 0.001)"
    explanation: Quantifies the age-associated rise in senescent osteocytes in
      vivo using SADS, without relying on cultured cells.
- name: Senescent Cell Accumulation in the Bone Microenvironment
  conforms_to: "cellular_senescence#Senescent Cell Accumulation"
  biological_scale: TISSUE
  description: >-
    Senescent cells accumulate across multiple bone-resident lineages with age.
    The burden is causal rather than a bystander marker: clearing roughly 30% of
    p16-positive cells in aged mice, genetically or pharmacologically, yields
    higher bone mass, better microarchitecture and greater strength, and does so
    only in old animals.
  cell_types:
  - preferred_term: Osteocyte
    term:
      id: CL:0000137
      label: osteocyte
  downstream:
  - target: Bone Remodeling Imbalance
    causal_link_type: DIRECT
    description: >-
      Clearing senescent cells lowers resorption while maintaining trabecular and
      raising cortical formation, which is the remodeling imbalance running in
      reverse.
    evidence:
    - reference: PMID:28825716
      reference_title: "Targeting cellular senescence prevents age-related bone loss in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The beneficial effects of targeting senescent cells were due to
        lower bone resorption with either maintained (trabecular) or higher
        (cortical) bone formation as compared to vehicle-treated mice
      explanation: Shows the intervention acts on both arms of the remodeling
        balance, which is what makes this an upstream node rather than a
        resorption-only one.
  evidence:
  - reference: PMID:28825716
    reference_title: "Targeting cellular senescence prevents age-related bone loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: these data establish a causal role for senescent cells in bone loss
      with aging, and demonstrate that targeting these cells has both
      anti-resorptive and anabolic effects on bone
    explanation: The authors' own causal claim, supported by concordant genetic
      and pharmacological clearance arms in the same study.
- name: Marrow Stromal Lineage Shift Toward Adipogenesis
  conforms_to: "stem_cell_exhaustion#Decline in Stem Cell Self-Renewal and Function"
  biological_scale: CELLULAR
  description: >-
    Osteoblasts and marrow adipocytes derive from a shared mesenchymal precursor,
    and with age that precursor is allocated increasingly to the adipogenic
    rather than the osteogenic fate. Marrow adipose volume rises with age and is
    higher again in osteoporosis at matched age, and it is inversely correlated
    with trabecular bone volume - a decline in the regenerative output of the
    stromal compartment rather than a change in resorption.
  cell_types:
  - preferred_term: Bone marrow mesenchymal stromal cell
    term:
      id: CL:0000134
      label: mesenchymal stem cell
  - preferred_term: Marrow adipocyte
    term:
      id: CL:0000136
      label: adipocyte
  biological_processes:
  - preferred_term: Fat Cell Differentiation
    modifier: INCREASED
    term:
      id: GO:0045444
      label: fat cell differentiation
  - preferred_term: Osteoblast Differentiation
    modifier: DECREASED
    term:
      id: GO:0001649
      label: osteoblast differentiation
  downstream:
  - target: Bone Remodeling Imbalance
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Diverting the shared precursor away from the osteoblast lineage reduces the
      formation side of the remodeling unit, so the imbalance is reached without
      any increase in osteoclast activity.
  notes: >-
    The direction of causation is not settled by the cited human data, which are
    cross-sectional biopsies; the correlation is consistent with lineage
    diversion but does not exclude marrow adiposity being a consequence of bone
    loss. See the discussions section.
  evidence:
  - reference: PMID:11708718
    reference_title: "Adipocyte tissue volume in bone marrow is increased with aging and in patients with osteoporosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was an age-related inverse correlation between BV/TV and
      AV/TV (r = -0.58, P < 0.001)."
    explanation: Iliac crest biopsies from 53 healthy individuals aged 30-100
      show marrow fat rising as trabecular bone volume falls.
  - reference: PMID:11708718
    reference_title: "Adipocyte tissue volume in bone marrow is increased with aging and in patients with osteoporosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared with age-matched controls, patients with osteoporosis
      exhibited an increased AV/TV (P < 0.05) and decreased BV/TV (P < 0.05)"
    explanation: The shift is greater in osteoporosis than in age-matched
      controls, so it is not purely a function of chronological age.
- name: Bone Remodeling Imbalance
  description: >
    Increased osteoclast-mediated bone resorption relative to osteoblast- mediated
    bone formation leads to net bone loss. This imbalance accelerates with aging and
    estrogen deficiency.
  cell_types:
  - preferred_term: Osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  - preferred_term: Osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: Bone Remodeling
    term:
      id: GO:0046849
      label: bone remodeling
  evidence:
  - reference: PMID:21874760
    reference_title: "Aromatase activity and bone loss."
    supports: SUPPORT
    snippet: aromatase activity and estrogen production are necessary for longitudinal
      bone growth, attainment of peak bone mass, the pubertal growth spurt, epiphyseal
      closure, and normal bone remodeling in young individuals.
    explanation: Demonstrates that estrogen, produced by aromatase, is essential for
      normal bone remodeling and that deficiency leads to bone loss
  - reference: PMID:23748068
    reference_title: "Aromatase deficiency, a rare syndrome: case report."
    supports: SUPPORT
    snippet: Estrogen deficiency can induce delayed epiphyseal closure, eunuchoid
      body habitus, osteopenia, and osteoporosis in both genders.
    explanation: Clinical evidence showing that estrogen deficiency directly causes
      osteoporosis through impaired bone remodeling
- name: RANKL/OPG Dysregulation
  description: >
    Increased RANKL and decreased osteoprotegerin (OPG) ratio promotes osteoclast
    differentiation and activation. Estrogen normally suppresses RANKL and increases
    OPG. Microgravity further exacerbates this imbalance by directly increasing the
    osteoblast RANKL/OPG ratio.
  biological_processes:
  - preferred_term: Osteoclast Differentiation
    term:
      id: GO:0030316
      label: osteoclast differentiation
  evidence:
  - reference: PMID:33692806
    reference_title: "Role of the IL-23/IL-17 Pathway in Rheumatic Diseases: An Overview."
    supports: SUPPORT
    snippet: The differentiation of osteoclasts is induced significantly in the presence
      of IL-17 either directly (207), or indirectly, through upregulation of RANKL.
    explanation: Demonstrates that RANKL upregulation is a key mechanism for osteoclast
      differentiation and bone resorption
  - reference: PMID:21874760
    reference_title: "Aromatase activity and bone loss."
    supports: SUPPORT
    snippet: with aging, individual differences in aromatase activity and thus in
      estrogen levels may significantly affect bone loss and fracture risk in both
      genders.
    explanation: Shows that age-related decline in estrogen production affects bone
      metabolism, linking to RANKL/OPG dysregulation
  - reference: PMID:16927271
    reference_title: "Modeled microgravity stimulates osteoclastogenesis and bone resorption by increasing osteoblast RANKL/OPG ratio."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: microgravity is capable to indirectly stimulate osteoclast formation
      and activity by regulating osteoblast secretion of crucial regulatory factors
      such as RANKL and OPG
    explanation: Simulated microgravity using NASA Rotating Wall Vessel increases
      osteoblast RANKL/OPG ratio, stimulating osteoclastogenesis and bone resorption
  - reference: PMID:26318907
    reference_title: "Osteoprotegerin is an effective countermeasure for spaceflight-induced bone loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: SF/VEH mice had lower BV/TV vs. GC/VEH mice, while SF/OPG-Fc mice had
      greater BV/TV than SF/VEH or GC/VEH
    explanation: OPG-Fc (RANKL inhibitor) prevented spaceflight-induced bone loss
      in mice during 12-day shuttle mission, confirming RANKL pathway centrality
- name: Microarchitectural Deterioration
  description: >
    Loss of trabecular connectivity and cortical thinning compromises bone strength
    beyond what BMD alone indicates. Leads to fragility fractures with minimal trauma.
    Spaceflight accelerates this process, with incomplete microarchitectural recovery
    even one year post-flight.
  evidence:
  - reference: PMID:23748068
    reference_title: "Aromatase deficiency, a rare syndrome: case report."
    supports: SUPPORT
    snippet: recurrent bone fractures associated with minimal trauma starting in puberty
    explanation: Clinical case demonstrating that estrogen deficiency leads to fragility
      fractures due to compromised bone microarchitecture
  - reference: PMID:35773442
    reference_title: "Incomplete recovery of bone strength and trabecular microarchitecture at the distal tibia 1 year after return from long duration spaceflight."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: nine of 17 astronauts did not fully recover tibia total BMD after 12-months
    explanation: HR-pQCT imaging of astronauts shows incomplete recovery of trabecular
      microarchitecture at weight-bearing tibia one year after long-duration spaceflight,
      equivalent to a decade of terrestrial bone aging
  - reference: PMID:31897866
    reference_title: "Spaceflight-Induced Bone Tissue Changes that Affect Bone Quality and Increase Fracture Risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: bone structural quality (e.g., trabecular microarchitecture) is diminished
      and the quality of bone material is reduced via impaired tissue mineralization,
      maturation, and maintenance (e.g., mediated by osteocytes)
    explanation: Review of spaceflight-induced bone quality changes beyond BMD, showing
      both structural and material quality are compromised in microgravity
  - reference: PMID:28572612
    reference_title: "One-month spaceflight compromises the bone microstructure, tissue-level mechanical properties, osteocyte survival and lacunae volume in mature mice skeletons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: osteocyte death was evidenced along with a smaller and more spherical
      shape of the osteocyte lacunae because of lacunar mineralization
    explanation: Bion-M1 one-month spaceflight caused trabecular disconnection, cortical
      thinning, and osteocyte death in mice, with no recovery at 8 days
- name: Osteocyte Mechanosensing Disruption in Microgravity
  description: Microgravity removes gravitational mechanical loading, impairing osteocyte
    mechanotransduction. Osteocytes sense mechanical strain via the lacuno-canalicular
    network and regulate bone remodeling accordingly. In microgravity, loss of fluid
    shear stress and mechanical stimulation leads to downregulation of key osteocytic
    genes and impaired osteocyte differentiation.
  cell_types:
  - preferred_term: Osteocyte
    term:
      id: CL:0000137
      label: osteocyte
  biological_processes:
  - preferred_term: Cellular Response to Mechanical Stimulus
    term:
      id: GO:0071260
      label: cellular response to mechanical stimulus
  evidence:
  - reference: PMID:33835498
    reference_title: "Global transcriptomic analysis of a murine osteocytic cell line subjected to spaceflight."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: µG impairs the differentiation of osteocytes, consistent with prior osteoblast
      spaceflight experiments, which resulted in the downregulation of key osteocytic
      genes
    explanation: Osteocyte cell line (Ocy454) flown on ISS SpaceX Dragon-6 showed
      impaired differentiation and altered glycolysis, effects not replicated by ground-based
      simulators
  - reference: PMID:29559713
    reference_title: "Skeletal changes during and after spaceflight."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: clear parallels exist between the effects of spaceflight, periods of
      immobilization and ageing, with possibly irreversible features
    explanation: Review establishes that spaceflight-induced skeletal changes parallel
      accelerated aging via disrupted mechanosensing
- name: Microgravity-Accelerated Bone Resorption
  conforms_to: "osteoporosis_bone_resorption#Increased Osteoclastic Bone Resorption"
  description: Spaceflight induces a rapid and sustained increase in osteoclast-mediated
    bone resorption. Astronauts lose approximately 0.8% of bone mass per month in
    weight-bearing lower limb sites, with bone resorption markers plateauing at 113%
    above pre-flight levels within days of entering microgravity.
  biological_processes:
  - preferred_term: Bone Resorption
    term:
      id: GO:0045453
      label: bone resorption
  evidence:
  - reference: PMID:32411816
    reference_title: "A systematic review and meta-analysis of bone loss in space travelers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Bone loss in space travelers is a major challenge for long-duration space
      exploration.
    explanation: Meta-analysis of 148 space travelers quantifies lower limb bone loss
      rate of -0.8% per month during microgravity exposure
  - reference: PMID:32411816
    reference_title: "A systematic review and meta-analysis of bone loss in space travelers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: microgravity-induced bone loss is a significant and unresolved health
      risk for space travelers
    explanation: Bone resorption markers plateau at 113% above pre-flight levels with
      rapid onset (half-max at 11 days)
- name: Spaceflight-Induced Mitochondrial Stress in Bone
  description: Multi-omics analyses of spaceflight tissues reveal mitochondrial dysfunction
    as a central biological hub for spaceflight impact. Mitochondrial stress pathways
    are consistently enriched across multiple tissue types and missions, contributing
    to impaired cellular function in bone and other organ systems.
  biological_processes:
  - preferred_term: Mitochondrion Organization
    term:
      id: GO:0007005
      label: mitochondrion organization
  evidence:
  - reference: PMID:33242417
    reference_title: "Comprehensive Multi-omics Analysis Reveals Mitochondrial Stress as a Central Biological Hub for Spaceflight Impact."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Overall pathway analyses on the multi-omics datasets showed significant
      enrichment for mitochondrial processes, as well as innate immunity, chronic
      inflammation, cell cycle, circadian rhythm, and olfactory functions
    explanation: GeneLab multi-omics integration across NASA missions identifies mitochondrial
      stress as a consistent spaceflight phenotype
phenotypes:
- name: Decreased Bone Mineral Density
  category: Musculoskeletal
  frequency: VERY_FREQUENT
  diagnostic: true
  notes: T-score <= -2.5
  phenotype_term:
    preferred_term: Decreased Bone Density
    term:
      id: HP:0004349
      label: Reduced bone mineral density
  evidence:
  - reference: PMID:23748068
    reference_title: "Aromatase deficiency, a rare syndrome: case report."
    supports: SUPPORT
    snippet: Lumbar osteoporosis was detected in bone densitometry.
    explanation: Clinical documentation of reduced bone mineral density in aromatase
      deficiency-induced osteoporosis
  - reference: PMID:21874760
    reference_title: "Aromatase activity and bone loss."
    supports: SUPPORT
    snippet: aromatase activity and estrogen production are necessary for longitudinal
      bone growth, attainment of peak bone mass, the pubertal growth spurt, epiphyseal
      closure, and normal bone remodeling in young individuals.
    explanation: Demonstrates that estrogen deficiency impairs achievement and maintenance
      of peak bone mass, leading to decreased BMD
- name: Vertebral Fractures
  category: Musculoskeletal
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Vertebral Compression Fractures
    term:
      id: HP:0002953
      label: Vertebral compression fracture
  evidence:
  - reference: PMID:28168409
    reference_title: "Worldwide prevalence and incidence of osteoporotic vertebral fractures."
    supports: SUPPORT
    snippet: The prevalence of morphometric vertebral fractures in European women
      is highest in Scandinavia (26%) and lowest in Eastern Europe (18%).
    explanation: Systematic review documents high prevalence of vertebral fractures
      in osteoporosis, confirming this as a key phenotype.
- name: Femur Fractures
  category: Musculoskeletal
  frequency: OCCASIONAL
  notes: Major cause of morbidity and mortality
  phenotype_term:
    preferred_term: Femur Fractures
    term:
      id: HP:0031846
      label: Femur fracture
  evidence:
  - reference: PMID:16983459
    reference_title: "An estimate of the worldwide prevalence and disability associated with osteoporotic fractures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the year 2000 there were an estimated 9.0 million osteoporotic
      fractures of which 1.6 million were at the hip, 1.7 million at the forearm
      and 1.4 million were clinical vertebral fractures.
    explanation: Quantifies proximal femur (hip) fracture as one of the three
      dominant osteoporotic fracture sites worldwide.
- name: Kyphosis
  category: Musculoskeletal
  frequency: FREQUENT
  notes: From vertebral compression fractures
  phenotype_term:
    preferred_term: Kyphosis
    term:
      id: HP:0002808
      label: Kyphosis
  evidence:
  - reference: PMID:9180660
    reference_title: "Correlates of kyphosis in older women. The Fracture Intervention Trial Research Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a 15 degrees increase in kyphosis was associated with losing more
      than 4 cm of height (OR, 1.88; 95% CI, 1.79-2.03) and having a vertebral
      fracture (OR, 1.57; 95% CI, 1.46-1.69)
    explanation: In 6439 osteoporotic women, kyphosis tracks with vertebral
      fracture and height loss, supporting it as a downstream consequence of
      vertebral compression rather than an independent finding.
- name: Height Loss
  category: Musculoskeletal
  frequency: FREQUENT
  notes: >-
    Progressive loss of adult stature from vertebral compression, not congenital
    short stature. HPO has no term for acquired height loss, so this is bound to
    the accurate parent HP:0000002 rather than to HP:0004322 (Short stature),
    which asserts height below -2 SD for age and sex and is a different claim.
  phenotype_term:
    preferred_term: Height loss
    term:
      id: HP:0000002
      label: Abnormality of body height
  evidence:
  - reference: PMID:14742889
    reference_title: "Height loss and osteoporosis of the hip."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: women with at least 3 in. of height loss had odds of osteoporosis of
      the hip that were 9.6 times greater (95% confidence interval, 4.8-19.2) than
      women with less than an inch of height loss
    explanation: Measured height loss against self-reported maximum adult height
      is strongly associated with densitometric osteoporosis in 2108 women.
biochemical:
- name: Bone Turnover Markers
  presence: Variable
  context: CTX, P1NP indicate resorption/formation rates
  evidence:
  - reference: PMID:21184054
    reference_title: "Markers of bone turnover for the prediction of fracture risk and monitoring of osteoporosis treatment: a need for international reference standards."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: IOF/IFCC recommend one bone formation marker (s-PINP) and one bone
      resorption marker (s-CTX) to be used as reference markers
    explanation: Joint IOF/IFCC position designating s-PINP and s-CTX as the
      reference formation and resorption markers, which is why this entry names
      that pair.
- name: Calcium
  presence: Normal
  context: >-
    Usually normal in primary osteoporosis; measured chiefly to exclude a
    secondary cause such as primary hyperparathyroidism.
  evidence:
  - reference: PMID:12364413
    reference_title: "Yield of laboratory testing to identify secondary contributors to osteoporosis in otherwise healthy women."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: A testing strategy involving measurement of 24-h urine calcium, serum
      calcium, and serum PTH for all women and serum TSH among women on thyroid
      replacement therapy would have been sufficient to diagnose 47 of these 55
      women (85%)
    explanation: Supports the screening role of serum calcium by inference - it is
      informative because an abnormal value reclassifies the case as secondary,
      which presupposes that it is normal in primary osteoporosis.
- name: Vitamin D
  presence: Variable
  context: Deficiency common and contributes to bone loss
  evidence:
  - reference: PMID:15928802
    reference_title: "Vitamin D, parathyroid hormone levels and bone mineral density in community-dwelling older women: the Rancho Bernardo Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: hip BMD was negatively and independently associated with PTH levels
      (p=0.04), and positively and independently associated with 25(OH)D levels
      (p=0.03)
    explanation: In 615 community-dwelling postmenopausal women, 25(OH)D tracks
      positively with hip BMD independently of PTH.
- name: PTH
  presence: Variable
  context: May be elevated with vitamin D deficiency
  evidence:
  - reference: PMID:15928802
    reference_title: "Vitamin D, parathyroid hormone levels and bone mineral density in community-dwelling older women: the Rancho Bernardo Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Low levels of serum calcium stimulate the secretion of parathyroid
      hormone (PTH), which maintains serum calcium levels at the expense of
      increased bone turnover, bone loss and increased risk of fractures
    explanation: States the secondary-hyperparathyroidism route by which a raised
      PTH translates into increased bone turnover and bone loss.
genetic:
- name: LRP5
  gene_term:
    preferred_term: LRP5
    term:
      id: hgnc:6697
      label: LRP5
  association: Risk Factor
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Wnt co-receptor. One of only six BMD loci in the GEFOS meta-analysis whose
    association with fracture itself reached genome-wide significance, so the
    effect is not purely a BMD surrogate.
  evidence:
  - reference: PMID:22504420
    reference_title: "Genome-wide meta-analysis identifies 56 bone mineral density loci and reveals 14 loci associated with risk of fracture."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: including at 18p11.21 (FAM210A), 7q21.3 (SLC25A13), 11q13.2 (LRP5),
      4q22.1 (MEPE), 2p16.2 (SPTBN1) and 10q21.1 (DKK1)
    explanation: LRP5 is among the six loci associated with low-trauma fracture at
      genome-wide significance in 31,016 cases and 102,444 controls.
- name: SOST
  gene_term:
    preferred_term: SOST
    term:
      id: hgnc:13771
      label: SOST
  association: Risk Factor
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Encodes sclerostin, the osteocyte-derived Wnt inhibitor that romosozumab
    blocks; the common-variant association and the drug target are the same
    node of the pathway.
  evidence:
  - reference: PMID:22504420
    reference_title: "Genome-wide meta-analysis identifies 56 bone mineral density loci and reveals 14 loci associated with risk of fracture."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In trans-iliac bone biopsies, expression of five genes correlated
      with LS-BMD and/or FN-BMD of the donors with P < 0.001 including PSME4
      (2p16.2), DKK1 (10q21.1), C17orf91 (17p13.3), SOST (17q21.31_1) and DUSP3
      (17q21.31_1)"
    explanation: SOST expression in human bone biopsies correlates with the donor's
      bone mineral density, linking the GWAS locus to bone tissue rather than to a
      neighbouring gene.
- name: ESR1
  gene_term:
    preferred_term: ESR1
    term:
      id: hgnc:3467
      label: ESR1
  association: Risk Factor
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Estrogen receptor alpha. Carries two independent BMD association signals at
    6q25.1, the common-variant counterpart of the estrogen-deficiency mechanism.
  evidence:
  - reference: PMID:22504420
    reference_title: "Genome-wide meta-analysis identifies 56 bone mineral density loci and reveals 14 loci associated with risk of fracture."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Three loci included variants localized less than 40 Kb from the
      initial main signal suggesting allelic heterogeneity and included the 1p31.3
      (represented by rs17482952 near WLS), 6q25.1 (rs7751941 near ESR1) and the
      16q12.1 (rs1564981 near CYLD) loci.
    explanation: Conditional analysis resolves a second independent BMD signal at
      the ESR1 locus, establishing the association rather than a single tag SNP.
- name: VDR
  gene_term:
    preferred_term: VDR
    term:
      id: hgnc:12679
      label: VDR
  association: Disputed
  relationship_type: DISPUTED
  notes: >-
    Vitamin D receptor. Retained as a historically prominent candidate gene, not
    as an established risk locus: the classic restriction-fragment polymorphisms
    failed in a 26,242-participant meta-analysis, and VDR is not among the 56
    genome-wide significant BMD loci. Only the Cdx2 promoter variant retains a
    marginal vertebral-fracture signal.
  evidence:
  - reference: PMID:16908916
    reference_title: "The association between common vitamin D receptor gene variations and osteoporosis: a participant-level meta-analysis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: The FokI, BsmI, ApaI, and TaqI VDR polymorphisms are not associated
      with BMD or with fractures, but the Cdx2 polymorphism may be associated with
      risk for vertebral fractures.
    explanation: Participant-level meta-analysis across 9 European cohorts finds no
      association between the commonly cited VDR polymorphisms and either BMD or
      fracture, contradicting the risk-factor claim.
environmental:
- name: Estrogen Deficiency
  exposure_term:
    preferred_term: low endogenous estrogen exposure
    modifier: DECREASED
    term:
      id: ECTO:9000010
      label: exposure to estrogens
  influences_mechanisms:
  - target: RANKL/OPG Dysregulation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Estrogen restrains osteoclastogenesis largely by holding down RANKL
      relative to osteoprotegerin, so its withdrawal releases that brake
      directly. This is why bone loss accelerates sharply at menopause rather
      than gradually with age.
    evidence:
    - reference: PMID:12697741
      reference_title: "Role of RANK ligand in mediating increased bone resorption in early postmenopausal women."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The data suggest that upregulation of RANKL on bone marrow cells is an important determinant of increased bone resorption induced by estrogen deficiency."
      explanation: >-
        Measures RANKL directly on bone marrow cells in early postmenopausal
        women, finding it two- to threefold higher than in premenopausal or
        estrogen-treated women and inversely correlated with serum estradiol.
        That reaches the specific ratio this node is named for, which the
        previous citation did not.
  notes: Menopause is major risk factor
  evidence:
  - reference: PMID:21874760
    reference_title: "Aromatase activity and bone loss."
    supports: SUPPORT
    snippet: extraglandular aromatization of circulating androgen precursors is the
      major source of estrogen not only in men (since only 15% of circulating estradiol
      is released directly by the testis) but also in women after the menopause.
    explanation: Post-menopausal women rely on aromatase activity for estrogen production,
      making aromatase activity critical for bone health after menopause
  - reference: PMID:18567553
    reference_title: "Estrogen and bone: insights from estrogen-resistant, aromatase-deficient, and normal men."
    supports: SUPPORT
    snippet: studies in these unusual patients have stimulated research on defining
      the role of estrogen in regulating bone metabolism in normal adult and aging
      men, providing further insights into estrogen regulation of bone metabolism
      not only in men, but also in women.
    explanation: Demonstrates that estrogen is essential for bone metabolism in both
      sexes, with deficiency leading to osteoporosis
- name: Calcium Deficiency
  notes: Inadequate dietary intake
  evidence:
  - reference: PMID:35247225
    reference_title: "Calcium deficiency worldwide: prevalence of inadequate intakes and associated health outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When calcium intake is low or when calcium is poorly absorbed, bone resorption occurs since the stored calcium in bone is used to maintain normal biological functions."
    explanation: States the mechanism by which low or poorly absorbed dietary calcium drives bone resorption, the basis for calcium deficiency as an osteoporosis risk factor.
- name: Vitamin D Deficiency
  exposure_term:
    preferred_term: low vitamin D exposure
    modifier: DECREASED
    term:
      id: ECTO:9000133
      label: exposure to vitamin D
  notes: Impairs calcium absorption
  evidence:
  - reference: PMID:21872800
    reference_title: "The effect of vitamin D on bone and osteoporosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The consequences of vitamin D deficiency are secondary hyperparathyroidism and bone loss, leading to osteoporosis and fractures"
    explanation: Directly states that vitamin D deficiency causes secondary hyperparathyroidism and bone loss leading to osteoporosis.
- name: Sedentary Lifestyle
  exposure_term:
    preferred_term: sedentary lifestyle
    term:
      id: ECTO:6000004
      label: exposure to sedentary lifestyle
  evidence:
  - reference: PMID:30998435
    reference_title: "Substitution of sedentary time with light physical activity is related to increased bone density in U.S. women over 50 years old. An iso-temporal substitution analysis based on the National health and Nutrition Examination Survey."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Substitution of 30 min of sedentary time with an equal amount of light physical activity was associated with increased bone mineral density of about 3 mg/cm2 and a 12% reduced risk of osteoporosis in the spine."
    explanation: Quantifies the bone-density benefit of replacing sedentary time with activity, the inverse relationship supporting sedentary lifestyle as an osteoporosis risk factor.
  notes: Lack of weight-bearing exercise
- name: Smoking
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  influences_mechanisms:
  - target: Bone Remodeling Imbalance
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Tobacco shifts bone turnover toward loss on top of whatever else is
      driving remodelling, lowering attained bone mass. The responsible
      constituents and steps are not established in the cited source.
    evidence:
    - reference: PMID:30631414
      reference_title: "The Effect of Tobacco Smoking on Bone Mass: An Overview of Pathophysiologic Mechanisms."
      supports: SUPPORT
      snippet: "tobacco smoking causes an imbalance in bone turnover, leading to lower bone mass and making bone vulnerable to osteoporosis and fracture"
      explanation: >-
        States that tobacco smoking causes an imbalance in bone turnover
        leading to lower bone mass, the remodelling imbalance this node
        represents.
  notes: Accelerates bone loss
  evidence:
  - reference: PMID:30631414
    reference_title: "The Effect of Tobacco Smoking on Bone Mass: An Overview of Pathophysiologic Mechanisms."
    supports: SUPPORT
    snippet: tobacco smoking causes an imbalance in bone turnover, leading to lower
      bone mass and making bone vulnerable to osteoporosis and fracture
    explanation: Review confirms that smoking causes bone turnover imbalance that
      increases osteoporosis and fracture risk.
- name: Glucocorticoid Use
  exposure_term:
    preferred_term: exposure to glucocorticoid
    term:
      id: ECTO:0000259
      label: exposure to glucocorticoid
  influences_mechanisms:
  - target: Bone Remodeling Imbalance
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Therapeutic glucocorticoids suppress osteoblast function and lifespan
      while prolonging osteoclast survival, tipping remodelling toward
      resorption. It is the commonest secondary cause of the disease.
    evidence:
    - reference: PMID:29691807
      reference_title: "Glucocorticoid-induced osteoporosis: an update."
      supports: SUPPORT
      snippet: "Glucocorticoid-induced osteoporosis is the most common secondary cause of osteoporosis and the resulting fractures cause significant morbidity."
      explanation: >-
        Identifies glucocorticoid-induced osteoporosis as the most common
        secondary cause of the disease, an iatrogenic exposure rather than a
        background risk factor.
  notes: Major cause of secondary osteoporosis
  evidence:
  - reference: PMID:29691807
    reference_title: "Glucocorticoid-induced osteoporosis: an update."
    supports: SUPPORT
    snippet: Glucocorticoid-induced osteoporosis is the most common secondary cause
      of osteoporosis and the resulting fractures cause significant morbidity.
    explanation: Review confirms glucocorticoid use is the leading cause of secondary
      osteoporosis.
- name: Microgravity Exposure
  influences_mechanisms:
  - target: Microgravity-Accelerated Bone Resorption
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Unloading removes the mechanical signal that normally restrains
      resorption, and this entry carries a node specifically for it. Notably
      the loss is not fully reversible on return to gravity.
    evidence:
    - reference: PMID:35773442
      reference_title: "Incomplete recovery of bone strength and trabecular microarchitecture at the distal tibia 1 year after return from long duration spaceflight."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "nine of 17 astronauts did not fully recover tibia total BMD after 12-months"
      explanation: >-
        Reports that nine of seventeen astronauts had not fully recovered
        tibial bone mineral density twelve months after flight, the incomplete
        recovery this node's downstream consequences reflect.
  notes: >
    Spaceflight-induced mechanical unloading causes 1-1.5% bone loss per month in
    weight-bearing sites. Recovery is slow and often incomplete, with some astronauts
    showing deficits equivalent to a decade of terrestrial aging after one year.
  evidence:
  - reference: PMID:32411816
    reference_title: "A systematic review and meta-analysis of bone loss in space travelers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Bone loss in space travelers is a major challenge for long-duration space
      exploration.
    explanation: Systematic review and meta-analysis of bone loss in 148 space travelers
      documents site-dependent bone loss with lower limbs losing -0.8% per month
  - reference: PMID:35773442
    reference_title: "Incomplete recovery of bone strength and trabecular microarchitecture at the distal tibia 1 year after return from long duration spaceflight."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: nine of 17 astronauts did not fully recover tibia total BMD after 12-months
    explanation: HR-pQCT study showing incomplete bone recovery one year after spaceflight,
      commensurate with a decade of terrestrial age-related bone loss
  - reference: PMID:33597120
    reference_title: "Pre-flight exercise and bone metabolism predict unloading-induced bone loss due to spaceflight."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Increases in training volume predicted preservation of tibia bone strength
      and trabecular vBMD and thickness
    explanation: Pre-flight exercise and in-flight resistance training predict and
      partially mitigate spaceflight bone loss in astronauts
  - reference: PMID:32900939
    reference_title: "Targeting myostatin/activin A protects against skeletal muscle and bone loss during spaceflight."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Wild type mice lost significant muscle and bone mass during the 33 d
      spent in microgravity
    explanation: ISS Rodent Research-19 confirmed that microgravity causes significant
      bone and muscle loss in wild-type mice
treatments:
- name: Bisphosphonates
  description: First-line antiresorptives (alendronate, risedronate, zoledronic acid).
  treatment_term:
    preferred_term: bisphosphonate agent therapy
    term:
      id: NCIT:C198585
      label: Bisphosphonate Therapy
  evidence:
  - reference: PMID:34807231
    reference_title: "Time to Benefit of Bisphosphonate Therapy for the Prevention of Fractures Among Postmenopausal Women With Osteoporosis: A Meta-analysis of Randomized Clinical Trials."
    supports: SUPPORT
    snippet: The pooled meta-analysis found that 12.4 months (95% CI, 6.3-18.4 months)
      were needed to avoid 1 nonvertebral fracture per 100 postmenopausal women receiving
      bisphosphonate therapy.
    explanation: Meta-analysis of 10 RCTs with 23,384 women demonstrates bisphosphonate
      efficacy in preventing fractures.
  - reference: PMID:31400472
    reference_title: "Resistive exercise in astronauts on prolonged spaceflights provides partial protection against spaceflight-induced bone loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: combined Bis+ARED prevented declines in all DXA and QCT hip densitometry
      and in estimates of FE hip strengths
    explanation: Bisphosphonate alendronate combined with ARED resistive exercise
      prevented bone loss during ISS missions, while exercise alone only partially
      attenuated loss and did not suppress bone resorption
  - reference: PMID:37723136
    reference_title: "Bisphosphonate conjugation enhances the bone-specificity of NELL-1-based systemic therapy for spaceflight-induced bone loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: BP-NELL-PEG significantly increased bone formation in flight and ground
      control mice without obvious adverse health effects
    explanation: Bisphosphonate-conjugated NELL-1 therapy showed bone-specific efficacy
      during 9-week ISS Rodent Research-5 mission
  - reference: PMID:36592456
    reference_title: "Pharmacologic Treatment of Primary Osteoporosis or Low Bone Mass to Prevent Fractures in Adults: A Living Clinical Guideline From the American College of Physicians."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ACP suggests that clinicians use bisphosphonates for initial pharmacologic treatment to reduce the risk of fractures in males diagnosed with primary osteoporosis (conditional recommendation; low-certainty evidence)."
    explanation: The ACP living clinical guideline recommends bisphosphonates as initial pharmacologic treatment to reduce fracture risk in primary osteoporosis.
- name: Denosumab
  description: RANKL inhibitor, potent antiresorptive.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: denosumab
      term:
        id: NCIT:C61313
        label: Denosumab
  target_mechanisms:
  - target: RANKL/OPG Dysregulation
    treatment_effect: INHIBITS
    description: >-
      Denosumab is a human monoclonal antibody against RANKL that blocks RANKL-RANK
      binding, acting on the same node the entry models as the driver of excess
      osteoclastogenesis.
    evidence:
    - reference: PMID:19671655
      reference_title: "Denosumab for prevention of fractures in postmenopausal women with osteoporosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Denosumab is a fully human monoclonal antibody to the receptor
        activator of nuclear factor-kappaB ligand (RANKL) that blocks its binding
        to RANK, inhibiting the development and activity of osteoclasts, decreasing
        bone resorption, and increasing bone density.
      explanation: States the molecular target and the resulting suppression of
        osteoclast development, which is the mechanism node this link points at.
  evidence:
  - reference: PMID:19671655
    reference_title: "Denosumab for prevention of fractures in postmenopausal women with osteoporosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: denosumab reduced the risk of new radiographic vertebral fracture,
      with a cumulative incidence of 2.3% in the denosumab group, versus 7.2% in
      the placebo group (risk ratio, 0.32; 95% confidence interval [CI], 0.26 to
      0.41; P<0.001)
    explanation: FREEDOM, a 7868-woman placebo-controlled trial, is the pivotal
      fracture-endpoint evidence for denosumab.
- name: Teriparatide
  description: PTH analog, anabolic agent for severe osteoporosis.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: teriparatide
      term:
        id: NCIT:C61966
        label: Teriparatide
  notes: >-
    Anabolic rather than antiresorptive: intermittent daily dosing raises bone
    formation, which is the opposite of the sustained PTH elevation that drives
    bone loss in secondary hyperparathyroidism.
  evidence:
  - reference: PMID:11346808
    reference_title: "Effect of parathyroid hormone (1-34) on fractures and bone mineral density in postmenopausal women with osteoporosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: New vertebral fractures occurred in 14 percent of the women in the
      placebo group and in 5 percent and 4 percent, respectively, of the women in
      the 20-microg and 40-microg parathyroid hormone groups
    explanation: The Fracture Prevention Trial in 1637 postmenopausal women with
      prior vertebral fractures is the pivotal evidence for teriparatide.
- name: Romosozumab
  description: Sclerostin inhibitor with dual anabolic/antiresorptive effect.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: romosozumab
      term:
        id: NCIT:C152246
        label: Romosozumab
  notes: >-
    Targets the product of SOST, which also carries a common-variant BMD
    association in this entry's genetic section. Carries an imbalance in
    adjudicated serious cardiovascular events against alendronate in ARCH, which
    is why it is positioned for high fracture risk rather than first line.
  evidence:
  - reference: PMID:27641143
    reference_title: "Romosozumab Treatment in Postmenopausal Women with Osteoporosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At 12 months, new vertebral fractures had occurred in 16 of 3321
      patients (0.5%) in the romosozumab group, as compared with 59 of 3322 (1.8%)
      in the placebo group (representing a 73% lower risk with romosozumab;
      P<0.001).
    explanation: FRAME, a 7180-woman placebo-controlled trial, establishes vertebral
      fracture reduction.
  - reference: PMID:28892457
    reference_title: "Romosozumab or Alendronate for Fracture Prevention in Women with Osteoporosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Over a period of 24 months, a 48% lower risk of new vertebral
      fractures was observed in the romosozumab-to-alendronate group
    explanation: ARCH shows superiority over active bisphosphonate comparison, not
      only over placebo.
  - reference: PMID:28892457
    reference_title: "Romosozumab or Alendronate for Fracture Prevention in Women with Osteoporosis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: During year 1, positively adjudicated serious cardiovascular adverse
      events were observed more often with romosozumab than with alendronate (50 of
      2040 patients [2.5%] vs. 38 of 2014 patients [1.9%])
    explanation: Contradicts an unqualified reading of romosozumab as a preferred
      agent; the cardiovascular imbalance in the same trial constrains where it is
      used.
- name: Calcium Supplementation
  description: Ensure adequate intake (1000-1200 mg/day).
  treatment_term:
    preferred_term: calcium supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
  evidence:
  - reference: PMID:17720017
    reference_title: "Use of calcium or calcium in combination with vitamin D supplementation to prevent fractures and bone loss in people aged 50 years and older: a meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In trials that reported fracture as an outcome (17 trials, n=52 625),
      treatment was associated with a 12% risk reduction in fractures of all types
      (risk ratio 0.88, 95% CI 0.83-0.95; p=0.0004)."
    explanation: Meta-analysis of 29 randomised trials (n=63,897) supporting calcium,
      alone or with vitamin D, as fracture-preventive.
  - reference: PMID:17720017
    reference_title: "Use of calcium or calcium in combination with vitamin D supplementation to prevent fractures and bone loss in people aged 50 years and older: a meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The treatment effect was better with calcium doses of 1200 mg or more
      than with doses less than 1200 mg (0.80 vs 0.94; p=0.006)
    explanation: Sources the dose in this treatment's description; the benefit is
      dose-dependent, with 1200 mg the threshold the authors recommend.
- name: Vitamin D Supplementation
  description: Maintain 25(OH)D >30 ng/mL.
  treatment_term:
    preferred_term: vitamin D supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
  evidence:
  - reference: PMID:17720017
    reference_title: "Use of calcium or calcium in combination with vitamin D supplementation to prevent fractures and bone loss in people aged 50 years and older: a meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: with vitamin D doses of 800 IU or more than with doses less than 800
      IU (0.84 vs 0.87; p=0.03)
    explanation: Fracture-risk reduction is greater at vitamin D doses of at least
      800 IU, the dose the meta-analysis recommends alongside calcium.
- name: Weight-Bearing Exercise
  description: Helps maintain bone density.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  notes: >-
    The Cochrane review supports a small BMD effect but found no reduction in
    fracture numbers, and the largest femoral-neck effect came from
    non-weight-bearing progressive resistance training rather than from
    weight-bearing exercise, so the name of this treatment is narrower than the
    evidence behind it.
  evidence:
  - reference: PMID:21735380
    reference_title: "Exercise for preventing and treating osteoporosis in postmenopausal women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our results suggest a relatively small statistically significant, but
      possibly important, effect of exercise on bone density compared with control
      groups.
    explanation: Cochrane review of 43 RCTs (4320 participants) supports the bone
      density claim this treatment makes, and calibrates its size as small.
  - reference: PMID:21735380
    reference_title: "Exercise for preventing and treating osteoporosis in postmenopausal women."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: The most effective type of exercise intervention on bone mineral
      density (BMD) for the neck of femur appears to be non-weight bearing high
      force exercise such as progressive resistance strength training for the lower
      limbs
    explanation: Contradicts the weight-bearing framing specifically - at the
      femoral neck the largest effect came from non-weight-bearing high-force
      training.
animal_models:
- name: Ovariectomized rat
  species: Rat
  genotype: Wild type, surgically ovariectomized
  category: SURGICAL
  description: >-
    Bilateral ovariectomy in the rat produces acute estrogen withdrawal, a surge
    in cancellous bone turnover, and net trabecular bone loss at the proximal
    tibia, distal femur and lumbar vertebrae. The 1994 FDA preclinical guidance
    names it as the rodent species for evaluating agents intended to treat or
    prevent postmenopausal osteoporosis, which makes it the regulatory reference
    model rather than merely a common one.
  publication: PMID:8579908
  modeled_mechanisms:
  - target: RANKL/OPG Dysregulation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the estrogen-deficiency route into accelerated remodeling, and
      the effect is estrogen-reversible, which establishes the mechanism rather
      than merely the phenotype.
    limitations: >-
      Captures the estrogen-withdrawal arm only. It says nothing about the
      senescence and marrow-lineage arms of this entry, which are age-driven and
      present in both sexes.
    readouts:
    - name: Cancellous bone turnover after ovariectomy
      target: RANKL/OPG Dysregulation
      direction: INCREASED
      interpretation: Activation of remodeling is the proximate consequence of
        estrogen withdrawal in this model.
      evidence:
      - reference: PMID:8579908
        reference_title: "FDA Guidelines and animal models for osteoporosis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: These data illustrate that cancellous bone turnover increases
          following OVX and this increased bone turnover produces bone loss.
        explanation: Reports the turnover measurement and links it causally to the
          bone loss.
    evidence:
    - reference: PMID:8579908
      reference_title: "FDA Guidelines and animal models for osteoporosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Estrogen completely blocks the activation of bone turnover and
        bone loss.
      explanation: The rescue arm shows the model's bone loss runs through
        estrogen deficiency, which is what makes it informative for this node.
  - target: Microarchitectural Deterioration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Trabecular bone volume falls and stays low, so the structural endpoint is
      reproduced, but the driving turnover signal is not sustained.
    limitations: >-
      Over a 12-month study the cancellous turnover indices return to sham
      control values while trabecular bone volume remains low, so the model
      decouples the mechanism from the deficit at exactly the durations the
      guidance recommends. It also lacks intracortical Haversian remodeling
      entirely, so cortical porosity cannot be studied in it.
    readouts:
    - name: Cancellous bone turnover at 12 months
      target: Microarchitectural Deterioration
      direction: UNCHANGED
      interpretation: A genuine negative result - turnover normalizes even though
        the structural deficit persists.
      evidence:
      - reference: PMID:8579908
        reference_title: "FDA Guidelines and animal models for osteoporosis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: the indices of cancellous bone turnover return to the value of
          sham controls, although the trabecular bone volume remains lower than
          that of sham controls in OVX rats
        explanation: Documents the decoupling that limits long-duration studies in
          this model.
    evidence:
    - reference: PMID:8579908
      reference_title: "FDA Guidelines and animal models for osteoporosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: it is difficult to determine the effects of potential therapeutic
        agents on the bone turnover in estrogen deficient conditions
      explanation: The authors' own statement of the limitation, which is why this
        link is PARTIALLY_RECAPITULATES rather than RECAPITULATES.
- name: Aged INK-ATTAC senescent-cell clearance mouse
  species: Mouse
  genotype: INK-ATTAC transgenic (inducible caspase 8 under the p16INK4a promoter)
  category: TRANSGENIC
  description: >-
    A suicide transgene that lets p16INK4a-expressing senescent cells be killed
    on demand with AP20187. Applied to 20-22-month-old mice with bone loss
    already established, it is an interventional test of whether senescent cells
    cause age-related bone loss rather than merely accompany it.
  publication: PMID:28825716
  modeled_mechanisms:
  - target: Senescent Cell Accumulation in the Bone Microenvironment
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Clearing roughly 30% of senescent cells in old mice raises bone mass,
      microarchitecture and strength; the same treatment in 12-month-old mice
      changes nothing, which is the specificity control.
    limitations: >-
      Murine, and the transgene is not a therapy. The mouse skeleton lacks
      osteonal cortical remodeling, so the cortical arm of the result does not
      transfer directly. The human phase 2 senolytic trial did not reproduce the
      resorption effect at its primary endpoint - see the discussions section.
    readouts:
    - name: Spine trabecular bone volume fraction after senescent-cell clearance
      target: Senescent Cell Accumulation in the Bone Microenvironment
      direction: RESTORED
      interpretation: Structural correlate of removing the senescent-cell burden
        in an already-osteopenic skeleton.
      evidence:
      - reference: PMID:28825716
        reference_title: "Targeting cellular senescence prevents age-related bone loss in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "AP20187-treated mice had better spine trabecular bone
          microarchitecture (e.g., 52% higher BV/TV"
        explanation: The primary structural measurement behind the rescue claim.
    - name: Senescent osteocyte burden
      target: Senescent Cell Accumulation in the Bone Microenvironment
      direction: DECREASED
      interpretation: Target engagement - confirms the transgene did what it was
        meant to before the bone effect is attributed to it.
      evidence:
      - reference: PMID:28825716
        reference_title: "Targeting cellular senescence prevents age-related bone loss in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: This was confirmed by fewer senescent osteocytes in AP20187-
          versus vehicle-treated mice
        explanation: Independent confirmation of clearance by SADS, alongside
          p16INK4a and EGFP mRNA.
    evidence:
    - reference: PMID:28825716
      reference_title: "Targeting cellular senescence prevents age-related bone loss in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: treatment of young adult (12-month-old) INK-ATTAC mice with
        AP20187 did not alter bone parameters
      explanation: The age-specificity control is what makes this model
        informative for an aging node rather than for bone mass generally.
- name: Aged mouse skeleton as a model of human age-related bone loss
  species: Mouse
  genotype: Wild type, aged
  category: NATURAL
  description: >-
    The background model underneath most murine bone aging work. Recorded
    explicitly because its divergences from the human skeleton are the reason
    several results in this entry are held at moderate rather than high fidelity.
  publication: PMID:23689830
  modeled_mechanisms:
  - target: Microarchitectural Deterioration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Aged mice lose cancellous bone, thin their cortices and gain cortical
      porosity as humans do, and the histologic cause is shared - resorption
      cavities that osteoblasts fail to refill.
    limitations: >-
      The murine skeleton keeps growing slowly after puberty and has no osteonal
      remodeling of cortical bone, so the human intracortical remodeling
      compartment has no counterpart in it. Cortical findings therefore arise
      through a different structural process than the one they are taken to
      model.
    evidence:
    - reference: PMID:23689830
      reference_title: "The relevance of mouse models for investigating age-related bone loss in humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: like humans, mice exhibit loss of cancellous bone, thinning of
        cortical bone, and increased cortical porosity with advancing age
      explanation: States the shared phenotype that makes the aged mouse
        informative for this node.
    - reference: PMID:23689830
      reference_title: "The relevance of mouse models for investigating age-related bone loss in humans."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: Unlike the human skeleton, however, the murine skeleton continues
        to grow slowly after puberty and lacks osteonal remodeling of cortical
        bone.
      explanation: Contradicts treating murine cortical bone loss as a direct
        model of human intracortical remodeling, and is the basis of the
        HUMAN_MODEL_MISMATCH discussion.
experimental_models:
- name: MLO-Y4 osteocyte-like cell line
  experimental_model_type: CELL_LINE
  namo_type: namo:CellLineModel
  description: >-
    Murine long bone osteocyte line immortalized under an osteocalcin promoter.
    It made the osteocyte experimentally accessible, which matters here because
    the osteocyte is the cell this entry's senescence and mechanosensing nodes
    both run through.
  organism:
    preferred_term: mouse

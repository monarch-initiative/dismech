diagnosis:
- name: Clinical Diagnosis of Crusted Vesiculobullous Lesions
  description: >-
    Impetigo is usually diagnosed clinically from erythematous papules evolving
    over days into ruptured vesicles or bullae with honey-colored crusts; swab
    culture is reserved for recurrent, extensive, outbreak-associated, or
    methicillin-resistant S. aureus-suspected disease.
  evidence:
  - reference: PMID:41839109
    reference_title: "Impetigo: Rapid Evidence Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnosis of impetigo is based primarily on clinical examination and
      should be suspected in individuals with erythematous papules that progress
      to ruptured vesicles or bullae over 4 to 6 days, forming honey-colored
      crusts.
    explanation: >-
      Supports recognition of impetigo by clinical examination of the evolving
      vesiculobullous crusted eruption.
treatments:
- name: Topical Antibiotic Therapy for Limited Impetigo
  description: >-
    Limited impetigo is treated with topical antibiotics such as mupirocin,
    retapamulin, ozenoxacin, or fusidic acid, which kill S. aureus and
    S. pyogenes locally and shorten the contagious superficial infection.
    Resistance limits these agents: the fusidic acid-resistant epidemic
    European impetigo clone (EEFIC) of S. aureus has persisted in Belgium, and
    a variant of it carrying mupirocin resistance has spread among children
    there.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: mupirocin
      term:
        id: CHEBI:7025
        label: mupirocin
    - preferred_term: retapamulin
      term:
        id: CHEBI:166679
        label: Retapamulin
    - preferred_term: ozenoxacin
      term:
        id: CHEBI:136050
        label: ozenoxacin
    - preferred_term: fusidic acid
      term:
        id: CHEBI:29013
        label: fusidic acid
  target_mechanisms:
  - target: Nonbullous Pyogenic Epidermal Infection
    treatment_effect: INHIBITS
    description: >-
      Topical antibiotics suppress superficial bacterial proliferation.
  - target: Exfoliative Toxin Production by S. aureus
    treatment_effect: INHIBITS
    description: >-
      Topical antibiotics suppress toxigenic S. aureus in localized bullous
      impetigo before additional toxin can be produced.
  evidence:
  - reference: PMID:41839109
    reference_title: "Impetigo: Rapid Evidence Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Topical mupirocin 2% ointment or retapamulin 1% ointment are the
      recommended initial treatments for mild, nonbullous and bullous impetigo.
    explanation: >-
      This supports topical antibiotic therapy as initial treatment for mild
      impetigo of either clinical form.
  - reference: PMID:15106198
    reference_title: Interventions for impetigo.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Topical antibiotics showed better cure rates than placebo (pooled odds
      ratio (OR) 6.49, 95% confidence interval (CI) 3.93 to 10.73)
    explanation: >-
      Cochrane randomized-trial synthesis supports the efficacy of topical
      antibiotics for impetigo.
  - reference: PMID:15106198
    reference_title: Interventions for impetigo.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is good evidence that topical mupirocin and topical fusidic acid are
      equally, or more effective than oral treatment for people with limited
      disease.
    explanation: >-
      Supports topical fusidic acid, alongside mupirocin, for limited impetigo.
  - reference: PMID:29898217
    reference_title: >-
      Efficacy and Safety of Ozenoxacin Cream for Treatment of Adult and
      Pediatric Patients With Impetigo: A Randomized Clinical Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Topical ozenoxacin is effective and well tolerated in the treatment of
      impetigo in patients 2 months and older.
    explanation: >-
      Randomized vehicle-controlled trial supporting topical ozenoxacin for
      impetigo.
  - reference: PMID:37358399
    reference_title: >-
      Persistence of the Staphylococcus aureus epidemic European fusidic
      acid-resistant impetigo clone (EEFIC) in Belgium.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EEFIC isolates were mostly isolated from young patients with impetigo and
      showed a seasonal late summer peak.
    explanation: >-
      National surveillance shows the fusidic acid-resistant EEFIC clone
      persisting among young patients with impetigo, a resistance caveat for
      topical fusidic acid.
  - reference: PMID:38726693
    reference_title: >-
      Emergence and spread of a mupirocin-resistant variant of the European
      epidemic fusidic acid-resistant impetigo clone of Staphylococcus aureus,
      Belgium, 2013 to 2023.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We highlight the spread of a mupirocin-resistant EEFIC in children, with a
      seasonal trend for the third quarter of the year. This is of concern
      because this variant is resistant to the two main topical antibiotics
      used to treat impetigo in Belgium.
    explanation: >-
      Documents a variant of the clone resistant to both mupirocin and fusidic
      acid, the main topical agents for impetigo in Belgium.
- name: Oral Antibiotic Therapy for Extensive or Outbreak Disease
  description: >-
    Oral antibiotics targeting both group A Streptococcus and S. aureus are used
    for severe, multilesional, or outbreak-associated impetigo when topical
    therapy is insufficient to control bacterial proliferation and transmission.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: dicloxacillin
      term:
        id: CHEBI:4511
        label: dicloxacillin
    - preferred_term: cephalexin
      term:
        id: CHEBI:3534
        label: cephalexin
  target_mechanisms:
  - target: Nonbullous Pyogenic Epidermal Infection
    treatment_effect: INHIBITS
    description: Oral antibiotics suppress disseminated superficial infection.
  - target: Exfoliative Toxin Production by S. aureus
    treatment_effect: INHIBITS
    description: Oral antibiotics treat extensive bullous impetigo.
  evidence:
  - reference: PMID:41839109
    reference_title: "Impetigo: Rapid Evidence Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Oral antibiotics, such as dicloxacillin or cephalexin, should be targeted
      to group A streptococci and S. aureus and are recommended for outbreaks to
      decrease infection transmission or for severe, multilesional disease that
      does not respond to topical therapy within 3 to 5 days.
    explanation: >-
      This supports oral therapy for severe, multilesional, outbreak-associated,
      or topical-nonresponsive impetigo.
- name: Ivermectin Mass Drug Administration for Scabies-Associated Community Impetigo
  description: >-
    In communities where scabies is a major upstream breach in the skin barrier,
    ivermectin-based mass drug administration reduces scabies infestation and
    thereby reduces impetigo prevalence at the population level.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ivermectin
      term:
        id: CHEBI:6078
        label: ivermectin
  target_mechanisms:
  - target: Epidermal Barrier Disruption
    treatment_effect: INHIBITS
    description: >-
      Scabies control lowers one infestation-driven source of scratching and
      epidermal barrier breaks.
  evidence:
  - reference: PMID:26650152
    reference_title: Mass Drug Administration for Scabies Control in a Population with Endemic Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of impetigo also declined in all groups, with the greatest
      reduction seen in the ivermectin group.
    explanation: >-
      In a Fiji cluster-randomized trial for scabies control, the ivermectin MDA
      arm produced the largest drop in impetigo prevalence.
environmental:
- name: Scabies infestation
  description: >-
    Scabies is a pruritic dermatosis whose resulting barrier damage precedes
    secondary impetigo, particularly in communities where both are endemic.
  notes: >-
    No ECTO exposure term for scabies or Sarcoptes scabiei: ols:ecto searches
    for "scabies" returned only ECTO:9002125 exposure to scabicide, and for
    "Sarcoptes scabiei" returned nothing.
  evidence:
  - reference: PMID:31630410
    reference_title: "Skin infections in Australian Aboriginal children: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Infection may be direct or secondary to cutaneous barrier damage resulting
      from insect bites, minor trauma, or other pruritic dermatoses, especially
      scabies, head lice and tinea.
    explanation: >-
      Names scabies as a leading pruritic dermatosis behind barrier damage that
      precedes impetigo.
  influences_mechanisms:
  - target: Epidermal Barrier Disruption
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Scabies-associated pruritus and scratching damage the epidermis, opening
      the barrier breaks in which impetigo arises.
    evidence:
    - reference: PMID:31630410
      reference_title: "Skin infections in Australian Aboriginal children: a narrative review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Infection may be direct or secondary to cutaneous barrier damage
        resulting from insect bites, minor trauma, or other pruritic dermatoses,
        especially scabies, head lice and tinea.
      explanation: >-
        Places scabies upstream of the cutaneous barrier damage that permits
        secondary impetigo.
    - reference: PMID:26650152
      reference_title: Mass Drug Administration for Scabies Control in a Population with Endemic Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The prevalence of impetigo also declined in all groups, with the
        greatest reduction seen in the ivermectin group.
      explanation: >-
        Scabies control lowered impetigo prevalence, consistent with scabies
        acting upstream of impetigo.
- name: Crowded living environments
  description: >-
    Crowded housing increases close skin contact and is a recognized risk
    factor for impetigo.
  notes: >-
    No ECTO exposure term for crowding: ols:ecto searches for "crowding" and
    "crowded" returned nothing.
  evidence:
  - reference: PMID:41839109
    reference_title: "Impetigo: Rapid Evidence Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Risk factors for impetigo include disruptions to the skin barrier, poor
      hygiene, crowded living environments, living in hot and humid climates,
      malnutrition, and diabetes.
    explanation: Lists crowded living environments as a risk factor for impetigo.
  influences_mechanisms:
  - target: Superficial Bacterial Colonization
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Crowding raises the chance that S. aureus or S. pyogenes reaches and
      colonizes breached skin.
    evidence:
    - reference: PMID:41839109
      reference_title: "Impetigo: Rapid Evidence Review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Risk factors for impetigo include disruptions to the skin barrier, poor
        hygiene, crowded living environments, living in hot and humid climates,
        malnutrition, and diabetes.
      explanation: Lists crowded living environments as a risk factor for impetigo.

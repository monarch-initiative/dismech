name: Impetigo
creation_date: "2026-09-29T17:30:14Z"
description: >-
  Impetigo is an acute, highly contagious superficial bacterial infection of the
  epidermis caused by Staphylococcus aureus, Streptococcus pyogenes, or both.
  Nonbullous disease produces vesiculopustules that rupture into honey-colored
  crusted erosions, whereas toxigenic S. aureus causes bullous impetigo by
  secreting exfoliative toxins that cleave desmoglein 1 and split the granular
  layer of the epidermis.
category: Infectious Disease
disease_term:
  preferred_term: impetigo
  term:
    id: MONDO:0004592
    label: impetigo
parents:
- Bacterial infection
synonyms:
- Impetigo contagiosa
- School sores
- Crusted impetigo
- Impetigo vulgaris
notes: >-
  Deep research was run with a falcon request that fell back to the
  openscientist provider
  (research/Impetigo-deep-research-openscientist.md). The report resolved all 32
  references and found no off-topic references. Its term-validation pass found
  three genuine wrong identifiers, all ignored here: MONDO:0001366 mislabelled
  as post-streptococcal glomerulonephritis, MONDO:0005295 mislabelled as
  rheumatic fever, and CHEBI:4508 mislabelled as dicloxacillin. GO:0005615 was
  obsolete and was replaced by GO:0005576 where extracellular-region language was
  needed. `just preflight-dr` returned SKIP, as expected for an acquired
  infection with no RO:0004003 causal gene on MONDO:0004592; manual preflight of
  the report's own identifiers confirmed MONDO:0004592, MeSH D007169, ICD-10
  L01, ICD-11 1B72, no OMIM, no dedicated Orphanet entry, and a scope distinct
  from generalized Staphylococcal_Scalded_Skin_Syndrome.
infectious_agent:
- name: Staphylococcus aureus
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  description: >-
    Staphylococcus aureus causes nonbullous impetigo and, when the strain
    expresses exfoliative toxins, bullous impetigo.
  evidence:
  - reference: PMID:41839109
    reference_title: "Impetigo: Rapid Evidence Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Impetigo can be nonbullous (70%) or bullous (30%) and is most commonly
      caused by group A streptococcus and Staphylococcus aureus.
    explanation: >-
      Identifies S. aureus as one of the two principal bacterial causes of
      impetigo.
  - reference: PMID:17582744
    reference_title: >-
      Staphylococcal exfoliative toxins: "molecular scissors" of bacteria that
      attack the cutaneous defense barrier in mammals.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Bullous impetigo and its generalized form, staphylococcal scalded-skin
      syndrome (SSSS), are highly contagious, blistering skin diseases caused by
      Staphylococcus aureus infection.
    explanation: >-
      This review ties toxigenic S. aureus specifically to the bullous impetigo
      branch.
- name: Streptococcus pyogenes

  evidence:
  - reference: PMID:41839109
    reference_title: "Impetigo: Rapid Evidence Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Impetigo can be nonbullous (70%) or bullous (30%) and is most commonly
      caused by group A streptococcus and Staphylococcus aureus.
    explanation: >-
      Identifies group A Streptococcus as one of the two principal bacterial
      causes of impetigo.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:33105179
      reference_title: Impetigo.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Impetigo is a common superficial bacterial infection of the skin, with a
        global disease burden of greater than 140 million.
      explanation: >-
        This frames impetigo as a bacterial skin infection, supporting

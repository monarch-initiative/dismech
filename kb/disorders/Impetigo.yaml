progression:
- phase: Papulovesicular onset
  notes: >-
    Lesions begin as erythematous papules that progress to thin-walled
    vesicles or pustules.
  evidence:
  - reference: PMID:31630410
    reference_title: "Skin infections in Australian Aboriginal children: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Impetigo begins as erythematous papules, progressing to thinly walled
      pustules that rupture and crust over with a progressively thickening scab.
    explanation: >-
      Describes the papular onset and pustular stage of impetigo lesions.
- phase: Rupture and crusting
  duration: 4 to 6 days
  notes: >-
    Vesicles, pustules, or bullae rupture and form honey-colored crusts over
    4 to 6 days.
  evidence:
  - reference: PMID:41839109
    reference_title: "Impetigo: Rapid Evidence Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      erythematous papules that progress to ruptured vesicles or bullae over 4
      to 6 days, forming honey-colored crusts.
    explanation: >-
      Gives the timing of progression from papules to ruptured, crusted lesions.
- phase: Healing
  duration: up to 30 days without treatment
  notes: >-
    The scab shrinks and the eroded base heals, often without scarring;
    untreated resolution can take 30 days.
  evidence:
  - reference: PMID:31630410
    reference_title: "Skin infections in Australian Aboriginal children: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      As healing begins, the scab shrinks, tethering surrounding skin to heal
      the eroded base, often without scarring.
    explanation: >-
      Describes the healing phase of impetigo lesions.
  - reference: PMID:31630410
    reference_title: "Skin infections in Australian Aboriginal children: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Without treatment, resolution can take 30 days"
    explanation: >-
      Gives the duration of untreated resolution.
transmission:
- name: Direct-contact and fomite spread with autoinoculation
  description: >-
    Impetigo spreads efficiently from colonized lesions by skin-to-skin contact,
    contact with contaminated objects, and self-inoculation to additional
    breached epidermal sites.
  evidence:
  - reference: PMID:41839109
    reference_title: "Impetigo: Rapid Evidence Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Reducing the spread and recurrence of impetigo includes good hand hygiene,
      thoroughly washing objects used by people with impetigo, and refraining
      from returning to work or school until 12 to 24 hours after initiating
      antibiotic treatment or clinical improvement occurs.
    explanation: >-
      Hand hygiene, object washing, and temporary school or work exclusion
      support direct-contact and fomite spread among close contacts.
pathophysiology:
- name: Epidermal Barrier Disruption
  role: trigger
  biological_scale: TISSUE
  description: >-
    Breaks in the epidermal barrier from abrasions, insect bites, scabies,
    atopic dermatitis, or other minor skin trauma expose a superficial niche
    for S. aureus and S. pyogenes.
  locations:
  - preferred_term: skin epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  downstream:
  - target: Superficial Bacterial Colonization
    description: >-
      The breached epidermis allows S. aureus, S. pyogenes, or both to
      establish and proliferate locally.
  evidence:
  - reference: PMID:31630410
    reference_title: "Skin infections in Australian Aboriginal children: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Infection may be direct or secondary to cutaneous barrier damage resulting
      from insect bites, minor trauma, or other pruritic dermatoses, especially
      scabies, head lice and tinea.
    explanation: >-
      Names cutaneous barrier damage, including scabies and other pruritic
      dermatoses, as the setting for secondary impetigo.
  - reference: PMID:41839109
    reference_title: "Impetigo: Rapid Evidence Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Risk factors for impetigo include disruptions to the skin barrier, poor
      hygiene, crowded living environments, living in hot and humid climates,
      malnutrition, and diabetes.
    explanation: >-
      Lists disruption of the skin barrier as a risk factor for impetigo.
- name: Superficial Bacterial Colonization
  role: cause
  biological_scale: TISSUE
  description: >-
    S. aureus, S. pyogenes, or both colonize and proliferate in the superficial
    epidermis at the breached site.
  locations:
  - preferred_term: skin epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  downstream:
  - target: Nonbullous Pyogenic Epidermal Infection
    description: >-
      S. pyogenes, S. aureus, or both proliferate locally to produce
      vesiculopustules and crusted erosions.
  - target: Exfoliative Toxin Production by S. aureus
    description: >-
      Toxigenic S. aureus expresses exfoliative toxins at the infected epidermal
      site.
  evidence:
  - reference: PMID:28655473
    reference_title: >-
      Keratinocytes as sensors and central players in the immune defense against
      Staphylococcus aureus in the skin.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Staphylococcus aureus is only rarely found on healthy human skin, but
      frequently colonizes the skin of atopic dermatitis (AD) patients
    explanation: >-
      Supports defective or inflamed epidermal barrier states as permissive for
      S. aureus colonization.
  - reference: PMID:31755570
    reference_title: >-
      Disseminated bullous impetigo and atopic dermatitis: Case series and
      literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Due to compromised barrier function and immune dysregulation, children
      with atopic dermatitis (AD) are at increased risk of cutaneous infections
    explanation: >-
      Links a compromised epidermal barrier in atopic dermatitis to increased
      risk of cutaneous bacterial infection.
  - reference: PMID:31755570
    reference_title: >-
      Disseminated bullous impetigo and atopic dermatitis: Case series and
      literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eleven children (92%) had severe AD."
    explanation: >-
      In a case series of disseminated bullous impetigo, nearly all children had
      severe atopic dermatitis, consistent with barrier-defective skin favoring
      S. aureus infection.
- name: Nonbullous Pyogenic Epidermal Infection
  role: cause
  biological_scale: TISSUE
  description: >-
    S. pyogenes and non-toxigenic or toxigenic S. aureus proliferate in the
    superficial epidermis, recruiting neutrophils and creating vesicles and
    pustules that rupture into the honey-colored crusts of nonbullous impetigo.
  locations:
  - preferred_term: skin epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Vesicles
    description: >-
      Superficial pyogenic infection produces vesicles from the initial
      erythematous papules.
  - target: Pustules
    description: >-
      Neutrophil-rich superficial infection produces thin-walled pustules.
  - target: Honey-colored crusts
    description: >-
      Vesicles and pustules rupture and dry into the characteristic crusted
      superficial erosions.
  - target: Post-Streptococcal Immune Sequelae
    description: >-
      Group A streptococcal skin infection can antecede acute
      post-streptococcal glomerulonephritis and acute rheumatic fever in
      endemic communities.
  evidence:
  - reference: PMID:33105179
    reference_title: Impetigo.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nonbullous impetigo is caused by S. aureus and S. pyogenes whereas
      bullous impetigo is caused by S. aureus.
    explanation: >-
      This distinguishes the streptococcal/staphylococcal microbiology of
      nonbullous disease from the staphylococcal-only bullous branch.
  - reference: PMID:31630410
    reference_title: "Skin infections in Australian Aboriginal children: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Impetigo begins as erythematous papules, progressing to thinly walled
      pustules that rupture and crust over with a progressively thickening scab.
    explanation: >-
      Describes the papule-to-pustule-to-crust evolution of the superficial
      infection.
- name: Exfoliative Toxin Production by S. aureus
  role: cause
  biological_scale: MOLECULAR
  description: >-
    Toxigenic S. aureus strains express ETA or ETB, encoded on a phage genome or
    plasmid respectively, and secrete exfoliative toxin as the pathogen effector
    that initiates bullous impetigo.
  downstream:
  - target: Desmoglein 1 Ectodomain Cleavage
    description: >-
      Secreted exfoliative toxin reaches superficial keratinocyte desmosomes and
      cleaves desmoglein 1.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21282415
    reference_title: Regulatory mechanism for exfoliative toxin production in Staphylococcus aureus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Most S. aureus strains that cause blistering disease produce either ETA or
      ETB. They are serologically distinct molecules, where ETA is encoded on a
      phage genome and ETB is enocded on a large plasmid.
    explanation: >-
      Introduction background in a bacterial-genetics study, identifying ETA and
      ETB as the common exfoliative toxins of blistering S. aureus disease and
      their phage and plasmid genetic contexts.
- name: Desmoglein 1 Ectodomain Cleavage
  role: cause
  biological_scale: MOLECULAR
  description: >-
    Staphylococcal exfoliative toxins are glutamate-specific serine proteases
    that cleave one peptide bond in the extracellular region of desmoglein 1,
    disrupting superficial keratinocyte adhesion at desmosomes.
  genes:
  - preferred_term: DSG1
    term:
      id: hgnc:3048
      label: DSG1
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  molecular_functions:
  - preferred_term: exfoliative toxin serine protease activity
    modifier: INCREASED
    term:
      id: GO:0008233
      label: peptidase activity
  biological_processes:
  - preferred_term: desmoglein 1 proteolysis
    modifier: INCREASED
    term:
      id: GO:0006508
      label: proteolysis
  cellular_components:
  - preferred_term: desmosome
    term:
      id: GO:0030057
      label: desmosome
  downstream:
  - target: Granular-Layer Acantholysis and Bullae
    description: >-
      Loss of the adhesive Dsg1 ectodomain is sufficient to produce the
      superficial intraepidermal blister.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17582744
    reference_title: >-
      Staphylococcal exfoliative toxins: "molecular scissors" of bacteria that
      attack the cutaneous defense barrier in mammals.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the three isoforms of ETs, i.e., ETA, ETB, and ETD, are
      glutamate-specific serine proteases that specifically and efficiently
      cleave a single peptide bond in the extracellular region of human and
      mouse desmoglein 1 (Dsg1), a desmosomal intercellular adhesion molecule
    explanation: >-
      Defines exfoliative toxins as glutamate-specific proteases that cleave a
      single extracellular peptide bond in desmoglein 1.
  - reference: PMID:20728315
    reference_title: >-
      Removal of amino-terminal extracellular domains of desmoglein 1 by
      staphylococcal exfoliative toxin is sufficient to initiate epidermal
      blister formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our findings suggest that the removal of amino-terminal extracellular
      domains of Dsg1 by ETs is sufficient to initiate epidermal blister
      formation in bullous impetigo and SSSS.
    explanation: >-
      Shows in a neonatal mouse model that exfoliative-toxin removal of the Dsg1
      ectodomain is sufficient to initiate bullous impetigo-like blistering.
- name: Granular-Layer Acantholysis and Bullae
  role: outcome
  biological_scale: TISSUE
  description: >-
    Cleavage of desmoglein 1 separates superficial keratinocytes at the granular
    layer, creating a flaccid intraepidermal blister whose roof ruptures into
    moist erosions and crust.
  locations:
  - preferred_term: skin epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: homophilic cell-cell adhesion
    modifier: DECREASED
    term:
      id: GO:0007156
      label: homophilic cell-cell adhesion
  cellular_components:
  - preferred_term: desmosome
    term:
      id: GO:0030057
      label: desmosome
  downstream:
  - target: Flaccid bullae
    description: >-
      The superficial intraepidermal split manifests clinically as flaccid
      bullae in bullous impetigo.
  - target: Honey-colored crusts
    description: >-
      The fragile bullae rupture into moist erosions that crust over.
  evidence:
  - reference: PMID:20728315
    reference_title: >-
      Removal of amino-terminal extracellular domains of desmoglein 1 by
      staphylococcal exfoliative toxin is sufficient to initiate epidermal
      blister formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Epidermal blister formation was observed as early as 60 min after ETA
      treatment.
    explanation: >-
      The neonatal mouse model develops rapid epidermal blistering after ETA
      exposure.
- name: Post-Streptococcal Immune Sequelae
  role: outcome
  biological_scale: ORGANISM
  description: >-
    Group A streptococcal impetigo can trigger serious post-infectious
    complications, including acute post-streptococcal glomerulonephritis and
    acute rheumatic fever, in high-burden communities.
  downstream: []
  evidence:
  - reference: PMID:31630410
    reference_title: "Skin infections in Australian Aboriginal children: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Impetigo, scabies, cellulitis and abscesses are common in Australian
      Aboriginal children. These conditions adversely affect wellbeing and are
      associated with serious long term sequelae, including invasive infection
      and post-infectious complications, such as acute post-streptococcal
      glomerulonephritis and acute rheumatic fever
    explanation: >-
      This review links impetigo in a high-burden pediatric setting to severe
      invasive and post-infectious sequelae.

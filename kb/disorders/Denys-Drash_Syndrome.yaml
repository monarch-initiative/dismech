name: Denys-Drash Syndrome
creation_date: "2026-09-01T00:00:00Z"
category: Mendelian
categories:
- Hereditary Cancer Syndrome
- Cancer Predisposition Syndrome
- Pediatric Cancer
- Disorder of Sex Development
- Glomerular Disease
parents:
- hereditary cancer-predisposing syndrome
- 46,XY disorder of sex development
disease_term:
  preferred_term: Denys-Drash syndrome
  term:
    id: MONDO:0008682
    label: Denys-Drash syndrome
synonyms:
- Drash syndrome
- DDS
- nephropathy associated with male pseudohermaphroditism and Wilms tumor
description: >-
  Denys-Drash syndrome is a constitutional WT1 disorder classically defined by the
  triad of early onset diffuse mesangial sclerosis with steroid resistant nephrotic
  syndrome, gonadal dysgenesis in genotypic males, and a high risk of Wilms tumor.
  The causative variants are heterozygous missense changes clustered in the zinc
  finger DNA binding domain, most often in exon 9 (zinc finger III) and exon 8
  (zinc finger II). Because the altered protein retains its N terminal domain and
  can still act on the wild type WT1 present in the same cell, the mechanism is
  understood as dominant negative interference with WT1 target recognition rather
  than simple haploinsufficiency, which distinguishes it from the whole gene
  deletions of WAGR spectrum.
  A nosological caveat belongs at the top of this entry rather than buried in a
  note. Contemporary expert practice no longer treats Denys-Drash as a discrete
  clinical diagnosis: the GeneReviews WT1 Disorder chapter states that Denys-Drash
  and Frasier syndrome are part of one phenotypic continuum and are no longer
  clinically helpful designations. This entry is curated because MONDO carries the
  term and the historical literature is indexed under it, and because the zinc
  finger missense mechanism it names is genuinely distinct from the intron 9 splice
  mechanism of Frasier syndrome. It should be read as one pole of the WT1
  continuum, not as a separate disease. The grouping
  kb/groupings/WT1_Disorders.yaml records that continuum explicitly.
inheritance:
- name: Autosomal dominant, usually de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous WT1 zinc finger variants act dominantly. Most probands carry a de
    novo variant, though transmission from an affected or mosaic parent is
    documented.
  evidence:
  - reference: PMID:1655284
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In two families analyzed, the mutations were shown to arise de novo."
    explanation: Establishes the de novo origin typical of the syndrome.
  - reference: PMID:32352694
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WT1 disorder is inherited in an autosomal dominant manner."
    explanation: GeneReviews states the mode of inheritance for the WT1 disorder spectrum.
pathophysiology:
- name: WT1 Zinc-Finger Missense Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous constitutional point mutation in the WT1 zinc finger region,
    clustered in the exons encoding zinc fingers 2 and 3, alters the residues that
    make base specific contacts with target DNA.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      Heterozygous missense substitutions in the WT1 zinc finger DNA binding domain,
      clustered in exons 8 and 9, with a recurrent hot spot at zinc finger III. The
      phenotype requires an intact N terminal region alongside disrupted zinc finger
      function, which is the argument for dominant negative rather than
      haploinsufficient action.
  molecular_functions:
  - preferred_term: WT1 sequence-specific DNA binding
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Biallelic WT1 Inactivation in Nephrogenic Rests
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The constitutional variant is the first hit; tumor initiation additionally
      requires a somatic event at the remaining allele.
  - target: Dominant-Negative Interference with WT1 Target Recognition
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:1655284
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Nine of these mutations are found within exon 9 (zinc finger III); the remaining mutation is in exon 8 (zinc finger II). These mutations directly affect DNA sequence recognition."
      explanation: >-
        States that the zinc finger variants act by disrupting DNA sequence
        recognition, which is the step this edge asserts.
  evidence:
  - reference: PMID:1655284
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In ten independent cases of Denys-Drash syndrome, point mutations in the zinc finger domains of one WT1 gene copy were found."
    explanation: Establishes the heterozygous zinc-finger variant as the constitutional lesion.
  - reference: PMID:8388765
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The WT1 mutations in these patients are constitutional point mutations clustered in the zinc finger (ZF) encoding exons, particularly the exons encoding ZF2 and ZF3."
    explanation: Localizes the variants to the zinc-finger 2 and 3 exons.
- name: Dominant-Negative Interference with WT1 Target Recognition
  biological_scale: MOLECULAR
  description: >-
    The mutant protein retains its intact N terminal domain and interferes with the
    wild type WT1 present in the same cell, either by blocking its access to normal
    binding sites or by directing the complex to inappropriate ones. This is why the
    phenotype is more severe than that of a WT1 whole gene deletion.
  downstream:
  - target: Loss of the WT1 Transcriptional Program in Podocytes
    causal_link_type: DIRECT
  - target: Failure of Gonadal Somatic Cell Differentiation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:8388765
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we suggest that a dominant negative mechanism is at work here"
    explanation: >-
      The primary report proposing dominant-negative action, on the argument that the
      phenotype requires an intact N-terminus alongside disrupted zinc-finger function.
  - reference: PMID:9499425
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A much more severe phenotype is seen in patients with Denys-Drash syndrome which results from heterozygous dominant-negative mutations of the gene."
    explanation: >-
      Contrasts the dominant-negative mechanism here with the loss of the +KTS isoform
      in Frasier syndrome, where no mutant protein is made.
- name: Loss of the WT1 Transcriptional Program in Podocytes
  biological_scale: CELLULAR
  description: >-
    WT1 is required in the mature glomerulus, where it is highly expressed in
    podocytes and directs a transcriptional program governing podocyte
    differentiation and podocyte to mesangial cross talk. Its disruption is the
    proximate cellular lesion behind the glomerulopathy.
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  biological_processes:
  - preferred_term: glomerulus development
    term:
      id: GO:0032835
      label: glomerulus development
    modifier: DECREASED
  downstream:
  - target: Diffuse Mesangial Sclerosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19797313
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Their defects are thought to modify the cross-talk between podocytes and other glomerular cells and ultimately lead to glomerular sclerosis, as observed in diffuse mesangial sclerosis (DMS) a nephropathy associated with WT1 mutations."
      explanation: >-
        States the causal step from disrupted podocyte WT1 targets to the mesangial
        sclerosis lesion.
  evidence:
  - reference: PMID:19797313
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "By ChIP we show that Scel and Sulf1 are direct WT1 targets."
    explanation: >-
      A diffuse mesangial sclerosis mouse line identifies direct podocyte WT1 target
      genes, substantiating a podocyte transcriptional program under WT1 control.
- name: Failure of Gonadal Somatic Cell Differentiation
  biological_scale: TISSUE
  description: >-
    The same WT1 program is required for testicular somatic cell differentiation, so
    genotypic males show partial to complete gonadal dysgenesis with under
    virilization, and dysgenetic gonadal tissue carries gonadoblastoma risk.
  biological_processes:
  - preferred_term: sex differentiation
    term:
      id: GO:0007548
      label: sex differentiation
    modifier: DECREASED
  downstream:
  - target: Gonadal Dysgenesis
    causal_link_type: DIRECT
  - target: Ambiguous Genitalia
    causal_link_type: DIRECT
  - target: Gonadoblastoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dysgenetic gonadal tissue is the substrate for gonadoblastoma, which is why
      prophylactic gonadectomy is offered.
  evidence:
  - reference: PMID:1655284
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results provide evidence of a direct role for WT1 in Denys-Drash syndrome and thus urogenital system development."
    explanation: Links the WT1 lesion to urogenital developmental failure.
- name: Diffuse Mesangial Sclerosis
  biological_scale: TISSUE
  description: >-
    The characteristic renal biopsy lesion, an expansion of mesangial matrix with
    podocyte hypertrophy progressing to global glomerular sclerosis. It is largely
    specific to WT1 disease among steroid resistant nephrotic syndrome cohorts and is
    the lesion that drives rapid progression to kidney failure.
  cell_types:
  - preferred_term: glomerular mesangial cell
    term:
      id: CL:1000742
      label: glomerular mesangial cell
  downstream:
  - target: Steroid-Resistant Nephrotic Syndrome
    causal_link_type: DIRECT
  - target: Proteinuria
    causal_link_type: DIRECT
  - target: Stage 5 Chronic Kidney Disease
    causal_link_type: DIRECT
  - target: Hypertension
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:24402088
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Focal segmental glomerulosclerosis was equally prevalent in both cohorts, but diffuse mesangial sclerosis was largely specific for WT1 disease and was present in 34% of cases."
    explanation: >-
      Establishes diffuse mesangial sclerosis as the WT1-specific lesion against a
      700-patient steroid-resistant nephrotic syndrome comparison cohort.
  - reference: PMID:9607189
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Renal biopsy showed diffuse mesangial sclerosis in eight and focal segmental sclerosis in two cases."
    explanation: Documents the biopsy lesion in a WT1-mutant early-onset nephrotic syndrome series.
- name: Biallelic WT1 Inactivation in Nephrogenic Rests
  biological_scale: CELLULAR
  description: >-
    A somatic second hit at the remaining WT1 allele within persisting nephrogenic
    rests completes tumor suppressor inactivation and initiates Wilms tumor, the
    classical two hit sequence acting on a constitutional first hit.
  genetic_context:
    variant_origin: SOMATIC
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Reduction to homozygosity for the mutant WT1 allele within tumor tissue,
      observed as loss of the wild type allele.
  downstream:
  - target: Nephroblastoma
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:1655284
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Wilms' tumors from three individuals and one juvenile granulosa cell tumor demonstrate reduction to homozygosity for the mutated WT1 allele."
    explanation: >-
      Demonstrates loss of the wild-type allele in the tumors themselves, which is the
      somatic second hit this node asserts.
phenotypes:
- category: Renal
  name: Steroid-Resistant Nephrotic Syndrome
  description: >-
    Congenital, infantile, or early childhood onset nephrotic syndrome that does not
    respond to corticosteroids and progresses rapidly.
  phenotype_term:
    preferred_term: Steroid-resistant nephrotic syndrome
    term:
      id: HP:0012588
      label: Steroid-resistant nephrotic syndrome
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:32352694
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WT1 disorder is characterized by congenital/infantile or childhood onset of steroid-resistant nephrotic syndrome (SRNS), a progressive glomerulopathy that does not respond to standard steroid therapy."
    explanation: GeneReviews names steroid-resistant nephrotic syndrome as the defining renal phenotype.
- category: Renal
  name: Proteinuria
  phenotype_term:
    preferred_term: Proteinuria
    term:
      id: HP:0000093
      label: Proteinuria
  evidence:
  - reference: PMID:32352694
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "proteinuria every six months until age ten years, yearly thereafter"
    explanation: >-
      Proteinuria is the surveillance parameter GeneReviews monitors for first
      appearance of the glomerulopathy.
- category: Renal
  name: Stage 5 Chronic Kidney Disease
  description: >-
    Kidney failure, typically reached within months of nephrotic syndrome onset and
    commonly before age five years.
  phenotype_term:
    preferred_term: Stage 5 chronic kidney disease
    term:
      id: HP:0003774
      label: Stage 5 chronic kidney disease
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:9607189
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "End-stage renal disease was reached either concomitantly or within four months after onset of NS in seven of ten patients."
    explanation: Quantifies the rapid progression to kidney failure.
- category: Cardiovascular
  name: Hypertension
  phenotype_term:
    preferred_term: Hypertension
    term:
      id: HP:0000822
      label: Hypertension
  evidence:
  - reference: PMID:24402088
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WT1 patients more frequently presented with chronic kidney disease and hypertension at diagnosis and exhibited more rapid disease progression."
    explanation: Reports hypertension at presentation as more frequent in WT1 disease.
- category: Genitourinary
  name: Gonadal Dysgenesis
  description: >-
    Partial to complete failure of testicular development in genotypic males,
    presenting as ambiguous genitalia or a female external phenotype.
  phenotype_term:
    preferred_term: Gonadal dysgenesis
    term:
      id: HP:0000133
      label: Gonadal dysgenesis
  frequency: FREQUENT
  evidence:
  - reference: PMID:24402088
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sex reversal and/or urogenital abnormalities (52%), Wilms tumor (38%), and gonadoblastoma (5%) were almost exclusive to WT1 disease."
    explanation: Quantifies urogenital involvement and its specificity to WT1 disease.
- category: Genitourinary
  name: Ambiguous Genitalia
  phenotype_term:
    preferred_term: Ambiguous genitalia
    term:
      id: HP:0000062
      label: Ambiguous genitalia
  evidence:
  - reference: PMID:9607189
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "From the seven genotypic males with WT1 mutations, five presented ambiguous genitalia and two a female phenotype."
    explanation: Documents the external genital phenotype in genotypic males.
- category: Neoplastic
  name: Nephroblastoma
  description: >-
    Wilms tumor, often of early childhood onset and sometimes bilateral or
    multifocal, arising on the constitutional WT1 variant.
  phenotype_term:
    preferred_term: Nephroblastoma
    term:
      id: HP:0002667
      label: Nephroblastoma
  frequency: FREQUENT
  evidence:
  - reference: PMID:24402088
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sex reversal and/or urogenital abnormalities (52%), Wilms tumor (38%), and gonadoblastoma (5%) were almost exclusive to WT1 disease."
    explanation: Gives the Wilms tumor frequency in a WT1 nephropathy cohort.
  - reference: PMID:9607189
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A unilateral Wilms' tumor was found before or concomitant with NS in four children (3 males, 1 female)."
    explanation: Documents Wilms tumor presenting at or before the renal phenotype.
- category: Neoplastic
  name: Gonadoblastoma
  description: >-
    Germ cell tumor arising in dysgenetic gonadal tissue, the reason prophylactic
    gonadectomy is offered.
  phenotype_term:
    preferred_term: Gonadoblastoma
    term:
      id: HP:0000150
      label: Gonadoblastoma
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:24402088
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sex reversal and/or urogenital abnormalities (52%), Wilms tumor (38%), and gonadoblastoma (5%) were almost exclusive to WT1 disease."
    explanation: Gives the gonadoblastoma frequency in WT1 disease.
genetic:
- name: WT1
  gene_term:
    preferred_term: WT1
    term:
      id: hgnc:12796
      label: WT1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Heterozygous constitutional missense variants in the WT1 zinc finger DNA binding
    domain, clustered in exons 8 and 9, are the cause of Denys-Drash syndrome.
  notes: >-
    The recurrent hot spot lies in zinc finger III, encoded by exon 9. Genotype
    tracks with phenotype across the WT1 spectrum: missense substitutions at DNA
    binding residues give the diffuse mesangial sclerosis picture of Denys-Drash,
    truncating variants carry the highest Wilms tumor risk, and intronic KTS variants
    give the Frasier picture.
  evidence:
  - reference: PMID:9607189
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "four children presented the so-called hot spot mutation in exon 9 (R394N) and six had different mutations in exons 8 and 9 (4 not previously described)"
    explanation: Documents the exon 8 and 9 clustering and the recurrent zinc-finger III hot spot.
  - reference: PMID:24402088
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Missense substitutions affecting DNA-binding residues were associated with diffuse mesangial sclerosis (74%), early steroid-resistant nephrotic syndrome onset, and rapid progression to ESRD."
    explanation: >-
      Establishes the genotype-phenotype association between DNA-binding-residue
      missense variants and the Denys-Drash renal phenotype.
  - reference: PMID:24402088
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Truncating mutations conferred the highest Wilms tumor risk (78%) but typically late-onset steroid-resistant nephrotic syndrome."
    explanation: >-
      Records the contrasting truncating-variant phenotype, which is why Wilms risk
      cannot be read off the Denys-Drash label alone.
treatments:
- name: RAAS Inhibition for Proteinuria
  description: >-
    Renin angiotensin aldosterone system blockade is used to reduce proteinuria.
    Immunosuppression is explicitly avoided, since the glomerulopathy is genetic
    rather than immune mediated.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Steroid-Resistant Nephrotic Syndrome
  evidence:
  - reference: PMID:32352694
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SRNS: avoid immunosuppressants; consider renin-angiotensin-aldosterone system (RAAS) inhibition."
    explanation: GeneReviews management recommendation for the glomerulopathy.
- name: Avoidance of Immunosuppressive Therapy
  description: >-
    An explicit agents to avoid recommendation. Immunosuppressants used empirically
    for steroid resistant nephrotic syndrome are ineffective here and carry toxicity,
    which is a practical reason to establish the WT1 genotype early.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:32352694
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Avoid treating glomerulopathy with immunosuppressants, as they are not effective and potentially toxic."
    explanation: The GeneReviews agents and circumstances to avoid statement.
- name: Prophylactic Gonadectomy
  description: >-
    Removal of dysgenetic gonadal tissue in individuals with a disorder of testicular
    development, to prevent gonadoblastoma.
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Gonadoblastoma
  evidence:
  - reference: PMID:32352694
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prevent whenever possible gonadoblastoma by prophylactic gonadectomy in those with a disorder of testicular development."
    explanation: GeneReviews prevention recommendation.
differential_diagnoses:
- name: Frasier syndrome
  disease_term:
    preferred_term: Frasier syndrome
    term:
      id: MONDO:0007635
      label: Frasier syndrome
  description: >-
    The other pole of the WT1 continuum. Frasier syndrome arises from intron 9 splice
    donor variants that reduce the +KTS isoform without producing a mutant protein,
    and presents with focal segmental glomerulosclerosis, later kidney failure, and
    complete gonadal dysgenesis rather than diffuse mesangial sclerosis with early
    kidney failure.
  distinguishing_features:
  - Diffuse mesangial sclerosis with kidney failure usually before age five favors Denys-Drash syndrome.
  - Focal segmental glomerulosclerosis with later kidney failure and complete gonadal dysgenesis favors Frasier syndrome.
  - A zinc finger missense variant favors Denys-Drash syndrome; an intron 9 splice donor variant favors Frasier syndrome.
  evidence:
  - reference: PMID:9499425
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show that a related disease, Frasier syndrome, characterized by focal glomerular sclerosis, delayed kidney failure and complete gonadal dysgenesis, is probably caused by specific intronic point mutations of WT1 that preferentially affect a CpG dinucleotide."
    explanation: Defines the Frasier phenotype and its distinct splice mechanism.
  - reference: PMID:9499425
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to Denys-Drash syndrome, no mutant protein is produced."
    explanation: >-
      States the mechanistic contrast that separates the two entities, dominant-negative
      protein versus isoform imbalance.
discussions:
- discussion_id: wt1_continuum_vs_discrete_entity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Should Denys-Drash syndrome remain a distinct knowledge base entry, given that
    expert clinical practice has folded it into a WT1 disorder continuum?
  attaches_to:
  - disease#Denys-Drash Syndrome
  rationale: >-
    The GeneReviews WT1 Disorder chapter states that the Denys-Drash and Frasier
    designations are no longer clinically helpful and describes one phenotypic
    continuum. MONDO still carries separate terms, and there is no MONDO umbrella term
    for the continuum to bind, so the knowledge base cannot simply follow the clinical
    reframing. The mechanistic distinction is also real, a zinc finger missense
    dominant negative versus an intron 9 splice isoform imbalance, so collapsing the
    entries would lose a genuine mechanistic contrast. This entry is retained on that
    basis, with kb/groupings/WT1_Disorders.yaml carrying the continuum, and the
    question is recorded rather than silently resolved.
  evidence:
  - reference: PMID:32352694
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "those designations are now recognized to be part of a phenotypic continuum and are no longer clinically helpful"
    explanation: >-
      The GeneReviews statement that motivates this gap, quoted so the entry does not
      assert a nosology its own baseline source contradicts.
references:
- reference: PMID:32352694
  title: WT1 Disorder
  tags:
  - GeneReviews

classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      An inherited optic neuropathy - a neurodegenerative disease of the retinal
      ganglion cell and its axon.
    evidence:
    - reference: PMID:31915829
      reference_title: "Novel mutations in malonyl-CoA-acyl carrier protein transacylase provoke autosomal recessive optic neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These results indicated that MCAT plays an essential role in mitochondrial function and maintenance of RGC axons, while novel MCAT p.L81R and p.R212W mutations can lead to optic neuropathy."
      explanation: Establishes MCAT-related optic atrophy 15 as a neurodegenerative disorder of retinal ganglion cell axons and the optic nerve.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A Mendelian disorder identified by exome/targeted sequencing.
    evidence:
    - reference: CGGV:assertion_427c818a-1705-4013-a5ba-d977540535d5-2024-05-16T160000.000Z
      reference_title: "MCAT / optic atrophy 15 (Limited)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "MCAT | HGNC:29622 | optic atrophy 15 | MONDO:0957935 | AR | Limited | SOP10 | Glaucoma and Neuro-Ophthalmology Gene Curation Expert Panel | 2024-05-16T16:00:00.000Z"
      explanation: ClinGen curates optic atrophy 15 as an autosomal recessive Mendelian disorder associated with MCAT.
  mechanistic_category:
  - classification_value: mitochondrial disease
    notes: >-
      Assigned on the mitochondrial mechanism - MCAT is a mitochondrial
      fatty-acid-synthesis enzyme and the retinal ganglion cell phenotype is read
      as a mitochondrial endophenotype. A combined oxidative phosphorylation
      deficiency was measured directly in the multisystem patient's own
      fibroblasts and lymphoblasts; what is missing is any bioenergetic
      measurement in the patients with isolated optic atrophy.

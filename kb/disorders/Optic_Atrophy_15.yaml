prevalence:
- population: Worldwide (published families in the literature)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Optic atrophy 15 is ultra-rare, described in three unrelated pedigrees in
    the published literature (two Chinese brothers, one sporadic French adult,
    and one child with combined OXPHOS deficiency); no population-level
    prevalence or incidence estimate exists.
  evidence:
  - reference: CGGV:assertion_427c818a-1705-4013-a5ba-d977540535d5-2024-05-16T160000.000Z
    reference_title: "MCAT / optic atrophy 15 (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At least four variants (missense and frameshift) have been reported in two probands in two publications (PMID: 31915829, PMID: 33918393)."
    explanation: ClinGen's curation records only two scored optic-atrophy probands in the literature alongside the separate multisystem OXPHOS proband, establishing ultra-rare occurrence.
  - reference: PMID:33918393
    reference_title: "MCAT Mutations Cause Nuclear LHON-like Optic Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although MCAT pathological variants are very uncommon, this gene should be investigated in HON patients, irrespective of disease presentation."
    explanation: Notes that pathogenic MCAT variants are very uncommon even within hereditary optic neuropathy cohorts.

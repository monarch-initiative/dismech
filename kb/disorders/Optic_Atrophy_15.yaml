discussions:
- discussion_id: oxphos_to_rgc_death_unproven
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the combined OXPHOS deficiency seen in MCAT disease what selectively kills
    retinal ganglion cells, or is the retinal-ganglion-cell death driven by
    something else?
  rationale: >-
    The upstream chain is now supported: biallelic MCAT variants destabilise the
    protein, impair mtFAS, and produce a measured combined oxidative
    phosphorylation deficiency, with the respiratory-chain branch rather than
    lipoylation implicated. What is not demonstrated is the final step. The one
    patient with measured OXPHOS deficiency had severe multisystem disease rather
    than isolated optic atrophy, and that deficiency was measured in fibroblasts
    and lymphoblasts rather than retinal ganglion cells; the patients with
    isolated optic atrophy had no bioenergetic measurement. So the link between
    the respiratory-chain deficit and the selective retinal ganglion cell loss
    remains inferred from the general vulnerability of these cells to
    mitochondrial dysfunction.
  attaches_to:
  - pathophysiology#Impaired Respiratory-Chain Assembly and Combined OXPHOS Deficiency

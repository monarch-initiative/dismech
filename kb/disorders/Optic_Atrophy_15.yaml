      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "Malonyl-CoA-acyl carrier protein transacylase (MCAT) is an enzyme involved in mitochondrial fatty acid synthesis (mtFAS) and catalyzes the transfer of the malonyl moiety of malonyl-CoA to the mitochondrial acyl carrier protein (ACP)."

name: Optic Atrophy 15
creation_date: "2026-10-25T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Optic atrophy 15
  term:
    id: MONDO:0957935
    label: optic atrophy 15
description: >-
  Optic atrophy 15 (OPA15) is an autosomal recessive inherited optic neuropathy
  caused by biallelic variants in MCAT, which encodes the mitochondrial enzyme
  malonyl-CoA-acyl carrier protein transacylase. MCAT catalyses the transfer of
  malonyl groups onto the mitochondrial acyl carrier protein, the second step of
  the mitochondrial fatty-acid synthesis (mtFAS) pathway, and it is expressed in
  retinal ganglion cells, which are rich in mitochondria. As with the other
  nuclear-gene optic neuropathies, the disease is understood as a mitochondrial
  endophenotype in which the retinal ganglion cell and its long, energy-demanding
  axon fail selectively.

  The gene-disease relationship rests on three reports and a handful of
  families, and the presentations they describe span a wide spectrum. The
  original report identified two brothers from a consanguineous Chinese family
  carrying homozygous missense variants (p.Leu81Arg and p.Arg212Trp); they had
  insidious, gradual childhood vision loss with nystagmus and acuity reduced to
  finger counting by age 8. The second report identified a sporadic French woman
  compound heterozygous for a splice-donor variant (c.424-2A>G) and a missense
  variant (p.Glu347Lys); she presented at age 20 with acute, bilateral but
  asymmetric central visual loss resembling Leber hereditary optic neuropathy. A
  third report identified a boy homozygous for p.Thr271Ile with a severe
  infantile multisystem presentation - hypotonia, failure to thrive, nystagmus,
  and symmetric T2/FLAIR signal change in the dorsal medulla, periaqueductal
  gray, substantia nigra, medial hypothalamus and habenular nuclei on brain MRI.
  All three are part of one gene-defined entity, and MCAT is now recognised as
  one of the nuclear genes causing an autosomal recessive LHON-like optic
  neuropathy (arLHON), alongside DNAJC30 and NDUFS2.

  The mechanism downstream of the gene is partly established. The disease
  variants destabilise the MCAT protein and reduce its intracellular expression;
  retinal-ganglion-cell-specific knockdown of Mcat in mice reproduces an
  attenuated retinal nerve fibre layer. In the multisystem patient, the
  mitochondrial consequence was measured directly in the patient's own
  fibroblasts and lymphoblasts: a combined oxidative phosphorylation deficiency
  with reduced complex I, II and IV subunits and respiratory-chain enzyme
  activities, rescued by re-expressing wild-type MCAT. That patient's protein
  lipoylation was normal, and in a mutant myoblast line the p.Thr271Ile allele
  restored lipoylation but only partially restored respiration - dissociating the
  two branches of mtFAS output and implicating impaired respiratory-chain
  assembly, rather than lipoylation, as the disease-relevant consequence. What
  remains inferential is the final step: whether that respiratory-chain deficit
  is what selectively kills retinal ganglion cells, since the one patient with
  measured OXPHOS deficiency had multisystem disease and the
  isolated-optic-atrophy patients had no such measurement. The entry records that
  last step as a gap.

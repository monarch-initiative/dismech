    reduce its expression - and no fully inactivating human genotype has been
    reported. relationship_type is recorded as UNKNOWN rather than CAUSATIVE
    because CAUSATIVE is reserved for Definitive or Strong ClinGen assertions,
    whereas the ClinGen Glaucoma and Neuro-Ophthalmology GCEP classified MCAT /
    optic atrophy 15 as Limited in May 2024 (two scored optic-atrophy probands;
    the infant multisystem proband in PMID:36881526 was reviewed under lumping
    and splitting as the same entity but left unscored for lack of ocular
    phenotype detail at young age).
  evidence:
  - reference: PMID:33918393
    reference_title: "MCAT Mutations Cause Nuclear LHON-like Optic Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

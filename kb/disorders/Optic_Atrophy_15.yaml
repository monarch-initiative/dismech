  mechanistic_category:
  - classification_value: mitochondrial disease
    notes: >-
      Assigned on the mitochondrial mechanism - MCAT is a mitochondrial
      fatty-acid-synthesis enzyme and the retinal ganglion cell phenotype is read
      as a mitochondrial endophenotype. A combined oxidative phosphorylation
      deficiency was measured directly in the multisystem patient's own
      fibroblasts and lymphoblasts; what is missing is any bioenergetic
      measurement in the patients with isolated optic atrophy.

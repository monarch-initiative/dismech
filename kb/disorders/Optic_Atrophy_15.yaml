genetic:
- name: MCAT
  gene_term:
    preferred_term: MCAT
    term:
      id: hgnc:29622
      label: MCAT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Biallelic MCAT variants cause the disease. Reported genotypes are homozygous
    p.Leu81Arg plus p.Arg212Trp (consanguineous Chinese brothers), compound
    heterozygous c.424-2A>G (splice donor) plus p.Glu347Lys (sporadic French
    case), and homozygous p.Thr271Ile (boy with multisystem disease). The
    variants are hypomorphic rather than null - they destabilise the protein and
    reduce its expression - and no fully inactivating human genotype has been
    reported. The gene-disease assertion rests on three families, and MCAT is a
    recognised nuclear arLHON gene.
  evidence:
  - reference: PMID:33918393
    reference_title: "MCAT Mutations Cause Nuclear LHON-like Optic Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified two novel MCAT mutations in a female patient who presented
      with acute, sudden, bilateral, yet asymmetric, central visual loss at the
      age of 20
    explanation: >-
      The second independent family establishing MCAT as causative, with a
      compound heterozygous genotype distinct from the index family.
  - reference: PMID:36881526
    reference_title: "Recessive pathogenic variants in MCAT cause combined oxidative phosphorylation deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By whole exome sequencing, we identified a homozygous variant in MCAT
      c.812T>C; p.T271I (rs760294168; NM_173467.4) in the proband, which was
      heterozygous in both parents consistent with autosomal recessive
      inheritance
    explanation: >-
      The third independent family, a homozygous missense genotype segregating
      as autosomal recessive.
  - reference: PMID:31915829
    reference_title: "Novel mutations in malonyl-CoA-acyl carrier protein transacylase provoke autosomal recessive optic neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The disease variants lead to structurally unstable MCAT protein with
      significantly reduced intracellular expression.
    explanation: >-
      Functional support that the pathogenic variants reduce MCAT protein
      stability and abundance (hypomorphic, partial loss of function).
  - reference: PMID:33918393
    reference_title: "MCAT Mutations Cause Nuclear LHON-like Optic Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      This presentation is consistent with a Leber hereditary optic neuropathy
      (LHON)-like phenotype, whose existence and association with NDUFS2 and
      DNAJC30 has only recently been described
    explanation: >-
      Places MCAT disease in the recently described autosomal recessive LHON-like
      group alongside NDUFS2 and DNAJC30.
pathophysiology:
- name: Biallelic MCAT Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic germline MCAT variants reduce the stability and intracellular
    abundance of malonyl-CoA-acyl carrier protein transacylase; the
    protein-instability data come from cultured cells. The enzyme is expressed in
    the mitochondria-rich retinal ganglion cells that degenerate in this disease.
  molecular_functions:
  - preferred_term: malonyl-CoA-acyl carrier protein transacylase activity
    modifier: DECREASED
    term:
      id: GO:0004314
      label: "[acyl-carrier-protein] S-malonyltransferase activity"
  genes:
  - preferred_term: MCAT
    term:
      id: hgnc:29622
      label: MCAT
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  downstream:
  - target: Impaired Mitochondrial Fatty-Acid Synthesis
    causal_link_type: DIRECT
    description: >-
      Reduced functional MCAT lowers its malonyl-transfer contribution to
      mitochondrial fatty-acid synthesis.
    evidence:
    - reference: PMID:31915829
      reference_title: "Novel mutations in malonyl-CoA-acyl carrier protein transacylase provoke autosomal recessive optic neuropathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The disease variants lead to structurally unstable MCAT protein with
        significantly reduced intracellular expression.
      explanation: >-
        Loss of stable MCAT protein is the molecular lesion that reduces its
        enzymatic contribution to the pathway.
  evidence:
  - reference: PMID:31915829
    reference_title: "Novel mutations in malonyl-CoA-acyl carrier protein transacylase provoke autosomal recessive optic neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "MCAT is expressed in RGC that are rich in mitochondria."
    explanation: >-
      Establishes that the affected enzyme is expressed in the cell type that
      degenerates in this disease; the retinal ganglion cell expression data in
      this report are from the mouse.
- name: Impaired Mitochondrial Fatty-Acid Synthesis
  biological_scale: MOLECULAR
  description: >-
    MCAT catalyses the S-malonyl transfer onto the mitochondrial acyl carrier
    protein, the second step of mitochondrial fatty-acid synthesis. Reduced MCAT
    activity impairs this pathway.
  biological_processes:
  - preferred_term: mitochondrial fatty-acid biosynthesis
    term:
      id: GO:0006633
      label: fatty acid biosynthetic process
    modifier: DECREASED
  downstream:
  - target: Impaired Respiratory-Chain Assembly and Combined OXPHOS Deficiency
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      mtFAS supplies acyl-ACP needed for respiratory-chain complex assembly;
      loss of mtFAS output reduces assembly of complexes I, II and IV. The
      intermediate steps (acyl-ACP supply to the NDUFAB1/Fe-S machinery) are
      known from general biology.
    evidence:
    - reference: PMID:36881526
      reference_title: "Recessive pathogenic variants in MCAT cause combined oxidative phosphorylation deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: >-
        loss-of-function of mtFAS genes, including Mcat, is associated with
        severe loss of electron transport chain (ETC) complexes in mouse
        immortalized skeletal myoblasts
      explanation: >-
        Prior myoblast work (restated here) linking loss of mtFAS output to loss
        of assembled electron-transport-chain complexes.
  evidence:
  - reference: PMID:33918393
    reference_title: "MCAT Mutations Cause Nuclear LHON-like Optic Neuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      which encodes a mitochondrial protein involved in fatty-acid biogenesis
    explanation: >-
      Identifies MCAT's function as a mitochondrial fatty-acid-synthesis enzyme.
- name: Impaired Respiratory-Chain Assembly and Combined OXPHOS Deficiency
  biological_scale: CELLULAR
  description: >-
    In the multisystem patient's fibroblasts and lymphoblasts, reduced MCAT
    produced a combined oxidative phosphorylation deficiency - reduced complex I
    (NDUFB8), II (SDHB) and IV (COXII) subunits with correspondingly decreased
    respiratory-chain enzyme activities - rescued by re-expressing wild-type
    MCAT. In that patient protein lipoylation was normal, and in a mutant myoblast
    line the p.Thr271Ile allele restored lipoylation but only partially restored
    respiration, implicating impaired respiratory-chain assembly rather than
    lipoylation as the relevant consequence. mtFAS's role here is the supply of
    acyl-ACP for complex assembly (via mitochondrial ACP/NDUFAB1), not fatty-acid
    synthesis as an end in itself.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: lymphoblast
    term:
      id: CL:0017005
      label: lymphoblast
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex assembly
    term:
      id: GO:0033108
      label: mitochondrial respiratory chain complex assembly
    modifier: DECREASED
  - preferred_term: cellular respiration
    term:
      id: GO:0045333
      label: cellular respiration
    modifier: DECREASED
  downstream:
  - target: Retinal Ganglion Cell and Optic Nerve Axon Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired oxidative phosphorylation is proposed to drive degeneration of
      the mitochondria-rich retinal ganglion cell; the selective vulnerability of
      retinal ganglion cells to OXPHOS deficits is the inferred final step.
  evidence:
  - reference: PMID:36881526
    reference_title: "Recessive pathogenic variants in MCAT cause combined oxidative phosphorylation deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Protein levels for NDUFB8 and COXII, subunits of complex I and IV
      respectively, were markedly reduced in lymphoblasts and fibroblasts, as
      well as SDHB for complex II in fibroblasts. ETC enzyme activities were
      decreased in parallel.
    explanation: >-
      Direct patient-cell evidence of a combined oxidative phosphorylation
      deficiency resulting from biallelic MCAT variants.
  - reference: PMID:36881526
    reference_title: "Recessive pathogenic variants in MCAT cause combined oxidative phosphorylation deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      expression of wild-type human MCAT fully rescued both basal and maximal
      respiration rates. In contrast, expression of the p.T271I mutant only
      partially rescued respiration
    explanation: >-
      The disease allele restores lipoylation but not respiration, dissociating
      the two mtFAS output branches and implicating respiratory-chain function.
  - reference: PMID:36881526
    reference_title: "Recessive pathogenic variants in MCAT cause combined oxidative phosphorylation deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      reveals normal lipoylation of the PDH and OGDH E2 components (DLAT and
      DLST, respectively) in the patient sample
    explanation: >-
      Lipoylation was intact in the patient, so the lipoic-acid branch of mtFAS
      is not the operative lesion here.
- name: Retinal Ganglion Cell and Optic Nerve Axon Degeneration
  biological_scale: TISSUE
  description: >-
    Progressive loss of retinal ganglion cells and their optic nerve axons, seen
    as a reduced retinal nerve fibre layer and reproduced by
    retinal-ganglion-cell-specific Mcat knockdown in mice.
  cell_types:
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  downstream:
  - target: Optic atrophy
    causal_link_type: DIRECT
  - target: Reduced visual acuity
    causal_link_type: DIRECT
  - target: Abnormal retinal nerve fiber layer morphology
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31915829
    reference_title: "Novel mutations in malonyl-CoA-acyl carrier protein transacylase provoke autosomal recessive optic neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      RGC-specific knockdown of Mcat in mice, lead to an attenuated retinal
      neurofiber layer, that resembles the phenotype of optic neuropathy.
    explanation: >-
      Model-organism support that loss of Mcat in retinal ganglion cells
      produces the retinal nerve fibre layer loss of optic neuropathy.
  - reference: PMID:31915829
    reference_title: "Novel mutations in malonyl-CoA-acyl carrier protein transacylase provoke autosomal recessive optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      progressive degeneration of optic nerve and retinal ganglion cells (RGC)
    explanation: >-
      Describes the tissue-level lesion - progressive degeneration of the optic
      nerve and retinal ganglion cells.

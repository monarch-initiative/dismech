  species: Mouse
  genotype: Mcat flox/flox treated with AAV2-Cre for retinal ganglion cell-specific Mcat depletion
  description: >-
    Conditional depletion of Mcat in mouse retinal ganglion cells via AAV2-Cre
    disrupts maintenance of retinal ganglion cell axons and produces an
    attenuated retinal nerve fiber layer resembling human optic neuropathy.
  publication: PMID:31915829
  modeled_mechanisms:
  - target: Retinal Ganglion Cell and Optic Nerve Axon Degeneration
    relationship: RECAPITULATES
    description: >-
      Retinal-ganglion-cell-specific Mcat depletion reproduces retinal nerve
      fiber layer thinning and RGC axon maintenance failure.
    limitations: >-
      Models cell-type-specific conditional deletion of Mcat in retinal ganglion
      cells rather than constitutional hypomorphic human missense alleles across
      tissues.

differential_diagnoses:
- name: Megaloblastic anemia due to vitamin B12 or folate deficiency
  description: >-
    Nutritional or malabsorptive deficiencies of vitamin B12 (cobalamin) or
    folate are the most common causes of pediatric megaloblastic anemia with
    hypersegmented neutrophils and pancytopenia, closely mimicking the hematologic
    presentation of hereditary orotic aciduria.
  distinguishing_features:
  - Normal or elevated serum vitamin B12 and folate concentrations in hereditary orotic aciduria, whereas serum cobalamin or folate is low in nutritional deficiency.
  - Complete lack of hematologic response to therapeutic trials of vitamin B12 and folic acid supplementation in hereditary orotic aciduria, versus prompt reticulocytosis and marrow recovery in vitamin B12 or folate deficiency.
  - Massive urinary orotic acid overexcretion and biallelic pathogenic UMPS variants establish hereditary orotic aciduria.
  disease_term:
    preferred_term: Megaloblastic anemia due to vitamin B12 or folate deficiency
    term:
      id: MONDO:0001700
      label: megaloblastic anemia
  evidence:
  - reference: PMID:33489760
    reference_title: "Hereditary orotic aciduria (HOA): A novel uridine-5-monophosphate synthase (UMPS) mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone marrow biopsy showed trilineage megaloblastoid maturation with dysplastic changes that were refractory to hematinic therapy."
    explanation: Demonstrates that HOA megaloblastic bone marrow changes are refractory to hematinic (vitamin B12/folate/iron) therapy.
  - reference: PMID:16722557
    reference_title: "Imerslund-Gräsbeck syndrome (selective vitamin B(12) malabsorption with proteinuria)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As stated, the main causes of megaloblastic anemia are lack of folate or cobalamin. Rare causes include congenital disturbances in nucleic acid metabolism (e.g. orotic aciduria) and lack of other B vitamins. Assay of total serum cobalamin and folate often differentiates between the two deficiencies. Also, a therapeutic test with cobalamin or a few micrograms of folate is helpful."
    explanation: Explicitly places hereditary orotic aciduria in the differential diagnosis of folate- and cobalamin-deficiency megaloblastic anemias and notes differentiation by serum vitamin assays and therapeutic trial response.
- name: Inborn disorder of cobalamin metabolism and transport (including Imerslund-Gräsbeck syndrome and transcobalamin deficiency)
  description: >-
    Inherited defects of intestinal cobalamin absorption (Imerslund-Gräsbeck
    syndrome due to CUBN or AMN variants) or systemic transport (transcobalamin
    II deficiency) present in infancy or early childhood with megaloblastic
    anemia, failure to thrive, recurrent infections, and neurological deficits
    overlapping hereditary orotic aciduria.
  distinguishing_features:
  - Responsiveness of megaloblastic anemia and systemic symptoms to parenteral vitamin B12 therapy in cobalamin malabsorption and transport defects, whereas HOA is refractory to vitamin B12 and responds specifically to uridine replacement.
  - Persistence of selective proteinuria without renal function deterioration in Imerslund-Gräsbeck syndrome versus orotic acid crystalluria and obstructive uropathy in HOA.
  - Absence of massive urinary orotic aciduria and identification of pathogenic variants in CUBN, AMN, GIF, or TCN2 rather than UMPS.
  disease_term:
    preferred_term: Inborn disorder of cobalamin metabolism and transport
    term:
      id: MONDO:0019220
      label: inborn disorder of cobalamin metabolism and transport
  evidence:
  - reference: PMID:16722557
    reference_title: "Imerslund-Gräsbeck syndrome (selective vitamin B(12) malabsorption with proteinuria)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Imerslund-Gräsbeck syndrome (IGS) or selective vitamin B(12) (cobalamin) malabsorption with proteinuria is a rare autosomal recessive disorder characterized by vitamin B(12) deficiency commonly resulting in megaloblastic anemia, which is responsive to parenteral vitamin B(12) therapy and appears in childhood. Other manifestations include failure to thrive and grow, infections and neurological damage."
    explanation: Highlights the shared clinical triad of childhood megaloblastic anemia, failure to thrive, recurrent infections, and neurological abnormalities, distinguished by parenteral vitamin B12 responsiveness.
- name: Ornithine transcarbamylase deficiency and urea cycle disorders with secondary orotic aciduria
  description: >-
    Ornithine transcarbamylase deficiency (OTCD) and distal urea cycle disorders
    accumulate mitochondrial carbamoyl phosphate that shunts into the cytosolic
    de novo pyrimidine pathway, causing marked secondary urinary orotic acid and
    uracil elevation that must be differentiated from primary UMPS deficiency on
    biochemical and newborn screening.
  distinguishing_features:
  - Presence of hyperammonemia, elevated plasma glutamine, hypocitrullinemia, and acute metabolic encephalopathy in OTCD, whereas plasma ammonia and urea cycle amino acids are normal in hereditary orotic aciduria.
  - Presence of megaloblastic anemia and dyserythropoiesis in hereditary orotic aciduria, which are absent in urea cycle disorders.
  - X-linked inheritance with pathogenic OTC variants in ornithine transcarbamylase deficiency versus autosomal recessive biallelic UMPS variants in hereditary orotic aciduria.
  disease_term:
    preferred_term: Ornithine transcarbamylase deficiency
    term:
      id: MONDO:0010703
      label: ornithine carbamoyltransferase deficiency
  evidence:
  - reference: PMID:32628763
    reference_title: "Urinary Uracil: A Useful Marker for Ornithine Transcarbamylase Deficiency in Affected Males."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The major biochemical hallmarks of OTCD include increased plasma NH3 and glutamine, decreased citrulline and increased urine OA. Increased urine OA distinguishes OTCD from other proximal UCDs such N-acetylglutamate synthase or carbamoyl-phosphate synthetase 1 deficiencies."
    explanation: Documents elevated urinary orotic acid alongside hyperammonemia, elevated glutamine, and low citrulline as the hallmark biochemical profile of OTC deficiency.
  - reference: PMID:32628763
    reference_title: "Urinary Uracil: A Useful Marker for Ornithine Transcarbamylase Deficiency in Affected Males."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Uracil is an endogenously synthesized pyrimidine. Increased UU is characteristic of enzyme deficiencies of pyrimidine metabolism. UU can accumulate in UCDs, due to shunting of carbamoylphosphate to pyrimidine synthesis (Fig. 1)."
    explanation: Explains the biochemical overlap whereby carbamoylphosphate shunting into pyrimidine biosynthesis in urea cycle disorders mimics primary pyrimidine metabolism defects.
- name: Myelodysplastic syndrome
  description: >-
    Severe dyserythropoiesis, erythroid hyperplasia, nuclear-cytoplasmic
    maturational asynchronous changes, and pancytopenia on bone marrow aspirate
    in untreated hereditary orotic aciduria can closely mimic pediatric
    myelodysplastic syndrome (MDS).
  distinguishing_features:
  - Normal bone marrow cytogenetics without clonal chromosomal translocations, rearrangements, gains, or losses in hereditary orotic aciduria.
  - Massive urinary orotic acid excretion and rapid reversal of bone marrow dyserythropoiesis following oral uridine triacetate replacement therapy.
  disease_term:
    preferred_term: Myelodysplastic syndrome
    term:
      id: MONDO:0018881
      label: myelodysplastic syndrome
  evidence:
  - reference: PMID:33489760
    reference_title: "Hereditary orotic aciduria (HOA): A novel uridine-5-monophosphate synthase (UMPS) mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Standard cytogenetics for myelodysplastic syndrome (MDS) came back negative with no evidence of translocations, rearrangements, gains or lossses."
    explanation: Documents that MDS was actively evaluated in the diagnostic workup of HOA-associated dyserythropoiesis and pancytopenia and excluded by cytogenetics.
- name: CAD deficiency (Developmental and epileptic encephalopathy 50)
  description: >-
    Biallelic loss-of-function variants in CAD impair the first three enzymatic
    steps of de novo pyrimidine biosynthesis upstream of UMPS, causing an
    autosomal recessive disorder with infantile refractory epilepsy, global
    developmental delay, intellectual disability, and anemia with abnormal
    erythrocytes (anisopoikilocytosis) that responds dramatically to oral
    uridine supplementation.
  distinguishing_features:
  - Absence of urinary orotic acid elevation in CAD deficiency because the enzymatic block occurs upstream of dihydroorotate and orotate formation, whereas massive orotic aciduria is pathognomonic of UMPS deficiency.
  - Diagnosis of CAD deficiency requires exome/genome sequencing of CAD and functional validation, as routine urinary organic acid screening is unremarkable.
  disease_term:
    preferred_term: CAD deficiency
    term:
      id: MONDO:0014647
      label: developmental and epileptic encephalopathy, 50
  evidence:
  - reference: PMID:34288185
    reference_title: "Deciphering CAD: Structure and function of a mega-enzymatic pyrimidine factory in health and disease."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "This CAD‐deficiency (OMIM #616457), also known as early infantile epileptic encephalopathy‐50 (EIEE‐50) or CAD congenital disorder of glycosylation, typically manifests at an early age as a progressive refractory epilepsy with loss of skills, global developmental delay, intellectual disability and movement disorders, anemia and abnormal red blood cells."
    explanation: Describes the overlapping clinical presentation of anemia, abnormal red blood cells, seizures, and neurodevelopmental impairment in CAD deficiency, another de novo pyrimidine synthesis defect responsive to uridine.
  - reference: PMID:34288185
    reference_title: "Deciphering CAD: Structure and function of a mega-enzymatic pyrimidine factory in health and disease."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "An early treatment can prevent irreversible damage,58 but the diagnosis is difficult since there are no biomarkers for screening and symptoms are easily confused or masked by nutritional factors. So far, all 31 CAD‐deficient patients reported worldwide were diagnosed by exome sequencing and validation of CAD variants."
    explanation: Distinguishes CAD deficiency from UMPS deficiency by the absence of screening biomarkers (such as urinary orotic acid) and reliance on CAD exome sequencing.
treatments:
- name: Uridine triacetate therapy
  description: >-
    Uridine triacetate provides uridine nucleoside replacement to bypass the
    UMPS-dependent UMP synthesis block and can improve hematologic,
    immunologic, growth, seizure, and urinary-orotic-acid abnormalities.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: uridine triacetate
      term:
        id: CHEBI:90914
        label: uridine triacetate
  target_mechanisms:
  - target: UMP Synthetase Enzymatic Block
    treatment_effect: BYPASSES
    description: Uridine supplementation bypasses the endogenous UMPS block by supplying pyrimidine nucleoside.
    evidence:
    - reference: PMID:33489760
      reference_title: "Hereditary orotic aciduria (HOA): A novel uridine-5-monophosphate synthase (UMPS) mutation."
      supports: SUPPORT

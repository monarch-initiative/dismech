progression:
- phase: Neonatal to infantile-onset pyrimidine synthesis disorder
  age_range: Neonatal period through infancy
  notes: >-
    Orphanet records neonatal and infantile onset, with early megaloblastic
    anemia, developmental delay, failure to thrive, and massive urinary orotic
    acid excretion; however, neonates identified by expanded newborn screening
    with elevated dried-blood-spot orotic acid, confirmed urinary orotic
    aciduria, and homozygous UMPS variants can remain asymptomatic.
  evidence:
  - reference: ORPHA:30
    reference_title: "Hereditary orotic aciduria"
    supports: SUPPORT

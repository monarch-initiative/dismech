    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The screen has identified ten Muslim Arab newborns that remain asymptomatic so far, with DBS orotic acid elevated up to 10 times the upper reference limit."
    explanation: Documents that ten newborn-screened individuals with confirmed orotic aciduria and homozygous UMPS variants remained asymptomatic at the time of report.

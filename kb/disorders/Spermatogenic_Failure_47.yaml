name: Spermatogenic Failure 47
creation_date: '2026-10-21T00:00:00Z'
category: Mendelian
synonyms:
- SPGF47
- spermatogenic failure 47
- DZIP1-related asthenoteratozoospermia
- DZIP1-related multiple morphological abnormalities of the sperm flagella
description: 'Spermatogenic failure 47 (SPGF47) is autosomal recessive male infertility caused by biallelic
  DZIP1 variants. DZIP1 (DAZ interacting zinc finger protein 1) is a centrosomal and basal-body protein
  that is needed at the start of cilium assembly. With CBY and FAM92 it forms a complex at the ciliary
  base that docks the basal body to the membrane and begins transition-zone assembly.

  Affected men have asthenoteratozoospermia with a severe form of multiple morphological abnormalities
  of the sperm flagella (MMAF). More than 90% of sperm have no flagellum at all, the rest have short flagella,
  and no sperm are motile. Sperm counts are also reduced. Electron microscopy shows absent or very short
  axonemes, and patient sperm carry abnormal numbers of centrioles. This pattern differs from most MMAF
  genes, where short and coiled flagella with visible but disorganized axonemes predominate. The defect
  is therefore placed at the basal body, before the axoneme grows. A Dzip1 knockout mouse reproduces the
  phenotype. Only two patients, from two consanguineous Han Chinese families, have been reported.'

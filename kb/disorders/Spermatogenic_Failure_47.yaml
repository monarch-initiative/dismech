genetic:
- name: DZIP1
  association: Causal
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: DZIP1
    term:
      id: hgnc:20908
      label: DZIP1
  notes: 'Two homozygous alleles are reported: c.188G>A (p.Arg63Gln), a missense change at a conserved
    residue near the N-terminus, and c.690T>G (p.Tyr230*), a stop-gain at the start of the first coiled-coil
    domain. Both were absent from 1000 Genomes, ExAC, gnomAD and 968 ethnically matched controls. They
    were found in 2 of 65 unrelated Han Chinese men with MMAF (3.1%). No ClinGen gene-disease validity
    classification exists for this pair.'
  evidence:
  - reference: PMID:32051257
    reference_title: Homozygous mutations in DZIP1 can induce asthenoteratospermia with severe MMAF.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The first proband had a homozygous missense mutation c.188G>A (p.Arg63Gln) of DZIP1 and the
      second proband had a homozygous stop-gain mutation c.690T>G (p.Tyr230*).
    explanation: Primary gene-disease report with both causal alleles.
  - reference: PMID:32051257
    reference_title: Homozygous mutations in DZIP1 can induce asthenoteratospermia with severe MMAF.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we identified homozygous DZIP1 mutations in 2 (3.1%) out of 65 unrelated Han Chinese men
      affected with asthenoteratospermia
    explanation: Frequency of DZIP1 cases in the discovery MMAF cohort.

      reference_title: Homozygous mutations in DZIP1 can induce asthenoteratospermia with severe MMAF.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Consequently, the failure of flagellar formation and the disorder of centrioles in spermatozoa
        of DZIP1-mutated individuals were probably due to the centrosomal damage caused by the absence
        of DZIP1.
      explanation: DZIP1 deficiency impairs basal-body/centriolar ciliogenesis and sperm flagellum assembly,
        placing SPGF47 in the ciliopathy mechanistic category.
notes: MONDO cross-references this disease as OMIM 619102. The gene-disease link rests on a single report
  of two probands (PMID:32051257) with knockout mouse support. A PubMed search for DZIP1 with sperm, infertility,
  flagella, mutation or variant (2026-10-21) found no further human SPGF47 reports. The two probands had
  no clinical signs of other ciliopathies, but the authors note that late-onset ciliary disease cannot
  be excluded. Heterozygous DZIP1 missense variants separately cause autosomal dominant nonsyndromic mitral
  valve prolapse through a primary-cilia defect in valve development (PMID:31118289). That is an allelic
  but distinct disease, covered by the Mitral_Valve_Prolapse entry, and is not a feature of SPGF47.

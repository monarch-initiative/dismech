name: Spermatogenic Failure 47
creation_date: "2026-10-21T00:00:00Z"
category: Mendelian
synonyms:
- SPGF47
- spermatogenic failure 47
- DZIP1-related asthenoteratozoospermia
- DZIP1-related multiple morphological abnormalities of the sperm flagella
description: >-
  Spermatogenic failure 47 (SPGF47) is autosomal recessive male infertility
  caused by biallelic DZIP1 variants. DZIP1 (DAZ interacting zinc finger
  protein 1) is a centrosomal and basal-body protein that is needed at the
  start of cilium assembly. With CBY and FAM92 it forms a complex at the
  ciliary base that docks the basal body to the membrane and begins
  transition-zone assembly.

  Affected men have asthenoteratozoospermia with a severe form of multiple
  morphological abnormalities of the sperm flagella (MMAF). More than 90% of
  sperm have no flagellum at all, the rest have short flagella, and no sperm
  are motile. Sperm counts are also reduced. Electron microscopy shows absent
  or very short axonemes, and patient sperm carry abnormal numbers of
  centrioles. This pattern differs from most MMAF genes, where short and
  coiled flagella with visible but disorganized axonemes predominate. The
  defect is therefore placed at the basal body, before the axoneme grows. A
  Dzip1 knockout mouse reproduces the phenotype. Only two patients, from two
  consanguineous Han Chinese families, have been reported.
disease_term:
  preferred_term: spermatogenic failure 47
  term:
    id: MONDO:0030844
    label: spermatogenic failure 47
parents:
- Spermatogenic Failure
- Genetic Disease
notes: >-
  MONDO cross-references this disease as OMIM 619102. The gene-disease link
  rests on a single report of two probands (PMID:32051257) with knockout mouse
  support. A PubMed search for DZIP1 with sperm, infertility, flagella,
  mutation or variant (2026-10-21) found no further human SPGF47 reports. The
  two probands had no clinical signs of other ciliopathies, but the authors
  note that late-onset ciliary disease cannot be excluded. Heterozygous DZIP1
  missense variants separately cause autosomal dominant nonsyndromic mitral
  valve prolapse through a primary-cilia defect in valve development
  (PMID:31118289). That is an allelic but distinct disease, covered by the
  Mitral_Valve_Prolapse entry, and is not a feature of SPGF47.
inheritance:
- name: Autosomal recessive
  description: >-
    Both probands were homozygous, one for a missense and one for a stop-gain
    variant, and both came from consanguineous families. The parents of the
    stop-gain proband were heterozygous carriers. Heterozygous knockout mice
    are fertile.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:32051257
    reference_title: "Homozygous mutations in DZIP1 can induce asthenoteratospermia with severe MMAF."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the other consanguineous family A033, a homozygous stop-gain mutation c.690T>G (p.Tyr230*) of DZIP1 was identified in proband IV-1 and both parents are heterozygous carriers"
    explanation: Homozygosity in a consanguineous proband with heterozygous carrier parents supports recessive inheritance.
  - reference: PMID:32051257
    reference_title: "Homozygous mutations in DZIP1 can induce asthenoteratospermia with severe MMAF."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, no obvious difference of above reproductive phenotypes was observed between the heterozygous mutated (Dzip1+/‒) male mice and the WT male mice"
    explanation: Heterozygous knockout males are normal, consistent with a recessive mechanism.
pathophysiology:
- name: Loss of DZIP1 Protein
  description: >-
    The missense variant p.Arg63Gln lowers DZIP1 levels and the stop-gain
    p.Tyr230* removes the three coiled-coil domains. DZIP1 is undetectable in
    patient sperm, where it normally concentrates in the head and neck, the
    region that holds the sperm centrioles.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DZIP1
    term:
      id: hgnc:20908
      label: DZIP1
  downstream:
  - target: Defective Basal Body Maturation and Membrane Docking
    causal_link_type: DIRECT
    description: >-
      DZIP1 is required at the mother centriole to recruit appendage proteins
      and IFT machinery and to dock the basal body; without it the template
      for the axoneme is not prepared.
    evidence:
    - reference: PMID:23955340
      reference_title: "Centrosomal protein DZIP1 regulates Hedgehog signaling by promoting cytoplasmic retention of transcription factor GLI3 and affecting ciliogenesis."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Functionally, both CEP164 and Ninein appendage proteins fail to localize to ciliary appendages in Dzip1 mutant cells; IFT components are not recruited to the basal body of cilia."
      explanation: >-
        Shown in mouse embryonic fibroblasts for primary cilia, not in sperm,
        so it supports the step by inference from another ciliated cell type.
    - reference: PMID:31821146
      reference_title: "Dzip1 and Fam92 form a ciliary transition zone complex with cell type specific roles in Drosophila."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "While it is required for TZ assembly in all Drosophila ciliated cells, it also regulates basal-body growth and docking to the plasma membrane during spermatogenesis."
      explanation: In Drosophila male germ cells Dzip1 controls basal-body growth and membrane docking, the step proposed to fail in SPGF47.
  evidence:
  - reference: PMID:32051257
    reference_title: "Homozygous mutations in DZIP1 can induce asthenoteratospermia with severe MMAF."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the expression level of DZIP1 was obviously reduced for the p.Arg63Gln mutation, and DZIP1 was truncated for the p.Tyr230* mutation"
    explanation: Transfected HEK293T cells show reduced or truncated DZIP1 for the two patient alleles.
  - reference: PMID:32051257
    reference_title: "Homozygous mutations in DZIP1 can induce asthenoteratospermia with severe MMAF."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the fertile control, DZIP1 immunostaining (red) was concentrated in sperm head and sperm neck. However, DZIP1 immunostaining was absent in the spermatozoa from DZIP1-mutated men."
    explanation: DZIP1 protein is absent from patient sperm.
- name: Defective Basal Body Maturation and Membrane Docking
  description: >-
    The sperm flagellum grows from the distal centriole, which must mature
    into a basal body and dock at the membrane. Patient sperm have abnormal
    centriole numbers and orientation (no centrin dot, or more than two), and
    IFT88 and IFT140 are mislocalized to the head and neck and absent from the
    tail. The authors attribute both the flagellar failure and the centriole
    disorder to centrosomal damage from DZIP1 loss.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Spermatid
    term:
      id: CL:0000018
      label: spermatid
  cellular_components:
  - preferred_term: Centriole
    term:
      id: GO:0005814
      label: centriole
  - preferred_term: Ciliary basal body
    term:
      id: GO:0036064
      label: ciliary basal body
  biological_processes:
  - preferred_term: Intraciliary transport
    modifier: DECREASED
    term:
      id: GO:0042073
      label: intraciliary transport
  downstream:
  - target: Arrest of Sperm Axoneme Outgrowth
    causal_link_type: DIRECT
    description: Without a mature, docked basal body the axoneme does not grow.
    evidence:
    - reference: PMID:32051257
      reference_title: "Homozygous mutations in DZIP1 can induce asthenoteratospermia with severe MMAF."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Consequently, the failure of flagellar formation and the disorder of centrioles in spermatozoa of DZIP1-mutated individuals were probably due to the centrosomal damage caused by the absence of DZIP1."
      explanation: The authors' interpretation linking the centrosomal defect to failed flagellar formation.
  evidence:
  - reference: PMID:32051257
    reference_title: "Homozygous mutations in DZIP1 can induce asthenoteratospermia with severe MMAF."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More than half of spermatozoa had abnormal numbers of centrioles in subject A033 IV-1 with DZIP1 deficiency, which was a significant increase when compared with that in the control."
    explanation: Centrin1 staining shows centriole number defects in patient sperm. Only the stop-gain proband was assessed.
  - reference: PMID:32051257
    reference_title: "Homozygous mutations in DZIP1 can induce asthenoteratospermia with severe MMAF."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The immunostaining of IFT88 and IFT140 was weak or misplaced in sperm head, and absent in sperm tail."
    explanation: IFT proteins are not delivered into the flagellum in patient sperm.
- name: Arrest of Sperm Axoneme Outgrowth
  description: >-
    The axoneme is absent or very short, so most sperm have no flagellum.
    Cross-sections of the axoneme could hardly be obtained, unlike other MMAF
    genes where the axoneme forms but is disorganized.

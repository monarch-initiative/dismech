pathophysiology:
- name: Loss of DZIP1 Protein
  description: 'The missense variant p.Arg63Gln lowers DZIP1 levels and the stop-gain p.Tyr230* removes
    the three coiled-coil domains. DZIP1 is undetectable in patient sperm, where it normally concentrates
    in the head and neck, the region that holds the sperm centrioles. DZIP1 is an adaptor at the mother
    centriole: it binds the appendage protein CEP164 and the IFT component IFT88, and it assembles the
    BBSome-DZIP1-PCM1 complex at centriolar satellites.'

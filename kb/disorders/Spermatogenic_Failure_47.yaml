- name: Defective Basal Body Maturation and Membrane Docking
  description: The sperm flagellum grows from the distal centriole, which must mature into a basal body
    and dock at the membrane. Patient sperm have abnormal centriole numbers and orientation (no centrin
    dot, or more than two), and IFT88 and IFT140 are mislocalized to the head and neck and absent from
    the tail. The authors attribute both the flagellar failure and the centriole disorder to centrosomal
    damage from DZIP1 loss.

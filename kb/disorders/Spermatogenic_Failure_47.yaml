genetic:
- name: DZIP1
  association: Causal
  gene_term:
    preferred_term: DZIP1
    term:
      id: hgnc:20908
      label: DZIP1
  notes: >-
    Two homozygous alleles are reported: c.188G>A (p.Arg63Gln), a missense
    change at a conserved residue near the N-terminus, and c.690T>G
    (p.Tyr230*), a stop-gain at the start of the first coiled-coil domain. Both
    were absent from 1000 Genomes, ExAC, gnomAD and 968 ethnically matched
    controls. They were found in 2 of 65 unrelated Han Chinese men with MMAF
    (3.1%). No ClinGen gene-disease validity classification exists for this
    pair.
  evidence:
  - reference: PMID:32051257
    reference_title: "Homozygous mutations in DZIP1 can induce asthenoteratospermia with severe MMAF."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first proband had a homozygous missense mutation c.188G>A (p.Arg63Gln) of DZIP1 and the second proband had a homozygous stop-gain mutation c.690T>G (p.Tyr230*)."
    explanation: Primary gene-disease report with both causal alleles.
  - reference: PMID:32051257
    reference_title: "Homozygous mutations in DZIP1 can induce asthenoteratospermia with severe MMAF."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified homozygous DZIP1 mutations in 2 (3.1%) out of 65 unrelated Han Chinese men affected with asthenoteratospermia"
    explanation: Frequency of DZIP1 cases in the discovery MMAF cohort.
animal_models:
- name: Dzip1 knockout mouse
  species: Mouse
  genotype: Dzip1 c.102_132del (p.Ala35Serfs*13), homozygous
  publication: PMID:32051257
  description: >-
    A CRISPR frameshift in exon 2 removes DZIP1 protein from the testis.
    Homozygous males are infertile, with very few epididymal sperm, no
    motile sperm, and mostly absent flagella. DZIP1 is normally expressed in
    germ cells, especially elongated spermatids.
  modeled_mechanisms:
  - target: Arrest of Sperm Axoneme Outgrowth
    relationship: RECAPITULATES
    fidelity: HIGH
    description: The knockout reproduces the predominantly flagellum-less sperm seen in patients.
    evidence:
    - reference: PMID:32051257
      reference_title: "Homozygous mutations in DZIP1 can induce asthenoteratospermia with severe MMAF."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Very few epididymal spermatozoa were observed under light microscope after concentration, presenting severe morphological abnormalities mainly with absent flagella"
      explanation: Mouse sperm show the same absent-flagellum phenotype.
  - target: Oligozoospermia
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Sperm number falls in both species, but more steeply in the mouse.
    limitations: >-
      Only very few sperm can be recovered from knockout epididymides, while
      patients still have about 1-21 million sperm per ejaculate. The mouse
      spermatogenic defect is more severe than in the two reported men. Mouse
      sperm also show residual cytoplasm and abnormal heads, which were not
      described in patients.
    evidence:
    - reference: PMID:32051257
      reference_title: "Homozygous mutations in DZIP1 can induce asthenoteratospermia with severe MMAF."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Few spermatozoa from epididymides of the Dzip1‒/‒ male mice were collected"
      explanation: Severe reduction of sperm number in the knockout.
discussions:
- discussion_id: dzip1_centriole_post_fertilization
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Defective Basal Body Maturation and Membrane Docking
  prompt: >-
    Can ICSI give normal embryo development with DZIP1-deficient sperm, given
    that the sperm centrioles are also abnormal?
  rationale: >-
    ICSI bypasses the flagellar defect in most MMAF genotypes. In SPGF47 the
    sperm centrioles are also abnormal in number and orientation, and the
    sperm-derived centrioles organize the zygote's first mitotic spindle. The
    authors raise the possibility that this affects fertilization and
    cleavage. No ICSI outcome has been reported for a DZIP1 patient, so the
    entry records no treatment.
  evidence:
  - reference: PMID:32051257
    reference_title: "Homozygous mutations in DZIP1 can induce asthenoteratospermia with severe MMAF."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, the abnormality of sperm centrioles caused by deficiency of DZIP1 may have important influence on subsequent fertilisation and cleavage."
    explanation: The source paper states the open question.

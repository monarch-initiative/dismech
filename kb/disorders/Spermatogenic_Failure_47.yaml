discussions:
- discussion_id: dzip1_centriole_post_fertilization
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Defective Basal Body Maturation and Membrane Docking
  prompt: Can ICSI give normal embryo development with DZIP1-deficient sperm, given that the sperm centrioles
    are also abnormal?
  rationale: ICSI bypasses the flagellar defect in most MMAF genotypes. In SPGF47 the sperm centrioles
    are also abnormal in number and orientation, and the sperm-derived centrioles organize the zygote's
    first mitotic spindle. The authors raise the possibility that this affects fertilization and cleavage.
    No ICSI outcome has been reported for a DZIP1 patient, so the entry records no treatment.
  evidence:
  - reference: PMID:32051257
    reference_title: Homozygous mutations in DZIP1 can induce asthenoteratospermia with severe MMAF.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Therefore, the abnormality of sperm centrioles caused by deficiency of DZIP1 may have important
      influence on subsequent fertilisation and cleavage.
    explanation: The source paper states the open question.

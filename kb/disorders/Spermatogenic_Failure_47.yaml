  genotype: Dzip1 c.102_132del (p.Ala35Serfs*13), homozygous
  publication: PMID:32051257
  description: A CRISPR frameshift in exon 2 removes DZIP1 protein from the testis. Homozygous males are
    infertile, with very few epididymal sperm, no motile sperm, and mostly absent flagella. DZIP1 is normally
    expressed in germ cells, especially elongated spermatids.
  modeled_mechanisms:
  - target: Arrest of Sperm Axoneme Outgrowth

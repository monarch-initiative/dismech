name: Typhoidal Tularemia
creation_date: "2026-09-25T16:02:46Z"
category: Infectious Disease
description: >-
  Typhoidal tularemia is the systemic bacteremic form of Francisella tularensis
  infection: intracellular bacterial replication in macrophages occurs without a
  dominant primary cutaneous, ocular, pharyngeal, or pulmonary localizing
  lesion, and systemic inflammatory spread produces fever, chills, malaise,
  myalgia, and severe sepsis-like illness.
disease_term:
  preferred_term: typhoidal tularemia
  term:
    id: MONDO:0000321
    label: typhoidal tularemia
parents:
- Tularemia
synonyms:
- Septicemic tularemia
- Systemic tularemia
review_notes: >-
  Deliberately lumped. Typhoidal tularemia is the systemic clinical form of
  tularemia rather than a subspecies stratum: F. tularensis subsp. tularensis and
  F. tularensis subsp. holarctica differ in geography and severity across
  tularemia, but the typhoidal form can arise after several entry routes and is
  not restricted to either subspecies. Type-specific severity and reservoir
  claims therefore remain on the parent Tularemia entry unless a source
  distinguishes a typhoidal-specific type A or type B mechanism.
infectious_agent:
- name: Francisella tularensis
  infectious_agent_term:
    preferred_term: Francisella tularensis
    term:
      id: NCBITaxon:263
      label: Francisella tularensis
  description: >-
    Intracellular Gram-negative coccobacillus that causes tularemia, including its
    typhoidal bacteremic form.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tularemia caused by Gram-negative, coccobacillus bacterium, Francisella
      tularensis, is a highly infectious zoonotic disease.
    explanation: >-
      Identifies F. tularensis as the Gram-negative bacterium that causes tularemia.
agent_life_cycle:
  description: >-
    F. tularensis is maintained in animal reservoirs and transmitted by direct
    animal contact, water or food contamination, aerosols, and arthropod vectors.
    Type A tularemia is classically terrestrial, with cottontail rabbits and
    ticks as important reservoirs or vectors; type B tularemia often has
    water-associated aquatic rodent reservoirs. Humans are accidental clinical
    hosts for zoonotic or environmental exposure.
  hosts:
  - preferred_term: Homo sapiens
    role: accidental clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: Sylvilagus
    role: cottontail rabbit reservoir in the terrestrial type A cycle
    term:
      id: NCBITaxon:9987
      label: Sylvilagus
  - preferred_term: Ondatra zibethicus
    role: muskrat reservoir in aquatic type B cycles
    term:
      id: NCBITaxon:10060
      label: Ondatra zibethicus
  - preferred_term: Castor canadensis
    role: beaver reservoir in aquatic type B cycles
    term:
      id: NCBITaxon:51338
      label: Castor canadensis
  vectors:
  - Ticks
  - Mosquitoes
  life_cycle_stages:
  - name: Wildlife reservoir maintenance
    description: >-
      Francisella circulates in terrestrial and aquatic animal cycles involving
      lagomorph and aquatic-rodent reservoirs.
    evidence:
    - reference: PMID:1305858
      reference_title: "The ecology of tularaemia."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Type A is reported to have a terrestrial cycle with the main reservoirs
        being cottontail rabbits (Sylvilagus spp.) and ticks. Type B is reported
        to have a mainly water-borne cycle with aquatic rodents as reservoirs,
        e.g. muskrats (Ondatra zibethicus) and beaver (Castor canadensis) in
        North America
      explanation: >-
        Identifies the terrestrial and water-associated wildlife reservoirs that
        maintain the two major tularemia types.
  - name: Human zoonotic and vector-borne acquisition
    description: >-
      Humans acquire F. tularensis from infected animals, contaminated food or
      water, contaminated aerosols, or arthropod vectors such as ticks and
      mosquitoes.
    evidence:
    - reference: PMID:1305858
      reference_title: "The ecology of tularaemia."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Tularaemia is transmitted by direct contact with infected animals,
        through contaminated water or food, or by vectors such as mosquitoes or
        ticks.
      explanation: >-
        Summarizes animal-contact, water or food, and vector routes by which
        humans leave the reservoir cycles and acquire tularemia.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:37916743
      reference_title: "Tularemia - a re-emerging disease with growing concern."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Tularemia caused by Gram-negative, coccobacillus bacterium, Francisella
        tularensis, is a highly infectious zoonotic disease.
      explanation: >-
        Typhoidal tularemia is a bacterial infectious form of tularemia.
pathophysiology:
- name: Systemic Francisella tularensis Inoculation
  description: >-
    F. tularensis enters the host through a zoonotic, arthropod-borne,
    foodborne, waterborne, or aerosol-associated exposure that does not produce
    a dominant primary ulceroglandular, ocular, pharyngeal, or pneumonic lesion.
  biological_scale: ORGANISM
  downstream:
  - target: Macrophage Phagosomal Escape and Cytosolic Replication
    causal_link_type: DIRECT
    description: >-
      F. tularensis enters macrophages and establishes an intracellular cytosolic
      niche after host entry.
  evidence:
  - reference: PMID:37941380
    reference_title: "Pathogenicity and virulence of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Depending on its entry route into the organism, F. tularensis causes different
      diseases
    explanation: >-
      Establishes entry route as a determinant of tularemia clinical form.
  - reference: PMID:40107886
    reference_title: "Tularemia for clinicians: An up-to-date review on epidemiology, diagnosis, prevention and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the multiple routes of infection result in six typical clinical pictures
      (ulceroglandular, glandular, oculoglandular, oropharyngeal, typhoidal, and
      pneumonic)
    explanation: >-
      Places typhoidal tularemia among the canonical clinical pictures that can
      arise after different Francisella acquisition routes.
  - reference: PMID:41458397
    reference_title: "Typhoidal tularemia with pancytopenia and pericarditis in a georgian adolescent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The typhoidal form is especially challenging to diagnose due to the absence
      of localized lesions, often mimicking other systemic febrile illnesses such
      as brucellosis, typhoid fever, or hematologic disorders.
    explanation: >-
      Supports absence of a dominant localized lesion as a feature of the
      typhoidal form.
- name: Macrophage Phagosomal Escape and Cytosolic Replication
  description: >-
    F. tularensis uses its Francisella Pathogenicity Island-encoded type VI
    secretion system to escape the macrophage phagosome and replicate in the
    cytosol.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: symbiont-mediated suppression of host phagosome maturation
    term:
      id: GO:0141158
      label: symbiont-mediated suppression of host phagosome maturation
  downstream:
  - target: AIM2 Inflammasome Host Response
    causal_link_type: DIRECT
    description: >-
      Cytosolic Francisella DNA activates the AIM2-ASC-caspase-1 inflammasome
      response.
  - target: Cell-Penetrant Antimicrobial Requirement
    causal_link_type: DIRECT
    description: >-
      Once Francisella replicates inside the macrophage cytosol, therapy with
      doxycycline or fluoroquinolones depends on host-cell penetration as well as
      on the bacterial molecular target.
  - target: Reticuloendothelial Dissemination and Cytopenic Organ Disease
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Intracellular replication seeds bacteremic dissemination to marrow and
      visceral compartments in systemic disease.
  evidence:
  - reference: PMID:37941380
    reference_title: "Pathogenicity and virulence of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The main virulence attribute of F. tularensis is the type 6 secretion system
      (T6SS) and its effectors that promote escape from the phagosome.
    explanation: >-
      Identifies the T6SS-mediated phagosomal escape machinery that permits
      Francisella intracellular replication.
- name: AIM2 Inflammasome Host Response
  description: >-
    Cytosolic Francisella DNA is sensed by AIM2, which assembles an ASC- and
    caspase-1-dependent inflammasome that matures IL-1 beta and IL-18 and drives
    pyroptotic inflammatory signaling.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: inflammasome-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0141084
      label: inflammasome-mediated signaling pathway
  downstream:
  - target: Bacteremic Systemic Inflammation
    causal_link_type: DIRECT
    description: >-
      AIM2-dependent caspase-1 activation converts cytosolic Francisella sensing
      into IL-1 beta and IL-18 release and inflammatory cell death.
  evidence:
  - reference: PMID:25774716
    reference_title: "Guanylate-binding proteins promote activation of the AIM2 inflammasome during infection with Francisella novicida."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The AIM2 inflammasome detects double-stranded DNA in the cytosol and
      induces caspase-1-dependent pyroptosis as well as release of the
      inflammatory cytokines interleukin 1beta (IL-1beta) and IL-18.
    explanation: >-
      Defines the AIM2 inflammasome response that converts cytosolic Francisella
      DNA detection into pyroptosis and inflammatory cytokine release.
  - reference: PMID:23975862
    reference_title: "ASC controls IFN-γ levels in an IL-18-dependent manner in caspase-1-deficient mice infected with Francisella novicida."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      During F. tularensis subspecies novicida infection, AIM2, an inflammasome
      receptor sensing cytosolic DNA, activates caspase-1 in an ASC-dependent
      manner, leading to both pyroptosis and release of the proinflammatory
      cytokines IL-1beta and IL-18.
    explanation: >-
      Places AIM2 and ASC-dependent caspase-1 activation downstream of cytosolic
      Francisella infection.
- name: Reticuloendothelial Dissemination and Cytopenic Organ Disease
  description: >-
    Systemic typhoidal infection can involve marrow and visceral organs after
    bacteremic dissemination, producing hematologic abnormalities such as
    pancytopenia as well as hepatosplenic and granulomatous hepatic involvement
    during atypical systemic presentations.
  biological_scale: ORGANISM
  downstream:
  - target: Pancytopenia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Systemic marrow and reticuloendothelial involvement can suppress multiple
      peripheral blood-cell lineages.
  - target: Hepatosplenomegaly
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reticuloendothelial involvement in systemic tularemia can enlarge both the
      liver and spleen.
  - target: Elevated hepatic transaminases
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Hepatic granulomatous or suppurative involvement can produce hepatocyte
      injury and circulating transaminase elevation.
  - target: Granulomatous Tularemic Tissue Inflammation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Disseminated F. tularensis can seed affected organs, where the host
      response forms granulomatous and suppurative tularemic lesions.
  evidence:
  - reference: PMID:41458397
    reference_title: "Typhoidal tularemia with pancytopenia and pericarditis in a georgian adolescent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient presented with a two-week history of high-grade fever, severe
      malaise, anorexia, and laboratory evidence of pancytopenia with
      hypoglycemia.
    explanation: >-
      Documents pancytopenia in a serologically confirmed typhoidal tularemia
      patient after an undifferentiated systemic febrile presentation.
  - reference: PMID:41458397
    reference_title: "Typhoidal tularemia with pancytopenia and pericarditis in a georgian adolescent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On physical examination, mild hepatosplenomegaly was noted, although no
      skin lesions or ulcers were observed.
    explanation: >-
      Documents hepatosplenomegaly in a typhoidal tularemia patient who lacked
      skin ulcers or other localized entry-site lesions.
  - reference: PMID:31937491
    reference_title: "A rare cause of granulomatous hepatitis: Tularemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with hepatic involvement typically have elevated transaminase
      levels, hepatomegaly and rarely jaundice.
    explanation: >-
      Supports elevated hepatic transaminases as a laboratory manifestation of
      hepatic involvement in systemic typhoidal tularemia.
- name: Granulomatous Tularemic Tissue Inflammation
  description: >-
    Tularemia can produce suppurative and granulomatous lesions in involved
    lymph nodes and organs; in systemic or pulmonary presentations, tissue
    biopsies can show granulomatous hepatitis or necrotizing granulomatous
    inflammation that clinically and radiographically mimics malignancy.
  biological_scale: TISSUE
  role: effector
  conforms_to: "granuloma_formation#Organized Granuloma Assembly"
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: granuloma formation
    term:
      id: GO:0002432
      label: granuloma formation
  downstream:
  - target: Elevated hepatic transaminases
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Granulomatous hepatic involvement can injure hepatocytes and elevate
      circulating hepatic transaminases.
  evidence:
  - reference: PMID:31937491
    reference_title: "A rare cause of granulomatous hepatitis: Tularemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tularemia may develop granulomatous and suppurative lesions, especially in
      the affected regional lymph nodes and various organs.
    explanation: >-
      Supports granulomatous and suppurative lesions in involved tissues as part
      of the tularemic tissue response.
  - reference: PMID:41482246
    reference_title: "Pulmonary tularemia: A diagnosis not to overlook."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CTguided biopsies performed in two patients revealed a non-specific
      necrotizing granulomatous inflammation.
    explanation: >-
      Documents necrotizing granulomatous inflammation in pulmonary tularemia
      tissue biopsies; the directness is indirect because the cohort concerns
      pulmonary rather than primary typhoidal tularemia, but it confirms the same
      F. tularensis granulomatous tissue signature.
- name: Bacteremic Systemic Inflammation
  description: >-
    Cytosolic Francisella infection is sensed by inflammasome pathways and, in the
    typhoidal form, presents as bacteremia and a systemic inflammatory syndrome
    without a defining regional bubo, skin ulcer, conjunctivitis, or pneumonia.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: inflammasome-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0141084
      label: inflammasome-mediated signaling pathway
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Systemic inflammatory signaling produces fever.
  - target: Chills
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Systemic inflammatory signaling produces chills.
  - target: Myalgia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Systemic infection produces diffuse muscle pain.
  - target: Headache
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Acute systemic tularemia commonly includes headache as part of the flu-like
      inflammatory symptom complex.
  - target: Sepsis
    causal_link_type: DIRECT
    description: >-
      Bacteremic Francisella infection can manifest as severe sepsis-like systemic
      disease.
  - target: Pericarditis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Severe systemic typhoidal tularemia can be complicated by cardiovascular
      inflammation, including pericarditis.
  - target: Pneumonia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Systemic tularemia can be complicated by secondary pleuropneumonia even
      when the primary portal is non-pneumonic.
  evidence:
  - reference: PMID:19863554
    reference_title: "Cell biology and molecular ecology of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      activation of the inflammasome mediated by caspase-1, and a pro-inflammatory
      response
    explanation: >-
      Supports inflammasome activation and pro-inflammatory signaling downstream of
      cytosolic Francisella infection.
  - reference: PMID:41458397
    reference_title: "Typhoidal tularemia with pancytopenia and pericarditis in a georgian adolescent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early recognition is critical, as delayed treatment can result in severe
      complications, including multiorgan involvement, cardiovascular
      manifestations, and hematologic abnormalities.
    explanation: >-
      Supports multisystem complications after delayed recognition of systemic
      typhoidal tularemia, including cardiovascular manifestations.
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In humans, besides the clinical forms that are well characterized,
      tularemia may also be responsible for causing secondary pleuropneumonia,
      meningitis, and sepsis ultimately leading to shock and subsequent death
    explanation: >-
      Supports secondary pleuropneumonia and severe sepsis as complications of
      systemic tularemia beyond the portal-specific primary clinical forms.
- name: Francisella Ribosomal Translation
  description: >-
    F. tularensis depends on the bacterial 70S ribosome for protein synthesis;
    aminoglycosides such as gentamicin and tetracyclines such as doxycycline act
    on this conserved bacterial ribosomal target rather than on the macrophage
    escape machinery itself.
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
  downstream:
  - target: Macrophage Phagosomal Escape and Cytosolic Replication
    causal_link_type: DIRECT
    description: >-
      Active bacterial translation sustains cytosolic Francisella replication in
      infected macrophages.
  evidence:
  - reference: PMID:24336183
    reference_title: "Ribosome-targeting antibiotics and mechanisms of bacterial resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Establishes the bacterial ribosome as the conserved target of
      aminoglycosides and tetracyclines used to treat tularemia.
- name: Francisella DNA Gyrase and Topoisomerase IV
  description: >-
    F. tularensis requires bacterial type II topoisomerases to manage DNA
    supercoiling and chromosome segregation; ciprofloxacin and levofloxacin act
    by trapping gyrase/topoisomerase-DNA cleavage complexes at this
    fluoroquinolone target.
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: "bacterial_dna_topoisomerase_inhibition#DNA Gyrase and Topoisomerase IV (Fluoroquinolone Target)"
  biological_processes:
  - preferred_term: DNA topological change
    term:
      id: GO:0006265
      label: DNA topological change
  downstream:
  - target: Macrophage Phagosomal Escape and Cytosolic Replication
    causal_link_type: DIRECT
    description: >-
      Francisella type II topoisomerase activity sustains bacterial DNA
      replication during cytosolic growth.
  evidence:
  - reference: PMID:27449972
    reference_title: "Topoisomerase Inhibitors: Fluoroquinolone Mechanisms of Action and Resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Quinolones dually target DNA gyrase and topoisomerase IV binding to
      specific domains and conformations so as to block DNA strand passage
      catalysis and stabilize DNA-enzyme complexes that block the DNA
      replication apparatus and generate double breaks in DNA that underlie
      their bactericidal activity.
    explanation: >-
      Establishes bacterial DNA gyrase and topoisomerase IV as the conserved
      fluoroquinolone target represented by this node.
- name: Cell-Penetrant Antimicrobial Requirement
  description: >-
    Because F. tularensis replicates in the host-cell cytosol, orally used
    doxycycline and fluoroquinolones must accumulate intracellularly to reach the
    organism. This pharmacokinetic gate is modeled separately from their
    ribosomal or topoisomerase molecular targets and is not asserted for
    gentamicin, a poorly cell-penetrant aminoglycoside that is nevertheless
    first-line for severe tularemia.
  biological_scale: CELLULAR
  role: therapeutic_vulnerability
  conforms_to: "intracellular_pathogen_persistence#Requirement for Cell-Penetrant Antimicrobials"
  biological_processes:
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:28639230
    reference_title: "Intracellular Pharmacokinetics of Antibacterials and Their Clinical Implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therapeutic efficacy against intracellular pathogens has been correlated
      mainly with the intracellular concentrations achieved by the different
      antimicrobial agents.
    explanation: >-
      Establishes intracellular antibiotic concentration as the pharmacokinetic
      gate for therapy of intracellular bacterial infections.
  - reference: PMID:37941380
    reference_title: "Pathogenicity and virulence of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The main virulence attribute of F. tularensis is the type 6 secretion system
      (T6SS) and its effectors that promote escape from the phagosome.
    explanation: >-
      Identifies the host-cell cytosolic niche that makes intracellular drug
      penetration relevant for Francisella-active doxycycline and
      fluoroquinolones.

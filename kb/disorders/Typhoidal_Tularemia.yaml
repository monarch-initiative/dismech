treatments:
- name: Antibiotic therapy
  description: >-
    Aminoglycosides, fluoroquinolones, and tetracyclines are active treatment
    classes for tularemia across clinical manifestations.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:38294108
    reference_title: "Systematic Review: Clinical Features, Antimicrobial Treatment, and Outcomes of Human Tularemia, 1993-2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aminoglycosides, fluoroquinolones, and tetracyclines are effective
      antimicrobials for treatment of tularemia, regardless of clinical manifestation.
    explanation: >-
      Systematic review of case-level human tularemia data identifies several
      effective antibiotic classes across manifestations.

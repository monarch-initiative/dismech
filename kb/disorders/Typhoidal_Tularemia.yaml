name: Typhoidal Tularemia
creation_date: "2026-09-25T16:02:46Z"
category: Infectious Disease
description: >-
  Typhoidal tularemia is the systemic bacteremic form of Francisella tularensis
  infection: intracellular bacterial replication in macrophages occurs without a
  dominant cutaneous, ocular, pharyngeal, or pulmonary localizing lesion, and
  systemic inflammatory spread produces fever, chills, malaise, myalgia, and
  severe sepsis-like illness.
disease_term:
  preferred_term: typhoidal tularemia
  term:
    id: MONDO:0000321
    label: typhoidal tularemia
parents:
- Tularemia
infectious_agent:
- name: Francisella tularensis
  infectious_agent_term:
    preferred_term: Francisella tularensis
    term:
      id: NCBITaxon:263
      label: Francisella tularensis
  description: >-
    Intracellular Gram-negative coccobacillus that causes tularemia, including its
    typhoidal bacteremic form.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Tularemia caused by Gram-negative, coccobacillus bacterium, Francisella
      tularensis, is a highly infectious zoonotic disease.
    explanation: >-
      Identifies F. tularensis as the Gram-negative bacterium that causes tularemia.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:37916743
      reference_title: "Tularemia - a re-emerging disease with growing concern."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Tularemia caused by Gram-negative, coccobacillus bacterium, Francisella
        tularensis, is a highly infectious zoonotic disease.
      explanation: >-
        Typhoidal tularemia is a bacterial infectious form of tularemia.
pathophysiology:
- name: Systemic Francisella tularensis Inoculation
  description: >-
    F. tularensis enters the host through a zoonotic, arthropod-borne,
    or aerosol-associated exposure that does not produce a dominant localizing
    ulceroglandular, ocular, or pharyngeal lesion.
  biological_scale: ORGANISM
  downstream:
  - target: Macrophage Phagosomal Escape and Cytosolic Replication
    causal_link_type: DIRECT
    description: >-
      F. tularensis enters macrophages and establishes an intracellular cytosolic
      niche after host entry.
  evidence:
  - reference: PMID:37941380
    reference_title: "Pathogenicity and virulence of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Depending on its entry route into the organism, F. tularensis causes different
      diseases
    explanation: >-
      Establishes entry route as a determinant of tularemia clinical form.
- name: Macrophage Phagosomal Escape and Cytosolic Replication
  description: >-
    F. tularensis uses its Francisella Pathogenicity Island-encoded type VI
    secretion system to escape the macrophage phagosome and replicate in the
    cytosol.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: symbiont-mediated suppression of host phagosome maturation
    term:
      id: GO:0141158
      label: symbiont-mediated suppression of host phagosome maturation
  downstream:
  - target: Bacteremic Systemic Inflammation
    causal_link_type: DIRECT
    description: >-
      Intracellular Francisella replication seeds systemic infection and innate
      inflammatory activation.
  evidence:
  - reference: PMID:37941380
    reference_title: "Pathogenicity and virulence of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The main virulence attribute of F. tularensis is the type 6 secretion system
      (T6SS) and its effectors that promote escape from the phagosome.
    explanation: >-
      Identifies the T6SS-mediated phagosomal escape machinery that permits
      Francisella intracellular replication.
- name: Bacteremic Systemic Inflammation
  description: >-
    Cytosolic Francisella infection is sensed by inflammasome pathways and, in the
    typhoidal form, presents as bacteremia and a systemic inflammatory syndrome
    without a defining regional bubo, skin ulcer, conjunctivitis, or pneumonia.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: inflammasome-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0141084
      label: inflammasome-mediated signaling pathway
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Systemic inflammatory signaling produces fever.
  - target: Chills
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Systemic inflammatory signaling produces chills.
  - target: Myalgia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Systemic infection produces diffuse muscle pain.
  - target: Sepsis
    causal_link_type: DIRECT
    description: >-
      Bacteremic Francisella infection can manifest as severe sepsis-like systemic
      disease.
  evidence:
  - reference: PMID:19863554
    reference_title: "Cell biology and molecular ecology of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      activation of the inflammasome mediated by caspase-1, and a pro-inflammatory
      response
    explanation: >-
      Supports inflammasome activation and pro-inflammatory signaling downstream of
      cytosolic Francisella infection.

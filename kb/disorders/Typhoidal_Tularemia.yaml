transmission:
- name: Arthropod-borne acquisition
  description: >-
    Typhoidal tularemia can follow vector-borne F. tularensis inoculation by
    infected arthropods, including ticks and mosquitoes.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Typhoidal form may occur after infection via different routes.
    explanation: >-
      Supports the typhoidal form as a systemic form that can arise after
      several Francisella entry routes.
- name: Direct animal or infected-meat exposure
  description: >-
    Handling sick animals or consuming infected animals can introduce F.
    tularensis without a single obligatory local portal lesion in typhoidal
    presentations.
  evidence:
  - reference: PMID:32989563
    reference_title: "Tularemia: a re-emerging tick-borne infectious disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Humans can acquire the disease through direct contact of sick animals,
      consumption of infected animals, drinking or direct contact of contaminated
      water, and inhalation of bacteria-loaded aerosols.
    explanation: >-
      Enumerates direct animal contact and consumption of infected animals among
      routes that can transmit F. tularensis to humans.
- name: Foodborne or waterborne acquisition
  description: >-
    Contaminated food or water can transmit F. tularensis to humans and can
    seed systemic typhoidal disease rather than an isolated ulceroglandular or
    ocular syndrome.
  evidence:
  - reference: PMID:32989563
    reference_title: "Tularemia: a re-emerging tick-borne infectious disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Humans can acquire the disease through direct contact of sick animals,
      consumption of infected animals, drinking or direct contact of contaminated
      water, and inhalation of bacteria-loaded aerosols.
    explanation: >-
      Lists infected food animals and contaminated water as Francisella
      acquisition routes.
- name: Aerosol inhalation
  description: >-
    Inhalation of bacteria-loaded aerosols can transmit F. tularensis and expose
    the host to a low-dose airborne route relevant to systemic and pneumonic
    tularemia.
  evidence:
  - reference: PMID:32989563
    reference_title: "Tularemia: a re-emerging tick-borne infectious disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Humans can acquire the disease through direct contact of sick animals,
      consumption of infected animals, drinking or direct contact of contaminated
      water, and inhalation of bacteria-loaded aerosols.
    explanation: >-
      Identifies inhalation of bacteria-loaded aerosols as a human tularemia
      acquisition route.
prevalence:
- population: Norway reported tularemia cases, 2011
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Typhoidal tularemia accounted for 14.4% of 180 Norwegian tularemia cases
    during a high-incidence year with diverse seasonal clinical presentations.
  evidence:
  - reference: PMID:24874046
    reference_title: "All-time high tularaemia incidence in Norway in 2011: report from the national surveillance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, oropharyngeal tularaemia (41.1 %) was the most common clinical
      presentation, followed by glandular (14.4 %), typhoidal (14.4 %),
      respiratory (13.3 %) and ulceroglandular (12.8 %) tularaemia.
    explanation: >-
      Quantifies the typhoidal form among reported Norwegian tularemia cases in
      2011.
progression:
- phase: Incubation after Francisella tularensis exposure
  incubation_days: 3-5
  notes: >-
    Tularemia usually incubates for 3 to 5 days, although incubation can extend
    up to 20 days.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The incubation period is typically 3 to 5 days but can be up to 20 days.
    explanation: >-
      Supports the typical incubation interval after F. tularensis exposure.
- phase: Acute systemic illness
  notes: >-
    The typhoidal form presents as acute flu-like systemic illness and is among
    the severe tularemia forms.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The disease has an acute onset, with the occurrence of fever (38–40 °C),
      chills, fatigue, generalized myalgia, and headaches, resembling flu.
    explanation: >-
      Supports an acute symptomatic phase with the constitutional features
      prominent in typhoidal tularemia.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Typhoidal tularemia is one of the severe systemic forms of tularemia, and
    untreated or delayed disease can progress to sepsis, multiorgan
    cardiovascular and hematologic complications, and death.
  evidence:
  - reference: PMID:40107886
    reference_title: "Tularemia for clinicians: An up-to-date review on epidemiology, diagnosis, prevention and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If not promptly diagnosed and treated, the fatality rate can be as high as
      60 %, with the poorest outcomes reported in the pneumonic and typhoidal
      forms.
    explanation: >-
      Identifies typhoidal tularemia as one of the tularemia forms associated
      with the poorest outcomes when diagnosis and treatment are delayed.
diagnosis:
- name: Blood culture and serologic confirmation
  description: >-
    Typhoidal tularemia should be suspected in a compatible systemic febrile
    illness without localized lesions, with diagnosis confirmed by serology or
    occasional Francisella growth from blood in bacteremic disease.
  evidence:
  - reference: PMID:24874046
    reference_title: "All-time high tularaemia incidence in Norway in 2011: report from the national surveillance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An unexpectedly high number (3.9 %) of the patients had positive blood
      culture with Francisella tularensis.
    explanation: >-
      Shows that Francisella can be recovered from blood cultures in a minority
      of clinically diverse tularemia cases.
  - reference: PMID:41458397
    reference_title: "Typhoidal tularemia with pancytopenia and pericarditis in a georgian adolescent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serologic testing confirmed Francisella tularensis infection.
    explanation: >-
      Documents serologic confirmation in a typhoidal tularemia presentation
      with pancytopenia and pericarditis.
histopathology:
- name: Necrotizing granulomatous inflammation
  description: >-
    Tularemia tissue samples can show granulomatous and suppurative inflammation,
    including granulomatous hepatitis in systemic disease and necrotizing
    granulomatous inflammation in biopsied pulmonary lesions that mimic
    malignancy.
  finding_term:
    preferred_term: necrotizing granulomatous inflammation
  diagnostic: true
  notes: >-
    Left without a `term:` binding because the HistopathologyFindingTerm dynamic
    enum is rooted in NCIT histopathology-result concepts, and the true
    granuloma terms are outside that branch.
  evidence:
  - reference: PMID:31937491
    reference_title: "A rare cause of granulomatous hepatitis: Tularemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Liver had a nodular appearance in liver imaging and liver biopsy were
      consistent with granulomatous hepatitis.
    explanation: >-
      Documents granulomatous hepatitis on liver biopsy during systemic
      tularemia.
  - reference: PMID:41482246
    reference_title: "Pulmonary tularemia: A diagnosis not to overlook."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In three patients, positron emission tomography/CT demonstrated intensely
      hypermetabolic lesions, highly suggestive of malignancy. CTguided biopsies
      performed in two patients revealed a non-specific necrotizing granulomatous
      inflammation.
    explanation: >-
      Documents necrotizing granulomatous inflammation in F. tularensis lesions
      that can mimic malignancy; this is indirect for typhoidal tularemia because
      the biopsied cases were pulmonary.
treatments:
- name: Gentamicin for severe tularemia
  description: >-
    Gentamicin is an aminoglycoside first-line agent for severe tularemia,
    including severe systemic typhoidal disease.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: gentamicin
      term:
        id: CHEBI:759884
        label: gentamicin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Francisella Ribosomal Translation
    treatment_effect: INHIBITS
    description: >-
      Gentamicin is an aminoglycoside that kills Francisella through the
      conserved bacterial ribosomal target.
  evidence:
  - reference: PMID:40107886
    reference_title: "Tularemia for clinicians: An up-to-date review on epidemiology, diagnosis, prevention and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Gentamicin is the first-line treatment for severe tularemia
    explanation: >-
      Supports gentamicin as a first-line drug for severe tularemia
      presentations, including systemic typhoidal disease.
- name: Fluoroquinolone therapy
  description: >-
    Ciprofloxacin or levofloxacin are fluoroquinolone alternatives for less
    severe tularemia and have clinical response data in severe respiratory and
    bacteremic type B tularemia.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ciprofloxacin
      term:
        id: CHEBI:100241
        label: ciprofloxacin
    - preferred_term: levofloxacin
      term:
        id: CHEBI:63598
        label: levofloxacin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Francisella DNA Gyrase and Topoisomerase IV
    treatment_effect: INHIBITS
    description: >-
      Ciprofloxacin and levofloxacin are fluoroquinolones that inhibit bacterial
      type II topoisomerases needed for Francisella DNA replication.
  - target: Cell-Penetrant Antimicrobial Requirement
    treatment_effect: BYPASSES
    description: >-
      Fluoroquinolones reach intracellular Francisella and therefore satisfy the
      penetration requirement imposed by the organism's macrophage cytosolic
      niche.
  evidence:
  - reference: PMID:40107886
    reference_title: "Tularemia for clinicians: An up-to-date review on epidemiology, diagnosis, prevention and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      fluoroquinolones and tetracyclines are commonly the drugs of choice in less
      severe forms
    explanation: >-
      Supports fluoroquinolones as commonly selected agents for less severe
      tularemia.
  - reference: PMID:38294118
    reference_title: "Treatment Outcome of Severe Respiratory Type B Tularemia Using Fluoroquinolones."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      30-day mortality was 1.5% (1 of 67)
    explanation: >-
      Reports low 30-day mortality in a severe respiratory tularemia cohort in
      which hospitalized patients were frequently treated with ciprofloxacin or
      levofloxacin-containing regimens.
- name: Doxycycline alternative therapy
  description: >-
    Doxycycline is a tetracycline alternative for tularemia, but because
    tetracyclines are bacteriostatic and relapse can occur, agent choice and
    duration need to account for disease severity.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Francisella Ribosomal Translation
    treatment_effect: INHIBITS
    description: >-
      Doxycycline blocks Francisella bacterial protein synthesis, limiting
      intracellular replication upstream of bacteremic systemic inflammation.
  - target: Cell-Penetrant Antimicrobial Requirement
    treatment_effect: BYPASSES
    description: >-
      Doxycycline accumulates intracellularly and therefore reaches Francisella
      organisms replicating inside host-cell cytosol.
  evidence:
  - reference: PMID:40107886
    reference_title: "Tularemia for clinicians: An up-to-date review on epidemiology, diagnosis, prevention and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      fluoroquinolones and tetracyclines are commonly the drugs of choice in less
      severe forms
    explanation: >-
      Supports tetracyclines as commonly selected non-aminoglycoside tularemia
      agents.
  - reference: PMID:38294108
    reference_title: "Systematic Review: Clinical Features, Antimicrobial Treatment, and Outcomes of Human Tularemia, 1993-2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Aminoglycosides, fluoroquinolones, and tetracyclines are effective
      antimicrobials for treatment of tularemia, regardless of clinical manifestation.
    explanation: >-
      Systematic review of case-level human tularemia data identifies several
      effective antibiotic classes across manifestations.
  - reference: PMID:38294118
    reference_title: "Treatment Outcome of Severe Respiratory Type B Tularemia Using Fluoroquinolones."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One disease relapse occurred with doxycycline treatment.
    explanation: >-
      Documents relapse after doxycycline in a severe type B respiratory
      tularemia cohort, supporting attention to severity when choosing a
      bacteriostatic alternative.

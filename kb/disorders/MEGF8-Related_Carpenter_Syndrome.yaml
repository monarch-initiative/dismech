pathophysiology:
- name: MEGF8 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic MEGF8 variants reduce the activity of a multidomain transmembrane
    protein that restrains two distinct signalling pathways. Reported alleles
    include nonsense, missense and splice-site changes, and the missense alleles
    are hypomorphic rather than null: in a zebrafish rescue assay they provide only
    weak rescue of a Megf8-knockdown gastrulation phenotype. No patient carries two
    complete loss-of-function alleles, which is interpreted as indicating that some
    residual MEGF8 function is required for survival.
  genes:
  - preferred_term: MEGF8
    term:
      id: hgnc:3233
      label: MEGF8
  evidence:
  - reference: PMID:23063620
    reference_title: Mutations in multidomain protein MEGF8 identify a Carpenter syndrome subtype associated with defective lateralization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a disorder caused by mutations in multiple
      epidermal-growth-factor-like-domains 8 (MEGF8), which exhibits substantial
      clinical overlap with Carpenter syndrome but is frequently associated with
      abnormal left-right patterning.
    explanation: >-
      The original report establishing MEGF8 as the cause of this Carpenter
      syndrome subtype.
  - reference: PMID:23063620
    reference_title: Mutations in multidomain protein MEGF8 identify a Carpenter syndrome subtype associated with defective lateralization.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we demonstrate in zebrafish that, in contrast to the wild-type protein, the
      proteins containing all three missense alterations provide only weak rescue of
      an early gastrulation phenotype induced by Megf8 knockdown
    explanation: >-
      Functional evidence that the patient missense alleles are hypomorphic.
  - reference: PMID:23063620
    reference_title: Mutations in multidomain protein MEGF8 identify a Carpenter syndrome subtype associated with defective lateralization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We did not observe any subject with biallelic loss-of function mutations,
      suggesting that some residual MEGF8 function might be necessary for survival
      and might influence the phenotypes observed.
    explanation: >-
      The allelic constraint, stated by the authors as an inference from absence.
  - reference: PMID:38760421
    reference_title: The phenotype of MEGF8-related Carpenter syndrome (CRPT2) is refined through the identification of eight new patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No patient to date has carried two MEGF8 gene alterations that are both
      predicted to lead to complete loss-of-function, suggesting that a variable
      degree of residual MEGF8 activity may be essential for viability and
      potentially contributing to variable phenotypic severity.
    explanation: >-
      Independent replication of the allelic constraint across a doubled case
      series.
  downstream:
  - target: Excess Hedgehog Signalling via Failed Smoothened Degradation
    description: >-
      MEGF8 normally promotes degradation of Smoothened; its loss therefore
      de-represses Hedgehog signal transduction.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38760421
      reference_title: The phenotype of MEGF8-related Carpenter syndrome (CRPT2) is refined through the identification of eight new patients.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In contrast to RAB23, MEGF8 appears to act by promoting degradation of the
        hedgehog pathway signal transduction factor Smoothened
      explanation: >-
        Identifies the specific molecular mechanism by which MEGF8 restrains
        Hedgehog signalling, and distinguishes it from RAB23.
  - target: BMPR1A Accumulation and BMP-SMAD Hyperactivation
    description: >-
      MEGF8 loss disrupts ubiquitination and lysosomal degradation of BMPR1A, so
      the receptor accumulates and canonical BMP-SMAD1/5/9 signalling is
      hyperactivated. This arm is independent of Hedgehog.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42399640
      reference_title: MEGF8 controls osteogenic differentiation through post-transcriptional regulation of BMP-SMAD signaling in craniosynostosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Loss of MEGF8 disrupts ubiquitination and lysosomal degradation of BMPR1A,
        leading to BMPR1A accumulation and hyperactivation of canonical BMP-SMAD1/5/9
        signaling, which accelerates osteogenic differentiation of cranial
        mesenchyme.
      explanation: >-
        The molecular basis of the Hedgehog-independent BMP arm.
- name: Excess Hedgehog Signalling via Failed Smoothened Degradation
  conforms_to: "limb_digit_patterning_serial_homology#Limb Patterning Signal Perturbation"
  biological_scale: CELLULAR
  description: >-
    De-repressed Smoothened-dependent Hedgehog signal transduction. This is the arm
    that patterns the limb and, with nodal-family signalling, the left-right axis.
    Mouse genetics shows it is the arm responsible for the limb phenotype
    specifically: Megf8 mutant limb defects are Hedgehog-dependent and are rescued
    by Smoothened inhibition.
  biological_processes:
  - preferred_term: smoothened signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007224
      label: smoothened signaling pathway
  evidence:
  - reference: PMID:42399640
    reference_title: MEGF8 controls osteogenic differentiation through post-transcriptional regulation of BMP-SMAD signaling in craniosynostosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using Megf8 mutant mice, we show tissue-specific specialization: limb defects
      are Hh-dependent and rescued by SMO inhibition, whereas craniosynostosis is
      BMP-driven and refractory to Hh blockade, with BMP type I receptor inhibition
      selectively rescuing the cranial phenotype.
    explanation: >-
      Pharmacological rescue assigns the limb phenotype to the Hedgehog arm. This
      is a rescue experiment, not a correlation, which is what makes the arm
      assignment mechanistic.
  - reference: PMID:23063620
    reference_title: Mutations in multidomain protein MEGF8 identify a Carpenter syndrome subtype associated with defective lateralization.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that mutations in MEGF8 cause a Carpenter syndrome subtype
      frequently associated with defective left-right patterning, probably through
      perturbation of signaling by hedgehog and nodal family members.
    explanation: >-
      Attributes the laterality defect to Hedgehog and nodal signalling, but the
      authors hedge with "probably", so this is curated as PARTIAL.
  downstream:
  - target: Disrupted Digit Number and Identity Specification
    description: >-
      Excess Hedgehog signalling perturbs the anteroposterior patterning of the
      autopod.
    causal_link_type: DIRECT
  - target: Defective Left-Right Patterning
    description: >-
      Perturbed Hedgehog and nodal signalling at pre-streak stages disrupts
      establishment of the left-right axis.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: BMPR1A Accumulation and BMP-SMAD Hyperactivation
  biological_scale: CELLULAR
  description: >-
    Failure of ubiquitin-mediated BMPR1A turnover leads to receptor accumulation and
    canonical BMP-SMAD1/5/9 hyperactivation, accelerating osteogenic differentiation
    of cranial mesenchyme and closing the cranial sutures prematurely. This arm is
    Hedgehog-independent: the cranial phenotype is refractory to Hedgehog blockade
    and is selectively rescued by BMP type I receptor inhibition. It is also the
    point at which MEGF8 and RAB23 diverge mechanistically despite converging on a
    shared phenotype, RAB23 acting through FGF-ERK instead.
  biological_processes:
  - preferred_term: BMP signaling pathway
    modifier: INCREASED
    term:
      id: GO:0030509
      label: BMP signaling pathway
  - preferred_term: osteoblast differentiation
    modifier: INCREASED
    term:
      id: GO:0001649
      label: osteoblast differentiation
  evidence:
  - reference: PMID:42399640
    reference_title: MEGF8 controls osteogenic differentiation through post-transcriptional regulation of BMP-SMAD signaling in craniosynostosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      While both genes encode negative regulators of Hedgehog (Hh) signaling, we
      demonstrate that MEGF8 maintains cranial suture patency through a distinct,
      Hh-independent pathway.
    explanation: >-
      The central claim of the BMP arm: cranial suture patency is maintained
      independently of Hedgehog.
  - reference: PMID:42399640
    reference_title: MEGF8 controls osteogenic differentiation through post-transcriptional regulation of BMP-SMAD signaling in craniosynostosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Reintroduction of human MEGF8 in MEGF8-knockdown cells restores BMPR1A protein
      levels, validating the specificity of MEGF8-mediated BMPR1A regulation.
    explanation: >-
      Rescue by reintroduction establishes that the BMPR1A effect is specific to
      MEGF8 loss rather than an off-target consequence of knockdown.
  - reference: PMID:42399640
    reference_title: MEGF8 controls osteogenic differentiation through post-transcriptional regulation of BMP-SMAD signaling in craniosynostosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Comparative analyses reveal that MEGF8 and RAB23 promote osteogenic
      differentiation through distinct mechanisms-MEGF8 via ubiquitin-mediated BMPR1A
      turnover and BMP-SMAD activation, RAB23 through FGF-ERK signaling-despite both
      affecting GLI1-mediated transcription.
    explanation: >-
      Establishes that the two Carpenter syndrome genes reach the same phenotype by
      different routes, which is why CRPT1 and CRPT2 are curated separately.
  downstream:
  - target: Craniosynostosis
    description: >-
      Accelerated osteogenic differentiation of cranial mesenchyme closes sutures
      prematurely.
    causal_link_type: DIRECT
- name: Disrupted Digit Number and Identity Specification
  conforms_to: "limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity Specification"
  biological_scale: TISSUE
  description: >-
    Perturbation of the anteroposterior patterning signal alters digit number and
    identity in the developing autopod.
  biological_processes:
  - preferred_term: limb morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0035108
      label: limb morphogenesis
  evidence:
  - reference: PMID:32203821
    reference_title: Spatial and temporal deletion reveals a latent effect of Megf8 on the left-right patterning and heart development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      temporal deletion with a ubiquitous Cre driver at embryonic day 7.5 (E7.5), a
      time point before symmetry break and cardiogenesis, causes preaxial polydactyly
      (PPD) and exencephaly, but not laterality and cardiovascular defects
    explanation: >-
      Timed deletion shows the digit phenotype has a later requirement window than
      the laterality phenotype, separating the two arms temporally as well as
      pharmacologically.
  downstream:
  - target: Polysyndactyly
    description: >-
      Disrupted digit specification produces polydactyly with syndactyly, affecting
      hands and feet alike.
    causal_link_type: DIRECT
- name: Polysyndactyly
  conforms_to: "limb_digit_patterning_serial_homology#Serially Homologous Autopod Malformation"
  biological_scale: ORGANISM
  description: >-
    Polydactyly with cutaneous syndactyly of both hands and feet. The bilateral,
    fore- and hindlimb distribution is the serial-homology signature: one patterning
    lesion, reused across homologous autopods, gives a multi-element bundle rather
    than an isolated digit anomaly.
  evidence:
  - reference: PMID:38760421
    reference_title: The phenotype of MEGF8-related Carpenter syndrome (CRPT2) is refined through the identification of eight new patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The core features of craniosynostosis, polysyndactyly and (in males)
      cryptorchidism are almost universal in both CRPT1 and CRPT2.
    explanation: >-
      Polysyndactyly is a near-universal core feature of CRPT2.
  - reference: PMID:23063620
    reference_title: Mutations in multidomain protein MEGF8 identify a Carpenter syndrome subtype associated with defective lateralization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Carpenter syndrome is an autosomal-recessive multiple-congenital-malformation
      disorder characterized by multisuture craniosynostosis and polysyndactyly of
      the hands and feet
    explanation: >-
      States the hands-and-feet distribution that makes this a serially homologous
      bundle.
- name: Defective Left-Right Patterning
  biological_scale: ORGANISM
  description: >-
    Abnormal establishment of the left-right axis, producing situs inversus,
    dextrocardia or transposition of the great arteries. Mouse conditional-deletion
    work places the requirement remarkably early: deletion at embryonic day 6.5,
    before symmetry break, produces laterality and aortic arch defects, whereas
    deletion at E7.5 does not, and no cardiac-lineage-restricted deletion produces
    cardiovascular defects at all. The cardiovascular disease therefore appears to
    be a downstream consequence of the laterality defect rather than an independent
    cardiac requirement for MEGF8.
  evidence:
  - reference: PMID:23063620
    reference_title: Mutations in multidomain protein MEGF8 identify a Carpenter syndrome subtype associated with defective lateralization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe five affected individuals with similar dysmorphic facies, and three
      of them had either complete situs inversus, dextrocardia, or transposition of
      the great arteries; similar cardiac abnormalities were previously identified in
      a mouse mutant for the orthologous Megf8.
    explanation: >-
      Documents the laterality phenotype in patients and its concordance with the
      mouse mutant.
  - reference: PMID:32203821
    reference_title: Spatial and temporal deletion reveals a latent effect of Megf8 on the left-right patterning and heart development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The concurrence of laterality and cardiovascular defects in pre-streak stage
      deletion rather than cardiac organogenesis stage deletion indicates that the
      laterality defect may directly impact heart development.
    explanation: >-
      The authors' interpretation that the cardiac disease follows from the
      laterality defect rather than from a cardiac MEGF8 requirement.
  downstream:
  - target: Situs inversus totalis
    description: Reversed left-right axis specification.
    causal_link_type: DIRECT
  - target: Congenital heart disease
    description: >-
      Cardiovascular malformation arising downstream of the laterality defect.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

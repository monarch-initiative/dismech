name: MEGF8-related Carpenter Syndrome
creation_date: "2026-08-24T14:55:00Z"
description: >-
  MEGF8-related Carpenter syndrome (Carpenter syndrome 2, CRPT2) is an autosomal
  recessive acrocephalopolysyndactyly caused by biallelic MEGF8 variants. MEGF8 is
  a multidomain transmembrane protein that acts as a negative regulator of
  Hedgehog signalling by promoting degradation of Smoothened, and independently
  restrains BMP signalling by driving ubiquitin-mediated turnover of BMPR1A. These
  two functions map onto two arms of the phenotype: the limb and laterality
  defects are Hedgehog-dependent, whereas the craniosynostosis is BMP-driven and
  refractory to Hedgehog blockade. CRPT2 is distinguished from RAB23-associated
  CRPT1 by frequent laterality defects and by craniosynostosis that typically
  involves a single midline suture rather than multiple sutures. No patient has
  been reported with two complete loss-of-function alleles, suggesting residual
  MEGF8 activity is required for viability.
synonyms:
- Carpenter syndrome 2
- CRPT2
- MEGF8-associated Carpenter syndrome
- acrocephalopolysyndactyly type II, MEGF8-related

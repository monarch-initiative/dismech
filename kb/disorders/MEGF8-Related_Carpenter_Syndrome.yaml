    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Considering all reported cases of MEGF8- and RAB23-associated CRPTS, laterality
      defects were significantly more common in CRPT2 (7/15 cases) than in CRPT1
    explanation: >-
      7 of 15 is 47%, which falls in the FREQUENT band (30-79%), and the fraction is

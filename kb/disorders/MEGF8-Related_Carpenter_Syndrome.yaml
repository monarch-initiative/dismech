diagnosis:
- name: Clinical recognition with MEGF8 sequencing
  description: >-
    Carpenter syndrome is recognised clinically from craniosynostosis with
    polysyndactyly; distinguishing CRPT2 from CRPT1 requires gene testing, though two
    clinical features shift the prior — laterality defects (common in CRPT2, rare in
    CRPT1) and single-midline-suture rather than multi-suture craniosynostosis.
  evidence:
  - reference: PMID:38760421
    reference_title: The phenotype of MEGF8-related Carpenter syndrome (CRPT2) is refined through the identification of eight new patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, laterality defects are present in nearly half of those with
      MEGF8-associated CRPT2, but are rare in RAB23-associated CRPT1.
    explanation: >-
      The clinical discriminator that raises the prior for MEGF8 over RAB23.

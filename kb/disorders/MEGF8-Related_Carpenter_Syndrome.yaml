animal_models:
- name: Megf8 conditional and temporal deletion mouse
  species: Mouse
  genotype: Megf8 conditional (tissue-restricted and temporally staged Cre-driven deletion)
  publication: PMID:32203821
  description: >-
    A spatial and temporal deletion series designed to ask where and when MEGF8 is
    required for the cardiovascular phenotype. Its most informative results are
    negative: no cardiac-lineage-restricted deletion reproduced the cardiovascular
    defects, and even ubiquitous deletion at E7.5 did not. Only pre-streak (E6.5)
    deletion produced laterality and aortic arch defects.
  modeled_mechanisms:
  - target: Defective Left-Right Patterning
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Pre-streak deletion reproduces reversed left-right patterning with aortic arch
      artery defects, and the staged design localises the requirement to before
      symmetry break.
    limitations: >-
      The staging is mouse-specific and cannot be transferred directly to a human
      developmental timetable. The model also does not address why human patients
      retain residual MEGF8 function, since the deletions here are complete.
    readouts:
    - name: Right aortic arch after E6.5 ubiquitous deletion
      target: Defective Left-Right Patterning
      direction: INCREASED
      interpretation: >-
        Right aortic arch is used as the indicator of reversed left-right patterning.
      evidence:
      - reference: PMID:32203821
        reference_title: Spatial and temporal deletion reveals a latent effect of Megf8 on the left-right patterning and heart development.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Only with E6.5 deletion, we observed aortic arch artery defects including
          right aortic arch, an indicator of reversed left-right patterning.
        explanation: >-
          The positive result and its stated interpretation.
  - target: Congenital heart disease
    relationship: FAILS_TO_RECAPITULATE
    fidelity: HIGH
    description: >-
      Deleting Megf8 in any cardiac lineage failed to produce cardiovascular defects.
      This is a substantive negative result, not a missing experiment: it is what
      shows the cardiac disease is not caused by a cardiac requirement for MEGF8, and
      is instead downstream of the laterality defect.
    limitations: >-
      The negative result constrains where MEGF8 is required but does not itself
      prove the laterality-to-heart causal route, which the authors state as an
      indication rather than a demonstration. A conditional approach also cannot
      exclude a requirement below the detection threshold of the phenotyping used.
    readouts:
    - name: Cardiovascular defects after cardiac-lineage-restricted deletion
      target: Congenital heart disease
      direction: UNCHANGED
      interpretation: >-
        No cardiovascular defect arose from deletion in cardiomyocytes,
        endothelium/endocardium, epicardium, cardiac mesoderm or neural crest,
        placing the requirement outside these lineages.
      evidence:
      - reference: PMID:32203821
        reference_title: Spatial and temporal deletion reveals a latent effect of Megf8 on the left-right patterning and heart development.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          None of conditional deletions in cardiomyocytes, endothelium/endocardium,
          epicardium, cardiac mesoderm or neural crest cells led to cardiovascular
          defects.
        explanation: >-
          The negative result across all five cardiac lineages tested.
    evidence:
    - reference: PMID:32203821
      reference_title: Spatial and temporal deletion reveals a latent effect of Megf8 on the left-right patterning and heart development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These data suggested that Megf8 was dispensable for cardiac organogenesis.
      explanation: >-
        The authors' conclusion from the negative results, which is the substantive
        claim this FAILS_TO_RECAPITULATE link records.

- name: Heterotaxy
  description: >-
    Laterality defects as a class, present in 7 of 15 reported CRPT2 patients and
    rare in CRPT1 - the second discriminating feature between the subtypes. Bound to
    Heterotaxy rather than Situs inversus totalis because that is the population the
    7/15 fraction was measured over, and because the 2024 cohort reports left atrial
    isomerism, abdominal situs inversus, polysplenia and bowel malrotation with NO
    complete situs inversus and no dextrocardia. The feature is also incompletely
    penetrant: 8 of 15 patients have no laterality defect at all.
  phenotype_term:

discussions:
- discussion_id: gap_megf8_hh_bmp_arm_partition
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the Hedgehog-versus-BMP partition of the MEGF8 phenotype established in
    mouse hold in human CRPT2, and does it make BMP type I receptor inhibition a
    rational target for the craniosynostosis?
  attaches_to:
  - "pathophysiology#BMPR1A Accumulation and BMP-SMAD Hyperactivation"
  - "pathophysiology#Excess Hedgehog Signalling via Failed Smoothened Degradation"
  rationale: >-
    The pharmacological dissociation in Megf8 mutant mice is clean and mechanistic
    rather than correlative: Smoothened inhibition rescues the limb defects but not
    the craniosynostosis, while BMP type I receptor inhibition selectively rescues
    the cranial phenotype. If that partition holds in humans it reframes CRPT2 as
    two separable diseases in one gene and identifies a druggable target for the
    feature that carries most of the surgical burden. But the entire partition rests
    on one 2026 mouse and cell study, no human tissue has been examined, and the
    human alleles are hypomorphic where the mouse work uses complete loss. The
    partition also has to be reconciled with the observation that MEGF8 and RAB23
    both affect GLI1-mediated transcription despite acting through different
    pathways, which suggests the two arms are not as cleanly separable upstream as
    the rescue experiments make them look downstream.
  proposed_experiments:
  - experiment_id: exp_megf8_bmp_signalling_in_patient_suture
    name: BMP-SMAD activation in CRPT2 patient cranial suture tissue
    description: >-
      Measure BMPR1A abundance and SMAD1/5/9 phosphorylation in cranial suture tissue
      obtained at craniofacial surgery from CRPT2 patients against
      non-syndromic-craniosynostosis and unaffected controls, to test whether the
      mouse BMP arm operates in human disease.
  - experiment_id: exp_megf8_hypomorph_arm_dosage
    name: Arm-specific dosage sensitivity in a hypomorphic allelic series
    description: >-
      Build a mouse or cell allelic series spanning the residual-activity range seen
      in patients and determine whether the Hedgehog and BMP arms have different
      dosage thresholds, which would predict which patients develop which features.
- discussion_id: gap_megf8_obligate_residual_function
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is complete biallelic MEGF8 loss of function lethal in humans, or simply
    unobserved in fifteen patients?
  attaches_to:
  - "pathophysiology#MEGF8 Loss of Function"
  rationale: >-
    Two independent series, twelve years apart, report the same negative: no patient
    carries two alleles both predicted to abolish function, and both sets of authors
    read this as residual activity being required for viability. The inference is
    reasonable and the replication across a doubled cohort strengthens it, but it
    remains an argument from absence over fifteen patients, which is a small
    denominator for a claim about embryonic lethality. It matters for counselling:
    if true, couples both carrying null alleles face a recurrence risk expressed as
    pregnancy loss rather than as CRPT2.
  proposed_experiments:
  - experiment_id: exp_megf8_null_prenatal_ascertainment
    name: Prenatal and pregnancy-loss ascertainment of biallelic MEGF8 null genotypes
    description: >-
      Search fetal and pregnancy-loss sequencing cohorts for biallelic
      predicted-null MEGF8 genotypes, which would convert the argument from absence
      into a positive observation of prenatal lethality or refute it.
notes: >-
  Scope. This entry is MEGF8-associated Carpenter syndrome (CRPT2) only. The commoner
  RAB23-associated CRPT1 is a separate MONDO term and a separate disease entity, and
  the 2026 mechanistic work supports keeping them separate rather than lumping: the
  two genes reach a shared phenotype through different pathways (MEGF8 via
  ubiquitin-mediated BMPR1A turnover and BMP-SMAD, RAB23 via FGF-ERK), so a merged
  entry would have to assert a mechanism neither gene follows.

  Phenotype scoping. The bands here follow counted fractions from the 2024 cohort
  rather than the compound names clinicians use: cutaneous syndactyly is universal
  (15/15) while polydactyly alone is 5/8, so the compound "polysyndactyly" is split
  into its two components and each band fits its own term. The laterality feature is
  bound to Heterotaxy rather than Situs inversus totalis because 7/15 was measured
  over laterality defects as a class, and the reported findings are left atrial
  isomerism, abdominal situs inversus, polysplenia and bowel malrotation. Frequency
  bands throughout follow the schema's own ranges applied to the counted fractions
  (VERY_FREQUENT 80-99%, FREQUENT 30-79%, OCCASIONAL 5-29%), not an impression of
  how characteristic a feature feels.

  Diagnostic caution, in the source's own words: the authors "urge that great
  caution should be exerted in the pathogenic interpretation of biallelic MEGF8
  variants, in the absence of the characteristic clinical features". That matters
  here because the laterality feature which most distinguishes CRPT2 is itself
  incompletely penetrant (8/15 patients have none), so genotype alone is a weak
  basis for the diagnosis.

  A claim this entry previously made and has now withdrawn: that the cardiac
  phenotype characteristically includes dextrocardia and transposition of the great
  arteries. That is true of the 2012 series but the 2024 cohort states that NONE of
  its eight individuals had dextrocardia, and that sentence is curated with
  supports: REFUTE against the withdrawn claim. Congenital heart disease as a class
  (10/15) is asserted; the specific lesions are not.

  Carpenter-syndrome-wide features surfaced by the deep-research report (obesity,
  umbilical hernia, hearing loss, intellectual disability, kyphoscoliosis, genu
  valgum, short stature) are deliberately NOT curated here. They are described for
  Carpenter syndrome generally rather than demonstrated for the MEGF8 subtype, and
  this entry is CRPT2-specific. That is a scoping decision, not an oversight.

  Not to be confused with Cole-Carpenter syndrome, an existing entry in this KB.
  That disorder is caused by P4HB/SEC24D and is an osteogenesis-imperfecta-like bone
  fragility syndrome; the shared surname is a name collision, not a relationship.

  A correction to a common framing. It is usually said that Carpenter syndrome
  results from loss of a negative regulator of Hedgehog signalling, and that this
  produces both the craniosynostosis and the polysyndactyly. For MEGF8 that is now
  only half right: mouse rescue experiments show the limb defects are
  Hedgehog-dependent while the craniosynostosis is Hedgehog-independent, BMP-driven,
  and refractory to Hedgehog blockade. The pathophysiology here is therefore
  deliberately bifurcated at the MEGF8 node rather than routed through a single
  Hedgehog chain.

  Module conformance. Three nodes conform to limb_digit_patterning_serial_homology,
  which fits well: polysyndactyly of both hands and feet is exactly the serially
  homologous autopod bundle that module models. Conformance to
  ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction was considered and
  DECLINED. That module node is explicitly cilium-anchored ("Ciliary assembly or
  trafficking defects derange this process"), whereas MEGF8 restrains Hedgehog by
  promoting Smoothened degradation, with no evidence of a ciliary assembly or
  trafficking defect. Declaring conformance would assert a ciliopathy mechanism that
  is not evidenced for this gene.

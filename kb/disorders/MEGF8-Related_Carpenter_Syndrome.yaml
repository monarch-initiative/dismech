  description: >-
    Premature fusion of cranial sutures. In CRPT2 this characteristically involves a
    single midline suture, in contrast to the multi-suture craniosynostosis typical
    of RAB23-associated CRPT1 — one of the two features that clinically separates
    the subtypes.
  phenotype_term:
    preferred_term: Craniosynostosis
    term:
      id: HP:0001363
      label: Craniosynostosis
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:38760421
    reference_title: The phenotype of MEGF8-related Carpenter syndrome (CRPT2) is refined through the identification of eight new patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The core features of craniosynostosis, polysyndactyly and (in males)
      cryptorchidism are almost universal in both CRPT1 and CRPT2.
    explanation: >-
      "Almost universal" is the basis for the VERY_FREQUENT band.
  - reference: PMID:38760421
    reference_title: The phenotype of MEGF8-related Carpenter syndrome (CRPT2) is refined through the identification of eight new patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Craniosynostosis in CRPT2 commonly involves a single midline suture in
      comparison to the multi-suture craniosynostosis characteristic of CRPT1.
    explanation: >-
      The suture-pattern difference that distinguishes CRPT2 from CRPT1.
- name: Polysyndactyly
  description: >-

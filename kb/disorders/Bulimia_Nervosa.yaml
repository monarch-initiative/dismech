progression:
- phase: Variable long-term course
  notes: Remission and relapse can occur over many years. In a historic female treatment-seeking cohort, imputed recovery at 22 years was 68.2% among surviving participants with BN. Recovery required minimal symptoms for a year; the study does not demonstrate uninterrupted recovery during the long assessment gap or attribute outcome to a particular treatment. Of 107 BN survivors, 76 were re-interviewed and missing outcomes were imputed.
  evidence:
  - reference: PMID:28002660
    reference_title: Recovery From Anorexia Nervosa and Bulimia Nervosa at 22-Year Follow-Up.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: At 22-year follow-up, 62.8% of participants with anorexia nervosa and 68.2% of participants with bulimia nervosa recovered
    explanation: Diagnosis-specific long-term outcome; the BN figure must not be pooled with the AN figure.
- phase: Mortality and suicide risk
  notes: A 2026 meta-analysis found higher all-cause mortality in BN versus the general population (17 studies; pooled RR 2.39, 95% CI 1.86–3.06; I-squared 55%) and higher suicide-related mortality (RR 6.15, 95% CI 2.52–15.04). These are relative associations from observational cohorts with varying follow-up and ascertainment, not an individual absolute risk or proof that BN alone causes death. The overall review was predominantly female and evidence outside Western countries remained limited. Physical complications and suicide risk require assessment alongside recovery and relapse.
  evidence:
  - reference: PMID:41536100
    reference_title: "All-cause and cause-specific mortality risk in individuals with eating disorders: systematic review and meta-analysis of relative risk and aggravating or attenuating factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: 'BN (n=17, RR=2.39, 95% CI: 1.86‐3.06, I2=55%, p<0.001).'
    explanation: BN-specific all-cause mortality estimate from the full-text results; do not transfer the higher AN estimate to BN.
  - reference: PMID:41536100
    reference_title: "All-cause and cause-specific mortality risk in individuals with eating disorders: systematic review and meta-analysis of relative risk and aggravating or attenuating factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: 'RR=6.15, 95% CI: 2.52-15.04 in bulimia nervosa'
    explanation: BN-specific suicide-related mortality estimate, distinct from the pooled eating-disorder result.
animal_models:
- name: Restriction-refeeding rat paradigms
  species: Rat
  description: Food restriction followed by refeeding, sometimes with stress or palatable food, models selected binge-eating components. It does not reproduce the full cognitive, social or compensatory syndrome.
  modeled_mechanisms:
  - target: Loss-of-Control Binge Eating
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: Excessive intake is observed; subjective loss of control and shape/weight overvaluation cannot be inferred.
    evidence:
    - reference: PMID:22138162
      reference_title: "Dysregulation of brain reward systems in eating disorders: neurochemical information from animal models of binge eating, bulimia nervosa, and anorexia nervosa."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: When they return to a normal body weight and feeding regimen, rats with a history of restriction and refeeding continue to exhibit binge-eating behavior, even when sated.
      explanation: Restriction-refeeding paradigms reproduce aspects of excessive intake, not human body-image cognition or a full BN syndrome.
- name: Gastric sham-feeding rat paradigm
  species: Rat
  description: An open gastric fistula permits intake with little nutrient retention. This probes reward and satiety components but does not model self-induced vomiting, because rats lack an emetic reflex.
  modeled_mechanisms:
  - target: Compensatory Behaviors
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: Gastric drainage mimics loss of ingested contents without the intentional or emetic components of human compensation.

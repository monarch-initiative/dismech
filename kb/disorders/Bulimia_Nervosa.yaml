- name: Conditional Digital Guided Self-Help
  description: NICE HTG768 (January 2026) permits Overcoming Bulimia Online during a two-year evidence-generation period in the NHS for selected adults after clinical assessment and with usual physical monitoring and waiting-list support. This conditional recommendation does not establish equivalence of all apps or suitability for severe illness. Other named technologies remain research-only.

  description: Review purging methods and frequency, medications, fluid/electrolyte disturbance, vital signs, dental and gastrointestinal symptoms, mood, anxiety, self-harm and suicide risk. Consider ECG monitoring based on purging severity, electrolyte imbalance, symptoms and medication risks. Normal electrolytes in intermittent purging do not exclude the diagnosis.

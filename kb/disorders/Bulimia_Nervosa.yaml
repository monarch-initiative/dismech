discussions:
- discussion_id: bn-neural-cause-and-consequence
  kind: KNOWLEDGE_GAP
  prompt: Which neural or molecular findings precede and sustain BN?
  rationale: Cross-sectional imaging, treatment response and animal component models do not establish a uniform causal serotonin/dopamine defect. Imaging directions vary, and cause, consequence and disorder specificity remain unresolved.
  evidence:
  - reference: PMID:32215560
    reference_title: Disturbed Resting-State Whole-Brain Functional Connectivity of Striatal Subregions in Bulimia Nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: the molecular basis of the striatal RSFC changes observed in our study is unclear
    explanation: Primary imaging study explicitly acknowledges the gap.
  attaches_to:
  - pathophysiology#Reward and Inhibitory-Control Circuit Differences
- discussion_id: bn-affect-measurement-timing
  kind: INTERPRETATION
  prompt: Does binge eating reduce negative affect?
  rationale: The 2017 article abstract says pre-binge ratings exceeded post-binge ratings, but the full results and BN table show post-binge ratings higher (26.72 versus 22.63). Pre-binge ratings were also much farther from the episode than post-binge ratings. Declining modeled post-binge trajectories and elevated proximal post-binge ratings can coexist; this does not justify universal immediate relief.
  evidence:
  - reference: PMID:28851137
    reference_title: "Negative affect and binge eating: Reconciling differences between two analytic approaches in ecological momentary assessment research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The results indicate that post-binge ratings of negative affect were significantly higher than the pre-binge ratings of negative affect for women in both Study 1-AN and Study 2-BN.
    explanation: Use the full-text results and table rather than the reversed abstract statement.
  attaches_to:
  - pathophysiology#Negative Affect Around Binge Episodes

name: Bulimia Nervosa
creation_date: "2026-04-28T00:00:00Z"
updated_date: "2026-07-30T00:00:00Z"
category: Psychiatric
description: >-
  Bulimia nervosa is an eating disorder characterized by recurrent binge eating
  episodes followed by compensatory behaviors intended to prevent weight gain,
  commonly including self-induced vomiting, fasting, laxative misuse, or
  excessive exercise.
disease_term:
  preferred_term: bulimia nervosa
  term:
    id: MONDO:0005452
    label: bulimia nervosa
parents:
- Eating Disorder
- Mental Health Disorder
pathophysiology:
- name: Polygenic and Environmental Liability
  description: >-
    Bulimia nervosa is modeled as a complex eating disorder arising from
    interacting genetic, environmental, and psychological factors rather than a
    single Mendelian cause.
  downstream:
  - target: Serotonergic Dysregulation
    description: >-
      Multifactorial eating-disorder liability is represented upstream of
      treatment-relevant neurotransmitter dysregulation.
    evidence:
    - reference: DOI:10.65031/rzeq8592
      reference_title: "Epigenetics of eating disorders: from genetic and molecular pathways to therapeutic possibilities"
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Eating disorders (EDs) are complex, multifactorial conditions influenced by biological, psychological and environmental factors."
      explanation: Supports multifactorial biological liability but does not isolate serotonergic dysregulation as the sole causal route.
  - target: Depressive Symptoms
    description: Shared psychological and biological liability may contribute to the depressive-symptom comorbidity observed in bulimia nervosa.
    evidence:
    - reference: DOI:10.1002/erv.2582
      reference_title: "Comorbid depressive symptoms and self‐esteem improve after either cognitive‐behavioural therapy or family‐based treatment for adolescent bulimia nervosa"
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "This study examined the effect of family‐based treatment for bulimia nervosa (FBT‐BN) and cognitive behavioral therapy for adolescents (CBT‐A) on depressive symptoms and self‐esteem in adolescents with BN."
      explanation: Supports depressive symptoms as a comorbid clinical feature; shared liability remains an inferred connection.
  - target: Reward and Inhibitory-Control Dysregulation
    description: Genetic, environmental, and psychological liability may converge on altered reward processing and inhibitory control.
    evidence:
    - reference: PMID:23658085
      reference_title: Neurocircuit function in eating disorders.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Results in patients with BN primarily suggest a hypo-responsive reward system to food stimuli, especially to taste reward. Additionally, patients with BN exhibit impaired brain activation in the inhibitory control network during the performance of general response-inhibition tasks."
      explanation: Supports reward and inhibitory-control abnormalities in bulimia nervosa; their placement downstream of multifactorial liability is an integrative inference.
  - target: Anxiety
    description: Shared psychiatric liability is associated with anxiety comorbidity in bulimia nervosa.
    evidence:
    - reference: PMID:1842216
      reference_title: The genetic epidemiology of bulimia nervosa.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Significant comorbidity was found between bulimia and anorexia nervosa, alcoholism, panic disorder, generalized anxiety disorder, phobia, and major depression."
      explanation: Supports anxiety-spectrum comorbidity without resolving a specific causal pathway.
  evidence:
  - reference: DOI:10.65031/rzeq8592
    reference_title: "Epigenetics of eating disorders: from genetic and molecular pathways to therapeutic possibilities"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eating disorders (EDs) are complex, multifactorial conditions influenced
      by biological, psychological and environmental factors.
    explanation: >-
      Review evidence supports multifactorial liability for eating disorders,
      including bulimia nervosa.
  - reference: DOI:10.1186/s40337-022-00717-4
    reference_title: "Risk factors for eating disorders: findings from a rapid review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abuse, trauma and childhood obesity are strongly linked to eating disorders"
    explanation: Supports environmental and developmental contributors to eating-disorder liability.
- name: Serotonergic Dysregulation
  description: >-
    Serotonin-linked biology is represented as a treatment-relevant disease
    mechanism because serotonergic pharmacotherapy reduces core binge-eating
    and vomiting outcomes in randomized bulimia nervosa trials.
  biological_processes:
  - preferred_term: response to serotonin
    term:
      id: GO:1904014
      label: response to serotonin
    modifier: ABNORMAL
  downstream:
  - target: Loss-of-Control Binge Eating
    description: >-
      Serotonin-linked mechanisms are modeled upstream of binge-eating
      vulnerability.
    evidence:
    - reference: DOI:10.1192/bjp.166.5.660
      reference_title: Long-Term Fluoxetine Treatment of Bulimia Nervosa
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Compared with placebo, fluoxetine treatment resulted in significantly greater reductions in vomiting (F [1,360] = 14.73, P< 0.0001) and binge-eating (F [1,360] = 14.39, P=0.0002) episodes per week at endpoint and improvement in other outcome measures."
      explanation: Pharmacologic response supports serotonergic involvement in binge eating but does not by itself establish a unique causal pathway.
  - target: Compensatory Purging Behavior
    description: >-
      Serotonin-linked mechanisms are also represented upstream of
      compensatory purging outcomes measured in treatment trials.
    evidence:
    - reference: DOI:10.1192/bjp.166.5.660
      reference_title: Long-Term Fluoxetine Treatment of Bulimia Nervosa
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Compared with placebo, fluoxetine treatment resulted in significantly greater reductions in vomiting (F [1,360] = 14.73, P< 0.0001) and binge-eating (F [1,360] = 14.39, P=0.0002) episodes per week at endpoint and improvement in other outcome measures."
      explanation: Fluoxetine response supports serotonergic involvement in vomiting and purging outcomes without proving a unique causal route.
  evidence:
  - reference: DOI:10.1192/bjp.166.5.660
    reference_title: Long-Term Fluoxetine Treatment of Bulimia Nervosa
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with placebo, fluoxetine treatment resulted in significantly
      greater reductions in vomiting (F [1,360] = 14.73, P< 0.0001) and
      binge-eating (F [1,360] = 14.39, P=0.0002) episodes per week at endpoint
      and improvement in other outcome measures.
    explanation: >-
      Randomized clinical trial evidence supports fluoxetine effects on the
      core binge-purge episode outcomes.
- name: Reward and Inhibitory-Control Dysregulation
  description: >-
    Functional neuroimaging in bulimia nervosa shows altered reward processing
    to food together with impaired recruitment of inhibitory-control networks.
    This reward and impulse-control imbalance is modeled upstream of
    loss-of-control binge eating.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Feeding behavior
    term:
      id: GO:0007631
      label: feeding behavior
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23658085
    reference_title: Neurocircuit function in eating disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Results in patients with BN primarily suggest a hypo-responsive reward system to food stimuli, especially to taste reward. Additionally, patients with BN exhibit impaired brain activation in the inhibitory control network during the performance of general response-inhibition tasks."
    explanation: Supports altered reward processing and impaired inhibitory control in bulimia nervosa.
  downstream:
  - target: Loss-of-Control Binge Eating
    description: Reward and inhibitory-control dysregulation contributes to loss-of-control binge eating.
    evidence:
    - reference: PMID:23658085
      reference_title: Neurocircuit function in eating disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the impulsivity model of binge eating in bulimia nervosa"
      explanation: Supports an impulsivity and inhibitory-control model of binge eating.
  - target: Impulsivity
    description: Impaired inhibitory-control network recruitment manifests clinically as impulsivity.
    evidence:
    - reference: PMID:23658085
      reference_title: Neurocircuit function in eating disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the impulsivity model of binge eating in bulimia nervosa"
      explanation: Supports impulsivity as a clinically relevant component of the binge-eating model.
- name: Loss-of-Control Binge Eating
  description: >-
    Bulimia nervosa includes recurrent episodes of excessive food intake,
    represented as the proximal eating-behavior event in the binge-purge cycle.
  downstream:
  - target: Compensatory Purging Behavior
    description: >-
      Binge-eating episodes are followed by compensatory behaviors intended to
      prevent weight gain.
    evidence:
    - reference: DOI:10.3389/fpsyg.2024.1386347
      reference_title: "Bulimia nervosa and treatment-related disparities: a review"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "BN is characterized by individuals’ episodes of excessive eating of food followed by engaging in unusual compensatory behaviors to control weight gain in BN."
      explanation: Directly supports compensatory behavior following excessive eating in the defining binge-purge cycle.
  - target: Binge Eating Episodes
    description: >-
      The pathophysiologic binge-eating event maps to the clinical abnormal
      eating phenotype.
    evidence:
    - reference: DOI:10.1186/s40360-023-00713-7
      reference_title: "Efficacy of pharmacotherapies for bulimia nervosa: a systematic review and meta-analysis"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Primary outcomes were changes in the frequency of binge eating episodes and vomiting episodes from baseline to endpoint."
      explanation: Supports binge-eating episodes as a measurable core clinical manifestation.
  evidence:
  - reference: DOI:10.3389/fpsyg.2024.1386347
    reference_title: "Bulimia nervosa and treatment-related disparities: a review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BN is characterized by individuals’ episodes of excessive eating of food
      followed by engaging in unusual compensatory behaviors to control weight
      gain in BN.
    explanation: >-
      Review evidence supports excessive eating episodes as part of the
      defining binge-purge cycle.
- name: Compensatory Purging Behavior
  description: >-
    Compensatory behaviors such as self-induced vomiting are represented as a
    distinct event downstream of binge eating and upstream of physical
    complications.
  downstream:
  - target: Vomiting
    description: >-
      Self-induced vomiting is a purging behavior and a measurable clinical
      phenotype.
    evidence:
    - reference: DOI:10.1186/s40360-023-00713-7
      reference_title: "Efficacy of pharmacotherapies for bulimia nervosa: a systematic review and meta-analysis"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Primary outcomes were changes in the frequency of binge eating episodes and vomiting episodes from baseline to endpoint."
      explanation: Supports vomiting episodes as a core measurable purging outcome.
  - target: Purging-Related Physiologic Perturbation
    description: >-
      Recurrent purging can produce electrolyte and oral/salivary complications.
    evidence:
    - reference: PMID:11746288
      reference_title: "Laboratory screening for electrolyte abnormalities and anemia in bulimia nervosa: a controlled study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Abnormal eating patterns and recurrent purging behaviors can result in significant medical complications."
      explanation: Directly supports recurrent purging as a cause of medical complications.
  evidence:
  - reference: DOI:10.3389/fpsyg.2024.1386347
    reference_title: "Bulimia nervosa and treatment-related disparities: a review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BN is characterized by individuals’ episodes of excessive eating of food
      followed by engaging in unusual compensatory behaviors to control weight
      gain in BN.
    explanation: >-
      Review evidence supports compensatory behaviors as the event following
      excessive eating episodes.
- name: Purging-Related Physiologic Perturbation
  description: >-
    Recurrent purging is represented upstream of electrolyte, dental, and
    salivary-gland complications commonly monitored in bulimia nervosa.
  downstream:
  - target: Hypokalemia
    description: Electrolyte depletion can manifest clinically as hypokalemia.
    evidence:
    - reference: PMID:11746288
      reference_title: "Laboratory screening for electrolyte abnormalities and anemia in bulimia nervosa: a controlled study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The substantial frequency of hypokalemia and hypochloremia underscores the importance of an appropriate medical assessment for individuals with this disorder."
      explanation: Supports hypokalemia as a purging-related medical complication.
  - target: Hypochloremia
    description: Gastric hydrochloric-acid loss through recurrent vomiting can produce hypochloremia.
    evidence:
    - reference: PMID:11746288
      reference_title: "Laboratory screening for electrolyte abnormalities and anemia in bulimia nervosa: a controlled study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "patients showed more frequent occurrence of low values for serum potassium (6.8% vs. 0.9%; p <.05) and chloride (8.1% vs. 0.9%; p <.02)"
      explanation: Controlled evidence supports low serum chloride as a purging-related electrolyte complication.
  - target: Dental Erosion
    description: Recurrent vomiting can damage dental surfaces.
    evidence:
    - reference: PMID:28972588
      reference_title: "The impact of bulimia nervosa on oral health: A review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "While there is consensus that bulimic behaviour directly causes dental erosion due to vomiting and acidic food choices"
      explanation: Directly supports vomiting-related dental erosion.
  - target: Parotid Gland Enlargement
    description: Recurrent purging can be associated with salivary-gland enlargement.
    evidence:
    - reference: PMID:29618874
      reference_title: "Bilateral Parotid Sialadenosis Associated with Long-Standing Bulimia: A Case Report and Literature Review."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "A 32-year-old woman had severe bilateral parotid sialomegaly for the last 6 years, which had occurred secondary to bulimia nervosa, which she had since 14 years."
      explanation: Case evidence supports parotid enlargement secondary to longstanding bulimia; the specific purging mechanism is not isolated.
  evidence:
  - reference: PMID:11746288
    reference_title: "Laboratory screening for electrolyte abnormalities and anemia in bulimia nervosa: a controlled study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abnormal eating patterns and recurrent purging behaviors can result in
      significant medical complications.
    explanation: >-
      Clinical laboratory evidence supports modeling purging as upstream of
      physiologic medical complications.
phenotypes:
- name: Binge Eating Episodes
  description: >-
    Recurrent binge-eating episodes are a core clinical manifestation of
    bulimia nervosa. HPO does not currently provide a specific binge-eating
    term in the local ontology cache, so this uses the closest broader term.
  phenotype_term:
    preferred_term: Binge eating episodes
    term:
      id: HP:0100738
      label: Abnormal eating behavior
  evidence:
  - reference: DOI:10.1186/s40360-023-00713-7
    reference_title: "Efficacy of pharmacotherapies for bulimia nervosa: a systematic review and meta-analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary outcomes were changes in the frequency of binge eating episodes
      and vomiting episodes from baseline to endpoint.
    explanation: >-
      The systematic review identifies binge-eating episodes as a primary
      bulimia nervosa outcome.
- name: Vomiting
  description: >-
    Self-induced vomiting may be used as a compensatory behavior after binge
    eating.
  phenotype_term:
    preferred_term: Vomiting
    term:
      id: HP:0002013
      label: Vomiting
  evidence:
  - reference: DOI:10.1186/s40360-023-00713-7
    reference_title: "Efficacy of pharmacotherapies for bulimia nervosa: a systematic review and meta-analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary outcomes were changes in the frequency of binge eating episodes
      and vomiting episodes from baseline to endpoint.
    explanation: >-
      The systematic review identifies vomiting episodes as a primary bulimia
      nervosa outcome.
- name: Hypokalemia
  description: >-
    Hypokalemia is a clinically important electrolyte abnormality monitored as
    a purging-related complication.
  phenotype_term:
    preferred_term: Hypokalemia
    term:
      id: HP:0002900
      label: Hypokalemia
  evidence:
  - reference: PMID:11746288
    reference_title: "Laboratory screening for electrolyte abnormalities and anemia in bulimia nervosa: a controlled study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The substantial frequency of hypokalemia and hypochloremia underscores
      the importance of an appropriate medical assessment for individuals with
      this disorder.
    explanation: >-
      Controlled clinical evidence supports hypokalemia as a bulimia nervosa
      complication requiring medical assessment.
- name: Hypochloremia
  description: >-
    Hypochloremia is a purging-related electrolyte abnormality reflecting loss
    of gastric hydrochloric acid through recurrent self-induced vomiting.
  phenotype_term:
    preferred_term: Hypochloremia
    term:
      id: HP:0003113
      label: Hypochloremia
  evidence:
  - reference: PMID:11746288
    reference_title: "Laboratory screening for electrolyte abnormalities and anemia in bulimia nervosa: a controlled study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients showed more frequent occurrence of low values for serum potassium (6.8% vs. 0.9%; p <.05) and chloride (8.1% vs. 0.9%; p <.02)"
    explanation: Controlled evidence shows low serum chloride is significantly more frequent in bulimia nervosa than in controls.
- name: Dental Erosion
  description: >-
    Dental erosion can occur as an oral complication of recurrent vomiting in
    purging presentations.
  phenotype_term:
    preferred_term: Dental erosion
    term:
      id: HP:0000682
      label: Abnormal dental enamel morphology
  evidence:
  - reference: PMID:28972588
    reference_title: "The impact of bulimia nervosa on oral health: A review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While there is consensus that bulimic behaviour directly causes dental
      erosion due to vomiting and acidic food choices, there is less clear
      evidence for a direct link between bulimia nervosa and dental caries,
      although there does still appear to be an association.
    explanation: >-
      Oral-health review evidence directly supports dental erosion as a
      vomiting-related bulimia nervosa complication.
- name: Parotid Gland Enlargement
  description: >-
    Parotid gland enlargement can occur as a salivary-gland complication in
    purging presentations.
  phenotype_term:
    preferred_term: Enlargement of parotid gland
    term:
      id: HP:0011801
      label: Enlargement of parotid gland
  evidence:
  - reference: PMID:29618874
    reference_title: "Bilateral Parotid Sialadenosis Associated with Long-Standing Bulimia: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 32-year-old woman had severe bilateral parotid sialomegaly for the last
      6 years, which had occurred secondary to bulimia nervosa, which she had
      since 14 years.
    explanation: >-
      Case-report and literature-review evidence supports parotid enlargement
      as a bulimia-associated salivary-gland complication.
- name: Depressive Symptoms
  description: >-
    Depressive symptoms are a clinically important psychiatric manifestation

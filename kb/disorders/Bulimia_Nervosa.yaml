- name: Secondary Hyperaldosteronism and Renal Potassium Loss
  description: Volume depletion activates renin-angiotensin-aldosterone signaling. Aldosterone promotes sodium retention at the expense of renal potassium and hydrogen loss. Vomiting-related acid loss, volume contraction and renal bicarbonate retention sustain hypokalemic metabolic alkalosis. Renal potassium loss can exceed the direct gastrointestinal loss.
  biological_scale: TISSUE
  evidence:
  - reference: url:https://www.ccjm.org/content/88/6/333
    reference_title: "Medical complications of bulimia nervosa | Cleveland Clinic Journal of Medicine"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Aldosterone also promotes renal secretion of potassium into the urine and thus hypokalemia.
    explanation: Defines a key renal mechanism.
  - reference: url:https://www.ccjm.org/content/88/6/333
    reference_title: "Medical complications of bulimia nervosa | Cleveland Clinic Journal of Medicine"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: This mechanism of potassium loss is actually a larger contributor to the hypokalemia than the actual gastrointestinal or urinary loses from the behaviors themselves.
    explanation: Distinguishes secondary renal loss from direct loss.
  - reference: url:https://www.ccjm.org/content/88/6/333
    reference_title: "Medical complications of bulimia nervosa | Cleveland Clinic Journal of Medicine"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Intravascular volume depletion resulting from the loss of sodium chloride increases the resorption of bicarbonate within the proximal renal tubule, preventing its loss in the urine
    explanation: Explains maintenance of alkalosis.
  downstream:
  - target: Hypokalemia

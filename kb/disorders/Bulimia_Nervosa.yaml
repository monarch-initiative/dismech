- name: Nucleus Accumbens Volume Reduction
  description: Coordinated multi-site structural MRI analysis identified reduced nucleus accumbens volume in BN compared to controls. The nucleus accumbens is central to reward processing and motivated behavior. Volume reduction may reflect altered reward circuit development or maintenance, though cross-sectional findings cannot establish causation or temporal precedence.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:42747849
    reference_title: "Structural Brain Correlates of Bulimia Nervosa Diagnosis and Symptom Severity: A Coordinated ENIGMA Eating Disorders Working Group Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: the BN group had lower nucleus accumbens volume (Cohen d, -0.20; 95% CI, -0.34 to -0.06)
    explanation: ENIGMA coordinated analysis of 369 BN and 417 control participants showing reduced nucleus accumbens volume as a structural marker of BN diagnosis.
  locations:
  - preferred_term: nucleus accumbens
    term:
      id: UBERON:0001882
      label: nucleus accumbens
  notes: >-
    The ENIGMA study identified reduced nucleus accumbens volume in BN compared to controls, but did not find an association with binge-eating frequency (where reduced volume was associated with superior temporal cortex surface area, not subcortical volume). Nucleus accumbens reduction is a diagnosis-level correlate, not severity-linked.
- name: Superior and Transverse Temporal Cortex Surface Area Reduction
  description: Coordinated multi-site MRI analysis identified reduced cortical surface area (not thickness) in the superior temporal gyrus and transverse temporal cortex regions in BN compared to controls. Surface area reduction showed graded association with binge-eating severity (r = -0.14 to -0.20 across regions). These temporal regions implicate circuits beyond reward circuitry in BN pathophysiology.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:42747849
    reference_title: "Structural Brain Correlates of Bulimia Nervosa Diagnosis and Symptom Severity: A Coordinated ENIGMA Eating Disorders Working Group Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: lower cortical SA of the superior temporal (d, -0.26; 95% CI, -0.41 to -0.12) and transverse temporal cortices (d, -0.24; 95% CI, -0.38 to -0.10)
    explanation: ENIGMA multi-site structural MRI finding showing reduced surface area in temporal cortex regions in BN participants.
  - reference: PMID:42747849
    reference_title: "Structural Brain Correlates of Bulimia Nervosa Diagnosis and Symptom Severity: A Coordinated ENIGMA Eating Disorders Working Group Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Binge-eating frequency was associated with lower SA of the superior temporal cortex, insula, pars orbitalis, and medial orbitofrontal, rostral middle frontal, and isthmus and posterior cingulate gyri (r value range, -0.20 to -0.14)
    explanation: The severity of binge eating shows graded association with cortical surface area reduction in multiple regions, strongest in superior temporal cortex.
  - reference: PMID:42747849
    reference_title: "Structural Brain Correlates of Bulimia Nervosa Diagnosis and Symptom Severity: A Coordinated ENIGMA Eating Disorders Working Group Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Most differences remained significant when controlling for cohort-level variation in body mass index, illness duration, depressive symptoms, psychotropic medication use, and purging as a compensatory behavior.
    explanation: Multi-site ENIGMA findings remain robust to confounding by BMI, depression, illness duration, and medication use, strengthening evidence that structural differences are associated with BN rather than being secondary to comorbidities.

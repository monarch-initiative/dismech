pathophysiology:
- name: Multifactorial Liability
  description: Familial genetic liability interacts with psychological and social risk factors. Twin and register-based estimates support heritability, but do not establish a single causal gene, a fixed molecular lesion, or genetic determinism.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:1842216
    reference_title: The genetic epidemiology of bulimia nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Proband-wise concordance for narrowly defined bulimia was 22.9% in monozygotic and 8.7% in dizygotic twins.
    explanation: Greater monozygotic concordance supports familial genetic liability in this female twin cohort.
  - reference: PMID:1842216
    reference_title: The genetic epidemiology of bulimia nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Risk factors for bulimia included 1) birth after 1960, 2) low paternal care, 3) a history of wide weight fluctuation, dieting, or frequent exercise, 4) a slim ideal body image, 5) low self-esteem, 6) an external locus of control, and 7) high levels of neuroticism.
    explanation: These are associated risk factors, not independently proven causal exposures.
  downstream:
  - target: Shape and Weight Overvaluation with Dietary Restraint
    causal_link_type: UNKNOWN
    description: Familial and psychosocial susceptibility is associated with dieting, slim body ideals and low self-esteem; the direction and intermediates linking these factors remain uncertain.
    evidence:
    - reference: PMID:1842216
      reference_title: The genetic epidemiology of bulimia nervosa.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: Risk factors for bulimia included 1) birth after 1960, 2) low paternal care, 3) a history of wide weight fluctuation, dieting, or frequent exercise, 4) a slim ideal body image, 5) low self-esteem, 6) an external locus of control, and 7) high levels of neuroticism.
      explanation: Associated risk factors connect liability to the cognitive-behavioral model; the twin study does not establish this causal sequence.
      directness: INDIRECT
- name: Shape and Weight Overvaluation with Dietary Restraint
  description: Excessive dependence of self-evaluation on shape or weight, restrictive eating rules, and irregular eating contribute to a cognitive-behavioral maintenance model. These are targets of CBT; their relationship to molecular or imaging findings is not an established linear causal sequence.
  biological_scale: ORGANISM
  evidence:
  - reference: url:https://www.ccjm.org/content/88/6/333
    reference_title: "Medical complications of bulimia nervosa | Cleveland Clinic Journal of Medicine"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: BN is characterized by overvaluation of body weight and shape and recurrent binge-eating
    explanation: Clinical synthesis identifies the central cognitive and behavioral features.
  - reference: url:https://www.nice.org.uk/guidance/NG69/chapter/recommendations
    reference_title: "Recommendations | Eating disorders: recognition and treatment | Guidance | NICE"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: follow by addressing the eating disorder psychopathology (for example, the extreme dietary restraint, the concerns about body shape and weight, and the tendency to binge eat in response to difficult thoughts and feelings)
    explanation: Guideline identifies the maintenance processes targeted by CBT.
  downstream:
  - target: Loss-of-Control Binge Eating
    description: Restrictive eating and shape/weight concerns are proposed contributors to the maintenance of binge eating.
    causal_link_type: UNKNOWN
- name: Negative Affect Around Binge Episodes
  description: Negative affect commonly rises before binge eating. Whether it is lower afterward depends on the sampling time and analysis. In a BN ecological momentary assessment reanalysis, proximal post-binge affect was higher than the earlier pre-binge rating, while modeled trajectories could still decline after an episode. This supports a qualified affect-regulation model, not universal or proven relief from bingeing or purging.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:21574678
    reference_title: "Revisiting the affect regulation model of binge eating: a meta-analysis of studies using ecological momentary assessment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Results supported greater NA preceding binge eating relative to average affect (ES = 0.63) and affect before regular eating (ES = 0.68).
    explanation: The meta-analysis includes several binge-eating diagnoses; it supports an antecedent association rather than BN-specific causal proof.
  - reference: PMID:28851137
    reference_title: "Negative affect and binge eating: Reconciling differences between two analytic approaches in ecological momentary assessment research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The results indicate that post-binge ratings of negative affect were significantly higher than the pre-binge ratings of negative affect for women in both Study 1-AN and Study 2-BN.
    explanation: Full-text results resolve the opposite direction stated in the abstract. BN results are analyzed separately from AN.
  - reference: PMID:28851137
    reference_title: "Negative affect and binge eating: Reconciling differences between two analytic approaches in ecological momentary assessment research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: the post-binge ratings were made significantly closer in time to the binge-eating episode than the pre-binge ratings
    explanation: Unequal timing limits inference from a simple before/after comparison; binge-only episodes were analyzed.
    directness: INDIRECT
  downstream:
  - target: Loss-of-Control Binge Eating
    description: Negative affect is a temporally associated antecedent and proposed trigger; observational assessments do not establish causation.
    causal_link_type: UNKNOWN
- name: Reward and Inhibitory-Control Circuit Differences
  description: Human imaging identifies altered striatal, prefrontal, thalamic, sensorimotor and visual network function. Direction varies by network and paradigm, so this is not a uniform reward deficit. Resting-state correlations do not measure neuronal inhibition directly and cannot establish whether findings are causes or consequences of illness.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:32215560
    reference_title: Disturbed Resting-State Whole-Brain Functional Connectivity of Striatal Subregions in Bulimia Nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We calculated the functional connectivity of striatal subregions based on the resting-state functional Magnetic Resonance Imaging data of 51 bulimia nervosa patients and 53 healthy women.
    explanation: Defines the primary human imaging cohort.
  - reference: PMID:32215560
    reference_title: Disturbed Resting-State Whole-Brain Functional Connectivity of Striatal Subregions in Bulimia Nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: the molecular basis of the striatal RSFC changes observed in our study is unclear
    explanation: The full-text limitation prevents assignment of a measured serotonin or dopamine lesion from these imaging data.
    directness: INDIRECT
  - reference: PMID:32215560
    reference_title: Disturbed Resting-State Whole-Brain Functional Connectivity of Striatal Subregions in Bulimia Nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Only for the putamen subregions, we observed reduced negative functional connectivity in the prefrontal (bilateral superior and middle frontal gyri) and parietal (right inferior parietal lobe and precuneus) areas.
    explanation: A specific connectivity result, not proof of globally reduced reward activation.

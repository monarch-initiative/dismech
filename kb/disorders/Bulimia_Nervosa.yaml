- name: Salivary Acinar Enlargement
  description: Vomiting-associated sialadenosis consists of non-inflammatory acinar hypertrophy, usually involving both parotid glands. The precise trigger is uncertain; it must not be equated with inflammatory sialadenitis. Serum amylase elevation may be salivary rather than pancreatic.
  biological_scale: TISSUE
  evidence:
  - reference: url:https://www.ccjm.org/content/88/6/333
    reference_title: "Medical complications of bulimia nervosa | Cleveland Clinic Journal of Medicine"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Pathology study reveals hypertrophied acinar cells with otherwise preserved architecture without evidence of inflammation.
    explanation: Describes salivary tissue pathology.
  - reference: PMID:25866627
    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Isoenzyme studies further demonstrate that the elevations in serum amylase originate from salivary glands as opposed to the pancreas
    explanation: Supports the salivary origin of hyperamylasemia in the studied purging population.
  downstream:
  - target: Parotid Gland Enlargement
    description: Acinar hypertrophy manifests as gland enlargement.
    causal_link_type: DIRECT
  - target: Hyperamylasemia

- name: Medication Safety Review
  description: Review medications in the context of electrolyte disturbance, cardiac risk and comorbid psychiatric needs. Bupropion is contraindicated with a current or prior diagnosis of bulimia nervosa because of increased seizure risk; it must not be generalized from a list of antidepressants studied in eating disorders.

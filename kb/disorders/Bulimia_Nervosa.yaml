- name: Purging-Related Volume and Electrolyte Loss
  description: Purging can cause loss of sodium chloride, water and potassium. The pattern depends on vomiting, diuretic use or laxative-induced diarrhea and on frequency. Normal electrolytes in intermittent purging do not exclude BN.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:25866627
    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Repeated episodes of vomiting can lead to dehydration and subsequent upregulation of the secretion of the renin-angiotensin-aldosterone steroid hormone system.
    explanation: Connects volume depletion to compensatory hormonal activation.
  - reference: PMID:25866627
    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The majority of patients with bulimia, who vomit only occasionally, will have normal serum electrolytes
    explanation: Explains why normal laboratory findings do not exclude the syndrome.
  downstream:

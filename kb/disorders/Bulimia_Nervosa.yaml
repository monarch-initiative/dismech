- name: Investigational Lisdexamfetamine
  description: Lisdexamfetamine remains investigational for BN. An uncontrolled eight-week study enrolled 23 participants, with 18 completing per protocol, and reported symptom reductions alongside mean heart-rate increase of 12.1 beats/min and weight loss of 2.1 kg; one participant was withdrawn for substantial weight loss. Secondary analyses are from the same cohort. These findings and the BED indication do not establish BN efficacy or support routine prescribing.

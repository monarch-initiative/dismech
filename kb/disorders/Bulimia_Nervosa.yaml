    reference_title: "Comorbid depressive symptoms and self‐esteem improve after either cognitive‐behavioural therapy or family‐based treatment for adolescent bulimia nervosa"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study examined the effect of family‐based treatment for bulimia
      nervosa (FBT‐BN) and cognitive behavioral therapy for adolescents
      (CBT‐A) on depressive symptoms and self‐esteem in adolescents with BN.
    explanation: >-
      The trial context directly identifies depressive symptoms as a clinical
      comorbidity target in adolescents with bulimia nervosa.
- name: Anxiety
  description: Anxiety-spectrum disorders are an important psychiatric comorbidity of bulimia nervosa.
  phenotype_term:
    preferred_term: Anxiety
    term:
      id: HP:0000739
      label: Anxiety
  evidence:
  - reference: PMID:1842216
    reference_title: The genetic epidemiology of bulimia nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant comorbidity was found between bulimia and anorexia nervosa, alcoholism, panic disorder, generalized anxiety disorder, phobia, and major depression."
    explanation: Population-based twin evidence supports anxiety disorders as significant bulimia nervosa comorbidities.
- name: Impulsivity
  description: Trait impulsivity and impaired inhibitory control are clinically relevant to the binge-eating model of bulimia nervosa.
  phenotype_term:
    preferred_term: Impulsivity
    term:
      id: HP:0100710
      label: Impulsivity
  evidence:
  - reference: PMID:23658085
    reference_title: Neurocircuit function in eating disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the impulsivity model of binge eating in bulimia nervosa"
    explanation: Supports impulsivity as a central trait in a neurocircuit model of bulimia nervosa binge eating.
genetic:
- name: Complex eating-disorder genetic liability
  association: Risk Factor
  relationship_type: UNKNOWN
  notes: >-
    Bulimia nervosa is represented as complex and polygenic; current entry
    does not assert a single causal gene.
  evidence:
  - reference: DOI:10.1101/2024.10.20.24315825
    reference_title: "Shared Genetic Architecture Between Eating Disorders, Mental Health Conditions, and Cardiometabolic Diseases: A Comprehensive Population-Wide Study Across Two Countries"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eating disorders arise from a complex interaction of genetic and
      environmental influences.
    explanation: >-
      Population-register study supports complex genetic and environmental
      liability for eating disorders, including bulimia nervosa.
  - reference: PMID:1842216
    reference_title: The genetic epidemiology of bulimia nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Proband-wise concordance for narrowly defined bulimia was 22.9% in monozygotic and 8.7% in dizygotic twins."
    explanation: Higher monozygotic than dizygotic twin concordance supports a genetic contribution to bulimia nervosa liability.
treatments:
- name: Cognitive Behavioral Therapy
  description: >-
    CBT is a psychosocial intervention used in bulimia nervosa treatment and is
    part of the evidence base for eating-disorder care.
  treatment_term:
    preferred_term: cognitive behavior therapy
    term:
      id: MAXO:0000883
      label: cognitive behavior therapy
  evidence:
  - reference: DOI:10.3389/fpsyg.2024.1386347
    reference_title: "Bulimia nervosa and treatment-related disparities: a review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment practices included both pharmacological and psychosocial
      interventions, such as cognitive behavioral therapy (CBT) and limited
      motivational interviewing (MI).
    explanation: >-
      Review evidence supports CBT as a psychosocial treatment used for bulimia
      nervosa.
  - reference: PMID:17370288
    reference_title: "Bulimia nervosa treatment: a systematic review of randomized controlled trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cognitive behavioral therapy reduces core behavioral and psychological features in the short and long term."
    explanation: Systematic review of randomized trials supports CBT reducing core bulimia nervosa features.
- name: Family-Based Therapy for Adolescents
  description: >-
    Family-based treatment for bulimia nervosa is used in adolescents and can
    improve bulimia nervosa symptoms alongside depressive symptoms and
    self-esteem.
  treatment_term:
    preferred_term: Family Therapy
    term:
      id: NCIT:C93347
      label: Family Therapy
  evidence:
  - reference: DOI:10.1002/erv.2582
    reference_title: Comorbid depressive symptoms and self-esteem improve after either cognitive-behavioural therapy or family-based treatment for adolescent bulimia nervosa
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study examined the effect of family‐based treatment for bulimia
      nervosa (FBT‐BN) and cognitive behavioral therapy for adolescents (CBT‐A)
      on depressive symptoms and self‐esteem in adolescents with BN.
    explanation: >-
      Randomized adolescent BN trial evidence supports FBT-BN as a treatment
      modality for adolescent bulimia nervosa.
- name: Fluoxetine Pharmacotherapy
  description: >-
    Fluoxetine is an SSRI pharmacotherapy with randomized trial evidence for
    reducing vomiting and binge-eating episode frequency in bulimia nervosa.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fluoxetine
      term:
        id: CHEBI:5118
        label: fluoxetine
  target_mechanisms:
  - target: Serotonergic Dysregulation
    treatment_effect: MODULATES
    description: Fluoxetine modulates serotonin signaling and reduces binge-eating and vomiting outcomes.
    evidence:
    - reference: DOI:10.1192/bjp.166.5.660
      reference_title: Long-Term Fluoxetine Treatment of Bulimia Nervosa
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Compared with placebo, fluoxetine treatment resulted in significantly greater reductions in vomiting (F [1,360] = 14.73, P< 0.0001) and binge-eating (F [1,360] = 14.39, P=0.0002) episodes per week at endpoint and improvement in other outcome measures."
      explanation: Supports fluoxetine acting on the modeled treatment-relevant serotonergic mechanism to reduce both core outcomes.
  evidence:
  - reference: DOI:10.1192/bjp.166.5.660
    reference_title: Long-Term Fluoxetine Treatment of Bulimia Nervosa
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fluoxetine appeared to be safe and effective in patients with bulimia
      nervosa for up to 16 weeks.
    explanation: >-
      Randomized clinical trial evidence supports fluoxetine pharmacotherapy for
      bulimia nervosa.
  - reference: PMID:17370288
    reference_title: "Bulimia nervosa treatment: a systematic review of randomized controlled trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fluoxetine (60 mg/day) decreases the core symptoms of binge eating and purging and associated psychological features in the short term."
    explanation: Systematic review evidence supports fluoxetine 60 mg/day reducing core binge and purge symptoms.
- name: SSRI and Antidepressant Pharmacotherapy
  description: >-
    Pharmacotherapies including SSRIs, TCAs, MAOIs, topiramate, lithium, and

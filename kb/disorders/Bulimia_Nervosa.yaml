    reference_title: "Risk factors for eating disorders: findings from a rapid review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: these experiences are more strongly associated with binge-purge type disorders such as BN, BED, and AN-BP
    explanation: The rapid review identifies an association with childhood trauma and abuse across binge/purge diagnoses; it is not a necessary or sufficient cause of BN.

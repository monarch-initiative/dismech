    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: With repetitive vomiting, the esophageal epithelium suffers repeated abnormal exposure to acidic gastric contents and microtrauma.
    explanation: Provides the direct local injury mechanism.
  - reference: url:https://www.ccjm.org/content/88/6/333

- name: Loss-of-Control Binge Eating
  description: Recurrent episodes involve an objectively large amount of food and a sense of loss of control under DSM criteria. Binge eating also occurs in other eating disorders; the associated compensatory behavior and shape/weight psychopathology define the BN context.
  biological_scale: ORGANISM
  evidence:
  - reference: url:https://www.ccjm.org/content/88/6/333
    reference_title: "Medical complications of bulimia nervosa | Cleveland Clinic Journal of Medicine"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: consuming an excessive caloric amount in a short period of time, usually a 2-hour period, that the patient feels unable to control
    explanation: Defines the binge event in this clinical review.
  downstream:
  - target: Compensatory Behaviors
    description: Binge episodes are followed by attempts to counter perceived weight gain.
    causal_link_type: DIRECT
  - target: Bulimic Eating Behavior
    description: Binge eating with compensatory behavior constitutes the defining clinical pattern.
    causal_link_type: DIRECT
- name: Compensatory Behaviors
  description: Vomiting and laxative or diuretic misuse are purging methods; fasting and excessive exercise are nonpurging compensatory behaviors. Their physical consequences differ. The following electrolyte and acid-exposure pathways specifically concern relevant purging methods.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:42532999
    reference_title: Bulimia nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: its cardinal feature is recurrent binge eating followed by extreme weight control or compensatory behaviours in association with high levels of weight and shape, and other body image and eating, preoccupations.
    explanation: The contemporary primer defines the syndrome.
  - reference: url:https://www.nice.org.uk/guidance/NG69/chapter/recommendations
    reference_title: "Recommendations | Eating disorders: recognition and treatment | Guidance | NICE"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: compensatory behaviours, including laxative or diet pill misuse, vomiting or excessive exercise
    explanation: Guideline assessment encompasses multiple forms of compensation.
  downstream:

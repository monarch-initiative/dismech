    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The resultant hypokalaemia can result in a prolonged QTc interval putting the patient at risk for significant arrhythmias resulting in syncope and palpitations.
    explanation: Links potassium disturbance to cardiac electrical risk.
  downstream:
  - target: Prolonged QTc Interval
    description: Hypokalemia can prolong corrected QT.
    causal_link_type: DIRECT

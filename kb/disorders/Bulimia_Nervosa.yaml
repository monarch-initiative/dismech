- name: Hypokalemia-Related Cardiac Electrical Instability
  description: Purging-related hypokalemia and acid-base disturbance can prolong repolarization and predispose to serious ventricular arrhythmias, including torsades de pointes. These are secondary medical complications, not a defining inherited long-QT syndrome.
  biological_scale: TISSUE
  evidence:

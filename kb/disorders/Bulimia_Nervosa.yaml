    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: requires episodes of bingeing and compensatory behaviors in BN to occur at least once per week over the course of 3 months and not occur during an episode of anorexia nervosa.

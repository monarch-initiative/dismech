    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: patients with binge-eating disorder tend to be overweight or obese, as they do not purge after binge episodes.
    explanation: The review contrasts binge-eating disorder with BN. Regular compensation is absent in BED; body weight alone is not diagnostic.

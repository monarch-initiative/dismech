- name: Regular Eating and Cessation of Compensatory Behaviors
  description: Establish regular meals within psychological treatment, with nutritional support as needed. Explain that laxatives and diuretics do not prevent calorie absorption; reduce and stop misuse with clinical support, and stop excessive exercise. Weight loss is not the purpose of BN treatment.

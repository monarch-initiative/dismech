    description: Selected short-term aldosterone blockade can reduce post-purging fluid retention.
- name: Dental Care and Acid-Exposure Reduction
  description: Arrange regular dental assessment and treatment of erosive injury. After vomiting, avoid immediate tooth brushing and use a non-acid rinse; avoid highly acidic food and drinks. Established enamel loss is irreversible, so behavioral recovery does not itself restore lost enamel.

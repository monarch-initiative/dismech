- name: Post-Purging Sodium and Water Retention
  description: In pseudo-Bartter physiology, aldosterone remains elevated after purging stops. Continued renal sodium retention without ongoing fluid loss can produce rapid edema and distressing weight gain, especially with rapid saline administration. This is acquired physiology, not inherited Bartter syndrome.
  biological_scale: ORGANISM
  evidence:
  - reference: url:https://www.ccjm.org/content/88/6/333
    reference_title: "Medical complications of bulimia nervosa | Cleveland Clinic Journal of Medicine"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The reason is that the serum aldosterone levels remain high, causing salt and water retention even though the patient is no longer losing fluid, as the purging has ceased.
    explanation: Explains edema after cessation.
  - reference: PMID:25866627
    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: can result in severe peripheral edema formation especially if the patient with bulimia is given intravenous saline-containing fluids in a rapid manner
    explanation: Documents the fluid-treatment interaction.
  downstream:
  - target: Peripheral Edema
    description: Retained sodium and water cause edema.
    causal_link_type: DIRECT
- name: Laxative-Related Bicarbonate Loss
  description: Acute laxative-induced diarrhea removes bicarbonate and can cause normal-anion-gap metabolic acidosis. Chronic diarrhea with pronounced volume depletion can instead produce secondary hyperaldosteronism and alkalosis; not every purging method produces the same acid-base pattern.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:25866627
    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Electrolytes lost through laxative use include chloride, calcium, bicarbonate, and potassium.
    explanation: Identifies direct losses.
  - reference: PMID:25866627
    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: acute diarrhea of shorter duration results in a hyperchloremic metabolic acidosis
    explanation: Supports the acidosis pathway.
  downstream:
  - target: Metabolic Acidosis
    description: Fecal bicarbonate loss can produce hyperchloremic acidosis.
    causal_link_type: DIRECT
phenotypes:
- name: Bulimic Eating Behavior
  description: Recurrent binge eating with compensatory behavior is the defining pattern. The HPO term captures the combined behavioral phenotype, rather than binge eating in isolation.
  phenotype_term:
    preferred_term: Bulimia
    term:
      id: HP:0100739
      label: Bulimia
  evidence:
  - reference: PMID:42532999
    reference_title: Bulimia nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: its cardinal feature is recurrent binge eating followed by extreme weight control or compensatory behaviours
    explanation: Contemporary synthesis supports the combined phenotype.
- name: Vomiting
  description: Self-induced vomiting is a common compensatory method but is not required in every BN presentation.
  phenotype_term:
    preferred_term: Vomiting
    term:
      id: HP:0002013
      label: Vomiting
  evidence:
  - reference: PMID:25866627
    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Self-induced vomiting is the most frequently used purging method
    explanation: Supports vomiting while allowing other methods.
- name: Hypokalemia
  description: Purging-related hypokalemia may be clinically silent or life-threatening. Frequency depends on setting and behavior; it occurred in 6.8% of otherwise healthy outpatient women in one controlled study.
  phenotype_term:
    preferred_term: Hypokalemia
    term:
      id: HP:0002900
      label: Hypokalemia
  evidence:
  - &id001
    reference: PMID:11746288
    reference_title: "Laboratory screening for electrolyte abnormalities and anemia in bulimia nervosa: a controlled study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: patients showed more frequent occurrence of low values for serum potassium (6.8% vs. 0.9%; p <.05) and chloride (8.1% vs. 0.9%; p <.02).
    explanation: Study of 74 otherwise healthy, medication-free, normal-weight outpatient women with purging BN; these rates are not universal.
- name: Hypochloremia
  description: Low chloride can accompany vomiting or other purging losses; 8.1% of women in the selected outpatient study had low serum chloride.
  phenotype_term:
    preferred_term: Hypochloremia
    term:
      id: HP:0003113
      label: Hypochloremia
  evidence:
  - *id001
- name: Metabolic Alkalosis
  description: Vomiting and volume-depleting diuretic misuse can produce hypochloremic, hypokalemic metabolic alkalosis; chronic laxative-associated volume depletion may do likewise.
  phenotype_term:
    preferred_term: Metabolic alkalosis
    term:
      id: HP:0200114
      label: Metabolic alkalosis
  evidence:
  - reference: url:https://www.ccjm.org/content/88/6/333
    reference_title: "Medical complications of bulimia nervosa | Cleveland Clinic Journal of Medicine"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Patients with self-induced vomiting or diuretic abuse, or both, have been shown to present with hypokalemia, hypochloremia, and a metabolic alkalosis.
    explanation: Identifies the clinical biochemical pattern.
- name: Metabolic Acidosis
  description: Shorter-duration laxative-induced diarrhea may produce hyperchloremic metabolic acidosis rather than alkalosis.
  phenotype_term:
    preferred_term: Metabolic acidosis
    term:
      id: HP:0001942
      label: Metabolic acidosis
  evidence:
  - reference: PMID:25866627
    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: acute diarrhea of shorter duration results in a hyperchloremic metabolic acidosis
    explanation: Supports the method-specific complication.
- name: Hyponatremia
  description: Hyponatremia can accompany purging-related fluid and sodium disturbance; it is not an obligatory finding.
  phenotype_term:
    preferred_term: Hyponatremia
    term:
      id: HP:0002902
      label: Hyponatremia
  evidence:
  - reference: url:https://www.ccjm.org/content/88/6/333
    reference_title: "Medical complications of bulimia nervosa | Cleveland Clinic Journal of Medicine"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Hyponatremia can also be present with these 3 purging behaviors.
    explanation: Clinical synthesis describes a possible complication.
- name: Dehydration
  description: Vomiting, laxative misuse or diuretic misuse can cause fluid depletion.
  phenotype_term:
    preferred_term: Dehydration
    term:
      id: HP:0001944
      label: Dehydration
  evidence:
  - reference: PMID:25866627
    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Repeated episodes of vomiting can lead to dehydration
    explanation: Supports dehydration.
- name: Orthostatic Hypotension
  description: Volume depletion may cause orthostatic hypotension and presyncope.
  phenotype_term:
    preferred_term: Orthostatic hypotension
    term:
      id: HP:0001278
      label: Orthostatic hypotension
  evidence:
  - reference: PMID:25866627
    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Dehydration as a result of repeated episodes of emesis can result in both resting and exertional sinus tachycardia, hypotension, and orthostasis.
    explanation: Supports hemodynamic complications.
- name: Prolonged QTc Interval
  description: Acquired QTc prolongation can develop with hypokalemia; it is not universal or evidence for congenital long-QT disease.
  phenotype_term:
    preferred_term: Prolonged QTc interval
    term:
      id: HP:0005184
      label: Prolonged QTc interval
  evidence:
  - reference: PMID:25866627
    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The resultant hypokalaemia can result in a prolonged QTc interval
    explanation: Supports the acquired ECG abnormality.
- name: Cardiac Arrhythmia
  description: Electrolyte disturbance can produce clinically important arrhythmias, including torsades de pointes in severe hypokalemia.
  phenotype_term:
    preferred_term: Arrhythmia
    term:
      id: HP:0011675
      label: Arrhythmia
  evidence:
  - reference: PMID:25866627
    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The most severe of these is a specific type of ventricular tachycardia known as torsades de pointes that can be fatal
    explanation: Documents a severe arrhythmic complication.
- name: Syncope
  description: Syncope may occur with arrhythmia or marked hemodynamic disturbance.
  phenotype_term:
    preferred_term: Syncope
    term:
      id: HP:0001279
      label: Syncope
  evidence:
  - reference: PMID:25866627
    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: significant arrhythmias resulting in syncope and palpitations
    explanation: Supports syncope as a complication.
- name: Peripheral Edema
  description: Rapid edema can follow purging cessation because secondary aldosterone elevation persists, especially if fluid replacement is excessive.
  phenotype_term:
    preferred_term: Edema
    term:
      id: HP:0000969
      label: Edema
  evidence:
  - reference: PMID:25866627
    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: can result in severe peripheral edema formation especially if the patient with bulimia is given intravenous saline-containing fluids in a rapid manner
    explanation: Supports the conditional edema phenotype.
- name: Dental Erosion
  description: Acquired enamel erosion, often on lingual maxillary surfaces, follows acid exposure during vomiting. The broader HPO enamel-morphology term is used because a specific dental-erosion term was not found; developmental enamel hypoplasia would misrepresent this acquired process.
  phenotype_term:
    preferred_term: Dental erosion
    term:
      id: HP:0000682
      label: Abnormal dental enamel morphology
    coarse_binding_basis: NO_HPO_TERM
    term_gap: HPO searches for dental erosion and enamel erosion found no dedicated acquired-erosion term. Abnormal dental enamel morphology is the closest broader binding; developmental enamel hypoplasia would assert a different process. No term request has been filed.
  evidence:
  - reference: PMID:25866627
    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Dental erosions typically occur on the lingual surface of the maxillary teeth.
    explanation: Defines the distribution of erosion.
  - reference: PMID:28972588
    reference_title: "The impact of bulimia nervosa on oral health: A review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: While there is consensus that bulimic behaviour directly causes dental erosion due to vomiting and acidic food choices, there is less clear evidence for a direct link between bulimia nervosa and dental caries
    explanation: Supports erosion and limits extrapolation to caries.
- name: Parotid Gland Enlargement
  description: Usually bilateral non-inflammatory sialadenosis can accompany recurrent vomiting and may become conspicuous after cessation.
  phenotype_term:
    preferred_term: Enlargement of parotid gland
    term:
      id: HP:0011801
      label: Enlargement of parotid gland
  evidence:
  - reference: PMID:25866627
    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The bilateral parotid glands are the glands most commonly involved, but submandibular enlargement may also be seen
    explanation: Specifies the glands involved.
- name: Hyperamylasemia
  description: Elevated serum amylase can originate from salivary glands in purging presentations; total amylase elevation alone does not establish pancreatitis.
  phenotype_term:
    preferred_term: Hyperamylasemia
    term:
      id: HP:0410288
      label: Hyperamylasemia
  evidence:
  - reference: PMID:25866627
    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Isoenzyme studies further demonstrate that the elevations in serum amylase originate from salivary glands as opposed to the pancreas
    explanation: Supports salivary hyperamylasemia.
- name: Gastroesophageal Reflux
  description: Reflux symptoms are reported in vomiting presentations. Symptom severity and endoscopic injury may be discordant.
  phenotype_term:
    preferred_term: Gastroesophageal reflux
    term:
      id: HP:0002020
      label: Gastroesophageal reflux
  evidence:
  - reference: PMID:25866627
    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Patients who induce vomiting will commonly complain of symptoms consistent with gastroesophageal reflux (GERD), dysphagia, and odynophagia
    explanation: Supports symptomatic reflux.
- name: Esophagitis
  description: Repeated vomiting can produce esophagitis, although endoscopic findings are often normal or mild.
  phenotype_term:
    preferred_term: Esophagitis
    term:
      id: HP:0100633
      label: Esophagitis
  evidence:
  - reference: PMID:25866627
    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: endoscopic evaluation is generally normal or only demonstrates mild esophagitis
    explanation: Keeps the structural finding proportional to the clinical evidence.
- name: Hematemesis
  description: Mallory-Weiss tears after repeated retching can cause blood-streaked vomitus; this is a complication rather than a defining feature.
  phenotype_term:
    preferred_term: Hematemesis
    term:
      id: HP:0002248
      label: Hematemesis
  evidence:
  - reference: url:https://www.ccjm.org/content/88/6/333
    reference_title: "Medical complications of bulimia nervosa | Cleveland Clinic Journal of Medicine"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Mallory-Weiss tears commonly present as blood-streaked or tinged emesis or scant coffee ground emesis following recurrent vomiting episodes.
    explanation: Supports the bleeding manifestation.
- name: Constipation
  description: Constipation may occur during withdrawal from chronic laxative misuse. Permanent cathartic-colon injury with currently used stimulant laxatives remains uncertain.
  phenotype_term:
    preferred_term: Constipation
    term:
      id: HP:0002019
      label: Constipation
  evidence:
  - reference: PMID:25866627
    reference_title: Bulimia Nervosa - medical complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: A history of prolonged laxative use may also produce a more innocuous reflex constipation.
    explanation: Supports rebound constipation.
  - reference: url:https://www.ccjm.org/content/88/6/333
    reference_title: "Medical complications of bulimia nervosa | Cleveland Clinic Journal of Medicine"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: it is currently speculative as to whether this condition truly develops in those with eating disorders and with use of currently available stimulant laxatives.
    explanation: Limits the stronger historical claim about cathartic colon.
- name: Irregular Menstruation
  description: Menstrual irregularity is a possible associated feature; amenorrhea is not a BN diagnostic requirement.
  phenotype_term:
    preferred_term: Irregular menstruation
    term:
      id: HP:0000858
      label: Irregular menstruation
  evidence:
  - reference: url:https://www.ccjm.org/content/88/6/333
    reference_title: "Medical complications of bulimia nervosa | Cleveland Clinic Journal of Medicine"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: A potential endocrine complication of BN is irregular menses
    explanation: Supports the specific menstrual phenotype.
- name: Depressive Symptoms
  description: Depression is an important comorbidity and treatment consideration, not a required feature of BN.
  phenotype_term:
    preferred_term: Depression
    term:
      id: HP:0000716
      label: Depression
  evidence:
  - reference: PMID:1842216
    reference_title: The genetic epidemiology of bulimia nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Significant comorbidity was found between bulimia and anorexia nervosa, alcoholism, panic disorder, generalized anxiety disorder, phobia, and major depression.
    explanation: Population-based clinical study supports comorbidity.
- name: Anxiety
  description: Anxiety disorders commonly co-occur with BN. The cited cross-sectional comorbidity evidence does not establish which disorder began first.
  phenotype_term:
    preferred_term: Anxiety
    term:
      id: HP:0000739
      label: Anxiety
  evidence:
  - reference: PMID:1842216
    reference_title: The genetic epidemiology of bulimia nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Significant comorbidity was found between bulimia and anorexia nervosa, alcoholism, panic disorder, generalized anxiety disorder, phobia, and major depression.
    explanation: Supports comorbidity without an onset-order claim.
- name: Impulsivity
  description: Eating-related disinhibition can occur; generalized trait impulsivity is heterogeneous and must not be treated as universal. In a selected BN feasibility sample excluding ADHD, baseline general impulsivity was not elevated relative to clinical norms.
  phenotype_term:
    preferred_term: Impulsivity
    term:
      id: HP:0100710
      label: Impulsivity
  evidence:
  - reference: PMID:37218020
    reference_title: Secondary outcomes and qualitative findings of an open-label feasibility trial of lisdexamfetamine dimesylate for adults with bulimia nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The average TFEQ Disinhibition score was clinically elevated at baseline
    explanation: Supports eating-specific disinhibition in this selected sample.
  - reference: PMID:37218020
    reference_title: Secondary outcomes and qualitative findings of an open-label feasibility trial of lisdexamfetamine dimesylate for adults with bulimia nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: the BIS-11 impulsivity scales were not elevated at baseline relative to clinical norms
    explanation: Limits the generalized-trait claim.
genetic:
- name: Complex polygenic liability
  association: Risk Factor
  notes: The 1991 female twin study estimated liability heritability at 55%. A 2025 Danish/Swedish register study estimated BN heritability at 0.39 (95% CI 0.32–0.46). These estimates depend on study design and ascertainment; they are not penetrance or individual predictions. The register study did not account for shared environmental effects and did not identify causal genes. A 2026 GWAS of broadly defined binge-eating behavior includes BN, BED and symptom-level cases; its six loci are not BN-specific Mendelian causes.
  evidence:
  - reference: PMID:1842216
    reference_title: The genetic epidemiology of bulimia nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The best-fitting model indicated that familial aggregation was due solely to genetic factors with a heritability of liability of 55%.
    explanation: Model-based estimate in the historic female twin cohort.
  - reference: DOI:10.1038/s41467-025-61496-5
    reference_title: "Shared genetic architecture between eating disorders, mental health conditions, and cardiometabolic diseases: a comprehensive population-wide study across two countries"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'BN as 0.39 (95% CI: 0.32– 0.46)'
    explanation: BN-specific estimate from the published register study, replacing the earlier preprint.
  - reference: DOI:10.1038/s41467-025-61496-5
    reference_title: "Shared genetic architecture between eating disorders, mental health conditions, and cardiometabolic diseases: a comprehensive population-wide study across two countries"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We did not account for the inﬂuence of shared environmental factors among close relatives on heritability and genetic correlation estimates.
    explanation: The full-text limitation constrains causal and quantitative interpretation.
  - reference: DOI:10.1038/s44220-026-00698-2
    reference_title: Genomic meta-analyses of binge-eating behavior and anorexia nervosa yield insights into the unique and shared biology of eating disorder phenotypes
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We identified six BE-associated loci, including loci associated with a higher body mass index and impulse-control behaviors.
    explanation: Indirect evidence from a broad transdiagnostic binge-eating phenotype, not a dedicated BN locus analysis.
    directness: INDIRECT
treatments:
- name: Eating-Disorder-Focused Cognitive Behavioral Therapy
  description: CBT addresses regular eating, rigid dietary rules, overvaluation of shape and weight, emotional triggers and relapse prevention. NICE recommends individual CBT when guided self-help is unsuitable or ineffective; APA recommends eating-disorder-focused CBT for adults together with a serotonin reuptake inhibitor. Medication should not be the sole treatment.
  treatment_term:
    preferred_term: Cognitive Behavior Therapy
    term:
      id: NCIT:C64345
      label: Cognitive Behavior Therapy
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:17370288
    reference_title: "Bulimia nervosa treatment: a systematic review of randomized controlled trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Cognitive behavioral therapy reduces core behavioral and psychological features in the short and long term.
    explanation: Systematic review supports CBT efficacy.
  - reference: url:https://www.nice.org.uk/guidance/NG69/chapter/recommendations
    reference_title: "Recommendations | Eating disorders: recognition and treatment | Guidance | NICE"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: follow by addressing the eating disorder psychopathology (for example, the extreme dietary restraint, the concerns about body shape and weight, and the tendency to binge eat in response to difficult thoughts and feelings)
    explanation: Specifies CBT targets.
  - reference: url:https://www.nice.org.uk/guidance/NG69/chapter/recommendations
    reference_title: "Recommendations | Eating disorders: recognition and treatment | Guidance | NICE"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Do not offer medication as the sole treatment for bulimia nervosa.
    explanation: Psychological care remains central.
  target_mechanisms:
  - target: Shape and Weight Overvaluation with Dietary Restraint
    treatment_effect: MODULATES
    description: CBT addresses rigid eating rules and shape/weight concerns.
  - target: Negative Affect Around Binge Episodes
    treatment_effect: MODULATES
    description: CBT develops responses to difficult thoughts and feelings that can trigger binge eating.
- name: Guided Cognitive Behavioral Self-Help
  description: NICE advises considering BN-focused guided self-help for adults, using structured cognitive behavioral materials with brief supportive sessions. Assess response and consider individual CBT if it is unacceptable, contraindicated or ineffective after four weeks.
  treatment_term:
    preferred_term: Cognitive Behavior Therapy
    term:
      id: NCIT:C64345
      label: Cognitive Behavior Therapy
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: url:https://www.nice.org.uk/guidance/NG69/chapter/recommendations
    reference_title: "Recommendations | Eating disorders: recognition and treatment | Guidance | NICE"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Consider bulimia-nervosa-focused guided self-help for adults with bulimia nervosa.
    explanation: Adult guided self-help recommendation.
  - reference: url:https://www.nice.org.uk/guidance/NG69/chapter/recommendations
    reference_title: "Recommendations | Eating disorders: recognition and treatment | Guidance | NICE"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: use cognitive behavioural self-help materials for eating disorders
    explanation: Specifies the intervention content.
- name: Family-Based Treatment for Adolescents
  description: Family-based treatment collaboratively supports regular eating and reduction of compensatory behaviors without blaming families. In a randomized trial of adolescents with full or partial BN, FBT-BN yielded higher abstinence than adolescent CBT at end of treatment and six months, but the difference was not significant at twelve months. Missing follow-up and specialized settings limit generalization. Individual CBT is an alternative when family treatment is unsuitable or ineffective.
  treatment_term:
    preferred_term: Family Therapy
    term:
      id: NCIT:C93347
      label: Family Therapy
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: url:https://www.nice.org.uk/guidance/NG69/chapter/recommendations
    reference_title: "Recommendations | Eating disorders: recognition and treatment | Guidance | NICE"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: use a collaborative approach between the parents and the young person to establish regular eating patterns and minimise compensatory behaviours
    explanation: Family involvement is collaborative, not an assertion of family causation.
  - reference: PMID:26506579
    reference_title: Randomized Clinical Trial of Family-Based Treatment and Cognitive-Behavioral Therapy for Adolescent Bulimia Nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Participants in FBT-BN achieved higher abstinence rates than in CBT-A at end of treatment (39% versus 20%; p = .040, number needed to treat [NNT] = 5) and at 6-month follow-up (44% versus 25%; p = .030, NNT = 5).
    explanation: Randomized comparison; full text identifies 109 participants in these two arms of a three-arm study.
  - reference: PMID:26506579
    reference_title: Randomized Clinical Trial of Family-Based Treatment and Cognitive-Behavioral Therapy for Adolescent Bulimia Nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Abstinence rates between these 2 groups did not differ statistically at 12-month follow-up
    explanation: The longer follow-up does not establish sustained comparative superiority.
  target_mechanisms:
  - target: Compensatory Behaviors
    treatment_effect: MODULATES
    description: Family-supported behavior change aims to reduce compensation.
  - target: Loss-of-Control Binge Eating
    treatment_effect: MODULATES
    description: Supported regular eating aims to interrupt recurrent binge episodes.
- name: Fluoxetine Pharmacotherapy
  description: Fluoxetine 60 mg/day has placebo-controlled evidence for reducing binge and vomiting frequency in adults. APA recommends a serotonin reuptake inhibitor with CBT initially or after minimal response to psychotherapy by six weeks. Treatment response does not demonstrate a primary serotonin deficiency. Insomnia, nausea, asthenia and tremor occurred more often than with placebo in the founding trial.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fluoxetine
      term:
        id: CHEBI:5118
        label: fluoxetine
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:1550466
    reference_title: "Fluoxetine in the treatment of bulimia nervosa. A multicenter, placebo-controlled, double-blind trial. Fluoxetine Bulimia Nervosa Collaborative Study Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Fluoxetine at 60 mg/d proved superior to placebo in decreasing the frequency of weekly binge-eating and vomiting episodes at end point.
    explanation: Eight-week randomized trial of 387 outpatient women, comparing 60 mg, 20 mg and placebo.
  - reference: url:https://www.guidelinecentral.com/guideline/1971974/pocket-guide/2441963/
    reference_title: APA Treatment of Patients With Eating Disorders Guideline Pocket Guide - Guideline Central
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: either initially or if there is minimal or no response to psychotherapy alone by 6 weeks of treatment.
    explanation: The final APA 2023 recommendation combines medication with eating-disorder-focused CBT.
  - reference: PMID:1550466
    reference_title: "Fluoxetine in the treatment of bulimia nervosa. A multicenter, placebo-controlled, double-blind trial. Fluoxetine Bulimia Nervosa Collaborative Study Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Several adverse events (ie, insomnia, nausea, asthenia, and tremor) occurred significantly more frequently with fluoxetine (60 or 20 mg/d) than with placebo.
    explanation: Trial adverse effects; discontinuation due to adverse events did not differ significantly.
  target_mechanisms:
  - target: Loss-of-Control Binge Eating
    treatment_effect: MODULATES
    description: Fluoxetine can reduce binge frequency; the disease-level molecular mechanism remains uncertain.
  - target: Compensatory Behaviors
    treatment_effect: MODULATES
    description: Randomized evidence supports reduced vomiting frequency.
- name: Off-Label Topiramate
  description: Topiramate has randomized short-term efficacy evidence and is recommended in the 2023 WFSBP pharmacological guideline, but has no eating-disorder marketing authorization. In a 69-person trial with 64 included in the intention-to-treat analysis, weekly binge/purge days decreased more than with placebo; not every secondary endpoint was significant. Specialist assessment of tolerability and individual risks is required.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: topiramate
      term:
        id: CHEBI:63631
        label: topiramate
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:14658948
    reference_title: "Treatment of bulimia nervosa with topiramate in a randomized, double-blind, placebo-controlled trial, part 1: improvement in binge and purge measures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The primary efficacy measure, mean weekly number of binge and/or purge days, decreased 44.8% from baseline with topiramate versus 10.7% with placebo (p =.004).
    explanation: Ten-week randomized trial; this is change in days, not a remission rate.
  - reference: PMID:37350265
    reference_title: World Federation of Societies of Biological Psychiatry (WFSBP) guidelines update 2023 on the pharmacological treatment of eating disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Despite the published evidence, olanzapine and topiramate have not received marketing authorisation for use in EDs from any medicine regulatory agency.
    explanation: Guideline separates evidence from regulatory authorization.
  target_mechanisms:
  - target: Loss-of-Control Binge Eating
    treatment_effect: MODULATES
    description: Short-term trial evidence supports reduction in binge/purge days.
- name: Medical Stabilization and Electrolyte Replacement
  description: Assess fluid and electrolyte balance and ECG risk in purging presentations. Severe electrolyte imbalance, dehydration or impending organ failure requires urgent medical care. Replace potassium and correct volume depletion under monitoring; oral replacement is preferred when the disturbance is not severe and absorption is adequate. Rapid fluid replacement can worsen pseudo-Bartter edema.
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
    therapeutic_agent:
    - preferred_term: potassium chloride
      term:
        id: CHEBI:32588
        label: potassium chloride
  therapeutic_modality: OTHER
  evidence:
  - reference: url:https://www.nice.org.uk/guidance/NG69/chapter/recommendations
    reference_title: "Recommendations | Eating disorders: recognition and treatment | Guidance | NICE"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Provide acute medical care (including emergency admission) for people with an eating disorder who have severe electrolyte imbalance, severe malnutrition, severe dehydration or signs of incipient organ failure.
    explanation: Defines acute escalation indications.
  - reference: url:https://www.nice.org.uk/guidance/NG69/chapter/recommendations
    reference_title: "Recommendations | Eating disorders: recognition and treatment | Guidance | NICE"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: For people with an eating disorder who need supplements to restore electrolyte balance, offer these orally unless the person has problems with gastrointestinal absorption or the electrolyte disturbance is severe.
    explanation: Replacement route depends on clinical severity.
  - reference: url:https://www.ccjm.org/content/88/6/333
    reference_title: "Medical complications of bulimia nervosa | Cleveland Clinic Journal of Medicine"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Correcting the patient’s volume depletion is required to correct the metabolic alkalosis and interrupt renin-angiotensin-aldosterone system activation.
    explanation: Volume and potassium deficits must be treated together.
  target_mechanisms:
  - target: Purging-Related Volume and Electrolyte Loss
    treatment_effect: MODULATES
    description: Monitored replacement restores volume and electrolytes.
  - target: Secondary Hyperaldosteronism and Renal Potassium Loss
    treatment_effect: MODULATES
    description: Correction of depletion reduces ongoing aldosterone-driven loss.
- name: Management of Post-Purging Edema
  description: Explain pseudo-Bartter fluid retention when purging stops and monitor fluid balance. The clinical review describes judicious fluid replacement and short-term spironolactone in selected patients to counter persistent aldosterone activity. This is supervised treatment of acquired physiology, not use of diuretics for weight control.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: spironolactone
      term:
        id: CHEBI:9241
        label: spironolactone
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: url:https://www.ccjm.org/content/88/6/333
    reference_title: "Medical complications of bulimia nervosa | Cleveland Clinic Journal of Medicine"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The reason is that the serum aldosterone levels remain high, causing salt and water retention even though the patient is no longer losing fluid, as the purging has ceased.
    explanation: Defines the physiology that management addresses.
  - reference: url:https://www.ccjm.org/content/88/6/333
    reference_title: "Medical complications of bulimia nervosa | Cleveland Clinic Journal of Medicine"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Spironolactone is generally continued for 2 to 4 weeks and then should be tapered by 50 mg every few days thereafter.

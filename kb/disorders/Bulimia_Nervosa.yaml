name: Bulimia Nervosa
creation_date: "2026-04-28T00:00:00Z"
category: Psychiatric
description: >-
  Bulimia nervosa is an eating disorder characterized by recurrent loss-of-control binge eating, recurrent
  inappropriate compensatory behaviors intended to prevent weight gain, and excessive influence of body shape
  or weight on self-evaluation. Compensation can involve vomiting, laxative or diuretic misuse, fasting, or
  excessive exercise. People often have normal or higher body weight; serious purging-related complications
  can occur without an underweight appearance. Liability is multifactorial, and psychological treatment is
  central to care.

- name: Gastric Acid Exposure and Mucosal Injury
  description: Repeated vomiting exposes dental enamel and esophageal mucosa to gastric acid and mechanical injury. Dental erosion may be irreversible. Reflux complaints do not reliably indicate severe endoscopic injury; tears and rupture are uncommon severe complications.
  biological_scale: TISSUE
  evidence:

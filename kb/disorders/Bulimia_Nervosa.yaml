environmental:
- name: Childhood trauma and abuse
  description: Childhood trauma and abuse are nonspecific risk associations for eating disorders, with stronger associations reported for binge/purge presentations. These experiences are neither required nor sufficient for BN, and available observational studies do not establish a single causal pathway.
  disease_effect: PREDISPOSES
  causal_role: RISK_FACTOR
  evidence:

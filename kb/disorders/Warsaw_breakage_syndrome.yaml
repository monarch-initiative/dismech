- name: Congenital sensorineural hearing impairment
  category: Otolaryngologic
  diagnostic: true
  frequency: VERY_FREQUENT
  description: >-
    Congenital sensorineural hearing impairment is usually severe and is closely
    associated with cochlear and cochlear-nerve hypoplasia.

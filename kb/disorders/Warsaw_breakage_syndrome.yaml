    reference_title: DDX11-Related Cohesinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      has a prenatal onset and is reported in all affected individuals.
      Congenital microcephaly can range from 3.3 to 10 standard deviations (SD)

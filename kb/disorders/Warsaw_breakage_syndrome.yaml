inheritance:
- name: Autosomal recessive inheritance
  description: >-
    DDX11-related cohesinopathy follows autosomal recessive inheritance. When
    both parents carry a familial pathogenic variant, each pregnancy has a 25%
    probability of an affected child, a 50% probability of an unaffected
    carrier, and a 25% probability of an unaffected non-carrier. Once the
    familial variants are known, carrier, prenatal, and preimplantation genetic
    testing are possible.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:31169992
    reference_title: DDX11-Related Cohesinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DDX11-related cohesinopathy is inherited in an autosomal recessive manner.
    explanation: Directly states the mode of inheritance.
  - reference: PMID:31169992
    reference_title: DDX11-Related Cohesinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If both parents are known to be heterozygous for a DDX11 pathogenic
      variant, each sib of an affected individual has at conception a 25% chance
      of being affected, a 50% chance of being a carrier, and a 25% chance of
      being unaffected and not a carrier.
    explanation: Provides the recurrence risks used in genetic counseling.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The 2025 GeneReviews update counted 26 molecularly confirmed individuals
    reported through 2024. Further case-based publications appeared in 2026, so
    26 is a dated literature count rather than a current census or a population
    prevalence estimate; overlapping reports also cannot be assumed to describe
    distinct individuals. Ascertainment is likely incomplete because the
    syndrome is very rare, its breakage phenotype may be absent, and its clinical
    features overlap other chromosome-instability disorders.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK541972/
    reference_title: DDX11-Related Cohesinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      related cohesinopathy is rare, with 26 individuals reported to date
    explanation: Documents the literature count in the 2025 GeneReviews update.
  - reference: PMID:30216658
    reference_title: "Warsaw breakage syndrome: Further clinical and genetic delineation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that while the cardinal clinical features in WBS
      (microcephaly, growth retardation, and cochlear anomalies) are almost
      universally present, the breakage phenotype is highly variable and can be
      absent in some cases.
    explanation: >-
      Supports the ascertainment caveat: absence of a breakage phenotype can
      obscure recognition, but the study does not quantify underdiagnosis.
  - reference: PMID:41853675
    reference_title: >-
      A pediatric patient with Warsaw breakage syndrome presenting with epilepsy:
      a case report and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present a boy exhibiting the core manifestations of this syndrome.
    explanation: Documents a case-based WABS publication after the GeneReviews literature count.
  - reference: PMID:42107920
    reference_title: >-
      Genetic characterization of DDX11 variants identified in a Chinese family
      with Warsaw breakage syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present a detailed case report of a proband with WABS.
    explanation: >-
      Documents another 2026 case-based publication; it is not added arithmetically
      to the case count because potentially overlapping reports require deduplication.

progression:
- phase: Prenatal presentation
  age_range: Fetal period to birth
  notes: >-
    Growth restriction and microcephaly begin prenatally. Reported fetal imaging
    can additionally show delayed sulcation, a short corpus callosum, or
    cerebellar vermis hypoplasia, but these brain findings are variable rather
    than defining.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK541972/
    reference_title: DDX11-Related Cohesinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      has a prenatal onset and is reported in all affected individuals.
      Congenital microcephaly can range from 3.3 to 10 standard deviations (SD)
      below the mean for age and sex.
    explanation: Establishes prenatal onset of the cardinal microcephaly.
  - reference: PMID:39428552
    reference_title: >-
      Prenatal Diagnosis of Warsaw Breakage Syndrome: Fetal Compound
      Heterozygous Variants in the DDX11 Gene Associated With Growth Restriction,
      Cerebral, and Extra-Cerebral Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a case of prenatal diagnosis of WABS in a 24-week gestation fetus
      exhibiting microcephaly, delayed sulcation, short corpus callosum,
      cerebellar vermis hypoplasia and intrahepatic portal-systemic shunts.
    explanation: Documents the expanded prenatal imaging spectrum in one fetus.
- phase: Childhood growth and neurodevelopment
  age_range: Infancy through childhood
  notes: >-
    Postnatal growth deficiency persists. Intellectual disability and
    developmental delay are usually mild to moderate and tend to remain stable;
    motor milestones are often acquired on time, while expressive language is
    disproportionately affected by congenital hearing loss. Mild presentations
    without major malformations or intellectual disability have been reported.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK541972/
    reference_title: DDX11-Related Cohesinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      range from mild to moderate and tend to be stable. Gross and fine motor
      milestones are usually attained at the usual time although a few
      individuals have mild delays.
    explanation: Describes the typical childhood neurodevelopmental course.
  - reference: PMID:30924321
    reference_title: >-
      Two further patients with Warsaw breakage syndrome. Is a mild phenotype
      possible?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings further extend the clinical and molecular knowledge about
      the WABS showing a possible mild phenotype without major malformations or
      intellectual disability.
    explanation: Documents clinically milder disease in two affected sisters.

mechanistic_hypotheses:
- hypothesis_group_id: replication_coupled_cohesion_model
  hypothesis_label: Replication-coupled cohesion and genome-maintenance model
  status: CANONICAL
  description: >-
    The best-supported model places DDX11 at nascent DNA with the fork-protection
    factor Timeless, where it promotes cohesin association during DNA
    replication. Pathogenic DDX11 dysfunction slows replication forks and
    impairs sister chromatid cohesion, producing premature chromatid separation
    and a variable genotoxin-sensitive chromosome-instability phenotype. How
    these cellular defects produce organ-selective congenital abnormalities is
    not yet known.
  evidence:
  - reference: PMID:30303954
    reference_title: >-
      Interaction of the Warsaw breakage syndrome DNA helicase DDX11 with the
      replication fork-protection factor Timeless promotes sister chromatid
      cohesion.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Collectively, our results establish a critical role for the DDX11-Timeless
      interaction in coordinating DNA replication with sister chromatid
      cohesion, and have important implications for understanding the molecular
      basis of WABS.
    explanation: Directly supports replication-coupled cohesion as the canonical model.
  - reference: PMID:31935221
    reference_title: >-
      Non-redundant roles in sister chromatid cohesion of the DNA helicase DDX11
      and the SMC3 acetyl transferases ESCO1 and ESCO2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, a DNA binding DDX11 mutant failed to correct SCC in WABS cells
      and DDX11 deficiency reduced replication fork speed.
    explanation: Connects disease-cell cohesion rescue to replication-fork slowing.
- hypothesis_group_id: rdna_ribosome_development_model
  hypothesis_label: rDNA chromatin and ribosome-biogenesis developmental model
  status: ALTERNATIVE
  description: >-
    DDX11 also binds active rDNA, interacts with UBF and RNA polymerase I, and
    supports rRNA transcription. DDX11 depletion shifts rDNA toward
    heterochromatin, suppresses rRNA synthesis, and reduces proliferation; a
    zebrafish knockdown model couples the same molecular readouts to growth and
    craniofacial abnormalities. This may act alongside the canonical cohesion
    mechanism, but a causal contribution to human organ-specific disease has not
    been demonstrated.
  evidence:
  - reference: PMID:26089203
    reference_title: >-
      The Warsaw breakage syndrome-related protein DDX11 is required for
      ribosomal RNA synthesis and embryonic development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      DDX11 knockdown changed the epigenetic state of rDNA loci from euchromatic
      structures to more heterochromatic structures, reduced the activity of UBF,
      decreased the recruitment of UBF and RPA194 (a subunit of Pol I) to rDNA
      promoter, suppressed rRNA transcription and thereby inhibited growth and
      proliferation of HeLa cells.
    explanation: Establishes the rDNA-transcription and proliferation branch in cells.
  - reference: PMID:26089203
    reference_title: >-
      The Warsaw breakage syndrome-related protein DDX11 is required for
      ribosomal RNA synthesis and embryonic development.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These growth disruptions in zebrafish in response to DDX11 reduction
      showed similarities to the clinically described developmental
      abnormalities found in WABS patients for the first time in any vertebrate.
    explanation: >-
      Provides in-vivo developmental support, but only in a morpholino model and
      without proving the same pathway causes human manifestations.

pathophysiology:
- name: Pathogenic DDX11 helicase dysfunction
  biological_scale: MOLECULAR
  description: >-
    Biallelic pathogenic DDX11 variants reduce functional DDX11 dosage or impair
    its DNA binding, ATP hydrolysis, and 5-prime-to-3-prime helicase activity. The
    directly assayed p.Arg263Gln WABS allele is a hypomorphic example; the degree
    and molecular nature of dysfunction vary across alleles.
  genes:
  - preferred_term: DDX11
    term:
      id: hgnc:2736
      label: DDX11
  molecular_functions:
  - preferred_term: DNA helicase activity
    modifier: DECREASED
    term:
      id: GO:0003678
      label: DNA helicase activity
  evidence:
  - reference: PMID:23033317
    reference_title: >-
      Identification and biochemical characterization of a novel mutation in
      DDX11 causing Warsaw breakage syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Biochemical studies of purified recombinant DDX11 indicated that the
      p.R263Q mutation impaired DDX11 helicase activity by perturbing its DNA
      binding and DNA-dependent ATP hydrolysis.
    explanation: Direct biochemical evidence that a WABS allele impairs DDX11 activity.
  downstream:
  - target: Slowed replication forks and defective replication-coupled cohesin loading
    description: >-
      Loss of DDX11 DNA binding and fork-localized function slows forks and
      compromises recruitment or stabilization of cohesin during replication.
    causal_link_type: DIRECT
    hypothesis_groups:
    - replication_coupled_cohesion_model
    evidence:
    - reference: PMID:31935221
      reference_title: >-
        Non-redundant roles in sister chromatid cohesion of the DNA helicase DDX11
        and the SMC3 acetyl transferases ESCO1 and ESCO2.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Furthermore, a DNA binding DDX11 mutant failed to correct SCC in WABS
        cells and DDX11 deficiency reduced replication fork speed.
      explanation: Demonstrates both fork slowing and failed cohesion rescue after DDX11 dysfunction.
  - target: Variable cross-link-induced chromosome breakage
    description: >-
      DDX11-deficient cells can become hypersensitive to DNA cross-linking stress,
      although this phenotype is not penetrant across all affected individuals.
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - replication_coupled_cohesion_model
    evidence:
    - reference: PMID:20137776
      reference_title: >-
        Warsaw breakage syndrome, a cohesinopathy associated with mutations in
        the XPD helicase family member DDX11/ChlR1.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Defective DDX11 is associated with a unique cellular phenotype in which
        features of Fanconi anemia (drug-induced chromosomal breakage) and Roberts
        syndrome (sister chromatid cohesion defects) coexist.
      explanation: Establishes induced breakage in the founding patient-cell model.
  - target: rDNA chromatin and RNA polymerase I transcription defect
    description: >-
      Loss of nucleolar DDX11 binding shifts active rDNA toward heterochromatin
      and reduces recruitment of the RNA polymerase I machinery.
    causal_link_type: DIRECT
    hypothesis_groups:
    - rdna_ribosome_development_model
    evidence:
    - reference: PMID:26089203
      reference_title: >-
        The Warsaw breakage syndrome-related protein DDX11 is required for
        ribosomal RNA synthesis and embryonic development.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        DDX11 is a novel nucleolar protein that preferentially binds to
        hypomethylated active ribosomal DNA (rDNA) gene loci, where it interacts
        with upstream binding factor (UBF) and the RNA polymerase I (Pol I).
      explanation: Defines the direct nucleolar and rDNA role perturbed by DDX11 loss.

- name: Slowed replication forks and defective replication-coupled cohesin loading
  biological_scale: CELLULAR
  description: >-
    DDX11 localizes to nascent DNA, interacts with the fork-protection component
    Timeless, and promotes cohesin association with replication forks. DDX11
    deficiency reduces fork speed; loss of this replication-coupled function
    compromises establishment of sister chromatid cohesion.
  biological_processes:
  - preferred_term: replication fork processing
    modifier: ABNORMAL
    term:
      id: GO:0031297
      label: replication fork processing
  - preferred_term: sister chromatid cohesion
    modifier: DECREASED
    term:
      id: GO:0007062
      label: sister chromatid cohesion
  cellular_components:
  - preferred_term: replication fork
    term:
      id: GO:0005657
      label: replication fork
  evidence:
  - reference: PMID:30303954
    reference_title: >-
      Interaction of the Warsaw breakage syndrome DNA helicase DDX11 with the
      replication fork-protection factor Timeless promotes sister chromatid
      cohesion.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, we found that DDX11 promotes cohesin binding to the DNA
      replication forks in concert with Timeless and that recombinant purified
      cohesin interacts with DDX11 in vitro.
    explanation: Directly establishes the fork-localized cohesin-loading function.
  - reference: PMID:31935221
    reference_title: >-
      Non-redundant roles in sister chromatid cohesion of the DNA helicase DDX11
      and the SMC3 acetyl transferases ESCO1 and ESCO2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that WABS-derived cells predominantly rely on ESCO2, not ESCO1,
      for residual SCC, growth and survival.
    explanation: Defines the residual ESCO2-dependent cohesion state in WABS cells.
  downstream:
  - target: Sister chromatid cohesion defect
    description: Failure to couple cohesin to DNA replication reduces functional cohesion.
    causal_link_type: DIRECT
    hypothesis_groups:
    - replication_coupled_cohesion_model
    evidence:
    - reference: PMID:30303954
      reference_title: >-
        Interaction of the Warsaw breakage syndrome DNA helicase DDX11 with the
        replication fork-protection factor Timeless promotes sister chromatid
        cohesion.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The DDX11-Timeless interaction is critical for sister chromatid cohesion
        in interphase and mitosis.
      explanation: Directly links the fork-protection interaction to cohesion.

- name: Sister chromatid cohesion defect
  biological_scale: CELLULAR
  description: >-
    Patient cells exhibit reduced sister chromatid cohesion. This is the
    consistent cytogenetic core of DDX11-related cohesinopathy and should not be
    conflated with the more variable induced-breakage phenotype.
  biological_processes:
  - preferred_term: sister chromatid cohesion
    modifier: DECREASED
    term:
      id: GO:0007062
      label: sister chromatid cohesion
  evidence:
  - reference: PMID:20137776
    reference_title: >-
      Warsaw breakage syndrome, a cohesinopathy associated with mutations in the
      XPD helicase family member DDX11/ChlR1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The DDX11-deficient patient represents another cohesinopathy, besides
      Cornelia de Lange syndrome and Roberts syndrome, and shows that DDX11
      functions at the interface between DNA repair and sister chromatid cohesion.
    explanation: Establishes the patient-cell cohesion phenotype and DDX11 role.
  - reference: PMID:30469382
    reference_title: >-
      Molecular and Cellular Functions of the Warsaw Breakage Syndrome DNA
      Helicase DDX11.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While sister chromatid cohesion defects were observed in all the patients
      described so far, two of these novel WABS patients do not display
      drug-induced elevated chromosomal breakage.
    explanation: >-
      Supports treating cohesion failure as the consistent cellular signature
      while keeping induced breakage explicitly variable.
  downstream:
  - target: Premature chromatid separation and railroad chromosome morphology
    description: >-
      Insufficient cohesion permits premature separation of chromatids and
      centromeres, producing the characteristic railroad-track appearance.
    causal_link_type: DIRECT
    hypothesis_groups:
    - replication_coupled_cohesion_model
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK541972/
      reference_title: DDX11-Related Cohesinopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        separation of the sister chromatids and centromeres during metaphase
        rather than in anaphase visible on C-banding techniques
      explanation: Defines the cytogenetic consequence of the cohesion defect.
  - target: Impaired embryonic proliferation and tissue development
    description: >-
      A developmental consequence is plausible from animal loss-of-function
      models, but the relevant human tissues and intervening mechanisms are
      unknown.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Tissue-specific replication stress, altered transcription, cell-cycle delay, or cell loss.
    hypothesis_groups:
    - replication_coupled_cohesion_model
    evidence:
    - reference: PMID:17611414
      reference_title: >-
        Loss of ChlR1 helicase in mouse causes lethality due to the accumulation
        of aneuploid cells generated by cohesion defects and placental malformation.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The mutant embryos were smaller in size, malformed and exhibited sparse
        cellularity in comparison to normal or heterozygous litter mates.
      explanation: >-
        Supports an in-vivo developmental consequence of complete Ddx11 loss,
        but not the organ-specific pathway in surviving humans.

- name: Premature chromatid separation and railroad chromosome morphology
  biological_scale: CELLULAR
  description: >-
    Premature chromatid separation, premature centromere division, centromeric
    heterochromatin repulsion, and railroad-track chromosomes are characteristic
    cytogenetic manifestations of the cohesion defect. Unlike induced breakage,
    this cohesion-related morphology is central to distinguishing WABS from
    Fanconi anemia.
  biological_processes:
  - preferred_term: chromosome segregation
    modifier: ABNORMAL
    term:
      id: GO:0007059
      label: chromosome segregation
  evidence:
  - reference: PMID:21490908
    reference_title: >-
      Diagnostic Overlap between Fanconi Anemia and the Cohesinopathies: Roberts
      Syndrome and Warsaw Breakage Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This complication may be avoided by scoring metaphase chromosomes-in
      addition to chromosomal breakage-for spontaneously occurring premature
      centromere division, which is characteristic for RBS and WABS, but not for
      FA.
    explanation: Supports both the cytogenetic signature and its diagnostic value.

- name: Variable cross-link-induced chromosome breakage
  biological_scale: CELLULAR
  description: >-
    Some patient lymphocytes show increased breaks and radial forms after
    diepoxybutane or mitomycin C exposure, reproducing part of the Fanconi-anemia
    cellular phenotype. Other molecularly confirmed individuals do not; this
    node is therefore explicitly variable and a normal breakage assay does not
    exclude the diagnosis.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:20137776
    reference_title: >-
      Warsaw breakage syndrome, a cohesinopathy associated with mutations in the
      XPD helicase family member DDX11/ChlR1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Defective DDX11 is associated with a unique cellular phenotype in which
      features of Fanconi anemia (drug-induced chromosomal breakage) and Roberts
      syndrome (sister chromatid cohesion defects) coexist.
    explanation: Documents the induced-breakage phenotype in the founding case.
  - reference: PMID:30216658
    reference_title: "Warsaw breakage syndrome: Further clinical and genetic delineation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that while the cardinal clinical features in WBS
      (microcephaly, growth retardation, and cochlear anomalies) are almost
      universally present, the breakage phenotype is highly variable and can be
      absent in some cases.
    explanation: Establishes non-penetrance of the breakage phenotype.

- name: rDNA chromatin and RNA polymerase I transcription defect
  biological_scale: CELLULAR
  description: >-
    In DDX11-depleted HeLa cells, active rDNA becomes more heterochromatic,
    recruitment of UBF and RNA polymerase I falls, and rRNA transcription is
    suppressed. WABS-derived mutant proteins show reduced rDNA-promoter binding
    and ATPase activity. The cell biology is experimentally supported, but its
    causal contribution to human WABS remains provisional.
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: heterochromatin organization
    modifier: ABNORMAL
    term:
      id: GO:0070828
      label: heterochromatin organization
  - preferred_term: ribosome biogenesis
    modifier: DECREASED
    term:
      id: GO:0042254
      label: ribosome biogenesis
  evidence:
  - reference: PMID:26089203
    reference_title: >-
      The Warsaw breakage syndrome-related protein DDX11 is required for
      ribosomal RNA synthesis and embryonic development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      R263Q and K897del, and a Fe-S deletion construct demonstrated significantly
      reduced binding abilities to rDNA promoters and lowered DNA-dependent
      ATPase activities compared with wild-type DDX11.
    explanation: Extends the rDNA defect from knockdown to two WABS-derived proteins.
  downstream:
  - target: Reduced cell proliferation
    description: Suppressed rRNA transcription reduces growth and proliferation in the cell model.
    causal_link_type: DIRECT
    hypothesis_groups:
    - rdna_ribosome_development_model
    evidence:
    - reference: PMID:26089203
      reference_title: >-
        The Warsaw breakage syndrome-related protein DDX11 is required for
        ribosomal RNA synthesis and embryonic development.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        DDX11 knockdown changed the epigenetic state of rDNA loci from
        euchromatic structures to more heterochromatic structures, reduced the
        activity of UBF, decreased the recruitment of UBF and RPA194 (a subunit
        of Pol I) to rDNA promoter, suppressed rRNA transcription and thereby
        inhibited growth and proliferation of HeLa cells.
      explanation: Directly links the rDNA transcription defect to impaired proliferation.

- name: Reduced cell proliferation
  biological_scale: CELLULAR
  description: >-
    DDX11 depletion reduces proliferation in cultured cells. A similar reduction
    in developmental cell production could contribute to growth restriction and
    microcephaly, but this extrapolation has not been demonstrated in relevant
    human embryonic tissues.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:26089203
    reference_title: >-
      The Warsaw breakage syndrome-related protein DDX11 is required for
      ribosomal RNA synthesis and embryonic development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      suppressed rRNA transcription and thereby inhibited growth and
      proliferation of HeLa cells.
    explanation: Directly supports reduced proliferation in the depletion model.
  downstream:
  - target: Impaired embryonic proliferation and tissue development
    description: >-
      Reduced cell production is proposed to impair embryonic growth and
      organogenesis, with tissue-specific intermediates unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Unknown tissue-specific effects of reduced ribosome output and cell-cycle progression.
    hypothesis_groups:
    - rdna_ribosome_development_model
    evidence:
    - reference: PMID:26089203
      reference_title: >-
        The Warsaw breakage syndrome-related protein DDX11 is required for
        ribosomal RNA synthesis and embryonic development.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Knockdown of the zebrafish ortholog of human DDX11 by morpholinos
        resulted in growth retardation and vertebral and craniofacial
        malformations in zebrafish, concomitant with the changes in histone
        epigenetic modifications at rDNA loci, the reduction of Pol I recruitment
        to the rDNA promoter and a significant decrease in nascent pre-RNA levels.
      explanation: >-
        Couples rDNA readouts to developmental abnormalities in vivo, while
        remaining indirect for human disease.

- name: Impaired embryonic proliferation and tissue development
  biological_scale: ORGANISM
  description: >-
    The cellular mechanisms are proposed to converge on impaired embryonic
    proliferation and organogenesis. Ddx11-null mice and DDX11-knockdown
    zebrafish establish developmental requirements for the gene, but neither
    model identifies the human tissue-specific intermediates that yield the
    clinical triad. This node and its phenotype edges are therefore explicitly
    hypothetical.
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:17611414
    reference_title: >-
      Loss of ChlR1 helicase in mouse causes lethality due to the accumulation of
      aneuploid cells generated by cohesion defects and placental malformation.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The absence of Ddx11 resulted in embryonic lethality at E10.5.
    explanation: Shows that Ddx11 is required for mammalian embryonic development.
  - reference: PMID:26089203
    reference_title: >-
      The Warsaw breakage syndrome-related protein DDX11 is required for
      ribosomal RNA synthesis and embryonic development.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These growth disruptions in zebrafish in response to DDX11 reduction
      showed similarities to the clinically described developmental
      abnormalities found in WABS patients for the first time in any vertebrate.
    explanation: Shows partial developmental phenocopy after DDX11 reduction.
  downstream:
  - target: Intrauterine growth retardation
    description: >-
      Prenatal growth failure is universal in reported individuals, but the
      causal tissue and cellular bottleneck are not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - replication_coupled_cohesion_model
    - rdna_ribosome_development_model
  - target: Postnatal growth retardation
    description: >-
      Persistent growth deficiency may reflect reduced cell production and
      nutritional factors; their relative contributions are unknown.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - replication_coupled_cohesion_model
    - rdna_ribosome_development_model
  - target: Congenital microcephaly
    description: >-
      Reduced prenatal brain growth is plausibly downstream of impaired
      development, but neural progenitor-specific causality has not been tested.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - replication_coupled_cohesion_model
    - rdna_ribosome_development_model
  - target: Abnormal brain morphology
    description: >-
      Structural brain anomalies occur in a minority of affected individuals,
      but their lineage-specific developmental mechanism remains unknown.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - replication_coupled_cohesion_model
    - rdna_ribosome_development_model
  - target: Abnormal cortical gyration
    description: >-
      Poor sulcation, delayed gyration, and focal lissencephaly implicate cortical
      development through untested neural-progenitor intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - replication_coupled_cohesion_model
    - rdna_ribosome_development_model
  - target: Hypoplasia of the corpus callosum
    description: >-
      Callosal hypoplasia is plausibly developmental, but no DDX11-dependent
      axon-guidance or commissural-neuron mechanism has been demonstrated.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - replication_coupled_cohesion_model
    - rdna_ribosome_development_model
  - target: Cerebellar vermis hypoplasia
    description: >-
      Vermian hypoplasia is reported clinically, but the affected progenitor
      population and causal molecular branch are unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - replication_coupled_cohesion_model
    - rdna_ribosome_development_model
  - target: Congenital sensorineural hearing impairment
    description: >-
      Hearing impairment reflects abnormal cochlear development; the relevant

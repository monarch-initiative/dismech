experimental_models:
- name: Patient-derived lymphocyte and lymphoblastoid cell models
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: >-
    Primary T lymphocytes and Epstein-Barr-virus-immortalized B-lymphoblastoid
    lines from molecularly confirmed affected individuals
  description: >-
    Patient cells reveal the disease-proximal cytogenetic phenotype: sister
    chromatid cohesion defects, premature centromere division, and in some
    individuals cross-linker-induced chromosome breakage. WABS-derived cells also
    show reduced replication-fork speed and dependence on residual ESCO2-mediated
    cohesion. The platform is strong for cell-autonomous genome-maintenance
    mechanisms but cannot reproduce organogenesis or neural and cochlear tissue
    selectivity.
  evidence:
  - reference: PMID:20137776
    reference_title: >-
      Warsaw breakage syndrome, a cohesinopathy associated with mutations in the
      XPD helicase family member DDX11/ChlR1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Defective DDX11 is associated with a unique cellular phenotype in which
      features of Fanconi anemia (drug-induced chromosomal breakage) and Roberts
      syndrome (sister chromatid cohesion defects) coexist.
    explanation: Establishes the core patient-cell model readouts.
  - reference: PMID:31935221
    reference_title: >-
      Non-redundant roles in sister chromatid cohesion of the DNA helicase DDX11
      and the SMC3 acetyl transferases ESCO1 and ESCO2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that WABS-derived cells predominantly rely on ESCO2, not ESCO1,
      for residual SCC, growth and survival.
    explanation: Supports ESCO2 dependence as an experimentally tractable patient-cell phenotype.
- name: DDX11-depleted and complementation human cell-line models
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: >-
    HeLa and other human cell lines with DDX11 depletion, mutant complementation,
    or Timeless-interaction perturbation
  description: >-
    Engineered human cells resolve two experimentally separable functions:
    DDX11-Timeless-dependent recruitment of cohesin at replication forks, and
    nucleolar DDX11-dependent maintenance of active rDNA and RNA polymerase I
    transcription. These systems establish cellular mechanisms but are not
    patient-derived developmental tissue models.
  evidence:
  - reference: PMID:30303954
    reference_title: >-
      Interaction of the Warsaw breakage syndrome DNA helicase DDX11 with the
      replication fork-protection factor Timeless promotes sister chromatid
      cohesion.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrated that DDX11 interacts with Timeless, a component of the
      replication fork-protection complex, through a conserved peptide motif.
    explanation: Establishes the engineered-cell fork/cohesion mechanism.
  - reference: PMID:26089203
    reference_title: >-
      The Warsaw breakage syndrome-related protein DDX11 is required for
      ribosomal RNA synthesis and embryonic development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      DDX11 knockdown changed the epigenetic state of rDNA loci from euchromatic
      structures to more heterochromatic structures, reduced the activity of UBF,
      decreased the recruitment of UBF and RPA194 (a subunit of Pol I) to rDNA
      promoter, suppressed rRNA transcription and thereby inhibited growth and
      proliferation of HeLa cells.
    explanation: Establishes the engineered-cell rDNA and proliferation phenotype.

animal_models:
- species: Danio rerio
  genotype: Morpholino knockdown of the zebrafish DDX11 ortholog
  description: >-
    DDX11 knockdown produces growth retardation and vertebral and craniofacial
    malformations while reducing Pol I recruitment and nascent pre-rRNA. This is
    the only model linking rDNA readouts to a partial WABS-like developmental
    phenotype, but morpholino knockdown is not a stable allele and the model did
    not reproduce or assay the human cochlear and neurocognitive phenotype.
  genes:
  - preferred_term: DDX11
    term:
      id: hgnc:2736
      label: DDX11
  evidence:
  - reference: PMID:26089203
    reference_title: >-
      The Warsaw breakage syndrome-related protein DDX11 is required for
      ribosomal RNA synthesis and embryonic development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Knockdown of the zebrafish ortholog of human DDX11 by morpholinos resulted
      in growth retardation and vertebral and craniofacial malformations in
      zebrafish, concomitant with the changes in histone epigenetic modifications
      at rDNA loci, the reduction of Pol I recruitment to the rDNA promoter and a
      significant decrease in nascent pre-RNA levels.
    explanation: Defines both developmental and molecular readouts of the zebrafish model.
- species: Mus musculus
  genotype: Homozygous Ddx11-null mouse
  description: >-
    Complete Ddx11 loss causes embryonic lethality around E10.5, small malformed
    embryos, placental failure, G2/M delay, chromosome missegregation, reduced
    cohesion, and aneuploidy. It establishes an essential mammalian developmental
    role but is a severity mismatch for surviving humans with hypomorphic or
    partially functional biallelic alleles.
  genes:
  - preferred_term: DDX11
    term:
      id: hgnc:2736
      label: DDX11
  evidence:
  - reference: PMID:17611414
    reference_title: >-
      Loss of ChlR1 helicase in mouse causes lethality due to the accumulation of
      aneuploid cells generated by cohesion defects and placental malformation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The absence of Ddx11 resulted in embryonic lethality at E10.5.
    explanation: Establishes the survival phenotype of complete murine loss.
  - reference: PMID:17611414
    reference_title: >-
      Loss of ChlR1 helicase in mouse causes lethality due to the accumulation of
      aneuploid cells generated by cohesion defects and placental malformation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Detailed analysis of cells isolated from Ddx11-/- embryos revealed a G2/M
      cell cycle delay, an increased frequency of chromosome missegregation,
      decreased chromosome cohesion, and increased aneuploidy.
    explanation: Defines the cohesion and genome-segregation readouts in the mouse model.

discussions:
- discussion_id: organ_specific_developmental_bridge
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which DDX11-dependent cellular defect causes each organ-specific human
    manifestation: replication-fork slowing, failed cohesion, altered chromatin
    and transcription, impaired rRNA synthesis, or a combination?
  attaches_to:
  - pathophysiology#Slowed replication forks and defective replication-coupled cohesin loading
  - pathophysiology#rDNA chromatin and RNA polymerase I transcription defect
  - pathophysiology#Impaired embryonic proliferation and tissue development
  rationale: >-
    The fork/cohesion and rDNA branches are experimentally reproducible, but no
    disease-relevant human neural, cochlear, cardiac, or embryonic model connects
    either branch to the defining congenital phenotype. Resolving this bridge is
    necessary before any organ-specific mechanism or disease-modifying target can
    be considered established.
  evidence:
  - reference: PMID:26089203
    reference_title: >-
      The Warsaw breakage syndrome-related protein DDX11 is required for
      ribosomal RNA synthesis and embryonic development.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These growth disruptions in zebrafish in response to DDX11 reduction
      showed similarities to the clinically described developmental
      abnormalities found in WABS patients for the first time in any vertebrate.
    explanation: >-
      Demonstrates partial model convergence but not the human organ-specific
      causal bridge, which is why the item remains open.
- discussion_id: complete_loss_model_mismatch
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Can a stable allelic animal or human developmental model reproduce the
    survivable, tissue-selective phenotype of human WABS rather than the early
    lethality of complete Ddx11 loss or the limitations of morpholino knockdown?
  attaches_to:
  - pathophysiology#Pathogenic DDX11 helicase dysfunction
  - pathophysiology#Impaired embryonic proliferation and tissue development
  rationale: >-
    The null mouse demonstrates gene necessity but dies before relevant organ
    phenotypes can be assessed, while the zebrafish model is transient and only
    partially phenocopies WABS. Patient-variant knock-in models, ideally with
    lineage-resolved neural and inner-ear readouts, are needed.
  evidence:
  - reference: PMID:17611414
    reference_title: >-
      Loss of ChlR1 helicase in mouse causes lethality due to the accumulation of
      aneuploid cells generated by cohesion defects and placental malformation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The absence of Ddx11 resulted in embryonic lethality at E10.5.
    explanation: Defines the central severity mismatch of the available mouse model.
- discussion_id: natural_history_and_malignancy_risk
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What are the adult natural history, malignancy risk, treatment toxicities,
    and evidence-based surveillance needs of people with biallelic DDX11 disease
    and of heterozygous carriers?
  attaches_to:
  - phenotypes#Seizure
  rationale: >-
    Published cohorts are small, most affected individuals are children, and no
    consensus tumor-screening protocol exists. A longitudinal registry is needed
    to distinguish true late complications from isolated observations and to
    assess whether DNA-damaging therapies require special precautions.
  evidence:
  - reference: PMID:31169992
    reference_title: DDX11-Related Cohesinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surveillance: Monitor growth, speech development, and educational needs
      with each visit; behavioral assessment for ADHD as needed; there is no
      consensus regarding tumor screening.
    explanation: Documents the current surveillance scope and tumor-screening uncertainty.
- discussion_id: serf1b_snca_neurotoxicity_model
  kind: EMERGING_HYPOTHESIS
  status: UNDER_DISCUSSION
  prompt: >-
    Does DDX11 deficiency reproducibly activate a SERF1B-SNCA aggregation pathway
    that contributes to impaired neuronal migration and neurodevelopment in WABS?
  attaches_to:
  - phenotypes#Congenital microcephaly
  - phenotypes#Intellectual disability
  - phenotypes#Seizure
  rationale: >-
    A 2026 study reported this pathway using variants from one family, a
    transfected neural-cell model, RNA sequencing, and validation in fetal
    tissue. Independent patient-derived neural models, protein-aggregation
    measurements, genetic rescue, and replication across alleles are needed
    before it can enter the core disease graph.
  evidence:
  - reference: PMID:42107920
    reference_title: >-
      Genetic characterization of DDX11 variants identified in a Chinese family
      with Warsaw breakage syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RNA-seq revealed marked upregulation of SERF1B, which was validated in
      fetal tissue. Mechanistically, SERF1B overexpression may accelerate SNCA
      protein aggregation and exacerbate neurotoxicity.
    explanation: States the newly proposed molecular pathway and its limited validation.

notes: >-
  Evidence calibration: sister chromatid cohesion failure is the consistent
  cellular signature, while induced chromosome breakage is explicitly variable
  and cannot be required for diagnosis. Replication-fork and cohesion mechanisms
  are supported by patient cells and independent perturbation studies. The rDNA
  and ribosome-biogenesis branch is experimentally supported in HeLa cells and a
  zebrafish knockdown model, but its contribution to human manifestations remains
  provisional. All links from cellular dysfunction to individual congenital
  phenotypes are marked indirect because relevant tissue intermediates have not
  been established. Current care is supportive; no disease-modifying treatment,
  disorder-specific practice guideline, or consensus tumor-screening protocol is
  available.

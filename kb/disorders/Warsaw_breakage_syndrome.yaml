diagnosis:
- name: Clinical recognition of the core triad
  description: >-
    Suspect DDX11-related cohesinopathy in an individual with severe congenital
    microcephaly, prenatal and postnatal growth restriction, and congenital
    sensorineural hearing impairment caused by cochlear abnormalities. Skeletal,
    cardiac, pigmentary, genitourinary, and cytogenetic findings can support the
    suspicion, but no consensus clinical diagnostic criteria exist.
  diagnosis_term:
    preferred_term: Clinical Evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:31169992
    reference_title: DDX11-Related Cohesinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DDX11-related cohesinopathy is characterized by the clinical triad of
      severe congenital microcephaly, growth restriction, and sensorineural
      hearing loss due to cochlear hypoplasia.
    explanation: Defines the clinical pattern that should trigger testing.
- name: DDX11 molecular genetic testing
  description: >-
    The diagnosis is established by identifying biallelic pathogenic or likely
    pathogenic DDX11 variants. Depending on presentation, testing may use DDX11
    sequencing, an appropriate multigene panel, exome sequencing, or genome
    sequencing. A negative or single-variant sequence result may warrant
    deletion/duplication analysis; highly homologous DDX11 pseudogenes complicate
    assay design and interpretation.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:31169992
    reference_title: DDX11-Related Cohesinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of DDX11-related cohesinopathy is established in a proband
      with biallelic pathogenic variants in DDX11 identified by molecular genetic
      testing.
    explanation: Directly states the molecular diagnostic criterion.
- name: Supportive cytogenetic analysis
  description: >-
    C-banded metaphase analysis can show premature chromatid separation,
    premature centromere division, and railroad chromosomes. DEB- or MMC-treated
    lymphocytes can show increased breaks and radial forms, but this induced
    breakage is variable and can be absent; a normal breakage assay therefore
    cannot exclude WABS, and molecular confirmation remains necessary.
  diagnosis_term:
    preferred_term: Karyotyping
    term:
      id: NCIT:C16768
      label: Karyotyping
  evidence:
  - reference: PMID:21490908
    reference_title: >-
      Diagnostic Overlap between Fanconi Anemia and the Cohesinopathies: Roberts
      Syndrome and Warsaw Breakage Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This complication may be avoided by scoring metaphase chromosomes-in
      addition to chromosomal breakage-for spontaneously occurring premature
      centromere division, which is characteristic for RBS and WABS, but not for
      FA.
    explanation: Supports scoring cohesion morphology during the cytogenetic differential.
  - reference: PMID:30216658
    reference_title: "Warsaw breakage syndrome: Further clinical and genetic delineation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that while the cardinal clinical features in WBS
      (microcephaly, growth retardation, and cochlear anomalies) are almost
      universally present, the breakage phenotype is highly variable and can be
      absent in some cases.
    explanation: Establishes that absence of induced breakage does not exclude WABS.


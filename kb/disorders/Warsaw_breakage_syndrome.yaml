name: Warsaw breakage syndrome
creation_date: "2026-04-15T00:00:00Z"
description: >-
  Warsaw breakage syndrome (WABS), also called DDX11-related cohesinopathy, is
  an ultra-rare autosomal recessive developmental disorder caused by biallelic
  pathogenic variants in DDX11. Its core clinical triad is congenital severe
  microcephaly, prenatal and postnatal growth restriction, and congenital
  sensorineural hearing impairment associated with cochlear hypoplasia. Sister
  chromatid cohesion defects are a consistent cellular signature, whereas
  cross-linker-induced chromosome breakage is variable and may be absent. The
  mechanistic bridge from replication-coupled cohesion failure to the
  tissue-selective developmental phenotype remains unresolved; altered rDNA
  transcription and ribosome biogenesis constitute a supported but still
  provisional additional disease mechanism.
category: Mendelian
parents:
- Neurodevelopmental disorder
- Genetic disease
synonyms:
- WABS
- Warsaw syndrome
- DDX11-related cohesinopathy

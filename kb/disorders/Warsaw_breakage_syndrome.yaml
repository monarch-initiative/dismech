    snippet: >-
      Chromosome instability (inversions &#x00026; translocations involving
      chromosomes 7 &#x00026; 14)
    explanation: Provides a specific cytogenetic discriminator for Nijmegen breakage syndrome.
- name: Microcephalic osteodysplastic primordial dwarfism type II
  description: >-
    PCNT-related microcephalic osteodysplastic primordial dwarfism type II
    overlaps through severe microcephaly and pre- and postnatal growth

    snippet: >-
      DDX11-related cohesinopathy is characterized by the clinical triad of
      severe congenital microcephaly, growth restriction, and sensorineural
      hearing loss due to cochlear hypoplasia.
    explanation: Defines hearing loss as one arm of the core clinical triad.

differential_diagnoses:
- name: Fanconi anemia
  description: >-
    Fanconi anemia overlaps through prenatal growth deficiency, microcephaly,
    limb and pigmentary anomalies, and cross-linker-induced chromosome breakage.
    Progressive bone-marrow failure and pancytopenia favor Fanconi anemia;
    congenital sensorineural hearing impairment with cochlear hypoplasia and
    spontaneous premature centromere division favor DDX11-related cohesinopathy.
  distinguishing_features:
  - Progressive bone-marrow failure with pancytopenia is characteristic of Fanconi anemia.
  - Hearing loss in Fanconi anemia is usually conductive rather than the congenital sensorineural loss of WABS.
  - Premature centromere division is characteristic of WABS and Roberts syndrome but not Fanconi anemia.
  disease_term:
    preferred_term: Fanconi anemia
    term:
      id: MONDO:0019391
      label: Fanconi anemia
  evidence:
  - reference: PMID:21490908
    reference_title: >-
      Diagnostic Overlap between Fanconi Anemia and the Cohesinopathies: Roberts
      Syndrome and Warsaw Breakage Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This complication may be avoided by scoring metaphase chromosomes-in
      addition to chromosomal breakage-for spontaneously occurring premature
      centromere division, which is characteristic for RBS and WABS, but not for
      FA.
    explanation: Gives the key cytogenetic discriminator from Fanconi anemia.
- name: Roberts-SC phocomelia syndrome
  description: >-
    ESCO2-related Roberts syndrome is another autosomal recessive cohesinopathy
    with prenatal growth restriction, limb anomalies, and premature centromere
    separation. Bilateral symmetric tetraphocomelia or hypomelia, contractures,
    ear malformations, and corneal opacities favor Roberts syndrome; congenital
    sensorineural hearing impairment is not characteristic.
  distinguishing_features:
  - Roberts syndrome is caused by biallelic ESCO2 variants rather than DDX11 variants.
  - Severe symmetric limb reduction defects and flexion contractures favor Roberts syndrome.
  - Sensorineural hearing impairment with cochlear hypoplasia favors WABS.
  disease_term:
    preferred_term: Roberts-SC phocomelia syndrome
    term:
      id: MONDO:0100253
      label: Roberts-SC phocomelia syndrome
  evidence:
  - reference: PMID:20137776
    reference_title: >-
      Warsaw breakage syndrome, a cohesinopathy associated with mutations in the
      XPD helicase family member DDX11/ChlR1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Defective DDX11 is associated with a unique cellular phenotype in which
      features of Fanconi anemia (drug-induced chromosomal breakage) and Roberts
      syndrome (sister chromatid cohesion defects) coexist.
    explanation: Establishes the cohesion-based overlap with Roberts syndrome.
- name: Nijmegen breakage syndrome
  description: >-
    Nijmegen breakage syndrome overlaps through microcephaly, growth deficiency,
    and chromosome instability. Progressive microcephaly, immunodeficiency,
    characteristic chromosome 7/14 rearrangements, premature ovarian failure,
    and lymphoma risk favor Nijmegen breakage syndrome; sensorineural hearing
    impairment is not typical.
  distinguishing_features:
  - Immunodeficiency and marked lymphoma predisposition favor Nijmegen breakage syndrome.
  - Chromosome 7 and 14 inversions or translocations favor Nijmegen breakage syndrome.
  - Congenital cochlear hypoplasia and sensorineural hearing impairment favor WABS.

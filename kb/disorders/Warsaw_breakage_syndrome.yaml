    snippet: >-
      Although all the reported patients had cochlear hypoplasia, one patient
      also had posterior labyrinthine anomaly.
    explanation: Documents high penetrance and variable inner-ear morphology.
- name: Intellectual disability
  category: Neurodevelopmental
  description: >-

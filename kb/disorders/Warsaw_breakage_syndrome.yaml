phenotypes:
- name: Intrauterine growth retardation
  category: Growth
  diagnostic: true
  frequency: OBLIGATE
  description: >-
    Prenatal growth restriction is a cardinal feature and was reported in all 26
    individuals summarized in the 2025 GeneReviews update.
  phenotype_term:
    preferred_term: Intrauterine growth retardation
    term:
      id: HP:0001511
      label: Intrauterine growth retardation
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK541972/
    reference_title: DDX11-Related Cohesinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 26 reported individuals to date had intrauterine growth deficiency
      with birth weight and height below the third centile.
    explanation: Provides the reported frequency and severity of prenatal growth deficiency.
- name: Postnatal growth retardation
  category: Growth
  diagnostic: true
  frequency: OBLIGATE
  description: >-
    Growth deficiency persists after birth, although nutritional support can
    improve weight in some individuals.
  phenotype_term:
    preferred_term: Postnatal growth retardation
    term:
      id: HP:0008897
      label: Postnatal growth retardation
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK541972/
    reference_title: DDX11-Related Cohesinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Postnatal growth deficiency was also reported in all individuals; two
      individuals had weights between the 50th and 75th percentile later in
      childhood, after they were started on gastrostomy tube feedings
    explanation: Documents persistent postnatal deficiency and possible nutritional response.
- name: Congenital microcephaly
  category: Neurologic
  diagnostic: true
  frequency: OBLIGATE
  description: >-

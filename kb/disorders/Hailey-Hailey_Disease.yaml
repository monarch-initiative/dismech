    term:
      id: GO:0030057
      label: desmosome
  downstream:
  - target: Suprabasal Acantholysis Sparing the Adnexal Epithelia
    description: >-
      Failed desmosome assembly leaves suprabasal keratinocytes unable to hold
      to one another under mechanical and thermal stress.
  evidence:
  - reference: PMID:10615129
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Regulation of cytoplasmic calcium is impaired in cultured keratinocytes from HHD patients, and the normal epidermal calcium gradient is attenuated in vivo in HHD patients.
    explanation: >-
      Demonstrates this node directly, in both patient keratinocytes ex vivo and
      patient skin in vivo.
  - reference: PMID:38789364
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the ATP2C1 gene cause changes in the synthesis of junctional proteins, leading to acantholysis.
    explanation: >-
      States that the route from the calcium lesion to acantholysis runs through
      junctional protein synthesis, which is the claim of this node.
- name: Suprabasal Acantholysis Sparing the Adnexal Epithelia
  conforms_to: "desmosomal_adhesion_failure#Acantholysis and Mechanical Failure of Desmosome-Dependent Tissues"
  biological_scale: TISSUE
  description: >-
    Suprabasal keratinocytes separate widely from one another while remaining
    loosely attached, giving the characteristic "dilapidated brick wall"
    histology. Dyskeratotic cells are few, in contrast to Darier disease. The
    acantholysis is confined to the interfollicular epidermis and spares the
    adnexal epithelia, a distinction that separates it histologically from
    pemphigus vulgaris.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte

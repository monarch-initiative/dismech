    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It manifests as vesico-bullous lesions mainly in the flexural areas, which develop into erosions and crusts. Chronic lesions may form vegetative or verrucous plaques.
    explanation: >-
      Documents the lesion morphology and its flexural distribution.
  - reference: PMID:38789364
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It evolves with periods of remission and exacerbation, generally triggered by humidity, friction, heat, trauma and secondary infections.
    explanation: >-
      Documents the relapsing course and the mechanical, thermal and infective
      triggers.

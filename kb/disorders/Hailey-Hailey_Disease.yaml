      id: UBERON:0001003
      label: skin epidermis
  downstream:
  - target: Flexural Vesicles, Erosions and Vegetative Plaques
    description: >-
      An epidermis that cannot hold together blisters and erodes at the sites of
      greatest friction, heat and moisture.
  evidence:
  - reference: PMID:38789364
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      marked suprabasal acantholysis, loosely joined keratinocytes, giving the appearance of a "dilapidated brick wall", with a few dyskeratotic cells
    explanation: >-
      Documents the acantholytic histology and, in the same sentence, the
      paucity of dyskeratosis that distinguishes it from Darier disease.
  - reference: PMID:38789364
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The acantholysis affects the epidermis and spares the adnexal epithelia, which helps in the differential diagnosis with pemphigus vulgaris.
    explanation: >-
      Documents the adnexal sparing that separates this acantholysis from the
      autoimmune acantholysis of pemphigus.
- name: Flexural Vesicles, Erosions and Vegetative Plaques
  biological_scale: ORGANISM
  description: >-
    The clinical eruption: vesico-bullous lesions in flexural areas that evolve
    into erosions and crusts, with chronic lesions forming vegetative or
    verrucous plaques. Pruritus, burning and pain are common. The course is
    relapsing and remitting, and the exacerbating factors - humidity, friction,
    heat, trauma and secondary infection - are all mechanical or thermal
    stresses on an epidermis that cannot maintain adhesion, which is why
    flexures are the sites affected.
  biological_processes:
  - preferred_term: cell-cell adhesion
    term:
      id: GO:0098609
      label: cell-cell adhesion
    modifier: DECREASED
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  evidence:

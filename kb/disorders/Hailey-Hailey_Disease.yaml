- name: Flexural Vesicles, Erosions and Vegetative Plaques
  biological_scale: ORGANISM
  description: >-
    The clinical eruption: vesico-bullous lesions in flexural areas that evolve
    into erosions and crusts, with chronic lesions forming vegetative or
    verrucous plaques. Pruritus, burning and pain are common. The course is
    relapsing and remitting, and the exacerbating factors - humidity, friction,
    heat, trauma and secondary infection - are all mechanical or thermal
    stresses on an epidermis that cannot maintain adhesion, which is why
    flexures are the sites affected.

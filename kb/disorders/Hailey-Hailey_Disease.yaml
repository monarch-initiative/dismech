notes: >-
  Hailey-Hailey disease and Darier disease are the paired calcium-pump
  genodermatoses and are best read together: both reach acantholysis through
  loss of a keratinocyte calcium pump rather than through a primary desmosomal
  protein defect, and both conform to `desmosomal_adhesion_failure` by that
  calcium route rather than by its structural-gene route. They differ in the
  pump compartment (Golgi SPCA1 here, ER SERCA2 in Darier), in distribution
  (flexural versus seborrheic), and histologically in the amount of
  dyskeratosis, which is prominent in Darier and sparse here.

  The historical name "familial benign chronic pemphigus" is misleading in two
  ways and neither should be carried into curation. The disease is not a
  pemphigus: there are no autoantibodies and direct immunofluorescence is
  negative, so it reaches this module by an inherited route rather than the
  autoimmune one. It is also not benign in the sense of mild - it is
  non-malignant, but chronic flexural erosion, pain and pruritus carry
  substantial morbidity.

  Main differential diagnoses recorded in the literature are Darier disease,
  pemphigus vegetans, intertrigo, contact dermatitis and inverse psoriasis.

genetic:
- name: ATP2C1
  notes: >-
    ATP2C1 encodes SPCA1, a P-type calcium-transport ATPase of the secretory
    pathway, homologous to the yeast Golgi pump PMR1 and related to the SERCA
    and PMCA families. Reported pathogenic variants include nonsense,
    frameshift insertions and deletions, splice-site changes and
    non-conservative missense substitutions.
  gene_term:
    preferred_term: ATP2C1
    term:
      id: hgnc:13211
      label: ATP2C1
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:10767338
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 13 different mutations, including nonsense, frameshift insertion and deletions, splice-site mutations, and non-conservative missense mutations.
    explanation: >-
      Documents the pathogenic variant spectrum.
  - reference: PMID:10615129
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report here the identification of mutations in ATP2C1, encoding the human homologue of an ATP-powered pump that sequesters calcium into the Golgi in yeast, in 21 HHD kindreds.
    explanation: >-
      Independent identification of ATP2C1 across 21 kindreds, and states the
      Golgi calcium-sequestration function of the encoded pump.

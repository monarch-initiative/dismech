inheritance:
- name: Autosomal Dominant
  description: >-
    Hailey-Hailey disease is inherited in an autosomal dominant manner and
    results from a heterozygous ATP2C1 variant. Expression is variable, and the
    relapsing-remitting course means severity fluctuates within an individual as
    well as between family members.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:38789364
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hailey-Hailey disease is a rare genodermatosis described in 1939, with an autosomal dominant inheritance pattern, characterized by compromised adhesion between epidermal keratinocytes.
    explanation: >-
      States the mode of inheritance and the defining adhesion defect.
pathophysiology:
- name: ATP2C1 Haploinsufficiency and Loss of Golgi SPCA1 Pump Activity
  conforms_to: "desmosomal_adhesion_failure#Desmosomal Component Loss or Blockade"
  biological_scale: MOLECULAR
  description: >-
    A heterozygous loss-of-function variant in ATP2C1 reduces the functional
    dose of SPCA1, the P-type ATPase that pumps calcium from the cytosol into
    the Golgi apparatus. SPCA1 is expressed in all tissues but preferentially in
    keratinocytes, which is why a systemically expressed pump produces a purely
    cutaneous disease.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  molecular_functions:
  - preferred_term: P-type calcium transporter activity
    term:
      id: GO:0005388
      label: P-type calcium transporter activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  downstream:
  - target: Disturbed Keratinocyte Calcium Handling and the Epidermal Calcium Gradient
    description: >-
      Reduced Golgi calcium loading disturbs cytoplasmic calcium regulation and
      flattens the normal epidermal calcium gradient.
  evidence:
  - reference: PMID:10767338
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After reducing the disease critical region to <1 cM, we used a positional cloning strategy to identify the gene ATP2C1, which is mutated in HHD.
    explanation: >-
      Identifies ATP2C1 as the disease gene by positional cloning.
  - reference: PMID:38789364
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It results from a heterozygous mutation in the ATP2C1 gene, which encodes the transmembrane protein hSPA1C, present in all tissues, with preferential expression in keratinocytes.
    explanation: >-
      Establishes heterozygous ATP2C1 loss as the lesion and the keratinocyte
      expression bias that localizes the disease to skin.
- name: Disturbed Keratinocyte Calcium Handling and the Epidermal Calcium Gradient
  conforms_to: "desmosomal_adhesion_failure#Failure of Desmosome Assembly and Intermediate Filament Anchorage"
  biological_scale: CELLULAR
  description: >-
    Cytoplasmic calcium regulation is impaired in patient keratinocytes and the
    normal epidermal calcium gradient - the rising calcium concentration from
    basal to granular layer that instructs keratinocyte differentiation and
    adhesion - is attenuated in patient skin in vivo. Because junctional
    proteins require calcium-dependent processing through the secretory pathway,
    the consequence is a failure of desmosome assembly rather than a defect in
    any desmosomal protein itself.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: intracellular calcium ion homeostasis
    term:
      id: GO:0006874
      label: intracellular calcium ion homeostasis
    modifier: ABNORMAL
  - preferred_term: desmosome organization
    term:

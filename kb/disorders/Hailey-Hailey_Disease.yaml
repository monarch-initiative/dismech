name: Hailey-Hailey Disease
creation_date: "2026-08-22T00:00:00Z"
description: >-
  Hailey-Hailey disease (familial benign chronic pemphigus) is a rare autosomal
  dominant genodermatosis caused by heterozygous loss-of-function variants in
  ATP2C1, which encodes SPCA1, the secretory-pathway calcium ATPase that
  sequesters calcium into the Golgi. Loss of Golgi calcium loading impairs the
  processing and trafficking of junctional proteins, so desmosome assembly
  fails and suprabasal keratinocytes lose adhesion. The disease is a
  keratinocyte adhesion disorder rather than an autoimmune one: despite the
  historical name "pemphigus", there are no autoantibodies and direct
  immunofluorescence is negative. It typically begins in adulthood with
  vesicles and erosions in flexural sites - axillae, groin, inframammary and
  perineal folds - which crust and may become vegetative plaques, and it runs a
  relapsing course driven by heat, sweating, friction, trauma and secondary
  infection. Histology shows extensive suprabasal acantholysis producing the
  characteristic "dilapidated brick wall" appearance with few dyskeratotic
  cells.
category: Genetic
parents:
- Genodermatosis

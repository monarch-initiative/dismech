    snippet: >-
      DNA sequencing showed a homozygous C103T (R35W) transition in exon 1 of MLPH, confirming Griscelli syndrome type 3.
    explanation: >-
      Shows MLPH sequencing establishing the diagnosis.
differential_diagnoses:
- name: Griscelli syndrome type 1
  description: >-
    MYO5A-related Griscelli syndrome shares the silvery hair and hair-shaft
    pigment clumps but adds primary neurological impairment.
  distinguishing_features:
  - Primary central nervous system dysfunction is present in GS1 and absent in GS3.
  - Biallelic MYO5A rather than MLPH variants.
  disease_term:
    preferred_term: Griscelli syndrome type 1
    term:
      id: MONDO:0008962
      label: Griscelli syndrome type 1
  evidence:
  - reference: PMID:22711375
    reference_title: "Griscelli syndrome types 1 and 3: analysis of four new cases and long-term evaluation of previously diagnosed patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with GS type 1 have primary central nervous system dysfunction, type 2 patients commonly develop hemophagocytic lymphohistiocytosis, and type 3 patients have only partial albinism.
    explanation: >-
      Contrasts the three types by their extracutaneous involvement.
- name: Griscelli syndrome type 2
  description: >-
    RAB27A-related Griscelli syndrome shares the pigmentary phenotype but
    carries a cytotoxic-lymphocyte defect that leads to haemophagocytic
    lymphohistiocytosis and needs haematopoietic stem cell transplantation.
  distinguishing_features:
  - Haemophagocytic lymphohistiocytosis in GS2; absent in GS3.
  - Biallelic RAB27A rather than MLPH variants.
  disease_term:
    preferred_term: Griscelli syndrome type 2
    term:
      id: MONDO:0011872
      label: Griscelli syndrome type 2
  evidence:
  - reference: PMID:22711375
    reference_title: "Griscelli syndrome types 1 and 3: analysis of four new cases and long-term evaluation of previously diagnosed patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While hematopoietic stem cell transplantation is life saving in type 2, no specific therapy is required for types 1 and 3.
    explanation: >-
      The management consequence of separating GS2 from GS3.
  - reference: PMID:12897212
    reference_title: "Griscelli syndrome restricted to hypopigmentation results from a melanophilin defect (GS3) or a MYO5A F-exon deletion (GS1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two different genetic forms, GS1 and GS2, respectively, account for the mutually exclusive neurological and immunological phenotypes.
    explanation: >-
      Defines GS1 and GS2 by the extracutaneous phenotypes that GS3 lacks.
genetic:
- name: MLPH
  notes: >-
    MLPH (2q37.3) encodes melanophilin, a RAB27A effector with an N-terminal
    RAB27-binding Slp homology domain, a C-terminal half that binds the myosin
    Va globular tail, and an actin-binding domain. Reported GS3 alleles are
    few; p.R35W recurs in Arab and Turkish families. Older reports number it
    c.102C>T and later ones c.103C>T for the same p.R35W change.
  gene_term:
    preferred_term: MLPH
    term:
      id: hgnc:29643
      label: MLPH
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  variants:
  - name: MLPH p.R35W
    description: >-
      Homozygous missense in the Slp homology domain (c.103C>T, reported as
      c.102C>T in older nomenclature). Recurrent in Arab and Turkish families;
      abolishes the RAB27A interaction and leaves almost no melanophilin
      protein in patient melanocytes.
    evidence:
    - reference: PMID:21883982
      reference_title: "Cellular and clinical report of new Griscelli syndrome type III cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All affected individuals carried a homozygous missense mutation (c.102C>T; p.R35W), located in the conserved Slp homology domain of MLPH, and had hypomelanosis of the skin and hair.
      explanation: >-
        Seven patients in three consanguineous pedigrees homozygous for
        p.R35W.
  - name: MLPH p.D25H
    description: >-
      Homozygous missense (c.73G>C) in the Slp homology domain, reported in a
      Chinese Han patient from a non-consanguineous family. It reduces RAB27A
      binding without lowering protein level.
    evidence:
    - reference: PMID:35602484
      reference_title: "Identification of a Novel MLPH Missense Mutation in a Chinese Griscelli Syndrome 3 Patient."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The proband carried a novel homozygous missense mutation (c.73G>C; p.D25H), residing in the conserved Slp homology domain of MLPH
      explanation: >-
        Identifies the variant and its homozygous state in the proband.
  evidence:
  - reference: PMID:12897212
    reference_title: "Griscelli syndrome restricted to hypopigmentation results from a melanophilin defect (GS3) or a MYO5A F-exon deletion (GS1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We herein present genetic and functional evidence that a third form of GS (GS3), whose expression is restricted to the characteristic hypopigmentation of GS, results from mutation in the gene that encodes melanophilin (Mlph), the ortholog of the gene mutated in leaden mice.
    explanation: >-
      Establishes MLPH as the GS3 gene.
  - reference: PMID:30389201
    reference_title: "[Griscelli syndrome type 3: A new case]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      R35W mutation was described in 9 cases and E98X and R35Q mutations were each found in one case.
    explanation: >-
      Summarizes the MLPH allele spectrum among the cases reported to 2018.
- name: MYO5A F-exon deletion
  relationship_type: DISPUTED
  association: >-
    Phenocopy. A homozygous deletion of the tissue-restricted MYO5A F-exon
    produces the same isolated hypopigmentation; the reporting authors classed
    it as a restricted form of GS1, not GS3.
  notes: >-
    Some ontology and aggregator records map this genotype to GS3. This entry
    keeps MLPH as the defining gene and records the MYO5A F-exon deletion as an
    alternative cause of the identical phenotype without asserting it is GS3,
    following the classification of the paper that described it.
  gene_term:
    preferred_term: MYO5A
    term:
      id: hgnc:7602
      label: MYO5A
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:12897212
    reference_title: "Griscelli syndrome restricted to hypopigmentation results from a melanophilin defect (GS3) or a MYO5A F-exon deletion (GS1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also show that an identical phenotype can result from the deletion of the MYO5A F-exon, an exon with a tissue-restricted expression pattern.
    explanation: >-
      Reports the MYO5A F-exon deletion as a cause of the same restricted
      pigmentary phenotype; the paper's title assigns it to GS1.
treatments:
- name: Genetic Counseling
  description: >-
    No disease-specific therapy is needed. Management is molecular typing,
    reassurance and counseling for autosomal recessive recurrence. Treatments
    used in GS2, such as haematopoietic stem cell transplantation, are not
    indicated.
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:22711375
    reference_title: "Griscelli syndrome types 1 and 3: analysis of four new cases and long-term evaluation of previously diagnosed patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While hematopoietic stem cell transplantation is life saving in type 2, no specific therapy is required for types 1 and 3.
    explanation: >-
      States that GS3 needs no specific therapy, which leaves counseling as
      the management.
animal_models:
- name: Leaden mouse (Mlph ln/ln)
  species: Mouse
  genotype: Mlph ln/ln (leaden), homozygous recessive
  publication: PMID:11504925
  description: >-
    The classical recessive leaden coat-color mutant, caused by Mlph mutations.
    Leaden mice have a diluted coat with normal melanin synthesis and
    perinuclear clumping of melanosomes in melanocytes, the same cellular
    defect as human GS3. Leaden melanocytes were also used to show that
    melanophilin is required to recruit myosin Va to the melanosome.
  evidence:
  - reference: PMID:11504925
    reference_title: "Mutations in Mlph, encoding a member of the Rab effector family, cause the melanosome transport defects observed in leaden mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Collectively, our data show that Mlph is a critical component of the melanosome transport machinery and suggest that Mlph might function as part of a transport complex with Rab27a and MyoVa.
    explanation: >-
      Identifies Mlph as the leaden gene and places it in the melanosome
      transport machinery.
  modeled_mechanisms:
  - target: Perinuclear Melanosome Clustering in Melanocytes
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Leaden melanocytes show perinuclear melanosome clumping like GS3 patient
      melanocytes.
    limitations: >-
      Natural mouse alleles are not the human GS3 variants, and mouse coat
      dilution is not a direct measure of human skin and hair pigmentation.
    evidence:
    - reference: PMID:11504925
      reference_title: "Mutations in Mlph, encoding a member of the Rab effector family, cause the melanosome transport defects observed in leaden mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results are consistent with previous experiments showing that melanosomes in leaden melanocytes clump in the perinuclear region of the cell in a manner similar to that of dilute and ash melanocytes (13).
      explanation: >-
        Reports perinuclear melanosome clumping in leaden melanocytes.
  - target: Failure of the RAB27A-Melanophilin-Myosin Va Tripartite Complex
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      In leaden primary melanocytes myosin Va does not associate with
      melanosomes although RAB27A does.
    limitations: >-
      Shown in cultured primary melanocytes rather than in skin in vivo.
    evidence:
    - reference: PMID:11929602
      reference_title: "Melanophilin, the product of the leaden locus, is required for targeting of myosin-Va to melanosomes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The localization of rab27a to melanosomes did not require the function of either myosin-Va or melanophilin, but leaden function was required for the association of myosin-Va with melanosomes.
      explanation: >-
        Shows the broken link of the tripartite complex in leaden cells.
notes: >-
  GS3 is the isolated pigmentary member of the Griscelli syndromes. The three
  types lose different members of one melanosome-transport complex (MYO5A in
  GS1, RAB27A in GS2, MLPH in GS3) and share the hair and skin phenotype, but
  RAB27A and MYO5A also act outside the melanosome, in cytotoxic granule
  release and in neurons respectively. Loss of melanophilin is restricted to
  the pigmentary phenotype, which is why GS3 has no immunological or
  neurological disease.

  Non-pigmentary findings in the three Arab GS3 pedigrees of PMID:21883982
  (for example recurrent pneumonia in one proband, whose immunological and
  neurological evaluation was normal) were described by the reporting authors
  as non-Griscelli manifestations, probably due to the high consanguinity of
  the families, and are not curated as GS3 phenotypes.

  This entry conforms to `lysosome_related_organelle_biogenesis` at the same
  nodes as Griscelli_Syndrome_Type_2: melanosomes are built and pigmented but
  not positioned and delivered. It has no counterpart of that entry's
  cytotoxic-granule arm.

  No GeneReviews or StatPearls chapter covers Griscelli syndrome type 3
  (Bookshelf index snapshot 2026-09-10 plus a live PubMed title search).

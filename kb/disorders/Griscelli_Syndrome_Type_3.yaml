prevalence:
- population: Worldwide, published case reports
  measure_type: CASES_IN_LITERATURE
  notes: >-
    Fifteen GS3 cases had been reported by 2018 (9 male, 6 female), mostly of
    Arab or Turkish origin, with p.R35W in nine. Later single-family reports
    (Ethiopian sisters, a Chinese Han patient) have added to that count; no
    population-based prevalence or incidence estimate exists.
  evidence:
  - reference: PMID:30389201
    reference_title: "[Griscelli syndrome type 3: A new case]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      15 cases of GS type 3 have been reported: 9 in males and 6 in females.
    explanation: >-
      Gives the literature case count, which is the only occurrence measure
      available for GS3.
  - reference: PMID:30389201
    reference_title: "[Griscelli syndrome type 3: A new case]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nine of the reported patients were of Arab origin, four of Turkish origin, and one of Indian origin.
    explanation: >-
      Records the ancestry distribution of the reported cases.
pathophysiology:
- name: MLPH Loss of Function
  conforms_to: "lysosome_related_organelle_biogenesis#Loss of a Lysosome-Related Organelle Biogenesis or Trafficking Component"
  biological_scale: MOLECULAR
  description: >-
    Biallelic germline MLPH variants remove functional melanophilin. The
    recurrent p.R35W and the p.D25H missense variants sit in the N-terminal Slp
    homology (RAB27-binding) domain; p.E98X truncates the protein. In patient
    melanocytes homozygous for p.R35W, melanophilin protein is almost
    undetectable, whereas p.D25H leaves protein abundance unchanged and acts
    through loss of binding instead - two routes to the same functional loss.
  genes:
  - preferred_term: MLPH
    term:
      id: hgnc:29643
      label: MLPH
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  molecular_functions:
  - preferred_term: small GTPase binding (RAB27A)
    term:
      id: GO:0031267
      label: small GTPase binding
    modifier: DECREASED
  - preferred_term: myosin V binding
    term:
      id: GO:0031489
      label: myosin V binding
    modifier: DECREASED
  downstream:
  - target: Failure of the RAB27A-Melanophilin-Myosin Va Tripartite Complex
    description: >-
      Absent or binding-defective melanophilin removes the bridge between
      melanosome-bound RAB27A and myosin Va.
    evidence:
    - reference: PMID:21883982
      reference_title: "Cellular and clinical report of new Griscelli syndrome type III cases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        co-immunoprecipitation assays showed that MLPH(R35W) lost its interaction with RAB27A, indicating pathogenicity of the R35W mutation
      explanation: >-
        Shows directly that the patient variant abolishes the RAB27A
        interaction that the complex depends on.
  evidence:
  - reference: PMID:12897212
    reference_title: "Griscelli syndrome restricted to hypopigmentation results from a melanophilin defect (GS3) or a MYO5A F-exon deletion (GS1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We herein present genetic and functional evidence that a third form of GS (GS3), whose expression is restricted to the characteristic hypopigmentation of GS, results from mutation in the gene that encodes melanophilin (Mlph), the ortholog of the gene mutated in leaden mice.
    explanation: >-
      The founding report identifying MLPH mutation as the cause of GS3.
  - reference: PMID:21883982
    reference_title: "Cellular and clinical report of new Griscelli syndrome type III cases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      MLPH protein expression is nearly absent in both GSIII melanocytes lysates (0.65% for DB200 and 3.61% for DB212) compared to control (100%) (Figure 4B).
    explanation: >-
      Immunoblotting of cultured patient melanocytes shows near-absent
      melanophilin protein with the recurrent p.R35W variant.
- name: Failure of the RAB27A-Melanophilin-Myosin Va Tripartite Complex
  biological_scale: MOLECULAR
  description: >-
    Melanophilin binds GTP-RAB27A on the melanosome through its N-terminal Slp
    homology domain and the globular tail of myosin Va through its C-terminal
    half, and also binds actin. It is required for myosin Va to associate with
    melanosomes. When melanophilin is lost, RAB27A still reaches the
    melanosome but myosin Va is not recruited, so the organelle is not
    captured by the peripheral actin network.
  cellular_components:
  - preferred_term: melanosome
    term:
      id: GO:0042470
      label: melanosome
  downstream:
  - target: Perinuclear Melanosome Clustering in Melanocytes
    description: >-
      Without the actin tether, mature melanosomes are not retained at the
      melanocyte periphery and accumulate around the nucleus.
    evidence:
    - reference: PMID:12861011
      reference_title: "The actin-binding domain of Slac2-a/melanophilin is required for melanosome distribution in melanocytes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        the Slac2-a mutants induced melanosome accumulation in the perinuclear region, possibly by a dominant negative effect, the same as the Rab27A-binding-defective mutant of Slac2-a or the myosin Va-binding-defective mutant
      explanation: >-
        Melanophilin mutants unable to bind RAB27A, myosin Va or actin each
        cause perinuclear melanosome accumulation in melanocytes, linking
        failure of each tether to the cellular phenotype.
  evidence:
  - reference: PMID:11856727
    reference_title: "Slac2-a/melanophilin, the missing link between Rab27 and myosin Va: implications of a tripartite protein complex for melanosome transport."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Deletion analysis and site-directed mutagenesis showed that the N-terminal Slp (synaptotagmin-like protein) homology domain of Slac2-a specifically binds Rab27A/B isoforms and that the C-terminal half directly binds the globular tail of myosin Va.
    explanation: >-
      Maps melanophilin's two binding surfaces that make it the bridge of the
      tripartite complex.
  - reference: PMID:11929602
    reference_title: "Melanophilin, the product of the leaden locus, is required for targeting of myosin-Va to melanosomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The localization of rab27a to melanosomes did not require the function of either myosin-Va or melanophilin, but leaden function was required for the association of myosin-Va with melanosomes.
    explanation: >-
      In cultured primary melanocytes from leaden (Mlph-mutant) mice, myosin
      Va fails to associate with melanosomes while RAB27A localization is
      preserved, placing melanophilin between the two.
  - reference: PMID:35602484
    reference_title: "Identification of a Novel MLPH Missense Mutation in a Chinese Griscelli Syndrome 3 Patient."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      greatly reduced its binding to RAB27A, although the protein level of MLPH in the patient was not changed
    explanation: >-
      A second patient variant, p.D25H, disrupts the RAB27A interaction
      without lowering melanophilin abundance.
- name: Perinuclear Melanosome Clustering in Melanocytes
  conforms_to: "lysosome_related_organelle_biogenesis#Interrupted Melanosome Maturation or Peripheral Positioning"
  biological_scale: CELLULAR
  description: >-
    Mature, pigmented melanosomes aggregate around the nucleus of the melanocyte
    and dendrites and dendritic tips are left depleted of them. This is the
    cellular hallmark shared by all three Griscelli forms. In GS3 patient
    melanocytes it is reversed by expressing wild-type melanophilin but not the
    p.R35W variant.
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  cellular_components:
  - preferred_term: melanosome
    term:
      id: GO:0042470
      label: melanosome
  biological_processes:
  - preferred_term: melanosome transport
    term:
      id: GO:0032402
      label: melanosome transport
    modifier: DECREASED
  - preferred_term: melanosome localization
    term:
      id: GO:0032400
      label: melanosome localization
    modifier: ABNORMAL
  downstream:
  - target: Defective Melanosome Transfer to Keratinocytes and Hair
    description: >-
      Melanosomes held around the nucleus do not reach the dendritic tips from
      which they are transferred.
    evidence:
    - reference: PMID:21883982
      reference_title: "Cellular and clinical report of new Griscelli syndrome type III cases."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: IN_VITRO
      snippet: >-
        Defects in any of the components of this tripartite complex result in failure to retain melanosomes in the cell periphery, resulting in perinuclear localization of melanosomes, and consequently failure to transfer melanosomes to neighboring keratinocytes, ultimately causing hypopigmentation.
      explanation: >-
        States the causal sequence from perinuclear retention to failed
        transfer to keratinocytes; it is the paper's introductory synthesis of
        prior cell-biology work rather than its own result.
  evidence:
  - reference: PMID:21883982
    reference_title: "Cellular and clinical report of new Griscelli syndrome type III cases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We report the first cellular studies on GSIII melanocytes, which demonstrated that MLPH(R35W) causes perinuclear aggregation of melanosomes in melanocytes, typical for GS.
    explanation: >-
      Demonstrates the cellular phenotype in cultured melanocytes from GS3
      patients.
  - reference: PMID:21883982
    reference_title: "Cellular and clinical report of new Griscelli syndrome type III cases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      over-expression of MLPH(R35W) in GSIII melanocytes failed to rescue perinuclear melanosome distribution
    explanation: >-
      The variant cannot restore peripheral distribution in patient cells,
      while the same study reports rescue with wild-type melanophilin,
      attributing the clustering to the MLPH defect.
  - reference: PMID:35602484
    reference_title: "Identification of a Novel MLPH Missense Mutation in a Chinese Griscelli Syndrome 3 Patient."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the MLPH (D25H) variant had an inhibitory effect on melanosome transport by exhibiting perinuclear melanosome aggregation in melanocytes
    explanation: >-
      Reproduces perinuclear aggregation with an independent patient variant.
- name: Defective Melanosome Transfer to Keratinocytes and Hair
  conforms_to: "lysosome_related_organelle_biogenesis#Failed Delivery of Functional Melanosomes to Keratinocytes"
  biological_scale: TISSUE
  description: >-
    Because melanosomes do not reach the dendritic tips, transfer of pigment
    from melanocytes into neighbouring epidermal keratinocytes and into the
    growing hair shaft is reduced and uneven. Pigment synthesis itself is
    normal; the defect is in delivery, which is why hair contains a few large
    irregular melanin clumps rather than evenly dispersed granules and why the
    skin is lighter than the family background.
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  locations:
  - preferred_term: skin epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  - preferred_term: hair follicle
    term:
      id: UBERON:0002073
      label: hair follicle
  downstream:
  - target: Silver-gray hair
    description: >-
      Hair that receives few, clumped melanosomes appears silvery-gray.
  - target: Large pigment clumps in the hair shaft
    description: >-
      Uneven transfer leaves pigment in large irregular aggregates along the
      shaft.
  - target: Generalized skin hypopigmentation
    description: >-
      Keratinocytes that receive less pigment give lighter skin.
  - target: White eyelashes
    description: >-
      The same delivery failure affects eyelash pigmentation.
  evidence:
  - reference: PMID:11504925
    reference_title: "Mutations in Mlph, encoding a member of the Rab effector family, cause the melanosome transport defects observed in leaden mice."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: MODEL_ORGANISM
    snippet: >-
      All three mutant loci encode genes that are required for the polarized transport of melanosomes, the specialized, pigment-containing organelles of melanocytes, to the neighboring keratinocytes and eventually into coat hairs.
    explanation: >-
      States that the leaden (Mlph), ashen and dilute genes are required for
      delivery of melanosomes to keratinocytes and into hair, the step this
      node describes.
phenotypes:
- category: Dermatologic
  name: Silver-gray hair
  description: >-
    Silvery-gray sheen of scalp hair, eyebrows and eyelashes, usually noticed
    in childhood and stable through life. It is the presenting and often the
    only clinical sign; reported adults with GS3 are otherwise healthy.
  phenotype_term:
    preferred_term: Silver-gray hair
    term:
      id: HP:0002218
      label: Silver-gray hair
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:21883982
    reference_title: "Cellular and clinical report of new Griscelli syndrome type III cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      abnormal pigmentation compared to his siblings (Figure 2A) was noticed, including silvery-gray hair, eyebrows, and eyelashes, which are typical clinical features for all three types of GS
    explanation: >-
      Describes silvery-gray hair, eyebrows and eyelashes in a GS3 patient,
      relative to unaffected siblings.
  - reference: PMID:22711375
    reference_title: "Griscelli syndrome types 1 and 3: analysis of four new cases and long-term evaluation of previously diagnosed patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients with type 3 are healthy at ages 21 and 24 years having only pigmentary dilution; silvery gray hair, eye brows, and eyelashes
    explanation: >-
      Long-term follow-up of GS3 patients shows silvery hair as the sole
      persisting manifestation into adulthood.
- category: Dermatologic
  name: Generalized skin hypopigmentation
  description: >-
    Diffuse hypopigmentation of the skin relative to unaffected relatives,
    which can be subtle in lightly pigmented families.
  phenotype_term:
    preferred_term: Generalized hypopigmentation of the skin
    term:
      id: HP:0007513
      label: Generalized hypopigmentation
  evidence:
  - reference: PMID:21883982
    reference_title: "Cellular and clinical report of new Griscelli syndrome type III cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected individuals carried a homozygous missense mutation (c.102C>T; p.R35W), located in the conserved Slp homology domain of MLPH, and had hypomelanosis of the skin and hair.
    explanation: >-
      All seven affected members of three Arab pedigrees had skin
      hypomelanosis.
  - reference: PMID:30389201
    reference_title: "[Griscelli syndrome type 3: A new case]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 31-year-old female patient had presented depigmentation of the hair and eyebrows as well as diffuse skin hypopigmentation during childhood.
    explanation: >-
      Reports diffuse skin hypopigmentation from childhood in a molecularly
      confirmed case.
- category: Dermatologic
  name: Large pigment clumps in the hair shaft
  description: >-
    On light microscopy the hair shaft carries large melanin clumps distributed
    irregularly along its length, the microscopic hallmark that separates the
    Griscelli syndromes from other forms of silvery hair.

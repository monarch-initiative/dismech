- name: MLPH molecular testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Sequencing of MLPH (in practice with RAB27A and MYO5A) assigns the
    Griscelli type. This matters because the pigmentary phenotype is shared
    and only the genotype separates benign GS3 from GS2, which needs
    immunological surveillance and transplantation.
  results: >-
    Biallelic pathogenic MLPH variants confirm Griscelli syndrome type 3.
  evidence:
  - reference: PMID:22711375
    reference_title: "Griscelli syndrome types 1 and 3: analysis of four new cases and long-term evaluation of previously diagnosed patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since prognosis, treatment options, and genetic counseling markedly differ among different types, molecular characterization has utmost importance in GS.
    explanation: >-

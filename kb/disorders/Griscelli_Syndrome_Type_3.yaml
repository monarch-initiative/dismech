name: Griscelli Syndrome Type 3
creation_date: "2026-10-18T00:00:00Z"
description: >-
  Griscelli syndrome type 3 (GS3) is an ultra-rare autosomal recessive disorder
  of melanosome transport caused by biallelic loss-of-function variants in MLPH,
  which encodes melanophilin. Melanophilin is the adaptor that bridges
  GTP-bound RAB27A on the melanosome membrane to the actin-based motor myosin
  Va, so that mature melanosomes are captured in the peripheral actin network
  of melanocytes and handed on to keratinocytes and growing hair. Without it,
  melanosomes are made and pigmented normally but cluster around the melanocyte
  nucleus, and skin and hair receive too little pigment. The clinical picture
  is restricted to pigmentary dilution - silvery-gray hair, eyebrows and
  eyelashes, light skin, and large irregular melanin clumps in the hair shaft.
  Unlike Griscelli syndrome type 1 (MYO5A, primary neurological impairment) and
  type 2 (RAB27A, cytotoxic-lymphocyte defect and haemophagocytic
  lymphohistiocytosis), GS3 carries no immunological or neurological disease,
  because melanophilin acts only in the melanosome complex; reported patients
  followed into adulthood are healthy apart from the pigmentary dilution.
category: Mendelian
parents:
- Genodermatosis

    series; predates routine prenatal ascertainment and termination, so it is not
    directly comparable with the surveillance estimates below.
  evidence:
  - reference: PMID:7773297
    reference_title: >-
      Thanatophoric dysplasia (types I and II) caused by distinct mutations in
      fibroblast growth factor receptor 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thanatophoric dysplasia (TD), the most common neonatal lethal skeletal
      dysplasia, affects one out of 20,000 live births.
    explanation: >-
      States the live-birth frequency of thanatophoric dysplasia as a whole, and its
      standing as the commonest neonatal-lethal skeletal dysplasia.
- population: United States, four population-based birth-defects surveillance programs (Atlanta, Iowa, Oklahoma, Texas)
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_low: 2.1
  rate_high: 3.0
  notes: >-
    0.21-0.30 per 10,000 livebirths (1 in 47,620 to 1 in 33,330), reported for
    thanatophoric dysplasia overall rather than by subtype. Registries ascertained
    livebirths, late fetal deaths and elective terminations, so the estimate is less
    depressed by prenatal termination than a livebirth-only count would be.
  evidence:
  - reference: PMID:18698630
    reference_title: >-
      The population-based prevalence of achondroplasia and thanatophoric dysplasia
      in selected regions of the US.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of thanatophoric dysplasia ranged from 0.21 to 0.30 per 10,000
      livebirths (1/33,330-1/47,620 livebirths).
    explanation: >-
      Population-based US birth prevalence for thanatophoric dysplasia as a single
      entity across four surveillance programs.
  - reference: PMID:18698630
    reference_title: >-
      The population-based prevalence of achondroplasia and thanatophoric dysplasia
      in selected regions of the US.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data suggest that thanatophoric dysplasia is one-third to one-half as
      frequent as achondroplasia.
    explanation: >-
      Anchors TD's occurrence against achondroplasia, the reference point of the same
      FGFR3 allelic series, within a single ascertainment framework.
- population: Western Mexico, Hospital Civil de Guadalajara Dr. Juan I. Menchaca, 2009-2024
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 8.5
  rate_low: 3.2
  rate_high: 13.7
  notes: >-
    0.85 per 10,000 births (95% CI 0.32-1.37); 10 TD births in 118,154, i.e. 1 in
    11,815. Single-hospital referral series, materially higher than the US
    surveillance figure; all ten cases were TD1.
  evidence:
  - reference: PMID:42547059
    reference_title: >-
      Thanatophoric dysplasia: prevalence, clinical characteristics, and molecular
      findings in a public hospital from Western Mexico.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of TD was 0.85 per 10,000 births (95% CI: 0.32-1.37).
    explanation: >-
      A second, independent population estimate of TD birth prevalence, reported for
      TD as a whole with a confidence interval.
  - reference: PMID:42547059
    reference_title: >-
      Thanatophoric dysplasia: prevalence, clinical characteristics, and molecular
      findings in a public hospital from Western Mexico.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten live births with TD were included from a total of 118,154 births between 2009 and 2024 at the Hospital Civil de Guadalajara Dr. Juan I. Menchaca (Mexico).
    explanation: >-
      Gives the numerator and denominator behind the rate. Recorded as PARTIAL because
      a single tertiary referral hospital is not a defined source population, so the
      point estimate is not directly comparable with the population-based US figure.

progression:
- phase: Perinatal death from respiratory insufficiency
  age_range: Birth to the first days of life
  notes: >-
    Death in the perinatal period is the expected outcome. This is curated under
    `progression` rather than as a `phenotypes` entry because the corresponding HPO
    terms (HP:0003811 Neonatal death, HP:0001522 Death in infancy) sit in the HPO
    clinical-modifier/mortality branch rather than under HP:0000118 Phenotypic
    abnormality, and so are not members of the PhenotypeTerm dynamic enum — the same
    convention already used in `Cardiomyopathy-Hypotonia-Lactic_Acidosis_Syndrome.yaml`
    and `Arthrogryposis-Renal_Dysfunction-Cholestasis_Syndrome.yaml`.
  evidence:
  - reference: PMID:20301540
    reference_title: Thanatophoric Dysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most affected infants die of respiratory insufficiency shortly after birth. Rare long-term survivors have been reported.
    explanation: >-
      GeneReviews states the timing and mode of death for TD as a whole, and that
      long-term survival is exceptional.
  - reference: PMID:18698630
    reference_title: >-
      The population-based prevalence of achondroplasia and thanatophoric dysplasia
      in selected regions of the US.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 29 cases that were born alive, medical records indicated that 28 died during the neonatal period.
    explanation: >-
      Quantifies neonatal lethality in a population-based surveillance series, 28 of 29
      liveborn cases, rather than relying on a narrative term.

pathophysiology:
- name: Graded FGFR3 Gain-of-Function Activation
  conforms_to: "fgfr_gain_of_function_skeletal_dysplasia#Constitutive FGFR Activation"
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Every TD allele constitutively activates FGFR3 — ligand-independent receptor
    tyrosine phosphorylation and ligand-independent proliferative signalling — but the
    defining feature at the root level is that the TD alleles activate the receptor
    more strongly than the achondroplasia G380R allele does. This graded activation is
    the mechanistic basis of the FGFR3 severity gradient: hypochondroplasia (N540K),
    achondroplasia (G380R), SADDAN (K650M), thanatophoric dysplasia (R248C and related
    extracellular cysteine changes; K650E). Homozygous achondroplasia, which doubles
    the dose of a weaker allele, phenocopies TD — the dose-response corollary of the
    same claim. The receptor biology itself is held once in the
    `fgfr_gain_of_function_skeletal_dysplasia` module and is not re-derived here; see
    `Achondroplasia.yaml`, `Hypochondroplasia.yaml`, `SADDAN.yaml` and
    `Crouzon_Syndrome_with_Acanthosis_Nigricans.yaml` for the other points on the
    gradient.
  genes:
  - preferred_term: FGFR3
    term:
      id: hgnc:3690
      label: FGFR3
    modifier: GAIN_OF_FUNCTION
  molecular_functions:
  - preferred_term: transmembrane receptor protein tyrosine kinase activity
    term:
      id: GO:0004714
      label: transmembrane receptor protein tyrosine kinase activity
    modifier: INCREASED
  biological_processes:
  - preferred_term: fibroblast growth factor receptor signaling pathway
    term:
      id: GO:0008543
      label: fibroblast growth factor receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:8640234
    reference_title: >-
      Graded activation of fibroblast growth factor receptor 3 by mutations causing
      achondroplasia and thanatophoric dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, the mutations that are responsible for TD were more strongly
      activating than the mutation causing ACH, providing a biochemical explanation
      for the observation that the phenotype of TD is more severe than that of ACH.
    explanation: >-
      The direct biochemical anchor for the allelic-series claim: TD alleles are more
      strongly activating than the achondroplasia allele, which is why TD sits at the
      lethal end of the same FGFR3 gradient.
  - reference: PMID:8640234
    reference_title: >-
      Graded activation of fibroblast growth factor receptor 3 by mutations causing
      achondroplasia and thanatophoric dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We showed that each of the mutations constitutively activate the receptor, as
      evidenced by ligand-independent receptor tyrosine phosphorylation and cell
      proliferation.
    explanation: >-
      Establishes that the shared direction of effect across the series is
      constitutive, ligand-independent receptor activation — the module's trigger node.
  - reference: PMID:8640234
    reference_title: >-
      Graded activation of fibroblast growth factor receptor 3 by mutations causing
      achondroplasia and thanatophoric dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous achondroplasia resembles the phenotype of TD.
    explanation: >-
      The dose-response corollary of graded activation: doubling a weaker allele
      reproduces the phenotype of a single stronger one, which is what a severity
      gradient driven by receptor-activation strength predicts.
  - reference: PMID:7773297
    reference_title: >-
      Thanatophoric dysplasia (types I and II) caused by distinct mutations in
      fibroblast growth factor receptor 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of these mutations were found in 50 controls showing that mutations
      affecting different functional domains of FGFR3 cause different forms of this
      lethal disorder.
    explanation: >-
      Establishes that the TD1 and TD2 subtypes are separated by which functional
      domain of FGFR3 the activating change lies in, not by a different gene or a
      different direction of effect.
  downstream:
  - target: Severe Endochondral Growth Failure and Micromelia
    description: >-
      Strong constitutive FGFR3 signalling in growth-plate cartilage suppresses
      longitudinal endochondral bone growth. The intermediates (sustained MAPK/ERK and
      STAT1 signalling, chondrocyte proliferation arrest and impaired hypertrophic
      differentiation) are curated once in the
      fgfr_gain_of_function_skeletal_dysplasia module and in the TD1 and TD2 entries;
      they are deliberately not duplicated at the root.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

- name: Severe Endochondral Growth Failure and Micromelia
  conforms_to: "fgfr_gain_of_function_skeletal_dysplasia#Impaired Endochondral Ossification and Chondrodysplasia"
  biological_scale: TISSUE
  role: effector
  description: >-
    Endochondral ossification fails throughout the appendicular and axial skeleton,
    producing extreme micromelia, platyspondyly and — critically — short ribs.
    Histologically the growth plate shows disordered ossification with chondrocyte
    hyperplasia and loss of the orderly proliferative columns. At the root level this
    node exists to carry the step from cartilage failure to the thoracic dimension;
    the zone-by-zone growth-plate detail belongs to the module and the subtype entries.
  cell_types:
  - preferred_term: Growth-plate chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: Hypertrophic chondrocyte
    term:
      id: CL:0000743
      label: hypertrophic chondrocyte
  biological_processes:
  - preferred_term: endochondral ossification
    term:
      id: GO:0001958
      label: endochondral ossification
    modifier: DECREASED
  - preferred_term: growth plate cartilage development
    term:
      id: GO:0003417
      label: growth plate cartilage development
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:20301540
    reference_title: Thanatophoric Dysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thanatophoric dysplasia (TD) is a short-limb skeletal dysplasia that is usually lethal in the perinatal period.
    explanation: >-
      Establishes the disorder-level readout of the endochondral failure — a short-limb
      dysplasia — and its perinatal lethality, for TD as a whole rather than by subtype.
  - reference: PMID:39778871
    reference_title: >-
      An immunohistochemical study of thanatophoric dysplasia type 1 after fetus
      autopsy examination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microscopical evaluation indicated inadequate histological growth for the gestational age, with specific organ immaturity noted in multiple hematoxylin and eosin sections from internal organs, bone from epiphyses and diaphyses levels.
    explanation: >-
      Direct human fetal-autopsy histology showing growth inadequate for gestational
      age at the epiphyseal and diaphyseal levels, the tissue-level correlate of
      failed endochondral ossification.
  downstream:
  - target: Thoracic Insufficiency and Pulmonary Hypoplasia
    description: >-
      Short ribs and a small, bell-shaped thorax restrict the volume available for
      lung growth and for chest-wall excursion after birth.
    causal_link_type: DIRECT

- name: Thoracic Insufficiency and Pulmonary Hypoplasia
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The step that makes thanatophoric dysplasia lethal, and the one part of the chain
    that is TD-specific rather than shared with the viable members of the FGFR3
    allelic series. Severely shortened ribs and a narrow thorax restrict fetal lung
    growth and neonatal chest-wall excursion; respiratory insufficiency is the
    immediate cause of death in the great majority of affected infants. Survival
    beyond the perinatal period has been reported only with long-term tracheostomy and
    ventilation. This node is deliberately not anchored on the FGFR module:
    achondroplasia and hypochondroplasia share every upstream node and do not reach
    this one.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  biological_processes:
  - preferred_term: lung development
    term:
      id: GO:0030324
      label: lung development
    modifier: DECREASED
  - preferred_term: respiratory gaseous exchange
    term:
      id: GO:0007585
      label: respiratory gaseous exchange by respiratory system
    modifier: DECREASED
  evidence:
  - reference: PMID:20301540
    reference_title: Thanatophoric Dysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most affected infants die of respiratory insufficiency shortly after birth. Rare long-term survivors have been reported.
    explanation: >-
      GeneReviews states, for TD as a whole, that respiratory insufficiency is the
      mode of perinatal death and that survival is exceptional.
  - reference: PMID:20301540
    reference_title: Thanatophoric Dysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Newborns require long-term respiratory support (typically with tracheostomy and ventilation) to survive.
    explanation: >-
      Identifies the thoracic and respiratory limitation, rather than any other organ
      failure, as the rate-limiting constraint on survival.
  - reference: PMID:39778871
    reference_title: >-
      An immunohistochemical study of thanatophoric dysplasia type 1 after fetus
      autopsy examination.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the lungs, pseudoglandular growth predominated, transitioning partially to an early canalicular phase, and incomplete development was noted in bronchi, with primary and a few secondary bronchi visible, covered with pseudostratified columnar ciliated epithelium, with scattered goblet cells
    explanation: >-
      Human fetal-autopsy evidence of lung immaturity in TD1. Recorded as PARTIAL
      because at 17 weeks the pseudoglandular-to-canalicular transition is close to
      the normal developmental stage, so this documents the pulmonary phenotype
      without on its own demonstrating rib-cage-driven hypoplasia.

phenotypes:
- category: Skeletal
  name: Micromelia
  description: >-
    Extreme shortening of all four limbs, present in both TD subtypes and the feature
    that brings the pregnancy to attention on ultrasound.
  phenotype_term:
    preferred_term: Micromelia
    term:
      id: HP:0002983
      label: Micromelia
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:20301540
    reference_title: Thanatophoric Dysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TD type 1 is characterized by micromelia with bowed femurs and, uncommonly, the presence of craniosynostosis of varying severity. TD type 2 is
      characterized by micromelia with straight femurs and uniform presence of
      moderate-to-severe craniosynostosis with cloverleaf skull deformity.
    explanation: >-
      GeneReviews describes micromelia as definitional for both subtypes, which is why
      it is curated at the root rather than per subtype.
- category: Skeletal
  name: Short ribs
  description: >-
    Severely shortened ribs, the structural cause of the narrow thorax and hence of the
    respiratory insufficiency that kills most affected infants.
  phenotype_term:

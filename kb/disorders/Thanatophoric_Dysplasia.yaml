      extreme short stature.
    causal_link_type: DIRECT
  - target: Redundant skin folds along the limbs
    description: >-
      Skin and soft tissue grow normally over severely shortened limb bones, leaving
      excess skin in folds.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

- name: Thoracic Insufficiency and Pulmonary Hypoplasia
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The step that makes thanatophoric dysplasia lethal, and the one part of the chain
    that is TD-specific rather than shared with the viable members of the FGFR3
    allelic series. Severely shortened ribs and a narrow thorax restrict fetal lung
    growth and neonatal chest-wall excursion; respiratory insufficiency is the
    immediate cause of death in the great majority of affected infants. Survival
    beyond the perinatal period has been reported only with long-term tracheostomy and
    ventilation. This node is deliberately not anchored on the FGFR module:
    achondroplasia and hypochondroplasia share every upstream node and do not reach
    this one.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  biological_processes:
  - preferred_term: lung development
    term:
      id: GO:0030324
      label: lung development
    modifier: DECREASED
  - preferred_term: respiratory gaseous exchange
    term:
      id: GO:0007585
      label: respiratory gaseous exchange by respiratory system
    modifier: DECREASED
  evidence:
  - reference: PMID:20301540
    reference_title: Thanatophoric Dysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most affected infants die of respiratory insufficiency shortly after birth. Long-term survivors have been reported, supported by mechanical ventilation.
    explanation: >-
      GeneReviews states, for TD as a whole, that respiratory insufficiency is the
      mode of perinatal death and that long-term survival depends on ventilatory
      support.
  - reference: PMID:20301540
    reference_title: Thanatophoric Dysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Newborns require long-term respiratory support (commonly with mechanical ventilation and tracheostomy) to survive.
    explanation: >-
      Identifies the thoracic and respiratory limitation, rather than any other organ
      failure, as the rate-limiting constraint on survival.
  - reference: PMID:39778871
    reference_title: >-
      An immunohistochemical study of thanatophoric dysplasia type 1 after fetus
      autopsy examination.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the lungs, pseudoglandular growth predominated, transitioning partially to an early canalicular phase, and incomplete development was noted in bronchi, with primary and a few secondary bronchi visible, covered with pseudostratified columnar ciliated epithelium, with scattered goblet cells
    explanation: >-
      Human fetal-autopsy evidence of lung immaturity in TD1. At 17 weeks the
      pseudoglandular-to-canalicular transition is close to the normal developmental
      stage, so this documents the pulmonary phenotype without on its own
      demonstrating rib-cage-driven hypoplasia; the link to thoracic restriction is an
      inference.
  downstream:
  - target: Pulmonary hypoplasia
    description: >-
      Restriction of the thoracic cavity limits fetal lung growth.
    causal_link_type: DIRECT
  - target: Respiratory insufficiency
    description: >-
      The small thorax and hypoplastic lungs cannot sustain ventilation after birth
      without mechanical support.
    causal_link_type: DIRECT

- name: Disordered Temporal Lobe Cortical Development
  biological_scale: TISSUE
  role: effector
  description: >-
    A primary brain malformation, not a secondary effect of the skull. The temporal
    lobes show dysplasia with polymicrogyria, hippocampal abnormality and
    leptomeningeal glioneuronal heterotopia, with no detectable difference between TD1
    and TD2, which is why it is curated at the root. Systematic autopsy series find it
    in every case once it is looked for, and it is the substrate of the temporal-lobe
    epilepsy and severe developmental delay of long-term survivors. Mouse work with
    the TD2 allele places FGFR3 activity directly in cortical neurogenesis and
    migration.
  locations:
  - preferred_term: temporal lobe
    term:
      id: UBERON:0001871
      label: temporal lobe
  cell_types:
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  biological_processes:
  - preferred_term: cerebral cortex radially oriented cell migration
    term:
      id: GO:0021799
      label: cerebral cortex radially oriented cell migration
    modifier: DYSREGULATED
  - preferred_term: cerebral cortex development
    term:
      id: GO:0021987
      label: cerebral cortex development
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:23323754
    reference_title: "Thanatophoric dysplasia: autopsy findings over a 25-year period."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Temporal lobe dysplasia was recognized in 52% of the cases, and after 1998 temporal lobe dysplasia was described in all cases.
    explanation: >-
      A 25-case autopsy series of TD: once pathologists looked for it, temporal lobe
      dysplasia was present in every case.
  - reference: PMID:11965423
    reference_title: "[Thanatophoric dysplasia: report of 2 cases with neuropathological study]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microscopic examination of both cases revealed temporal lobe polymicrogyria, abnormalities of the hippocampus and heterotopic neuroglial tissue within the meninges. There were no noticeable differences in CNS abnormalities between TD type I and II.
    explanation: >-
      Neuropathology of one TD1 and one TD2 case shows the same temporal-lobe
      malformation in both subtypes, which places it at the TD level.
  - reference: PMID:33116259
    reference_title: >-
      Enhanced FGFR3 activity in postmitotic principal neurons during brain
      development results in cortical dysplasia and axonal tract abnormality.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In particular, late-born CUX1-positive neurons are widely dispersed throughout the GOF cortex.
    explanation: >-
      Cortical neuronal mispositioning in a mouse carrying constitutively active FGFR3
      K650E in cortical neurons; a model of the migration defect rather than of the
      human temporal-lobe lesion itself.
  downstream:
  - target: Temporal lobe dysplasia
    description: The malformation as seen on imaging and at autopsy.
    causal_link_type: DIRECT
  - target: Seizure
    description: >-
      Survivors have seizures, typically temporal-lobe epilepsy, attributed to the
      temporal-lobe malformation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34223453
      reference_title: >-
        Should We Stop Calling Thanatophoric Dysplasia a Lethal Condition? A Case
        Report of a Long-Term Survivor.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Seizures were common, typically temporal lobe epilepsy, but seemed to be manageable with antiepileptic medications.
      explanation: >-
        The authors' review of published long-term survivors reports seizures as
        common and characterises them as temporal lobe epilepsy, the seizure type that
        follows from the temporal-lobe malformation this node describes.
  - target: Global developmental delay
    description: >-
      The cortical malformation is the main candidate substrate of the severe
      psychomotor delay of survivors, which persists despite respiratory support;
      hypoxic and craniocervical contributions are not excluded.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES


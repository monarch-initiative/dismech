        histopathology, and gene analysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In spine, platyspondyly was due to a reduced height of the vertebral body anterior ossification center, while its enlargement in the transversal plane was not restricted.
      explanation: >-
        Localises the vertebral flattening to deficient growth of the anterior
        ossification centre, an endochondral growth defect.
  - target: Brachydactyly
    description: >-
      The tubular bones of the hands and feet are shortened by the same endochondral
      growth failure as the long bones.
    causal_link_type: DIRECT
  - target: Small foramen magnum
    description: >-
      The occipital bone around the foramen magnum forms by endochondral ossification

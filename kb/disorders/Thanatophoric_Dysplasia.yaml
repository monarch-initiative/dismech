name: Thanatophoric Dysplasia
creation_date: '2026-08-19T00:00:00Z'
category: Mendelian
description: >
  Thanatophoric dysplasia (TD) is the commonest neonatal-lethal skeletal dysplasia,
  caused by de novo heterozygous gain-of-function variants in FGFR3. It is a short-limb
  chondrodysplasia with micromelia, short ribs and a narrow thorax, relative macrocephaly,
  brachydactyly, hypotonia, redundant skin folds and distinctive facial features; most
  affected infants die of respiratory insufficiency shortly after birth, with rare
  long-term survivors on intensive respiratory support. TD is divided into two subtypes
  distinguished by femur and skull shape and by the underlying FGFR3 allele: TD type 1
  (curved/bowed femurs, craniosynostosis uncommon; heterogeneous alleles including
  R248C, Y373C, S249C, S371C and the stop-codon-extension changes) and TD type 2
  (straight femurs with uniform moderate-to-severe craniosynostosis and cloverleaf
  skull; essentially always the K650E kinase-domain change).

  This root entry deliberately carries only what is reported for TD as a whole — the
  TD-level birth prevalence, the shared prenatal-ultrasound to radiographic to
  molecular-confirmation diagnostic pathway (one assay covers both subtypes), the
  allelic-series framing that places TD at the severe end of the FGFR3 gradient, the
  TD1/TD2 discriminator, and the thoracic-insufficiency step that makes the disorder
  lethal. The receptor biology and the growth-plate cascade are not re-derived here;
  they are held once in the `fgfr_gain_of_function_skeletal_dysplasia` module, and the
  full subtype detail lives in the Thanatophoric Dysplasia Type 1 and Type 2 entries.
disease_term:
  preferred_term: thanatophoric dysplasia
  term:

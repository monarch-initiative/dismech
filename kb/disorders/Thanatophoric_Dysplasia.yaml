    label: thanatophoric dysplasia
synonyms:
- TD
- thanatophoric dwarfism
- FGFR3-related thanatophoric dysplasia
parents:
- FGFR3-related chondrodysplasia
- Lethal skeletal dysplasia
- Osteochondrodysplasia
classifications:
  isds_skeletal_category:
  - classification_value: fgfr3_chondrodysplasia
    notes: >-
      ISDS Nosology and Classification of Genetic Skeletal Disorders, 2019 revision
      (Mortier et al., PMID:31633310), Table 1 group 1 "FGFR3 chondrodysplasia group",
      which lists thanatophoric dysplasia types 1 and 2 alongside achondroplasia,
      hypochondroplasia and SADDAN. MONDO places the same concept under
      MONDO:0019685 FGFR3-related chondrodysplasia.

inheritance:
- name: Autosomal dominant (de novo)
  description: >-
    TD is transmitted as an autosomal dominant trait, but because it is a perinatally
    lethal condition affected individuals do not reproduce, so essentially every
    proband carries a de novo FGFR3 variant. Sib recurrence risk is not appreciably
    raised above the population rate; germline mosaicism in a healthy parent remains
    a theoretical possibility that has not been reported.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20301540
    reference_title: Thanatophoric Dysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TD is inherited in an autosomal dominant manner; the majority of probands have a de novo FGFR3 pathogenic variant.
    explanation: >-
      GeneReviews states the mode of inheritance and the predominance of de novo
      variants for thanatophoric dysplasia as a whole.
  - reference: PMID:20301540
    reference_title: Thanatophoric Dysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Germline mosaicism in healthy parents, although not reported to date, remains a theoretic possibility.
    explanation: >-
      Bounds the recurrence mechanism: germline mosaicism is unreported rather than
      established, so it is recorded as a theoretical possibility only.
  - reference: PMID:42547059
    reference_title: >-
      Thanatophoric dysplasia: prevalence, clinical characteristics, and molecular
      findings in a public hospital from Western Mexico.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All presented TD1 (4 men and 6 women), sporadic occurrence and 4/10 advanced paternal age.
    explanation: >-
      A consecutive hospital birth series in which every ascertained TD case was
      sporadic, consistent with de novo occurrence; the advanced-paternal-age skew is
      the expected signature of a paternally-derived de novo point mutation.

has_subtypes:
- name: TD1
  display_name: Thanatophoric dysplasia type 1
  classification: clinical
  description: >-
    Micromelia with curved (bowed, "telephone receiver") femurs; craniosynostosis is
    present only uncommonly and cloverleaf skull is unusual. Caused by a heterogeneous
    set of FGFR3 alleles, most often the extracellular/juxtamembrane cysteine-creating
    changes R248C, Y373C, S249C, S371C and G370C, plus the stop-codon-extension
    changes in exon 18. Curated in full in `Thanatophoric_Dysplasia_Type_1.yaml`.
  subtype_term:
    preferred_term: thanatophoric dysplasia type 1
    term:
      id: MONDO:0008546
      label: thanatophoric dysplasia type 1
  genes:
  - preferred_term: FGFR3
    term:
      id: hgnc:3690
      label: FGFR3
  evidence:
  - reference: PMID:20301540
    reference_title: Thanatophoric Dysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TD type 1 is characterized by micromelia with bowed femurs and, uncommonly, the presence of craniosynostosis of varying severity.
    explanation: >-
      GeneReviews defines the TD1 subtype by bowed femurs and the low frequency of
      craniosynostosis.
  - reference: PMID:42547059
    reference_title: >-
      Thanatophoric dysplasia: prevalence, clinical characteristics, and molecular
      findings in a public hospital from Western Mexico.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In seven, pathogenic variants in FGFR3 were identified: p.Arg248Cys (n = 3), p.Ser371Cys (n = 2), p.Gly370Cys (n = 1) and p.Try373Cys (n = 1).
    explanation: >-
      Documents the allelic heterogeneity of TD1 in a consecutive series — four
      different FGFR3 changes across seven molecularly solved cases — in contrast to
      the essentially invariant TD2 allele.
- name: TD2
  display_name: Thanatophoric dysplasia type 2
  classification: clinical
  description: >-
    Micromelia with straight femurs and uniform moderate-to-severe craniosynostosis
    with cloverleaf skull deformity. Essentially always caused by the single recurrent
    FGFR3 p.Lys650Glu (K650E) change in the tyrosine kinase domain. Curated in full in
    `Thanatophoric_Dysplasia_Type_2.yaml`.
  subtype_term:
    preferred_term: thanatophoric dysplasia type 2
    term:
      id: MONDO:0008547
      label: thanatophoric dysplasia type 2
  genes:
  - preferred_term: FGFR3
    term:
      id: hgnc:3690
      label: FGFR3
  evidence:
  - reference: PMID:20301540
    reference_title: Thanatophoric Dysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TD type 2 is characterized by micromelia with straight femurs and uniform presence of moderate-to-severe craniosynostosis with cloverleaf skull deformity.
    explanation: >-
      GeneReviews defines the TD2 subtype by straight femurs and the constant presence
      of cloverleaf skull, the two features that separate it from TD1 radiologically.
  - reference: PMID:7773297
    reference_title: >-
      Thanatophoric dysplasia (types I and II) caused by distinct mutations in
      fibroblast growth factor receptor 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A sporadic mutation causing a Lys650Glu change in the tyrosine kinase domain
      of FGFR3 was found in 16 of 16 individuals with one type of TD.
    explanation: >-
      The original demonstration that a single kinase-domain allele accounts for the
      TD2 subtype in every case examined — the molecular half of the TD1/TD2
      discriminator.

prevalence:

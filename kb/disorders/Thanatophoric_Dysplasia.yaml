progression:
- phase: Perinatal death from respiratory insufficiency
  age_range: Birth to the first days of life
  notes: >-
    Death in the perinatal period is the expected outcome. This is curated under
    `progression` rather than as a `phenotypes` entry because the corresponding HPO
    terms (HP:0003811 Neonatal death, HP:0001522 Death in infancy) sit in the HPO
    clinical-modifier/mortality branch rather than under HP:0000118 Phenotypic
    abnormality, and so are not members of the PhenotypeTerm dynamic enum — the same
    convention already used in `Cardiomyopathy-Hypotonia-Lactic_Acidosis_Syndrome.yaml`
    and `Arthrogryposis-Renal_Dysfunction-Cholestasis_Syndrome.yaml`.
  evidence:
  - reference: PMID:20301540
    reference_title: Thanatophoric Dysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most affected infants die of respiratory insufficiency shortly after birth. Long-term survivors have been reported, supported by mechanical ventilation.
    explanation: >-
      GeneReviews states the timing and mode of death for TD as a whole, and that
      long-term survival depends on ventilatory support.
  - reference: PMID:31247124
    reference_title: National survey of prevalence and prognosis of thanatophoric dysplasia in Japan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 51 live newborns, 27 died ≤7 days after birth, with an early neonatal mortality rate of 56%.
    explanation: >-
      Quantifies early neonatal mortality in a nationwide live-born TD cohort; the
      same survey shows that the infants who died within two days were those who did
      not receive respiratory management.
- phase: Long-term survival with continuous respiratory support
  age_range: Beyond the early neonatal period, into childhood and adulthood
  notes: >-
    Survival past the neonatal period is not exceptional when respiratory support is
    offered: in the Japanese nationwide survey every infant who survived the first week
    had received respiratory management, and two-thirds of those survived a year or
    more. Survivors remain ventilator-dependent, with extreme short stature, severe
    psychomotor delay, seizures, foramen magnum stenosis and acquired acanthosis
    nigricans. Whether perinatal death is the expected outcome therefore depends in
    part on whether intensive support is offered, which is why the authors question the
    name "thanatophoric".
  evidence:
  - reference: PMID:31247124
    reference_title: National survey of prevalence and prognosis of thanatophoric dysplasia in Japan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 24 newborns who survived the early neonatal period, 16 survived for ≥1 year. All of the 24 newborns received respiratory management and survived during the early neonatal period. Of the 51 live newborns, 25 did not receive respiratory management and died ≤2 days after birth.
    explanation: >-
      Population-level evidence that survival beyond the neonatal period occurs, and
      that it tracks the provision of respiratory management.
  - reference: PMID:34597445
    reference_title: Development of individuals with thanatophoric dysplasia surviving beyond infancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term survival of TD individuals is common. Some individuals enjoy home-based lives; however, they are severely psychosocially and physically disabled and require meticulous respiratory and nutritional support.
    explanation: >-
      Follow-up of 20 Japanese survivors aged 1.2-27.8 years characterises the
      long-term phase: survival is common with support, with severe disability.
  - reference: PMID:34597445
    reference_title: Development of individuals with thanatophoric dysplasia surviving beyond infancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All individuals required assisted ventilation.
    explanation: >-
      Every survivor in the cohort was ventilator-dependent, so long-term survival does
      not mean the thoracic restriction has resolved.
pathophysiology:
- name: Graded FGFR3 Gain-of-Function Activation
  conforms_to: "fgfr_gain_of_function_skeletal_dysplasia#Constitutive FGFR Activation"
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Every TD allele constitutively activates FGFR3 — ligand-independent receptor
    tyrosine phosphorylation and ligand-independent proliferative signalling — but the
    defining feature at the root level is that the TD alleles activate the receptor
    more strongly than the achondroplasia G380R allele does. This graded activation is
    the mechanistic basis of the FGFR3 severity gradient: hypochondroplasia (N540K),
    achondroplasia (G380R), SADDAN (K650M), thanatophoric dysplasia (R248C and related
    extracellular cysteine changes; K650E). Homozygous achondroplasia, which doubles
    the dose of a weaker allele, phenocopies TD — the dose-response corollary of the
    same claim. The receptor biology itself is held once in the
    `fgfr_gain_of_function_skeletal_dysplasia` module and is not re-derived here; see
    `Achondroplasia.yaml`, `Hypochondroplasia.yaml`, `SADDAN.yaml` and
    `Crouzon_Syndrome_with_Acanthosis_Nigricans.yaml` for the other points on the
    gradient.
  genes:
  - preferred_term: FGFR3
    term:
      id: hgnc:3690
      label: FGFR3
    modifier: GAIN_OF_FUNCTION
  molecular_functions:
  - preferred_term: transmembrane receptor protein tyrosine kinase activity
    term:
      id: GO:0004714
      label: transmembrane receptor protein tyrosine kinase activity
    modifier: INCREASED
  biological_processes:
  - preferred_term: fibroblast growth factor receptor signaling pathway
    term:
      id: GO:0008543
      label: fibroblast growth factor receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:8640234
    reference_title: >-
      Graded activation of fibroblast growth factor receptor 3 by mutations causing
      achondroplasia and thanatophoric dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, the mutations that are responsible for TD were more strongly
      activating than the mutation causing ACH, providing a biochemical explanation
      for the observation that the phenotype of TD is more severe than that of ACH.
    explanation: >-
      The direct biochemical anchor for the allelic-series claim: TD alleles are more
      strongly activating than the achondroplasia allele, which is why TD sits at the
      lethal end of the same FGFR3 gradient.
  - reference: PMID:8640234
    reference_title: >-
      Graded activation of fibroblast growth factor receptor 3 by mutations causing
      achondroplasia and thanatophoric dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We showed that each of the mutations constitutively activate the receptor, as
      evidenced by ligand-independent receptor tyrosine phosphorylation and cell
      proliferation.
    explanation: >-
      Establishes that the shared direction of effect across the series is
      constitutive, ligand-independent receptor activation — the module's trigger node.
  - reference: PMID:8640234
    reference_title: >-
      Graded activation of fibroblast growth factor receptor 3 by mutations causing
      achondroplasia and thanatophoric dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous achondroplasia resembles the phenotype of TD.
    explanation: >-
      The dose-response corollary of graded activation: doubling a weaker allele
      reproduces the phenotype of a single stronger one, which is what a severity
      gradient driven by receptor-activation strength predicts.
  - reference: PMID:7773297
    reference_title: >-
      Thanatophoric dysplasia (types I and II) caused by distinct mutations in
      fibroblast growth factor receptor 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of these mutations were found in 50 controls showing that mutations
      affecting different functional domains of FGFR3 cause different forms of this
      lethal disorder.
    explanation: >-
      Establishes that the TD1 and TD2 subtypes are separated by which functional
      domain of FGFR3 the activating change lies in, not by a different gene or a
      different direction of effect.
  downstream:
  - target: Severe Endochondral Growth Failure and Micromelia
    description: >-
      Strong constitutive FGFR3 signalling in growth-plate cartilage suppresses
      longitudinal endochondral bone growth. The intermediates (sustained MAPK/ERK and
      STAT1 signalling, chondrocyte proliferation arrest and impaired hypertrophic
      differentiation) are curated once in the
      fgfr_gain_of_function_skeletal_dysplasia module and in the TD1 and TD2 entries;
      they are deliberately not duplicated at the root.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Disordered Temporal Lobe Cortical Development
    description: >-
      Constitutive FGFR3 signalling in the developing telencephalon disturbs cortical
      neurogenesis and neuronal migration, most visibly in the temporal lobe. The
      direct genetic demonstration is in a mouse expressing the TD2 allele in cortical
      neurons; the human evidence is the constancy of the temporal-lobe malformation
      across both subtypes.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33116259
      reference_title: >-
        Enhanced FGFR3 activity in postmitotic principal neurons during brain
        development results in cortical dysplasia and axonal tract abnormality.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We found that GOF disrupts mitosis of radial-glia neural progenitors (RGCs), inside-out radial migration of post-mitotic glutamatergic neurons, and axonal tract projections.
      explanation: >-
        Constitutively active FGFR3 (K650E) in mouse cortical neurons is sufficient to
        disturb cortical neurogenesis and radial migration. Mouse, and restricted to
        postmitotic neurons, so it supports the edge by inference rather than
        reproducing the human temporal-lobe lesion.
  - target: Acanthosis nigricans
    description: >-
      Acanthosis nigricans in TD survivors is attributed to FGFR3 activation in the
      skin, as in the other FGFR3 gain-of-function disorders that share it (SADDAN,
      Crouzon syndrome with acanthosis nigricans), and is not a consequence of insulin
      resistance. The epidermal intermediates are not curated here.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34223453
      reference_title: >-
        Should We Stop Calling Thanatophoric Dysplasia a Lethal Condition? A Case
        Report of a Long-Term Survivor.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Acanthosis nigricans, a known skin finding in children with changes in the FGFR3 gene unrelated to glucose intolerance, was first observed in Charlie at approximately two years of age
      explanation: >-
        Attributes the acanthosis nigricans of a TD1 survivor to the FGFR3 variant
        rather than to glucose intolerance.

- name: Severe Endochondral Growth Failure and Micromelia
  conforms_to: "fgfr_gain_of_function_skeletal_dysplasia#Impaired Endochondral Ossification and Chondrodysplasia"
  biological_scale: TISSUE
  role: effector
  description: >-
    Endochondral ossification fails throughout the appendicular and axial skeleton,
    producing extreme micromelia, platyspondyly and — critically — short ribs.
    Histologically the growth plate shows disordered ossification with chondrocyte
    hyperplasia and loss of the orderly proliferative columns. At the root level this
    node exists to carry the step from cartilage failure to the thoracic dimension;
    the zone-by-zone growth-plate detail belongs to the module and the subtype entries.
  cell_types:
  - preferred_term: Growth-plate chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: Hypertrophic chondrocyte
    term:
      id: CL:0000743
      label: hypertrophic chondrocyte
  biological_processes:
  - preferred_term: endochondral ossification
    term:
      id: GO:0001958
      label: endochondral ossification
    modifier: DECREASED
  - preferred_term: growth plate cartilage development
    term:
      id: GO:0003417
      label: growth plate cartilage development
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:20301540
    reference_title: Thanatophoric Dysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thanatophoric dysplasia (TD) is a short-limb skeletal dysplasia that is typically lethal in the perinatal period.
    explanation: >-
      Establishes the disorder-level readout of the endochondral failure — a short-limb
      dysplasia — and its perinatal lethality, for TD as a whole rather than by subtype.
  - reference: PMID:39778871
    reference_title: >-
      An immunohistochemical study of thanatophoric dysplasia type 1 after fetus
      autopsy examination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microscopical evaluation indicated inadequate histological growth for the gestational age, with specific organ immaturity noted in multiple hematoxylin and eosin sections from internal organs, bone from epiphyses and diaphyses levels.
    explanation: >-
      Direct human fetal-autopsy histology showing growth inadequate for gestational
      age at the epiphyseal and diaphyseal levels, the tissue-level correlate of
      failed endochondral ossification.
  - reference: PMID:24859745
    reference_title: >-
      Thanatophoric dysplasia. Correlation among bone X-ray morphometry,
      histopathology, and gene analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Generalized shortening of long bones was observed in TD. A variable distribution of axial deformities was correlated with chondrocyte proliferation inhibition, defective seriate cell columns organization, and final formation of the primary metaphyseal trabeculae.
    explanation: >-
      Eight second-trimester TD fetuses compared with matched controls tie the
      generalised long-bone shortening to inhibited chondrocyte proliferation and
      loss of column organisation in the growth plate.
  downstream:
  - target: Thoracic Insufficiency and Pulmonary Hypoplasia
    description: >-
      Short ribs and a small, bell-shaped thorax restrict the volume available for
      lung growth and for chest-wall excursion after birth.
    causal_link_type: DIRECT
  - target: Micromelia
    description: >-
      Failed longitudinal growth at the long-bone growth plates produces the extreme
      limb shortening.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24859745
      reference_title: >-
        Thanatophoric dysplasia. Correlation among bone X-ray morphometry,
        histopathology, and gene analysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Generalized shortening of long bones was observed in TD. A variable distribution of axial deformities was correlated with chondrocyte proliferation inhibition, defective seriate cell columns organization, and final formation of the primary metaphyseal trabeculae.
      explanation: >-
        Correlates the radiographic long-bone shortening with the growth-plate
        histology in the same fetuses.
  - target: Short ribs
    description: >-
      The ribs grow by endochondral ossification at their costochondral junctions and
      are shortened by the same growth-plate failure.
    causal_link_type: DIRECT
  - target: Narrow thorax
    description: >-
      Shortened ribs together with platyspondyly give the small, narrow chest.
    causal_link_type: DIRECT
  - target: Platyspondyly
    description: >-
      Reduced growth of the anterior ossification centre of the vertebral body
      flattens the vertebrae.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24859745
      reference_title: >-

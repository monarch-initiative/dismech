      On brain imaging, a majority of children in the literature had ventriculomegaly and/or temporal lobe dysplasia or dysgenesis; however, only two children had a ventriculoperitoneal shunt placed (Table 1).
    explanation: >-
      Review of published long-term survivors: most had ventriculomegaly and/or
      temporal lobe dysplasia on brain imaging, and two needed shunting.
  notes: >-
    Not causally connected: neither cited source states the mechanism of the
    ventricular enlargement.
- category: Neurological
  name: Global developmental delay
  description: >-
    Severe psychomotor delay in every survivor studied; the most advanced
    psychosocial development reached was about that of a 2-year-old.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:34597445
    reference_title: Development of individuals with thanatophoric dysplasia surviving beyond infancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All individuals showed severely delayed psychomotor development. The highest level of psychosocial development was equivalent to that at 2 years of age.
    explanation: >-
      Universal severe developmental delay among 20 long-term survivors. Frequency is
      not banded because it can only be assessed in the minority who survive infancy.
- category: Skeletal
  name: Small foramen magnum
  description: >-
    Narrowing of the foramen magnum, as in achondroplasia, with risk of
    craniocervical-junction compression in survivors; suboccipital decompression is
    used when it is critical.
  phenotype_term:
    preferred_term: Small foramen magnum
    term:
      id: HP:0002677
      label: Small foramen magnum
  evidence:
  - reference: PMID:34223453
    reference_title: >-
      Should We Stop Calling Thanatophoric Dysplasia a Lethal Condition? A Case
      Report of a Long-Term Survivor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As seen in achondroplasia, the anterior-posterior diameter of the foramen magnum can be significantly narrowed in TD.
    explanation: >-
      States foramen magnum narrowing as a TD feature, and its parallel with
      achondroplasia.
- category: Integumentary
  name: Acanthosis nigricans
  description: >-
    Acquired hyperpigmented, thickened skin in flexures and friction sites, appearing
    in the first years of life in survivors and unrelated to glucose intolerance.
    GeneReviews lists it among the features common to both subtypes; it is
    occasional across TD as a whole because most infants do not survive long enough
    to develop it, but common among survivors.
  phenotype_term:
    preferred_term: Acanthosis nigricans
    term:
      id: HP:0000956
      label: Acanthosis nigricans
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:20301540
    reference_title: Thanatophoric Dysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Other features common to type 1 and type 2 include: short ribs, narrow thorax, relative macrocephaly, distinctive facial features, brachydactyly, hypotonia, acanthosis nigricans, and redundant skin folds along the limbs.
    explanation: >-
      GeneReviews lists acanthosis nigricans as common to both TD subtypes.
  - reference: PMID:34597445
    reference_title: Development of individuals with thanatophoric dysplasia surviving beyond infancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Skin disorders (acanthosis nigricans and seborrheic keratoses) were common.
    explanation: >-
      Acanthosis nigricans is common among long-term survivors.
  - reference: ORPHA:2655
    reference_title: "Thanatophoric dysplasia"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0000956 | Acanthosis nigricans | Occasional (29-5%)"
    explanation: Orphanet annotates acanthosis nigricans as occasional across TD.
- category: Prenatal
  name: Polyhydramnios
  description: >-
    Excess amniotic fluid complicating some affected pregnancies; one of the
    pregnancy complications that prenatal management aims to anticipate.
  phenotype_term:
    preferred_term: Polyhydramnios
    term:
      id: HP:0001561
      label: Polyhydramnios
  frequency: OCCASIONAL
  evidence:
  - reference: ORPHA:2655
    reference_title: "Thanatophoric dysplasia"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0001561 | Polyhydramnios | Occasional (29-5%)"
    explanation: Orphanet annotates polyhydramnios as occasional in TD.
  - reference: PMID:20301540
    reference_title: Thanatophoric Dysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      When TD is diagnosed prenatally, treatment goals are to avoid potential pregnancy complications including prematurity, polyhydramnios, malpresentation, and delivery complications from macrocephaly and/or a flexed and rigid neck
    explanation: >-
      GeneReviews names polyhydramnios among the pregnancy complications of a TD
      pregnancy.

histopathology:
- name: Disordered growth-plate ossification with chondrocyte hyperplasia
  description: >-
    Fetal long-bone sections show disordered ossification with centrally located
    loosely structured osteoid, chondrocyte hyperplasia and failure of the normal
    columnar organisation of the proliferative zone.
  evidence:
  - reference: PMID:39778871
    reference_title: >-
      An immunohistochemical study of thanatophoric dysplasia type 1 after fetus
      autopsy examination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bone sections displayed disordered ossification, centrally located loosely structured osteoid, chondrocyte hyperplasia, and incomplete column formation, with reactive chondrocytes and foci resembling bone marrow in areas with incipient or no apparent ossification.
    explanation: >-
      Direct human fetal-autopsy histology of the growth plate in genetically confirmed
      TD1, describing the disordered ossification and loss of column formation.
  notes: >-
    Reported from a single 17-week TD1 fetal autopsy (R248C). Curated at the root
    because the finding is a growth-plate consequence shared by both subtypes, but the
    published observation is TD1-only and n=1.

diagnosis:
- name: Prenatal ultrasound recognition
  description: >-
    TD can be recognised prenatally, on ultrasound showing severe shortening of all
    long bones with a narrow thorax and relative macrocephaly. Prenatal ultrasound is
    sufficient to drive management decisions but does not by itself separate TD from
    the other lethal skeletal dysplasias.
  diagnosis_term:
    preferred_term: ultrasound imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:39778871
    reference_title: >-
      An immunohistochemical study of thanatophoric dysplasia type 1 after fetus
      autopsy examination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The decision was based on ultrasonographic examination showing pronounced shortening of all long bones with a characteristic curvature of the femur, without evidence of heredity.
    explanation: >-
      A worked example of the ultrasound findings that trigger the diagnosis, including
      the femoral curvature that points towards TD1 specifically.
- name: Clinical and radiographic diagnosis
  description: >-
    The diagnosis is established on characteristic clinical and radiologic features —
    micromelia, short ribs and narrow thorax, platyspondyly, and the femur and skull
    shape that separate the subtypes — and/or on molecular confirmation. Radiography
    is what assigns TD1 (curved femurs) versus TD2 (straight femurs with cloverleaf
    skull).
  diagnosis_term:
    preferred_term: radiograph imaging procedure
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:20301540
    reference_title: Thanatophoric Dysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of TD is established in a proband with characteristic clinical and/or radiologic features and/or a heterozygous pathogenic variant in FGFR3 identified by molecular genetic testing.
    explanation: >-
      GeneReviews states the diagnostic criteria for TD as a whole, giving clinical,
      radiologic and molecular routes.
  - reference: PMID:39778871
    reference_title: >-
      An immunohistochemical study of thanatophoric dysplasia type 1 after fetus
      autopsy examination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The X-rays validated the gross findings, emphasizing abnormalities in the long bones of the extremities and the skull.
    explanation: >-
      Confirms radiography as the modality that validates the skeletal findings in
      practice, including at postmortem examination.
- name: Molecular confirmation of FGFR3 variant
  description: >-
    Molecular testing confirms the clinical and radiological diagnosis, distinguishes
    TD from the other lethal chondrodysplasias, and assigns the subtype. A single
    multiplexed PCR plus single-nucleotide-extension assay covers 14 recurrent FGFR3
    changes accounting for 99% of TD1 and TD2 together — including the technically
    awkward adjacent stop-codon changes in exon 18 — so one reaction serves both
    subtypes with a shorter turnaround than Sanger or next-generation sequencing. This
    shared single-assay diagnostic pathway is a root-level property of TD: it is
    defined over the union of the subtypes, not over either one.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:39357670
    reference_title: >-
      A Single Multiplex PCR and Single-Nucleotide Extension Assay for the Detection
      of Common Thanatophoric Dysplasia I and II Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We developed a single multiplexed PCR and a single-nucleotide extension (SNE) assay to identify 14 common mutations causing 99% of TD I and TD II, including the challenging three adjacent mutations in the stop codon of exon 18 of the FGFR3 gene.
    explanation: >-
      Establishes that one assay covers both TD subtypes at 99% of cases — the
      technical basis for treating molecular confirmation as a single TD-level
      diagnostic step rather than two subtype-specific ones.
  - reference: PMID:39357670
    reference_title: >-
      A Single Multiplex PCR and Single-Nucleotide Extension Assay for the Detection
      of Common Thanatophoric Dysplasia I and II Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation analysis provides confirmation of a clinical and radiological diagnosis of thanatophoric dysplasia types I and II (TD I and II).
    explanation: >-
      States the role of molecular testing as confirmatory of the clinical and
      radiological diagnosis, for both subtypes.
  - reference: PMID:42547059
    reference_title: >-
      Thanatophoric dysplasia: prevalence, clinical characteristics, and molecular
      findings in a public hospital from Western Mexico.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular analysis allows to distinguish it from other lethal chondrodysplasias and to provide appropriate genetic counseling.
    explanation: >-
      States the clinical purpose of molecular confirmation — separating TD from the
      other lethal chondrodysplasias and enabling counselling.

- name: Non-invasive prenatal diagnosis on maternal plasma cell-free DNA
  description: >-
    When ultrasound suggests a lethal skeletal dysplasia, the recurrent FGFR3 TD
    variants can be sought in cell-free fetal DNA in maternal plasma, avoiding the
    miscarriage risk of amniocentesis or chorionic villus sampling. Because TD has
    many possible causative alleles and nearly always arises de novo, a sequencing
    panel across the FGFR3 hotspots is more useful than allele-specific PCR. The same
    approach can exclude recurrence of a known familial variant early in a later
    pregnancy where gonadal mosaicism is a concern.
  diagnosis_term:
    preferred_term: non-invasive prenatal genetic testing of maternal plasma cell-free DNA
    term:
      id: NCIT:C15709
      label: Genetic Testing
  notes: >-
    No LOINC code names FGFR3 testing on maternal plasma cell-free DNA
    specifically: a full search for "FGFR3" returns 277 LOINC entities (read to
    the end), and the only FGFR3 molecular-testing codes among them specify
    Blood or Tissue (postnatal) or Amniotic fluid or Chorionic villus sample
    (the invasive route this test exists to avoid) as the specimen. Binding
    one of those would misstate the specimen this row describes, so the row
    is left unbound.
  evidence:
  - reference: PMID:25728633
    reference_title: >-
      Non-invasive prenatal diagnosis of achondroplasia and thanatophoric dysplasia:
      next-generation sequencing allows for a safer, more accurate, and comprehensive
      approach.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PCR-RED was performed in 72 cases and was correct in 88.6%, inconclusive in 7% with one false negative. NGS was performed in 47 cases and was accurate in 96.2% with no inconclusives.
    explanation: >-
      Clinical comparison in pregnancies at risk of achondroplasia or TD showing that
      cell-free DNA sequencing of FGFR3 is accurate enough for diagnostic use.
  - reference: PMID:25728633
    reference_title: >-
      Non-invasive prenatal diagnosis of achondroplasia and thanatophoric dysplasia:
      next-generation sequencing allows for a safer, more accurate, and comprehensive
      approach.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conditions such as TD, while this approach may be suitable to exclude recurrence, albeit the risk is very low, of a known mutation in families with a relevant family history, it is less useful for the diagnosis of ultrasound abnormalities in cases arising de novo when there are multiple potential causative mutations.
    explanation: >-
      Explains why a multi-allele sequencing panel, rather than single-allele PCR,
      suits TD, and the role of the test in excluding recurrence.
  - reference: PMID:30048571
    reference_title: >-
      Noninvasive prenatal test for FGFR3-related skeletal dysplasia based on
      next-generation sequencing and plasma cell-free DNA: Test performance analysis
      and feasibility exploration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In clinical validation, our method identified all fetal FGFR3 mutant alleles from maternal plasma, with no false positive results.
    explanation: >-
      An independent multiplex-PCR sequencing assay over 19 FGFR3 loci detected the
      fetal variants in maternal plasma, including two TD1 pregnancies; the clinical
      sample was small.

differential_diagnoses:
- name: Homozygous achondroplasia
  description: >-
    Biallelic FGFR3 p.Gly380Arg produces a lethal short-limb phenotype closely
    resembling TD. The distinction is made molecularly (two copies of a weaker allele
    versus one copy of a stronger one) and by parental phenotype, since both parents
    of a homozygous-achondroplasia infant have achondroplasia while TD is essentially
    always de novo to unaffected parents.
  disease_term:
    preferred_term: achondroplasia
    term:
      id: MONDO:0007037
      label: achondroplasia
  distinguishing_features:
  - >-
    Two affected parents and biallelic G380R on molecular testing, versus unaffected
    parents and a single strongly activating de novo FGFR3 allele in TD. See
    `Achondroplasia.yaml`.
  evidence:
  - reference: PMID:8640234
    reference_title: >-
      Graded activation of fibroblast growth factor receptor 3 by mutations causing
      achondroplasia and thanatophoric dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous achondroplasia resembles the phenotype of TD.
    explanation: >-
      States the phenotypic overlap that makes homozygous achondroplasia the principal
      FGFR3-internal differential for TD.
- name: Other lethal chondrodysplasias
  description: >-
    Fibrochondrogenesis, achondrogenesis, the short-rib polydactyly syndromes and
    osteogenesis imperfecta type II all present prenatally with severe micromelia and a
    narrow thorax and are not reliably separable from TD on ultrasound alone. FGFR3
    molecular analysis is what resolves them.
  distinguishing_features:
  - >-
    Identification of a recurrent activating FGFR3 variant establishes TD and excludes
    the collagen-, cilium- and matrix-related lethal dysplasias.
  evidence:
  - reference: PMID:42547059
    reference_title: >-
      Thanatophoric dysplasia: prevalence, clinical characteristics, and molecular
      findings in a public hospital from Western Mexico.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular analysis allows to distinguish it from other lethal chondrodysplasias and to provide appropriate genetic counseling.
    explanation: >-
      States directly that molecular analysis is the step that separates TD from the
      other lethal chondrodysplasias.

genetic:
- name: FGFR3
  gene_term:
    preferred_term: FGFR3
    term:
      id: hgnc:3690
      label: FGFR3
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  presence: Heterozygous activating variant in essentially all cases
  association: >-
    Heterozygous gain-of-function FGFR3 variants cause both TD subtypes. The subtypes
    are separated by which functional domain the change lies in: extracellular and
    juxtamembrane cysteine-creating changes plus the exon-18 stop-codon extensions in
    TD1, and the single recurrent kinase-domain K650E change in TD2. Per-allele detail
    is curated in the subtype entries.
  evidence:
  - reference: PMID:7773297
    reference_title: >-
      Thanatophoric dysplasia (types I and II) caused by distinct mutations in
      fibroblast growth factor receptor 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A sporadic mutation causing a Lys650Glu change in the tyrosine kinase domain
      of FGFR3 was found in 16 of 16 individuals with one type of TD. Of 39
      individuals with a second type of TD, 22 had a mutation causing an Arg248Cys
      change and one had a Ser371Cys substitution, both in the extracellular region of
      the protein.
    explanation: >-
      The founding series establishing FGFR3 as the gene for both TD subtypes and
      showing the domain split between them.
  - reference: PMID:20301540
    reference_title: Thanatophoric Dysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of TD is established in a proband with characteristic clinical and/or radiologic features and/or a heterozygous pathogenic variant in FGFR3 identified by molecular genetic testing.
    explanation: >-
      GeneReviews confirms heterozygous FGFR3 as the molecular basis of TD as a whole.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_6c00b5e7-5685-4f03-b9ac-1601b62e57c5-2022-01-13T170000.000Z
    evidence:
    - reference: CGGV:assertion_6c00b5e7-5685-4f03-b9ac-1601b62e57c5-2022-01-13T170000.000Z
      reference_title: "FGFR3 / thanatophoric dysplasia (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "FGFR3 | HGNC:3690 | thanatophoric dysplasia | MONDO:0017042 | AD | Definitive"
      explanation: >-
        ClinGen Skeletal Disorders GCEP classifies FGFR3 in autosomal dominant
        thanatophoric dysplasia (MONDO:0017042, this entry's disease term) as
        Definitive.
    - reference: CGGV:assertion_6c00b5e7-5685-4f03-b9ac-1601b62e57c5-2022-01-13T170000.000Z
      reference_title: "FGFR3 / thanatophoric dysplasia (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Per criteria outlined by the ClinGen Lumping and Splitting guidelines, we found no difference in molecular mechanism, inheritance pattern, and phenotypic variability.
      explanation: >-
        ClinGen lumped TD types I and II into a single disease entity for curation,
        which is the TD-level framing this root entry carries.
  notes: >-
    The ClinGen assertion was curated at the lumped TD level (TD1 OMIM:187600 and TD2
    OMIM:187601 together), so it is recorded here on the root rather than on either
    subtype entry. MONDO also records FGFR3 as the causal gene for MONDO:0017042 via
    RO:0004003.

treatments:
- name: Comfort-focused and supportive perinatal care
  action_category: THERAPEUTIC
  description: >-
    Because most affected infants die in the perinatal period from multisystem
    complications, management goals are set with the family and commonly focus on
    comfort care. Infants who are to be supported require long-term respiratory
    support, typically tracheostomy and ventilation. Anaesthetic guidelines for
    skeletal dysplasias apply. Other measures in long-term survivors include shunting
    for hydrocephalus, suboccipital decompression for craniocervical-junction
    constriction, anti-seizure medication and hearing aids.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: Thoracic Insufficiency and Pulmonary Hypoplasia
    treatment_effect: BYPASSES
    description: >-
      Tracheostomy and long-term ventilation substitute for the chest-wall excursion
      the restrictive thorax cannot provide; they bypass the mechanical limitation
      rather than altering the skeletal lesion that causes it.
    evidence:
    - reference: PMID:20301540
      reference_title: Thanatophoric Dysplasia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Newborns require long-term respiratory support (commonly with mechanical ventilation and tracheostomy) to survive.
      explanation: >-
        Identifies the respiratory-support intervention as acting on the thoracic
        insufficiency node, and as a prerequisite for survival rather than a cure.
  evidence:
  - reference: PMID:20301540
    reference_title: Thanatophoric Dysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Management goals should be established in consultation with the family and may focus on provision of comfort care.
    explanation: >-
      GeneReviews states the default management framing for TD as a whole.
  - reference: PMID:20301540
    reference_title: Thanatophoric Dysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Other treatment measures may include shunt placement for hydrocephalus, suboccipital decompression for relief of craniocervical junction constriction, anti-seizure medication to control seizures, hearing aids, ophthalmology management of exotropia, and developmental support.
    explanation: >-
      Enumerates the supportive interventions relevant to long-term survivors.
- name: Vosoritide (off-label, single case report)
  action_category: THERAPEUTIC
  description: >-
    Vosoritide is a C-type natriuretic peptide analogue that counteracts FGFR3
    overactivation and is approved for achondroplasia, not for thanatophoric dysplasia.
    Its use in TD rests on a SINGLE off-label case report (n = 1): a 9-year-old
    long-term TD1 survivor treated for 28 months, in whom growth velocity and lung
    vital capacity improved and foramen magnum stenosis did not radiologically
    progress. This is one uncontrolled observation in an exceptional survivor and must
    not be read as evidence of benefit in TD generally, still less as altering the
    perinatal lethality that defines the disorder. The authors themselves call for
    larger studies.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vosoritide
      term:
        id: NCIT:C152918
        label: Vosoritide
  therapeutic_modality: PEPTIDE
  evidence:
  - reference: PMID:41078071
    reference_title: "Thanatophoric Dysplasia Type 1 Treated with Vosoritide: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the response to vosoritide therapy in a 9-year-old girl with genetically confirmed TD1 (c.2420G>T).
    explanation: >-
      Establishes the scope of the evidence base: one patient, off-label. A single
      uncontrolled case cannot establish efficacy.
  - reference: PMID:41078071
    reference_title: "Thanatophoric Dysplasia Type 1 Treated with Vosoritide: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vosoritide was well tolerated and improved growth velocity and lung function in this long-term TD1 survivor, suggesting therapeutic potential even in severe FGFR3 overactivation. Given TD1's rarity, larger studies and further off-label experience are essential to validate these findings.
    explanation: >-
      The authors' own conclusion, including their explicit statement that the finding
      requires validation. Quoted in full so the caveat travels with the claim.
  - reference: PMID:41078071
    reference_title: "Thanatophoric Dysplasia Type 1 Treated with Vosoritide: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thanatophoric dysplasia type 1 (TD1) is the most severe form of FGFR3-related skeletal dysplasia, with high perinatal mortality and no approved pharmacologic therapies.
    explanation: >-
      Confirms that there is no approved pharmacologic therapy for TD, which is the
      context that makes this single case report notable rather than authoritative.
  notes: >-
    Deliberately NOT linked to a pathophysiology node by `target_mechanisms`. The
    CNP-NPR2 counter-regulatory target is curated in the
    `fgfr_gain_of_function_skeletal_dysplasia` module and exercised in
    `Achondroplasia.yaml`; asserting a mechanism edge here on the strength of one
    off-label case would overstate what has been shown in TD.

- name: Genetic counseling
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Counselling after a TD diagnosis covers the de novo origin, the low but non-zero
    recurrence risk from parental gonadal mosaicism, and the availability of prenatal
    and preimplantation testing for the familial variant in a later pregnancy.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301540
    reference_title: Thanatophoric Dysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Once the FGFR3 pathogenic variant has been identified in an affected family member, prenatal and preimplantation genetic testing are possible.
    explanation: >-
      GeneReviews names the reproductive options that genetic counselling for TD
      offers.
  - reference: PMID:42547059
    reference_title: >-
      Thanatophoric dysplasia: prevalence, clinical characteristics, and molecular
      findings in a public hospital from Western Mexico.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular analysis allows to distinguish it from other lethal chondrodysplasias and to provide appropriate genetic counseling.
    explanation: >-
      Links molecular confirmation to the counselling it enables.

clinical_burden:
  burden_level: HIGH
  rationale: >-
    Most affected infants die in the first days of life. The minority who survive
    with intensive support remain ventilator-dependent, with extreme short stature
    and severe psychomotor disability, and need lifelong respiratory and nutritional
    support.
  evidence:
  - reference: PMID:31247124
    reference_title: National survey of prevalence and prognosis of thanatophoric dysplasia in Japan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 51 live newborns, 27 died ≤7 days after birth, with an early neonatal mortality rate of 56%.
    explanation: Early neonatal mortality in a nationwide live-born cohort.
  - reference: PMID:34597445
    reference_title: Development of individuals with thanatophoric dysplasia surviving beyond infancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some individuals enjoy home-based lives; however, they are severely psychosocially and physically disabled and require meticulous respiratory and nutritional support.
    explanation: Burden in those who survive infancy.

discussions:
- discussion_id: td_root_disease_vs_grouping
  kind: INTERPRETATION
  status: RESOLVED
  prompt: >-
    Should thanatophoric dysplasia (MONDO:0017042) be modelled as a root `Disease`
    with `has_subtypes` for TD1 and TD2, or as a `Grouping` over the two existing
    standalone subtype entries?
  rationale: >-
    Resolved in favour of a root `Disease` with `has_subtypes`, on three grounds.
    First, tooling. `build_coverage_index()` in
    `src/dismech/compare/mondo_priority.py` calls `iter_disease_files()`, which globs
    `kb/disorders/*.yaml` only and never reads `kb/groupings/`; coverage is counted
    from `disease_term`, `has_subtypes[].subtype_term`, and `mappings.mondo_mappings`
    restricted to `skos:exactMatch`/`skos:narrowMatch`. A `Grouping` alone would
    therefore leave MONDO:0017042 permanently on the MONDO curation queue no matter
    how well curated it was. This was verified by reading the source, not assumed.
    Second, redundancy. `kb/groupings/FGFR_Related_Skeletal_Dysplasias.yaml` already
    unions TD1 and TD2 with nine other FGFR members under a NECESSARY_AND_SUFFICIENT
    `CONFORMS_TO_MODULE` criterion; a second grouping over just TD1 and TD2 would
    duplicate that machinery while adding only the pair restriction, which
    `has_subtypes` expresses more directly. Third, substance. Several TD claims are
    reported for TD as a whole and have no natural home on either subtype: the birth
    prevalence (PMID:18698630, PMID:42547059, PMID:7773297), the single molecular
    assay covering 99% of both subtypes in one reaction (PMID:39357670), and the
    GeneReviews "features common to type 1 and type 2" list (PMID:20301540). TD1's own
    prevalence block currently has to label the overall-TD figure a population proxy
    for TD1; this entry gives that claim a home without the proxy caveat. The
    counter-argument — that a Disease root duplicates content held in the two subtype
    entries — is addressed by keeping the root deliberately thin: three
    pathophysiology nodes, two of which are `conforms_to` anchors on the FGFR module,
    and no re-derivation of receptor biology or the growth-plate cascade. Precedent
    for the alternative shape exists (`kb/groupings/Diabetes_Mellitus.yaml` maps
    MONDO:0005015 with `skos:closeMatch` so a retained umbrella Disease can keep it as
    `disease_term`), but that pattern exists to let a Grouping coexist with an umbrella
    Disease, not to replace one.
  resolution_note: >-
    Curated as a root `Disease` (this entry). The pre-existing
    `FGFR_Related_Skeletal_Dysplasias` grouping is left unchanged and continues to
    carry TD1 and TD2 as members in their own right. Consequence a reviewer should
    weigh: because this entry conforms to
    `fgfr_gain_of_function_skeletal_dysplasia#Constitutive FGFR Activation`, `just
    check-groupings kb/groupings/FGFR_Related_Skeletal_Dysplasias.yaml` now reports
    "Thanatophoric Dysplasia" as an advisory candidate member of that grouping. It was
    deliberately NOT added: the grouping's rationale describes members that differ in
    receptor paralog and activating variant, and listing the root alongside its own two
    subtypes would make the union overlap itself. Whether an N&S grouping should admit
    a root whose subtypes it already lists is a grouping-design question, not a
    curation defect in this entry.
  posed_by: "dismech curation (issue #8889)"
  posed_date: '2026-08-19T00:00:00Z'
  resolved_date: '2026-08-19T00:00:00Z'
- discussion_id: td_root_thoracic_node_not_module_anchored
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Should the thoracic-insufficiency and pulmonary-hypoplasia step be factored into
    the `fgfr_gain_of_function_skeletal_dysplasia` module, or does it belong only to
    the lethal members of the FGFR3 allelic series?
  attaches_to:
  - pathophysiology#Thoracic Insufficiency and Pulmonary Hypoplasia
  rationale: >-
    The node is left unanchored here on purpose. Achondroplasia and hypochondroplasia
    share every upstream node in the module and do not reach thoracic insufficiency, so
    adding it to the module would assert a consequence that most conformers do not
    manifest. Adding it as a conditional or branch node is possible but would need an
    explicit severity gate, and no such gating convention is established in the module
    today. Flagged rather than acted on, since it is a module-level design change
    outside the scope of curating this entry.
  posed_by: "dismech curation (issue #8889)"
  posed_date: '2026-08-19T00:00:00Z'
- discussion_id: td_vosoritide_single_case
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does CNP-analogue therapy affect the mechanisms that make thanatophoric dysplasia
    lethal, as opposed to affecting linear growth in an exceptional survivor?
  rationale: >-
    The only TD treatment evidence beyond supportive care is a single off-label
    vosoritide case report in a 9-year-old TD1 survivor (PMID:41078071). Perinatal
    lethality in TD is set by thoracic dimensions established in utero, and no
    postnatal growth-directed therapy has been shown to address that. Whether the
    reported vital-capacity improvement reflects any change in the underlying thoracic
    restriction, or simply somatic growth in a patient who had already survived the
    lethal window, is unresolved on a single case.
  proposed_experiments:
  - experiment_id: exp_td_cnp_analogue_survivor_registry
    name: Multi-patient registry of CNP-analogue therapy in long-term TD survivors
    description: >-
      Prospective registry capture of growth velocity, thoracic circumference, forced
      vital capacity and foramen magnum imaging in long-term TD survivors receiving
      off-label CNP-analogue therapy, using each patient's pre-treatment trajectory as
      their own control, since a randomized comparison is not feasible at this rarity.
  posed_by: "dismech curation (issue #8889)"
  posed_date: '2026-08-19T00:00:00Z'

notes: >
  Scope. This entry is deliberately thin. It carries only claims made about
  thanatophoric dysplasia as a whole: TD-level birth prevalence, the shared diagnostic
  pathway, the allelic-series framing, the TD1/TD2 discriminator, and the
  thoracic-insufficiency lethality step, the temporal-lobe brain malformation that
  both subtypes share, and the outcome of long-term survivors. The FGFR3 receptor biology and the
  growth-plate cascade are curated once in
  `kb/modules/fgfr_gain_of_function_skeletal_dysplasia.yaml`, and per-allele,
  per-subtype detail lives in `Thanatophoric_Dysplasia_Type_1.yaml` and
  `Thanatophoric_Dysplasia_Type_2.yaml`. Related FGFR3 points on the same severity
  gradient: `Hypochondroplasia.yaml`, `Achondroplasia.yaml`, `SADDAN.yaml`, and the
  craniosynostosis outliers `Crouzon_Syndrome_with_Acanthosis_Nigricans.yaml` and
  `Muenke_Syndrome.yaml`.

  Sources. Orphanet ORPHA:2655 supplies the definition, the European birth-prevalence
  class and the frequency bands used for several phenotypes here. Where Orphanet and
  GeneReviews disagree on a frequency, the GeneReviews or cohort figure is kept and
  the reason given on the phenotype: Orphanet bands respiratory insufficiency as
  occasional, which reflects whether it is coded at all rather than how many infants
  die of it. ClinGen curated FGFR3 at the lumped TD level (Definitive, 2022), so that
  assertion lives on this root entry rather than on either subtype. Long-term survivor
  phenotypes (developmental delay, seizures, acanthosis nigricans, foramen magnum
  narrowing) are recorded here because the survivor cohorts and case reviews report
  them for TD as a whole, not by subtype; their frequency across all affected
  pregnancies is necessarily low because most infants do not live long enough to
  show them.

references:
- reference: PMID:20301540
  title: Thanatophoric Dysplasia.
  tags:
  - GeneReviews
  findings:
  - statement: Defines TD as a whole and enumerates the features common to type 1 and type 2
  - statement: >-
      Gives the TD1 (bowed femurs, uncommon craniosynostosis) versus TD2 (straight
      femurs, uniform cloverleaf skull) discriminator
  - statement: Autosomal dominant, de novo in the majority of probands
- reference: PMID:8640234
  title: >-
    Graded activation of fibroblast growth factor receptor 3 by mutations causing
    achondroplasia and thanatophoric dysplasia.
  findings:
  - statement: TD alleles activate FGFR3 more strongly than the achondroplasia G380R allele
  - statement: >-
      All the alleles tested constitutively activate the receptor in a
      ligand-independent manner
- reference: PMID:7773297
  title: >-
    Thanatophoric dysplasia (types I and II) caused by distinct mutations in
    fibroblast growth factor receptor 3.
  findings:
  - statement: K650E accounts for TD2 in 16 of 16 individuals
  - statement: TD1 and TD2 arise from mutations in different FGFR3 functional domains
- reference: PMID:39357670
  title: >-
    A Single Multiplex PCR and Single-Nucleotide Extension Assay for the Detection of
    Common Thanatophoric Dysplasia I and II Mutations.
  findings:
  - statement: >-
      One assay detects 14 FGFR3 changes accounting for 99% of TD1 and TD2 combined
- reference: PMID:42547059
  title: >-
    Thanatophoric dysplasia: prevalence, clinical characteristics, and molecular
    findings in a public hospital from Western Mexico.
  findings:
  - statement: TD birth prevalence 0.85 per 10,000 (95% CI 0.32-1.37) in Western Mexico
  - statement: All ten ascertained cases were TD1 and sporadic
- reference: PMID:18698630
  title: >-
    The population-based prevalence of achondroplasia and thanatophoric dysplasia in
    selected regions of the US.
  findings:
  - statement: US TD birth prevalence 0.21-0.30 per 10,000 livebirths
  - statement: TD is one-third to one-half as frequent as achondroplasia
- reference: PMID:39778871
  title: >-
    An immunohistochemical study of thanatophoric dysplasia type 1 after fetus autopsy
    examination.
  findings:
  - statement: >-
      Fetal-autopsy histology of disordered growth-plate ossification and lung
      immaturity in genetically confirmed TD1
- reference: PMID:41078071
  title: "Thanatophoric Dysplasia Type 1 Treated with Vosoritide: A Case Report."
  findings:
  - statement: >-
      Single off-label vosoritide case in a long-term TD1 survivor; not evidence of
      benefit in TD generally
- reference: PMID:31247124
  title: National survey of prevalence and prognosis of thanatophoric dysplasia in Japan.
  findings:
  - statement: Japanese TD birth prevalence 1.1 per 100,000 (95% CI 0.84-1.37)
  - statement: >-
      Early neonatal mortality 56%; every infant surviving the first week had received
      respiratory management
- reference: PMID:34597445
  title: Development of individuals with thanatophoric dysplasia surviving beyond infancy.
  findings:
  - statement: >-
      Twenty survivors aged 1.2-27.8 years were all ventilator-dependent with severe
      growth and psychomotor deficits; acanthosis nigricans was common
- reference: PMID:30572171
  title: Bone dysplasias in 1.6 million births in Argentina.
  findings:
  - statement: TD birth prevalence 0.37 per 10,000 births in Argentina
- reference: PMID:23323754
  title: "Thanatophoric dysplasia: autopsy findings over a 25-year period."
  findings:
  - statement: Temporal lobe dysplasia in every TD autopsy after 1998; lung hypoplasia constant
- reference: PMID:25728633
  title: >-
    Non-invasive prenatal diagnosis of achondroplasia and thanatophoric dysplasia:
    next-generation sequencing allows for a safer, more accurate, and comprehensive
    approach.
  findings:
  - statement: Cell-free DNA sequencing of FGFR3 is accurate for non-invasive prenatal diagnosis

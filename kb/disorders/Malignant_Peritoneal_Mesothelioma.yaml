  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Peritoneal Mesothelioma"); description-level mentions were not accepted. EGA study_type: Cancer Genomics. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
classifications:
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    evidence:
    - reference: PMID:27813512
      reference_title: >-
        Genomic profiling of malignant peritoneal mesothelioma reveals recurrent
        alterations in epigenetic regulatory genes BAP1, SETD2, and DDX3X.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Malignant mesothelioma is a rare cancer that arises from the mesothelial
        cells that line the pleural cavity (>80% of cases) and less commonly
        from the peritoneal lining of the abdominal and pelvic cavities (10-15%),
        the pericardial lining, and the tunica vaginalis.
      explanation: >-
        Malignant mesothelial neoplasm of the peritoneum, classified under
        oncology and hematology.
  ilo_agent_category:
  - classification_value: cancer_asbestos
    evidence:
    - reference: PMID:22104079
      reference_title: "Diffuse malignant peritoneal mesothelioma--an update on treatment."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Asbestos is the main known cause of the disease."
      explanation: >-
        Asbestos-associated mesothelial malignancy corresponds to the ILO
        occupational cancer agent category for asbestos.
  icdo_morphology:
    classification_value: Mesothelial Neoplasm
    notes: >-
      Bound to NCIT:C3786 (Mesothelial Neoplasm). The peritoneal and pleural
      entries take the same morphology family; the site is carried elsewhere
      in the entry, not on this axis.

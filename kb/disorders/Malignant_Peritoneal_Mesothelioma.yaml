name: Malignant Peritoneal Mesothelioma
creation_date: "2026-04-13T05:15:13Z"
category: Complex
description: >-
  Malignant peritoneal mesothelioma (MPeM) is a rare aggressive mesothelial
  cancer of the peritoneal lining characterized by locoregional abdominal
  progression, frequent BAP1 loss, and clinical management centered on
  cytoreductive surgery with hyperthermic intraperitoneal chemotherapy in
  selected resectable patients. Compared with pleural mesothelioma, peritoneal
  disease shows less consistent asbestos attribution, relatively lower
  CDKN2A/CDKN2B/MTAP loss, and rare site-restricted ALK rearrangements.
synonyms:
- diffuse malignant peritoneal mesothelioma
- DMPM
- MPeM
- primary malignant peritoneal mesothelioma
- peritoneal malignant mesothelioma
categories:
- Rare Cancer
- Peritoneal Cancer
- Solid Tumor
parents:
- Malignant Mesothelioma
prevalence:
- population: United States
  measure_type: ANNUAL_INCIDENCE
  notes: >-
    Approximately 2,500 malignant mesotheliomas are newly diagnosed each year
    in the United States, of which 10% to 15% arise from the peritoneal lining
    of the abdominal and pelvic cavities; no separate population-standardized
    peritoneal incidence rate is stated in the cited source.
  evidence:
  - reference: PMID:27813512
    reference_title: >-
      Genomic profiling of malignant peritoneal mesothelioma reveals recurrent
      alterations in epigenetic regulatory genes BAP1, SETD2, and DDX3X.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Malignant mesothelioma is a rare cancer that arises from the mesothelial
      cells that line the pleural cavity (>80% of cases) and less commonly from
      the peritoneal lining of the abdominal and pelvic cavities (10-15%), the
      pericardial lining, and the tunica vaginalis. Approximately 2,500
      malignant mesotheliomas are newly diagnosed in the United States each
      year, which have a uniformly poor prognosis and median survival time of
      less than two years.
    explanation: >-
      Establishes that peritoneal mesothelioma represents 10% to 15% of the
      approximately 2,500 annual incident mesothelioma cases in the United
      States.

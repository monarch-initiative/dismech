- name: Cerebral creatine depletion
  description: >
    Brain proton magnetic resonance spectroscopy shows absent or significantly
    decreased creatine in SLC6A8 deficiency. Blood-brain barrier expression
    patterns and limited peripheral creatine permeability help explain why oral
    creatine has limited efficacy for the transporter defect.

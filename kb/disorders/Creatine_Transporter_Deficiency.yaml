pathophysiology:
- name: SLC6A8 creatine transport defect
  description: >
    Pathogenic SLC6A8 variants impair CRTR-mediated creatine uptake into cells,
    including high-energy-demand tissues such as brain and muscle. This blocks
    the transport limb of the creatine pathway while leaving AGAT/GAMT
    biosynthesis intact.

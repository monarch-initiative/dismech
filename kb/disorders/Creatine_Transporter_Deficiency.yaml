name: Creatine Transporter Deficiency
category: Mendelian
creation_date: '2026-07-05T00:00:00Z'
synonyms:
- SLC6A8-related creatine deficiency syndrome
- SLC6A8-related creatine transporter deficiency
- CRTR deficiency
- X-linked creatine deficiency syndrome
- Cerebral creatine deficiency syndrome type 1
description: >
  Creatine transporter deficiency is an X-linked cerebral creatine deficiency
  syndrome caused by pathogenic variants in SLC6A8, which encodes the
  sodium-dependent creatine transporter CRTR. Unlike AGAT and GAMT deficiency,
  the primary defect is not creatine biosynthesis but impaired cellular and CNS
  creatine uptake. Affected males usually present with developmental delay,
  intellectual disability, prominent speech-language disorder, behavioral
  abnormalities, hypotonia, and variable epilepsy or movement disorder. The
  characteristic diagnostic pattern includes absent or markedly decreased brain
  creatine on proton magnetic resonance spectroscopy and, especially in males,
  an elevated urinary creatine-to-creatinine ratio.

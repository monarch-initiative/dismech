treatments:
- name: Creatine precursor supplementation
  description: >
    Creatine transporter deficiency is treated with creatine monohydrate plus
    arginine and glycine supplementation in some protocols, but clinical
    improvement has not been proven; this differs from the clearer treatment
    responsiveness of AGAT and GAMT biosynthesis defects.
  treatment_term:
    preferred_term: nutritional supplementation
    term:
      id: MAXO:0000106
      label: nutritional supplementation
  target_mechanisms:
  - target: Cerebral creatine depletion
    treatment_effect: MODULATES
    description: Supplementation attempts to improve creatine availability, but transporter impairment limits CNS benefit.
  evidence:
  - reference: PMID:36856349
    reference_title: "Creatine Deficiency Disorders: Phenotypes, Genotypes, Diagnosis, and Treatment Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "creatine transporter deficiency is treated with arginine and glycine"
    explanation: Review evidence documents the treatment approach and explicitly notes lack of proven improvement.
notes: >-
  WP-013 audit result: AGAT deficiency and GAMT deficiency already had local
  disease entries. This entry adds the missing SLC6A8 creatine transporter
  deficiency anchor and distinguishes it mechanistically from AGAT/GAMT
  biosynthesis defects. The GATM aggregation syndrome seed is represented as
  the FRTS1 subtype of Fanconi renotubular syndrome rather than folded into
  AGAT deficiency.

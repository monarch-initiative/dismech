  notes: >-
    Ultra-rare. The syndrome-defining report described seven individuals from seven families;
    subsequent case series have added further individuals (~a dozen published). No
    population-based prevalence estimate is available.
  evidence:
  - reference: PMID:31155615
    reference_title: "Variants in MED12L, encoding a subunit of the mediator kinase module, are responsible for intellectual disability associated with transcriptional defect."

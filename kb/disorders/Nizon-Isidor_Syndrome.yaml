prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Ultra-rare. The syndrome-defining report described seven individuals from seven families;
    subsequent case series have added further individuals (~a dozen published). No
    population-based prevalence estimate is available.
  evidence:
  - reference: PMID:31155615
    reference_title: "Variants in MED12L, encoding a subunit of the mediator kinase module, are responsible for intellectual disability associated with transcriptional defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report here the involvement of MED12L in human disease as has been seen for other subunits of the kinase module of the mediator complex, through transcriptional defect."
    explanation: Establishes MED12L as an ultra-rare Mediator kinase-module disease gene.
pathophysiology:
- name: MED12L kinase-module haploinsufficiency
  description: >
    MED12L is the autosomal paralog of the MED12 scaffold in the CDK8 kinase module (CKM) of the
    Mediator complex. Heterozygous, predominantly de novo variants act through haploinsufficiency
    to disrupt CKM-dependent transcription; patient fibroblasts show a transcriptional defect
    (impaired recovery of RNA synthesis after UV irradiation), similar to that seen in MED12 and
    milder than in MED13L cells. MED12L belongs to the group of CDK8-kinase module-associated
    disease genes.
  genes:
  - preferred_term: MED12L
    term:
      id: hgnc:16050
      label: MED12L
  biological_processes:
  - preferred_term: transcription by RNA polymerase II
    term:
      id: GO:0006366
      label: transcription by RNA polymerase II
  - preferred_term: regulation of gene expression
    term:
      id: GO:0010468
      label: regulation of gene expression
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:31155615
    reference_title: "Variants in MED12L, encoding a subunit of the mediator kinase module, are responsible for intellectual disability associated with transcriptional defect."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MED12L fibroblasts for individual 1 and 2 show a defect in transcriptional activity as measured by recovery of RNA synthesis after UV irradiation."
    explanation: Establishes a demonstrable transcriptional defect in patient fibroblasts as the disease mechanism.
  downstream:
  - target: Neurodevelopmental transcriptional dysregulation
    description: >-
      CKM haploinsufficiency disrupts Mediator-dependent transcription of neurodevelopmental
      gene-expression programs.
- name: Neurodevelopmental transcriptional dysregulation
  description: >
    Downstream of MED12L kinase-module haploinsufficiency, neurodevelopmental gene-expression
    programs are dysregulated, producing intellectual disability and/or developmental delay with
    speech impairment, autism spectrum disorder, aggressive behavior, corpus callosum
    abnormality, and mild facial morphological features.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: regulation of neuron differentiation
    term:
      id: GO:0045664
      label: regulation of neuron differentiation
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:31155615
    reference_title: "Variants in MED12L, encoding a subunit of the mediator kinase module, are responsible for intellectual disability associated with transcriptional defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other features included autism spectrum disorder, aggressive behavior, corpus callosum abnormality, and mild facial morphological features."
    explanation: Documents the neurobehavioral and structural features downstream of MED12L dysfunction.
  downstream:
  - target: Intellectual disability
    description: Disrupted neuronal developmental programs contribute to intellectual disability.
  - target: Delayed speech and language development
    description: Language acquisition is impaired downstream of neurodevelopmental transcriptional dysregulation.
  - target: Autism spectrum disorder
    description: Neurodevelopmental transcriptional dysregulation contributes to autism spectrum disorder.
  - target: Corpus callosum abnormality
    description: Disturbed midline/commissural morphogenesis contributes to corpus callosum abnormality.

name: Nizon-Isidor Syndrome
creation_date: '2026-07-31T00:00:00Z'
category: Mendelian
synonyms:
- NIZIDS
- MED12L-related intellectual disability
- MED12L-related neurodevelopmental disorder
description: >
  Nizon-Isidor syndrome (NIZIDS) is a rare autosomal dominant neurodevelopmental disorder
  caused by heterozygous, predominantly de novo variants in MED12L, the autosomal paralog of the
  MED12 scaffold subunit of the CDK8 kinase module of the Mediator transcriptional coactivator
  complex. Variants (deletions, duplications, and single-nucleotide variants) act through
  haploinsufficiency and produce a demonstrable transcriptional defect in patient fibroblasts.
  All affected individuals present with intellectual disability and/or developmental delay
  including speech impairment; other features include autism spectrum disorder, aggressive
  behavior, corpus callosum abnormality, and mild facial morphological features. MED12L belongs
  to the group of CDK8-kinase module-associated disease genes, alongside MED12, MED13, MED13L,
  CDK8, and CDK19.

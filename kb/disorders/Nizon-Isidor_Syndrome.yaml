    explanation: Background statement in the Introduction documenting nuclear localization of MED12L.
  downstream:
  - target: Neurodevelopmental transcriptional dysregulation
    causal_link_type: DIRECT
    description: >-
      CKM haploinsufficiency disrupts Mediator-dependent transcription of neurodevelopmental
      gene-expression programs.
- name: Neurodevelopmental transcriptional dysregulation
  description: >
    Downstream of MED12L kinase-module haploinsufficiency, neurodevelopmental gene-expression
    programs are dysregulated, producing intellectual disability and/or developmental delay with
    speech impairment, autism spectrum disorder, aggressive behavior, corpus callosum
    abnormality, and mild facial morphological features.

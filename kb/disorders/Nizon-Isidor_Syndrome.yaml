    snippet: "MED12L fibroblasts for individual 1 and 2 show a defect in transcriptional activity as measured by recovery of RNA synthesis after UV irradiation."
    explanation: Establishes a demonstrable transcriptional defect in patient fibroblasts as the disease mechanism.
  - reference: PMID:31155615
    reference_title: "Variants in MED12L, encoding a subunit of the mediator kinase module, are responsible for intellectual disability associated with transcriptional defect."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "MED12L contains 43 exons and encodes a protein component of Mediator, which is involved in transcriptional coactivation of nearly all RNA polymerase II-dependent genes"
    explanation: Background statement in the Introduction establishing MED12L as a Mediator complex subunit involved in transcriptional coactivation of RNA polymerase II-dependent genes.
  - reference: PMID:31155615
    reference_title: "Variants in MED12L, encoding a subunit of the mediator kinase module, are responsible for intellectual disability associated with transcriptional defect."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND

    snippet: "we report here the involvement of MED12L in human disease as has been seen for other subunits of the kinase module of the mediator complex, through transcriptional defect."
    explanation: Establishes MED12L as an ultra-rare Mediator kinase-module disease gene.
pathophysiology:
- name: MED12L kinase-module haploinsufficiency
  description: >
    MED12L is the autosomal paralog of the MED12 scaffold in the CDK8 kinase module (CKM) of the
    Mediator complex. Heterozygous, predominantly de novo variants act through haploinsufficiency
    to disrupt CKM-dependent transcription; patient fibroblasts show a transcriptional defect
    (impaired recovery of RNA synthesis after UV irradiation), similar to that seen in MED12 and
    milder than in MED13L cells. MED12L belongs to the group of CDK8-kinase module-associated
    disease genes.

  target_mechanisms:
  - target: Permissive Lower Esophageal Sphincter Relaxation
    treatment_effect: INHIBITS
    description: GABA-B receptor agonism increases basal lower esophageal sphincter pressure and reduces transient LES relaxations, opposing retrograde flow.

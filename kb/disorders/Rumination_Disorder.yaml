diagnosis:
- name: Rome IV and DSM-5 Clinical Diagnostic Criteria
  description: >-
    Diagnosis is primarily clinical, based on Rome IV criteria (for rumination
    syndrome) or DSM-5 criteria (for rumination disorder), requiring repeated,
    effortless postprandial regurgitation of recently ingested food without
    preceding retching or nausea, followed by re-chewing, re-swallowing, or
    spitting out.
  diagnosis_term:
    preferred_term: Clinical Diagnosis
    term:
      id: NCIT:C15607
      label: Clinical Diagnosis
  evidence:
  - reference: PMID:38741462
    reference_title: Current state of rumination syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      RS is mainly diagnosed clinically by the Rome Criteria with symptoms of
      regurgitation without retching of recently ingested food into the mouth
      and subsequent spitting or re-mastication.
    explanation: >-
      Establishes Rome clinical symptom criteria as the primary diagnostic
      modality.
  - reference: PMID:38563201
    reference_title: "The prevalence of rumination syndrome and rumination disorder: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Rumination syndrome is a disorder of gut-brain interaction diagnosed by
      Rome criteria, whereas rumination disorder is a feeding and eating
      disorder diagnosed by DSM-5 criteria.
    explanation: >-
      Documents the complementary Rome and DSM-5 clinical diagnostic frameworks.
- name: Postprandial Esophageal High-Resolution Impedance Manometry
  description: >-
    When clinical diagnosis is uncertain, postprandial esophageal
    high-resolution impedance manometry (HRIM) objectively confirms rumination
    by demonstrating retrograde proximal esophageal flow closely associated
    with abdominal pressure peaks exceeding 30 mm Hg.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:24366235
    reference_title: Objective manometric criteria for the rumination syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of the rumination syndrome can be made when reflux events
      extending to the proximal esophagus that are closely associated with an
      abdominal pressure increase >30 mm Hg and an esophageal pressure increase
      are observed during combined pressure-impedance monitoring.
    explanation: >-
      Defines objective combined manometry-impedance diagnostic criteria (>30
      mm Hg abdominal pressure peak with proximal retrograde flow).
  - reference: PMID:38385686
    reference_title: The role of high-resolution impedance manometry to identify rumination syndrome in children with unexplained foregut symptoms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of characteristic patterns of rumination on HRIM in
      children with unexplained foregut symptoms enables the immediate
      diagnosis of RS.
    explanation: >-
      Demonstrates diagnostic utility of HRIM in pediatric patients with
      unexplained foregut symptoms.
treatments:
- name: Diaphragmatic Breathing (Behavioral Therapy)
  description: >-
    First-line treatment. Diaphragmatic breathing is taught as a habit-reversal
    technique that substitutes a competing voluntary motor pattern for the
    acquired abdominothoracic contraction, lowering intragastric pressure and
    raising lower esophageal pressure. Delivered with patient education and
    reassurance.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: diaphragmatic breathing / habit-reversal behavioral therapy
    term:
      id: NCIT:C15184
      label: Behavioral Intervention
  target_mechanisms:
  - target: Habitual Abdominal Wall Contraction
    treatment_effect: INHIBITS
    description: Habit-reversal diaphragmatic breathing substitutes a competing respiratory motor pattern that suppresses postprandial abdominal-wall contraction.
    evidence:
    - reference: PMID:21303399
      reference_title: "Review article: the pathophysiology, differential diagnosis and management of rumination syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The mainstay of treatment for rumination syndrome is explanation and
        behavioural treatment which consists of habit reversal techniques that
        compete with the urge to regurgitate.
      explanation: Supports habit-reversal behavioral suppression of the motor urge driving rumination.
  - target: Elevated Intragastric Pressure
    treatment_effect: INHIBITS
    description: Diaphragmatic breathing lowers postprandial intragastric pressure and augments crural/lower esophageal sphincter pressure.
    evidence:
    - reference: PMID:38741462
      reference_title: Current state of rumination syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Once RS is diagnosed, the mainstay of treatment is diaphragmatic
        breathing to lower the intragastric pressure and increase the lower
        esophageal pressure.
      explanation: Directly states that diaphragmatic breathing lowers intragastric pressure and raises lower esophageal pressure.
  evidence:
  - reference: PMID:27766723

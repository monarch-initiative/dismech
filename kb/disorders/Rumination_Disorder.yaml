name: Rumination Disorder
creation_date: "2026-07-29T00:00:00Z"
category: Psychiatric
description: >-
  Rumination disorder (rumination syndrome) is a feeding and eating disorder /
  disorder of gut-brain interaction characterized by repeated, effortless
  regurgitation of recently ingested, recognizable food into the mouth, which
  is then re-chewed, re-swallowed, or spat out. The regurgitation is not
  preceded by retching or nausea and is not explained by a gastrointestinal or
  other medical condition. This effortless, non-nauseated, immediately
  postprandial character is the central feature distinguishing rumination from
  vomiting and from gastroesophageal reflux. Mechanistically it is best
  understood as a learned, largely subconscious motor habit: an unintentional
  contraction of the abdominal wall musculature raises intragastric pressure
  and, transmitted across a permissive (relaxed) lower esophageal sphincter,
  reverses the esophagogastric pressure gradient and drives retrograde flow of
  gastric contents into the mouth. It is not a Mendelian or otherwise
  genetically defined disease; behavioral therapy (diaphragmatic breathing) is
  the mainstay of treatment.
disease_term:
  preferred_term: rumination disorder
  term:
    id: MONDO:0001301
    label: rumination disorder
parents:
- Eating Disorder
- Mental Health Disorder
pathophysiology:
- name: Psychiatric Comorbidity and Antecedent Stressor
  description: >-
    Rumination is strongly associated with psychiatric and eating-disorder
    comorbidity and is frequently triggered in previously asymptomatic
    adolescents/adults by an antecedent illness, surgery, or psychological
    stressor. A prior history of an eating disorder (including self-induced
    vomiting in bulimia nervosa) or another psychiatric disorder is modeled as
    an upstream liability that predisposes to acquiring the rumination motor
    habit. This is a behaviorally/psychosocially mediated predisposition, not a
    genetic etiology.
  biological_scale: ORGANISM
  downstream:
  - target: Habitual Abdominal Wall Contraction
    description: >-
      Psychiatric/eating-disorder liability and antecedent stressors are
      modeled upstream of the acquired abdominal-straining motor habit.
  evidence:
  - reference: PMID:33988353
    reference_title: Eating and Psychiatric Disorders Are Independent Risk Factors for Rumination Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On multivariable analysis, ED (adjusted odds ratio=16.4, P=0.0033) and PD
      (adjusted odds ratio=4.47, P=0.029) remained independent predictors for
      RS.
    explanation: >-
      Case-control evidence supports a history of eating disorders and
      psychiatric disorders as independent risk factors for rumination
      syndrome, consistent with an upstream psychosocial liability.
- name: Habitual Abdominal Wall Contraction
  description: >-
    The proximate motor event: a voluntary but usually unintentional
    (subconscious) contraction of the abdominal wall musculature after a meal,
    part of a coordinated abdominothoracic maneuver (thoracic suction plus
    crural diaphragm relaxation). Repeated postprandially, it becomes an
    ingrained habit that competes for behavioral extinction.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Abdominal wall skeletal muscle contraction
    term:
      id: GO:0003009
      label: skeletal muscle contraction
    modifier: INCREASED
  downstream:
  - target: Elevated Intragastric Pressure
    description: >-
      Abdominal-wall contraction raises intragastric pressure.
  evidence:
  - reference: PMID:21303399
    reference_title: "Review article: the pathophysiology, differential diagnosis and management of rumination syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a rise in intra-gastric pressure, generated by a voluntary, but often
      unintentional, contraction of the abdominal wall musculature
    explanation: >-
      Review evidence supports voluntary/unintentional abdominal-wall
      contraction as the proximate driver of the intragastric pressure rise.
  - reference: PMID:27766723
    reference_title: "Rumination syndrome: pathophysiology, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is achieved by a coordinated abdominothoracic maneuver consisting of
      a thoracic suction, crural diaphragm relaxation and an increase in
      intragastric pressure.
    explanation: >-
      Review evidence supports the coordinated abdominothoracic maneuver (with
      crural diaphragm relaxation) that generates the intragastric pressure rise.
- name: Elevated Intragastric Pressure
  description: >-
    The abdominothoracic maneuver produces a postprandial spike in
    intragastric/intra-abdominal pressure. On combined high-resolution
    manometry with impedance, rumination episodes are characteristically
    associated with abdominal pressure peaks exceeding 30 mm Hg, a threshold
    that objectively separates rumination from gastroesophageal reflux disease.
  biological_scale: ORGANISM
  downstream:
  - target: Reversal of the Esophagogastric Pressure Gradient
    description: >-
      The intragastric pressure rise, exceeding lower esophageal sphincter
      pressure, reverses the esophagogastric pressure gradient.
  evidence:
  - reference: PMID:24366235
    reference_title: Objective manometric criteria for the rumination syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the GERD patients exhibited abdominal pressure peaks >30 mm Hg,
      whereas in the rumination patients 70% of the pressure peaks had an
      amplitude >30 mm Hg.
    explanation: >-
      Manometric evidence supports a high-amplitude (>30 mm Hg) abdominal
      pressure rise as the objective correlate of rumination, distinguishing it
      from GERD.
- name: Permissive Lower Esophageal Sphincter Relaxation
  description: >-
    Concurrent low lower esophageal sphincter (LES) pressure / relaxation
    provides a permissive low-resistance conduit so that the elevated
    intragastric pressure can be transmitted retrograde into the esophagus,
    effectively creating a transient common cavity between stomach and
    esophagus.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Lower esophageal sphincter smooth muscle relaxation
    term:
      id: GO:0044557
      label: relaxation of smooth muscle
    modifier: INCREASED
  downstream:
  - target: Reversal of the Esophagogastric Pressure Gradient
    description: >-
      A relaxed/low-pressure LES permits the raised intragastric pressure to
      overcome the sphincter and reverse the pressure gradient.
  evidence:
  - reference: PMID:21303399
    reference_title: "Review article: the pathophysiology, differential diagnosis and management of rumination syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      at a time of low pressure in the lower oesophageal sphincter, causing
      retrograde movement of gastric contents into the oesophagus
    explanation: >-
      Review evidence supports low lower esophageal sphincter pressure as the
      permissive condition allowing retrograde movement of gastric contents.
- name: Reversal of the Esophagogastric Pressure Gradient
  description: >-
    The combination of raised intragastric pressure and a permissive LES
    reverses the normal esophagogastric pressure gradient, the central
    hemodynamic event of rumination. In primary rumination the abdominal
    pressure increase precedes the retrograde flow.
  biological_scale: TISSUE
  downstream:
  - target: Retrograde Regurgitation and Re-chewing
    description: >-
      Gradient reversal drives retrograde flow of gastric contents up the
      esophagus into the mouth.
  evidence:
  - reference: PMID:27766723
    reference_title: "Rumination syndrome: pathophysiology, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rumination is thought to occur due to a reversal of the esophagogastric
      pressure gradient.
    explanation: >-
      Review evidence supports reversal of the esophagogastric pressure
      gradient as the central mechanism of rumination.
  - reference: PMID:24366235
    reference_title: Objective manometric criteria for the rumination syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      primary rumination, in which the abdominal pressure increase preceded the
      retrograde flow
    explanation: >-
      Manometric evidence supports the temporal ordering (abdominal pressure
      rise preceding retrograde flow) in primary rumination.
- name: Retrograde Regurgitation and Re-chewing
  description: >-
    The observable behavior: effortless retrograde flow of recently ingested,
    recognizable food into the mouth within minutes of eating, without
    preceding retching or nausea, followed by re-chewing, re-swallowing, or
    spitting out. Objective demonstration is possible with esophageal
    high-resolution impedance manometry.
  biological_scale: ORGANISM
  downstream:
  - target: Effortless Regurgitation of Food
    description: >-
      The retrograde regurgitation event maps to the cardinal clinical
      phenotype.
  - target: Nutritional and Dental Sequelae
    description: >-
      Chronic regurgitation and re-exposure of the mouth to gastric contents
      produce nutritional and dental complications.
  evidence:
  - reference: PMID:27766723
    reference_title: "Rumination syndrome: pathophysiology, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      effortless and repetitive regurgitation of recently ingested food from
      the stomach to the oral cavity followed by either re-swallowing or
      spitting
    explanation: >-
      Review evidence supports the cardinal effortless
      regurgitation-and-re-handling behavior.
  - reference: PMID:38385686
    reference_title: The role of high-resolution impedance manometry to identify rumination syndrome in children with unexplained foregut symptoms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Oesophageal high-resolution impedance manometry (HRIM) can objectively
      demonstrate the episodes of rumination, but its role in the diagnostic
      pathway is not yet established.
    explanation: >-
      Pediatric HRIM evidence supports objective demonstration of rumination
      episodes.
- name: Nutritional and Dental Sequelae
  description: >-
    Consequences of chronic rumination. Frequent regurgitation can cause weight
    loss and malnutrition (occasionally severe enough to require enteral/
    jejunostomy feeding), and repeated exposure of the dentition to regurgitated
    gastric contents causes dental erosion. Psychosocial impairment (social
    withdrawal, school/work absenteeism) commonly accompanies these.
  biological_scale: ORGANISM
  downstream:
  - target: Dental Erosion
    description: >-
      Repeated exposure of teeth to regurgitated gastric contents causes dental
      erosion.
  evidence:
  - reference: PMID:27579694
    reference_title: Rumination Syndrome and Dental Erosions in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of patients with rumination syndrome, 23 (77%) had DE, compared with 4
      (13%) control subjects.
    explanation: >-
      Controlled pediatric evidence supports markedly elevated dental erosion
      frequency in rumination syndrome versus matched controls.
phenotypes:
- name: Effortless Regurgitation of Food
  description: >-
    The cardinal manifestation: effortless, repetitive regurgitation of
    recently ingested, recognizable food into the mouth shortly after a meal,
    not preceded by retching or nausea, followed by re-chewing, re-swallowing,
    or spitting out. HPO has no dedicated gastric-regurgitation term, so the
    closest broader behavioral term is used and the specificity is carried in
    the preferred term.
  phenotype_term:
    preferred_term: Effortless postprandial regurgitation of recently ingested food
    term:
      id: HP:0100738
      label: Abnormal eating behavior
  evidence:
  - reference: PMID:27579694
    reference_title: Rumination Syndrome and Dental Erosions in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rumination syndrome is the effortless regurgitation of recently ingested
      food with subsequent reswallowing or spitting out.
    explanation: >-
      Provides the definitional statement of the cardinal effortless
      regurgitation phenotype.
- name: Dental Erosion
  description: >-
    Loss of tooth structure by chemical (non-bacterial) dissolution from
    repeated exposure of the dentition to regurgitated gastric contents; a
    common physical sign in rumination syndrome.
  phenotype_term:
    preferred_term: Dental erosion
    term:
      id: HP:0000682
      label: Abnormal dental enamel morphology
  evidence:
  - reference: PMID:27579694
    reference_title: Rumination Syndrome and Dental Erosions in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of patients with rumination syndrome, 23 (77%) had DE, compared with 4
      (13%) control subjects.
    explanation: >-
      Controlled pediatric study supports dental erosion as a frequent finding
      in rumination syndrome.
- name: Anxiety
  description: >-
    Anxiety is an independently associated psychiatric comorbidity of
    rumination in adults.
  phenotype_term:
    preferred_term: Anxiety
    term:
      id: HP:0000739
      label: Anxiety
  evidence:
  - reference: PMID:38563201
    reference_title: "The prevalence of rumination syndrome and rumination disorder: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In adults, rumination is associated with female gender, anxiety, and
      depression.
    explanation: >-
      Meta-analytic evidence supports anxiety as an independent adult
      association of rumination.
- name: Depression
  description: >-
    Depression is an independently associated psychiatric comorbidity of
    rumination in adults.
  phenotype_term:
    preferred_term: Depression
    term:
      id: HP:0000716
      label: Depression
  evidence:
  - reference: PMID:38563201
    reference_title: "The prevalence of rumination syndrome and rumination disorder: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In adults, rumination is associated with female gender, anxiety, and
      depression.
    explanation: >-
      Meta-analytic evidence supports depression as an independent adult
      association of rumination.
genetic:
- name: No single causal gene (behaviorally mediated)
  association: Risk Factor
  notes: >-
    Rumination disorder is not a monogenic or otherwise genetically defined
    disease; it has no OMIM phenotype entry and no established causal or
    susceptibility gene. Risk is mediated behaviorally/psychosocially through
    psychiatric and eating-disorder comorbidity and antecedent stressors.
    NOTE (Named Entity Confusion guardrail): a separate behavioral-genetics
    literature on the heritability of "rumination" as a cognitive/depressive
    thinking construct (KCTD12, KCNJ6, CREB1, BDNF) pertains to a DIFFERENT
    entity that merely shares the English word "rumination" and must NOT be
    cited as genetic evidence for this food-regurgitation disorder.
  evidence:
  - reference: PMID:38741462
    reference_title: Current state of rumination syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rumination syndrome (RS) is an underdiagnosed behavioral disorder of
      recurrent regurgitation.
    explanation: >-
      Review evidence characterizes rumination as a behavioral disorder,
      consistent with the absence of a defined genetic etiology.

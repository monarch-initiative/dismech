- name: Biofeedback-Assisted Training
  description: >-
    Instrumented (EMG/manometry) feedback helps patients learn to suppress the
    postprandial rise in abdominal/intragastric pressure; a supportive adjunct
    to diaphragmatic breathing with randomized-trial support.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: biofeedback
    term:
      id: NCIT:C15186
      label: Biofeedback
  target_mechanisms:
  - target: Habitual Abdominal Wall Contraction
    treatment_effect: INHIBITS
    description: EMG-guided biofeedback trains patients to suppress postprandial anterior abdominal wall and intercostal muscle contraction.
    evidence:
    - reference: PMID:27185077
      reference_title: Randomized, Placebo-Controlled Trial of Biofeedback for the Treatment of Rumination.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients on biofeedback (n=12) but not on placebo (n=11) effectively

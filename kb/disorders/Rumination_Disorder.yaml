treatments:
- name: Diaphragmatic Breathing (Behavioral Therapy)
  description: >-
    First-line treatment. Diaphragmatic breathing is taught as a habit-reversal
    technique that substitutes a competing voluntary motor pattern for the
    acquired abdominothoracic contraction, lowering intragastric pressure and
    raising lower esophageal pressure. Delivered with patient education and
    reassurance.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: diaphragmatic breathing / habit-reversal behavioral therapy
    term:
      id: MAXO:0000010
      label: cognitive and behavioral intervention
  evidence:
  - reference: PMID:27766723
    reference_title: "Rumination syndrome: pathophysiology, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mainstay of the treatment of rumination syndrome is behavioral
      therapy via diaphragmatic breathing in addition to patient education and
      reassurance.
    explanation: >-
      Review evidence supports diaphragmatic breathing behavioral therapy as
      the mainstay treatment.
  - reference: PMID:38741462
    reference_title: Current state of rumination syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the mainstay of treatment is diaphragmatic breathing to lower the
      intragastric pressure and increase the lower esophageal pressure
    explanation: >-
      Review evidence supports the mechanism of diaphragmatic breathing
      (lowering intragastric and raising lower esophageal pressure).
- name: Biofeedback-Assisted Training
  description: >-
    Instrumented (EMG/manometry) feedback helps patients learn to suppress the
    postprandial rise in abdominal/intragastric pressure; a supportive adjunct
    to diaphragmatic breathing with randomized-trial support.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: biofeedback
    term:
      id: NCIT:C15186
      label: Biofeedback
  evidence:
  - reference: PMID:31116102
    reference_title: "Rumination syndrome: when to suspect and how to treat."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      biofeedback therapy led to a 74% + /- 6% reduction in rumination activity
    explanation: >-
      A randomized trial reported a large reduction in rumination activity with
      biofeedback therapy.
  - reference: PMID:27185077
    reference_title: Randomized, Placebo-Controlled Trial of Biofeedback for the Treatment of Rumination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biofeedback treatment resulted in a 74±6% reduction in rumination activity
    explanation: >-
      The primary placebo-controlled randomized trial (EMG-guided
      abdomino-thoracic biofeedback) reports the 74% reduction in rumination
      activity, providing the primary-source evidence for biofeedback efficacy.
- name: Baclofen
  description: >-
    A GABA-B agonist reserved for behavior-therapy-refractory cases; it reduces
    transient lower esophageal sphincter relaxations. A randomized trial (10 mg
    three times daily) reported symptomatic improvement in a majority of
    treated patients; sedation is the main limitation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: baclofen
      term:
        id: NCIT:C28858
        label: Baclofen
  evidence:
  - reference: PMID:31116102
    reference_title: "Rumination syndrome: when to suspect and how to treat."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A recent randomized trial of baclofen at a dose of 10 mg three times
      daily led to symptomatic improvement in 63% of patients with rumination
      syndrome.
    explanation: >-
      Randomized-trial evidence supports baclofen for symptomatic improvement in
      rumination syndrome.
  - reference: PMID:29206813
    reference_title: A Randomized Double-Blind, Placebo-Controlled, Cross-Over Study Using Baclofen in the Treatment of Rumination Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Baclofen is an effective treatment option for patients with rumination
      syndrome, probably through its effect on LES pressure.
    explanation: >-
      The primary randomized double-blind placebo-controlled cross-over trial
      supports baclofen efficacy, mechanistically via raised lower esophageal
      sphincter pressure and fewer transient LES relaxations.
differential_diagnoses:
- name: Bulimia Nervosa
  description: >-
    Bulimia nervosa involves self-induced vomiting as an intentional
    compensatory behavior driven by weight-control/body-image concerns and is
    often preceded by binge eating; rumination regurgitation is effortless,
    involuntary, non-compensatory, and not preceded by retching. The two can
    co-occur, and rumination is frequently misdiagnosed as bulimia nervosa.
  distinguishing_features:
  - >-
    Rumination regurgitation is effortless, involuntary, and non-compensatory
    with no retching; bulimic vomiting is intentional, self-induced,
    compensatory, and tied to weight/body-image concerns.
  disease_term:
    preferred_term: bulimia nervosa
    term:
      id: MONDO:0005452
      label: bulimia nervosa
  evidence:
  - reference: PMID:38741462
    reference_title: Current state of rumination syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RS may be misdiagnosed as a variety of other syndromes including
      gastroesophageal reflux disease, gastroparesis, achalasia, and bulimia
      nervosa.
    explanation: >-
      Review evidence lists bulimia nervosa among the conditions rumination
      syndrome is misdiagnosed as, supporting it as a key differential.
- name: Gastroesophageal Reflux Disease
  description: >-
    GERD produces acid reflux with heartburn and a sour/acidic regurgitant;
    rumination regurgitation is of recognizable, initially non-acidic food
    within minutes of eating. Objective manometry separates them: abdominal
    pressure peaks >30 mm Hg accompany rumination but not GERD.
  distinguishing_features:
  - >-
    GERD lacks the high-amplitude (>30 mm Hg) abdominal pressure rise that
    accompanies rumination episodes on high-resolution impedance manometry.
  disease_term:
    preferred_term: gastroesophageal reflux disease
    term:
      id: MONDO:0007186
      label: gastroesophageal reflux disease
  evidence:
  - reference: PMID:24366235
    reference_title: Objective manometric criteria for the rumination syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the GERD patients exhibited abdominal pressure peaks >30 mm Hg,
      whereas in the rumination patients 70% of the pressure peaks had an
      amplitude >30 mm Hg.
    explanation: >-
      Manometric evidence distinguishes rumination from GERD by the presence of
      a high-amplitude abdominal pressure rise.
- name: Gastroparesis
  description: >-
    Gastroparesis causes delayed gastric emptying with nausea and vomiting of
    retained, partially digested food occurring later after meals; rumination
    is immediate, effortless, and free of preceding nausea/retching.
  distinguishing_features:
  - >-
    Gastroparesis vomiting is preceded by nausea and occurs later postprandially
    with partially digested content; rumination is immediate, effortless, and
    non-nauseated.
  disease_term:
    preferred_term: gastroparesis
    term:
      id: MONDO:0006769
      label: gastroparesis
  evidence:
  - reference: PMID:38741462
    reference_title: Current state of rumination syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RS may be misdiagnosed as a variety of other syndromes including
      gastroesophageal reflux disease, gastroparesis, achalasia, and bulimia
      nervosa.
    explanation: >-
      Review evidence lists gastroparesis among the conditions rumination
      syndrome is misdiagnosed as, supporting it as a differential.

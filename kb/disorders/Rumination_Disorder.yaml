      baclofen in rumination syndrome.
  - reference: PMID:29206813
    reference_title: A Randomized Double-Blind, Placebo-Controlled, Cross-Over Study Using Baclofen in the Treatment of Rumination Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Baclofen is an effective treatment option for patients with rumination

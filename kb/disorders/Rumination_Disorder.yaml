- name: Baclofen
  description: >-
    A GABA-B agonist reserved for behavior-therapy-refractory cases; it reduces
    transient lower esophageal sphincter relaxations. A randomized trial (10 mg
    three times daily) reported symptomatic improvement in a majority of
    treated patients; sedation is the main limitation.

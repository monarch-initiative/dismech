    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33771466
    reference_title: "Novel bi-allelic variants in DNAH2 cause severe asthenoteratozoospermia with multiple morphological abnormalities of the flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "transmission electron microscopy revealed the obvious absence of a central pair of microtubules and inner dynein arms in the spermatozoa with mutated DNAH2"
    explanation: Ultrastructural loss of inner dynein arms and central pair in patient sperm.
  - reference: PMID:30811583
    reference_title: "DNAH2 is a novel candidate gene associated with multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The spermatozoa with DNAH2 mutations showed severely disarranged axonemal structures with mitochondrial sheath defection."
    explanation: Disorganized axoneme and mitochondrial sheath in patient sperm.
  - reference: PMID:40592014
    reference_title: "Patients with mutations in DNAH2, DNAH6 and DNAH10 causing multiple morphological abnormalities of human sperm flagella achieve good ICSI outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transmission electron microscopy (TEM) revealed substantial loss of inner dynein arms and mitochondrial damage"
    explanation: A further cohort, pooled with DNAH6 and DNAH10 patients, shows the same inner-arm loss.
- name: Disordered Flagellar Development During Spermiogenesis
  description: >-
    In Dnah2 knockout testis, elongating spermatids carry a variable number
    of centrioles, the annulus fails to migrate to its normal position, and
    mature sperm keep centriolar proteins at the connecting piece. Heads are
    mildly misshapen. These findings come from mice only.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Spermatid
    term:
      id: CL:0000018
      label: spermatid
  cellular_components:
  - preferred_term: Sperm annulus
    term:
      id: GO:0097227
      label: sperm annulus
  biological_processes:
  - preferred_term: Spermatid development
    term:
      id: GO:0007286
      label: spermatid development
    modifier: DECREASED
  downstream:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    causal_link_type: DIRECT
    description: Misplaced basal body and annulus impair flagellar elongation and compartmentalization.
  - target: Abnormal sperm head morphology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The authors infer a head-shaping defect during spermiogenesis from the
      mild head abnormalities; the intermediate steps are not shown.
    evidence:
    - reference: PMID:33968937
      reference_title: "Genetic Defects in DNAH2 Underlie Male Infertility With Multiple Morphological Abnormalities of the Sperm Flagella in Humans and Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found DNAH2 deficiency in mice causes MMAF phenotypes and mildly abnormal heads"
      explanation: Mouse evidence pairing the spermiogenesis defect with abnormal heads.
  - target: Oligozoospermia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Knockout testes release fewer sperm. Why disordered spermiogenesis
      lowers the count is not established, and the human count reduction is
      variable.
    evidence:
    - reference: PMID:33968937
      reference_title: "Genetic Defects in DNAH2 Underlie Male Infertility With Multiple Morphological Abnormalities of the Sperm Flagella in Humans and Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Compared to heterozygous mutants, homozygous Dnah2 mutants had fewer sperm cells in the lumen of seminiferous tubules and epididymis"
      explanation: Reduced sperm output in knockout mice.
  evidence:
  - reference: PMID:33968937
    reference_title: "Genetic Defects in DNAH2 Underlie Male Infertility With Multiple Morphological Abnormalities of the Sperm Flagella in Humans and Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found misexpression of centriolar proteins and delocalization of annulus proteins in Dnah2-null spermatids and sperm, suggesting dysregulated flagella development in spermiogenesis."
    explanation: Basal body and annulus defects in knockout spermatids.

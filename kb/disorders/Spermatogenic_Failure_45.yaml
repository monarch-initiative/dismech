name: Spermatogenic Failure 45
creation_date: "2026-10-14T00:00:00Z"
category: Mendelian
synonyms:
- SPGF45
- spermatogenic failure 45
- DNAH2-related asthenoteratozoospermia
- DNAH2-related multiple morphological abnormalities of the sperm flagella
description: >-
  Spermatogenic failure 45 (SPGF45) is autosomal recessive male infertility
  caused by biallelic variants in DNAH2, which encodes an axonemal inner
  dynein arm heavy chain. Structural studies place DNAH2 in the
  double-headed inner dynein arm f (IDA f, also called I1) together with the
  heavy chains DNAH10 and DNAH12. Affected men have severe
  asthenoteratozoospermia with multiple morphological abnormalities of the
  sperm flagella (MMAF): most sperm have absent, short or coiled flagella,
  and some have mildly misshapen heads. Sperm count is normal to moderately
  reduced. Electron microscopy of patient sperm shows absent inner dynein
  arms, frequent loss of the central pair of microtubules, and a disorganized
  axoneme and mitochondrial sheath.

  In Dnah2 knockout mice, males but not females are infertile, sperm show
  the full MMAF spectrum, the inner-arm heavy chain DNAH1 and the radial
  spoke protein RSPH3 are lost from the flagellum, and basal body and
  annulus positioning during spermiogenesis is disturbed. Reported patients
  had no symptoms of primary ciliary dyskinesia, and the knockout mice had
  normal tracheal and oviductal cilia, so SPGF45 behaves as an isolated sperm
  flagellar disorder. ICSI with ejaculated sperm has given embryos,
  pregnancies and live births.

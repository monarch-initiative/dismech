notes: >-
  MONDO cross-references this disease as OMIM 619094 (the DNAH2 gene entry is
  OMIM 603333). ClinGen has no gene-disease validity classification for DNAH2
  and spermatogenic failure (searched kb/genes/ingest/clingen_gene_validity.tsv
  for DNAH2, no row). PMID:40592014 reports DNAH2, DNAH6 and DNAH10 patients
  together, and its abstract does not separate their results by gene, so its
  ICSI figures are pooled across the three genes. Abstract-only caches:
  PMID:30811583, PMID:33771466 and PMID:40592014; PMID:33968937 is full text.
inheritance:
- name: Autosomal recessive
  description: >-
    Disease requires biallelic DNAH2 variants. Reported genotypes are
    compound heterozygous or homozygous variants in Han Chinese men and a
    homozygous missense variant (p.W4240C) co-segregating in a consanguineous
    Pakistani family.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:33771466
    reference_title: "Novel bi-allelic variants in DNAH2 cause severe asthenoteratozoospermia with multiple morphological abnormalities of the flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three unrelated men with bi-allelic DNAH2 variants were identified. Sanger sequencing verified that the six novel variants originated from every parent."
    explanation: Biallelic variants inherited one from each parent in three unrelated men.
  - reference: PMID:33968937
    reference_title: "Genetic Defects in DNAH2 Underlie Male Infertility With Multiple Morphological Abnormalities of the Sperm Flagella in Humans and Mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a novel recessive variant (NM_020877:c.12720G > T;p.W4240C) in DNAH2 by whole-exome sequencing, which fully co-segregated with the infertile male members in a consanguineous Pakistani family"
    explanation: Recessive co-segregation in a consanguineous family.
pathophysiology:
- name: Loss of the DNAH2 Inner-Arm Dynein Heavy Chain
  description: >-
    Missense, nonsense and other biallelic DNAH2 variants reduce or abolish
    DNAH2 protein in sperm flagella. DNAH2 is one of the three heavy chains
    of the double-headed inner dynein arm f (IDA f / I1), alongside DNAH10
    and DNAH12.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DNAH2
    term:
      id: hgnc:2948
      label: DNAH2
  molecular_functions:
  - preferred_term: minus-end-directed microtubule motor activity
    modifier: DECREASED
    term:
      id: GO:0008569
      label: minus-end-directed microtubule motor activity
  cellular_components:
  - preferred_term: Inner dynein arm
    term:
      id: GO:0036156
      label: inner dynein arm
  downstream:
  - target: Loss of Inner-Arm and Radial Spoke Partners from the Sperm Flagellum
    causal_link_type: DIRECT
    description: Without DNAH2, other inner-arm and radial spoke components fail to accumulate in the flagellum.
    evidence:
    - reference: PMID:33968937
      reference_title: "Genetic Defects in DNAH2 Underlie Male Infertility With Multiple Morphological Abnormalities of the Sperm Flagella in Humans and Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Absence of DNAH2 compromises the expression of other axonemal components such as DNAH1 and RSPH3."
      explanation: Knockout mouse sperm lose DNAH1 and RSPH3 when DNAH2 is absent.
  - target: Disordered Flagellar Development During Spermiogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Shown only in knockout mice. How an axonemal dynein heavy chain
      influences basal body number and annulus migration is not known.
  evidence:
  - reference: PMID:30811583
    reference_title: "DNAH2 is a novel candidate gene associated with multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The DNAH2 protein level was significantly decreased and inner dynein arms were absent in the spermatozoa of patients."
    explanation: Reduced DNAH2 protein in patient sperm.
  - reference: PMID:33771466
    reference_title: "Novel bi-allelic variants in DNAH2 cause severe asthenoteratozoospermia with multiple morphological abnormalities of the flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunofluorescence data further validated these findings, showing reduced DNAH2 protein expression in the spermatozoa with DNAH2 variants, compared with normal spermatozoa."
    explanation: Independent confirmation of reduced DNAH2 protein in patient sperm.
  - reference: PMID:40898283
    reference_title: "DNAH10 mutation cause primary ciliary dyskinesia with defects of IDAf complex assembly and lung fibrosis manifestation."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The IDAf complex comprises intermediate chains (DNAI3, DNAI4, DNAI7), light chains (DYNLRB1, DYNRB2, DYNLL1), and heavy chains (DNAH2, DNAH10, DNAH12)."
    explanation: Analysis of published cryo-EM axoneme structures places DNAH2 as a heavy chain of IDA f.
- name: Loss of Inner-Arm and Radial Spoke Partners from the Sperm Flagellum
  description: >-
    In Dnah2 knockout sperm the inner-arm heavy chain DNAH1 and the radial
    spoke protein RSPH3 are absent from the flagellum, while the outer-arm
    heavy chain DNAH9 and acetylated tubulin remain. This has been shown in
    mice; the corresponding protein panel has not been reported for patient
    sperm.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Inner dynein arm assembly
    term:
      id: GO:0036159
      label: inner dynein arm assembly
    modifier: DECREASED
  downstream:
  - target: Inner Dynein Arm and Central Pair Loss with Axonemal Disorganization
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33968937
    reference_title: "Genetic Defects in DNAH2 Underlie Male Infertility With Multiple Morphological Abnormalities of the Sperm Flagella in Humans and Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Dnah2Δ/Δ sperm do not express another IDA component (DNAH1, magenta) and a radial spoke protein (RSPH3, green) but an ODA protein (DNAH9, yellow)."
    explanation: Selective loss of inner-arm and radial spoke proteins with outer arm retained.
- name: Inner Dynein Arm and Central Pair Loss with Axonemal Disorganization
  description: >-
    Patient sperm lack inner dynein arms, often lack the central pair, and
    have a disarranged axoneme and defective mitochondrial sheath, so the
    9+2 arrangement is broken.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Sperm

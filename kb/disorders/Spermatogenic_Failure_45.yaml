genetic:
- name: DNAH2
  association: Causal
  gene_term:
    preferred_term: DNAH2
    term:
      id: hgnc:2948
      label: DNAH2
  notes: >-
    Reported alleles include missense and nonsense variants located in the
    AAA ATPase and C-terminal dynein heavy chain domains: p.R1924C, p.S3835P
    and p.R3834Ter in the first Chinese report (as summarized in
    PMID:33968937), six further variants in three Chinese men
    (PMID:33771466), and homozygous p.W4240C (NM_020877 c.12720G>T) in a
    Pakistani family. No ClinGen gene-disease validity classification exists.
  evidence:
  - reference: PMID:30811583
    reference_title: "DNAH2 is a novel candidate gene associated with multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified five novel mutation sites in the DNAH2 gene in three cases from three families"
    explanation: First gene-disease report.
  - reference: PMID:33771466
    reference_title: "Novel bi-allelic variants in DNAH2 cause severe asthenoteratozoospermia with multiple morphological abnormalities of the flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three unrelated men with bi-allelic DNAH2 variants were identified."
    explanation: Independent replication in a 90-patient MMAF cohort.
  - reference: PMID:33968937
    reference_title: "Genetic Defects in DNAH2 Underlie Male Infertility With Multiple Morphological Abnormalities of the Sperm Flagella in Humans and Mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES analysis identified three rare damaging variants but only homozygous non-synonymous variant (c.12720G > T;p.W4240C) in DNAH2 co-segregated with the phenotype"
    explanation: Co-segregating variant in a family of a different ancestry.
animal_models:
- name: Dnah2 exon 25-28 deletion mouse
  species: Mouse
  genotype: Dnah2 exon 25-28 deletion (C57BL/6N-Dnah2em1(IMPC)Tcp), homozygous
  publication: PMID:33968937
  description: >-
    CRISPR/Cas9 deletion of exons 25-28 predicted to cause a frameshift; no
    full-length DNAH2 is made. Homozygous males are sterile with MMAF sperm;
    females are fertile and airway and oviduct cilia look normal.
  modeled_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    relationship: RECAPITULATES
    fidelity: HIGH
    description: The knockout reproduces the human MMAF spectrum.
    evidence:
    - reference: PMID:33968937
      reference_title: "Genetic Defects in DNAH2 Underlie Male Infertility With Multiple Morphological Abnormalities of the Sperm Flagella in Humans and Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Dnah2-null sperm cells display absent, short, bent, coiled, and/or irregular flagella consistent with the MMAF phenotype."
      explanation: MMAF in knockout sperm.
  - target: Inner Dynein Arm and Central Pair Loss with Axonemal Disorganization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The knockout axoneme is severely disorganized, but electron densities
      for the inner arms are still seen on the microtubule doublets.
    limitations: >-
      Patient sperm lack inner dynein arms by TEM, whereas knockout sperm
      retain inner-arm electron densities despite losing DNAH1 and DNAH2, so
      the mouse does not reproduce the human inner-arm loss exactly.
    evidence:
    - reference: PMID:33968937
      reference_title: "Genetic Defects in DNAH2 Underlie Male Infertility With Multiple Morphological Abnormalities of the Sperm Flagella in Humans and Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Electron densities corresponding to both IDA and ODA were observed from the microtubule doublets when the 9+2 arrangement is incomplete"
      explanation: Records the retained inner-arm densities behind the limitation.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI with ejaculated sperm bypasses the motility and form defect. In two
    Chinese series, all ICSI cycles produced pregnancies or blastocysts, and
    a pooled DNAH2/DNAH6/DNAH10 cohort reported live births in five of six
    couples. Numbers are small.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    description: Direct injection makes flagellar propulsion and form irrelevant to fertilization.
    evidence:
    - reference: PMID:30811583
      reference_title: "DNAH2 is a novel candidate gene associated with multiple morphological abnormalities of the sperm flagella."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "ICSI treatment was performed for two MMAF patients with DNAH2 mutations and the associated couples successfully achieved pregnancy, indicating good nuclear quality of the sperm from the DNAH2 mutant patients."
      explanation: ICSI succeeds because the sperm nucleus is intact.
  evidence:
  - reference: PMID:33771466
    reference_title: "Novel bi-allelic variants in DNAH2 cause severe asthenoteratozoospermia with multiple morphological abnormalities of the flagella."

mechanistic_hypotheses:
- hypothesis_group_id: flagellum_specific_dnah2_requirement
  hypothesis_label: Loss of DNAH2 disrupts the sperm flagellum but spares motile cilia, which is why SPGF45 is not primary ciliary dyskinesia
  status: EMERGING
  description: >-
    Neither reported families nor knockout mice show motile cilia disease.
    The human evidence is the absence of reported symptoms, not systematic
    ciliary testing such as nasal nitric oxide or ciliary beat analysis, and
    DNAH2 partners in IDA f (DNAH10) can cause primary ciliary dyskinesia.
  evidence:
  - reference: PMID:33968937
    reference_title: "Genetic Defects in DNAH2 Underlie Male Infertility With Multiple Morphological Abnormalities of the Sperm Flagella in Humans and Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Histological analyses of ciliated epithelia of trachea and oviduct epithelia did not show significant morphological defects"
    explanation: Normal tracheal and oviductal cilia in knockout mice.
  - reference: PMID:33968937
    reference_title: "Genetic Defects in DNAH2 Underlie Male Infertility With Multiple Morphological Abnormalities of the Sperm Flagella in Humans and Mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No PCD-related symptoms were reported by the infertile males."
    explanation: Affected men in the Pakistani family had no primary ciliary dyskinesia symptoms.

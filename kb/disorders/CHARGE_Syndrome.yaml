        CHARGE patients, in the same sentence that reports the thymic hypoplasia
        upstream of it.
  - target: Severe combined immunodeficiency
    causal_link_type: DIRECT
    description: >-
      At the severe end of the spectrum, absent thymic output produces a
      T-B+NK+ severe combined immunodeficiency.
    evidence:
    - reference: PMID:20186815
      reference_title: Molecular and phenotypic aspects of CHD7 mutation in CHARGE syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Severe combined immune deficiency (SCID) has also been reported in rare patients
      explanation: >-
        Documents SCID as a rare severe outcome in CHARGE syndrome, with the
        rarity stated in the quote itself.
  - target: Recurrent infections
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Recurrent sinopulmonary infection is common in CHARGE syndrome, but the
      cited cohort could not attribute it to a measurable immune defect - airway,
      palatal and aspiration factors plausibly contribute - so this edge is left
      indirect rather than typed as immunodeficiency-driven.
    evidence:
    - reference: PMID:26563674
      reference_title: The Immune Phenotype of Patients with CHARGE Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Recurrent sinopulmonary infections are common in children with CHARGE (Coloboma, Heart disease, choanal Atresia, growth/mental Retardation, Genitourinary malformations, Ear abnormalities) syndrome, but no prospective studies on immune function have been conducted.
      explanation: >-
        Establishes that recurrent sinopulmonary infection is common while
        stating the evidential gap that keeps this edge indirect.

- name: Impaired thymic development and T-cell output
  description: >-
    The immune arm of CHD7 disorder, and the reason CHARGE syndrome appears in
    the IUIS classification of inborn errors of immunity. A minority of patients
    have thymic aplasia or hypoplasia with consequent reduction in T-cell
    numbers, ranging from mild T-cell lymphopenia through combined T- and B-cell
    defects to, in rare patients, a T-B+NK+ severe combined immunodeficiency that
    is fatal without immune reconstitution. The phenotype overlaps that of
    22q11.2 deletion syndrome, with which CHARGE syndrome shares several
    non-immune features.

    Two things about this node are deliberately understated. First, it is not a
    constitutive feature: the source that catalogues it calls immunological
    problems "a rare feature of CHARGE syndrome", and a prospective cohort of 21
    CHD7-genotyped patients found no significant immune defect at the time of
    testing despite recurrent sinopulmonary infections. Second, the population
    frequency is genuinely unsettled rather than merely unmeasured here - see the
    charge_immunodeficiency_prevalence discussion. Nothing in this entry should
    be read as asserting that T-cell deficiency is expected in an individual with
    CHARGE syndrome.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: Thymus development
    term:
      id: GO:0048538
      label: thymus development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:20186815
    reference_title: Molecular and phenotypic aspects of CHD7 mutation in CHARGE syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunological problems are a rare feature of CHARGE syndrome, with a small number of CHARGE patients described as having thymic aplasia or hypoplasia,
    explanation: >-
      The review that defines this node, and the source of its central
      qualification: thymic aplasia/hypoplasia occurs in CHARGE syndrome but is a
      rare rather than a constitutive feature.
  - reference: PMID:29159871
    reference_title: Immunodeficiency in CHARGE syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunodeficiency can occur in CHARGE syndrome, with immunophenotypes including reduction in T-cell counts, combined T-B cell defects rarely requiring antibiotic prophylaxis or immunoglobulin replacement, and severe combined immunodeficiency, which is fatal without immune reconstitution.
    explanation: >-
      A dedicated review setting out the graded severity spectrum this node
      describes, from reduced T-cell counts through to severe combined
      immunodeficiency.
  - reference: PMID:26563674
    reference_title: The Immune Phenotype of Patients with CHARGE Syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite recurrent childhood ear and chest infections, only 2 children with CHARGE syndrome had an identifiable immune defect (reduced serum IgA).
    explanation: >-
      A prospective cohort in which the great majority of CHD7-genotyped patients
      had no identifiable immune defect. It is recorded here as a boundary on the
      node rather than as a contradiction of it: the recurrent infections were
      real, but they were not explained by a measurable immune deficiency in this
      cohort.
  downstream:
  - target: T-cell lymphopenia
    causal_link_type: DIRECT
    description: >-
      Reduced thymic tissue lowers thymic T-cell output, giving decreased
      circulating T-cell counts.
    evidence:
    - reference: PMID:20186815

prevalence:
- population: Worldwide
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 10.0
  notes: >-
    The cited review words this as an incidence of approximately 1:10,000, which
    for a congenital multiple-anomaly syndrome is a birth prevalence; 1 in 10,000
    is 10 per 100,000. An earlier version of this record asserted a range of 1 in
    8,500 to 1 in 17,000 live births, which no cited source stated - the evidence
    attached to it established only that the disorder is rare. The unsupported
    range has been replaced by the figure the sources actually give.
  evidence:
  - reference: PMID:20186815
    reference_title: Molecular and phenotypic aspects of CHD7 mutation in CHARGE syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CHARGE syndrome (OMIM  # 214800) is a rare (incidence ∼1:10,000
    explanation: >-
      The source of the recorded rate. The review attributes the figure to two
      independent clinical cohorts.
  - reference: PMID:37675914
    reference_title: "CHARGE syndrome and congenital heart diseases: systematic review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CHARGE syndrome (CS) is a rare genetic disease that affects many areas of the body.
    explanation: >-
      Independently confirms rarity. This quote supports the qualitative claim
      only and is not the source of the numeric rate.
progression:
- phase: Early life
  notes: >-
    Major early-life morbidity and mortality are driven by complex congenital
    heart defects and by airway/feeding problems; aspiration related to feeding
    difficulties is a leading cause of non-cardiovascular death. Survival to five
    years is about 70%, with mortality concentrated in the first year.
  evidence:
  - reference: PMID:37675914
    reference_title: "CHARGE syndrome and congenital heart diseases: systematic review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CHDs and feeding disorders associated with CS may have a substantial impact on prognosis.
    explanation: >-
      Systematic review concluding that congenital heart defects and feeding
      disorders substantially affect prognosis in CHARGE syndrome.
  - reference: PMID:20186815
    reference_title: Molecular and phenotypic aspects of CHD7 mutation in CHARGE syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Actuarial analysis of survival in children with CHARGE showed a 70% survival rate to five years of age, with the highest rate of mortality in the first year of life.
    explanation: >-
      Quantifies early-life survival and locates the mortality peak in the first
      year, which is the claim added to this phase's notes.
  - reference: PMID:37675914
    reference_title: "CHARGE syndrome and congenital heart diseases: systematic review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The in-hospital mortality rate was about 9.5% (n=86/900) in case series studies and 12% (n=5/43) in case reports, including cardiovascular (CV) and non-CV causes.
    explanation: >-
      Gives the in-hospital mortality associated with the cardiac burden of the
      syndrome.
- phase: Childhood through adulthood
  notes: >-
    Beyond infancy, decreased life expectancy reflects residual heart defects,
    infection, aspiration or choking, obstructive and central apnea, and possibly
    seizures. This is the phase in which the syndrome's respiratory and
    infectious morbidity dominates rather than its structural cardiac lesions.
    Crucially, the outlook is not uniformly poor: many individuals have a normal
    life expectancy, and the entry should not be read as implying otherwise.
  evidence:
  - reference: PMID:20301296
    reference_title: "CHD7 Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In childhood, adolescence, and adulthood, decreased life expectancy is likely related to a combination of residual heart defects, infections, aspiration or choking, respiratory issues including obstructive and central apnea, and possibly seizures.
    explanation: >-
      GeneReviews enumerates the contributors to reduced life expectancy after
      infancy, which is what this phase records.
  - reference: PMID:20301296
    reference_title: "CHD7 Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite these complications, the life expectancy for many individuals can be normal.
    explanation: >-
      The counterbalancing statement, quoted so the phase does not read as a
      uniformly poor prognosis.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  de_novo_rate: "90"
  description: >-
    CHARGE syndrome (CHD7 disorder) is an autosomal dominant disorder typically
    caused by a de novo pathogenic variant. In rare instances an individual
    inherits a pathogenic variant from a heterozygous parent, and germline
    mosaicism has been documented, giving an empiric sibling recurrence risk of
    approximately 1%-2% when the proband's variant is not detected in either
    parent.
  evidence:
  - reference: PMID:20301296
    reference_title: "CHD7 Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CHD7 disorder is an autosomal dominant disorder typically caused by a de novo pathogenic variant.
    explanation: >-
      GeneReviews directly states the autosomal dominant inheritance pattern and
      that most cases arise de novo.
  - reference: PMID:16155193
    reference_title: "CHARGE syndrome: the phenotypic spectrum of mutations in the CHD7 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Somatic mosaicism was detected in the unaffected mother of a sib pair, supporting the existence of germline mosaicism.
    explanation: >-
      Documents germline mosaicism in CHARGE syndrome, which underlies the
      empiric recurrence risk for siblings of a proband with apparently de novo
      variants.
pathophysiology:
- name: CHD7 haploinsufficiency and impaired ATP-dependent chromatin remodeling
  description: >-
    CHD7 encodes a chromodomain helicase DNA-binding protein that functions as an
    ATP-dependent chromatin-remodeling enzyme. Heterozygous loss-of-function
    variants reduce CHD7 dosage (haploinsufficiency), impairing the
    chromatin-remodeling activity needed to fine-tune transcriptional programs
    during development. Most pathogenic variants are unique nonsense or frameshift
    variants scattered throughout the gene, consistent with a loss-of-function
    mechanism.

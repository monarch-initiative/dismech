- name: Olfactory bulb hypoplasia
  category: Phenotypic
  description: >-
    Unilateral or bilateral hypoplasia of the olfactory bulb, or arhinencephaly,
    is the most commonly reported CNS anomaly in CHARGE syndrome and contributes

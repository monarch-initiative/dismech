- name: Coloboma
  category: Phenotypic
  frequency: FREQUENT
  description: >-
    Ocular coloboma is a cardinal feature of CHARGE syndrome and is more frequent
    in CHD7 mutation-positive individuals. It typically involves the choroid,
    retina and optic nerve and is commonly bilateral; iris, eyelid and optic-disc
    colobomas are described less often.

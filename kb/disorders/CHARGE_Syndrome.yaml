      explanation: >-
        Chd7 deletion alters the developmental gene-expression program of neural
        crest cells, directly linking loss of CHD7 activity to this mechanism.
  - target: Inappropriate p53 activation
    description: >-
      CHD7 normally binds the p53 promoter to repress p53; haploinsufficiency
      releases this repression and causes inappropriate p53 activation.
    evidence:

- name: Thymic hypoplasia
  category: Immunological
  frequency: VERY_RARE
  description: >-
    Aplasia or hypoplasia of the thymus, sometimes described as a DiGeorge
    sequence, occurs in a small minority of individuals with CHARGE syndrome and
    is the anatomic basis of the T-cell deficiency that places the disorder in
    the IUIS classification of inborn errors of immunity. It is not a general
    feature of the syndrome.
  phenotype_term:
    preferred_term: Thymic aplasia or hypoplasia
    term:
      id: HP:0000778
      label: Hypoplasia of the thymus
  evidence:
  - reference: PMID:20186815
    reference_title: Molecular and phenotypic aspects of CHD7 mutation in CHARGE syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunological problems are a rare feature of CHARGE syndrome, with a small number of CHARGE patients described as having thymic aplasia or hypoplasia,
    explanation: >-
      Documents thymic aplasia/hypoplasia in CHARGE syndrome and, in the same
      sentence, the rarity that supports the VERY_RARE band. The review states
      these features were too few to enter its statistical analysis, so the band
      is the source's qualitative "rare" rather than a counted proportion.
- name: T-cell lymphopenia
  category: Immunological
  frequency: VERY_RARE
  description: >-
    Decreased circulating T-cell counts follow reduced thymic output. Severity
    ranges from isolated mild T-cell lymphopenia to profound T-cell deficiency.
    Transient lymphopenia in the first years of life is separately reported and
    is more common than a persistent identifiable T-cell defect.
  phenotype_term:
    preferred_term: T-cell lymphopenia
    term:
      id: HP:0005403
      label: Decreased total T cell count
  evidence:
  - reference: PMID:20186815
    reference_title: Molecular and phenotypic aspects of CHD7 mutation in CHARGE syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IgG2 subclass deficiency, and T-cell lymphopenia
    explanation: >-
      Lists T-cell lymphopenia among the immunological problems described in
      CHARGE patients. The band is VERY_RARE because the same sentence opens by
      calling immunological problems a rare feature of the syndrome.
  - reference: PMID:26563674
    reference_title: The Immune Phenotype of Patients with CHARGE Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A greater proportion of patients with 22q11.2 deletion had persistent lymphopenia (57% vs 30%) and hypocalcemia (60% vs 37.5%) compared with patients with CHARGE syndrome in the first 72 months of life.
    explanation: >-
      Quantifies early-life persistent lymphopenia in CHARGE syndrome at 30%,
      lower than in 22q11.2 deletion syndrome. This is a lymphocyte-count
      observation in the first 72 months rather than a demonstrated T-cell
      immunodeficiency, which is why it qualifies the description rather than
      raising the frequency band.
- name: Severe combined immunodeficiency
  category: Immunological
  frequency: VERY_RARE
  description: >-
    A T-B+NK+ severe combined immunodeficiency has been reported in rare
    individuals with CHD7 pathogenic variants. It is the one immunological
    presentation of CHARGE syndrome that is fatal without immune reconstitution,
    which is why it matters clinically out of proportion to its frequency.
  phenotype_term:
    preferred_term: Severe combined immunodeficiency
    term:
      id: HP:0004430
      label: Severe combined immunodeficiency
  evidence:
  - reference: PMID:20186815
    reference_title: Molecular and phenotypic aspects of CHD7 mutation in CHARGE syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Severe combined immune deficiency (SCID) has also been reported in rare patients
    explanation: >-
      Documents SCID in CHARGE syndrome, with the rarity supporting the
      VERY_RARE band stated in the quote itself.
  - reference: PMID:29159871
    reference_title: Immunodeficiency in CHARGE syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      severe combined immunodeficiency, which is fatal without immune reconstitution
    explanation: >-
      Supports the clinical consequence recorded in the description, namely that
      this presentation is fatal unless the immune system is reconstituted.
- name: Recurrent infections
  category: Immunological
  frequency: FREQUENT
  description: >-
    Recurrent ear and sinopulmonary infections are common in children with
    CHARGE syndrome. Importantly, they are usually not attributable to a
    measurable immune defect: palatal, airway, eustachian-tube and aspiration
    factors contribute, and the prospective cohort cited here found an
    identifiable immune abnormality in only 2 of 21 patients. Recurrent infection
    in CHARGE syndrome should therefore prompt immune testing rather than be
    assumed to establish immunodeficiency.
  phenotype_term:
    preferred_term: Recurrent infections
    term:
      id: HP:0002719
      label: Recurrent infections
  evidence:
  - reference: PMID:26563674
    reference_title: The Immune Phenotype of Patients with CHARGE Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recurrent sinopulmonary infections are common in children with CHARGE (Coloboma, Heart disease, choanal Atresia, growth/mental Retardation, Genitourinary malformations, Ear abnormalities) syndrome, but no prospective studies on immune function have been conducted.
    explanation: >-
      Establishes recurrent sinopulmonary infection as a common feature. The
      FREQUENT band reflects this qualitative "common" rather than a counted
      proportion, which the source does not give.
  - reference: PMID:26563674
    reference_title: The Immune Phenotype of Patients with CHARGE Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although phenotypic overlap exists between CHARGE and 22q11.2 deletion syndromes, no significant immune defects were detected in this cohort of patients with CHARGE syndrome at the time of testing.
    explanation: >-
      The finding behind the caution in the description: recurrent infection in
      this cohort was not explained by a detectable immune defect.
genetic:
- name: CHD7
  gene_term:
    preferred_term: CHD7
    term:
      id: hgnc:20626
      label: CHD7
  association: causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:20301296
      reference_title: "CHD7 Disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CHD7 disorder is an autosomal dominant disorder typically caused by a de novo pathogenic variant.
      explanation: >-
        GeneReviews establishes autosomal dominant inheritance of CHD7-related
        CHARGE syndrome.
  notes: >-
    Heterozygous pathogenic variants in CHD7 (chromodomain helicase DNA-binding
    protein 7) on chromosome 8q12.1 cause the majority of CHARGE syndrome — about
    two thirds of clinically diagnosed patients in a pooled review of 379 tested
    individuals. Roughly 72% of reported variants are nonsense or frameshift, 13%
    splice site and 10% missense; they are scattered throughout the coding
    sequence without meaningful clustering, recurrent variants are rare, and
    there is no clear genotype-phenotype correlation even between relatives
    sharing a variant. A minority of cases are caused by contiguous 8q12
    microdeletions or by whole- or partial-gene deletions not detected by
    sequencing alone, so deletion/duplication analysis matters in a
    sequencing-negative patient.
  evidence:
  - reference: PMID:16155193
    reference_title: "CHARGE syndrome: the phenotypic spectrum of mutations in the CHD7 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CHD7 mutations account for the majority of the cases with CHARGE syndrome, with a broad clinical variability and without an obvious genotype-phenotype correlation.
    explanation: >-
      Establishes CHD7 as the causative gene in most CHARGE cases with broad
      clinical variability and no genotype-phenotype correlation.
  - reference: PMID:20186815
    reference_title: "Molecular and phenotypic aspects of CHD7 mutation in CHARGE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 379 individuals tested, 254 (67%) were CHD7 mutation-positive, whereas 125 (33%) were mutation-negative.
    explanation: >-
      Quantifies the CHD7 diagnostic yield in clinically diagnosed CHARGE
      syndrome at 67%.
  - reference: PMID:20186815
    reference_title: "Molecular and phenotypic aspects of CHD7 mutation in CHARGE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the CHD7 mutations reported thus far, approximately 72% are nonsense or frameshift, 13% are splice site, and 10% are missense
    explanation: >-
      Source of the variant-class proportions recorded in these notes, and the
      quantitative basis for describing the mechanism as loss of function.
  - reference: PMID:20186815
    reference_title: "Molecular and phenotypic aspects of CHD7 mutation in CHARGE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CHD7 mutations are reported throughout the entire coding sequence of the gene and do not appear to cluster in any meaningful way.
    explanation: >-
      Supports the absence of variant clustering stated in the notes.
  - reference: PMID:20186815
    reference_title: "Molecular and phenotypic aspects of CHD7 mutation in CHARGE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recent work indicates that CHARGE patients without detectable single-base mutations may have heterozygous deletions of CHD7
    explanation: >-
      Supports the recommendation that deletion analysis be pursued in a
      sequencing-negative patient.
  - reference: PMID:20186815
    reference_title: "Molecular and phenotypic aspects of CHD7 mutation in CHARGE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of CHD7 mutations are predicted to be loss of function, likely leading to an aberrant mRNA targeted for degradation via nonsense-mediated decay. Therefore, haploinsufficiency for CHD7 is the most likely pathogenic mechanism underlying CHARGE syndrome.
    explanation: >-
      States the inference from the variant spectrum to haploinsufficiency, the
      mechanism this entry's initiating pathophysiology node asserts.
  - reference: PMID:15300250
    reference_title: "Mutations in a new member of the chromodomain gene family cause CHARGE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a 2.3-Mb de novo overlapping microdeletion on chromosome 8q12 identified by array comparative genomic hybridization in two individuals with CHARGE syndrome.
    explanation: >-
      Documents 8q12 microdeletion as a less common mechanism of CHARGE
      syndrome involving CHD7.
diagnosis:
- name: Molecular genetic testing for CHD7
  description: >-
    The diagnosis of CHD7 disorder/CHARGE syndrome is established in a proband
    with suggestive clinical and imaging findings and a heterozygous pathogenic
    variant in (or deletion of) CHD7 identified by molecular genetic testing.
    Clinical diagnosis historically relied on the Blake and later Verloes
    major/minor criteria (e.g., coloboma, choanal atresia, characteristic ear
    anomalies, and semicircular canal hypoplasia as major features).
  evidence:
  - reference: PMID:20301296
    reference_title: "CHD7 Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of CHD7 disorder is established in a proband with suggestive clinical and imaging findings and a heterozygous pathogenic variant in or deletion of CHD7 identified by molecular genetic testing.
    explanation: >-
      GeneReviews describes the molecular diagnostic standard for CHARGE
      syndrome.
- name: Temporal bone CT
  description: >-
    Computed tomography of the temporal bone demonstrates the semicircular canal
    hypoplasia/aplasia, cochlear hypoplasia and Mondini malformation that are the
    most highly penetrant findings in CHD7 disorder — present in 98% of
    mutation-positive patients — which is why the pooled cohort review recommends
    it as a diagnostic tool and why hypoplastic semicircular canals are a major
    criterion in the Verloes scheme. Its practical value is greatest in a patient
    whose external features are equivocal.
  evidence:
  - reference: PMID:20186815
    reference_title: "Molecular and phenotypic aspects of CHD7 mutation in CHARGE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data strongly support the use of temporal bone CT as a diagnostic tool for evaluation of CHARGE patients, and confirm previous reports that inner ear malformations should be considered a diagnostic criterion.
    explanation: >-
      The review's explicit diagnostic recommendation, which is what this record
      captures.
  - reference: PMID:20186815
    reference_title: "Molecular and phenotypic aspects of CHD7 mutation in CHARGE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These anomalies include semicircular canal hypoplasia/aplasia, cochlear hypoplasia, and Mondini malformation
    explanation: >-
      Enumerates the specific temporal-bone findings the scan is looking for.
  - reference: PMID:20186815
    reference_title: "Molecular and phenotypic aspects of CHD7 mutation in CHARGE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Revised diagnostic criteria by Verloes include ocular coloboma, choanal atresia/stenosis and hypoplasia of the semicircular canals as major criteria
    explanation: >-
      Supports the statement that semicircular canal hypoplasia is a major
      Verloes criterion.
treatments:
- name: Multidisciplinary supportive management
  description: >-
    Management of CHARGE syndrome is complex and requires a multidisciplinary
    approach involving clinicians, therapists, and educators, with treatment
    directed at the individual's specific manifestations (cardiac surgery,
    choanal atresia repair, feeding/airway support, hearing and vision
    rehabilitation, endocrine management, and developmental/educational support).
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301296
    reference_title: "CHD7 Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management of the manifestations of CHD7 disorder can be complex and require a multidisciplinary approach involving clinicians, therapists, and educators.
    explanation: >-
      GeneReviews describes multidisciplinary supportive management as the
      mainstay of CHARGE care.
- name: Anesthesia precautions for airway complications
  description: >-
    Because of the increased risk of post-anesthesia airway complications,
    procedures requiring anesthesia should be minimized and combined whenever
    possible. This is a documented "agents/circumstances to avoid" safety
    consideration in CHARGE syndrome.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301296
    reference_title: "CHD7 Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because of the increased risk of post-anesthesia airway complications, procedures requiring anesthesia should be minimized and combined whenever possible.
    explanation: >-
      GeneReviews "Agents/circumstances to avoid" warning on anesthesia-related
      airway complications in CHARGE syndrome.
- name: Cardiac surgery
  description: >-
    Surgical correction of congenital heart defects is required in a large
    proportion of individuals with CHARGE syndrome, reflecting the high
    prevalence and complexity of cardiac malformations in the disorder.
  treatment_term:
    preferred_term: cardiac surgical procedure
    term:
      id: NCIT:C157806
      label: Cardiac Surgery
  evidence:
  - reference: PMID:37675914
    reference_title: "CHARGE syndrome and congenital heart diseases: systematic review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac surgery was performed in more than half of CS patients (150/242, 62%).
    explanation: >-
      Systematic review reporting that cardiac surgery was performed in the
      majority of CHARGE syndrome patients with congenital heart defects.
- name: Genetic counseling
  description: >-
    Genetic counseling is recommended for families given the autosomal dominant
    inheritance and the empiric sibling recurrence risk of approximately 1%-2%
    arising from documented germline mosaicism, with discussion of prenatal and
    preimplantation genetic testing options.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301296
    reference_title: "CHD7 Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CHD7 disorder is an autosomal dominant disorder typically caused by a de novo pathogenic variant.
    explanation: >-
      The autosomal dominant inheritance with de novo and germline-mosaic
      recurrence risk documented in GeneReviews is the basis for genetic
      counseling in CHARGE syndrome.
differential_diagnoses:
- name: DiGeorge syndrome (22q11.2 deletion syndrome)
  disease_term:
    preferred_term: 22q11.2 deletion syndrome
    term:
      id: MONDO:0008564
      label: DiGeorge syndrome
  description: >-
    The most important differential, and the one that matters most to this
    entry's immune section. The two disorders share genital hypoplasia, cleft
    palate, congenital heart disease, thymic hypoplasia with T-cell deficiency,
    and early-life hypocalcemia, and CHD7 variants have been found in patients
    initially diagnosed as 22q11.2 deletion syndrome. CHARGE syndrome is
    distinguished by ocular coloboma, choanal atresia and the distinctive inner-
    and outer-ear anomalies. Immunologically the two separate on degree rather
    than kind: persistent lymphopenia and hypocalcemia are commoner in 22q11.2
    deletion, and T-cell lymphopenia with specific antibody deficiency is
    characteristic there but not in CHARGE syndrome.
  evidence:
  - reference: PMID:20186815
    reference_title: "Molecular and phenotypic aspects of CHD7 mutation in CHARGE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many of these features, including genital hypoplasia, cleft palate, and heart defects, are shared by other multiple anomaly syndromes such as 22q11.2 deletion
    explanation: >-
      Documents the shared features that make 22q11.2 deletion syndrome the
      principal differential.
  - reference: PMID:20186815
    reference_title: "Molecular and phenotypic aspects of CHD7 mutation in CHARGE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      however, CHARGE syndrome is considered unique in its combination of these features with distinctive inner and outer ear defects and optic colobomas.
    explanation: >-
      States the features that discriminate CHARGE syndrome from the shared
      differential.
  - reference: PMID:26563674
    reference_title: The Immune Phenotype of Patients with CHARGE Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, T-cell lymphopenia, low immunoglobulin levels, and specific antibody deficiency were noted in patients with 22q11.2 deletion.
    explanation: >-
      The head-to-head immunological comparison that supports separating the two
      disorders by degree of immune involvement.
- name: Kallmann syndrome
  disease_term:
    preferred_term: Kallmann syndrome
    term:
      id: MONDO:0018800
      label: Kallmann syndrome
  description: >-
    Kallmann syndrome shares the olfactory-placode mechanism with CHARGE
    syndrome — anosmia with hypogonadotropic hypogonadism from failed GnRH-neuron
    migration — and CHD7 variants have been reported in patients diagnosed with
    it. A patient presenting as Kallmann syndrome without a typical molecular
    finding should be examined for the ocular, choanal and inner-ear features of
    CHARGE syndrome.
  evidence:
  - reference: PMID:20186815
    reference_title: "Molecular and phenotypic aspects of CHD7 mutation in CHARGE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CHD7 mutations have also been reported in patients diagnosed with conditions that have significant clinical overlap with CHARGE, including Kallmann
    explanation: >-
      Documents CHD7 variants in patients carrying a Kallmann syndrome
      diagnosis, which is what makes it a differential.
  - reference: PMID:20186815
    reference_title: "Molecular and phenotypic aspects of CHD7 mutation in CHARGE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings imply that patients presenting with features of these syndromes, but lacking typical molecular findings, should be examined for clinical signs of CHARGE syndrome and tested for CHD7 mutations.
    explanation: >-
      The review's explicit recommendation, which is the practical content of
      this differential record.
discussions:
- discussion_id: charge_immunodeficiency_prevalence
  kind: KNOWLEDGE_GAP
  prompt: >-
    How common is a clinically meaningful immune defect in CHARGE syndrome, and
    which patients warrant immune evaluation?
  rationale: >-
    CHARGE syndrome is listed among the inborn errors of immunity, but the two
    strongest lines of evidence in this entry do not agree on how much immune
    disease there is. The pooled phenotype review calls immunological problems a
    rare feature, reported in too few patients to enter its statistical analysis,
    while cataloguing thymic aplasia/hypoplasia, IgG2 subclass deficiency,
    T-cell lymphopenia and, in rare patients, severe combined immunodeficiency.
    The only prospective study, 21 CHD7-genotyped patients, found an identifiable
    immune defect in just two of them despite recurrent ear and chest infections
    in the cohort — yet also recorded persistent lymphopenia in 30% during the
    first 72 months of life. A dedicated review concludes outright that the
    prevalence remains unclear.

    The gap is not merely bookkeeping. It determines whether immune screening
    should be routine at diagnosis or reserved for patients with an infection
    phenotype, and the answer is consequential in both directions: SCID in
    CHARGE syndrome is fatal without immune reconstitution, so missing it is
    costly, while the recurrent sinopulmonary infections that would trigger
    screening are readily explained by palatal, airway and aspiration factors
    that have nothing to do with immunity. Until it is closed, this entry
    deliberately assigns VERY_RARE bands to the immune phenotypes and types the
    infection edge as indirect.
  attaches_to:
  - pathophysiology#Impaired thymic development and T-cell output
  - phenotypes#T-cell lymphopenia
  - phenotypes#Recurrent infections
  proposed_experiments:
  - experiment_id: charge_prospective_immune_cohort
    name: Adequately powered prospective immune phenotyping of a genotyped CHARGE cohort
    description: >-
      Measure lymphocyte subsets, naive T cells and recent thymic emigrants,
      B-cell memory phenotype, immunoglobulins and protein/polysaccharide vaccine
      responses at fixed ages in a multicentre CHD7-genotyped cohort large enough
      to estimate the prevalence of each immunophenotype with useful precision,
      and follow the early-life lymphopenia to determine what fraction resolves.
  - experiment_id: charge_infection_attribution_study
    name: Attribution of recurrent sinopulmonary infection in CHARGE syndrome
    description: >-
      In patients with recurrent sinopulmonary infection, jointly assess immune
      function and the competing anatomic explanations — palatal competence,
      eustachian tube function, aspiration on swallow study, and airway patency —
      to establish what fraction of the infection burden is attributable to
      immune deficiency rather than to structural causes.

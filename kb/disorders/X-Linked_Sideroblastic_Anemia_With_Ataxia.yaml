name: X-Linked Sideroblastic Anemia With Ataxia
category: Mendelian
creation_date: "2026-11-19T04:30:00Z"
synonyms:
- XLSA/A
- XLSA-A
- ASAT
- Pagon-Bird-Detter syndrome
- Spinocerebellar ataxia X-linked 6
- X-linked sideroblastic anemia with spinocerebellar ataxia
description: >
  X-linked sideroblastic anemia with ataxia (XLSA/A) is a very rare X-linked recessive
  syndrome caused by hemizygous missense variants in ABCB7, a half-type ATP-binding
  cassette transporter of the mitochondrial inner membrane and the functional ortholog of
  yeast Atm1p. ABCB7 exports a mitochondrially derived sulfur-containing metabolite that
  the cytosolic iron-sulfur protein assembly pathway requires, so the lesion differs from
  every other inherited iron-sulfur disorder: the mitochondrial assembly machinery is
  intact and what fails is the export step feeding the cytosol. Partial loss of function
  impairs cytosolic cluster maturation, leaving iron regulatory protein 1 unable to read
  cellular iron status, and inhibits heme synthesis, which produces mild hypochromic
  microcytic sideroblastic anemia with raised erythrocyte protoporphyrin. The dominant
  clinical problem is neurological: early-onset, largely non-progressive cerebellar
  ataxia with cerebellar hypoplasia, delayed walking, dysarthria and nystagmus, so the
  anemia is often asymptomatic and found only on testing.
disease_term:
  preferred_term: X-linked sideroblastic anemia with ataxia
  term:
    id: MONDO:0010524
    label: X-linked sideroblastic anemia with ataxia
parents:
- Inherited Sideroblastic Anemia
- X-Linked Cerebellar Ataxia
notes: >-
  No GeneReviews chapter covers ABCB7 (PubMed search `ABCB7[TIAB] AND genereviews[book]
  NOT retired[TI]` returned 0 on 2026-11-19, because that query excludes retired
  chapters). This disease did have its own GeneReviews chapter, *X-Linked Sideroblastic
  Anemia and Ataxia* (PMID:20301496), and GeneReviews has **retired** it. It is tagged in
  `references:` so the record shows it exists, but withdrawn content is not used as a
  phenotype baseline and it was not mined for evidence. The phenotype baseline therefore
  comes from the published families: the original kindred (PMID:10196363, with the clinical description
  in PMID:4045952), two further families (PMID:11050011, PMID:11843825), a fourth family
  (PMID:22398176), a Buryat pedigree with ataxia and no anemia (PMID:26242992), and a
  Chinese family reported with a literature review (PMID:34354969).
  Phenotype frequencies are omitted: the published total is about six or seven families,
  and the HPO frequency annotations for OMIM:301310 are small-denominator literature
  tallies rather than cohort proportions.
  ClinGen rates ABCB7 Moderate, but against the generic parent term
  `MONDO:0044970 mitochondrial disease` rather than against XLSA/A, so that assertion is
  for a different pair and is not recorded in `gene_disease_validity` here.
  Somatic ABCB7 involvement in acquired myelodysplastic syndrome with ring sideroblasts,
  where SF3B1 mutation causes ABCB7 mis-splicing, is a separate disease and is not
  curated in this entry.

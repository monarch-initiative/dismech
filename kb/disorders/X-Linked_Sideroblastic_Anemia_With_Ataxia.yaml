    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data indicate that ABC7 is the causal gene of XLSA/A and that XLSA/A is a mitochondrial disease caused by a mutation in the nuclear genome."
    explanation: Establishes ABCB7 as the causal gene.

    explanation: A fourth independent family with a distinct ABCB7 variant.
animal_models:
- name: Abcb7 conditional knockout mouse
  species: Mouse
  genotype: Abcb7 exons 9 and 10 deleted by inducible Cre/loxP
  publication: PMID:16467350
  description: >
    Conditional deletion of Abcb7 is lethal early in gestation and tissue-specific
    deletion impairs cytosolic cluster assembly, with the liver surviving and showing
    dysregulated iron metabolism.
  modeled_mechanisms:
  - target: Impaired Cytosolic Iron-Sulfur Protein Maturation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Liver-specific deletion reproduces the cytosolic cluster assembly defect and the
      consequent loss of iron regulatory protein 1 control.
    limitations: >-
      The allele is a complete deletion, whereas human disease alleles are hypomorphic
      missense; complete loss is embryonic lethal, so the model cannot reproduce the
      human neurological or erythroid phenotype at the whole-organism level.
    evidence:
    - reference: PMID:16467350
      reference_title: "The mitochondrial ATP-binding cassette transporter Abcb7 is essential in mice and participates in cytosolic iron-sulfur cluster biogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A notable exception to this was liver, where loss of Abcb7 impaired cytosolic Fe-S cluster assembly but was not lethal."
      explanation: The tissue-specific model shows the cytosolic assembly defect in a surviving tissue.
  - target: Inhibited Heme Biosynthesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Erythroid work in the mouse established that the partial-loss-of-function
      mechanism inhibits heme synthesis and that Abcb7 is required for haematopoiesis.
    limitations: >-
      Whether the inhibition of heme synthesis is direct remains unresolved in the model
      itself, which states only that it is direct or indirect.
    evidence:
    - reference: PMID:17192398
      reference_title: "Abcb7, the gene responsible for X-linked sideroblastic anemia with ataxia, is essential for hematopoiesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we show that Abcb7 is essential for hematopoiesis and formally demonstrate that XLSA/A is due to partial loss of function mutations in Abcb7 that directly or indirectly inhibit heme biosynthesis."
      explanation: The mouse study establishes the heme-synthesis mechanism of the human disease.
treatments:
- name: Pyridoxine supplementation
  description: >
    Pyridoxine was tried in two reported patients and did not work: the haemoglobin
    deficiency was refractory in one, and in the other oral vitamin B6 left haematocrit,
    mean cell volume, mean cell haemoglobin and the reticulocyte count unchanged. This is
    the clearest treatment contrast with ALAS2-related X-linked sideroblastic anemia,
    which is pyridoxine-responsive, and it follows from the mechanism: pyridoxal phosphate
    is the ALAS2 cofactor, and ALAS2 is not the defective step here.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridoxine
      term:
        id: CHEBI:16709
        label: pyridoxine
  target_mechanisms:
  - target: Inhibited Heme Biosynthesis
    treatment_effect: RESTORES
    description: >-
      Pyridoxine is intended to drive heme synthesis by supplying the ALAS2 cofactor. In
      this disease it fails, because the block is not at ALAS2.
    evidence:
    - reference: PMID:34354969
      reference_title: "The First Case Report of X-Linked Sideroblastic Anemia With Ataxia of Chinese Origin and Literature Review."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "P16 received pyridoxine supplementation, but the hemoglobin deficiency was refractory."
      explanation: The intended effect on heme synthesis was not achieved, so this evidence refutes the treatment acting on this node in this disease.
  evidence:
  - reference: PMID:34354969

diagnosis:
- name: Erythrocyte protoporphyrin with red-cell indices
  description: >
    Raised erythrocyte protoporphyrin with normal iron stores in a child with early-onset
    ataxia is the biochemical clue; marrow examination shows ring sideroblasts. The
    anemia is mild and may be missed, so the test should be done on the basis of the
    ataxia rather than waiting for a haematological presentation.
  evidence:
  - reference: PMID:22398176
    reference_title: "X-linked sideroblastic anemia and ataxia: a new family with identification of a fourth ABCB7 gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is a rare cause of early onset ataxia, which may be overlooked due to the usually mild asymptomatic anemia"
    explanation: The anemia is mild enough to be missed, so the diagnosis must be pursued from the neurological side.
- name: ABCB7 sequencing
  description: >
    Sequencing of ABCB7 confirms the diagnosis. In one family ABCB7 was reached only
    after ALAS2 was excluded and the protoporphyrin pattern was examined.
  evidence:

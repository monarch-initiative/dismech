  description: >
    Hemizygous ABCB7 variants in affected males, with heterozygous carrier mothers who
    are neurologically normal but may show red-cell changes. The original kindred had
    five affected males and the variant segregated with disease.
  evidence:
  - reference: PMID:10196363
    reference_title: "Mutation of a putative mitochondrial iron transporter gene (ABC7) in X-linked sideroblastic anemia and ataxia (XLSA/A)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation was shown to segregate with the disease in the family and was not detected in at least 600 chromosomes of general population controls."
    explanation: Segregation in the original X-linked kindred.
  - reference: PMID:11843825
    reference_title: "X-linked cerebellar ataxia and sideroblastic anaemia associated with a missense mutation in the ABC7 gene predicting V411L."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct sequencing revealed hemizygosity in the brothers and heterozygosity in the mother"
    explanation: Hemizygous affected brothers and a heterozygous mother.

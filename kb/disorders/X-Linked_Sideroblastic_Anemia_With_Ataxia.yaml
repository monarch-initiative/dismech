discussions:
- discussion_id: xlsaa_cerebellar_selectivity
  prompt: >-
    Why does loss of a transporter present in every mitochondrion produce selective
    cerebellar hypoplasia rather than diffuse brain disease?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cerebellar Developmental Failure
  - phenotypes#Cerebellar hypoplasia
  rationale: >-
    ABCB7 is required for the development and function of many tissues in the mouse, yet
    the human brain finding is selective cerebellar hypoplasia with the rest of the brain
    largely spared, and the course is developmental rather than degenerative. No study has
    examined cerebellar tissue, from a patient or a model, so the regional selectivity has
    no mechanism attached to it. Candidates include a particularly high demand for
    cytosolic iron-sulfur enzymes during the late, protracted proliferation of cerebellar
    granule precursors, and a dependency of Purkinje cells specifically. The model cannot
    be used to settle it as currently published, because complete deletion is lethal
    before the cerebellum forms. The entry therefore records the tissue node with an
    inferred, not demonstrated, link.
  evidence:
  - reference: PMID:16467350
    reference_title: "The mitochondrial ATP-binding cassette transporter Abcb7 is essential in mice and participates in cytosolic iron-sulfur cluster biogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Abcb7 was found to be essential for the development and function of numerous other cell types and tissues"
    explanation: ABCB7 is broadly required, which makes the narrow human brain phenotype the thing needing explanation.
  - reference: PMID:34354969
    reference_title: "The First Case Report of X-Linked Sideroblastic Anemia With Ataxia of Chinese Origin and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "striking, selective cerebellar hypoplasia was found"
    explanation: The selectivity of the lesion is the observation to be explained.
  proposed_experiments:
  - experiment_id: xlsaa_hypomorph_cerebellum
    name: Cerebellar phenotyping of an Abcb7 hypomorphic knock-in mouse
    experiment_design: TARGETED_PERTURBATION
    executability: SPECIFIED
    description: >-
      Knock a patient missense allele, for example the one corresponding to human
      p.Ile400Met, into the mouse Abcb7 locus so that partial function is retained and
      the animal survives, then measure cerebellar volume, granule-cell proliferation and
      Purkinje-cell number across development, with cytosolic iron-sulfur enzyme activity
      measured in cerebellum against cortex and liver from the same animals.
    would_support:
    - pathophysiology#Cerebellar Developmental Failure
    supporting_outcome:
    - Reduced cerebellar volume with a cytosolic cluster enzyme deficit larger in cerebellum than in cortex or liver, which would make the selectivity a tissue-level difference in demand
    refuting_outcome:
    - Equal enzyme deficits across regions with no cerebellar volume loss, which would move the explanation to a human-specific feature of cerebellar development and make the mouse the wrong model for this feature
- discussion_id: xlsaa_heme_block_directness
  prompt: >-
    Is the inhibition of heme synthesis a direct consequence of the failed export, or is
    it mediated by the loss of cytosolic iron-sulfur cluster assembly and iron regulatory
    protein 1 control?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Inhibited Heme Biosynthesis
  - pathophysiology#Loss of Iron Regulatory Protein 1 Control
  rationale: >-
    The mouse study that established the mechanism states that the variants inhibit heme
    biosynthesis directly or indirectly, and leaves the choice open. The question is not
    academic. If the block is mediated by iron regulatory protein 1 misreading cellular
    iron, then the anemia is a downstream consequence of the same cytosolic defect that
    the neurological disease comes from, and the two arms of the syndrome share one
    mechanism. If the transporter has a separate, direct role in supplying something that
    heme synthesis needs, the arms are mechanistically separate, which would explain why
    one reported family has ataxia with no sideroblastic anemia at all. The entry records
    the edge with unknown intermediates rather than choosing.
  evidence:
  - reference: PMID:17192398
    reference_title: "Abcb7, the gene responsible for X-linked sideroblastic anemia with ataxia, is essential for hematopoiesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "partial loss of function mutations in Abcb7 that directly or indirectly inhibit heme biosynthesis"
    explanation: The source explicitly leaves the directness of the heme block unresolved.
  - reference: PMID:26242992
    reference_title: "Whole-genome sequencing identifies a novel ABCB7 gene mutation for X-linked congenital cerebellar ataxia in a large family of Mongolian ancestry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "found in affected individuals of a Buryat family who had no evidence of sideroblastic anemia"
    explanation: A family with the neurological phenotype and no anemia, which a single shared mechanism has to account for.
  proposed_experiments:
  - experiment_id: xlsaa_irp1_uncoupling
    name: Uncoupling IRP1 from the heme block in erythroid cells
    experiment_design: TARGETED_PERTURBATION
    executability: SPECIFIED
    description: >-
      In ABCB7-deficient erythroid cells, express an IRP1 variant locked in its
      cluster-bound aconitase conformation so that iron sensing is restored independently
      of cluster supply, then measure heme synthesis, protoporphyrin accumulation and
      mitochondrial iron deposition against unmodified ABCB7-deficient and control cells.
    would_support:
    - pathophysiology#Loss of Iron Regulatory Protein 1 Control
    supporting_outcome:
    - Restoring IRP1 function corrects heme synthesis and prevents the iron ring, which would route the erythroid phenotype through the cytosolic cluster defect
    refuting_outcome:
    - Heme synthesis stays blocked despite normal IRP1 function, which would support a separate direct role for the transporter in heme synthesis
- discussion_id: xlsaa_anemia_free_phenotype
  prompt: >-
    Should an ABCB7 family with cerebellar ataxia and no sideroblastic anemia be counted
    as this disease, and what sets whether the erythroid arm appears?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - disease#
  - pathophysiology#Hemizygous ABCB7 Missense Variant
  rationale: >-
    A large Buryat pedigree with a p.Gly682Ser ABCB7 variant was reported as X-linked
    congenital cerebellar ataxia with no evidence of sideroblastic anemia, which sits
    awkwardly under a disease name built on both features. Three readings compete: the
    anemia is present but subclinical and was not sought with the sensitive test, since
    erythrocyte protoporphyrin is raised even in carriers; the variant is
    tissue-selectively hypomorphic, sparing the erythroid lineage; or the disease concept
    should be widened and renamed. The pedigree also carried deletions affecting ATP7A
    and PGAM4, so attributing the whole phenotype to ABCB7 alone is itself uncertain. The
    entry keeps the family's variant in the allele list and does not treat an absent
    anemia as excluding the diagnosis.
  evidence:
  - reference: PMID:26242992
    reference_title: "Whole-genome sequencing identifies a novel ABCB7 gene mutation for X-linked congenital cerebellar ataxia in a large family of Mongolian ancestry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is apparently a major causative factor of the cerebellar hypoplasia/atrophy found in affected individuals of a Buryat family who had no evidence of sideroblastic anemia"
    explanation: States both the ataxia-only phenotype and the authors' hedged attribution.
  - reference: PMID:34354969
    reference_title: "The First Case Report of X-Linked Sideroblastic Anemia With Ataxia of Chinese Origin and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Erythrocyte protoporphyrin of 8/8 patients and 4/6 carriers was significantly higher than the normal range."
    explanation: The sensitive marker is abnormal even in carriers, so an apparently anemia-free patient may not have been tested adequately.
  notes: >-
    The Buryat pedigree's co-occurring ATP7A exon 2 and PGAM4 deletions are recorded in
    the genetic notes of the source rather than as modifiers here, because no study
    assesses their contribution to the phenotype.

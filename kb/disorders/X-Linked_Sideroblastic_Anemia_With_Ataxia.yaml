progression:
- phase: Infantile to early-childhood onset ataxia
  age_range: Infancy to early childhood
  notes: >-
    Non-progressive cerebellar ataxia begins in infancy or early childhood, with delayed
    walking, ataxic gait, dysarthria and nystagmus; the accompanying anemia is mild.
  evidence:
  - reference: PMID:10196363
    reference_title: "Mutation of a putative mitochondrial iron transporter gene (ABC7) in X-linked sideroblastic anemia and ataxia (XLSA/A)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "X-linked sideroblastic anemia and ataxia (XLSA/A) is a recessive disorder characterized by an infantile to early childhood onset of non-progressive cerebellar ataxia and mild anemia with hypochromia and microcytosis."
    explanation: Defines the onset and the non-progressive course.
- phase: Later cerebellar atrophy
  age_range: Adulthood
  notes: >-
    Cerebellar hypoplasia is present early, and atrophy has been described in adults, so
    slow late progression cannot be excluded despite the non-progressive label.
  evidence:
  - reference: PMID:34354969
    reference_title: "The First Case Report of X-Linked Sideroblastic Anemia With Ataxia of Chinese Origin and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebellum atrophy probably occurs in the later stages of the disease"
    explanation: The review's reading of the imaging across ages.
pathophysiology:
- name: Hemizygous ABCB7 Missense Variant
  description: >
    A hemizygous germline missense variant in ABCB7 at Xq13. Every reported
    disease-associated allele is missense and they cluster in or near the transmembrane
    helices and the C-terminal nucleotide-binding domain: p.Ile400Met in the original
    kindred, p.Glu433Lys, p.Val411Leu, p.Glu208Asp and p.Gly682Ser. No truncating human
    allele is known, and conditional deletion is lethal in mice, so only hypomorphic
    alleles are compatible with life.
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  genes:
  - preferred_term: ABCB7
    term:
      id: hgnc:48
      label: ABCB7
  evidence:
  - reference: PMID:10196363
    reference_title: "Mutation of a putative mitochondrial iron transporter gene (ABC7) in X-linked sideroblastic anemia and ataxia (XLSA/A)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An I400M variant was identified in a predicted transmembrane segment of the ABC7 gene in patients with XLSA/A."
    explanation: Identifies the founding variant in a transmembrane segment.
  - reference: PMID:16467350
    reference_title: "The mitochondrial ATP-binding cassette transporter Abcb7 is essential in mice and participates in cytosolic iron-sulfur cluster biogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that Abcb7 was essential in extra-embryonic tissues early in gestation and that the mutant allele exhibits an X-linked parent-of-origin lethality effect."
    explanation: Complete loss is lethal in mice, so human disease alleles must retain partial function.
  downstream:
  - target: Partial Loss of ABCB7 Transporter Function
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10196363
      reference_title: "Mutation of a putative mitochondrial iron transporter gene (ABC7) in X-linked sideroblastic anemia and ataxia (XLSA/A)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Introduction of the corresponding mutation into the Saccharomyces cerevisiae ATM1 gene resulted in a partial loss of function of the yeast Atm1 protein."
      explanation: The patient substitution, modelled in the yeast ortholog, causes partial loss of transporter function.
- name: Partial Loss of ABCB7 Transporter Function
  description: >
    ABCB7 is a half-type ABC transporter of the mitochondrial inner membrane and the
    functional ortholog of yeast Atm1p. Human wild-type ABCB7 complements an ATM1
    deletion in yeast while the patient alleles complement it poorly, which locates the
    defect in the transport function itself rather than in protein targeting or stability.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ABCB7
    term:
      id: hgnc:48
      label: ABCB7
  molecular_functions:
  - preferred_term: ABC-type iron-sulfur cluster transporter activity
    modifier: DECREASED
    term:
      id: GO:0140481
      label: ABC-type iron-sulfur cluster transporter activity
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  evidence:
  - reference: PMID:11050011
    reference_title: "Human ABC7 transporter: gene structure and mutation causing X-linked sideroblastic anemia with ataxia with disruption of cytosolic iron-sulfur protein maturation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Expression of normal ABC7 almost fully complemented the defect in the maturation of cytosolic Fe/S proteins in a yeast strain in which the ATM1 gene had been deleted"
    explanation: Establishes ABCB7 as the functional ortholog, so the yeast assay reads on human transport function.
  - reference: PMID:17192398
    reference_title: "Abcb7, the gene responsible for X-linked sideroblastic anemia with ataxia, is essential for hematopoiesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "is due to partial loss of function mutations in Abcb7 that directly or indirectly inhibit heme biosynthesis"
    explanation: States the partial-loss-of-function mechanism in the mouse model.
  downstream:
  - target: Reduced Export of the Mitochondrial Precursor for Cytosolic Cluster Assembly
    causal_link_type: DIRECT
- name: Reduced Export of the Mitochondrial Precursor for Cytosolic Cluster Assembly
  description: >
    ABCB7 is predicted to export a mitochondrially derived, sulfur-containing metabolite
    that the cytosolic iron-sulfur assembly pathway consumes. This is the rate-limiting
    step of the disease and the feature that separates it from every other inherited
    iron-sulfur disorder: the mitochondrial assembly machinery is intact and only the
    export step fails, so mitochondrial clients are spared while cytosolic ones are not.
  biological_scale: MOLECULAR
  role: central_effector
  biological_processes:
  - preferred_term: iron-sulfur cluster export from the mitochondrion
    modifier: DECREASED
    term:
      id: GO:0140466
      label: iron-sulfur cluster export from the mitochondrion
  evidence:
  - reference: PMID:16467350
    reference_title: "The mitochondrial ATP-binding cassette transporter Abcb7 is essential in mice and participates in cytosolic iron-sulfur cluster biogenesis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "is a functional ortholog of yeast Atm1p and is predicted to export a mitochondrially derived metabolite required for cytosolic Fe-S cluster assembly"
    explanation: States the transported substrate and its role, as the framing the mouse study tests.
  downstream:
  - target: Impaired Cytosolic Iron-Sulfur Protein Maturation
    causal_link_type: DIRECT
  - target: Inhibited Heme Biosynthesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Impaired Cytosolic Iron-Sulfur Protein Maturation
  description: >
    Cytosolic and nuclear iron-sulfur proteins fail to mature without the exported
    precursor. Both patient alleles tested in the yeast assay gave low-efficiency
    cytosolic cluster maturation, and liver-specific deletion in mice impairs it without
    killing the tissue.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: cytosolic iron-sulfur cluster assembly
    modifier: DECREASED
    term:
      id: GO:0016226
      label: iron-sulfur cluster assembly
  evidence:
  - reference: PMID:11050011
    reference_title: "Human ABC7 transporter: gene structure and mutation causing X-linked sideroblastic anemia with ataxia with disruption of cytosolic iron-sulfur protein maturation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the expression of mutated ABC7 (E433K) or Atm1p (D398K) proteins in Deltaatm1 cells led to a low efficiency of cytosolic Fe/S protein maturation"
    explanation: The patient allele specifically impairs cytosolic cluster maturation.
  - reference: PMID:16467350
    reference_title: "The mitochondrial ATP-binding cassette transporter Abcb7 is essential in mice and participates in cytosolic iron-sulfur cluster biogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "where loss of Abcb7 impaired cytosolic Fe-S cluster assembly but was not lethal"
    explanation: Tissue-specific deletion impairs cytosolic assembly in a surviving tissue.
  downstream:
  - target: Loss of Iron Regulatory Protein 1 Control
    causal_link_type: DIRECT
- name: Loss of Iron Regulatory Protein 1 Control
  description: >
    Iron regulatory protein 1 senses cellular iron by whether it holds a cytosolic
    iron-sulfur cluster. Without the exported precursor it cannot be loaded, so the cell
    misreads its own iron status and iron handling is dysregulated, as shown in mouse
    hepatocytes.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: intracellular iron ion homeostasis
    modifier: DYSREGULATED
    term:
      id: GO:0006879
      label: intracellular iron ion homeostasis
  evidence:
  - reference: PMID:16467350
    reference_title: "The mitochondrial ATP-binding cassette transporter Abcb7 is essential in mice and participates in cytosolic iron-sulfur cluster biogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "control of iron regulatory protein 1, a key cytosolic modulator of iron metabolism, which is responsive to the availability of cytosolic Fe-S clusters, was impaired and contributed to the dysregulation of hepatocyte iron metabolism"
    explanation: Loss of cytosolic clusters disables IRP1 control of iron metabolism.
- name: Inhibited Heme Biosynthesis
  description: >
    Heme synthesis is inhibited, directly or indirectly, by the partial loss of ABCB7
    function. The mouse work demonstrates this in the erythroid lineage and shows that
    Abcb7 is required for haematopoiesis. The intermediate step between the export defect
    and the heme block is not identified.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: erythroblast
    term:
      id: CL:0000765
      label: erythroblast
  biological_processes:
  - preferred_term: heme biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006783
      label: heme biosynthetic process
  evidence:
  - reference: PMID:17192398
    reference_title: "Abcb7, the gene responsible for X-linked sideroblastic anemia with ataxia, is essential for hematopoiesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we show that Abcb7 is essential for hematopoiesis and formally demonstrate that XLSA/A is due to partial loss of function mutations in Abcb7 that directly or indirectly inhibit heme biosynthesis."
    explanation: Demonstrates the heme-synthesis block, and states that whether it is direct is unresolved.
  downstream:
  - target: Erythroid Iron Loading With Ring Sideroblast Formation
    causal_link_type: DIRECT
- name: Erythroid Iron Loading With Ring Sideroblast Formation
  description: >
    Iron delivered to the erythroblast mitochondrion cannot be used for heme, so it
    accumulates in a perinuclear ring, the ring sideroblast. Protoporphyrin accumulates
    upstream of the block and is raised in red cells, with zinc protoporphyrin
    predominating over free protoporphyrin, while body iron stores remain normal. The
    haemoglobin deficit that follows is mild and transfusion-independent.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: erythroblast
    term:
      id: CL:0000765
      label: erythroblast
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  evidence:
  - reference: PMID:11843825
    reference_title: "X-linked cerebellar ataxia and sideroblastic anaemia associated with a missense mutation in the ABC7 gene predicting V411L."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two brothers with X-linked ataxia (XLA) were found to have hypochromic red cells and increased erythrocyte protoporphyrin despite normal iron stores."
    explanation: Raised erythrocyte protoporphyrin with normal iron stores, the biochemical signature of the heme block.
  - reference: PMID:11843825
    reference_title: "X-linked cerebellar ataxia and sideroblastic anaemia associated with a missense mutation in the ABC7 gene predicting V411L."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone marrow biopsy confirmed the presence of ring sideroblasts in one of the brothers."
    explanation: Ring sideroblasts on marrow examination.
  downstream:
  - target: Elevated bone marrow ring sideroblast count
  - target: Hypochromic microcytic anemia
  - target: Increased erythrocyte protoporphyrin concentration
  - target: Pappenheimer bodies
- name: Cerebellar Developmental Failure
  description: >
    The cerebellum is the tissue least able to tolerate the cytosolic cluster deficit.
    Mouse work shows Abcb7 is required for the development and function of numerous cell
    types, and in patients the imaging finding is selective cerebellar hypoplasia rather
    than a degenerative pattern, so the lesion is developmental, with atrophy appearing
    only in later life. Why the cerebellum in particular is affected is not established,
    and no patient or model cerebellar tissue study addresses it.
  biological_scale: TISSUE
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  evidence:
  - reference: PMID:16467350
    reference_title: "The mitochondrial ATP-binding cassette transporter Abcb7 is essential in mice and participates in cytosolic iron-sulfur cluster biogenesis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "using X-chromosome inactivation assays and tissue-specific deletions, Abcb7 was found to be essential for the development and function of numerous other cell types and tissues"
    explanation: Supports a developmental requirement for ABCB7 across tissues, from which cerebellar hypoplasia follows by inference rather than by direct demonstration.
  - reference: PMID:34354969
    reference_title: "The First Case Report of X-Linked Sideroblastic Anemia With Ataxia of Chinese Origin and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "P16 underwent computed tomography of the brain at age 18, and striking, selective cerebellar hypoplasia was found."
    explanation: Selective cerebellar hypoplasia on imaging.
  downstream:
  - target: Nonprogressive cerebellar ataxia
  - target: Cerebellar hypoplasia
  - target: Dysarthria
  - target: Nystagmus
  - target: Delayed ability to walk
  - target: Cerebellar atrophy
    causal_link_type: UNKNOWN

genetic:
- name: ABCB7
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: ABCB7
    term:
      id: hgnc:48
      label: ABCB7
  variant_origin: GERMLINE
  notes: >
    All reported disease alleles are missense: p.Ile400Met (original kindred),
    p.Glu433Lys, p.Val411Leu, p.Glu208Asp, p.Gly682Ser (a Buryat pedigree with ataxia and
    no sideroblastic anemia) and a variant reported in a Chinese family. Legacy cDNA
    numbering in the older papers differs from current transcript numbering, and ABCB7
    isoforms shift the protein position by one residue in some records, so a reported
    protein change should be checked against the transcript before it is reused.
    ClinGen rates ABCB7 Moderate for the parent concept mitochondrial disease
    (MONDO:0044970) rather than for this disease, so that tier is not recorded here.
  evidence:
  - reference: PMID:10196363

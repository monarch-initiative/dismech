  evidence:
  - reference: PMID:41755551
    reference_title: "Japanese Encephalitis: Understanding Its Impact, Prevention, and the Role of Vaccination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Japanese encephalitis (JE) is a mosquito-borne viral disease and remains an important cause of viral encephalitis in Asia and parts of the Western Pacific. Earlier WHO-supported global burden estimates published around 2014 suggested approximately 68,000 clinical cases and up to 20,400 deaths annually"
    explanation: Documents the WHO global burden estimate of approximately 68,000 clinical cases and up to 20,400 deaths per year.
progression:
- phase: Acute Encephalitic and Early Seizure Phase
  notes: >-
    Symptomatic neuroinvasive JEV infection presents as acute viral
    encephalitis complicated by early seizures in 50% to 80% of patients.
  evidence:
  - reference: PMID:35615063
    reference_title: "Molecular Mechanisms in the Genesis of Seizures and Epilepsy Associated With Viral Infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given its broad geographic distribution, JEV is probably the most common cause of arbovirus encephalitis. Early seizures are reported in 50–80% of cases; epilepsy is less common."
    explanation: Documents the high frequency (50% to 80%) of early seizures during acute JEV encephalitis.
- phase: Post-Encephalitic Epileptic and Neurological Sequelae Phase
  notes: >-
    Survivors of the acute encephalitic phase may develop chronic post-infectious
    epilepsy or long-term neurological sequelae.
  evidence:
  - reference: PMID:35615063
    reference_title: "Molecular Mechanisms in the Genesis of Seizures and Epilepsy Associated With Viral Infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given its broad geographic distribution, JEV is probably the most common cause of arbovirus encephalitis. Early seizures are reported in 50–80% of cases; epilepsy is less common."
    explanation: Distinguishes acute early seizures from less common chronic post-encephalitic epilepsy following JEV infection.
pathophysiology:
- name: Cutaneous Mosquito Inoculation, Peripheral Amplification, and Blood-Brain Barrier Breach
  description: >-
    Following inoculation by a Culex mosquito bite, JEV replicates in dermal
    dendritic cells and regional lymph nodes, generating a transient viremia
    that crosses the blood-brain barrier into the central nervous system.
  role: trigger
  biological_scale: ORGANISM

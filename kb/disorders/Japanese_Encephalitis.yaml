infectious_agent:
- name: Japanese encephalitis virus
  description: >-
    Single-stranded, positive-sense RNA orthoflavivirus of the family
    Flaviviridae and the leading cause of arboviral encephalitis worldwide.
  infectious_agent_term:
    preferred_term: Japanese encephalitis virus
    term:
      id: NCBITaxon:11072
      label: Japanese encephalitis virus
  evidence:
  - reference: PMID:41755551
    reference_title: "Japanese Encephalitis: Understanding Its Impact, Prevention, and the Role of Vaccination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Japanese encephalitis (JE) is a mosquito-borne viral disease and remains an important cause of viral encephalitis in Asia and parts of the Western Pacific."
    explanation: Identifies Japanese encephalitis as a major mosquito-borne viral encephalitis in Asia and the Western Pacific.
  - reference: PMID:35615063
    reference_title: "Molecular Mechanisms in the Genesis of Seizures and Epilepsy Associated With Viral Infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given its broad geographic distribution, JEV is probably the most common cause of arbovirus encephalitis. Early seizures are reported in 50–80% of cases; epilepsy is less common."
    explanation: Identifies Japanese encephalitis virus (JEV) as the most common cause of arbovirus encephalitis globally.
agent_life_cycle:
  description: >-
    JEV circulates in an enzootic cycle between Culex mosquitoes, ardeid wading
    birds (reservoir hosts), and pigs (amplifying hosts), while humans are
    incidental dead-end hosts because human viremia is insufficient to infect
    feeding mosquitoes.
  hosts:
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: incidental dead-end host
  - preferred_term: mosquito
    term:
      id: NCBITaxon:7157
      label: Culicidae
    role: vector
  - preferred_term: pig
    term:
      id: NCBITaxon:9823
      label: Sus scrofa
    role: amplifying host
transmission:
- name: Culex mosquito vector transmission
  description: >-
    JEV is transmitted to humans through the bite of infected Culex mosquitoes,
    primarily Culex tritaeniorhynchus breeding in irrigated rice paddies.
  evidence:
  - reference: PMID:32887654
    reference_title: "Spatial heterogeneity and temporal dynamics of mosquito population density and community structure in Hainan Island, China."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Japanese encephalitis (JE) was used to be a major mosquito-borne infectious disease all over China including Hainan in the past, and Culex is the major vector"
    explanation: Identifies Culex mosquitoes as the major vector of Japanese encephalitis.

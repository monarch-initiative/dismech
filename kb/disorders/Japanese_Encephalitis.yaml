    snippet: "Japanese encephalitis (JE) is a mosquito-borne viral disease and remains an important cause of viral encephalitis in Asia and parts of the Western Pacific."
    explanation: Establishes mosquito-borne transmission leading to viral encephalitis.
  downstream:
  - target: Neuronal Infection, Microglial Neuroinflammation, and Epileptogenesis
    description: Neuroinvasion across the blood-brain barrier delivers JEV to neurons in the thalamus, basal ganglia, and cerebral cortex.
    causal_link_type: DIRECT
- name: Neuronal Infection, Microglial Neuroinflammation, and Epileptogenesis
  description: >-
    Within the central nervous system, JEV infects neurons and activates
    microglia, triggering neuronal death, pro-inflammatory cytokine release, and
    network hyperexcitability that produce acute viral encephalitis and early
    seizures in 50% to 80% of clinical cases.
  role: central_effector
  biological_scale: TISSUE

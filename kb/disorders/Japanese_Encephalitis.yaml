- name: Mosquito Inoculation and Transient Viremia
  description: >-
    Following inoculation by an infected Culex mosquito bite, JEV undergoes
    peripheral viral replication generating a low-level, transient viremia that
    is typically cleared from peripheral blood around the onset of clinical
    illness.

diagnosis:
- name: JEV-Specific IgM MAC-ELISA and Plaque Reduction Neutralization Test
  description: >-
    Laboratory diagnosis of Japanese encephalitis virus infection by detection of
    JEV-specific IgM antibodies in cerebrospinal fluid (CSF) or serum using IgM
    antibody-capture ELISA (MAC-ELISA), confirmed by plaque reduction
    neutralization testing (PRNT) to differentiate cross-reactive flavivirus
    antibodies.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:26856911
    reference_title: "Differential Diagnosis of Japanese Encephalitis Virus Infections with the Inbios JE Detect™ and DEN Detect™ MAC-ELISA Kits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The JEV-specific IgM antibody-capture enzyme-linked immunosorbent assay (MAC-ELISA) is a sensitive method of laboratory diagnosis, as JEV IgM is produced soon after infection and is detectable in 90% of cases in cerebrospinal fluid (CSF) by 4 days and in serum by 7–9 days after the onset of clinical illness."
    explanation: Establishes JEV-specific IgM MAC-ELISA in CSF and serum as the primary sensitive laboratory diagnostic assay for Japanese encephalitis.
  - reference: PMID:26856911
    reference_title: "Differential Diagnosis of Japanese Encephalitis Virus Infections with the Inbios JE Detect™ and DEN Detect™ MAC-ELISA Kits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At CDC, the PRNT is used to confirm MAC-ELISA results and also as a more specific test to differentiate flavivirus cross-reactivity in primary flavivirus infections."
    explanation: Establishes plaque reduction neutralization testing (PRNT) as the confirmatory assay to distinguish JEV from cross-reactive flavivirus antibodies.
treatments:
- name: Japanese Encephalitis SA 14-14-2 Vaccination (Live-Attenuated SA14-14-2, Inactivated IXIARO, and Chimeric IMOJEV)
  description: >-
    Vaccination is the cornerstone of Japanese encephalitis prevention. The
    live-attenuated SA14-14-2 vaccine provides high, long-term single-dose
    effectiveness across endemic Asian immunization programs, while the alum-adjuvanted
    formaldehyde-inactivated SA14-14-2 Vero-cell vaccine (IXIARO) and chimeric
    IMOJEV vaccine protect travelers and non-endemic populations.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Cutaneous Mosquito Inoculation, Peripheral Amplification, and Blood-Brain Barrier Breach
    treatment_effect: INHIBITS
    description: >-
      Vaccine-induced neutralizing antibodies against JEV envelope (E) protein
      clear peripheral virus and prevent blood-brain barrier traversal.
    evidence:
    - reference: PMID:41755551
      reference_title: "Japanese Encephalitis: Understanding Its Impact, Prevention, and the Role of Vaccination."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "In the absence of specific antiviral therapy, prevention remains the cornerstone of JE control, with vaccination representing the most effective public health intervention. Among available vaccines, the live-attenuated SA14-14-2 vaccine has played a central role in reducing the burden of JE in endemic countries. Its high effectiveness, long-term protection following a single dose, favourable safety profile, WHO prequalification, and incorporation into national immunisation programs have made it the backbone of JE prevention in Asia. Inactivated vaccines, such as IXIARO, and chimaeric vaccines, such as IMOJEV, provide important complementary options, particularly for travellers and non-endemic populations."
      explanation: Documents prevention of clinical JE disease by SA14-14-2, IXIARO, and IMOJEV vaccines.
  evidence:
  - reference: PMID:41755551
    reference_title: "Japanese Encephalitis: Understanding Its Impact, Prevention, and the Role of Vaccination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the absence of specific antiviral therapy, prevention remains the cornerstone of JE control, with vaccination representing the most effective public health intervention. Among available vaccines, the live-attenuated SA14-14-2 vaccine has played a central role in reducing the burden of JE in endemic countries. Its high effectiveness, long-term protection following a single dose, favourable safety profile, WHO prequalification, and incorporation into national immunisation programs have made it the backbone of JE prevention in Asia. Inactivated vaccines, such as IXIARO, and chimaeric vaccines, such as IMOJEV, provide important complementary options, particularly for travellers and non-endemic populations."
    explanation: Establishes the effectiveness and clinical roles of SA14-14-2, IXIARO, and IMOJEV vaccines.
- name: Supportive Care
  description: >-
    No specific antiviral intervention is available for Japanese encephalitis;
    management is supportive, focusing on seizure control, intracranial pressure
    management, and airway protection.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:28187808
    reference_title: "Diagnosis and management of acute encephalitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Flavivirus infections (West Nile, Japanese encephalitis, tick-borne encephalitis) remain the most common other identified cause of encephalitis but no specific intervention is available."
    explanation: Confirms the absence of specific antiviral intervention for Japanese encephalitis.

name: Japanese Encephalitis
creation_date: '2026-10-25T20:20:00Z'
category: Infectious Disease
description: >-
  Japanese encephalitis (JE) is a mosquito-borne neuroinvasive orthoflavivirus
  disease caused by Japanese encephalitis virus (JEV), transmitted primarily by
  Culex mosquitoes (especially Culex tritaeniorhynchus) in an enzootic cycle
  involving wading birds and domestic pigs across Asia and the Western Pacific.
  Although most human infections are asymptomatic, neuroinvasive disease
  (roughly 68,000 cases and up to 20,400 deaths annually) targets the thalamus,
  basal ganglia, brainstem, and cerebral cortex, causing acute encephalitis
  with a high incidence of early seizures (50% to 80% of cases) and permanent
  neurological sequelae.

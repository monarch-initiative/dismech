genetic:
- name: KIDINS220
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: KIDINS220
    term:
      id: hgnc:29508
      label: KIDINS220
  variant_origin: GERMLINE
  presence: PRESENT
  association: Biallelic loss-of-function variants (frameshift, splice, in-frame deletion)
  notes: >-
    ClinGen counts five variants in at least eight probands across four
    publications (PMID:28934391, PMID:32909676, PMID:33205811,
    PMID:36588759). Biallelic variants cause either this disorder or a
    recessive form of SINO syndrome; heterozygous C-terminal truncations that
    escape nonsense-mediated decay cause dominant SINO syndrome, curated as a
    subtype of Complex_Hereditary_Spastic_Paraplegia.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_6bd6659f-99b4-4274-9eb5-2500f98367b1-2024-10-08T160000.000Z
    evidence:
    - reference: CGGV:assertion_6bd6659f-99b4-4274-9eb5-2500f98367b1-2024-10-08T160000.000Z
      reference_title: "KIDINS220 / ventriculomegaly and arthrogryposis (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "KIDINS220 | HGNC:29508 | ventriculomegaly and arthrogryposis | MONDO:0859184 | AR | Definitive"
      explanation: ClinGen Prenatal GCEP classifies the KIDINS220-VENARG relationship as Definitive under autosomal recessive inheritance.
  variants:
  - name: KIDINS220 exon 24 frameshift
    type: frameshift
    description: >-
      Homozygous in two sequenced fetuses of a consanguineous couple with four
      affected pregnancies. Destroys the native splice site, producing an
      out-of-frame transcript with a premature stop codon in exon 25.
    evidence:
    - reference: PMID:28934391
      reference_title: "Homozygous KIDINS220 loss-of-function variants in fetuses with cerebral ventriculomegaly and limb contractures."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Exome sequencing in two of the aborted fetuses revealed a shared homozygous frameshift variant in exon 24 in KIDINS220."
      explanation: Identity of the first reported VENARG variant.
  - name: KIDINS220 in-frame three-residue deletion
    type: in-frame deletion
    description: >-
      Homozygous in three affected fetuses of a consanguineous family; removes
      three amino acids next to the fourth transmembrane domain and weakens
      TrkA binding.
    evidence:
    - reference: PMID:33205811
      reference_title: "TrkA mediates effect of novel KIDINS220 mutation in human brain ventriculomegaly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We here report a consanguineous family where three fetuses presented with brain ventriculomegaly and limb contractures and shared a very rare homozygous variant of KIDINS220, consisting of an in-frame deletion of three amino acids adjacent to the fourth transmembrane domain."
      explanation: Identity of the in-frame deletion allele.
  - name: KIDINS220 homozygous frameshift (Egyptian family)
    type: frameshift
    description: >-
      Novel homozygous frameshift in a consanguineous Egyptian couple's
      affected fetus, with a history of seven miscarriages and a stillbirth.
    evidence:
    - reference: PMID:32909676
      reference_title: "Prenatal delineation of a distinct lethal fetal syndrome caused by a homozygous truncating KIDINS220 variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We confirm the latter finding by presenting the first detailed prenatal identification of a fetal phenotype associated with novel homozygous deleterious frameshift variant in KIDINS220 gene in a consanguineous healthy Egyptian couple."
      explanation: Identity of the variant in the Egyptian family.
  evidence:
  - reference: PMID:28934391
    reference_title: "Homozygous KIDINS220 loss-of-function variants in fetuses with cerebral ventriculomegaly and limb contractures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We hence propose that the identified homozygous loss-of-function variant in KIDINS220 causes the phenotype in the presented fetuses, and that this represents a hitherto undescribed severe autosomal recessive neurodevelopmental disorder."
    explanation: First report of the disorder.
  - reference: PMID:32909676
    reference_title: "Prenatal delineation of a distinct lethal fetal syndrome caused by a homozygous truncating KIDINS220 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We confirm the latter finding by presenting the first detailed prenatal identification of a fetal phenotype associated with novel homozygous deleterious frameshift variant in KIDINS220 gene in a consanguineous healthy Egyptian couple."
    explanation: Independent confirmation in a second family with a different frameshift.

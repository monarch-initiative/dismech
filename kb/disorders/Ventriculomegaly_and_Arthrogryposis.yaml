differential_diagnoses:
- name: SINO Syndrome
  disease_term:
    preferred_term: spastic paraplegia, intellectual disability, nystagmus, and obesity
    term:
      id: MONDO:0015007
      label: spastic paraplegia, intellectual disability, nystagmus, and obesity
  description: >-
    Allelic KIDINS220 disorder. The dominant form is caused by heterozygous
    C-terminal truncations that escape nonsense-mediated decay; a recessive
    form is caused by biallelic variants and is more severe. SINO presents
    postnatally, with milder ventriculomegaly and no lethal fetal course.
  evidence:
  - reference: PMID:36588759
    reference_title: "Pre- and Postnatal Characterization of Autosomal Recessive KIDINS220-Associated Ventriculomegaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous loss-of-function variants in the last 2 exons of KIDINS220 have been associated with spastic paraplegia, intellectual disability, nystagmus, and obesity (SINO)."
    explanation: Distinguishes the dominant allelic disorder by variant position.
  - reference: PMID:39296002
    reference_title: "Novel autosomal recessive SINO syndrome-associated KIDINS220 variants provide insight into the genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with AR-SINO exhibit more severe clinical features compared to those with AD-SINO."
    explanation: Recessive SINO is a second biallelic presentation.
animal_models:
- name: Kidins220 constitutive knockout mouse
  species: Mouse
  species_term:
    preferred_term: Mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  genotype: Kidins220-/- (constitutive knockout)
  publication: PMID:22048155
  description: >-
    Homozygous knockout embryos die late in gestation with widespread neuronal
    death, reduced neurotrophin responsiveness and cardiovascular defects.
  modeled_mechanisms:
  - target: Developmental Neuronal Apoptosis
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Extensive apoptosis in the central and peripheral nervous systems.
    limitations: >-
      Human fetal autopsy showed reduced brain mass but no histomorphological
      abnormalities, so neuronal death has not been shown in the human
      disease.
    evidence:
    - reference: PMID:22048155
      reference_title: "Kidins220/ARMS mediates the integration of the neurotrophin and VEGF pathways in the vascular and nervous systems."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Kidins220(-/-) embryos die at late stages of gestation, and show extensive cell death in the central and peripheral nervous systems."
      explanation: Neuronal death in the knockout mouse.
  - target: Defective Cardiac Outflow Tract and Ventricular Wall Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Outflow tract and ventricular wall defects in knockout embryos.
    limitations: >-
      Human cardiac findings are reported only as unspecified cardiac
      anomalies in one family.
    evidence:
    - reference: PMID:22048169
      reference_title: "Kidins220/ARMS is an essential modulator of cardiovascular and nervous system development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Kidins220 is important for heart development, as shown by the severe defects in the outflow tract and ventricle wall formation displayed by the Kidins220 mutant mice."
      explanation: Cardiac defects in the knockout mouse.
- name: Kidins220 hypomorphic floxed mouse
  species: Mouse
  species_term:
    preferred_term: Mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  genotype: Kidins220 f/f (hypomorphic floxed allele)
  publication: PMID:34002021
  description: >-
    Homozygous floxed mice have reduced Kidins220 levels, ventriculomegaly of
    variable severity, loss of ependymal AQP4 and increased lethality at
    weaning.
  modeled_mechanisms:
  - target: Brain Water Dyshomeostasis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Ventriculomegaly with water dyshomeostasis and ependymal AQP4 loss.
    limitations: >-
      Partial, not complete, loss of Kidins220, studied in young adult mice
      rather than fetuses; limb contractures are not reported.
    evidence:
    - reference: PMID:34002021
      reference_title: "Kidins220 deficiency causes ventriculomegaly via SNX27-retromer-dependent AQP4 degradation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We also find that Kidins220 deficient mice develop ventriculomegaly accompanied by water dyshomeostasis and loss of AQP4 in the brain ventricular ependymal layer and astrocytes."
      explanation: The model shows the ventricular water-handling defect.
discussions:
- discussion_id: venarg_contracture_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What causes the limb contractures in VENARG: reduced fetal movement from
    central or peripheral nervous system involvement, a primary muscle or joint
    defect, or something else?
  attaches_to:
  - phenotypes#Arthrogryposis multiplex congenita
  - pathophysiology#Developmental Neuronal Apoptosis
  rationale: >-
    Arthrogryposis is a defining feature, but none of the sources cited here
    studies its mechanism. The knockout mouse shows sensory ganglion death,
    which could reduce fetal movement, but contractures have not been
    reported in the mouse models, and human fetal autopsy found no
    histological abnormality.
- discussion_id: venarg_neuronal_death_mouse_vs_human
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Kidins220 knockout mouse embryos show widespread neuronal apoptosis, but
    autopsy of affected human fetuses found reduced brain mass without
    histological abnormality. Does neuronal death contribute to the human
    disease, or is the ventriculomegaly driven by CSF and water handling?
  attaches_to:
  - pathophysiology#Developmental Neuronal Apoptosis
  - pathophysiology#Brain Water Dyshomeostasis
  rationale: >-
    The AQP4 route is supported in an adult hypomorphic mouse and in adult
    hydrocephalus tissue, and a forebrain knockout enlarges the ventricles
    without cell death, whereas the full knockout shows massive apoptosis.
    No VENARG fetal tissue has been examined for AQP4 or for apoptosis.
  evidence:
  - reference: PMID:33205811
    reference_title: "TrkA mediates effect of novel KIDINS220 mutation in human brain ventriculomegaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fetal brain imaging and autopsy showed major ventriculomegaly, reduced brain mass, and with no histomorphologic abnormalities."
    explanation: No histological abnormality was found in affected human fetal brain.
  - reference: PMID:35140204
    reference_title: "Kidins220/ARMS modulates brain morphology and anxiety-like traits in adult mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Kidins220 cKO brains are characterized by enlarged ventricles in the absence of cell death, and by deficient dendritic arborization in several cortical regions."
    explanation: Ventricular enlargement can occur without cell death in the mouse.
notes: >-
  No GeneReviews chapter covers this disorder (just check-genereviews:
  NO_CHAPTER for the name and the synonym VENARG). No disease-specific
  treatment is described in the sources cited. The name follows the MONDO
  and OMIM (619501) title; no established KIDINS220-related name exists for
  the recessive disorder, as the literature uses "KIDINS220-related" for SINO
  syndrome.

name: Ventriculomegaly and Arthrogryposis
creation_date: "2026-11-16T12:00:00Z"
category: Mendelian
parents:
- Arthrogryposis Multiplex Congenita
- Congenital Hydrocephalus
synonyms:
- VENARG
- Autosomal recessive KIDINS220-associated ventriculomegaly
description: >-
  Autosomal recessive, usually prenatally lethal disorder caused by biallelic
  loss-of-function variants in KIDINS220, which encodes a transmembrane
  scaffold for neurotrophin (Trk) and VEGF receptor signalling. Fetuses show
  severe cerebral ventriculomegaly and limb contractures from the second
  trimester or earlier, sometimes with cerebellar and cardiac anomalies and
  hydrops; one family reported recurrent pregnancy loss. One liveborn child with
  biallelic variants had profound developmental delay and spasticity. It is
  distinct from autosomal dominant SINO syndrome, caused by heterozygous
  C-terminal KIDINS220 truncations that escape nonsense-mediated decay.
disease_term:
  preferred_term: ventriculomegaly and arthrogryposis
  term:
    id: MONDO:0859184
    label: ventriculomegaly and arthrogryposis
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected fetuses in consanguineous families are homozygous for KIDINS220
    variants, with segregation in the family members tested. Heterozygous
    carrier parents are healthy, consistent with the general tolerance of
    heterozygous KIDINS220 loss-of-function variants.
  evidence:
  - reference: PMID:28934391
    reference_title: "Homozygous KIDINS220 loss-of-function variants in fetuses with cerebral ventriculomegaly and limb contractures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing of the variant in available family members showed complete segregation with the affection status, resulting in a LOD score of 2.5 under an autozygous inheritance model."
    explanation: Segregation of a homozygous variant under a recessive (autozygous) model in the first family.
  - reference: PMID:39296002
    reference_title: "Novel autosomal recessive SINO syndrome-associated KIDINS220 variants provide insight into the genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our analysis revealed that biallelic loss-of-function variants in KIDINS220 are associated with VENARG or autosomal recessive SINO (AR-SINO), whereas carboxy-terminal truncated variants that escape nonsense-mediated mRNA decay and lack amino acid residues 1507-1529 are linked to autosomal dominant SINO (AD-SINO)."
    explanation: Literature review placing VENARG among the biallelic loss-of-function KIDINS220 disorders.
pathophysiology:
- name: KIDINS220 Biallelic Loss of Function
  biological_scale: MOLECULAR
  description: >-
    In the fetal families, biallelic KIDINS220 frameshift variants lie upstream
    of the last exons and are predicted to trigger nonsense-mediated decay and
    loss of the protein (not measured); one family instead carries an in-frame
    three-residue deletion next to the fourth transmembrane domain that reduces
    binding to the TrkA receptor. The variants in the liveborn case are not
    described in the cached abstract. KIDINS220 is a membrane-anchored
    scaffold for Trk and p75 neurotrophin receptors, VEGFR2 and other receptors.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: KIDINS220
    term:
      id: hgnc:29508
      label: KIDINS220
  molecular_functions:
  - preferred_term: neurotrophin receptor binding
    modifier: DECREASED
    term:
      id: GO:0005165
      label: neurotrophin receptor binding
  evidence:
  - reference: PMID:28934391
    reference_title: "Homozygous KIDINS220 loss-of-function variants in fetuses with cerebral ventriculomegaly and limb contractures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Premature termination codons in this position are likely to cause activation of nonsense-mediated mRNA decay and result in complete absence of KIDINS220 protein in individuals homozygous for the variant."
    explanation: >-
      The patient transcript studies show an out-of-frame product; absence of
      protein is inferred from the position of the premature stop codon, not
      measured.
  - reference: PMID:33205811
    reference_title: "TrkA mediates effect of novel KIDINS220 mutation in human brain ventriculomegaly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that the binding of KIDINS220 to TrkA is diminished by the deletion mutation."
    explanation: Functional effect of the in-frame deletion allele on TrkA binding.
  downstream:
  - target: Impaired Neurotrophin Receptor Signaling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33205811
      reference_title: "TrkA mediates effect of novel KIDINS220 mutation in human brain ventriculomegaly."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We demonstrate that the binding of KIDINS220 to TrkA is diminished by the deletion mutation."
      explanation: The patient allele weakens the KIDINS220-TrkA interaction.
  - target: SNX27-Retromer Downregulation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34002021
      reference_title: "Kidins220 deficiency causes ventriculomegaly via SNX27-retromer-dependent AQP4 degradation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mechanistically, we show that AQP4 is a novel cargo of the SNX27-retromer and that Kidins220 deficiency promotes a striking and unexpected downregulation of the SNX27-retromer that results in AQP4 lysosomal degradation."
      explanation: >-
        Kidins220 deficiency lowers SNX27-retromer levels, shown in hypomorphic
        mice and their astrocytes; the deficiency is partial, not the complete
        loss expected in VENARG.
  - target: Impaired VEGF Receptor Signaling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22048155
      reference_title: "Kidins220/ARMS mediates the integration of the neurotrophin and VEGF pathways in the vascular and nervous systems."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "In support of this hypothesis, we demonstrate that Kidins220 constitutively interacts with VEGFR2."
      explanation: >-
        KIDINS220 binds VEGFR2, so its loss is expected to affect VEGFR2
        signalling; reduced signalling itself was not measured.
- name: Impaired Neurotrophin Receptor Signaling
  biological_scale: CELLULAR
  description: >-
    Without KIDINS220, neurons respond poorly to neurotrophins: BDNF-induced
    MAPK activation, neurite outgrowth and synaptic potentiation are reduced.
    TrkA has been proposed as the mediator of the human phenotype.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neurotrophin TRK receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0048011
      label: neurotrophin TRK receptor signaling pathway
  evidence:
  - reference: PMID:22048155
    reference_title: "Kidins220/ARMS mediates the integration of the neurotrophin and VEGF pathways in the vascular and nervous systems."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Primary neurons from Kidins220(-/-) mice exhibit reduced responsiveness to brain-derived neurotrophic factor, in terms of activation of mitogen-activated protein kinase signaling, neurite outgrowth and potentiation of excitatory postsynaptic currents."
    explanation: Cultured knockout neurons show reduced neurotrophin signalling.
  - reference: PMID:33205811
    reference_title: "TrkA mediates effect of novel KIDINS220 mutation in human brain ventriculomegaly."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "This family is the second that associates a KIDINS220 genetic variant with human ventriculomegaly and limb contractures, validating causality of the gene and indicating TrkA as a likely mediator of the phenotype."
    explanation: The authors infer from the TrkA-binding defect that TrkA signalling mediates the human phenotype.
  downstream:
  - target: Developmental Neuronal Apoptosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:22048169
      reference_title: "Kidins220/ARMS is an essential modulator of cardiovascular and nervous system development."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "These data further confirm the importance of Kidins220 in mediating the survival of sensory neurons during embryonic development, which is likely to occur through neurotrophin receptor signaling."
      explanation: The authors attribute sensory neuron loss in knockout embryos to failed neurotrophin receptor signalling, as a likely rather than demonstrated route.
  - target: Impaired Dendritic Arborization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:22699907
      reference_title: "Ankyrin repeat-rich membrane spanning protein (kidins220) is required for neurotrophin and ephrin receptor-dependent dendrite development."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Overexpression of cell surface receptor tyrosine kinases, including TrkB and EphB2, in ARMS/Kidins220-deficient neurons can partially rescue the defective dendritic phenotype."
      explanation: Restoring receptor tyrosine kinase levels partially rescues the dendritic defect, linking it to receptor signalling.
- name: Developmental Neuronal Apoptosis
  biological_scale: CELLULAR
  description: >-
    Kidins220 knockout mouse embryos show widespread apoptosis in the central
    nervous system and in sensory ganglia from mid-gestation. Autopsy of
    affected human fetuses did not show histological abnormalities, so the
    relevance of this step to the human disease is unconfirmed.

      explanation: >-
        Identifies respiratory infection as the dominant infectious consequence.
  - target: Immune Dysregulation and Autoimmunity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Increased translocation of dietary and microbial antigens across a poorly
      excluded mucosa is a proposed route from the IgA defect to the celiac and

name: Selective IgA Deficiency
creation_date: "2026-08-29T00:00:00Z"
category: Complex
synonyms:
- SIgAD
- IgAD
- selective IgA immunodeficiency
- immunoglobulin A deficiency
disease_term:
  preferred_term: Selective IgA Deficiency
  term:
    id: MONDO:0001341
    label: selective IgA deficiency disease
parents:
- Primary Immunodeficiency
- Antibody Deficiency Disorder
description: >-
  Selective IgA deficiency (SIgAD) is defined as a serum IgA below 7 mg/dL
  (0.07 g/L) with normal serum IgG and IgM in an individual older than four
  years, other causes of hypogammaglobulinemia having been excluded. The
  four-year threshold avoids diagnosing the physiological delay in IgA ontogeny
  seen in younger children. SIgAD is the most common primary antibody
  deficiency, with a prevalence of roughly 1:600 in populations of European
  ancestry; the frequency is strongly ancestry-dependent and is one to two
  orders of magnitude lower in East Asian populations. The great majority of
  affected individuals — on the order of 85-90% — are asymptomatic and are
  identified incidentally, for example during blood donation or celiac
  serology. Symptomatic patients present with recurrent sinopulmonary and
  gastrointestinal infections, and the diagnosis carries strong associations
  with celiac disease, other autoimmune conditions, atopy, and — in the subset
  who develop anti-IgA antibodies — anaphylactic reactions to IgA-containing
  blood products. A minority of patients, particularly those with concomitant
  IgG subclass deficiency or autoimmunity, progress to common variable
  immunodeficiency, and SIgAD and CVID are widely regarded as lying on a single
  disease spectrum. SCOPE: there is no single causal gene. SIgAD is a
  genetically complex, usually sporadic condition whose largest genetic risk
  factor is the HLA region, with additional common non-HLA risk alleles and
  heterozygous TNFRSF13B (TACI) variants that act as disease-modifying rather
  than disease-causing.

progression:
- phase: Progression to common variable immunodeficiency
  notes: >-
    A minority of patients with SIgAD later lose IgG as well and are
    reclassified as CVID. Risk is concentrated in symptomatic patients,
    particularly those with an associated IgG subclass deficiency or autoimmune
    features, which is the basis for recommending long-term immunological
    follow-up rather than one-off diagnosis. The shared familial occurrence and
    the shared B-cell defect are the usual arguments for treating SIgAD and
    CVID as points on one spectrum.
  evidence:
  - reference: PMID:18520152
    reference_title: "Progression of selective IgA deficiency to common variable immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we present 4 patients with IgAD and autoimmune features who
      subsequently developed CVID.
    explanation: >-
      Documents observed conversion from IgAD to CVID in patients with
      autoimmune features.
  - reference: PMID:18520152
    reference_title: "Progression of selective IgA deficiency to common variable immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All symptomatic IgAD patients, especially those with associated IgG
      subclass deficiency or autoimmune features, should be monitored for
      evolution to CVID.
    explanation: >-
      Identifies the subgroup at risk of progression and supports the
      surveillance recommendation captured in the notes.
  - reference: PMID:20101521
    reference_title: Selective IgA deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, it is also known that IgA deficiency may progress into CVID,
      which has a less favorable outcome.
    explanation: >-
      Review confirms progression to CVID as a recognised, prognostically
      adverse outcome.
pathophysiology:
- name: Failure of Terminal B Cell Differentiation to IgA-Secreting Plasma Cells
  biological_scale: CELLULAR
  description: >-
    The core defect in SIgAD is a maturation arrest at the last step of the IgA
    lineage. B cell numbers are normal and IgA-committed B cells are present and
    surface-IgA positive, but they retain an immature phenotype co-expressing
    IgM and IgD and do not complete terminal differentiation into IgA-secreting
    plasma cells. The block is intrinsic enough to be transferred with
    hematopoietic stem cells. Whether it reflects a B-cell-intrinsic defect, a
    T-helper or cytokine-environment defect, or several of these in different
    patients, is unresolved; IL-21 can restore IgA production from these B cells
    ex vivo, which places the block downstream of an inducible signal rather
    than at an irreversible lesion.
  cell_types:
  - preferred_term: IgA-committed B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: IgA plasma cell
    term:
      id: CL:0000987
      label: IgA plasma cell
  biological_processes:
  - preferred_term: plasma cell differentiation
    term:
      id: GO:0002317
      label: plasma cell differentiation
    modifier: DECREASED
  - preferred_term: isotype switching to IgA isotypes
    term:
      id: GO:0048290
      label: isotype switching to IgA isotypes
    modifier: DECREASED
  evidence:
  - reference: PMID:20101521
    reference_title: Selective IgA deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In IgA deficiency, B cells express IgA; however, they are of immature
      phenotype with the coexpression of IgM and IgD, and they cannot fully
      develop into IgA-secreting plasma cells
    explanation: >-
      States the maturation-arrest mechanism precisely: IgA-expressing B cells
      are present but cannot complete differentiation into plasma cells.
  - reference: PMID:27723758
    reference_title: "Common variants at PVT1, ATG13-AMBRA1, AHI1 and CLEC16A are associated with selective IgA deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In IgAD, B cells fail to terminally differentiate into IgA+ plasma cells
    explanation: >-
      Independent statement of the same terminal-differentiation block.
  - reference: PMID:27763681
    reference_title: "Selective IgA Deficiency: Epidemiology, Pathogenesis, Clinical Phenotype, Diagnosis, Prognosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenesis of SIgAD is still unknown; however, a defective terminal
      differentiation of B cells and defect in switching to IgA-producing plasma
      cells are presumed to be responsible.
    explanation: >-
      Review supports the differentiation/class-switch block while making clear
      that the upstream cause remains unknown.
  - reference: PMID:20101521
    reference_title: Selective IgA deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The defect appears to involve the stem cells since IgA deficiency can be
      transferred by bone marrow transplantation
    explanation: >-
      Transferability with hematopoietic stem cells supports a hematopoietic,
      B-lineage-intrinsic rather than a stromal or systemic cause.
  downstream:
  - target: Absent Serum and Secretory IgA
    causal_link_type: DIRECT
    description: >-
      Failure to generate IgA-secreting plasma cells removes the source of both
      circulating monomeric IgA and locally produced dimeric secretory IgA.
    evidence:
    - reference: PMID:27723758
      reference_title: "Common variants at PVT1, ATG13-AMBRA1, AHI1 and CLEC16A are associated with selective IgA deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        IgAD is the most common primary immunodeficiency and is defined by serum
        IgA level <0.07 g/L.
      explanation: >-
        Ties the plasma-cell differentiation block described in this node to the
        defining biochemical outcome, an essentially absent serum IgA.
- name: Intact Immunoglobulin Heavy Chain Alpha Loci
  biological_scale: MOLECULAR
  description: >-
    The constant-region alpha-1 and alpha-2 heavy chain genes on chromosome 14
    are structurally normal in the great majority of patients. Deletions of the
    heavy chain constant-region cluster do exist but are rare and are a
    separate IUIS entity; where they occur, the associated deficiencies extend
    beyond IgA to IgG2, IgG4 and IgE. This node exists to record a negative
    that constrains the mechanism: SIgAD is a regulatory/differentiation
    failure, not a structural loss of the genes encoding IgA, which is why no
    single causal gene is curated for this disease.
  molecular_functions:
  - preferred_term: immunoglobulin receptor binding
    term:
      id: GO:0034987
      label: immunoglobulin receptor binding
  evidence:
  - reference: PMID:20101521
    reference_title: Selective IgA deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The constant α1 and α2 genes are generally normal except for rarely
      described cases of heavy chain gene deletions involving various segments
      on chromosome 14
    explanation: >-
      Establishes that the IgA heavy-chain constant-region loci are intact in
      typical SIgAD, excluding a structural gene defect as the general
      mechanism.
  downstream:
  - target: Failure of Terminal B Cell Differentiation to IgA-Secreting Plasma Cells
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      With the alpha constant-region genes intact, the deficiency must arise at
      the level of IgA-lineage differentiation and class-switch regulation
      rather than from absence of the structural genes.
    evidence:
    - reference: PMID:27763681
      reference_title: "Selective IgA Deficiency: Epidemiology, Pathogenesis, Clinical Phenotype, Diagnosis, Prognosis and Management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pathogenesis of SIgAD is still unknown; however, a defective terminal
        differentiation of B cells and defect in switching to IgA-producing
        plasma cells are presumed to be responsible.
      explanation: >-
        Locates the presumed defect at differentiation and switching, consistent
        with structurally normal IgA loci.
- name: Absent Serum and Secretory IgA
  biological_scale: ORGANISM
  description: >-
    Serum IgA falls below 7 mg/dL (0.07 g/L) with normal IgG and IgM, and the
    dimeric secretory IgA normally transported across mucosal epithelium by the
    polymeric immunoglobulin receptor is correspondingly reduced. Serum IgA is
    what is measured clinically; secretory IgA is not, and residual mucosal IgA
    in some patients is one of the proposed explanations for the asymptomatic
    majority. A compensatory increase in secretory IgM is seen in most, but not
    all, IgA-deficient individuals.
  biological_processes:
  - preferred_term: immunoglobulin production in mucosal tissue
    term:
      id: GO:0002426
      label: immunoglobulin production in mucosal tissue
    modifier: DECREASED
  - preferred_term: polymeric immunoglobulin receptor-mediated transcytosis of secretory IgA
    term:
      id: GO:0002415
      label: immunoglobulin transcytosis in epithelial cells mediated by polymeric immunoglobulin receptor
    modifier: DECREASED
  cell_types:
  - preferred_term: mucosal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  evidence:
  - reference: PMID:20101521
    reference_title: Selective IgA deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In general, serum IgA level of less than 7 mg/dL (0.07 g/L) is considered
      as selective IgA deficiency since this concentration is the lowest
      detectable limit established by most of the laboratories.
    explanation: >-
      Gives the biochemical threshold that defines this node.
  - reference: PMID:20101521
    reference_title: Selective IgA deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in most IgA-deficient patients, seemingly as a compensatory mechanism,
      production of secretory IgM is increased
    explanation: >-
      Documents the compensatory secretory-IgM response that partly offsets the
      loss of secretory IgA.
  downstream:
  - target: Impaired Mucosal Immune Exclusion
    causal_link_type: DIRECT
    description: >-
      Secretory IgA is the effector that coats commensal and pathogenic bacteria
      at mucosal surfaces; without it, immune exclusion is degraded.
    evidence:
    - reference: PMID:20101521
      reference_title: Selective IgA deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Bacteria endogenous to the intestinal tract, oral cavity, and
        respiratory and genital tracts are coated with secretory IgA. As a
        result, the epithelial adherence and penetration of bacteria are
        limited, and the bacteria are confined to the mucosal surfaces
      explanation: >-
        Describes the immune-exclusion function that is lost when secretory IgA
        is absent.
  - target: Anti-IgA Alloimmunization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Because IgA is effectively absent, exogenous IgA in transfused blood
      products is seen as a foreign antigen and can elicit anti-IgA antibodies.
    evidence:
    - reference: PMID:20101521
      reference_title: Selective IgA deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        IgA-deficient patients may develop anti-IgA antibodies which have a
        potential to cause anaphylactic reactions upon transfusion of any blood
        product, such as red blood cells or platelets, which contains trace
        amounts of IgA
      explanation: >-
        Directly links the absence of IgA to anti-IgA antibody formation and
        transfusion reactions.
- name: Impaired Mucosal Immune Exclusion
  biological_scale: TISSUE
  description: >-
    Loss of secretory IgA at respiratory and gastrointestinal surfaces permits
    increased epithelial adherence and penetration by bacteria and protozoa, and
    increased translocation of intact macromolecules across the mucosal barrier.
    Both consequences matter: the first drives the infectious phenotype, the
    second is a plausible route by which food and microbial antigens reach the
    submucosal immune system in quantity.
  biological_processes:
  - preferred_term: mucosal immune response
    term:
      id: GO:0002385
      label: mucosal immune response
    modifier: DECREASED
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
    modifier: DECREASED
  cell_types:
  - preferred_term: intestinal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  evidence:
  - reference: PMID:20101521
    reference_title: Selective IgA deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since the protective barrier of the gastrointestinal system is impaired in
      IgA deficiency, protozoa such as Giardia lamblia can adhere to the
      epithelium, proliferate, and cause infection
    explanation: >-
      Concrete instance of failed mucosal exclusion in the gut.
  - reference: PMID:20101521
    reference_title: Selective IgA deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Even in the absence of infection, some molecules may enter the
      subepidermal and submucosal tissue because of the impaired mucosal
      clearance of macromolecules and proteins.
    explanation: >-
      Supports the second, non-infectious consequence of failed exclusion:
      increased antigen translocation across the mucosa.
  downstream:
  - target: Recurrent Sinopulmonary Infections
    causal_link_type: DIRECT
    description: >-
      Reduced mucosal antibody at the respiratory epithelium underlies the
      recurrent bacterial sinopulmonary infections seen in symptomatic patients.

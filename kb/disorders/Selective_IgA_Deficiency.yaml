inheritance:
- name: Polygenic inheritance
  description: >-
    SIgAD does not follow a Mendelian pattern. Familial clustering occurs, but
    inheritance is complex: the dominant genetic risk factor is the HLA region
    (principally the HLA-B*0801-DRB1*0301-DQB1*02 8.1 haplotype and the
    DRB1*0701-DQB1*02 haplotype), with additional common non-HLA risk alleles
    at IFIH1, PVT1, ATG13-AMBRA1, AHI1 and CLEC16A, and heterozygous
    TNFRSF13B variants acting as modifiers.
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  evidence:
  - reference: PMID:22291608
    reference_title: "High-density SNP mapping of the HLA region identifies multiple independent susceptibility loci associated with selective IgA deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The polygenic nature of IgAD is underscored by the recent identification
      of several new risk genes in a genome-wide association study.
    explanation: >-
      States directly that IgAD is polygenic rather than Mendelian.
  - reference: PMID:27723758
    reference_title: "Common variants at PVT1, ATG13-AMBRA1, AHI1 and CLEC16A are associated with selective IgA deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data suggest that a complex network of genetic effects, including
      genes known to influence the biology of IgA production, contributes to
      IgAD.
    explanation: >-
      The GWAS meta-analysis concludes that a complex, multi-locus genetic
      architecture underlies IgAD.

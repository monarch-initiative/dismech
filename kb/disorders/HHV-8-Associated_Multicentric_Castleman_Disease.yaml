description: >-
  HHV-8-associated multicentric Castleman disease is the form of Castleman
  disease with a known cause: uncontrolled lytic replication of Kaposi
  sarcoma-associated herpesvirus (KSHV/HHV-8) in lymph node plasmablasts. The
  virus encodes a viral homolog of interleukin-6 (vIL-6) that engages gp130
  directly, without needing the IL-6 receptor, so it bypasses the checkpoint
  that normally limits IL-6 signaling. Most cases occur in people living with
  HIV, though the disease also occurs in HIV-negative immunocompromised
  individuals. The course is remitting-relapsing, running as discrete attacks of
  lytic viral activity with intervening remission, and constitutional symptoms
  and splenomegaly are substantially more frequent than in idiopathic
  multicentric disease (98.6% versus 46.6%, and 89.2% versus 48.2%). Because the
  same uncontrolled infection also drives Kaposi sarcoma and KSHV-associated
  lymphoma, those malignancies frequently co-occur. First-line therapy is
  rituximab, which depletes the CD20-positive B cells harboring the virus and
  raised 5-year survival from 33% to 90%; antiretroviral therapy is given
  alongside for the underlying HIV infection.
pathophysiology:
- name: HHV-8/KSHV Viral Pathogenesis
  description: >-
    In HHV-8+ MCD, lytic replication of Kaposi sarcoma-associated
    herpesvirus in plasmablasts produces viral IL-6 (vIL-6) and other
    inflammatory mediators. vIL-6 signals through gp130 independently of
    the IL-6 receptor, bypassing normal regulatory checkpoints. The disease
    course is characterized by recurrent flares of lytic viral activity.
    In contrast, Viral-Track analysis of UCD (n=22) and iMCD (n=19) found
    no shared viral signature, indicating that active viral infection is
    not a driver of the HHV-8-negative subtypes.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: KSHV-infected plasmablast
    term:
      id: CL:0000980
      label: plasmablast
  biological_processes:
  - preferred_term: Viral process
    term:
      id: GO:0016032
      label: viral process
  - preferred_term: Lytic viral genome replication
    term:
      id: GO:0019079
      label: viral genome replication
    modifier: INCREASED
  evidence:
  - reference: DOI:10.1038/s41598-025-85193-x
    reference_title: "No evidence for active viral infection in unicentric and idiopathic multicentric Castleman disease by Viral-Track analysis"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "While uncontrolled infection with human herpesvirus-8 (HHV-8) is responsible for the cytokine storm in a portion of multicentric CD (HHV-8-associated MCD) cases, the etiology of unicentric CD (UCD) and HHV-8-negative/idiopathic MCD (iMCD) is unknown."
    explanation: Confirms HHV-8 as the etiologic driver of HHV8+ MCD specifically, while UCD and iMCD remain etiologically unexplained.
  - reference: DOI:10.1038/s41598-025-85193-x
    reference_title: "No evidence for active viral infection in unicentric and idiopathic multicentric Castleman disease by Viral-Track analysis"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "These results suggest that active viral infection is unlikely to be a pathological driver of UCD or iMCD."
    explanation: Viral-Track RNA-seq analysis rules out a shared viral driver of UCD and iMCD, supporting the distinction between HHV8+ MCD and the HHV-8-negative subtypes.
  - reference: PMID:21487108
    reference_title: "High-dose zidovudine plus valganciclovir for Kaposi sarcoma herpesvirus-associated multicentric Castleman disease: a pilot study of virus-activated cytotoxic therapy."
    supports: SUPPORT

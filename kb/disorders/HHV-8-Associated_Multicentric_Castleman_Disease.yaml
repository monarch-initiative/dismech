histopathology:
- name: Angiofollicular Lymph Node Hyperplasia, Plasma-Cell Variant
  description: >-
    Plasma-cell histologic variant predominates in MCD. Features
    hyperplastic germinal centers, sheets of mature plasma cells in the
    interfollicular zone, and increased interfollicular vascularity.
    Mantle-zone onion-skinning is less prominent than in the
    hyaline-vascular variant. This is the pattern associated with iMCD-IPL and
    with polyclonal hypergammaglobulinemia.
  context: MCD
- name: Mixed Histopathologic Variant
  description: >-
    Nodes carrying features of both the hyaline-vascular and plasma-cell
    patterns. In the ACCELERATE registry the histopathologic distribution across
    102 adjudicated iMCD cases was hypervascular/hyaline vascular 61.8%, mixed
    26.5%, and plasmacytic 6.9%; TAFRO cases were predominantly
    hypervascular and none were plasmacytic. The clinical significance of the
    histopathologic subtype is not established.
  context: MCD
  evidence:
  - reference: PMID:36433996
    reference_title: CXCL13 is a predictive biomarker in idiopathic multicentric Castleman disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients are also classified according to histopathologic subtype, including hyaline vascular/hypervascular, plasmacytic, or mixed, though the clinical implications of defining histopathologic subtype is unclear."
    explanation: >-
      States both the three-way histopathologic classification and that its
      clinical meaning is unresolved.
imaging_findings:
- name: FDG-Avid Multicentric Lymphadenopathy
  modality: PET
  description: >-
    FDG-PET/CT demonstrates avid lymphadenopathy in multiple nodal stations in
    MCD and is used both to establish multicentricity and to select the node to
    biopsy. Uptake is typically moderate, and marked focal uptake in a single
    node raises concern for lymphomatous transformation rather than Castleman
    disease itself.
  diagnostic: true
biochemical:
- name: Interleukin-6 (IL-6)
  presence: Elevated
  context: >-
    Both viral IL-6 and human IL-6 are elevated during an attack, and human IL-6
    falls significantly when lytic viral replication is suppressed. Routine
    clinical IL-6 assays do not distinguish the viral homolog from the host
    cytokine, so a measured "IL-6" here is a composite of the two.
  evidence:
  - reference: PMID:21487108
    reference_title: "High-dose zidovudine plus valganciclovir for Kaposi sarcoma herpesvirus-associated multicentric Castleman disease: a pilot study of virus-activated cytotoxic therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the time of best response, the patients showed significant improvements in C-reactive protein, albumin, platelets, human IL-6, IL-10, and KSHV viral load."
    explanation: >-
      Shows human IL-6 is elevated and falls with lytic-directed therapy, tying
      the cytokine to viral replication in this subtype.
- name: C-Reactive Protein (CRP)
  presence: Elevated
  context: >-
    Acute-phase reactant driven by IL-6 and vIL-6 signaling. Rises during an
    attack and falls with effective antiviral or anti-CD20 therapy, so it is the
    routine bedside marker of attack activity alongside plasma KSHV viral load.
- name: KSHV/HHV-8 Viral Load
  presence: Elevated
  context: >-
    Plasma KSHV viral load rises during HHV-8+ MCD flares and falls with
    effective therapy, making it a disease-activity marker specific to this
    subtype. Lytic-gene-directed therapy with high-dose zidovudine plus
    valganciclovir produced significant improvements in CRP, albumin, platelets,
    human IL-6, IL-10, and KSHV viral load at best response.
  evidence:
  - reference: PMID:21487108
    reference_title: "High-dose zidovudine plus valganciclovir for Kaposi sarcoma herpesvirus-associated multicentric Castleman disease: a pilot study of virus-activated cytotoxic therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the time of best response, the patients showed significant improvements in C-reactive protein, albumin, platelets, human IL-6, IL-10, and KSHV viral load."
    explanation: Establishes KSHV viral load as a treatment-responsive disease-activity marker.
progression:
- phase: Remitting-relapsing flares (HHV-8+ MCD)
  notes: >-
    HHV-8+ MCD runs as discrete attacks of lytic viral activity with intervening
    remission. Relapse after rituximab-induced remission occurred in 8 of 46
    patients at a median of 2 years, and all were successfully re-treated.
  evidence:
  - reference: PMID:21555697
    reference_title: "Clinical Features and Outcome in HIV-Associated Multicentric Castleman's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eight of 46 patients who achieved clinical remission suffered symptomatic, histologically confirmed MCD relapse. The median time to relapse was 2 years, and all have been successfully re-treated and are alive in remission."
    explanation: Quantifies the relapse rate and its treatability in this subtype.
diagnosis:
- name: Excisional lymph node biopsy
  description: >-
    Diagnosis requires characteristic lymph node histopathology; there is no
    diagnostic serum biomarker. Excisional biopsy is preferred over core or fine
    needle sampling because architectural features - regressed or hyperplastic
    germinal centers, mantle-zone onion-skinning, penetrating vessels,
    interfollicular plasmacytosis - cannot be assessed on a fragment. Histology
    alone is not sufficient: reactive Castleman-like changes occur in
    autoimmune disease, lymphoma, and infection, so the findings must be
    combined with clinical and laboratory data.
  diagnosis_term:
    preferred_term: lymph node biopsy
    term:
      id: NCIT:C51900
      label: Lymph Node Biopsy
  results: >-
    Angiofollicular lymph node hyperplasia of hyaline-vascular, plasma-cell, or
    mixed type.
  evidence:
  - reference: DOI:10.1002/art.43269
    reference_title: "Expert Perspective: Diagnosis and Treatment of Castleman Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with autoimmune disease, lymphoma, and infections can experience Castleman‐like changes in reactive lymph nodes, and thus histologic findings must be combined with clinical and laboratory findings to accurately diagnose iMCD."
    explanation: States directly why histology alone cannot establish the diagnosis.
- name: HHV-8 LANA-1 immunohistochemistry
  description: >-
    Immunohistochemistry for the HHV-8 latency-associated nuclear antigen on the
    lymph node biopsy is the step that separates HHV-8-associated MCD from iMCD.
    This is not optional - iMCD is defined by HHV-8 negativity, and the two
    subtypes have different first-line therapy (rituximab versus siltuximab).
    HIV serology is performed alongside, since most HHV-8+ MCD occurs in HIV
    co-infection.
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  results: >-
    LANA-1-positive plasmablasts establish HHV-8-associated MCD; negativity is
    required for a diagnosis of iMCD.
  evidence:
  - reference: DOI:10.1002/art.43269
    reference_title: "Expert Perspective: Diagnosis and Treatment of Castleman Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MCD can be associated with excessive cytokine production due to a plasma cell neoplasm (MCD–polyneuropathy, organomegaly, endocrinopathy, monoclonal paraprotein, skin changes) or uncontrolled human herpesvirus‐8 infection (HHV‐8) (HHV‐8–positive MCD), but more than half of cases are idiopathic."
    explanation: Establishes HHV-8 status as the etiologic branch point among MCD subtypes.
- name: Cross-sectional and FDG-PET imaging
  description: >-
    CT of the neck, chest, abdomen, and pelvis, or FDG-PET/CT, establishes
    whether disease is unicentric or multicentric - the single most consequential
    branch point in management, since unicentric disease is surgically curable.
    Imaging also selects the biopsy target and, in UCD, determines resectability.
  diagnosis_term:
    preferred_term: positron emission tomography
    term:
      id: NCIT:C17007
      label: Positron Emission Tomography
  results: >-
    A single involved nodal region indicates UCD; multiple involved regions
    indicate MCD.
  evidence:
  - reference: DOI:10.1002/art.43269
    reference_title: "Expert Perspective: Diagnosis and Treatment of Castleman Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unicentric CD (UCD) involves one enlarged lymph node region, whereas multicentric CD (MCD) involves multiple enlarged lymph node regions."
    explanation: The distinction that imaging is performed to establish.
differential_diagnoses:
- name: Lymphoma
  description: >-
    Hodgkin and non-Hodgkin lymphoma both produce lymphadenopathy with systemic
    symptoms and can generate reactive Castleman-like nodal changes; iMCD-NOS in
    particular mimics indolent lymphoma. Lymphoma is a formal exclusion in the
    iMCD diagnostic criteria. The relationship also runs the other way in
    HHV-8+ MCD, where concurrent KSHV-driven lymphoma occurs at 28 cases per
    1,000 patient-years.
  evidence:
  - reference: DOI:10.1002/art.43269
    reference_title: "Expert Perspective: Diagnosis and Treatment of Castleman Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with autoimmune disease, lymphoma, and infections can experience Castleman‐like changes in reactive lymph nodes, and thus histologic findings must be combined with clinical and laboratory findings to accurately diagnose iMCD."
    explanation: Names lymphoma among the conditions producing Castleman-like reactive nodes.
- name: Idiopathic multicentric Castleman disease
  description: >-
    The HHV-8-negative form. Clinically the two overlap heavily - both present
    with multicentric lymphadenopathy, constitutional symptoms, cytopenias and
    organ dysfunction - and the separation is made by HHV-8 LANA-1
    immunohistochemistry on the node, not by the clinical picture. Getting it
    right changes first-line therapy from rituximab to siltuximab. Constitutional
    symptoms and splenomegaly are substantially more frequent here than in iMCD;
    renal dysfunction is less frequent.
  disease_term:
    preferred_term: idiopathic multicentric Castleman disease
    term:
      id: MONDO:0035838
      label: idiopathic multicentric Castleman disease
  distinguishing_features:
  - >-
    HHV-8 LANA-1-negative lymph node immunohistochemistry; no detectable plasma
    KSHV viral load; usually no HIV co-infection.
  evidence:
  - reference: DOI:10.1182/bloodadvances.2024013548
    reference_title: "The clinical picture of Castleman disease: a systematic review and meta-analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are many similarities in the symptomatology of iMCD and HHV8+ MCD; many patients experience constitutional symptoms and organ dysfunction."
    explanation: >-
      States the clinical overlap that makes the virological test, rather than
      the presentation, the discriminator.
  - reference: DOI:10.1182/bloodadvances.2024013548
    reference_title: "The clinical picture of Castleman disease: a systematic review and meta-analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with HHV8+ MCD had significantly higher rates of constitutional symptoms (46.6% vs 98.6%; P = .038) and splenomegaly (48.2% vs 89.2%; P = .031)"
    explanation: Quantifies the two features that do differ between the subtypes.
treatments:
- name: Rituximab
  description: >-
    Anti-CD20 monoclonal antibody and the first-line therapy for this subtype.
    It depletes the CD20-positive B cells that harbor KSHV, removing the
    reservoir producing vIL-6. Introduction of rituximab-based treatment raised
    5-year overall survival in HIV-associated MCD from 33% to 90%. Relapse
    occurs in a minority at a median of two years and has been successfully
    re-treated. Two studies reported worsening of concurrent Kaposi sarcoma on
    rituximab, so co-existing KS influences the choice of regimen.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  target_mechanisms:
  - target: HHV-8/KSHV Viral Pathogenesis
    treatment_effect: INHIBITS
    description: >-
      Depletes the CD20-positive B cell compartment that harbors KSHV, removing
      the reservoir producing vIL-6.
  evidence:
  - reference: DOI:10.1182/blood.2019000931
    reference_title: "Overview of Castleman disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The advent of effective retroviral therapy and use of rituximab in HHV8-MCD have improved outcomes in HHV8-MCD."
    explanation: Authoritative Blood review establishes rituximab as outcome-improving therapy in HHV8+ MCD.
  - reference: PMID:21555697
    reference_title: "Clinical Features and Outcome in HIV-Associated Multicentric Castleman's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With rituximab-based treatment, the overall survival was 94% (95% CI, 87% to 100%) at 2 years and was 90% (95% CI, 81% to 100%) at 5 years compared with 42% (95% CI, 14% to 70%) and 33% (95% CI, 6% to 60%) in 12 patients treated before introduction of rituximab (log-rank P < .001)."
    explanation: Quantifies the survival improvement attributed to rituximab in HIV-associated MCD.
  - reference: PMID:21555697
    reference_title: "Clinical Features and Outcome in HIV-Associated Multicentric Castleman's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eight of 46 patients who achieved clinical remission suffered symptomatic, histologically confirmed MCD relapse. The median time to relapse was 2 years, and all have been successfully re-treated and are alive in remission."
    explanation: Supports the relapse rate and its treatability described here.
  treatment_term:
    preferred_term: rituximab therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
- name: High-Dose Zidovudine plus Valganciclovir
  description: >-
    Virus-activated cytotoxic therapy for KSHV-associated MCD. The KSHV lytic
    genes ORF36 and ORF21 phosphorylate ganciclovir and zidovudine to toxic
    moieties, so the drug pair is selectively activated inside lytically infected
    cells. In a 14-patient pilot, 86% attained major clinical responses with
    12-month overall survival of 86%; median progression-free survival was 6
    months and the main toxicity was hematologic.
  therapeutic_modality: SMALL_MOLECULE
  context: HHV-8+ MCD
  target_mechanisms:
  - target: HHV-8/KSHV Viral Pathogenesis
    treatment_effect: INHIBITS
    description: >-
      Exploits the lytic viral kinases to generate cytotoxic metabolites inside
      KSHV-infected plasmablasts.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: zidovudine
      term:
        id: NCIT:C947
        label: Zidovudine
    - preferred_term: valganciclovir
      term:
        id: NCIT:C2629
        label: Valganciclovir
  evidence:
  - reference: PMID:21487108
    reference_title: "High-dose zidovudine plus valganciclovir for Kaposi sarcoma herpesvirus-associated multicentric Castleman disease: a pilot study of virus-activated cytotoxic therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We investigated an approach targeting 2 KSHV lytic genes, ORF36 and ORF21, the protein of which, respectively, phosphorylate ganciclovir and zidovudine to toxic moieties."
    explanation: States the lytic-gene-activated mechanism described here.
  - reference: PMID:21487108
    reference_title: "High-dose zidovudine plus valganciclovir for Kaposi sarcoma herpesvirus-associated multicentric Castleman disease: a pilot study of virus-activated cytotoxic therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 86% of patients attained major clinical responses and 50% attained major biochemical responses."
    explanation: Gives the pilot-study response rates quoted in the description.
- name: Antiretroviral Therapy
  description: >-
    Effective antiretroviral therapy is given for the underlying HIV infection in
    HIV-associated HHV-8+ MCD and is credited alongside rituximab with the
    improvement in outcomes for this subtype. It does not by itself control an
    MCD attack.
  therapeutic_modality: SMALL_MOLECULE
  context: HHV-8+ MCD
  treatment_term:
    preferred_term: antiretroviral therapy
    term:
      id: NCIT:C94631
      label: Antiretroviral Therapy
  evidence:
  - reference: DOI:10.1182/blood.2019000931
    reference_title: "Overview of Castleman disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The advent of effective retroviral therapy and use of rituximab in HHV8-MCD have improved outcomes in HHV8-MCD."
    explanation: Attributes the outcome improvement jointly to antiretroviral therapy and rituximab.
- name: Corticosteroids
  description: >-
    Used as an adjunct alongside rituximab-based therapy for symptom control
    during an attack. Corticosteroids are not disease-modifying here: the
    disease is driven by uncontrolled lytic viral replication, which steroids do
    not address, and prolonged immunosuppression is undesirable in a population
    that is usually HIV co-infected.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  evidence:
  - reference: PMID:21555697
    reference_title: "Clinical Features and Outcome in HIV-Associated Multicentric Castleman's Disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Since 2003, 49 patients with newly diagnosed MCD have been treated with rituximab with (n = 14) or without (n = 35) etoposide."
    explanation: >-
      Shows that the regimens that changed outcomes in this subtype are
      rituximab-based rather than steroid-based. The quote does not itself
      address corticosteroids, hence PARTIAL.
- name: Combination Cytotoxic Chemotherapy
  description: >-
    Cytotoxic chemotherapy is added to rituximab in severe disease, most often
    as etoposide, and liposomal doxorubicin is used where Kaposi sarcoma
    co-exists. In the reference cohort, 14 of 49 rituximab-treated patients
    received etoposide alongside the antibody.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  evidence:
  - reference: PMID:21555697
    reference_title: "Clinical Features and Outcome in HIV-Associated Multicentric Castleman's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since 2003, 49 patients with newly diagnosed MCD have been treated with rituximab with (n = 14) or without (n = 35) etoposide."
    explanation: Documents the addition of etoposide to rituximab in this cohort.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Before rituximab this was a rapidly fatal disease: 5-year overall survival
    was 33% in patients treated in the pre-rituximab era. Rituximab-based therapy
    raised that to 90%, so the modern burden is dominated by the relapsing course
    rather than by early mortality - relapse occurred in 8 of 46 patients at a
    median of two years, all successfully re-treated. Concurrent KSHV-driven
    malignancy remains a substantial risk, with lymphoma occurring at 28 cases per
    1,000 patient-years, and three of four deaths in the rituximab-treated cohort
    occurred within 10 days of diagnosis, so late presentation is still lethal.
  evidence:
  - reference: PMID:21555697
    reference_title: "Clinical Features and Outcome in HIV-Associated Multicentric Castleman's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With rituximab-based treatment, the overall survival was 94% (95% CI, 87% to 100%) at 2 years and was 90% (95% CI, 81% to 100%) at 5 years compared with 42% (95% CI, 14% to 70%) and 33% (95% CI, 6% to 60%) in 12 patients treated before introduction of rituximab (log-rank P < .001)."
    explanation: Gives both the historical and the current survival figures behind this assessment.
  - reference: PMID:21555697
    reference_title: "Clinical Features and Outcome in HIV-Associated Multicentric Castleman's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four of 49 rituximab-treated patients have died; three died as a result of MCD within 10 days of diagnosis, and one died as a result of lymphoma in remission of MCD."
    explanation: Supports the residual early-mortality risk described here.
discussions:
- discussion_id: gap_hhv8_mcd_molecular_characterization
  prompt: >-
    What are the host genomic and molecular characteristics of HHV-8-associated
    MCD, which has been almost entirely left out of the sequencing studies done
    on unicentric and idiopathic Castleman disease?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#HHV-8/KSHV Viral Pathogenesis
  - pathophysiology#Plasma Cell / B Cell Proliferation and Acute-Phase Response
  rationale: >-
    The recurrent somatic alleles reported in Castleman disease - PDGFRB, NCOA4,
    IL6ST - all come from unicentric and idiopathic series. The systematic review
    of Castleman molecular abnormalities notes a paucity of genetic studies for
    this subtype. That matters because it leaves open why only a minority of
    KSHV-infected, immunosuppressed people develop MCD at all, and whether host
    factors explain the variable rituximab response.
  evidence:
  - reference: PMID:33804823
    reference_title: "A Review of Genetic Abnormalities in Unicentric and Multicentric Castleman Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, there is a paucity of genetic studies evaluating HHV-8 positive multicentric CD (HHV-8+ MCD) and POEMS-associated CD."
    explanation: Names the coverage gap in a systematic review of the molecular literature.
  proposed_experiments:
  - experiment_id: exp_hhv8_mcd_host_virus_paired_sequencing
    name: Paired host and viral sequencing across KSHV-infected controls
    description: >-
      Compare host exomes, lymph node spatial transcriptomes, and KSHV genomes
      between HHV-8-associated MCD, KSHV-infected people with Kaposi sarcoma but
      no MCD, and KSHV-infected asymptomatic carriers, matched for HIV status and
      CD4 count. Testing for host variants and viral strain features that
      segregate with the MCD phenotype is what would explain why only a minority
      of infected people develop it.
    would_support:
    - pathophysiology#HHV-8/KSHV Viral Pathogenesis
    supporting_outcome:
    - >-
      Host variants or viral strain features segregate with MCD and are absent
      from infected controls, nominating a susceptibility determinant.
    refuting_outcome:
    - >-
      MCD cases are indistinguishable from infected controls on host and viral
      genome, indicating the determinant is immunological or stochastic rather
      than genomic.
- discussion_id: controversy_hhv8_rituximab_and_kaposi_sarcoma
  prompt: >-
    Should rituximab be used first-line when Kaposi sarcoma co-exists with
    HHV-8-associated MCD, given reports that it worsens the sarcoma?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - treatments#Rituximab
  - phenotypes#Kaposi's Sarcoma
  rationale: >-
    Rituximab transformed survival in this subtype and is the standard first-line
    therapy, but Kaposi sarcoma co-occurs frequently and its worsening on
    rituximab has been reported. The two conditions share a cause, so the patient
    who most needs B cell depletion for MCD may be the one in whom it is riskiest
    for KS. Combination approaches with liposomal doxorubicin, and
    lytic-gene-directed antiviral therapy, exist as alternatives, but the
    comparison has not been made in a randomized trial.
  evidence:
  - reference: DOI:10.3390/jcm14186563
    reference_title: "Castleman Disease and Kaposi Sarcoma: A Review of the Literature and a Case Series"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present four clinical cases, with concurrent KS and MCD, treated with chemotherapy and rituximab, with a satisfactory response."
    explanation: >-
      Documents the concurrent presentation and a combined approach using
      chemotherapy together with rituximab.
  - reference: PMID:21487108
    reference_title: "High-dose zidovudine plus valganciclovir for Kaposi sarcoma herpesvirus-associated multicentric Castleman disease: a pilot study of virus-activated cytotoxic therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These observations provide evidence that therapy designed to target cells with lytic KSHV replication has activity in KSHV-MCD."
    explanation: >-
      Establishes lytic-gene-directed antiviral therapy as an alternative that
      does not deplete B cells.
notes: >-
  Scope note: this entry covers HHV-8/KSHV-associated multicentric Castleman
  disease only. It was split out of the former umbrella `Castleman_Disease`
  entry, together with `Unicentric_Castleman_Disease` and
  `Idiopathic_Multicentric_Castleman_Disease`, because those forms have
  different causes, different first-line therapy, and different confirmatory
  tests. The curated union is kept in `kb/groupings/Castleman_Disease.yaml`.

  Ontology note: `disease_term` deliberately carries no bound `term:`. MONDO has
  no class for the HHV-8-associated form, and the nearest candidate,
  `MONDO:0019754` (multicentric Castleman disease), is the parent of both the
  HHV-8-associated and the idiopathic arms - so binding it here would assert that
  this entry is multicentric Castleman disease in general, and would mark that
  parent concept as curated when only one of its children has been. MONDO's own
  handling of that class compounds the problem: it is defined and classified as
  the HHV-8 form, carrying `is_a MONDO:0015157` (human herpesvirus 8-related
  tumor) and an exact synonym from `ORPHA:570438`, while also carrying a related
  synonym for the idiopathic form, and that conflation is why `MONDO:0035838`
  (idiopathic MCD) is not classified under it. Following the repository rule that
  no term beats a bad one, the binding is omitted and a free-text
  `preferred_term` is kept. A request to split the MONDO class and mint a
  specific HHV-8-associated child is tracked in the dismech split issue; bind
  this entry to that term when it exists.

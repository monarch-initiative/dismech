- name: JAK-STAT3 Signaling Activation
  description: >-
    vIL-6 and human IL-6 both engage gp130 and activate downstream JAK kinases
    and STAT3 transcription factor signaling. vIL-6 does so without the IL-6
    receptor, which is why anti-IL-6-receptor blockade is a poorer fit for this
    subtype than for the idiopathic forms, and why first-line therapy here
    targets the infected B cell rather than the cytokine.
  biological_scale: MOLECULAR

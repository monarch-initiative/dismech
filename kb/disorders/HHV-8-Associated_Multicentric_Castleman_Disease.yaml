- name: IL-6 / vIL-6 Overproduction
  description: >-
    Lytically infected plasmablasts produce a viral IL-6 homolog (vIL-6) that
    signals through gp130 independently of the IL-6 receptor, bypassing the
    checkpoint that normally limits IL-6 signaling. Human IL-6 and IL-10 are
    also elevated, so the hypercytokinemia is a mixture of viral and host
    cytokine, and both fall when lytic replication is suppressed. This is the
    one Castleman subtype in which the source of the cytokine excess is known.
  biological_scale: MOLECULAR

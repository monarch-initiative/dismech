animal_models:
- name: Auxilin (Dnajc6) knockout mouse
  species: Mouse
  genotype: Congenic B6 Dnajc6 (auxilin) constitutive knockout; characterised longitudinally from 3 to 15 months
  publication: PMID:36920906
  description: >-
    A constitutive auxilin (Dnajc6) knockout mouse that develops age-dependent,
    L-DOPA-responsive parkinsonism, recapitulating the late nigrostriatal and
    dopaminergic features of DNAJC6 disease while modelling clathrin-uncoating
    loss as a full null rather than the patients' loss-of-function point
    variants.
  modeled_mechanisms:
  - target: Nigrostriatal Dopaminergic Neurodegeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The knockout reproduces progressive, region-stereotypical loss of
      substantia nigra dopaminergic neurons with alpha-synuclein pathology.
    limitations: >-
      The mouse is a constitutive full null, whereas PARK19 patients carry
      loss-of-function point variants; it models the adult nigrostriatal
      degeneration and not the juvenile developmental features.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The model is a mouse and the disease is human; onset in the mouse is in
        the second year of life rather than in childhood, and the mouse is a
        constitutive full null rather than a carrier of the patients'
        loss-of-function point variants.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The juvenile extra-parkinsonian features of PARK19A, intellectual
        disability and seizures, are outside the model, which reproduces only
        the late adult nigrostriatal degeneration and parkinsonism.
    readouts:
    - name: Substantia nigra tyrosine-hydroxylase neuron count
      target: Nigrostriatal Dopaminergic Neurodegeneration
      direction: DECREASED
      interpretation: Stereological SNpc dopaminergic neuron loss of about 40% at the symptomatic age, the structural correlate of the degeneration node.
      evidence:
      - reference: PMID:36920906
        reference_title: "Dopamine transporter and synaptic vesicle sorting defects underlie auxilin-associated Parkinson's disease."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "at the symptomatic age of 9 months, a significant loss of DA neurons was observed (~40%)"
        explanation: Quantifies the nigral dopaminergic loss this node represents.
    evidence:
    - reference: PMID:36920906
      reference_title: "Dopamine transporter and synaptic vesicle sorting defects underlie auxilin-associated Parkinson's disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Auxilin KO mice display cardinal features of PD, including progressive motor deficits, α-synuclein pathology, nigral dopaminergic loss, and neuroinflammation."
      explanation: Establishes the knockout as a model informative for nigrostriatal degeneration.
  - target: Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The knockout shows a striatal dopamine deficit and L-DOPA-responsive motor
      deficits, with delayed dopamine reuptake from dopamine-transporter
      misrouting.
    limitations: >-
      Dopamine handling is read out at the whole-animal and tissue level in a

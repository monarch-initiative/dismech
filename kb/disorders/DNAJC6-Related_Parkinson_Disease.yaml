      snippet: "DNAJC6 Parkinson disease is inherited in an autosomal recessive manner."
      explanation: The GeneReviews genetic-counseling statement, sourcing the inheritance mode.
  notes: >-
    Auxilin, the neuron-specific clathrin-uncoating co-chaperone. Biallelic
    DNAJC6 variants span the juvenile form (PARK19A) and the milder early-onset
    form (PARK19B). The ClinGen Gene-Disease Validity table lists no
    DNAJC6-Parkinson disease assertion (checked 2026-09-25), so no
    gene_disease_validity row is recorded; the GeneReviews chapter is listed in
    the committed Bookshelf index as PMID:33983693 'DNAJC6 Parkinson Disease'
    and reports TAGGED (a full four-section chapter, not an Overview), from
    which the clinical-characteristics, diagnosis and management content here is
    drawn.
  evidence:
  - reference: PMID:22563501
    reference_title: "A deleterious mutation in DNAJC6 encoding the neuronal-specific clathrin-uncoating co-chaperone auxilin, is associated with juvenile parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using homozygosity mapping and whole exome sequencing we identified a deleterious mutation in DNAJC6 in two patients with juvenile parkinsonism."
    explanation: Original identification of DNAJC6 in juvenile parkinsonism.
  - reference: PMID:26528954
    reference_title: "DNAJC6 Mutations Associated With Early-Onset Parkinson's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings delineate a novel form of hereditary early-onset PD."
    explanation: Extends the DNAJC6 phenotype from juvenile parkinsonism to early-onset Parkinson disease, the basis for the two subtype rows.
  - reference: PMID:34396589
    reference_title: "Genotype-Phenotype Relations for the Atypical Parkinsonism Genes: MDSGene Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "This Movement Disorder Society Genetic mutation database Systematic Review focuses on monogenic atypical parkinsonism with mutations in the ATP13A2, DCTN1, DNAJC6, FBXO7, SYNJ1, and VPS13C genes."
    explanation: DNAJC6 is one of the MDSGene atypical-parkinsonism genes, the genotype-phenotype dataset for the disease.
  variants:
  - name: p.Cys325*
    description: >-
      A homozygous nonsense variant reported in two siblings with rapidly
      progressive juvenile parkinsonism, absent from population databases and
      predicted to truncate the protein (loss of function).
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:42414182
      reference_title: "Novel Homozygous Pathogenic Variant in DNAJC6 Causes Rapid Progressive Parkinsonism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "We report two siblings (17 and 14 years) harboring a novel homozygous nonsense variant in DNAJC6, p.Cys325*, not previously described in the medical literature and absent from population databases."
      explanation: Reports the biallelic nonsense variant in two affected siblings.
    - reference: PMID:42414182
      reference_title: "Novel Homozygous Pathogenic Variant in DNAJC6 Causes Rapid Progressive Parkinsonism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "The variant is predicted to truncate the protein, supporting a loss-of-function mechanism consistent with the gene's disease biology."
      explanation: Gives the predicted loss-of-function consequence of the nonsense variant.
animal_models:
- name: Auxilin (Dnajc6) knockout mouse
  species: Mouse
  genotype: Congenic B6 Dnajc6 (auxilin) constitutive knockout; characterised longitudinally from 3 to 15 months
  publication: PMID:36920906
  description: >-
    A constitutive auxilin (Dnajc6) knockout mouse that develops age-dependent,
    L-DOPA-responsive parkinsonism, recapitulating the late nigrostriatal and
    dopaminergic features of DNAJC6 disease while modelling clathrin-uncoating
    loss as a full null rather than the patients' loss-of-function point
    variants.
  modeled_mechanisms:
  - target: Nigrostriatal Dopaminergic Neurodegeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The knockout reproduces progressive, region-stereotypical loss of
      substantia nigra dopaminergic neurons with alpha-synuclein pathology.
    limitations: >-
      The mouse is a constitutive full null, whereas PARK19 patients carry
      loss-of-function point variants; it models the adult nigrostriatal
      degeneration and not the juvenile developmental features.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The model is a mouse and the disease is human; onset in the mouse is in
        the second year of life rather than in childhood, and the mouse is a
        constitutive full null rather than a carrier of the patients'
        loss-of-function point variants.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The juvenile extra-parkinsonian features of PARK19A, intellectual
        disability and seizures, are outside the model, which reproduces only
        the late adult nigrostriatal degeneration and parkinsonism.
    readouts:
    - name: Substantia nigra tyrosine-hydroxylase neuron count
      target: Nigrostriatal Dopaminergic Neurodegeneration
      direction: DECREASED
      interpretation: Stereological SNpc dopaminergic neuron loss of about 40% at the symptomatic age, the structural correlate of the degeneration node.
      evidence:
      - reference: PMID:36920906
        reference_title: "Dopamine transporter and synaptic vesicle sorting defects underlie auxilin-associated Parkinson's disease."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "at the symptomatic age of 9 months, a significant loss of DA neurons was observed (~40%)"
        explanation: Quantifies the nigral dopaminergic loss this node represents.
    evidence:
    - reference: PMID:36920906
      reference_title: "Dopamine transporter and synaptic vesicle sorting defects underlie auxilin-associated Parkinson's disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Auxilin KO mice display cardinal features of PD, including progressive motor deficits, α-synuclein pathology, nigral dopaminergic loss, and neuroinflammation."
      explanation: Establishes the knockout as a model informative for nigrostriatal degeneration.
  - target: Striatal Dopamine Dyshomeostasis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The knockout shows dopamine-transporter misrouting and slowed dopamine
      reuptake in the dorsal striatum, the presynaptic dopamine-handling defect.
    limitations: >-
      Dopamine handling is read out at the whole-animal and tissue level in a
      full null, so the per-allele severity of patient point variants is not
      modelled.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: IMMATERIAL
      description: >-
        The dopamine-handling defect is measured in mouse striatum rather than
        in human patients, but the direction is concordant with the low CSF
        homovanillic acid reported in patients.
    evidence:
    - reference: PMID:36920906
      reference_title: "Dopamine transporter and synaptic vesicle sorting defects underlie auxilin-associated Parkinson's disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We validated these findings by demonstrating slower dopamine reuptake kinetics in vivo, an effect associated with dopamine transporter misrouting into axonal membrane deformities in the dorsal striatum."
      explanation: The striatal dopamine-handling defect this node represents.
  - target: Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The knockout shows a striatal dopamine deficit and L-DOPA-responsive motor
      deficits, confirming the deficit is dopaminergic.
    limitations: >-
      The motor syndrome is scored at the whole-animal level in a full null, so
      the per-allele severity of patient point variants is not modelled.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: IMMATERIAL
      description: >-
        The levodopa response is measured on a mouse balance-beam task rather
        than in patients, but the levodopa responsiveness is concordant with the
        human disease.
    readouts:
    - name: Balance-beam motor performance after L-DOPA
      target: Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction
      direction: RESTORED
      interpretation: The motor deficit is dopaminergic and levodopa-correctable, as in the human disease.
      evidence:
      - reference: PMID:36920906
        reference_title: "Dopamine transporter and synaptic vesicle sorting defects underlie auxilin-associated Parkinson's disease."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "symptomatic 9- to 12-month-old auxilin KO mice when treated with L-DOPA showed complete recovery of their performance on the balance beam apparatus"
        explanation: The L-DOPA rescue that marks the deficit as dopaminergic.
    evidence:
    - reference: PMID:36920906
      reference_title: "Dopamine transporter and synaptic vesicle sorting defects underlie auxilin-associated Parkinson's disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "symptomatic 9- to 12-month-old auxilin KO mice when treated with L-DOPA showed complete recovery of their performance on the balance beam apparatus"
      explanation: The levodopa-responsive motor deficit tied to the striatal dopamine deficit.
  evidence:
  - reference: PMID:36920906
    reference_title: "Dopamine transporter and synaptic vesicle sorting defects underlie auxilin-associated Parkinson's disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Auxilin KO mice are thus a reliable and robust model for PD."
    explanation: The authors' own assessment of the model's fidelity to Parkinson disease.
experimental_models:
- name: DNAJC6-mutant human midbrain organoids
  experimental_model_type: ORGANOID
  description: >-
    CRISPR-Cas9-edited human embryonic stem cell midbrain-like organoids
    carrying DNAJC6 mutations, which reproduce dopaminergic neuron degeneration,
    alpha-synuclein aggregation and neurodevelopmental defects, and in which the
    WNT-LMX1A developmental defect was demonstrated.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  modeled_mechanisms:
  - target: Impaired Midbrain Dopaminergic Neurodevelopment
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The organoids show the WNT-LMX1A developmental defect and generation of
      vulnerable midbrain dopaminergic neurons.
    limitations: >-
      Organoids model fetal-stage development in vitro and have not been
      confirmed against patient brain tissue, so the translational validity of
      the developmental arm is unestablished.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        A midbrain organoid lacks the systemic, vascular and long-range
        circuit context of the developing human brain, so the organoid
        developmental defect is a partial model of the clinical phenotype.
    evidence:
    - reference: PMID:33597231
      reference_title: "Neurodevelopmental defects and neurodegenerative phenotypes in human brain organoids carrying Parkinson's disease-linked DNAJC6 mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "defects in DNAJC6-mediated endocytosis impair the WNT-LMX1A signal during the mDA neuron development."
      explanation: The organoid demonstration of the proposed neurodevelopmental mechanism.
treatments:
- name: Levodopa
  description: >-
    Dopaminergic replacement with levodopa. Response is variable and often only
    partial in the juvenile form, where dose escalation has provoked an adverse
    motor reaction; it is better in the early-onset form. Across the atypical
    monogenic parkinsonisms the levodopa response is less favourable than in
    typical monogenic Parkinson disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levodopa
      term:
        id: CHEBI:15765
        label: L-dopa
  target_phenotypes:
  - preferred_term: Parkinsonism
    term:
      id: HP:0001300
      label: Parkinsonism
  evidence:
  - reference: PMID:42414182
    reference_title: "Novel Homozygous Pathogenic Variant in DNAJC6 Causes Rapid Progressive Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Levodopa produced only mild benefit; in the older sibling, dose escalation provoked an adverse reaction with sustained upgaze/ophthalmoparesis, opisthotonus, and hypertension."
    explanation: Documents the partial and sometimes adverse levodopa response in the juvenile form.
  - reference: PMID:33983693
    reference_title: "DNAJC6 Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Treatment of manifestations: Levodopa, dopaminergic agonists, and/or anticholinergics."
    explanation: Levodopa is the first-line symptomatic treatment per GeneReviews.
  - reference: PMID:34396589
    reference_title: "Genotype-Phenotype Relations for the Atypical Parkinsonism Genes: MDSGene Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "levodopa response less favorable than in patients with monogenic typical presentations (49% vs 93%)"
    explanation: The less favourable levodopa response of the atypical monogenic parkinsonisms, DNAJC6 among them.

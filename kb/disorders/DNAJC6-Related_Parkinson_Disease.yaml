differential_diagnoses:
- name: SYNJ1 Early-Onset Parkinsonism
  description: >-
    The other presynaptic, endocytic recessive parkinsonism (PARK20): SYNJ1
    encodes synaptojanin 1, a phosphoinositide phosphatase required for the same
    postendocytic synaptic-vesicle recycling, and presents with early-onset
    parkinsonism, dystonia, cognitive decline and poor levodopa response, as
    DNAJC6 does.
- name: PRKN and PINK1 Early-Onset Parkinson Disease
  description: >-
    The common recessive early-onset parkinsonisms, which act through
    mitochondrial quality control (mitophagy) rather than synaptic-vesicle
    endocytosis; they are typically more levodopa-responsive and lack the
    developmental features of juvenile DNAJC6 disease.
- name: ATP13A2-Related Juvenile Parkinsonism (PARK9)
  description: >-
    Kufor-Rakeb syndrome: a recessive juvenile dystonia-parkinsonism with
    cognitive decline and additional neurologic features that overlaps the
    juvenile DNAJC6 phenotype; it is one of the MDSGene atypical-parkinsonism
    genes screened alongside DNAJC6.

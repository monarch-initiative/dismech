- name: Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction
  conforms_to: "parkinsonism_dopaminergic_degeneration#Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction"
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Nigrostriatal neuron loss depletes dopamine in the striatum, disrupting
    basal-ganglia motor circuits and producing parkinsonism. Because the deficit
    is dopaminergic, the parkinsonism is at least partly levodopa-responsive,
    though response is variable and often poor in the juvenile form. The node
    conforms to the module's striatal-deficit anchor.

pathophysiology:
- name: Auxilin Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The root lesion is biallelic loss of DNAJC6, which encodes auxilin, a
    neuron-selective HSP40/DnaJ co-chaperone. Through its J domain auxilin
    recruits HSC70 and stimulates its ATPase activity to drive ATP-dependent
    disassembly of the clathrin coat, so a null or deleterious allele removes
    the neuron's dedicated clathrin-uncoating activity. The reported juvenile
    allele produced abnormal transcripts and markedly reduced DNAJC6 mRNA, and
    a later nonsense allele (p.Cys325*) is predicted to truncate the protein,
    both consistent with loss of function.
  genes:
  - preferred_term: DNAJC6
    term:
      id: hgnc:15469
      label: DNAJC6
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: Biallelic deleterious or nonsense DNAJC6 variants; homozygous in the reported consanguineous families.
  molecular_functions:
  - preferred_term: auxilin HSC70 co-chaperone activity
    term:
      id: GO:0031072
      label: heat shock protein binding
    modifier: DECREASED
  cell_types:
  - preferred_term: dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  evidence:
  - reference: PMID:22563501
    reference_title: "A deleterious mutation in DNAJC6 encoding the neuronal-specific clathrin-uncoating co-chaperone auxilin, is associated with juvenile parkinsonism."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "DNAJC6 encodes the HSP40 Auxilin, a protein which is selectively expressed in neurons and confers specificity to the ATPase activity of its partner Hcs70 in clathrin uncoating."
    explanation: States the clathrin-uncoating co-chaperone function whose loss is the root lesion. The sentence restates established protein function rather than a result of the study, so it is graded OTHER with a BACKGROUND quote role.
  - reference: PMID:22563501
    reference_title: "A deleterious mutation in DNAJC6 encoding the neuronal-specific clathrin-uncoating co-chaperone auxilin, is associated with juvenile parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation was associated with abnormal transcripts and marked reduced DNAJC6 mRNA level."
    explanation: Supports a loss-of-expression consequence for the reported juvenile allele.
  downstream:
  - target: Impaired Synaptic Vesicle Endocytosis and Recycling
    causal_link_type: DIRECT
    description: Loss of the clathrin-uncoating co-chaperone leaves clathrin coats on endocytosed vesicles, stalling synaptic-vesicle endocytosis and recycling.
    evidence:
    - reference: PMID:22563501
      reference_title: "A deleterious mutation in DNAJC6 encoding the neuronal-specific clathrin-uncoating co-chaperone auxilin, is associated with juvenile parkinsonism."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "DNAJC6 encodes the HSP40 Auxilin, a protein which is selectively expressed in neurons and confers specificity to the ATPase activity of its partner Hcs70 in clathrin uncoating."
      explanation: Links the lost co-chaperone activity to the clathrin-uncoating step that the next node describes.
- name: Impaired Synaptic Vesicle Endocytosis and Recycling
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Without auxilin-driven uncoating, clathrin-coated vesicles are not
    efficiently stripped and returned to the recycling pool, so synaptic-vesicle
    endocytosis and recycling at the nerve terminal are impaired. This is the
    presynaptic, endocytic mechanism DNAJC6 shares with SYNJ1 (PARK20), as
    distinct from the mitochondrial-quality-control mechanism of PRKN and PINK1.
  biological_processes:
  - preferred_term: synaptic vesicle endocytosis
    term:
      id: GO:0048488
      label: synaptic vesicle endocytosis
    modifier: DECREASED
  - preferred_term: synaptic vesicle recycling
    term:
      id: GO:0036465
      label: synaptic vesicle recycling
    modifier: DECREASED
  cell_types:
  - preferred_term: dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  evidence:
  - reference: PMID:22563501
    reference_title: "A deleterious mutation in DNAJC6 encoding the neuronal-specific clathrin-uncoating co-chaperone auxilin, is associated with juvenile parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using homozygosity mapping and whole exome sequencing we identified a deleterious mutation in DNAJC6 in two patients with juvenile parkinsonism."
    explanation: The human genetic link between DNAJC6 loss and the parkinsonian phenotype whose presynaptic mechanism this node represents.
  downstream:
  - target: Nigrostriatal Dopaminergic Neurodegeneration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Chronic presynaptic endocytic failure in dopaminergic neurons leads to their degeneration.
    evidence:
    - reference: PMID:26528954
      reference_title: "DNAJC6 Mutations Associated With Early-Onset Parkinson's Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our findings delineate a novel form of hereditary early-onset PD."
      explanation: The endocytic lesion produces a hereditary Parkinson disease, whose substrate is nigrostriatal degeneration.

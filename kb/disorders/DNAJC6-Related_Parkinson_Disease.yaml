- name: Striatal Dopamine Dyshomeostasis
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The endocytic defect disrupts presynaptic dopamine handling in dopaminergic
    terminals: dopamine transporter is misrouted into axonal membrane
    deformities, reuptake kinetics slow, and cytoplasmic dopamine accumulates,
    with low CSF homovanillic acid in patients. This presynaptic dopamine
    dyshomeostasis both drives and precedes the frank neuronal loss.

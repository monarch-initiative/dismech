- name: Impaired Midbrain Dopaminergic Neurodevelopment
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    A proposed developmental arm for the juvenile phenotype: in CRISPR-edited
    human midbrain organoids, loss of DNAJC6-mediated endocytosis impairs
    WNT-LMX1A signalling during midbrain dopaminergic neuron development,
    generating intrinsically vulnerable neurons and neurodevelopmental defects.
    This is a candidate mechanism for the developmental delay and intellectual
    disability that precede parkinsonism in PARK19A; it is shown in organoids
    and not yet confirmed in patient tissue, so the node is marked hypothetical.

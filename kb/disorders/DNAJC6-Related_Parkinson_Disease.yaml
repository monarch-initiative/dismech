name: DNAJC6-Related Parkinson Disease
creation_date: "2026-11-18T22:30:00Z"
category: Mendelian
description: >-
  DNAJC6-related Parkinson disease (PARK19) is an autosomal-recessive form of
  parkinsonism caused by biallelic loss-of-function variants in DNAJC6, which
  encodes auxilin, the neuron-specific clathrin-uncoating co-chaperone. Auxilin
  works with the constitutive heat-shock protein HSC70 to disassemble the
  clathrin coat from newly endocytosed synaptic vesicles, so loss of its
  activity impairs synaptic-vesicle endocytosis and recycling at the nerve
  terminal and places the disease on the presynaptic, endocytic arm of
  Parkinson pathophysiology alongside SYNJ1 (PARK20), rather than on the
  mitochondrial arm of PRKN/PINK1. The phenotype spans a juvenile-onset form
  (PARK19A) in which developmental delay, intellectual disability, seizures and
  other movement disorders usually precede the parkinsonism, and a milder
  early-onset form (PARK19B) presenting as levodopa-responsive parkinsonism in
  the third to fifth decade without the additional neurologic features. The two
  ends are one gene and one mechanism class and are curated here as one entry,
  with PARK19B as a subtype.
parents:
- Movement Disorder
- Autosomal Recessive Early-Onset Parkinsonism
synonyms:

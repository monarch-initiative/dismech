pathophysiology:
- name: Auxilin Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The root lesion is biallelic loss of DNAJC6, which encodes auxilin, a
    neuron-selective HSP40/DnaJ co-chaperone. Through its J domain auxilin
    recruits HSC70 and stimulates its ATPase activity to drive ATP-dependent
    disassembly of the clathrin coat, so a null or deleterious allele removes
    the neuron's dedicated clathrin-uncoating activity. The reported juvenile
    allele produced abnormal transcripts and markedly reduced DNAJC6 mRNA, and
    a later nonsense allele (p.Cys325*) is predicted to truncate the protein,
    both consistent with loss of function.
  genes:
  - preferred_term: DNAJC6
    term:
      id: hgnc:15469
      label: DNAJC6
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: Biallelic deleterious or nonsense DNAJC6 variants; homozygous in the reported consanguineous families.
  molecular_functions:
  - preferred_term: auxilin HSC70 co-chaperone activity
    term:
      id: GO:0031072
      label: heat shock protein binding
    modifier: DECREASED
  cell_types:
  - preferred_term: dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  evidence:
  - reference: PMID:20160091
    reference_title: Endocytosis and clathrin-uncoating defects at synapses of auxilin knockout mice.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Neuronally expressed auxilin and ubiquitously expressed cyclin-G-dependent kinase (GAK) are homologous proteins that act as cochaperones to support the Hsc70-dependent clathrin uncoating of clathrin-coated vesicles."
    explanation: States the HSC70 co-chaperone clathrin-uncoating activity whose loss is the root lesion. The sentence restates established protein function rather than a result of the study, so it is graded OTHER with a BACKGROUND quote role.
  - reference: PMID:22563501
    reference_title: "A deleterious mutation in DNAJC6 encoding the neuronal-specific clathrin-uncoating co-chaperone auxilin, is associated with juvenile parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation was associated with abnormal transcripts and marked reduced DNAJC6 mRNA level."
    explanation: Supports a loss-of-expression consequence for the reported juvenile allele.
  downstream:
  - target: Clathrin Coat Disassembly Failure
    causal_link_type: DIRECT
    description: Loss of the HSC70 co-chaperone activity removes the neuron's ATP-dependent clathrin-uncoating step.
    evidence:
    - reference: PMID:20160091
      reference_title: Endocytosis and clathrin-uncoating defects at synapses of auxilin knockout mice.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "Neuronally expressed auxilin and ubiquitously expressed cyclin-G-dependent kinase (GAK) are homologous proteins that act as cochaperones to support the Hsc70-dependent clathrin uncoating of clathrin-coated vesicles."
      explanation: Links the lost co-chaperone activity to the clathrin-uncoating step that the next node describes.
- name: Clathrin Coat Disassembly Failure
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Without auxilin-driven uncoating, the clathrin coat is not stripped from
    coated vesicles: auxilin knockout synapses accumulate clathrin-coated
    vesicles and empty clathrin cages, with coat components sequestered in
    assembled coats. GAK, the ubiquitous homolog, only partially compensates.
  biological_processes:
  - preferred_term: clathrin coat disassembly
    term:
      id: GO:0072318
      label: clathrin coat disassembly
    modifier: DECREASED
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:20160091
    reference_title: Endocytosis and clathrin-uncoating defects at synapses of auxilin knockout mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "An increased number of clathrin-coated vesicles and empty cages were present at knockout synapses both in situ and in primary neuronal cultures."
    explanation: Direct demonstration of failed clathrin uncoating at auxilin-null synapses.
  downstream:
  - target: Impaired Synaptic Vesicle Endocytosis and Recycling
    causal_link_type: DIRECT
    description: Sequestration of coat components in uncleared coats stalls clathrin-mediated synaptic-vesicle endocytosis.
    evidence:
    - reference: PMID:20160091
      reference_title: Endocytosis and clathrin-uncoating defects at synapses of auxilin knockout mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Additionally, clathrin-mediated endocytosis of synaptic vesicles in knockout hippocampal neurons was impaired, most likely due to sequestration of coat components in assembled coats and cages."
      explanation: The uncoating failure directly impairs synaptic-vesicle endocytosis.
- name: Impaired Synaptic Vesicle Endocytosis and Recycling
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    With coat components trapped in uncleared cages, clathrin-mediated
    endocytosis of synaptic vesicles and their recycling into the releasable
    pool are impaired at the nerve terminal. This is the presynaptic, endocytic
    mechanism DNAJC6 shares with SYNJ1 (PARK20), as distinct from the
    mitochondrial-quality-control mechanism of PRKN and PINK1.
  biological_processes:

diagnosis:
- name: Radiographic Recognition and the Non-Accidental Injury Pitfall
  description: >-
    The diagnosis begins with recognising that the metaphyseal "corner fractures"
    are ossification abnormalities and not injuries. The classic metaphyseal lesion
    of physical abuse has the same distribution — distal tibia, distal radius,
    proximal humerus and femur — so a skeletal survey in an infant can be read either
    way, and the presence of vertebral change, coxa vara, and scoliosis is what
    should redirect towards a dysplasia.
  evidence:
  - reference: PMID:30599297
    reference_title: "Novel fibronectin mutations and expansion of the phenotype in spondylometaphyseal dysplasia with \"corner fractures\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most striking feature characterizing SMD-CF is irregularly shaped
      metaphyses giving the appearance of "corner fractures".
    explanation: >-
      The radiographic mimicry of fracture is stated directly; it is what makes the
      differential with inflicted injury unavoidable.
- name: FN1 Sequencing
  description: >-
    A heterozygous missense variant in the N-terminal assembly region of FN1, most
    often substituting a cysteine, confirms the diagnosis. Because the gene-disease
    association dates only from 2017, older negative exome results are worth
    reanalysing: one reported patient was diagnosed when an automated PanelApp search
    for new gene-disease associations flagged the FN1 variant in a previously
    negative genome.
  evidence:
  - reference: PMID:33605604
    reference_title: "Automated reanalysis, a novel way to diagnose an ultra-rare condition: Fibronectin-1-related spondylometaphyseal dysplasia (SMD-FN1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      however, subsequent reanalysis, initiated by an automated search for new
      gene-disease associations in PanelApp, highlighted a candidate diagnostic
      variant
    explanation: >-
      Documents reanalysis of a previously negative genome as the route to diagnosis
      in a recently described gene-disease pair.
differential_diagnoses:
- name: Non-Accidental Injury
  description: >-
    The most consequential differential. Classic metaphyseal lesions of inflicted
    injury occupy the same skeletal sites as the pseudo-fractures of SMD-CF, and one
    reported patient additionally had genuine low-trauma femoral fractures. A
    molecular diagnosis is what settles it.
  notes: >-
    Recorded without an evidence item because no cited source frames the differential
    in these terms; the radiographic mimicry it rests on is evidenced on the
    "Abnormal Metaphyseal Ossification" pathophysiology node.
- name: Metaphyseal Chondrodysplasia Brussels Type
  description: >-
    One reported SMD-FN1 patient had originally been given this diagnosis, and the
    reporting authors go on to ask whether the two are in fact the same disorder
    rather than a differential at all.
  evidence:
  - reference: PMID:33605604
    reference_title: "Automated reanalysis, a novel way to diagnose an ultra-rare condition: Fibronectin-1-related spondylometaphyseal dysplasia (SMD-FN1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We consider differences and similarities between MCD Brussels and SMD-FN1, by
      reviewing literature on both conditions and assess whether they are in fact the
      same disorder.
    explanation: >-
      The authors pose the entity question directly; recorded here as an unresolved
      differential rather than as a merge.
- name: COL2A1-Related Spondylometaphyseal Dysplasia
  description: >-
    Some cases carrying the corner-fracture radiographic label are linked to COL2A1
    rather than FN1 — though not the original Sutcliffe family. This is why MONDO
    gives MONDO:0008479 a type 2 collagenopathy parent as well as a
    spondylometaphyseal one, and why the ISDS nosology lists MIM 184255 in both group
    12 and the type 2 collagen group.
  notes: >-
    Recorded without an evidence item because the claim is a statement about the ISDS
    nosology's own row note and MONDO's parentage, neither of which is quotable from
    a cached publication; the provenance is set out in the classifications block.
treatments:
- name: Orthopaedic Management of Deformity
  description: >-
    Care is orthopaedic and supportive: monitoring and surgical management of severe
    scoliosis, of developmental coxa vara, and of progressive limb malalignment. No
    disease-modifying therapy exists and no management study specific to FN1-related
    SMD-CF has been published.
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  therapeutic_modality: SURGERY
  notes: >-
    Curated without an evidence item because no management study of this disorder
    exists; the record names the deformities documented in the case series as the
    targets of standard skeletal-dysplasia orthopaedic care rather than asserting a
    trialled intervention.
- name: Genetic Counseling
  description: >-
    Most probands carry a de novo variant, so recurrence risk for the parents is low
    but not zero because of gonadal mosaicism, while an affected individual's own
    offspring risk is 50 percent. Confirming de novo status in the parents is
    therefore part of counselling rather than an academic exercise.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:29100092
    reference_title: "Mutations in Fibronectin Cause a Subtype of Spondylometaphyseal Dysplasia with \"Corner Fractures\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, using matching tools and the SkelDys emailing list, we identified
      other individuals with de novo FN1 variants and a similar phenotype.
    explanation: >-
      Establishes the de novo, dominant pattern that determines the recurrence-risk
      counselling.
experimental_models:
- name: Recombinant fibronectin secretion assay
  experimental_model_type: CELL_LINE
  description: >-
    Three disease-associated missense variants — p.Cys87Phe, p.Tyr240Asp, and
    p.Cys260Gly — were introduced into both a secreted N-terminal 70 kDa fragment
    (rF70K) and full-length recombinant fibronectin (rFN), expressed in cultured
    cells, and assayed for secretion into the medium and for intracellular retention
    by immunofluorescence.
  culture_system: Transfected cell culture with recombinant wild-type and mutant fibronectin constructs
  modeled_mechanisms:
  - target: Intracellular Retention and Failed Fibronectin Secretion
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The assay establishes the molecular consequence of the disease alleles
      directly, in both a fragment and a full-length context.
    limitations: >-
      A transfected recombinant system in a non-skeletal cell background. It shows
      that the variants block secretion, not that a secretion deficit is sufficient
      to produce the metaphyseal lesion in a growth plate; no skeletal cell or animal
      model of these alleles has been reported.
    readouts:
    - name: Fibronectin secreted into culture medium
      target: Intracellular Retention and Failed Fibronectin Secretion
      direction: DECREASED
      interpretation: >-
        Mutant constructs are absent from or depleted in the medium relative to
        wild type, the primary measure of the secretion defect.
      evidence:
      - reference: PMID:29100092
        reference_title: "Mutations in Fibronectin Cause a Subtype of Spondylometaphyseal Dysplasia with \"Corner Fractures\"."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          The wild-type rF70K and rFN were secreted into the culture medium, whereas
          all mutant proteins were either not secreted or secreted at significantly
          lower amounts.
        explanation: Reports the secretion measurement behind this readout.
    - name: Intracellular fibronectin immunofluorescence
      target: Intracellular Retention and Failed Fibronectin Secretion
      direction: INCREASED
      interpretation: >-
        Increased intracellular signal confirms that the unsecreted protein is
        retained rather than degraded to nothing.
      evidence:
      - reference: PMID:29100092
        reference_title: "Mutations in Fibronectin Cause a Subtype of Spondylometaphyseal Dysplasia with \"Corner Fractures\"."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Immunofluorescence analysis demonstrated increased intracellular retention
          of the mutant proteins.
        explanation: Reports the retention measurement behind this readout.
    evidence:
    - reference: PMID:29100092
      reference_title: "Mutations in Fibronectin Cause a Subtype of Spondylometaphyseal Dysplasia with \"Corner Fractures\"."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        To study functional consequences of these FN1 mutations on the protein level,
        we introduced three disease-associated missense variants
      explanation: >-
        States the purpose of the assay: to establish the protein-level consequence
        of the disease alleles, which is what makes it informative for this node.
discussions:
- discussion_id: smdcf_dominant_negative_versus_haploinsufficiency
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Deficient Extracellular Matrix Assembly in Cartilage and Bone
  prompt: >-
    Does the retained mutant fibronectin act by simple haploinsufficiency, or does it
    interfere with the wild-type protein or with the secretory pathway itself?
  rationale: >-
    The published functional work establishes that the mutant protein is not secreted
    but does not distinguish between the possible consequences. If half-normal
    extracellular fibronectin were sufficient to cause the disease, FN1 truncating
    and whole-gene deletion alleles should produce the same phenotype; the reported
    alleles are instead almost uniformly cysteine substitutions in one small region,
    which is the allelic signature of a dominant-negative or protein-accumulation
    mechanism rather than of simple dosage. The distinction is not academic: it
    determines whether any future therapy should aim to raise wild-type output or to
    clear the retained mutant.
  evidence:
  - reference: PMID:30599297
    reference_title: "Novel fibronectin mutations and expansion of the phenotype in spondylometaphyseal dysplasia with \"corner fractures\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All individuals shared a substitution of a cysteine residue, disrupting
      disulfide bonds in the FN type-I assembly domains located in the N-terminal
      assembly region.
    explanation: >-
      The narrowness and chemical uniformity of the allelic spectrum is the
      observation that makes simple haploinsufficiency an unlikely full explanation.
  proposed_experiments:
  - experiment_id: exp_smdcf_allelic_mechanism
    name: Compare null and missense FN1 alleles in a skeletal cell model
    description: >-
      Introduce a representative cysteine-substituting missense allele and a
      truncating allele heterozygously into human iPSC-derived chondrocytes and
      osteoblasts, and compare extracellular fibronectin matrix assembly, wild-type
      allele secretion, and endoplasmic reticulum stress markers against isogenic
      controls.
    would_support:
    - pathophysiology#Intracellular Retention and Failed Fibronectin Secretion
    supporting_outcome:
    - >-
      Impaired matrix assembly and reduced wild-type secretion in the missense line
      but not in the truncating line would establish a dominant-negative or
      retention-driven mechanism rather than dosage.
    would_refute:
    - pathophysiology#Intracellular Retention and Failed Fibronectin Secretion
    refuting_outcome:
    - >-
      Equivalent matrix phenotypes from missense and truncating alleles would reduce
      the mechanism to haploinsufficiency and make the cysteine clustering an
      ascertainment artefact.
- discussion_id: smdcf_entity_boundaries_col2a1_and_mcd_brussels
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - disease#Spondylometaphyseal Dysplasia Corner Fracture Type
  prompt: >-
    Is "SMD corner fracture type" one disorder, and where do the COL2A1-linked cases
    and metaphyseal chondrodysplasia Brussels type belong?
  rationale: >-
    The entity was defined radiographically decades before any gene was known, and
    the label has since accumulated cases attributed to FN1 and to COL2A1 — the
    latter not including the original Sutcliffe family. A separate report asks
    outright whether metaphyseal chondrodysplasia Brussels type and FN1-related SMD
    are the same disorder. The ISDS nosology and MONDO both encode the unresolved
    state rather than settling it: the nosology lists MIM 184255 in both the SMD group
    and the type 2 collagen group, and MONDO gives the class two parents. Any
    downstream analysis that treats this concept as a single gene-defined disease will
    be wrong about some of its members.
  evidence:
  - reference: PMID:33605604
    reference_title: "Automated reanalysis, a novel way to diagnose an ultra-rare condition: Fibronectin-1-related spondylometaphyseal dysplasia (SMD-FN1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We consider differences and similarities between MCD Brussels and SMD-FN1, by
      reviewing literature on both conditions and assess whether they are in fact the
      same disorder.
    explanation: The entity question is posed explicitly in the literature.
  - reference: PMID:29100092
    reference_title: "Mutations in Fibronectin Cause a Subtype of Spondylometaphyseal Dysplasia with \"Corner Fractures\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The severe scoliosis in most individuals and rare developmental coxa vara
      distinguish individuals with FN1 mutations from those with classical
      Sutcliffe-type SMD.
    explanation: >-
      The founding report already separates the FN1 cases from the classical entity
      on clinical grounds, which is the first evidence that the radiographic label
      covers more than one disorder.
  proposed_experiments:
  - experiment_id: exp_smdcf_genotype_stratified_radiographic_review
    name: Genotype-stratified radiographic review of the corner-fracture cohort
    description: >-
      Assemble the published and unpublished corner-fracture cases with molecular
      results, blind expert radiologists to genotype, and test whether FN1,
      COL2A1, and unsolved cases separate on radiographic criteria — including the
      Brussels-type cases.
    would_support:
    - disease#Spondylometaphyseal Dysplasia Corner Fracture Type
    supporting_outcome:
    - >-
      Reliable blinded radiographic separation of FN1 from COL2A1 cases would
      justify splitting the concept into gene-defined entities and retiring the
      shared MIM number.
    would_refute:
    - disease#Spondylometaphyseal Dysplasia Corner Fracture Type
    refuting_outcome:
    - >-
      Failure to separate them radiographically would support keeping a single
      radiographically defined entity with genetic heterogeneity, as the nosology
      and MONDO currently do.
progression: []
clinical_trials: []
datasets: []
notes: >-
  Curated as part of filling ISDS Nosology group 12 (Spondylometaphyseal
  dysplasias), which had no dismech entries. SMD Sutcliffe / corner fracture type is
  NOS 12-0030 in the 2023 revision. The entry is scoped to the radiographically
  defined entity rather than to FN1-related disease alone, because that is what both
  the nosology and MONDO:0008479 denote; the COL2A1-linked cases and the
  metaphyseal chondrodysplasia Brussels type question are carried as an explicit
  open entity-boundary discussion rather than being silently resolved either way.
  Fibronectin's better-known association with glomerulopathy with fibronectin
  deposits is a different FN1 allelic series and is not curated here.

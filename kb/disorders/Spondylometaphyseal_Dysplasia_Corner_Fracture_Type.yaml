name: Spondylometaphyseal dysplasia, corner fracture type
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Spondylometaphyseal dysplasia, corner fracture type (SMDCF, Sutcliffe type) is
  an autosomal dominant skeletal dysplasia in which the metaphyses acquire
  triangular ossification defects that look like healing corner fractures on
  radiography. Short stature and a waddling gait appear in early childhood,
  with developmental coxa vara, scoliosis and vertebral anomalies; limited joint
  mobility and chronic pain are common, and the FN1-related form carries a risk
  of glaucoma and hypertension that ordinary skeletal-dysplasia follow-up would
  not look for. The disorder is genetically split: heterozygous FN1 variants
  account for one subtype, COL2A1 variants for another. The FN1 lesion is
  unusually well characterised for so rare a disease - the disease variants
  substitute cysteine residues in the N-terminal assembly domains, disrupting
  disulfide bonds so the protein is retained intracellularly instead of being
  secreted, and patient fibroblasts assemble correspondingly less fibronectin
  matrix. The radiographic "fractures" are not fractures at all but a modelling
  defect, and in at least one patient the metaphyseal changes healed with
  skeletal maturation.
disease_term:
  preferred_term: spondylometaphyseal dysplasia, corner fracture type
  term:
    id: MONDO:0008479
    label: spondylometaphyseal dysplasia, 'corner fracture' type
parents:
- hereditary disease
synonyms:
- SMDCF
- SMD Sutcliffe type
- spondylometaphyseal dysplasia with corner fractures
classifications:
  isds_skeletal_category:
  - classification_value: spondylometaphyseal_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger,
      Ferreira, Mortier et al., PMID:36779427), Table 1 group 12
      "Spondylometaphyseal dysplasias (SMD)", row NOS 12-0030 "Spondylometaphyseal
      dysplasia Sutcliffe ('corner fractures' type), FN1-related" (MIM 184255,
      autosomal dominant). The nosology's row is gene-specific to FN1; the
      COL2A1-related cases with a corner-fracture radiographic appearance are
      curated here too, because clinical practice and GeneReviews treat SMDCF as
      one diagnosis confirmable by either gene, but the COL2A1 form overlaps the
      type 2 collagenopathies, which the nosology places in its own group.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Dominant, and somewhat more often de novo than inherited. Each child of an
    affected person has a 50% risk.
  evidence:
  - reference: PMID:32200603
    reference_title: "Spondylometaphyseal Dysplasia, Corner Fracture Type."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      SMDCF is inherited in an autosomal dominant manner. An individual with SMDCF may have an affected parent or, somewhat more frequently, may have the disorder as the result of a de novo pathogenic variant.
    explanation: >-
      GeneReviews statement of the inheritance pattern and the frequency of de
      novo occurrence.
  - reference: PMID:29100092
    reference_title: >-
      Mutations in Fibronectin Cause a Subtype of Spondylometaphyseal Dysplasia with "Corner Fractures".
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, using matching tools and the SkelDys emailing list, we identified other individuals with de novo FN1 variants and a similar phenotype.
    explanation: >-
      Documents the de novo FN1 variants in the discovery cohort.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    No population estimate exists; the FN1-related subtype was defined on a
    handful of individuals assembled through international matchmaking.
  evidence:
  - reference: PMID:29100092
    reference_title: >-
      Mutations in Fibronectin Cause a Subtype of Spondylometaphyseal Dysplasia with "Corner Fractures".
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By comparing the exomes of individuals with SMD with the radiographic appearance of "corner fractures" at metaphyses, we identified three individuals with fibronectin (FN1) variants affecting highly conserved residues.
    explanation: >-
      The size of the discovery cohort, indicating how few cases define the
      subtype.
pathophysiology:
- name: Cysteine-Substituting FN1 Variants in the N-Terminal Assembly Region
  biological_scale: MOLECULAR
  description: >-
    The reported SMDCF variants cluster in the N-terminal 70 kDa assembly region
    of fibronectin and share a mechanism: they substitute cysteine residues in
    the type-I assembly domains, disrupting the disulfide bonds that domain
    folding depends on. Five novel variants reported in one series were all
    cysteine substitutions in that region, which is a strong constraint for a
    gene as large as FN1.
  genes:
  - preferred_term: FN1
    term:
      id: hgnc:3778
      label: FN1
  evidence:
  - reference: PMID:30599297
    reference_title: >-
      Novel fibronectin mutations and expansion of the phenotype in spondylometaphyseal dysplasia with "corner fractures".
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All individuals shared a substitution of a cysteine residue, disrupting disulfide bonds in the FN type-I assembly domains located in the N-terminal assembly region.
    explanation: >-
      Establishes the shared variant class and its structural consequence.
  downstream:
  - target: Intracellular Retention of Mutant Fibronectin
    description: >-
      Misfolded mutant fibronectin is retained inside the cell rather than
      secreted.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29100092
      reference_title: >-
        Mutations in Fibronectin Cause a Subtype of Spondylometaphyseal Dysplasia with "Corner Fractures".
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The wild-type rF70K and rFN were secreted into the culture medium, whereas all mutant proteins were either not secreted or secreted at significantly lower amounts. Immunofluorescence analysis demonstrated increased intracellular retention of the mutant proteins.
      explanation: >-
        Recombinant expression experiments establishing the secretion defect
        directly.
- name: Intracellular Retention of Mutant Fibronectin
  biological_scale: CELLULAR
  description: >-
    Mutant fibronectin is held in the secretory pathway - specifically in the
    endoplasmic reticulum in patient dermal fibroblasts - so much less reaches
    the extracellular space. The effect is quantitative rather than absolute:
    mutant protein is detectable in patient plasma and culture medium, just at
    much lower abundance than wild type.
  biological_processes:
  - preferred_term: protein secretion
    modifier: DECREASED
    term:
      id: GO:0009306
      label: protein secretion
  evidence:
  - reference: PMID:30051459
    reference_title: >-
      Mechanistic insights into the cellular effects of a novel FN1 variant associated with a spondylometaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using mass spectroscopy, mutant FN was detected in plasma and in culture medium of primary dermal fibroblasts isolated from the patient, but mutant protein was much less abundant than wild-type FN.
    explanation: >-
      Patient-derived measurement showing the secretion defect is partial, not
      complete.
  - reference: PMID:30051459
    reference_title: >-
      Mechanistic insights into the cellular effects of a novel FN1 variant associated with a spondylometaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      mutant FN was preferentially retained within the endoplasmic reticulum
    explanation: >-
      Localises the retention to the endoplasmic reticulum in patient cells.
  downstream:
  - target: Deficient Fibronectin Matrix Assembly in Cartilage and Bone
    description: >-
      Less secreted fibronectin means less fibronectin matrix assembled, which
      patient fibroblasts demonstrate directly.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30051459
      reference_title: >-
        Mechanistic insights into the cellular effects of a novel FN1 variant associated with a spondylometaphyseal dysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Immunofluorescence and immunoblotting analyses show that mutant fibroblasts assemble significantly lower amounts of FN matrix than wild-type cells
      explanation: >-
        Direct measurement of reduced matrix assembly in patient cells.
- name: Deficient Fibronectin Matrix Assembly in Cartilage and Bone
  biological_scale: TISSUE
  description: >-
    Fibronectin is the master organiser of extracellular matrix, nucleating the
    assembly of collagens and fibrillin-1, and it is secreted in the skeleton by
    osteoblasts, chondrocytes and mesenchymal cells. Reduced fibronectin matrix
    therefore degrades the scaffold on which cartilage and bone matrix is built,
    which is why a ubiquitously expressed matrix protein produces a
    skeleton-restricted disease.
  biological_processes:
  - preferred_term: extracellular matrix assembly
    modifier: DECREASED
    term:
      id: GO:0085029
      label: extracellular matrix assembly
  evidence:
  - reference: PMID:29100092
    reference_title: >-
      Mutations in Fibronectin Cause a Subtype of Spondylometaphyseal Dysplasia with "Corner Fractures".
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Fibronectin is a master organizer of extracellular matrices (ECMs) and promotes the assembly of collagens, fibrillin-1, and other proteins. It is also known to play roles in skeletal tissues through its secretion by osteoblasts, chondrocytes, and mesenchymal cells.
    explanation: >-
      Establishes fibronectin's matrix-organising role and its skeletal cellular
      sources, the basis for this node.
  downstream:
  - target: Metaphyseal Ossification Defect Resembling Corner Fractures
    description: >-
      A defective matrix scaffold at the metaphysis produces the irregular
      ossification that mimics corner fractures radiographically.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30599297
      reference_title: >-
        Novel fibronectin mutations and expansion of the phenotype in spondylometaphyseal dysplasia with "corner fractures".
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The abnormal metaphyseal ossification and "corner fracture" appearances were the most remarkable clinical feature in these patients.
      explanation: >-
        Names abnormal metaphyseal ossification as the lesion behind the
        radiographic appearance.
- name: Metaphyseal Ossification Defect Resembling Corner Fractures
  biological_scale: TISSUE
  description: >-
    Enlarged metaphyses with triangular ossification defects at their margins,
    giving the appearance of healing corner fractures. The name is a
    radiographic description, not a mechanism: these are modelling defects, and
    in one reported patient the distal femoral changes healed with skeletal
    maturation.
  evidence:
  - reference: PMID:32200603
    reference_title: "Spondylometaphyseal Dysplasia, Corner Fracture Type."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Radiographic features include enlargement and corner fracture-like lesions of the metaphyses, developmental coxa vara, shortened long bones, scoliosis, and vertebral anomalies.
    explanation: >-
      GeneReviews description of the radiographic pattern.
  - reference: PMID:30599297
    reference_title: >-
      Novel fibronectin mutations and expansion of the phenotype in spondylometaphyseal dysplasia with "corner fractures".
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, the distal femoral changes in this patient healed with skeletal maturation.
    explanation: >-
      Documents resolution of the metaphyseal changes with maturity, which is
      what shows these are modelling defects rather than true fractures.
  downstream:
  - target: Short Stature with Coxa Vara, Scoliosis and Joint Disease
    description: >-
      Metaphyseal and vertebral modelling failure produces the clinical skeletal
      syndrome.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32200603
      reference_title: "Spondylometaphyseal Dysplasia, Corner Fracture Type."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Spondylometaphyseal dysplasia, corner fracture type (SMDCF) is a skeletal dysplasia characterized by short stature and a waddling gait in early childhood.
      explanation: >-
        Names the clinical presentation this edge produces.
- name: Short Stature with Coxa Vara, Scoliosis and Joint Disease
  biological_scale: ORGANISM
  description: >-
    Short stature, present at birth or developing in early infancy, with a
    waddling gait, developmental coxa vara, severe scoliosis, limited joint
    mobility and chronic pain. Severe scoliosis and developmental coxa vara are
    what distinguish FN1-related disease from the classical Sutcliffe-type
    description.
  evidence:
  - reference: PMID:32200603
    reference_title: "Spondylometaphyseal Dysplasia, Corner Fracture Type."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Short stature may be present at birth or develop in early infancy. Individuals may present with short limbs and/or short trunk. Radiographic features include enlargement and corner fracture-like lesions of the metaphyses, developmental coxa vara, shortened long bones, scoliosis, and vertebral anomalies. Limited joint mobility and chronic pain are common.
    explanation: >-
      GeneReviews description of the expressed clinical syndrome.
  - reference: PMID:29100092
    reference_title: >-
      Mutations in Fibronectin Cause a Subtype of Spondylometaphyseal Dysplasia with "Corner Fractures".
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The severe scoliosis in most individuals and rare developmental coxa vara distinguish individuals with FN1 mutations from those with classical Sutcliffe-type SMD.
    explanation: >-
      Source for the gene-specific clinical distinction noted here.

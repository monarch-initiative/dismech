biochemical: []
genetic:
- name: FN1
  association: Causal monoallelic variant
  gene_term:
    preferred_term: FN1
    term:
      id: hgnc:3778
      label: FN1
  notes: >-
    Heterozygous missense variants, characteristically substituting cysteine
    residues in the N-terminal type-I assembly domains. Reported alleles include
    p.Cys87Phe, p.Tyr240Asp, p.Cys260Gly, p.Cys97Trp, p.Cys123Tyr, p.Cys169Tyr,
    p.Cys213Tyr, p.Cys231Trp and p.Cys258Tyr.
  evidence:
  - reference: PMID:29100092
    reference_title: >-
      Mutations in Fibronectin Cause a Subtype of Spondylometaphyseal Dysplasia with "Corner Fractures".
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, FN1 mutations that cause defective fibronectin secretion are found in SMD, and we thus provide additional evidence for a critical function of fibronectin in cartilage and bone.
    explanation: >-
      Establishes FN1 as causal with the secretion mechanism.
  - reference: PMID:30599297
    reference_title: >-
      Novel fibronectin mutations and expansion of the phenotype in spondylometaphyseal dysplasia with "corner fractures".
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report five patients affected by this subtype of SMD-CF caused by five novel FN1 missense mutations: p.Cys123Tyr, p.Cys169Tyr, p.Cys213Tyr, p.Cys231Trp and p.Cys258Tyr.
    explanation: >-
      Source for the reported allele list and their shared cysteine-substituting
      character.
- name: COL2A1
  association: Causal monoallelic variant in a second subtype
  gene_term:
    preferred_term: COL2A1
    term:
      id: hgnc:2200
      label: COL2A1
  notes: >-
    The other gene in which a heterozygous variant confirms SMDCF clinically.
    The ISDS nosology places the type 2 collagenopathies in their own group, so
    a COL2A1-positive patient with a corner-fracture radiographic appearance sits
    at a boundary the nosology draws differently from the clinic.
  evidence:
  - reference: PMID:32200603
    reference_title: "Spondylometaphyseal Dysplasia, Corner Fracture Type."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Identification of a heterozygous pathogenic variant in COL2A1 or FN1 by molecular genetic testing can confirm the diagnosis if radiographic features are inconclusive.
    explanation: >-
      GeneReviews names both genes as diagnostically confirmatory.

diagnosis:
- name: Clinical and radiographic diagnosis
  description: >-
    Established on short stature with corner fracture-like metaphyseal lesions,
    developmental coxa vara and vertebral anomalies, without needing molecular
    confirmation when the radiographs are characteristic.
  presence: >-
    Short stature with corner fracture-like lesions, developmental coxa vara and
    vertebral anomalies.
  diagnosis_term:
    preferred_term: X-ray imaging
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:32200603
    reference_title: "Spondylometaphyseal Dysplasia, Corner Fracture Type."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of SMDCF is established in a proband with characteristic clinical and radiographic features including short stature, corner fracture-like lesions, developmental coxa vara, and vertebral anomalies.
    explanation: >-
      GeneReviews diagnostic criteria.
- name: FN1 and COL2A1 sequencing
  description: >-
    Molecular testing confirms the diagnosis when radiographs are inconclusive,
    and it also determines whether the ophthalmologic and blood-pressure
    surveillance specific to FN1-related disease applies.
  results: >-
    A heterozygous FN1 or COL2A1 pathogenic variant.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:32200603
    reference_title: "Spondylometaphyseal Dysplasia, Corner Fracture Type."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Identification of a heterozygous pathogenic variant in COL2A1 or FN1 by molecular genetic testing can confirm the diagnosis if radiographic features are inconclusive.
    explanation: >-
      GeneReviews statement of the role and genes of molecular testing.
differential_diagnoses:
- name: Non-accidental injury
  description: >-
    The radiographic appearance is of metaphyseal corner fractures, which in a
    young child is a classic marker of inflicted injury. The distinguishing
    features are that the lesions are symmetric, are accompanied by short stature
    and vertebral anomalies, and do not behave like fractures over time - in one
    reported patient they healed with skeletal maturation instead.
  distinguishing_features:
  - Symmetric metaphyseal lesions with vertebral anomalies and short stature
  - Lesions persist or resolve with growth rather than healing on a fracture timescale
  - A heterozygous FN1 or COL2A1 variant is identified
  evidence:
  - reference: PMID:30599297
    reference_title: >-
      Novel fibronectin mutations and expansion of the phenotype in spondylometaphyseal dysplasia with "corner fractures".
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most striking feature characterizing SMD-CF is irregularly shaped metaphyses giving the appearance of "corner fractures".
    explanation: >-
      Establishes that the finding is an appearance rather than a fracture,
      which is the whole basis of this differential.
- name: Type 2 collagenopathy
  description: >-
    COL2A1-related skeletal dysplasias overlap the corner-fracture phenotype
    substantially, and a COL2A1 variant is itself diagnostic of SMDCF in current
    practice, so this is a boundary rather than a clean differential.
  distinguishing_features:
  - FN1 rather than COL2A1 as the causal gene
  - Severe scoliosis and developmental coxa vara favour the FN1 subtype
  evidence:
  - reference: PMID:32200603
    reference_title: "Spondylometaphyseal Dysplasia, Corner Fracture Type."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Identification of a heterozygous pathogenic variant in COL2A1 or FN1 by molecular genetic testing can confirm the diagnosis if radiographic features are inconclusive.
    explanation: >-
      Documents that COL2A1 confirms the same clinical diagnosis, which is what
      makes this a boundary case.

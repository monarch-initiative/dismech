name: Spondylometaphyseal Dysplasia Corner Fracture Type
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Spondylometaphyseal dysplasia with "corner fractures", also called the Sutcliffe
  type (SMD-CF; OMIM #184255), is an ultra-rare skeletal dysplasia whose defining
  radiographic sign is a flake-like, triangular, or curvilinear ossification centre
  at the edge of an irregular metaphysis that mimics a healing fracture but is not
  one. Most molecularly solved cases carry heterozygous, usually de novo, missense
  variants in FN1, encoding fibronectin — the master organiser of extracellular
  matrix that promotes assembly of collagens and fibrillin-1 and is secreted by
  osteoblasts, chondrocytes, and mesenchymal cells. The pathogenic alleles cluster
  in the N-terminal 70 kDa assembly region and overwhelmingly substitute cysteine
  residues, breaking disulfide bonds in the type-I assembly domains; the mutant
  protein is retained intracellularly and secreted poorly or not at all, so the
  mechanism is a secretion defect rather than a defect of matrix binding. Severe
  scoliosis and developmental coxa vara distinguish the FN1 cases from classical
  Sutcliffe-type SMD, and generalised skeletal fragility with low-trauma femoral
  fracture has been reported once. FN1 does not account for every case: some are
  linked to COL2A1 — though not the original Sutcliffe family — which is why MONDO
  places this concept under both spondylometaphyseal dysplasia and the type 2
  collagenopathies.
disease_term:
  preferred_term: spondylometaphyseal dysplasia, corner fracture type
  term:
    id: MONDO:0008479
    label: spondylometaphyseal dysplasia, 'corner fracture' type
synonyms:
- SMDCF
- SMD-CF
- SMD-FN1
- Spondylometaphyseal dysplasia, Sutcliffe type
- Sutcliffe type of spondylometaphyseal dysplasia
- FN1-related spondylometaphyseal dysplasia
- Spondylometaphyseal dysplasia with corner fractures
parents:
- Skeletal Dysplasia
classifications:
  isds_skeletal_category:
  - classification_value: spondylometaphyseal_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), Table 1 group 12 "Spondylometaphyseal dysplasias (SMD)",
      entry NOS 12-0030, listed as "Spondylometaphyseal dysplasia Sutcliffe (or
      'corner fractures' type), FN1-related" (AD, FN1, MIM 184255). The nosology's
      own note on this row reads "Some cases are linked to COL2A1 but not the
      original family", which is the same ambiguity MONDO encodes by giving
      MONDO:0008479 both a spondylometaphyseal dysplasia and a type 2 collagenopathy
      parent. The group assignment follows the nosology's placement of the disorder
      as a whole and is not a claim that every case is FN1-related. Note that MIM
      184255 is also cited in the nosology under NOS 02-0050 in the type 2 collagen
      group, so this MIM number is deliberately gene-split across two groups.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  rate_per_100000: 0.0
  notes: >-
    Counts depend on whether the radiographic entity or the FN1 genotype is being
    tallied: about 45 individuals with SMDCF had been described by 2020, while
    fifteen molecularly confirmed FN1 patients were on record when a 2021 case
    report counted them. The gene was identified only in 2017; before that the
    entity was defined radiographically, so the historical, molecularly unsolved
    caseload is unknown. No population-based prevalence figure exists;
    rate_per_100000 is recorded as 0.0 only to mark that the true rate is far below
    the resolution of any published survey.
  evidence:
  - reference: PMID:33605604
    reference_title: "Automated reanalysis, a novel way to diagnose an ultra-rare condition: Fibronectin-1-related spondylometaphyseal dysplasia (SMD-FN1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      compare her findings with the previous 15 patients reported with SMD-FN1
    explanation: >-
      Places the published FN1-related caseload at fifteen before the reported
      patient, giving the cases-in-literature scale.
  - reference: PMID:42027587
    reference_title: A novel mutation in FN1 causing spondylometaphyseal dysplasia corner fracture type in a multigenerational family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in 2020, only 45 individuals had been described
    explanation: >-
      The larger count for the radiographically defined entity, which is why this
      record gives both figures rather than a single number.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    FN1-related SMD-CF is autosomal dominant. The founding series and several
    subsequent reports were de novo, which for some years made the disorder look
    effectively sporadic; a 2026 report of a multigenerational family with the
    variant segregating through four affected members shows that transmitted
    disease also occurs, and that affected adults reach reproductive age. Both
    origins therefore have to be considered when counselling a newly diagnosed
    proband.
  evidence:
  - reference: PMID:29100092
    reference_title: "Mutations in Fibronectin Cause a Subtype of Spondylometaphyseal Dysplasia with \"Corner Fractures\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, using matching tools and the SkelDys emailing list, we identified
      other individuals with de novo FN1 variants and a similar phenotype.
    explanation: >-
      De novo occurrence in independently ascertained individuals establishes
      dominant, largely sporadic inheritance.
  - reference: PMID:33605604
    reference_title: "Automated reanalysis, a novel way to diagnose an ultra-rare condition: Fibronectin-1-related spondylometaphyseal dysplasia (SMD-FN1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a heterozygous de novo missense variant in FN1 (c.675C>G p.(Cys225Trp), which
      was likely pathogenic
    explanation: A further independently ascertained de novo heterozygous allele.
  - reference: PMID:42027587
    reference_title: A novel mutation in FN1 causing spondylometaphyseal dysplasia corner fracture type in a multigenerational family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analysis showed a novel heterozygous variant in the fibronectin 1 gene
      (FN1) which mapped to 4 affected family members.
    explanation: >-
      Dominant transmission through four affected members of one family, which is
      what establishes that the disorder is not exclusively de novo.
genetic:
- name: Heterozygous FN1 Missense Variants in the N-Terminal Assembly Region
  gene_term:
    preferred_term: FN1
    term:
      id: hgnc:3778
      label: FN1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Pathogenic alleles are heterozygous missense variants affecting highly
    conserved residues in the N-terminal 70 kDa assembly region of fibronectin.
    They are strikingly stereotyped: p.Cys123Tyr, p.Cys169Tyr, p.Cys213Tyr,
    p.Cys225Trp, p.Cys231Trp, p.Cys258Tyr, p.Cys260Gly, and p.Cys87Phe all
    substitute a cysteine and so break a disulfide bond in a fibronectin type-I
    assembly domain. p.Tyr240Asp is the reported exception to the cysteine rule
    while remaining in the same region.
  evidence:
  - reference: PMID:29100092
    reference_title: "Mutations in Fibronectin Cause a Subtype of Spondylometaphyseal Dysplasia with \"Corner Fractures\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By comparing the exomes of individuals with SMD with the radiographic
      appearance of "corner fractures" at metaphyses, we identified three
      individuals with fibronectin (FN1) variants affecting highly conserved
      residues.
    explanation: The gene-discovery result, from a radiographically defined cohort.
  - reference: PMID:30599297
    reference_title: "Novel fibronectin mutations and expansion of the phenotype in spondylometaphyseal dysplasia with \"corner fractures\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All individuals shared a substitution of a cysteine residue, disrupting
      disulfide bonds in the FN type-I assembly domains located in the N-terminal
      assembly region.
    explanation: >-
      Establishes the cysteine-substitution, disulfide-disrupting pattern that
      unifies the allelic spectrum and localises it to the assembly region.
pathophysiology:
- name: Heterozygous FN1 Assembly-Domain Missense Variant
  biological_scale: MOLECULAR
  description: >-
    A single heterozygous missense allele, almost always replacing a cysteine in an
    N-terminal fibronectin type-I assembly domain. The substitution leaves an
    unpaired cysteine and an undone disulfide bond in a domain whose fold depends on
    it.
  genes:
  - preferred_term: FN1
    term:
      id: hgnc:3778
      label: FN1
  evidence:
  - reference: PMID:30599297
    reference_title: "Novel fibronectin mutations and expansion of the phenotype in spondylometaphyseal dysplasia with \"corner fractures\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report five patients affected by this subtype of SMD-CF caused by five
      novel FN1 missense mutations: p.Cys123Tyr, p.Cys169Tyr, p.Cys213Tyr,
      p.Cys231Trp and p.Cys258Tyr.
    explanation: >-
      Five independent alleles, all cysteine substitutions, define the initiating
      lesion.
  downstream:
  - target: Intracellular Retention and Failed Fibronectin Secretion
    causal_link_type: DIRECT
    description: >-
      Recombinant expression of the disease alleles, in both the secreted N-terminal
      70 kDa fragment and full-length fibronectin, shows that the mutant proteins
      are not secreted or are secreted at significantly reduced levels, and are
      retained inside the cell.
    evidence:
    - reference: PMID:29100092
      reference_title: "Mutations in Fibronectin Cause a Subtype of Spondylometaphyseal Dysplasia with \"Corner Fractures\"."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The wild-type rF70K and rFN were secreted into the culture medium, whereas
        all mutant proteins were either not secreted or secreted at significantly
        lower amounts.
      explanation: >-
        A direct functional demonstration that the variants act by blocking
        secretion.
- name: Intracellular Retention and Failed Fibronectin Secretion
  biological_scale: MOLECULAR
  description: >-
    The mutant fibronectin accumulates inside the cell instead of reaching the
    extracellular space. Immunofluorescence shows increased intracellular retention
    of the mutant proteins. This is the reason the disorder is best understood as a
    secretion defect rather than as a defect in the matrix-binding properties of
    fibronectin itself.
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  biological_processes:
  - preferred_term: protein secretion
    modifier: DECREASED
    term:
      id: GO:0009306
      label: protein secretion
  evidence:
  - reference: PMID:29100092
    reference_title: "Mutations in Fibronectin Cause a Subtype of Spondylometaphyseal Dysplasia with \"Corner Fractures\"."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunofluorescence analysis demonstrated increased intracellular retention of
      the mutant proteins.
    explanation: Localises the mutant protein inside the cell rather than in the matrix.
  downstream:
  - target: Vesicular Accumulation and Cellular Stress in Mesenchymal Stem Cells
    causal_link_type: DIRECT
    description: >-
      The retained protein is not inert. In patient-derived mesenchymal stem cells it
      accumulates with the endoplasmic reticulum chaperones BIP and HSP47 inside
      ribosome-covered cytosolic vesicles budding from the ER, most of which are
      never cleared.
    evidence:
    - reference: PMID:39367925
      reference_title: Mutations in fibronectin dysregulate chondrogenesis in skeletal dysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        FN and endoplasmic reticulum (ER) protein folding chaperones (BIP, HSP47)
        accumulated in MSCs within ribosome-covered cytosolic vesicles that emerged
        from the ER.
      explanation: >-
        Identifies the subcellular fate of the retained protein in the cell type
        where the disorder acts.
  - target: Deficient Extracellular Matrix Assembly in Cartilage and Bone
    causal_link_type: DIRECT
    description: >-
      Fibronectin that never reaches the extracellular space cannot nucleate matrix
      assembly. Because fibronectin organises the deposition of collagens and
      fibrillin-1, the consequence is not the loss of one matrix component but a
      failure of the assembly step on which several depend. The extracellular deficit
      is systemic as well as local: circulating fibronectin is reduced in patient
      plasma.
    evidence:
    - reference: PMID:39367925
      reference_title: Mutations in fibronectin dysregulate chondrogenesis in skeletal dysplasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Analyses of plasma samples from SMDCF patients also showed reduced FN in
        circulation.
      explanation: >-
        Confirms in patients that the secretion defect measured in vitro produces a
        real extracellular deficit.
    - reference: PMID:29100092
      reference_title: "Mutations in Fibronectin Cause a Subtype of Spondylometaphyseal Dysplasia with \"Corner Fractures\"."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Fibronectin is a master organizer of extracellular matrices (ECMs) and
        promotes the assembly of collagens, fibrillin-1, and other proteins.
      explanation: >-
        Establishes the organising role whose loss makes a secretion defect a
        matrix-assembly defect.
- name: Vesicular Accumulation and Cellular Stress in Mesenchymal Stem Cells
  biological_scale: CELLULAR
  description: >-
    Undegraded fibronectin-and-chaperone vesicles build up in the cytosol of
    patient-derived mesenchymal stem cells, a subset acquiring lysosomal markers.
    Cellular stress markers rise and mitochondrial structure is altered, and bulk RNA
    sequencing shows a transcriptomic profile specific to the patient cells. This is
    the second arm of the mechanism, distinct from simple extracellular deficiency:
    the mutant protein does harm inside the cell as well as failing to act outside
    it, which is the strongest argument yet that the disorder is not plain
    haploinsufficiency.
  cell_types:
  - preferred_term: mesenchymal stem cell
    term:
      id: CL:0000134
      label: mesenchymal stem cell
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    modifier: INCREASED
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
  evidence:
  - reference: PMID:39367925
    reference_title: Mutations in fibronectin dysregulate chondrogenesis in skeletal dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The accumulation of intracellular FN and ER proteins elevated cellular stress
      markers and altered mitochondrial structure.
    explanation: >-
      Establishes that the retained protein imposes a measurable cellular stress
      burden rather than being silently sequestered.
  downstream:
  - target: Impaired Mesenchymal Condensation and Chondrogenesis
    causal_link_type: DIRECT
    description: >-
      Mutant mesenchymal stem cells condense poorly, express fewer chondrogenic
      markers, and proliferate less on differentiation to chondrocytes.
    evidence:
    - reference: PMID:39367925
      reference_title: Mutations in fibronectin dysregulate chondrogenesis in skeletal dysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Analysis of MSC differentiation into chondrocytes showed impaired mesenchymal
        condensation, reduced chondrogenic markers, and compromised cell
        proliferation in mutant cells.
      explanation: >-
        The cellular endpoint that connects the secretion defect to a growth-plate
        phenotype, measured in a patient-derived system.
- name: Impaired Mesenchymal Condensation and Chondrogenesis
  biological_scale: CELLULAR
  description: >-
    Mesenchymal condensation is the first committed step of skeletogenesis, and it
    fails in FN1-mutant cells. The proximate reason appears to be a shortfall of
    TGF-beta-1, which mutant cells express at significantly lower levels and which
    condensation requires. The finding is reversible in vitro: supplying either
    exogenous fibronectin or TGF-beta-1 restores condensation and promotes
    chondrogenesis, which makes this the first identified point of pharmacological
    leverage in the disorder.
  cell_types:
  - preferred_term: mesenchymal stem cell
    term:
      id: CL:0000134
      label: mesenchymal stem cell
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  - preferred_term: chondrocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0002062
      label: chondrocyte differentiation
  evidence:
  - reference: PMID:39367925
    reference_title: Mutations in fibronectin dysregulate chondrogenesis in skeletal dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, FN mutant cells exhibited significantly lower transforming growth
      factor beta-1 (TGFβ1) expression, crucial for mesenchymal condensation.
    explanation: >-
      Identifies reduced TGF-beta-1 as the signalling deficit behind the condensation
      failure; the same sentence notes TGF-beta-1 is crucial for mesenchymal
      condensation.
  - reference: PMID:39367925
    reference_title: Mutations in fibronectin dysregulate chondrogenesis in skeletal dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Exogenous FN or TGFβ1 supplementation effectively improved the MSC condensation
      and promoted chondrogenesis in FN mutant cells.
    explanation: >-
      The rescue experiment, and the first point of pharmacological leverage
      identified in this disorder: the condensation defect is reversible in vitro by
      supplying either the missing matrix protein or the growth factor downstream of
      it.
  downstream:
  - target: Abnormal Metaphyseal Ossification
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Failure of condensation and chondrogenesis at the growth plate is the cellular
      route from the secretion defect to the metaphyseal lesion. The intervening
      growth-plate steps are not directly observed in this system, which uses
      patient-derived cells rather than growth-plate tissue.
- name: Deficient Extracellular Matrix Assembly in Cartilage and Bone
  biological_scale: TISSUE
  description: >-
    Fibronectin is secreted in skeletal tissue by osteoblasts, chondrocytes, and
    mesenchymal cells, so a secretion defect acts locally in exactly the
    compartments where the disease manifests. The failure is of matrix assembly at
    sites of active endochondral growth.
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: mesenchymal stem cell
    term:
      id: CL:0000134
      label: mesenchymal stem cell
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: PMID:29100092
    reference_title: "Mutations in Fibronectin Cause a Subtype of Spondylometaphyseal Dysplasia with \"Corner Fractures\"."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is also known to play roles in skeletal tissues through its secretion by
      osteoblasts, chondrocytes, and mesenchymal cells.
    explanation: >-
      Identifies the skeletal cell types that secrete fibronectin and therefore the
      tissue in which the defect acts.
  downstream:
  - target: Abnormal Metaphyseal Ossification
    causal_link_type: DIRECT
    description: >-
      Disordered matrix assembly at the growth plate produces irregular metaphyseal
      ossification, the primary radiographic lesion.
    evidence:
    - reference: PMID:30599297
      reference_title: "Novel fibronectin mutations and expansion of the phenotype in spondylometaphyseal dysplasia with \"corner fractures\"."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The abnormal metaphyseal ossification and "corner fracture" appearances were
        the most remarkable clinical feature in these patients.
      explanation: >-
        Names abnormal metaphyseal ossification as the dominant clinical-radiographic
        finding.
  - target: Reduced Bone Strength
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A single reported patient had generalised skeletal fragility with low-trauma
      bilateral femoral fractures, which the authors take as a signal that
      fibronectin may also maintain bone strength. This is one observation in one
      patient and is curated as a hypothesis, not an established feature.
    evidence:
    - reference: PMID:30599297
      reference_title: "Novel fibronectin mutations and expansion of the phenotype in spondylometaphyseal dysplasia with \"corner fractures\"."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        emphasizes the importance of FN in bone formation and possibly also in the
        maintenance of bone strength
      explanation: >-
        The authors' own hedged phrasing — "possibly also" — is why this edge is
        graded PARTIAL with unknown intermediates.
- name: Abnormal Metaphyseal Ossification
  biological_scale: TISSUE
  description: >-
    Irregularly shaped metaphyses carrying flake-like, triangular, or curvilinear
    ossification centres at their edges. The appearance simulates a healing corner
    fracture, which is the source of the disorder's name and of its main diagnostic
    hazard: a child with these radiographs has repeatedly been investigated for
    non-accidental injury. The changes involve the distal tibia, the ulnar aspect of
    the distal radius, and the proximal humerus and femur, and in at least one
    patient the distal femoral changes healed with skeletal maturation.
  biological_processes:
  - preferred_term: ossification
    modifier: ABNORMAL
    term:
      id: GO:0001503
      label: ossification
  evidence:
  - reference: PMID:30599297
    reference_title: "Novel fibronectin mutations and expansion of the phenotype in spondylometaphyseal dysplasia with \"corner fractures\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most striking feature characterizing SMD-CF is irregularly shaped
      metaphyses giving the appearance of "corner fractures".
    explanation: Defines the primary radiographic lesion.
  - reference: PMID:30599297
    reference_title: "Novel fibronectin mutations and expansion of the phenotype in spondylometaphyseal dysplasia with \"corner fractures\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, the distal femoral changes in this patient healed with skeletal
      maturation.
    explanation: >-
      Documents that the metaphyseal lesion is not necessarily permanent, which
      matters for the natural history.
  downstream:
  - target: Metaphyseal Corner Fracture Appearance
    causal_link_type: DIRECT
    description: >-
      The flake-like, triangular, or curvilinear marginal ossification centres that
      name the disorder are the direct radiographic read-out of this node.
  - target: Short Stature
    causal_link_type: DIRECT
    description: >-
      Disordered ossification across the growth plates reduces stature, one of the
      general features of the spondylometaphyseal dysplasias.
  - target: Vertebral Change and Progressive Deformity
    causal_link_type: DIRECT
    description: >-
      Alongside the metaphyseal lesion, ovoid vertebral bodies, developmental coxa
      vara, and severe scoliosis make up the secondary skeletal phenotype.
    evidence:
    - reference: PMID:30599297
      reference_title: "Novel fibronectin mutations and expansion of the phenotype in spondylometaphyseal dysplasia with \"corner fractures\"."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        An array of secondary features, including developmental coxa vara, ovoid
        vertebral bodies and severe scoliosis, may also be present.
      explanation: Names the three secondary skeletal features.
- name: Vertebral Change and Progressive Deformity
  biological_scale: ORGANISM
  description: >-
    Ovoid vertebral bodies with severe scoliosis and developmental coxa vara. Severe
    scoliosis in most individuals, together with the rare coxa vara, is what
    separates the FN1 cases from classical Sutcliffe-type SMD.
  evidence:
  - reference: PMID:29100092
    reference_title: "Mutations in Fibronectin Cause a Subtype of Spondylometaphyseal Dysplasia with \"Corner Fractures\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The severe scoliosis in most individuals and rare developmental coxa vara
      distinguish individuals with FN1 mutations from those with classical
      Sutcliffe-type SMD.
    explanation: >-
      Establishes that the FN1 subtype is clinically separable from the classical
      radiographic entity.
  downstream:
  - target: Ovoid Vertebral Bodies
    causal_link_type: DIRECT
    description: The vertebral body shape abnormality of the dysplasia.
  - target: Severe Scoliosis
    causal_link_type: DIRECT
    description: >-
      Severe scoliosis in most individuals with FN1 variants, one of the two features
      separating them from classical Sutcliffe-type SMD.
  - target: Developmental Coxa Vara
    causal_link_type: DIRECT
    description: >-
      Postnatal reduction of the femoral neck-shaft angle, rare within the FN1 group
      but pointing away from the classical entity when present.
  - target: Os Odontoideum with Cervical Instability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Odontoid anomaly has been reported once, in a girl who presented at 11.9 years
      with acute quadriparesis from cord compression. Vertebral change is established
      in this disorder and the odontoid is a vertebral ossification centre, but the
      report is explicit that odontoid abnormalities had not previously been
      described here, so a single case cannot establish the link as a regular
      consequence.
    evidence:
    - reference: PMID:37940834
      reference_title: Unexpected findings in cervical spine in spondylometaphyseal dysplasia Sutcliff type FN1-related.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Vertebral changes as delayed vertebral ossification, ovoid vertebral bodies,
        anterior vertebral wedging, and platyspondyly have been observed in this
        condition, while odontoid abnormalities have not been reported.
      explanation: >-
        States both the established vertebral spectrum and that the odontoid anomaly
        falls outside it, which is why the edge is hedged.
- name: Reduced Bone Strength
  biological_scale: ORGANISM
  description: >-
    Generalised skeletal fragility with low-trauma bilateral femoral fractures was
    identified in one of five patients in the expansion series. Whether reduced bone
    strength is a genuine part of the FN1 phenotype or an isolated observation is
    not resolved, and the distinction matters clinically because a fragility fracture
    on top of pseudo-fracture radiographs compounds the risk of a mistaken child
    protection referral.
  evidence:
  - reference: PMID:30599297
    reference_title: "Novel fibronectin mutations and expansion of the phenotype in spondylometaphyseal dysplasia with \"corner fractures\"."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, generalized skeletal fragility with low-trauma bilateral femoral
      fractures was identified in one patient.
    explanation: >-
      A single-patient observation, which is why the node is curated as provisional
      rather than as an established feature.
  - reference: PMID:42027587
    reference_title: A novel mutation in FN1 causing spondylometaphyseal dysplasia corner fracture type in a multigenerational family.

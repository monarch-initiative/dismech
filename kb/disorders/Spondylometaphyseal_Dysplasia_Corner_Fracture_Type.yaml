datasets: []
notes: >-
  Curated as part of filling ISDS Nosology group 12 (Spondylometaphyseal
  dysplasias), which had no dismech entries. SMD Sutcliffe / corner fracture type is
  NOS 12-0030 in the 2023 revision. The entry is scoped to the radiographically
  defined entity rather than to FN1-related disease alone, because that is what both
  the nosology and MONDO:0008479 denote; the COL2A1-linked cases and the
  metaphyseal chondrodysplasia Brussels type question are carried as an explicit

notes: >-
  Curated for ISDS Nosology group 12 (Spondylometaphyseal dysplasias), row
  NOS 12-0030. The nosology row is FN1-specific; the COL2A1-related form is
  recorded in the genetic section with an explicit note that the nosology places
  the type 2 collagenopathies in a different group, so the entry does not
  silently import a classification decision the committee did not make.

  title: "Molybdenum Cofactor Deficiency"
  tags:
  - GeneReviews
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic MOCS1 variants. Homozygosity was common in the largest natural history cohort,
    consistent with the consanguinity that typically brings ultra-rare recessive disease to
    attention.
  evidence:
  - reference: PMID:34870926
    reference_title: "Molybdenum Cofactor Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molybdenum cofactor deficiency (MoCD) is inherited in an autosomal recessive
      manner"
    explanation: >-
      The inheritance mode, from the GeneReviews chapter.
  - reference: PMID:35192225
    reference_title: "Molybdenum cofactor deficiency: A natural history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MOCS1 mutation homozygosity was common"
    explanation: >-
      Records that homozygous MOCS1 genotypes predominate in the reported cohort.

pathophysiology:

- name: MOCS1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion, and its position in the pathway is what makes this subtype
    treatable. Molybdenum cofactor is built in three steps by the products of MOCS1, MOCS2,
    MOCS3 and GPHN. MOCS1 catalyzes the first of them, the conversion of GTP into cyclic
    pyranopterin monophosphate. A block at step one leaves every downstream step intact and
    starved of substrate - which is precisely the situation a substrate can be given back
    into.
  genes:
  - preferred_term: MOCS1
    term:
      id: hgnc:7190
      label: MOCS1
  biological_processes:
  - preferred_term: Mo-molybdopterin cofactor biosynthetic process
    term:
      id: GO:0006777
      label: Mo-molybdopterin cofactor biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:36296488
    reference_title: "Molybdenum Cofactor Deficiency in Humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The first step in Moco biosynthesis, the conversion of GTP into cPMP, is
      catalyzed by two proteins encoded by the MOCS1 locus"
    explanation: >-
      Places MOCS1 at the first step and names the product whose absence defines the block.
  - reference: PMID:36296488
    reference_title: "Molybdenum Cofactor Deficiency in Humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moco is synthesized by a three-step biosynthetic pathway that involves the
      gene products of MOCS1, MOCS2, MOCS3, and GPHN"
    explanation: >-
      The pathway architecture that separates type A from types B and C.
  downstream:
  - target: Absent Molybdenum Cofactor and Combined Molybdoenzyme Failure
    causal_link_type: DIRECT
    description: >-
      No cofactor means no active molybdoenzyme of any kind.

- name: Absent Molybdenum Cofactor and Combined Molybdoenzyme Failure
  biological_scale: MOLECULAR
  description: >-
    Four molybdoenzymes exist in humans, and all of them lose activity together: sulfite
    oxidase, xanthine oxidoreductase, aldehyde oxidase and the mitochondrial
    amidoxime-reducing component. The name of the disease - combined deficiency of sulfite
    oxidase, xanthine dehydrogenase and aldehyde oxidase - records this. What the name does
    not record is that the deficiencies are not clinically equal, which the next two nodes
    separate.
  molecular_functions:
  - preferred_term: sulfite oxidase activity
    term:
      id: GO:0008482
      label: sulfite oxidase activity
    modifier: DECREASED
  - preferred_term: xanthine dehydrogenase activity
    term:
      id: GO:0004854
      label: xanthine dehydrogenase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:36296488
    reference_title: "Molybdenum Cofactor Deficiency in Humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "There are two cytosolic Mo-enzymes, xanthine oxidoreductase and aldehyde
      oxidase, which are closely related Mo-iron-flavin enzymes catalyzing the hydroxylation
      reactions of purines and various heterocyclic substrates"
    explanation: >-
      Names the cytosolic molybdoenzymes that fail alongside sulfite oxidase.
  downstream:
  - target: Sulfite Accumulation and S-Sulfocysteine Formation
    causal_link_type: DIRECT
    description: >-
      Loss of sulfite oxidase is the arm that causes the disease.
  - target: Purine Catabolism Block
    causal_link_type: DIRECT
    description: >-
      Loss of xanthine oxidoreductase is the arm that gives the biochemical signature.

- name: Sulfite Accumulation and S-Sulfocysteine Formation
  biological_scale: MOLECULAR
  description: >-
    Sulfite oxidase normally converts sulfite to sulfate at the end of cysteine catabolism.
    Without it sulfite accumulates and drives secondary chemistry: S-sulfocysteine and
    thiosulfate rise while cysteine and cystine fall. This is the arm that produces the
    clinical disease. The evidence for that is comparative rather than direct - isolated
    sulfite oxidase deficiency, in which only this one enzyme is lost, reproduces almost the
    whole phenotype.
  chemical_entities:
  - preferred_term: sulfite
    term:
      id: CHEBI:17359
      label: sulfite
    modifier: INCREASED
  evidence:
  - reference: PMID:36296488
    reference_title: "Molybdenum Cofactor Deficiency in Humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The molecular cause of the disease is the loss of sulfite oxidase (SOX)
      activity, one of four Moco-dependent enzymes in men"
    explanation: >-
      Attributes the disease specifically to the sulfite oxidase arm rather than to combined
      molybdoenzyme loss as such.
  - reference: PMID:36296488
    reference_title: "Molybdenum Cofactor Deficiency in Humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Accumulating toxic sulfite causes a secondary increase of metabolites such as
      S-sulfocysteine and thiosulfate as well as a decrease in cysteine and its oxidized
      form, cystine"
    explanation: >-
      The downstream metabolite shifts, including the fall in cysteine that the dietary
      restriction is aimed at.
  - reference: PMID:36296488
    reference_title: "Molybdenum Cofactor Deficiency in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the symptoms in MoCD patients are mirrored by iSOD, which is caused by
      mutations in the SUOX gene"
    explanation: >-
      The comparative argument that the sulfite oxidase arm carries the phenotype: a disease
      lacking only that enzyme looks the same.
  downstream:
  - target: S-Sulfocysteine NMDA-Receptor Excitotoxicity
    causal_link_type: DIRECT
    description: >-
      One of the accumulating metabolites is not merely a marker.

- name: Purine Catabolism Block
  biological_scale: MOLECULAR
  description: >-
    Xanthine oxidoreductase converts hypoxanthine to xanthine and xanthine to urate, so its
    loss raises xanthine and lowers urate. This arm is curated separately from the sulfite
    arm because it behaves differently: it produces the biochemical signature that makes the
    diagnosis - high xanthine with a urate below the reference range - while contributing
    little of the clinical disease. A patient with isolated xanthinuria has kidney stones,
    not a neonatal encephalopathy.
  biological_processes:
  - preferred_term: hypoxanthine catabolic process
    term:
      id: GO:0009114
      label: hypoxanthine catabolic process
    modifier: DECREASED
  chemical_entities:
  - preferred_term: xanthine
    term:
      id: CHEBI:15318
      label: xanthine
    modifier: INCREASED
  - preferred_term: uric acid
    term:
      id: CHEBI:27226
      label: uric acid
    modifier: DECREASED
  evidence:
  - reference: PMID:35192225
    reference_title: "Molybdenum cofactor deficiency: A natural history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In MoCD-A and MoCD-B, plasma and urinary xanthine and S-sulfocysteine
      concentrations were high; urate remained below the normal reference range"
    explanation: >-
      The biochemical signature measured across the natural history cohort, combining both
      arms - S-sulfocysteine from the sulfite arm, xanthine and urate from this one.

- name: S-Sulfocysteine NMDA-Receptor Excitotoxicity
  biological_scale: CELLULAR
  description: >-
    The step that converts a metabolic block into neuronal death. S-sulfocysteine is a
    structural analog of glutamate, and it activates NMDA-type glutamate receptors,
    admitting calcium and triggering downstream signalling including calpain activation.
    This is why the encephalopathy is destructive rather than merely dysfunctional, and why
    the neonatal window is so narrow.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  molecular_functions:
  - preferred_term: NMDA glutamate receptor activity
    term:
      id: GO:0004972
      label: NMDA glutamate receptor activity
    modifier: INCREASED
  biological_processes:
  - preferred_term: glutamate receptor signaling pathway
    term:
      id: GO:0007215
      label: glutamate receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:36296488
    reference_title: "Molybdenum Cofactor Deficiency in Humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SSC represents a structural analog of glutamate and has been proven to cause
      excitotoxicity in neurons by activating N-methyl-D-aspartate type glutamate (NMDA)
      receptors, causing calcium influx and downstream signaling such as calpain activation"
    explanation: >-
      The molecular basis of the neurotoxicity, including the receptor and the downstream
      effector.
  - reference: PMID:36296488
    reference_title: "Molybdenum Cofactor Deficiency in Humans."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "The effects of these S-sulfonated species remain largely unknown except for
      S-sulfocysteine (SSC)"
    explanation: >-
      Curated PARTIAL because it qualifies the node rather than supporting it: S-sulfocysteine
      is the one accumulating species whose mechanism is known, and the contribution of
      thiosulfate and the other S-sulfonated metabolites is not established.
  downstream:
  - target: Neonatal Encephalopathy and Cerebral Injury
    causal_link_type: DIRECT
    description: >-
      Excitotoxic neuronal death across the forebrain and midbrain.

- name: Neonatal Encephalopathy and Cerebral Injury
  biological_scale: ORGANISM
  description: >-
    Presentation in the first days of life with severe encephalopathy - refractory seizures,
    opisthotonos, axial and appendicular hypotonia, feeding difficulty and apnea - with
    imaging showing loss of grey-white differentiation, gyral swelling and panlobar
    diffusion restriction through the forebrain and midbrain, characteristically sparing the
    brain stem. The injury is largely complete by the time it is recognized, which is the
    central fact governing treatment.
  evidence:
  - reference: PMID:34870926
    reference_title: "Molybdenum Cofactor Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with early-onset MoCD typically present in the first days of life
      with severe encephalopathy, including refractory seizures, opisthotonos, axial and
      appendicular hypotonia, feeding difficulties, and apnea"
    explanation: >-
      The clinical syndrome of the early-onset form.
  - reference: PMID:34870926
    reference_title: "Molybdenum Cofactor Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "panlobar diffusion restriction throughout the forebrain and midbrain with
      relative sparring of the brain stem"
    explanation: >-
      The imaging distribution, including the brain stem sparing. The source's spelling of
      "sparring" is reproduced as published.
  downstream:
  - target: Profound Neurodevelopmental Disability and Early Mortality
    causal_link_type: DIRECT
    description: >-
      Survivors of the acute injury carry its consequences.

- name: Profound Neurodevelopmental Disability and Early Mortality
  biological_scale: ORGANISM
  description: >-
    Survivors have profound developmental delay, truncal hypotonia and limb hypertonia
    evolving into spastic quadriplegia or diplegia, acquired microcephaly and dysmorphic
    features. Mortality is high and early: about a quarter of neonatal-onset type A patients
    die before their first birthday, and the median age at death is 2.4 years.
  evidence:
  - reference: PMID:35192225
    reference_title: "Molybdenum cofactor deficiency: A natural history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequelae included profound developmental delay, truncal hypotonia, limb
      hypertonia that evolved to spastic quadriplegia or diplegia, dysmorphic features, and
      acquired microcephaly"
    explanation: >-
      The sequelae in survivors, from the natural history cohort.
  - reference: PMID:35192225
    reference_title: "Molybdenum cofactor deficiency: A natural history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One-year survival rates were 77.4% (overall), 71.8% (neonatal onset MoCD-A),
      and 76.9% (neonatal onset MoCD-B); median ages at death were 2.4, 2.4, and 2.2 years,
      respectively"
    explanation: >-
      The survival figures, with the type A neonatal-onset stratum reported separately -
      which is the number that applies to this entry.
  - reference: PMID:25764214
    reference_title: "Ultra-orphan diseases: a quantitative analysis of the natural history of molybdenum cofactor deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median survival for the overall population was 36 months"
    explanation: >-
      An independent survival estimate from the pre-treatment published-case series, close to
      the 2.4-year median above. This is the untreated natural history the substitution
      therapy is measured against; it is not type A-stratified, so it corroborates rather
      than replaces the stratified figure.


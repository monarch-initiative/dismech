  relationship_type: CAUSATIVE
  association: >-
    Biallelic MOCS1 variants cause molybdenum cofactor deficiency type A, the commonest of
    the three complementation groups. MOCS1 is transcribed as both a bicistronic and a
    monocistronic mRNA through alternative splicing, encoding the two proteins that together
    catalyze GTP to cyclic pyranopterin monophosphate. Genotype does not distinguish type A
    clinically - only molecularly - but it determines eligibility for the only targeted
    therapy that exists.
  evidence:
  - reference: PMID:21031595
    reference_title: "Molybdenum cofactor deficiency: Mutations in GPHN, MOCS1, and MOCS2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of mutations leading to MoCo deficiency have been identified in
      the genes MOCS1 (type A deficiency), MOCS2 (type B deficiency), with one reported in
      GPHN"
    explanation: >-
      Maps each gene to its complementation group and records that type A is the commonest,
      which is the assertion this entry's scope rests on.
  - reference: PMID:36296488
    reference_title: "Molybdenum Cofactor Deficiency in Humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MOCS1 expression undergoes alternative splicing, yielding two different types
      of transcripts, one bicistronic and one monocistronic mRNA"
    explanation: >-
      The unusual transcript architecture of the locus.
  notes: >-
    Scoping note that matters for this entry. The deep-research report and much of the
    literature discuss MOCS2 (type B) and GPHN (type C) alongside MOCS1, and the NEC
    preflight flagged MOCS2 as a rival gene for exactly that reason. Nothing in this entry is
    sourced from a type B or type C observation. In particular the mouse model in
    PMID:27138983 is a type B model and is deliberately not curated here, and the survival
    figures are quoted from the type A stratum rather than the combined cohort.

diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Sequencing of MOCS1, MOCS2, MOCS3 and GPHN. This is the only way to distinguish type A
    from types B and C, and because the distinction gates access to fosdenopterin within a
    window measured in days, the testing is genuinely time-critical rather than
    confirmatory. Fibroblast sulfite oxidase activity is the fallback when molecular testing
    is unavailable, but the chapter notes it discriminates poorly between total and partial
    loss.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:34870926
    reference_title: "Molybdenum Cofactor Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of molybdenum cofactor deficiency is established by
      identification of biallelic pathogenic variants in GPHN, MOCS1, MOCS2, or MOCS3, or
      when unavailable, of significantly reduced activity of the enzyme sulfite oxidase in
      cultured fibroblasts"
    explanation: >-
      The diagnostic pathway and its enzymatic fallback.
  - reference: PMID:34870926
    reference_title: "Molybdenum Cofactor Deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "due to low expression of sulfite oxidase in fibroblasts, differentiation
      between total and partial loss of enzyme activity is difficult to discern"
    explanation: >-
      Curated PARTIAL because it qualifies the fallback assay rather than supporting it -
      the enzymatic route cannot grade severity.
  - reference: PMID:25764214
    reference_title: "Ultra-orphan diseases: a quantitative analysis of the natural history of molybdenum cofactor deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median time to diagnosis (diagnostic delay) was 89 days"
    explanation: >-
      Quantifies how far actual practice sits from the timeline the therapy requires. Against
      a median onset on the first day of life, a median 89-day delay means the diagnostic
      route described here is, as things stand, usually completed long after the window in
      which substitution changes the neurological outcome. This is the measured form of the
      treatment-window gap recorded in the discussions.

treatments:
- name: Fosdenopterin Substrate Replacement
  description: >-
    The only disease-modifying therapy, and it exists only for type A. Fosdenopterin is
    synthetic cyclic pyranopterin monophosphate - the exact intermediate MOCS1 fails to make
    - given by daily infusion through an indwelling catheter. It works because the block is
    at step one: everything downstream is intact and merely starved, so supplying cPMP
    restores the pathway. Substitution is highly effective at reducing sulfite toxicity and
    restoring biochemical homeostasis, but biochemical rescue is not the same as clinical
    rescue, and outcome depends on how much brain injury has already occurred. Patients on
    fosdenopterin must avoid direct sunlight and UV phototherapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fosdenopterin
      term:
        id: NCIT:C175065
        label: Fosdenopterin
  evidence:
  - reference: PMID:34870926
    reference_title: "Molybdenum Cofactor Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In those with MOCS1-related MoCD (MoCD type A), fosdenopterin (NULIBRY) daily
      infusion through an indwelling catheter (dose based on weight and age; each vial
      contains 9.5 mg) may be considered, but must be initiated in a very short window after
      symptom manifestation to achieve maximum benefit"
    explanation: >-
      Establishes both the type A restriction and the narrow treatment window. The quote
      omits the registered trademark symbol after NULIBRY as the cached record renders it.
  - reference: PMID:36296488
    reference_title: "Molybdenum Cofactor Deficiency in Humans."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Substitution therapy with cPMP is highly effective in reducing sulfite
      toxicity and restoring biochemical homeostasis, while the clinical outcome critically
      depends on the degree of brain injury prior to the start of treatment"
    explanation: >-
      Curated PARTIAL deliberately. The first clause supports the therapy; the second
      withholds the claim that matters most to a family, which is neurological outcome. The
      entry keeps both halves rather than quoting only the first.
  - reference: PMID:36296488
    reference_title: "Molybdenum Cofactor Deficiency in Humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This distinction is relevant for patient management because the metabolic block
      in MoCD type A can be circumvented by administering cyclic pyranopterin monophosphate
      (cPMP)"
    explanation: >-
      States why the subtype distinction is actionable rather than taxonomic.
  notes: >-
    The reason this therapy exists for type A and not for types B or C is positional, not
    commercial. MOCS1 acts at step one, so its product can be supplied from outside; MOCS2
    and GPHN act downstream, and their substrates are not stable, cell-permeant molecules
    that can be given as a drug. A curator adding a type B or type C entry should not carry
    fosdenopterin across to it.

- name: Cysteine-Restricted Diet
  description: >-
    Low protein intake with restriction of whole natural protein, aimed at reducing the
    cysteine load whose catabolism generates sulfite. Unlike fosdenopterin this is applied
    across all subtypes. It requires monitoring of essential amino acids, since the
    restriction that lowers sulfite also risks deficiency.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:34870926
    reference_title: "Molybdenum Cofactor Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals (all subtypes) are often placed on a cysteine-restricted
      diet, which typically includes low protein intake with restriction of whole natural
      protein"
    explanation: >-
      The dietary intervention and its explicit application to all subtypes.
  - reference: PMID:34870926
    reference_title: "Molybdenum Cofactor Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Routine measurement of essential amino acids in those on a low-cysteine
      low-protein diet"
    explanation: >-
      The monitoring requirement attached to the restriction.

- name: Avoidance of Valproate
  description: >-
    A contraindication rather than a therapy, and one that collides with the presentation:
    valproate is a standard choice for refractory neonatal seizures, which is exactly how
    these patients present. GeneReviews advises avoiding it where possible because sulfite
    intoxication impairs mitochondrial function in vitro, and valproate is itself
    mitochondrially toxic.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: valproic acid
      term:
        id: CHEBI:39867
        label: valproic acid
  evidence:
  - reference: PMID:34870926
    reference_title: "Molybdenum Cofactor Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Valproate should be avoided if possible, as
      sulfite intoxication impairs mitochondrial function in vitro"
    explanation: >-
      The GeneReviews Agents/Circumstances to Avoid entry, quoted directly. Note the stated
      rationale is an in vitro observation, which the entry does not upgrade.

- name: Genetic Counseling and Presymptomatic Sibling Management
  description: >-
    Autosomal recessive counseling with a 25 percent recurrence risk, but with an unusual
    operational consequence: because the therapeutic window is days, an at-risk newborn sib
    should be started on metabolic treatment immediately and only stopped once the diagnosis
    is excluded. Treatment precedes diagnosis rather than following it.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:34870926
    reference_title: "Molybdenum Cofactor Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For at-risk newborn sibs in whom prenatal testing was not performed, metabolic
      treatment should be initiated immediately and continued until such a time as the
      diagnosis has been excluded"
    explanation: >-
      States the treat-first principle for at-risk newborns, which follows directly from the
      narrowness of the window.

animal_models:
- name: Mocs1-null mouse (Moco-deficient mouse)
  species: Mouse
  genotype: Mocs1 knockout, homozygous null
  publication: PMID:15862276
  description: >-
    The type A model. Homozygous Mocs1-null mice reproduce the enzyme and metabolite changes
    seen in patients, die within about two weeks of birth, and were the system in which
    substrate replacement with a biosynthetic Moco precursor - the strategy that became
    fosdenopterin - was first shown to work. Detailed analysis found no morphological brain
    damage but a massive transcriptional cell-death program, triggered by elevated sulfite
    and delayed in utero by maternal clearance, which is why affected pups are born well and
    decompensate after birth.
  modeled_mechanisms:
  - target: Sulfite Accumulation and S-Sulfocysteine Formation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The model reproduces the full biochemical lesion, and the study attributes the neuronal
      damage specifically to elevated sulfite rather than to cofactor absence in the abstract.
    limitations: >-
      The abstract reports the metabolite changes as a set rather than individually, so it
      does not by itself quantify S-sulfocysteine in the mouse.
    evidence:
    - reference: PMID:15862276
      reference_title: "The pathogenesis of molybdenum cofactor deficiency, its delay by maternal clearance, and its expression pattern in microarray analysis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This neuronal damage appears to be triggered by elevated sulfite levels and
        is ameliorated in affected embryos by maternal clearance"
      explanation: >-
        Places sulfite upstream of the neuronal injury in the model, which is the causal claim
        this node makes, and explains the postnatal onset by loss of maternal clearance.
  - target: Neonatal Encephalopathy and Cerebral Injury
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The lethal early-postnatal encephalopathic course is reproduced, and microarray analysis
      shows a cell-death program in brain.
    limitations: >-
      Morphological brain damage was explicitly excluded in the mouse, so the model captures
      the secondary apoptotic injury but not the structural findings - cerebellar hypoplasia,
      thin corpus callosum, cystic encephalomalacia - that dominate human MRI. Mouse survival
      is measured in days to two weeks against a human course running into infancy, so the
      model compresses the timeline the treatment-window question turns on.
    evidence:
    - reference: PMID:15862276
      reference_title: "The pathogenesis of molybdenum cofactor deficiency, its delay by maternal clearance, and its expression pattern in microarray analysis."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "We now analyzed these mice in detail and excluded morphological brain damage,
        while expression analysis with microarrays indicates a massive cell death program"
      explanation: >-
        Supports the cell-death arm of this node and simultaneously documents the divergence
        from human structural neuroimaging, which is why the link is PARTIALLY_RECAPITULATES
        rather than RECAPITULATES.
  evidence:
  - reference: PMID:15862276
    reference_title: "The pathogenesis of molybdenum cofactor deficiency, its delay by maternal clearance, and its expression pattern in microarray analysis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We have recently described a murine model for Moco-deficiency, which reflects
      all enzyme and metabolite changes observed in the patients, and an efficient therapy
      using a biosynthetic precursor of Moco has been established in this animal model"
    explanation: >-
      Establishes the model as informative for this disease and records the preclinical
      precursor-substitution rescue - the animal evidence behind fosdenopterin.
  notes: >-
    Genotype provenance. The cited abstract names the disease but not the gene; the Mocs1-null
    genotype and the MGI record (MGI:1928904) come from the deep-research artifact committed
    with this entry, and Lee HJ, who generated the Mocs1-deficient line, is a co-author here.
    The distinction matters for this entry specifically, because type A versus type B is what
    determines whether a model can test cPMP substitution at all, so the attribution is
    recorded rather than left implicit.

differential_diagnoses:
- name: Isolated sulfite oxidase deficiency
  disease_term:
    preferred_term: isolated sulfite oxidase deficiency
    term:
      id: MONDO:0010089
      label: isolated sulfite oxidase deficiency
  description: >-
    The closest mimic, and mechanistically it is the same disease minus two enzymes. SUOX
    variants remove sulfite oxidase directly rather than by removing its cofactor, so the
    sulfite arm is identical while the purine arm is intact. That is why the phenotypes are
    nearly superimposable and why the differential is decided biochemically rather than
    clinically.
  distinguishing_features:
  - >-
    Urate and xanthine are normal in isolated sulfite oxidase deficiency, because xanthine
    oxidoreductase is unaffected. In molybdenum cofactor deficiency urate is low and xanthine
    high.
  - >-
    Only molybdenum cofactor deficiency type A is treatable with fosdenopterin; supplying
    cPMP cannot help a patient whose apoenzyme is the defect.
  evidence:
  - reference: PMID:36296488
    reference_title: "Molybdenum Cofactor Deficiency in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the symptoms in MoCD patients are mirrored by iSOD, which is caused by
      mutations in the SUOX gene"
    explanation: >-
      States the phenotypic near-identity that makes this the primary differential.

- name: Molybdenum cofactor deficiency types B and C
  description: >-
    The other complementation groups, caused by MOCS2 and GPHN respectively. They are
    clinically indistinguishable from type A at the bedside, which is the entire reason
    molecular testing is urgent rather than academic.
  distinguishing_features:
  - >-
    Distinguishable only by molecular genetic testing; clinical presentation, imaging and
    biochemistry are shared.
  - >-
    Neither is amenable to fosdenopterin, because the metabolic block lies downstream of the
    cPMP that the drug supplies.
  evidence:
  - reference: PMID:36296488
    reference_title: "Molybdenum Cofactor Deficiency in Humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moco is synthesized by a three-step biosynthetic pathway that involves the gene
      products of MOCS1, MOCS2, MOCS3, and GPHN"
    explanation: >-
      The pathway basis for the complementation groups and for why only the first-step defect
      can be bypassed.

- name: Hypoxic-ischemic encephalopathy
  description: >-
    The differential that actually costs time. A term neonate with refractory seizures,
    hypotonia and diffusion restriction on MRI is far more often hypoxic-ischemic, and the
    imaging overlaps enough that molybdenum cofactor deficiency is easily missed in the
    window where treatment would still help.
  distinguishing_features:
  - >-
    A low serum urate is not a feature of hypoxic-ischemic encephalopathy and is cheap to
    measure, which is what makes it the practical discriminator.
  - >-
    Absence of a sentinel perinatal event or acidosis at birth should raise suspicion of a
    metabolic cause.
  evidence:
  - reference: PMID:34870926
    reference_title: "Molybdenum Cofactor Deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Head imaging may demonstrate loss of gray and white matter differentiation,
      gyral swelling, sulci injury"
    explanation: >-
      Curated PARTIAL: the quote establishes the imaging findings that overlap with
      hypoxic-ischemic injury, but the chapter does not itself name that differential, so the
      inference is the entry's.

discussions:

- discussion_id: gap_treatment_window_is_undefined_in_hours
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#S-Sulfocysteine NMDA-Receptor Excitotoxicity
  - pathophysiology#Neonatal Encephalopathy and Cerebral Injury
  prompt: >-
    Fosdenopterin must be started in "a very short window after symptom manifestation". How
    short, and measured from what?
  rationale: >-
    This is the most consequential unquantified statement in the disease. The therapy
    reliably corrects the biochemistry and unreliably corrects the outcome, and the
    difference is how much excitotoxic injury has already happened. Yet the guidance is
    qualitative. A neonatologist deciding whether to start empiric treatment before molecular
    confirmation, or a service deciding whether rapid genome sequencing is worth standing up
    for a disease this rare, needs a number. The excitotoxicity mechanism suggests the injury
    is fast, which would make hours rather than days the relevant unit and would push the
    decision toward treating before confirming - which is what GeneReviews already advises
    for at-risk sibs, but not for undiagnosed neonates. That asymmetry is itself worth
    resolving.
  proposed_experiments:
  - experiment_id: exp_outcome_by_hours_to_treatment
    name: Neurodevelopmental outcome against hours from symptom onset to first cPMP dose
    description: >-
      Across the treated type A cohort, regress a standardized neurodevelopmental outcome at
      two years on time from first symptom to first dose, with MRI injury burden at
      presentation as a covariate. Even a modest cohort would establish whether the window is
      measured in hours or days, and whether pre-treatment MRI predicts benefit well enough
      to guide the decision.

- discussion_id: gap_why_one_enzyme_carries_the_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Absent Molybdenum Cofactor and Combined Molybdoenzyme Failure
  - pathophysiology#Purine Catabolism Block
  prompt: >-
    Four molybdoenzymes fail simultaneously, yet the disease appears to be sulfite oxidase
    deficiency alone. What, if anything, do the other three contribute?
  rationale: >-
    The comparative argument is strong: isolated sulfite oxidase deficiency mirrors most of
    the phenotype, and isolated xanthinuria is a mild stone-forming condition rather than an
    encephalopathy. So the sulfite arm evidently dominates. But "most of the symptoms" is not
    all of them, and the question of what the residual difference consists of has not been
    answered systematically. Xanthine oxidoreductase and aldehyde oxidase are major
    drug-metabolizing enzymes, so their loss might matter pharmacologically rather than
    developmentally - a treated survivor could metabolize certain drugs abnormally for life.
    The amidoxime-reducing component has no reported human deficiency at all, so its
    contribution is entirely unknown.
  proposed_experiments:
  - experiment_id: exp_phenotype_delta_mocd_versus_isod
    name: Systematic phenotype comparison of molybdenum cofactor deficiency against isolated
      sulfite oxidase deficiency
    description: >-
      Compare deeply phenotyped cohorts of the two disorders across organ systems, including
      drug-metabolism phenotyping in long-term survivors. Any feature consistently present in
      molybdenum cofactor deficiency and absent from isolated sulfite oxidase deficiency is
      attributable to the non-sulfite arms, and would be the first direct evidence of what
      they contribute.

- discussion_id: mismatch_type_a_mouse_lacks_the_human_structural_lesion
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Neonatal Encephalopathy and Cerebral Injury
  prompt: >-
    The type A mouse dies of a sulfite-triggered cell-death program with no morphological
    brain damage, while human infants show cerebellar hypoplasia, thin corpus callosum, and
    cystic encephalomalacia on MRI. Is the mouse injury the same injury?
  rationale: >-
    A Mocs1-null mouse exists and is curated in this entry, so the preclinical evidence for
    cPMP substitution does come from the genotype the therapy targets. The open question is
    narrower and concerns what the model measures. Reiss et al. explicitly excluded
    morphological brain damage and found instead a massive transcriptional cell-death program,
    whereas the human disease is radiologically defined by structural destruction. Two
    readings are possible and they diverge therapeutically: either the mouse dies too fast for
    the structural lesion to develop, in which case it models the early, treatable phase and
    is the right system for a treatment-window study; or the structural findings in humans
    arise partly by a route the mouse does not run, in which case cPMP timing data from the
    mouse would systematically overstate the window. Species differences in developmental
    timing make the first reading more likely - mouse survival is days to two weeks against a
    human course running into infancy - but nothing in the cited evidence settles it, and the
    entry's central unresolved clinical question is precisely a question about timing.
  proposed_experiments:
  - experiment_id: exp_mocs1_null_staged_cpmp_with_neuropathology
    name: Staged cPMP substitution in the Mocs1-null mouse with matched neuropathology
    description: >-
      Administer cPMP to Mocs1-null pups at defined intervals after symptom onset and read out
      both biochemical correction and neuropathology, rather than survival alone. Two things
      would follow. It would establish whether biochemical rescue and neurological rescue
      dissociate on a timeline in the model as they do in patients, and by asking whether
      structural damage ever appears in longer-surviving rescued animals it would test whether
      the mouse's lack of morphological damage is a difference in kind or only in duration -
      which is what determines whether the timing numbers transfer to human care.

notes: >-
  Scope. This entry curates molybdenum cofactor deficiency type A, the MOCS1 complementation
  group. Types B (MOCS2) and C (GPHN) are curated only as differentials. That boundary is
  load-bearing rather than tidy: fosdenopterin is licensed for type A alone, so blending the
  types would attach a treatment to diseases it cannot help.
  Every claim in this entry is drawn from a type A or all-subtype statement. Where a source
  reports combined figures, the type A stratum is quoted instead - the one-year survival is
  given as 71.8 percent for neonatal-onset type A rather than the 77.4 percent overall
  figure. The animal model curated here is the Mocs1-null mouse, which is the type A
  genotype; the Mocs2 model in PMID:27138983 is deliberately left out, because a type B model
  cannot test cPMP substitution - in that model cPMP is already being made - so it speaks to
  the shared downstream consequence of cofactor absence rather than to the MOCS1 step that
  defines type A.
  NEC preflight returned WARN rather than PASS, and the warning is benign and expected. MOCS1
  is mentioned 34 times; the flagged rival MOCS2 appears 11 times, with SUOX and GPHN behind
  it. All three are the complementation groups and the principal differential of the disease
  being curated, so a report that did not mention them would be a worse report. The
  rival-gene heuristic cannot distinguish a differential from a second entity.
  Deep research provenance. The report was generated with the claude_code provider and was
  the cleanest of this batch: 23 of 23 references resolved, confabulation_rate 0.0, and no
  needs_review flag. One quoted claim was recorded as not checkable.

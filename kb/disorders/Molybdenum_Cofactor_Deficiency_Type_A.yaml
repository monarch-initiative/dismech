name: Molybdenum Cofactor Deficiency Type A
creation_date: "2026-08-20T18:40:00Z"
category: Mendelian
synonyms:
- MOCOD type A
- MOCODA
- MoCD-A
- Molybdenum cofactor deficiency complementation group A
- Combined deficiency of sulfite oxidase, xanthine dehydrogenase and aldehyde oxidase type A
description: >-
  Molybdenum cofactor deficiency type A is an autosomal recessive inborn error of cofactor
  biosynthesis in which biallelic MOCS1 variants block the first step of molybdenum cofactor
  synthesis, the conversion of GTP to cyclic pyranopterin monophosphate. Without the cofactor
  every molybdoenzyme fails at once, but the clinical disease is essentially the loss of one
  of them: sulfite oxidase. Accumulating sulfite and its adduct S-sulfocysteine, a structural
  analog of glutamate, produce NMDA-receptor excitotoxicity and a catastrophic neonatal
  encephalopathy. Type A is clinically indistinguishable from types B and C at the bedside,
  and the distinction still matters absolutely, because only type A can be treated - the
  missing intermediate can be given back as fosdenopterin.
disease_term:
  preferred_term: molybdenum cofactor deficiency type A
  term:
    id: MONDO:0009643
    label: sulfite oxidase deficiency due to molybdenum cofactor deficiency type A
parents:
- Metabolic Disease
- Neurological Disease
references:

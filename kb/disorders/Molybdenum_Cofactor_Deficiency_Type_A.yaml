biochemical:
- name: Urinary S-Sulfocysteine
  notes: >-
    Raised S-sulfocysteine in plasma and urine is the direct marker of the sulfite oxidase
    block and the metabolite responsible for the excitotoxicity. Together with a low urate
    it is the biochemical pattern that should prompt molecular testing in an encephalopathic
    neonate.
  evidence:
  - reference: PMID:35192225
    reference_title: "Molybdenum cofactor deficiency: A natural history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "plasma and urinary xanthine and S-sulfocysteine concentrations were high"
    explanation: >-
      The measured elevation across the cohort.

- name: Serum Urate
  notes: >-
    A urate below the reference range is the most accessible clue to the diagnosis, since
    hypouricemia is uncommon and readily measured. It reflects the xanthine oxidoreductase
    arm rather than the arm causing the disease, which is what makes it a marker rather than
    a severity index.
  evidence:
  - reference: PMID:35192225
    reference_title: "Molybdenum cofactor deficiency: A natural history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "urate remained below the normal reference range"
    explanation: >-
      The measured hypouricemia.
  - reference: PMID:34870926
    reference_title: "Molybdenum Cofactor Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "measurement of serum uric acid and urinary: sulfite, s-sulfocysteine,
      xanthine, hypoxanthine, and uric acid"
    explanation: >-
      The recommended biochemical panel, quoted from the at-risk-relative evaluation where
      the chapter states it most concretely.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The largest natural history study assembled 58 patients across types A and B, of whom 41
    had type A. The disease is described in the literature as ultra-rare, and the study cited
    here was itself framed as a quantitative analysis of an ultra-orphan disease.
  evidence:
  - reference: PMID:35192225
    reference_title: "Molybdenum cofactor deficiency: A natural history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This natural history study analyzed retrospective data for 58 living or
      deceased patients (MoCD-A, n = 41; MoCD-B, n = 17)"
    explanation: >-
      The size of the largest assembled cohort, with the type A stratum stated.
  - reference: PMID:35192225
    reference_title: "Molybdenum cofactor deficiency: A natural history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molybdenum cofactor deficiency (MoCD) includes three ultrarare autosomal
      recessive inborn errors of metabolism"
    explanation: >-
      The source's characterization of the disease family as ultra-rare.


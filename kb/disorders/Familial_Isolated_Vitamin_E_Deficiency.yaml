    modifier: ABNORMAL
    term:
      id: GO:0006979
      label: response to oxidative stress
  evidence:
  - reference: PMID:25066259
    reference_title: Retinitis pigmentosa and macular degeneration in a patient with ataxia with isolated vitamin E deficiency with a novel c.717 del C mutation in the TTPA gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Dysregulation of this lipid-soluble antioxidant vitamin plays a major role in the neurodegeneration observed in AVED. Some AVED patients experience decreased visual acuity. Retinitis pigmentosa is thought to be the main cause of this visual impairment.
    explanation: Loss of vitamin E antioxidant protection in the retina causes pigmentary retinopathy and visual loss.

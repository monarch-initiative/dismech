    snippet: AVED patients have an impaired ability to incorporate alpha-tocopherol into lipoproteins secreted by the liver, a function putatively attributable to the alpha-tocopherol transfer protein (alpha-TTP).
    explanation: Demonstrates defective hepatic lipoprotein secretion of alpha-tocopherol in AVED.
  downstream:
  - target: Systemic Vitamin E Deficiency
    causal_link_type: DIRECT
    description: Failure of hepatic lipoprotein re-secretion causes severe depletion of circulating plasma and tissue alpha-tocopherol.

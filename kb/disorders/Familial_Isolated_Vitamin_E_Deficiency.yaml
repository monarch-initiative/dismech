      snippet: AVED patients have an impaired ability to incorporate alpha-tocopherol into lipoproteins secreted by the liver, a function putatively attributable to the alpha-tocopherol transfer protein (alpha-TTP).
      explanation: Alpha-TTP deficiency directly impairs hepatic incorporation of alpha-tocopherol into secreted lipoproteins.
- name: Impaired Hepatic VLDL Alpha-Tocopherol Secretion
  description: >-
    Without alpha-TTP-mediated incorporation of alpha-tocopherol into hepatic
    very-low-density lipoproteins (VLDL), chylomicron-delivered vitamin E cannot
    be re-secreted into the systemic circulation for delivery to peripheral
    tissues and is rapidly eliminated.
  role: mediator
  cell_types:

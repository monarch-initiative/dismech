differential_diagnoses:
- name: Friedreich ataxia
  description: >-
    Autosomal recessive spinocerebellar ataxia caused by FXN GAA trinucleotide
    repeat expansion that closely mimics AVED clinically (progressive gait and
    limb ataxia, dysarthria, loss of proprioception, areflexia, and Babinski
    sign). AVED is distinguished by severely reduced plasma vitamin E levels,
    more frequent head titubation (28%) and dystonia, less frequent
    cardiomyopathy (19%), absence of FXN repeat expansion, and dramatic
    stabilization with vitamin E therapy.
  distinguishing_features:
  - Normal plasma vitamin E concentration in Friedreich ataxia vs. severely reduced plasma vitamin E in AVED
  - Lower frequency of cardiomyopathy (19% in AVED vs. majority of classic Friedreich ataxia patients)
  - Higher frequency of head titubation (28%) and pigmentary retinopathy in AVED
  - Biallelic TTPA pathogenic variants in AVED vs. FXN GAA repeat expansion in Friedreich ataxia
  disease_term:
    preferred_term: Friedreich ataxia
    term:
      id: MONDO:0100339
      label: Friedreich ataxia
  evidence:
  - reference: PMID:9463307
    reference_title: 'Ataxia with isolated vitamin E deficiency: heterogeneity of mutations and phenotypic variability in a large number of families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Compilation of the clinical records of 43 patients with documented mutation in the alpha-TTP gene revealed differences from Friedreich ataxia: cardiomyopathy was found in only 19% of cases, whereas head titubation was found in 28% of cases and dystonia in an additional 13%.'
    explanation: Defines the clinical features distinguishing AVED from Friedreich ataxia across 43 genetically confirmed cases.
  - reference: PMID:9463307
    reference_title: 'Ataxia with isolated vitamin E deficiency: heterogeneity of mutations and phenotypic variability in a large number of families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This study represents the largest group of patients and mutations reported for this often misdiagnosed disease and points to the need for an early differential diagnosis with Friedreich ataxia, in order to initiate therapeutic and prophylactic vitamin E supplementation before irreversible damage develops.
    explanation: Emphasizes the critical importance of early differential diagnosis between AVED and Friedreich ataxia so that vitamin E therapy can be initiated before irreversible neurological injury occurs.
- name: Abetalipoproteinemia
  description: >-
    Autosomal recessive disorder of apolipoprotein B-containing lipoprotein
    assembly caused by biallelic MTTP variants that also causes severe secondary
    vitamin E deficiency, spinocerebellar ataxia, and pigmentary retinopathy,
    but is distinguished from AVED by fat malabsorption, steatorrhea,
    acanthocytosis, and near-absent plasma LDL cholesterol, triglycerides, and
    apolipoprotein B.
  distinguishing_features:
  - Normal intestinal fat absorption and normal plasma lipid/lipoprotein profile in AVED vs. fat malabsorption, hypocholesterolemia, hypotriglyceridemia, absent apolipoprotein B, and acanthocytosis in abetalipoproteinemia
  - Biallelic TTPA variants in AVED vs. biallelic MTTP variants in abetalipoproteinemia
  disease_term:
    preferred_term: abetalipoproteinemia
    term:
      id: MONDO:0008692
      label: abetalipoproteinemia
  evidence:
  - reference: PMID:7719340
    reference_title: Ataxia with isolated vitamin E deficiency is caused by mutations in the alpha-tocopherol transfer protein.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: AVED patients have an impaired ability to incorporate alpha-tocopherol into lipoproteins secreted by the liver, a function putatively attributable to the alpha-tocopherol transfer protein (alpha-TTP).
    explanation: Unlike generalized lipoprotein assembly defects (abetalipoproteinemia), AVED selectively impairs alpha-tocopherol incorporation into hepatic lipoproteins via alpha-TTP deficiency.
treatments:
- name: High-Dose Oral Vitamin E (Alpha-Tocopherol) Supplementation
  description: >-
    Lifelong daily oral administration of high-dose vitamin E (typically
    800-1500 mg/day or 40 mg/kg/day in children in divided doses) to restore
    plasma alpha-tocopherol concentrations to the high-normal range. Initiated
    presymptomatically, it completely prevents neurological manifestations;
    initiated early in symptomatic patients, it halts disease progression and
    can partially reverse ataxia and neurological deficits.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: alpha-tocopherol
      term:
        id: CHEBI:22470
        label: alpha-tocopherol
  target_mechanisms:
  - target: Systemic Vitamin E Deficiency
    treatment_effect: INHIBITS
    description: High-dose oral alpha-tocopherol supplementation overcomes defective hepatic recycling to normalize plasma and tissue vitamin E concentrations.
    evidence:
    - reference: PMID:20301419
      reference_title: Ataxia with Vitamin E Deficiency.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Lifelong targeted therapy with high-dose oral vitamin E supplementation (that brings plasma vitamin E concentrations into the high-normal range) initiated in presymptomatic individuals (e.g., younger sibs of an index case) prevents the manifestations of AVED. Vitamin E supplementation early in the disease course of a symptomatic individual may to some extent reverse ataxia and mental deterioration.
      explanation: High-dose oral vitamin E restores plasma vitamin E to the high-normal range, preventing or halting neurological progression.
    - reference: PMID:15300460
      reference_title: 'Ataxia with isolated vitamin E deficiency: neurological phenotype, clinical follow-up and novel mutations in TTPA gene in Italian families.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Vitamin E supplementation therapy allowed a stabilization of the neurological conditions in most of the patients.
      explanation: Clinical follow-up confirms stabilization of neurological disease with lifelong vitamin E therapy.
  evidence:
  - reference: PMID:20301419
    reference_title: Ataxia with Vitamin E Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Lifelong targeted therapy with high-dose oral vitamin E supplementation (that brings plasma vitamin E concentrations into the high-normal range) initiated in presymptomatic individuals (e.g., younger sibs of an index case) prevents the manifestations of AVED. Vitamin E supplementation early in the disease course of a symptomatic individual may to some extent reverse ataxia and mental deterioration.
    explanation: Establishes lifelong high-dose oral vitamin E supplementation as the definitive targeted therapy for AVED.
  - reference: PMID:15300460
    reference_title: 'Ataxia with isolated vitamin E deficiency: neurological phenotype, clinical follow-up and novel mutations in TTPA gene in Italian families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Vitamin E supplementation therapy allowed a stabilization of the neurological conditions in most of the patients.
    explanation: Demonstrates stabilization of neurological symptoms in treated AVED patients.
  - reference: PMID:9931538
    reference_title: Treatment of ataxia in isolated vitamin E deficiency caused by alpha-tocopherol transfer protein deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A 14-year-old male patient presented with ataxia and mental symptoms caused by a homozygous (552G-->A) alpha-tocopherol transfer protein mutation. After initiation of high-dosage alpha-tocopherol therapy, the organic mental syndrome disappeared and cognitive function improved rapidly.
    explanation: Demonstrates rapid resolution of organic mental syndrome and cognitive improvement after initiating high-dose alpha-tocopherol therapy in genetically confirmed AVED.
- name: Plasma Vitamin E Therapeutic Monitoring
  description: >-
    Regular monitoring of plasma vitamin E (alpha-tocopherol) concentration
    every 6 months, particularly in children, to ensure levels remain within the
    high-normal therapeutic range and prevent relapse of neurological progression.

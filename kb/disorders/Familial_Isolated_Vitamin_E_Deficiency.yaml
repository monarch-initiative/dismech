      reference_title: 'Ataxia with isolated vitamin E deficiency: heterogeneity of mutations and phenotypic variability in a large number of families.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Compilation of the clinical records of 43 patients with documented mutation in the alpha-TTP gene revealed differences from Friedreich ataxia: cardiomyopathy was found in only 19% of cases, whereas head titubation was found in 28% of cases and dystonia in an additional 13%.'
      explanation: Documents cardiomyopathy in 19% of AVED patients with TTPA mutations.
- name: Oxidative Neuronal Damage
  description: >-
    Unchecked lipid peroxidation in vitamin E-depleted neuronal membranes
    initiates oxidative stress across high-metabolic-demand central and
    peripheral neuronal populations, driving dying-back degeneration of dorsal
    root ganglion and posterior column sensory neurons, loss of cerebellar
    Purkinje cells, and corticospinal tract degeneration.
  role: mediator

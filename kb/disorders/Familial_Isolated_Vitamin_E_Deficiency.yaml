description: >-
  An autosomal recessive neurodegenerative disease caused by biallelic pathogenic
  variants in TTPA (alpha-tocopherol transfer protein), resulting in impaired
  hepatic incorporation of alpha-tocopherol into nascent VLDL particles and severe
  systemic vitamin E deficiency despite normal intestinal fat absorption. It
  manifests primarily between ages 5 and 15 years with a Friedreich ataxia-like
  syndrome of progressive spinocerebellar ataxia, loss of proprioception,
  areflexia, dysarthria, head titubation, and variable pigmentary retinopathy or
  cardiomyopathy. Early lifelong high-dose oral vitamin E supplementation halts
  disease progression and can prevent neurological manifestations when initiated
  presymptomatically.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Inherited in an autosomal recessive manner due to biallelic loss-of-function
    variants in TTPA on chromosome 8q12.3. When both parents are heterozygous
    carriers, each sibling of an affected individual has at conception a 25%
    chance of being affected, a 50% chance of being an asymptomatic carrier,
    and a 25% chance of inheriting neither familial pathogenic variant.
  evidence:
  - reference: PMID:20301419
    reference_title: Ataxia with Vitamin E Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: AVED is inherited in an autosomal recessive manner. If both parents are known to be heterozygous for a TTPA pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of inheriting neither of the familial pathogenic variants.
    explanation: GeneReviews confirms autosomal recessive inheritance and the 25% affected, 50% carrier, and 25% unaffected recurrence risks for siblings of an affected individual.
  - reference: PMID:9463307
    reference_title: 'Ataxia with isolated vitamin E deficiency: heterogeneity of mutations and phenotypic variability in a large number of families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Ataxia with vitamin E deficiency (AVED), or familial isolated vitamin E deficiency, is a rare autosomal recessive neurodegenerative disease characterized clinically by symptoms with often striking resemblance to those of Friedreich ataxia.
    explanation: Establishes that familial isolated vitamin E deficiency (AVED) is an autosomal recessive neurodegenerative disease.

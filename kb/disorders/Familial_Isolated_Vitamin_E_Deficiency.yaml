      snippet: AVED patients have progressive spinocerebellar symptoms and markedly reduced plasma levels of vitamin E.
      explanation: Impaired hepatic recycling results in markedly reduced plasma vitamin E concentrations.
- name: Systemic Vitamin E Deficiency
  description: >-
    Marked reduction of plasma and tissue alpha-tocopherol concentrations due to
    failure of hepatic VLDL recycling, depriving lipid-rich neuronal, retinal,
    and cardiac membranes of their primary chain-breaking lipid-soluble
    antioxidant.

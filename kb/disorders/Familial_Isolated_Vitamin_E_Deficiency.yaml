biochemical:
- name: Plasma alpha-tocopherol (vitamin E) concentration
  presence: DECREASED
  context: Markedly decreased plasma vitamin E concentration in the presence of normal plasma cholesterol, triglycerides, and apolipoprotein B levels and absence of fat malabsorption.
  biomarker_term:
    preferred_term: alpha-tocopherol
    term:
      id: CHEBI:22470
      label: alpha-tocopherol
  evidence:
  - reference: PMID:15300460
    reference_title: 'Ataxia with isolated vitamin E deficiency: neurological phenotype, clinical follow-up and novel mutations in TTPA gene in Italian families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: AVED patients have progressive spinocerebellar symptoms and markedly reduced plasma levels of vitamin E.
    explanation: Severe reduction of plasma vitamin E is the defining biochemical abnormality of AVED.
  - reference: PMID:20301419
    reference_title: Ataxia with Vitamin E Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Lifelong targeted therapy with high-dose oral vitamin E supplementation (that brings plasma vitamin E concentrations into the high-normal range) initiated in presymptomatic individuals (e.g., younger sibs of an index case) prevents the manifestations of AVED.
    explanation: Plasma vitamin E measurement is used both for diagnosis and for therapeutic monitoring.
genetic:
- name: TTPA
  association: Causal Biallelic Loss-of-Function Variants
  gene_term:
    preferred_term: TTPA
    term:
      id: hgnc:12404
      label: TTPA
  inheritance:
  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  features: >-
    Biallelic pathogenic variants in TTPA (chromosome 8q12.3) cause familial
    isolated vitamin E deficiency. Truncating variants (most notably the
    Mediterranean/North African founder frameshift c.744delA, as well as
    c.513insTT, c.219insAT, and c.717delC) produce a severe early-onset
    phenotype with higher risk of cardiomyopathy and retinitis pigmentosa,
    whereas missense variants (such as p.Gly246Arg, p.His101Gln, p.Ala120Thr,
    and p.Arg192His) preserve partial alpha-TTP activity and correlate with
    milder, later-onset, slowly progressive disease.
  evidence:
  - reference: PMID:7719340
    reference_title: Ataxia with isolated vitamin E deficiency is caused by mutations in the alpha-tocopherol transfer protein.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A 744delA mutation accounts for 68% of the mutant alleles in the 17 families analysed and appears to have spread in North Africa and Italy. This mutation correlates with a severe phenotype but alters only the C-terminal tenth of the protein.
    explanation: Establishes TTPA mutations as causal for AVED and characterizes the predominant c.744delA founder frameshift allele.
  - reference: PMID:15300460
    reference_title: 'Ataxia with isolated vitamin E deficiency: neurological phenotype, clinical follow-up and novel mutations in TTPA gene in Italian families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Two novel TTPA mutations were identified: a severe truncating mutation (219insAT) in a homozygous patient, and a Gly246Arg missense mutation (G246R) in a compound heterozygous patient. The missense mutation was associated with a mild and slowly progressive form of the disease.'
    explanation: Demonstrates genotype-phenotype correlation between truncating vs. missense TTPA mutations.
  - reference: PMID:20301419
    reference_title: Ataxia with Vitamin E Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of AVED is established in a proband with suggestive findings and biallelic pathogenic variants in TTPA identified by molecular genetic testing.
    explanation: Biallelic pathogenic variants in TTPA establish the molecular diagnosis of AVED.
  variants:
  - name: c.744delA
    type: Frameshift Variant
    clinical_significance: PATHOGENIC
    identifiers:
    - dbSNP:rs121909545
    description: Mediterranean and North African founder frameshift variant accounting for the majority of mutant alleles in North Africa and Italy; associated with early onset and severe phenotype.
    evidence:
    - reference: PMID:7719340
      reference_title: Ataxia with isolated vitamin E deficiency is caused by mutations in the alpha-tocopherol transfer protein.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: A 744delA mutation accounts for 68% of the mutant alleles in the 17 families analysed and appears to have spread in North Africa and Italy. This mutation correlates with a severe phenotype but alters only the C-terminal tenth of the protein.
      explanation: Characterizes the c.744delA founder frameshift variant and its correlation with severe disease.
  - name: c.219insAT
    type: Frameshift Variant
    clinical_significance: PATHOGENIC
    description: Severe truncating insertion variant identified in homozygous state in Italian AVED patients.
    evidence:
    - reference: PMID:15300460
      reference_title: 'Ataxia with isolated vitamin E deficiency: neurological phenotype, clinical follow-up and novel mutations in TTPA gene in Italian families.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Two novel TTPA mutations were identified: a severe truncating mutation (219insAT) in a homozygous patient, and a Gly246Arg missense mutation (G246R) in a compound heterozygous patient.'
      explanation: Reports the homozygous truncating 219insAT mutation in TTPA.
  - name: p.Gly246Arg
    type: Missense Variant
    clinical_significance: PATHOGENIC
    description: Missense TTPA variant associated with a mild and slowly progressive neurological phenotype.
    evidence:
    - reference: PMID:15300460
      reference_title: 'Ataxia with isolated vitamin E deficiency: neurological phenotype, clinical follow-up and novel mutations in TTPA gene in Italian families.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Two novel TTPA mutations were identified: a severe truncating mutation (219insAT) in a homozygous patient, and a Gly246Arg missense mutation (G246R) in a compound heterozygous patient. The missense mutation was associated with a mild and slowly progressive form of the disease.'
      explanation: Reports the p.Gly246Arg missense mutation and its association with mild, slowly progressive disease.
  - name: c.717delC
    type: Frameshift Variant
    clinical_significance: PATHOGENIC
    description: Frameshift variant in exon 5 of TTPA reported in association with AVED complicated by retinitis pigmentosa and macular degeneration.
    evidence:
    - reference: PMID:25066259
      reference_title: Retinitis pigmentosa and macular degeneration in a patient with ataxia with isolated vitamin E deficiency with a novel c.717 del C mutation in the TTPA gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Retinitis pigmentosa and macular degeneration in a patient with ataxia with isolated vitamin E deficiency with a novel c.717 del C mutation in the TTPA gene.
      explanation: Identifies the novel pathogenic c.717delC frameshift mutation in TTPA.

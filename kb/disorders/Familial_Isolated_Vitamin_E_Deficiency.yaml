    reference_title: Ataxia with Vitamin E Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: It is appropriate to clarify the genetic status of all sibs of an affected individual in order to identify as early as possible those who would benefit from prompt initiation of treatment. Timely treatment with vitamin E supplementation may completely avert the clinical manifestations of the disease.
    explanation: GeneReviews explicitly recommends clarifying the genetic status of all siblings of an affected individual so prompt vitamin E supplementation can avert disease manifestations.
  - reference: PMID:20301419
    reference_title: Ataxia with Vitamin E Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: If both parents are known to be heterozygous for a TTPA pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of inheriting neither of the familial pathogenic variants.
    explanation: Establishes the autosomal recessive sibling recurrence risk counseled to families of affected probands.

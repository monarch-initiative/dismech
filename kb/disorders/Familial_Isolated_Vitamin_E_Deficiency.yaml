progression:
- phase: Onset
  age_range: 5-15 years (range 2-52 years)
  notes: Untreated disease typically manifests in childhood or early adolescence (ages 5-15 years), with earlier onset associated with truncating TTPA variants (such as c.744delA) and later adult onset associated with hypomorphic missense variants.
  evidence:
  - reference: PMID:20301419
    reference_title: Ataxia with Vitamin E Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Untreated ataxia with vitamin E deficiency (AVED) generally manifests between ages five and 15 years.
    explanation: GeneReviews defines the typical age of onset for untreated AVED as 5 to 15 years.
- phase: Progression
  age_range: Childhood through adulthood
  notes: Without treatment, spinocerebellar ataxia and sensory neuropathy progress inexorably to wheelchair dependence; high-dose vitamin E supplementation stabilizes neurological progression in most patients and prevents manifestations if started presymptomatically.
  evidence:
  - reference: PMID:15300460
    reference_title: 'Ataxia with isolated vitamin E deficiency: neurological phenotype, clinical follow-up and novel mutations in TTPA gene in Italian families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Vitamin E supplementation therapy allowed a stabilization of the neurological conditions in most of the patients.
    explanation: Long-term follow-up of Italian AVED families demonstrates stabilization of neurological progression with vitamin E supplementation.
  - reference: PMID:20301419
    reference_title: Ataxia with Vitamin E Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Lifelong targeted therapy with high-dose oral vitamin E supplementation (that brings plasma vitamin E concentrations into the high-normal range) initiated in presymptomatic individuals (e.g., younger sibs of an index case) prevents the manifestations of AVED.
    explanation: Presymptomatic vitamin E supplementation prevents disease onset and progression.
pathophysiology:
- name: Alpha-Tocopherol Transfer Protein Deficiency
  description: >-
    Biallelic mutations in TTPA cause loss or severe reduction of hepatic
    alpha-tocopherol transfer protein (alpha-TTP) activity. Because alpha-TTP is
    responsible for selectively binding diet-derived RRR-alpha-tocopherol in
    hepatocytes and facilitating its transfer into nascent VLDL particles, its
    deficiency impairs hepatic vitamin E retention and recycling while intestinal
    absorption via chylomicrons remains intact.
  role: trigger
  gene:
    preferred_term: TTPA
    term:
      id: hgnc:12404
      label: TTPA
  molecular_functions:
  - preferred_term: lipid transfer activity
    modifier: DECREASED

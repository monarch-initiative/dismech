    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: AVED patients have progressive spinocerebellar symptoms and markedly reduced plasma levels of vitamin E.
    explanation: Documents severe systemic plasma vitamin E deficiency in AVED patients.

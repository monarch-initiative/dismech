- name: Retinal Photoreceptor Oxidative Damage
  description: >-
    Retinal photoreceptor outer segments and the retinal pigment epithelium have
    high concentrations of polyunsaturated fatty acids and high oxygen tension,
    making them vulnerable to free-radical peroxidation and lipofuscin
    accumulation when systemic alpha-tocopherol is depleted.
  role: effector
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  locations:
  - preferred_term: retina
    term:

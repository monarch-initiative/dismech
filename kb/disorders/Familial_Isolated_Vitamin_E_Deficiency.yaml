      evidence_source: HUMAN_CLINICAL
      snippet: Dysregulation of this lipid-soluble antioxidant vitamin plays a major role in the neurodegeneration observed in AVED. Some AVED patients experience decreased visual acuity. Retinitis pigmentosa is thought to be the main cause of this visual impairment.
      explanation: Vitamin E deficiency causes retinal pigmentary degeneration and visual impairment in a subset of AVED patients.
  - target: Hypertrophic cardiomyopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Severe systemic vitamin E deficiency predisposes a subset of patients (approximately 19%, particularly those with truncating mutations) to myocardial injury and hypertrophic cardiomyopathy.
    evidence:

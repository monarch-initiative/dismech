  - target: Oxidative Neuronal Damage
    causal_link_type: DIRECT
    description: Loss of lipid-soluble antioxidant protection in neuronal membranes leads to free radical-mediated peroxidative injury and neurodegeneration.
    evidence:
    - reference: PMID:25066259
      reference_title: Retinitis pigmentosa and macular degeneration in a patient with ataxia with isolated vitamin E deficiency with a novel c.717 del C mutation in the TTPA gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: However, AVED is associated with low plasma vitamin E levels, which results in compromised antioxidant function. Dysregulation of this lipid-soluble antioxidant vitamin plays a major role in the neurodegeneration observed in AVED.

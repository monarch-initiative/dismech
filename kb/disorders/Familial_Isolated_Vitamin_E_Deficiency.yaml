      evidence_source: HUMAN_CLINICAL
      snippet: These findings suggest that this newly identified mutation results in severely low serum vitamin E levels, which may be associated with the development of retinitis pigmentosa and macular degeneration.
      explanation: Severe vitamin E deficiency from truncating TTPA mutation is associated with macular degeneration and retinitis pigmentosa.

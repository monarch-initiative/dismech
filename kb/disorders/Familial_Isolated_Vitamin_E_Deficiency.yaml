- name: Plasma Vitamin E Therapeutic Monitoring
  description: >-
    Regular monitoring of plasma vitamin E (alpha-tocopherol) concentration
    every 6 months, particularly in children, to ensure levels remain within the
    high-normal therapeutic range and prevent relapse of neurological progression.
  action_category: MONITORING
  treatment_term:
    preferred_term: Blood Chemistry Measurement
    term:
      id: NCIT:C47868
      label: Blood Chemistry Measurement
  evidence:
  - reference: PMID:20301419
    reference_title: Ataxia with Vitamin E Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Monitor plasma vitamin E concentration in treated individuals – particularly children – every six months.
    explanation: GeneReviews recommends monitoring plasma vitamin E concentrations every six months in treated patients.
- name: Genetic Counseling and Presymptomatic Sibling Screening
  description: >-
    Autosomal recessive genetic counseling and molecular/biochemical testing of
    at-risk siblings of an index case as early as possible so that prophylactic
    high-dose oral vitamin E therapy can be initiated before neurological signs
    develop.
  action_category: COUNSELING_INFORMATIONAL

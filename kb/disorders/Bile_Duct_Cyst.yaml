- category: Gastrointestinal
  name: Cholangitis
  description: >-
    Recurrent bacterial infection of the stagnant, refluxed bile within the cyst.
    It is one of the commonest complications and, with the strictures and stones
    that accompany it, drives much of the morbidity before excision.
  phenotype_term:
    preferred_term: Cholangitis
    term:
      id: HP:0030151
      label: Cholangitis
  evidence:
  - reference: PMID:28364277
    reference_title: 'Pediatric choledochal cysts: diagnosis and current management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Accordingly, APBDU-associated choledochal cyst patients are significantly more
      likely to have evidence of hepatitis, cholangitis or pancreatitis and pathologically
      confirmed inflammation.
    explanation: Ties cholangitis specifically to the maljunction subgroup modelled here.
- category: Gastrointestinal
  name: Pancreatitis
  description: >-
    Inflammation of the pancreas arising from the same long common channel, in
    which biliary contents reflux into the pancreatic duct. It is a common

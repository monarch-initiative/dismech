- category: Gastrointestinal
  name: Choledocholithiasis
  description: >-
    Stone formation within the dilated, poorly draining duct. Stones are a
    consequence of biliary stasis rather than an independent disease, and they
    aggravate the obstruction and infection that produced them.
  phenotype_term:
    preferred_term: Choledocholithiasis

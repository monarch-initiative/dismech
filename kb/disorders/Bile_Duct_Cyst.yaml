name: Bile Duct Cyst
creation_date: '2026-08-31T20:00:00Z'
synonyms:
- choledochal cyst
- congenital biliary dilatation
- choledochal malformation
- cystic dilatation of the bile duct
description: >-
  Bile duct cyst, more commonly called choledochal cyst or congenital biliary
  dilatation, is a rare congenital cystic or fusiform dilatation of the intra-
  and/or extrahepatic biliary tree. In most cases it arises on a background of
  pancreaticobiliary maljunction, in which the pancreatic and common bile ducts
  fuse outside the duodenal wall to form an abnormally long common channel lying
  beyond the regulatory control of the sphincter of Oddi. Because pancreatic duct
  pressure exceeds bile duct pressure, activated pancreatic enzymes reflux
  persistently into the biliary tree and chronically injure the biliary
  epithelium. That single lesion drives two consequences: the cystic dilatation
  itself, and a hyperplasia-dysplasia-carcinoma sequence that gives the condition
  its defining clinical importance, a lifelong and markedly elevated risk of
  cholangiocarcinoma and gallbladder carcinoma. The disease shows female
  predominance and marked East Asian clustering. Anatomic subtypes follow the
  Todani classification. Diagnosis is anchored on magnetic resonance
  cholangiopancreatography, which demonstrates both the dilatation and the causal
  maljunction. Treatment is complete excision of the extrahepatic cyst with
  cholecystectomy and Roux-en-Y hepaticojejunostomy, which removes the
  premalignant epithelium and diverts pancreatic juice away from the biliary
  tree. Outcome after complete excision is good, but a residual biliary cancer
  risk persists in retained duct segments and rises with time, so surveillance is
  lifelong.
categories:
- Congenital Biliary Anomaly
- Premalignant Condition
parents:
- bile duct disorder
prevalence:
- population: Western paediatric cohort, single-centre 37-year series
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  notes: >-
    Incidence in a Western population rose over the study period from about 1 in
    128,000 to about 1 in 38,000, which the authors attribute at least in part to
    improved antenatal and postnatal imaging. Reported incidence is far higher in
    East Asian populations.
  evidence:
  - reference: PMID:25123318
    reference_title: 'Increasing occurrence of choledochal malformations in children: a single-center 37-year
      experience from Finland.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the estimated total incidence rose from 1:128,000 to 1:38,000 (p = 0.017)
    explanation: Gives the Western incidence range and its change over the study period.
inheritance:
- name: Multifactorial
  description: >-
    Not a Mendelian disorder. Familial cases and associations with other anomalies
    are reported, but no causal gene has been established and the molecular
    pathogenesis remains poorly understood. The primary lesion is an anatomical
    developmental anomaly of the pancreaticobiliary junction rather than a
    single-gene defect.
  evidence:
  - reference: PMID:35741793
    reference_title: 'Pathogenesis of Choledochal Cyst: Insights from Genomics and Transcriptomics.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although family cases or CC associated with other anomalies have been reported,
      the molecular pathogenesis of CC is still poorly understood
    explanation: Establishes that familial occurrence exists but no molecular cause is
      established, which is the basis for the multifactorial classification.
has_subtypes:
- name: Type I
  display_name: Todani type I - extrahepatic bile duct dilatation
  description: >-
    Cystic, focal or fusiform dilatation of the extrahepatic bile duct. The
    commonest type, and together with type IV the one most associated with
    malignancy.
  evidence:
  - reference: PMID:28364277
    reference_title: 'Pediatric choledochal cysts: diagnosis and current management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Type I and IV are the most common and most likely to be associated with malignancy
    explanation: Establishes type I as one of the two commonest types and its malignant
      association.
- name: Type II
  display_name: Todani type II - supraduodenal diverticulum
  description: >-
    A true diverticulum of the extrahepatic bile duct. Rare.
  evidence:
  - reference: PMID:28364277
    reference_title: 'Pediatric choledochal cysts: diagnosis and current management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In 1977, Todani and colleagues modified the original Alonso-Lej classification
      to include five types of CC.
    explanation: Establishes the five-type Todani scheme within which this subtype is defined.
- name: Type III
  display_name: Todani type III - choledochocele
  description: >-
    Dilatation of the intraduodenal or intramural portion of the distal common
    bile duct. Often amenable to endoscopic rather than open management.
  evidence:
  - reference: PMID:28364277
    reference_title: 'Pediatric choledochal cysts: diagnosis and current management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In 1977, Todani and colleagues modified the original Alonso-Lej classification
      to include five types of CC.
    explanation: Establishes the five-type Todani scheme within which this subtype is defined.
- name: Type IV
  display_name: Todani type IV - combined intrahepatic and extrahepatic, or multiple extrahepatic
  description: >-
    Type IVa involves both intrahepatic and extrahepatic ducts; type IVb is
    multiple extrahepatic cysts. The second commonest type, and with type I the
    one most associated with malignancy.
  evidence:
  - reference: PMID:28364277
    reference_title: 'Pediatric choledochal cysts: diagnosis and current management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Type I and IV are the most common and most likely to be associated with malignancy
    explanation: Establishes type IV as one of the two commonest types and its malignant
      association.
- name: Type V
  display_name: Todani type V - Caroli disease (curated separately)
  description: >-
    Intrahepatic dilatation only. Type V is Caroli disease, which is curated as a
    standalone dismech entry because its mechanism is distinct: it arises from a
    ductal plate malformation and is a cholangiociliopathy, not a consequence of
    pancreaticobiliary maljunction and enzyme reflux. It is listed here for
    completeness of the Todani scheme rather than restated.
  evidence:
  - reference: PMID:28364277
    reference_title: 'Pediatric choledochal cysts: diagnosis and current management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In 1977, Todani and colleagues modified the original Alonso-Lej classification
      to include five types of CC.
    explanation: Establishes the five-type Todani scheme in which Caroli disease is type V.
pathophysiology:
- name: Pancreaticobiliary Maljunction
  description: >-
    The initiating congenital lesion. The pancreatic and common bile ducts join
    outside the duodenal wall, producing an abnormally long common channel that
    lies beyond the sphincter of Oddi. The sphincter therefore cannot regulate the
    junction, and the two duct systems communicate freely.
  locations:
  - preferred_term: common bile duct
    term:
      id: UBERON:0001174
      label: common bile duct
  - preferred_term: pancreatic duct
    term:
      id: UBERON:0007329
      label: pancreatic duct
  evidence:
  - reference: PMID:31341359
    reference_title: 'Choledochal cysts: Similarities and differences between Asian and Western countries.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: They are thought to arise from an anomalous pancreaticobiliary junction, which
      are congenital anomalies between pancreatic and bile ducts.
    explanation: Establishes anomalous pancreaticobiliary junction as the congenital lesion
      from which these cysts are thought to arise.
  downstream:
  - target: Pancreatobiliary Reflux
    description: An unregulated long common channel allows pancreatic juice to enter the
      biliary tree.
    evidence:
    - reference: PMID:24604978
      reference_title: Correlation of intracystic pressure with cyst volume, length of common channel, biochemical
        changes in bile and histopathological changes in liver in choledochal cyst.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: In the present study it was found that pressure inversely correlated with the
        long common channel (P= 0.001).
      explanation: Directly relates common channel length to intracystic pressure, the measured
        link between the maljunction anatomy and the cyst.
- name: Pancreatobiliary Reflux
  description: >-
    Because hydrostatic pressure in the pancreatic duct exceeds that in the bile
    duct, activated pancreatic enzymes reflux persistently into the biliary tree.
    This is the mechanistic bridge between the anatomical anomaly and the tissue
    damage that follows.
  locations:
  - preferred_term: biliary tree
    term:
      id: UBERON:0001173
      label: biliary tree
  evidence:
  - reference: PMID:24604978
    reference_title: Correlation of intracystic pressure with cyst volume, length of common
      channel, biochemical changes in bile and histopathological changes in liver in choledochal
      cyst.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A reflux of pancreatic contents into the cyst due to long common channel is likely
      to worsen the pathology further.
    explanation: States the reflux of pancreatic contents driven by the long common channel,
      which is the mechanism this node describes.
  downstream:
  - target: Chronic Biliary Epithelial Injury
    description: Refluxed activated enzymes damage an epithelium not adapted to them.
    evidence:
    - reference: PMID:24604978
      reference_title: Correlation of intracystic pressure with cyst volume, length of common
        channel, biochemical changes in bile and histopathological changes in liver in choledochal
        cyst.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: It appears that refluxing amylase and lipase may cause these changes in the
        cyst wall
      explanation: Attributes the cyst wall changes to refluxed pancreatic enzymes, which is
        exactly what this edge asserts.
- name: Chronic Biliary Epithelial Injury
  description: >-
    The convergent tissue lesion. Refluxed pancreatic enzymes, bile stasis and
    raised intraductal bile-acid concentration injure the biliary epithelium
    repeatedly. Cyst wall histology shows ulceration, inflammation, fibrosis and
    metaplasia, and this node is the branch point from which both the dilatation
    and the carcinogenic sequence follow.
  cell_types:
  - preferred_term: cholangiocyte
    term:
      id: CL:1000488
      label: cholangiocyte
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  locations:
  - preferred_term: bile duct
    term:
      id: UBERON:0002394
      label: bile duct
  evidence:
  - reference: PMID:24604978
    reference_title: Correlation of intracystic pressure with cyst volume, length of common channel, biochemical
      changes in bile and histopathological changes in liver in choledochal cyst.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: ICCP inversely correlated with cyst wall changes (P = 0.003, 0.0001, 0.023, 0.0013,
      respectively)
    explanation: Quantifies the cyst wall ulceration, inflammation, fibrosis and metaplasia that
      constitute this injury, and shows they are worst in the low-pressure maljunction cysts.
  downstream:
  - target: Cystic Dilatation of the Bile Duct
    description: Sustained enzyme exposure through a long common channel accompanies the
      high-volume, low-pressure dilated cyst.
    evidence:
    - reference: PMID:24604978
      reference_title: Correlation of intracystic pressure with cyst volume, length of common channel, biochemical
        changes in bile and histopathological changes in liver in choledochal cyst.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Low-pressure cysts have high volume and higher levels of amylase and lipase
      explanation: The dilated high-volume cysts are the low-pressure, high-amylase ones, so
        enzyme exposure rather than raised pressure is what this edge asserts.
  - target: Hyperplasia-Dysplasia-Carcinoma Sequence
    description: Repeated injury and repair drive a stepwise neoplastic progression in the
      biliary epithelium.
    evidence:
    - reference: PMID:34798839
      reference_title: 'Stepwise correlation of TP53 mutations from pancreaticobiliary maljunction to gallbladder
        carcinoma: a retrospective study.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: the TP53 mutation rates in the epithelium of control patients, epithelium of
        PBM patients without GBC, peritumoral mucosa of GBC patients with PBM, and tumor tissue
        of GBC patients with PBM were 10, 10, 38, and 75%, respectively (p <  0.01)
      explanation: The 10 to 38 to 75 percent gradient across the field is the stepwise
        progression this edge asserts.
- name: Cystic Dilatation of the Bile Duct
  description: >-
    The defining anatomical lesion and the reason the condition is named as it is.
    The pressure relationship is counterintuitive and worth stating explicitly:
    intracystic pressure correlates inversely with cyst volume and inversely with
    common channel length, and high-pressure cysts were those with a normal
    pancreaticobiliary junction. The maljunction cysts modelled here are therefore
    the low-pressure, high-volume, high-amylase ones, in which enzyme exposure
    rather than raised pressure damages the wall; raised pressure instead tracks
    with hepatic parenchymal injury.
  locations:
  - preferred_term: extrahepatic bile duct
    term:
      id: UBERON:0003703
      label: extrahepatic bile duct
  evidence:
  - reference: PMID:24604978
    reference_title: Correlation of intracystic pressure with cyst volume, length of common channel, biochemical
      changes in bile and histopathological changes in liver in choledochal cyst.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: High pressure cysts had normal pancreaticobiliary junction.
    explanation: Establishes that the maljunction cases this entry models are the low-pressure
      ones, which is why pressure is not invoked as the driver of dilatation.
- name: Hyperplasia-Dysplasia-Carcinoma Sequence
  description: >-
    The clinically decisive consequence. Repeated injury and repair drive
    epithelial hyperplasia, then dysplasia, then carcinoma, with TP53 alteration
    accumulating stepwise along the maljunction-to-carcinoma axis. This is why the
    condition is treated as premalignant and excised rather than drained, and why
    surveillance continues for decades after operation.
  cell_types:
  - preferred_term: cholangiocyte
    term:
      id: CL:1000488
      label: cholangiocyte
  biological_processes:
  - preferred_term: epithelial cell proliferation
    modifier: INCREASED
    term:
      id: GO:0050673
      label: epithelial cell proliferation
  locations:
  - preferred_term: biliary tree
    term:
      id: UBERON:0001173
      label: biliary tree
  evidence:
  - reference: PMID:17187167
    reference_title: Bile duct cyst as precursor to biliary tract cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pathological findings strongly suggest a hyperplasia-dysplasia-carcinoma sequence
      in carcinogenesis of pancreatico-biliary maljunction (PBM).
    explanation: Names the hyperplasia-dysplasia-carcinoma sequence in maljunction directly,
      which is exactly what this node asserts.
  - reference: PMID:34798839
    reference_title: 'Stepwise correlation of TP53 mutations from pancreaticobiliary maljunction to gallbladder
      carcinoma: a retrospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the TP53 mutation rates in the epithelium of control patients, epithelium of PBM
      patients without GBC, peritumoral mucosa of GBC patients with PBM, and tumor tissue of
      GBC patients with PBM were 10, 10, 38, and 75%, respectively (p <  0.01)
    explanation: Quantifies the stepwise molecular accumulation along that sequence.
  downstream:
  - target: Biliary Tract Carcinoma
    description: The dysplastic epithelium progresses to invasive carcinoma.
    evidence:
    - reference: PMID:17187167
      reference_title: Bile duct cyst as precursor to biliary tract cancer.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Cancer is found in 10-30% of adults with BDC.
      explanation: Quantifies progression to carcinoma in adults, which is the transition this
        edge asserts.
- name: Biliary Tract Carcinoma
  description: >-
    Clinical endpoint. Cholangiocarcinoma and gallbladder carcinoma arise in the
    affected biliary epithelium. Risk is low in the first decade and rises clearly
    with age, exceeding 10% after the second decade in Asian series, and it
    persists in retained duct segments after excision.
  locations:
  - preferred_term: biliary tree
    term:
      id: UBERON:0001173
      label: biliary tree
  evidence:
  - reference: PMID:17187167
    reference_title: Bile duct cyst as precursor to biliary tract cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The cancer-risk is low in childhood (<1% in the first decade), and shows a clear
      increase with age
    explanation: Gives the age dependence of the cancer risk that this endpoint describes.
  - reference: PMID:31341359
    reference_title: 'Choledochal cysts: Similarities and differences between Asian and Western countries.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: more than 10% after the second decade of life in Asian patients
    explanation: Quantifies the malignant risk after the second decade in Asian patients.
  - reference: PMID:17187167
    reference_title: Bile duct cyst as precursor to biliary tract cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cholangiocarcinoma is the most common malignancy in BDC, and represents a 20- to
      30-fold risk compared to the general population.
    explanation: Gives the magnitude of the cholangiocarcinoma excess risk relative to the
      general population.
phenotypes:
- category: Gastrointestinal
  name: Bile Duct Cyst
  description: >-
    The defining structural phenotype: cystic or fusiform dilatation of the
    extrahepatic and sometimes intrahepatic bile duct.
  phenotype_term:
    preferred_term: cystic dilatation of the extrahepatic bile duct
    term:
      id: HP:0035013
      label: Abnormal extrahepatic bile duct morphology
  evidence:
  - reference: PMID:24604978
    reference_title: Correlation of intracystic pressure with cyst volume, length of common channel, biochemical
      changes in bile and histopathological changes in liver in choledochal cyst.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Low-pressure cysts have high volume and higher levels of amylase and lipase
    explanation: Describes the dilated high-volume cyst that constitutes this structural
      phenotype.
- category: Gastrointestinal
  name: Abdominal Pain
  description: >-
    One element of the classic triad. It is the dominant presenting symptom in
    adults, in whom the full triad is uncommon.
  phenotype_term:
    preferred_term: Abdominal pain
    term:
      id: HP:0002027
      label: Abdominal pain
  evidence:
  - reference: PMID:19701664
    reference_title: 'Choledochal cysts in children and adults with contrasting profiles: 11-year experience at a

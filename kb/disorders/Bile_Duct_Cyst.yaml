diagnosis:
- name: Magnetic resonance cholangiopancreatography
  description: >-
    The reference diagnostic test. MRCP non-invasively demonstrates both the
    biliary dilatation and the causal pancreaticobiliary maljunction, which is
    what distinguishes this condition from other causes of biliary dilatation and
    determines the operation.
  diagnosis_term:
    preferred_term: magnetic resonance cholangiopancreatography
    term:
      id: NCIT:C113775
      label: Magnetic Resonance Cholangiopancreatography
  evidence:
  - reference: PMID:23686589
    reference_title: 'Diagnosis and management of giant choledochal cysts: complexities compared to smaller cysts.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Magnetic resonance cholangiopancreatography correctly achieved the diagnosis in
      all
    explanation: Documents MRCP achieving the correct diagnosis in every case in this series.
treatments:
- name: Complete Cyst Excision with Roux-en-Y Hepaticojejunostomy
  description: >-
    The definitive operation. Complete excision of the extrahepatic cyst with
    cholecystectomy removes the premalignant epithelium, and Roux-en-Y
    hepaticojejunostomy restores biliary drainage while diverting pancreatic juice
    away from the biliary tree, so it addresses both the reflux and the cancer
    risk. Simple drainage is inadequate because it leaves the at-risk epithelium
    in place.
  treatment_term:
    preferred_term: hepaticojejunostomy
    term:
      id: NCIT:C119012
      label: Hepaticojejunostomy
  target_mechanisms:
  - target: Pancreatobiliary Reflux
    treatment_effect: BYPASSES
    description: >-
      Reconstructing drainage through a Roux limb routes bile away from the pancreatic
      duct, which is a genuine alternative pathway rather than a reduction of the
      reflux at its source.
    evidence:
    - reference: PMID:28364277
      reference_title: 'Pediatric choledochal cysts: diagnosis and current management.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Type I and IV are the most common and most likely to be associated with malignancy
      explanation: The malignant association of the commonest types is the reason drainage is
        diverted and the epithelium excised rather than left in situ.
  - target: Hyperplasia-Dysplasia-Carcinoma Sequence
    treatment_effect: INHIBITS
    description: >-
      Excising the cyst removes the epithelium in which the neoplastic sequence occurs,
      which is why excision rather than drainage is standard.
    evidence:
    - reference: PMID:22989043
      reference_title: Risk of subsequent biliary malignancy in patients undergoing cyst excision for congenital
        choledochal cysts.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The risk of biliary malignancy in the remnant bile duct increases more than 15
        years after cyst excision
      explanation: Malignancy arising specifically in the remnant duct shows that removing
        epithelium is what reduces risk, and that residual epithelium retains it.
  evidence:
  - reference: PMID:28364277
    reference_title: 'Pediatric choledochal cysts: diagnosis and current management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Type I and IV are the most common and most likely to be associated with malignancy
    explanation: The malignant potential of the commonest types is what makes complete excision
      rather than drainage the standard operation.
progression:
- phase: Presentation
  age_range: Childhood presentation is more complete; adults present differently
  notes: >-
    The classic triad of jaundice, abdominal pain and a palpable mass is markedly
    more common in children than adults, in whom pain and pancreatitis dominate
    and the full triad is uncommon.
  evidence:
  - reference: PMID:19701664
    reference_title: 'Choledochal cysts in children and adults with contrasting profiles: 11-year experience at a
      tertiary care center in Kashmir.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the classic triad of jaundice, abdominal pain, and a mass was 6.7 times more common
      in group A
    explanation: Quantifies the age dependence of the presenting triad.
- phase: Lifelong post-excision surveillance
  notes: >-
    Excision does not abolish the cancer risk. Biliary malignancy in the remnant
    duct rises beyond fifteen years after operation, and outcomes once it occurs
    are poor, so surveillance continues for decades.
  evidence:
  - reference: PMID:22989043
    reference_title: Risk of subsequent biliary malignancy in patients undergoing cyst excision for congenital
      choledochal cysts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The risk of biliary malignancy in the remnant bile duct increases more than 15
      years after cyst excision
    explanation: Establishes the late and rising residual risk that drives lifelong follow-up.
disease_term:
  preferred_term: bile duct cyst
  term:
    id: MONDO:0018805
    label: bile duct cyst
notes: >-
  Relationship to Caroli_Disease.yaml. Todani type V is Caroli disease, which is
  curated as its own dismech entry. It is listed in has_subtypes for completeness
  of the Todani scheme but deliberately not restated here, because its mechanism
  is different in kind: Caroli arises from a ductal plate malformation and is a
  cholangiociliopathy associated with PKHD1, whereas types I to IV are driven by
  pancreaticobiliary maljunction with pancreatic enzyme reflux. MONDO reflects
  this too, placing MONDO:0018805 and MONDO:0010913 in separate branches with no
  parent-child relation. The pathograph in this entry describes the maljunction
  mechanism and should not be read as applying to type V.

  Ontology note. HPO has no term for choledochal cyst or bile duct cyst of the
  extrahepatic duct. This was checked exhaustively rather than with a truncated
  search: the patterns "bile duct cyst", "biliary cyst", "choledochal", "bile
  duct dilat" and "dilatation of the bile duct" return only HP:0005209
  Intrahepatic bile duct cysts, which is the intrahepatic lesion of Caroli
  disease and therefore wrong here, and HP:0033149 Intrahepatic bile duct
  dilatation. The structural phenotype therefore binds the parent term
  HP:0035013 Abnormal extrahepatic bile duct morphology with a more specific
  preferred_term.

  Known extension points: a datasets section; clinical_trials; the female
  predominance and East Asian clustering, which the research report describes but
  for which no cleanly quotable ratio was found in the cached abstracts;
  histopathology as a structured section; and endoscopic management of the type
  III choledochocele, which differs from the excisional approach described here.

  phenotype_term:
    preferred_term: Cholangiocarcinoma
    term:
      id: HP:0030153
      label: Cholangiocarcinoma
  evidence:
  - reference: PMID:17187167
    reference_title: Bile duct cyst as precursor to biliary tract cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The cancer-risk is low in childhood (<1% in the first decade), and shows a clear
      increase with age
    explanation: Establishes the age-dependent malignant risk in this condition.
genetic:
- name: TP53
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: Stepwise Somatic Alteration
  notes: >-
    Not a germline cause of the malformation. TP53 alteration accumulates
    stepwise in the biliary and gallbladder epithelium along the
    maljunction-to-carcinoma axis, and in that series it was more prominent than
    KRAS mutation.
  evidence:
  - reference: PMID:34798839
    reference_title: 'Stepwise correlation of TP53 mutations from pancreaticobiliary maljunction to gallbladder
      carcinoma: a retrospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the TP53 mutation rates in the epithelium of control patients, epithelium of PBM
      patients without GBC, peritumoral mucosa of GBC patients with PBM, and tumor tissue of
      GBC patients with PBM were 10, 10, 38, and 75%, respectively (p <  0.01)
    explanation: Quantifies the stepwise TP53 accumulation that defines this gene's role here.
- name: KRAS
  gene_term:
    preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: Early but Not Maljunction-Specific Somatic Mutation
  notes: >-
    KRAS mutation appears early in the hyperplastic epithelium, but it does not
    distinguish maljunction-associated cancer from sporadic gallbladder cancer.
    It is included here as a qualifying observation: the maljunction-specific
    molecular signal in this series was inflammatory (IL-33 overexpression) and,
    in the TP53 series above, tumour-suppressor loss - not KRAS.
  evidence:
  - reference: PMID:30882917
    reference_title: IL-33 overexpression in gallbladder cancers associated with pancreatobiliary maljunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The incidence of KRAS mutations was similarly low in PBM-associated (five of 32
      cases; 16%) and non-associated cancers (four of 49 cases; 8%) (P = 0.272).
    explanation: Shows KRAS mutation is present but not enriched in maljunction-associated
      cancer, which is why it is recorded as a qualifying rather than a driving finding.
diagnosis:
- name: Magnetic resonance cholangiopancreatography
  description: >-
    The reference diagnostic test. MRCP non-invasively demonstrates both the
    biliary dilatation and the causal pancreaticobiliary maljunction, which is
    what distinguishes this condition from other causes of biliary dilatation and
    determines the operation.
  diagnosis_term:
    preferred_term: magnetic resonance cholangiopancreatography
    term:
      id: NCIT:C113775
      label: Magnetic Resonance Cholangiopancreatography
  evidence:
  - reference: PMID:23686589
    reference_title: 'Diagnosis and management of giant choledochal cysts: complexities compared to smaller cysts.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Magnetic resonance cholangiopancreatography correctly achieved the diagnosis in
      all
    explanation: Documents MRCP achieving the correct diagnosis in every case in this series.
treatments:
- name: Complete Cyst Excision with Roux-en-Y Hepaticojejunostomy
  description: >-
    The definitive operation. Complete excision of the extrahepatic cyst with
    cholecystectomy removes the premalignant epithelium, and Roux-en-Y
    hepaticojejunostomy restores biliary drainage while diverting pancreatic juice
    away from the biliary tree, so it addresses both the reflux and the cancer
    risk. Simple drainage is inadequate because it leaves the at-risk epithelium
    in place.
  treatment_term:
    preferred_term: hepaticojejunostomy
    term:
      id: NCIT:C119012
      label: Hepaticojejunostomy
  target_mechanisms:
  - target: Pancreatobiliary Reflux
    treatment_effect: BYPASSES
    description: >-
      Reconstructing drainage through a Roux limb routes bile away from the pancreatic
      duct, which is a genuine alternative pathway rather than a reduction of the
      reflux at its source.
    evidence:
    - reference: PMID:28364277
      reference_title: 'Pediatric choledochal cysts: diagnosis and current management.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Appropriate management consists of prompt, complete cyst excision followed by
        restoration of biliary enteric continuity when necessary.
      explanation: States the operation itself - excision plus restoration of biliary enteric
        continuity, which is the rerouting this link describes.
  - target: Hyperplasia-Dysplasia-Carcinoma Sequence
    treatment_effect: INHIBITS
    description: >-
      Excising the cyst removes the epithelium in which the neoplastic sequence occurs,
      which is why excision rather than drainage is standard.
    evidence:
    - reference: PMID:22989043
      reference_title: Risk of subsequent biliary malignancy in patients undergoing cyst excision for congenital
        choledochal cysts.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The risk of biliary malignancy in the remnant bile duct increases more than 15
        years after cyst excision
      explanation: Malignancy arising specifically in the remnant duct shows that removing
        epithelium is what reduces risk, and that residual epithelium retains it.
  evidence:
  - reference: PMID:28364277
    reference_title: 'Pediatric choledochal cysts: diagnosis and current management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Appropriate management consists of prompt, complete cyst excision followed by
      restoration of biliary enteric continuity when necessary.
    explanation: States complete excision with biliary enteric reconstruction as the standard
      management.
mechanistic_hypotheses:
- hypothesis_group_id: pancreaticobiliary_reflux_theory
  hypothesis_label: Pancreaticobiliary Maljunction (Reflux) Theory
  status: CANONICAL
  description: >-
    The pathograph in this entry follows this theory. An anomalous junction of
    the pancreatic and common bile ducts outside the duodenal wall creates a long
    common channel beyond sphincter control, activated pancreatic enzymes reflux
    persistently into the biliary tree, and the resulting chronic epithelial
    injury produces both the dilatation and, over decades, the
    hyperplasia-dysplasia-carcinoma sequence.
  evidence:
  - reference: PMID:25588714
    reference_title: 'Adult choledochal cysts: current update on classification, pathogenesis, and cross-sectional
      imaging findings.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The two leading theories involve either the presence of an anomalous
      pancreatico-biliary junction with associated reflux of pancreatic juice into the biliary
      system or, more recently, some form of antenatal biliary obstruction with resulting
      proximal bile duct dilation.
    explanation: States the reflux theory as one of the two leading accounts, and in the same
      sentence names the competing account recorded below.
  - reference: PMID:9434012
    reference_title: Acquired choledochal cyst from anomalous pancreatobiliary duct union.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This clinical experience suggests that a normal common bile duct in children can
      be progressively dilated and become an acquired choledochal cyst arising as a
      complication of the preexisting APBDU.
    explanation: A directly observed human sequence in which a normal duct dilated after a
      pre-existing maljunction, which is the ordering this theory requires.
  notes: >-
    The two theories are not mutually exclusive, and different Todani types may
    arise by different mechanisms. Type V is separate again - see the entry notes.
- hypothesis_group_id: congenital_distal_obstruction_theory
  hypothesis_label: Congenital Distal Obstruction Theory
  status: ALTERNATIVE
  description: >-
    The competing account, in which antenatal obstruction of the distal bile duct
    (or unequal epithelial proliferation during embryonic duct development)
    produces proximal dilatation, with the maljunction being an associated
    anomaly rather than the cause. It is recorded here because it is unresolved,
    not because this entry adopts it. It has more purchase in the cases without a
    demonstrable long common channel.
  evidence:
  - reference: PMID:25588714
    reference_title: 'Adult choledochal cysts: current update on classification, pathogenesis, and cross-sectional
      imaging findings.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The exact etiology of CCs is currently unknown. The two leading theories involve
      either the presence of an anomalous pancreatico-biliary junction with associated reflux
      of pancreatic juice into the biliary system or, more recently, some form of antenatal
      biliary obstruction with resulting proximal bile duct dilation.
    explanation: States explicitly that the etiology is unknown and that antenatal obstruction
      is the more recent of the two leading theories.
animal_models:
- name: Surgical APBDU mongrel puppy
  species: Dog
  publication: PMID:17021737
  description: >-
    A surgical model in which the pancreatic duct is anastomosed to the bile
    duct, reproducing the anomalous union without any congenital lesion. It is
    the most direct available test of the reflux theory, because the maljunction
    is the only variable introduced.
  evidence:
  - reference: PMID:17021737
    reference_title: The role of sphincteroplasty in adverse effect of anomalous pancreaticobiliary duct union
      in an animal model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: A well-established model of APBDU was produced in both groups.
    explanation: Confirms the surgically created anomalous union is an established model rather
      than an ad hoc construction.
  modeled_mechanisms:
  - target: Cystic Dilatation of the Bile Duct
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Surgically created maljunction alone is sufficient to produce bile duct
      dilatation and wall thickening in a previously normal duct.
    limitations: >-
      Three months of follow-up against a human course measured in decades, so it
      speaks to the dilatation and early mucosal change but not to carcinoma. The
      surgical junction is also an acute construction rather than a duct that
      formed abnormally in embryogenesis.
    evidence:
    - reference: PMID:17021737
      reference_title: The role of sphincteroplasty in adverse effect of anomalous pancreaticobiliary duct union
        in an animal model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Dilatation of the bile duct and thickening of the wall of the bile duct were
        observed less frequently in the experimental group than in the control group.
      explanation: The dilatation appears in the animals left with an uncorrected maljunction.
    readouts:
    - name: Bile duct dilatation and wall thickening
      target: Cystic Dilatation of the Bile Duct
      direction: INCREASED
      interpretation: >-
        The structural lesion appears in the control animals, which carry the
        maljunction without sphincteroplasty.
      evidence:
      - reference: PMID:17021737
        reference_title: The role of sphincteroplasty in adverse effect of anomalous pancreaticobiliary duct
          union in an animal model.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Dilatation of the bile duct and thickening of the wall of the bile duct were
          observed less frequently in the experimental group than in the control group.
        explanation: The control animals, which have the maljunction without sphincteroplasty,
          are the ones that dilate.
  - target: Chronic Biliary Epithelial Injury
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mucosal response to the surgically created maljunction is epithelial
      hyperplasia, the same proliferative change that begins the human sequence.
    limitations: >-
      Hyperplasia only; the model does not run long enough to show dysplasia or
      carcinoma.
    evidence:
    - reference: PMID:17021737
      reference_title: The role of sphincteroplasty in adverse effect of anomalous pancreaticobiliary duct union
        in an animal model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: epithelial hyperplasia was the predominant mucosal change found in the control
        group
      explanation: Names hyperplasia as the dominant epithelial change under an untreated
        maljunction.
- name: Dibutyltin dichloride (DBTC) rat
  species: Rat
  publication: PMID:26176076
  description: >-
    A chemically induced rat model of choledochal cyst used to time the molecular
    events. It is the source of the proposal that HDAC1 acts upstream of COX-2 in
    this carcinogenic sequence.
  evidence:
  - reference: PMID:26176076
    reference_title: 'Carcinogenic Potential of Biliary Epithelium of Congenital Choledochal Cyst Model in
      Rats: A Special Reference to HDAC Expression.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In the DBTC group, the bile duct had been gradually dilated on day 3 after
      administration and the biliary epithelium of dilated bile duct was papillary proliferated
      on day 7.
    explanation: Establishes that the model produces duct dilatation followed by epithelial
      proliferation.
  modeled_mechanisms:
  - target: Hyperplasia-Dysplasia-Carcinoma Sequence
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces duct dilatation followed by papillary epithelial proliferation
      with a rising proliferative index, and orders HDAC1 induction before the
      other markers.
    limitations: >-
      Chemically induced rather than anatomic - there is no maljunction and no
      pancreatic enzyme reflux - so it models the epithelial proliferative
      response rather than its human cause. It also stops at proliferation
      markers over fourteen days and does not reach carcinoma.
    evidence:
    - reference: PMID:26176076
      reference_title: 'Carcinogenic Potential of Biliary Epithelium of Congenital Choledochal Cyst Model in
        Rats: A Special Reference to HDAC Expression.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: These findings suggested that HDAC1 played an important role in carcinogenesis of
        PBM through the regulation of COX-2.
      explanation: States the proposed molecular ordering that this link records.
    readouts:
    - name: HDAC1 expression
      target: Hyperplasia-Dysplasia-Carcinoma Sequence
      direction: INCREASED
      interpretation: >-
        HDAC1 rises before the other markers, which is the basis for placing it
        upstream in the proposed sequence.
      evidence:
      - reference: PMID:26176076
        reference_title: 'Carcinogenic Potential of Biliary Epithelium of Congenital Choledochal Cyst Model in
          Rats: A Special Reference to HDAC Expression.'
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: HDAC1 expression increased at the early postoperative period prior to other
          oncogene, and reached the highest level of 15% on day 7.
        explanation: Gives the temporal ordering that places HDAC1 upstream.
progression:
- phase: Presentation
  age_range: Childhood presentation is more complete; adults present differently
  notes: >-
    The classic triad of jaundice, abdominal pain and a palpable mass is markedly
    more common in children than adults, in whom pain and pancreatitis dominate
    and the full triad is uncommon.
  evidence:
  - reference: PMID:19701664
    reference_title: 'Choledochal cysts in children and adults with contrasting profiles: 11-year experience at a
      tertiary care center in Kashmir.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the classic triad of jaundice, abdominal pain, and a mass was 6.7 times more common
      in group A
    explanation: Quantifies the age dependence of the presenting triad.
- phase: Lifelong post-excision surveillance
  notes: >-
    Excision does not abolish the cancer risk. Biliary malignancy in the remnant
    duct rises beyond fifteen years after operation, and outcomes once it occurs
    are poor, so surveillance continues for decades.
  evidence:
  - reference: PMID:22989043
    reference_title: Risk of subsequent biliary malignancy in patients undergoing cyst excision for congenital
      choledochal cysts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The risk of biliary malignancy in the remnant bile duct increases more than 15
      years after cyst excision
    explanation: Establishes the late and rising residual risk that drives lifelong follow-up.

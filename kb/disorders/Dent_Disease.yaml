      reference_title: "ClC-5 Cl- -channel disruption impairs endocytosis in a mouse model for Dent's disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Both receptor-mediated and fluid-phase endocytosis are affected, and the internalization of the apical transporters NaPi-2 and NHE3 is slowed."
      explanation: Shows the endocytic lesion also disturbs the apical transporters that handle phosphate and sodium-proton exchange.

- name: Failure of Proximal Tubular Protein Reabsorption
  biological_scale: TISSUE
  description: >
    Filtered low-molecular-weight proteins - beta-2-microglobulin,
    alpha-1-microglobulin, retinol-binding protein, and the vitamin-carrier
    proteins - are normally reclaimed almost completely by proximal tubular
    endocytosis. When that fails they appear in the urine. This is the obligate
    finding of the disease and, because the load can be large, total urinary
    protein may reach the nephrotic range without any glomerular lesion or
    hypoalbuminaemia.
  cell_types:
  - preferred_term: kidney proximal convoluted tubule epithelial cell
    term:
      id: CL:1000838
      label: kidney proximal convoluted tubule epithelial cell
  locations:
  - preferred_term: renal proximal tubule
    term:
      id: UBERON:0004134
      label: proximal tubule
  biological_processes:
  - preferred_term: protein transport
    term:
      id: GO:0015031
      label: protein transport
    modifier: DECREASED
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "As low-molecular-weight proteins are reabsorbed by receptor-mediated endocytosis in proximal tubular cells, low-molecular-weight proteinuria is an obligate finding in DD."
    explanation: Directly links the endocytic failure to the obligate clinical finding.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Affected individuals may present nephrotic-range proteinuria which may be misinterpreted and cause diagnostic delay."
    explanation: Records the diagnostic consequence of a tubular protein load large enough to look glomerular.
  downstream:
  - target: Low-molecular-weight proteinuria
    causal_link_type: DIRECT
  - target: Focal segmental glomerulosclerosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Glomerular lesions are found on most Dent disease biopsies. Whether they
      arise from the tubular protein load, from podocyte expression of ClC-5 and
      OCRL, or from both is unsettled.
    evidence:
    - reference: PMID:39794284
      reference_title: "Dent disease: clinical practice recommendations."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Emerging evidence also suggests that ClC-5 and OCRL may be expressed in human podocytes, potentially explaining the development of focal segmental glomerulosclerosis (FSGS) lesions observed in kidney biopsies of patients with DD1 and DD2"
      explanation: Records the current, explicitly tentative explanation for the glomerular lesion in a tubular disease.

- name: Urinary Loss of Vitamin D-Binding Protein and Parathyroid Hormone
  biological_scale: ORGANISM
  description: >
    Losing megalin/cubilin-mediated retrieval sends filtered vitamin D-binding
    protein, 25(OH)-vitamin D3 and PTH into the urine. Two opposing effects
    follow. Reduced endocytosis of luminal PTH raises the concentration seen by
    apical PTH receptors, which should drive 1-alpha-hydroxylation of
    25(OH)-vitamin D3 to the active hormone and so increase intestinal calcium
    absorption; at the same time the precursor itself is being lost in the
    urine. The balance of those two effects is the current explanation for why
    serum 1,25(OH)2-vitamin D3 is variable between patients and for why
    hypercalciuria is present in most but not all of them. The mechanism is
    inferred from the mouse model and from the known cargo of the receptor
    complex rather than demonstrated directly in patients.
  cell_types:
  - preferred_term: kidney proximal convoluted tubule epithelial cell
    term:
      id: CL:1000838
      label: kidney proximal convoluted tubule epithelial cell
  biological_processes:
  - preferred_term: renal excretion of vitamin D metabolites and PTH
    term:
      id: GO:0007588
      label: excretion
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:11099045
    reference_title: "ClC-5 Cl- -channel disruption impairs endocytosis in a mouse model for Dent's disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This may be caused by an increased stimulation of luminal parathyroid hormone (PTH) receptors owing to the observed decreased tubular endocytosis of PTH. The rise in luminal PTH concentration should also stimulate the hydroxylation of 25(OH) vitamin D3 to the active hormone. However, this is counteracted by a urinary loss of the precursor 25(OH) vitamin D3."
    explanation: Sets out the two opposing vitamin D effects that this node represents, as observed in the Clcn5 knockout mouse.
  downstream:
  - target: Urinary Calcium Supersaturation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Net increase in active 1,25(OH)2-vitamin D3 raising intestinal calcium absorption
    - Increased filtered calcium load presented to the tubule
    evidence:
    - reference: PMID:11099045
      reference_title: "ClC-5 Cl- -channel disruption impairs endocytosis in a mouse model for Dent's disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The balance between these opposing effects, both of which are secondary to the defect in proximal tubular endocytosis, probably determines whether there will be hypercalciuria and kidney stones."
      explanation: The authors themselves mark this link as probable rather than established, which is why the edge is indirect.
  - target: Hypercalciuria
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Generalized Proximal Tubular Solute Wasting
  biological_scale: TISSUE
  description: >
    Beyond protein, the proximal tubule of a Dent disease patient leaks a
    variable combination of amino acids, phosphate, glucose, urate and
    potassium, and urinary acidification may be impaired. The picture is an
    incomplete Fanconi syndrome rather than the full generalised defect: the
    guideline records it in 25-65% of Dent disease 1 and 30-70% of Dent disease
    2 patients. Sustained phosphate wasting is what produces the bone disease.
  cell_types:
  - preferred_term: kidney proximal convoluted tubule epithelial cell
    term:
      id: CL:1000838
      label: kidney proximal convoluted tubule epithelial cell
  locations:

    modifier: DECREASED
  - preferred_term: renal solute excretion
    term:
      id: GO:0007588
      label: excretion
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:20946626
    reference_title: "Dent's disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dent's disease may also be associated with aminoaciduria, phosphaturia, glycosuria, uricosuria, kaliuresis, and impaired urinary acidification, and is often complicated by rickets or osteomalacia"
    explanation: Enumerates the solutes wasted at this node and names the bone consequence of the phosphate leak.
  downstream:

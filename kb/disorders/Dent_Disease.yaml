  - target: Urinary Loss of Vitamin D-Binding Protein and Parathyroid Hormone
    causal_link_type: DIRECT
    description: >-
      The megalin/cubilin complex is also what retrieves vitamin D-binding
      protein, 25(OH)-vitamin D3, and filtered PTH, so its loss diverts those
      ligands into the urine.
    evidence:
    - reference: PMID:20946626
      reference_title: "Dent's disease."
      supports: SUPPORT

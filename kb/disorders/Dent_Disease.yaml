name: Dent Disease
category: Mendelian
creation_date: "2026-09-11T00:00:00Z"
synonyms:
- Dent's disease
- X-linked recessive nephrolithiasis
- X-linked recessive hypercalciuric hypophosphataemic rickets
- Low-molecular-weight proteinuria with hypercalciuria and nephrocalcinosis
- Dent disease 1
- Dent disease 2
description: >
  Dent disease is a rare X-linked proximal tubulopathy defined by
  low-molecular-weight proteinuria together with hypercalciuria, and complicated
  in a large fraction of affected males by nephrocalcinosis, nephrolithiasis,
  rickets or osteomalacia, and progressive chronic kidney disease reaching
  kidney failure between the third and fifth decades. Two genetic forms are
  recognised: Dent disease 1, caused by inactivating CLCN5 variants that remove
  the electrogenic 2Cl-/H+ exchanger ClC-5 from proximal tubular subapical
  endosomes, and Dent disease 2, caused by OCRL variants that reduce
  phosphatidylinositol 4,5-bisphosphate 5-phosphatase activity on the same
  endosomal compartment. Both converge on failure of the megalin/cubilin
  receptor-mediated endocytic apparatus of the proximal tubule, which is why the
  renal phenotypes overlap. A quarter to a third of clinically typical patients
  carry neither a CLCN5 nor an OCRL variant. Because total urinary protein
  excretion can reach the nephrotic range, the disease is frequently
  misinterpreted as a glomerular disease and diagnosis is delayed.

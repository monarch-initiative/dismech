    explanation: Guideline frequency table quantifies nephrocalcinosis separately for the two genetic subtypes.

- name: Nephrolithiasis
  category: Renal
  frequency: FREQUENT
  description: >
    Discrete calcium stones, manifesting later than nephrocalcinosis. Stone
    disease is prominent enough historically that the disorder was originally
    described as X-linked recessive nephrolithiasis.
  phenotype_term:
    preferred_term: Nephrolithiasis
    term:
      id: HP:0000787
      label: Nephrolithiasis
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nephrolithiasis | 20–40 | 10–15"
    explanation: Guideline frequency table quantifies stone disease in both genetic subtypes.
  - reference: PMID:20946626
    reference_title: "Dent's disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dent's disease is a renal tubular disorder characterized by manifestations of proximal tubule dysfunction, including low-molecular-weight proteinuria, hypercalciuria, nephrolithiasis, nephrocalcinosis, and progressive renal failure."
    explanation: Establishes nephrolithiasis as a defining manifestation of the disorder.

- name: Chronic kidney disease
  category: Renal
  frequency: FREQUENT
  description: >
    Progressive loss of kidney function is the outcome that dominates
    prognosis. Kidney failure appears between the third and fifth decades in
    30-80% of affected males, with a series reporting four of ten patients aged
    30-40 years, three of nine aged 40-50 and three of four aged 50-60 already
    in kidney failure. Progression is variable even within one family.
  phenotype_term:
    preferred_term: Chronic kidney disease
    term:
      id: HP:0012622
      label: Chronic kidney disease
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dent disease is a rare X-linked tubulopathy that is characterized by low-molecular-weight proteinuria associated with hypercalciuria, which may lead to nephrolithiasis, nephrocalcinosis, and kidney failure between the third and fifth decades of life in 30%-80% of affected males."
    explanation: Gives the timing and the proportion of affected males reaching kidney failure.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Four out of ten patients aged 30–40 years, three out of nine aged 40–50 years, and three out of four aged 50–60 years had kidney failure"
    explanation: Provides the age-stratified counts behind the aggregate kidney-failure figure.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Also, the course of kidney failure may be variable within the same family"
    explanation: Records intrafamilial variability, which constrains how far prognosis can be individualised from genotype.

- name: Focal segmental glomerulosclerosis
  category: Renal
  frequency: FREQUENT
  description: >
    Glomerular lesions are found on the great majority of Dent disease
    biopsies, with focal global glomerulosclerosis in 83% and mild segmental
    foot-process effacement in 57% of a 30-patient international biopsy series.
    Their presence is why the disease is so often first labelled as
    steroid-resistant nephrotic syndrome or idiopathic FSGS. Higher degrees of
    sclerosis, effacement and interstitial inflammation track with lower eGFR,
    and foot-process effacement with a steeper annual decline.
  phenotype_term:
    preferred_term: Focal segmental glomerulosclerosis
    term:
      id: HP:0000097
      label: Focal segmental glomerulosclerosis
  evidence:
  - reference: PMID:27697782
    reference_title: "Glomerular Pathology in Dent Disease and Its Association with Kidney Function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prominent histologic findings included focal global glomerulosclerosis in 83% (25 of 30; affecting 16%±19% glomeruli), mild segmental foot process effacement in 57% (13 of 23)"
    explanation: International biopsy series quantifying the glomerular lesion in Dent disease.
  - reference: PMID:27697782
    reference_title: "Glomerular Pathology in Dent Disease and Its Association with Kidney Function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Higher percentages of globally sclerotic glomeruli, foot process effacement, and interstitial inflammation were associated with lower eGFR at biopsy, whereas foot process effacement was associated with steeper annual eGFR decline."
    explanation: Links the glomerular lesion to kidney function and rate of decline, supporting its prognostic weight.
  - reference: PMID:27697782
    reference_title: "Glomerular Pathology in Dent Disease and Its Association with Kidney Function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dent disease should be suspected in boys and men who have unexplained proteinuria with focal global glomerulosclerosis and segmental foot process effacement on renal biopsy."
    explanation: States the diagnostic inversion this phenotype creates, which is the practical reason to curate it.

- name: Hypophosphatemia
  category: Metabolic
  frequency: OCCASIONAL
  description: >
    Usually mild to moderate, arising from proximal phosphate wasting.
    Prolonged hypophosphataemia is the route to the skeletal phenotype,
    although the guideline notes no clear correlation between its depth and the
    presence of rickets.
  phenotype_term:
    preferred_term: Hypophosphatemia
    term:
      id: HP:0002148
      label: Hypophosphatemia
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hypophosphatemia | 15–35 | 10–20"
    explanation: Guideline frequency table quantifies hypophosphatemia in both genetic subtypes.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "As hypophosphataemia in DD is usually mild or moderate, it can be corrected with increased dietary phosphate and/or oral supplementation."
    explanation: Characterises the severity of the phosphate deficit and its management.

- name: Aminoaciduria
  category: Metabolic
  frequency: FREQUENT
  description: >
    Generalised urinary amino acid loss as part of the incomplete Fanconi
    picture; commoner in Dent disease 2 than in Dent disease 1.
  phenotype_term:
    preferred_term: Aminoaciduria
    term:
      id: HP:0003355
      label: Aminoaciduria
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Aminoaciduria | 20–50 | 40–70"
    explanation: Guideline frequency table quantifies aminoaciduria in both genetic subtypes.

- name: Glycosuria
  category: Metabolic
  frequency: OCCASIONAL
  description: >
    Glucose in the urine at normal blood glucose, from proximal tubular
    reabsorptive failure rather than from diabetes.
  phenotype_term:
    preferred_term: Glycosuria
    term:
      id: HP:0003076
      label: Glycosuria
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Glucosuria | 20–40 | 5–15"
    explanation: Guideline frequency table quantifies glycosuria in both genetic subtypes.

- name: Hypokalemia
  category: Metabolic
  frequency: OCCASIONAL
  description: >
    Low serum potassium from renal potassium wasting; also a reason the
    guideline advises against routine thiazide use, which aggravates it.
  phenotype_term:
    preferred_term: Hypokalemia
    term:
      id: HP:0002900
      label: Hypokalemia
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hypokalaemia | 20–40 | 10–20"
    explanation: Guideline frequency table quantifies hypokalaemia in both genetic subtypes.

- name: Rickets
  category: Skeletal
  frequency: OCCASIONAL
  description: >
    Vitamin D-resistant rickets in children, with osteomalacia the adult
    counterpart. Active vitamin D should not be used to treat it, because
    1,25(OH)2 vitamin D is already inherently elevated and giving more worsens
    the hypercalciuria.
  phenotype_term:
    preferred_term: Rickets
    term:
      id: HP:0002748
      label: Rickets
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Rickets | 5–33 | 10–20"
    explanation: Guideline frequency table quantifies rickets in both genetic subtypes.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Few data on bone health in DD have been reported, except that some patients present with vitamin D-resistant rickets"
    explanation: Characterises the rickets as vitamin D-resistant, which drives the treatment caution recorded here.

- name: Osteomalacia
  category: Skeletal
  frequency: OCCASIONAL
  description: >
    The adult form of the same phosphate-wasting bone disease, arising from
    prolonged hypophosphataemia.
  phenotype_term:
    preferred_term: Osteomalacia
    term:
      id: HP:0002749
      label: Osteomalacia
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Prolonged hypophosphataemia may cause bone demineralization manifesting as rickets in children or osteomalacia in adults."
    explanation: Establishes osteomalacia as the adult skeletal manifestation of the tubular phosphate leak.

- name: Hematuria
  category: Renal
  frequency: OCCASIONAL
  description: >
    Usually microscopic, and one of the presenting findings that leads to
    investigation. It is one of the accepted supporting features of the
    clinical case definition.
  phenotype_term:
    preferred_term: Hematuria
    term:
      id: HP:0000790
      label: Hematuria
  evidence:
  - reference: PMID:20946626
    reference_title: "Dent's disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In addition, these patients may also have nephrocalcinosis, nephrolithiasis, haematuria, hypophosphataemia and/or renal insufficiency."
    explanation: Lists haematuria among the manifestations of Dent disease.
  - reference: PMID:34680992
    reference_title: "Genotype Phenotype Correlation in Dent Disease 2 and Review of the Literature: OCRL Gene Pleiotropism or Extreme Phenotypic Variability of Lowe Syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nephrocalcinosis was identified in 42% of the patients, nephrolithiasis in 32%, and hematuria in 59%."
    explanation: Quantifies haematuria in the largest Dent disease 2 cohort.

- name: Growth delay
  category: Growth
  subtype: DD2
  frequency: FREQUENT
  description: >
    Short stature is much commoner in Dent disease 2 (60-80%) than in Dent
    disease 1 (10-20%), and is one of the mild extrarenal signs that
    distinguishes the OCRL-related form.
  phenotype_term:
    preferred_term: Growth delay
    term:
      id: HP:0001510
      label: Growth delay
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Growth retardation | 10–20 | 60–80"
    explanation: Guideline frequency table shows the marked excess of growth retardation in Dent disease 2.

- name: Elevated circulating creatine kinase concentration
  category: Laboratory
  subtype: DD2
  frequency: VERY_FREQUENT
  description: >
    Raised CPK, and often AST and LDH, is the single most discriminating
    extrarenal marker of Dent disease 2, reported in 80-90% of patients against
    5-20% in Dent disease 1. Muscle findings are the commonest extrarenal
    feature in the largest DD2 series.
  phenotype_term:
    preferred_term: Elevated circulating creatine kinase concentration
    term:
      id: HP:0003236
      label: Elevated circulating creatine kinase concentration
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Elevated serum levels of CPK, ASAT and/or LDH | 5–20 | 80–90"
    explanation: Guideline frequency table gives the strong subtype discrimination for raised muscle enzymes.
  - reference: PMID:34680992
    reference_title: "Genotype Phenotype Correlation in Dent Disease 2 and Review of the Literature: OCRL Gene Pleiotropism or Extreme Phenotypic Variability of Lowe Syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle findings are the most common ES (52%), while ocular findings are less common (11%)."
    explanation: Largest Dent disease 2 cohort confirms muscle involvement as the dominant extrarenal finding.

- name: Intellectual disability
  category: Neurologic
  subtype: DD2
  frequency: OCCASIONAL
  description: >
    Mild intellectual impairment occurs in a quarter to a third of Dent disease
    2 patients and is uncommon in Dent disease 1. It is mild and does not
    progress towards the Lowe syndrome picture over time.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
    severity: MILD
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Intellectual impairment | 0–9 | 25–30"
    explanation: Guideline frequency table separates intellectual impairment between the two genetic subtypes.
  - reference: PMID:20946626
    reference_title: "Dent's disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Moreover, the patients with Dent disease 2 and mild intellectual deficit were adults, who had not, over time, developed more overt features of Lowe's syndrome"
    explanation: Establishes that the intellectual phenotype stays mild and does not evolve into Lowe syndrome, which underpins the lump/split decision.

- name: Cataract
  category: Ophthalmologic
  subtype: DD2
  frequency: OCCASIONAL
  description: >
    Punctate, non-dense lens opacities occur in a small minority of Dent
    disease 2 patients. This contrasts sharply with Lowe syndrome, where dense
    bilateral congenital cataract is obligate, and is the clearest single
    clinical discriminator between the two OCRL phenotypes.
  phenotype_term:
    preferred_term: Cataract
    term:
      id: HP:0000518
      label: Cataract
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Congenital cataract | Very rare | 7–10"
    explanation: Guideline frequency table shows cataract is rare in Dent disease 1 and uncommon even in Dent disease 2.
  - reference: PMID:20946626
    reference_title: "Dent's disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "although it is important to note that none of these had the severe cataracts or intellectual deficit that is typically found in patients with Lowe syndrome"
    explanation: Contrasts the ocular phenotype with Lowe syndrome, supporting the separation of the two entries.
treatments:
- name: Potassium Citrate
  description: >
    Alkalinising citrate is the treatment the 2025 ERA/ESPN recommendations
    place first for stone and nephrocalcinosis risk, on a weak recommendation
    grade because no human trial in Dent disease exists. The case rests on a
    high-citrate diet slowing CKD in Clcn5 knockout mice, on citrate's proven
    benefit in idiopathic hypercalciuria with hypocitraturia, and on citrate
    excretion in Dent disease being lower than in other Fanconi syndromes.
    Urinary pH needs monitoring, since over-alkalinisation risks calcium
    phosphate precipitation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: potassium citrate
      term:
        id: NCIT:C29372
        label: Potassium Citrate
  target_mechanisms:
  - target: Urinary Calcium Supersaturation
    treatment_effect: INHIBITS
    description: >-
      Citrate chelates urinary calcium and raises urinary pH, lowering the
      relative supersaturation that drives calcium crystal nucleation.
    evidence:
    - reference: PMID:39794284
      reference_title: "Dent disease: clinical practice recommendations."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Potassium citrate reduces recurrent calcium oxalate nephrolithiasis in patients with idiopathic hypercalciuria and hypocitraturia"
      explanation: The mechanistic rationale is imported from idiopathic hypercalciuria, where the supersaturation effect is established.
  - target: Tubulointerstitial Fibrosis and Progressive Nephron Loss
    treatment_effect: INHIBITS
    description: >-
      In the knockout mouse a high-citrate diet preserved GFR and reduced
      tubular atrophy, interstitial fibrosis and nephrocalcinosis. No human
      equivalent has been done.
    evidence:
    - reference: PMID:16014041
      reference_title: "High citrate diet delays progression of renal insufficiency in the ClC-5 knockout mouse model of Dent's disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "ClC-5 knockout mice fed a zero citrate diet had significantly increased tubular atrophy, interstitial fibrosis, cystic changes, and nephrocalcinosis compared to ClC-5 knockout mice fed a high citrate diet."
      explanation: Directly measures the fibrosis endpoint this link claims, in the disease's own animal model.
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We suggest that citrate treatment may be considered in patients with DD, in particular in the presence of nephrocalcinosis/stone disease (Grade C, weak)."
    explanation: The guideline recommendation itself, with its grade, which is the weakest form of endorsement it issues.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: NO_EVIDENCE
    evidence_source: OTHER
    snippet: "There have been no human trials studying the efficacy of citrate supplementation in DD."
    explanation: Records that no human efficacy data exist for this treatment in this disease, which is why the grade is weak.
  - reference: PMID:16014041
    reference_title: "High citrate diet delays progression of renal insufficiency in the ClC-5 knockout mouse model of Dent's disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "High citrate diet preserved renal function and delayed progression of renal disease in ClC-5 knockout mice even in the apparent absence of stone formation."
    explanation: The principal preclinical result behind the recommendation, and the source of its rationale.
  notes: >-
    Reported use is 13-25% of Dent disease patients. As citrate is metabolised
    to bicarbonate it also helps correct metabolic acidosis, but it may
    aggravate alkalosis in patients with significant hyperaldosteronism.

- name: Thiazide Diuretics
  description: >
    Thiazides reliably lower urinary calcium in Dent disease - chlorthalidone
    normalised calcium excretion in seven of eight patients in a randomised
    crossover study, and hydrochlorothiazide cut spot urinary calcium by 42% in
    an open-label trial - yet the 2025 guideline recommends against systematic
    use. The reason is the toxicity, not a failure of effect: hypovolaemia,
    hypokalaemia and hyponatraemia appeared in the same trials, no long-term
    kidney or stone outcome data exist in this disease, and Dent disease 2
    patients are especially prone to dehydration and acute kidney injury on
    thiazides.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: thiazide diuretic
      term:
        id: NCIT:C49185
        label: Thiazide Diuretic
    - preferred_term: hydrochlorothiazide
      term:
        id: CHEBI:5778
        label: hydrochlorothiazide
    - preferred_term: chlorthalidone
      term:
        id: CHEBI:3654
        label: chlorthalidone
  target_mechanisms:
  - target: Urinary Calcium Supersaturation
    treatment_effect: INHIBITS
    description: >-
      Thiazides act at the distal convoluted tubule, which is unaffected by the
      ClC-5 lesion, so the hypocalciuric response is intact in Dent disease.
    evidence:
    - reference: PMID:12444212
      reference_title: "Responsiveness of hypercalciuria to thiazide in Dent's disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The intact hypocalciuric response to a thiazide diuretic indicates that inactivation of the ClC-5 chloride channel does not impair calcium transport in the distal convoluted tubule and indicates that thiazides should be useful in reducing the risk of kidney stone recurrence in patients with Dent's disease."
      explanation: Establishes both that the drug target is intact in this disease and that supersaturation falls in response.
  evidence:
  - reference: PMID:12444212
    reference_title: "Responsiveness of hypercalciuria to thiazide in Dent's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With chlorthalidone, calcium excretion fell to normal (<4.0 mg/kg per d) in all but one patient in each group."
    explanation: Randomised crossover data quantifying the hypocalciuric effect in genetically confirmed Dent disease.
  - reference: PMID:18976849
    reference_title: "Effect of hydrochlorothiazide on urinary calcium excretion in dent disease: an uncontrolled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The greatest HCTZ doses decreased spot urinary calcium excretion by 42% compared with baseline"
    explanation: Independent open-label trial confirming a dose-dependent fall in urinary calcium.
  - reference: PMID:18976849
    reference_title: "Effect of hydrochlorothiazide on urinary calcium excretion in dent disease: an uncontrolled trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "However, patients developed adverse reactions, including muscle cramps (n = 2), biological (n = 7) or symptomatic hypovolemia (n = 1), hypokalemia (n = 4), and hyponatremia (n = 1), which all corrected after treatment withdrawal."
    explanation: Refutes routine use by documenting that every patient in the trial developed a volume or electrolyte adverse effect.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "We recommend that thiazide treatment should not be used systematically in DD."
    explanation: The current guideline position against routine use, despite the demonstrated biochemical effect.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "DD2 patients are even more susceptible to severe dehydration and acute kidney injury when treated with thiazides"
    explanation: Records a subtype-specific harm that sharpens the recommendation against thiazides in Dent disease 2.

- name: Phosphate Supplementation for Rickets and Osteomalacia
  description: >
    Oral phosphate salts, titrated on serum alkaline phosphatase and on
    radiographic improvement, for patients with hypophosphataemia and signs of
    rickets or osteomalacia. Crucially, active vitamin D must not be added in
    the way it would be for X-linked hypophosphataemic rickets, because
    1,25(OH)2 vitamin D is already inherently elevated in Dent disease and
    raising it further worsens the hypercalciuria.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phosphate
      term:
        id: CHEBI:26020
        label: phosphate
  target_mechanisms:
  - target: Hypophosphatemia
    treatment_effect: RESTORES
    description: >-
      Replaces the phosphate lost through the proximal tubule, correcting the
      substrate deficit that drives bone demineralization.
    evidence:
    - reference: PMID:39794284
      reference_title: "Dent disease: clinical practice recommendations."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "As hypophosphataemia in DD is usually mild or moderate, it can be corrected with increased dietary phosphate and/or oral supplementation."
      explanation: States that supplementation corrects the deficit this link targets.
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We suggest treating patients with DD using phosphate salts in case of hypophosphatemia and signs of rickets of osteomalacia (Grade X, weak)."
    explanation: The guideline recommendation for this treatment, with its grade.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "In contrast to hypophosphataemic rickets, active vitamin D should not be given because of inherently elevated 1.25(OH)2 vitamin D and potential worsening of hypercalciuria."
    explanation: Refutes the transfer of the standard hypophosphataemic-rickets regimen into this disease, which is the key prescribing trap.

- name: Vitamin A Supplementation
  description: >
    Retinol-binding protein is one of the low-molecular-weight proteins lost in
    the urine, so vitamin A deficiency is a foreseeable consequence of the
    endocytic defect. The guideline asks for vigilance for ocular symptoms,
    retinol measurement if they appear, and supplementation if low.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vitamin A
      term:
        id: CHEBI:12777
        label: vitamin A
  target_mechanisms:
  - target: Failure of Proximal Tubular Protein Reabsorption
    treatment_effect: BYPASSES
    description: >-
      Supplementation does not repair the endocytic defect; it replaces the
      vitamin whose carrier protein is being lost through it.
    evidence:
    - reference: PMID:39794284
      reference_title: "Dent disease: clinical practice recommendations."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Retinol-binding protein is lost as part of low-molecular-weight proteinuria."
      explanation: Names the mechanism by which the vitamin is depleted, which is what the supplement works around.
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We recommend vigilance for ocular symptoms of vitamin A deficiency, which should prompt measurement of retinol levels and supplementation if low (Grade B, moderate)."
    explanation: The guideline recommendation covering this treatment.

- name: Growth Hormone for Short Stature
  description: >
    Reserved for growth failure that persists despite adequate metabolic
    control, or for CKD stage 3 or higher. It is a weak recommendation on
    low-grade evidence, and it matters mainly in Dent disease 2, where growth
    retardation affects 60-80% of patients.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: somatropin
      term:
        id: NCIT:C837
        label: Somatropin
  target_mechanisms:
  - target: Growth delay
    treatment_effect: MODULATES
    description: >-
      Symptomatic treatment of the growth phenotype, not of any upstream
      mechanism node.
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We suggest that treatment with growth hormone (GH) for short stature in patients with DD should only be considered if growth failure persists despite adequate metabolic control or in CKD 3 or higher (Grade D, weak)."
    explanation: The guideline recommendation and its restriction to second-line use.

- name: Kidney Transplantation
  description: >
    Definitive treatment for kidney failure. Because the lesion is in the
    kidney, a transplanted organ is not affected and the disease does not
    recur. Living related donation needs care given that maternal relatives may
    be carriers, and the guideline advises prioritising unrelated donation when
    donor risk cannot be assessed.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: kidney transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Chronic kidney disease
    treatment_effect: RESTORES
    description: >-
      Replaces the failed organ; since the genetic defect is not expressed in
      the graft, the tubulopathy does not return.
    evidence:
    - reference: PMID:39794284
      reference_title: "Dent disease: clinical practice recommendations."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The disease does not recur after kidney transplantation."
      explanation: Establishes that transplantation is curative for the renal disease rather than merely supportive.
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "When risk is difficult to assess, priority should be given to unrelated kidney transplantation"
    explanation: Records the donor-selection caution that follows from X-linked carrier status in the maternal line.

- name: Renin-Angiotensin Blockade
  description: >
    ACE inhibitors and ARBs are used in 11-42% of patients, on the reasoning
    that nephrotic-range proteinuria, glomerulosclerosis, podocyte effacement
    and podocyte expression of CLCN5 and OCRL make this a glomerular disease
    amenable to antiproteinuric therapy. The guideline recommends against
    routine use. Published case series show no fall in proteinuria, which is
    unsurprising given that the proteinuria is tubular rather than glomerular
    in origin, and the hypovolaemia risk is raised in a salt-losing
    tubulopathy. This treatment is curated because it is widely used, not
    because it is endorsed.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
    - preferred_term: angiotensin receptor blocker
      term:
        id: NCIT:C66930
        label: Angiotensin II Receptor Antagonist
  target_mechanisms:
  - target: Failure of Proximal Tubular Protein Reabsorption
    treatment_effect: MODULATES
    description: >-
      The intended antiproteinuric target is glomerular, but the proteinuria of
      Dent disease arises at this tubular node, which is the mechanistic reason
      the drugs fail here.
    evidence:
    - reference: PMID:39794284
      reference_title: "Dent disease: clinical practice recommendations."
      supports: REFUTE
      evidence_source: OTHER
      snippet: "which is not unexpected considering the tubular (rather than glomerular) origin of proteinuria in DD"
      explanation: Refutes the antiproteinuric rationale on exactly the mechanistic grounds this pathograph encodes.
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "We suggest that ACE inhibitors (ACEis) or angiotensin receptor blockers (ARBs) should not be used routinely as nephroprotective treatment in patients with DD (Grade C, moderate)."
    explanation: The guideline recommendation against routine renin-angiotensin blockade in this disease.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: NO_EVIDENCE
    evidence_source: OTHER
    snippet: "However, no studies have addressed the effects of ACEis/ARBs on CKD progression in patients with DD or in animal models."
    explanation: Records the complete absence of outcome data for this widely used treatment.

- name: Genetic Testing and Counselling
  description: >
    Genetic testing of both CLCN5 and OCRL is a strong recommendation for any
    male with isolated persistent low-molecular-weight proteinuria or with
    mixed nephrotic-range proteinuria, because it both confirms the diagnosis
    and separates the two subtypes, which differ in extrarenal surveillance and
    in thiazide tolerance. Testing extends to the mother to establish carrier
    versus de novo status.
  action_category: DIAGNOSTIC
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We recommend genetic testing to confirm a diagnosis of DD in males and include both CLCN5 and OCRL genes to differentiate between DD1 and DD2 (Grade B, strong)."
    explanation: The strong guideline recommendation for dual-gene testing and the reason for it.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We recommend performing genetic testing in relatives of males with DD as follows: Mothers in order to determine whether the mother is a heterozygous carrier or if the variant is de novo (Grade X, strong)."
    explanation: Extends testing to the maternal line, which is what determines recurrence risk in an X-linked disorder.
progression:
- phase: Biochemical onset
  age_range: Childhood, often before 10 years
  notes: >
    Low-molecular-weight proteinuria is present throughout the course and is
    usually the first abnormality, frequently found incidentally on screening
    or during work-up of proteinuria in a boy. Hypercalciuria is detected in
    most children and young adults but in only a minority of adults.
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While proteinuria is present during the entire course of the disease, hypercalciuria is detected in 61%–73% of children and young adults compared with 14%–19% of adults"
    explanation: Establishes proteinuria as the constant finding and hypercalciuria as the age-dependent one.
- phase: Mineral and skeletal complications
  age_range: Childhood to early adulthood
  notes: >
    Nephrocalcinosis appears first and is often detectable on childhood
    ultrasound; discrete kidney stones manifest later. Rickets, urolithiasis,
    or an incidentally discovered reduction in kidney function may all be the
    presenting problem.
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nephrocalcinosis is often detectable from childhood while kidney stones manifest at a later age"
    explanation: Gives the temporal ordering of the two mineral complications.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Other subjects may present with rickets or urolithiasis with or without nephrocalcinosis, or simply with previously undiagnosed CKD"
    explanation: Records the alternative presentations at this stage of the course.
- phase: Progressive chronic kidney disease and kidney failure
  age_range: Third to fifth decade
  notes: >
    Kidney failure occurs in 30-80% of affected males between the third and
    fifth decades, with roughly 40% of patients aged 30-40, a third of those
    aged 40-50, and three of four aged 50-60 in one series already in kidney
    failure. Progression is variable within one family, so the genotype does
    not predict the individual trajectory.
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Four out of ten patients aged 30–40 years, three out of nine aged 40–50 years, and three out of four aged 50–60 years had kidney failure"
    explanation: Provides the age-stratified kidney-failure counts summarised in this phase.
  - reference: PMID:20946626
    reference_title: "Dent's disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Progression to end-stage renal failure occurs between the 3rd and 5th decades of life in 30-80% of affected males."
    explanation: Independent review gives the same timing and proportion.
animal_models:
- name: Clcn5 knockout mouse
  species: Mouse
  genotype: Clcn5 null (clcn5 gene disruption, hemizygous male)
  publication: PMID:11099045
  genes:
  - preferred_term: CLCN5
    term:
      id: hgnc:2023
      label: CLCN5
  description: >
    The founding mouse model. Disrupting clcn5 reproduces the proteinuria of
    Dent disease and localises its cause to failed apical proximal tubular
    endocytosis. It also produced the vitamin D / PTH account of hypercalciuria
    that the human literature still uses.
  modeled_mechanisms:
  - target: Megalin and Cubilin Trafficking Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Reproduces the endocytic failure of the proximal tubule, both
      receptor-mediated and fluid-phase, with slowed internalization of apical
      transporters.
    limitations: >-
      A complete null, whereas most human disease-causing CLCN5 alleles are
      missense or truncating variants with residual protein handling
      consequences that a null cannot represent.
    readouts:
    - name: Apical proximal tubular endocytosis
      target: Megalin and Cubilin Trafficking Failure
      direction: DECREASED
      interpretation: Direct functional readout of the node in this model.
      evidence:
      - reference: PMID:11099045
        reference_title: "ClC-5 Cl- -channel disruption impairs endocytosis in a mouse model for Dent's disease."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Here we show that disruption of the mouse clcn5 gene causes proteinuria by strongly reducing apical proximal tubular endocytosis."
        explanation: Reports the measurement and its direction.
    evidence:
    - reference: PMID:11099045
      reference_title: "ClC-5 Cl- -channel disruption impairs endocytosis in a mouse model for Dent's disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Both receptor-mediated and fluid-phase endocytosis are affected, and the internalization of the apical transporters NaPi-2 and NHE3 is slowed."
      explanation: Supports treating this model as informative for the trafficking node.
  - target: Urinary Loss of Vitamin D-Binding Protein and Parathyroid Hormone
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The model is the origin of the two-opposing-effects account of
      hypercalciuria in this disease.
    limitations: >-
      The authors present the net effect on hypercalciuria as probable rather
      than demonstrated, and the balance has not been measured directly in
      patients.
    evidence:
    - reference: PMID:11099045
      reference_title: "ClC-5 Cl- -channel disruption impairs endocytosis in a mouse model for Dent's disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This may be caused by an increased stimulation of luminal parathyroid hormone (PTH) receptors owing to the observed decreased tubular endocytosis of PTH."
      explanation: Reports the PTH handling defect that this node describes.
- name: Clcn5 knock-in missense mouse
  species: Mouse
  genotype: Clcn5 knock-in carrying a representative Dent disease 1 missense variant
  publication: PMID:39019097
  genes:
  - preferred_term: CLCN5
    term:
      id: hgnc:2023
      label: CLCN5
  description: >
    A knock-in model carrying the most representative class of ClC-5 missense
    variant found in patients, rather than a null. It reproduces the Dent
    disease 1 phenotype with disturbed endolysosomal and autophagic function,
    and with age develops fibrosis and apoptosis, so it addresses the
    progression step that the knockout leaves unexplained.
  modeled_mechanisms:
  - target: Tubulointerstitial Fibrosis and Progressive Nephron Loss
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      With ageing the model accumulates renal fibrosis and apoptosis alongside
      metabolic change, which is the transition from tubulopathy to CKD.
    limitations: >-
      Progression in the mouse is compressed relative to the decades-long human
      course, and the proposed Lipocalin-2/24p3R crosstalk has not been shown in
      patients.
    readouts:
    - name: Renal fibrosis and apoptosis with ageing
      target: Tubulointerstitial Fibrosis and Progressive Nephron Loss
      direction: INCREASED
      interpretation: Histological correlate of the progression node in this model.
      evidence:
      - reference: PMID:39019097
        reference_title: "A novel transgenic mouse model highlights molecular disruptions involved in the pathogenesis of Dent disease 1."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "With ageing, KI mice showed increased renal fibrosis, apoptosis and major changes in cell metabolic functions as already suggested in previous DD models."
        explanation: Reports the measurement and its direction.
    evidence:
    - reference: PMID:39019097
      reference_title: "A novel transgenic mouse model highlights molecular disruptions involved in the pathogenesis of Dent disease 1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These mice showed a characteristic DD type 1 phenotype accompanied by altered endo-lysosomal system and autophagy functions."
      explanation: Supports treating this model as informative for the disease's progressive renal pathology.
- name: Drosophila nephrocyte ClC-c depletion model
  species: Fruit fly
  genotype: Nephrocyte-specific depletion of ClC-c, the Drosophila ortholog of CLCN5
  publication: PMID:41690574
  description: >
    Drosophila nephrocytes share properties with both podocytes and proximal
    tubule cells. Depleting the CLCN5 ortholog reproduces loss of Cubilin from
    the plasma membrane and reduced protein uptake, and revealed a
    secretory-pathway mechanism - Cubilin retained in the endoplasmic reticulum
    with Amnionless reduced - subsequently confirmed in ClC-5 knockout mice.
  modeled_mechanisms:
  - target: Megalin and Cubilin Trafficking Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces receptor loss from the cell surface and identifies an earlier
      endoplasmic-reticulum export step in the mechanism.
    limitations: >-
      A fly nephrocyte is not a mammalian proximal tubule cell and the fly has
      no megalin ortholog in the mammalian sense, so only the Cubilin/Amnionless
      arm of the receptor complex is modelled. The mammalian confirmation is in
      mice rather than patients.
    readouts:
    - name: Cubilin at the nephrocyte plasma membrane
      target: Megalin and Cubilin Trafficking Failure
      direction: DECREASED
      interpretation: Loss of the receptor from the surface is the defining lesion of this node.
      evidence:
      - reference: PMID:41690574
        reference_title: "A Drosophila model for Dent's disease type 1 revealed impaired endoplasmic reticulum export of Cubilin as pathogenic mechanism."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Upon depletion of ClC-c, the fly ortholog of CLCN5, Cubilin was lost from the plasma membrane of nephrocytes, leading to a strong decrease in albumin uptake and ectopic slit diaphragms."
        explanation: Reports the measurement and its direction.
    evidence:
    - reference: PMID:41690574
      reference_title: "A Drosophila model for Dent's disease type 1 revealed impaired endoplasmic reticulum export of Cubilin as pathogenic mechanism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our findings suggest that in addition to its endosomal role ClC-c/ClC-5 acts in the secretory pathway to promote surface trafficking of the Cubilin/Amnionless complex."
      explanation: States the mechanistic conclusion this model contributes to the node.
- name: OCRL-deficient zebrafish
  species: Zebrafish
  genotype: ocrl morphant and mutant lines
  publication: PMID:40778266
  genes:
  - preferred_term: OCRL
    term:
      id: hgnc:8108
      label: OCRL
  description: >
    Zebrafish ocrl models cover both Lowe syndrome and Dent disease 2. They
    show defective pronephric endocytosis, abnormal lysosomal function and
    tubule shortening, which accounts for the low-molecular-weight proteinuria
    of both conditions, and they are tractable enough that chemical and genetic
    rescue makes a phenotypic drug screen realistic.
  modeled_mechanisms:
  - target: Endosomal PI(4,5)P2 Accumulation and Actin Dysregulation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The renal tubular arm of the model reproduces the endocytic and lysosomal
      consequences of OCRL loss.
    limitations: >-
      The fish models do not separate Dent disease 2 from Lowe syndrome, since
      both are produced by the same ocrl loss; the human distinction rests on
      variant position and residual isoform expression, which these lines do not
      reproduce. Whether the neurodevelopmental defects lie downstream of
      trafficking or of ciliary dysfunction is unresolved in the model itself.
    evidence:
    - reference: PMID:40778266
      reference_title: "Modelling Lowe syndrome and Dent-2 disease using zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "OCRL-deficient zebrafish also have a renal tubular phenotype, with defective endocytosis, abnormal lysosomal function, and shortening of the renal tubule."
      explanation: Supports treating the fish as informative for the endosomal trafficking node.
  evidence:
  - reference: PMID:40778266
    reference_title: "Modelling Lowe syndrome and Dent-2 disease using zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These defects can account for the low molecular weight proteinuria seen in Lowe syndrome and Dent-2 disease and may explain the other renal features seen in both conditions."
    explanation: Connects the model's cellular defects to the defining human phenotype.
  notes: >-
    Ocrl knockout mice are a notable negative: they do not reproduce the human
    disease, which is attributed to compensation by the paralog Inpp5b. That is
    part of why non-mammalian models carry disproportionate weight for Dent
    disease 2.
definitions:
- name: Clinical diagnostic criteria for Dent disease
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >
    The long-standing three-part clinical definition, set out in the 2010
    Orphanet review and still the reference frame in the 2025 recommendations.
    All three parts are required. Note that the 2025 guideline goes further and
    states that hypercalciuria is not mandatory, so the criteria are best read
    as a high-specificity case definition rather than an exclusion rule;
    genetic testing is what confirms or excludes the diagnosis.
  inclusion_criteria:
  - preferred_term: Low-molecular-weight proteinuria at least 5-fold above the upper limit of normal
  - preferred_term: Hypercalciuria above 4 mg/kg per 24 hours, or a spot calcium/creatinine ratio above 0.25 mg/mg
  - preferred_term: At least one of nephrocalcinosis, kidney stones, hematuria, hypophosphataemia, or renal insufficiency
  evidence:
  - reference: PMID:20946626
    reference_title: "Dent's disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The clinical diagnosis of Dent's disease is based on the presence of all three of the following criteria: (i) LMW proteinuria (elevation of urinary excretion of β2-microglobulin, Clara cell protein and/or RBP by at least 5-fold above the upper limit of normality); (ii) hypercalciuria (> 4 mg/kg in a 24 h-hour collection or > 0.25 mg Ca2+ per mg creatinine on a spot sample); and (iii) at least one of the following: nephrocalcinosis, kidney stones, hematuria, hypophosphataemia, or renal insufficiency."
    explanation: The criteria set quoted verbatim, including the quantitative thresholds recorded above.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "Although hypercalciuria is the second most frequent finding in DD, its absence does not exclude a diagnosis of DD."
    explanation: Refutes treating the hypercalciuria criterion as mandatory, which is why the description qualifies the criteria set.
- name: Case-finding trigger for genetic testing
  definition_type: CASE_DEFINITION
  derivation_basis: ESTABLISHED_CRITERIA
  description: >
    The 2025 guideline's operational trigger for sending CLCN5 and OCRL
    sequencing. It is deliberately broader than the diagnostic criteria, because
    the commonest way to miss the diagnosis is to read nephrotic-range tubular
    proteinuria as glomerular disease and biopsy the patient instead.
  inclusion_criteria:
  - preferred_term: Male with isolated and persistent low-molecular-weight proteinuria
  - preferred_term: Male with mixed proteinuria in the nephrotic range
  - preferred_term: >-
      Male of any age with persistent low-molecular-weight proteinuria plus any
      feature of proximal tubular dysfunction, nephrolithiasis, nephrocalcinosis,
      rickets, or CKD
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We recommend genetic testing of the CLCN5 and OCRL genes to confirm the clinical diagnosis of DD1 or DD2 in the following situations (Grade B, strong): Males with isolated and persistent low-molecular-weight proteinuria, or mixed proteinuria in the nephrotic range."
    explanation: The guideline's testing trigger, quoted with its grade.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Low-molecular-weight proteinuria should be excluded before performing a kidney biopsy in patients with nephrotic-range proteinuria and normal serum albumin."
    explanation: States the diagnostic sequencing point that motivates this case definition.
differential_diagnoses:
- name: Lowe syndrome
  disease_term:
    preferred_term: Lowe syndrome
    term:
      id: MONDO:0010645
      label: oculocerebrorenal syndrome
  description: >
    The other OCRL disease, and the closest differential for Dent disease 2
    specifically. It is curated as its own dismech entry. The two sit on one
    allelic spectrum but are clinically distinct.
  distinguishing_features:
  - Dense bilateral congenital cataract, glaucoma, generalised hypotonia, and intellectual disability are obligate or typical in Lowe syndrome and absent or mild in Dent disease 2.
  - Truncating OCRL variants in exons 8-24 give Lowe syndrome; those in exons 1-7 give Dent disease 2.
  - CKD progresses faster in Lowe syndrome than in Dent disease 2.
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Lowe syndrome ( OCRL ) | Congenital cataracts, glaucoma, general hypotonia, mental retardation, CKD"
    explanation: The guideline's own differential-diagnosis table row naming the discriminating features.
  - reference: PMID:27708066
    reference_title: "Long-term renal outcome in children with OCRL mutations: retrospective analysis of a large international cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Survival analysis showed that LS was also associated with a faster CKD progression than DD2 (P < 0.01)."
    explanation: Quantifies the renal-outcome difference between the two OCRL phenotypes.
- name: Nephropathic cystinosis
  disease_term:
    preferred_term: cystinosis
    term:
      id: MONDO:0016239
      label: cystinosis
  description: >
    The commonest inherited cause of a full renal Fanconi syndrome in
    childhood, and a routine exclusion before or alongside Dent disease testing.
  distinguishing_features:
  - Corneal cystine crystals and multisystem storage disease, absent in Dent disease.
  - A complete Fanconi syndrome rather than the incomplete, protein-reabsorption-dominant picture of Dent disease.
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nephropathic cystinosis ( CTNS ) | Poor growth, rickets, corneal cystine crystals, CKD"
    explanation: The guideline's differential table row giving the discriminating features of cystinosis.
- name: Idiopathic focal segmental glomerulosclerosis
  description: >
    Not a competing genetic diagnosis so much as the label Dent disease is
    wrongly given. Because the tubular protein load can be nephrotic-range and
    biopsy shows glomerulosclerosis with foot-process effacement, patients are
    treated as steroid-resistant nephrotic syndrome; 13% of one biopsy series
    had a repeat biopsy for steroid-resistant proteinuria.
  distinguishing_features:
  - Serum albumin is normal and there is no oedema, despite nephrotic-range total protein.
  - Urinary protein is low-molecular-weight in origin, demonstrable by retinol-binding protein, beta-2-microglobulin, or an alpha-1-microglobulin/creatinine ratio above 120 mg/g.
  evidence:
  - reference: PMID:27697782
    reference_title: "Glomerular Pathology in Dent Disease and Its Association with Kidney Function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A repeat biopsy for steroid-resistant proteinuria was performed in 13% (four of 30) of the patients."
    explanation: Documents that Dent disease patients are in practice managed as steroid-resistant nephrotic syndrome before the diagnosis is made.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Affected individuals may present nephrotic-range proteinuria which may be misinterpreted and cause diagnostic delay."
    explanation: States the misdiagnosis explicitly as a recognised cause of diagnostic delay.
discussions:
- discussion_id: acidification_vs_chloride
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is defective endosomal acidification, or luminal chloride accumulation, the
    step through which ClC-5 loss causes proximal tubular endocytic failure?
  attaches_to:
  - pathophysiology#Defective Endosomal Acidification
  - pathophysiology#Megalin and Cubilin Trafficking Failure
  rationale: >
    The textbook account is that ClC-5 supplies the countercurrent for the
    V-ATPase, so its loss impairs acidification and the ligand-receptor complex
    fails to dissociate. A knock-in mouse converting the exchanger into an
    uncoupled chloride channel breaks that account: its endosomes acidify
    normally, and it still shows the full renal phenotype and impaired proximal
    tubular endocytosis. Either luminal chloride concentration matters in its
    own right, or acidification is one of several parallel requirements. The
    question is not decorative: it determines whether a therapeutic strategy
    aimed at restoring endosomal pH could work at all.
  evidence:
  - reference: PMID:20946626
    reference_title: "Dent's disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, despite normal endosomal acidification, KI mice showed the same renal phenotype than KO mice and patients with Dent's disease, including LMW proteinuria, hyperphosphaturia and hypercalciuria."
    explanation: The experimental result that makes the acidification-only account untenable.
- discussion_id: tubulopathy_to_ckd_transition
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What converts a proximal tubular endocytic defect into progressive chronic
    kidney disease, and why is the trajectory so variable within one family?
  attaches_to:
  - pathophysiology#Tubulointerstitial Fibrosis and Progressive Nephron Loss
  - phenotypes#Chronic kidney disease
  rationale: >
    The guideline states outright that the mechanism of this transition remains
    to be deciphered. Candidate routes are maladaptive proximal tubular
    responses driving inflammation and fibrosis, stress responses in distal
    nephron segments provoked by the tubular protein load, and a genuine
    podocyte component given that CLCN5 and OCRL appear to be expressed in
    podocytes. Because the same variant produces different outcomes within one
    family, whatever governs progression is not the genotype. This is the gap
    that matters most clinically, since kidney failure is what determines
    prognosis and nothing currently available is known to modify it.
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanisms behind the transition from proximal tubular dysfunction to progressive chronic kidney disease (CKD) in DD remain to be deciphered."
    explanation: The gap stated by the guideline itself.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Also, the course of kidney failure may be variable within the same family"
    explanation: Establishes that the missing determinant is not the causal variant.
- discussion_id: unexplained_third_of_patients
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What causes Dent disease in the 25-35% of clinically typical patients with
    no identifiable CLCN5 or OCRL variant?
  attaches_to:
  - genetic#Genetically unexplained Dent disease
  rationale: >
    A quarter to a third of patients meeting the clinical and biochemical
    definition have no variant in either known gene. No third locus has been
    confirmed in the fifteen years since the gap was first described. The
    residual group could reflect an unidentified gene acting on the same
    endocytic apparatus, non-coding or structural variation in CLCN5 or OCRL
    missed by standard sequencing, or phenocopies from a distinct mechanism.
    Until it is resolved, a negative gene panel cannot exclude the diagnosis.
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the remaining 25%–35% of patients having neither identifiable CLCN5 nor OCRL variants"
    explanation: Quantifies the unexplained group in the most recent authoritative source.
  - reference: PMID:20946626
    reference_title: "Dent's disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A few patients with Dent's disease do not harbour mutations in CLCN5 and OCRL1, pointing to the involvement of other genes."
    explanation: Shows the gap was already recognised in 2010 and remains open.
- discussion_id: ocrl_mouse_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Can a mammalian model of Dent disease 2 be built, given that Ocrl knockout
    mice are essentially unaffected because of Inpp5b compensation?
  attaches_to:
  - pathophysiology#OCRL Phosphoinositide 5-Phosphatase Deficiency
  - animal_models#Zebrafish
  rationale: >
    Mouse Ocrl loss does not reproduce the human renal phenotype, which is
    attributed to compensation by the paralog Inpp5b; the double knockout is
    embryonic lethal. The field therefore leans on zebrafish and on patient
    cells for Dent disease 2, and those models do not distinguish Dent disease
    2 from Lowe syndrome, since both arise from ocrl loss and the human
    distinction depends on variant position and residual isoform expression.
    The mismatch is mechanistically meaningful rather than merely inconvenient:
    the human DD2/Lowe boundary is set by how much OCRL activity survives, which
    is exactly the variable a null allele removes.
  evidence:
  - reference: PMID:40778266
    reference_title: "Modelling Lowe syndrome and Dent-2 disease using zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Zebrafish has been used to study OCRL function in vivo and to successfully model these two rare genetic conditions."
    explanation: Documents the reliance on a non-mammalian model for both OCRL phenotypes.
  - reference: PMID:34586410
    reference_title: "Identification of novel OCRL isoforms associated with phenotypic differences between Dent disease-2 and Lowe syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Truncating mutations in OCRL exons 1-7 lead to Dent disease-2, whereas those in exons 8-24 lead to Lowe syndrome."
    explanation: Shows the human distinction rests on residual isoform expression, which a null allele cannot model.
classifications:
  harrisons_chapter:
  - classification_value: KIDNEY_URINARY_TRACT
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
notes: >
  Scope and lump/split. This entry covers the Dent disease group (MONDO:0015612)
  with both genetic forms as has_subtypes, because they share the proximal
  tubular endocytic mechanism and are clinically near-indistinguishable in the
  kidney. Lowe syndrome is deliberately NOT covered here: it is the severe
  multisystem OCRL phenotype and has its own dismech entry (Lowe_Syndrome),
  whose notes record the same split from the other direction. Dent disease 2 is
  modelled as a subtype rather than duplicated into the Lowe entry, which keeps
  the OCRL allelic spectrum represented once on each side of the clinical
  boundary.

  Evidence base. The two load-bearing sources are the 2025 ERA/ESPN clinical
  practice recommendations (PMID:39794284) and the 2010 Orphanet review
  (PMID:20946626), both open-access full text and both cited throughout. Where
  they disagree the newer source is followed and the disagreement recorded
  rather than smoothed over - most visibly on whether hypercalciuria is a
  mandatory diagnostic criterion.

  Frequency data. Phenotype frequencies are quoted from Table 1 of the 2025
  recommendations, which is a synthesis across roughly fourteen cited series
  rather than a single cohort. Subtype-specific ranges are wide because the
  underlying series are small.

  Deep-research provenance. This entry was curated with
  research/Dent_Disease-deep-research-claude_code.md as a lead list. Nine of
  that report's PMIDs resolve to papers on entirely unrelated subjects and were
  rejected: PMID:11115835 (ulcerative colitis), PMID:12815099 (HIV in
  Langerhans cells), PMID:33710298 (Streptomyces rpoB mutations), PMID:14158899
  (halothane anaesthesia), PMID:20950533 (nutrition environment measures),
  PMID:26296266 (waist circumference in immigrants), PMID:26154403
  (nickel-catalysed alkene chemistry), PMID:11279143 (xeroderma pigmentosum
  centrin), and PMID:25911330 (intrapulmonary genomic profiling). The report's
  suggested MONDO identifiers for the two subtypes were also wrong -
  MONDO:0010655 is X-linked intellectual disability with marfanoid habitus and
  MONDO:0010371 is Aland island eye disease. The correct subtype terms,
  MONDO:0010225 and MONDO:0010359, were taken from the MONDO descendants
  recorded on the curation stub and re-verified against MONDO. Every citation
  in this entry was fetched and read before use.

  Not curated here. Kidney cysts are reported in about a third of Dent disease 1
  patients in the guideline's frequency table, but the table cell for Dent
  disease 2 is empty and no prose in the cached sources discusses the finding,
  so no phenotype record was created. Metabolic acidosis (5-15% in DD1, 5-25% in
  DD2) is likewise recorded in that table but is not separately modelled, being
  a component of the incomplete Fanconi picture already captured by the
  proximal tubular solute-wasting node.

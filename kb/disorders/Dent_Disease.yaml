    supports: SUPPORT
    evidence_source: OTHER
    snippet: "a prevalence of between 1 in 400 000 and 1 in 1 000 000 may be estimated"
    explanation: The ERA/ESPN clinical practice recommendations give the registry-derived prevalence range normalised into this record.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Still, the true prevalence of DD is probably higher due to the variable phenotype and insidious disease course."
    explanation: Records the guideline's own caveat that the registry-derived estimate is a lower bound.
- population: Reported families worldwide as of 2010
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    At the time of the 2010 Orphanet review the disorder had been reported in

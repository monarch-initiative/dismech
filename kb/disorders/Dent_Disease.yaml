      snippet: "Since the megalin/cubilin complex mediates the reabsorption of the vitamin D-binding protein, the 25(OH)-vitamin D3 and parathyroid hormone (PTH) that are ultrafiltrated by the glomerulus, the urinary loss of these mediators could potentially lead to opposite effects in PT cells, resulting in variable levels of active 1,25(OH)2-vitamin D3 levels in the serum"
      explanation: Names the specific cargo whose loss links the endocytic defect to calcium handling.

    Estimated at between 1 in 400,000 and 1 in 1,000,000 from the Japanese
    (n=91), French (n=108), and British (n=62) national registries; the true
    prevalence is probably higher because the phenotype is variable and the
    course insidious. Normalised here as 0.1-0.25 per 100,000.
  evidence:

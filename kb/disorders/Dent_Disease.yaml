      reference_title: "Dent disease: clinical practice recommendations."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Prolonged hypophosphataemia may cause bone demineralization manifesting as rickets in children or osteomalacia in adults."
      explanation: Names the intermediate between the tubular phosphate leak and the skeletal phenotype.

- name: Urinary Calcium Supersaturation
  biological_scale: ORGANISM
  conforms_to: "nephrolithiasis_crystal_nucleation#Urinary Supersaturation"
  description: >
    Hypercalciuria raises the relative supersaturation of the urine with
    respect to calcium oxalate and calcium phosphate, which is the
    thermodynamic driving force for stone formation. In Dent disease the
    lithogenic solute is calcium; citrate excretion is lower than in other
    forms of renal Fanconi syndrome, removing some of the usual inhibitory
    capacity. This node is the disease-specific substitution into the
    nephrolithiasis module's supersaturation trigger.
  biological_processes:
  - preferred_term: renal calcium excretion
    term:
      id: GO:0007588
      label: excretion
    modifier: DYSREGULATED
  - preferred_term: calcium ion transport
    term:
      id: GO:0006816
      label: calcium ion transport
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:12444212
    reference_title: "Responsiveness of hypercalciuria to thiazide in Dent's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypercalciuria is the major risk factor promoting stone formation in Dent's disease, also known as X-linked recessive nephrolithiasis, but the effects of diuretics on calcium excretion and other stone risk factors in this disease are unknown."
    explanation: Identifies calcium as the lithogenic solute of this disease, which is the substitution the module expects.
  - reference: PMID:12444212
    reference_title: "Responsiveness of hypercalciuria to thiazide in Dent's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with Dent's disease during chlorthalidone therapy, the supersaturation ratios for calcium oxalate and calcium phosphate fell by 25% and 35%, respectively."
    explanation: Measures calcium oxalate and calcium phosphate supersaturation directly in Dent disease patients, grounding this node in human data.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "citrate excretion in DD is lower compared with other forms of renal Fanconi syndrome"
    explanation: Records the reduced inhibitory capacity that accompanies the raised calcium load in this disease.
  downstream:
  - target: Calcium Crystal Nucleation and Retention
    causal_link_type: DIRECT

- name: Calcium Crystal Nucleation and Retention
  biological_scale: TISSUE
  conforms_to: "nephrolithiasis_crystal_nucleation#Crystal Nucleation and Growth"
  description: >
    Supersaturated urine nucleates calcium crystals which must then be retained
    rather than flushed out for nephrocalcinosis or a stone to form. In Dent
    disease retention appears to carry independent weight, because
    nephrolithiasis and nephrocalcinosis have been reported in patients without
    hypercalciuria, which has been attributed to impaired clearance of
    microcrystals from the collecting duct epithelial surface. Nephrocalcinosis
    is typically detectable from childhood while discrete stones appear later.
  cell_types:
  - preferred_term: renal tubular epithelial cell
    term:
      id: CL:0002518
      label: kidney epithelial cell
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  biological_processes:
  - preferred_term: crystal-epithelial cell adhesion
    term:
      id: GO:0007155
      label: cell adhesion
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "which might be explained by impaired clearance of microcrystals from the surface of collecting duct cells, as demonstrated in vitro"
    explanation: Supports treating crystal retention as a step with its own weight in this disease rather than a passive consequence of supersaturation.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nephrocalcinosis is often detectable from childhood while kidney stones manifest at a later age"
    explanation: Gives the temporal ordering of the two mineral outcomes downstream of this node.
  downstream:
  - target: Nephrocalcinosis
    causal_link_type: DIRECT
  - target: Nephrolithiasis
    causal_link_type: DIRECT

- name: Tubulointerstitial Fibrosis and Progressive Nephron Loss
  biological_scale: TISSUE
  description: >
    How a proximal tubulopathy becomes progressive chronic kidney disease is
    the least resolved part of the mechanism and the guideline says so plainly.
    The proposed route is that early adaptive changes in proximal tubular cells
    - proliferation, dedifferentiation, autophagy, metabolic adaptation -
    become maladaptive, promoting inflammation and tubulointerstitial fibrosis,
    with the tubular protein load itself contributing by stressing distal
    nephron segments. Biopsy series show focal interstitial fibrosis,
    interstitial lymphocytic infiltration and tubular damage alongside the
    glomerular lesions, and a knock-in mouse carrying a representative
    pathogenic Clcn5 missense variant develops fibrosis and apoptosis with age.
  cell_types:
  - preferred_term: kidney proximal convoluted tubule epithelial cell
    term:
      id: CL:1000838
      label: kidney proximal convoluted tubule epithelial cell
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: DYSREGULATED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanisms behind the transition from proximal tubular dysfunction to progressive chronic kidney disease (CKD) in DD remain to be deciphered."
    explanation: Records explicitly that this step of the causal chain is unresolved, which the node description must not overstate.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Early changes in proximal tubular cells, including proliferation, dedifferentiation, autophagy, and metabolic adaptation, may become maladaptive and promote inflammation and progression of tubulointerstitial fibrosis by various mechanisms"
    explanation: States the proposed, explicitly hypothetical route from tubular injury to fibrosis.
  - reference: PMID:27697782
    reference_title: "Glomerular Pathology in Dent Disease and Its Association with Kidney Function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "focal interstitial fibrosis in 60% (18 of 30), interstitial lymphocytic infiltration in 53% (16 of 30), and tubular damage in 70% (21 of 30)"
    explanation: Human biopsy series quantifying the interstitial and tubular lesions this node describes.
  - reference: PMID:39019097
    reference_title: "A novel transgenic mouse model highlights molecular disruptions involved in the pathogenesis of Dent disease 1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "With ageing, KI mice showed increased renal fibrosis, apoptosis and major changes in cell metabolic functions as already suggested in previous DD models."
    explanation: Model-organism evidence that fibrosis accumulates with age downstream of a pathogenic Clcn5 missense variant.
  downstream:
  - target: Chronic kidney disease
    causal_link_type: DIRECT
phenotypes:
- name: Low-molecular-weight proteinuria
  category: Renal
  frequency: OBLIGATE
  diagnostic: true
  description: >
    The defining and obligate finding, present in effectively every affected
    male and in most obligate female carriers. Retinol-binding protein has the
    best reported sensitivity and specificity for the tubular origin;
    beta-2-microglobulin is widely used but degrades in acidic or
    bacterially contaminated urine. An alpha-1-microglobulin/creatinine ratio
    above 120 mg/g separates Dent disease from glomerular disease with high
    accuracy.
  phenotype_term:
    preferred_term: Low-molecular-weight proteinuria
    term:
      id: HP:0003126
      label: Low-molecular-weight proteinuria
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Low-molecular-weight proteinuria | 100 | 100"
    explanation: Guideline frequency table records low-molecular-weight proteinuria in 100% of both Dent disease 1 and Dent disease 2 patients.
  - reference: PMID:20946626
    reference_title: "Dent's disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Low-molecular-weight (LMW) proteinuria represents the most consistent manifestation of Dent's disease, detected in almost all affected males and obligate female carriers."
    explanation: Independent review confirms this is the most consistent finding and extends it to obligate carriers.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "An α1-microglobulin/creatinine ratio above 120 mg/g (13.6 mg/mmol) has high accuracy in separating DD from glomerular disease"
    explanation: Gives the quantitative threshold that makes this phenotype diagnostically decisive.

- name: Hypercalciuria
  category: Renal
  frequency: FREQUENT
  diagnostic: true
  description: >
    The second defining feature, though not mandatory for diagnosis. Its
    detection is strongly age-dependent, found in 61-73% of children and young
    adults but only 14-19% of adults, so a normal adult calcium excretion does
    not exclude the disease.
  phenotype_term:
    preferred_term: Hypercalciuria
    term:
      id: HP:0002150
      label: Hypercalciuria
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hypercalciuria | 44–90 | 80–100"
    explanation: Guideline frequency table gives the reported ranges for Dent disease 1 and Dent disease 2.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While proteinuria is present during the entire course of the disease, hypercalciuria is detected in 61%–73% of children and young adults compared with 14%–19% of adults"
    explanation: Documents the age dependence that makes hypercalciuria an unreliable adult diagnostic criterion.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although hypercalciuria is the second most frequent finding in DD, its absence does not exclude a diagnosis of DD."
    explanation: States that this phenotype, while characteristic, is not obligate.

- name: Nephrocalcinosis
  category: Renal
  frequency: FREQUENT
  description: >
    Diffuse renal calcification, usually detectable on ultrasound from
    childhood and substantially commoner in Dent disease 1 than Dent disease 2.

    explanation: Original knockout mouse demonstrating that the endocytic failure is what produces the proteinuria.
  - reference: PMID:41690574
    reference_title: "A Drosophila model for Dent's disease type 1 revealed impaired endoplasmic reticulum export of Cubilin as pathogenic mechanism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Upon depletion of ClC-c, the fly ortholog of CLCN5, Cubilin was lost from the plasma membrane of nephrocytes, leading to a strong decrease in albumin uptake and ectopic slit diaphragms. Importantly, Cubilin exhibited a strong accumulation in the endoplasmic reticulum, while its binding partner Amnionless was overall reduced."
    explanation: Adds a secretory-pathway component to the trafficking failure and shows the receptor is lost from the plasma membrane.
  - reference: PMID:41690574
    reference_title: "A Drosophila model for Dent's disease type 1 revealed impaired endoplasmic reticulum export of Cubilin as pathogenic mechanism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Amnionless loss and ER retention of cubilin was confirmed in ClC-5 knockout mice, underscoring the relevance of this pathomechanism for Dent's disease."
    explanation: Confirms the invertebrate finding in a mammalian model, which is what makes it worth carrying in this node.
  downstream:

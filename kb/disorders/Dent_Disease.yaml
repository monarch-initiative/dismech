inheritance:
- name: X-linked recessive inheritance
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    Both genetic forms are X-linked. The full phenotype is essentially confined
    to hemizygous males; heterozygous female carriers show attenuated features,
    most often low-molecular-weight proteinuria and, less consistently,
    hypercalciuria. De novo variants are not rare, accounting for roughly 12% of
    Dent disease 1 and up to 30% of Dent disease 2 cases.
  evidence:
  - reference: PMID:20946626
    reference_title: "Dent's disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These features are generally found in males only, and may be present in early childhood, whereas female carriers may show a milder phenotype."
    explanation: States the X-linked sex-limited expression pattern with attenuated carrier phenotype.
  - reference: PMID:20946626
    reference_title: "Dent's disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For example, the milder features of LMW proteinuria and hypercalciuria are found in approximately 70% and 50% of females carriers, respectively, whilst the more severe manifestations of nephrolithiasis have been reported in only 10 females and end-stage renal failure has been reported in only 1 female [8]."
    explanation: Quantifies the attenuated carrier-female phenotype that the X-linked recessive designation predicts.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "De novo variants account for ∼12% of DD1 cases"
    explanation: Records the de novo variant fraction, which bears directly on recurrence counselling in an X-linked disorder.
has_subtypes:
- name: DD1
  display_name: Dent disease 1 (CLCN5-related)
  classification: genetic
  subtype_term:
    preferred_term: Dent disease type 1
    term:
      id: MONDO:0010225
      label: Dent disease type 1
  description: >
    The commonest form, accounting for roughly half to two-thirds of patients.
    Inactivating CLCN5 variants remove or disable the electrogenic 2Cl-/H+
    exchanger ClC-5 from the early endosomes of the proximal tubular subapical
    compartment. The renal phenotype is therefore a pure proximal tubulopathy
    with no obligate extrarenal features, although rickets, osteomalacia, and
    growth retardation occur secondary to the tubular losses.
  genes:
  - preferred_term: CLCN5
    term:
      id: hgnc:2023
      label: CLCN5
  inheritance:
  - name: X-linked recessive inheritance
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "DD1 (MIM #300 009) is caused by inactivating variants in the CLCN5 gene (located on Xp11.22), which encodes the electrogenic 2Cl−/H+ exchanger ClC-5"
    explanation: Defines Dent disease 1 as the CLCN5-related form and names the affected transporter and locus.
  - reference: PMID:20946626
    reference_title: "Dent's disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Thus, there is genetic heterogeneity for Dent's disease, with approximately 50-60% of patients having CLCN5 mutations (Dent disease 1), ~15% harbouring OCRL1 mutations (Dent disease 2) and the remaining 25-35% of patients having neither CLCN5 nor OCRL1 mutations but possibly defects in other genes."
    explanation: Quantifies the share of patients attributable to CLCN5 and so the relative weight of this subtype.
- name: DD2
  display_name: Dent disease 2 (OCRL-related)
  classification: genetic
  subtype_term:
    preferred_term: Dent disease type 2
    term:
      id: MONDO:0010359
      label: Dent disease type 2
  description: >
    Roughly 15% of patients carry OCRL variants instead. The proximal tubular
    phenotype largely overlaps Dent disease 1, but mild extrarenal features may
    be present: raised muscle enzymes, mild developmental delay, short stature,
    and occasionally punctate cataract. The same gene causes Lowe syndrome,
    which dismech curates as a separate, more severe multisystem entry
    (Lowe_Syndrome); DD2 is modelled here as a subtype of Dent disease rather
    than duplicated there, matching the split that entry records. In the largest
    DD2 series 39% of patients had at least one extrarenal sign, with muscle
    findings much commoner than ocular ones, and the authors concluded DD2 is
    clinically distinct from Lowe syndrome rather than simply a mild version of
    it.
  genes:
  - preferred_term: OCRL
    term:
      id: hgnc:8108
      label: OCRL
  inheritance:
  - name: X-linked recessive inheritance
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Extrarenal manifestations of patients with DD2 are very mild compared with full-blown Lowe syndrome and may include punctuated congenital cataract, mild developmental delay, and short stature"
    explanation: Defines the DD2 extrarenal profile and contrasts it with Lowe syndrome, which is the basis for keeping the two entries separate.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The manifestations of proximal tubular dysfunction overlap in patients with DD1 and DD2"
    explanation: Justifies curating DD2 as a subtype of the same disease rather than a separate entry, since the renal mechanism and phenotype are shared.
  - reference: PMID:34680992
    reference_title: "Genotype Phenotype Correlation in Dent Disease 2 and Review of the Literature: OCRL Gene Pleiotropism or Extreme Phenotypic Variability of Lowe Syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The frequency of patients with at least one ES was 39%. Muscle findings are the most common ES (52%), while ocular findings are less common (11%)."
    explanation: Largest DD2 cohort quantifies how often extrarenal signs occur and which organ systems dominate.
  - reference: PMID:34680992
    reference_title: "Genotype Phenotype Correlation in Dent Disease 2 and Review of the Literature: OCRL Gene Pleiotropism or Extreme Phenotypic Variability of Lowe Syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DD2 is distinct from LS. The mutation site and the mutation type largely determine the DD2 phenotype."
    explanation: Directly supports the lump/split decision to keep DD2 inside the Dent disease entry and Lowe syndrome as its own entity.
genetic:
- name: CLCN5
  subtype: DD1
  gene_term:
    preferred_term: CLCN5
    term:
      id: hgnc:2023
      label: CLCN5
  association: Loss-of-function
  presence: Positive
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  frequency: approximately 50-60% of patients with Dent disease
  notes: >
    More than 300 distinct disease-causing CLCN5 variants have been described,
    spanning missense, nonsense, frameshift, splice-site, and large deletion
    classes, with no clear mutational hotspot. Missense variants have been
    sorted experimentally into three cell-biological classes (endoplasmic
    reticulum retention and degradation; normal trafficking with defective
    endosomal acidification; altered endosomal distribution with preserved
    acidification), but this classification has not been shown to predict
    clinical severity. Genotype-phenotype correlation in DD1 remains contested:
    a large series found no difference in age at diagnosis, eGFR, proteinuria,
    or hypercalciuria between severe and missense variants, while two more
    recent series reported associations with pore or CBS-domain variants and
    with truncating variants among patients reaching kidney failure.
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "To date, more than 300 distinct disease-causing variants in the CLCN5 gene have been identified."
    explanation: Establishes the breadth of the CLCN5 allelic spectrum underlying Dent disease 1.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There are no clear mutation hotspots as only a small number of recurrent variants has been reported in different geographic areas"
    explanation: Records that CLCN5 variants are largely private, which bears on diagnostic sequencing strategy.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "Blanchard et al. found no difference in age at diagnosis, estimated glomerular filtration rate (eGFR), proteinuria, or hypercalciuria, indicating that there is no correlation between genotype and phenotype in DD1"
    explanation: Refutes a simple genotype-severity correlation in Dent disease 1, which is why variant class is not used here to stratify prognosis.
  - reference: PMID:19019917
    reference_title: "Characterization of Dent's disease mutations of CLC-5 reveals a correlation between functional and cell biological consequences and protein structure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This revealed three classes of Dent's disease-causing CLC-5 mutations. Class 1 mutations lead to endoplasmic reticulum retention and degradation of CLC-5. Class 2 mutations appear to have little effect on subcellular distribution of CLC-5 but cause defective function resulting in severe defects in endosomal acidification. Class 3 mutations lead to alterations in the endosomal distribution of CLC-5 but are otherwise able to support endosomal acidification."
    explanation: Defines the three experimentally characterised cell-biological consequences of CLCN5 missense variants.
  - reference: PMID:19019917
    reference_title: "Characterization of Dent's disease mutations of CLC-5 reveals a correlation between functional and cell biological consequences and protein structure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations result in functional defects that range from moderate reductions to complete loss of whole cell currents, although the severity of the functional defect rarely correlates with the severity of the disease."
    explanation: Supports treating in-vitro functional severity as uninformative about clinical severity in this disease.
- name: OCRL
  subtype: DD2
  gene_term:
    preferred_term: OCRL
    term:
      id: hgnc:8108
      label: OCRL
  association: Loss-of-function
  presence: Positive
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  frequency: approximately 15% of patients with Dent disease
  notes: >
    OCRL variants cause both Dent disease 2 and the more severe Lowe syndrome.
    The position of a truncating variant largely determines which: variants in
    exons 1-7 give Dent disease 2, while exons 8-24 give Lowe syndrome, a
    difference attributed to an additional translation-initiation codon in exon
    8 that permits expression of a shortened but partly functional OCRL isoform.
    Missense variants associated with DD2 map to the 5-phosphatase domain.
    The correlation is not absolute: both phenotypes have been reported for five
    OCRL variants.
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Regarding the OCRL gene, a genotype–phenotype correlation is hypothesized because nearly all truncating variants associated with DD2 are located in exons 1–7, which encompass the PH domain, while variants associated with Lowe syndrome are located in exons 8–24"
    explanation: Gives the exon-position rule that separates Dent disease 2 from Lowe syndrome within one gene.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "Of note, both a Lowe syndrome and DD2 phenotype have been reported for five OCRL variants, arguing against a clear genotype–phenotype effect"
    explanation: Refutes a strict exon-position rule, so the DD2/Lowe boundary is not fully predictable from genotype.
  - reference: PMID:34586410
    reference_title: "Identification of novel OCRL isoforms associated with phenotypic differences between Dent disease-2 and Lowe syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We successfully cloned the novel isoform transcripts from OCRL exons 6-24, including the translation-initiation codons present in exon 8."
    explanation: >-
      Provides the molecular basis for the exon-position rule, since an internal
      start codon in exon 8 permits partial OCRL expression in Dent disease 2.
- name: Genetically unexplained Dent disease
  presence: Negative
  relationship_type: UNKNOWN
  frequency: approximately 25-35% of clinically typical patients
  notes: >
    A substantial minority of patients meeting the clinical and biochemical
    definition of Dent disease carry no identifiable CLCN5 or OCRL variant. No
    third locus has been confirmed. This block records the gap rather than
    asserting a gene; treat it as the residual class of the genetic
    differential.
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the remaining 25%–35% of patients having neither identifiable CLCN5 nor OCRL variants"
    explanation: Quantifies the genetically unexplained fraction of clinically typical Dent disease.
  - reference: PMID:20946626
    reference_title: "Dent's disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A few patients with Dent's disease do not harbour mutations in CLCN5 and OCRL1, pointing to the involvement of other genes."
    explanation: Independent review confirms an unexplained residue and that no additional locus has been established.
pathophysiology:
- name: ClC-5 Chloride-Proton Exchanger Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  description: >
    In Dent disease 1 an inactivating CLCN5 variant removes or disables ClC-5,
    the electrogenic 2Cl-/H+ exchanger of the early endosomes of the subapical
    compartment of proximal tubular cells. This is the initiating molecular
    lesion; the restriction of the clinical picture to a proximal tubulopathy
    follows from where the protein is normally expressed. Missense variants
    reach this state by several routes - endoplasmic reticulum retention and
    degradation, loss of transport function with normal localisation, or
    mislocalisation within the endosomal system.
  genes:
  - preferred_term: CLCN5
    term:
      id: hgnc:2023
      label: CLCN5
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: 2Cl-/H+ exchange by ClC-5
    term:
      id: GO:0062158
      label: chloride:proton antiporter activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: proximal tubular subapical early endosome
    term:
      id: GO:0005769
      label: early endosome
  cell_types:
  - preferred_term: kidney proximal convoluted tubule epithelial cell
    term:
      id: CL:1000838
      label: kidney proximal convoluted tubule epithelial cell
  locations:
  - preferred_term: renal proximal tubule
    term:
      id: UBERON:0004134
      label: proximal tubule
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The clinical presentation of DD1 as a proximal tubulopathy reflects the predominant expression of ClC-5 in the early endosomes of the subapical compartment of proximal tubular cells"
    explanation: Places the initiating lesion in the proximal tubular subapical endosome and explains why the phenotype is a proximal tubulopathy.
  - reference: PMID:19019917
    reference_title: "Characterization of Dent's disease mutations of CLC-5 reveals a correlation between functional and cell biological consequences and protein structure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "It is generally thought that the principal cause of Dent's disease (31) results from a loss of functional CLC-5 from the subapical endosomes of kidney proximal tubule cells leading to a defect in endosomal acidification and impaired protein reabsorption"
    explanation: States the consensus initiating mechanism and its immediate consequences, which are the downstream nodes here.
  downstream:
  - target: Defective Endosomal Acidification
    causal_link_type: DIRECT
    description: >-
      Loss of the endosomal chloride conductance removes the countercurrent that
      lets the V-ATPase acidify the vesicle lumen.
    evidence:
    - reference: PMID:20946626
      reference_title: "Dent's disease."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Accordingly, the loss of the endosomal Cl- conductance mediated by ClC-5 would impair vesicular acidification, causing dysfunction of PT cells."
      explanation: Asserts the direct link from ClC-5 loss to failure of endosomal acidification.
  - target: Megalin and Cubilin Trafficking Failure
    causal_link_type: DIRECT
    description: >-
      Independently of, and in addition to, the acidification defect, ClC-5 loss
      produces a severe trafficking defect that strips megalin and cubilin from
      the brush border. A Drosophila nephrocyte model plus confirmation in
      Clcn5 knockout mice adds a secretory-pathway component, with Cubilin
      retained in the endoplasmic reticulum and its partner Amnionless reduced.
    evidence:
    - reference: PMID:39794284
      reference_title: "Dent disease: clinical practice recommendations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Studies in Clcn5 knock-out and knock-in (KI) mice have demonstrated that inactivation of ClC-5 is associated with a severe trafficking defect in proximal tubular cells, with loss or reduced levels of megalin and cubilin at the brush border, impaired endocytosis and lysosomal processing of endocytosed ligands, and defective internalization of various apical transporters"
      explanation: Model-organism evidence that ClC-5 loss causes the megalin/cubilin trafficking failure directly.

- name: Defective Endosomal Acidification
  biological_scale: MOLECULAR
  description: >
    Progression along the endocytic pathway requires the V-ATPase to acidify
    each vesicle to about pH 5.0, which is what dissociates ligand from
    receptor and permits receptor recycling. That proton pumping needs a
    parallel chloride conductance for electroneutrality, and ClC-5 supplies it.
    Losing ClC-5 leaves positive charge accumulating in the lumen and
    acidification impaired. This node is necessary but not sufficient for the
    disease phenotype: a knock-in mouse converting the exchanger into an
    uncoupled chloride channel acidifies its endosomes normally and still
    reproduces the full renal phenotype, so luminal chloride accumulation rather
    than pH alone appears to carry part of the mechanism.
  cellular_components:
  - preferred_term: proximal tubular subapical early endosome
    term:
      id: GO:0005769
      label: early endosome
  biological_processes:
  - preferred_term: endosomal lumen acidification
    term:
      id: GO:0048388
      label: endosomal lumen acidification
    modifier: DECREASED
  evidence:
  - reference: PMID:20946626
    reference_title: "Dent's disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Endosomal acidification (up to pH 5.0), that is necessary for dissociation of the ligand-receptor complex, recycling of receptors to the apical membrane, and progression of ligands into lysosomes, is achieved by ATP-driven transport of cytosolic H+ through the V-ATPase."
    explanation: Establishes why endosomal pH matters for receptor recycling, which is the next node in the chain.
  - reference: PMID:20946626
    reference_title: "Dent's disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, in vitro experiments have shown a decreased acidification of early endosomes in ClC-5-deficient mice"
    explanation: Demonstrates that the acidification defect is actually present in ClC-5-deficient tissue.
  - reference: PMID:20946626
    reference_title: "Dent's disease."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, both the KI and KO mouse showed impaired PT endocytosis, indicating that PT dysfunction in Dent's disease may occur despite normal acidification of the endosomes."
    explanation: Refutes the claim that failed acidification is the sole route to proximal tubular dysfunction, since the knock-in mouse acidifies normally and is still affected.
  downstream:
  - target: Megalin and Cubilin Trafficking Failure
    causal_link_type: DIRECT
    description: >-
      Without the pH drop the ligand-receptor complex does not dissociate and
      the receptor is not returned to the apical membrane.

- name: OCRL Phosphoinositide 5-Phosphatase Deficiency
  biological_scale: MOLECULAR
  role: trigger
  description: >
    In Dent disease 2 the initiating lesion is instead a reduction in OCRL
    activity. OCRL is a phosphatidylinositol 4,5-bisphosphate 5-phosphatase
    that sits on early endosomes and keeps PI(4,5)P2 low there. Variants in
    exons 1-7 permit expression of a shortened isoform from an internal start
    codon, which is why the resulting phenotype is Dent disease rather than the
    multisystem Lowe syndrome.
  genes:
  - preferred_term: OCRL
    term:
      id: hgnc:8108
      label: OCRL
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  biological_processes:
  - preferred_term: phosphatidylinositol dephosphorylation
    term:
      id: GO:0046856
      label: phosphatidylinositol dephosphorylation
    modifier: DECREASED
  cellular_components:
  - preferred_term: early endosome
    term:
      id: GO:0005769
      label: early endosome
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "OCRL encodes the PI(4,5)P2 5-phosphatase OCRL, which controls phosphatidylinositol moieties in the endolysosomal pathway by degrading PI(4,5)P2"
    explanation: Names the enzymatic activity lost in Dent disease 2 and the compartment where it acts.
  downstream:
  - target: Endosomal PI(4,5)P2 Accumulation and Actin Dysregulation
    causal_link_type: DIRECT

- name: Endosomal PI(4,5)P2 Accumulation and Actin Dysregulation
  biological_scale: CELLULAR
  description: >
    Reduced OCRL activity lets PI(4,5)P2 build up on early endosomal membranes.
    The excess lipid drives uncontrolled actin polymerisation into basket-like
    structures around the aberrant organelles, which physically obstructs
    receptor trafficking. This is the Dent disease 2 route into the same
    endocytic failure that ClC-5 loss produces in Dent disease 1.
  cellular_components:
  - preferred_term: early endosome
    term:
      id: GO:0005769
      label: early endosome
  biological_processes:
  - preferred_term: actin filament organization
    term:
      id: GO:0007015
      label: actin filament organization
    modifier: DYSREGULATED
  cell_types:
  - preferred_term: kidney proximal convoluted tubule epithelial cell
    term:
      id: CL:1000838
      label: kidney proximal convoluted tubule epithelial cell
  evidence:
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The increase in PI(4,5)P2 levels in early endosomes stimulates uncontrolled actin polymerization into ‘basket’ structures surrounding aberrant organelles, impairing the trafficking of different receptors, including megalin needed for receptor-mediated endocytosis"
    explanation: Traces the OCRL lesion through PI(4,5)P2 accumulation and actin disorganisation to impaired megalin trafficking.
  - reference: PMID:39794284
    reference_title: "Dent disease: clinical practice recommendations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The fact that variants in OCRL generally mimic the proximal tubular dysfunction encountered in DD1 is explained by the association of the OCRL protein with early endosomes, where it acts to maintain low levels of phosphatidylinositol (PI) 4,5-bisphosphate (PI(4,5)P2) for proper endocytic trafficking"
    explanation: States explicitly that the DD1 and DD2 lesions converge on the same endosomal trafficking step, which is the structure of this pathograph.
  downstream:
  - target: Megalin and Cubilin Trafficking Failure
    causal_link_type: DIRECT

- name: Megalin and Cubilin Trafficking Failure
  biological_scale: CELLULAR
  description: >
    The convergence point of both genetic forms. Megalin and cubilin are the
    multiligand receptors of the apical brush border that perform
    receptor-mediated endocytosis in the proximal tubule. Whichever lesion is
    upstream, they are lost or reduced at the brush border and their cargo is
    no longer retrieved from the filtrate. A Drosophila nephrocyte model of
    Dent disease 1, confirmed in ClC-5 knockout mice, adds an earlier
    secretory-pathway step, with Cubilin accumulating in the endoplasmic
    reticulum and Amnionless reduced overall, so the receptor complex may never
    reach the surface rather than only failing to recycle.
  cell_types:
  - preferred_term: kidney proximal convoluted tubule epithelial cell
    term:
      id: CL:1000838
      label: kidney proximal convoluted tubule epithelial cell
  locations:
  - preferred_term: renal proximal tubule
    term:
      id: UBERON:0004134

treatments:
- name: Discontinuation and supportive care
  description: >-
    The primary treatment is stopping the offending serotonergic agent and
    providing supportive care - intravenous fluids, sedation, and external
    cooling. Most cases resolve within about 24 hours of withdrawal.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:2035713
    reference_title: "The serotonin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Discontinuation of the suspected serotonergic agent and institution of supportive measures are the primary treatment"
    explanation: States drug withdrawal plus supportive care as the primary treatment.
- name: Cyproheptadine
  description: >-
    Cyproheptadine, a 5-HT2A receptor antagonist, is the specific antidote for
    moderate serotonin syndrome. In the rat model the most potent 5-HT2A
    antagonists tested (ritanserin, pipamperone) completely prevent the
    hyperthermia and death, which is the mechanistic rationale for
    antiserotonergic therapy; cyproheptadine itself was protective only at high
    doses in that model and is used infrequently in fatal human cases.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cyproheptadine
      term:
        id: CHEBI:4046
        label: cyproheptadine
  target_mechanisms:
  - target: Overactivation of Postsynaptic 5-HT Receptors
    treatment_effect: INHIBITS
    description: >-
      Cyproheptadine blocks 5-HT2A receptors, opposing the receptor
      overactivation that drives the syndrome.
    evidence:
    - reference: PMID:11164765
      reference_title: "Potent serotonin (5-HT)(2A) receptor antagonists completely prevent the development of hyperthermia in an animal model of the 5-HT syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "potent 5-HT(2A) receptor antagonists are the most effective drugs for treatment of the 5-HT syndrome"
      explanation: >-
        5-HT2A antagonism is the mechanistic basis for antidotal therapy;
        cyproheptadine is the clinical 5-HT2A antagonist, demonstrated in the
        rat model.
  evidence:
  - reference: PMID:16227063
    reference_title: "Toxin-induced hyperthermic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "administering either a central serotonergic antagonist, such as cyproheptadine or chlorpromazine, a benzodiazepine, or a combination of the two"
    explanation: Names cyproheptadine as the central serotonergic antagonist used in treatment.
- name: Benzodiazepine sedation
  description: >-
    Benzodiazepines control agitation and the neuromuscular hyperactivity, and
    in the animal model attenuate the development of hyperthermia.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: diazepam
      term:
        id: CHEBI:49575
        label: diazepam
  target_mechanisms:
  - target: Neuromuscular Hyperexcitability
    treatment_effect: INHIBITS
    description: >-
      GABA-enhancing sedation dampens the neuromuscular hyperactivity and
      slows the development of hyperthermia.
    evidence:
    - reference: PMID:12620284
      reference_title: "Diazepam and chlormethiazole attenuate the development of hyperthermia in an animal model of the serotonin syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Pre-treatment with diazepam, 10 and 20mg/kg, and chlormethiazole, 50 and 100mg/kg, attenuated the development of hyperthermia."
      explanation: >-
        GABA-enhancing drugs attenuate the hyperthermia in the rat model,
        supporting benzodiazepine use against the neuromuscular state; an
        animal-model inference.
  evidence:
  - reference: PMID:16227063
    reference_title: "Toxin-induced hyperthermic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "a central serotonergic antagonist, such as cyproheptadine or chlorpromazine, a benzodiazepine, or a combination of the two"
    explanation: Names benzodiazepines among the standard treatments.
environmental:
- name: Electroconvulsive therapy concurrent with serotonergic agents
  description: >-
    Electroconvulsive therapy can precipitate serotonin syndrome when given to a
    patient already taking serotonergic drugs. ECT is thought to enhance central
    serotonergic neurotransmission, superimposing on the existing drug-raised
    serotonergic load. In a reported case the syndrome developed after the first
    ECT session in a patient on bupropion, trazodone, and quetiapine, and did not
    recur once the concurrent agents were changed.
  evidence:
  - reference: PMID:25970280
    reference_title: "Serotonin syndrome after electroconvulsive therapy in a patient on trazodone, bupropion, and quetiapine: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serotonin syndrome developed soon after she received the first session of electroconvulsive therapy (ECT)."
    explanation: Documents ECT precipitating serotonin syndrome in a patient on serotonergic agents.
  influences_mechanisms:
  - target: Excess Synaptic Serotonin
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      ECT superimposed on serotonergic drugs precipitates the syndrome,
      consistent with ECT adding serotonergic drive on top of the drug-raised
      synaptic serotonin.
    evidence:
    - reference: PMID:25970280
      reference_title: "Serotonin syndrome after electroconvulsive therapy in a patient on trazodone, bupropion, and quetiapine: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The superimposing effect of ECT in conjunction with serotonergic agents might contribute to the development of serotonin syndrome."
      explanation: Attributes the episode to ECT acting on top of the serotonergic drug load.
  notes: >-
    No ECTO exposure class exists for electroconvulsive therapy (searched
    l~electroconvulsive, l~electroshock, l~electric in sqlite:obo:ecto, all
    empty), so exposure_term is omitted rather than bound to an approximate term.
- name: Cocaine overdose
  exposure_term:
    preferred_term: exposure to cocaine
    term:
      id: ECTO:9000265
      label: exposure to cocaine
  description: >-
    Cocaine inhibits presynaptic reuptake of serotonin (along with dopamine and
    norepinephrine), raising synaptic serotonin, so a massive cocaine overdose
    can precipitate serotonin syndrome - here as part of a fatal multi-system
    cocaine toxidrome that also included toxic leukoencephalopathy and central
    diabetes insipidus, which are separate cocaine effects rather than part of
    the serotonergic mechanism.
  evidence:
  - reference: PMID:42764931
    reference_title: "Cocaine-Induced Toxic Leukoencephalopathy, Serotonin Syndrome, and Central Diabetes Insipidus Following Cocaine Overdose: A Case Report of a Fatal Outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a fatal case of a 44-year-old man presenting with toxic leukoencephalopathy, serotonin syndrome, and central diabetes insipidus following a massive cocaine overdose"
    explanation: Documents serotonin syndrome following a massive cocaine overdose.
  influences_mechanisms:
  - target: Excess Synaptic Serotonin
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Cocaine's inhibition of presynaptic serotonin reuptake raises synaptic
      serotonin, the route by which a cocaine overdose drives the syndrome.
    evidence:
    - reference: PMID:42764931
      reference_title: "Cocaine-Induced Toxic Leukoencephalopathy, Serotonin Syndrome, and Central Diabetes Insipidus Following Cocaine Overdose: A Case Report of a Fatal Outcome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Its primary pharmacological action involves the inhibition of presynaptic dopamine, norepinephrine, and serotonin reuptake, resulting in an excessive accumulation of synaptic catecholamines and monoamines"
      explanation: >-
        Cocaine blocks serotonin reuptake, the mechanism by which it raises
        synaptic serotonin and can precipitate the syndrome.
- name: Ayahuasca combined with a serotonergic agent
  description: >-
    Ayahuasca is an Amazonian botanical brew whose beta-carboline alkaloids
    (harmine, harmaline, tetrahydroharmine) are reversible MAO-A inhibitors. That
    MAOI activity predisposes users to serotonin syndrome when ayahuasca is
    combined with another serotonergic agent - here over-the-counter
    dextromethorphan - the same high-risk MAOI-plus-serotonergic-drug pairing
    that causes the syndrome with prescription MAOIs.
  evidence:
  - reference: PMID:42713547
    reference_title: "Severe Serotonin Syndrome With Acute Respiratory Failure Following Ayahuasca and Dextromethorphan Use: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present the case of a 46-year-old man who developed severe serotonin syndrome (SS) complicated by acute respiratory failure after ingesting ayahuasca over three days, followed by over-the-counter dextromethorphan (DXM) and diphenhydramine"
    explanation: Documents severe serotonin syndrome after ayahuasca combined with dextromethorphan.
  influences_mechanisms:
  - target: Excess Synaptic Serotonin
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Ayahuasca's beta-carboline MAO-A inhibition blocks serotonin breakdown, so
      combined with another serotonergic agent it raises synaptic serotonin and
      precipitates the syndrome.
    evidence:
    - reference: PMID:42713547
      reference_title: "Severe Serotonin Syndrome With Acute Respiratory Failure Following Ayahuasca and Dextromethorphan Use: A Case Report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "the MAOI content of ayahuasca predisposes users to serotonergic toxicity when combined with other serotonergic agents"
      explanation: >-
        The MAO-inhibiting content of ayahuasca is the route by which it raises
        serotonergic tone and precipitates the syndrome in combination.
  notes: >-
    No ECTO exposure class exists for ayahuasca or its alkaloids (searched
    l~ayahuasca, l~harmine, l~dimethyltryptamine in sqlite:obo:ecto, all empty),
    so exposure_term is omitted rather than bound to an approximate term.
diagnosis:
- name: Hunter Serotonin Toxicity Criteria
  description: >-
    Diagnosis is clinical. The Hunter criteria apply decision rules over clonus,
    agitation, diaphoresis, tremor, hyperreflexia, hypertonicity, and
    temperature in a patient on a serotonergic agent. In their derivation study
    they were reported as more sensitive and specific than the older Sternbach
    criteria, and are widely treated as the reference standard; a later
    case meta-analysis (PMID:27406219) found that superiority rests on that one
    study and that the three criteria systems agree poorly, so the advantage is
    not independently established.
  evidence:
  - reference: PMID:12925718
    reference_title: "The Hunter Serotonin Toxicity Criteria: simple and accurate diagnostic decision rules for serotonin toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These new criteria were simpler, more sensitive (84% vs. 75%) and more specific (97% vs. 96%) than Sternbach's criteria."
    explanation: Reports the diagnostic performance of the Hunter criteria in their derivation study.
  - reference: PMID:27406219
    reference_title: "Conundrums in neurology: diagnosing serotonin syndrome - a meta-analysis of cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "There is little agreement between current criteria systems for the diagnosis of serotonin syndrome."
    explanation: >-
      The case meta-analysis finds poor agreement between the criteria systems,
      qualifying the reported Hunter superiority.
differential_diagnoses:
- name: Neuroleptic malignant syndrome
  disease_term:
    preferred_term: neuroleptic malignant syndrome
    term:
      id: MONDO:0019790
      label: neuroleptic malignant syndrome
  description: >-
    The principal differential. Both present with hyperthermia, autonomic
    instability, altered mental status, and increased muscle tone, and the two
    overlap most in agents with both antidopaminergic and serotonergic activity.
    They separate on tempo and on the neuromuscular pattern: serotonin syndrome
    comes on within hours with clonus and hyperreflexia, whereas neuroleptic
    malignant syndrome evolves over days as an idiosyncratic reaction to
    neuroleptics with bradykinesia and lead-pipe rigidity.
  distinguishing_features:
  - Serotonin syndrome has clonus and hyperreflexia; neuroleptic malignant syndrome has bradykinesia and lead-pipe or cogwheel rigidity.
  - Serotonin syndrome follows a serotonergic agent and onsets within hours; neuroleptic malignant syndrome is an idiosyncratic reaction to neuroleptics evolving over days.
  evidence:
  - reference: PMID:30315014
    reference_title: Demystifying serotonin syndrome (or serotonin toxicity).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Unlike serotonin toxicity, neuroleptic malignant syndrome is not dose-related but is an idiosyncratic reaction to neuroleptic drugs. Onset is slower, taking place over days, and it is differentiated from serotonin toxicity by the presence of bradykinesia and lead-pipe or cogwheel rigidity"
    explanation: States the tempo and neuromuscular features that distinguish the two.
  - reference: PMID:16227063
    reference_title: Toxin-induced hyperthermic syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "NMS typically occurs over hours to days in a patient taking a neuroleptic agent; its recommended treatment is generally the combination of a central dopamine agonist, bromocriptine or L-dopa, and dantrolene"
    explanation: Contrasts NMS tempo, trigger, and treatment with serotonin syndrome.
  - reference: PMID:41652380
    reference_title: "Sertraline and quetiapine induced Serotonin Syndrome and Neuroleptic Malignant Syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient met the diagnostic criteria for both Serotonin Syndrome and Neuroleptic Malignant Syndrome"
    explanation: >-
      The two can overlap: a sertraline-plus-quetiapine case met criteria for
      both, which is why the distinction can be difficult at the bedside.
- name: Malignant hyperthermia of anesthesia
  disease_term:
    preferred_term: malignant hyperthermia of anesthesia
    term:
      id: MONDO:0018493
      label: malignant hyperthermia of anesthesia
  description: >-
    Shares severe hyperthermia and muscle rigidity, but is triggered by volatile
    anaesthetics during or shortly after surgery rather than by serotonergic
    drugs, and is treated with dantrolene. It is one of the drug/toxin-induced
    hyperthermic syndromes whose triggers and treatments differ from serotonin
    syndrome.
  distinguishing_features:
  - Triggered by specific volatile anaesthetics in the surgical/anaesthesia setting, not by serotonergic agents.
  - Treated with dantrolene; serotonin syndrome responds to withdrawal of the serotonergic agent plus supportive care and a 5-HT2A antagonist.
  evidence:
  - reference: PMID:30315014
    reference_title: Demystifying serotonin syndrome (or serotonin toxicity).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Malignant hyperthermia is triggered by specific volatile anesthetics during or shortly after surgery"
    explanation: States the anaesthetic trigger that distinguishes malignant hyperthermia from serotonin syndrome.
  - reference: PMID:16227063
    reference_title: Toxin-induced hyperthermic syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "MH presents rapidly with jaw rigidity, hyperthermia, and hypercarbia. Although it almost always occurs in the setting of surgical anesthesia, cases have occurred in susceptible individuals during exertion. The treatment of MH involves the use of dantrolene"
    explanation: Gives the surgical-anaesthesia setting and dantrolene treatment that differentiate it from serotonin syndrome.
- name: Anticholinergic toxicity
  description: >-
    Overlaps through hyperthermia, agitation, mydriasis, and tachycardia, but
    is distinguished at the bedside by normal muscle tone and reflexes and by
    dry, flushed skin and absent bowel sounds, against the clonus,
    hyperreflexia, and diaphoresis of serotonin syndrome.
  distinguishing_features:
  - Muscle tone and reflexes are normal in anticholinergic toxicity, unlike the hyperreflexia and clonus of serotonin syndrome.
  - Anticholinergic toxicity gives dry, flushed skin and decreased bowel sounds; serotonin syndrome instead gives diaphoresis.
  evidence:
  - reference: PMID:30315014
    reference_title: Demystifying serotonin syndrome (or serotonin toxicity).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A distinguishing feature is that muscle tone and reflexes are normal in anticholinergic toxicity"
    explanation: The normal tone and reflexes of anticholinergic toxicity separate it from serotonin syndrome.
  - reference: PMID:30315014
    reference_title: Demystifying serotonin syndrome (or serotonin toxicity).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Symptoms include dry mouth, dry and flushed skin, urinary retention, decreased bowel sounds, dilated pupils, blurry vision, fever, agitation, delirium, and hallucinations"
    explanation: Gives the dry, flushed skin and decreased bowel sounds of anticholinergic toxicity, against the diaphoresis of serotonin syndrome.
- name: Alcohol withdrawal syndrome
  disease_term:
    preferred_term: alcohol withdrawal
    term:
      id: MONDO:0005433
      label: alcohol withdrawal
  description: >-
    In a patient with alcohol use disorder who is also on serotonergic
    medication, serotonin syndrome can masquerade as alcohol withdrawal: both
    give tremor, diaphoresis, autonomic instability, and agitation. What resolves
    the case is the medication history, a symptom course that runs beyond the
    expected withdrawal window, and clonus and hyperreflexia that meet the Hunter
    criteria in a patient on serotonergic agents, pointing to serotonin syndrome.
  distinguishing_features:
  - Clonus and hyperreflexia that meet the Hunter criteria in a patient on serotonergic agents point to serotonin syndrome.
  - Serotonin syndrome tracks the serotonergic medication and can continue beyond the typical alcohol-withdrawal timeframe, rather than following the time since the last drink.
  evidence:
  - reference: PMID:40886730
    reference_title: "Serotonin Syndrome Masquerading as Alcohol Withdrawal: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alcohol withdrawal syndrome (AWS) and serotonin syndrome (SS) share several overlapping symptoms, complicating diagnosis in patients with alcohol use disorder (AUD) on serotonergic treatment"
    explanation: States the overlap that makes alcohol withdrawal a differential for serotonin syndrome.
  - reference: PMID:40886730
    reference_title: "Serotonin Syndrome Masquerading as Alcohol Withdrawal: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurological examination revealed hyperreflexia, clonus, and persistent hypertension, fulfilling the Hunter Serotonin Toxicity Criteria for SS"
    explanation: Clonus and hyperreflexia fulfilling the Hunter criteria resolve the case toward serotonin syndrome.
  - reference: PMID:40886730
    reference_title: "Serotonin Syndrome Masquerading as Alcohol Withdrawal: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "he developed worsening tremors, nausea, diarrhea, diaphoresis, muscle twitching, rigidity, and restlessness beyond the typical AWS timeframe"
    explanation: The symptom course running beyond the expected withdrawal window is what prompted reconsideration toward serotonin syndrome.
animal_models:
- name: Rat clorgyline plus 5-HTP serotonin syndrome model
  species: Rat
  genotype: Wild-type rats dosed with clorgyline (MAO-A inhibitor) and 5-hydroxy-L-tryptophan
  publication: PMID:11164765
  description: >-
    The standard pharmacological rat model: an MAO-A inhibitor plus a serotonin
    precursor drives rectal temperature above 40 degrees C with death within 90
    minutes, accompanied by a large anterior-hypothalamic noradrenaline surge.
    Potent 5-HT2A antagonists abolish both.
  modeled_mechanisms:
  - target: Central Noradrenergic Hyperactivity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the hypothalamic noradrenaline surge and shows it is suppressed
      by 5-HT2A blockade.
    limitations: >-
      A precursor-plus-MAOI induction in a single species; it omits the human
      drug-combination context and species differences in 5-HT receptor
      distribution.
    readouts:
    - name: Anterior hypothalamic noradrenaline
      target: Central Noradrenergic Hyperactivity
      direction: INCREASED
      interpretation: Microdialysis measure of the noradrenergic surge in the model.
      evidence:
      - reference: PMID:11164765
        reference_title: "Potent serotonin (5-HT)(2A) receptor antagonists completely prevent the development of hyperthermia in an animal model of the 5-HT syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The noradrenaline (NA) levels in the anterior hypothalamus, measured by microdialysis, increased to 15.9 times the preadministration level."
        explanation: Quantifies the hypothalamic noradrenaline rise this readout measures.
  - target: Hyperthermia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reproduces the lethal hyperthermia of severe serotonin syndrome.
    limitations: >-
      Supraphysiological precursor loading drives a more fulminant course than
      most human cases; the model captures the severe end of the spectrum.
    readouts:
    - name: Rectal temperature
      target: Hyperthermia
      direction: INCREASED
      interpretation: Core temperature rise, the model's primary endpoint.
      evidence:
      - reference: PMID:11164765
        reference_title: "Potent serotonin (5-HT)(2A) receptor antagonists completely prevent the development of hyperthermia in an animal model of the 5-HT syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "the rectal temperature of the rats increased to more than 40 degrees C, and all of the animals died by 90 min after the drug administration"
        explanation: Documents the hyperthermia and lethality this readout measures.
  evidence:
  - reference: PMID:11164765
    reference_title: "Potent serotonin (5-HT)(2A) receptor antagonists completely prevent the development of hyperthermia in an animal model of the 5-HT syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "both potent 5-HT(2A) receptor antagonists, completely prevented the increase in rectal temperature and death of the animals"
    explanation: >-
      5-HT2A antagonists abolish the model's hyperthermia, supporting it as an
      informative model of the receptor-driven mechanism.

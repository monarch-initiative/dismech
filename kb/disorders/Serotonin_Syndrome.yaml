treatments:
- name: Discontinuation and supportive care
  description: >-
    The primary treatment is stopping the offending serotonergic agent and
    providing supportive care - intravenous fluids, sedation, and external
    cooling. Most cases resolve within about 24 hours of withdrawal.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:2035713
    reference_title: "The serotonin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Discontinuation of the suspected serotonergic agent and institution of supportive measures are the primary treatment"
    explanation: States drug withdrawal plus supportive care as the primary treatment.
- name: Cyproheptadine
  description: >-
    Cyproheptadine, a 5-HT2A receptor antagonist, is the specific antidote for
    moderate serotonin syndrome. In the rat model the most potent 5-HT2A
    antagonists tested (ritanserin, pipamperone) completely prevent the
    hyperthermia and death, which is the mechanistic rationale for
    antiserotonergic therapy; cyproheptadine itself was protective only at high
    doses in that model and is used infrequently in fatal human cases.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cyproheptadine
      term:
        id: CHEBI:4046
        label: cyproheptadine
  target_mechanisms:
  - target: Overactivation of Postsynaptic 5-HT Receptors
    treatment_effect: INHIBITS
    description: >-
      Cyproheptadine blocks 5-HT2A receptors, opposing the receptor
      overactivation that drives the syndrome.
    evidence:
    - reference: PMID:11164765
      reference_title: "Potent serotonin (5-HT)(2A) receptor antagonists completely prevent the development of hyperthermia in an animal model of the 5-HT syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "potent 5-HT(2A) receptor antagonists are the most effective drugs for treatment of the 5-HT syndrome"
      explanation: >-
        5-HT2A antagonism is the mechanistic basis for antidotal therapy;
        cyproheptadine is the clinical 5-HT2A antagonist, demonstrated in the
        rat model.
  evidence:
  - reference: PMID:16227063
    reference_title: "Toxin-induced hyperthermic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "administering either a central serotonergic antagonist, such as cyproheptadine or chlorpromazine, a benzodiazepine, or a combination of the two"
    explanation: Names cyproheptadine as the central serotonergic antagonist used in treatment.
- name: Benzodiazepine sedation
  description: >-
    Benzodiazepines control agitation and the neuromuscular hyperactivity, and
    in the animal model attenuate the development of hyperthermia.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: diazepam
      term:
        id: CHEBI:49575
        label: diazepam
  target_mechanisms:
  - target: Neuromuscular Hyperexcitability
    treatment_effect: INHIBITS
    description: >-
      GABA-enhancing sedation dampens the neuromuscular hyperactivity and
      slows the development of hyperthermia.
    evidence:
    - reference: PMID:12620284
      reference_title: "Diazepam and chlormethiazole attenuate the development of hyperthermia in an animal model of the serotonin syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Pre-treatment with diazepam, 10 and 20mg/kg, and chlormethiazole, 50 and 100mg/kg, attenuated the development of hyperthermia."
      explanation: >-
        GABA-enhancing drugs attenuate the hyperthermia in the rat model,
        supporting benzodiazepine use against the neuromuscular state; an
        animal-model inference.
  evidence:
  - reference: PMID:16227063
    reference_title: "Toxin-induced hyperthermic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "a central serotonergic antagonist, such as cyproheptadine or chlorpromazine, a benzodiazepine, or a combination of the two"
    explanation: Names benzodiazepines among the standard treatments.
diagnosis:
- name: Hunter Serotonin Toxicity Criteria
  description: >-
    Diagnosis is clinical. The Hunter criteria apply decision rules over clonus,
    agitation, diaphoresis, tremor, hyperreflexia, hypertonicity, and
    temperature in a patient on a serotonergic agent. In their derivation study
    they were reported as more sensitive and specific than the older Sternbach
    criteria, and are widely treated as the reference standard; a later
    case meta-analysis (PMID:27406219) found that superiority rests on that one
    study and that the three criteria systems agree poorly, so the advantage is
    not independently established.
  evidence:
  - reference: PMID:12925718
    reference_title: "The Hunter Serotonin Toxicity Criteria: simple and accurate diagnostic decision rules for serotonin toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These new criteria were simpler, more sensitive (84% vs. 75%) and more specific (97% vs. 96%) than Sternbach's criteria."
    explanation: Reports the diagnostic performance of the Hunter criteria in their derivation study.
  - reference: PMID:27406219
    reference_title: "Conundrums in neurology: diagnosing serotonin syndrome - a meta-analysis of cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "There is little agreement between current criteria systems for the diagnosis of serotonin syndrome."
    explanation: >-
      The case meta-analysis finds poor agreement between the criteria systems,
      qualifying the reported Hunter superiority.
animal_models:
- name: Rat clorgyline plus 5-HTP serotonin syndrome model
  species: Rat
  genotype: Wild-type rats dosed with clorgyline (MAO-A inhibitor) and 5-hydroxy-L-tryptophan
  publication: PMID:11164765
  description: >-
    The standard pharmacological rat model: an MAO-A inhibitor plus a serotonin
    precursor drives rectal temperature above 40 degrees C with death within 90
    minutes, accompanied by a large anterior-hypothalamic noradrenaline surge.
    Potent 5-HT2A antagonists abolish both.
  modeled_mechanisms:
  - target: Central Noradrenergic Hyperactivity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the hypothalamic noradrenaline surge and shows it is suppressed
      by 5-HT2A blockade.
    limitations: >-
      A precursor-plus-MAOI induction in a single species; it omits the human
      drug-combination context and species differences in 5-HT receptor
      distribution.
    readouts:
    - name: Anterior hypothalamic noradrenaline
      target: Central Noradrenergic Hyperactivity
      direction: INCREASED
      interpretation: Microdialysis measure of the noradrenergic surge in the model.
      evidence:
      - reference: PMID:11164765
        reference_title: "Potent serotonin (5-HT)(2A) receptor antagonists completely prevent the development of hyperthermia in an animal model of the 5-HT syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The noradrenaline (NA) levels in the anterior hypothalamus, measured by microdialysis, increased to 15.9 times the preadministration level."
        explanation: Quantifies the hypothalamic noradrenaline rise this readout measures.
  - target: Hyperthermia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reproduces the lethal hyperthermia of severe serotonin syndrome.
    limitations: >-
      Supraphysiological precursor loading drives a more fulminant course than
      most human cases; the model captures the severe end of the spectrum.
    readouts:
    - name: Rectal temperature
      target: Hyperthermia
      direction: INCREASED
      interpretation: Core temperature rise, the model's primary endpoint.
      evidence:
      - reference: PMID:11164765
        reference_title: "Potent serotonin (5-HT)(2A) receptor antagonists completely prevent the development of hyperthermia in an animal model of the 5-HT syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "the rectal temperature of the rats increased to more than 40 degrees C, and all of the animals died by 90 min after the drug administration"
        explanation: Documents the hyperthermia and lethality this readout measures.
  evidence:
  - reference: PMID:11164765
    reference_title: "Potent serotonin (5-HT)(2A) receptor antagonists completely prevent the development of hyperthermia in an animal model of the 5-HT syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "both potent 5-HT(2A) receptor antagonists, completely prevented the increase in rectal temperature and death of the animals"
    explanation: >-
      5-HT2A antagonists abolish the model's hyperthermia, supporting it as an
      informative model of the receptor-driven mechanism.

name: Serotonin Syndrome
creation_date: "2026-10-02T02:00:00Z"
description: >-
  A drug-induced toxidrome caused by excess serotonergic activity in the central
  nervous system. It is not a disease of a serotonin defect but of serotonin
  excess, almost always pharmacological: a serotonergic drug raises synaptic
  5-hydroxytryptamine - by increasing synthesis or release, blocking reuptake,
  blocking metabolism, or directly agonizing receptors - and the resulting
  over-stimulation of postsynaptic receptors, most notably 5-HT2A and 5-HT1A,
  produces a clinical triad of altered mental status, neuromuscular
  hyperexcitability (clonus, hyperreflexia, tremor), and autonomic instability.

  Most cases follow a combination of two agents acting by different mechanisms,
  the classic and most dangerous being a monoamine oxidase inhibitor with a
  serotonin-reuptake inhibitor, but monotherapy and overdose also cause it.
  Severity is a spectrum: most cases are mild and resolve within about a day of
  stopping the drug, while the severe end is defined by hyperthermia that is
  muscular rather than hypothalamic in origin, with rhabdomyolysis, disseminated
  intravascular coagulation, and death. Diagnosis is clinical, by the Hunter or
  Sternbach criteria, there being no confirmatory test. Because the hyperthermia
  is generated by sustained muscle activity rather than a raised set point,
  antipyretics do not help and the specific antidote is a 5-HT2A antagonist,
  cyproheptadine.
categories:
- Toxic Exposure Disorder
- Treatment Toxicity
category: Complex
parents:
- Poisoning
synonyms:
- serotonin toxicity
- serotonin toxidrome
disease_term:
  preferred_term: serotonin syndrome
  term:
    id: MONDO:0018546
    label: serotonin syndrome
notes: >-
  Acquired drug-induced toxidrome, not a Mendelian disease: no causal gene, no
  inheritance block, and no OMIM or Orphanet entry. Candidate pharmacogenetic
  modifiers (CYP2D6, CYP2C19, SLC6A4, HTR2A) are hypothesized in the literature
  but no causal or susceptibility variant is established, so none is curated.
  Hyperthermia is bound to HP:0001945 (Fever, "body temperature elevated above
  the normal range") rather than HP:0002047 Malignant hyperthermia, which is the
  distinct RYR1-related anaesthetic entity; the serotonin-syndrome sign is
  elevated body temperature of muscular origin. No GeneReviews chapter exists
  (checked offline; this is not a Mendelian disorder).
references:
- reference: PMID:12925718
  title: "The Hunter Serotonin Toxicity Criteria: simple and accurate diagnostic decision rules for serotonin toxicity."
pathophysiology:
- name: Excess Synaptic Serotonin
  biological_scale: MOLECULAR
  description: >-
    One or more serotonergic drugs raise the concentration of serotonin at
    central synapses, by increasing its synthesis or release, blocking its
    reuptake, inhibiting its monoamine-oxidase metabolism, or directly agonizing
    receptors. Combinations acting by two different mechanisms - classically a
    monoamine oxidase inhibitor with a reuptake inhibitor - produce the largest
    rise.
  chemical_entities:
  - preferred_term: serotonin
    term:
      id: CHEBI:28790
      label: serotonin
    modifier: INCREASED
  cell_types:
  - preferred_term: serotonergic neuron
    term:
      id: CL:0000850
      label: serotonergic neuron
  downstream:
  - target: Overactivation of Postsynaptic 5-HT Receptors
    causal_link_type: DIRECT
    description: >-
      The excess synaptic serotonin over-stimulates postsynaptic serotonin
      receptors.
    evidence:
    - reference: PMID:24358002
      reference_title: "Serotonin syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "precipitated by the use of serotonergic drugs and overactivation of both the peripheral and central postsynaptic 5HT-1A and, most notably, 5HT-2A receptors"
      explanation: Links the serotonergic drug exposure to receptor overactivation as the next step.
  evidence:
  - reference: PMID:2035713
    reference_title: "The serotonin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The serotonin syndrome is most commonly the result of the interaction between serotonergic agents and monoamine oxidase inhibitors."
    explanation: Establishes drug interaction raising serotonergic tone as the proximate cause.
- name: Overactivation of Postsynaptic 5-HT Receptors
  biological_scale: MOLECULAR
  description: >-
    Excess serotonin over-activates postsynaptic serotonin receptors, most
    notably 5-HT2A and also 5-HT1A, driving the downstream neuromuscular,
    autonomic, and mental-status features of the syndrome.
  biological_processes:
  - preferred_term: serotonin receptor signaling pathway
    term:
      id: GO:0007210
      label: serotonin receptor signaling pathway
    modifier: INCREASED
  downstream:
  - target: Neuromuscular Hyperexcitability
    causal_link_type: DIRECT
    description: >-
      5-HT receptor stimulation gives rise to the neuromuscular
      hyperexcitability that is the main feature of the syndrome.
    evidence:
    - reference: PMID:27406219
      reference_title: "Conundrums in neurology: diagnosing serotonin syndrome - a meta-analysis of cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      snippet: "main feature is neuro-muscular hyperexcitability, which, if severe, can become life-threatening. The syndrome is thought to arise from 5HT1A and 5HT2 receptor stimulation"
      explanation: >-
        Ties the neuromuscular hyperexcitability to 5-HT1A/5-HT2 receptor
        stimulation as its origin; a review synthesis, so the causal attribution
        is indirect.
  - target: Central Noradrenergic Hyperactivity
    causal_link_type: DIRECT
    description: >-
      In the rat 5-HT syndrome model, inducing the syndrome raises anterior
      hypothalamic noradrenaline many-fold, and potent 5-HT2A antagonists both
      block that rise and prevent the hyperthermia and death, placing the
      noradrenergic surge downstream of 5-HT2A overactivation.
    evidence:
    - reference: PMID:11164765
      reference_title: "Potent serotonin (5-HT)(2A) receptor antagonists completely prevent the development of hyperthermia in an animal model of the 5-HT syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "pretreatment with ritanserin (3 mg/kg) and pipamperone (20 mg/kg), both potent 5-HT(2A) receptor antagonists, completely prevented the increase in rectal temperature and death of the animals, and the hypothalamic NA levels in these two groups increased less than that in the other groups"
      explanation: >-
        5-HT2A blockade suppresses the hypothalamic noradrenaline rise and the
        hyperthermia, so the noradrenergic hyperactivity is downstream of
        receptor overactivation; an animal-model inference.
  - target: Autonomic Hyperactivity
    causal_link_type: DIRECT
    description: >-
      Serotonin receptor overactivation drives autonomic instability, one of the
      three domains the syndrome consists of.
    evidence:
    - reference: PMID:24358002
      reference_title: "Serotonin syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      snippet: "most notably, 5HT-2A receptors. This syndrome consists of a combination of mental status changes, neuromuscular hyperactivity, and autonomic hyperactivity"
      explanation: >-
        Links receptor overactivation to the autonomic-hyperactivity domain the
        syndrome is composed of; a review synthesis, so indirect.
  - target: Agitation
    causal_link_type: DIRECT
    description: Receptor overactivation produces the altered mental status of the syndrome.
    evidence:
    - reference: PMID:24358002
      reference_title: "Serotonin syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      snippet: "most notably, 5HT-2A receptors. This syndrome consists of a combination of mental status changes, neuromuscular hyperactivity, and autonomic hyperactivity"
      explanation: >-
        Links receptor overactivation to the mental-status domain the syndrome
        is composed of; a review synthesis, so indirect.
  evidence:
  - reference: PMID:24358002
    reference_title: "Serotonin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "overactivation of both the peripheral and central postsynaptic 5HT-1A and, most notably, 5HT-2A receptors"
    explanation: States the receptor subtypes whose overactivation drives the syndrome.
- name: Neuromuscular Hyperexcitability
  biological_scale: ORGANISM
  description: >-
    Excess serotonergic drive to spinal and brainstem motor pathways produces
    the neuromuscular hallmark of the syndrome: clonus, hyperreflexia, tremor,
    and myoclonus, progressing to rigidity in severe cases. Sustained muscle
    activity generates heat and, when extreme, breaks down muscle.
  downstream:
  - target: Clonus
    causal_link_type: DIRECT
  - target: Hyperreflexia
    causal_link_type: DIRECT
  - target: Tremor
    causal_link_type: DIRECT
  - target: Myoclonus
    causal_link_type: DIRECT
  - target: Muscle rigidity
    causal_link_type: DIRECT
  - target: Seizure
    causal_link_type: DIRECT
  - target: Hyperthermia
    causal_link_type: DIRECT
    description: >-
      Sustained muscle hyperactivity generates heat; the hyperthermia of severe
      serotonin syndrome is muscular in origin, which is why it is unresponsive
      to antipyretics.
    evidence:
    - reference: PMID:27406219
      reference_title: "Conundrums in neurology: diagnosing serotonin syndrome - a meta-analysis of cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "In the context of SS, hyperthermia is linked to increased muscle activity as consequence of hyperexcitability and direct serotonergic effects on the muscle"
      explanation: >-
        Directly attributes the hyperthermia of serotonin syndrome to increased
        muscle activity arising from the neuromuscular hyperexcitability.
  - target: Rhabdomyolysis
    causal_link_type: DIRECT
    description: Prolonged severe muscle hyperactivity and rigidity cause muscle breakdown.
    evidence:
    - reference: PMID:27406219
      reference_title: "Conundrums in neurology: diagnosing serotonin syndrome - a meta-analysis of cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "In cases with rhabdomyolysis, muscle rigidity/hypertonicity, fever and hyperthermia were significantly more frequent"
      explanation: >-
        Rhabdomyolysis co-occurs with the severe neuromuscular state (rigidity
        and hyperthermia), linking it downstream of the muscle hyperactivity.
  evidence:
  - reference: PMID:27406219
    reference_title: "Conundrums in neurology: diagnosing serotonin syndrome - a meta-analysis of cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Serotonin syndrome's main feature is neuro-muscular hyperexcitability, which in many cases is mild but in some cases can become life-threatening."
    explanation: Identifies neuromuscular hyperexcitability as the central feature and its severity spectrum.
- name: Central Noradrenergic Hyperactivity
  biological_scale: CELLULAR
  description: >-
    In animal models of the serotonin syndrome, anterior hypothalamic
    noradrenaline rises steeply, and the degree of that rise tracks the
    hyperthermia and lethality. It is a downstream amplifier of the
    thermoregulatory derangement rather than a primary serotonergic event.
  downstream:
  - target: Hyperthermia
    causal_link_type: DIRECT
    description: >-
      The hypothalamic noradrenaline surge contributes to the rise in body
      temperature; suppressing it with 5-HT2A antagonists prevents the
      hyperthermia in the rat model.
    evidence:
    - reference: PMID:15048612
      reference_title: "Memantine, an NMDA antagonist, prevents the development of hyperthermia in an animal model for serotonin syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Pretreatment with risperidone (0.5 mg/kg) and ketanserin (5 mg/kg) prevented the development of hyperthermia and the increase in the NA level."
      explanation: >-
        Blocking the noradrenaline rise prevents hyperthermia in the rat model,
        linking the two; an animal-model inference.
  evidence:
  - reference: PMID:11164765
    reference_title: "Potent serotonin (5-HT)(2A) receptor antagonists completely prevent the development of hyperthermia in an animal model of the 5-HT syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The noradrenaline (NA) levels in the anterior hypothalamus, measured by microdialysis, increased to 15.9 times the preadministration level."
    explanation: Documents the hypothalamic noradrenergic surge in the rat 5-HT syndrome model.
- name: Autonomic Hyperactivity
  biological_scale: ORGANISM
  description: >-
    Serotonergic overactivation of autonomic pathways produces the autonomic
    instability of the syndrome: tachycardia, diaphoresis, mydriasis, and
    diarrhea, with labile blood pressure in severe cases.
  downstream:
  - target: Tachycardia
    causal_link_type: DIRECT
  - target: Hyperhidrosis
    causal_link_type: DIRECT
  - target: Mydriasis
    causal_link_type: DIRECT
  - target: Diarrhea
    causal_link_type: DIRECT
  - target: Hypertension
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24358002
    reference_title: "Serotonin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "a combination of mental status changes, neuromuscular hyperactivity, and autonomic hyperactivity"
    explanation: Names autonomic hyperactivity as one of the three clinical domains.

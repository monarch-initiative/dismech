    explanation: Recurrence through parental germline mosaicism.
  - reference: PMID:8298733
    reference_title: "Some variants of lethal neonatal short-limbed platyspondylic dysplasia: a radiological ultrasonographic, neuropathological and histopathological study of 22 cases."
    supports: SUPPORT

      RER and a reduced rate of matrix synthesis.
    explanation: >-
      The disproportionate micromelia (Dmm) mouse carries a different Col2a1
      C-propeptide allele and is not described as a PLSD-T model, hence
      INDIRECT; it supports the assembly and secretion defect for the domain.

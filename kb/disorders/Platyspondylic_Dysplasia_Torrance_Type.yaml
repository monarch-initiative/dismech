    explanation: ClinGen summary of the variant location.
  downstream:
  - target: Impaired Procollagen II Trimer Assembly and Secretion
    description: >-
      The C-propeptide directs chain selection and trimer nucleation, so an
      altered C-propeptide impairs association of the mutant chains into
      procollagen trimers and their secretion.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21538020
      reference_title: "ENU-induced missense mutation in the C-propeptide coding region of Col2a1 creates a mouse model of platyspondylic lethal skeletal dysplasia, Torrance type."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The secretion of the mutant proteins into the extracellular space was
        disrupted, accompanied by abnormally expanded rough endoplasmic reticulum
        (ER) and upregulation of ER stress-related genes, such as Grp94 and Chop,
        in chondrocytes.
      explanation: >-
        A mouse C-propeptide missense variant at a position corresponding to a
        human PLSD-T variant disrupts secretion of the mutant protein.
- name: Impaired Procollagen II Trimer Assembly and Secretion
  biological_scale: CELLULAR
  description: >-
    Mutant pro-alpha1(II) chains fail to associate normally into homotrimeric
    procollagen II, and the mutant protein is not secreted into the
    extracellular space. Because type II collagen is a homotrimer, normal
    chains made from the other allele can be drawn into defective assemblies,
    the basis of the dominant-negative model.
  mechanism_confidence: PROVISIONAL

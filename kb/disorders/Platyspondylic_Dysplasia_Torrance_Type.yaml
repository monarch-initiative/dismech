genetic:
- name: COL2A1
  gene_term:
    preferred_term: COL2A1
    term:
      id: hgnc:2200
      label: COL2A1
  association: Heterozygous C-propeptide variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Nearly all reported alleles lie in the C-propeptide coding region:
    missense, in-frame deletion, and nonsense or frameshift variants in the last
    exon. Most arise de novo. One family with two affected sibs carried a
    triple-helical glycine substitution (p.Gly1182Asp), so a Torrance-like
    phenotype is not strictly confined to C-propeptide variants. The
    C-propeptide alleles p.Tyr1391Cys and p.Phe1486del have each also been found
    in individuals with spondyloperipheral dysplasia.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_a4c42c43-7b6a-4456-aeb1-7a00302a468b-2021-02-01T050000.000Z
    evidence:
    - reference: CGGV:assertion_a4c42c43-7b6a-4456-aeb1-7a00302a468b-2021-02-01T050000.000Z
      reference_title: "COL2A1 / platyspondylic dysplasia, Torrance type (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "COL2A1 | HGNC:2200 | platyspondylic dysplasia, Torrance type | MONDO:0007895 | AD | Definitive"
      explanation: >-
        ClinGen Skeletal Disorders GCEP classification for this entry's own
        MONDO term.
  evidence:
  - reference: PMID:15643621
    reference_title: "Dominant negative mutations in the C-propeptide of COL2A1 cause platyspondylic lethal skeletal dysplasia, torrance type, and define a novel subfamily within the type 2 collagenopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We studied eight additional cases of PLSD-T and found that all had
      mutations in the C-propeptide domain of COL2A1.
    explanation: Eight cases with C-propeptide variants.
  - reference: CGGV:assertion_a4c42c43-7b6a-4456-aeb1-7a00302a468b-2021-02-01T050000.000Z
    reference_title: "COL2A1 / platyspondylic dysplasia, Torrance type (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      At least 10 unique variants (missense, nonsense, frameshift etc.) have
      been reported in patients with PLSD-T.
    explanation: ClinGen's count of distinct variants.
  - reference: PMID:10360402
    reference_title: "Platyspondylic lethal skeletal dysplasia, San Diego type, is caused by FGFR3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No mutations were identified in the Torrance and Luton types.
    explanation: >-
      The FGFR3 mutations of thanatophoric dysplasia and the San Diego type are
      absent from Torrance and Luton types, separating them from the FGFR3
      disorders they resemble.
  variants:
  - name: p.Tyr1391Cys
    description: >-
      C-propeptide missense variant reported in PLSD-T and, in an unrelated
      patient, in spondyloperipheral dysplasia. The mouse ENU allele
      p.Tyr1391Ser lies at the corresponding position.
    evidence:
    - reference: PMID:17726487
      reference_title: "Czech dysplasia metatarsal type: another type II collagen disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The Y1391C mutation is located in the C-propeptide of the procollagen
        chain and has been reported before in a patient with the Torrance type of
        lethal platyspondylic skeletal dysplasia (PLSD-T).
      explanation: Describes the allele and its earlier report in PLSD-T.
  - name: c.4458_4460delCTT (p.Phe1486del)
    description: >-
      In-frame C-propeptide deletion, constitutional in a fetus with PLSD-T and
      somatic mosaic in the mother, who had mild spondyloperipheral dysplasia.
    evidence:
    - reference: PMID:22495950
      reference_title: "Spondyloperipheral dysplasia as the mosaic form of platyspondylic lethal skeletal dyplasia torrance type in mother and fetus with the same COL2A1 mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mutation analysis of COL2A1 identified a novel in-frame deletion
        c.4458_4460delCTT (p.Phe1486del) in the C-propeptide region of the
        molecule, confirming the clinical diagnosis.
      explanation: Describes the allele in the affected fetus.
  - name: c.3545G>A (p.Gly1182Asp)
    description: >-
      Triple-helical glycine substitution in exon 50 found in two sibs with a
      phenotype most consistent with PLSD-T, born to unaffected parents; the
      recurrence implies parental germline mosaicism.
    evidence:
    - reference: PMID:22711552
      reference_title: "Platyspondylic lethal dysplasia torrance type with a heterozygous mutation in the triple helical domain of COL2A1 in two sibs from phenotypically normal parents."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A COL2A1 analysis showed that the two sibs had a heterozygous mutation in
        the encoded triple helical region of COL2A1, c.3545G>A (p.Gly1182Asp) in
        exon 50.
      explanation: Describes the allele.
progression:
- phase: Prenatal and perinatal
  notes: >-
    Usually recognized in the fetus or at birth, and generally lethal in the
    perinatal period.
  evidence:
  - reference: PMID:15643621
    reference_title: "Dominant negative mutations in the C-propeptide of COL2A1 cause platyspondylic lethal skeletal dysplasia, torrance type, and define a novel subfamily within the type 2 collagenopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Generally a perinatally lethal disease, a few long-term survivors have been reported.
    explanation: Perinatal lethality is the usual course.
- phase: Survival to adulthood
  notes: >-
    Mild expressions are compatible with survival into adulthood, and survivors
    can transmit the disorder; their clinical and radiographic features overlap
    those of spondyloperipheral dysplasia.
  evidence:
  - reference: PMID:12961049
    reference_title: "Survival to adulthood and dominant inheritance of platyspondylic skeletal dysplasia, Torrance-Luton type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although lethality is increased in patients with this disorder, mild
      expressions of the genetic defect are compatible with survival into
      adulthood.
    explanation: Two families with adult survivors.
  - reference: PMID:15643621
    reference_title: "Dominant negative mutations in the C-propeptide of COL2A1 cause platyspondylic lethal skeletal dysplasia, torrance type, and define a novel subfamily within the type 2 collagenopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similar mutations have recently been found to be the cause of
      spondyloperipheral dysplasia, a non-lethal dominant disorder whose
      clinical and radiographical features overlap those of the rare long-term
      survivors with PLSD-T.
    explanation: Survivors overlap with spondyloperipheral dysplasia.
diagnosis:
- name: Skeletal radiography
  description: >-
    Postnatal or postmortem radiographs show platyspondyly with wafer-like
    vertebral bodies, short broad long bones, short ribs and hypoplastic lower
    ilia, a pattern distinct from classic thanatophoric dysplasia.
  diagnosis_term:
    preferred_term: skeletal radiography
    term:
      id: NCIT:C137876
      label: Bone Radiography
  evidence:
  - reference: PMID:6879209
    reference_title: "Torrance type of lethal neonatal short-limbed platyspondylic dwarfism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Roentgenographic features of this case, distinctly different from those of
      the classical thanatophoric dysplasia, are indistinguishable from the other
      three types of short-limbed platyspondylic dwarfism.
    explanation: >-
      Radiographs separate the Torrance type from classic thanatophoric
      dysplasia but not from the other platyspondylic variants.
- name: Postmortem radiography and cartilage histology
  description: >-
    Full postmortem radiography and chondro-osseous histology separate the
    Torrance type from thanatophoric dysplasia and the other platyspondylic
    variants, and inform recurrence counseling.
  diagnosis_term:
    preferred_term: autopsy with chondro-osseous histology
    term:
      id: NCIT:C25153
      label: Autopsy
  evidence:
  - reference: PMID:8298733
    reference_title: "Some variants of lethal neonatal short-limbed platyspondylic dysplasia: a radiological ultrasonographic, neuropathological and histopathological study of 22 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Documentation and classification by full (postmortem) radiography and
      osteochondrohistology is essential for two reasons.
    explanation: States the role of postmortem radiography and histology.
- name: COL2A1 sequencing
  description: >-
    Sequencing of COL2A1, including the C-propeptide exons, confirms the
    diagnosis; FGFR3 testing helps to exclude thanatophoric dysplasia and the
    San Diego type.
  diagnosis_term:

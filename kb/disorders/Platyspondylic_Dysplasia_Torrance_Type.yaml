name: Platyspondylic Dysplasia, Torrance Type
creation_date: "2026-11-12T18:20:00Z"
category: Mendelian
description: >-
  Platyspondylic dysplasia, Torrance type (PLSD-T; OMIM 151210) is a rare
  autosomal dominant type II collagenopathy caused by heterozygous COL2A1
  variants, nearly all of which lie in the region encoding the C-propeptide of
  the pro-alpha1(II) chain and arise de novo. It is a short-limbed skeletal
  dysplasia with platyspondyly (wafer-like vertebral bodies), severe limb
  shortening with short, broad and sometimes bowed long bones, metaphyseal
  cupping, short ribs and a narrow thorax, severe hypoplasia of the lower ilia
  and mild brachydactyly. Most affected fetuses and newborns die in the
  perinatal period, usually with thoracic and pulmonary hypoplasia, but a few
  mildly affected individuals have survived to adulthood and transmitted the
  disorder, and it forms a phenotypic continuum with spondyloperipheral
  dysplasia, which is caused by the same class of C-propeptide variants. The
  mutant chains are synthesized but assemble poorly into procollagen trimers;
  mouse models carrying orthologous C-propeptide missense changes show
  retention of the mutant protein in a dilated rough endoplasmic reticulum,
  endoplasmic reticulum stress and chondrocyte apoptosis in the growth plate.
  Cartilage histology shows slightly enlarged chondrocytes and
  hypercellularity, and large rough endoplasmic reticulum inclusions in
  chondrocytes.

pathophysiology:
- name: COL2A1 C-Propeptide Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous variant in the exons encoding the C-propeptide of the
    pro-alpha1(II) chain: missense changes, in-frame deletions, and nonsense or
    frameshift changes in the last exon that are expected to escape
    nonsense-mediated decay. The variant allele is translated into an altered
    chain rather than acting as a null allele, which is why the variants are
    considered dominant negative.
  conforms_to: "growth_plate_chondrocyte_failure#Cartilage Matrix, Signalling or Chondrocyte Biosynthetic Lesion"

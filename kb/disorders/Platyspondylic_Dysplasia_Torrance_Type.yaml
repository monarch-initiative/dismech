notes: >-
  Evidence base. The molecular literature is small: eight cases in one cohort
  (PMID:15643621), two earlier cases whose report (PMID:14729840) has no cached
  abstract or full text, a fetus with a mosaic mother (PMID:22495950), two
  sibs with a triple-helical variant (PMID:22711552), two survivor families
  without molecular confirmation of COL2A1 (PMID:10700704, PMID:12961049), and
  two Col2a1 mouse lines (PMID:21538020, PMID:26545783). The cellular mechanism
  (retention in the endoplasmic reticulum, endoplasmic reticulum stress and
  chondrocyte apoptosis) has been measured only in mice homozygous for the
  orthologous variant, so it is recorded with model-organism evidence and the
  mismatch with the heterozygous human disease is recorded as a discussion.
  Phenotype frequencies are taken from the Orphanet annotation table
  (ORPHA:85166).


  Scope. ClinGen's curation for this MONDO term includes patients diagnosed
  with the Luton type, which it treats as the milder end of the same spectrum,
  so Luton-type observations are included here and identified as such in the
  evidence explanations. The name keeps the eponym: no COL2A1-related name for
  this entity is established in MONDO, ClinGen, GeneReviews or OMIM.


  GeneReviews has no chapter for this disease. The Type II Collagen Disorders
  Overview (PMID:31021589) is an Overview-format chapter whose cached abstract
  is a statement of purpose, so it is tagged but is not the phenotype baseline.
  The phenotype baseline is the Orphanet record (ORPHA:85166) together with
  the case literature.


  Polyhydramnios, hydrops fetalis, cleft palate and the facial features are
  left without an incoming causal edge. They come from the Orphanet annotation
  table only, and no cited source describes how they arise in this disease.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous COL2A1 variants cause the disease. Most cases are sporadic
    and attributed to new dominant variants; transmission from a mildly
    affected surviving parent to a child has been documented, and recurrence
    in sibs of unaffected parents has been explained by parental germline or
    somatic mosaicism.

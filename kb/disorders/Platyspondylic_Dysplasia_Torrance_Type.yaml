  - reference: PMID:18678883
    reference_title: "The heterozygous disproportionate micromelia (dmm) mouse: morphological changes in fetal cartilage precede postnatal dwarfism and compared with lethal homozygotes can explain the mild phenotype."
    supports: SUPPORT
    directness: INDIRECT

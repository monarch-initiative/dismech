discussions:
- discussion_id: mismatch_plsdt_homozygous_mouse_models
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Chondrocyte Endoplasmic Reticulum Stress
  - pathophysiology#Growth Plate Chondrocyte Apoptosis
  prompt: >-
    Does endoplasmic reticulum stress-mediated chondrocyte apoptosis, shown in
    mice homozygous for Col2a1 C-propeptide variants, operate in heterozygous
    human PLSD-T?
  rationale: >-
    Both mouse lines reproduce a lethal PLSD-T-like dysplasia only as
    homozygotes, while the human disease is caused by one variant allele, and
    heterozygous mice are only mildly small. The human cartilage evidence is a
    histological description (enlarged chondrocytes, hypercellularity, rough
    endoplasmic reticulum inclusions) without measurement of stress markers or
    apoptosis, so the dose relationship between mutant chain load, ER stress and
    the human phenotype is untested.
  evidence:
  - reference: PMID:21538020
    reference_title: "ENU-induced missense mutation in the C-propeptide coding region of Col2a1 creates a mouse model of platyspondylic lethal skeletal dysplasia, Torrance type."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The phenotype was inherited as a semidominant trait. The heterozygotes were
      mildly but significantly smaller than wild-type mice.
    explanation: Heterozygous mice do not reproduce the human disease.
- discussion_id: controversy_plsdt_variant_domain
  kind: CONTROVERSY
  attaches_to:
  - pathophysiology#COL2A1 C-Propeptide Variant
  prompt: >-
    Is a PLSD-T phenotype specific to C-propeptide variants, or can
    triple-helical COL2A1 variants produce it?
  rationale: >-
    The cohort data tie PLSD-T to the C-propeptide, and the subfamily is
    defined by that domain, but two sibs with a phenotype most consistent with
    PLSD-T carried a triple-helical glycine substitution. Whether this is a
    phenocopy within the lethal type II collagenopathies or evidence that the
    phenotype is not domain-specific has not been settled.
  evidence:
  - reference: PMID:22711552
    reference_title: "Platyspondylic lethal dysplasia torrance type with a heterozygous mutation in the triple helical domain of COL2A1 in two sibs from phenotypically normal parents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, our observation suggests that the phenotype is also caused by a
      COL2A1 mutation in the encoded C-terminal triple helical region.
    explanation: The opposing observation.

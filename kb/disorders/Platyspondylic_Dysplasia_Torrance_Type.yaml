  evidence:
  - reference: PMID:15643621
    reference_title: "Dominant negative mutations in the C-propeptide of COL2A1 cause platyspondylic lethal skeletal dysplasia, torrance type, and define a novel subfamily within the type 2 collagenopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We studied eight additional cases of PLSD-T and found that all had
      mutations in the C-propeptide domain of COL2A1. The mutational spectrum
      includes missense, stop codon and frameshift mutations. All non-sense
      mutations were located in the last exon, where they would escape
      non-sense-mediated RNA-decay.
    explanation: Eight cases, all with C-propeptide variants, and the variant classes.
  - reference: PMID:15643621
    reference_title: "Dominant negative mutations in the C-propeptide of COL2A1 cause platyspondylic lethal skeletal dysplasia, torrance type, and define a novel subfamily within the type 2 collagenopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that PLSD-T is caused by mutations in the C-propeptide domain
      of COL2A1, which lead to biosynthesis of an altered collagen chain (as
      opposed to a null allele).
    explanation: The variants produce an altered chain, not a null allele.
  - reference: PMID:22711552
    reference_title: "Platyspondylic lethal dysplasia torrance type with a heterozygous mutation in the triple helical domain of COL2A1 in two sibs from phenotypically normal parents."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PLSD-T has been shown to arise from a heterozygous dominant negative COL2A1
      mutation in the encoded C-propeptide region.
    explanation: >-
      Restates the established dominant-negative C-propeptide model; the
      dominant-negative label is an inference from the altered-chain finding,
      not a measured interaction in patient cells.
  - reference: CGGV:assertion_a4c42c43-7b6a-4456-aeb1-7a00302a468b-2021-02-01T050000.000Z
    reference_title: "COL2A1 / platyspondylic dysplasia, Torrance type (Definitive)"
    supports: SUPPORT

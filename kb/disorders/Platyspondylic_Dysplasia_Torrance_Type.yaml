    snippet: >-
      Mutation analysis of COL2A1 identified a novel in-frame deletion
      c.4458_4460delCTT (p.Phe1486del) in the C-propeptide region of the
      molecule, confirming the clinical diagnosis.
    explanation: Molecular confirmation of a prenatal clinical diagnosis.
treatments:
- name: Genetic counseling and evaluation of parents
  description: >-
    No disease-specific therapy exists. Counseling addresses recurrence risk,
    which is low for a de novo variant but raised by parental germline or
    somatic mosaicism and by a mildly affected parent; the parents of an
    affected fetus should be examined.
  treatment_term:
    preferred_term: Genetic Counseling

discussions:
- discussion_id: ccdc62_genotype_specific_art_outcomes
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#ICSI with artificial oocyte activation
  prompt: Do ICSI and calcium-ionophore artificial oocyte activation give the same fertilisation and live-birth
    rates in CCDC62-biallelic men as in globozoospermia overall?
  rationale: The management evidence (ICSI with calcium-ionophore AOA) comes from general round-headed-sperm
    and globozoospermia cohorts, not from CCDC62-genotyped patients. No assisted-reproduction outcome
    has been reported for a patient with biallelic CCDC62 variants, so whether the CCDC62 form behaves
    like globozoospermia at large is unknown.

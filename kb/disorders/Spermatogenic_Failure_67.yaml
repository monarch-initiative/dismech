    reference_title: "Exome sequencing reveals novel causes as well as new candidate genes for human globozoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The premature stop codon is located before the missense variant and is predicted to cause nonsense-mediated decay resulting in an absence of protein."
    explanation: The proband's variant is predicted to abolish CCDC62.
  - reference: PMID:28339613
    reference_title: "A nonsense mutation in Ccdc62 gene is responsible for spermiogenesis defects and male infertility in repro29/repro29 mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CCDC62 was expressed in the cytoplasm and the developing acrosome in the spematids of mouse testis, and was specifically localized at the acrosome in mature sperm"
    explanation: CCDC62 is an acrosomal protein of spermatids and sperm, placing its loss at the acrosome.
- name: Defective Acrosome Formation
  description: >-
    Without CCDC62 the acrosome is not built or maintained. In repro29 mice
    the acrosome fragments during its maturation phase, and sperm show
    abnormal head bending with cytoplasm retained around the head. CCDC62
    colocalizes and interacts with GOPC, which may be how it contributes to
    acrosome formation. In the proband the acrosome was not examined directly;
    the defect is inferred from his globozoospermia.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: spermatid
    term:
      id: CL:0000018
      label: spermatid
  biological_processes:
  - preferred_term: acrosome assembly
    modifier: DECREASED
    term:
      id: GO:0001675
      label: acrosome assembly
  downstream:
  - target: Globozoospermia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31985809
    reference_title: "Exome sequencing reveals novel causes as well as new candidate genes for human globozoospermia."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of Ccdc62 in mice leads to fragmentation of the acrosome in the maturation phase of acrosome development and abnormal bending and cytoplasmic retention around the sperm head"
    explanation: >-
      The human study's discussion summarizing the mouse finding that Ccdc62
      loss disrupts acrosome development; it is the authors' basis for linking
      the proband's variant to his globozoospermia.
  - reference: PMID:28339613
    reference_title: "A nonsense mutation in Ccdc62 gene is responsible for spermiogenesis defects and male infertility in repro29/repro29 mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "intracellular colocalization and interaction of CCDC62 and Golgi-associated PDZ and coiled-coil motif-containing protein may be important for acrosome formation"
    explanation: Proposes the GOPC interaction as the route by which CCDC62 supports acrosome formation.

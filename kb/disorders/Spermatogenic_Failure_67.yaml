name: Spermatogenic Failure 67
creation_date: '2026-10-23T00:00:00Z'
category: Mendelian
synonyms:
- SPGF67
- spermatogenic failure 67
- CCDC62-related globozoospermia
- CCDC62-related male infertility
description: 'Spermatogenic failure 67 (SPGF67) is autosomal recessive male infertility attributed to
  biallelic loss-of-function variants in CCDC62 (coiled-coil domain containing 62). CCDC62 is expressed
  most highly in the testis, where it localises to the cytoplasm and the developing acrosome of spermatids
  and to the acrosome of mature sperm. It interacts with GOPC (Golgi-associated PDZ and coiled-coil motif-containing
  protein), and this interaction is implicated in acrosome formation.

  The human phenotype is globozoospermia: round-headed sperm that lack a normal acrosome, causing infertility
  (poor motility is documented in the mouse model, not in the reported human proband). The gene-disease
  link was established in a repro29 ENU-mutant mouse and a CRISPR Ccdc62 knockout, both of which are infertile
  with deformed, poorly motile sperm; a single human patient carrying a homozygous CCDC62 nonsense variant
  was then identified in an exome-sequencing study of unexplained globozoospermia. Human evidence therefore
  rests on one proband with strong model-organism support, and the authors call for further functional
  follow-up.'

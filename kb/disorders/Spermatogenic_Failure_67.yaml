- name: Impaired Acrosome Biogenesis
  description: Loss of CCDC62 disrupts formation of the acrosome during spermiogenesis, producing malformed
    spermatids. In the mouse the acrosome fragments during the maturation phase of its development, and
    sperm show abnormal head bending with cytoplasm retained around the head. The acrosome is the Golgi-derived
    cap over the sperm head; its failure yields round-headed (globozoospermic) sperm.

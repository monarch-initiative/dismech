- name: Autosomal recessive
  description: >-
    The proband, from a consanguineous Lebanese family, was homozygous for
    CCDC62 c.442C>T (p.Gln148*) inside a stretch of homozygosity of about
    9 Mb. Parental DNA was not studied.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance

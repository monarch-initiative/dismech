notes: >-
  MONDO cross-references this disease as OMIM 619803 and records CCDC62
  (HGNC:30723) as the causal gene. The human gene-disease association rests on
  a single proband with a homozygous CCDC62 nonsense variant, one of two
  unrelated globozoospermia patients resolved by exome sequencing in
  PMID:31985809 (the other carried a ZPBP variant). The strongest evidence is
  from mouse: the repro29 ENU line and an independent CRISPR knockout both
  reproduce the infertility, linked by complementation (PMID:28339613). No
  ClinGen gene-disease validity classification exists for this pair. No
  GeneReviews chapter names this disease, its gene, or its synonyms (checked
  against the committed Bookshelf index).

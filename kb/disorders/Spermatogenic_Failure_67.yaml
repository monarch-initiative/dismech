    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant is located in a stretch of homozygosity of approximately 9 Mb on chromosome 12"
    explanation: A homozygous variant inside a run of homozygosity in a consanguineous family fits recessive inheritance.
pathophysiology:
- name: CCDC62 Loss of Function
  description: >-
    The homozygous p.Gln148* nonsense variant lies upstream of the missense
    variant on the same allele and is predicted to trigger nonsense-mediated
    decay, so no CCDC62 protein is expected in the proband's germ cells.
  biological_scale: MOLECULAR

name: Spermatogenic Failure 67
creation_date: "2026-10-23T12:00:00Z"
category: Mendelian
synonyms:
- SPGF67
- spermatogenic failure 67
- CCDC62-related globozoospermia
description: >-
  Spermatogenic failure 67 (SPGF67) is autosomal recessive male infertility
  with globozoospermia, the production of round-headed sperm that lack an
  acrosome, caused by biallelic loss of CCDC62. CCDC62 is a testis-enriched
  coiled-coil protein that sits in the developing acrosome of spermatids and
  in the acrosome of mature sperm, and it interacts with GOPC, a Golgi protein
  whose loss also causes globozoospermia in mice. The gene-disease link rests
  on one reported man, of Lebanese origin from a consanguineous family, who
  was homozygous for the nonsense variant c.442C>T (p.Gln148*), predicted to
  cause nonsense-mediated decay, within a run of homozygosity on chromosome
  12. No sperm or testis material from him was available, so the human
  mechanism is inferred from the repro29 mouse, in which a Ccdc62 nonsense
  allele fragments the acrosome during its maturation phase and leaves males
  infertile with deformed, poorly motile sperm.
disease_term:
  preferred_term: spermatogenic failure 67
  term:
    id: MONDO:0030718
    label: spermatogenic failure 67
parents:
- Spermatogenic Failure
- Genetic Disease
notes: >-
  The human evidence is a single proband (patient GL-13 in PMID:31985809),
  who also carried homozygous variants of uncertain significance in CCDC62
  (p.His283Tyr), CCDC73, NRIP3 and ATP8A2; the authors judged the CCDC62
  nonsense variant the most likely cause. His globozoospermia type (complete
  or partial) and ICSI outcome were not reported. A later cohort of 69 men
  with globozoospermia (PMID:33108537) found no CCDC62 variant among 23
  DPY19L2-negative exomes. No GeneReviews chapter, Orphanet record or ClinGen
  gene-disease validity curation covers CCDC62, so no validity tier is
  recorded.

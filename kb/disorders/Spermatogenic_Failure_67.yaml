    snippet: "After pre-screening 16 men for mutations in known globozoospermia genes DPY19L2 and SPATA16, exome sequencing was performed in 15 males with globozoospermia or acrosomal hypoplasia of unknown aetiology."
    explanation: Exome sequencing after exclusion of the common genes identified the variant.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    Sperm lacking an acrosome cannot undergo the acrosome reaction, so
    assisted reproduction by ICSI, often with assisted oocyte activation, is
    the route to fertility. No ICSI outcome has been reported for a CCDC62 patient; the
    supporting evidence is a review of globozoospermia of any cause.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: intracytoplasmic sperm injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Globozoospermia
    description: Direct injection of a sperm into the oocyte bypasses the acrosome reaction the sperm cannot perform.
  evidence:
  - reference: PMID:36047070
    reference_title: "Globozoospermia: A Case Report and Systematic Review of Literature."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "In particular, intracytoplasmic sperm injection with assisted oocyte activation or intracytoplasmic morphologically-selected sperm injection appears to be associated with a higher success rate."
    explanation: >-
      Review of globozoospermia across genetic causes; applied to SPGF67 by
      inference, since no CCDC62-specific treatment outcome is published.

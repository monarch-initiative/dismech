genetic:
- name: CCDC62
  association: Causal
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: CCDC62
    term:
      id: hgnc:30723
      label: CCDC62
  notes: >-
    One reported allele: homozygous c.442C>T (p.Gln148*), in cis with
    p.His283Tyr, found by exome sequencing of 15 men with globozoospermia or
    acrosomal hypoplasia of unknown cause (PMID:31985809). A common
    CCDC62-region polymorphism (rs12817488) has been studied as a Parkinson
    disease risk locus; that is a separate, unrelated association.
  evidence:
  - reference: PMID:31985809
    reference_title: "Exome sequencing reveals novel causes as well as new candidate genes for human globozoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The analysis revealed homozygous nonsense mutations in ZPBP and CCDC62 in two unrelated patients"
    explanation: Gene-disease report identifying the causal CCDC62 variant.
animal_models:
- name: repro29 Ccdc62 nonsense mouse
  species: Mouse
  genotype: Ccdc62 repro29/repro29 (exon 6 nonsense)
  publication: PMID:28339613
  description: >-
    ENU-induced repro29 males carry a premature stop codon in exon 6 of Ccdc62
    and are infertile with deformed, poorly motile sperm. Complementation with
    a CRISPR-Cas9 Ccdc62 null allele confirmed that the Ccdc62 mutation causes
    the infertility.
  modeled_mechanisms:
  - target: Defective Acrosome Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      A truncating Ccdc62 allele that disrupts acrosome development and male
      fertility, matching the predicted null human allele.
    limitations: >-
      Whether the human proband's sperm show the same acrosome fragmentation
      is unknown, because no sperm or testis material was available, so the
      match to the human mechanism rests on gene and phenotype class rather
      than on a shared cellular observation.
    evidence:
    - reference: PMID:28339613
      reference_title: "A nonsense mutation in Ccdc62 gene is responsible for spermiogenesis defects and male infertility in repro29/repro29 mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Male repro29/repro29 mice generated by the Reproductive Genomics Program at the Jackson Laboratory were infertile with deformed sperm and poor motility."
      explanation: The mouse reproduces the infertile, abnormal-sperm phenotype.
  evidence:
  - reference: PMID:28339613
    reference_title: "A nonsense mutation in Ccdc62 gene is responsible for spermiogenesis defects and male infertility in repro29/repro29 mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The complementation analysis by mating repro29/+ mice with Ccdc62 -/- mice (generated by CRISPR-Cas9 strategy) further provided genetic proof that the infertility of repro29/repro29 mice was caused by Ccdc62 mutation."
    explanation: Genetic proof that Ccdc62 loss causes the mouse infertility.

treatments:
- name: ICSI with artificial oocyte activation
  description: There is no therapy that restores spermatogenesis. Acrosome-deficient (globozoospermic)
    sperm fail to fertilise oocytes naturally and often fail to activate the oocyte even after intracytoplasmic
    sperm injection (ICSI), because round-headed sperm lack normal oocyte-activating capacity. Artificial
    oocyte activation with a calcium ionophore is used to overcome this fertilisation failure, and a healthy
    live birth has been reported after calcium-ionophore activation of round-headed sperm. No ICSI/AOA
    outcome has been reported for a CCDC62-genotyped patient; the efficacy data come from general round-headed-sperm/globozoospermia
    populations, so this management is applied at the phenotype level. The globozoospermia case report
    (PMID:32318024) used a calcium ionophore without naming the specific compound; ionomycin is named
    here from the separate ionomycin-AOA study (PMID:41462321).
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: ICSI with calcium-ionophore artificial oocyte activation
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
    therapeutic_agent:
    - preferred_term: ionomycin (calcium ionophore for oocyte activation)
      term:
        id: CHEBI:63954
        label: ionomycin
  target_mechanisms:
  - target: Impaired Acrosome Biogenesis
    treatment_effect: BYPASSES
    description: Intracytoplasmic sperm injection combined with calcium-ionophore artificial oocyte activation
      bypasses the acrosome-reaction and oocyte-activation defects of acrosome-less round-headed spermatozoa.
    evidence:
    - reference: PMID:32318024
      reference_title: Comparison of Human Oocyte Activation Between Round-Headed Sperm Injection Followed
        by Calcium Ionophore Treatment and Normal Sperm Injection in a Patient With Globozoospermia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: These results indicate that calcium ionophore treatment can assist oocyte activation in
        patients with round-headed sperm, but its efficiency to activate oocytes is lower than that induced
        by a normal sperm injection.
      explanation: Demonstrates that calcium ionophore treatment with ICSI bypasses the fertilisation
        and oocyte-activation failure of round-headed acrosome-deficient sperm.
  evidence:
  - reference: PMID:32318024
    reference_title: Comparison of Human Oocyte Activation Between Round-Headed Sperm Injection Followed
      by Calcium Ionophore Treatment and Normal Sperm Injection in a Patient With Globozoospermia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These results indicate that calcium ionophore treatment can assist oocyte activation in patients
      with round-headed sperm, but its efficiency to activate oocytes is lower than that induced by a
      normal sperm injection.
    explanation: Calcium-ionophore AOA assists fertilisation of oocytes by globozoospermic sperm, with
      lower efficiency than normal sperm.
  - reference: PMID:32318024
    reference_title: Comparison of Human Oocyte Activation Between Round-Headed Sperm Injection Followed
      by Calcium Ionophore Treatment and Normal Sperm Injection in a Patient With Globozoospermia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A euploid blastocyst resulted from round-headed sperm injection was transferred, and a healthy
      baby was delivered.
    explanation: A live birth was achieved for a globozoospermia patient via ICSI with calcium-ionophore
      activation.
  - reference: PMID:41462321
    reference_title: 'The efficacy of ionomycin - induced artificial oocyte activation in preventing fertilization
      failure in an ICSI cycle: an eight - year retrospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Regarding fertilization, AOA may effectively treat patients with previous ICSI-failure, severe
      teratozoospermia, and sperm-immotile.
    explanation: An ionomycin-AOA retrospective study; globozoospermia is a severe teratozoospermia, so
      this supports AOA efficacy for fertilisation in the broader ICSI-failure population, not a CCDC62-genotyped
      cohort.

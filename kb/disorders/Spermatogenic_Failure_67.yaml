  notes: 'Patient GL-13 carried a homozygous nonsense variant c.442C>T (p.Gln148*) in CCDC62, in a ~9
    Mb region of homozygosity, identified by exome sequencing of 15 men with unexplained globozoospermia
    (PMID:31985809). He was of Lebanese origin from a consanguineous family, with one infertile male cousin,
    and also carried homozygous variants of uncertain significance in CCDC73, NRIP3 and ATP8A2, which
    the authors judged unlikely to be causative. His globozoospermia type and any ICSI outcome were not
    reported. The premature stop precedes a second homozygous missense variant (p.His283Tyr) and is predicted
    to trigger nonsense-mediated decay, so the authors treat the nonsense allele as the likely cause.
    No patient sperm or testis material was available for functional validation. The gene-disease relationship
    is otherwise supported by mouse genetics: the repro29 ENU nonsense allele and an independent CRISPR
    knockout, joined by complementation (PMID:28339613). Human evidence is limited to this single proband;
    no ClinGen gene-disease validity classification exists for this pair. A common CCDC62-region polymorphism
    (rs12817488) has been studied as a Parkinson disease risk locus; that is a separate, unrelated association.'
  evidence:
  - reference: PMID:31985809
    reference_title: Exome sequencing reveals novel causes as well as new candidate genes for human globozoospermia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The analysis revealed homozygous nonsense mutations in ZPBP and CCDC62 in two unrelated patients
    explanation: Primary human gene-disease report for CCDC62 in globozoospermia.
  - reference: PMID:31985809
    reference_title: Exome sequencing reveals novel causes as well as new candidate genes for human globozoospermia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The pathogenicity classification and function of the gene make the homozygous nonsense variant
      in CCDC62 the most likely cause of globozoospermia in this patient.
    explanation: The authors' conclusion that the CCDC62 nonsense variant is the likely cause in the proband.
  - reference: PMID:31985809
    reference_title: Exome sequencing reveals novel causes as well as new candidate genes for human globozoospermia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Unfortunately, no sperm or testis material of the patient with the CCDC62 mutation was available
      to perform further functional studies.
    explanation: Records that the human association was not functionally validated, bounding the strength
      of the single-proband evidence.
  - reference: PMID:33108537
    reference_title: Genetic analyses of a large cohort of infertile patients with globozoospermia, DPY19L2
      still the main actor, GGN confirmed as a guest player.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: searching for deleterious variants in the nine other genes described to be associated with
      globozoospermia in human (C2CD6, C7orf61, CCDC62, CCIN, DNAH17, GGN, PICK1, SPATA16, and ZPBP1)
    explanation: Establishes CCDC62 as a recognised human globozoospermia gene; this cohort screened it
      but found no new CCDC62 case, so it corroborates the gene's standing rather than adding a proband.

discussions:
- discussion_id: gap_mls_apoptosis_necrosis_switch
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the tissue destruction in MLS actually caused by a switch from apoptosis to
    necrosis, or by the OXPHOS deficit alone?
  attaches_to:
  - "pathophysiology#Diversion of Cell Death Toward Necrosis"
  rationale: >-
    The apoptosis-to-necrosis switch is the most satisfying explanation available
    for why loss of a housekeeping mitochondrial enzyme produces sharply demarcated,
    destructive linear skin lesions rather than diffuse hypofunction. But it has
    been a hypothesis since 2006 and remains one: the original authors write "We
    hypothesize" and "may push", and no experiment has demonstrated the necrotic
    switch in patient tissue. The alternative, that the OXPHOS deficit alone
    accounts for the phenotype in tissues that cannot tolerate it, is equally
    consistent with the published observations and is what the 2014 series
    emphasises. Because this entry's central causal edge rests on the distinction,
    it is curated as PARTIAL evidence on an indirect edge rather than as
    established mechanism.
  proposed_experiments:
  - experiment_id: exp_mls_death_mode_in_patient_skin
    name: Cell-death mode profiling at the margin of linear skin lesions
    description: >-
      Apply apoptosis- and necrosis-discriminating markers to skin biopsy material
      taken across the boundary of an active linear lesion, correlated with the
      X-inactivation status of the cells, to determine whether mutant-expressing
      cells die necrotically.
  - experiment_id: exp_mls_oxphos_vs_apoptosis_separation
    name: Genetic separation of the OXPHOS and apoptotic arms
    description: >-
      In an HCCS-deficient cell model, restore cytochrome c variants that support
      electron transport but not apoptosome formation, and vice versa, to test which
      arm is required to prevent the cellular phenotype.
- discussion_id: gap_mls_ocular_tissue_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why are the eye and skin selectively affected when HCCS is required by every
    aerobic cell?
  attaches_to:
  - "pathophysiology#Mosaic Tissue Loss Governed by X-Inactivation"
  rationale: >-
    Holocytochrome c is needed for oxidative phosphorylation in all tissues, yet the
    phenotype is dominated by ocular and cutaneous defects, with cardiac and CNS
    involvement less consistent and most other organs spared. The published
    explanation is that embryonic cell types differ in their ability to cope with an
    OXPHOS defect, but that is a restatement rather than a mechanism: it does not
    say what makes the developing eye and the facial skin the least tolerant. The
    developmental timing of X-inactivation relative to the specification of these
    tissues is a candidate that has not been tested.
  proposed_experiments:
  - experiment_id: exp_mls_tissue_oxphos_dependence_profiling
    name: Comparative OXPHOS dependence across embryonic tissue lineages
    description: >-
      Measure baseline oxidative-phosphorylation dependence and apoptotic threshold
      across the embryonic lineages that give rise to the affected and spared
      tissues, to test whether the affected lineages are quantitatively less
      tolerant.
notes: >-
  Scope. This entry is the HCCS-anchored MLS1 entity only (MONDO:0024552). MLS is
  genetically heterogeneous: a molecular diagnosis can also be made in NDUFB11
  (MLS2) or COX7B (MLS3), which are distinct MONDO terms and out of scope here.
  This matters for anyone reading the source literature, because the GeneReviews
  chapter and much of the clinical literature describe MLS as a single syndrome
  across all three genes, and a deep-research report generated for this entry mixed
  NDUFB11 and COX7B material in heavily (the NEC preflight flagged NDUFB11 at 54%
  of HCCS mentions). Every mechanistic claim curated here is anchored on an
  HCCS-specific source; the GeneReviews chapter is cited only for gene-agnostic
  clinical description and management.

  Relationship to Histiocytoid_Cardiomyopathy. That entry records that NDUFB11 is
  allelic with MLS syndrome and deliberately keeps the two separate. This entry
  preserves that boundary from the other side: the NDUFB11 arm belongs to MLS2, not
  here.

  The eponym understates the eye findings. Microphthalmia/anophthalmia and corneal
  involvement were present in all six patients of the largest series, whereas the
  linear skin defects that name the syndrome were present in four of six, and
  molecularly confirmed patients exist with eye findings and no skin defects. The
  frequency bands reflect the counted fractions rather than the syndrome name.

  No module conformance declared. There is no mitochondrial-OXPHOS or
  apoptosis-failure module in kb/modules/ at present, and the central causal step
  here is a proposed apoptosis-to-necrosis switch rather than an established
  mechanism, so declaring conformance to anything would overstate what is known.

name: Linear Skin Defects with Multiple Congenital Anomalies 1
creation_date: "2026-08-24T14:30:00Z"
description: >-
  Linear skin defects with multiple congenital anomalies 1 (MLS1, also called MLS
  or MIDAS syndrome) is an X-linked dominant, male-lethal disorder caused by
  segmental Xp22 monosomy or intragenic HCCS mutation. HCCS encodes the
  mitochondrial holocytochrome c-type synthase, the heme lyase that covalently
  attaches heme to apocytochrome c. Because cytochrome c serves both oxidative
  phosphorylation and apoptosis, HCCS loss is proposed to disturb both, with cell
  death diverted from apoptosis toward necrosis. Affected females show
  microphthalmia or anophthalmia with corneal involvement, and linear skin defects
  of the face and neck that heal with age. Severity is governed by X-inactivation
  and ranges from clinically normal carriers to a neonatal lethal form.
synonyms:
- MLS syndrome
- MLS1
- microphthalmia with linear skin defects syndrome
- MIDAS syndrome
- microphthalmia, dermal aplasia, and sclerocornea
- HCCS-related microphthalmia with linear skin defects

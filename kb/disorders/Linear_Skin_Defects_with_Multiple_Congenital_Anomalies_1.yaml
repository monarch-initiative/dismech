prevalence:
- population: Global published literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate exists. Ascertainment is complicated by the
    fact that clinically normal HCCS-mutation carriers occur within affected
    families, so the mutation is more frequent than the recognised phenotype.
  evidence:
  - reference: PMID:24735900
    reference_title: "Clinical spectrum of females with HCCS mutation: from no clinical signs to a neonatal lethal form of the microphthalmia with linear skin defects (MLS) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, no obvious clinical sign was observed in three female carriers who
      were relatives of one patient.
    explanation: >-
      Documents asymptomatic carriers, which is why case counts understate carrier
      frequency.
pathophysiology:
- name: HCCS Holocytochrome c-Type Synthase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Segmental Xp22 monosomy or intragenic HCCS mutation removes or inactivates the
    mitochondrial heme lyase that covalently attaches the prosthetic heme group to
    apocytochrome c. Patient alleles fail to complement a yeast strain lacking the
    HCCS orthologue Cyc3p, and separate alleles fail by two different routes: a
    missense allele reaches mitochondria but is catalytically inactive, while a
    C-terminal truncation fails to be sorted to mitochondria at all.
  genes:
  - preferred_term: HCCS
    term:
      id: hgnc:4837
      label: HCCS
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  evidence:
  - reference: PMID:17033964
    reference_title: Mutations of the mitochondrial holocytochrome c-type synthase in X-linked dominant microphthalmia with linear skin defects syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      HCCS encodes the mitochondrial holocytochrome c-type synthase that functions
      as heme lyase by covalently adding the prosthetic heme group to both
      apocytochrome c and c(1).
    explanation: >-
      States the enzyme's biochemical function. Classified OTHER rather than
      HUMAN_CLINICAL because the sentence is background biochemistry, not an
      observation made in the patients this paper reports.
  - reference: PMID:17033964
    reference_title: Mutations of the mitochondrial holocytochrome c-type synthase in X-linked dominant microphthalmia with linear skin defects syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional analysis demonstrates that both mutant proteins (R217C and Delta
      197-268) were unable to complement a Saccharomyces cerevisiae mutant
      deficient for the HCCS orthologue Cyc3p, in contrast to wild-type HCCS.
    explanation: >-
      Yeast complementation establishes loss of function for the patient alleles.
  - reference: PMID:17033964
    reference_title: Mutations of the mitochondrial holocytochrome c-type synthase in X-linked dominant microphthalmia with linear skin defects syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, ectopically expressed HCCS wild-type and the R217C mutant protein
      are targeted to mitochondria in CHO-K1 cells, whereas the C-terminal-truncated
      Delta 197-268 mutant failed to be sorted to mitochondria.
    explanation: >-
      Distinguishes the two molecular routes to loss of function: catalytic
      inactivation versus mistargeting.
  - reference: PMID:11827457
    reference_title: Complementation of a yeast CYC3 deficiency identifies an X-linked mammalian activator of apocytochrome c.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The human protein was able to complement the yeast Cyc3p (but not Cyt2p)
      deficiency, which indicates that it specifically activates apocytochrome c.
    explanation: >-
      Establishes substrate specificity for apocytochrome c, distinguishing HCCS
      from the cytochrome c1 lyase.
  downstream:
  - target: Deficient Holocytochrome c Maturation
    description: >-
      Without heme lyase activity, apocytochrome c is not converted to
      holocytochrome c, so the mature electron carrier is not produced.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17033964
      reference_title: Mutations of the mitochondrial holocytochrome c-type synthase in X-linked dominant microphthalmia with linear skin defects syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Cytochrome c, the final product of holocytochrome c-type synthase activity,
        is implicated in both oxidative phosphorylation (OXPHOS) and apoptosis.
      explanation: >-
        Identifies holocytochrome c as the direct product lost, and flags its dual
        role, which is what makes the downstream consequences bifurcate.
- name: Deficient Holocytochrome c Maturation
  biological_scale: CELLULAR
  description: >-
    Loss of mature cytochrome c has two consequences because the protein has two
    jobs. As the mobile electron carrier between complexes III and IV it is
    required for oxidative phosphorylation. As the apoptosome cofactor released
    from mitochondria it is required for the intrinsic apoptotic pathway. HCCS
    deficiency therefore compromises energy metabolism and programmed cell death
    simultaneously.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  - preferred_term: apoptotic process
    modifier: DECREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:24735900
    reference_title: "Clinical spectrum of females with HCCS mutation: from no clinical signs to a neonatal lethal form of the microphthalmia with linear skin defects (MLS) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HCCS encodes the holocytochrome c-type synthase involved in mitochondrial
      oxidative phosphorylation (OXPHOS) and programmed cell death.
    explanation: >-
      States the dual functional role that this node models.
  - reference: PMID:17893649
    reference_title: "HCCS loss-of-function missense mutation in a female with bilateral microphthalmia and sclerocornea: a novel gene for severe ocular malformations?"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, expression of HCCS E159K did not complement respiratory growth of
      the CYC3-deficient yeast strain B-8025, while wild-type HCCS and the yeast
      heme lyase Cyc3p could rescue growth on nonfermentable carbon sources.
    explanation: >-
      A respiratory-growth assay confirming the OXPHOS arm is genuinely
      compromised by a patient allele.
  downstream:
  - target: Diversion of Cell Death Toward Necrosis
    description: >-
      Cells unable to complete cytochrome c-mediated apoptosis are proposed to die
      by necrosis instead, which is destructive to surrounding tissue in a way
      apoptosis is not.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:17033964
      reference_title: Mutations of the mitochondrial holocytochrome c-type synthase in X-linked dominant microphthalmia with linear skin defects syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We hypothesize that the inability of HCCS-deficient cells to undergo
        cytochrome c-mediated apoptosis may push cell death toward necrosis that
        gives rise to severe deterioration of the affected tissues.
      explanation: >-
        The authors state this as a hypothesis ("We hypothesize", "may push"), so
        it is curated as PARTIAL on an indirect edge rather than as an established
        mechanism.
  - target: Mosaic Tissue Loss Governed by X-Inactivation
    description: >-
      In heterozygous females, random X-inactivation produces a mosaic of cells
      expressing the mutant allele, and the resulting patchy OXPHOS and cell-death
      defect determines which tissues are affected and how severely.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24735900
      reference_title: "Clinical spectrum of females with HCCS mutation: from no clinical signs to a neonatal lethal form of the microphthalmia with linear skin defects (MLS) syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All females had a completely (>98:2) or slightly skewed (82:18) XCI pattern.
      explanation: >-
        Measured X-inactivation skewing in every affected female in the series.
- name: Diversion of Cell Death Toward Necrosis
  biological_scale: CELLULAR
  description: >-
    A proposed rather than demonstrated step. Cytochrome c-deficient cells cannot
    assemble the apoptosome, and the hypothesis is that they die necrotically
    instead, causing tissue destruction rather than orderly removal. This is the
    mechanistically attractive explanation for why a housekeeping mitochondrial
    enzyme produces destructive, sharply demarcated linear skin lesions, but no
    experiment has demonstrated the necrotic switch in patient tissue.
  biological_processes:
  - preferred_term: apoptotic process
    modifier: DECREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:17033964
    reference_title: Mutations of the mitochondrial holocytochrome c-type synthase in X-linked dominant microphthalmia with linear skin defects syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We hypothesize that the inability of HCCS-deficient cells to undergo
      cytochrome c-mediated apoptosis may push cell death toward necrosis that
      gives rise to severe deterioration of the affected tissues.
    explanation: >-
      The hypothesis in the authors' own words; curated as PARTIAL because it is
      explicitly framed as one.
  downstream:
  - target: Mosaic Tissue Loss Governed by X-Inactivation
    description: >-
      Necrotic loss of mutant-expressing cell populations produces the
      characteristic tissue defects.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Mosaic Tissue Loss Governed by X-Inactivation
  biological_scale: ORGANISM
  description: >-
    The clinical phenotype is set by the interaction of the cellular defect with
    X-inactivation and somatic mosaicism, plus the differing ability of embryonic
    cell types to tolerate an OXPHOS defect. This produces both the tissue
    selectivity (eye and skin above all) and a spectrum from clinically normal
    carriers to neonatal lethality, and explains the sharply demarcated,
    developmentally patterned linear skin lesions.
  evidence:
  - reference: PMID:24735900
    reference_title: "Clinical spectrum of females with HCCS mutation: from no clinical signs to a neonatal lethal form of the microphthalmia with linear skin defects (MLS) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Somatic mosaicism and the different ability of embryonic cells to cope with an
      OXPHOS defect and/or enhanced cell death upon HCCS deficiency likely underlie
      the great variability in phenotypes.
    explanation: >-
      The authors' account of what generates the phenotypic spectrum.
  - reference: PMID:24735900
    reference_title: "Clinical spectrum of females with HCCS mutation: from no clinical signs to a neonatal lethal form of the microphthalmia with linear skin defects (MLS) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings showed a wide phenotypic spectrum ranging from asymptomatic
      females with an HCCS mutation to patients with a neonatal lethal MLS form.
    explanation: >-
      Documents the full range of the spectrum this node models.
  downstream:
  - target: Microphthalmia
    description: Ocular tissue is the most consistently affected, producing microphthalmia or anophthalmia.
  - target: Sclerocornea
    description: Corneal opacification and sclerocornea accompany the microphthalmia.
  - target: Aplasia cutis congenita
    description: Linear dermal aplasia of the face and neck, present at birth and healing with age.
  - target: Cardiomyopathy
    description: Cardiac involvement includes cardiomyopathy and septal defects.
  - target: Seizure
    description: Central nervous system involvement can include infantile seizures.
  - target: Microcephaly
    description: Microcephaly is among the reported additional features.

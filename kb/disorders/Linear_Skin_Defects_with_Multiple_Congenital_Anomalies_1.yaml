genetic:
- name: HCCS pathogenic variants and Xp22 deletions
  gene_term:
    preferred_term: HCCS
    term:
      id: hgnc:4837
      label: HCCS
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Two lesion classes cause MLS1: segmental Xp22 monosomy encompassing HCCS
    (terminal deletions of 11 Mb or more down to submicroscopic losses of roughly
    850 kb), and intragenic HCCS point mutations including p.Arg217Cys,
    p.Arg197Ter and p.Glu159Lys. Point mutations have been de novo in the reported
    index patients, but inherited mutations occur, and clinically normal carrier
    relatives have been documented.
  evidence:
  - reference: PMID:17033964
    reference_title: Mutations of the mitochondrial holocytochrome c-type synthase in X-linked dominant microphthalmia with linear skin defects syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In two female patients, from two families, with MLS and a normal karyotype, we
      identified heterozygous de novo point mutations--a missense mutation (p.R217C)
      and a nonsense mutation (p.R197X)--in the HCCS gene.
    explanation: >-
      The report establishing intragenic HCCS mutation, as distinct from deletion,
      as a cause of MLS.
  - reference: PMID:24735900
    reference_title: "Clinical spectrum of females with HCCS mutation: from no clinical signs to a neonatal lethal form of the microphthalmia with linear skin defects (MLS) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two terminal Xp deletions of ≥ 11.2 Mb, two submicroscopic copy number losses,
      one of ~850 kb and one of ≥ 3 Mb, all covering HCCS, 1 nonsense, and one
      mosaic 2-bp deletion in HCCS are reported.
    explanation: >-
      Documents the range of lesion sizes and types that converge on HCCS loss.
  - reference: PMID:17893649
    reference_title: "HCCS loss-of-function missense mutation in a female with bilateral microphthalmia and sclerocornea: a novel gene for severe ocular malformations?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We detected the heterozygous c.475G>A mutation in exon 5 of HCCS, predicting an
      amino acid substitution of the highly conserved glutamate at position 159 by
      lysine, in a female presenting with bilateral microphthalmia and sclerocornea.
    explanation: >-
      A further loss-of-function allele, found in a patient with ocular findings but
      no skin defects.
diagnosis:
- name: Clinical criteria with molecular confirmation
  description: >-
    The clinical diagnosis rests on two major criteria, microphthalmia/anophthalmia
    and linear skin defects, confirmed molecularly. Importantly, patients with a
    molecular diagnosis have been reported with only one of the two major criteria,
    so requiring both will miss cases. Molecular confirmation is by testing COX7B,
    HCCS or NDUFB11; this entry covers the HCCS-associated form.
  evidence:
  - reference: PMID:20301767
    reference_title: Microphthalmia with Linear Skin Defects Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, persons with a molecular diagnosis of MLS syndrome in whom only one of
      the two major criteria was present have been reported: some show characteristic
      skin defects without ocular abnormalities and others show eye abnormalities
      without skin defects.
    explanation: >-
      The explicit warning that the two-criterion clinical definition
      under-ascertains molecularly confirmed patients.

      snippet: "We identified a novel homozygous frameshift mutation in ADAM17 (NM_003183.4:c.308dupA) leading to a premature stop codon."
      explanation: Homozygous frameshift allele in the second family.
  - name: Exon 1 deletion
    description: >-
      Homozygous genomic deletion of exon 1 in a child of first-cousin parents;
      no ADAM17 precursor or mature protein was detected in his NK cells.
    clinical_significance: PATHOGENIC
    variant_type: deletion
    evidence:

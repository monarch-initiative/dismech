prevalence:
- population: Published literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Four patients from three families had been reported when the first
    compound heterozygous family (two siblings) was published in 2021; single
    further cases have been reported since, so the published total is around
    ten patients.
  evidence:
  - reference: PMID:33953303
    reference_title: Functionally confirmed compound heterozygous ADAM17 missense loss-of-function variants cause neonatal inflammatory skin and bowel disease 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Loss-of-function variants of ADAM17 were identified in 4 patients, two of whom are siblings, from three families with autosomal recessive neonatal inflammatory skin and bowel disease 1"
    explanation: Case count before the compound heterozygous family was added.
  - reference: PMID:34993966
    reference_title: Neonatal inflammatory skin and bowel disease type 1 caused by a complex genetic defect and responsive to combined anti-tumour necrosis factor-α and interleukin-12/23 blockade.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Biallelic loss-of-function variants in ADAM17, encoding ADAM metallopeptidase domain 17, have to date been reported in only four families with neonatal inflammatory skin and bowel disease 1 (NISBD1)."
    explanation: Only four families had been reported by 2022.
progression:
- phase: Neonatal onset
  notes: >-
    Skin lesions appear within the first week of life and diarrhoea in the
    first weeks; one infant was born with a collodion membrane.
  evidence:
  - reference: PMID:25804906
    reference_title: Loss of ADAM17 is associated with severe multiorgan dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At birth, the main clinical feature of the infant was its skin that was covered by a collodion membrane, which coincided with diffuse erythema."
    explanation: Skin involvement present at birth.
  - reference: PMID:25804906
    reference_title: Loss of ADAM17 is associated with severe multiorgan dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe watery diarrhea developed in the first week of life."
    explanation: Diarrhoea from the first week of life.
- phase: Relapsing course with variable survival
  notes: >-
    The skin disease flares and remits, in step with intestinal symptoms. Some
    children die in infancy or early childhood of sepsis or respiratory
    failure; the first reported proband was alive and leading a relatively
    normal life at 17 years.
  evidence:
  - reference: PMID:33953303
    reference_title: Functionally confirmed compound heterozygous ADAM17 missense loss-of-function variants cause neonatal inflammatory skin and bowel disease 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The skin disease seems to undergo phases of exacerbation and remission, with recurrent flares of erythema, scaling and widespread pustules."
    explanation: Relapsing-remitting course of the skin disease across reported patients.
  - reference: PMID:25804906
    reference_title: Loss of ADAM17 is associated with severe multiorgan dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The severity of skin abnormalities was episodic in nature and appeared to coincide with the severity of intestinal symptoms."
    explanation: Skin flares parallel intestinal flares.
  - reference: PMID:25804906
    reference_title: Loss of ADAM17 is associated with severe multiorgan dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, our patient illustrates that disease severity is variable and can lead to very early mortality."
    explanation: Death at 10 months in the second family contrasts with adult survival in the first.
  - reference: PMID:22010916
    reference_title: Inflammatory skin and bowel disease linked to ADAM17 deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite repeated skin infections, this young man has led a relatively normal life."
    explanation: Survival into adulthood with a mild course in the index proband.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    A neonatal-onset multisystem disorder with recurrent sepsis and death in
    infancy or early childhood in several of the reported patients.
  evidence:
  - reference: PMID:25804906
    reference_title: Loss of ADAM17 is associated with severe multiorgan dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband presented with severe diarrhea, skin rash, and recurrent sepsis, eventually leading to her death at the age of 10 months."
    explanation: Fatal course in infancy.
  - reference: PMID:26683521
    reference_title: Cytokine secretion and NK cell activity in human ADAM17 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient died at two years of age of respiratory failure and presumed sepsis."
    explanation: Fatal course in early childhood.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Patients are homozygous, often from consanguineous families, or compound
    heterozygous for ADAM17 loss-of-function alleles; heterozygous parents are
    unaffected.
  evidence:
  - reference: PMID:22010916
    reference_title: Inflammatory skin and bowel disease linked to ADAM17 deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed genetic and immunohistochemical studies in a sister and brother with autosomal recessive neonatal inflammatory skin and bowel lesions."
    explanation: The first family showed autosomal recessive inheritance.
  - reference: PMID:25804906
    reference_title: Loss of ADAM17 is associated with severe multiorgan dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygosity for the ADAM17 mutation was only seen in the affected proband and not in the siblings, and heterozygosity was confirmed in both parents using Sanger sequencing."
    explanation: Segregation of a homozygous allele with heterozygous unaffected parents.
  - reference: PMID:33953303
    reference_title: Functionally confirmed compound heterozygous ADAM17 missense loss-of-function variants cause neonatal inflammatory skin and bowel disease 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband’s father and mother were heterozygous carriers of c.1699T>C and c.1799G>A, respectively, suggesting that these variations were present in the proband in a compound heterozygous state (Fig. 1a)."
    explanation: Compound heterozygous inheritance from carrier parents.
genetic:
- name: ADAM17
  gene_term:
    preferred_term: ADAM17

      snippet: "However, a single exon, exon 1 of the ADAM17 gene, was totally uncovered in the patient sample, but was well covered (46-48 X) in samples of other patients which were analyzed in parallel."
      explanation: Exome coverage reveals the homozygous exon 1 deletion.
  - name: c.1699T>C (p.Cys567Arg)
    description: >-
      Missense variant in the cysteine-rich region, found in trans with
      p.Cys600Tyr in two Japanese siblings; it abolishes stimulated shedding
      without reducing protein expression or stability.
    clinical_significance: PATHOGENIC
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:33953303
      reference_title: Functionally confirmed compound heterozygous ADAM17 missense loss-of-function variants cause neonatal inflammatory skin and bowel disease 1.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our results suggest that the two mutant proteins, namely hADAM17-C567R and hADAM17-C600Y, lack PMA-stimulated cell-based ectodomain shedding activity for TNF-α, TGF-α and HB-EGF"
      explanation: Shedding assay shows loss of function.
  - name: c.1799G>A (p.Cys600Tyr)
    description: >-
      Missense variant in the membrane-proximal domain, in trans with
      p.Cys567Arg; it abolishes stimulated shedding.
    clinical_significance: PATHOGENIC
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:33953303
      reference_title: Functionally confirmed compound heterozygous ADAM17 missense loss-of-function variants cause neonatal inflammatory skin and bowel disease 1.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our results suggest that the two mutant proteins, namely hADAM17-C567R and hADAM17-C600Y, lack PMA-stimulated cell-based ectodomain shedding activity for TNF-α, TGF-α and HB-EGF"
      explanation: Shedding assay shows loss of function.
  - name: Exons 6-7 deletion with exon 17 splice variant
    description: >-
      Compound heterozygous genomic deletion of exons 6 and 7 and a splice-site
      variant causing exon 17 skipping, in a girl with severe skin, oesophageal
      and bowel disease.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34993966
      reference_title: Neonatal inflammatory skin and bowel disease type 1 caused by a complex genetic defect and responsive to combined anti-tumour necrosis factor-α and interleukin-12/23 blockade.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In this case, NISBD1 was found to result from a complex compound heterozygous defect consisting of a large genomic deletion spanning exons 6 and 7 in addition to a splice site variant causing exon 17 skipping."
      explanation: Compound heterozygous deletion and splice allele.
  - name: c.450G>A (p.Glu150=)
    description: >-
      Homozygous synonymous change at the last base of an exon that disrupts

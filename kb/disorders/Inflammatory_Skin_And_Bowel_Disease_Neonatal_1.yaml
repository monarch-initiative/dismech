name: Inflammatory Skin and Bowel Disease, Neonatal, 1
creation_date: "2026-10-28T22:24:34Z"
description: >-
  Neonatal inflammatory skin and bowel disease 1 (NISBD1), also called ADAM17
  deficiency, is an autosomal recessive multisystem inflammatory disorder caused
  by biallelic loss-of-function variants in ADAM17, which encodes the
  membrane-bound sheddase ADAM17 (TNF-alpha converting enzyme, TACE). ADAM17
  releases the ectodomains of more than 80 cell-surface proteins, including
  TNF-alpha, the TNF receptors, the IL-6 receptor, L-selectin and the EGFR
  ligands TGF-alpha, amphiregulin, epiregulin and HB-EGF. Reported alleles are
  frameshift, exon-deletion, splice and functionally null missense variants
  that abolish ADAM17 expression or sheddase activity. From the first days of
  life affected infants develop perioral and perianal erythema with fissuring,
  a generalized pustular eruption that can progress to psoriasiform
  erythroderma, some born with a collodion membrane, short or broken scalp hair
  and wiry eyelashes and eyebrows, malabsorptive diarrhoea, failure to thrive,
  and recurrent skin infections and sepsis. Cardiomegaly or cardiomyopathy,
  hypertension, renal enlargement and hepatitis are reported in some patients.
  Severity varies widely: several children died in infancy or early childhood
  of sepsis or respiratory failure, while the first reported patient reached
  adulthood with repeated skin infections only. The skin disease is attributed
  to failed shedding of EGFR ligands, so that the epidermis behaves as in EGFR
  deficiency (NISBD2), while failed TNF release and abnormal leukocyte cytokine
  output weaken antibacterial defence.

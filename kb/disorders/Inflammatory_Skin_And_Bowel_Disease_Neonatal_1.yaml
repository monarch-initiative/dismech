    bulge stem cell niche is never established, follicle stem cells lose their
    colony-forming capacity, hair is brittle at birth and is then progressively
    lost. Patients have short, broken scalp hair shed soon after birth,
    atrichia in one case, and wiry eyelashes and eyebrows.

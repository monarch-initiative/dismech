    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:42015567
      reference_title: Unusual Cutaneous and Mucosal Manifestations of Neonatal Inflammatory Skin and Bowel Disease Type 1 due to a Novel Homozygous ADAM17 Mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report a 4-year-old girl with an unusual constellation of mucocutaneous manifestations associated with a novel homozygous ADAM17 mutation (c.436G>A; p.Gln146Lys), thereby expanding the known phenotypic spectrum of NISBD1."
      explanation: Homozygous variant in an atypical patient.
pathophysiology:
- name: ADAM17 Loss of Function
  description: >-
    Biallelic frameshift, exon-deletion and splice alleles abolish ADAM17
    expression, and the two reported missense alleles leave a stable protein
    that cannot shed substrates. The common result is loss of ADAM17
    metalloprotease (sheddase) activity at the cell surface.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genetic_context:
    gene:
      preferred_term: ADAM17
      term:
        id: hgnc:195
        label: ADAM17
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous or compound heterozygous null and missense alleles; patient
      NK cells lacked both precursor and mature ADAM17.
  genes:
  - preferred_term: ADAM17
    term:
      id: hgnc:195
      label: ADAM17
  molecular_functions:
  - preferred_term: ADAM17 metalloendopeptidase (sheddase) activity
    term:
      id: GO:0004222
      label: metalloendopeptidase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:26683521
    reference_title: Cytokine secretion and NK cell activity in human ADAM17 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As can be seen in Figure 1D both the precursor form (around 120 kDa) and the catalytic form (around 100 kDa) of ADAM17 were absent from the patients' NK cells."
    explanation: No ADAM17 protein in patient cells with the exon 1 deletion.
  - reference: PMID:33953303
    reference_title: Functionally confirmed compound heterozygous ADAM17 missense loss-of-function variants cause neonatal inflammatory skin and bowel disease 1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results suggest that both variants do not affect the transcription, translation and stability of ADAM17."
    explanation: Missense alleles leave a stable but inactive protein.
  - reference: PMID:33953303
    reference_title: Functionally confirmed compound heterozygous ADAM17 missense loss-of-function variants cause neonatal inflammatory skin and bowel disease 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "resulting in the complete loss of ADAM17 expression through nonsense-mediated mRNA decay (NMD) and loss of transcription from exon 1, respectively"
    explanation: The earlier frameshift and exon 1 deletion alleles abolish expression.
  downstream:
  - target: Impaired Ectodomain Shedding of ADAM17 Substrates
    description: Without ADAM17 activity, its membrane-anchored substrates are not released.
    evidence:
    - reference: PMID:33953303
      reference_title: Functionally confirmed compound heterozygous ADAM17 missense loss-of-function variants cause neonatal inflammatory skin and bowel disease 1.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "PMA-stimulated soluble AP-substrate release was detected in cells expressing FLAG-syn-hADAM17-WT, but not in cells expressing either FLAG-syn-hADAM17-C567R or FLAG-syn-hADAM17-C600Y for AP-tagged substrate (Fig. 2c)."
      explanation: Patient alleles fail to release TNF-alpha, TGF-alpha and HB-EGF reporters.
- name: Impaired Ectodomain Shedding of ADAM17 Substrates
  description: >-
    ADAM17 normally sheds TNF-alpha, TNF receptors, the IL-6 receptor,
    L-selectin and the EGFR ligands TGF-alpha, amphiregulin, epiregulin and
    HB-EGF. In its absence these stay membrane bound, which removes soluble
    EGFR ligands and soluble TNF from tissues.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: ADAM17
    term:
      id: hgnc:195
      label: ADAM17
  biological_processes:
  - preferred_term: membrane protein ectodomain proteolysis
    term:
      id: GO:0006509
      label: membrane protein ectodomain proteolysis
    modifier: DECREASED
  evidence:
  - reference: PMID:33953303
    reference_title: Functionally confirmed compound heterozygous ADAM17 missense loss-of-function variants cause neonatal inflammatory skin and bowel disease 1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results suggest that the two mutant proteins, namely hADAM17-C567R and hADAM17-C600Y, lack PMA-stimulated cell-based ectodomain shedding activity for TNF-α, TGF-α and HB-EGF"
    explanation: Loss of shedding of an inflammatory cytokine and two EGFR ligands.
  - reference: PMID:9812885
    reference_title: An essential role for ectodomain shedding in mammalian development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Analyses of cells lacking this metalloproteinase-disintegrin revealed an expanded role for TACE in the processing of other cell surface proteins, including a TNF receptor, the L-selectin adhesion molecule, and transforming growth factor-alpha (TGFalpha)."
    explanation: Cells from Tace-null mice fail to process a broad set of substrates.
  downstream:
  - target: Reduced Epithelial EGFR Signaling
    description: Unshed EGFR ligands cannot activate the receptor on neighbouring epithelial cells.
    evidence:
    - reference: PMID:20603312
      reference_title: Critical role of the disintegrin metalloprotease ADAM17 for intestinal inflammation and regeneration in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The resulting mice called ADAM17(ex/ex) were viable, showed compromised shedding of ADAM17 substrates from the cell surface, and developed eye, heart, and skin defects as a consequence of impaired EGF-R signaling caused by failure of shedding of EGF-R ligands."
      explanation: Hypomorphic Adam17 mice establish that failed ligand shedding reduces EGFR signalling.
  - target: Impaired TNF Release and Abnormal Leukocyte Cytokine Responses
    description: Leukocytes cannot release TNF-alpha.
    evidence:
    - reference: PMID:22010916
      reference_title: Inflammatory skin and bowel disease linked to ADAM17 deletion.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Peripheral-blood mononuclear cells (PBMCs) obtained from the brother at 17 years of age showed high levels of lipopolysaccharide-induced production of interleukin-1β and interleukin-6 but impaired release of TNF-α."
      explanation: Patient PBMCs do not release TNF-alpha.
- name: Reduced Epithelial EGFR Signaling
  description: >-
    Loss of ADAM17-mediated release of TGF-alpha and other EGFR ligands lowers
    EGFR activation in the epidermis and intestinal epithelium. Keratinocyte
    deletion of Adam17 in mice phenocopies keratinocyte deletion of Egfr, and
    topical TGF-alpha partly rescues it, placing the disease on the same
    ADAM17-EGFR axis that fails at the receptor in NISBD2.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  genes:

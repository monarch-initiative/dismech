    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This was a result of impaired shedding of EGF-R ligands resulting in failure to phosphorylate STAT3 via the EGF-R and, consequently, in defective regeneration of epithelial cells and breakdown of the intestinal barrier."

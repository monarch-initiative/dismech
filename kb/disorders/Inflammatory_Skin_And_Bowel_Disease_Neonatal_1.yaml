    evidence_source: MODEL_ORGANISM
    snippet: "ADAM17 was predominantly expressed by regenerating epithelia in control mice, and its loss or inhibition attenuated epidermal growth factor receptor (EGFR) activation, epithelial proliferation, mucus production and barrier functions."
    explanation: Independent mouse study showing that epithelial ADAM17 loss reduces EGFR activation and colonic barrier function.

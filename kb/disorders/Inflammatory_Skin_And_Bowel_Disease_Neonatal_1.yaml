animal_models:
- name: Keratinocyte-specific Adam17 knockout mouse (A17 delta-KC)
  species: Mouse
  genotype: Adam17 conditional deletion in keratinocytes
  publication: PMID:22565824
  description: >-
    Normal barrier at birth, then defective terminal differentiation, barrier
    loss, IL-36 induction and chronic dermatitis; reduced epidermal EGFR
    activation, partly rescued by topical TGF-alpha; phenocopies
    keratinocyte-specific Egfr deletion.
  modeled_mechanisms:
  - target: Defective Keratinocyte Terminal Differentiation and Epidermal Barrier Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Postnatal barrier failure from loss of keratinocyte ADAM17.
    limitations: >-
      Deletion is restricted to keratinocytes, so the intestinal, immune and
      cardiac components of the human disease are absent.
    evidence:
    - reference: PMID:22565824
      reference_title: Epidermal ADAM17 maintains the skin barrier by regulating EGFR ligand-dependent terminal keratinocyte differentiation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We show that mice lacking ADAM17 in keratinocytes (A17(ΔKC)) have a normal epidermal barrier and skin architecture at birth but develop pronounced defects in epidermal barrier integrity soon after birth and develop chronic dermatitis as adults."
      explanation: The model develops postnatal barrier failure and dermatitis.
  - target: Reduced Epithelial EGFR Signaling
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Reduced epidermal EGFR activation rescued by an EGFR ligand.
    limitations: Shown in skin only; the intestinal epithelium is not affected by this deletion.
    evidence:
    - reference: PMID:22565824
      reference_title: Epidermal ADAM17 maintains the skin barrier by regulating EGFR ligand-dependent terminal keratinocyte differentiation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Activation of the EGFR was strongly reduced in A17(ΔKC) skin, and topical treatment of A17(ΔKC) mice with recombinant TGF-α significantly improved TGM activity and decreased skin inflammation."
      explanation: Reduced EGFR activation in the model.
  evidence:
  - reference: PMID:22565824
    reference_title: Epidermal ADAM17 maintains the skin barrier by regulating EGFR ligand-dependent terminal keratinocyte differentiation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Finally, we show that mice lacking the EGFR in keratinocytes (Egfr(ΔKC)) closely resembled A17(ΔKC) mice."
    explanation: Keratinocyte Adam17 and Egfr knockouts share the phenotype.
- name: Adam17 Sox9-Cre conditional knockout mouse
  species: Mouse
  genotype: Adam17 flox/flox; Sox9-Cre
  publication: PMID:25902485
  description: >-
    Generated to model human ADAM17 deficiency; develops eczematous dermatitis
    with spontaneous dysbiosis by Corynebacterium mastitidis, Staphylococcus
    aureus and Corynebacterium bovis, reversed by targeted antibiotics. The
    same Tace/Sox9 deletion also prevents establishment of the hair follicle
    bulge stem cell niche, giving brittle hair and progressive alopecia
    (PMID:22696231).
  modeled_mechanisms:
  - target: Hair Follicle Stem Cell Niche Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Brittle hair at birth and progressive hair loss from failure of the bulge stem cell niche.
    limitations: >-
      Mouse hair cycling differs from human scalp hair, and the deletion is
      restricted to SOX9-expressing lineages.
    evidence:
    - reference: PMID:22696231
      reference_title: "Brief report: requirement of TACE/ADAM17 for hair follicle bulge niche establishment."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Tace/Sox9 mice were born with brittle hair with prolonged anagen phase."
      explanation: The model reproduces the brittle hair of patients.
  - target: Cutaneous Dysbiosis and Inflammation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Dysbiosis-driven eczematous dermatitis after epithelial Adam17 loss.
    limitations: >-
      Conditional deletion in Sox9-expressing lineages rather than a germline
      null; the eczematous rather than pustular-psoriasiform pattern and the
      mouse skin microbiota differ from patients.
    evidence:
    - reference: PMID:25902485
      reference_title: Dysbiosis and Staphylococcus aureus Colonization Drives Inflammation in Atopic Dermatitis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Corynebacterium mastitidis, S. aureus, and Corynebacterium bovis sequentially emerged during the onset of eczematous dermatitis, and antibiotics specific for these bacterial species almost completely reversed dysbiosis and eliminated skin inflammation."
      explanation: The model shows dysbiosis-dependent inflammation.
  evidence:
  - reference: PMID:25902485
    reference_title: Dysbiosis and Staphylococcus aureus Colonization Drives Inflammation in Atopic Dermatitis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Herein, we demonstrate that Adam17(fl/fl)Sox9-(Cre) mice, generated to model ADAM17-deficiency in human, developed eczematous dermatitis with naturally occurring dysbiosis, similar to that observed in atopic dermatitis."
    explanation: Phenotype of the conditional knockout.
- name: Adam17 hypomorphic mouse (ADAM17 ex/ex)
  species: Mouse
  genotype: Adam17 ex/ex hypomorphic allele, homozygous
  publication: PMID:20603312
  description: >-
    Dramatically reduced ADAM17 in all tissues; viable, with eye, hair, skin
    and heart defects from failed EGFR ligand shedding, and severe colitis with
    defective epithelial regeneration after dextran sulfate sodium challenge.
  modeled_mechanisms:
  - target: Defective Intestinal Epithelial Regeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Defective epithelial regeneration and barrier breakdown in colitis.
    limitations: >-
      The unchallenged mouse intestine is normal and the defect appears only
      after chemical colitis, whereas patients have diarrhoea from the first
      week of life; residual ADAM17 is present.
    evidence:
    - reference: PMID:20603312
      reference_title: Critical role of the disintegrin metalloprotease ADAM17 for intestinal inflammation and regeneration in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Unexpectedly, although the intestine of unchallenged homozygous ADAM17(ex/ex) mice was normal, ADAM17(ex/ex) mice showed substantially increased susceptibility to inflammation in dextran sulfate sodium colitis."
      explanation: Intestinal defect revealed by injury.
  - target: Impaired Ectodomain Shedding of ADAM17 Substrates
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: Whole-body reduction of ADAM17 substrate shedding.
    limitations: A hypomorph rather than the null alleles carried by most patients.
    evidence:
    - reference: PMID:20603312
      reference_title: Critical role of the disintegrin metalloprotease ADAM17 for intestinal inflammation and regeneration in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The resulting mice called ADAM17(ex/ex) were viable, showed compromised shedding of ADAM17 substrates from the cell surface, and developed eye, heart, and skin defects as a consequence of impaired EGF-R signaling caused by failure of shedding of EGF-R ligands."
      explanation: Compromised substrate shedding in the hypomorph.
  evidence:
  - reference: PMID:20603312
    reference_title: Critical role of the disintegrin metalloprotease ADAM17 for intestinal inflammation and regeneration in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The resulting mice called ADAM17(ex/ex) were viable, showed compromised shedding of ADAM17 substrates from the cell surface, and developed eye, heart, and skin defects as a consequence of impaired EGF-R signaling caused by failure of shedding of EGF-R ligands."
    explanation: Phenotype of the hypomorph.
discussions:
- discussion_id: nisbd1_cardiac_mechanism_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Cardiomyopathy
  - phenotypes#Hypertension
  prompt: >-
    Several NISBD1 patients have cardiomegaly, cardiomyopathy or hypertension.
    Do these follow from loss of ADAM17 shedding in the heart or vasculature,
    from infection, or from treatment?
  rationale: >-
    The cardiac and blood pressure findings recur but are unexplained; the
    report describing hypertension could not relate it to the mutation, and
    the first family's fatal myocarditis was viral.
  evidence:
  - reference: PMID:25804906
    reference_title: Loss of ADAM17 is associated with severe multiorgan dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We were unable to find a clear relation between the hypertension and the mutation, in part because the patient died before we could exclude all other causes."
    explanation: The mechanism of hypertension was left unresolved.
references:
- reference: PMID:22010916
  title: Inflammatory skin and bowel disease linked to ADAM17 deletion.
  findings:
  - statement: Discovery of a homozygous ADAM17 loss-of-function mutation as the cause of neonatal inflammatory skin and bowel disease.
notes: >-
  No GeneReviews chapter names this disease. The published patients number
  around ten, so phenotype frequencies are not estimated, and the intestinal
  and barrier mechanisms rest mainly on mouse models.

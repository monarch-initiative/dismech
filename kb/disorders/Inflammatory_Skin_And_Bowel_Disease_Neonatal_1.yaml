- name: Defective Keratinocyte Terminal Differentiation and Epidermal Barrier Failure
  description: >-
    Without EGFR ligand signalling, postnatal keratinocytes misexpress
    differentiation proteins, transglutaminase activity falls, and
    transepidermal water loss rises. Barrier failure is followed by
    keratinocyte IL-36 induction and inflammatory infiltration. Patient skin
    shows parakeratosis and spongiotic dermatitis.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: keratinocyte differentiation
    term:
      id: GO:0030216
      label: keratinocyte differentiation
    modifier: DYSREGULATED
  - preferred_term: establishment of skin barrier
    term:
      id: GO:0061436
      label: establishment of skin barrier
    modifier: DECREASED
  notes: >-
    PROVISIONAL because the barrier mechanism comes from keratinocyte-specific
    Adam17 knockout mice; patient biopsies show parakeratosis and spongiotic
    dermatitis but barrier function has not been measured in patients.
  evidence:
  - reference: PMID:22565824
    reference_title: Epidermal ADAM17 maintains the skin barrier by regulating EGFR ligand-dependent terminal keratinocyte differentiation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The dysregulated expression of epidermal differentiation proteins becomes evident 2 d after birth, followed by reduced transglutaminase (TGM) activity, transepidermal water loss, up-regulation of the proinflammatory cytokine IL-36α, and inflammatory immune cell infiltration."
    explanation: Sequence from failed differentiation to barrier loss and inflammation in keratinocyte Adam17 knockouts.
  - reference: PMID:27089454
    reference_title: Skin Barrier Defects Caused by Keratinocyte-Specific Deletion of ADAM17 or EGFR Are Based on Highly Similar Proteome and Degradome Alterations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These include massive proteome alterations of structural and regulatory components important for barrier formation such as transglutaminases, involucrin, filaggrin, and filaggrin-2."
    explanation: Barrier-forming proteome is disrupted after keratinocyte Adam17 deletion.
  - reference: PMID:25804906
    reference_title: Loss of ADAM17 is associated with severe multiorgan dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skin samples revealed features of parakeratosis with focal neutrophilic granulocytes and spongiotic dermatitis with exocytosis of lymphocytes (Fig. 2A)."
    explanation: Patient skin shows disordered cornification and inflammation.
  downstream:

    reference_title: Loss of ADAM17 is associated with severe multiorgan dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "In summary, the intestinal histological changes were minimal and nonspecific and do not explain well the clinical intestinal phenotype."
    explanation: Patient histology shows only mild changes, so the human intestinal lesion remains uncharacterised.

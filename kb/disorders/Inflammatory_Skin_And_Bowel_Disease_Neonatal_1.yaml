  evidence:
  - reference: PMID:22565824
    reference_title: Epidermal ADAM17 maintains the skin barrier by regulating EGFR ligand-dependent terminal keratinocyte differentiation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Activation of the EGFR was strongly reduced in A17(ΔKC) skin, and topical treatment of A17(ΔKC) mice with recombinant TGF-α significantly improved TGM activity and decreased skin inflammation."
    explanation: Keratinocyte Adam17 loss reduces EGFR activation, and an EGFR ligand rescues the defect.
  - reference: PMID:27089454
    reference_title: Skin Barrier Defects Caused by Keratinocyte-Specific Deletion of ADAM17 or EGFR Are Based on Highly Similar Proteome and Degradome Alterations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice deficient for ADAM17 in keratinocytes phenocopy mice with a keratinocyte-specific deletion of epidermal growth factor receptor (EGFR), which highlights the role of ADAM17 as a \"ligand sheddase\" of EGFR ligands."
    explanation: Adam17 and Egfr keratinocyte knockouts converge on the same phenotype.
  downstream:
  - target: Defective Keratinocyte Terminal Differentiation and Epidermal Barrier Failure
    description: EGFR signalling drives the terminal differentiation that builds the postnatal barrier.
    evidence:
    - reference: PMID:22565824
      reference_title: Epidermal ADAM17 maintains the skin barrier by regulating EGFR ligand-dependent terminal keratinocyte differentiation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Collectively, these results identify a previously unappreciated critical role of the ADAM17-EGFR signaling axis in maintaining the homeostasis of the postnatal epidermal barrier and suggest that this pathway could represent a good target for treatment of epidermal barrier defects."
      explanation: The ADAM17-EGFR axis is required for the postnatal epidermal barrier.
    - reference: PMID:27089454
      reference_title: Skin Barrier Defects Caused by Keratinocyte-Specific Deletion of ADAM17 or EGFR Are Based on Highly Similar Proteome and Degradome Alterations.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, it suggests that most defects in formation of the postnatal epidermal barrier upon keratinocyte-specific ADAM17 deletion are mediated via EGFR."
      explanation: The barrier defect of Adam17 loss runs through EGFR.
  - target: Defective Intestinal Epithelial Regeneration
    description: EGFR-STAT3 signalling is needed for intestinal epithelial regeneration after injury.
    evidence:
    - reference: PMID:20603312
      reference_title: Critical role of the disintegrin metalloprotease ADAM17 for intestinal inflammation and regeneration in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This was a result of impaired shedding of EGF-R ligands resulting in failure to phosphorylate STAT3 via the EGF-R and, consequently, in defective regeneration of epithelial cells and breakdown of the intestinal barrier."
      explanation: In hypomorphic mice failed EGFR ligand shedding prevents epithelial regeneration.
  - target: Hair Follicle Stem Cell Niche Failure
    description: EGFR signalling downstream of ADAM17 is needed to establish and maintain the hair follicle bulge stem cell niche.
    evidence:
    - reference: PMID:22696231
      reference_title: "Brief report: requirement of TACE/ADAM17 for hair follicle bulge niche establishment."

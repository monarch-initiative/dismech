- name: Defective Intestinal Epithelial Regeneration
  description: >-
    Reduced EGFR-STAT3 signalling in the gut epithelium impairs its
    regeneration and barrier. Patients have malabsorptive, partly secretory
    diarrhoea from the first weeks of life, worsened by intercurrent infection;
    duodenal biopsy in one patient showed only patchy mild villous atrophy and
    crypt hyperplasia.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  cell_types:

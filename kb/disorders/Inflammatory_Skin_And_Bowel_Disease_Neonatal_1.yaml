    term:
      id: CL:0002563
      label: intestinal epithelial cell
  biological_processes:
  - preferred_term: maintenance of gastrointestinal epithelium
    term:
      id: GO:0030277
      label: maintenance of gastrointestinal epithelium
    modifier: DECREASED
  notes: >-
    PROVISIONAL because the regeneration defect was shown in hypomorphic
    Adam17 mice after chemical colitis; unchallenged mice had a normal gut,
    and the authors of the second patient report found that the patient's
    intestinal histology did not explain the severity of the diarrhoea.

    clinical_significance: PATHOGENIC
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:40968583
      reference_title: "Neonatal Inflammatory Skin and Bowel Disease 1 (NISBD1): A Case of ADAM17 Homozygous Mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic testing identified a novel, homozygous pathogenic ADAM17 variant, p.(Glu150=) (GAG > GAA): c.450G > A, disrupting the splice donor site and confirming the diagnosis of NISBD1."
      explanation: Homozygous splice-disrupting allele.
  - name: c.436G>A (p.Gln146Lys)
    description: >-
      Homozygous variant reported in a 4-year-old girl with
      pyoderma-gangrenosum-like ulcers and stomatitis but no bowel disease. The

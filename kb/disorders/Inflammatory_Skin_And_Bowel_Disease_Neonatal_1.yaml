  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    Biallelic germline loss-of-function variants cause NISBD1. A heterozygous
    ADAM17 missense variant (p.Asp647Asn) has separately been reported to
    cause dominant hypotrichosis with woolly hair (PMID:38771644), an allelic
    disorder without inflammatory skin or bowel disease that is not part of
    this entry. The committed ClinGen validity export
    (cache/clingen/gene_validity.csv) has an ADAM17 assertion only for
    congenital heart disease (Limited, autosomal dominant), not for this
    disease, so no gene_disease_validity tier is recorded.
  evidence:
  - reference: PMID:22010916
    reference_title: Inflammatory skin and bowel disease linked to ADAM17 deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a loss-of-function mutation in ADAM17, which encodes a disintegrin and metalloproteinase 17 ... as the probable cause of this syndrome."
    explanation: Discovery of ADAM17 as the causal gene.
  - reference: PMID:25804906
    reference_title: Loss of ADAM17 is associated with severe multiorgan dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this report, we describe a second family confirming the existence of this syndrome."
    explanation: Replication in an unrelated family.
  - reference: PMID:33953303
    reference_title: Functionally confirmed compound heterozygous ADAM17 missense loss-of-function variants cause neonatal inflammatory skin and bowel disease 1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, in vitro functional assays demonstrated that both missense variants cause the loss-of-function of ADAM17, resulting in the development of NISBD1."
    explanation: Functional confirmation of missense alleles.
  variants:
  - name: c.308dupA (p.Asn103LysfsTer20)
    description: >-
      Homozygous frameshift duplication in a girl of Armenian parents, predicted

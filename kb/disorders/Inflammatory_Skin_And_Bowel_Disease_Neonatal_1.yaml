diagnosis:
- name: Exome or gene panel sequencing
  description: >-
    Diagnosis is by sequencing ADAM17 in infants with neonatal inflammatory
    skin disease, diarrhoea and recurrent infection. Copy-number analysis is
    needed because exon deletions are among the reported alleles, and in vitro
    shedding assays have been used to confirm missense variants.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:25804906
    reference_title: Loss of ADAM17 is associated with severe multiorgan dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among these 151 candidate variants, one was a homozygous frameshift mutation in ADAM17 (NM_003183.4:c.308dupA)."
    explanation: Exome sequencing identified the causal variant.
  - reference: PMID:26683521
    reference_title: Cytokine secretion and NK cell activity in human ADAM17 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, a single exon, exon 1 of the ADAM17 gene, was totally uncovered in the patient sample, but was well covered (46-48 X) in samples of other patients which were analyzed in parallel."
    explanation: A homozygous exon deletion was detected from exome coverage.
differential_diagnoses:
- name: Neonatal inflammatory skin and bowel disease 2 (EGFR)
  disease_term:
    preferred_term: inflammatory skin and bowel disease, neonatal, 2
    term:
      id: MONDO:0014481
      label: inflammatory skin and bowel disease, neonatal, 2
  distinguishing_features:
  - >-
    Caused by biallelic loss of EGFR itself, the receptor whose ligands ADAM17
    sheds, so the inflammatory skin disease, diarrhoea and infections overlap
    closely. NISBD2 patients are mostly Roma infants homozygous for EGFR
    p.Gly428Asp, are usually premature, and have prominent nephromegaly with
    renal salt wasting and electrolyte imbalance; the two are separated by
    which gene carries the biallelic variants.
  evidence:
  - reference: PMID:24691054
    reference_title: Epithelial inflammation resulting from an inherited loss-of-function mutation in EGFR.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole-exome sequencing, we identified a homozygous loss-of-function missense mutation in EGFR (c.1283 G>A; p.Gly428Asp) in a male infant with lifelong inflammation affecting the skin, bowel, and lungs."
    explanation: EGFR deficiency produces a closely similar skin, bowel and lung phenotype.
- name: Acrodermatitis enteropathica
  disease_term:
    preferred_term: acrodermatitis enteropathica
    term:
      id: MONDO:0008713
      label: acrodermatitis enteropathica
  distinguishing_features:
  - >-
    Periorificial dermatitis with diarrhoea in infancy suggested
    acrodermatitis enteropathica, but the rash did not respond to zinc and
    SLC39A4 sequencing was normal.
  evidence:
  - reference: PMID:25804906
    reference_title: Loss of ADAM17 is associated with severe multiorgan dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical picture was suggestive of acrodermatitis enterohepathica but failed to respond to zinc supplementation."
    explanation: Clinical overlap with acrodermatitis enteropathica, excluded by zinc response and genetics.
- name: Netherton syndrome
  disease_term:
    preferred_term: Netherton syndrome
    term:
      id: MONDO:0009735
      label: Netherton syndrome
  distinguishing_features:
  - >-
    Neonatal erythroderma, hair abnormalities, failure to thrive and infections
    overlap; normal epidermal LEKTI staining and normal SPINK5 sequencing
    excluded it.
  evidence:
  - reference: PMID:25804906
    reference_title: Loss of ADAM17 is associated with severe multiorgan dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemistry on routine paraffin sections showed normal expression of lymphoepithelial Kazal type–related inhibitor (Lekti) in the epidermis, ruling out Netherton disease."
    explanation: LEKTI staining distinguishes the two.
- name: Microvillus inclusion disease
  disease_term:
    preferred_term: microvillus inclusion disease
    term:
      id: MONDO:0009635
      label: microvillus inclusion disease
  distinguishing_features:
  - >-
    Congenital intractable diarrhoea raises microvillus inclusion disease, but
    enterocyte brush-border microvilli were normal on electron microscopy and
    MYO5B sequencing was normal.
  evidence:
  - reference: PMID:25804906
    reference_title: Loss of ADAM17 is associated with severe multiorgan dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using Sanger sequencing, no pathogenic mutations could be identified in the coding regions of the genes SLC39A4 (acrodermatitis enterohepatica), SPINK5 (Netherton syndrome), and MYO5B (myosin 5B, microvillus inclusion disease)."
    explanation: The three main genetic mimics were excluded by sequencing.
- name: Congenital iRHOM2 (RHBDF2) deficiency
  distinguishing_features:
  - >-
    Biallelic loss of iRHOM2, the rhomboid protein that regulates ADAM17, also
    impairs ADAM17-dependent release of TNF and amphiregulin and causes
    recurrent infections of lung or colon, but the reported patients lacked
    the neonatal erythroderma and diarrhoea of NISBD1.
  notes: >-
    No MONDO term for this immunodeficiency was found: an OLS search of MONDO
    for "iRHOM2" returned nothing, and "RHBDF2" returned only the dominant
    palmoplantar keratoderma-esophageal carcinoma syndrome
    (MONDO:0007856).
  evidence:
  - reference: PMID:34937930
    reference_title: Congenital iRHOM2 deficiency causes ADAM17 dysfunction and environmentally directed immunodysregulatory disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss of iRHOM2, a rhomboid superfamily member that regulates the ADAM17 metalloproteinase, caused defective ADAM17-dependent cleavage and release of cytokines, including tumor-necrosis factor and amphiregulin."
    explanation: iRHOM2 deficiency impairs ADAM17 function and causes an overlapping immunodeficiency.

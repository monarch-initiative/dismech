pathophysiology:
- name: Biallelic CAST Loss of Function
  description: >-
    Homozygous or compound heterozygous truncating CAST variants (frameshift, nonsense,
    splice-site, and one large deletion) abolish calpastatin. Patient cells show reduced
    CAST transcript through nonsense-mediated decay, reduced protein, and reduced
    calpastatin inhibitory activity.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: CAST
    term:
      id: hgnc:1515
      label: CAST
  molecular_functions:
  - preferred_term: calpain inhibitor activity
    modifier: DECREASED
    term:
      id: GO:0010859
      label: calcium-dependent cysteine-type endopeptidase inhibitor activity
  evidence:
  - reference: PMID:25683118
    reference_title: "Loss-of-function mutations in CAST cause peeling skin, leukonychia, acral punctate keratoses, cheilitis, and knuckle pads."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified homozygous mutations (c.607dup, c.424A>T, and c.1750delG) in CAST, all of which were predicted to encode truncated proteins"
    explanation: All founding-family variants are biallelic truncating CAST alleles.
  - reference: PMID:25683118
    reference_title: "Loss-of-function mutations in CAST cause peeling skin, leukonychia, acral punctate keratoses, cheilitis, and knuckle pads."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemistry shows that staining of calpastatin is reduced in skin from affected individuals."
    explanation: Calpastatin protein is reduced in patient skin.
  - reference: PMID:31392520
    reference_title: "A novel homozygous nonsense mutation in CAST associated with PLACK syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Real-time qRT-PCR and immunoblot analysis showed reduced calpastatin expression in skin fibroblasts derived from both affected individuals compared to heterozygous family members. In vitro calpastatin activity assays also showed decreased activity in affected individuals."
    explanation: Patient fibroblasts show loss of calpastatin protein and inhibitory activity.
  - reference: PMID:37221445
    reference_title: "A patient with PLACK syndrome with a novel splicing mutation in CAST: the evidence for a loss-of-function mechanism through mis-splicing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Segregation and expression analysis revealed that this loss-of-function via mRNA nonsense-mediated decay could be the causative pathogenic mechanism responsible for this patient's phenotype."
    explanation: A splice variant causes loss of function through nonsense-mediated decay of CAST mRNA.
  downstream:
  - target: Unrestrained Calpain Proteolytic Activity
    causal_link_type: DIRECT
- name: Unrestrained Calpain Proteolytic Activity
  description: >-
    Calpastatin is the specific endogenous inhibitor of calpain-1 and calpain-2, so its
    loss is expected to leave calcium-activated calpain proteolysis unchecked. Calpain
    activity has not been measured in patient tissue, and the calpain substrates whose
    cleavage disrupts adhesion are not known; this node is inferred from the known
    function of calpastatin.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: calpain activity
    modifier: INCREASED
    term:
      id: GO:0004198
      label: calcium-dependent cysteine-type endopeptidase activity
  evidence:
  - reference: PMID:25683118
    reference_title: "Loss-of-function mutations in CAST cause peeling skin, leukonychia, acral punctate keratoses, cheilitis, and knuckle pads."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Calpastatin is an endogenous specific inhibitor of calpain, a calcium-dependent cysteine protease."
    explanation: >-
      States the inhibitor relationship from which increased calpain activity follows;
      the paper does not measure calpain activity itself.
  downstream:
  - target: Impaired Keratinocyte Intercellular Adhesion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:42256365
      reference_title: "Leukonychia and peeling skin in an 11-year-old girl."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Loss of calpastatin leads to unopposed calpain activity and excessive proteolysis of structural proteins, resulting in impaired epidermal barrier stability and the characteristic skin findings of PLACK syndrome."
      explanation: >-
        States the proposed calpain-to-epidermal-instability step; the calpain
        substrates involved have not been identified.
  - target: Keratinocyte Apoptosis
  - target: Cardiomyocyte Calpain Overactivity
    hypothesis_groups:
    - calpain_driven_cardiomyopathy
- name: Impaired Keratinocyte Intercellular Adhesion
  description: >-
    Lesional skin shows widened intercellular spaces in the upper stratum spinosum, and
    CAST knockdown in cultured keratinocytes impairs their adhesion. Loss of cohesion
    between suprabasal keratinocytes is the structural basis of the superficial
    peeling.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: epidermal keratinocyte
    term:

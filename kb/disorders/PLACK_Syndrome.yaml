name: PLACK Syndrome
creation_date: "2026-10-14T17:23:46Z"
category: Mendelian
description: >-
  PLACK syndrome (peeling skin, leukonychia, acral punctate keratoses, cheilitis and
  knuckle pads) is an ultra-rare autosomal recessive genodermatosis caused by biallelic
  loss-of-function variants in CAST, which encodes calpastatin, the endogenous inhibitor
  of the calcium-dependent cysteine proteases calpain-1 and calpain-2. Generalized
  superficial skin peeling begins in infancy, together with white nails, punctate
  keratoses of the palms and soles, inflamed lips and thickened skin over the finger
  joints. Lesional epidermis shows widened intercellular spaces and apoptotic
  keratinocytes in the upper stratum spinosum, so the skin disease is a defect of
  suprabasal keratinocyte adhesion. About a quarter of reported patients develop
  childhood-onset dilated cardiomyopathy, which is the main reported cause of death
  and of heart transplantation in this disease.
synonyms:
- PLACK syndrome
- peeling skin, leukonychia, acral punctate keratoses, cheilitis, and knuckle pads
- peeling skin-leukonuchia-acral punctate keratoses-cheilitis-knuckle pads syndrome
disease_term:
  preferred_term: PLACK syndrome
  term:
    id: MONDO:0014574
    label: peeling skin-leukonuchia-acral punctate keratoses-cheilitis-knuckle pads syndrome
parents:
- Peeling Skin Syndrome
notes: >-
  Curated separately from Peeling_Skin_Syndrome, where it appears as the PLACK-CAST
  subtype, because MONDO does not place MONDO:0014574 under peeling skin syndrome (MONDO:0019347), because the
  cleavage and apoptosis sit in the upper stratum spinosum rather than the stratum
  corneum, and because a subset of patients develop dilated cardiomyopathy, an organ
  system no other peeling skin subtype involves. No GeneReviews chapter covers this
  disease: a PubMed search for "(PLACK OR calpastatin OR peeling skin) AND
  genereviews[book]" returned no records.

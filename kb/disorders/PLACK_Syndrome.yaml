discussions:
- discussion_id: gap_plack_calpain_activity_untested
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is calpain activity increased in PLACK skin and myocardium, which calpain substrates
    mediate the adhesion and cardiac defects, and why do only some patients develop
    cardiomyopathy?
  rationale: >-
    Every node downstream of calpastatin loss rests on calpastatin's known biochemistry
    and on mouse calpain-overexpression models. No patient tissue has been assayed for
    calpain activity, no adhesion substrate has been identified, and no CAST-deficient
    animal with a skin or cardiac phenotype has been described. The incomplete,
    age-dependent cardiac penetrance has no explanation.
  attaches_to:
  - pathophysiology#Unrestrained Calpain Proteolytic Activity
  - pathophysiology#Cardiomyocyte Calpain Overactivity
references:
- reference: PMID:25683118
  title: "Loss-of-function mutations in CAST cause peeling skin, leukonychia, acral punctate keratoses, cheilitis, and knuckle pads."

  evidence:
  - reference: PMID:42256365
    reference_title: "Leukonychia and peeling skin in an 11-year-old girl."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Management of PLACK syndrome remains symptomatic and supportive, primarily with emollients and keratolytics."
    explanation: States the current standard of skin care.
- name: Intravenous Lipid Emulsion
  description: >-
    Monthly intravenous lipid emulsion (Vitalipid with Lipofundin MCT/LCT 20%) produced
    resolution of pruritus and marked skin improvement in one 11-year-old patient with
    low vitamin A and essential fatty acids. Single-patient report; no controlled data.
  dosing_interval: monthly
  dosing_interval_days: 30
  treatment_term:
    preferred_term: Intravenous lipid emulsion pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  notes: >-
    No therapeutic_agent is bound: NCIT:C79837 MCT/LCT Lipid Emulsion is not reachable
    from the ChemicalEntityTerm enum root NCIT:C1909 (Pharmacologic Substance), and
    binding one component such as soybean oil would misstate a two-product regimen.
  evidence:
  - reference: PMID:33410500
    reference_title: "PLACK syndrome is potentially treatable with intralipids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of an objective response to a therapeutic agent, which suggests that PLACK is a potentially treatable condition."
    explanation: Single-case report of objective response to intravenous lipid therapy.
- name: Heart Transplantation

- category: Cardiovascular
  name: Dilated Cardiomyopathy
  description: >-
    Childhood-onset dilated cardiomyopathy (onset 4 to 15 years) in 7 of 27 reported
    patients, progressing to heart failure; three died, three received heart
    transplants and one needed a biventricular assist device. Penetrance appears
    incomplete and possibly age-dependent: affected siblings with the skin phenotype
    and normal echocardiograms have been reported, and no genotype-phenotype
    correlation for cardiac involvement has been found. One further patient's
    cardiomyopathy is attributed to a separate MYBPC3 variant.

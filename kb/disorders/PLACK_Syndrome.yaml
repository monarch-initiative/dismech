- name: Cardiomyocyte Calpain Overactivity
  description: >-
    Proposed mechanism for the dilated cardiomyopathy seen in several PLACK families:
    calpastatin loss raises calpain activity in cardiomyocytes, degrading cytoskeletal
    and sarcomeric proteins and causing cardiomyocyte loss and fibrosis. Transgenic
    mice with cardiomyocyte-restricted calpain-1 or calpain-2 overexpression develop
    dilated cardiomyopathy. No patient myocardium has been examined for calpain
    activity, and the explanted-heart histology reported so far (hypertrophied
    cardiomyocytes, bizarre nuclei, fibrosis) is nonspecific.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  molecular_functions:
  - preferred_term: calpain activity
    modifier: INCREASED
    term:
      id: GO:0004198
      label: calcium-dependent cysteine-type endopeptidase activity
  evidence:
  - reference: PMID:42256365
    reference_title: "Leukonychia and peeling skin in an 11-year-old girl."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Excessive calpain activity may also lead to the degradation of key cytoskeletal proteins such as desmin and titin in myocardial fibers, leading to myocardial fibrosis and impaired contractility."
    explanation: The case authors propose calpain-mediated cardiomyocyte cytoskeletal degradation as the cardiac mechanism.
  - reference: PMID:30874894
    reference_title: "Increased calpain-1 in mitochondria induces dilated heart failure in mice: role of mitochondrial superoxide anion."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Transgenic up-regulation of mitochondria-targeted CAPN1 dose-dependently induced cardiac cell death, adverse myocardial remodeling, heart failure, and early death in mice"
    explanation: >-
      Excess mitochondrial calpain-1 in mouse cardiomyocytes causes cardiomyocyte
      death and heart failure; this is an overexpression model, not calpastatin loss.
  downstream:
  - target: Dilated Cardiomyopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - calpain_driven_cardiomyopathy
    evidence:
    - reference: PMID:35986214
      reference_title: "Sustained over-expression of calpain-2 induces age-dependent dilated cardiomyopathy in mice through aberrant autophagy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "transgenic over-expression of calpain-2 induces age-dependent dilated cardiomyopathy in mice, which may be mediated through aberrant autophagy and a reduction of junctophilin-2"
      explanation: >-
        Mouse evidence that cardiomyocyte calpain excess is sufficient for dilated
        cardiomyopathy; whether CAST-deficient human hearts follow the same path is
        untested.
mechanistic_hypotheses:
- hypothesis_group_id: calpain_driven_cardiomyopathy
  hypothesis_label: >-
    Unopposed cardiomyocyte calpain activity causes the dilated cardiomyopathy of
    PLACK syndrome
  status: EMERGING
  description: >-
    Dilated cardiomyopathy segregates with biallelic CAST loss in several families, with
    no other cardiomyopathy gene found in the best-studied one. The proposed link is
    unopposed calpain proteolysis in cardiomyocytes, which is supported only by mouse
    calpain-overexpression models. It has not been tested in patient tissue or in a
    CAST-deficient animal, and penetrance appears incomplete and age-dependent.
  evidence:
  - reference: PMID:41300744
    reference_title: "Severe Dilated Cardiomyopathy with PLACK Syndrome Caused by a Novel Truncating Variant in the CAST Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings expand the phenotypic spectrum of PLACK syndrome to include severe DCM and suggest CAST deficiency as a novel cause of recessively inherited cardiomyopathy."
    explanation: The family study proposes CAST deficiency as a cause of recessive cardiomyopathy.

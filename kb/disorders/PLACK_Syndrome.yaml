biochemical:
- name: Low vitamin A and essential fatty acids
  presence: DECREASED
  notes: >-
    Found in one patient and prompted intravenous lipid treatment; a further patient had
    severe protein-calorie malnutrition (PMID:42742298). Whether these follow from the
    epidermal defect or are coincidental is unknown.
  evidence:
  - reference: PMID:33410500
    reference_title: "PLACK syndrome is potentially treatable with intralipids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we demonstrate for the first time that this condition is associated with low levels of vitamin A and essential fatty acids"
    explanation: Reports the biochemical finding in a single CAST-confirmed patient.
genetic:
- name: CAST
  gene_term:
    preferred_term: CAST
    term:
      id: hgnc:1515
      label: CAST
  relationship_type: CAUSATIVE
  association: Autosomal recessive
  notes: >-
    Biallelic truncating variants (frameshift, nonsense, splice-site, and one large
    deletion in trans with a nonsense allele). c.571G>T (p.Gly191Ter) is the only
    variant reported in more than one family. No genotype-phenotype correlation for
    cardiac involvement has been found.
  evidence:
  - reference: PMID:25683118
    reference_title: "Loss-of-function mutations in CAST cause peeling skin, leukonychia, acral punctate keratoses, cheilitis, and knuckle pads."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "loss-of-function mutations in calpastatin (CAST) are the genetic causes of an autosomal-recessive condition characterized by generalized peeling skin, leukonychia, acral punctate keratoses, cheilitis, and knuckle pads"
    explanation: Establishes CAST as the causal gene.
  - reference: PMID:40387456
    reference_title: "Peeling Skin, Leukonychia, Acral Punctate Keratoses, Cheilitis and Knuckle Pads (PLACK) Syndrome: An Updated Review of Cases and Identification of a Recurrent CAST Variant in Two Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe two pediatric PLACK cases with a homozygous loss-of-function CAST variant (c.571G>T, p.Gly191Ter) which represents the only recurrent genetic variant of PLACK syndrome reported in the literature."
    explanation: Identifies the only recurrent CAST variant.
diagnosis:
- name: Molecular confirmation of biallelic CAST variants
  description: >-
    Diagnosis is suspected from the clinical pentad and confirmed by exome or genome
    sequencing; RNA studies can confirm splice and novel variants. Reduced calpastatin
    immunostaining in skin supports the diagnosis. Naxos and Carvajal syndromes, which
    combine palmoplantar keratoderma with cardiomyopathy, are distinguished by woolly
    hair.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:41300744
    reference_title: "Severe Dilated Cardiomyopathy with PLACK Syndrome Caused by a Novel Truncating Variant in the CAST Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GS, performed in three affected children, identified a novel homozygous frameshift variant in CAST (NM_001750.7:c.1177dup, p.Arg393Profs*4), which segregated with the disease within the family."
    explanation: Genome sequencing established the molecular diagnosis in this family.
  - reference: PMID:42256365
    reference_title: "Leukonychia and peeling skin in an 11-year-old girl."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Naxos and Carvajal syndromes are characterized by woolly hair, palmoplantar keratoderma, and right arrhythmogenic cardiomyopathy or left dilated cardiomyopathy, respectively. Woolly hair was not seen in our patient."
    explanation: Gives the clinical feature that separates PLACK from the keratoderma-cardiomyopathy differential.
- name: Lifelong Echocardiographic Surveillance
  description: >-
    Periodic echocardiography is suggested for all patients, because cardiomyopathy
    penetrance appears age-dependent and cannot be predicted from genotype.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:41300744
    reference_title: "Severe Dilated Cardiomyopathy with PLACK Syndrome Caused by a Novel Truncating Variant in the CAST Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given the possibility of age-dependent penetrance, lifelong cardiac surveillance is for the affected individuals suggested."
    explanation: Recommendation for lifelong cardiac surveillance.
treatments:
- name: Emollients and Keratolytics
  description: Symptomatic topical skin care, the mainstay of management.
  treatment_term:
    preferred_term: Supportive skin care with emollients and keratolytics
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    No therapeutic_agent is bound: NCIT:C467 Emollient is not reachable from the

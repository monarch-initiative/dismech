      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our findings suggest that DDX58 mutation leads to the overproduction of IFN-β, which elevates IOP by modulating autophagy through RSAD2 in TM cells."
      explanation: The authors' proposed route from the variant to raised intraocular pressure.

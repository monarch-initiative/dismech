    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Significantly higher K63-linked ubiquitination of RIG-I-D550Y was observed"
    explanation: The freed CARDs of the mutant are ubiquitinated.
  - reference: PMID:33495304
    reference_title: "DDX58(RIG-I)-related disease is associated with tissue-specific interferon pathway activation."

    modifier: INCREASED
  evidence:
  - reference: PMID:26609812
    reference_title: "ATP hydrolysis by the viral RNA sensor RIG-I prevents unintentional recognition of self-RNA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ATPase deficient RIG-I constitutively signals through endogenous RNA and co-purifies with self-RNA even from virus infected cells."
    explanation: Hydrolysis-deficient RIG-I stays on self-RNA and signals.
  - reference: PMID:26609812
    reference_title: "ATP hydrolysis by the viral RNA sensor RIG-I prevents unintentional recognition of self-RNA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ATP hydrolysis displaces wild-type RIG-I from this self-RNA but not from 5' triphosphate dsRNA."
    explanation: Hydrolysis is what removes normal RIG-I from self-RNA.
  - reference: PMID:30270105
    reference_title: "RIG-I Uses an ATPase-Powered Translocation-Throttling Mechanism for Kinetic Proofreading of RNAs and Oligomerization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ATP binding facilitates dsRNA engagement but, interestingly, makes RIG-I promiscuous, explaining the constitutive signaling by Singleton-Merten syndrome-linked mutants that bind ATP without hydrolysis."
    explanation: Transient-state kinetics give the same account of the ATPase-site variants.
  - reference: PMID:30047865
    reference_title: "Unified mechanisms for self-RNA recognition by RIG-I Singleton-Merten syndrome variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that a different, mechanistically unexplained SMS variant, C268F, which is localized in the ATP-binding P-loop, can signal independently of ATP but is still dependent on RNA."
    explanation: C268F is ATP-independent but RNA-dependent.
  - reference: PMID:30047865
    reference_title: "Unified mechanisms for self-RNA recognition by RIG-I Singleton-Merten syndrome variants."
    supports: SUPPORT

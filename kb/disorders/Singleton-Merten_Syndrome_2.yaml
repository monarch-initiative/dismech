name: Singleton-Merten Syndrome 2
creation_date: "2026-11-26T00:00:00Z"
category: Mendelian
description: >-
  Singleton-Merten syndrome 2 is an autosomal dominant type I interferonopathy
  caused by heterozygous gain-of-function missense variants in RIGI (previously
  DDX58), which encodes the cytosolic RNA sensor RIG-I. RIG-I normally detects
  viral double-stranded RNA carrying a 5' triphosphate or diphosphate and
  signals through MAVS to induce type I interferon; its RNA-dependent ATPase
  removes it from self-RNA. The disease variants either cripple that ATPase
  (C268F, E373A) or loosen the CARD2-Hel2i latch that keeps the signalling
  domains hidden (E510V, Q517H, D550A, D550Y), so the receptor signals on
  the cell's own RNA. Childhood-onset glaucoma is the most penetrant feature.
  Calcification of the aorta and of the aortic and mitral valves, psoriasiform
  rash, acro-osteolysis and other skeletal changes, tendon rupture and nail
  hypoplasia occur variably, and expression differs widely within families.
  The condition was first described as an "atypical" form without the dental
  anomalies of the IFIH1 form, but later families have delayed tooth eruption
  and early tooth loss.
notes: >-
  Entry scope. The entry is bound to MONDO:0014575 and covers Singleton-Merten
  syndrome caused by RIGI (hgnc:19102). The IFIH1 form (Singleton-Merten
  syndrome 1, MONDO:0024535) is a subtype row on
  IFIH1-Related_Type_1_Interferonopathy and is not repeated here. The numbered
  name is kept because it is the MONDO label and the OMIM title, and no
  gene-related name for this single disease is established.

  Gene symbol. HGNC renamed DDX58 to RIGI. The HGNC ontology build that
  term validation reads still labels hgnc:19102 as DDX58, so the gene
  bindings carry that label with RIGI as the preferred term; they are the
  same gene.

  Other RIGI diseases that are not part of this entry. A CARD2 variant, R109C,
  was reported in five unrelated families with lupus nephritis and no
  Singleton-Merten features (PMID:36261300); it is described as a gain of
  function through reduced autoinhibition, and it is present in gnomAD v4.1
  (14 alleles of about 1.46 million), unlike any Singleton-Merten variant. A
  motif VI variant, G731R, is a dominant-negative loss-of-function allele found
  in a patient with life-threatening COVID-19 (PMID:41822687). Neither is
  curated as a cause of this disease.

  Variant placement on the protein. Residue numbers are those of UniProt
  O95786 (925 residues), which is the numbering NM_014314 gives. Positions
  were checked by reading the residue at each number in the deposited
  coordinates of PDB 5E3H, 3ZD7, 4AY2, 7TNX and 4ON9; every modelled residue
  of 5E3H (642), 7TNX (647) and 4ON9 (514) is identical to O95786 at the same
  number. Distances quoted in the variant descriptions were computed from
  those coordinates as the shortest side-chain heavy-atom distance. In 5E3H
  (RIG-I with hairpin RNA, ADP and beryllium fluoride) the C268 side chain is
  4.1 angstroms from the ADP beta-phosphate (3.4 in 3ZD7, 4.9 in 4AY2), the
  E373 carboxylate is 3.1 angstroms from the beryllium fluoride that mimics
  the gamma-phosphate, and the E510 carboxylate is 2.3 angstroms from an RNA
  ribose 2'-hydroxyl (3.1 in the cryo-EM structure 7TNX). Q517 and D550 lie 7
  angstroms from the RNA backbone; D550 packs against E510, R546, K547 and
  Y566. No human structure contains the CARDs in the autoinhibited position,
  so the CARD2-Hel2i interface was read from full-length duck RIG-I (PDB
  4A2W) after a global alignment of duck (UniProt D3TI84) to human RIG-I (54
  percent identity). There the residues equivalent to human E510 and D550
  both contact the CARD2 residue equivalent to human K181, the residue
  equivalent to Q517 contacts CARD2 residues equivalent to human E113 and
  L185, and the residue equivalent to R109 contacts Hel2i residues equivalent
  to human 520 to 539. The duck mapping is an inference across species, not a
  measurement on the human protein. The AlphaFold model was not used: the
  AlphaFold file server was unreachable from the curation environment, and
  the experimental structures already cover residues 232 to 925.

  Conservation and constraint. In pairwise alignments to human RIG-I, E373,
  E510 and D550 are identical in mouse, pig, dog, duck, frog and zebrafish
  RIG-I, and E373 and E510 are also identical in human MDA5 and LGP2. C268 is
  serine in duck, frog and MDA5. Q517 is histidine in mouse RIG-I, the residue
  the human Q517H variant introduces, so that substitution is tolerated in the
  mouse sequence context. gnomAD v4.1 shows no constraint against loss of
  function in RIGI (pLI 0, observed/expected 0.90 with a 90 percent interval
  of 0.76 to 1.07; 92 observed against 102 expected), which fits a
  gain-of-function disease and argues against haploinsufficiency. None of
  C268F, E373A, E510V, Q517H, D550A or D550Y is in gnomAD v4.1.

  ClinVar. Among records confined to RIGI, ClinVar lists C268F and E373A as
  pathogenic and E510V as likely pathogenic for Singleton-Merten syndrome 2.
  It also lists E330K ("RIGI-related disorder") and L639P ("not provided") as
  likely pathogenic from single submitters; no publication describing either
  was found in PubMed searches for RIGI or DDX58 with Singleton-Merten, and
  they are not curated as variants here.

  Baseline source. No GeneReviews chapter covers this disease: PubMed searches
  of the GeneReviews book for Singleton-Merten in chapter titles and for RIGI
  or DDX58 in titles and abstracts returned nothing. Phenotypes are taken from
  the original family reports (PMID:25620203, PMID:30574673, PMID:33495304,
  PMID:38752537, PMID:41467011). ClinGen has not classified the RIGI
  gene-disease relationship in the cached export, and no Orphanet record names
  RIGI, so no external validity tier is recorded.

  Anifrolumab. A 2025 letter (PMID:40913606) reports treatment of this disease
  with anifrolumab, an antibody to the type I interferon receptor, in a
  patient with a novel RIGI variant. The letter has no abstract and its text
  was not retrievable, so it is recorded here as a lead and no treatment row
  is curated from it.

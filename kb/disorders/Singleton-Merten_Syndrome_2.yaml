    was raised in the D550Y patient and in the Q517H proband, and normal in
    every member of an E510V family, in whom the signature was confined to
    lesional skin.
  evidence:
  - reference: PMID:41467011
    reference_title: "A novel pathogenic mutation of DDX58 causes Singleton-Merten syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PBMCs from the patient showed elevated IFN signatures."
    explanation: Raised blood interferon signature with D550Y.
  - reference: PMID:33495304
    reference_title: "DDX58(RIG-I)-related disease is associated with tissue-specific interferon pathway activation."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "All family members had negative interferon scores, similar to healthy controls, with no correlation between interferon score and disease activity"
    explanation: Blood interferon scores were normal in an affected E510V family.
genetic:
- name: RIGI
  gene_term:
    preferred_term: RIGI
    term:
      id: hgnc:19102
      label: DDX58
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    RIGI (9p21.1; previous symbol DDX58) encodes RIG-I, a 925-residue
    cytosolic RNA sensor with two N-terminal CARDs (residues 1 to 172), a
    DECH-box helicase core made of Hel1 (ATP-binding domain, 251 to 430), the
    inserted Hel2i domain and Hel2 (610 to 776), and a C-terminal domain (794
    to 925) that recognises the 5' triphosphate RNA end. All disease variants
    are heterozygous missense gain-of-function changes in Hel1 or Hel2i. The
    gene is tolerant of loss-of-function variation.
  evidence:
  - reference: PMID:25620203
    reference_title: "Mutations in DDX58, which encodes RIG-I, cause atypical Singleton-Merten syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Taken together, our results demonstrate that DDX58 mutations cause atypical SMS manifesting with variable expression of glaucoma, aortic calcification, and skeletal abnormalities without dental anomalies."
    explanation: Discovery of the gene in two families.
  - reference: PMID:33495304
    reference_title: "DDX58(RIG-I)-related disease is associated with tissue-specific interferon pathway activation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified a novel DDX58 variant c.1529A>T p.(Glu510Val) that segregates with disease in two families with SGMRT2."
    explanation: Independent replication in two further families.
  variants:
  - name: NM_014314:c.803G>T (p.Cys268Phe)
    type: MISSENSE
    clinical_significance: PATHOGENIC
    description: >-
      Hel1, Walker A P-loop (motif I, ATP-binding residues 264 to 271). The
      cysteine side chain is 3.4 to 4.9 angstroms from the beta-phosphate of
      bound ADP in three crystal structures. Phenylalanine here pushes the
      helicase into the ATP-bound conformation without ATP. Found in a family
      with glaucoma and skeletal changes but no aortic calcification.
    evidence:
    - reference: PMID:25620203
      reference_title: "Mutations in DDX58, which encodes RIG-I, cause atypical Singleton-Merten syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Further analysis of DDX58 in 100 individuals with congenital glaucoma identified another variant (c.803G>T ... in a family who harbored neither dental anomalies nor aortic calcification but who suffered from glaucoma and skeletal abnormalities."
      explanation: Identification of the variant.
    - reference: PMID:25620203
      reference_title: "Mutations in DDX58, which encodes RIG-I, cause atypical Singleton-Merten syndrome."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Cys268 and Glu373 residues of DDX58 belong to ATP-binding motifs I and II, respectively, and these residues are predicted to be located closer to the ADP and RNA molecules than other nonpathogenic missense variants by protein structure analysis."
      explanation: Location of the residue in ATP-binding motif I.
  - name: NM_014314:c.1118A>C (p.Glu373Ala)
    type: MISSENSE
    clinical_significance: PATHOGENIC
    description: >-
      Hel1, DECH box (motif II, residues 372 to 375). E373 is the catalytic
      glutamate; its carboxylate is 3.1 angstroms from the gamma-phosphate
      mimic in the transition-state-like structure 5E3H, next to D372 on the
      magnesium ion. Alanine allows ATP binding but not hydrolysis. Found in a
      family with glaucoma, aortic calcification and skeletal abnormalities.
    evidence:
    - reference: PMID:25620203
      reference_title: "Mutations in DDX58, which encodes RIG-I, cause atypical Singleton-Merten syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "To identify genetic causes of the disease, we performed exome sequencing in this family and identified a variant (c.1118A>C ... of DDX58, whose protein product is also known as RIG-I."
      explanation: Identification of the variant.
    - reference: PMID:26609812
      reference_title: "ATP hydrolysis by the viral RNA sensor RIG-I prevents unintentional recognition of self-RNA."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here we report that SMS mutations phenocopy a mutation that allows ATP binding but prevents hydrolysis."
      explanation: Functional class of the variant.
  - name: NM_014314:c.1529A>T (p.Glu510Val)
    type: MISSENSE
    clinical_significance: LIKELY_PATHOGENIC
    description: >-
      Hel2i. In RNA-bound RIG-I the E510 carboxylate is 2.3 angstroms from an
      RNA ribose 2'-hydroxyl (5E3H) and neighbours R546, N549 and D550; in the
      autoinhibited duck structure the equivalent glutamate contacts CARD2.
      Found in two unrelated families, all affected members with juvenile
      open-angle glaucoma.
    evidence:
    - reference: PMID:33495304
      reference_title: "DDX58(RIG-I)-related disease is associated with tissue-specific interferon pathway activation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We have identified a novel DDX58 variant c.1529A>T p.(Glu510Val) that segregates with disease in two families with SGMRT2."
      explanation: Identification and segregation of the variant.
  - name: NM_014314:c.1551G>C (p.Gln517His)
    type: MISSENSE
    description: >-
      Hel2i, two helical turns from E510 on the same face. Q517 packs against
      I513, V514, F539 and T542 and lies 7 angstroms from the RNA backbone; in
      the duck autoinhibited structure the equivalent glutamine contacts
      CARD2. Found in a mother and son with the full classic picture: dental
      dysplasia, tendon rupture and severe cardiac calcification. Mouse RIG-I
      has histidine at this position.
    evidence:
    - reference: PMID:30574673
      reference_title: "DDX58 and Classic Singleton-Merten Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole exome sequencing in both mother and son revealed a heterozygous DDX58 variant NM_014314.3: c.1551G>C (p.Gln517His), confirmed by Sanger sequencing."
      explanation: Identification of the variant.
  - name: NM_014314:c.1649A>C (p.Asp550Ala)
    type: MISSENSE
    description: >-
      Hel2i. D550 packs against E510, R546, K547 and Y566 behind the RNA
      contact, and in the duck autoinhibited structure the equivalent
      aspartate contacts CARD2. Found in a family with childhood glaucoma.
    evidence:
    - reference: PMID:38752537
      reference_title: "DDX58 variant triggers IFN-β-induced autophagy in trabecular meshwork and influences intraocular pressure."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This study presented a novel DDX58 variant (c.1649A>C ... in a family with childhood glaucoma."
      explanation: Identification of the variant.
  - name: p.Asp550Tyr
    type: MISSENSE
    description: >-
      Same Hel2i residue as D550A, de novo in a 4-year-old with partial
      lipodystrophy, intracranial calcification and a raised blood interferon
      signature. The cDNA change is not given in the text retrieved.
    evidence:
    - reference: PMID:41467011
      reference_title: "A novel pathogenic mutation of DDX58 causes Singleton-Merten syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In this study, we identified a novel de novo variant in DDX58 (p.D550Y) in a patient with SMS."
      explanation: Identification of the variant.
animal_models:
- name: RIG-I E373A transgenic mouse
  species: Mouse
  genotype: Transgenic expression of human RIG-I E373A
  genes:
  - preferred_term: RIGI
    term:
      id: hgnc:19102
      label: DDX58
  description: >-
    Mice carrying the human E373A variant spontaneously develop psoriasis-like
    skin lesions that depend on IL-17A and respond to tofacitinib, and a
    lupus-like nephritis driven by local activation of the mutant receptor by
    Y-RNA in the kidney. Nephritis is not a described feature of the human
    syndrome, and the reports do not describe glaucoma, vascular
    calcification or skeletal disease in the mice.
  publication: PMID:33119735
  modeled_mechanisms:
  - target: Psoriasiform Skin Inflammation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Spontaneous psoriasis-like lesions with epidermal hyperplasia.
    limitations: >-
      The variant is expressed from a transgene on top of the endogenous mouse
      gene, so dosage differs from a heterozygous patient.
    evidence:
    - reference: PMID:33119735
      reference_title: "Psoriasis-like skin disorder in transgenic mice expressing a RIG-I Singleton-Merten syndrome variant."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We report the spontaneous development of psoriasis-like skin lesions as an SMS-like symptom in transgenic mice harboring one of the RIG-I SMS variants, E373A."
      explanation: The skin phenotype of the model.
  - target: Loss of ATP-Hydrolysis-Driven Self-RNA Proofreading
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The mutant receptor is activated in vivo by an endogenous RNA, Y-RNA,
      bound at its stem.
    limitations: >-
      The readout is nephritis, an organ not affected in the human syndrome,
      so the model shows the molecular step and not the human tissue
      distribution.
    evidence:
    - reference: PMID:41171879
      reference_title: "Local activation of mutant RIG-I by short noncoding Y-RNA in the kidney triggers lethal nephritis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Deletion of the most enriched Y-RNA species reduced RIG-I E373A-induced IFN-I responses."
      explanation: A specific self-RNA drives the mutant receptor in vivo.
    - reference: PMID:41171879
      reference_title: "Local activation of mutant RIG-I by short noncoding Y-RNA in the kidney triggers lethal nephritis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cryo-electron microscopy and molecular analyses revealed that RIG-I E373A binding to the Y-RNA stem region resulted in its activation."
      explanation: Structural basis of activation by the self-RNA.
  evidence:
  - reference: PMID:41171879
    reference_title: "Local activation of mutant RIG-I by short noncoding Y-RNA in the kidney triggers lethal nephritis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We observed that mice expressing the RIG-I patient variant E373A spontaneously developed lupus-like nephritis."
    explanation: The renal phenotype of the model.
treatments:
- name: Glaucoma surgery
  description: >-
    Intraocular pressure usually needs surgery: goniotomy or trabeculotomy
    first, then trabeculectomy or a drainage implant, often with continued
    topical pressure-lowering drops.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: glaucoma angle and drainage surgery
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Glaucoma
    term:
      id: HP:0000501
      label: Glaucoma
  evidence:
  - reference: PMID:37769987
    reference_title: "Glaucoma in a patient with Singleton-Merten syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both eyes were initially treated with goniotomies, trabeculotomies, and later Baerveldt glaucoma implants."
    explanation: Sequence of glaucoma operations in a child with the disease.
  - reference: PMID:30574673
    reference_title: "DDX58 and Classic Singleton-Merten Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At age 3 years, she developed glaucoma requiring seven surgical procedures."
    explanation: Surgical burden of the glaucoma.
- name: Ruxolitinib
  description: >-
    JAK inhibition blocks signalling from the interferon receptor. In the
    child with D550Y, ruxolitinib lowered the interferon signature and
    improved lipodystrophy and foot ulcers; the dose was raised after ocular
    signs and toe gangrene recurred, and the drug was later changed to
    upadacitinib with tocilizumab. This is a single patient and no trial
    exists. In E373A transgenic mice tofacitinib prevented and improved the
    skin disease.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: JAK inhibitor pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ruxolitinib
      term:
        id: CHEBI:66919
        label: ruxolitinib
  target_mechanisms:
  - target: Type I Interferon Overproduction and Interferon-Stimulated Gene Expression
    description: Blocks JAK signalling downstream of the type I interferon receptor.
  evidence:
  - reference: PMID:41467011
    reference_title: "A novel pathogenic mutation of DDX58 causes Singleton-Merten syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "JAK inhibitor therapy suppressed the IFN signal and partially relieved clinical symptoms in the patient."
    explanation: Partial clinical and molecular response in one patient.
  - reference: PMID:33119735
    reference_title: "Psoriasis-like skin disorder in transgenic mice expressing a RIG-I Singleton-Merten syndrome variant."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Of note, IL-17A deficiency abolished the skin phenotype, and treatment using the JAK inhibitor tofacitinib not only prevented onset, but also improved the skin manifestations even after onset."
    explanation: A different JAK inhibitor works on the skin disease of the mouse model.
differential_diagnoses:
- name: Singleton-Merten syndrome 1
  description: >-
    The IFIH1 form, curated as a subtype of
    IFIH1-Related_Type_1_Interferonopathy. Clinically overlapping; separated
    by gene.
  disease_term:
    preferred_term: Singleton-Merten syndrome 1
    term:
      id: MONDO:0024535
      label: Singleton-Merten syndrome 1
  distinguishing_features:
  - Heterozygous IFIH1 variant, classically R822Q
  - Dental anomalies are near constant in the IFIH1 form and variable in the RIGI form
  - Glaucoma is the most penetrant feature of the RIGI form
  evidence:
  - reference: PMID:28955379
    reference_title: "RIG-I-Like Receptor Signaling in Singleton-Merten Syndrome."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "SMS disease without hallmark dental anomalies, termed atypical SMS, has recently been reported caused by variants in DDX58, DEXD/H-box helicase 58."
    explanation: Review contrasting the IFIH1 and RIGI forms.
discussions:
- discussion_id: sms2_calcification_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does constitutive RIG-I signalling produce calcification of the
    arterial media and heart valves, and why is it absent in some families?
  rationale: >-
    Calcification is the cause of death in reported patients, yet the only
    mechanistic study is in mouse smooth muscle cells and mice. It proposes a
    cell-intrinsic RIG-I, MAVS and G3BP1 route to osteogenic gene expression.
    Whether patient vessels show this, whether secreted interferon is needed,
    and why the C268F family and young E510V carriers have no calcification
    are unknown.
  attaches_to:
  - pathophysiology#Vascular Smooth Muscle Osteogenic Signaling
  - phenotypes#Calcification of the aorta
  posed_by: "dismech curation (issue 19053)"
  posed_date: "2026-11-26T00:00:00Z"
- discussion_id: sms2_tissue_specificity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does a ubiquitously expressed, constitutively active RNA sensor
    damage the trabecular meshwork, vessel wall, skin, teeth and tendons while
    sparing most other tissues, and why can the blood interferon signature be
    normal?
  rationale: >-
    In mice the E373A receptor is activated in the kidney by a locally
    abundant Y-RNA, which suggests that the tissue pattern follows the
    distribution of activating self-RNAs. In human cells C268F RIG-I binds
    many RNA polymerase III transcripts and removing Y-RNAs alone does not
    stop signalling. The activating RNAs in human trabecular meshwork, vessel
    and dental tissue have not been identified.
  attaches_to:
  - pathophysiology#Loss of ATP-Hydrolysis-Driven Self-RNA Proofreading
  - pathophysiology#Type I Interferon Overproduction and Interferon-Stimulated Gene Expression
  evidence:
  - reference: PMID:42459549
    reference_title: "An autoinflammatory RIG-I variant causing Singleton-Merten syndrome associates with small non-coding Y-RNAs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Manipulation of Y-RNAs alone by targeting either Y-RNA transcripts or Y-RNA stabilizing proteins was insufficient to negate RIG-I induced interferon responses, hinting at a broader profile of RNA polymerase III-derived RNAs being influential in driving the sterile activation of gain-of-function RIG-I variants."
    explanation: Y-RNAs are not the only activating self-RNAs in human cells.
  posed_by: "dismech curation (issue 19053)"
  posed_date: "2026-11-26T00:00:00Z"
- discussion_id: sms2_genotype_phenotype
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Do the two structural classes of variant, ATPase-site and Hel2i, give
    different clinical pictures?
  rationale: >-
    The ATPase-site families (C268F, E373A) had no dental disease, and the
    Hel2i families (E510V, Q517H, D550A, D550Y) include the patients with
    dental dysplasia, tendon rupture and, in one child, intracranial
    calcification and lipodystrophy. With fewer than ten families the
    difference may be chance, and expression varies as much within the E510V
    families as between classes.
  attaches_to:
  - genetic#RIGI
  posed_by: "dismech curation (issue 19053)"
  posed_date: "2026-11-26T00:00:00Z"

mechanistic_hypotheses:
- hypothesis_group_id: rigi_mavs_vascular_osteogenic_signaling
  hypothesis_label: Cell-intrinsic RIG-I and MAVS signaling drives osteogenic reprogramming of vascular smooth muscle
  status: EMERGING
  description: >-
    Arterial and valvular calcification is proposed to arise inside vascular
    smooth muscle cells, where hyperactive RIG-I signals through MAVS and
    methylated G3BP1 to Wnt and NFATc4-dependent osteogenic genes, without
    requiring circulating interferon. The alternative is that calcification is
    a late consequence of systemic or local type I interferon. The hypothesis
    rests on one study in mouse cells and mice and has not been tested in
    patient tissue.
  evidence:
  - reference: PMID:29626090
    reference_title: "A GTPase-activating protein-binding protein (G3BP1)/antiviral protein relay conveys arteriosclerotic Wnt signals in aortic smooth muscle cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Gain-of-function SGMRT2/RIG-I mutants increased G3BP1 methylation and synergized with osteogenic transcription factors (Runx2 and NFATc4)."
    explanation: The observation on which the hypothesis is built.

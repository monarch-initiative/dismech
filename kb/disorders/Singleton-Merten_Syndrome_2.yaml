    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional assays revealed that DDX58 alterations confer constitutive activation and thus lead to increased interferon (IFN) activity and IFN-stimulated gene expression."
    explanation: The first two variants are constitutively active in cell assays.
  - reference: PMID:33495304
    reference_title: "DDX58(RIG-I)-related disease is associated with tissue-specific interferon pathway activation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional analysis showed that the DDX58 variant is a dominant gain-of-function activator of interferon pathways in the absence of exogenous RNA ligands."
    explanation: E510V is a dominant gain-of-function allele in a reporter assay.
  - reference: PMID:22000019
    reference_title: "Structural basis for the activation of innate immune pattern-recognition receptor RIG-I by viral RNA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Inactive RIG-I has an open conformation with the CARDs sequestered by a helical domain inserted between the two helicase moieties."
    explanation: Crystal structures show the autoinhibited state that the variants escape.
  - reference: PMID:22000019
    reference_title: "Structural basis for the activation of innate immune pattern-recognition receptor RIG-I by viral RNA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We propose that after initial binding of 5'ppp-dsRNA to the flexibly linked CTD, co-operative tight binding of ATP and RNA to the helicase domain liberates the CARDs for downstream signaling."
    explanation: Normal activation requires RNA and ATP to release the CARDs.

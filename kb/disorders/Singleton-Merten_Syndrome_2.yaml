- name: Vascular Smooth Muscle Osteogenic Signaling
  biological_scale: CELLULAR
  description: >-
    Proposed mechanism for the arterial and valvular calcification. In mouse
    aortic smooth muscle cells, RIG-I gain-of-function mutants increase
    arginine methylation of G3BP1 and cooperate with the osteogenic
    transcription factors Runx2 and NFATc4, and loss of G3BP1, RIG-I or MAVS
    lowers alkaline phosphatase activity and other osteogenic signals. This
    has not been examined in patient vessels, where autopsy shows calcification
    of the arterial media.
  cell_types:
  - preferred_term: aortic smooth muscle cell
    term:
      id: CL:0002539
      label: aortic smooth muscle cell
  locations:

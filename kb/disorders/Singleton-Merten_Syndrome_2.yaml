      explanation: Hydrogen-deuterium exchange on E510V and Q517H RIG-I shows the loosened latch.
- name: Loss of ATP-Hydrolysis-Driven Self-RNA Proofreading
  biological_scale: MOLECULAR
  description: >-
    RIG-I hydrolyses ATP only when RNA is bound, and hydrolysis is a
    proofreading step: it ejects the receptor from self-RNA faster than from
    5' triphosphate RNA, so only a genuine viral ligand holds RIG-I long
    enough to signal. C268 lies in the Walker A P-loop (motif I) beside the
    beta-phosphate of the bound nucleotide, and E373 is the glutamate of the
    DECH box (motif II) at the gamma-phosphate. E373A RIG-I binds ATP but does
    not hydrolyse it, stays bound to endogenous RNA and signals constitutively.
    C268F reaches the same end differently: the phenylalanine drives the
    helicase into the ATP-like closed conformation without ATP, but the mutant
    still needs RNA. The self-RNAs recovered with these mutants include a 60S
    ribosomal expansion segment and RNA polymerase III transcripts such as
    Y-RNAs.
  genes:
  - preferred_term: RIGI
    term:
      id: hgnc:19102
      label: DDX58
  molecular_functions:
  - preferred_term: ATP hydrolysis activity
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
    modifier: DECREASED
  - preferred_term: double-stranded RNA binding

      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our results indicate that ATP-hydrolysis prevents recognition of self-RNA and suggest that SMS mutations lead to unintentional signaling through prolonged RNA binding."
      explanation: Prolonged residence on self-RNA is what produces the unintended signal.
- name: Loosened CARD2-Hel2i Autoinhibition and RNA Gating
  biological_scale: MOLECULAR
  description: >-
    Hel2i has two jobs in resting RIG-I. It holds CARD2, which keeps the
    signalling domains out of reach of MAVS, and it gates the helicase
    against self-RNA, whose 5' cap and 2'-O-methylated first nucleotides
    normally exclude it. E510, Q517 and D550 sit together on the Hel2i face
    that does both: in the autoinhibited duck structure the equivalent
    residues touch CARD2, and in RNA-bound human RIG-I the E510 carboxylate
    lies on an RNA ribose hydroxyl with D550 packed behind it. Substitutions
    here loosen the CARD2 latch in the unliganded protein, let self-RNA
    through the gate and impair ATPase-dependent proofreading. D550Y RIG-I
    shows more K63-linked ubiquitination, the modification of the freed CARDs
    that precedes oligomerisation.

    reference_title: "A loosened gating mechanism of RIG-I leads to autoimmune disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results reveal HEL2i as a unique checkpoint directing two specialized functions, i.e. stabilizing the CARD2-HEL2i interface and gating the helicase from incoming self RNAs"
    explanation: The two functions of Hel2i that the E510V and Q517H variants disturb.
  - reference: PMID:41467011
    reference_title: "A novel pathogenic mutation of DDX58 causes Singleton-Merten syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO

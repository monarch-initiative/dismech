- name: Interferon-Induced Trabecular Meshwork Cell Loss
  biological_scale: TISSUE
  conforms_to: "glaucoma_optic_neuropathy#Trabecular Meshwork Outflow Dysfunction"
  description: >-
    The trabecular meshwork drains aqueous humour and sets intraocular
    pressure. Meshwork cells expressing C268F or E373A RIG-I die in culture.
    Interferon-beta reduces meshwork cell viability by inducing autophagy
    through the interferon-stimulated gene RSAD2, and interferon-beta injected
    into the mouse anterior chamber raises intraocular pressure, an effect
    blunted by chloroquine.
  cell_types:

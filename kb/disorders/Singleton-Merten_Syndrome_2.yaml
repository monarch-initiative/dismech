    term:
      id: hgnc:30908
      label: RSAD2
  evidence:
  - reference: PMID:25620203
    reference_title: "Mutations in DDX58, which encodes RIG-I, cause atypical Singleton-Merten syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In addition, when we transduced primary human trabecular meshwork cells with c.803G>T (p.Cys268Phe) and c.1118A>C (p.Glu373Ala) mutants, cytopathic effects and a significant decrease in cell number were observed."
    explanation: Mutant RIG-I is toxic to human trabecular meshwork cells.
  - reference: PMID:38752537
    reference_title: "DDX58 variant triggers IFN-β-induced autophagy in trabecular meshwork and influences intraocular pressure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In addition, anterior chamber injection of IFN-β remarkably increased IOP level in mice, which can be attenuated by treatments with autophagy inhibitor chloroquine."
    explanation: Interferon-beta raises intraocular pressure in vivo through autophagy.

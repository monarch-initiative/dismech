pathophysiology:
- name: Heterozygous RIGI Gain-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    RIG-I is a cytosolic pattern recognition receptor. Its helicase core
    (Hel1, the inserted Hel2i domain, and Hel2) and C-terminal domain bind the
    blunt end of double-stranded RNA bearing a 5' triphosphate, and its two
    N-terminal CARDs carry the signal. Without ligand the CARDs are held
    against Hel2i; cooperative binding of RNA and ATP closes the helicase
    around the RNA and frees the CARDs. Every variant that causes this disease
    is a heterozygous missense change in the helicase core that lets this
    switch be thrown without viral RNA. The variants fall at two sites: the
    ATP-hydrolysis centre of Hel1, and the Hel2i surface that both holds CARD2
    and meets incoming RNA. RIGI tolerates loss-of-function variants in the
    population, so reduced dosage is not the mechanism.
  genes:
  - preferred_term: RIGI
    term:
      id: hgnc:19102
      label: DDX58
  molecular_functions:
  - preferred_term: pattern recognition receptor activity
    term:
      id: GO:0038187
      label: pattern recognition receptor activity
    modifier: GAIN_OF_FUNCTION

    explanation: Crystal structure of the mutant shows the ATP-like conformation.
  - reference: PMID:42459549
    reference_title: "An autoinflammatory RIG-I variant causing Singleton-Merten syndrome associates with small non-coding Y-RNAs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "irCLIP identified a broad array of self-RNAs, primarily those transcribed by RNA polymerase III, that were bound to RIG-I."
    explanation: Identity of the self-RNAs bound by C268F RIG-I in cells.
  downstream:
  - target: Constitutive RIG-I Signaling Through MAVS
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26609812

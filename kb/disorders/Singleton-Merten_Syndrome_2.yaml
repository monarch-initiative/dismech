      explanation: Loss of autoinhibition leads to signalling through MAVS.
- name: Constitutive RIG-I Signaling Through MAVS
  biological_scale: CELLULAR
  description: >-
    Released CARDs are modified with K63-linked ubiquitin, assemble into a
    tetramer and nucleate filaments of the mitochondrial adaptor MAVS. MAVS
    recruits TBK1 and the IKK complex, which activate IRF3, IRF7 and NF-kB.
    In this disease the cascade runs at a low constitutive level on self-RNA
    and responds more strongly than normal to RNA ligand.

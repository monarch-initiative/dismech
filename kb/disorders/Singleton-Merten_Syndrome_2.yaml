      explanation: The disease variants behave like an engineered hydrolysis-dead RIG-I.
  - target: Loosened CARD2-Hel2i Autoinhibition and RNA Gating
    causal_link_type: DIRECT
    description: Applies to the Hel2i variants E510V, Q517H, D550A and D550Y.

prevalence:
- population: Published HTRA1 disorder cases (literature review to 2020)
  measure_type: CASES_IN_LITERATURE
  notes: >-
    No population prevalence has been measured for either form. A 2020 literature review assembled 46
    symptomatic heterozygous carriers and 28 CARASIL patients. Among Japanese patients with severe or
    familial cerebral small vessel disease, HTRA1 variants were the second most common monogenic cause
    after NOTCH3; in a Taiwanese cohort heterozygous HTRA1 variants explained 2.08% (7/337) of small vessel
    disease, and 4.97% of probands with familial small vessel disease of unknown aetiology in a European cohort.
  evidence:
  - reference: PMID:32719647
    reference_title: "HTRA1-Related Cerebral Small Vessel Disease: A Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Forty-six symptomatic carriers and 28 patients with CARASIL were investigated."
    explanation: Size of the published case series available to the review.
  - reference: PMID:29895533
    reference_title: Characterization of Heterozygous HTRA1 Mutations in Taiwanese Patients With Cerebral Small Vessel Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Heterozygous HTRA1 mutations account for 2.08% (7 of 337) of SVD in Taiwan."
    explanation: Proportion of small vessel disease explained by heterozygous HTRA1 variants in one cohort.
  - reference: PMID:26063658
    reference_title: Heterozygous HTRA1 mutations are associated with autosomal dominant cerebral small vessel disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Ten probands of 201 additional unrelated and affected probands (4.97%) harboured a heterozygous HTRA1 mutation predicted to be damaging."
    explanation: Proportion of familial small vessel disease probands with heterozygous HTRA1 variants.
  - reference: PMID:36261288
    reference_title: High frequency of HTRA1 AND ABCC6 mutations in Japanese patients with adult-onset cerebral small vessel disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "CADASIL accounted for nearly 60% of the patients, followed by HTRA1-related CSVD in approximately a quarter of the patients."
    explanation: HTRA1 is the second most frequent monogenic cause in a Japanese cohort.
genetic:
- name: HTRA1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: HTRA1
    term:
      id: hgnc:9476
      label: HTRA1
  notes: >-
    Heterozygous disease alleles include missense variants such as p.R166L, p.G283E, p.P285L, p.R302Q and
    p.T319I, and nonsense or frameshift variants that undergo nonsense-mediated decay. Heterozygous missense
    variants cluster in the linker region and the loop 3/loop D activation domains, whereas CARASIL missense
    variants lie more often elsewhere in the protease domain. The same allele can cause CARASIL when
    homozygous and HTRA1-CSVD when heterozygous (p.P275L, p.A252T). Not every rare missense variant is
    pathogenic; protease activity, trimer formation and segregation are used to establish pathogenicity.
    The local ClinGen cache holds no gene-disease validity record for HTRA1, so no validity tier is
    recorded.
  evidence:
  - reference: PMID:19387015
    reference_title: Association of HTRA1 mutations and familial ischemic cerebral small-vessel disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Sequence analysis revealed two nonsense mutations and two missense mutations in HTRA1."
    explanation: Founding CARASIL alleles.
  - reference: PMID:26063658
    reference_title: Heterozygous HTRA1 mutations are associated with autosomal dominant cerebral small vessel disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "There was a highly significant difference in the number of likely deleterious variants in cases compared to controls"
    explanation: Case-control burden supports causality of heterozygous variants.
  - reference: PMID:34270682
    reference_title: Heterozygous HTRA1 nonsense or frameshift mutations are pathogenic.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Altogether, our findings strongly suggest that heterozygous HTRA1 stop codons are pathogenic through a haploinsufficiency mechanism."
    explanation: Heterozygous truncating alleles are pathogenic.
  - reference: PMID:32719647
    reference_title: "HTRA1-Related Cerebral Small Vessel Disease: A Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Missense mutations in symptomatic carriers were frequently located in the linker region or L3/LD domain, whereas missense mutations in CARASIL patients were more frequently located in the protease domain and rarely in the L3/LD domain."
    explanation: Allele location differs between the two forms.
  - reference: PMID:36530220
    reference_title: Severe Cerebral Small Vessel Disease Caused by the Uniallelic p.A252T Variant of HTRA1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "However, our study revealed that patients with uniallelic p.A252T can have severe and young-onset CSVD."
    explanation: An allele first reported homozygous in CARASIL also causes disease when heterozygous.
pathophysiology:
- name: HTRA1 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Nonsense and frameshift HTRA1 alleles are degraded by nonsense-mediated mRNA decay, so heterozygous
    carriers make about half the normal amount of HTRA1. In CARASIL, a homozygous nonsense allele abolished
    HTRA1 protein by the same route.
  evidence:
  - reference: PMID:34270682
    reference_title: Heterozygous HTRA1 nonsense or frameshift mutations are pathogenic.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Messenger RNA analysis performed in eight patients showed a degradation of the mutated allele strongly suggesting a haploinsufficiency."
    explanation: Patient mRNA shows decay of the truncating allele.
  - reference: PMID:32017060
    reference_title: HTRA1 expression profile and activity on TGF-β signaling in HTRA1 mutation carriers.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "We found a 50% reduction of HTRA1 expression in HTRA1 mutation carriers compared to the control."
    explanation: Carrier fibroblasts express half the normal HTRA1.
  - reference: PMID:19387015
    reference_title: Association of HTRA1 mutations and familial ischemic cerebral small-vessel disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The other nonsense mutation resulted in the loss of HTRA1 protein by nonsense-mediated decay of messenger RNA."
    explanation: A biallelic CARASIL nonsense allele removes HTRA1 protein by mRNA decay.
  downstream:
  - target: HTRA1 Serine Protease Loss of Function
    description: Less HTRA1 protein means less protease activity in the vessel wall.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32017060
      reference_title: HTRA1 expression profile and activity on TGF-β signaling in HTRA1 mutation carriers.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: "Our results suggest that each heterozygous HTRA1 missense mutation displays a different and peculiar HTRA1 expression pattern and that CSVD phenotype may also result from 50% of HTRA1 expression."
      explanation: Authors propose that halved HTRA1 expression is sufficient for disease; protease activity was not measured here.
- name: Dominant-Negative Disruption of HTRA1 Trimer Activation
  biological_scale: MOLECULAR
  description: >-
    HTRA1 works as a homotrimer in which each subunit activates its neighbour through the loop 3 sensor and
    loop D activation domains. Many missense proteins found in symptomatic heterozygotes either fail to form
    trimers or carry substitutions in loop D or loop 3, and inhibit the activity of co-expressed wild-type
    HTRA1. Most CARASIL missense proteins tested did not inhibit wild-type HTRA1.
  biological_processes:
  - preferred_term: protein homotrimerization
    term:
      id: GO:0070207
      label: protein homotrimerization
    modifier: DECREASED
  evidence:
  - reference: PMID:27164673
    reference_title: Distinct molecular mechanisms of HTRA1 mutants in manifesting heterozygotes with CARASIL.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Wild-type HTRA1 forms trimers; however, G283E and T319I HTRA1, observed in manifesting heterozygotes, did not form trimers."
    explanation: Two heterozygous-disease missense proteins fail to trimerize; this is the basis for the reduced homotrimerization annotation.
  - reference: PMID:31316458
    reference_title: HTRA1 Mutations Identified in Symptomatic Carriers Have the Property of Interfering the Trimer-Dependent Activation Cascade.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Together with our previous work, 10 of 11 hetero-HTRA1s and two of six CARASIL-HTRA1s were either defective in trimerization or had mutations in the LD or L3 domain (P = 0.006)."
    explanation: Trimerization or activation-loop defects are typical of heterozygous-disease alleles.
  downstream:
  - target: HTRA1 Serine Protease Loss of Function
    description: The mutant subunit lowers the activity of wild-type HTRA1 as well as its own.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27164673
      reference_title: Distinct molecular mechanisms of HTRA1 mutants in manifesting heterozygotes with CARASIL.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "These mutant HTRA1s showed markedly decreased protease activities and inhibited wild-type HTRA1 activity"
      explanation: Mixing assays show inhibition of wild-type protease activity by heterozygous-disease mutants.
    - reference: PMID:31316458
      reference_title: HTRA1 Mutations Identified in Symptomatic Carriers Have the Property of Interfering the Trimer-Dependent Activation Cascade.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "Conclusions: HTRA1 mutations identified in symptomatic carriers have the property of interfering the trimer-dependent activation cascade of HTRA1."
      explanation: Authors' conclusion linking the trimer defect to reduced activation of HTRA1.
- name: HTRA1 Serine Protease Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Disease alleles of both forms reduce HTRA1 serine protease activity, measured in casein assays of
    recombinant mutant proteins. HTRA1 is a primarily secreted protease that processes extracellular matrix
    proteins and regulates TGF-beta family signalling.
  genes:
  - preferred_term: HTRA1
    term:
      id: hgnc:9476
      label: HTRA1
  molecular_functions:
  - preferred_term: serine-type endopeptidase activity
    term:
      id: GO:0004252
      label: serine-type endopeptidase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:19387015
    reference_title: Association of HTRA1 mutations and familial ischemic cerebral small-vessel disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "The missense mutations and one of the nonsense mutations resulted in protein products that had comparatively low levels of protease activity and did not repress signaling by the TGF-beta family."
    explanation: CARASIL mutant proteins have low protease activity.
  - reference: PMID:26063658
    reference_title: Heterozygous HTRA1 mutations are associated with autosomal dominant cerebral small vessel disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "In vitro activity analysis of HTRA1 mutants demonstrated a loss of function effect."
    explanation: Heterozygous-disease mutants lose activity.
  - reference: PMID:29895533
    reference_title: Characterization of Heterozygous HTRA1 Mutations in Taiwanese Patients With Cerebral Small Vessel Disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "All mutations significantly compromise the HTRA1 protease activities."
    explanation: Seven further heterozygous alleles reduce protease activity.
  downstream:
  - target: Vascular Matrisome Protein Accumulation
    description: HTRA1 substrates of the extracellular matrix are no longer cleared and accumulate in the small-artery wall.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34779414
      reference_title: Candesartan prevents arteriopathy progression in cerebral autosomal recessive arteriopathy with subcortical infarcts and leukoencephalopathy model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "In the thickened intima, matrisome proteins, including the hub protein fibronectin (FN) and latent TGF-β binding protein 4 (LTBP-4), which are substrates of HTRA1, accumulated."
      explanation: HTRA1 substrates accumulate in cerebral arteries of HTRA1-null mice.
    - reference: PMID:29725820
      reference_title: CADASIL brain vessels show a HTRA1 loss-of-function profile.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Indeed, a comparison with the brain vessel proteome of HTRA1 knockout mice (n = 5) revealed a highly significant overlap of 18 enriched proteins (p = 2.2 × 10-16), primarily representing secreted and extracellular matrix factors."
      explanation: HTRA1-null brain vessels are enriched for secreted and matrix proteins, several shown to be HTRA1 substrates.
  - target: Dysregulated TGF-beta Signaling
    description: HTRA1 normally controls TGF-beta bioavailability; mutant HTRA1 fails to do so.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19387015
      reference_title: Association of HTRA1 mutations and familial ischemic cerebral small-vessel disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "The missense mutations and one of the nonsense mutations resulted in protein products that had comparatively low levels of protease activity and did not repress signaling by the TGF-beta family."
      explanation: CARASIL mutants lose the ability to repress TGF-beta family signalling.
    - reference: PMID:25369932
      reference_title: Cerebral small vessel disease-related protease HtrA1 processes latent TGF-β binding protein 1 and facilitates TGF-β signaling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "Cleavage occurs at physiological protease concentrations, is prevented under HtrA1-deficient conditions as well as by CARASIL mutations and disrupts both LTBP-1 binding to fibronectin and its incorporation into the extracellular matrix."
      explanation: Loss of HTRA1 cleavage of LTBP-1 alters TGF-beta bioavailability, here towards attenuated signalling.
  - target: Increased NOTCH3 Signaling in Vascular Smooth Muscle
    description: Loss of HTRA1 raises the NOTCH3 ligand JAG1 and NOTCH3 signalling in vascular smooth muscle cells.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31796853
      reference_title: Loss of the serine protease HTRA1 impairs smooth muscle cells maturation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "Mechanistically, loss of HTRA1 increased JAG1 protein levels and NOTCH3 signaling activity in VSMC."
      explanation: HTRA1 silencing in human arterial smooth muscle cells increases JAG1 and NOTCH3 activity.
  - target: Impaired Vascular Smooth Muscle Contractile Differentiation
    description: HTRA1 is required for smooth muscle cells to reach the contractile phenotype.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

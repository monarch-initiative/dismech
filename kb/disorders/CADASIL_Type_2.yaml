mappings:
  mondo_mappings:
  - term:
      id: MONDO:0010829
      label: cerebral arteriopathy, autosomal recessive, with subcortical infarcts and leukoencephalopathy 2
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0010829 is the biallelic HTRA1 disease (CARASIL, OMIM:600142). MONDO places it as the only
      descendant of MONDO:0014768, whose definition is any CADASIL caused by HTRA1 variation. This entry
      carries CARASIL as a subtype, so the recessive MONDO concept is narrower than the entry.
  - term:
      id: MONDO:0007432
      label: cerebral arteriopathy with subcortical infarcts and leukoencephalopathy
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0007432 is the parent grouping term (OMIMPS:125310) that also subsumes CADASIL type 1
      (NOTCH3, curated as CADASIL_Type_1) and ARCASIL. This entry curates HTRA1 only, so the parent is
      broader and must not be retired from the curation queue by this entry, matching how CADASIL_Type_1
      maps it.

    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Considering the semi-dominant inheritance of HTRA1-related phenotypes, genetic testing and clinical follow-up must be offered for all members of a family with HTRA1 mutations regardless of symptoms."
    explanation: Within one family the same allele causes CARASIL in homozygotes and CADASIL type 2 in heterozygotes.

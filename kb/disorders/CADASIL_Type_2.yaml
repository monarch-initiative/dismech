animal_models:
- name: Htra1 knockout mouse
  species: Mouse
  genotype: Htra1-/- (homozygous null)
  publication: PMID:34779414
  description: >-
    Htra1-null mice develop CARASIL-like cerebral arteriopathy with intimal thickening, abnormal elastic lamina,
    vasodilation and accumulation of matrisome proteins, with reduced arterial distensibility and cortical
    blood flow. Their smooth muscle cells fail to mature to the contractile phenotype. One study found normal
    cerebral arteries and an aortic phenotype in the same knockout, and no leukoencephalopathy on myelin stain.
  modeled_mechanisms:
  - target: Vascular Matrisome Protein Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Matrisome substrates accumulate in the thickened intima.
    limitations: >-
      Models the biallelic null state, so it informs CARASIL more than heterozygous disease, and mice lack the
      decades of vascular risk exposure that modify human penetrance.
    evidence:
    - reference: PMID:34779414
      reference_title: Candesartan prevents arteriopathy progression in cerebral autosomal recessive arteriopathy with subcortical infarcts and leukoencephalopathy model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "In the thickened intima, matrisome proteins, including the hub protein fibronectin (FN) and latent TGF-β binding protein 4 (LTBP-4), which are substrates of HTRA1, accumulated."
      explanation: Direct observation in the model.
  - target: Intimal Thickening of Cerebral Small Arteries
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Intimal thickening and abnormal elastic lamina in cerebral arteries.
    limitations: >-
      An independent study of the same knockout reported normal cerebral arteries, so the cerebral phenotype
      may depend on background or age.
    evidence:
    - reference: PMID:34779414
      reference_title: Candesartan prevents arteriopathy progression in cerebral autosomal recessive arteriopathy with subcortical infarcts and leukoencephalopathy model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Here, we show that HTRA1-/- mice exhibited features of CARASIL-associated arteriopathy: intimal thickening, abnormal elastic lamina, and vasodilation."
      explanation: Cerebral arteriopathy in the model.
    - reference: PMID:29768431
      reference_title: Loss of HtrA1 serine protease induces synthetic modulation of aortic vascular smooth muscle cells.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Although their cerebral arteries were normal, the thoracic aorta was affected in HtrA1-/- mice."
      explanation: A second study found no cerebral arteriopathy in the knockout.
  - target: Impaired Vascular Smooth Muscle Contractile Differentiation
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: Smooth muscle cells remain immature with impaired vasoconstriction.
    limitations: Shown partly in aortic and umbilical-artery smooth muscle rather than cerebral small arteries.
    evidence:
    - reference: PMID:31796853
      reference_title: Loss of the serine protease HTRA1 impairs smooth muscle cells maturation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "As a result, VSMC adopted an immature phenotype with impaired arterial vasoconstriction in Htra1-deficient mice."
      explanation: In vivo smooth muscle phenotype.
  - target: Reduced Cerebral Arterial Distensibility
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: TISSUE
    description: Reduced cerebral arterial distensibility and cortical blood flow.
    limitations: Not yet measured in patients, so fidelity to human disease is unknown.
    evidence:
    - reference: PMID:34779414
      reference_title: Candesartan prevents arteriopathy progression in cerebral autosomal recessive arteriopathy with subcortical infarcts and leukoencephalopathy model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "In addition, the mice exhibited reduced distensibility of the cerebral arteries and blood flow in the cerebral cortex."
      explanation: Functional vascular readout in the model.
  evidence:

diagnosis:
- name: HTRA1 molecular genetic testing
  description: >-
    The diagnosis is established by finding a heterozygous or biallelic pathogenic HTRA1 variant, usually on a
    small vessel disease gene panel or exome after NOTCH3. Because not every rare missense variant is
    pathogenic, protease activity, trimer formation and segregation are assessed for novel missense variants,
    and mRNA analysis can confirm decay of truncating alleles.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: Heterozygous (HTRA1-CSVD) or biallelic (CARASIL) pathogenic HTRA1 variant(s).
  evidence:
  - reference: PMID:20437615
    reference_title: HTRA1 Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of HTRA1 disorder is established in a proband by identification of either a heterozygous or biallelic pathogenic variant(s) in HTRA1 on molecular genetic testing."
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:32196841
    reference_title: "Monogenic cerebral small-vessel diseases: diagnosis and therapy. Consensus recommendations of the European Academy of Neurology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In order to establish pathogenicity of a HTRA1 variant, the activity of the mutated enzyme and its ability to form trimers should be evaluated, as well as whether it segregates with disease within a family."
    explanation: Consensus advice on variant interpretation.
  - reference: PMID:36261288
    reference_title: High frequency of HTRA1 AND ABCC6 mutations in Japanese patients with adult-onset cerebral small vessel disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Third, HTRA1 genetic testing is performed in the remaining patients without mutations in NOTCH3."
    explanation: Proposed testing order in adult-onset monogenic small vessel disease.
- name: Brain MRI
  description: >-
    MRI shows confluent white matter hyperintensities, lacunes and microbleeds. Early CARASIL lesions involve the
    frontal white matter, external capsule and pons, and an arc-shaped pontine to middle cerebellar peduncle
    lesion appears late. On susceptibility-weighted imaging, five or more hypointense dots around the midbrain
    (the chocolate chip sign) distinguished HTRA1-related disease from other small vessel disease. CARASIL is
    suspected in recurrent unexplained lacunar strokes with severe white matter hyperintensities, especially with
    premature alopecia, lumbago or spondylosis.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: Confluent white matter hyperintensities, lacunes, microbleeds, arc sign (advanced CARASIL), chocolate chip sign on SWI.
  evidence:
  - reference: PMID:26138950
    reference_title: Characteristic features and progression of abnormalities on MRI for CARASIL.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The arc sign was a characteristic finding for CARASIL in the advanced stage."
    explanation: Characteristic late CARASIL imaging sign.
  - reference: PMID:40017561
    reference_title: "\"Chocolate Chip Sign\" on Susceptibility-Weighted Imaging: A Novel Neuroimaging Biomarker for HTRA1-Related Cerebral Small Vessel Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "A threshold of 5 or more dots, termed the Chocolate Chip Sign, demonstrated optimal sensitivity and specificity for differentiating HRSVD (area under the curve [AUC]: 0.817; 95% confidence interval [CI]: 0.624–1.00; Figure 2D, eTable 4), which remained significant even after adjusting for disease duration and hypertension (Table 2)."
    explanation: SWI sign distinguishing HTRA1-related disease.
  - reference: PMID:32196841
    reference_title: "Monogenic cerebral small-vessel diseases: diagnosis and therapy. Consensus recommendations of the European Academy of Neurology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "CARASIL should be suspected in cases of recurrent unexplained lacunar strokes with severe WMHs"
    explanation: Consensus clinical and imaging trigger for testing.

  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic pathogenic variants cause classic CARASIL. Sibs of an affected individual have a 25% risk
    of being affected and a 50% risk of being heterozygous; heterozygous relatives may themselves develop
    HTRA1-CSVD, so the two forms can segregate in one family (semidominant pattern).
  evidence:
  - reference: PMID:20437615
    reference_title: HTRA1 Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "HTRA1 disorder caused by biallelic pathogenic variants (i.e., the classic CARASIL phenotype) is inherited in an autosomal recessive manner."
    explanation: GeneReviews states recessive inheritance for the biallelic form.
  - reference: PMID:20437615
    reference_title: HTRA1 Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "At conception, each sib of an affected individual has a 25% chance of inheriting both HTRA1 pathogenic variants and being affected, a 50% chance of inheriting one pathogenic variant and being heterozygous, and a 25% chance of inheriting neither pathogenic variant and not being at risk for HTRA1 disorder."
    explanation: Recurrence risk for the recessive form.
  - reference: PMID:34303089
    reference_title: "One Disease with two Faces: Semidominant Inheritance of a Novel HTRA1 Mutation in a Consanguineous Family."

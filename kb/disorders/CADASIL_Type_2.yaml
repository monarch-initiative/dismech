differential_diagnoses:
- name: CADASIL type 1 (NOTCH3)
  description: >-
    Shares dominant inheritance, stroke, cognitive decline, white matter hyperintensities, lacunes and
    microbleeds. Anterior temporal pole involvement is more common in NOTCH3 disease, and spine disorders more
    common in heterozygous HTRA1 disease; only genetic testing reliably separates them.
  evidence:
  - reference: PMID:40607620
    reference_title: Comparison of clinical and imaging features of cerebral small vessel disease associated with heterozygous HTRA1 and NOTCH3 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Temporal pole WMH involvement can occur in HTRA1-AD-cSVD but is more common in CADASIL."
    explanation: Imaging overlap and difference.
  - reference: PMID:36047879
    reference_title: Novel mutations in HTRA1-related cerebral small vessel disease and comparison with CADASIL.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Patients with heterozygous HTRA1‐related CSVD had a higher proportion of spine disorders and a lower proportion of WMH involving the anterior temporal lobe compared with CADASIL."
    explanation: Distinguishing features from NOTCH3 CADASIL.
- name: Sporadic cerebral small vessel disease
  description: >-
    Heterozygous HTRA1 disease resembles age- and hypertension-related small vessel disease apart from its
    familial occurrence.
  evidence:
  - reference: PMID:26063658
    reference_title: Heterozygous HTRA1 mutations are associated with autosomal dominant cerebral small vessel disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "They are similar to those of sporadic small vessel disease, except for their familial nature."
    explanation: Clinical resemblance to sporadic disease.
notes: >-
  Lump/split decision. MONDO lists CARASIL (MONDO:0010829) as the only descendant of MONDO:0014768, and the
  GeneReviews chapter treats heterozygous and biallelic HTRA1 disease as one phenotypic spectrum ("HTRA1
  disorder"). The two forms share the same initiating lesion (loss of HTRA1 protease activity), the same
  arteriopathy (medial smooth muscle loss, intimal thickening, elastic lamina splitting), seen at autopsy in
  both, and can segregate in one family from a single allele. They are therefore curated as one entry with
  HTRA1-CSVD and CARASIL subtypes, the precedent used for the dominant and recessive COL4A2 forms in
  Brain_Small_Vessel_Disease_2. The European Academy of Neurology consensus describes heterozygous disease as a
  different form of heritable small vessel disease rather than CARASIL; the subtype split records that
  difference, and subtype-specific features (age at onset, alopecia, spine disease) are scoped with subtype.
  The heterozygous missense mechanism (interference with trimer activation) differs from that of most CARASIL
  missense alleles, and is carried as its own pathophysiology node. The deep research report recommended
  keeping CARASIL out of this entry; that recommendation was considered and not followed for the reasons
  above. Orphanet records were not fetched because the Orphadata bulk files are not present locally.

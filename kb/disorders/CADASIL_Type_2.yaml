name: CADASIL Type 2
category: Mendelian
creation_date: '2026-10-28T00:00:00Z'
synonyms:
- CADASIL2
- CADASIL type 2
- HTRA1 CADASIL
- CADASIL caused by mutation in HTRA1
- HTRA1 disorder
- HTRA1-related cerebral small vessel disease
- HTRA1 cerebral small vessel disease
- HTRA1-CSVD
- HTRA1-related autosomal dominant cerebral small vessel disease
- CARASIL
- Cerebral autosomal recessive arteriopathy with subcortical infarcts and leukoencephalopathy
- Maeda syndrome
description: >-
  CADASIL type 2 is the cerebral small vessel disease caused by pathogenic germline variants in HTRA1,
  which encodes the secreted, homotrimeric serine protease HTRA1. GeneReviews treats HTRA1 disorder as
  one phenotypic spectrum, and this entry follows it, carrying the two ends as subtypes. Heterozygous
  variants (HTRA1-CSVD, the autosomal dominant form named by MONDO:0014768) cause a later-onset disease,
  typically after age 40, with slowly progressive gait disturbance, lacunar stroke, mood change and
  cognitive decline on a background of confluent white matter hyperintensities, lacunes and cerebral
  microbleeds; intracerebral hemorrhage is not rare, penetrance is incomplete, and spine disease is
  common while alopecia is uncommon. Biallelic variants cause classic CARASIL, a recessive disease
  beginning between ages 20 and 40 with spastic gait disturbance, stroke-like episodes, pseudobulbar
  palsy, mood change and dementia, accompanied by premature scalp alopecia and lumbago from spondylosis.
  Truncating heterozygous alleles act by haploinsufficiency, and many heterozygous missense alleles
  interfere with the trimer-dependent activation of wild-type HTRA1. Loss of protease activity leads to
  accumulation of HTRA1 matrisome substrates in the small-artery wall, dysregulated TGF-beta and NOTCH3
  signalling in vascular smooth muscle, loss of medial smooth muscle cells, intimal thickening with
  splitting of the internal elastic lamina, and chronic subcortical ischemia with white matter myelin
  loss. Diagnosis rests on HTRA1 molecular testing. Management is supportive; no mechanism-directed
  therapy is established.

name: Appendiceal Neoplasm
creation_date: "2026-08-14T00:00:00Z"
description: >-
  Appendiceal neoplasms are a rare, heterogeneous group of primary tumors of the
  vermiform appendix that span a wide biological spectrum: epithelial mucinous
  neoplasms (low-grade LAMN and high-grade HAMN), conventional and mucinous
  adenocarcinomas, goblet cell adenocarcinoma (an amphicrine tumor with combined
  glandular and neuroendocrine differentiation), and well-differentiated
  neuroendocrine tumors. They are frequently discovered incidentally in
  appendectomy specimens removed for presumed acute appendicitis. Mucinous
  neoplasms are molecularly characterized by activating KRAS and GNAS mutations,
  with GNAS driving the hallmark mucin hypersecretion via the cAMP-PKA pathway;
  when a mucinous neoplasm perforates, neoplastic mucin disseminates through the
  peritoneal cavity as pseudomyxoma peritonei. This is a root umbrella entry over
  distinct subtype entities; the subtype-level well-differentiated neuroendocrine
  tumor is curated separately in kb/disorders/Appendiceal_Neuroendocrine_Tumor.yaml
  (MONDO:0015066) and is cross-referenced here rather than duplicated.
category: Neoplastic
categories:
- Solid Tumor
- Gastrointestinal Cancer
parents:
- gastrointestinal neoplasm
- appendix disease
disease_term:
  preferred_term: appendiceal neoplasm
  term:
    id: MONDO:0001236
    label: appendiceal neoplasm
has_subtypes:
- name: Adenocarcinoma
  display_name: Appendiceal adenocarcinoma
  description: >-
    Invasive epithelial malignancy of the appendix, including conventional
    (colonic-type) adenocarcinoma, mucinous adenocarcinoma (infiltrative invasion
    with abundant extracellular mucin), and signet ring cell carcinoma. Defined by
    infiltrative invasion, distinguishing it from the noninvasive mucinous
    neoplasms. Molecularly resembles but is distinct from colorectal cancer, with
    frequent KRAS and lower APC mutation rates.
  subtype_term:
    preferred_term: appendix adenocarcinoma
    term:
      id: MONDO:0006087
      label: appendix adenocarcinoma
  evidence:
  - reference: PMID:26492181
    reference_title: "A Consensus for Classification and Pathologic Reporting of Pseudomyxoma Peritonei and Associated Appendiceal Neoplasia: The Results of the Peritoneal Surface Oncology Group International (PSOGI) Modified Delphi Process."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      it was agreed that "mucinous adenocarcinoma" should be reserved for lesions
      with infiltrative invasion
    explanation: >-
      The PSOGI consensus defines invasive appendiceal adenocarcinoma by
      infiltrative invasion, the feature separating it from noninvasive mucinous
      neoplasms.
- name: Mucinous Neoplasm
  display_name: Appendiceal mucinous neoplasm (LAMN/HAMN)
  description: >-
    Noninvasive mucinous epithelial neoplasm of the appendix, encompassing
    low-grade appendiceal mucinous neoplasm (LAMN) and high-grade appendiceal
    mucinous neoplasm (HAMN). Both lack infiltrative invasion; HAMN is
    distinguished from LAMN by high-grade cytologic atypia. These tumors are the
    usual origin of pseudomyxoma peritonei.
  subtype_term:
    preferred_term: appendix mucinous neoplasm
    term:
      id: NCIT:C170734
      label: Appendix Mucinous Neoplasm
  children:
  - LAMN
  - HAMN
  evidence:
  - reference: PMID:32821969
    reference_title: "Molecular and clinicopathological features of appendiceal mucinous neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Appendiceal mucinous tumors (AMTs) include low-grade mucinous appendiceal
      neoplasms (LAMNs), high-grade mucinous appendiceal neoplasms (HAMNs), and
      mucinous adenocarcinomas (MACs).
    explanation: >-
      Establishes the mucinous-neoplasm subtype family (LAMN and HAMN) as distinct
      from invasive mucinous adenocarcinoma.
- name: LAMN
  display_name: Low-grade appendiceal mucinous neoplasm
  description: >-
    Noninvasive mucinous appendiceal neoplasm with low-grade cytologic atypia and
    a villous or flat proliferation of mucinous epithelium. The WHO/PSOGI-preferred
    term replacing "mucinous cystadenoma." Characteristically carries both KRAS and
    activating GNAS mutations.
  subtype_term:
    preferred_term: low grade appendiceal mucinous neoplasm
    term:
      id: NCIT:C42598
      label: Low Grade Appendix Mucinous Neoplasm
  evidence:
  - reference: PMID:26492181
    reference_title: "A Consensus for Classification and Pathologic Reporting of Pseudomyxoma Peritonei and Associated Appendiceal Neoplasia: The Results of the Peritoneal Surface Oncology Group International (PSOGI) Modified Delphi Process."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The term "low-grade appendiceal mucinous neoplasm" was supported and it was
      agreed that "cystadenoma" should no longer be recommended.
    explanation: >-
      The PSOGI Delphi consensus adopts LAMN as the preferred term and retires
      "cystadenoma."
- name: HAMN
  display_name: High-grade appendiceal mucinous neoplasm
  description: >-
    Mucinous appendiceal neoplasm without infiltrative invasion but with high-grade
    cytologic atypia; a term introduced in the PSOGI consensus and WHO 5th edition.
    Occupies an intermediate position between LAMN and invasive mucinous
    adenocarcinoma and may harbor TP53 or ATM mutations.
  subtype_term:
    preferred_term: high grade appendiceal mucinous neoplasm
    term:
      id: NCIT:C172665
      label: High Grade Appendix Mucinous Neoplasm
  evidence:
  - reference: PMID:26492181
    reference_title: "A Consensus for Classification and Pathologic Reporting of Pseudomyxoma Peritonei and Associated Appendiceal Neoplasia: The Results of the Peritoneal Surface Oncology Group International (PSOGI) Modified Delphi Process."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A new term of "high-grade appendiceal mucinous neoplasm" was proposed for
      lesions without infiltrative invasion but with high-grade cytologic atypia.
    explanation: >-
      Defines HAMN by high-grade cytologic atypia in the absence of infiltrative
      invasion, per the PSOGI consensus.
- name: Goblet Cell Adenocarcinoma
  display_name: Appendiceal goblet cell adenocarcinoma
  description: >-
    A rare appendiceal tumor with amphicrine (combined mucinous/goblet-cell and
    neuroendocrine) differentiation, historically termed goblet cell carcinoid or
    adenocarcinoid. The WHO 5th edition renamed it goblet cell adenocarcinoma to
    reflect its epithelial, adenocarcinoma-like behavior. It is staged and treated
    as an adenocarcinoma and is not an appendiceal neuroendocrine tumor subtype.
  subtype_term:
    preferred_term: goblet cell adenocarcinoma of the appendix
    term:
      id: MONDO:0018017
      label: goblet cell carcinoma
  evidence:
  - reference: PMID:35691370
    reference_title: "Goblet cell adenocarcinoma of the appendix: an update and practical approach to diagnosis and grading."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Goblet cell adenocarcinoma is a rare appendiceal tumour with amphicrine
      differentiation that has distinct morphologic and clinical features compared
      to carcinomas seen elsewhere in the gastrointestinal tract.
    explanation: >-
      Establishes goblet cell adenocarcinoma as a distinct amphicrine appendiceal
      entity.
- name: Neuroendocrine Tumor
  display_name: Appendiceal neuroendocrine tumor
  description: >-
    Well-differentiated epithelial neuroendocrine tumor of the appendix, usually a
    small, tip-located, incidentally discovered lesion with an excellent prognosis.
    This subtype is curated at entity level in
    kb/disorders/Appendiceal_Neuroendocrine_Tumor.yaml (MONDO:0015066); it is
    cross-referenced here and not duplicated.
  subtype_term:
    preferred_term: appendiceal neuroendocrine tumor
    term:
      id: MONDO:0015066
      label: neuroendocrine tumor of the appendix, well differentiated, low or intermediate grade
  evidence:
  - reference: PMID:37956190
    reference_title: "Incidence trends and survival analysis of appendiceal tumors in the United States: Primarily changes in appendiceal neuroendocrine tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the annual incidence of appendiceal neuroendocrine tumors (aNETs) increased
      significantly, from 0.03 to 0.90 per 100,000 person-years, with the most
      dramatic increase in the number of patients with localized disease.
    explanation: >-
      SEER data document appendiceal NETs as a distinct and increasingly common
      subtype of appendiceal neoplasm.

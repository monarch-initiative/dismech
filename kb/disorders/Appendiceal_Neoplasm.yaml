pathophysiology:
- name: KRAS and GNAS Oncogenic Activation
  description: >-
    Appendiceal mucinous neoplasms are driven by activating somatic mutations in
    the KRAS oncogene (codons 12/13) and the GNAS oncogene (codon 201). KRAS
    activation engages downstream MAPK and PI3K signaling to drive proliferation
    and survival, while activating GNAS mutations constitutively activate the
    stimulatory G protein alpha subunit. In appendiceal mucinous tumors KRAS and
    GNAS mutations frequently co-occur, and GNAS is characteristically enriched in
    low-grade lesions.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: intestinal epithelial cell (appendiceal mucinous epithelium)
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  locations:
  - preferred_term: vermiform appendix
    term:
      id: UBERON:0001154
      label: vermiform appendix
  biological_processes:
  - preferred_term: Ras protein signal transduction
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0007265
      label: Ras protein signal transduction
  - preferred_term: adenylate cyclase-activating G protein-coupled receptor signaling pathway
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0007189
      label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
  evidence:
  - reference: PMID:23403822
    reference_title: "Frequent GNAS mutations in low-grade appendiceal mucinous neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A mutational analysis identified activating GNAS mutations in 16 of 32
      low-grade appendiceal mucinous neoplasms (LAMNs) but in none of three
      mucinous adenocarcinomas (MACs). KRAS mutations were found in 30 LAMNs and in
      all MACs.
    explanation: >-
      Establishes activating KRAS and GNAS mutations as the characteristic genetic
      drivers of appendiceal mucinous neoplasms.
  - reference: PMID:29936255
    reference_title: "Analysis of Mutation and Loss of Heterozygosity by Whole-Exome Sequencing Yields Insights into Pseudomyxoma Peritonei."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic mutations were identified in both KRAS and GNAS in all samples
    explanation: >-
      Whole-exome sequencing of appendiceal-origin PMP confirms co-occurring KRAS
      and GNAS driver mutations.
  downstream:
  - target: GNAS-cAMP-PKA Mucin Hypersecretion
    description: >-
      Activating GNAS mutation raises intracellular cAMP and drives mucin gene
      expression via the Gs-cAMP-PKA pathway.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23403822
      reference_title: "Frequent GNAS mutations in low-grade appendiceal mucinous neoplasms."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The introduction of the mutant GNAS into a colorectal cancer cell line
        markedly induced MUC2 and MUC5AC expression, but did not promote cell
        growth either in vitro or in vivo.
      explanation: >-
        Functional cell-line evidence directly links mutant GNAS to induction of
        gel-forming mucin genes without a proliferative effect.
  - target: Neoplastic Epithelial Proliferation
    description: >-
      KRAS-MAPK/PI3K signaling drives neoplastic proliferation of appendiceal
      epithelium.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23403822
      reference_title: "Frequent GNAS mutations in low-grade appendiceal mucinous neoplasms."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        KRAS mutations were found in 30 LAMNs and in all MACs.
      explanation: >-
        KRAS mutation is near-ubiquitous across the mucinous-neoplasm spectrum,
        supporting a proliferative driver role, though downstream intermediates are
        not fully resolved in this study.
- name: GNAS-cAMP-PKA Mucin Hypersecretion
  description: >-
    Constitutive Gs-cAMP-PKA signaling from mutant GNAS markedly upregulates the
    gel-forming mucins MUC2 and MUC5AC, producing the copious mucin that is the
    hallmark of low-grade appendiceal mucinous neoplasms.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: mucinous (goblet) epithelial cell
    term:
      id: CL:0000160
      label: goblet cell
  biological_processes:
  - preferred_term: cAMP biosynthetic process
    modifier: INCREASED
    term:
      id: GO:0006171
      label: cAMP biosynthetic process
  - preferred_term: mucus secretion
    modifier: INCREASED
    term:
      id: GO:0070254
      label: mucus secretion
  evidence:
  - reference: PMID:23403822
    reference_title: "Frequent GNAS mutations in low-grade appendiceal mucinous neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Activating GNAS mutations are a frequent and characteristic genetic
      abnormality of LAMN. Mutant GNAS might play a direct role in the prominent
      mucin production that is a hallmark of LAMN.
    explanation: >-
      Directly attributes the hallmark mucin hypersecretion of LAMN to activating
      GNAS mutation.
  downstream:
  - target: Appendiceal Luminal Distension and Rupture
    description: >-
      Accumulating mucin distends the appendiceal lumen, thinning and weakening the
      wall.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:22759474
      reference_title: "Laparoscopic resection of an incidental appendiceal mucocele: is it correct. Case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        characterized by a cystic dilatation of the lumen; it's mainly due to
        mucinous cystadenoma
      explanation: >-
        Links the mucinous appendiceal neoplasm to cystic distension (dilatation)
        of the appendiceal lumen (the mucocele).
- name: Neoplastic Epithelial Proliferation
  description: >-
    KRAS-driven mitogenic signaling produces neoplastic proliferation of
    appendiceal epithelium, generating the mucinous or glandular tumor mass. In the
    low-grade mucinous setting the proliferative advantage is modest and combined
    with the secretory (mucinous) phenotype rather than aggressive growth.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:32821969
    reference_title: "Molecular and clinicopathological features of appendiceal mucinous neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results revealed KRAS and GNAS as the most frequently mutated genes.
    explanation: >-
      Confirms KRAS as a dominant driver of the neoplastic mucinous epithelium.
  downstream:
  - target: Appendiceal Luminal Distension and Rupture
    description: >-
      The proliferating mucinous neoplasm expands within and distends the appendix.
      No direct quantitative evidence isolates proliferation (as distinct from
      mucin secretion) as the driver of luminal distension; retained as a
      mechanistic description without an evidence claim per the evidence SOP.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: TP53-Associated High-Grade Progression and Invasion
    description: >-
      A subset of neoplasms progresses to high-grade and invasive disease,
      associated with acquisition of TP53 mutations, consistent with a stepwise
      LAMN -> HAMN -> mucinous adenocarcinoma morphologic transition.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:32913983
      reference_title: "Genomic Landscape of Appendiceal Neoplasms."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Low-grade and high-grade tumors were enriched for GNAS and TP53 mutations,
        respectively
      explanation: >-
        High-grade appendiceal tumors are enriched for TP53 mutation relative to
        the GNAS-enriched low-grade lesions.
    - reference: PMID:32821969
      reference_title: "Molecular and clinicopathological features of appendiceal mucinous neoplasms."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        a gradual transition from LAMN to MAC via HAMN could be considered.
      explanation: >-
        Supports a stepwise morphologic progression of the neoplastic epithelium
        toward high-grade/invasive mucinous adenocarcinoma.
- name: Appendiceal Luminal Distension and Rupture
  description: >-
    Progressive intraluminal mucin accumulation distends the appendix (mucocele),
    thins the muscular wall, and can culminate in rupture of the visceral
    peritoneum, releasing neoplastic mucin into the peritoneal cavity.
  biological_scale: TISSUE
  locations:
  - preferred_term: vermiform appendix
    term:
      id: UBERON:0001154
      label: vermiform appendix
  evidence:
  - reference: PMID:22759474
    reference_title: "Laparoscopic resection of an incidental appendiceal mucocele: is it correct. Case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      rupture of the lesion either spontaneous or accidental, during surgery may
      result in the clinical condition of pseudomyxoma peritonei
    explanation: >-
      Establishes that the distended mucinous appendiceal lesion can rupture,
      releasing its contents and producing pseudomyxoma peritonei.
  - reference: PMID:19998220
    reference_title: "[Mucocele of the appendix - a heterogenous surgical pathology]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The perforation of a mucocele with possible spread of mucus and cells into
      the abdominal cavity constitutes a severe complication (pseudomyxoma
      peritonei).
    explanation: >-
      Confirms that perforation (rupture) of the distended appendiceal mucocele
      spreads mucus and neoplastic cells into the peritoneal cavity.
  downstream:
  - target: Pseudomyxoma Peritonei
    description: >-
      Released neoplastic mucin disseminates and accumulates on peritoneal
      surfaces.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26492181
      reference_title: "A Consensus for Classification and Pathologic Reporting of Pseudomyxoma Peritonei and Associated Appendiceal Neoplasia: The Results of the Peritoneal Surface Oncology Group International (PSOGI) Modified Delphi Process."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Pseudomyxoma peritonei (PMP) is a complex disease with unique biological
        behavior that usually arises from appendiceal mucinous neoplasia.
      explanation: >-
        Directly links appendiceal mucinous neoplasia to the development of
        pseudomyxoma peritonei.
    - reference: PMID:23403822
      reference_title: "Frequent GNAS mutations in low-grade appendiceal mucinous neoplasms."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Appendiceal mucinous tumours may spread throughout the peritoneal cavity,
        causing the slow but relentless accumulation of mucin, a condition known as
        pseudomyxoma peritonei
      explanation: >-
        Describes dissemination of appendiceal mucinous tumor throughout the
        peritoneal cavity as accumulating mucin (pseudomyxoma peritonei) - the
        edge this quote actually supports.
- name: Pseudomyxoma Peritonei
  description: >-
    Intraperitoneal accumulation of mucinous ascites and mucin-producing neoplastic
    implants coating peritoneal surfaces and abdominal viscera, following spread
    from a ruptured appendiceal mucinous neoplasm. Characterized by the
    redistribution phenomenon, progressive abdominal distension, and functional
    gastrointestinal obstruction.
  biological_scale: ORGANISM
  locations:
  - preferred_term: peritoneum
    term:
      id: UBERON:0002358
      label: peritoneum
  biological_processes:
  - preferred_term: mucus secretion
    modifier: INCREASED
    term:
      id: GO:0070254
      label: mucus secretion
  evidence:
  - reference: PMID:23403822
    reference_title: "Frequent GNAS mutations in low-grade appendiceal mucinous neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Over time, mucin accumulation in the peritoneal cavity gradually causes
      massive symptomatic distension and functional gastrointestinal obstruction.
    explanation: >-
      Describes the clinical consequences of peritoneal mucin accumulation in PMP.
- name: TP53-Associated High-Grade Progression and Invasion
  description: >-
    Acquisition of TP53 mutation (mutually exclusive with GNAS) marks progression
    to high-grade and invasive appendiceal cancer. Loss of p53 function impairs
    DNA-damage response and apoptosis, enabling infiltrative invasion and
    metastatic potential; TP53 mutation status independently predicts survival.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:32913983
    reference_title: "Genomic Landscape of Appendiceal Neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GNAS and TP53 were mutually exclusive (Bonferroni corrected P < .001). Tumor
      grade and TP53 mutation status independently predicted OS.
    explanation: >-
      Establishes TP53 mutation as an independent high-grade prognostic driver,
      mutually exclusive with the low-grade GNAS pathway.
  downstream:
  - target: Invasive Adenocarcinoma and Metastatic Spread
    description: >-
      High-grade tumors invade the appendiceal wall and disseminate to lymph nodes
      and distant organs.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30692096
      reference_title: "Molecular Profiling of Appendiceal Adenocarcinoma and Comparison with Right-sided and Left-sided Colorectal Cancer."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We observed high mutation rates in appendiceal adenocarcinoma samples for
        KRAS (55%), TP53 (40%), GNAS (31%), SMAD4 (16%), and APC (10%).
      explanation: >-
        Documents the TP53 mutation burden characteristic of invasive appendiceal
        adenocarcinoma.
- name: Invasive Adenocarcinoma and Metastatic Spread
  description: >-
    Frankly invasive appendiceal adenocarcinoma infiltrates the appendiceal wall
    and adjacent structures (cecum, ileocecal valve), spreads to regional lymph
    nodes, and can metastasize to distant organs such as the liver. Signet ring
    cell carcinoma is the most aggressive high-grade variant.
  biological_scale: TISSUE
  locations:
  - preferred_term: vermiform appendix
    term:
      id: UBERON:0001154
      label: vermiform appendix
  evidence:
  - reference: PMID:26492181
    reference_title: "A Consensus for Classification and Pathologic Reporting of Pseudomyxoma Peritonei and Associated Appendiceal Neoplasia: The Results of the Peritoneal Surface Oncology Group International (PSOGI) Modified Delphi Process."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      it was agreed that "mucinous adenocarcinoma" should be reserved for lesions
      with infiltrative invasion
    explanation: >-
      Invasive appendiceal adenocarcinoma is defined by infiltrative invasion, the
      feature that distinguishes it from the noninvasive mucinous neoplasms.
  - reference: PMID:30692096
    reference_title: "Molecular Profiling of Appendiceal Adenocarcinoma and Comparison with Right-sided and Left-sided Colorectal Cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared to colorectal adenocarcinoma, AA more commonly are associated with
      peritoneal dissemination and increased mucin production
    explanation: >-
      Documents the disseminating/metastatic behavior of invasive appendiceal
      adenocarcinoma relative to colorectal cancer.
  - reference: PMID:32913983
    reference_title: "Genomic Landscape of Appendiceal Neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were five major histopathologic subtypes: mucinous adenocarcinomas
      (46%), adenocarcinomas (30%), goblet cell carcinoids (12%), pseudomyxoma
      peritonei (7.7%), and signet ring cell carcinomas (5.2%).
    explanation: >-
      Documents the invasive epithelial and signet ring cell subtypes within the
      appendiceal cancer spectrum.
- name: Goblet Cell Amphicrine Differentiation
  description: >-
    Goblet cell adenocarcinoma exhibits amphicrine differentiation, with tumor
    cells co-expressing mucinous (goblet-cell) and neuroendocrine phenotypes,
    including Paneth-like cells. Its diagnostic hallmarks are a classic low-grade
    goblet-cell component and immunoreactivity for neuroendocrine markers, yet it
    behaves as and is treated as an adenocarcinoma.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: goblet cell
    term:
      id: CL:0000160
      label: goblet cell
  - preferred_term: enteroendocrine cell
    term:
      id: CL:0000164
      label: enteroendocrine cell
  biological_processes:
  - preferred_term: amphicrine (combined goblet-cell and neuroendocrine) differentiation
    modifier: ABNORMAL
    description: >-
      No suitable GO term captures amphicrine (concurrent exocrine/goblet-cell and
      neuroendocrine) differentiation; the generic GO:0030154 (cell differentiation)
      was too broad to be informative, so the ontology term binding is omitted (NTR).
  evidence:

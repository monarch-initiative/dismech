differential_diagnoses:
- name: Acute Appendicitis
  description: >-
    Appendiceal neoplasms frequently present as, or are discovered during surgery
    for, presumed acute appendicitis. Distinguishing an incidental underlying
    neoplasm from uncomplicated appendicitis before surgery is imprecise.
  distinguishing_features:
  - Older age and larger sonographic appendiceal diameter raise suspicion for neoplasm.
  - Definitive distinction requires histopathologic examination of the resected specimen.
  evidence:
  - reference: PMID:31811385
    reference_title: "Risk factors for appendiceal neoplasm and malignancy among patients with acute appendicitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In multivariate analysis, age ≥ 50 years and a diameter of the appendix in
      the sonography ≥ 13 mm were independent risk factors predicting the presence
      of appendiceal neoplasm and malignancy.
    explanation: >-
      Supports the clinical overlap with appendicitis and the imprecise
      preoperative distinction.
discussions:
- discussion_id: gap_appendiceal_targeted_therapy
  prompt: >-
    Do the distinctive appendiceal driver alterations (KRAS, GNAS, low APC/TP53)
    translate into appendiceal-specific targeted-therapy benefit, rather than
    borrowed colorectal-cancer regimens?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#KRAS and GNAS Oncogenic Activation
  - treatments#Systemic Chemotherapy
  rationale: >-
    Appendiceal cancers are molecularly distinct from colorectal cancer, yet
    systemic therapy is largely extrapolated from colorectal protocols and the
    rarity of these tumors has prevented dedicated randomized trials.
  evidence:
  - reference: PMID:32913983
    reference_title: "Genomic Landscape of Appendiceal Neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study highlights the benefit of performing molecular profiling on rare
      tumors to identify prognostic and predictive biomarkers and new therapeutic
      targets.
    explanation: >-
      Motivates but does not resolve appendiceal-specific molecularly targeted
      therapy.
datasets: []
review_notes: >-
  De-novo root umbrella entry created 2026-08-14 for issue #8459 with Perplexity
  deep research (leads only; every PMID and snippet independently verified against
  cached PubMed abstracts). Models four subtype families (adenocarcinoma; mucinous
  neoplasm with LAMN/HAMN children; goblet cell adenocarcinoma; neuroendocrine
  tumor). The neuroendocrine subtype is cross-referenced to the existing
  subtype-level entry Appendiceal_Neuroendocrine_Tumor.yaml (MONDO:0015066) and not
  duplicated. Pathophysiology captures the KRAS/GNAS-cAMP-PKA mucin mechanism,
  luminal rupture to pseudomyxoma peritonei, TP53-associated high-grade
  progression/invasion, and goblet-cell amphicrine differentiation. NCIT treatment
  terms (appendectomy, right colectomy, cytoreductive surgery, HIPEC, chemotherapy)
  were independently validated with OAK rather than taken from the DR report, whose
  NCIT identifiers were unreliable. The deep-research report's one unresolved
  identifier (PubMed 31629386) was excluded and not cited.

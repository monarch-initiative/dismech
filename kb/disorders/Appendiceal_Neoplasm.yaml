genetic:
- name: KRAS
  gene_term:
    preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: >-
    Activating KRAS mutations (codons 12/13) are the most frequent alteration
    across appendiceal epithelial neoplasms and are near-ubiquitous in mucinous
    neoplasms.
  case_fractions:
  - population: Appendiceal adenocarcinoma (Caris cohort)
    case_fraction_percent: 55.0
    notes: KRAS mutation frequency in appendiceal adenocarcinoma.
    evidence:
    - reference: PMID:30692096
      reference_title: "Molecular Profiling of Appendiceal Adenocarcinoma and Comparison with Right-sided and Left-sided Colorectal Cancer."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We observed high mutation rates in appendiceal adenocarcinoma samples for
        KRAS (55%), TP53 (40%), GNAS (31%), SMAD4 (16%), and APC (10%).
      explanation: >-
        Quantifies the KRAS mutation share in appendiceal adenocarcinoma.
  evidence:
  - reference: PMID:32913983
    reference_title: "Genomic Landscape of Appendiceal Neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KRAS (35% to 81%) and GNAS (8% to 72%) were the most frequent alterations in
      epithelial cancers; APC and TP53 mutations were significantly less frequent in
      appendiceal cancers relative to CRC.
    explanation: >-
      Establishes KRAS as a dominant somatic driver across appendiceal epithelial
      cancers.
- name: GNAS
  gene_term:
    preferred_term: GNAS
    term:
      id: hgnc:4392
      label: GNAS
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: >-
    Activating GNAS mutations (codon 201) are characteristic of low-grade mucinous
    neoplasms and drive mucin hypersecretion; enriched in low-grade tumors and
    associated with more favorable survival.
  evidence:
  - reference: PMID:32913983
    reference_title: "Genomic Landscape of Appendiceal Neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Low-grade and high-grade tumors were enriched for GNAS and TP53 mutations,
      respectively
    explanation: >-
      Establishes GNAS as the low-grade-enriched somatic driver of appendiceal
      mucinous neoplasia.
- name: TP53
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: >-
    TP53 mutations mark high-grade and invasive appendiceal cancers, are mutually
    exclusive with GNAS, and independently predict shorter overall survival.
  evidence:
  - reference: PMID:32913983
    reference_title: "Genomic Landscape of Appendiceal Neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GNAS and TP53 were mutually exclusive (Bonferroni corrected P < .001). Tumor
      grade and TP53 mutation status independently predicted OS.
    explanation: >-
      Establishes TP53 as a high-grade, independently prognostic somatic driver.
diagnosis:
- name: Appendectomy-Specimen Histopathology
  presence: >-
    Most appendiceal neoplasms are diagnosed by histopathologic examination of an
    appendectomy specimen removed for presumed acute appendicitis; subtype, grade,

histopathology:
- name: Low-Grade Appendiceal Mucinous Neoplasm (LAMN)
  diagnostic: true
  context: Mucinous Neoplasm
  description: >-
    Villous or flat proliferation of mucinous epithelium with low-grade cytologic
    atypia, abundant apical mucin, and loss of the muscularis mucosae, without
    infiltrative invasion. Mucin may dissect through the wall and reach the serosa.
  evidence:
  - reference: PMID:26492181
    reference_title: "A Consensus for Classification and Pathologic Reporting of Pseudomyxoma Peritonei and Associated Appendiceal Neoplasia: The Results of the Peritoneal Surface Oncology Group International (PSOGI) Modified Delphi Process."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The term "low-grade appendiceal mucinous neoplasm" was supported and it was
      agreed that "cystadenoma" should no longer be recommended.
    explanation: >-
      Supports the LAMN diagnostic category and terminology.
- name: High-Grade Appendiceal Mucinous Neoplasm (HAMN)
  context: Mucinous Neoplasm
  description: >-
    Mucinous appendiceal neoplasm with high-grade cytologic atypia (and often
    micropapillary or cribriform architecture) but still lacking infiltrative
    invasion.
  evidence:
  - reference: PMID:26492181
    reference_title: "A Consensus for Classification and Pathologic Reporting of Pseudomyxoma Peritonei and Associated Appendiceal Neoplasia: The Results of the Peritoneal Surface Oncology Group International (PSOGI) Modified Delphi Process."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A new term of "high-grade appendiceal mucinous neoplasm" was proposed for
      lesions without infiltrative invasion but with high-grade cytologic atypia.
    explanation: >-
      Supports the HAMN diagnostic category defined by high-grade atypia without
      invasion.
- name: Goblet Cell Amphicrine Morphology
  context: Goblet Cell Adenocarcinoma
  description: >-
    Tubules composed of goblet-like mucinous cells admixed with neuroendocrine and
    Paneth-like cells, a classic low-grade component, and immunoreactivity for
    neuroendocrine markers, defining the amphicrine goblet cell adenocarcinoma.
  evidence:
  - reference: PMID:35691370
    reference_title: "Goblet cell adenocarcinoma of the appendix: an update and practical approach to diagnosis and grading."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the recent fifth edition of the World Health Organization Classification
      of Digestive System Tumors, goblet cell adenocarcinoma is the preferred
      diagnosis because of the increasing recognition of a frequent co-existing
      high-grade adenocarcinoma component.
    explanation: >-
      Supports the WHO 5th edition goblet cell adenocarcinoma classification and its
      adenocarcinoma-like behavior.

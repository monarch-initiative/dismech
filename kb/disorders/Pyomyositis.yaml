name: Pyomyositis
creation_date: "2026-09-25T19:28:24Z"
category: Infectious Disease
description: >-
  Pyomyositis is an acquired pyogenic bacterial infection of skeletal muscle
  that most often follows hematogenous seeding by Staphylococcus aureus and
  evolves from focal muscle inflammation to an intramuscular abscess. The
  dominant clinical pattern is fever with localized muscle pain, tenderness, and
  impaired use of the involved limb or muscle group, most often in pelvic and
  lower-extremity muscles. Early disease may respond to anti-staphylococcal
  antibiotics alone, whereas suppurative disease generally requires drainage in
  addition to antibiotics; complications include osteomyelitis, septic arthritis,
  septicemia, and death from advanced or initially undertreated disease.
disease_term:
  term:
    id: MONDO:0019168
    label: pyomyositis
  preferred_term: Pyomyositis
parents:
- bacterial myositis
synonyms:
- Tropical pyomyositis
- Myositis tropicans
- Suppurative myositis
infectious_agent:
- name: Staphylococcus aureus
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  description: >-
    Staphylococcus aureus is the predominant bacterial isolate in pyomyositis in
    both systematic-review and U.S. inpatient datasets; methicillin-susceptible
    and methicillin-resistant strains can cause disease.
  evidence:
  - reference: PMID:34407271
    reference_title: "Factors associated with pyomyositis: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Staphylococcus aureus was the main organism isolated."
    explanation: >-
      A systematic review and meta-analysis identifies S. aureus as the main
      organism recovered from pyomyositis cases.
  - reference: PMID:32147332
    reference_title: Pyomyositis in the United States 2002-2014.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most commonly identified bacterial diagnosis was Staphylococcus
      aureus.
    explanation: >-
      A population-based U.S. inpatient study likewise found S. aureus to be the
      most commonly coded bacterial diagnosis.
pathophysiology:
- name: Hematogenous seeding of injured skeletal muscle
  description: >-
    Pyomyositis begins when a circulating bacterial pathogen, most often S.
    aureus, reaches a skeletal muscle focus made permissive by trauma, ischemia,
    vigorous activity, or host immunocompromise. A history of trauma to the
    affected muscle is reported in a substantial minority of cases, and the
    disease often follows minor trauma.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: response to bacterium
    modifier: ABNORMAL
    term:
      id: GO:0009617
      label: response to bacterium
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  downstream:
  - target: Intramuscular neutrophilic abscess formation
    description: >-
      Bacterial proliferation inside skeletal muscle drives focal pyogenic
      inflammation and abscess formation.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29338140
    reference_title: "Primary pyomyositis in North India: a clinical, microbiological, and outcome study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      16 patients (25.8%) gave the history of trauma to affected muscles.
    explanation: >-
      A quarter of patients in this adult cohort reported trauma to the affected
      muscle, supporting local muscle injury as a permissive lesion.
  - reference: PMID:39971676
    reference_title: Tropical pyomyositis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The disease primarily affects men and young adults, often following minor
      trauma, with an increasing incidence in immunocompromised individuals.
    explanation: >-
      A 2025 review states the disease often follows minor trauma and is
      increasing in immunocompromised hosts.
- name: Intramuscular neutrophilic abscess formation
  description: >-
    The seeded bacterial focus elicits neutrophil-rich pyogenic inflammation in
    skeletal muscle and progresses from a painful invasive stage to a
    suppurative intramuscular abscess.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: neutrophil activation
    modifier: INCREASED
    term:
      id: GO:0042119
      label: neutrophil activation
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: The pyogenic muscle infection produces systemic fever.
  - target: Myalgia
    causal_link_type: DIRECT
    description: The intramuscular abscess produces localized muscle pain.
  - target: Functional impairment of involved muscle groups
    causal_link_type: DIRECT
    description: Pain and swelling of the involved muscle impair its use and ambulation.
  - target: Local osteoarticular extension and septic dissemination
    description: >-
      Advanced infection can spread locally to bone or joints and can disseminate
      systemically as septicemia.
  evidence:
  - reference: PMID:34407271
    reference_title: "Factors associated with pyomyositis: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pyomyositis, an acute bacterial infection of skeletal muscle usually
      resulting in abscess formation, is well recognised in tropical regions
      where it can account for up to 4% of adult surgical admissions.
    explanation: >-
      Defines the disease as an acute bacterial skeletal-muscle infection that
      usually forms abscesses.
  - reference: PMID:39971676
    reference_title: Tropical pyomyositis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Tropical pyomyositis is a serious infectious disease characterised by the
      formation of abscesses in the skeletal muscles and is primarily caused by
      Staphylococcus aureus, with an increasing incidence in non-tropical
      regions.
    explanation: >-
      A 2025 review supports skeletal-muscle abscess formation as the defining
      lesion and S. aureus as the primary microbial cause.
- name: Local osteoarticular extension and septic dissemination
  description: >-
    Untreated or advanced abscess-stage pyomyositis can extend to adjacent bone
    and joints or disseminate hematogenously, producing osteomyelitis, septic
    arthritis, septicemia, shock, and in-hospital mortality.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Osteomyelitis
    causal_link_type: DIRECT
    description: Local extension to adjacent bone produces osteomyelitis.
  - target: Septic arthritis
    causal_link_type: DIRECT
    description: Local extension to an adjacent joint produces septic arthritis.
  - target: Sepsis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Hematogenous dissemination produces septicemia.
  evidence:
  - reference: PMID:34411048
    reference_title: "Primary Bacterial Pyomyositis in Children: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were 42 complications in 41 patients (11.3%). Methicillin-resistant
      S. aureus was associated with an increased risk of complications. The most
      common complications were osteomyelitis, septicemia, and septic arthritis.
    explanation: >-
      A pediatric systematic review identifies osteomyelitis, septicemia, and
      septic arthritis as the most common complications.
  - reference: PMID:29338140
    reference_title: "Primary pyomyositis in North India: a clinical, microbiological, and outcome study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lower first-day serum albumin, initial inappropriate antibiotic therapy,
      and advanced form of the disease at presentation were associated with
      increased in-hospital mortality.
    explanation: >-
      This cohort links advanced presentation and inappropriate initial
      antibiotic therapy to fatal in-hospital outcomes.

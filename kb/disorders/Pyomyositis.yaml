name: Pyomyositis
creation_date: "2026-09-25T19:28:24Z"
updated_date: "2026-09-25T19:28:24Z"
category: Infectious Disease
description: >-
  Pyomyositis is an acquired pyogenic bacterial infection of skeletal muscle
  that most often follows hematogenous seeding by Staphylococcus aureus and
  evolves from focal muscle inflammation to an intramuscular abscess. The
  dominant clinical pattern is fever with localized muscle pain, tenderness, and
  impaired use of the involved limb or muscle group, most often in pelvic and
  lower-extremity muscles. Early disease may respond to anti-staphylococcal
  antibiotics alone, whereas suppurative disease generally requires drainage in
  addition to antibiotics; complications include osteomyelitis, septic arthritis,
  septicemia, and death from advanced or initially undertreated disease.
disease_term:
  term:
    id: MONDO:0019168
    label: pyomyositis
  preferred_term: Pyomyositis
parents:
- bacterial myositis
synonyms:
- Tropical pyomyositis
- Myositis tropicans
- Suppurative myositis
infectious_agent:
- name: Staphylococcus aureus
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  description: >-
    Staphylococcus aureus is the predominant bacterial isolate in pyomyositis in
    both systematic-review and U.S. inpatient datasets; methicillin-susceptible
    and methicillin-resistant strains can cause disease.
  evidence:
  - reference: PMID:34407271
    reference_title: "Factors associated with pyomyositis: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Staphylococcus aureus was the main organism isolated."
    explanation: >-
      A systematic review and meta-analysis identifies S. aureus as the main
      organism recovered from pyomyositis cases.
  - reference: PMID:32147332
    reference_title: Pyomyositis in the United States 2002-2014.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most commonly identified bacterial diagnosis was Staphylococcus
      aureus.
    explanation: >-
      A population-based U.S. inpatient study likewise found S. aureus to be the
      most commonly coded bacterial diagnosis.
pathophysiology:
- name: Hematogenous seeding of injured skeletal muscle
  description: >-
    Pyomyositis begins when a circulating bacterial pathogen, most often S.
    aureus, reaches a skeletal muscle focus made permissive by trauma, ischemia,
    vigorous activity, or host immunocompromise. Mouse rectus-muscle experiments
    with intravenous MRSA support the two-hit requirement that muscle injury, not
    bloodstream exposure alone, enables abscess-producing seeding.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: response to bacterium
    modifier: ABNORMAL
    term:
      id: GO:0009617
      label: response to bacterium
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  downstream:
  - target: Intramuscular neutrophilic abscess formation
    description: >-
      Bacterial proliferation inside skeletal muscle drives focal pyogenic
      inflammation and abscess formation.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:28187042
    reference_title: >-
      Can Methicillin-resistant Staphylococcus aureus Silently Travel From the
      Gut to the Wound and Cause Postoperative Infection? Modeling the "Trojan
      Horse Hypothesis".
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To rule out extracellular bacteremia as a cause of wound infection, MRSA
      was injected intravenously in mice subjected to rectus muscle ischemia and
      injury.
    explanation: >-
      The murine MRSA model experimentally pairs bacteremia with rectus-muscle
      injury and ischemia, matching the proposed injured-muscle seeding step.
  - reference: PMID:28187042
    reference_title: >-
      Can Methicillin-resistant Staphylococcus aureus Silently Travel From the
      Gut to the Wound and Cause Postoperative Infection? Modeling the "Trojan
      Horse Hypothesis".
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "No SSIs were observed in mice injected intravenously with MRSA."
    explanation: >-
      Intravenous MRSA alone did not produce visible surgical-site infections in
      the model, supporting the idea that local muscle injury is a required
      permissive lesion rather than bacteremia alone being sufficient.
- name: Intramuscular neutrophilic abscess formation
  description: >-
    The seeded bacterial focus elicits neutrophil-rich pyogenic inflammation in
    skeletal muscle and progresses from a painful invasive stage to a
    suppurative intramuscular abscess.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: neutrophil activation
    modifier: INCREASED
    term:
      id: GO:0042119
      label: neutrophil activation
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  downstream:
  - target: Local osteoarticular extension and septic dissemination
    description: >-
      Advanced infection can spread locally to bone or joints and can disseminate
      systemically as septicemia.
  evidence:
  - reference: PMID:34407271
    reference_title: "Factors associated with pyomyositis: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pyomyositis, an acute bacterial infection of skeletal muscle usually
      resulting in abscess formation, is well recognised in tropical regions
      where it can account for up to 4% of adult surgical admissions.
    explanation: >-
      Defines the disease as an acute bacterial skeletal-muscle infection that
      usually forms abscesses.
  - reference: PMID:39971676
    reference_title: Tropical pyomyositis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Tropical pyomyositis is a serious infectious disease characterised by the
      formation of abscesses in the skeletal muscles and is primarily caused by
      Staphylococcus aureus, with an increasing incidence in non-tropical
      regions.
    explanation: >-
      A 2025 review supports skeletal-muscle abscess formation as the defining
      lesion and S. aureus as the primary microbial cause.
- name: Local osteoarticular extension and septic dissemination
  description: >-
    Untreated or advanced abscess-stage pyomyositis can extend to adjacent bone
    and joints or disseminate hematogenously, producing osteomyelitis, septic
    arthritis, septicemia, shock, and in-hospital mortality.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:34411048
    reference_title: "Primary Bacterial Pyomyositis in Children: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were 42 complications in 41 patients (11.3%). Methicillin-resistant
      S. aureus was associated with an increased risk of complications. The most
      common complications were osteomyelitis, septicemia, and septic arthritis.
    explanation: >-
      A pediatric systematic review identifies osteomyelitis, septicemia, and
      septic arthritis as the most common complications.
  - reference: PMID:29338140
    reference_title: "Primary pyomyositis in North India: a clinical, microbiological, and outcome study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lower first-day serum albumin, initial inappropriate antibiotic therapy,
      and advanced form of the disease at presentation were associated with
      increased in-hospital mortality.
    explanation: >-
      This cohort links advanced presentation and inappropriate initial
      antibiotic therapy to fatal in-hospital outcomes.
phenotypes:
- name: Fever
  category: Symptom
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:34411048
    reference_title: "Primary Bacterial Pyomyositis in Children: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fever, painful limp, and localized pain were the most common presenting symptoms."
    explanation: >-
      The pediatric systematic review identifies fever as one of the most common
      presenting symptoms.
  - reference: PMID:29338140
    reference_title: "Primary pyomyositis in North India: a clinical, microbiological, and outcome study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Forty-eight patients (77.4%) had the fever."
    explanation: >-
      Fever affected more than three quarters of patients in this adult primary
      pyomyositis cohort.
- name: Myalgia
  category: Symptom
  phenotype_term:
    preferred_term: Myalgia
    term:
      id: HP:0003326
      label: Myalgia
  evidence:
  - reference: PMID:29338140
    reference_title: "Primary pyomyositis in North India: a clinical, microbiological, and outcome study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle pain was seen in all 62 patients."
    explanation: >-
      The adult cohort observed muscle pain in every patient with primary
      pyomyositis.
  - reference: PMID:19763666
    reference_title: >-
      Clinical characteristics and predictors of mortality in 67 patients with
      primary pyomyositis: a study from North India.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common presenting symptoms were myalgias [50 (74.62%)] and fever [49 (73.13%)]."
    explanation: >-
      A second adult cohort found myalgia to be one of the two dominant
      presenting symptoms.
- name: Functional impairment of involved muscle groups
  category: Sign
  description: >-
    Pain and infection of the affected muscle commonly impair walking or use of
    the involved limb, particularly when pelvic and lower-extremity muscles are
    affected.
  evidence:
  - reference: PMID:34411048
    reference_title: "Primary Bacterial Pyomyositis in Children: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pelvis, lower extremity, trunk and spine, in descending order, were the most commonly affected locations."
    explanation: >-
      The common pelvic and lower-extremity distribution explains the frequent
      presentation with painful limp and impaired mobility.
  - reference: PMID:40440680
    reference_title: "Pyomyositis in Children: A 15-year Retrospective Study From a Tertiary Care Pediatric Hospital in Portugal."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pain (100.0%), functional impairment (82.8%) and fever (65.5%) were the most frequent symptoms."
    explanation: >-
      Functional impairment was present in more than 80% of children in this
      tertiary-center pyomyositis series.
treatments:
- name: Anti-staphylococcal antibiotic therapy
  description: >-
    Systemic antibiotic therapy targets S. aureus and is often sufficient during
    early invasive disease before a drainable abscess has matured.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Hematogenous seeding of injured skeletal muscle
    description: >-
      Active therapy suppresses the causative bacterial population before
      suppurative infection disseminates.
  - target: Intramuscular neutrophilic abscess formation
    description: >-
      Antibiotics treat abscess-stage infection alongside source control.
  evidence:
  - reference: PMID:34411048
    reference_title: "Primary Bacterial Pyomyositis in Children: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Medical management alone was successful in 40% of cases (143/361) with an
      average duration of 9.5+/-4.0 and 22.7+/-7.2 days of intravenous and oral
      antibiotics, respectively.
    explanation: >-
      The systematic review reports that antibiotics without drainage cured a
      substantial minority of pediatric cases.
- name: Abscess incision and drainage
  description: >-
    Drainage provides source control for mature or persistent intramuscular
    abscesses and is combined with antibiotics when suppurative disease does not
    respond to conservative management.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Incision and Drainage
    term:
      id: NCIT:C38067
      label: Incision and Drainage
  target_mechanisms:
  - target: Intramuscular neutrophilic abscess formation
    description: >-
      Drainage removes the intramuscular purulent collection after the disease
      has reached the suppurative stage.
  evidence:
  - reference: PMID:34411048
    reference_title: "Primary Bacterial Pyomyositis in Children: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgical management consisted of open drainage in 91.3% (199/218) or
      percutaneous drainage in 8.7% (19/218) of cases.
    explanation: >-
      The pediatric systematic review quantifies open and percutaneous drainage
      among surgically managed cases.
  - reference: PMID:28248876
    reference_title: "Obturator externus abscess in a 9-year-old child: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The appropriate antibiotic therapy provides a rapid regression of symptoms
      during the early stage of pyomyositis. In cases of MRI-confirmed abscess,
      surgical treatment is indicated.
    explanation: >-
      The obturator-pyomyositis review states the stage-based pattern:
      antibiotics can work early, while MRI-confirmed abscesses require surgical
      source control.

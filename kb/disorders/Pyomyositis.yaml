    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Magnetic resonance imaging had 100% sensitivity
    explanation: >-
      MRI was 100% sensitive for pyomyositis in this pediatric series, the
      central imaging diagnostic.
environmental:
- name: Muscle trauma or vigorous exercise
  description: >-
    Local muscle injury from trauma or vigorous activity creates the permissive
    lesion that circulating bacteria seed.
  evidence:
  - reference: PMID:29338140
    reference_title: "Primary pyomyositis in North India: a clinical, microbiological, and outcome study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      16 patients (25.8%) gave the history of trauma to affected muscles.
    explanation: >-
      A quarter of patients reported trauma to the affected muscle.
  influences_mechanisms:
  - target: Hematogenous seeding of injured skeletal muscle
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Muscle injury predisposes the muscle to hematogenous bacterial seeding.
    evidence:
    - reference: PMID:39971676
      reference_title: Tropical pyomyositis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The disease primarily affects men and young adults, often following minor
        trauma, with an increasing incidence in immunocompromised individuals.
      explanation: The disease often follows minor trauma to the muscle.
- name: Host immunocompromise
  description: >-
    HIV/AIDS, diabetes, hematologic malignancy, transplant, and chronic kidney
    disease predispose to pyomyositis, and immunocompromise is a major driver of
    the disease's rising incidence outside the tropics.
  evidence:
  - reference: PMID:34407271
    reference_title: "Factors associated with pyomyositis: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      significant associations between pyomyositis infection and HIV/AIDS.
    explanation: A meta-analysis finds a significant HIV/AIDS association.
  influences_mechanisms:
  - target: Hematogenous seeding of injured skeletal muscle
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Immunocompromise predisposes the host to bacterial seeding of muscle.
    evidence:
    - reference: PMID:32147332
      reference_title: Pyomyositis in the United States 2002-2014.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Age-adjusted odds ratios revealed significant association of pyomyositis
        with HIV, types 1 and 2 diabetes mellitus, hematologic malignancy, organ
        transplant, malnutrition, chronic kidney disease, obesity, and rheumatoid
        arthritis.
      explanation: >-
        A population study links pyomyositis to HIV, diabetes, malignancy,
        transplant, and other immunocompromising conditions.
    - reference: PMID:34407271
      reference_title: "Factors associated with pyomyositis: A systematic review and meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        significant associations between pyomyositis infection and HIV/AIDS.
      explanation: A meta-analysis finds a significant HIV/AIDS association.

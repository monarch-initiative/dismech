diagnosis:
- name: Molecular Genetic Testing of PCSK9
  description: >-
    A pathogenic or likely pathogenic PCSK9 gain-of-function variant, or a pathogenic
    duplication, establishes
    PCSK9-related FH in the appropriate clinical context. A variant of uncertain significance
    or a protective
    loss-of-function allele does not. An FH panel should assess relevant sequence
    and copy-number variants,
    with familial testing when a causal finding is established.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The molecular diagnosis of FH can be established by identification of heterozygous or biallelic pathogenic variants in APOB (variants that impair binding of LDL-C to the LDL receptor), LDLR, or PCSK9 (gain of function); or rarely, identification of biallelic pathogenic variants in LDLRAP1."
    explanation: >-
      GeneReviews states that molecular identification of a gain-of-function
      PCSK9 variant establishes the molecular diagnosis.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing is the preferred method for clarifying the diagnosis in at-risk family members, when possible."
    explanation: >-
      GeneReviews states that molecular testing is the preferred route for
      cascade clarification in relatives, the claim made in this entry's
      description.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  - *id012
- name: Lipid Surveillance from Early Childhood
  description: >-
    Early lipid assessment and family cascade screening identify affected children
    before clinical vascular
    disease. Follow-up evaluates LDL-C, treatment response and modifiable cardiovascular
    risks; the schedule
    and treatment thresholds depend on age and clinical context.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surveillance: Monitor lipid levels from age two years; consider noninvasive imaging modalities in adults; identify modifiable risk factors (e.g., smoking, sedentary behavior, hypertension, diabetes, obesity)."
    explanation: GeneReviews surveillance recommendation for FH.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
- name: Clinical Diagnostic Criteria for Familial Hypercholesterolemia
  description: >-
    DLCN, Simon Broome and MEDPED are FH-wide clinical frameworks with different criteria.
    DLCN incorporates
    LDL-C, clinical findings and history; MEDPED uses age- and family-relationship-specific
    cholesterol
    thresholds rather than a xanthoma score. They do not establish PCSK9 causation,
    and adult proband
    scores should not be substituted for pediatric or familial cascade criteria.
  evidence:
  - reference: PMID:29408959
    reference_title: "A Comparative Analysis of Phenotypic Predictors of Mutations in Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To compare the validity of the Dutch Lipid Clinic Network (DLCN), Simon Broome (SB), Make Early Diagnosis to Prevent Early Deaths (MEDPED), and American Heart Association (AHA) criteria in predicting an FH-causing mutation."
    explanation: >-
      Names the three clinical criteria sets used to reach an FH diagnosis
      before genetic testing.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:29408959
    reference_title: "A Comparative Analysis of Phenotypic Predictors of Mutations in Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The DLCN, SB, and MEDPED criteria are valid predictors of an FH-causing mutation in patients referred to a lipid clinic, but concordance between these phenotypic criteria is only moderate."
    explanation: >-
      Supports the criteria as valid predictors while recording their
      limitation in the same sentence - concordance between them is only
      moderate - which is why this entry keeps molecular testing as the
      diagnostic step.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  notes: >-
    Clinical and molecular assessment are complementary. Elevated Lp(a), treatment,
    age and referral selection
    can affect phenotypic classification.
- name: Assessment for Secondary Hypercholesterolemia
  description: Evaluate acquired causes of elevated LDL-C, including hypothyroidism, kidney disease, obstructive liver disease and medications, before attributing the entire phenotype to inherited FH.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/
    reference_title: Familial Hypercholesterolemia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hypercholesterolemia secondary to acquired conditions including obesity, diabetes mellitus, obstructive liver disease, hypothyroidism, drugs (e.g., steroids), or kidney disease can also be associated with laboratory findings similar to those of FH
    explanation: GeneReviews identifies important secondary causes that can mimic or modify FH.
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
differential_diagnoses:
- name: Familial hypercholesterolemia due to LDLR variants
  description: >-
    The most common dominant FH form. Clinically indistinguishable from ADH3 at
    the bedside; distinguished by molecular testing. Mechanistically the
    receptor itself is defective, rather than being degraded prematurely by a
    normal-but-overactive regulator.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The molecular diagnosis of FH can be established by identification of heterozygous or biallelic pathogenic variants in APOB (variants that impair binding of LDL-C to the LDL receptor), LDLR, or PCSK9 (gain of function); or rarely, identification of biallelic pathogenic variants in LDLRAP1."
    explanation: >-
      GeneReviews lists LDLR alongside PCSK9 as an alternative molecular cause
      of the same clinical picture, which is what makes it a differential.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
- name: Familial defective apolipoprotein B-100 (APOB)
  description: >-
    Dominant FH caused by APOB variants that impair binding of LDL to the LDL
    receptor. The receptor and its regulation are intact; the ligand is
    defective.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The molecular diagnosis of FH can be established by identification of heterozygous or biallelic pathogenic variants in APOB (variants that impair binding of LDL-C to the LDL receptor), LDLR, or PCSK9 (gain of function); or rarely, identification of biallelic pathogenic variants in LDLRAP1."
    explanation: >-
      GeneReviews specifies the APOB mechanism (impaired binding of LDL-C to the
      receptor) that distinguishes it from PCSK9 gain of function.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
- name: Autosomal recessive hypercholesterolemia (LDLRAP1)
  description: >-
    Caused by biallelic LDLRAP1 variants affecting the adaptor required for
    receptor endocytosis; recessive rather than dominant inheritance.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LDLRAP1-related FH is caused by biallelic pathogenic variants and is inherited in an autosomal recessive manner."
    explanation: >-
      GeneReviews states the recessive inheritance that separates this entity
      from dominant ADH3.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
- name: Polygenic hypercholesterolemia
  description: >-
    Elevated LDL cholesterol from the aggregate effect of many common
    small-effect alleles rather than a single dominant variant; the commonest
    explanation for a clinical FH phenotype without an identified monogenic
    cause.
- name: Sterol storage disorders presenting with tendon xanthomas
  description: >-
    Sitosterolemia (ABCG5/ABCG8) and cerebrotendinous xanthomatosis (CYP27A1)
    both produce tendon xanthomas indistinguishable on inspection from those of
    FH, and lysosomal acid lipase deficiency likewise causes dyslipidaemia with
    lipid deposition. They are separated from ADH3 not by the xanthomas but by
    the sterol profile and by inheritance - both are recessive, and in
    cerebrotendinous xanthomatosis cholesterol may be normal while cholestanol
    accumulates. This matters here because tendon xanthomatosis is a curated
    phenotype of this entry and is one of the strongest predictors in the
    clinical FH criteria above, so a xanthoma phenocopy can score as clinical FH
    while carrying no PCSK9 variant.

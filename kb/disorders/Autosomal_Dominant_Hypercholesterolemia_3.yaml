    evidence:
    - reference: PMID:12730697
      reference_title: "Mutations in PCSK9 cause autosomal dominant hypercholesterolemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "PCSK9 encodes NARC-1 (neural apoptosis regulated convertase), a newly identified human subtilase that is highly expressed in the liver and contributes to cholesterol homeostasis."
      explanation: >-
        Places the causal gene, and so the disease, in hepatic cholesterol
        homeostasis - the lipoprotein-metabolism material of Harrison's
        Endocrinology and Metabolism Part.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
    notes: >-
      Harrison's Parts follow the sibling FH entries
      (kb/disorders/LDLR-Related_Familial_Hypercholesterolemia.yaml,
      kb/disorders/Familial_Defective_Apolipoprotein_B-100.yaml), which place
      the dominant hypercholesterolemias in the metabolism Part plus the
      Mendelian genetics Part. CARDIOVASCULAR is deliberately not assigned:
      premature atherosclerotic disease is the dominant clinical outcome here,
      but it is modelled as the downstream pathograph branch and as phenotypes
      rather than as a second nosological home, and assigning it would put this
      entry out of step with the rest of the FH family for no mechanistic gain.

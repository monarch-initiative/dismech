discussions:
- evidence:
  - *id004
  - *id009
  - reference: PMID:17080197
    reference_title: Secreted PCSK9 decreases the number of LDL receptors in hepatocytes and in livers of parabiotic mice.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Considered together, the available data now suggest that PCSK9 can function both extra- and intracellularly, but we do not know which pathway predominates under normal and/or pathologic conditions.
    explanation: The authors distinguish pathway sufficiency from unresolved physiological predominance.
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
  discussion_id: adh3_allele_specific_routes
  prompt: How do allele-specific intracellular and extracellular routes contribute to the human LDL phenotype?
  rationale: The extracellular pathway is experimentally sufficient, but no universal secretion requirement follows from the high-expression parabiosis experiment. S127R cells can show reduced secretion with impaired LDL uptake, and two S127R carriers had increased apoB production by tracer modelling. These observations support heterogeneous, potentially parallel contributions rather than a single obligatory biochemical sequence.
  kind: KNOWLEDGE_GAP
  status: OPEN
- evidence:
  - reference: PMID:40225943
    reference_title: Functional Analysis of 3'UTR Variants at the LDLR and PCSK9 Genes in Patients with Familial Hypercholesterolemia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The luciferase expression of the c.∗171C > T and c.∗950C > T variants was 18% and 41% higher than that of PCSK9 WT (p < 0.006 and p < 0.0018)
    explanation: The measured output is a HepG2 luciferase reporter carrying the untranslated region. This does not directly measure endogenous PCSK9 expression, LDLR turnover, LDL uptake, or segregation.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  discussion_id: adh3_candidate_regulatory_variants
  prompt: Do candidate PCSK9 untranslated-region variants cause clinically meaningful gain of function?
  rationale: A 2025 selected FH study found altered HepG2 reporter activity for several PCSK9 untranslated-region variants. Increased reporter output for c.*950C>T does not measure endogenous protein, receptor turnover or LDL uptake, and segregation and miRNA mediation remain unresolved. These findings are kept as candidate regulatory observations rather than an established additional ADH3 subtype.
  kind: KNOWLEDGE_GAP
  status: OPEN
- discussion_id: adh3_cerebrovascular_risk
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does lifelong LDL-cholesterol elevation in familial hypercholesterolemia,
    and in PCSK9 gain-of-function carriers specifically, raise the risk of
    ischemic stroke and other cerebrovascular disease?
  attaches_to:
  - "phenotypes#"
  - "pathophysiology#Arterial Thrombus Formation"
  rationale: >-
    Stroke occurrence is documented in a selected PCSK9 carrier series (6/98 assessed;
    PMID:26374825 Table
    1), and GeneReviews includes stroke among FH manifestations. Whether PCSK9-related
    FH confers excess
    stroke risk remains unresolved. Broader molecularly defined FH cohorts reported
    no excess cerebrovascular
    risk, unlike their coronary risk. These designs do not establish an allele-specific
    effect or absence
    of stroke; no population frequency is inferred from selected carriers.
  evidence:
  - reference: PMID:30580708
    reference_title: "Risk of Ischemic Stroke and Total Cerebrovascular Disease in Familial Hypercholesterolemia: A Register Study From Norway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whether FH increases the risk of cerebrovascular disease, including ischemic stroke, is debated."
    explanation: >-
      States the controversy directly, in the background of the study that then
      reports a null result - establishing that this is a live disagreement in
      the field and not an artefact of this entry's reading.
    quote_role: BACKGROUND
    directness: DIRECT
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial hypercholesterolemia (FH) is characterized by significantly elevated low-density lipoprotein cholesterol (LDL-C) that leads to atherosclerotic plaque deposition in the coronary arteries and proximal aorta at an early age and increases the risk of premature cardiovascular events such as angina and myocardial infarction; stroke occurs more rarely."
    explanation: >-
      GeneReviews keeps stroke on the FH manifestation list while calling it
      rarer than the coronary events. Cited for the listing, not as a claim of
      excess risk - the clause itself is closer to the registry findings than
      to a positive association.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  - reference: PMID:30580708
    reference_title: "Risk of Ischemic Stroke and Total Cerebrovascular Disease in Familial Hypercholesterolemia: A Register Study From Norway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a large cohort of genetically verified FH, risks of cerebrovascular disease and ischemic stroke were not increased compared with the total Norwegian population."
    explanation: >-
      Supports the opposing position, in 3144 genetically verified FH patients
      linked to a nationwide hospitalisation database.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:27444203
    reference_title: "Coronary Heart Disease, Peripheral Arterial Disease, and Stroke in Familial Hypercholesterolaemia: Insights From the SAFEHEART Registry (Spanish Familial Hypercholesterolaemia Cohort Study)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Coronary artery-related manifestations and peripheral artery disease were more prevalent in FH patients than in controls, but no significant differences were found for cerebrovascular events."
    explanation: >-
      Independent replication of the null cerebrovascular result in a second
      molecularly defined FH registry, alongside a positive coronary and
      peripheral result in the same comparison.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - &id010
    reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/
    reference_title: Familial Hypercholesterolemia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: increases the risk of premature cardiovascular events such as angina and myocardial infarction; stroke occurs more rarely.
    explanation: GeneReviews includes stroke among FH manifestations; occurrence does not establish a PCSK9-specific excess relative to controls.
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
  notes: >-
    Stroke occurrence is curated as a phenotype, with a PCSK9-carrier count from PMID:26374825 Table 1
    and broader FH synthesis. Excess risk and an allele-specific causal route remain unresolved; occurrence
    alone does not establish either.

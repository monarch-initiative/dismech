    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous PCSK9 gain-of-function variants segregate as an autosomal
    dominant trait, as first shown by linkage of the HCHOLA3 locus at 1p32 in
    French ADH pedigrees.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "APOB-, LDLR-, and PCSK9-related FH are inherited in an autosomal dominant manner."
    explanation: GeneReviews states the mode of inheritance for PCSK9-related FH explicitly.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of an individual with a heterozygous pathogenic variant in APOB, LDLR, or PCSK9 has a 50% chance of inheriting the pathogenic variant and having FH."
    explanation: >-
      GeneReviews states the 50% transmission risk for a heterozygous PCSK9
      variant, the recurrence figure used in genetic counselling.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  - reference: PMID:12730697
    reference_title: "Mutations in PCSK9 cause autosomal dominant hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We mapped a third locus associated with ADH, HCHOLA3 at 1p32, and now report two mutations in the gene PCSK9 (encoding proprotein convertase subtilisin/kexin type 9) that cause ADH."
    explanation: >-
      The founding report identifies PCSK9 as the third autosomal dominant
      hypercholesterolemia locus, establishing the disease entity curated here.

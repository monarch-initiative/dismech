    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among patients who had a previous acute coronary syndrome and who were receiving high-intensity statin therapy, the risk of recurrent ischemic cardiovascular events was lower among those who received alirocumab than among those who received placebo."
    explanation: Randomised outcome evidence for PCSK9 antibody therapy.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:37009731
    reference_title: "Alirocumab and Coronary Atherosclerosis in Asymptomatic Patients with Familial Hypercholesterolemia: The ARCHITECT Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with alirocumab in addition to high-intensity statin therapy resulted in significant regression of coronary plaque burden and plaque stabilization on coronary computed tomographic angiography over 78 weeks"
    explanation: >-
      The FH-specific alirocumab trial, in a molecularly determined cohort -
      closer to this entry's population than the post-acute-coronary-syndrome
      outcome trial, though still not PCSK9-stratified.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - &id015
    reference: PMID:26374825
    reference_title: Characterization of Autosomal Dominant Hypercholesterolemia Caused by PCSK9 Gain of Function Mutations and Its Specific Treatment With Alirocumab, a PCSK9 Monoclonal Antibody.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: mean percent reduction in LDL-C at 2 weeks was 62.5% (P<0.0001) from baseline and 53.7% compared with control PCSK9 GOF mutation patients treated with placebo for 2 weeks (P=0.0009; primary end point).
    explanation: The primary randomized contrast was a 53.7-percentage-point difference at week 2 in 13 adults carrying four PCSK9 variants; the 62.5% figure is a within-group change. This was not an event-outcome trial.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  notes: >-
    The 13-person trial tested a two-week randomized LDL-C contrast; its pooled eight-week
    73.3% reduction
    had no concurrent placebo comparator. All participants received statins and six
    received ezetimibe.
    It was too small and short for cardiovascular-event or uncommon-safety conclusions.
    ODYSSEY OUTCOMES
    and ARCHITECT provide broader-population evidence; ARCHITECT was open-label and
    single-arm, without
    a reported PCSK9-stratified effect.
- name: Inclisiran
  description: >-
    A small interfering RNA that silences PCSK9 messenger RNA in the
    hepatocyte, suppressing synthesis of the protein rather than neutralising
    it after secretion. Given twice yearly after loading. In heterozygous
    familial hypercholesterolemia it lowered LDL cholesterol by roughly 40%
    versus baseline (about 48 percentage points versus placebo), with
    reductions reported across FH genotypes.
  therapeutic_modality: SIRNA
  oligonucleotide_details:
    oligonucleotide_mechanism: RNAI_KNOCKDOWN
    target_gene:
      preferred_term: PCSK9
      term:
        id: hgnc:20001
        label: PCSK9
    target_transcript: PCSK9 mRNA
    conjugation: GALNAC
    delivery_platform: CONJUGATE
  dosing_interval: once every 6 months
  dosing_interval_days: 182.5
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: inclisiran
      term:
        id: NCIT:C170062
        label: Inclisiran
  target_mechanisms:
  - target: Production of Disease-Associated PCSK9
    treatment_effect: INHIBITS
    description: >-
      RNA interference suppresses hepatic PCSK9 synthesis. The cited LDL-C trial does
      not establish that
      an apoB-production mechanism was specifically reversed in PCSK9 carriers.
    evidence:
    - reference: PMID:32197277
      reference_title: "Inclisiran for the Treatment of Heterozygous Familial Hypercholesterolemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In a phase 2 trial, a twice-yearly injection of inclisiran, a small interfering RNA, was shown to inhibit hepatic synthesis of PCSK9 in adults with heterozygous familial hypercholesterolemia."
      explanation: >-
        States inclisiran's mechanism as inhibition of hepatic PCSK9 synthesis.
        The sentence reports the earlier phase 2 result rather than this
        trial's own finding, and is cited for the mechanism only; ORION-9's own
        LDL-C result is cited separately on the treatment.
      quote_role: BACKGROUND
      directness: INDIRECT
  evidence:
  - reference: PMID:32197277
    reference_title: "Inclisiran for the Treatment of Heterozygous Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among adults with heterozygous familial hypercholesterolemia, those who received inclisiran had significantly lower levels of LDL cholesterol than those who received placebo, with an infrequent dosing regimen and an acceptable safety profile."
    explanation: Randomised evidence of efficacy in heterozygous familial hypercholesterolemia.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:32197277
    reference_title: "Inclisiran for the Treatment of Heterozygous Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were robust reductions in LDL cholesterol levels in all genotypes of familial hypercholesterolemia."
    explanation: >-
      Reports that the LDL-lowering effect was seen across FH genotypes, the
      closest available evidence that it applies to PCSK9-gene carriers.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  notes: >-
    ORION-9 measured LDL-C in broader heterozygous FH. ORION-4 (NCT03705234) is an
    event-outcome study
    in established ASCVD, listed as active, not recruiting when checked in September
    2026; it does not
    supply completed ADH3-specific cardiovascular-event evidence here.
- name: Statin Therapy
  description: >-
    HMG-CoA reductase inhibition is foundational FH therapy. Response varies: selected
    D374Y carriers
    remained severely hypercholesterolemic despite treatment, while a small S127R
    series had substantial
    LDL-C lowering. These observations do not establish universal PCSK9-related statin
    resistance.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: atorvastatin
      term:
        id: CHEBI:39548
        label: atorvastatin
    - preferred_term: simvastatin
      term:
        id: NCIT:C29454
        label: Simvastatin
  target_mechanisms:
  - target: Reduced Hepatic Clearance of Circulating LDL Particles
    treatment_effect: RESTORES
    description: >-
      Statins promote LDL removal through the established hepatic cholesterol/LDLR
      response. The D374Y
      family series measured serum cholesterol rather than hepatic clearance flux,
      so it provides indirect
      support for this mechanism.
    evidence:
    - reference: PMID:16224054
      reference_title: "Severe hypercholesterolemia in four British families with the D374Y mutation in the PCSK9 gene: long-term follow-up and treatment response."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "had higher pretreatment serum cholesterol levels (13.6+/-2.9 versus 9.6+/-1.6 mmol/L; P=0.004) that remained higher during treatment with simvastatin (10.1+/-3.0 versus 6.5+/-0.9 mmol/L; P=0.006)"
      explanation: >-
        Treatment-associated total-cholesterol change in selected D374Y families,
        not a direct assay of
        hepatic LDL clearance.
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adults: pharmacotherapy (statins with additional medications as needed) to reduce lipid levels; referral to a lipid specialist if necessary to reduce LDL-C levels"
    explanation: GeneReviews states statins as first-line pharmacotherapy in FH.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Children: referral to a lipid specialist; diet and lifestyle modifications; statins can be used in children starting around age eight years."
    explanation: >-
      GeneReviews sets the paediatric starting point for statin therapy, which
      matters here because the LDL burden is present from birth.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  - reference: url:https://www.fda.gov/drugs/drug-safety-and-availability/fda-requests-removal-strongest-warning-against-using-cholesterol-lowering-statins-during-pregnancy
    reference_title: FDA requests removal of strongest warning against using cholesterol-lowering statins during pregnancy; still advises most pregnant patients should stop taking statins | FDA
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Health care professionals should discontinue statin therapy in most pregnant patients. Alternatively, health care professionals should consider the ongoing therapeutic needs of the individual patient
    explanation: FDA guidance replaces an absolute prohibition with usual discontinuation and individualized assessment for exceptional high-risk patients.
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:41741298
    reference_title: 'Update on familial hypercholesterolemia: An expert clinical consensus from the National Lipid Association.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A stepwise approach to optimal therapy is outlined, beginning with lifestyle interventions and pharmacotherapy with maximally tolerated statins and ezetimibe.
    explanation: The 2026 NLA consensus supports foundational care across FH. Its cached abstract does not provide detailed genotype-specific thresholds.
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
  notes: >-
    FDA removed the blanket pregnancy contraindication in 2021. Most pregnant patients
    should stop statins;
    selected very-high-risk patients require individualized specialist assessment.
    Patients requiring
    ongoing statins should not breastfeed. The regulatory change does not prove fetal
    safety, and evidence
    about miscarriage remains insufficient. Preconception planning should address
    maternal risk and alternatives.
- name: Ezetimibe
  description: >-
    Intestinal cholesterol-absorption inhibitor used with statins or other agents
    to achieve individualized
    FH LDL-C goals. Intensification depends on baseline LDL-C, ASCVD risk, tolerance
    and response; every
    patient need not follow a rigid sequence.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ezetimibe
      term:
        id: CHEBI:49040
        label: ezetimibe
  target_mechanisms:
  - target: Chronic Elevation of Plasma LDL Cholesterol
    treatment_effect: MODULATES
    description: >-
      Reduced intestinal cholesterol absorption lowers the plasma LDL burden
      downstream of the PCSK9 lesion rather than correcting it.
    evidence:
    - reference: PMID:37322181
      reference_title: International Atherosclerosis Society guidance for implementing best practice in the care of familial hypercholesterolaemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: PCSK9-targeted therapy (monoclonal antibodies or a small interfering RNA (inclisiran)) should be added if LDL-cholesterol goals are not achieved with diet, maximally tolerated statins, ezetimibe, bempedoic acid and other adjunctive therapies
      explanation: FH-wide guidance supports ezetimibe as part of LDL-lowering care; it is not an isolated drug-mechanism experiment.
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
  notes: >-
    Curated as background therapy for FH generally. No PCSK9-genotyped
    ezetimibe trial is cited.
- name: Bempedoic Acid
  description: >-
    ATP citrate lyase inhibitor used as an additional LDL-lowering option, including
    in statin intolerance.
    CLEAR Outcomes supports event reduction in statin-intolerant high-risk patients,
    without a PCSK9-specific
    estimate.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bempedoic acid
      term:
        id: CHEBI:149601
        label: bempedoic acid
  target_mechanisms:
  - target: Chronic Elevation of Plasma LDL Cholesterol
    treatment_effect: MODULATES
    description: >-
      ATP citrate lyase inhibition reduces hepatic cholesterol synthesis and so
      lowers the circulating LDL burden downstream of the PCSK9 lesion, without
      acting on PCSK9 or on LDL receptor degradation.
    evidence:
    - reference: PMID:36876740
      reference_title: "Bempedoic Acid and Cardiovascular Outcomes in Statin-Intolerant Patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Bempedoic acid, an ATP citrate lyase inhibitor, reduces low-density lipoprotein (LDL) cholesterol levels and is associated with a low incidence of muscle-related adverse events"
      explanation: >-
        States the molecular target and the LDL-lowering effect that place this
        agent on the plasma-LDL node rather than on the PCSK9 node.
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
  evidence:
  - reference: PMID:36876740
    reference_title: "Bempedoic Acid and Cardiovascular Outcomes in Statin-Intolerant Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of a primary end-point event was significantly lower with bempedoic acid than with placebo (819 patients [11.7%] vs. 927 [13.3%]; hazard ratio, 0.87; 95% confidence interval [CI], 0.79 to 0.96; P = 0.004)"
    explanation: >-
      CLEAR Outcomes provides the cardiovascular outcome evidence that
      justifies curating bempedoic acid alongside ezetimibe and apheresis
      rather than as an investigational option.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  notes: >-
    Curated as background therapy for FH generally, on the same footing as
    ezetimibe. CLEAR Outcomes enrolled statin-intolerant patients at high
    cardiovascular risk, not a PCSK9-genotyped or FH-only cohort, so the
    outcome benefit is not ADH3-specific evidence.
- name: Colesevelam
  description: >-
    Nonabsorbed bile acid sequestrant used as an adjunct for LDL-C reduction. It can
    be considered in
    pregnancy under specialist care; limited pregnancy experience and potential effects
    on fat-soluble
    vitamin absorption require consideration.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: colesevelam
      term:
        id: CHEBI:59594
        label: colesevelam
  target_mechanisms:
  - target: Chronic Elevation of Plasma LDL Cholesterol
    treatment_effect: MODULATES
    description: >-
      Adds LDL-C lowering on top of maximally tolerated statin plus ezetimibe,
      reducing the plasma LDL burden downstream of the PCSK9 lesion without
      correcting it.
    evidence:
    - reference: PMID:23916045
      reference_title: "The efficacy of colesevelam HCl in the treatment of heterozygous familial hypercholesterolemia in pediatric and adult patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In the study in adults with refractory FH, the addition of colesevelam to a maximally tolerated regimen of a statin plus ezetimibe provided a significantly greater reduction from baseline in LDL-C levels compared with placebo."
      explanation: >-
        Establishes an incremental LDL-C reduction on top of the statin plus
        ezetimibe background this entry already curates.
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
  evidence:
  - reference: PMID:23916045
    reference_title: "The efficacy of colesevelam HCl in the treatment of heterozygous familial hypercholesterolemia in pediatric and adult patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The bile acid sequestrant colesevelam is indicated to reduce elevated LDL-C levels in adults with primary hyperlipidemia and in boys and postmenarchal girls (aged 10-17 years) with heterozygous FH."
    explanation: >-
      States the licensed indications: primary hyperlipidemia in adults, and
      heterozygous FH in the paediatric population this entry's progression
      section starts from.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  - reference: PMID:38338916
    reference_title: "Unveiling Familial Hypercholesterolemia-Review, Cardiovascular Complications, Lipid-Lowering Treatment and Its Efficacy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bile acid sequestrants bind the bile acids and prevent the reabsorption of cholesterol into the blood. Thus, they increase the metabolism of cholesterol into bile acids and intensify the synthesis of LDLR, which reduces the levels of LDL in the blood"
    explanation: >-
      Sources the class mechanism stated in this treatment's description - the
      LDL receptor upregulation that makes a sequestrant relevant to a
      receptor-degradation disease.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  - reference: PMID:37322181
    reference_title: International Atherosclerosis Society guidance for implementing best practice in the care of familial hypercholesterolaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Bile acid sequestrants should be considered to treat hypercholesterolaemia, ideally 3 months before a planned pregnancy, as well as during pregnancy and lactation;
    explanation: FH guidance permits consideration of this class; the recommendation is not a randomized pregnancy-safety result.
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
  notes: >-
    The cited lipid-lowering studies concern broader heterozygous FH, not a PCSK9-specific
    treatment estimate.
    Pregnancy guidance is FH-wide and does not imply proven absence of risk.
- name: LDL Apheresis
  description: >-
    Specialist extracorporeal removal of apoB-containing lipoproteins for selected
    severe FH, particularly
    progressive ASCVD despite intensive combination treatment. The British D374Y series
    documents use
    of apheresis/partial ileal bypass among two intensively treated carriers; the
    abstract does not resolve
    each individual procedure.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: therapeutic apheresis
    term:
      id: NCIT:C173286
      label: Therapeutic Apheresis
  target_mechanisms:
  - target: Chronic Elevation of Plasma LDL Cholesterol
    treatment_effect: MODULATES
    description: >-
      Apheresis removes circulating LDL directly, bypassing the failed hepatic
      receptor route rather than repairing it.
    evidence:
    - reference: PMID:16224054
      reference_title: "Severe hypercholesterolemia in four British families with the D374Y mutation in the PCSK9 gene: long-term follow-up and treatment response."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "or current lipid-lowering therapy, including LDL apheresis and partial ileal bypass in 2 PCSK9 patients (7.0+/-1.6 versus 5.4+/-1.0 mmol/L; P=0.001)"
      explanation: >-
        The family report documents intensive therapy including apheresis and partial
        ileal bypass in
        two patients; procedure-level allocation is not inferred from the abstract.
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
  evidence:
  - reference: PMID:16224054
    reference_title: "Severe hypercholesterolemia in four British families with the D374Y mutation in the PCSK9 gene: long-term follow-up and treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These British PCSK9 patients with the D374Y mutation have an unpredictably severe clinical phenotype, which may be a unique feature for this cohort, and requires early and aggressive lipid-lowering management to prevent cardiovascular complications."
    explanation: >-
      Supports escalation to aggressive lipid-lowering management in this
      genotype, of which apheresis is the most intensive form.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:37322181
    reference_title: International Atherosclerosis Society guidance for implementing best practice in the care of familial hypercholesterolaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Lipoprotein apheresis should be undertaken in adults with phenotypic HeFH and progressive ASCVD who do not achieve LDL-cholesterol goals despite combined treatment with a high-potency statin, ezetimibe and a PCSK9 inhibitor,
    explanation: FH-wide criteria support specialist escalation for selected refractory disease.
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
- name: Cardiovascular Risk Factor Modification
  description: >-
    Non-pharmacological management: smoking cessation, reduced saturated and
    trans fat intake, increased soluble fibre, physical activity, weight
    control, and treatment of hypertension and diabetes. These do not address
    the PCSK9 lesion but reduce the atherogenic burden it acts upon.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: lifestyle and risk-factor therapy
    term:
      id: NCIT:C15900
      label: Lifestyle Therapy
  target_mechanisms:
  - target: Subendothelial Retention of ApoB-Containing Lipoproteins
    treatment_effect: MODULATES
    description: >-
      Lifestyle and risk-factor care can reduce cardiovascular risk through several
      lipid and vascular
      processes. The GeneReviews recommendation does not isolate a measured effect
      on intimal retention.
    evidence:
    - reference: PMID:24404629
      reference_title: "Familial Hypercholesterolemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Agents/circumstances to avoid: Smoking, high intake of saturated and trans unsaturated fat, sedentary lifestyle, obesity, hypertension, and diabetes mellitus."
      explanation: GeneReviews names the modifiable exposures that aggravate atherosclerotic risk in FH.
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prevention of primary manifestations: Heart-healthy diet (including reduced intake of saturated fat and increased intake of soluble fiber to 10-20 g/day); increased physical activity; no smoking."
    explanation: GeneReviews management recommendation for primary prevention in FH.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
- name: Age- and Risk-Adapted Pediatric Lipid-Lowering Care
  description: Treatment decisions use repeated lipid measurements, age, family history and other risks. IAS 2023 guidance recommends offering medication at ages 8–10 for persistent LDL-C above 190 mg/dL, with lower thresholds considered when additional risk is present. Drug selection follows local pediatric approvals and specialist assessment; these are broader FH recommendations, not PCSK9-specific trial thresholds.
  notes: Long-term evidence for newer agents in children remains limited. Growth, adherence and adverse effects require follow-up. The cited age threshold is explicitly the 2023 IAS recommendation, not a universal regulatory label.
  evidence:
  - reference: PMID:37322181
    reference_title: International Atherosclerosis Society guidance for implementing best practice in the care of familial hypercholesterolaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pharmacological treatment should be offered at age 8–10 years with an LDL-cholesterol concentration >4.9 mmol/l (>190 mg/dl), recorded on two occasions with a fasting lipid profile
    explanation: Age and repeat LDL-C measurements qualify the pediatric FH recommendation.
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:37322181
    reference_title: International Atherosclerosis Society guidance for implementing best practice in the care of familial hypercholesterolaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Use of a PCSK9 inhibitor may be considered according to clinical indications and regulatory approvals, with the caveat of limited evidence of long-term safety in children and adolescents
    explanation: Pediatric use remains conditional on indication and approval; no uniform age label is inferred.
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
experimental_models:
- name: Urine-derived iPSC hepatocyte-like cells from a PCSK9 S127R carrier (HLC-S127R)
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Urine-derived cells from one S127R carrier were reprogrammed into iPSCs and differentiated
    into hepatocyte-like
    cells. One healthy donor supplied the comparator; multiple clones are not independent
    patients. The
    nonisogenic comparison supports a patient-cell phenotype without isolating the
    variant from donor
    background.
  cell_source: Patient-derived (urine somatic cells reprogrammed to iPSC)
  culture_system: Two-dimensional hepatocyte-like cell differentiation
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: hepatocyte-like cell
    term:
      id: CL:0000182
      label: hepatocyte
  publication: PMID:26586530
  modeled_mechanisms:
  - target: Reduced Hepatic Clearance of Circulating LDL Particles
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Hepatocyte-like cells carrying the patient's S127R allele take up 71% less
      LDL than control cells, the cellular readout of this node.
    limitations: >-
      Hepatocyte-like cells derived from iPSC are immature relative to adult
      hepatocytes; the comparison is between individuals rather than between
      isogenic corrected and uncorrected lines, so donor background is not
      controlled.
    readouts:
    - name: LDL uptake by hepatocyte-like cells
      target: Reduced Hepatic Clearance of Circulating LDL Particles
      direction: DECREASED
      interpretation: >-
        A cellular LDL-uptake measurement supporting, but not directly measuring,
        whole-body hepatic clearance.
      evidence:
      - reference: PMID:26586530
        reference_title: "Urine-sample-derived human induced pluripotent stem cells as a model to study PCSK9-mediated autosomal dominant hypercholesterolemia."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "cells originally derived from an individual with ADH (HLC-S127R) secreted less PCSK9 in the media (-38.5%; P=0.038) and had a 71% decrease (P<0.001) of low-density lipoprotein (LDL) uptake"
        explanation: Reports the LDL-uptake measurement grounding this readout.
        quote_role: PRIMARY_RESULT
        directness: DIRECT
    evidence:
    - reference: PMID:26586530
      reference_title: "Urine-sample-derived human induced pluripotent stem cells as a model to study PCSK9-mediated autosomal dominant hypercholesterolemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We aimed to validate urine-sample-derived human induced pluripotent stem cells (UhiPSCs) as an appropriate tool to model PCSK9-mediated ADH and FHBL."
      explanation: >-
        States the model's purpose as a model of PCSK9-mediated autosomal
        dominant hypercholesterolemia.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  evidence:
  - reference: PMID:26586530
    reference_title: "Urine-sample-derived human induced pluripotent stem cells as a model to study PCSK9-mediated autosomal dominant hypercholesterolemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "urine samples provide an attractive and convenient source of somatic cells for reprogramming and hepatocyte differentiation, but also a powerful tool to further decipher PCSK9 mutations and function."
    explanation: The authors' conclusion on the model's utility for studying PCSK9 variant function.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  notes: >-
    Pravastatin enhanced LDL uptake in culture; a separate uncontrolled clinical observation
    involved
    five S127R carriers. The cell response does not validate individual clinical prediction
    or universal
    statin sensitivity.

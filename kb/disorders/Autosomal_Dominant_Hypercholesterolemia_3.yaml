  description: 'Hepatic expression supplies variant PCSK9 or additional wild-type protein after gene duplication. This is the synthesis step targeted by RNA silencing. It does not assert increased synthesis or secretion for every allele: S127R hepatocyte-like cells secreted less protein despite impaired LDL uptake. Intracellular and extracellular actions need not share a secretion requirement.'

treatments:
- name: Evolocumab
  description: >-
    Fully human monoclonal antibody that binds circulating PCSK9 and prevents
    it from engaging the hepatocyte LDL receptor, restoring receptor recycling
    and hepatic LDL clearance. In heterozygous familial hypercholesterolemia it
    lowers LDL cholesterol by approximately 60% on top of statin therapy, and in
    established atherosclerotic cardiovascular disease it reduces cardiovascular
    events. It is the mechanistically direct therapy for ADH3: the drug target
    is the mutated protein itself.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: evolocumab
      term:
        id: NCIT:C174672
        label: Evolocumab
  target_mechanisms:
  - target: PCSK9 Binding to the LDL Receptor EGF-A Domain
    treatment_effect: INHIBITS
    description: >-
      Antibody neutralisation of circulating PCSK9 blocks the EGF-A engagement
      that initiates receptor degradation.
    evidence:
    - reference: PMID:28304224
      reference_title: "Evolocumab and Clinical Outcomes in Patients with Cardiovascular Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Evolocumab is a monoclonal antibody that inhibits proprotein convertase subtilisin-kexin type 9 (PCSK9) and lowers low-density lipoprotein (LDL) cholesterol levels by approximately 60%."
      explanation: >-
        States the drug's target and its effect on the LDL cholesterol output
        of this pathway. This is the trial's background statement of the
        established drug mechanism, cited for the drug-target identity; the
        trial's own outcome result is cited separately on the treatment.
  evidence:
  - reference: PMID:25282519
    reference_title: "PCSK9 inhibition with evolocumab (AMG 145) in heterozygous familial hypercholesterolaemia (RUTHERFORD-2): a randomised, double-blind, placebo-controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with heterozygous familial hypercholesterolaemia, evolocumab administered either 140 mg every 2 weeks or 420 mg monthly was well tolerated and yielded similar and rapid 60% reductions in LDL cholesterol compared with placebo."
    explanation: >-
      Randomised evidence of efficacy in heterozygous familial
      hypercholesterolemia, the clinical setting of ADH3.
  - reference: PMID:28304224
    reference_title: "Evolocumab and Clinical Outcomes in Patients with Cardiovascular Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our trial, inhibition of PCSK9 with evolocumab on a background of statin therapy lowered LDL cholesterol levels to a median of 30 mg per deciliter (0.78 mmol per liter) and reduced the risk of cardiovascular events."
    explanation: >-
      Outcome evidence that PCSK9 inhibition reduces cardiovascular events, the
      clinical endpoint this disease threatens.
  notes: >-
    The cardiovascular-outcome evidence (FOURIER) was generated in patients with
    established atherosclerotic cardiovascular disease, not in a
    PCSK9-genotyped ADH3 cohort. No trial has been powered on PCSK9
    gain-of-function carriers specifically.
- name: Alirocumab
  description: >-
    Human monoclonal antibody against PCSK9, the same mechanism as evolocumab.
    In patients with recent acute coronary syndrome on high-intensity statin it
    reduced recurrent ischemic cardiovascular events.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: alirocumab
      term:
        id: NCIT:C174849
        label: Alirocumab
  target_mechanisms:
  - target: PCSK9 Binding to the LDL Receptor EGF-A Domain
    treatment_effect: INHIBITS
    description: >-
      Antibody binding to circulating PCSK9 prevents the receptor engagement
      step.
    evidence:
    - reference: PMID:30403574
      reference_title: "Alirocumab and Cardiovascular Outcomes after Acute Coronary Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We sought to determine whether alirocumab, a human monoclonal antibody to proprotein convertase subtilisin-kexin type 9 (PCSK9), would improve cardiovascular outcomes after an acute coronary syndrome in patients receiving high-intensity statin therapy."
      explanation: >-
        Identifies alirocumab's molecular target as PCSK9. This is the trial's
        aim sentence rather than a result; it is cited for the drug-target
        identity only, with the trial's outcome result cited separately on the
        treatment itself.
  evidence:
  - reference: PMID:30403574
    reference_title: "Alirocumab and Cardiovascular Outcomes after Acute Coronary Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among patients who had a previous acute coronary syndrome and who were receiving high-intensity statin therapy, the risk of recurrent ischemic cardiovascular events was lower among those who received alirocumab than among those who received placebo."
    explanation: Randomised outcome evidence for PCSK9 antibody therapy.
  notes: >-
    As for evolocumab, the outcome trial enrolled post-acute-coronary-syndrome
    patients rather than genotyped PCSK9 gain-of-function carriers.
- name: Inclisiran
  description: >-
    A small interfering RNA that silences PCSK9 messenger RNA in the
    hepatocyte, suppressing synthesis of the protein rather than neutralising
    it after secretion. Given twice yearly after loading. In heterozygous
    familial hypercholesterolemia it lowered LDL cholesterol by roughly 40%
    versus baseline (about 48 percentage points versus placebo), with
    reductions reported across FH genotypes.
  therapeutic_modality: SIRNA
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: inclisiran
      term:
        id: NCIT:C170062
        label: Inclisiran
  target_mechanisms:
  - target: Hepatic PCSK9 Synthesis and Secretion
    treatment_effect: INHIBITS
    description: >-
      Hepatic silencing of PCSK9 messenger RNA reduces production of the mutant
      protein itself, acting upstream of its secretion and receptor engagement.
      This is the one PCSK9-directed mechanism that would also blunt an
      intracellular (apoB-secretion) contribution.
    evidence:
    - reference: PMID:32197277
      reference_title: "Inclisiran for the Treatment of Heterozygous Familial Hypercholesterolemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In a phase 2 trial, a twice-yearly injection of inclisiran, a small interfering RNA, was shown to inhibit hepatic synthesis of PCSK9 in adults with heterozygous familial hypercholesterolemia."
      explanation: >-
        States inclisiran's mechanism as inhibition of hepatic PCSK9 synthesis.
        The sentence reports the earlier phase 2 result rather than this
        trial's own finding, and is cited for the mechanism only; ORION-9's own
        LDL-C result is cited separately on the treatment.
  evidence:
  - reference: PMID:32197277
    reference_title: "Inclisiran for the Treatment of Heterozygous Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among adults with heterozygous familial hypercholesterolemia, those who received inclisiran had significantly lower levels of LDL cholesterol than those who received placebo, with an infrequent dosing regimen and an acceptable safety profile."
    explanation: Randomised evidence of efficacy in heterozygous familial hypercholesterolemia.
  - reference: PMID:32197277
    reference_title: "Inclisiran for the Treatment of Heterozygous Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were robust reductions in LDL cholesterol levels in all genotypes of familial hypercholesterolemia."
    explanation: >-
      Reports that the LDL-lowering effect was seen across FH genotypes, the
      closest available evidence that it applies to PCSK9-gene carriers.
  notes: >-
    ORION-9 reported LDL cholesterol, not cardiovascular events; no
    outcome trial of inclisiran was available for citation here. The
    genotype statement is an all-genotype subgroup observation, not a
    PCSK9-carrier-specific result.
- name: Statin Therapy
  description: >-
    HMG-CoA reductase inhibition is first-line lipid-lowering therapy in
    familial hypercholesterolemia and is the background on which PCSK9-directed
    agents are added. PCSK9 D374Y carriers respond to statins but remain at
    substantially higher cholesterol on treatment than LDLR-mutation
    heterozygotes, which is why they usually need combination therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: atorvastatin
      term:
        id: CHEBI:39548
        label: atorvastatin
    - preferred_term: simvastatin
      term:
        id: NCIT:C29454
        label: Simvastatin
  target_mechanisms:
  - target: Reduced Hepatic Clearance of Circulating LDL Particles
    treatment_effect: RESTORES
    description: >-
      Statin therapy partially restores hepatic LDL clearance in PCSK9
      gain-of-function carriers - serum cholesterol falls, but stays above the
      level reached by LDLR-mutation heterozygotes on the same drugs.
    evidence:
    - reference: PMID:16224054
      reference_title: "Severe hypercholesterolemia in four British families with the D374Y mutation in the PCSK9 gene: long-term follow-up and treatment response."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "had higher pretreatment serum cholesterol levels (13.6+/-2.9 versus 9.6+/-1.6 mmol/L; P=0.004) that remained higher during treatment with simvastatin (10.1+/-3.0 versus 6.5+/-0.9 mmol/L; P=0.006)"
      explanation: >-
        Shows that statin therapy lowers cholesterol in PCSK9 carriers but
        leaves them above the level reached by LDLR-mutation heterozygotes -
        partial restoration, hence PARTIAL.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adults: pharmacotherapy (statins with additional medications as needed) to reduce lipid levels; referral to a lipid specialist if necessary to reduce LDL-C levels"
    explanation: GeneReviews states statins as first-line pharmacotherapy in FH.
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Children: referral to a lipid specialist; diet and lifestyle modifications; statins can be used in children starting around age eight years."
    explanation: >-
      GeneReviews sets the paediatric starting point for statin therapy, which
      matters here because the LDL burden is present from birth.
  notes: >-
    GeneReviews records that statins are contraindicated in pregnancy because
    of teratogenicity concerns and should be discontinued before conception,
    and that the safety of PCSK9 inhibitors, ezetimibe, lomitapide and
    bempedoic acid in pregnancy has not been well studied - so no
    lipid-lowering option is established for a pregnant ADH3 carrier.
- name: Ezetimibe
  description: >-
    Cholesterol-absorption inhibitor added to statin therapy when the LDL-C
    target is not reached. It is step two of the standard FH escalation, before
    a PCSK9-directed agent; it does not act on the PCSK9 lesion itself but
    lowers the LDL burden the lesion creates.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ezetimibe
      term:
        id: CHEBI:49040
        label: ezetimibe
  target_mechanisms:
  - target: Chronic Elevation of Plasma LDL Cholesterol
    treatment_effect: MODULATES
    description: >-
      Reduced intestinal cholesterol absorption lowers the plasma LDL burden
      downstream of the PCSK9 lesion rather than correcting it.
    evidence:
    - reference: PMID:25282519
      reference_title: "PCSK9 inhibition with evolocumab (AMG 145) in heterozygous familial hypercholesterolaemia (RUTHERFORD-2): a randomised, double-blind, placebo-controlled trial."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Despite intensive statin therapy, with or without ezetimibe, many patients are unable to achieve recommended target levels of LDL cholesterol."
      explanation: >-
        Places ezetimibe in the FH treatment sequence while making explicit
        that statin plus ezetimibe is often not sufficient - hence PARTIAL.
  notes: >-
    Curated as background therapy for FH generally. No PCSK9-genotyped
    ezetimibe trial is cited.
- name: Bempedoic Acid
  description: >-
    Oral ATP citrate lyase inhibitor that blocks cholesterol synthesis upstream
    of HMG-CoA reductase. Because it is a prodrug activated by a liver-specific
    enzyme absent from skeletal muscle, it is the guideline option for patients
    who cannot tolerate statins - a common situation in FH, where lifelong
    high-intensity statin therapy is the default. Like statins and ezetimibe it
    lowers the LDL burden the PCSK9 lesion creates rather than correcting the
    lesion itself.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bempedoic acid
      term:
        id: CHEBI:149601
        label: bempedoic acid
  target_mechanisms:
  - target: Chronic Elevation of Plasma LDL Cholesterol
    treatment_effect: MODULATES
    description: >-
      ATP citrate lyase inhibition reduces hepatic cholesterol synthesis and so
      lowers the circulating LDL burden downstream of the PCSK9 lesion, without
      acting on PCSK9 or on LDL receptor degradation.
    evidence:
    - reference: PMID:36876740
      reference_title: "Bempedoic Acid and Cardiovascular Outcomes in Statin-Intolerant Patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Bempedoic acid, an ATP citrate lyase inhibitor, reduces low-density lipoprotein (LDL) cholesterol levels and is associated with a low incidence of muscle-related adverse events"
      explanation: >-
        States the molecular target and the LDL-lowering effect that place this
        agent on the plasma-LDL node rather than on the PCSK9 node.
  evidence:
  - reference: PMID:36876740
    reference_title: "Bempedoic Acid and Cardiovascular Outcomes in Statin-Intolerant Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of a primary end-point event was significantly lower with bempedoic acid than with placebo (819 patients [11.7%] vs. 927 [13.3%]; hazard ratio, 0.87; 95% confidence interval [CI], 0.79 to 0.96; P = 0.004)"
    explanation: >-
      CLEAR Outcomes provides the cardiovascular outcome evidence that
      justifies curating bempedoic acid alongside ezetimibe and apheresis
      rather than as an investigational option.
  notes: >-
    Curated as background therapy for FH generally, on the same footing as
    ezetimibe. CLEAR Outcomes enrolled statin-intolerant patients at high
    cardiovascular risk, not a PCSK9-genotyped or FH-only cohort, so the
    outcome benefit is not ADH3-specific evidence.
- name: LDL Apheresis
  description: >-
    Extracorporeal removal of apoB-containing lipoproteins from plasma,
    reserved for carriers whose LDL-C remains dangerously high on maximal drug
    therapy. Two of the thirteen PCSK9 D374Y carriers in the long-term British
    follow-up required LDL apheresis (one also partial ileal bypass), which is
    the most direct evidence available that this severity of intervention is
    sometimes needed in ADH3 specifically.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: therapeutic apheresis
    term:
      id: NCIT:C173286
      label: Therapeutic Apheresis
  target_mechanisms:
  - target: Chronic Elevation of Plasma LDL Cholesterol
    treatment_effect: MODULATES
    description: >-
      Apheresis removes circulating LDL directly, bypassing the failed hepatic
      receptor route rather than repairing it.
    evidence:
    - reference: PMID:16224054
      reference_title: "Severe hypercholesterolemia in four British families with the D374Y mutation in the PCSK9 gene: long-term follow-up and treatment response."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "or current lipid-lowering therapy, including LDL apheresis and partial ileal bypass in 2 PCSK9 patients (7.0+/-1.6 versus 5.4+/-1.0 mmol/L; P=0.001)"
      explanation: >-
        Documents LDL apheresis being used in PCSK9 D374Y carriers as part of
        the therapy needed to control their cholesterol.
  evidence:
  - reference: PMID:16224054
    reference_title: "Severe hypercholesterolemia in four British families with the D374Y mutation in the PCSK9 gene: long-term follow-up and treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These British PCSK9 patients with the D374Y mutation have an unpredictably severe clinical phenotype, which may be a unique feature for this cohort, and requires early and aggressive lipid-lowering management to prevent cardiovascular complications."
    explanation: >-
      Supports escalation to aggressive lipid-lowering management in this
      genotype, of which apheresis is the most intensive form.
- name: Cardiovascular Risk Factor Modification
  description: >-
    Non-pharmacological management: smoking cessation, reduced saturated and
    trans fat intake, increased soluble fibre, physical activity, weight
    control, and treatment of hypertension and diabetes. These do not address
    the PCSK9 lesion but reduce the atherogenic burden it acts upon.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: lifestyle and risk-factor therapy
    term:
      id: NCIT:C15900
      label: Lifestyle Therapy
  target_mechanisms:
  - target: Subendothelial Retention of ApoB-Containing Lipoproteins
    treatment_effect: MODULATES
    description: >-
      Risk-factor modification acts on the endothelial-injury and inflammatory
      arm of atherogenesis rather than on the PCSK9-LDL receptor axis.
    evidence:
    - reference: PMID:24404629
      reference_title: "Familial Hypercholesterolemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Agents/circumstances to avoid: Smoking, high intake of saturated and trans unsaturated fat, sedentary lifestyle, obesity, hypertension, and diabetes mellitus."
      explanation: GeneReviews names the modifiable exposures that aggravate atherosclerotic risk in FH.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prevention of primary manifestations: Heart-healthy diet (including reduced intake of saturated fat and increased intake of soluble fiber to 10-20 g/day); increased physical activity; no smoking."
    explanation: GeneReviews management recommendation for primary prevention in FH.
experimental_models:
- name: Urine-derived iPSC hepatocyte-like cells from a PCSK9 S127R carrier (HLC-S127R)
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Human induced pluripotent stem cells reprogrammed from urine-derived
    somatic cells of an individual carrying the ADH3 allele PCSK9 S127R,
    differentiated into hepatocyte-like cells. The model reproduces the
    patient's own genotype in the disease-relevant cell type and reads out the
    functional consequence directly as LDL uptake.
  cell_source: Patient-derived (urine somatic cells reprogrammed to iPSC)
  culture_system: Two-dimensional hepatocyte-like cell differentiation
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: hepatocyte-like cell
    term:
      id: CL:0000182
      label: hepatocyte
  publication: PMID:26586530
  modeled_mechanisms:
  - target: Reduced Hepatic Clearance of Circulating LDL Particles
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Hepatocyte-like cells carrying the patient's S127R allele take up 71% less
      LDL than control cells, the cellular readout of this node.
    limitations: >-
      Hepatocyte-like cells derived from iPSC are immature relative to adult
      hepatocytes; the comparison is between individuals rather than between
      isogenic corrected and uncorrected lines, so donor background is not
      controlled.
    readouts:
    - name: LDL uptake by hepatocyte-like cells
      target: Reduced Hepatic Clearance of Circulating LDL Particles
      direction: DECREASED
      interpretation: >-
        Direct cellular measurement of the impaired LDL clearance this node
        asserts.
      evidence:
      - reference: PMID:26586530
        reference_title: "Urine-sample-derived human induced pluripotent stem cells as a model to study PCSK9-mediated autosomal dominant hypercholesterolemia."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "cells originally derived from an individual with ADH (HLC-S127R) secreted less PCSK9 in the media (-38.5%; P=0.038) and had a 71% decrease (P<0.001) of low-density lipoprotein (LDL) uptake"
        explanation: Reports the LDL-uptake measurement grounding this readout.
    evidence:
    - reference: PMID:26586530
      reference_title: "Urine-sample-derived human induced pluripotent stem cells as a model to study PCSK9-mediated autosomal dominant hypercholesterolemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We aimed to validate urine-sample-derived human induced pluripotent stem cells (UhiPSCs) as an appropriate tool to model PCSK9-mediated ADH and FHBL."
      explanation: >-
        States the model's purpose as a model of PCSK9-mediated autosomal
        dominant hypercholesterolemia.
  evidence:
  - reference: PMID:26586530
    reference_title: "Urine-sample-derived human induced pluripotent stem cells as a model to study PCSK9-mediated autosomal dominant hypercholesterolemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "urine samples provide an attractive and convenient source of somatic cells for reprogramming and hepatocyte differentiation, but also a powerful tool to further decipher PCSK9 mutations and function."
    explanation: The authors' conclusion on the model's utility for studying PCSK9 variant function.
  notes: >-
    The same study reports that pravastatin increased LDL uptake more in
    HLC-S127R than in control cells, matching the good statin response of the
    S127R carriers in the corresponding family - a rare instance of an in vitro
    model tracking a genotype-specific clinical treatment response.

    evidence:
    - reference: PMID:30269829
      reference_title: Whole-Gene Duplication of PCSK9 as a Novel Genetic Mechanism for Severe Familial Hypercholesterolemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Features in affected individuals included severely elevated LDL cholesterol levels that were refractory to intensive statin therapy, pronounced clinical stigmata, premature cardiovascular events, and a plasma PCSK9 of approximately 5000 ng/mL in 1 index case.
      explanation: Very high circulating PCSK9 was measured in one duplication index case; this is not a universal concentration in ADH3.
      directness: DIRECT
      quote_role: PRIMARY_RESULT

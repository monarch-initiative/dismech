notes: >-
  Scope decision: curated as a standalone entry rather than a subtype of
  kb/disorders/Familial_Hypercholesterolemia.yaml (MONDO:0005439). Three
  reasons. (1) The FH umbrella entry's subtype axis is *zygosity* (HeFH /
  HoFH), not gene, so ADH3 has no place on it without mixing two orthogonal
  axes. (2) MONDO models MONDO:0011369 as a distinct is_a child of
  MONDO:0005439 defined by its causal gene (RO:0004003 HGNC:20001). (3) The
  mechanism is genuinely distinct: LDLR and APOB forms damage the receptor or
  its ligand, whereas ADH3 leaves both intact and instead accelerates
  regulated destruction of the receptor - which is precisely the mechanism
  PCSK9-inhibitor therapy addresses.

  Named Entity Confusion preflight (dismech NEC SOP): the hypercholesterolemia
  series (FH1/LDLR, familial defective apoB-100/APOB, ADH3/PCSK9) is a
  high-NEC-risk numbered-and-lettered class. Identity anchors were confirmed
  against MONDO before curation - causal gene PCSK9 (HGNC:20001) via
  RO:0004003, OMIM:603776, synonym HCHOLA3. Every mechanistic and genetic
  claim in this entry is anchored on a PCSK9 publication; no LDLR- or
  APOB-specific content has been imported.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous PCSK9 gain-of-function variants segregate as an autosomal
    dominant trait, as first shown by linkage of the HCHOLA3 locus at 1p32 in
    French ADH pedigrees.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "APOB-, LDLR-, and PCSK9-related FH are inherited in an autosomal dominant manner."
    explanation: GeneReviews states the mode of inheritance for PCSK9-related FH explicitly.
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of an individual with a heterozygous pathogenic variant in APOB, LDLR, or PCSK9 has a 50% chance of inheriting the pathogenic variant and having FH."
    explanation: >-
      GeneReviews states the 50% transmission risk for a heterozygous PCSK9
      variant, the recurrence figure used in genetic counselling.
  - reference: PMID:12730697
    reference_title: "Mutations in PCSK9 cause autosomal dominant hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We mapped a third locus associated with ADH, HCHOLA3 at 1p32, and now report two mutations in the gene PCSK9 (encoding proprotein convertase subtilisin/kexin type 9) that cause ADH."
    explanation: >-
      The founding report identifies PCSK9 as the third autosomal dominant
      hypercholesterolemia locus, establishing the disease entity curated here.
prevalence:
- population: Molecularly characterised familial hypercholesterolemia cohorts
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    No population prevalence estimate specific to PCSK9-related FH is recorded
    here. PCSK9 gain-of-function is consistently described as the rarest of the
    three dominant FH genes, but the reported share of solved FH varies widely
    with cohort ascertainment and sequencing strategy, and a single defensible
    number could not be sourced from a quotable abstract. Deliberately left as
    UNKNOWN rather than estimated - see the curation SOP on frequency
    qualifiers needing their own evidence.
progression:
- phase: Presymptomatic (birth to childhood)
  notes: >-
    The LDL-cholesterol elevation is present from birth because the variant is
    constitutional, but carriers are typically asymptomatic in childhood.
    GeneReviews therefore recommends lipid monitoring from age two years and
    permits statin therapy from around age eight.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surveillance: Monitor lipid levels from age two years; consider noninvasive imaging modalities in adults; identify modifiable risk factors (e.g., smoking, sedentary behavior, hypertension, diabetes, obesity)."
    explanation: >-
      Establishes early-childhood lipid surveillance, which implies the
      biochemical phenotype precedes any clinical manifestation.
- phase: Cholesterol deposition and clinical presentation (young adulthood)
  notes: >-
    In the long-term British D374Y series, carriers presented about a decade
    earlier than severe LDLR-mutation heterozygotes, at a mean age of about 21
    years, with markedly higher pretreatment cholesterol.
  evidence:
  - reference: PMID:16224054
    reference_title: "Severe hypercholesterolemia in four British families with the D374Y mutation in the PCSK9 gene: long-term follow-up and treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The PCSK9 patients, when compared with the LDLR patients, were younger at presentation (20.8+/-14.7 versus 30.2+/-15.7 years; P=0.003)"
    explanation: Quantifies the age at presentation in a PCSK9 gain-of-function cohort.
- phase: Premature atherosclerotic cardiovascular disease (adulthood)
  notes: >-
    Clinically manifest coronary artery disease occurred more than ten years
    earlier in the PCSK9 D374Y carriers than in severe LDLR-mutation
    heterozygotes.
  evidence:
  - reference: PMID:16224054
    reference_title: "Severe hypercholesterolemia in four British families with the D374Y mutation in the PCSK9 gene: long-term follow-up and treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "and were affected >10 years earlier by premature coronary artery disease (35.2+/-4.8 versus 46.8+/-8.9 years; P=0.002)"
    explanation: Quantifies the age at onset of premature coronary disease in this genotype.
pathophysiology:
- name: PCSK9 Gain-of-Function Variant
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: PCSK9
    term:
      id: hgnc:20001
      label: PCSK9
  description: >-
    A heterozygous germline missense variant in PCSK9 that increases the
    protein's LDL-receptor-degrading activity. The classical alleles are S127R
    and F216L (the two variants of the founding French pedigrees) and D374Y
    (the severe British/Norwegian allele). The variants do not act through a
    common biochemical route: S127R and D374Y differ sharply in autocatalytic
    zymogen processing while F216L processes normally, and processing itself
    does not separate gain- from loss-of-function alleles. What they share is
    the functional output measured in cells - an excess of receptor-degrading
    PCSK9 activity.
  genetic_context:
    gene:
      preferred_term: PCSK9
      term:
        id: hgnc:20001
        label: PCSK9
    allele_type: missense
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      The variant consequence is a gain of function: the mutant protein
      degrades more LDL receptor than wild-type PCSK9 does. This is recorded on
      the genetic context (the variant), not as a Descriptor modifier, because
      the claim is about the consequence of a specific allele.
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:12730697
    reference_title: "Mutations in PCSK9 cause autosomal dominant hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PCSK9 encodes NARC-1 (neural apoptosis regulated convertase), a newly identified human subtilase that is highly expressed in the liver and contributes to cholesterol homeostasis."
    explanation: >-
      Identifies the disease gene product as a liver-expressed subtilase acting
      in cholesterol homeostasis, the substrate of this trigger node.
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The molecular diagnosis of FH can be established by identification of heterozygous or biallelic pathogenic variants in APOB (variants that impair binding of LDL-C to the LDL receptor), LDLR, or PCSK9 (gain of function); or rarely, identification of biallelic pathogenic variants in LDLRAP1."
    explanation: >-
      GeneReviews specifies that it is the gain-of-function direction of PCSK9
      variation that causes FH, supporting the functional_impact_category here.
  downstream:
  - target: Hepatic PCSK9 Synthesis and Secretion
    causal_link_type: DIRECT
    description: >-
      The variant allele is transcribed and translated in the hepatocyte and
      the mutant protein is secreted into plasma, where it acts on the LDL
      receptor. This step is separated out because it is the point at which
      siRNA therapy acts.
    hypothesis_groups:
    - ldlr_degradation_model
    evidence:
    - reference: PMID:17080197
      reference_title: "Secreted PCSK9 decreases the number of LDL receptors in hepatocytes and in livers of parabiotic mice."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that purified PCSK9 added to the medium of HepG2 cells reduces the number of cell-surface LDLRs in a dose- and time-dependent manner. This activity was approximately 10-fold greater for a gain-of-function mutant, PCSK9(D374Y), that causes hypercholesterolemia."
      explanation: >-
        Directly quantifies the gain-of-function allele's excess
        receptor-degrading activity relative to wild-type PCSK9.
  - target: Increased Hepatic Secretion of ApoB-Containing Lipoproteins
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - hepatocyte expression of the mutant PCSK9 protein
    description: >-
      An alternative, non-mutually-exclusive route by which the same variants
      may raise circulating LDL - increased secretion of nascent
      apoB100-containing lipoprotein from the hepatocyte.
    hypothesis_groups:
    - apob_secretion_model
    evidence:
    - reference: PMID:15772090
      reference_title: "Evidence for effect of mutant PCSK9 on apolipoprotein B secretion as the cause of unusually severe dominant hypercholesterolaemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Expression of the proposed pathogenic variants, but not of WT, S386A or F216L PCSK9, increases secretion of apolipoprotein B100-containing lipoproteins from the cells by 2-4-fold probably by reducing the degradation of nascent protein"
      explanation: >-
        Reports the variant-dependent increase in apoB100 lipoprotein secretion
        that defines this alternative causal edge.
- name: Hepatic PCSK9 Synthesis and Secretion
  biological_scale: CELLULAR
  description: >-
    PCSK9 is synthesised in the hepatocyte and secreted into the circulation,
    where it acts on LDL receptors on the same and other cells. Secreted PCSK9
    is sufficient on its own to deplete hepatic LDL receptors, as parabiosis
    between PCSK9-transgenic and wild-type mice shows. This node is the shared
    upstream of both the canonical receptor-degradation route and the
    alternative apoB-secretion route, and it is where hepatic PCSK9 knockdown
    acts.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:17080197
    reference_title: "Secreted PCSK9 decreases the number of LDL receptors in hepatocytes and in livers of parabiotic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "After parabiosis, secreted PCSK9 was transferred to the circulation of wild-type mice and reduced the number of hepatic LDLRs to nearly undetectable levels."
    explanation: >-
      Shows that PCSK9 secreted by the liver acts through the circulation to
      deplete hepatic LDL receptors, establishing secretion as a distinct and
      necessary step.
  - reference: PMID:12730697
    reference_title: "Mutations in PCSK9 cause autosomal dominant hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PCSK9 encodes NARC-1 (neural apoptosis regulated convertase), a newly identified human subtilase that is highly expressed in the liver and contributes to cholesterol homeostasis."
    explanation: Establishes the liver as the site of PCSK9 expression.
  downstream:
  - target: PCSK9 Binding to the LDL Receptor EGF-A Domain
    causal_link_type: DIRECT
    description: >-
      Circulating PCSK9 engages the LDL receptor at the hepatocyte surface;
      with a gain-of-function allele that engagement destroys more receptor.
    hypothesis_groups:
    - ldlr_degradation_model
    evidence:
    - reference: PMID:17080197
      reference_title: "Secreted PCSK9 decreases the number of LDL receptors in hepatocytes and in livers of parabiotic mice."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that purified PCSK9 added to the medium of HepG2 cells reduces the number of cell-surface LDLRs in a dose- and time-dependent manner. This activity was approximately 10-fold greater for a gain-of-function mutant, PCSK9(D374Y), that causes hypercholesterolemia."
      explanation: >-
        Quantifies the excess receptor-degrading activity of the D374Y
        gain-of-function allele acting from outside the cell.
- name: PCSK9 Binding to the LDL Receptor EGF-A Domain
  biological_scale: MOLECULAR
  description: >-
    Secreted PCSK9 binds the first epidermal growth factor-like repeat (EGF-A)
    of the LDL receptor's EGF homology domain at the hepatocyte surface. The
    interaction is calcium-dependent and its affinity rises steeply as pH falls
    from 7 to 5.2, so the complex tightens rather than dissociates as the
    receptor traverses the endosome. The evidence curated on this node is from
    wild-type recombinant PCSK9 and establishes where and how PCSK9 engages the
    receptor; the variant-specific excess is curated one node downstream, where
    it was measured as receptor loss rather than as binding affinity.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:17452316
    reference_title: "Binding of proprotein convertase subtilisin/kexin type 9 to epidermal growth factor-like repeat A of low density lipoprotein receptor decreases receptor recycling and increases degradation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Recombinant human PCSK9 interacted in a sequence-specific manner with the first epidermal growth factor-like repeat (EGF-A) in the EGF homology domain of the human LDLR."
    explanation: Localises the PCSK9 binding site on the LDL receptor to the EGF-A repeat.
  - reference: PMID:17452316
    reference_title: "Binding of proprotein convertase subtilisin/kexin type 9 to epidermal growth factor-like repeat A of low density lipoprotein receptor decreases receptor recycling and increases degradation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Binding to EGF-A was calcium-dependent and increased dramatically with reduction in pH from 7 to 5.2."
    explanation: >-
      Establishes the pH dependence that makes the complex persist through
      endocytosis rather than dissociating in the endosome.
  downstream:
  - target: Lysosomal Rerouting and Degradation of the Hepatocyte LDL Receptor
    causal_link_type: DIRECT
    description: >-
      Bound PCSK9 blocks the acid-dependent conformational change that would
      normally release the ligand and return the receptor to the surface.
    hypothesis_groups:
    - ldlr_degradation_model
    evidence:
    - reference: PMID:17452316
      reference_title: "Binding of proprotein convertase subtilisin/kexin type 9 to epidermal growth factor-like repeat A of low density lipoprotein receptor decreases receptor recycling and increases degradation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These data are consistent with a model in which PCSK9 binding to EGF-A interferes with an acid-dependent conformational change required for receptor recycling."
      explanation: States the mechanistic link between EGF-A binding and failure of receptor recycling.
- name: Lysosomal Rerouting and Degradation of the Hepatocyte LDL Receptor
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    The rate-limiting step of ADH3. Instead of recycling to the plasma
    membrane, the PCSK9-bound LDL receptor is diverted from the endosome to the
    lysosome and degraded. The hepatocyte surface receptor pool therefore falls
    even though the LDLR gene and protein are structurally normal. This is the
    node that distinguishes ADH3 from LDLR- and APOB-related FH, and it is the
    node that PCSK9-directed drugs act upstream of.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: LDL receptor recycling to the plasma membrane
    term:
      id: GO:0001881
      label: receptor recycling
    modifier: DECREASED
  - preferred_term: LDL receptor degradation
    term:
      id: GO:0032802
      label: low-density lipoprotein particle receptor catabolic process
    modifier: INCREASED
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:17452316
    reference_title: "Binding of proprotein convertase subtilisin/kexin type 9 to epidermal growth factor-like repeat A of low density lipoprotein receptor decreases receptor recycling and increases degradation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The addition of PCSK9, but not heat-inactivated PCSK9, to the medium of cultured hepatocytes resulted in redistribution of the receptor from the plasma membrane to lysosomes."
    explanation: Demonstrates the plasma-membrane-to-lysosome rerouting that defines this node.
  - reference: PMID:16571601
    reference_title: "Effect of mutations in the PCSK9 gene on the cell surface LDL receptors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The two gain-of-function mutations had a 23% decreased level of cell surface LDLR and a 38% decreased level of internalization of LDL as compared with WT-PCSK9."
    explanation: >-
      Quantifies the fall in hepatocyte surface LDL receptor caused specifically
      by the S127R and D374Y gain-of-function alleles.
  - reference: PMID:15358785
    reference_title: "NARC-1/PCSK9 and its natural mutants: zymogen cleavage and effects on the low density lipoprotein (LDL) receptor and LDL cholesterol."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The cell surface LDL receptor (LDLR) levels are reduced by 35% in lymphoblasts of S127R patients."
    explanation: >-
      Shows the surface-receptor deficit in cells taken from S127R patients,
      not only in transfection models. The measurement is in lymphoblasts
      rather than hepatocytes, so it evidences the receptor-loss mechanism
      rather than the hepatic cell-type binding of this node.
  downstream:
  - target: Reduced Hepatic Clearance of Circulating LDL Particles
    causal_link_type: DIRECT
    description: >-
      Fewer hepatocyte surface receptors directly reduce receptor-mediated
      uptake of LDL from plasma.
    hypothesis_groups:
    - ldlr_degradation_model
    evidence:
    - reference: PMID:16571601
      reference_title: "Effect of mutations in the PCSK9 gene on the cell surface LDL receptors."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The two gain-of-function mutations had a 23% decreased level of cell surface LDLR and a 38% decreased level of internalization of LDL as compared with WT-PCSK9."
      explanation: Couples the surface-receptor deficit to a measured fall in LDL internalisation.
- name: Reduced Hepatic Clearance of Circulating LDL Particles
  biological_scale: TISSUE
  description: >-
    The liver is the principal route by which LDL leaves the circulation. With
    the hepatocyte receptor pool depleted, receptor-mediated uptake of LDL falls
    and the plasma residence time of LDL particles lengthens.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: receptor-mediated endocytosis of LDL
    term:
      id: GO:0006898
      label: receptor-mediated endocytosis
    modifier: DECREASED
  - preferred_term: low-density lipoprotein particle clearance
    term:
      id: GO:0034383
      label: low-density lipoprotein particle clearance
    modifier: DECREASED
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:17452316
    reference_title: "Binding of proprotein convertase subtilisin/kexin type 9 to epidermal growth factor-like repeat A of low density lipoprotein receptor decreases receptor recycling and increases degradation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Proprotein convertase subtilisin/kexin type 9 (PCSK9) promotes degradation of hepatic low density lipoprotein receptors (LDLR), the major route of clearance of circulating cholesterol."
    explanation: >-
      States that the hepatic LDL receptor is the major clearance route for
      circulating cholesterol, which is what this node reports as impaired.
  - reference: PMID:17080197
    reference_title: "Secreted PCSK9 decreases the number of LDL receptors in hepatocytes and in livers of parabiotic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Transgenic mice overexpressing human PCSK9 in liver secreted large amounts of the protein into plasma, which increased plasma LDL cholesterol concentrations to levels similar to those of LDLR-knockout mice."
    explanation: >-
      In vivo demonstration that excess secreted PCSK9 phenocopies loss of the
      LDL receptor at the level of plasma LDL cholesterol.
  downstream:
  - target: Chronic Elevation of Plasma LDL Cholesterol
    causal_link_type: DIRECT
    description: Impaired hepatic removal raises the steady-state plasma LDL concentration.
    hypothesis_groups:
    - ldlr_degradation_model
    evidence:
    - reference: PMID:19191301
      reference_title: "Mutations and polymorphisms in the proprotein convertase subtilisin kexin 9 (PCSK9) gene in cholesterol metabolism and disease."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Several PCSK9 variants have been identified, some of them are gain-of-function mutations causing hypercholesterolemia by a reduction of low-density lipoprotein (LDL) receptor levels; while others are loss-of-function variants associated with a reduction of LDL-cholesterol (LDL-C) levels and a decreased risk of CHD."
      explanation: >-
        States the causal route from reduced LDL receptor levels to
        hypercholesterolemia for the gain-of-function alleles.
- name: Increased Hepatic Secretion of ApoB-Containing Lipoproteins
  biological_scale: CELLULAR
  description: >-
    A curated alternative contribution, not the canonical route. In rat
    hepatoma cells stably expressing the FH-associated PCSK9 variants, secretion
    of apoB100-containing lipoprotein rose 2-4 fold while LDL receptor content
    fell only slightly - the opposite emphasis to the hepatocyte
    receptor-degradation studies. Whether this contributes materially to the
    human phenotype, and in which cell context, is unresolved; the node is
    curated so the competing model is visible rather than lost in prose.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:15772090
    reference_title: "Evidence for effect of mutant PCSK9 on apolipoprotein B secretion as the cause of unusually severe dominant hypercholesterolaemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This suggests that the variants of PCSK9 found in FH influence the secretion of apoB-containing lipoproteins, providing an explanation for the marked increase in circulating LDL in heterozygous carriers."
    explanation: >-
      The authors' own statement of the alternative mechanism this node
      represents.
  downstream:
  - target: Chronic Elevation of Plasma LDL Cholesterol
    causal_link_type: DIRECT
    description: >-
      Increased output of apoB100 lipoprotein from the liver would raise
      circulating LDL independently of receptor number.
    hypothesis_groups:
    - apob_secretion_model
    evidence:
    - reference: PMID:15772090
      reference_title: "Evidence for effect of mutant PCSK9 on apolipoprotein B secretion as the cause of unusually severe dominant hypercholesterolaemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This suggests that the variants of PCSK9 found in FH influence the secretion of apoB-containing lipoproteins, providing an explanation for the marked increase in circulating LDL in heterozygous carriers."
      explanation: Attributes the rise in circulating LDL to the secretion effect.
- name: Chronic Elevation of Plasma LDL Cholesterol
  biological_scale: ORGANISM
  description: >-
    Lifelong elevation of plasma LDL cholesterol from birth. In the best
    characterised PCSK9 cohort - 13 D374Y carriers from four unrelated British
    families - pretreatment total cholesterol averaged 13.6 mmol/L, materially
    higher than in severe LDLR-mutation heterozygotes, and remained higher on
    statin therapy.
  biological_processes:
  - preferred_term: cholesterol homeostasis
    term:
      id: GO:0042632
      label: cholesterol homeostasis
    modifier: DYSREGULATED
  evidence:

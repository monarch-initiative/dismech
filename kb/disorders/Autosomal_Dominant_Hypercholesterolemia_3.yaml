  notes: >-
    PCSK9 gain-of-function sequence variants and rare whole-gene duplication cause
    autosomal dominant
    hypercholesterolemia. Allele-specific binding, processing, secretion and receptor-depleting
    effects
    must be distinguished. The tenfold potency comparison is a D374Y culture result,
    not a universal clinical
    effect size. Biochemical penetrance and clinical event risk differ. GeneReviews
    summarizes approximately
    90% penetrance for S127R and high penetrance for D374Y; estimates for many other
    alleles are unknown.
    Incomplete segregation and intrafamilial variability were reported for other variants.
    PCSK9 loss-of-function
    variants are a separate low-LDL phenotype, not ADH3.
  evidence:
  - reference: PMID:12730697
    reference_title: "Mutations in PCSK9 cause autosomal dominant hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We mapped a third locus associated with ADH, HCHOLA3 at 1p32, and now report two mutations in the gene PCSK9 (encoding proprotein convertase subtilisin/kexin type 9) that cause ADH."
    explanation: Establishes PCSK9 as the causal gene at the HCHOLA3 locus.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:16211558
    reference_title: "Novel mutations of the PCSK9 gene cause variable phenotype of autosomal dominant hypercholesterolemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Segregation with hypercholesterolemia is incomplete in one pedigree. Type and severity of hyperlipidemia and of cardiovascular disease could vary among subjects from the same family."
    explanation: >-
      Documents incomplete segregation and within-family variability in
      severity for PCSK9 alleles, the observation behind the expressivity
      statement in this entry's notes.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:15358785
    reference_title: "NARC-1/PCSK9 and its natural mutants: zymogen cleavage and effects on the low density lipoprotein (LDL) receptor and LDL cholesterol."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The S127R and D374Y mutations result in approximately 50-60% and > or =98% decrease in zymogen processing, respectively."
    explanation: >-
      Supports the allele-level heterogeneity noted above: S127R and D374Y
      differ markedly from each other in their effect on zymogen processing.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:16554528
    reference_title: "Sequence variations in PCSK9, low LDL, and protection against coronary heart disease."
    supports: SUPPORT

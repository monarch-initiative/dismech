    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest that all individuals with familial hypercholesterolaemia should have their lipoprotein(a) measured in order to identify those with the highest concentrations, and as a result, the highest risk of myocardial infarction."
    explanation: >-
      Establishes measurement of lipoprotein(a) as part of the FH workup and

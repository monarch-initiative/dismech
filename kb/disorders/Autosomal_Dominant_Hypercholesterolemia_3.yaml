animal_models:
- name: AAV-hPCSK9(D374Y) mouse
  species: Mouse
  genotype: Liver-directed AAV transfer of human PCSK9 p.Asp374Tyr into wild-type mice
  background: C57BL/6J, 129/SvPasCrlf, or FVB/NCrl
  publication: PMID:25341796
  description: >-
    A single systemic AAV injection delivers the human D374Y gain-of-function
    allele to mouse liver, producing sustained hyperlipidaemia and, on a
    high-fat diet, aortic atherosclerotic lesions with macrophage infiltration
    and fibrous cap formation. Because the disease allele is the human one and
    is expressed in the correct organ, this model reproduces the ADH3 mechanism
    rather than merely a hypercholesterolaemic state.
  genes:
  - preferred_term: PCSK9
    term:
      id: hgnc:20001
      label: PCSK9
  evidence:
  - reference: PMID:25341796
    reference_title: "Induction of sustained hypercholesterolemia by single adeno-associated virus-mediated gene transfer of mutant hPCSK9."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Single intravenous AAV-PCSK9(DY) injection is a fast, easy, and cost-effective approach, resulting in rapid and long-term sustained hyperlipidemia and atherosclerosis."
    explanation: >-
      The authors' summary of what the model produces, supporting its use as a
      model of PCSK9 gain-of-function hypercholesterolemia and atherosclerosis.
  modeled_mechanisms:
  - target: Chronic Elevation of Plasma LDL Cholesterol
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Liver expression of human PCSK9 D374Y produces long-term elevation of
      serum LDL in three mouse backgrounds.
    limitations: >-
      Expression is achieved by somatic AAV transfer in adult animals rather
      than by a germline heterozygous allele from conception, so the lifelong
      "cholesterol-years" exposure central to the human disease is not
      reproduced; a high-fat diet is required for lesion development.
    readouts:
    - name: Serum low-density lipoprotein
      target: Chronic Elevation of Plasma LDL Cholesterol
      direction: INCREASED
      interpretation: Direct biochemical correlate of the human LDL-C elevation node.
      evidence:
      - reference: PMID:25341796
        reference_title: "Induction of sustained hypercholesterolemia by single adeno-associated virus-mediated gene transfer of mutant hPCSK9."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "mice in the C57BL/6J, 129/SvPasCrlf, or FVB/NCrl backgrounds developed long-term hyperlipidemia with a strong increase in serum low-density lipoprotein."
        explanation: Reports the LDL measurement grounding this readout.
    evidence:
    - reference: PMID:25341796
      reference_title: "Induction of sustained hypercholesterolemia by single adeno-associated virus-mediated gene transfer of mutant hPCSK9."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We aimed to stably express the pathological human D374Y gain-of-function mutant form of PCSK9 (PCSK9(DY)) in adult wild-type mice to generate a hyperlipidemic and proatherogenic animal model, achieved with a single systemic injection with adeno-associated virus (AAV)."
      explanation: >-
        States that the model expresses the human ADH3 disease allele to
        reproduce the hyperlipidaemic, proatherogenic state.
  - target: Smooth Muscle Cell Switching and Fibrofatty Plaque Formation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      High-fat-fed AAV-PCSK9(D374Y) mice develop aortic atherosclerotic lesions
      that progress to macrophage-infiltrated, fibrous-capped plaques.
    limitations: >-
      Mouse atherosclerosis reproduces lesion initiation and fibrous-cap
      formation but not the late human complications of plaque rupture and
      thrombosis; lesions are aortic rather than coronary, and a high-fat diet
      is required.
    readouts:
    - name: Aortic atherosclerotic lesion burden and fibrous cap formation
      target: Smooth Muscle Cell Switching and Fibrofatty Plaque Formation
      direction: INCREASED
      interpretation: Histological correlate of the fibrofatty plaque node.
      evidence:
      - reference: PMID:25341796
        reference_title: "Induction of sustained hypercholesterolemia by single adeno-associated virus-mediated gene transfer of mutant hPCSK9."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Advanced lesions in these high-fat-diet-fed mice also showed evidence of macrophage infiltration and fibrous cap formation."
        explanation: Reports the histological lesion features grounding this readout.
    evidence:
    - reference: PMID:25341796
      reference_title: "Induction of sustained hypercholesterolemia by single adeno-associated virus-mediated gene transfer of mutant hPCSK9."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Macroscopic and histological analysis showed atherosclerotic lesions in the aortas of AAV-PCSK9(DY) mice fed a high-fat-diet."
      explanation: Establishes that the model develops atherosclerotic lesions attributable to the PCSK9 D374Y allele.
- name: D374Y-PCSK9 transgenic Yucatan minipig
  species: Pig
  genotype: Liver-specific expression of human PCSK9 p.Asp374Tyr (Sleeping Beauty transposition, somatic cell nuclear transfer)
  background: Yucatan minipig
  publication: PMID:23283366
  description: >-
    Cloned Yucatan minipigs expressing human D374Y-PCSK9 in liver show reduced
    hepatic LDL receptor levels, impaired LDL clearance, severe
    hypercholesterolaemia, and spontaneous progressive atherosclerosis at a
    body size that permits intravascular imaging. The model covers the ADH3
    chain from hepatic receptor loss through to arterial lesion formation; the
    late human events of plaque rupture and atherothrombosis are not
    demonstrated in it.
  genes:
  - preferred_term: PCSK9
    term:
      id: hgnc:20001
      label: PCSK9
  evidence:
  - reference: PMID:23283366
    reference_title: "Familial hypercholesterolemia and atherosclerosis in cloned minipigs created by DNA transposition of a human PCSK9 gain-of-function mutant."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This model should prove useful for several types of translational research in atherosclerosis."
    explanation: >-
      The authors' own framing of the model's translational scope, supporting
      its inclusion as an informative model of this disease.
  modeled_mechanisms:
  - target: Reduced Hepatic Clearance of Circulating LDL Particles
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Transgenic pigs show the receptor-depletion-to-clearance-failure step
      directly, with both hepatic LDL receptor level and LDL clearance measured
      in the same animals.
    limitations: >-
      The human allele is expressed from a transgene under a liver-specific
      promoter rather than from the endogenous porcine locus, so expression
      level and regulation need not match a human heterozygote.
    readouts:
    - name: Hepatic LDL receptor level
      target: Reduced Hepatic Clearance of Circulating LDL Particles
      direction: DECREASED
      interpretation: Confirms that the transgene depletes the hepatic receptor pool in vivo.
      evidence:
      - reference: PMID:23283366
        reference_title: "Familial hypercholesterolemia and atherosclerosis in cloned minipigs created by DNA transposition of a human PCSK9 gain-of-function mutant."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "D374Y-PCSK9 transgenic pigs displayed reduced hepatic low-density lipoprotein (LDL) receptor levels, impaired LDL clearance, severe hypercholesterolemia, and spontaneous development of progressive atherosclerotic lesions that could be visualized by noninvasive imaging."
        explanation: Reports the receptor-level and clearance measurements grounding this readout.
    evidence:
    - reference: PMID:23283366
      reference_title: "Familial hypercholesterolemia and atherosclerosis in cloned minipigs created by DNA transposition of a human PCSK9 gain-of-function mutant."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Using Sleeping Beauty DNA transposition and cloning by somatic cell nuclear transfer, we created Yucatan minipigs with liver-specific expression of human D374Y-PCSK9."
      explanation: Describes the construction of the model on the human ADH3 allele.
  - target: Smooth Muscle Cell Switching and Fibrofatty Plaque Formation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The pigs develop spontaneous, progressive atherosclerotic lesions without
      the extreme dietary manipulation mouse models require, at a scale and
      pathology closer to human disease.
    limitations: >-
      Even in this model the late human events of plaque rupture and
      atherothrombosis are not established; lesion progression, not acute
      coronary syndrome, is what is demonstrated.
    readouts:
    - name: Progressive atherosclerotic lesion development on noninvasive imaging
      target: Smooth Muscle Cell Switching and Fibrofatty Plaque Formation
      direction: INCREASED
      interpretation: Imaging correlate of arterial plaque formation driven by the PCSK9 gain-of-function allele.
      evidence:
      - reference: PMID:23283366
        reference_title: "Familial hypercholesterolemia and atherosclerosis in cloned minipigs created by DNA transposition of a human PCSK9 gain-of-function mutant."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "spontaneous development of progressive atherosclerotic lesions that could be visualized by noninvasive imaging."
        explanation: Reports the imaging readout of lesion progression.
    evidence:
    - reference: PMID:23283366

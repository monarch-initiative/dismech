mechanistic_hypotheses:
- hypothesis_group_id: ldlr_degradation_model
  hypothesis_label: PCSK9-accelerated LDL receptor degradation
  status: CANONICAL
  description: >-
    The accepted model: gain-of-function PCSK9 binds the hepatocyte LDL
    receptor's EGF-A domain, reroutes it to the lysosome, depletes the surface
    receptor pool, and so reduces hepatic LDL clearance. This model is what
    PCSK9-directed therapeutics were designed against and what their LDL-C
    lowering confirms in vivo.
  evidence:
  - reference: PMID:17452316
    reference_title: "Binding of proprotein convertase subtilisin/kexin type 9 to epidermal growth factor-like repeat A of low density lipoprotein receptor decreases receptor recycling and increases degradation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "As a consequence, the LDLR is rerouted from the endosome to the lysosome where it is degraded."
    explanation: The core mechanistic claim of the canonical model.
- hypothesis_group_id: apob_secretion_model
  hypothesis_label: Increased hepatic apoB-lipoprotein secretion
  status: ALTERNATIVE
  description: >-
    A competing/superimposed model in which FH-associated PCSK9 variants raise
    circulating LDL chiefly by increasing secretion of nascent
    apoB100-containing lipoprotein from the hepatocyte, rather than by
    depleting the LDL receptor. In the study that proposed it, receptor content
    was only slightly reduced by D374Y and S127R while apoB secretion rose 2-4
    fold. The two models are not mutually exclusive, and the alternative has
    not displaced the receptor-degradation model as the therapeutic rationale.
  evidence:
  - reference: PMID:15772090
    reference_title: "Evidence for effect of mutant PCSK9 on apolipoprotein B secretion as the cause of unusually severe dominant hypercholesterolaemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "no differences in LDL-receptor content were observed in cells expressing WT, S386A or F216L PCSK9 and only a small reduction in cells expressing the D374Y or S127R mutants."
    explanation: >-
      The observation that motivates the alternative model - a small receptor
      effect alongside a large secretion effect in this system.
discussions:
- discussion_id: adh3_receptor_degradation_vs_apob_secretion
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    In human PCSK9 gain-of-function carriers, how much of the LDL-cholesterol
    elevation is attributable to accelerated LDL receptor degradation versus
    increased hepatic secretion of apoB100-containing lipoprotein?
  attaches_to:
  - "pathophysiology#Increased Hepatic Secretion of ApoB-Containing Lipoproteins"
  - "pathophysiology#Chronic Elevation of Plasma LDL Cholesterol"
  rationale: >-
    Two in vitro systems give opposite emphases for the same PCSK9 variants.
    Hepatocyte and HepG2 studies show a large fall in cell-surface LDL receptor
    with D374Y and S127R; McArdle-7777 rat hepatoma cells expressing the same
    variants show only a small receptor reduction but a 2-4 fold rise in
    apoB100-lipoprotein secretion. No human in vivo measurement apportions the
    LDL-C elevation between the two routes. This matters therapeutically: a
    secretion-dominant contribution would not be neutralised by extracellular
    PCSK9 blockade, whereas hepatic PCSK9 knockdown would address both.
  evidence:
  - reference: PMID:15772090
    reference_title: "Evidence for effect of mutant PCSK9 on apolipoprotein B secretion as the cause of unusually severe dominant hypercholesterolaemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "no differences in LDL-receptor content were observed in cells expressing WT, S386A or F216L PCSK9 and only a small reduction in cells expressing the D374Y or S127R mutants."
    explanation: >-
      Documents the discrepant receptor result that motivates this gap.
  proposed_experiments:
  - experiment_id: adh3_ldl_apob_kinetics
    name: Stable-isotope LDL apoB kinetics in PCSK9 gain-of-function carriers
    description: >-
      Measure LDL apoB100 production rate and fractional catabolic rate by
      stable-isotope turnover in genotyped PCSK9 gain-of-function heterozygotes
      versus LDLR-mutation heterozygotes and normolipidemic controls, to
      partition the LDL-C elevation between overproduction and impaired
      clearance.
  - experiment_id: adh3_mab_vs_sirna_response
    name: Head-to-head response to extracellular versus intracellular PCSK9 blockade
    description: >-
      Compare LDL-C and apoB kinetic response to a PCSK9 monoclonal antibody
      (extracellular neutralisation) versus inclisiran (hepatic synthesis
      knockdown) within the same PCSK9 gain-of-function carriers; a
      secretion-dominant mechanism predicts a differential response.

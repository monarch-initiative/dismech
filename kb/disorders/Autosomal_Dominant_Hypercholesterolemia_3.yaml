      evidence_source: HUMAN_CLINICAL
      snippet: "Agents/circumstances to avoid: Smoking, high intake of saturated and trans unsaturated fat, sedentary lifestyle, obesity, hypertension, and diabetes mellitus."
      explanation: GeneReviews lists sedentary lifestyle among the exposures to avoid in FH.
  evidence:
  - reference: PMID:35294538
    reference_title: "Association of the Interaction Between Familial Hypercholesterolemia Variants and Adherence to a Healthy Lifestyle With Risk of Coronary Artery Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among carriers, a favorable lifestyle conferred 86% lower risk of CAD compared with an unfavorable lifestyle (hazard ratio, 0.14 [95% CI, 0.04-0.41])."
    explanation: >-
      In UK Biobank carriers of a monogenic FH variant, a four-component

    explanation: >-
      Places lipoprotein(a) among the prognostic variables of a validated FH
      risk score.
genetic:
- name: PCSK9
  gene_term:
    preferred_term: PCSK9
    term:
      id: hgnc:20001
      label: PCSK9
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    PCSK9 (proprotein convertase subtilisin/kexin type 9, 1p32) is the causal
    gene of ADH3. Heterozygous gain-of-function missense alleles increase
    PCSK9-mediated degradation of the hepatocyte LDL receptor. Reported
    disease-causing alleles include S127R and F216L (the founding French
    pedigrees) and D374Y (the severe British allele). Allele-level biochemistry
    is heterogeneous: S127R and D374Y differ sharply in autocatalytic zymogen
    processing and F216L processes normally, while D374Y is roughly tenfold
    more potent than wild-type PCSK9 at depleting cell-surface receptor.
    Zymogen processing does not itself discriminate gain- from loss-of-function
    alleles, so allele mechanism should not be generalised from one variant to
    another.

    Penetrance and expressivity: penetrance for the biochemical phenotype
    (LDL-C elevation) is high but age-dependent, and has not been quantified
    per allele; penetrance for clinical atherosclerotic disease is frankly
    incomplete, since it depends on the allele's effect size, treatment,
    lipoprotein(a), and conventional risk factors. No ADH3-specific penetrance
    estimate is curated here because none is available - stating the absence is
    more useful than borrowing an FH-wide figure.

    Mirror-image genetics: PCSK9 also carries loss-of-function alleles, which
    lower LDL-C and reduce coronary risk lifelong. These are recorded here only
    as reciprocal genetic support for this entry's central mechanism - a
    dose-response across the full range of PCSK9 activity - and as the rationale
    for PCSK9-directed therapy. They are not part of the ADH3 disease entity and
    no protective-allele phenotype is curated in this file.
  evidence:
  - reference: PMID:12730697
    reference_title: "Mutations in PCSK9 cause autosomal dominant hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We mapped a third locus associated with ADH, HCHOLA3 at 1p32, and now report two mutations in the gene PCSK9 (encoding proprotein convertase subtilisin/kexin type 9) that cause ADH."
    explanation: Establishes PCSK9 as the causal gene at the HCHOLA3 locus.
  - reference: PMID:15358785
    reference_title: "NARC-1/PCSK9 and its natural mutants: zymogen cleavage and effects on the low density lipoprotein (LDL) receptor and LDL cholesterol."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The S127R and D374Y mutations result in approximately 50-60% and > or =98% decrease in zymogen processing, respectively."
    explanation: >-
      Supports the allele-level heterogeneity noted above: S127R and D374Y
      differ markedly from each other in their effect on zymogen processing.
  - reference: PMID:16554528
    reference_title: "Sequence variations in PCSK9, low LDL, and protection against coronary heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these mutations were associated with a 28 percent reduction in mean LDL cholesterol and an 88 percent reduction in the risk of CHD"
    explanation: >-
      The reciprocal, loss-of-function arm of the same gene: nonsense PCSK9
      alleles lower LDL-C and coronary risk lifelong. Cited as mirror-image
      support for the gain-of-function mechanism asserted in this entry, not as
      an ADH3 phenotype.
  variants:
  - name: PCSK9 p.Ser127Arg
    description: >-
      One of the two founding ADH3 alleles. Markedly impairs autocatalytic
      zymogen processing and reduces cell-surface LDL receptor in patient
      lymphoblasts.
    gene:
      preferred_term: PCSK9
      term:
        id: hgnc:20001
        label: PCSK9
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:15358785
      reference_title: "NARC-1/PCSK9 and its natural mutants: zymogen cleavage and effects on the low density lipoprotein (LDL) receptor and LDL cholesterol."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The cell surface LDL receptor (LDLR) levels are reduced by 35% in lymphoblasts of S127R patients."
      explanation: Functional consequence of S127R measured in patient-derived cells.
  - name: PCSK9 p.Phe216Leu
    description: >-
      The second founding ADH3 allele, reported alongside S127R in the original
      French pedigrees. Zymogen processing is normal, so its gain of function is
      not explained by the processing defect seen with S127R.
    gene:
      preferred_term: PCSK9
      term:
        id: hgnc:20001
        label: PCSK9
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:15358785
      reference_title: "NARC-1/PCSK9 and its natural mutants: zymogen cleavage and effects on the low density lipoprotein (LDL) receptor and LDL cholesterol."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "F216L, and R218S natural mutants resulted in normal zymogen processing."
      explanation: Documents that F216L retains normal zymogen processing.
  - name: PCSK9 p.Asp374Tyr
    description: >-
      The severe ADH3 allele. Roughly tenfold more potent than wild-type PCSK9
      at reducing cell-surface LDL receptor, and associated with a clinical
      phenotype more severe than severe LDLR-mutation heterozygosity.
    gene:
      preferred_term: PCSK9
      term:
        id: hgnc:20001
        label: PCSK9
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:17080197
      reference_title: "Secreted PCSK9 decreases the number of LDL receptors in hepatocytes and in livers of parabiotic mice."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This activity was approximately 10-fold greater for a gain-of-function mutant, PCSK9(D374Y), that causes hypercholesterolemia."
      explanation: Quantifies the increased receptor-degrading potency of D374Y.
    - reference: PMID:15772090
      reference_title: "Evidence for effect of mutant PCSK9 on apolipoprotein B secretion as the cause of unusually severe dominant hypercholesterolaemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We have identified the D374Y mutant of PCSK9 in three FH families of English origin; all 12 affected individuals have unusually severe hypercholesterolaemia and require more stringent treatment than typical FH patients, who are heterozygous for defects in the LDL receptor."
      explanation: Documents the severe clinical phenotype of D374Y carriers.
  - name: PCSK9 p.Arg496Trp
    description: >-
      A C-terminal cysteine-histidine-rich domain module 1 (CM1) gain-of-function
      allele. Mechanistically distinct from the three alleles above: rather than
      altering zymogen processing or receptor affinity directly, it abolishes
      binding of PCSK9 to LDL particles. Because LDL-bound PCSK9 is less able to
      degrade the receptor, losing that inhibitory association leaves more free,
      active PCSK9 - a third route to the same gain of function. Included as a
      representative of the C-terminal variant class rather than as a
      well-characterised ADH3 pedigree allele.
    gene:
      preferred_term: PCSK9
      term:
        id: hgnc:20001
        label: PCSK9
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:36187800
      reference_title: "Pathogenic gain-of-function mutations in the prodomain and C-terminal domain of PCSK9 inhibit LDL binding."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We previously reported that an R496W GOF mutation in a region of PCSK9 known as cysteine-histidine-rich domain module 1 (CM1) prevents LDL binding in vitro"
      explanation: >-
        Identifies R496W as a CM1-domain gain-of-function allele acting through
        loss of LDL binding.
    - reference: PMID:36187800
      reference_title: "Pathogenic gain-of-function mutations in the prodomain and C-terminal domain of PCSK9 inhibit LDL binding."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Herein, we identify additional GOF mutations that inhibit LDL association, localized either within CM1 or a surface-exposed region in the PCSK9 prodomain."
      explanation: >-
        Establishes loss of LDL association as a shared mechanism spanning two
        distinct PCSK9 domains, which is what makes this a separate variant
        class from S127R/F216L/D374Y as classically described.
environmental:
- name: High Saturated and Trans Fat Intake
  description: >-
    Dietary saturated and trans fat raise circulating LDL on top of the
    PCSK9-driven clearance defect. This is the one modifiable exposure that
    acts on the lipid node itself rather than on the vascular outcome, which is
    why diet is additive to, and never a substitute for, pharmacotherapy in
    this genotype.
  exposure_term:
    preferred_term: high dietary saturated and trans fat exposure
    modifier: INCREASED
    term:
      id: ECTO:0090010
      label: exposure to lipid in food
  influences_mechanisms:
  - target: Chronic Elevation of Plasma LDL Cholesterol
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Dietary fat intake adds to the circulating LDL burden already produced by
      the inherited receptor-degradation defect.
    evidence:
    - reference: PMID:24404629
      reference_title: "Familial Hypercholesterolemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Agents/circumstances to avoid: Smoking, high intake of saturated and trans unsaturated fat, sedentary lifestyle, obesity, hypertension, and diabetes mellitus."
      explanation: >-
        GeneReviews lists high saturated and trans fat intake among the
        exposures to avoid in FH, acting at the lipid level itself.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prevention of primary manifestations: Heart-healthy diet (including reduced intake of saturated fat and increased intake of soluble fiber to 10-20 g/day); increased physical activity; no smoking."
    explanation: >-
      The corresponding dietary recommendation, establishing this as a
      modifiable exposure in FH management.
- name: Tobacco Smoking
  description: >-
    Smoking does not raise LDL cholesterol, so it acts on the vascular arm
    rather than on any lipid node. Against a lifetime LDL burden that begins at
    birth, cessation is disproportionately valuable.
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  influences_mechanisms:
  - target: Subendothelial Retention of ApoB-Containing Lipoproteins
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Smoking aggravates endothelial dysfunction, the permissive condition for
      subendothelial lipoprotein retention, without altering the LDL burden.
    evidence:
    - reference: PMID:24404629
      reference_title: "Familial Hypercholesterolemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Agents/circumstances to avoid: Smoking, high intake of saturated and trans unsaturated fat, sedentary lifestyle, obesity, hypertension, and diabetes mellitus."
      explanation: GeneReviews lists smoking first among the exposures to avoid in FH.
  evidence:
  - reference: PMID:34433300
    reference_title: "Familial Hypercholesterolemia-Risk-Score: A New Score Predicting Cardiovascular Events and Cardiovascular Mortality in Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The FH-Risk-Score incorporates 7 clinical variables: sex, age, high-density lipoprotein cholesterol, low-density lipoprotein cholesterol, hypertension, smoking, and lipoprotein (a) (Lp(a)) with a Harrell C-index for 10-year ASCVD event of 0.75"
    explanation: >-
      Smoking is retained as one of only seven predictors in a 10-year ASCVD
      risk score derived prospectively in 3881 heterozygous FH patients. That
      is the quantitative basis for curating smoking as a modifiable exposure
      acting on the vascular arm rather than on the lipid node.
- name: Sedentary Lifestyle
  description: >-
    Physical inactivity, with the obesity, hypertension and diabetes that

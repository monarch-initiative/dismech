  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:12730697
    reference_title: "Mutations in PCSK9 cause autosomal dominant hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We mapped a third locus associated with ADH, HCHOLA3 at 1p32, and now report two mutations in the gene PCSK9 (encoding proprotein convertase subtilisin/kexin type 9) that cause ADH."
    explanation: >-
      The founding report identifies PCSK9 as the third autosomal dominant
      hypercholesterolemia locus, establishing the disease entity curated here.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - &id012
    reference: PMID:30269829
    reference_title: Whole-Gene Duplication of PCSK9 as a Novel Genetic Mechanism for Severe Familial Hypercholesterolemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified a whole-gene duplication of PCSK9 in 2 unrelated Canadian FH index cases; this PCSK9 CNV was also found to cosegregate with affected status in family members.
    explanation: Whole-gene duplication provides a distinct dosage mechanism in two families.
    directness: DIRECT
    quote_role: PRIMARY_RESULT

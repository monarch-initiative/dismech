      reference_title: Pathogenic gain-of-function mutations in the prodomain and C-terminal domain of PCSK9 inhibit LDL binding.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Herein, we identify additional GOF mutations that inhibit LDL association, localized either within CM1 or a surface-exposed region in the PCSK9 prodomain.
      explanation: Purified-protein and cell experiments establish impaired association with LDL particles for selected variants; this differs from LDL-receptor binding.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
  - target: PCSK9 Binding to the LDL Receptor EGF-A Domain
    description: Secreted protein can bind LDLR; D374Y increases activity in the tested extracellular assays.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:17452316
      reference_title: "Binding of proprotein convertase subtilisin/kexin type 9 to epidermal growth factor-like repeat A of low density lipoprotein receptor decreases receptor recycling and increases degradation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Recombinant human PCSK9 interacted in a sequence-specific manner with the first epidermal growth factor-like repeat (EGF-A) in the EGF homology domain of the human LDLR."
      explanation: Localises the PCSK9 binding site on the LDL receptor to the EGF-A repeat.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
    - reference: PMID:17080197
      reference_title: Secreted PCSK9 decreases the number of LDL receptors in hepatocytes and in livers of parabiotic mice.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: This activity was approximately 10-fold greater for a gain-of-function mutant, PCSK9(D374Y), that causes hypercholesterolemia.
      explanation: D374Y has greater LDLR-depleting activity in the tested exogenous-protein assay, not a uniform tenfold effect of all alleles.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
  - target: Increased Production of ApoB-Containing Lipoproteins
    description: S127R expression is associated with increased apoB production; the intervening human molecular mechanism remains unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:15166014
      reference_title: Apolipoprotein B100 metabolism in autosomal-dominant hypercholesterolemia related to mutations in PCSK9.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: PCSK9 mutation dramatically increased the production rate of apolipoprotein B100 (3-fold) compared with controls or LDL-R mutated subjects, related to direct overproduction of VLDL (3-fold), IDL (3-fold), and LDL (5-fold).
      explanation: Stable-isotope compartmental modelling in two S127R carriers supports increased apoB production, not a mechanism demonstrated in every allele.
      directness: DIRECT
      quote_role: PRIMARY_RESULT

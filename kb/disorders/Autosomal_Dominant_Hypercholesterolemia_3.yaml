name: Autosomal Dominant Hypercholesterolemia 3
creation_date: "2026-08-18T00:00:00Z"
description: >
  Autosomal dominant hypercholesterolemia 3 (ADH3; FH3; HCHOLA3) is the
  PCSK9-related form of familial hypercholesterolemia. Proprotein convertase
  subtilisin/kexin type 9 (PCSK9) is a liver-secreted protein that binds the
  epidermal growth factor-like repeat A (EGF-A) of the low-density lipoprotein
  receptor (LDLR) at the hepatocyte surface and, after co-internalisation,
  reroutes the receptor from the recycling endosome to the lysosome for
  degradation. Heterozygous gain-of-function missense variants in PCSK9
  (classically S127R, F216L and D374Y) intensify this normal regulatory
  activity, so hepatocyte surface LDLR is destroyed faster than it is
  replaced. Fewer receptors means reduced hepatic clearance of circulating
  LDL particles, lifelong elevation of plasma LDL cholesterol, and accelerated
  atherogenesis with premature coronary artery disease; carriers also develop
  the classic cholesterol-deposition stigmata of familial hypercholesterolemia
  (tendon xanthomas, xanthelasma, corneal arcus).

  ADH3 is the rarest of the three dominant FH genes, accounting for a small
  minority of molecularly solved FH, but it is mechanistically distinctive:
  the defect is not in the receptor or its ligand but in a *regulator* of
  receptor abundance, and the receptor pathway itself remains intact. That
  distinction is the direct rationale for PCSK9-directed therapy - the
  monoclonal antibodies evolocumab and alirocumab, which neutralise
  circulating PCSK9, and the small interfering RNA inclisiran, which
  suppresses its hepatic synthesis. The mirror-image loss-of-function PCSK9
  alleles cause low LDL cholesterol and protection from coronary heart
  disease; that protective arm is a separate phenotype and is noted here only
  as the human genetic validation of the drug target, not as part of this
  disease.

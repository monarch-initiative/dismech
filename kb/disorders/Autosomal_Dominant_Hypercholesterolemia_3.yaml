name: Autosomal Dominant Hypercholesterolemia 3
creation_date: "2026-08-18T00:00:00Z"
description: >-
  PCSK9-related familial hypercholesterolemia is an autosomal dominant disorder caused
  by gain-of-function
  sequence variants or, rarely, whole-gene duplication. Allele-specific effects increase
  PCSK9-mediated
  loss of hepatic LDL receptors, reducing LDL removal and raising lifelong LDL cholesterol
  exposure. Increased
  apoB-containing lipoprotein production has also been measured in two S127R carriers.
  Coronary atherosclerosis,
  angina, myocardial infarction and cholesterol deposits can develop, but severity
  varies with the allele,
  age, treatment and other risk factors. PCSK9 loss-of-function variants cause a different,
  low-LDL phenotype.
  Care follows familial-hypercholesterolemia guidance; a small randomized alirocumab
  study provides direct
  short-term LDL-lowering evidence in carriers of four PCSK9 gain-of-function variants.
category: Mendelian
disease_term:
  preferred_term: Autosomal Dominant Hypercholesterolemia 3
  term:
    id: MONDO:0011369
    label: hypercholesterolemia, autosomal dominant, 3
synonyms:
- HCHOLA3
- FH3
- hypercholesterolemia, autosomal dominant, type 3
- hypercholesterolemia, familial, 3
- PCSK9 familial hypercholesterolemia
- familial hypercholesterolemia caused by mutation in PCSK9
parents:
- Familial Hypercholesterolemia
references:
- reference: PMID:24404629
  title: "Familial Hypercholesterolemia."
  tags:
  - GeneReviews
notes: >-
  This entry covers PCSK9-related hypercholesterolemia (MONDO:0011369; OMIM:603776;
  HGNC:20001), within
  the broader familial-hypercholesterolemia spectrum. Gene identity does not establish
  that an individual
  variant is pathogenic or gain-of-function. Acquired and polygenic hypercholesterolemia,
  LDLR/APOB disorders
  and protective PCSK9 loss-of-function alleles remain distinct. General FH care and
  downstream atherosclerosis
  biology are explicitly identified as broader evidence.

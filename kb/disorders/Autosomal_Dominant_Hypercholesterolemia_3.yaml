- name: Plasma Lipoprotein(a)
  notes: >-
    A second, independent lipid measurement recommended at least once in anyone
    with FH. It matters here for two reasons that pull in opposite directions.
    As a *confounder*, lipoprotein(a) cholesterol is counted inside a
    conventionally measured LDL-C and can therefore inflate a clinical FH score
    in someone who carries no FH mutation - which is one reason molecular
    testing, not the lipid panel, is what establishes ADH3. As a *modifier*, a
    high concentration multiplies myocardial-infarction risk on top of the FH
    phenotype and is one of the seven variables in the FH-Risk-Score. It is not
    part of the PCSK9 mechanism and is not altered by it.

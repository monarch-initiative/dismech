prevalence:
- population: Molecularly characterised familial hypercholesterolemia cohorts
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    No population prevalence specific to PCSK9-related FH is established by the cited
    selected cohorts.
    The proportion of PCSK9 findings among LDLR/APOB-negative referrals is not an
    upper bound on the contribution
    to unselected FH. GeneReviews describes PCSK9 as accounting for less than 1% of
    FH, with ascertainment
    and variant interpretation affecting the estimate.
progression:
- phase: Presymptomatic (birth to childhood)
  notes: >-
    LDL cholesterol elevation can be recognized in childhood, whereas visible cholesterol
    deposits and
    clinical atherosclerotic events are variably expressed later. Treatment and allele-specific
    severity
    modify the course.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/
    reference_title: Familial Hypercholesterolemia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Individuals with FH have elevated LDL-C levels starting soon after birth.
    explanation: FH-wide natural history supports early biochemical expression, without assigning a fixed age at which a cholesterol threshold necessarily causes coronary disease.
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
- phase: Cholesterol deposition and clinical presentation (young adulthood)
  notes: >-
    In the long-term British D374Y series, carriers presented about a decade
    earlier than severe LDLR-mutation heterozygotes, at a mean age of about 21
    years, with markedly higher pretreatment cholesterol.
  evidence:
  - reference: PMID:16224054
    reference_title: "Severe hypercholesterolemia in four British families with the D374Y mutation in the PCSK9 gene: long-term follow-up and treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The PCSK9 patients, when compared with the LDLR patients, were younger at presentation (20.8+/-14.7 versus 30.2+/-15.7 years; P=0.003)"
    explanation: Quantifies the age at presentation in a PCSK9 gain-of-function cohort.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- phase: Premature atherosclerotic cardiovascular disease (adulthood)
  notes: >-
    In the selected British D374Y families, clinical coronary disease appeared earlier
    than in the comparator
    LDLR group. This small family-based estimate does not specify onset for all PCSK9
    alleles.
  evidence:
  - reference: PMID:16224054
    reference_title: "Severe hypercholesterolemia in four British families with the D374Y mutation in the PCSK9 gene: long-term follow-up and treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "and were affected >10 years earlier by premature coronary artery disease (35.2+/-4.8 versus 46.8+/-8.9 years; P=0.002)"
    explanation: Quantifies the age at onset of premature coronary disease in this genotype.
    quote_role: PRIMARY_RESULT
    directness: DIRECT

diagnosis:
- name: Sleep and Waking Electroencephalography
  diagnosis_term:
    preferred_term: Electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  presence: Positive
  results: >-
    Focal, multifocal, or generalized spike-and-wave discharges often with
    posterotemporal or centrotemporal predominance, markedly activated by sleep
    onset to become continuous or nearly continuous during slow-wave sleep.
  notes: >-
    Waking EEG can be normal; sleep EEG is essential to detect sleep-activated
    continuous spike-and-wave discharges.
  evidence:
  - reference: PMID:28134012
    reference_title: "Treatment of Epileptic Encephalopathies: Current State of the Art."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Focal, multifocal, or generalized spike and wave discharges may be
      present, often with posterotemporal predominance,59,60,65,73 but the
      waking EEG can also be normal. Sleep, and especially sleep onset, tends
      to activate epileptiform potentials, which can become continuous or
      nearly continuous in sleep, suggesting an overlap between Landau-Kleffner
      syndrome and electrical status epilepticus in sleep.
    explanation: >-
      Establishes sleep and waking EEG demonstrating posterotemporal spike-wave
      discharges activated into continuous or near-continuous discharges in
      sleep as the core diagnostic investigation.
- name: GRIN2A Molecular Genetic Testing
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  presence: Positive in GRIN2A-related cases
  results: >-
    Identification of a heterozygous pathogenic variant in GRIN2A in
    approximately 20% of Landau-Kleffner syndrome and epilepsy-aphasia spectrum
    cases.
  evidence:
  - reference: PMID:27683935
    reference_title: GRIN2A-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of a GRIN2A-related disorder is established in a proband by
      the identification of a GRIN2A heterozygous pathogenic variant on
      molecular genetic testing.
    explanation: >-
      GeneReviews establishes molecular genetic testing for heterozygous
      GRIN2A pathogenic variants as diagnostic of the GRIN2A-related subset.
  - reference: PMID:23933820
    reference_title: GRIN2A mutations in acquired epileptic aphasia and related childhood focal epilepsies and encephalopathies with speech and language dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      about 20% of cases of LKS, CSWSS and electroclinically atypical rolandic
      epilepsy often associated with speech impairment can have a genetic
      origin sustained by de novo or inherited mutations in the GRIN2A gene
    explanation: >-
      Supports the approximately 20% diagnostic yield of GRIN2A molecular
      genetic testing in Landau-Kleffner syndrome and related epilepsy-aphasia
      spectrum cases.

differential_diagnoses:
- name: Electrical Status Epilepticus in Sleep (CSWSS / DEE-SWAS)
  disease_term:
    preferred_term: developmental and/or epileptic encephalopathy with spike-wave activation in sleep
    term:
      id: MONDO:0800501
      label: developmental and/or epileptic encephalopathy with spike-wave activation in sleep
  description: >-
    Closely related childhood focal epileptic encephalopathy sharing
    sleep-activated continuous spike-and-wave discharges during slow-wave sleep
    (CSWSS/ESES), but distinguished by the pattern of language and cognitive
    regression.
  distinguishing_features:
  - Electrical status epilepticus in sleep presents with a primarily expressive aphasia with intact comprehension, whereas Landau-Kleffner syndrome presents with an auditory agnosia in which children appear unconscious of spoken words or effectively deaf.
  evidence:
  - reference: PMID:28134012
    reference_title: "Treatment of Epileptic Encephalopathies: Current State of the Art."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This aphasia takes the form of an auditory agnosia; in contrast to the
      language deficit in electrical status epilepticus in sleep, where there
      is a primarily expressive aphasia with intact comprehension, children
      with Landau-Kleffner syndrome may appear to be unconscious of spoken
      words, or effectively deaf.
    explanation: >-
      Directly contrasts the auditory agnosia of Landau-Kleffner syndrome with
      the primarily expressive aphasia and intact comprehension of electrical
      status epilepticus in sleep.

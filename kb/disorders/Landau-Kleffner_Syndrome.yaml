    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GRIN2A-related disorders are inherited in an autosomal dominant manner.
      Some individuals diagnosed with a GRIN2A-related disorder have the
      disorder as the result of a pathogenic variant inherited from an affected
      parent. Approximately 50% of individuals diagnosed with a GRIN2A-related
      disorder have the disorder as the result of a GRIN2A pathogenic variant
      that occurred as a de novo event in the affected individual or, rarely,

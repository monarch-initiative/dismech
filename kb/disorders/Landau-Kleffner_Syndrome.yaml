progression:
- phase: Onset
  age_range: 2 to 8 years (seizure onset usually 3 to 6 years in GRIN2A-related cases)
  notes: >-
    Onset typically occurs between ages 2 and 8 years in a previously normal
    child after initial typical language acquisition, with seizure onset usually
    between ages three and six years in GRIN2A-related cases.
  evidence:
  - reference: PMID:28134012
    reference_title: "Treatment of Epileptic Encephalopathies: Current State of the Art."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The onset is usually seen between the ages of 2 and 8 in a previously
      normal child.
    explanation: >-
      Establishes the typical childhood age of onset between 2 and 8 years in
      previously normal children.
  - reference: PMID:27683935
    reference_title: GRIN2A-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epilepsy features include seizure onset usually between ages three and
      six years, focal epilepsy with language and/or global developmental
      regression, and electroencephalogram (EEG) abnormalities, including
      continuous spike-and-wave discharges in sleep or very active
      centrotemporal discharges.
    explanation: >-
      Documents typical seizure onset between ages three and six years in
      GRIN2A-related disorders.
- phase: Remission
  age_range: Adolescence
  notes: >-
    Clinical seizures decrease in frequency with age and remit by adolescence,
    and sleep-activated EEG abnormalities also remit over time, whereas the
    language deficit is frequently out of proportion to seizure frequency and
    EEG abnormalities and persists even after the seizures and EEG
    abnormalities have remitted.
  evidence:
  - reference: PMID:28134012
    reference_title: "Treatment of Epileptic Encephalopathies: Current State of the Art."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The seizures in Landau-Kleffner syndrome are not only infrequent but also
      are usually easily controlled by traditional antiepileptic drugs; they
      also decrease in frequency with age and remit by adolescence.
    explanation: >-
      Establishes that clinical seizures decrease in frequency with age and
      remit by adolescence.
  - reference: PMID:28134012
    reference_title: "Treatment of Epileptic Encephalopathies: Current State of the Art."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, there is discordance between the severity of the epilepsy and of
      the language loss, which is generally out of proportion to both the
      frequency of seizures and the abnormalities on EEG, and which persists
      even after the seizures and EEG abnormalities have remitted.
    explanation: >-
      Establishes remission of seizures and EEG abnormalities with frequent
      persistence of language loss.
description: >
  Landau-Kleffner syndrome (LKS), or acquired epileptic aphasia, is a rare
  childhood epileptic encephalopathy in which previously normal children (onset
  typically ages 3-6 years) lose acquired language skills, most prominently
  receptive language (auditory verbal agnosia), in association with continuous
  or near-continuous spike-and-wave discharges activated during slow-wave sleep
  (electrical status epilepticus in sleep, ESES/CSWS). LKS sits within the
  epilepsy-aphasia spectrum (EAS) together with rolandic epilepsy and the
  syndrome of continuous spike-and-wave during slow-wave sleep (CSWSS). About
  20% of EAS cases (including LKS) are caused by pathogenic variants in GRIN2A,
  which encodes the GluN2A subunit of the NMDA glutamate receptor.


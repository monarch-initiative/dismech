- name: Accelerated Spastin Turnover
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: SNX14 associates with the M1 spastin isoform through N-terminal regions. In conditional mouse cerebella, spastin protein is reduced while SPAST transcript is unchanged. In SNX14-depleted HEK293T cells, leupeptin largely reverses enhanced spastin turnover whereas proteasome inhibition does not. This supports posttranscriptional destabilization in the tested systems; the intervening trafficking mechanism and its prevalence across human alleles remain unresolved.
  evidence:

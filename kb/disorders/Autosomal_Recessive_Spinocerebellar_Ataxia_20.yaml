- name: Abnormal Lipid Droplet Maturation
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: In oleate-loaded SNX14-knockout U2OS cells, lipid droplets are fewer and more heterogeneous in size, with reduced total droplet area and modestly reduced ER contact extent. SNX14 remains anchored to the ER through its N terminus and contacts droplets through a C-terminal amphipathic helix; ACSL3 acts upstream of its recruitment. Total triacylglycerol, cholesterol and cholesterol ester levels were not significantly changed in this system. These results distinguish defective droplet maturation from universal failure of neutral-lipid synthesis. The route from this cellular phenotype to human Purkinje-cell death remains unresolved.

  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: 'SNX14-knockout U2OS cells have normal ER morphology under basal conditions but marked ER dilation and fragmentation after prolonged palmitate exposure. SCD1 overexpression rescues this morphology. An exaggerated unfolded-protein response was not established: spliced XBP1 was not significantly different between genotypes, and IRE1 or PERK inhibition did not rescue viability.'

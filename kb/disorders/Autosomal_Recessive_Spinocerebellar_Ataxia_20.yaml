  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: Engineered SNX14-knockout U2OS cells and patient-derived fibroblasts are more susceptible to saturated-fatty-acid exposure. SCD1 overexpression or oleate cotreatment rescues viability in the engineered cells. Rescue persists with DGAT inhibition, so it cannot be attributed solely to triglyceride storage in lipid droplets. The contribution of this stress response to human neuronal loss is proposed and remains unproven.

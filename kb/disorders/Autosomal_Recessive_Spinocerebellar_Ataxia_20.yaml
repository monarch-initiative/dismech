  description: Predegenerating two-month-old constitutive Snx14-knockout mouse cerebella have increased acylcarnitines by UPLC-HRMS, while cortex, liver and plasma do not show the same total increase. Bulk tissue data do not assign the metabolite pool to Purkinje cells. Mostly intact mitochondrial ultrastructure at this age argues against gross mitochondrial destruction as the sole explanation, but does not exclude functional mitochondrial defects. Acylcarnitine toxicity is a proposed contributor to degeneration, not a validated human SCAR20 biomarker.

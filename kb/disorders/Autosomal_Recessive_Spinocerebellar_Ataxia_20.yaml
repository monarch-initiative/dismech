- name: SCD1 augmentation (cellular rescue lead)
  description: Ectopic SCD1 expression rescues palmitate sensitivity, free-fatty-acid accumulation and ER morphology in SNX14-knockout U2OS cells. Oleate cotreatment also rescues viability. No delivery method, human efficacy or dietary treatment is established. Basal measured SCD1 enzyme activity is preserved, so this is compensatory augmentation rather than replacement of a proven enzyme deficiency.
  action_category: THERAPEUTIC
  evidence:
  - reference: PMID:33310904
    reference_title: Snx14 proximity labeling reveals a role in saturated fatty acid metabolism and ER homeostasis defective in SCAR20 disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SCD1 overexpression rescuedSNX14KOcell viability, andSNX14KOcells now responded similarly to WT cells exposed to dose-dependent palmitate treatment
    explanation: U2OS rescue after palmitate challenge supports an experimental target, not an established treatment.
  target_mechanisms:
  - target: Saturated Fatty Acid Lipotoxicity
    treatment_effect: INHIBITS
    description: Cell viability improves after palmitate challenge.
    evidence:

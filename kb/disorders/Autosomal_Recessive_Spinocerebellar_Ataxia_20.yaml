      explanation: The stable genetic model differs from the earlier morpholino model.
treatments:
- name: Supportive and Multidisciplinary Care
  description: Management addresses developmental, motor, communication, hearing and orthopedic needs. Supportive recommendations draw on clinical SCAR20 reports and general hereditary-ataxia guidance. The reviewed literature does not establish a disease-modifying treatment in people; cellular and mouse rescue experiments remain preclinical.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41294032
    reference_title: 'Exploring the Genetic Variations Underlying SNX14-Linked Autosomal Recessive Spinocerebellar Ataxia Type 20: A Case Series of 17 Patients From a Single Center in the Omani Population and Review of Literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This report expands the mutational and clinical spectrum of SCAR20 in the Middle East and highlights the importance of early genetic testing, diagnostic vigilance, and multidisciplinary care in consanguineous populations.
    explanation: Emphasizes early diagnosis and multidisciplinary supportive care as the mainstay of management.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1138/
    reference_title: Hereditary Ataxia Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The goals of supportive care are to maximize function and reduce complications.
    explanation: General hereditary-ataxia guidance extrapolated to SCAR20. Supports function-directed multidisciplinary management, not a disease-specific efficacy estimate.
  action_category: THERAPEUTIC
- name: Rehabilitation and Physical Therapy
  description: Individualized balance, gait and strengthening work, adaptive mobility devices and home modifications support function and reduce falls. General hereditary-ataxia recommendations must be adapted to developmental ability, hypotonia and whether independent walking has been acquired.
  treatment_term:
    preferred_term: Physical Therapy
    term:

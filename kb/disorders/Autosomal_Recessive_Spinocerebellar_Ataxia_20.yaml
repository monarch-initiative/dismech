  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: Conditional Snx14-deficient mouse cerebellar tissue has reduced ATP content, complex I- and II-linked oxidative phosphorylation and maximal electron-transport capacity. These are functional tissue assays; they do not establish a primary defect in a single respiratory-chain enzyme. Valproate restores respiratory capacity together with axonal transport and neuronal survival, but the causal sequence between these endpoints is not fully isolated.
  evidence:

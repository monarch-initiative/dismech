    snippet: Here we describe the first non-consanguineous SCAR20 family, the second Portuguese, with two siblings presenting similar clinical features caused by compound heterozygous SNX14 variants
    explanation: Documents compound heterozygous inheritance in the first non-consanguineous SCAR20 family, confirming the recessive mechanism outside consanguineous pedigrees.
  action_category: COUNSELING_INFORMATIONAL
- name: Orthopedic management
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: Assess spinal curvature, foot deformities and contractures for orthoses or specialist intervention. One adult SCAR20 case used a scoliosis brace and one child underwent hip reduction and adductor tenotomy. These case descriptions document management, not comparative efficacy.
  target_phenotypes:
  - preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  - preferred_term: Hip dysplasia
    term:
      id: HP:0001385
      label: Hip dysplasia
  - preferred_term: Talipes equinovarus
    term:
      id: HP:0001762
      label: Talipes equinovarus
  evidence:
  - reference: PMID:42074495
    reference_title: A Homozygous Deep Intronic SNX14 Variant Activates Pseudo-Exon Inclusion in a Patient with SCAR20.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: He also developed scoliosis that was managed with orthotic bracing.
    explanation: Direct longitudinal case observation; no frequency or comparative treatment efficacy is inferred.
  - reference: DOI:10.5734/jgm.2021.18.2.127
    reference_title: Two Korean siblings with autosomal recessive spinocerebellar ataxia 20 caused by homozygous variants in <i>SNX14</i>
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'At 6 months of age, she underwent adductor tenotomy and close reduc-

      tion due to developmental dysplasia of the hip.'
    explanation: Single-patient clinical observation.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1138/
    reference_title: Hereditary Ataxia Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Refer to orthopedic surgeon when required.
    explanation: General hereditary-ataxia guidance extrapolated to SCAR20. The skeletal-involvement row supports referral based on clinical need.
- name: Antiseizure treatment
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: Treat epilepsy when present using individualized antiseizure therapy. The 2015 series reports seizure control with anticonvulsants without establishing a preferred drug. Seizures can recur after years, as in the 2026 adult case. Mouse valproate rescue is separate evidence and does not establish clinical disease modification.
  target_phenotypes:
  - preferred_term: Seizures
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:25848753
    reference_title: Biallelic mutations in SNX14 cause a syndromic form of cerebellar atrophy and lysosome-autophagosome dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Seizures developed in half by 2 years, and were well controlled with anticonvulsant medication.
    explanation: The narrative supports occurrence and reported anticonvulsant response; its frequency differs from Table 1 (8/22).
  - reference: PMID:42074495
    reference_title: A Homozygous Deep Intronic SNX14 Variant Activates Pseudo-Exon Inclusion in a Patient with SCAR20.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: After a decade, epilepsy recurred and has been managed with antiepileptic medication to date.
    explanation: Direct longitudinal observation of recurrence and treatment.
- name: Longitudinal Neurologic and Functional Surveillance
  therapeutic_modality: OTHER
  description: Follow motor function, mobility, falls and neurologic progression, with rehabilitation reassessment and communication or feeding review as needs change. General hereditary-ataxia guidance suggests annual neurologic and functional review and more frequent reassessment for deterioration. Standardized ataxia measures may need adaptation for severely developmentally impaired or nonambulant patients; this is not a validated SCAR20-specific surveillance schedule.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1138/
    reference_title: Hereditary Ataxia Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Monitor ataxia progression w/standardized scale (SARA).
    explanation: 'General hereditary-ataxia guidance, extrapolated to SCAR20: Table 7 recommends annual neurologic and functional review, more often for acute exacerbation.'
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1138/
    reference_title: Hereditary Ataxia Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Assess aspiration risk &#x00026; feeding methods.
    explanation: 'General hereditary-ataxia guidance, extrapolated to SCAR20: Swallowing surveillance follows symptom progression.'
  action_category: MONITORING
- name: Feeding and nutritional assessment
  action_category: MONITORING
  description: Assess nutritional status and aspiration risk if choking, swallowing difficulty or poor weight gain emerges, with feeding-team input as indicated. This is general hereditary-ataxia care; it does not assert that dysphagia occurs in every person with SCAR20.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1138/
    reference_title: Hereditary Ataxia Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: For those w/frequent choking or severe dysphagia, assess nutritional status
    explanation: General hereditary-ataxia guidance extrapolated to SCAR20. Supports symptom-triggered feeding assessment.
experimental_models:
- name: Patient-derived neural progenitors
  experimental_model_type: IPSC_DERIVED_MODEL
  description: Neural progenitors generated from patient iPSCs show lysosomal enlargement and reduced starvation-induced LC3 flux. SNX14 re-expression normalizes elevated LC3-II. These cells are not mature Purkinje neurons.
  publication: PMID:25848753
  modeled_mechanisms:
  - target: Impaired Autophagosome Clearance in Neural Progenitors
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: LC3 flux under starvation and genetic complementation.
    limitations: The patient-line result differs from later fibroblast and HEK293 findings and does not prove universal fusion failure.
    evidence:
    - reference: PMID:25848753
      reference_title: Biallelic mutations in SNX14 cause a syndromic form of cerebellar atrophy and lysosome-autophagosome dysfunction.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: we identified slower LC3 flux in patient cells compared to controls.
      explanation: Flux was measured in nutrient-deprived patient neural progenitors using leupeptin and ammonium chloride, rather than inferred solely from steady-state LC3-II.
    - reference: PMID:25848753
      reference_title: Biallelic mutations in SNX14 cause a syndromic form of cerebellar atrophy and lysosome-autophagosome dysfunction.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: the increased LC3 II levels were recovered to basal rates by forced expression of tagged SNX14 into patient cells
      explanation: Genetic complementation supports SNX14 dependence of the neural-progenitor readout.
  - target: Lysosomal Enlargement
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Enlarged lysosomes assessed by imaging.
    limitations: Active cathepsin-D staining was not obviously different; enlargement does not establish global enzyme failure.
    evidence:
    - reference: PMID:25848753
      reference_title: Biallelic mutations in SNX14 cause a syndromic form of cerebellar atrophy and lysosome-autophagosome dysfunction.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: lysosomes appeared increased in size in patient NPCs
      explanation: The patient neural-progenitor imaging directly measures lysosomal enlargement.
- name: SNX14-knockout U2OS lipid and SCD1 rescue system
  experimental_model_type: CELL_LINE
  description: Engineered U2OS cells are challenged with oleate or palmitate. Imaging, lipidomics, fatty-acid uptake and microsomal desaturase assays separate droplet morphology, free-fatty-acid processing and acyl-chain saturation. SCD1 overexpression rescues viability, free-fatty-acid accumulation and ER morphology without showing that endogenous SCD1 activity was deficient.
  publication: PMID:33310904
  modeled_mechanisms:
  - target: Abnormal Lipid Droplet Maturation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Cellular perturbation and rescue assays measure this phenotype.
    limitations: Immortalized non-neural cells under fatty-acid loading; results are not human neuronal treatment efficacy.
    evidence:
    - reference: PMID:30765438
      reference_title: Cerebellar ataxia disease-associated Snx14 promotes lipid droplet growth at ER-droplet contacts.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: loss of SNX14 causes alterations in LD morphology following OA treatment, with a substantial increase in the proportion of very small and large LDs.
      explanation: U2OS knockout cells have a bimodal droplet-size distribution after oleate loading.
  - target: Impaired Saturated Fatty Acid Processing
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Cellular perturbation and rescue assays measure this phenotype.
    limitations: Immortalized non-neural cells under fatty-acid loading; results are not human neuronal treatment efficacy.
    evidence:
    - reference: PMID:33310904
      reference_title: Snx14 proximity labeling reveals a role in saturated fatty acid metabolism and ER homeostasis defective in SCAR20 disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: This indicates thatSNX14KOcells accumulate FFAs following palmitate uptake, consistent with a defect in palmitate processing, and these effects can be reversed by SCD1 overexpression.
      explanation: Time-course lipid extraction and uptake controls distinguish defective processing from enhanced uptake.
  - target: Increased Lipid Acyl-Chain Saturation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Cellular perturbation and rescue assays measure this phenotype.
    limitations: Immortalized non-neural cells under fatty-acid loading; results are not human neuronal treatment efficacy.
    evidence:
    - reference: PMID:33310904
      reference_title: Snx14 proximity labeling reveals a role in saturated fatty acid metabolism and ER homeostasis defective in SCAR20 disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: there was a greater proportion of saturated fatty acyl chains within several lipid classes.
      explanation: Mass-spectrometry lipidomics measures altered saturation rather than a uniform decrease in all lipid abundance.
  - target: Palmitate-Induced ER Structural Disruption
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Cellular perturbation and rescue assays measure this phenotype.
    limitations: Immortalized non-neural cells under fatty-acid loading; results are not human neuronal treatment efficacy.
    evidence:
    - reference: PMID:33310904
      reference_title: Snx14 proximity labeling reveals a role in saturated fatty acid metabolism and ER homeostasis defective in SCAR20 disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: ectopic expression of SCD1 in palmitate-treatedSNX14KOcells rescued ER morphology
      explanation: Rescue links the stress-dependent ER phenotype to fatty-acid handling.
  - target: Saturated Fatty Acid Lipotoxicity
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Cellular perturbation and rescue assays measure this phenotype.
    limitations: Immortalized non-neural cells under fatty-acid loading; results are not human neuronal treatment efficacy.
    evidence:
    - reference: PMID:33310904
      reference_title: Snx14 proximity labeling reveals a role in saturated fatty acid metabolism and ER homeostasis defective in SCAR20 disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: both SNX14KO cells and SCAR20 disease patient-derived cells are hypersensitive to SFA-mediated lipotoxic cell death.
      explanation: Engineered U2OS cells and patient fibroblasts provide distinct cellular evidence.
- name: SCAR20 patient dermal fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: Patient fibroblasts show abnormal vacuolar and lipid handling phenotypes, with allele-dependent responses to Torin1 and preserved autolysosome formation in the 2018 study. The 2020 lipid study tested palmitate sensitivity in one patient line against two controls.
  publication: PMID:33310904
  modeled_mechanisms:
  - target: Saturated Fatty Acid Lipotoxicity
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Patient fibroblasts show enhanced sensitivity to saturated fatty acids.
    limitations: Few donor lines; non-neural tissue and no proof of patient clinical response to the cellular rescue interventions.
    evidence:
    - reference: PMID:33310904
      reference_title: Snx14 proximity labeling reveals a role in saturated fatty acid metabolism and ER homeostasis defective in SCAR20 disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: both SNX14KO cells and SCAR20 disease patient-derived cells are hypersensitive to SFA-mediated lipotoxic cell death.
      explanation: Engineered U2OS cells and patient fibroblasts provide distinct cellular evidence.
  - target: Impaired Autophagosome Clearance in Neural Progenitors
    relationship: FAILS_TO_RECAPITULATE
    fidelity: MODERATE
    description: Fibroblasts retain efficient autolysosome formation under the tested conditions.
    limitations: Different cell type, allele and stimulus from the patient neural-progenitor assay.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5961352/
      reference_title: SNX14 mutations affect endoplasmic reticulum-associated neutral lipid metabolism in autosomal recessive spinocerebellar ataxia 20 - PMC
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: we observe a very strong colocalization of autophagosome and lysosome associated markers indicating the efficient formation of autolysosomes in SCAR20 mutant fibroblasts
      explanation: The fibroblast colocalization and p62-degradation assays support preserved autolysosome formation under the tested conditions.
- name: SNX14-depleted HEK293T spastin-turnover assays
  experimental_model_type: CELL_LINE
  description: Co-immunoprecipitation and domain mapping test the SNX14-M1 spastin interaction. Leupeptin and MG132 distinguish lysosomal from proteasomal turnover of spastin.
  publication: PMID:34691693
  modeled_mechanisms:
  - target: Accelerated Spastin Turnover
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Spastin abundance and inhibitor-sensitive turnover are assayed.
    limitations: Engineered non-neural cells; molecular trafficking intermediates remain unresolved.
    evidence:
    - reference: PMID:34691693
      reference_title: SNX14 deficiency-induced defective axonal mitochondrial transport in Purkinje cells underlies cerebellar ataxia and can be reversed by valproate.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: enhanced spastin turnover with SNX14 deficiency was largely reversed by the inhibition of lysosomal, rather than proteasomal, protein degradation
      explanation: Inhibitor experiments in HEK293T cells support increased lysosomal turnover.
- name: Conditional Snx14 mouse primary neuronal cultures
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: Live imaging measures axonal mitochondrial motility in conditional mouse neurons, with recombinant AAV M1-spastin or valproate rescue. Separately, FACS-isolated P6 Pcp2-Cre Purkinje cells show increased ROS and reduced neurite size and complexity after five days in culture; valproate improves these readouts.
  publication: PMID:34691693
  modeled_mechanisms:
  - target: Axonal Mitochondrial Transport Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Bidirectional motility and rescue are measured by time-lapse microscopy.
    limitations: Cultured mouse neurons; the main-text motility assay should not be relabeled as a patient-derived Purkinje-cell assay.
    evidence:
    - reference: PMID:34691693
      reference_title: SNX14 deficiency-induced defective axonal mitochondrial transport in Purkinje cells underlies cerebellar ataxia and can be reversed by valproate.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Anterograde and retrograde mitochondrial transport was compromised.
      explanation: Time-lapse microscopy measures the transport defect directly in cultured mouse neurons.
    - reference: PMID:34691693
      reference_title: SNX14 deficiency-induced defective axonal mitochondrial transport in Purkinje cells underlies cerebellar ataxia and can be reversed by valproate.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: M1 spastin overexpression largely restored mitochondrial motility in Snx14 KO neurons
      explanation: Recombinant AAV-mediated spastin re-expression provides functional rescue evidence.
- name: Oleate-stimulated Snx14 exon-14 knockout cerebellar cultures
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: Mixed embryonic cerebellar cultures from the viable constitutive mouse model were stimulated with oleate. Calbindin-positive Purkinje cells showed reduced droplet number. Lipid droplets were not detected in intact Purkinje cells in tissue by the same study, so the culture result is not an in-vivo droplet count.
  publication: PMID:38625743
  modeled_mechanisms:
  - target: Abnormal Lipid Droplet Maturation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Oleate stimulation reveals reduced lipid-droplet formation in cultured Purkinje cells.
    limitations: Exogenous lipid challenge and mixed embryonic culture differ from intact adult cerebellum.
    evidence:
    - reference: PMID:38625743
      reference_title: Altered lipid homeostasis is associated with cerebellar neurodegeneration in SNX14 deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: the number of LDs detected in Snx14-KO PCs was half the number in WT PCs
      explanation: Calbindin-positive Purkinje cells in oleate-stimulated cerebellar cultures have fewer lipid droplets; intact tissue did not yield a comparable droplet count.
- name: Patient RNA assays for SNX14 splice variants
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: Patient-derived fibroblast RNA-seq identified pseudoexon inclusion or exon extension and reduced SNX14 expression in the 2026 diagnostic studies. The 2023 family instead underwent PBMC RT-PCR. These accessible tissues establish splice consequences but do not measure neural protein function or validate an antisense treatment.
  publication: PMID:42074495
  modeled_mechanisms:
  - target: Aberrant SNX14 Splicing
    relationship: MEASURES
    fidelity: MODERATE
    description: Assays identify allele-specific abnormal splice products.
    limitations: Different tissues and assays; RNA defects do not substitute for protein-level measurements.
    evidence:
    - reference: PMID:42074495
      reference_title: A Homozygous Deep Intronic SNX14 Variant Activates Pseudo-Exon Inclusion in a Patient with SCAR20.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: RNA-seq data from the proband showed no SNX14 transcripts with normal splicing.
      explanation: This result applies to the assayed fibroblast RNA, not all tissues or every SNX14 allele.
    - reference: PMID:41623120
      reference_title: Fibroblast Transcriptomics in Molecular Diagnostics of a Comprehensive Dystonia Cohort.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: SNX14 mis‐splicing and underexpression resulted from a homozygous c.1108 + 28A>G variant, which led to extension of exon 12
      explanation: RNA-guided genome reanalysis identified a splice-altering SNV; the study reports a diagnosis but no separate ACMG classification in this passage.
- name: Acute Snx14 knockdown in mouse cortical pyramidal neurons
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:24859318
  description: Embryonic mouse cortical neurons were transduced with lentiviral shRNA at DIV4, selected with puromycin, and assayed at DIV11. Approximately 60% protein knockdown altered intrinsic firing and miniature synaptic currents. Recorded pyramidal neurons were identified by morphology and negative GAD67 staining. This is an acute partial knockdown, not a patient-allele model; the study did not report a genetic rescue of these electrophysiological effects. Mouse neuron-specific paternal expression in the same paper does not establish imprinting in humans.
  modeled_mechanisms:
  - target: Reduced Cortical Neuron Excitability
    relationship: RECAPITULATES
    fidelity: LOW
    description: Patch-clamp assays quantify the neuronal phenotype after partial knockdown.
    limitations: Cultured embryonic mouse cortex; no human-allele test or rescue, and primary versus homeostatic effects remain unresolved.
    evidence:
    - reference: PMID:24859318
      reference_title: Snx14 regulates neuronal excitability, promotes synaptic transmission, and is imprinted in the brain of mice.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We found that Snx14 knockdown reduced intrinsic excitability of pyramidal neurons
      explanation: Current-clamp recordings in mouse cortical cultures; reduced input resistance and increased rheobase accompany reduced firing.
  - target: Reduced Cortical Synaptic Transmission
    relationship: RECAPITULATES
    fidelity: LOW
    description: Patch-clamp assays quantify the neuronal phenotype after partial knockdown.
    limitations: Cultured embryonic mouse cortex; no human-allele test or rescue, and primary versus homeostatic effects remain unresolved.
    evidence:
    - reference: PMID:24859318
      reference_title: Snx14 regulates neuronal excitability, promotes synaptic transmission, and is imprinted in the brain of mice.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We observed a dramatic reduction in mEPSC and mIPSC frequency, but not amplitude, with Snx14 knockdown
      explanation: Voltage-clamp recordings measure fewer spontaneous excitatory and inhibitory events; unchanged amplitudes limit the interpretation.

- name: Valproate (preclinical disease-modification lead)
  description: In conditional Snx14-deficient mice, daily intraperitoneal valproate from P25 for 35 days improved motor coordination, Purkinje-cell survival and cerebellar respiration. Spastin abundance, microtubule organization and cultured-neuron mitochondrial motility improved. The tested mouse regimen was 250 mg/kg/day; this is not a human dosing recommendation. SAHA and panobinostat did not reproduce the rescue, limiting a simple generic HDAC-inhibition explanation. Human disease-modifying efficacy remains unestablished.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:34691693
    reference_title: SNX14 deficiency-induced defective axonal mitochondrial transport in Purkinje cells underlies cerebellar ataxia and can be reversed by valproate.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The antiepileptic drug valproate ameliorated motor deficits and cerebellar degeneration in Snx14-deficient mice via the restoration of mitochondrial transport and function in Purkinje cells.
    explanation: This is a mouse intervention, not evidence of disease modification in people.
  target_mechanisms:

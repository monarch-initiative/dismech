  description: MALDI mass-spectrometry imaging shows reduced cerebellar triglyceride species in constitutive Snx14-knockout mice, including TG 53:2 in the outer cerebellar cortex. This spatial assay is distinct from bulk UPLC-HRMS, in which triglycerides were undetectable in both cortical and cerebellar extracts. Reduced storage is a proposed contributor to excess fatty-acid stress; the lipidomics do not establish cell-specific causal flux.

- name: M1 spastin re-expression (cellular rescue lead)
  description: Recombinant AAV-mediated M1 spastin expression restores mitochondrial motility in cultured Snx14-deficient mouse neurons. This is a mechanistic rescue experiment; systemic delivery, in-vivo disease modification and human treatment efficacy were not established.
  action_category: THERAPEUTIC

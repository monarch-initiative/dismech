diagnosis:
- name: Molecular Genetic Testing
  description: Molecular confirmation requires biallelic pathogenic or likely pathogenic SNX14 variants interpreted with phenotype and segregation. Exome sequencing identifies many coding variants, but a negative result or a single detected allele does not exclude intronic or complex structural disease alleles. Early MRI may be normal; later cerebellar atrophy, developmental impairment and characteristic facial features guide testing. A pathogenic allele paired with a VUS does not by itself establish a fully resolved molecular diagnosis.
  evidence:
  - reference: PMID:25439728
    reference_title: Mutations in SNX14 cause a distinctive autosomal-recessive cerebellar ataxia and intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We used homozygosity mapping and whole-exome sequencing to identify a homozygous nonsense mutation and an in-frame multiexon deletion in two families.
    explanation: Describes the homozygosity-mapping plus exome-sequencing diagnostic approach.
- name: RNA-guided genome reanalysis
  description: Fibroblast RNA sequencing or targeted RT-PCR can reveal splice defects missed during initial exome or genome interpretation. Combine the transcript result with DNA sequence and segregation. The c.867+288A>G case was unresolved after initial genome analysis, illustrating that sequencing coverage alone does not guarantee variant prioritization.
  evidence:
  - reference: PMID:42074495
    reference_title: A Homozygous Deep Intronic SNX14 Variant Activates Pseudo-Exon Inclusion in a Patient with SCAR20.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Retrospective WGS data analysis revealed a homozygous NM_153816.6(SNX14): c.867+288A>G deep intronic variant, which caused pseudo-exon activation and reduced transcript levels.'
    explanation: RNA analysis guided reinterpretation of already available genome data.
  - reference: PMID:37485342
    reference_title: 'Homozygous deep intronic variant in SNX14 cause autosomal recessive Spinocerebellar ataxia 20: a case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: After analysis the variant was reclassified as likely pathogenic (PS3, PM2) according to ACMG criteria
    explanation: Records the source-reported classification after RNA testing.
- name: Targeted structural-variant characterization
  description: When one pathogenic SNX14 allele is found and the phenotype strongly fits, targeted dosage analysis and breakpoint characterization can resolve a second complex allele. In the Portuguese family, exome CNV screening was unrevealing; quantitative PCR, long-range PCR and blood RNA analysis established the paternal rearrangement.
  evidence:
  - reference: PMID:33193593
    reference_title: Two Compound Heterozygous Variants in SNX14 Cause Stereotypies and Dystonia in Autosomal Recessive Spinocerebellar Ataxia 20.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Long-range PCR allowed the characterization of the genomic region breakpoints, revealing a complex rearrangement that includes two deletions, an inversion and an AG insertion
    explanation: Genomic assays resolve the physical lesion separately from its transcript consequence.
  - reference: PMID:33193593
    reference_title: Two Compound Heterozygous Variants in SNX14 Cause Stereotypies and Dystonia in Autosomal Recessive Spinocerebellar Ataxia 20.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Expression analysis enabled the identification of a shorter transcript with a deletion encompassing SNX14 exons 8 to 13: r.613_1171del, p.(Val205Argfs*47)'
    explanation: RNA analysis supports exon loss and the predicted frameshift; this is not a protein-abundance measurement.
- name: Age-aware brain MRI assessment
  description: Cerebellar atrophy supports the phenotype, but a normal early MRI does not exclude SCAR20. Review the age at imaging and clinical progression rather than requiring congenital pontocerebellar hypoplasia.
  evidence:
  - reference: url:https://discovery.ucl.ac.uk/1453669/2/mmc2-1.pdf
    reference_title: https://discovery.ucl.ac.uk/1453669/2/mmc2-1.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the ﬁrst years of life, no neuroradiological anomalies were observed in affected individuals, as depicted
    explanation: The founding report documents normal early scans followed by later cerebellar abnormalities.
- name: Audiologic assessment
  description: Assess hearing when delayed communication or suspected hearing loss is present. Brainstem auditory evoked responses can provide objective evidence when behavioral audiometry is limited by developmental impairment. A normal reported response to sound does not substitute for an audiologic evaluation.
  evidence:
  - reference: PMID:42074495
    reference_title: A Homozygous Deep Intronic SNX14 Variant Activates Pseudo-Exon Inclusion in a Patient with SCAR20.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Brainstem auditory evoked response tested at 3 years showed thresholds > 80 dB, consistent with neurogenic deafness.
    explanation: Direct example of objective hearing assessment in SCAR20; the threshold is this patient’s result, not a diagnostic cutoff for the syndrome.
- name: Interpretation of storage-disease-like biochemical findings
  description: Coarse facies and organ enlargement can prompt investigation for lysosomal storage disease. Urine glycosaminoglycans or oligosaccharides may be abnormal in some SNX14 cases, while other patients have normal metabolic testing. These results do not diagnose or exclude SCAR20, and tested lysosomal enzyme activities were normal in two members of the 2015 cohort.

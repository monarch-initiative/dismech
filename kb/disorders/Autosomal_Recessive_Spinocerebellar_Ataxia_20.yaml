- name: Impaired Saturated Fatty Acid Processing
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: Palmitate-loaded SNX14-knockout U2OS cells accumulate excess free fatty acids without increased fatty-acid uptake. SNX14 co-immunoprecipitates with SCD1 and requires its ER anchor and PXA domain for protection from palmitate. SCD1 overexpression rescues free-fatty-acid accumulation, but direct microsomal assays found no significant reduction of SCD1 enzymatic activity after SNX14 loss. A substrate-presentation or organizational role is proposed; SNX14 is not established as an obligate activator of SCD1.

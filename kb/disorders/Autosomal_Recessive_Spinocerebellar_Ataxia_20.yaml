- name: Reduced Cortical Neuron Excitability
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: Partial acute Snx14 knockdown in cultured mouse cortical pyramidal neurons reduces current-evoked firing, decreases input resistance and increases rheobase. The relevant ion-channel or trafficking intermediate was not identified. This experiment does not establish the mechanism of seizures in patients or a temporal ordering with synaptic abnormalities.
  evidence:
  - reference: PMID:24859318
    reference_title: Snx14 regulates neuronal excitability, promotes synaptic transmission, and is imprinted in the brain of mice.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We found that Snx14 knockdown reduced intrinsic excitability of pyramidal neurons
    explanation: Current-clamp recordings in mouse cortical cultures; reduced input resistance and increased rheobase accompany reduced firing.
- name: Reduced Cortical Synaptic Transmission
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: Partial Snx14 knockdown in mouse cortical cultures reduces the frequency of miniature excitatory and inhibitory postsynaptic currents without reducing their amplitudes. Whether this is primary or secondary to altered intrinsic excitability remains unresolved. In a separate constitutive knockout mouse, fewer cortical synaptic puncta and reduced SV2A accompany cognitive behavioral deficits despite preserved forebrain neuronal counts.
  evidence:
  - reference: PMID:24859318
    reference_title: Snx14 regulates neuronal excitability, promotes synaptic transmission, and is imprinted in the brain of mice.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We observed a dramatic reduction in mEPSC and mIPSC frequency, but not amplitude, with Snx14 knockdown
    explanation: Voltage-clamp recordings measure fewer spontaneous excitatory and inhibitory events; unchanged amplitudes limit the interpretation.
  - reference: PMID:38625743
    reference_title: Altered lipid homeostasis is associated with cerebellar neurodegeneration in SNX14 deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: IF and WB results were consistent with a reduction of excitatory and inhibitory synaptic puncta
    explanation: Structural and protein readouts in mouse cortex complement, but are not equivalent to, the earlier cultured-neuron electrophysiology.
  downstream:
  - target: Intellectual disability

    explanation: Normal enzyme results limit interpreting the storage-like appearance as a defined enzymatic deficiency.
differential_diagnoses:
- name: Autosomal recessive spinocerebellar ataxia 15 (RUBCN)
  description: RUBCN-related recessive cerebellar ataxia with intellectual disability and seizures overlaps clinically with SNX14 disease. Seizures can occur in both, so molecular testing and the broader phenotype distinguish them.
  distinguishing_features:
  - Biallelic RUBCN variants rather than SNX14
  - Coarse facial features and relative macrocephaly can favor SNX14, but their absence does not exclude it
- name: Other congenital disorders of autophagy
  description: 'A broader class of autophagy-gene disorders (e.g. EPG5/Vici syndrome, WDR45, SPG11/SPG15) presenting with neurodevelopmental delay and neurodegeneration, distinguished by their specific genes and additional systemic features.

    '
  distinguishing_features:
  - Distinct causal autophagy genes and organ-specific features
- name: Other recessive/childhood ataxias with cerebellar atrophy
  description: 'Broad differential of childhood cerebellar-atrophy ataxias (e.g. Friedreich ataxia, ataxia with vitamin E deficiency, ataxia-telangiectasia, ARSACS), distinguished by additional system involvement and their specific genes.

    '
  distinguishing_features:
  - Coarse facial features, variable macrocephaly and hearing impairment can favor SNX14; age-dependent cerebellar atrophy and molecular testing refine the diagnosis
- name: Marinesco-Sjogren syndrome
  description: SIL1-related disease shares intellectual disability, cerebellar atrophy, hypotonia and ataxia. Cataracts and myopathy favor Marinesco-Sjogren syndrome; the founding SNX14 report proposed testing SNX14 in overlapping SIL1-negative cases.
  distinguishing_features:
  - SIL1-related cataracts and myopathy versus the characteristic SNX14 facial and hearing phenotype
  - Normal creatine kinase was documented in four tested individuals in the founding SNX14 series, not established as a universal exclusion test
  evidence:
  - reference: url:https://discovery.ucl.ac.uk/1453669/2/mmc2-1.pdf
    reference_title: https://discovery.ucl.ac.uk/1453669/2/mmc2-1.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: SNX14 should be screened in MSS-like individuals not carrying an SIL1 mutation, especially in those without microcephaly, cataracts, or myopathy
    explanation: The original paper identifies Marinesco-Sjogren-like presentations as a clinically relevant differential.
- name: Lysosomal storage disorders
  description: Coarse facial features, macroglossia, organ enlargement and occasional urine abnormalities can resemble mucopolysaccharidosis or other lysosomal storage disorders. SNX14 molecular testing and disorder-directed biochemical assessment distinguish these overlapping presentations; normal lysosomal enzyme tests do not exclude SCAR20.
  distinguishing_features:
  - SNX14-associated clinical and molecular findings with variable, sometimes normal metabolic tests
  - No specific lysosomal enzyme deficiency has been established as the defining defect in SCAR20
  evidence:
  - reference: PMID:25848753
    reference_title: Biallelic mutations in SNX14 cause a syndromic form of cerebellar atrophy and lysosome-autophagosome dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: features approximating mucopolysaccharidosis or other lysosomal storage disorders
    explanation: The primary cohort explicitly identifies this clinical resemblance.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: Population prevalence is unknown. Published series are small and partly overlapping; historical literature counts differ between reports and cannot be added to estimate the total number of affected people.
  evidence:
  - reference: PMID:35195341
    reference_title: Autosomal recessive spinocerebellar ataxia-20 due to a novel SNX14 variant in an Indian girl.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Autosomal recessive spinocerebellar ataxia-20 is a rare disorder having distinctive coarse facies in addition to intellectual disability and cerebellar ataxia, with less than 35 cases reported worldwide.
    explanation: This paper reports a historical count below 35, whereas the 2018 study already cited at least 45 individuals. The discrepancy prevents treating this statement as a reliable worldwide census.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5961352/

    label: autosomal recessive spinocerebellar ataxia 20
description: 'SCAR20 is an autosomal recessive neurodevelopmental and neurodegenerative disorder caused by biallelic pathogenic SNX14 variants. Its core includes early developmental delay or intellectual disability, limited speech, hypotonia, ataxia and progressive cerebellar atrophy, often with coarse facial features and relative macrocephaly. Hearing impairment, seizures, skeletal abnormalities and hyperkinetic movements vary between families. MRI can be normal early in childhood. Human autopsy and experimental models establish Purkinje-cell vulnerability. SNX14 participates in ER-associated lipid homeostasis and organelle interactions; proposed disease mechanisms include disturbed lipid handling and spastin-dependent axonal transport. Autophagy findings depend on the experimental system: patient neural progenitors showed slower autophagosome clearance, whereas other patient fibroblasts and engineered HEK293 cells retained autolysosome formation. A universal block of autophagosome-lysosome fusion is not established.'
inheritance:
- name: Autosomal recessive inheritance
  description: 'SCAR20 is inherited in an autosomal recessive manner. It was first defined in consanguineous families with affected individuals homozygous for loss-of-function SNX14 variants; a non-consanguineous family with compound heterozygous variants has since been reported. Unaffected parents are heterozygous carriers.

    '
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:25439728
    reference_title: Mutations in SNX14 cause a distinctive autosomal-recessive cerebellar ataxia and intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we report the identification of causal mutations in Sorting Nexin 14 (SNX14) found in seven affected individuals from three unrelated consanguineous families who presented with recessively inherited moderate-severe intellectual disability, cerebellar ataxia, early-onset cerebellar atrophy, sensorineural hearing loss, and the distinctive association of progressively coarsening facial features, relative macrocephaly, and the absence of seizures.
    explanation: Establishes autosomal recessive inheritance across three unrelated consanguineous families with biallelic SNX14 mutations.
  - reference: PMID:33193593
    reference_title: Two Compound Heterozygous Variants in SNX14 Cause Stereotypies and Dystonia in Autosomal Recessive Spinocerebellar Ataxia 20.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we describe the first non-consanguineous SCAR20 family, the second Portuguese, with two siblings presenting similar clinical features caused by compound heterozygous SNX14 variants
    explanation: Documents compound heterozygous inheritance in the first non-consanguineous SCAR20 family, confirming the recessive mechanism outside consanguineous pedigrees.
pathophysiology:
- name: Aberrant SNX14 Splicing
  biological_scale: MOLECULAR
  description: 'Specific intronic or structural alleles produce abnormal SNX14 transcripts, including pseudoexon inclusion, exon extension and multiexon loss. Patient RNA assays establish the splice products, while their frameshifts predict impaired protein function. Residual normal transcript is allele dependent: it was detected for c.462-589A>G but not for c.867+288A>G in the respective assayed samples. Nonsense-mediated decay is plausible for reduced RNA but was not directly established by these diagnostic studies.'

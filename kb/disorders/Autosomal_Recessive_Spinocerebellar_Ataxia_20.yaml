- name: SNX14 Loss of Function
  biological_scale: MOLECULAR
  description: Biallelic pathogenic variants reduce normal SNX14 function. Many truncating or deletion alleles eliminate detectable protein, but the PX-domain in-frame deletion p.Ala603_Gly632del produces a shortened protein with preserved ER association and a normal response to Torin1 in the tested fibroblasts. Protein abundance, localization and individual cellular functions therefore depend on the allele and assay.

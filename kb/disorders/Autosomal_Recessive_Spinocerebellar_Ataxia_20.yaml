    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: Embryonic-lethal deletion prevents assessment of postnatal Purkinje degeneration.
    limitations: This is failure to model the postnatal endpoint, not evidence that SNX14 is dispensable in Purkinje cells.

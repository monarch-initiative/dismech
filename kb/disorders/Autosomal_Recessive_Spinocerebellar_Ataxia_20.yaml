animal_models:
- name: Hungarian Vizsla cerebellar cortical degeneration (natural SNX14 model)
  species: Dog
  genotype: Homozygous canine SNX14 c.2653+1G>A (CanFam3.1 chr12:45,530,566); p.Gly885Aspfs*16 predicted from aberrant RNA
  background: Hungarian Vizsla
  publication: PMID:27566131
  description: Two Hungarian Vizsla littermates developed rapidly progressive cerebellar ataxia at two to three months. Both had extensive Purkinje-cell loss, secondary granule-layer depletion and gliosis, with relative caudoventral sparing. MRI in one dog showed mild cerebellar changes. Cerebellar RNA from one case demonstrated a 275-base extension of exon 26; Western blot with an antibody targeting sequence upstream of the splice defect detected neither full-length nor shortened SNX14. The allele is strongly supported as causal, but parental genotypes were unavailable. The dogs were euthanized young, limiting assessment of later manifestations.
  evidence:
  - reference: PMID:27566131
    reference_title: Genome sequencing reveals a splice donor site mutation in the SNX14 gene associated with a novel cerebellar cortical degeneration in the Hungarian Vizsla dog breed.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Whole genome sequencing was used to successfully identify a disease-associated splice donor site variant in the sorting nexin 14 gene (SNX14) as a strong causative candidate.
    explanation: Establishes a naturally occurring SNX14 loss-of-function canine model of cerebellar cortical degeneration.
  - reference: PMID:27566131
    reference_title: Genome sequencing reveals a splice donor site mutation in the SNX14 gene associated with a novel cerebellar cortical degeneration in the Hungarian Vizsla dog breed.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Western blot analysis using an antibody targeting an amino acid sequence before the splice variant, failed to identify SNX14 protein (either full length or reduced) in cerebellum tissue of the CCD case
    explanation: The antibody epitope was upstream of the splice defect, supporting loss of detectable protein rather than loss of the epitope alone.
  modeled_mechanisms:
  - target: Cerebellar Purkinje Cell Neurodegeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Spontaneous, early-onset progressive cerebellar ataxia with primary Purkinje-neuron loss and cerebellar atrophy, driven by SNX14 loss of function as in human SCAR20.
    limitations: Two juvenile siblings with a rapid course and early euthanasia. No distinctive facial differences were seen. Hearing appeared normal on examination, but auditory electrophysiology was not performed; cognition was difficult to assess and later manifestations could not be excluded. The model therefore does not establish absence of the human syndromic features.
    readouts:
    - name: Cerebellar Purkinje neuron content
      target: Cerebellar Purkinje Cell Neurodegeneration
      description: Cerebellar histopathology in affected Vizsla puppies.
      direction: DECREASED
      interpretation: Primary Purkinje-neuron loss is the structural correlate of the degeneration node in this natural model.
      evidence:
      - reference: PMID:27566131
        reference_title: Genome sequencing reveals a splice donor site mutation in the SNX14 gene associated with a novel cerebellar cortical degeneration in the Hungarian Vizsla dog breed.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Histopathological examination revealed primary Purkinje neuron loss consistent with CCD.
        explanation: Documents the primary Purkinje-neuron loss underlying the model's ataxia.
    evidence:
    - reference: PMID:27566131
      reference_title: Genome sequencing reveals a splice donor site mutation in the SNX14 gene associated with a novel cerebellar cortical degeneration in the Hungarian Vizsla dog breed.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Two full-sibling Hungarian Vizsla puppies from a litter of nine presented with a history of progressive ataxia, starting around three months of age.
      explanation: Supports treating the Vizsla CCD as an informative natural model of the cerebellar-degeneration node.
- name: Neural conditional Snx14 deletion (Nestin-Cre)
  species: Mouse
  genotype: Snx14 floxed exons 9-12; Nestin-Cre; homozygous conditional deletion in neurons and glia
  publication: PMID:34691693
  description: Neural conditional deletion bypasses the embryonic lethality of constitutive deletion of exons 9-12. Mice are viable and fertile, with motor deficits from one month, axonal swelling before overt cell loss, and progressive Purkinje-cell degeneration at two to three months. Spastin protein and cerebellar respiration are reduced. Valproate treatment from postnatal day 25 partially rescues motor, histological and bioenergetic endpoints. This is distinct from the viable exon-14 frameshift model used for the 2024 lipid study.
  evidence:
  - reference: PMID:34691693
    reference_title: SNX14 deficiency-induced defective axonal mitochondrial transport in Purkinje cells underlies cerebellar ataxia and can be reversed by valproate.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: we generated a conditional Snx14-knockout mouse model in neurons and glia by crossing Snx14f/f mice with a Nestin-Cre line.
    explanation: The Cre driver defines the neural conditional model.
  modeled_mechanisms:
  - target: Cerebellar Purkinje Cell Neurodegeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Progressive Purkinje-cell loss and motor impairment; axonopathy precedes overt loss.
    limitations: Neural conditional deletion does not reproduce all systemic human features; rescue remains preclinical.
    evidence:
    - reference: PMID:34691693
      reference_title: SNX14 deficiency-induced defective axonal mitochondrial transport in Purkinje cells underlies cerebellar ataxia and can be reversed by valproate.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: we generated a conditional Snx14-knockout mouse model in neurons and glia by crossing Snx14f/f mice with a Nestin-Cre line.
      explanation: The Cre driver defines the neural conditional model.
  - target: Reduced Cerebellar Mitochondrial Respiration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Cerebellar ATP and respiration assays show impaired bioenergetics.
    limitations: Whole-tissue respiration does not isolate Purkinje cells from other cerebellar cell types.
    evidence:
    - reference: PMID:34691693
      reference_title: SNX14 deficiency-induced defective axonal mitochondrial transport in Purkinje cells underlies cerebellar ataxia and can be reversed by valproate.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: These results indicate that Snx14 deficiency impairs mitochondrial respiration in the cerebellum.
      explanation: FluoRespirometry and ATP measurements support impaired cerebellar bioenergetics.
- name: Purkinje-specific Snx14 deletion (Pcp2-Cre)
  species: Mouse
  genotype: Snx14 floxed exons 9-12; Pcp2-Cre
  publication: PMID:34691693
  description: Purkinje-specific deletion causes progressive Purkinje-cell loss, axonal swelling and motor deficits emerging at three to four months, supporting a cell-autonomous requirement for SNX14. Female animals showed greater severity. In contrast, Olig1-Cre deletion caused hypomyelination and mild Purkinje-cell loss without motor impairment through six months; this comparison limits attributing the full syndrome to oligodendrocytes alone.
  evidence:
  - reference: PMID:34691693
    reference_title: SNX14 deficiency-induced defective axonal mitochondrial transport in Purkinje cells underlies cerebellar ataxia and can be reversed by valproate.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: male and female Snx14f/f; Pcp2-Cre mice exhibited a progressive loss of Purkinje cells with age
    explanation: The cell-specific perturbation supports intrinsic Purkinje vulnerability.
  modeled_mechanisms:
  - target: Cerebellar Purkinje Cell Neurodegeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Cell-restricted deletion reproduces progressive cell loss.
    limitations: Cre timing and species differences limit transfer to congenital human disease.
    evidence:
    - reference: PMID:34691693
      reference_title: SNX14 deficiency-induced defective axonal mitochondrial transport in Purkinje cells underlies cerebellar ataxia and can be reversed by valproate.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: male and female Snx14f/f; Pcp2-Cre mice exhibited a progressive loss of Purkinje cells with age
      explanation: The cell-specific perturbation supports intrinsic Purkinje vulnerability.
- name: Viable constitutive Snx14 exon-14 frameshift mouse
  species: Mouse
  genotype: Homozygous Snx14 c.1432delG; p.Glu478Argfs*18
  background: C57BL/6J
  publication: PMID:38625743
  description: A subset of homozygotes survives to adulthood despite absent detectable SNX14; birth frequency is 9.9% rather than the Mendelian expectation of 25%. Adults have growth and facial abnormalities, mild gait changes, impaired complex motor tasks and social-memory deficits despite preserved social preference. Purkinje-cell loss appears earlier in anterior lobes than posterior lobes. Forebrain neuronal content is preserved, but cortical synaptic markers and phosphatidylethanolamines are reduced. Predegenerative cerebella accumulate acylcarnitines and show regional triglyceride reductions by MALDI imaging; bulk brain triglycerides were below detection in the separate LC-MS assay.
  evidence:
  - reference: PMID:38625743
    reference_title: Altered lipid homeostasis is associated with cerebellar neurodegeneration in SNX14 deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: we successfully generated SNX14-deficient mice (Snx14-KO) that are viable and thrive despite a complete loss of SNX14 protein
    explanation: A constitutive frameshift model differs from earlier embryonic-lethal deletions.
  - reference: PMID:38625743
    reference_title: Altered lipid homeostasis is associated with cerebellar neurodegeneration in SNX14 deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We demonstrate that cerebellar Purkinje cells (PCs) are selectively vulnerable to SNX14 deficiency while forebrain regions preserve their neuronal content.
    explanation: Shows the selective cerebellar Purkinje-cell vulnerability in a SNX14-deficient mouse model.
  modeled_mechanisms:
  - target: Cerebellar Purkinje Cell Neurodegeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Age- and region-dependent Purkinje loss with preserved forebrain neuron counts.
    limitations: Cognitive abnormalities need not reflect forebrain cell death; normal home-cage walking understates deficits on complex tasks.
    evidence:
    - reference: PMID:38625743
      reference_title: Altered lipid homeostasis is associated with cerebellar neurodegeneration in SNX14 deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We demonstrate that cerebellar Purkinje cells (PCs) are selectively vulnerable to SNX14 deficiency while forebrain regions preserve their neuronal content.
      explanation: Shows the selective cerebellar Purkinje-cell vulnerability in a SNX14-deficient mouse model.
  - target: Lysosomal Enlargement
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Predegenerative Purkinje cells contain fewer, enlarged telolysosomes.
    limitations: Ultrastructure measures organelle morphology, not autophagic flux.
    evidence:
    - reference: PMID:38625743
      reference_title: Altered lipid homeostasis is associated with cerebellar neurodegeneration in SNX14 deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Snx14-KO PCs have less and larger telolysosomes
      explanation: TEM demonstrates altered lipid-rich lysosomal storage organelles before overt degeneration.
  - target: Cerebellar Acylcarnitine Accumulation
    relationship: RECAPITULATES
    fidelity: LOW
    description: Predegenerative cerebellar lipidomics measures this change.
    limitations: Whole-tissue or regional mouse measurements; the corresponding human cell-specific lipid phenotype has not been established.
    evidence:
    - reference: PMID:38625743
      reference_title: Altered lipid homeostasis is associated with cerebellar neurodegeneration in SNX14 deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: This accounted for the majority of AcCa-s detected in cerebella (6 out of 8) and resulted in an overall increase of total AcCa concentration in Snx14-KO cerebella.
      explanation: Direct mouse lipidomic observation; clinical and cell-specific implications remain provisional.
  - target: Regional Cerebellar Triglyceride Depletion
    relationship: RECAPITULATES
    fidelity: LOW
    description: Predegenerative cerebellar lipidomics measures this change.
    limitations: Whole-tissue or regional mouse measurements; the corresponding human cell-specific lipid phenotype has not been established.
    evidence:
    - reference: PMID:38625743
      reference_title: Altered lipid homeostasis is associated with cerebellar neurodegeneration in SNX14 deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 2 TGs were reduced in Snx14-KO cerebella, 1 of which (TG 53:2) is specific to the outermost layer of the cerebellar cortex comprised by PC soma and dendrites
      explanation: Direct mouse lipidomic observation; clinical and cell-specific implications remain provisional.
- name: Constitutive Snx14 exon-3 deletion mouse
  species: Mouse
  genotype: Homozygous exon-3 deletion; 571 bp deletion on C57BL/6J or 585 bp deletion on C57BL/6N
  publication: PMID:32792680
  description: Both exon-3 deletion lines show midgestation lethality with growth retardation, reduced placental labyrinth and deficient syncytiotrophoblast differentiation. These lines cannot model postnatal ataxia, and their lethality should not be generalized to every Snx14 mouse allele or human SNX14 deficiency.
  evidence:
  - reference: PMID:32792680
    reference_title: Diverse species-specific phenotypic consequences of loss of function sorting nexin 14 mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: loss of SNX14 in mice, which resulted in embryonic lethality around mid-gestation due to placental pathology that involves severe disruption to syncytiotrophoblast cell differentiation.
    explanation: This early developmental phenotype limits postnatal disease modeling.
  modeled_mechanisms:

histopathology:
- name: Purkinje-cell depletion and Bergmann gliosis
  description: Autopsy of one affected individual showed near absence of Purkinje cells, with ectopic atrophic residual neurons and prominent Bergmann gliosis. This is human neuropathology, not a routine diagnostic biopsy finding.
  evidence:
  - reference: PMID:25848753
    reference_title: Biallelic mutations in SNX14 cause a syndromic form of cerebellar atrophy and lysosome-autophagosome dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The few Purkinje cells remaining were ectopically located and atrophic with enlarged apical neurites. Bergmann gliosis was prominent in the depopulated Purkinje cell layer
    explanation: Direct microscopic observation in one deceased patient.
- name: Spinal axonal spheroids containing membranous material
  description: Ultrastructural examination of human spinal cord showed spheroids with membranous structures resembling storage material. This resemblance does not establish a specific lysosomal enzyme deficiency.
  evidence:
  - reference: PMID:25848753
    reference_title: Biallelic mutations in SNX14 cause a syndromic form of cerebellar atrophy and lysosome-autophagosome dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: ultrastructural analysis of spinal cord tissue found axonal spheroids filled with membranous structures reminiscent of cytoplasmic membranous bodies in LSDs
    explanation: Direct human tissue observation; diagnostic specificity is limited.
discussions:
- discussion_id: scar20-systemic-mechanisms
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which SNX14-dependent processes connect the cellular defects to hearing impairment, facial and skeletal findings, macroglossia and organ enlargement?
  rationale: These clinical manifestations are documented, but the available cellular and mouse studies do not establish their individual causal pathways. The syndromic resemblance to lysosomal storage disorders does not by itself prove a storage-enzyme mechanism.
  attaches_to:
  - phenotypes#Sensorineural hearing impairment
  - phenotypes#Coarse facial features
  - phenotypes#Macroglossia
  - phenotypes#Hepatosplenomegaly
  - phenotypes#Hip dysplasia
- discussion_id: scar20-neural-translation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: How do the lipid, axonal-transport and cortical electrophysiology phenotypes combine in human neurons to cause developmental disability and degeneration?
  rationale: Patient-derived neural progenitors, non-neural cell lines and mouse neurons show different autophagy, lipid and physiological phenotypes. Evidence for one assay or allele cannot establish a universal pathway. In particular, the cause of seizures, dystonia and stereotypies remains unresolved. Adult mouse cognition and acute cortical electrophysiology do not by themselves establish the developmental and speech pathways in people.
  attaches_to:
  - pathophysiology#Reduced Cortical Synaptic Transmission
  - pathophysiology#Cerebellar Acylcarnitine Accumulation
  - phenotypes#Seizures
  - phenotypes#Dystonia
  - phenotypes#Motor stereotypy
  - phenotypes#Global developmental delay
  - phenotypes#Delayed speech and language development
  evidence:
  - reference: PMID:24859318
    reference_title: Snx14 regulates neuronal excitability, promotes synaptic transmission, and is imprinted in the brain of mice.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: future investigations are needed to distinguish the primary consequences of SNX14 loss from secondary, perhaps homeostatic, consequences.
    explanation: The primary electrophysiology study explicitly leaves causal ordering unresolved.
- discussion_id: scar20-ferroptosis
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  prompt: Does lipid stress trigger ferroptosis in SNX14-deficient Purkinje cells?
  rationale: The 2024 mouse study links lipid abnormalities and ferroptosis-associated transcript changes, but does not demonstrate ferroptotic death or rescue with a selective ferroptosis intervention. This remains a hypothesis rather than an established cell-death node.
  attaches_to:
  - pathophysiology#Cerebellar Purkinje Cell Neurodegeneration
  evidence:
  - reference: PMID:38625743
    reference_title: Altered lipid homeostasis is associated with cerebellar neurodegeneration in SNX14 deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: These data suggest an exciting hypothesis implicating lipotoxicity-induced ferroptosis as a pathogenic mechanism of cerebellar degeneration in SCAR20 that warrants future investigation.
    explanation: The authors explicitly present ferroptosis as a hypothesis.

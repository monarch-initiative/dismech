      explanation: U2OS rescue after palmitate challenge supports an experimental target, not an established treatment.
  - target: Impaired Saturated Fatty Acid Processing
    treatment_effect: RESTORES
    description: The excess free-fatty-acid pool is reduced in engineered cells.
    evidence:
    - reference: PMID:33310904

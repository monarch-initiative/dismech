- name: Maternal-zygotic snx14 F55* zebrafish
  species: Zebrafish
  genotype: Homozygous ENU-induced snx14 sa18413 (F55*), including maternal-zygotic mutants
  publication: PMID:32792680
  description: Genetic mutants are viable and fertile, with normal larval head and eye dimensions, gross neural anatomy and baseline locomotor metrics under the tested conditions. Whole-larval fatty acids in neutral-lipid and phospholipid fractions are increased. Protein loss could not be directly confirmed because a suitable antibody was unavailable. These results challenge simple transfer of the earlier morpholino-associated neural-loss phenotype to stable genetic mutants.
  evidence:
  - reference: PMID:32792680
    reference_title: Diverse species-specific phenotypic consequences of loss of function sorting nexin 14 mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: zebrafish carrying a homozygous, maternal zygotic snx14 genetic loss-of-function mutation were both viable and anatomically normal.
    explanation: The stable genetic model differs from the earlier morpholino model.
  modeled_mechanisms:
  - target: Cerebellar Purkinje Cell Neurodegeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: No corresponding gross larval neural-loss phenotype was detected.
    limitations: No direct adult Purkinje-cell count was supplied; subtle or later phenotypes remain possible, and loss of protein was predicted rather than demonstrated.

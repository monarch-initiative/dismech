genetic:
- name: SNX14
  notes: Biallelic pathogenic SNX14 variants cause SCAR20. The allelic spectrum includes coding truncations, canonical splice variants, in-frame deletions, complex structural alleles and RNA-confirmed intronic splice defects. Functional consequences depend on the allele and assay. Recurrent alleles do not by themselves establish a founder effect. A reported p.Gln915Leu missense allele remains a VUS in its primary study and is not equivalent to a confirmed pathogenic allele.
  gene_term:
    preferred_term: SNX14
    term:
      id: hgnc:14977
      label: SNX14
  relationship_type: CAUSATIVE
  variants:
  - name: SNX14 c.647_648del (p.Glu216ValfsX24)
    description: Recurrent frameshift allele detected in seven patients in a 17-patient Omani series. The available abstract establishes recurrence but does not demonstrate a founder haplotype.
    type: frameshift
    clinical_significance: PATHOGENIC
    regulatory_category: LOF
    evidence:
    - reference: PMID:41294032
      reference_title: 'Exploring the Genetic Variations Underlying SNX14-Linked Autosomal Recessive Spinocerebellar Ataxia Type 20: A Case Series of 17 Patients From a Single Center in the Omani Population and Review of Literature.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The most common variant was SNX14 c.647_648del (p.Glu216Valfs24), identified in seven patients.
      explanation: Identifies the recurrent frameshift allele; recurrence alone does not establish a founder effect.
    variant_type: deletion
    genomic_contexts:
    - coding sequence
  - name: SNX14 NM_001350532.1:c.1195C>T (p.Arg399Ter)
    description: Pathogenic nonsense allele inherited from the mother in the 2020 Portuguese family, in trans with a paternally inherited complex SNX14 rearrangement. The two alleles are distinct lesions, not one complex variant.
    type: nonsense
    variant_type: single nucleotide variant
    genomic_contexts:
    - coding sequence
    evidence:
    - reference: PMID:33193593

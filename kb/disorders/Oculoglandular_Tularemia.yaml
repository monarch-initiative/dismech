  evidence:
  - reference: PMID:38941282
    reference_title: "Francisella tularensis Infection Causing Parinaud Oculoglandular Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CASE REPORT We present the case of a 66-year-old man with granulomatous
      conjunctivitis and ipsilateral preauricular, submandibular, and upper
      cervical lymphadenopathies following a superficial corneal injury.
    explanation: >-
      Documents granulomatous conjunctival inflammation in confirmed
      oculoglandular tularemia.
- name: Suppurative lymphadenitis
  category: Complication
  phenotype_term:
    preferred_term: Suppurative lymphadenitis
    term:
      id: HP:0002840
      label: Lymphadenitis
  description: >-
    Regional lymph nodes can suppurate after delayed or ineffective therapy and
    require procedural drainage.
  evidence:
  - reference: PMID:38941282
    reference_title: "Francisella tularensis Infection Causing Parinaud Oculoglandular Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the systematic amoxicillin/clavulanic acid and metronidazole
      antibiotic therapy started immediately at admission, the suppuration of the
      lymph nodes required surgical drainage.
    explanation: >-
      Documents suppurating regional nodes requiring drainage in a confirmed
      oculoglandular tularemia case.
- name: Fever
  category: Constitutional
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The disease has an acute onset, with the occurrence of fever (38-40 C),
      chills, fatigue, generalized myalgia, and headaches, resembling flu.
    explanation: >-
      Supports fever as part of acute tularemia, including its oculoglandular
      form.
treatments:
- name: Antibiotic therapy
  description: >-
    Aminoglycosides, fluoroquinolones, and tetracyclines are active treatment
    classes for tularemia across clinical manifestations.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:38294108
    reference_title: "Systematic Review: Clinical Features, Antimicrobial Treatment, and Outcomes of Human Tularemia, 1993-2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Aminoglycosides, fluoroquinolones, and tetracyclines are effective
      antimicrobials for treatment of tularemia, regardless of clinical manifestation.
    explanation: >-
      Systematic review of case-level human tularemia data identifies several
      effective antibiotic classes across manifestations.
  - reference: PMID:38294116
    reference_title: "Antimicrobial Susceptibility of Francisella tularensis Isolates in the United States, 2009-2018."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We tested the susceptibility of 278 F. tularensis isolates from the United
      States received during 2009-2018 to 8 antimicrobial drugs (ciprofloxacin,
      levofloxacin, doxycycline, tetracycline, gentamicin, streptomycin,
      chloramphenicol, and erythromycin). All isolates were susceptible to all
      tested drugs.
    explanation: >-
      Antimicrobial susceptibility testing supports activity of first-line
      tularemia antibiotics against F. tularensis isolates.
  - reference: PMID:38941282
    reference_title: "Francisella tularensis Infection Causing Parinaud Oculoglandular Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Empiric fluoroquinolone (ciprofloxacin) or aminoglycoside (gentamicin or
      streptomycin) antibiotic therapy should be started immediately at the
      slightest suspicion of oculoglandular tularemia.
    explanation: >-
      Supports prompt fluoroquinolone or aminoglycoside therapy for the
      oculoglandular form specifically.
- name: Lymph-node incision and drainage
  description: >-
    Procedural drainage provides source control when oculoglandular tularemia
    progresses to suppurating regional lymphadenitis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Incision and Drainage
    term:
      id: NCIT:C38067
      label: Incision and Drainage
  evidence:
  - reference: PMID:38941282
    reference_title: "Francisella tularensis Infection Causing Parinaud Oculoglandular Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the systematic amoxicillin/clavulanic acid and metronidazole
      antibiotic therapy started immediately at admission, the suppuration of the
      lymph nodes required surgical drainage.
    explanation: >-
      Documents surgical drainage as source control for oculoglandular tularemia
      with suppurative regional lymphadenitis.
transmission:
- name: Conjunctival Exposure
  description: >-
    Ocular inoculation of Francisella through conjunctival exposure produces the
    oculoglandular form of tularemia.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      oculo-glandular form as a result of conjunctival infection
    explanation: >-
      Supports conjunctival infection as the defining exposure route for
      oculoglandular tularemia.
prevalence:
- population: Missouri reported tularemia cases, 2000-2007
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Oculoglandular tularemia accounted for 3% of 121 reviewed Missouri tularemia
    cases reported from 2000 through 2007.
  evidence:
  - reference: PMID:22911645
    reference_title: "Clinical recognition and management of tularemia in Missouri: a retrospective records review of 121 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients presented with ulceroglandular (37%) and glandular (25%)
      forms of tularemia, followed by pneumonic (12%), typhoidal (10%),
      oculoglandular (3%), and oropharyngeal (2%) forms.
    explanation: >-
      Quantifies the oculoglandular form among reviewed reported tularemia cases
      in Missouri.
progression:
- phase: Incubation after Francisella tularensis exposure
  incubation_days: 1-9
  notes: >-
    A Missouri tularemia case series reported median incubation of 3 days, with a
    range from 1 to 9 days.
  evidence:
  - reference: PMID:22911645
    reference_title: "Clinical recognition and management of tularemia in Missouri: a retrospective records review of 121 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median incubation period was 3 days (range, 1-9 days), and patients sought
      care after a median of 3 days of illness (range, 0-44 days).
    explanation: >-
      Supports an acute tularemia incubation interval from a human case series
      that included oculoglandular tularemia.
diagnosis:
- name: Francisella microagglutination serology
  description: >-
    Microagglutination serology confirms oculoglandular tularemia when titers
    reach a diagnostic threshold or rise fourfold across paired acute and
    convalescent sera.
  diagnosis_term:
    preferred_term: Diagnostic Serology Testing
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  evidence:
  - reference: PMID:38941282
    reference_title: "Francisella tularensis Infection Causing Parinaud Oculoglandular Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Titers of ≥1: 160 within 2–3 weeks after the onset of symptoms or a 4-fold
      increase in microagglutination test titers over a 2-week interval (between
      acute and convalescent sera) are considered diagnostic of tularemia [12].
    explanation: >-
      States the microagglutination threshold and paired-serum rule used to
      confirm oculoglandular tularemia.
- name: Francisella PCR on ocular, node, or tissue specimens
  description: >-
    Francisella-specific PCR on conjunctival swabs, lymph-node aspirates, or
    biopsy tissue can confirm oculoglandular tularemia earlier than serology.
  diagnosis_term:
    preferred_term: Polymerase Chain Reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:38941282
    reference_title: "Francisella tularensis Infection Causing Parinaud Oculoglandular Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      As an alternative or a supplement to serology, polymerase chain reaction
      (PCR) specific to the 16S rRNA or the tul4 and fopA bacterial genes is
      suggested.
    explanation: >-
      Identifies PCR for Francisella targets as a molecular confirmation route
      for oculoglandular tularemia.
animal_models:
- name: Francisella novicida zebrafish embryo infection
  species: Zebrafish
  genotype: Wild-type zebrafish embryo
  publication: PMID:24614659
  description: >-
    F. tularensis subsp. novicida infection in zebrafish embryos models
    macrophage uptake and granuloma-like aggregate formation by a Francisella
    strain rather than conjunctival inoculation by F. tularensis.
  evidence:
  - &zebrafish_francisella
    reference: PMID:24614659
    reference_title: Establishment of three Francisella infections in zebrafish embryos at different temperatures.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      All three strains entered preferentially into macrophages, which eventually
      assembled into granuloma-like structures.
    explanation: >-
      Supports zebrafish embryos as an in vivo Francisella infection model that
      recapitulates macrophage entry and granuloma-like structures.
  modeled_mechanisms:
  - target: Macrophage Phagosomal Escape and Cytosolic Replication
    relationship: PARTIALLY_RECAPITULATES
    model_scale: ORGANISM
    description: >-
      The zebrafish embryo assay follows Francisella infection in macrophages
      within a living vertebrate host.
    limitations: >-
      The experiment uses F. tularensis subsp. novicida and does not model
      conjunctival entry or oculoglandular regional lymphadenitis.
    evidence:
    - *zebrafish_francisella

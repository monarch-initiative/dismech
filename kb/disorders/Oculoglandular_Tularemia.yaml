name: Oculoglandular Tularemia
creation_date: "2026-09-25T15:55:42Z"
category: Infectious Disease
description: >-
  Oculoglandular tularemia is the ocular and regional-lymph-node form of
  Francisella tularensis infection: conjunctival inoculation introduces the
  intracellular bacterium at the eye surface, macrophage phagosomal escape and
  cytosolic replication amplify infection, and local inflammation produces
  conjunctivitis with ipsilateral draining lymphadenopathy.
disease_term:
  preferred_term: oculoglandular tularemia
  term:
    id: MONDO:0001665
    label: oculoglandular tularemia
parents:
- Tularemia
synonyms:
- Ocular tularemia
- Parinaud oculoglandular syndrome due to tularemia
notes: >-
  Lump/split decision: oculoglandular tularemia is kept as a standalone entry
  because MONDO assigns it a distinct term (MONDO:0001665) and this entry curates
  the conjunctival-inoculation route, Parinaud oculoglandular phenotype,
  oculoglandular diagnostic workup, and suppurative-node source-control claims
  that the Tularemia parent does not carry. The Tularemia entry's Oculoglandular
  subtype row cross-references this entry.
infectious_agent:
- name: Francisella tularensis
  infectious_agent_term:
    preferred_term: Francisella tularensis
    term:
      id: NCBITaxon:263
      label: Francisella tularensis
  description: >-
    Intracellular Gram-negative coccobacillus that causes tularemia, including its
    oculoglandular form.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tularemia caused by Gram-negative, coccobacillus bacterium, Francisella
      tularensis, is a highly infectious zoonotic disease.
    explanation: >-
      Identifies F. tularensis as the Gram-negative bacterium that causes tularemia.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:37916743
      reference_title: "Tularemia - a re-emerging disease with growing concern."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Tularemia caused by Gram-negative, coccobacillus bacterium, Francisella
        tularensis, is a highly infectious zoonotic disease.
      explanation: >-
        Oculoglandular tularemia is a bacterial infectious form of tularemia.
pathophysiology:
- name: Conjunctival Francisella tularensis Exposure
  description: >-
    F. tularensis is inoculated across the conjunctiva, establishing the ocular
    portal of entry that defines oculoglandular tularemia.
  biological_scale: TISSUE
  locations:
  - preferred_term: conjunctiva
    term:
      id: UBERON:0001811
      label: conjunctiva
  downstream:
  - target: Macrophage Phagosomal Escape and Cytosolic Replication
    causal_link_type: DIRECT
    description: >-
      F. tularensis enters macrophages and establishes an intracellular cytosolic
      niche after conjunctival inoculation.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      oculo-glandular form as a result of conjunctival infection
    explanation: >-
      Supports conjunctival infection as the route leading to the oculoglandular
      form of tularemia.
- name: Macrophage Phagosomal Escape and Cytosolic Replication
  description: >-
    F. tularensis uses its Francisella Pathogenicity Island-encoded type VI
    secretion system to escape the macrophage phagosome and replicate in the
    cytosol.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: symbiont-mediated suppression of host phagosome maturation
    term:
      id: GO:0141158
      label: symbiont-mediated suppression of host phagosome maturation
  downstream:
  - target: Ocular and Regional Lymph Node Inflammation
    causal_link_type: DIRECT
    description: >-
      Intracellular Francisella replication triggers innate inflammatory injury in
      ocular tissue and the draining lymphatic basin.
  evidence:
  - reference: PMID:37941380
    reference_title: "Pathogenicity and virulence of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The main virulence attribute of F. tularensis is the type 6 secretion system
      (T6SS) and its effectors that promote escape from the phagosome.
    explanation: >-
      Identifies the T6SS-mediated phagosomal escape machinery that permits
      Francisella intracellular replication.
- name: Ocular and Regional Lymph Node Inflammation
  description: >-
    Cytosolic infection is sensed by macrophage inflammatory pathways, producing
    conjunctival inflammation at the eye and lymphadenopathy in the draining
    regional lymph nodes.
  biological_scale: TISSUE
  locations:
  - preferred_term: conjunctiva
    term:
      id: UBERON:0001811
      label: conjunctiva
  - preferred_term: lymph node
    term:
      id: UBERON:0000029
      label: lymph node
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: inflammasome-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0141084
      label: inflammasome-mediated signaling pathway
  downstream:
  - target: Conjunctivitis
    causal_link_type: DIRECT
    description: >-
      Local ocular Francisella infection manifests clinically as conjunctivitis.
  - target: Lymphadenopathy
    causal_link_type: DIRECT
    description: >-
      Inflammation in the regional draining basin produces enlarged lymph nodes.
  - target: Granulomatous conjunctival inflammation
    causal_link_type: DIRECT
    description: >-
      Ocular Francisella infection can produce granulomatous conjunctivitis.
  - target: Suppurative lymphadenitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Regional tularemia lymphadenitis can progress to node suppuration.
  - target: Fever
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The systemic inflammatory response to acute tularemia produces fever.
  evidence:
  - reference: PMID:19863554
    reference_title: "Cell biology and molecular ecology of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      activation of the inflammasome mediated by caspase-1, and a pro-inflammatory
      response
    explanation: >-
      Supports inflammasome activation and pro-inflammatory signaling downstream of
      cytosolic Francisella infection.
phenotypes:
- name: Conjunctivitis
  category: Ophthalmologic
  diagnostic: true
  phenotype_term:
    preferred_term: Conjunctivitis
    term:
      id: HP:0000509
      label: Conjunctivitis
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      oculo-glandular form as a result of conjunctival infection
    explanation: >-
      Oculoglandular tularemia is the conjunctival clinical form of tularemia.
  - reference: PMID:38941282
    reference_title: "Francisella tularensis Infection Causing Parinaud Oculoglandular Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CASE REPORT We present the case of a 66-year-old man with granulomatous
      conjunctivitis and ipsilateral preauricular, submandibular, and upper
      cervical lymphadenopathies following a superficial corneal injury.
    explanation: >-
      Documents granulomatous conjunctivitis in a confirmed oculoglandular
      tularemia case, matching the ocular half of the Parinaud oculoglandular
      presentation.
- name: Lymphadenopathy
  category: Immune
  diagnostic: true
  phenotype_term:
    preferred_term: Lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy
  evidence:
  - reference: PMID:38941282
    reference_title: "Francisella tularensis Infection Causing Parinaud Oculoglandular Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CASE REPORT We present the case of a 66-year-old man with granulomatous
      conjunctivitis and ipsilateral preauricular, submandibular, and upper

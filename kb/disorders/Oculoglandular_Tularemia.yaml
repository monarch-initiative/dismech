    term:
      id: HP:0000509
      label: Conjunctivitis
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      oculo-glandular form as a result of conjunctival infection
    explanation: >-
      Oculoglandular tularemia is the conjunctival clinical form of tularemia.
  - reference: PMID:38941282
    reference_title: "Francisella tularensis Infection Causing Parinaud Oculoglandular Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CASE REPORT We present the case of a 66-year-old man with granulomatous
      conjunctivitis and ipsilateral preauricular, submandibular, and upper
      cervical lymphadenopathies following a superficial corneal injury.
    explanation: >-
      Documents granulomatous conjunctivitis in a confirmed oculoglandular
      tularemia case, matching the ocular half of the Parinaud oculoglandular
      presentation.
- name: Lymphadenopathy
  category: Immune
  diagnostic: true
  phenotype_term:
    preferred_term: Lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy
  evidence:
  - reference: PMID:38941282
    reference_title: "Francisella tularensis Infection Causing Parinaud Oculoglandular Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CASE REPORT We present the case of a 66-year-old man with granulomatous
      conjunctivitis and ipsilateral preauricular, submandibular, and upper
      cervical lymphadenopathies following a superficial corneal injury.
    explanation: >-
      Documents ipsilateral regional lymphadenopathy in a confirmed
      oculoglandular tularemia case.
- name: Fever
  category: Constitutional
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The disease has an acute onset, with the occurrence of fever (38-40 C),
      chills, fatigue, generalized myalgia, and headaches, resembling flu.
    explanation: >-
      Supports fever as part of acute tularemia, including its oculoglandular
      form.
treatments:
- name: Antibiotic therapy
  description: >-
    Aminoglycosides, fluoroquinolones, and tetracyclines are active treatment
    classes for tularemia across clinical manifestations.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:38294108
    reference_title: "Systematic Review: Clinical Features, Antimicrobial Treatment, and Outcomes of Human Tularemia, 1993-2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aminoglycosides, fluoroquinolones, and tetracyclines are effective
      antimicrobials for treatment of tularemia, regardless of clinical manifestation.
    explanation: >-
      Systematic review of case-level human tularemia data identifies several
      effective antibiotic classes across manifestations.
  - reference: PMID:38294116
    reference_title: "Antimicrobial Susceptibility of Francisella tularensis Isolates in the United States, 2009-2018."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We tested the susceptibility of 278 F. tularensis isolates from the United
      States received during 2009-2018 to 8 antimicrobial drugs (ciprofloxacin,
      levofloxacin, doxycycline, tetracycline, gentamicin, streptomycin,
      chloramphenicol, and erythromycin). All isolates were susceptible to all
      tested drugs.
    explanation: >-
      Antimicrobial susceptibility testing supports activity of first-line
      tularemia antibiotics against F. tularensis isolates.
  - reference: PMID:38941282
    reference_title: "Francisella tularensis Infection Causing Parinaud Oculoglandular Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Empiric fluoroquinolone (ciprofloxacin) or aminoglycoside (gentamicin or
      streptomycin) antibiotic therapy should be started immediately at the
      slightest suspicion of oculoglandular tularemia.
    explanation: >-
      Supports prompt fluoroquinolone or aminoglycoside therapy for the
      oculoglandular form specifically.
transmission:
- name: Conjunctival Exposure
  description: >-
    Ocular inoculation of Francisella through conjunctival exposure produces the
    oculoglandular form of tularemia.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      oculo-glandular form as a result of conjunctival infection
    explanation: >-
      Supports conjunctival infection as the defining exposure route for
      oculoglandular tularemia.

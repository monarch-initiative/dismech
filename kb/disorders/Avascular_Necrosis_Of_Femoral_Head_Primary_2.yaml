    snippet: genetic ablation in mice of Trpv4, a Ca(2+)-permeable channel of the transient receptor potential (TRP) family, increases bone mass by impairing bone resorption
    explanation: 'Establishes that TRPV4 loss of function reduces osteoclast-mediated bone resorption in mice - the inverse experiment to the human gain-of-function variant, so it is graded INDIRECT: it supports a role for TRPV4 in osteoclast resorption without directly showing that the ANFH2 gain-of-function allele increases resorption.'
  - reference: PMID:18762026
    reference_title: TRPV4-mediated calcium influx regulates terminal differentiation of osteoclasts.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: TRPV4-mediated Ca(2+) influx hereby secures intracellular Ca(2+) concentrations, ensures NFATc1-regulated gene transcription, and regulates the terminal differentiation and activity of osteoclasts.
    explanation: Describes the molecular pathway (Ca2+ influx sustaining NFATc1-dependent transcription) by which TRPV4 activity level controls osteoclast terminal differentiation.
  - reference: PMID:22492541
    reference_title: Calcium/calmodulin-signaling supports TRPV4 activation in osteoclasts and regulates bone mass.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: As expected, TRPV4 activation in osteoclasts increased the number of osteoclasts and their resorption activity, thereby resulting in bone loss.
    explanation: Direct gain-of-function animal evidence for the osteoclast pathway using R616Q/V620I substitutions, not the ANFH2 frameshift allele.
    directness: INDIRECT

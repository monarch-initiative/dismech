    explanation: Reproduces the gain-of-function calcium signal in a second, independent cell system (transduced HEK293 cells) expressing only the mutant channel.
- name: Endothelial Calcium Overload
  biological_scale: CELLULAR
  description: Sustained endothelial calcium elevation under mechanical loading is proposed as a link from mutant channel activity to vascular injury. Calcium influx was measured in fibroblasts and HEK293 cells, not in endothelial cells from the ANFH2 family.

differential_diagnoses:
- name: TRPV4-related skeletal dysplasia with osteonecrosis
  description: Hip osteonecrosis may occur within a broader skeletal phenotype. The 2019 p.K801E family had features spanning Kozlowski and Maroteaux phenotypes; computational modeling did not establish a measured channel-function direction.
  distinguishing_features:
  - Short stature, brachydactyly, vertebral and metaphyseal abnormalities favor a broader skeletal dysplasia rather than the isolated founding ANFH2 presentation.
  evidence:
  - reference: PMID:30693671
    reference_title: Protein informatics combined with multiple data sources enriches the clinical characterization of novel TRPV4 variant causing an intermediate skeletal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Both disorders include brachydactyly, platyspondyly, and metaphyseal abnormalities in their phenotypes, signs that were all seen in the proband.
    explanation: Describes the wider skeletal phenotype of the p.K801E proband.
  - reference: PMID:30693671
    reference_title: Protein informatics combined with multiple data sources enriches the clinical characterization of novel TRPV4 variant causing an intermediate skeletal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Due to this conflict of symptoms, we cannot say with confidence whether this TRPV4 variant causes loss of function or gain of function in TRPV4 protein.
    explanation: The paper acknowledges uncertainty despite computational models and proposed mechanisms.
- name: TRPV4-related congenital distal spinal muscular atrophy with skeletal abnormalities
  description: A 2020 family carrying p.Trp785Cys included femoral-head osteonecrosis within a mixed neuromuscular, skeletal and skin phenotype. This expands the TRPV4 spectrum but does not replicate the isolated ANFH2 family or demonstrate gain of function for the new allele.
  distinguishing_features:
  - Congenital distal muscle atrophy and electrophysiologic abnormalities, together with skeletal changes and scaly skin, distinguish the mixed phenotype.
  evidence:
  - reference: PMID:33075594
    reference_title: Novel TRPV4 mutation in a large Chinese family with congenital distal spinal muscular atrophy, skeletal dysplasia and scaly skin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The proband and other four affected family members showed signs of congenital distal spinal muscular atrophy, skeletal abnormalities including osteonecrosis of the femoral head, and scaly skin.
    explanation: Five affected family members had a mixed phenotype; the abstract does not give a per-person osteonecrosis count.
- name: COL2A1-related inherited femoral-head osteonecrosis
  description: Another genetic cause of familial femoral-head osteonecrosis. The founding ANFH2 investigation found no COL2A1 mutation and used segregation to distinguish the TRPV4 allele from other collagen-gene candidates.
  distinguishing_features:
  - Molecular diagnosis identifies the implicated gene; hip imaging alone does not distinguish these inherited forms.
  evidence:
  - reference: PMID:27330106
    reference_title: Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No mutations in COL2A1 were present.
    explanation: COL2A1 was examined and excluded in the founding ANFH2 proband.

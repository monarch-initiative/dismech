    snippet: Together, this could cause Ca2+ overload, leading to endothelial dysfunction and vasoconstriction, resulting in bone loss at the hip.
    explanation: The authors' own proposed causal chain from calcium overload to vasoconstriction to bone loss, offered as a plausible mechanism rather than a directly demonstrated one - graded INDIRECT accordingly.
- name: Vasoconstriction
  biological_scale: TISSUE
  description: Vasoconstriction is a proposed vascular consequence of excess TRPV4 activity in ANFH2. Agonist experiments in isolated mouse aortae and cultured human umbilical-vein endothelial cells support a COX-dependent thromboxane-receptor pathway, but did not test the ANFH2 allele or femoral-head microvessels.
  downstream:
  - target: Femoral Head Ischemia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - trpv4_endothelial_vasoconstriction_hypothesis
  evidence:
  - reference: PMID:25572823
    reference_title: GPCR-mediated EGF receptor transactivation regulates TRPV4 action in the vasculature.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In addition to the well-documented vasorelaxation response triggered by TRPV4 activation, we report here a TRPV4-triggered vasoconstriction in the mouse aorta that involves a COX-generated Tx receptor (TP) agonist that acts in a MAPK and Src kinase signalling dependent manner.
    explanation: Agonist-stimulated mouse aortic contraction supports this candidate pathway indirectly; the disease allele and hip circulation were not tested.
    directness: INDIRECT
- name: Femoral Head Microvascular Thrombosis
  biological_scale: TISSUE
  description: Microvascular thrombosis is discussed as a general feature of non-traumatic osteonecrosis. It was not demonstrated histologically in the ANFH2 family. The authors propose local vascular compromise at the mechanically loaded femoral head as a link between channel dysfunction and osteonecrosis.

phenotypes:
- name: Osteonecrosis of the femoral head
  description: All four affected siblings had bilateral femoral-head osteonecrosis, with collapse, patchy sclerosis and cystic change in the supplementary radiographs. The complete supplementary clinical note documents Steinberg stages III-VI, whereas main Figure 1 depicts only two siblings. Main-text comparison with approximately two-thirds bilateral sporadic disease differs from the supplementary table count of 36/49; neither estimates ANFH2 penetrance. Neurologic and geneticist examinations detailed in the supplement concern III-5 and III-6, with partial skeletal surveys in other participants. Mild scoliosis, short fourth metacarpals and the proband's median neuropathy were considered incidental rather than a generalized TRPV4 skeletal dysplasia or polyneuropathy.
  sequelae:
  - target: Hip pain
  phenotype_term:
    preferred_term: Osteonecrosis of the femoral head
    term:
      id: HP:0005743
      label: Avascular necrosis of the capital femoral epiphysis
    laterality: BILATERAL
  evidence:
  - reference: PMID:27330106
    reference_title: Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: all affected family members had bilateral hip involvement, whereas only two-thirds of the sporadic patients had bilateral disease
    explanation: Documents bilateral femoral head involvement as a feature of the TRPV4-associated (inherited) form, distinguishing it from the sporadic comparison cohort.
  - reference: PMID:27330106
    reference_title: Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head.
    supports: SUPPORT

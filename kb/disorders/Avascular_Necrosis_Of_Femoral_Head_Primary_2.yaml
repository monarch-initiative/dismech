- name: Increased Osteoclast Bone Resorption
  conforms_to: "ischemic_bone_necrosis_and_repair#Resorption-Dominant Revascularization and Creeping Substitution"
  biological_scale: CELLULAR
  description: Increased bone resorption is a proposed contributor to femoral-head structural failure in ANFH2. Trpv4-null mice show reduced resorption, whereas osteoclast-lineage expression of R616Q/V620I on a null background increases osteoclast numbers, resorption and bone loss. Neither model tests the ANFH2 frameshift or demonstrates femoral-head osteonecrosis. The gain-of-function effect in the latter model requires the calmodulin-binding region, limiting extrapolation to the ANFH2 C-terminal allele. The conformance to the module's resorption-dominant repair node rests on the shared outcome of resorption outpacing formation before collapse. The resorption modelled here is a TRPV4 effect intrinsic to the osteoclast lineage, measured in mice, not the revascularization-driven creeping substitution of necrotic bone that the module node describes, so this node is not evidence about the repair phase itself.

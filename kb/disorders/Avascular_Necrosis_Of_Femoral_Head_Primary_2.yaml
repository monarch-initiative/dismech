variants:
- name: TRPV4 c.2480_2483delCCCG with c.2486T>A (p.V829Wfs*3)
  gene:
    preferred_term: TRPV4
    term:
      id: hgnc:18083
      label: TRPV4
  type: Complex deletion and adjacent substitution on one allele
  genomic_contexts:
  - coding sequence
  description: Reported on NM_021625.4 in the last exon. The deletion and adjacent substitution are in cis and were reported together as V829WfsX3. Four affected siblings carried the allele, one tested unaffected sibling was wild type, and the transmitting parent was not established. Mutant transcript persisted in patient cDNA; truncated protein was measured in tagged HEK293 constructs, not demonstrated in patient fibroblasts. The paper provides segregation and channel-function evidence without a formal ACMG classification.
  functional_effects:
  - function: Increased TRPV4 channel activity
    description: Proband fibroblasts and mutant-transduced HEK293 cells showed increased optical calcium sparklet activity and longer bursts. Altered calmodulin binding remains a hypothesis.
  evidence:
  - reference: PMID:27330106
    reference_title: Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'RESULTS: We report a family with four siblings affected with inherited osteonecrosis of the femoral head and the identification of a c.2480_2483delCCCG frameshift deletion followed by a c.2486T>A substitution in one allele of the transient receptor potential vanilloid 4 (TRPV4) gene.'
    explanation: Identifies the complex TRPV4 allele associated with the founding family; the paper also reports segregation and functional support.
  - reference: PMID:27330106
    reference_title: Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The TRPV4 mutation is located in the last exon and was confirmed in proband cDNA
    explanation: Demonstrates persistence of mutant transcript; does not quantify allele-specific nonsense-mediated decay.
  - reference: PMID:27330106
    reference_title: Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Thus, this mutation leads to a gain of function of TRPV4 channels by impeding channel closure.
    explanation: 'States the direction of the functional defect directly: gain of function via impaired channel closure, not loss of function.'
  - reference: url:https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/supplmat.cgi/bioc_xml/PMC5035228/1
    reference_title: https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/supplmat.cgi/bioc_xml/PMC5035228/1
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The assay did not distinguish between wild type and mutant TRPV4 mRNA.
    explanation: Supplementary Figure S7A describes total-transcript qPCR. Mutant cDNA detection supports transcript persistence but is not an allele-specific NMD quantification.

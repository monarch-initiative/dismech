  publication: PMID:27330106
  description: Stable C-terminal FLAG-tagged constructs reproduced increased basal sparklet activity in mutant cells despite lower protein expression. Native HEK293 cells lacked detectable sparklets. Agonist-induced calcium overload and death in the transduced cells were assay observations, not evidence of patient-cell death or therapeutic efficacy.

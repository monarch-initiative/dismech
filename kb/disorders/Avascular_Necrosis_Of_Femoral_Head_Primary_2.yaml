mechanistic_hypotheses:
- hypothesis_group_id: trpv4_endothelial_vasoconstriction_hypothesis
  hypothesis_label: TRPV4 gain-of-function drives osteonecrosis via endothelial calcium overload and vasoconstriction
  status: EMERGING
  description: 'The discovery paper''s own proposed mechanism: constitutive gain-of-function TRPV4 activity, combined with the femoral head''s constant mechanical loading, causes endothelial calcium overload, vasoconstriction (potentially via COX-dependent thromboxane receptor signaling), and consequent microthrombosis in a joint with no collateral blood supply. The authors explicitly describe this as a proposed synthesis rather than a directly demonstrated in vivo mechanism; no animal model or direct measurement of femoral head blood flow supports it yet.'
  evidence:
  - reference: PMID:27330106
    reference_title: Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: Together, this could cause Ca2+ overload, leading to endothelial dysfunction and vasoconstriction, resulting in bone loss at the hip.
    explanation: The authors' own hedged statement of the proposed mechanism.
- hypothesis_group_id: trpv4_osteoclast_resorption_hypothesis
  hypothesis_label: TRPV4 gain-of-function drives femoral head bone loss via excess osteoclast resorptive activity
  status: EMERGING
  description: Excess osteoclast resorption is a candidate route from TRPV4 gain of function to bone loss. Knockout and osteoclast-lineage R616Q/V620I gain-of-function experiments support a role for channel activity in resorption. However, the ANFH2 frameshift has not been tested in osteoclasts. In the 2012 gain-of-function model, removal of the calmodulin-binding domain abolished the bone-loss effect, so a C-terminal frameshift cannot simply be assumed to reproduce other alleles.
  evidence:
  - reference: PMID:18762026
    reference_title: TRPV4-mediated calcium influx regulates terminal differentiation of osteoclasts.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: genetic ablation in mice of Trpv4, a Ca(2+)-permeable channel of the transient receptor potential (TRP) family, increases bone mass by impairing bone resorption
    explanation: Establishes the direction of TRPV4's normal role in osteoclast resorption, from which the gain-of-function hypothesis is inferred by analogy.
  - reference: PMID:22492541
    reference_title: Calcium/calmodulin-signaling supports TRPV4 activation in osteoclasts and regulates bone mass.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: As expected, TRPV4 activation in osteoclasts increased the number of osteoclasts and their resorption activity, thereby resulting in bone loss.
    explanation: Direct gain-of-function animal evidence for the osteoclast pathway using R616Q/V620I substitutions, not the ANFH2 frameshift allele.
    directness: INDIRECT
  - reference: PMID:22492541
    reference_title: Calcium/calmodulin-signaling supports TRPV4 activation in osteoclasts and regulates bone mass.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In addition, studies of Trpv4(R616Q/V620I) mice that lacked the calmodulin-binding domain indicated that bone loss due to TRPV4 activation was abrogated by loss of interactions between Ca(2+)/calmodulin signaling and TRPV4.
    explanation: Shows dependence on the calmodulin-binding region in a different gain-of-function construct; this limits extrapolation to the ANFH2 C-terminal allele.
    directness: INDIRECT
animal_models:
- name: Global Trpv4-knockout mouse
  species: Mouse
  genotype: Trpv4-null (global knockout)
  publication: PMID:18762026
  description: Global genetic ablation of Trpv4, used to establish the channel's normal role in osteoclast terminal differentiation and bone resorption. This is a loss-of-function model of a gene whose ANFH2 disease allele is gain-of-function, so it informs the pathway rather than modeling the disease genotype itself.
  modeled_mechanisms:
  - target: Increased Osteoclast Bone Resorption
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: TRPV4 loss reduces resorption and increases bone mass, opposite to the excessive resorption proposed for ANFH2. Separate gain-of-function models exist, but use different alleles.
    limitations: 'Opposite-direction genetic perturbation: a null allele cannot demonstrate that a constitutively active channel drives excess resorption, only that channel activity is required for normal resorption. The inference to ANFH2''s gain-of-function direction is by analogy, not direct evidence.'
    divergences:
    - divergence_type: OTHER
      materiality: INVALIDATING
      description: The model's genetic perturbation is loss-of-function (null allele); the ANFH2 disease allele is gain-of-function. No divergence type in the current taxonomy captures a functional-direction reversal (loss vs gain of function) of the same gene, so this is recorded as OTHER.
    evidence:
    - reference: PMID:18762026
      reference_title: TRPV4-mediated calcium influx regulates terminal differentiation of osteoclasts.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: genetic ablation in mice of Trpv4, a Ca(2+)-permeable channel of the transient receptor potential (TRP) family, increases bone mass by impairing bone resorption
      explanation: 'Substantiates the FAILS_TO_RECAPITULATE call: the knockout''s bone-mass/resorption phenotype is opposite in direction to what the ANFH2 gain-of-function hypothesis predicts, so this model does not recapitulate the disease-relevant (excess-resorption) claim even though it establishes the pathway''s general relevance.'
    readouts:
    - name: Bone mass and resorption
      target: Increased Osteoclast Bone Resorption
      direction: DECREASED
      interpretation: Bone resorption is decreased (bone mass increased) upon TRPV4 loss of function, the inverse of the direction hypothesized for the ANFH2 gain-of-function allele.
      evidence:
      - reference: PMID:18762026
        reference_title: TRPV4-mediated calcium influx regulates terminal differentiation of osteoclasts.
        supports: SUPPORT
        directness: INDIRECT
        evidence_source: MODEL_ORGANISM
        snippet: genetic ablation in mice of Trpv4, a Ca(2+)-permeable channel of the transient receptor potential (TRP) family, increases bone mass by impairing bone resorption
        explanation: Reports the knockout's bone-mass/resorption phenotype directly.

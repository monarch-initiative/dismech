      identified with advanced bilateral osteonecrosis of the femoral head
      (figure 1A), all harbouring a heterozygous mutation in TRPV4 (figure
      1B) and absence of risk factors.
    explanation: >-
      Establishes autosomal dominant segregation of a single heterozygous
      TRPV4 variant with disease in the founding family.

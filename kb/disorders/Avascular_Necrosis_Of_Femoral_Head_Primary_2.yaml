      or necrosis) - supporting the entry's framing of ANFH2 as joining a
      spectrum that otherwise causes skeletal dysplasias and peripheral
      neuropathies. Graded OTHER since GeneReviews is an expert-curated
      synthesis, not a primary clinical study. Not tagged in this file's
      top-level `references:` as `GeneReviews` in the sense of a clinical
      baseline for THIS disease, since it does not describe ANFH2 itself.
pathophysiology:
- name: TRPV4 Calmodulin-Binding-Domain Truncating Gain-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    A c.2480_2483delCCCG frameshift deletion followed by a c.2486T>A
    substitution in the last exon of TRPV4 truncates the 871-amino-acid
    channel protein (p.V829Wfs*3), eliminating a highly conserved
    C-terminal region that includes residues within a calmodulin-binding
    domain. Unlike previously characterized TRPV4 C-terminal truncations,
    which cause loss of channel activity, this variant produces a gain of
    function: functional measurements in patient-derived dermal fibroblasts
    and stably transduced HEK293 cells show markedly increased TRPV4
    activity, caused specifically by longer channel open times rather than
    an increase in the number of channels per site.
  genes:
  - preferred_term: TRPV4
    term:
      id: hgnc:18083
      label: TRPV4
  molecular_functions:
  - preferred_term: calcium channel activity
    term:
      id: GO:0005262
      label: calcium channel activity
    modifier: GAIN_OF_FUNCTION
  genetic_context:
    functional_impact_category: GAIN_OF_FUNCTION
    allele_type: frameshift deletion (c.2480_2483delCCCG) with adjacent c.2486T>A substitution, C-terminal truncating
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
  downstream:
  - target: Increased TRPV4-Mediated Calcium Influx
  evidence:
  - reference: PMID:27330106
    reference_title: "Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It truncates the 871 amino acid protein (V829WfsX3), eliminating a
      highly conserved region including residues within a
      calmodulin-binding domain.
    explanation: >-
      Localizes the truncating variant to the calmodulin-binding domain,
      which the authors propose as the molecular basis of the gain of
      function.
  - reference: PMID:27330106
    reference_title: "Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Thus, this mutation leads to a gain of function of TRPV4 channels by
      impeding channel closure.
    explanation: >-
      States the direction of the functional defect directly: gain of
      function via impaired channel closure, not loss of function.
  - reference: PMID:27330106
    reference_title: "Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Previous studies investigating TRPV4 C-terminal truncations found
      loss of TRPV4 activity, contrary to a gain of function.
    explanation: >-
      Notes that this variant's gain-of-function direction is atypical for
      TRPV4 C-terminal truncations generally, which the authors flag as
      novel and attribute to the specific calmodulin-binding-domain
      residues affected.
- name: Increased TRPV4-Mediated Calcium Influx
  biological_scale: CELLULAR
  description: >-
    Optical recording of TRPV4 Ca2+ "sparklets" (local, quantal
    fluorescence transients representing single-channel openings within a
    cluster) shows markedly increased channel activity per site in both
    proband-derived dermal fibroblasts and mutant-TRPV4-transduced HEK293
    cells compared with controls, without an increase in the number of
    channels per site - confirming the calcium overload is driven by
    longer channel open times.
  biological_processes:
  - preferred_term: calcium ion transmembrane transport
    term:
      id: GO:0070588
      label: calcium ion transmembrane transport
    modifier: INCREASED
  downstream:
  - target: Vascular Endothelial Dysfunction and Vasoconstriction
    hypothesis_groups:
    - trpv4_endothelial_vasoconstriction_hypothesis
  - target: Osteoclast Calcium Signaling Dysregulation
    hypothesis_groups:
    - trpv4_osteoclast_resorption_hypothesis
  evidence:
  - reference: PMID:27330106
    reference_title: "Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We stimulated channel activity with TRPV4 agonist GSK1016790A (GSK101
      hereafter, 3 nM) and found that sparklet activity per site was
      3.3-fold higher in proband fibroblasts versus control
    explanation: >-
      Quantifies the calcium-channel gain of function directly in
      patient-derived cells.
  - reference: PMID:27330106
    reference_title: "Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The baseline TRPV4 sparklet activity per site was 2.5-fold higher in
      TRPV4-V829WfsX3 vs TRPV4-WT cells
    explanation: >-
      Reproduces the gain-of-function calcium signal in a second,
      independent cell system (transduced HEK293 cells) expressing only
      the mutant channel.
- name: Osteoclast Calcium Signaling Dysregulation
  biological_scale: CELLULAR
  description: >-
    TRPV4 mediates basolateral Ca2+ influx specifically in large osteoclasts
    once RANKL-evoked Ca2+ oscillations decline, sustaining the
    NFATc1-dependent gene transcription required for terminal
    differentiation and resorptive activity. Genetic ablation of Trpv4 in
    mice increases bone mass by impairing bone resorption, indicating that
    TRPV4 signaling normally promotes osteoclast differentiation and
    resorption. This evidence is from the opposite (loss-of-function)
    direction: no study has directly measured osteoclast activity in cells
    carrying the ANFH2 gain-of-function variant, so the inference that
    excess TRPV4 activity would drive excess resorption is proposed by
    analogy rather than demonstrated.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: osteoclast differentiation
    term:
      id: GO:0030316
      label: osteoclast differentiation
    modifier: INCREASED
  downstream:
  - target: Osteonecrosis of the femoral head
    hypothesis_groups:
    - trpv4_osteoclast_resorption_hypothesis
  evidence:
  - reference: PMID:18762026
    reference_title: "TRPV4-mediated calcium influx regulates terminal differentiation of osteoclasts."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      genetic ablation in mice of Trpv4, a Ca(2+)-permeable channel of the
      transient receptor potential (TRP) family, increases bone mass by
      impairing bone resorption
    explanation: >-
      Establishes that TRPV4 loss of function reduces osteoclast-mediated
      bone resorption in mice - the inverse experiment to the human
      gain-of-function variant, so it is graded INDIRECT: it supports a
      role for TRPV4 in osteoclast resorption without directly showing
      that the ANFH2 gain-of-function allele increases resorption.
  - reference: PMID:18762026
    reference_title: "TRPV4-mediated calcium influx regulates terminal differentiation of osteoclasts."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      TRPV4-mediated Ca(2+) influx hereby secures intracellular Ca(2+)
      concentrations, ensures NFATc1-regulated gene transcription, and
      regulates the terminal differentiation and activity of osteoclasts.
    explanation: >-
      Describes the molecular pathway (Ca2+ influx sustaining
      NFATc1-dependent transcription) by which TRPV4 activity level
      controls osteoclast terminal differentiation.
- name: Vascular Endothelial Dysfunction and Vasoconstriction
  biological_scale: CELLULAR
  description: >-
    The authors propose that TRPV4 gain-of-function calcium overload in
    vascular endothelium, acting together with the mechanical stress of
    weight-bearing at the hip, causes endothelial dysfunction and
    vasoconstriction. TRPV4 is expressed in vascular endothelium, where it
    normally regulates vasodilation and vascular tone, and TRPV4-mediated
    vasoconstriction (via COX-dependent prostanoid production and
    thromboxane receptor potentiation) has been demonstrated elsewhere in
    the vascular endothelium. This step is explicitly framed by the
    authors as a proposed, not directly demonstrated, mechanism for this
    disease.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: vasoconstriction
    term:
      id: GO:0042310
      label: vasoconstriction
    modifier: INCREASED
  downstream:
  - target: Femoral Head Microvascular Thrombosis and Ischemia
    hypothesis_groups:
    - trpv4_endothelial_vasoconstriction_hypothesis
  evidence:
  - reference: PMID:27330106
    reference_title: "Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Together, this could cause Ca2+ overload, leading to endothelial
      dysfunction and vasoconstriction, resulting in bone loss at the hip.
    explanation: >-
      The authors' own proposed causal chain from calcium overload to
      vasoconstriction to bone loss, offered as a plausible mechanism
      rather than a directly demonstrated one - graded INDIRECT
      accordingly.
  - reference: PMID:27330106
    reference_title: "Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      suggesting that TRPV4 activation in endothelial cells is the most
      plausible origin of the microthrombotic process underlying
      osteonecrosis, possibly via a thromboxane-related mechanism
    explanation: >-
      Names the specific proposed downstream vascular event (microthrombosis)
      and its candidate mediator, again explicitly hedged by the authors
      as the "most plausible" rather than proven origin.
  - reference: PMID:27330106
    reference_title: "Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thrombophilia markers, implicated as causative factors in
      osteonecrosis, were negative in affected family members
    explanation: >-
      Rules out a coagulation-factor defect as the cause of microthrombosis
      in this family, which is why the vascular pathophysiology here is
      attributed to TRPV4-driven endothelial dysfunction rather than to a
      primary hypercoagulable state.
- name: Femoral Head Microvascular Thrombosis and Ischemia
  biological_scale: TISSUE
  description: >-
    Osteonecrosis of the femoral head is characterized by compromised
    blood flow to the femoral head, with microvascular thrombosis a common
    finding across non-traumatic osteonecrosis generally. The femoral head
    is anatomically vulnerable because it lacks collateral blood vessels
    and is a constantly weight-bearing, mechanically stressed joint -
    features the authors propose synergize with systemic TRPV4
    gain-of-function activation to produce localized ischemia.
  downstream:
  - target: Osteocyte Death and Bone Cell Apoptosis
  evidence:
  - reference: PMID:27330106
    reference_title: "Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      microvascular thrombosis is a common finding in non-traumatic
      osteonecrosis, indicating a vascular role in disease pathogenesis
    explanation: >-
      Establishes microvascular thrombosis as a recognized feature of
      non-traumatic osteonecrosis pathogenesis generally, which this
      TRPV4-driven case is proposed to share.
- name: Osteocyte Death and Bone Cell Apoptosis
  biological_scale: TISSUE
  description: >-
    Compromised blood flow to the femoral head leads to bone cell
    (osteocyte) apoptosis, the defining lesion of osteonecrosis.
  downstream:
  - target: Subchondral Fracture and Structural Collapse
  evidence:
  - reference: PMID:27330106
    reference_title: "Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Osteonecrosis of the femoral head is characterised by compromised
      blood flow to the femoral head leading to bone cell apoptosis and
      its eventual collapse.
    explanation: >-
      States the causal step from compromised blood flow to bone cell
      (osteocyte) apoptosis directly.
- name: Subchondral Fracture and Structural Collapse
  biological_scale: TISSUE
  description: >-
    Cumulative osteocyte death leaves the femoral head unable to withstand
    ongoing weight-bearing mechanical load, producing subchondral fracture
    and progressive structural collapse. The femoral head's lack of
    collateral blood supply is the anatomical reason this specific site is
    vulnerable to fracture once ischemic.
  downstream:
  - target: Osteonecrosis of the femoral head
  evidence:
  - reference: PMID:27330106
    reference_title: "Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The femoral head lacks collateral blood vessels, increasing risk for
      subchondral fracture and collapse.
    explanation: >-
      Anatomical basis for why compromised blood flow specifically
      threatens the femoral head with fracture and collapse.

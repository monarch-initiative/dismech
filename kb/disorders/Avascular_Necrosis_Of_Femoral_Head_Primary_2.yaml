phenotypes:
- name: Osteonecrosis of the femoral head
  description: >-
    Bilateral avascular necrosis of the femoral head, typically diagnosed
    by hip radiography and MRI (the gold standard), staged using the
    Steinberg classification. In the founding family, all four affected
    siblings had bilateral hip involvement, compared with about two-thirds
    of a sporadic (non-TRPV4) osteonecrosis comparison cohort, and had
    already reached Steinberg Stage III-V (subchondral fracture through
    end-stage secondary arthritic change) by the time of diagnosis. The
    other two clinically recognized TRPV4-opathy phenotype categories
    (skeletal dysplasia, peripheral neuropathy) and a primary
    coagulopathy were each specifically examined for and excluded in
    this family, supporting ANFH2 as a distinct TRPV4-related entity
    rather than an atypical presentation of one of those.
  sequelae:
  - target: Hip pain
  phenotype_term:
    preferred_term: Osteonecrosis of the femoral head
    term:

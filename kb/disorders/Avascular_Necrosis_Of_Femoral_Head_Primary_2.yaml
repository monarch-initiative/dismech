    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: One patient and one unrelated control; no isogenic correction or disease-site endothelial/osteoclast cells. Optical bursts are indirect channel measurements, and endogenous TRPV4 protein could not be detected by the antibody.
    evidence:

name: Avascular Necrosis of Femoral Head, Primary, 2
synonyms:
- ANFH2
- Osteonecrosis of the femoral head, TRPV4-related
creation_date: '2026-09-04T03:41:22Z'
category: Mendelian
description: Primary avascular necrosis of the femoral head type 2 (ANFH2) is a rare inherited form of bilateral hip osteonecrosis associated with a heterozygous C-terminal TRPV4 frameshift allele. The founding family contained four affected siblings without the usual acquired risk factors. Patient fibroblasts and transduced HEK293 cells showed increased channel activity and prolonged optical calcium sparklet bursts. The proposed endothelial and osteoclast mechanisms linking channel dysfunction to hip disease remain unverified for this allele in phenotype-relevant tissue. Hip osteonecrosis has also been reported in broader TRPV4 skeletal and neuromuscular phenotypes, which are clinically distinct from the isolated presentation of the founding ANFH2 family.
disease_term:
  preferred_term: avascular necrosis of femoral head, primary, 2
  term:
    id: MONDO:0054551
    label: avascular necrosis of femoral head, primary, 2
parents:
- Skeletal Disorder
- Vascular Disorder
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: Four affected siblings carried the heterozygous allele and one examined unaffected sibling was wild type. A second reportedly unaffected sibling did not participate. Parents and grandparents were deceased; recalled paternal joint pain was never evaluated, so the transmitting parent was not established. Segregation in this ascertained family does not provide a population penetrance estimate.
  evidence:
  - reference: PMID:27330106
    reference_title: Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There was a positive family history with four of six siblings identified with advanced bilateral osteonecrosis of the femoral head (figure 1A), all harbouring a heterozygous mutation in TRPV4 (figure 1B) and absence of risk factors.
    explanation: Supports segregation consistent with autosomal dominant inheritance in one family; only one unaffected sibling was genotyped.
  - reference: PMID:27330106
    reference_title: Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Osteonecrosis was ruled out in one unaffected sibling by radiography (see online supplementary figure S1) and the other unaffected sibling did not participate in the study.
    explanation: Distinguishes the examined unaffected sibling from the unstudied sibling.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: The isolated ANFH2 presentation was delineated in one family in 2016. Later reports of osteonecrosis within mixed TRPV4 phenotypes do not establish a population prevalence for isolated ANFH2.
genetic:
- name: TRPV4
  gene_term:
    preferred_term: TRPV4
    term:
      id: hgnc:18083
      label: TRPV4
  frequency: The founding frameshift allele segregated in one ascertained family; population frequency and penetrance are not established.
  evidence:
  - reference: PMID:27330106
    reference_title: Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'RESULTS: We report a family with four siblings affected with inherited osteonecrosis of the femoral head and the identification of a c.2480_2483delCCCG frameshift deletion followed by a c.2486T>A substitution in one allele of the transient receptor potential vanilloid 4 (TRPV4) gene.'
    explanation: Identifies the complex TRPV4 allele associated with the founding family; the paper also reports segregation and functional support.
  - reference: PMID:30328481
    reference_title: 'Osteonecrosis of the femoral head: genetic basis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: our recent identification of a novel mutation in the transient receptor potential vanilloid 4 (TRPV4) gene in association with inherited ONFH
    explanation: The same research group summarizes its earlier TRPV4-associated family; this is not independent replication.
    quote_role: BACKGROUND
  - reference: PMID:24830047
    reference_title: Autosomal Dominant TRPV4-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The autosomal dominant TRPV4-related disorders include two principal types: neuromuscular disorders and skeletal dysplasias.'
    explanation: GeneReviews describes the broader neuromuscular and skeletal TRPV4 spectrum. Its chapter does not name osteonecrosis and does not supply an ANFH2-specific phenotype or management baseline.
    quote_role: BACKGROUND
pathophysiology:
- name: TRPV4 C-Terminal Truncation
  biological_scale: MOLECULAR
  description: The last-exon complex allele NM_021625.4:c.2480_2483delCCCG with c.2486T>A was reported as p.V829Wfs*3. Mutant transcript was present in proband cDNA and tagged truncated protein was expressed in transduced HEK293 cells. The truncation overlaps the C-terminal calmodulin-binding region; an effect on calmodulin binding or feedback was not measured. Patient fibroblast protein was below antibody detection.
  genes:
  - preferred_term: TRPV4
    term:
      id: hgnc:18083
      label: TRPV4
  genetic_context:
    functional_impact_category: GAIN_OF_FUNCTION
    allele_type: frameshift deletion (c.2480_2483delCCCG) with adjacent c.2486T>A substitution, C-terminal truncating
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
  downstream:
  - target: Prolonged TRPV4 Channel Activity
  evidence:
  - reference: PMID:27330106
    reference_title: Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It truncates the 871 amino acid protein (V829WfsX3), eliminating a highly conserved region including residues within a calmodulin-binding domain.
    explanation: The allele changes and truncates the conserved C-terminal region; the effect on calmodulin binding itself was not measured.
- name: Prolonged TRPV4 Channel Activity
  biological_scale: MOLECULAR
  description: Longer calcium sparklet bursts in proband fibroblasts and mutant-transduced HEK293 cells support impaired channel closure. These optical bursts may contain multiple brief channel openings; they are not direct patch-clamp single-channel dwell-time measurements.
  molecular_functions:
  - preferred_term: calcium channel activity
    term:
      id: GO:0005262
      label: calcium channel activity
    modifier: GAIN_OF_FUNCTION
  downstream:
  - target: Increased TRPV4-Mediated Calcium Influx
  evidence:
  - reference: PMID:27330106
    reference_title: Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Thus, this mutation leads to a gain of function of TRPV4 channels by impeding channel closure.
    explanation: 'States the direction of the functional defect directly: gain of function via impaired channel closure, not loss of function.'
  - reference: PMID:27330106
    reference_title: Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: finding twofold longer mean burst open times for each quantal level in proband fibroblasts compared with control fibroblasts
    explanation: The measured readout is optical burst duration. Impaired closure is the authors' interpretation.
- name: Increased TRPV4-Mediated Calcium Influx
  biological_scale: CELLULAR
  description: Confocal imaging of local calcium sparklets showed higher activity per site in proband fibroblasts and mutant-transduced HEK293 cells. The observed maximum was four channels per site in both comparisons. Prolonged optical bursts support impaired channel closure indirectly. In HEK293 cells, wild-type protein expression was approximately twice mutant expression, so the higher mutant signal was not explained by higher total expression.
  biological_processes:
  - preferred_term: calcium ion transmembrane transport
    term:
      id: GO:0070588
      label: calcium ion transmembrane transport
    modifier: INCREASED

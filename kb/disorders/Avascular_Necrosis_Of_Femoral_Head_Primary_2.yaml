      TRPV4-V829WfsX3 vs TRPV4-WT cells
    explanation: >-
      Reproduces the gain-of-function calcium signal in a second,
      independent cell system (transduced HEK293 cells) expressing only
      the mutant channel.
- name: Osteoclast Calcium Signaling Dysregulation
  biological_scale: CELLULAR
  description: >-
    TRPV4 mediates basolateral Ca2+ influx specifically in large osteoclasts
    once RANKL-evoked Ca2+ oscillations decline, sustaining the
    NFATc1-dependent gene transcription required for terminal
    differentiation and resorptive activity. Genetic ablation of Trpv4 in
    mice increases bone mass by impairing bone resorption, indicating that
    TRPV4 signaling normally promotes osteoclast differentiation and
    resorption. This evidence is from the opposite (loss-of-function)
    direction: no study has directly measured osteoclast activity in cells
    carrying the ANFH2 gain-of-function variant, so the inference that
    excess TRPV4 activity would drive excess resorption is proposed by
    analogy rather than demonstrated.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: osteoclast differentiation
    term:
      id: GO:0030316
      label: osteoclast differentiation
    modifier: INCREASED
  downstream:
  - target: Osteonecrosis of the femoral head
    hypothesis_groups:
    - trpv4_osteoclast_resorption_hypothesis
  evidence:
  - reference: PMID:18762026
    reference_title: "TRPV4-mediated calcium influx regulates terminal differentiation of osteoclasts."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      genetic ablation in mice of Trpv4, a Ca(2+)-permeable channel of the
      transient receptor potential (TRP) family, increases bone mass by
      impairing bone resorption
    explanation: >-
      Establishes that TRPV4 loss of function reduces osteoclast-mediated
      bone resorption in mice - the inverse experiment to the human
      gain-of-function variant, so it is graded INDIRECT: it supports a
      role for TRPV4 in osteoclast resorption without directly showing
      that the ANFH2 gain-of-function allele increases resorption.
  - reference: PMID:18762026
    reference_title: "TRPV4-mediated calcium influx regulates terminal differentiation of osteoclasts."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      TRPV4-mediated Ca(2+) influx hereby secures intracellular Ca(2+)
      concentrations, ensures NFATc1-regulated gene transcription, and
      regulates the terminal differentiation and activity of osteoclasts.
    explanation: >-
      Describes the molecular pathway (Ca2+ influx sustaining
      NFATc1-dependent transcription) by which TRPV4 activity level
      controls osteoclast terminal differentiation.
- name: Vascular Endothelial Dysfunction and Vasoconstriction
  biological_scale: CELLULAR
  description: >-
    The authors propose that TRPV4 gain-of-function calcium overload in
    vascular endothelium, acting together with the mechanical stress of
    weight-bearing at the hip, causes endothelial dysfunction and
    vasoconstriction. TRPV4 is expressed in vascular endothelium, where it
    normally regulates vasodilation and vascular tone, and TRPV4-mediated
    vasoconstriction (via COX-dependent prostanoid production and
    thromboxane receptor potentiation) has been demonstrated elsewhere in
    the vascular endothelium. This step is explicitly framed by the
    authors as a proposed, not directly demonstrated, mechanism for this
    disease.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: vasoconstriction
    term:
      id: GO:0042310
      label: vasoconstriction
    modifier: INCREASED
  downstream:
  - target: Femoral Head Microvascular Thrombosis and Ischemia
    hypothesis_groups:
    - trpv4_endothelial_vasoconstriction_hypothesis
  evidence:
  - reference: PMID:27330106
    reference_title: "Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Together, this could cause Ca2+ overload, leading to endothelial
      dysfunction and vasoconstriction, resulting in bone loss at the hip.
    explanation: >-
      The authors' own proposed causal chain from calcium overload to
      vasoconstriction to bone loss, offered as a plausible mechanism
      rather than a directly demonstrated one - graded INDIRECT
      accordingly.
  - reference: PMID:27330106
    reference_title: "Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      suggesting that TRPV4 activation in endothelial cells is the most
      plausible origin of the microthrombotic process underlying
      osteonecrosis, possibly via a thromboxane-related mechanism
    explanation: >-
      Names the specific proposed downstream vascular event (microthrombosis)
      and its candidate mediator, again explicitly hedged by the authors
      as the "most plausible" rather than proven origin.
- name: Femoral Head Microvascular Thrombosis and Ischemia
  biological_scale: TISSUE
  description: >-
    Osteonecrosis of the femoral head is characterized by compromised
    blood flow to the femoral head, with microvascular thrombosis a common
    finding across non-traumatic osteonecrosis generally. The femoral head
    is anatomically vulnerable because it lacks collateral blood vessels
    and is a constantly weight-bearing, mechanically stressed joint -
    features the authors propose synergize with systemic TRPV4
    gain-of-function activation to produce localized ischemia.
  downstream:
  - target: Osteonecrosis of the femoral head
  evidence:
  - reference: PMID:27330106
    reference_title: "Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      microvascular thrombosis is a common finding in non-traumatic
      osteonecrosis, indicating a vascular role in disease pathogenesis
    explanation: >-
      Establishes microvascular thrombosis as a recognized feature of
      non-traumatic osteonecrosis pathogenesis generally, which this
      TRPV4-driven case is proposed to share.
  - reference: PMID:27330106
    reference_title: "Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The femoral head lacks collateral blood vessels, increasing risk for
      subchondral fracture and collapse.
    explanation: >-
      Anatomical basis for why compromised blood flow specifically
      threatens the femoral head with fracture and collapse.

    snippet: Using the Steinberg classification, sibling III-5, left, has Stage V disease of left hip and Stage IV disease of right hip. The proband (III-6), right, has Stage IV disease of left hip and Stage III of right hip.
    explanation: The main radiograph legend stages two siblings, not the entire family. Supplementary clinical notes extend the observed range to Stage VI.
  - reference: PMID:27330106
    reference_title: Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: TRPV4-associated skeletal dysplasias were ruled out by a complete physical examination performed by a medical geneticist and total body skeletal surveys.

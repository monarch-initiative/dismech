      reference_title: Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We stimulated channel activity with TRPV4 agonist GSK1016790A (GSK101 hereafter, 3 nM) and found that sparklet activity per site was 3.3-fold higher in proband fibroblasts versus control
      explanation: Quantifies the calcium-channel gain of function directly in patient-derived cells.

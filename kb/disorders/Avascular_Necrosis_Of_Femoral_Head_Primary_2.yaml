  experimental_model_type: CELL_LINE
  cell_source: Patient and control dermal fibroblasts, immortalized according to the supplementary methods
  publication: PMID:27330106
  description: Immortalized dermal fibroblasts from the proband and a healthy control were compared using confocal calcium sparklet imaging. With 3 nM GSK1016790A, activity per site was 3.3-fold higher in proband cells; mean optical burst durations were approximately doubled. Basal activity was also increased.
  modeled_mechanisms:

mechanistic_hypotheses:
- hypothesis_group_id: trpv4_endothelial_vasoconstriction_hypothesis
  hypothesis_label: TRPV4 gain-of-function drives osteonecrosis via endothelial calcium overload and vasoconstriction
  status: EMERGING
  description: >-
    The discovery paper's own proposed mechanism: constitutive
    gain-of-function TRPV4 activity, combined with the femoral head's
    constant mechanical loading, causes endothelial calcium overload,
    vasoconstriction (potentially via COX-dependent thromboxane receptor
    signaling), and consequent microthrombosis in a joint with no
    collateral blood supply. The authors explicitly describe this as a
    proposed synthesis rather than a directly demonstrated in vivo
    mechanism; no animal model or direct measurement of femoral head blood
    flow supports it yet.
  evidence:
  - reference: PMID:27330106
    reference_title: "Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Together, this could cause Ca2+ overload, leading to endothelial
      dysfunction and vasoconstriction, resulting in bone loss at the hip.
    explanation: >-
      The authors' own hedged statement of the proposed mechanism.
- hypothesis_group_id: trpv4_osteoclast_resorption_hypothesis
  hypothesis_label: TRPV4 gain-of-function drives femoral head bone loss via excess osteoclast resorptive activity
  status: EMERGING
  description: >-
    A candidate parallel (non-vascular) route from the same calcium-overload
    step: TRPV4 normally sustains NFATc1-dependent osteoclast terminal
    differentiation and resorptive activity, and Trpv4-knockout mice show
    reduced resorption and increased bone mass. By analogy, a
    constitutively gain-of-function channel would be expected to drive
    excess resorption and bone loss at the femoral head. No study has
    tested this directly in cells or animals carrying an ANFH2-equivalent
    gain-of-function allele; the supporting evidence is entirely from the
    opposite-direction knockout experiment.
  evidence:
  - reference: PMID:18762026
    reference_title: "TRPV4-mediated calcium influx regulates terminal differentiation of osteoclasts."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      genetic ablation in mice of Trpv4, a Ca(2+)-permeable channel of the
      transient receptor potential (TRP) family, increases bone mass by
      impairing bone resorption
    explanation: >-
      Establishes the direction of TRPV4's normal role in osteoclast
      resorption, from which the gain-of-function hypothesis is inferred
      by analogy.
animal_models:
- name: Global Trpv4-knockout mouse
  species: Mouse
  genotype: Trpv4-null (global knockout)
  publication: PMID:18762026
  description: >-
    Global genetic ablation of Trpv4, used to establish the channel's
    normal role in osteoclast terminal differentiation and bone
    resorption. This is a loss-of-function model of a gene whose ANFH2
    disease allele is gain-of-function, so it informs the pathway rather
    than modeling the disease genotype itself.
  modeled_mechanisms:
  - target: Osteoclast Calcium Signaling Dysregulation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Confirms TRPV4-mediated calcium influx is required for normal
      osteoclast terminal differentiation and resorptive activity, but
      does not model the ANFH2 disease direction: the knockout produces
      the opposite phenotype (reduced resorption, increased bone mass)
      to what the gain-of-function hypothesis for ANFH2 predicts (excess
      resorption, bone loss). No gain-of-function knock-in model exists
      for this variant or an equivalent one.
    limitations: >-
      Opposite-direction genetic perturbation: a null allele cannot
      demonstrate that a constitutively active channel drives excess
      resorption, only that channel activity is required for normal
      resorption. The inference to ANFH2's gain-of-function direction is
      by analogy, not direct evidence.
    divergences:
    - divergence_type: OTHER
      materiality: INVALIDATING
      description: >-
        The model's genetic perturbation is loss-of-function (null
        allele); the ANFH2 disease allele is gain-of-function. No
        divergence type in the current taxonomy captures a
        functional-direction reversal (loss vs gain of function) of the
        same gene, so this is recorded as OTHER.
    evidence:
    - reference: PMID:18762026
      reference_title: "TRPV4-mediated calcium influx regulates terminal differentiation of osteoclasts."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        genetic ablation in mice of Trpv4, a Ca(2+)-permeable channel of the
        transient receptor potential (TRP) family, increases bone mass by
        impairing bone resorption
      explanation: >-
        Substantiates the FAILS_TO_RECAPITULATE call: the knockout's
        bone-mass/resorption phenotype is opposite in direction to what
        the ANFH2 gain-of-function hypothesis predicts, so this model
        does not recapitulate the disease-relevant (excess-resorption)
        claim even though it establishes the pathway's general relevance.
    readouts:
    - name: Bone mass and resorption
      target: Osteoclast Calcium Signaling Dysregulation
      direction: DECREASED
      interpretation: >-
        Bone resorption is decreased (bone mass increased) upon TRPV4
        loss of function, the inverse of the direction hypothesized for
        the ANFH2 gain-of-function allele.
      evidence:
      - reference: PMID:18762026
        reference_title: "TRPV4-mediated calcium influx regulates terminal differentiation of osteoclasts."
        supports: SUPPORT
        directness: INDIRECT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          genetic ablation in mice of Trpv4, a Ca(2+)-permeable channel of the
          transient receptor potential (TRP) family, increases bone mass by
          impairing bone resorption
        explanation: >-
          Reports the knockout's bone-mass/resorption phenotype directly.
  evidence:
  - reference: PMID:18762026
    reference_title: "TRPV4-mediated calcium influx regulates terminal differentiation of osteoclasts."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      TRPV4-mediated Ca(2+) influx hereby secures intracellular Ca(2+)
      concentrations, ensures NFATc1-regulated gene transcription, and
      regulates the terminal differentiation and activity of osteoclasts.
    explanation: >-
      Establishes this model as informative for TRPV4's general role in
      osteoclast biology, the basis for the osteoclast-resorption
      hypothesis by analogy.
discussions:
- discussion_id: anfh2_no_gain_of_function_animal_model
  prompt: >-
    Does any animal or cellular model directly recapitulate femoral head
    osteonecrosis driven by a TRPV4 gain-of-function allele, rather than
    modeling TRPV4's general roles in bone or vascular biology?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Vascular Endothelial Dysfunction and Vasoconstriction
  - pathophysiology#Osteoclast Calcium Signaling Dysregulation
  rationale: >-
    The causal evidence for ANFH2 is a single human pedigree plus in vitro
    channel electrophysiology (patient fibroblasts and transduced HEK293
    cells) - there is no whole-organism model. The existing Trpv4 mouse
    literature establishes the channel's general roles in osteoclast
    resorption and vascular tone, but by loss-of-function (knockout) or
    skeletal-dysplasia gain-of-function alleles distinct from the ANFH2
    variant, and none reproduces femoral head osteonecrosis specifically.
    The vasoconstriction/microthrombosis step and the osteoclast-resorption
    step are therefore both extrapolated from tissue-general TRPV4 biology
    rather than demonstrated for this disease.
  evidence:
  - reference: PMID:27330106
    reference_title: "Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of the femoral head."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Limitations of the study include the availability of a single
      family, which adds difficulty to eliminating all variant candidates
      in an autosomal-dominant model of inheritance and a lack of
      available phenotype-relevant cell types for functional measurements
      or an animal model to provide additional evidence of causation.
    explanation: >-
      The discovery paper's own authors identify the absence of a
      phenotype-relevant cell type or animal model as a limitation of
      their causal evidence.

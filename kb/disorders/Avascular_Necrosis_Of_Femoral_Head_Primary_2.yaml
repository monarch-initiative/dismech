name: Avascular Necrosis of Femoral Head, Primary, 2
synonyms:
- ANFH2
- Osteonecrosis of the femoral head, TRPV4-related
creation_date: "2026-09-04T03:41:22Z"
category: Mendelian
description: >
  Avascular necrosis of the femoral head, primary, 2 (ANFH2) is an autosomal
  dominant form of inherited osteonecrosis of the femoral head, caused by a
  heterozygous C-terminal truncating gain-of-function variant in TRPV4, a
  mechanosensitive, calcium-permeable cation channel. It presents with
  bilateral, adult-onset femoral head necrosis in the absence of the usual
  acquired risk factors (glucocorticoid exposure, alcohol use, trauma), and
  joins a growing spectrum of TRPV4 channelopathies that otherwise cause
  skeletal dysplasias and peripheral neuropathies. The proposed mechanism is
  gain-of-function TRPV4-mediated calcium overload in vascular endothelium,
  producing endothelial dysfunction, vasoconstriction, and microthrombosis
  that compromises the femoral head's single-source blood supply.

genetic:
- name: UGT1A1 pharmacogenomic susceptibility
  gene_term:
    preferred_term: UGT1A1
    term:
      id: hgnc:12530
      label: UGT1A1
  association: Reduced-function UGT1A1 variants increase irinotecan-associated neutropenia risk
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  notes: >-
    Reduced UGT1A1 activity limits SN-38 glucuronidation after irinotecan
    exposure, increasing bone marrow toxicity including neutropenia. Two alleles
    carry most of the reported signal: *28, an extra TA repeat in the UGT1A1
    promoter TATA sequence, and *6, whose association with severe
    irinotecan-induced neutropenia has been quantified mainly in Chinese and
    Japanese study populations.
  variants:
  - name: UGT1A1*28
    description: >-
      Promoter repeat allele - an additional TA repeat in the TATA sequence -
      associated with lower SN-38 glucuronidation and increased irinotecan
      myelotoxicity susceptibility.
  - name: UGT1A1*6
    description: >-
      Allele associated with an increased risk of severe irinotecan-induced
      neutropenia in a meta-analysis of twelve studies.
  evidence:
  - reference: PMID:11990381
    reference_title: "UGT1A1*28 polymorphism as a determinant of irinotecan disposition and toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      screening for UGT1A1*28 polymorphism may identify patients with lower
      SN-38 glucuronidation rates and greater susceptibility to irinotecan
      induced gastrointestinal and bone marrow toxicity.
    explanation: >-
      Human pharmacokinetic evidence links UGT1A1*28 to greater irinotecan bone
      marrow toxicity, of which neutropenia is the principal manifestation.
  - reference: PMID:28585035
    reference_title: "UGT1A1*6 polymorphisms are correlated with irinotecan-induced neutropenia: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with recessive models (GA + AA vs. GG) of UGT1A1*6 showed an increased risk (OR 2.03, 95% CI 1.54-2.68; RD = 0.11, P < 0.001)."
    explanation: >-
      Quantifies the UGT1A1*6 association with severe irinotecan-induced
      neutropenia across twelve studies, the neutrophil-specific endpoint this
      entry is about.
- name: DPYD pharmacogenomic susceptibility
  gene_term:
    preferred_term: DPYD
    term:
      id: hgnc:3012
      label: DPYD
  association: Reduced-function DPYD variants increase fluoropyrimidine-associated neutropenia risk
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  notes: >-
    DPYD encodes dihydropyrimidine dehydrogenase, the rate-limiting enzyme of
    fluorouracil catabolism. Note that the enzyme phenotype and the genotype are
    separately measured in the founding series: the 3.4-fold excess of grade IV
    neutropenia is reported for patients with partial DPD enzyme deficiency,
    while the IVS14+1G>A allele accounts for half of the genotyped patients who
    had grade IV neutropenia. The two are related but not the same measurement.
  variants:
  - name: DPYD IVS14+1G>A (DPYD*2A, c.1905+1G>A)
    description: >-
      Splice-site allele carried, in heterozygous or homozygous form, by 50% of
      the grade IV neutropenia patients genotyped in the founding series.
  evidence:
  - reference: PMID:12209976
    reference_title: "Increased risk of grade IV neutropenia after administration of 5-fluorouracil due to a dihydropyrimidine dehydrogenase deficiency: high prevalence of the IVS14+1g>a mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with partial DPD deficiency appeared to have a 3.4-fold higher
      risk of developing grade IV neutropenia than patients with normal DPD
      activity.
    explanation: >-
      Quantifies the neutrophil-specific excess risk associated with reduced DPD
      activity, the enzyme DPYD encodes.
  - reference: PMID:12209976
    reference_title: "Increased risk of grade IV neutropenia after administration of 5-fluorouracil due to a dihydropyrimidine dehydrogenase deficiency: high prevalence of the IVS14+1g>a mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of the DPYD gene of patients suffering from grade IV neutropenia
      for the presence of the IVS14+1G>A mutation showed that 50% of the
      patients investigated were heterozygous or homozygous for the IVS14+1G>A
      mutation.
    explanation: >-
      Ties the enzyme deficiency to a specific DPYD allele in the patients who
      developed grade IV neutropenia.
  - reference: PMID:30348537
    reference_title: "DPYD genotype-guided dose individualisation of fluoropyrimidine therapy in patients with cancer: a prospective safety analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prospective DPYD genotyping was feasible in routine clinical practice, and
      DPYD genotype-based dose reductions improved patient safety of
      fluoropyrimidine treatment.
    explanation: >-
      Prospective multicentre evidence that acting on the genotype changes the
      toxicity outcome. The endpoint is overall severe fluoropyrimidine toxicity
      rather than neutropenia alone, so it supports the actionability of the
      locus rather than the neutrophil-specific effect size.
- name: TPMT pharmacogenomic susceptibility
  gene_term:
    preferred_term: TPMT
    term:
      id: hgnc:12014
      label: TPMT
  association: Reduced-function TPMT alleles increase thiopurine-associated myelosuppression risk
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  notes: >-
    TPMT methylates thiopurines to inactive metabolites, so reduced-function
    alleles leave more drug available for conversion to active thioguanine
    nucleotides. Within oncology the relevant agents are mercaptopurine, the
    backbone of acute lymphoblastic leukaemia maintenance regimens, and
    thioguanine; azathioprine, the third thiopurine covered by the same
    guideline, is an immunosuppressant rather than an antineoplastic and is out
    of scope for this entry.
  evidence:
  - reference: PMID:41618934
    reference_title: "Clinical Pharmacogenetics Implementation Consortium (CPIC) Guideline for Thiopurine Dosing Based on TPMT and NUDT15 Genotypes: 2025 Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thiopurine methyltransferase (TPMT) and Nudix hydrolase 15 (NUDT15) are
      key enzymes that catabolize thiopurines. Decreased or no-function alleles
      in TPMT and NUDT15 are associated with reduced or no enzyme activity and
      predictive of pronounced adverse effects, including severe
      myelosuppression, that may occur among individuals treated with standard
      doses of thiopurines.
    explanation: >-
      The consensus dosing guideline states the TPMT mechanism and the
      myelosuppression consequence. Evidence source is OTHER because this is a
      guideline rather than a primary study.
- name: NUDT15 pharmacogenomic susceptibility
  gene_term:
    preferred_term: NUDT15
    term:
      id: hgnc:23063
      label: NUDT15
  association: Reduced-function NUDT15 alleles increase thiopurine-associated neutropenia risk
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  notes: >-
    NUDT15 is one of the two enzymes that catabolise thiopurines, and the
    c.415C>T (p.Arg139Cys) allele carries most of the thiopurine-toxicity signal
    in East Asian populations, where TPMT variants are less frequent than in
    people of European descent while thiopurine-induced leukopenia is more
    common. The effect size is larger for leukopenia than for neutropenia in the
    leukaemia meta-analysis below, so the two endpoints should not be quoted
    interchangeably.
  variants:
  - name: NUDT15 c.415C>T (p.Arg139Cys)
    description: >-
      The allele carrying most of the reported thiopurine myelosuppression
      signal in acute lymphoblastic leukaemia cohorts.
  evidence:
  - reference: PMID:37794799
    reference_title: "Association of NUDT15 gene polymorphism with adverse reaction, treatment efficacy, and dose of 6-mercaptopurine in patients with acute lymphoblastic leukemia: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found 9-fold higher risk of 6-MP induced leukopenia (odds ratio [OR] =9.00, 95% confidence interval [CI]: 3.73-21.74) and 2.5-fold higher risk of 6-MP-induced neutropenia (OR=2.52, 95% CI: 1.72-3.69) for NUDT15 c.415C>T variant carriers in the dominant model."
    explanation: >-
      Quantifies the neutropenia-specific risk in patients receiving
      mercaptopurine as leukaemia chemotherapy, which is the exposure and the
      endpoint this entry is about.
  - reference: PMID:25108385
    reference_title: A common missense variant in NUDT15 confers susceptibility to thiopurine-induced leukopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite a lower frequency of TPMT mutations in Asians, the incidence of thiopurine-induced leukopenia is higher in Asians than in individuals of European descent."
    explanation: >-
      Supports the population asymmetry stated in the notes, which is why NUDT15
      rather than TPMT carries most of the signal in East Asian cohorts.
  - reference: PMID:25108385
    reference_title: A common missense variant in NUDT15 confers susceptibility to thiopurine-induced leukopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a nonsynonymous SNP in NUDT15 (encoding p.Arg139Cys) that was strongly associated with thiopurine-induced early leukopenia (odds ratio (OR) = 35.6; P(combined) = 4.88 × 10(-94))."
    explanation: >-
      The founding association report for the allele, with a leukopenia rather
      than a neutropenia endpoint.
  - reference: PMID:41618934
    reference_title: "Clinical Pharmacogenetics Implementation Consortium (CPIC) Guideline for Thiopurine Dosing Based on TPMT and NUDT15 Genotypes: 2025 Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thiopurine methyltransferase (TPMT) and Nudix hydrolase 15 (NUDT15) are
      key enzymes that catabolize thiopurines. Decreased or no-function alleles
      in TPMT and NUDT15 are associated with reduced or no enzyme activity and
      predictive of pronounced adverse effects, including severe
      myelosuppression, that may occur among individuals treated with standard
      doses of thiopurines.
    explanation: >-
      The consensus dosing guideline states the NUDT15 mechanism and the
      myelosuppression consequence. Evidence source is OTHER because this is a
      guideline rather than a primary study.
treatments:
- name: Trilaciclib
  description: >-
    A short-acting intravenous CDK4/6 inhibitor given before chemotherapy rather
    than as treatment for established neutropenia. It holds haematopoietic stem
    and progenitor cells in a transient, reversible G1 arrest for the duration of
    cytotoxic exposure, so the marrow is protected without altering the
    chemotherapy regimen. Approved in the USA in February 2021 for extensive-stage
    small cell lung cancer receiving platinum/etoposide or topotecan. This is
    prophylactic myeloprotection, mechanistically distinct from G-CSF, which
    accelerates recovery after the injury has occurred.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Cell-cycle-dependent vulnerability of proliferating progenitors
    treatment_effect: INHIBITS
    description: >-
      CDK4/6 inhibition arrests progenitors in G1, removing them from the cycling
      state on which cytotoxic injury depends.
  evidence:
  - reference: PMID:33861388
    reference_title: "Trilaciclib: First Approval."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In February 2021, trilaciclib received its first approval in the USA to
      decrease the incidence of chemotherapy-induced myelosuppression in adult
      patients when administered prior to a platinum/etoposide-containing regimen
      or topotecan-containing regimen for extensive-stage small cell lung cancer
      (ES-SCLC).
    explanation: >-
      Establishes the approved indication and the pre-chemotherapy timing that
      distinguishes myeloprotection from post-hoc rescue.
  - reference: PMID:31504118
    reference_title: "Myelopreservation with the CDK4/6 inhibitor trilaciclib in patients with small-cell lung cancer receiving first-line chemotherapy: a phase Ib/randomized phase II trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Trilaciclib clinically and significantly reduced both the duration of
      severe neutropenia (DSN) in cycle 1, a surrogate for febrile neutropenia
      (FN) and infections, and the occurrence of severe neutropenia (SN)
    explanation: >-
      The pivotal randomized evidence for the neutrophil endpoint this entry is
      about, reporting reductions in both the duration and the occurrence of
      severe neutropenia. This is the primary trial underlying the approval that
      PMID:33861388 reports.
  - reference: PMID:31504118
    reference_title: "Myelopreservation with the CDK4/6 inhibitor trilaciclib in patients with small-cell lung cancer receiving first-line chemotherapy: a phase Ib/randomized phase II trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For those patients in the trilaciclib group who did experience SN, the
      duration of those events was shorter compared with placebo (median
      duration of 3 versus 8 days).
    explanation: >-
      Quantifies the residual benefit in patients who still developed severe
      neutropenia, showing the effect is a shift in severity rather than a
      binary prevention.
  - reference: PMID:34408488
    reference_title: "Myeloprotective Effects of Trilaciclib Among Patients with Small Cell Lung Cancer at Increased Risk of Chemotherapy-Induced Myelosuppression: Pooled Results from Three Phase 2, Randomized, Double-Blind, Placebo-Controlled Studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Across FN risk factors and categories, trilaciclib had beneficial effects
      on neutrophil-related endpoints vs placebo, with greater effects observed
      in patients at higher risk of FN.
    explanation: >-
      Pooled placebo-controlled phase 2 evidence for the neutrophil-specific
      benefit, which is the endpoint this entry is about.
  notes: >-
    therapeutic_agent is deliberately omitted: no verified CHEBI or NCIT CURIE
    for trilaciclib was available from the local caches, and the ontology service
    was unreachable at curation time. A guessed identifier would be worse than
    none; this should be bound once the term can be checked.
- name: Granulocyte colony-stimulating factor (G-CSF)
  target_mechanisms:
  - target: Bone marrow granulopoietic suppression
    treatment_effect: RESTORES
    description: >-
      G-CSF drives granulocytic differentiation and release from the surviving
      progenitor pool, shortening the depth and duration of the neutrophil nadir
      after the marrow injury has already occurred.
  description: >-
    Prophylactic or therapeutic G-CSF (filgrastim, lenograstim, pegfilgrastim)
    reduces the incidence and duration of chemotherapy-induced neutropenia and
    febrile neutropenia.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: filgrastim
      term:
        id: NCIT:C1474
        label: Filgrastim
  evidence:
  - reference: PMID:21095116
    reference_title: "2010 update of EORTC guidelines for the use of granulocyte-colony stimulating factor to reduce the incidence of chemotherapy-induced febrile neutropenia in adult patients with lymphoproliferative disorders and solid tumours."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      prophylactic treatment with granulocyte-colony stimulating factors
      (G-CSFs), such as filgrastim (including approved biosimilars), lenograstim
      or pegfilgrastim is available to reduce the risk of chemotherapy-induced
      neutropenia
    explanation: >-
      The EORTC guideline identifies prophylactic G-CSF as the standard
      intervention to reduce chemotherapy-induced neutropenia. Evidence source is
      OTHER because this is a guideline document.
notes: >-
  This entry has no gene-defined subtypes, and it should not acquire any. It
  models an acquired drug toxicity: the lesion is cytotoxic injury to cycling
  marrow progenitors, and the host genetics that matter are the
  drug-inactivating enzymes that set how much active drug the progenitors see.
  Those are carried in genetic[] as RISK_FACTOR relationships wired to the
  pharmacogenetic node, which is the accurate claim - a reduced-function
  UGT1A1, DPYD, TPMT or NUDT15 allele does nothing without the drug, and causes
  no disease in an unexposed carrier.

  The inherited severe congenital neutropenia syndromes are a different kind of
  disease and belong in their own entries. Each is a germline Mendelian
  disorder of granulopoiesis present from birth and independent of any drug;
  dismech already curates one of them in full as
  Severe_Congenital_Neutropenia_1_Autosomal_Dominant, anchored on MONDO:0042490
  and modelled as a sibling of the others rather than as a subtype of anything
  acquired. Stubs exist for WHIM syndrome 1 and for CSF3R-deficiency severe
  congenital neutropenia. MONDO:1060165 ELANE-related neutropenia is the parent
  of MONDO:0042490, so the ELANE arm is covered by that entry.

  Those syndromes reach this entry only through the ontology anchor, which is
  why the anchor was corrected. Every one of ELANE-related neutropenia,
  Kostmann syndrome, WHIM syndrome 1, X-linked severe congenital neutropenia,
  the CSF3R, CXCR2 and JAGN1 recessive forms, congenital
  neutropenia-myelofibrosis-nephromegaly syndrome, severe congenital
  neutropenia 2, 8, 9 and 12, and poikiloderma with neutropenia is an is_a
  descendant of MONDO:0001475 neutropenia, the term this entry used to bind as
  its `disease_term`. Binding that term asserted identity with the general
  neutropenia class and so made every inherited neutropenia look like a subtype
  of chemotherapy toxicity. The binding has been replaced by a broadMatch
  cross-reference; see mappings.mondo_mappings for the searches establishing
  that MONDO has no drug-induced neutropenia class to bind instead.

  The GeneReviews baseline check matches the chapter titled ELANE-Related
  Neutropenia against this entry on the word "neutropenia". That chapter is
  about the inherited ELANE disease, not about chemotherapy toxicity, so it is
  deliberately neither cited nor tagged here. There is no GeneReviews chapter
  for chemotherapy-induced neutropenia, which is expected: GeneReviews covers
  heritable disorders.

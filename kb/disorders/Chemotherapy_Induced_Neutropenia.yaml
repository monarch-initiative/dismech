name: Chemotherapy-Induced Neutropenia
creation_date: "2026-06-24T00:00:00Z"
category: Complex
categories:
- Treatment-Related Disorder
- Hematologic Toxicity
- Adverse Drug Reaction
synonyms:
- CIN
- chemotherapy-induced neutropenia
description: >-
  Chemotherapy-induced neutropenia is a treatment-related hematologic toxicity of
  cytotoxic antineoplastic therapy. Myelosuppressive chemotherapy damages
  proliferating hematopoietic progenitors in the bone marrow, suppressing
  granulopoiesis and producing a fall in the circulating neutrophil count. It is
  the single-lineage-predominant expression of the conserved myelosuppression
  mechanism, and its principal danger is febrile neutropenia and infection, which
  drives dose delays and reductions that can compromise antitumor treatment.
parents:
- Hematologic Disease
- Iatrogenic condition
disease_term:
  preferred_term: chemotherapy-induced neutropenia
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0001475
      label: neutropenia
    mapping_predicate: skos:broadMatch
    mapping_source: dismech curation
    mapping_justification: >-
      MONDO has no class for chemotherapy-induced or drug-induced neutropenia,
      so this entry carries no `disease_term` binding and is cross-referenced to
      the neutropenia parent instead. MONDO:0001475 is broader than this entry
      in two directions at once: it is aetiology-agnostic, and it is the parent
      of the whole inherited severe-congenital-neutropenia series. broadMatch is
      used deliberately rather than closeMatch or narrowMatch - per CLAUDE.md
      only exactMatch and narrowMatch retire a mapped concept from the curation
      queue, and curating a drug toxicity does not curate the general
      neutropenia concept. Rebind `disease_term` if MONDO ever creates a
      drug-induced neutropenia class.
    consistency:
    - reference: MONDO
      consistent: MISSING
      notes: >-
        Searched in the OAK MONDO build. `search "neutropenia"` returns
        MONDO:0001475 alone; the synonym-inclusive `search "t~neutropenia"`
        returns congenital, familial, cyclic and syndromic neutropenias only.
        `t~chemotherapy-induced neutropenia`, `t~drug-induced neutropenia`,
        `t~drug induced neutropenia`, `t~myelosuppression` and
        `t~febrile neutropenia` each return nothing.
        `t~chemotherapy-induced` returns five terms - alopecia, hypertension,
        oral mucositis, neuropathy and the generic MONDO:0800390
        chemotherapy-induced toxicity, which MONDO files under poisoning - and
        no neutropenia term. `t~agranulocytosis` returns MONDO:0021758 acquired
        agranulocytosis, whose MONDO definition is "Agranulocytosis that is
        autoimmune in origin", so it does not cover this entry either.
pathophysiology:
- name: Host pharmacogenetic variation in cytotoxic drug inactivation
  biological_scale: MOLECULAR
  role: modifier
  description: >-
    How much active cytotoxic drug the marrow actually sees for a given
    administered dose is set in part by the patient's own drug-inactivating
    enzymes. Reduced-function germline alleles in the enzyme that clears a given
    agent raise systemic exposure to the active species and so deepen the
    progenitor injury downstream: UGT1A1 glucuronidates SN-38, the active
    metabolite of irinotecan; dihydropyrimidine dehydrogenase, encoded by DPYD,
    is the rate-limiting step in fluorouracil catabolism; and TPMT and NUDT15
    between them catabolise thiopurines. This is the step that pre-treatment
    pharmacogenomic testing acts on: it changes the starting dose rather than
    the drug, and unlike every node downstream of it, it is determined by the
    patient's germline rather than by the treatment.
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
    modifier: DECREASED
  genes:
  - preferred_term: UGT1A1
    term:
      id: hgnc:12530
      label: UGT1A1
  - preferred_term: DPYD
    term:
      id: hgnc:3012
      label: DPYD
  - preferred_term: TPMT
    term:
      id: hgnc:12014
      label: TPMT
  - preferred_term: NUDT15
    term:
      id: hgnc:23063
      label: NUDT15
  evidence:
  - reference: PMID:11990381
    reference_title: "UGT1A1*28 polymorphism as a determinant of irinotecan disposition and toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      screening for UGT1A1*28 polymorphism may identify patients with lower
      SN-38 glucuronidation rates and greater susceptibility to irinotecan
      induced gastrointestinal and bone marrow toxicity.
    explanation: >-
      Links a reduced-function allele to lower inactivation of the active
      metabolite and to greater marrow toxicity, which is the claim this node
      makes.
  - reference: PMID:12209976
    reference_title: "Increased risk of grade IV neutropenia after administration of 5-fluorouracil due to a dihydropyrimidine dehydrogenase deficiency: high prevalence of the IVS14+1g>a mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dihydropyrimidine dehydrogenase (DPD) is the initial and rate-limiting
      enzyme in the catabolism of 5-fluorouracil (5-FU), and it is suggested
      that patients with a partial deficiency of this enzyme are at risk of
      developing severe 5-FU-associated toxicity.
    explanation: >-
      States the rate-limiting inactivation step for fluorouracil and ties
      partial enzyme deficiency to severe toxicity.
  - reference: PMID:41618934
    reference_title: "Clinical Pharmacogenetics Implementation Consortium (CPIC) Guideline for Thiopurine Dosing Based on TPMT and NUDT15 Genotypes: 2025 Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thiopurine methyltransferase (TPMT) and Nudix hydrolase 15 (NUDT15) are
      key enzymes that catabolize thiopurines. Decreased or no-function alleles
      in TPMT and NUDT15 are associated with reduced or no enzyme activity and
      predictive of pronounced adverse effects, including severe
      myelosuppression, that may occur among individuals treated with standard
      doses of thiopurines.
    explanation: >-
      Names TPMT and NUDT15 as the thiopurine-catabolising enzymes and links
      reduced-function alleles to severe myelosuppression. Evidence source is
      OTHER because this is a consensus dosing guideline.
  downstream:
  - target: Cytotoxic chemotherapy exposure and hematopoietic progenitor injury
    causal_link_type: DIRECT
    description: >-
      Reduced inactivation raises the active-drug exposure the marrow receives
      for an unchanged administered dose, amplifying the progenitor injury
      rather than creating it.
- name: Cytotoxic chemotherapy exposure and hematopoietic progenitor injury
  biological_scale: CELLULAR
  conforms_to: "myelosuppression#Cytotoxic Insult to Proliferating Hematopoietic Progenitors"
  description: >-
    Myelosuppressive chemotherapy delivers cytotoxic drugs to the bone marrow,
    where rapidly proliferating hematopoietic stem and progenitor cells are
    preferentially injured — the conserved initiating lesion of the
    myelosuppression module, here viewed through its granulocytic consequence.
  role: trigger
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  - preferred_term: hematopoietic progenitor cell
    term:
      id: CL:0008001
      label: hematopoietic precursor cell
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:34307165
    reference_title: "Improving Outcomes of Chemotherapy: Established and Novel Options for Myeloprotection in the COVID-19 Era."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Proliferating hematopoietic stem and progenitor cells (HSPCs) in the bone
      marrow are particularly susceptible to chemotherapy-induced damage.
    explanation: >-
      Establishes chemotherapy injury to proliferating marrow progenitors as the
      initiating lesion, matching the module trigger node this disease conforms
      to. Evidence source is OTHER because this is a review article.
  - reference: PMID:31504118
    reference_title: "Myelopreservation with the CDK4/6 inhibitor trilaciclib in patients with small-cell lung cancer receiving first-line chemotherapy: a phase Ib/randomized phase II trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chemotherapy-induced damage of hematopoietic stem and progenitor cells
      (HSPC) causes multi-lineage myelosuppression.
    explanation: >-
      A human clinical trial frames chemotherapy-induced HSPC damage as the cause
      of myelosuppression, of which neutropenia is the predominant lineage here.
  - reference: PMID:31988457
    reference_title: "On-chip recapitulation of clinical bone marrow toxicities and patient-specific pathophysiology."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      a vascularized human BM-on-a-chip (BM chip) supports the differentiation
      and maturation of multiple blood cell lineages over 4 weeks while improving
      CD34+ cell maintenance, and that it recapitulates aspects of BM injury,
      including myeloerythroid toxicity after clinically relevant exposures to
      chemotherapeutic drugs and ionizing radiation, as well as BM recovery after
      drug-induced myelosuppression
    explanation: >-
      New Approach Methodology (NAM) evidence (Wyss Institute human bone-marrow
      organ-on-chip, the "bone marrow" example highlighted in Don Ingber's
      NAMeRS 2026 case study on real-world human-chip implementation). A
      vascularized human BM chip recapitulates clinically relevant
      chemotherapeutic- and radiation-induced myelosuppression of proliferating
      hematopoietic progenitors — and subsequent recovery — providing a
      human-specific microphysiological model of the initiating marrow lesion of
      chemotherapy-induced neutropenia without animal testing.
  downstream:
  - target: Cell-cycle-dependent vulnerability of proliferating progenitors
    causal_link_type: DIRECT
    description: >-
      Cytotoxic agents act on cells traversing S phase and mitosis, so the injury
      is conditional on the progenitor pool actively cycling.
- name: Cell-cycle-dependent vulnerability of proliferating progenitors
  description: >-
    Marrow toxicity is not simply a matter of drug reaching the bone marrow: it
    depends on the haematopoietic stem and progenitor pool being in active cell
    cycle when the cytotoxic agent arrives. That cell-cycle dependence is what
    makes the marrow a preferential target, and it is also a pharmacologically
    addressable step - holding progenitors in G1 for the duration of drug
    exposure protects them without changing the drug or its dose.
  role: mechanism
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  - preferred_term: hematopoietic progenitor cell
    term:
      id: CL:0008001
      label: hematopoietic precursor cell
  biological_processes:
  - preferred_term: cell cycle
    term:
      id: GO:0007049
      label: cell cycle
  evidence:
  - reference: PMID:33861388
    reference_title: "Trilaciclib: First Approval."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      trilaciclib induces a transient, reversible G1 cell cycle arrest of
      proliferating haematopoietic stem and progenitor cells in bone marrow,
      thus protecting them from damage during chemotherapy
    explanation: >-
      Pharmacological demonstration that the vulnerability is cell-cycle
      dependent: removing progenitors from cycle protects them from an otherwise
      unchanged chemotherapy exposure, which is the evidence that this is a
      distinct mechanistic step rather than a restatement of the trigger.
  downstream:
  - target: Bone marrow granulopoietic suppression
    causal_link_type: DIRECT
    description: >-
      Loss of cycling progenitors depletes the granulocytic pool the marrow can
      produce.
- name: Bone marrow granulopoietic suppression
  biological_scale: TISSUE
  conforms_to: "myelosuppression#Bone Marrow Hematopoietic Suppression"
  description: >-
    Loss of functional progenitors suppresses bone marrow hematopoietic output.
    In this entry the suppression is viewed through its effect on granulopoiesis,
    reducing the marrow's capacity to replace circulating neutrophils.
  role: central_effector
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:
  - preferred_term: hemopoiesis
    term:
      id: GO:0030097
      label: hemopoiesis
    modifier: DECREASED
  evidence:
  - reference: PMID:40057216
    reference_title: "Marrow adipogenic lineage precursors (MALPs) facilitate bone marrow recovery after chemotherapy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The resultant bone marrow suppression is a major dose-limiting side effect.
    explanation: >-
      Identifies marrow suppression as the dose-limiting consequence of
      chemotherapy hematopoietic toxicity, matching the module central-effector
      node. Evidence source is MODEL_ORGANISM (mouse 5-fluorouracil study).
  downstream:
  - target: Peripheral neutropenia
    description: >-
      Suppressed granulopoiesis lowers the circulating neutrophil count.
- name: Peripheral neutropenia
  biological_scale: ORGANISM
  conforms_to: "myelosuppression#Multilineage Peripheral Cytopenias"
  description: >-
    Reduced marrow output lowers the circulating neutrophil count. This node
    specializes the module's multilineage-cytopenia effector to the neutrophil
    lineage, the predominant and most clinically consequential cytopenia for many
    regimens.
  role: effector
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: myeloid cell homeostasis
    term:
      id: GO:0002262
      label: myeloid cell homeostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:34307165
    reference_title: "Improving Outcomes of Chemotherapy: Established and Novel Options for Myeloprotection in the COVID-19 Era."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      one of the most common side effects of chemotherapy is myelosuppression,
      which typically manifests as neutropenia, anemia, thrombocytopenia, and/or
      lymphopenia
    explanation: >-
      Lists neutropenia among the manifestations of chemotherapy-induced
      myelosuppression, the lineage specialized in this node. Evidence source is
      OTHER because this is a review article.
  downstream:
  - target: Febrile neutropenia and infection susceptibility
    description: >-
      A low neutrophil count raises the risk of infection and febrile
      neutropenia.
  - target: Neutropenia
    causal_link_type: DIRECT
    description: >-
      The fall in circulating neutrophils is what is measured as the defining
      laboratory abnormality of this toxicity.
- name: Febrile neutropenia and infection susceptibility
  biological_scale: ORGANISM
  conforms_to: "myelosuppression#Cytopenia-Related Clinical Complications"
  description: >-
    Neutropenia impairs host defense, raising the risk of infection and febrile
    neutropenia — the principal driver of morbidity and mortality and the reason
    chemotherapy doses are delayed or reduced.
  role: consequence
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: leukocyte mediated immunity
    term:
      id: GO:0002443
      label: leukocyte mediated immunity
    modifier: DECREASED
  evidence:
  - reference: PMID:21095116
    reference_title: "2010 update of EORTC guidelines for the use of granulocyte-colony stimulating factor to reduce the incidence of chemotherapy-induced febrile neutropenia in adult patients with lymphoproliferative disorders and solid tumours."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chemotherapy-induced neutropenia is a major risk factor for
      infection-related morbidity and mortality and also a significant
      dose-limiting toxicity in cancer treatment.
    explanation: >-
      Establishes neutropenia as the driver of infection-related morbidity and as
      a dose-limiting toxicity, the consequence captured by the module node.
      Evidence source is OTHER because this is a guideline document.
  - reference: PMID:38587388
    reference_title: "The impact of myelosuppression on quality of life of patients treated with chemotherapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Neutropenia increases infection risk, and anemia frequently results in
      debilitating fatigue.
    explanation: >-
      Maps neutropenia to its characteristic infection complication. Evidence
      source is OTHER because this is a review article.
  downstream:
  - target: Recurrent infections
    causal_link_type: DIRECT
    description: >-
      Impaired neutrophil-mediated host defence is what presents clinically as
      increased susceptibility to infection.

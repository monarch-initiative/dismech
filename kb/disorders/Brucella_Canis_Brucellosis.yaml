name: Brucella Canis Brucellosis
creation_date: "2026-09-30T00:16:17Z"
description: >-
  Brucella canis brucellosis is a dog-associated form of human brucellosis
  caused by the facultatively intracellular bacterium Brucella canis after
  zoonotic exposure to infected dogs, canine reproductive fluids, blood, or
  laboratory cultures.
category: Infectious Disease
disease_term:
  preferred_term: Brucella canis brucellosis
  term:
    id: MONDO:0001857
    label: Brucella canis brucellosis
parents:
- Brucellosis
synonyms:
- B. canis infection
notes: >-
  The Falcon deep-research request fell back to OpenScientist. All 25 reported
  PMIDs resolved, but two reported exact quotes from PMID:33002657 and
  PMID:36862545 were unsupported and were not used. The report was heavily
  focused on canine reproductive, skeletal, ocular, and treatment findings; this
  entry uses the dog literature only for the reservoir, zoonotic-exposure, and B.
  canis-specific macrophage-survival biology that are relevant to human B. canis
  brucellosis. The report's NCIT:C299, NCIT:C864, and NCIT:C793 drug leads were
  not used because they resolved to unrelated ontology terms. preflight-dr
  skipped automated gene identity checks because MONDO:0001857 records no causal
  gene; manual review confirmed the report covered Brucella canis brucellosis.
infectious_agent:
- name: Brucella canis
  infectious_agent_term:
    preferred_term: Brucella canis
    term:
      id: NCBITaxon:36855
      label: Brucella canis
  description: >-
    Facultatively intracellular Brucella species adapted to dogs that can cause
    human brucellosis after zoonotic spillover.
  evidence:
  - reference: PMID:36892988
    reference_title: >-
      Antibody response over time correlated with treatment outcome in 30 dogs
      naturally infected with Brucella canis (2017-2022).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Brucella canis is a zoonotic bacterial pathogen of dogs that is notoriously
      difficult to diagnose and treat.
    explanation: >-
      Identifies B. canis as a dog-associated zoonotic bacterial pathogen.
agent_life_cycle:
  description: >-
    B. canis is maintained in infected dogs, particularly intact breeding or
    stray dogs, and humans are incidental hosts after occupational, household, or
    laboratory exposure to infected dogs or canine samples.
  hosts:
  - preferred_term: Homo sapiens
    role: incidental clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: dog
    role: primary reservoir host
    term:
      id: NCBITaxon:9615
      label: Canis lupus familiaris
  evidence:
  - reference: PMID:41957789
    reference_title: Discospondylitis caused by Brucella canis in a dog imported to Sweden.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mating is one of the main transmission routes, putting breeding dogs and
      stray dogs at risk of infection.
    explanation: >-
      Supports intact breeding and stray dogs as the host population in which B.
      canis circulates before zoonotic spillover to humans.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Dog-associated zoonotic exposure
  description: >-
    Humans acquire B. canis brucellosis through exposure to infected dogs or
    their reproductive fluids, blood, tissues, or laboratory cultures.
  evidence:
  - reference: PMID:36892988
    reference_title: >-
      Antibody response over time correlated with treatment outcome in 30 dogs
      naturally infected with Brucella canis (2017-2022).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Humans can become infected with B canis when an infected pet dog is brought
      into their home.
    explanation: >-
      Links infected pet dogs to household zoonotic transmission.
  - reference: PMID:24751191
    reference_title: Evidence for unapparent Brucella canis infections among adults with occupational exposure to dogs.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      306 adults with occupational exposure to dogs and 101 non-matched,
      non-canine-exposed subjects were enrolled.
    explanation: >-
      Establishes occupational dog contact as the exposure setting for human B.
      canis seroepidemiology.
pathophysiology:
- name: Dog-Associated Brucella canis Acquisition
  role: trigger
  description: >-
    B. canis enters the human host after dog-associated zoonotic exposure and
    establishes the species-specific form of brucellosis.
  biological_scale: ORGANISM
  downstream:
  - target: Intracellular Macrophage Survival
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Zoonotically acquired B. canis crosses a mucosal or cutaneous barrier and
      is taken up by phagocytes.
  evidence:
  - reference: PMID:24751191
    reference_title: Evidence for unapparent Brucella canis infections among adults with occupational exposure to dogs.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data add to a growing body of literature suggesting that people
      occupationally exposed to dogs may be at risk of unapparent B. canis
      infection.
    explanation: >-
      Connects dog-associated human exposure to unapparent B. canis infection.
- name: Intracellular Macrophage Survival
  description: >-
    Brucella survives in phagocytic host cells by avoiding lysosomal killing and
    establishing an intracellular replicative niche.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: Granulomatous Brucella canis Inflammation
    causal_link_type: DIRECT
    description: >-
      Intracellular persistence triggers a systemic inflammatory response.
  evidence:
  - reference: PMID:20083220
    reference_title: >-
      Cholesterol, ganglioside GM1 and class A scavenger receptor contribute to
      infection by Brucella ovis and Brucella canis in murine macrophages.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The establishment of infection by Brucella ovis and Brucella canis in
      J774.A1 macrophages was found to be dependent upon cholesterol and
      ganglioside GM(1), two components of lipid rafts.
    explanation: >-
      Demonstrates a B. canis macrophage-entry mechanism in vitro.
- name: Granulomatous Brucella canis Inflammation
  description: >-
    Persistent intracellular B. canis infection produces the systemic febrile
    inflammatory syndrome of human brucellosis and can seed focal complications.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:30015453
    reference_title: Brucella - Virulence Factors, Pathogenesis and Treatment.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most important feature of Brucella is the ability to survive and
      multiply within both phagocytic and non-phagocytic cells.
    explanation: >-
      Supports intracellular survival and multiplication as a Brucella-wide
      driver of persistent disease.
  - reference: PMID:30015453
    reference_title: Brucella - Virulence Factors, Pathogenesis and Treatment.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Major virulence factors are: lipopolysaccharide (LPS), T4SS secretion
      system and BvrR/BvrS system, which allow interaction with host cell
      surface, formation of an early, late BCV (Brucella Containing Vacuole) and
      interaction with endoplasmic reticulum (ER) when the bacteria multiply.
    explanation: >-
      Places Brucella intracellular persistence upstream of BCV maturation and
      endoplasmic-reticulum interaction.
diagnosis:
- name: Rough-antigen serology and culture/PCR
  description: >-
    Human B. canis brucellosis requires testing that can detect rough B. canis
    antigens, because conventional human smooth-Brucella serology can miss B.
    canis infection and low-level periodic bacteremia limits blood culture
    sensitivity.
  results: >-
    B. canis seroreactivity by rough-antigen assays or detection of Brucella
    canis by blood culture or molecular testing.
  evidence:
  - reference: PMID:24751191
    reference_title: Evidence for unapparent Brucella canis infections among adults with occupational exposure to dogs.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Human serological assays designed to detect brucellosis will miss
      infections caused by Brucella canis, and low levels of periodic bacteremia
      limit diagnosis by blood culture.
    explanation: >-
      Explains why B. canis diagnosis needs species-aware serology plus direct
      detection when available.
epidemiology:
- name: Occupational dog-exposed adults
  description: >-
    In a controlled seroepidemiologic study of adults occupationally exposed to
    dogs, B. canis seroprevalence varied by rough-antigen assay stringency and
    was highest by RSAT screening.
  evidence:
  - reference: PMID:24751191
    reference_title: Evidence for unapparent Brucella canis infections among adults with occupational exposure to dogs.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seroprevalence ranged from 10.8% (RSAT) to 3.6% (ME-RSAT) among
      canine-exposed subjects.
    explanation: >-
      Quantifies human B. canis seroreactivity in occupationally dog-exposed
      adults.
- name: Urban slum seropositivity
  description: >-
    Randomly sampled healthy residents of an urban slum in Salvador, Brazil
    included B. canis-seropositive people, indicating peridomestic zoonotic
    exposure in dog-dense urban environments.
  evidence:
  - reference: PMID:23000868
    reference_title: Serological trail of Brucella infection in an urban slum population in Brazil.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirteen percent (24/180) of the individuals were positive for B. abortus
      and 4.6 % (8/174) were positive for B. canis.
    explanation: >-
      Reports B. canis seropositivity among randomly selected human sera from a
      poor urban community in Salvador.

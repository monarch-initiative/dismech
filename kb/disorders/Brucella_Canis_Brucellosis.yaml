name: Brucella Canis Brucellosis
creation_date: "2026-09-30T00:16:17Z"
description: >-
  Brucella canis brucellosis is a dog-associated form of human brucellosis
  caused by the facultatively intracellular bacterium Brucella canis after
  zoonotic exposure to infected dogs, canine reproductive fluids, blood, or
  laboratory cultures.
category: Infectious Disease
disease_term:
  preferred_term: Brucella canis brucellosis
  term:
    id: MONDO:0001857
    label: Brucella canis brucellosis
parents:
- Brucellosis
synonyms:
- B. canis infection
notes: >-
  The Falcon deep-research request fell back to OpenScientist. All 25 reported
  PMIDs resolved, but two reported exact quotes from PMID:33002657 and
  PMID:36862545 were unsupported and were not used. The report was heavily
  focused on canine reproductive, skeletal, ocular, and treatment findings; this
  entry uses the dog literature only for the reservoir, zoonotic-exposure, and B.
  canis macrophage-entry biology that are relevant to human B. canis
  brucellosis. The report's NCIT:C299, NCIT:C864, and NCIT:C793 drug leads were
  not used because they resolved to unrelated ontology terms. preflight-dr
  skipped automated gene identity checks because MONDO:0001857 records no causal
  gene; manual review confirmed the report covered Brucella canis brucellosis.
infectious_agent:
- name: Brucella canis
  infectious_agent_term:
    preferred_term: Brucella canis
    term:
      id: NCBITaxon:36855
      label: Brucella canis
  description: >-
    Facultatively intracellular Brucella species adapted to dogs that can cause
    human brucellosis after zoonotic spillover.
  evidence:
  - reference: PMID:36892988
    reference_title: >-
      Antibody response over time correlated with treatment outcome in 30 dogs
      naturally infected with Brucella canis (2017-2022).
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Brucella canis is a zoonotic bacterial pathogen of dogs that is notoriously
      difficult to diagnose and treat.
    explanation: >-
      Identifies B. canis as a dog-associated zoonotic bacterial pathogen.
agent_life_cycle:
  description: >-
    B. canis is maintained in infected dogs, particularly intact breeding or
    stray dogs, and humans are incidental hosts after occupational, household, or
    laboratory exposure to infected dogs or canine samples.
  hosts:
  - preferred_term: Homo sapiens
    role: incidental clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: dog
    role: primary reservoir host
    term:
      id: NCBITaxon:9615
      label: Canis lupus familiaris
  evidence:
  - reference: PMID:41957789
    reference_title: Discospondylitis caused by Brucella canis in a dog imported to Sweden.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      Mating is one of the main transmission routes, putting breeding dogs and
      stray dogs at risk of infection.
    explanation: >-
      Supports intact breeding and stray dogs as the host population in which B.
      canis circulates before zoonotic spillover to humans.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Dog-associated zoonotic exposure
  description: >-
    Humans acquire B. canis brucellosis through exposure to infected dogs or
    their reproductive fluids, blood, tissues, or laboratory cultures.
  evidence:
  - reference: PMID:36892988
    reference_title: >-
      Antibody response over time correlated with treatment outcome in 30 dogs
      naturally infected with Brucella canis (2017-2022).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Humans can become infected with B canis when an infected pet dog is brought
      into their home.
    explanation: >-
      Links infected pet dogs to household zoonotic transmission.
  - reference: PMID:24751191
    reference_title: Evidence for unapparent Brucella canis infections among adults with occupational exposure to dogs.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      306 adults with occupational exposure to dogs and 101 non-matched,
      non-canine-exposed subjects were enrolled.
    explanation: >-
      Establishes occupational dog contact as the exposure setting for human B.
      canis seroepidemiology.
  - reference: PMID:40070936
    reference_title: "Brucellosis in humans caused by Brucella canis: A scoping review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A known or suspected source of exposure was reported for 56 cases; 45
      (80%) were linked to dogs and 11 (20%) to laboratory exposure.
    explanation: >-
      Summarizes the dominant reported sources of clinical B. canis infection in
      humans.
progression:
- phase: Acute clinical B. canis brucellosis
  notes: >-
    Recognized clinical infection can present acutely after dog or laboratory
    exposure with a nonspecific febrile brucellosis syndrome.
  evidence:
  - reference: PMID:40070936
    reference_title: "Brucellosis in humans caused by Brucella canis: A scoping review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Both chronic and acute presentations were described.
    explanation: The B. canis scoping review explicitly records acute clinical presentations.
- phase: Chronic or recurrent B. canis brucellosis
  notes: >-
    B. canis can cause prolonged or recurrent human illness, reflecting the same
    relapse-prone intracellular biology that defines other forms of human
    brucellosis.
  evidence:
  - reference: PMID:40070936
    reference_title: "Brucellosis in humans caused by Brucella canis: A scoping review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Both chronic and acute presentations were described. One noteworthy case
      described fever, malaise, and other clinical signs, recurrent for 19 y,
      that started when the individual attended an “animal-care school” and
      handled whelping dogs.
    explanation: >-
      The review documents chronic and recurrent human B. canis clinical
      presentations.
pathophysiology:
- name: Dog-Associated Brucella canis Acquisition
  role: trigger
  description: >-
    B. canis enters the human host after dog-associated zoonotic exposure or
    laboratory exposure and establishes the species-specific form of
    brucellosis.
  biological_scale: ORGANISM
  downstream:
  - target: Brucella canis Lipid-Raft Macrophage Entry
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Exposure to infected dogs, canine tissues, or laboratory cultures creates
      an opportunity for intracellular uptake by mononuclear phagocytes.
    evidence:
    - reference: PMID:40070936
      reference_title: "Brucellosis in humans caused by Brucella canis: A scoping review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        A known or suspected source of exposure was reported for 56 cases; 45
        (80%) were linked to dogs and 11 (20%) to laboratory exposure.
      explanation: >-
        Supports the exposure half of the route to B. canis intracellular
        infection in humans.
  evidence:
  - reference: PMID:24751191
    reference_title: Evidence for unapparent Brucella canis infections among adults with occupational exposure to dogs.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data add to a growing body of literature suggesting that people
      occupationally exposed to dogs may be at risk of unapparent B. canis
      infection.
    explanation: >-
      Connects dog-associated human exposure to unapparent B. canis infection.
- name: Brucella canis Lipid-Raft Macrophage Entry
  description: >-
    B. canis establishes infection in macrophages through host lipid-raft
    components, creating the intracellular compartment from which Brucella
    persistence begins.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
  downstream:
  - target: Intracellular Brucella canis Survival
    causal_link_type: DIRECT
    description: >-
      Lipid-raft-dependent entry places B. canis inside macrophages that provide
      the permissive cell context for Brucella survival.
  evidence:
  - reference: PMID:20083220
    reference_title: >-
      Cholesterol, ganglioside GM1 and class A scavenger receptor contribute to
      infection by Brucella ovis and Brucella canis in murine macrophages.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The establishment of infection by Brucella ovis and Brucella canis in
      J774.A1 macrophages was found to be dependent upon cholesterol and
      ganglioside GM(1), two components of lipid rafts.
    explanation: >-
      Demonstrates a B. canis macrophage-entry mechanism in vitro.
- name: Intracellular Brucella canis Survival
  description: >-
    Brucella survives in phagocytic host cells by avoiding lysosomal killing and
    establishing a Brucella-containing vacuole that matures into an
    endoplasmic-reticulum-associated replicative niche.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  downstream:
  - target: Systemic Febrile Brucella canis Illness
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Intracellular persistence supports bloodstream persistence and systemic
      dissemination, producing a nonspecific febrile clinical syndrome.
  evidence:
  - reference: PMID:30015453
    reference_title: Brucella - Virulence Factors, Pathogenesis and Treatment.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most important feature of Brucella is the ability to survive and
      multiply within both phagocytic and non-phagocytic cells.
    explanation: >-
      Supports intracellular survival and multiplication as a Brucella-wide
      driver of persistent disease.
  - reference: PMID:30015453
    reference_title: Brucella - Virulence Factors, Pathogenesis and Treatment.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Major virulence factors are: lipopolysaccharide (LPS), T4SS secretion
      system and BvrR/BvrS system, which allow interaction with host cell
      surface, formation of an early, late BCV (Brucella Containing Vacuole) and
      interaction with endoplasmic reticulum (ER) when the bacteria multiply.
    explanation: >-
      Places Brucella intracellular persistence upstream of BCV maturation and
      endoplasmic-reticulum interaction.
  - reference: PMID:8071593
    reference_title: >-
      Differentiated U937 cells exhibit increased bactericidal activity upon LPS
      activation and discriminate between virulent and avirulent Listeria and
      Brucella species.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      During infection, RA/VD-differentiated U937 could discriminate between the
      human pathogen Brucella suis S1, which strongly multiplied, and the animal
      pathogen Brucella canis, which survived without multiplication.
    explanation: >-
      Supports B. canis survival in a differentiated human macrophage-like cell
      model.
- name: Systemic Febrile Brucella canis Illness
  description: >-
    Persistent intracellular B. canis infection produces a nonspecific human
    brucellosis syndrome with fever, constitutional symptoms, lymphoreticular
    involvement, and occasional focal complications.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Fever
    description: B. canis infection commonly manifests as fever.
    evidence:
    - reference: PMID:40070936
      reference_title: "Brucellosis in humans caused by Brucella canis: A scoping review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Fever, fatigue, headache, chills, and malaise predominated.
      explanation: Fever was a predominant symptom in the B. canis scoping review.
  - target: Fatigue

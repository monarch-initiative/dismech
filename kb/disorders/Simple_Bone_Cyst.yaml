progression:
- phase: Active cyst
  notes: >-
    A cyst that lies within 5 mm of the growth plate is called active. In a
    series of 22 patients, active cysts were more likely to fracture.
  evidence:
  - reference: PMID:24570274
    reference_title: "Treatment of unicameral bone cyst: systematic review and meta analysis."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "UBC is classified as active when the distance is less than 5 mm, and latent when the distance is larger than 5 mm"
    explanation: >-
      The introduction of a 2014 meta-analysis gives the definition, citing
      earlier work: active when the cyst is less than 5 mm from the growth
      plate.
  - reference: PMID:19721142
    reference_title: "Active unicameral bone cysts in the upper limb are at greater risk of fracture."
    supports: SUPPORT
    directness: DIRECT

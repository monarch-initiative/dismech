- name: Round Cell Sarcoma with EWSR1-non-ETS Fusion
  description: >-
    A rare sarcoma, arising mostly in long bones, that carries the same
    FUS-NFATC2 or EWSR1-NFATC2 fusion. The fusion alone therefore does not
    tell a cyst from a sarcoma, and the authors of one series stress that an
    NFATC2 rearrangement is not pathognomonic of malignancy. How the two
    lesions are related is not known. It is curated separately as Round Cell
    Sarcoma with EWSR1-non-ETS Fusion.
  distinguishing_features:
  - The fusion is amplified in the sarcomas and not in the cysts
  - NKX3.1 and NKX2.2 immunostaining, seen in the sarcomas, was absent in the two cysts tested in one series and in all cases of another
  - Copy-number profiles were simple in three cystic lesions and more complex in two sarcomas in a series of five patients

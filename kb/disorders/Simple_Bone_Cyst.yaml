name: Simple Bone Cyst
creation_date: '2026-11-11T01:43:19Z'
description: >-
  A simple bone cyst is a benign, fluid-filled, usually single-chambered
  cavity inside a bone. It is found mostly in children and adolescents, more
  often in boys, and most often in the metaphysis of the proximal humerus or
  the proximal femur. Many cysts cause no symptoms until the weakened bone
  breaks. The cause is not known. The older account holds that blocked venous
  drainage raises the pressure inside the bone and that bone-resorbing factors
  in the cyst fluid enlarge the cavity. Since 2020, a FUS-NFATC2 or
  EWSR1-NFATC2 gene fusion, or a rearrangement of FUS or EWSR1, has been found
  in roughly half to two thirds of the cysts tested outside the jaw (4 of 9 at
  the lowest and 6 of 9 at the highest in five small series), which the
  authors of those studies read as showing that the cyst is a neoplasm. The
  cysts of the jaw tested so far lack the fusion, and the same fusions occur
  in a rare round cell sarcoma. Treatment is debated: the one randomised trial
  compared two kinds of injection, and a Cochrane review found no consensus on
  the best procedure.
categories:
- Benign Bone Lesion
- Bone Cyst
synonyms:
- solitary bone cyst
- unicameral bone cyst
- SBC
- UBC
parents:
- bone neoplasm
notes: >-
  Name. The entry is named as the literature and the NCI Thesaurus name the
  lesion (NCIT:C2904, Simple Bone Cyst). MONDO labels the same term solitary
  bone cyst, and the orthopaedic literature also calls it unicameral bone
  cyst; both are kept as synonyms.

  Whether it is a neoplasm. MONDO files the term under bone neoplasm, with an
  editor's note that the neoplastic nature is not defined in the NCI
  Thesaurus, which places it among bone tumours of undefined neoplastic nature
  (both read through OLS on 11 November 2026). The parent given here follows
  MONDO. The question itself is open and is recorded in the hypotheses and in
  a discussion.

  Scope. The entry covers the cyst of the long bones and of the other sites
  that the series cited include, such as the pelvis and the calcaneus. The
  cyst of the jaw, formerly called traumatic bone cyst, appears only through
  the finding that it lacks the NFATC2 rearrangement; whether it is the same
  disease is part of the open question.

  Sources. The figures come from retrospective series, one randomised trial, a
  meta-analysis of retrospective studies and reviews. Each explanation gives
  the size of the series it quotes.

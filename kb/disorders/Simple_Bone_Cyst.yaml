- name: Histopathological Examination
  description: >-
    The wall of the cyst is made of fibrous tissue with fibrin-like collagen
    deposits, bone-like matrix and occasional woven bone. The fibrin-like
    deposits were found in 8 of 11 simple bone cysts in a prospective series,
    and also in 3 of 8 aneurysmal bone cysts, so they are not specific. In
    cysts of the calcaneus, cholesterol clefts were seen in 10 of 16, and in
    none of the long-bone cysts of the same study.

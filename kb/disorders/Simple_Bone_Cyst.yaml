- hypothesis_group_id: neoplastic_nfatc2_fusion
  hypothesis_label: The cyst is a neoplasm defined by an NFATC2 gene fusion
  status: EMERGING
  description: >-
    Proposed since 2020, when FUS-NFATC2 and EWSR1-NFATC2 fusions were found
    in simple bone cysts. In favour: the fusion is recurrent, it was found in
    a large proportion of the cysts in five series, and its breakpoints are
    identical to those in the sarcomas that carry it. Against a settled
    answer: a substantial share of the long-bone cysts tested had no fusion,
    the nine cysts of the jaw that could be tested had none, which their
    authors read as support for a reactive origin at that site, and a 2026
    clinical review still describes the cyst as histologically non-neoplastic.
    No study cited shows how the fusion would produce a cyst. The one edge of
    this hypothesis runs from NFATC2 Gene Fusion to Bone Cyst.
  evidence:
  - reference: PMID:32991339
    reference_title: "FUS-NFATC2 or EWSR1-NFATC2 Fusions Are Present in a Large Proportion of Simple Bone Cysts."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "At least a large subset of SBCs represents cystic neoplasms characterized by FUS-NFATC2 or EWSR1-NFATC2 fusions"
    explanation: >-
      The first study concludes that at least a large subset of the cysts are
      cystic neoplasms.
  - reference: PMID:33316098
    reference_title: "Identification of EWSR1-NFATC2 fusion in simple bone cysts."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified three cases with EWSR1-NFATC2 fusion (showing identical breakpoints to those in EWSR1-NFATC2 sarcomas) and one additional case with FUS rearrangement."
    explanation: >-
      The breakpoints of the EWSR1-NFATC2 fusion in the cysts were identical
      to those in the sarcomas.
  - reference: PMID:36939112
    reference_title: "No NFATC2 fusion in simple bone cyst of the jaw."
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest that SBC presenting in the jaw is molecularly different from SBC in long bones. Future molecular studies may confirm the absence of clonal molecular aberrations in SBC of the jaw which would support a non-neoplastic, reactive origin."
    explanation: >-
      The study of jaw cysts: the cyst of the jaw is molecularly different
      from that of the long bones, and its authors suggest a non-neoplastic,
      reactive origin there. Evidence against the hypothesis for that site.
  - reference: PMID:42063443
    reference_title: "Management strategies and outcomes of pediatric unicameral bone cyst: a narrative review."
    supports: REFUTE
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Although histologically non-neoplastic, these cysts can weaken bone structure and predispose patients to pathological fractures."
    explanation: >-
      A 2026 clinical review still calls the cyst histologically
      non-neoplastic. It does not discuss the fusion.
phenotypes:
- category: Skeletal
  name: Bone Cyst
  description: >-
    A cavity inside the bone, lined by a fibrous membrane and filled with
    serosanguinous fluid. It lies in the metaphysis of a long bone, next to
    the growth plate, most often in the humerus or the femur. In most cases it
    causes no symptoms until the bone breaks.
  phenotype_term:
    preferred_term: simple bone cyst
    term:
      id: HP:0012062
      label: Bone cyst
  sequelae:
  - target: Pathological Fracture
    causal_link_type: DIRECT
    description: >-
      The cyst weakens the bone, which then breaks.
    evidence:
    - reference: PMID:42063443
      reference_title: "Management strategies and outcomes of pediatric unicameral bone cyst: a narrative review."
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "Although histologically non-neoplastic, these cysts can weaken bone structure and predispose patients to pathological fractures."
      explanation: >-
        A 2026 review: the cysts can weaken bone structure and predispose to
        pathological fractures.
    - reference: PMID:18381307
      reference_title: "A randomized clinical trial comparing intralesional bone marrow and steroid injections for simple bone cysts."
      supports: SUPPORT
      directness: DIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "Simple bone cysts are common benign lesions in growing children that predispose them to fracture and are sometimes painful."
      explanation: >-
        The background of the randomised trial: the cysts predispose growing
        children to fracture.
  evidence:
  - reference: PMID:34081036
    reference_title: "Expanding the Spectrum of EWSR1-NFATC2-rearranged Benign Tumors: A Common Genomic Abnormality in Vascular Malformation/Hemangioma and Simple Bone Cyst."

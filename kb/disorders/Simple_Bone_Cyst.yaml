      The authors of the fusion studies conclude that at least a large subset
      of simple bone cysts are cystic neoplasms defined by the fusion. The
      edge records that reading as a hypothesis. What the studies show is that
      the fusion is present in the lesion; none shows a step that leads from
      the fusion to a fluid-filled cavity, so the link is typed as indirect
      with unknown intermediates and its evidence as indirect.

- name: Decompression by Drilling or Cannulated Screw
  description: >-
    The cyst is opened to the marrow cavity, by multiple drill holes or by a
    cannulated screw left in place, to lower the pressure in it. Seven
    patients treated by multiple drilling in a 1983 study and 11 treated by
    trepanation in a 1993 study did well. A meta-analysis of retrospective
    studies gives a healing rate of 89 per cent for continuous decompression
    with cannulated screws.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: decompression of the cyst by drilling or cannulated screw
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_phenotypes:

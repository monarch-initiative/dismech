- name: Corticosteroid Injection
  description: >-
    Injection of methylprednisolone acetate into the cyst, repeated until the
    cyst heals. In the one randomised trial, 16 of 38 cysts had healed at two
    years, against 9 of 39 after bone marrow injection; the trial calls the
    healing rate low in both arms, and a Cochrane review rates the evidence as
    very low in quality. A meta-analysis of retrospective studies gives a
    pooled healing rate of 77.4 per cent. A 2024 review says the treatment is
    now used less, because of the repeated injections and the fractures that
    occur before healing. Why a steroid should work has not been shown.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methylprednisolone acetate
      term:
        id: CHEBI:6889
        label: methylprednisolone acetate

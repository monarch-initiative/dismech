- name: Curettage and Bone Grafting
  description: >-
    Open removal of the lining of the cyst, with filling of the cavity by bone
    graft or bone substitute. A meta-analysis of retrospective studies gives a
    healing rate of 90 per cent with autograft or allograft. Recurrence is the
    concern: 5 of 13 cysts recurred after curettage and bone substitute in one
    series, and of 106 children treated by surgery, 17 had recurred and 13 had
    not responded at 12 months. For cysts of the calcaneus, a systematic
    review found that 93.0 per cent had healed after surgery and 1.1 per cent
    under conservative treatment.
  action_category: THERAPEUTIC

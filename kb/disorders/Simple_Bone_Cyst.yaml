genetic:
- name: NFATC2
  association: FUS::NFATC2 or EWSR1::NFATC2 fusion
  relationship_type: BIOMARKER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: NFATC2
    term:
      id: hgnc:7776
      label: NFATC2
  notes: >-
    The 3' partner of the fusion, with FUS or EWSR1 as the 5' partner. The
    relationship is recorded as BIOMARKER because that is what the studies
    establish: the fusion helps to tell a simple bone cyst from its mimics.
    Their authors go further and read the fusion as proof that the cyst is a
    neoplasm; that reading is a hypothesis of this entry
    (neoplastic_nfatc2_fusion), and no study cited shows that the fusion
    drives the lesion. The same fusions occur in a round cell sarcoma, where
    they are amplified (see the differential diagnoses). No gene-disease
    validity assertion is recorded: the fusion is somatic.
  evidence:
  - reference: PMID:32991339
    reference_title: "FUS-NFATC2 or EWSR1-NFATC2 Fusions Are Present in a Large Proportion of Simple Bone Cysts."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted RNA sequencing showed a FUS-NFATC2 fusion in 4 of 11 SBCs and an EWSR1-NFATC2 fusion in 2 of 11 SBCs."
    explanation: >-
      The study that found the fusions: FUS-NFATC2 in four and EWSR1-NFATC2 in
      two of 11 cysts by RNA sequencing.
  - reference: PMID:33316098
    reference_title: "Identification of EWSR1-NFATC2 fusion in simple bone cysts."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "More than 40% of simple bone cysts harbour genetic alterations confirming that they are neoplastic, investigation of EWSR1 and/or FUS rearrangement may help to distinguish simple bone cysts from mimics, and NFATC2 rearrangement is not pathognomonic of malignancy."
    explanation: >-
      A second series: testing for the rearrangement may help to distinguish
      the cyst from its mimics, and the rearrangement does not mean
      malignancy.
  - reference: PMID:34089379

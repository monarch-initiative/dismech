mechanistic_hypotheses:
- hypothesis_group_id: venous_obstruction
  hypothesis_label: Blocked venous drainage of the bone raises the pressure in it and produces the cyst
  status: CANONICAL
  description: >-
    The account that reviews still give. Venous obstruction in the metaphysis
    is proposed to raise the pressure in the bone, to let fluid accumulate
    and, with the bone-resorbing factors in that fluid, to produce and enlarge
    the cavity. In favour: the pressure in the cysts was slightly higher than
    in the opposite limb, the fluid was poor in oxygen, and treatments that
    decompress the cyst are reported to work. Against a settled answer: the
    measurements were made in existing cysts, what obstructs the veins is not
    known, and reviews state that no theory of the origin of the cyst has been
    conclusive (see the discussions). It is marked CANONICAL because reviews
    present it as the accepted account, not because it is proven. Its two
    edges run from Venous Outflow Obstruction and Raised Intracystic Pressure
    to Bone Cyst and to Bone Resorption by Factors in the Cyst Fluid.
  evidence:
  - reference: PMID:38726993
    reference_title: "Modern treatment of unicameral and aneurysmatic bone cysts."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The high intraosseous pressure caused by venous obstruction and enzymatic lysis is considered responsible for UBC pathogenesis; therefore, the main factor to consider during the surgery is the decompression of the cyst"
    explanation: >-
      A 2024 treatment review states the account as the accepted one ('is
      considered responsible').
  - reference: PMID:6643570

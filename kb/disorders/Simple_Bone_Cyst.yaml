- name: Venous Outflow Obstruction and Raised Intracystic Pressure
  description: >-
    The older account of the cyst. In a 1983 study the pressure inside the
    cysts was slightly higher than the marrow pressure in the opposite limb,
    it fell as drill holes were made, and the oxygen tension of the cyst fluid
    was markedly lower than that of venous or arterial blood; the authors
    suggested that venous obstruction in the bone is the likely cause. Reviews
    still give this account: one states that high intraosseous pressure caused
    by venous obstruction, with enzymatic lysis, is considered responsible for
    the cyst, and another calls impaired venous drainage of the metaphysis a
    particularly compelling hypothesis. What obstructs the veins is not known.
  biological_scale: TISSUE
  locations:
  - preferred_term: metaphysis
    term:
      id: UBERON:0001438
      label: metaphysis
  evidence:
  - reference: PMID:6643570
    reference_title: "The aetiology and treatment of simple bone cysts."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The internal pressure of simple bone cysts was found to be slightly higher than the normal pressure of the bone marrow in the contralateral limb."
    explanation: >-
      A 1983 study that measured the pressure in the cysts: slightly higher
      than the marrow pressure of the opposite limb. The abstract gives no
      number of cysts measured.
  - reference: PMID:6643570
    reference_title: "The aetiology and treatment of simple bone cysts."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The PO2 of the cyst fluid was markedly lower than that of either venous or arterial blood measured synchronously."
    explanation: >-
      The same study: the oxygen tension of the cyst fluid was markedly lower
      than that of venous or arterial blood.

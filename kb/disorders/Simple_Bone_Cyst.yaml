    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Among these, the hypothesis of metaphyseal venous drainage impairment is particularly compelling, as UBCs commonly arise in the metaphysis."
    explanation: >-

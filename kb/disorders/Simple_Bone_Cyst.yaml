- name: Sites
  description: >-
    The proximal humerus and the femur are the usual sites. In a series of 68
    patients, 69.2 per cent of the cysts were in the proximal humerus and 16.2
    per cent in the femur. In a surgical cohort of 106 children, 53.8 per cent
    were humeral, 34.0 per cent femoral and 12.2 per cent at other sites. The
    calcaneus is the tarsal bone most often affected.

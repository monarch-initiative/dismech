- name: Bone Resorption by Factors in the Cyst Fluid
  description: >-
    The fluid of the cyst carries factors that resorb bone. A 1993 study found
    prostaglandins, interleukin 1 and proteolytic enzymes in it and proposed
    that the increase in bone-resorbing activity is one of the causes of the
    cyst. A 2012 study of the fluid of two cysts found three cytokines that
    promote osteoclast formation highly raised, and osteoclasts in abundance
    in the cyst lining.
  biological_scale: TISSUE

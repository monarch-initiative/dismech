pathophysiology:
- name: NFATC2 Gene Fusion
  description: >-
    A fusion of FUS or EWSR1 with NFATC2 is found in a large proportion of
    simple bone cysts of the long bones and pelvis. The first study found one
    in 7 of 11 cysts (six by RNA sequencing and one more by other methods).
    Later series found an NFATC2 fusion in 7 of 11 and in 6 of 9 cysts, an
    EWSR1-NFATC2 fusion in 3 of 9 with a FUS rearrangement in a fourth, and an
    EWSR1 or FUS rearrangement in 9 of 14. In the cysts the fusion is not
    amplified, which separates them from the round cell sarcomas that carry
    the same fusion. Nine cysts of the jaw that could be tested all lacked an
    NFATC2 rearrangement. The studies cited do not say which cell of the cyst
    wall carries the fusion, and none shows how the fusion would produce a
    cyst.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:32991339
    reference_title: "FUS-NFATC2 or EWSR1-NFATC2 Fusions Are Present in a Large Proportion of Simple Bone Cysts."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted RNA sequencing showed a FUS-NFATC2 fusion in 4 of 11 SBCs and an EWSR1-NFATC2 fusion in 2 of 11 SBCs."
    explanation: >-
      The study that found the fusions, in 11 cysts: FUS-NFATC2 in four and
      EWSR1-NFATC2 in two by RNA sequencing.
  - reference: PMID:32991339

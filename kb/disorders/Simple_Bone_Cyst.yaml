    term:
      id: HP:0012062
      label: Bone cyst
  target_mechanisms:
  - target: Venous Outflow Obstruction and Raised Intracystic Pressure
    description: >-
      The procedure is aimed at the raised pressure, which fell as drill holes
      were made. A good result does not single out the pressure, though: the
      authors of the 1993 study credit the procedure with improving blood flow
      through the cyst wall and stimulating bone formation as well.
    evidence:
    - reference: PMID:6643570
      reference_title: "The aetiology and treatment of simple bone cysts."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "The pressure within the cyst was measured during drilling with a Kirschner wire; it gradually decreased as the number of drill-holes increased."
      explanation: >-
        The pressure in the cyst fell as the number of drill holes increased.
    - reference: PMID:8448944
      reference_title: "Simple bone cyst. Treatment by trepanation and studies on bone resorptive factors in cyst fluid with a theory of its pathogenesis."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "The technique was effective in decompressing the internal pressure of the cysts, improving the blood flow through the medullary bone of the cyst wall, stimulating the periosteum to induce bone formation, and eliminating bone destruction."
      explanation: >-
        The 1993 authors' account of what trepanation does: it lowers the
        pressure, improves blood flow through the cyst wall and stimulates
        bone formation.

- phase: Resolution
  notes: >-
    Whether the cysts resolve by themselves is disputed. Several sources say
    that they tend to resolve after puberty or to regress as the skeleton
    matures, and an older review calls the lesion probably self-limited and
    rare in adults. A 2024 review states the opposite: extended follow-up
    studies have denied the belief that most cysts resolve with skeletal
    maturity.
  evidence:
  - reference: PMID:34397806
    reference_title: "Evaluation of different treatment modalities for fractured and non-fractured simple bone cyst: A single-center review of 68 patients."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "As the cysts tend to resolve spontaneously after puberty"
    explanation: >-
      The introduction of a series of 68 patients, citing earlier work: the
      cysts tend to resolve spontaneously after puberty.
  - reference: PMID:42063443
    reference_title: "Management strategies and outcomes of pediatric unicameral bone cyst: a narrative review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Previous studies have demonstrated that many pediatric UBCs may spontaneously regress during skeletal maturation, underscoring the need for regular follow-up and serial imaging to monitor cyst evolution"
    explanation: >-
      A 2026 review: many cysts in children may regress as the skeleton
      matures.
  - reference: PMID:9810525
    reference_title: "Simple bone cyst: etiology, classification, pathology, and treatment modalities."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The etiology of this asymptomatic lesion that frequently causes pathological fracture is still unknown. It is probably self limited in nature, seen in children but rare among adults."
    explanation: >-
      A 1998 review: the lesion is probably self-limited, seen in children and
      rare in adults.
  - reference: PMID:38726993
    reference_title: "Modern treatment of unicameral and aneurysmatic bone cysts."
    supports: REFUTE

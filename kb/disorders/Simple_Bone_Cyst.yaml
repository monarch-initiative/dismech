    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular testing may significantly improve diagnostic accuracy in bone cysts."
    explanation: >-
      A prospective series of 19 bone cysts: molecular testing may
      significantly improve diagnostic accuracy.
diagnosis:
- name: Plain Radiography
  description: >-
    The cyst is seen on a plain radiograph as a mildly expansile, lytic,
    thin-walled lesion without periosteal reaction. When the bone has broken,
    a fragment of cortex may fall to the bottom of the cyst. This fallen
    fragment sign was present in 20 per cent of one series and always with a
    fracture; when present it shows that the lesion is hollow, which a solid
    tumour cannot be. Imaging alone often mistakes the cyst for an aneurysmal
    bone cyst: in a prospective series, six of 11 simple bone cysts were read
    as aneurysmal bone cysts.
  diagnosis_term:
    preferred_term: plain radiography
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:24570274
    reference_title: "Treatment of unicameral bone cyst: systematic review and meta analysis."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "radiographically is seen as mildly expansile, lytic thin-walled bone lesion without periosteal reaction"
    explanation: >-
      The introduction of a 2014 meta-analysis describes the radiographic
      appearance.
  - reference: PMID:2781324
    reference_title: "Solitary (unicameral) bone cyst. The fallen fragment sign revisited."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fallen fragment sign is a prominent radiologic feature in a minority of cases of unicameral bone cyst (20% in this series). This sign is always associated with pathologic fracture."
    explanation: >-

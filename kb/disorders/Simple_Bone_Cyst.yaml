- phase: Latent cyst
  notes: >-
    A cyst that lies more than 5 mm from the growth plate is called latent.
  evidence:
  - reference: PMID:24570274
    reference_title: "Treatment of unicameral bone cyst: systematic review and meta analysis."
    supports: SUPPORT

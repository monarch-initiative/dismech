epidemiology:
- name: Age and sex
  description: >-
    A lesion of the growing skeleton, more common in males. A meta-analysis of
    62 retrospective studies with 3,211 patients found a male to female ratio
    of 2.2 to 1. In a single-centre series of 68 patients the mean age was 9.1
    years and 73.5 per cent were male. A review states that nearly 80 per cent
    of cases are diagnosed before the age of 20. A pathology series of 14
    cysts shows that adults are affected too: its patients were aged 7 to 45
    years, with a median of 29.
  evidence:
  - reference: PMID:24570274
    reference_title: "Treatment of unicameral bone cyst: systematic review and meta analysis."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cumulative sample size was 3,211 patients with 3,217 UBC, and male to female ratio was 2.2:1."
    explanation: >-
      A meta-analysis of 62 retrospective studies: 3,211 patients, with a male
      to female ratio of 2.2 to 1.

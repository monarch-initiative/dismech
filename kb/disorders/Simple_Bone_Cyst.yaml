treatments:
- name: Conservative Management
  description: >-
    Observation, with immobilisation when the bone breaks. In a series of 68
    patients, 50 were treated conservatively and all 32 fractures so treated
    healed within six weeks; the authors conclude that most cysts can be
    managed this way, especially in the upper limb. The cyst itself seldom
    goes: it consolidated at least partly in three of the 68, and 17 of 43
    patients with a fracture had another. A second series reports resolution
    in 30 per cent, and a meta-analysis a pooled healing rate of 64.2 per cent
    with a wide interval.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: observation, with immobilisation of fractures
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:34397806
    reference_title: "Evaluation of different treatment modalities for fractured and non-fractured simple bone cyst: A single-center review of 68 patients."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fifty patients (73.5%; upper limb n = 40, lower limb n = 10) underwent a conservative treatment."
    explanation: >-
      A single-centre series of 68 patients: 50 were treated conservatively.
  - reference: PMID:34397806
    reference_title: "Evaluation of different treatment modalities for fractured and non-fractured simple bone cyst: A single-center review of 68 patients."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 32 pathological fractures treated conservatively (upper limb n = 31, lower limb n = 1) healed within 6 weeks; 17/43 patients (39.5%) suffered at least one second fracture."
    explanation: >-
      The same series: every fracture treated conservatively healed within six
      weeks, and 17 of 43 patients had at least one more fracture.
  - reference: PMID:34397806

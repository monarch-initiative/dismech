- category: Skeletal
  name: Pathological Fracture
  description: >-
    The usual way the cyst comes to light. A fracture occurred in 43 of 68
    patients in one series and in 13 of 22 in another, where all the cysts of
    the upper limb and 18 per cent of those of the lower limb fractured.
    Fractures treated conservatively healed within six weeks, but 17 of the 43
    patients had at least one more. A cyst index measured on the radiograph
    has been proposed to judge the risk.
  phenotype_term:
    preferred_term: pathological fracture through the cyst
    term:
      id: HP:0002756
      label: Pathologic fracture
  frequency: FREQUENT
  sequelae:
  - target: Bone Pain
    causal_link_type: DIRECT
    description: >-

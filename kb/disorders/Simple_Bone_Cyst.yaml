    evidence_source: HUMAN_CLINICAL
    snippet: "Extended follow-up studies denied the historical belief that most UBCs will resolve with skeletal maturity"
    explanation: >-
      A 2024 review states the opposite: extended follow-up studies denied the
      belief that most cysts resolve with skeletal maturity.
discussions:
- discussion_id: sbc_cause_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What causes a simple bone cyst: a gene fusion in a neoplastic cell,
    blocked venous drainage, or both?
  attaches_to:
  - mechanistic_hypotheses#venous_obstruction
  - mechanistic_hypotheses#neoplastic_nfatc2_fusion
  - phenotypes#Bone Cyst
  rationale: >-
    The two accounts come from different literatures and have not been brought
    together. The pathology studies that found the fusion conclude that the
    cyst is a neoplasm. The orthopaedic reviews give the venous account, and
    one of them, published in 2026, describes the cyst as non-neoplastic.
    Neither account explains how a cavity forms. Until that is known, the
    cause of the cyst cannot be drawn as a single chain.
  evidence:
  - reference: PMID:32991339
    reference_title: "FUS-NFATC2 or EWSR1-NFATC2 Fusions Are Present in a Large Proportion of Simple Bone Cysts."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "A simple bone cyst (SBC) is a benign bone lesion of unknown etiology."
    explanation: >-
      The opening sentence of the study that found the fusions: a benign
      lesion of unknown aetiology.
  - reference: PMID:23904902
    reference_title: "The role of osteoblast cells in the pathogenesis of unicameral bone cysts."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenesis of unicameral bone cysts (UBCs) remains largely unknown."
    explanation: >-
      The opening of a 2012 study of cyst fluid: the pathogenesis remains
      largely unknown.
  - reference: PMID:24570274
    reference_title: "Treatment of unicameral bone cyst: systematic review and meta analysis."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Several theories have been postulated to explain the origin of UBC, including trauma and inflammation; however, none has been conclusive"
    explanation: >-
      The introduction of a 2014 meta-analysis: several theories of the origin
      have been put forward, and none has been conclusive.
  - reference: PMID:42063443
    reference_title: "Management strategies and outcomes of pediatric unicameral bone cyst: a narrative review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenesis of unicameral bone cysts (UBCs) remains incompletely understood, with several mechanisms proposed, including disturbances in bone development, fluid retention, altered bone remodeling, and venous obstruction"
    explanation: >-
      A 2026 review: the pathogenesis remains incompletely understood, with
      several mechanisms proposed.
  - reference: PMID:9810525
    reference_title: "Simple bone cyst: etiology, classification, pathology, and treatment modalities."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The etiology of this asymptomatic lesion that frequently causes pathological fracture is still unknown. It is probably self limited in nature, seen in children but rare among adults."
    explanation: >-
      A 1998 review: the aetiology is still unknown.
- discussion_id: sbc_cysts_without_fusion
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are the cysts without a fusion, and the cysts of the jaw, the same disease
    as the cysts that carry one?
  attaches_to:
  - pathophysiology#NFATC2 Gene Fusion
  - mechanistic_hypotheses#neoplastic_nfatc2_fusion
  rationale: >-
    In every series some of the cysts had no fusion detected: 4 of 11, 3 of 9,
    5 of 9 and 5 of 14 in four series, and in the first study two cysts were
    negative and two could not be analysed. The nine cysts of the jaw that
    could be tested had none, and their authors suggest that the cyst of the
    jaw is a different, reactive lesion. Whether the long-bone cysts without a
    fusion are cysts in which the test failed, cysts with another alteration,
    or a different lesion is not known. The answer decides whether this entry
    describes one disease or two.
  evidence:
  - reference: PMID:36939112
    reference_title: "No NFATC2 fusion in simple bone cyst of the jaw."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Simple Bone Cysts (SBCs) predominantly occur in long bones and 59% harbour NFATC2 rearrangements."
    explanation: >-
      The opening of the study of jaw cysts gives the pooled figure for the
      long bones: 59 per cent carry an NFATC2 rearrangement, so 41 per cent do
      not.
  - reference: PMID:36939112
    reference_title: "No NFATC2 fusion in simple bone cyst of the jaw."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "All nine cases lacked NFATC2 rearrangement and five of these showed no detectable gene fusions using Archer FusionPlex."
    explanation: >-
      The same study: all nine jaw cysts that could be tested lacked an NFATC2
      rearrangement, and five of them had no detectable fusion at all.
  - reference: PMID:36939112
    reference_title: "No NFATC2 fusion in simple bone cyst of the jaw."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest that SBC presenting in the jaw is molecularly different from SBC in long bones. Future molecular studies may confirm the absence of clonal molecular aberrations in SBC of the jaw which would support a non-neoplastic, reactive origin."
    explanation: >-
      Its authors' reading: the cyst of the jaw is molecularly different, and
      may be reactive and not neoplastic.
- discussion_id: sbc_relation_to_sarcoma
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How is a benign cyst related to the sarcoma that carries the same NFATC2
    fusion?
  attaches_to:
  - pathophysiology#NFATC2 Gene Fusion
  rationale: >-
    The same fusion, with identical breakpoints, is found in a benign cyst of
    children and in an aggressive round cell sarcoma. In the sarcomas the
    fusion is amplified and the karyotype is more complex; in the cysts it is
    not. No study cited reports a cyst that became a sarcoma, and the authors
    of the first fusion study say that the relation remains to be elucidated.
  evidence:
  - reference: PMID:32991339
    reference_title: "FUS-NFATC2 or EWSR1-NFATC2 Fusions Are Present in a Large Proportion of Simple Bone Cysts."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although they can recur locally in a nondestructive manner, their clinical course and possible relation to sarcoma with EWSR1-NFATC2 or FUS-NFATC2 fusion remains to be elucidated."
    explanation: >-
      The study that found the fusions leaves the relation to the sarcoma
      open.
  - reference: PMID:33316098
    reference_title: "Identification of EWSR1-NFATC2 fusion in simple bone cysts."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified three cases with EWSR1-NFATC2 fusion (showing identical breakpoints to those in EWSR1-NFATC2 sarcomas) and one additional case with FUS rearrangement."
    explanation: >-
      A series of nine cysts: the breakpoints were identical to those in the
      sarcomas.
  - reference: PMID:36555836
    reference_title: "Implementation of Copy Number Variations-Based Diagnostics in Morphologically Challenging EWSR1/FUS::NFATC2 Neoplasms of the Bone and Soft Tissue."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "CNV analysis showed simple karyotypes in all cystic lesions, while more complex karyotypes were found in NFATC2-rearranged sarcomas."
    explanation: >-
      A series of five patients: simple karyotypes in the cystic lesions and
      more complex ones in the sarcomas.

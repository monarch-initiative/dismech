differential_diagnoses:
- name: Aneurysmal Bone Cyst
  description: >-
    The main differential. The two cysts overlap on imaging and under the
    microscope: in a prospective series, six of 11 simple bone cysts were read
    as aneurysmal bone cysts on imaging, and a fracture through a simple bone
    cyst can make it resemble one. The fusions separate them. It is curated
    separately as Aneurysmal Bone Cyst.
  distinguishing_features:
  - A USP6 fusion, found in all eight aneurysmal bone cysts of one series and absent from simple bone cyst
  - An NFATC2 fusion, found in 7 of the 11 simple bone cysts of the same series
  - Fibrin-like collagen deposits, more frequent in simple bone cyst (8 of 11 against 3 of 8) but not specific to it

    evidence_source: HUMAN_CLINICAL
    snippet: "Sixteen (42%) of the thirty-eight cysts treated with methylprednisolone acetate healed, and nine (23%) of the thirty-nine cysts treated with bone marrow healed (p = 0.01)."
    explanation: >-
      The randomised trial, 77 of 90 patients followed for two years: 16 of 38
      cysts healed after methylprednisolone acetate and 9 of 39 after bone
      marrow.

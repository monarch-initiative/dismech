      The molecular biology of NF2/Merlin on tumorigenesis and development.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurofibromatosis type 2 (NF2) is an inherited genetic disorder that follows an autosomal
      dominant pattern, affecting around 1 in 40 000 individuals, 1 and results from the
      inactivation of the neurofibromin 2 (NF2) gene that is located in the long arm of chromosome
      22 (22q), and this gene encodes a protein called Merlin
    explanation: >-
      The gene, its location, its product and the inheritance pattern in one sentence. The review's round
      1 in 40,000 is carried inside the quotation but recorded nowhere else in the entry: the
      prevalence section uses the ascertainment-based Manchester and pooled birth figures instead,
      and this review gives no source or population for its own. The trailing 1 is the review's
      citation marker, carried because the snippet is quoted verbatim.
  - reference: PMID:38967126
    reference_title: >-
      The molecular biology of NF2/Merlin on tumorigenesis and development.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NF2 mutations are specifically linked to the development of schwannomas, meningiomas, and
      ependymomas, although the precise mechanisms of tumor formation in these specific cell types
      remain unclear.
    explanation: >-
      The three tumour types the gene is linked to, and the review's own statement of the open
      question: why these cell types.
pathophysiology:
- name: Germline NF2 Inactivation
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    One inactivated NF2 allele in every cell. On its own it produces no tumour; it sets the threshold
    at a single further event.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION

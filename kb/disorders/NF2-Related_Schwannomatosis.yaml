name: NF2-Related Schwannomatosis
creation_date: '2026-11-13T21:30:00Z'
disease_term:
  preferred_term: NF2-related schwannomatosis
  term:
    id: MONDO:0007039
    label: NF2-related schwannomatosis
categories:
- Tumor predisposition syndrome
- Neurological disorder
parents:
- schwannomatosis
synonyms:
- NF2
- neurofibromatosis type 2
- neurofibromatosis 2
- bilateral acoustic neurofibromatosis
description: >-
  A dominantly inherited tumour-predisposition syndrome caused by loss of the NF2 tumour suppressor,
  whose hallmark is bilateral vestibular schwannoma and whose other tumours - meningioma, ependymoma,
  peripheral and spinal schwannoma - follow from the same two-hit mechanism in different cell types.
  The disease the field now calls NF2-related schwannomatosis was called neurofibromatosis type 2 until
  2022, when the diagnostic criteria were revised and that name was retired. A large minority of
  patients are mosaic rather than constitutionally heterozygous, which makes their disease milder,
  later and more asymmetrical, and which is why genetic testing is part of the criteria rather than a
  confirmation of them.
has_subtypes:
- name: Mosaic NF2-SWN
  display_name: Mosaic NF2-related schwannomatosis
  subtype_term:
    preferred_term: mosaic NF2-related schwannomatosis
    term:
      id: MONDO:0859764
      label: mosaic NF2-related schwannomatosis
  subtype_frequency: about 45% of living patients in a UK study
  description: >-
    The form in which the NF2 variant arose after conception, so that only some of the patient's
    cells carry it. The 2022 criteria reach it by two routes: with the clinical features, a
    pathogenic variant at an allele fraction clearly below 50% in unaffected tissue such as blood or
    saliva, or, when no variant is found there, a variant shared by two or more anatomically
    unrelated tumours. The disease is often milder and asymmetrical, with tumours mainly on one side
    or in one body segment, and can present as a unilateral vestibular schwannoma or as segmental
    disease, though some mosaic patients cannot be told apart clinically from constitutional
    patients with bilateral tumours. Onset may be later, and on average mosaic patients, like those
    with missense variants, have the best overall course, but they may still have a severe course,
    and they require appropriate surveillance and intervention. Among patients with NF2-related
    schwannomatosis, mosaicism is found in roughly 60% of those with a unilateral vestibular
    schwannoma, against 33% of those with bilateral vestibular schwannomas.
  review_notes: >-
    MONDO release 2026-09-01 places mosaic NF2-related schwannomatosis (MONDO:0859764) under mosaic
    neurofibromatosis/schwannomatosis (MONDO:0859008), not under this entry's term MONDO:0007039,
    which has no subclasses there; the same release lists full NF2 and nonmosaic NF2-related
    schwannomatosis among MONDO:0007039's exact synonyms, so MONDO treats that term as the
    constitutional form and puts the mosaic form beside it. The row is kept under this entry because
    the 2022 criteria, which the entry follows, classify a patient with the clinical features and a
    variant clearly below 50% allele fraction, or, when blood or saliva shows no variant, a variant
    shared by two or more anatomically unrelated tumours, as having mosaic NF2-related
    schwannomatosis: the mosaic form is a form of this disease rather than a separate one. The mode
    of inheritance and the transmission risk are recorded in the Mosaic inheritance block rather
    than repeated here. Because a has_subtypes row is exported as a subclass_of edge, the KGX export
    states that MONDO:0859764 is a subclass of MONDO:0007039, which MONDO itself does not assert.
  evidence:
  - reference: PMID:38897938
    reference_title: >-
      Historical Development of Diagnostic Criteria for NF2-related Schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first step involves testing of unaffected tissues (i.e., blood or saliva) for pathogenic
      variants (PVs) in NF2, SMARCB1, and LZTR1.
    explanation: >-
      The tissue the first route is tested in: blood or saliva.
  - reference: PMID:41160189
    reference_title: >-
      History and clinical epidemiology of NF2-related schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, in ~ 60% of new onset non-familial cases, the pathogenic variant is not present at
      conception but occurs during embryogenesis leading to only a small proportion of affected
      cells with the pathogenic variant that may be confined to neural crest cells.
    explanation: >-
      That in mosaic patients the variant arises during embryogenesis and is carried by a small
      proportion of cells, possibly only cells of neural crest origin. The figure of about 60% is
      the same estimate the Mosaic inheritance block gives.
  - reference: PMID:39786185
    reference_title: >-
      Classification of schwannomas and the new naming convention for "neurofibromatosis-2": Genetic
      updates and international consensus recommendation.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Post-zygotic mosaicism, characterized by a somatic mutation in the NF2 gene, is observed in
      roughly 60% of NF2 patients with unilateral VS and 33% of patients with bilateral VS
    explanation: >-
      What the mosaic form is, and how much more often it is found among patients with a unilateral
      vestibular schwannoma than among those with bilateral tumours. The sentence names no cohort
      for the two figures; the snippet stops before its citation.
  - reference: PMID:38897938
    reference_title: >-
      Historical Development of Diagnostic Criteria for NF2-related Schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If the PVs in NF2, SMARCB1, or LZTR1 exhibit a variant allele fraction clearly <50% and
      clinical features are also present, the disease is classified as mosaic NF2-, SMARCB1-, or
      LZTR1-related schwannomatosis.
    explanation: >-
      The first route to the diagnosis under the 2022 criteria, from this review's account of the
      stepwise testing algorithm, which covers all three schwannomatosis genes: a variant at an
      allele fraction clearly below 50% in the unaffected tissue tested in the first step, blood or
      saliva, together with the clinical features.
  - reference: PMID:38897938
    reference_title: >-
      Historical Development of Diagnostic Criteria for NF2-related Schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If no PVs are found in NF2, SMARCB1 or LZTR1, the second step involves testing of two or more
      anatomically unrelated tumors. If the tumors share PVs in NF2, SMARCB1, or LZTR1, the disease
      is classified as mosaic NF2-, SMARCB1-, or LZTR1-related schwannomatosis.
    explanation: >-
      The second route, when blood shows no variant: two or more anatomically unrelated tumours that
      share one.
  - reference: PMID:38897938
    reference_title: >-
      Historical Development of Diagnostic Criteria for NF2-related Schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The symptoms of mosaic NF2 are milder and often restricted to a certain area or side of the
      body. Next, mosaic patients may present with unilateral vestibular schwannomas or segmental
      disease.
    explanation: >-
      The milder, regionally restricted disease, and two presentations that mosaic patients may
      have.
  - reference: PMID:41160189
    reference_title: >-
      History and clinical epidemiology of NF2-related schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mosaic NF2-SWN frequently demonstrates asymmetry with tumours predominantly on one side or one
      body segment ... or can be indistinguishable from non-mosaic patients with bilateral disease.
    explanation: >-
      The asymmetry and its limit: some mosaic patients cannot be told apart clinically from
      constitutional patients with bilateral tumours. The ellipsis steps over a citation bracket.
  - reference: PMID:39786185
    reference_title: >-
      Classification of schwannomas and the new naming convention for "neurofibromatosis-2": Genetic
      updates and international consensus recommendation.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These mosaic cases may present with a later disease onset.
    explanation: >-
      The later onset. The review gives no onset age for mosaic cases, and no cited source does.
  - reference: PMID:41160189
    reference_title: >-
      History and clinical epidemiology of NF2-related schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On average, patients with constitutional truncating mutations have the worst overall survival
      while those with mosaic disease and those with missense variants have the best overall course
    explanation: >-
      The course: on average the best of the genetic groups, shared with patients who carry missense
      variants. The review gives no survival figure for mosaic patients. The snippet stops before
      the citation bracket.
  - reference: PMID:41160189
    reference_title: >-
      History and clinical epidemiology of NF2-related schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      People with mosaic NF2-SWN may still have severe clinical course and require appropriate
      clinical surveillance and intervention, but there is an implication of lower risk of
      transmission to children versus germline involvement.
    explanation: >-
      The caveat on that average: mosaic patients may still have a severe course, and they require
      appropriate surveillance and intervention. The second clause is the lower transmission risk
      recorded under the Mosaic inheritance block.
  - reference: PMID:41160189
    reference_title: >-
      History and clinical epidemiology of NF2-related schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall based on the most recent epidemiological study in th UK ... roughly 25% of NF2-SWN
      patients alive had inherited the disease from an affected parent 30% were de novo
      heterozygotes and 45% mosaics.
    explanation: >-
      The share of living patients who are mosaic, which is the subtype frequency given here. The
      source writes th UK and runs two clauses together without punctuation; the snippet is quoted
      as written, and the ellipsis steps over a citation bracket.

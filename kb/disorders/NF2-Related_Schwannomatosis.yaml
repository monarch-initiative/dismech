      label: Sensorineural hearing impairment
  description: >-
    The deficit that carries most of the disease's burden, and one that progresses in the untreated:
    about 4 dB a year in a cohort followed nine years. The band, frequent (30 to 79%), is Orphanet's
    class in its record for the full, non-mosaic form, with no stated population or denominator.
    GeneReviews names hearing loss among the characteristic symptoms and the natural-history cohort
    gives its rate of decline; neither gives a proportion of patients, and the one other figure,
    over 60%, comes from a review of vestibular schwannoma generally rather than of this syndrome.

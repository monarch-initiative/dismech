    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The average follow-up period was approximately 9 years, and hearing deteriorated at an average
      rate of approximately 4 dB/year.
    explanation: >-

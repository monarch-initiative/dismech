inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A constitutional heterozygous NF2 variant is transmitted dominantly, and the tumours follow a
    second somatic hit in the remaining allele.
  evidence:
  - reference: PMID:38967126
    reference_title: >-
      The molecular biology of NF2/Merlin on tumorigenesis and development.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NF2 mutations are specifically linked to the development of schwannomas, meningiomas, and
      ependymomas, although the precise mechanisms of tumor formation in these specific cell types
      remain unclear.
    explanation: >-
      The tumour spectrum the germline variant predisposes to, with the review's own statement of what is
      not understood: why those three cell types and not others. INDIRECT for the inheritance claim,
      which this sentence does not make; the GeneReviews item below states it directly.
  - reference: PMID:20301380
    reference_title: >-
      NF2-Related Schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NF2 is inherited in an autosomal dominant manner.
    explanation: >-
      The inheritance claim this block makes, stated by the disease's GeneReviews chapter.
      REVIEW_SYNTHESIS because a GeneReviews chapter synthesises work its authors did not all
      perform.
- name: Mosaic
  inheritance_term:
    preferred_term: typified by somatic mosaicism
    term:
      id: HP:0001442
      label: Typified by somatic mosaicism
  description: >-
    A large minority of patients are not constitutionally heterozygous but mosaic, the variant
    having arisen after fertilisation; once tumours are tested, the current estimate is that close
    to 60% of de novo cases are mosaic. Their disease is milder, later and more asymmetrical, and
    their risk of transmitting it is below the dominant one, because in some of them the germ cells
    do not carry the variant. A child who does inherit it from a mosaic parent carries it
    constitutionally and typically has more severe disease than the parent, while neither parent of
    a proband shown to be mosaic is affected. That difference in recurrence risk is why this is a
    second inheritance block rather than a footnote on the first.
  evidence:
  - reference: PMID:36762955
    reference_title: >-
      Updated protocol for genetic testing, screening and clinical management of individuals at risk
      of NF2-related schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing and management of individuals at risk for NF2-related schwannomatosis is
      complicated by the high rate of mosaicism resulting in a milder, later onset, more
      asymmetrical disease and the phenotypic overlap with the related schwannomatosis conditions.
    explanation: >-
      The mosaic arm and its three clinical consequences, from the protocol of a national testing service.
      It states the rate as high without giving a number. PRIMARY_RESULT: the paper is a research
      article setting out its own service's protocol, not a synthesis of others' work.
  - reference: PMID:36762955
    reference_title: >-
      Updated protocol for genetic testing, screening and clinical management of individuals at risk
      of NF2-related schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This updated protocol, reflects the lower transmission risks now inferred in mosaic
      NF2-related schwannomatosis, informed by the greater sensitivity of Next Generation Sequencing
      in detecting low levels of mosaicism in blood, along with improved ability to analyse tumour
      DNA.
    explanation: >-
      Why the transmission risk differs from the dominant one and why the estimate has moved: better
      detection of low-level mosaicism in blood. PRIMARY_RESULT, because this is a research paper
      rather than a review and the risks it reports were derived from genetic testing of over 1000
      individuals through the Manchester service, which the preceding sentence of the abstract
      states.
  - reference: PMID:20301380
    reference_title: >-
      NF2-Related Schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As many as 25% to 50% of individuals with a de novo NF2 pathogenic variant have somatic
      mosaicism for the variant.
    explanation: >-
      The proportion of de novo cases that are mosaic, as the GeneReviews chapter puts it. A newer
      review raises the current estimate to close to 60%, which is the movement this entry's notes
      describe.
  - reference: PMID:20301380
    reference_title: >-
      NF2-Related Schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      offspring of an individual with a germline pathogenic variant have a 50% chance of inheriting
      the variant, while offspring of an individual who has mosaic NF2 may have a less than 50% risk
      of inheriting the variant
    explanation: >-
      The transmission risk this block describes, with the figure attached. It is why mosaicism is a
      second inheritance block and not a footnote: the recurrence risk a family is counselled on
      differs from the dominant one.
  - reference: PMID:41160189
    reference_title: >-
      History and clinical epidemiology of NF2-related schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using further work on testing of tumours, the current estimate for mosaicism in a de novo
      NF2-SWN case is close to 60%
    explanation: >-
      The current estimate of the mosaic share of de novo cases, which the review credits to testing
      tumours as well as blood. Its abstract says up to 50%, so the review gives both figures, the
      higher one in its body. The snippet stops before the citation bracket.
  - reference: PMID:38897938
    reference_title: >-
      Historical Development of Diagnostic Criteria for NF2-related Schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with germline NF2 mutations demonstrate a 50% probability of passing the disease to
      their children, while mosaic patients demonstrate a reduced chance of further transmission to
      their offspring because of the absence of germ cell alterations in some cases.
    explanation: >-
      Why the transmission risk is lower: in some mosaic patients the germ cells do not carry the
      variant. The review gives no figure for the reduced risk. GeneReviews gives only an upper
      bound, less than 50%, and the Manchester protocol cited above derives estimated risks for
      mosaic patients that its cached abstract does not state.
  - reference: PMID:38897938
    reference_title: >-
      Historical Development of Diagnostic Criteria for NF2-related Schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, if affected, the children of mosaic patients will typically develop a more severe
      form of the disease than the parent because of the greater number of affected cells following
      germline transmission.
    explanation: >-
      What follows when the variant is transmitted: the child carries it constitutionally and
      typically has more severe disease than the mosaic parent, which the review puts down to the
      greater number of affected cells. The snippet stops before the citation.
  - reference: PMID:20301380
    reference_title: >-
      NF2-Related Schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The possibility that a parent has NF2 can be excluded if the proband is shown to be mosaic.
    explanation: >-
      The other side of the pedigree: a mosaic proband's variant arose in the proband, so neither
      parent has the disease.
genetic:
- name: NF2 germline inactivating variants
  gene_term:
    preferred_term: NF2
    term:
      id: hgnc:7773
      label: NF2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE_AND_SOMATIC
  notes: >-
    The gene sits on the long arm of chromosome 22 and encodes merlin. The first hit is an
    inactivating variant, present from conception in constitutional patients and, in mosaic
    patients, arising after conception in only some cells; the tumours arise where a somatic second
    hit removes the remaining allele, which is why a dominantly inherited syndrome produces discrete
    tumours rather than a diffuse phenotype. Recorded as GERMLINE_AND_SOMATIC for both reasons: the
    second hit is somatic, and in mosaic patients so is the first.

    ClinGen's General Gene Curation Expert Panel classified this gene-disease pair Definitive for
    autosomal dominant inheritance in 2019, against this entry's own MONDO term; that assertion is
    recorded below rather than restated here.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_a185a859-a499-4c4a-bebe-996b16fb3cf3-2019-02-27T170000.000Z
    evidence:
    - reference: CGGV:assertion_a185a859-a499-4c4a-bebe-996b16fb3cf3-2019-02-27T170000.000Z
      reference_title: >-
        NF2 / NF2-related schwannomatosis (Definitive)
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      snippet: >-
        NF2 | HGNC:7773 | NF2-related schwannomatosis | MONDO:0007039 | AD | Definitive
      explanation: >-
        The ClinGen gene-disease validity row, for this entry's own MONDO term and for the dominant
        mode of inheritance this entry records.
  evidence:
  - reference: PMID:38967126
    reference_title: >-
      The molecular biology of NF2/Merlin on tumorigenesis and development.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurofibromatosis type 2 (NF2) is an inherited genetic disorder that follows an autosomal
      dominant pattern, affecting around 1 in 40 000 individuals, 1 and results from the
      inactivation of the neurofibromin 2 (NF2) gene that is located in the long arm of chromosome
      22 (22q), and this gene encodes a protein called Merlin
    explanation: >-
      The gene, its location, its product and the inheritance pattern in one sentence. The review's round
      1 in 40,000 is carried inside the quotation but recorded nowhere else in the entry: the
      prevalence section uses the ascertainment-based Manchester and pooled birth figures instead,
      and this review gives no source or population for its own. The trailing 1 is the review's
      citation marker, carried because the snippet is quoted verbatim.
  - reference: PMID:38967126
    reference_title: >-
      The molecular biology of NF2/Merlin on tumorigenesis and development.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NF2 mutations are specifically linked to the development of schwannomas, meningiomas, and
      ependymomas, although the precise mechanisms of tumor formation in these specific cell types
      remain unclear.
    explanation: >-
      The three tumour types the gene is linked to, and the review's own statement of the open
      question: why these cell types.
pathophysiology:
- name: Germline NF2 Inactivation
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    One inactivated NF2 allele in every cell of a constitutionally heterozygous patient. On its own
    it produces no tumour; it sets the threshold at a single further event. This node, like its
    germline variant_origin, describes the constitutional form: in mosaic patients the first hit
    arises after conception and only some cells carry it, which the Mosaic NF2-SWN subtype and the
    Mosaic inheritance block record.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: NF2
    term:
      id: hgnc:7773
      label: NF2
  molecular_functions:
  - preferred_term: merlin signalling adaptor activity
    term:
      id: GO:0035591
      label: signaling adaptor activity
  evidence:
  - reference: PMID:38967126
    reference_title: >-
      The molecular biology of NF2/Merlin on tumorigenesis and development.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The neurofibromatosis type 2 (NF2) gene, known for encoding the tumor suppressor protein
      Merlin, is central to the study of tumorigenesis and associated cellular processes.
    explanation: >-
      The gene's identity as a tumour suppressor, which is what makes inactivation rather than
      activation the lesion.
  downstream:
  - target: Somatic Loss of the Remaining NF2 Allele
    causal_link_type: DIRECT
    description: >-
      The second hit. What the germline lesion does is make a single further event sufficient. The cited
      sources state that requirement rather than the rate at which a cell crosses it, and they
      report that biallelic NF2 loss is found in about 60% of patients' schwannomas, so the second
      hit is usual rather than universal.
    evidence:
    - reference: PMID:38967126
      reference_title: >-

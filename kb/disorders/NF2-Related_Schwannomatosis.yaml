- name: Loss of Merlin-Dependent Growth Restraint
  role: effector
  biological_scale: CELLULAR
  description: >-
    Merlin sits at the membrane and restrains proliferation through several pathways at once - Hippo,
    Wnt, mTOR, receptor tyrosine kinase signalling and others. The cited review lists them; it does
    not rank them or say which carries the tumour in which cell type, and this entry does not either.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: hippo signaling
    modifier: DECREASED
    term:
      id: GO:0035329
      label: hippo signaling
  - preferred_term: negative regulation of cell population proliferation
    modifier: DECREASED
    term:
      id: GO:0008285
      label: negative regulation of cell population proliferation
  evidence:
  - reference: PMID:38967126
    reference_title: >-
      The molecular biology of NF2/Merlin on tumorigenesis and development.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This review comprehensively examines the multifaceted role of NF2/Merlin, detailing its
      structural characteristics, functional diversity, and involvement in various signaling
      pathways such as Wnt/beta-catenin, Hippo, TGF-beta, RTKs, mTOR, Notch, and Hedgehog.
    explanation: >-
      The pathway list this node binds two of. The entry binds Hippo because it is the one with a GO
      term that names the pathway, and records the rest in prose rather than manufacturing bindings
      for pathways the sentence only lists.
  downstream:
  - target: YAP and TAZ Activation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Merlin restrains the Hippo effectors; losing it releases them. How it does so is contested, and
      the entry carries that as a discussion rather than choosing: one body of work has merlin
      recruiting LATS to the plasma membrane, another has it acting in the nucleus on a ubiquitin
      ligase that inhibits LATS there.
    evidence:
    - reference: PMID:32960816
      reference_title: >-
        Schwannoma development is mediated by Hippo pathway dysregulation and modified by RAS/MAPK
        signaling.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we provide direct genetic evidence that dysregulation of the Hippo pathway in the
        Schwann cell lineage causes development of multiple schwannomas in mice.
      explanation: >-
        The genetic demonstration that Hippo dysregulation in the Schwann cell lineage is sufficient for
        schwannomas, rather than an association inferred from biochemistry. INDIRECT for this edge:
        the mice are Lats1/2-mutant and the sentence does not name merlin, so merlin loss reaching
        YAP and TAZ is an inference from where merlin sits in the pathway.
    - reference: PMID:32960816
      reference_title: >-
        Schwannoma development is mediated by Hippo pathway dysregulation and modified by RAS/MAPK
        signaling.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Taken together, our data show that complete ablation of YAP/TAZ inhibits the proliferation
        of tumor cells, providing definitive evidence that canonical Hippo signaling is necessary
        and sufficient for schwannoma development.
      explanation: >-
        The necessity and sufficiency test on canonical Hippo signalling, in the authors' own words.
        INDIRECT for the same reason: the lesion tested is Lats1/2, not NF2.
- name: YAP and TAZ Activation
  role: effector
  biological_scale: MOLECULAR
  description: >-
    Unphosphorylated YAP and TAZ enter the nucleus and drive TEAD-dependent transcription. In a mouse
    already carrying a Lats1/2 lesion, gene dosage sets how much tumour the animal gets and how long
    it lives, and one surviving YAP or TAZ allele is enough for a schwannoma to form. That is a
    statement about how much YAP and TAZ activity the tumour needs, not about a YAP allele
    initiating one on its own.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: hippo signaling
    modifier: DECREASED
    term:
      id: GO:0035329
      label: hippo signaling
  evidence:
  - reference: PMID:32960816
    reference_title: >-
      Schwannoma development is mediated by Hippo pathway dysregulation and modified by RAS/MAPK
      signaling.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data suggest that YAP/TAZ gene dosage determines tumor burden and survival, and that a
      single allele of YAP or TAZ is sufficient for schwannoma formation.
    explanation: >-
      The dose-response on this node, which is what makes it the effector rather than a correlate. The
      mice carry a Lats1/2 lesion, so the surviving allele is read against an already dysregulated
      pathway rather than against a wild-type one.
  - reference: PMID:25026211
    reference_title: >-
      Merlin/NF2 loss-driven tumorigenesis linked to CRL4(DCAF1)-mediated inhibition of the hippo
      pathway kinases Lats1 and 2 in the nucleus.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was a strong positive correlation of nuclear YAP staining and weak or absent cytoplasmic
      P-YAP staining in tumors with low Merlin expression (p=0.001 for YAP and p=0.001 for
      phospho-YAP, Mann-Whitney U test), indicating that loss of Merlin causes activation of YAP via
      reduced phosphorylation and increased accumulation in the nucleus.
    explanation: >-
      The same node in human tumours rather than in mice: tumours with low merlin have nuclear YAP
      and little phosphorylated YAP.
  notes: >-
    Only the Hippo process is bound. The cited review lists merlin acting through Wnt, TGF-beta,
    receptor tyrosine kinases, mTOR, Notch and Hedgehog as well, and names PAK and mTORC as
    therapeutic candidates alongside Hippo. Those are recorded in prose because a list in a review is
    not a measurement in this disease, and because the Hippo arm is the only one with a genetic
    necessity-and-sufficiency test in the Schwann cell lineage. The same review says in terms that no
    detailed study supports merlin regulating Hedgehog signalling.
  downstream:
  - target: Schwannoma Formation
    causal_link_type: DIRECT
    description: >-
      The tumour. The cell type is Schwann, and why this lineage rather than another is the question
      the cited review says is unanswered.
    evidence:
    - reference: PMID:38897938
      reference_title: >-
        Historical Development of Diagnostic Criteria for NF2-related Schwannomatosis.
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The growth of schwannomas requires inactivation of both NF2 alleles.
      explanation: >-
        The requirement, stated plainly. It is what makes the germline lesion a predisposition
        rather than a cause on its own.
    - reference: PMID:38897938
      reference_title: >-
        Historical Development of Diagnostic Criteria for NF2-related Schwannomatosis.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        However, to promote tumorigenesis, NF2 mutations alone may be insufficient, and additional
        genetic alterations are required.
      explanation: >-
        The other half, and the reason this edge is not the whole story: the same review says biallelic loss
        may not be enough. No cited source names a required additional alteration in a human tumour
        of this syndrome; the nearest is a mouse study naming RAS/MAPK as a modifier of schwannoma
        development, which is a different claim.

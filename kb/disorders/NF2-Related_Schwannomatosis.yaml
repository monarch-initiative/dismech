  evidence:
  - reference: PMID:38967126
    reference_title: >-
      The molecular biology of NF2/Merlin on tumorigenesis and development.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The neurofibromatosis type 2 (NF2) gene, known for encoding the tumor suppressor protein
      Merlin, is central to the study of tumorigenesis and associated cellular processes.
    explanation: >-
      The gene's identity as a tumour suppressor, which is what makes inactivation rather than
      activation the lesion.
  downstream:
  - target: Somatic Loss of the Remaining NF2 Allele
    causal_link_type: DIRECT
    description: >-
      The second hit. What the germline lesion does is make a single further event sufficient. The cited
      sources state that requirement rather than the rate at which a cell crosses it, and they
      report that biallelic NF2 loss is found in about 60% of patients' schwannomas, so the second
      hit is usual rather than universal.
    evidence:
    - reference: PMID:38967126
      reference_title: >-
        The molecular biology of NF2/Merlin on tumorigenesis and development.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Over time, numerous studies conducted on mice have illustrated the significant impact of
        Merlin inactivation on the formation of these tumors
      explanation: >-
        That inactivation of the protein is what produces the tumours, shown across mouse studies.
        INDIRECT and MODEL_ORGANISM: the sentence summarises mouse work and does not describe the
        second hit in a patient.
    - reference: PMID:32960816
      reference_title: >-
        Schwannoma development is mediated by Hippo pathway dysregulation and modified by RAS/MAPK
        signaling.
      supports: SUPPORT
      directness: DIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Moreover, only about 60% of patients with schwannomas carry biallelic loss of NF2
      explanation: >-
        How often the second hit is found, which is the figure the edge's description now carries.
        The remaining tumours are the reason the edge is a requirement for the common route rather
        than a universal one. The snippet stops before the citation bracket.

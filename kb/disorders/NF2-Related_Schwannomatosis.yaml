    term:
      id: HP:0009830
      label: Peripheral neuropathy
  description: >-
    A muscle-wasting neuropathy that may be a mononeuropathy, often of a cranial and particularly the facial nerve, or generalised. In children a mononeuropathy can be the presenting feature and is one of the presentations with the longest diagnostic delay.
  evidence:
  - reference: PMID:41160189

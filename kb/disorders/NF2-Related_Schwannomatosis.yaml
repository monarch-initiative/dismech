  - target: Tumour Mass Effect on the Eighth Nerve
    causal_link_type: DIRECT
    description: >-
      A benign tumour in a bony canal. What it does is mechanical, and it is the route to every
      auditory and vestibular phenotype in this entry.
    evidence:
    - reference: PMID:32232723
      reference_title: >-
        Vestibular Schwannoma: What We Know and Where We are Heading.
      supports: SUPPORT
      directness: DIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Although benign, it represents a threat to intracranial structures due to mass effect and
        carries a small risk of malignant transformation.
      explanation: >-
        The mechanism of harm, stated as mass effect rather than invasion.
- name: Tumour Mass Effect on the Eighth Nerve
  role: effector
  biological_scale: ORGANISM
  description: >-
    Progressive compression of the cochlear and vestibular nerves, and at larger volumes of the
    brainstem. Hearing falls as the tumour grows: in an untreated cohort followed about nine years,
    hearing deteriorated by roughly 4 dB a year and tumour volume and hearing loss were correlated.
  locations:
  - preferred_term: vestibulocochlear nerve
    term:
      id: UBERON:0001648
      label: vestibulocochlear nerve
  evidence:
  - reference: PMID:38578503
    reference_title: >-
      Natural history of hearing and tumor growth in vestibular schwannoma in neurofibromatosis type
      2-related schwannomatosis.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A correlation was observed between an increase in tumor volume and hearing loss (r = 0.686; p
      < 0.001).
    explanation: >-
      The link between the tumour and the deficit, measured in 37 ears of 24 untreated patients. A
      correlation, not a demonstration of compression.
  - reference: PMID:32232723
    reference_title: >-
      Vestibular Schwannoma: What We Know and Where We are Heading.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Larger tumours can cause hydrocephalus and brainstem compression leading to symptoms such as
      facial paraesthesia, vertigo, and headache
    explanation: >-
      What the mass does beyond the eighth nerve once it is large.
  downstream:
  - target: Sensorineural hearing impairment
    causal_link_type: DIRECT
    description: >-
      The deficit that defines the disease's burden. It progresses without treatment: in the untreated
      cohort the proportion of ears with effective hearing fell from 81% to 51% over about nine years.
    evidence:
    - reference: PMID:38578503
      reference_title: >-
        Natural history of hearing and tumor growth in vestibular schwannoma in neurofibromatosis
        type 2-related schwannomatosis.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The rate of maintaining effective hearing decreased from 30 ears (81%) at the first visit
        to 19 ears (51%) at the final follow-up.
      explanation: >-
        The course of the deficit without treatment, in ears rather than patients.
  - target: Tinnitus
    causal_link_type: DIRECT
    description: Reported with hearing loss in over 60% of patients with these tumours.
    evidence:
    - reference: PMID:32232723
      reference_title: >-
        Vestibular Schwannoma: What We Know and Where We are Heading.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The most common symptoms include progressive hearing loss and tinnitus which are reported
        in over 60% of patients.
      explanation: >-
        The frequency, from a review of vestibular schwannoma generally rather than of this
        syndrome, which is why the row carries no frequency band.
  - target: Vertigo
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Balance disturbance, which the cited review attributes to larger tumours rather than to the
      vestibular nerve's involvement as such.
    evidence:
    - reference: PMID:39786185
      reference_title: >-
        Classification of schwannomas and the new naming convention for "neurofibromatosis-2":
        Genetic updates and international consensus recommendation.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The most frequent clinical manifestations include hearing loss, tinnitus, and balance
        dysfunction, likely secondary to the bilateral VS which is a characteristic of this mixed
        neuro-cutaneous disorder.
      explanation: >-
        The three auditory and vestibular manifestations with the review's own hedge about their
        cause: likely secondary to the tumours.
phenotypes:
- category: Neoplasm
  name: Bilateral vestibular schwannoma
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: bilateral vestibular schwannoma
    term:
      id: HP:0009589
      label: Bilateral vestibular schwannoma
  description: >-
    The hallmark, in 95% of patients and on its own sufficient for the diagnosis. HPO has a term for

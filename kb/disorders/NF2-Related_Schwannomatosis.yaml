    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Meningiomas represent the second most prevalent tumor type observed in NF2-related SWN,
      surpassing sporadic meningiomas in terms of earlier onset. Notably, meningiomas can even be
      the presenting feature, particularly in pediatric patients.
    explanation: >-
      Where it sits in the tumour spectrum and when it presents, which matters because a child with
      a meningioma and no vestibular tumour is the presentation that gets missed.
- category: Neoplasm
  name: Spinal ependymoma
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: spinal cord ependymoma
    term:
      id: HP:0002888
      label: Ependymoma
  description: >-
    In 20 to 30% of patients, typically multiple, intramedullary, slow-growing and asymptomatic. HPO

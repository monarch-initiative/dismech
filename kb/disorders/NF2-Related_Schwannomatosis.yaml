    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, NF2 patients characteristically present with bilateral vestibular schwannomas (VS).
      Additionally, they have a high lifetime risk of developing meningiomas (approaching 80%), and
      a significant proportion (20-30%) may also develop spinal cord ependymomas.
    explanation: >-
      The lifetime risks for this row and the next, from a review.
  - reference: PMID:39786185
    reference_title: >-
      Classification of schwannomas and the new naming convention for "neurofibromatosis-2": Genetic

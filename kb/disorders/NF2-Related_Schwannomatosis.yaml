  - reference: PMID:41160189
    reference_title: >-
      History and clinical epidemiology of NF2-related schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These are most often juvenile posterior sub-capsular lenticular opacities (in contrast to

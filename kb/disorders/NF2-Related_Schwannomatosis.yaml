- category: Ophthalmological
  name: Posterior subcapsular cataract
  frequency: FREQUENT
  phenotype_term:
    preferred_term: juvenile posterior subcapsular lens opacity
    term:
      id: HP:0007787
      label: Posterior subcapsular cataract
  description: >-
    Found in 60 to 80% of patients on specialist examination, usually juvenile and usually without needing surgery. It is a diagnostic criterion and in children often the presenting sign, which is why the criteria specify juvenile cataract rather than cataract.
  evidence:
  - reference: PMID:41160189

    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spinal ependymomas, the most commonly diagnosed gliomas in NF2-related SWN, may occur as
      multiple intramedullary, slow-growing, asymptomatic masses 1 (Figure 2).
    explanation: >-
      What the tumour is like, including the fact that it is usually silent. The trailing figure
      reference is the review's own and is carried because the snippet is verbatim.
  - reference: PMID:41160189
    reference_title: >-

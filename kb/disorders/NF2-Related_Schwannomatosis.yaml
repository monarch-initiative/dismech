    explanation: >-
      The rate of loss without treatment. Twenty-four patients, so read it as that cohort's slope.
  - reference: PMID:20301380
    reference_title: >-
      NF2-Related Schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NF2-related schwannomatosis (NF2) is characterized by bilateral vestibular schwannomas with

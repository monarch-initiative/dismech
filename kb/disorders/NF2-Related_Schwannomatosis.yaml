  role: effector
  biological_scale: MOLECULAR
  description: >-
    Biallelic inactivation in a single cell, which is where a tumour begins. The cell types that
    tolerate it and grow are Schwann cells, arachnoid cells and ependymal cells; why those and not
    others is not established by any cited source.

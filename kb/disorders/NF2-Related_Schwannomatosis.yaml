  - target: Loss of Merlin-Dependent Growth Restraint
    causal_link_type: DIRECT
    description: >-
      Losing both alleles removes the protein, and with it whatever restraint the protein imposes.
    evidence:
    - reference: PMID:38967126
      reference_title: >-
        The molecular biology of NF2/Merlin on tumorigenesis and development.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: MODEL_ORGANISM

  - reference: PMID:20301380
    reference_title: >-
      NF2-Related Schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mononeuropathy that occurs in childhood is an increasingly recognized finding; it frequently
      presents as a persistent facial palsy or hand/foot drop.
    explanation: >-
      The childhood mononeuropathy and the two forms it takes, from the disease's GeneReviews
      chapter.
diagnosis:
- name: Diagnostic criteria, 2022 revision
  diagnosis_term:
    preferred_term: genetic testing within the consensus diagnostic criteria
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Bilateral vestibular schwannoma alone makes the diagnosis; so does an identical NF2 variant in two
    anatomically distinct NF2-related tumours. Otherwise the criteria are a major-and-minor scheme.
    The 2022 revision is what put molecular data on the same footing as clinical features, and it is
    what retired the name neurofibromatosis 2.
  evidence:
  - reference: PMID:35674741
    reference_title: >-
      Updated diagnostic criteria and nomenclature for neurofibromatosis type 2 and schwannomatosis:
      An international consensus recommendation.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We reached consensus on the minimal clinical and genetic criteria for diagnosing NF2 and SWN.
      These criteria incorporate mosaic forms of these conditions.
    explanation: >-
      The consensus itself, and the thing that makes it matter for this entry: the criteria cover
      mosaic disease, which the earlier ones did not.
  - reference: PMID:35674741
    reference_title: >-
      Updated diagnostic criteria and nomenclature for neurofibromatosis type 2 and schwannomatosis:
      An international consensus recommendation.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the revised nomenclature, the term "neurofibromatosis 2" has been retired to improve
      diagnostic specificity.
    explanation: >-
      The nomenclature change, stated by the consensus paper that made it. This entry's name follows
      it; the retired name is kept in synonyms.
  - reference: PMID:39786185
    reference_title: >-
      Classification of schwannomas and the new naming convention for "neurofibromatosis-2": Genetic
      updates and international consensus recommendation.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The name of "neurofibromatosis type 2" has been changed to NF2-related schwannomatosis, to
      reflect the fact that neurofibromas do not occur in this syndrome and therefore the name
      "Neurofibromatosis" is factually incorrect.
    explanation: >-
      Why the name changed rather than just that it did: this syndrome produces schwannomas and not
      neurofibromas, so the old name named the wrong tumour.
  - reference: PMID:38897938
    reference_title: >-
      Historical Development of Diagnostic Criteria for NF2-related Schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most recent updated diagnostic criteria classify each disorder that predisposes to
      schwannoma according to the specific gene harboring a pathogenic variant. Therefore, NF2 is
      now termed NF2-related schwannomatosis.
    explanation: >-
      The organising principle of the new nomenclature: the gene names the disease, which is why
      SMARCB1-, LZTR1- and 22q-related schwannomatosis are siblings of this entry rather than
      variants of it.
  notes: >-
    The criteria themselves are a scored table and are not transcribed here. The entry records what
    they require at the level a curator needs and cites the consensus paper and two reviews of it;
    quoting a table row by row would be a transcription of a copyrighted scheme rather than evidence
    for a claim. One cited review dates the publication of the criteria to 2023 where every other
    source says 2022; the entry follows the consensus paper's own date.

- name: Magnetic resonance imaging of the brain and spine
  diagnosis_term:
    preferred_term: magnetic resonance imaging of the neuraxis
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    What finds the tumours, and what the surveillance interval is built around. One cited review
    recommends six-monthly scans for two years after presentation and then a scan two years later,
    on the reasoning that growth usually declares itself within the first three years.
  evidence:
  - reference: PMID:32232723
    reference_title: >-
      Vestibular Schwannoma: What We Know and Where We are Heading.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since growth usually manifests within the first 3 years after presentation, a recommended
      protocol for observation is serial MRI scans at 6 month intervals for 2 years and then another
      scan 2 years later.
    explanation: >-
      The interval and the reason for it. From a review of vestibular schwannoma generally, most of
      whose subject is sporadic disease, which is why this is INDIRECT for a syndrome in which
      tumours are multiple.
- name: Tumour testing for mosaicism
  diagnosis_term:
    preferred_term: molecular testing of two anatomically distinct tumours
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Blood testing misses most mosaic patients, and mosaics are a large minority. Testing two tumours
    from different parts of the nervous system is what distinguishes mosaic NF2-related
    schwannomatosis from the other schwannomatoses, and a negative blood test does not exclude it.
  evidence:
  - reference: PMID:41160189
    reference_title: >-
      History and clinical epidemiology of NF2-related schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given that as many of 60% of people with a clinical presentation consistent with NF2-SWN may
      have mosaic disease, clinicians should be aware of the need to test blood and ideally >= 2
      potentially associated tumours (i.e. schwannoma, meningioma, ependymoma) from distinct regions
      of the nervous system.
    explanation: >-
      The recommendation and the reason for it in one sentence. The source writes as many of 60% and
      uses a greater-than-or-equal sign; the snippet is quoted as written.
  - reference: PMID:41160189
    reference_title: >-
      History and clinical epidemiology of NF2-related schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If a shared NF2 variant is seen across the unique tumour samples and not found (or at low
      level) in blood, this confirms mosaic NF2-SWN.
    explanation: >-
      The decision rule the test implements.
  - reference: PMID:29909380
    reference_title: >-
      Schwannomatosis: a genetic and epidemiological study.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mosaic NF2 causes a substantial overlap with schwannomatosis resulting in the misdiagnosis of
      at least 9% of schwannomatosis cases.
    explanation: >-
      What happens when the test is not done: at least nine per cent of schwannomatosis diagnoses
      are mosaic NF2-related schwannomatosis.
treatments:
- name: Observation with serial imaging
  therapeutic_modality: OTHER
  action_category: MONITORING
  treatment_term:
    preferred_term: observation
    term:
      id: NCIT:C25598
      label: Observation Activity
  description: >-
    The default for most tumours, because the surgical risks are real and most tumours do not grow
    much. Across the natural-history study, about one in ten vestibular schwannomas grew by at least
    5 mm over four years.
  notes: >-
    NCIT files Observation Activity under Diagnostic Procedure and so inside the clinical-intervention
    tree TreatmentTerm is rooted at, which is why deciding not to operate can be bound as an action at
    all. Acoustic_Neuroma binds its own observation row to the same term. The separate NCIT:C15722
    Patient Observation sits under Observational Study instead and is outside the enum.
  evidence:
  - reference: PMID:15354016
    reference_title: >-
      Vestibular schwannoma growth rates in neurofibromatosis type 2 natural history consortium
      subjects.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CONCLUSION: Slightly greater than 1 in 10 diagnosed NF2-related vestibular schwannomas
      increased in size by at least 5 mm by 4 years of follow-up, if still untreated at that time.
    explanation: >-
      The empirical basis for observing rather than treating: fewer than one in ten untreated tumours grew
      by as much as 5 mm over four years. That is a threshold, not a measurement of no growth - the
      same paper puts the average increase at 1.3 mm a year. Fifty-six patients with 84 lesions at
      short-term follow-up and 29 at long.
  - reference: PMID:32232723
    reference_title: >-
      Vestibular Schwannoma: What We Know and Where We are Heading.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Due to surgical risks such as hearing loss, facial nerve dysfunction, post-operative headache,
      and cerebrospinal fluid leakage, a "watch and rescan" approach is adopted for most patients.
    explanation: >-
      The other half of the reasoning: what surgery costs. From a review mostly about sporadic
      tumours.
- name: Surgical resection
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: tumour resection
    term:
      id: NCIT:C164212
      label: Tumor Resection
  description: >-
    Translabyrinthine and retrosigmoid approaches are the usual ones. The first sacrifices hearing
    and is used where there is little to lose; the second preserves it better at a higher risk to the
    facial and cochlear nerves. In this syndrome the tumours are larger and multiple, and one review
    attributes lower surgical efficacy and higher complication rates to that.
  target_mechanisms:
  - target: Tumour Mass Effect on the Eighth Nerve
    treatment_effect: BYPASSES
    description: >-
      Removing the tumour removes the compression. Nothing upstream is addressed: the germline lesion
      remains in every cell and the other tumours are untouched, which is why a resected patient
      stays under surveillance.
    evidence:
    - reference: PMID:39786185
      reference_title: >-
        Classification of schwannomas and the new naming convention for "neurofibromatosis-2":
        Genetic updates and international consensus recommendation.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This intratumoral heterogeneity is hypothesized to contribute to the lower rates of
        surgical efficacy and higher rates of surgical complications observed in NF2-related VS
        compared to sporadic VS.
      explanation: >-
        Why the syndrome's tumours are harder to operate on than sporadic ones, offered by the
        review as a hypothesis rather than a finding.
  evidence:
  - reference: PMID:32232723
    reference_title: >-
      Vestibular Schwannoma: What We Know and Where We are Heading.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A major disadvantage is poor preservation of hearing, limiting the use of the TL approach to
      those with minimal or absent preoperative hearing.
    explanation: >-
      What decides between the two approaches.
  - reference: PMID:41160189
    reference_title: >-
      History and clinical epidemiology of NF2-related schwannomatosis.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      led to the designation of four treatment centres to manage all NF2-SWN patients in England
      commissioned in 2009 resulting in further improvement in survival
    explanation: >-
      What followed from treating this disease at specialist centres with more judicious use of
      surgery and radiation: four designated centres in England from 2009, and a further improvement
      in survival. An observational association across a national service change, not a trial. The
      snippet begins mid-sentence because the clause before it carries a citation bracket.
- name: Stereotactic radiosurgery
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: stereotactic radiosurgery
    term:
      id: NCIT:C15358
      label: Stereotactic Radiosurgery
  description: >-
    A single dose to the tumour, less applicable to large lesions. Hearing preservation falls with
    time rather than holding: from about half at five years to a third at ten and fifteen.
  notes: >-
    The hearing-preservation figures come from a review whose subject is vestibular schwannoma
    generally, not this syndrome. One cited source reports good long-term tumour control in mild
    patients with small tumours specifically.
  evidence:
  - reference: PMID:32232723
    reference_title: >-
      Vestibular Schwannoma: What We Know and Where We are Heading.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A more recent case-controlled study found that hearing preservation amongst patients decreases
      from 53% at 5 years to 34% at 10 and 15 years amongst all tumour grades [ 64 ].
    explanation: >-
      What the treatment preserves and for how long. Quoted with its timescale because a five-year
      figure alone would read as durable.
  - reference: PMID:31425178
    reference_title: >-
      Neurofibromatosis type 2 and related disorders.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cohort studies found survival analysis to hearing loss and unilateral visual loss in severe
      mutation groups was 32 and 38 years; active management gave better outcomes than surveillance
      in spinal ependymoma; gamma knife, bevacizumab and hearing preservation surgery maintained or
      improved short-term hearing in selected patients, and gamma knife had a good long-term tumour
      control in mild patients with small tumours.
    explanation: >-
      The scoping that matters: good long-term control in mild patients with small tumours, and
      short-term hearing maintenance in selected patients. The same sentence carries this entry's
      figures for the severe genotype groups.
  target_mechanisms:
  - target: Schwannoma Formation
    treatment_effect: INHIBITS
    description: >-
      A single dose arrests the tumour rather than removing it, and the control it gives is scoped
      to mild patients with small tumours. Nothing above the tumour in this entry's chain is
      addressed: the germline lesion remains in every cell and the other tumours are untouched.
    evidence:
    - reference: PMID:31425178
      reference_title: >-
        Neurofibromatosis type 2 and related disorders.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        gamma knife had a good long-term tumour control in mild patients with small tumours
      explanation: >-
        That the treatment acts on the tumour itself, with the scope the cohort studies give it.
        INDIRECT: the sentence reports tumour control rather than measuring an effect on
        schwannoma formation, and gamma knife is the delivery this row describes.
- name: Bevacizumab
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bevacizumab
      term:
        id: CHEBI:749495
        label: bevacizumab
  description: >-
    An anti-VEGF antibody, and the only drug in this entry with a pooled response rate. Across 161
    patients and 196 assessable tumours, 41% had partial regression and 47% no change; hearing
    improved in 20% and was stable in 69%. Seventeen per cent had serious toxicity.
  notes: >-
    No regulatory body has approved it for this disease; it is used off label with national
    endorsement. Benefit is not maintained after the drug is stopped, and the long-term concerns
    restrict its use in the children who often have the most severe disease.
  target_mechanisms:
  - target: Tumour Mass Effect on the Eighth Nerve
    treatment_effect: INHIBITS
    description: >-
      Shrinking the tumour reduces the compression. The drug acts on the tumour's vasculature rather
      than on merlin or on Hippo signalling, so nothing in this entry's chain above the tumour is
      addressed.
    evidence:
    - reference: PMID:31254266
      reference_title: >-
        Efficacy and safety of bevacizumab for vestibular schwannoma in neurofibromatosis type 2:
        a systematic review and meta-analysis of treatment outcomes.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Radiographic response to bevacizumab was partial regression in 41% (95% CI 31-51%), no
        change in 47% (95% CI 39-55%), and tumor progression in 7% (95% CI 1-15%).
      explanation: >-
        The tumour response, pooled across eight studies. INDIRECT for this link because
        radiographic regression is a measurement on the tumour rather than on the compression the
        node describes.
  evidence:
  - reference: PMID:31254266
    reference_title: >-
      Efficacy and safety of bevacizumab for vestibular schwannoma in neurofibromatosis type 2: a
      systematic review and meta-analysis of treatment outcomes.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with assessable audiometric data, bevacizumab treatment resulted in hearing
      improvement in 20% (95% CI 9-33%), stability in 69% (95% CI 51-85%) and additional loss in 6%
      (95% CI 1-15%) Serious bevacizumab toxicity was observed in 17% (95% CI 10-26%).
    explanation: >-
      The hearing response and the toxicity in one sentence, which is how they should be read. The
      source runs the two together without a full stop; the snippet is quoted as written.
  - reference: PMID:31254266
    reference_title: >-
      Efficacy and safety of bevacizumab for vestibular schwannoma in neurofibromatosis type 2: a
      systematic review and meta-analysis of treatment outcomes.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bevacizumab may arrest both tumor progression and hearing loss in select NF2 patients
      presenting with VS lesions. However, a considerable proportion of patients are anticipated to
      experience serious adverse events; correspondingly, judicious use of bevacizumab for
      symptomatic management of VS in NF2 is recommended.
    explanation: >-
      The authors' own conclusion, with its hedges intact: may arrest, in select patients, judicious
      use.
  - reference: PMID:39083549
    reference_title: >-
      Synergistic effect of PAK and Hippo pathway inhibitor combination in NF2-deficient Schwannoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most successful therapy to date has been the anti-VEGF drug bevacizumab. However, there
      are long term concerns for patients who start bevacizumab during adolescence, so many
      pediatric NF2 patients, who often have the most severe form of the disease, are restricted to
      surgical treatment.
    explanation: >-
      Where the drug stands and who cannot have it. The second clause is the clinically important
      one: the patients with the worst disease are the ones it is withheld from.
  - reference: PMID:41160189
    reference_title: >-
      History and clinical epidemiology of NF2-related schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, none have been approved by regulatory bodies for the treatment of NF2 driven tumors
      and are therefore used off label but with endorsement of national health agencies [ 64 , 66 ].
    explanation: >-
      The regulatory position, which the row's notes record so a reader does not take the response
      rates as licensing.
progression:
- phase: Childhood presentation
  notes: >-
    Half of patients have symptoms or tumours by 20. Children who present without a vestibular
    tumour - with an eye sign, a mononeuropathy or a seizure - are the ones who wait longest for a
    diagnosis, and most need an intervention during childhood.
  evidence:
  - reference: PMID:38897938
    reference_title: >-
      Historical Development of Diagnostic Criteria for NF2-related Schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fifty percent of NF2 patients present with symptoms and/or neoplastic manifestations by 20
      years of age, while nearly all NF2 patients present by 60 years of age.
    explanation: >-
      The age distribution of presentation, from a review.
  - reference: PMID:29535107
    reference_title: >-
      Diagnosis of sporadic neurofibromatosis type 2 in the paediatric population.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of those presenting under the age of 5, 89% (17/19) had ocular, 74% (14/19) dermatological and
      58% (11/19) neurological signs; in 84% (16/19) features were multisystemic.
    explanation: >-
      What the youngest children actually present with, in a 32-case childhood series: eyes and skin
      before anything auditory.
  - reference: PMID:29535107
    reference_title: >-
      Diagnosis of sporadic neurofibromatosis type 2 in the paediatric population.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most significant delay occurred in mononeuropathy, ophthalmological and/or seizure
      presentations, with a mean delay of 3, 4.5 and 6 years, respectively.
    explanation: >-
      The cost of those presentations: up to six years to diagnosis. The mean delay across the whole
      series was 3.16 years.
- phase: Tumour growth and hearing decline
  notes: >-
    Slow, and slower than the disease's reputation suggests. Across the natural-history study just
    over one in ten vestibular schwannomas grew by at least 5 mm in four years, and the average
    increase was 1.3 mm a year. Hearing nevertheless declines: about 4 dB a year in an untreated
    cohort followed nine years.
  evidence:
  - reference: PMID:15354016
    reference_title: >-
      Vestibular schwannoma growth rates in neurofibromatosis type 2 natural history consortium
      subjects.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On average, schwannomas increased in greatest diameter 1.3 mm per year across short-term
      follow-up.
    explanation: >-
      The growth rate, from the multicentre natural-history study.
  - reference: PMID:38578503
    reference_title: >-
      Natural history of hearing and tumor growth in vestibular schwannoma in neurofibromatosis type
      2-related schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study revealed that most patients with NF2 experienced deterioration in hearing acuity
      and tumor growth during the natural course.
    explanation: >-
      The authors' summary of the untreated course, which is the counterweight to the slow growth
      rate above.
- phase: Adult course and survival
  notes: >-
    Survival has improved markedly. Before 1990 patients averaged fifteen years from clinical
    diagnosis; a 2012 assessment still found survival significantly below the general population's,
    and the reviews credit specialist centres, less aggressive surgery and bevacizumab with the
    improvement since. The usual cause of death is the disease itself, often through loss of lower
    cranial nerve function and aspiration.
  evidence:
  - reference: PMID:41160189
    reference_title: >-
      History and clinical epidemiology of NF2-related schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prior to 1990, survival for NF2-SWN patients averaged only 15 years post clinical diagnosis
      with a mean actuarial survival of ~ 60 years [ 9 ].
    explanation: >-
      The historical baseline.
  - reference: PMID:41160189
    reference_title: >-
      History and clinical epidemiology of NF2-related schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NF2-SWN is associated with reduced life expectancy although this has shown improvement with
      specialist care and new treatments such as bevacizumab.
    explanation: >-
      Where it stands now, and what the review credits.
  - reference: PMID:29909380
    reference_title: >-
      Schwannomatosis: a genetic and epidemiological study.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Life expectancy was significantly better in schwannomatosis (mean age at death 76.9) compared
      with NF2 (mean age at death 66.2; p=0.004).
    explanation: >-
      A measured comparison against the sibling condition, which is also the clearest single number
      for how much this disease costs.
prevalence:
- population: England, Manchester region, diagnosed cases
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 2.0
  rate_denominator: POPULATION
  notes: >-
    1 in 50,500 in the most highly ascertained region; England as a whole gives a lower figure, 1 in
    58,000 in 2024, which is what incomplete ascertainment outside that region looks like. Within
    Manchester the figure has moved with ascertainment rather than with the disease: 1 in 200,000 in
    1992, 1 in 56,000 in 2010 and 1 in 50,500 in 2018, which the review attributes to earlier
    diagnosis and better survival. Read it as a diagnostic prevalence.
  evidence:
  - reference: PMID:41160189
    reference_title: >-
      History and clinical epidemiology of NF2-related schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most highly ascertained assessment of NF2-SWN cases from the Manchester region of England
      (population 4.8 million) gave a diagnostic prevalence of 1 in 50,500 and calculated birth
      prevalences of 1 in 27,956 respectively.
    explanation: >-
      Both figures from the most completely ascertained population, and the word the review uses for
      the first: diagnostic prevalence.
  - reference: PMID:41160189
    reference_title: >-
      History and clinical epidemiology of NF2-related schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The estimate of population diagnostic prevalence in Manchester increased to 1 in 56,000 in
      2010
    explanation: >-
      Why the number moves: the same sentence goes on to give 1 in 50,500 in 2018 and attributes the
      change to improved early diagnosis and better survival, not to the disease becoming commoner.
      The snippet stops before the citation brackets. This is the reason the record is a diagnostic
      prevalence rather than the frequency of the disease.
- population: Worldwide, pooled across studies
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 3.6
  rate_denominator: LIVE_BIRTHS
  notes: >-
    1 in 25,000 to 30,000 at birth, pooled across multiple studies, against a diagnostic point
    prevalence of 1 in 50,000 to 60,000 even where ascertainment is good. The gap between the two is
    the disease's own: late diagnosis and reduced survival. The rate recorded here is the midpoint of
    that range, 1 in 27,500.
  evidence:
  - reference: PMID:41160189
    reference_title: >-
      History and clinical epidemiology of NF2-related schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NF2-SWN has a birth prevalence globally estimated across multiple studies at 1 in 25-30,000.
      Because of diagnostics delays (especially in isolated cases) and reduced survival, the
      population diagnostic point prevalence even in populations with high ascertainment is closer
      to 1 in 50-60,000.
    explanation: >-
      Both quantities and the explanation of why they differ, in one sentence.
  - reference: PMID:20082463
    reference_title: >-
      Birth incidence and prevalence of tumor-prone syndromes: estimates from a UK family genetic
      register service.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Best estimates for birth incidence were: 1 in 2,699; 1 in 8,619; 1 in 14,963, 1 in 33,000; and
      1 in 42,987, respectively.
    explanation: >-
      The primary register study behind the UK figures. The list runs in the order of the diseases
      named earlier in the abstract, so the value for this disease is the fourth, 1 in 33,000; the
      entry does not record that figure as its own because the sentence does not name the disease.
discussions:
- discussion_id: nf2_merlin_membrane_or_nucleus
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does merlin suppress tumours by recruiting LATS to the plasma membrane, or by inhibiting a
    nuclear ubiquitin ligase that would otherwise inactivate LATS there?
  attaches_to:
  - pathophysiology#Loss of Merlin-Dependent Growth Restraint
  - pathophysiology#YAP and TAZ Activation
  rationale: >-
    Two cited papers answer this in opposite directions and each says the other is wrong. One shows,
    in flies and in mammalian cells, that merlin binds LATS and recruits it to the plasma membrane,
    and concludes that this is an evolutionarily conserved molecular function of merlin. The other
    states the question as open and concludes that merlin acts largely, if not exclusively, in the
    nucleus by repressing a ubiquitin ligase that inhibits LATS there - and says so against the
    membrane model by name. Both support their claim in Schwann cells or in patient-derived
    schwannoma material. A third, later paper cites both as parallel routes without deciding.
    Nothing cited here resolves it, and the entry's edge from merlin loss to YAP activation is drawn
    through known intermediates for that reason: the intermediates are known, their order is not.
  evidence:
  - reference: PMID:24012335
    reference_title: >-
      Spatial organization of Hippo signaling at the plasma membrane mediated by the tumor
      suppressor Merlin/NF2.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our study demonstrates that an important and evolutionarily conserved molecular function of
      Merlin is to promote the membrane association of Wts/Lats.
    explanation: >-
      The membrane model, stated as the paper's own demonstration.
  - reference: PMID:25026211
    reference_title: >-
      Merlin/NF2 loss-driven tumorigenesis linked to CRL4(DCAF1)-mediated inhibition of the hippo
      pathway kinases Lats1 and 2 in the nucleus.
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      These findings support the conclusion that Merlin suppresses tumorigenesis by inhibiting
      CRL4DCAF1 and hence stabilizing activated Lats in the nucleus, rather than by recruiting Lats
      to the plasma membrane.
    explanation: >-
      The nuclear model, stated against the membrane one in the same sentence. REFUTE against the
      claim above, which is what makes this a controversy rather than two complementary findings.
  - reference: PMID:25026211
    reference_title: >-
      Merlin/NF2 loss-driven tumorigenesis linked to CRL4(DCAF1)-mediated inhibition of the hippo
      pathway kinases Lats1 and 2 in the nucleus.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: >-
      It is currently unclear whether Merlin/NF2 suppresses tumorigenesis by activating upstream
      components of the Hippo pathway at the plasma membrane or by inhibiting the E3 ubiquitin
      ligase CRL4(DCAF1) in the nucleus.
    explanation: >-
      The question itself, stated as open by one of the two groups answering it.
  - reference: PMID:32960816
    reference_title: >-
      Schwannoma development is mediated by Hippo pathway dysregulation and modified by RAS/MAPK
      signaling.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: >-
      In parallel, Merlin recruits LATS1/2 kinases to the plasma membrane for phosphorylation and
      activation by MST1/2 kinases ( 13 ). Merlin can also modulate LATS1/2 activity through
      CRL4DCAF1 ( 14 ).
    explanation: >-
      A later paper citing both routes as parallel and deciding between neither, which is the state
      the entry records.
- discussion_id: nf2_cell_type_specificity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    One NF2 allele is inactivated in every cell of a patient with a germline variant, so every lineage
    is one somatic event from losing merlin, yet the tumours are Schwann cell, arachnoid and
    ependymal. Why those lineages and not others?
  attaches_to:
  - pathophysiology#Somatic Loss of the Remaining NF2 Allele
  - pathophysiology#Schwannoma Formation
  rationale: >-
    This is the question the entry's own chain cannot answer and the one its sources name. The
    second hit is required and the Hippo arm is necessary and sufficient in the Schwann cell lineage,
    but nothing cited says why a cell of that lineage tolerates biallelic loss and grows where
    others do not. The same review that lists the three tumour types says in terms that the
    mechanism in these specific cell types remains unclear, and another says that biallelic loss may
    not be sufficient and that further alterations are required without naming them. The gap matters
    practically: a drug acting on the pathway acts everywhere, and what makes the tumours appear
    where they do is also what might make a treatment selective.
  evidence:
  - reference: PMID:38967126
    reference_title: >-
      The molecular biology of NF2/Merlin on tumorigenesis and development.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NF2 gene mutations are specifically associated with the development of schwannomas,
      meningiomas, and ependymomas, though the precise mechanisms by which these mutations lead to
      tumor formation in these specific cell types, while sparing others, remain incompletely
      understood, underscoring the complexity of NF2's role in tumorigenesis.
    explanation: >-
      The gap, with the sparing-others clause that is the whole of the question.
  - reference: PMID:38897938
    reference_title: >-
      Historical Development of Diagnostic Criteria for NF2-related Schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, to promote tumorigenesis, NF2 mutations alone may be insufficient, and additional
      genetic alterations are required.
    explanation: >-
      The adjacent gap: what else is needed is not named by any cited source.
- discussion_id: nf2_model_system_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    The most-used human schwannoma cell line retains partial merlin function, and the mouse model
    that makes the most schwannomas makes a tumour spectrum wider than the human syndrome. How much
    of the mechanism in this entry transfers?
  attaches_to:
  - pathophysiology#YAP and TAZ Activation
  - pathophysiology#Schwannoma Formation
  rationale: >-
    Two specific mismatches are stated by the papers that use the models. HEI-193, the human
    schwannoma line most of this literature runs on, carries a splice-site variant producing a
    truncated merlin that others have shown retains moderately active tumour-suppressive ability, and
    the authors who report this say in terms that it may not be a good model for most patient
    tumours. The Lats1/2 mouse that establishes the Hippo arm genetically produces schwannomas whose
    histology matches the human tumour, and its authors say the syndrome's spectrum in that mouse is
    beyond the scope of human schwannomatosis. A third mismatch sits inside the same mouse work:
    deleting YAP alone did not impair schwannoma growth, where deleting YAP and TAZ together did, so
    a result framed as YAP-driven rests on the pair.
  evidence:
  - reference: PMID:39083549
    reference_title: >-
      Synergistic effect of PAK and Hippo pathway inhibitor combination in NF2-deficient Schwannoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      HEI-193 cells have been a popular model for NF2-related schwannoma and were therefore included
      in many parts of this study. However, others have shown that the truncated version of Merlin
      still retains moderately active tumor suppressive abilities ... HEI-193 cells, therefore, may
      not be a good model for most NF2 patient tumors.
    explanation: >-
      The cell-line mismatch, stated by a group that used the line anyway and said why that is a
      problem.
  - reference: PMID:32960816
    reference_title: >-
      Schwannoma development is mediated by Hippo pathway dysregulation and modified by RAS/MAPK
      signaling.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although the herein described mouse model produces schwannomas with matching histology, the
      spectrum of this mouse tumor syndrome is beyond the scope of human schwannomas or
      schwannomatosis.
    explanation: >-
      The mouse mismatch, in the model paper's own words: the histology matches and the syndrome
      does not.
  - reference: PMID:32960816
    reference_title: >-
      Schwannoma development is mediated by Hippo pathway dysregulation and modified by RAS/MAPK
      signaling.
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unexpectedly, loss of YAP did not significantly impair schwannoma growth in vivo, with results
      being highly variable depending on the specific shRNA and experimental replicate (Figure 3,
      B-D).
    explanation: >-
      The negative result inside the same paper, which is why this entry's node is YAP and TAZ
      rather than YAP.
notes: >-
  MONDO moved this term between releases. The local build read on 21 October 2026 gives its parent as
  MONDO:0021061 neurofibromatosis; the OLS release of 3 November 2026 gives MONDO:0008075
  schwannomatosis. Anything in this repository that resolves MONDO through conf/oak_config.yaml sees
  the second. The parents field here follows the newer one.

  Twenty publications are cited, plus one ClinGen gene-disease validity record. Nine of the twenty are
  cached as full text and carry the molecular mechanism; the other eleven are cached as abstracts
  or, for the GeneReviews chapter, as its summary sections. A statement here about what the
  literature does not contain is a statement about those twenty, not about the whole literature.

  Three quantities in this entry move with ascertainment rather than with the disease, and the entry
  says so where it gives them. The diagnostic point prevalence rose from 1 in 200,000 in 1992 to 1 in
  50,500 in 2018 in the same region. The proportion of de novo patients found to be mosaic rose as sequencing improved: GeneReviews gives
  25% to 50%, and the most recent review puts the current estimate close to 60%. And survival has improved since
  1990 for reasons the reviews attribute to specialist care and bevacizumab rather than to anything
  about the disease.

  The mechanism below merlin is contested rather than unknown, and that is recorded as a controversy
  rather than smoothed over: two cited papers place merlin's action on LATS at the plasma membrane
  and in the nucleus respectively, and each argues against the other. The entry's edge from merlin
  loss to YAP activation is drawn through known intermediates for that reason.

  This entry does not duplicate the tumour entries. Acoustic_Neuroma, Meningioma, Schwannoma and
  Ependymoma carry the biology of the constituent tumours; what is curated here is the syndrome - the
  germline lesion, the two-hit mechanism, the diagnostic criteria, the tumour spectrum as phenotypes,
  surveillance and outcome.
review_notes: >-
  Written from cached sources only, by hand, from a literature digest. The references cached for that digest but not cited are not committed with this entry. Of the
  twenty-one references it quotes, twenty are newly cached here and the GeneReviews chapter was
  already in the repository. Three phenotypes are left causally
  unconnected on purpose. The cataract, the retinal hamartoma and the neuropathy are not tumours and
  no cited source says what produces them: the reviews list them as manifestations and the criteria
  count them as signs, and that is all. Drawing an edge from the merlin node to a lens opacity would
  assert a mechanism nothing here supports. They remain in the entry because two of them are
  diagnostic criteria and the third is a presenting feature in children.

  Several source typographical errors are preserved inside snippets rather than corrected, because a
  snippet is a quotation: intrasmedullary for intramedullary, as many of 60%, and a sentence that
  runs two statements together without a full stop. Several snippets stop before a citation bracket,
  because the reference validator treats a bracketed span as an elision and the text either side of
  it must then match the source exactly.

  One scope question is logged and not settled. kb/disorders/Schwannomatosis.yaml is bound to
  MONDO:0008075, which MONDO's current release makes the parent of this entry's term - but that entry
  is written as the non-NF2 disease, with non-NF2 schwannomatosis among its synonyms and SMARCB1- and
  LZTR1-related subtypes. Creating this entry breaks nothing mechanically, since the terms differ,
  but the two entries will then make incompatible claims about what MONDO:0008075 covers. That is
  another curator's entry and the fix is theirs to choose.

  Neurofibromatosis.yaml carries an NF2 subtype row bound to this entry's term, whose description
  says the entity is currently uncurated as a standalone dismech entry. That becomes false when this
  merges and needs a curated_in pointer; it is a separate PR against a file this one does not touch.

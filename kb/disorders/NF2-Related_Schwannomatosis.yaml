synonyms:
- NF2
- neurofibromatosis type 2
- neurofibromatosis 2
- bilateral acoustic neurofibromatosis
description: >-
  A dominantly inherited tumour-predisposition syndrome caused by loss of the NF2 tumour suppressor,
  whose hallmark is bilateral vestibular schwannoma and whose other tumours - meningioma, ependymoma,
  peripheral and spinal schwannoma - follow from the same two-hit mechanism in different cell types.
  The disease the field now calls NF2-related schwannomatosis was called neurofibromatosis type 2 until
  2022, when the diagnostic criteria were revised and that name was retired. A large minority of
  patients are mosaic rather than constitutionally heterozygous, which makes their disease milder,
  later and more asymmetrical, and which is why genetic testing is part of the criteria rather than a
  confirmation of them.
references:
- reference: PMID:20301380
  title: "NF2-Related Schwannomatosis."
  tags:
  - GeneReviews
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A constitutional heterozygous NF2 variant is transmitted dominantly, and the tumours follow a
    second somatic hit in the remaining allele.
  evidence:
  - reference: PMID:38967126
    reference_title: >-
      The molecular biology of NF2/Merlin on tumorigenesis and development.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NF2 mutations are specifically linked to the development of schwannomas, meningiomas, and
      ependymomas, although the precise mechanisms of tumor formation in these specific cell types
      remain unclear.
    explanation: >-
      The tumour spectrum the germline variant predisposes to, with the review's own statement of what is
      not understood: why those three cell types and not others. INDIRECT for the inheritance claim,
      which this sentence does not make; the GeneReviews item below states it directly.
  - reference: PMID:20301380
    reference_title: >-
      NF2-Related Schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NF2 is inherited in an autosomal dominant manner.
    explanation: >-
      The inheritance claim this block makes, stated by the disease's GeneReviews chapter.
      REVIEW_SYNTHESIS because a GeneReviews chapter synthesises work its authors did not all
      perform.
- name: Mosaic
  inheritance_term:
    preferred_term: typified by somatic mosaicism
    term:
      id: HP:0001442
      label: Typified by somatic mosaicism
  description: >-
    A large minority of patients are not constitutionally heterozygous but mosaic, the variant having
    arisen after fertilisation. Their disease is milder, later and more asymmetrical, and their risk of
    transmitting it is below the dominant one - which is why this is a second inheritance block rather
    than a footnote on the first.
  evidence:
  - reference: PMID:36762955
    reference_title: >-
      Updated protocol for genetic testing, screening and clinical management of individuals at risk
      of NF2-related schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing and management of individuals at risk for NF2-related schwannomatosis is
      complicated by the high rate of mosaicism resulting in a milder, later onset, more
      asymmetrical disease and the phenotypic overlap with the related schwannomatosis conditions.
    explanation: >-
      The mosaic arm and its three clinical consequences, from the protocol of a national testing service.
      It states the rate as high without giving a number. PRIMARY_RESULT: the paper is a research
      article setting out its own service's protocol, not a synthesis of others' work.
  - reference: PMID:36762955
    reference_title: >-
      Updated protocol for genetic testing, screening and clinical management of individuals at risk
      of NF2-related schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This updated protocol, reflects the lower transmission risks now inferred in mosaic
      NF2-related schwannomatosis, informed by the greater sensitivity of Next Generation Sequencing
      in detecting low levels of mosaicism in blood, along with improved ability to analyse tumour
      DNA.
    explanation: >-
      Why the transmission risk differs from the dominant one and why the estimate has moved: better
      detection of low-level mosaicism in blood. PRIMARY_RESULT, because this is a research paper
      rather than a review and the risks it reports were derived from genetic testing of over 1000
      individuals through the Manchester service, which the preceding sentence of the abstract
      states.
  - reference: PMID:20301380
    reference_title: >-
      NF2-Related Schwannomatosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As many as 25% to 50% of individuals with a de novo NF2 pathogenic variant have somatic
      mosaicism for the variant.
    explanation: >-
      The proportion of de novo cases that are mosaic, as the GeneReviews chapter puts it. A newer
      review raises the current estimate to close to 60%, which is the movement this entry's notes
      describe.
genetic:
- name: NF2 germline inactivating variants
  gene_term:
    preferred_term: NF2
    term:
      id: hgnc:7773
      label: NF2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE_AND_SOMATIC
  notes: >-
    The gene sits on the long arm of chromosome 22 and encodes merlin. A constitutional inactivating
    variant is the first hit; the tumours arise where a somatic second hit removes the remaining
    allele, which is why a dominantly inherited syndrome produces discrete tumours rather than a
    diffuse phenotype. Recorded as GERMLINE_AND_SOMATIC for that reason rather than because two
    separate classes of patient exist.

    ClinGen's General Gene Curation Expert Panel classified this gene-disease pair Definitive for
    autosomal dominant inheritance in 2019, against this entry's own MONDO term; that assertion is
    recorded below rather than restated here.

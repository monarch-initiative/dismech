prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    One family is reported: the Mexican-mestizo pedigree of the index child.
    A screen of 262 further genotype-negative LQTS patients in the same report
    found no other SCN4B variant, and the 2020 reappraisal found no later
    case-control or family data. No population rate can be estimated.
  evidence:
  - reference: PMID:17592081
    reference_title: SCN4B-encoded sodium channel beta4 subunit in congenital long-QT syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SCN4B was analyzed in 262 genotype-negative LQTS patients (96% white), but
      no further mutations were found.
    explanation: >-
      Beyond the index family, the primary report's replication screen found no
      second SCN4B carrier.
  - reference: PMID:31983240
    reference_title: "An International, Multicentered, Evidence-Based Reappraisal of Genes Reported to Cause Congenital Long QT Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further literature, including case-control studies, to extend the level of
      genetic evidence to support causality for these genes was absent.
    explanation: >-
      The reappraisal found no later reports extending the SCN4B evidence, so
      the reported case count remains the one family.
pathophysiology:
- name: SCN4B L179F Sodium Channel Beta-4 Subunit Variant
  conforms_to: "cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant"
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A heterozygous missense variant (L179F, c.535C>T) in SCN4B, the gene for
    the Nav beta-4 regulatory subunit of the cardiac sodium channel, was
    reported in one three-generation family ascertained through a child with
    long QT syndrome. The beta subunits modulate the gating of the pore-forming
    Nav1.5 alpha subunit.
  genes:
  - preferred_term: SCN4B
    term:
      id: hgnc:10592
      label: SCN4B
  molecular_functions:
  - preferred_term: sodium channel regulator activity
    term:
      id: GO:0017080
      label: sodium channel regulator activity
    modifier: ABNORMAL
  evidence:
  - reference: PMID:17592081
    reference_title: SCN4B-encoded sodium channel beta4 subunit in congenital long-QT syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      complete mutational analysis of the 4 Na(vbeta)-subunits revealed a L179F
      (C535T) missense mutation in SCN4B that cosegregated properly throughout a
      3-generation pedigree and was absent in 800 reference alleles.
    explanation: >-
      The primary report of the index variant underlying the LQT10 designation.
  - reference: PMID:37544648
    reference_title: Beta-subunit-eliminated eHAP expression (BeHAPe) cells reveal subunit regulation of the cardiac voltage-gated sodium channel.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In diploid BeHAPe cells, the cardiac NaV α-subunit, NaV1.5, was highly
      sensitive to β-subunit modulation and revealed that each β-subunit and even
      MPZ imparted unique gating properties.
    directness: INDIRECT
    explanation: >-
      Establishes that each Nav beta subunit, beta-4 included, alters Nav1.5
      gating, the route by which a beta-4 variant could change cardiac sodium
      current. It says nothing about the L179F variant itself.
  downstream:
  - target: Increased Cardiac Late Sodium Current
    hypothesis_groups:
    - scn4b_late_sodium_current
    description: >-
      Coexpressed with Nav1.5 in HEK293 cells, the L179F beta-4 subunit
      increased the late sodium current relative to wild-type beta-4.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17592081
      reference_title: SCN4B-encoded sodium channel beta4 subunit in congenital long-QT syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Compared with the wild-type, L179F-beta4 caused an 8-fold (compared with
        SCN5A alone) and 3-fold (compared with SCN5A + WT-beta4) increase in late
        sodium current
      explanation: >-
        The functional finding for the index variant, from heterologous
        expression with the SCN5A-encoded Nav1.5 alpha subunit.
    - reference: PMID:18606002
      reference_title: Congenital long QT syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The mutation (L179F) leads to an increased window current with a
        molecular phenotype consistent with LQT3.
      explanation: >-
        The review's summary of the same functional work, which it describes as
        an increased window current; kept as secondary to the primary report.
- name: Increased Cardiac Late Sodium Current
  conforms_to: "cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant"
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    An increased late (persistent) inward sodium current through Nav1.5 during
    the action potential plateau, the molecular phenotype of SCN5A-related
    LQT3. In LQT3 this gain of inward sodium current prolongs the ventricular
    action potential; for SCN4B the equivalence rests on the one functional
    study of L179F in a heterologous cell line.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: sodium ion transmembrane transport
    term:
      id: GO:0035725
      label: sodium ion transmembrane transport
    modifier: INCREASED
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:17592081
    reference_title: SCN4B-encoded sodium channel beta4 subunit in congenital long-QT syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      increase in late sodium current consistent with the molecular/electrophysiological
      phenotype previously shown for LQTS-associated mutations.
    explanation: >-
      The primary report's statement that the L179F late-current increase
      matches the LQTS-associated sodium current phenotype.
  - reference: PMID:18606002
    reference_title: Congenital long QT syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mutation (L179F) leads to an increased window current with a
      molecular phenotype consistent with LQT3.
    explanation: >-
      Review statement of the same finding, described as window current.
  downstream:
  - target: Prolonged Ventricular Action Potential Duration
    hypothesis_groups:
    - scn4b_late_sodium_current
    description: >-
      By analogy with LQT3, an increased inward sodium current during the
      plateau delays repolarization and prolongs the ventricular action
      potential.
    evidence:
    - reference: PMID:18606002
      reference_title: Congenital long QT syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      directness: INDIRECT
      snippet: >-
        Na + channel mutations produce the LQTS phenotype
        by inducing a "gain of function" leading to increase in the Na+ inward
        current which prolongs action potential duration.
      explanation: >-
        Stated for SCN5A (LQT3) channel mutations; applied to SCN4B only through
        the statement that L179F has an LQT3-like molecular phenotype.
    - reference: PMID:20226894
      reference_title: Sudden infant death syndrome-associated mutations in the sodium channel beta subunits.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: >-
        In native cardiomyocytes, beta4-S206L accentuated late I(Na) and
        increased the ventricular action potential duration compared with
        beta4-WT.
      explanation: >-
        A different SCN4B variant (S206L, from a sudden infant death case) that
        increases late sodium current also prolongs the action potential in
        adult rat ventricular myocytes. It shows that a beta-4-driven late
        current increase can lengthen the action potential, but it is not the
        L179F variant and L179F was not studied in myocytes.

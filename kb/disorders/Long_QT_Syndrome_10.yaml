name: Long QT Syndrome 10
creation_date: '2026-10-14T00:00:00Z'
description: >-
  Long QT syndrome 10 (LQT10) is the numbered long QT syndrome designation
  attached to SCN4B, which encodes the beta-4 regulatory subunit of the cardiac
  voltage-gated sodium channel. The designation rests on a single report of an
  SCN4B missense variant (L179F) in a child with marked QT prolongation and 2:1
  atrioventricular block, in whom the variant increased the sodium window
  current in a pattern resembling SCN5A-related LQT3. ClinGen's long QT gene
  curation expert panel classifies the SCN4B-long QT syndrome relationship as
  Disputed, because it rests on a candidate-gene finding in one family without
  segregation or case-control data. The entry records the proposed mechanism
  and the one reported phenotype, not an established Mendelian disease.
category: Genetic
disease_term:
  preferred_term: long QT syndrome 10
  term:
    id: MONDO:0012737
    label: long QT syndrome 10
synonyms:
- LQT10
- LQTS10
- SCN4B-related long QT syndrome
parents:
- Familial Long QT Syndrome
- Channelopathy
notes: >-
  Evidence strength. ClinGen's Long QT Syndrome Gene Curation Expert Panel
  (assertion CGGV:assertion_0e276096-21ab-42bc-866a-b1b4dcb01753, SOP7, 2018,
  published as Adler et al. 2020, PMID:31983240) classifies SCN4B as Disputed
  for long QT syndrome. The panel's stated grounds are a candidate-gene
  approach, the absence of segregation or case-control data, and little
  further genetic or experimental data. MONDO nevertheless asserts SCN4B as the
  causal gene (RO:0004003) of MONDO:0012737. The genetic record here is typed
  DISPUTED to follow ClinGen, and the disagreement with MONDO is about the
  strength of the evidence, not about which gene the designation names.

  Why gene_disease_validity is not filled. The ClinGen assertion is made
  against MONDO:0002442 long QT syndrome, not against MONDO:0012737 long QT
  syndrome 10, so under the rule that a copied tier must be for the entry's own
  disease term it is cited as evidence on the genetic record rather than
  recorded in gene_disease_validity.

  Primary report. The original description of the SCN4B L179F variant
  (Medeiros-Domingo et al., Circulation 2007) is not cited in this entry; the
  phenotype and variant statements are taken from the Crotti et al. 2008 review
  (PMID:18606002), which summarizes that report from its 2006 abstract. That
  review states the variant increases the sodium window current; the entry does
  not separately assert an increased late (persistent) sodium current, because
  no cited source here states it for SCN4B.

  Scope. This is a gene-specific child of the familial long QT syndrome entry
  (Long_QT_Syndrome, has_subtypes Type 10). SCN4B appears in multigene panels
  for Brugada syndrome and sudden unexplained nocturnal death syndrome, but
  those are different diseases and are not merged here; in one Southern Chinese
  postmortem series of 123 sudden unexplained nocturnal death cases no
  non-synonymous SCN4B variant was found (PMID:24529773).

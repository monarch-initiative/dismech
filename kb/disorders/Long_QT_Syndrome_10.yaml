        molecular phenotype consistent with LQT3.
      explanation: >-
        The review's summary of the functional finding for the index variant.
- name: Increased Cardiac Sodium Window Current
  conforms_to: "cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant"
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    An increased inward sodium window current during the action potential
    plateau, the same molecular phenotype as SCN5A-related LQT3. In LQT3 this
    gain of inward sodium current prolongs the ventricular action potential;
    for SCN4B the equivalence rests on the one functional study of L179F.

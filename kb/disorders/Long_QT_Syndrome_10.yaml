mechanistic_hypotheses:
- hypothesis_group_id: scn4b_late_sodium_current
  hypothesis_label: SCN4B variant raises cardiac late sodium current, as in LQT3
  status: EMERGING
  description: >-
    The proposed model: the L179F variant in the sodium channel beta-4 subunit
    increases the late (persistent) Nav1.5 current, which delays ventricular
    repolarization and prolongs the QT interval in the way SCN5A gain-of-function
    variants do in LQT3. The current change has been shown only in one
    heterologous-expression study, and the variant has been found in one family
    without significant segregation, so the gene-disease relationship the model
    explains is itself disputed. Recorded as EMERGING rather than CANONICAL for
    that reason; the open question is the knowledge gap
    lqt10_scn4b_causality_unestablished.
discussions:
- discussion_id: lqt10_scn4b_causality_unestablished
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do SCN4B variants cause long QT syndrome at all, or is L179F in the index
    family a rare variant co-occurring with a QT prolongation of other cause?
  rationale: >-
    The LQT10 designation rests on one missense variant in one family, found by
    candidate-gene screening and not seen in other genotype-negative LQTS
    patients (262 screened in the primary report), with no statistically
    significant segregation and no case-control data. The functional evidence
    is a single heterologous-expression study reporting an LQT3-like increase in
    late sodium current. Without segregation in further families or a
    rare-variant burden in LQTS cohorts, the causal edge from the SCN4B variant
    to the sodium current change, and from there to QT prolongation, is a
    hypothesis rather than an established mechanism.
  attaches_to:
  - genetic#SCN4B
  - pathophysiology#SCN4B L179F Sodium Channel Beta-4 Subunit Variant
  - mechanistic_hypotheses#scn4b_late_sodium_current
  evidence:
  - reference: PMID:31983240
    reference_title: "An International, Multicentered, Evidence-Based Reappraisal of Genes Reported to Cause Congenital Long QT Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further literature, including case-control studies, to extend the level of
      genetic evidence to support causality for these genes was absent.
    explanation: States that no case-control or further genetic evidence exists for SCN4B in LQTS.

  association: Disputed as a cause of congenital long QT syndrome
  notes: >-
    SCN4B encodes the Nav beta-4 subunit of the cardiac sodium channel and
    carries the LQT10 designation. ClinGen classifies the SCN4B-long QT syndrome
    relationship as Disputed (assertion against MONDO:0002442, not against
    MONDO:0012737, so the tier is cited as evidence here rather than recorded in
    gene_disease_validity). The relationship rests on one missense variant in one
    genotype-negative LQTS family, found by a candidate-gene approach and absent
    from other genotype-negative patients screened, with no segregation or
    case-control data.
  variants:

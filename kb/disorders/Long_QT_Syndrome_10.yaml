    snippet: "SCN4B | HGNC:10592 | long QT syndrome | MONDO:0002442 | AD | Disputed"
    explanation: The ClinGen validity row behind the DISPUTED typing of this record.
  - reference: CGGV:assertion_0e276096-21ab-42bc-866a-b1b4dcb01753-2018-09-25T160000.000Z
    reference_title: "SCN4B / long QT syndrome (Disputed)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Its association with LQTS is based on a study utilizing a candidate gene
      approach which identified a missense variant in a genotype-negative LQTS
      family but not in other genotype-negative LQTS patients.
    explanation: The whole of the genetic evidence the panel found for SCN4B in LQTS.
  - reference: CGGV:assertion_0e276096-21ab-42bc-866a-b1b4dcb01753-2018-09-25T160000.000Z
    reference_title: "SCN4B / long QT syndrome (Disputed)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Because of the candidate gene approach, lack of segregation or
      case-control data and paucity of additional genetic and experimental data,
      this gene-disease association was classified as disputed.
    explanation: The panel's stated grounds for disputing the SCN4B-LQTS association.
  - reference: PMID:31983240
    reference_title: "An International, Multicentered, Evidence-Based Reappraisal of Genes Reported to Cause Congenital Long QT Syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six genes, AKAP9, ANK2, KCNE2, KCNJ5, SCN4B, and SNTA1, were classified as
      disputed, defined as the absence of sufficient genetic evidence to support
      causation of LQTS
    explanation: The published reappraisal behind the ClinGen classification.
  - reference: PMID:31983240
    reference_title: "An International, Multicentered, Evidence-Based Reappraisal of Genes Reported to Cause Congenital Long QT Syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Publications on 4 of these genes (AKAP9, KCNE2, SCN4B, SNTA1) were based on
      a candidate gene approach, in contrast to an unbiased genome-wide
      methodology, and lacked evidence of statistically significant segregation
      of the suspected variant in multiple affected cases beyond chance alone.
    explanation: States the specific weakness of the SCN4B evidence.
discussions:
- discussion_id: lqt10_scn4b_causality_unestablished
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do SCN4B variants cause long QT syndrome at all, or is L179F in the index
    family a rare variant co-occurring with a QT prolongation of other cause?
  rationale: >-
    The LQT10 designation rests on one missense variant in one family, found by
    candidate-gene screening and not seen in other genotype-negative LQTS
    patients, with no statistically significant segregation and no case-control
    data. The functional evidence is a single in vitro study reporting an
    LQT3-like window current. Without segregation in further families or a
    rare-variant burden in LQTS cohorts, the causal edge from the SCN4B variant
    to the sodium current change, and from there to QT prolongation, is a
    hypothesis rather than an established mechanism.
  attaches_to:
  - genetic#SCN4B
  - pathophysiology#SCN4B L179F Sodium Channel Beta-4 Subunit Variant
  evidence:
  - reference: PMID:31983240
    reference_title: "An International, Multicentered, Evidence-Based Reappraisal of Genes Reported to Cause Congenital Long QT Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further literature, including case-control studies, to extend the level of
      genetic evidence to support causality for these genes was absent.
    explanation: States that no case-control or further genetic evidence exists for SCN4B in LQTS.

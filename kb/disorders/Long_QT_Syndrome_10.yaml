pathophysiology:
- name: SCN4B L179F Sodium Channel Beta-4 Subunit Variant
  conforms_to: "cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant"
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A heterozygous missense variant (L179F) in SCN4B, the gene for the Nav
    beta-4 regulatory subunit of the cardiac sodium channel, was reported in a
    single child with long QT syndrome. The beta subunits modulate the gating of
    the pore-forming Nav1.5 alpha subunit.
  genes:
  - preferred_term: SCN4B
    term:
      id: hgnc:10592
      label: SCN4B
  molecular_functions:
  - preferred_term: sodium channel regulator activity
    term:
      id: GO:0017080
      label: sodium channel regulator activity
    modifier: ABNORMAL
  evidence:
  - reference: PMID:18606002
    reference_title: Congenital long QT syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recently, a mutation on the sodium channel subunit NaV β4 was identified
      in an asymptomatic child with major QT prolongation and 2:1 AV block
    explanation: >-
      Review summary of the single index report underlying the LQT10
      designation.
  - reference: PMID:37544648
    reference_title: Beta-subunit-eliminated eHAP expression (BeHAPe) cells reveal subunit regulation of the cardiac voltage-gated sodium channel.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In diploid BeHAPe cells, the cardiac NaV α-subunit, NaV1.5, was highly
      sensitive to β-subunit modulation and revealed that each β-subunit and even
      MPZ imparted unique gating properties.
    directness: INDIRECT
    explanation: >-
      Establishes that each Nav beta subunit, beta-4 included, alters Nav1.5
      gating, the route by which a beta-4 variant could change cardiac sodium
      current. It says nothing about the L179F variant itself.
  downstream:
  - target: Increased Cardiac Sodium Window Current
    description: >-
      The reported L179F variant increased the sodium window current through
      Nav1.5.
    causal_link_type: DIRECT

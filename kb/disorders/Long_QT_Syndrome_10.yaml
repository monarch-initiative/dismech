    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18606002
      reference_title: Congenital long QT syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Congenital long QT syndrome (LQTS) is a hereditary cardiac disease
        characterized by a prolongation of the QT interval at basal ECG and by a
        high risk of life-threatening arrhythmias.
      explanation: Links the inherited repolarization defect to QT prolongation on the basal ECG.
  - target: 2:1 Atrioventricular Block
    description: >-
      In long QT syndrome, 2:1 atrioventricular block is usually functional:
      when ventricular refractoriness is extremely prolonged, alternate sinus
      impulses reach ventricular tissue that has not yet recovered and are
      blocked below the His bundle. The index SCN4B case was not studied
      electrophysiologically, so this edge applies the general LQTS mechanism.
    evidence:
    - reference: PMID:1918714
      reference_title: "Pseudo 2:1 atrioventricular block and T wave alternans in the long QT syndromes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        The extreme prolongation of ventricular action potential duration that
        occurs in some of the long QT syndromes may result in two forms of
        alternating activity of the heart: a "pseudo" 2:1 atrioventricular (AV)
        block and a T wave alternation, both of which are rate dependent.
      explanation: >-
        States the general LQTS mechanism linking extreme action potential
        prolongation to 2:1 block; not specific to SCN4B.
    - reference: PMID:1889452
      reference_title: "Prolonged QT, atrioventricular block, and sudden death in the newborn: an electrophysiologic evaluation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        its infrahisian location was associated with a prolongation of the
        refractoriness in the ventricular muscle itself.
      explanation: >-
        Electrophysiologic study of 2:1 block in a newborn with congenital LQTS
        locating the block below the His bundle and tying it to prolonged
        ventricular refractoriness; a different patient and genotype.

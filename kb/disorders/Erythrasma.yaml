  name: Scaling skin
  description: >-
    Fine scale is a characteristic surface change of erythrasma lesions in
    intertriginous skin.
  phenotype_term:
    preferred_term: Scaling skin
    term:
      id: HP:0040189
      label: Scaling skin
  evidence:
  - reference: PMID:40635638
    reference_title: "Erythrasma: a systematic review of interventions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cutaneous features include erythema, scaling and skin discoloration;
      notably, erythema may not manifest as classic redness in individuals with
      darker skin tones, instead appearing as subtle darkening, violaceous, or
      other colour changes.
    explanation: Names scaling as a cutaneous feature of erythrasma.
- category: Skin
  name: Hyperpigmentation of the skin
  description: >-
    Erythrasma patches may appear red-brown or hyperpigmented rather than
    classically erythematous, especially in skin folds.
  phenotype_term:
    preferred_term: Hyperpigmentation of the skin
    term:
      id: HP:0000953
      label: Hyperpigmentation of the skin
  evidence:
  - reference: PMID:33145138
    reference_title: "Erythrasma Revisited: Diagnosis, Differential Diagnoses, and Comprehensive Review of Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The clinical presentation of erythrasma is characterized by asymptomatic
      lesions often in skin folds and moist areas. Red or brown hyperpigmented
      patches of skin with scaling and central hypopigmentation are usually
      observed.
    explanation: >-
      Supports hyperpigmented scaling patches as a common cutaneous
      presentation of erythrasma.
diagnosis:
- name: Wood Lamp Examination
  description: >-
    Coral-pink fluorescence from corynebacterial porphyrins during Wood lamp
    examination supports rapid bedside diagnosis of erythrasma and helps
    distinguish it from candidiasis, dermatophytosis, pityriasis versicolor,
    and terra firma-forme dermatosis.
  evidence:
  - reference: PMID:33145138
    reference_title: "Erythrasma Revisited: Diagnosis, Differential Diagnoses, and Comprehensive Review of Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most common diagnostic test for erythrasma is an examination with a
      Wood lamp.
    explanation: >-
      Identifies Wood lamp examination as the common diagnostic test for
      erythrasma.
  - reference: PMID:12010076
    reference_title: Management of cutaneous erythrasma.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The differential diagnosis of erythrasma includes psoriasis,
      dermatophytosis, candidiasis and intertrigo, and methods for
      differentiating include Wood's light examination and bacterial and
      mycological cultures.
    explanation: >-
      Supports Wood lamp examination and bacterial or mycological culture as
      practical ways to separate erythrasma from its clinical mimics.
treatments:
- name: Topical Antimicrobial Therapy
  description: >-
    Topical agents, particularly fusidic acid where available, treat erythrasma
    by suppressing C. minutissimum in the superficial stratum corneum while
    limiting systemic adverse effects.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: fusidic acid
      term:
        id: CHEBI:29013
        label: fusidic acid
  target_mechanisms:
  - target: Superficial Stratum Corneum Infection
    treatment_effect: INHIBITS
    description: Topical antimicrobials suppress the superficial corynebacterial infection.
  evidence:
  - reference: PMID:21923567
    reference_title: "A comparison between the effectiveness of erythromycin, single-dose clarithromycin and topical fusidic acid in the treatment of erythrasma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      According to the mean of Wood's light reflection scores, the efficacy of
      fusidic acid cream therapy was significantly higher than other therapies.
    explanation: >-
      A randomized trial found the fusidic-acid arm had the greatest reduction
      in Wood lamp reflection scores.
  - reference: PMID:40635638
    reference_title: "Erythrasma: a systematic review of interventions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A comprehensive review of studies published between 1971 and 2024,
      including randomized controlled trials and comparative clinical studies,
      revealed that both clotrimazole and fusidic acid are effective topical
      options, with fusidic acid providing faster symptom relief, greater
      reduction in Wood's lamp fluorescence and fewer side-effects.
    explanation: >-
      Systematic-review evidence supports topical fusidic acid as an effective
      treatment for erythrasma.
- name: Systemic Macrolide Therapy
  description: >-
    Oral macrolides such as clarithromycin or erythromycin inhibit bacterial
    ribosomal protein synthesis and provide systemic antibiotic alternatives
    for erythrasma when topical therapy is impractical or insufficient.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: clarithromycin
      term:
        id: CHEBI:3732
        label: clarithromycin
    - preferred_term: erythromycin
      term:
        id: CHEBI:48923
        label: erythromycin
  target_mechanisms:
  - target: Superficial Stratum Corneum Infection
    treatment_effect: INHIBITS
    description: >-
      Macrolides suppress C. minutissimum protein synthesis and thereby treat
      the superficial infection.
  evidence:
  - reference: PMID:21923567
    reference_title: "A comparison between the effectiveness of erythromycin, single-dose clarithromycin and topical fusidic acid in the treatment of erythrasma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When the efficacy of clarithromycin and erythromycin therapy was compared,
      clarithromycin therapy was significantly more effective than erythromycin
      therapy at 48 h.
    explanation: >-
      Direct randomized comparison supports clarithromycin and erythromycin as
      systemic erythrasma regimens and showed faster early response with
      clarithromycin.
  - reference: PMID:12010076
    reference_title: Management of cutaneous erythrasma.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Erythromycin 250mg four times daily for 14 days is the treatment of choice
      and other antibacterials include tetracycline and chloramphenicol;
    explanation: >-
      Review guidance supports oral erythromycin as a systemic antibacterial
      regimen for erythrasma.

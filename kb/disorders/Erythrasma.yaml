      explanation: Classifies erythrasma as a bacterial infectious disease.
transmission:
- name: Endogenous Cutaneous Overgrowth in Occluded Skin
  description: >-
    Erythrasma is not maintained by a non-human host; resident
    C. minutissimum overgrows locally in warm, wet skin folds and toe webs.
  evidence:
  - reference: PMID:33145138
    reference_title: "Erythrasma Revisited: Diagnosis, Differential Diagnoses, and Comprehensive Review of Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Erythrasma is a bacterial infection of the skin caused by Corynebacterium
      minutissimum. C. minutissimum is a gram-positive bacterium most commonly
      found in warm, moist regions of the skin.
    explanation: >-
      Supports a local warm-moist skin-surface route for the agent that
      initiates erythrasma.
pathophysiology:
- name: Warm Moist Skin-Fold C. minutissimum Overgrowth
  description: >-
    Warm, moist, occluded stratum corneum in intertriginous skin folds and toe
    webs permits expansion of C. minutissimum on the cutaneous surface.
  locations:
  - preferred_term: stratum corneum of epidermis
    term:
      id: UBERON:0002027
      label: stratum corneum of epidermis
  cell_types:
  - preferred_term: corneocyte
    term:
      id: CL:0002153
      label: corneocyte
  evidence:
  - reference: PMID:33145138
    reference_title: "Erythrasma Revisited: Diagnosis, Differential Diagnoses, and Comprehensive Review of Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This pathogen infects the stratum corneum in warm and wet areas of the
      skin. Most commonly, the axillary, inguinal, and interdigital regions are
      affected.
    explanation: >-
      Places C. minutissimum infection in the stratum corneum of warm, wet skin
      sites.
  - reference: PMID:12010076
    reference_title: Management of cutaneous erythrasma.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is found mostly in occluded intertriginous areas such as the axillae,
      inframammary areas, interspaces of the toes, intergluteal and crural
      folds, and is more common in individuals with diabetes mellitus than other
      clinical patients.
    explanation: >-
      Specifies the occluded skin-fold and interdigital distribution of
      erythrasma and supports diabetes as a recognized host context.
  downstream:
  - target: Superficial Stratum Corneum Infection
    description: >-
      Surface overgrowth establishes a superficial corynebacterial infection
      within the horny layer.
- name: Superficial Stratum Corneum Infection
  description: >-
    C. minutissimum remains in superficial stratum corneum, producing a chronic
    bacterial infection that presents with discolored, scaling skin.
  locations:
  - preferred_term: stratum corneum of epidermis
    term:
      id: UBERON:0002027
      label: stratum corneum of epidermis
  cell_types:
  - preferred_term: corneocyte
    term:
      id: CL:0002153
      label: corneocyte
  evidence:
  - reference: PMID:40635638
    reference_title: "Erythrasma: a systematic review of interventions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Erythrasma is a chronic superficial bacterial infection caused by
      Corynebacterium minutissimum, predominantly affecting intertriginous areas.
    explanation: Supports erythrasma as a chronic, superficial C. minutissimum infection.
  downstream:
  - target: Corynebacterial Porphyrin Accumulation
    description: >-
      Surface corynebacteria synthesize porphyrins within the infected horny
      layer.
  - target: Brown-Red Scaling Patches
    description: >-
      The chronic superficial infection produces intertriginous discoloration
      and scale.
- name: Corynebacterial Porphyrin Accumulation
  description: >-
    C. minutissimum produces coproporphyrin III and other porphyrins in the
    superficial infected skin, generating coral-pink fluorescence during Wood
    lamp examination.
  biological_processes:
  - preferred_term: porphyrin-containing compound biosynthetic process
    term:
      id: GO:0006779
      label: porphyrin-containing compound biosynthetic process
  evidence:
  - reference: PMID:33145138
    reference_title: "Erythrasma Revisited: Diagnosis, Differential Diagnoses, and Comprehensive Review of Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of erythrasma can be confirmed through observing coral-pink
      fluorescence during Wood lamp examination of the affected skin.
      Porphyrins, predominantly coproporphyrin III, made by Corynebacteria are
      the origin of this distinguishing fluorescence.
    explanation: >-
      Connects Corynebacterium-derived porphyrins to the Wood lamp fluorescence
      used diagnostically in erythrasma.
  downstream:
  - target: Coral-Pink Wood Lamp Fluorescence
    description: >-
      Porphyrin fluorescence marks erythrasma-affected skin under Wood lamp
      illumination.
- name: Brown-Red Scaling Patches
  description: >-
    Erythrasma produces erythema, scaling, and skin discoloration in the
    infected folds; redness can appear as darker or violaceous color change in
    darker skin.
  evidence:
  - reference: PMID:40635638
    reference_title: "Erythrasma: a systematic review of interventions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cutaneous features include erythema, scaling and skin discoloration;
      notably, erythema may not manifest as classic redness in individuals with
      darker skin tones, instead appearing as subtle darkening, violaceous, or
      other colour changes.
    explanation: >-
      Establishes scaling and color change as the visible lesion pattern in
      erythrasma.
  downstream:
  - target: Scaling skin
    description: Fine scaling is part of the visible intertriginous lesion.
  - target: Hyperpigmentation of the skin
    description: >-
      Brown hyperpigmentation or other darker color change can accompany
      erythrasma patches.
- name: Coral-Pink Wood Lamp Fluorescence
  description: >-
    Coral-pink fluorescence under a Wood lamp helps distinguish erythrasma from
    clinically similar fungal or noninfectious intertriginous dermatoses.
  evidence:
  - reference: PMID:33145138
    reference_title: "Erythrasma Revisited: Diagnosis, Differential Diagnoses, and Comprehensive Review of Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Differential diagnoses of candidiasis, dermatophyte infection, erythrasma,
      pityriasis versicolor, and terra firma-forme dermatosis were considered.
      Wood lamp examination revealed bright coral-pink fluorescence. Correlation
      of the clinical examination and the Wood lamp finding established the
      diagnosis of erythrasma.
    explanation: >-
      Documents coral-pink Wood lamp fluorescence resolving the diagnosis among
      clinically similar groin dermatoses.
progression:
- phase: Chronic recurrent superficial infection
  notes: >-
    Erythrasma is chronic and superficial; lesions can recur until the moist,
    occluded local environment is corrected.
  evidence:
  - reference: PMID:40635638
    reference_title: "Erythrasma: a systematic review of interventions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Erythrasma is a chronic superficial bacterial infection caused by
      Corynebacterium minutissimum, predominantly affecting intertriginous areas.
    explanation: Establishes the chronic superficial course of erythrasma.

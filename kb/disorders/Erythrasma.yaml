name: Erythrasma
creation_date: "2026-09-29T19:59:05Z"
description: >-
  Erythrasma is a chronic superficial bacterial infection in which
  Corynebacterium minutissimum overgrows within warm, moist stratum corneum in
  toe webs and intertriginous skin folds, producing scaling brown-red patches
  with coral-pink Wood lamp fluorescence from corynebacterial porphyrins.
  C. minutissimum can be recovered from the same site as a concurrent
  Candida albicans or dermatophyte infection, and these fungal infections are
  also its main clinical mimics.
category: Infectious Disease
disease_term:
  preferred_term: erythrasma
  term:
    id: MONDO:0002885
    label: erythrasma
parents:
- Pyoderma
notes: >-
  The 1967 Montes ultrastructural study of erythrasma (PMID:6065118) has no
  abstract or full text in PubMed, so stratum-corneum localization is cited to
  later quotable reviews instead.
infectious_agent:
- name: Corynebacterium minutissimum
  infectious_agent_term:
    preferred_term: Corynebacterium minutissimum
    term:
      id: NCBITaxon:38301
      label: Corynebacterium minutissimum
  description: >-
    Corynebacterium minutissimum is the Gram-positive corynebacterial skin
    commensal whose overgrowth in stratum corneum causes erythrasma.
  evidence:
  - reference: PMID:33145138
    reference_title: "Erythrasma Revisited: Diagnosis, Differential Diagnoses, and Comprehensive Review of Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Erythrasma is a bacterial infection of the skin typically caused by
      Corynebacterium minutissimum.
    explanation: >-
      Identifies C. minutissimum as the typical bacterial cause of erythrasma.
  - reference: PMID:12010076
    reference_title: Management of cutaneous erythrasma.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Corynebacterium minutissimum is the bacteria that leads to cutaneous
      eruptions of erythrasma and is the most common cause of interdigital foot
      infections.
    explanation: >-
      Independently supports C. minutissimum as the agent that produces
      cutaneous erythrasma eruptions.

      hyperpigmented scaling plaques of both groin folds.
diagnosis:
- name: Wood Lamp Examination
  description: >-
    Coral-pink fluorescence from corynebacterial porphyrins during Wood lamp
    examination supports rapid bedside diagnosis of erythrasma and helps
    distinguish it from candidiasis, dermatophytosis, pityriasis versicolor,
    and terra firma-forme dermatosis.
  evidence:
  - reference: PMID:33145138
    reference_title: "Erythrasma Revisited: Diagnosis, Differential Diagnoses, and Comprehensive Review of Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most common diagnostic test for erythrasma is an examination with a
      Wood lamp.
    explanation: >-
      Identifies Wood lamp examination as the common diagnostic test for
      erythrasma.
  - reference: PMID:12010076
    reference_title: Management of cutaneous erythrasma.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The differential diagnosis of erythrasma includes psoriasis,
      dermatophytosis, candidiasis and intertrigo, and methods for
      differentiating include Wood's light examination and bacterial and
      mycological cultures.
    explanation: >-
      Supports Wood lamp examination and bacterial or mycological culture as
      practical ways to separate erythrasma from its clinical mimics.
- name: Skin Biopsy With Special Stains
  diagnosis_term:
    preferred_term: skin biopsy
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  description: >-
    Rarely performed. Hematoxylin and eosin sections can look like normal skin,
    so the pathologist needs to be told the suspected diagnosis; Gram and other
    special stains show gram-positive coccobacilli in the superficial stratum
    corneum.
  evidence:
  - reference: PMID:33145138
    reference_title: "Erythrasma Revisited: Diagnosis, Differential Diagnoses, and Comprehensive Review of Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Albeit rarely performed, a biopsy of the lesion can also establish a
      diagnosis of erythrasma.
    explanation: Supports skin biopsy as an uncommon diagnostic route.
  - reference: PMID:33145138
    reference_title: "Erythrasma Revisited: Diagnosis, Differential Diagnoses, and Comprehensive Review of Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Biopsy of a lesion of erythrasma and special staining will reveal
      gram-positive (purple) coccobacilli in the superficial stratum corneum
    explanation: >-
      Describes the special-stain histology that identifies the organism in
      the superficial stratum corneum.
treatments:
- name: Topical Antimicrobial Therapy
  description: >-
    Topical agents, including fusidic acid, clindamycin, mupirocin and the azole
    clotrimazole, treat erythrasma by suppressing C. minutissimum in the
    superficial stratum corneum while limiting systemic adverse effects.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: fusidic acid
      term:
        id: CHEBI:29013
        label: fusidic acid
    - preferred_term: clindamycin
      term:
        id: CHEBI:3745
        label: clindamycin
    - preferred_term: mupirocin
      term:
        id: CHEBI:7025
        label: mupirocin
    - preferred_term: clotrimazole
      term:
        id: CHEBI:3764
        label: clotrimazole
  target_mechanisms:
  - target: Superficial Stratum Corneum Infection
    treatment_effect: INHIBITS
    description: Topical antimicrobials suppress the superficial corynebacterial infection.
  evidence:
  - reference: PMID:21923567
    reference_title: "A comparison between the effectiveness of erythromycin, single-dose clarithromycin and topical fusidic acid in the treatment of erythrasma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      According to the mean of Wood's light reflection scores, the efficacy of
      fusidic acid cream therapy was significantly higher than other therapies.
    explanation: >-
      A randomized trial found the fusidic-acid arm had the greatest reduction
      in Wood lamp reflection scores.
  - reference: PMID:40635638
    reference_title: "Erythrasma: a systematic review of interventions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A comprehensive review of studies published between 1971 and 2024,
      including randomized controlled trials and comparative clinical studies,
      revealed that both clotrimazole and fusidic acid are effective topical
      options, with fusidic acid providing faster symptom relief, greater
      reduction in Wood's lamp fluorescence and fewer side-effects.
    explanation: >-
      Systematic-review evidence supports topical clotrimazole and fusidic acid
      as effective treatments for erythrasma.
  - reference: PMID:33145138
    reference_title: "Erythrasma Revisited: Diagnosis, Differential Diagnoses, and Comprehensive Review of Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Topical treatment options for erythrasma include clindamycin, fusidic
      acid, mupirocin
    explanation: Review lists topical clindamycin and mupirocin among erythrasma treatments.
  - reference: PMID:33145138
    reference_title: "Erythrasma Revisited: Diagnosis, Differential Diagnoses, and Comprehensive Review of Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clindamycin is a bacteriostatic antibiotic that reversibly binds the 50S
      ribosomal subunit, disrupting protein synthesis. The topical application
      of this agent three times per day for one week can lead to complete
      eradication of erythrasma with no recurrence.
    explanation: Supports topical clindamycin as an effective erythrasma treatment.
  - reference: PMID:33145138
    reference_title: "Erythrasma Revisited: Diagnosis, Differential Diagnoses, and Comprehensive Review of Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The patient's skin infection was successfully treated with twice daily
      topical application of 2% mupirocin ointment for six weeks.
    explanation: >-
      The authors' own patient was cured with topical mupirocin ointment.
- name: Systemic Macrolide Therapy
  description: >-
    Oral macrolides such as clarithromycin or erythromycin inhibit bacterial
    ribosomal protein synthesis and provide systemic antibiotic alternatives
    for erythrasma when topical therapy is impractical or insufficient.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: clarithromycin
      term:
        id: CHEBI:3732
        label: clarithromycin
    - preferred_term: erythromycin
      term:
        id: CHEBI:48923
        label: erythromycin
  target_mechanisms:
  - target: Superficial Stratum Corneum Infection
    treatment_effect: INHIBITS
    description: >-
      Macrolides suppress C. minutissimum protein synthesis and thereby treat
      the superficial infection.
  evidence:
  - reference: PMID:21923567
    reference_title: "A comparison between the effectiveness of erythromycin, single-dose clarithromycin and topical fusidic acid in the treatment of erythrasma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When the efficacy of clarithromycin and erythromycin therapy was compared,
      clarithromycin therapy was significantly more effective than erythromycin
      therapy at 48 h.
    explanation: >-
      Direct randomized comparison supports clarithromycin and erythromycin as
      systemic erythrasma regimens and showed faster early response with
      clarithromycin.
  - reference: PMID:12010076
    reference_title: Management of cutaneous erythrasma.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Erythromycin 250mg four times daily for 14 days is the treatment of choice
      and other antibacterials include tetracycline and chloramphenicol;
    explanation: >-
      Review guidance supports oral erythromycin as a systemic antibacterial
      regimen for erythrasma.
- name: Oral Tetracycline Therapy
  description: >-
    Oral tetracycline, a bacteriostatic inhibitor of the 30S ribosomal subunit,
    is an older systemic alternative to the macrolides; it is avoided in
    pregnancy and in children because of tooth discoloration.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: tetracycline
      term:
        id: CHEBI:27902
        label: tetracycline
  target_mechanisms:
  - target: Superficial Stratum Corneum Infection
    treatment_effect: INHIBITS
    description: >-
      Tetracycline suppresses C. minutissimum protein synthesis and thereby
      treats the superficial infection.

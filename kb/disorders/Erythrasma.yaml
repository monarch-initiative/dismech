  - reference: PMID:33145138
    reference_title: "Erythrasma Revisited: Diagnosis, Differential Diagnoses, and Comprehensive Review of Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tetracycline is a bacteriostatic agent that reversibly binds the 30S
      bacterial ribosomal subunit. It is usually well-tolerated but is
      associated with photosensitivity during therapy. In addition, it cannot be
      used in pregnant women and children because of tooth discoloration.
    explanation: >-
      Supports the mechanism and the pregnancy and pediatric restriction stated
      in the description.

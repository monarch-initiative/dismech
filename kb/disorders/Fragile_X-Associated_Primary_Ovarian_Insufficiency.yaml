      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The potential implications include adverse effects on quality of life, on fertility and on bone, cardiovascular and cognitive health."
      explanation: >-
        Enumerates the downstream morbidity this edge asserts follows loss of ovarian
        hormone output. PARTIAL because the guideline addresses POI as a class.
- name: Chronic estrogen deficiency
  description: >-
    Premature and prolonged estrogen deficiency is the source of the non-reproductive
    morbidity of FXPOI: vasomotor symptoms, accelerated bone loss with reduced bone
    mineral density, adverse cardiovascular risk, and effects on quality of life. This is
    the rationale for hormone therapy continued to the age of typical natural menopause,
    and it is shared with primary ovarian insufficiency of any cause rather than being
    specific to the FMR1 premutation.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  evidence:

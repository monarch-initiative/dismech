name: Fragile X-Associated Primary Ovarian Insufficiency
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
parents:
- Trinucleotide Repeat Disorder
- Primary Ovarian Insufficiency
description: >-
  Fragile X-associated primary ovarian insufficiency (FXPOI; OMIM premature ovarian
  failure 1, POF1) is the ovarian disorder of FMR1 premutation carriers (55-200 CGG
  repeats in the FMR1 5' UTR). It is one of the three recognized FMR1 disorders,
  alongside full-mutation fragile X syndrome (FXS) and the premutation neurodegenerative
  disorder FXTAS. FXPOI is defined as hypergonadotropic hypogonadism before age 40 and
  is observed in about 20% of female premutation carriers, compared with about 1% of
  the general population; a larger fraction show subclinical ("occult") ovarian
  insufficiency with declining ovarian reserve before FSH crosses the diagnostic
  threshold. Like FXTAS, and unlike FXS, FXPOI is a premutation phenotype: the expanded
  allele largely escapes methylation-mediated silencing and is transcribed at elevated
  levels, so pathogenesis is attributed to a toxic gain-of-function of the expanded
  CGG-repeat FMR1 mRNA, with a proposed parallel contribution from repeat-associated
  non-AUG (RAN) translation of the polyglycine protein FMRpolyG, rather than to loss of
  FMRP. Ovarian consequences are granulosa cell dysfunction and accelerated depletion of
  the follicle pool, giving menstrual irregularity, subfertility, early menopause, and
  the long-term sequelae of premature estrogen deficiency (bone loss, cardiovascular
  risk, vasomotor symptoms, psychosocial burden). Because intermittent ovulatory
  function can persist after diagnosis, FXPOI is described as an insufficiency rather
  than an absolute failure.
synonyms:
- FXPOI
- premature ovarian failure 1
- POF1
- FMR1-related primary ovarian insufficiency
- fragile X-associated premature ovarian failure

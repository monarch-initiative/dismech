- name: Estrogen-deficiency bone remodeling imbalance
  description: >-
    Premature loss of ovarian estrogen uncouples osteoclastic resorption from osteoblastic
    formation, which is the initiating lesion of the conserved osteoporosis mechanism. The
    downstream chain (RANKL-driven osteoclastogenesis, increased resorption, net bone loss)
    is not duplicated here; this node declares conformance to the shared module instead.
    The driver is hormonal, which is precisely the case the module's trigger node is
    written to accommodate.
  biological_scale: TISSUE

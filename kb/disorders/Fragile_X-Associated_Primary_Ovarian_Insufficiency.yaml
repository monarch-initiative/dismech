- name: Serum follicle stimulating hormone
  notes: >-
    FSH rises into the menopausal range as follicular inhibin and estradiol feedback is
    lost. A single value above 25 IU/L in a woman under 40 with amenorrhea meets current
    international diagnostic criteria for POI.
  biomarker_term:
    preferred_term: Elevated circulating follicle stimulating hormone level
    term:

genetic:
- name: FMR1
  gene_term:
    preferred_term: FMR1
    term:
      id: hgnc:3775
      label: FMR1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    A premutation-range CGG repeat expansion (55-200 repeats) in the FMR1 5' UTR at Xq27.3
    is the cause of FXPOI. The premutation, not the full mutation, confers the ovarian
    risk: full-mutation (>200 repeat) alleles are hypermethylated and silenced and cause
    fragile X syndrome rather than FXPOI.
  evidence:
  - reference: PMID:20301558
    reference_title: "FMR1 Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the diagnosis of FXTAS or FXPOI is associated with a premutation-sized repeat (55-200 CGG repeats)"
    explanation: Establishes FMR1 premutation status as the genetic basis of FXPOI.
  - reference: PMID:20301558
    reference_title: "FMR1 Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FMR1 disorders include fragile X syndrome (FXS), fragile X-associated tremor/ataxia syndrome (FXTAS), and fragile X-associated primary ovarian insufficiency (FXPOI)."
    explanation: Places FXPOI within the FMR1 disorder spectrum attributable to this gene.
variants:
- name: FMR1 premutation CGG repeat expansion (55-200 repeats)
  description: >-
    An unstable CGG trinucleotide repeat expansion of 55-200 units in the FMR1 5'
    untranslated region. This range is normally spared the CpG-island hypermethylation
    that silences full-mutation (>200 repeat) alleles, so the premutation allele is
    transcribed - the basis for its gain-of-function pathogenicity in FXPOI and FXTAS. The
    allele is unstable on maternal transmission and can expand to a full mutation in
    offspring, which is the separate fragile X syndrome risk that dominates reproductive
    counseling for carriers. Two features reported to modify the allele's effect are not
    curated as evidence-backed claims here because their primary sources could not be
    fetched in this session: AGG interruptions within the CGG tract, which stabilize the
    repeat against intergenerational expansion but have not been shown to modify FXPOI
    risk in the carrier herself; and X-chromosome inactivation skewing, where preferential
    inactivation of the premutation-bearing allele is reported to be protective.
  gene:
    preferred_term: FMR1
    term:
      id: hgnc:3775
      label: FMR1
  type: trinucleotide_repeat_expansion
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:17618523
    reference_title: "Fragile X-associated tremor/ataxia syndrome: clinical features, genetics, and testing guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "moderate expansions (55-200 repeats; premutation range) of a CGG trinucleotide in the fragile X mental retardation 1 (FMR1) gene"
    explanation: Defines the premutation allele class and repeat range.
  - reference: PMID:28420439
    reference_title: "Fragile X syndrome: a review of clinical and molecular diagnoses."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "more than 99% of individuals have a CGG expansion (>200 triplets) in the 5' UTR of the gene"
    explanation: >-
      Locates the repeat in the FMR1 5' UTR and gives the full-mutation threshold that
      bounds the premutation range above. PARTIAL because the statement describes the
      full-mutation allele of fragile X syndrome rather than the premutation itself.
environmental:
- name: Tobacco use
  description: >-
    Tobacco use is an avoidable exposure in FMR1 premutation carriers because it lowers
    ovarian reserve and brings forward the age of onset of FXPOI. It is not a cause of
    FXPOI; it modifies the timing of a genetically determined process.
  presence: Modifier of onset timing
  effect: Deleterious - lowers ovarian reserve and advances age of onset
  evidence:
  - reference: PMID:20301558
    reference_title: "FMR1 Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FXPOI: tobacco use as this decreases ovarian reserve and the age of onset of FXPOI."
    explanation: >-
      GeneReviews lists tobacco under agents/circumstances to avoid for FXPOI, with the
      stated mechanism of reduced ovarian reserve and earlier onset.
diagnosis:
- name: FMR1 CGG repeat sizing
  description: >-
    Targeted molecular testing for the FMR1 CGG repeat (PCR-based repeat sizing with
    Southern blot as needed) is the definitive test. Standard multigene panels and
    exome or genome sequencing do not reliably detect the repeat expansion, so FMR1
    testing must be ordered specifically. FMR1 testing is a standard component of the POI
    diagnostic workup.
  evidence:
  - reference: PMID:20301558
    reference_title: "FMR1 Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of an FMR1 disorder is established through the use of specialized molecular genetic testing to detect CGG trinucleotide repeat expansion in the 5' UTR of FMR1"
    explanation: Identifies the specialized repeat-sizing assay as the diagnostic test.
  - reference: PMID:20301558
    reference_title: "FMR1 Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "typical multigene panels and comprehensive genomic testing (exome or genome sequencing) are useful only when no CGG repeat expansion is detected"
    explanation: >-
      Supports the caution that routine sequencing does not substitute for dedicated
      repeat sizing.
- name: Ovarian reserve assessment
  description: >-
    Serum AMH and antral follicle count on pelvic ultrasound, together with serum FSH and
    estradiol, index ovarian reserve and can detect the occult phase before amenorrhea.
    Serial rather than single measurements are informative because ovarian activity in
    FXPOI can fluctuate.
  evidence:
  - reference: PMID:39647506
    reference_title: "Evidence-based guideline: premature ovarian insufficiency(†)(‡)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "guidance that AMH testing, repeat FSH measurement and/or AMH may be required where there is diagnostic uncertainty"
    explanation: >-
      Supports serial FSH and AMH testing in the diagnostic workup. PARTIAL because the
      guideline covers POI generally and does not separately address antral follicle count.
- name: Karyotype and autoimmune workup
  description: >-
    Karyotype and adrenal/ovarian autoantibody testing are performed alongside FMR1 repeat
    sizing to exclude Turner syndrome, other X-chromosome abnormalities, and autoimmune
    oophoritis in a woman presenting with POI. These are exclusionary rather than
    confirmatory for FXPOI.
prevalence:
- population: Female FMR1 premutation carriers
  measure_type: LIFETIME_PREVALENCE
  prevalence_class: COMMON
  rate_per_100000: 20000.0
  notes: >-
    Approximately 20% of female FMR1 premutation carriers develop FXPOI, versus about 1%
    background POI prevalence. This is a within-carrier penetrance figure, not a
    population prevalence, and it derives largely from cohorts ascertained through fragile
    X families, which may overstate absolute risk among carriers identified by unselected
    population screening.
  evidence:
  - reference: PMID:20301558
    reference_title: "FMR1 Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FXPOI, defined as hypergonadotropic hypogonadism before age 40 years, has been observed in 20% of women who carry a premutation allele compared to 1% in the general population"
    explanation: Source of both the carrier-level figure and the general-population comparator.
differential_diagnoses:
- name: Primary ovarian insufficiency of other cause
  description: >-
    POI from any other cause presents with the same hypergonadotropic endocrine picture.
    Turner syndrome and other X-chromosome abnormalities, autoimmune oophoritis,
    iatrogenic causes (gonadotoxic chemotherapy, pelvic radiation, oophorectomy), and
    other monogenic POI genes are the main alternatives, which is why karyotype,
    autoantibody testing, and FMR1 repeat sizing are run together in the POI workup.
  distinguishing_features:
  - Absence of an FMR1 premutation on dedicated CGG repeat sizing.
  - Turner syndrome and other X-chromosome abnormalities are identified by karyotype.
  evidence:
  - reference: PMID:33495935
    reference_title: Fertility preservation for genetic diseases leading to premature ovarian insufficiency (POI).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About 10% of cases of POI is related to genetic diseases. The most frequent conditions associated with POI are Turner syndrome and fragile X pre-mutation"
    explanation: >-
      Identifies Turner syndrome as the principal competing genetic diagnosis alongside the
      fragile X premutation.
- name: Fragile X syndrome
  disease_term:
    preferred_term: fragile X syndrome
    term:
      id: MONDO:0010383
      label: fragile X syndrome
  description: >-
    The full-mutation FMR1 disorder. It is caused by the same locus but by a different
    allele class and a mechanistically opposite lesion - hypermethylation and silencing
    with loss of FMRP, rather than transcription of a toxic expanded-repeat mRNA - and it
    does not carry the FXPOI ovarian phenotype.
  distinguishing_features:
  - Repeat size greater than 200 CGG with abnormal methylation rather than 55-200 unmethylated repeats.
  - Neurodevelopmental presentation with intellectual disability rather than an ovarian phenotype.
  evidence:
  - reference: PMID:20301558
    reference_title: "FMR1 Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "a definite diagnosis of FXS requires the presence of a full-mutation repeat size (>200 CGG repeats) while the diagnosis of FXTAS or FXPOI is associated with a premutation-sized repeat (55-200 CGG repeats)"
    explanation: States the allele-class distinction between fragile X syndrome and FXPOI.
- name: Fragile X-associated tremor/ataxia syndrome
  disease_term:
    preferred_term: fragile X-associated tremor/ataxia syndrome
    term:
      id: MONDO:0010382
      label: fragile X-associated tremor/ataxia syndrome
  description: >-
    The other premutation disorder. It shares the FMR1 premutation genotype and the RNA
    gain-of-function paradigm with FXPOI but affects the nervous system, presents in the
    seventh decade, and occurs in male as well as female carriers. FXTAS is a co-occurring
    risk in the same women rather than a competing explanation for their amenorrhea.
  distinguishing_features:
  - Late-onset progressive cerebellar ataxia and intention tremor rather than an ovarian phenotype.
  - Affects hemizygous male carriers, in whom FXPOI cannot occur.
  evidence:
  - reference: PMID:20301558
    reference_title: "FMR1 Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FXTAS occurs in individuals who have an FMR1 premutation and is characterized by late-onset, progressive cerebellar ataxia and intention tremor followed by cognitive impairment."
    explanation: >-
      Distinguishes the neurological premutation phenotype from the ovarian one on onset
      age, organ system, and affected sex.
treatments:
- name: Estrogen replacement therapy
  description: >-
    Systemic estrogen, with a progestogen in women with an intact uterus, is the mainstay
    of FXPOI management. It relieves vasomotor symptoms and mitigates the bone and
    cardiovascular consequences of premature estrogen deficiency, and is generally
    continued to the age of typical natural menopause. It does not restore ovarian
    function or fertility. Where FXPOI presents before puberty is complete, the same agent
    is used for pubertal induction before being continued as replacement.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: sex hormone modifying agent therapy
    term:
      id: MAXO:0000282
      label: sex hormone modifying agent therapy
    therapeutic_agent:
    - preferred_term: 17beta-estradiol
      term:
        id: CHEBI:16469
        label: 17beta-estradiol
    - preferred_term: progesterone
      term:
        id: CHEBI:17026
        label: progesterone
  target_phenotypes:
  - preferred_term: Hot flashes
    term:
      id: HP:0031217
      label: Hot flashes
  - preferred_term: Reduced bone mineral density
    term:
      id: HP:0004349
      label: Reduced bone mineral density
  target_mechanisms:
  - target: Chronic estrogen deficiency
    treatment_effect: BYPASSES
    description: >-
      Exogenous estrogen replaces the missing ovarian hormone output. It acts downstream of
      the follicle loss and does not correct the repeat-expansion lesion or restore the
      follicle pool.
  evidence:
  - reference: PMID:20301558
    reference_title: "FMR1 Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FXPOI: Gynecologic or reproductive endocrinologic evaluation can provide appropriate treatment and counseling for reproductive considerations and hormone replacement."
    explanation: GeneReviews names hormone replacement as the FXPOI management approach.
  - reference: PMID:39647506
    reference_title: "Evidence-based guideline: premature ovarian insufficiency(†)(‡)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Although hormone therapy (HT) can mitigate some of these effects, many questions still remain regarding the optimal management of POI."
    explanation: >-
      Supports the mitigating effect of hormone therapy on POI sequelae while recording the
      residual uncertainty. PARTIAL because the guideline addresses POI as a class.
  - reference: PMID:38677871
    reference_title: Primary Amenorrhea and Premature Ovarian Insufficiency.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Pubertal induction and ongoing estrogen replacement therapy are often necessary."
    explanation: >-
      Supports both pubertal induction and continued estrogen replacement in
      hypergonadotropic POI. PARTIAL because it is written for POI generally.
- name: Fertility preservation counseling and oocyte or embryo cryopreservation
  description: >-
    Because the timing of follicle depletion is unpredictable and the window closes
    permanently, women identified as premutation carriers should be counseled about
    fertility preservation early, while ovarian reserve remains. Oocyte or embryo
    cryopreservation is the established option once menarche has occurred. Efficacy in
    premutation carriers may be reduced by the ovarian changes that define the disorder,
    and ovarian tissue cryopreservation remains experimental in this population.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Fertility Preservation
    term:
      id: NCIT:C71326
      label: Fertility Preservation
  evidence:
  - reference: PMID:33495935
    reference_title: Fertility preservation for genetic diseases leading to premature ovarian insufficiency (POI).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In case of spontaneous menarche (this can occur variably depending on the mutation) established techniques like embryo or oocyte cryopreservation can be proposed, even if, in some cases, their effectiveness may be reduced by ovarian alterations connected to the mutation."
    explanation: >-
      Supports oocyte and embryo cryopreservation as the established options in genetic POI
      and records the caveat on reduced effectiveness.
  - reference: PMID:33495935
    reference_title: Fertility preservation for genetic diseases leading to premature ovarian insufficiency (POI).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If a diagnosis is issued before POI onset, counseling on currently available fertility preservation techniques is advisable."
    explanation: Supports counseling before onset as the intervention window.
- name: Donor oocyte in vitro fertilization
  description: >-
    For carriers who have already progressed to overt ovarian failure and wish to carry a
    pregnancy, donor oocyte IVF is the standard route, since it does not depend on the
    woman's own depleted follicle pool. It bypasses both the ovarian phenotype and the
    risk of transmitting an expanding FMR1 allele. No FXPOI-specific outcome evidence is
    cited here; this entry records standard practice.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: In Vitro Fertilization
    term:
      id: NCIT:C16580
      label: In Vitro Fertilization
- name: Bone health surveillance and protection
  description: >-
    Because premature estrogen deficiency accelerates bone loss, management includes bone
    mineral density monitoring alongside calcium and vitamin D sufficiency, with
    bone-protective pharmacotherapy reserved for established osteoporosis. Hormone therapy
    is the primary bone-protective measure; this entry covers the surveillance and
    adjunctive limb.
  action_category: MONITORING
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
  evidence:
  - reference: PMID:39647506
    reference_title: "Evidence-based guideline: premature ovarian insufficiency(†)(‡)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The potential implications include adverse effects on quality of life, on fertility and on bone, cardiovascular and cognitive health."
    explanation: >-
      Establishes bone health as a management domain in POI. PARTIAL because the guideline
      addresses POI as a class and this snippet does not specify a surveillance schedule.
- name: Tobacco avoidance
  description: >-
    Avoiding tobacco is specifically recommended in FMR1 premutation carriers because
    smoking further lowers ovarian reserve and brings forward the onset of FXPOI. It is
    the one modifiable exposure GeneReviews lists for FXPOI.
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
  evidence:
  - reference: PMID:20301558
    reference_title: "FMR1 Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FXPOI: tobacco use as this decreases ovarian reserve and the age of onset of FXPOI."
    explanation: >-
      GeneReviews lists tobacco under agents/circumstances to avoid for FXPOI, making
      avoidance the corresponding management action.
- name: Genetic counseling and reproductive genetic testing
  description: >-
    Counseling covers two distinct risks that must not be conflated: the woman's own risk
    of FXPOI and FXTAS, and the risk of transmitting an allele that expands to a full
    mutation and causes fragile X syndrome in offspring. Cascade testing of at-risk female
    relatives is standard, and prenatal or preimplantation genetic testing is available
    once the family allele is known.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: MAXO:0000079
      label: genetic counseling
  evidence:
  - reference: PMID:20301558
    reference_title: "FMR1 Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mothers and their female relatives who are heterozygous for a premutation are at increased risk for FXTAS, FXPOI, and fragile X-associated neuropsychiatric disorders (FXAND)"
    explanation: Supports cascade testing of at-risk female relatives and the carrier's own risk counseling.
  - reference: PMID:20301558
    reference_title: "FMR1 Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Prenatal testing for a pregnancy at increased risk and preimplantation genetic testing are possible once an expanded (or altered) FMR1 allele has been identified in a family member."
    explanation: Supports the reproductive genetic testing options offered to carriers.
discussions:
- discussion_id: fxpoi_ovarian_mechanism_evidence_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the RNA gain-of-function/RAN-translation mechanism established in FXTAS neurons
    actually operate in human granulosa cells, and by what intermediate steps does
    sequestration of CGG-repeat-binding proteins cause follicle loss?
  attaches_to:
  - pathophysiology#RNA gain-of-function and sequestration of CGG-repeat-binding proteins
  - pathophysiology#RAN translation and FMRpolyG production
  - pathophysiology#Granulosa cell dysfunction and death
  - pathophysiology#Accelerated ovarian follicle depletion
  rationale: >-
    The mechanistic chain curated here for the ovary is largely transposed from FXTAS,
    where the RNA-foci and RAN-translation evidence was generated in neurons, Drosophila
    models, and transfected cells. The intermediate steps between a sequestered RNA-binding
    protein and the loss of an ovarian follicle are not established in human tissue, which
    is why the two intervening nodes carry mechanism_confidence PROVISIONAL and their
    evidence items are marked PARTIAL.
  proposed_experiments:
  - experiment_id: exp_fxpoi_granulosa_foci_fmrpolyg
    name: Repeat-RNA foci and FMRpolyG in premutation-carrier granulosa cells
    description: >-
      Assay granulosa cells recovered from FMR1 premutation carriers undergoing assisted
      reproduction for CGG-repeat RNA foci and FMRpolyG, and relate their burden to
      contemporaneous ovarian reserve markers (AMH, antral follicle count) and repeat
      length.
    would_support:
    - Detection of foci and FMRpolyG in human granulosa cells, scaling with repeat length and inversely with ovarian reserve, would move the ovarian nodes from PROVISIONAL toward ESTABLISHED.
    would_refute:
    - Absence of foci and FMRpolyG in granulosa cells of affected carriers would argue that the ovarian lesion is not a direct transposition of the neuronal mechanism.
  - experiment_id: exp_fxpoi_ran_translation_dissection
    name: Separating RNA toxicity from RAN translation in granulosa cells
    description: >-
      In cultured human granulosa cells expressing premutation-length CGG repeats, block
      RAN translation without altering repeat-RNA abundance, and separately reduce
      repeat-RNA abundance while preserving FMRpolyG output, then measure cell viability.
    would_support:
    - Rescue on repeat-RNA reduction alone would establish RNA gain-of-function as the dominant ovarian arm.
    would_refute:
    - Rescue only when FMRpolyG is blocked would reassign the ovarian mechanism to the RAN-translation arm.
- discussion_id: fxpoi_nonlinear_repeat_size_risk
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Why is FXPOI risk non-linear in repeat length, rising through the mid-premutation range
    and then falling at the largest premutation sizes?
  attaches_to:
  - pathophysiology#FMR1 premutation CGG expansion and elevated FMR1 mRNA
  rationale: >-
    A purely dose-dependent RNA-toxicity model predicts that risk should rise monotonically
    with repeat length. The reported decline in risk at the largest premutation sizes is
    therefore a genuine constraint on the mechanism rather than a detail, and it is not
    captured by the causal chain as curated. It is recorded here rather than asserted in
    the pathophysiology nodes because the primary cohort studies quantifying the effect
    could not be fetched and snippet-verified in this curation session.
  proposed_experiments:
  - experiment_id: exp_fxpoi_repeat_length_stratified_molecular_profile
    name: Repeat-length-stratified FMR1 mRNA, FMRP, and FMRpolyG versus ovarian reserve
    description: >-
      In a carrier cohort stratified across the premutation range, measure FMR1 mRNA level,
      FMRP level, and FMRpolyG burden in the same individuals and relate each to ovarian
      reserve, testing whether declining FMRP or translational output at the largest repeat
      sizes offsets rising repeat-RNA burden.
    would_support:
    - An inverted-U in a composite toxicity measure that tracks the clinical risk curve would explain the non-linearity within the current model.
    would_refute:
    - A monotonic molecular gradient across repeat lengths would indicate that the non-linear clinical risk arises outside the RNA-toxicity axis.
notes: >-
  Scope: this entry covers the ovarian phenotype of the FMR1 premutation. The neurological
  premutation phenotype is curated separately as Fragile X-Associated Tremor Ataxia
  Syndrome, and the full-mutation disorder as Fragile X Syndrome; the fragile
  X-associated neuropsychiatric disorders (FXAND) are not yet curated. MONDO:0010706 is
  labeled "premature ovarian failure 1" after OMIM 311360; the entry name follows current
  clinical usage (primary ovarian insufficiency), and the OMIM/MONDO label is retained as
  a synonym.

  Evidence limitation: this session ran in an environment where outbound access to NCBI
  E-utilities and other literature hosts was blocked by network policy, so no new
  references could be fetched into references_cache. Every evidence item above is
  therefore drawn from references already cached in the repository and was
  snippet-verified locally. The consequence is that the FXPOI-specific primary literature
  identified by deep research - in particular the granulosa cell RNA-toxicity work, the
  CGG knock-in mouse follicle-depletion studies, and the cohort studies establishing the
  non-linear repeat-size risk curve - is described in the discussions and notes but is
  not cited, because its snippets could not be verified. Adding those citations is the
  highest priority follow-up for this entry. Specifically deferred for that reason, with
  the source named so the follow-up is actionable: the granulosa-cell experiments showing
  CGG-repeat RNA aggregates killing human granulosa cells independently of FMRpolyG; the
  Fmr1 mouse work implicating premature mTOR-driven recruitment of primordial follicles
  (and its rapamycin rescue, a model-organism result that must not be presented as a human
  treatment option); the CGG knock-in mouse lines showing a normally established follicle
  pool with accelerated subsequent loss; the cohort studies quantifying the non-linear
  repeat-length risk curve; premutation carrier-frequency estimates; and the AGG-interruption
  and X-inactivation-skewing modifier literature. Depression and anxiety are described in
  the FXPOI literature as a principal morbidity domain alongside bone and cardiovascular
  health, but are not curated as phenotypes here for the same lack of a verifiable snippet.

  Ontology limitation from the same cause: UBERON:0001305 (ovarian follicle) and
  GO:0003729 (mRNA binding) both exist and are the more precise terms for the
  follicle-depletion location and the RNA-toxicity molecular function, but neither is
  present in the committed dynamic-enum caches and the term validator could not expand
  them offline. UBERON:0000992 (ovary) is used instead, and the molecular-function
  annotation is omitted.

    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "the repeat also elicits production of a toxic polyglycine protein, FMRpolyG, via repeat-associated non-AUG (RAN)-initiated translation"
    explanation: >-
      Establishes RAN translation of FMRpolyG from the expanded CGG repeat. PARTIAL because
      the models are Drosophila and transfected mammalian cells studied for FXTAS.
  downstream:
  - target: Granulosa cell dysfunction and death
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      FMRpolyG may contribute to granulosa cell injury, but it is demonstrably not required
      for it: granulosa cell death occurs independently of FMRpolyG expression. This edge
      is therefore retained as a possible additive contribution, not a necessary step.
    evidence:
    - reference: PMID:36250920

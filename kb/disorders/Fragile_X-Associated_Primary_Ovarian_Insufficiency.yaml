    explanation: GeneReviews anchors FXPOI to the premutation repeat range rather than the full mutation.
  - reference: PMID:17618523
    reference_title: "Fragile X-associated tremor/ataxia syndrome: clinical features, genetics, and testing guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "moderate expansions (55-200 repeats; premutation range) of a CGG trinucleotide in the fragile X mental retardation 1 (FMR1) gene, the same gene which causes fragile X syndrome when in the full mutation range (200 or greater CGG repeats)"
    explanation: >-
      Defines the premutation repeat range and its contrast with the full mutation at the
      same locus, the genetic basis of this node.
  downstream:
  - target: RNA gain-of-function and sequestration of CGG-repeat-binding proteins
    causal_link_type: DIRECT
    description: >-
      The elevated expanded-repeat transcript forms the nuclear RNA species that binds and
      sequesters CGG-repeat-binding proteins.
    evidence:
    - reference: PMID:17618523
      reference_title: "Fragile X-associated tremor/ataxia syndrome: clinical features, genetics, and testing guidelines."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The pathogenic mechanism is related to overexpression and toxicity of the FMR1 mRNA per se."
      explanation: >-
        Links elevated expanded-repeat FMR1 mRNA to toxicity, the step this edge asserts.
        PARTIAL because the statement is made for the neurological premutation phenotype.
  - target: RAN translation and FMRpolyG production
    causal_link_type: DIRECT
    description: >-
      The same expanded CGG tract in the transcript is the substrate for
      repeat-associated non-AUG translation.
- name: RNA gain-of-function and sequestration of CGG-repeat-binding proteins
  description: >-
    The expanded CGG-repeat FMR1 mRNA forms nuclear RNA aggregates that bind and sequester
    CGG-repeat-binding proteins - identified in FXTAS models as Pur alpha and hnRNP A2/B1 -
    depleting them from their normal functions. This is the leading arm of premutation
    toxicity. The direct ovarian evidence is thinner than the neuronal evidence from FXTAS
    models; its application to granulosa cells is an extension of the shared premutation
    mechanism rather than a directly demonstrated ovarian finding.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:17698009
    reference_title: Pur alpha binds to rCGG repeats and modulates repeat-mediated neurodegeneration in a Drosophila model of fragile X tremor/ataxia syndrome.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "transcribed premutation repeats alone are sufficient to cause neurodegeneration, suggesting that rCGG-repeat-binding proteins (RBPs) may be sequestered from their normal function by rCGG binding"
    explanation: >-
      Provides the mechanistic basis for RNA-mediated protein sequestration by premutation
      transcripts. PARTIAL because the model is Drosophila neurons, not ovarian tissue.
  - reference: PMID:25954027
    reference_title: RAN translation at CGG repeats induces ubiquitin proteasome system impairment in models of fragile X-associated tremor ataxia syndrome.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "FXTAS is thought to arise primarily from an RNA gain-of-function toxicity mechanism."
    explanation: >-
      States the primacy of the RNA gain-of-function route among premutation mechanisms.
      PARTIAL because the claim is framed for FXTAS.
  downstream:
  - target: Granulosa cell dysfunction and death
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sequestration of RNA-binding proteins is proposed to impair the somatic support cells
      of the follicle, but the intermediate steps are not established in the human ovary.
- name: RAN translation and FMRpolyG production
  description: >-
    Repeat-associated non-AUG (RAN) translation initiates within the expanded CGG tract and
    produces an aggregation-prone polyglycine protein, FMRpolyG. This is the parallel,
    non-exclusive protein-toxicity arm of the premutation mechanism. As with the RNA arm,
    the supporting experiments come from FXTAS models rather than ovarian tissue, so its
    contribution to FXPOI specifically is unresolved.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: regulation of translation
    term:
      id: GO:0006417
      label: regulation of translation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:25954027
    reference_title: RAN translation at CGG repeats induces ubiquitin proteasome system impairment in models of fragile X-associated tremor ataxia syndrome.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "the repeat also elicits production of a toxic polyglycine protein, FMRpolyG, via repeat-associated non-AUG (RAN)-initiated translation"
    explanation: >-
      Establishes RAN translation of FMRpolyG from the expanded CGG repeat. PARTIAL because
      the models are Drosophila and transfected mammalian cells studied for FXTAS.
  downstream:
  - target: Granulosa cell dysfunction and death
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      FMRpolyG is proposed to contribute to granulosa cell injury, but whether it is
      required for the ovarian phenotype is unresolved.
- name: Granulosa cell dysfunction and death
  description: >-
    The proposed cellular lesion is in the granulosa cells that support the developing
    follicle: dysregulated folliculogenesis signaling (including altered AMH output) and
    granulosa cell death. Granulosa cells, not oocytes, are the cell type in which
    premutation toxicity has been most directly implicated. This node is the point at which
    the FXPOI knowledge gap is largest, so it is marked PROVISIONAL and carries an attached
    KNOWLEDGE_GAP discussion.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  cell_types:

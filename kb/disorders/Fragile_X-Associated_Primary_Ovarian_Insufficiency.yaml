      id: HP:0031101
      label: Abnormal circulating antimullerian hormone concentration
  cell_types:
  - preferred_term: granulosa cell
    term:
      id: CL:0000501
      label: granulosa cell
  evidence:
  - reference: PMID:39647506
    reference_title: "Evidence-based guideline: premature ovarian insufficiency(†)(‡)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Questions were added on the role of anti-Müllerian hormone (AMH) in the diagnosis of POI"
    explanation: >-
      Documents the formal role of AMH in current POI diagnostic guidance. PARTIAL because

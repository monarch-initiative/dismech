      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "these aggregates were able to cause significant granulosa cell death independent of FMRpolyG expression"
      explanation: >-
        Marked PARTIAL because it constrains rather than supports this edge: it shows the
        granulosa lesion does not require FMRpolyG, leaving any additive FMRpolyG

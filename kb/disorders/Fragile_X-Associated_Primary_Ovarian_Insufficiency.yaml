    term:
      id: GO:0001541
      label: ovarian follicle development
    modifier: ABNORMAL
  locations:
  - preferred_term: ovary
    term:
      id: UBERON:0000992
      label: ovary
  downstream:
  - target: Hypergonadotropic hypogonadism
    causal_link_type: DIRECT
    description: >-
      Loss of the follicle pool removes the ovarian source of estradiol and of the
      inhibin/AMH feedback signals to the pituitary.
    evidence:
    - reference: PMID:38677871
      reference_title: Primary Amenorrhea and Premature Ovarian Insufficiency.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "primary/premature ovarian insufficiency due to hypergonadotropic hypogonadism"
      explanation: >-
        Ties loss of ovarian function to the hypergonadotropic endocrine state this edge
        produces. PARTIAL because the review covers POI as a class.
- name: Hypergonadotropic hypogonadism
  description: >-
    Depletion of the follicle pool removes ovarian estradiol and inhibin output, releasing
    the pituitary from negative feedback and producing menopausal-range FSH with low
    estradiol before age 40 - the defining endocrine state of FXPOI. Ovarian function is
    not always absolutely lost: intermittent ovulatory activity may persist, so
    spontaneous conception after diagnosis is unlikely but not impossible.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:20301558
    reference_title: "FMR1 Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FXPOI, defined as hypergonadotropic hypogonadism before age 40 years, has been observed in 20% of women who carry a premutation allele compared to 1% in the general population"
    explanation: >-
      GeneReviews defines FXPOI by this endocrine state and quantifies its excess over the
      general population.
  - reference: PMID:38677871
    reference_title: Primary Amenorrhea and Premature Ovarian Insufficiency.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This review focuses on primary amenorrhea and primary/premature ovarian insufficiency due to hypergonadotropic hypogonadism."
    explanation: >-
      Confirms hypergonadotropic hypogonadism as the endocrine mechanism of premature
      ovarian insufficiency generally. PARTIAL because the review is about POI as a class,
      not FXPOI specifically.
  downstream:
  - target: Chronic estrogen deficiency
    causal_link_type: DIRECT
    description: >-
      Sustained hypoestrogenism from an age decades before typical menopause drives the
      long-term morbidity of FXPOI.
    evidence:
    - reference: PMID:39647506
      reference_title: "Evidence-based guideline: premature ovarian insufficiency(†)(‡)."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The potential implications include adverse effects on quality of life, on fertility and on bone, cardiovascular and cognitive health."
      explanation: >-
        Enumerates the downstream morbidity this edge asserts follows loss of ovarian
        hormone output. PARTIAL because the guideline addresses POI as a class.
- name: Chronic estrogen deficiency
  description: >-
    Premature and prolonged estrogen deficiency is the source of the non-reproductive
    morbidity of FXPOI: vasomotor symptoms, accelerated bone loss with reduced bone
    mineral density, adverse cardiovascular risk, and effects on quality of life. This is
    the rationale for hormone therapy continued to the age of typical natural menopause,
    and it is shared with primary ovarian insufficiency of any cause rather than being
    specific to the FMR1 premutation.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:39647506
    reference_title: "Evidence-based guideline: premature ovarian insufficiency(†)(‡)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The potential implications include adverse effects on quality of life, on fertility and on bone, cardiovascular and cognitive health. Although hormone therapy (HT) can mitigate some of these effects, many questions still remain regarding the optimal management of POI."
    explanation: >-
      The 2024 international POI guideline enumerates the sequelae of premature estrogen
      deficiency and the mitigating role of hormone therapy. PARTIAL because it addresses
      POI as a class rather than the FMR1 premutation subtype.

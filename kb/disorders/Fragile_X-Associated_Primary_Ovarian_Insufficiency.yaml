  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      FXPOI presents and is managed as hypergonadotropic hypogonadism - a reproductive
      endocrine disorder - which is where its diagnosis (FSH, AMH) and treatment (hormone
      therapy, fertility preservation) sit clinically.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Its cause is a Mendelian, X-linked FMR1 repeat expansion, and the practical entry
      point for most carriers is genetic testing and cascade counseling rather than an
      endocrine presentation.
inheritance:
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    FXPOI is transmitted in an X-linked manner via FMR1 premutation alleles. Penetrance
    is incomplete: roughly 20% of heterozygous female premutation carriers develop
    hypergonadotropic hypogonadism before age 40, and expressivity ranges from
    subclinical diminished ovarian reserve to overt amenorrhea. Male premutation
    carriers do not manifest FXPOI but transmit the premutation to all of their
    daughters, who are then at risk.
  evidence:
  - reference: PMID:20301558
    reference_title: "FMR1 Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FMR1 disorders are inherited in an X-linked manner."
    explanation: GeneReviews establishes X-linked inheritance for the FMR1 disorders, including FXPOI.
  - reference: PMID:20301558
    reference_title: "FMR1 Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Males with FXTAS will transmit their FMR1 premutation expansion to all of their daughters, who will be heterozygous for a premutation and at increased risk for FXTAS, FXPOI, and FXAND."
    explanation: >-
      Documents the X-linked transmission pattern specific to FXPOI risk, including the
      obligate transmission from premutation-carrier fathers to all daughters.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_fmr1_premutation_ovarian_rna_gof_model
  hypothesis_label: Canonical FMR1 Premutation RNA Gain-of-Function (± RAN-Translation) Model of Ovarian Toxicity
  status: CANONICAL
  description: >-
    FXPOI is attributed to the same premutation gain-of-function paradigm established for
    FXTAS, applied to the ovary. The 55-200 CGG premutation allele largely escapes the
    hypermethylation that silences the full mutation, is transcribed at elevated levels,
    and the expanded CGG-repeat FMR1 mRNA is itself toxic - forming nuclear RNA foci that
    sequester CGG-repeat-binding proteins away from their normal functions. A parallel,
    non-exclusive arm is repeat-associated non-AUG (RAN) translation of the expanded
    repeat into an aggregation-prone polyglycine protein, FMRpolyG. In the ovary these
    converge on granulosa cell dysfunction and death and on accelerated depletion of the
    follicle pool, producing hypergonadotropic hypogonadism before age 40. Note the
    directional contrast with FXS, where >200 repeats silence FMR1 and disease arises
    from loss of FMRP: FXPOI is not an FMRP-deficiency phenotype.
  evidence:
  - reference: PMID:17618523
    reference_title: "Fragile X-associated tremor/ataxia syndrome: clinical features, genetics, and testing guidelines."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenic mechanism is related to overexpression and toxicity of the FMR1 mRNA per se."
    explanation: >-
      Establishes the FMR1 mRNA toxic gain-of-function paradigm for premutation disease.
      Marked PARTIAL because this statement is made for FXTAS; its extension to the
      ovarian phenotype is an inference from the shared premutation genotype rather than
      a direct ovarian observation in this paper.
  - reference: PMID:25954027
    reference_title: RAN translation at CGG repeats induces ubiquitin proteasome system impairment in models of fragile X-associated tremor ataxia syndrome.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "the repeat also elicits production of a toxic polyglycine protein, FMRpolyG, via repeat-associated non-AUG (RAN)-initiated translation"
    explanation: >-
      Supplies the RAN-translation/FMRpolyG arm of the premutation gain-of-function model.
      PARTIAL because the experiments are Drosophila and transfected-cell models of FXTAS,
      not ovarian tissue.
pathophysiology:
- name: FMR1 premutation CGG expansion and elevated FMR1 mRNA
  description: >-
    The initiating lesion is a premutation-range (55-200 CGG) trinucleotide repeat
    expansion in the FMR1 5' UTR at Xq27.3. Unlike the full mutation (>200 repeats),
    which is hypermethylated and transcriptionally silenced, the premutation allele
    remains largely unmethylated and is actively transcribed, producing elevated levels
    of an FMR1 mRNA carrying the expanded CGG tract. This transcript, not the loss of
    FMRP, is the proximate pathogenic species.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

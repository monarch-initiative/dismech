- name: RNA gain-of-function and sequestration of CGG-repeat-binding proteins
  description: >-
    The expanded CGG-repeat FMR1 mRNA forms nuclear RNA aggregates that bind and sequester
    CGG-repeat-binding proteins - identified in FXTAS models as Pur alpha and hnRNP A2/B1 -
    depleting them from their normal functions. This is the leading arm of premutation
    toxicity. The direct ovarian evidence is thinner than the neuronal evidence from FXTAS
    models; its application to granulosa cells is an extension of the shared premutation
    mechanism rather than a directly demonstrated ovarian finding.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:17698009
    reference_title: Pur alpha binds to rCGG repeats and modulates repeat-mediated neurodegeneration in a Drosophila model of fragile X tremor/ataxia syndrome.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "transcribed premutation repeats alone are sufficient to cause neurodegeneration, suggesting that rCGG-repeat-binding proteins (RBPs) may be sequestered from their normal function by rCGG binding"
    explanation: >-
      Provides the mechanistic basis for RNA-mediated protein sequestration by premutation
      transcripts. PARTIAL because the model is Drosophila neurons, not ovarian tissue.
  - reference: PMID:25954027
    reference_title: RAN translation at CGG repeats induces ubiquitin proteasome system impairment in models of fragile X-associated tremor ataxia syndrome.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "FXTAS is thought to arise primarily from an RNA gain-of-function toxicity mechanism."
    explanation: >-
      States the primacy of the RNA gain-of-function route among premutation mechanisms.
      PARTIAL because the claim is framed for FXTAS.
  - reference: PMID:36250920
    reference_title: Evidence for a fragile X messenger ribonucleoprotein 1 (FMR1) mRNA gain-of-function toxicity mechanism contributing to the pathogenesis of FXPOI.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "identified proteins that are specifically sequestered by CGG RNA aggregates in granulosa cells in vitro"
    explanation: >-
      Shows the sequestration step asserted by this node occurring in granulosa cells
      specifically, rather than only in the neuronal FXTAS models. The node is nonetheless
      held at PROVISIONAL because which sequestered protein is functionally decisive for
      the follicle remains open.
  downstream:
  - target: Granulosa cell dysfunction and death
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sequestration of RNA-binding proteins is proposed to impair the somatic support cells
      of the follicle, but the intermediate steps are not established in the human ovary.
- name: RAN translation and FMRpolyG production
  description: >-
    Repeat-associated non-AUG (RAN) translation initiates within the expanded CGG tract and
    produces an aggregation-prone polyglycine protein, FMRpolyG. This is the parallel
    protein-toxicity arm of the premutation mechanism, and the evidence that it is
    initiated at all comes from FXTAS models rather than ovarian tissue. Its standing in
    the ovary is now constrained rather than simply open: in the granulosa cell model,
    expanded CGG-repeat RNA causes cell death independently of FMRpolyG, so the RNA arm is
    sufficient for the granulosa lesion and FMRpolyG is not required for it. What remains
    unresolved is whether FMRpolyG makes any additional contribution to FXPOI on top of
    the RNA arm - not whether the RNA arm needs it.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:

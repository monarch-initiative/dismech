- name: Serum anti-Mullerian hormone
  notes: >-
    AMH is produced by granulosa cells of small growing follicles and indexes ovarian
    reserve. It declines earlier than FSH rises, making it the more sensitive marker of
    the occult phase of FXPOI, and it is used where the POI diagnosis is uncertain.
  biomarker_term:
    preferred_term: Abnormal circulating antimullerian hormone concentration

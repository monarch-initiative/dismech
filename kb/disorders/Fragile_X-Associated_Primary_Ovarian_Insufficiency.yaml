    term:
      id: UBERON:0000992
      label: ovary
  downstream:
  - target: Accelerated ovarian follicle depletion
    causal_link_type: DIRECT
    description: >-
      Loss of granulosa cell support accelerates the attrition of follicles from the
      ovarian reserve.
- name: Accelerated ovarian follicle depletion
  description: >-
    The tissue-level consequence is faster-than-normal attrition of the ovarian follicle
    pool. The reserve is established normally and puberty proceeds normally; it is the
    subsequent rate of loss that is abnormal, which is why FXPOI presents as premature
    reproductive aging rather than as a congenital gonadal dysgenesis. An additional
    mechanism proposed from Fmr1 mouse work - premature mTOR-driven recruitment of
    primordial follicles, i.e. accelerated burn-through of the reserve rather than
    increased death alone - is noted here but not asserted as an evidence-backed node
    (see notes).
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  biological_processes:

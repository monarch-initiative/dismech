- name: Granulosa cell dysfunction and death
  description: >-
    The cellular lesion is in the granulosa cells that support the developing follicle:
    dysregulated folliculogenesis signaling (including altered AMH output) and granulosa
    cell death. Granulosa cells, not oocytes, are the cell type in which premutation
    toxicity has been most directly implicated. The node is held at PROVISIONAL rather than
    ESTABLISHED because its support, while genuinely ovarian, comes entirely from an
    ectopic-expression granulosa cell model plus premutation mice - there is no observation
    in granulosa cells from premutation carriers themselves. The attached KNOWLEDGE_GAP
    discussion records what would close that.

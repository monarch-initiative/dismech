  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what intermediate steps does sequestration of CGG-repeat-binding proteins in
    granulosa cells lead to loss of the ovarian follicle, and does FMRpolyG add anything
    to the RNA arm that is already sufficient to kill granulosa cells?
  attaches_to:
  - pathophysiology#RNA gain-of-function and sequestration of CGG-repeat-binding proteins
  - pathophysiology#RAN translation and FMRpolyG production
  - pathophysiology#Granulosa cell dysfunction and death
  - pathophysiology#Accelerated ovarian follicle depletion
  rationale: >-
    The question of whether the FXTAS RNA-toxicity paradigm operates in granulosa cells at
    all is now substantially answered: an in vitro granulosa cell model shows expanded
    CGG-repeat RNA aggregating intranuclearly and killing granulosa cells, and a
    premutation mouse shows the corresponding RNA-binding proteins depleted in ovarian
    follicles. What remains open is the chain in between - which sequestered protein,
    acting on which granulosa function, translates into loss of a follicle - and whether
    FMRpolyG contributes anything additive, given that granulosa cell death does not
    require it. Three of the four nodes on this arm stay PROVISIONAL, for two different
    reasons: the RNA and RAN nodes because their direct evidence is still FXTAS-derived,
    and the granulosa node because its evidence, though ovarian, comes from an
    ectopic-expression cell model and from mice rather than from carriers. Only the
    follicle-depletion node is ESTABLISHED, since accelerated loss of ovarian reserve in
    premutation carriers is itself a clinical observation.
  proposed_experiments:
  - experiment_id: exp_fxpoi_granulosa_foci_fmrpolyg
    name: Repeat-RNA foci and FMRpolyG in premutation-carrier granulosa cells
    description: >-
      Assay granulosa cells recovered from FMR1 premutation carriers undergoing assisted
      reproduction for CGG-repeat RNA foci and FMRpolyG, and relate their burden to
      contemporaneous ovarian reserve markers (AMH, antral follicle count) and repeat
      length.
    supporting_outcome:
    - Detection of foci and FMRpolyG in granulosa cells recovered from premutation carriers themselves, scaling with repeat length and inversely with ovarian reserve, would replace the current ectopic-expression and mouse support with patient-derived evidence and justify moving the granulosa node from PROVISIONAL to ESTABLISHED.
    refuting_outcome:
    - Absence of foci and FMRpolyG in granulosa cells of affected carriers would argue that the ovarian lesion is not a direct transposition of the neuronal mechanism.
  - experiment_id: exp_fxpoi_ran_translation_dissection
    name: Separating RNA toxicity from RAN translation in granulosa cells
    description: >-
      In cultured human granulosa cells expressing premutation-length CGG repeats, block
      RAN translation without altering repeat-RNA abundance, and separately reduce
      repeat-RNA abundance while preserving FMRpolyG output, then measure cell viability.
    supporting_outcome:
    - Rescue on repeat-RNA reduction alone would establish RNA gain-of-function as the dominant ovarian arm.
    refuting_outcome:
    - Rescue only when FMRpolyG is blocked would reassign the ovarian mechanism to the RAN-translation arm.
- discussion_id: fxpoi_nonlinear_repeat_size_risk
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Why is FXPOI risk non-linear in repeat length, rising through the mid-premutation range
    and then falling at the largest premutation sizes?
  attaches_to:
  - pathophysiology#FMR1 premutation CGG expansion and elevated FMR1 mRNA
  rationale: >-
    A purely dose-dependent RNA-toxicity model predicts that risk should rise monotonically
    with repeat length. The observed decline in risk at the largest premutation sizes is
    therefore a genuine constraint on the mechanism rather than a detail. The effect itself
    is no longer in question - it is curated in the genetic section on PMID:33927378, a
    1,668-carrier cohort - so what stays open here is the explanation, not the observation.
    The causal chain as curated has no node that would produce an inverted-U, and the usual
    proposal, that rising repeat-RNA burden is offset by falling translational output at
    the largest repeat sizes, has not been measured against ovarian outcome in the same
    carriers.
  proposed_experiments:
  - experiment_id: exp_fxpoi_repeat_length_stratified_molecular_profile
    name: Repeat-length-stratified FMR1 mRNA, FMRP, and FMRpolyG versus ovarian reserve
    description: >-
      In a carrier cohort stratified across the premutation range, measure FMR1 mRNA level,
      FMRP level, and FMRpolyG burden in the same individuals and relate each to ovarian
      reserve, testing whether declining FMRP or translational output at the largest repeat
      sizes offsets rising repeat-RNA burden.
    supporting_outcome:
    - An inverted-U in a composite toxicity measure that tracks the clinical risk curve would explain the non-linearity within the current model.
    refuting_outcome:
    - A monotonic molecular gradient across repeat lengths would indicate that the non-linear clinical risk arises outside the RNA-toxicity axis.
notes: >-
  Scope: this entry covers the ovarian phenotype of the FMR1 premutation. The neurological
  premutation phenotype is curated separately as Fragile X-Associated Tremor Ataxia
  Syndrome, and the full-mutation disorder as Fragile X Syndrome; the fragile
  X-associated neuropsychiatric disorders (FXAND) are not yet curated. MONDO:0010706 is
  labeled "premature ovarian failure 1" after OMIM 311360; the entry name follows current
  clinical usage (primary ovarian insufficiency), and the OMIM/MONDO label is retained as
  a synonym.

  Evidence provenance. Every snippet in this entry is now confirmed as an exact
  whitespace-normalized substring of its cited abstract. That confirmation came in two
  stages, which is worth recording because it shaped the entry. The bulk was verified
  locally against the committed reference cache. Eight further snippets, belonging to
  three FXPOI-specific papers added in response to PR review - PMID:36250920 (granulosa
  cell CGG-RNA toxicity), PMID:22470123 (CGG knock-in mouse follicle depletion), and
  PMID:33927378 (non-linear repeat-length risk) - could not be fetched or verified in the
  authoring session, because outbound access to NCBI E-utilities and every other
  literature host was blocked by network policy there. They were carried on the PR
  reviewer's verbatim quotes, with the PMIDs, titles and substantive claims independently
  corroborated by this entry's own deep-research report, and were then checked by CI.

  CI verified seven of those eight and rejected one: a penetrance sentence attributed to
  PMID:33927378 ("Approximately 20-30% of women with an FMR1 premutation experience
  FXPOI") is not present in that paper's abstract, though it may appear in the full text.
  That evidence item was removed rather than reworded, since the abstract could not be
  read from the authoring environment to source a correct quote. The prevalence claim it
  would have reinforced is unaffected - it still rests on the verified GeneReviews figure
  of 20% of carriers versus 1% of the general population - so what was lost is a
  corroborating primary-cohort citation, not the claim. Re-adding a correctly quoted
  penetrance figure from PMID:33927378 is a clean follow-up for anyone editing with
  network access. All three papers have since been fetched with `just fetch-reference`
  and their cache files committed, so verification no longer depends on a live fetch.

  A trap worth flagging for future editors: `unknown_prefix_severity: WARNING` in
  conf/reference_validator_config.yaml means an unfetchable reference is reported as a
  warning, not an error, and the runner treats warning-only results as success. A local
  `just validate` therefore prints "All validations passed" while silently skipping any
  snippet whose reference is not cached. Local green is not evidence of verification for
  an uncached PMID.

  Still deferred for the same reason: premutation carrier-frequency estimates, the
  AGG-interruption and X-inactivation-skewing modifier literature, and the mouse mTOR
  premature-follicle-recruitment result with its rapamycin rescue (a model-organism finding
  that must not be presented as a human treatment option). Depression and anxiety are
  described in the FXPOI literature as a principal morbidity domain alongside bone and
  cardiovascular health, but are not curated as phenotypes here for want of a verifiable
  snippet.

  Ontology limitation from the same cause: UBERON:0001305 (ovarian follicle) and
  GO:0003729 (mRNA binding) are the more precise terms for the follicle-depletion location
  and the RNA-toxicity molecular function, but neither is present in the committed
  dynamic-enum caches, and expanding them requires an ontology lookup that is unreachable
  from the authoring environment. UBERON:0000992 (ovary) is used instead and the
  molecular-function annotation is omitted; both should be tightened by anyone editing this
  entry with network access.

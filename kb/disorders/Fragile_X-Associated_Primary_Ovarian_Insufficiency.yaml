      ovarian insufficiency generally. PARTIAL because the review is about POI as a class,
      not FXPOI specifically.
  downstream:
  - target: Chronic estrogen deficiency
    causal_link_type: DIRECT
    description: >-
      Sustained hypoestrogenism from an age decades before typical menopause drives the
      long-term morbidity of FXPOI.

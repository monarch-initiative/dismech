- name: Hypergonadotropic hypogonadism
  description: >-
    Depletion of the follicle pool removes ovarian estradiol and inhibin output, releasing
    the pituitary from negative feedback and producing menopausal-range FSH with low
    estradiol before age 40 - the defining endocrine state of FXPOI. Ovarian function is
    not always absolutely lost: intermittent ovulatory activity may persist, so
    spontaneous conception after diagnosis is unlikely but not impossible.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:20301558
    reference_title: "FMR1 Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FXPOI, defined as hypergonadotropic hypogonadism before age 40 years, has been observed in 20% of women who carry a premutation allele compared to 1% in the general population"
    explanation: >-

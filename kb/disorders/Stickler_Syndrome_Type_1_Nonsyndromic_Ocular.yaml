      before 50 years of age; 78%), and glaucoma (18%).
    explanation: >-
      Vitreous syneresis in 100 of 100 affected individuals of this pedigree.
- name: Radial Perivascular Retinal Degeneration
  category: Ophthalmologic
  description: >-
    An acquired degeneration of the retina along the perivascular radial
    pattern, named by the reporting authors as the key to the clinical diagnosis

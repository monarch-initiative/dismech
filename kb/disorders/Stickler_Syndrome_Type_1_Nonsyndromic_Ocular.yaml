  phenotype_term:
    preferred_term: Rhegmatogenous retinal detachment
    term:
      id: HP:0012230
      label: Rhegmatogenous retinal detachment
  frequency: FREQUENT
  notes: >-
    65 of 100 affected individuals in one pedigree (PMID:12429250); the

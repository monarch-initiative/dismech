- name: Retinal Tear
  category: Ophthalmologic
  description: >-
    The breach that precedes the detachment. In Stickler syndrome it is
    frequently a giant retinal tear and commonly bilateral, which is what makes
    prophylaxis worth doing and makes a unilateral event a warning about the
    other eye.
  phenotype_term:
    preferred_term: retinal tear, frequently a giant retinal tear
    term:
      id: HP:0011958
      label: Retinal perforation
  notes: >-
    No frequency band. The giant-retinal-tear statement is a background

name: Stickler Syndrome Type 1 Nonsyndromic Ocular
creation_date: "2026-09-16T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Stickler syndrome, type I, nonsyndromic ocular
  term:
    id: MONDO:0012287
    label: Stickler syndrome, type I, nonsyndromic ocular
description: >-
  The ocular-only form of Stickler syndrome type 1 (OSTL1, OMIM 609508) is the
  presentation in which a COL2A1 null allele produces the full type 1 Stickler
  eye - a congenitally abnormal membranous vitreous, high myopia, radial
  perivascular retinal degeneration, and a childhood-onset risk of
  rhegmatogenous retinal detachment - with minimal or no hearing loss, cleft
  palate, midfacial hypoplasia, or arthropathy.

  It is a real mechanistic entity rather than a mild tail of the syndrome,
  because there is a known reason for the restriction. COL2A1 pre-mRNA is
  alternatively spliced into two isoforms. The long form retains exon 2 and
  encodes type IIA procollagen; the short form skips exon 2 and encodes type
  IIB. Adult differentiated chondrocytes make almost entirely IIB, and the
  vitreous is the only adult tissue that contains procollagen IIA. A premature
  termination codon inside exon 2 therefore removes an allele's product from
  the IIA-expressing tissues while leaving the cartilage isoform, transcribed
  from the same allele with exon 2 spliced out, intact. The lesion is
  isoform-restricted rather than merely mild, which is why the eye carries the
  whole phenotype.

  Two things stop that from being a clean rule, and this entry curates both
  rather than tidying them away. First, the restriction is not absolute at the
  patient level: reported "ocular-only" individuals have had scoliosis or mild
  hearing loss, and the largest pedigree found some extraocular manifestation in
  4 of 100 affected individuals. The label means minimal systemic involvement,
  not none. Second, the mechanism is not the only route to the phenotype -
  predominantly ocular Stickler syndrome has been reported with a helical-domain
  nonsense allele, a splice-site allele in intron 51, and a frameshift in exon
  50, none of which the exon 2 model explains.

  Clinically the consequence is sharp and is the reason the distinction is worth
  carrying: these families need lifelong vitreoretinal surveillance and
  detachment prophylaxis, and do not need the audiological, craniofacial and
  orthopaedic surveillance that classic type 1 Stickler syndrome requires -
  while carrying the same 50 percent transmission risk and the same childhood
  blindness risk from giant retinal tear.

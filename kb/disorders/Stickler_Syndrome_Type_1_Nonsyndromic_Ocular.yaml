notes: >-
  CURATION LEVEL, AND WHY THIS IS A STANDALONE ENTRY RATHER THAN A SUBTYPE.
  Claim issue #11975 asked exactly this, and noted that the mechanistic argument
  only counts if it can be sourced. It can. MONDO places MONDO:0012287 directly
  under MONDO:0007160, which is curated here as `Stickler_Syndrome_Type_1`, so a
  `has_subtypes` row on that entry was the obvious alternative and was
  considered. Three things decided against it.

  (1) The lesion is different in kind, not in degree. Classic type 1 Stickler
  syndrome is COL2A1 haploinsufficiency across every type II collagen tissue.
  This entity is haploinsufficiency of one alternatively spliced isoform, with
  the other isoform - transcribed from the same allele - left intact. That is
  three pathophysiology nodes this entry does not share with its parent
  (the exon 2 null allele, the isoform restriction, and the preserved cartilage
  isoform), and they are the top of the chain rather than a detail hanging off
  it.

  (2) The clinical pathway is different. Surveillance and prophylaxis are
  vitreoretinal only; the audiological, craniofacial and orthopaedic
  surveillance that GeneReviews specifies for Stickler syndrome does not apply.

  (3) It has its own primary literature, spanning twenty-five years and several
  independent groups, including a 100-individual pedigree and a 50-family
  mutation-screening series.

  This follows the two recent standalone COL2A1 precedents, multiple epiphyseal
  dysplasia Beighton type (#10987) and spondylometaphyseal dysplasia Schmid type
  (#11550), both of which argue the type 2 collagenopathy spectrum explicitly in
  their own notes rather than folding into a parent.

  WHAT THIS ENTRY DOES NOT DUPLICATE. `Stickler_Syndrome_Type_1` carries the
  classic systemic entity and is referenced as a differential rather than
  restated. This entry was not added to that file's `has_subtypes` and that
  file was not otherwise edited, so the parent entry's own diff stays out of
  this PR; cross-linking the two in the parent's differentials is a reasonable
  follow-on. Membership in the `Type_2_Collagenopathies` grouping is likewise a
  follow-on rather than part of this PR.

  THE EXON 2 RULE IS A STRONG TENDENCY AND IS NOT CURATED AS A LAW. Three
  independent reports place the predominantly ocular phenotype outside exon 2 -
  an Arg453Ter helical-domain allele (PMID:12939326), a GC donor splice site in
  intron 51 shown by reporter construct to splice normally (PMID:16752401), and
  a c.3534dupT frameshift in exon 50 (PMID:41050055). The pathograph therefore
  carries the exon 2 isoform mechanism as ESTABLISHED for the alleles it
  explains, and the discrepant alleles are recorded as a knowledge gap rather
  than left out. Do not read this entry as asserting that an ocular-only
  presentation implies an exon 2 variant, or the converse.

  "NONSYNDROMIC" AND "OCULAR-ONLY" ARE BOTH OVERSTATEMENTS, AND THE SOURCES SAY
  SO. The MONDO and OMIM labels say nonsyndromic; the papers say "minimal or
  absent", "minimal or no", "predominantly ocular". The 100-individual pedigree
  found extraocular manifestations in 4 of 100 affected individuals, and the
  most recent family had scoliosis in the proband and mild bilateral hearing
  loss in the proband's mother. The entry name follows the ontology label
  because that is the identifier being curated, and this paragraph exists so the
  name is not read as a clinical claim.

  FREQUENCY BANDS COME FROM ONE PEDIGREE AND EVERY BAND SAYS SO. The percentages
  behind the phenotype bands in this entry are all from a single eight-generation
  pedigree with 100 affected individuals segregating one exon 2 allele
  (PMID:12429250). That denominator is unusually large for a rare disease, which
  is why bands are assigned at all, but it is one family and one allele, so the
  bands describe that pedigree rather than a sampled population. Each phenotype
  repeats the caveat in its own `notes` so the qualification cannot be lost by
  reading a single row. No band anywhere in this entry is computed from more
  than one source, and none is averaged across sources.

  WHAT IS KNOWINGLY ABSENT. No prevalence rate: none has been estimated for this
  variant specifically, and the Stickler-syndrome figures on the
  `Stickler_Syndrome_Type_1` entry cover the whole type 1 entity rather than
  this subset, so importing them would misstate the denominator. No
  `animal_models:` block: no mouse or other model of an exon 2 specific COL2A1
  null was located, and the general Col2a1 null models are models of the
  cartilage disease this entity spares. No `datasets:` block: no dataset
  specific to this entity was identified, and a COL2A1 gene search returns
  chondrodysplasia and cartilage-biology series that resolve perfectly and are
  about other diseases. No `biochemical:` block: there is no blood or urine
  marker, and the diagnostic assay is an ophthalmic examination plus sequencing.

  DEEP RESEARCH. One falcon run was performed and is committed at
  `research/Stickler_Syndrome_Type_1_Nonsyndromic_Ocular-deep-research-falcon.md`.
  It was treated as leads only; every PMID, snippet and ontology term in this
  entry was fetched and verified against the local cache independently, and
  nothing was bound from the report.

  The query was disambiguated by temporarily setting this entry's `name:` for the
  duration of the run to "Ocular-only Stickler syndrome type 1 (COL2A1
  alternatively spliced exon 2 variants, predominantly ocular Stickler syndrome,
  OMIM 609508)", because the recipe derives the query from that field and a bare
  ontology label is the kind of string a provider substitutes for a neighbouring
  concept. `just preflight-dr` returned SKIP, not PASS - MONDO records no causal
  gene for MONDO:0012287, so its gene-identity check has nothing to discriminate
  on, and SKIP means unchecked. The manual fallback settles it: COL2A1 is
  mentioned 40 times against 3 for COL11A1, 3 for VCAN, 2 for COL11A2 and 1 for
  FZD4 (all of which appear only as differentials), exon 2 is discussed 28 times,
  and the report carries OMIM 609508 and no other disease MIM. Its reference
  validator resolved all nine extracted references; its term validator resolved
  all three terms and flagged one naming mismatch that is a template artefact
  (MONDO:0012287 rendered as "if available").

  It reached this entry's framing independently and in stronger terms than
  expected, which is worth recording because it is corroboration of the
  lump/split call rather than of a fact: it states that "predominantly ocular" is
  preferable to an absolute "ocular-only" because subtle extraocular findings
  occur and ocular-only phenotypes can arise from variants outside exon 2 - the
  same two qualifications this entry curates as a knowledge gap and a REFUTE
  item. Leads it carries that this entry does not curate, recorded so the next
  curator does not re-derive them: megalophthalmos as a reported ocular feature;
  a de novo COL2A1 variant fraction of 37 percent in a broader ocularly selected
  Stickler cohort, which the report itself flags as not exon-2-specific and not
  genomically confirmed for parentage; and the point that prior detachment,
  haemorrhage, cataract or vitreoretinal surgery can obscure the diagnostic
  vitreous architecture, which would be a real caveat on this entry's diagnosis
  block if it can be sourced directly. None is curated as evidence, because a
  deep-research report is a lead.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single COL2A1 null allele is sufficient. Transmission risk to each child
    is 50 percent, and the reported pedigrees are large and multigenerational -
    eight generations and 100 affected individuals in the largest - which is
    consistent with a dominant allele that does not reduce reproductive fitness.
  evidence:
  - reference: PMID:41050055
    reference_title: A novel COL2A1 mutation in a Chinese family with predominantly ocular Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The ocular-only variant of Stickler syndrome type I (OSTL1) is an autosomal
      dominant connective tissue disorder characterized by ocular abnormalities
      with minimal or absence of systemic involvement.
    explanation: >-
      States the inheritance mode for this entity by name, and the
      minimal-systemic-involvement qualifier that the entry notes insist on.
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Each child of an individual with autosomal dominant Stickler syndrome has a
      50% chance of inheriting the pathogenic variant.
    explanation: >-
      The transmission figure this block states. Indirect: GeneReviews covers
      Stickler syndrome across all six genes rather than this variant.
pathophysiology:
- name: COL2A1 Null Allele in the Alternatively Spliced Exon 2
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion in the alleles that the isoform model explains. A
    premature termination codon or a structural change inside COL2A1 exon 2
    removes or destabilises the exon 2 containing transcript from that allele.
    Reported alleles include Cys64Stop and Cys57Tyr, a Cys86 premature
    termination codon in an eight-generation pedigree, and C192A. Lymphoblast
    RT-PCR in a Cys64Stop patient recovered only the normal allele's IIA form,
    which the reporting authors read as either nonsense-mediated decay of the
    mutant IIA transcript or nonsense-associated skipping of exon 2 - in either
    case, no mutant IIA product.
  genes:
  - preferred_term: COL2A1
    term:
      id: hgnc:2200
      label: COL2A1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  biological_processes:
  - preferred_term: nonsense-mediated mRNA decay of the exon 2 containing COL2A1 transcript
    term:
      id: GO:0000184
      label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
    modifier: INCREASED
  evidence:
  - reference: PMID:17721977
    reference_title: Missense and nonsense mutations in the alternatively-spliced exon 2 of COL2A1 cause the ocular variant of Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We describe here two mutations in exon 2 of COL2A1 in three patients with
      predominantly ocular Stickler syndrome
    explanation: >-
      Exon 2 alleles in patients with this phenotype.
  - reference: PMID:17721977
    reference_title: Missense and nonsense mutations in the alternatively-spliced exon 2 of COL2A1 cause the ocular variant of Stickler syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      RT-PCR of total lymphoblast RNA from one patient with the Cys64Stop
      mutation revealed that only the normal allele of the IIA form was present,
      indicating that the mutation resulted either in complete loss of the allele
      by nonsense-mediated mRNA decay or by skipping of exon 2 via
      nonsense-mediated altered splicing, resulting in production of the type IIB
      isoform.
    explanation: >-
      The molecular demonstration that the mutant allele contributes no IIA
      transcript, and the two mechanisms the authors leave open between.
  - reference: PMID:12429250
    reference_title: "Radial perivascular retinal degeneration: a key to the clinical diagnosis of an ocular variant of Stickler syndrome with minimal or no systemic manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The COL2A1 gene analysis identified a mutation converting a codon TGC for
      cysteine(86) to a premature termination codon in the alternatively spliced
      exon 2.
    explanation: >-
      The exon 2 allele in the largest reported pedigree, which is the source of
      every frequency band in this entry.
  downstream:
  - target: Isoform-Restricted Loss of Type IIA Procollagen
    description: >-
      Loss of the mutant allele's exon 2 containing transcript is loss of its
      type IIA procollagen specifically.
- name: Isoform-Restricted Loss of Type IIA Procollagen
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The step that makes this a distinct disease rather than a mild Stickler
    syndrome. COL2A1 pre-mRNA is alternatively spliced into a long isoform that
    retains exon 2 (type IIA) and a short isoform that skips it (type IIB). The
    two are expressed in different tissues, so an exon 2 lesion partitions along
    that boundary instead of reducing type II collagen everywhere. This is the
    node the whole entity turns on, and it has no counterpart in classic type 1
    Stickler syndrome, where the lesion is not isoform-selective.
  molecular_functions:
  - preferred_term: type IIA procollagen as an extracellular matrix structural constituent
    term:
      id: GO:0005201
      label: extracellular matrix structural constituent
    modifier: DECREASED
  biological_processes:
  - preferred_term: alternative splicing of COL2A1 exon 2
    term:
      id: GO:0000380
      label: alternative mRNA splicing, via spliceosome
  evidence:
  - reference: PMID:17721977
    reference_title: Missense and nonsense mutations in the alternatively-spliced exon 2 of COL2A1 cause the ocular variant of Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      COL2A1 precursor mRNA undergoes alternative splicing, resulting in two
      isoforms, a long form including exon 2 (type IIA isoform) and a short form
      excluding exon 2 (type IIB isoform).
    explanation: >-
      The two isoforms and the exon that distinguishes them.
  - reference: PMID:17721977
    reference_title: Missense and nonsense mutations in the alternatively-spliced exon 2 of COL2A1 cause the ocular variant of Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Recent evidence indicates that due to the tissue-specific expression of
      these two isoforms, premature termination codon mutations in exon 2 cause
      Stickler syndrome with minimal or no extraocular manifestations.
    explanation: >-
      The isoform mechanism stated as the explanation of the phenotype
      restriction.
  - reference: PMID:12686304
    reference_title: "Clinical variability of Stickler syndrome: role of exon 2 of the collagen COL2A1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Because of this selective tissue expression, mutations in exon 2 of the
      COL2A1 gene have been hypothesized to produce this Stickler syndrome
      phenotype with minimal or absent extraocular findings.
    explanation: >-
      An independent review reaching the same model, and stating its status
      honestly as a hypothesis about selective tissue expression. Indirect: a
      literature synthesis rather than a measurement.
    quote_role: REVIEW_SYNTHESIS
  downstream:
  - target: Depletion of Type IIA Procollagen in the Vitreous
    description: >-
      The vitreous is the adult tissue that depends on the lost isoform.
  - target: Preserved Type IIB Procollagen in Adult Cartilage
    description: >-
      The same allele still yields normal IIB transcript, because exon 2 is
      spliced out of it.
- name: Preserved Type IIB Procollagen in Adult Cartilage
  biological_scale: MOLECULAR
  role: modulator
  mechanism_confidence: ESTABLISHED
  description: >-
    The branch that explains an absence, which is why it is drawn. Adult
    differentiated chondrocytes express the exon 2 skipping IIB isoform almost
    exclusively, so a premature termination codon inside exon 2 is not present
    in the transcript they make. The cartilage, and with it the arthropathy,
    craniofacial and auditory features of classic type 1 Stickler syndrome, is
    largely spared. This node deliberately has no downstream edge: what it
    produces is the non-occurrence of the systemic phenotype, and drawing an
    arrow to an absent manifestation would be a phantom node.
  cell_types:
  - preferred_term: differentiated chondrocyte in adult cartilage
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:17721977
    reference_title: Missense and nonsense mutations in the alternatively-spliced exon 2 of COL2A1 cause the ocular variant of Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The short form is predominantly expressed by differentiated chondrocytes in
      adult cartilage, and the long form in chondroprogenitor cells during early
      development and in the vitreous of the eye, which is the only adult tissue
      containing procollagen IIA.
    explanation: >-
      The expression fact this node and the next one both rest on - IIB in adult
      cartilage, IIA in the vitreous and only there among adult tissues.
  - reference: PMID:22574936
    reference_title: Familial retinal detachment associated with COL2A1 exon 2 and FZD4 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      None of the affected family members had early-onset arthritis, hearing
      abnormalities, abnormal clefting or facial features characteristic of
      classical Stickler syndrome.
    explanation: >-
      The clinical corollary in a pedigree carrying an exon 2 allele - the
      cartilage-derived features of classic Stickler syndrome are absent.
- name: Depletion of Type IIA Procollagen in the Vitreous
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The vitreous is the only adult tissue containing procollagen IIA, so it
    absorbs the whole effect of an isoform-restricted null allele. The
    consequence for the gel is structural rather than metabolic - the heterotypic
    type II/XI collagen fibril network that holds the vitreous gel together is
    built from fewer alpha-1(II) chains.
  locations:
  - preferred_term: vitreous body
    term:
      id: UBERON:0001798
      label: vitreous body
  biological_processes:
  - preferred_term: collagen fibril organization in the vitreous
    term:
      id: GO:0030199
      label: collagen fibril organization
    modifier: DECREASED
  evidence:
  - reference: PMID:12686304
    reference_title: "Clinical variability of Stickler syndrome: role of exon 2 of the collagen COL2A1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      One form, designated as type IIB (short form), is preferentially expressed
      in adult cartilage tissue. The other form, designated as type IIA (long
      form), is preferentially expressed in the vitreous body of the eye.
    explanation: >-
      The tissue distribution of the two isoforms, from an independent review.
      Indirect: a literature synthesis rather than a measurement.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:16752401
    reference_title: "High efficiency of mutation detection in type 1 stickler syndrome using a two-stage approach: vitreoretinal assessment coupled with exon sequencing for screening COL2A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      To date three genes, COL2A1, COL11A1, and COL11A2, encoding the heterotypic
      type II/XI collagen fibrils present in vitreous and cartilage have been
      shown to have mutations that result in Stickler syndrome.
    explanation: >-
      Identifies the fibril system this node describes, and that it is shared
      between vitreous and cartilage - which is what makes an isoform-restricted
      lesion the interesting case. Indirect: a background statement about type 1
      Stickler syndrome generally.
    quote_role: BACKGROUND
  downstream:
  - target: Congenitally Abnormal Membranous Vitreous
    description: >-
      Reduced fibril content produces the abnormal gel architecture that is
      present from birth.
- name: Congenitally Abnormal Membranous Vitreous
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The congenital half of the ocular phenotype, and the finding an ophthalmic
    examination can see directly. The type 1 membranous vitreous phenotype is
    specific enough to COL2A1 that it has been used as a screening gate - a
    50-family series selected on the membranous phenotype alone found COL2A1
    mutations in 94 percent of cases. Vitreous syneresis was present in every
    affected individual of the largest pedigree.
  locations:
  - preferred_term: vitreous body
    term:
      id: UBERON:0001798
      label: vitreous body
  evidence:
  - reference: PMID:16752401
    reference_title: "High efficiency of mutation detection in type 1 stickler syndrome using a two-stage approach: vitreoretinal assessment coupled with exon sequencing for screening COL2A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Mutations were detected in 47 (94%) cases consisting of 166 affected and 78
      unaffected individuals.
    explanation: >-
      The yield of COL2A1 sequencing in families selected on the membranous
      vitreous phenotype, which is what establishes the phenotype as a reliable
      pointer to this gene.
  - reference: PMID:12429250
    reference_title: "Radial perivascular retinal degeneration: a key to the clinical diagnosis of an ocular variant of Stickler syndrome with minimal or no systemic manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The predominant ocular findings are a congenitally abnormal vitreous and an
      acquired radial perivascular retinal degeneration that may lead to
      complicated childhood and adult retinal detachment.
    explanation: >-
      The two-part structure of the ocular phenotype - one congenital, one
      acquired - and the sequence in which they lead to detachment. This
      sentence is the reason the next two nodes are drawn separately.
  downstream:
  - target: Abnormal Vitreous
  - target: High Myopia
  - target: Acquired Radial Perivascular Retinal Degeneration
    description: >-
      The abnormal gel is present from birth; the retinal degeneration develops
      on top of it.
- name: Acquired Radial Perivascular Retinal Degeneration
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The acquired half, and the finding the reporting authors named as the key to
    the clinical diagnosis. It was present in every affected individual of the
    100-person pedigree, and it is the lesion that converts a structurally
    abnormal vitreous into a torn retina.
  evidence:
  - reference: PMID:12429250
    reference_title: "Radial perivascular retinal degeneration: a key to the clinical diagnosis of an ocular variant of Stickler syndrome with minimal or no systemic manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The ocular findings, frequently bilateral, consisted of radial perivascular
      retinal degeneration (RPRD) (100%), vitreous syneresis (100%), high myopia
      (76%), retinal detachment (65%), presenile cataract development (occurring
      before 50 years of age; 78%), and glaucoma (18%).
    explanation: >-
      The frequency table for this pedigree.
  downstream:
  - target: Radial Perivascular Retinal Degeneration
  - target: Lattice Retinal Degeneration
  - target: Retinal Tear and Rhegmatogenous Detachment
    description: >-
      Degenerate retina adherent to an abnormal gel is where the tear forms.
- name: Retinal Tear and Rhegmatogenous Detachment
  biological_scale: ORGANISM
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The outcome that dominates management. Stickler syndrome is the commonest
    inherited cause of childhood rhegmatogenous retinal detachment, the tear is
    frequently a giant retinal tear, it is commonly bilateral, and it is a
    frequent cause of blindness. In the largest ocular-only pedigree, 70 percent
    of detachments occurred between 4 and 18 years of age, which is why
    surveillance has to start in childhood rather than at presentation.
  evidence:
  - reference: PMID:10729292
    reference_title: "COL2A1 exon 2 mutations: relevance to the Stickler and Wagner syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Stickler syndrome is the commonest inherited cause of rhegmatogenous
      retinal detachment in childhood with a risk of giant retinal tear (GRT)
      which is commonly bilateral and a frequent cause of blindness.
    explanation: >-
      The nature and stakes of the detachment risk. Quoted from this paper's
      structured BACKGROUND section, where it restates the established picture
      for Stickler syndrome as a whole, so it is neither this paper's own finding
      nor specific to the ocular-only variant.
    quote_role: BACKGROUND
  - reference: PMID:10729292
    reference_title: "COL2A1 exon 2 mutations: relevance to the Stickler and Wagner syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Such patients are all at high risk of retinal detachment.
    explanation: >-
      The authors' conclusion about the exon 2 families specifically, which is
      what carries the risk claim across to this entity.
  - reference: PMID:12429250
    reference_title: "Radial perivascular retinal degeneration: a key to the clinical diagnosis of an ocular variant of Stickler syndrome with minimal or no systemic manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Most (70%) of the retinal detachments occurred between 4 and 18 years of
      age.
    explanation: >-
      The age distribution that sets when surveillance must begin.
  downstream:
  - target: Rhegmatogenous Retinal Detachment
  - target: Retinal Tear
phenotypes:
- name: Abnormal Vitreous
  category: Ophthalmologic
  description: >-
    A congenitally abnormal, membranous type 1 vitreous with syneresis. Present
    from birth, visible on ophthalmic examination, and the feature that
    identifies COL2A1 as the gene to sequence.
  phenotype_term:
    preferred_term: Abnormal vitreous humor morphology

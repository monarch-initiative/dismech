    quote_role: BACKGROUND
  - reference: PMID:41050055
    reference_title: A novel COL2A1 mutation in a Chinese family with predominantly ocular Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Two affected individuals were identified, both presenting with myopia,
      megalophthalmos, retinal tears and detachment, vitreous opacification,
      chorioretinal scars, and early-onset cataracts.
    explanation: >-
      Retinal tears in both affected members of an independent family with this
      phenotype.
- name: Lattice Retinal Degeneration
  category: Ophthalmologic
  description: >-
    Lattice degeneration is named alongside rhegmatogenous detachment as a

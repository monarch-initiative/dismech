genetic:
- name: COL2A1
  gene_term:
    preferred_term: COL2A1
    term:
      id: hgnc:2200
      label: COL2A1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Heterozygous null allele, characteristically in the alternatively spliced exon 2
  notes: >-
    COL2A1 (HGNC:2200, OMIM 120140) is at 12q13.11 and encodes the alpha-1 chain
    of type II collagen. The alleles reported in this entity are Cys64Stop and
    Cys57Tyr (PMID:17721977), a Cys86 premature termination codon (PMID:12429250)
    and C192A (PMID:22574936) - all in exon 2 - alongside three that are not:
    Arg453Ter in exon 30, an allele previously reported in classic Stickler
    syndrome (PMID:12939326); a GC donor splice site in intron 51 (PMID:16752401);
    and a c.3534dupT frameshift in exon 50 (PMID:41050055). The exon 2 alleles
    have a mechanism; the other three do not yet, and that is recorded as a
    knowledge gap rather than smoothed over. Note that the same nucleotide change
    can give different phenotypes in different families, so a variant's position
    in exon 2 is supporting evidence for this diagnosis and not a substitute for
    the ophthalmic examination.
  evidence:
  - reference: PMID:10729292
    reference_title: "COL2A1 exon 2 mutations: relevance to the Stickler and Wagner syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Three of the families exhibited a predominantly ocular phenotype with
      minimal or absent systemic involvement and were found to have mutations in
      exon 2 of COL2A1.
    explanation: >-
      The genotype-phenotype correlation in the series that established it -
      three exon 2 families with the ocular-only phenotype.
  - reference: PMID:10729292
    reference_title: "COL2A1 exon 2 mutations: relevance to the Stickler and Wagner syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Five other pedigrees with an identical ocular phenotype plus orofacial,
      auditory, and articular involvement had mutations in others regions of the
      COL2A1 gene.
    explanation: >-
      The within-study control arm, and the reason the correlation is
      interpretable - the same ocular phenotype plus systemic features tracked
      with non-exon-2 alleles in the same series.
  - reference: PMID:12939326
    reference_title: Autosomal dominant rhegmatogenous retinal detachment associated with an Arg453Ter mutation in the COL2A1 gene.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In family B, an Arg453Ter mutation was identified in exon 30 of the COL2A1
      gene, that was previously described in a patient with classic Stickler
      syndrome.
    explanation: >-
      Recorded as REFUTE against the claim that this phenotype requires an
      exon 2 allele. A helical-domain nonsense allele already known to cause
      classic Stickler syndrome produced predominantly ocular disease in this
      family, so neither direction of the correlation is a rule.
diagnosis:
- name: Vitreoretinal examination as the first-line discriminator
  diagnosis_term:
    preferred_term: eye examination
    term:
      id: NCIT:C38060
      label: Eye Examination
  description: >-
    An ophthalmic examination that characterises the vitreous phenotype comes
    before sequencing, not after it. The type 1 membranous vitreous phenotype is
    specific enough to COL2A1 that selecting families on it and then sequencing
    COL2A1 detected mutations in 94 percent of a 50-family series. In this
    variant the examination carries more weight still, because the systemic
    features that would otherwise suggest Stickler syndrome are absent.
  evidence:
  - reference: PMID:16752401
    reference_title: "High efficiency of mutation detection in type 1 stickler syndrome using a two-stage approach: vitreoretinal assessment coupled with exon sequencing for screening COL2A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      As systemic features in this disorder are variable we have used an
      ophthalmic examination to differentiate those patients with a membranous
      vitreous phenotype associated with mutations in COL2A1, from other patients
      who may have mutations in other genes.
    explanation: >-
      The two-stage strategy this block describes, stated by the authors who
      validated it.
  - reference: PMID:10729292
    reference_title: "COL2A1 exon 2 mutations: relevance to the Stickler and Wagner syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      It also emphasises the importance and reliability of the ophthalmic
      examination in the differential diagnosis of this predominantly ocular form
      of Stickler syndrome from Wagner's vitreoretinopathy.
    explanation: >-
      The examination as the discriminator against the main differential, in the
      series that defined this entity.
- name: COL2A1 sequencing
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  description: >-
    Sequencing of COL2A1 confirms the diagnosis and, because it establishes the
    familial variant, is what makes predictive testing of at-risk relatives
    possible - which matters here more than in most dominant conditions, because
    an asymptomatic carrier child is the person prophylaxis is for. Exon 2 must
    be covered; it is skipped from the adult cartilage transcript and can be
    overlooked by assays designed around the cartilage phenotype.
  evidence:
  - reference: PMID:16752401
    reference_title: "High efficiency of mutation detection in type 1 stickler syndrome using a two-stage approach: vitreoretinal assessment coupled with exon sequencing for screening COL2A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Gene amplification and exon sequencing was used to screen 50 families or
      sporadic cases with this membranous phenotype, for mutations in COL2A1.
    explanation: >-
      The confirmatory assay and the cohort in which its yield was measured.
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Once the Stickler syndrome-related pathogenic variant(s) have been
      identified in an affected family member, prenatal and preimplantation
      genetic testing are possible.
    explanation: >-
      What identifying the familial variant enables. Indirect: GeneReviews
      guidance for Stickler syndrome across all six genes.
treatments:
- name: Prophylactic Retinal Laser Therapy
  therapeutic_modality: DEVICE
  description: >-
    Laser retinopexy to reduce the risk of retinal detachment, applied before a
    detachment occurs rather than after. GeneReviews lists it for Stickler
    syndrome generally, and it is the intervention that makes early diagnosis of
    this variant worth making. Note the strength of the underlying evidence is
    not established here - the guidance is a management recommendation for
    Stickler syndrome, and no controlled trial restricted to the ocular-only
    variant is cited in this entry.
  treatment_term:
    preferred_term: laser retinopexy
    term:
      id: NCIT:C15466
      label: Laser Therapy
  target_mechanisms:
  - target: Retinal Tear and Rhegmatogenous Detachment
    description: >-
      Directed at the tear-to-detachment step, not at the collagen lesion.
      Nothing in this entry claims an effect on the vitreous phenotype or on the
      underlying isoform deficit.
    evidence:
    - reference: PMID:20301479
      reference_title: Stickler Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        laser therapy for prevention of retinal detachment; education on risks
        and symptoms of retinal detachment; correction of refractive errors with
        spectacles
      explanation: >-
        Laser therapy given as prevention of retinal detachment. Indirect:
        GeneReviews guidance for Stickler syndrome across all six genes rather
        than a trial in this variant.
  evidence:
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      laser therapy for prevention of retinal detachment; education on risks and
      symptoms of retinal detachment; correction of refractive errors with
      spectacles
    explanation: >-
      The recommendation itself, alongside the patient education and refractive
      correction that accompany it. Indirect: gene-agnostic Stickler syndrome
      guidance.
- name: Lifelong Vitreoretinal Surveillance
  therapeutic_modality: OTHER
  description: >-
    Annual examination by a vitreoretinal specialist, starting in childhood
    because 70 percent of detachments in the largest ocular-only pedigree
    occurred between 4 and 18 years of age. At-risk relatives should be
    identified and brought into surveillance rather than waiting for symptoms.
    This is where the entity's clinical distinctiveness lives - the audiological,
    craniofacial and orthopaedic surveillance that classic type 1 Stickler
    syndrome requires does not apply.
  treatment_term:
    preferred_term: eye examination
    term:
      id: NCIT:C38060
      label: Eye Examination
  evidence:
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Annual examination by a vitreoretinal specialist
    explanation: >-
      The surveillance interval and specialty. Indirect: gene-agnostic Stickler
      syndrome guidance.
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      It is appropriate to determine which family members at risk have Stickler
      syndrome and thus warrant ongoing surveillance and possible treatment to
      prevent retinal detachment.
    explanation: >-
      The recommendation to identify and follow at-risk relatives, which is what
      makes confirming the familial variant clinically consequential. Indirect:
      gene-agnostic Stickler syndrome guidance.
- name: Vitreoretinal Surgery for Established Detachment
  therapeutic_modality: SURGERY
  description: >-
    Surgical repair once a detachment has occurred. Curated because it is what
    happens to the majority of affected individuals in the reported pedigrees,
    but note that no evidence in this entry establishes outcomes of surgery in
    this variant specifically, and giant retinal tear detachments are
    technically difficult.
  treatment_term:
    preferred_term: vitrectomy
    term:
      id: NCIT:C50837
      label: Vitrectomy
  target_mechanisms:
  - target: Rhegmatogenous Retinal Detachment
    description: >-
      Directed at the established detachment. This is rescue, not prevention,
      and does not act on any node upstream of it.
    evidence:
    - reference: PMID:12429250
      reference_title: "Radial perivascular retinal degeneration: a key to the clinical diagnosis of an ocular variant of Stickler syndrome with minimal or no systemic manifestations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        The predominant ocular findings are a congenitally abnormal vitreous and
        an acquired radial perivascular retinal degeneration that may lead to
        complicated childhood and adult retinal detachment.
      explanation: >-
        Establishes that the detachments arising in this entity are complicated
        ones, which is the surgical problem this treatment addresses. Indirect:
        the source describes the detachment, not its surgical management.
- name: Avoidance of Contact Sports
  therapeutic_modality: BEHAVIORAL
  description: >-
    Avoiding activities that risk traumatic retinal detachment. A low-cost
    intervention with a large potential consequence in a population already at
    high baseline risk, and one that requires the diagnosis to have been made.
  treatment_term:
    preferred_term: behavioral counseling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  evidence:
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Activities such as contact sports that may lead to traumatic retinal
      detachment.
    explanation: >-
      The agents and circumstances GeneReviews advises avoiding. Indirect:
      gene-agnostic Stickler syndrome guidance.
- name: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  description: >-
    Autosomal dominant transmission with a 50 percent risk to each child, and
    predictive testing available once the familial variant is known. The
    counselling content differs from classic type 1 Stickler syndrome - what is
    being transmitted is a blinding eye risk without the systemic burden - and
    the evidence for that difference is the genotype-phenotype correlation in
    the `genetic:` block above.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Each child of an individual with autosomal dominant Stickler syndrome has a
      50% chance of inheriting the pathogenic variant.
    explanation: >-
      The transmission risk. Indirect: gene-agnostic Stickler syndrome guidance.
  - reference: PMID:10729292
    reference_title: "COL2A1 exon 2 mutations: relevance to the Stickler and Wagner syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      This has important implications for counselling patients with regard to the
      development of systemic complications.
    explanation: >-
      The authors' own statement that the exon 2 correlation changes what should
      be said in a counselling conversation, which is the reason this treatment
      is curated separately rather than folded into surveillance.
clinical_trials:
- name: NCT07146516
  phase: NOT_APPLICABLE
  status: RECRUITING
  description: >-
    Prospective, historically controlled study of ora secunda cerclage laser
    retinopexy to prevent retinal detachment in Stickler syndrome, in children
    and adults. It enrols Stickler syndrome generally rather than exon 2
    disease, so it tests the prophylaxis this entry recommends at the scope of
    the whole syndrome.
  target_phenotypes:
  - preferred_term: Rhegmatogenous retinal detachment
    term:
      id: HP:0012230
      label: Rhegmatogenous retinal detachment
  evidence:
  - reference: clinicaltrials:NCT07146516
    reference_title: "Ora Secunda Cerclage Laser Retinopexy To Prevent Retinal Detachment In Stickler Syndrome (OSC/SS): A Prospective Historically Controlled Study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The goal of this clinical trial is to prospectively document to what
      extent the OSC/SS prophylactic laser retinopexy procedure works to prevent
      retinal detachment in SS in children and adults.
    explanation: >-
      The trial's stated aim, prophylactic laser retinopexy against retinal
      detachment in Stickler syndrome.
- name: NCT04465188
  phase: PHASE_II
  status: WITHDRAWN
  description: >-
    Randomized trial of prophylactic scleral buckling of the fellow eye in
    genetically confirmed Stickler syndrome, withdrawn before enrolling anyone.
    Like the laser study it is not restricted to exon 2 disease. It tested
    surgical rather than laser prophylaxis, and because it enrolled no one it
    produced no result.
  target_phenotypes:
  - preferred_term: Rhegmatogenous retinal detachment
    term:
      id: HP:0012230
      label: Rhegmatogenous retinal detachment
  evidence:
  - reference: clinicaltrials:NCT04465188
    reference_title: "Scleral Buckling for Retinal Detachment Prevention in Genetically Confirmed Stickler Syndrome : a Randomized Controlled Trial"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The purpose of this study is to determine whether a scleral buckling
      surgical procedure performed on fellow eyes of patients with genetically
      confirmed Stickler syndrome can prevent the occurrence retinal detachment
      and/or severe vision loss of the study eye.
    explanation: >-
      The trial's stated aim, prophylactic scleral buckling in genetically
      confirmed Stickler syndrome.
prevalence:
- population: Global
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No prevalence or incidence has been estimated for this variant. The
    published series are a 100-individual eight-generation pedigree
    (PMID:12429250), three patients in two exon 2 families (PMID:17721977),
    three exon 2 families within an eight-family linkage series (PMID:10729292),
    one Australian pedigree (PMID:22574936) and one two-patient Chinese family
    (PMID:41050055). The Stickler-syndrome prevalence figures on the
    `Stickler_Syndrome_Type_1` entry cover the whole type 1 entity and are
    deliberately not imported here, because what fraction of type 1 Stickler
    syndrome is ocular-only is exactly what has not been measured. The one
    number that bears on it is indirect - three of eight linked families in one
    vitreoretinal-service series had exon 2 alleles - and comes from a service
    that ascertains through retinal detachment, so it cannot be read as a
    population fraction.
  evidence:
  - reference: PMID:10729292
    reference_title: "COL2A1 exon 2 mutations: relevance to the Stickler and Wagner syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Three of the families exhibited a predominantly ocular phenotype with
      minimal or absent systemic involvement and were found to have mutations in
      exon 2 of COL2A1.
    explanation: >-
      The three-of-eight figure this block discusses, with the ascertainment
      caveat stated there. Indirect: a case-series composition, not an
      epidemiological estimate.
differential_diagnoses:
- name: Stickler syndrome type 1 (classic, systemic)
  disease_term:
    preferred_term: Stickler syndrome type 1
    term:
      id: MONDO:0007160
      label: Stickler syndrome type 1
  description: >-
    The same gene and the same eye. The parent entity is curated here as
    `Stickler_Syndrome_Type_1`. The ocular findings are identical; what separates
    them is everything outside the eye, and the allele's position.
  distinguishing_features:
  - >-
      Classic type 1 Stickler syndrome adds sensorineural and conductive hearing
      loss, midfacial underdevelopment, cleft palate or Pierre Robin sequence,
      and early-onset degenerative joint disease.
  - >-
      In the series that defined the distinction, five pedigrees with an
      identical ocular phenotype plus orofacial, auditory and articular
      involvement carried alleles outside exon 2, while the three predominantly
      ocular pedigrees carried exon 2 alleles.
  - >-
      Surveillance differs - audiological, craniofacial and orthopaedic follow-up
      is required in the classic form and not in this one, while vitreoretinal
      surveillance is identical.
  evidence:
  - reference: PMID:10729292
    reference_title: "COL2A1 exon 2 mutations: relevance to the Stickler and Wagner syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Five other pedigrees with an identical ocular phenotype plus orofacial,
      auditory, and articular involvement had mutations in others regions of the
      COL2A1 gene.
    explanation: >-
      The contrast arm within the defining study - same eye, systemic features
      added, alleles elsewhere in the gene.
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Stickler syndrome is a connective tissue disorder that can include ocular
      findings of myopia, cataract, and retinal detachment; hearing loss that is
      both conductive and sensorineural; midfacial underdevelopment and cleft
      palate (either alone or as part of the Pierre Robin sequence); and
      early-onset degenerative joint disease.
    explanation: >-
      The systemic features whose absence defines this entity. Indirect:
      GeneReviews describes Stickler syndrome across all six genes.
- name: Wagner syndrome and erosive vitreoretinopathy
  description: >-
    The classical differential, and the one the defining paper was written
    partly to address. Both are inherited vitreoretinopathies without systemic
    features, so genotype is not available to distinguish them at the bedside -
    the fundus is.
  distinguishing_features:
  - >-
      None of the COL2A1-linked pedigrees showed the lenticular, retinal pigment
      epithelial or choroidal changes characteristic of Wagner syndrome.
  - >-
      Wagner syndrome maps to 5q14.3, not to the COL2A1 locus.
  evidence:
  - reference: PMID:10729292
    reference_title: "COL2A1 exon 2 mutations: relevance to the Stickler and Wagner syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      None of the pedigrees exhibited the characteristic lenticular, retinal
      pigment epithelial, or choroidal changes seen in Wagner syndrome.
    explanation: >-
      The fundus findings whose absence excludes Wagner syndrome in these
      families.
  - reference: PMID:12939326
    reference_title: Autosomal dominant rhegmatogenous retinal detachment associated with an Arg453Ter mutation in the COL2A1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Fifteen individuals from family A and 12 individuals from family B showed
      RRD or retinal tears with minimal (family A) or no (family B) systemic
      characteristics of Stickler syndrome and no ocular features of Wagner
      disease or erosive vitreoretinopathy.
    explanation: >-
      An independent study separating the two entities on ocular features in
      families that had already been linked to COL2A1.
- name: Familial exudative vitreoretinopathy
  description: >-
    Another inherited cause of familial retinal detachment with no systemic
    features. The two were separated genetically within a single study of two
    Australian pedigrees - one carried a COL2A1 exon 2 allele, the other an FZD4
    allele.
  distinguishing_features:
  - >-
      Familial exudative vitreoretinopathy has peripheral retinal avascularity
      and exudation rather than the membranous vitreous and radial perivascular
      degeneration of this entity.
  - >-
      The causative gene differs - FZD4 rather than COL2A1 - so sequencing
      separates them definitively once one is suspected.
  evidence:
  - reference: PMID:22574936
    reference_title: Familial retinal detachment associated with COL2A1 exon 2 and FZD4 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      All affected members of the familial exudative vitreoretinopathy pedigree
      carried a 957delG FZD4 mutation.
    explanation: >-
      Two clinically similar familial retinal detachment pedigrees separated by
      genotype in one study.
discussions:
- discussion_id: ostl1_non_exon2_alleles
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do some COL2A1 alleles outside the alternatively spliced exon 2 produce
    a predominantly ocular phenotype, when the isoform model predicts they
    should not?
  attaches_to:
  - pathophysiology#Isoform-Restricted Loss of Type IIA Procollagen
  - genetic#COL2A1
  rationale: >-
    The exon 2 isoform model is the reason this entity exists as a mechanistic
    concept, and three independent reports do not fit it. An Arg453Ter allele in
    exon 30 - previously reported in classic Stickler syndrome - segregated with
    predominantly ocular disease in one family, which the reporting authors
    themselves flagged as surprising. A GC donor splice site in intron 51 was
    shown by splicing reporter construct to splice normally, and the authors
    attribute the ocular-predominant phenotype in that family to it. A c.3534dupT
    frameshift in exon 50 was found in a two-generation family with the ocular
    phenotype. None of these removes only the IIA isoform, so either the model is
    incomplete, or modifier loci or leaky splicing produce the same tissue
    restriction by a different route, or the phenotype boundary is softer than
    the label implies - the Arg453Ter family had minimal rather than no systemic
    features, and the exon 50 family had scoliosis and mild hearing loss. This
    matters practically as well as mechanistically, because it means an allele's
    position cannot be used to predict whether a newly diagnosed family needs
    systemic surveillance.
  evidence:
  - reference: PMID:12939326
    reference_title: Autosomal dominant rhegmatogenous retinal detachment associated with an Arg453Ter mutation in the COL2A1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In one of these families an Arg453Ter mutation was identified, which is
      surprising, because all predominantly ocular Stickler syndrome cases until
      now have been associated with protein-truncating mutations in exon 2, an
      exon subject to alternative splicing.
    explanation: >-
      The authors stating the discrepancy in their own words, and confirming that
      the exon 2 rule was the expectation at the time.
  - reference: PMID:16752401
    reference_title: "High efficiency of mutation detection in type 1 stickler syndrome using a two-stage approach: vitreoretinal assessment coupled with exon sequencing for screening COL2A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We also demonstrate that the predominantly ocular form of type 1 Stickler
      syndrome is not confined to mutations in the alternatively spliced exon 2.
    explanation: >-
      An explicit demonstration that the exon 2 restriction is not a rule, from
      the largest mutation-screening series.
  - reference: PMID:16752401
    reference_title: "High efficiency of mutation detection in type 1 stickler syndrome using a two-stage approach: vitreoretinal assessment coupled with exon sequencing for screening COL2A1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Using splicing reporter constructs we demonstrate that a mutant GC donor
      splice site in intron 51 can be spliced normally; this contributed to the
      predominantly ocular phenotype in the family in which it occurred.
    explanation: >-
      A worked non-exon-2 mechanism - a splice site that still functions - which
      is the best available hint at what the alternative routes look like.
  - reference: PMID:41050055
    reference_title: A novel COL2A1 mutation in a Chinese family with predominantly ocular Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      A novel likely pathogenic (LP) frameshift mutation c.3534dupT
      (p.Gly1179Trpfs*74) in exon 50 of the COL2A1 was identified in both
      affected individuals and absent in unaffected family members.
    explanation: >-
      The most recent non-exon-2 allele, with segregation in the family.
  proposed_experiments:
  - experiment_id: ostl1_isoform_ratio_across_alleles
    name: IIA-to-IIB transcript ratio across exon 2 and non-exon-2 alleles
    description: >-
      Measure the allele-specific IIA and IIB transcript ratio in
      patient-derived cells carrying exon 2 alleles, the intron 51 splice-site
      allele, the exon 50 frameshift and Arg453Ter, to test whether the
      non-exon-2 alleles converge on the same isoform imbalance by a different
      route or produce the phenotype without one.
    would_support:
    - pathophysiology#Isoform-Restricted Loss of Type IIA Procollagen
  - experiment_id: ostl1_systemic_phenotyping_by_allele
    name: Prospective systemic phenotyping stratified by allele position
    description: >-
      Apply uniform audiological, craniofacial and orthopaedic assessment to
      individuals with exon 2 and non-exon-2 COL2A1 alleles who present with the
      ocular phenotype, to establish whether the systemic features are genuinely
      absent in the exon 2 group or merely not looked for, and whether allele
      position predicts what surveillance a family needs.
    would_refute:
    - pathophysiology#Preserved Type IIB Procollagen in Adult Cartilage
- discussion_id: ostl1_extraocular_residue
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the small residue of extraocular findings in ocular-only families
    coincidental, or a real low-grade cartilage phenotype that the isoform model
    predicts should not exist?
  attaches_to:
  - pathophysiology#Preserved Type IIB Procollagen in Adult Cartilage
  rationale: >-
    The isoform model predicts that adult cartilage is spared, and the clinical
    labels say nonsyndromic. Neither is quite what the data show. The largest
    pedigree found extraocular manifestations characteristic of Stickler syndrome
    in 4 of 100 affected individuals, and the most recently reported family had
    scoliosis in the proband and mild bilateral hearing loss in the proband's
    mother. Four percent in a 100-person pedigree is not obviously distinguishable
    from population background, and a two-person family cannot settle it either
    way. But the model makes a sharp prediction about a tissue, so the residue is
    worth resolving rather than absorbing into the word "minimal" - the answer
    determines whether IIA has a real developmental role in cartilage that the
    adult IIB switch does not fully cover, and whether these families need any
    systemic surveillance at all.
  evidence:
  - reference: PMID:12429250
    reference_title: "Radial perivascular retinal degeneration: a key to the clinical diagnosis of an ocular variant of Stickler syndrome with minimal or no systemic manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Extraocular manifestations, characteristic for Stickler syndrome, were
      detected in only four of 100 (4%) affected individuals.
    explanation: >-
      The residue this gap is about, with its denominator.
  - reference: PMID:41050055
    reference_title: A novel COL2A1 mutation in a Chinese family with predominantly ocular Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In terms of extraocular findings, the proband presented with scoliosis, and
      the proband's mother had mild hearing loss in both ears.
    explanation: >-
      The same residue in an independent family, and the reason the entry does
      not describe the systemic phenotype as absent.
  proposed_experiments:
  - experiment_id: ostl1_cartilage_iia_developmental_role
    name: Developmental requirement for type IIA procollagen in cartilage
    description: >-
      Determine whether chondroprogenitor-stage type IIA procollagen, which is
      expressed before the adult IIB switch, is required for normal cartilage
      and skeletal development, using an exon 2 specific knockout rather than a
      whole-gene null so that the IIB isoform is preserved.
    would_support:
    - pathophysiology#Preserved Type IIB Procollagen in Adult Cartilage

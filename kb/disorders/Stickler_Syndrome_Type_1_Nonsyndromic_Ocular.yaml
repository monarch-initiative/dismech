    floor for lifetime risk rather than an estimate of it.
  evidence:
  - reference: PMID:12429250
    reference_title: "Radial perivascular retinal degeneration: a key to the clinical diagnosis of an ocular variant of Stickler syndrome with minimal or no systemic manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The ocular findings, frequently bilateral, consisted of radial perivascular

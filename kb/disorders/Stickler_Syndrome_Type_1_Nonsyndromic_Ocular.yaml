    100 of 100 affected individuals in the same single pedigree
    (PMID:12429250); the single-family, single-allele caveat in the entry notes
    applies. Bound to the general HP term for retinal degeneration because HPO
    has no radial perivascular child term; the specific pattern is carried in
    `preferred_term`, which is the convention when no narrower ontology term
    exists.
  evidence:
  - reference: PMID:12429250
    reference_title: "Radial perivascular retinal degeneration: a key to the clinical diagnosis of an ocular variant of Stickler syndrome with minimal or no systemic manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-

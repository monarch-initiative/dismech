  - target: Impaired Proplatelet Formation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Shows a requirement for TPM4 in the final fragmentation of anuclear
      megakaryocyte fragments into platelets in the pulmonary vasculature.
    limitations: >-
      A complete knockout rather than a heterozygous patient genotype, and an

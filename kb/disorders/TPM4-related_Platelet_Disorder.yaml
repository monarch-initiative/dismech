    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Reproduces the macrothrombocytopenia with normal platelet lifespan,
      locating the low count in production rather than clearance.
    readouts:
    - name: Platelet count in Tpm4 mutant mice
      target: Reduced Platelet Output with Enlarged Platelets
      direction: DECREASED
      interpretation: Mild in heterozygotes and about 50% reduced in homozygotes.
      evidence:
      - reference: PMID:28134622
        reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.

  evidence:
  - reference: PMID:28134622
    reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ShRNA_TPM4B and shRNA_TPM4E, which knocked down mRNA levels to approximately 20% and 8%, respectively, reduced proplatelet formation by approximately 40% and 14%."
    explanation: Establishes the knockdown system and its readout.
  modeled_mechanisms:
  - target: Impaired Proplatelet Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces reduced proplatelet formation in human megakaryocytes with
      maturation preserved, and shows that the effect scales with TPM4 level.
    limitations: >-
      Knockdown lowers TPM4 to 8 to 20% of normal, far below the roughly 50%
      level in heterozygous patients, and proplatelet formation in static
      culture lacks the marrow sinusoidal environment and the release and size
      of platelets were not measured.
    readouts:
    - name: Proportion of proplatelet-forming megakaryocytes
      target: Impaired Proplatelet Formation
      direction: DECREASED
      interpretation: Fewer megakaryocytes form proplatelets as TPM4 falls.
      evidence:
      - reference: PMID:28134622
        reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "While megakaryocyte proliferation and maturation were unaffected by transduction with shRNAs targeting TPM4 (Supplemental Figure 7A), the level of proplatelet formation was reduced in comparison with the nontargeting control."
        explanation: The proplatelet-formation measurement in knocked-down human megakaryocytes.
animal_models:
- name: Tpm4 Plt53 ENU mutant mouse
  species: Mouse
  genotype: Tpm4 Plt53 donor splice-site mutation in exon 7 (heterozygous and homozygous)
  publication: PMID:28134622
  genes:
  - preferred_term: TPM4
    term:
      id: hgnc:12013
      label: TPM4
  description: >-
    Recovered from an ENU mutagenesis screen for dominant thrombocytopenia. The
    splice-site mutation retains part of intron 7 and truncates the protein,
    abolishing full-length TPM4 in homozygotes. Heterozygotes have mild and
    homozygotes more severe macrothrombocytopenia, with other blood counts and
    organs essentially normal. A targeted Tpm4 knockout reproduced the same
    dose-dependent phenotype on the C57BL/6 background.
  evidence:
  - reference: PMID:28134622
    reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "N-Ethyl-N-nitrosourea-induced (ENU-induced) missense mutations in Tpm4 or targeted inactivation of the Tpm4 locus led to gene dosage-dependent macrothrombocytopenia in mice."
    explanation: Establishes the mouse models and their dose-dependent macrothrombocytopenia.
  modeled_mechanisms:
  - target: Impaired Proplatelet Formation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Heterozygous mice model the human genotype and reproduce reduced
      proplatelet formation with enlarged proplatelet tips, in a gene
      dosage-dependent way.
    limitations: >-
      The mouse allele is a splice-site mutation, not one of the human nonsense
      alleles, and mice express only the TPM4.2 isoform whereas humans also
      express TPM4.1. Mutant mouse bone marrow has increased megakaryocyte
      numbers, which has not been examined in patients.
    readouts:
    - name: Proplatelet formation by fetal liver-derived megakaryocytes
      target: Impaired Proplatelet Formation
      direction: DECREASED
      interpretation: Reduced by about 20% in heterozygous and 40% in homozygous megakaryocytes.
      evidence:
      - reference: PMID:28134622
        reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Relative to the WT, proplatelet formation was reduced by approximately 40% in fetal liver–derived Tpm4Plt53/Plt53 megakaryocytes and by approximately 20% in Tpm4Plt53/+ cells (Figure 8E)."
        explanation: Dose-dependent proplatelet-formation readout.
  - target: Reduced Platelet Output with Enlarged Platelets

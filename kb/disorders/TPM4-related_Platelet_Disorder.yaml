diagnosis:
- name: Full blood count with peripheral blood film
  description: >-
    A lifelong low platelet count with raised mean platelet volume and large
    and giant platelets on the film, with normal leukocyte and erythrocyte
    counts, prompts consideration of an inherited macrothrombocytopenia.
  evidence:
  - reference: PMID:35170221
    reference_title: A novel nonsense variant in TPM4 caused dominant macrothrombocytopenia, mild bleeding tendency and disrupted cytoskeleton remodeling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory phenotyping consisted of blood cells count, blood film, platelet aggregation and flow cytometric analysis."
    explanation: The laboratory work-up used to characterize the TPM4 family.
- name: Platelet function and spreading studies
  description: >-
    Light-transmission aggregometry and flow cytometric secretion assays are
    usually normal in truncating-allele carriers but abnormal with the missense
    variants. Spreading on fibrinogen after activation and thrombus formation
    under flow are the assays in which the truncating-allele defect has been
    shown; they are research rather than routine tests.
  evidence:
  - reference: PMID:34758189
    reference_title: Rare missense variants in Tropomyosin-4 (TPM4) are associated with platelet dysfunction, cytoskeletal defects, and excessive bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deep platelet phenotyping was performed using platelet spreading analysis, transmission electron microscopy, immunofluorescence, and platelet function testing using lumiaggregometry and flow cytometry."
    explanation: The platelet phenotyping methods used to characterize TPM4 variant carriers.
- name: Genetic testing for TPM4 variants
  description: >-
    Confirmatory diagnosis by targeted inherited platelet disorder gene panel,
    exome or genome sequencing. TPM4 was added to the ISTH Tier 1 diagnostic
    gene list for inherited bleeding, thrombotic and platelet disorders.
  evidence:
  - reference: PMID:34758189
    reference_title: Rare missense variants in Tropomyosin-4 (TPM4) are associated with platelet dysfunction, cytoskeletal defects, and excessive bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic and functional TPM4 defects are reported making TPM4 a diagnostic grade tier 1 gene and highlights the importance of including TPM4 in diagnostic genetic screening for patients with significant bleeding and undiagnosed platelet disorders, particularly for those with a normal platelet count."
    explanation: Recommends including TPM4 in diagnostic genetic screening.
  - reference: PMID:35170221
    reference_title: A novel nonsense variant in TPM4 caused dominant macrothrombocytopenia, mild bleeding tendency and disrupted cytoskeleton remodeling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acknowledging our new family with TPM4‐RT prompted the ISTH SSC‐GinTH to include TPM4 in the Tier1 genes for Inherited bleeding, thrombotic, and platelet disorders (BTPD)."
    explanation: Records the Tier 1 diagnostic gene status.
  - reference: PMID:31249973
    reference_title: Use of Targeted High-Throughput Sequencing for Genetic Classification of Patients with Bleeding Diathesis and Suspected Platelet Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 40% of 35 patients analyzed, we were able to finally detect 15 variants, eight of which were novel, in 11 genes, ACTN1 , AP3B1 , GFI1B , HPS1 , HPS4 , HPS6 , MPL , MYH9 , TBXA2R , TPM4 , and TUBB1 , and classified them according to current guidelines."
    explanation: TPM4 variants are detected by targeted inherited platelet disorder gene panels.
differential_diagnoses:
- name: Other autosomal dominant macrothrombocytopenias caused by cytoskeletal proteins
  description: >-
    MYH9-related disease, ACTN1-related thrombocytopenia, TUBB1-related
    macrothrombocytopenia and FLNA-related disorders share a dominant
    macrothrombocytopenia from a defective megakaryocyte cytoskeleton.
    MYH9-related disease is distinguished by leukocyte inclusions and its
    extra-hematological complications; the others need genetic testing.
  distinguishing_features:
  - Leukocyte inclusions and extra-hematological features in MYH9-related disease
  - No extra-hematological features reported in TPM4-related disorder
  evidence:
  - reference: PMID:28134622
    reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the gene encoding NMMHC-IIa (MYH9) in cases with MYH9-related disorders cause autosomal dominant macrothrombocytopenia and bleeding associated with other complex pathobiologies (42)."
    explanation: The discovery paper places MYH9-related disorders as the comparator dominant macrothrombocytopenia with additional pathology.
  - reference: PMID:35170221
    reference_title: A novel nonsense variant in TPM4 caused dominant macrothrombocytopenia, mild bleeding tendency and disrupted cytoskeleton remodeling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variably mild thrombocytopenia with minor, if any, associated bleeding tendency also happens in other inherited thrombocytopenias caused by mutations in structural platelet proteins."
    explanation: Names the overlapping class of structural-protein inherited thrombocytopenias.
- name: Immune thrombocytopenia
  description: >-
    A lifelong stable low platelet count can be mistaken for immune
    thrombocytopenia. A family history of the same blood picture, enlarged
    platelets and normal platelet survival point to a production defect.
  distinguishing_features:
  - Lifelong course with affected first-degree relatives
  - Normal platelet lifespan rather than accelerated clearance
  evidence:
  - reference: PMID:28134622
    reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "No change in the kinetics of clearance or ultimate lifespan was observed, indicating that lack of functional TPM4 did not affect platelet turnover (Figure 6A)."
    explanation: >-
      Normal platelet turnover in Tpm4-deficient mice distinguishes the
      disorder mechanistically from a destructive thrombocytopenia. Marked
      INDIRECT because platelet survival has not been measured in patients.
treatments:
- name: Genetic diagnosis and counselling
  description: >-
    Establishing the molecular diagnosis explains a lifelong low platelet count
    in the patient and relatives, avoids treatment for presumed immune
    thrombocytopenia, and informs counselling about the 50% recurrence risk of
    an autosomal dominant condition.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  target_phenotypes:
  - preferred_term: Macrothrombocytopenia
    term:
      id: HP:0040185
      label: Macrothrombocytopenia
  evidence:
  - reference: PMID:31249973
    reference_title: Use of Targeted High-Throughput Sequencing for Genetic Classification of Patients with Bleeding Diathesis and Suspected Platelet Disorder.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identification of the defective cellular pathway is an important criterion for stratifying the patient's individual risk profile and for choosing personalized therapeutic options."
    explanation: >-
      A statement about inherited platelet disorders in general, not TPM4
      specifically, hence INDIRECT.

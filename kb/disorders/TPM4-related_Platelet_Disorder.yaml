name: TPM4-related Platelet Disorder
creation_date: "2026-10-30T12:00:00Z"
category: Mendelian
description: >-
  TPM4-related platelet disorder is a rare autosomal dominant inherited platelet
  disorder caused by heterozygous variants in TPM4, which encodes tropomyosin 4,
  a non-muscle tropomyosin that forms copolymers with actin filaments and
  regulates which other actin-binding proteins and myosin motors gain access to
  them. Expression of TPM4 rises in late megakaryopoiesis, and the protein
  colocalizes with filamentous actin in proplatelet shafts, swellings and tips.

  The truncating alleles described so far (p.Arg69* in two British pedigrees and
  p.Gln108* in a Spanish pedigree) roughly halve platelet TPM4 and cause a
  lifelong, usually mild macrothrombocytopenia: fewer platelets, a raised mean
  platelet volume and marked heterogeneity of platelet size, with a normal
  leukocyte and erythrocyte count. The defect is one of platelet production
  rather than survival. Lowering TPM4 in human or mouse megakaryocytes reduces
  proplatelet formation in proportion to the amount of TPM4 left, the few
  proplatelets that form carry abnormally large tips, and platelet lifespan in
  Tpm4-deficient mice is normal. Platelet function is mildly affected: spreading
  is delayed or impaired and thrombus formation on collagen under flow is
  reduced, although aggregation and granule secretion to standard agonists are
  normal in truncating-allele carriers.

  Bleeding is mild and variable, ranging from none despite surgery and dental
  extraction to bruising, gum bleeding and menorrhagia. Two missense variants
  (p.Arg182Cys and p.Ala183Val) have been reported with a different picture,
  normal or near-normal platelet counts, reduced granule secretion and
  aggregation, and more significant bleeding; whether they act by a mechanism
  other than haploinsufficiency is unresolved. ClinGen classifies the
  TPM4-disease relationship as Moderate. The disorder is catalogued by OMIM as
  bleeding disorder, platelet-type, 25 (BDPLT25).

pathophysiology:
- name: Heterozygous TPM4 Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    The initiating lesion in the truncating-allele families is a heterozygous
    premature stop codon in TPM4. Tropomyosins act as dimers whose N- and
    C-terminal overlap is needed for filament formation, so a truncated product
    cannot copolymerize with actin, and patient platelets carry roughly half the
    normal amount of TPM4.2 mRNA and protein, which is a haploinsufficiency
    lesion. The mouse Plt53 splice allele and a targeted knockout give the same
    phenotype in a dose-dependent way. Whether the two missense alleles also act
    through reduced dosage, or by a dominant-negative effect, is not settled.
  genes:
  - preferred_term: TPM4
    term:
      id: hgnc:12013
      label: TPM4
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Heterozygous germline nonsense variants (p.Arg69*, p.Gln108*) with reduced
      TPM4 transcript and protein in patient platelets. The missense variants
      p.Arg182Cys and p.Ala183Val are not covered by this functional-impact
      call.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  molecular_functions:
  - preferred_term: actin filament binding
    modifier: DECREASED
    term:
      id: GO:0051015
      label: actin filament binding
  evidence:
  - reference: PMID:28134622
    reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TPM4.2 mRNA levels were reduced to 59% and 78% of the control in the affected cases 1-II-5 and 1-III-7, respectively (Figure 2C), and a corresponding approximately 50% reduction in the expression of TPM4.2 protein was observed"
    explanation: Measures reduced TPM4 transcript and protein in carriers of the truncating allele.
  - reference: PMID:35170221
    reference_title: A novel nonsense variant in TPM4 caused dominant macrothrombocytopenia, mild bleeding tendency and disrupted cytoskeleton remodeling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mainly cause haploinsufficiency, which is suggested by a reduction in tropomyosin‐4 levels (Figure 2D)"
    explanation: The authors' reading of the nonsense alleles as haploinsufficient, based on reduced platelet TPM4.
  - reference: PMID:28134622
    reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Given that the overlap of N- and C-termini of TPM dimers is essential for filament formation (23), these data indicated that the Plt53 allele of Tpm4 represents a complete loss of the protein’s canonical function."
    explanation: Explains why a truncated tropomyosin loses its actin-filament function, shown for the mouse truncating allele.
  - reference: PMID:25964668
    reference_title: Regulation of actin polymerization by tropomodulin-3 controls megakaryocyte actin organization and platelet biogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "confirm that TM4 (Tpm4.2, encoded by the Tpm4/δTm gene41) is the predominant TM in MKs and platelets"
    explanation: Tpm4.2 is the main tropomyosin of megakaryocytes and platelets, which is why losing half of it matters in this lineage.
  - reference: PMID:28216317
    reference_title: Tropomyosin Isoforms Specify Functionally Distinct Actin Filament Populations In Vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "sfGFP-Tpm4.2 bound only to actin filament bundles, induced either by methylcellulose or myosin II, with high affinity"
    explanation: >-
      Reconstitution evidence for the actin filament binding activity of
      Tpm4.2, the molecular function reduced by the lesion. It binds bundled
      rather than single filaments in this assay.
  downstream:
  - target: Impaired Proplatelet Formation
    causal_link_type: DIRECT
    description: >-
      TPM4 level is rate-limiting for proplatelet formation in human and mouse
      megakaryocytes.
    evidence:
    - reference: PMID:28134622
      reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "demonstrating that the level of TPM4 is rate-limiting for platelet formation"
      explanation: Dose-response between TPM4 knockdown and proplatelet formation in cultured human megakaryocytes.
  - target: Platelet Cytoskeletal Remodeling Defect
    causal_link_type: DIRECT
    description: >-
      Reduced TPM4 in the circulating platelet impairs its activation-induced
      cytoskeletal remodeling.
    evidence:
    - reference: PMID:35170221
      reference_title: A novel nonsense variant in TPM4 caused dominant macrothrombocytopenia, mild bleeding tendency and disrupted cytoskeleton remodeling.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This variant led to impairment of platelet spreading capacity after stimulation with TRAP-6 and CRP, delocalization of TPM4 in activated platelets, and significantly reduced TPM4 levels in platelet lysates."
      explanation: Links the nonsense allele to reduced platelet TPM4 and impaired spreading in the same patients.
- name: Impaired Proplatelet Formation
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    The terminal step of platelet biogenesis is where TPM4 deficiency acts.
    Megakaryocyte numbers, proliferation and maturation are preserved, and in
    mice megakaryocytes are actually more numerous, but proplatelet formation
    falls by about 20% in heterozygous and 40% in homozygous mouse
    megakaryocytes and in proportion to residual TPM4 in knocked-down human
    megakaryocytes. Mutant megakaryocytes extend few or no proplatelet branches,
    and the tips that do form are enlarged. Phosphorylated (inactive) cofilin is
    reduced in mutant cells, consistent with tropomyosin normally shielding
    actin filaments from cofilin severing, but which cytoskeletal step is
    rate-limiting has not been shown. An ex vivo lung perfusion study further
    suggests TPM4 is needed for the final fragmentation of large anuclear
    megakaryocyte fragments into platelets.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  biological_processes:
  - preferred_term: platelet formation
    modifier: DECREASED
    term:
      id: GO:0030220
      label: platelet formation
  - preferred_term: actin cytoskeleton organization
    modifier: ABNORMAL
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
  evidence:
  - reference: PMID:28134622
    reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "While megakaryocyte proliferation and maturation were unaffected by transduction with shRNAs targeting TPM4 (Supplemental Figure 7A), the level of proplatelet formation was reduced in comparison with the nontargeting control."
    explanation: Places the defect at proplatelet formation in human megakaryocytes, with maturation preserved.
  - reference: PMID:28134622
    reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Relative to the WT, proplatelet formation was reduced by approximately 40% in fetal liver–derived Tpm4Plt53/Plt53 megakaryocytes and by approximately 20% in Tpm4Plt53/+ cells (Figure 8E)."
    explanation: Gene-dosage-dependent reduction of proplatelet formation in mouse megakaryocytes.
  - reference: PMID:28134622
    reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Time-lapse video microscopy indicated that, while the initial morphological changes associated with proplatelet formation took place in mutant cells, loss of TPM4 resulted in megakaryocytes with few or no branches"
    explanation: Describes the morphological form of the proplatelet defect.
  - reference: PMID:28134622
    reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "While ADF expression was unaltered in Tpm4 mutant mouse megakaryocytes and platelets (data not shown), the levels of phosphorylated (inactive) cofilin in Tpm4Plt53/Plt53 cells were significantly decreased (Figure 9, A and B)."
    explanation: Measured actin-regulatory change in TPM4-deficient megakaryocytes, the basis for the actin cytoskeleton annotation.
  - reference: PMID:37419900
    reference_title: Highly efficient platelet generation in lung vasculature reproduced by microfluidics.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The data suggest that TPM4 plays an essential role in the transformation of large (~10 µm diameter) anuclear MK fragments to platelets in the lung vasculature."
    explanation: Independent mouse evidence locating the TPM4 requirement at the final step of platelet generation.
  downstream:
  - target: Reduced Platelet Output with Enlarged Platelets
    causal_link_type: DIRECT
    description: >-
      Fewer proplatelet branches produce fewer platelets, and enlarged
      proplatelet tips give rise to larger platelets.
    evidence:
    - reference: PMID:28134622

- name: Mild Failure of Primary Hemostatic Plug Formation
  biological_scale: TISSUE
  role: central_effector
  conforms_to: "primary_hemostatic_plug_failure#Failure of Primary Hemostatic Plug Formation"
  description: >-
    The platelet mass formed at a site of injury is smaller and less effective.
    Blood from a patient carrying p.Arg69* formed fewer thrombi covering a
    smaller area on collagen under flow, the same defect was reproduced in
    Tpm4 mutant mice, and tail bleeding times were mildly prolonged. The
    defect is mild: standard platelet function tests were normal in the first
    propositus. Conformance to the primary hemostatic plug failure module is
    declared because a qualitative platelet defect is measured, not only a low
    count, but the route is a cytoskeletal one that sits outside the module's
    four named arms (adhesion receptor, activation and secretion, aggregation
    receptor, procoagulant response), except for the missense branch, which
    reaches it through secretion and aggregation.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: primary hemostasis
    modifier: DECREASED
    term:
      id: GO:0007599
      label: hemostasis
  evidence:
  - reference: PMID:28134622
    reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, when thrombus formation under flow ex vivo was examined, both the number of thrombi and the area covered were reduced in case 1-III-7 relative to the control (P < 0.001) (Figure 5, B and C)."
    explanation: Reduced thrombus formation under flow in blood from a patient.
  - reference: PMID:28134622
    reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Together, these results demonstrate that the hemostatic function of TPM4-deficient platelets is mildly compromised."
    explanation: The authors' conclusion from mouse thrombus formation and tail bleeding experiments.
  - reference: PMID:28134622
    reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since the platelet disorder associated with the TPM4 variant results in an unpredictable bleeding phenotype, these findings indicate that reduced levels of TPM4 result in a mild impairment of hemostasis."
    explanation: States that the hemostatic impairment is mild.
  downstream:
  - target: Abnormal bleeding
    causal_link_type: DIRECT
  - target: Gingival bleeding
    causal_link_type: DIRECT
  - target: Menorrhagia
    causal_link_type: DIRECT
phenotypes:
- name: Macrothrombocytopenia
  category: Hematologic
  description: >-
    Lifelong, usually mild reduction in platelet count with enlarged platelets.
    Reported counts in truncating-allele carriers were roughly 80 to 146 x 10^9
    per liter; one carrier had a count just within the normal range, and the
    missense-variant carriers have normal or only slightly reduced counts.
  phenotype_term:
    preferred_term: Macrothrombocytopenia
    term:
      id: HP:0040185
      label: Macrothrombocytopenia
  evidence:
  - reference: PMID:28134622
    reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This variant was absent from nearly 75,000 control DNA samples and segregated with large platelets and concomitant low platelet count (a phenotype termed macrothrombocytopenia) in the 2 pedigrees."
    explanation: Macrothrombocytopenia segregating with the truncating allele in both discovery pedigrees.
  - reference: PMID:35170221
    reference_title: A novel nonsense variant in TPM4 caused dominant macrothrombocytopenia, mild bleeding tendency and disrupted cytoskeleton remodeling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five family members displayed lifelong mild thrombocytopenia with a high number of enlarged platelets in blood film, and mild bleeding tendency."
    explanation: Independent family with lifelong mild macrothrombocytopenia.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This variant led to impairment of platelet spreading capacity after stimulation with TRAP-6 and CRP, delocalization of TPM4 in activated platelets, and significantly reduced TPM4 levels in platelet lysates."
    explanation: Direct measurement of impaired spreading in patient platelets.
  - reference: PMID:28134622
    reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Under these conditions, platelets from both genotypes fully spread, but the spreading process was significantly delayed in the mutant (Figure 6C)."
    explanation: Delayed spreading of Tpm4 mutant mouse platelets on fibrinogen.
  - reference: PMID:28134622

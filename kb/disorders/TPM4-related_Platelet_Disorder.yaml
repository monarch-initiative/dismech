      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Insufficient TPM4 expression in human and mouse megakaryocytes resulted in a defect in the terminal stages of platelet production and had a mild effect on platelet function."
      explanation: The authors' summary that the megakaryocyte defect is in terminal platelet production.

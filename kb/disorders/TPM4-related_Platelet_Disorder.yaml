discussions:
- discussion_id: tpm4_missense_versus_truncating_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do the TPM4 missense variants p.Arg182Cys and p.Ala183Val cause disease by
    a dominant-negative or other non-dosage mechanism, and is that why their
    carriers have platelet dysfunction and more bleeding but near-normal counts,
    the reverse of the truncating-allele phenotype?
  attaches_to:
  - "pathophysiology#Variant-Dependent Platelet Secretion and Aggregation Defect"
  - "pathophysiology#Heterozygous TPM4 Loss of Function"
  rationale: >-
    The truncating alleles reduce TPM4 by about half and give
    macrothrombocytopenia with only mild functional change, consistent with the
    dose dependence of proplatelet formation. The two missense alleles give
    normal or near-normal counts, reduced secretion and aggregation, and
    significant bleeding. The Spanish authors suggest a dominant-negative
    effect for the missense alleles, or additional undiscovered abnormalities
    in those patients, and no experiment has distinguished these. Only three
    missense carriers in two families are described, which is why ClinGen
    scores the gene-disease pair as Moderate.
  evidence:
  - reference: PMID:35170221
    reference_title: A novel nonsense variant in TPM4 caused dominant macrothrombocytopenia, mild bleeding tendency and disrupted cytoskeleton remodeling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alternatively, additional platelet or hemostatic abnormalities yet undiscovered, and beyond TPM4, may be present in the patients reported by Stapley, et al."
    explanation: The authors state the alternative explanation for the missense phenotype, showing the question is open.
  - reference: PMID:35170221
    reference_title: A novel nonsense variant in TPM4 caused dominant macrothrombocytopenia, mild bleeding tendency and disrupted cytoskeleton remodeling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The reasons for such differences in bleeding and platelet phenotype in these TPM4‐RT patients are still unknown."
    explanation: Explicit statement that the genotype-phenotype difference is unexplained.
notes: >-
  No GeneReviews chapter or Orphanet record names this disorder at the time of
  writing. The disease is also represented in MONDO by MONDO:0957580
  (bleeding disorder, platelet-type, 25; OMIM:620486), which MONDO has
  scheduled for merge into MONDO:0100487; it is recorded here as an exactMatch
  mapping.

  The ClinGen evidence summary mentions an unpublished in-frame deletion
  (p.Gly191del) in an individual with isolated thrombocytopenia and no family
  history, which ClinGen did not score; it is not curated here. A heterozygous
  TPM4 p.Val129* variant classified as of uncertain significance was found by
  targeted sequencing in a child with familial thrombocytopenia who also
  carried a GFI1B variant inherited from the same affected father, so that
  family cannot be attributed to TPM4 and is not counted.

  Genome-wide association studies place common variants near TPM4 among the
  loci influencing platelet count and volume in the general population; this
  is background for the gene's role in thrombopoiesis rather than evidence
  about the Mendelian disorder.

  Treatment evidence is minimal. No published series reports antifibrinolytic,
  desmopressin or platelet transfusion use in TPM4 patients, so none is
  curated, although these are the generic options for inherited
  thrombocytopenia around surgery or major bleeding.

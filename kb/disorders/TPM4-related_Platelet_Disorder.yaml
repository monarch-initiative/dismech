    snippet: "Tpm4Plt53/+ and Tpm4Plt53/Plt53 platelets were responsive to a range of agonists, indicating that the processes of integrin inside-out activation and degranulation are functional in the absence of TPM4 (Figure 6B and Supplemental Figure 5A)."
    explanation: Delimits the defect, since agonist responses, integrin activation and degranulation are preserved.
  downstream:
  - target: Mild Failure of Primary Hemostatic Plug Formation
    causal_link_type: DIRECT
    description: >-
      The cytoskeletal defect is the authors' proposed explanation for the
      impaired thrombus formation under arterial flow, although increased
      platelet size is an alternative explanation they also raise.
    evidence:
    - reference: PMID:28134622
      reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "The delayed spreading observed in Tpm4 mutant platelets may be attributed to their increased size, but may also indicate specific defects upon decreased TPM4 expression, potentially involving altered integrin αIIbβ3 outside-in signaling (Figure 7C)."
      explanation: >-
        The authors connect the spreading defect to altered integrin outside-in
        signalling, the step that consolidates a thrombus, while noting
        platelet size as an alternative. INDIRECT because the quote proposes
        rather than demonstrates the causal step.
- name: Variant-Dependent Platelet Secretion and Aggregation Defect
  biological_scale: CELLULAR
  role: modifier
  description: >-
    Reported only with the missense variants p.Arg182Cys and p.Ala183Val:
    reduced granule secretion and aggregation together with spreading defects,
    in patients whose platelet counts were normal or only slightly reduced. The
    truncating-allele carriers have normal aggregation and secretion apart from
    a mild delay to low-dose ADP and epinephrine in one family, so this branch
    is recorded as allele-dependent rather than as part of the main chain.

      label: TPM4
  description: >-
    Tpm4-/- megakaryocytes passaged repeatedly through an ex vivo mouse
    lung-heart preparation generated no platelets, although intravital imaging
    of Tpm4-/- bone marrow showed megakaryocyte protrusion into sinusoids
    similar to wild type.
  evidence:
  - reference: PMID:37419900
    reference_title: Highly efficient platelet generation in lung vasculature reproduced by microfluidics.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Strikingly however, in our ex vivo lung system, Tpm4−/− MKs generate no platelets in the perfusates (Fig. 7a, b)."
    explanation: The lung-perfusion result for Tpm4-null megakaryocytes.

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    Heterozygous truncating TPM4 variants cosegregate with macrothrombocytopenia
    in three dominant pedigrees. Penetrance of the platelet-count component is
    recorded as incomplete because one carrier in the second discovery pedigree
    had a platelet count and mean platelet volume just within the normal range,
    and the missense-variant carriers reported since have normal or only
    slightly reduced platelet counts. Expressivity of bleeding is variable
    within families, from asymptomatic to a mild bleeding tendency.
  evidence:
  - reference: PMID:28134622
    reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Together, our findings demonstrate a nonredundant role for TPM4 in platelet biogenesis in humans and mice and reveal that truncating variants in TPM4 cause a previously undescribed dominant Mendelian platelet disorder."
    explanation: States the dominant Mendelian inheritance of the truncating alleles.
  - reference: PMID:28134622
    reference_title: Mutations in tropomyosin 4 underlie a rare form of human macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pedigree member 2-III-5, who carries the variant, had a platelet count and mean platelet volume just within the normal range"
    explanation: A heterozygous carrier without macrothrombocytopenia, the basis for recording incomplete penetrance.
  - reference: PMID:35170221
    reference_title: A novel nonsense variant in TPM4 caused dominant macrothrombocytopenia, mild bleeding tendency and disrupted cytoskeleton remodeling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study identifies a novel TPM4 nonsense variant segregating with macrothrombocytopenia and impaired platelet cytoskeletal remodeling and spreading."
    explanation: Independent segregation of a second heterozygous truncating allele in a dominant pedigree.

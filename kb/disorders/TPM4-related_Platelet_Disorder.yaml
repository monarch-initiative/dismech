- name: Platelet Cytoskeletal Remodeling Defect
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    Circulating TPM4-deficient platelets remodel their actin cytoskeleton
    poorly on activation. Human p.Gln108* platelets spread less after TRAP-6 or
    collagen-related peptide stimulation and the residual TPM4 fails to move
    into filopodia and lamellipodia; mouse Tpm4 mutant platelets spread fully
    on fibrinogen but more slowly, and show partial degradation of filamin A
    and calpain-type cleavage of actinin 1, with frequent vacuoles suggesting
    fragility. Aggregation, integrin inside-out activation and granule
    secretion in response to agonists are preserved in truncating-allele
    carriers and in mice. The authors note the delayed spreading may partly
    reflect the larger platelet size.

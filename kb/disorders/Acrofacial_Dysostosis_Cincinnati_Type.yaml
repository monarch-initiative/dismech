name: Acrofacial Dysostosis Cincinnati Type
creation_date: "2026-09-02T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: acrofacial dysostosis Cincinnati type
  term:
    id: MONDO:0014651
    label: acrofacial dysostosis Cincinnati type
description: >
  Acrofacial dysostosis, Cincinnati type (AFDCIN, OMIM #616462) is a
  cranioskeletal malformation syndrome caused by heterozygous variants in
  POLR1A, the largest and catalytic subunit of RNA polymerase I. It was
  defined in 2015 in three individuals whose faces looked like Treacher
  Collins syndrome and whose hands and feet did not, and greatly expanded in
  2023 by a further 17 individuals carrying 12 additional variants.

  It is a ribosomopathy, and the mechanism is one of the better-worked-out
  examples of why a defect in a machine every cell needs produces a defect in
  one part of the body. RNA polymerase I transcribes the 47S precursor rRNA,
  which is the rate-limiting step of ribosome biogenesis. Reducing POLR1A
  activity therefore reduces rRNA output everywhere - but Pol I subunits are
  most highly expressed in the neuroepithelium and in neural crest cells,
  which sustain an unusually high rate of rRNA transcription and protein
  translation, and which build most of the craniofacial skeleton. Those cells
  are the ones that cross the threshold first.

  What happens when they do is nucleolar stress. Reduced rRNA synthesis leaves
  ribosomal proteins in excess of the rRNA they should be assembled with; free
  RPL5 and RPL11 bind MDM2 and displace it from p53; p53 accumulates and kills
  the cell. The result is apoptosis of neuroepithelium and depletion of the
  neural-crest-derived skeletal precursor pool that should have populated the
  pharyngeal arches, and consequently mandibulofacial dysostosis.

  Two further points are worth keeping in view. First, the p53 axis is
  necessary but not sufficient: genetically inhibiting tp53 in polr1a-mutant
  zebrafish suppresses the neuroepithelial apoptosis and partially rescues the
  phenotype, but cartilage development is not fully restored because rDNA
  transcription and neural crest proliferation stay low. There is a
  p53-independent arm. Second, the 2023 cohort showed that individual POLR1A
  variants differ in how much they impair rRNA synthesis and how they disturb
  nucleolar morphology, which is the current explanation for why the same gene
  produces a phenotype ranging from isolated craniofacial anomalies to
  neurodevelopmental and structural cardiac disease.

synonyms:
- AFDCIN
- acrofacial dysostosis, Cincinnati type
- POLR1A-related acrofacial dysostosis
- Cincinnati type acrofacial dysostosis

parents:
- Acrofacial dysostosis
- Mandibulofacial dysostosis
- Ribosomopathy

notes: >
  Relationship to Treacher Collins syndrome, which is already curated here.
  AFDCIN and Treacher Collins syndrome are separate entries, and should stay
  separate: different genes (POLR1A here; TCOF1, POLR1C, POLR1D there),
  different limb involvement, and Treacher Collins has its own well-developed
  entry. They are, however, the same mechanism at the pathway level - both are
  Pol I ribosomopathies and neurocristopathies, and the mouse work that
  established the shared p53 axis used Polr1a, Polr1c and Tcof1
  interchangeably. If a Pol I nucleolar-stress mechanism module is ever
  created in `kb/modules/`, these two entries plus the POLR1C/POLR1D forms are
  its natural conformers. That module does not exist today and this entry does
  not declare `conforms_to`.

  Phenotype scope, and why this entry is deliberately coarse in places. The
  primary sources for this disease are two cohort papers whose abstracts state
  the phenotype at category level - "mandibulofacial dysostosis", "limb
  anomalies", "neurodevelopmental abnormalities", "structural cardiac
  defects" - and the per-individual clinical tables are in the article bodies,
  which are not in the reference cache. Rather than name specific
  malformations that no cached quote supports, phenotypes here are bound at
  the level the evidence actually reaches, and the three specific craniofacial
  features that are quotable (micrognathia, cleft palate, malar hypoplasia)
  come from a sentence that describes AFDCIN and Treacher Collins syndrome
  together. That joint attribution is stated in each of those phenotypes'
  evidence explanations rather than being quietly dropped.

  Phenotype frequencies exist but are not curated here, and this is
  deliberate. The openscientist deep-research report used for this entry
  carries a frequency table tallied from HPO annotations across the reported
  cohort - hypotonia 10/17, hypertelorism 9/16, micrognathia 9/21, cleft
  palate 6/20, limb anomaly 6/17, microtia 5/21, and so on, with
  craniosynostosis explicitly 0/15 and macrocephaly 0/13. Those numbers are
  plausible and useful, but they are counts computed over HPO annotation
  records rather than statements made in either primary paper, so there is no
  sentence in a cached reference that a `frequency` value here could be
  evidenced against. Curating them would mean attaching a number to a citation
  that does not contain it. They are recorded in this note instead, with their
  source, so a curator who later obtains the per-individual tables from the
  2023 cohort paper can add them properly.

  The negative annotations are worth keeping in view even so: absent
  craniosynostosis is the feature that separates this disorder from the
  craniosynostosis syndromes it is otherwise compared with, and the report
  finds it in none of the 15 individuals scored.

  Nomenclature caution. "Acrofacial dysostosis" names a group, not this
  disease: Nager and Miller syndromes are also acrofacial dysostoses and are
  unrelated to POLR1A. The "Cincinnati type" qualifier is load-bearing, and
  `Nager_Acrofacial_Dysostosis.yaml` is a separate entry in this KB.

prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Three individuals in the 2015 defining report, plus 17 more in the 2023
    expansion, for roughly 20 published individuals. The 2023 cohort was
    assembled through clinical exome referral and matchmaking rather than by
    population screening, so it is a count of ascertained patients and not a
    frequency estimate.
  evidence:
  - reference: PMID:25913037
    reference_title: "Acrofacial Dysostosis, Cincinnati Type, a Mandibulofacial Dysostosis Syndrome with Limb Anomalies, Is Caused by POLR1A Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report three individuals with a cranioskeletal malformation syndrome that we define as acrofacial dysostosis, Cincinnati type."
    explanation: >-
      The founding cohort size and the act of defining the entity.
  - reference: PMID:37075751
    reference_title: "POLR1A variants underlie phenotypic heterogeneity in craniofacial, neural, and cardiac anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We subsequently identified 17 additional individuals with 12 unique heterozygous variants in POLR1A and observed numerous additional phenotypes including neurodevelopmental abnormalities and structural cardiac defects, in combination with highly prevalent craniofacial anomalies and variable limb defects."
    explanation: >-
      The expansion cohort, which roughly septupled the published case count
      and is the reason the phenotype description in this entry is broader
      than the 2015 one.

inheritance:

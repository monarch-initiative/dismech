description: 'Acrofacial dysostosis Cincinnati type is a POLR1A-related developmental disorder initially recognized by mandibulofacial dysostosis with variable limb abnormalities. Heterozygous variants can also be associated with developmental impairment, epilepsy and congenital cardiac anomalies, while some individuals have mild craniofacial findings and normal development. Both de novo and inherited variants occur. POLR1A encodes the largest catalytic subunit of RNA polymerase I. Experimental effects vary by allele: some variants decrease ribosomal RNA transcription, some increase it, and others have no detectable effect in the tested assays. Reduced transcription and ribosomal stress cause early neural crest or neuroepithelial cell loss in animal models; later cartilage development also requires Polr1a. These model mechanisms do not establish a uniform biochemical defect or a complete explanation for every human phenotype.'
notes: The clinical spectrum is based on small, clinically ascertained reports rather than population sampling. The 2023 study included 18 individuals with 13 heterozygous variants, including relatives, an already reported individual, and variants classified as uncertain, likely pathogenic or pathogenic. Its abstract describes 17 additional individuals and 12 additional variants. Individual findings and cohort counts below are not population frequency estimates. The 2025 p.Met496Ile case overlaps individual 8 in the 2023 series and is not an independent additional case; the reports differ on age at death. True metopic craniosynostosis, hearing impairment and occasional larger head circumference are documented, so their absence cannot define or exclude this disorder. A second de novo ATP1A1 variant confounds individual 13, while p.Pro1638Leu in individual 18 remains questionable after negative functional studies. The 2023 full article and clinical supplement are cited by their generated public URL records; the article corresponds to PMID:37075751. Autosomal recessive POLR1A-associated neurodegenerative disease is a separate reported phenotype and is not generalized to this entry.

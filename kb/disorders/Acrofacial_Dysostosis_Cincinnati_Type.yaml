    explanation: Trio sequencing identified an inherited variant classified as uncertain; clinical interpretation is necessary.
discussions:
- discussion_id: polr1a_allelic_heterogeneity
  prompt: How do allele-specific transcription changes relate to clinical severity?
  notes: The 2023 cell assay separates reduced, increased and unchanged transcription. Neither direction alone explains the clinical spectrum. The p.Met496Ile structural modeling in 2025 is computational and does not override the measured mild increase in the 2023 assay. The 2020 p.Glu593Gln experiment supports a dominant-negative mechanism under inducible expression, not a universal mechanism for all variants.
  evidence:
  - *id005
  - *id006
  - reference: PMID:41010008
    reference_title: 'RNA Polymerase I Dysfunction Underlying Craniofacial Syndromes: Integrated Genetic Analysis Reveals Parallels to 22q11.2 Deletion Syndrome.'
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Structural modeling of the Met496Ile variant suggested disruption of DNA binding and polymerase activity
    explanation: The proposed interaction defect is computational; no direct activity experiment was performed in this report.
- discussion_id: polr1a_limb_mechanism
  prompt: What explains the limb abnormalities?
  notes: The developmental neural crest findings explain a craniofacial route. Limb skeletal abnormalities require a separate mechanism that remains unresolved; they are not modeled as a direct consequence of cranial neural crest depletion.
  evidence:
  - reference: PMID:25913037
    reference_title: Acrofacial Dysostosis, Cincinnati Type, a Mandibulofacial Dysostosis Syndrome with Limb Anomalies, Is Caused by POLR1A Dysfunction.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: The specific mechanism underpinning femoral bowing, metaphyseal flaring, and delayed epiphyseal ossification in individual 1A1 is not yet understood.
    explanation: The founding paper explicitly leaves the limb mechanism unresolved.
- discussion_id: polr1a_later_development
  prompt: Does later Polr1a loss cause a distinct developmental defect?
  notes: Temporal ubiquitous knockout supports a later requirement for skeletal development, but its cell-state proportions and morphology do not discriminate fate selection from altered survival or proliferation. Separate NHP2 and TSR3 perturbations in engineered iPSCs and mice are not proven mediators of human POLR1A disease. The 2026 correction concerned author names and did not alter experimental results.
  evidence: *id007
- discussion_id: polr1a_cohort_attribution
  prompt: Which features are attributable to POLR1A in the expanded cohort?
  notes: The 2023 series includes related individuals and uncertain variants. Individual 13 also carries a de novo ATP1A1 variant; p.Pro1638Leu in individual 18 lacks supporting transcription or mouse phenotypes. Cohort counts therefore describe the reported series rather than confirmed feature frequencies. Craniosynostosis and hearing impairment are documented and are not valid exclusion criteria.
  evidence:
  - reference: url:https://push-zb.helmholtz-munich.de/deliver.php?id=40211
    reference_title: https://push-zb.helmholtz-munich.de/deliver.php?id=40211
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Individ- uals were included if they had a heterozygous variant in POLR1A interpreted as being of uncertain signiﬁcance, likely pathogenic, or pathogenic
    explanation: Ascertainment explicitly included variants of uncertain significance.
  - reference: PMID:41010008
    reference_title: 'RNA Polymerase I Dysfunction Underlying Craniofacial Syndromes: Integrated Genetic Analysis Reveals Parallels to 22q11.2 Deletion Syndrome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: was listed as patient 8 in their study.
    explanation: The 2025 report explicitly identifies its overlap with individual 8 of the 2023 cohort.

experimental_models:
- name: Human POLR1A variant replacement in HCT116 cells
  experimental_model_type: CELL_LINE
  cell_source: Engineered HCT116 cells with auxin-degradable endogenous POLR1A and transient HaloTag-POLR1A constructs
  publication: url:https://push-zb.helmholtz-munich.de/deliver.php?id=40211
  description: Endogenous POLR1A was degraded and variant constructs were tested for nascent nucleolar RNA and localization. This is an engineered cancer-cell assay rather than a patient-derived heterozygous neural crest model.
  modeled_mechanisms:
  - target: Reduced Pol I rRNA Transcription
    relationship: MEASURES
    fidelity: MODERATE

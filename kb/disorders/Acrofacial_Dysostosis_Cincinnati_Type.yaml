- name: Tamoxifen-induced Polr1a deletion in mouse embryonic fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Mouse embryonic fibroblasts with inducible CreERT2 deletion
  publication: PMID:35881792
  description: Co-immunoprecipitation examines the ribosomal-protein/Mdm2/p53 interaction mechanism in cultured fibroblasts. Parallel Polr1c and Tcof1 manipulations support a shared pathway but are not additional human POLR1A alleles.
  modeled_mechanisms:
  - target: Increased RPL5 and RPL11 Binding to MDM2
    relationship: MEASURES
    fidelity: MODERATE
    description: Rpl5 and Rpl11 binding to Mdm2 increases.
    limitations: Total abundance of the assayed proteins was unchanged. The proposed free-ribosomal-protein imbalance was not directly quantified in patient neural crest.
    evidence:
    - reference: PMID:35881792
      reference_title: Dynamic regulation and requirement for ribosomal RNA transcription during mammalian development.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: immunoprecipitation followed by immunoblotting revealed increased binding of Rpl5 and Rpl11 to Mdm2, in concert with decreased binding between Mdm2 and p53 in tKO MEFs compared with controls
      explanation: Tamoxifen-induced deletion in mouse embryonic fibroblasts altered co-immunoprecipitated interactions.

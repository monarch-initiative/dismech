- name: Impaired Later Craniofacial Skeletogenesis
  biological_scale: TISSUE
  description: Ubiquitous R26-CreERT2 deletion of Polr1a induced at E9.0–9.5 and assessed at E12.5 reduces SOX9 signal and disrupts cartilage development. The timing spans late migration and post-migration. Relative transcriptomic cell proportions do not distinguish fate change from differential proliferation or survival.
  evidence: &id007
  - reference: PMID:41803115
    reference_title: Ribosomal modifications are associated with mesenchymal fate selection in the neural crest lineage.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: mutant embryos exhibited reduced SOX9 signal in the mandible, consistent with diminished cartilage development.
    explanation: Temporal ubiquitous Polr1a deletion reduces a skeletogenic marker in the embryonic mandible.
  downstream:
  - target: Reduced Craniofacial Skeletal Condensations
    description: The temporal knockout links Polr1a loss to smaller and discontinuous skeletal structures, without isolating the intervening cellular mechanism.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:41803115
      reference_title: Ribosomal modifications are associated with mesenchymal fate selection in the neural crest lineage.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: Meckel’s cartilage, which manifested as two discrete non-contiguous proximal and distal elements
      explanation: The mutant mandible contains discontinuous Meckel cartilage.
- name: Reduced Craniofacial Skeletal Condensations
  biological_scale: TISSUE
  description: Temporal Polr1a deletion reduces facial mesenchymal condensations and disrupts Meckel cartilage. Trigeminal ganglion volume is comparatively preserved. These observations do not establish normal neural function or absolute expansion of neuroglial cells.
  evidence:
  - reference: PMID:41803115
    reference_title: Ribosomal modifications are associated with mesenchymal fate selection in the neural crest lineage.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: whereas Polr1aflx/flx;R26-Cre-ERT2 embryos exhibited reduced facial mesenchymal condensations, the trigeminal ganglia were not significantly affected
    explanation: MicroCT identifies a preferential skeletal-condensation phenotype in the temporal mouse model.

      gene-disease relationship.

mechanistic_hypotheses:
- hypothesis_group_id: pol1_nucleolar_stress_ncc_apoptosis
  hypothesis_label: Pol I Nucleolar-Stress and Neural Crest Apoptosis Model
  status: CANONICAL
  description: >-
    Reduced POLR1A activity lowers 47S rRNA transcription. Because
    neuroepithelium and neural crest cells run rRNA transcription and protein
    translation at unusually high rates, they are the first tissues to fall
    below the threshold. The resulting imbalance between ribosomal proteins
    and rRNA frees RPL5 and RPL11 to bind MDM2, p53 escapes degradation and
    accumulates, and the affected cells die. The craniofacial skeleton is
    built by exactly those cells, which is why a defect in a housekeeping
    machine produces a face-and-limb phenotype. CANONICAL because the human
    genetics, the zebrafish polr1a mutant, conditional mouse deletion in
    neural crest, and the RPL5/RPL11-MDM2 biochemistry all support it.

- hypothesis_group_id: pol1_p53_independent_arm
  hypothesis_label: p53-Independent Arm of Pol I Ribosomopathy
  status: EMERGING
  description: >-
    Blocking p53 is not enough. In polr1a-mutant zebrafish, genetic tp53
    inhibition suppresses neuroepithelial apoptosis and partially improves the
    phenotype, but cartilage development is not fully rescued because rDNA
    transcription and neural crest cell proliferation remain impaired. Some of
    the craniofacial deficit therefore comes from failure to make enough cells
    rather than from killing the cells that were made, and that arm is not
    p53-dependent. EMERGING because the dissociation is established in
    zebrafish and its molecular basis is not.

pathophysiology:
- name: Heterozygous POLR1A Variants
  biological_scale: MOLECULAR
  description: >
    POLR1A encodes the largest, catalytic subunit of RNA polymerase I. The
    2015 report described three heterozygous variants; the 2023 expansion
    added 12 more unique heterozygous variants across 17 individuals. The
    alleles are not equivalent to one another: assayed in vitro they differ in
    how much they reduce ribosomal RNA synthesis and in what they do to
    nucleolar morphology, which is the current explanation for the range of
    phenotypes seen with one gene.
  genes:
  - preferred_term: POLR1A
    term:
      id: hgnc:17264
      label: POLR1A
    modifier: DECREASED
  genetic_context:
    description: >-
      Germline heterozygous POLR1A variants, most arising de novo.
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:25913037
    reference_title: "Acrofacial Dysostosis, Cincinnati Type, a Mandibulofacial Dysostosis Syndrome with Limb Anomalies, Is Caused by POLR1A Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each individual has a heterozygous mutation in POLR1A, which encodes a core component of RNA polymerase 1."
    explanation: >-
      The gene, the zygosity, and what the gene product does, in the paper
      that defined the entity.
  - reference: PMID:37075751
    reference_title: "POLR1A variants underlie phenotypic heterogeneity in craniofacial, neural, and cardiac anomalies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro assessments demonstrate variable effects of individual pathogenic variants on ribosomal RNA synthesis and nucleolar morphology, which supports the possibility of variant-specific phenotypic effects in affected individuals."
    explanation: >-
      Establishes that the alleles are functionally heterogeneous rather than
      interchangeable nulls, which is what licenses the variant-specific
      reading of the phenotypic range.
  downstream:
  - target: Reduced Pol I rRNA Transcription
    description: Loss of catalytic subunit activity lowers 47S precursor rRNA output.
    hypothesis_groups:
    - pol1_nucleolar_stress_ncc_apoptosis
    - pol1_p53_independent_arm

- name: Reduced Pol I rRNA Transcription
  biological_scale: MOLECULAR
  description: >
    RNA polymerase I transcribes the 47S precursor rRNA that is processed into
    the 5.8S, 18S and 28S rRNAs of the ribosome, and this transcription is the
    rate-limiting step of ribosome biogenesis. In the zebrafish polr1a mutant
    the deficit is measured directly: 47S rRNA transcription is reduced,
    monosomes and polysomes are fewer, and protein translation is impaired.
    This node is where the housekeeping defect sits, before any tissue
    selectivity has entered the picture.
  biological_processes:
  - preferred_term: rRNA transcription
    modifier: DECREASED
    term:
      id: GO:0009303
      label: rRNA transcription
  - preferred_term: ribosome biogenesis
    modifier: DECREASED
    term:
      id: GO:0042254
      label: ribosome biogenesis
  - preferred_term: translation
    modifier: DECREASED
    term:
      id: GO:0006412
      label: translation
  cellular_components:
  - preferred_term: nucleolus
    term:
      id: GO:0005730
      label: nucleolus
  evidence:
  - reference: PMID:29750247
    reference_title: "tp53-dependent and independent signaling underlies the pathogenesis and possible prevention of Acrofacial Dysostosis-Cincinnati type."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "polr1a-/- mutants exhibit deficient 47S rRNA transcription, reduced monosomes and polysomes and, consequently, defects in protein translation"
    explanation: >-
      Direct measurement of the transcriptional deficit and its translational
      consequence in an animal model of this disease.
  - reference: PMID:29750247
    reference_title: "tp53-dependent and independent signaling underlies the pathogenesis and possible prevention of Acrofacial Dysostosis-Cincinnati type."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This indicates that POLR1A is critical for rRNA transcription, which is considered a rate limiting step in ribosome biogenesis"
    explanation: >-
      Establishes why this step, rather than any other in ribosome assembly,
      is the one a POLR1A variant is felt at.
  downstream:
  - target: Tissue-Selective Vulnerability of Neuroepithelium and Neural Crest
    description: >-
      A global reduction in rRNA output is read out first where demand is
      highest.
    hypothesis_groups:
    - pol1_nucleolar_stress_ncc_apoptosis

- name: Tissue-Selective Vulnerability of Neuroepithelium and Neural Crest
  biological_scale: CELLULAR
  description: >
    The node that answers the central puzzle of every ribosomopathy: why a
    ubiquitous defect gives a localised disease. Pol I subunits are most
    highly expressed in the neuroepithelium and in neural crest cells; that
    high expression sustains the elevated rRNA transcription those progenitors
    need for their high rate of protein translation, and it is exactly what
    makes them the first cells to fall below threshold when rRNA synthesis is
    reduced. Neural crest cells go on to form most of the craniofacial bone
    and cartilage, so the tissue that is most sensitive is also the tissue
    whose loss is most visible.
  cell_types:
  - preferred_term: neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  biological_processes:
  - preferred_term: neural crest cell development
    modifier: DECREASED
    term:
      id: GO:0014032
      label: neural crest cell development
  evidence:
  - reference: PMID:35881792
    reference_title: "Dynamic regulation and requirement for ribosomal RNA transcription during mammalian development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "High expression of Pol I subunits sustains elevated rRNA transcription in NCC progenitors, which supports their high tissue-specific levels of protein translation, but also makes NCCs particularly sensitive to rRNA synthesis defects."
    explanation: >-
      The threshold-sensitivity argument stated directly, and the reason this
      node exists between the global transcriptional defect and the localised
      phenotype.
  - reference: PMID:35881792
    reference_title: "Dynamic regulation and requirement for ribosomal RNA transcription during mammalian development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NCCs are a transient progenitor population, which arise from the neuroepithelium and then delaminate, proliferate, and migrate into the frontonasal prominences and pharyngeal arches, where they differentiate into most of the craniofacial bone and cartilage, among other tissues"
    explanation: >-
      Establishes that the sensitive cell population is the one that builds
      the affected skeleton, which is the link between this node and the
      craniofacial phenotype.
  downstream:
  - target: Nucleolar Stress and RPL5/RPL11 Sequestration of MDM2
    description: >-
      Excess free ribosomal proteins relative to rRNA in the cells with the
      highest demand.
    hypothesis_groups:
    - pol1_nucleolar_stress_ncc_apoptosis
  - target: Reduced Neural Crest Cell Proliferation
    description: >-
      Fewer progenitors made, independently of how many are killed.
    hypothesis_groups:
    - pol1_p53_independent_arm

- name: Nucleolar Stress and RPL5/RPL11 Sequestration of MDM2
  biological_scale: MOLECULAR
  description: >
    The biochemical step that converts a shortage of rRNA into a p53 signal.
    When rRNA synthesis falls, ribosomal proteins are made in excess of the
    rRNA they should assemble with. Free RPL5 and RPL11 bind MDM2, the E3
    ligase that normally keeps p53 degraded, and MDM2's binding to p53 falls
    correspondingly. This is the canonical impaired-ribosome-biogenesis
    checkpoint, and it was demonstrated for Pol I subunit loss specifically,
    in mouse neural crest.
  cellular_components:
  - preferred_term: nucleolus
    term:
      id: GO:0005730
      label: nucleolus
  biological_processes:
  - preferred_term: signal transduction by p53 class mediator
    modifier: INCREASED
    term:
      id: GO:0072331
      label: signal transduction by p53 class mediator
  evidence:
  - reference: PMID:35881792
    reference_title: "Dynamic regulation and requirement for ribosomal RNA transcription during mammalian development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This leads to increased binding of ribosomal proteins Rpl5 and Rpl11 to Mdm2 and concomitantly diminished binding between Mdm2 and p53."
    explanation: >-
      The specific molecular event this node asserts, measured rather than
      assumed from the general checkpoint literature.
  - reference: PMID:35881792
    reference_title: "Dynamic regulation and requirement for ribosomal RNA transcription during mammalian development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mechanistically, we demonstrate that diminished rRNA synthesis causes an imbalance between rRNA and ribosomal proteins."
    explanation: >-
      The upstream imbalance that makes the ribosomal proteins available to
      bind MDM2 in the first place.
  downstream:
  - target: p53-Dependent Apoptosis of Neuroepithelium and Neural Crest Cells
    description: >-
      p53 escapes MDM2-mediated degradation and accumulates.
    hypothesis_groups:
    - pol1_nucleolar_stress_ncc_apoptosis

- name: p53-Dependent Apoptosis of Neuroepithelium and Neural Crest Cells
  biological_scale: CELLULAR
  description: >
    Accumulated p53 kills the neuroepithelial and neural crest cells that
    should have populated the developing face. The death is cell-autonomous:
    conditional deletion of Polr1a in mouse neural crest, in the second heart
    field, or in forebrain precursors each causes apoptosis and malformation
    within that lineage, which is what makes the multi-organ phenotype of the
    2023 cohort a set of parallel lineage-specific lesions rather than one
    lesion with remote consequences.

    Causal weight, not just correlation: genetically inhibiting tp53 in
    polr1a-mutant zebrafish suppresses the neuroepithelial apoptosis and
    partially ameliorates the phenotype. That is the experiment that makes
    this node necessary rather than incidental - and, in the same experiment,
    the incompleteness of the rescue is what establishes the separate
    p53-independent arm curated below.
  cell_types:
  - preferred_term: neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  biological_processes:
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:29750247
    reference_title: "tp53-dependent and independent signaling underlies the pathogenesis and possible prevention of Acrofacial Dysostosis-Cincinnati type."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This results in Tp53-dependent neuroepithelial apoptosis, diminished neural crest cell proliferation and cranioskeletal anomalies."
    explanation: >-
      Names the apoptosis, its p53 dependence, and its skeletal consequence in
      one causal statement.
  - reference: PMID:29750247
    reference_title: "tp53-dependent and independent signaling underlies the pathogenesis and possible prevention of Acrofacial Dysostosis-Cincinnati type."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Tp53 inhibition suppresses neuroepithelial apoptosis and partially ameliorates the polr1a mutant phenotype."
    explanation: >-
      The rescue experiment. Removing p53 removes the apoptosis and improves
      the phenotype, which is what makes this node causal rather than a
      bystander finding.
  - reference: PMID:37075751
    reference_title: "POLR1A variants underlie phenotypic heterogeneity in craniofacial, neural, and cardiac anomalies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we observed that loss of Polr1a in any of these lineages causes cell-autonomous apoptosis resulting in embryonic malformations"
    explanation: >-
      Establishes cell-autonomy across three separate lineages, which is the
      basis for treating the cardiac and neurodevelopmental phenotypes as
      parallel lineage lesions.
  - reference: PMID:25913037
    reference_title: "Acrofacial Dysostosis, Cincinnati Type, a Mandibulofacial Dysostosis Syndrome with Limb Anomalies, Is Caused by POLR1A Dysfunction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "polr1a loss of function led to perturbed ribosome biogenesis and p53-dependent cell death, resulting in a deficiency of neural-crest-derived skeletal precursor cells and consequently craniofacial anomalies."
    explanation: >-
      The whole chain from ribosome biogenesis through p53 to skeletal
      precursor deficiency, stated in the defining paper.
  downstream:
  - target: Depletion of Neural-Crest-Derived Skeletal Precursors in the Pharyngeal Arches
    description: >-
      The surviving progenitor pool is too small to build the craniofacial
      skeleton.
    hypothesis_groups:
    - pol1_nucleolar_stress_ncc_apoptosis
  - target: Abnormal heart morphology
    description: >-
      Cell-autonomous apoptosis in neural crest and second heart field
      lineages contributing to the outflow tract and right ventricle.
    hypothesis_groups:
    - pol1_nucleolar_stress_ncc_apoptosis
  - target: Neurodevelopmental Abnormality
    description: >-
      Cell-autonomous apoptosis in forebrain precursors.
    hypothesis_groups:
    - pol1_nucleolar_stress_ncc_apoptosis

- name: Reduced Neural Crest Cell Proliferation
  biological_scale: CELLULAR
  description: >
    The p53-independent arm, and the reason blocking p53 does not fix the
    disease in the model. In polr1a-mutant zebrafish, tp53 inhibition removes
    the apoptosis but leaves rDNA transcription and neural crest cell
    proliferation impaired, and cartilage development is correspondingly only
    partly rescued. So part of the craniofacial deficit is a failure to
    generate enough progenitors, not a failure to keep the ones that were
    generated alive. This distinction matters therapeutically: a p53-directed
    intervention would address one arm and not the other, which is why the
    authors frame the search as one for p53-independent therapies.
  cell_types:
  - preferred_term: neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: DECREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:29750247
    reference_title: "tp53-dependent and independent signaling underlies the pathogenesis and possible prevention of Acrofacial Dysostosis-Cincinnati type."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, complete rescue of cartilage development is not observed due to the failure to improve rDNA transcription and neural crest cell proliferation."
    explanation: >-
      The incompleteness of the p53 rescue, attributed by the authors to
      persistent transcriptional and proliferative deficits. This is the
      evidence that the arm exists.
  - reference: PMID:29750247
    reference_title: "tp53-dependent and independent signaling underlies the pathogenesis and possible prevention of Acrofacial Dysostosis-Cincinnati type."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "these data reveal specific functions for both Tp53-dependent and independent signaling downstream of polr1a in ribosome biogenesis during neural crest cell and craniofacial development"
    explanation: >-
      The authors' summary that two arms exist, which is what this entry
      models as two hypothesis groups rather than one.
  downstream:
  - target: Depletion of Neural-Crest-Derived Skeletal Precursors in the Pharyngeal Arches
    description: >-
      Too few progenitors generated, converging on the same precursor
      shortfall as the apoptotic arm.
    hypothesis_groups:
    - pol1_p53_independent_arm

- name: Depletion of Neural-Crest-Derived Skeletal Precursors in the Pharyngeal Arches
  biological_scale: TISSUE
  description: >
    Where both arms converge, and the node the craniofacial phenotypes hang
    from. Neural crest cells migrate into the frontonasal prominences and
    pharyngeal arches and differentiate there into most of the craniofacial
    bone and cartilage. A shortfall in that population, whether from apoptosis
    or from failed proliferation, produces hypoplasia of the structures those
    arches build - the mandible, the malar region, the palate and the external
    and middle ear.
  cell_types:
  - preferred_term: neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  locations:
  - preferred_term: pharyngeal arch
    term:
      id: UBERON:0002539
      label: pharyngeal arch
  biological_processes:
  - preferred_term: neural crest cell migration
    modifier: DECREASED
    term:
      id: GO:0001755
      label: neural crest cell migration
  evidence:
  - reference: PMID:25913037
    reference_title: "Acrofacial Dysostosis, Cincinnati Type, a Mandibulofacial Dysostosis Syndrome with Limb Anomalies, Is Caused by POLR1A Dysfunction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "resulting in a deficiency of neural-crest-derived skeletal precursor cells and consequently craniofacial anomalies"
    explanation: >-
      Names the precursor deficiency and attributes the craniofacial anomalies
      to it.
  - reference: PMID:35881792
    reference_title: "Dynamic regulation and requirement for ribosomal RNA transcription during mammalian development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "NCC-specific deletion of Pol I subunits Polr1a, Polr1c, and associated factor Tcof1 in mice cell-autonomously diminishes rRNA synthesis, which leads to p53 protein accumulation, resulting in NCC apoptosis and craniofacial anomalies."
    explanation: >-
      Mouse genetics placing the lesion in the neural crest lineage itself and
      linking it to craniofacial anomalies.
  downstream:
  - target: Mandibulofacial Dysostosis
    description: >-
      Hypoplasia of the first- and second-arch derivatives.
    hypothesis_groups:
    - pol1_nucleolar_stress_ncc_apoptosis
    - pol1_p53_independent_arm
  - target: Micrognathia
    description: Hypoplasia of the mandible.
    hypothesis_groups:
    - pol1_nucleolar_stress_ncc_apoptosis
  - target: Malar Hypoplasia
    description: Hypoplasia of the zygomatic complex.
    hypothesis_groups:
    - pol1_nucleolar_stress_ncc_apoptosis
  - target: Cleft Palate
    description: Failure of palatal shelf growth and fusion.
    hypothesis_groups:
    - pol1_nucleolar_stress_ncc_apoptosis
  - target: Limb Anomaly
    description: >-
      The acral component. Present in some but not all individuals, and it is
      what distinguishes this entity from Treacher Collins syndrome.
    hypothesis_groups:
    - pol1_nucleolar_stress_ncc_apoptosis

phenotypes:
- category: Craniofacial
  name: Mandibulofacial Dysostosis
  description: >
    The defining feature, present in every reported individual and the reason
    the entity was initially mistaken for Treacher Collins syndrome. Severity
    varies between individuals carrying different POLR1A alleles.

  genotype: Polr1a conditional deletion in neural crest cells, second heart field, and forebrain precursors
  publication: PMID:37075751
  description: >
    Lineage-restricted deletion in the three progenitor populations that
    correspond to the three organ systems affected in the 2023 patient cohort.
    Its value is that it tests cell-autonomy separately in each, rather than
    reproducing the syndrome as a whole.

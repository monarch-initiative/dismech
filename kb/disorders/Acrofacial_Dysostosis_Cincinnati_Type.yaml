discussions:
- discussion_id: polr1a_p53_independent_arm_gap
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Reduced Neural Crest Cell Proliferation
  - mechanistic_hypotheses#pol1_p53_independent_arm
  prompt: >-
    What mediates the p53-independent arm - the failure of neural crest cells
    to proliferate that persists after tp53 inhibition?
  rationale: >
    The p53 arm is worked out in detail, from rRNA imbalance through
    RPL5/RPL11-MDM2 to apoptosis. The other arm is defined only by what
    remains after p53 is removed: rDNA transcription and neural crest
    proliferation stay impaired and cartilage is not fully rescued. No
    molecular mechanism has been proposed for it. This is the gap with the
    clearest therapeutic consequence in the entry, because a p53-directed
    intervention would by construction leave this arm untouched, and the
    authors themselves frame the next step as a search for p53-independent
    therapies.
  proposed_experiments:
  - experiment_id: polr1a_tp53_independent_arm_transcriptomics
    name: Transcriptomic profiling of tp53-inhibited polr1a mutant neural crest
    description: >-
      Profile neural crest cells from polr1a-mutant zebrafish with and without
      genetic tp53 inhibition, at the stage where proliferation is already
      reduced, to identify the pathways that remain dysregulated once the
      apoptotic arm has been removed.
    would_support:
    - pathophysiology#Reduced Neural Crest Cell Proliferation
    supporting_outcome:
    - >-
      A coherent set of cell-cycle or growth-signalling pathways altered in
      tp53-inhibited mutants relative to tp53-inhibited controls, identifying
      a candidate mediator distinct from the p53 response.
    refuting_outcome:
    - >-
      No transcriptional differences beyond the p53 target genes already
      removed by the inhibition, which would argue the residual proliferative
      deficit is a direct translational-capacity limit rather than a signalling
      arm.

- discussion_id: polr1a_variant_specific_phenotype
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Heterozygous POLR1A Variants
  prompt: >-
    Does the degree to which an individual POLR1A variant reduces rRNA
    synthesis predict which organ systems that patient's disease involves?
  rationale: >
    The 2023 cohort found that variants differ in their effects on rRNA
    synthesis and nucleolar morphology, and proposed variant-specific
    phenotypic effects as the explanation for a phenotype ranging from
    isolated craniofacial anomalies to multi-system disease. That is a
    proposal, not a demonstration: the in vitro assays and the clinical
    phenotypes have not been shown to line up allele by allele, and with
    around 20 published individuals carrying 15 alleles most alleles are
    represented once. Until they are correlated, the tissue-threshold model
    predicts a severity gradient but not which tissues a given patient will
    involve, which is exactly what a family wants to know.

progression:
- phase: Prenatal and neonatal structural disease
  notes: Severe craniofacial malformations may be detected prenatally and cause airway compromise at birth. Other children have milder facial findings with normal development. Severe infantile cardiorespiratory disease and early deaths occur in individual cases, without a reliable survival estimate.
  evidence:
  - reference: PMID:25913037
    reference_title: Acrofacial Dysostosis, Cincinnati Type, a Mandibulofacial Dysostosis Syndrome with Limb Anomalies, Is Caused by POLR1A Dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: severe micrognathia, which required tracheostomy at birth to establish a secure airway
    explanation: The severe index case required neonatal airway protection.
- phase: Variable childhood neurodevelopment
  notes: Development ranges from normal to severe impairment with epilepsy. One child developed epileptic encephalopathy and regression after initially normal development. This is not evidence of a universal progressive neurodegenerative course.
  evidence:
  - reference: url:https://ars.els-cdn.com/content/image/1-s2.0-S0002929723000988-mmc1.pdf
    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929723000988-mmc1.pdf

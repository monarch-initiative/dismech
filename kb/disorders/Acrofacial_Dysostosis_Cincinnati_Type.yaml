- name: Abnormal Pol I Condensate Formation
  biological_scale: MOLECULAR
  description: Inducible p.Glu593Gln POLR1A in HeLa cells produces abnormal nucleolar condensates containing mutant and wild-type polymerase. Single-molecule tracking supports stable mutant association and impaired productive wild-type binding as a dominant-negative model. Expression was approximately twice the endogenous level; this is not a measurement in patient neural crest cells.
  evidence:
  - reference: PMID:33055158
    reference_title: Transcriptional suppression of ribosomal DNA with phase separation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Not only the mutant but also the WT Pol I was localized to the condensates (HaloTag-WT RPA194; Fig.
    explanation: Mutant and wild-type polymerase relocalize in an inducible HeLa overexpression experiment.
  cellular_components:
  - preferred_term: nucleolus
    term:
      id: GO:0005730
      label: nucleolus
  downstream:
  - target: Reduced Pol I rRNA Transcription
    description: Dominant-negative interference with productive transcription is supported in the engineered assay; chromatin-binding competition is an inferred molecular explanation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33055158
      reference_title: Transcriptional suppression of ribosomal DNA with phase separation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: the 47S pre-rRNA transcript was decreased to 30% in cells expressing RPA194-E593Q compared with control cells
      explanation: The induced mutant markedly reduces precursor rRNA in the cell assay.
- name: Reduced Pol I rRNA Transcription
  biological_scale: MOLECULAR
  description: Reduced precursor-rRNA output occurs in polr1a-mutant zebrafish and Polr1a-deleted mouse neural crest, and in cells expressing selected human variants. Spacer-region qPCR is a transcription proxy. Mature rRNA abundance can initially remain unchanged; this branch does not apply to every allele.
  evidence:

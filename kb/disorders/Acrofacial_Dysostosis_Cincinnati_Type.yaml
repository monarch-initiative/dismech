    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Individual 9 is an almost 4-year-old male who developed epileptic encephalopathy at age 2.5 years.
    explanation: Later-onset epilepsy with regression is a case-specific trajectory.

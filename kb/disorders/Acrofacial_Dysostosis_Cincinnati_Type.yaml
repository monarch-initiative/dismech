mechanistic_hypotheses:
- hypothesis_group_id: pol1_nucleolar_stress_ncc_apoptosis
  hypothesis_label: Reduced Pol I transcription and early neural crest depletion
  status: CANONICAL
  description: Experimental Polr1a loss reduces precursor rRNA and ribosome production. Ribosomal protein-Mdm2 interactions, p53 pathway activity and apoptosis support a stress-mediated depletion mechanism in early developmental models. The molecular interaction assays were performed in mouse embryonic fibroblasts, and the developmental phenotypes in fish and mouse embryos. Human allele effects are heterogeneous; this model describes the reduced-function branch rather than every POLR1A variant.
- hypothesis_group_id: pol1_p53_independent_arm
  hypothesis_label: Residual developmental defects after p53 inhibition
  status: EMERGING
  description: Genetic tp53 inhibition incompletely rescues polr1a-mutant zebrafish cartilage and does not restore rRNA transcription or neural crest proliferation. Additional growth and developmental requirements therefore remain. Later temporal mouse deletion also disrupts skeletal condensations, but that experiment does not distinguish differentiation from altered cell survival or expansion.
pathophysiology:
- name: Heterozygous POLR1A Variants
  biological_scale: MOLECULAR
  description: Germline heterozygous variants are associated with the human disorder. Missense, truncating and in-frame alleles have diverse experimental effects; neither uniform haploinsufficiency nor universal loss of function is established.

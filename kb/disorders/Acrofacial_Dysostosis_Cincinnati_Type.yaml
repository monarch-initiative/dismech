genetic:
- name: POLR1A
  notes: >
    The sole gene for this disorder, at 2p11.2, encoding the largest and
    catalytic subunit of RNA polymerase I. Heterozygous variants cause
    acrofacial dysostosis Cincinnati type. Its Pol I partners POLR1C and
    POLR1D, and the Pol I-associated factor TCOF1, cause Treacher Collins
    syndrome instead, which is the pathway-level relationship between the two
    entities.
  gene_term:
    preferred_term: POLR1A
    term:
      id: hgnc:17264
      label: POLR1A
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:25913037
    reference_title: "Acrofacial Dysostosis, Cincinnati Type, a Mandibulofacial Dysostosis Syndrome with Limb Anomalies, Is Caused by POLR1A Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each individual has a heterozygous mutation in POLR1A, which encodes a core component of RNA polymerase 1."
    explanation: >-
      The gene-disease assertion in the paper that established it.
  - reference: PMID:35881792
    reference_title: "Dynamic regulation and requirement for ribosomal RNA transcription during mammalian development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "whereas mutations in POLR1C and POLR1D, shared subunits of Pol I and III, or Pol I-associated factor TCOF1 cause Treacher Collins syndrome (TCS)"
    explanation: >-
      Establishes the gene boundary between this entity and Treacher Collins
      syndrome, which is what keeps them separate entries.
  - reference: PMID:41010008
    reference_title: "RNA Polymerase I Dysfunction Underlying Craniofacial Syndromes: Integrated Genetic Analysis Reveals Parallels to 22q11.2 Deletion Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "POLR1A and related gene variants cause craniofacial and developmental syndromes, including Acrofacial Dysostosis-Cincinnati, Treacher-Collins types 2-4, and TWIST1-associated disorders."
    explanation: >-
      Places this entity within the Pol I-related craniofacial group, which is
      the grouping a future mechanism module would be built on.
  - reference: PMID:41010008
    reference_title: "RNA Polymerase I Dysfunction Underlying Craniofacial Syndromes: Integrated Genetic Analysis Reveals Parallels to 22q11.2 Deletion Syndrome."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Structural modeling of the Met496Ile variant suggested disruption of DNA binding and polymerase activity, linking molecular dysfunction to the clinical phenotype."
    explanation: >-
      A worked structural rationale for one missense allele, which is the kind
      of variant-level evidence the variant-heterogeneity claim in this entry
      will eventually need across the series. Graded COMPUTATIONAL because it
      is a modelling result, not an assay.

animal_models:
- name: polr1a zebrafish mutant
  species: Zebrafish
  genotype: polr1a-/-
  publication: PMID:29750247
  description: >
    The model in which the mechanism of this disease was worked out. It
    reproduces the cranioskeletal phenotype and allows the two arms of the
    mechanism to be separated genetically, which is what makes it more than a
    phenocopy.
  modeled_mechanisms:
  - target: Reduced Pol I rRNA Transcription
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Direct measurement of reduced 47S rRNA transcription with fewer
      monosomes and polysomes and impaired translation.
    limitations: >-
      A homozygous null, whereas the human disease is heterozygous, so the
      model works at a lower dose of Pol I activity than any patient.
    readouts:
    - name: 47S rRNA transcription
      target: Reduced Pol I rRNA Transcription
      direction: DECREASED
      interpretation: The rate-limiting transcriptional step of ribosome biogenesis.
      evidence:
      - reference: PMID:29750247
        reference_title: "tp53-dependent and independent signaling underlies the pathogenesis and possible prevention of Acrofacial Dysostosis-Cincinnati type."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "polr1a-/- mutants exhibit deficient 47S rRNA transcription, reduced monosomes and polysomes and, consequently, defects in protein translation"
        explanation: The measurement itself, with its translational consequence.
    evidence:
    - reference: PMID:29750247
      reference_title: "tp53-dependent and independent signaling underlies the pathogenesis and possible prevention of Acrofacial Dysostosis-Cincinnati type."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In a zebrafish model of Acrofacial Dysostosis-Cincinnati type, we demonstrate that polr1a-/- mutants exhibit deficient 47S rRNA transcription"
      explanation: >-
        Establishes that this model is presented as a model of this disease
        specifically, and that the transcriptional node is where it reports.
  - target: p53-Dependent Apoptosis of Neuroepithelium and Neural Crest Cells
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Genetic tp53 inhibition in the mutant background removes the
      neuroepithelial apoptosis and partially improves the cranioskeletal
      phenotype, which is the experiment establishing that this node is causal.
    limitations: >-
      The rescue is partial: cartilage development is not fully restored,
      because rDNA transcription and neural crest proliferation stay
      impaired. The experiment therefore establishes p53 as necessary for one
      arm and simultaneously proves that arm is not the whole disease.
    readouts:
    - name: Neuroepithelial apoptosis after tp53 inhibition
      target: p53-Dependent Apoptosis of Neuroepithelium and Neural Crest Cells
      direction: ABOLISHED
      interpretation: >-
        Loss of the apoptotic readout on removing p53 is what makes the p53
        arm causal rather than correlative.
      evidence:
      - reference: PMID:29750247
        reference_title: "tp53-dependent and independent signaling underlies the pathogenesis and possible prevention of Acrofacial Dysostosis-Cincinnati type."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Tp53 inhibition suppresses neuroepithelial apoptosis and partially ameliorates the polr1a mutant phenotype."
        explanation: The rescue result and its explicit partiality.
    evidence:
    - reference: PMID:29750247
      reference_title: "tp53-dependent and independent signaling underlies the pathogenesis and possible prevention of Acrofacial Dysostosis-Cincinnati type."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "To understand the contribution of the Tp53 pathway to the pathogenesis of Acrofacial Dysostosis-Cincinnati type, we genetically inhibited tp53 in polr1a-/- mutant embryos."
      explanation: >-
        States the intervention, which is what licenses the RESCUES
        relationship on this link.

- name: Polr1a neural crest conditional knockout mouse

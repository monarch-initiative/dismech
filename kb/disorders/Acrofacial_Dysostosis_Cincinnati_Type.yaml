- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  description: Exome or genome sequencing can identify heterozygous POLR1A variants in patients with craniofacial malformations, limb defects or a broader neurodevelopmental presentation. Variant classification, parental testing and clinical concordance matter; a rare variant alone is not diagnostic, especially for alleles with uncertain or negative functional results.
  evidence:

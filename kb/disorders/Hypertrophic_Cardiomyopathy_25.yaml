genetic:
- name: TCAP Variants Reported in Hypertrophic Cardiomyopathy
  association: Reported Variants of Disputed Clinical Validity
  relationship_type: DISPUTED
  gene_term:
    preferred_term: TCAP
    term:
      id: hgnc:11610
      label: TCAP
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  features: >-
    The reported HCM alleles are heterozygous missense changes distributed
    across the 167-residue telethonin protein (T137I and R153H in the founding
    Japanese/Korean study; C57W in a Portuguese family), plus one heterozygous
    frameshift (p.Glu12fs) in a 2025 case report. TCAP has only two exons, so
    truncating alleles largely escape nonsense-mediated decay. This is
    mechanistically important because it separates the cardiac claim from the
    skeletal-muscle one: LGMD R7/2G is caused by biallelic loss of function,
    whereas the cardiac alleles are monoallelic and mostly missense. Variant
    interpretation in this gene demands caution — ClinGen found no functional
    support for any reported HCM allele, judged one reported variant to be a
    common population variant, and noted co-occurrence with a pathogenic TNNI3
    variant in one proband and a MYBPC3 VUS in another.
  variants:
  - name: TCAP T137I
    description: >-
      Missense allele identified in a hypertrophic cardiomyopathy proband in the
      founding TCAP cardiomyopathy study; reported to augment telethonin binding
      to titin and calsarcin-1 in vitro.
    gene:
      preferred_term: TCAP
      term:
        id: hgnc:11610
        label: TCAP
  - name: TCAP R153H
    description: >-
      Second missense allele found in a hypertrophic cardiomyopathy proband in
      the same study, with the same reported gain-of-interaction behaviour.
    gene:
      preferred_term: TCAP
      term:
        id: hgnc:11610
        label: TCAP
  - name: TCAP C57W
    description: >-
      Missense allele reported in a small Portuguese HCM family after exclusion
      of eleven established HCM genes; very low population frequency, high
      cross-species conservation, in silico predictions of damage, and a
      co-segregation pattern within the family. No functional assay was
      performed.
    gene:
      preferred_term: TCAP
      term:
        id: hgnc:11610
        label: TCAP
  - name: TCAP p.Glu12fs
    description: >-
      Heterozygous frameshift producing a truncated telethonin, identified by
      whole exome sequencing in a family with restrictive-phenotype hypertrophic
      cardiomyopathy. The first truncating allele reported in a hypertrophic
      presentation; the authors frame the contribution as possible rather than
      proven.
    gene:
      preferred_term: TCAP
      term:
        id: hgnc:11610
        label: TCAP

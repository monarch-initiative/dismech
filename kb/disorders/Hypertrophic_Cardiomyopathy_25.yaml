  description: >-
    First-line imaging: establishes unexplained left ventricular hypertrophy,
    characterises its distribution (asymmetric/septal in the reported carriers),
    grades diastolic function, and documents atrial size. It is also the
    modality in which the sigmoidal septal contour of Z-disc HCM was defined.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:40330574
    reference_title: "Mutations in the TCAP gene may lead to restrictive phenotype hypertrophic cardiomyopathy with poor prognosis: case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transthoracic echocardiography and cardiac magnetic resonance imaging
      (CMR) revealed non-obstructive hypertrophic cardiomyopathy (HCM) with
      severe diastolic dysfunction
    explanation: Worked example of echocardiography establishing the phenotype in a TCAP carrier.
  - reference: PMID:17097056
    reference_title: Echocardiographic-determined septal morphology in Z-disc hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Blinded to the Z-disc genotype status, the septal contour was graded
      qualitatively using standard transthoracic echocardiography.
    explanation: >-
      Documents transthoracic echocardiography as the method by which septal
      morphology is assessed in Z-disc HCM.

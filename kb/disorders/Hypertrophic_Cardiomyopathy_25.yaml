- name: Impaired Myocardial Adaptation to Biomechanical Stress
  biological_scale: CELLULAR
  role: amplifier
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The best-characterised in vivo consequence of losing telethonin is not a
    structural Z-disc collapse but a failure of stress adaptation. Telethonin
    knockout mice have normal hearts at baseline — other titin anchorage routes
    compensate — yet decompensate into heart failure after biomechanical stress,
    at least partly through cardiomyocyte apoptosis driven by telethonin's
    nuclear role in p53 turnover ("mechanoptosis"). Loss of telethonin mRNA with
    nuclear accumulation of the protein is also seen in human failing hearts. An
    independent Tcap-null line shows the same load-gated pattern in the
    excitation-contraction machinery: isolated t-tubule defects and desynchronised
    calcium transients at three months, progressive t-tubule loss by eight months,
    and accelerated t-tubule disruption specifically after aortic banding. This
    node is retained because it is the only in vivo mechanistic account of
    telethonin in the heart, but its direction of effect (loss of function)
    differs from the human HCM alleles (missense, gain of interaction), and the
    mouse phenotype is heart failure rather than hypertrophic cardiomyopathy.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Response to mechanical stimulus
    term:
      id: GO:0009612
      label: response to mechanical stimulus
    modifier: ABNORMAL
  - preferred_term: Cardiac muscle cell apoptotic process
    term:
      id: GO:0010659
      label: cardiac muscle cell apoptotic process
    modifier: INCREASED
  - preferred_term: T-tubule organization
    term:
      id: GO:0033292
      label: T-tubule organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:21799151
    reference_title: Telethonin deficiency is associated with maladaptation to biomechanical stress in the mammalian heart.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Telethonin knockout mice do not reveal defective heart development or
      heart function under basal conditions, but develop heart failure following
      biomechanical stress, owing at least in part to apoptosis of
      cardiomyocytes
    explanation: >-
      The core in vivo result: telethonin is dispensable at baseline but
      required for adaptation to biomechanical load, with apoptosis as the
      effector.
  - reference: PMID:21799151
    reference_title: Telethonin deficiency is associated with maladaptation to biomechanical stress in the mammalian heart.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We demonstrate that a main novel function of telethonin is to modulate the
      turnover of the proapoptotic tumor suppressor p53 after biomechanical
      stress in the nuclear compartment, thus linking telethonin, a protein well
      known to be present at the Z-disk, directly to apoptosis
    explanation: >-
      Identifies the molecular route (nuclear p53 turnover) from telethonin
      deficiency to stress-induced cardiomyocyte apoptosis.
  - reference: PMID:21799151
    reference_title: Telethonin deficiency is associated with maladaptation to biomechanical stress in the mammalian heart.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, loss of telethonin mRNA and nuclear accumulation of this
      protein is associated with human heart failure
    explanation: >-
      The one human observation linking telethonin dysregulation to myocardial
      disease. PARTIAL because it is an association in end-stage failing hearts
      of mixed aetiology, not in TCAP variant carriers.
  - reference: PMID:21799151
    reference_title: Telethonin deficiency is associated with maladaptation to biomechanical stress in the mammalian heart.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we show that contrary to previous views, telethonin is not an indispensable
      component of the titin-anchoring system, nor is deletion of the gene or
      cardiac specific overexpression associated with a spontaneous cardiac
      phenotype.
    explanation: >-
      Directly refutes a simple structural loss-of-anchorage account of TCAP
      cardiomyopathy, and refutes the idea that telethonin dosage alone produces
      a spontaneous cardiac phenotype.
  - reference: PMID:23100327
    reference_title: A critical role for Telethonin in regulating t-tubule structure and function in the mammalian heart.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mechanical overload increased the Ca(2+) spark frequency in KO alone, where
      there was also significantly more t-tubule loss, with a greater
      deterioration in t-tubule regularity.
    explanation: >-
      Independent Tcap-null evidence that the deficit is load-gated: the t-tubule
      and calcium-handling phenotype is unmasked by mechanical overload, matching
      the maladaptation-to-stress framing of this node.
  - reference: PMID:23100327
    reference_title: A critical role for Telethonin in regulating t-tubule structure and function in the mammalian heart.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data suggest that Tcap is a critical, load-sensitive regulator of t-tubule structure and function."
    explanation: >-
      The authors' summary of telethonin's load-sensing role in maintaining
      t-tubule structure, the excitation-contraction correlate of the
      mechanosensing defect.
  downstream:
  - target: Cardiomyocyte Hypertrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Cardiomyocyte Hypertrophy
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Whatever the upstream signalling route, the observed cellular phenotype in a
    TCAP variant carrier is the generic hypertrophic one. The single
    biopsy-documented case (a p.Glu12fs frameshift carrier) showed cardiomyocyte
    hypertrophy with focal fibrosis. There is no TCAP-specific cell or
    engineered-tissue model, so this node is supported by human histology rather
    than by mechanistic experiment.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Cardiac muscle hypertrophy
    term:
      id: GO:0003300
      label: cardiac muscle hypertrophy
    modifier: INCREASED
  notes: >-
    This node was narrowed during review. It previously read "Sarcomeric Z-Disc
    Disorganization and Cardiomyocyte Hypertrophy" and carried GO:0045214
    sarcomere organization (ABNORMAL) alongside the hypertrophy term. The single
    evidence item available - the endomyocardial biopsy in the one reported case
    - documents cardiomyocyte hypertrophy and focal fibrosis and says nothing
    about sarcomere or Z-disc architecture, and no other cached source for this
    entity reports disarray or myofibrillar disorganization either. The node was
    therefore narrowed to the claim the evidence supports, and the GO:0045214
    annotation dropped, rather than split into a second node that would have had
    no evidence to stand on. Z-disc disorganization is a plausible expectation
    for a Z-disc protein, but plausibility is exactly what this DISPUTED entity
    must not encode as observation. If a TCAP biopsy or model reporting
    myofibrillar architecture appears, a separate sourced node is the right way
    to add it.

    reference_title: "TCAP / hypertrophic cardiomyopathy (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The TCAP gene was first associated with hypertrophic cardiomyopathy (HCM)
      in 2004 with missense variants found in 2 probands (Hayashi et al, PMID
      15582318).
    explanation: >-
      ClinGen's enumeration of the primary case-level evidence base for the

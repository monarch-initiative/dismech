  - reference: PMID:30681346
    reference_title: Evaluating the Clinical Validity of Hypertrophic Cardiomyopathy Genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of genes previously reported as causative of HCM and commonly
      included in diagnostic tests have limited or no evidence of disease
      association.
    explanation: >-
      The systematic ClinGen HCM gene curation that placed TCAP outside the
      definitive/moderate tiers; supports treating a TCAP finding on an HCM
      panel with caution.
  - reference: PMID:37752589
    reference_title: TCAP gene is not a common cause of cardiomyopathy in Iranian patients.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the cohort of this study, we identified only one intronic variant
      c.111-42G > A in one of the HCM patients that were predicted as
      polymorphism by in-silico analysis.
    explanation: >-
      A dedicated TCAP screen of 40 HCM/DCM patients returned no pathogenic
      allele, adding negative case-level evidence. PARTIAL because the cohort is

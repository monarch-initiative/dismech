prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence estimate exists for the TCAP-attributed form of
    hypertrophic cardiomyopathy, and none can responsibly be derived while the
    gene-disease relationship is Disputed. The only quantitative anchors are
    yields in referral HCM cohorts: 4 of 389 unrelated HCM patients at a
    tertiary centre carried a TCAP variant (about 1%), and 1 of 239
    myofilament-negative HCM patients carried a TCAP Z-disc variant. ClinGen
    notes that one of the Bos et al. variants (2 probands) is in fact common in
    the population, so even these low yields overstate the disease-attributable
    fraction.
  evidence:
  - reference: PMID:16352453
    reference_title: Genotype-phenotype relationships involving hypertrophic cardiomyopathy-associated mutations in titin, muscle LIM protein, and telethonin.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, 16 patients (4.1%) harbored a Z-disc mutation: 12 had a MLP
      mutation and 4 patients a TCAP mutation.
    explanation: >-
      Gives the TCAP yield (4 of 389 unrelated HCM probands) in a large tertiary
      referral cohort. PARTIAL because a clinic-cohort yield is not a population
      prevalence, and ClinGen subsequently judged one of these variants to be a
      common population variant.
  - reference: PMID:17097056
    reference_title: Echocardiographic-determined septal morphology in Z-disc hypertrophic cardiomyopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirteen of the 239 patients (5.4%) had one of 13 distinct HCM-associated
      Z-disc mutations involving residues highly conserved across species and
      absent in 600 reference alleles: LDB3 (6), ACTN2 (3), TCAP (1), CSRP3 (1),
      and VCL (2).
    explanation: >-
      Places TCAP as a single-proband finding within the already-uncommon Z-disc
      HCM group in a myofilament-negative cohort. PARTIAL for the same reason:
      cohort yield, not population prevalence.
  - reference: CGGV:assertion_c35abc20-c04c-49ec-af02-1bd270b0b50b-2022-09-14T160000.000Z
    reference_title: "TCAP / hypertrophic cardiomyopathy (Disputed)"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Furthermore, 1 variant (2 probands) is common in the population (Bos et
      al, 2006, PMID 16352453), and 2 co-occurred with other variants
    explanation: >-
      ClinGen's re-analysis of the same cohort data shows the reported yields
      overstate the disease-attributable fraction, which is why no prevalence
      band is asserted.
inheritance:
- name: Autosomal Dominant
  description: >-
    Where a mode of inheritance has been recorded for TCAP cardiomyopathy it is
    autosomal dominant heterozygous transmission of a missense (or, in one
    report, frameshift) allele. Segregation data are thin: a single small
    Portuguese family demonstrated co-segregation of the p.C57W allele, and the
    2025 frameshift report identified the variant in the proband's family.
    Contrast with the TCAP skeletal-muscle disease (LGMD R7/2G), which is
    autosomal recessive and biallelic loss of function.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: CGGV:assertion_c35abc20-c04c-49ec-af02-1bd270b0b50b-2022-09-14T160000.000Z
    reference_title: "TCAP / hypertrophic cardiomyopathy (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TCAP | HGNC:11610 | hypertrophic cardiomyopathy | MONDO:0005045 | AD |
      Disputed
    explanation: >-
      ClinGen records autosomal dominant inheritance for the TCAP-HCM
      gene-disease relationship, alongside the Disputed validity classification.
  - reference: PMID:32565061
    reference_title: Identification of a novel titin-cap/telethonin mutation in a Portuguese family with hypertrophic cardiomyopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Family members were screened for this new mutation and a co-segregation
      pattern was detected.
    explanation: >-
      The only published co-segregation observation for a TCAP HCM allele.
      PARTIAL because the family is explicitly described as small, so the
      segregation evidence is weak on its own.
mechanistic_hypotheses:
- hypothesis_group_id: tcap_zdisc_stretch_sensor_gain_of_interaction
  hypothesis_label: Z-disc stretch-sensor gain-of-interaction model
  status: EMERGING
  description: >-
    The only mechanistic model proposed for TCAP-HCM holds that the
    hypertrophic and dilated phenotypes are separated by the *direction* of the
    binding change within the titin/telethonin/MLP Z-disc stretch sensor: the
    two HCM-associated missense alleles (T137I, R153H) augmented telethonin's
    interaction with titin and calsarcin-1 in yeast two-hybrid and GST
    pull-down assays, whereas the DCM-associated alleles impaired binding to
    MLP, titin, and calsarcin-1. Because calsarcin tethers calcineurin — a
    canonical pro-hypertrophic phosphatase — to the Z-disc, a gain of
    telethonin-calsarcin interaction is the proposed route from a Z-disc
    scaffolding change to hypertrophic growth. This remains EMERGING and
    contested: the assays were qualitative, no downstream calcineurin readout
    was measured in the original work, no independent group has replicated the
    binding result, and ClinGen states outright that the disease mechanism is
    unknown.
  evidence:
  - reference: PMID:15582318
    reference_title: Tcap gene mutations in hypertrophic cardiomyopathy and dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      It was demonstrated by the qualitative assays that the HCM-associated
      mutations augment the ability of Tcap to interact with titin and
      calsarcin-1, whereas the DCM-associated mutations impair the interaction
      of Tcap with MLP, titin, and calsarcin-1.
    explanation: >-
      The primary in vitro basis for the gain-of-interaction model and for the
      HCM-versus-DCM directional split. Evidence source is IN_VITRO because the
      result comes from yeast two-hybrid and GST pull-down competition assays.
  - reference: PMID:15582318
    reference_title: Tcap gene mutations in hypertrophic cardiomyopathy and dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These observations suggest that the difference in clinical phenotype (HCM
      or DCM) may be correlated with the property of altered binding among the
      Z-disc components.
    explanation: >-
      The authors state the hypothesis in their own hedged terms ("may be
      correlated"), which is why this group is EMERGING rather than CANONICAL.
      Evidence source is OTHER because the quote is the paper's interpretive
      conclusion rather than a measurement.
  - reference: CGGV:assertion_c35abc20-c04c-49ec-af02-1bd270b0b50b-2022-09-14T160000.000Z
    reference_title: "TCAP / hypertrophic cardiomyopathy (Disputed)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: "The mechanism for disease is unknown."
    explanation: >-
      ClinGen's expert-panel judgement that no disease mechanism is established
      for TCAP-HCM. Recorded as REFUTE against the claim that this model is
      settled; it is the reason the hypothesis is not marked CANONICAL.
pathophysiology:
- name: Telethonin Z-Disc Titin-Capping and Stretch-Sensor Perturbation
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: HYPOTHETICAL
  description: >-
    TCAP encodes telethonin, a small Z-disc protein that assembles with the
    N-terminal immunoglobulin domains of two antiparallel titin molecules,
    capping the Z-disc end of titin and nucleating a signalosome that also
    contains muscle LIM protein (MLP/CSRP3), the calsarcins, and — as more
    recently shown — nesprin-2 and FHL-2. This complex, not the contractile
    filaments, is the proposed proximal lesion: the HCM-associated alleles
    reported to date (T137I, R153H, C57W, and one p.Glu12fs frameshift) change
    how telethonin engages its Z-disc partners rather than removing the protein
    from the sarcomere. The trigger is deliberately tagged HYPOTHETICAL: no
    functional assay has established pathogenicity for any of these alleles.

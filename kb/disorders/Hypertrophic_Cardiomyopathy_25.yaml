  evidence:
  - reference: PMID:19035361
    reference_title: Diagnostic yield, interpretation, and clinical utility of mutation screening of sarcomere encoding genes in Danish hypertrophic cardiomyopathy patients and relatives.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In relatives, 29.9% of mutation carriers did not fulfil any clinical
      diagnostic criterion, and in 37.5% of relatives without a mutation, one or
      more criteria was fulfilled.
    explanation: >-
      Quantifies the genotype-phenotype discordance that makes ongoing clinical
      surveillance necessary alongside (not instead of) genetic testing.
differential_diagnoses:
- name: Myofilament (sarcomeric) hypertrophic cardiomyopathy
  description: >-
    The definitive HCM genes — MYBPC3, MYH7, TNNT2, TNNI3, TPM1, ACTC1, MYL2,
    MYL3 — account for the overwhelming majority of genotyped HCM and are
    clinically indistinguishable from the reported TCAP cases. This is the
    primary differential and, given the Disputed status of TCAP, the more likely
    explanation whenever both are on the table.
  distinguishing_features:
  - Only genotype separates them; MLP/TCAP-associated HCM clinically mimics myofilament HCM.
  - Septal contour differs at the class level (Z-disc HCM sigmoidal, myofilament HCM more often reverse-curvature), but this is a group tendency, not a patient-level discriminator.
  - A definitive-gene variant in the same patient should be regarded as the diagnosis; TCAP co-occurrence with a pathogenic TNNI3 variant is documented.
  disease_term:
    preferred_term: familial hypertrophic cardiomyopathy
    term:
      id: MONDO:0024573
      label: familial hypertrophic cardiomyopathy
  evidence:
  - reference: PMID:16352453
    reference_title: Genotype-phenotype relationships involving hypertrophic cardiomyopathy-associated mutations in titin, muscle LIM protein, and telethonin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MLP/TCAP-HCM phenotypically mirrors myofilament-HCM and is more severe
      than the subset of patients who still remain without a disease
    explanation: Establishes that phenotype alone cannot separate TCAP-attributed HCM from sarcomeric HCM.
- name: TCAP-related autosomal recessive limb-girdle muscular dystrophy (LGMD R7/2G)
  description: >-
    The best-evidenced TCAP disease is skeletal, not cardiac: ClinGen classifies
    TCAP-LGMD as Definitive, with biallelic loss of function as the expected
    mechanism. Most reported TCAP variants in the literature belong to this
    entity. It is listed here specifically as a named-entity-confusion guard: a
    TCAP paper or variant record is far more likely to be about LGMD R7 than
    about CMH25.
  distinguishing_features:
  - Autosomal recessive with biallelic loss-of-function alleles, versus heterozygous (mostly missense) alleles in the cardiac reports.
  - Presents with progressive proximal muscle weakness in the second decade and raised creatine kinase, not with unexplained left ventricular hypertrophy.
  - ClinGen validity is Definitive for LGMD versus Disputed for hypertrophic cardiomyopathy.
  disease_term:
    preferred_term: autosomal recessive limb-girdle muscular dystrophy type 2G
    term:
      id: MONDO:0011170
      label: autosomal recessive limb-girdle muscular dystrophy type 2G
  evidence:
  - reference: CGGV:assertion_f3c6c72e-7c2b-42d4-963b-aeddbbe0e4fc-2024-08-14T190000.000Z
    reference_title: "TCAP / autosomal recessive limb-girdle muscular dystrophy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TCAP | HGNC:11610 | autosomal recessive limb-girdle muscular dystrophy |
      MONDO:0015152 | AR | Definitive
    explanation: >-
      ClinGen classifies the TCAP-LGMD relationship as Definitive with autosomal
      recessive inheritance, in contrast to the Disputed autosomal dominant
      cardiac claim.
  - reference: CGGV:assertion_f3c6c72e-7c2b-42d4-963b-aeddbbe0e4fc-2024-08-14T190000.000Z
    reference_title: "TCAP / autosomal recessive limb-girdle muscular dystrophy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism for disease is expected to be biallelic loss of function."
    explanation: >-
      The mechanistic contrast that keeps the two entities separate: biallelic
      loss of function in LGMD versus monoallelic missense alleles reported in
      the cardiac literature.
- name: TCAP-related dilated cardiomyopathy
  description: >-
    The same gene has been reported in dilated cardiomyopathy, with ClinGen
    classifying that relationship as Limited. The founding study proposed that
    the direction of the binding change distinguishes the two cardiac
    phenotypes, so the DCM literature is mechanistically adjacent but is a
    different entity and must not be used as evidence for the hypertrophic
    phenotype.
  distinguishing_features:
  - Left ventricular dilation with reduced ejection fraction, versus hypertrophy with preserved ejection fraction.
  - The reported DCM allele (E132Q) impaired telethonin binding to MLP, titin, and calsarcin-1; the HCM alleles augmented binding to titin and calsarcin-1.
  - ClinGen validity is Limited for dilated cardiomyopathy versus Disputed for hypertrophic cardiomyopathy — both weak, but curated separately.
  disease_term:
    preferred_term: dilated cardiomyopathy
    term:
      id: MONDO:0005021
      label: dilated cardiomyopathy
  evidence:
  - reference: CGGV:assertion_4c8ab9d8-919a-443f-b027-5aec92b273d1-2025-04-18T040000.000Z
    reference_title: "TCAP / dilated cardiomyopathy (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TCAP | HGNC:11610 | dilated cardiomyopathy | MONDO:0005021 | AD | Limited
    explanation: >-
      ClinGen curates TCAP-DCM separately from TCAP-HCM, at a different
      (Limited) validity level.
  - reference: PMID:15582318
    reference_title: Tcap gene mutations in hypertrophic cardiomyopathy and dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the DCM-associated mutations impair the interaction of Tcap with MLP,
      titin, and calsarcin-1
    explanation: >-
      The proposed molecular basis for separating the dilated from the
      hypertrophic TCAP phenotype.
progression:
- phase: Genotype-positive, phenotype-negative relative
  notes: >-
    A relative found to carry a TCAP variant during cascade testing is in an
    unusually uncertain position, because the gene-disease relationship itself
    is Disputed: the variant may carry no risk at all. Danish HCM family data
    show that clinical criteria and mutation status disagree in both directions,
    so surveillance should be driven by family phenotype rather than by the TCAP
    result.
  evidence:
  - reference: PMID:19035361
    reference_title: Diagnostic yield, interpretation, and clinical utility of mutation screening of sarcomere encoding genes in Danish hypertrophic cardiomyopathy patients and relatives.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In relatives, 29.9% of mutation carriers did not fulfil any clinical
      diagnostic criterion
    explanation: >-
      Documents genotype-positive phenotype-negative status as a common state in
      HCM families. PARTIAL because the figure is panel-wide, not TCAP-specific.
- phase: Late-onset overt hypertrophic cardiomyopathy
  notes: >-
    In the only co-segregating family reported, both affected members declared
    late, with moderate asymmetric hypertrophy, atrial fibrillation, and
    preserved-EF heart failure, and were assessed as at low risk of sudden
    cardiac death.
  evidence:
  - reference: PMID:32565061
    reference_title: Identification of a novel titin-cap/telethonin mutation in a Portuguese family with hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both affected members of this family presented with late-onset HCM,
      moderate asymmetric left ventricular hypertrophy, atrial fibrillation and
      heart failure with preserved ejection fraction and low risk of sudden
      cardiac death.
    explanation: The only description of onset timing and risk profile in a TCAP HCM family.
- phase: Progression to advanced heart failure
  notes: >-
    At the severe end of the reported spectrum, a frameshift carrier with
    restrictive-phenotype HCM deteriorated over roughly a year despite treatment
    and was listed for transplantation. Whether this trajectory is
    TCAP-attributable or coincidental cannot be determined from one case.
  evidence:
  - reference: PMID:40330574
    reference_title: "Mutations in the TCAP gene may lead to restrictive phenotype hypertrophic cardiomyopathy with poor prognosis: case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite interventions, the patient's cardiac function progressively
      deteriorated, leading to his placement on the heart transplant waiting
      list 1 year later.
    explanation: Documents the severe end of the reported outcome range.
treatments:
- name: Genetic Counseling and Family Evaluation
  description: >-
    Counseling must convey that TCAP-HCM is a Disputed gene-disease relationship:
    a TCAP variant is not, on current evidence, a basis for predictive testing or
    for reassuring a variant-negative relative. Family evaluation should proceed
    on the standard nonsyndromic-HCM footing, driven by phenotype.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301725
    reference_title: Nonsyndromic Hypertrophic Cardiomyopathy Overview.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Inform genetic counseling of family members of an individual with nonsyndromic HCM."
    explanation: >-
      GeneReviews establishes family genetic counseling as a core component of
      nonsyndromic HCM care. Evidence source is OTHER because GeneReviews is an
      expert-authored review resource.
  - reference: CGGV:assertion_c35abc20-c04c-49ec-af02-1bd270b0b50b-2022-09-14T160000.000Z
    reference_title: "TCAP / hypertrophic cardiomyopathy (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      has been DISPUTED. More evidence is needed to either support or entirely
      refute the role
    explanation: >-
      The validity statement that has to be communicated in counseling before a
      TCAP result is used for any family decision.
- name: Anticoagulation for Atrial Fibrillation
  description: >-
    Atrial fibrillation is curated as a phenotype of this entity - it occurred in
    both affected carriers of the Portuguese p.C57W allele, and biatrial
    enlargement was present in the frameshift proband - and in hypertrophic
    cardiomyopathy its presence is itself the indication for anticoagulation,
    rather than being filtered through the risk scores used in atrial
    fibrillation without a cardiomyopathy substrate. It is recorded here because
    it is the management consequence of a phenotype this entry already asserts,
    and because applying the ordinary risk-score gate is a common and
    consequential error.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anticoagulant agent
      term:
        id: NCIT:C263
        label: Anticoagulant Agent
  target_phenotypes:
  - preferred_term: Atrial fibrillation
    term:
      id: HP:0005110
      label: Atrial fibrillation
  evidence:
  - reference: PMID:32565061
    reference_title: Identification of a novel titin-cap/telethonin mutation in a Portuguese family with hypertrophic cardiomyopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "moderate asymmetric left ventricular hypertrophy, atrial fibrillation and heart failure with preserved ejection fraction"
    explanation: >-
      Documents the atrial fibrillation that constitutes the indication. PARTIAL
      because the source records the arrhythmia and does not report
      anticoagulation, its outcome, or any thromboembolic event in these
      carriers.
  notes: >-
    Deliberately unsourced at the TCAP level and bound at drug-class rather than
    agent level. No TCAP-specific anticoagulation study exists, the cited report
    does not state whether these carriers were anticoagulated, and the choice
    between a direct oral anticoagulant and a vitamin K antagonist is not
    genotype-determined. The indication itself is guideline-directed management
    for hypertrophic cardiomyopathy with atrial fibrillation, so no snippet is
    claimed for it. Note this is management of a curated phenotype, not a claim
    that TCAP variants cause thromboembolism.
- name: Heart Transplantation for End-Stage Disease
  description: >-
    For the minority who progress to refractory heart failure despite
    guideline-directed therapy, transplantation is the endpoint of management,
    as in the reported frameshift carrier. There is no TCAP-directed therapy.
  treatment_term:
    preferred_term: heart transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  evidence:
  - reference: PMID:40330574
    reference_title: "Mutations in the TCAP gene may lead to restrictive phenotype hypertrophic cardiomyopathy with poor prognosis: case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "leading to his placement on the heart transplant waiting list 1 year later"
    explanation: Transplant listing as the management endpoint in the one reported severe TCAP HCM case.
discussions:
- discussion_id: tcap_hcm_gene_disease_validity_disputed
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - "pathophysiology#Telethonin Z-Disc Titin-Capping and Stretch-Sensor Perturbation"
  prompt: >-
    Is TCAP a genuine hypertrophic cardiomyopathy gene at all, or is CMH25 an
    artefact of pre-genomic candidate-gene sequencing?
  rationale: >-
    ClinGen's Hereditary Cardiovascular Disease GCEP downgraded TCAP-HCM from
    Limited to Disputed in September 2022. The case-level base is roughly eight
    probands over four publications; no reported variant has functional support;
    one variant (2 probands) is common in the population; two probands carried a
    second variant (a pathogenic TNNI3 variant, and a MYBPC3 VUS). A dedicated
    2023 TCAP screen of 40 Iranian cardiomyopathy patients found no pathogenic
    allele. Dismech curates the entity because MONDO:0011843 exists and clinical
    panels still return TCAP variants, but the whole pathograph in this entry is
    conditional on the association being real, and every node is tagged
    HYPOTHETICAL or PROVISIONAL accordingly.
  proposed_experiments:
  - experiment_id: exp_tcap_hcm_case_control_burden
    name: Case-control rare-variant burden test for TCAP in hypertrophic cardiomyopathy
    description: >-
      Compare the burden of rare TCAP variation in large sequenced hypertrophic
      cardiomyopathy cohorts against ancestry-matched population reference data
      (gnomAD), with the definitive-gene carriers excluded so a residual TCAP
      signal is not confounded by a co-occurring sarcomere variant.
    would_support:
    - A significant excess of rare TCAP variation in cases would move the gene-disease relationship above Disputed.
    would_refute:
    - Absence of excess burden at adequate power would support refuting the association outright.
  - experiment_id: exp_tcap_hcm_isogenic_allele_series
    name: Isogenic human cardiomyocyte allele series for the reported TCAP HCM variants
    description: >-
      Knock the reported alleles (T137I, R153H, C57W, p.Glu12fs) into a common
      hiPSC background and phenotype the derived cardiomyocytes and engineered
      heart tissues for hypertrophy, sarcomere organisation, and relaxation.
    would_support:
    - A reproducible hypertrophic or diastolic phenotype attributable to the allele would supply the missing functional evidence.
    would_refute:
    - Indistinguishable phenotype from isogenic wild type would argue the alleles are benign.
  - experiment_id: exp_tcap_hcm_rephenotyping_published_probands
    name: Contemporary re-sequencing of the published TCAP HCM probands
    description: >-
      Re-analyse the originally reported probands with current
      cardiomyopathy panels or genome sequencing to establish whether a
      better-supported variant in another gene explains each case.
    would_refute:
    - Recovery of a definitive-gene variant in most probands would collapse the residual case-level evidence for TCAP.
  evidence:
  - reference: CGGV:assertion_c35abc20-c04c-49ec-af02-1bd270b0b50b-2022-09-14T160000.000Z
    reference_title: "TCAP / hypertrophic cardiomyopathy (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "As a result of this reevaluation, the classification changed from LIMITED to DISPUTED."
    explanation: The classification change that frames this controversy.
  - reference: PMID:37752589
    reference_title: TCAP gene is not a common cause of cardiomyopathy in Iranian patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggest that the TCAP gene pathogenic mutations might not
      be a common cause of cardiomyopathies among Iranian patients.
    explanation: Independent negative cohort evidence contributing to the dispute.
- discussion_id: tcap_hcm_mechanism_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Altered Z-Disc Signalosome Output"
  prompt: >-
    What, mechanistically, does an HCM-associated TCAP allele do to the
    cardiomyocyte downstream of the Z-disc?
  rationale: >-
    The only mechanistic data are qualitative yeast two-hybrid and GST pull-down
    results from 2004 showing augmented telethonin binding to titin and
    calsarcin-1. Nothing downstream has been measured: no calcineurin activity,
    no NFAT nuclear translocation, no hypertrophic gene program, no
    sarcomere-organisation phenotype, no contractile or relaxation measurement
    in any TCAP-HCM cell, tissue, or animal model. ClinGen states plainly that
    the mechanism is unknown. The Z-disc signalosome node in this entry is
    therefore a placeholder that names the proposed route rather than a
    curated mechanism.
  proposed_experiments:
  - experiment_id: exp_tcap_quantitative_zdisc_binding
    name: Quantitative binding measurement of mutant telethonin with its Z-disc partners
    description: >-
      Replace the original qualitative yeast two-hybrid and pull-down assays
      with quantitative affinity measurements (isothermal titration calorimetry
      or surface plasmon resonance) of mutant versus wild-type telethonin
      against titin Z1Z2, muscle LIM protein, and calsarcin-1.
    would_support:
    - Reproducible, direction-consistent affinity changes would substantiate the gain-of-interaction model.
    would_refute:
    - Affinities indistinguishable from wild type would remove the only mechanistic support for the model.
  - experiment_id: exp_tcap_calcineurin_nfat_readout
    name: Calcineurin-NFAT signalling readout in TCAP knock-in cardiomyocytes
    description: >-
      Measure calcineurin activity, NFAT nuclear translocation, and hypertrophic
      marker gene expression in cardiomyocytes carrying knock-in TCAP HCM
      alleles, closing the untested step between altered calsarcin binding and
      hypertrophic growth.
    would_support:
    - Allele-dependent calcineurin-NFAT activation would convert the placeholder signalosome node into a curated mechanism.
  - experiment_id: exp_tcap_sarcomere_and_relaxation_phenotyping
    name: Sarcomere ultrastructure and relaxation phenotyping in TCAP engineered heart tissue
    description: >-
      Characterise Z-disc ultrastructure by electron microscopy and measure
      active and passive mechanics in engineered heart tissue carrying each
      reported allele, to test whether the human diastolic phenotype is
      reproduced in vitro.
  evidence:
  - reference: CGGV:assertion_c35abc20-c04c-49ec-af02-1bd270b0b50b-2022-09-14T160000.000Z
    reference_title: "TCAP / hypertrophic cardiomyopathy (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism for disease is unknown."
    explanation: Expert-panel confirmation that no mechanism is established.
  - reference: CGGV:assertion_c35abc20-c04c-49ec-af02-1bd270b0b50b-2022-09-14T160000.000Z
    reference_title: "TCAP / hypertrophic cardiomyopathy (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "None of these variants have functional evidence in support of pathogenicity."
    explanation: The absence of allele-level functional data is the concrete gap.
- discussion_id: tcap_mouse_knockout_versus_human_hcm
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - "pathophysiology#Impaired Myocardial Adaptation to Biomechanical Stress"
  prompt: >-
    Does the telethonin-knockout mouse model the human TCAP hypertrophic
    phenotype, given that it is a loss-of-function model that produces
    stress-induced heart failure rather than hypertrophic cardiomyopathy?
  rationale: >-
    The Tcap-null mouse is the only in vivo cardiac model, and it points the
    opposite way from the human cardiac claim on three counts. First, direction
    of effect: the mouse lacks telethonin entirely, whereas the human HCM alleles
    are heterozygous missense changes reported to *augment* Z-disc binding.
    Second, phenotype: the mouse has a structurally and functionally normal heart
    at baseline and decompensates into heart failure with cardiomyocyte apoptosis
    only after biomechanical stress — it does not develop hypertrophic
    cardiomyopathy. Third, the same study explicitly refutes the structural
    premise that telethonin is indispensable for titin anchorage. Any inference
    from this model to CMH25 pathogenesis therefore requires an unstated and
    unverified assumption that loss and gain of Z-disc interaction converge on
    the same disease.
  proposed_experiments:
  - experiment_id: exp_tcap_missense_knockin_mouse
    name: Missense knock-in rather than null mouse model of TCAP cardiomyopathy
    description: >-
      Generate mice carrying the human T137I, R153H, or C57W allele in place of
      a null allele and phenotype for left ventricular hypertrophy, septal
      geometry, and diastolic function.
    would_support:
    - A hypertrophic phenotype in a missense knock-in would establish allele-appropriate in vivo modelling of CMH25.
    would_refute:
    - A normal heart in the knock-in, in contrast to the stressed null, would show the null mouse does not model the human allele.
  - experiment_id: exp_tcap_null_versus_knockin_stress_comparison
    name: Head-to-head stress phenotyping of null versus missense knock-in genotypes
    description: >-
      Subject Tcap-null and missense knock-in animals to identical biomechanical
      stress protocols and compare hypertrophy, apoptosis, and heart-failure
      endpoints, to test whether loss and altered interaction converge.
  - experiment_id: exp_tcap_human_myocardium_p53_apoptosis
    name: p53-dependent apoptosis assessment in human TCAP-variant myocardium
    description: >-
      Examine explanted or biopsy myocardium from a TCAP variant carrier for
      nuclear telethonin accumulation, p53 stabilisation, and cardiomyocyte
      apoptosis, to test whether the murine mechanoptosis route operates in the
      human disease.
  evidence:
  - reference: PMID:21799151
    reference_title: Telethonin deficiency is associated with maladaptation to biomechanical stress in the mammalian heart.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Telethonin knockout mice do not reveal defective heart development or
      heart function under basal conditions, but develop heart failure following
      biomechanical stress
    explanation: >-
      The model phenotype is stress-induced heart failure, not hypertrophic
      cardiomyopathy — the core of the mismatch.
  - reference: PMID:15582318
    reference_title: Tcap gene mutations in hypertrophic cardiomyopathy and dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the HCM-associated mutations augment the ability of Tcap to interact with
      titin and calsarcin-1
    explanation: >-
      The human HCM alleles are reported as gain-of-interaction, the opposite
      direction from the null mouse.
- discussion_id: tcap_hcm_prevalence_and_penetrance_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the prevalence and penetrance of TCAP-attributed hypertrophic
    cardiomyopathy?
  rationale: >-
    Neither is known, and neither can be estimated while the association is
    Disputed. The only figures available are clinic-cohort yields (4 of 389, and
    1 of 239 myofilament-negative probands), which ClinGen has shown are inflated
    by at least one common population variant. No population-based carrier
    frequency, no penetrance estimate, and no natural-history series exist for
    CMH25.
  proposed_experiments:
  - experiment_id: exp_tcap_biobank_carrier_penetrance
    name: Population-biobank carrier frequency and imaging penetrance for TCAP alleles
    description: >-
      Identify carriers of the reported TCAP hypertrophic-cardiomyopathy alleles
      in a population biobank with cardiac magnetic resonance imaging and
      quantify how many show left ventricular hypertrophy, giving an
      ascertainment-free penetrance estimate.
    would_refute:
    - A high carrier frequency with no imaging phenotype would argue the alleles are benign population variation.
  - experiment_id: exp_tcap_registry_natural_history
    name: Multi-registry aggregation of TCAP variant carriers with hypertrophic cardiomyopathy
    description: >-
      Pool TCAP variant carriers across international hypertrophic
      cardiomyopathy registries with standardised phenotyping and follow-up to
      assemble a natural-history series large enough to describe onset, outcome,
      and arrhythmic risk.
  evidence:
  - reference: CGGV:assertion_c35abc20-c04c-49ec-af02-1bd270b0b50b-2022-09-14T160000.000Z
    reference_title: "TCAP / hypertrophic cardiomyopathy (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Furthermore, 1 variant (2 probands) is common in the population (Bos et
      al, 2006, PMID 16352453), and 2 co-occurred with other variants
    explanation: >-
      Shows why the published cohort yields cannot be converted into a
      prevalence estimate.

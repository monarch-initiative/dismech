- name: Cardiomyopathy Multigene Panel or Exome Sequencing
  description: >-
    Molecular testing is what defines this entity, because the clinical
    phenotype mirrors myofilament HCM. TCAP appears on legacy sarcomere/Z-disc
    panels and every reported cardiac allele was found by sequencing after the
    established genes were excluded. Critically, a TCAP variant returned by such
    a panel should NOT by itself be reported as a molecular diagnosis of HCM:
    ClinGen classifies the gene-disease relationship as Disputed, and the
    published variants lack functional support. Look actively for a second,
    better-supported variant — co-occurrence with a pathogenic TNNI3 variant and
    with a MYBPC3 VUS is documented in the TCAP HCM literature.
  diagnosis_term:
    preferred_term: cardiomyopathy multigene panel or exome sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:19035361
    reference_title: Diagnostic yield, interpretation, and clinical utility of mutation screening of sarcomere encoding genes in Danish hypertrophic cardiomyopathy patients and relatives.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Index patients were screened for mutations in all coding regions of 10
      sarcomere genes (MYH7, MYL3, MYBPC3, TNNI3, TNNT2, TPM1, ACTC, CSRP3,
      TCAP, and TNNC1) and five exons of TTN.
    explanation: >-
      Documents TCAP's inclusion on the sarcomere/Z-disc gene panels used for
      HCM family screening.
  - reference: PMID:32565061
    reference_title: Identification of a novel titin-cap/telethonin mutation in a Portuguese family with hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After exclusion of mutations in eleven HCM disease genes, we performed
      direct sequencing of the TCAP gene encoding the Z-disk protein titin-cap
      (also known as telethonin).
    explanation: >-
      Shows the diagnostic position of TCAP: a candidate examined only after the
      established HCM genes are negative.
  - reference: PMID:30681346
    reference_title: Evaluating the Clinical Validity of Hypertrophic Cardiomyopathy Genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classification of HCM genes and variants is critical, as misclassification
      can lead to genetic misdiagnosis.
    explanation: >-
      The interpretive caveat that must accompany a TCAP result on an HCM panel,
      given the Disputed validity classification.
  - reference: CGGV:assertion_c35abc20-c04c-49ec-af02-1bd270b0b50b-2022-09-14T160000.000Z
    reference_title: "TCAP / hypertrophic cardiomyopathy (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Furthermore, 1 variant (2 probands) is common in the population (Bos et
      al, 2006, PMID 16352453), and 2 co-occurred with other variants
    explanation: >-
      The concrete reason to keep looking after a TCAP hit: reported alleles
      include a common population variant and cases with a second,
      better-supported variant elsewhere.

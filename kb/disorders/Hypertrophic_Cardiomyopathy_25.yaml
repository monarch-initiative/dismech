    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Tcap interacts with the calsarcin, which tethers the calcineurin to the Z-disc."
    explanation: >-
      Establishes the telethonin-calsarcin-calcineurin tether that makes a
      hypertrophic signalling output mechanistically plausible. Evidence source
      is OTHER because the statement is background, not a result of this study.
  - reference: PMID:15582318
    reference_title: Tcap gene mutations in hypertrophic cardiomyopathy and dilated cardiomyopathy.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      the HCM-associated mutations augment the ability of Tcap to interact with
      titin and calsarcin-1
    explanation: >-
      The measured binding change that the signalling hypothesis rests on.

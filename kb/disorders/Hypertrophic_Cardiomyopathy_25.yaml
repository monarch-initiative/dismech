  evidence:
  - reference: PMID:15582318
    reference_title: Tcap gene mutations in hypertrophic cardiomyopathy and dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The Z-disc plays a role in establishing the mechanical coupling of
      sarcomeric contraction and stretching, with the titin/Tcap/MLP complex
      serving as a mechanical stretch sensor.
    explanation: >-
      States the normal Z-disc stretch-sensor role of the titin/telethonin/MLP
      complex whose perturbation is the proposed primary lesion. Evidence source
      is OTHER because the quote is the paper's background framing.
  - reference: PMID:16352453
    reference_title: Genotype-phenotype relationships involving hypertrophic cardiomyopathy-associated mutations in titin, muscle LIM protein, and telethonin.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TTN-encoded titin, CSRP3-encoded muscle LIM protein, and TCAP-encoded
      telethonin are Z-disc proteins essential for the structural organization
      of the cardiac sarcomere and the cardiomyocyte's stretch sensor.
    explanation: >-
      Independent statement, from the HCM cohort study itself, that telethonin
      belongs to the Z-disc structural and stretch-sensing apparatus rather than
      the myofilament. Evidence source is OTHER because it is background framing.
  - reference: PMID:21799151
    reference_title: Telethonin deficiency is associated with maladaptation to biomechanical stress in the mammalian heart.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      hypothesized to assemble in a palindromic way with the N-terminal portion
      of titin and to constitute a signalosome participating in the process of
      cardiomechanosensing
    explanation: >-
      Supplies the structural detail of the titin-capping arrangement and the
      signalosome framing. Evidence source is OTHER because the quote is the
      study's stated rationale rather than its result.
  - reference: PMID:15582318
    reference_title: Tcap gene mutations in hypertrophic cardiomyopathy and dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two TCAP mutations, T137I and R153H, were found in patients with HCM, and
      another TCAP mutation, E132Q, was identified in a patient with DCM.
    explanation: >-
      The founding CMH25 observation: two TCAP missense alleles in hypertrophic
      cardiomyopathy probands, distinct from the dilated-phenotype allele in the
      same study.
  - reference: PMID:38569934
    reference_title: Nesprin-2 is a novel scaffold protein for telethonin and FHL-2 in the cardiomyocyte sarcomere.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Importantly, the interactions between these binding partners were impaired
      by mutations in nesprin-2, telethonin, and FHL-2 identified in EDMD with
      DCM and hypertrophic cardiomyopathy patients.
    explanation: >-
      Extends the telethonin Z-disc interactome to nesprin-2 and FHL-2 and shows
      that cardiomyopathy-associated mutations disturb those interactions.
      PARTIAL because the tested mutation set spans EDMD/DCM as well as HCM, so
      the result is not specific to the CMH25 alleles.
  - reference: CGGV:assertion_c35abc20-c04c-49ec-af02-1bd270b0b50b-2022-09-14T160000.000Z
    reference_title: "TCAP / hypertrophic cardiomyopathy (Disputed)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: "None of these variants have functional evidence in support of pathogenicity."
    explanation: >-
      ClinGen's finding that the reported TCAP HCM alleles lack supporting
      functional data. This is why the trigger node carries
      `mechanism_confidence: HYPOTHETICAL` rather than being asserted as
      established.
  - reference: PMID:12507422
    reference_title: The cardiac mechanical stretch sensor machinery involves a Z disc complex that is defective in a subset of human dilated cardiomyopathy.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "MLP interacts with and colocalizes with telethonin (T-cap), a titin interacting protein."
    explanation: >-
      The canonical demonstration that telethonin partners with muscle LIM
      protein in the Z-disc stretch-sensor complex. PARTIAL, and deliberately
      flagged: this study's disease framing is dilated cardiomyopathy, not
      hypertrophic. It is included because ClinGen counts precisely this
      telethonin-CSRP3 interaction among the non-genetic experimental evidence
      it weighed for the TCAP-HCM relationship.
  - reference: CGGV:assertion_c35abc20-c04c-49ec-af02-1bd270b0b50b-2022-09-14T160000.000Z
    reference_title: "TCAP / hypertrophic cardiomyopathy (Disputed)"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      and an interaction with CSRP3 (Knoll et al. 2002, PMID 12507422; Vafiadaki
      et al. 2014, PMID 24860983) which has moderate evidence for HCM
    explanation: >-
      Records that the only experimental support ClinGen credited for the
      TCAP-HCM relationship is expression data plus the telethonin-CSRP3
      interaction — guilt by association with a moderate-evidence HCM gene, not
      direct evidence about TCAP alleles.

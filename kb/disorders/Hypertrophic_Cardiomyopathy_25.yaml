name: Hypertrophic Cardiomyopathy 25
creation_date: "2026-08-01T00:00:00Z"
synonyms:
- CMH25
- TCAP hypertrophic cardiomyopathy
- cardiomyopathy, hypertrophic, 25
- cardiomyopathy, familial hypertrophic, type 25
- hypertrophic cardiomyopathy type 25
description: >-
  Hypertrophic cardiomyopathy 25 (CMH25) is the TCAP-attributed node of the
  hypertrophic cardiomyopathy gene series. TCAP encodes telethonin (titin-cap),
  a 19-kDa Z-disc protein that caps and cross-links the N-terminal (Z1Z2) region
  of two antiparallel titin molecules and nucleates a Z-disc signalosome
  including muscle LIM protein (MLP/CSRP3) and the calsarcins, the complex
  classically proposed to act as the cardiomyocyte biomechanical stretch sensor.
  The lesion is therefore framed at the Z-disc / mechanosensing level rather
  than as a thick- or thin-filament contractile defect: the reported
  HCM-associated missense changes do not abolish telethonin but alter its
  binding behaviour within that complex.

  The entity must be read with an explicit validity caveat. ClinGen's Hereditary
  Cardiovascular Disease Gene Curation Expert Panel classifies the TCAP-HCM
  gene-disease relationship as **Disputed** (downgraded from Limited in
  September 2022): the association rests on missense variants in roughly eight
  probands across four studies, none of the variants has functional evidence
  supporting pathogenicity, one variant is common in the population, two
  co-occurred with variants in other genes, and the disease mechanism is
  unknown. Dismech therefore curates CMH25 as a real MONDO entity whose
  pathophysiology is a *hypothesis under dispute*, not an established mechanism.

  Named-entity caution: TCAP is Definitively associated with autosomal recessive
  limb-girdle muscular dystrophy R7/2G and Limited for dilated cardiomyopathy.
  Every claim in this entry is anchored to a hypertrophic-cardiomyopathy source;
  skeletal-muscle and dilated-phenotype literature is used only where explicitly
  labelled as allelic-series or differential-diagnosis context.
category: Genetic
notes: >-
  MONDO:0011843 carries the OMIM:607487 xref and is unusually multi-parented: it
  is_a `familial hypertrophic cardiomyopathy` (MONDO:0024573), `familial dilated
  cardiomyopathy` (MONDO:0016333), AND `neuromuscular disease caused by
  qualitative or quantitative defects of telethonin` (MONDO:0016192). That triple
  parentage is a direct encoding of the named-entity hazard around this gene: the
  TCAP literature mixes hypertrophic, dilated, and skeletal-muscle (LGMD R7/2G)
  phenotypes, and the gene aliases include both CMD1N and LGMD2G. This entry
  curates the hypertrophic arm only; the dilated and limb-girdle arms are
  represented here solely as differential diagnoses with their own ClinGen
  classifications. None of the three parent terms is currently curated in dismech
  (checked against origin/main at the time of creation).

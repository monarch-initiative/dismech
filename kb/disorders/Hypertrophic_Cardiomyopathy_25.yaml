  description: >-
    Because a TCAP variant cannot carry a genetic diagnosis on its own,
    phenotype-based family evaluation retains primacy: clinical assessment with
    ECG and echocardiography in first-degree relatives, repeated over time.
    Danish HCM family-screening data show mutation status and clinical criteria
    disagree substantially in both directions, which is exactly the situation in
    a Disputed-gene family.

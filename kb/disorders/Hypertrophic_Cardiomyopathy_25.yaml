- name: Altered Z-Disc Signalosome Output
  biological_scale: CELLULAR
  role: amplifier
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The proposed intracellular consequence of a mis-binding telethonin is a
    change in the signalling output of the Z-disc, not a change in force
    production. Telethonin binds calsarcin, and calsarcin tethers the
    pro-hypertrophic phosphatase calcineurin to the Z-disc; the two
    HCM-associated alleles increased telethonin's affinity for titin and
    calsarcin-1 in vitro, which is the proposed route to a hypertrophic
    transcriptional program. No calcineurin, NFAT, or hypertrophy readout has
    been measured in any TCAP-HCM model, so this node is a mechanistic
    placeholder held together by protein-interaction data alone.
  cell_types:
  - preferred_term: Cardiomyocyte

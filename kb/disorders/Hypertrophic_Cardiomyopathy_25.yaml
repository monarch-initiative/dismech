  - reference: PMID:37752589
    reference_title: TCAP gene is not a common cause of cardiomyopathy in Iranian patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic mutations in TCAP may cause diseases including limb-girdle
      muscular dystrophy 2G (LGMD-2G), DCM, HCM, intestinal pseudo-obstruction,
      and telethonin deficiency. However, a large number of affected patients
      were clinically diagnosed with limb-girdle 2G compared to other presenting

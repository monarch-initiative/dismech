- name: Investigational Intrathecal scAAV9-GM2A Gene Therapy (Preclinical)
  therapeutic_modality: GENE_THERAPY
  description: >-
    Preclinical intrathecal self-complementary AAV9 gene replacement therapy (scAAV9.hGM2A)
    delivering a functional human GM2A transgene achieved widespread central nervous system
    transduction and dose-dependent biochemical reduction of brain GM2 ganglioside storage in
    Gm2a-/- mice without significant chronic toxicity; human clinical trials for GM2A have not
    yet been initiated (clinical GM2 gene therapy trials such as TSHA-101 and AXO-AAV-GM2
    target HEXA/HEXB rather than GM2A).
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: GM2 Activator Protein Deficiency
    treatment_effect: RESTORES
    description: Delivers a functional human GM2A transgene to central nervous system cells to restore GM2 activator protein expression.
  - target: Neuronal GM2 Ganglioside Accumulation
    treatment_effect: INHIBITS
    description: Restored GM2 activator protein cofactor activity reduces brain GM2 ganglioside storage.
  evidence:
  - reference: PMID:37298170
    reference_title: "Biochemical Correction of GM2 Ganglioside Accumulation in AB-Variant GM2 Gangliosidosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In this study, we show that intrathecal delivery of self-complementary adeno-associated virus serotype-9 (scAAV9) harbouring a functional human GM2A transgene (scAAV9.hGM2A) can prevent GM2 accumulation in in GM2AP-deficient mice (Gm2a-/- mice)."
    explanation: "Demonstrates preclinical biochemical prevention of brain GM2 ganglioside accumulation by intrathecal scAAV9.hGM2A in Gm2a-/- mice."
  - reference: PMID:37298170
    reference_title: "Biochemical Correction of GM2 Ganglioside Accumulation in AB-Variant GM2 Gangliosidosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Taken together, these data provide proof-of-principle that scAAV9.hGM2A can stably deliver human GM2A transgene to the brain when administered intrathecally, and biochemically reduce GM2 accumulation associated with loss of function of GM2AP in a mouse model of ABGM2."
    explanation: "Establishes intrathecal scAAV9.hGM2A as a proof-of-principle gene replacement strategy for GM2 activator deficiency."
animal_models:
- name: Gm2a knockout mouse (Gm2a-/-)
  species: Mouse
  genotype: Gm2a-/-
  description: >-
    Single-knockout Gm2a-/- mice lack GM2 activator protein and accumulate moderate brain GM2
    ganglioside with mild behavioral/motor deficits and a normal lifespan (~92 weeks),
    modeling mild adult-onset rather than acute infantile human disease because murine
    neuraminidase 3 (NEU3) mediates an alternative sialidase-dependent GM2 degradation bypass.
  modeled_mechanisms:
  - target: Neuronal GM2 Ganglioside Accumulation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Accumulates moderate brain GM2 ganglioside attenuated by compensatory murine NEU3 sialidase catabolism.
    limitations: >-
      Murine neuraminidase 3 (NEU3) converts GM2 via an alternate sialidase pathway that is
      more prominent in mice than in humans, limiting GM2 storage and preventing severe
      neurodegeneration or early lethality.
    evidence:
    - reference: PMID:38098938
      reference_title: "Characterization of a phenotypically severe animal model for human AB-Variant GM2 gangliosidosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Gm2a-/- mice are commonly used as a model of ABGM2. These mice are characterized by phenotypes most representative of predicted adult-onset form of ABGM2, which include moderate GM2 accumulation and mild neurological defects. This mild phenotype has been attributed to compensation by alternative GM2 degradation pathways mediated by sialidase, neuraminidase 3 (NEU3), a pathway that is more prominent in mice than humans."
      explanation: "Explains why single-knockout Gm2a-/- mice only partially recapitulate human GM2 storage and clinical severity."
  evidence:
  - reference: PMID:38098938
    reference_title: "Characterization of a phenotypically severe animal model for human AB-Variant GM2 gangliosidosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Gm2a-/- mice are commonly used as a model of ABGM2. These mice are characterized by phenotypes most representative of predicted adult-onset form of ABGM2, which include moderate GM2 accumulation and mild neurological defects. This mild phenotype has been attributed to compensation by alternative GM2 degradation pathways mediated by sialidase, neuraminidase 3 (NEU3), a pathway that is more prominent in mice than humans."
    explanation: "Characterizes the classic Gm2a-/- mouse model and its murine NEU3 bypass limitation."
- name: Gm2a/Neu3 double-knockout mouse (Gm2a-/-Neu3-/-)
  species: Mouse
  genotype: Gm2a-/-Neu3-/-
  description: >-
    Double-knockout Gm2a-/-Neu3-/- mice ablating both Gm2a and the compensatory murine Neu3
    sialidase bypass accumulate 3- to 4-fold more brain GM2 ganglioside than Gm2a-/- mice and
    develop progressive tremor, ataxic gait, impaired rotarod coordination and locomotion,
    weight loss, widespread CNS vacuolization, and shortened survival averaging 27 weeks.
  modeled_mechanisms:
  - target: Neuronal GM2 Ganglioside Accumulation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Ablating compensatory Neu3 unmasks severe central nervous system GM2 ganglioside accumulation comparable to Hexb-/- Sandhoff mice.
    evidence:
    - reference: PMID:38098938
      reference_title: "Characterization of a phenotypically severe animal model for human AB-Variant GM2 gangliosidosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, knocking out Neu3 in Gm2a−/− backgrounds resulted in a striking increase (approximately 3- to 4-fold) in GM2 levels relative to Gm2a−/− mice."
      explanation: "Demonstrates severe brain GM2 ganglioside accumulation when the murine Neu3 bypass is removed."
  - target: Progressive Central Nervous System Neuronal Degeneration
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Recapitulates severe progressive motor decline, ataxia, CNS vacuolization, and premature lethality averaging 27 weeks.
    evidence:
    - reference: PMID:38098938
      reference_title: "Characterization of a phenotypically severe animal model for human AB-Variant GM2 gangliosidosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Double knockout mice lived an average of 27.0 ± 1.5 (mean ± SD) weeks, compared to Gm2a−/− mice, which lived a relatively normal lifespan that averaged 91.9 ± 9.8 weeks."
      explanation: "Confirms severely shortened lifespan in Gm2a-/-Neu3-/- double-knockout mice compared with Gm2a-/- mice."
  evidence:
  - reference: PMID:38098938
    reference_title: "Characterization of a phenotypically severe animal model for human AB-Variant GM2 gangliosidosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Double knockout mice lived an average of 27.0 ± 1.5 (mean ± SD) weeks, compared to Gm2a−/− mice, which lived a relatively normal lifespan that averaged 91.9 ± 9.8 weeks."
    explanation: "Establishes Gm2a-/-Neu3-/- mice as a phenotypically severe preclinical model of AB-variant GM2 gangliosidosis."
definitions:
- name: Clinical case definition of Tay-Sachs disease AB variant
  definition_type: CASE_DEFINITION
  description: >-
    Tay-Sachs disease AB variant is a GM2 gangliosidosis caused by biallelic GM2A variants
    abolishing the GM2 activator protein, producing neuronal GM2 ganglioside accumulation
    and a Tay-Sachs-like neurodegenerative phenotype despite normal hexosaminidase A and B
    enzyme activity.
  scope: Disease-level case definition for GM2 activator deficiency.
  evidence:
  - reference: PMID:27402091
    reference_title: "GM2 gangliosidosis AB variant: novel mutation from India - a case report with a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GM2 gangliosidosis-AB variants a rare autosomal recessive neurodegenerative disorder occurring due to deficiency of GM2 activator protein"
    explanation: "Anchors the case definition in GM2 activator protein deficiency."

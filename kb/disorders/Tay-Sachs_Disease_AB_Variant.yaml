treatments:
- name: Multidisciplinary Supportive Care
  therapeutic_modality: OTHER
  description: >-
    No disease-modifying therapy is approved for GM2 activator deficiency; management is
    multidisciplinary and supportive, focusing on adequate nutrition and hydration, airway
    protection and positioning to prevent aspiration during feedings, infection management,
    periodic multidisciplinary surveillance, and antiseizure therapy titrated to avoid
    excessive sedation.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care

name: Tay-Sachs Disease AB Variant
creation_date: "2026-06-13T00:00:00Z"
description: >-
  Tay-Sachs disease AB variant (GM2 gangliosidosis AB variant, GM2 activator deficiency)
  is an ultra-rare autosomal recessive neuronopathic lysosomal storage disease caused by
  biallelic loss-of-function variants in GM2A encoding the GM2 ganglioside activator
  protein (GM2AP). Although beta-hexosaminidase A and B enzyme activities are normal on
  routine synthetic-substrate assays, absence of the activator cofactor prevents
  hexosaminidase A from extracting and hydrolyzing membrane-bound GM2 ganglioside, which
  accumulates in central and retinal neurons. Acute infantile disease presents between four
  and 12 months with hypotonia, developmental plateau and rapid regression, hyperacusis,
  nystagmus, macular cherry-red spot, and worsening seizures, whereas rare hypomorphic
  genotypes can present in adolescence or adulthood with spinocerebellar ataxia and lower
  limb motor weakness. Diagnosis requires GM2A molecular genetic testing (including
  copy-number evaluation) because routine hexosaminidase assays are normal.
category: Mendelian

- name: Progressive Central Nervous System Neuronal Degeneration
  conforms_to: "lysosomal_substrate_accumulation#Storage-Cell Cytotoxicity and Neuroinflammation"
  biological_scale: TISSUE
  description: >-
    Progressive GM2 storage-induced neuronal degeneration across cerebral cortex, basal ganglia,
    thalamus, brainstem, cerebellum, and spinal motor neurons drives acute infantile
    neurodevelopmental arrest, progressive weakness, rapid regression, hypotonia, hyperacusis,
    ocular motor abnormalities, dysphagia, decerebrate posturing, and refractory seizures—or,
    with residual hypomorphic GM2AP function, childhood/adult-onset spinocerebellar ataxia and
    lower-limb motor weakness.

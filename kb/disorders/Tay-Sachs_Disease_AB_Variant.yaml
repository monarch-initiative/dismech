    diagnosis row below; no cited source describes a distinct biochemical
    GM2 activator functional assay being run (the quoted evidence below
    says normal enzyme activity prompts investigation for the GM2
    activator protein, which this entry's own evidence resolves through
    GM2A sequencing, not a separate activator assay), so no activator Part
    code is bound here. No reference_ranges band is recorded: the finding
    is qualitative (normal vs. deficient), not a numeric cut-off.
  evidence:
  - reference: PMID:27402091
    reference_title: "GM2 gangliosidosis AB variant: novel mutation from India - a case report with a review."
    supports: SUPPORT

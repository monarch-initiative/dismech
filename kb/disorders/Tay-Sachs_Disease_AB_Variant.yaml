pathophysiology:
- name: GM2 Activator Protein Deficiency
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency"
  biological_scale: MOLECULAR
  description: >-
    Biallelic pathogenic variants in GM2A abolish or impair the GM2 activator protein
    (GM2AP), a non-enzymatic lysosomal lipid-transfer cofactor required to solubilize
    membrane-bound GM2 ganglioside and present it to beta-hexosaminidase A. Unlike HEXA
    (Tay-Sachs) and HEXB (Sandhoff) deficiencies, beta-hexosaminidase A and B catalytic
    proteins remain intact.
  gene:
    preferred_term: GM2A
    term:
      id: hgnc:4367
      label: GM2A
  cellular_components:
  - preferred_term: lysosome
    term:
      id: GO:0005764
      label: lysosome
  molecular_functions:
  - preferred_term: sphingolipid activator protein activity
    term:
      id: GO:0030290
      label: sphingolipid activator protein activity
    modifier: DECREASED
  evidence:
  - reference: PMID:35925454
    reference_title: "GM2 gangliosidosis AB variant: first case of late onset and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two mutations in the GM2A gene encoding the GM2 activator protein (GM2-AP), an essential co-factor of hexosaminidase A"
    explanation: "GM2A encodes the GM2 activator protein, an essential cofactor of hexosaminidase A."
  downstream:
  - target: Impaired Hexosaminidase A-Mediated GM2 Ganglioside Hydrolysis
    causal_link_type: DIRECT
    description: Loss of GM2 activator protein prevents presentation of membrane GM2 ganglioside to beta-hexosaminidase A in the lysosome.
- name: Impaired Hexosaminidase A-Mediated GM2 Ganglioside Hydrolysis
  biological_scale: MOLECULAR
  description: >-
    In the absence of functional GM2AP, intact beta-hexosaminidase A cannot access or cleave
    physiological GM2 ganglioside in lysosomal membranes, blocking the obligate catabolic
    step of GM2 degradation despite normal in vitro activity against water-soluble synthetic
    substrates.
  cellular_components:
  - preferred_term: lysosome
    term:
      id: GO:0005764
      label: lysosome
  biological_processes:
  - preferred_term: ganglioside catabolic process
    modifier: DECREASED
    term:
      id: GO:0006689
      label: ganglioside catabolic process
  chemical_entities:
  - preferred_term: GM2 ganglioside
    term:
      id: CHEBI:141420
      label: ganglioside GM2 (natural compound)
  evidence:
  - reference: PMID:27402091
    reference_title: "GM2 gangliosidosis AB variant: novel mutation from India - a case report with a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Children with phenotypic presentation as GM2 gangliosidosis (Tay-Sachs or Sandhoff disease) and normal enzyme activity of β-hexosaminidase-A and -B in leucocytes need to be investigated for GM2 activator protein deficiency."
    explanation: "Demonstrates that GM2 activator deficiency blocks physiological GM2 degradation while sparing leukocyte beta-hexosaminidase A and B enzymatic activity."
  downstream:
  - target: Neuronal GM2 Ganglioside Accumulation
    causal_link_type: DIRECT
    description: Blocked lysosomal GM2 ganglioside hydrolysis causes progressive intralysosomal accumulation of undegraded GM2 in neurons.

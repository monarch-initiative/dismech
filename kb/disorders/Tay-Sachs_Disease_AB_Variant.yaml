diagnosis:
- name: Hexosaminidase enzyme assay with GM2A sequencing
  diagnosis_term:
    preferred_term: clinical laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  presence: NORMAL
  description: >-
    A GM2 gangliosidosis phenotype with normal hexosaminidase A and B activity is the key
    clue; diagnosis is confirmed by GM2A sequencing (with copy-number analysis, as exon
    deletions can be missed).
  markers: Normal beta-hexosaminidase A and B activity with a GM2 gangliosidosis phenotype.
  measurements:
  - preferred_term: Hexosaminidase A activity
    term:
      id: LOINC:LP14296-5
      label: Beta-N-acetylhexosaminidase.A
  notes: >-
    A LOINC code identifies the measurement performed, not its result:
    bound LOINC:LP14296-5 (Beta-N-acetylhexosaminidase.A) because this
    row's own test is the hexosaminidase A/B enzyme assay itself -- the
    diagnostic finding in this disease is that the result comes back
    normal, which the row's own markers field already states. Confirmatory
    GM2A sequencing is a
    separate test, captured in the "GM2A molecular genetic testing"
    diagnosis row below; no cited source describes a distinct biochemical
    GM2 activator functional assay being run (the quoted evidence below
    says normal enzyme activity prompts investigation for the GM2
    activator protein, which this entry's own evidence resolves through
    GM2A sequencing, not a separate activator assay), so no activator Part
    code is bound here. No reference_ranges band is recorded: the finding
    is qualitative (normal vs. deficient), not a numeric cut-off.
  evidence:

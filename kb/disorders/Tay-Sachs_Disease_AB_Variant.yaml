progression:
- phase: Acute infantile neurodegenerative course
  age_range: 4 months to 2-3 years
  notes: >-
    Affected infants are generally normal at birth, develop progressive weakness and slowing of
    developmental progress between 4 and 12 months followed by developmental plateau and rapid
    regression, progress to decerebrate posturing, dysphagia, worsening seizures, and an
    unresponsive vegetative state in the second year of life, with death usually occurring
    between 2 and 3 years of age.
  evidence:
  - reference: PMID:36007105
    reference_title: "GM2 Activator Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acute infantile GM2 activator deficiency is a neurodegenerative disorder in which infants, who are generally normal at birth, have progressive weakness and slowing of developmental progress between ages four and 12 months."
    explanation: "Establishes typical symptom onset between 4 and 12 months in acute infantile GM2 activator deficiency."
  - reference: PMID:36007105
    reference_title: "GM2 Activator Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Death usually occurs between ages two and three years."
    explanation: "Establishes typical survival to ages 2 to 3 years in acute infantile GM2 activator deficiency."
- phase: Juvenile and late-onset course
  age_range: Childhood to adulthood
  notes: >-
    Rare individuals with hypomorphic GM2A missense variants present in childhood or
    adolescence (symptom onset at age 10 years in the index late-onset proband) with slowly
    progressive lower-limb motor neuronopathy and spinocerebellar ataxia surviving into
    adulthood.
  evidence:
  - reference: PMID:35925454
    reference_title: "GM2 gangliosidosis AB variant: first case of late onset and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our proband is a 22-year-old male with spinocerebellar ataxia and lower limbs motor deficiency. His symptoms started at the age of 10."
    explanation: "Documents childhood/juvenile symptom onset at age 10 years with survival into adulthood in hypomorphic GM2 activator deficiency."

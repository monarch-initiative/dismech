name: PGM2L1 Deficiency
category: Mendelian
creation_date: '2026-07-06T00:00:00Z'
synonyms:
- PGM2L1-related neurodevelopmental disorder
- Glucose-1,6-bisphosphate synthase deficiency
description: 'PGM2L1 deficiency is an ultra-rare autosomal recessive neurodevelopmental disorder caused
  by bi-allelic inactivating variants in PGM2L1, which encodes a paralog of phosphoglucomutase 2 that
  synthesizes glucose-1,6-bisphosphate and other sugar bisphosphates. PGM2L1 is highly expressed in the
  brain, where it accounts for locally elevated glucose-1,6-bisphosphate concentrations. Loss of PGM2L1
  function markedly reduces glucose-1,6-bisphosphate and other sugar bisphosphates in patient fibroblasts,
  but residual concentrations remain sufficient to maximally stimulate phosphomutases, so protein glycosylation
  (assessed via LAMP2 and serum transferrin) is normal; the disorder is therefore not a glycosylation
  defect. The condition was first described in 2021 in four children with severe developmental and speech
  delay, dysmorphic facial features, ear anomalies, high arched palate, strabismus, hypotonia, and keratosis
  pilaris, with early obesity and seizures in most. Subsequent case reports have reported additional pediatric
  and adult cases, expanding the phenotypic spectrum.

  '
disease_term:
  preferred_term: PGM2L1-related neurodevelopmental disorder
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0700092
      label: neurodevelopmental disorder
    mapping_predicate: skos:broadMatch
    mapping_source: curator
    mapping_justification: No PGM2L1-specific MONDO class exists, so this entry is recorded as a member
      of the broad neurodevelopmental disorder class rather than bound to it on disease_term, which would
      assert identity with every neurodevelopmental disorder in MONDO.
notes: 'No PGM2L1-specific MONDO term exists in the local MONDO release as of 2026-07-06 (verified via
  `runoak -i sqlite:obo:mondo search "PGM2L1"` and by OMIM/synonym cross-check); OMIM:611610 is the PGM2L1
  gene MIM, not a distinct phenotype MIM, and no phenotype MIM has been assigned. No Orphanet entry was
  found either. Pending a MONDO new-term request, disease_term carries only the gene-specific `preferred_term`,
  and the broad parent class MONDO:0700092 (neurodevelopmental disorder) is recorded as a `skos:broadMatch`
  mapping. A 2026-10-23 OLS search of MONDO for "PGM2L1" still returned no disease class. Only three publications
  describe human cases to date: the original 4-patient series (PMID:33979636), a single-patient follow-up
  case report (PMID:41776821), and a 2-sibling adult-phenotype report (PMID:41178743). Given this very
  small evidence base, this entry is deliberately lean and limited to phenotypes and mechanistic claims
  explicitly stated in these sources.'

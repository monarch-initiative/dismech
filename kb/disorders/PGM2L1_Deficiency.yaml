name: PGM2L1 Deficiency
category: Mendelian
creation_date: "2026-07-06T00:00:00Z"
synonyms:
- PGM2L1-related neurodevelopmental disorder
- Glucose-1,6-bisphosphate synthase deficiency
description: >
  PGM2L1 deficiency is an ultra-rare autosomal recessive neurodevelopmental
  disorder caused by bi-allelic inactivating variants in PGM2L1, which encodes
  a paralog of phosphoglucomutase 2 that synthesizes glucose-1,6-bisphosphate
  and other sugar bisphosphates. PGM2L1 is highly expressed in the brain, where
  it accounts for locally elevated glucose-1,6-bisphosphate concentrations.
  Loss of PGM2L1 function markedly reduces glucose-1,6-bisphosphate and other
  sugar bisphosphates in patient fibroblasts, but residual concentrations
  remain sufficient to maximally stimulate phosphomutases, so protein
  glycosylation (assessed via LAMP2 and serum transferrin) is normal; the
  disorder is therefore not a glycosylation defect. The condition was first
  described in 2021 in four children with severe developmental and speech
  delay, dysmorphic facial features, ear anomalies, high arched palate,
  strabismus, hypotonia, and keratosis pilaris, with early obesity and
  seizures in most. Subsequent case reports have reported additional
  pediatric and adult cases, expanding the phenotypic spectrum.
disease_term:
  preferred_term: PGM2L1-related neurodevelopmental disorder
  term:
    id: MONDO:0700092
    label: neurodevelopmental disorder
notes: >-
  No PGM2L1-specific MONDO term exists in the local MONDO release as of
  2026-07-06 (verified via `runoak -i sqlite:obo:mondo search "PGM2L1"` and
  by OMIM/synonym cross-check); OMIM:611610 is the PGM2L1 gene MIM, not a
  distinct phenotype MIM, and no phenotype MIM has been assigned. No Orphanet
  entry was found either. This entry is provisionally grounded to the broad
  parent class MONDO:0700092 (neurodevelopmental disorder) pending a MONDO
  new-term request; `preferred_term` carries the fully specific gene-related
  name. Only three publications describe human cases to date: the original
  4-patient series (PMID:33979636), a single-patient follow-up case report
  (PMID:41776821), and a 2-sibling adult-phenotype report (PMID:41178743).
  Given this very small evidence base, this entry is deliberately lean and
  limited to phenotypes and mechanistic claims explicitly stated in these
  sources.
parents:
- Inborn Error of Metabolism
- Neurodevelopmental Disorder
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    All reported affected individuals carry bi-allelic (homozygous or
    compound heterozygous) inactivating PGM2L1 variants, including
    homozygous variants inherited from unaffected heterozygous parents.
  evidence:
  - reference: PMID:33979636
    reference_title: "Impaired glucose-1,6-biphosphate production due to bi-allelic PGM2L1 mutations is associated with a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four individuals (three females and one male aged between 2 and 7.5 years) with bi-allelic inactivating mutations of PGM2L1 were identified by exome sequencing."
    explanation: Establishes bi-allelic (autosomal recessive) inheritance of PGM2L1 loss-of-function variants.
  - reference: PMID:41776821
    reference_title: "Identification of a Homozygous PGM2L1 Variant in a Male Patient With Developmental Delay and Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES identified a rare homozygous variant in the PGM2L1 gene (OMIM: 611,610, NM_173582.6: c.1673delC, p.Thr558Ilefs*19), which was inherited from both parents."
    explanation: Independent case confirming a homozygous, biparentally-inherited PGM2L1 variant.
pathophysiology:
- name: PGM2L1 Loss of Function
  description: >
    Bi-allelic inactivating PGM2L1 variants abolish or severely reduce the
    glucose-1,6-bisphosphate synthase activity of PGM2L1, a brain-enriched
    paralog of phosphoglucomutase 2.
  gene:
    preferred_term: PGM2L1
    term:
      id: hgnc:20898
      label: PGM2L1
  molecular_functions:
  - preferred_term: Phosphoglucomutase activity
    term:
      id: GO:0004614
      label: phosphoglucomutase activity
  consequence: DECREASED
  downstream:
  - target: Reduced Sugar Bisphosphate Concentrations
    description: >
      Loss of PGM2L1 phosphoglucomutase activity reduces glucose-1,6-bisphosphate
      and other sugar bisphosphate concentrations in patient fibroblasts.
    evidence:
    - reference: PMID:33979636
      reference_title: "Impaired glucose-1,6-biphosphate production due to bi-allelic PGM2L1 mutations is associated with a neurodevelopmental disorder."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Analysis of the children's fibroblasts showed that glucose-1,6-bisphosphate and other sugar bisphosphates were markedly reduced but still present at concentrations able to stimulate phosphomutases maximally."
      explanation: Direct biochemical evidence in patient-derived fibroblasts linking PGM2L1 loss to reduced glucose-1,6-bisphosphate.
  evidence:
  - reference: PMID:33979636
    reference_title: "Impaired glucose-1,6-biphosphate production due to bi-allelic PGM2L1 mutations is associated with a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a genetic syndrome due to PGM2L1 deficiency. PGM2 and PGM2L1 make hexose-bisphosphates, like glucose-1,6-bisphosphate, which are indispensable cofactors for sugar phosphomutases."
    explanation: Establishes PGM2L1's enzymatic role and the loss-of-function disease mechanism.
  - reference: PMID:33979636
    reference_title: "Impaired glucose-1,6-biphosphate production due to bi-allelic PGM2L1 mutations is associated with a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While PGM2 has a wide tissue distribution, PGM2L1 is highly expressed in the brain, accounting for the elevated concentrations of glucose-1,6-bisphosphate found there."
    explanation: Explains the brain-predominant expression that plausibly underlies the neurodevelopmental phenotype.
- name: Reduced Sugar Bisphosphate Concentrations
  description: >
    Patient fibroblasts show markedly reduced glucose-1,6-bisphosphate and
    other sugar bisphosphates, though residual concentrations remain
    sufficient to maximally stimulate phosphomutases, so protein
    glycosylation (LAMP2 glycosylation, serum transferrin glycosylation)
    is unaffected. This distinguishes PGM2L1 deficiency mechanistically from
    the congenital disorders of glycosylation.
  chemical_entities:
  - preferred_term: D-glucose 1,6-bisphosphate
    term:
      id: CHEBI:17680
      label: D-glucose 1,6-bisphosphate
  consequence: DECREASED
  evidence:
  - reference: PMID:33979636
    reference_title: "Impaired glucose-1,6-biphosphate production due to bi-allelic PGM2L1 mutations is associated with a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Analysis of the children's fibroblasts showed that glucose-1,6-bisphosphate and other sugar bisphosphates were markedly reduced but still present at concentrations able to stimulate phosphomutases maximally."
    explanation: Direct biochemical evidence in patient-derived fibroblasts linking PGM2L1 loss to reduced glucose-1,6-bisphosphate.
  - reference: PMID:33979636
    reference_title: "Impaired glucose-1,6-biphosphate production due to bi-allelic PGM2L1 mutations is associated with a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hence, the concentrations of NDP-sugars and glycosylation of the heavily glycosylated protein LAMP2 were normal. Consistent with this, serum transferrin was normally glycosylated in affected individuals. PGM2L1 deficiency does not appear to be a glycosylation defect"
    explanation: Rules out a glycosylation-defect mechanism despite reduced sugar bisphosphates.

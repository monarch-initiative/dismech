    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We describe a genetic syndrome due to PGM2L1 deficiency. PGM2 and PGM2L1 make hexose-bisphosphates,
      like glucose-1,6-bisphosphate, which are indispensable cofactors for sugar phosphomutases.
    explanation: Establishes PGM2L1's enzymatic role and the loss-of-function disease mechanism.
  - reference: PMID:33979636
    reference_title: Impaired glucose-1,6-biphosphate production due to bi-allelic PGM2L1 mutations is
      associated with a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: While PGM2 has a wide tissue distribution, PGM2L1 is highly expressed in the brain, accounting
      for the elevated concentrations of glucose-1,6-bisphosphate found there.
    explanation: Explains the brain-predominant expression that plausibly underlies the neurodevelopmental
      phenotype.

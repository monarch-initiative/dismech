inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: 'All reported affected individuals carry bi-allelic (homozygous or compound heterozygous)
    inactivating PGM2L1 variants, including homozygous variants inherited from unaffected heterozygous
    parents.

    '
  evidence:
  - reference: PMID:33979636
    reference_title: Impaired glucose-1,6-biphosphate production due to bi-allelic PGM2L1 mutations is
      associated with a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Four individuals (three females and one male aged between 2 and 7.5 years) with bi-allelic
      inactivating mutations of PGM2L1 were identified by exome sequencing.
    explanation: Establishes bi-allelic (autosomal recessive) inheritance of PGM2L1 loss-of-function variants.
  - reference: PMID:41776821
    reference_title: Identification of a Homozygous PGM2L1 Variant in a Male Patient With Developmental
      Delay and Seizures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'WES identified a rare homozygous variant in the PGM2L1 gene (OMIM: 611,610, NM_173582.6:
      c.1673delC, p.Thr558Ilefs*19), which was inherited from both parents.'
    explanation: Independent case confirming a homozygous, biparentally-inherited PGM2L1 variant.
pathophysiology:
- name: PGM2L1 Loss of Function
  description: 'Bi-allelic inactivating PGM2L1 variants abolish or severely reduce the glucose-1,6-bisphosphate
    synthase activity of PGM2L1, a brain-enriched paralog of phosphoglucomutase 2.

    '

- name: Impaired Distal Convoluted Tubule Magnesium Reabsorption
  biological_scale: CELLULAR
  description: >-
    The distal convoluted tubule reabsorbs magnesium transcellularly and has
    the highest Na+,K+-ATPase density of the nephron, with alpha-1 as the
    predominant isoform. Reduced pumping and a depolarizing leak in these cells
    are expected to weaken the driving force for magnesium entry, so
    magnesium is lost in the urine. Not measured in patient tissue.
  cell_types:
  - preferred_term: kidney distal convoluted tubule epithelial cell
    term:
      id: CL:1000849
      label: kidney distal convoluted tubule epithelial cell
  biological_processes:
  - preferred_term: magnesium ion transmembrane transport
    term:
      id: GO:1903830
      label: magnesium ion transmembrane transport
    modifier: DECREASED
  locations:
  - preferred_term: distal convoluted tubule
    term:
      id: UBERON:0001292
      label: distal convoluted tubule
  evidence:
  - reference: PMID:33968856
    reference_title: "ATP1A1 de novo Mutation-Related Disorders: Clinical and Genetic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "The distal convoluted tubule mediates active transcellular magnesium transport and has the highest Na+/K+-ATPase density and activity; ATP1A1 encodes the most prevalent form of Na+/K+-ATPase in the distal convoluted tubule (9)."
    explanation: Tubular physiology on which the renal step rests.
  downstream:
  - target: Renal magnesium wasting
    causal_link_type: DIRECT
    description: Failed tubular reabsorption leaves magnesium in the urine.
    evidence:
    - reference: PMID:34717959
      reference_title: "A missense mutation converts the Na(+),K(+)-ATPase into an ion channel and causes therapy-resistant epilepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "The hypomagnesemia can be explained by reduced Na,K-ATPase abundance or activity in DCT, as discussed in relation to other examples of Mg wasting caused by inactivation or destabilization of Na,K-ATPase (52)."
      explanation: Proposes DCT pump failure as the source of the urinary loss.
  - target: Hypomagnesemia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Ongoing urinary magnesium loss lowers serum magnesium.
    evidence:
    - reference: PMID:34717959
      reference_title: "A missense mutation converts the Na(+),K(+)-ATPase into an ion channel and causes therapy-resistant epilepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "She had profound hypomagnesemia (0.42–0.71 mM serum concentration) due to high urinary magnesium excretion."
      explanation: The patient's hypomagnesemia was of renal origin.

name: Hypomagnesemia, Seizures, and Intellectual Disability 2
category: Mendelian
creation_date: "2026-10-15T23:00:58Z"
description: >-
  Hypomagnesemia, seizures, and intellectual disability 2 (HOMGSMR2) is an
  autosomal dominant disorder caused by de novo heterozygous missense variants
  in ATP1A1, the gene for the catalytic alpha-1 subunit of the ubiquitous
  Na+,K+-ATPase. Affected infants present between the first week and the sixth
  month of life with generalized seizures, severe hypomagnesemia and renal
  magnesium wasting. The seizures persist after serum magnesium is corrected
  and resist antiseizure drugs, with repeated status epilepticus, and the
  children have global developmental delay and significant intellectual
  disability. The known disease variants (p.Leu302Arg, p.Gly303Arg,
  p.Met859Arg, p.Trp931Arg) each place an arginine in a membrane-spanning
  segment of the pump. In expression systems they reduce pump function and,
  in addition, carry a passive leak current that depolarizes the cell
  membrane. Depolarization of neurons is thought to lower the seizure
  threshold, and impaired pump function in the distal convoluted tubule is
  thought to reduce transcellular magnesium reabsorption.
notes: >-
  The entry is anchored on MONDO:0020788 (OMIM 618314) and ATP1A1 (hgnc:799).
  The MONDO parent is hypomagnesemia, seizures, and intellectual disability
  (MONDO:0014631), whose type 1 is caused by CNNM2.

  ATP1A1 variants also cause axonal Charcot-Marie-Tooth disease type 2DD,
  hereditary spastic paraplegia, an early-onset complex neurodevelopmental
  syndrome with neuropathy, and, as somatic variants, aldosterone-producing
  adrenal adenomas. These allelic disorders are out of scope here. The de novo
  variants p.Leu337Pro (M4), p.Asp933Asn (M8) and p.Gly864Arg (M7) have been
  reported with developmental delay but normal serum magnesium
  (PMID:33968856); they are not curated as HOMGSMR2 alleles because the
  hypomagnesemia that defines this entry was absent.

  Four molecularly confirmed patients with hypomagnesemia have been published
  (three in PMID:30388404, one in PMID:34717959), so no phenotype frequency
  band and no prevalence record is curated.

  Features listed in the OMIM clinical synopsis but not curated here
  (hypokalemia, renal potassium wasting, nephrocalcinosis and polyuria) are
  reported in the body of PMID:30388404, whose cached record is abstract only.

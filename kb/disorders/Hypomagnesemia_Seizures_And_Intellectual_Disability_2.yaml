genetic:
- name: ATP1A1
  gene_term:
    preferred_term: ATP1A1
    term:
      id: hgnc:799
      label: ATP1A1
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  features: >-
    ATP1A1 (1p13.1) encodes the alpha-1 catalytic subunit of the Na+,K+-ATPase,
    the predominant isoform in the kidney and abundant in the central nervous
    system. All HOMGSMR2 variants are heterozygous missense changes that put
    an arginine into transmembrane segment M3, M7 or M8.
  notes: >-
    Heterozygous Atp1a1 knockout mice are phenotypically normal, and a healthy
    adult carrying a protein-null truncating variant (p.Tyr148Ter) has no
    feature of an ATP1A1-related disease, so loss of one allele does not
    explain the disease. The variants act through a malfunctioning protein:
    reduced pumping together with an abnormal leak current. CNNM2 and TRPM6
    mutations were excluded in the index cohort before ATP1A1 was found.
  evidence:
  - reference: PMID:30388404
    reference_title: "Germline De Novo Mutations in ATP1A1 Cause Renal Hypomagnesemia, Refractory Seizures, and Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing and conventional Sanger sequencing identified heterozygous de novo mutations in the catalytic Na+, K+-ATPase α1 subunit (ATP1A1)."
    explanation: Gene discovery in three unrelated infants.
  - reference: PMID:37659504
    reference_title: "ATP1A1-linked diseases require a malfunctioning protein product from one allele."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "We found that Atp1a1+/- mice were phenotypically normal up to 18 months of age."
    explanation: >-
      Heterozygous loss of Atp1a1 alone produces no phenotype in mice, which
      argues against haploinsufficiency as the disease mechanism. The study
      tested neuromuscular features, so it bears on this disease only
      indirectly.
  - reference: PMID:37659504
    reference_title: "ATP1A1-linked diseases require a malfunctioning protein product from one allele."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Consistent with the observations in mice, we report clinical phenotyping of a healthy adult human who lacks any clinical features of known ATP1A1-related diseases despite carrying a plasma-membrane protein-null early truncation variant, p.Y148*."
    explanation: >-
      A human protein-null heterozygote is healthy, so ATP1A1-related disease
      requires an altered protein rather than loss of one allele.
  variants:
  - name: NM_000701:c.905T>C (p.Leu302Arg)
    type: MISSENSE
    clinical_significance: PATHOGENIC
    description: >-
      De novo in an infant girl presenting at 6 months with generalized
      seizures, hyperactive behavior and hypomagnesemia, with repeated status
      epilepticus. Located in transmembrane segment M3. Reduces pump function
      and carries an ouabain-insensitive leak current in oocytes.
    evidence:
    - reference: PMID:42377349
      reference_title: "On the mechanism of hypomagnesemia with treatment-resistant seizures caused by variants of the Na+,K+-ATPase α1 subunit (ATP1A1)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We used heterologous expression in mammalian cells and Xenopus oocytes to evaluate the characteristics of α1 variants causing hypomagnesemia with treatment-resistant seizures: L302R, G303R, M859R, and W931R."
      explanation: Names p.Leu302Arg among the four HOMGSMR2 variants studied.
  - name: NM_000701:c.907G>C (p.Gly303Arg)
    type: MISSENSE
    clinical_significance: PATHOGENIC
    description: >-
      De novo in an infant girl presenting at 2 months with generalized
      seizures and hypomagnesemia, later with features of autism spectrum
      disorder. Located in transmembrane segment M3. Na+ and Cl- permeate the
      mutant protein.
    evidence:
    - reference: PMID:42377349
      reference_title: "On the mechanism of hypomagnesemia with treatment-resistant seizures caused by variants of the Na+,K+-ATPase α1 subunit (ATP1A1)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Na+ and Cl‒ permeate through G303R and W931R."
      explanation: Ion permeation through the p.Gly303Arg pump.
  - name: NM_000701:c.2576T>G (p.Met859Arg)
    type: MISSENSE
    clinical_significance: PATHOGENIC
    description: >-
      De novo in a boy presenting at 6 days of age with generalized seizures
      and hypomagnesemia, with repeated status epilepticus, severe autism and
      self-biting. Located in transmembrane segment M7. Retains a small
      K+-activated, ouabain-inhibitable pump current alongside the leak.
    evidence:
    - reference: PMID:42377349
      reference_title: "On the mechanism of hypomagnesemia with treatment-resistant seizures caused by variants of the Na+,K+-ATPase α1 subunit (ATP1A1)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "M859R and W931R presented small K+-activated ouabain-inhibitable NKA currents that were absent in L302R and G303R."
      explanation: Residual pump current of p.Met859Arg.
  - name: NM_000701.7:c.2791T>C (p.Trp931Arg)
    type: MISSENSE
    clinical_significance: PATHOGENIC
    description: >-
      De novo in an infant girl with therapy-resistant epilepsy from 3 months,
      renal magnesium wasting and death at 10 months. Located in transmembrane
      segment M8. The cryo-EM structure of this variant shows a distorted M9
      segment.
    evidence:
    - reference: PMID:34717959
      reference_title: "A missense mutation converts the Na(+),K(+)-ATPase into an ion channel and causes therapy-resistant epilepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Using whole-genome sequencing (WGS), we identified a de novo mutation (NM_000701.7:c.2791T>C; p.W931R) in exon 20 of ATP1A1 (Fig. 1A)."
      explanation: Identifies the variant as de novo in the patient.
    - reference: PMID:42377349
      reference_title: "On the mechanism of hypomagnesemia with treatment-resistant seizures caused by variants of the Na+,K+-ATPase α1 subunit (ATP1A1)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We solved the cryo-EM structure of W931R-α1β1 with bound ouabain at 3 Å resolution."
      explanation: Structural characterization of the variant.
pathophysiology:
- name: ATP1A1 Transmembrane Arginine Substitution
  biological_scale: MOLECULAR
  description: >-
    Each HOMGSMR2 variant replaces a residue in a membrane-spanning segment of
    the alpha-1 subunit (M3, M7 or M8) with arginine. A buried positive charge
    in the lipid-embedded domain is expected to disturb the ion-binding sites
    and the packing of the transmembrane helices.
  role: trigger
  genes:
  - preferred_term: ATP1A1
    term:
      id: hgnc:799
      label: ATP1A1
  molecular_functions:
  - preferred_term: sodium/potassium-exchanging ATPase activity
    term:
      id: GO:0005391
      label: P-type sodium:potassium-exchanging transporter activity
    modifier: ABNORMAL
  genetic_context:
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:33968856
    reference_title: "ATP1A1 de novo Mutation-Related Disorders: Clinical and Genetic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, the amino acid residues in M3 and M7 (two cases each: M3: p.Leu302Arg, p.Gly303Arg; M7: p.Gly864Arg, p.Met859Arg) were all changed to arginine."
    explanation: >-
      The de novo ATP1A1 variants in M3 and M7, including three of the four
      HOMGSMR2 variants, all introduce arginine.
  - reference: PMID:34717959
    reference_title: "A missense mutation converts the Na(+),K(+)-ATPase into an ion channel and causes therapy-resistant epilepsy."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Arginine insertion into membrane proteins can generate water-filled pores in the plasma membrane, and our molecular dynamic (MD) simulations of the principle states of Na+,K+-ATPase transport demonstrated massive water inflow into mutant α1 and destabilization of the ion-binding sites."
    explanation: >-
      Molecular dynamics of p.Trp931Arg show the buried arginine destabilizing
      the ion-binding sites and admitting water into the protein.
  downstream:
  - target: Reduced Na+,K+-ATPase Pump Activity
    causal_link_type: DIRECT
    description: >-
      The substitution impairs the transport cycle and reduces the amount of
      pump at the plasma membrane.
    evidence:
    - reference: PMID:34717959
      reference_title: "A missense mutation converts the Na(+),K(+)-ATPase into an ion channel and causes therapy-resistant epilepsy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found that membrane expression of the mutant α1 protein was low, and ion pumping activity was lost."
      explanation: p.Trp931Arg lowers surface expression and abolishes pumping.
  - target: Aberrant Passive Leak Current
    causal_link_type: DIRECT
    description: >-
      The same substitution opens a passive conductance through the mutant
      protein, possibly at the protein-lipid interface.
    evidence:
    - reference: PMID:42377349
      reference_title: "On the mechanism of hypomagnesemia with treatment-resistant seizures caused by variants of the Na+,K+-ATPase α1 subunit (ATP1A1)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The structure showed a distorted transmembrane segment M9, which causes a concavity in the detergent micelle, suggesting that similar distortions may provide a leak pathway at the protein-lipid interface."
      explanation: >-
        The cryo-EM structure of p.Trp931Arg suggests where the leak pathway
        forms. The authors state it as a suggestion rather than a
        demonstration.
- name: Reduced Na+,K+-ATPase Pump Activity
  biological_scale: MOLECULAR
  description: >-
    The mutant alpha-1 subunits transport less Na+ and K+ than wild type. In
    cells, the variants show more cytosolic and less plasma-membrane signal,
    and cells relying on them survive poorly when the endogenous pump is
    blocked with ouabain. p.Leu302Arg and p.Gly303Arg show no measurable pump
    current; p.Met859Arg and p.Trp931Arg retain a small one.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: kidney distal convoluted tubule epithelial cell
    term:
      id: CL:1000849
      label: kidney distal convoluted tubule epithelial cell
  molecular_functions:
  - preferred_term: sodium/potassium-exchanging ATPase activity
    term:
      id: GO:0005391
      label: P-type sodium:potassium-exchanging transporter activity
    modifier: DECREASED
  evidence:
  - reference: PMID:30388404
    reference_title: "Germline De Novo Mutations in ATP1A1 Cause Renal Hypomagnesemia, Refractory Seizures, and Intellectual Disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional characterization of mutant Na+, K+-ATPase α1 subunits in heterologous expression systems revealed not only a loss of Na+, K+-ATPase function but also abnormal cation permeabilities"
    explanation: Loss of pump function in heterologously expressed index variants.
  - reference: PMID:42377349
    reference_title: "On the mechanism of hypomagnesemia with treatment-resistant seizures caused by variants of the Na+,K+-ATPase α1 subunit (ATP1A1)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cell survival in the presence of micromolar ouabain was reduced in cells expressing ouabain-resistant versions of these variants, indicating defective function of the variants relative to WT."
    explanation: All four HOMGSMR2 variants fail to support cell survival as wild type does.
  - reference: PMID:42377349
    reference_title: "On the mechanism of hypomagnesemia with treatment-resistant seizures caused by variants of the Na+,K+-ATPase α1 subunit (ATP1A1)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fluorescently tagged WT-α1 expressed in HEK293 cells showed plasmalemma localization, while all variants displayed increased cytosolic signal."
    explanation: Less of each variant reaches the plasma membrane.
  - reference: PMID:42377349
    reference_title: "On the mechanism of hypomagnesemia with treatment-resistant seizures caused by variants of the Na+,K+-ATPase α1 subunit (ATP1A1)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "M859R and W931R presented small K+-activated ouabain-inhibitable NKA currents that were absent in L302R and G303R."
    explanation: Residual pump current differs between the variants.
  downstream:
  - target: Neuronal Membrane Depolarization
    causal_link_type: DIRECT
    description: >-
      The pump is electrogenic and sets the neuronal resting potential, so
      less pumping depolarizes the neuron. The leak current adds to this.
    evidence:
    - reference: PMID:30388404
      reference_title: "Germline De Novo Mutations in ATP1A1 Cause Renal Hypomagnesemia, Refractory Seizures, and Intellectual Disability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "abnormal cation permeabilities, which led to membrane depolarization and possibly aggravated the effect of the loss of physiological pump activity"
      explanation: >-
        Treats loss of pump activity as a primary effect that the
        depolarizing leak aggravates. Measured in heterologous cells rather
        than neurons.
  - target: Impaired Distal Convoluted Tubule Magnesium Reabsorption
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Transcellular magnesium reabsorption in the distal convoluted tubule
      depends on the gradient set up by the basolateral Na+,K+-ATPase. This
      step is inferred from tubular physiology and has not been measured in
      patient kidney.
    evidence:
    - reference: PMID:34717959
      reference_title: "A missense mutation converts the Na(+),K(+)-ATPase into an ion channel and causes therapy-resistant epilepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "The hypomagnesemia can be explained by reduced Na,K-ATPase abundance or activity in DCT, as discussed in relation to other examples of Mg wasting caused by inactivation or destabilization of Na,K-ATPase (52)."
      explanation: >-
        The authors propose reduced DCT pump activity as the cause of the
        patient's magnesium wasting; it is an interpretation, not a renal
        measurement.
    - reference: PMID:30388404
      reference_title: "Germline De Novo Mutations in ATP1A1 Cause Renal Hypomagnesemia, Refractory Seizures, and Intellectual Disability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "These findings underline the indispensable role of the α1 isoform of the Na+, K+-ATPase for renal-tubular magnesium handling"
      explanation: >-
        The index study concludes that alpha-1 is required for tubular
        magnesium handling.
- name: Aberrant Passive Leak Current
  biological_scale: MOLECULAR
  description: >-
    In Xenopus oocytes under voltage clamp every HOMGSMR2 variant carries a
    passive leak current, which ouabain leaves unchanged (p.Leu302Arg,
    p.Met859Arg), partly inhibits (p.Gly303Arg) or enhances (p.Trp931Arg). Na+
    and Cl- permeate p.Gly303Arg and p.Trp931Arg. This is a new property of
    the mutant protein rather than a change in the level of normal pump
    function, so it is recorded as gain of function.
  molecular_functions:
  - preferred_term: passive ion leak through the mutant pump
    term:
      id: GO:0015075
      label: monoatomic ion transmembrane transporter activity
    modifier: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:42377349
    reference_title: "On the mechanism of hypomagnesemia with treatment-resistant seizures caused by variants of the Na+,K+-ATPase α1 subunit (ATP1A1)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'In variant-expressing oocytes under voltage clamp, each variant showed passive "leak" currents'
    explanation: All four variants carry a leak current.
  - reference: PMID:42377349
    reference_title: "On the mechanism of hypomagnesemia with treatment-resistant seizures caused by variants of the Na+,K+-ATPase α1 subunit (ATP1A1)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Na+ and Cl‒ permeate through G303R and W931R."
    explanation: Identifies the permeating ions for two of the variants.
  - reference: PMID:34717959
    reference_title: "A missense mutation converts the Na(+),K(+)-ATPase into an ion channel and causes therapy-resistant epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "analysis of oocytes expressing mutant α1 detected a nonspecific cation current"
    explanation: Independent detection of a leak current with p.Trp931Arg.
  - reference: PMID:30388404
    reference_title: "Germline De Novo Mutations in ATP1A1 Cause Renal Hypomagnesemia, Refractory Seizures, and Intellectual Disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "revealed not only a loss of Na+, K+-ATPase function but also abnormal cation permeabilities"
    explanation: Abnormal cation permeability of the index variants.
  downstream:
  - target: Neuronal Membrane Depolarization
    causal_link_type: DIRECT
    description: >-
      An inward leak at rest depolarizes the cell membrane.
    evidence:
    - reference: PMID:30388404
      reference_title: "Germline De Novo Mutations in ATP1A1 Cause Renal Hypomagnesemia, Refractory Seizures, and Intellectual Disability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "abnormal cation permeabilities, which led to membrane depolarization"
      explanation: >-
        The abnormal permeability depolarized the membrane of expressing
        cells.
    - reference: PMID:34717959
      reference_title: "A missense mutation converts the Na(+),K(+)-ATPase into an ion channel and causes therapy-resistant epilepsy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "Leak currents will have serious consequences in neurons since depolarization of the membrane potential, observed in neurons expressing mutated α1, can trigger epileptic activity."
      explanation: Links the leak current to the depolarization seen in neurons.
  - target: Impaired Distal Convoluted Tubule Magnesium Reabsorption
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The authors of the leak study propose that the leak underlies the
      hypomagnesemia as well as the seizures; how it acts in tubular cells has
      not been shown.
    evidence:
    - reference: PMID:42377349
      reference_title: "On the mechanism of hypomagnesemia with treatment-resistant seizures caused by variants of the Na+,K+-ATPase α1 subunit (ATP1A1)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "Our results demonstrate that besides a loss of NKA function, all four variants carry an aberrant leak current that probably underlies the seizures and the hypomagnesemia characterizing this phenotype."
      explanation: >-
        Proposes the leak as the shared cause of seizures and hypomagnesemia.
        The renal step is inferred from oocyte and HEK293 data.

experimental_models:
- name: HEK293 cells expressing ouabain-resistant HOMGSMR2 ATP1A1 variants
  experimental_model_type: CELL_LINE
  description: >-
    HEK293 cells transfected with ouabain-resistant p.Leu302Arg, p.Gly303Arg,
    p.Met859Arg or p.Trp931Arg alpha-1, grown in micromolar ouabain to block
    the endogenous pump, with fluorescently tagged constructs imaged for
    localization.
  publication: PMID:42377349
  modeled_mechanisms:
  - target: Reduced Na+,K+-ATPase Pump Activity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Cells depending on the variant pumps survive poorly and the variants are
      partly retained in the cytosol.
    limitations: >-
      Overexpression in a human kidney-derived line, not in distal convoluted
      tubule cells or neurons, with the endogenous pump pharmacologically
      silenced.
    evidence:
    - reference: PMID:42377349
      reference_title: "On the mechanism of hypomagnesemia with treatment-resistant seizures caused by variants of the Na+,K+-ATPase α1 subunit (ATP1A1)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cell survival in the presence of micromolar ouabain was reduced in cells expressing ouabain-resistant versions of these variants, indicating defective function of the variants relative to WT."
      explanation: The cell model shows the loss of pump function.
- name: Xenopus oocytes expressing HOMGSMR2 ATP1A1 variants
  experimental_model_type: OTHER
  description: >-
    Xenopus laevis oocytes injected with variant alpha-1 and studied under two
    electrode voltage clamp for pump and passive currents.
  publication: PMID:42377349
  modeled_mechanisms:
  - target: Aberrant Passive Leak Current
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Each variant produces a passive leak current.
    limitations: >-
      Amphibian oocytes report currents of heterologously expressed protein and
      say nothing about how the leak alters neuronal or tubular function.
    evidence:
    - reference: PMID:42377349
      reference_title: "On the mechanism of hypomagnesemia with treatment-resistant seizures caused by variants of the Na+,K+-ATPase α1 subunit (ATP1A1)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'In variant-expressing oocytes under voltage clamp, each variant showed passive "leak" currents'
      explanation: The oocyte system shows the leak current for all four variants.
- name: Rat hippocampal neurons expressing p.Trp931Arg ATP1A1
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Cultured rat hippocampal neurons transfected with GFP-tagged wild-type or
    p.Trp931Arg human alpha-1, with resting membrane potential recorded by
    single-cell patch clamp.
  publication: PMID:34717959
  modeled_mechanisms:
  - target: Neuronal Membrane Depolarization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Neurons expressing the variant rest at a depolarized potential.
    limitations: >-
      Rodent neurons overexpressing the human variant on top of endogenous
      pumps; only one variant was tested and network excitability was not
      measured.
    evidence:
    - reference: PMID:34717959
      reference_title: "A missense mutation converts the Na(+),K(+)-ATPase into an ion channel and causes therapy-resistant epilepsy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Finally, neurons expressing mutant α1 were observed to be depolarized compared with neurons expressing wild-type protein, compatible with a lowered threshold for epileptic seizures."
      explanation: Direct measurement of depolarization in variant-expressing neurons.
discussions:
- discussion_id: homgsmr2_renal_step_untested
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired Distal Convoluted Tubule Magnesium Reabsorption
  prompt: >-
    Do the HOMGSMR2 variants reduce magnesium reabsorption in distal
    convoluted tubule cells, and is it the pump deficit or the leak current
    that is responsible?
  rationale: >-
    The renal step is inferred from tubular physiology and from experiments in
    HEK293 cells and Xenopus oocytes. No study has measured magnesium
    transport in distal convoluted tubule cells carrying a HOMGSMR2 variant,
    and no animal carrying one has been reported. Heterozygous Atp1a1 knockout
    mice are phenotypically normal, so loss of one allele does not stand in
    for the disease variants.
  proposed_experiments:
  - experiment_id: homgsmr2_knockin_mouse_renal
    experiment_design: TARGETED_PERTURBATION
    name: Atp1a1 knock-in mouse carrying a HOMGSMR2 variant
    description: >-
      Knock a HOMGSMR2 variant such as p.Trp931Arg into mouse Atp1a1 and
      measure serum magnesium, fractional magnesium excretion and distal
      convoluted tubule membrane potential, alongside the heterozygous
      knockout line.
    would_support:
    - pathophysiology#Impaired Distal Convoluted Tubule Magnesium Reabsorption
    supporting_outcome:
    - Knock-in mice waste magnesium in the urine while heterozygous knockout mice do not.
    refuting_outcome:
    - Knock-in mice keep normal serum magnesium and fractional magnesium excretion.

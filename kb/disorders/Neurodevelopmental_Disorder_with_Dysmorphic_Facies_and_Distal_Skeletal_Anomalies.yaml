  title: RNA sequencing on Postnatal day (P) 7 wildtype and Zmiz1-Knockout cortex
  description: >-
    Cortical RNA-seq from the Emx1-Cre forebrain-specific Zmiz1 knockout, the
    primary transcriptomic dataset behind the "Dysregulated Developmental
    Transcriptional Programs" node. It identified 114 differentially expressed
    genes at postnatal day 7, with downregulated genes enriched for forebrain
    development, axon development, and neuron differentiation.

  - preferred_term: synaptic signaling
    term:
      id: GO:0099536
      label: synaptic signaling
    modifier: ABNORMAL
  mechanism_confidence: ESTABLISHED
  notes: >-
    The neuron migration annotation on this node is deliberately retained but is
    contested in mouse. It is supported by the in utero electroporation
    overexpression paradigm and by the human cortical heterotopias, and is
    explicitly refuted by BrdU birthdating in the forebrain-specific knockout,
    where migration was intact and microcephaly was attributable to reduced
    progenitor output. Both directions are curated as evidence items on this
    node.
  downstream:
  - target: Global Neurodevelopmental Impairment
    causal_link_type: DIRECT
    description: >-
      Miswired and mispositioned cortical circuitry is the substrate of the
      cognitive, language, motor, and behavioral phenotype.
  evidence:
  - reference: PMID:30639322
    reference_title: "ZMIZ1 Variants Cause a Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In vivo, overexpression of ZMIZ1 mutant alleles in developing mouse brains
      using in utero electroporation resulted in abnormal pyramidal neuron
      morphology, polarization, and positioning, underscoring the importance of
      ZMIZ1 in neural development
    explanation: >-
      Directly links patient alleles to abnormal pyramidal neuron morphology and
      positioning in vivo.
  - reference: PMID:35432459
    reference_title: "A de Novo ZMIZ1 Pathogenic Variant for Neurodevelopmental Disorder With Dysmorphic Facies and Distal Skeletal Anomalies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      resulted in impaired neuronal positioning with an accumulation in the
      ventricular and subventricular zones (VZ/SVZ) and intermediate zone (IZ)
      and a corresponding depletion in the upper cortical plate (CP)
    explanation: >-
      Specifies the laminar distribution of the positioning defect in the
      overexpression paradigm — retention in the proliferative and intermediate
      zones with depletion of the upper cortical plate. This is a secondary
      description of the PMID:30639322 experiment, quoted from the cached full
      text of PMID:35432459.
  - reference: PMID:41633496
    reference_title: "Loss of Zmiz1 in Mice Leads to Impaired Cortical Development and Autistic-Like Behaviors."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Despite reduced numbers, BrdU+ neurons were correctly positioned according
      to their birthdates, indicating that migration was not disrupted
    explanation: >-
      Directly refutes the migration/positioning component of this node in the
      endogenous loss-of-function model: BrdU birthdating showed correct laminar
      positioning, so the microcephaly in that model reflects reduced progenitor
      proliferation and neurogenesis, not mispositioning. Curated as REFUTE so
      the contradiction with the overexpression paradigm is visible rather than
      averaged away.
  - reference: PMID:41633496
    reference_title: "Loss of Zmiz1 in Mice Leads to Impaired Cortical Development and Autistic-Like Behaviors."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss of ZMIZ1 led to cortical microcephaly, corpus callosum dysgenesis,
      and abnormal differentiation of upper-layer cortical neurons.
    explanation: >-
      Independent loss-of-function genetic model reproducing microcephaly,
      callosal dysgenesis, and upper-layer differentiation failure.
  - reference: PMID:41633496
    reference_title: "Loss of Zmiz1 in Mice Leads to Impaired Cortical Development and Autistic-Like Behaviors."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Importantly, reactivation of the ephrin-B2 pathway rescued the dendritic
      outgrowth deficits in Zmiz1 mutant cortical neurons.
    explanation: >-
      Establishes ephrin-B2 signaling as a downstream effector whose restoration
      rescues the dendritic phenotype — the rescue arm cited in this node.
  - reference: PMID:41039966
    reference_title: "ZMIZ1-Associated Neurodevelopmental Disorder in a 52-Year-Old Woman."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional findings seen on autopsy included cerebral cortical neuronal
      heterotopias.
    explanation: >-
      Human neuropathological counterpart of the neuronal migration and
      positioning defect demonstrated in the mouse models.
- name: Disrupted Craniofacial and Distal Skeletal Patterning
  description: >-
    The non-neural developmental arm that gives the syndrome its name. ZMIZ1 is
    expressed broadly in embryonic tissues beyond brain — including limb-forming
    mesoderm, heart, and kidney — and coactivates NOTCH1 and SMAD3/4, both
    central to craniofacial and appendicular skeletal morphogenesis. The
    clinical result is a recognizable dysmorphic facial pattern together with
    distal skeletal anomalies of the hands and feet, joint hypermobility, and
    hip dysplasia; prenatally the same program failure can present as short
    femur with intrauterine growth restriction. The specific ZMIZ1 target genes
    responsible have not been identified, and no skeletal-tissue model of the
    disorder exists, so this node is provisional relative to the well-worked
    cortical arm. The one direct functional study in a non-neural cell type
    (human skeletal muscle cells) showed a patient allele altering proliferation
    and migration and dysregulating TGF-beta1 pathway genes, which is
    suggestive but is muscle rather than cartilage or bone.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: skeletal system development
    term:
      id: GO:0001501
      label: skeletal system development
    modifier: ABNORMAL
  - preferred_term: transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: ABNORMAL
  cell_types:
  - preferred_term: skeletal muscle cell
    term:
      id: CL:0000188
      label: cell of skeletal muscle
  mechanism_confidence: PROVISIONAL
  notes: >-
    Marked PROVISIONAL deliberately. The link from ZMIZ1 coactivator loss to the
    craniofacial and distal skeletal phenotype is inferred from the clinical
    pattern plus the known NOTCH1/SMAD partnership; unlike the cortical arm it
    has no dedicated in vivo skeletal model and no identified target genes. See
    the neddfsa_skeletal_arm_unmodeled discussion. The node also deliberately
    keeps the craniofacial (cranial-neural-crest) and appendicular
    (limb-mesenchyme) programs together, because no evidence yet distinguishes
    them in this disorder; splitting them should follow, not precede, the
    lineage-specific experiments proposed in that discussion.
  downstream:
  - target: Syndromic Multisystem Malformation
    causal_link_type: DIRECT
    description: >-
      Disrupted craniofacial and appendicular patterning is expressed at the
      level of the whole organism as the recognizable dysmorphic and skeletal
      syndrome, alongside the cardiac and genitourinary malformations that share
      the same coactivator-dependent developmental programs.
  evidence:
  - reference: PMID:35432459
    reference_title: "A de Novo ZMIZ1 Pathogenic Variant for Neurodevelopmental Disorder With Dysmorphic Facies and Distal Skeletal Anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurodevelopmental disorder with dysmorphic facies and distal skeletal
      anomalies (NEDDFSA) is a rare syndromic disorder characterized by global
      neurodevelopmental delay, early-onset hypotonia, poor overall growth, poor
      speech/language ability, and additional common phenotypes such as eye
      anomalies, joint hypermobility, and skeletal anomalies of the hands and
      feet.
    explanation: >-
      Establishes that distal skeletal anomalies of the hands and feet and joint
      hypermobility are core, defining features requiring a non-neural
      developmental arm.
  - reference: PMID:41918386
    reference_title: "[A fetus with Neurodevelopmental disorders with deformed facial features and distal skeletal abnormalities due to a rare variant of ZMIZ1 gene and literature review]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Combined with 25 cases from the literature, the main manifestations of
      patients have included intellectual disability, growth retardation and
      cranio-limb skeletal dysplasia, albeit without clear genotype-phenotype
      correlation.
    explanation: >-
      Confirms cranio-limb skeletal dysplasia as a recurrent manifestation
      across the published series, and notes the absence of a
      genotype-phenotype correlation.
  - reference: PMID:41354990
    reference_title: "Genetic and functional analysis of ZMIZ1 in neurodevelopmental disorder with dysmorphic facies and distal skeletal anomalies (NEDDFSA): insights from muscle cells and signaling pathways."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Functional assays demonstrated enhanced proliferation and migration in
      HSkMCs expressing the mutant ZMIZ1.
    explanation: >-
      The only functional evidence for a ZMIZ1 patient allele acting in a
      non-neural musculoskeletal cell type. Marked PARTIAL because skeletal
      muscle cells are not the cartilage or bone lineage that patterns the
      distal skeleton.
- name: Syndromic Multisystem Malformation
  description: >-
    The organism-level structural output that makes this disorder syndromic
    rather than a pure neurodevelopmental disorder: the recognizable dysmorphic
    facial pattern, distal skeletal anomalies of the hands and feet, joint
    hypermobility or contracture, and the minority cardiac and genitourinary
    malformations. Prenatally the same failure can present as microcephaly with
    short femur and intrauterine growth restriction. Because no lineage-specific
    model exists, this node inherits the PROVISIONAL standing of its upstream
    patterning node.
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:30639322
    reference_title: "ZMIZ1 Variants Cause a Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The associated features include growth failure, feeding difficulties,
      microcephaly, facial dysmorphism, and various other congenital
      malformations.
    explanation: >-
      Establishes that congenital malformations beyond the nervous system are
      part of the syndrome, which is what this organism-level node collects.
  - reference: PMID:41354990
    reference_title: "Genetic and functional analysis of ZMIZ1 in neurodevelopmental disorder with dysmorphic facies and distal skeletal anomalies (NEDDFSA): insights from muscle cells and signaling pathways."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      supplementary shared characteristics including joint hypermobility or
      joint contracture, eye anomalies, and acral skeletal malformations of
      extremities
    explanation: >-
      Names the non-neurological element of the syndrome — including that joint
      involvement runs in both directions, hypermobility or contracture — in the
      source's own words.
- name: Global Neurodevelopmental Impairment
  description: >-
    The organism-level neurodevelopmental output: early hypotonia and feeding
    difficulty, then delayed motor milestones, poor language acquisition,
    intellectual disability of highly variable severity, and behavioral
    abnormalities including autism and ADHD. Severity is not predictable from
    the variant. A domain-resolved re-analysis of 36 published individuals found
    that alanine-rich-domain variants associate preferentially with intellectual
    disability and motor delay while TPR and proline-rich-domain variants
    associate more with autism plus intellectual disability, but a
    prenatally-ascertained series explicitly found no clear genotype-phenotype
    correlation, and the intrafamilial variability in the one multigenerational
    family shows that genotype alone does not fix outcome.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:35432459
    reference_title: "A de Novo ZMIZ1 Pathogenic Variant for Neurodevelopmental Disorder With Dysmorphic Facies and Distal Skeletal Anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      global neurodevelopmental delay, early-onset hypotonia, poor overall
      growth, poor speech/language ability
    explanation: >-
      Names the core organism-level neurodevelopmental features in the source's
      own words.
  - reference: PMID:40529245
    reference_title: "Association of genetic variants, protein domains, and phenotypes in the ZMIZ1 syndromic neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We find that patients with SNVs in the Alanine-rich domain show strong
      association with diagnosis of ID (62.5%), motor delay (70%), and other
      physical phenotypic manifestations (100%), while ASD diagnosis in
      combination with ID is more strongly associated with mutations in TPR and
      Proline-rich domains.
    explanation: >-
      Supports the domain-resolved phenotype tendencies described in this node.
  - reference: PMID:41918386
    reference_title: "[A fetus with Neurodevelopmental disorders with deformed facial features and distal skeletal abnormalities due to a rare variant of ZMIZ1 gene and literature review]."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the main manifestations of patients have included intellectual disability,
      growth retardation and cranio-limb skeletal dysplasia, albeit without
      clear genotype-phenotype correlation
    explanation: >-
      Supports the core manifestations while qualifying the domain-association
      sub-claim: an independent literature synthesis found no clear
      genotype-phenotype correlation, so the domain-phenotype tendencies must
      not be used prognostically. Marked PARTIAL rather than REFUTE because it
      qualifies one statement inside this node, it does not contradict the node
      itself.
genetic:
- name: ZMIZ1
  gene_term:
    preferred_term: ZMIZ1
    term:
      id: hgnc:16493
      label: ZMIZ1
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  association: >-
    Heterozygous ZMIZ1 variants are the sole established cause of NEDDFSA. The
    gene lies at 10q22.3, spans 21 exons, and encodes a 1067-amino-acid
    PIAS-family transcriptional coactivator. Most pathogenic alleles arise de
    novo; germline transmission from a mildly affected parent is documented.
    ZMIZ1 is highly constrained against loss of function in population data
    (observed/expected 0.13).
  notes: >-
    Reported allele classes: missense substitutions (e.g. c.2330G>A p.Gly777Glu
    in the SP-RING/MIZ zinc finger; c.881C>T p.Thr294Ile, c.899C>T p.Thr300Met,
    and c.910G>C p.Ala304Pro in the alanine-rich region), in-frame deletion
    (c.858_875del p.Val288_Ala293del), frameshifting truncations (c.1310delC
    p.Pro437ArgfsX84; c.2633dup p.Gly879ArgfsTer22), a canonical splice-site
    variant causing exon 14 skipping (c.1491+2T>C), and balanced translocations
    disrupting ZMIZ1 or a ZMIZ1 regulatory region. Three caveats attach to the
    c.1491+2T>C splice allele and it should not be read as an established
    pathogenic class: it comes from the dual-genotype PMID:34680978 proband who
    also carries an OTUD6B frameshift over a paternally inherited 0.118 Mb
    8q21.3 deletion involving OTUD6B; it was inherited from her father, whose
    phenotype that report does not characterize; and the 2025 domain-resolved
    re-analysis explicitly excluded splice donor/acceptor variants from its
    curated set. It is listed here as a molecular observation only.
  evidence:
  - reference: PMID:30639322
    reference_title: "ZMIZ1 Variants Cause a Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report 19 subjects with intellectual disability and developmental
      delay carrying variants in ZMIZ1.
    explanation: >-
      The founding cohort establishing ZMIZ1 as the causative gene for this
      syndromic neurodevelopmental disorder.
  - reference: PMID:38117436
    reference_title: "Clinical report and genetic analysis of a novel variant in ZMIZ1 causing neurodevelopmental disorder with dysmorphic factors and distal skeletal anomalies in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The zinc finger MIZ-type containing 1 gene (ZMIZ1) is a causative gene of
      NEDDFSA that encodes a protein inhibitor of the activated STAT-like family
      transcriptional regulator.
    explanation: >-
      Independent confirmation of causation and of the PIAS-like protein family
      assignment.
  - reference: PMID:38686122
    reference_title: "Zmiz1 is a novel regulator of brain development associated with autism and intellectual disability."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Zmiz1 has an oe-score of 0.13 for loss-of-function mutations (observed
      SNVs 7/expected SNVs 52.1), which indicates that only 13% of the expected
      loss-of-function variants were observed in sampled data.
    explanation: >-
      Quantifies the loss-of-function constraint cited in the association text.
  - reference: PMID:38686122
    reference_title: "Zmiz1 is a novel regulator of brain development associated with autism and intellectual disability."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      an oe-score of 0.64 for missense mutations (observed SNVs 447/expected
      SNVs 699.1)
    explanation: >-
      Companion missense-constraint figure. Missense depletion is real but far
      milder than the loss-of-function depletion, which is why the entry treats
      individual missense alleles as requiring their own functional evidence
      rather than inheriting the gene-level dosage argument.
  - reference: PMID:34680978
    reference_title: "Compound Heterozygote of Point Mutation and Chromosomal Microdeletion Involving OTUD6B Coinciding with ZMIZ1 Variant in Syndromic Intellectual Disability."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This ZMIZ1 variant yielded exon 14 skipping, as evidenced by mRNA study."
    explanation: >-
      Molecular observation only, documenting a splice-disrupting allele class.
      Marked PARTIAL and explicitly confounded — the proband in this report also
      carries a hemizygous OTUD6B c.873delA over a paternally inherited 0.118 Mb
      8q21.3 deletion involving OTUD6B, so none of her clinical features can be
      attributed to ZMIZ1 alone and no phenotype from this report is curated in
      this entry.
  - reference: PMID:34680978
    reference_title: "Compound Heterozygote of Point Mutation and Chromosomal Microdeletion Involving OTUD6B Coinciding with ZMIZ1 Variant in Syndromic Intellectual Disability."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a heterozygous ZMIZ1 variant, c.1491 + 2T > C, in the patient and her
      father
    explanation: >-
      Records that this splice allele was inherited rather than de novo, and
      that the transmitting father's phenotype is not characterized in the
      report — a further reason its independent pathogenicity is unestablished.
      Same dual-genotype confound as above.

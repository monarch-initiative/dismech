    reference_title: "ZMIZ1 Variants Cause a Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of these 19, 14 unrelated subjects carried de novo heterozygous
      single-nucleotide variants (SNVs) or single-base insertions/deletions, 3
      siblings harbored a heterozygous single-base insertion, and 2 subjects had
      a balanced translocation disrupting ZMIZ1 or involving a regulatory region
      of ZMIZ1.
    explanation: >-
      Establishes the heterozygous, largely de novo allelic architecture and the
      existence of structural as well as point lesions.
  - reference: PMID:30639322
    reference_title: "ZMIZ1 Variants Cause a Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, we identified 13 point mutations that affect key protein
      regions, including a SUMO acceptor site, a central disordered alanine-rich
      motif, a proline-rich domain, and a transactivation domain.
    explanation: >-
      Localizes the pathogenic point mutations to the functional regions that
      carry ZMIZ1 coregulator activity.
  - reference: PMID:38686122
    reference_title: "Zmiz1 is a novel regulator of brain development associated with autism and intellectual disability."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Zmiz1 has an oe-score of 0.13 for loss-of-function mutations (observed
      SNVs 7/expected SNVs 52.1), which indicates that only 13% of the expected
      loss-of-function variants were observed in sampled data.
    explanation: >-
      Population-genetic constraint metric supporting dosage sensitivity of
      ZMIZ1. Classified COMPUTATIONAL because it is derived from a
      variant-database observed/expected calculation, not a wet-lab assay.
  - reference: PMID:38117436
    reference_title: "Clinical report and genetic analysis of a novel variant in ZMIZ1 causing neurodevelopmental disorder with dysmorphic factors and distal skeletal anomalies in a Chinese family."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Western blot and immunofluorescence assays indicated a significant
      decrease in the expression level of the mutant ZMIZ1 protein compared to
      the wild-type protein.
    explanation: >-
      Direct cell-based demonstration that an alanine-rich-domain in-frame
      deletion allele reduces ZMIZ1 protein abundance, one documented route from
      variant to loss of coregulator dosage.
  - reference: PMID:41354990
    reference_title: "Genetic and functional analysis of ZMIZ1 in neurodevelopmental disorder with dysmorphic facies and distal skeletal anomalies (NEDDFSA): insights from muscle cells and signaling pathways."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      The p.A304P variant significantly increased ZMIZ1 mRNA and protein
      expression levels and altered its subcellular localization.
    explanation: >-
      Supports the statement that allelic consequences are heterogeneous — this
      variant raises rather than lowers ZMIZ1 levels — so the mechanism is not
      uniformly simple haploinsufficiency. Marked PARTIAL because it is a single
      allele assayed in skeletal muscle cells, not neurons.
- name: Impaired PIAS-Family Coactivator Function
  description: >-
    ZMIZ1 is a PIAS-family transcriptional coregulator built around a conserved
    MIZ (Msx-interacting zinc finger) SP-RING domain that confers SUMO E3 ligase
    activity, an N-terminal TPR that binds NOTCH1, and a C-terminal
    transactivation domain. It does not bind DNA on its own; it potentiates
    signal-dependent transcription factors — NOTCH1, the androgen receptor, p53,
    and SMAD3/4 — and works with the BAF (SWI/SNF) chromatin remodeling complex.
    Pathogenic variants degrade this coactivation function. The
    best-characterized readout is androgen receptor coactivation, which is
    measurably impaired in vitro by patient alleles; a newly described
    interaction with the general transcription factor GTF2I and dysregulation of
    TGF-beta1 pathway genes suggest the coregulator hub is broader than the four
    classical partners.

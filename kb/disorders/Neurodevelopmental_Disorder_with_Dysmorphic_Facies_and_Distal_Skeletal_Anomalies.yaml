name: Neurodevelopmental Disorder with Dysmorphic Facies and Distal Skeletal Anomalies
creation_date: "2026-08-15T00:00:00Z"
description: >-
  Neurodevelopmental disorder with dysmorphic facies and distal skeletal
  anomalies (NEDDFSA, OMIM 618659) is a rare autosomal dominant syndromic
  neurodevelopmental disorder caused by heterozygous variants in ZMIZ1, which
  encodes a PIAS-family zinc finger MIZ-type transcriptional coactivator and
  SUMO E3 ligase. Affected individuals typically present in early infancy with
  poor feeding, poor overall growth, and hypotonia, followed by mildly delayed
  motor development, poor language acquisition, and behavioral abnormalities.
  Intellectual outcome is strikingly variable, ranging from severe impairment
  to normal cognition even within a single family. The syndrome is completed by
  a recognizable pattern of facial dysmorphism, distal skeletal anomalies of
  the hands and feet, joint hypermobility, and ocular findings — ptosis is the
  single most common eye feature. Microcephaly is common (64% of imaged
  individuals) and sensorineural hearing loss affects about a third, while
  seizures, congenital heart defects, and genitourinary anomalies occur in a
  minority. ZMIZ1 acts as a coactivator for NOTCH1, the androgen receptor, p53,
  and SMAD3/4, and interacts with the BAF chromatin remodeling complex, so the
  disorder is best understood as a transcriptional-coregulator disease in which
  developmental transcriptional programs — cortical neurogenesis, neuronal
  differentiation and positioning, dendritic outgrowth, and skeletal
  patterning — are dysregulated. The entity was delineated only in 2019 and
  fewer than forty individuals have been reported, so phenotype frequencies
  should be read as provisional.
category: Mendelian
parents:
- hereditary disease
- Neurodevelopmental Disorder
synonyms:
- NEDDFSA
- ZMIZ1-related neurodevelopmental disorder
- ZMIZ1 syndrome
- ZMIZ1-related syndromic intellectual disability

notes: >-
  Identifiers. MONDO:0032855; OMIM:618659; MedGen C5231448; GARD 0018521;
  UMLS C5231448; causal gene ZMIZ1 (hgnc:16493, 10q22.3). Orphanet has no
  dedicated ORPHA code for this entity as of curation.

  Named-entity-confusion preflight. This entity sits in a large family of
  near-identically named OMIM "neurodevelopmental disorder with ..." entries and
  was treated as high NEC risk during curation. The MONDO record for
  MONDO:0032855 was pulled with OAK on 2026-08-15 and gives three concordant
  identity anchors: "relationship: RO:0004003 HGNC:16493 ! ZMIZ1",
  "xref: OMIM:618659", and the RELATED synonym "NEDDFSA". Every clinical paper
  cited in this entry names ZMIZ1 as the causal gene, so gene, OMIM ID, and
  synonym all agree and no NEC discard was triggered. The Edison/falcon
  deep-research report used for this entry also passed the automated
  gene-frequency preflight (just preflight-dr): ZMIZ1 was mentioned 41 times
  against a next-highest gene count of 3 (AR), and the report's OMIM number
  matched the MONDO xref.

  The single most dangerous confusable is "neurodevelopmental disorder with
  dysmorphic facies and distal LIMB anomalies" (NEDDFL, MONDO:0060596,
  OMIM:617755), caused by BPTF (HGNC:3581). The labels differ by one word,
  "skeletal" versus "limb". NEDDFL is recorded here under
  differential_diagnoses. Note that as of this entry's creation there is NO
  NEDDFL/BPTF entry in kb/disorders — MONDO:0060596 appears in the KB only as a
  differential reference from this entry and from the OTUD6B entry — so a future
  curator must not assume the confusable is already covered elsewhere. Nothing
  in this entry may be sourced from BPTF literature.

  Dual-genotype confound in PMID:34680978. That report describes a 5-year-old
  Thai girl who carries BOTH a hemizygous OTUD6B c.873delA over a paternally
  inherited 8q21.3 whole-gene deletion AND a heterozygous ZMIZ1 c.1491 + 2T > C
  splice variant shown by mRNA study to skip exon 14. Her clinical features
  (Williams syndrome-like facial gestalt with periorbital edema, hanging cheek,
  long and smooth philtrum; cardiac defects; terminal broadening of the fingers;
  polydactyly) cannot be attributed cleanly to either locus, and the authors
  themselves assign the Williams-like features to the OTUD6B side. This entry
  therefore does NOT curate any phenotype from that proband. PMID:34680978
  appears exactly FIVE times in this file, and every one is accounted for here:
  (1) genetic[0].evidence[4], the mRNA-study observation that the splice variant
  skips exon 14, supports: PARTIAL; (2) genetic[0].evidence[5], the observation
  that the allele was inherited from the father, supports: PARTIAL;
  (3) differential_diagnoses[1].evidence[0], the authors' statement of the
  phenotypic overlap between ZMIZ1 and OTUD6B disease, supports: SUPPORT;
  (4) differential_diagnoses[1].evidence[1], the inheritance-mode discriminator
  between the two entities, supports: SUPPORT; and (5) one bibliography entry in
  the top-level references list, which carries no snippet and asserts nothing.
  All four evidence citations restate the dual-genotype confound in their
  explanation, and none of them attributes a phenotype to ZMIZ1. The reciprocal
  caveat is already recorded in the dismech OTUD6B-Related Neurodevelopmental
  Disorder entry.

  No GeneReviews chapter exists. PubMed searches for "ZMIZ1 GeneReviews" and
  "neurodevelopmental disorder with dysmorphic facies and distal skeletal
  anomalies GeneReviews" both returned zero results on 2026-08-15, so no
  GeneReviews phenotype baseline was available and the phenotype set is built
  from the primary case literature and the two published cohort/meta-analyses
  (PMID:39658964, PMID:40529245).

  Beyond-abstract sourcing. Several cached references (PMID:35432459,
  PMID:38686122, PMID:41354990, PMID:41633496) are cached as full text rather
  than abstract-only, and linkml-reference-validator checks snippets against the
  cached body. Evidence items in this entry therefore quote figures and
  Results-section sentences from those papers as well as abstract text; each such
  snippet was confirmed against the cached file before use. Where a paper is
  cached abstract-only, quotes are confined to the abstract.

  ZMIZ1-PRR12 translocation. A balanced t(10;19)(q22.3;q13.33) disrupting ZMIZ1
  and PRR12 was reported before the syndrome was delineated. PRR12 causes its
  own distinct disorder (PRR12-related neuroocular syndrome, curated separately
  in dismech), so translocation cases that disrupt both genes are not clean
  ZMIZ1 evidence and are not used for phenotype curation here.
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Disease results from a single heterozygous ZMIZ1 allele. The great majority
    of reported variants arose de novo, but vertical transmission is
    established: a father and his two sons all carry the same pathogenic
    frameshift allele c.1310delC (p.Pro437ArgfsX84). Expressivity within that
    family was markedly variable — severity of intellectual disability and
    eyelid ptosis differed between affected members and only one of the two
    children had sensorineural hearing loss — so a mildly affected transmitting
    parent can easily be missed without targeted parental testing.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  evidence:
  - reference: PMID:35432459
    reference_title: "A de Novo ZMIZ1 Pathogenic Variant for Neurodevelopmental Disorder With Dysmorphic Facies and Distal Skeletal Anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NEDDFSA is caused by heterozygous pathogenic variants in the ZMIZ1 gene on
      chromosome 10q22.3 with autosomal dominant (AD) mode of inheritance.
    explanation: >-
      States the mode of inheritance and the heterozygous, single-allele
      mechanism for the named entity NEDDFSA.
  - reference: PMID:31833199
    reference_title: "Autosomal dominant inheritance in a recently described ZMIZ1-related neurodevelopmental disorder: Case report of siblings and an affected parent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we report on a father and his two sons demonstrating autosomal dominant
      inheritance of a novel pathogenic ZMIZ1 variant, c.1310delC
      (p.Pro437ArgfsX84), causing this recently described neurodevelopmental
      syndrome.
    explanation: >-
      Documents germline transmission across two generations, confirming
      dominant inheritance rather than exclusively de novo occurrence.
  - reference: PMID:31833199
    reference_title: "Autosomal dominant inheritance in a recently described ZMIZ1-related neurodevelopmental disorder: Case report of siblings and an affected parent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our report demonstrates that phenotypic features of ZMIZ1-related
      neurodevelopmental syndrome are variable even within the same family and
      that parental testing to identify a mildly affected parent is needed.
    explanation: >-
      Supports the variable-expressivity classification and the clinical
      implication that transmitting parents may be only mildly affected.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than forty individuals reported since the syndrome was delineated in
    2019. A 2025 systematic re-analysis assembled 36 individuals with coding
    ZMIZ1 variants from 15 publications; a 2024 ophthalmology-focused review
    found 27 published cases. No population prevalence estimate exists and none
    should be inferred from these case counts.
  evidence:
  - reference: PMID:40529245
    reference_title: "Association of genetic variants, protein domains, and phenotypes in the ZMIZ1 syndromic neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study includes descriptions of ZMIZ1 disease-associated variants of
      36 individuals diagnosed with NDDs: 35 single-nucleotide variants (SNVs)
      and 1 deletion, all in the coding sequence.
    explanation: >-
      Gives the size of the assembled published case series, supporting the
      ultra-rare / cases-in-literature classification.
  - reference: PMID:39658964
    reference_title: "A novel ZMIZ1 variant associated with NEDDFSA and new ocular features: case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Review of the literature permitted the analysis of 27 cases of ZMIZ1
      variants in patients with syndromic phenotypes.
    explanation: >-
      Independent case count from a separate systematic literature review,
      corroborating the very small number of reported individuals.
pathophysiology:
- name: Heterozygous ZMIZ1 Variant
  description: >-
    A single heterozygous variant in ZMIZ1 (10q22.3) is the initiating lesion.
    Reported alleles are overwhelmingly de novo and are distributed across the
    coding sequence but cluster in functionally defined regions: the N-terminal
    tetratricopeptide repeat (TPR) that mediates NOTCH1 binding, the central
    intrinsically disordered alanine-rich motif, the proline-rich domains, the
    SP-RING/MIZ zinc finger, and the C-terminal transactivation domain. Both
    missense substitutions and frameshifting truncations occur, and structural
    lesions (balanced translocations disrupting ZMIZ1 or its regulatory region)
    have also been reported. ZMIZ1 is strongly constrained against
    loss-of-function variation in population data, consistent with dosage
    sensitivity. Functional consequences documented so far are nonetheless
    heterogeneous: an alanine-rich in-frame deletion reduced mutant protein
    abundance, whereas a different alanine-rich missense allele increased ZMIZ1
    expression and mislocalized the protein, so a simple haploinsufficiency
    model does not account for every allele. The latter measurement comes from
    transfected constructs in skeletal muscle and HEK293T cells rather than
    endogenous patient cells, so it more plausibly reports altered protein
    stability than patient-level upregulation.

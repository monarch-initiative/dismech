- name: Dysregulated Developmental Transcriptional Programs
  description: >-
    ZMIZ1 is most highly expressed during embryonic brain development in both
    mouse and human and is enriched in cortex, hippocampus, and cerebellum — the
    regions most implicated in intellectual disability and autism. Loss of
    ZMIZ1 function changes the transcriptional programs governing neurogenesis,
    neuronal differentiation, and synaptic signaling. In a forebrain-specific
    Zmiz1 knockout mouse, ZMIZ1 was shown by RNA-seq and ChIP-seq to regulate
    key neurodevelopmental effectors including Lhx2, Auts2, and EfnB2, and the
    ZMIZ1 interaction network is enriched for autism-associated genes. Because
    the same coactivator serves NOTCH1, AR, p53, and SMAD3/4 in non-neural
    tissue, the same lesion perturbs craniofacial, skeletal, cardiac, and
    genitourinary developmental programs, which is why the disorder is syndromic
    rather than purely neurological.

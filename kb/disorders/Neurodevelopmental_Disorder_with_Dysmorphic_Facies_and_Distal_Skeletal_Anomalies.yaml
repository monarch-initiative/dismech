  evidence:
  - reference: GEO:GSE225435
    reference_title: "RNA sequencing on Postnatal day (P) 7 wildtype and Zmiz1-Knockout cortex"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found 114 differentially expressed genes of which 35 genes were
      upregulated while 69 genes were downregulated. Downregulated genes were
      enriched in biological processes such as forebrain deveopment, axon
      development, neuron differentiation etc.
    explanation: >-
      Quantifies the transcriptional dysregulation asserted by the
      developmental-transcriptional-programs node, and names the enriched
      processes. The typo "deveopment" is present in the source record and is
      reproduced verbatim so the snippet validates.
  notes: >-
    Mouse cortex, not human tissue. No patient-derived transcriptomic dataset
    exists for this disorder, which is the calibration caveat recorded on the
    developmental-transcriptional-programs node.

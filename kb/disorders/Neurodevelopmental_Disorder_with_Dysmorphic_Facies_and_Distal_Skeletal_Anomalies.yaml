animal_models:
- species: Mus musculus
  genotype: Forebrain-specific conditional Zmiz1 knockout
  category: Conditional loss-of-function mouse model of ZMIZ1 syndrome
  description: >-
    The principal in vivo loss-of-function model of this disorder, reported in
    PMID:41633496. It reproduces cortical microcephaly, corpus callosum
    dysgenesis, and abnormal differentiation of upper-layer cortical neurons,
    together with autism-like behavioral changes in motor activity, anxiety,
    communication, and social interaction with strong sex differences. RNA-seq
    plus ChIP-seq identified Lhx2, Auts2, and EfnB2 as ZMIZ1-regulated
    neurodevelopmental targets, and reactivation of the ephrin-B2 pathway
    rescued the dendritic outgrowth deficit — the first mechanistic rescue
    reported for this disorder. It models the "Impaired Cortical Neurogenesis,
    Neuronal Differentiation, and Positioning" and "Dysregulated Developmental
    Transcriptional Programs" pathophysiology nodes. Face validity for the
    neurological arm is good, but because Zmiz1 deletion is restricted to
    forebrain the model cannot address the craniofacial, distal skeletal,
    cardiac, or genitourinary features, which therefore remain unmodeled.
  associated_phenotypes:
  - Cortical microcephaly
  - Corpus callosum dysgenesis
  - Abnormal differentiation of upper-layer cortical neurons
  - Autism-like social and communication deficits
  evidence:
  - reference: PMID:41633496
    reference_title: "Loss of Zmiz1 in Mice Leads to Impaired Cortical Development and Autistic-Like Behaviors."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We generated forebrain-specific Zmiz1 mutant mice (Zmiz1-knockout) to
      assess ZMIZ1 function in cortical development.
    explanation: Describes the model construction.
  - reference: PMID:41633496
    reference_title: "Loss of Zmiz1 in Mice Leads to Impaired Cortical Development and Autistic-Like Behaviors."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss of ZMIZ1 led to cortical microcephaly, corpus callosum dysgenesis,
      and abnormal differentiation of upper-layer cortical neurons.
    explanation: >-
      Establishes the structural brain phenotypes recapitulated by the model.
- species: Mus musculus
  genotype: In utero electroporation of patient ZMIZ1 mutant alleles into embryonic cortex
  category: Acute somatic overexpression model of patient alleles
  description: >-
    An acute somatic model, reported in PMID:30639322, in which patient-derived
    ZMIZ1 mutant alleles were introduced into cortical progenitors of the
    embryonic mouse ventricular zone by in utero electroporation. Mutant alleles
    produced abnormal pyramidal neuron morphology, polarization, and
    positioning. This was the in vivo evidence that established the
    pathogenicity of the human alleles and models the "Impaired Cortical
    Neurogenesis, Neuronal Differentiation, and Positioning" node. Interpretive
    caveat: it is an overexpression paradigm, not an endogenous knock-in, so it
    cannot distinguish loss of function from dominant-negative or
    gain-of-function effects; the conditional knockout above is the
    complementary loss-of-function test.
  associated_phenotypes:
  - Abnormal pyramidal neuron morphology and polarization
  - Impaired neuronal positioning in the developing cortex
  evidence:
  - reference: PMID:30639322
    reference_title: "ZMIZ1 Variants Cause a Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In vivo, overexpression of ZMIZ1 mutant alleles in developing mouse brains
      using in utero electroporation resulted in abnormal pyramidal neuron
      morphology, polarization, and positioning
    explanation: >-
      Describes the model and its principal readout, linking human alleles to a
      cortical developmental defect.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Diagnosis rests on identification of a heterozygous pathogenic ZMIZ1 variant.
    In practice every reported diagnosis has come from exome sequencing or a
    broad multigene panel rather than from targeted single-gene testing, because
    the clinical gestalt is not specific enough to prompt a directed test.
    Chromosomal microarray and structural-variant analysis remain relevant
    because balanced translocations disrupting ZMIZ1 or its regulatory region
    also cause the disorder and are invisible to standard exome analysis. Trio
    testing is preferred: most variants are de novo, and where they are not, the
    transmitting parent may be only mildly affected and requires targeted
    testing to identify.
  evidence:
  - reference: PMID:41918386
    reference_title: "[A fetus with Neurodevelopmental disorders with deformed facial features and distal skeletal abnormalities due to a rare variant of ZMIZ1 gene and literature review]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing (WES) was carried out on the amniotic fluid and
      parental peripheral blood samples, and candidate variants was verified by
      Sanger sequencing.
    explanation: >-
      Illustrates the trio exome-plus-Sanger workflow, here applied prenatally.
  - reference: PMID:30639322
    reference_title: "ZMIZ1 Variants Cause a Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      2 subjects had a balanced translocation disrupting ZMIZ1 or involving a
      regulatory region of ZMIZ1
    explanation: >-
      Justifies retaining cytogenomic/structural testing alongside sequencing,
      since translocation and regulatory lesions also cause the disorder.
  - reference: PMID:31833199
    reference_title: "Autosomal dominant inheritance in a recently described ZMIZ1-related neurodevelopmental disorder: Case report of siblings and an affected parent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "parental testing to identify a mildly affected parent is needed"
    explanation: >-
      Supports the recommendation for parental testing rather than assuming de
      novo occurrence.
differential_diagnoses:
- name: Neurodevelopmental Disorder with Dysmorphic Facies and Distal Limb Anomalies (NEDDFL, BPTF)
  disease_term:
    preferred_term: BPTF-related neurodevelopmental disorder (NEDDFL)
    term:
      id: MONDO:0060596
      label: neurodevelopmental disorder with dysmorphic facies and distal limb anomalies
  description: >-
    The single most important label hazard for this entry. NEDDFL
    (MONDO:0060596, OMIM:617755) is caused by heterozygous variants in BPTF
    (HGNC:3581), a bromodomain PHD finger chromatin-remodeling transcription
    factor. Its name differs from this disorder's by one word — "limb" versus
    "skeletal" — and both are autosomal dominant syndromic neurodevelopmental
    disorders with developmental delay, dysmorphic facies, microcephaly, and
    distal anomalies. They are separate entities with separate causal genes and
    must never be pooled.
  distinguishing_features:
  - >-
    Molecular: BPTF (HGNC:3581), a bromodomain/PHD-finger chromatin remodeler,
    versus ZMIZ1 (hgnc:16493), a PIAS-family SUMO E3 ligase and transcriptional
    coactivator. Different genes, different chromosomes, different protein
    families. This is the definitive discriminator and requires sequencing.
  - >-
    Nomenclature: "distal LIMB anomalies" (NEDDFL, BPTF, OMIM:617755) versus
    "distal SKELETAL anomalies" (NEDDFSA, ZMIZ1, OMIM:618659). Curators and
    automated literature-mining tools must key on the gene or the OMIM number,
    never on the disease name alone.
  - >-
    Clinical emphasis: postnatal microcephaly and speech delay are prominent in
    NEDDFL, whereas the ZMIZ1 disorder is anchored on early hypotonia, poor
    feeding and growth failure, joint hypermobility, and ptosis as the leading
    ocular sign.
  notes: >-
    No shared mechanism justifies pooling evidence between these entities: BPTF
    acts through the NURF chromatin-remodeling complex, ZMIZ1 through
    PIAS-family coactivation of NOTCH1, AR, p53, and SMAD3/4. Any DR-sourced
    claim about a "NEDDF-" disorder must be checked against the gene before use.
    The identity of MONDO:0060596 with BPTF and OMIM:617755 was verified with
    OAK during the NEC preflight for this entry.
- name: OTUD6B-Related Neurodevelopmental Disorder (IDDFSDA)
  disease_term:
    preferred_term: OTUD6B-related intellectual developmental disorder
    term:
      id: MONDO:0044319
      label: intellectual developmental disorder with dysmorphic facies, seizures, and distal limb anomalies
  description: >-
    An autosomal recessive syndromic intellectual disability caused by biallelic
    OTUD6B variants, sharing facial dysmorphism, distal limb anomalies, and
    seizures with this disorder. Crucially, the two are not merely confusable:
    PMID:34680978 reports a single 5-year-old girl who genuinely carries
    disease-relevant variants at BOTH loci — a hemizygous OTUD6B c.873delA over
    a paternally inherited 8q21.3 whole-gene deletion, together with a
    heterozygous ZMIZ1 c.1491+2T>C splice variant shown by mRNA study to skip
    exon 14. Finding a ZMIZ1 variant therefore does not exclude OTUD6B disease,
    and vice versa.
  distinguishing_features:
  - >-
    Inheritance: OTUD6B disease is autosomal recessive (biallelic), this
    disorder is autosomal dominant (heterozygous). This alone usually separates
    them on a trio exome.
  - >-
    Molecular: OTUD6B is a deubiquitinase; ZMIZ1 is a transcriptional
    coactivator and SUMO E3 ligase. No shared mechanism, so evidence must not be
    pooled across the two entries.
  notes: >-
    Attribution rule applied in this entry: no phenotype from the dual-genotype
    PMID:34680978 proband is curated here, and every citation to that paper is
    marked with the confound explicitly. The reciprocal caveat is recorded in
    the dismech OTUD6B-Related Neurodevelopmental Disorder entry, which curates
    that proband's Williams syndrome-like features (periorbital edema, hanging
    cheek, long and smooth philtrum) and polydactyly with supports PARTIAL for
    the same reason.
  evidence:
  - reference: PMID:34680978
    reference_title: "Compound Heterozygote of Point Mutation and Chromosomal Microdeletion Involving OTUD6B Coinciding with ZMIZ1 Variant in Syndromic Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The OTUD6B and ZMIZ1 genes were recently identified as causes of syndromic
      intellectual disability (ID) with shared phenotypes of facial dysmorphism,
      distal limb anomalies, and seizure disorders.
    explanation: >-
      States the phenotypic overlap that makes OTUD6B disease a differential, in
      the authors' own words.
  - reference: PMID:34680978
    reference_title: "Compound Heterozygote of Point Mutation and Chromosomal Microdeletion Involving OTUD6B Coinciding with ZMIZ1 Variant in Syndromic Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      OTUD6B- and ZMIZ1-related ID are inherited in autosomal recessive and
      autosomal dominant patterns, respectively.
    explanation: >-
      Sources the inheritance-mode discriminator between the two entities.
- name: PRR12-Related Neuroocular Syndrome
  disease_term:
    preferred_term: PRR12-related neuroocular syndrome
    term:
      id: MONDO:0971007
      label: neuroocular syndrome 1
  description: >-
    A separate autosomal dominant neurodevelopmental disorder caused by PRR12
    haploinsufficiency, relevant here for a specific structural reason: the
    balanced translocation t(10;19)(q22.3;q13.33) that first drew attention to
    the ZMIZ1 locus simultaneously disrupts PRR12, producing reciprocal
    ZMIZ1-PRR12 and PRR12-ZMIZ1 fusion genes. Translocation probands therefore
    carry lesions at two independent neurodevelopmental disease genes.
  distinguishing_features:
  - >-
    Molecular: PRR12 (19q13.33), a proline-rich chromatin-associated nuclear
    protein, versus ZMIZ1 (10q22.3), a PIAS-family coactivator.
  - >-
    Clinical: the PRR12 disorder is defined by its ocular phenotype across the
    anophthalmia-microphthalmia-coloboma spectrum and anterior segment
    dysgenesis. The ZMIZ1 ocular phenotype is quite different — eyelid and
    refractive findings (ptosis, blepharophimosis, myopia, strabismus,
    amblyopia), not MAC-spectrum globe malformation.
  notes: >-
    Curation rule applied here: cases whose only lesion is a t(10;19)
    translocation disrupting both genes are not used as clean ZMIZ1 phenotype
    evidence in this entry.
treatments:
- name: Multidisciplinary Supportive and Developmental Care
  description: >-
    No disease-modifying therapy exists. Management is entirely supportive and
    anticipatory, directed at the individual features: nutritional support for
    the infantile feeding difficulty and growth failure, early intervention with
    physical, occupational, and speech therapy for the hypotonia and
    developmental delay, ophthalmological assessment and management (ptosis
    repair, refractive correction, amblyopia therapy) given that ptosis and
    refractive error are the leading eye findings, audiological surveillance
    because sensorineural hearing loss affects roughly a third of individuals,
    orthopaedic assessment for hip dysplasia and distal limb anomalies, seizure
    management where relevant, and cardiac and renal imaging given the reported
    congenital heart and genitourinary anomalies.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  notes: >-
    Modality: recorded as OTHER, not BEHAVIORAL. This treatment is a
    multidisciplinary bundle spanning nutritional support, physical/occupational/
    speech therapy, ophthalmic surgery (ptosis repair) and refractive correction,
    hearing devices, and orthopaedic and cardiac/renal surveillance. Those span
    the BEHAVIORAL, SURGERY, and DEVICE modalities at once, so no single platform
    value is truthful; per the single-value discipline in CLAUDE.md the honest
    tag is OTHER. Splitting this into per-modality treatments would be a
    reasonable future refinement once disease-specific management evidence exists.

    This management framework is assembled from the phenotype set rather than
    from a published management guideline: no GeneReviews chapter, consensus
    statement, or natural-history study exists for NEDDFSA, and no clinical
    trial has been registered. It is therefore standard-of-care extrapolation,
    which is why it carries no evidence items — no publication states these
    recommendations for this disorder, and fabricating a citation would be worse
    than recording the gap. See the neddfsa_no_management_guideline discussion.
- name: Genetic Counseling
  description: >-
    Counseling should cover the autosomal dominant mechanism, the 50 percent
    recurrence risk for an affected parent, and the low but non-zero recurrence
    risk after an apparently de novo case (parental germline mosaicism cannot be
    excluded). Testing both parents is specifically indicated rather than
    optional, because a transmitting parent may be only mildly affected and
    would otherwise be missed — the family reported with c.1310delC included an
    affected father identified only after his sons were diagnosed. Prenatal
    diagnosis by exome sequencing on amniotic fluid has been performed
    successfully.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  notes: >-
    therapeutic_modality is deliberately omitted. CLAUDE.md's mechanical
    backfill table explicitly excludes NCIT:C15240 (Genetic Counseling) from
    modality assignment on the grounds that such actions are "not
    platform-classifiable"; tagging it BEHAVIORAL would misfile an informational
    and reproductive-risk intervention as a behavioral therapy.
  evidence:
  - reference: PMID:31833199
    reference_title: "Autosomal dominant inheritance in a recently described ZMIZ1-related neurodevelopmental disorder: Case report of siblings and an affected parent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "parental testing to identify a mildly affected parent is needed"
    explanation: >-
      Directly supports the recommendation that both parents be tested rather
      than assuming de novo occurrence.
  - reference: PMID:41918386
    reference_title: "[A fetus with Neurodevelopmental disorders with deformed facial features and distal skeletal abnormalities due to a rare variant of ZMIZ1 gene and literature review]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing has enabled accurate prenatal diagnosis and provided
      evidence for genetic counseling and reproductive guidance of this family.
    explanation: >-
      Supports the availability and utility of prenatal diagnosis and genetic
      counseling in this disorder.
discussions:
- discussion_id: neddfsa_no_management_guideline
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the natural history of NEDDFSA across the lifespan, and what
    surveillance schedule should ZMIZ1-related disorder actually follow?
  rationale: >-
    No GeneReviews chapter, consensus management statement, natural-history
    study, or registered clinical trial exists for this disorder. The management
    framework recorded in this entry is standard-of-care extrapolation from the
    phenotype list, not evidence-based guidance, and is deliberately left
    without evidence items for that reason. The single published adult (a woman
    who died unexpectedly at 52 and had chronic pain and lower limb deformities)
    is currently the only window onto adult outcome, so even basic questions —
    does hearing loss progress, does the hip and foot pathology need
    surveillance, is there excess mortality — are unanswered.
  attaches_to:
  - pathophysiology#Global Neurodevelopmental Impairment
  proposed_experiments:
  - experiment_id: exp_neddfsa_prospective_registry
    name: Prospective international ZMIZ1 natural-history registry
    description: >-
      Assemble a prospective international ZMIZ1 registry with standardized
      developmental, ophthalmological, audiological, orthopaedic, cardiac, and
      renal assessment at fixed ages, powered to produce an evidence-based
      surveillance schedule and a natural-history curve extending into
      adulthood.
  - experiment_id: exp_neddfsa_hpo_rephenotyping
    name: Systematic HPO re-phenotyping of all published cases
    description: >-
      Systematically re-code every published ZMIZ1 case against HPO from the
      primary descriptions, replacing the current mixture of narrative
      descriptions and partially overlapping literature reviews with computable,
      denominator-anchored feature frequencies.
- discussion_id: neddfsa_allele_mechanism_direction
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do all pathogenic ZMIZ1 alleles act by loss of coactivator function, or do
    some act by dominant-negative or gain-of-function mechanisms?
  rationale: >-
    The functional data point in opposite directions depending on the allele. An
    alanine-rich in-frame deletion (p.Val288_Ala293del) reduced ZMIZ1 protein
    abundance, consistent with haploinsufficiency, while a nearby alanine-rich
    missense allele (p.Ala304Pro) increased ZMIZ1 mRNA and protein and
    mislocalized the protein, which is not a loss-of-dosage phenotype.
    Gene-level constraint (loss-of-function observed/expected 0.13) supports
    dosage sensitivity but says nothing about individual missense alleles. The
    in vivo evidence that established pathogenicity used overexpression of
    mutant alleles by in utero electroporation, a paradigm that cannot separate
    loss of function from dominant-negative action. Resolving this matters
    directly for therapeutic strategy: dosage restoration would help only the
    haploinsufficient alleles.
  attaches_to:
  - pathophysiology#Heterozygous ZMIZ1 Variant
  - pathophysiology#Impaired PIAS-Family Coactivator Function
  proposed_experiments:
  - experiment_id: exp_neddfsa_isogenic_ipsc_allele_series
    name: Isogenic heterozygous knock-in iPSC allele series
    description: >-
      Generate isogenic heterozygous knock-in human iPSC lines for
      representative alleles from each domain (TPR, alanine-rich, proline-rich,
      SP-RING/MIZ, transactivation) alongside a heterozygous null, differentiate
      to cortical neurons, and compare transcriptomes. Null-like profiles
      indicate loss of function; profiles diverging from the null indicate
      dominant-negative or gain-of-function action.
  - experiment_id: exp_neddfsa_endogenous_coactivation_assays
    name: Endogenous-level coactivation and SUMO ligase assays per allele class
    description: >-
      Assay NOTCH1 and androgen receptor coactivation and SUMO E3 ligase
      activity for each allele class at endogenous expression levels rather than
      by overexpression, so that direction of effect is not an artifact of the
      assay.
- discussion_id: neddfsa_skeletal_arm_unmodeled
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Is the craniofacial and distal skeletal phenotype that names this disorder
    actually caused by ZMIZ1 loss in skeletal tissue, given that the only in vivo
    model deletes Zmiz1 exclusively in forebrain and therefore cannot develop it?
  rationale: >-
    The mechanism chain for the neurological arm is well supported in vivo, but
    the arm that gives the disorder its name is not modeled at all. The
    forebrain-specific Zmiz1 conditional knockout by construction cannot produce
    craniofacial or limb skeletal phenotypes, and the in utero electroporation
    model is CNS-only. The single functional study in a non-neural cell type
    used human skeletal muscle cells, which are neither the cartilage nor the
    osteoblast lineage that patterns the distal skeleton, and it reported
    increased proliferation and migration — a direction of effect that is not
    obviously connected to the clinical skeletal findings. This is a genuine
    model-to-human validity gap rather than an absence of evidence, which is why
    the Disrupted Craniofacial and Distal Skeletal Patterning node is marked
    PROVISIONAL.
  attaches_to:
  - pathophysiology#Disrupted Craniofacial and Distal Skeletal Patterning
  proposed_experiments:
  - experiment_id: exp_neddfsa_crest_and_limb_conditional_ko
    name: Neural-crest and limb-mesenchyme conditional Zmiz1 knockouts
    description: >-
      Generate a cranial-neural-crest-specific and a limb-mesenchyme-specific
      Zmiz1 conditional knockout and phenotype the craniofacial skeleton and
      autopod for the anomalies reported in patients, establishing whether the
      skeletal arm is cell-autonomous to those lineages.
  - experiment_id: exp_neddfsa_crest_target_profiling
    name: ZMIZ1 target profiling in human iPSC-derived crest and limb mesenchyme
    description: >-
      Profile ZMIZ1 chromatin occupancy and NOTCH1/SMAD target-gene output in
      human iPSC-derived cranial neural crest cells and limb-bud-like mesenchyme
      carrying patient alleles, to identify the skeletal target genes that are
      currently unknown.

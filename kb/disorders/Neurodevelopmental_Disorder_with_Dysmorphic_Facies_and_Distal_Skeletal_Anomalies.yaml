      progenitors and their projection-neuron progeny.
  - target: Disrupted Craniofacial and Distal Skeletal Patterning
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The non-neural arm. ZMIZ1 is broadly expressed in embryonic tissues and
      partners with SMAD3/4 and NOTCH1, both central to skeletal and
      craniofacial morphogenesis, but the specific target genes that produce
      the human facial and distal limb phenotype have not been identified.
  evidence:
  - reference: PMID:38686122
    reference_title: "Zmiz1 is a novel regulator of brain development associated with autism and intellectual disability."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Zmiz1 is highly expressed during embryonic brain development in mice and

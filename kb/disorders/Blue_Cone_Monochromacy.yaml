    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BCM patients typically suffer from poor visual acuity, severely impaired color
      discrimination, myopia, and nystagmus.
    explanation: >-
      Lists myopia among the typical features.
- category: Electrophysiologic
  name: Severely Reduced Photopic Cone Electroretinogram
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    The L/M-cone-driven photopic response is severely reduced or undetectable while
    rod and mixed rod-cone responses are preserved. This dissociation — absent L/M
    signal with retained rod and S-cone signal — is the diagnostic hallmark.
    Reduction is not invariably complete: three of ten families in one series showed
    uncharacteristic relative preservation of the photopic b-wave, which is recorded
    here rather than rounded off.
  phenotype_term:
    preferred_term: Abnormal electroretinogram
    term:
      id: HP:0000512
      label: Abnormal electroretinogram
  evidence:
  - reference: PMID:10982039
    reference_title: >-
      Spectrum of color gene deletions and phenotype in patients with blue cone
      monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acuities were reduced in all affected males, and photopic b-wave was reduced
      by more than 90% in seven families.
    explanation: >-
      Quantifies the photopic ERG reduction.
  - reference: PMID:10982039
    reference_title: >-
      Spectrum of color gene deletions and phenotype in patients with blue cone
      monochromacy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In three families, however, the photopic b-wave response showed
      uncharacteristic relative preservation of 30-80% (of the clinical low-normal
      value).
    explanation: >-
      The exception that keeps this phenotype from being curated as invariably
      absent.
- category: Ophthalmologic
  name: Progressive Macular Atrophy
  frequency: OCCASIONAL
  description: >-
    Macular atrophy develops in a subset and is the main late complication beyond
    the congenital deficit. It was seen in two of ten families in an early series
    while the remainder had a normal fundus, so it is genuinely a subset finding
    rather than an inevitable end state.
  phenotype_term:
    preferred_term: Macular degeneration
    term:
      id: HP:0000608
      label: Macular degeneration
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:10982039
    reference_title: >-
      Spectrum of color gene deletions and phenotype in patients with blue cone
      monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progressive macular atrophy was observed in affected members of two BCM
      families while the rest of the families presented with normal fundus.
    explanation: >-
      Gives both the finding and the denominator that justifies the OCCASIONAL band.
- category: Ophthalmologic
  name: Progressive Loss of Cone Function
  frequency: OCCASIONAL
  description: >-
    Although classically taught as stationary, psychophysical and clinical
    progression has been demonstrated in individual families, including one with a
    hybrid gene lacking exon 2. Recorded as a distinct phenotype because it changes
    counselling and, more consequentially, defines the therapeutic window for
    gene-replacement trials.
  phenotype_term:
    preferred_term: Reduced visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:15094734
    reference_title: >-
      Blue cone monochromatism: a phenotype and genotype assessment with evidence of
      progressive loss of cone function in older individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In two families, psychophysical testing demonstrated evidence for progression
      of disease.
    explanation: >-
      Demonstrates progression psychophysically in a subset of families.
  - reference: PMID:19421413
    reference_title: >-
      Blue cone monochromacy: causative mutations and associated phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel mutation was detected in Family 2 that had a single hybrid gene
      lacking exon 2. This family presented clinical and psychophysical evidence of a
      slowly progressive phenotype.
    explanation: >-
      Ties a progressive phenotype to a specific genotype, supporting genotype
      dependence.
genetic:
- name: OPN1LW/OPN1MW opsin gene array
  association: Genetic Mutation
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: OPN1LW
    term:
      id: hgnc:9936
      label: OPN1LW
  inheritance:
  - name: X-linked recessive
  notes: >-
    Disease requires loss of function of both the L and M opsin genes. Loss of just
    one produces ordinary red-green colour vision deficiency. The locus is
    intrinsically recombinogenic — two near-identical genes in tandem — which is why
    unequal crossing-over and gene conversion recur as mutational mechanisms rather
    than being incidental.
  evidence:
  - reference: PMID:26153062
    reference_title: >-
      High-resolution microarray analysis unravels complex Xq28 aberrations in
      patients and carriers affected by X-linked blue cone monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Blue cone monochromacy (BCM) is an X-linked condition caused by a
      loss-of-function of both the OPN1LW and OPN1MW opsin genes.
    explanation: >-
      States the two-gene loss-of-function requirement.
  - reference: PMID:26153062
    reference_title: >-
      High-resolution microarray analysis unravels complex Xq28 aberrations in
      patients and carriers affected by X-linked blue cone monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cone opsin gene cluster is composed of 2-9 paralogs with 99.8% sequence
      homology and is susceptible to deletions, duplications, and mutations.
    explanation: >-
      Explains the locus architecture that makes recurrent rearrangement the
      dominant mutational mechanism.
- name: OPN1MW
  association: Genetic Mutation
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: OPN1MW
    term:
      id: hgnc:4206
      label: OPN1MW
  inheritance:
  - name: X-linked recessive
  notes: >-
    The M-opsin gene of the tandem array. Curated separately from OPN1LW because
    genotypes differ in which array member survives: some patients retain a single L
    gene, some a 5'L-M-3' hybrid, and at least one reported family lost the complete
    green gene with no coding or LCR change detectable in the red gene.
  evidence:
  - reference: PMID:10982039
    reference_title: >-
      Spectrum of color gene deletions and phenotype in patients with blue cone
      monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In one family no mutation was found in the exons of the red gene or the locus
      control region but showed loss of the complete green gene.
    explanation: >-
      Documents the genotype in which the M gene is the demonstrable lesion.
- name: Locus control region deletion
  association: Genetic Mutation
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: OPN1LW
    term:
      id: hgnc:9936
      label: OPN1LW
  inheritance:
  - name: X-linked recessive
  notes: >-
    Deletion of the upstream enhancer is a variant class in its own right, and the
    dominant one: 90% of structural variants found in molecularly confirmed families
    remove it. Curated separately from coding-sequence lesions because the
    consequence is regulatory silencing of an intact gene array rather than loss of a
    functional protein product, which is why it has its own pathophysiology node.
    Deletion mapping in patients has narrowed the minimal functional extent of the
    element to 358 bp.
  evidence:
  - reference: PMID:35759666
    reference_title: >-
      The landscape of submicroscopic structural variants at the OPN1LW/OPN1MW gene
      cluster on Xq28 underlying blue cone monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, 90% of SVs encompass the upstream locus control region, an essential
      enhancer element. Its minimal functional extent based on deletion mapping in
      patients was refined to 358 bp.
    explanation: >-
      Quantifies how often the enhancer is involved and gives the patient-derived
      minimal functional extent.
- name: Structural variant landscape of the OPN1LW/OPN1MW cluster
  association: Genetic Mutation
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: OPN1MW
    term:
      id: hgnc:4206
      label: OPN1MW
  notes: >-
    About a third of molecularly confirmed families carry a structural variant, and
    the striking negative finding is that there is no region of overlap among them —
    which is why this disorder cannot be reduced to a single recurrent deletion and
    why testing has to resolve breakpoints rather than assay one interval. Large
    pre-existing gene arrays appear predisposed to generating these variants, which
    fits the recombinogenic architecture described elsewhere in this entry.
  evidence:
  - reference: PMID:35759666
    reference_title: >-
      The landscape of submicroscopic structural variants at the OPN1LW/OPN1MW gene
      cluster on Xq28 underlying blue cone monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that about one-third (n = 73) of the 213 molecularly confirmed BCM
      families carry an SV, most commonly deletions restricted to the OPN1LW/OPN1MW
      gene cluster.
    explanation: >-
      Quantifies the share of families with a structural variant.
  - reference: PMID:35759666
    reference_title: >-
      The landscape of submicroscopic structural variants at the OPN1LW/OPN1MW gene
      cluster on Xq28 underlying blue cone monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, 42 distinct SVs were identified, including 40 previously unreported
      SVs, thereby quadrupling the number of precisely mapped SVs underlying BCM.
      Notably, there was no "region of overlap" among these SVs.
    explanation: >-
      Establishes both the diversity of variants and the absence of a common
      minimal region.
  - reference: PMID:35759666
    reference_title: >-
      The landscape of submicroscopic structural variants at the OPN1LW/OPN1MW gene
      cluster on Xq28 underlying blue cone monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using parsimonious assumptions, we reconstructed the composition and copy
      number of the OPN1LW/OPN1MW gene cluster prior to the mutation event and found
      evidence that large gene arrays may be predisposed to the occurrence of SVs at
      this locus.
    explanation: >-
      Links array size to structural-variant susceptibility, supporting the
      architectural argument.
- name: GPR143
  association: Disease-associated
  relationship_type: MODIFIER
  gene_term:
    preferred_term: GPR143
    term:
      id: hgnc:20145
      label: GPR143
  notes: >-
    Recorded from a single patient in whom a GPR143 splicing variant co-occurred with
    OPN1LW/OPN1MW lesions and produced foveal hypoplasia — a feature otherwise
    characteristic of achromatopsia rather than this disorder. Curated as a modifier
    on one report, not as an established modifier gene.
  evidence:
  - reference: PMID:34445325
    reference_title: >-
      Blue Cone Monochromatism with Foveal Hypoplasia Caused by the Concomitant
      Effect of Variants in OPN1LW/OPN1MW and GPR143 Genes.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To our knowledge, this is the first case of foveal hypoplasia in a BCM patient
      and of mild clinical affection in a female carrier caused by the concomitant
      effect of variants in OPN1LW/OPN1MW and GPR143 genes, thus as the result of the
      simultaneous action of two independent genetic defects.
    explanation: >-
      Single-case evidence for a second-locus modifier effect; PARTIAL because it
      rests on one family.
- name: Cys203Arg recurrent inactivating substitution
  association: Genetic Mutation
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: OPN1LW
    term:
      id: hgnc:9936
      label: OPN1LW
  notes: >-
    The single most common inactivating point substitution. Its epidemiology is
    unusual and mechanistically informative: it is present at low frequency in
    control chromosomes, which means the population carries a standing reservoir of
    Cys203Arg alleles that unequal recombination or gene conversion can convert into
    a disease genotype in one further step. That is a recurrence mechanism, not a
    founder effect.
  evidence:
  - reference: PMID:8213841
    reference_title: Genetic heterogeneity among blue-cone monochromats.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation was also found in at least one of the visual pigment genes in 1
      subject whose array has multiple genes and in 2 of 321 control subjects,
      suggesting that preexisting Cys203-to-Arg mutations constitute a reservoir of
      chromosomes that are predisposed to generate blue-cone-monochromat genotypes
      by unequal homologous recombination and/or gene conversion.
    explanation: >-
      States the reservoir hypothesis that explains recurrence of this allele.
diagnosis:
- name: Full-Field Electroretinography
  description: >-
    The key functional test. Rod-specific and mixed rod-cone responses are normal or
    near-normal while the L/M-cone-driven photopic response is severely reduced or
    absent, and S-cone-isolating stimuli still elicit a response. It is that
    dissociation, not the absolute amplitudes, that makes the diagnosis.
  evidence:
  - reference: PMID:10982039
    reference_title: >-
      Spectrum of color gene deletions and phenotype in patients with blue cone
      monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acuities were reduced in all affected males, and photopic b-wave was reduced
      by more than 90% in seven families.
    explanation: >-
      Quantifies the photopic reduction that anchors the ERG diagnosis.
  - reference: PMID:38871951
    reference_title: >-
      S-cone contribution to oscillatory potentials in patients with blue cone
      monochromacy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The aim of this exploratory study is to investigate the role of S-cones in
      oscillatory potentials (OPs) generation by individuals with blue-cone
      monochromacy (BCM), retaining S-cones, and achromatopsia (ACHM), lacking cone
      functions.
    explanation: >-
      Frames the retained-S-cone versus absent-cone-function contrast that the ERG
      exploits; PARTIAL because the study itself examines an ancillary
      oscillatory-potential signature rather than validating the diagnostic test.
- name: Colour Vision Testing
  description: >-
    Farnsworth D-15 gives protan-like arrangements. The Mollon-Reffin Minimal test
    is particularly useful because it resolves the retained tritan axis, and HRR
    plates detect the same residual discrimination.
  evidence:
  - reference: PMID:15094734
    reference_title: >-
      Blue cone monochromatism: a phenotype and genotype assessment with evidence of
      progressive loss of cone function in older individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, we have demonstrated that the Mollon-Reffin (MR) Minimal test is
      a useful colour-discrimination test to aid in the diagnosis of BCM.
    explanation: >-
      Identifies the colour test with the best discriminating value here.
  - reference: PMID:15094734
    reference_title: >-
      Blue cone monochromatism: a phenotype and genotype assessment with evidence of
      progressive loss of cone function in older individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have confirmed the reported finding of protan-like D-15 arrangements of
      patients with BCM.
    explanation: >-
      Documents the D-15 pattern.
  - reference: PMID:36692456
    reference_title: >-
      Color Vision in Blue Cone Monochromacy: Outcome Measures for a Clinical Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With D-15, there was protan-deutan confusion and no bimodal tendency.
    explanation: >-
      Characterizes the D-15 result pattern specific to this disorder.
  - reference: PMID:36692456
    reference_title: >-
      Color Vision in Blue Cone Monochromacy: Outcome Measures for a Clinical Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given understanding of advantages, disadvantages, and complexities of
      interpretation of results, both an arrangement test and CAD should be useful
      monitors of color vision through a clinical trial in BCM.
    explanation: >-
      Supports the choice of colour tests, and their role as trial endpoints.
- name: Molecular Testing of the Xq28 Opsin Array
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Standard short-read exome pipelines are unreliable at this locus because the
    paralogs are about 99.8% identical, so a negative exome does not exclude the
    diagnosis. Targeted approaches — long-range PCR, Southern blot, and
    high-resolution X-chromosome microarray — are required, and microarray in
    particular resolves alterations that PCR-based testing leaves undetermined in
    around 10% of patients and extends testing to female carriers.
  evidence:
  - reference: PMID:26153062
    reference_title: >-
      High-resolution microarray analysis unravels complex Xq28 aberrations in
      patients and carriers affected by X-linked blue cone monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Current diagnostic tests employ polymerase chain reaction (PCR)-based
      technologies; however, alterations remain undetermined in 10% of patients.
      Furthermore, carrier testing in females is limited or unavailable.
    explanation: >-
      States the diagnostic gap that motivates microarray-based testing.
  - reference: PMID:26153062
    reference_title: >-
      High-resolution microarray analysis unravels complex Xq28 aberrations in
      patients and carriers affected by X-linked blue cone monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic alterations were revealed in all probands, characterized by
      sequencing of the breakpoint junctions and quantitative real-time PCR.
    explanation: >-
      Demonstrates the diagnostic yield of the microarray approach.
differential_diagnoses:
- name: Achromatopsia
  description: >-
    Autosomal recessive complete cone dysfunction (CNGA3, CNGB3, GNAT2, PDE6C,
    PDE6H, ATF6) affecting all three cone classes rather than only L and M. It is
    the principal differential, and the electroretinogram is what settles it.
  disease_term:
    preferred_term: achromatopsia
    term:
      id: MONDO:0018852
      label: achromatopsia
  distinguishing_features:
  - All cone signal extinguished on ERG, including S-cone-isolating stimuli
  - No retained tritan axis on colour testing
  - Typically worse visual acuity
  - Hyperopia more typical than myopia
  - Autosomal recessive rather than X-linked inheritance
  evidence:
  - reference: PMID:38871951
    reference_title: >-
      S-cone contribution to oscillatory potentials in patients with blue cone
      monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The aim of this exploratory study is to investigate the role of S-cones in
      oscillatory potentials (OPs) generation by individuals with blue-cone
      monochromacy (BCM), retaining S-cones, and achromatopsia (ACHM), lacking cone
      functions.
    explanation: >-
      States the retained-S-cone versus absent-cone-function contrast that separates
      the two disorders.
  - reference: PMID:36186895
    reference_title: >-
      Comparing Retinal Structure in Patients with Achromatopsia and Blue Cone
      Monochromacy Using OCT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Foveal hypoplasia was significantly more prevalent in ACHM than in BCM
      (p<0.001).
    explanation: >-
      Quantifies the foveal-hypoplasia difference that helps separate the two on OCT.
- name: X-linked cone dystrophy
  description: >-
    Missense variants in the same L/M opsin genes can produce X-linked cone
    dystrophy or high myopia with abnormal cone function rather than this disorder,
    so the same locus spans a phenotypic range and genotype alone does not settle
    the diagnosis.
  distinguishing_features:
  - Progressive cone degeneration rather than a predominantly congenital deficit
  - A different pattern of L/M opsin missense alleles at the same locus
  evidence:
  - reference: PMID:37001420
    reference_title: Blue cone monochromacy and gene therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-linked retinal diseases resulting from mutations in the L- (OPN1LW, OMIM
      *300822) and M- (OPN1MW, OMIM *300821) opsin gene cluster are associated with
      a wide range of visual defects, including red/green color vision deficiency,
      X-linked cone dystrophy/dysfunction, high myopia with abnormal cone function,
      and blue cone monochromacy (BCM)
    explanation: >-
      Establishes that the same locus produces a spectrum of distinct diagnoses.
treatments:
- name: Tinted Lenses and Low Vision Aids
  description: >-
    The whole of current management. Tinted lenses reduce photophobia and improve
    contrast; low-vision aids address the acuity deficit. Nothing available today
    modifies the underlying disease.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Photophobia
    term:
      id: HP:0000613
      label: Photophobia
  evidence:
  - reference: PMID:39408969
    reference_title: >-
      Evaluation of Retinal Structure and Visual Function in Blue Cone Monochromacy
      to Develop Clinical Endpoints for L-opsin Gene Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are currently no treatments for BCM, and management of the disease is
      limited to the use of tinted lenses and low vision aids.
    explanation: >-
      States both the absence of disease-modifying therapy and the content of
      current management.
- name: AAV-Mediated L-Opsin Gene Augmentation (investigational)
  description: >-
    The therapeutic strategy in development: deliver a functional L-opsin gene to
    residual L/M cones by adeno-associated virus. It is investigational, not
    approved, and is recorded here as a research programme rather than a treatment
    option. Its central design problem follows directly from the pathophysiology
    above — the residual cones are largely non-waveguiding and decline with age, so
    the therapeutic window is bounded and strongly age-dependent. Genotype governs
    the rate of progression rather than the width of the window: the two mouse models
    compared so far showed similar windows despite different genotypes. Much of the recent
    clinical literature is accordingly about building outcome measures sensitive
    enough to detect an L-cone-specific gain. Route of delivery is itself a design
    constraint here: subretinal injection risks the very foveal structure that is
    the therapeutic target, which is why an intravitreal vector was developed.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Absent or Non-Functional L and M Cone Photopigment
    treatment_effect: RESTORES
    description: >-
      Gene augmentation aims to restore L-opsin expression in surviving cones; it
      cannot recover cones already lost, which is why the timing question is
      central.
    evidence:
    - reference: PMID:39408969
      reference_title: >-
        Evaluation of Retinal Structure and Visual Function in Blue Cone
        Monochromacy to Develop Clinical Endpoints for L-opsin Gene Therapy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        L-cone opsin expression by gene therapy is a promising treatment for blue
        cone monochromacy (BCM) caused by congenital lack of long- and
        middle-wavelength-sensitive (L/M) cone function.
      explanation: >-
        States the therapeutic rationale and its molecular target.
  evidence:
  - reference: PMID:36932675
    reference_title: >-
      Preclinical evaluation of ADVM-062, a novel intravitreal gene therapy vector
      for the treatment of blue cone monochromacy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A single IVT administration dose of ADVM-062 effectively transduced gerbil
      cone photoreceptors and produced a de novo response to long-wavelength
      stimuli.
    explanation: >-
      Preclinical proof that an intravitreally delivered L-opsin vector produces a
      new long-wavelength response, in an animal whose cone-rich retina naturally
      lacks L-opsin.
  - reference: PMID:36932675
    reference_title: >-
      Preclinical evaluation of ADVM-062, a novel intravitreal gene therapy vector
      for the treatment of blue cone monochromacy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, most experimental ocular gene therapies utilize subretinal vector
      injection which would pose a risk to the fragile central retinal structure of
      BCM patients.
    explanation: >-
      Supports the delivery-route constraint stated in the description.
  - reference: PMID:39408969
    reference_title: >-
      Evaluation of Retinal Structure and Visual Function in Blue Cone Monochromacy
      to Develop Clinical Endpoints for L-opsin Gene Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study developed and evaluated specialized outcomes that will be needed
      for the determination of efficacy and safety in human clinical trials.
    explanation: >-
      Confirms that human trials are prospective rather than completed, which is why
      this is curated as investigational.
  - reference: PMID:40297680
    reference_title: >-
      Molecular Mechanisms Limiting the Therapeutic Window of AAV Gene Therapy in
      Mouse Models of Blue Cone Monochromacy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      While both DKO and C198R models showed similar therapeutic windows and rescue
      longevity, treatment efficacy decreased markedly in older mutant mice.
    explanation: >-
      The evidence behind the bounded-therapeutic-window claim in the description.
      Note it also qualifies it: in these two models the window was similar across
      genotypes, so the age dependence is better supported than the genotype
      dependence.
  - reference: PMID:33344057
    reference_title: >-
      Reading Performance in Blue Cone Monochromacy: Defining an Outcome Measure for
      a Clinical Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MNREAD measures of reading performance in patients with BCM would be a worthy
      and robust secondary outcome in a clinical trial protocol, given its dual
      purpose of quantifying macular vision and addressing an important quality of
      life issue.
    explanation: >-
      Part of the outcome-measure groundwork that has to exist before a trial can
      run, which is why this treatment is curated as investigational.
animal_models:
- name: Opn1mw C198R knock-in mouse
  species: Mouse
  genotype: Opn1mw C198R knock-in (murine equivalent of human OPN1MW Cys203Arg)
  publication: PMID:41941983
  description: >-
    The mouse counterpart of the commonest human missense allele. Because murine
    M-opsin is five residues shorter at the amino terminus, the equivalent
    substitution is numbered C198R.
  modeled_mechanisms:
  - target: Absent or Non-Functional L and M Cone Photopigment
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Diminished M-opsin expression with mislocalization, and loss of cone outer
      segments in M-cone photoreceptors — the structural consequence this node
      asserts.
    limitations: >-
      Mouse has no L-opsin at all, so the model reproduces only the M-cone half of
      the human two-opsin lesion; and in vitro the mutant aggregates while in vivo it
      does not, so cell-culture results from this allele overstate the in vivo
      severity.
    evidence:
    - reference: PMID:41941983
      reference_title: Molecular and cellular impact of a C203R/C198R M-opsin mutation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The mutation diminished the expression of M-opsin with some apparent
        mislocalization of the cone opsin without aggregation, which resulted in the
        loss of cone outer segments in M-cone photoreceptor cells.
      explanation: >-
        The in vivo structural result linking the allele to outer-segment loss.
  - target: Cone Outer Segment Disruption and Progressive Foveal Cone Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces outer-segment loss but not cone death: mutant cones remained viable
      to six months in both hemizygous and homozygous animals, and the authors
      contrast this explicitly with the toxic-aggregate mechanism of rhodopsin
      mutants in retinitis pigmentosa.
    limitations: >-
      Six months of mouse life cannot address decades of human disease, so a viable
      cone at six months does not establish that the human Cys203Arg cone survives —
      it establishes that a toxic-aggregate death mechanism is not operating early.
      This is why the entry treats slow Cys203Arg progression as observed rather than
      mechanistically explained.
    evidence:
    - reference: PMID:41941983
      reference_title: Molecular and cellular impact of a C203R/C198R M-opsin mutation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Despite the loss of cone outer segments, cone photoreceptor cells remained
        viable, even up to 6 months of age in hemizygous and homozygous mutant mice.
      explanation: >-
        The dissociation between outer-segment loss and cone survival.
    - reference: PMID:41941983
      reference_title: Molecular and cellular impact of a C203R/C198R M-opsin mutation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Thus, in contrast to rhodopsin mutants, the M-opsin mutant does not appear to
        form toxic aggregates that cause cone photoreceptor cell death.
      explanation: >-
        States the negative mechanistic conclusion that distinguishes this from the
        rhodopsin misfolding diseases.
- name: Opn1mw knockout mouse
  species: Mouse
  genotype: Opn1mw -/- (M-opsin knockout, expressing only S-opsin)
  publication: PMID:28751656
  description: >-
    An opsin-null model built explicitly as the mouse stand-in for the human
    deletion genotype, and the vehicle for the first cone-rescue proof of concept.
  modeled_mechanisms:
  - target: Absent or Non-Functional L and M Cone Photopigment
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Cones lacking M-opsin, the null counterpart of the human deletion class.
    limitations: >-
      Again only one opsin is lost rather than two, and the mouse retina has no
      fovea, so nothing about foveal cone topography — the structure that actually
      determines outcome in patients — can be modelled here.
    evidence:
    - reference: PMID:28751656
      reference_title: >-
        Gene-based Therapy in a Mouse Model of Blue Cone Monochromacy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We generated an M-opsin knockout mouse (Opn1mw -/-) expressing only S-opsin
        as a model for human BCM.
      explanation: >-
        States the model's design intent.
  - target: Absent or Non-Functional L and M Cone Photopigment
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      AAV5-delivered recombinant M-opsin restored M-cone function, establishing that
      an opsin-null cone remains competent to be rescued — the premise the entire
      gene-therapy strategy rests on.
    limitations: >-
      Rescue in a young mouse retina says nothing about the aged, largely
      non-waveguiding human foveal cone population that would actually be treated.
    evidence:
    - reference: PMID:28751656
      reference_title: >-
        Gene-based Therapy in a Mouse Model of Blue Cone Monochromacy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our study demonstrates that cones without M-opsin remain viable and respond
        to gene augmentation therapy, thereby providing proof-of-concept for cone
        function restoration in BCM patients.
      explanation: >-
        The proof-of-concept result underpinning the investigational treatment.
discussions:
- discussion_id: bcm_stationary_versus_progressive
  kind: CONTROVERSY
  prompt: >-
    Is blue cone monochromacy a stationary cone dysfunction syndrome or a slowly
    progressive dystrophy, and how much of the disagreement is explained by genotype
    rather than by measurement sensitivity?
  attaches_to:
  - pathophysiology#Cone Outer Segment Disruption and Progressive Foveal Cone Loss
  - phenotypes#Progressive Loss of Cone Function
  rationale: >-
    The disorder is classified among the stationary cone dysfunction syndromes, and
    many families do appear stable. But progression has been demonstrated
    psychophysically in individual families, macular atrophy develops in a subset,
    OCT shows an age-related effect on foveal disease stage, and the rate differs
    between large-deletion and Cys203Arg genotypes. Curating this as simply
    "stationary" would be wrong, and curating it as simply "progressive" would
    overstate what is shown for most patients. The unresolved part is whether the
    apparently stable majority are genuinely stable or merely followed for too short
    a time with insufficiently sensitive measures — which matters directly, because
    a bounded therapeutic window is the main design constraint on the gene therapy
    programmes.
  proposed_experiments:
  - experiment_id: bcm_longitudinal_genotype_stratified_aoslo
    name: Longitudinal genotype-stratified AOSLO and microperimetry cohort
    description: >-
      Follow LCR-deletion and Cys203Arg cohorts prospectively with adaptive-optics
      cone density, OCT outer nuclear layer thickness, and dark-adapted red
      microperimetry, to establish whether the stable-appearing majority show
      measurable decline on sensitive endpoints and to quantify the window per
      genotype.
  evidence:
  - reference: PMID:15094734
    reference_title: >-
      Blue cone monochromatism: a phenotype and genotype assessment with evidence of
      progressive loss of cone function in older individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In two families, psychophysical testing demonstrated evidence for progression
      of disease.
    explanation: >-
      Evidence for the progressive side of the question.
  - reference: PMID:10982039
    reference_title: >-
      Spectrum of color gene deletions and phenotype in patients with blue cone
      monochromacy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progressive macular atrophy was observed in affected members of two BCM
      families while the rest of the families presented with normal fundus.
    explanation: >-
      Shows that progression is a subset finding, which is the other side of the
      controversy.
  - reference: PMID:41941983
    reference_title: Molecular and cellular impact of a C203R/C198R M-opsin mutation.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Despite the loss of cone outer segments, cone photoreceptor cells remained
      viable, even up to 6 months of age in hemizygous and homozygous mutant mice.
    explanation: >-
      Model-organism evidence bearing on the stationary side: in the allele
      equivalent to Cys203Arg, the cone loses its outer segment without dying, which
      is a mechanism for structural change without progressive cell loss. PARTIAL
      because six mouse months cannot speak to decades of human disease.
- discussion_id: bcm_genotype_phenotype_correlation
  kind: OPEN_QUESTION
  prompt: >-
    Does genotype at the opsin array predict the clinical phenotype, given that one
    series found no genotype-phenotype association while later structural work found
    deletion genotypes progress faster than Cys203Arg?
  attaches_to:
  - pathophysiology#Loss of Function of the OPN1LW/OPN1MW Opsin Gene Array
  rationale: >-
    These findings are not straightforwardly contradictory — the earlier study
    assessed cross-sectional clinical and electrophysiological phenotype, the later
    work assessed rate of structural change — but they are routinely quoted against
    each other. Resolving which phenotypic dimensions genotype predicts (baseline
    severity versus rate of decline) is what a counselling statement or a trial
    stratification would actually need.
  evidence:
  - reference: PMID:10982039
    reference_title: >-
      Spectrum of color gene deletions and phenotype in patients with blue cone
      monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No association was observed between the phenotypes and genotypes in these
      families.
    explanation: >-
      The negative cross-sectional finding.
  - reference: PMID:39408969
    reference_title: >-
      Evaluation of Retinal Structure and Visual Function in Blue Cone Monochromacy
      to Develop Clinical Endpoints for L-opsin Gene Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, foveal structural changes tend to progress faster in patients with
      large deletions as compared with the point mutation
    explanation: >-
      The positive longitudinal-structural finding on the other side.
  - reference: PMID:35400991
    reference_title: >-
      Relatively mild blue cone monochromacy phenotype caused by various haplotypes
      in the L- and M-cone opsin genes.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Blue cone monochromacy (BCM) is an X-linked retinopathy caused by mutations in
      the red and green cone opsin genes. The aim of this study was to establish the
      clinical, genetic, and electrophysiological characteristics of a specific form
      of BCM.
    explanation: >-
      Cited as a study framed around a haplotype-defined milder form, which is
      evidence that genotype tracks severity in at least some direction; PARTIAL
      because only the framing, not a quantified correlation, is quotable from the
      cached abstract.
notes: >-
  Relationship to Achromatopsia. This entry deliberately overlaps with, but is
  distinct from, the existing Achromatopsia entry. Achromatopsia is autosomal
  recessive and abolishes all three cone classes; this disorder is X-linked and
  spares S cones. The Achromatopsia entry already lists blue-cone monochromatism as
  a differential; this entry is the reciprocal, curated on its own genetics and
  mechanism rather than as a variant of achromatopsia. The MONDO definition
  describes it as an incomplete form of achromatopsia, which is a reasonable
  classification statement but should not be read as implying shared
  pathophysiology — the causal genes and the cone populations involved differ.

  Ontology limits worth recording. UBERON has no term for the S-cone-sparse central
  zone of the fovea, and CL distinguishes L, M and S cone cells but not the
  hybrid-opsin-expressing cones that many patients actually carry. Neither gap was
  worked around by picking a broader term and describing something narrower in
  prose.

  One reference could not be cited. `DOI:10.1186/s12881-018-0623-8` reports a
  73,128 bp de novo deletion in sporadic disease and would have been the natural
  citation for de novo occurrence, but the cached record carries
  `content_type: unavailable` — metadata only, no abstract text — so there is no
  quotable snippet. The claim is therefore omitted rather than cited to a record
  that cannot support it, and the cache file has been dropped rather than left
  stranded in the commit.

  Two ontology suggestions in the deep-research report were wrong and were not
  used: UBERON:0001782 was suggested for fovea centralis but is the pigmented layer
  of the retina (the correct term is UBERON:0001786), and HP:0000640 was suggested
  for nystagmus (the correct term is HP:0000639). Both were caught by checking
  against the term caches, not by the report's own reference validation, which
  checks citations only.

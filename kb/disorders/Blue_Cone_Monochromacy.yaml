    gene-replacement trials.
  phenotype_term:
    preferred_term: Reduced visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:15094734
    reference_title: >-
      Blue cone monochromatism: a phenotype and genotype assessment with evidence of
      progressive loss of cone function in older individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In two families, psychophysical testing demonstrated evidence for progression
      of disease.
    explanation: >-
      Demonstrates progression psychophysically in a subset of families.
  - reference: PMID:19421413
    reference_title: >-
      Blue cone monochromacy: causative mutations and associated phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel mutation was detected in Family 2 that had a single hybrid gene
      lacking exon 2. This family presented clinical and psychophysical evidence of a
      slowly progressive phenotype.
    explanation: >-
      Ties a progressive phenotype to a specific genotype, supporting genotype
      dependence.
genetic:
- name: OPN1LW/OPN1MW opsin gene array
  association: Genetic Mutation
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: OPN1LW
    term:
      id: hgnc:9936
      label: OPN1LW
  inheritance:
  - name: X-linked recessive
  notes: >-
    Disease requires loss of function of both the L and M opsin genes. Loss of just
    one produces ordinary red-green colour vision deficiency. The locus is
    intrinsically recombinogenic — two near-identical genes in tandem — which is why
    unequal crossing-over and gene conversion recur as mutational mechanisms rather
    than being incidental.
  evidence:
  - reference: PMID:26153062
    reference_title: >-
      High-resolution microarray analysis unravels complex Xq28 aberrations in
      patients and carriers affected by X-linked blue cone monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Blue cone monochromacy (BCM) is an X-linked condition caused by a
      loss-of-function of both the OPN1LW and OPN1MW opsin genes.
    explanation: >-
      States the two-gene loss-of-function requirement.
  - reference: PMID:26153062
    reference_title: >-
      High-resolution microarray analysis unravels complex Xq28 aberrations in
      patients and carriers affected by X-linked blue cone monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cone opsin gene cluster is composed of 2-9 paralogs with 99.8% sequence
      homology and is susceptible to deletions, duplications, and mutations.
    explanation: >-
      Explains the locus architecture that makes recurrent rearrangement the
      dominant mutational mechanism.
- name: OPN1MW
  association: Genetic Mutation
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: OPN1MW
    term:
      id: hgnc:4206
      label: OPN1MW
  inheritance:
  - name: X-linked recessive
  notes: >-
    The M-opsin gene of the tandem array. Curated separately from OPN1LW because
    genotypes differ in which array member survives: some patients retain a single L
    gene, some a 5'L-M-3' hybrid, and at least one reported family lost the complete
    green gene with no coding or LCR change detectable in the red gene.
  evidence:
  - reference: PMID:10982039
    reference_title: >-
      Spectrum of color gene deletions and phenotype in patients with blue cone
      monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In one family no mutation was found in the exons of the red gene or the locus
      control region but showed loss of the complete green gene.
    explanation: >-
      Documents the genotype in which the M gene is the demonstrable lesion.
- name: Cys203Arg recurrent inactivating substitution
  association: Genetic Mutation
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: OPN1LW
    term:
      id: hgnc:9936
      label: OPN1LW
  notes: >-
    The single most common inactivating point substitution. Its epidemiology is
    unusual and mechanistically informative: it is present at low frequency in
    control chromosomes, which means the population carries a standing reservoir of
    Cys203Arg alleles that unequal recombination or gene conversion can convert into
    a disease genotype in one further step. That is a recurrence mechanism, not a
    founder effect.
  evidence:
  - reference: PMID:8213841
    reference_title: Genetic heterogeneity among blue-cone monochromats.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation was also found in at least one of the visual pigment genes in 1
      subject whose array has multiple genes and in 2 of 321 control subjects,
      suggesting that preexisting Cys203-to-Arg mutations constitute a reservoir of
      chromosomes that are predisposed to generate blue-cone-monochromat genotypes
      by unequal homologous recombination and/or gene conversion.
    explanation: >-
      States the reservoir hypothesis that explains recurrence of this allele.
diagnosis:
- name: Full-Field Electroretinography
  description: >-
    The key functional test. Rod-specific and mixed rod-cone responses are normal or
    near-normal while the L/M-cone-driven photopic response is severely reduced or
    absent, and S-cone-isolating stimuli still elicit a response. It is that
    dissociation, not the absolute amplitudes, that makes the diagnosis.
  evidence:
  - reference: PMID:10982039
    reference_title: >-
      Spectrum of color gene deletions and phenotype in patients with blue cone
      monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acuities were reduced in all affected males, and photopic b-wave was reduced
      by more than 90% in seven families.
    explanation: >-
      Quantifies the photopic reduction that anchors the ERG diagnosis.
  - reference: PMID:38871951
    reference_title: >-
      S-cone contribution to oscillatory potentials in patients with blue cone
      monochromacy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The aim of this exploratory study is to investigate the role of S-cones in
      oscillatory potentials (OPs) generation by individuals with blue-cone
      monochromacy (BCM), retaining S-cones, and achromatopsia (ACHM), lacking cone
      functions.
    explanation: >-
      Frames the retained-S-cone versus absent-cone-function contrast that the ERG
      exploits; PARTIAL because the study itself examines an ancillary
      oscillatory-potential signature rather than validating the diagnostic test.
- name: Colour Vision Testing
  description: >-
    Farnsworth D-15 gives protan-like arrangements. The Mollon-Reffin Minimal test
    is particularly useful because it resolves the retained tritan axis, and HRR
    plates detect the same residual discrimination.
  evidence:
  - reference: PMID:15094734
    reference_title: >-
      Blue cone monochromatism: a phenotype and genotype assessment with evidence of
      progressive loss of cone function in older individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, we have demonstrated that the Mollon-Reffin (MR) Minimal test is
      a useful colour-discrimination test to aid in the diagnosis of BCM.
    explanation: >-
      Identifies the colour test with the best discriminating value here.
  - reference: PMID:15094734
    reference_title: >-
      Blue cone monochromatism: a phenotype and genotype assessment with evidence of
      progressive loss of cone function in older individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have confirmed the reported finding of protan-like D-15 arrangements of
      patients with BCM.
    explanation: >-
      Documents the D-15 pattern.
- name: Molecular Testing of the Xq28 Opsin Array
  description: >-
    Standard short-read exome pipelines are unreliable at this locus because the
    paralogs are about 99.8% identical, so a negative exome does not exclude the
    diagnosis. Targeted approaches — long-range PCR, Southern blot, and
    high-resolution X-chromosome microarray — are required, and microarray in
    particular resolves alterations that PCR-based testing leaves undetermined in
    around 10% of patients and extends testing to female carriers.
  evidence:
  - reference: PMID:26153062
    reference_title: >-
      High-resolution microarray analysis unravels complex Xq28 aberrations in
      patients and carriers affected by X-linked blue cone monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Current diagnostic tests employ polymerase chain reaction (PCR)-based
      technologies; however, alterations remain undetermined in 10% of patients.
      Furthermore, carrier testing in females is limited or unavailable.
    explanation: >-
      States the diagnostic gap that motivates microarray-based testing.
  - reference: PMID:26153062
    reference_title: >-
      High-resolution microarray analysis unravels complex Xq28 aberrations in
      patients and carriers affected by X-linked blue cone monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic alterations were revealed in all probands, characterized by
      sequencing of the breakpoint junctions and quantitative real-time PCR.
    explanation: >-
      Demonstrates the diagnostic yield of the microarray approach.
differential_diagnoses:
- name: Achromatopsia
  description: >-
    Autosomal recessive complete cone dysfunction (CNGA3, CNGB3, GNAT2, PDE6C,
    PDE6H, ATF6) affecting all three cone classes rather than only L and M. It is
    the principal differential, and the electroretinogram is what settles it.
  disease_term:
    preferred_term: achromatopsia
    term:
      id: MONDO:0018852
      label: achromatopsia
  distinguishing_features:
  - All cone signal extinguished on ERG, including S-cone-isolating stimuli
  - No retained tritan axis on colour testing
  - Typically worse visual acuity
  - Hyperopia more typical than myopia
  - Autosomal recessive rather than X-linked inheritance
  evidence:
  - reference: PMID:38871951
    reference_title: >-
      S-cone contribution to oscillatory potentials in patients with blue cone
      monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The aim of this exploratory study is to investigate the role of S-cones in
      oscillatory potentials (OPs) generation by individuals with blue-cone
      monochromacy (BCM), retaining S-cones, and achromatopsia (ACHM), lacking cone
      functions.
    explanation: >-
      States the retained-S-cone versus absent-cone-function contrast that separates
      the two disorders.
- name: X-linked cone dystrophy
  description: >-
    Missense variants in the same L/M opsin genes can produce X-linked cone
    dystrophy or high myopia with abnormal cone function rather than this disorder,
    so the same locus spans a phenotypic range and genotype alone does not settle
    the diagnosis.
  distinguishing_features:
  - Progressive cone degeneration rather than a predominantly congenital deficit
  - A different pattern of L/M opsin missense alleles at the same locus
  evidence:
  - reference: PMID:37001420
    reference_title: Blue cone monochromacy and gene therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-linked retinal diseases resulting from mutations in the L- (OPN1LW, OMIM
      *300822) and M- (OPN1MW, OMIM *300821) opsin gene cluster are associated with
      a wide range of visual defects, including red/green color vision deficiency,
      X-linked cone dystrophy/dysfunction, high myopia with abnormal cone function,
      and blue cone monochromacy (BCM)
    explanation: >-
      Establishes that the same locus produces a spectrum of distinct diagnoses.
treatments:
- name: Tinted Lenses and Low Vision Aids
  description: >-
    The whole of current management. Tinted lenses reduce photophobia and improve
    contrast; low-vision aids address the acuity deficit. Nothing available today
    modifies the underlying disease.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Photophobia
    term:
      id: HP:0000613
      label: Photophobia
  evidence:
  - reference: PMID:39408969
    reference_title: >-
      Evaluation of Retinal Structure and Visual Function in Blue Cone Monochromacy
      to Develop Clinical Endpoints for L-opsin Gene Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are currently no treatments for BCM, and management of the disease is
      limited to the use of tinted lenses and low vision aids.
    explanation: >-
      States both the absence of disease-modifying therapy and the content of
      current management.
- name: AAV-Mediated L-Opsin Gene Augmentation (investigational)
  description: >-
    The therapeutic strategy in development: deliver a functional L-opsin gene to
    residual L/M cones by adeno-associated virus. It is investigational, not
    approved, and is recorded here as a research programme rather than a treatment
    option. Its central design problem follows directly from the pathophysiology
    above — the residual cones are largely non-waveguiding and decline with age, so
    the therapeutic window is bounded and genotype-dependent. Much of the recent
    clinical literature is accordingly about building outcome measures sensitive
    enough to detect an L-cone-specific gain. Route of delivery is itself a design
    constraint here: subretinal injection risks the very foveal structure that is
    the therapeutic target, which is why an intravitreal vector was developed.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Absent or Non-Functional L and M Cone Photopigment
    treatment_effect: RESTORES
    description: >-
      Gene augmentation aims to restore L-opsin expression in surviving cones; it
      cannot recover cones already lost, which is why the timing question is
      central.
    evidence:
    - reference: PMID:39408969
      reference_title: >-
        Evaluation of Retinal Structure and Visual Function in Blue Cone
        Monochromacy to Develop Clinical Endpoints for L-opsin Gene Therapy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        L-cone opsin expression by gene therapy is a promising treatment for blue
        cone monochromacy (BCM) caused by congenital lack of long- and
        middle-wavelength-sensitive (L/M) cone function.
      explanation: >-
        States the therapeutic rationale and its molecular target.
  evidence:
  - reference: PMID:36932675
    reference_title: >-
      Preclinical evaluation of ADVM-062, a novel intravitreal gene therapy vector
      for the treatment of blue cone monochromacy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A single IVT administration dose of ADVM-062 effectively transduced gerbil
      cone photoreceptors and produced a de novo response to long-wavelength
      stimuli.
    explanation: >-
      Preclinical proof that an intravitreally delivered L-opsin vector produces a
      new long-wavelength response, in an animal whose cone-rich retina naturally
      lacks L-opsin.
  - reference: PMID:36932675
    reference_title: >-
      Preclinical evaluation of ADVM-062, a novel intravitreal gene therapy vector
      for the treatment of blue cone monochromacy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, most experimental ocular gene therapies utilize subretinal vector
      injection which would pose a risk to the fragile central retinal structure of
      BCM patients.
    explanation: >-
      Supports the delivery-route constraint stated in the description.
  - reference: PMID:39408969
    reference_title: >-
      Evaluation of Retinal Structure and Visual Function in Blue Cone Monochromacy
      to Develop Clinical Endpoints for L-opsin Gene Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study developed and evaluated specialized outcomes that will be needed
      for the determination of efficacy and safety in human clinical trials.
    explanation: >-
      Confirms that human trials are prospective rather than completed, which is why
      this is curated as investigational.
discussions:
- discussion_id: bcm_stationary_versus_progressive
  kind: CONTROVERSY
  prompt: >-
    Is blue cone monochromacy a stationary cone dysfunction syndrome or a slowly
    progressive dystrophy, and how much of the disagreement is explained by genotype
    rather than by measurement sensitivity?
  attaches_to:
  - pathophysiology#Cone Outer Segment Disruption and Progressive Foveal Cone Loss
  - phenotypes#Progressive Loss of Cone Function
  rationale: >-
    The disorder is classified among the stationary cone dysfunction syndromes, and
    many families do appear stable. But progression has been demonstrated
    psychophysically in individual families, macular atrophy develops in a subset,
    OCT shows an age-related effect on foveal disease stage, and the rate differs
    between large-deletion and Cys203Arg genotypes. Curating this as simply
    "stationary" would be wrong, and curating it as simply "progressive" would
    overstate what is shown for most patients. The unresolved part is whether the
    apparently stable majority are genuinely stable or merely followed for too short
    a time with insufficiently sensitive measures — which matters directly, because
    a bounded therapeutic window is the main design constraint on the gene therapy
    programmes.
  proposed_experiments:
  - experiment_id: bcm_longitudinal_genotype_stratified_aoslo
    name: Longitudinal genotype-stratified AOSLO and microperimetry cohort
    description: >-
      Follow LCR-deletion and Cys203Arg cohorts prospectively with adaptive-optics
      cone density, OCT outer nuclear layer thickness, and dark-adapted red
      microperimetry, to establish whether the stable-appearing majority show
      measurable decline on sensitive endpoints and to quantify the window per
      genotype.
  evidence:
  - reference: PMID:15094734
    reference_title: >-
      Blue cone monochromatism: a phenotype and genotype assessment with evidence of
      progressive loss of cone function in older individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In two families, psychophysical testing demonstrated evidence for progression
      of disease.
    explanation: >-
      Evidence for the progressive side of the question.
  - reference: PMID:10982039
    reference_title: >-
      Spectrum of color gene deletions and phenotype in patients with blue cone
      monochromacy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progressive macular atrophy was observed in affected members of two BCM
      families while the rest of the families presented with normal fundus.
    explanation: >-
      Shows that progression is a subset finding, which is the other side of the
      controversy.
- discussion_id: bcm_genotype_phenotype_correlation
  kind: OPEN_QUESTION
  prompt: >-
    Does genotype at the opsin array predict the clinical phenotype, given that one
    series found no genotype-phenotype association while later structural work found
    deletion genotypes progress faster than Cys203Arg?
  attaches_to:
  - pathophysiology#Loss of Function of the OPN1LW/OPN1MW Opsin Gene Array
  rationale: >-
    These findings are not straightforwardly contradictory — the earlier study
    assessed cross-sectional clinical and electrophysiological phenotype, the later
    work assessed rate of structural change — but they are routinely quoted against
    each other. Resolving which phenotypic dimensions genotype predicts (baseline
    severity versus rate of decline) is what a counselling statement or a trial
    stratification would actually need.
  evidence:
  - reference: PMID:10982039
    reference_title: >-
      Spectrum of color gene deletions and phenotype in patients with blue cone
      monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No association was observed between the phenotypes and genotypes in these
      families.
    explanation: >-
      The negative cross-sectional finding.
  - reference: PMID:39408969
    reference_title: >-
      Evaluation of Retinal Structure and Visual Function in Blue Cone Monochromacy
      to Develop Clinical Endpoints for L-opsin Gene Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, foveal structural changes tend to progress faster in patients with
      large deletions as compared with the point mutation
    explanation: >-
      The positive longitudinal-structural finding on the other side.
notes: >-
  Relationship to Achromatopsia. This entry deliberately overlaps with, but is
  distinct from, the existing Achromatopsia entry. Achromatopsia is autosomal
  recessive and abolishes all three cone classes; this disorder is X-linked and
  spares S cones. The Achromatopsia entry already lists blue-cone monochromatism as
  a differential; this entry is the reciprocal, curated on its own genetics and
  mechanism rather than as a variant of achromatopsia. The MONDO definition
  describes it as an incomplete form of achromatopsia, which is a reasonable
  classification statement but should not be read as implying shared
  pathophysiology — the causal genes and the cone populations involved differ.

  Ontology limits worth recording. UBERON has no term for the S-cone-sparse central
  zone of the fovea, and CL distinguishes L, M and S cone cells but not the
  hybrid-opsin-expressing cones that many patients actually carry. Neither gap was
  worked around by picking a broader term and describing something narrower in
  prose.

  Two ontology suggestions in the deep-research report were wrong and were not
  used: UBERON:0001782 was suggested for fovea centralis but is the pigmented layer
  of the retina (the correct term is UBERON:0001786), and HP:0000640 was suggested
  for nystagmus (the correct term is HP:0000639). Both were caught by checking
  against the term caches, not by the report's own reference validation, which
  checks citations only.
references:
- reference: PMID:37001420
  title: Blue cone monochromacy and gene therapy.
- reference: PMID:8213841
  title: Genetic heterogeneity among blue-cone monochromats.

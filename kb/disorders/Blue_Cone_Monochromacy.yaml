pathophysiology:
- name: Loss of Function of the OPN1LW/OPN1MW Opsin Gene Array
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. Both the L and M opsin genes on Xq28 must lose function;
    loss of only one produces ordinary red-green colour blindness, not this
    disorder. Two mutational routes dominate. The first is deletion of the locus
    control region 3.1-3.7 kb upstream of the array, which silences every gene
    downstream of it. The second is unequal homologous recombination that collapses
    the array to a single gene or a 5'L-M-3' hybrid, which then carries an
    inactivating point substitution — most often Cys203Arg, and less often
    Arg247Ter or Pro307Leu. High-resolution X-chromosome microarray has since
    resolved more complex rearrangements, including a founder allele combining a
    3-kb LCR deletion with insertion of an aberrant OPN1MW gene.
  genes:
  - preferred_term: OPN1LW
    term:
      id: hgnc:9936
      label: OPN1LW
  - preferred_term: OPN1MW
    term:
      id: hgnc:4206
      label: OPN1MW
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Failure of Locus Control Region-Driven Opsin Expression
    causal_link_type: DIRECT
    description: >-
      Deletion of the locus control region removes the enhancer that both opsin
      promoters depend on.
  - target: Absent or Non-Functional L and M Cone Photopigment
    causal_link_type: DIRECT
    description: >-
      Inactivating coding substitutions in a collapsed single-gene array leave the
      cone without usable photopigment even when transcription proceeds.
  evidence:
  - reference: PMID:8213841
    reference_title: Genetic heterogeneity among blue-cone monochromats.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As observed in an earlier study, the rearrangements involve either deletion
      of a locus control region adjacent to the gene array or loss of function via
      homologous recombination and point mutation.
    explanation: >-
      Establishes the two dominant mutational routes that this node represents.
  - reference: PMID:8213841
    reference_title: Genetic heterogeneity among blue-cone monochromats.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two other point mutations were identified: (a) Arg247-to-Ter in one subject
      with a single red-pigment gene and (b) Pro307-to-Leu in one subject with a
      single 5' red-3' green hybrid gene.
    explanation: >-
      Documents the additional inactivating substitutions named in this node.
  - reference: PMID:26153062
    reference_title: >-
      High-resolution microarray analysis unravels complex Xq28 aberrations in
      patients and carriers affected by X-linked blue cone monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In two families, we identified a novel founder mutation that consisted of a
      complex 3-kb deletion that embraced the cis-regulatory locus control region
      and insertion of an additional aberrant OPN1MW gene.
    explanation: >-
      Documents the complex rearrangement class that PCR-based testing missed.
  - reference: DOI:10.1126/science.2788922
    reference_title: >-
      Molecular Genetics of Human Blue Cone Monochromacy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One class arose from the wild type by a two-step pathway consisting of unequal
      homologous recombination and point mutation. The second class arose by
      nonhomologous deletion of genomic DNA adjacent to the red and green pigment
      gene cluster.
    explanation: >-
      The original two-class formulation of the mutational routes this node models.
- name: Failure of Locus Control Region-Driven Opsin Expression
  biological_scale: MOLECULAR
  description: >-
    The regulatory arm, and the reason a single deletion suffices. A locus control
    region between 3.1 and 3.7 kb upstream of the L opsin transcription start site
    is essential for expression of the adjacent visual pigment genes, and the
    mutually exclusive choice of one opsin per cone is set by competition between
    the two pigment promoters for pairing with that single LCR. Deleting it
    therefore does not silence one gene, it silences the array — converting what
    would need to be two independent inactivating events into one.
  genes:
  - preferred_term: OPN1LW
    term:
      id: hgnc:9936
      label: OPN1LW
  biological_processes:
  - preferred_term: regulation of DNA-templated transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: ABSENT
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  downstream:
  - target: Absent or Non-Functional L and M Cone Photopigment
    causal_link_type: DIRECT
    description: >-
      With the enhancer gone, neither opsin promoter is transcribed in cones that
      would otherwise express L or M opsin.
  evidence:
  - reference: PMID:1524826
    reference_title: >-
      A locus control region adjacent to the human red and green visual pigment
      genes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      a region between 3.1 kb and 3.7 kb 5' of the red pigment gene transcription
      initiation site is essential for expression
    explanation: >-
      Transgenic-mouse mapping of the enhancer whose deletion causes the disease.
  - reference: PMID:1524826
    reference_title: >-
      A locus control region adjacent to the human red and green visual pigment
      genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deletion of sequences 5' of the human red and green pigment gene array
      results in blue cone monochromacy, a disorder in which both red and green
      cone function are absent.
    explanation: >-
      States the human genotype-phenotype relationship this node encodes.
  - reference: PMID:11773636
    reference_title: >-
      Role of a locus control region in the mutually exclusive expression of human
      red and green cone pigment genes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The results support a model in which the mutually exclusive expression of
      these genes in their respective cone types is controlled by competition
      between visual pigment promoters for pairing with the LCR
    explanation: >-
      Gives the regulatory model — one LCR shared by both promoters — that makes a
      single deletion sufficient.
  - reference: DOI:10.1126/science.2788922
    reference_title: >-
      Molecular Genetics of Human Blue Cone Monochromacy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These deletions define a 579-base pair region that is located 4 kilobases
      upstream of the red pigment gene and 43 kilobases upstream of the nearest green
      pigment gene; this 579-base pair region is essential for the activity of both
      pigment genes.
    explanation: >-
      The founding observation: patient deletions themselves delimited the essential
      shared regulatory element, before it was called a locus control region.
- name: Absent or Non-Functional L and M Cone Photopigment
  biological_scale: CELLULAR
  description: >-
    The convergence point of both mutational routes. Cones that should express L or
    M opsin either make no opsin at all (deletion genotypes) or make an unstable,
    non-functional one (Cys203Arg disrupts a conserved disulfide bond required for
    correct folding of the seven-transmembrane opsin GPCR). Opsin is not only the
    light sensor but a structural requirement for building and maintaining the cone
    outer segment, so an opsin-null cone is compromised as a cell, not merely blind.
  cell_types:
  - preferred_term: L cone cell
    term:
      id: CL:0003048
      label: L cone cell
  - preferred_term: M cone cell
    term:
      id: CL:0003049
      label: M cone cell
  molecular_functions:
  - preferred_term: G protein-coupled photoreceptor activity
    term:
      id: GO:0008020
      label: G protein-coupled photoreceptor activity
    modifier: ABSENT
  biological_processes:
  - preferred_term: phototransduction
    term:
      id: GO:0007602
      label: phototransduction
    modifier: ABSENT
  downstream:
  - target: Cone Outer Segment Disruption and Progressive Foveal Cone Loss
    causal_link_type: DIRECT
    description: >-
      Absence of opsin destabilizes the outer segment and, over time, the cone
      itself.
  - target: Vision Mediated by Preserved S Cones and Rods
    causal_link_type: DIRECT
    description: >-
      With L and M cones silent, daylight vision falls back onto the S cones and
      partially desensitized rods.
  evidence:
  - reference: PMID:8213841
    reference_title: Genetic heterogeneity among blue-cone monochromats.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One inactivating mutation, Cys203-to-Arg, was found in 15 probands who carry
      single genes and in both visual pigment genes in one subject whose array has
      two genes.
    explanation: >-
      Establishes Cys203Arg as the dominant inactivating substitution.
  - reference: PMID:37001420
    reference_title: Blue cone monochromacy and gene therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similar to rhodopsin in rods, cone opsins are crucial in both the maintenance
      and structural integrity of the cone outer segment, the light-sensing
      organelle of the cell.
    explanation: >-
      States the structural, not merely sensory, role of opsin that makes an
      opsin-null cone structurally vulnerable.
- name: Cone Outer Segment Disruption and Progressive Foveal Cone Loss
  biological_scale: TISSUE
  description: >-
    Foveal cones are structurally abnormal from early in life and decline further
    with age. Adaptive-optics imaging shows reduced total cone density with the
    majority of the remaining population non-waveguiding — that is, present as cells
    but not functioning as light guides. This is why the "stationary disorder"
    framing is only partly right: outer retinal changes are detectable on OCT with
    an age-related effect on foveal disease stage, and psychophysical progression
    has been demonstrated in individual families. Progression is genotype-dependent,
    with large deletions advancing faster than the Cys203Arg substitution.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: photoreceptor cell outer segment organization
    term:
      id: GO:0035845
      label: photoreceptor cell outer segment organization
    modifier: ABNORMAL
  locations:
  - preferred_term: fovea centralis
    term:
      id: UBERON:0001786
      label: fovea centralis
  evidence:
  - reference: PMID:39408969
    reference_title: >-
      Evaluation of Retinal Structure and Visual Function in Blue Cone Monochromacy
      to Develop Clinical Endpoints for L-opsin Gene Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AOSLO imaging showed reduced total cone density with majority of the
      population being non-waveguiding.
    explanation: >-
      Direct structural measurement of the residual foveal cone population.
  - reference: PMID:39408969
    reference_title: >-

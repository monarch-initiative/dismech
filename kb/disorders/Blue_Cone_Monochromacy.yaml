      pre-existing alleles. This does not exclude population-specific founders.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- name: Splice-disrupting exon 3 haplotypes
  association: Genetic Mutation
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: OPN1LW
    term:
      id: hgnc:9936
      label: OPN1LW
  notes: >-
    LIAVA, LIVVA and related combinations produce variable exon 3 skipping. The phenotype depends on the complete
    OPN1LW/OPN1MW array; some configurations cause mild BCM or overlap with Bornholm eye disease and other
    cone dysfunction. Single component polymorphisms are not independently equivalent to the pathogenic haplotype.
  evidence:
  - reference: PMID:35743313
    reference_title: Novel OPN1LW/OPN1MW Exon 3 Haplotype-Associated Splicing Defect in Patients with X-Linked Cone Dysfunction.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Applying minigene assays for all observed exon 3 haplotypes in the patients, we demonstrated that the
      novel exon 3 haplotype L-I-V-V-A induces a strong but incomplete splicing defect with 3-5% of residual
      correctly spliced transcripts.
    explanation: >-
      Minigene assays establish incomplete exon 3 splicing for LIVVA.
    quote_role: PRIMARY_RESULT
  - reference: PMID:35400991
    reference_title: Relatively mild blue cone monochromacy phenotype caused by various haplotypes in the L- and M-cone opsin genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Analysis of the clinical data revealed better best-corrected visual acuity, more severe myopia, and higher
      30-Hz cone flicker responses in the patients with exon 3 haplotypes than in those with typical BCM.
    explanation: >-
      The clinical cohort supports a milder average phenotype with important overlap.
    quote_role: PRIMARY_RESULT
- name: De novo opsin-array rearrangement
  association: Genetic Mutation
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: OPN1LW
    term:
      id: hgnc:9936
      label: OPN1LW
  notes: >-
    A sporadic case carried a 73,128-bp deletion encompassing the LCR, OPN1LW and part of OPN1MW, absent from
    maternal and grandfather samples. Breakpoint microhomology supports a proposed Alu-mediated mechanism;
    segregation did not directly observe the germline event.
  evidence:
  - reference: PMID:29940872
    reference_title: 'A 73,128 bp de novo deletion encompassing the OPN1LW/OPN1MW gene cluster in sporadic Blue Cone Monochromacy: a case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The deletion was absent in the X-chromosomes of both the mother and transmitting grandfather.
    explanation: >-
      Segregation supports a de novo event in a sporadic case.
    quote_role: PRIMARY_RESULT
diagnosis:
- name: Full-Field Electroretinography
  description: >-
    Assess light-adapted and dark-adapted full-field ERG and use S-cone-specific testing where available. Classic
    BCM has severe L/M dysfunction with retained S-cone and rod responses, but residual photopic responses
    and subnormal dark-adapted amplitudes occur. Oscillatory potentials from a standard dark-adapted mixed
    response did not distinguish BCM from achromatopsia in a comparative study. Integrate electrophysiology
    with molecular testing and clinical findings.
  evidence:
  - reference: PMID:10982039
    reference_title: >-
      Spectrum of color gene deletions and phenotype in patients with blue cone
      monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acuities were reduced in all affected males, and photopic b-wave was reduced
      by more than 90% in seven families.
    explanation: >-
      Quantifies the photopic reduction that anchors the ERG diagnosis.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:38871951
    reference_title: S-cone contribution to oscillatory potentials in patients with blue cone monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The comparison between ACHM and BCM didn't show any statistically significant differences in the electrophysiological
      parameters.
    explanation: >-
      The exploratory mixed-response study does not supply a discriminatory ERG marker.
    quote_role: PRIMARY_RESULT
  - reference: PMID:25909963
    reference_title: >-
      Blue cone monochromacy: visual function and efficacy outcome measures for
      clinical trials.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Short-wavelength (S-) sensitive cone function was normal or near normal in most
      patients.
    explanation: >-
      Confirms S-cone sparing quantitatively rather than by inference from the
      genotype.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- name: Colour Vision Testing
  description: >-
    Colour testing characterizes residual discrimination but cannot alone establish BCM. D-15 often shows protan/deutan
    confusion; MR testing may reveal residual tritan discrimination. CAD can distinguish moderate from severe
    yellow-blue deficits. Brightness cues, rod contribution, illumination and display limits complicate interpretation.
  evidence:
  - reference: PMID:15094734
    reference_title: >-
      Blue cone monochromatism: a phenotype and genotype assessment with evidence of
      progressive loss of cone function in older individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, we have demonstrated that the Mollon-Reffin (MR) Minimal test is
      a useful colour-discrimination test to aid in the diagnosis of BCM.
    explanation: >-
      Identifies the colour test with the best discriminating value here.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:15094734
    reference_title: >-
      Blue cone monochromatism: a phenotype and genotype assessment with evidence of
      progressive loss of cone function in older individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have confirmed the reported finding of protan-like D-15 arrangements of
      patients with BCM.
    explanation: >-
      Documents the D-15 pattern.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:36692456
    reference_title: >-
      Color Vision in Blue Cone Monochromacy: Outcome Measures for a Clinical Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With D-15, there was protan-deutan confusion and no bimodal tendency.
    explanation: >-
      Characterizes the D-15 result pattern specific to this disorder.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:36692456
    reference_title: 'Color Vision in Blue Cone Monochromacy: Outcome Measures for a Clinical Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The patients with BCM we studied with CAD showed different patterns of YB thresholds, with some patients
      having only moderate threshold elevations and others showing severely elevated thresholds.
    explanation: >-
      All six CAD-tested patients had abnormal yellow-blue thresholds, with variable severity.
    quote_role: PRIMARY_RESULT
- name: Molecular Testing of the Xq28 Opsin Array
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Resolve the LCR, copy number, expressed-gene positions, coding variants and exon 3 haplotypes across the
    OPN1LW/OPN1MW array. Standard short-read sequencing has limited reliability at this highly homologous locus.
    Targeted long-range amplification and sequence analysis combined with deletion/copy-number testing are
    useful; a validated approach combines MLPA with long-read sequencing. Custom high-resolution Xq28 microarrays
    can resolve some rearrangements but should not be equated with routine genome-wide microarrays. Complex
    arrays and female carrier phasing may require family studies or additional structural analysis.
  evidence:
  - reference: DOI:10.1038/s41525-022-00334-9
    reference_title: Diagnostic analysis of the highly complex OPN1LW/OPN1MW gene cluster using long-read sequencing and MLPA
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      A diagnostic genetic assay was developed for the OPN1LW/OPN1MW gene cluster, consisting of copy number
      analysis via multiplex ligation-dependent probe amplification and sequence analysis via long-read circular
      consensus sequencing.
    explanation: >-
      The validated assay combines sequence and dosage analysis; the cohort contained several opsin-related
      diagnoses.
    quote_role: PRIMARY_RESULT
  - reference: PMID:26153062
    reference_title: >-
      High-resolution microarray analysis unravels complex Xq28 aberrations in
      patients and carriers affected by X-linked blue cone monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic alterations were revealed in all probands, characterized by
      sequencing of the breakpoint junctions and quantitative real-time PCR.
    explanation: >-
      Demonstrates the diagnostic yield of the microarray approach.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  notes: >-
    The 2022 assay series included 43 diagnostic and seven carrier samples across opsin-related conditions,
    not 50 BCM patients. Exact assignment can remain unresolved with four or more heterogeneous copies, and
    female alleles may require segregation to phase. A VUS or an isolated variant without the relevant array
    context does not establish BCM.
- name: Retinal imaging and longitudinal assessment
  description: >-
    OCT characterizes foveal hypoplasia, outer nuclear layer thickness and ellipsoid-zone disruption. Adaptive-optics
    imaging is a specialist research measure of residual mosaics; analyzability depends on fixation and image
    quality. Imaging findings overlap with achromatopsia and cannot independently determine diagnosis, cone
    identity or treatment eligibility.
  evidence:
  - reference: PMID:36186895
    reference_title: Comparing Retinal Structure in Patients with Achromatopsia and Blue Cone Monochromacy Using OCT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Sixty-two of the total 89 ACHM patients (70%) had foveal hypoplasia, compared with 11 of 33 BCM patients
      (33%).
    explanation: >-
      The full-text OCT cohort documents foveal hypoplasia in BCM as well as ACHM.
    quote_role: PRIMARY_RESULT
  - reference: PMID:39408969
    reference_title: >-
      Evaluation of Retinal Structure and Visual Function in Blue Cone Monochromacy
      to Develop Clinical Endpoints for L-opsin Gene Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AOSLO imaging showed reduced total cone density with majority of the
      population being non-waveguiding.
    explanation: >-
      Direct structural measurement of the residual foveal cone population.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
differential_diagnoses:
- name: Achromatopsia
  description: >-
    Achromatopsia is usually autosomal recessive and involves cone phototransduction or development genes rather
    than the X-linked L/M opsin array. Complete forms affect all cone classes, but incomplete disease and some
    GNAT2/PDE6C-associated cases can retain cone or short-wavelength responses. Phenotype, inheritance, appropriate
    ERG and molecular results must be integrated.
  disease_term:
    preferred_term: achromatopsia
    term:
      id: MONDO:0018852
      label: achromatopsia
  distinguishing_features:
  - Autosomal recessive inheritance and variants in achromatopsia genes support that diagnosis.
  - Complete achromatopsia lacks cone-mediated responses, but incomplete forms can overlap BCM.
  - Foveal hypoplasia was more frequent in achromatopsia than BCM in a comparative OCT cohort; its presence does not exclude BCM.
  - Neither retained tritan discrimination nor a single OCT feature independently settles the diagnosis.
  evidence:
  - reference: PMID:36186895
    reference_title: Comparing Retinal Structure in Patients with Achromatopsia and Blue Cone Monochromacy Using OCT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Sixty-two of the total 89 ACHM patients (70%) had foveal hypoplasia, compared with 11 of 33 BCM patients
      (33%).
    explanation: >-
      The full-text OCT cohort documents foveal hypoplasia in BCM as well as ACHM.
    quote_role: PRIMARY_RESULT
  - reference: PMID:36186895
    reference_title: Comparing Retinal Structure in Patients with Achromatopsia and Blue Cone Monochromacy Using OCT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Differences between these groups have been found in eye movements using electro-oculography,12 as well
      as in cone responses using electroretinography (ERG),4,11 although ERG presentation in BCM and both GNAT2-
      and PDE6C-related ACHM can be similar due to preservation of short-wavelength sensitivity.13,14
    explanation: >-
      The source describes diagnostic overlap, including retained short-wavelength sensitivity in some achromatopsia
      genotypes.
    quote_role: BACKGROUND
- name: X-linked cone dystrophy
  description: >-
    OPN1LW/OPN1MW variants also cause Bornholm eye disease, isolated colour-vision deficiency and progressive
    cone dysfunction/dystrophy. Splicing haplotypes can produce overlapping mild BCM phenotypes. Array context,
    residual L/M function, myopia, acuity and longitudinal course determine the clinical interpretation.
  distinguishing_features:
  - Bornholm eye disease often combines high myopia, red-green colour deficiency and residual cone responses.
  - Progressive cone dystrophy and mild BCM can overlap; a shared opsin variant alone does not resolve the label.
  evidence:
  - reference: PMID:37001420
    reference_title: Blue cone monochromacy and gene therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-linked retinal diseases resulting from mutations in the L- (OPN1LW, OMIM
      *300822) and M- (OPN1MW, OMIM *300821) opsin gene cluster are associated with
      a wide range of visual defects, including red/green color vision deficiency,
      X-linked cone dystrophy/dysfunction, high myopia with abnormal cone function,
      and blue cone monochromacy (BCM)
    explanation: >-
      Establishes that the same locus produces a spectrum of distinct diagnoses.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:35400991
    reference_title: Relatively mild blue cone monochromacy phenotype caused by various haplotypes in the L- and M-cone opsin genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Analysis of the clinical data revealed better best-corrected visual acuity, more severe myopia, and higher
      30-Hz cone flicker responses in the patients with exon 3 haplotypes than in those with typical BCM.
    explanation: >-
      The clinical cohort supports a milder average phenotype with important overlap.
    quote_role: PRIMARY_RESULT
treatments:
- name: Tinted Lenses and Low Vision Aids
  description: >-
    Tinted lenses and low-vision aids can support photophobia and visual tasks. Refractive correction and individualized
    educational accommodations also form part of management. These measures do not restore the missing L/M
    photopigment.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Photophobia
    term:
      id: HP:0000613
      label: Photophobia
  evidence:
  - reference: PMID:36932675
    reference_title: Preclinical evaluation of ADVM-062, a novel intravitreal gene therapy vector for the treatment of blue cone monochromacy.
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Current management includes the use of refractive corrective lenses, tinted lenses for disabling photophobia,
      and educational support.
    explanation: >-
      Background clinical management description, not an intervention trial.
    quote_role: BACKGROUND
- name: AAV-Mediated L-Opsin Gene Augmentation (investigational)
  description: >-
    AAV delivery of functional L- or M-opsin is investigational. Mouse studies restore partial cone ERG responses
    and outer-segment structure, with age and model background affecting rescue. The 2025 comparison of DKO
    and C198R/Opn1sw-null mice found no significant genotype difference in therapeutic windows, and weaker
    responses in older animals. All-cone models also respond after treatment at five months. These studies
    do not establish a human age cutoff or efficacy. Intravitreal ADVM-062 produced new long-wavelength responses
    in gerbils and foveal transduction in nonhuman primates; mild ocular inflammation occurred at higher doses.
    Neither species was a human BCM treatment cohort.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Absent or Non-Functional L and M Cone Photopigment
    treatment_effect: RESTORES
    description: >-
      Experimental supplementation supplies functional opsin to surviving cones. Structural rescue and partial
      electrophysiological rescue have been demonstrated in mouse models; restoration of human vision remains
      unproven.
    evidence:
    - reference: PMID:38060327
      reference_title: Structural and functional rescue of cones carrying the most common cone opsin C203R missense mutation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Together, these data demonstrate that when treated at 1 or 3 months of age, gene augmentation can provide
        structural and functional rescue to Opn1mwC198R Opn1sw–/– cones.
      explanation: >-
        Direct experimental rescue in the specified mouse model.
      quote_role: PRIMARY_RESULT
  evidence:
  - reference: PMID:36932675
    reference_title: >-
      Preclinical evaluation of ADVM-062, a novel intravitreal gene therapy vector
      for the treatment of blue cone monochromacy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A single IVT administration dose of ADVM-062 effectively transduced gerbil
      cone photoreceptors and produced a de novo response to long-wavelength
      stimuli.
    explanation: >-
      Preclinical proof that an intravitreally delivered L-opsin vector produces a
      new long-wavelength response, in an animal whose cone-rich retina naturally
      lacks L-opsin.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:41286353
    reference_title: Molecular mechanisms limiting the AAV gene therapy treatment window in mouse models of blue cone monochromacy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Both DKO and C198R models show comparable therapeutic outcomes, with efficacy consistently decreasing
      in older mice.
    explanation: >-
      Final peer-reviewed study supersedes the 2025 preprint.
    quote_role: PRIMARY_RESULT
  - reference: PMID:36932675
    reference_title: Preclinical evaluation of ADVM-062, a novel intravitreal gene therapy vector for the treatment of blue cone monochromacy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      In-life observations were limited to dose-dependent non-adverse slight to mild ocular inflammation characterized
      by pigment and cells in the vitreous humor.
    explanation: >-
      The primate toxicology study reports inflammation despite its non-adverse classification.
    quote_role: PRIMARY_RESULT
- name: Reading and display adaptations
  description: >-
    Individualize magnification, print size, screen brightness and contrast polarity. White text on a black
    background improved at least one reading parameter in 82% of a 17-person cohort; assess the individual
    response rather than assuming the same benefit for everyone.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:33344057
    reference_title: 'Reading Performance in Blue Cone Monochromacy: Defining an Outcome Measure for a Clinical Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Reverse polarity showed better reading parameters than regular polarity in 82% of the patients.
    explanation: >-
      Seventeen patients were studied; this supports individualized white-on-black reading adaptations, not
      universal benefit.
    quote_role: PRIMARY_RESULT
- name: Genetic counselling and family testing
  description: >-
    Counselling uses the resolved familial array configuration to explain X-linked transmission, rare symptomatic
    females and de novo rearrangements. Carrier analysis should account for complex gene copy number and may
    require segregation studies.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: DOI:10.1038/s41525-022-00334-9
    reference_title: Diagnostic analysis of the highly complex OPN1LW/OPN1MW gene cluster using long-read sequencing and MLPA
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      It is of clinical importance to perform carrier status analysis of the OPN1LW/OPN1MW gene cluster to
      determine recurrence risk, especially in families with no family history of visual impairment, as shown
      in four cases in whom the pathogenic allele arose de novo .
    explanation: >-
      The diagnostic series supports family testing for recurrence-risk counselling.
animal_models:
- name: Opn1mw C198R knock-in mouse
  species: Mouse
  genotype: Opn1mw C198R knock-in (murine equivalent of human OPN1MW Cys203Arg)
  publication: PMID:41941983
  description: >-
    Opn1mw C198R knock-in on an S-opsin-expressing background. The substitution is the murine equivalent of
    human Cys203Arg. It is distinct from the C198R/Opn1sw-null double mutant used in gene-therapy experiments.
  modeled_mechanisms:
  - target: Absent or Non-Functional L and M Cone Photopigment
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Diminished M-opsin expression with mislocalization, and loss of cone outer
      segments in M-cone photoreceptors — the structural consequence this node
      asserts.
    limitations: >-
      Mouse cones commonly coexpress S-opsin, which can preserve function or structure. The retina lacks a
      human fovea and L-opsin; transfected-cell aggregation was not reproduced in retina.
    evidence:
    - reference: PMID:41941983
      reference_title: Molecular and cellular impact of a C203R/C198R M-opsin mutation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The mutation diminished the expression of M-opsin with some apparent
        mislocalization of the cone opsin without aggregation, which resulted in the
        loss of cone outer segments in M-cone photoreceptor cells.
      explanation: >-
        The in vivo structural result linking the allele to outer-segment loss.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
  - target: Cone Outer Segment Disruption
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Outer-segment loss can coexist with surviving cone cell bodies through six months in the S-opsin-expressing
      knock-in background.
    limitations: >-
      Survival through six months in this background does not establish lifelong human cone survival or rule
      out degeneration in S-opsin-null models.
    evidence:
    - reference: PMID:41941983
      reference_title: Molecular and cellular impact of a C203R/C198R M-opsin mutation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Despite the loss of cone outer segments, cone photoreceptor cells remained
        viable, even up to 6 months of age in hemizygous and homozygous mutant mice.
      explanation: >-
        The dissociation between outer-segment loss and cone survival.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
    - reference: PMID:41941983
      reference_title: Molecular and cellular impact of a C203R/C198R M-opsin mutation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Thus, in contrast to rhodopsin mutants, the M-opsin mutant does not appear to
        form toxic aggregates that cause cone photoreceptor cell death.
      explanation: >-
        States the negative mechanistic conclusion that distinguishes this from the
        rhodopsin misfolding diseases.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
- name: Opn1mw knockout mouse
  species: Mouse
  genotype: Opn1mw -/- (M-opsin knockout, expressing only S-opsin)
  publication: PMID:28751656
  description: >-
    M-opsin-null mouse retaining endogenous S-opsin. AAV5-mediated mouse M-opsin supplementation restores partial
    middle-wavelength ERG responses after treatment at postnatal day 14 or three months.
  modeled_mechanisms:
  - target: Absent or Non-Functional L and M Cone Photopigment
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Cones lacking M-opsin, the null counterpart of the human deletion class.
    limitations: >-
      S-opsin coexpression can preserve many murine cones; the model does not reproduce the isolated opsin
      deficit in human L/M cones or the human fovea.
    evidence:
    - reference: PMID:28751656
      reference_title: >-
        Gene-based Therapy in a Mouse Model of Blue Cone Monochromacy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We generated an M-opsin knockout mouse (Opn1mw -/-) expressing only S-opsin
        as a model for human BCM.
      explanation: >-
        States the model's design intent.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
  - target: Absent or Non-Functional L and M Cone Photopigment
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      AAV5-mediated M-opsin expression restores partial middle-wavelength responses and outer-segment localization.
    limitations: >-
      Rescue in a young mouse retina says nothing about the aged, largely
      non-waveguiding human foveal cone population that would actually be treated.
    evidence:
    - reference: PMID:28751656
      reference_title: >-
        Gene-based Therapy in a Mouse Model of Blue Cone Monochromacy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our study demonstrates that cones without M-opsin remain viable and respond
        to gene augmentation therapy, thereby providing proof-of-concept for cone
        function restoration in BCM patients.
      explanation: >-
        The proof-of-concept result underpinning the investigational treatment.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
- name: Opsin-null and C198R/S-opsin-null comparative models
  species: Mouse
  genotype: Opn1mw -/-; Opn1sw -/- versus Opn1mw C198R; Opn1sw -/-
  publication: PMID:41286353

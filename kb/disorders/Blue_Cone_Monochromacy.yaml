pathophysiology:
- name: Loss of Function of the OPN1LW/OPN1MW Opsin Gene Array
  biological_scale: MOLECULAR
  description: >-
    Pathogenic array configurations abolish or markedly reduce functional L- and M-opsin expression. They include
    LCR-only deletions, larger deletions removing regulatory and coding sequence, coding variants in a single
    residual or hybrid gene or in multiple expressed genes, and splice-disrupting exon 3 haplotypes. Cys203Arg
    is recurrent; Arg247Ter, Pro307Leu and functionally tested Met273Lys are additional examples. Array collapse
    followed by point mutation is one route, not a requirement for all BCM genotypes.
  genes:
  - preferred_term: OPN1LW
    term:
      id: hgnc:9936
      label: OPN1LW
  - preferred_term: OPN1MW
    term:
      id: hgnc:4206
      label: OPN1MW
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Failure of Locus Control Region-Driven Opsin Expression
    description: >-
      For LCR-deletion genotypes, removal of the enhancer impairs expression from retained target genes.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:1524826
      reference_title: >-
        A locus control region adjacent to the human red and green visual pigment
        genes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        a region between 3.1 kb and 3.7 kb 5' of the red pigment gene transcription
        initiation site is essential for expression
      explanation: >-
        Transgenic-mouse mapping of the enhancer whose deletion causes the disease.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
  - target: Exon 3 Haplotype-Dependent Opsin Missplicing
    description: >-
      Splice-disrupting exon 3 haplotypes impair opsin transcript processing.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35743313
      reference_title: Novel OPN1LW/OPN1MW Exon 3 Haplotype-Associated Splicing Defect in Patients with X-Linked Cone Dysfunction.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: >-
        Applying minigene assays for all observed exon 3 haplotypes in the patients, we demonstrated that the
        novel exon 3 haplotype L-I-V-V-A induces a strong but incomplete splicing defect with 3-5% of residual
        correctly spliced transcripts.
      explanation: >-
        Minigene assays establish incomplete exon 3 splicing for LIVVA.
      quote_role: PRIMARY_RESULT
  - target: Absent or Non-Functional L and M Cone Photopigment
    description: >-
      Coding alleles can directly impair photopigment function; Met273Lys is supported by recombinant protein
      testing.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30065301
      reference_title: 'Genotype determination of the OPN1LW/OPN1MW genes: novel disease-causing mechanisms in Japanese patients with blue cone monochromacy.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: >-
        The analysis of the recombinant proteins of M273K mutants revealed that the opsin with the M273K mutation
        was significantly detectable in the Western blot and cultured cells (Supplementary Fig. S2) but showed
        no absorbance at any of the wavelengths tested after reconstitution with 11-cis-retinal (Fig. 3C).
      explanation: >-
        Recombinant protein experiments demonstrate loss of pigment absorption for Met273Lys.
      quote_role: PRIMARY_RESULT
  evidence:

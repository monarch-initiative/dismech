genetic:
- name: OPN1LW/OPN1MW opsin gene array
  association: Genetic Mutation
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: OPN1LW
    term:
      id: hgnc:9936
      label: OPN1LW
  inheritance:
  - name: X-linked recessive
  notes: >-
    OPN1LW and OPN1MW form a highly homologous tandem array at Xq28. BCM requires a configuration causing severe
    impairment of both L- and M-cone pathways, not necessarily two separate coding mutations. Regulatory deletion,
    recombination, gene conversion, coding loss and missplicing are alternative routes. Interpretation requires
    the position and function of expressed copies; a variant in one copy can instead cause an overlapping colour-vision
    or cone-dysfunction phenotype.
  evidence:
  - reference: PMID:26153062
    reference_title: >-
      High-resolution microarray analysis unravels complex Xq28 aberrations in
      patients and carriers affected by X-linked blue cone monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Blue cone monochromacy (BCM) is an X-linked condition caused by a
      loss-of-function of both the OPN1LW and OPN1MW opsin genes.
    explanation: >-
      States the two-gene loss-of-function requirement.
    directness: DIRECT
    quote_role: BACKGROUND
  - reference: PMID:26153062
    reference_title: >-
      High-resolution microarray analysis unravels complex Xq28 aberrations in
      patients and carriers affected by X-linked blue cone monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cone opsin gene cluster is composed of 2-9 paralogs with 99.8% sequence
      homology and is susceptible to deletions, duplications, and mutations.
    explanation: >-
      Explains the locus architecture that makes recurrent rearrangement the
      dominant mutational mechanism.
    directness: DIRECT
    quote_role: BACKGROUND

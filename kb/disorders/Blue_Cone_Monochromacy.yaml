      photoreceptors that function in a partially desensitized manner in a daylight
      environment
    explanation: >-
      States precisely which photoreceptor populations carry residual photopic
      vision.
  - reference: PMID:15094734
    reference_title: >-
      Blue cone monochromatism: a phenotype and genotype assessment with evidence of

experimental_models:
- name: Opsin exon 3 minigene splicing assays
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: HEK293 and WERI-Rb1 retinoblastoma cells
  publication: PMID:35743313
  description: >-
    Minigenes compare exon 3 haplotypes in HEK293 and a cone-like retinoblastoma cell line; the assays show
    similar relative splice defects in both systems.
  modeled_mechanisms:
  - target: Exon 3 Haplotype-Dependent Opsin Missplicing
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      LIVVA retains approximately 3-5% correctly spliced transcript, whereas LIAVA has no detectable correctly
      spliced product in these assays.
    limitations: >-
      Engineered minigenes and tumor-derived cells do not reproduce the complete endogenous opsin array, retinal
      maturation or clinical course.
    evidence:
    - reference: PMID:35743313
      reference_title: Novel OPN1LW/OPN1MW Exon 3 Haplotype-Associated Splicing Defect in Patients with X-Linked Cone Dysfunction.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: >-
        Applying minigene assays for all observed exon 3 haplotypes in the patients, we demonstrated that the
        novel exon 3 haplotype L-I-V-V-A induces a strong but incomplete splicing defect with 3-5% of residual
        correctly spliced transcripts.
      explanation: >-
        Minigene assays establish incomplete exon 3 splicing for LIVVA.
      quote_role: PRIMARY_RESULT

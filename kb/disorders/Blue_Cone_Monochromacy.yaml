disease_term:
  preferred_term: Blue Cone Monochromacy
  term:
    id: MONDO:0010563
    label: blue cone monochromacy
description: >-
  Blue cone monochromacy (BCM) is an X-linked cone dysfunction disorder caused by pathogenic configurations
  of the OPN1LW/OPN1MW opsin gene array on Xq28. Long- and middle-wavelength-sensitive cone function is absent
  or severely impaired, with vision predominantly mediated by S cones and rods. Disease mechanisms include
  deletions of the upstream locus control region (LCR), deletions of coding sequence, inactivating variants
  in single or multiple expressed opsin genes, and exon 3 haplotypes that cause aberrant splicing. Typical
  findings include reduced visual acuity, severe colour discrimination defects, infantile nystagmus, photophobia
  and myopia. S-cone function does not imply normal blue-yellow colour discrimination. Milder exon 3-associated
  phenotypes overlap with other opsin-related cone disorders. Foveal hypoplasia and macular structural abnormalities
  occur; progression varies among individuals and measures. Management supports vision and photophobia, while
  opsin gene augmentation remains investigational.
inheritance:
- name: X-linked recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    Most affected individuals are hemizygous males, with usually clinically unaffected carrier females. Rare
    affected females have been reported with markedly skewed X-inactivation in blood and buccal samples; those
    measurements do not establish retinal X-inactivation. De novo rearrangements occur, so absence of family
    history does not exclude BCM.
  evidence:
  - reference: PMID:22998501
    reference_title: Blue cone monochromatism in a female due to skewed X-inactivation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Blue cone monochromatism (BCM) is a rare cone dystrophy with recessive
      X-linked inheritance and therefore diagnosed in males whereas females are
      clinically unaffected.
    explanation: >-
      States the inheritance mode and the sex distribution it produces.
    quote_role: BACKGROUND
    directness: DIRECT
  - reference: PMID:22998501
    reference_title: Blue cone monochromatism in a female due to skewed X-inactivation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT

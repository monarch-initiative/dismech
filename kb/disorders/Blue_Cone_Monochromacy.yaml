- name: Failure of Locus Control Region-Driven Opsin Expression
  biological_scale: MOLECULAR
  description: >-
    Deletion of the upstream LCR removes an enhancer required for expression of the adjacent L/M opsin genes.
    LCR-only deletions can silence otherwise retained coding genes, whereas many larger deletions also remove
    part or all of those genes. Transgenic studies support competition between opsin promoters for LCR interaction.
    A 358-bp critical interval was inferred by patient deletion mapping, not established as an isolated minimal
    enhancer by a functional deletion assay.
  biological_processes:

discussions:
- discussion_id: bcm_stationary_versus_progressive
  kind: CONTROVERSY
  prompt: >-
    Is blue cone monochromacy a stationary cone dysfunction syndrome or a slowly
    progressive dystrophy, and how much of the disagreement is explained by genotype
    rather than by measurement sensitivity?
  attaches_to:
  - pathophysiology#Variable Foveal Cone Loss and Macular Degeneration
  - phenotypes#Progressive Loss of Cone Function
  rationale: >-
    Some families show clinical decline and macular atrophy, while other measurements remain stable over years.
    Cross-sectional age associations and genotype comparisons do not establish individual longitudinal rates.
    Quantifying change requires repeated genotype-resolved OCT and functional measures; human treatability
    cannot be read directly from mouse age or presence of non-waveguiding cells.
  proposed_experiments:
  - experiment_id: bcm_longitudinal_genotype_stratified_aoslo
    name: Longitudinal genotype-stratified AOSLO and microperimetry cohort
    description: >-
      Follow genetically resolved cohorts with repeated OCT, adaptive-optics imaging where feasible and cone-specific
      functional testing. Estimate within-person rates and measurement repeatability separately for deletion,
      coding and splice-associated genotypes.
  evidence:
  - reference: PMID:15094734
    reference_title: >-
      Blue cone monochromatism: a phenotype and genotype assessment with evidence of
      progressive loss of cone function in older individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In two families, psychophysical testing demonstrated evidence for progression
      of disease.
    explanation: >-
      Evidence for the progressive side of the question.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:10982039
    reference_title: >-
      Spectrum of color gene deletions and phenotype in patients with blue cone
      monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progressive macular atrophy was observed in affected members of two BCM
      families while the rest of the families presented with normal fundus.
    explanation: >-
      Shows that progression is a subset finding, which is the other side of the
      controversy.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:30516820
    reference_title: Blue Cone Monochromacy Caused by the C203R Missense Mutation or Large Deletion Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Patients with the C203R mutation, however, had decades-longer persistence of foveal photoreceptor outer
      nuclear layer thickness and a slower rate of development of inner segment/outer segment defects than
      did patients with large deletion mutations.
    explanation: >-
      The retrospective 34-patient structural comparison supports genotype-associated differences; it does
      not predict an individual treatment window.
    quote_role: PRIMARY_RESULT
- discussion_id: bcm_genotype_phenotype_correlation
  kind: OPEN_QUESTION
  prompt: >-
    Does genotype at the opsin array predict the clinical phenotype, given that one
    series found no genotype-phenotype association while later structural work found
    deletion genotypes progress faster than Cys203Arg?
  attaches_to:
  - pathophysiology#Loss of Function of the OPN1LW/OPN1MW Opsin Gene Array
  rationale: >-
    Clinical severity, residual function and structural progression are different outcomes. The 2018 deletion/Cys203Arg
    comparison found a structural association, while exon 3 cohorts show milder average acuity and ERG abnormalities.
    Small cohorts, related patients and incomplete longitudinal data limit patient-specific prediction.
  evidence:
  - reference: PMID:10982039
    reference_title: >-
      Spectrum of color gene deletions and phenotype in patients with blue cone
      monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No association was observed between the phenotypes and genotypes in these
      families.
    explanation: >-
      The negative cross-sectional finding.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:30516820
    reference_title: Blue Cone Monochromacy Caused by the C203R Missense Mutation or Large Deletion Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Patients with the C203R mutation, however, had decades-longer persistence of foveal photoreceptor outer
      nuclear layer thickness and a slower rate of development of inner segment/outer segment defects than
      did patients with large deletion mutations.
    explanation: >-
      The retrospective 34-patient structural comparison supports genotype-associated differences; it does
      not predict an individual treatment window.
    quote_role: PRIMARY_RESULT
  - reference: PMID:35400991
    reference_title: Relatively mild blue cone monochromacy phenotype caused by various haplotypes in the L- and M-cone opsin genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Analysis of the clinical data revealed better best-corrected visual acuity, more severe myopia, and higher
      30-Hz cone flicker responses in the patients with exon 3 haplotypes than in those with typical BCM.
    explanation: >-
      The clinical cohort supports a milder average phenotype with important overlap.
    quote_role: PRIMARY_RESULT
- discussion_id: bcm_gpr143_blended_phenotype
  kind: OPEN_QUESTION
  prompt: Does concomitant GPR143 variation explain the phenotype in the reported opsin-variant family?
  attaches_to:
  - phenotypes#Foveal Hypoplasia
  rationale: >-
    One family had GPR143 splice variation, OPN1MW Cys203Arg and OPN1LW Ser143Pro, which the authors classified
    as a variant of uncertain significance. The report proposes a combined effect but lacks functional resolution
    of the individual contributions. Foveal hypoplasia also occurs in BCM cohorts without an established GPR143
    diagnosis, so it is not evidence of a general modifier requirement.
  evidence:
  - reference: PMID:34445325
    reference_title: >-
      Blue Cone Monochromatism with Foveal Hypoplasia Caused by the Concomitant
      Effect of Variants in OPN1LW/OPN1MW and GPR143 Genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To our knowledge, this is the first case of foveal hypoplasia in a BCM patient
      and of mild clinical affection in a female carrier caused by the concomitant
      effect of variants in OPN1LW/OPN1MW and GPR143 genes, thus as the result of the
      simultaneous action of two independent genetic defects.
    explanation: >-
      The authors propose a combined phenotype in one family. This supports discussion of a possible blended
      diagnosis, not an established general GPR143 modifier effect.
    directness: INDIRECT
  - reference: PMID:36186895
    reference_title: Comparing Retinal Structure in Patients with Achromatopsia and Blue Cone Monochromacy Using OCT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Sixty-two of the total 89 ACHM patients (70%) had foveal hypoplasia, compared with 11 of 33 BCM patients
      (33%).
    explanation: >-
      The full-text OCT cohort documents foveal hypoplasia in BCM as well as ACHM.
    quote_role: PRIMARY_RESULT
  - reference: PMID:34445325
    reference_title: Blue Cone Monochromatism with Foveal Hypoplasia Caused by the Concomitant Effect of Variants in OPN1LW/OPN1MW and GPR143 Genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Indeed, though the novel mutation of the OPN1LW gene identified in this patient has been classified as
      a VUS, its disease causative role can be sustained by the following findings: the variant was not found
      in any queried public database; it is in a hemizygous state, inherited by the mother showing mild clinical
      sign of the disease and determining a full phenotype only in the proband in line with the X-linked transmission
      of the disease; it affects a highly conserved amino acid of the protein across species (Figure 7); and
      the presence of the common missense mutation c.607T > C (p.Cys203Arg) in the OPN1MW gene.
    explanation: >-
      The full text explicitly classifies the OPN1LW variant as uncertain despite the authors’ pathogenicity
      hypothesis.
    quote_role: PRIMARY_RESULT
notes: >-
  BCM overlaps clinically with achromatopsia and other opsin-related cone disorders but has a distinct X-linked
  opsin-array basis. Molecular interpretation must account for regulatory sequence, copy number, gene position
  and haplotypes. Residual S-cone function, foveal morphology and non-waveguiding cells each provide different
  information and are not interchangeable measures of normal colour vision or therapeutic potential.

  association: Genetic Mutation
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: OPN1LW
    term:
      id: hgnc:9936
      label: OPN1LW
  inheritance:
  - name: X-linked recessive
  notes: >-
    LCR deletion is a regulatory variant class. Among 42 distinct structural variants in the 2022 study, about
    90% involved the LCR; many also deleted coding sequence, while some pathogenic structural variants retained
    the LCR. Thus the denominator is distinct structural variants, not all BCM families. Deletion mapping inferred

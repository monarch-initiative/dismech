name: Blue Cone Monochromacy
creation_date: "2026-08-15T00:00:00Z"
category: Mendelian
parents:
- Cone dysfunction syndrome
- Inherited retinal disease
synonyms:
- BCM
- blue cone monochromatism
- S cone monochromacy
- S cone monochromatism
- X-linked incomplete achromatopsia
- X-chromosome-linked achromatopsia
disease_term:
  preferred_term: Blue Cone Monochromacy
  term:
    id: MONDO:0010563
    label: blue cone monochromacy
description: >-
  Blue cone monochromacy is an X-linked recessive cone dysfunction syndrome in
  which the long-wavelength (L, "red") and middle-wavelength (M, "green") cone
  photoreceptors are non-functional while short-wavelength (S, "blue") cones and
  rods are preserved. The lesion is at the OPN1LW/OPN1MW opsin gene array on
  Xq28, and its architecture is what makes the disease unusual: the two opsin
  genes sit head-to-tail with more than 98% sequence identity, and a single
  upstream locus control region (LCR) loops to one promoter at a time to enforce
  mutually exclusive expression of one opsin per cone. Because one LCR governs
  both genes, a single regulatory deletion silences the whole array — so a
  disorder that would otherwise require two independent hits is reachable in one
  step. The two commonest routes are exactly these: deletion of the LCR, and
  unequal crossing-over that collapses the array to a single gene which then
  carries the recurrent inactivating Cys203Arg substitution.

  Clinically this produces reduced but not absent visual acuity (roughly 20/60 to
  20/200), pendular nystagmus, photophobia, myopia, and colour discrimination
  that fails on the protan and deutan axes while retaining tritan discrimination
  — the preserved blue-yellow axis being the finding that separates it from
  complete achromatopsia at the bedside. The disorder was long taught as
  stationary, and the honest position is that this is only partly true: several
  families show psychophysical and structural progression, and progression rate
  tracks genotype, with large deletions degenerating faster than Cys203Arg. That
  genotype-dependence is not a curiosity but the central problem for the
  gene-therapy programmes now developing outcome measures for this disease, since
  it determines how wide the treatment window is and for whom.
inheritance:
- name: X-linked recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    Affected individuals are essentially all hemizygous males. Carrier females are
    usually clinically unaffected but are not biologically silent — see the carrier
    node in pathophysiology — and completely skewed X-inactivation can produce a
    manifesting female.
  evidence:
  - reference: PMID:22998501
    reference_title: Blue cone monochromatism in a female due to skewed X-inactivation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Blue cone monochromatism (BCM) is a rare cone dystrophy with recessive
      X-linked inheritance and therefore diagnosed in males whereas females are
      clinically unaffected.
    explanation: >-
      States the inheritance mode and the sex distribution it produces.

    quote_role: PRIMARY_RESULT
  - reference: PMID:29940872
    reference_title: 'A 73,128 bp de novo deletion encompassing the OPN1LW/OPN1MW gene cluster in sporadic Blue Cone Monochromacy: a case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

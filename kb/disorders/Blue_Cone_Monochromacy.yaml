    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected males were shown to fail the protan and deutan axes, but retained
      good discrimination on the tritan axis of the MR test, a compelling evidence
      for residual colour vision in BCM.
    explanation: >-
      The psychophysical signature of preserved S-cone function.
  - reference: PMID:25909963
    reference_title: >-
      Blue cone monochromacy: visual function and efficacy outcome measures for
      clinical trials.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BCM rods continue to signal vision under conditions normally associated with
      daylight vision.
    explanation: >-
      Direct psychophysical demonstration that rods are carrying photopic vision,
      which is the claim this node makes.
  - reference: PMID:25909963
    reference_title: >-
      Blue cone monochromacy: visual function and efficacy outcome measures for
      clinical trials.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Short-wavelength (S-) sensitive cone function was normal or near normal in most
      patients.
    explanation: >-
      Confirms S-cone sparing quantitatively rather than by inference from the
      genotype.
- name: Carrier Female Cone Mosaic Disruption
  biological_scale: TISSUE
  description: >-
    Carrier females are described as unaffected, but they are not unaffected at the
    level of the retina. Random X-inactivation means roughly half of the cones fated
    to express L or M opsin instead express nothing, and imaging those retinas shows
    reduced cone density and disrupted mosaic organization relative to normal
    trichromats — evidence that opsin-null cones degenerate early rather than
    persisting silently. This is the cleanest natural experiment supporting the
    structural role of opsin asserted in the parent node, and it is the mechanism
    behind the rare manifesting female, in whom X-inactivation is completely skewed
    rather than random.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  evidence:
  - reference: PMID:20638402
    reference_title: >-
      Deletion of the X-linked opsin gene array locus control region (LCR) results
      in disruption of the cone mosaic.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On average, they had cone mosaics with reduced density and disrupted
      organization compared to normal trichromats.
    explanation: >-
      The imaging result in LCR-deletion carrier females.
  - reference: PMID:20638402
    reference_title: >-
      Deletion of the X-linked opsin gene array locus control region (LCR) results
      in disruption of the cone mosaic.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This suggests that the absence of opsin in a subset of cones results in their
      early degeneration, with X-inactivation the likely mechanism underlying
      phenotypic variability in BCM carriers.
    explanation: >-
      States both the degeneration inference and the X-inactivation mechanism.
  - reference: PMID:22998501
    reference_title: Blue cone monochromatism in a female due to skewed X-inactivation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis was genetically verified with the identification of one single
      red-green OPN1LW/MW hybrid gene harboring a point mutation c.607C>G,
      p.Cys203Arg that associates with BCM and in addition a completely biased
      X-inactivation in DNA isolated from full blood and buccal mucosa.
    explanation: >-
      Documents the completely skewed X-inactivation behind a manifesting female.

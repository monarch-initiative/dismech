  evidence:
  - reference: PMID:35759666
    reference_title: >-
      The landscape of submicroscopic structural variants at the OPN1LW/OPN1MW gene
      cluster on Xq28 underlying blue cone monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, 90% of SVs encompass the upstream locus control region, an essential
      enhancer element. Its minimal functional extent based on deletion mapping in
      patients was refined to 358 bp.
    explanation: >-
      Quantifies how often the enhancer is involved and gives the patient-derived
      minimal functional extent.
    directness: DIRECT
    quote_role: PRIMARY_RESULT

  - reference: PMID:36301530
    reference_title: Foveal Cone Structure in Patients With Blue Cone Monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mean total cone density for Cys203Arg patients was 16,664 ± 11,513 cones/mm2
      (n = 10), which is, on average, around 40% of normal.
    explanation: >-
      Quantifies the residual foveal cone population by adaptive-optics imaging.
  - reference: PMID:36301530
    reference_title: Foveal Cone Structure in Patients With Blue Cone Monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Waveguiding cone density was 2073 ± 963 cones/mm2 (n = 9), which was consistent
      with published histological estimates of S-cone density in the normal eye.
    explanation: >-
      The load-bearing observation for this node: the cones that still waveguide are
      about as numerous as normal S cones, so the surviving L/M cones are present but
      optically silent rather than merely reduced in number.
- name: Vision Mediated by Preserved S Cones and Rods
  biological_scale: TISSUE
  description: >-
    What is left, and why the phenotype is what it is. S cones (OPN1SW, on
    chromosome 7) and rods are genetically untouched, so daylight vision is carried
    by the S-cone population — only a few percent of all cones, sparse in the fovea
    — together with rods operating partially desensitized in photopic conditions.
    That residual system explains the clinical picture directly: acuity is reduced
    but far from absent, colour discrimination survives on the tritan axis while
    failing on protan and deutan axes, and night vision is typically healthy. It is
    also the finding that separates this disorder from complete achromatopsia, where
    all cone signal is extinguished.
  cell_types:
  - preferred_term: S cone cell
    term:
      id: CL:0003050
      label: S cone cell
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  biological_processes:
  - preferred_term: visual perception
    term:
      id: GO:0007601
      label: visual perception
    modifier: ABNORMAL
  evidence:
  - reference: PMID:39408969
    reference_title: >-
      Evaluation of Retinal Structure and Visual Function in Blue Cone Monochromacy
      to Develop Clinical Endpoints for L-opsin Gene Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most BCM patients have healthy night vision mediated by functioning rod
      photoreceptors.
    explanation: >-
      Establishes preserved rod-mediated scotopic vision.
  - reference: PMID:39408969
    reference_title: >-
      Evaluation of Retinal Structure and Visual Function in Blue Cone Monochromacy
      to Develop Clinical Endpoints for L-opsin Gene Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

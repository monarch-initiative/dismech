  evidence:
  - reference: PMID:35759666
    reference_title: >-
      The landscape of submicroscopic structural variants at the OPN1LW/OPN1MW gene
      cluster on Xq28 underlying blue cone monochromacy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

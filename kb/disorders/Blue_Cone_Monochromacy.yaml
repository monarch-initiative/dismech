  diagnostic: true
  description: >-
    Colour discrimination fails on the protan and deutan axes while tritan
    (blue-yellow) discrimination is retained. The retained axis is the
    diagnostically load-bearing part: it reflects surviving S-cone function and is
    what distinguishes this disorder from complete achromatopsia at the bedside.
  phenotype_term:
    preferred_term: Color vision defect
    term:
      id: HP:0000551
      label: Color vision defect
  evidence:
  - reference: PMID:15094734
    reference_title: >-
      Blue cone monochromatism: a phenotype and genotype assessment with evidence of
      progressive loss of cone function in older individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected males were shown to fail the protan and deutan axes, but retained
      good discrimination on the tritan axis of the MR test, a compelling evidence
      for residual colour vision in BCM.
    explanation: >-
      Directly reports the axis-selective pattern.
  - reference: PMID:39408969
    reference_title: >-
      Evaluation of Retinal Structure and Visual Function in Blue Cone Monochromacy
      to Develop Clinical Endpoints for L-opsin Gene Therapy.
    supports: SUPPORT

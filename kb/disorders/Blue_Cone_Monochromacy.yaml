    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Outer retinal changes were detectable by OCT with an age-related effect on
      the foveal disease stage.
    explanation: >-
      Supports an age-related structural component rather than a purely stationary
      disorder.
  - reference: PMID:39408969
    reference_title: >-

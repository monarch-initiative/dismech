    absent functional L/M photopigment. Cys203Arg can cause misfolding and reduced opsin abundance; in mouse
    retina its equivalent C198R protein is undetectable or greatly reduced without the aggregates seen in transfected
    cells. Met273Lys recombinant opsin lacks normal absorption after reconstitution with retinal. The effects
    of different coding alleles should not be assumed to share a single toxic-aggregation mechanism.

      cone function are absent.
    explanation: >-
      States the human genotype-phenotype relationship this node encodes.
    directness: DIRECT
    quote_role: BACKGROUND
  - reference: PMID:11773636
    reference_title: >-
      Role of a locus control region in the mutually exclusive expression of human
      red and green cone pigment genes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The results support a model in which the mutually exclusive expression of
      these genes in their respective cone types is controlled by competition
      between visual pigment promoters for pairing with the LCR
    explanation: >-
      Gives the regulatory model — one LCR shared by both promoters — that makes a
      single deletion sufficient.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: DOI:10.1126/science.2788922
    reference_title: >-
      Molecular Genetics of Human Blue Cone Monochromacy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These deletions define a 579-base pair region that is located 4 kilobases
      upstream of the red pigment gene and 43 kilobases upstream of the nearest green
      pigment gene; this 579-base pair region is essential for the activity of both
      pigment genes.
    explanation: >-
      The founding observation: patient deletions themselves delimited the essential
      shared regulatory element, before it was called a locus control region.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  notes: >-
    The LCR is a cis-regulatory DNA element acting on OPN1LW/OPN1MW; the encoded opsins are photoreceptors,
    not transcription factors.
- name: Exon 3 Haplotype-Dependent Opsin Missplicing
  description: >-
    Specific combinations of common exon 3 variants cause exon skipping. LIAVA minigenes show essentially complete
    loss of correctly spliced product, while LIVVA and other haplotypes retain variable amounts. Exon 3 skipping
    changes the reading frame and introduces a premature stop; nonsense-mediated decay is a proposed consequence.
    Assays using cDNA distinguish splicing from protein effects: LIAVA protein remains functional in mice,
    whereas LVAVA has additional protein-level defects in an overlapping cone dystrophy spectrum. Clinical
    severity depends on the other expressed opsin copies and promoter context.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:35743313
    reference_title: Novel OPN1LW/OPN1MW Exon 3 Haplotype-Associated Splicing Defect in Patients with X-Linked Cone Dysfunction.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Applying minigene assays for all observed exon 3 haplotypes in the patients, we demonstrated that the
      novel exon 3 haplotype L-I-V-V-A induces a strong but incomplete splicing defect with 3-5% of residual
      correctly spliced transcripts.
    explanation: >-
      Minigene assays establish incomplete exon 3 splicing for LIVVA.
    quote_role: PRIMARY_RESULT
  - reference: PMID:28516000
    reference_title: Role of a Dual Splicing and Amino Acid Code in Myopia, Cone Dysfunction and Cone Dystrophy Associated with L/M Opsin Interchange Mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      The only major RT-PCR product detected in the assay using a minigene derived from this subject's OPN1LWLIAVA
      gene lacked exon 3 and had exon 2 spliced directly to exon 4, introducing a frame shift and a premature
      translation termination codon seven codons past the exon 2/exon 4 splice junction.
    explanation: >-
      The LIAVA minigene yields exon 3 skipping and a premature termination codon; decay itself was inferred.
    quote_role: PRIMARY_RESULT
  downstream:

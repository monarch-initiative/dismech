    retrospective series compared 21 deletion and 13 Cys203Arg cases and found greater preservation of foveal
    structure in the latter group. Cross-sectional age associations must be distinguished from longitudinal
    change. In a 2024 cohort, seven patients had serial OCT over a median 6.5 years with variable structural
    changes; quantitative outer nuclear layer thickness showed no change, and the two patients with repeated
    adaptive-optics images had stable mosaics. Progression is neither absent in all BCM nor uniform across
    patients.

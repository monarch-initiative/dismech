animal_models:
- name: Hdac8-null mouse
  species: Mouse
  genotype: Hdac8 global knockout
  publication: PMID:19605684
  description: >-
    Global deletion of Hdac8 in mouse is perinatally lethal from skull instability. The
    model established HDAC8 as a repressor of cranial neural crest patterning genes and
    is the source of the only mechanistic account of how the transcriptional defect
    reaches a specific tissue.
  modeled_mechanisms:
  - target: Derepression of Cranial Neural Crest Patterning Genes
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      The model is where this node comes from: loss of Hdac8 derepresses Otx2 and Lhx1
      in cranial neural crest.
    limitations: >-
      A constitutive null, whereas most human alleles are missense with residual protein,
      and it carries no X-inactivation mosaicism, which is the dominant determinant of
      severity in the heterozygous females who make up most human cases.
    evidence:
    - reference: PMID:19605684
      reference_title: "Epigenetic control of skull morphogenesis by histone deacetylase 8."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Hdac8 specifically represses the aberrant expression of homeobox transcription factors such as Otx2 and Lhx1."
      explanation: >-
        Supports treating this model as informative for the transcriptional-derepression
        node, since the derepression is what the model measures.
  - target: Disrupted Embryonic Growth and Patterning
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Reproduces the craniofacial arm of the phenotype and nothing else.
    limitations: >-
      Perinatal lethality from skull instability is not the human phenotype, which is a
      dysmorphic but viable skull. The growth, limb, gastrointestinal, behavioural and
      cognitive features of human CdLS5 cannot be assessed in an animal that does not
      survive, so the model speaks to one of several affected systems.
    evidence:
    - reference: PMID:19605684
      reference_title: "Epigenetic control of skull morphogenesis by histone deacetylase 8."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Global deletion of Hdac8 in mice leads to perinatal lethality due to skull instability, and this is phenocopied by conditional deletion of Hdac8 in cranial neural crest cells."
      explanation: >-
        Reports the organism-level phenotype and its severity, which is the basis for
        grading this link PARTIALLY_RECAPITULATES with LOW fidelity.
- name: Cranial neural crest conditional Hdac8 knockout mouse
  species: Mouse
  genotype: Cranial neural crest-specific conditional Hdac8 deletion
  publication: PMID:19605684
  description: >-
    Deleting Hdac8 only in cranial neural crest phenocopies the global knockout's skull
    defect. This is the experiment that localises the pathogenesis to that cell
    population rather than to the developing bone.
  modeled_mechanisms:
  - target: Derepression of Cranial Neural Crest Patterning Genes
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      A cell-type-restricted perturbation used to assign the skull phenotype to cranial
      neural crest.
    limitations: >-
      A conditional null in one lineage answers where, not how much: it says nothing
      about the graded, partial loss of function produced by human missense alleles, and
      nothing about the other affected organ systems.
    evidence:
    - reference: PMID:19605684
      reference_title: "Epigenetic control of skull morphogenesis by histone deacetylase 8."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Global deletion of Hdac8 in mice leads to perinatal lethality due to skull instability, and this is phenocopied by conditional deletion of Hdac8 in cranial neural crest cells."
      explanation: >-
        The phenocopy result is what makes this a lineage-assignment experiment.

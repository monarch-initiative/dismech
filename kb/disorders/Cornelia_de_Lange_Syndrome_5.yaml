- name: Genetic Counseling
  description: >-
    Counselling here has to carry the X-linked pattern and its consequences: a
    heterozygous mother transmits with 50% probability in each pregnancy, male sibs who
    inherit will be affected, an affected father transmits to all daughters and no sons,
    and a carrier female's severity depends on X-inactivation and so cannot be predicted
    from the variant alone.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301283
    reference_title: "Cornelia de Lange Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "If the mother of the proband has an SMC1A or HDAC8 pathogenic variant, the chance of transmitting it in each pregnancy is 50%."
    explanation: >-
      Gives the transmission risk that counselling has to communicate for this gene.
  - reference: PMID:20301283
    reference_title: "Cornelia de Lange Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "If the father of the proband has an SMC1A or HDAC8 pathogenic variant, he will transmit it to all his daughters and none of his sons."
    explanation: >-
      The paternal transmission pattern, which differs from the autosomal dominant CdLS
      genes and is the part most often got wrong.
  - reference: PMID:26671848
    reference_title: "Expanding the clinical spectrum of the 'HDAC8-phenotype' - implications for molecular diagnostics, counseling and risk prediction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our cohort also includes two affected siblings whose unaffected mother was found to be mosaic for the causative mutation inherited to both affected children."
    explanation: >-
      Documents parental mosaicism transmitted to two children, which is the reason a
      de novo-appearing variant does not license a low recurrence-risk figure here.
diagnosis:
- name: Molecular genetic testing
  description: >-
    The diagnosis is molecular. HDAC8 is one of the two X-linked CdLS genes, so the
    variant may be hemizygous or heterozygous, and the clinical route to testing is
    often not a suspicion of CdLS at all: in the defining cohort, several individuals
    reached the gene through genomic testing without CdLS having been considered.
  presence: PRESENT
  evidence:
  - reference: PMID:20301283
    reference_title: "Cornelia de Lange Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "DIAGNOSIS/TESTING: The diagnosis of CdLS is established in a proband with suggestive clinical features and/or a heterozygous pathogenic variant in BRD4, MAU2, NIPBL, RAD21, or SMC3 or a hemizygous or heterozygous pathogenic variant in HDAC8 or SMC1A identified by molecular genetic testing."
    explanation: >-
      States the diagnostic criterion and, specifically, that HDAC8 variants may be
      hemizygous or heterozygous.
  - reference: PMID:24403048
    reference_title: "Loss-of-function HDAC8 mutations cause a phenotypic spectrum of Cornelia de Lange syndrome-like features, ocular hypertelorism, large fontanelle and X-linked inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For several individuals, the diagnosis of CdLS was not considered prior to genomic testing."
    explanation: >-
      Establishes that clinical recognition is unreliable for this form, which is the
      reason the diagnostic route is sequencing-first.
- name: X-inactivation studies in heterozygous females
  description: >-
    Skewed X-inactivation in peripheral blood DNA was found in the heterozygous females
    of the defining cohort and is one of the determinants of severity. It is a
    prognostically relevant test rather than a diagnostic one: it does not establish the
    diagnosis, but it bears on how a carrier's phenotype should be interpreted.
  presence: PRESENT
  evidence:
  - reference: PMID:24403048
    reference_title: "Loss-of-function HDAC8 mutations cause a phenotypic spectrum of Cornelia de Lange syndrome-like features, ocular hypertelorism, large fontanelle and X-linked inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Many cases are heterozygous females, each with marked skewing of X-inactivation in peripheral blood DNA."
    explanation: >-
      Records the finding and the tissue in which it was measured, which matters because
      blood skewing need not match the affected tissues.
differential_diagnoses:
- name: NIPBL-related Cornelia de Lange syndrome
  description: >-
    The classic and much commoner form, accounting for the large majority of CdLS with
    typical facies. The mechanistic distinction is the arm of the cohesin cycle that
    fails: NIPBL loads cohesin, HDAC8 licenses its reuse. The two converge on the same
    transcriptional readout, so they cannot be told apart by that; they are separated by
    sequencing, by the discriminating craniofacial features, and by inheritance pattern.
  evidence:
  - reference: PMID:22885700
    reference_title: "HDAC8 mutations in Cornelia de Lange syndrome affect the cohesin acetylation cycle."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cornelia de Lange syndrome (CdLS) is a dominantly inherited congenital malformation disorder, caused by mutations in the cohesin-loading protein NIPBL for nearly 60% of individuals with classical CdLS, and by mutations in the core cohesin components SMC1A (~5%) and SMC3 (<1%) for a smaller fraction of probands."
    explanation: >-
      Gives the relative contribution of the other CdLS genes, which is what makes NIPBL
      the primary differential.
- name: SMC1A-related Cornelia de Lange syndrome
  description: >-
    The other X-linked CdLS gene, and therefore the differential that shares this one's
    inheritance pattern as well as its phenotype. SMC1A is a core ring subunit rather
    than a regulator of the acetylation cycle.
  evidence:
  - reference: PMID:20301283
    reference_title: "Cornelia de Lange Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HDAC8- and SMC1A-CdLS are inherited in an X-linked manner."
    explanation: >-
      Identifies SMC1A as the other X-linked CdLS gene, which is what makes it the
      closest differential on inheritance grounds.
discussions:
- discussion_id: cdls5_transcription_to_phenotype_gap
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Altered Cohesin Occupancy and Transcriptional Dysregulation
  - pathophysiology#Disrupted Embryonic Growth and Patterning
  prompt: >-
    Which developmental programmes are misexpressed by the altered cohesin occupancy,
    and why does that produce this particular set of craniofacial, limb and growth
    anomalies rather than a general developmental failure?
  rationale: >-
    The mechanism is unusually well traced from the enzyme to the chromatin, and then
    largely stops. One branch has been resolved and only in mouse: HDAC8 represses Otx2
    and Lhx1 in cranial neural crest, and losing it derepresses them, which accounts for
    the craniofacial arm. Nothing comparable exists for the growth restriction, the limb,
    cardiac or gastrointestinal anomalies, or the neurobehavioural phenotype. Cohesin
    binds throughout the genome and the transcriptional change is described as a pattern
    rather than as a named set of target genes for those systems, which is why the edge
    from transcriptional dysregulation to the general developmental phenotype stays
    INDIRECT_UNKNOWN_INTERMEDIATES while the neural crest branch is
    INDIRECT_KNOWN_INTERMEDIATES.
- discussion_id: cdls5_structure_function_to_severity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#HDAC8
  prompt: >-
    Can the biochemical consequence of an HDAC8 missense allele predict clinical
    severity?
  rationale: >-
    The structural work has measured catalytic loss and thermostability for many of the
    disease mutants, and there is an obvious temptation to read those numbers as a
    severity predictor. The authors of that work explicitly warn against it, because
    X-inactivation sits between the allele and the phenotype in the heterozygous females
    who make up most reported cases. A structure-to-severity model would need the
    X-inactivation pattern in the affected tissue, which is not what is measured.
  evidence:
  - reference: PMID:33316326
    reference_title: "Structural analysis of histone deacetylase 8 mutants associated with Cornelia de Lange Syndrome spectrum disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Genotype-phenotype relationships for HDAC8 are influenced by several factors, including catalytic activity, thermostability, and X-inactivation, so the influence of structure-function relationships for HDAC8 mutations on clinical phenotypes must be interpreted with caution."
    explanation: >-
      The source's own statement of the caveat, which is what this gap records.
- discussion_id: cdls5_hdac8_activator_rescue
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#HDAC8 Loss of Deacetylase Function
  prompt: >-
    Does small-molecule reactivation of mutant HDAC8 translate into anything clinically
    meaningful?
  rationale: >-
    Several catalytically impaired HDAC8 mutants can be partially or fully reactivated in
    vitro by an N-acylthiourea activator. That is a genuine and unusual therapeutic lead
    for a loss-of-function developmental disorder, and it is also, so far, entirely
    in vitro. The harder question is timing rather than chemistry: the phenotype is
    established in embryogenesis, so it is not clear what postnatal restoration of
    deacetylase activity would be expected to change.
  evidence:
  - reference: PMID:27576763
    reference_title: "Structural aspects of HDAC8 mechanism and dysfunction in Cornelia de Lange syndrome spectrum disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Intriguingly, catalytic activity in many HDAC8 mutants can be partially or fully restored by an N-acylthiourea activator, suggesting a plausible strategy for the chemical rescue of compromised HDAC8 catalysis in vivo."
    explanation: >-
      Records the in vitro rescue result and the authors' own framing of it as a
      strategy rather than a demonstrated treatment.
- discussion_id: cdls5_mouse_skull_translational_validity
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Derepression of Cranial Neural Crest Patterning Genes
  - animal_models#Hdac8-null mouse
  - animal_models#Cranial neural crest conditional Hdac8 knockout mouse
  prompt: >-
    Does the mouse Hdac8-null skull phenotype represent the human CdLS5 craniofacial
    phenotype, or a different consequence of the same lesion?
  rationale: >-
    The evidence is not absent, which is what separates this from the other gaps here: a
    specific transcriptional mechanism has been demonstrated, twice, in a lineage-restricted
    conditional as well as a global knockout. What is uncertain is whether it transfers.
    The mouse phenotype is skull instability severe enough to kill the animal perinatally;
    the human phenotype is a viable, dysmorphic skull with hypertelorism and a late-closing
    fontanelle. Those are not obviously the same defect at different severities, and three
    differences could explain the divergence: the mouse is a constitutive null while most
    human alleles are missense with residual activity, the human females who make up most
    cases are X-inactivation mosaics with no mouse counterpart, and the vertebrate-specific
    skull elements the paper implicates differ between the species. No human cranial neural
    crest experiment has been done, so the translation rests on the plausibility of the
    mechanism rather than on evidence.
  evidence:
  - reference: PMID:19605684
    reference_title: "Epigenetic control of skull morphogenesis by histone deacetylase 8."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings reveal how the identity and patterning of vertebrate-specific portions of the skull are epigenetically controlled by a histone deacetylase."
    explanation: >-
      The authors' own framing, which scopes the result to vertebrate-specific skull
      elements and is the claim whose human transfer is uncertain.

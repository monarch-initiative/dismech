prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population rate has been published for the HDAC8 form specifically. The
    denominator that exists is the share of CdLS attributable to HDAC8: the founding
    report identified six probands, and the first dedicated cohort assembled 38
    individuals. Reported as CASES_IN_LITERATURE for that reason.
  evidence:
  - reference: PMID:24403048
    reference_title: "Loss-of-function HDAC8 mutations cause a phenotypic spectrum of Cornelia de Lange syndrome-like features, ocular hypertelorism, large fontanelle and X-linked inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a cohort of 38 individuals with an emerging spectrum of features caused by HDAC8 mutations."
    explanation: >-
      Gives the size of the largest assembled series, which is the basis for the
      CASES_IN_LITERATURE measure.
inheritance:
- name: X-linked dominant
  inheritance_term:
    preferred_term: X-linked dominant inheritance
    term:
      id: HP:0001423
      label: X-linked dominant inheritance
  description: >-
    Most variants arise de novo. Heterozygous females are affected, with clinical
    features overlapping those of hemizygous males but with severity set largely by the
    X-inactivation pattern; hemizygous males are more severely affected. This is the
    axis along which the disease varies within a family, and it is the reason a mildly
    affected carrier mother can be recognised only after her child is diagnosed.
  evidence:
  - reference: PMID:20301283
    reference_title: "Cornelia de Lange Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Females with a heterozygous HDAC8 pathogenic variant have clinical features overlapping those of hemizygous males, but the severity is greatly influenced by the pattern of X-chromosome inactivation."
    explanation: >-
      The GeneReviews statement of the inheritance mode and of X-inactivation as the
      determinant of severity in heterozygous females.
  - reference: PMID:24403048
    reference_title: "Loss-of-function HDAC8 mutations cause a phenotypic spectrum of Cornelia de Lange syndrome-like features, ocular hypertelorism, large fontanelle and X-linked inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Many cases are heterozygous females, each with marked skewing of X-inactivation in peripheral blood DNA."
    explanation: >-
      Reports the skewing directly in the cohort rather than inferring it from the mode
      of inheritance.
  - reference: PMID:24403048
    reference_title: "Loss-of-function HDAC8 mutations cause a phenotypic spectrum of Cornelia de Lange syndrome-like features, ocular hypertelorism, large fontanelle and X-linked inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also identified eight hemizygous males who are more severely affected."
    explanation: Establishes the greater severity of the hemizygous male phenotype.
  - reference: PMID:26671848
    reference_title: "Expanding the clinical spectrum of the 'HDAC8-phenotype' - implications for molecular diagnostics, counseling and risk prediction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The extensive clinical variability observed in the heterozygous females might be at least partially associated with a completely skewed X-inactivation, observed in seven out of eight female patients."
    explanation: >-
      Puts a denominator on the skewing observation, seven of eight female patients, and
      attributes the clinical variability to it.
genetic:
- name: HDAC8
  gene_term:
    preferred_term: HDAC8
    term:
      id: hgnc:13315
      label: HDAC8
  relationship_type: CAUSATIVE
  presence: PRESENT
  variant_origin: GERMLINE
  notes: >-
    Most reported variants are missense and de novo. Functional testing of the missense
    set found that all of them lose enzymatic activity, so the disease mechanism is
    loss of deacetylase function regardless of where in the fold the substitution sits.
    Structural work adds a second axis: some mutants lose catalysis directly, others
    are destabilised, and the two do not map cleanly onto clinical severity because
    X-inactivation intervenes. A splice-region variant producing leaky aberrant
    splicing has also been reported, which supplies a mechanism for intrafamilial
    variability on top of X-inactivation.
  evidence:
  - reference: PMID:24403048
    reference_title: "Loss-of-function HDAC8 mutations cause a phenotypic spectrum of Cornelia de Lange syndrome-like features, ocular hypertelorism, large fontanelle and X-linked inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HDAC8 encodes the lysine deacetylase for the cohesin subunit SMC3 and analysis of the functional consequences of the missense mutations indicates that all cause a loss of enzymatic function."
    explanation: >-
      Establishes loss of enzymatic function as the shared consequence of the missense
      alleles, which is what makes this a single mechanistic entity.
  - reference: PMID:33316326
    reference_title: "Structural analysis of histone deacetylase 8 mutants associated with Cornelia de Lange Syndrome spectrum disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Consistent with loss of HDAC8 function in cohesin recycling, deacetylase activity and/or thermostability is compromised in most CdLS HDAC8 mutants studied."
    explanation: >-
      Adds the second failure mode, protein destabilisation, alongside direct catalytic
      loss.
  - reference: PMID:42157730
    reference_title: "Aberrant Splicing From an HDAC8 Intronic Variant c.112-15C>A Causes Familial Cornelia de Lange Syndrome in Heterozygous and Hemizygous Individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This aberrant splicing likely results in nonsense-mediated mRNA decay with loss-of-function effects."
    explanation: >-
      Documents a non-coding route to the same loss of function, via aberrant splicing
      and nonsense-mediated decay.
pathophysiology:
- name: HDAC8 Loss of Deacetylase Function
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: HDAC8
      term:
        id: hgnc:13315
        label: HDAC8
    variant_origin: GERMLINE
    allele_type: MISSENSE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Mostly de novo missense alleles, hemizygous in males and heterozygous in females.
      Recorded as LOSS_OF_FUNCTION because every missense allele tested lost enzymatic
      activity; the mechanism is loss of catalysis or of protein stability rather than
      an altered or acquired activity.
  description: >-
    HDAC8 is the vertebrate deacetylase for the cohesin subunit SMC3, a zinc-dependent
    hydrolase acting on the acetyl-lysine mark placed during S phase. The disease
    alleles remove that activity, either by disrupting substrate binding and catalysis
    directly or by destabilising the fold.
  molecular_functions:
  - preferred_term: SMC3 lysine deacetylase activity
    term:
      id: GO:0033558
      label: protein lysine deacetylase activity
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Persistent SMC3 Acetylation
    causal_link_type: DIRECT
    description: >-
      With the deacetylase gone, the S-phase acetyl mark on SMC3 is not removed.
    evidence:
    - reference: PMID:22885700
      reference_title: "HDAC8 mutations in Cornelia de Lange syndrome affect the cohesin acetylation cycle."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Loss of HDAC8 activity results in increased SMC3 acetylation and inefficient dissolution of the ‘used’ cohesin complex released from chromatin in both prophase and anaphase."
      explanation: >-
        States exactly the step this edge asserts: loss of HDAC8 activity raises SMC3
        acetylation.
  evidence:
  - reference: PMID:22885700
    reference_title: "HDAC8 mutations in Cornelia de Lange syndrome affect the cohesin acetylation cycle."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we identify HDAC8 as the vertebrate SMC3 deacetylase, as well as loss-of-function HDAC8 mutations in six CdLS probands."
    explanation: >-
      Identifies the enzyme-substrate relationship and, in the same sentence, ties
      loss-of-function alleles in it to CdLS.
  - reference: PMID:27576763
    reference_title: "Structural aspects of HDAC8 mechanism and dysfunction in Cornelia de Lange syndrome spectrum disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Most CdLS HDAC8 mutations trigger structural changes that directly or indirectly impact substrate binding and catalysis."
    explanation: >-
      Describes how the disease alleles abolish the activity, which is the content of
      this node beyond the gene-disease association.
- name: Persistent SMC3 Acetylation
  biological_scale: MOLECULAR
  description: >-
    SMC3 acetylation is a cell-cycle switch, not a constitutive state: it is written in
    S phase to make chromatin-loaded cohesin cohesive, and erased after the ring is
    released so the subunits can be reused. Losing the eraser converts a switch into a
    one-way mark.
  biological_processes:
  - preferred_term: SMC3 deacetylation
    term:
      id: GO:0006476
      label: protein deacetylation
    modifier: DECREASED
  downstream:
  - target: Failure of Cohesin Recycling
    causal_link_type: DIRECT
    description: >-
      Reversal of the acetyl mark is the step that licenses a released cohesin ring for
      reloading, so its failure blocks recycling.
    evidence:
    - reference: PMID:27072133
      reference_title: "HDAC8 Inhibition Blocks SMC3 Deacetylation and Delays Cell Cycle Progression without Affecting Cohesin-dependent Transcription in MCF7 Cancer Cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Reversal of SMC3 acetylation is imperative for recycling cohesin so that it can be reloaded in interphase for both non-mitotic and mitotic functions."
      explanation: >-
        States the dependency this edge asserts, that recycling requires reversal of the
        acetylation.
  evidence:
  - reference: PMID:27072133
    reference_title: "HDAC8 Inhibition Blocks SMC3 Deacetylation and Delays Cell Cycle Progression without Affecting Cohesin-dependent Transcription in MCF7 Cancer Cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The SMC3 subunit of cohesin is acetylated (ac) during S phase to establish cohesion between replicated chromosomes."
    explanation: >-
      Establishes when and why the mark is written, which is what makes its persistence
      abnormal rather than merely present.
- name: Failure of Cohesin Recycling
  biological_scale: CELLULAR
  description: >-
    The 'used' cohesin complex released from chromatin at prophase and anaphase is not
    dissolved efficiently, and SMC3 that still carries its acetyl mark is nonetheless
    reloaded onto chromatin. The defect is in the reuse cycle rather than in cohesion
    itself.
  cellular_components:
  - preferred_term: cohesin complex
    term:
      id: GO:0008278
      label: cohesin complex
  biological_processes:
  - preferred_term: sister chromatid cohesion
    term:
      id: GO:0007062
      label: sister chromatid cohesion
  downstream:
  - target: Altered Cohesin Occupancy and Transcriptional Dysregulation
    causal_link_type: DIRECT
    description: >-
      Reloading acetylated SMC3 changes where cohesin sits on the genome, and the
      changed occupancy is read out as changed transcription.
    evidence:
    - reference: PMID:22885700
      reference_title: "HDAC8 mutations in Cornelia de Lange syndrome affect the cohesin acetylation cycle."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "SMC3 with retained acetylation is loaded onto chromatin, and chromatin immunoprecipitation sequencing analysis demonstrates decreased occupancy of cohesin localization sites that results in a consistent pattern of altered transcription seen in CdLS cell lines with either NIPBL or HDAC8 mutations."
      explanation: >-
        Traces the whole edge in one sentence, from reloading of acetylated SMC3 through
        reduced occupancy to altered transcription.
  evidence:
  - reference: PMID:22885700
    reference_title: "HDAC8 mutations in Cornelia de Lange syndrome affect the cohesin acetylation cycle."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Loss of HDAC8 activity results in increased SMC3 acetylation and inefficient dissolution of the ‘used’ cohesin complex released from chromatin in both prophase and anaphase."
    explanation: >-
      Names the failing step and the two cell-cycle phases at which it is observed.
- name: Altered Cohesin Occupancy and Transcriptional Dysregulation
  biological_scale: CELLULAR
  description: >-
    Cohesin occupancy at its normal genomic binding sites falls, and the resulting
    transcriptional pattern is shared with NIPBL-mutant CdLS cell lines. This shared
    endpoint is the reason a release-arm lesion and a loading-arm lesion produce
    overlapping diseases, and it is the point at which this entry's mechanism rejoins
    the rest of the cohesinopathy spectrum.
  biological_processes:
  - preferred_term: regulation of DNA-templated transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: DYSREGULATED
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: DYSREGULATED
  downstream:
  - target: Derepression of Cranial Neural Crest Patterning Genes
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The one developmental programme that has been traced. In mouse, HDAC8 represses a
      subset of homeobox transcription factors in cranial neural crest cells, and its
      loss derepresses them. This edge is drawn from mouse data; the corresponding human
      neural crest experiment has not been done.
    evidence:
    - reference: PMID:19605684
      reference_title: "Epigenetic control of skull morphogenesis by histone deacetylase 8."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we provide evidence that Hdac8 specifically controls patterning of the skull by repressing a subset of transcription factors in cranial neural crest cells."
      explanation: >-
        Identifies the specific transcriptional programme HDAC8 controls. Graded INDIRECT
        because it is a mouse result standing in for the human step.
  - target: Disrupted Embryonic Growth and Patterning
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      For everything other than the craniofacial skeleton, the step from a genome-wide
      transcriptional shift to a specific anomaly is not resolved. No study identifies
      the developmental programmes behind the growth, limb, cardiac or neurobehavioural
      features, so those intermediates are recorded as unknown rather than asserted.
    evidence:
    - reference: PMID:33316326
      reference_title: "Structural analysis of histone deacetylase 8 mutants associated with Cornelia de Lange Syndrome spectrum disorders."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "The molecular genetic basis of CdLS is linked to defects in cohesin, a protein complex that functions in sister chromatid cohesion, chromatin organization, and transcriptional regulation."
      explanation: >-
        Supports the link between the cohesin defect and the disease at the level the
        literature actually makes it, which is an association between the molecular
        lesion and the syndrome rather than a traced developmental pathway.
  evidence:
  - reference: PMID:22885700
    reference_title: "HDAC8 mutations in Cornelia de Lange syndrome affect the cohesin acetylation cycle."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SMC3 with retained acetylation is loaded onto chromatin, and chromatin immunoprecipitation sequencing analysis demonstrates decreased occupancy of cohesin localization sites that results in a consistent pattern of altered transcription seen in CdLS cell lines with either NIPBL or HDAC8 mutations."
    explanation: >-
      Documents both halves of the node: reduced occupancy, and a transcriptional
      pattern shared with the NIPBL form.
- name: Derepression of Cranial Neural Crest Patterning Genes
  biological_scale: CELLULAR
  description: >-
    Model-derived, and the only part of the transcription-to-phenotype step that has
    been resolved. In mouse, HDAC8 represses homeobox transcription factors including
    Otx2 and Lhx1 in cranial neural crest cells; deleting Hdac8 derepresses them and
    the skull fails to pattern correctly. Deleting it only in cranial neural crest
    phenocopies the global knockout, which is what localises the lesion to that cell
    population rather than to the skeleton itself. No equivalent human experiment
    exists, so this node describes a mouse mechanism proposed for the human
    craniofacial phenotype.

    On the cell-type binding: CL:0000008 (migratory cranial neural crest cell) was
    considered and not used. The mouse work deletes Hdac8 in the cranial neural crest
    lineage and reads out skull patterning; it does not establish that the affected
    population is specifically the migratory one, so that term would assert a
    developmental stage the source does not.
  cell_types:
  - preferred_term: cranial neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  biological_processes:
  - preferred_term: negative regulation of DNA-templated transcription
    term:
      id: GO:0045892
      label: negative regulation of DNA-templated transcription
    modifier: DECREASED
  - preferred_term: neural crest cell differentiation
    term:
      id: GO:0014033
      label: neural crest cell differentiation
    modifier: DYSREGULATED
  downstream:
  - target: Hypertelorism
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Skull and midface patterning, which is the specific arm the mouse neural crest
      work accounts for. Recorded as INDIRECT_KNOWN_INTERMEDIATES because the
      intermediate, derepression of the homeobox programme, is identified but only in
      mouse.
  - target: Delayed anterior fontanelle closure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Skull and midface patterning, which is the specific arm the mouse neural crest
      work accounts for. Recorded as INDIRECT_KNOWN_INTERMEDIATES because the

  - target: Disrupted Embryonic Growth and Patterning
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      In mouse this produces skull instability severe enough to be perinatally lethal.
      The inference to the human craniofacial phenotype is the translational step, and
      it is recorded as a HUMAN_MODEL_MISMATCH discussion rather than asserted.
    evidence:
    - reference: PMID:19605684
      reference_title: "Epigenetic control of skull morphogenesis by histone deacetylase 8."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Global deletion of Hdac8 in mice leads to perinatal lethality due to skull instability, and this is phenocopied by conditional deletion of Hdac8 in cranial neural crest cells."
      explanation: >-
        Reports both the skull phenotype and the conditional-knockout result that assigns
        it to cranial neural crest. Graded INDIRECT: the human craniofacial phenotype is
        not perinatally lethal skull instability.
  evidence:
  - reference: PMID:19605684
    reference_title: "Epigenetic control of skull morphogenesis by histone deacetylase 8."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Hdac8 specifically represses the aberrant expression of homeobox transcription factors such as Otx2 and Lhx1."
    explanation: >-
      Names the derepressed transcription factors, which is what makes this a mechanism

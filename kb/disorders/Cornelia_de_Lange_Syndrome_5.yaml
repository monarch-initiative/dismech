    Ocular hypertelorism is one of the features that discriminates the HDAC8 form from
    classic CdLS, and it is named in the title of the defining cohort paper.
  phenotype_term:
    preferred_term: Hypertelorism
    term:
      id: HP:0000316
      label: Hypertelorism
  frequency: FREQUENT
  evidence:
  - reference: PMID:24403048
    reference_title: "Loss-of-function HDAC8 mutations cause a phenotypic spectrum of Cornelia de Lange syndrome-like features, ocular hypertelorism, large fontanelle and X-linked inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The craniofacial appearance caused by HDAC8 mutations overlaps that of typical CdLS but often displays delayed anterior fontanelle closure, ocular hypertelorism, hooding of the eyelids, a broader nose and dental anomalies, which may be useful discriminating features."
    explanation: >-
      Lists hypertelorism among the features that distinguish HDAC8-related CdLS from
      the classic form.

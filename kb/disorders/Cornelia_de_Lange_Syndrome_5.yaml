notes: >-
  This entry follows the series precedent already in the repository:
  Cornelia_de_Lange_Syndrome_1.yaml (NIPBL) and Cornelia_de_Lange_Syndrome_4.yaml
  (RAD21) are standalone entries, and the parent Cornelia_de_Lange_Syndrome.yaml carries
  no has_subtypes block at all, naming HDAC8 only in its genetic section. MONDO:0010471
  was unbound anywhere in kb/ before this entry.

  Phenotype baseline. GeneReviews has a CdLS chapter (PMID:20301283) but not an
  HDAC8-specific one, so the shared craniofacial, growth, behavioural and systemic
  phenotypes here are taken from the spectrum chapter and the HDAC8-discriminating
  features from the 38-individual cohort (PMID:24403048). Frequencies for the shared
  features are therefore spectrum-level, not HDAC8-specific, and the descriptions say so
  rather than implying a count that nobody has published.

  No limb phenotypes are curated despite limb abnormality being a defining CdLS feature.
  This was re-examined during review. The deep-research report states that limb reduction
  defects are "typically ABSENT or mild in HDAC8-CdLS", citing PMID:24403048 and
  PMID:30158690. Both are now cached and neither says it: the first names distal limb
  anomalies as a general CdLS feature, and the second says only that HDAC8 and RAD21
  phenotypes "become more variable and sometimes present atypical CdLS features". So the
  report's reason is not supportable from the papers it cites, and this entry does not
  adopt it. The limb omission therefore stands on the weaker but checkable ground it
  stood on before: no cached source gives an HDAC8-specific limb frequency, and the
  spectrum sentence would assert one. Myopia and congenital heart disease, which come
  from the same GeneReviews sentence as three already-curated phenotypes, have now been
  added, so the spectrum-level policy is applied consistently within that sentence.

  Deep research. An openscientist report is committed alongside this entry, with 18 of 18
  citations verified and no confabulated identifiers. It earned its keep twice: it surfaced
  the Hdac8 mouse work (PMID:19605684) that supplies the only resolved step between the
  transcriptional defect and a specific tissue, and it surfaced the HDAC8 cohort paper
  reporting maternal mosaicism (PMID:26671848), which changes what genetic counselling can
  say about recurrence. Its term validation flagged seven label mismatches; on inspection
  those were table-cell contents rather than proposed labels, but it also correctly flagged
  GO:0016575 as obsolete, and that term is not used here. Every snippet in this entry comes
  from the cached reference text rather than from the report.

  The report proposed a DNA-methylation episignature as a diagnostic adjunct
  (PMID:38751117). That is not curated here: the cited paper is about neurodevelopmental
  disorders in general and its cached abstract makes no CdLS5-specific claim, so citing it
  for a CdLS5 episignature would overstate it.

  No datasets block. HDAC8 expression datasets in public repositories are dominated by
  cancer studies, where HDAC8 is an inhibitor target; none concerns this disease. That is
  the gene-symbol Named Entity Confusion case the dataset-curation guidance warns about.

name: Cornelia de Lange Syndrome 5
creation_date: "2026-09-07T18:00:00Z"
category: Mendelian
synonyms:
- CdLS5
- CDLS5
- Cornelia de Lange syndrome 5, X-linked dominant
- HDAC8-related Cornelia de Lange syndrome
- HDAC8-CdLS
description: >-
  Cornelia de Lange syndrome 5 is the X-linked HDAC8-related form of the cohesinopathy
  spectrum. Its interest is that it breaks the cohesinopathy at a different point from
  every other CdLS gene.

  NIPBL, SMC1A, SMC3 and RAD21 are all about getting cohesin onto chromatin or building
  the ring that does it. HDAC8 is about taking cohesin off again. SMC3 is acetylated in
  S phase to lock chromatin-loaded cohesin into a cohesive state, and HDAC8 is the
  vertebrate deacetylase that removes that mark once the ring is released. Without it,
  acetylated SMC3 is recycled back onto chromatin still carrying its acetyl group, and
  the consequence is not a loss of cohesion but a redistribution: cohesin occupancy at
  its normal binding sites falls, and the transcriptional pattern that follows is the
  same one seen in NIPBL-mutant cells. A release-arm lesion and a loading-arm lesion
  converge on the same downstream readout, which is why they produce overlapping
  diseases.

  Two clinical consequences follow from the gene being on the X chromosome. Affected
  females are heterozygous and their severity tracks X-inactivation skewing, so a
  mother and daughter carrying the same variant can differ substantially; hemizygous
  males are more severely affected. And the craniofacial phenotype, while overlapping
  classic CdLS, diverges enough - delayed anterior fontanelle closure, ocular
  hypertelorism, hooded eyelids, a broader nose, dental anomalies - that in the largest
  reported cohort the diagnosis of CdLS had not been considered before genomic testing
  in several individuals.

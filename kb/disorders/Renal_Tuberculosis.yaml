histopathology:
- name: Caseating Granulomatous Inflammation of the Kidney
  description: >-
    Resected or biopsied kidneys show granulomas of epithelioid histiocytes
    and Langhans giant cells with caseous necrosis, together with fibrosis
    and atrophy in long-standing disease. A granuloma with or without
    caseation in urogenital tissue is a definitive diagnostic criterion.
  evidence:
  - reference: PMID:30071831
    reference_title: "Chronic kidney disease with genitourinary tuberculosis: old disease but ongoing complication."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A histological diagnosis of TB was confirmed by identifying caseating
      necrosis, loose aggregates of epithelioid histiocytes and Langerhans
      giant cells in tissue specimens
    explanation: >-
      The histological criteria for tuberculosis in tissue specimens.
  - reference: PMID:28343213
    reference_title: "Gross Hematuria Is More Common in Male and Older Patients with Renal Tuberculosis in China: A Single-Center 15-Year Clinical Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In the postoperative pathological reports, atrophy (35.9%) and fibrosis
      (38.5%) were found to be significantly more common in older patients.
    explanation: >-
      Atrophy and fibrosis in resected tuberculous kidneys.
progression:
- phase: Hematogenous implantation and latency
  notes: >-
    Bacilli implant bilaterally in the renal cortex during bacillemia from a
    pulmonary infection; the non-caseating granulomas heal and become latent.
  evidence:
  - reference: PMID:28540230
    reference_title: "Genital tuberculosis: current status of diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      With the development of immunity, these lesions cicatrize in about 6
      months or so, and a latent phase then ensues.
    explanation: >-
      Describes healing of the implantation lesions and the latent phase.
- phase: Reactivation and unilateral renal tuberculosis
  notes: >-
    Years to decades later a focus reactivates in one kidney, causing
    papillary necrosis, cavitation, bacilluria, sterile pyuria and hematuria.
  evidence:
  - reference: PMID:39913089
    reference_title: "Urogenital Tuberculosis: A Narrative Review and recommendations for diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      reactivation of tuberculosis occurs in one kidney (primary kidney), with
      the onset of clinically and radiologically detectable unilateral renal
      tuberculosis.
    explanation: >-
      Describes reactivation in one kidney as the start of clinical disease.
- phase: Descending urinary tract disease
  notes: >-
    The infection descends to the renal pelvis, ureter and bladder, causing
    strictures, hydronephrosis and a contracted bladder; diagnosis is often
    delayed until this stage.
  evidence:
  - reference: PMID:39913089
    reference_title: "Urogenital Tuberculosis: A Narrative Review and recommendations for diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      As tuberculosis progresses through the urinary tract, the renal pelvis,
      ipsilateral ureter and bladder become involved.
    explanation: >-
      Describes the descending progression through the urinary tract.
- phase: End-stage renal damage
  notes: >-
    The first kidney is lost to obstruction and parenchymal destruction,
    sometimes as a calcified autonephrectomy; the second can be damaged by
    reflux, and renal failure can follow.
  evidence:
  - reference: PMID:39913089
    reference_title: "Urogenital Tuberculosis: A Narrative Review and recommendations for diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Thus, the primary kidney loses function because of the urinary tract
      obstruction caused by tuberculosis, and the secondary kidney may lose
      function owing to vesicoureteral reflux.
    explanation: >-
      Describes the loss of the first kidney to obstruction and the second to
      reflux.
diagnosis:
- name: Urinalysis for Sterile Pyuria and Hematuria
  description: >-
    Pyuria without growth on routine culture, with or without hematuria, is
    the usual reason to suspect urinary tuberculosis.
  diagnosis_term:
    preferred_term: urinalysis
    term:
      id: NCIT:C17241
      label: Urinalysis
  evidence:
  - reference: PMID:23303798
    reference_title: "Renal tuberculosis in the modern era."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of urinary tract TB is based on the finding of pyuria in
      the absence of common bacterial infection.
    explanation: >-
      States that sterile pyuria is the basis for suspecting urinary
      tuberculosis.
- name: Mycobacterial Culture of Early-Morning Urine
  description: >-
    At least three early-morning urine specimens on consecutive days are
    cultured for mycobacteria. Culture is the reference standard and gives
    drug susceptibility, but takes weeks and misses many cases when compared
    against a composite reference standard.
  diagnosis_term:
    preferred_term: urine mycobacterial culture
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  evidence:
  - reference: PMID:34827337
    reference_title: "Genitourinary Tuberculosis: A Comprehensive Review of a Neglected Manifestation in Low-Endemic Countries."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      At least three early-morning urine samples, delivering first-void
      midstream, on consecutive days, are recommended for AFB culture.
    explanation: >-
      Recommends culture of three early-morning urine samples.
  - reference: PMID:31363115
    reference_title: "Multicentre evaluation of Xpert MTB/RIF assay in detecting urinary tract tuberculosis with urine samples."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Against CRS, the sensitivity of Xpert, smear and culture was 41.3% (95%
      CI: 33.4-49.7%), 7.3% (95% CI: 3.7-12.7%), and 24.0% (95% CI:
      17.4-31.6%).
    explanation: >-
      In 302 patients with suspected urinary tuberculosis, urine culture
      detected only a quarter of cases defined by a composite reference
      standard.
- name: Xpert MTB/RIF Assay on Urine
  description: >-
    Nucleic acid amplification of M. tuberculosis DNA in urine is faster and
    more sensitive than culture and detects rifampicin resistance; it is
    recommended as the initial test, with culture.
  diagnosis_term:
    preferred_term: Xpert MTB/RIF assay on urine
    term:
      id: NCIT:C20055
      label: Nucleic Acid Amplification Test
  evidence:
  - reference: PMID:28583076
    reference_title: "Diagnostic accuracy of nucleic acid amplification tests (NAATs) in urine for genitourinary tuberculosis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Xpert studies were of good quality and not heterogeneous, pooled
      sensitivity was 0·87 (0·66-0·96) and specificity was 0·91 (0·84-0·95).
    explanation: >-
      A diagnostic meta-analysis of urine nucleic acid amplification tests
      gives pooled accuracy for urine Xpert, from two studies.
  - reference: PMID:31363115
    reference_title: "Multicentre evaluation of Xpert MTB/RIF assay in detecting urinary tract tuberculosis with urine samples."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Xpert had better performance than smear and culture in detecting UTB
      from urine samples and could be considered for the diagnosis of UTB.
    explanation: >-
      A four-hospital evaluation finds urine Xpert more sensitive than smear
      and culture.
- name: CT Urography
  description: >-
    CT urography is the imaging of choice. It shows papillary necrosis,
    cavities, lobar calcification, infundibular, pelvic and ureteric
    strictures with hydronephrosis, and bladder wall thickening, and helps
    distinguish renal tuberculosis from urothelial carcinoma and
    xanthogranulomatous pyelonephritis.
  diagnosis_term:
    preferred_term: CT urography
    term:
      id: NCIT:C159883
      label: CT Urography
  evidence:
  - reference: PMID:19468472
    reference_title: "Options in the management of tuberculous ureteric stricture."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Computed tomography (CT) urography is now considered the imaging
      modality of choice for diagnosis and evaluation of GUTB.
    explanation: >-
      States that CT urography is the imaging of choice.
  - reference: PMID:34827337
    reference_title: "Genitourinary Tuberculosis: A Comprehensive Review of a Neglected Manifestation in Low-Endemic Countries."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Differential diagnosis with transitional cell carcinoma (TCC) or with
      xanthogranulomatous pyelonephritis can be challenging
    explanation: >-
      Names urothelial carcinoma and xanthogranulomatous pyelonephritis as
      imaging differentials.
- name: Brazilian Society of Urology Provisional Diagnostic Criteria
  description: >-
    A provisional, unvalidated scheme proposed by the Brazilian Society of
    Urology infection division. A definitive diagnosis rests on a positive
    culture or nucleic acid test, or a granuloma in urogenital tissue. A
    probable diagnosis combines evidence of previous tuberculosis with
    suggestive findings: persistent hematuria, unexplained urinary tract
    thickening or stenosis, a non-functioning kidney, or a contracted bladder
    under 100 mL. Treatment is advised for definitive and probable cases.
  evidence:
  - reference: PMID:39913089
    reference_title: "Urogenital Tuberculosis: A Narrative Review and recommendations for diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Currently, there are no accepted diagnostic criteria for UGT; therefore,
      the initiation of treatment is based on experience and common sense.
    explanation: >-
      States that no validated diagnostic criteria exist, which is why the
      authors propose provisional ones.
  - reference: PMID:39913089
    reference_title: "Urogenital Tuberculosis: A Narrative Review and recommendations for diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Presence of a granuloma, with or without caseous necrosis, in a biopsy
      sample of an organ/tissue of the urogenital tract.
    explanation: >-
      One of the definitive criteria of the proposed scheme.
treatments:
- name: Antituberculous Chemotherapy
  description: >-
    The WHO six-month regimen: isoniazid, rifampicin, pyrazinamide and
    ethambutol for a two-month intensive phase, then isoniazid and rifampicin
    for four months. Drug-resistant disease needs longer regimens.
    Genitourinary tuberculosis relapses more often than pulmonary disease,
    and long follow-up is advised.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Caseating Granulomatous Papillitis and Papillary Necrosis
    treatment_effect: INHIBITS
    description: >-
      Bactericidal therapy kills the bacilli driving the caseating renal
      lesion.
  evidence:
  - reference: PMID:34827337
    reference_title: "Genitourinary Tuberculosis: A Comprehensive Review of a Neglected Manifestation in Low-Endemic Countries."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The WHO recommends a 6-month regimen for GUTB, including an intensive
      phase of 2 months with isoniazid
    explanation: >-
      States the WHO six-month regimen for genitourinary tuberculosis.
  - reference: PMID:39913089
    reference_title: "Urogenital Tuberculosis: A Narrative Review and recommendations for diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In Brazil, the basic regimen for tuberculosis treatment consists of four
      drugs in the intensive phase (rifampicin, isoniazid, pyrazinamide and
      ethambutol), which lasts 2 months, and two drugs (rifampicin and
      isoniazid, which have greater bactericidal power) in the maintenance
      phase, which lasts 4 months
    explanation: >-
      Names the drugs of the intensive and maintenance phases.
  - reference: PMID:34827337
    reference_title: "Genitourinary Tuberculosis: A Comprehensive Review of a Neglected Manifestation in Low-Endemic Countries."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      GUTB patients may relapse at a higher rate than pulmonary TB, in 6.3% to
      22% of cases, even after 12 months of medical therapy
    explanation: >-
      Reports the higher relapse rate of genitourinary tuberculosis.
- name: Early Ureteric Stenting or Nephrostomy
  description: >-
    Early drainage of an obstructed kidney with a double-J ureteric stent or
    percutaneous nephrostomy, within about a month of starting chemotherapy,
    to preserve renal function while strictures evolve.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: ureteric stenting or nephrostomy
    term:
      id: NCIT:C71316
      label: Stenting
  target_mechanisms:
  - target: Fibrotic Urinary Tract Stricture
    treatment_effect: BYPASSES
    description: >-
      The stent or nephrostomy drains urine past the stricture.
  evidence:
  - reference: PMID:39913089
    reference_title: "Urogenital Tuberculosis: A Narrative Review and recommendations for diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In a retrospective study of 77 patients with ureteral stenosis, early
      placement (less than 1 month) of a double J catheter or nephrostomy
      reduced the chance of nephrectomy by 50% and may have led to the
      resolution of the stenosis in some cases
    explanation: >-
      Summarises a retrospective series in which early drainage halved the
      chance of nephrectomy.
- name: Ureteric and Bladder Reconstruction
  description: >-
    Endoscopic dilation or endoureterotomy for short strictures; ureteric
    reimplantation (with psoas hitch or Boari flap), ureterocalicostomy or
    ileal ureter for longer ones; and augmentation cystoplasty with ileum,
    sigmoid or ileocecal segment for a contracted bladder under 100 mL.
    Definitive surgery is usually done four to six weeks after chemotherapy
    starts.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: urinary tract reconstructive surgery
    term:
      id: NCIT:C25351
      label: Reconstructive Surgery
  target_mechanisms:
  - target: Fibrotic Urinary Tract Stricture
    treatment_effect: BYPASSES
    description: >-
      Reconstruction replaces or bypasses the strictured segment.
  - target: Bladder Wall Fibrosis and Contraction
    treatment_effect: BYPASSES
    description: >-
      Augmentation cystoplasty enlarges the contracted bladder.
  evidence:
  - reference: PMID:39913089
    reference_title: "Urogenital Tuberculosis: A Narrative Review and recommendations for diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      For cases of complex strictures (those with multiple strictures greater
      than 2 cm in size or the impossibility of passing through a guidewire) or
      failure of endoscopic treatment, traditional open, laparoscopic or robotic
      reconstructive surgery should be performed
    explanation: >-
      Recommends reconstructive surgery for complex strictures.
  - reference: PMID:39913089
    reference_title: "Urogenital Tuberculosis: A Narrative Review and recommendations for diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Bladder augmentation with ileum, sigmoid or ileocecal segments should be
      performed when the contracted bladder capacity is less than 100 mL.
    explanation: >-
      Recommends augmentation cystoplasty for a contracted bladder.
  - reference: PMID:30803052
    reference_title: "Can kidneys be saved in patients with urinary tuberculosis? A study in the era of modern chemotherapy and surgical armamentarium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      When feasible, reconstruction is better at renal function preservation.
    explanation: >-
      In 128 patients, reconstructed renal units survived longer than those
      with permanent diversion.
- name: Nephrectomy
  description: >-
    Removal of a non-functioning tuberculous kidney, particularly when it is
    symptomatic, causes hypertension or has diffuse lesions. Laparoscopic and
    open nephrectomy give similar outcomes.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: nephrectomy
    term:
      id: NCIT:C15284
      label: Nephrectomy
  target_mechanisms:
  - target: Caseous Cavitation and Renal Parenchymal Destruction
    treatment_effect: INHIBITS
    description: >-
      Removing the destroyed kidney removes residual caseous foci.
  evidence:
  - reference: PMID:34827337
    reference_title: "Genitourinary Tuberculosis: A Comprehensive Review of a Neglected Manifestation in Low-Endemic Countries."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In general, patients presenting with non-functioning symptomatic renal
      TB, complicated by hypertension or diffuse renal lesions, should undergo
      a radical surgery.
    explanation: >-
      States the indications for nephrectomy.
  - reference: PMID:27917313
    reference_title: "Open surgery versus retroperitoneal laparoscopic nephrectomy for renal tuberculosis: a retrospective study of 120 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Laparoscopic nephrectomy is as an effective treatment as open surgery
      for a nonfunctional tuberculous kidney, although it requires more time
      during the surgical procedure.
    explanation: >-
      In 120 nephrectomies for non-functioning tuberculous kidneys,
      laparoscopic and open surgery gave similar results.
- name: Adjunctive Corticosteroids for Ureteric Stricture
  description: >-
    Corticosteroids are sometimes added to chemotherapy to limit inflammation
    and stricture formation, or when a stricture does not improve after three
    weeks, as the older EAU guideline suggested. Their use is debated and
    supported only by case reports and small observational series; a
    stricture can also worsen early in treatment, possibly as a paradoxical
    reaction.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: systemic corticosteroid therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
    therapeutic_agent:
    - preferred_term: prednisolone
      term:
        id: CHEBI:8378
        label: prednisolone
  target_mechanisms:
  - target: Fibrotic Urinary Tract Stricture
    treatment_effect: INHIBITS
    description: >-
      Corticosteroids are given to reduce inflammation and edema that drive
      stricture formation; the effect is not established.
  evidence:
  - reference: PMID:34827337
    reference_title: "Genitourinary Tuberculosis: A Comprehensive Review of a Neglected Manifestation in Low-Endemic Countries."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The appropriateness of corticosteroid treatment in patients with GUTB at
      high risk of developing ureteral strictures is still debated.
    explanation: >-
      States that the use of corticosteroids is still debated.
  - reference: PMID:19468472
    reference_title: "Options in the management of tuberculous ureteric stricture."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Corticosteroids may be given in the initial phase when there is acute
      tuberculous disease to decrease inflammation/edema and stricture
      formation.
    explanation: >-
      States the rationale for early corticosteroids.
  - reference: PMID:27904125
    reference_title: "Use of Corticosteroids for Urinary Tuberculosis Patients at Risk of Developing Ureteral Obstruction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: >-
      No improvement in the ureteral stricture was noted during the initial
      three weeks of treatment; however, the stricture did thereafter improve
      after the commencement of oral prednisolone.
    explanation: >-
      A single case in which a ureteric stricture improved after prednisolone
      was added; a case report cannot separate the drug effect from the
      natural course.

name: Renal Tuberculosis
creation_date: "2026-11-26T03:48:35Z"
description: >-
  Renal tuberculosis is tuberculosis of the kidney and the commonest form of
  genitourinary tuberculosis. Mycobacterium tuberculosis reaches both kidneys
  through the bloodstream from a primary pulmonary infection and forms small
  cortical granulomas that usually heal and stay latent, often for decades.
  When a focus reactivates, usually in one kidney, caseating granulomas erode
  the renal papillae and discharge bacilli into the urine. Papillary necrosis
  and caseous cavitation follow, and the infection descends the collecting
  system to the renal pelvis, ureter and bladder. Fibrosis causes ureteric
  strictures with hydronephrosis and a contracted, low-capacity bladder whose
  reflux can damage the other kidney. Untreated disease ends in a calcified,
  non-functioning kidney ("putty kidney" or autonephrectomy) and can cause
  chronic kidney disease. The disease is insidious. Sterile pyuria,
  hematuria and lower urinary tract symptoms are the usual clues, and
  diagnosis is often late. Urine mycobacterial culture and Xpert MTB/RIF
  confirm it, and CT urography shows its extent. Treatment is standard
  six-month antituberculous chemotherapy, with early ureteric stenting or
  nephrostomy for obstruction, reconstructive surgery for strictures and
  contracted bladder, and nephrectomy for a non-functioning kidney.
category: Infectious Disease
disease_term:
  preferred_term: renal tuberculosis
  term:
    id: MONDO:0005938
    label: renal tuberculosis
parents:
- Tuberculosis
- Urogenital tuberculosis
synonyms:
- kidney tuberculosis
- tuberculosis of kidney
- urinary tuberculosis
notes: >-
  Most of the literature on renal tuberculosis reports genitourinary or
  urogenital tuberculosis as a whole, in which the kidney is the organ most
  often involved, so several frequencies quoted here are for genitourinary
  tuberculosis rather than for renal disease alone; the evidence explanations
  say which. The clinical evidence is mostly single-centre retrospective
  series (the largest renal-specific one has 419 patients) and narrative
  reviews. There are no randomised trials of surgery, stenting or
  corticosteroids. The pathogenesis sequence (bilateral cortical seeding,
  latency, unilateral reactivation, papillary erosion and descending spread)
  is drawn from narrative reviews summarising autopsy and case-series work,
  not from studies designed to test it. Seeded from
  `research/Renal_Tuberculosis-deep-research-claude_code.md` and PubMed
  searches.
review_notes: >-
  Deliberately lumped. Renal tuberculosis caused by Mycobacterium
  tuberculosis, the rarer cases caused by Mycobacterium bovis, and renal
  granulomatous disease after intravesical BCG immunotherapy for bladder
  cancer are kept in one entry. The cited sources describe the same
  granulomatous renal lesion and treat all of them with standard
  antituberculous chemotherapy, and none describes M. bovis or BCG renal
  disease as a separate clinical entity with its own diagnostic or
  therapeutic pathway. PubMed was searched for renal, urinary, genitourinary
  and urogenital tuberculosis, for M. bovis genitourinary disease, and for
  renal disease after intravesical BCG; the BCG literature found was case
  reports, so the BCG route is recorded as an environmental exposure rather
  than as a subtype.
infectious_agent:
- name: Mycobacterium tuberculosis
  infectious_agent_term:
    preferred_term: Mycobacterium tuberculosis
    term:
      id: NCBITaxon:1773
      label: Mycobacterium tuberculosis
  description: >-
    The acid-fast intracellular bacterium that causes most genitourinary
    tuberculosis, reaching the kidneys from a pulmonary focus through the
    bloodstream.
  evidence:
  - reference: PMID:22157940
    reference_title: "Etiology and management of genitourinary tuberculosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In GUTB, the kidneys are the most common sites of infection and are
      infected through hematogenous spread of the bacilli, which then spread
      through the renal and genital tract.
    explanation: >-
      Identifies tuberculous bacilli reaching the kidneys through the
      bloodstream as the cause of renal infection.
- name: Mycobacterium bovis
  infectious_agent_term:
    preferred_term: Mycobacterium bovis
    term:
      id: NCBITaxon:1765
      label: Mycobacterium tuberculosis variant bovis
  description: >-
    A member of the M. tuberculosis complex, acquired mostly from cattle, that
    causes a minority of genitourinary tuberculosis. Its attenuated BCG strain,
    used for intravesical bladder cancer therapy, rarely causes granulomatous
    renal disease.
  evidence:
  - reference: PMID:34827337
    reference_title: "Genitourinary Tuberculosis: A Comprehensive Review of a Neglected Manifestation in Low-Endemic Countries."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      GUTB is caused by mycobacteria, of which the most frequently isolated
      species in humans is MTB hominis complex (responsible for about 90% of
      cases); Mycobacterium tuberculosis, bovis and africanum (especially in
      West Africa) are the most frequently isolated bacteria.
    explanation: >-
      Names M. bovis among the mycobacteria isolated in genitourinary
      tuberculosis.
  - reference: PMID:37304506
    reference_title: "Renal BCGosis managed conservatively with antituberculous medications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Intravesical Bacillus Calmette-Guérin (BCG) therapy for nonmuscle-invasive
      bladder cancer rarely leads to the development of granulomatous renal
      masses (renal BCGosis).
    explanation: >-
      A case report of renal BCG disease, noting that renal granulomatous
      masses are a rare consequence of intravesical BCG.
agent_life_cycle:
  description: >-
    M. tuberculosis is transmitted between humans by inhaled droplet nuclei,
    establishes a pulmonary infection, and spreads through the bloodstream to
    the kidneys, where foci can stay latent for decades before reactivating.
    M. bovis is carried by cattle and reaches humans mostly from animals, by
    raw milk or by droplets.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host of M. tuberculosis
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: cattle
    role: reservoir of M. bovis
    term:
      id: NCBITaxon:9913
      label: Bos taurus
  evidence:
  - reference: PMID:27525395
    reference_title: "[Investigation of Mycobacterium bovis subsp. bovis among the strains of Mycobacterium tuberculosis complex isolated in Düzce Province, Turkey]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Today, M.bovis infection is mostly transmitted from animals to humans and
      very rarely from humans to other humans. The most significant means of
      transmission of the infection are to the gastrointestinal tract via
      consumption of raw milk and to the respiratory system via droplet
      infection from the animals with disease.
    explanation: >-
      The introduction of a human isolate-typing study states that M. bovis
      reaches humans mostly from animals, by raw milk or droplets; the study
      itself concerned human isolates and bovine tuberculosis in cattle.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Airborne Mycobacterium tuberculosis acquisition
  description: >-
    The infection is acquired by inhaling aerosolised bacilli. The kidneys are
    then reached from the pulmonary infection through the bloodstream; renal
    tuberculosis itself is not transmissible.
  evidence:
  - reference: PMID:34827337
    reference_title: "Genitourinary Tuberculosis: A Comprehensive Review of a Neglected Manifestation in Low-Endemic Countries."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      TB infection starts from inhalation of cough-generated aerosols
      containing mycobacterium tuberculosis.
    explanation: >-
      States the airborne pulmonary entry that precedes renal involvement.
  - reference: PMID:39913089
    reference_title: "Urogenital Tuberculosis: A Narrative Review and recommendations for diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      UGT, like all forms of extrapulmonary tuberculosis, has common features,
      such as nontransmissibility and difficulty in diagnosis
    explanation: >-
      States that urogenital tuberculosis, unlike pulmonary disease, is not
      transmissible.
- name: Zoonotic Mycobacterium bovis acquisition
  description: >-
    M. bovis is acquired from infected cattle, mainly by drinking raw milk or
    by inhaling droplets from diseased animals.
  evidence:
  - reference: PMID:27525395
    reference_title: "[Investigation of Mycobacterium bovis subsp. bovis among the strains of Mycobacterium tuberculosis complex isolated in Düzce Province, Turkey]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The most significant means of transmission of the infection are to the
      gastrointestinal tract via consumption of raw milk and to the respiratory
      system via droplet infection from the animals with disease.
    explanation: >-
      States the raw-milk and droplet routes by which humans acquire M. bovis.
- name: Iatrogenic intravesical BCG instillation
  description: >-
    In patients given intravesical BCG for bladder cancer, the attenuated
    M. bovis strain can cause granulomatous renal lesions.
  evidence:
  - reference: PMID:32577059
    reference_title: "Renal Tuberculosis Following Intravesical Bacillus Calmette-Guérin (BCG) Immunotherapy for the Treatment of Bladder Cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      CT-guided core-needle biopsy of the affected kidney was performed, and
      the specimen was sent for histopathological analysis, which revealed
      chronic necrotizing granulomatous inflammation.
    explanation: >-
      A case of necrotizing granulomatous renal disease after intravesical BCG
      immunotherapy.
prevalence:
- population: Patients with extrapulmonary tuberculosis
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Genitourinary tuberculosis, in which the kidney is the organ most often
    involved, is reported as anything from 4.6% to 27% of extrapulmonary
    tuberculosis, and up to 40% in one Chinese multicentre study. These are
    shares of extrapulmonary tuberculosis cases, not population rates, and
    they are not specific to the kidney, so no rate is asserted.
  evidence:
  - reference: PMID:37541917
    reference_title: "Genitourinary Tuberculosis: A Brief Manual for Urologists on Diagnosis and Treatment from the European Association of Urology Urological Infections Panel."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      EPTB can develop in 16% of TB cases. GUTB accounts for 4.6% of EPTB
    explanation: >-
      The European Association of Urology panel's estimate of the share of
      extrapulmonary tuberculosis that is genitourinary.
  - reference: PMID:23303798
    reference_title: "Renal tuberculosis in the modern era."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Urogenital TB represents 27% of extrapulmonary cases.
    explanation: >-
      A much higher estimate of the urogenital share of extrapulmonary
      tuberculosis, showing how much the figure varies by setting.
environmental:
- name: HIV infection
  description: >-
    HIV infection is often present in patients with genitourinary tuberculosis
    and made extrapulmonary tuberculosis more common.
  influences_mechanisms:
  - target: Reactivation of a Latent Renal Focus
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      HIV-related immunosuppression is associated with extrapulmonary and
      urogenital tuberculosis; the cited sources do not establish which step
      it acts on, so the link is drawn to reactivation as the most plausible.
    evidence:
    - reference: PMID:23303798
      reference_title: "Renal tuberculosis in the modern era."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Extrapulmonary TB became more common with the advent of infection with
        human immunodeficiency virus and by the increase in the number of organ
        transplantation, which also leads to immunosuppression of thousand of
        persons.
      explanation: >-
        Links HIV infection and transplant immunosuppression to the rise in
        extrapulmonary tuberculosis.
  evidence:
  - reference: PMID:34827337
    reference_title: "Genitourinary Tuberculosis: A Comprehensive Review of a Neglected Manifestation in Low-Endemic Countries."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      HIV is often a concomitant disease in patients with GUTB, especially male
      patients, who are affected at a rate twice that of than women
    explanation: >-
      States that HIV is often present in patients with genitourinary
      tuberculosis.
  - reference: PMID:39890377
    reference_title: "The prevalence of urogenital tuberculosis in people living with HIV."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The prevalence of UGT in patients living with HIV is very low. However,
      patients with poorly controlled disease may present disseminated
      tuberculosis associated with UGT.
    explanation: >-
      A cross-sectional screen of 181 people living with HIV found only one
      case, in a patient with poorly controlled HIV and disseminated
      tuberculosis, which qualifies how strong the association is.
- name: Kidney transplantation and dialysis
  description: >-
    Recipients of kidney transplants and patients on dialysis have a several
    times higher risk of active tuberculosis than the general population,
    because of immunosuppression and end-stage renal disease.
  influences_mechanisms:
  - target: Reactivation of a Latent Renal Focus
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The higher risk is for active tuberculosis at any site; the cited
      studies do not report renal disease separately.
    evidence:
    - reference: PMID:26614191
      reference_title: "Risk of active tuberculosis in chronic kidney disease: a systematic review and meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Meta-analysis of adjusted rate ratio data in dialysis populations showed
        an increased rate of 3.62 (95%CI 1.79-7.33, P < 0.001) compared to the
        general population, while unadjusted risk ratio data in transplant
        populations showed an increased risk of 11.35 (95%CI 2.97-43.41)
        compared to the general population.
      explanation: >-
        A meta-analysis of 12 studies finds a higher rate of active
        tuberculosis in dialysis and kidney transplant populations.
  evidence:
  - reference: PMID:41427615
    reference_title: "Incidence, Risk Factors, and Clinical Outcomes of Active Tuberculosis in Kidney Transplant Recipients From Romania: A Single-Center Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The incidence of active TB among the cohort was 1.48% with a median time
      to occurrence of 60.26 months (IQR: 30.75-102.50) after KT.
    explanation: >-
      In 1,485 kidney transplant recipients, 1.48% developed active
      tuberculosis, a median of about five years after transplantation; the
      authors report this as higher than in the general population.
- name: Intravesical BCG immunotherapy for bladder cancer
  description: >-
    Intravesical instillation of live attenuated M. bovis BCG for
    non-muscle-invasive bladder cancer is a rare iatrogenic cause of
    granulomatous renal disease.
  influences_mechanisms:
  - target: Caseating Granulomatous Papillitis and Papillary Necrosis
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      BCG instilled into the bladder can produce necrotizing granulomatous
      lesions in the kidney; the route by which the bacilli reach the kidney
      is not established by the cited sources.
    evidence:
    - reference: PMID:32577059
      reference_title: "Renal Tuberculosis Following Intravesical Bacillus Calmette-Guérin (BCG) Immunotherapy for the Treatment of Bladder Cancer."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        CT-guided core-needle biopsy of the affected kidney was performed, and
        the specimen was sent for histopathological analysis, which revealed
        chronic necrotizing granulomatous inflammation.
      explanation: >-
        Necrotizing granulomatous renal inflammation after intravesical BCG.
  evidence:
  - reference: PMID:37304506
    reference_title: "Renal BCGosis managed conservatively with antituberculous medications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Intravesical Bacillus Calmette-Guérin (BCG) therapy for nonmuscle-invasive
      bladder cancer rarely leads to the development of granulomatous renal
      masses (renal BCGosis).
    explanation: >-
      Identifies granulomatous renal masses as a rare complication of
      intravesical BCG.
pathophysiology:
- name: Primary Pulmonary Mycobacterium tuberculosis Infection
  role: trigger
  description: >-
    Inhaled bacilli establish a primary or chronic latent pulmonary infection
    that seeds other organs through the bloodstream.
  biological_scale: ORGANISM
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:34827337
    reference_title: "Genitourinary Tuberculosis: A Comprehensive Review of a Neglected Manifestation in Low-Endemic Countries."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      GUTB is almost always secondary due to the hematogenous spread of chronic
      latent pulmonary TB (LTBI); therefore, primary and LTBI represent its most
      important risk factors
    explanation: >-
      Places a pulmonary infection upstream of genitourinary tuberculosis.
  downstream:
  - target: Hematogenous Seeding of the Renal Cortex
    causal_link_type: DIRECT
    description: >-
      Bacillemia from the pulmonary infection implants bacilli in both
      kidneys.
    evidence:
    - reference: PMID:28540230
      reference_title: "Genital tuberculosis: current status of diagnosis and management."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        This subclinical pulmonary infection leads to bacillemia and
        hematogenous implantation of the Tb bacilli in the kidneys, epididymis
        and the prostate amongst various other organs of the body.
      explanation: >-
        States that bacillemia from the pulmonary infection implants bacilli
        in the kidneys.
- name: Hematogenous Seeding of the Renal Cortex
  conforms_to: "granuloma_formation#Organized Granuloma Assembly"
  description: >-
    Bloodborne bacilli implant bilaterally in the well-vascularised renal
    cortex and form small granulomas near the glomeruli, without caseous
    necrosis and without radiological change. With the onset of immunity
    the lesions heal and enter a latent phase.
  biological_scale: TISSUE
  locations:
  - preferred_term: renal cortex
    term:
      id: UBERON:0001225
      label: cortex of kidney
  evidence:
  - reference: PMID:28540230
    reference_title: "Genital tuberculosis: current status of diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Initially, the implantation occurs in the more vascular parts such as
      cortex of the kidneys and globus minor of the epididymis, and is
      bilateral.
    explanation: >-
      Places the initial bloodborne implantation in the renal cortex,
      bilaterally.
  - reference: PMID:39913089
    reference_title: "Urogenital Tuberculosis: A Narrative Review and recommendations for diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The initial lesions are bilateral and consist of granulomas without
      caseous necrosis or nodule formation and, therefore, without kidney
      radiological changes
    explanation: >-
      Describes the initial renal lesions as bilateral non-caseating
      granulomas without radiological change.
  downstream:
  - target: Reactivation of a Latent Renal Focus
    causal_link_type: DIRECT
    description: >-
      The healed implantation granulomas stay latent and can reactivate later.
    evidence:
    - reference: PMID:39913089
      reference_title: "Urogenital Tuberculosis: A Narrative Review and recommendations for diagnosis and treatment."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        These granulomas may remain latent throughout life; however, the
        disease may be reactivated mainly in medullary granulomas due to less
        vascularization and a greater chance of ischemia in this kidney area.
      explanation: >-
        States that the implantation granulomas stay latent and can
        reactivate, mainly in the medulla.
    - reference: PMID:28540230
      reference_title: "Genital tuberculosis: current status of diagnosis and management."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        With the development of immunity, these lesions cicatrize in about 6
        months or so, and a latent phase then ensues.
      explanation: >-
        States that the implantation lesions heal and become latent.
- name: Reactivation of a Latent Renal Focus
  description: >-
    After a latent period that can last decades, a fall in host immunity
    reactivates a renal focus, usually in one kidney and in the poorly
    vascularised medulla near the papilla.
  biological_scale: TISSUE
  locations:
  - preferred_term: renal medulla
    term:
      id: UBERON:0000362
      label: renal medulla
  evidence:
  - reference: PMID:28540230
    reference_title: "Genital tuberculosis: current status of diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Reactivation of the latent foci results from a decrease in the host
      immunity, usually after a long latent period of about 30 years, ranging
      from 1–46 years
    explanation: >-
      States that latent genitourinary foci reactivate when host immunity
      declines, after a long latent period.
  - reference: PMID:34827337
    reference_title: "Genitourinary Tuberculosis: A Comprehensive Review of a Neglected Manifestation in Low-Endemic Countries."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Subsequently, after a latent period, reactivation occurs, and the
      infection generally progresses from a single focus.
    explanation: >-
      States that renal disease reactivates after latency from a single
      focus.
  - reference: PMID:39913089
    reference_title: "Urogenital Tuberculosis: A Narrative Review and recommendations for diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      reactivation of tuberculosis occurs in one kidney (primary kidney), with
      the onset of clinically and radiologically detectable unilateral renal
      tuberculosis.
    explanation: >-
      States that reactivation usually begins in one kidney.
  downstream:
  - target: Caseating Granulomatous Papillitis and Papillary Necrosis
    causal_link_type: DIRECT
    description: >-
      The reactivated focus develops caseous necrosis that ulcerates and
      erodes the renal papilla into the collecting system.
    evidence:
    - reference: PMID:39913089
      reference_title: "Urogenital Tuberculosis: A Narrative Review and recommendations for diagnosis and treatment."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Moreover, caseous necrosis, ulceration and erosion of the renal
        papillae to the urinary tract may occur, accompanied by bacilluria and
        descending dissemination of the infection.
      explanation: >-
        Describes caseous necrosis eroding the papillae after reactivation.
- name: Caseating Granulomatous Papillitis and Papillary Necrosis
  conforms_to: "granuloma_formation#Tissue Containment versus Destruction and Fibrosis"
  description: >-
    Caseating granulomas with epithelioid cells and Langhans giant cells
    destroy the renal papilla. Papillary necrosis is the earliest
    radiological sign of renal tuberculosis, and erosion into the calyces
    discharges bacilli and inflammatory cells into the urine.
  biological_scale: TISSUE
  locations:
  - preferred_term: renal papilla
    term:
      id: UBERON:0001228
      label: renal papilla
  evidence:
  - reference: PMID:39913089
    reference_title: "Urogenital Tuberculosis: A Narrative Review and recommendations for diagnosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Thus, changes in the renal papilla characterize the initial radiological
      signs of renal tuberculosis
    explanation: >-
      Identifies papillary change as the first radiological sign of renal
      tuberculosis.
  - reference: PMID:30071831
    reference_title: "Chronic kidney disease with genitourinary tuberculosis: old disease but ongoing complication."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A histological diagnosis of TB was confirmed by identifying caseating
      necrosis, loose aggregates of epithelioid histiocytes and Langerhans
      giant cells in tissue specimens
    explanation: >-
      The histological criteria used in a 56-patient genitourinary
      tuberculosis series: caseating necrosis with epithelioid histiocytes and
      giant cells.
  downstream:
  - target: Renal papillary necrosis
    causal_link_type: DIRECT
    description: >-
      Caseous destruction of the papilla is seen as papillary necrosis.
    evidence:
    - reference: PMID:34827337
      reference_title: "Genitourinary Tuberculosis: A Comprehensive Review of a Neglected Manifestation in Low-Endemic Countries."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        These papillary lesions caseate and cavitate, forming ulcerocavernous
        lesions as they erode into the pelvicalyceal system.
      explanation: >-
        Describes caseation and cavitation of the papillary lesions.
  - target: Caseating granulomatosis
    causal_link_type: DIRECT
    description: >-
      The lesion is seen histologically as caseating granulomatous
      inflammation.
  - target: Sterile pyuria
    causal_link_type: DIRECT
    description: >-
      Erosion of inflamed papillae into the collecting system sheds leukocytes
      into urine that grows no ordinary bacteria.
    evidence:
    - reference: PMID:23303798
      reference_title: "Renal tuberculosis in the modern era."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Most patients with renal TB have sterile pyuria, which can be
        accompanied by microscopic hematuria.
      explanation: >-
        States that most patients with renal tuberculosis have sterile pyuria.
  - target: Hematuria
    causal_link_type: DIRECT
    description: >-
      Ulceration of the papillae and urothelium causes microscopic or gross
      hematuria.
  - target: Macroscopic hematuria
    causal_link_type: DIRECT
    description: >-
      Bleeding from ulcerated papillae and urothelium is visible as gross
      hematuria in about a quarter of patients.
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Active caseating tuberculous inflammation is accompanied by fever in a
      minority of patients.
  - target: Caseous Cavitation and Renal Parenchymal Destruction
    causal_link_type: DIRECT
    description: >-
      Progressive caseation hollows out the papillae and lobes into cavities

  - reference: PMID:31548730
    reference_title: "Urogenital tuberculosis - epidemiology, pathogenesis and clinical features."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Advanced UG-TB can cause renal scarring, distortion of renal calyces and
      pelvic, ureteric strictures, stenosis, urinary outflow tract
      obstruction, hydroureter, hydronephrosis, renal failure and reduced
      bladder capacity.
    explanation: >-
      Lists hydronephrosis among the complications of advanced urogenital
      tuberculosis.

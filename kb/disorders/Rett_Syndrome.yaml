- name: Non-Cell-Autonomous Glial Injury of Neurons
  description: >-
    MeCP2 loss is not confined to neurons, and MeCP2-deficient glia actively
    injure neighbouring neurons rather than merely failing to support them.
    Conditioned medium from Mecp2-null microglia carries a fivefold excess of
    glutamate that stunts and beads dendrites and damages postsynaptic
    glutamatergic components within a day, an effect abolished by blocking
    microglial glutamate synthesis or release or by antagonising neuronal
    glutamate receptors. Oligodendrocyte lineage cells contribute separately:
    deleting MeCP2 from them alone produces hindlimb clasping, and restoring it
    to them alone in otherwise null mice improves locomotion and clasping. Both
    results are from mouse systems and the corresponding experiment cannot be
    done in human brain, so this node is model-derived.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: dendrite morphogenesis
    term:
      id: GO:0048813
      label: dendrite morphogenesis
    modifier: DECREASED
  downstream:
  - target: Reduced Synapse and Dendritic Spine Density
    description: >-
      Microglia-derived glutamate damages dendrites and postsynaptic
      glutamatergic components, adding a non-cell-autonomous route to the same
      synaptic and dendritic deficit that MECP2-mutant neurons reach on their
      own.
  evidence:
  - reference: PMID:20392956
    reference_title: "Rett syndrome microglia damage dendrites and synapses by the elevated release of glutamate."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Hippocampal neurons treated with CM from Mecp2-null microglia showed an abnormal stunted and beaded dendritic morphology, and signs of microtubule disruption and damage of postsynaptic glutamatergic components within 24 h."
    explanation: >-
      Establishes the neurotoxic effect of MeCP2-deficient microglia on
      dendrites and postsynaptic structure in co-culture.
  - reference: PMID:20392956
    reference_title: "Rett syndrome microglia damage dendrites and synapses by the elevated release of glutamate."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mecp2-null microglia released a fivefold higher level of glutamate"
    explanation: >-
      Identifies glutamate as the toxic species and quantifies the excess; the
      same study attributes it to raised glutaminase and connexin 32, and shows
      that blocking synthesis, release, or receptor binding each abolishes the
      toxicity.
  - reference: PMID:24285883
    reference_title: "Oligodendrocyte lineage cells contribute unique features to Rett syndrome neuropathology."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "restoration of MeCP2 in oligodendrocyte lineage cells, in otherwise MeCP2-null mice, although only mildly prolonging their lifespan, significantly improved the locomotor deficits and hindlimb clasping phenotype, both in male and female mice"
    explanation: >-
      Shows a second glial lineage contributing non-cell-autonomously: restoring
      MeCP2 to oligodendrocytes alone, leaving every neuron mutant, is enough to
      improve motor phenotypes. The quoted caveat about lifespan is retained
      because the rescue is partial.
- name: Cortical Excitation/Inhibition Imbalance
  description: >-
    Cortical circuits in Rett syndrome sit shifted toward excitation, and the
    shift is measurable in patients rather than only inferred from models.
    Paired-pulse transcranial magnetic stimulation of primary motor cortex in
    typical Rett patients shows a raised excitation index, driven by reduced
    short-interval intracortical inhibition and increased intracortical
    facilitation, which the investigators read as GABAergic dysfunction.
    Long-interval intracortical inhibition is likewise reduced, and LTP-like
    plasticity is abolished and scales with motor disability. The GABAergic
    attribution is the study authors' interpretation of the neurophysiology, not
    a direct measurement of interneuron function in these patients.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: GABAergic interneuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron

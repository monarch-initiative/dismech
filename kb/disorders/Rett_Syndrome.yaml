  - target: Dysregulated Neuronal Gene Expression
    description: Loss of MeCP2 regulatory function changes expression of many neuronal genes.
  - target: Non-Cell-Autonomous Glial Injury of Neurons
    description: >-
      MeCP2 is lost from glia as well as neurons, and MeCP2-deficient microglia
      and oligodendrocyte lineage cells then injure neurons that are themselves
      mutant.
  evidence:
  - reference: PMID:10508514
    reference_title: "Rett syndrome is caused by mutations in X-linked MECP2, encoding methyl-CpG-binding protein 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MeCP2 selectively binds CpG dinucleotides in the mammalian genome and mediates transcriptional repression through interaction with histone deacetylase and the corepressor SIN3A"
    explanation: Original discovery paper confirms MeCP2 functions as a transcriptional regulator through DNA methylation binding.
  - reference: PMID:18511691
    reference_title: "MeCP2, a key contributor to neurological disease, activates and represses transcription."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These studies suggest that MeCP2 regulates the expression of a wide range of genes in the hypothalamus and that it can function as both an activator and a repressor of transcription."
    explanation: Mouse hypothalamus data support MeCP2 as a broad transcriptional activator and repressor.
  - reference: PMID:20188665
    reference_title: "Neuronal MeCP2 is expressed at near histone-octamer levels and globally alters the chromatin state."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "MeCP2 deficiency results in global changes in neuronal chromatin structure, including elevated histone acetylation and a doubling of histone H1."
    explanation: >-
      Establishes that what is lost is genome-wide chromatin regulation, not
      only transcriptional output at particular loci. The same study reports
      that neither change is detectable in glia, where MeCP2 is less abundant,
      which is why this node is annotated to neurons.
  - reference: PMID:28211484
    reference_title: "Regulation of mRNA splicing by MeCP2 via epigenetic modifications in the brain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we found that the majority of MeCP2-associated proteins are involved in mRNA splicing using mass spectrometry analysis with multiple samples from Mecp2-null rat brain, mouse primary neuron and human cell lines"
    explanation: >-
      Supports the splicing arm of this node. Mecp2 knockdown in cortical
      neurons alters alternative splicing widely, and the affected exons sit
      preferentially in genes with synaptic functions.
  - reference: PMID:41296873
    reference_title: "MeCP2 interacts with the super elongation complex to regulate transcription."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "MeCP2 facilitates the binding of AFF4 on a subset of genes in the mouse brain regulating synaptic plasticity and concordantly promotes the binding of RNA polymerase II on these genes"
    explanation: >-
      Supports the transcription-elongation arm. MeCP2 binds the Super
      Elongation Complex scaffold AFF4 through its transcriptional repression
      domain, and Aff4 haploinsufficiency worsens contextual-learning deficits
      in Mecp2 hypomorphic mice, so the interaction is functional rather than
      merely physical.

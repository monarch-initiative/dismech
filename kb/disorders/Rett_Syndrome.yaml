      A cortical network biased toward excitation with weakened inhibitory
      control lowers the threshold for seizure activity.
  - target: Gait Abnormalities
    description: >-
      Loss of LTP-like plasticity in primary motor cortex scales with motor
      disability severity, linking the imbalance to the motor phenotype.
  evidence:
  - reference: PMID:32129908
    reference_title: "Neurophysiological Signatures of Motor Impairment in Patients with Rett Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RTT patients displayed a significant increase of the excitation index (p = 0.003), as demonstrated by the reduction of short-interval intracortical inhibition and increase of intracortical facilitation, suggesting a shift toward cortical excitation likely due to GABAergic dysfunction."
    explanation: >-
      Direct in vivo human evidence for the excitatory/inhibitory shift, from
      paired-pulse TMS in 14 typical Rett patients against epilepsy and healthy
      control groups.
  - reference: PMID:32129908
    reference_title: "Neurophysiological Signatures of Motor Impairment in Patients with Rett Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LTP-like plasticity in M1 was abolished (p = 0.008) and scaled with motor disability"
    explanation: >-
      Ties the cortical plasticity deficit to clinical motor severity, which is
      what licenses the downstream edge to gait abnormalities.

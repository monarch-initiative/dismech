name: Rett Syndrome
creation_date: '2026-01-07T17:31:51Z'
description: >-
  Rett syndrome is an X-linked dominant neurodevelopmental disorder, occurring
  almost exclusively in females, caused in most classic cases by loss-of-function
  mutations in the MECP2 gene encoding methyl-CpG-binding protein 2. After a period
  of apparently normal early development, affected girls show developmental
  regression with loss of purposeful hand use and spoken language, stereotypic hand
  movements, gait abnormalities, and acquired microcephaly, reflecting disrupted
  activity-dependent transcriptional regulation in neurons.

- accession: geo:GSE308264
  title: Genome-wide profiling of histone modification H3K27ac and CTCF transcription factor binding in Rett syndrome iPS cells
  description: Rett syndrome (RTT) is a rare neurodevelopmental disorder that primarily affects females. It is caused by mutations in the MECP2 gene located on the X chromosome, which plays a critical role in normal brain development and function. The mutation induces epigenetic changes and chromatin re-arrangement which lead to alteration to H3K27ac and CTCF binding in the genome. To determine the epigenetic changes in RTT cells, we performed ChIP-seq on healthy and Rett syndrome iPS cells. RTT increased the H3K27ac marks and reduce CTCF binding, which supports the evidence of MeCP2 role in chromatin alterations.

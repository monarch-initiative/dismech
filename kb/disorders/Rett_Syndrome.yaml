datasets:
- accession: geo:GSE318601
  title: Early differential impact of MeCP2 mutations on functional networks in Rett syndrome patient-derived human cortical organoids [RNA-Seq]
  description: Human cerebral organoids derived from induced pluripotent stem cells can recapture early developmental processes and reveal changes involving neurodevelopmental disorders. Mutations in the X-linked methyl-CpG binding protein 2 (MECP2) gene are associated with Rett syndrome, and disease severity varies depending on the location and type of mutation. Here, we focused on neuronal activity in Rett syndrome patient-derived organoids, analyzing two types of MECP2 mutations—a missense mutation (R306C) and a truncating mutation (V247X)—using calcium imaging with three-photon microscopy.

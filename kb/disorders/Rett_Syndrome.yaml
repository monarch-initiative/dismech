    term:
      id: hgnc:6990
      label: MECP2
  downstream:
  - target: Gait Abnormalities
    description: Mutation group influences walking and ambulation outcomes.
  - target: Developmental Regression
    description: Mutation group influences retained hand use and language.
  - target: Scoliosis
    description: Mutation group and motor severity influence scoliosis risk.
  evidence:

  description: >
    MeCP2 dysfunction induces widespread gene-expression changes in neural
    tissue. These altered transcriptional programs affect neuronal maturation,
    synapse organization, dendritic morphology, calcium signaling, and
    electrophysiological maturation in human Rett cellular models.

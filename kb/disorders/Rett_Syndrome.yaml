    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical differences are notable in ambulation, hand use, and language (p < 0.004), three cardinal features of Rett syndrome."
    explanation: Variant-specific severity maps to motor, hand-use, and language features.
  - reference: PMID:20032810
    reference_title: "Profiling scoliosis in Rett syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two common methyl-CpG-binding protein 2 (MECP2) mutations, R294X and R306C, had reduced risk for scoliosis."
    explanation: Scoliosis cohort study links MECP2 mutation group with scoliosis risk.

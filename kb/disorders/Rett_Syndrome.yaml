- name: Brainstem Respiratory Circuit Dysregulation
  description: >
    Breathing disturbances arise from MeCP2-dependent dysfunction in respiratory
    control networks, including ventrolateral medulla and pontine circuits.
    Within the pons the lesion has been localised to the Koelliker-Fuse area,
    which drives post-inspiration and can reset the respiratory oscillator:
    Mecp2 heterozygous mice lose GABAergic perisomatic boutons there, and the
    link is bidirectional, since boosting local GABA reuptake blockade reduces
    breathing irregularity in mutant mice while blocking GABA-A receptors in the
    same area of healthy rats reproduces the Rett respiratory phenotype.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  locations:
  - preferred_term: brainstem
    term:
      id: UBERON:0002298
      label: brainstem
  biological_processes:
  - preferred_term: chemical synaptic transmission
    term:
      id: GO:0007268
      label: chemical synaptic transmission
    modifier: DYSREGULATED
  - preferred_term: GABAergic synaptic transmission
    term:
      id: GO:0051932
      label: synaptic transmission, GABAergic
    modifier: DECREASED
  downstream:
  - target: Breathing Abnormalities
    description: Brainstem respiratory circuit dysfunction manifests as hyperventilation, hypoventilation, apnea, and irregular breathing.
  evidence:
  - reference: PMID:23816600
    reference_title: "Breathing challenges in Rett syndrome: lessons learned from humans and animal models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Research in mouse models of RTT suggests that different areas in the ventrolateral medulla and pons give rise to different aspects of this breathing disorder."
    explanation: Mouse model studies connect MeCP2 dysfunction in defined brainstem respiratory circuits to Rett breathing disturbances.
  - reference: PMID:26507912
    reference_title: "Deficiency of GABAergic synaptic inhibition in the Kölliker-Fuse area underlies respiratory dysrhythmia in a mouse model of Rett syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mecp2 heterozygous mice showed deficiency of GABA perisomatic bouton-like puncta and processes in the KF nucleus"
    explanation: >-
      Localises the inhibitory deficit anatomically, replacing the more general
      ventrolateral-medulla-and-pons framing with a specific pontine nucleus and
      a specific transmitter system.
  - reference: PMID:26507912
    reference_title: "Deficiency of GABAergic synaptic inhibition in the Kölliker-Fuse area underlies respiratory dysrhythmia in a mouse model of Rett syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "blockade of GABAA receptors in the KF of healthy rats mimicked the RTT respiratory phenotype of recurrent central apnoeas and prolonged post-inspiratory activity"
    explanation: >-
      Supplies the reciprocal perturbation: removing GABAergic inhibition from
      this area in a healthy animal is sufficient to produce the Rett breathing
      phenotype, so the deficit is causal for the phenotype rather than merely
      co-occurring with it.
- name: Variant-Dependent Clinical Severity
  description: >
    Recurrent MECP2 variants alter the severity profile of the downstream
    phenotype. R168X and large deletions are associated with greater severity,
    while R133C, R294X, and carboxy-terminal truncations are associated with
    milder motor, hand-use, language, or scoliosis risk profiles in cohort
    studies.
  genes:

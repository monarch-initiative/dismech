    explanation: Original discovery paper identifies MECP2 pathogenic variants as causative in Rett syndrome.
  - reference: PMID:10508514
    reference_title: "Rett syndrome is caused by mutations in X-linked MECP2, encoding methyl-CpG-binding protein 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 5 of 21 sporadic patients, we found 3 de novo missense mutations in the region encoding the highly conserved methyl-binding domain (MBD) as well as a de novo frameshift and a de novo nonsense mutation"
    explanation: Establishes the relevant Rett variant classes and the affected MeCP2 protein domains.
  - reference: ORPHA:778
    reference_title: "Rett syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MECP2 | methyl-CpG binding protein 2 | hgnc:6990 | Disease-causing germline mutation(s) in"
    explanation: Orphanet's gene table independently supports MECP2 as a disease-causing germline gene for Rett syndrome.
- name: Loss of MeCP2 Epigenetic Regulation
  description: >
    MeCP2 normally binds methylated CpG dinucleotides and participates in
    transcriptional repression and activation. Loss or altered dosage of MeCP2
    changes neuronal gene-expression programs, providing the proximal molecular
    bridge from MECP2 mutation to downstream neurodevelopmental defects.
    The regulatory function lost here is broader than gene-specific repression.
    MeCP2 is present in neuronal nuclei at near histone-octamer abundance, so
    its removal changes chromatin state globally rather than at a defined target
    set; most of its protein partners are mRNA splicing factors, and it also
    loads the Super Elongation Complex scaffold AFF4 onto synaptic-plasticity
    genes. Chromatin architecture, alternative splicing, and transcription
    elongation are therefore all disrupted alongside transcriptional output.
  genes:
  - preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2
  cell_types:

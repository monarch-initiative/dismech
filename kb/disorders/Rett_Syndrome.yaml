mechanistic_hypotheses:
- hypothesis_group_id: canonical_mecp2_loss_transcriptional_synaptic_dysregulation_model
  hypothesis_label: Canonical MECP2 Loss / Transcriptional & Synaptic Dysregulation Model
  status: CANONICAL
  description: >-
    Rett syndrome is caused predominantly by de novo loss-of-function variants in MECP2 on Xq28 in
    heterozygous females (hemizygous males are typically neonatally lethal). MeCP2 is a methyl-CpG-
    binding nuclear protein that functions as a context-dependent transcriptional regulator
    (predominantly repressor of long, methylated genes) and a chromatin modifier, with highest
    expression in postmitotic neurons. MeCP2 loss disrupts the normal repression of long neuronal genes,
    dysregulates BDNF and other neurotrophin expression, and produces failure of postnatal synaptic and
    dendritic maturation. The resulting circuit dysfunction — affecting GABAergic interneurons,
    monoaminergic systems, and excitatory/inhibitory balance — drives the apparent developmental
    regression, loss of purposeful hand use, stereotypies, autonomic dysfunction, and epilepsy of Rett.
    Reversibility of the phenotype in conditional Mecp2 reactivation in mice, and gene-replacement (AAV-
    MECP2) and trofinetide (IGF-1 analogue) clinical-trial data, all corroborate MECP2-loss as the
    canonical, potentially reversible, pathogenic lesion.
  notes: >-
    Retained as CANONICAL with major qualifications.
    The 2026 openscientist hypothesis-search report
    (kb/hypotheses/Rett_Syndrome/canonical_mecp2_loss_transcriptional_synaptic_dysregulation_model)
    confirms 21 findings across 136 papers. Three pillars validate
    the model: (1) MECP2 mutations in >95% of classic RTT,
    (2) conditional Mecp2 reactivation reverses adult neurological
    deficits in mice (PMID:24009314), (3) FDA-approved trofinetide
    (Phase 3 LAVENDER, Cohen's d = 0.43 on communication).
    Five major qualifications require model expansion: (1) MeCP2 is
    NOT primarily a gene-specific transcriptional repressor —
    Skene 2010 showed near-histone-octamer abundance making it a
    global chromatin architectural protein that dampens
    transcriptional noise genome-wide; (2) MeCP2 also regulates
    mRNA splicing, interacts with the Super Elongation Complex,
    and undergoes activity-dependent post-translational
    modifications (phosphorylation, SUMOylation) that switch it
    between repressor and activator functions; (3) Rett is NOT
    solely a brain disorder — tissue-autonomous pathology occurs
    in liver, immune cells, skeletal muscle, cardiac tissue, and
    GI; (4) the phase-separation model for MeCP2 chromatin
    organization remains contested; (5) prenatal effects on
    neurogenesis precede the traditionally emphasized postnatal
    regression. Bidirectional dosage sensitivity (loss → RTT;
    duplication → MECP2 duplication syndrome) creates a narrow
    therapeutic window that complicates gene therapy approaches.
  evidence:
  - reference: PMID:10508514
    reference_title: "Rett syndrome is caused by mutations in X-linked MECP2, encoding methyl-CpG-binding protein 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we have identified mutations in the gene (MECP2 ) encoding X-linked methyl-CpG-binding protein 2 (MeCP2) as the cause of some cases of RTT"
    explanation: >
      Canonical mechanism reference used as the seed for the
      hypothesis-search deep-research run.
  - reference: PMID:24009314
    reference_title: "Rescue of behavioral and EEG deficits in male and female Mecp2-deficient mice by delayed Mecp2 gene reactivation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the delayed reactivation of Mecp2 in both male and female Mecp2-deficient mice rescues established deficits in motor and anxiety-like behavior, epileptiform activity, cortical and hippocampal electroencephalogram patterning and thermoregulation"
    explanation: >-
      Supplies the reversibility result the hypothesis description names as one
      of its three pillars: established deficits are rescued when Mecp2 is
      restored after symptom onset, so the circuit dysfunction is maintained by
      ongoing MeCP2 absence rather than fixed by a missed developmental window.
  - reference: PMID:25870282
    reference_title: "MeCP2 binds to non-CG methylated DNA as neurons mature, influencing transcription and the timing of onset for Rett syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we discovered that genes that acquire elevated mCH after birth become preferentially misregulated in mouse models of MeCP2 disorders, suggesting that MeCP2 binding at mCH loci is key for regulating neuronal gene expression in vivo"
    explanation: >-
      Gives the hypothesis a molecular account of its own timing claim. Non-CG
      methylation accumulates in neurons only after birth, so MeCP2 target
      occupancy grows postnatally and the genes that acquire it are the ones
      that misregulate when MeCP2 is lost.
  - reference: PMID:20188665
    reference_title: "Neuronal MeCP2 is expressed at near histone-octamer levels and globally alters the chromatin state."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Our data argue that MeCP2 may not act as a gene-specific transcriptional repressor in neurons, but might instead dampen transcriptional noise genome-wide in a DNA methylation-dependent manner."
    explanation: >-
      Contradicts this hypothesis description's framing of MeCP2 as
      predominantly a gene-specific repressor of long methylated genes. At
      near-histone-octamer abundance the protein is better described as a
      genome-wide chromatin dampener; the description's separate
      chromatin-modifier claim is untouched, so only the repressor framing is
      refuted here.

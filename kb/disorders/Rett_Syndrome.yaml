- accession: geo:GSE268177
  title: 'Modulating alternative splicing of MECP2: A potential therapeutic strategy for Rett syndrome'
  description: Rett syndrome (RTT) is a neurological disorder caused by loss-of-function mutations in methyl CpG binding protein 2 (MECP2), a transcriptional regulator essential for maintenance of normal neuronal function. The current FDA-approved treatment for RTT, Trofinetide, mildly alleviates some symptoms. In contrast, re-introducing MeCP2 or upregulating it through transgenesis in mouse RTT models improves most neurological phenotypes and enhances survival. Here, we devised a therapeutic strategy to moderately increase MeCP2 protein by modulating the alternative splicing of MECP2 to switch the less efficiently translated e2 to the more efficiently translated e1 isoform.

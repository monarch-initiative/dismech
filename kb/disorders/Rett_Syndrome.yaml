discussions:
- discussion_id: rett_mecp2_phase_separation_species_mismatch
  prompt: >-
    Does MeCP2 organise chromatin through liquid-liquid phase separation in
    human neurons, or is that mechanism an artefact of mouse chromocentre
    biology that humans do not share?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of MeCP2 Epigenetic Regulation
  rationale: >-
    Two lines of evidence point in opposite directions, and the disagreement is
    not merely about interpretation. In vitro, MeCP2 drives phase separation of
    nucleosomal arrays, methylation enhances it, and Rett-causing mutations
    compromise it while benign variants do not, which is a striking
    genotype-phenotype correspondence. In live cells, MeCP2 foci persist when
    heterochromatin is disrupted and lack the hallmarks of phase separation, and
    the prominent foci that made the model attractive turn out to be a mouse
    peculiarity: MeCP2 is diffusely distributed in most mammals including
    humans, and the foci are absent in a mouse subspecies lacking methylated
    satellite repeats. The question is therefore translational, not just
    contested. Resolving it matters because a condensate-forming mechanism would
    be therapeutically targetable in ways that simple methyl-DNA binding is not.
    Nothing here is curated as a pathophysiology node; the entry commits only to
    the methylation-dependent chromatin regulation that both sides accept.
  evidence:
  - reference: PMID:32111972
    reference_title: "Rett syndrome-causing mutations compromise MeCP2-mediated liquid-liquid phase separation of chromatin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we found that MeCP2 can induce compaction and liquid-liquid phase separation of nucleosomal arrays in vitro, and DNA methylation further enhances formation of chromatin condensates by MeCP2"
    explanation: >-
      The case for the phase-separation model, from reconstituted nucleosomal
      arrays; the same study reports that Rett-causing mutations reduce or
      abolish condensate formation while benign variants do not.
  - reference: PMID:38719804
    reference_title: "MeCP2 binds to methylated DNA independently of phase separation and heterochromatin organisation."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "MeCP2 foci fail to show hallmarks of phase separation in live cells"
    explanation: >-
      The case against, measured in living cells rather than in reconstituted
      arrays.
  - reference: PMID:38719804
    reference_title: "MeCP2 binds to methylated DNA independently of phase separation and heterochromatin organisation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we find that mouse cellular models are highly atypical as MeCP2 distribution is diffuse in most mammalian species, including humans"
    explanation: >-
      Establishes the species mismatch that makes this a translational question:
      the focal MeCP2 distribution underpinning the phase-separation reading is
      a mouse trait, and human MeCP2 is diffusely distributed.
- discussion_id: rett_prenatal_versus_postnatal_contribution
  prompt: >-
    How much of the Rett phenotype is already set before birth, given that this
    entry models the disease as a failure of postnatal maturation following a
    period of apparently normal early development?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Dysregulated Neuronal Gene Expression
  - progression#Onset
  rationale: >-
    Human iPSC-derived cerebral organoids carrying the MECP2 T203M variant show
    disrupted neurogenesis with chromatin opening at AT-rich enhancers, pushing
    cells toward proliferation and away from neuronal differentiation. That is a
    prenatal-stage proxy, and it sits awkwardly with the clinical picture of
    normal development to 6-18 months that the progression section records. The
    stakes are practical rather than taxonomic: if a substantial share of the
    phenotype is fixed prenatally, postnatal gene replacement has a lower
    efficacy ceiling than the adult mouse reactivation experiments imply, and
    the three AAV-MECP2 trials curated here are the ones that would run into it.
    What is missing is any human in vivo measurement. One organoid line carrying
    one point mutation cannot establish that prenatal disruption occurs in
    patients, still less quantify its share.
  proposed_experiments:
  - experiment_id: rett_timed_conditional_mecp2_deletion
    name: Timed conditional Mecp2 deletion across prenatal and postnatal windows
    description: >-
      Delete Mecp2 in inducible conditional mice at embryonic day 14, postnatal
      day 0, postnatal day 14, and postnatal day 28, then assess behaviour,
      dendritic morphology, transcriptome, and electrophysiology at matched
      ages. A prenatal contribution predicts that embryonic deletion yields an
      earlier and more severe phenotype than the postnatal deletions; a purely
      postnatal mechanism predicts that embryonic and early postnatal deletion
      converge on the same endpoint.
    would_support:
    - pathophysiology#Dysregulated Neuronal Gene Expression
    supporting_outcome:
    - >-
      Embryonic deletion produces earlier onset and greater severity than
      matched postnatal deletion, establishing a prenatal contribution to the
      final phenotype.
    refuting_outcome:
    - >-
      Embryonic and early postnatal deletion produce indistinguishable
      phenotypes, confining the pathogenic window to postnatal maturation.
  evidence:
  - reference: PMID:41182667
    reference_title: "MECP2(T203M) mutation disrupts neurogenesis in human cerebral organoids by altering chromatin dynamics and transcriptional regulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings revealed a notably open chromatin state in the organoids with a mutated MECP2, particularly in the enhancer regions with a high proportion of adenine (A) and thymine (T) bases. This alteration induced the expression of genes related to proliferation but suppressed those associated with neuronal differentiation."
    explanation: >-
      The only direct evidence for prenatal-stage disruption in a human system,
      and the reason the gap is worth recording; it is a single organoid model
      of a single variant and does not establish that the same occurs in
      patients.
- discussion_id: rett_peripheral_tissue_autonomous_pathology
  prompt: >-
    Which peripheral features of Rett syndrome are tissue-autonomous
    consequences of MeCP2 loss in that organ rather than downstream of brain
    dysfunction, and how much do they contribute to clinical burden?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of MeCP2 Epigenetic Regulation
  - phenotypes#
  rationale: >-
    MECP2 is expressed ubiquitously, and two lines of evidence show peripheral
    pathology that is not secondary to the brain. Liver-targeted Mecp2 deletion
    in mice causes fatty liver and dyslipidemia with no neuronal deletion
    involved, and patient peripheral blood mononuclear cells carry a
    constitutively activated TLR4-IRAK1-NF-kB axis with NLRP3 inflammasome
    assembly from the earliest disease stages, correlating with mutation
    severity. This entry curates Rett syndrome as a brain disorder: every
    pathophysiology node is neural, and the phenotype list carries no hepatic,
    metabolic, or immune entry for these findings to attach to. That is a
    deliberate gap statement rather than a curation oversight, because the
    contribution of peripheral pathology to the clinical picture has not been
    quantified, and because the hepatic result is a mouse tissue-specific
    deletion whose human counterpart is limited to reported dyslipidemia.
  evidence:
  - reference: PMID:27288453
    reference_title: "MeCP2 co-ordinates liver lipid metabolism with the NCoR1/HDAC3 corepressor complex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we find that liver targeted deletion of Mecp2 causes fatty liver disease and dyslipidemia similar to HDAC3 liver-specific deletion"
    explanation: >-
      A tissue-specific deletion design, so the hepatic phenotype cannot be
      downstream of neuronal MeCP2 loss; the same study places MeCP2 as the
      anchor for the NCoR1/HDAC3 repressor complex at hepatic lipogenesis
      targets.
  - reference: PMID:35085773
    reference_title: "The constitutive activation of TLR4-IRAK1- NFκB axis is involved in the early NLRP3 inflammasome response in peripheral blood mononuclear cells of Rett syndrome patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RTT PBMCs showed a constitutive activation of the axis TLR4 (Toll-like receptor 4)-IRAK1 (interleukin-1 receptor associated kinase 1)-NF-κB p65, together with augmented ROS generation and enhanced IL-18 mRNA levels and NLRP3:ASC co-localization."
    explanation: >-
      Human evidence that innate immune activation is present in patient blood
      cells, and the study reports it from the earliest stages of disease and in
      correlation with MeCP2 mutation severity.

treatments:
- name: Lifelong Conduction Surveillance and Permanent Pacing
  description: >-
    Because atrioventricular block is progressive rather than fixed, a normal
    electrocardiogram at diagnosis does not discharge a carrier from follow-up.
    Serial electrocardiography, with permanent pacemaker implantation when block
    advances, is the management decision that addresses the sudden-death risk.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: permanent cardiac pacemaker implantation
    term:
      id: NCIT:C99998
      label: Pacemaker Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: permanent cardiac pacemaker
        term:
          id: NCIT:C99552
          label: Permanent Cardiac Pacemaker
  target_mechanisms:
  - target: Progressive Atrioventricular Conduction Delay
    description: >-
      Pacing substitutes for the failing atrioventricular node; it does not alter
      the underlying conduction-system hypoplasia.
  evidence:
  - reference: PMID:9651244
    reference_title: Congenital heart disease caused by mutations in the transcription factor NKX2-5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "for maturation and maintenance of atrioventricular node function throughout life"
    explanation: >-
      The lifelong maintenance role is why surveillance has to be lifelong rather
      than concluded in childhood; the quote supports the rationale, not a trial
      result.
    directness: INDIRECT
- name: Surgical or Transcatheter Closure of the Septal Defect
  description: >-
    Closure of a haemodynamically significant atrial or ventricular septal
    defect, on the same indications as in isolated disease. It does not address
    the conduction or myopathic arms, which continue to require surveillance
    afterwards.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cardiac septal defect repair
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Defective Cardiac Septum Morphogenesis
differential_diagnoses:
- name: Isolated secundum atrial septal defect
  description: >-
    The commonest alternative. The discriminator is the electrocardiogram and the
    family history: progressive atrioventricular block in the proband or in a
    structurally normal relative points to this gene rather than to an isolated
    defect. The dismech entry Atrial_Septal_Defect carries the ASD7 row for the
    atrial-septal component of this disease.
  evidence:
  - reference: PMID:9651244
    reference_title: Congenital heart disease caused by mutations in the transcription factor NKX2-5.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "A dominant disease locus associated with cardiac malformations and atrioventricular conduction abnormalities was mapped to chromosome 5q35"
    explanation: >-
      The co-occurrence of malformation with conduction abnormality in a dominant
      pedigree is the feature that separates this disease from an isolated septal
      defect; the quote supports the discriminator rather than a comparative study.
- name: Familial progressive cardiac conduction disease
  description: >-
    Progressive atrioventricular block without a structural defect, including
    SCN5A- and LMNA-related conduction disease. A septal defect anywhere in the
    family, or hypertrabeculation, favours NKX2-5.
- name: Left ventricular noncompaction of other genetic cause
  description: >-
    Sarcomeric and other LVNC genes produce hypertrabeculation without septation
    failure or early conduction block.
diagnosis:
- name: Electrocardiography with serial follow-up
  description: >-
    The test that detects the conduction arm and its progression. A single normal
    recording does not exclude future block.
  evidence:
  - reference: PMID:9651244
    reference_title: Congenital heart disease caused by mutations in the transcription factor NKX2-5.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "for maturation and maintenance of atrioventricular node function throughout life"
    explanation: >-
      A lifelong maintenance role for the gene at the atrioventricular node is why
      a single normal recording cannot discharge a carrier; the quote supports the
      rationale for serial testing rather than reporting a surveillance study.
- name: Echocardiography
  description: >-
    Detects the septal defect and the hypertrabeculated or dilated ventricle.
- name: NKX2-5 sequencing
  description: >-
    Confirms the diagnosis and enables cascade testing of relatives, who then
    enter conduction surveillance regardless of whether they have a structural
    defect.
notes: >-
  No GeneReviews chapter covers this disease. Checked with `just check-genereviews
  --online` against the committed Bookshelf index snapshot of 2026-09-10 (958
  GeneReviews chapters), from the disease side and from the NKX2-5 gene side, with
  the four synonyms recorded above in place: the result is NO_CHAPTER on both the
  GeneReviews and StatPearls lines. The online cross-check could not be completed
  because NCBI's esearch backend was returning HTTP 500 ("Cannot connect to SOLR")
  throughout the session, so the offline index is the whole of the evidence for
  that statement. The GeneReviews Dilated Cardiomyopathy Overview names NKX2-5
  among dilated cardiomyopathy genes, but it is a chapter about dilated
  cardiomyopathy rather than about this disease or this gene, so it is not the
  phenotype baseline here.

  NKX2-5 variants also contribute to thyroid dysgenesis and congenital
  hypothyroidism, with Nkx2-5-null embryos showing thyroid bud hypoplasia. That is
  deliberately out of scope for this entry: the disease this entry is bound to is
  a heart disease, and a thyroid phenotype would make the entry broader than both
  its name and its MONDO term. The dismech entry Congenital_Hypothyroidism is
  where that association belongs.
review_notes: >-
  Deliberately lumped. This entry covers atrial septal defect 7, variable
  conotruncal malformations, hypoplastic left heart syndrome 2, tetralogy of
  Fallot and ventricular septal defect 3, which carry separate OMIM numbers,
  because the ClinGen Hereditary Cardiovascular Disease GCEP lumped exactly these
  five under this MONDO term after applying the ClinGen Lumping and Splitting
  Working Group criteria and finding no difference in molecular mechanism or
  inheritance pattern between them. The entry therefore models them as alternative
  structural outcomes of one transcriptional lesion rather than as subtypes. The
  separate dismech entry Atrial_Septal_Defect carries an ASD7 subtype row for the
  atrial-septal component only, and its own review notes already record that the
  NKX2-5 conduction phenotype is a syndromic entity in its own right, curated
  here.

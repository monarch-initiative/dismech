    evidence:
    - reference: CGGV:assertion_c429ebe5-43ec-40e7-9d73-55bbbb44f6d1-2024-11-07T170000.000Z
      reference_title: "NKX2-5 / NKX2.5-related congenital, conduction and myopathic heart disease (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "later onset dilated cardiomyopathy and/or hypertrabeculation with predisposition to atrial and ventricular arrhythmias"
      explanation: >-
        ClinGen places the ventricular arrhythmic predisposition with the
        later-onset myopathic arm, which is the attachment this edge records.
  - target: Supraventricular arrhythmia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Atrial remodelling accompanying the myopathic arm predisposes to atrial
      arrhythmia.
    evidence:
    - reference: CGGV:assertion_c429ebe5-43ec-40e7-9d73-55bbbb44f6d1-2024-11-07T170000.000Z
      reference_title: "NKX2-5 / NKX2.5-related congenital, conduction and myopathic heart disease (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "later onset dilated cardiomyopathy and/or hypertrabeculation with predisposition to atrial and ventricular arrhythmias"
      explanation: >-

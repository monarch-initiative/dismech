  evidence:
  - reference: PMID:9651244
    reference_title: Congenital heart disease caused by mutations in the transcription factor NKX2-5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three different NKX2-5 mutations were identified."
    explanation: >-
      The founding allelic series, in the linkage study that established the gene.
inheritance:
- name: Autosomal dominant
  description: >-
    Autosomal dominant. The conduction arm is the most consistently penetrant
    feature and the structural and myopathic arms vary within a family, so an
    unaffected-looking carrier is not evidence against transmission.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: CGGV:assertion_c429ebe5-43ec-40e7-9d73-55bbbb44f6d1-2024-11-07T170000.000Z
    reference_title: "NKX2-5 / NKX2.5-related congenital, conduction and myopathic heart disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Phenotype is variable within families and individuals may have only some of these features."
    explanation: >-
      ClinGen's statement of intrafamilial variability, which is the basis for the
      caveat in this block's description.
  - reference: PMID:9651244
    reference_title: Congenital heart disease caused by mutations in the transcription factor NKX2-5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A dominant disease locus associated with cardiac malformations and atrioventricular conduction abnormalities was mapped to chromosome 5q35"
    explanation: >-
      The dominant transmission established by linkage in the defining report.
animal_models:
- name: Nkx2-5 trabecular conditional knockout mouse (Cx40-creERT2)
  species: Mouse
  genotype: Nkx2-5 floxed; Cx40-creERT2, tamoxifen-induced at E10.5-E11.5 or E13.5-E14.5
  publication: PMID:29979676
  description: >-
    Tamoxifen-inducible deletion of Nkx2-5 restricted to Cx40-expressing
    trabecular myocardium, at two developmental stages, which separates the
    myopathic arm of the disease from the septal arm.
  evidence:
  - reference: PMID:29979676
    reference_title: Deletion of Nkx2-5 in trabecular myocardium reveals the developmental origins of pathological heterogeneity associated with ventricular non-compaction cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "represents a highly tractable model to study the cellular and molecular mechanisms involved in the disease"
    explanation: >-
      The authors' own claim for the model's usefulness, which is what justifies
      treating it as informative for this entry's myopathic arm rather than as an
      unrelated conditional knockout.
  modeled_mechanisms:
  - target: Defective Ventricular Trabecular Compaction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Trabecular-restricted loss of Nkx2-5 reproduces hypertrabeculation with
      subendocardial fibrosis, and the severity depends on the stage at which the
      gene is removed.
    limitations: >-
      A conditional, tissue-restricted and complete deletion is not the human
      germline heterozygous state, so the model speaks to the sufficiency of
      trabecular Nkx2-5 loss rather than to what one reduced allele does across
      the whole heart.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's quantity is complete somatic ablation of Nkx2-5 within a
        Cx40-defined compartment. The human quantity is a halved gene dose in
        every cardiac cell from conception.
    evidence:
    - reference: PMID:29979676
      reference_title: Deletion of Nkx2-5 in trabecular myocardium reveals the developmental origins of pathological heterogeneity associated with ventricular non-compaction cardiomyopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we inactivated the cardiac transcription factor Nkx2-5 in trabecular myocardium at different stages of trabecular morphogenesis using an inducible Cx40-creERT2 allele"
      explanation: >-
        Establishes the genotype and the staged design that make this model
        informative for the compaction node.
    readouts:
    - name: Purkinje fibre network density and branching
      target: Defective Ventricular Trabecular Compaction
      direction: DECREASED
      interpretation: >-
        Structural readout tying the compaction defect to conduction-system
        hypoplasia in the same hearts.
      evidence:
      - reference: PMID:29979676
        reference_title: Deletion of Nkx2-5 in trabecular myocardium reveals the developmental origins of pathological heterogeneity associated with ventricular non-compaction cardiomyopathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Conditional deletion of Nkx2-5 at embryonic stages, during trabecular formation, provokes a severe hypertrabeculated phenotype associated with subendocardial fibrosis and Purkinje fiber hypoplasia."
        explanation: >-
          Reports the Purkinje hypoplasia measured in these hearts.

name: NKX2-5-Related Congenital, Conduction and Myopathic Heart Disease
creation_date: "2026-11-05T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: NKX2-5-related congenital, conduction and myopathic heart disease
  term:
    id: MONDO:0800441
    label: NKX2.5-related congenital, conduction and myopathic heart disease
synonyms:
- NKX2.5-related congenital, conduction and myopathic heart disease
- NKX2-5-related congenital heart disease
- atrial septal defect 7 with or without atrioventricular conduction defects
- CSX-related congenital heart disease
description: >-
  An autosomal dominant heart disease caused by heterozygous variants in NKX2-5,
  the cardiac homeodomain transcription factor at 5q35. One reduced gene dose
  produces three phenotypic arms that a single family may show in any
  combination: a congenital structural defect, most often a secundum atrial
  septal defect but also ventricular septal, conotruncal and left-heart
  hypoplastic lesions; atrioventricular conduction block that is progressive
  across a lifetime and carries a risk of syncope and sudden death; and a
  later-onset myopathic arm of hypertrabeculation or dilated cardiomyopathy with
  atrial and ventricular arrhythmia. The combination of septation failure with
  lifelong conduction decay reflects NKX2-5's two distinct roles, in cardiac
  morphogenesis and in the maturation and maintenance of the atrioventricular
  node.
parents:
- heart conduction disease
- familial cardiomyopathy
progression:
- phase: Congenital structural lesion
  notes: >-
    The septal, conotruncal, left-heart or tricuspid lesion is present at birth.
    This is the phase that usually brings the family to attention, and it is the
    only one of the three arms that is complete at birth.
- phase: Postnatal onset and progression of conduction block
  notes: >-
    Atrioventricular conduction block appears and worsens after birth, which is
    why a carrier with a normal electrocardiogram in childhood is not discharged.
    Repairing the septal defect does not arrest this arm.
  evidence:
  - reference: PMID:10587520
    reference_title: Mutations in the cardiac transcription factor NKX2.5 affect diverse cardiac developmental pathways.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "result in atrioventricular (AV) conduction block during postnatal life"
    explanation: >-
      Places the onset of block after birth, which is what separates this phase
      from the congenital one.
- phase: Later-onset myopathy and arrhythmia
  notes: >-
    Hypertrabeculation or dilated cardiomyopathy, atrial and ventricular
    arrhythmia, and the risk of sudden cardiac death accrue later, and carry the
    mortality of the disease.
  evidence:
  - reference: CGGV:assertion_c429ebe5-43ec-40e7-9d73-55bbbb44f6d1-2024-11-07T170000.000Z
    reference_title: "NKX2-5 / NKX2.5-related congenital, conduction and myopathic heart disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "AV block and later onset dilated cardiomyopathy and/or hypertrabeculation with predisposition to atrial and ventricular arrhythmias"
    explanation: >-
      ClinGen's own ordering of the arms in time, with the myopathic one recorded
      as later in onset.
references:
- reference: PMID:9651244
  title: Congenital heart disease caused by mutations in the transcription factor NKX2-5.
pathophysiology:
- name: NKX2-5 Haploinsufficiency
  description: >-
    Heterozygous NKX2-5 variants, either truncating or missense within the
    homeodomain, reduce the dose of functional cardiac homeodomain transcription
    factor. Most impair binding of NKX2-5 to its target DNA; some missense
    alleles additionally act dominant-negatively on the wild-type protein, and
    one reported allele instead augments target-DNA binding, so reduced dose is
    the common mechanism rather than the only one.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: NKX2-5
    term:
      id: hgnc:2488
      label: NKX2-5
  molecular_functions:
  - preferred_term: NKX2-5 DNA-binding transcription factor activity
    modifier: DECREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  evidence:
  - reference: PMID:9651244
    reference_title: Congenital heart disease caused by mutations in the transcription factor NKX2-5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two are predicted to impair binding of NKX2-5 to target DNA, resulting in haploinsufficiency, and a third potentially augments target-DNA binding."
    explanation: >-
      The defining report's own account of the molecular consequence of the three
      founding alleles, including the one allele that does not fit the
      haploinsufficiency model.
  - reference: CGGV:assertion_c429ebe5-43ec-40e7-9d73-55bbbb44f6d1-2024-11-07T170000.000Z
    reference_title: "NKX2-5 / NKX2.5-related congenital, conduction and myopathic heart disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Variants causing this phenotype appear to be either truncating or missense within the homeodomain."
    explanation: >-
      ClinGen's synthesis across eighteen reports of where in the protein the
      disease-causing alleles fall, which is what restricts this node to
      truncating and homeodomain missense variants.
  downstream:
  - target: Impaired Cardiac Transcriptional Program
    causal_link_type: DIRECT
    description: >-
      Reduced NKX2-5 activity lowers transactivation of its target genes. The
      routes to that reduced activity differ by allele: a reduced protein dose,
      impaired DNA binding at a normal dose, or, for the allele quoted here,
      failure of the protein to reach the nucleus at all.
    evidence:
    - reference: PMID:20932824
      reference_title: "A de novo mutation in NKX2.5 associated with atrial septal defects, ventricular noncompaction, syncope and sudden death."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional studies indicate that the c.512insGC mutation impedes nuclear localization of NKX2.5 and causes a total loss of transactivation activity of NKX2.5."
      explanation: >-
        A reporter assay showing that a disease allele abolishes NKX2-5
        transactivation, which is the step connecting the variant to a failed
        transcriptional program rather than either node alone.
- name: Impaired Cardiac Transcriptional Program
  description: >-
    Reduced NKX2-5 transactivation lowers expression of its target genes in the
    developing septa and outflow tract, in the forming conduction system, and in
    trabecular myocardium, which is why one allele yields arms that dissociate
    from each other. NKX2-5 is known to act combinatorially with other cardiac
    transcription factors, but no source cited in this entry names those partners,
    so they are deliberately not listed here.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: NKX2-5-dependent transcription of cardiac target genes
    modifier: DECREASED
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:9651244
    reference_title: Congenital heart disease caused by mutations in the transcription factor NKX2-5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data indicate that NKX2-5 is important for regulation of septation during cardiac morphogenesis and for maturation and maintenance of atrioventricular node function throughout life."
    explanation: >-
      States the two separable developmental roles that this node's downstream
      branches represent, and that the nodal role is a lifelong maintenance role
      rather than a developmental one only.
  downstream:
  - target: Defective Cardiac Septum Morphogenesis
    causal_link_type: DIRECT
  - target: Defective Outflow Tract and Valve Morphogenesis
    causal_link_type: DIRECT
  - target: Cardiac Conduction System Hypoplasia
    causal_link_type: DIRECT
  - target: Ectopic Ventricular BMP10 Expression
    causal_link_type: DIRECT
  - target: Defective Ventricular Trabecular Compaction
    causal_link_type: DIRECT
    description: >-
      Ventricular myocytes fail to be specified into their trabecular and
      conduction-system fates, which is the lineage reading of the compaction
      defect.
    evidence:
    - reference: PMID:15109497
      reference_title: Nkx2-5 pathways and congenital heart disease; loss of ventricular myocyte lineage specification leads to progressive cardiomyopathy and complete heart block.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "loss of ventricular muscle cell lineage specification into trabecular and conduction system myocytes is a new mechanistic pathway for progressive cardiomyopathy and conduction defects in congenital heart disease."
      explanation: >-
        States the mechanism as a lineage-specification failure feeding both the
        myopathic and the conduction arms, which is how this entry branches them.
- name: Defective Cardiac Septum Morphogenesis
  description: >-
    Reduced NKX2-5 activity during septation leaves the atrial septum incomplete,
    most often as an ostium secundum defect, and less often leaves the
    interventricular septum incomplete. This node covers the septal lesions only;
    the outflow-tract and left-heart lesions in this disease's spectrum are a
    separate morphogenetic failure and are modelled as their own node.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: cardiac septum morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0060411
      label: cardiac septum morphogenesis
  evidence:
  - reference: PMID:9651244
    reference_title: Congenital heart disease caused by mutations in the transcription factor NKX2-5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the gene encoding the homeobox transcription factor NKX2-5 were found to cause nonsyndromic, human congenital heart disease."
    explanation: >-
      Establishes that the structural malformation is caused by the NKX2-5
      genotype and is non-syndromic, so the defect is cardiac-restricted rather
      than part of a malformation syndrome.
  - reference: PMID:22534315
    reference_title: Complex trait analysis of ventricular septal defects caused by Nkx2-5 mutation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Genetic linkage analysis mapped loci with lod scores of 5 to 7 on chromosomes 6, 8, and 10 that influence the susceptibility to membranous VSDs in Nkx2-5(+/-) animals."
    explanation: >-
      A result rather than an aim: heterozygous Nkx2-5 loss produces septal
      defects in the mouse at a penetrance set by modifier loci, which is the
      experimental counterpart of the human septation claim and the reason this
      entry records genetic modifiers separately.
  downstream:
  - target: Secundum atrial septal defect
    causal_link_type: DIRECT
  - target: Ventricular septal defect
    causal_link_type: DIRECT
- name: Defective Outflow Tract and Valve Morphogenesis
  description: >-
    NKX2-5 is required beyond the septa. The same transcriptional deficit also
    disturbs outflow-tract alignment and septation of the conotruncus, the
    tricuspid valve, and the growth of the left heart, which is why conotruncal
    malformation, Ebstein anomaly and other tricuspid abnormalities, double
    outlet right ventricle and left-heart hypoplasia all appear in this gene's
    reported spectrum. These are separated from the septal node because a
    conotruncal or left-heart lesion is not a failure of septation.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: outflow tract morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0003151
      label: outflow tract morphogenesis
  evidence:
  - reference: PMID:10587520
    reference_title: Mutations in the cardiac transcription factor NKX2.5 affect diverse cardiac developmental pathways.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The coinheritance of NKX2.5 mutations with various congenital heart defects suggests that this transcription factor contributes to diverse cardiac developmental pathways."
    explanation: >-
      The cohort study's own conclusion that this gene feeds more than one
      developmental pathway, which is the basis for modelling the non-septal
      lesions as a separate morphogenetic failure rather than as septation
      defects.
  - reference: PMID:10587520
    reference_title: Mutations in the cardiac transcription factor NKX2.5 affect diverse cardiac developmental pathways.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Ebstein's anomaly and other tricuspid valve abnormalities were also present."
    explanation: >-
      The tricuspid lesions this node carries, observed in the same NKX2-5
      mutation cohort.
  downstream:
  - target: Conotruncal defect
    causal_link_type: DIRECT
  - target: Tetralogy of Fallot
    causal_link_type: DIRECT
  - target: Double outlet right ventricle
    causal_link_type: DIRECT
  - target: Ebstein anomaly of the tricuspid valve
    causal_link_type: DIRECT
  - target: Abnormal tricuspid valve morphology
    causal_link_type: DIRECT
  - target: Hypoplastic left ventricle
    causal_link_type: DIRECT
- name: Cardiac Conduction System Hypoplasia
  description: >-
    NKX2-5 is required for the development and the lifelong maintenance of the
    atrioventricular node and the His-Purkinje network. Reduced dosage yields an
    anatomically and functionally deficient conduction system whose reserve
    declines with age, which is why the block is progressive rather than fixed at
    birth.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: cardiac conduction system development
    modifier: ABNORMAL
    term:
      id: GO:0003161
      label: cardiac conduction system development
  cell_types:
  - preferred_term: nodal myocyte
    term:
      id: CL:0002072
      label: nodal myocyte
  - preferred_term: Purkinje myocyte
    term:
      id: CL:0002068
      label: Purkinje myocyte
  evidence:
  - reference: PMID:15085192
    reference_title: Nkx2-5 mutation causes anatomic hypoplasia of the cardiac conduction system.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "We show in KO mice that the number of cells in the cardiac conduction system is directly related to Nkx2-5 gene dosage."
    explanation: >-
      Establishes that conduction-system cellularity is a function of NKX2-5 gene
      dose, which is what makes a hypoplastic conduction system the consequence of
      one lost allele rather than of a qualitatively different mechanism.
  - reference: PMID:15085192
    reference_title: Nkx2-5 mutation causes anatomic hypoplasia of the cardiac conduction system.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "In Nkx2-5 haploinsufficiency, the conduction system has half the normal number of cells."
    explanation: >-
      Quantifies the deficit at the heterozygous dose that corresponds to the
      human genotype.
  - reference: PMID:15085192
    reference_title: Nkx2-5 mutation causes anatomic hypoplasia of the cardiac conduction system.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Specific functional defects associated with Nkx2-5 loss of function can be attributed to hypoplastic development of the relevant structures in the conduction system."
    explanation: >-
      Attributes the electrical phenotype to an anatomical deficit, which is the
      distinction this node makes against a purely channel-level conduction
      defect.
  - reference: PMID:29979676
    reference_title: Deletion of Nkx2-5 in trabecular myocardium reveals the developmental origins of pathological heterogeneity associated with ventricular non-compaction cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These mice display ventricular conduction defects that can be correlated with hypoplastic development of the His-Purkinje system"
    explanation: >-
      An independent group's statement of the same anatomical basis, here for the
      His-Purkinje limb rather than the node.
    quote_role: BACKGROUND
  downstream:
  - target: Postnatal Conduction Cell Dropout
    causal_link_type: DIRECT
    description: >-
      A conduction system built with too few cells has no reserve against the
      postnatal attrition of those cells.
    evidence:
    - reference: PMID:15085192
      reference_title: Nkx2-5 mutation causes anatomic hypoplasia of the cardiac conduction system.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Postnatal conduction defects in Nkx2-5 mutation may result at least in part from a defect in the genetic program that governs the recruitment or retention of embryonic cardiac myocytes in the conduction system."
      explanation: >-
        Names retention of conduction myocytes, not only their initial
        recruitment, as the failing program, which is the step from a hypoplastic
        system to a progressively depleted one.
- name: Postnatal Conduction Cell Dropout
  description: >-
    The atrioventricular node is already hypoplastic at birth and then loses
    conduction cells selectively over postnatal life. This is the step that makes
    the block progressive rather than a fixed congenital deficit, and it is why a
    normal electrocardiogram in childhood does not predict a normal one in
    adulthood.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: nodal myocyte
    term:
      id: CL:0002072
      label: nodal myocyte
  evidence:
  - reference: PMID:15109497
    reference_title: Nkx2-5 pathways and congenital heart disease; loss of ventricular myocyte lineage specification leads to progressive cardiomyopathy and complete heart block.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "At birth, mutant mice display a hypoplastic atrioventricular (AV) node and then develop selective dropout of these conduction cells."
    explanation: >-
      Separates the congenital deficit from the progressive one in the same
      animals, which is the observation this node exists to carry.
  downstream:
  - target: Progressive Atrioventricular Conduction Delay
    causal_link_type: DIRECT
- name: Progressive Atrioventricular Conduction Delay
  description: >-
    Atrioventricular conduction deteriorates over years, from PR prolongation
    through higher-grade block to complete atrioventricular block, which is the
    substrate for syncope and sudden death and the reason lifelong
    electrocardiographic surveillance is the central management decision.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: cardiac conduction
    modifier: DECREASED
    term:
      id: GO:0061337
      label: cardiac conduction
  evidence:
  - reference: PMID:29979676
    reference_title: Deletion of Nkx2-5 in trabecular myocardium reveals the developmental origins of pathological heterogeneity associated with ventricular non-compaction cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Nkx2-5+/- haploinsufficient mice have an abnormal electrocardiogram, with a prolonged QRS and progressive elongation of the PR interval"
    explanation: >-
      The progressive, rather than fixed, character of the conduction delay in the
      haploinsufficient mouse. The sentence is this paper's restatement of earlier
      work, so it reports no method of its own.
    quote_role: BACKGROUND
  downstream:
  - target: First degree atrioventricular block
    causal_link_type: DIRECT
  - target: Atrioventricular block
    causal_link_type: DIRECT
  - target: Syncope
    causal_link_type: DIRECT
    description: >-
      High-grade block with an inadequate escape rate causes transient cerebral
      hypoperfusion.
    evidence:
    - reference: PMID:20932824
      reference_title: "A de novo mutation in NKX2.5 associated with atrial septal defects, ventricular noncompaction, syncope and sudden death."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a CHD family with atrial septal defects (ASDs), atrioventricular block, ventricular noncompaction, syncope and sudden death."
      explanation: >-
        Conduction block and syncope co-segregating in one NKX2-5 family, which is
        the observation this edge records.
  - target: Sudden cardiac death
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Complete atrioventricular block without adequate escape rhythm causes
      syncope and can cause sudden death; the intermediate steps are bradycardia
      and haemodynamic collapse or secondary ventricular arrhythmia.
    evidence:
    - reference: PMID:20932824
      reference_title: "A de novo mutation in NKX2.5 associated with atrial septal defects, ventricular noncompaction, syncope and sudden death."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a CHD family with atrial septal defects (ASDs), atrioventricular block, ventricular noncompaction, syncope and sudden death."
      explanation: >-
        A single family in which conduction block, syncope and sudden death
        co-segregate, which is the clinical observation behind this edge.
- name: Ectopic Ventricular BMP10 Expression
  description: >-
    Loss of NKX2-5 in ventricular myocardium derepresses BMP10, which is normally
    restricted in the adult ventricle, and the ectopic BMP10 signal is itself
    required for much of the trabecular muscle overgrowth. No HGNC identifier is
    bound for BMP10 here because none could be sourced offline in this session;
    the BMP pathway is bound instead.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: ectopic ventricular BMP10 signalling
    modifier: INCREASED
    term:
      id: GO:0030509
      label: BMP signaling pathway
  evidence:
  - reference: PMID:15109497
    reference_title: Nkx2-5 pathways and congenital heart disease; loss of ventricular myocyte lineage specification leads to progressive cardiomyopathy and complete heart block.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "ectopic, high level BMP-10 expression in the adult ventricular myocardium"
    explanation: >-
      The transcriptional profiling result that identifies BMP10 derepression as a
      consequence of ventricular NKX2-5 loss.
  downstream:
  - target: Defective Ventricular Trabecular Compaction
    causal_link_type: DIRECT
    description: >-
      Ectopic BMP10 is not merely correlated with the trabecular phenotype; it is
      required for a major part of it.
    evidence:
    - reference: PMID:15109497
      reference_title: Nkx2-5 pathways and congenital heart disease; loss of ventricular myocyte lineage specification leads to progressive cardiomyopathy and complete heart block.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "BMP-10 is shown to be necessary and sufficient for a major component of the ventricular muscle defects."
      explanation: >-
        A necessity-and-sufficiency claim, which is what justifies drawing this as
        a causal edge rather than an association.
- name: Defective Ventricular Trabecular Compaction
  description: >-
    The same reduced NKX2-5 dosage disturbs compaction of the ventricular
    trabecular myocardium, producing a hypertrabeculated or noncompacted
    ventricle with subendocardial fibrosis, and a later-onset dilated and
    arrhythmogenic myopathy. The severity tracks the developmental stage at which
    NKX2-5 activity is lost.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: ventricular trabecula myocardium morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0003222
      label: ventricular trabecula myocardium morphogenesis
  evidence:
  - reference: PMID:29979676
    reference_title: Deletion of Nkx2-5 in trabecular myocardium reveals the developmental origins of pathological heterogeneity associated with ventricular non-compaction cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Conditional deletion of Nkx2-5 at embryonic stages, during trabecular formation, provokes a severe hypertrabeculated phenotype associated with subendocardial fibrosis and Purkinje fiber hypoplasia."
    explanation: >-
      Trabecular-restricted loss of Nkx2-5 is sufficient to produce the
      noncompaction phenotype, which places this arm downstream of the same
      transcriptional deficit rather than of the septal defect.
  - reference: PMID:29979676
    reference_title: Deletion of Nkx2-5 in trabecular myocardium reveals the developmental origins of pathological heterogeneity associated with ventricular non-compaction cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results provide insights into the etiology of LVNC and link its pathogenicity with compromised trabecular development including compaction defects and ventricular conduction system hypoplasia."
    explanation: >-
      Ties the myopathic and conduction arms to one developmental lesion, which is
      the reason this entry models them as siblings under one transcriptional
      node.
  downstream:
  - target: Left ventricular noncompaction
    causal_link_type: DIRECT
  - target: Dilated cardiomyopathy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The noncompacted, fibrotic ventricle remodels over years into a dilated and
      functionally impaired chamber.
    evidence:
    - reference: PMID:29979676
      reference_title: Deletion of Nkx2-5 in trabecular myocardium reveals the developmental origins of pathological heterogeneity associated with ventricular non-compaction cardiomyopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A longitudinal study of cardiac function in adult Nkx2-5 conditional mutant mice demonstrates that excessive trabeculation is associated with complex ventricular conduction defects, progressively leading to strain defects, and, in 50% of mutant mice, to heart failure."
      explanation: >-
        Longitudinal evidence that the hypertrabeculated ventricle progresses to

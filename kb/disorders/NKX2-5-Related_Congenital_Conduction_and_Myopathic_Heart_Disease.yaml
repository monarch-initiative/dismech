    In the mouse, maternal age modifies the risk that a heterozygous Nkx2-5
    genotype produces a septal defect, and it does so only in mutant offspring.
    This is a modifier of penetrance in a model organism, not an established human
    risk factor, and it is recorded as MODULATES rather than as a trigger.
  exposure_term:
    preferred_term: advanced maternal age
  notes: >-
    No ontology term is bound. ECTO has no maternal-age class: searching OLS
    (ontologyId=ecto) for "maternal age" returns only ECTO:0300011 exposure to
    opioid agent via maternal, and neither cache/ecto/terms.csv nor
    cache/xco/terms.csv holds a maternal-age or parental-age row. Maternal age is
    a parental characteristic rather than an exposure to a substance, so no ECTO
    class is expected to fit; a wrong binding would be worse than none.
  influences_mechanisms:
  - target: Defective Cardiac Septum Morphogenesis
    environmental_effect: MODULATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Maternal age shifts the probability that the septal defect occurs at a given
      genotype; the mechanism linking the two is not established.
    evidence:
    - reference: PMID:22534315
      reference_title: Complex trait analysis of ventricular septal defects caused by Nkx2-5 mutation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Multiple logistic regression analysis for environmental variables revealed that maternal age is correlated with the risk of membranous and muscular VSD in Nkx2-5(+/-) but not wild-type animals."
      explanation: >-
        The genotype-restricted maternal-age effect, which is what makes this a
        modifier of this disease's penetrance rather than a general risk factor
        for septal defects.
  evidence:
  - reference: PMID:22534315
    reference_title: Complex trait analysis of ventricular septal defects caused by Nkx2-5 mutation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "The maternal age effect is unrelated to aneuploidy or a genetic polymorphism in the affected individuals."
    explanation: >-
      Excludes the two obvious confounders for a maternal-age association, which
      is why it is recorded as a modifier at all rather than dismissed.
treatments:
- name: Lifelong Conduction Surveillance and Permanent Pacing
  description: >-
    Because atrioventricular block is progressive rather than fixed, a normal
    electrocardiogram at diagnosis does not discharge a carrier from follow-up.
    Serial electrocardiography, with permanent pacemaker implantation when block
    advances, is the management decision that addresses the bradyarrhythmic mode
    of death. It does not cover the arrhythmic mode: pacing substitutes for a
    failing node and does nothing about ventricular arrhythmia arising from the
    myopathic arm, which is the separate question the defibrillator entry records.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: permanent cardiac pacemaker implantation
    term:
      id: NCIT:C99998
      label: Pacemaker Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: permanent cardiac pacemaker
        term:
          id: NCIT:C99552
          label: Permanent Cardiac Pacemaker
  target_mechanisms:
  - target: Progressive Atrioventricular Conduction Delay
    description: >-
      Pacing substitutes for the failing atrioventricular node; it does not alter
      the underlying conduction-system hypoplasia.
  evidence:
  - reference: PMID:9651244
    reference_title: Congenital heart disease caused by mutations in the transcription factor NKX2-5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "for maturation and maintenance of atrioventricular node function throughout life"
    explanation: >-
      The lifelong maintenance role is why surveillance has to be lifelong rather
      than concluded in childhood; the quote supports the rationale, not a trial
      result.
    directness: INDIRECT
- name: Implantable Cardioverter-Defibrillator Consideration in Mutation Carriers
  description: >-
    The review that pooled the published cohort proposed considering an
    implantable cardioverter-defibrillator in NKX2-5 mutation carriers from
    families with atrial septal defect and conduction disturbance, on the strength
    of the sudden-death rate in those families. This is a proposal from a
    literature review rather than a trial result or a guideline recommendation,
    and it is recorded here as such; the decision in practice follows the general
    cardiomyopathy and conduction-disease guidelines.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: implantable cardioverter-defibrillator
        term:
          id: NCIT:C93238
          label: Implantable Cardioverter-Defibrillator
  target_mechanisms:
  - target: Sudden cardiac death
    description: >-
      A defibrillator addresses the arrhythmic mode of death. The sudden-death
      rate in these families is the reason the cited review proposes it, so this
      is the outcome it targets.
  - target: Ventricular arrhythmia
    description: >-
      The arrhythmia a defibrillator terminates, which arises from the myopathic
      arm rather than from the conduction deficit that pacing covers.
  evidence:
  - reference: PMID:26679770
    reference_title: "Familial Atrial Septal Defect and Sudden Cardiac Death: Identification of a Novel NKX2-5 Mutation and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "if they are mutation carriers, implantation of an implantable cardioverter-defibrillator should be considered in these patients"
    explanation: >-
      The proposal itself, quoted so the strength of the recommendation is visible
      rather than paraphrased into something firmer.
- name: Surgical or Transcatheter Closure of the Septal Defect
  description: >-
    Closure of a haemodynamically significant atrial or ventricular septal
    defect, on the same indications as in isolated disease. It does not address
    the conduction or myopathic arms, which continue to require surveillance
    afterwards.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cardiac septal defect repair
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Defective Cardiac Septum Morphogenesis
differential_diagnoses:
- name: Isolated secundum atrial septal defect
  description: >-
    The commonest alternative. The discriminator is the electrocardiogram and the
    family history: progressive atrioventricular block in the proband or in a
    structurally normal relative points to this gene rather than to an isolated
    defect. The dismech entry Atrial_Septal_Defect carries the ASD7 row for the
    atrial-septal component of this disease.
  evidence:
  - reference: PMID:9651244
    reference_title: Congenital heart disease caused by mutations in the transcription factor NKX2-5.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "A dominant disease locus associated with cardiac malformations and atrioventricular conduction abnormalities was mapped to chromosome 5q35"
    explanation: >-
      The co-occurrence of malformation with conduction abnormality in a dominant
      pedigree is the feature that separates this disease from an isolated septal
      defect; the quote supports the discriminator rather than a comparative study.
- name: Familial progressive cardiac conduction disease
  description: >-
    Progressive atrioventricular block without a structural defect, including
    SCN5A- and LMNA-related conduction disease. A septal defect anywhere in the
    family, or hypertrabeculation, favours NKX2-5.
- name: Left ventricular noncompaction of other genetic cause
  description: >-
    Sarcomeric and other LVNC genes produce hypertrabeculation without septation
    failure or early conduction block.
diagnosis:
- name: Electrocardiography with serial follow-up
  description: >-
    The test that detects the conduction arm and its progression. A single normal
    recording does not exclude future block.
  evidence:
  - reference: PMID:9651244
    reference_title: Congenital heart disease caused by mutations in the transcription factor NKX2-5.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "for maturation and maintenance of atrioventricular node function throughout life"
    explanation: >-
      A lifelong maintenance role for the gene at the atrioventricular node is why
      a single normal recording cannot discharge a carrier; the quote supports the
      rationale for serial testing rather than reporting a surveillance study.
- name: Echocardiography
  description: >-
    Detects the septal defect and the hypertrabeculated or dilated ventricle.
- name: NKX2-5 sequencing
  description: >-
    Confirms the diagnosis and enables cascade testing of relatives, who then
    enter conduction surveillance regardless of whether they have a structural
    defect.
notes: >-
  No GeneReviews chapter names this disease or the NKX2-5 gene in the committed
  Bookshelf index snapshot of 2026-09-10, so there is no GeneReviews phenotype
  baseline for this entry. Verify with `just check-genereviews`, which is the
  check a reviewer runs.

  NKX2-5 variants also contribute to thyroid dysgenesis and congenital
  hypothyroidism, with Nkx2-5-null embryos showing thyroid bud hypoplasia. That is
  deliberately out of scope for this entry: the disease this entry is bound to is
  a heart disease, and a thyroid phenotype would make the entry broader than both
  its name and its MONDO term. The dismech entry Congenital_Hypothyroidism is
  where that association belongs.

  No HGNC identifier is bound for BMP10 on the ectopic-BMP10 node. HGNC's REST
  API is not reachable from this environment, BMP10 has no row in
  `cache/hgnc/terms.csv` or in `kb/genes/ingest/hgnc.tsv`, and the only remaining
  offline route is the 1 GB local HGNC build. The BMP pathway is bound instead,
  and the gene is named in the node description; binding the gene is a one-line
  change for anyone who has that build.

review_notes: >-
  Deliberately lumped. This entry covers atrial septal defect 7, variable
  conotruncal malformations, hypoplastic left heart syndrome 2, tetralogy of
  Fallot and ventricular septal defect 3, which carry separate OMIM numbers,
  because the ClinGen Congenital Heart Disease Gene Curation Expert Panel lumped
  exactly these five under this MONDO term after applying the ClinGen Lumping and
  Splitting Working Group criteria and finding no difference in molecular
  mechanism or inheritance pattern between them. That panel made the
  classification and the lumping call; the Hereditary Cardiovascular Disease GCEP
  later updated the summary text to expand the cardiomyopathy and arrhythmia
  detail, and did not make the lumping decision. The entry therefore models them as alternative
  structural outcomes of one transcriptional lesion rather than as subtypes. The
  separate dismech entry Atrial_Septal_Defect carries an ASD7 subtype row for the
  atrial-septal component only, and its own review notes already record that the
  NKX2-5 conduction phenotype is an entity in its own right, represented there
  only by its atrial-septal component. That entry predates this one and does not
  point at it, and `curated_in` is not the way to make that pointer
  machine-readable. That slot marks a stratum promoted to its own entry, where
  the entry is the stratum and its content lives there in full, so a consumer
  counting diseases skips the row. Neither holds here: this entry is broader than
  ASD7, covering four further structural lesions and the conduction and myopathic
  arms, and the ASD7 row keeps its own description and evidence for the
  atrial-septal component, which nothing else curates in full. The terms disagree
  accordingly, MONDO:0007173 against this entry's MONDO:0800441, which is what
  `just check-granularity` reports as POINTER_TERM_MISMATCH once the slot is
  filled in. The cross-reference therefore stays prose on both sides.

  Four further entries already carry NKX2-5 content for arms this entry claims,
  and they are making different claims rather than duplicating this one.
  Hypoplastic_Left_Heart_Syndrome maps MONDO:0013752, the NKX2-5-defined child of
  its own anchor, with skos:narrowMatch, and its justification states that it
  treats NKX2-5 as a susceptibility contribution to a convergent phenotype rather
  than as a Mendelian subtype. Tetralogy_of_Fallot carries an NKX2-5 row quantified
  at 0.9 percent of an unselected cohort, which places the gene among the minor
  contributors to that phenotype. Ventricular_Septal_Defect carries an NKX2-5 row
  within the septation transcription-factor network, citing the same PMID:22534315
  used here. Congenital_Heart_Disease quotes PMID:9651244 for the gene's general
  role. None of these contradicts this entry: they describe how much of a common
  malformation this gene explains, which is small, while this entry describes the
  Mendelian disease the gene definitively causes, whose spectrum includes those
  malformations. A reader moving between the files should read the difference that
  way round.

  No OMIM or MONDO mappings are recorded for the five lumped entities, and that is
  a decision rather than an omission. DiseaseMappings has no OMIM slot, so the
  five OMIM identifiers could only be carried as their MONDO equivalents, and for
  four of the five those equivalents are the generic phenotype classes that
  Tetralogy_of_Fallot, Ventricular_Septal_Defect and Hypoplastic_Left_Heart_Syndrome
  are anchored to. Mapping those with skos:narrowMatch would assert that all
  tetralogy of Fallot, or all left-heart hypoplasia, is narrower than this
  NKX2-5-defined disease, which is false and would also retire those concepts from
  the curation queue wrongly. The one genuinely gene-defined class,
  MONDO:0013752, is already mapped with narrowMatch from
  Hypoplastic_Left_Heart_Syndrome, so claiming it again here would leave two
  entries asserting ownership of one concept. The five OMIM identifiers are
  therefore left where they are checkable, in the quoted ClinGen record.

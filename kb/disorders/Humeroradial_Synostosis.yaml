    reference_title: "Juberg-Hayward syndrome is a cohesinopathy, caused by mutation in ESCO2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cleft lip/palate, microcephaly, ptosis, short stature, hypoplasia or aplasia of thumbs
    explanation: >-
      Short stature is part of the Juberg-Hayward syndromic HRS phenotype.
treatments:
- name: Resection Arthroplasty / Corrective Osteotomy
  description: >
    Surgical resection arthroplasty (trapezoidal resection osteotomy) of the
    humeroradial fusion can restore elbow arc of motion and forearm
    pronation/supination, improving range of motion and quality of life when
    performed by an experienced surgeon. Corrective osteotomy is the mainstay
    intervention for established bony ankylosis.
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  therapeutic_modality: SURGERY
  action_category: THERAPEUTIC
  target_mechanisms:
  - target: Humeroradial Bony Fusion and Elbow Ankylosis
    treatment_effect: BYPASSES
    description: >
      Trapezoidal surgical resection of the osseous bridge between the humerus
      and radius mechanically separates the fused elbow joint to restore passive
      and active elbow motion.
    evidence:
    - reference: PMID:38494163
      reference_title: "Resection Arthroplasty Is a Valuable Strategy for Humeroradial Synostosis - A Case Report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        When performed by an experienced surgeon, resection arthroplasty corrects humeroradial synostosis, resulting in improvement in range of motion and quality of life.
      explanation: >
        Demonstrates that surgical resection arthroplasty directly addresses the
        humeroradial bony union and restores elbow motion.
  target_phenotypes:
  - preferred_term: Humeroradial Synostosis
    term:
      id: HP:0003041
      label: Humeroradial synostosis
  - preferred_term: Elbow Ankylosis
    term:
      id: HP:0003070
      label: Elbow ankylosis
  - preferred_term: Limitation of joint mobility
    term:
      id: HP:0001376
      label: Limitation of joint mobility
  evidence:
  - reference: PMID:38494163
    reference_title: "Resection Arthroplasty Is a Valuable Strategy for Humeroradial Synostosis - A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When performed by an experienced surgeon, resection arthroplasty corrects humeroradial synostosis, resulting in improvement in range of motion and quality of life.
    explanation: >-
      Supports resection arthroplasty as an effective corrective intervention
      for humeroradial synostosis.
differential_diagnoses:
- name: Antley-Bixler Syndrome
  disease_term:
    preferred_term: Antley-Bixler syndrome
    term:
      id: MONDO:0008803
      label: Antley-Bixler syndrome
  description: >
    Autosomal recessive or dominant syndromic craniosynostosis caused by
    variants in POR (cytochrome P450 oxidoreductase) or FGFR2 in which
    radiohumeral (humeroradial) synostosis is a cardinal diagnostic feature
    alongside complex craniosynostosis and midfacial hypoplasia.
  distinguishing_features:
  - Complex multisuture craniosynostosis with severe midfacial hypoplasia and choanal stenosis or upper airway impairment
  - Congenital femoral bowing and fractures
  - Disordered steroidogenesis and urogenital anomalies in POR-deficient cases
  evidence:
  - reference: PMID:21146417
    reference_title: "Antley-Bixler-syndrome--staged management of craniofacial malformations from birth to adolescence--a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 1975 Antley and Bixler described an unusual syndromal disorder consisting of complex craniosynostosis with midfacial hypoplasia, dysplasia of ears and nose, radiohumeral synostosis, congenital fractures of the femur and upper airway impairment in a newborn.
    explanation: >-
      Defines the craniofacial and skeletal features that distinguish
      Antley-Bixler syndrome from isolated humeroradial synostosis.
  - reference: PMID:27410456
    reference_title: "Biallelic mutations in CYP26B1: A differential diagnosis for Pfeiffer and Antley-Bixler syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This woman homozygous for c.1303G>A; p.(Gly435Ser) in CYP26B1, which was associated with multisutural synostosis, radiohumeral synostosis, normal bone mineral density, and apparent intellectual disability, a phenotype with significant similarities to Antley-Bixler and Pfeiffer syndromes.
    explanation: >-
      Identifies Antley-Bixler syndrome as a key differential diagnosis among
      disorders presenting with radiohumeral synostosis and craniosynostosis.
- name: Pfeiffer Syndrome
  disease_term:
    preferred_term: Pfeiffer syndrome
    term:
      id: MONDO:0007043
      label: Pfeiffer syndrome
  description: >
    Autosomal dominant FGFR1/FGFR2-related craniosynostosis syndrome that can
    present with radiohumeral synostosis of the elbow and overlaps clinically
    with CYP26B1-related skeletal dysplasia and Antley-Bixler syndrome.
  distinguishing_features:
  - Broad, medially deviated thumbs and halluces
  - Turribrachycephaly with midface hypoplasia and ocular proptosis
  - Heterozygous activating FGFR1 or FGFR2 variants
  evidence:
  - reference: PMID:27410456
    reference_title: "Biallelic mutations in CYP26B1: A differential diagnosis for Pfeiffer and Antley-Bixler syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This woman homozygous for c.1303G>A; p.(Gly435Ser) in CYP26B1, which was associated with multisutural synostosis, radiohumeral synostosis, normal bone mineral density, and apparent intellectual disability, a phenotype with significant similarities to Antley-Bixler and Pfeiffer syndromes.
    explanation: >-
      Establishes Pfeiffer syndrome as a principal differential diagnosis for
      patients presenting with radiohumeral synostosis and calvarial synostosis.
- name: Multiple Synostoses Syndrome
  disease_term:
    preferred_term: multiple synostoses syndrome
    term:
      id: MONDO:0017923
      label: multiple synostoses syndrome
  description: >
    Autosomal dominant joint-fusion disorder group (SYNS1-4; NOG, GDF5, FGF9,
    GDF6) in which humeroradial synostosis occurs alongside progressive
    multi-joint synostoses.
  distinguishing_features:
  - Progressive proximal and distal symphalangism and carpal/tarsal coalitions
  - Progressive conductive hearing loss due to stapes/ossicular fixation
  - Autosomal dominant family history with pathogenic variants in NOG, GDF5, FGF9, or GDF6
  evidence:
  - reference: PMID:31467654
    reference_title: "Modified French Osteotomy for Humeroradial Synostosis in a Child with Multiple Synostoses Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we present the case of a boy with fixed flexion deformity of both elbows due bilateral humeroradial synostosis. Other characteristic features of multiple synostoses syndrome were also present in this child, his elder brother and mother.
    explanation: >-
      Documents familial multiple synostoses syndrome presenting with bilateral
      humeroradial synostosis and characteristic syndromic features across
      relatives.
  - reference: PMID:29130651
    reference_title: "Further delineation of the GDF6 related multiple synostoses syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition to synostoses of carpal and/or tarsal bones, at least 6 of 10 affected patients in this family have been diagnosed with mild to moderate hearing loss.
    explanation: >-
      Documents carpal/tarsal synostosis and conductive hearing loss as
      distinguishing features of GDF6-related multiple synostoses syndrome.
- name: Roberts-SC Phocomelia Syndrome
  disease_term:
    preferred_term: Roberts-SC phocomelia syndrome
    term:
      id: MONDO:0100253
      label: Roberts-SC phocomelia syndrome
  description: >
    Autosomal recessive cohesinopathy caused by biallelic ESCO2 variants,
    allelic to Juberg-Hayward syndrome, that lies on the severe end of the
    ESCO2 limb-reduction and radiohumeral fusion spectrum.
  distinguishing_features:
  - Symmetrical tetraphocomelia or severe mesomelic limb reduction
  - Prenatal and postnatal growth retardation with craniofacial clefting
  - Premature centromere separation (heterochromatin repulsion) on karyotyping
  evidence:
  - reference: PMID:32255174
    reference_title: "Juberg-Hayward syndrome is a cohesinopathy, caused by mutation in ESCO2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in ESCO2, a gene involved in cohesin complex formation, are known to cause Roberts/SC phocomelia syndrome. Roberts/SC phocomelia syndrome and JHS share similar clinical findings, including autosomal recessive inheritance, short stature, cleft lip/palate, severe upper limb anomalies, and hypoplastic digits.
    explanation: >-
      Establishes Roberts-SC phocomelia syndrome as the allelic ESCO2
      cohesinopathy sharing upper-limb and craniofacial malformations with
      Juberg-Hayward syndrome.

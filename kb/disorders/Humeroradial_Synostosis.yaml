      snippet: >-
        In 1975 Antley and Bixler described an unusual syndromal disorder consisting of complex craniosynostosis with midfacial hypoplasia, dysplasia of ears and nose, radiohumeral synostosis, congenital fractures of the femur and upper airway impairment in a newborn.
      explanation: >
        Links Antley-Bixler syndrome to complex craniosynostosis alongside
        radiohumeral synostosis.
- name: FGFR2 Gain-of-Function Receptor Signaling
  description: >
    In the FGFR2-related form of Antley-Bixler syndrome, pathogenic variants in
    FGFR2 cause dysregulated fibroblast growth factor receptor tyrosine kinase
    signaling in osteochondrogenic progenitors. Excessive FGFR2 signaling
    accelerates osteogenic differentiation across cranial sutures and disrupts
    chondrogenic boundary specification at the developing humeroradial joint
    interzone.

      label: steroid metabolic process
    modifier: DECREASED
  - preferred_term: sterol metabolic process
    term:
      id: GO:0016125
      label: sterol metabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:21146417
    reference_title: "Antley-Bixler-syndrome--staged management of craniofacial malformations from birth to adolescence--a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Steroidogenesis due to intrinsic or extrinsic disturbance by maternal fluconazole ingestion during early pregnancy may be impaired. The mode of inheritance is supposed to be autosomal recessive. Mutations in the fibroblast growth factor receptor 2 (FGFR2) as well as mutations in the cytochrome P450 oxidoreductase (OR) gene have been verified.
    explanation: >-
      Establishes intrinsic POR (cytochrome P450 oxidoreductase) mutations and
      extrinsic early-pregnancy fluconazole exposure as causes of impaired
      steroidogenesis in Antley-Bixler syndrome.
  downstream:
  - target: Defective Joint Interzone Specification
    description: >
      Impaired POR-dependent cytochrome P450 steroidogenesis perturbs embryonic
      osteochondrogenic boundary specification at the developing humeroradial
      joint interzone.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:21146417
      reference_title: "Antley-Bixler-syndrome--staged management of craniofacial malformations from birth to adolescence--a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Additional urogenital and cardiac malformations can be associated however diagnosis is based on a characteristic craniofacial deformity in association with humeroradial synostosis.
      explanation: >
        Links the POR/Antley-Bixler developmental disturbance to humeroradial
        synostosis at the elbow joint.
  - target: Craniosynostosis
    description: >
      Impaired POR-dependent steroidogenesis disrupts cranial suture boundary
      maintenance, causing complex premature synostosis of the cranial base and
      vault.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:21146417

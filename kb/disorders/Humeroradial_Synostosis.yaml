    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in ESCO2, a gene involved in cohesin complex formation, are known to cause Roberts/SC phocomelia syndrome. Roberts/SC phocomelia syndrome and JHS share similar clinical findings, including autosomal recessive inheritance, short stature, cleft lip/palate, severe upper limb anomalies, and hypoplastic digits. Esco2 expression during the early development of lip, palate, eyelid, digits, upper limb, and lower limb and truncated protein model are consistent with the defect.

    explanation: >-
      Confirms that CYP26B1 loss-of-function (impaired retinoic-acid degradation)
      and exogenous retinoic acid converge on limb/craniofacial skeletal
      teratogenesis, the basis of the CYP26B1-related HRS phenotype.

- name: ESCO2 Cohesinopathy and Sister Chromatid Cohesion Defect
  description: >
    In Juberg-Hayward syndrome and allelic Roberts/SC phocomelia syndrome,
    biallelic loss-of-function variants in ESCO2 — which encodes an
    acetyltransferase required for cohesin complex formation and establishment
    of sister chromatid cohesion — impair cohesin-dependent developmental gene
    regulation and progenitor survival in the early embryonic limb bud and
    craniofacial skeleton. Early embryonic Esco2 deficiency disrupts radial-ray
    digit morphogenesis, longitudinal skeletal growth, and humeroradial joint
    interzone specification.

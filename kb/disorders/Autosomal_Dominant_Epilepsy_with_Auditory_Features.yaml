name: Autosomal Dominant Epilepsy with Auditory Features
creation_date: "2026-08-05T00:00:00Z"
category: Mendelian
description: >-
  Autosomal dominant epilepsy with auditory features (ADEAF) is a familial focal
  epilepsy in which the seizures announce themselves as sound. The commonest aura
  is a simple unformed noise, a humming, buzzing, or ringing, and some patients
  instead lose the ability to understand language while remaining otherwise
  lucid. Onset is in adolescence or early adulthood, brain imaging is normal, and
  the course is benign, with seizures usually controlled once treatment starts.
  In the families where a cause is found it is most often loss of function in
  LGI1, a secreted neuronal protein that bridges the synaptic cleft by binding
  ADAM22 and ADAM23 and thereby organizes AMPA receptors and Kv1 channels. Most
  families, however, remain genetically unexplained.
parents:
  - Epilepsy
  - Neurological Disease
synonyms:
  - ADEAF
  - autosomal dominant lateral temporal lobe epilepsy
  - ADLTE
  - autosomal dominant partial epilepsy with auditory features
  - ADPEAF
  - epilepsy with auditory features

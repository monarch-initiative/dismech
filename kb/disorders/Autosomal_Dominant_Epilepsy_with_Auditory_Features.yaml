    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Ictal receptive aphasia consists of a sudden onset of inability to understand language in the absence of general confusion.
    explanation: Defines the receptive-language ictal phenotype.
- name: Auditory Hallucination
  category: Neurologic
  description: Complex ictal percepts can include voices, music or specific songs. Their brief stereotyped occurrence should be distinguished from persistent psychiatric hallucinations.
  phenotype_term:
    preferred_term: Auditory hallucination
    term:
      id: HP:0008765
      label: Auditory hallucination
  evidence:

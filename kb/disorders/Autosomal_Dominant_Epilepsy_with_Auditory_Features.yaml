    explanation: Names the established molecular diagnostic genes.
  - reference: PMID:18711109
    reference_title: Penetrance of LGI1 mutations in autosomal dominant partial epilepsy with auditory features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Overall penetrance was 67% (95% CI 55-77%), and did not vary according to mutation type or location within the gene.
    explanation: Selected pedigree penetrance analysis; null comparisons do not establish equivalence or secretion-class-specific effects.

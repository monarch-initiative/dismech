      label: RELN
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: Heterozygous RELN variants are associated with ADEAF; the initial selected Italian cohort found variants in 7/40 families and epilepsy in 20/33 carriers. Four tested variant carriers had reduced circulating reelin. Serum findings largely reflect liver-derived protein and do not directly measure brain secretion or establish a neuronal migration defect in dominant disease. Biallelic lissencephaly with cerebellar hypoplasia is distinct.

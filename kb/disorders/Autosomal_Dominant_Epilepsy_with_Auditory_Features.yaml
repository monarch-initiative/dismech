    explanation: Establishes the familial transmission pattern and the low de novo rate.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
genetic:
- name: LGI1
  gene_term:
    preferred_term: LGI1
    term:
      id: hgnc:6572
      label: LGI1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: Heterozygous pathogenic LGI1 variants affect secretion or ligand function, with allele-specific experimental results. In 24 selected published multiplex families, 58/87 inferred obligate carriers had epilepsy (67%, CI 55–77%); ascertainment can inflate population penetrance. No detected truncating-versus-missense difference is not proof of equivalent secretion-class penetrance. Biallelic LGI1 developmental and epileptic encephalopathy is a separate allelic phenotype.
  evidence:

progression:
- phase: Onset in adolescence or early adulthood
  age_range: 10 to 30 years
  notes: Onset is usually between 10 and 30 years, with wider ages documented in selected families. Typical dominant disease has preserved prior development; neonatal developmental encephalopathy should prompt a broader or allelic differential.
  evidence:
  - reference: PMID:20301709
    reference_title: Autosomal Dominant Epilepsy with Auditory Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Age at onset is usually in adolescence or early adulthood (age 10-30 years).
    explanation: Gives the characteristic age-at-onset window for the syndrome.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
- phase: Variable seizure control and remission
  notes: Many affected individuals respond to standard medication, but drug resistance and relapse after withdrawal occur. A broader EAF cohort of 123 patients (68.3% sporadic), followed a median 11 years, reported 42/123 with terminal remission. Its definition was at least five consecutive seizure-free years at last follow-up, not necessarily off medication; this is not an ADEAF-specific prognosis estimate.
  evidence:
  - reference: PMID:20301709
    reference_title: Autosomal Dominant Epilepsy with Auditory Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Seizure control is usually readily achieved with standard anti-seizure medications (ASM).
    explanation: Clinical review describes typical treatment response without guaranteeing it.
  - reference: PMID:29464704

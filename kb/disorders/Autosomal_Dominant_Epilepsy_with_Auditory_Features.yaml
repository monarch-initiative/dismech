- name: Excised intact Lgi1-null hippocampus
  experimental_model_type: OTHER
  description: Whole hippocampi from P16–18 homozygous-null mice were studied with CA3 patch and local-field recordings. Abnormal network barrages and oscillations occurred in an isolated preparation without afferents from other brain regions. Baseline spontaneous EPSC/IPSC distributions and sampled intrinsic membrane properties were unchanged. The separate Adam22 mutant behavioral arm of this paper is not an Lgi1 behavioral-rescue experiment.
  evidence:
  - reference: PMID:40455867
    reference_title: Biallelic LGI1 and ADAM23 variants cause hippocampal epileptic encephalopathy via the LGI1-ADAM22/23 pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Because this recording was obtained from a whole hippocampus without afferents from other brain regions, this suggests that epileptic discharges originate in the hippocampus in Lgi1−/− mice.
    explanation: Excised whole-hippocampus recordings localize abnormal network activity within that preparation.
  - reference: PMID:40455867
    reference_title: Biallelic LGI1 and ADAM23 variants cause hippocampal epileptic encephalopathy via the LGI1-ADAM22/23 pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The cumulative frequency distribution of amplitude and inter-event interval (IEI) in sEPSCs and sIPSCs showed no significant difference between WT and Lgi1−/− mice (Fig. 2B).
    explanation: Baseline spontaneous excitatory and inhibitory events were not significantly different between genotypes.

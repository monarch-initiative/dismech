- name: LGI1 variant secretion and receptor-binding cell assays
  experimental_model_type: CELL_LINE
  description: 'Transfected-cell assays distinguish secretion-defective E383A from secretion-competent S473L with altered ADAM22 interaction. Later HEK293T secretion and COS7 binding assays studied biallelic-encephalopathy variants: C48F, S524P and a terminal extension. All had reduced net binding, while inferred relative binding differed; these assays did not determine an equilibrium affinity constant. Four-phenylbutyrate responses were allele dependent and were not human treatment outcomes.'
  evidence:

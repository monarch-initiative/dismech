    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: In total, we identified seven ... mutations, each in a different ADLTE-affected family.
    explanation: Selected-family genetic evidence supports the RELN association.
  downstream:
  - target: Reduced Reelin Secretion
    description: Variant expression produces a secretion defect in the studied cell assay.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34508592
      reference_title: Epilepsy-causing Reelin mutations result in impaired secretion and intracellular degradation of mutant proteins.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: Using a cell-based secretion assay, we show that pathogenic RELN mutations abolish or significantly reduce secretion of mutant proteins and that this secretion defect results from impaired trafficking of mutant Reelin along the secretory pathway.
      explanation: Direct cell-assay result reported in an abstract-only source; precise constructs and culture conditions were not recoverable.
  - target: Increased Mutant Reelin Autophagic Processing
    description: Overexpressed mutant proteins increase LC3 flux in the studied cells.
    causal_link_type: DIRECT
    evidence:

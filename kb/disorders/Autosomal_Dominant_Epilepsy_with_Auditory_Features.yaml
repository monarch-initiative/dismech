    explanation: Distinguishes receptive aphasia from nonspecific confusion.
- name: Molecular genetic testing
  description: Use a phenotype-informed epilepsy panel including LGI1, RELN and MICAL1, with deletion/duplication or exome/genome testing as appropriate. A heterozygous pathogenic or likely pathogenic variant concordant with the phenotype can establish the molecular diagnosis. A VUS is not diagnostic; a negative result does not exclude a clinically defined syndrome. Absent family history can reflect reduced penetrance or a de novo variant.

  - reference: PMID:40455867
    reference_title: Biallelic LGI1 and ADAM23 variants cause hippocampal epileptic encephalopathy via the LGI1-ADAM22/23 pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: We found differently reduced secretion levels of Cys48Phe, Ser524Pro and Ter558GlyextTer23 variants ∼6.7%, 0.5% and 40% (median, compared to LGI1 WT), respectively (Fig. 1E).
    explanation: HEK293T conditioned-medium assay measures variant-specific secretion, not neuronal firing.

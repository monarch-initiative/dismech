      label: Diagnostic Procedure
  description: Ask specifically about brief stereotyped auditory experiences, sudden receptive-language failure, impaired awareness, convulsions, triggers and family history. Interview apparently unaffected relatives when appropriate, because subtle focal seizures may be overlooked. History, EEG, imaging and molecular testing are interpreted together.

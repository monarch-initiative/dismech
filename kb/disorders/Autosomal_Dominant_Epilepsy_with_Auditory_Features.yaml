phenotypes:
- name: Focal Sensory Seizure with Auditory Features
  category: Neurologic
  description: Brief stereotyped simple sounds, altered sound perception or complex auditory experiences are characteristic focal ictal symptoms. They are seizures themselves and may be overlooked before a convulsion. In one selected cohort, auditory symptoms were documented in 17/24 RELN and 29/51 LGI1 cases; these are ascertainment-dependent observations.
  phenotype_term:
    preferred_term: Focal sensory seizure with auditory features
    term:
      id: HP:0011158
      label: Focal sensory seizure with auditory features
  evidence:
  - reference: PMID:20301709
    reference_title: Autosomal Dominant Epilepsy with Auditory Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: The most common auditory symptoms are simple unformed sounds including humming, buzzing, or ringing; less common forms are distortions (e.g., volume changes) or complex sounds (e.g., specific songs or voices).
    explanation: Defines the auditory seizure spectrum without assigning a frequency band.
- name: Ictal Receptive Aphasia
  category: Neurologic
  description: Sudden inability to understand language without general confusion is an alternative characteristic ictal symptom and can occur with or without an auditory aura.
  phenotype_term:
    preferred_term: Focal cognitive seizure with receptive dysphasia/aphasia
    term:
      id: HP:0032696
      label: Focal cognitive seizure with receptive dysphasia/aphasia
  evidence:

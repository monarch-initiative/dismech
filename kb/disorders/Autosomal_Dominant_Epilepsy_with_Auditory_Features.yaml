notes: Broad epilepsy with auditory features (EAF) includes nonfamilial and structural epilepsies and is not an exact synonym for ADEAF. Conversely, absent family history does not exclude a molecular diagnosis because penetrance is incomplete and de novo variants occur. Frequencies and genetic yields from selected families, incompletely assessed cohorts and broadly ascertained EAF series are retained only with their denominators and are not converted into disease-wide phenotype bands. The 2015 RELN primary (PMID:26046367) and 2018 MICAL1 primary (PMID:29394500) are cited through generated full-text URLs; canonical PMID records are abstract-only. GeneReviews was updated in May 2024 and predates the biallelic LGI1 encephalopathy report. Experimental findings differ by allele, developmental stage, preparation and perturbation; decreased AMPA transmission is not modeled as a demonstrated cause of hyperexcitability.
pathophysiology:
- name: Heterozygous LGI1 Variants
  biological_scale: MOLECULAR
  description: Pathogenic heterozygous LGI1 variants cause a reduced-penetrance dominant epilepsy. Experimental allele classes include impaired secretion and impaired ligand interaction; gene dosage, altered mutant protein and complete knockout preparations are not interchangeable.
  evidence:
  - reference: PMID:20301709
    reference_title: Autosomal Dominant Epilepsy with Auditory Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: The molecular diagnosis is established in a proband with characteristic clinical features and a heterozygous pathogenic variant in LGI1, MICAL1, or RELN identified by molecular genetic testing.
    explanation: Human genetic diagnosis establishes a disease association; downstream allele-specific mechanisms are assessed separately.
  downstream:
  - target: Reduced LGI1 Secretion
    description: Selected variants produce cellular secretion defects; the effect is allele dependent.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25485908
      reference_title: Chemical corrector treatment ameliorates increased seizure susceptibility in a mouse model of familial epilepsy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: The secretion-defective LGI1(E383A) protein was recognized by the ER quality-control machinery and prematurely degraded, whereas the secretable LGI1(S473L) protein abnormally dimerized and was selectively defective in binding to one of its receptors, ADAM22.
      explanation: The abstract reports distinct cellular defects for two variants; neither mechanism is assumed universal.
  - target: Reduced LGI1-ADAM22 Binding
    description: Selected secretion-competent variants have altered ligand interaction.

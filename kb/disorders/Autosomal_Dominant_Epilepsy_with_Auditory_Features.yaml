differential_diagnoses:
- name: Anti-LGI1 Autoimmune Encephalitis
  description: Acquired LGI1-antibody limbic encephalitis is distinct from inherited ADEAF. Prominent subacute memory impairment, faciobrachial dystonic seizures, hyponatremia and antibodies support this differential; the usual response to immunotherapy does not justify immunotherapy for inherited ADEAF.
  distinguishing_features:
  - Acquired, usually subacute presentation rather than a Mendelian syndrome; absent family history alone is not discriminating.
  - Serum or CSF antibodies against LGI1.
  - Prominent amnesia and faciobrachial dystonic seizures rather than auditory auras.
  - Responds to immunotherapy.
  evidence:
  - reference: PMID:30346486
    reference_title: LGI1 antibodies alter Kv1.1 and AMPA receptors changing synaptic excitability, plasticity and memory.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Human autoantibodies against LGI1 associate with a form of autoimmune limbic encephalitis characterized by severe but treatable memory impairment and frequent faciobrachial dystonic seizures.
    explanation: Describes the autoimmune syndrome and its distinguishing features, which is what separates it from the inherited disorder modelled here.
    quote_role: BACKGROUND
    directness: DIRECT
- name: Other Epilepsies with Auditory Features
  description: Broad EAF includes nonfamilial, structural and other genetic focal epilepsies. SCN1A and DEPDC5 findings in heterogeneous families, and one proposed KCNQ2-associated EAF case, do not establish the same narrow familial ADEAF syndrome or a shared LGI1 mechanism. Conversely, de novo variants and reduced penetrance allow molecular ADEAF without an affected parent.
  distinguishing_features:
  - Interpret electroclinical and imaging findings with the gene-specific phenotype.
  - A negative family history or panel does not by itself classify an individual outside ADEAF.
  evidence:
  - reference: PMID:33453592
    reference_title: 'Epilepsy with auditory features: Contribution of known genes in 112 patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We included 112 unrelated EAF cases (male/female: 52/60) who underwent genetic analysis by next-generation sequencing (NGS) techniques. Thirty-three (29.5%) were familial cases.'
    explanation: Documents that the large auditory-features cohort was predominantly non-familial, which is the ascertainment point this differential makes.
  - reference: PMID:39796146
    reference_title: Novel KCNQ2 Variants Related to a Variable Phenotypic Spectrum Ranging from Epilepsy with Auditory Features to Severe Developmental and Epileptic Encephalopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The phenotypes observed in the affected members of family 1, which shared the c.2251T>G variant, were epilepsy with auditory features (EAFs), focal epilepsy, and generalized epilepsy, and none of them suffered from neonatal seizures.
    explanation: One proposed KCNQ2-associated EAF proband in a phenotypically heterogeneous family; no channel functional assay establishes a shared ADEAF mechanism.
- name: Mesial Temporal Lobe Epilepsy with Hippocampal Sclerosis
  description: Mesial temporal lobe epilepsy can produce experiential, autonomic or olfactory symptoms and may be associated with hippocampal sclerosis. Auditory symptoms favor a lateral temporal network but are not an infallible anatomical discriminator.
  distinguishing_features:
  - Mesial experiential or epigastric symptoms may predominate.
  - High-resolution MRI may demonstrate hippocampal sclerosis.
  - Clinical localization and treatment response require individual evaluation.
  evidence:
  - reference: PMID:35153984
    reference_title: 'Epilepsy With Auditory Features: From Etiology to Treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: EAF phenotype is characterized by seizures with auditory symptoms or aphasia, suggesting a lateral temporal lobe involvement.
    explanation: Review localizes the characteristic auditory/language phenotype, while other focal syndromes require differential assessment.
- name: Biallelic LGI1 Developmental and Epileptic Encephalopathy
  description: A separate recessive allelic disorder was reported in six individuals from four families, with early seizures and developmental impairment. Severe homozygous mouse phenotypes therefore have a human allelic counterpart, but this does not make neonatal encephalopathy typical of dominant ADEAF.
  distinguishing_features:
  - Biallelic rather than heterozygous LGI1 variants.
  - Early infantile seizures and developmental impairment.
  evidence:
  - reference: PMID:40455867
    reference_title: Biallelic LGI1 and ADAM23 variants cause hippocampal epileptic encephalopathy via the LGI1-ADAM22/23 pathway.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The clinical features available of six patients (Patients P1A–C, P2, P3 and P4) with LGI1 variants identified from four consanguineous families
    explanation: Six-person biallelic series, distinct from the usual dominant clinical syndrome.
discussions:
- discussion_id: adeaf_preparation_specific_physiology
  prompt: How do distinct LGI1 physiological effects produce the human focal epilepsy phenotype?
  kind: INTERPRETATION
  status: OPEN
  rationale: AMPA-mediated responses decrease in one null preparation and increase in another; baseline intrinsic properties can be unchanged in acute or intact hippocampus while cultured CA3 neurons show a Kv1-related deficit. Regional, developmental, allele and preparation differences matter. A compensatory AMPA-loss-to-hyperexcitability cascade is a hypothesis rather than a demonstrated common sequence. The cultured restoration study explicitly did not test synaptic rescue.
  evidence:
  - *id002
  - *id004
  - &id013
    reference: PMID:20130004
    reference_title: Lgi1 null mutant mice exhibit myoclonic seizures and CA1 neuronal hyperexcitability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: These results indicate that Lgi1 mutation did not change the intrinsic properties of pyramidal neurons in the hippocampal CA1 region.
    explanation: Baseline intrinsic firing, membrane potential and input resistance were unchanged in this acute-slice preparation.
  - &id016
    reference: PMID:40455867
    reference_title: Biallelic LGI1 and ADAM23 variants cause hippocampal epileptic encephalopathy via the LGI1-ADAM22/23 pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The intrinsic electrical properties of CA3 neurons, such as membrane capacitance, input resistance, resting membrane potential and membrane time constant (Tau) were not different between genotypes (Supplementary Table 3).
    explanation: Baseline intrinsic membrane properties did not differ in the sampled CA3 neurons.
  - &id010
    reference: PMID:37863654
    reference_title: Rescue of Normal Excitability in LGI1-Deficient Epileptic Neurons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The effect of LGI1 rescue on synaptic function has not been tested in the present study.
    explanation: The current study measures intrinsic electrophysiology, not synaptic or network-seizure rescue.
- discussion_id: adeaf_developmental_and_later_requirements
  prompt: How much does developmental circuit maturation contribute relative to continuing LGI1 function?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: The 835delC transgene supports altered postnatal dendritic maturation, while conditional deletion at later postnatal stages still produces seizures and culture restoration changes intrinsic physiology. These studies do not establish a single irreversible developmental lesion or a requirement for a second hit. The dog LGI2 epilepsy and a proposed LGI2-to-LGI1 developmental handover concern a paralog and cannot establish a human ADEAF mechanism.
  evidence:
  - *id005
  - &id012
    reference: PMID:25234641
    reference_title: Glutamatergic neuron-targeted loss of LGI1 epilepsy gene results in seizures.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Emx1-Lgi1cKO mice displayed early-onset and lethal seizures, whereas CaMKIIα-Lgi1cKO mice presented late-onset occasional seizures associated with variable reduced lifespan.
    explanation: Conditional deletion separates embryonic from later postnatal glutamatergic-neuron perturbations; details beyond the abstract are not inferred.
  - *id003
  - reference: PMID:21829378
    reference_title: LGI2 truncation causes a remitting focal epilepsy in dogs.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: We report functional and expression studies of LGI2, which, combined with previous LGI1 studies, suggest a novel concept of the basis of remission common in childhood epilepsy.
    explanation: Paralog dog-model comparison; developmental handover is a proposed interpretation.
- discussion_id: adeaf_gene_convergence
  prompt: Do LGI1, RELN and MICAL1 defects converge on the same neuronal pathway?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Human clinical overlap does not demonstrate molecular convergence. Reelin serum and secretion findings, MICAL1 lysate activity and LGI1 synaptic-channel studies measure different compartments and endpoints. MICAL1-to-actin-to-network and reelin-to-human-epilepsy intermediates remain unresolved; direct patient-neuron studies and allele-aware rescue would be informative.
  evidence:
  - *id006
  - *id007
  - *id008
  - *id009
- discussion_id: adeaf_allelic_translation
  prompt: Which LGI1 alleles and experimental corrections translate to dominant ADEAF?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  rationale: Biallelic LGI1 encephalopathy is a distinct human phenotype, so severe null mice are not simply evidence of an unsupported human condition. The six-person biallelic series had heterogeneous survival and is not representative of dominant ADEAF. Cell 4PBA responses differ across alleles; organotypic LGI1 restoration does not establish delivery, durability, seizure reduction or clinical benefit in heterozygous patients.
  evidence:
  - reference: PMID:40455867
    reference_title: Biallelic LGI1 and ADAM23 variants cause hippocampal epileptic encephalopathy via the LGI1-ADAM22/23 pathway.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The clinical features available of six patients (Patients P1A–C, P2, P3 and P4) with LGI1 variants identified from four consanguineous families
    explanation: Separate biallelic clinical series.
  - &id015
    reference: PMID:40455867
    reference_title: Biallelic LGI1 and ADAM23 variants cause hippocampal epileptic encephalopathy via the LGI1-ADAM22/23 pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: We found that treatment with 4PBA (5 mM) for 72 h significantly increased the secretion of LGI1 Cys48Phe as well as WT, whereas it reduced the secretion of Ser524Pro and Ter558GlyextTer23 (Supplementary Fig. 4B).
    explanation: Opposite 4PBA secretion responses across alleles preclude class-wide rescue prediction.

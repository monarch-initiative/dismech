  notes: MICAL1 is an established ADEAF gene with gain-of-function activity in selected variant cell assays. The original study supported two variants among 28 LGI1/RELN-negative families; its third R646Q variant was explicitly a VUS with no detectable activity increase. One family also carried an unexcluded GRIN2A variant. A later de novo R915C case broadens the allelic series. Increased cell-lysate H2O2 production and COS7 contraction do not directly establish patient neuronal actin dynamics.

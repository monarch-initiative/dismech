    title: >-
      Chemical corrector treatment ameliorates increased seizure susceptibility
      in a mouse model of familial epilepsy.
notes: >-
  Scope and naming note. This syndrome carries an unusual number of names, and
  they are not quite interchangeable. ADEAF and the older ADPEAF and ADLTE refer
  to the familial, autosomal dominant syndrome modelled here. "Epilepsy with
  auditory features" is broader and includes sporadic cases, which matters
  because genetic yield differs sharply between the two: in a cohort of 112
  largely sporadic cases only 8 percent had any genetic diagnosis and only 2.7
  percent had an LGI1 variant, whereas LGI1 accounts for a much larger share of
  genuinely autosomal dominant families. Figures quoted from the broad cohort are
  therefore labelled as such rather than presented as the ADEAF yield.

  Anti-LGI1 autoimmune encephalitis involves the same protein but is a different
  disease with a different presentation and is not covered here; the relationship
  between the two is recorded as a discussion.

  Pathograph scoping. The causal chain modelled below is the LGI1 route only,
  even though RELN and MICAL1 are also typed CAUSATIVE in the genetic section.
  This is deliberate. The clinical justification is that RELN-mutated and
  LGI1-mutated families are phenotypically indistinguishable apart from a higher
  rate of left-sided EEG abnormality, so a single downstream chain describes both
  presentations without loss. The evidential justification is that only the LGI1
  route has a worked-out molecular mechanism at the level of detail this entry
  models, from variant class through secretion through the ADAM22 complex to
  receptor clustering. RELN is understood to converge via reduced secretion of a
  different secreted protein and MICAL1 via a mechanistically distinct
  gain-of-function route affecting actin regulation, but neither is characterized
  here to the standard used for LGI1, and inventing parallel chains at lower
  evidential quality would misrepresent how well those routes are understood.
  Adding them is worthwhile follow-up work, particularly MICAL1, because a
  gain-of-function route reaching the same syndrome as two loss-of-function
  routes would be a genuinely informative addition to the model.

  Module conformance now covers four of five nodes against
  epilepsy_excitation_inhibition_imbalance. An earlier revision of this entry
  declined the #Excitation-Inhibition Imbalance node on the grounds that it was
  GABAergic-specific; that reading was wrong. The module node describes a shift
  toward net excitation "through increased excitation, decreased inhibition, or
  both", which is exactly what loss of the LGI1-ADAM22 bridge produces on the
  glutamatergic side. The trans-synaptic complex node takes #Ion Channel and
  Synaptic Dysfunction, whose description explicitly covers synaptic-protein
  abnormalities.
pathophysiology:
  - name: LGI1 Loss of Function
    biological_scale: MOLECULAR
    description: >-
      Heterozygous pathogenic variants in LGI1 cause loss of function by two
      mechanistically distinct routes that converge on the same endpoint. Some
      missense variants are secretion-defective: the misfolded protein is caught
      by endoplasmic reticulum quality control and degraded before it ever
      reaches the synapse. Others are secreted normally but are functionally
      inert, dimerizing abnormally and failing to bind their receptor. This is
      what makes LGI1-related epilepsy a conformational disease rather than
      simply a dosage problem, and it is why a chemical chaperone can rescue one
      class of variant but would be expected to do nothing for the other.
    biological_processes:
      - preferred_term: protein secretion
        term:
          id: GO:0009306
          label: protein secretion
        modifier: DECREASED
    downstream:
      - target: Disrupted LGI1-ADAM22 Trans-Synaptic Complex
        causal_link_type: DIRECT
        evidence:
          - reference: PMID:25485908
            reference_title: >-
              Chemical corrector treatment ameliorates increased seizure
              susceptibility in a mouse model of familial epilepsy.
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: >-
              Both mutations caused a loss of function, compromising
              intracellular trafficking or ligand activity of LGI1 and converging
              on reduced synaptic LGI1-ADAM22 interaction.
            explanation: >-
              States the convergence of both variant classes onto reduced
              synaptic LGI1-ADAM22 interaction, which is exactly this edge.
    evidence:
      - reference: PMID:25485908
        reference_title: >-
          Chemical corrector treatment ameliorates increased seizure
          susceptibility in a mouse model of familial epilepsy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The secretion-defective LGI1(E383A) protein was recognized by the ER
          quality-control machinery and prematurely degraded, whereas the
          secretable LGI1(S473L) protein abnormally dimerized and was selectively
          defective in binding to one of its receptors, ADAM22.
        explanation: >-
          Establishes the two distinct molecular failure modes, ER retention and
          receptor-binding failure, that this node models.
      - reference: PMID:25485908
        reference_title: >-
          Chemical corrector treatment ameliorates increased seizure
          susceptibility in a mouse model of familial epilepsy.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          We classified 22 reported LGI1 missense mutations as either secretion
          defective or secretion competent
        explanation: >-
          Shows the two-class division is a property of the reported human
          variant set rather than of two hand-picked examples.
  - name: Disrupted LGI1-ADAM22 Trans-Synaptic Complex
    biological_scale: MOLECULAR
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
    description: >-
      Secreted LGI1 physically bridges the synaptic cleft, binding presynaptic
      ADAM23, which associates with Kv1.1 potassium channels, and postsynaptic
      ADAM22, which associates with AMPA receptors through PSD-95 and other MAGUK
      scaffolds. Losing LGI1 therefore does not knock out one channel; it
      dismantles the scaffold that holds a presynaptic brake and a postsynaptic
      receptor array in register across the cleft.
    downstream:
      - target: Dysregulated AMPA Receptor Clustering and Synaptic Excitability
        causal_link_type: DIRECT
    evidence:
      - reference: PMID:30346486
        reference_title: >-
          LGI1 antibodies alter Kv1.1 and AMPA receptors changing synaptic
          excitability, plasticity and memory.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Leucine-rich glioma-inactivated 1 (LGI1) is a secreted neuronal protein
          that forms a trans-synaptic complex that includes the presynaptic
          disintegrin and metalloproteinase domain-containing protein 23
          (ADAM23), which interacts with voltage-gated potassium channels Kv1.1,
          and the postsynaptic ADAM22, which interacts with AMPA receptors.
        explanation: >-
          Describes the trans-synaptic architecture, including both the
          presynaptic Kv1.1 arm and the postsynaptic AMPA arm, that this node
          represents.
      - reference: PMID:34089731
        reference_title: >-
          Trans-synaptic LGI1-ADAM22-MAGUK in AMPA and NMDA receptor regulation.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Epilepsy-related secreted protein LGI1 and its receptor ADAM22
          represent major constituent elements of the PSD-95-containing synaptic
          protein complex in the brain.
        explanation: >-
          Places LGI1 and ADAM22 within the PSD-95 scaffold, which is the link
          from the trans-synaptic complex to receptor organization.
  - name: Dysregulated AMPA Receptor Clustering and Synaptic Excitability
    biological_scale: CELLULAR
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
    description: >-
      With the bridge gone, MAGUK-dependent regulation of AMPA and NMDA receptor
      transmission is disturbed and the presynaptic Kv1 brake is loosened.
      Excitatory synaptic transmission increases. In the Lgi1 null mouse this is
      measurable as enhanced glutamate release, giving a concrete cellular basis
      for the seizure phenotype.
    cell_types:
      - preferred_term: glutamatergic neuron
        term:
          id: CL:0000679
          label: glutamatergic neuron
        modifier: ABNORMAL
    biological_processes:
      - preferred_term: AMPA glutamate receptor clustering
        term:
          id: GO:0097113
          label: AMPA glutamate receptor clustering
        modifier: ABNORMAL
      - preferred_term: synaptic transmission, glutamatergic
        term:
          id: GO:0035249
          label: synaptic transmission, glutamatergic
        modifier: INCREASED
    downstream:
      - target: Lateral Temporal Cortical Hyperexcitability
        causal_link_type: DIRECT
    evidence:
      - reference: PMID:34089731
        reference_title: >-
          Trans-synaptic LGI1-ADAM22-MAGUK in AMPA and NMDA receptor regulation.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Recent studies begin to reveal a trans-synaptic configuration of the
          LGI1-ADAM22 complex and its pivotal role in AMPA and NMDA
          receptor-mediated synaptic transmission through regulating MAGUKs.
        explanation: >-
          States the mechanism by which the complex controls excitatory
          transmission, which is the content of this node.
      - reference: PMID:20130004
        reference_title: >-
          Lgi1 null mutant mice exhibit myoclonic seizures and CA1 neuronal
          hyperexcitability.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Electrophysiological analysis demonstrates an enhanced excitatory
          synaptic transmission by increasing the release of the excitatory
          neurotransmitter glutamate, suggesting a basis for the seizure
          phenotype.
        explanation: >-
          Direct electrophysiological evidence that losing Lgi1 increases
          excitatory transmission. Note this is the homozygous null; the
          heterozygous mismatch with human disease is recorded as a discussion.
  - name: Lateral Temporal Cortical Hyperexcitability
    biological_scale: TISSUE
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
    description: >-
      The seizure onset zone is lateral temporal, involving auditory cortex and
      adjacent language cortex, which is what gives the syndrome its
      characteristic aura. Why a deficiency in a broadly expressed secreted
      protein should localize its effect here rather than producing a generalized
      or multifocal epilepsy is not explained by the molecular mechanism above,
      and imaging is normal by definition, so the regional specificity is asserted
      from seizure semiology rather than from a demonstrated regional lesion.
    downstream:
      - target: Focal Seizures with Auditory Features
        causal_link_type: DIRECT
    evidence:
      - reference: PMID:20301709
        reference_title: Autosomal Dominant Epilepsy with Auditory Features.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Autosomal dominant epilepsy with auditory features (ADEAF) is a focal
          epilepsy syndrome with auditory symptoms and/or receptive aphasia as
          prominent ictal manifestations.
        explanation: >-
          Establishes the focal, auditory-and-language-cortex localization that
          this node asserts, from the authoritative clinical description.
      - reference: PMID:20301709
        reference_title: Autosomal Dominant Epilepsy with Auditory Features.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The clinical diagnosis of ADEAF can be established in a proband with
          characteristic clinical features, normal brain imaging by MRI, and
          family history consistent with autosomal dominant inheritance.
        explanation: >-
          Records that MRI is normal, which is why this node is inferred from
          semiology rather than from a visible structural abnormality.
  - name: Focal Seizures with Auditory Features
    biological_scale: ORGANISM
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
    description: >-
      Recurrent focal seizures whose defining feature is an auditory aura, with
      or without ictal receptive aphasia, sometimes evolving to bilateral
      tonic-clonic seizures. The course is benign and usually medication
      responsive.
    evidence:
      - reference: PMID:20301709
        reference_title: Autosomal Dominant Epilepsy with Auditory Features.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The clinical course of ADEAF is benign. Seizures are usually well
          controlled after initiation of medical therapy.
        explanation: >-
          States the benign, treatment-responsive character of the terminal
          clinical phenotype.
phenotypes:
  - name: Focal Sensory Seizure with Auditory Features
    category: Neurologic
    description: >-
      The defining phenotype. Most often a simple unformed sound such as humming,
      buzzing, or ringing; less commonly a distortion of what is actually being
      heard, such as a change in volume, or a complex percept such as a specific
      song or voice. The aura is the seizure, not a warning of one.

      Worth noting that the syndrome's defining feature is less common than its
      presenting one. Auditory auras occur in 57 percent of LGI1-mutated and 71
      percent of RELN-mutated patients, whereas tonic-clonic seizures occur in
      around 90 percent of both. The thing that names the syndrome is therefore
      not the thing that brings people to attention, which is a plausible part of
      why it goes underrecognized: a brief unformed noise is easy to dismiss or
      never to mention, and unless it is specifically asked about, what gets
      reported is the convulsion.
    phenotype_term:
      preferred_term: Focal sensory seizure with auditory features
      term:
        id: HP:0011158
        label: Focal sensory seizure with auditory features
      onset:
        onset_category: YOUNG_ADULT
    frequency: FREQUENT
    evidence:
      - reference: PMID:28142128
        reference_title: >-
          The clinical phenotype of autosomal dominant lateral temporal lobe
          epilepsy related to reelin mutations.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          frequency of auditory auras (71% vs 57%)
        explanation: >-
          The measured frequency of the auditory aura, 71 percent in
          RELN-mutated and 57 percent in LGI1-mutated families. Both figures fall
          in the 30 to 79 percent band, which maps to FREQUENT rather than
          VERY_FREQUENT.
      - reference: PMID:20301709
        reference_title: Autosomal Dominant Epilepsy with Auditory Features.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The most common auditory symptoms are simple unformed sounds including
          humming, buzzing, or ringing; less common forms are distortions (e.g.,
          volume changes) or complex sounds (e.g., specific songs or voices).
        explanation: >-
          The GeneReviews description of the character of the auditory aura,
          including the simple-versus-complex distinction. It supports what the
          aura is like, not how many patients have one; the frequency band is
          carried by the cohort figures above.
  - name: Ictal Receptive Aphasia
    category: Neurologic
    description: >-
      A sudden inability to understand language, occurring without general
      confusion. This is the alternative defining manifestation to the auditory
      aura and reflects seizure onset in or near language cortex. Its
      preservation of general awareness is what distinguishes it from a
      confusional state.
    phenotype_term:
      preferred_term: Focal cognitive seizure with receptive dysphasia/aphasia
      term:
        id: HP:0032696
        label: Focal cognitive seizure with receptive dysphasia/aphasia
    evidence:
      - reference: PMID:20301709
        reference_title: Autosomal Dominant Epilepsy with Auditory Features.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Ictal receptive aphasia consists of a sudden onset of inability to
          understand language in the absence of general confusion.
        explanation: >-
          Defines the ictal receptive aphasia phenotype, including the absence of
          general confusion that distinguishes it.
  - name: Auditory Hallucination
    category: Neurologic
    description: >-
      The complex end of the auditory aura spectrum, in which patients hear
      specific songs or voices rather than unformed noise. Recorded separately
      from the simple auditory aura because the complex percept can be
      misattributed to a primary psychiatric disorder.
    phenotype_term:
      preferred_term: Auditory hallucination
      term:
        id: HP:0008765
        label: Auditory hallucination
    frequency: OCCASIONAL
    evidence:
      - reference: PMID:20301709
        reference_title: Autosomal Dominant Epilepsy with Auditory Features.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          less common forms are distortions (e.g., volume changes) or complex
          sounds (e.g., specific songs or voices)
        explanation: >-
          Documents complex auditory percepts as a less common form of the aura.
          The qualitative phrase "less common" maps to OCCASIONAL.
  - name: Focal to Bilateral Tonic-Clonic Seizures
    category: Neurologic
    description: >-
      Despite the syndrome's benign reputation, tonic-clonic seizures are
      reported by nearly all patients, usually preceded by the typical aura. They
      are, in practice, what brings people to attention, since a brief auditory
      aura on its own is easy to dismiss or to misattribute.
    phenotype_term:
      preferred_term: Bilateral tonic-clonic seizure with focal onset
      term:
        id: HP:0007334
        label: Bilateral tonic-clonic seizure with focal onset
    frequency: VERY_FREQUENT
    evidence:
      - reference: PMID:28142128
        reference_title: >-
          The clinical phenotype of autosomal dominant lateral temporal lobe
          epilepsy related to reelin mutations.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Tonic-clonic seizures were reported by almost all patients (88%),
          preceded by typical aura in 67% of cases.
        explanation: >-
          Quantifies tonic-clonic seizures at 88 percent in RELN-mutated ADLTE
          families, which falls in the 80 to 100 percent band mapping to
          VERY_FREQUENT. The same study found no significant phenotypic
          difference from LGI1-mutated families apart from EEG lateralization, so
          the figure is taken as applying to the syndrome rather than to the RELN
          subset alone.
      - reference: PMID:28142128
        reference_title: >-
          The clinical phenotype of autosomal dominant lateral temporal lobe
          epilepsy related to reelin mutations.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          By comparing these findings with those observed in families with LGI1
          mutations, we did not observe significant differences except for a
          higher rate of left-sided EEG abnormalities in the RELN group.
        explanation: >-
          Justifies generalizing the RELN-cohort frequencies to the syndrome, by
          establishing that the RELN and LGI1 phenotypes are otherwise
          indistinguishable.
  - name: Interictal EEG Abnormality
    category: Neurologic
    description: >-
      Interictal epileptiform abnormalities or focal slow waves over the temporal
      regions are present in roughly 60 to 80 percent of patients depending on
      genotype. This matters because MRI is normal by definition, so the EEG is
      the only investigation that positively supports the diagnosis.

      The genotype split is important and cuts against generalizing here. EEG is
      the one feature on which RELN-mutated and LGI1-mutated families
      demonstrably differ: normal recordings in 20 percent of the RELN group
      against 42 percent of the LGI1 group, implying roughly 80 percent versus
      roughly 58 percent abnormal, with marked left temporal predominance in RELN
      (53 percent) but not LGI1 (22 percent). Since this entry's pathograph is
      LGI1-scoped, the lower figure is the applicable one and the frequency band
      is set accordingly.
    phenotype_term:
      preferred_term: EEG abnormality
      term:
        id: HP:0002353
        label: EEG abnormality
    frequency: FREQUENT
    evidence:
      - reference: PMID:28142128
        reference_title: >-
          The clinical phenotype of autosomal dominant lateral temporal lobe
          epilepsy related to reelin mutations.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The interictal EEG recordings showed epileptiform abnormalities or
          focal slow waves in 80% of patients, localized over the temporal
          regions, with marked left predominance and conventional 1,5T MRI scans
          were not contributory.
        explanation: >-
          Quantifies interictal EEG abnormality in the RELN-mutated cohort at 80
          percent, and confirms in the same sentence that conventional MRI adds
          nothing. The 80 percent is a subgroup figure; see the item below for
          the LGI1 comparison that sets the frequency band used here.
      - reference: PMID:28142128
        reference_title: >-
          The clinical phenotype of autosomal dominant lateral temporal lobe
          epilepsy related to reelin mutations.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          EEGs showed a lower rate of normal recordings and higher rate of left
          temporal abnormalities in RELN group compared to the LGI1 group (20 vs
          42% and 53 vs 22%, respectively)
        explanation: >-
          The genotype split that sets the band. Normal recordings in 42 percent
          of the LGI1 group implies roughly 58 percent abnormal, which is
          FREQUENT rather than VERY_FREQUENT, and left temporal predominance is a
          RELN feature (53 percent) rather than an LGI1 one (22 percent). Because
          this entry is LGI1-scoped, the LGI1 figures are the applicable ones.
          This is also the one axis on which the same paper reports the two
          genotypes differing, so it is precisely where its otherwise-valid
          generalization does not hold.
  - name: Other Focal Sensory and Autonomic Auras
    category: Neurologic
    description: >-
      A minority of seizures begin with visual, olfactory, vertiginous, or
      cephalic sensations, or with motor, psychic, or autonomic symptoms. Their
      presence does not exclude the syndrome.
    phenotype_term:
      preferred_term: Focal sensory seizure
      term:
        id: HP:0011157
        label: Focal sensory seizure
    frequency: OCCASIONAL
    evidence:
      - reference: PMID:20301709
        reference_title: Autosomal Dominant Epilepsy with Auditory Features.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Less commonly, other ictal symptoms may occur, including sensory
          symptoms (visual, olfactory, vertiginous, or cephalic) or motor,
          psychic, and autonomic symptoms.
        explanation: >-
          Enumerates the less common aura types. The qualifier "less commonly"
          maps to OCCASIONAL.
inheritance:
  - name: Autosomal dominant with incomplete penetrance
    description: >-
      ADEAF is autosomal dominant by definition of the syndrome. Most affected
      individuals have an affected parent and de novo variants are believed to be
      uncommon. Penetrance is incomplete, which materially changes counselling:
      a child of an affected parent has a 50 percent chance of inheriting the
      variant but a lower chance of ever manifesting seizures, estimated between
      54 and 85 percent of carriers depending on the penetrance assumed.
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    penetrance: INCOMPLETE
    evidence:
      - reference: PMID:20301709
        reference_title: Autosomal Dominant Epilepsy with Auditory Features.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Offspring of an individual with ADEAF who is heterozygous for a
          pathogenic variant have a 50% chance of inheriting the pathogenic
          variant; the chance that offspring who inherit the pathogenic variant
          will manifest ADEAF ranges from 54% to 85% depending on the assumed
          penetrance.
        explanation: >-
          Gives both the transmission probability and the penetrance range, which
          together are the counselling content of this block.
      - reference: PMID:20301709
        reference_title: Autosomal Dominant Epilepsy with Auditory Features.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Most individuals diagnosed with ADEAF have an affected parent; the
          proportion of individuals with ADEAF caused by a de novo pathogenic
          variant is believed to be low.
        explanation: >-
          Establishes the familial transmission pattern and the low de novo rate.
genetic:
  - name: LGI1
    gene_term:
      preferred_term: LGI1
      term:
        id: hgnc:6572
        label: LGI1
    relationship_type: CAUSATIVE
    variant_origin: GERMLINE
    notes: >-
      LGI1 encodes leucine-rich glioma-inactivated 1, a secreted neuronal protein
      and the principal known cause of ADEAF. Pathogenic variants act by loss of
      function through either impaired secretion or impaired receptor binding.
      Yield depends heavily on how the phenotype is ascertained: in a broad
      epilepsy-with-auditory-features cohort that was mostly sporadic, LGI1
      accounted for only 2.7 percent of cases, whereas it is the leading cause in
      genuinely autosomal dominant families.
    evidence:
      - reference: PMID:20301709
        reference_title: Autosomal Dominant Epilepsy with Auditory Features.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The molecular diagnosis is established in a proband with characteristic
          clinical features and a heterozygous pathogenic variant in LGI1, MICAL1,
          or RELN identified by molecular genetic testing.
        explanation: >-
          Names LGI1 as an established molecular cause of ADEAF, alongside MICAL1
          and RELN.
      - reference: PMID:33453592
        reference_title: >-
          Epilepsy with auditory features: Contribution of known genes in 112
          patients.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We identified a genetic diagnosis for 8% of our cohort, including
          pathogenic/likely pathogenic variants (4/8 novel) in LGI1 (2.7%, CI:
          0.6-7.6); RELN (1.8%; CI: 0.2-6.3); SCN1A (2.7%; CI: 0.6-7.6) and
          DEPDC5 (0.9%; CI 0-4.9).
        explanation: >-
          Quantifies LGI1 yield in a broad, largely sporadic cohort. Marked
          PARTIAL because that cohort is not restricted to autosomal dominant
          families, so the figure understates the yield in ADEAF proper.
      - reference: PMID:18711109
        reference_title: >-
          Penetrance of LGI1 mutations in autosomal dominant partial epilepsy
          with auditory features.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Mutations in the leucine-rich, glioma inactivated 1 gene (LGI1) have
          been identified in about 50% of families with autosomal dominant
          partial epilepsy with auditory features (ADPEAF)
        explanation: >-
          The family-restricted LGI1 yield, roughly 50 percent, which is the
          figure that actually applies to ADEAF. Placing it beside the 2.7
          percent sporadic-cohort figure makes the ascertainment effect explicit
          rather than leaving a reader to reconcile two numbers that differ
          nearly twenty-fold.
      - reference: PMID:18711109
        reference_title: >-
          Penetrance of LGI1 mutations in autosomal dominant partial epilepsy
          with auditory features.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Overall penetrance was 67% (95% CI 55-77%), and did not vary according
          to mutation type or location within the gene.
        explanation: >-
          The pooled penetrance estimate across all 24 published LGI1-mutated
          ADPEAF families, and the negative finding that penetrance is
          independent of mutation type and position. The latter matters for the
          model: it means the secretion-defective and secretion-competent variant
          classes, despite differing molecularly, do not differ in how reliably
          they cause disease.
  - name: RELN
    gene_term:
      preferred_term: RELN
      term:
        id: hgnc:9957
        label: RELN
    relationship_type: CAUSATIVE
    variant_origin: GERMLINE
    notes: >-
      RELN encodes reelin, a large secreted glycoprotein governing neuronal
      migration and, in the mature brain, synaptic function. It is an established
      but less common cause of ADEAF. That the second cause is also a secreted
      extracellular signalling protein is a striking parallel with LGI1.
    evidence:
      - reference: PMID:33453592
        reference_title: >-
          Epilepsy with auditory features: Contribution of known genes in 112
          patients.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          LGI1 and RELN have been identified as the main cause of Autosomal
          Dominant EAF and anecdotally reported in non-familial cases.
        explanation: >-
          Names RELN alongside LGI1 as a main cause of the autosomal dominant form
          specifically.
  - name: MICAL1
    gene_term:
      preferred_term: MICAL1
      term:
        id: hgnc:20619
        label: MICAL1
    relationship_type: CAUSATIVE
    variant_origin: GERMLINE
    notes: >-
      MICAL1 is the third gene recognized in the current GeneReviews molecular
      diagnostic criteria for ADEAF. It is rarer than LGI1 and RELN.
    evidence:
      - reference: PMID:20301709
        reference_title: Autosomal Dominant Epilepsy with Auditory Features.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          a heterozygous pathogenic variant in LGI1, MICAL1, or RELN identified by
          molecular genetic testing
        explanation: >-
          Establishes MICAL1 as one of the three genes in which a pathogenic
          variant establishes the molecular diagnosis.
  - name: SCN1A
    gene_term:
      preferred_term: SCN1A
      term:
        id: hgnc:10585
        label: SCN1A
    relationship_type: SUSCEPTIBILITY
    variant_origin: GERMLINE
    notes: >-
      SCN1A variants have been found in probands presenting with auditory
      features, in families with heterogeneous phenotypes and incomplete
      penetrance. Recorded as a susceptibility contributor rather than a
      causative ADEAF gene, because the associated families do not breed true for
      the auditory phenotype and SCN1A is better understood as a broad-spectrum
      epilepsy gene.
    evidence:
      - reference: PMID:33453592
        reference_title: >-
          Epilepsy with auditory features: Contribution of known genes in 112
          patients.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Pathogenic variants in SCN1A and DEPDC5 have also been described in a
          few EAF probands belonging to families with heterogeneous phenotypes
          and incomplete penetrance.
        explanation: >-
          Supports the association while explicitly noting the phenotypic
          heterogeneity that justifies the weaker SUSCEPTIBILITY typing here.
diagnosis:
  - name: Molecular genetic testing
    description: >-
      A heterozygous pathogenic variant in LGI1, MICAL1, or RELN establishes the
      molecular diagnosis in a proband with characteristic features. A negative
      result does not exclude the syndrome, since most families remain
      genetically unexplained, and the clinical diagnosis can stand on phenotype,
      normal MRI, and a consistent family history.
    diagnosis_term:
      preferred_term: Molecular Analysis
      term:
        id: NCIT:C19770
        label: Molecular Analysis
    results: >-
      A heterozygous pathogenic variant in LGI1, MICAL1, or RELN confirms the
      molecular diagnosis; a negative panel is uninformative.
    evidence:
      - reference: PMID:20301709
        reference_title: Autosomal Dominant Epilepsy with Auditory Features.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The molecular diagnosis is established in a proband with characteristic
          clinical features and a heterozygous pathogenic variant in LGI1, MICAL1,
          or RELN identified by molecular genetic testing.
        explanation: >-
          States the molecular diagnostic criterion and the three genes it rests
          on.
  - name: Electroencephalography
    description: >-
      Because MRI is normal by definition, EEG is the only investigation that
      returns a positive finding. Interictal epileptiform abnormalities or focal
      slow waves appear over the temporal regions in roughly 60 to 80 percent of
      patients, the higher figure coming from RELN-mutated families and the lower
      from LGI1-mutated ones. Marked left temporal predominance is a feature of
      the RELN group specifically and should not be expected in LGI1 families. A
      normal EEG does not exclude the diagnosis, which rests on semiology, normal
      imaging, and family history.
    diagnosis_term:
      preferred_term: Electroencephalography
      term:
        id: NCIT:C38054
        label: Electroencephalography
    results: >-
      Temporal epileptiform abnormalities or focal slow waves in roughly 60 to 80
      percent of patients depending on genotype; left-predominant in RELN
      families.
    evidence:
      - reference: PMID:28142128
        reference_title: >-
          The clinical phenotype of autosomal dominant lateral temporal lobe
          epilepsy related to reelin mutations.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The interictal EEG recordings showed epileptiform abnormalities or
          focal slow waves in 80% of patients, localized over the temporal
          regions, with marked left predominance and conventional 1,5T MRI scans
          were not contributory.
        explanation: >-
          Quantifies the EEG yield and its localization, and in the same sentence
          confirms that conventional MRI contributes nothing, which is why EEG is
          the diagnostic workhorse here.
  - name: Brain MRI
    description: >-
      MRI is normal in ADEAF and is performed to exclude a structural lesion
      rather than to demonstrate one. A visible lateral temporal lesion should
      redirect the diagnosis toward a structural focal epilepsy.
    diagnosis_term:
      preferred_term: Magnetic Resonance Imaging
      term:
        id: NCIT:C16809
        label: Magnetic Resonance Imaging
    results: Normal brain imaging.
    evidence:
      - reference: PMID:20301709
        reference_title: Autosomal Dominant Epilepsy with Auditory Features.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          normal brain imaging by MRI, and family history consistent with
          autosomal dominant inheritance
        explanation: >-
          Establishes normal MRI as part of the clinical diagnostic criteria.
progression:
  - phase: Onset in adolescence or early adulthood
    age_range: 10 to 30 years
    notes: >-
      Onset is later than in most genetic focal epilepsies, typically between
      ages 10 and 30, with normal development beforehand.
    evidence:
      - reference: PMID:20301709
        reference_title: Autosomal Dominant Epilepsy with Auditory Features.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Age at onset is usually in adolescence or early adulthood (age 10-30
          years).
        explanation: >-
          Gives the characteristic age-at-onset window for the syndrome.
  - phase: Benign medication-responsive course
    age_range: Adulthood
    notes: >-
      Unlike most focal epilepsies, ADEAF is benign in the sense that matters
      most: seizures are usually well controlled once treatment starts, and the
      syndrome does not carry the drug-resistance burden of structural focal
      epilepsy. Surveillance is directed at cognitive and psychiatric comorbidity
      rather than at seizure escalation.

      "Benign" should not be read as "remitting", however. In a long-term cohort
      of 123 patients with epilepsy with auditory features followed for a median
      of 11 years, only 34.1 percent reached terminal remission, defined as five
      or more consecutive seizure-free years at last follow-up. Good control on
      medication and freedom from seizures off medication are different
      outcomes, and this syndrome delivers the first far more reliably than the
      second.
    evidence:
      - reference: PMID:29464704
        reference_title: >-
          Epilepsy with auditory features: Long-term outcome and predictors of
          terminal remission.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          At last assessment, 42 patients had achieved TR (34.1%).
        explanation: >-
          The counterweight to the GeneReviews benign framing: only about a third
          of patients reach terminal remission. Marked PARTIAL because the cohort
          is epilepsy with auditory features broadly, 68.3 percent sporadic
          rather than familial, so it bounds rather than measures the ADEAF
          outcome.
      - reference: PMID:20301709
        reference_title: Autosomal Dominant Epilepsy with Auditory Features.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Seizure control is usually readily achieved with standard anti-seizure
          medications (ASM).
        explanation: >-
          States the benign, treatment-responsive course that defines this phase.
      - reference: PMID:20301709
        reference_title: Autosomal Dominant Epilepsy with Auditory Features.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Monitoring of epilepsy as clinically indicated; neurocognitive
          assessments in individuals suspected to have memory or attention
          deficits; evaluation by a psychiatrist for any psychiatric
          comorbidities.
        explanation: >-
          Documents that surveillance is directed at cognitive and psychiatric
          comorbidity, supporting the characterization of this phase.
treatments:
  - name: Standard Antiseizure Medication
    description: >-
      Seizure control is usually readily achieved with standard antiseizure
      medications. No agent is specific to ADEAF and none targets the LGI1
      mechanism; treatment is conventional focal-epilepsy pharmacotherapy. For
      women of childbearing potential, GeneReviews advises that the risks and
      benefits of a given medication in pregnancy be discussed before conception,
      and that transitioning to a lower-risk medication beforehand may be
      possible. Carbamazepine is named as the representative agent because it is
      the conventional first choice for focal seizures; this is a class
      representative rather than an ADEAF-specific indication, since no agent has
      been trialled against this syndrome in particular.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: carbamazepine
          term:
            id: CHEBI:3387
            label: carbamazepine
    target_mechanisms:
      - target: Focal Seizures with Auditory Features
        treatment_effect: INHIBITS
        description: >-
          Symptomatic seizure suppression at the terminal phenotype. The edge
          deliberately targets the seizure node rather than any upstream
          molecular node, because no available drug acts on the LGI1 complex.
    evidence:
      - reference: PMID:20301709
        reference_title: Autosomal Dominant Epilepsy with Auditory Features.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Treatment of manifestations: Seizure control is usually readily
          achieved with standard anti-seizure medications (ASM).
        explanation: >-
          The GeneReviews management recommendation, establishing conventional
          antiseizure medication as effective treatment.
      - reference: PMID:20301709
        reference_title: Autosomal Dominant Epilepsy with Auditory Features.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Discussion of the risks and benefits of using a given ASM during
          pregnancy should ideally take place prior to conception. Transitioning
          to a lower-risk medication prior to pregnancy may be possible.
        explanation: >-
          The pregnancy-management guidance from GeneReviews, captured here
          because it is the one drug-safety consideration the source raises.
  - name: 4-Phenylbutyrate (Investigational Chemical Chaperone)
    description: >-
      Not a clinical treatment. In a mouse model carrying a secretion-defective
      LGI1 variant, the chemical chaperone 4-phenylbutyrate restored protein
      folding and ADAM22 binding and reduced seizure susceptibility. It is
      recorded here because it is the only intervention that addresses the
      molecular mechanism rather than the seizures, and because it demonstrates
      the practical consequence of the two-class variant division: a corrector
      should help secretion-defective variants and would not be expected to help
      secretion-competent, binding-defective ones. No human data exist.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: 4-phenylbutyric acid
          term:
            id: CHEBI:41500
            label: 4-phenylbutyric acid
    target_mechanisms:
      - target: LGI1 Loss of Function
        treatment_effect: RESTORES
        description: >-
          Restores folding and receptor binding of a secretion-defective LGI1
          variant, acting on the proximal molecular defect rather than on seizure
          threshold.
    evidence:
      - reference: PMID:25485908
        reference_title: >-
          Chemical corrector treatment ameliorates increased seizure
          susceptibility in a mouse model of familial epilepsy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          A chemical corrector, 4-phenylbutyrate (4PBA), restored LGI1(E383A)
          folding and binding to ADAM22 and ameliorated the increased seizure
          susceptibility of the LGI1(E383A) model mice.
        explanation: >-
          Demonstrates mechanism-directed rescue in a model of the
          secretion-defective variant class. Model-organism evidence only; no
          human trial supports this use.
      - reference: PMID:25485908
        reference_title: >-
          Chemical corrector treatment ameliorates increased seizure
          susceptibility in a mouse model of familial epilepsy.
        supports: PARTIAL
        evidence_source: MODEL_ORGANISM
        snippet: >-
          This study establishes LGI1-related epilepsy as a conformational
          disease and suggests new therapeutic options for human epilepsy.
        explanation: >-
          The authors' own framing. Marked PARTIAL because "suggests new
          therapeutic options" is a proposal, not a demonstration of human
          benefit.
differential_diagnoses:
  - name: Anti-LGI1 Autoimmune Encephalitis
    description: >-
      Involves the same protein but is a different disease entirely: an acquired
      autoantibody-mediated limbic encephalitis with severe though treatable
      memory impairment and frequent faciobrachial dystonic seizures, typically
      in older adults. The contrast between losing LGI1 from birth and having it
      attacked in adulthood is recorded as a discussion.
    distinguishing_features:
      - Acquired in adulthood rather than lifelong and familial.
      - Serum or CSF antibodies against LGI1.
      - Prominent amnesia and faciobrachial dystonic seizures rather than auditory auras.
      - Responds to immunotherapy.
    evidence:
      - reference: PMID:30346486
        reference_title: >-
          LGI1 antibodies alter Kv1.1 and AMPA receptors changing synaptic
          excitability, plasticity and memory.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Human autoantibodies against LGI1 associate with a form of autoimmune
          limbic encephalitis characterized by severe but treatable memory
          impairment and frequent faciobrachial dystonic seizures.
        explanation: >-
          Describes the autoimmune syndrome and its distinguishing features, which
          is what separates it from the inherited disorder modelled here.
  - name: Sporadic Epilepsy with Auditory Features
    description: >-
      The same seizure semiology without a family history. It is not so much a
      distinct biological entity as the residue left when the autosomal dominant
      criterion is not met, and it matters here because genetic yield is much
      lower in this group, which is why cohort-derived gene frequencies should not
      be read as ADEAF yields.
    distinguishing_features:
      - No family history of epilepsy with auditory features.
      - Substantially lower yield from genetic testing.
    evidence:
      - reference: PMID:33453592
        reference_title: >-
          Epilepsy with auditory features: Contribution of known genes in 112
          patients.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We included 112 unrelated EAF cases (male/female: 52/60) who underwent
          genetic analysis by next-generation sequencing (NGS) techniques.
          Thirty-three (29.5%) were familial cases.
        explanation: >-
          Documents that the large auditory-features cohort was predominantly
          non-familial, which is the ascertainment point this differential makes.
  - name: Mesial Temporal Lobe Epilepsy with Hippocampal Sclerosis
    description: >-
      The other temporal lobe epilepsy, and the one ADEAF is most often mistaken
      for. It arises mesially rather than laterally, produces epigastric rising
      sensations, fear, and deja vu rather than auditory auras, shows hippocampal
      sclerosis on MRI, and is frequently drug-resistant. dismech carries a
      separate entry.
    distinguishing_features:
      - Mesial rather than lateral temporal onset.
      - Epigastric, psychic, and olfactory auras rather than auditory ones.
      - Hippocampal sclerosis visible on MRI, whereas ADEAF imaging is normal.
      - Frequently drug-resistant, whereas ADEAF is typically well controlled.
discussions:
  - discussion_id: adeaf_genetic_yield_gap
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      Only a minority of epilepsy-with-auditory-features cases have an
      identifiable causative variant in any known gene. What accounts for the
      rest, and does the residue represent unfound genes, non-coding variation,
      or a phenotype definition that is grouping unrelated things?
    attaches_to:
      - pathophysiology#LGI1 Loss of Function
    rationale: >-
      In the largest cohort assembled for this phenotype, 112 unrelated cases,
      only 8 percent received any genetic diagnosis: LGI1 2.7 percent, SCN1A 2.7
      percent, RELN 1.8 percent, DEPDC5 0.9 percent. That is a striking result
      for a syndrome whose name asserts a dominant inheritance pattern. Part of
      the explanation is ascertainment, since fewer than a third of that cohort
      were familial and LGI1 yield is considerably higher in genuinely autosomal
      dominant pedigrees; this entry labels the figure accordingly rather than
      quoting it as the ADEAF yield. But even restricting to dominant families
      leaves most of them unexplained. Three possibilities compete. There may
      simply be further genes to find, which is the conventional reading and is
      supported by the fact that MICAL1 and RELN were both added relatively
      recently. There may be non-coding or structural variation in or around LGI1
      itself that standard panels miss, which would leave LGI1 the dominant
      biological story even where sequencing is negative. Or the auditory
      phenotype may be a final common presentation of several unrelated lateral
      temporal pathologies, in which case the syndrome is a semiological grouping
      rather than a genetic entity. The distinction matters for whether a negative
      panel should end the diagnostic workup.
    proposed_experiments:
      - experiment_id: exp_adeaf_family_restricted_genome_sequencing
        name: Genome sequencing restricted to autosomal dominant ADEAF pedigrees
        description: >-
          Whole-genome sequencing with structural and non-coding variant calling
          in multiplex families meeting strict autosomal dominant ADEAF criteria,
          rather than in mixed cohorts, with linkage or segregation analysis where
          pedigree structure permits.
        decision_criterion: >-
          Recovery of causative variants in most strictly-defined families would
          establish the gap as a detection and ascertainment artefact; persistent
          negativity would support genetic heterogeneity beyond the known genes.
      - experiment_id: exp_adeaf_lgi1_regulatory_variation
        name: Search for regulatory variation at the LGI1 locus
        description: >-
          Targeted assessment of non-coding and structural variation at and around
          LGI1 in sequencing-negative ADEAF families, paired where tissue or
          iPSC-derived neurons are available with a measurement of LGI1 secretion.
        decision_criterion: >-
          Reduced LGI1 secretion in sequencing-negative cases would keep the
          single-mechanism model intact and redirect testing toward the regulatory
          region rather than toward new genes.
    evidence:
      - reference: PMID:33453592
        reference_title: >-
          Epilepsy with auditory features: Contribution of known genes in 112
          patients.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          This study shows that the contribution of each of the known genes to
          the overall disorder is limited and that the genetic background of EAF
          is still largely unknown.
        explanation: >-
          The authors' own statement of the gap, from the largest cohort assembled
          for this phenotype.
      - reference: PMID:33453592
        reference_title: >-
          Epilepsy with auditory features: Contribution of known genes in 112
          patients.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We identified a genetic diagnosis for 8% of our cohort, including
          pathogenic/likely pathogenic variants (4/8 novel) in LGI1 (2.7%, CI:
          0.6-7.6); RELN (1.8%; CI: 0.2-6.3); SCN1A (2.7%; CI: 0.6-7.6) and
          DEPDC5 (0.9%; CI 0-4.9).
        explanation: >-
          Quantifies the gap gene by gene, which is what makes it specific rather
          than a general complaint about missing heritability.
      - reference: PMID:20301709
        reference_title: Autosomal Dominant Epilepsy with Auditory Features.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          a heterozygous pathogenic variant in LGI1, MICAL1, or RELN identified by
          molecular genetic testing
        explanation: >-
          The current authoritative gene list. PARTIAL because it defines what
          counts as a molecular diagnosis without stating what fraction of
          patients achieve one.
  - discussion_id: adeaf_heterozygous_mouse_does_not_seize
    kind: HUMAN_MODEL_MISMATCH
    status: OPEN
    prompt: >-
      Heterozygous Lgi1 mice do not develop seizures, whereas heterozygous humans
      develop ADEAF. Does that gene-dosage discrepancy mean the mouse is the
      wrong model, or that human ADEAF requires something beyond simple
      haploinsufficiency?
    attaches_to:
      - pathophysiology#LGI1 Loss of Function
      - pathophysiology#Dysregulated AMPA Receptor Clustering and Synaptic Excitability
    rationale: >-
      The mismatch is clean and quantitative. In the Lgi1 null mouse, homozygotes
      develop myoclonic seizures from around 12 to 18 days of age and die shortly
      afterward, while heterozygotes do not develop seizures at all. Human ADEAF
      is a heterozygous disorder in every reported family. So the mouse
      reproduces the biology only at a gene dosage that has no human counterpart,
      and at that dosage it produces a lethal early myoclonic phenotype rather
      than a benign adolescent-onset focal auditory epilepsy. Several readings
      are available and they have different consequences. Human penetrance is
      incomplete, between 54 and 85 percent, which already tells us
      haploinsufficiency alone is insufficient in humans too, so the mouse may
      simply lack whatever second factor the unpenetrant human carriers also
      lack. Alternatively, mouse and human may differ in reserve, with mice
      tolerating half-normal LGI1 where humans cannot. A third possibility is
      that many human variants act as more than simple nulls, given that one of
      the two described classes is secreted but functionally inert and could in
      principle interfere with the complex rather than merely be absent from it.
      The knockout, which removes protein entirely, cannot model that. This
      matters because the model used to test a therapy determines what the
      therapy is optimized against.
    proposed_experiments:
      - experiment_id: exp_adeaf_knockin_heterozygous_human_variants
        name: Heterozygous knock-in of human ADEAF variants from both classes
        description: >-
          Generate and phenotype heterozygous knock-in mice carrying human
          secretion-defective and secretion-competent binding-defective LGI1
          variants, rather than a null allele, with long-term video-EEG through
          the mouse equivalent of adolescence.
        decision_criterion: >-
          Seizures in heterozygous knock-ins but not in heterozygous nulls would
          show that human variants are not simple haploinsufficiency and would
          make the knockout the wrong model; absence of seizures in both would
          point to a species difference in reserve.
      - experiment_id: exp_adeaf_penetrance_modifier_search
        name: Search for modifiers distinguishing penetrant from non-penetrant carriers
        description: >-
          Compare genomes and, where accessible, LGI1 secretion in penetrant
          versus non-penetrant human carriers within the same pedigrees, to
          identify what the unaffected carriers have that the affected ones lack.
        decision_criterion: >-
          Identifying a reproducible modifier would explain both the human
          incomplete penetrance and, if conserved, the unaffected heterozygous
          mouse, unifying the two observations rather than treating the mouse as
          simply wrong.
    evidence:
      - reference: PMID:20130004
        reference_title: >-
          Lgi1 null mutant mice exhibit myoclonic seizures and CA1 neuronal
          hyperexcitability.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The heterozygous mutant mice do not develop seizures.
        explanation: >-
          The core observation of this mismatch: the mouse genotype matching human
          ADEAF produces no epilepsy.
      - reference: PMID:20130004
        reference_title: >-
          Lgi1 null mutant mice exhibit myoclonic seizures and CA1 neuronal
          hyperexcitability.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          After 12-18 days of age, the homozygous mutant mice all exhibit
          myoclonic seizures accompanied by rapid jumping and running and die
          shortly thereafter.
        explanation: >-
          Shows that the dosage at which the mouse does seize produces a phenotype
          qualitatively unlike human ADEAF, which is the second half of the
          mismatch.
      - reference: PMID:20301709
        reference_title: Autosomal Dominant Epilepsy with Auditory Features.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          the chance that offspring who inherit the pathogenic variant will
          manifest ADEAF ranges from 54% to 85% depending on the assumed
          penetrance
        explanation: >-
          Establishes that heterozygosity is insufficient in humans too, which is
          the observation that makes the modifier explanation plausible rather
          than ad hoc.
  - discussion_id: adeaf_genetic_versus_autoimmune_lgi1
    kind: OPEN_QUESTION
    status: OPEN
    prompt: >-
      Losing LGI1 through inherited loss of function produces a benign
      adolescent-onset focal epilepsy with auditory auras. Attacking the same
      protein with autoantibodies in adulthood produces a severe amnestic limbic
      encephalitis with faciobrachial dystonic seizures. Why do the two routes to
      LGI1 dysfunction give such different diseases?
    attaches_to:
      - pathophysiology#Disrupted LGI1-ADAM22 Trans-Synaptic Complex
      - pathophysiology#Lateral Temporal Cortical Hyperexcitability
    rationale: >-
      This is not a diagnostic confusion, since the two are easy to tell apart
      clinically. It is a mechanistic puzzle, and its answer would sharpen the
      model in this entry. Three explanations are candidates and they are not
      mutually exclusive. Timing: inherited loss is present throughout
      development, so the brain builds itself around the deficiency and can
      compensate, whereas an autoantibody removes a functioning protein abruptly
      from a mature circuit that has come to depend on it. That would predict
      developmental compensation as the reason the inherited form is benign.
      Completeness: a heterozygous variant leaves roughly half the normal protein,
      whereas antibodies can strip function more thoroughly, so the difference may
      be quantitative rather than qualitative. Mechanism specificity: antibodies
      target particular epitopes and can disrupt the ADAM22 arm and the
      ADAM23-Kv1.1 arm to different degrees, so the autoimmune lesion may not be
      equivalent to loss of the whole protein. The regional discrepancy is the
      sharpest part of the puzzle. Inherited loss localizes to lateral temporal
      auditory and language cortex; the autoimmune form targets limbic and
      basal-ganglia circuits. Neither this entry nor the source literature
      explains why a molecule present across the brain should produce
      region-specific disease at all, let alone different regions by different
      routes.
    proposed_experiments:
      - experiment_id: exp_lgi1_timing_of_loss_comparison
        name: Developmental versus adult-onset LGI1 loss in the same model
        description: >-
          Compare conditional Lgi1 deletion during development against inducible
          adult deletion in the same mouse line, phenotyping seizure semiology,
          affected circuits, and memory, to isolate timing from completeness of
          loss.
        decision_criterion: >-
          If adult-onset deletion reproduces the limbic and amnestic phenotype
          while developmental deletion does not, timing and developmental
          compensation are established as the dominant variable.
      - experiment_id: exp_lgi1_regional_dependency_mapping
        name: Map regional dependence on the LGI1-ADAM22 complex
        description: >-
          Quantify LGI1, ADAM22, and ADAM23 expression and the functional
          dependence of local excitability on the complex across lateral temporal,
          mesial temporal, and basal-ganglia circuits.
        decision_criterion: >-
          A regional gradient in dependence would explain the localization of the
          inherited syndrome; a uniform profile would mean the regional
          specificity must come from the nature of the insult rather than from the
          substrate.
    evidence:
      - reference: PMID:30346486
        reference_title: >-
          LGI1 antibodies alter Kv1.1 and AMPA receptors changing synaptic
          excitability, plasticity and memory.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Human autoantibodies against LGI1 associate with a form of autoimmune
          limbic encephalitis characterized by severe but treatable memory
          impairment and frequent faciobrachial dystonic seizures.
        explanation: >-
          Establishes the autoimmune phenotype that contrasts with the inherited
          one, which is the substance of this question.
      - reference: PMID:30346486
        reference_title: >-
          LGI1 antibodies alter Kv1.1 and AMPA receptors changing synaptic
          excitability, plasticity and memory.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          Although there is evidence that this disease is immune-mediated, the
          underlying LGI1 antibody-mediated mechanisms are unknown.
        explanation: >-
          Confirms that the autoimmune mechanism was itself unresolved, which is
          part of why the comparison with the inherited disorder cannot yet be
          made rigorously.
      - reference: PMID:20301709
        reference_title: Autosomal Dominant Epilepsy with Auditory Features.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The clinical course of ADEAF is benign. Seizures are usually well
          controlled after initiation of medical therapy.
        explanation: >-
          The inherited-side half of the contrast: benign and treatable, against
          the severe amnestic autoimmune syndrome.

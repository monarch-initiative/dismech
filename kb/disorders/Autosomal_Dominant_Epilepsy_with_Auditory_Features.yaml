      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: Here, we show that the selective expression of LGI1 in KO-Lgi1 neurons from mice of both sexes, using single-cell electroporation, reduces intrinsic excitability and restores both the Kv1.1-mediated D-type current and Kv1.1 channels at the AIS.
      explanation: Restoration in organotypic mouse hippocampal neurons supports a Kv1-related excitability mechanism; this is not a human treatment.
  - target: Shortened Axon Initial Segment
    description: A structural response in deficient cultured neurons provides an experimental hypothesis, not a documented patient lesion.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

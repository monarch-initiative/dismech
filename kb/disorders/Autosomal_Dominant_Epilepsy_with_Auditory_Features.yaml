      snippet: Concurrently, mutant LGI1 inhibited dendritic pruning and increased the spine density to markedly increase excitatory synaptic transmission.
      explanation: 835delC BAC transgene model supports a developmental synaptic branch; it is not a heterozygous knock-in or a universal patient finding.

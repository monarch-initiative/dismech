- name: Heterozygous RELN Variants
  biological_scale: MOLECULAR
  description: Heterozygous pathogenic RELN variants cause a reduced-penetrance ADEAF form. Clinical similarity to LGI1 disease does not demonstrate a common molecular route.
  evidence:
  - &id006
    reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4457960/

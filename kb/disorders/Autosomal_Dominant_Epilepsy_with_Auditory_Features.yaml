inheritance:
- name: Autosomal dominant with incomplete penetrance
  description: Heterozygous pathogenic variants cause dominant disease with incomplete penetrance. A variant carrier has a 50% transmission probability per pregnancy, distinct from the probability that an inheriting child develops epilepsy. Family estimates vary by gene and ascertainment; de novo variants can occur and MICAL1 penetrance is not established.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  evidence:
  - reference: PMID:20301709
    reference_title: Autosomal Dominant Epilepsy with Auditory Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Offspring of an individual with ADEAF who is heterozygous for a pathogenic variant have a 50% chance of inheriting the pathogenic variant; the chance that offspring who inherit the pathogenic variant will manifest ADEAF ranges from 54% to 85% depending on the assumed penetrance.
    explanation: Gives both the transmission probability and the penetrance range, which together are the counselling content of this block.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: At last assessment, 42 patients had achieved TR (34.1%).
    explanation: Broader EAF cohort outcome, not medication-free remission or familial-only prognosis.

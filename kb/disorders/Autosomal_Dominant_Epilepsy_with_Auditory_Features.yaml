    explanation: Complex songs or voices are included in the clinical auditory spectrum; “less common” does not define a numeric frequency.
- name: Focal to Bilateral Tonic-Clonic Seizures
  category: Neurologic
  description: Focal seizures may evolve to bilateral tonic-clonic seizures. The selected RELN series documented focal evolution in 16/24 clinically assessed patients; its 21/24 any-convulsion total also included five cases with unknown onset and cannot be treated as 21 focal-to-bilateral cases.

    snippet: Autosomal dominant lateral temporal epilepsy (ADLTE) otherwise known as autosomal dominant partial epilepsy with auditory features (ADPEAF) is a genetic focal epileptic syndrome characterized by the onset at any age, but with preponderance in young adults, of focal seizures, either with or without impairment of consciousness or evolving to tonic–clonic seizures, with prominent auditory features or other symptoms, such as aphasia, suggesting a lateral temporal onset

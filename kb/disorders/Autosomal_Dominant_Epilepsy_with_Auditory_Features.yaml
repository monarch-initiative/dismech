- name: Local LGI1 restoration in organotypic hippocampal culture
  experimental_model_type: OTHER
  description: Organotypic slices from P7–10 homozygous-null mice of both sexes underwent single-cell electroporation of 8–10 selected neurons per slice. Inducible LGI1 expression was assessed with CA3 recordings after three days; extracellular tagged-protein visualization used a separate six-day interval. Intrinsic recordings blocked ionotropic glutamate and GABA receptors. Current, firing and AIS Kv1.1 rescue were measured in expressing cells; nearby rheobase improved, but nearby Kv1.1 staining was not significantly increased.

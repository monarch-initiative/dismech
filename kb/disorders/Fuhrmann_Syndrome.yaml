name: Fuhrmann Syndrome
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Fuhrmann syndrome is a rare autosomal recessive limb malformation syndrome
  characterized by bowed femora, fibular aplasia or hypoplasia, oligodactyly,
  and nail hypoplasia. It is caused by homozygous missense variants in WNT7A,
  the dorsal-ectoderm signal that patterns the dorsoventral axis of the
  developing limb. Fuhrmann syndrome and Al-Awadi/Raas-Rothschild/Schinzel
  phocomelia syndrome (AARRS) are allelic: the two were described as distinct
  disorders, but both arise from WNT7A and are separated by how much WNT7A
  function survives. Partial loss of function produces Fuhrmann syndrome, which
  phenocopies the mouse Wnt7a knockout; complete loss produces the far more
  severe limb truncation of AARRS, which instead resembles the Shh knockout.
  That gradient is the defining mechanistic feature of the entity and explains
  why a single gene yields two named syndromes.
disease_term:
  preferred_term: Fuhrmann syndrome
  term:
    id: MONDO:0009232
    label: Fuhrmann syndrome
synonyms:
- fibular aplasia or hypoplasia, femoral bowing and poly-, syn-, and oligodactyly
- FFS
parents:
- Limb Malformation Syndrome
inheritance:
- name: Autosomal Recessive
  description: >-
    Homozygous missense WNT7A variants were identified in the affected
    families, consistent with autosomal recessive inheritance.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:16826533
    reference_title: "Mutations in WNT7A cause a range of limb malformations, including Fuhrmann syndrome and Al-Awadi/Raas-Rothschild/Schinzel phocomelia syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In families with these syndromes, we found homozygous missense mutations in the dorsoventral-patterning gene WNT7A and confirmed their functional significance in retroviral-mediated transfection of chicken mesenchyme cell cultures and developing limbs."
    explanation: >-
      Homozygous variants in affected families establish recessive inheritance.
pathophysiology:
- name: Partial Loss of WNT7A Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous missense WNT7A variants reduce, but do not abolish, the activity
    of the secreted dorsal-ectoderm signal. The residual activity is what
    separates Fuhrmann syndrome from AARRS: null alleles of the same gene
    produce the much more severe phocomelia phenotype.
  genetic_context:
    gene:
      preferred_term: WNT7A
      term:
        id: hgnc:12786
        label: WNT7A
    allele_type: missense
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:16826533
    reference_title: "Mutations in WNT7A cause a range of limb malformations, including Fuhrmann syndrome and Al-Awadi/Raas-Rothschild/Schinzel phocomelia syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The results suggest that a partial loss of WNT7A function causes Fuhrmann syndrome (and a phenotype similar to mouse Wnt7a knockout), whereas the more-severe limb truncation phenotypes observed in Al-Awadi/Raas-Rothschild/Schinzel phocomelia syndrome result from null mutations (and cause a phenotype similar to mouse Shh knockout)."
    explanation: >-
      States the dose-dependent allelic relationship. Graded MODEL_ORGANISM
      because the functional claim rests on the chicken transfection assay and
      the mouse knockout comparison, not on a measurement in patients.
  downstream:
  - target: Impaired Dorsoventral Patterning of the Limb
    description: >-
      Reduced WNT7A signalling from dorsal ectoderm weakens induction of the
      dorsal mesenchymal programme.
  - target: Failure to Maintain SHH Expression
    description: >-
      WNT7A is required to sustain Shh in the posterior mesenchyme, so partial
      loss compromises anteroposterior patterning as well.
- name: Impaired Dorsoventral Patterning of the Limb
  biological_scale: TISSUE
  description: >-
    WNT7A from the dorsal ectoderm induces and maintains the LIM homeodomain
    transcription factor LMX1 in dorsal limb mesenchyme, which specifies dorsal
    identity. Weakened induction produces the dorsal-structure defects,
    including nail hypoplasia.
  biological_processes:
  - preferred_term: Dorsal/ventral pattern formation
    term:
      id: GO:0009953
      label: dorsal/ventral pattern formation
    modifier: DECREASED
  evidence:
  - reference: PMID:7585966
    reference_title: "Induction of the LIM homeobox gene Lmx1 by WNT7a establishes dorsoventral pattern in the vertebrate limb."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus, the dorsalization of limb mesoderm appears to involve the WNT7a-mediated induction of Lmx1 in limb mesenchymal cells."
    explanation: >-
      Establishes the WNT7a to Lmx1 axis as the mechanism of limb dorsalization
      in the chick.
  downstream:
  - target: Nail Hypoplasia
    description: >-
      Nails are dorsal appendages; loss of dorsal identity leaves them
      hypoplastic.
- name: Failure to Maintain SHH Expression
  biological_scale: TISSUE
  description: >-
    Dorsal ectoderm, through WNT7a, is required together with FGF4 to maintain
    Shh expression in the posterior mesenchyme. Removing that signal causes loss
    of posterior skeletal elements. This is the link from a dorsoventral
    signalling defect to the postaxial limb deficiencies seen clinically.
  biological_processes:
  - preferred_term: Smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:7697724
    reference_title: "Interaction between the signaling molecules WNT7a and SHH during vertebrate limb development: dorsal signals regulate anteroposterior patterning."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Wnt7a, which is expressed in dorsal ectoderm, provides the signal required for Shh expression and formation of posterior structures."
    explanation: >-
      Identifies WNT7a as the dorsal signal maintaining Shh and posterior
      skeletal elements.
  - reference: PMID:7697724
    reference_title: "Interaction between the signaling molecules WNT7a and SHH during vertebrate limb development: dorsal signals regulate anteroposterior patterning."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Removal of dorsal ectoderm results in loss of posterior skeletal elements, which can be rescued by exogenous SHH."
    explanation: >-
      The rescue experiment places SHH downstream of the dorsal signal,
      supporting the causal direction of this edge.
  downstream:
  - target: Postaxial Limb Deficiency
    description: >-
      Loss of posterior skeletal elements manifests as fibular aplasia and
      oligodactyly.
- name: Postaxial Limb Deficiency
  biological_scale: ORGANISM
  description: >-
    Absence or hypoplasia of the fibula with oligodactyly, together with femoral
    bowing — the skeletal core of the Fuhrmann phenotype.
  evidence:
  - reference: PMID:16826533
    reference_title: "Mutations in WNT7A cause a range of limb malformations, including Fuhrmann syndrome and Al-Awadi/Raas-Rothschild/Schinzel phocomelia syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fuhrmann syndrome and the Al-Awadi/Raas-Rothschild/Schinzel phocomelia syndrome are considered to be distinct limb-malformation disorders characterized by various degrees of limb aplasia/hypoplasia and joint dysplasia in humans."
    explanation: >-
      Characterizes the human limb aplasia/hypoplasia phenotype.
- name: Nail Hypoplasia
  biological_scale: ORGANISM
  description: >-
    Hypoplastic nails, the dorsal-appendage consequence of impaired
    dorsalization.
  evidence:
  - reference: PMID:7585966
    reference_title: "Induction of the LIM homeobox gene Lmx1 by WNT7a establishes dorsoventral pattern in the vertebrate limb."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Ectopic expression of Lmx1 in the ventral mesenchyme is sufficient to generate double-dorsal limbs."
    explanation: >-
      Supports the dorsalization mechanism that nail hypoplasia is attributed
      to. Graded PARTIAL because this is a chick gain-of-function experiment
      about dorsal identity, not an observation of nail hypoplasia.

genetic:
- name: WNT7A
  gene_term:
    preferred_term: WNT7A
    term:
      id: hgnc:12786
      label: WNT7A
  relationship_type: CAUSATIVE
  notes: >-
    Homozygous missense WNT7A variants with residual activity cause Fuhrmann
    syndrome; null alleles of the same gene cause AARRS. Severity tracks
    residual WNT7A function rather than variant position.
  evidence:
  - reference: PMID:16826533
    reference_title: "Mutations in WNT7A cause a range of limb malformations, including Fuhrmann syndrome and Al-Awadi/Raas-Rothschild/Schinzel phocomelia syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In families with these syndromes, we found homozygous missense mutations in the dorsoventral-patterning gene WNT7A and confirmed their functional significance in retroviral-mediated transfection of chicken mesenchyme cell cultures and developing limbs."
    explanation: >-
      Establishes WNT7A as the causal gene in affected families.
  - reference: PMID:23266637
    reference_title: The WNT7A G204S mutation is associated with both Al-Awadi-Raas Rothschild syndrome and Fuhrmann syndrome phenotypes.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In the current communication, we report on a different unrelated Saudi patient with the same mutation but the patient had Fuhrmann syndrome phenotype."
    explanation: >-
      Qualifies the dose model rather than supporting it: the G204S variant
      previously reported to cause AARRS in three Saudi families produced a
      Fuhrmann phenotype in an unrelated patient, so residual WNT7A activity
      does not fully determine which syndrome results.
differential_diagnoses:
- name: Al-Awadi/Raas-Rothschild/Schinzel Phocomelia Syndrome
  description: >-
    Allelic to Fuhrmann syndrome, caused by WNT7A null alleles rather than
    partial-loss-of-function missense variants, and producing much more severe
    limb truncation. dismech currently describes AARRS inside the
    Humeroradial_Synostosis entry's genetic section rather than as its own
    Disease entry.
  evidence:
  - reference: PMID:16826533
    reference_title: "Mutations in WNT7A cause a range of limb malformations, including Fuhrmann syndrome and Al-Awadi/Raas-Rothschild/Schinzel phocomelia syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The results suggest that a partial loss of WNT7A function causes Fuhrmann syndrome (and a phenotype similar to mouse Wnt7a knockout), whereas the more-severe limb truncation phenotypes observed in Al-Awadi/Raas-Rothschild/Schinzel phocomelia syndrome result from null mutations (and cause a phenotype similar to mouse Shh knockout)."
    explanation: >-
      States the allelic relationship and the functional basis for the severity
      difference.
discussions:
- discussion_id: fuhrmann_human_mechanism_untested
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Impaired Dorsoventral Patterning of the Limb
  - pathophysiology#Failure to Maintain SHH Expression
  prompt: >-
    Do the chick WNT7a-LMX1 and WNT7a-SHH axes actually operate as described in
    the human limb, and do the Fuhrmann syndrome missense variants reduce
    signalling through those specific axes in human tissue?
  rationale: >-
    Both mechanism nodes rest entirely on avian embryology (PMID:7585966,
    PMID:7697724) plus mouse knockout comparison. The human genetic evidence
    (PMID:16826533) establishes that WNT7A causes the syndrome and that severity
    is dose-dependent, but it does not demonstrate which downstream axis is
    disrupted in patients. Evidence exists in the model but its translational
    validity for the human limb is untested here, which is what distinguishes
    this from a plain knowledge gap.
- discussion_id: fuhrmann_femoral_bowing_unexplained
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Femoral Bowing
  prompt: >-
    What mechanism produces the femoral bowing in Fuhrmann syndrome, given that
    neither the WNT7A-LMX1 dorsalization branch nor the WNT7A-SHH posterior
    branch accounts for a proximal long-bone deformity?
  rationale: >-
    Femoral bowing is in the disorder's own alternative name and is reported as
    one of its most frequent features, yet it is the one phenotype in this entry
    with no upstream pathophysiology node. Both curated mechanism branches
    explain distal and posterior structures. Either a third WNT7A-dependent
    process acts on proximal long-bone morphogenesis, or the bowing is secondary
    to the fibular deficiency and abnormal loading rather than primary. Neither
    is established.
- discussion_id: fuhrmann_genotype_phenotype_correlation
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Partial Loss of WNT7A Function
  prompt: >-
    Does residual WNT7A activity actually determine whether a patient has
    Fuhrmann syndrome or AARRS?
  rationale: >-
    This entry curates the dose model from PMID:16826533 — partial loss gives
    Fuhrmann, null gives AARRS. PMID:23266637 reports the same G204S variant
    producing AARRS in three Saudi families and a Fuhrmann phenotype in an
    unrelated Saudi patient, and its authors explicitly question whether a
    genotype-phenotype correlation holds. The dose model may still be right in
    aggregate while failing to predict individual cases; modifiers and genetic
    background are untested.
- discussion_id: fuhrmann_aarrs_entry_shape
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#Fuhrmann Syndrome
  prompt: >-
    Should Fuhrmann syndrome and AARRS be curated as one WNT7A allelic-series
    entry with has_subtypes, rather than as a Fuhrmann entry cross-referencing
    an AARRS description that lives inside Humeroradial_Synostosis?
  rationale: >-
    PMID:16826533 argues the two named syndromes are one dose-dependent WNT7A
    spectrum. dismech currently has no AARRS Disease entry — it is described in
    the genetic section of Humeroradial_Synostosis — so the spectrum is split
    across two entries in an order that reflects curation history rather than
    biology. Consolidating is a larger change than this entry should make
    unilaterally.
notes: >-
  Fuhrmann syndrome is very rare and the entry is deliberately thin. No
  prevalence, treatment, natural history, or clinical trial data were found, so
  those sections are absent rather than populated from the broader limb
  malformation literature.

  Six phenotypes carry no evidence item: femoral bowing, polydactyly,
  syndactyly, nail hypoplasia, ulnar aplasia/hypoplasia and pelvic hypoplasia.
  The inclusion rule is that a feature is curated without evidence when it is
  attested in the disorder's own alternative title ("fibular aplasia or
  hypoplasia, femoral bowing and poly-, syn-, and oligodactyly"), in its
  clinical definition, or in the title of PMID:21716096 ("Hypoplasia/aplasia of
  pelvis, femora, fibulae, ulna, digits and nails: Fuhrmann syndrome without
  WNT7A mutations"). An earlier version of this entry curated only the first
  four, which made the cut arbitrary: the pelvic and ulnar features are
  attested at exactly the same level as the four that were included, so
  excluding them was inconsistent rather than conservative. Hip involvement is
  not curated, because unlike these six it appears only in disease-registry
  pages via the deep-research report and not in any title or definition.

  None of the six is citable, because neither a disease name, a clinical
  definition, nor a paper title is a source for a finding — a title in
  particular is what check-title-snippets exists to keep out of snippet fields.
  Two routes to real evidence were tried and both closed. Orphanet, which is the right
  source for HPO-term-plus-frequency rows and which dismech uses for 7,418
  evidence items, is currently unbuildable: `just refresh-orphadata` fails
  because data/orphadata/MANIFEST.yaml pins the 2025-12-09 snapshot while
  Orphadata serves a 2026-06-23 release at the same URLs, and bumping that pin
  rebuilds all 345 committed ORPHA cache files (filed separately). And
  PMID:21716096 — "Hypoplasia/aplasia of pelvis, femora, fibulae, ulna, digits
  and nails: Fuhrmann syndrome without WNT7A mutations", by title the single
  most on-point clinical source for exactly these features — has
  content_type: unavailable in PubMed, so there is no abstract text to quote.
  It is recorded in references: for provenance. These phenotypes should pick up
  evidence once the Orphanet pin is fixed.

  PMID:21716096 also reports a Fuhrmann phenotype with no WNT7A mutation found,
  which would bear on whether the disorder is genetically homogeneous. That
  claim is not curated, for the same reason: no quotable text.

  Evidence grading here is worth reading carefully. The human genetic claim is
  HUMAN_CLINICAL; every mechanism node is MODEL_ORGANISM, because the WNT7a
  developmental biology is chick and mouse work. Several phenotype items are
  graded PARTIAL because the cited abstract describes limb aplasia/hypoplasia
  generically without naming the specific structure.

  The deep-research report asserted several of the unevidenced phenotypes
  above, but its own citations for them were disease-registry web pages rather
  than literature.

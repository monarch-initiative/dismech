    causal_link_type: DIRECT

- name: Autoimmunity
  biological_scale: ORGANISM
  description: >
    Autoimmune cytopenias — haemolytic anaemia and thrombocytopenia — occur in
    ORAI1-deficient patients alongside the immunodeficiency. The combination
    of immunodeficiency with autoimmunity is characteristic of the CRAC
    channelopathies and is attributed to the loss of the regulatory T cell
    compartment rather than to the effector defect.
  evidence:
  - reference: PMID:29155098
    reference_title: "ORAI1 mutations abolishing store-operated Ca(2+) entry cause anhidrotic ectodermal dysplasia with immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ORAI1 null mutations are associated with reduced numbers of invariant natural killer T and Treg cells that likely contribute to the patients' immunodeficiency and autoimmunity."
    explanation: >
      Links the reduced regulatory compartment to the autoimmune phenotype,
      as the authors' own interpretation.
  downstream:
  - target: Autoimmune Hemolytic Anemia
    description: >-
      Autoimmune destruction of erythrocytes, one of the autoimmune
      cytopenias reported in CRAC channelopathy.
    causal_link_type: DIRECT


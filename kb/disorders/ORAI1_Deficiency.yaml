name: ORAI1 Deficiency
creation_date: "2026-08-31T21:30:00Z"
category: Mendelian
synonyms:
- combined immunodeficiency due to ORAI1 deficiency
- CRAC channelopathy due to ORAI1 deficiency
- immunodeficiency 9
- IMD9
- ORAI1 CRAC channelopathy
disease_term:
  preferred_term: combined immunodeficiency due to ORAI1 deficiency
  term:
    id: MONDO:0013007
    label: combined immunodeficiency due to ORAI1 deficiency
parents:
- Primary Immunodeficiency
- Combined Immunodeficiency
- Channelopathy
description: >
  ORAI1 deficiency is an autosomal recessive CRAC (calcium release-activated
  calcium) channelopathy. ORAI1 is the pore-forming subunit of the plasma
  membrane CRAC channel; when endoplasmic reticulum calcium stores are
  depleted, the ER calcium sensor STIM1 gates ORAI1 to produce sustained
  store-operated calcium entry (SOCE). Biallelic loss-of-function ORAI1
  variants abolish SOCE, and the resulting failure of calcium/calcineurin/NFAT
  signalling produces a combined immunodeficiency in which lymphocyte
  *development* is essentially normal but lymphocyte *function* is not: T cells
  are present in normal numbers yet fail to produce cytokines on stimulation.
  The clinical syndrome is a triad of combined immunodeficiency with
  life-threatening infection in infancy, a congenital non-progressive muscular
  hypotonia, and anhidrotic ectodermal dysplasia with defective dental enamel
  mineralization. Autoimmunity — most often autoimmune haemolytic anaemia or
  thrombocytopenia — is a recurrent fourth feature, and tracks with markedly
  reduced invariant natural killer T and regulatory T cell numbers. Despite
  near-ubiquitous ORAI1 expression across tissues, the phenotype is confined
  to these few organ systems, implying that CRAC-mediated calcium entry is
  non-redundant in only a small number of cell types. The disease is
  ultra-rare, with the published literature amounting to a handful of
  kindreds. Allogeneic haematopoietic stem cell transplantation corrects the
  immunological arm but not the myopathic or ectodermal arms, which are
  cell-intrinsic to non-haematopoietic tissue.
notes: >
  Ultra-rare. The published cohort is a small number of kindreds: the founding
  SCID family with the homozygous ORAI1 p.R91W missense allele (Feske et al.,
  Nature 2006), two further unrelated families with a frameshift and a
  compound heterozygous missense genotype (McCarl et al., JACI 2009), and
  three further unrelated kindreds homozygous for p.V181SfsX8, p.L194P and
  p.G98R (Lian et al., JACI 2018). Counts in this entry are therefore counts
  of kindreds or patients, never frequencies, and `frequency` is deliberately
  left unset throughout rather than computed from a cohort this small.

  The entry is deliberately careful about one distinction that the disease
  name invites people to get wrong. This is a combined immunodeficiency of
  lymphocyte *function*, not of lymphocyte *development*: patients have normal
  or near-normal T, B and NK cell counts and normal thymic output, and the
  defect appears on stimulation. That is what separates ORAI1 deficiency from
  the classical T-B-NK- severe combined immunodeficiencies it is often
  grouped with, and it is why the pathograph routes through cytokine
  transcription rather than through a lymphopoiesis node.

  The sibling disease STIM1 deficiency (MONDO:0013006) produces a closely
  overlapping syndrome through loss of the ER calcium sensor that gates ORAI1,
  and both sit under `combined immunodeficiency due to CRAC channel
  dysfunction` (MONDO:0015695). No `has_subtypes` relationship is asserted
  between them here: they are separate genes and separate MONDO concepts, and
  the right structure for the pair is a future grouping, not a subtype list.

  Anhidrotic ectodermal dysplasia with immunodeficiency (AED-ID) is also
  caused by defects in NF-kappaB signalling (IKBKG/NEMO, NFKBIA). The
  ORAI1-associated form is a phenotypic convergence on a different mechanism,
  not a variant of those, and Lian et al. make that point explicitly. It is
  recorded in `discussions` rather than left implicit, because the overlap is
  a real differential-diagnosis trap.

  **ORAI1 is a two-faced gene, and this entry is only one of its faces.**
  Autosomal *dominant* gain-of-function ORAI1 variants constitutively activate
  the CRAC channel and cause an entirely different, overlapping spectrum that
  includes tubular aggregate myopathy and Stormorken syndrome. Those are not
  "ORAI1 deficiency" and are not curated here. The distinction matters
  practically: a literature search on ORAI1 returns both, and the myopathy in
  the gain-of-function diseases is a different lesion from the congenital
  hypotonia described below, despite both being muscle.

  No `conforms_to` was declared. The candidate module families were searched
  and none matches: this is a channel-gated transcription-factor activation
  failure, not an inflammatory, fibrotic, or degeneration chain. If a
  calcium-signalling-failure module is ever created, this entry and STIM1
  deficiency are its first two conformers.

  **Deep-research provenance.** An OpenScientist run
  (`research/ORAI1_Deficiency-deep-research-openscientist.md`) is committed
  alongside this entry; `just preflight-dr` scores it PASS with ORAI1 at 59
  mentions and a matching OMIM (612782), and 13/13 of its references resolved
  with 11/13 on topic. It contributed the haemophagocytic lymphohistiocytosis
  presentation (PMID:28633876) and the gain-of-function contrast
  (PMID:26469693) recorded above. Every quote used was re-verified against the
  fetched reference cache rather than taken from the report.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Reported patients are homozygous or compound heterozygous for
    loss-of-function ORAI1 alleles. Heterozygous carriers are clinically
    unaffected, although their T cells show measurably impaired store-operated
    calcium entry, indicating a gene-dosage effect at the cellular level that
    does not reach a clinical threshold.
  evidence:
  - reference: PMID:16582901
    reference_title: "A mutation in Orai1 causes immune deficiency by abrogating CRAC channel function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The SCID patients are homozygous for a single missense mutation in ORAI1"
    explanation: >
      Establishes homozygosity for a single ORAI1 allele in the founding
      kindred, i.e. autosomal recessive inheritance.
  - reference: PMID:19075015
    reference_title: "The Orai1 severe combined immune deficiency mutation and calcium release-activated Ca2+ channel function in the heterozygous condition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although heterozygous carriers of the mutation show no clinical symptoms of immunodeficiency, store-operated Ca(2+) entry in their T cells is impaired, suggesting a gene-dosage effect of the mutation."
    explanation: >
      Documents that carriers are clinically unaffected while showing a
      partial cellular phenotype, which is the basis for the recessive
      classification.
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Only a handful of kindreds have been published since the gene was
    identified in 2006. No incidence or prevalence estimate exists, and none
    is computable from a cohort of this size.
  evidence:
  - reference: PMID:29155098
    reference_title: "ORAI1 mutations abolishing store-operated Ca(2+) entry cause anhidrotic ectodermal dysplasia with immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 3 novel autosomal recessive mutations in ORAI1 in unrelated kindreds"
    explanation: >-
      Illustrates the scale of the reported literature: novel kindreds are
      still being reported one to three at a time more than a decade after
      gene discovery.
pathophysiology:
- name: Biallelic Loss-of-Function ORAI1 Variants
  biological_scale: MOLECULAR
  description: >
    Homozygous or compound heterozygous ORAI1 variants. Reported alleles
    include the founding p.R91W missense change, frameshift/nonsense alleles
    (p.A88SfsX25, p.V181SfsX8), and missense alleles p.A103E, p.L194P and
    p.G98R. Frameshift and several missense alleles abolish ORAI1 protein
    expression outright; p.R91W leaves protein expressed but non-conducting,
    so both null and functionally-null genotypes converge on the same cellular
    phenotype.
  genes:
  - preferred_term: ORAI1
    term:
      id: hgnc:25896
      label: ORAI1
    modifier: LOSS_OF_FUNCTION
  genetic_context:
    description: >-
      Germline biallelic ORAI1 alleles. Both protein-abolishing (frameshift,
      nonsense, several missense) and expression-preserving but
      pore-inactivating (p.R91W) mechanisms are represented.
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:20004786
    reference_title: "ORAI1 deficiency and lack of store-operated Ca2+ entry cause immunodeficiency, myopathy, and ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One patient is homozygous for a frameshift nonsense mutation in ORAI1 (ORAI1-A88SfsX25), and a second patient is compound heterozygous for 2 missense mutations in ORAI1 (ORAI1-A103E/L194P). All 3 mutations abolish ORAI1 expression and impair Ca2+ influx and CRAC channel function."
    explanation: >
      Documents the allelic spectrum and that the variants abolish ORAI1
      expression, establishing loss of function as the disease mechanism.
  - reference: PMID:29155098
    reference_title: "ORAI1 mutations abolishing store-operated Ca(2+) entry cause anhidrotic ectodermal dysplasia with immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients were homozygous for p.V181SfsX8, p.L194P, and p.G98R mutations in the ORAI1 gene that suppressed ORAI1 protein expression and SOCE in the patients' lymphocytes and fibroblasts."
    explanation: >
      Extends the allelic spectrum and confirms that the variants suppress
      ORAI1 protein and store-operated calcium entry in patient cells.
  downstream:
  - target: Loss of CRAC Channel Pore Function
    description: >-
      Absent or non-conducting ORAI1 protein cannot form a functional CRAC
      channel pore in the plasma membrane.
    causal_link_type: DIRECT

- name: Loss of CRAC Channel Pore Function
  biological_scale: MOLECULAR
  description: >
    ORAI1 is the pore-forming subunit of the CRAC channel. Without functional
    ORAI1, STIM1 has no pore to gate on store depletion, and the CRAC current
    (I_CRAC) is absent. That ORAI1 is the pore rather than a regulator is
    established by the rescue experiment: expressing wild-type Orai1 in
    patient SCID T cells restores both store-operated calcium influx and
    I_CRAC.
  molecular_functions:
  - preferred_term: store-operated calcium channel activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0015279
      label: store-operated calcium channel activity
  evidence:
  - reference: PMID:16582901
    reference_title: "A mutation in Orai1 causes immune deficiency by abrogating CRAC channel function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "expression of wild-type Orai1 in SCID T cells restores store-operated Ca2+ influx and the CRAC current (I(CRAC))"
    explanation: >
      The rescue result establishes that loss of ORAI1 is what removes CRAC
      channel function, rather than a correlated defect.
  downstream:
  - target: Abolished Store-Operated Calcium Entry
    description: >-
      With no conducting CRAC pore, store depletion no longer produces
      sustained calcium influx.
    causal_link_type: DIRECT

- name: Abolished Store-Operated Calcium Entry
  biological_scale: CELLULAR
  description: >
    Store-operated calcium entry is the dominant sustained calcium influx
    pathway in lymphocytes. Its loss is demonstrable in patient T cells,
    fibroblasts and other cell types, and is the single cellular lesion from
    which every downstream arm of the disease follows. Because ORAI1 is
    expressed almost ubiquitously, the lesion is present in far more tissues
    than are clinically affected — the restriction of the phenotype reflects
    where SOCE is non-redundant, not where ORAI1 is expressed.
  biological_processes:
  - preferred_term: store-operated calcium entry
    modifier: DECREASED
    term:
      id: GO:0002115
      label: store-operated calcium entry
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:20004786
    reference_title: "ORAI1 deficiency and lack of store-operated Ca2+ entry cause immunodeficiency, myopathy, and ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast with the limited clinical phenotype, we found ORAI1 protein expression in a wide variety of cell types and organs."
    explanation: >
      Establishes the expression/phenotype mismatch that makes SOCE
      non-redundancy, rather than expression pattern, the explanation for
      which organs are affected.
  downstream:
  - target: Failure of Calcineurin-NFAT Dependent Transcription
    description: >-
      Sustained cytosolic calcium is required to activate calcineurin;
      without it NFAT remains phosphorylated and cytoplasmic.
    causal_link_type: DIRECT
  - target: Impaired Skeletal Muscle Calcium Handling
    description: >-
      Loss of SOCE in skeletal muscle fibres, where it contributes to
      refilling of sarcoplasmic reticulum calcium stores.
    causal_link_type: DIRECT
  - target: Defective Enamel Mineralization
    description: >-
      Ameloblasts depend on CRAC-mediated calcium influx to supply the
      calcium used for enamel mineralization.
    causal_link_type: DIRECT
  - target: Hemophagocytic Lymphohistiocytosis
    description: >-
      HLH has been reported as a presenting manifestation. The route is
      deliberately left unspecified: HLH is normally understood as a
      T-cell-driven syndrome, and these patients have a severe defect in
      lymphocyte activation, so the reporting authors proposed a pathway
      independent of T- and NK-cell activation rather than a mechanism through
      the nodes above.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - A T- and NK-cell-activation-independent route to HLH was proposed but not identified
  - target: Sweat Gland Secretory Failure
    description: >-
      Loss of SOCE in sweat gland secretory cells, whose fluid secretion is
      calcium-dependent.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Calcium-dependent secretory signalling in eccrine sweat gland secretory cells

- name: Failure of Calcineurin-NFAT Dependent Transcription
  biological_scale: CELLULAR
  description: >
    NFAT is heavily phosphorylated and cytoplasmic in resting lymphocytes and
    enters the nucleus only when dephosphorylated by the calcium/calmodulin
    dependent phosphatase calcineurin. Without sustained calcium entry
    calcineurin is not activated, NFAT does not translocate, and the large
    NFAT-dependent transcriptional programme — cytokines, chemokines and many
    other genes required for a productive immune response — is not induced.
  biological_processes:
  - preferred_term: calcineurin-NFAT signaling cascade
    modifier: DECREASED
    term:
      id: GO:0033173
      label: calcineurin-NFAT signaling cascade
  evidence:
  - reference: PMID:17572487
    reference_title: "Signalling to transcription: store-operated Ca2+ entry and NFAT activation in lymphocytes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the underlying defect in a family with a hereditary severe combined immune deficiency (SCID) syndrome is a defect in CRAC channel function, store-operated Ca(2+) entry, NFAT activation and transcription of cytokines, chemokines and many other NFAT target genes whose transcription is essential for productive immune defence"
    explanation: >
      States the full causal chain from CRAC channel failure through NFAT to
      the transcriptional defect, in the patients themselves.
  downstream:
  - target: Impaired T Cell Effector Function
    description: >-
      Cytokine genes are NFAT targets; their transcription fails.
    causal_link_type: DIRECT
  - target: Reduced Invariant NKT and Regulatory T Cell Numbers
    description: >-
      Development of iNKT and regulatory T cell lineages is
      calcium/NFAT-dependent, unlike conventional T cell development.
    causal_link_type: DIRECT

- name: Impaired T Cell Effector Function
  biological_scale: CELLULAR
  description: >
    The defining immunological abnormality. T cells are present in normal
    numbers and develop normally, but fail to produce cytokines and fail to
    proliferate on stimulation. This is a functional, not a developmental,
    combined immunodeficiency — the point at which ORAI1 deficiency separates
    from the classical T-negative severe combined immunodeficiencies.
  biological_processes:
  - preferred_term: cytokine production by T cells
    modifier: DECREASED
    term:
      id: GO:0001816
      label: cytokine production
  - preferred_term: T cell proliferation
    modifier: DECREASED
    term:
      id: GO:0042098
      label: T cell proliferation
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  evidence:
  - reference: PMID:20004786
    reference_title: "ORAI1 deficiency and lack of store-operated Ca2+ entry cause immunodeficiency, myopathy, and ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical syndrome associated with ORAI1 deficiency is characterized by immunodeficiency with a defect in the function but not in the development of lymphocytes"
    explanation: >
      States the function-versus-development distinction that defines this
      node and distinguishes the disease from developmental SCIDs.
  downstream:
  - target: Susceptibility to Severe Infection
    description: >-
      Loss of T cell effector output leaves the patient unable to control
      viral, bacterial and fungal pathogens.
    causal_link_type: DIRECT

- name: Reduced Invariant NKT and Regulatory T Cell Numbers
  biological_scale: CELLULAR
  description: >
    Beyond the functional defect in conventional T cells, ORAI1-deficient
    patients have strongly reduced numbers of invariant natural killer T cells
    and regulatory T cells, and altered composition of gamma-delta T cell and
    NK cell subsets. Loss of the regulatory compartment is the most plausible
    route from a calcium-signalling defect to the autoimmunity these patients
    develop, which is otherwise a counterintuitive feature of an
    immunodeficiency.
  cell_types:
  - preferred_term: regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
    modifier: DECREASED
  biological_processes:
  - preferred_term: regulatory T cell differentiation
    modifier: DECREASED
    term:
      id: GO:0045066
      label: regulatory T cell differentiation
  evidence:
  - reference: PMID:29155098
    reference_title: "ORAI1 mutations abolishing store-operated Ca(2+) entry cause anhidrotic ectodermal dysplasia with immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to impaired T-cell cytokine production, ORAI1 mutations were associated with strongly reduced numbers of invariant natural killer T and regulatory T (Treg) cells and altered composition of γδ T-cell and natural killer cell subsets."
    explanation: >
      Directly documents the reduced iNKT and Treg compartments in patients.
  downstream:
  - target: Autoimmunity
    description: >-
      Depletion of the regulatory T cell compartment removes peripheral
      tolerance restraint.
    causal_link_type: DIRECT

- name: Susceptibility to Severe Infection
  biological_scale: ORGANISM
  description: >
    Recurrent and life-threatening infection presenting in infancy, the
    clinical presentation that brings these patients to attention. Untreated,
    the immunodeficiency is fatal in early childhood.
  evidence:

    causal_link_type: DIRECT
mechanistic_hypotheses:
- hypothesis_group_id: canonical_soce_nfat_failure_model
  hypothesis_label: Canonical SOCE / calcineurin-NFAT Transcriptional Failure Model
  status: CANONICAL
  description: >-
    Biallelic ORAI1 loss removes the CRAC channel pore, abolishing
    store-operated calcium entry; the resulting failure to activate
    calcineurin leaves NFAT cytoplasmic and the NFAT-dependent cytokine
    programme uninduced, which produces a functional rather than
    developmental combined immunodeficiency. The same cellular lesion in
    skeletal muscle, ameloblasts and sweat gland explains the non-immune
    arms. This model is supported by the rescue of both SOCE and I_CRAC by
    wild-type ORAI1 in patient T cells.
discussions:
- discussion_id: orai1_expression_phenotype_mismatch
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is the clinical phenotype restricted to lymphocytes, skeletal muscle,
    ameloblasts and sweat glands when ORAI1 protein is expressed in a wide
    variety of cell types and organs?
  attaches_to:
  - pathophysiology#Abolished Store-Operated Calcium Entry
  rationale: >-
    Immunohistochemistry in healthy donors shows broad ORAI1 expression, yet
    the clinical syndrome spares nearly all of those tissues. Either other
    ORAI paralogues or non-CRAC calcium entry routes compensate outside the
    affected tissues, or SOCE is simply not rate-limiting there. Which of
    those it is has not been established, and it matters: it determines
    whether a systemic CRAC-modulating therapy would have off-target
    consequences in tissues that look unaffected at baseline.
- discussion_id: orai1_hsct_non_haematopoietic_arms
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does haematopoietic stem cell transplantation, which replaces the
    lymphoid compartment, leave the myopathy and ectodermal dysplasia
    untouched over long-term follow-up?
  attaches_to:
  - pathophysiology#Impaired Skeletal Muscle Calcium Handling
  - pathophysiology#Defective Enamel Mineralization
  rationale: >-
    The myopathic, enamel and sweat gland arms are cell-intrinsic to
    non-haematopoietic tissue, so transplantation should not correct them.
    The published cohort is too small and follow-up too short for that
    expectation to have been confirmed, and it is the fact that determines
    whether transplantation is a cure or only a rescue of the immunological
    arm.
- discussion_id: orai1_autoimmunity_treg_vs_intrinsic
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the autoimmunity in ORAI1 deficiency driven by regulatory T cell loss,
    or by an independent consequence of impaired calcium signalling in B
    cells and myeloid cells?
  attaches_to:
  - pathophysiology#Autoimmunity
  rationale: >-
    Reduced Treg numbers is the proposed explanation and is the authors' own
    interpretation, stated as "likely" rather than demonstrated. No
    experiment has separated the Treg-loss route from a cell-intrinsic
    tolerance defect elsewhere, and the two would call for different
    immunomodulatory strategies after transplantation.
phenotypes:
- name: Combined Immunodeficiency
  category: Immunological
  description: >
    Recurrent, severe and often life-threatening infection beginning in
    infancy, with normal lymphocyte numbers but impaired lymphocyte function.
  phenotype_term:
    preferred_term: Combined immunodeficiency
    term:
      id: HP:0005387
      label: Combined immunodeficiency
  evidence:
  - reference: PMID:29155098
    reference_title: "ORAI1 mutations abolishing store-operated Ca(2+) entry cause anhidrotic ectodermal dysplasia with immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the ORAI1 and STIM1 genes that abolish SOCE cause a combined immunodeficiency (CID) syndrome that is accompanied by autoimmunity and nonimmunologic symptoms."
    explanation: >
      Names combined immunodeficiency as the immunological phenotype.
- name: Anhidrosis
  category: Dermatological
  description: >
    Absent or markedly reduced sweating, the ectodermal dysplasia component
    of the syndrome. Carries a real risk of hyperthermia.
  phenotype_term:
    preferred_term: Anhidrosis
    term:
      id: HP:0000970
      label: Anhidrosis
  evidence:
  - reference: PMID:29155098
    reference_title: "ORAI1 mutations abolishing store-operated Ca(2+) entry cause anhidrotic ectodermal dysplasia with immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ORAI1-deficient patients have dental enamel defects and anhidrosis, representing a new form of anhidrotic ectodermal dysplasia with immunodeficiency"
    explanation: >
      States anhidrosis directly as a feature of ORAI1-deficient patients.
- name: Amelogenesis Imperfecta
  category: Dental
  description: >
    Defective enamel mineralization affecting deciduous and permanent
    dentition, with discoloration, hypoplasia, increased wear and chipping.
  phenotype_term:
    preferred_term: Amelogenesis imperfecta
    term:
      id: HP:0000705
      label: Amelogenesis imperfecta
  evidence:
  - reference: PMID:30114531
    reference_title: "CRAC channels in dental enamel cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the dental phenotypes observed in the patients, discoloration, increased wear, hypoplasias (thinning of enamel) and chipping has been reported."
    explanation: >
      Enumerates the enamel abnormalities seen in CRAC channelopathy
      patients.
- name: Congenital Muscular Hypotonia
  category: Neuromuscular
  description: >
    Non-progressive muscular hypotonia present from birth, distinct from
    dystrophic or inflammatory myopathy.
  phenotype_term:
    preferred_term: Generalized hypotonia
    term:
      id: HP:0001290
      label: Generalized hypotonia
    clinical_course: STABLE
  evidence:
  - reference: PMID:20111871
    reference_title: "CRAC channelopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "immunodeficiency, congenital myopathy, and anhydrotic ectodermal dysplasia"
    explanation: >
      Names congenital myopathy as one of the three defining clinical
      components of CRAC channelopathy.
- name: Autoimmune Hemolytic Anemia
  category: Hematological
  description: >
    Autoimmune destruction of erythrocytes, one of the autoimmune cytopenias
    reported in CRAC channelopathy.
  phenotype_term:
    preferred_term: Autoimmune hemolytic anemia
    term:
      id: HP:0001890
      label: Autoimmune hemolytic anemia
  evidence:
  - reference: PMID:29155098
    reference_title: "ORAI1 mutations abolishing store-operated Ca(2+) entry cause anhidrotic ectodermal dysplasia with immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "unrelated kindreds with CID, autoimmunity, ectodermal dysplasia with anhidrosis, and muscular dysplasia"
    explanation: >
      Establishes autoimmunity as part of the reported clinical picture. The
      specific cytopenia type is not named in the abstract, so this item
      supports the autoimmune component rather than the haemolytic
      specificity.
- name: Hemophagocytic Lymphohistiocytosis
  category: Hematological
  description: >
    HLH has been reported as the presenting manifestation of ORAI1 deficiency.
    It is mechanistically surprising and worth recording as such: HLH is
    normally understood as a T-cell-driven hyperinflammatory syndrome, and
    these patients have a severe defect in lymphocyte activation. The case
    was put forward by its authors as evidence for a pathway to HLH that does
    not depend on T- and NK-cell activation.
  phenotype_term:
    preferred_term: Hemophagocytosis
    term:
      id: HP:0012156
      label: Hemophagocytosis
  evidence:
  - reference: PMID:28633876
    reference_title: "Hemophagocytic lymphohistiocytosis as presenting manifestation of profound combined immunodeficiency due to an ORAI1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report the first case of HLH in a patient with a severe defect in lymphocyte activation due to a novel mutation in ORAI1, providing further evidence for an additional pathway of pathogenesis of the HLH syndrome, independent of T- and NK-cell activation."
    explanation: >
      Documents HLH as a presenting manifestation of ORAI1 deficiency and the
      authors' interpretation of why it is mechanistically unexpected.
genetic:
- name: ORAI1
  gene_term:
    preferred_term: ORAI1
    term:
      id: hgnc:25896
      label: ORAI1
  relationship_type: CAUSATIVE
  notes: >
    ORAI1 encodes the pore-forming subunit of the plasma membrane CRAC
    channel. Biallelic loss-of-function variants cause this disease; the gene
    was identified by combining SNP linkage analysis in the founding SCID
    kindred with a Drosophila RNAi screen for regulators of store-operated
    calcium entry and NFAT nuclear import.
  evidence:
  - reference: PMID:16582901
    reference_title: "A mutation in Orai1 causes immune deficiency by abrogating CRAC channel function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both approaches converged on a novel protein that we call Orai1, which contains four putative transmembrane segments."
    explanation: >
      The gene-discovery result establishing ORAI1 as the disease gene.
  - reference: PMID:26469693
    reference_title: "Diseases caused by mutations in ORAI1 and STIM1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By contrast, autosomal dominant gain-of-function mutations in ORAI1 and STIM1 result in constitutive CRAC channel activation"
    explanation: >
      Establishes that gain-of-function ORAI1 variants cause a distinct,
      dominantly inherited disease spectrum, which is why this entry is
      scoped to loss of function only.
animal_models:
- name: Orai1 knockout mouse
  species: Mouse
  genotype: Orai1-/-
  publication: PMID:26969191
  description: >
    Constitutive Orai1 null mouse. Used here for the store-operated calcium
    entry lesion itself; note that the reported reproductive phenotype has no
    human counterpart, because ORAI1-null patients rarely survive to
    reproductive age.
  modeled_mechanisms:
  - target: Abolished Store-Operated Calcium Entry
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mouse reproduces the underlying loss of ORAI1-dependent
      store-operated calcium entry, which is the shared upstream lesion.
    limitations: >-
      The phenotype emphasised in this model is male infertility with
      defective spermatogenesis, which is not a described feature of the
      human disease — human ORAI1-null patients rarely reach reproductive
      age, so the human counterpart is unobservable rather than absent. The
      model therefore speaks to the cellular lesion, not to the human
      clinical syndrome.
    evidence:
    - reference: PMID:26969191
      reference_title: "Male infertility in mice lacking the store-operated Ca(2+) channel Orai1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We reveal that Orai1(-/-) male mice are sterile and have severe defects in spermatogenesis, with prominent deficiencies in mid- to late-stage elongating spermatid development."
      explanation: >-
        Documents the murine phenotype, which is the basis for treating this
        model as only partially recapitulating the human disease.
    - reference: PMID:26969191
      reference_title: "Male infertility in mice lacking the store-operated Ca(2+) channel Orai1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "men with loss-of-function or null mutations in ORAI1 rarely survive to reproductive age"
      explanation: >-
        Explains why the murine reproductive phenotype cannot be checked
        against human patients, which is the translational caveat recorded
        in limitations.
diagnosis:
- name: Store-operated calcium entry measurement
  description: >
    Functional demonstration of absent store-operated calcium entry in
    patient lymphocytes or fibroblasts, typically by calcium imaging after
    store depletion. This is the assay that defines the CRAC channelopathies
    as a group and was how the founding kindred was characterised before the
    gene was known.
  evidence:
  - reference: PMID:29155098
    reference_title: "ORAI1 mutations abolishing store-operated Ca(2+) entry cause anhidrotic ectodermal dysplasia with immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "analysis of ORAI1 mRNA and protein expression, SOCE measurements, immunologic analysis of peripheral blood lymphocyte populations by using flow cytometry"
    explanation: >
      Lists SOCE measurement alongside expression and flow analysis as the
      diagnostic workup applied to these patients.
- name: ORAI1 sequencing
  description: >
    Molecular confirmation by sequencing ORAI1. In a patient with combined
    immunodeficiency plus anhidrosis and enamel defects, ORAI1 and STIM1 are
    the two genes to sequence together, since they produce a nearly
    superimposable syndrome.
  evidence:
  - reference: PMID:20004786
    reference_title: "ORAI1 deficiency and lack of store-operated Ca2+ entry cause immunodeficiency, myopathy, and ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA sequence analysis for mutations in the genes ORAI1, ORAI2, ORAI3, and stromal interaction molecule (STIM) 1 and 2"
    explanation: >
      Describes the sequencing panel used to establish the diagnosis in these
      patients.
treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >
    Replacing the haematopoietic compartment restores ORAI1-competent
    lymphocytes and is the only intervention that addresses the
    immunodeficiency itself. It is not expected to correct the myopathy,
    enamel or sweat gland arms, which are intrinsic to non-haematopoietic
    tissue — a limitation recorded as a knowledge gap rather than asserted,
    since the published follow-up is too small to have confirmed it.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Impaired T Cell Effector Function
    treatment_effect: RESTORES
    description: >-
      Donor-derived lymphocytes carry functional ORAI1 and can mount
      calcium-dependent effector responses.
- name: Antimicrobial Prophylaxis and Supportive Care
  description: >
    Prophylaxis against opportunistic infection and prompt treatment of
    intercurrent infection, as for other combined immunodeficiencies, pending
    or in the absence of transplantation. Avoidance of heat stress is a
    specific requirement in these patients because they cannot sweat.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Susceptibility to Severe Infection
    treatment_effect: MODULATES
    description: >-
      Reduces infectious burden without addressing the underlying signalling
      defect.
- name: Dental Restoration
  description: >
    Extensive restorative dental treatment is often required to give these
    patients a functional dentition, given the severity of the enamel defect.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: dental restorative treatment
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Defective Enamel Mineralization
    treatment_effect: MODULATES
    description: >-
      Restores dental function without addressing the mineralization defect
      itself.
  evidence:
  - reference: PMID:30114531
    reference_title: "CRAC channels in dental enamel cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "often require extensive dental treatment to provide the patient with a functional dentition"
    explanation: >
      States the need for extensive restorative dental treatment in these
      patients.
- name: Immunoglobulin Replacement
  description: >
    Immunoglobulin replacement for antibody insufficiency, as in other
    combined immunodeficiencies. Recorded as standard combined-immunodeficiency
    management rather than as an ORAI1-specific intervention: no study has
    reported its use or effect in ORAI1-deficient patients specifically, and
    this entry does not imply one has.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Susceptibility to Severe Infection
    treatment_effect: MODULATES
    description: >-
      Passive antibody cover. It does not restore store-operated calcium
      entry or the cellular arm of the defect.

- name: Low Weight and Malnutrition
  description: >-
    The low-energy state is the established proximal driver of many endocrine,
    cardiovascular, gastrointestinal, skeletal, and brain-state consequences.
    It should not be mistaken for evidence that those downstream changes caused
    the initial psychiatric syndrome.
  mechanism_confidence: ESTABLISHED
  biological_scale: ORGANISM
  downstream:
  - target: Low Body Weight and Weight Loss
    causal_link_type: DIRECT
    description: >-
      The malnourished low-energy state is expressed clinically as decreased
      body weight, often following substantial or rapid weight loss.
    evidence:
    - reference: PMID:34418241
      reference_title: "Determinants of severe bradycardia in adolescents hospitalized for anorexia nervosa."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients in this group had a higher maximum lifetime weight (P =
        0.0045), greater premorbid weight loss (P = 0.0011), and more rapid
        weight loss (P = 0.0001).
      explanation: >-
        Hospitalized adolescent data document the substantial and rapid weight
        loss that produces the low-weight clinical state.
  - target: Hypoleptinemia
    causal_link_type: DIRECT
    description: >-
      Loss of adipose tissue and reduced energy intake lower the
      adipocyte-derived hormone leptin, producing the hypoleptinemia that
      signals the starved state.
    evidence:
    - reference: PMID:31156489
      reference_title: "Clinical Trials Required to Assess Potential Benefits and Side Effects of Treatment of Patients With Anorexia Nervosa With Recombinant Human Leptin."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Patients with AN present hypoleptinemia in accordance with both their
        reduced energy intake and fat mass
      explanation: >-
        The review states that hypoleptinemia in AN tracks reduced energy intake
        and fat mass, supporting the low-weight state as the direct cause of
        hypoleptinemia.
  - target: Starvation-Adaptation Endocrine Response
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Hypothalamic-pituitary axis adaptation to chronic energy deficit
    description: >-
      Chronic starvation elicits adaptive and maladaptive changes across
      gonadal, growth-hormone, adrenal, thyroid, and appetite-hormone axes.
    evidence:
    - reference: PMID:27811940
      reference_title: "The endocrine manifestations of anorexia nervosa: mechanisms and management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Although most, but not all, of these endocrine disturbances are
        adaptive to the low energy state of chronic starvation and reverse with
        treatment of the eating disorder, many contribute to impaired skeletal
        integrity, as well as neuropsychiatric comorbidities, in individuals
        with anorexia nervosa.
      explanation: >-
        The review explicitly identifies chronic low energy as the driver of
        most endocrine disturbances.
  - target: Cardiovascular Adaptation and Instability
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Autonomic adaptation, reduced cardiac mass, and electrolyte disturbance
    description: >-
      Recent and rapid weight loss contributes to bradycardia and broader
      cardiovascular instability.
    evidence:
    - reference: PMID:34418241
      reference_title: "Determinants of severe bradycardia in adolescents hospitalized for anorexia nervosa."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This study confirms that recent weight loss is probably the most
        important determinant of severe bradycardia in adolescents with AN.
      explanation: >-
        Hospitalized adolescent data directly associate recent weight loss with
        severe bradycardia.
  - target: Gastrointestinal Dysmotility
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Malnutrition-associated autonomic and motility changes
    description: >-
      Disordered eating and malnutrition produce delayed gastric emptying and
      constipation that can complicate refeeding.
    evidence:
    - reference: PMID:16962383
      reference_title: "Gastrointestinal disturbances in eating disorders: clinical and neurobiological aspects."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Gastrointestinal disturbances develop secondary to the disordered
        eating behaviour and the concomitant malnutrition and subside mostly
        with the resumption of normal food intake and body weight.
      explanation: >-
        The review explicitly identifies malnutrition as upstream of the GI
        disturbances.
  - target: Undernutrition-Associated Brain Structural Changes
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

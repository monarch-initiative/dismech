biochemical:
- name: Hypoleptinemia
  biomarker_term:
    preferred_term: Leptin
    term:
      id: NCIT:C46081
      label: Leptin
  notes: >-
    Markedly low circulating leptin is an endocrinological hallmark of the acute
    underweight state of AN, resulting from the loss of adipose (leptin-secreting)
    tissue during energy restriction. Leptin partially normalizes with weight
    restoration. Hypoleptinemia is not diagnostic of AN in isolation (it reflects
    low fat mass from any cause) but is the biomarker that indexes the
    starvation-adaptation state and the target of metreleptin substitution.
  specificity: >-
    Low for AN as a stand-alone diagnostic marker (reflects low fat mass
    generally); high as an index of the acute starvation-adaptation state.
  presence: DECREASED
  cell_types:
  - preferred_term: Adipocyte (leptin-secreting)
    term:
      id: CL:0000136
      label: adipocyte
  readouts:
  - target: Hypoleptinemia
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: MONITORING
    interpretation: >-
      Low serum leptin is a direct readout of the Hypoleptinemia mechanism node
      and indexes the severity of the starvation-adaptation state; it partially
      normalizes with weight restoration and is the pharmacodynamic target of
      metreleptin substitution.
  evidence:
  - reference: PMID:31156489
    reference_title: "Clinical Trials Required to Assess Potential Benefits and Side Effects of Treatment of Patients With Anorexia Nervosa With Recombinant Human Leptin."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hypoleptinemia acts as a key trigger for the adaptation to starvation by
      affecting diverse brain regions including the reward system
    explanation: >-
      The review identifies hypoleptinemia as the central endocrine feature and
      trigger of starvation adaptation in AN.
  - reference: PMID:38303556
    reference_title: "Does hypoleptinemia trigger entrapment in anorexia nervosa? Etiological and clinical considerations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hypoleptinemia as a core endocrine feature of AN serves as a central and
      peripheral trigger of tissue-specific adaptations to starvation.
    explanation: >-
      Narrative review (no primary human data) confirms hypoleptinemia as a
      core, characteristic endocrine feature of anorexia nervosa.
- name: Elevated Soluble Leptin Receptor
  biomarker_term:
    preferred_term: Leptin Receptor
    term:
      id: NCIT:C26349
      label: Leptin Receptor
  notes: >-
    Soluble leptin receptor (sOB-R, the shed/cleaved extracellular domain of the
    leptin receptor) circulates at elevated levels in acute anorexia nervosa.
    sOB-R acts as a circulating leptin antagonist by sequestering leptin and
    reducing its bioavailability; together with hypoleptinemia (low total leptin),
    sOB-R elevation reflects a dual-arm dysfunction in the leptin signaling system
    during starvation adaptation. The elevation of sOB-R complements the findings
    of low total leptin and indexes the severity of leptin resistance in the
    starvation state.
  specificity: >-
    Low as a stand-alone diagnostic marker (elevated sOB-R can occur in other
    states of metabolic stress and altered leptin signaling); high as part of the
    dual biomarker pattern (hypoleptinemia + sOB-R elevation) characterizing the
    acute AN starvation state.
  presence: INCREASED
  evidence:
  - reference: DOI:10.3390/nu16132095
    reference_title: "Peripheral Biomarkers of Anorexia Nervosa: A Meta-Analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      soluble leptin receptor levels were significantly higher in cases of AN
      compared with those in non-AN controls
    explanation: >-
      Wu et al. 2024 meta-analysis of 52 peripheral biomarkers identifies sOB-R
      elevation as a robust finding across multiple AN cohorts.
diagnosis:
- name: Clinical eating-disorder assessment
  presence: >-
    Diagnosis is clinical: persistent energy restriction and significantly low
    body weight are evaluated together with fear of weight gain or persistent
    weight-gain-interfering behavior and disturbance in body-weight or shape
    experience. Motivation and developmental context matter, and no peripheral
    biomarker establishes the diagnosis.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: DOI:10.1038/s41398-023-02585-1

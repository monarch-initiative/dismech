name: Anorexia Nervosa
creation_date: "2026-04-24T20:56:38Z"
category: Psychiatric
description: >-
  Anorexia nervosa is a serious eating disorder defined by persistent energy
  restriction leading to significantly low body weight, together with intense
  fear of weight gain or persistent behavior that interferes with weight gain
  and disturbance in body-weight or shape experience. This parent entry covers
  both restricting and binge-eating/purging presentations. It distinguishes
  the established physiological consequences of undernutrition from proposed
  upstream neural, metabolic, immune, and microbiome mechanisms.
disease_term:
  preferred_term: anorexia nervosa
  term:
    id: MONDO:0005351
    label: anorexia nervosa
parents:

    - reference: DOI:10.1001/jamanetworkopen.2024.51094
      reference_title: Incidence and Risk of Cardiovascular Outcomes in Patients With Anorexia Nervosa
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Compared with the control group, the AN group had significantly higher
        risks of MACE (adjusted HR [AHR], 3.78; 95% CI, 2.83-5.05) and any
        cardiovascular condition (AHR, 1.93; 95% CI, 1.54-2.41).
      explanation: >-
        The matched cohort quantifies cardiovascular association; it does not
        establish a single causal pathway for every outcome.
notes: >-
  Evidence is deliberately partitioned by inferential strength. The
  restriction-to-starvation cascade and its endocrine, cardiovascular,
  gastrointestinal, and skeletal consequences are treated as established.
  Polygenic liability is established at the population level, but its route to
  restrictive psychopathology has unknown intermediates. Brain imaging is
  interpreted with explicit state-versus-trait caution, and immune/microbiome
  findings are retained as emerging correlates without causal downstream
  edges. Treatment content summarizes evidence and context rather than
  functioning as an individual clinical-care guideline.

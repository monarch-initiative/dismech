      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our results indicate that some shared characteristics between AN and
        related disorders and traits may have genetic underpinnings.
      explanation: >-
        Genetic underpinnings support upstream susceptibility, while the
        authors do not establish a direct path to restrictive behavior.
  evidence:
  - reference: PMID:31308545
    reference_title: Genome-wide association study identifies eight risk loci and implicates metabo-psychiatric origins for anorexia nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results further encourage a reconceptualization of anorexia nervosa
      as a metabo-psychiatric disorder.
    explanation: >-
      The landmark GWAS supports the metabo-psychiatric susceptibility framing.

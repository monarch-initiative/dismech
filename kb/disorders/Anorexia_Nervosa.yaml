    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anorexia nervosa (AN) is an eating disorder characterized by restricted
      energy intake, abnormally low body weight, intense fear of weight-gain,
      and body image disturbances [ 1].
    explanation: >-
      The source succinctly states the core clinical phenotype used for
      diagnostic assessment.
- name: Nutritional, electrolyte, and endocrine assessment
  presence: >-
    Weight trajectory, intake, hydration, electrolytes, renal and hepatic
    function, blood counts, and endocrine complications are assessed according
    to illness severity and behavior context. Normal absolute weight does not
    exclude risk from rapid recent loss.
  diagnosis_term:
    preferred_term: nutrition assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:40048192
    reference_title: "Eating Disorders: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These disorders may be associated with changes in weight, electrolyte
      abnormalities (eg, hyponatremia, hypokalemia), bradycardia,
      disturbances in reproductive hormones (eg, decreased estradiol levels
      in females), and decreased bone density.
    explanation: >-
      The review identifies the medical domains requiring assessment.
- name: Cardiovascular assessment and electrocardiography
  presence: >-
    Pulse, blood pressure, symptoms, and electrocardiography are evaluated when
    bradycardia, conduction disturbance, electrolyte abnormality, syncope, or
    other medical instability is suspected.
  diagnosis_term:
    preferred_term: electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  evidence:
  - reference: DOI:10.1001/jamanetworkopen.2024.51094
    reference_title: Incidence and Risk of Cardiovascular Outcomes in Patients With Anorexia Nervosa
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinicians should monitor comorbid cardiovascular conditions among
      patients with AN at initial presentation, during treatment, and at
      follow-up.
    explanation: >-
      National cohort findings support cardiovascular monitoring across the
      care trajectory.
- name: Peripheral biomarkers are investigational
  presence: >-
    Endocrine, metabolic, and immune markers differ between AN and controls in
    research studies but are not validated as stand-alone diagnostic tests.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: DOI:10.3390/nu16132095
    reference_title: "Peripheral Biomarkers of Anorexia Nervosa: A Meta-Analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, reliable biomarkers for AN have yet to be established.
    explanation: >-
      The meta-analysis explicitly cautions against treating measured
      peripheral differences as established diagnostic biomarkers.
  - reference: PMID:41765047
    reference_title: "World Federation of Societies of Biological Psychiatry (WFSBP) consensus statement on candidate biomarkers for anorexia nervosa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, the current scientific basis for most biological markers are
      group comparisons only. Studies on sensitivity, specificity and the
      prognostic value of these markers are lacking.
    explanation: >-
      The WFSBP consensus statement catalogues candidate AN biomarkers across
      clinical, molecular (genetic, epigenetic, hormonal, immunological,
      metabolomic), cellular, neuroimaging, cardiac, and neurophysiological
      domains but concludes that most rest on group comparisons and lack
      validated sensitivity, specificity, and prognostic value — authoritative
      support that peripheral biomarkers remain investigational rather than
      diagnostic.

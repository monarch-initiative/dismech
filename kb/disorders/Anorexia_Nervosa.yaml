  evidence:
  - reference: PMID:27811940
    reference_title: "The endocrine manifestations of anorexia nervosa: mechanisms and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anorexia nervosa is a psychiatric disorder characterized by altered body

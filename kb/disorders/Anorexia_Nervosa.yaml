- name: Excessive Physical Activity
  category: Behavioral
  description: >-
    Physical hyperactivity, motor restlessness, and a driven urge to exercise
    are common in acute AN and correlate inversely with serum leptin; they are
    modeled here as a leptin-linked behavioral manifestation (see the
    leptin_hyperactivity mechanistic hypothesis). HP:0000752 (Hyperactivity) is
    the closest available HPO term but is anchored to ADHD-type motor/attentional
    hyperactivity; the preferred_term carries the AN-specific compulsive,
    starvation-driven-exercise nuance the ontology class does not yet capture.

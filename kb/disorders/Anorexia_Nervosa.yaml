clinical_burden:
  burden_level: HIGH
  rationale: >-
    AN can cause multi-organ medical instability, prolonged disability,
    hospitalization, relapse, and excess mortality, including suicide-related
    mortality. Burden varies by illness phase, but the potential need for
    intensive multidisciplinary care supports a high disease-level rating.
  evidence:
  - reference: PMID:40048192
    reference_title: "Eating Disorders: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anorexia nervosa is associated with a mortality rate of 5.1 deaths per
      1000 person-years (95% CI, 4.0-6.1), nearly 6 times higher than that of
      individuals of the same age without anorexia nervosa; 25% of deaths among
      individuals with anorexia nervosa are from suicide.
    explanation: >-
      The review quantifies the excess mortality that contributes to AN's high
      clinical burden.
progression:
- phase: Acute underweight illness
  notes: >-
    Acute undernutrition can produce widespread structural brain differences;
    their smaller magnitude after partial weight restoration argues that at
    least part of this imaging phenotype is state dependent.
  evidence:
  - reference: PMID:36031441
    reference_title: "Brain Structure in Acutely Underweight and Partially Weight-Restored Individuals With Anorexia Nervosa: A Coordinated Analysis by the ENIGMA Eating Disorders Working Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Highlighting the effects of undernutrition, these deficits were associated
      with lower body mass index in the AN sample and were less pronounced in
      partially weight-restored patients.
    explanation: >-
      Multicenter imaging data demonstrate illness-state dependence of brain
      structural findings.
- phase: Long-term recovery and relapse
  notes: >-
    Recovery may occur even after many years, but persistent illness, relapse,
    and AN-related death occur in long-term cohorts; one historical treated
    cohort should not be generalized as a contemporary population estimate.
  evidence:
  - reference: PMID:11459385
    reference_title: Long-term outcome of anorexia nervosa in a prospective 21-year follow-up study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recovery is still possible for anorexic patients after a period of 21
      years. On the other hand, patients can relapse, becoming symptomatic again
      despite previously achieving recovery status.
    explanation: >-
      The prospective 21-year cohort directly supports a heterogeneous,
      potentially relapsing long-term course.
inheritance:
- name: Polygenic inheritance
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >-
    AN has substantial heritability and a common-variant architecture; it is not
    modeled as a Mendelian disorder.
  evidence:
  - reference: PMID:31308545
    reference_title: Genome-wide association study identifies eight risk loci and implicates metabo-psychiatric origins for anorexia nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Characterized primarily by a low body-mass index, anorexia nervosa is a
      complex and serious illness1, affecting 0.9-4% of women and 0.3% of men2-4,
      with twin-based heritability estimates of 50-60%5.
    explanation: >-
      The GWAS report summarizes twin heritability and then identifies multiple
      common-variant loci, supporting polygenic rather than Mendelian
      inheritance.
genetic:
- name: Polygenic common-variant susceptibility
  association: Complex polygenic susceptibility; no single sufficient gene is asserted
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    Genome-wide significant loci and genetic correlations establish inherited
    susceptibility at the population level. Individual nearby genes are not
    represented as causative because locus-to-gene assignment and mechanistic
    mediation remain uncertain.
  evidence:
  - reference: PMID:31308545
    reference_title: Genome-wide association study identifies eight risk loci and implicates metabo-psychiatric origins for anorexia nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we combine data from the Anorexia Nervosa Genetics Initiative
      (ANGI)8,9 and the Eating Disorders Working Group of the Psychiatric
      Genomics Consortium (PGC-ED) and conduct a genome-wide association study
      of 16,992 cases of anorexia nervosa and 55,525 controls, identifying eight
      significant loci.
    explanation: >-
      Large GWAS evidence supports common germline susceptibility loci without
      establishing any single-gene cause.
mechanistic_hypotheses:
- hypothesis_group_id: leptin_hyperactivity
  hypothesis_label: Hypoleptinemia-driven starvation-induced hyperactivity
  status: EMERGING
  description: >-
    The hypothesis that low circulating leptin is a causal driver of the
    physical hyperactivity and motor restlessness of AN, not merely a
    correlate. The causal step is demonstrated in the rodent activity-based
    anorexia (ABA) model, where recombinant leptin suppresses
    semi-starvation-induced hyperactivity; human evidence is correlational (an
    inverted U-shaped leptin-activity relationship) and inconsistent, so the
    causal claim is retained as emerging pending controlled human testing.
  evidence:
  - reference: PMID:31156489
    reference_title: "Clinical Trials Required to Assess Potential Benefits and Side Effects of Treatment of Patients With Anorexia Nervosa With Recombinant Human Leptin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the rat model activity-based anorexia (ABA) convincingly demonstrates the
      pivotal role of hypoleptinemia in the development of starvation-induced
      hyperactivity.
    explanation: >-
      The ABA rodent model provides the primary causal evidence linking
      hypoleptinemia to starvation-induced hyperactivity; human confirmation is
      still lacking, which is why this group is EMERGING.
- hypothesis_group_id: metabo_psychiatric_liability
  hypothesis_label: Polygenic metabo-psychiatric liability
  status: CANONICAL
  description: >-
    Common-variant liability spans psychiatric, physical-activity, metabolic,
    lipid, and anthropometric traits. This is a robust genetic architecture,
    but the intermediate molecular and circuit mechanisms leading to
    restrictive eating remain unresolved.
  evidence:
  - reference: PMID:31308545
    reference_title: Genome-wide association study identifies eight risk loci and implicates metabo-psychiatric origins for anorexia nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The genetic architecture of anorexia nervosa mirrors its clinical
      presentation, showing significant genetic correlations with psychiatric
      disorders, physical activity, and metabolic (including glycemic), lipid
      and anthropometric traits, independent of the effects of common variants
      associated with body-mass index.
    explanation: >-
      GWAS genetic correlations support a metabo-psychiatric susceptibility
      model while not identifying a direct causal mediator.
- hypothesis_group_id: neural_state_trait_model
  hypothesis_label: Neural state-and-trait model
  status: EMERGING
  description: >-
    Structural and functional brain alterations may include both trait-like
    vulnerabilities and consequences of acute undernutrition. Imaging
    association alone cannot determine which changes initiate restrictive
    eating, so this model is kept separate from the established starvation
    cascade.
  evidence:
  - reference: PMID:34296492
    reference_title: "Structural and functional brain alterations in anorexia nervosa:A multimodal meta-analysis of neuroimaging studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This multimodal meta-analysis identified reductions of gray matter and
      functional activity in the anterior and median cingulate in patients with
      AN, which contributes to further understanding of the pathophysiology of
      AN.
    explanation: >-
      Multimodal case-control imaging supports reproducible neural correlates.
  - reference: PMID:36031441
    reference_title: "Brain Structure in Acutely Underweight and Partially Weight-Restored Individuals With Anorexia Nervosa: A Coordinated Analysis by the ENIGMA Eating Disorders Working Group."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Highlighting the effects of undernutrition, these deficits were associated
      with lower body mass index in the AN sample and were less pronounced in
      partially weight-restored patients.
    explanation: >-
      Weight-state dependence limits causal interpretation of brain structural
      differences as primary disease drivers.
- hypothesis_group_id: immune_microbiome_correlates
  hypothesis_label: Immune and microbiome correlates
  status: EMERGING
  description: >-
    Cytokine and microbiome differences have been observed during acute illness
    and recovery, but current human studies are associative and do not establish
    whether these changes initiate, maintain, or merely reflect starvation.
  evidence:
  - reference: DOI:10.3390/nu16111596
    reference_title: Cytokine and Microbiome Changes in Adolescents with Anorexia Nervosa at Admission, Discharge, and One-Year Follow-Up
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found associations between cytokines and bodyweight, illness duration,
      depressive symptoms, and the microbiome.
    explanation: >-
      Longitudinal adolescent data support correlated immune and microbiome
      changes, not a demonstrated causal direction.
pathophysiology:
- name: Polygenic Metabo-Psychiatric Susceptibility
  description: >-
    Common germline variation contributes distributed susceptibility across
    psychiatric and metabolic trait domains. The node does not assert a single
    causal gene or a known molecular route to AN.
  mechanism_confidence: ESTABLISHED
  biological_scale: ORGANISM
  downstream:
  - target: Restrictive-Eating Psychopathology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - metabo_psychiatric_liability
    description: >-
      Polygenic liability is placed upstream of the diagnostic psychopathology,
      but the intervening developmental, molecular, and neural mechanisms are
      unresolved.
    evidence:
    - reference: DOI:10.1038/s41398-023-02585-1

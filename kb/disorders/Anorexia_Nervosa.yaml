has_subtypes:
- name: Restricting
  display_name: Restricting presentation
  description: >-
    Presentation without recurrent binge eating or purging during the relevant
    diagnostic interval.
  evidence:
  - reference: PMID:16962383
    reference_title: "Gastrointestinal disturbances in eating disorders: clinical and neurobiological aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Studies focusing on general outcome and medical comorbidity describe a
      worse outcome in the binge eating/purging subtype of anorexia nervosa
      compared to the restricting subtype.
    explanation: >-
      The review explicitly distinguishes the restricting presentation from
      the binge-eating/purging presentation.
- name: Binge-eating/purging
  display_name: Binge-eating/purging presentation
  description: >-
    Presentation with recurrent binge eating or purging during the relevant
    diagnostic interval; purging-related electrolyte complications require
    separate clinical attention.
  evidence:
  - reference: PMID:16962383
    reference_title: "Gastrointestinal disturbances in eating disorders: clinical and neurobiological aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Studies focusing on general outcome and medical comorbidity describe a
      worse outcome in the binge eating/purging subtype of anorexia nervosa
      compared to the restricting subtype.
    explanation: >-
      The review explicitly distinguishes the binge-eating/purging
      presentation from the restricting presentation.

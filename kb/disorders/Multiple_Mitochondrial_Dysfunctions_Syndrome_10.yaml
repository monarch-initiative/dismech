name: Multiple Mitochondrial Dysfunctions Syndrome 10
category: Mendelian
creation_date: "2026-11-19T04:30:00Z"
synonyms:
- MMDS10
- CIAO1 deficiency
description: >
  Multiple mitochondrial dysfunctions syndrome 10 is an autosomal recessive disorder caused
  by biallelic partial loss-of-function variants in CIAO1, the core WD40 component of the
  cytosolic iron-sulfur protein assembly (CIA) targeting complex. Unlike the other numbered
  forms of the syndrome, the primary lesion is outside the mitochondrion: unstable CIAO1
  takes its partners MMS19 and CIAO2B down with it, and iron-sulfur clusters are no longer
  delivered to cytosolic and nuclear enzymes of DNA replication and repair, tRNA
  modification and nucleotide metabolism. Loss of dihydropyrimidine dehydrogenase gives a
  biochemical signature of raised uracil and thymine with a normal DPYD gene. The
  mitochondrial respiratory chain defect seen in muscle is secondary. Clinically the
  reported patients span two presentations: a childhood-to-adolescent onset dystrophic
  myopathy with proximal and axial weakness, raised creatine kinase, respiratory
  insufficiency, learning difficulties and progressive deep brain iron deposition, and a
  much more severe congenital neurodegenerative course with microcephaly, recurrent
  infections and death in infancy or adolescence.
disease_term:
  preferred_term: multiple mitochondrial dysfunctions syndrome 10
  term:
    id: MONDO:0975806
    label: multiple mitochondrial dysfunctions syndrome 10
parents:
- Cytosolic iron-sulfur protein assembly disorder
- Multiple mitochondrial dysfunctions syndrome
notes: >-
  The entry keeps the MONDO and OMIM serial name. The synonym "CIAO1 deficiency" is the
  wording of the van Karnebeek report title (PMID:38411040); no GeneReviews chapter,
  ClinGen record or recurring literature name establishes a "CIAO1-related <phenotype>"
  form, so none was coined.

  Six patients with biallelic CIAO1 variants are published in two reports: four with a
  slowly progressive dystrophic myopathy (PMID:38950322) and two with a lethal congenital
  neurodegenerative course (PMID:38411040). They are curated as one disease with a wide
  spectrum, because both sets carry biallelic hypomorphic CIAO1 variants, both share
  p.Arg65Trp, and both show the same cellular lesion. That lump is the most contestable
  decision in the entry: the two presentations differ in onset by more than a decade and
  in outcome between lifelong ambulation and death in infancy, and nothing published
  links a genotype to which end a patient lands on. Every phenotype row names the report
  it comes from so a future split would be mechanical. With six patients across two
  presentations, no frequency band is assigned to any phenotype.

  PMID:38411040 also describes a patient with MMS19 deficiency, a separate disease of the
  same complex. No MMS19-specific finding is used here, but several of that report's
  results are pooled over all three of its patients, and those are cited where the claim
  is about the shared pathway rather than about CIAO1 specifically.

  No GeneReviews chapter covers this disease or CIAO1. Neither the entry's names nor the
  gene symbol matches a chapter in the Bookshelf GeneReviews index, and a live PubMed
  search of chapter titles and of the gene symbol returns none either, so the phenotype
  baseline is the two primary reports, both read as full text rather than as abstracts.

  Single-patient features are curated where they are mechanistically or diagnostically
  informative (microcephaly, simplified gyration, autism, the hyperkinetic movement
  disorder, the neonatal electroencephalographic abnormality). Other one-patient findings
  in the same paragraphs of PMID:38411040 - short stature and low birth weight, adducted
  thumbs, borderline hypertonia, infantile diarrhea - are not curated, as is the loss of
  ambulation in one myopathic patient, which the progression section records instead.

  Several phenotypes are deliberately left with no incoming causal edge, because neither
  report proposes a mechanism for them and the obvious guesses are clinical reasoning
  rather than published claims: sleep apnea, joint hyperlaxity and ankle tightness would
  each have to be routed through the myopathy, which the papers do not do, and the
  anemia, constipation, overweight, intrauterine growth restriction and infantile failure
  to thrive are reported as findings with no stated mechanism. The muscle mitochondrial
  defect is called secondary by its own authors while the direct cause is explicitly
  unidentified, so that edge and the central nervous system one carry unknown
  intermediates rather than being drawn as direct links; the mitochondrial change is not
  drawn as a cause of the myopathy at all, since neither report claims it and
  PMID:38950322 argues the muscle vulnerability comes from protein turnover instead.

  PMID:38950322 found no cardiac, neuropathic, ophthalmological or hearing involvement in
  its four patients, and no cardiomyopathy on echocardiography. That negative is part of
  what separates this disease from the other numbered forms of the syndrome and from
  neurodegeneration with brain iron accumulation, which the brain imaging otherwise
  resembles.
inheritance:

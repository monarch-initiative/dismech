- name: Loss of Iron-Sulfur Enzymes of DNA Replication and Genome Maintenance
  description: >
    In the PMID:38950322 patients, POLD1, the catalytic subunit of DNA polymerase delta,
    fails to incorporate its cluster, and RTEL1 is reduced. Patient fibroblasts in both
    reports proliferate more slowly than control cells. How this contributes to the
    clinical phenotype is inferred rather than shown.

    The two primary reports disagree here, and this is the entry's main unresolved
    discrepancy. PMID:38411040 found the protein levels of POLD1, XPD and PPAT unchanged
    in its own patients' fibroblasts, with only ETFDH, ABCE1 and CDK5RAP3 altered among
    detected iron-sulfur proteins. The readouts are not the same measurement - PMID:38950322
    reports radiolabelled iron incorporation into POLD1 as well as steady-state levels in
    two patients, PMID:38411040 reports steady-state expression in two different patients -
    so a cluster-loading defect without a measurable fall in protein abundance would
    reconcile them. That reconciliation is offered as a reconciliation, not as a finding:
    neither paper tests it.

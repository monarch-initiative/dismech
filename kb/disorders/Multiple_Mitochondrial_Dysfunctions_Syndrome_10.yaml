  description: >
    At the mild end, learning difficulties, neurobehavioral problems, and iron deposition
    in the globus pallidus, substantia nigra, red nucleus and dentate nucleus that develops
    between scans, with volume loss in one patient. At the severe end, congenital
    microcephaly with a simplified gyral pattern in one patient, and a hyperkinetic
    movement disorder with autism in the other. The authors of the first report read the brain iron as secondary to
    neurodegeneration, since cellular iron homeostasis is intact.

  description: >
    Patient fibroblasts are broadly remodeled rather than selectively altered: 283 of
    2,347 quantified proteins and 779 of 2,047 lipid species change, with polyunsaturated
    long-chain phosphatidylcholines increased, and labelled-substrate work shows altered
    flux through the citric acid cycle and the methionine-cysteine pathway. Only a few of
    the altered proteins are themselves iron-sulfur proteins, so most of this is
    downstream consequence rather than direct client loss. How it produces the clinical
    phenotype is not established.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:38411040
    reference_title: "CIAO1 and MMS19 deficiency: A lethal neurodegenerative phenotype caused by cytosolic Fe-S cluster protein assembly disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Profound alterations in the proteome, metabolome, and lipidome were observed in patient-derived fibroblasts."
    explanation: The multi-omics result, stated in the report's own abstract.
  - reference: PMID:38411040
    reference_title: "CIAO1 and MMS19 deficiency: A lethal neurodegenerative phenotype caused by cytosolic Fe-S cluster protein assembly disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "confirmed altered fluxes through the citric acid cycle and methionine-cysteine pathway"
    explanation: Labelled-substrate confirmation of the metabolic rerouting, beyond the static metabolite levels.
  - reference: PMID:38411040
    reference_title: "CIAO1 and MMS19 deficiency: A lethal neurodegenerative phenotype caused by cytosolic Fe-S cluster protein assembly disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Among these proteins, only a few known iron-sulfur proteins, such as ETFDH, ABCE1, and CDK5RAP3 were differentially regulated in the CIAO1-deficient fibroblasts."
    explanation: >-
      Most of the proteome change is not in iron-sulfur proteins, which is why this node
      is read as downstream consequence rather than as client loss.
- name: Secondary Mitochondrial Dysfunction in Skeletal Muscle
  description: >
    Patient muscle has enlarged, elongated mitochondria with abnormal cristae, mainly in
    type 1 fibers, and reduced respiratory chain subunits and complex I, II and IV
    activities, while the mitochondrial ISC machinery, aconitase 2 and mitochondrial mass
    are essentially normal. Fibroblasts grown in high glucose show no respiratory defect.
    Unlike classic mitochondrial myopathies there are no COX-negative fibers. The authors
    regard the defect as secondary and could not identify its direct cause.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: type 1 skeletal muscle fiber

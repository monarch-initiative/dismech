  downstream:
  - target: Failed Iron-Sulfur Cluster Delivery to Nucleocytoplasmic Client Proteins
    causal_link_type: DIRECT
- name: Failed Iron-Sulfur Cluster Delivery to Nucleocytoplasmic Client Proteins
  description: >
    Without the targeting complex, cytosolic and nuclear apoproteins that depend on it do
    not acquire their clusters and are degraded. The clients PMID:38950322 reports
    compromised are dihydropyrimidine dehydrogenase, DNA polymerase delta (POLD1, with
    reduced 55Fe incorporation), RTEL1, ELP3, CDKAL1 and PPAT; the reduction in ERCC2
    (XPD) is read off that paper's immunoblot panel rather than stated in its text. How
    far this generalizes is disputed, and the disagreement is recorded on the DNA
    replication node below. The defect is selective:
    cytosolic aconitase (IRP1) activity, cellular iron homeostasis and mitochondrial iron
    content are normal, which separates this disorder from the early mitochondrial
    assembly defects with mitochondrial iron overload. Lentiviral CIAO1 restores the
    client proteins in patient cells.
  biological_scale: MOLECULAR
  role: central_effector
  molecular_functions:
  - preferred_term: iron-sulfur cluster delivery to client apoproteins
    modifier: DECREASED
    term:
      id: GO:0140132

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional assays demonstrated failure of the variants identified in patients to recruit Fe-S recipient proteins, resulting in compromised activities of DNA helicases, polymerases, and repair enzymes that rely on the CIA complex to acquire their Fe-S cofactors."
    explanation: The patient variants fail to recruit client proteins, which lose activity.
  - reference: PMID:38950322

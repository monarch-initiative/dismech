discussions:
- discussion_id: mmds10_fluoropyrimidine_risk
  prompt: >-
    Are patients with CIAO1 deficiency at risk of severe fluoropyrimidine toxicity, as
    patients with primary DPD deficiency are?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Dihydropyrimidine Dehydrogenase Deficiency
  rationale: >-
    DPD activity is absent in CIAO1-deficient fibroblasts and severely reduced in muscle,
    and DPD deficiency is the established cause of fluoropyrimidine toxicity. Knock-in
    nematodes carrying each of the three patient residues lose embryonic viability on
    fluoropyrimidine exposure, which is in vivo evidence that the CIAO1 lesion is enough
    to confer sensitivity. What is missing is human data: no CIAO1 patient has been
    reported to receive a fluoropyrimidine, so the clinical risk remains an extrapolation
    from the enzyme defect and the nematode result.
  evidence:
  - reference: PMID:41131702
    reference_title: "Functional studies of human variants in C. elegans link iron metabolism to DPD deficiency and 5-FU sensitivity."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "we provide the first in vivo evidence that pathogenic variants in CIA complex components can lead to DPD deficiency and, consequently, heightened 5-FU toxicity"
    explanation: >-
      The in vivo basis for the concern. It is indirect for the human question because the
      organism is a nematode and no patient exposure has been reported.
- discussion_id: mmds10_spectrum_determinants
  prompt: >-
    What separates the slowly progressive myopathic presentation from the lethal
    congenital neurodegenerative one?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#CIAO1
  rationale: >-
    p.Arg65Trp is carried by patients at both ends of the spectrum, so the second allele
    may set residual CIAO1 function, but six patients cannot establish this and no
    genotype-phenotype study exists.

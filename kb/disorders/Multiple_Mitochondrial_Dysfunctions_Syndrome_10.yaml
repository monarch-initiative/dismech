    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "cytosolic aconitase 1 (ACO1, also known as IRP1) activity was unaltered in P1-derived lysates compared with parental cell lysates"
    explanation: The defect is selective for CIA clients and spares IRP1.
  - reference: PMID:38950322
    reference_title: "CIAO1 loss of function causes a neuromuscular disorder with compromise of nucleocytoplasmic Fe-S enzymes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Lentivirus-mediated restoration of CIAO1 expression reversed all patient-derived cellular abnormalities."
    explanation: Rescue by wild-type CIAO1 ties the cellular defect to CIAO1 loss.
  downstream:

progression:
- phase: Childhood to adolescent onset myopathy
  notes: >-
    In the myopathic presentation weakness begins between 1.5 and 17 years and progresses
    slowly; three of four patients remained ambulant, one became wheelchair-bound at 24.5
    years, and the oldest was 59.
  evidence:
  - reference: PMID:38950322
    reference_title: "CIAO1 loss of function causes a neuromuscular disorder with compromise of nucleocytoplasmic Fe-S enzymes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 4 patients had onset of weakness in early childhood to the adolescent years (1.5–17 years)"
    explanation: Onset range of the myopathy.
  - reference: PMID:38950322
    reference_title: "CIAO1 loss of function causes a neuromuscular disorder with compromise of nucleocytoplasmic Fe-S enzymes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three of 4 patients (P1, P2, and P4) remain ambulant, whereas P3 has progressed to being wheelchair bound at age 24.5 years"
    explanation: Slow and variable progression.
- phase: Congenital neurodegenerative course
  notes: >-
    The severe presentation begins at or before birth in one patient, with intrauterine
    growth restriction and congenital microcephaly, and in infancy in the other, whose
    brain imaging at six years was unremarkable and who deteriorated in his late teens.
    Both died, at 18 months and at 19 years.
  evidence:
  - reference: PMID:38411040
    reference_title: "CIAO1 and MMS19 deficiency: A lethal neurodegenerative phenotype caused by cytosolic Fe-S cluster protein assembly disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She died at 18 months of respiratory failure from bronchiolitis complicated by apparent bacterial and fungal superinfection"
    explanation: Death in infancy in the first CIAO1 patient of this report.
  - reference: PMID:38411040
    reference_title: "CIAO1 and MMS19 deficiency: A lethal neurodegenerative phenotype caused by cytosolic Fe-S cluster protein assembly disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He died at 19 years of age after multi-organ failure with carnificating pneumonia, septic cardiomyopathy, and intracranial hemorrhages."
    explanation: Death in adolescence in the second CIAO1 patient.
pathophysiology:
- name: Biallelic CIAO1 Partial Loss-of-Function Variants
  description: >
    Germline missense variants in conserved residues on the loops joining the WD40 blades,
    and in one patient an exon 7 deletion removing the segment that anchors CIAO1 to
    CIAO2B. p.Arg65Trp recurs and is carried by patients at both ends of the spectrum. The
    variants are hypomorphic: complete loss is expected to be incompatible with life.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  genes:
  - preferred_term: CIAO1
    term:
      id: hgnc:14280
      label: CIAO1
  evidence:
  - reference: PMID:38950322
    reference_title: "CIAO1 loss of function causes a neuromuscular disorder with compromise of nucleocytoplasmic Fe-S enzymes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The CIAO1 variants identified in our patients resulted in only a partial loss of function, as global KO is likely to be incompatible with life."
    explanation: The disease alleles are partial loss of function.
  downstream:
  - target: Destabilized CIAO1 and Loss of the CIA Targeting Complex
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38950322
      reference_title: "CIAO1 loss of function causes a neuromuscular disorder with compromise of nucleocytoplasmic Fe-S enzymes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "All variant CIAO1 proteins had diminished stability when compared with WT CIAO1 and reduced interactions with the CIA and the de novo ISC assembly components"
      explanation: The patient variants destabilize the protein and weaken its interactions.
- name: Destabilized CIAO1 and Loss of the CIA Targeting Complex
  description: >
    CIAO1 protein is profoundly reduced in patient fibroblasts and muscle, and its partners
    MMS19 and CIAO2B (FAM96B), with which it forms the CIA targeting complex, are lost with
    it, as is CIAO2A (FAM96A). Acute siRNA knockdown had not shown this co-depletion, so it
    is a feature of chronic loss. The early iron-sulfur cluster assembly machinery (NFS1,
    HSC20, HSPA9) is unchanged.
  biological_scale: MOLECULAR

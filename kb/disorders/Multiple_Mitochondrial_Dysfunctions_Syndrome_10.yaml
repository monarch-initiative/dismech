  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Biallelic CIAO1 variants, compound heterozygous in all reported patients. Carrier
    parents are unaffected, and no homozygous null patient is known; complete loss is
    expected to be lethal.
  evidence:
  - reference: PMID:38950322
    reference_title: "CIAO1 loss of function causes a neuromuscular disorder with compromise of nucleocytoplasmic Fe-S enzymes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Segregation testing, when available (P1, P2), was consistent with autosomal recessive inheritance."
    explanation: Segregation in the founding families fits recessive inheritance.
  - reference: PMID:38950322
    reference_title: "CIAO1 loss of function causes a neuromuscular disorder with compromise of nucleocytoplasmic Fe-S enzymes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, the carriers were not clinically affected, indicating that 1 functional copy of CIAO1 is sufficient to sustain normal physiology"
    explanation: Heterozygous carriers are unaffected.

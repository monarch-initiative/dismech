genetic:
- name: CIAO1
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: CIAO1
    term:
      id: hgnc:14280
      label: CIAO1
  variant_origin: GERMLINE
  notes: >
    Reported variants on NM_004804: p.His302Pro (three myopathic patients), p.Arg65Trp
    (c.193C>T; two myopathic and both severe-presentation patients; gnomAD allele
    frequency about 1 in 1,000 with no homozygotes), p.Asp171Gly with p.His251Leu, an exon
    7 deletion (p.F250_L339del) in trans with p.His302Pro, p.Trp184Cys (c.552G>C) and
    p.His193Tyr (c.577C>T). All patients are compound heterozygous. Most variants
    destabilize the protein, but the two reports disagree about p.Arg65Trp specifically:
    PMID:38411040 found no loss of stability for it as a recombinant protein and predicts
    it disrupts a protein-binding surface instead, while PMID:38950322's statement that
    all of its variant proteins were destabilized covers p.Arg65Trp, which one of its
    patients carries. The systems differ - stable expression in HeLa cells against
    recombinant protein - and neither paper addresses the other's result. The second
    allele may set severity, since
    p.Arg65Trp occurs at both ends of the spectrum, but this is an inference from six
    patients. p.Arg65Trp, p.Trp184Cys and p.His193Tyr were all classified as variants of
    uncertain significance in ClinVar as of the C. elegans study, which is what makes the
    functional work on them diagnostically load-bearing.
  evidence:
  - reference: PMID:38950322
    reference_title: "CIAO1 loss of function causes a neuromuscular disorder with compromise of nucleocytoplasmic Fe-S enzymes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study identifies CIAO1 as a human disease gene and provides insights into the broader implications of the cytosolic Fe-S assembly pathway in human health and disease."
    explanation: Founding gene-disease report.
  - reference: PMID:38950322
    reference_title: "CIAO1 loss of function causes a neuromuscular disorder with compromise of nucleocytoplasmic Fe-S enzymes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two missense variants were recurrent: p.His302Pro (n = 3, in P1, P2 and P3) and p.Arg65Trp (n = 2, in P2 and P3)."
    explanation: Recurrent alleles in the founding cohort.
  - reference: PMID:38411040
    reference_title: "CIAO1 and MMS19 deficiency: A lethal neurodegenerative phenotype caused by cytosolic Fe-S cluster protein assembly disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "No significant difference in stability was observed for CIAO1 carrying the R65W variant, whereas the CIAO1 proteins carrying the W184C or H193Y variant proved to be less stable than that observed for wild-type CIAO1"
    explanation: Variant-specific effects on stability.
  - reference: PMID:41131702
    reference_title: "Functional studies of human variants in C. elegans link iron metabolism to DPD deficiency and 5-FU sensitivity."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results demonstrate that the ultra-rare CIAO1 variants p.Trp184Cys and p.His193Tyr, as well as the more common p.Arg65Trp variant, exhibit a hypomorphic effect"
    explanation: Each of the three variants is hypomorphic rather than null, shown by knock-in of the equivalent residues in a nematode rather than in patient cells, which is why it is marked indirect.
  - reference: PMID:41131702
    reference_title: "Functional studies of human variants in C. elegans link iron metabolism to DPD deficiency and 5-FU sensitivity."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "since the three variants assessed here are classified as variants of uncertain significance (VUS) in ClinVar"
    explanation: Records the ClinVar classification of the three variants at the time of that study.

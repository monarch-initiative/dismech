- name: Dihydropyrimidine Dehydrogenase Deficiency
  description: >
    Dihydropyrimidine dehydrogenase is a homodimer carrying eight 4Fe-4S clusters and
    needs the CIA complex to mature. Its activity is absent in fibroblasts and severely
    reduced in muscle, although DPYD itself is normal, so uracil and thymine rise in urine,
    plasma and cerebrospinal fluid. This is the diagnostic clue that led to the second
    report: a DPD-deficiency pattern with no DPYD variant.

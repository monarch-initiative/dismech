- name: Caenorhabditis elegans ciao-1 patient-variant knock-in series
  species: Caenorhabditis elegans
  species_term:
    preferred_term: Caenorhabditis elegans
    term:
      id: NCBITaxon:6239
      label: Caenorhabditis elegans
  genotype: >-
    ciao-1(mod212 p.Arg71Trp), ciao-1(mod214 p.Trp190Cys), ciao-1(mod213 p.His200Tyr),
    the nematode equivalents of CIAO1 p.Arg65Trp, p.Trp184Cys and p.His193Tyr; compared
    with a dpyd-1 knockout
  publication: PMID:41131702
  description: >
    CRISPR knock-ins of the three patient CIAO1 residues, which are invariant between the
    nematode and human. All three are viable with normal brood size and hatch rate under
    standard conditions, where a knockout is sterile, and all three show reduced embryonic
    viability on fluoropyrimidine exposure: the two rare alleles retain about 40 percent
    hatching, while the p.Arg71Trp line is as severely affected as a dihydropyrimidine
    dehydrogenase knockout. The p.Arg71Trp line also has a temperature-dependent mortal
    germline phenotype, becoming sterile over generations at the higher temperature, which
    is the only allele-specific fitness defect reported and sits on the allele shared by
    both human presentations. The drug assay needs a bacterial food strain unable to
    convert the drug itself, since the usual strain's own metabolism masks the host defect.
  modeled_mechanisms:
  - target: Dihydropyrimidine Dehydrogenase Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The knock-ins show in vivo that each patient CIAO1 residue is hypomorphic and
      compromises dihydropyrimidine dehydrogenase function, which patient cells had shown
      only for the genotype as a whole.
    limitations: >-
      Each allele is modelled homozygously, whereas every patient is compound
      heterozygous, so the model does not address how two alleles combine. The readout is
      embryonic viability under drug exposure rather than enzyme activity, and the
      nematode has none of the human clinical phenotype.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        Enzyme function is inferred from larval hatch rate under fluoropyrimidine
        exposure; dihydropyrimidine dehydrogenase activity itself was not assayed in the
        knock-in lines.
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        Homozygous single-allele animals stand in for compound heterozygous patients, so
        the genotype tested is not the genotype any patient carries.
    evidence:
    - reference: PMID:41131702
      reference_title: "Functional studies of human variants in C. elegans link iron metabolism to DPD deficiency and 5-FU sensitivity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results suggest that ciao-1(His200Tyr), ciao-1(Trp190Cys), and ciao-1(Arg71Trp) are hypomorphic alleles that still significantly compromise DPD enzyme function."
      explanation: >-
        The model's own conclusion, that each patient residue is hypomorphic and impairs
        the enzyme.
    - reference: PMID:41131702
      reference_title: "Functional studies of human variants in C. elegans link iron metabolism to DPD deficiency and 5-FU sensitivity."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "The three CIAO1 variants identified in the two patients from our previous study ( van Karnebeek et al. 2024 ) are invariant between C. elegans and humans"
      explanation: Residue conservation is what lets the nematode knock-in stand for the human variant.
  evidence:
  - reference: PMID:41131702
    reference_title: "Functional studies of human variants in C. elegans link iron metabolism to DPD deficiency and 5-FU sensitivity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we provide the first in vivo evidence that pathogenic variants in CIA complex components can lead to DPD deficiency and, consequently, heightened 5-FU toxicity"
    explanation: Establishes the model as the first whole-organism test of this mechanism.
  - reference: PMID:41131702
    reference_title: "Functional studies of human variants in C. elegans link iron metabolism to DPD deficiency and 5-FU sensitivity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ciao-1(Arg71Trp) worms exhibited a temperature-dependent weak mortal germline (Mrt) phenotype, with 70% of the replicates becoming sterile by generation 21 when incubated at 25 °C"
    explanation: >-
      The one allele-specific fitness phenotype, on the allele shared by both human
      presentations, which the authors read as further evidence of its pathogenicity.
treatments:
- name: Phenobarbital for neonatal electroencephalographic abnormality
  description: >
    Phenobarbital given for multifocal sharp waves on electroencephalogram in the neonatal
    period of one severe-presentation patient, after which her clinical state and the
    electroencephalogram improved.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phenobarbital
      term:
        id: CHEBI:8069
        label: phenobarbital
  evidence:
  - reference: PMID:38411040
    reference_title: "CIAO1 and MMS19 deficiency: A lethal neurodegenerative phenotype caused by cytosolic Fe-S cluster protein assembly disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following treatment with phenobarbital, her clinical status and electroencephalogram improved."
    explanation: The one reported drug treatment and its reported effect in a CIAO1 patient.
  notes: >-
    No disease-specific therapy exists and neither report describes a chronic management
    plan. This row is one patient's symptomatic treatment, not a disease-directed therapy.
    The other interventions recorded in PMID:38411040 are terminal intensive care rather
    than management of the disease - bronchial lavage, antibiotics and oscillator
    ventilation during the fatal superinfection of one patient, and intubation in the
    other - so they are not curated as treatments of this disease.
    Lentiviral restoration of CIAO1 reverses the cellular phenotype in patient fibroblasts
    and is recorded on the pathophysiology node that it rescues. It is cited there as
    mechanistic proof rather than here as a therapy, because nothing about it has been
    taken toward treatment.
diagnosis:
- name: Urine pyrimidine analysis
  description: >
    Raised urinary uracil and thymine with absent DPD activity but a normal DPYD sequence
    point to a CIA defect, and led to the diagnosis in the severe-presentation patients.
    Exome or genome sequencing found the CIAO1 variants in every reported patient; one
    allele was an exon deletion, which needs copy-number analysis.
  evidence:
  - reference: PMID:38411040
    reference_title: "CIAO1 and MMS19 deficiency: A lethal neurodegenerative phenotype caused by cytosolic Fe-S cluster protein assembly disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Metabolic analysis showed elevated uracil and thymine levels in body fluids but no pathogenic variants in DPYD"
    explanation: The metabolic signature that pointed beyond DPYD.

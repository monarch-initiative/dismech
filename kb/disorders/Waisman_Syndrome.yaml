inheritance:
- name: X-linked recessive inheritance
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    Hemizygous males are affected. Heterozygous females are usually unaffected
    or mildly affected; preferential inactivation of the mutant X has been
    proposed to explain an unaffected carrier mother, a heterozygous sister had
    intellectual disability and a broad autism phenotype, and a carrier mother
    in another family had late-onset Parkinson disease. The original 1991
    family established X linkage to Xq27.3-qter.
  evidence:
  - reference: PMID:1674730
    reference_title: "Waisman syndrome, a human X-linked recessive basal ganglia disorder with mental retardation: localization to Xq27.3-qter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Linkage of the gene responsible for an X-linked early onset parkinsonism
      disorder with mental retardation (McKusick 311510) to DNA probes that
      detect restriction fragment length polymorphisms is described.
    explanation: Establishes X linkage of the disorder in the original family.
  - reference: PMID:29152164
    reference_title: "Mutations in RAB39B in individuals with intellectual disability, autism spectrum disorder, and macrocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Penetrance for ASD is high among males but more variable among females
      with RAB39B mutations.
    explanation: Male-predominant penetrance with variable expression in heterozygous females.
  - reference: PMID:41074240
    reference_title: "RAB39B Related Parkinsonism in an Italian Family: A Unique Use of Advanced Therapies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Next Generation Sequencing analysis revealed a currently unknown
      pathogenic hemizygous sequence variant c.463C>T (NM_171998.4) in the
      RAB39B gene, confirmed also in the proband's mother, affected by
      late-onset PD.
    explanation: A heterozygous carrier mother with late-onset Parkinson disease.
genetic:
- name: RAB39B
  gene_term:
    preferred_term: RAB39B
    term:
      id: hgnc:16499
      label: RAB39B
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_01dc73a8-fbd2-4081-95cd-ab7cb59236d7-2018-06-04T100000.000Z
    evidence:
    - reference: CGGV:assertion_01dc73a8-fbd2-4081-95cd-ab7cb59236d7-2018-06-04T100000.000Z
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "RAB39B | HGNC:16499 | early-onset parkinsonism-intellectual disability syndrome | MONDO:0010709 | XL | Definitive"
      explanation: ClinGen classifies RAB39B for this disease as Definitive, X-linked.
  notes: >-
    Reported disease alleles include c.21C>A (p.Tyr7*), the c.215+1G>A splice
    variant of the MRX72 family, a ~45 kb whole-gene deletion, the destabilizing
    missense c.503C>A (p.Thr168Lys), frameshifts c.137dupT and c.371delA, the
    nonstop c.640T>C (p.*214Glnext*21), the in-frame deletion c.436_447del, and
    c.200G>T and c.463C>T. Somatic mosaicism in one family is stated in the
    title of PMID:28851564, but its abstract gives no detail. Loss of function
    is the disease mechanism.
  evidence:
  - reference: PMID:25434005
    reference_title: "Mutations in RAB39B cause X-linked intellectual disability and early-onset Parkinson disease with α-synuclein pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analysis of an Australian family with three males displaying
      clinical features of early-onset parkinsonism and intellectual disability
      identified a ∼45 kb deletion resulting in the complete loss of RAB39B.
    explanation: Whole-gene deletion causing the full disorder in an affected family.
  - reference: PMID:25434005
    reference_title: "Mutations in RAB39B cause X-linked intellectual disability and early-onset Parkinson disease with α-synuclein pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, we have shown that loss-of-function mutations in RAB39B cause
      intellectual disability and pathologically confirmed early-onset Parkinson
      disease.
    explanation: States loss of function as the mechanism for both disease phases.
  - reference: PMID:20159109
    reference_title: "Mutations in the small GTPase gene RAB39B are responsible for X-linked mental retardation associated with autism, epilepsy, and macrocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One mutation in family X (D-23) introduced a stop codon seven amino acids
      after the start codon (c.21C > A; p.Y7X). A second mutation, in the MRX72
      family, altered the 5' splice site (c.215+1G > A) and normal splicing.
      Neither instance produced a protein.
    explanation: The first two RAB39B alleles, both protein-null.
  - reference: PMID:28851564
    reference_title: "X-linked Parkinsonism with Intellectual Disability caused by novel mutations and somatic mosaicism in RAB39B gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two novel RAB39B frameshift variants were found to result in the absence
      of RAB39B protein (family 1: c.137dupT; family 2: c.371delA).
    explanation: Two further protein-null alleles in Italian families.
pathophysiology:
- name: RAB39B Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Hemizygous null or destabilizing variants abolish or deplete RAB39B, a
    neuron-enriched Rab GTPase localized to the Golgi compartment. The
    p.Thr168Lys missense and the nonstop allele act by destabilizing the
    protein, so the protein-null and missense classes converge on loss of
    function.
  genes:
  - preferred_term: RAB39B
    term:
      id: hgnc:16499
      label: RAB39B
  molecular_functions:
  - preferred_term: RAB39B GTPase activity
    modifier: DECREASED
    term:
      id: GO:0003924
      label: GTPase activity
  evidence:
  - reference: PMID:25434005
    reference_title: "Mutations in RAB39B cause X-linked intellectual disability and early-onset Parkinson disease with α-synuclein pathology."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In silico and in vitro studies demonstrated that the mutation destabilized
      the protein, consistent with loss of function.
    explanation: The missense allele acts through protein destabilization.
  - reference: PMID:34761259
    reference_title: "Clinical characterization of a novel RAB39B nonstop mutation in a family with ASD and severe ID causing RAB39B downregulation and study of a Rab39b knock down mouse model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutation led to RAB39B protein instability, resulting in its increased
      degradation and consequent downregulation.
    explanation: The nonstop allele also acts through loss of protein.
  downstream:
  - target: Impaired Golgi-Endosomal Vesicular Trafficking
    causal_link_type: DIRECT
    description: RAB39B is a trafficking GTPase; its loss removes that function.
  - target: PI3K-AKT-mTOR Hyperactivation in Neural Progenitors
    causal_link_type: DIRECT
    description: >-
      RAB39B interacts with PI3K components; its deletion disinhibits
      PI3K-AKT-mTOR signaling in neural progenitors.
  - target: Impaired Macroautophagy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      RAB39B is a substrate of the C9orf72-SMCR8-WDR41 exchange-factor complex
      that regulates autophagy; its loss impairs macroautophagy in the nigra.
  - target: Iron accumulation in brain
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Brain iron deposition is reported at post-mortem and on imaging, but no
      mechanism connecting it to RAB39B loss has been demonstrated.
  - target: Basal ganglia calcification
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Pallidal calcification is reported in some patients with no curated
      mechanism.
  - target: Seizure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Epileptic seizures occur in some patients; no epileptogenic mechanism has
      been shown for RAB39B loss.
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Early developmental delay is the first manifestation; the curated
      synaptic and progenitor arms are candidate contributors but none has been
      tied to it specifically.
  - target: Absent speech
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Severe language impairment with no specific curated mechanism.
  - target: Incoordination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Childhood motor incoordination with no specific curated mechanism.
  - target: Attention deficit hyperactivity disorder
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Single-case behavioural finding with no curated mechanism.
- name: Impaired Golgi-Endosomal Vesicular Trafficking
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    RAB39B normally localizes to Golgi vesicles and recycling endosomes and is
    needed for glutamatergic receptor maturation. Without it, trafficking of
    receptor cargo to the synapse and the formation of presynaptic structures
    are disturbed.
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  biological_processes:

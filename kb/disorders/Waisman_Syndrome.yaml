    reference_title: "Clinical characterization of a novel RAB39B nonstop mutation in a family with ASD and severe ID causing RAB39B downregulation and study of a Rab39b knock down mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using a Rab39b KD mouse model, we demonstrated that the downregulation of
      RAB39B led to increased GluA2 lacking Ca2+-permeable AMPAR composition at
      the hippocampal neuronal surface and increased dendritic spine density
      that remained in an immature filopodia-like state.
    explanation: Direct demonstration of the synaptic phenotype in the knockdown mouse.
  downstream:
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Immature synapses with altered AMPA receptor composition are proposed to
      underlie the cognitive phenotype; the mouse shows working and associative
      memory deficits.
  - target: Autistic behavior
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The knockdown mouse shows impaired social behaviour.

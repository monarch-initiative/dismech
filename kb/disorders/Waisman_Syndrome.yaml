name: Waisman Syndrome
creation_date: "2026-11-07T11:30:26Z"
description: >-
  Waisman syndrome (early-onset parkinsonism-intellectual disability syndrome;
  OMIM 311510) is an ultra-rare X-linked recessive neurological disorder caused
  by hemizygous loss-of-function variants in RAB39B at Xq28, which encodes a
  brain-enriched Rab GTPase of the Golgi and recycling-endosome compartments.
  Affected males show a developmental phase from infancy or early childhood -
  intellectual disability and developmental delay, often with poor speech and
  motor coordination, and in variable combination autism spectrum disorder,
  macrocephaly and epileptic seizures - followed in adolescence or adulthood by
  a progressive, typically tremor-predominant parkinsonism. Post-mortem study of
  the index family showed nigral dopaminergic neuron loss with widespread Lewy
  body pathology, cortical Lewy bodies, brain iron accumulation, tau
  immunoreactivity and axonal spheroids, and brain imaging in later families
  shows paramagnetic (iron) deposition in the basal ganglia and midbrain with
  pallidal calcification in some patients. Every reported disease allele
  (nonsense, splice, frameshift, nonstop, whole-gene deletion, and a
  destabilizing missense) abolishes or depletes the protein. Model systems
  connect the loss to three cellular consequences: disinhibited PI3K-AKT-mTOR
  signaling and over-proliferation of neural progenitors (macrocephaly and
  autism-like phenotypes), mistrafficking of GluA2-containing AMPA receptors
  with immature dendritic spines (synaptic and cognitive phenotypes), and
  impaired macroautophagy with alpha-synuclein dysregulation and degeneration of
  substantia nigra dopaminergic neurons (parkinsonism). Management is
  symptomatic; the parkinsonism is levodopa-responsive but prone to early
  treatment-induced motor complications.
category: Mendelian
parents:
- X-linked Syndromic Intellectual Disability
- Parkinsonian Disorder
- Neurodevelopmental Disorder

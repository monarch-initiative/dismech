animal_models:
- name: Rab39b knockout mouse (nigral degeneration)
  species: Mouse
  genotype: Rab39b-/Y
  publication: PMID:40473068
  description: Male hemizygous knockout used to study the neurodegenerative phase.
  modeled_mechanisms:
  - target: Substantia Nigra Dopaminergic Neuron Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces nigral dopaminergic loss, Lewy bodies and motor impairment, and
      rapamycin rescue places impaired macroautophagy upstream.
    limitations: >-
      A single study; the mouse does not model the iron accumulation or pallidal
      calcification seen in patients, and the developmental phase was not the
      object of study.
    evidence:
    - reference: PMID:40473068
      reference_title: "Absence of Rab39b-induced macroautophagy impairment increases neurotoxic α-synuclein and causes degeneration of substantia nigra dopaminergic neurons in mouse model of X-linked Parkinson's disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Macroautophagy activator rapamycin reversed macroautophagy dysfunction
        or upregulation of SN α-synuclein and ameliorated motor deficits and
        demise of SN dopaminergic neurons in Rab39b-/Y mice.
      explanation: Rescue by an autophagy activator supports the modeled causal chain.
- name: Rab39b knockout mouse (cortical development)
  species: Mouse
  genotype: Rab39b knockout
  publication: PMID:32115408
  description: >-
    Knockout used to study the developmental phase, alongside RAB39B-mutant
    human cerebral organoids.
  modeled_mechanisms:
  - target: Neural Progenitor Overproliferation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reproduces impaired cortical neurogenesis, macrocephaly and autism-like behaviours.
    limitations: >-
      Mouse cortex has few outer radial glia, the progenitor type in which mTOR
      activation was strongest in human organoids, so the mouse may understate
      the human mechanism.
    evidence:
    - reference: PMID:32115408
      reference_title: "Cerebral organoid and mouse models reveal a RAB39b-PI3K-mTOR pathway-dependent dysregulation of cortical development leading to macrocephaly/autism phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We generated Rab39b knockout (KO) mice and found that they exhibited
        cortical neurogenesis impairment, macrocephaly, and hallmark ASD
        behaviors, which resembled patient phenotypes.
      explanation: The knockout reproduces the developmental phenotype.
- name: Rab39b knockdown mouse
  species: Mouse
  genotype: Rab39b knockdown
  publication: PMID:34761259
  description: Knockdown model mimicking the protein reduction caused by the nonstop allele.
  modeled_mechanisms:
  - target: GluA2 AMPA Receptor Mistrafficking and Immature Dendritic Spines
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Shows the AMPA receptor and spine phenotype with social and memory deficits.
    limitations: Knockdown rather than a patient allele; hippocampal readouts only.
    evidence:
    - reference: PMID:34761259
      reference_title: "Clinical characterization of a novel RAB39B nonstop mutation in a family with ASD and severe ID causing RAB39B downregulation and study of a Rab39b knock down mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Rab39b KD mice revealed impaired social behaviour but intact social
        recognition.
      explanation: Behavioural phenotype in the knockdown mouse.
differential_diagnoses:
- name: Neurodevelopmental Disorder with Early-Onset Parkinsonism and Behavioral Abnormalities
  description: >-
    PTRHD1-related autosomal recessive disorder with the same biphasic pattern
    of childhood intellectual disability followed by early-onset parkinsonism.
  distinguishing_features:
  - >-
    Autosomal recessive (biallelic PTRHD1) rather than X-linked, so affected
    females occur and parental consanguinity is common.
- name: Beta-propeller protein-associated neurodegeneration
  description: >-
    WDR45-related X-linked disorder with childhood developmental delay and
    adult parkinsonism-dystonia with brain iron accumulation, grouped with
    Waisman syndrome among the X-linked parkinsonian syndromes.
  distinguishing_features:
  - >-
    Caused by WDR45 rather than RAB39B, and mostly seen as de novo disease in
    females.
  evidence:
  - reference: PMID:33960519
    reference_title: "X-Linked Parkinsonism: Phenotypic and Genetic Heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In this review, we provide an updated overview of the phenotypic and
      genetic spectrum of the most relevant X-linked parkinsonian syndromes,
      namely X-linked dystonia-parkinsonism (XDP, Lubag disease),
      fragile X-associated tremor/ataxia syndrome (FXTAS), beta-propeller
      protein-associated neurodegeneration (BPAN, NBIA/PARK-WDR45), Fabry
      disease, Waisman syndrome,
    explanation: Places BPAN and Waisman syndrome in the same differential group.

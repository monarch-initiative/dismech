- name: PI3K-AKT-mTOR Hyperactivation in Neural Progenitors
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    RAB39B interacts with class I PI3K components. In Rab39b knockout mouse
    cortex and in RAB39B-mutant human cerebral organoids, PI3K-AKT-mTOR
    signaling in neural progenitors is increased, most strongly in outer radial
    glia, a progenitor type abundant in human but sparse in rodent cortex.
    AKT inhibition rescues the organoid phenotype.

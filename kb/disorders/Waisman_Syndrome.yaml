notes: >-
  Naming. The MONDO label "early-onset parkinsonism-intellectual disability
  syndrome" describes a phenotype that other genes also produce (for example
  PTRHD1, curated as
  Neurodevelopmental_Disorder_with_Early-Onset_Parkinsonism_and_Behavioral_Abnormalities),
  so the entry uses the eponym Waisman syndrome, which the literature applies
  specifically to the RAB39B disorder (PMID:28851564, PMID:35088096,
  PMID:41074240) and which titles the original linkage report (PMID:1674730).
  The MONDO label and Laxova-Opitz syndrome are kept as synonyms.

  Relationship to MRX72. Non-Syndromic_X-Linked_Intellectual_Disability carries
  an MRX72 subtype (MONDO:0010289) for the same gene. MONDO keeps the two as
  separate terms, and ClinGen curates RAB39B as Definitive against this term
  (MONDO:0010709), so the MRX72 row records the earlier, intellectual-disability
  presentation and this entry the full RAB39B disorder including parkinsonism.

  GeneReviews. `just check-genereviews` finds no GeneReviews chapter for this
  entry or its synonyms, and the committed Bookshelf index has no row naming
  RAB39B; the clinical baseline is the primary case literature cited below.

  Alpha-synuclein direction. The index study reports reduced steady-state
  alpha-synuclein after Rab39b knockdown in cultured cells, while the Rab39b
  knockout mouse and the human post-mortem material show alpha-synuclein
  accumulation and Lewy bodies. The entry records both and does not resolve the
  difference; "dysregulated" is the claim the evidence supports.

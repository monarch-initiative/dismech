  evidence:
  - reference: PMID:20159109
    reference_title: "Mutations in the small GTPase gene RAB39B are responsible for X-linked mental retardation associated with autism, epilepsy, and macrocephaly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that RAB39B, a novel RAB GTPase of unknown function, is a
      neuronal-specific protein that is localized to the Golgi compartment.
    explanation: Places RAB39B in the neuronal Golgi trafficking compartment.
  - reference: PMID:32762091
    reference_title: "RAB39B is redistributed in dementia with Lewy bodies and is sequestered within aβ plaques and Lewy bodies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Physiologically, RAB39B is localized to Golgi vesicles and recycling
      endosomes and is required for glutamatergic receptor maturation but also
      for alpha-Synuclein (aSyn) homeostasis and the inhibition of its
      aggregation.
    explanation: >-
      Background statement of RAB39B's normal trafficking role, the function
      lost in this disease.
  downstream:
  - target: GluA2 AMPA Receptor Mistrafficking and Immature Dendritic Spines
    causal_link_type: DIRECT
    description: Loss of RAB39B-dependent trafficking alters AMPA receptor composition at the neuronal surface.
  - target: Reduced Presynaptic Bouton Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Downregulation of RAB39B reduces presynaptic structures in cultured neurons.
- name: GluA2 AMPA Receptor Mistrafficking and Immature Dendritic Spines
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In a Rab39b knockdown mouse, GluA2-lacking calcium-permeable AMPA receptors
    accumulate at the hippocampal neuronal surface and dendritic spines are more
    numerous but stay in an immature filopodia-like state, with impaired social
    behaviour and working and associative memory.
  cell_types:
  - preferred_term: hippocampal neuron
    term:
      id: CL:0002608
      label: hippocampal neuron
  biological_processes:

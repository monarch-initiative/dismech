diagnosis:
- name: Molecular genetic testing of RAB39B
  description: >-
    Diagnosis rests on finding a hemizygous RAB39B variant, usually by exome or
    gene-panel sequencing in Parkinson disease or X-linked intellectual
    disability cohorts; the whole-gene deletion needs copy-number analysis.
  evidence:
  - reference: PMID:28851564
    reference_title: "X-linked Parkinsonism with Intellectual Disability caused by novel mutations and somatic mosaicism in RAB39B gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      RAB39B pathogenic variants cause X-linked Parkinsonism associated with
      Intellectual Disability, known as Waisman syndrome, a very rare disorder
      that has been mainly identified through exome sequencing in large
      Parkinson's disease cohorts.
    explanation: Exome sequencing is the usual route to diagnosis.

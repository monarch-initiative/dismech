      spondyloenchondrodysplasia.
    explanation: >-
      Places the tissue phenotype of this disease within the Mendelian type I
      interferonopathies, the disease class this node's consequences belong to.
phenotypes:
- category: Infectious
  name: BCG disease
  description: >
    Disease caused by the live M. bovis BCG vaccine strain, ranging from an exaggerated
    regional reaction with inguinal lymphadenopathy to disseminated disease. In
    BCG-vaccinating countries this is the presenting event of the mycobacterial arm, because
    vaccination at or shortly after birth is the first mycobacterial challenge an affected
    infant meets. Patients with the same genotype who were not BCG-vaccinated have no
    mycobacterial phenotype at all, which is the clearest evidence that the exposure rather
    than the genotype decides this presentation.
  phenotype_term:
    preferred_term: BCGosis
    term:
      id: HP:0020087
      label: BCGosis
    onset:
      onset_category: INFANTILE
      notes: >-
        In the reported dermatologic cohort one patient was vaccinated at one month and
        reacted with regional lymphadenopathy and overlying erythema. Age at BCG disease
        therefore tracks the vaccination schedule rather than an intrinsic disease onset. No
        pooled mean age at onset has been published for this etiology, so none is recorded.
  evidence:
  - reference: PMID:22859821
    reference_title: "Mycobacterial disease and impaired IFN-γ immunity in humans with inherited ISG15 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe human patients with inherited ISG15 deficiency and mycobacterial,
      but not viral, diseases.
    explanation: >-
      The founding report establishing mycobacterial disease, and specifically not viral
      disease, as the infectious phenotype of this deficiency.
  - reference: PMID:32402279
    reference_title: "Systemic Type I IFN Inflammation in Human ISG15 Deficiency Leads to Necrotizing Skin Lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the age of one month, he was vaccinated with BCG, to which he displayed an
      exaggerated response, with right inguinal lymphadenopathy and erythema of the overlying
      skin.
    explanation: >-
      A worked pediatric case of BCG disease following vaccination in infancy, and the basis
      for the infantile onset category.
  - reference: PMID:25307056
    reference_title: "Human intracellular ISG15 prevents interferon-α/β over-amplification and auto-inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ISG15-deficient patients from China were not vaccinated with BCG at birth,
      consistent with their current lack of an MSMD phenotype.
    explanation: >-
      Shows that unvaccinated patients with the same genotype have no mycobacterial
      phenotype, making BCG exposure rather than genotype the determinant of this
      presentation.
- category: Infectious
  name: Non-tuberculous mycobacterial infection
  description: >
    Susceptibility extends to weakly virulent environmental mycobacteria, which in countries
    that do not vaccinate with BCG are the organisms that reveal an MSMD genotype.
  phenotype_term:
    preferred_term: Non-tuberculous mycobacterial infection
    term:
      id: HP:5210115
      label: Non-tuberculous mycobacterial infection
  evidence:
  - reference: PMID:39365299
    reference_title: "First Brazilian Case Report of Unrelated Patients with Identical ISG15 Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ISG15 deficiency is a mixed syndrome of Mendelian susceptibility to mycobacterial
      infections (MSMD), a rare inherited condition characterized primarily by recurrent
      infections from low-virulence mycobacteria and monogenic type I interferonopathy.
    explanation: >-
      States susceptibility to low-virulence mycobacteria as a defining feature of ISG15
      deficiency, and names the dual syndrome this entry models.
- category: Dermatologic
  name: Skin ulceration
  description: >
    Recurrent, deep, necrotising ulceration, typically of the groin, vulva, neck and limbs,
    sometimes preceded by hypopigmented or erythematous indurated patches. The lesions are
    largely steroid-refractory and can resolve spontaneously with post-inflammatory
    hyperpigmentation. Onset is in early childhood - ulceration from six months and from one
    year of age in the reported series - and in five patients this, rather than infection or
    seizures, was the presentation that brought them to medical attention.
  phenotype_term:
    preferred_term: Recurrent necrotising skin ulceration
    term:
      id: HP:0200042
      label: Skin ulcer
    temporality: RECURRENT
  evidence:
  - reference: PMID:32402279
    reference_title: "Systemic Type I IFN Inflammation in Human ISG15 Deficiency Leads to Necrotizing Skin Lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein, we describe five new patients with six novel ISG15 mutations presenting with
      skin lesions who were managed for dermatologic disease.
    explanation: >-
      Establishes dermatologic disease as a presentation of ISG15 deficiency in its own
      right, in five genetically confirmed patients.
  - reference: PMID:32402279
    reference_title: "Systemic Type I IFN Inflammation in Human ISG15 Deficiency Leads to Necrotizing Skin Lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the age of one year, P5 presented ulcers of the inguinal region and vulva.
    explanation: >-
      Gives the early-childhood onset and characteristic distribution of the ulceration.
  - reference: PMID:38115997
    reference_title: "Case Report: ISG15 deficiency caused by novel variants in two families and effective treatment with Janus kinase inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this report, we describe novel variants found in two different families that result
      in complete ISG15 deficiency and severe skin ulceration.
    explanation: >-
      Independent replication of severe skin ulceration in two further ISG15-deficient
      families.
- category: Neurologic
  name: Basal ganglia calcification
  description: >
    Calcification of the cerebral basal ganglia, the radiological sign shared with
    Aicardi-Goutieres syndrome and spondyloenchondrodysplasia, and in one kindred the
    finding that led to the genetic diagnosis under a working label of idiopathic basal
    ganglia calcification. It is not a consequence of cerebral infection: CT scanning of the
    Turkish and Iranian patients ascertained through mycobacterial disease found the same
    calcification. Calcification along the cerebral falx has also been reported. It is
    detectable in infancy - the youngest reported patient had basal ganglia calcification at
    four months of age. It is not universal: in one reported family the affected siblings
    had seizures and developmental delay with no calcification on imaging, and remain under
    neuroimaging surveillance, so a normal early scan does not exclude the diagnosis.
  phenotype_term:
    preferred_term: Basal ganglia calcification
    term:
      id: HP:0002135
      label: Basal ganglia calcification
  evidence:
  - reference: PMID:25307056
    reference_title: "Human intracellular ISG15 prevents interferon-α/β over-amplification and auto-inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that P1 and P2 displayed calcification of the basal ganglia, with CT imaging
      in P3 also showing calcification along the cerebral falx
    explanation: >-
      Documents basal ganglia calcification in the patients originally ascertained through
      mycobacterial disease, establishing it as a feature of the disease rather than of one
      kindred.
  - reference: PMID:25307056
    reference_title: "Human intracellular ISG15 prevents interferon-α/β over-amplification and auto-inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings strongly suggest that the three ISG15 alleles identified are
      disease-causing, not only for MSMD, but also for IBGC, an intracranial calcification
      phenotype unrelated to any obvious cerebral infection.
    explanation: >-
      States that the calcification is caused by the ISG15 genotype and is not secondary to
      infection.
  - reference: PMID:40318816
    reference_title: "A novel homozygous ISG15 missense variant leads to severe inflammatory skin lesions, interstitial pneumonia, and basal ganglia calcifications in a Chinese infant with ISG15 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report a 4-month-old Chinese patient presenting with inflammatory skin
      lesions, interstitial pneumonia, and basal ganglia calcifications.
    explanation: >-
      Establishes that the calcification is already present in infancy, the pediatric timing
      recorded in this phenotype's description.
  - reference: PMID:38115997
    reference_title: "Case Report: ISG15 deficiency caused by novel variants in two families and effective treatment with Janus kinase inhibition."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, affected individuals in family B exhibited mild developmental delay and
      seizures, without evidence of cerebral inflammation or calcification; ongoing
      neuroimaging surveillance is underway.
    explanation: >-
      Two affected siblings had the neurological features without calcification on imaging,
      which refutes treating calcification as an obligate finding and is why the description
      says a normal early scan does not exclude the diagnosis.
- category: Neurologic
  name: Developmental delay
  description: >
    Global developmental delay has been reported in both affected siblings of one family,
    described as mild, alongside seizures. Psychomotor delay is characteristic of the type I
    interferonopathies as a class, and in this disease it belongs to the interferon arm
    rather than to mycobacterial infection. Reported in a small number of patients; the
    founding cohorts did not report it, so no frequency is recorded and the entry does not
    claim it is typical.
  phenotype_term:

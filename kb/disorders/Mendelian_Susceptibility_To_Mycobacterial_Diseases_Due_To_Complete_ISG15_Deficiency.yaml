    causal_link_type: DIRECT
    description: >-
      Loss of the USP18 brake leaves type I interferon signalling inadequately attenuated.
    evidence:
    - reference: PMID:25307056
      reference_title: "Human intracellular ISG15 prevents interferon-α/β over-amplification and auto-inflammation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        an absence of intracellular ISG15 in the patients' cells prevents the accumulation
        of USP18, a potent negative regulator of IFN-α/β signalling, resulting in the
        enhancement and amplification of IFN-α/β responses
      explanation: >-
        States the causal step from failed USP18 accumulation to amplified type I interferon
        responses.
  evidence:

      co-expression of ISG15
    explanation: >-
      Identifies the molecular interaction ISG15 blocks - SKP2 engagement of USP18 - which
      is the degradation route this node names.
  - reference: PMID:25307056
    reference_title: "Human intracellular ISG15 prevents interferon-α/β over-amplification and auto-inflammation."

classifications:
  iuis_category:
    classification_value: innate immunity defect
    notes: >-
      IUIS phenotypic classification of inborn errors of immunity, Mendelian susceptibility
      to mycobacterial disease (MSMD) table. ISG15 is one of the established MSMD genes.
      The type I interferonopathy features this entry also carries are an autoinflammatory
      phenotype of the same defect and do not move the IUIS assignment.
    evidence:
    - reference: PMID:38025345
      reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mendelian susceptibility to mycobacterial diseases (MSMD) is the most characterized
        of these IEIs, with 36 different disorders found in 20 distinct genes (IFNGR1,
        IFNGR2, IFNG, IL12RB1, IL12RB2, IL23R, IL12B, ISG15, USP18, ZNFX1, TBX21, STAT1,
        TYK2, IRF8, IRF1, CYBB, JAK1, RORC, NEMO, and SPPL2A)
      explanation: >-
        Places ISG15 in the established gene set of Mendelian susceptibility to
        mycobacterial disease, the inborn-error-of-immunity syndrome under which this entry
        is classified.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    No population rate has been established. The disease was described in 2012 in three
    patients from two consanguineous kindreds (Turkey, Iran), extended in 2015 by Chinese
    siblings ascertained through intracranial calcification, and by 2023 a review of the
    published literature put the total at fewer than 100 cases worldwide. Recorded as a
    literature case count rather than a rate.
  evidence:
  - reference: PMID:38115997
    reference_title: "Case Report: ISG15 deficiency caused by novel variants in two families and effective treatment with Janus kinase inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ISG15 deficiency remains an extremely rare disease, with fewer than 100 cases
      reported worldwide.
    explanation: >-
      Gives the published case count that is the basis for recording occurrence as a
      literature case count rather than a population rate.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Burden comes from both arms. The mycobacterial arm produces BCG disease in infancy
    requiring prolonged multidrug chemotherapy; the interferon arm produces recurrent deep
    necrotising skin ulceration that is steroid-refractory, and seizures that were fatal in
    one of the six patients in the founding interferonopathy cohort. Against that, the MSMD
    component is relatively mild compared with IFN-gamma receptor deficiency, and JAK
    inhibition produces rapid resolution of the inflammatory features in the cases reported
    so far, so the burden is high but not uniformly lethal.
  evidence:
  - reference: PMID:25307056
    reference_title: "Human intracellular ISG15 prevents interferon-α/β over-amplification and auto-inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three of the six ISG15-deficient individuals experienced epileptic seizures, which
      were lethal in one case.
    explanation: >-
      Records death from seizures in the interferonopathy arm, the most severe outcome
      documented and the main driver of the HIGH burden assessment.
  - reference: PMID:32402279
    reference_title: "Systemic Type I IFN Inflammation in Human ISG15 Deficiency Leads to Necrotizing Skin Lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The lesions were largely resistant to steroid treatment, and were recurrent and
      necrotizing, but they resolved spontaneously, leaving post-inflammatory
      hyperpigmentation.
    explanation: >-
      Documents the recurrent, steroid-refractory necrotising skin disease that is the main
      chronic morbidity of the inflammatory arm.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Disease requires biallelic loss-of-function ISG15 variants. Reported patients are
    homozygous (nonsense, frameshift, whole-gene deletion, or a functionally null missense
    allele) or compound heterozygous for a point variant and a contiguous microdeletion;
    parents are healthy heterozygotes and consanguinity is common in the reported kindreds.
    Expressivity within a family is wide: two siblings homozygous for the same novel null
    allele presented differently, one with skin lesions and the other with intracranial
    calcification and recurrent pneumonia, so a sibling's presentation does not predict the
    proband's.
  evidence:
  - reference: PMID:22859821
    reference_title: "Mycobacterial disease and impaired IFN-γ immunity in humans with inherited ISG15 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In both families, the segregation of the ISG15 mutant alleles was consistent with
      autosomal recessive MSMD.
    explanation: >-
      Establishes autosomal recessive segregation of the causal ISG15 alleles in the
      founding MSMD kindreds.
  - reference: PMID:25307056
    reference_title: "Human intracellular ISG15 prevents interferon-α/β over-amplification and auto-inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Familial segregation was consistent with an autosomal recessive mode of inheritance
    explanation: >-
      Confirms the same recessive mode in the independently ascertained kindred that
      presented with intracranial calcification rather than mycobacterial disease.
  - reference: PMID:37984483
    reference_title: "A novel homozygous Y140X mutation of ISG15 causes diverse type I interferonopathies in sibling patients with cutaneous lesions or recurrent parenchymal pneumonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report two sibling patients harboring the same novel ISG15 mutation showing diverse
      clinical features
    explanation: >-
      Documents divergent presentations between siblings carrying the same homozygous allele,
      the basis for the wide-expressivity sentence in this description.
genetic:
- name: ISG15
  gene_term:
    preferred_term: ISG15
    term:
      id: hgnc:4053
      label: ISG15
  association: CAUSATIVE
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >
    ISG15 encodes a small ubiquitin-like protein induced by type I interferon. Disease
    alleles are biallelic and abolish protein function: the founding MSMD kindreds carried
    a homozygous nonsense variant in exon 2 and a homozygous frameshift insertion, the
    calcification kindred a homozygous nonsense variant, and later families a whole-gene
    deletion, a point variant in trans with a 1p36.33 microdeletion, and a homozygous
    missense allele that leaves protein expressed but functionally null. Patient cells show
    no detectable ISG15 protein and no interferon-inducible ISGylation, while ISG15 mRNA
    induction and ISGF3 binding are normal, so the truncating alleles act by loss of the
    protein rather than by a signalling defect upstream of it.
  evidence:
  - reference: PMID:22859821
    reference_title: "Mycobacterial disease and impaired IFN-γ immunity in humans with inherited ISG15 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data suggest that the two mutant ISG15 alleles are loss-of-expression.
    explanation: >-
      Establishes the founding causal alleles as loss-of-expression, the molecular basis of
      complete deficiency.
  - reference: PMID:22859821
    reference_title: "Mycobacterial disease and impaired IFN-γ immunity in humans with inherited ISG15 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Fibroblasts from P1 and P2 lacked detectable IFN-β-inducible ISGylation
    explanation: >-
      Demonstrates the functional consequence of the alleles in patient fibroblasts: no
      interferon-inducible protein ISGylation.
  - reference: PMID:38115997
    reference_title: "Case Report: ISG15 deficiency caused by novel variants in two families and effective treatment with Janus kinase inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the second family, a homozygous total ISG15 gene deletion was detected in two
      siblings.
    explanation: >-
      Documents whole-gene deletion as one of the allele classes producing complete
      deficiency.
  - reference: PMID:40318816
    reference_title: "A novel homozygous ISG15 missense variant leads to severe inflammatory skin lesions, interstitial pneumonia, and basal ganglia calcifications in a Chinese infant with ISG15 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Functional analysis revealed that this variant impaired ISGylation and disrupted the
      stabilization of USP18, leading to defective negative regulation of IFN-I signaling
      and consequent excessive IFN-I production.
    explanation: >-
      Shows that a missense allele can be functionally null for both ISG15 activities, so
      the mutational spectrum is not restricted to truncating variants.
pathophysiology:
- name: ISG15 Loss of Function
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  description: >
    The initiating lesion is biallelic loss of function of ISG15. Because the protein is
    absent (or, for the reported missense allele, functionally inert), both of its
    activities are lost simultaneously: its secreted, cytokine-like activity outside the
    cell and its stabilising interaction with USP18 inside it. Interferon-driven
    transcription of the gene is intact, so the defect is at the level of the protein.
  genes:
  - preferred_term: ISG15
    term:
      id: hgnc:4053
      label: ISG15
  biological_processes:
  - preferred_term: ISG15-protein conjugation
    term:
      id: GO:0032020
      label: ISG15-protein conjugation
    modifier: DECREASED
  downstream:
  - target: Absent Extracellular ISG15 Release by Leukocytes
    causal_link_type: DIRECT
    description: >-
      With no ISG15 protein, mycobacteria-triggered secretion of free ISG15 does not occur.
    evidence:
    - reference: PMID:22859821
      reference_title: "Mycobacterial disease and impaired IFN-γ immunity in humans with inherited ISG15 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        ISG15 was not detectable in P1 leukocytes and supernatants, in any of the conditions
        tested.
      explanation: >-
        Shows directly that the loss-of-expression genotype abolishes both intracellular and
        secreted ISG15 in patient leukocytes.
  - target: Loss of Free Intracellular ISG15
    causal_link_type: DIRECT
    description: >-
      The same null genotype removes the intracellular pool of free ISG15 that binds and
      protects USP18.
    evidence:
    - reference: PMID:25307056
      reference_title: "Human intracellular ISG15 prevents interferon-α/β over-amplification and auto-inflammation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The c.163C>T/163C>T mutant allele showed no ISG15 protein on western blots
      explanation: >-
        Confirms absence of the intracellular ISG15 protein in the kindred ascertained
        through the interferonopathy arm.
  evidence:
  - reference: PMID:38115997
    reference_title: "Case Report: ISG15 deficiency caused by novel variants in two families and effective treatment with Janus kinase inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ISG15 protein plays a dual role in both the type I and II interferon (IFN) immune
      pathways.
    explanation: >-
      States the dual function of the protein that makes a single null lesion produce two
      mechanistically separate downstream arms.
- name: Absent Extracellular ISG15 Release by Leukocytes
  biological_scale: CELLULAR
  description: >
    In healthy donors, contact with mycobacteria triggers leukocytes to release free ISG15
    into the extracellular space, with granulocytes the dominant source; the stimulus is
    specific, since lipopolysaccharide and type I interferon do not trigger release.
    Patients secrete none. This is the arm that fails in the infectious presentation.
  cell_types:
  - preferred_term: granulocyte
    term:
      id: CL:0000094
      label: granulocyte
  downstream:
  - target: Impaired ISG15-Dependent IFN-gamma Production by NK and T Cells
    causal_link_type: DIRECT
    description: >-
      Free extracellular ISG15 is the signal that drives IFN-gamma secretion by NK and T
      cells, so its absence removes that induction.
    evidence:
    - reference: PMID:22859821
      reference_title: "Mycobacterial disease and impaired IFN-γ immunity in humans with inherited ISG15 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        ISG15 blockade markedly decreased IFN-γ secretion.
      explanation: >-
        Blocking extracellular ISG15 in healthy donor blood reproduces the patients'
        IFN-gamma defect, establishing the direction of this edge independently of genotype.
  evidence:
  - reference: PMID:22859821
    reference_title: "Mycobacterial disease and impaired IFN-γ immunity in humans with inherited ISG15 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      BCG induced the release of ISG15 into the supernatants of control leukocytes, with a
      concomitant decrease in the amount of intracellular ISG15.
    explanation: >-
      Establishes mycobacteria-triggered secretion of ISG15 by normal leukocytes, the event
      that does not happen in patients.
  - reference: PMID:22859821
    reference_title: "Mycobacterial disease and impaired IFN-γ immunity in humans with inherited ISG15 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These experiments suggest that many cell types can secrete ISG15 and that
      granulocytes, via their secretory pathway, are a major source of extracellular ISG15
      during phagocytosis.
    explanation: >-
      Identifies granulocytes as the principal cellular source, which is why this node binds
      that cell type.
- name: Impaired ISG15-Dependent IFN-gamma Production by NK and T Cells
  biological_scale: CELLULAR
  description: >
    NK cells are the key ISG15-responsive population, with T cells contributing. Without
    extracellular ISG15 these cells produce only small amounts of IFN-gamma on mycobacterial
    challenge - impaired but not abolished, the same quantitative picture as IL-12p40 and
    IL-12Rbeta1 deficiency and the reason the MSMD is relatively mild. Adding recombinant
    ISG15 back to patient blood restores IFN-gamma nearly to normal. The receptor is the
    LFA-1 integrin (CD11a/CD18): ISG15 binds the CD11a alphaI domain, and engagement drives
    SRC-family kinase activation and cytokine release, so what the deficiency removes is a
    defined outside-in signal rather than an unspecified soluble factor.
  biological_processes:
  - preferred_term: type II interferon (IFN-gamma) production
    term:
      id: GO:0032609
      label: type II interferon production
    modifier: DECREASED
  cell_types:
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  downstream:
  - target: Failed IFN-gamma-Dependent Macrophage Activation
    causal_link_type: DIRECT
    description: >-
      Insufficient IFN-gamma fails to deliver the macrophage-activating signal required to
      kill intracellular mycobacteria.
    evidence:
    - reference: PMID:22859821
      reference_title: "Mycobacterial disease and impaired IFN-γ immunity in humans with inherited ISG15 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the lack of mycobacterium-induced ISG15 secretion by leukocytes-granulocyte, in
        particular-reduced the production of IFN-γ by lymphocytes, including natural killer
        cells, probably accounting for the enhanced susceptibility to mycobacterial disease
      explanation: >-
        States the authors' causal reading of the chain from absent ISG15 secretion through
        reduced IFN-gamma to mycobacterial susceptibility.
  evidence:
  - reference: PMID:22859821
    reference_title: "Mycobacterial disease and impaired IFN-γ immunity in humans with inherited ISG15 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole blood leukocytes from P1, P2 and P3, like those from IL-12p40- and
      IL-12Rβ1-deficient patients, produced only small amounts of IFN-γ when stimulated with
      BCG or BCG and IL-12.
    explanation: >-
      Quantifies the IFN-gamma defect in patients and places it alongside the two
      cytokine-production MSMD etiologies it most resembles.
  - reference: PMID:22859821
    reference_title: "Mycobacterial disease and impaired IFN-γ immunity in humans with inherited ISG15 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      NK cells were the key ISG15-responsive leukocytes, in terms of IFN-γ induction
    explanation: >-
      Identifies the responding cell type bound on this node.
  - reference: PMID:22859821
    reference_title: "Mycobacterial disease and impaired IFN-γ immunity in humans with inherited ISG15 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The addition of recombinant human ISG15 restored IFN-γ concentrations to almost normal
      levels
    explanation: >-
      Add-back rescue shows the IFN-gamma defect is downstream of, and dependent on, the
      missing ISG15 signal rather than an independent lymphocyte defect.
  - reference: PMID:29100055
    reference_title: "Extracellular ISG15 Signals Cytokine Secretion through the LFA-1 Integrin Receptor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We have established an NK-92 cell-based assay for IFN-γ release, identified residues
      critical for ISG15 signaling, and identified the cell surface receptor as LFA-1
      (CD11a/CD18; αLβ2 integrin).
    explanation: >-
      Identifies the receptor through which extracellular ISG15 induces IFN-gamma, which is
      the signalling step this node loses.
  - reference: PMID:29100055
    reference_title: "Extracellular ISG15 Signals Cytokine Secretion through the LFA-1 Integrin Receptor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      LFA-1 inhibition blocked IFN-γ secretion, splenocytes from CD11a-/- mice did not
      respond to ISG15, and ISG15 bound directly to the αI domain of CD11a in vitro.
    explanation: >-
      Loss-of-function, binding and genetic evidence that the ISG15-to-IFN-gamma step runs
      through LFA-1, supporting the receptor claim in this node's description.
- name: Failed IFN-gamma-Dependent Macrophage Activation
  biological_scale: CELLULAR
  description: >
    IFN-gamma licenses macrophages to kill the intracellular mycobacteria they harbour.
    With IFN-gamma output insufficient, infected macrophages are not activated. This is the
    convergent final mechanism of MSMD, reached here through a failure of cytokine
    production rather than of the response to IFN-gamma.
  biological_processes:
  - preferred_term: macrophage activation
    term:
      id: GO:0042116
      label: macrophage activation
    modifier: DECREASED
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: Uncontrolled Replication of Weakly Virulent Mycobacteria
    causal_link_type: DIRECT
    description: >-
      Without macrophage activation the intracellular organisms are not killed and
      replicate.
  evidence:
  - reference: PMID:38025345
    reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      almost all genetic etiologies of MSMD alter the interferon-gamma (IFN-γ)- mediated
      immunity by impairing or abolishing IFN-γ production or the response to this cytokine.
    explanation: >-
      Establishes impaired IFN-gamma-mediated immunity as the convergent mechanism of MSMD,
      which is what fails at this node.
- name: Uncontrolled Replication of Weakly Virulent Mycobacteria
  biological_scale: ORGANISM
  description: >
    The organism-level consequence is disease caused by mycobacteria that an intact
    IFN-gamma response would contain: above all the BCG vaccine strain, and environmental
    non-tuberculous mycobacteria. This node initiates the infectious phenotypes.
  downstream:
  - target: BCG disease
  - target: Non-tuberculous mycobacterial infection
  evidence:
  - reference: ORPHA:319563
    reference_title: "Mendelian susceptibility to mycobacterial diseases due to complete ISG15 deficiency"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mendelian susceptibility to mycobacterial diseases (MSMD) due to complete ISG15
      deficiency is a genetic variant of MSMD characterized by Bacille Calmette-Guérin (BCG)
      infections.
    explanation: >-
      Orphanet's definition of the disease names BCG infection as its characteristic
      manifestation, the clinical expression of this node.
- name: Loss of Free Intracellular ISG15
  biological_scale: MOLECULAR
  description: >
    The second arm begins with the absence of the intracellular pool of free (unconjugated)
    ISG15. This activity is conjugation-independent: transducing patient cells with an
    ISG15 mutant that cannot be conjugated to substrates rescues the phenotype as well as
    wild-type ISG15 does, and silencing the ISGylation enzymes does not reproduce it. The
    disease-relevant intracellular function of ISG15 in humans is therefore not ISGylation.
  downstream:
  - target: Accelerated Ubiquitin-Dependent USP18 Degradation
    causal_link_type: DIRECT
    description: >-
      Free ISG15 binds USP18 and antagonises its ubiquitination; without ISG15, USP18 is
      degraded rapidly.
    evidence:
    - reference: PMID:25307056
      reference_title: "Human intracellular ISG15 prevents interferon-α/β over-amplification and auto-inflammation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In cells lacking ISG15, unlike control cells, USP18 levels began to decline after as
        little as one hour of cycloheximide (CHX) treatment
      explanation: >-
        Directly measures accelerated USP18 decay in ISG15-deficient cells, which is this
        causal step.
  evidence:
  - reference: PMID:25307056
    reference_title: "Human intracellular ISG15 prevents interferon-α/β over-amplification and auto-inflammation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ISG15 appeared to act in its unconjugated free form, since silencing of UBE1L or of
      other ISGylation enzymes failed to reduce USP18 levels
    explanation: >-
      Establishes that the relevant species is free, unconjugated ISG15, not an ISGylated
      substrate - the claim this node makes.
- name: Accelerated Ubiquitin-Dependent USP18 Degradation
  biological_scale: MOLECULAR
  description: >
    USP18 is itself an interferon-stimulated gene and the principal negative regulator of
    type I interferon signalling. Free ISG15 binds USP18 and prevents assembly of the
    USP18-SKP2 complex, antagonising its ubiquitination and proteolysis. Without ISG15,
    USP18 protein falls even though USP18 mRNA is elevated - a protein-level brake failure
    in the face of an up-regulated transcript.
  biological_processes:
  - preferred_term: ubiquitin-dependent proteolysis of USP18
    term:
      id: GO:0006511
      label: ubiquitin-dependent protein catabolic process
    modifier: INCREASED
  downstream:

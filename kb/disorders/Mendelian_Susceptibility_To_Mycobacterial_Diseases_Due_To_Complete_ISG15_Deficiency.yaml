- name: Sustained Type I Interferon Signalling and ISG Over-Amplification
  biological_scale: CELLULAR
  conforms_to: "jak_stat_pathway_activation#Sustained STAT-Driven Target-Gene Transcription"
  description: >
    With the USP18 brake degraded, STAT1 and STAT2 remain phosphorylated for longer than in
    control cells and the interferon-stimulated gene program is amplified rather than
    self-limiting. Patient blood carries a raised interferon signature across the same genes
    used to score Aicardi-Goutieres syndrome, and in peripheral blood the myeloid
    compartment shows the strongest signature. The disorder-specific output program at this
    node is therefore an interferon-stimulated gene signature.
  biological_processes:
  - preferred_term: type I interferon-mediated signaling pathway
    term:
      id: GO:0060337
      label: type I interferon-mediated signaling pathway
    modifier: INCREASED
  - preferred_term: negative regulation of type I interferon-mediated signaling pathway
    term:
      id: GO:0060339
      label: negative regulation of type I interferon-mediated signaling pathway
    modifier: DECREASED

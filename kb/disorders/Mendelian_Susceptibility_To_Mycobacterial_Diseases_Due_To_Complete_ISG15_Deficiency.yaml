    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the affected skin, IFN-I signaling is observed in the keratinocytes of the
      epidermis, endothelia, and the monocytes and macrophages of the dermis.
    explanation: >-
      Localises interferon signalling to specific cell types in affected tissue, grounding

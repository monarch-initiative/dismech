      reference_title: "ISG15 deficiency and increased viral resistance in humans but not mice."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        fibroblasts derived from ISG15-deficient patients display enhanced antiviral
        protection, and expression of ISG15 attenuates viral resistance to WT control levels
      explanation: >-
        Shows the enhanced antiviral state and its reversal by ISG15 re-expression, which
        ties it to this node rather than to an unrelated property of the cells.
  evidence:
  - reference: PMID:25307056
    reference_title: "Human intracellular ISG15 prevents interferon-α/β over-amplification and auto-inflammation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      in patients’ cells, STAT1 and STAT2 were more persistently phosphorylated
    explanation: >-
      The direct signalling readout of this node: prolonged STAT1/STAT2 phosphorylation in
      patient cells.
  - reference: PMID:25307056
    reference_title: "Human intracellular ISG15 prevents interferon-α/β over-amplification and auto-inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all ISG15-deficient patients, like patients with AGS, had significantly higher levels

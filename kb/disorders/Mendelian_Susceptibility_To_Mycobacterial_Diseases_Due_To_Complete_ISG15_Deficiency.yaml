      The amplified interferon response drives the inflammatory and neurological features,
      as in the other Mendelian type I interferonopathies.
    evidence:
    - reference: PMID:25307056
      reference_title: "Human intracellular ISG15 prevents interferon-α/β over-amplification and auto-inflammation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In the absence of ISG15, USP18 proteolysis is more rapid, driving the dysregulated
        IFN-α/β response and resulting in both the blood IFN-α/β signature and brain
        calcifications seen in the patients.
      explanation: >-
        States the causal link from the dysregulated interferon response to the clinical
        tissue phenotype.
  - target: Enhanced Cellular Antiviral Resistance
    causal_link_type: DIRECT
    description: >-
      The same sustained interferon-stimulated gene program leaves patient cells better
      protected against virus than control cells.
    evidence:

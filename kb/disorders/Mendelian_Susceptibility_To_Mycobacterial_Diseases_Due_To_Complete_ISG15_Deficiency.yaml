    snippet: >-
      These patients also had autoantibody levels higher than those in age-matched controls
    explanation: >-
      Direct observation of raised autoantibody levels in the patient cohort.
- category: Laboratory
  name: Reduced mycobacteria-induced IFN-gamma production
  description: >
    Whole-blood IFN-gamma output after BCG stimulation is low, and the deficit is corrected
    by adding recombinant ISG15. This is the functional assay that localises the lesion to
    the IFN-gamma production arm and distinguishes it from a defect in the response to
    IFN-gamma.
  phenotype_term:
    preferred_term: Reduced IFN-gamma production on mycobacterial stimulation
    term:
      id: HP:0033253
      label: Reduced circulating interferon gamma concentration
  notes: >-
    Concept-fit caveat: HP:0033253 names a reduced circulating IFN-gamma concentration,
    whereas the cited measurement is reduced IFN-gamma production by BCG-stimulated whole
    blood ex vivo. The binding is the closest available HP term and preferred_term carries
    the specific assay reading; the term is broader than the assay rather than a different
    claim.
  evidence:
  - reference: PMID:22859821
    reference_title: "Mycobacterial disease and impaired IFN-γ immunity in humans with inherited ISG15 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole blood leukocytes from P1, P2 and P3, like those from IL-12p40- and
      IL-12Rβ1-deficient patients, produced only small amounts of IFN-γ when stimulated with
      BCG or BCG and IL-12.
    explanation: >-
      The measurement behind this laboratory phenotype.
  reports_on:
  - target: Impaired ISG15-Dependent IFN-gamma Production by NK and T Cells
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      The assay measurement of that node. Recorded as an observational readout rather than a
      causal edge, because deficient IFN-gamma production is the node being measured, not
      something the node causes.
- category: Laboratory
  name: Elevated type I interferon signature
  description: >
    Peripheral blood carries a raised interferon-stimulated gene signature, measured across
    the same gene set used to score Aicardi-Goutieres syndrome, and two patients had
    detectable IFN-alpha antiviral activity in plasma. This is the laboratory counterpart of
    the interferon arm.
  phenotype_term:
    preferred_term: Increased circulating interferon-alpha
    term:
      id: HP:0034513
      label: Increased circulating Interferon-alpha concentration
  notes: >-
    The bound HP term names a circulating IFN-alpha concentration, which is what the plasma
    antiviral-activity measurement reports. The interferon-stimulated gene signature that
    dominates the literature on this disease is a transcript score rather than a cytokine
    concentration, and HPO has no term for it; preferred_term and the description carry the
    distinction.
  evidence:
  - reference: PMID:25307056
    reference_title: "Human intracellular ISG15 prevents interferon-α/β over-amplification and auto-inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The two Chinese patients who displayed seizures (P5 and P6) also had detectable IFN-α
      antiviral activity in their plasma
    explanation: >-
      The circulating IFN-alpha measurement that the bound HP term names.
  - reference: PMID:25307056
    reference_title: "Human intracellular ISG15 prevents interferon-α/β over-amplification and auto-inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all ISG15-deficient patients, like patients with AGS, had significantly higher levels
      of interferon-stimulated gene messenger RNA than unaffected relatives or healthy
      controls
    explanation: >-
      The interferon-stimulated gene signature, the transcript-level reading described

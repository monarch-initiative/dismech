name: Mendelian Susceptibility To Mycobacterial Diseases Due To Complete ISG15 Deficiency
creation_date: "2026-09-23T00:00:00Z"
category: Mendelian
synonyms:
- MSMD due to complete ISG15 deficiency
- ISG15 deficiency
- ISG15 deficiency, autosomal recessive
- Immunodeficiency 38
- IMD38
- Immunodeficiency 38 with basal ganglia calcification
description: >
  Mendelian susceptibility to mycobacterial disease (MSMD) due to complete ISG15
  deficiency is an autosomal recessive inborn error of immunity caused by biallelic
  loss-of-function variants in ISG15. It is unusual among the MSMD etiologies in carrying
  two mechanistically separate disease arms from one lesion, because ISG15 has two
  functions in two different compartments and the deficiency abolishes both at once.

  Extracellularly, free ISG15 is released by leukocytes - granulocytes in particular - on
  contact with mycobacteria and acts as an IFN-gamma-inducing cytokine on NK and T cells.
  Without it, IFN-gamma output after mycobacterial challenge is low, IFN-gamma-dependent
  macrophage activation fails, and weakly virulent mycobacteria replicate unchecked. That
  is the MSMD arm, and in BCG-vaccinating countries it presents in infancy as disease
  caused by the vaccine strain.

  Intracellularly, free ISG15 binds USP18 and protects it from SKP2-dependent
  ubiquitination and proteolysis. USP18 is the principal negative regulator of type I
  interferon signalling, so without ISG15 the brake is degraded, STAT1 and STAT2 stay
  phosphorylated, and interferon-stimulated genes are over-amplified. That is the type I
  interferonopathy arm: basal ganglia calcification, seizures, recurrent necrotising skin
  ulceration, and in some patients interstitial lung disease, a picture resembling
  Aicardi-Goutieres syndrome and spondyloenchondrodysplasia. Which arm a given child
  presents with depends substantially on whether they were BCG-vaccinated: an unvaccinated
  Chinese kindred came to attention through intracranial calcification and seizures alone,
  while the Turkish and Iranian MSMD patients turned out on CT to have the same
  calcification.

  The species contrast is a caution against reading mouse data across. Isg15-null mice are
  susceptible to several viruses; ISG15-deficient humans are not, and their fibroblasts are
  in fact more resistant to virus than controls, because the sustained interferon response
  that makes them ill also leaves their cells antivirally primed. Treatment splits along
  the same seam as the mechanism: antimycobacterial chemotherapy for the infectious arm,
  and JAK inhibition for the interferon-driven inflammatory arm.
disease_term:
  preferred_term: Mendelian susceptibility to mycobacterial diseases due to complete ISG15 deficiency
  term:
    id: MONDO:0014502
    label: Mendelian susceptibility to mycobacterial diseases due to complete ISG15 deficiency
parents:
- Primary immunodeficiency
- Mendelian susceptibility to mycobacterial disease
- Type I interferonopathy
notes: >-
  Lump/split. This entry is kept as a single disease covering both the mycobacterial and
  the type I interferonopathy presentations, rather than split into an MSMD entry and an
  interferonopathy entry, because both arise from the same biallelic ISG15 null genotype
  and the two presentations occur in the same individuals: CT scanning of the Turkish and
  Iranian MSMD patients found the same basal ganglia calcification that had brought the
  unvaccinated Chinese siblings to attention. The presentation split tracks BCG exposure
  rather than genotype. MONDO's own label names only the MSMD arm; the entry keeps that
  label on `disease_term` while the description and pathophysiology carry both arms.

  No GeneReviews chapter exists for ISG15 deficiency. PubMed `ISG15[TI] AND
  genereviews[book]` and the MSMD-titled equivalent both return zero records, so there is
  no expert-curated phenotype baseline for this entry and the phenotype list is assembled
  from the primary case series instead.

  Orphanet's definition of ORPHA:319563 names only BCG infection and does not mention the
  interferonopathy features, which post-date it. It is cited here for disease identity and
  the MONDO/OMIM cross-references rather than for the clinical spectrum.

  ClinGen has no gene-disease validity assertion for ISG15. The full Gene-Disease Validity
  table downloaded from `search.clinicalgenome.org/kb/gene-validity/download` (file created
  2026-09-23, 3,676 assertions) contains no ISG15 row, although it does carry other MSMD
  genes such as STAT1, so no `CGGV:` evidence is cited here.

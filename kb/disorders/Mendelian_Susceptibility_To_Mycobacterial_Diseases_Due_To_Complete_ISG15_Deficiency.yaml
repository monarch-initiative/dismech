    explanation: >-
      Establishes the interferon-stimulated gene signature in patients, the
      disorder-specific output program named at this node.
  - reference: PMID:32402279
    reference_title: "Systemic Type I IFN Inflammation in Human ISG15 Deficiency Leads to Necrotizing Skin Lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In peripheral blood, myeloid cells display the most robust IFN-I signatures.
    explanation: >-
      Identifies the blood compartment carrying the strongest signature, which is why this
      node binds the monocyte cell type.
- name: Enhanced Cellular Antiviral Resistance
  biological_scale: CELLULAR
  role: compensation
  description: >
    A consequence of the same amplified interferon program, and the reason the deficiency
    does not behave as a classical antiviral immunodeficiency in humans. Patients have no
    unusual susceptibility to viruses in vivo, and their fibroblasts are more resistant to
    virus than control cells. This is the point at which the mouse model diverges from the
    human disease.
  evidence:
  - reference: PMID:27193971
    reference_title: "ISG15 deficiency and increased viral resistance in humans but not mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe ISG15-deficient patients who display no enhanced susceptibility to
      viruses in vivo, in stark contrast to Isg15-deficient mice.
    explanation: >-
      Establishes the absence of a clinical antiviral phenotype in patients, which this node
      records.
- name: Type I Interferon-Driven Tissue Inflammation
  biological_scale: TISSUE
  description: >
    The amplified interferon response is expressed in tissue as inflammation. In affected
    skin, interferon signalling is seen in epidermal keratinocytes, in endothelium, and in
    dermal monocytes and macrophages - the cellular basis of the recurrent necrotising
    ulceration. In the central nervous system the counterpart is the intracranial
    calcification shared with Aicardi-Goutieres syndrome and spondyloenchondrodysplasia.
    This node initiates the inflammatory and neurological phenotypes.
  cell_types:

diagnosis:
- name: ISG15 sequencing
  description: >
    Molecular confirmation identifies the biallelic ISG15 genotype. Because the two
    presentations look like two different diseases - a pediatric infectious-disease problem
    and a pediatric neurology or dermatology problem - the genotype is often what unifies
    them, and exome sequencing made the connection both in the founding MSMD kindreds and in
    the kindred labelled idiopathic basal ganglia calcification. A normal-appearing protein
    does not exclude the diagnosis: one reported allele is missense and functionally null.
  evidence:
  - reference: PMID:25307056
    reference_title: "Human intracellular ISG15 prevents interferon-α/β over-amplification and auto-inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing (WES) of P5 and P6 and their healthy mother identified only one
      common nonsense homozygous mutation, which had not been reported in public databases
      or in in-house WES data for 1,500 other individuals
    explanation: >-
      Documents exome sequencing as the route to diagnosis in patients presenting without any
      infectious phenotype.
- name: Cranial CT for intracranial calcification
  description: >
    Non-contrast cranial CT detects the basal ganglia calcification. It is worth doing in a
    patient with an MSMD phenotype and an ISG15 genotype even without neurological symptoms:
    scanning the Turkish and Iranian patients, who had been followed for mycobacterial
    disease, is how the calcification was found in them.
  evidence:
  - reference: PMID:25307056
    reference_title: "Human intracellular ISG15 prevents interferon-α/β over-amplification and auto-inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Following the identification of ISG15 mutations in Chinese children with a putative
      diagnosis of IBGC, we performed computed tomography (CT) scans on the Iranian and
      Turkish ISG15-deficient MSMD patients.
    explanation: >-
      Describes the imaging step that revealed calcification in patients who had been managed
      for mycobacterial disease alone.
treatments:
- name: Antimycobacterial Therapy
  description: >
    Multidrug antimycobacterial chemotherapy treats the mycobacterial disease itself and is
    required regardless of the underlying immune defect. Regimen composition follows species
    identification and susceptibility testing; this entry does not assert a specific regimen
    or duration, because none has been established for this etiology separately from MSMD
    management generally.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: multidrug antimycobacterial chemotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: antitubercular agent
      term:
        id: NCIT:C280
        label: Antitubercular Agent
  target_mechanisms:
  - target: Uncontrolled Replication of Weakly Virulent Mycobacteria
    treatment_effect: INHIBITS
    description: >-
      Antimycobacterial drugs act on the organism, substituting pharmacological killing for
      the macrophage-mediated killing the host cannot perform.
  evidence:
  - reference: PMID:32402279
    reference_title: "Systemic Type I IFN Inflammation in Human ISG15 Deficiency Leads to Necrotizing Skin Lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      ISG15-deficient patients have been identified on the basis of several different
      presentations: a reaction to BCG vaccination, intermittent seizures, or, as in the
      patients described here, dermatological features.
    explanation: >-
      Establishes BCG reaction as one of the presentations of this disease, and so the
      indication for antimycobacterial treatment. Graded INDIRECT because the sentence states
      the indication rather than reporting the treatment or its effect.
- name: Janus Kinase Inhibition
  description: >
    Baricitinib blocks signalling downstream of the type I interferon receptor and so
    interrupts the arm of the disease that the ISG15 lesion drives by removing the USP18
    brake. It is the mechanistically targeted treatment for the inflammatory and
    neurological features and does not address the mycobacterial arm. Reported responses are
    rapid and, in one sibling, complete; reported dosing in these case reports is 2 mg
    orally twice daily with a tapering course of oral prednisolone. The evidence is at the
    level of individual case reports, not trials.

    A caveat carried over from the wider type I interferonopathy literature rather than from
    ISG15 deficiency itself: in Aicardi-Goutieres syndrome, intracranial calcification has
    been found at post-mortem to be extensive despite baricitinib started at two months of
    age and continued for over four years, which the authors attribute to poor CNS
    bioavailability. No comparable long-term neurological follow-up has been published for
    ISG15 deficiency, so whether early JAK inhibition protects the brain in this disease is
    unknown.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: baricitinib
      term:
        id: CHEBI:95341
        label: baricitinib
  target_mechanisms:
  - target: Sustained Type I Interferon Signalling and ISG Over-Amplification
    treatment_effect: INHIBITS
    description: >-
      JAK inhibition blocks signal transduction from the type I interferon receptor, so the
      amplified interferon-stimulated gene program is suppressed even though the USP18 brake
      remains absent.
    evidence:
    - reference: PMID:40318816
      reference_title: "A novel homozygous ISG15 missense variant leads to severe inflammatory skin lesions, interstitial pneumonia, and basal ganglia calcifications in a Chinese infant with ISG15 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Treatment with the Janus kinase (JAK) inhibitor baricitinib rapidly resolved the
        patient's clinical symptoms.
      explanation: >-
        Clinical response to JAK inhibition in a patient whose disease was shown to run
        through defective USP18 stabilisation and excess type I interferon signalling, the
        node this treatment targets.
  evidence:
  - reference: PMID:38115997
    reference_title: "Case Report: ISG15 deficiency caused by novel variants in two families and effective treatment with Janus kinase inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Finally, we demonstrate the complete and rapid resolution of clinical symptoms
      associated with ISG15 deficiency in one sibling from the second family following
      treatment with the Janus kinase (JAK) inhibitor baricitinib.
    explanation: >-
      The first report of JAK inhibition in ISG15 deficiency, documenting complete resolution
      of symptoms.
  - reference: PMID:38115997
    reference_title: "Case Report: ISG15 deficiency caused by novel variants in two families and effective treatment with Janus kinase inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient was subsequently initiated on oral prednisolone 1mg/kg/day tapered over
      8-10 weeks and the JAK inhibitor baricitinib (2mg orally twice daily).
    explanation: >-
      Records the reported regimen, the basis for the dosing sentence in this treatment's
      description.
  - reference: PMID:38381212
    reference_title: "Neuropathologic Impacts of JAK Inhibitor Treatment in Aicardi-Goutières Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      This study showed profound central nervous system (CNS) sequelae despite early
      initiation of treatment.
    explanation: >-
      The source of the CNS caveat in this treatment's description. Graded INDIRECT and
      flagged here because the patient had Aicardi-Goutieres syndrome, not ISG15 deficiency:
      it supports the caveat only by the class argument that JAK inhibition may not reach
      the brain in a type I interferonopathy, and no ISG15-specific neurological follow-up
      exists.
- name: Avoidance of BCG Vaccination
  description: >
    Live BCG vaccine is the commonest trigger of the mycobacterial arm, so it is
    contraindicated in an affected child and should be withheld from at-risk newborn
    siblings pending genetic testing. The pediatric timing problem is acute: in endemic
    countries BCG is given at or shortly after birth, months before any presentation that
    would prompt testing. The unvaccinated ISG15-deficient siblings have no mycobacterial
    phenotype, which is the clearest available evidence that withholding the exposure
    prevents that arm of the disease.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: avoidance of live BCG vaccination
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Uncontrolled Replication of Weakly Virulent Mycobacteria
    treatment_effect: INHIBITS
    description: >-
      Withholding the live vaccine removes the mycobacterial challenge that the
      IFN-gamma-deficient host cannot contain.
    evidence:
    - reference: PMID:25307056
      reference_title: "Human intracellular ISG15 prevents interferon-α/β over-amplification and auto-inflammation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The ISG15-deficient patients from China were not vaccinated with BCG at birth,
        consistent with their current lack of an MSMD phenotype.
      explanation: >-
        Unvaccinated patients with the same genotype have no mycobacterial disease, the
        observation supporting avoidance as effective against this node.
environmental:
- name: Bacille Calmette-Guerin (BCG) vaccination
  description: >
    Routine BCG immunisation is the sentinel environmental exposure in this disorder. The
    attenuated Mycobacterium bovis BCG strain is harmless to immunocompetent infants but
    causes regional or disseminated disease in a host that cannot mount an adequate
    ISG15-dependent IFN-gamma response. Whether a patient develops the mycobacterial arm of
    this disease at all is largely decided by this exposure.
  exposure_term:
    preferred_term: exposure to Bacille Calmette-Guerin vaccine
    term:
      id: ECTO:2000129
      label: exposure to vaccination
  influences_mechanisms:
  - target: Uncontrolled Replication of Weakly Virulent Mycobacteria
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The live BCG strain is the mycobacterial challenge that the IFN-gamma-deficient host
      cannot contain, initiating regional or disseminated disease.
    evidence:
    - reference: PMID:32402279
      reference_title: "Systemic Type I IFN Inflammation in Human ISG15 Deficiency Leads to Necrotizing Skin Lesions."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        At the age of one month, he was vaccinated with BCG, to which he displayed an
        exaggerated response, with right inguinal lymphadenopathy and erythema of the
        overlying skin.
      explanation: >-
        Ties the vaccination exposure directly to mycobacterial disease in an ISG15-deficient
        infant.
  notes: >-
    The binding is deliberately broader than the exposure. ECTO has no BCG-, Calmette- or
    M. bovis-specific exposure class: `runoak -i sqlite:obo:ecto search "l~BCG"`,
    `"l~Calmette"` and `"l~bacille"` each return nothing, and `"l~mycobacter"` returns only
    exposure classes for M. tuberculosis and M. avium. ECTO:2000129 exposure to vaccination
    is the most specific true class available, and preferred_term carries the vaccine
    identity.
  evidence:
  - reference: PMID:25307056
    reference_title: "Human intracellular ISG15 prevents interferon-α/β over-amplification and auto-inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These patients (P1, P2 and P3, now aged 17, 14 and 17 years, respectively) displayed
      clinical disease caused by the BCG vaccine, which, in otherwise healthy individuals,
      defines Mendelian susceptibility to mycobacterial disease (MSMD)
    explanation: >-
      States that the BCG vaccine caused the clinical disease in the founding patients,
      establishing the exposure-disease relationship at entry level.
animal_models:
- name: Isg15-deficient mouse
  species: Mouse
  genotype: Isg15 knockout
  publication: PMID:22859821
  description: >
    Isg15-null mice die earlier than wild-type littermates after Mycobacterium tuberculosis
    infection, which supports the antimycobacterial role of ISG15. The same model is
    susceptible to several viruses, which the human disease is not, so the model is
    informative for one arm of the disease and misleading for the other.
  modeled_mechanisms:
  - target: Uncontrolled Replication of Weakly Virulent Mycobacteria
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Accelerated death after M. tuberculosis infection in the knockout supports a
      non-redundant antimycobacterial role for Isg15 in vivo.
    limitations: >-
      The challenge organism is fully virulent M. tuberculosis rather than the weakly
      virulent BCG strain and environmental mycobacteria that define the human phenotype, and
      mouse Isg15 does not sustain USP18 as human ISG15 does, so the murine interferon state
      at the time of challenge is not the human one.
    evidence:
    - reference: PMID:22859821
      reference_title: "Mycobacterial disease and impaired IFN-γ immunity in humans with inherited ISG15 deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Finally, we showed that ISG15−/− mice succumbed earlier than their WT littermates
        upon infection with M. tuberculosis
      explanation: >-
        The in vivo result in the knockout that supports this model-to-mechanism link.
  - target: Enhanced Cellular Antiviral Resistance
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The mouse shows the opposite of the human phenotype: Isg15-deficient mice are
      susceptible to viruses, whereas ISG15-deficient humans are not and their cells are more
      virus-resistant than controls.
    limitations: >-
      The divergence is mechanistic rather than incidental: human ISG15 is required to
      sustain USP18 levels and mouse Isg15 is not, so the sustained interferon state that
      leaves human cells antivirally primed has no counterpart in the mouse. Murine Isg15
      antiviral data therefore cannot be read across to the human deficiency.
    evidence:
    - reference: PMID:27193971
      reference_title: "ISG15 deficiency and increased viral resistance in humans but not mice."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here we describe ISG15-deficient patients who display no enhanced susceptibility to
        viruses in vivo, in stark contrast to Isg15-deficient mice.
      explanation: >-
        States the contradiction between model and human disease that this negative link
        records.
    - reference: PMID:27193971
      reference_title: "ISG15 deficiency and increased viral resistance in humans but not mice."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The species-specific gain-of-function in antiviral immunity observed in ISG15
        deficiency is explained by the requirement of ISG15 to sustain USP18 levels in humans,
        a mechanism not operating in mice.
      explanation: >-
        Gives the mechanistic reason for the species divergence, which is what makes this a
        structural limitation of the model rather than a strain or challenge artifact.
  evidence:
  - reference: PMID:27193971
    reference_title: "ISG15 deficiency and increased viral resistance in humans but not mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Studies in mice have demonstrated a role for Isg15 in antiviral immunity.
    explanation: >-
      States what the mouse model shows, which is the claim the human data then contradict.
discussions:
- discussion_id: isg15_mouse_human_antiviral_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Mouse Isg15 is an antiviral effector and Isg15-null mice are virus-susceptible, while
    ISG15-deficient humans have no unusual viral susceptibility and their fibroblasts are
    more virus-resistant than controls. Does any part of the murine antiviral ISGylation
    phenotype apply to human ISG15 deficiency?
  rationale: >-
    The divergence is not a matter of degree but of direction, and it has a stated
    mechanistic cause: human ISG15 is required to sustain USP18 and mouse Isg15 is not, so
    losing ISG15 raises the interferon set-point in humans and does not in mice. That makes
    murine inferences about ISGylation-dependent antiviral immunity unsafe to carry into the
    human disease, which matters because the mouse literature came first and framed the
    expectation the first patients were measured against. What remains genuinely open is
    whether human ISGylation has any antiviral role against pathogens these few patients have
    not met - the authors state the negative result cannot exclude it - and whether the
    enhanced antiviral state confers clinical protection rather than only a cell-culture
    advantage.
  attaches_to:
  - pathophysiology#Enhanced Cellular Antiviral Resistance
  - animal_models#Mouse
  evidence:
  - reference: PMID:22859821
    reference_title: "Mycobacterial disease and impaired IFN-γ immunity in humans with inherited ISG15 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This experiment of nature shows that human ISGylation is largely redundant for
      antiviral immunity, but that ISG15 plays an essential role as an IFN-γ-inducing secreted
      molecule for optimal antimycobacterial immunity.
    explanation: >-
      States the human conclusion that contradicts the murine expectation, and the one
      function that does hold.
  - reference: PMID:22859821
    reference_title: "Mycobacterial disease and impaired IFN-γ immunity in humans with inherited ISG15 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We cannot rule out enhanced susceptibility to other as yet unencountered viruses
    explanation: >-
      The authors' own statement of what the negative human result does not settle, which is
      the part of this gap that remains open.

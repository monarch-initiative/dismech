- category: Dermatologic
  name: Impaired healing of skin ulceration with fibrosis
  description: >
    Ulcers in this disease heal poorly and scar. Patient skin biopsies show interferon-driven
    apoptosis, skewed macrophage polarisation, epithelial-to-mesenchymal transition and
    myofibroblast activation, and ISG15-knockout fibroblasts close a mechanical wound less
    well than wild-type cells. This is the fibrotic counterpart of the ulceration phenotype
    rather than a separate organ involvement, and it is what makes the skin disease chronic.

  publication: PMID:36752199
  description: >-
    Mice carrying a frameshift equivalent to the human p.R958* allele lose
    the long isoform and are infertile with immotile MMAF sperm and loss of
    single-headed IDAs; sperm number falls to about 5% of controls and the
    axoneme is disorganized in all sections.
  modeled_mechanisms:
  - target: Inner Dynein Arm Assembly Failure in the Sperm Axoneme
    relationship: RECAPITULATES
    fidelity: HIGH
    description: Reproduces the IDA assembly defect seen in patient sperm.
    evidence:
    - reference: PMID:36752199
      reference_title: "Loss-of-function mutations in CFAP57 cause multiple morphological abnormalities of the flagella in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Subsequent examinations of the spermatozoa from Cfap57-mutant mice revealed that CFAP57 deficiency disrupted the inner dynein arm (IDA) assembly in sperm flagella and that single-headed IDAs were more likely to be affected."
      explanation: IDA assembly failure in mutant mice.
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: MMAF is reproduced, with a more severe axonemal and sperm-count defect than in patients.
    limitations: >-
      Mutant mice have severe oligozoospermia and fully disorganized axonemes,
      whereas patients usually have normal sperm counts and can keep an
      intact 9+2 axoneme.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The mouse sperm axoneme disintegrates after IDA loss and sperm output
        falls to about 5%, while in human sperm the 9+2 structure can survive
        without IDAs and concentration is usually normal; the mouse
        overstates the structural and count phenotype.
    evidence:
    - reference: PMID:36752199
      reference_title: "Loss-of-function mutations in CFAP57 cause multiple morphological abnormalities of the flagella in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Therefore, it is supposed that the integrity of the axoneme structure in mutant mouse sperm is more susceptible to IDA assembly failure than in humans."
      explanation: Authors' statement of the species difference.
    - reference: PMID:36752199
      reference_title: "Loss-of-function mutations in CFAP57 cause multiple morphological abnormalities of the flagella in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Hence, Cfap57M/M mice recapitulated the MMAF phenotype found in the affected individuals carrying homozygous M1 mutations, showing that the CFAP57 mutation is indeed pathogenic for MMAF in both infertile cases and mutant mice."
      explanation: The mouse reproduces MMAF.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI bypasses the motility defect. One proband achieved a clinical
    pregnancy and delivery from a single cycle (11 of 14 oocytes fertilized,
    five blastocysts).
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    description: Direct injection makes flagellar propulsion irrelevant to fertilization.
    evidence:
    - reference: PMID:41466333
      reference_title: "Mutations in CFAP57 disrupt the localization of MYH10 and IFT88, leading to flagellogenesis failure in humans and mice."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These results suggest that patients with MMAF resulting from CFAP57 variants can be effectively treated with ICSI."
      explanation: ICSI circumvents the flagellar defect.
  evidence:
  - reference: PMID:41466333
    reference_title: "Mutations in CFAP57 disrupt the localization of MYH10 and IFT88, leading to flagellogenesis failure in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After frozen-thawed embryo transfer (FET) of one high-quality blastocyst, a clinical pregnancy was achieved (Table 2)."
    explanation: Clinical pregnancy after ICSI in one proband; the only reported outcome.
- name: Genetic Counseling
  description: >-
    Counselling for autosomal recessive recurrence and carrier testing of
    relatives once the familial CFAP57 variants are known; the isoform
    location of the variant bears on whether respiratory involvement should
    be considered.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:41793497
    reference_title: "A novel CFAP57 nonsense mutation causes asthenozoospermia in a consanguineous Emirati family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Sanger sequencing confirmed the segregation of the variant within the family; the proband was homozygous for the mutation, while both parents were heterozygous carriers."
    explanation: >-
      Carrier parents in a consanguineous family illustrate the recurrence
      and carrier-testing questions that counselling addresses.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Establishes the diagnosis; probands were identified by whole-exome
    sequencing with Sanger confirmation. MMAF is genetically heterogeneous.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:41793497
    reference_title: "A novel CFAP57 nonsense mutation causes asthenozoospermia in a consanguineous Emirati family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES revealed a novel homozygous nonsense mutation in CFAP57 (c.3223 C > T; p.Arg1075Ter), located within a large homozygous region on chromosome 1."
    explanation: Exome sequencing identified the causal variant.
- name: Semen Analysis
  description: Shows asthenozoospermia with MMAF and usually normal sperm concentration.

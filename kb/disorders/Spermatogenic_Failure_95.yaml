name: Spermatogenic Failure 95
creation_date: "2026-10-16T00:00:00Z"
category: Mendelian
synonyms:
- SPGF95
- spermatogenic failure 95
- CFAP57-related multiple morphological abnormalities of the sperm flagella
description: >-
  Spermatogenic failure 95 (SPGF95) is autosomal recessive male infertility
  caused by biallelic variants in CFAP57, a WD-repeat axonemal protein that
  docks a subset of inner dynein arms (IDAs) onto the microtubule doublets.
  CFAP57 has a long and a short isoform; the truncating variants reported in
  infertile men lie in the region unique to the long isoform, which is the
  form required in sperm, and spare the short isoform that is thought to
  serve respiratory cilia. Loss of long-isoform CFAP57 prevents assembly of
  IDAs, especially the single-headed IDAs, in the sperm flagellum.

  Affected men have asthenozoospermia with multiple morphological
  abnormalities of the sperm flagella (MMAF): short, absent, coiled, bent and
  irregular-caliber flagella, with sperm concentration usually normal. Sperm
  ultrastructure ranges from an intact 9+2 axoneme lacking only the IDAs to
  loss of the central pair and radial spokes. Affected men have generally had
  no respiratory disease, unlike the single reported man with primary
  ciliary dyskinesia from a CFAP57 variant in a region shared by both
  isoforms. Intracytoplasmic sperm injection (ICSI) has produced a live birth.

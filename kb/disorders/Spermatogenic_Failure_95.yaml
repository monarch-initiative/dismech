notes: >-
  MONDO cross-references the phenotype as OMIM 620917. ClinGen has not
  curated CFAP57 for this disease; its only CFAP57 curation is Limited
  (autosomal recessive) for primary ciliary dyskinesia, based on one proband
  (PMID:32764743), so no validity tier is recorded here. In the first
  families (PMID:36752199), seven infertile brothers in three consanguineous
  Pakistani families carried homozygous truncating variants; four had
  asthenozoospermia and one had azoospermia, and only two were examined for
  sperm morphology. Further probands are a Chinese homozygous nonsense case
  and a compound heterozygous missense case (PMID:41466333) and an Emirati
  homozygous nonsense case (PMID:41793497).
  No GeneReviews or StatPearls chapter covers this disorder.

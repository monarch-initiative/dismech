mechanistic_hypotheses:
- hypothesis_group_id: cfap57_isoform_specificity
  hypothesis_label: Truncations confined to the long CFAP57 isoform cause isolated MMAF, while variants affecting both isoforms can cause primary ciliary dyskinesia
  status: EMERGING
  description: >-
    The long isoform (1,250 aa) is required in sperm; the short isoform
    (698 aa), which retains most WD repeats, is expressed in testis and nasal
    epithelium and is proposed to sustain respiratory cilia. All reported
    MMAF nonsense variants lie in the long-isoform-specific region, and the
    men carrying them have had no PCD. The one CFAP57 PCD patient carries a
    variant in exon 11, shared by both isoforms, and his fertility was not
    reported. Two points do not fit cleanly. A compound heterozygous MMAF
    proband carries missense variants (p.V447A, p.R619H) in the region shared
    with the short isoform, yet clinical evaluation found no evidence of PCD;
    the authors read this as selective impairment of the long isoform, which
    would mean that a variant's position in the shared region does not by
    itself predict loss of short-isoform function, and that missense changes
    may spare the short isoform where the exon 11 skip in the PCD patient does
    not. Separately, one Pakistani proband reported occasional breathing
    difficulty but was not examined.
  evidence:
  - reference: PMID:36752199
    reference_title: "Loss-of-function mutations in CFAP57 cause multiple morphological abnormalities of the flagella in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we recruited 3 unrelated consanguineous Pakistani families with multiple MMAF-affected individuals, who had no overt ciliary symptoms."
    explanation: Long-isoform truncations without ciliary disease.
  - reference: PMID:41793497
    reference_title: "A novel CFAP57 nonsense mutation causes asthenozoospermia in a consanguineous Emirati family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, the patient exhibited no signs of primary ciliary dyskinesia (PCD), suggesting that the mutation selectively affects the sperm-specific isoform of CFAP57."
    explanation: A further long-isoform nonsense proband without PCD.
  - reference: PMID:32764743
    reference_title: "Mutation of CFAP57, a protein required for the asymmetric targeting of a subset of inner dynein arms in Chlamydomonas, causes primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, the variant results in the skipping of exon 11 (58 amino acids), which may be due to disruption of an exonic splicing enhancer."
    explanation: >-
      The PCD allele lies in exon 11, within the region shared by both
      isoforms, consistent with respiratory disease requiring loss of the
      short isoform as well.
  - reference: CGGV:assertion_50ed292f-0044-4c82-9419-a040cbcaf205-2022-06-23T160000.000Z
    reference_title: "CFAP57 / primary ciliary dyskinesia (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A homozygous nonsense variant, c.1762C>T (p.Arg588*), was identified in a proband with a classic PCD phenotype including neonatal respiratory distress, otitis media, sinusitis, bronchiectasis, and low nasal nitric oxide."
    explanation: ClinGen's PCD curation (Limited) rests on this single shared-region allele.
  - reference: PMID:36752199
    reference_title: "Loss-of-function mutations in CFAP57 cause multiple morphological abnormalities of the flagella in humans and mice."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, P6 had orally told that he had typhoid, headache, and difficulty in breathing sometimes but refused to participate in any further examinations."
    explanation: >-
      A self-reported, unexamined respiratory complaint in one MMAF proband;
      weak evidence that long-isoform alleles may affect airway cilia.
  - reference: PMID:41466333
    reference_title: "Mutations in CFAP57 disrupt the localization of MYH10 and IFT88, leading to flagellogenesis failure in humans and mice."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, clinical evaluation revealed no evidence of primary ciliary dyskinesia (PCD) in either patient."
    explanation: >-
      Patient P2 carries compound heterozygous missense variants (p.V447A,
      p.R619H) in exons shared by the long and short isoforms, yet had no
      PCD on clinical evaluation. This contradicts the hypothesis's second
      half as a positional rule: a variant in the shared region did not
      produce respiratory disease.
  - reference: PMID:41466333
    reference_title: "Mutations in CFAP57 disrupt the localization of MYH10 and IFT88, leading to flagellogenesis failure in humans and mice."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, P2 mutations cause spermatogenesis defects without PCD, suggesting selective impairment of the long transcript isoform."
    explanation: >-
      The authors reconcile P2 with the isoform model by proposing that his
      missense variants impair the long isoform selectively. That keeps the
      isoform-specific framing, by an inference step: missense substitutions
      may leave the short isoform functional, whereas the exon 11 skip in the
      PCD patient removes 58 residues from both isoforms. No assay of
      short-isoform function in P2 is reported.

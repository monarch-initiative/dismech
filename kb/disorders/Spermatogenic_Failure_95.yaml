pathophysiology:
- name: Loss of Long-Isoform CFAP57 from the Sperm Flagellum
  description: >-
    Nonsense variants in the long-isoform-specific region (p.R913*, p.R958*,
    p.R1075*, p.R1084X) abolish CFAP57 from patient sperm while leaving the
    short isoform intact. CFAP57 binds the double-headed IDA heavy chain
    DNAH10 and acts as a docking factor for IDAs.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CFAP57
    term:
      id: hgnc:26485
      label: CFAP57
  molecular_functions:
  - preferred_term: dynein heavy chain binding (inner dynein arm docking)

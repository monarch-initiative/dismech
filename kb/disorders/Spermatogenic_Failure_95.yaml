genetic:
- name: CFAP57
  association: Causal
  gene_term:
    preferred_term: CFAP57
    term:
      id: hgnc:26485
      label: CFAP57
  notes: >-
    Reported alleles: homozygous nonsense p.R913* and p.R958* (Pakistani
    families), p.R1084X (Chinese) and p.R1075* (Emirati), all in the
    long-isoform-specific region, and compound heterozygous missense p.V447A
    with p.R619H (Chinese), which lie in the region shared with the short
    isoform; that proband had no evidence of PCD on clinical evaluation, so
    the shared-region location of a variant does not on its own predict
    respiratory disease. ClinGen classifies CFAP57 only for primary ciliary dyskinesia
    (Limited, AR), a different disease, so no validity tier is recorded for
    this entry.
  evidence:
  - reference: PMID:36752199
    reference_title: "Loss-of-function mutations in CFAP57 cause multiple morphological abnormalities of the flagella in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing and Sanger sequencing identified 2 cilia and flagella associated protein 57 (CFAP57) loss-of-function mutations (c.2872C>T, p. R958*; and c.2737C>T, p. R913*) recessively segregating with male infertility."
    explanation: First families.
  - reference: PMID:41466333
    reference_title: "Mutations in CFAP57 disrupt the localization of MYH10 and IFT88, leading to flagellogenesis failure in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report novel biallelic mutations in the CFAP57 gene identified in two infertile males from two unrelated families."
    explanation: Two further probands.
  - reference: PMID:41793497
    reference_title: "A novel CFAP57 nonsense mutation causes asthenozoospermia in a consanguineous Emirati family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing confirmed the segregation of the variant within the family; the proband was homozygous for the mutation, while both parents were heterozygous carriers."
    explanation: A further homozygous proband with carrier parents.

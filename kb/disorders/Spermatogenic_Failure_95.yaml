      evidence_source: HUMAN_CLINICAL
      snippet: "In sperm with CFAP57 mutations, MYH10 was mislocalized to the mid-piece region while being notably absent from the principal and end pieces."
      explanation: MYH10 mislocalization in patient sperm.

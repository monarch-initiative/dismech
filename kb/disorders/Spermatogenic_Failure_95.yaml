    causal_link_type: DIRECT
    description: >-
      IDA proteins are synthesized normally in mutant testes but are not
      assembled onto sperm flagella.
    evidence:
    - reference: PMID:36752199
      reference_title: "Loss-of-function mutations in CFAP57 cause multiple morphological abnormalities of the flagella in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, we think that loss of long transcript-encoded CFAP57 protein interfered with the normal assembly of IDAs, resulting in the loss of IDAs in human and mouse sperm flagella."
      explanation: >-
        IDA proteins are made but not assembled when long-isoform CFAP57 is
        absent. The sentence covers human and mouse sperm, but the
        MODEL_ORGANISM grade rests on the mouse testis data showing IDA
        proteins synthesized normally yet absent from Cfap57 mutant flagella.
  - target: Mislocalization of MYH10 and IFT88 in the Sperm Flagellum
    causal_link_type: DIRECT
    description: CFAP57 binds MYH10 and is needed for its distribution along the flagellum.

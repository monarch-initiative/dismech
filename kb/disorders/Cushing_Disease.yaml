- name: Pasireotide
  therapeutic_modality: PEPTIDE
  description: 'A multi-receptor somatostatin analogue with affinity for SSTR5, which corticotroph adenomas
    express. Unlike osilodrostat it acts on the tumour rather than the adrenal. In the long-acting Phase III
    extension, urinary free cortisol was at or below the upper limit of normal in about half of patients at
    last assessment and clinical improvements were sustained. The cost is metabolic and predictable rather
    than idiosyncratic: SSTR5 agonism impairs insulin secretion, and hyperglycaemia-related adverse events
    occurred in 39.5% of patients.'

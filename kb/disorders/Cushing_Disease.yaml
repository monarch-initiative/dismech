        label: osilodrostat
  target_mechanisms:
  - target: Adrenocortical Stimulation and Cortisol Excess
    treatment_effect: INHIBITS
    description: Inhibits adrenal steroidogenesis downstream of ACTH, lowering cortisol without altering the
      pituitary lesion.
  evidence:

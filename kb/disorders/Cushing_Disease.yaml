  evidence:
  - reference: PMID:25485838
    reference_title: Mutations in the deubiquitinase gene USP8 cause Cushing's disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cleavage of USP8 led to increased deubiqutination of the EGF receptor, impairing its downregulation
      and sustaining EGF signaling.
    explanation: The mechanistic step from the mutant protease to sustained receptor signalling. (The spelling
      of "deubiqutination" is as published.)
  - reference: PMID:25675982
    reference_title: Recurrent gain-of-function USP8 mutations in Cushing's disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These mutations aggregate within the 14-3-3 binding motif of USP8 and disrupt the interaction
      between USP8 and 14-3-3 protein, resulting in an elevated capacity to protect EGFR from lysosomal degradation.
    explanation: Names the specific regulatory interaction lost and the trafficking consequence.
  - reference: PMID:30093687
    reference_title: Identification of recurrent USP48 and BRAF mutations in Cushing's disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: BRAF V600E results in constitutive activation of the BRAF kinase activity and its downstream MAPK
      pathway
    explanation: Establishes the alternative route into the same signalling state in BRAF-mutant tumours.
- name: POMC Transcription and ACTH Hypersecretion
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: 'Proopiomelanocortin is the precursor from which ACTH is cleaved, so POMC promoter activity
    sets corticotroph output. All three drivers increase it. This convergence is the strongest argument that
    the molecular heterogeneity of these tumours is superficial: whatever the driver, the phenotype is excess
    ACTH, and the tumours are otherwise clinically indistinguishable.'
  biological_processes:
  - preferred_term: corticotropin secretion
    modifier: INCREASED
    term:
      id: GO:0051458
      label: corticotropin secretion

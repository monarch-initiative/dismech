  - reference: PMID:25485838
    reference_title: Mutations in the deubiquitinase gene USP8 cause Cushing's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We found somatic mutations in the USP8 deubiquitinase gene in 4 of 10 adenomas. The mutations
      clustered in the 14-3-3 protein binding motif and enhanced the proteolytic cleavage and catalytic activity
      of USP8.
    explanation: Establishes the somatic USP8 driver and the positional clustering that indicates gain rather
      than loss of function.
  - reference: PMID:25675982
    reference_title: Recurrent gain-of-function USP8 mutations in Cushing's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Targeted sequencing further identified a total of 17 types of USP8 variants in 67 of 108 ACTH-secreting
      PAs (62.04%). However, none of these mutations was detected in other types of PAs (n = 150).
    explanation: Gives the mutation frequency and the specificity to corticotroph adenomas, which is what makes
      USP8 a disease-defining driver rather than a general pituitary tumour event.
  - reference: PMID:30093687
    reference_title: Identification of recurrent USP48 and BRAF mutations in Cushing's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we report recurrent mutations in the deubiquitinase gene USP48 (predominantly encoding p.M415I
      or p.M415V; 21/91 subjects) and BRAF (encoding p.V600E; 15/91 subjects) in corticotroph adenomas with
      wild-type USP8
    explanation: Identifies the two drivers that account for a substantial share of USP8 wild-type tumours.
  - reference: PMID:30093687
    reference_title: Identification of recurrent USP48 and BRAF mutations in Cushing's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: USP8 mutations are exclusive from mutations in either USP48 or BRAF in all the 169 cases
    explanation: The mutual exclusivity that supports treating the three as alternative drivers of a single
      pathway.
- name: Sustained EGFR Signalling
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: Wild-type USP8 is held inactive by 14-3-3 binding. Variants in that motif disrupt the interaction,
    allowing proteolytic cleavage into a hyperactive fragment which deubiquitinates EGFR. Ubiquitination is
    the signal that routes an activated receptor to the lysosome, so removing it rescues EGFR from degradation
    and returns it to the surface. The corticotroph therefore experiences continuous EGF pathway signalling
    from a normal amount of ligand - the defect is in receptor disposal, not in ligand supply. BRAF V600E reaches
    the same downstream state by constitutively activating the MAPK cascade below the receptor.
  biological_processes:
  - preferred_term: epidermal growth factor receptor signaling pathway
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0007173
      label: epidermal growth factor receptor signaling pathway
  - preferred_term: ERK1 and ERK2 cascade
    modifier: INCREASED
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade

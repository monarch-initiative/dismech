clinical_burden:
  burden_level: HIGH
  rationale: 'Cushing disease roughly doubles mortality. In an unselected Swedish nationwide cohort of 502
    patients the standardised mortality ratio was 2.5, with cardiovascular death the commonest cause and excess
    mortality also from infection and suicide. Crucially the excess does not disappear on cure: for patients
    in remission the SMR was still 1.9. That residual is the strongest argument in this entry for treating
    the accumulated glucocorticoid damage, rather than the tumour, as the thing that determines outcome.'
  evidence:
  - reference: PMID:30715394
    reference_title: 'Overall and Disease-Specific Mortality in Patients With Cushing Disease: A Swedish Nationwide
      Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The observed number of deaths was 133 vs 54 expected, resulting in an overall SMR of 2.5 (95%
      CI, 2.1 to 2.9). The commonest cause of death was cardiovascular diseases (SMR, 3.3; 95% CI, 2.6 to 4.3).
    explanation: The nationwide mortality estimate and its leading cause.
  - reference: PMID:30715394
    reference_title: 'Overall and Disease-Specific Mortality in Patients With Cushing Disease: A Swedish Nationwide
      Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For patients in remission, the SMR was 1.9 (95% CI, 1.5 to 2.3)
    explanation: The residual excess mortality after remission, which this entry treats as the key burden finding.

discussions:
- discussion_id: cd_usp8_status_not_yet_actionable
  kind: KNOWLEDGE_GAP
  attaches_to:
  - has_subtypes#USP8-mutant
  - treatments#Transsphenoidal Selective Adenomectomy
  prompt: Does knowing a corticotroph adenoma's driver genotype change what should be done for the patient?
  rationale: 'The molecular subtyping of corticotroph adenomas is now well established - three recurrent drivers,
    close to mutually exclusive, each converging on POMC - and it has so far changed management for almost
    nobody. Surgery is offered on the same terms regardless of genotype, and genotype is not routinely determined
    because the tissue is only available after the operation that would have been done anyway.

    It is not that the prognostic signal is absent. A meta-analysis of 2,171 cases found USP8-variant tumours
    significantly more likely to achieve postoperative remission (OR 1.76) and, at the same time, significantly
    more likely to recur (OR 2.38). Those two point in opposite directions over different time horizons, so
    USP8 status does not resolve into a single prognostic statement a surgeon can act on at the point of decision
    - it says this patient is more likely to be in remission next month and more likely to relapse later. Whether
    that should change follow-up intensity rather than initial management has not been tested, and the pooled
    data are retrospective and heterogeneous enough that the authors attribute much of the between-study variation
    to cohort sex ratio.

    And the pooled signal is contested by the primary literature. The largest single USP8 series reports that
    recurrence rate and recurrence period were unrelated to USP8 status, and a separate operated cohort analysing
    recurrence predictors directly found USP8 and USP48 status not associated with recurrence. So the meta-analytic
    OR of 2.38 is not corroborated by either primary series that looked for it, which is a stronger reason
    than heterogeneity alone to treat USP8 status as prognostically unsettled.


    BRAF V600E is the cleaner opportunity and the more specific one. It is directly druggable, primary tumour
    cells carrying it respond to vemurafenib in vitro, and it accounts for roughly one in six USP8 wild-type
    tumours. No trial has tested it.

    The gap is therefore not knowledge of the biology, which is unusually well worked out for a rare endocrine
    tumour, and no longer quite "no association has been shown" either. It is that no study has linked driver
    genotype prospectively to a decision a clinician makes.'
  proposed_experiments:
  - experiment_id: cd_driver_genotype_vs_surgical_outcome
    name: Prospective association of driver genotype with post-surgical remission and recurrence
    description: Genotype resected corticotroph adenomas for USP8, USP48 and BRAF in a prospective surgical
      cohort and relate driver status to initial remission and to recurrence over long-term follow-up, adjusting
      for the tumour characteristics already known to predict outcome - invasiveness, size and MRI visibility.
    would_support:
    - has_subtypes#USP8-mutant
    supporting_outcome:
    - Driver genotype predicts remission or recurrence prospectively after adjustment for tumour size, invasiveness
      and cohort sex ratio, reproducing the direction of the pooled retrospective estimates.
    refuting_outcome:
    - Genotype adds nothing once size, invasiveness and sex are accounted for, meaning the pooled association
      is confounded by the cohort composition the meta-regression already implicated.
  evidence:
  - reference: PMID:40392165
    reference_title: 'Prevalence and clinical associations of USP8 variants in corticotroph tumours: a systematic
      review and aggregate data meta-analysis of 2171 cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: USP8 status was associated with higher odds for postoperative remission (OR 1.76, 95% CI, 1.18-2.63)
      and recurrence (OR 2.38, 95% CI, 1.03-5.48).
    explanation: The pooled association this discussion is built around.
  - reference: PMID:25675982
    reference_title: Recurrent gain-of-function USP8 mutations in Cushing's disease.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: the recurrence rate and the average recurrence period were unrelated to the USP8 mutational status
    explanation: A primary series disagreeing with the pooled recurrence estimate.
  - reference: PMID:40257708
    reference_title: 'The prevalence and predictors of Cushing disease recurrence: a 10-year experience of
      a pituitary tumor center of excellence.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: Age, gender, tumor diameter, USP8 and USP48 mutational status, cortisol on the 7th post-operative
      day and, ACTH immuno-positivity in histology were not associated with recurrence.
    explanation: A second, independent operated cohort that looked directly for a genotype-recurrence association
      and did not find one.

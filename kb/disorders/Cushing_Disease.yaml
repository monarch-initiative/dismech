    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The guideline recommends using two of three screening tests to establish the diagnosis: UFC,
      late night salivary cortisol or 1mg dexamethasone suppression test'
    explanation: States the recommended screening strategy this entry describes.
- name: Pituitary MRI and Inferior Petrosal Sinus Sampling
  description: Once ACTH-dependent hypercortisolism is established, the question is whether the source is pituitary
    or ectopic. MRI finds the adenoma in most but not all cases - a substantial minority are MRI-negative,
    and those patients have measurably lower surgical remission rates, which is why petrosal sinus sampling
    retains a role.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging

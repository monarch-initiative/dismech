      patients from a single center over 30 years.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The initial remission rate in patients with pseudocapsule-based extracapsular resection (88.1%),
      MRI-visible adenoma (74.2%) was higher than that in patients without pseudocapsule-based extracapsular
      resection (77.1%), and with MRI-negative results (64.5%)
    explanation: Quantifies the outcome difference between MRI-visible and MRI-negative disease that motivates
      further localisation.
treatments:
- name: Transsphenoidal Selective Adenomectomy
  therapeutic_modality: SURGERY
  description: 'First-line treatment and the only one that addresses the lesion itself. Reported initial remission
    in a 1106-patient single-centre series was 72.5%, with about a quarter left in persistent hypercortisolism.
    Remission is substantially lower with invasive tumours, macroadenomas, pathologically negative specimens
    and repeat surgery, so the figure quoted for any given patient depends on which of those apply. Remission
    is not the end of the story: recurrence occurred in 27.4% of patients over a median 38 months in one operated
    series, and is markedly higher after macroadenoma resection than after microadenoma or no visible lesion
    (45% versus 19%). An early postoperative nadir cortisol at or below 3 mcg/dL is the best available predictor
    of durable remission.'
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: POMC Transcription and ACTH Hypersecretion
    treatment_effect: INHIBITS
    description: Removes the autonomous ACTH source, which is why it is the only treatment that can restore
      a normal axis rather than manage its output.
  evidence:
  - reference: PMID:34415482
    reference_title: 'Surgical outcome of transsphenoidal surgery in Cushing''s disease: a case series of 1106
      patients from a single center over 30 years.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: After surgery, the overall postoperative initial remission rate was 72.5, and 27.5% of patients
      maintained persistent hypercortisolism.
    explanation: The remission rate this entry reports, from the largest single-centre series available.
  - reference: PMID:34415482
    reference_title: 'Surgical outcome of transsphenoidal surgery in Cushing''s disease: a case series of 1106
      patients from a single center over 30 years.'
    supports: SUPPORT

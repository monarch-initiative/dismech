- name: Osilodrostat
  therapeutic_modality: SMALL_MOLECULE
  description: An oral 11-beta-hydroxylase inhibitor that blocks the final step of cortisol synthesis in the
    adrenal. It treats the consequence rather than the cause - the tumour is untouched and ACTH typically rises
    - which is also why hypocortisolism and accumulation of adrenal steroid precursors are the characteristic
    adverse effects rather than incidental ones. A second Phase III trial, LINC 4, tested it against placebo
    from the outset rather than in a withdrawal design and found 77% versus 8% achieving normal urinary free
    cortisol at 12 weeks - so the effect is not an artefact of the LINC 3 withdrawal structure.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy

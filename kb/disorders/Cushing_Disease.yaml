name: Cushing Disease
creation_date: '2026-08-28T22:05:00Z'
category: Somatic
description: 'Cushing disease is hypercortisolism caused by a corticotroph adenoma of the anterior pituitary.
  It is one specific cause of Cushing syndrome, not a synonym for it, and the distinction is mechanistic rather
  than nosological: here the lesion is above the adrenal, ACTH is high rather than suppressed, and the adrenal
  cortex is a normal organ responding correctly to an abnormal signal.

  The tumour''s autonomy is what has to be explained, and since 2015 there is a molecular answer for most cases.
  Somatic variants in USP8, clustered in its 14-3-3 binding motif, release the protease from inhibitory 14-3-3
  binding. The cleaved, hyperactive enzyme deubiquitinates EGFR and so rescues it from lysosomal degradation,
  and the resulting sustained EGF signalling drives POMC transcription. In tumours with wild-type USP8, USP48
  and BRAF V600E variants converge on the same POMC promoter from a different direction, and the three are
  close to mutually exclusive - which is the observation that makes them look like alternative drivers of one
  pathway rather than incidental passengers.

  Two things follow clinically. The first is that the disease is defined by a failure of negative feedback:
  an autonomous corticotroph does not respond to the cortisol it is causing, which is why dexamethasone suppression
  is both the diagnostic test and a description of the lesion. The second is that the morbidity is not caused
  by the tumour, which is usually a small benign microadenoma, but by chronic glucocorticoid exposure downstream
  of it - the cardiovascular, metabolic, skeletal, immune and psychiatric burden that makes this a lethal disease
  if untreated and that only partly reverses on remission.'

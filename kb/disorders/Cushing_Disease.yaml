has_subtypes:
- name: USP8-mutant
  display_name: USP8-mutant corticotroph adenoma
  description: 'The commonest molecular subgroup. Individual series have reported anything from 35% to 62%,
    but a meta-analysis of 2,171 cases pools the prevalence at 31.1%, and much of the between-study spread
    turns out to track the sex ratio of the cohort rather than anything about the tumours. Variants cluster
    in the 14-3-3 binding motif encoded by exon 14, and are essentially confined to corticotroph adenomas -
    the same variants are not found in other pituitary adenoma types.

    The clinical profile is distinctive and internally tensioned: these patients are predominantly female,
    are diagnosed about four and a half years younger, and are *both* more likely to achieve postoperative
    remission and more likely to recur.'
  evidence:
  - reference: PMID:40392165
    reference_title: 'Prevalence and clinical associations of USP8 variants in corticotroph tumours: a systematic
      review and aggregate data meta-analysis of 2171 cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pooled prevalence was 31.1% (95% CI, 26.5%-36.0%) and was higher in cases with functional tumours
      (34.1%; 95% CI, 29.4%-39.1%).
    explanation: The pooled prevalence estimate this entry uses in preference to individual-series figures.
  - reference: PMID:40392165
    reference_title: 'Prevalence and clinical associations of USP8 variants in corticotroph tumours: a systematic
      review and aggregate data meta-analysis of 2171 cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: patients with USP8 variant tumours are mostly female, diagnosed at younger age, more likely to
      achieve postoperative remission, but at a higher risk of recurrence than those with tumours carrying
      the reference allele
    explanation: The clinical associations, including the remission/recurrence pair that this entry treats
      as being in tension.
- name: USP48-mutant
  display_name: USP48-mutant corticotroph adenoma
  description: Recurrent p.M415I or p.M415V variants, found in about 23% of USP8 wild-type corticotroph adenomas.
    Converges on POMC promoter activation.
- name: BRAF V600E-mutant
  display_name: BRAF V600E-mutant corticotroph adenoma
  description: BRAF p.V600E in about 16% of USP8 wild-type corticotroph adenomas, acting through MAPK activation
    onto the same POMC promoter. Of the three drivers this is the one with a directly actionable inhibitor,
    and primary tumour cells carrying it respond to vemurafenib in vitro.
inheritance:
- name: Somatic
  description: The driver events are somatic and confined to the tumour. Cushing disease is overwhelmingly
    sporadic; germline predisposition exists (MEN1, and the familial isolated pituitary adenoma syndromes)
    but accounts for a small minority and is not modelled here.
pathophysiology:
- name: Somatic Driver Mutation in the Corticotroph
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: A somatic variant arises in a single anterior pituitary corticotroph and gives it a growth and
    secretory advantage. USP8 is the commonest driver, with variants clustering in the 14-3-3 protein binding
    motif rather than being distributed across the gene - a positional pattern that signals a gain-of-function
    mechanism rather than loss of the protease. In USP8 wild-type tumours the drivers are USP48 (p.M415I/p.M415V)
    and BRAF p.V600E. The three are close to mutually exclusive across a 169-tumour series, which is the evidence
    that they are alternative entries into one pathway. Loss-of-function variants in NR3C1, the glucocorticoid
    receptor, appear in a minority and attack the same autonomy from the feedback side.
  genetic_context:

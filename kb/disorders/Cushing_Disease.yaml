notes: 'Scope: this entry covers pituitary-dependent Cushing disease specifically. The umbrella entry Cushings_Syndrome
  covers hypercortisolism from all causes, including adrenal, ectopic-ACTH and exogenous glucocorticoid, and
  remains the right place for material that is not specific to the corticotroph adenoma. USP8-related_pituitary_adenoma_4
  is a gene-level entry without a disease_term and is not the same scope as this one.

  Granularity: the corticotroph adenoma is a benign, WHO-defined PitNET with a single settled identity, so
  the cancer granularity ladder in design decisions section 3a does not really engage here. The three molecular
  subgroups are recorded as has_subtypes rather than promoted to separate entries because none has a distinct
  first-line therapy or diagnostic pathway today - which is precisely what the knowledge-gap discussion is
  about.


  Deep research. Curated with a single OpenScientist deep-research report (research/Cushing_Disease-deep-research-openscientist.md).
  Its reference validation reported 46/46 citations verified. Its term validation reported needs_review with
  two mislabelled terms, the important one being MONDO:0005479 offered as "Cushing disease" when that CURIE
  is in fact atrial tachycardia; this entry uses MONDO:0009050. The report is what added the mortality burden,
  the perioperative VTE risk, the USP8 meta-analysis, and the AtT-20 model, and it materially corrected the
  knowledge-gap discussion: USP8 status does have a measured association with both remission and recurrence,
  which the first draft of this entry stated had not been shown.'
biochemical:
- name: Early postoperative nadir serum cortisol
  evidence:
  - reference: PMID:40257708
    reference_title: 'The prevalence and predictors of Cushing disease recurrence: a 10-year experience of
      a pituitary tumor center of excellence.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Nadir cortisol concentrations ≤3 mcg/dL during the first post-operative week predicted long-term
      remission with 74% sensitivity, 85% specificity, 94% positive predictive value, and 50% negative predictive
      value (area under the curve 0.808, p = 0.001).
    explanation: The full operating characteristics, including the asymmetry between positive and negative
      predictive value that this entry flags.
  notes: Measured during the first week after transsphenoidal surgery, this is the practical predictor of durable
    remission. A nadir at or below 3 mcg/dL predicts long-term remission with 94% positive predictive value
    - but only 50% negative predictive value, so a low nadir is reassuring while a higher one is not by itself
    a verdict.

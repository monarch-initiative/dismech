    causal_link_type: DIRECT
  - target: Adrenocortical Stimulation and Cortisol Excess
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25485838
    reference_title: Mutations in the deubiquitinase gene USP8 cause Cushing's disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: USP8 mutants enhanced promoter activity of the gene encoding proopiomelanocortin.
    explanation: Direct demonstration that the USP8 driver acts on POMC transcription.
  - reference: PMID:30093687
    reference_title: Identification of recurrent USP48 and BRAF mutations in Cushing's disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Similar to USP8 mutants, both USP48 and BRAF mutants enhance the promoter activity and transcription
      of the gene encoding proopiomelanocortin (POMC), which is the precursor of ACTH, providing a potential
      mechanism for ACTH overproduction in corticotroph adenomas.
    explanation: The convergence of all three drivers on the same transcriptional output.
- name: Loss of Glucocorticoid Negative Feedback
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: A normal corticotroph suppresses ACTH when circulating cortisol rises. The adenoma does not,
    so the axis stabilises at a pathologically high setpoint with both ACTH and cortisol elevated - the combination
    that distinguishes this from adrenal Cushing syndrome, where ACTH is suppressed. The relative resistance
    is graded rather than absolute, which is what allows the high-dose dexamethasone test to separate pituitary
    from ectopic ACTH sources. In a minority of tumours the feedback lesion is direct, through loss-of-function
    variants in the glucocorticoid receptor gene itself.
  biological_processes:
  - preferred_term: corticotropin secretion
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0051458
      label: corticotropin secretion
  downstream:
  - target: Adrenocortical Stimulation and Cortisol Excess
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30093687
    reference_title: Identification of recurrent USP48 and BRAF mutations in Cushing's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: loss-of-function mutations of the glucocorticoid receptor gene NR3C1
    explanation: Identifies the receptor whose loss removes feedback directly, in the minority of tumours carrying
      such variants.
  - reference: PMID:26156970
    reference_title: 'Cushing''s syndrome: update on signs, symptoms and biochemical screening.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The 1 mg overnight dexamethasone suppression test interrogates whether glucocorticoid negative
      feedback is normal.
    explanation: States that the standard screening test is a direct probe of the feedback lesion described
      by this node.
- name: Adrenocortical Stimulation and Cortisol Excess
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: Chronically elevated ACTH drives bilateral adrenocortical hyperplasia and sustained cortisol
    output. The adrenal is not diseased here - it is responding normally to an abnormal signal, which is why
    removing the pituitary source restores adrenal behaviour and why bilateral adrenalectomy works as a last-resort
    treatment despite doing nothing about the tumour.
  biological_processes:
  - preferred_term: glucocorticoid secretion
    modifier: INCREASED
    term:
      id: GO:0035933
      label: glucocorticoid secretion
  - preferred_term: cortisol biosynthetic process
    modifier: INCREASED
    term:
      id: GO:0034651
      label: cortisol biosynthetic process
  locations:
  - preferred_term: adrenal cortex
    term:
      id: UBERON:0001235
      label: adrenal cortex
  downstream:
  - target: Systemic Glucocorticoid Toxicity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30093687
    reference_title: Identification of recurrent USP48 and BRAF mutations in Cushing's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Chronic elevation of ACTH stimulates the adrenal glands to secrete excessive glucocorticoids,
      which subsequently induces hypercortisolism
    explanation: States the ACTH-to-adrenal step explicitly.
- name: Systemic Glucocorticoid Toxicity
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: 'Every clinically important consequence of Cushing disease sits at this node rather than at
    the tumour. Chronic cortisol excess produces central adiposity with peripheral wasting, proximal myopathy,
    dermal atrophy with wide purple striae, insulin resistance and diabetes, hypertension, osteoporosis, hypercoagulability,
    immunosuppression and mood and cognitive disturbance. The burden is cumulative and outlives the biochemistry:
    mortality is raised relative to the general population, and quality of life after remission does not fully
    normalise.'
  evidence:
  - reference: PMID:26156970
    reference_title: 'Cushing''s syndrome: update on signs, symptoms and biochemical screening.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In addition to classical features of glucocorticoid excess, such as proximal muscle weakness and
      wide purple striae, patients may present with the associated comorbidities that are caused by hypercortisolism.
      These include cardiovascular disease, thromboembolic disease, psychiatric and cognitive deficits, and
      infections.
    explanation: Enumerates the multisystem toxicity attributed directly to the cortisol excess.
  - reference: PMID:26156970
    reference_title: 'Cushing''s syndrome: update on signs, symptoms and biochemical screening.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Endogenous pathologic hypercortisolism, or Cushing's syndrome, is associated with poor quality
      of life, morbidity, and increased mortality.
    explanation: Establishes that the outcome burden is attributable to the hypercortisolism itself.

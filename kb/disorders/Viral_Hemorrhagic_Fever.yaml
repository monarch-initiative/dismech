diagnosis:
- name: Exposure-informed recognition and reference-laboratory referral
  description: >-
    Early clinical findings are nonspecific. Recognition therefore depends on
    compatible epidemiologic exposure, prompt isolation and infection-control
    action, and access to appropriate laboratory testing; exact public-health
    procedures are agent- and jurisdiction-specific.
  evidence:
  - reference: PMID:41734218
    reference_title: "[Viral hemorrhagic fevers: Pathogenesis, epidemiology and clinical manifestations]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Continuous surveillance of imported cases, together with access to high-quality laboratory testing, effective infection control including prevention of nosocomial spread, and vigilance in febrile patients with relevant epidemiological exposure, are essential.
    explanation: This directly supports exposure-informed vigilance, laboratory access, and infection control as linked parts of recognition and response.
- name: Agent-specific molecular and serological testing
  description: >-
    Molecular and serological tests are established diagnostic categories, but
    assay choice, specimen timing, interpretation, and containment requirements
    differ by suspected virus and illness stage. This umbrella entry does not
    prescribe an interchangeable test algorithm across VHF agents.
  evidence:
  - reference: PMID:31668201
    reference_title: Viral Hemorrhagic Fevers Other than Ebola and Lassa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laboratory diagnosis takes place in highly specialized reference laboratories.
    explanation: This supports specialist laboratory involvement for VHF diagnosis.
  - reference: PMID:41754561
    reference_title: CRISPR-Based Detection of Viral Hemorrhagic Fevers at the Point of Care.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Current molecular and serological diagnostic tests, while efficient and effective, lack the characteristics required of a POC test (POCT) to quickly and easily respond to a VHF outbreak while maintaining a low cost.
    explanation: This directly distinguishes established molecular and serological testing from the unmet point-of-care need.
- name: CRISPR-based point-of-care assays (investigational)
  description: >-
    CRISPR-based assays are an investigational point-of-care direction rather
    than an established replacement for current agent-specific molecular and
    serological testing; published VHF development studies remain limited.
  evidence:
  - reference: PMID:41754561
    reference_title: CRISPR-Based Detection of Viral Hemorrhagic Fevers at the Point of Care.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      However, studies on the development of CRISPR-based POC diagnostic tests for VHFs are limited.
    explanation: The review explicitly identifies the limited evidence base, supporting investigational rather than established status.
treatments:
- name: Supportive care
  description: >-
    Supportive care remains the cornerstone for most VHFs. Its components and
    intensity must be tailored to the responsible virus, manifestations, and
    severity; this umbrella record does not define a cross-agent care protocol.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:31668201
    reference_title: Viral Hemorrhagic Fevers Other than Ebola and Lassa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment is essentially supportive.
    explanation: This supports supportive care as the core management approach for many VHFs.
  - reference: PMID:42076078
    reference_title: "Achievements and Challenges in Therapy and Vaccines Development of Viral Hemorrhagic Fevers: An Up-to-Date Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Supportive care continues to represent the cornerstone of clinical management for most infections, while pathogen-targeted therapies are available only for a restricted number of diseases.
    explanation: This supports supportive care as the cross-VHF cornerstone while explicitly limiting targeted therapy to selected diseases.
- name: Ribavirin antiviral pharmacotherapy
  description: >-
    Ribavirin is included here only for Lassa fever, where guidelines recommend
    it but a systematic review found a weak and potentially severity-dependent
    evidence base. It is not asserted as an umbrella VHF treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ribavirin
      term:
        id: CHEBI:63580
        label: ribavirin
  evidence:
  - reference: PMID:31357056
    reference_title: "Ribavirin for the treatment of Lassa fever: A systematic review and meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ribavirin is recommended as standard treatment for LF in national and international guidelines but the evidence base for this recommendation has been questioned recently.
    explanation: >
      This supports ribavirin as a guideline-recommended targeted antiviral for
      Lassa fever while preserving uncertainty about the evidence base.
- name: Ebola monoclonal antibody therapy
  description: >-
    Monoclonal antibody therapy is the targeted pharmacotherapy class with the
    strongest regulatory success among VHFs. This record is restricted to Ebola
    virus disease and does not imply activity against other VHF agents.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: monoclonal antibody
      term:
        id: NCIT:C20401
        label: Monoclonal Antibody
  evidence:
  - reference: PMID:42076078
    reference_title: "Achievements and Challenges in Therapy and Vaccines Development of Viral Hemorrhagic Fevers: An Up-to-Date Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Monoclonal antibody-based therapies have achieved the most significant regulatory success to date, particularly for Ebola virus disease.
    explanation: This supports Ebola monoclonal antibody pharmacotherapy as an established targeted VHF treatment class.
- name: Selected VHF vaccination
  description: >-
    Vaccination is preventive and agent-specific. Licensed vaccines exist for
    selected VHFs, including Ebola, yellow fever, and dengue; this does not imply
    a vaccine is available for the umbrella syndrome or every listed subtype.
  therapeutic_modality: VACCINE

name: Viral Hemorrhagic Fever
creation_date: "2026-05-09T13:23:18Z"
updated_date: "2026-05-09T22:39:24Z"
description: >-
  Viral hemorrhagic fever is a heterogeneous group of severe infections caused
  by selected enveloped RNA viruses. The umbrella entry models recurring
  vascular, immune, and hemostatic patterns rather than one uniform disease:
  individual viruses differ in transmission, organ tropism, bleeding mechanism,
  clinical course, diagnostics, prevention, and treatment, and overt hemorrhage
  is not present in every infection. Severe disease can include acute febrile
  illness, impaired antiviral immunity, high viremia, endothelial dysfunction,
  capillary leak, coagulopathy, hemorrhagic manifestations, shock, and organ
  dysfunction.
category: Infectious Disease
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:41734218
      reference_title: "[Viral hemorrhagic fevers: Pathogenesis, epidemiology and clinical manifestations]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Viral hemorrhagic fevers are severe infections caused by selected enveloped RNA viruses from the families Filoviridae, Arenaviridae, Flaviviridae, and the order Bunyavirales.
      explanation: The review explicitly characterizes VHFs as severe viral infections, supporting infectious-disease classification.

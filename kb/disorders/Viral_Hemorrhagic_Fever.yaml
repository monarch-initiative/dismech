  evidence:
  - reference: PMID:42076078
    reference_title: "Achievements and Challenges in Therapy and Vaccines Development of Viral Hemorrhagic Fevers: An Up-to-Date Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Vaccine development has progressed further, with licensed vaccines available for selected VHFs, including Ebola, yellow fever, and dengue, and multiple candidates based on diverse technological platforms advancing through clinical evaluation.
    explanation: This supports vaccination availability for selected VHFs and ongoing vaccine development.
datasets:
- accession: geo:GSE12254
  title: Gene expression associated with liver metabolism during viral hemorrhagic fever
  description: 'Rhesus macaques (Macaca mulatta) infected with a lethal dose of lymphocytic choriomeningitis virus-strain WE (LCMV-WE) provide a model for Lassa fever virus infection of man. Like Lassa fever in human beings, disease begins with flu-like symptoms but can progress to morbidity fairly rapidly. Previously, we profiled the blood transcriptome of LCMV-infected monkeys (M. Djavani et al. J. Virol. 2007: PMID 17522210) showing distinct pre-viremic and viremic stages that discriminated between virulent and benign infections.'
  data_type: MICROARRAY
  sample_count: 20
  publication: PMID:19216742
  notes: Identified by GEO DataSets index search for Viral Hemorrhagic Fever (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE245916
  title: Species-specific responses during Seoul orthohantavirus infection in human and rat lung microvascular endothelial cells
  description: Orthohantaviruses are viruses generally carried by rodents in which they do not cause overt disease. Seoul orthohantavirus (SEOV) predominantly exists as a persistent infection in the omnipresent reservoir host, the Norway rat, Rattus norvegicus. Upon respiratory transmission via aerosolized infectious rodent excreta to humans, SEOV causes an acute disease named hemorrhagic fever with renal syndrome (HFRS). Lack of disease in rats is attributed to downregulation of pro-inflammatory and upregulation of regulatory host responses.
  data_type: BULK_RNA_SEQ
  sample_count: 24
  publication: PMID:38536871
  notes: Identified by GEO DataSets index search for Viral Hemorrhagic Fever (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
discussions:
- discussion_id: vhf_shared_vs_agent_specific_bleeding_mechanisms
  prompt: >-
    Which endothelial, coagulation-factor, consumptive-coagulopathy, and platelet
    mechanisms are genuinely shared across VHFs, and which are specific to a
    virus, disease stage, or bleeding site?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Endothelial activation and damage
  - pathophysiology#Increased vascular permeability and capillary leak
  - pathophysiology#Hemostatic dysregulation
  - pathophysiology#Consumptive coagulopathy
  - pathophysiology#Decreased coagulation factor production
  - pathophysiology#Thrombocytopenia and platelet dysfunction
  rationale: >-
    The umbrella entry represents recurring routes, not universal mechanisms.
    Comparative evidence remains insufficient to assign the same causal weight
    or sequence to each route across all VHF agents.
  evidence:
  - reference: PMID:41410052
    reference_title: Potential Mechanisms Underlying Bleeding During Infection With Hemorrhagic Fever Viruses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There are likely both common and distinct mechanisms underlying bleeding in different VHFs, as sites of bleeding differ between the viruses.
    explanation: The review explicitly identifies the unresolved common-versus-agent-specific mechanism question.
- discussion_id: vhf_human_vascular_model_fidelity
  prompt: >-
    How faithfully do animal, conventional two-dimensional culture, and emerging
    microphysiological models reproduce human VHF vascular dynamics across
    different agents?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Endothelial activation and damage
  - pathophysiology#Increased vascular permeability and capillary leak
  rationale: >-
    Existing animal and cell-culture systems have produced mechanistic insights,
    but a vascular-model review specifically questions their fidelity to human
    in-vivo dynamics and presents microphysiological systems as promising rather
    than validated replacements.
  evidence:
  - reference: PMID:38749416
    reference_title: "Vascular dysfunction in hemorrhagic viral fevers: opportunities for organotypic modeling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While animal models and traditional 2D cell cultures have contributed insight into the mechanisms by which these pathogens affect the vasculature, these models fall short in replicatingin vivohuman vascular dynamics.
    explanation: The review directly states the translational limitation of existing model systems.
review_notes: >-
  This review intentionally keeps the entry at the cross-VHF syndrome level.
  Virus-specific incubation periods, case-fatality estimates, organ tropism,
  approved products, assay algorithms, and detailed management belong on the
  corresponding agent-specific disorder entries unless a cross-VHF source
  supports an umbrella claim. No single prevalence or incidence estimate was
  added because outbreak ecology and population burden differ fundamentally by
  virus and setting. The matching Falcon deep-research artifact was treated as a
  lead; retained claims were checked against tool-generated reference caches.

diagnosis:
- name: Endoscopic Biopsy with Intestinal Marker Immunohistochemistry
  description: >-
    Nasal endoscopic biopsy establishes the diagnosis; CDX2 and cytokeratin 20
    immunohistochemistry separates intestinal-type from non-intestinal-type
    adenocarcinoma, which is the distinction that carries the occupational
    aetiology and the different natural history.
  diagnosis_term:
    preferred_term: biopsy procedure
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  evidence:
  - reference: PMID:34680393
    reference_title: "Occurrence of Sinonasal Intestinal-Type Adenocarcinoma and Non-Intestinal-Type Adenocarcinoma in Two Countries with Different Patterns of Wood Dust Exposure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnostic workup including immunohistochemistry for the intestinal markers
      CDX2 and CK20 indicated that the proportions of the two tumors differed
      significantly between France and Finland.
    explanation: >-
      Supports CDX2/CK20 immunohistochemistry as the routine means of assigning
      the intestinal-type versus non-intestinal-type distinction.
prevalence:
- population: Patients with malignant sinonasal cancer
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Recorded as a share of sinonasal cancer rather than a population rate: the
    cited source gives intestinal-type sinonasal adenocarcinoma as 8% to 25% of
    all malignant sinonasal cancer, which is a case-mix fraction and not a
    denominator-based prevalence. The wide range reflects real geographic
    variation in occupational exposure — the proportion is much higher in European
    hardwood-working populations than elsewhere.
  evidence:
  - reference: PMID:22575263
    reference_title: "Wood dust-related mutational profile of TP53 in intestinal-type sinonasal adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intestinal-type sinonasal adenocarcinoma represents 8% to 25% of all
      malignant sinonasal cancer and is etiologically related to occupational
      exposure to wood dust.
    explanation: >-
      Gives the histology's share of sinonasal cancer and restates the
      occupational aetiology.
discussions:
- discussion_id: gap_itac_pathway_activation_unconfirmed
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Heterogeneous Oncogenic Pathway Mutation
  prompt: >-
    Do the Wnt, MAPK, PI3K and receptor tyrosine kinase mutations found in
    intestinal-type sinonasal adenocarcinoma actually activate those pathways in
    the tumour, and does any of them drive its behaviour?
  rationale: >-
    This node is deliberately NOT declared as conforming to
    sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation,
    even though the mutated pathways are exactly the module's subject matter. The
    only study to look reported that expression of key pathway proteins showed no
    correlation with mutations in those pathways (apart from nuclear beta-catenin
    with APC/CTNNB1 mutation), and that no gene mutation, mutated pathway, or
    pathway activity level correlated with clinical data or survival. Mutation
    frequency is therefore documented while pathway activation is not, and
    asserting conformance would upgrade a catalogue of lesions into a mechanism
    the evidence does not support. The EGFR/MET/H-RAS alterations are likewise
    described in the literature as candidate biotherapy targets rather than
    validated ones.
  evidence:
  - reference: PMID:34638506
    reference_title: Aberrant Signaling Pathways in Sinonasal Intestinal-Type Adenocarcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No specific gene mutation, mutated pathway, nor pathway activity level showed
      correlation to clinical data or survival.
    explanation: >-
      This is the negative result the gap is built on: mutation of these pathways
      was measured, but neither the mutations nor measured pathway activity tracked
      disease behaviour, so pathway activation cannot be asserted as a mechanism.
  proposed_experiments:
  - experiment_id: exp_itac_pathway_activity_vs_genotype
    name: Pathway-activity profiling against mutation status in ITAC
    description: >-
      Phospho-protein or transcriptional pathway-activity readouts (phospho-ERK,
      phospho-AKT, Wnt target gene signature) in a mutation-genotyped ITAC cohort
      large enough to detect activation restricted to mutated cases, which would
      convert the current mutation catalogue into an activation claim and settle
      whether module conformance is warranted.

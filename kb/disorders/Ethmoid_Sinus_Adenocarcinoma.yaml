treatments:
- name: Endoscopic Surgical Resection
  description: >-
    Transnasal endoscopic resection is the technique of choice for the large
    majority of patients, and complete local excision is the determinant of outcome
    in a tumour whose lethality is local.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Locally Aggressive Growth with Dural Invasion
    treatment_effect: INHIBITS
    description: >-
      Resection is directed at the locally invasive tumour mass, the mechanism that
      accounts for mortality in this disease.
    evidence:
    - reference: PMID:18560862
      reference_title: "Genetic and clinical aspects of wood dust related intestinal-type sinonasal adenocarcinoma: a review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Standard therapeutic modalities include surgery followed by radiotherapy in
        advanced stages, sometimes with chemotherapy treatment.
      explanation: >-
        Establishes surgery as the primary modality directed at local disease, which
        is what this treatment-mechanism edge asserts.
  evidence:
  - reference: PMID:29389737
    reference_title: "Intestinal-type adenocarcinoma of the sinonasal tract: an update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Results on large series support transnasal endoscopic surgery as the
      technique of choice in the large majority of patients with ITAC.
    explanation: >-
      Establishes endoscopic resection as the standard primary modality.
- name: Adjuvant Radiotherapy
  description: >-
    Postoperative radiotherapy is recommended for advanced-stage and high-grade
    tumours, again targeting local control. Whether early-stage, low-grade lesions
    can be treated by surgery alone is explicitly unsettled.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Radiation Therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  target_mechanisms:
  - target: Locally Aggressive Growth with Dural Invasion
    treatment_effect: INHIBITS
    description: >-
      Adjuvant radiotherapy is directed at residual local disease, the source of
      the recurrences that drive mortality.
    evidence:
    - reference: PMID:29389737
      reference_title: "Intestinal-type adenocarcinoma of the sinonasal tract: an update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        With a 5-year overall survival ranging between 53 and 83%, which is mainly
        impacted by local recurrences, ITAC requires a more detailed understanding
        of its biology.
      explanation: >-
        Identifies local recurrence as the determinant of survival, which is the
        mechanism adjuvant radiotherapy is directed at on this edge.
  evidence:
  - reference: PMID:29389737
    reference_title: "Intestinal-type adenocarcinoma of the sinonasal tract: an update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adjuvant radiotherapy is recommended in advanced-stage and high-grade
      lesions.
    explanation: >-
      States the indication for adjuvant radiotherapy.
  - reference: PMID:29389737
    reference_title: "Intestinal-type adenocarcinoma of the sinonasal tract: an update."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More robust data are required to confirm that early-stage, low-grade lesions
      can be treated with exclusive surgery.
    explanation: >-
      Recorded as PARTIAL because it marks the boundary of the recommendation

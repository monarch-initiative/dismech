name: Ethmoid Sinus Adenocarcinoma
creation_date: "2026-08-27T00:00:00Z"
description: >-
  Adenocarcinoma of the ethmoid sinus is the glandular malignancy of the
  sinonasal tract, and the ethmoid is the sinus subsite it most characteristically
  occupies. The dominant histologic subtype is intestinal-type adenocarcinoma
  (ITAC), a tumour that reproduces the morphology and immunophenotype of colorectal
  epithelium — CDX2, cytokeratin 20 and MUC2 — in a sinus that has no intestinal
  tissue of origin. It is the classic occupational cancer of the head and neck:
  hardwood and leather dust carry the strongest exposure-cancer associations in the
  sinonasal literature, with pooled relative risks around 29 and 35 for
  adenocarcinoma specifically, an order of magnitude above the risk those same
  exposures confer for squamous carcinoma. The proposed mechanism is not a direct
  DNA adduct but chronic dust-driven inflammation of the sinonasal mucosa producing
  reactive nitrogen species that mutate TP53, and the TP53 mutation spectrum in
  these tumours tracks wood dust rather than tobacco. Beyond TP53 the genetics are
  strikingly heterogeneous — DNA-damage-response, Wnt, MAPK, PI3K and receptor
  tyrosine kinase alterations each in a minority of cases, with no single
  characterizing driver. The tumour is locally aggressive rather than metastatic:
  dural invasion and local recurrence, not distant spread, are what kill patients.
categories:
- Head and Neck Cancer
- Rare Cancer
- Solid Tumor
- Occupational Cancer
disease_term:
  preferred_term: ethmoid sinus adenocarcinoma
  term:
    id: MONDO:0002418
    label: ethmoid sinus adenocarcinoma
synonyms:
- adenocarcinoma of the ethmoid sinus
- sinonasal intestinal-type adenocarcinoma
- ITAC
parents:
- paranasal sinus carcinoma
notes: >-
  Scope and term-binding caveat. Almost all of the molecular and occupational
  literature cited here is reported at the level of *sinonasal* adenocarcinoma or
  sinonasal intestinal-type adenocarcinoma (ITAC), not the ethmoid subsite in
  isolation, because ITAC series are pooled across sinus subsites. MONDO has no
  class for sinonasal intestinal-type adenocarcinoma; the closest available anchor
  is MONDO:0002418 (ethmoid sinus adenocarcinoma), and the ethmoid is the sinus
  subsite most affected by sinonasal adenocarcinoma, so this entry is keyed on it.
  Where a claim is sinonasal-level rather than ethmoid-specific, the evidence
  explanation says so. A future MONDO ITAC class would be the better anchor and
  this entry should be repointed if one is created.
has_subtypes:
- name: ITAC
  display_name: Intestinal-type adenocarcinoma (ITAC)
  description: >-
    The dominant subtype, defined by enteric morphology and expression of the
    intestinal markers CDX2, cytokeratin 20 and MUC2. This is the subtype carrying
    the hardwood-dust association; the five recognized morphologic patterns are
    colonic, papillary, solid, mucinous and mixed.
- name: non-ITAC
  display_name: Non-intestinal-type adenocarcinoma (non-ITAC)
  description: >-
    A rarer, less well-characterized sinonasal non-salivary adenocarcinoma that
    lacks the intestinal immunophenotype and is considered not to be wood-dust
    related. Its relative frequency versus ITAC differs sharply between
    populations with hardwood versus softwood exposure patterns.
environmental:
- name: Occupational Hardwood Dust Exposure
  description: >-
    Occupational inhalation of hardwood dust in furniture making, cabinet making,
    joinery and carpentry is the defining aetiologic exposure for sinonasal
    intestinal-type adenocarcinoma. The association is subtype-specific: pooled
    relative risks for adenocarcinoma are roughly an order of magnitude above
    those for squamous carcinoma from the same exposure, and populations exposed
    predominantly to softwood dust show proportionally more non-intestinal-type
    tumours.
  exposure_term:
    preferred_term: exposure to wood dust
    term:
      id: ECTO:7000135
      label: exposure to wood dust
  influences_mechanisms:
  - target: Chronic Sinonasal Inflammation from Retained Occupational Dust
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Inhaled hardwood dust is deposited on and retained by sinonasal mucosa,
      establishing the chronic inflammatory state modeled by this node.
    evidence:
    - reference: PMID:34680393
      reference_title: "Occurrence of Sinonasal Intestinal-Type Adenocarcinoma and Non-Intestinal-Type Adenocarcinoma in Two Countries with Different Patterns of Wood Dust Exposure."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Sinonasal intestinal-type adenocarcinoma is strongly associated with
        hardwood dust exposure.
      explanation: >-
        Establishes hardwood dust as the exposure specifically tied to the
        intestinal-type tumour, which is the subtype this entry's pathograph
        models. Sinonasal-level, not ethmoid-specific.
  evidence:
  - reference: PMID:25885319
    reference_title: "Occupational exposure and sinonasal cancer: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The strongest associations are with adenocarcinomas (29.43, 95% CI:
      16.46-52.61 and 35.26, 95% CI: 20.62-60.28 respectively).
    explanation: >-
      Pooled meta-analytic relative risks for wood dust and leather dust in
      adenocarcinoma specifically, quantifying the subtype selectivity of the
      exposure. Sinonasal-level estimate.
  - reference: PMID:18560862
    reference_title: "Genetic and clinical aspects of wood dust related intestinal-type sinonasal adenocarcinoma: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exposure to wood dust particles is a strong etiological factor making it a
      professional disease.
    explanation: >-
      States the occupational-disease framing of ITAC that motivates modeling
      the exposure as the initiating step of the pathograph.
- name: Occupational Leather Dust Exposure
  description: >-
    Leather dust generated in footwear manufacture (scouring, roughing, buffing,
    skiving, cutting and trimming) carries a sinonasal adenocarcinoma risk of the
    same magnitude as wood dust, and is the second established dust exposure for
    this tumour.
  exposure_term:
    preferred_term: exposure to leather dust
    term:
      id: ECTO:7000001
      label: exposure to dust
  notes: >-
    ECTO has no class for leather dust (only ECTO:0500006, exposure to leather
    dye, which is a different agent), so this is bound to the parent
    ECTO:7000001 exposure to dust with a more specific preferred_term. This is a
    deliberate broader-than-ideal binding, not an unresearched one.
  influences_mechanisms:
  - target: Chronic Sinonasal Inflammation from Retained Occupational Dust
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Leather dust converges on the same retained-particulate inflammatory
      mechanism as wood dust, which is why the two exposures produce the same
      tumour type at comparable relative risk.
    evidence:
    - reference: PMID:34638506
      reference_title: "Aberrant Signaling Pathways in Sinonasal Intestinal-Type Adenocarcinoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Sinonasal intestinal-type adenocarcinoma (ITAC) is strongly related to
        occupational exposure to wood and leather dust, however, little is known
        on the genetic alterations involved in tumor development and progression.
      explanation: >-
        Names leather dust alongside wood dust as the aetiologic exposures for
        ITAC, supporting a shared initiating route.
  evidence:
  - reference: PMID:25885319
    reference_title: "Occupational exposure and sinonasal cancer: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exposure to wood dust results associated with SNC (RRpooled = 5.91, 95%
      CI: 4.31-8.11 for the case-control studies and 1.61, 95% CI: 1.10-2.37 for
      the cohort studies), as well as to leather dust (11.89, 95% CI:
      7.69-18.36).
    explanation: >-
      Gives the pooled leather-dust relative risk for sinonasal cancer alongside
      wood dust, establishing it as an independent established exposure.
pathophysiology:
- name: Chronic Sinonasal Inflammation from Retained Occupational Dust
  biological_scale: TISSUE
  description: >-
    Inhaled hardwood or leather dust particles are deposited in the nasal cavity
    and ethmoid air cells, where the tortuous airflow and mucociliary geometry
    favour retention. Sustained particulate irritation maintains a chronic
    inflammatory response in the sinonasal mucosa. This inflammatory state, rather
    than a direct chemical adduct, is the proposed proximal carcinogenic mechanism
    of wood dust — the point at which a non-genotoxic exposure becomes a mutagenic
    one.
  cell_types:
  - preferred_term: sinonasal epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  locations:
  - preferred_term: ethmoid sinus
    term:
      id: UBERON:0002453
      label: ethmoid sinus
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Inflammation-Associated TP53 Mutagenesis
    description: >-
      Reactive nitrogen species generated by the chronic inflammatory infiltrate
      are the proposed mutagen acting on TP53 in these tumours.
  evidence:
  - reference: PMID:22575263
    reference_title: "Wood dust-related mutational profile of TP53 in intestinal-type sinonasal adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data point to wood dust exposure as the causal factor in the
      mutagenesis of TP53, possibly caused by reactive nitrogen species generated
      through a chronic inflammatory process.
    explanation: >-
      States the inflammation-to-mutagenesis mechanism this node models, and is
      explicit that the reactive-nitrogen-species route is the authors' proposal
      ("possibly caused by") rather than a demonstrated pathway.
  notes: >-
    The inflammatory route is a mechanistic proposal from mutation-spectrum data,
    not a directly demonstrated pathway; the cited authors themselves hedge it.
    Modeled as a node because it is the only mechanistic bridge currently offered
    between an established exposure and an established mutation pattern.
- name: Inflammation-Associated TP53 Mutagenesis
  biological_scale: MOLECULAR
  conforms_to: "genome_instability_mutation#Failure of DNA Damage Surveillance and Repair"
  description: >-
    TP53 is the one recurrent alteration in this tumour, and its mutation spectrum
    carries an aetiologic fingerprint: TP53 mutation and p53 immunopositivity in
    intestinal-type sinonasal adenocarcinoma track wood-dust exposure and not
    tobacco, and the predominant base change in non-smokers differs from that seen
    in smokers. Loss of p53-mediated damage surveillance removes the checkpoint
    that would otherwise eliminate the mutagenized clone, and in wider sinonasal
    cancer series TP53 mutation is reported at 77% overall with an association to
    the adenocarcinoma histology and to wood-dust exposure.
  genes:
  - preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  cell_types:
  - preferred_term: sinonasal epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  biological_processes:
  - preferred_term: signal transduction by p53 class mediator
    modifier: DECREASED
    term:
      id: GO:0072331
      label: signal transduction by p53 class mediator
  - preferred_term: DNA damage response
    modifier: ABNORMAL
    term:
      id: GO:0006974
      label: DNA damage response
  downstream:
  - target: Heterogeneous Oncogenic Pathway Mutation
    description: >-
      Loss of p53 surveillance permits accumulation of the additional, individually
      infrequent pathway lesions found across these tumours.
  - target: Intestinal-Type Glandular Transformation
    description: >-
      Loss of the p53 checkpoint permits outgrowth of the transformed clone that
      adopts the enteric phenotype.
  evidence:
  - reference: PMID:22575263
    reference_title: "Wood dust-related mutational profile of TP53 in intestinal-type sinonasal adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a frequency of 41% (18/44) TP53 mutations and 72% (66/92) p53
      immunopositivity in intestinal-type sinonasal adenocarcinoma, significantly
      related to wood dust, but not to tobacco etiology.
    explanation: >-
      Quantifies TP53 alteration in ITAC and, crucially, ties it statistically to
      the wood-dust aetiology rather than to smoking — the link that makes this
      node aetiology-specific rather than generic p53 loss.
  - reference: PMID:20025891
    reference_title: "Profile of TP53 gene mutations in sinonasal cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We recently reported that TP53 mutations are a common feature of SNC, with
      an overall frequency of 77%, and they show association to adenocarcinoma and
      wood-dust exposure
    explanation: >-
      Independent series confirming both the high TP53 mutation frequency in
      sinonasal cancer and its preferential association with the adenocarcinoma
      histology and wood-dust exposure. Sinonasal-level, not ethmoid-specific.
  - reference: PMID:34638506
    reference_title: "Aberrant Signaling Pathways in Sinonasal Intestinal-Type Adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genes involved in DNA damage response showed somatic mutations in 30% of
      cases, including four tumors that also harbored germline mutations.
    explanation: >-
      Extends the damage-surveillance failure beyond TP53 to the DNA-damage-response
      pathway as a whole, which is what grounds the conformance to the
      genome_instability_mutation module's surveillance-failure node.
- name: Heterogeneous Oncogenic Pathway Mutation
  biological_scale: MOLECULAR
  description: >-
    Past TP53, this tumour has no single characterizing driver. Whole-exome
    sequencing of 120 cancer-related genes across 50 ITACs found Wnt, MAPK and
    PI3K pathway mutations each in about a fifth to a quarter of cases and
    receptor tyrosine kinase mutations or copy-number gains in nearly half, with
    no gene, pathway, or pathway-activity level correlating with clinical outcome.
    The honest description is a wide spectrum of low-frequency lesions converging
    on proliferation, not an oncogene-addicted tumour.
  cell_types:
  - preferred_term: sinonasal epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  genes:
  - preferred_term: EGFR
    term:
      id: hgnc:3236
      label: EGFR
  - preferred_term: MET
    term:
      id: hgnc:7029
      label: MET
  - preferred_term: HRAS
    term:
      id: hgnc:5173
      label: HRAS
  biological_processes:
  - preferred_term: MAPK cascade
    modifier: ABNORMAL
    term:
      id: GO:0000165
      label: MAPK cascade
  - preferred_term: Wnt signaling pathway
    modifier: ABNORMAL
    term:
      id: GO:0016055
      label: Wnt signaling pathway
  downstream:
  - target: Intestinal-Type Glandular Transformation
    description: >-
      The accumulated pathway lesions supply the proliferative drive of the
      transformed glandular clone.
  evidence:
  - reference: PMID:34638506
    reference_title: "Aberrant Signaling Pathways in Sinonasal Intestinal-Type Adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genes in Wnt, MAPK and PI3K pathways harbored mutations in 20%, 20% and 24%
      of cases, respectively.
    explanation: >-
      Gives the per-pathway mutation frequencies this node models.
  - reference: PMID:34638506
    reference_title: "Aberrant Signaling Pathways in Sinonasal Intestinal-Type Adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations and copy number gains in receptor tyrosine kinases possibly
      affecting MAPK and PI3K pathways occurred in 44% of cases.
    explanation: >-
      Adds the receptor tyrosine kinase arm, the most frequent single class of
      alteration in the series.
  - reference: PMID:34638506
    reference_title: "Aberrant Signaling Pathways in Sinonasal Intestinal-Type Adenocarcinoma."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The wide spectrum of gene mutations suggests that ITAC is a genetically
      heterogeneous without specific characterizing gene mutations.
    explanation: >-
      Recorded as PARTIAL because it qualifies rather than supports a driver
      claim: the authors conclude there is no characterizing driver, which is why
      this node is named for heterogeneity rather than for a pathway.
  - reference: PMID:29389737
    reference_title: "Intestinal-type adenocarcinoma of the sinonasal tract: an update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic and biological studies have identified alterations in the molecular
      pathways of EGFR, MET, and H-RAS which might be considered as potential
      targets for biotherapy.
    explanation: >-
      Names the specific genes annotated on this node and frames them as candidate
      rather than validated therapeutic targets.
- name: Intestinal-Type Glandular Transformation
  biological_scale: CELLULAR
  description: >-
    The transformed sinonasal epithelium adopts an enteric programme it has no
    developmental basis for: essentially every intestinal-type tumour expresses
    the intestinal transcription factor CDX2 and cytokeratin 20, alongside MUC2,
    reproducing the immunophenotype of colorectal adenocarcinoma closely enough
    that metastasis from the colon is a genuine diagnostic consideration. The
    transformation is the defining event that separates ITAC from non-intestinal
    sinonasal adenocarcinoma, which lacks these markers and lacks the wood-dust
    association.
  cell_types:
  - preferred_term: sinonasal epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  downstream:
  - target: Locally Aggressive Growth with Dural Invasion
    description: >-
      Continued glandular proliferation in the ethmoid labyrinth transgresses the
      thin bony walls separating it from the orbit and anterior cranial fossa.
  evidence:
  - reference: PMID:15894926
    reference_title: "Expression of CDX2, cytokeratins 7 and 20 in sinonasal intestinal-type adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All of the cases expressed CDX2, being stained 50 to 100% of the tumor cells
      (mean: 87.2%).
    explanation: >-
      Establishes near-universal expression of the intestinal master transcription
      factor CDX2 in sinonasal intestinal-type adenocarcinoma, the molecular
      signature of the phenotype switch this node models.
  - reference: PMID:15894926
    reference_title: "Expression of CDX2, cytokeratins 7 and 20 in sinonasal intestinal-type adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The histologic resemblance between SIA and colorectal adenocarcinoma is
      reinforced by the expression of CDX2 and CK20, which are virtually constant
      in both neoplasms.
    explanation: >-
      Supports the claim that the enteric phenotype is reproduced at both
      morphologic and immunophenotypic level.
  - reference: PMID:34680393
    reference_title: "Occurrence of Sinonasal Intestinal-Type Adenocarcinoma and Non-Intestinal-Type Adenocarcinoma in Two Countries with Different Patterns of Wood Dust Exposure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non-intestinal-type adenocarcinoma is a rarer and less well-known subtype
      considered not to be related with wood dust exposure.
    explanation: >-
      Supports treating the intestinal transformation as the discriminating event:
      the tumours that lack it also lack the wood-dust aetiology.
- name: Locally Aggressive Growth with Dural Invasion
  biological_scale: TISSUE
  description: >-
    This tumour kills locally rather than systemically. Local recurrence occurs in
    up to half of cases and, together with invasion of the dura mater, is the major
    cause of death, while regional nodal and distant metastasis remain uncommon at
    around 10%. Most patients present with advanced local (T4) disease and yet
    without nodal or distant spread, which is why local control drives both the
    treatment strategy and the survival curve.
  locations:
  - preferred_term: ethmoid sinus
    term:
      id: UBERON:0002453
      label: ethmoid sinus
  evidence:
  - reference: PMID:18560862
    reference_title: "Genetic and clinical aspects of wood dust related intestinal-type sinonasal adenocarcinoma: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Invasion of the duramater and local recurrence are frequent and the major
      cause of death.
    explanation: >-
      States directly that local behaviour, not metastasis, is the lethal mechanism
      this node models.
  - reference: PMID:18560862
    reference_title: "Genetic and clinical aspects of wood dust related intestinal-type sinonasal adenocarcinoma: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These tumors are locally aggressive with frequent local recurrences in up to
      50% of cases.
    explanation: >-
      Quantifies the local recurrence rate.
  - reference: PMID:36780311
    reference_title: "Sinonasal intestinal- and non-intestinal-type adenocarcinoma in China: a retrospective study of 14 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten (71.4%) had stage T4 disease at diagnosis, but no patient had lymph node
      or distant metastasis.
    explanation: >-
      Illustrates the characteristic dissociation between advanced local stage and
      absent nodal or distant spread, in a small single-institution series.

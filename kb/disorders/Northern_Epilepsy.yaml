inheritance:
- name: Autosomal recessive inheritance
  description: >
    Northern epilepsy is inherited in an autosomal recessive pattern and is
    caused by biallelic pathogenic variants in CLN8; in the Finnish population a
    single homozygous founder missense variant (p.Arg24Gly) accounts for nearly
    all cases.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
genetic:
- name: CLN8
  association: Causal biallelic pathogenic variants
  presence: Positive
  gene_term:
    preferred_term: CLN8
    term:
      id: HGNC:2079
      label: CLN8
  notes: >
    Northern epilepsy is caused by biallelic CLN8 variants. In Finland virtually
    all patients are homozygous for the founder missense variant c.70C>G
    (p.Arg24Gly). CLN8 is a member of the TLC-domain protein family and is
    allelic with the more severe late-infantile variant (Turkish) CLN8 disease.
progression:
- phase: Seizure onset
  age_range: 5 to 10 years
  notes: >
    Disease typically begins in mid-childhood with generalized tonic-clonic and
    complex partial seizures in a previously normally developing child.
- phase: Peripubertal seizure peak
  age_range: Adolescence
  notes: >
    Seizure frequency increases toward puberty and progressive cognitive decline
    becomes apparent within a few years of seizure onset.
- phase: Adult stabilization
  age_range: Adulthood
  notes: >
    After puberty, seizure frequency gradually decreases, but cognitive and
    motor deterioration continues slowly; lifespan is relatively preserved
    compared with other neuronal ceroid lipofuscinoses.
pathophysiology:
- name: CLN8 endoplasmic reticulum membrane protein dysfunction
  description: >
    CLN8 encodes a multi-pass transmembrane protein of the TLC (TRAM-LAG1-CLN8)
    domain family that resides in the endoplasmic reticulum and ER-Golgi
    intermediate compartment. CLN8 regulates lipid/ceramide metabolism and acts
    as a recycling cargo receptor that delivers newly synthesized soluble
    lysosomal enzymes from the ER to the Golgi. Loss of CLN8 function impairs
    lysosomal enzyme trafficking and lipid homeostasis, initiating the neuronal
    ceroid lipofuscinosis disease process.
  genes:
  - preferred_term: CLN8
    term:
      id: HGNC:2079
      label: CLN8
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  cellular_components:
  - preferred_term: endoplasmic reticulum membrane
    term:
      id: GO:0005789
      label: endoplasmic reticulum membrane
  biological_processes:
  - preferred_term: lipid metabolic process
    modifier: DYSREGULATED
    term:
      id: GO:0006629
      label: lipid metabolic process
  downstream:
  - target: Lysosomal autofluorescent storage material accumulation
    description: CLN8 dysfunction is part of the NCL pathway that produces abnormal lysosomal storage material.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Lysosomal autofluorescent storage material accumulation
  description: >
    Like other neuronal ceroid lipofuscinoses, Northern epilepsy is
    characterized by intraneuronal accumulation of autofluorescent ceroid
    lipopigment, whose major protein component is subunit c of mitochondrial ATP
    synthase. Progressive storage accumulation contributes to neuronal
    dysfunction and slow neurodegeneration.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  cellular_components:
  - preferred_term: lysosome
    term:
      id: GO:0005764
      label: lysosome
phenotypes:
- name: Generalized tonic-clonic seizures
  category: Neurologic
  description: >
    Generalized tonic-clonic seizures are a core and often presenting feature,
    beginning in mid-childhood.
  phenotype_term:
    preferred_term: Bilateral tonic-clonic seizure
    term:
      id: HP:0002069
      label: Bilateral tonic-clonic seizure
- name: Focal seizures
  category: Neurologic
  description: >
    Complex partial (focal) seizures also occur in Northern epilepsy alongside
    generalized seizures.
  phenotype_term:
    preferred_term: Focal-onset seizure
    term:
      id: HP:0007359
      label: Focal-onset seizure
- name: Progressive intellectual disability
  category: Neurologic
  description: >
    Progressive cognitive decline begins within a few years of seizure onset and
    continues into adulthood.
  phenotype_term:
    preferred_term: Intellectual disability, progressive
    term:
      id: HP:0006887
      label: Intellectual disability, progressive
- name: Motor deterioration
  category: Neurologic
  description: >
    Affected individuals develop slowly progressive motor decline and clumsiness
    as the disease advances.
  phenotype_term:
    preferred_term: Motor deterioration
    term:
      id: HP:0002333
      label: Motor deterioration
- name: Ataxia
  category: Neurologic
  description: >
    Cerebellar signs including ataxia and impaired balance emerge with disease
    progression.
  phenotype_term:
    preferred_term: Ataxia
    term:
      id: HP:0001251
      label: Ataxia
- name: Cerebellar atrophy
  category: Neurologic
  description: >
    Neuroimaging shows cerebral and cerebellar atrophy that progresses over the
    disease course.
  phenotype_term:
    preferred_term: Cerebellar atrophy
    term:
      id: HP:0001272
      label: Cerebellar atrophy

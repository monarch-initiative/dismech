name: Northern Epilepsy
category: Mendelian
creation_date: '2026-07-24T12:00:00Z'
updated_date: '2026-07-24T12:00:00Z'
description: >
  Northern epilepsy, also known as progressive epilepsy with mental retardation
  (EPMR), is an autosomal recessive CLN8-related neuronal ceroid lipofuscinosis
  and the mildest phenotype of the NCL disease spectrum. It was originally
  described in the Finnish population, where a founder missense variant in CLN8
  (p.Arg24Gly) is responsible for essentially all cases. The disease presents in
  childhood (typically ages 5 to 10 years) with generalized tonic-clonic and
  complex partial seizures whose frequency peaks around puberty and subsequently
  declines in adulthood. Progressive cognitive decline begins a few years after
  seizure onset and is accompanied by slow motor deterioration, but affected
  individuals have a relatively long lifespan compared with other neuronal
  ceroid lipofuscinoses. CLN8 encodes an endoplasmic reticulum / ERGIC
  transmembrane protein of the TLC (TRAM-LAG1-CLN8) domain family that regulates
  lipid metabolism and acts as a recycling receptor delivering soluble lysosomal
  enzymes from the ER to the Golgi; loss of function leads to intraneuronal
  accumulation of autofluorescent ceroid lipopigment and progressive
  neurodegeneration.

inheritance:
- name: Autosomal recessive inheritance
  description: >
    Northern epilepsy is inherited in an autosomal recessive pattern and is
    caused by biallelic pathogenic variants in CLN8; in the Finnish population
    nearly all patients are homozygous for the founder missense variant
    p.Arg24Gly (c.70C>G).
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:10508524
    reference_title: "The neuronal ceroid lipofuscinoses in human EPMR and mnd mutant mice are associated with mutations in CLN8."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is an autosomal recessive disorder characterized by onset of generalized seizures between 5 and 10 years, and subsequent progressive mental retardation."
    explanation: >
      The CLN8/EPMR gene-discovery paper states directly that EPMR (Northern
      epilepsy) is an autosomal recessive disorder.
  - reference: PMID:8014963
    reference_title: "Northern epilepsy syndrome: an inherited childhood onset epilepsy with associated mental deterioration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A new autosomal recessively inherited disease of the central nervous system involving childhood epilepsy and mental deterioration is described."
    explanation: >
      The original clinical description of Northern epilepsy syndrome documents
      autosomal recessive inheritance.
genetic:
- name: CLN8
  association: Causal biallelic pathogenic variants
  presence: Positive
  gene_term:
    preferred_term: CLN8
    term:
      id: hgnc:2079
      label: CLN8
  notes: >
    Northern epilepsy is caused by biallelic CLN8 variants. In Finland virtually
    all patients are homozygous for the founder missense variant c.70C>G
    (p.Arg24Gly / R24G). CLN8 is a member of the TRAM-LAG1-CLN8 (TLC) domain
    protein family and is allelic with the more severe late-infantile variant
    CLN8 disease.
  evidence:
  - reference: PMID:10508524
    reference_title: "The neuronal ceroid lipofuscinoses in human EPMR and mnd mutant mice are associated with mutations in CLN8."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report the positional cloning of a novel gene, CLN8, which is mutated in EPMR."
    explanation: >
      This is the primary report identifying CLN8 as the gene mutated in EPMR /
      Northern epilepsy.
  - reference: PMID:10508524
    reference_title: "The neuronal ceroid lipofuscinoses in human EPMR and mnd mutant mice are associated with mutations in CLN8."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EPMR patients were homozygous for a missense mutation (70C-->G, R24G) that was not found in homozygosity in 433 controls."
    explanation: >
      Establishes the homozygous CLN8 founder missense variant (c.70C>G, R24G)
      in EPMR / Northern epilepsy patients.
  - reference: PMID:21990111
    reference_title: "Update of the mutation spectrum and clinical correlations of over 360 mutations in eight genes that underlie the neuronal ceroid lipofuscinoses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phenotypic divergence is exemplified by different CLN8 mutations giving rise to two very different diseases, the mild CLN8 disease, EPMR (progressive epilepsy with mental retardation), and the more severe CLN8 disease, late infantile variant."
    explanation: >
      Documents CLN8 allelic heterogeneity: the mild EPMR/Northern epilepsy
      phenotype versus the severe late-infantile variant.
progression:
- phase: Seizure onset
  age_range: 5 to 10 years
  notes: >
    Disease begins in mid-childhood in a previously normally developing child
    with generalized tonic-clonic seizures that increase in frequency toward
    puberty.
  evidence:
  - reference: PMID:8014963
    reference_title: "Northern epilepsy syndrome: an inherited childhood onset epilepsy with associated mental deterioration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age of onset of epilepsy was 6.7 years (range 5-10 years) and the epilepsy was characterised by generalised tonic-clonic seizures increasing in frequency up to puberty."
    explanation: >
      Documents the childhood age of seizure onset and the peripubertal
      increase in seizure frequency.
- phase: Adult attenuation with progressive cognitive decline
  age_range: Young adulthood onward
  notes: >
    After puberty seizure activity decreases without complete remission, while
    cognitive deterioration that began a few years after seizure onset continues
    into adulthood.
  evidence:
  - reference: PMID:8014963
    reference_title: "Northern epilepsy syndrome: an inherited childhood onset epilepsy with associated mental deterioration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During young adulthood the epileptic activity began to decrease, but complete remission did not occur."
    explanation: >
      Documents the characteristic attenuation of seizure activity in adulthood
      that distinguishes the protracted Northern epilepsy course.
pathophysiology:
- name: CLN8 endoplasmic reticulum cargo-receptor dysfunction
  description: >
    CLN8 encodes a multipass transmembrane protein of the TRAM-LAG1-CLN8 (TLC)
    domain family that resides in the endoplasmic reticulum and ER-Golgi
    intermediate compartment, where it functions as an ER-to-Golgi cargo
    receptor delivering soluble lysosomal enzymes and participates in membrane
    phospholipid remodeling. Loss of CLN8 function impairs lysosomal enzyme
    trafficking and lipid homeostasis, initiating the neuronal ceroid
    lipofuscinosis disease process.
  genes:
  - preferred_term: CLN8
    term:
      id: hgnc:2079
      label: CLN8
  cell_types:
  - preferred_term: neuron

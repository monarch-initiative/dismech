  - reference: PMID:10508524
    reference_title: "The neuronal ceroid lipofuscinoses in human EPMR and mnd mutant mice are associated with mutations in CLN8."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The neuronal ceroid lipofuscinoses (NCLs) are a genetically heterogeneous group of progressive neurodegenerative disorders characterized by the accumulation of autofluorescent lipopigment in various tissues."
    explanation: >
      Defines the accumulation of autofluorescent lipopigment as the hallmark
      pathology of the NCLs, of which Northern epilepsy (CLN8) is a subtype.
  - reference: PMID:35628533
    reference_title: "Recent Insight into the Genetic Basis, Clinical Features, and Diagnostic Methods for Neuronal Ceroid Lipofuscinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuronal ceroid lipofuscinoses (NCLs) are a group of rare, inherited, neurodegenerative lysosomal storage disorders that affect children and adults."
    explanation: >
      Classifies the NCLs, including CLN8/Northern epilepsy, as lysosomal
      storage disorders.

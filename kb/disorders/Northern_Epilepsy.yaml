treatments:
- name: Anticonvulsant therapy
  description: >
    Management of Northern epilepsy is symptomatic and centered on seizure
    control; there is no CLN8-specific disease-modifying therapy. Historically,
    clonazepam and sodium valproate provided partial antiepileptic benefit.
  treatment_term:
    preferred_term: anticonvulsant agent therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
  evidence:
  - reference: PMID:8014963
    reference_title: "Northern epilepsy syndrome: an inherited childhood onset epilepsy with associated mental deterioration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clonazepam and sodium valproate had some antiepileptic effect, clonazepam being the more beneficial of the two."
    explanation: >
      Documents the partial antiepileptic benefit of anticonvulsant therapy
      (clonazepam and sodium valproate) reported in Northern epilepsy patients.

name: Northern Epilepsy
category: Mendelian
creation_date: '2026-07-24T12:00:00Z'
description: >
  Northern epilepsy, historically called progressive epilepsy with mental
  retardation (EPMR), is the mild, attenuated Finnish founder phenotype of
  CLN8-related neuronal ceroid lipofuscinosis (neuronal ceroid lipofuscinosis
  8, northern epilepsy variant). It is an autosomal recessive disorder in which
  virtually all Finnish patients are homozygous for the CLN8 founder missense
  variant p.Arg24Gly (c.70C>G). Onset is in mid-childhood (typically ages 5 to
  10 years) with generalized tonic-clonic and complex partial seizures whose
  frequency increases toward puberty and then declines during adulthood.
  Progressive cognitive decline begins two to five years after seizure onset
  and continues into adulthood, but the course is protracted and, unlike the
  more severe CLN8 late-infantile variant and most other neuronal ceroid
  lipofuscinoses, is characteristically not associated with early visual
  failure or prominent myoclonus. CLN8 encodes an endoplasmic reticulum / ERGIC
  transmembrane protein of the TRAM-LAG1-CLN8 (TLC) domain family that acts as
  an ER-to-Golgi cargo receptor for soluble lysosomal enzymes and participates
  in membrane phospholipid remodeling; loss of function leads to intraneuronal
  accumulation of autofluorescent ceroid lipopigment and slow neurodegeneration.

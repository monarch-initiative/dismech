  evidence:
  - reference: PMID:10508524
    reference_title: "The neuronal ceroid lipofuscinoses in human EPMR and mnd mutant mice are associated with mutations in CLN8."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It encodes a putative transmembrane protein."
    explanation: >
      The gene-discovery paper reports that CLN8 encodes a transmembrane
      protein.
  - reference: PMID:35252181
    reference_title: "Autophagy in the Neuronal Ceroid Lipofuscinoses (Batten Disease)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CLN8 is an ER to Golgi cargo receptor that is required for lysosomal biogenesis"
    explanation: >
      Establishes the ER-to-Golgi cargo-receptor role of CLN8 in lysosomal
      biogenesis, based on mouse studies.
  - reference: PMID:39970228
    reference_title: "TRAM-LAG1-CLN8 family proteins are acyltransferases regulating phospholipid composition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that CLN8 catalyzes the essential step in the biosynthesis of bis(monoacylglycero)phosphate, a phospholipid critical for lysosome function."
    explanation: >
      Recent biochemical work links CLN8 directly to lysosomal membrane lipid
      homeostasis via bis(monoacylglycero)phosphate synthesis.
  downstream:
  - target: Lysosomal autofluorescent storage material accumulation
    description: CLN8 dysfunction is part of the NCL pathway that produces abnormal lysosomal storage material.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Lysosomal autofluorescent storage material accumulation
  description: >
    Like other neuronal ceroid lipofuscinoses, Northern epilepsy is
    characterized by intraneuronal accumulation of autofluorescent ceroid
    lipopigment; progressive storage contributes to neuronal dysfunction and
    slow neurodegeneration.

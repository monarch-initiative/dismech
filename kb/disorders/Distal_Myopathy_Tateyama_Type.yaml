  - target: Foot small muscle atrophy
    causal_link_type: DIRECT
  - target: Progressive distal muscle weakness
    causal_link_type: DIRECT
  - target: Weakness of the intrinsic hand muscles
    causal_link_type: DIRECT
  - target: Elevated circulating creatine kinase
    causal_link_type: DIRECT
  - target: Myopathic EMG
    causal_link_type: DIRECT

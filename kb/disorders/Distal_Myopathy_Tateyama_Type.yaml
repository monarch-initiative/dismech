- name: Cav3 P104L transgenic mouse
  species: Mouse
  genotype: Transgenic expression of P104L mutant caveolin-3
  publication: PMID:17039257
  description: >-
    Mouse expressing the limb-girdle P104L caveolin-3 mutant, which loses
    sarcolemmal caveolin-3 and develops muscular atrophy with raised

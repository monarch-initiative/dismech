genetic:
- name: CAV3
  gene_term:
    preferred_term: CAV3
    term:
      id: hgnc:1529
      label: CAV3
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    No gene_disease_validity assertion is recorded. ClinGen has not classified
    CAV3 against MONDO:0013686; its Definitive autosomal dominant classification
    is for caveolinopathy (MONDO:0016146), into which it explicitly lumps
    Tateyama type distal myopathy with the other CAV3 phenotypes.
  evidence:
  - reference: ORPHA:488650
    reference_title: Distal myopathy, Tateyama type
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CAV3 | caveolin 3 | hgnc:1529 | Disease-causing germline mutation(s) in"
    explanation: Orphanet records germline CAV3 variants as disease-causing for MPDT.
  - reference: PMID:11805270
    reference_title: Mutation in the caveolin-3 gene causes a peculiar form of distal myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gene analysis disclosed a heterozygous 80 G-->A substitution in the caveolin-3 gene that was identical to that of reported cases of elevated serum creatine kinase."
    explanation: The CAV3 variant identified in the index patient.
  - reference: CGGV:assertion_a314687e-b35d-4bb4-8b93-efcc83d1fa9b-2022-09-13T160000.000Z
    reference_title: CAV3 / caveolinopathy (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "OMIM entities: Familial hypertrophic cardiomyopathy; elevated serum creatine phosphokinase, long QT syndrome 9, Tateyama type distal myopathy, rippling muscle disease 2."
    explanation: >-
      ClinGen names Tateyama type distal myopathy among the OMIM entities it
      lumps under caveolinopathy, for which it classifies CAV3 as Definitive.
      Recorded as evidence only, because the classified MONDO term differs from
      this entry's.
  variants:
  - name: c.80G>A (p.Arg27Gln)
    description: >-
      Missense variant in exon 1 (R26Q in older numbering). Heterozygous in the
      index MPDT patient and in the Spanish MPDT family, and also reported with
      isolated hyperCKemia, rippling muscle disease and limb-girdle muscular
      dystrophy.
    evidence:
    - reference: PMID:18930476
      reference_title: Phenotypic variability in a Spanish family with a Caveolin-3 mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "generating a Arg --> Gln change at codon 27 (p.R27Q) of the amino acid chain in heterozygous state, while no mutation was found in unaffected members."
      explanation: Identifies p.Arg27Gln in the MPDT family.
    - reference: PMID:12939441
      reference_title: Limb-girdle muscular dystrophy in a 71-year-old woman with an R27Q mutation in the CAV3 gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This case emphasizes that an R27Q missense mutation in the CAV3 gene can lead to various clinical phenotypes including hyperCKemia, rippling muscle disease, distal myopathy, and LGMD1C."
      explanation: Documents the phenotypic range of the same variant.
    - reference: PMID:30723005
      reference_title: Coexistence of a CAV3 mutation and a DMD deletion in a family with complex muscular diseases.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The c.80G>A mutation was considered pathogenic according to ACMG guidelines."
      explanation: ACMG pathogenic classification of c.80G>A in a family with rippling muscle disease and hyperCKemia.
    - reference: PMID:40695747
      reference_title: "Clinical Phenotype Spectrum in Two Large Chinese Families With Rippling Muscle Disease Caused by CAV-3 c.80G>A."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A heterozygous variant c.80G>A (p.Arg27Gln) in the CAV3 gene was identified in all patients with RMD."
      explanation: The same variant causes rippling muscle disease in two large families, illustrating allelic overlap with MPDT.
  - name: c.136G>A (p.Ala46Thr)
    description: >-
      Heterozygous missense variant found in a sporadic Chinese patient with
      distal myopathy, absent from both parents and so apparently de novo. The
      same variant had previously been reported in rippling muscle disease.
    evidence:
    - reference: PMID:26947586
      reference_title: Mutation in the caveolin-3 gene causes asymmetrical distal myopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic analysis revealed a heterozygous c.136G > A (p.Ala46Thr) CAV3 mutation that appeared to be de novo because it was absent from the patient's parents."
      explanation: Identifies p.Ala46Thr as a heterozygous, apparently de novo CAV3 variant in distal myopathy.
    - reference: PMID:26947586
      reference_title: Mutation in the caveolin-3 gene causes asymmetrical distal myopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we report a sporadic case of a middle-aged female Chinese patient with MD in which a CAV3 mutation was identical to that previously reported in cases of rippling muscle disease."
      explanation: Records that the same allele is also associated with rippling muscle disease.
diagnosis:
- name: Muscle biopsy caveolin-3 assessment
  description: >-
    Reduced sarcolemmal caveolin-3 on immunohistochemistry or western blot
    points to a primary caveolinopathy and is a sensitive and specific marker.
    Immunoblotting can detect a reduction when immunostaining looks normal.
  evidence:
  - reference: PMID:15580566
    reference_title: Molecular and muscle pathology in a series of caveolinopathy patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "demonstrated that caveolin-3 protein deficiency is a highly sensitive and specific marker of primary caveolinopathy"
    explanation: Supports biopsy caveolin-3 assessment as the diagnostic marker.
  - reference: PMID:27312022
    reference_title: "CAV3 mutations causing exercise intolerance, myalgia and rhabdomyolysis: Expanding the phenotypic spectrum of caveolinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our series, immunoblotting was a more sensitive method to detect reduced caveolin-3 levels than immunohistochemistry in skeletal muscle."
    explanation: Immunoblotting can detect caveolin-3 reduction missed by immunostaining, shown in a series of CAV3 patients with other phenotypes.
- name: CAV3 sequencing
  description: >-
    Molecular confirmation by sequencing both exons of CAV3 for a heterozygous
    pathogenic variant. The retired GeneReviews chapter gave a sequencing yield
    above 99% for caveolinopathies as a group.
  evidence:
  - reference: PMID:18930476
    reference_title: Phenotypic variability in a Spanish family with a Caveolin-3 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA genomics was amplified for the two exons of Cav-3 by the polymerase chain reaction (PCR) in all the affected members"
    explanation: Describes analysis of both CAV3 exons to establish the diagnosis in the family.
  - reference: PMID:20301559
    reference_title: "Caveolinopathies – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Sequence analysis identifies pathogenic variants in more than 99% of affected individuals."
    explanation: >-
      Diagnostic yield of CAV3 sequence analysis stated for caveolinopathies
      as a group in the retired GeneReviews chapter; no MPDT-specific yield
      has been reported.
imaging_findings:
- name: Distal and proximal lower-limb muscle signal abnormality
  modality: MRI
  description: >-
    In the p.Ala46Thr patient, enhanced T1-weighted MRI of the lower limbs
    showed abnormal signal in proximal as well as distal muscles, so imaging
    involvement can be wider than the clinically distal weakness. This is a
    single-case observation.
  evidence:
  - reference: PMID:26947586
    reference_title: Mutation in the caveolin-3 gene causes asymmetrical distal myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "T1-weighted enhanced skeletal muscle MRI of the lower limbs showed an abnormal signal in the distal and proximal muscles."
    explanation: Reports distal and proximal lower-limb MRI signal change in a CAV3 distal myopathy patient.
differential_diagnoses:
- name: Immune-mediated rippling muscle disease
  description: >-
    Acquired rippling muscle disease shares percussion-induced muscle
    hyperexcitability and abnormal caveolin-3 immunostaining, but is
    autoimmune.
  distinguishing_features:
  - Anti-cavin-4 antibodies.
  - Mosaic rather than uniformly reduced caveolin-3 and cavin-4 immunostaining.
  - Frequent association with myasthenia gravis and response to immunotherapy.
  disease_term:
    preferred_term: acquired rippling muscle disease
    term:
      id: MONDO:0021142
      label: acquired rippling muscle disease
  evidence:
  - reference: PMID:39370631
    reference_title: The spectrum of rippling muscle disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Anti-cavin-4 antibodies are the serological marker while the mosaic expression of caveolin-3 and cavin-4 is the pathological feature of iRMD."
    explanation: Gives the serological and biopsy features that separate immune-mediated rippling muscle disease from CAV3 disease.
- name: CAVIN1-related congenital generalized lipodystrophy type 4
  description: >-
    Recessive CAVIN1 (PTRF) disease causes secondary caveolin-3 reduction and
    muscle hyperexcitability, so a reduced caveolin-3 biopsy does not by itself
    establish a CAV3 cause.
  distinguishing_features:
  - Congenital generalized lipodystrophy and extra-muscular manifestations.
  - Absent or reduced cavin-1 immunostaining, with patchy caveolin-3 reduction.
  - Autosomal recessive CAVIN1 variants rather than a heterozygous CAV3 variant.
  disease_term:
    preferred_term: congenital generalized lipodystrophy type 4
    term:
      id: MONDO:0013225
      label: congenital generalized lipodystrophy type 4
  evidence:
  - reference: PMID:39370631
    reference_title: The spectrum of rippling muscle disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Muscle cavin-1/PTRF immunoreactivity is absent or reduced while caveolin-3 immunoreactivity is reduced, often in a patchy way, in CAVIN1/PTRF-RMD."
    explanation: Shows that CAVIN1 disease also reduces caveolin-3 on biopsy, and gives the distinguishing cavin-1 finding.
treatments:
- name: Physical therapy
  description: >-
    No disease-modifying therapy exists. Supportive physical therapy and
    stretching to maintain mobility and prevent contractures were recommended
    for caveolinopathies in the retired GeneReviews chapter.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:20301559
    reference_title: "Caveolinopathies – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "physical therapy and stretching exercises to promote mobility and prevent contractures"
    explanation: >-
      Management recommendation for caveolinopathies as a group; there is no
      MPDT-specific treatment study.
- name: Myostatin inhibition (experimental)
  description: >-
    Preclinical only. In P104L caveolin-3 transgenic mice, crossing in the
    myostatin prodomain or giving a soluble type II myostatin receptor
    intraperitoneally reduced muscular atrophy and lowered phosphorylated
    Smad2 and p21. It has not been tested in patients with MPDT or any other
    caveolinopathy. No NCIT clinical-action or agent term specific to
    myostatin inhibition was found (OLS NCIT search for "myostatin inhibitor"
    and "myostatin propeptide" returned no matching term), so treatment_term
    and therapeutic_agent are omitted.
  action_category: THERAPEUTIC
  target_mechanisms:
  - target: Myostatin signaling disinhibition
    treatment_effect: INHIBITS
    description: Blocks the myostatin signaling released by caveolin-3 loss.
    evidence:
    - reference: PMID:17039257
      reference_title: Muscular atrophy of caveolin-3-deficient mice is rescued by myostatin inhibition.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "ameliorated muscular atrophy of the mutant caveolin-3 transgenic mice with suppression of p-Smad2 and p21 levels"
      explanation: >-
        Myostatin inhibition suppressed the pathway readouts and the atrophy in
        a P104L caveolin-3 mouse. Indirect: preclinical, a limb-girdle allele,
        and not tested in MPDT patients.
  evidence:
  - reference: PMID:17039257
    reference_title: Muscular atrophy of caveolin-3-deficient mice is rescued by myostatin inhibition.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Myostatin inhibition may be a promising therapy for LGMD1C patients."
    explanation: >-
      The authors propose myostatin inhibition as a therapy from the mouse
      data. Indirect: P104L mouse model of LGMD1C, not tested in MPDT
      patients.

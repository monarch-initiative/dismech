  - preferred_term: sarcolemma
    term:
      id: GO:0042383
      label: sarcolemma
  evidence:
  - reference: PMID:18930476
    reference_title: Phenotypic variability in a Spanish family with a Caveolin-3 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cav-3 expression was greatly reduced in the sarcolemma of the proband's muscle."
    explanation: Direct demonstration of sarcolemmal caveolin-3 deficiency in familial MPDT.
  - reference: PMID:17039257
    reference_title: Muscular atrophy of caveolin-3-deficient mice is rescued by myostatin inhibition.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Caveolin-3 plays important roles in muscle cell signal transduction by acting as a scaffolding protein"
    explanation: >-
      Introduction statement of caveolin-3's normal molecular function as a
      scaffolding protein, the activity bound here as molecular adaptor activity
      and lost when caveolin-3 is absent from the sarcolemma.
  - reference: PMID:11805270
    reference_title: Mutation in the caveolin-3 gene causes a peculiar form of distal myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The authors describe a patient with sporadic distal myopathy associated with reduced caveolin-3 in muscle fibers"
    explanation: Reduced caveolin-3 in muscle fibers of the index MPDT patient.
  - reference: PMID:26947586
    reference_title: Mutation in the caveolin-3 gene causes asymmetrical distal myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A muscle biopsy revealed moderate dystrophic changes, and immunohistochemical staining showed reduced CAV-3 expression in the plasmalemma."
    explanation: Reduced plasmalemmal caveolin-3 in a distal myopathy patient carrying the p.Ala46Thr allele.
  - reference: PMID:15580566
    reference_title: Molecular and muscle pathology in a series of caveolinopathy patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "demonstrated that caveolin-3 protein deficiency is a highly sensitive and specific marker of primary caveolinopathy"
    explanation: Establishes caveolin-3 protein deficiency as the diagnostic biopsy marker of CAV3 disease.
  - reference: PMID:11786420
    reference_title: Impairment of caveolae formation and T-system disorganization in human muscular dystrophy with caveolin-3 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a severe impairment of caveolae formation at the muscle cell surface, demonstrating that caveolin-3 is essential for the formation and organization of caveolae in muscle fibers."
    explanation: >-
      Electron microscopy of caveolin-3-deficient human muscle shows loss of
      sarcolemmal caveolae. The patients had LGMD-1C, not MPDT, but share the
      caveolin-3 deficiency.
  downstream:
  - target: Impaired caveolar mechanoprotection
    causal_link_type: DIRECT
    description: >-
      Without caveolae the myofiber cannot buffer increases in membrane tension
      during mechanical stress.
    evidence:
    - reference: PMID:31036801
      reference_title: Dystrophy-associated caveolin-3 mutations reveal that caveolae couple IL6/STAT3 signaling with mechanosensing in human muscle cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Mutant myotubes are unable to buffer the increase in membrane tension induced by mechanical stress."
      explanation: Links caveolae loss in patient myotubes to failed buffering of membrane tension.
  - target: T-tubule system disorganization
    causal_link_type: DIRECT
    description: >-
      Loss of caveolin-3 disturbs organization of the T-tubule system.
    evidence:
    - reference: PMID:11786420
      reference_title: Impairment of caveolae formation and T-system disorganization in human muscular dystrophy with caveolin-3 deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "In addition, we also detected a striking disorganization of the T-system openings at the sub-sarcolemmal level in LGMD-1C muscle fibers."
      explanation: >-
        T-system disorganization accompanies caveolin-3 deficiency in human
        muscle. Indirect because the muscle was from LGMD-1C patients and the
        study shows co-occurrence rather than testing causation.
    - reference: PMID:11259414
      reference_title: "Caveolin-3 null mice show a loss of caveolae, changes in the microdomain distribution of the dystrophin-glycoprotein complex, and t-tubule abnormalities."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "abnormalities in the organization of the T-tubule system, with dilated and longitudinally oriented T-tubules"
      explanation: >-
        Caveolin-3 null mice develop T-tubule abnormalities. Indirect because
        the model is complete loss of caveolin-3 rather than the heterozygous
        human missense variant.
  - target: Myostatin signaling disinhibition
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Caveolin-3 normally suppresses activation of the myostatin type I
      receptor, so its loss releases myostatin signaling. Shown in mice
      expressing the limb-girdle P104L allele, not the MPDT allele.
    evidence:
    - reference: PMID:17039257
      reference_title: Muscular atrophy of caveolin-3-deficient mice is rescued by myostatin inhibition.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Here we report that caveolin-3 inhibited myostatin signaling by suppressing activation of its type I receptor"
      explanation: >-
        Establishes caveolin-3 as a suppressor of myostatin receptor
        activation. Indirect for MPDT because the in vivo work used the P104L
        limb-girdle allele.
  - target: Decreased muscle caveolin-3 level
    causal_link_type: DIRECT
    description: The cellular deficiency is what the biopsy phenotype reports.
- name: Dysferlin and MG53 mislocalization
  biological_scale: CELLULAR
  description: >-
    Dysferlin is mislocalized in muscle from patients with CAV3 variants. In
    cells, Golgi-retained caveolin-3 mutants including R26Q pull dysferlin and
    the repair protein MG53 (TRIM72) away from the sarcolemma.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:16319126
    reference_title: Aberrant dysferlin trafficking in cells lacking caveolin or expressing dystrophy mutants of caveolin-3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Dysferlin is mislocalized, by an unknown mechanism, in muscle from patients with mutations in caveolin-3 (Cav-3)."
    explanation: Background statement that dysferlin is mislocalized in caveolinopathy patient muscle, the observation the cell work set out to explain.
  downstream:
  - target: Defective sarcolemmal membrane repair
    causal_link_type: DIRECT
    description: >-
      Mislocalized MG53 and dysferlin cannot be delivered to sites of membrane
      injury, so repair fails.
    evidence:
    - reference: PMID:19380584
      reference_title: "Membrane repair defects in muscular dystrophy are linked to altered interaction between MG53, caveolin-3, and dysferlin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Mutations in Cav3 (P104L, R26Q) that cause retention of Cav3 in Golgi apparatus result in aberrant localization of MG53 and dysferlin in a dominant-negative fashion, leading to defective membrane repair."
      explanation: Shows the MPDT allele mislocalizing MG53 and dysferlin with a resulting membrane-repair defect.
- name: Defective sarcolemmal membrane repair
  biological_scale: CELLULAR
  conforms_to: "sarcolemmal_fragility_myofiber_necrosis#Sarcolemmal Membrane Repair Failure"
  description: >-
    Sarcolemmal lesions fail to reseal because the MG53, dysferlin and
    caveolin-3 repair complex is disrupted. The dystrophin-glycoprotein complex
    is not the primary defect, so this enters the shared dystrophic chain
    through the membrane-repair arm. The supporting work is in cells expressing
    the variant, not in MPDT muscle.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: plasma membrane repair
    modifier: DECREASED
    term:
      id: GO:0001778
      label: plasma membrane repair
  evidence:
  - reference: PMID:19380584
    reference_title: "Membrane repair defects in muscular dystrophy are linked to altered interaction between MG53, caveolin-3, and dysferlin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations in Cav3 (P104L, R26Q) that cause retention of Cav3 in Golgi apparatus result in aberrant localization of MG53 and dysferlin in a dominant-negative fashion, leading to defective membrane repair."
    explanation: Defective membrane repair with the MPDT allele.
  downstream:
  - target: Myofiber damage and myopathic change
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Unrepaired membrane lesions are proposed to contribute to fiber damage.
      No study has measured repair in MPDT muscle.
- name: Impaired caveolar mechanoprotection
  biological_scale: CELLULAR
  description: >-
    Caveolae act as a membrane reservoir that flattens to buffer tension. In
    patient myotubes with CAV3 variants including R26Q, loss of caveolae leaves
    the membrane unable to buffer mechanical stress, and IL6/STAT3 signaling
    becomes constitutively hyperactivated. In zebrafish, a dystrophy-associated
    caveolin-3 mutant causes sarcolemmal damage only under vigorous muscle
    activity.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:31036801
    reference_title: Dystrophy-associated caveolin-3 mutations reveal that caveolae couple IL6/STAT3 signaling with mechanosensing in human muscle cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This results in impaired regulation of the IL6/STAT3 signaling pathway leading to its constitutive hyperactivation and increased expression of muscle genes."
    explanation: Downstream signaling consequence of failed mechanoprotection in patient myotubes.
  downstream:
  - target: Myofiber damage and myopathic change
    causal_link_type: DIRECT
    description: >-
      Activity-dependent sarcolemmal damage follows loss of caveolar
      mechanoprotection.
    evidence:
    - reference: PMID:26323694
      reference_title: The caveolin-cavin system plays a conserved and critical role in mechanoprotection of skeletal muscle.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "In vivo imaging of live zebrafish embryos revealed that loss of muscle-specific Cavin-1 or expression of a dystrophy-associated Caveolin-3 mutant both led to sarcolemmal damage but only in response to vigorous muscle activity."
      explanation: >-
        A dystrophy-associated caveolin-3 mutant causes activity-dependent
        sarcolemmal damage in vivo. Indirect because the model is zebrafish and
        the abstract does not name the MPDT variant.
- name: T-tubule system disorganization
  biological_scale: CELLULAR
  description: >-
    Caveolin-3 deficiency is associated with derangement of the T-tubule
    system, sarcolemmal membrane alterations and subsarcolemmal vesicles. It
    has been shown in caveolin-3-deficient human LGMD-1C muscle and in
    caveolin-3 null mice, not in MPDT muscle. How this contributes to
    the distal weakness or to muscle hyperexcitability in MPDT has not been
    shown.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: T-tubule organization
    modifier: ABNORMAL
    term:
      id: GO:0033292
      label: T-tubule organization
  evidence:
  - reference: PMID:14981167
    reference_title: "Caveolinopathies: mutations in caveolin-3 cause four distinct autosomal dominant muscle diseases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Improper caveolin-3 oligomerization and membrane localization result in skeletal muscle T-tubule system derangement, sarcolemmal membrane alterations, and large subsarcolemmal vesicle formation."
    explanation: Review synthesis linking caveolin-3 mislocalization to T-tubule derangement.
  - reference: PMID:11786420
    reference_title: Impairment of caveolae formation and T-system disorganization in human muscular dystrophy with caveolin-3 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, we also detected a striking disorganization of the T-system openings at the sub-sarcolemmal level in LGMD-1C muscle fibers."
    explanation: T-system disorganization in caveolin-3-deficient human muscle (LGMD-1C).
  - reference: PMID:11259414
    reference_title: "Caveolin-3 null mice show a loss of caveolae, changes in the microdomain distribution of the dystrophin-glycoprotein complex, and t-tubule abnormalities."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "abnormalities in the organization of the T-tubule system, with dilated and longitudinally oriented T-tubules"
    explanation: In vivo T-tubule abnormalities with caveolin-3 loss.
- name: Myostatin signaling disinhibition
  biological_scale: CELLULAR
  description: >-
    Loss of sarcolemmal caveolin-3 releases its suppression of the myostatin
    type I receptor, increasing Smad2 phosphorylation and p21 expression. This
    was shown in P104L transgenic mice, a limb-girdle caveolinopathy model, and
    has not been tested for the MPDT allele.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:17039257
    reference_title: Muscular atrophy of caveolin-3-deficient mice is rescued by myostatin inhibition.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Loss of caveolin-3 in P104L mutant caveolin-3 transgenic mice caused muscular atrophy with increase in phosphorylated Smad2 (p-Smad2) as well as p21 (also known as Cdkn1a), a myostatin target gene."
    explanation: Caveolin-3 loss raises myostatin pathway activity in vivo. Indirect because the allele is P104L.
  downstream:
  - target: Myofiber damage and myopathic change
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Myostatin hyperactivation drives muscle atrophy in the P104L mouse, and
      myostatin inhibition ameliorates it.
    evidence:
    - reference: PMID:17039257
      reference_title: Muscular atrophy of caveolin-3-deficient mice is rescued by myostatin inhibition.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "hyperactivation of myostatin signaling participates in the pathogenesis of muscular atrophy in a mouse model of LGMD1C"
      explanation: >-
        Links myostatin hyperactivation to muscle atrophy. Indirect because it
        is a limb-girdle caveolinopathy mouse model.
- name: Myofiber damage and myopathic change
  biological_scale: TISSUE
  description: >-
    Skeletal muscle shows myopathic change, with increased variability in fiber
    diameter on biopsy and myopathic potentials on EMG, and creatine kinase is
    raised in serum. In MPDT the clinically evident atrophy and weakness are
    concentrated in the small muscles of the hands and feet; why these muscles
    are selectively affected is not known.
  cell_types:

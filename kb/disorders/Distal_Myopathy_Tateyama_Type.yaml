prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Orphanet class below 1 in 1,000,000, based on published case reports (the
    original sporadic patient, a caveolinopathy screening series and one
    Spanish family). No rate_per_100000 is given because no population study
    exists.
  evidence:
  - reference: ORPHA:488650
    reference_title: Distal myopathy, Tateyama type
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "<1 / 1 000 000 | Worldwide | Point prevalence | PMID:11805270,PMID:15580566,PMID:18930476"
    explanation: Orphanet epidemiology row assigning MPDT to the lowest worldwide point-prevalence class.
progression:
- phase: Early hyperexcitability and hyperCKemia without weakness
  notes: >-
    In the reported Spanish family, younger heterozygous relatives had signs of
    muscle hyperexcitability and raised creatine kinase without motor symptoms.
  evidence:
  - reference: PMID:18930476
    reference_title: Phenotypic variability in a Spanish family with a Caveolin-3 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Signs of muscle hyperexcitability and hyperckemia were observed in the youngest relatives but not motor symptoms."
    explanation: Describes a pre-weakness phase of hyperexcitability and hyperCKemia in younger carriers.
- phase: Late-onset hand-predominant distal myopathy
  notes: >-
    Weakness and atrophy of the small hand muscles appear in adulthood and
    progress slowly. Orphanet records adult onset.
  evidence:
  - reference: PMID:18930476
    reference_title: Phenotypic variability in a Spanish family with a Caveolin-3 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Signs of muscle hyperexcitability and hyperckemia at early ages may predict the development of a late onset autosomal dominant hand-involved myopathy associated to Cav-3 mutation in the family reported herein."
    explanation: Places the hand-involved myopathy late in the course, after the early hyperexcitability phase.
  - reference: ORPHA:488650
    reference_title: Distal myopathy, Tateyama type
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Age of onset: Adult"
    explanation: Orphanet natural-history field records adult onset.
inheritance:
- name: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Autosomal dominant. In the Spanish family the heterozygous CAV3 p.Arg27Gln
    variant was found in affected members and not in the unaffected members
    tested. The original Japanese patient was a sporadic case, and the abstract
    does not report parental testing. A sporadic Chinese patient carried a
    c.136G>A (p.Ala46Thr) variant absent from both parents, so de novo
    occurrence is documented. Each child of an affected heterozygote has a 50%
    chance of inheriting the variant. Expressivity is variable across CAV3
    disease: the same variant can produce different clinical phenotypes and
    muscle pathology in different patients. Penetrance is incomplete and
    age-dependent: younger carriers in the Spanish family had no motor
    symptoms, and in a rippling muscle disease family carrying the same
    arginine-to-glutamine variant one carrier was asymptomatic at 86. No
    penetrance figure has been published.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:18930476
    reference_title: Phenotypic variability in a Spanish family with a Caveolin-3 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a Spanish family affected from a late onset, hand-involved and autosomal dominant distal myopathy associated to Caveolin-3 mutation."
    explanation: Family study reporting autosomal dominant transmission of the hand-involved CAV3 distal myopathy.
  - reference: PMID:18930476
    reference_title: Phenotypic variability in a Spanish family with a Caveolin-3 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "generating a Arg --> Gln change at codon 27 (p.R27Q) of the amino acid chain in heterozygous state, while no mutation was found in unaffected members."
    explanation: The heterozygous variant segregates with disease in the family, consistent with dominant transmission.
  - reference: ORPHA:488650
    reference_title: Distal myopathy, Tateyama type
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Autosomal dominant"
    explanation: Orphanet records autosomal dominant inheritance for MPDT.
  - reference: PMID:15580566
    reference_title: Molecular and muscle pathology in a series of caveolinopathy patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We showed that the same mutation could lead to heterogeneous clinical phenotypes and muscle histopathological changes."
    explanation: Supports variable expressivity of CAV3 variants across patients.
  - reference: PMID:26947586
    reference_title: Mutation in the caveolin-3 gene causes asymmetrical distal myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis revealed a heterozygous c.136G > A (p.Ala46Thr) CAV3 mutation that appeared to be de novo because it was absent from the patient's parents."
    explanation: Documents an apparently de novo heterozygous CAV3 variant in a sporadic distal myopathy patient.
  - reference: PMID:20301559
    reference_title: "Caveolinopathies – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Each child of an individual with an autosomal dominant caveolinopathy has a 50% chance of inheriting the pathogenic variant."
    explanation: >-
      Recurrence risk stated for autosomal dominant caveolinopathies as a
      group in the retired GeneReviews chapter, not specifically for MPDT.
  - reference: PMID:15318349
    reference_title: Phenotypic variability associated with Arg26Gln mutation in caveolin3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals had either a characteristic RMD phenotype, a combination of RMD and LGMD1C phenotypes, or a LGMD1C phenotype, but one mutation carrier was asymptomatic at age 86 years."
    explanation: >-
      A carrier of the same variant (Arg26Gln in older numbering) asymptomatic
      at 86 supports incomplete penetrance, and the range of phenotypes in one
      family supports variable expressivity.
pathophysiology:
- name: Heterozygous CAV3 missense variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous pathogenic missense variant in CAV3 alters caveolin-3. The
    index patient and the Spanish family carry c.80G>A (p.Arg27Gln), written
    R26Q in older numbering that omits the initiator methionine. The same
    variant has been reported in patients with isolated hyperCKemia, rippling
    muscle disease and limb-girdle weakness.
  genes:
  - preferred_term: CAV3
    term:
      id: hgnc:1529
      label: CAV3
  evidence:
  - reference: PMID:11805270
    reference_title: Mutation in the caveolin-3 gene causes a peculiar form of distal myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gene analysis disclosed a heterozygous 80 G-->A substitution in the caveolin-3 gene that was identical to that of reported cases of elevated serum creatine kinase."
    explanation: Identifies the heterozygous CAV3 c.80G>A variant in the index MPDT patient.
  - reference: PMID:18930476
    reference_title: Phenotypic variability in a Spanish family with a Caveolin-3 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "generating a Arg --> Gln change at codon 27 (p.R27Q) of the amino acid chain in heterozygous state, while no mutation was found in unaffected members."
    explanation: Confirms p.Arg27Gln as the heterozygous variant in a familial hand-involved distal myopathy.
  - reference: PMID:12839838
    reference_title: "Phenotypic behavior of caveolin-3 R26Q, a mutant associated with hyperCKemia, distal myopathy, and rippling muscle disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "substitution of glutamine for arginine at amino acid position 26 (R26Q) of caveolin-3 is associated not only with RMD but also with DM and HCK"
    explanation: >-
      Background statement in a cell study linking the same arginine-to-glutamine
      substitution (older R26Q numbering) to distal myopathy as well as allelic
      phenotypes.
  downstream:
  - target: Caveolin-3 Golgi retention and oligomer misassembly
    causal_link_type: DIRECT
    description: >-
      The variant protein is retained in the Golgi complex as abnormally large
      oligomers instead of reaching caveolae.
    evidence:
    - reference: PMID:12839838
      reference_title: "Phenotypic behavior of caveolin-3 R26Q, a mutant associated with hyperCKemia, distal myopathy, and rippling muscle disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here, we show that the caveolin-3 R26Q mutant is mostly retained at the level of the Golgi complex."
      explanation: Shows directly that the MPDT allele causes Golgi retention of caveolin-3 in cultured cells.
- name: Caveolin-3 Golgi retention and oligomer misassembly
  biological_scale: MOLECULAR
  description: >-
    Caveolin-3 carrying the arginine-to-glutamine substitution is mostly
    retained in the Golgi complex, forms oligomers much larger than wild-type
    caveolin-3, and is excluded from caveolae-enriched membranes. Whether this
    allele acts by haploinsufficiency or dominant-negatively is unsettled:
    co-expression with wild-type caveolin-3 did not show a dominant-negative
    effect on caveolin-3 itself in one study, whereas another found that it
    mislocalizes the repair proteins MG53 and dysferlin in a dominant-negative
    fashion.
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  evidence:
  - reference: PMID:12839838
    reference_title: "Phenotypic behavior of caveolin-3 R26Q, a mutant associated with hyperCKemia, distal myopathy, and rippling muscle disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The caveolin-3 R26Q mutant formed oligomers of a much larger size than wild-type caveolin-3 and was excluded from caveolae-enriched membranes."
    explanation: Documents oligomer misassembly and exclusion from caveolae for the MPDT allele.
  - reference: PMID:16319126
    reference_title: Aberrant dysferlin trafficking in cells lacking caveolin or expressing dystrophy mutants of caveolin-3.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Heterologously expressed dystrophy-associated mutant Cav3R26Q accumulates in the Golgi complex of muscle cell lines or fibroblasts."
    explanation: Independent cell-line confirmation of Golgi accumulation of the same allele.
  - reference: PMID:12839838
    reference_title: "Phenotypic behavior of caveolin-3 R26Q, a mutant associated with hyperCKemia, distal myopathy, and rippling muscle disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We propose a haploinsufficiency model in which reduced levels of wild-type caveolin-3, although not rendered dysfunctional due to the caveolin-3 R26Q mutant protein, are insufficient for normal muscle cell function."
    explanation: States the haploinsufficiency model proposed for this allele, one side of the unsettled dominance question.
  downstream:
  - target: Sarcolemmal caveolin-3 deficiency and caveolae loss
    causal_link_type: DIRECT
    description: >-
      Retention of the variant protein leaves too little caveolin-3 at the
      sarcolemma to build caveolae.
    evidence:
    - reference: PMID:31036801
      reference_title: Dystrophy-associated caveolin-3 mutations reveal that caveolae couple IL6/STAT3 signaling with mechanosensing in human muscle cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show here that myotubes from patients bearing the CAV3 P28L and R26Q mutations present a dramatic decrease of caveolae at the plasma membrane, resulting in abnormal response to mechanical stress."
      explanation: Patient-derived myotubes carrying the same allele lose plasma-membrane caveolae.
  - target: Dysferlin and MG53 mislocalization
    causal_link_type: DIRECT
    description: >-
      Golgi-retained mutant caveolin-3 redistributes dysferlin, and MG53, to the
      Golgi complex.
    evidence:
    - reference: PMID:16319126
      reference_title: Aberrant dysferlin trafficking in cells lacking caveolin or expressing dystrophy mutants of caveolin-3.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cav3R26Q and other Golgi-associated mutants of both Cav-3 (Cav3P104L) and Cav-1 (Cav1P132L) caused a dramatic redistribution of dysferlin to the Golgi complex."
      explanation: Shows the Golgi-retained R26Q protein redistributing dysferlin.
- name: Sarcolemmal caveolin-3 deficiency and caveolae loss
  biological_scale: CELLULAR
  description: >-
    Caveolin-3 is greatly reduced at the sarcolemma of patient muscle and
    caveolae are lost. Caveolin-3 protein deficiency is a sensitive and specific
    biopsy marker of primary caveolinopathy and is the defining histological
    finding in MPDT. With caveolin-3 absent from the membrane, its role as a
    scaffolding protein that organises signalling partners at the sarcolemma is
    lost as well.
  genes:
  - preferred_term: CAV3
    term:
      id: hgnc:1529
      label: CAV3
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  molecular_functions:

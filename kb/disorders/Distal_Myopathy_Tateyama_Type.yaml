name: Distal Myopathy, Tateyama Type
creation_date: "2026-10-24T01:30:00Z"
category: Mendelian
synonyms:
- Tateyama distal myopathy
- myopathy, distal, Tateyama type
- MPDT
- CAV3-related distal myopathy
- caveolin-3-related distal myopathy
description: >-
  Distal myopathy, Tateyama type (MPDT; OMIM:614321, ORPHA:488650) is a rare,
  slowly progressive distal myopathy caused by heterozygous pathogenic variants
  in CAV3, which encodes caveolin-3, the muscle-specific structural protein of
  sarcolemmal caveolae. Muscle atrophy and weakness are largely confined to the
  small muscles of the hands and feet, with thenar and hypothenar atrophy,
  together with raised serum creatine kinase and severely reduced caveolin-3 on
  muscle biopsy. Some patients also show calf hypertrophy, pes cavus, and signs
  of muscle hyperexcitability such as percussion-induced rapid muscle
  contractions. The index patient (Tateyama et al. 2002) was a sporadic case
  carrying the heterozygous c.80G>A (p.Arg27Gln) substitution, and a Spanish
  family with the same variant showed autosomal dominant transmission of a
  late-onset, hand-predominant myopathy preceded in younger carriers by
  hyperexcitability and hyperCKemia alone. A second allele, c.136G>A
  (p.Ala46Thr), apparently de novo, was reported in a sporadic Chinese patient
  with distal myopathy. MPDT is one of several allelic
  caveolinopathy phenotypes: CAV3 variants also cause rippling muscle disease,
  limb-girdle muscular dystrophy 1C, isolated hyperCKemia, hypertrophic
  cardiomyopathy and long QT syndrome 9, and the same variant, p.Arg27Gln
  included, can produce different phenotypes in different individuals and even
  within one family. ClinGen lumps all of these under a single caveolinopathy
  entity, whereas MONDO and OMIM keep them separate; this entry follows the
  MONDO split and covers only the distal myopathy phenotype.

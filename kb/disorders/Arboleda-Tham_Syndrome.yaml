- name: KAT6A-RSPO2-Wnt Hippocampal Signaling Deficit
  description: >-
    In a mouse model, KAT6A deficiency lowers transcription of the CA3-enriched
    Wnt activator R-spondin 2 (RSPO2), impairing canonical Wnt signaling and
    synaptic structure and plasticity in hippocampal CA3 pyramidal neurons and
    producing memory deficits. Restoring RSPO2 in CA3 neurons rescues Wnt
    signaling and learning behaviors, nominating this axis as a candidate
    therapeutic target. This mechanism is currently established only in mice; its
    fidelity to human KAT6A-syndrome cognition is unproven.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: hippocampal CA3 pyramidal neuron
    term:
      id: CL:1001571
      label: hippocampal pyramidal neuron
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
    modifier: DECREASED
  - preferred_term: regulation of synaptic plasticity
    term:
      id: GO:0048167
      label: regulation of synaptic plasticity
    modifier: ABNORMAL
  - preferred_term: learning or memory
    term:
      id: GO:0007611
      label: learning or memory
    modifier: ABNORMAL
  evidence:
  - reference: PMID:38758792
    reference_title: "KAT6A deficiency impairs cognitive functions through suppressing RSPO2/Wnt signaling in hippocampal CA3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we find that KAT6A deficiency impairs synaptic structure and
      plasticity in hippocampal CA3, but not in CA1 region, resulting in memory
      deficits in mice.
    explanation: >-
      The mouse model localizes the KAT6A cognitive mechanism to CA3 synaptic
      structure and plasticity.
  downstream:
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - kat6a_rspo2_wnt_hippocampal
    evidence:
    - reference: PMID:38758792
      reference_title: "KAT6A deficiency impairs cognitive functions through suppressing RSPO2/Wnt signaling in hippocampal CA3."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        restoring RSPO2 expression in CA3 neurons rescues the deficits in Wnt
        signaling and learning-associated behaviors in Kat6a mutant mice.
      explanation: >-
        Rescue of learning behaviors in mice links the RSPO2-Wnt deficit to the
        cognitive phenotype, though human relevance is not yet established.

- name: Mitochondrial and Bioenergetic Dysfunction
  description: >-
    Patient-derived fibroblasts carrying KAT6A mutations show impaired cellular
    bioenergetics alongside the histone-acetylation defect. This cellular
    bioenergetic deficit is the mechanistic rationale for the experimental
    pantothenate and L-carnitine intervention, which corrects it in vitro. The
    finding is from patient fibroblast models; its contribution to the clinical
    phenotype in vivo is not established.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:36553567
    reference_title: "Pantothenate and L-Carnitine Supplementation Improves Pathological Alterations in Cellular Models of KAT6A Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the cell bioenergetics of mutant cells was significantly improved"
    explanation: >-
      That bioenergetics of mutant cells could be significantly improved by
      treatment establishes a baseline bioenergetic deficit in KAT6A-mutant
      fibroblasts.

phenotypes:
- category: Neurodevelopmental
  name: Intellectual Disability
  description: >-
    Intellectual disability is very common and ranges from mild to severe, with
    greater group-level severity among late-truncating variants. It is not
    universal: normally assessed cognition has now been reported in rare
    inherited-variant cases.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:30245513
    reference_title: "KAT6A Syndrome: genotype-phenotype correlation in 76 patients with pathogenic KAT6A variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intellectual disability and developmental delay are universal."
    explanation: >-
      The 2019 cohort found both features in all ascertained participants; the
      frequency is conservatively downgraded from obligate because later inherited cases include normal cognition.
  - reference: PMID:38741077
    reference_title: "Neuropsychological profile associated with KAT6A syndrome: Emergent genotype-phenotype trends."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Findings suggest global cognitive impairment with nonverbal cognition
      scores similar to those for receptive language
    explanation: >-
      A dedicated neuropsychological study characterizes the impairment as
      global, with nonverbal cognition tracking receptive language.
  - reference: PMID:39740728
    reference_title: Phenotypic variability in a family with an inherited KAT6A frameshift variant.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The description includes an affected first child with premature pubarche
      (the first individual to our knowledge), a mildly affected second child
      with normal cognitive performance assessment (the third reported
      individual with normal assessment of cognition and KAT6A syndrome), and a
      self-sufficient adult family member.
    explanation: >-
      This inherited family establishes rare exceptions to the earlier
      universal-intellectual-disability framing and supports variable expressivity.
- category: Neurodevelopmental
  name: Global Developmental Delay
  description: >-
    Global developmental delay is a defining early-life feature in clinically
    ascertained cohorts, affecting motor, language, and adaptive development.
    Rare inherited-variant relatives may have normal standardized development,
    so the association is very frequent rather than obligate.

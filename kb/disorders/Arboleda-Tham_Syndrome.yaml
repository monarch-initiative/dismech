  description: >-
    An experimental mouse intervention, not an established treatment for people
    with Arboleda-Tham syndrome. Acetyl-L-carnitine restored H3K23 acetylation
    and improved selected behavioral measures in Kat6a-haploinsufficient mice;
    efficacy, safety, dose, developmental timing, and variant dependence remain
    untested clinically.
  action_category: THERAPEUTIC
  treatment_term:

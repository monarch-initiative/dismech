name: Arboleda-Tham Syndrome
creation_date: "2026-07-30T00:00:00Z"
synonyms:
- KAT6A syndrome
- KAT6A-related intellectual disability
- Mental retardation, autosomal dominant 32
- MRD32
description: >-
  Arboleda-Tham syndrome (KAT6A syndrome) is an autosomal dominant
  neurodevelopmental disorder caused by heterozygous, usually de novo,
  pathogenic variants in KAT6A, a MYST-family lysine acetyltransferase that
  acetylates histone H3 (notably H3K9 and H3K18) within a multi-subunit complex
  with BRPF1/2/3, ING5, and hEAF6 to drive developmental transcriptional
  programs. The core phenotype comprises global developmental delay with
  usually co-occurring intellectual disability and marked expressive speech delay,
  neonatal hypotonia, early feeding and oromotor difficulties, recognizable
  craniofacial dysmorphism (broad nasal tip and thin, tented upper lip), and
  congenital cardiac defects, most often septal defects. Gastrointestinal
  dysmotility (reflux, constipation, and an increased risk of intestinal
  obstruction), microcephaly, ophthalmologic anomalies (notably strabismus),
  recurrent infections, and variable behavioral features complete the spectrum.
  A genotype-phenotype correlation is recognized: early-truncating variants
  (exons 1-15) are predicted to trigger nonsense-mediated decay and
  haploinsufficiency and are associated with milder disease, whereas
  late-truncating variants (exons 16-17) escape nonsense-mediated decay and are
  associated with more severe developmental delay and a higher frequency of
  several syndromic features.
category: Mendelian

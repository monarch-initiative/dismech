    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified by clinical exome sequencing (CES) in four independent families"
    explanation: >-
      The founding series identified the disorder by clinical exome sequencing.
  - reference: PMID:25728777
    reference_title: "Dominant mutations in KAT6A cause intellectual disability with recognizable syndromic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with mutations in KAT6A/MOZ detected by whole-exome sequencing"
    explanation: >-
      An independent series likewise established the diagnosis by whole-exome
      sequencing.

mechanistic_hypotheses:
- hypothesis_group_id: early_truncating_nmd_haploinsufficiency
  hypothesis_label: Early-Truncating NMD / Haploinsufficiency Branch
  status: CANONICAL
  description: >-
    Truncating variants in exons 1-15 are predicted to trigger
    nonsense-mediated decay of the mutant transcript, producing KAT6A
    haploinsufficiency. This branch is associated with a milder phenotype, with
    a majority of early-truncating cases rated as having mild intellectual
    disability.
  evidence:
  - reference: PMID:30245513
    reference_title: "KAT6A Syndrome: genotype-phenotype correlation in 76 patients with pathogenic KAT6A variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This suggests a potential role for nonsense mediated decay (NMD), where
      truncating mutations in the first 15 exons trigger NMD mechanisms and
      result in haploinsufficiency while mutations in exons 16 and 17 would not
      result in NMD, therefore the mRNA would result in a translated but
      dysfunctional protein that may have gain-of function or dominant negative
      effects.
    explanation: >-
      The genotype-phenotype study proposes NMD-mediated haploinsufficiency for
      early-truncating variants as the basis for milder disease.
- hypothesis_group_id: late_truncating_nmd_escape
  hypothesis_label: Late-Truncating NMD-Escape Branch
  status: ALTERNATIVE
  description: >-
    Truncating variants in the last two exons (16-17) escape nonsense-mediated
    decay and are predicted to yield a translated but dysfunctional protein with
    possible gain-of-function or dominant-negative effects. This branch is
    associated with more severe developmental delay and a higher frequency of
    several syndromic features. Direct demonstration of mutant protein and its
    mode of action in patient tissue remains an evidence gap.
  evidence:
  - reference: PMID:30245513
    reference_title: "KAT6A Syndrome: genotype-phenotype correlation in 76 patients with pathogenic KAT6A variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      95% of late truncating cases (exon 16 and 17) were rated as moderate or
      severe, while 60% of early truncating cases (exons 1-15) were rated as
      mild
    explanation: >-
      The cohort documents the more severe developmental phenotype associated
      with the NMD-escaping late-truncating branch.
- hypothesis_group_id: kat6a_rspo2_wnt_hippocampal
  hypothesis_label: KAT6A-RSPO2-Wnt Hippocampal Signaling Branch
  status: EMERGING
  description: >-
    An emerging mechanism, so far demonstrated only in mice, links KAT6A
    deficiency to impaired cognition through a specific transcriptional target:
    KAT6A activates the CA3-enriched Wnt activator R-spondin 2 (RSPO2), and its
    loss reduces hippocampal CA3 synaptic structure, plasticity, and Wnt
    signaling. Restoring RSPO2 in CA3 neurons rescues Wnt signaling and
    learning behaviors in Kat6a mutant mice, nominating the KAT6A-RSPO2-Wnt axis
    as a candidate therapeutic target. Fidelity to human KAT6A-syndrome
    cognition is not yet established.
  evidence:
  - reference: PMID:38758792
    reference_title: "KAT6A deficiency impairs cognitive functions through suppressing RSPO2/Wnt signaling in hippocampal CA3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Collectively, our results demonstrate that KAT6A-RSPO2-Wnt signaling plays
      a critical role in regulating hippocampal CA3 synaptic plasticity and
      cognitive function, providing potential therapeutic targets for KAT6A
      syndrome and related neurodevelopmental diseases.
    explanation: >-
      A mouse study defines the KAT6A-RSPO2-Wnt hippocampal axis as an emerging
      mechanism of the cognitive phenotype and a candidate therapeutic target.


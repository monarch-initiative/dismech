- name: DNA methylation episignature analysis
  description: >-
    Genome-wide DNA methylation analysis can provide an adjunctive molecular
    classifier when a KAT6A variant is uncertain or when KAT6A- and KAT6B-related
    disorders are difficult to distinguish. It does not replace sequence-based
    diagnosis and was validated as a biomarker rather than as a screening test.
  diagnosis_term:
    preferred_term: DNA methylation analysis
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  results: >-
    A KAT6A-associated episignature supports classification of the molecular
    finding and is distinct from the episignatures reported for KAT6B disorders.
  evidence:
  - reference: PMID:37249002
    reference_title: DNA methylation episignatures are sensitive and specific biomarkers for detection of patients with KAT6A/KAT6B variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study we describe distinct episignatures for KAT6A syndrome,
      caused by pathogenic variants in the lysine acetyltransferase A gene
      (KAT6A), and for the two neurodevelopmental disorders associated with
      lysine acetyl transferase B (KAT6B).
    explanation: >-
      The clinical methylome study establishes separable KAT6A and KAT6B
      episignatures as adjunctive diagnostic classifiers.

differential_diagnoses:
- name: KAT6B-related neurodevelopmental disorders
  description: >-
    Genitopatellar and Say-Barber-Biesecker-Young-Simpson syndromes can overlap
    in developmental delay, hypotonia, feeding difficulty, craniofacial
    dysmorphism, and congenital anomalies. Gene-specific sequencing identifies
    KAT6A versus KAT6B variants, and their distinct DNA methylation
    episignatures can assist classification when molecular findings are ambiguous.
  evidence:
  - reference: PMID:37249002
    reference_title: DNA methylation episignatures are sensitive and specific biomarkers for detection of patients with KAT6A/KAT6B variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study we describe distinct episignatures for KAT6A syndrome,
      caused by pathogenic variants in the lysine acetyltransferase A gene
      (KAT6A), and for the two neurodevelopmental disorders associated with
      lysine acetyl transferase B (KAT6B).
    explanation: >-
      Distinct molecular signatures support KAT6B-related disorders as a
      relevant but separable differential diagnosis.


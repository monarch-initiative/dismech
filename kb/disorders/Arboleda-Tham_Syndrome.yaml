    reference_title: "Dominant mutations in KAT6A cause intellectual disability with recognizable syndromic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All five different de novo heterozygous truncating mutations were located
      in the C-terminal transactivation domain of KAT6A
    explanation: >-
      The founding series establishes heterozygous, de novo truncating KAT6A
      variants clustered in the C-terminal domain.

      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We further demonstrate that KAT6A mutations result in dysregulation of
        H3K9 and H3K18 acetylation and altered P53 signaling.
      explanation: >-
        Dysregulated acetylation is accompanied by altered p53 signaling in the

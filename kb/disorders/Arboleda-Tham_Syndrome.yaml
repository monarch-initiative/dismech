- discussion_id: gap_kat6a_hematologic_natural_history
  prompt: >-
    What are the incidence, age-specific natural history, predictors, and
    evidence-based surveillance thresholds for neutropenia, marrow failure, and
    other hematologic abnormalities in Arboleda-Tham syndrome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Neutropenia
  - phenotypes#Aplastic Anemia
  rationale: >-
    The first quantified cohort reports a broad severity range in only three
    affected participants. It does not define longitudinal risk or justify a
    uniform blood-count schedule or intervention threshold.
  evidence:
  - reference: PMID:42040242
    reference_title: "Expanding the Clinical Spectrum of Arboleda-Tham Syndrome: Neuroimaging Findings and Hematologic Manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, 3 of 11 patients (27%) exhibited hematologic abnormalities,
      ranging from transient neonatal neutropenia to severe aplastic anemia
      requiring hematopoietic stem cell transplantation.
    explanation: >-
      This small retrospective denominator establishes the signal while leaving
      prevalence, trajectory, predictors, and surveillance unresolved.

review_notes: >-
  Publication-readiness review completed through 2026-08-05. No population-based
  prevalence or incidence estimate, disease-specific clinical trial, controlled
  treatment study, formal practice guideline, or established disease-modifying
  therapy was found. Adult natural history, life expectancy, quality of life,
  hematologic surveillance, and variant-specific prognosis remain sparse. The
  quantified Chiari-malformation and cerebral-white-matter observations are
  represented as emerging phenotypes; the single radioulnar-synostosis
  observation was not promoted. The D2P audit produced 117 suggestions/issues;
  high-value current evidence was incorporated, while small-series source-only
  dysmorphology, narrow duplicates of represented phenotypes, and unsupported
  causal links were explicitly deferred. Unlinked phenotypes were not given
  speculative pathograph edges merely to raise connectivity. ClinicalTrials.gov
  returned no disease-specific study for the exact disorder query, and no
  KAT6A-specific GeneReviews chapter was found.

- name: Mitochondrial and Bioenergetic Dysfunction
  description: >-
    Patient-derived fibroblasts carrying KAT6A mutations show impaired cellular
    bioenergetics alongside the histone-acetylation defect. This cellular
    bioenergetic deficit is the mechanistic rationale for the experimental
    pantothenate and L-carnitine intervention, which corrects it in vitro. The
    finding is from patient fibroblast models; its contribution to the clinical
    phenotype in vivo is not established.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:36553567
    reference_title: "Pantothenate and L-Carnitine Supplementation Improves Pathological Alterations in Cellular Models of KAT6A Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the cell bioenergetics of mutant cells was significantly improved"
    explanation: >-
      That bioenergetics of mutant cells could be significantly improved by
      treatment establishes a baseline bioenergetic deficit in KAT6A-mutant
      fibroblasts.


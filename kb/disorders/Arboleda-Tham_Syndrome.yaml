discussions:
- discussion_id: gap_kat6a_preclinical_translation
  prompt: >-
    Do the neural-progenitor, hippocampal RSPO2-Wnt, and histone-acetylation
    abnormalities found in Kat6a mouse models reproduce human neural pathology,
    and can acetyl-L-carnitine safely improve clinically meaningful outcomes?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Neural Progenitor Proliferation and Differentiation
  - pathophysiology#KAT6A-RSPO2-Wnt Hippocampal Signaling Deficit
  - treatments#Acetyl-L-Carnitine
  rationale: >-
    The mechanistic and intervention results are from mouse neural cells or
    whole animals. Patient fibroblasts establish chromatin abnormalities but do
    not validate the neural circuit mechanisms, clinical endpoints, dose, or
    variant-specific treatment response in people.
  evidence:
  - reference: PMID:41702672
    reference_title: Acetyl-carnitine improves hyperactivity and learning deficits in KAT6A haploinsufficient mice.
    supports: PARTIAL

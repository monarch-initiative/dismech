- name: Altered p53 Signaling
  description: >-
    Beyond its direct catalytic effect on histone H3, KAT6A dysfunction perturbs
    p53-associated transcriptional programs. Patient-derived fibroblasts show
    altered expression of p53-associated genes, a downstream transcriptional
    consequence distinct from the direct loss of histone acetylation. The
    specific disease-level consequences downstream of altered p53 signaling in
    KAT6A syndrome are not established, so this node is intentionally left as a
    terminal molecular readout.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL

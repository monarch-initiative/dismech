genetic:
- name: KAT6A Pathogenic Variants
  gene_term:
    preferred_term: KAT6A
    term:
      id: hgnc:13013
      label: KAT6A
  association: Causative
  presence: Positive
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Heterozygous pathogenic KAT6A variants are usually de novo and predominantly
    protein-truncating (nonsense or frameshift), with recurrent hotspots in the
    arginine-rich acidic domain (amino acid positions 1019, 1024, 1129). Variant
    position drives an allele-dependent molecular consequence: early-truncating
    variants (exons 1-15) are predicted to trigger NMD and haploinsufficiency
    and are associated with milder disease, whereas late-truncating variants
    (exons 16-17) escape NMD and are associated with more severe disease.
    Missense variants are reported but require variant-specific functional
    evidence.
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      Arboleda-Tham syndrome is autosomal dominant and almost always caused by a
      de novo KAT6A variant.
    evidence:
    - reference: PMID:25728775
      reference_title: "De novo nonsense mutations in KAT6A, a lysine acetyl-transferase gene, cause a syndrome including microcephaly and global developmental delay."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here, we report a syndrome caused by de novo heterozygous nonsense
        mutations in KAT6A (a.k.a., MOZ, MYST3) identified by clinical exome
        sequencing (CES) in four independent families.
      explanation: >-
        The founding series establishes de novo heterozygous KAT6A variants as
        causal.
  evidence:
  - reference: PMID:25728777
    reference_title: "Dominant mutations in KAT6A cause intellectual disability with recognizable syndromic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Finally, by detailed clinical characterization we provide evidence that
      heterozygous mutations in KAT6A cause a distinct intellectual disability
      syndrome.
    explanation: >-
      Establishes KAT6A as the causative gene for a distinct intellectual
      disability syndrome.
  - reference: PMID:30245513
    reference_title: "KAT6A Syndrome: genotype-phenotype correlation in 76 patients with pathogenic KAT6A variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our analysis identifies hotspot nonsense mutations within the penultimate
      exons at amino acid positions 1019, 1024, and 1129 that account for 19.1%
      (13/68) of pathogenic variants in unrelated individuals.
    explanation: >-
      Quantifies the recurrent truncating hotspots that make up a substantial
      fraction of pathogenic variants.

diagnosis:
- name: Exome or genome sequencing
  description: >-
    Diagnosis is molecular. Because the clinical features overlap many
    developmental syndromes and there is no single pathognomonic feature,
    identification of a heterozygous pathogenic KAT6A variant by exome (or
    genome) sequencing, typically trio-based to establish de novo status,
    establishes the diagnosis.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: >-
    A heterozygous pathogenic or likely pathogenic KAT6A variant confirms the
    diagnosis.
  evidence:
  - reference: PMID:25728775

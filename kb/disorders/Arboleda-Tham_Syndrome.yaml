      label: Autosomal dominant inheritance
  description: >-
    Arboleda-Tham syndrome is autosomal dominant and is almost always caused by
    a de novo heterozygous pathogenic KAT6A variant.
  evidence:
  - reference: PMID:25728775
    reference_title: "De novo nonsense mutations in KAT6A, a lysine acetyl-transferase gene, cause a syndrome including microcephaly and global developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report a syndrome caused by de novo heterozygous nonsense
      mutations in KAT6A (a.k.a., MOZ, MYST3) identified by clinical exome
      sequencing (CES) in four independent families.
    explanation: >-
      The founding series establishes heterozygous, de novo KAT6A variants as
      the cause, consistent with autosomal dominant inheritance.
  - reference: PMID:39740728
    reference_title: Phenotypic variability in a family with an inherited KAT6A frameshift variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report a Danish family, where an inherited KAT6A frameshift
      variant c.2710dup (p.(Glu904Glyfs∗12)) show clinical variability in
      disease phenotype expression among three family members.
    explanation: >-
      This family demonstrates that vertical transmission of a constitutional
      frameshift allele can occur and that expression is variable; de novo
      occurrence is usual rather than universal.
  expressivity: VARIABLE


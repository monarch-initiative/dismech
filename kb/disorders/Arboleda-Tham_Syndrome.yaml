    evidence_source: IN_VITRO
    snippet: >-
      We further demonstrate that KAT6A mutations result in dysregulation of
      H3K9 and H3K18 acetylation and altered P53 signaling.
    explanation: >-
      Directly supports dysregulated H3K9/H3K18 acetylation as the molecular
      consequence of KAT6A mutation.
  - reference: PMID:30245513
    reference_title: "KAT6A Syndrome: genotype-phenotype correlation in 76 patients with pathogenic KAT6A variants."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      KAT6A and KAT6B each function in a multi-subunit complex with three other
      proteins: BRPF1/2/3, ING5 and hEAF6
    explanation: >-
      Establishes the KAT6A histone-acetyltransferase complex through which the
      enzyme acts on histone H3.
  - reference: PMID:37861717
    reference_title: KAT6A mutations in Arboleda-Tham syndrome drive epigenetic regulation of posterior HOXC cluster.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Finally, we used unbiased proteomic mass spectrometry and identified two
      new histone post-translational modifications (PTMs) that are disrupted in
      ARTHS: H2A and H3K56 acetylation.
    explanation: >-

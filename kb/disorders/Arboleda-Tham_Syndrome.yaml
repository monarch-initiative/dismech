- name: Posterior HOXC Cluster Overexpression
  description: >-
    Multi-omic profiling of eight patient-derived dermal fibroblast lines found
    increased chromatin accessibility, H3K23 acetylation, gene-body DNA
    methylation, and overexpression across a posterior HOXC gene cluster. This
    is a reproducible human-cell molecular readout; fibroblasts do not establish
    which developmental tissues carry the same signature or whether HOXC
    overexpression causes particular clinical features.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: gene expression
    term:
      id: GO:0010467
      label: gene expression
    modifier: INCREASED
  evidence:
  - reference: PMID:37861717
    reference_title: KAT6A mutations in Arboleda-Tham syndrome drive epigenetic regulation of posterior HOXC cluster.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The genomic loci harboring HOXC genes are epigenetically regulated with
      increased chromatin accessibility, high levels of H3K23ac, and increased
      gene-body DNA methylation compared to controls, all of which are
      consistent with transcriptomic overexpression.
    explanation: >-
      This directly supports the coupled chromatin and transcriptional HOXC
      phenotype in patient fibroblasts while not assigning an unproven organ-level consequence.

- name: Impaired Neural Progenitor Proliferation and Differentiation
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Impaired Neuronal Maturation, Plasticity, and Postnatal Neurogenesis"
  description: >-
    In mouse neural stem and progenitor cells, loss of one or both Kat6a alleles
    disrupts H3K23 acetylation and MLL1 recruitment at developmental genes,
    impairing normal proliferation and neuronal differentiation. The result
    strengthens the developmental-neurobiology bridge but has not yet been
    demonstrated in patient-derived neural progenitors or human brain tissue.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: neural stem cell

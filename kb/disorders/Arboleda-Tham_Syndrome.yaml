      label: neuron differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:42081590
    reference_title: KAT6A is essential for developmental control gene expression in neural stem and progenitor cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our data suggests two modes of action for KAT6A: (1) acetylation of
      histone H3 on lysine 23 at promoters and enhancers and (2) recruitment of
      the trithorax group protein MLL1 (KMT2A) to promote the expression of
      developmental genes, including SOX and homeodomain genes.
    explanation: >-
      The mouse study identifies the two chromatin functions upstream of the
      neural-progenitor proliferation and differentiation defect.
  downstream:
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:42081590
      reference_title: KAT6A is essential for developmental control gene expression in neural stem and progenitor cells.

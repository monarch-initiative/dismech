    The initiating lesion is a heterozygous, usually de novo, pathogenic KAT6A
    variant. Most established alleles are protein-truncating (nonsense or
    frameshift), with recurrent hotspots in the arginine-rich acidic domain, and
    are distributed across the gene with a bias toward the last two exons.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: KAT6A
    term:
      id: hgnc:13013
      label: KAT6A
  evidence:

- name: Dysregulated Histone H3 Acetylation
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Permissive-Repressive Chromatin State Imbalance"
  description: >-
    KAT6A (MOZ/MYST3) is a MYST-family histone acetyltransferase that, within a
    complex containing BRPF1/2/3, ING5, and hEAF6, acetylates lysine residues on
    histone H3 tails (notably H3K9 and H3K18). Pathogenic variants dysregulate
    H3K9 and H3K18 acetylation, altering the chromatin state that governs
    developmental gene expression. (GO lacks a current, non-obsolete
    histone-H3-specific acetylation biological-process term; the H3 specificity
    is carried by the H3K9 and H3K18 molecular-function annotations.)
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

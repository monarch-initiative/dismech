- name: Pantothenate and L-Carnitine Supplementation
  description: >-
    An experimental, preclinical intervention. In patient-derived fibroblast
    models of KAT6A syndrome, pantothenate plus L-carnitine increased histone
    acetylation, partially corrected protein and transcriptomic expression
    patterns, and improved cell bioenergetics. This is in vitro evidence only
    and has not been evaluated as a clinical therapy.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: nutritional supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: pantothenate
      term:
        id: CHEBI:16454
        label: pantothenate
    - preferred_term: L-carnitine
      term:
        id: CHEBI:16347
        label: (R)-carnitine
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Mitochondrial and Bioenergetic Dysfunction
    treatment_effect: RESTORES
    description: >-
      Pantothenate (a CoA precursor) and L-carnitine act as mitochondrial
      boosting agents that improve the impaired cell bioenergetics of
      KAT6A-mutant fibroblasts in vitro; this is the mechanistic rationale for
      the intervention.
  evidence:
  - reference: PMID:36553567
    reference_title: "Pantothenate and L-Carnitine Supplementation Improves Pathological Alterations in Cellular Models of KAT6A Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Pantothenate and L-carnitine treatment increased histone acetylation and
      partially corrected protein and transcriptomic expression patterns in
      mutant KAT6A cells.
    explanation: >-
      Patient-derived fibroblast models show that pantothenate and L-carnitine
      partially correct KAT6A-associated cellular abnormalities, an experimental
      preclinical lead.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nearly all patients with FAP will also develop adenomas in the duodenum, but only 4 % to 10 % duodenal cancer"
    explanation: >-
      Confirms duodenal adenomas develop in nearly all FAP patients, though
      only a minority progress to duodenal cancer.
  - reference: DOI:10.1055/a-2011-1933

name: Familial Adenomatous Polyposis
creation_date: '2026-01-26T02:55:13Z'
description: >-
  Familial adenomatous polyposis (FAP) is an autosomal dominant hereditary cancer
  syndrome caused by germline pathogenic variants in the APC tumor suppressor gene.
  It is characterized by the development of hundreds to thousands of adenomatous
  polyps in the colon and rectum, with virtually 100% lifetime risk of colorectal
  cancer if untreated. FAP exemplifies the adenoma-carcinoma sequence and the role
  of Wnt/β-catenin pathway dysregulation in colorectal tumorigenesis. Extracolonic
  manifestations include desmoid tumors, duodenal adenomas, osteomas (Gardner syndrome),
  and congenital hypertrophy of the retinal pigment epithelium (CHRPE).
categories:
- Hereditary Cancer Syndrome
- Cancer Predisposition Syndrome
- Polyposis Syndrome
parents:
- hereditary cancer-predisposing syndrome
has_subtypes:
- name: Classic FAP
  description: >-
    Characterized by >100 colorectal adenomatous polyps, typically appearing in
    adolescence with polyposis by age 20-30. Without prophylactic colectomy,
    colorectal cancer develops by age 40 on average. Caused by mutations in the
    mutation cluster region (MCR) of APC.
  evidence:
  - reference: PMID:28668823
    reference_title: "Desmoid Tumors in Familial Adenomatous Polyposis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is characterized by the presence of hundreds of colonic polyps, which have a high tendency to undergo malignant transformation."
    explanation: >-
      Establishes the classic FAP phenotype as hundreds of colonic polyps
      with high malignant transformation potential.
- name: Attenuated FAP (AFAP)
  description: >-
    Milder phenotype with fewer polyps (10-100), later onset of polyposis,
    right-sided colon predominance, and delayed colorectal cancer risk (average
    age 50-55). Associated with mutations at the 5' or 3' ends of APC or in
    the alternatively spliced region of exon 9.
- name: Gardner Syndrome
  description: >-
    FAP variant with prominent extracolonic manifestations including osteomas
    (especially mandible and skull), epidermoid cysts, desmoid tumors, and
    dental abnormalities. Historically considered separate but now recognized
    as FAP with variable expressivity.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_apc_wnt_betacatenin_polyp_carcinoma_model
  hypothesis_label: Canonical APC / Wnt-β-Catenin / Polyp-to-Carcinoma Model
  status: CANONICAL
  description: >-
    Familial adenomatous polyposis (FAP) is caused by germline heterozygous loss-of-function variants in
    APC on 5q22.2 encoding the adenomatous polyposis coli tumor suppressor. APC normally serves as a
    scaffold in the β-catenin destruction complex (with Axin, GSK-3β, CK1) targeting β-catenin for
    ubiquitin-proteasomal degradation. Biallelic APC inactivation (germline + somatic 'second hit')
    stabilizes cytoplasmic β-catenin, allowing nuclear translocation and TCF/LEF-dependent transcription
    of pro-proliferative targets (MYC, CCND1, LGR5), initiating colorectal adenoma formation throughout
    the colon. Sequential acquisition of KRAS, TP53, and SMAD4 mutations follows the Vogelstein adenoma-
    carcinoma progression model, producing virtually 100% CRC risk by age 40 in classic FAP without
    intervention. Prophylactic colectomy is the standard of care; mouse Apc^Min/+ models recapitulate
    intestinal polyposis and validate the Wnt-axis as the canonical initiating lesion.
  notes: >-
    Retained as CANONICAL with mechanistic qualifications.
    The 2026 openscientist hypothesis-search report
    (kb/hypotheses/Familial_Adenomatous_Polyposis/canonical_apc_wnt_betacatenin_polyp_carcinoma_model)
    finds SUPPORTED. The core APC-loss → β-catenin
    stabilization → TCF/LEF-dependent proliferation → adenoma
    cascade is validated by biochemical reconstitution, near-100%
    untreated lifetime CRC risk, Apc^Min/+ mouse polyposis, and
    convergent APC/CTNNB1 mutations in extracolonic tumors
    (desmoids, thyroid, salivary). Three qualifications: (1) the
    'just-right' signaling model — second APC hits are non-
    randomly selected to produce OPTIMAL (not maximal) Wnt
    activation; truncating mutations after the SAMP-repeats are
    favored, producing intermediate β-catenin levels that maximize
    transformation; (2) APC has Wnt-independent tumor-suppressive
    functions including chromosomal instability regulation, DNA
    replication control, and cytoskeletal/microtubule regulation,
    explaining why complete APC loss often differs from CTNNB1
    activation; (3) some colorectal cancer contexts show lack of
    correlation between APC mutation and β-catenin nuclear
    localization, challenging the assumption that Wnt activation
    is the sole mechanistic output of APC loss (documented in
    early-onset sporadic rectal cancer rather than in FAP
    adenomas; see the discussions entry). ClinGen's Hereditary
    Cancer Gene Curation Expert Panel classifies the APC gene-disease
    relationship with classic or attenuated FAP as Definitive; the
    separate ClinGen InSiGHT Variant Curation Expert Panel maintains
    APC-specific ACMG/AMP criteria for classifying individual germline
    variants. These are different products and the second does not
    establish the first.
  evidence:
  - reference: PMID:28668823
    reference_title: "Desmoid Tumors in Familial Adenomatous Polyposis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is characterized by the presence of hundreds of colonic polyps, which have a high tendency to undergo malignant transformation."
    explanation: >
      Existing canonical mechanism citation in the dismech
      knowledge base, used as the seed for the hypothesis-search
      deep-research run.
  - reference: PMID:34352208
    reference_title: >-
      Reconstitution of the destruction complex defines roles of AXIN polymers and
      APC in β-catenin capture, phosphorylation, and ubiquitylation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We reveal that AXIN1 polymerization and APC promote β-catenin capture, phosphorylation, and ubiquitylation."
    explanation: >-
      Reconstitution of the human destruction complex from purified components
      grounds the scaffolding role this hypothesis assigns to APC at the
      biochemical level, independent of cellular context.
  - reference: PMID:34352208
    reference_title: >-
      Reconstitution of the destruction complex defines roles of AXIN polymers and
      APC in β-catenin capture, phosphorylation, and ubiquitylation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Oncogenic APC truncation variants, although part of the complex, are functionally impaired."
    explanation: >-
      The truncating alleles that cause FAP still assemble into the destruction
      complex but cannot perform its function, which is the molecular form the
      loss-of-function step of this hypothesis takes.
  - reference: PMID:12045208
    reference_title: >-
      The 'just-right' signaling model: APC somatic mutations are selected based on
      a specific level of activation of the beta-catenin signaling cascade.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that this selection process is aimed at a specific degree of beta-catenin signaling optimal for tumor formation, rather than at its constitutive activation by deletion of all of the beta-catenin downregulating motifs in APC."
    explanation: >-
      Analysis of 133 adenomas from six FAP patients is the primary source for the
      just-right qualification recorded in the notes above: second hits are
      co-selected for an intermediate rather than a maximal level of β-catenin
      signalling, so complete APC inactivation is not what tumours select for.
  - reference: PMID:11283620
    reference_title: Mutations in the APC tumour suppressor gene cause chromosomal instability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We conclude that loss of APC sequences that lie C-terminal to the beta-catenin regulatory domain contributes to chromosomal instability in colorectal cancer."
    explanation: >-
      Primary source for the second qualification in the notes above: the APC
      sequences whose loss drives chromosomal instability lie outside the
      β-catenin regulatory domain, so this arm of APC tumour suppression does not
      run through Wnt signalling.
  - reference: PMID:36586069
    reference_title: >-
      To β or Not to β: Lack of Correlation Between APC Mutation and β-Catenin
      Nuclear Localization in Colorectal Cancer.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we provide evidence for a surprising lack of correlation between APC mutation and β-catenin nuclear localization in early-onset sporadic rectal cancer samples."
    explanation: >-
      Cuts against the hypothesis's assumption that APC inactivation invariably
      produces nuclear β-catenin. It qualifies rather than overturns the model:
      the series is early-onset sporadic rectal cancer, not FAP adenomas, and the
      discordance is reported by a single group with cell-line validation.
pathophysiology:
- name: APC Tumor Suppressor Loss
  conforms_to: "germline_two_hit_tumor_predisposition#Biallelic Tumor Suppressor Inactivation in a Susceptible Cell"
  description: >-
    Germline heterozygous APC mutations result in one functional allele. Somatic
    loss or mutation of the remaining wild-type allele (second hit) eliminates
    APC function, initiating adenoma formation. This follows Knudson's two-hit
    hypothesis for tumor suppressor gene inactivation.
  cell_types:
  - preferred_term: intestinal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  - preferred_term: LGR5+ intestinal crypt stem cell
    term:
      id: CL:0002250
      label: intestinal crypt stem cell
  locations:
  - preferred_term: colon
    term:
      id: UBERON:0001155
      label: colon
  downstream:
  - target: Wnt/β-Catenin Pathway Activation
    description: APC loss prevents β-catenin degradation
  - target: APC-Driven Chromosomal Instability
    causal_link_type: DIRECT
    description: >-
      Loss of the APC sequences C-terminal to the β-catenin regulatory domain
      disrupts kinetochore-microtubule attachment, a tumour-suppressive function
      that is separate from Wnt regulation.
  evidence:
  - reference: PMID:28668823
    reference_title: "Desmoid Tumors in Familial Adenomatous Polyposis."
    supports: SUPPORT
    snippet: >-
      In agreement with Knudson's 'two-hit' theory, the inactivation of the residual
      APC gene in FAP is a critical step in the development of both colorectal
      cancer and desmoids.
    explanation: >-
      Confirms that FAP follows the two-hit mechanism for both colorectal cancer
      and desmoid tumor development.
  - reference: PMID:19092804
    reference_title: Crypt stem cells as the cells-of-origin of intestinal cancer.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that deletion of Apc in these stem cells leads to their \ntransformation within days."
    explanation: >-
      Lineage tracing in Lgr5-CreER mice establishes the long-lived crypt stem cell
      as the cell in which APC loss initiates neoplasia, which is why this node is
      annotated with the crypt stem cell as well as the generic intestinal
      epithelial cell.
  - reference: PMID:19092804
    reference_title: Crypt stem cells as the cells-of-origin of intestinal cancer.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "When Apc is deleted in short-lived transit-amplifying cells using a different \ncre mouse, the growth of the induced microadenomas rapidly stalls."
    explanation: >-
      The negative arm of the same experiment: APC loss in transit-amplifying cells
      does not sustain adenoma growth, so the initiating step is restricted to the
      stem cell compartment rather than being a general epithelial effect.
- name: APC-Driven Chromosomal Instability
  biological_scale: CELLULAR
  description: >-
    APC accumulates at the kinetochore during mitosis and is required for efficient
    microtubule attachment. Truncating alleles that remove the APC sequences
    C-terminal to the β-catenin regulatory domain produce chromosome and spindle
    aberrations, so APC loss drives aneuploidy through a route that does not pass
    through β-catenin. This parallel arm is thought to accelerate the accumulation
    of the additional driver lesions required for adenomas to become carcinomas,
    and it is the reason Wnt-directed intervention alone may not capture the whole
    consequence of APC loss.
  cell_types:
  - preferred_term: intestinal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  biological_processes:
  - preferred_term: chromosome segregation
    modifier: ABNORMAL
    term:
      id: GO:0007059
      label: chromosome segregation
  downstream:
  - target: Colorectal Cancer Progression
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Aneuploidy accelerates acquisition of the additional driver mutations that
      convert adenomas to invasive carcinoma.
  evidence:
  - reference: PMID:11283620
    reference_title: Mutations in the APC tumour suppressor gene cause chromosomal instability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that Apc mutant ES cells display extensive chromosome and spindle aberrations, providing genetic evidence for a role of APC in chromosome segregation."
    explanation: >-
      Direct genetic evidence that APC loss disrupts chromosome segregation,
      establishing this node as a consequence of APC inactivation rather than of
      Wnt pathway output.
  - reference: PMID:11283620
    reference_title: Mutations in the APC tumour suppressor gene cause chromosomal instability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Apc mutant cells form mitotic spindles with an abundance of microtubules that inefficiently connect with kinetochores."
    explanation: >-
      Names the specific mitotic defect behind the instability, and pairs with the
      report that APC accumulates at the kinetochore during mitosis.
  notes: >-
    Added from the 2026 openscientist hypothesis-search assessment as the
    Wnt-independent arm of APC tumour suppression. Evidence is mouse embryonic stem
    cells and human colorectal cancer cell lines; the relative contribution of this
    arm versus Wnt deregulation to human FAP tumorigenesis has not been separated
    experimentally, which is recorded as a knowledge gap in the discussions section.
- name: Wnt/β-Catenin Pathway Activation
  description: >-
    APC normally functions in the destruction complex (with Axin, GSK3β, CK1)
    to phosphorylate β-catenin, targeting it for ubiquitination and proteasomal
    degradation. Loss of APC allows β-catenin to accumulate, translocate to the
    nucleus, and activate Wnt target genes driving proliferation.
  biological_processes:
  - preferred_term: Wnt signaling pathway
    modifier: INCREASED
    term:
      id: GO:0016055
      label: Wnt signaling pathway
  downstream:
  - target: Uncontrolled Intestinal Epithelial Proliferation
    description: β-catenin activates proliferative and stemness genes
  evidence:
  - reference: PMID:28668823
    reference_title: "Desmoid Tumors in Familial Adenomatous Polyposis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "germline mutations affect the functional domains of the APC gene that are responsible for interactions of the transcript with β-catenin"
    explanation: >-
      Confirms that pathogenic APC variants disrupt the APC–β-catenin
      interaction domains, the molecular basis for Wnt pathway dysregulation
      downstream of APC loss.
- name: Uncontrolled Intestinal Epithelial Proliferation
  description: >-
    Nuclear β-catenin activates TCF/LEF transcription factors, driving expression
    of Wnt target genes including MYC, CCND1 (cyclin D1), and others that promote
    cell cycle progression. This results in uncontrolled proliferation of
    intestinal crypt cells, forming adenomatous polyps.
  cell_types:
  - preferred_term: intestinal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  downstream:
  - target: Adenoma Formation
    description: Hyperproliferative epithelium forms adenomatous polyps
- name: Adenoma Formation
  conforms_to: "germline_two_hit_tumor_predisposition#Clonal Expansion and Tumor Initiation"
  description: >-
    Sustained Wnt pathway activation drives adenoma development. Adenomas are
    benign neoplasms but represent the first step in the adenoma-carcinoma
    sequence. In FAP, hundreds to thousands of adenomas develop, dramatically
    increasing the probability that one will progress to carcinoma.
  locations:
  - preferred_term: colon
    term:
      id: UBERON:0001155
      label: colon
  - preferred_term: rectum
    term:
      id: UBERON:0001052
      label: rectum
  downstream:
  - target: Colorectal Polyposis
    causal_link_type: DIRECT
    description: Wnt-driven intestinal epithelial adenoma formation produces the hundreds of colonic polyps that define FAP.
    evidence:
    - reference: PMID:28668823
      reference_title: "Desmoid Tumors in Familial Adenomatous Polyposis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It is characterized by the presence of hundreds of colonic polyps, which have a high tendency to undergo malignant transformation."
      explanation: Supports colorectal polyposis as the direct adenoma phenotype in FAP.
  - target: Colorectal Cancer Progression
    description: Accumulated mutations drive adenoma-to-carcinoma progression
  evidence:
  - reference: PMID:28668823
    reference_title: "Desmoid Tumors in Familial Adenomatous Polyposis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is characterized by the presence of hundreds of colonic polyps, which have a high tendency to undergo malignant transformation."
    explanation: >-
      Hundreds of colonic adenomas with high transformation potential is the
      defining FAP feature that drives near-certain malignant progression.
- name: Colorectal Cancer Progression
  description: >-
    Adenomas acquire additional mutations in KRAS, TP53, SMAD4, and other genes
    through the adenoma-carcinoma sequence. In FAP, the large number of adenomas
    makes it virtually certain that at least one will progress to invasive
    adenocarcinoma without intervention.
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:28668823
    reference_title: "Desmoid Tumors in Familial Adenomatous Polyposis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In agreement with Knudson's 'two-hit' theory, the inactivation of the residual APC gene in FAP is a critical step in the development of both colorectal cancer and desmoids."
    explanation: >-
      Two-hit inactivation of APC is the critical molecular step in FAP-driven
      colorectal cancer development.
  downstream:
  - target: Colorectal Cancer
    causal_link_type: DIRECT
    description: APC two-hit progression in FAP adenomas drives colorectal cancer development.
    evidence:
    - reference: PMID:28668823
      reference_title: "Desmoid Tumors in Familial Adenomatous Polyposis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In agreement with Knudson's 'two-hit' theory, the inactivation of the residual APC gene in FAP is a critical step in the development of both colorectal cancer and desmoids."
      explanation: Supports colorectal cancer as a downstream outcome of APC-driven FAP progression.
phenotypes:
- category: Gastrointestinal
  name: Colorectal Polyposis
  frequency: OBLIGATE
  diagnostic: true
  description: >-
    Hundreds to thousands of adenomatous polyps carpet the colon and rectum.
    Polyps typically appear in adolescence in classic FAP. The number and
    density of polyps correlates with mutation location in APC.
  phenotype_term:
    preferred_term: Large intestinal polyposis
    term:
      id: HP:0030255
      label: Large intestinal polyposis
  evidence:
  - reference: PMID:28668823
    reference_title: "Desmoid Tumors in Familial Adenomatous Polyposis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is characterized by the presence of hundreds of colonic polyps, which have a high tendency to undergo malignant transformation."
    explanation: >-
      The defining FAP phenotype is the presence of hundreds of colonic
      adenomatous polyps.
- category: Neoplastic
  name: Colorectal Cancer
  frequency: VERY_FREQUENT
  description: >-
    Without prophylactic surgery, colorectal cancer develops in nearly 100%
    of patients with classic FAP, typically by age 40. The average age of
    cancer diagnosis is 39 years without surveillance/intervention. The age at
    which risk rises is genotype dependent rather than uniform: in a genetically
    confirmed Japanese registry cohort the risk of stage II-IV colorectal cancer
    rose sharply at about age 34 in patients whose variant lay outside the
    attenuated-FAP-associated regions and only at about age 49 in those whose
    variant lay inside them.
  phenotype_term:
    preferred_term: Colon cancer
    term:
      id: HP:0003003
      label: Colon cancer
  evidence:
  - reference: PMID:28668823
    reference_title: "Desmoid Tumors in Familial Adenomatous Polyposis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In agreement with Knudson's 'two-hit' theory, the inactivation of the residual APC gene in FAP is a critical step in the development of both colorectal cancer and desmoids."
    explanation: >-
      Colorectal cancer is the principal malignant outcome of FAP,
      driven by two-hit APC inactivation.
  - reference: PMID:37853284
    reference_title: >-
      Usefulness of genotyping APC gene for individualizing management of patients
      with familial adenomatous polyposis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk of stage II-IV CRC was estimated to increase markedly at the age of 49\xA0years in the Genotype-1 patients and 34\xA0years in the Genotype-2 patients, respectively."
    explanation: >-
      Source for the genotype-dependent timing sentence added above. Genotype-1 is
      defined in this study as variants in attenuated-FAP-associated regions and
      Genotype-2 as all others, so the 34-versus-49 split is a genotype effect on
      when to intervene, not on whether cancer eventually occurs. Bounds worth
      keeping in view: 171 patients in a retrospective Japanese multicentre
      registry, and the inflection is specific to stage II-IV disease.
- category: Gastrointestinal
  name: Duodenal Adenomas
  frequency: VERY_FREQUENT
  description: >-
    Duodenal adenomas, especially periampullary, develop in nearly all FAP
    patients. They carry risk of progression to duodenal/ampullary
    adenocarcinoma, which is a leading cause of death in post-colectomy FAP
    patients.
  phenotype_term:
    preferred_term: Small intestinal polyposis
    term:
      id: HP:0030256
      label: Small intestinal polyposis
  evidence:
  - reference: DOI:10.1055/a-2011-1933

biochemical:
- name: APC Genetic Testing
  notes: >-
    Molecular testing identifies germline APC mutations in 70-90% of classic FAP
    families. Mutations include truncating variants, large deletions, and deep
    intronic variants. Genotype-phenotype correlations exist: mutations in the
    MCR (codons 1250-1464) cause severe polyposis; 5'/3' mutations cause AFAP.
genetic:
- name: APC
  gene_term:
    preferred_term: APC
    term:
      id: hgnc:583
      label: APC
  association: Germline Loss-of-Function Mutations
  inheritance:
  - name: Autosomal Dominant
  notes: >-
    APC (5q22.2) encodes adenomatous polyposis coli, a key component of the
    β-catenin destruction complex. Most germline mutations are truncating
    (nonsense, frameshift) resulting in loss of function. De novo mutations
    account for 20-30% of cases. Mutation location correlates with phenotype:
    MCR mutations (codons 1250-1464) cause classic severe FAP; 5' mutations
    (before codon 157) and 3' mutations (after codon 1595) cause attenuated FAP.
    Postzygotic APC mosaicism is a further route to the same phenotype and
    accounts for a substantial share of polyposis that germline testing leaves
    unexplained; detection depends on the sequencing method and on the tissue
    assayed, with multiple colorectal adenomas more informative than leukocyte
    DNA.
  evidence:
  - reference: PMID:28668823
    reference_title: "Desmoid Tumors in Familial Adenomatous Polyposis."
    supports: SUPPORT
    snippet: >-
      Several lines of evidence show that germline mutations affect the functional
      domains of the APC gene that are responsible for interactions of the transcript
      with β-catenin, whereas somatic second mutations involve the downstream region
      of the gene.
    explanation: >-
      Supports APC domain involvement and second-hit pattern, but does not fully
      cover all detailed genotype-phenotype and de novo rate claims in this entry.
  - reference: PMID:18433509
    reference_title: >-
      Clinical characterization and the mutation spectrum in Swedish adenomatous
      polyposis families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Probands with a genotype (codon 1250-1464) predicting a severe phenotype had a median age at diagnosis of 21.8 (range, 11-49) years compared with 34.4 (range, 14-57) years among those with mutations outside this region (P < 0.017)."
    explanation: >-
      Substantiates the mutation-cluster-region genotype-phenotype claim asserted in
      the notes above, in 96 unrelated families from the Swedish Polyposis Registry.
      The same series reports dense polyposis (>1000 adenomas) in 75% of severe
      versus 30% of non-severe genotypes.
  - reference: PMID:40237877
    reference_title: >-
      A review of APC somatic mosaicism and specific APC variants - I1307K and
      promotor variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "APC somatic (postzygotic) mosaicism can be identified in up to 50% of unexplained adenomatous polyposis cases."
    explanation: >-
      Source for the mosaicism sentence added to the notes above. Mosaicism extends
      APC's causal role to polyposis that germline testing scores as mutation
      negative, which changes both the testing strategy and the risk assessment
      offered to relatives.
  - reference: PMID:40237877
    reference_title: >-

discussions:
- discussion_id: apc_beta_catenin_nuclear_localization_discordance
  prompt: >-
    Does APC inactivation invariably produce nuclear β-catenin accumulation in FAP
    adenomas, or can APC loss drive tumorigenesis with transcriptional Wnt output
    decoupled from β-catenin nuclear localization?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Wnt/β-Catenin Pathway Activation
  rationale: >-
    The edge from APC loss to nuclear β-catenin is the load-bearing step of the
    canonical model, and it has been reported not to hold. Bala et al. found no
    correlation between APC mutation and β-catenin nuclear localization on serial
    sections of the same tumour regions, and could not explain the discordance by
    KRAS status; the result reproduced in colorectal cancer cell lines carrying
    various APC mutations. The scope limit matters: those samples are early-onset
    sporadic rectal cancers, not FAP adenomas, so the gap is whether the same
    decoupling occurs in the germline-APC setting this entry models. Spatial
    heterogeneity of Wnt output within a tumour could explain part of the finding
    as an immunohistochemistry sampling artefact, but has not been shown to explain
    all of it. If the decoupling is real in FAP, then nuclear β-catenin is an
    unreliable pharmacodynamic readout for Wnt-directed intervention, and part of
    APC's tumour-initiating function runs through some other output.
  proposed_experiments:
  - experiment_id: exp_fap_acute_apc_deletion_beta_catenin_dynamics
    name: Single-cell β-catenin dynamics after acute APC deletion in FAP organoids
    description: >-
      Induce acute biallelic APC deletion with inducible Cre in patient-derived
      intestinal organoids from FAP carriers and from non-carrier controls, then
      track β-catenin subcellular localization, TCF/LEF transcriptional output, and
      cell fate at single-cell resolution over roughly two weeks. Read nuclear
      β-catenin by immunocytochemistry against Wnt target gene expression by
      single-cell RNA sequencing in the same cells, and score a chromosomal
      instability marker in parallel so a discordant cell can be checked for the
      alternative APC output.
    would_support:
    - pathophysiology#Wnt/β-Catenin Pathway Activation
    supporting_outcome: >-
      APC deletion is followed in essentially every transformed cell by nuclear
      β-catenin accumulation together with matching TCF/LEF target induction,
      making the reported discordance an artefact of fixed-tissue sampling or of
      the sporadic rectal cancer context.
    refuting_outcome: >-
      A reproducible subpopulation shows Wnt target induction without nuclear
      β-catenin, or transformation without either, identifying conditions under
      which the canonical APC to nuclear β-catenin link does not hold in cells of
      FAP origin.
  evidence:
  - reference: PMID:36586069
    reference_title: >-
      To β or Not to β: Lack of Correlation Between APC Mutation and β-Catenin
      Nuclear Localization in Colorectal Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The lack of correlation was validated in CRC cell lines harboring various APC mutations."
    explanation: >-
      Establishes that the discordance survives in a controlled cell-line setting
      rather than being a property of one tissue series, which is what makes it a
      knowledge gap rather than a sampling complaint.
  notes: >-
    Raised from the 2026 openscientist hypothesis-search report, whose Gap 1 flags
    this as the highest-impact challenge to the canonical model. The assessment
    sidecar qualifies the claim on scope (sporadic early-onset rectal cancer, not
    FAP).
- discussion_id: wnt_versus_chromosomal_instability_contribution
  prompt: >-
    How much of APC's tumour-suppressive function in FAP is carried by Wnt
    regulation and how much by its role in chromosome segregation, and does that
    balance differ between adenoma initiation and progression to carcinoma?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#APC-Driven Chromosomal Instability
  - pathophysiology#Wnt/β-Catenin Pathway Activation
  rationale: >-
    Both arms are established individually. APC loss deregulates β-catenin, and
    separately produces chromosome and spindle aberrations through sequences lying
    C-terminal to the β-catenin regulatory domain. What has not been done is a
    separation-of-function experiment that quantifies their relative contributions,
    so the entry carries two parallel edges out of APC loss without being able to
    weight them. This is not an academic point: if instability contributes
    materially to initiation rather than only to progression, an intervention that
    normalises Wnt output would leave part of the mechanism running.
  proposed_experiments:
  - experiment_id: exp_apc_separation_of_function_alleles
    name: Separation-of-function APC alleles in intestinal organoids
    description: >-
      Engineer APC variants that retain β-catenin regulation but lose the
      kinetochore-associated function, and the converse, then express each in
      Apc-null intestinal organoids. Score adenoma-like outgrowth, karyotype
      stability, and progression kinetics as separate outcomes rather than as a
      single transformation endpoint.
    would_support:
    - pathophysiology#APC-Driven Chromosomal Instability
    supporting_outcome: >-
      A Wnt-competent but instability-deficient APC allele fails to suppress
      transformation fully, showing that chromosome segregation control is a
      non-redundant part of APC tumour suppression.
    refuting_outcome: >-
      A Wnt-competent APC allele suppresses outgrowth as completely as wild-type
      APC regardless of its effect on segregation, placing the instability arm
      downstream of, or incidental to, Wnt deregulation in this setting.
  notes: >-
    Raised from the 2026 openscientist hypothesis-search report Gap 2. The
    supporting sources for the instability arm itself are cited on the
    pathophysiology node; nothing is cited here because the gap is precisely that
    the comparative experiment has not been reported.
- discussion_id: human_fap_polyp_burden_modifier_genes
  prompt: >-
    Which human genetic modifiers account for the variation in polyp burden and age
    at diagnosis seen among FAP patients carrying the same APC variant?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Colorectal Polyposis
  rationale: >-
    Mouse work established that background genotype alone changes adenoma
    multiplicity several fold at a fixed Apc mutation, so modifiers are real in
    principle, and intrafamilial variability in FAP families sharing one APC
    variant says they are likely real in patients. The human loci are unidentified.
    The mouse candidate that came closest, Pla2g2a at the Mom1 locus, did not
    transfer: human studies did not confirm PLA2G2A as a major modifier because the
    relevant functional polymorphism does not exist in humans. Until human
    modifiers are known, APC genotype is the only stratifier available for deciding
    surveillance intensity and the timing of prophylactic surgery, and it does not
    explain the observed spread.
  proposed_experiments:
  - experiment_id: exp_fap_modifier_gwas
    name: Modifier GWAS across FAP registries stratified by APC genotype
    description: >-
      Assemble more than 500 genetically confirmed FAP patients across national
      polyposis registries, use cumulative polyp burden and age at first adenoma as
      quantitative phenotypes, and adjust for APC variant position so that the
      known genotype effect does not absorb the modifier signal.
    would_support:
    - phenotypes#Colorectal Polyposis
    supporting_outcome: >-
      Replicating modifier loci reach significance for polyp burden independently
      of APC variant position, giving a stratifier that APC genotype alone does not
      provide.
    refuting_outcome: >-
      No locus reaches significance at adequate power, indicating the residual
      variation is environmental, stochastic, or driven by rare variants that a
      common-variant scan cannot see.
  evidence:
  - reference: PMID:15710876
    reference_title: >-
      Genetic basis of variation in adenoma multiplicity in ApcMin/+ Mom1S mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Unfortunately, studies in humans did not confirmPLA2G2Aas a major modifier of colorectal cancer risk in humans because functional polymorphic variation did not exist"
    explanation: >-
      Records the failure of the leading mouse modifier candidate to transfer to
      humans, which is what leaves the human modifier question open. Note the
      quoted sentence comes from the paper's own account of prior work; the study
      itself attributes its 3-to-5-fold multiplicity difference to a locus near Apc
      or to structural variation on chromosome 18, not to Mom1/Pla2g2a.
  notes: >-
    Raised from the 2026 openscientist hypothesis-search report Gap 4. The
    assessment sidecar qualifies that report's attribution of the mouse effect to
    Mom1/Pla2g2a. Missing spaces in the quoted snippet are an artefact of the
    cached full text and are reproduced verbatim.

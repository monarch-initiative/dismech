datasets:
- accession: ega:EGAS00001003598
  title: Single cell transcriptomic and genomic profiling of carcinogenesis in patients with familial adenomatous polyposis
  description: Familial Adenomatous Polyposis (FAP) is characterized by hundreds to thousands of adenocarcinomas at different evolutional stages in the colon and rectum. Much effort has been made to illuminate the key genomic alterations that facilitate the transition from adenoma to carcinoma. However, the strong heterogeneity of the tumors may hamper these efforts. Here, by sequencing matched adjacent normal tissues, adenomas at different stages and carcinomas from the same patient, we precisely traced the process of colorectal carcinogenesis.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Familial Adenomatous Polyposis"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: dbgap:phs000904
  title: APC Promoter Deletion in Classic Familial Adenomatous Polyposis
  description:  The ~80% of individuals with classic familial adenomatous polyposis (FAP) have detectable mutations in the coding sequence of the adenomatous polyposis coli (APC) gene. To investigate the 20% of families without detectable causative mutations, we used exome sequencing and second-generation sequencing of the APC locus including non-coding regions. We identified a novel ~11kb deletion 44kb upstream of APC that was present only in affected individuals of three kindreds.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from dbgap. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Familial Adenomatous Polyposis"). Retrieved 2026-08-02.

treatments:
- name: Prophylactic Colectomy
  description: >-
    Surgical removal of the colon is the primary management to prevent colorectal
    cancer. Options include total proctocolectomy with ileal pouch-anal anastomosis
    (IPAA) or subtotal colectomy with ileorectal anastomosis (IRA). Timing is
    typically in late teens/early twenties or when polyp burden becomes
    unmanageable endoscopically.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:20301519
    reference_title: "APC-Associated Polyposis Conditions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Colectomy to reduce the risk for CRC in individuals with \nclassic FAP"
    explanation: >-
      GeneReviews recommends colectomy as the standard measure to prevent
      colorectal cancer in classic FAP.
- name: Endoscopic Surveillance
  description: >-
    Colonoscopy every one to two years beginning at age 10-15 years in at-risk
    individuals with classic FAP (late adolescence in attenuated FAP) to detect
    polyp development. Esophagogastroduodenoscopy with visualization of the
    ampulla of Vater by age 20-25 years or prior to colon surgery, with duodenal
    adenoma burden graded by Spigelman stage. Surveillance of rectal stump or
    pouch after colectomy.
  treatment_term:
    preferred_term: colonoscopy
    term:
      id: NCIT:C16450
      label: Colonoscopy
  evidence:
  - reference: PMID:20301519
    reference_title: "APC-Associated Polyposis Conditions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Colorectal \nscreening by colonoscopy every one to two years beginning at age ten to 15 years \nfor classic FAP and in late adolescence for attenuated FAP"
    explanation: >-
      GeneReviews specifies the colonoscopy surveillance interval and starting
      age for classic and attenuated FAP.
  - reference: PMID:20301519
    reference_title: "APC-Associated Polyposis Conditions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "esophagogastroduodenoscopy with visualization of the ampulla of Vater by age 20 \nto 25 years or prior to colon surgery, with consideration of complete small \nbowel visualization in the setting of advanced Spigelman stage"
    explanation: >-
      GeneReviews specifies the upper-endoscopy surveillance recommendation,
      including ampullary visualization and the role of Spigelman stage.
- name: Genetic Counseling
  description: >-
    Genetic counseling and testing for at-risk family members. Children of

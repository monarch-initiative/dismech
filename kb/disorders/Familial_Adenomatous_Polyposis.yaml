    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ability to identify APC postzygotic mosaicism depends on the the detection method (today usually next-generation sequencing) and also the tissue being analysed (investigation of multiple colorectal adenomas is more sensitive than leukocyte DNA)."
    explanation: >-

  - target: Failure of Ectodermal Appendage Morphogenesis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24075906
    reference_title: "Forward genetics identifies Kdf1/1810019J16Rik as an essential regulator of the proliferation-differentiation decision in epidermal progenitor cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Consequently, Kdf1 mutants display both uncontrolled cell proliferation in
      the epidermis and failure to develop terminal fates.
    explanation: >-
      Documents both halves of this node - excess proliferation and failed
      differentiation - in the Kdf1 mutant, which is what the node asserts.
  - reference: PMID:24075906
    reference_title: "Forward genetics identifies Kdf1/1810019J16Rik as an essential regulator of the proliferation-differentiation decision in epidermal progenitor cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Specifically, Kdf1 is expressed both in epidermal progenitor cells where it

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband revealed multiple missing teeth, caries and extensive
      periodontal disease.
    explanation: >-
      Documents the dental burden - agenesis together with caries and
      periodontal disease - that this management entry addresses.
- name: Genetic Counseling
  description: >-
    Autosomal dominant transmission with a 50% recurrence risk for each
    offspring of a carrier. Counselling is the intervention the primary
    literature explicitly names, including for prenatal detection: the Greek
    family's variant was found after the birth of a child with natal teeth, and
    both affected children had entirely normal prenatal scans, so there is no
    ultrasound finding to rely on.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:40463401
    reference_title: "Novel familial KDF1 mutation detected in members of a three-generation family with clinical manifestations of ectodermal dysplasia: A report of four cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, they are crucial for genetic counseling, particularly in cases
      where this KDF1 mutation is detected prenatally.
    explanation: Names genetic counselling, including prenatally, as the clinical use of this finding.
  - reference: PMID:40463401
    reference_title: "Novel familial KDF1 mutation detected in members of a three-generation family with clinical manifestations of ectodermal dysplasia: A report of four cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prenatal ultrasound examination of III-1 and III-2 during pregnancy did not
      reveal any anomalies.
    explanation: >-
      Supports the counselling point that prenatal imaging is uninformative in
      this disease, so detection is molecular.

discussions:
- discussion_id: ectd12_dominant_missense_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what protein-level mechanism does a heterozygous KDF1 missense variant
    cause ectodermal dysplasia, when the supporting mouse evidence is a
    homozygous null?
  rationale: >-
    Every reported human KDF1 allele is a heterozygous missense change, and the
    syndromic ones cluster in one 25-residue window of the DUF4656 domain. A
    clustered dominant missense series is the signature of a dominant-negative
    or gain-of-function mechanism rather than of haploinsufficiency, and one
    report does describe gain-of-function KDF1 alleles stabilising IkappaB
    kinase alpha. But the causal argument in the literature rests on the
    Kdf1-/- mouse phenocopy, which models complete loss. Nobody has tested a
    human missense allele against the wild-type protein in the same system, so
    the direction of effect is unresolved. It matters for variant
    interpretation: a truncating KDF1 allele found incidentally would be
    predicted benign under a dominant-negative model and pathogenic under a
    haploinsufficiency one.
  attaches_to:
  - pathophysiology#KDF1 Variant in the DUF4656 Domain
  - genetic#KDF1
- discussion_id: ectd12_domain_position_vs_presentation
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does variant position within KDF1, rather than variant severity,
    determine whether the presentation is syndromic ectodermal dysplasia or
    isolated tooth agenesis?
  rationale: >-
    The 14-case review separates the two presentations cleanly by position: the
    ectodermal-dysplasia alleles fall in amino acids 251-275 inside the DUF4656
    domain, the tooth-only alleles to either side. If that holds it implies the
    domain mediates a function needed in skin, hair and sweat gland but
    dispensable in the tooth germ, which would be a testable statement about
    KDF1 protein interactions in different appendage lineages. The review is
    retrospective across heterogeneous reports with no functional work on the
    position difference, so the pattern could also be ascertainment: patients
    found through a dental clinic are phenotyped for teeth.
  attaches_to:
  - pathophysiology#KDF1 Variant in the DUF4656 Domain
  - pathophysiology#Failure of Ectodermal Appendage Morphogenesis
treatments:
- name: Dental Rehabilitation
  description: >-
    Prosthetic and restorative dental management is the mainstay, since tooth
    agenesis is the dominant functional problem. Carriers in the reported
    families presented with extensive caries and periodontal disease alongside
    the missing teeth, so restorative and periodontal care is part of
    management, not separate from it. No disease-modifying therapy exists.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: dental rehabilitation and prosthetic management
    term:
      id: NCIT:C38052
      label: Dental Procedure
  evidence:

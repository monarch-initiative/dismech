phenotypes:
- category: Dental
  name: Tooth agenesis
  description: >-
    The most consistent feature. Six of six affected members of the defining
    Saudi family had lost all their teeth by the time of report, at ages from 16
    to 52; carriers in the Greek family had hypodontia in adulthood. Where the
    agenesis is complete and isolated the presentation is anodontia without
    syndromic features, which is a different allelic class.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Tooth agenesis
    term:
      id: HP:0009804
      label: Tooth agenesis

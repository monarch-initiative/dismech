notes: >-
  No GeneReviews chapter names this disease. Verified with `just
  check-genereviews --online` against the committed Bookshelf index snapshot of
  2026-09-10 plus a live PubMed title search, with the entry's five synonyms in
  place: NO_CHAPTER for both GeneReviews and StatPearls. The GeneReviews
  chapter on hypohidrotic ectodermal dysplasia covers the EDA/EDAR/EDARADD
  genes and does not name KDF1, so it is not the baseline for this entry; the
  baseline is the primary case literature plus the 14-case genotype-phenotype
  review in PMID:38501196.
  Two papers are cited in `references:` without an inline evidence item because
  PubMed holds no abstract text for either, and a snippet has to be an exact
  quote from cached content: PMID:30977908 (a research letter substantiating
  KDF1 with a de novo variant) and PMID:37144643 (gain-of-function KDF1
  variants causing hidradenitis suppurativa with ectodermal dysplasia by
  stabilising IkappaB kinase alpha). The IKK-alpha arm of the pathograph is
  nonetheless fully sourced, from PMID:32239614, which establishes the
  KDF1-USP7-IKK-alpha axis directly. What remains unincorporated is only the
  specific claim that some KDF1 alleles act by *gain* of function on that axis,
  which is reported in PMID:37144643 alone and cannot be quoted here.
inheritance:
- name: Autosomal Dominant
  description: >-
    Heterozygous KDF1 variants, inherited through multiple generations in the
    reported families and arising de novo in at least one case. In the
    three-generation Greek family all four carriers were clinically affected,
    consistent with high penetrance for the dental phenotype, although the
    ectodermal features outside the teeth were present in only some of them.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:27838789
    reference_title: "KDF1, encoding keratinocyte differentiation factor 1, is mutated in a multigenerational family with ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a multigenerational Saudi family with an autosomal dominant
      form of hypohidrotic ectodermal dysplasia in which positional mapping and
      exome sequencing identified a novel variant in KDF1 that fully segregates
      with the phenotype.
    explanation: >-
      Establishes dominant inheritance and full segregation in the family that
      defined the disease.
  - reference: PMID:40463401
    reference_title: "Novel familial KDF1 mutation detected in members of a three-generation family with clinical manifestations of ectodermal dysplasia: A report of four cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in KDF1 are associated with the manifestation of clinical
      characteristics of ED-12 (hypohidrotic/hair/tooth/nail type, Phenotype MIM
      no. 617337; OMIM
    explanation: >-
      Names the disease, its OMIM phenotype number and its dominant
      transmission. The quote stops before the publisher address that follows
      inside the same parenthesis.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Reported in single families and sporadic cases. A 2024 review assembled 14
    published KDF1 cases in total, of which 8 carried ectodermal-dysplasia
    alleles and 6 carried tooth-agenesis-only alleles; subsequent reports have
    added a further three-generation family.
  evidence:
  - reference: PMID:38501196
    reference_title: "Tooth agenesis related to a novel KDF1 variant: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 14 reviewed KDF1 cases revealed ED-associated variants (3
      variants in 8 patients) clustering in the region of amino acids 251-275,
      within the DUF4656 domain, while NSTA-causing variants (4 variants in 6
      patients) were typically found in amino- or carboxy-termini to this
      region.
    explanation: >-
      Gives the published case count split by presentation, which is the basis
      for the ultra-rare class and for the allelic-position observation.
genetic:
- name: KDF1
  gene_term:
    preferred_term: KDF1
    term:
      id: hgnc:26624
      label: KDF1
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Reported KDF1 alleles are heterozygous missense changes, not truncations,
    which is unusual for an ectodermal dysplasia gene and leaves the mechanism
    at the protein level unsettled: a simple haploinsufficiency model is not
    the obvious reading of a dominant missense series, and the mouse evidence
    is from a homozygous null. One study reports gain-of-function KDF1 alleles
    acting by stabilising IkappaB kinase alpha, which would make at least part
    of the series mechanistically gain-of-function, but its text is not
    available to quote (see the entry `notes`). `functional_impact_category` is
    therefore left off the pathophysiology nodes rather than guessed.
    `gene_disease_validity` is absent because no external body has published a
    classification for this pair.
  evidence:
  - reference: PMID:27838789
    reference_title: "KDF1, encoding keratinocyte differentiation factor 1, is mutated in a multigenerational family with ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The recapitulation of the phenotype we observe in this family by the
      Kdf1-/- mouse suggests a causal role played by the KDF1 variant.
    explanation: >-
      The gene-disease causality argument as its discoverers stated it, resting
      on mouse phenocopy rather than on functional assay of the human allele.
  - reference: PMID:35641834
    reference_title: "Identification of a novel missense heterozygous mutation in the KDF1 gene for non-syndromic congenital anodontia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro functional studies showed altered mRNA and protein expression
      levels of the mutant KDF1.
    explanation: >-
      Provides functional evidence that a patient missense allele changes KDF1
      transcript and protein level, which is the available experimental support
      for pathogenicity of this allele class.
  variants:
  - name: c.753C>A
    description: >-
      The allele in the multigenerational Saudi family that defined the disease,
      segregating with ectodermal dysplasia across three generations. Carriers
      lost all their teeth; the one child reported had natal teeth.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:40463401
      reference_title: "Novel familial KDF1 mutation detected in members of a three-generation family with clinical manifestations of ectodermal dysplasia: A report of four cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        A heterozygous KDF1 mutation was first reported to cause ED-12
        (autosomal dominant hypohidrotic ED) by Shamseldin et al
      explanation: >-
        Records that this is the first and defining ED-12 allele. Quoted from
        this later paper's discussion of the earlier report, not from its own
        family.
  - name: c.812A>C (p.Lys271Thr)
    description: >-
      Missense allele in a three-generation Greek family, within the
      amino-acid 251-275 ED-associated cluster. All four carriers were born
      with natal teeth - the third report of natal teeth with a KDF1 variant -
      and both adult carriers later had hypodontia. Classified a variant of
      uncertain significance under ACMG criteria at publication, on PM2, PP2 and
      PP3.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:40463401
      reference_title: "Novel familial KDF1 mutation detected in members of a three-generation family with clinical manifestations of ectodermal dysplasia: A report of four cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The present study describes a novel KDF1 mutation, c.812A>C
        (p.Lys271Thr), identified in four family members across three
        generations.
      explanation: Reports the allele and its segregation across three generations.
    - reference: PMID:40463401
      reference_title: "Novel familial KDF1 mutation detected in members of a three-generation family with clinical manifestations of ectodermal dysplasia: A report of four cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        according to the ACMG/AMP guidelines, it is categorized as a variant of
        unknown significance based on the PM2, PP2, PP3 criteria
      explanation: >-
        Gives the variant's classification and the criteria it rests on, which is
        why this entry records it as uncertain rather than pathogenic.
  - name: c.911T>A (p.Ile304Asn)
    description: >-
      De novo missense allele in a Chinese patient with severe non-syndromic
      anodontia and no extra-dental ectodermal features. Included here as the
      boundary case for this entry's scope: it is a KDF1 allele that does not
      produce the syndromic disease, and it lies outside the ED-associated
      domain cluster.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:35641834
      reference_title: "Identification of a novel missense heterozygous mutation in the KDF1 gene for non-syndromic congenital anodontia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified a novel de novo missense mutation (c.911 T > A, p.I304N) in
        the KDF1 gene in a Chinese patient with severe non-syndromic anodontia.
      explanation: >-
        Reports a KDF1 allele causing isolated anodontia, which is what makes the
        syndromic/non-syndromic distinction in this entry's scope a real one.
pathophysiology:
- name: KDF1 Variant in the DUF4656 Domain
  description: >-
    A heterozygous KDF1 missense variant, for the syndromic presentation
    clustering in amino acids 251-275 within the DUF4656 domain. Position within
    the protein, rather than variant severity, is what separates the syndromic
    from the tooth-only presentation in the published series, which argues for a
    domain-specific rather than a dosage mechanism.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  genes:
  - preferred_term: KDF1
    term:
      id: hgnc:26624
      label: KDF1
  downstream:
  - target: Loss of KDF1 Control of the Proliferation-Differentiation Balance
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35641834
      reference_title: "Identification of a novel missense heterozygous mutation in the KDF1 gene for non-syndromic congenital anodontia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In vitro functional studies showed altered mRNA and protein expression
        levels of the mutant KDF1.
      explanation: >-
        Supports the step from a patient missense allele to altered KDF1
        availability, which is the proximate molecular consequence this edge
        asserts.
  evidence:
  - reference: PMID:38501196
    reference_title: "Tooth agenesis related to a novel KDF1 variant: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ED-associated variants (3 variants in 8 patients) clustering in the region
      of amino acids 251-275, within the DUF4656 domain
    explanation: Locates the syndromic alleles to the domain and residue range this node names.
- name: Loss of KDF1 Control of the Proliferation-Differentiation Balance
  description: >-
    KDF1 sits in the TP63 regulatory network that holds the balance between
    proliferation and differentiation in the epidermis and in the other
    ectodermal derivatives. Disrupting it shifts the balance towards
    proliferation and away from differentiation. The network membership is the
    load-bearing claim: ectodermal knockout of Irf6, Ikk-alpha, Ripk4,
    stratifin or Kdf1 in mouse gives a strikingly similar phenotype, and three
    of those five genes already had human ectodermal disease before KDF1 did.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: regulation of epidermal cell differentiation
    modifier: DECREASED
    term:
      id: GO:0045604
      label: regulation of epidermal cell differentiation
  downstream:
  - target: Failure of USP7-Mediated IKK-alpha Stabilization
    causal_link_type: DIRECT
    description: >-
      KDF1 is the adaptor that brings the deubiquitinase USP7 to IKK-alpha, so
      losing KDF1 function removes the signal that keeps IKK-alpha stable.
    evidence:
    - reference: PMID:32239614
      reference_title: "Regulation of epidermal differentiation through KDF1-mediated deubiquitination of IKKα."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we find that KDF1 associates with a deubiquitinating protease USP7
        (ubiquitin-specific peptidase 7), and KDF1 can regulate skin
        differentiation through deubiquitination and stabilization of IKKα
      explanation: >-
        Identifies the molecular route from KDF1 to IKK-alpha stability via
        USP7, which is exactly the step this edge asserts.
  - target: Keratinocyte Differentiation Failure with Excess Proliferation
    causal_link_type: DIRECT
    description: >-
      KDF1 acts twice over in the same lineage: it restrains proliferation in
      the progenitor compartment by inhibiting p63, and drives terminal
      differentiation in the progeny through stratifin. Losing it therefore
      produces both halves of the phenotype rather than one.
    evidence:
    - reference: PMID:24075906
      reference_title: "Forward genetics identifies Kdf1/1810019J16Rik as an essential regulator of the proliferation-differentiation decision in epidermal progenitor cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our findings reveal a dual role for the novel gene Kdf1 both as a
        repressive signal for progenitor cell proliferation through its
        inhibition of p63 and a strong inductive signal for terminal
        differentiation through its interaction with the cell cycle regulator
        Stratifin.
      explanation: >-
        States the two molecular arms by which KDF1 holds the balance, naming
        p63 and stratifin, which is what makes this edge a direct one.
  evidence:
  - reference: PMID:27838789
    reference_title: "KDF1, encoding keratinocyte differentiation factor 1, is mutated in a multigenerational family with ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      TP63, itself mutated in ectodermal dysplasia, links many other ectodermal
      dysplasia disease genes through a regulatory network that maintains the
      balance between proliferation and differentiation of the epidermis and
      other ectodermal derivatives.
    explanation: >-
      States the regulatory network and the balance it maintains, which is what
      this node claims is lost. Quoted from this paper's introduction, where it
      frames established TP63-network biology rather than its own family data.
  - reference: PMID:27838789
    reference_title: "KDF1, encoding keratinocyte differentiation factor 1, is mutated in a multigenerational family with ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      The ectodermal knockout phenotype of five mouse genes that regulate and/or
      are regulated by TP63 (Irf6, Ikkα, Ripk4, Stratifin, and Kdf1) is
      strikingly similar and involves abnormal balance towards proliferation at
      the expense of differentiation
    explanation: >-
      Names the five network members and the direction of the imbalance, which
      is the mouse-genetic basis for placing KDF1 in this network. Quoted from
      the introduction's summary of published knockout phenotypes.
- name: Failure of USP7-Mediated IKK-alpha Stabilization
  description: >-
    KDF1 and IKK-alpha physically interact in differentiating keratinocytes, and
    KDF1 recruits the deubiquitinase USP7 to deubiquitinate and so stabilise
    IKK-alpha. Losing that interaction destabilises IKK-alpha. The genetic
    argument that this axis is the relevant one is a phenocopy argument of the
    same shape as the one that implicated KDF1 in the first place: ablating
    either KDF1 or IKK-alpha in mouse gives similar striking abnormalities of
    epidermal differentiation. IKK-alpha is independently one of the five
    TP63-network genes with a human ectodermal phenotype, which is why this node
    sits inside the network rather than beside it.
  biological_scale: MOLECULAR
  protein_complexes:
  - preferred_term: KDF1-IKK-alpha complex
  downstream:
  - target: Keratinocyte Differentiation Failure with Excess Proliferation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32239614
      reference_title: "Regulation of epidermal differentiation through KDF1-mediated deubiquitination of IKKα."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        With biochemical and mouse genetics approach, we further demonstrate that
        the interaction of IKKα and KDF1 is essential for epidermal
        differentiation.
      explanation: >-
        Establishes that the KDF1-IKK-alpha interaction is required for
        epidermal differentiation, which is the step from this node to the next.
  evidence:
  - reference: PMID:32239614
    reference_title: "Regulation of epidermal differentiation through KDF1-mediated deubiquitination of IKKα."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we identified an important interaction between KDF1 (keratinocyte
      differentiation factor 1) and IKKα (IκB kinase α) in differentiating skin
      keratinocytes
    explanation: >-
      Reports the physical interaction between KDF1 and IKK-alpha in the
      relevant cell type, which is the basis of this node.
  - reference: PMID:32239614
    reference_title: "Regulation of epidermal differentiation through KDF1-mediated deubiquitination of IKKα."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ablation of either KDF1 or IKKα in mice leads to similar but striking
      abnormalities in skin development, particularly in skin epidermal
      differentiation.
    explanation: >-
      The phenocopy argument placing KDF1 and IKK-alpha on one pathway rather
      than merely in contact.
- name: Keratinocyte Differentiation Failure with Excess Proliferation
  description: >-
    Keratinocytes proliferate in excess and fail to complete differentiation.
    In the Kdf1 mouse mutant this is visible as a thickened epidermis arising
    from keratinocyte defects.
  biological_scale: CELLULAR
  cell_types:

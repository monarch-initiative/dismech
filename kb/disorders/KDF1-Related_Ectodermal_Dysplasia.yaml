name: KDF1-Related Ectodermal Dysplasia
creation_date: "2026-10-27T00:00:00Z"
category: Mendelian
description: >-
  Autosomal dominant hypohidrotic ectodermal dysplasia caused by heterozygous
  variants in KDF1, which encodes keratinocyte differentiation factor 1
  (ectodermal dysplasia 12, hypohidrotic/hair/tooth/nail type; OMIM 617337).
  The cardinal features are tooth agenesis - often progressing to loss of all
  teeth, and sometimes preceded by natal teeth - with hypohidrosis, lusterless
  or sparse hair, dystrophic toenails, lateral eyebrow thinning and keratosis
  pilaris.
  Mechanistically this entry sits apart from the rest of the hypohidrotic
  ectodermal dysplasias already curated here. Those (EDA, EDAR, EDARADD) are
  defects in one ligand-receptor-adaptor chain converging on NF-kappaB in the
  ectodermal placode. KDF1 instead belongs to the TP63 regulatory network that
  holds the epidermal proliferation-differentiation balance, alongside IRF6,
  IKK-alpha, RIPK4 and stratifin. Ectodermal knockout of any of those five
  mouse genes gives a strikingly similar phenotype of excess proliferation at
  the expense of differentiation, and KDF1 was the last of the five to be given
  a human disease. The clinical convergence with EDA-pathway disease is
  therefore a convergence of two different mechanisms on the same set of
  ectodermal appendages, not a shared pathway.
  KDF1 variants also cause non-syndromic tooth agenesis, and the two
  presentations separate by position within the protein: the
  ectodermal-dysplasia alleles cluster in amino acids 251-275 inside the
  DUF4656 domain, while the tooth-only alleles lie to either side of it.
synonyms:
- ECTD12
- ectodermal dysplasia 12, hypohidrotic/hair/tooth/nail type
- KDF1 ectodermal dysplasia syndrome
- ectodermal dysplasia syndrome caused by mutation in KDF1
- ED-12

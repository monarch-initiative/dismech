  evidence:
  - reference: PMID:26437752
    reference_title: "[Noma/Cancrum oris: a neglected disease]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The characteristic tissue necrosis is produced by a polymicrobial infection."
    explanation: The abstract attributes tissue necrosis to polymicrobial infection.
  - reference: PMID:10522212
    reference_title: "Noma (cancrum oris): questions and answers."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Acute necrotizing gingivitis (ANG) is considered the antecedent lesion.
      Current studies suggest that evolution of ANG to noma requires infection by
      a consortium of microorganisms with Fusobacterium necrophorum and Prevotella
      intermedia as the suspected key players.
    explanation: >-
      Describes the pathogenetic sequence from ANG to noma and identifies the key
      microbial players.
  - reference: PMID:12002813
    reference_title: "Oro-facial gangrene (noma/cancrum oris): pathogenetic mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Infections and malnutrition impair the immune system, and this is the
      common denominator for the occurrence of noma.
    explanation: >-
      Confirms that immunosuppression from infections and malnutrition is the
      central pathogenetic mechanism.
  downstream:
  - target: Oral ulcer
    causal_link_type: DIRECT
    description: >-
      Antecedent necrotizing gingival and mucosal ulceration initiates the invasive
      oral tissue lesion.
    evidence:
    - reference: PMID:12002813
      reference_title: "Oro-facial gangrene (noma/cancrum oris): pathogenetic mechanisms."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Acute necrotizing gingivitis (ANG) and oral herpetic ulcers are considered
        the antecedent lesions, and ongoing studies suggest that the rapid
        progression of these precursor lesions to noma requires infection by a
        consortium of micro-organisms
      explanation: >-
        Connects precursor oral ulceration and necrotizing gingivitis to consortium
        infection.
  - target: Facial edema
    causal_link_type: DIRECT
    description: >-
      Extension of acute necrotizing infection into facial soft tissues produces
      stage 2 facial edema prior to frank gangrene.
    evidence:
    - reference: PMID:35576473
      reference_title: "Is noma a neglected/overlooked tropical disease?"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        According to the WHO, noma comprises five sequential 'stages': (1)
        necrotizing gingivitis, (2) edema, (3) gangrene, (4) scarring and (5)
        sequelae.
      explanation: >-
        Shows edema as the immediate acute inflammatory stage preceding gangrene.
  - target: Orofacial gangrene
    causal_link_type: DIRECT
    description: >-
      Polymicrobial invasion directly causes rapidly spreading gangrenous necrosis
      of intraoral and facial soft and osseous tissues.
    evidence:
    - reference: PMID:26437752
      reference_title: "[Noma/Cancrum oris: a neglected disease]."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Noma is an aggressive orofacial gangrenous pathology that damages hard and soft tissues of the mouth and the face."
      explanation: >-
        Establishes aggressive orofacial gangrenous destruction of mouth and facial tissues.
    - reference: PMID:26437752
      reference_title: "[Noma/Cancrum oris: a neglected disease]."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The characteristic tissue necrosis is produced by a polymicrobial infection."
      explanation: >-
        Directly attributes the gangrenous tissue necrosis to polymicrobial infection.
  - target: Fever
    causal_link_type: DIRECT
    description: >-
      Acute necrotizing polymicrobial infection elicits systemic febrile inflammation.
    evidence:
    - reference: DOI:10.58541/001c.71441
      reference_title: "A necrotic orofacial lesion presenting in an immunocompromised patient in the UK: case review with features of noma"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The classical symptoms of noma include severe pain, fever, oral ulceration,
        trismus, mucosal oedema, purulent discharge and extreme halitosis.
      explanation: >-
        Lists fever among the classical acute manifestations of necrotizing noma.
  - target: Dental abnormalities
    causal_link_type: DIRECT
    description: >-
      Necrotizing destruction of alveolar bone and periodontal support leads to
      exposure and loss of teeth.
    evidence:
    - reference: PMID:12002813
      reference_title: "Oro-facial gangrene (noma/cancrum oris): pathogenetic mechanisms."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Cancrum oris (Noma) is a devastating infectious disease which destroys the
        soft and hard tissues of the oral and para-oral structures.
      explanation: >-
        Links the infectious necrosis to destruction of oral hard tissues.
  - target: Facial disfigurement
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Full-thickness sloughing of gangrenous oral and facial tissues heals by
      scarring, leaving severe facial disfigurement in survivors.
    evidence:
    - reference: PMID:41282445
      reference_title: "Patterns of Noma (Cancrum Oris) Survivors in Ethiopia: A Retrospective, Multicentric, Cross-sectional Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Noma is a severe, rapidly progressing necrotizing infection that
        predominantly affects children in resource-limited settings and can lead to
        devastating facial disfigurement.
      explanation: >-
        Links the necrotizing infection to devastating facial disfigurement in survivors.
  - target: Trismus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Acute masticatory inflammation and subsequent cicatricial contracture or bony
      ankylosis restrict jaw opening.
    evidence:
    - reference: PMID:12655218
      reference_title: "A history of noma, the \"Face of Poverty\"."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Patients who survive noma generally suffer from its sequelae, including
        serious facial disfigurement, trismus, oral incontinence, and speech
        problems.
      explanation: >-
        Establishes trismus as a post-necrotic sequela in noma survivors.
  - target: Dysphagia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Destruction of lips, cheeks, jaws, and oral structures together with trismus
      impairs mastication and swallowing.
    evidence:
    - reference: PMID:41282445
      reference_title: "Patterns of Noma (Cancrum Oris) Survivors in Ethiopia: A Retrospective, Multicentric, Cross-sectional Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Common clinical issues included eating difficulties (77%), speech challenges
        (54.4%), and trismus (38.8%).
      explanation: >-
        Quantifies eating difficulties among survivors of necrotizing noma.
  - target: Speech impairment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of lip, cheek, palatal, and dental structures with jaw restriction
      impairs articulation in survivors.
    evidence:

name: Noma
creation_date: '2026-01-26T15:56:41Z'
category: Infectious Disease
description: >-
  Noma (cancrum oris) is a devastating gangrenous disease that leads to severe
  tissue destruction in the face and is associated with high morbidity and
  mortality. It affects predominantly malnourished children in sub-Saharan Africa
  and is preceded by acute necrotizing gingivitis. Without treatment, mortality
  is 70-90%. Survivors suffer orofacial disfigurement, trismus, and functional
  impairment.
disease_term:
  term:
    id: MONDO:0017124
    label: noma
  preferred_term: Noma
synonyms:
- cancrum oris
- gangrenous stomatitis
- necrotizing ulcerative stomatitis
parents:
- Bacterial Infection
- Neglected tropical disease
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:35576473
      reference_title: "Is noma a neglected/overlooked tropical disease?"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Noma is a debilitating orofacial necrotizing bacterial disease that
        disproportionately affects impoverished malnourished persons, particularly young
        children, the vast majority of whom live in tropical and subtropical areas in
        sub-Saharan Africa.
      explanation: >-
        Establishes noma as an orofacial necrotizing bacterial infectious disease.
prevalence:
- population: Northern Nigeria (1999-2024)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 3.4
  rate_low: 0.2
  rate_high: 16.6
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    Estimated across 19 northern Nigerian states and the Federal Capital Territory
    from 1,383 patients managed at Noma Children's Hospital, Sokoto (1999-2024),
    using the 2006 Nigerian Population Census as reference population; annual
    mean incidence rose to 12.0 per 100,000 during 2020-2024.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0012818
    reference_title: "Estimated incidence and clinical presentation of Noma in Northern Nigeria (1999–2024)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The annual average and median incidence of noma across all years was 3.4 and 1.6
      cases per 100,000 (range: 0.2-16.6 cases per 100,000), although between 2020 and
      2024, the annual average and median incidence estimates were 12.0 and 12.6 cases
      per 100,000.
    explanation: >-
      Provides population-denominator annual incidence estimates for Northern Nigeria
      over a 26-year period.
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: UNKNOWN
  notes: >-
    Global point prevalence is unknown due to severe underreporting, high acute
    untreated case fatality, and concentration in underserved regions.
  evidence:
  - reference: ORPHA:2700
    reference_title: Noma
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Unknown | Worldwide | Point prevalence | ORPHANET"
    explanation: >-
      Orphanet records worldwide point prevalence of noma as unknown.
progression:
- phase: Stage 1 - Acute necrotizing ulcerative gingivitis
  age_range: Childhood (typically 2-6 years)
  notes: >-
    Reversible antecedent gingival ulceration and necrosis; prompt oral hygiene,
    nutritional support, and antibiotics prevent progression to gangrenous noma.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0012818
    reference_title: "Estimated incidence and clinical presentation of Noma in Northern Nigeria (1999–2024)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Patients were also categorized according to the five stages of disease
      progression recommended by the World Health Organization (WHO) i.e., acute
      necrotizing ulcerative gingivitis (ANUG; 1), oedema (2), gangrene (3),
      scarring (4), and sequelae (5). Stages 1 and 2 are reversible while stages 3–5
      are irreversible stages.
    explanation: >-
      Defines WHO Stage 1 (ANUG) and establishes that stages 1 and 2 are reversible.
- phase: Stage 2 - Facial edema
  age_range: Childhood (typically 2-6 years)
  notes: >-
    Rapidly developing soft-tissue facial swelling preceding tissue sloughing;
    the final reversible stage of acute noma.
  evidence:
  - reference: PMID:35576473
    reference_title: "Is noma a neglected/overlooked tropical disease?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      According to the WHO, noma comprises five sequential 'stages': (1)
      necrotizing gingivitis, (2) edema, (3) gangrene, (4) scarring and (5)
      sequelae.
    explanation: >-
      Places facial edema as Stage 2 between necrotizing gingivitis and gangrene.
- phase: Stage 3 - Acute orofacial gangrene
  age_range: Childhood (predominantly 2-6 years; rare adult immunocompromised cases)
  notes: >-
    Irreversible demarcated gangrenous destruction of intraoral and extraoral soft
    and osseous facial tissues, carrying up to 90% mortality if untreated.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0012818
    reference_title: "Estimated incidence and clinical presentation of Noma in Northern Nigeria (1999–2024)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Active disease is common among children between two and six years in
      Sub-Saharan Africa while noma sequelae may be seen in individuals at any age.
    explanation: >-
      Establishes the peak 2-6 year childhood onset window for active gangrenous disease.
- phase: Stages 4 and 5 - Scarring and chronic sequelae
  age_range: Any age among survivors
  notes: >-
    Wound contraction, scarring, trismus, ankylosis, orofacial tissue defects,
    dysphagia, and speech impairment persisting lifelong without reconstruction.
  evidence:
  - reference: PMID:35576473
    reference_title: "Is noma a neglected/overlooked tropical disease?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Most survivors of noma live with gross physical disfigurement and
      disability, and with impaired psychosocial functioning
    explanation: >-
      Documents the chronic disabling disfigurement and functional sequelae in survivors.
environmental:
- name: Protein-energy malnutrition
  exposure_term:
    preferred_term: exposure to decreased protein in food
    term:
      id: ECTO:0400019
      label: exposure to decreased protein in food
  disease_effect: PREDISPOSES
  causal_role: COMPONENT_CAUSE
  description: >-
    Severe childhood malnutrition is an ever-present predisposing factor in classic
    pediatric noma, impairing mucosal integrity and cellular and humoral immunity.
  evidence:
  - reference: PMID:28093536
    reference_title: "Noma: Overview of a Neglected Disease and Human Rights Violation."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The etiology of noma is multifactorial with malnutrition as an ever present
      factor, often in combination with concomitant diseases, such as measles,
      malaria, and human immunodeficiency virus (HIV), and poor oral hygiene.
    explanation: >-
      Establishes malnutrition as an ever-present environmental factor in noma etiology.
  influences_mechanisms:
  - target: Immunodeficiency from malnutrition and infection
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Malnutrition synergizes with endemic infections to induce host immunodeficiency.
    evidence:
    - reference: PMID:10522212
      reference_title: "Noma (cancrum oris): questions and answers."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Malnutrition acts synergistically with endemic infections in promoting an
        immunodeficient state, and noma results from the interaction of general and
        local factors with a weakened immune system as the common denominator.
      explanation: >-
        Links malnutrition directly to the immunodeficient state underlying noma.
- name: Extreme poverty
  exposure_term:
    preferred_term: exposure to poverty
    term:
      id: ECTO:6000026
      label: exposure to poverty
  disease_effect: PREDISPOSES
  causal_role: RISK_FACTOR
  description: >-
    Extreme poverty drives concurrent childhood undernutrition, inadequate
    sanitation, poor oral hygiene, and untreated antecedent infections in endemic
    communities.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0012818
    reference_title: "Estimated incidence and clinical presentation of Noma in Northern Nigeria (1999–2024)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Noma is a devastating and disfiguring necrotizing disease that primarily
      affects malnourished children in low-income countries or areas with extreme
      poverty.
    explanation: >-
      Identifies extreme poverty as a defining socioeconomic determinant of noma.
  influences_mechanisms:
  - target: Immunodeficiency from malnutrition and infection
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Impoverished living conditions expose young children to inadequate nutrition
      and poor sanitation that compromise host immunity.
    evidence:
    - reference: DOI:10.1371/journal.pntd.0012818
      reference_title: "Estimated incidence and clinical presentation of Noma in Northern Nigeria (1999–2024)"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: >-
        Acute noma predominantly affects children between the ages of two and six
        years old in poorly developed countries where adequate nutrition,
        sanitation, and cleanliness are lacking [1].
      explanation: >-
        Links poverty-associated lack of nutrition and sanitation to susceptibility
        in young children.
infectious_agent:
- name: Fusobacterium necrophorum
  infectious_agent_term:
    preferred_term: Fusobacterium necrophorum
    term:
      id: NCBITaxon:859
      label: Fusobacterium necrophorum
  description: >-
    The anaerobe most consistently implicated as a key member of the consortium that
    converts acute necrotizing gingivitis into noma. It carries an endotoxin, a
    dermonecrotic toxin, a cytoplasmic toxin and a hemolysin, and also produces a
    growth-stimulating factor for Prevotella intermedia, which is why the two are
    described together rather than as alternatives.
  evidence:
  - reference: PMID:12002813
    reference_title: "Oro-facial gangrene (noma/cancrum oris): pathogenetic mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "with Fusobacterium necrophorum (Fn) and Prevotella intermedia (Pi) as the suspected key players"
    explanation: >-
      Names F. necrophorum as a suspected key member of the microbial consortium whose
      infection drives progression to noma.
  - reference: PMID:26437752
    reference_title: "[Noma/Cancrum oris: a neglected disease]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Fusobacterium necrophorum, Prevotella intermedia, Prevotella melaninogenica, Fusobacterium nucleatum, Bacteroides fragilis, Bacillus cereus, Trueperella pyogenes, spyrochetes, etc, are some of the species that have been isolated from the affected areas."
    explanation: >-
      Reports F. necrophorum among the species actually isolated from noma lesions, and
      shows the recovered flora is broader than the two key players.
- name: Prevotella intermedia
  infectious_agent_term:
    preferred_term: Prevotella intermedia
    term:
      id: NCBITaxon:28131
      label: Prevotella intermedia
  description: >-
    The second organism named as a key player in the noma consortium, recovered from
    affected tissue and dependent in part on a growth-stimulating factor supplied by
    F. necrophorum. Neither organism is sufficient alone: the attribution in this
    disease is to a consortium acting on malnourished, immunocompromised tissue.
  evidence:
  - reference: PMID:12002813
    reference_title: "Oro-facial gangrene (noma/cancrum oris): pathogenetic mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "with Fusobacterium necrophorum (Fn) and Prevotella intermedia (Pi) as the suspected key players"
    explanation: >-
      Names P. intermedia as the other suspected key member of the consortium.
  - reference: PMID:26437752
    reference_title: "[Noma/Cancrum oris: a neglected disease]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Fusobacterium necrophorum, Prevotella intermedia, Prevotella melaninogenica, Fusobacterium nucleatum, Bacteroides fragilis, Bacillus cereus, Trueperella pyogenes, spyrochetes, etc, are some of the species that have been isolated from the affected areas."
    explanation: >-
      Reports P. intermedia among the species isolated from noma lesions.

transmission:
- name: Endogenous opportunistic overgrowth of resident oral flora
  description: >-
    Noma is not communicable. The organisms are already present in the child's mouth,
    and what changes is the host: malnutrition and immunosuppression permit a resident
    oral community to shift and invade. Recording the route this way is the point of the
    record, since the disease's geography reflects poverty and not an exposure source.
  evidence:
  - reference: PMID:28093536
    reference_title: "Noma: Overview of a Neglected Disease and Human Rights Violation."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Rare microbiological studies suggest an opportunistic infection caused by an imbalance in normal intraoral microorganisms."
    explanation: >-
      States that the infection arises from an imbalance of the normal intraoral flora,
      which is the endogenous route recorded here.
  - reference: PMID:28093536
    reference_title: "Noma: Overview of a Neglected Disease and Human Rights Violation."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "fast-spreading, noncontagious gangrenous infection occurring in the face"
    explanation: >-
      States explicitly that the infection is not contagious, which is why no
      person-to-person route is recorded.
- name: Breach of the gingival mucosal barrier as portal
  description: >-
    The step that lets the resident flora reach deep tissue is loss of the gingival
    mucosal barrier, typically at an acute necrotizing gingivitis lesion. Poor oral
    hygiene and the preceding gingival ulceration are therefore the proximate route
    into the soft tissues of the face.
  evidence:
  - reference: PMID:12837347
    reference_title: "Noma: an \"infectious\" disease of unknown aetiology."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "poor oral hygiene and a lesion of the gingival mucosal barrier, and an unidentified bacterial factor acting as a trigger for the disease"
    explanation: >-
      Identifies the gingival mucosal barrier lesion as an element of the aetiology,
      which is the portal through which the oral flora invades.
  - reference: PMID:10522212
    reference_title: "Noma (cancrum oris): questions and answers."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Current studies suggest that evolution of ANG to noma requires infection by a consortium of microorganisms with Fusobacterium necrophorum and Prevotella intermedia as the suspected key players."
    explanation: >-
      Places the acute necrotizing gingivitis lesion as the stage the consortium acts on,
      establishing it as the route into the facial tissues.

pathophysiology:
- name: Polymicrobial infection with tissue necrosis
  biological_scale: TISSUE
  description: >-
    Polymicrobial infection drives rapid orofacial tissue necrosis. The etiology
    is multifactorial with malnutrition as an ever-present factor, often in
    combination with concomitant diseases such as measles, malaria, and HIV. Acute
    necrotizing gingivitis is the antecedent lesion, and progression to noma
    requires infection by a consortium of microorganisms with Fusobacterium
    necrophorum and Prevotella intermedia as suspected key players.
  locations:
  - preferred_term: gingiva
    term:
      id: UBERON:0001828
      label: gingiva
  - preferred_term: mouth mucosa
    term:
      id: UBERON:0003729
      label: mouth mucosa
  - preferred_term: face
    term:
      id: UBERON:0001456
      label: face
  cell_types:

diagnosis:
- name: Clinical diagnosis of noma
  description: >-
    Noma is diagnosed primarily on clinical presentation—rapidly progressive
    intraoral necrotizing gingivitis/stomatitis, facial edema, extreme halitosis,
    and demarcated orofacial gangrene in a malnourished or immunocompromised
    patient—rather than on microbiological culture, which recovers mixed oral flora.

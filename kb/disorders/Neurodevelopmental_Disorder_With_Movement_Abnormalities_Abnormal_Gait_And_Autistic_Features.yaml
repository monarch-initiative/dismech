    evidence_source: IN_VITRO
    snippet: "ZSWIM6 protein was captured in eluates containing 100 to 300 mM NaCl, partially overlapping with early fractions in which histone H3 dissociates, indicating a loose association with chromatin"
    explanation: >-
      Sequential salt extraction of HEK293T nuclei expressing tagged ZSWIM6
      grounds the chromatin binding activity bound on this node.
  - reference: PMID:39823338

  description: >-
    Heterozygous de novo occurrence of the recurrent c.2737C>T variant. In the
    founding series the variant was de novo in six probands and absent from the
    mother and both unaffected brothers of the seventh, whose father was
    unavailable for testing.
  evidence:
  - reference: PMID:29198722
    reference_title: "A Recurrent De Novo Nonsense Variant in ZSWIM6 Results in Severe Intellectual Disability without Frontonasal or Limb Malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all case subjects, the c.2737C>T variant was confirmed by Sanger sequencing using standard methodology, and segregation analysis was consistent with the variant being de novo for individuals 2 to 7."
    explanation: >-
      De novo heterozygous occurrence in six of the seven founding probands.
  - reference: PMID:33958584
    reference_title: "A recurrent de novo ZSWIM6 variant in a Japanese patient with severe neurodevelopmental delay and frequent vomiting."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because neither parent showed this variant, it was considered de novo."
    explanation: >-
      Trio exome sequencing in an independent proband confirmed de novo
      occurrence of the same heterozygous variant.
pathophysiology:
- name: ZSWIM6 p.Arg913Ter Truncation Escaping Nonsense-Mediated Decay
  description: >-
    The recurrent c.2737C>T (p.Arg913Ter) premature stop codon lies in
    penultimate exon 13, 48 bp upstream of the last exon junction. In
    lymphoblastoid cells from an affected individual the variant transcript is
    not degraded by nonsense-mediated decay and total ZSWIM6 mRNA is not
    reduced. The predicted product is a ZSWIM6 protein lacking the C-terminal
    Sin3-like domain; the truncated protein itself could not be detected with
    the available antibody, so its existence is inferred from the transcript
    data.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous de novo NM_020928 c.2737C>T, p.Arg913Ter, penultimate exon.
  evidence:
  - reference: PMID:29198722
    reference_title: "A Recurrent De Novo Nonsense Variant in ZSWIM6 Results in Severe Intellectual Disability without Frontonasal or Limb Malformations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that the c.2737C>T variant does not trigger nonsense-mediated decay of the ZSWIM6 mRNA in affected individual-derived cells."
    explanation: >-
      Cycloheximide experiments in patient-derived lymphoblastoid cells show the
      variant transcript escapes nonsense-mediated decay.
  - reference: PMID:29198722
    reference_title: "A Recurrent De Novo Nonsense Variant in ZSWIM6 Results in Severe Intellectual Disability without Frontonasal or Limb Malformations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Because an alternative commercial antibody against the N-terminal region of ZSWIM6 protein is unavailable, we could not confirm the presence of a truncated ZSWIM6 protein, which we assume is translated from the mRNA encoding the PTC."
    explanation: >-
      States the limit of the evidence: the truncated protein is inferred, not
      observed.
  downstream:
  - target: ZSWIM6 Repressive Chromatin Regulation Deficit
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - truncated_zswim6_dominant_negative
    description: >-
      A Sin3-like-domain-deficient ZSWIM6 is proposed to interfere with
      ZSWIM6-dependent transcriptional repression. In a reporter assay the
      p.Arg913Ter protein derepressed the HECW2 promoter, but no study has yet
      measured chromatin state in human cells carrying the variant.
    evidence:
    - reference: PMID:29198722
      reference_title: "A Recurrent De Novo Nonsense Variant in ZSWIM6 Results in Severe Intellectual Disability without Frontonasal or Limb Malformations."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "This finding supports the existence of a truncated ZSWIM6 protein lacking the Sin3-like domain, which could have a dominant-negative effect."
      explanation: >-
        The authors' dominant-negative proposal follows from nonsense-mediated
        decay escape; it is a hypothesis, not a demonstrated effect.
    - reference: PMID:42731068
      reference_title: "Homozygous variants in ZSWIM6 cause severe syndromic short stature and developmental delay."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "The three variants showed different effects on transcriptional regulation: the p.Arg1040His variant reduced ZIC2 activation (loss-of-function), p.Arg1163Trp enhanced ZIC2 activation (gain-of-function), and p.Arg913Ter specifically increased HECW2 activation (derepression)."
      explanation: >-
        HEK293 luciferase reporter data show the p.Arg913Ter protein has an
        allele-specific effect on promoter regulation, consistent with altered
        repressive function.
  - target: Severe to profound intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The variant causes the core neurodevelopmental phenotype; the cellular
      intermediates in human brain are not characterized.
  - target: Autistic features
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Poor speech
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Truncal hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Peripheral Nerve Neurofilament Accumulation

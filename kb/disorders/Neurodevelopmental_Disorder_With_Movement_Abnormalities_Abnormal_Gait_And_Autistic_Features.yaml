    evidence_source: IN_VITRO
    snippet: "We found that both SUZ12 and HDAC1 immunoprecipitated with Flag-tagged ZSWIM6 but were not detected in control immunoprecipitation (IPs) performed in mock-transfected cells"
    explanation: >-

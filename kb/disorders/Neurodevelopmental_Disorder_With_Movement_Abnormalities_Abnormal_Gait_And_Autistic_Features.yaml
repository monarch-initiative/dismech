animal_models:
- name: Zswim6 knockout mouse
  species: Mouse
  genotype: Zswim6 constitutive and conditional knockout
  publication: PMID:28433741
  modeled_mechanisms:
  - target: Striatal Motor Circuit Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Null and conditional Zswim6 alleles produce striatal, synaptic and motor
      abnormalities overlapping the human movement phenotype.
    limitations: >-
      The mouse alleles remove Zswim6, whereas the human disorder is caused by
      an NMD-escaping truncation proposed to act dominant-negatively, and
      heterozygous loss of ZSWIM6 was argued not to cause intellectual
      disability in humans. The model therefore tests loss of function rather
      than the human allele.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The p.Arg913Ter truncated protein, the proposed human disease agent, is
        absent from a null allele, so any dominant-negative effect on the
        remaining protein cannot be observed in this model.
    evidence:
    - reference: PMID:28433741
      reference_title: "Loss of the neurodevelopmental gene Zswim6 alters striatal morphology and motor regulation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These changes are associated with alterations in motor control, including hyperactivity, impaired rotarod performance, repetitive movements, and behavioral hyperresponsiveness to amphetamine."
      explanation: Motor phenotype of the knockout.
discussions:
- discussion_id: zswim6_allelic_spectrum
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is this disorder restricted to the NMD-escaping p.Arg913Ter allele, or do
    other heterozygous truncating ZSWIM6 variants cause it?
  rationale: >-
    The founding series argued that heterozygous ZSWIM6 loss does not cause
    intellectual disability and proposed a dominant-negative truncated protein.
    A later whole-exome series of children referred for suspected muscle disease
    classified two de novo 5' frameshift variants as likely pathogenic for this
    disorder; such alleles would be expected to undergo nonsense-mediated decay.
    If confirmed, haploinsufficiency would join or replace the dominant-negative
    model.
  attaches_to:
  - mechanistic_hypotheses#truncated_zswim6_dominant_negative
  - genetic#ZSWIM6
  evidence:
  - reference: PMID:29198722
    reference_title: "A Recurrent De Novo Nonsense Variant in ZSWIM6 Results in Severe Intellectual Disability without Frontonasal or Limb Malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Available data suggest that a heterozygous loss of ZSWIM6 does not cause ID."
    explanation: The founding argument against haploinsufficiency.
  - reference: PMID:41828661
    reference_title: "Skipping the Biopsy: Real-World Experience of Whole-Exome Sequencing as First-Tier Testing in Pediatric Muscular Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ZSWIM6 | NDD with movement abnormalities | AD (de novo) | 3.8 | M | No | c.481_482insT | p.Ala161fs | Heterozygous"
    explanation: >-
      A de novo frameshift classified likely pathogenic for this disorder,
      bearing on whether truncations other than p.Arg913Ter cause it.
- discussion_id: zswim6_mouse_null_vs_human_truncation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do Zswim6 null mice model a disorder thought to be caused by a
    dominant-negative truncated protein?
  rationale: >-
    The striatal, synaptic and motor findings come from null and conditional
    knockout mice, while the human variant is proposed to act through a
    truncated protein that a null allele lacks. A knock-in of the equivalent
    truncation, or patient-derived neurons, would test whether the striatal
    chromatin and synaptic changes are shared.
  attaches_to:
  - pathophysiology#ZSWIM6 Repressive Chromatin Regulation Deficit
  - pathophysiology#Striatal Motor Circuit Dysfunction

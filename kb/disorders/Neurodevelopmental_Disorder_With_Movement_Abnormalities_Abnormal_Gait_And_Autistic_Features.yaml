- name: Peripheral Nerve Neurofilament Accumulation
  description: >-
    Sural nerve biopsy in one affected individual with a progressive
    neuropathy showed reduced myelinated fibre density, thin myelin and
    abnormal accumulation of neurofilaments within axons, resembling
    giant axonal neuropathy. Mixed axonal and demyelinating features were seen
    on nerve conduction. The link to ZSWIM6 function is unknown; a role in
    ubiquitination has been postulated from its domain structure but not shown.
  biological_scale: TISSUE
  locations:

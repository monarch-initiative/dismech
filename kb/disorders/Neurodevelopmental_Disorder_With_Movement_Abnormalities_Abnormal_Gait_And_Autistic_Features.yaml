mechanistic_hypotheses:
- hypothesis_group_id: truncated_zswim6_dominant_negative
  hypothesis_label: Truncated ZSWIM6 acts dominant-negatively on ZSWIM6-dependent repression
  status: EMERGING
  description: >-
    The NMD-escaping p.Arg913Ter transcript is predicted to yield ZSWIM6 lacking
    the Sin3-like domain, which may interfere with the wild-type protein's
    repressive chromatin function. The proposal rests on nonsense-mediated decay
    escape, on the absence of convincing ZSWIM6 loss-of-function alleles in
    controls or neurodevelopmental cohorts at the time, and on an
    allele-specific reporter effect; dominant-negative interference has not been
    demonstrated directly.
  evidence:
  - reference: PMID:29198722
    reference_title: "A Recurrent De Novo Nonsense Variant in ZSWIM6 Results in Severe Intellectual Disability without Frontonasal or Limb Malformations."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Available data suggest that a heterozygous loss of ZSWIM6 does not cause ID."
    explanation: >-
      The argument against simple haploinsufficiency that motivates the
      dominant-negative proposal.

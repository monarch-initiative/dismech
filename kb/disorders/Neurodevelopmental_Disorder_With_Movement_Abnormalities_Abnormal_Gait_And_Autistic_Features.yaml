    reference_title: "Control of striatal circuit development by the chromatin regulator Zswim6."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Specifically, Zswim6 disruption altered the desensitization properties of AMPA receptors, leading to enhanced synaptic recruitment of SPNs, explaining SPN-subtype specific effects on activity and behavioral sub-structure."
    explanation: >-
      Slice electrophysiology in conditional knockout mice measured the altered
      excitatory transmission in spiny projection neurons.
  downstream:

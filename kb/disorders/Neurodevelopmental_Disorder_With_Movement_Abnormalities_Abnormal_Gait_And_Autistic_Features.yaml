- name: Striatal Spiny Projection Neuron Excitatory Synaptic Dysfunction
  description: >-
    Cell-type-specific Zswim6 deletion in either direct- or indirect-pathway
    striatal spiny projection neurons changes excitatory, but not inhibitory,
    synaptic transmission, altering AMPA receptor desensitization and
    increasing synaptic recruitment of these neurons. Adult deletion shows a
    continuing requirement for Zswim6 in maintaining mature striatal synapses.
  biological_scale: CELLULAR

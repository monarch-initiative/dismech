name: Neurodevelopmental Disorder With Movement Abnormalities, Abnormal Gait, And Autistic Features
creation_date: "2026-10-25T00:00:00Z"
category: Mendelian
synonyms:
- NEDMAGA
description: >-
  Autosomal dominant neurodevelopmental disorder (OMIM 617865) defined by the
  recurrent de novo ZSWIM6 nonsense variant c.2737C>T (p.Arg913Ter) in the
  penultimate exon. Affected children have infantile truncal hypotonia, delayed
  walking followed by a wide-based unsteady gait, severe to profound
  intellectual disability with very limited speech, autistic features,
  stereotyped and paroxysmal movements, and frequent gastro-esophageal reflux;
  progressive spasticity, seizures, strabismus, progressive microcephaly and,
  in one reported individual, a progressive peripheral neuropathy occur in a
  subset. The variant mRNA escapes nonsense-mediated decay, so a truncated
  ZSWIM6 lacking the C-terminal Sin3-like domain is proposed to act in a
  dominant-negative manner. ZSWIM6 is a nuclear protein that associates with
  repressive chromatin regulators, and mouse Zswim6 loss disrupts striatal
  development, spiny projection neuron synapses and motor behaviour.
notes: >-
  Kept separate from acromelic frontonasal dysostosis (MONDO:0011359), which is
  caused by a different recurrent de novo ZSWIM6 variant (missense
  p.Arg1163Trp within the Sin3-like domain) and is curated as the "Acromelic
  FND" subtype of Frontonasal_Dysplasia. The p.Arg913Ter disorder lacks the
  frontonasal, midline clefting, brain-malformation and limb anomalies that
  define that entity. A homozygous ZSWIM6 missense variant (p.Arg1040His) has
  also been reported with syndromic short stature and growth hormone
  deficiency in one consanguineous sibship (PMID:42731068); that recessive
  presentation is a third allelic entity and is not included here. No
  GeneReviews chapter or Orphanet record names this disorder.

      axonal neuropathy, but not tested.
    evidence:
    - reference: PMID:29198722
      reference_title: "A Recurrent De Novo Nonsense Variant in ZSWIM6 Results in Severe Intellectual Disability without Frontonasal or Limb Malformations."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "This similarity in pathology between a known disorder of ubiquitination and ZSWIM6 p.Arg913Ter-related neuropathy is intriguing given a postulated role of ZSWIM6 in the ubiquitin pathway."
      explanation: >-
        The authors attribute the neuropathy to the variant and offer only a
        postulated mechanism, so the intermediates are unknown.
- name: ZSWIM6 Repressive Chromatin Regulation Deficit
  description: >-
    ZSWIM6 is a nuclear protein that loosely associates with chromatin and
    co-immunoprecipitates with the repressive chromatin regulators SUZ12 and
    HDAC1 and with histone H3. Conditional deletion of Zswim6 in mouse ventral
    telencephalic progenitors broadly increases chromatin accessibility at
    promoters and enhancers in striatum and biases transcription toward
    up-regulation, consistent with a role in establishing repressive chromatin.
    The data are from heterologous cells and mouse knockouts; whether the human
    truncation produces the same deficit is untested.
  biological_scale: MOLECULAR

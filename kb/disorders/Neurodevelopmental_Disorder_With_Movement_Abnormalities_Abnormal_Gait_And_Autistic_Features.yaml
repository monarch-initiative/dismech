genetic:
- name: ZSWIM6
  gene_term:
    preferred_term: ZSWIM6
    term:
      id: hgnc:29316
      label: ZSWIM6
  association: Pathogenic mutations
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    The disorder is defined by one recurrent allele. ClinGen has classified
    ZSWIM6 only for acromelic frontonasal dysostosis, not for this disorder, so
    no validity tier is recorded here. Heterozygous frameshift alleles near the
    5' end of the gene have since been classified likely pathogenic for this
    disorder in a diagnostic series; see the allelic-spectrum discussion.
  variants:
  - name: c.2737C>T (p.Arg913Ter)
    description: >-
      Recurrent de novo nonsense variant in penultimate exon 13 that escapes
      nonsense-mediated decay. Reported in seven unrelated individuals in the
      founding series and in later Japanese and Portuguese cases.
    clinical_significance: PATHOGENIC
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:29198722
      reference_title: "A Recurrent De Novo Nonsense Variant in ZSWIM6 Results in Severe Intellectual Disability without Frontonasal or Limb Malformations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We present detailed phenotypic information on seven unrelated individuals with a recurrent de novo nonsense variant (c.2737C>T ... in the penultimate exon of ZSWIM6 who have severe-profound intellectual disability and additional central and peripheral nervous system symptoms but an absence of frontonasal or limb malformations."
      explanation: Founding series establishing the variant-disease association.
    - reference: PMID:38386481
      reference_title: "A Case of NEDMAGA: Neurodevelopmental Disorder with Movement Abnormalities, Abnormal Gait, and Autistic Features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole exome sequencing (WES) was performed, revealing a heterozygous pathogenic variant in the ZSWIM6 gene"
      explanation: Independent case carrying the same variant.
  evidence:
  - reference: PMID:29198722
    reference_title: "A Recurrent De Novo Nonsense Variant in ZSWIM6 Results in Severe Intellectual Disability without Frontonasal or Limb Malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case series indicates that the recurrent de novo nonsense variant c.2737C>T in ZSWIM6 should be considered causal of severe-profound autosomal-dominant ID associated with a wide-based ataxic gait, limited communication, happy disposition and, in some, significant gastrointestinal symptoms, repetitive behaviors on the autistic spectrum, distinctive facial features, spasticity, and strabismus."
    explanation: Establishes ZSWIM6 p.Arg913Ter as causal.
  - reference: PMID:33958584
    reference_title: "A recurrent de novo ZSWIM6 variant in a Japanese patient with severe neurodevelopmental delay and frequent vomiting."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A recurrent ZSWIM6 variant, NM_020928.2:c.2737C>T ... was identified in a Japanese male patient with severe neurodevelopmental delay, epilepsy, distinctive facial features, microcephaly, growth deficiency, abnormal behavior, and frequent vomiting but without frontonasal or limb malformations."
    explanation: Independent replication in a Japanese proband.

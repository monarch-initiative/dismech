    evidence_source: HUMAN_CLINICAL
    snippet: "Nerve conduction studies for individual 1 demonstrated mixed axonal and demyelinating features, and light and electron microscopy of a sural nerve biopsy (Figure 2B) showed a reduction in myelinated fiber density, reduction in the thickness of myelination in many myelinated axons, and evidence of abnormal accumulation of neurofilaments (Figure 2B)."
    explanation: >-
      Single-individual nerve biopsy and conduction findings.

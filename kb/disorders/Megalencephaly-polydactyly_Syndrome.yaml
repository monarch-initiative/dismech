name: Megalencephaly-polydactyly Syndrome
creation_date: "2026-10-30T23:00:19Z"
category: Mendelian
description: >-
  Megalencephaly-polydactyly syndrome is an ultra-rare congenital disorder caused
  by heterozygous de novo gain-of-function missense variants in MYCN that disrupt
  the Thr58 phosphodegron and stabilize the MYCN protein. The core features in
  the three molecularly confirmed patients reported in the literature are
  megalencephaly, ventriculomegaly, postaxial polydactyly and facial
  dysmorphism with hypertelorism and a wide, depressed nasal bridge, with
  hypoplasia of the corpus callosum, intellectual disability and infantile
  neuroblastoma in some. It is the dosage mirror of Feingold syndrome type 1, in which MYCN
  loss-of-function variants cause microcephaly and digital hypoplasia.
disease_term:
  preferred_term: megalencephaly-polydactyly syndrome
  term:
    id: MONDO:0958279
    label: megalencephaly-polydactyly syndrome
parents:
- syndromic disease
- hereditary disease
synonyms: []
inheritance:
- name: Autosomal dominant inheritance, de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    ClinGen curates the MYCN gene-disease relationship as autosomal dominant. All
    three reported probands carried a heterozygous variant that was absent from
    both parents, so no parent-to-child transmission has been observed. Penetrance
    is unknown.
  evidence:
  - reference: CGGV:assertion_57c5c940-b8cb-4d12-9e20-895a94902c45-2026-01-07T170000.000Z
    reference_title: MYCN / megalencephaly-polydactyly syndrome (Moderate)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MYCN | HGNC:7559 | megalencephaly-polydactyly syndrome | MONDO:0958279 | AD | Moderate"
    explanation: The ClinGen gene-disease validity record assigns autosomal dominant mode of inheritance.
  - reference: PMID:37710961
    reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio-based exome sequencing identified a de novo heterozygous missense variant"
    explanation: Trio sequencing shows the heterozygous variant arose de novo in patient 1.
  - reference: PMID:30573562
    reference_title: MYCN de novo gain-of-function mutation in a patient with a novel megalencephaly syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a de novo c.173C>T mutation in MYCN which leads to stabilisation and accumulation of the MYCN protein"
    explanation: The index patient's heterozygous Thr58Met variant was also de novo.
pathophysiology:
- name: MYCN Thr58 Phosphodegron Disruption
  description: >-
    The disease-causing missense variants (p.Thr58Met, p.Pro60Leu) sit in the
    N-terminal phosphodegron of MYCN. GSK3B phosphorylation of Thr58 marks MYCN
    for recognition by the FBXW7 ubiquitin ligase and proteasomal degradation.
    Both variants reduce Thr58 phosphorylation, so the mutant protein escapes
    FBXW7-mediated degradation.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MYCN
    term:
      id: hgnc:7559
      label: MYCN
  genetic_context:
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    allele_type: MISSENSE
    functional_impact_category: GAIN_OF_FUNCTION
    notes: >-
      Gain of function here means increased protein stability and therefore
      increased MYCN dosage. In transfected HEK293T cells the mutant proteins
      activated CCND1 and CCND2 transcription to the same extent as wild-type
      MYCN, so there is no evidence of increased intrinsic transcriptional
      potency per molecule.
  biological_processes:
  - preferred_term: FBXW7-mediated proteasomal degradation of MYCN
    modifier: DECREASED
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
  evidence:
  - reference: PMID:37710961
    reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional analyses for MYCN-Pro60Leu and MYCN-Thr58Met revealed decreased phosphorylation at Thr58, which reduced protein degradation mediated by FBXW7 ubiquitin ligase."
    explanation: Cell-based assays show both patient variants lose Thr58 phosphorylation and resist FBXW7-mediated degradation.
  - reference: PMID:30573562
    reference_title: MYCN de novo gain-of-function mutation in a patient with a novel megalencephaly syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "at the Thr58 phosphorylation site essential for ubiquitination and subsequent MYCN degradation"
    explanation: Places the index variant at the phosphorylation site that licenses MYCN ubiquitination and degradation.
  - reference: PMID:16139224
    reference_title: The Cdk1 complex plays a prime role in regulating N-myc phosphorylation and turnover in neural precursors.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: "N-myc phosphorylation-mediated degradation is a prerequisite for CGNP growth arrest and differentiation."
    explanation: >-
      Normal-biology evidence that phosphorylation-dependent N-myc turnover is
      what lets neural precursors stop dividing, which is the control these
      variants remove.
  downstream:
  - target: MYCN Protein Accumulation
    causal_link_type: DIRECT
    description: Reduced degradation raises steady-state MYCN protein levels.
    evidence:
    - reference: PMID:30573562
      reference_title: MYCN de novo gain-of-function mutation in a patient with a novel megalencephaly syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The mutant MYCN (MYCN-T58M) was non-phosphorylatable at Thr58 and subsequently accumulated in cells"
      explanation: Directly links loss of Thr58 phosphorylation to accumulation of the mutant protein.
- name: MYCN Protein Accumulation
  description: >-
    Stabilized MYCN accumulates in developing tissues, increasing the total MYCN
    transcription factor activity available to drive proliferative target
    genes. In heterozygous Mycn T58M knock-in mice the accumulation is seen in
    the embryonic cortex.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MYCN
    term:
      id: hgnc:7559
      label: MYCN
  molecular_functions:
  - preferred_term: MYCN transcription factor activity
    modifier: INCREASED
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
  evidence:
  - reference: PMID:37710961
    reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We validated the decreased phosphorylation at T58 and subsequent accumulation of Mycn protein in T58M/WT mice"
    explanation: Confirms in vivo, in the knock-in model, that the variant causes Mycn protein accumulation.
  - reference: PMID:37710961
    reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both MYCN-P60L and MYCN-T58M maintained their abilities to activate transcription of the downstream genes, CCND1 (MIM: 168461) and CCND2, in a similar manner to MYCN-WT"
    explanation: The stabilized mutants retain transcription factor activity, so accumulation translates into more MYCN activity rather than an inactive protein.
  downstream:
  - target: Prolonged Cyclin D1 and D2 Expression in Neural Progenitors
    description: Accumulated MYCN sustains expression of its cyclin D targets in neural progenitors.
    evidence:
    - reference: PMID:30573562
      reference_title: MYCN de novo gain-of-function mutation in a patient with a novel megalencephaly syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "appeared to induce CCND1 and CCND2 expression in neuronal progenitor and stem cells in vitro"
      explanation: Cultured neuronal progenitor and stem cells expressing MYCN-T58M showed induced CCND1 and CCND2.
  - target: Excess Proliferation of Intermediate Neural Precursors
    description: Mycn accumulation in the embryonic cortex drives over-proliferation of Tbr2-positive intermediate progenitors.
  - target: Postaxial polydactyly
    description: >-
      Mycn gain of function is sufficient to produce postaxial polydactyly in
      the knock-in mouse. The limb mechanism between MYCN accumulation and extra
      digit formation has not been studied.
    evidence:
    - reference: PMID:37710961
      reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "more than 90% of T58M/WT mice exhibited postaxial polydactyly at embryonic day 14.5"
      explanation: Introducing the patient variant into the mouse reproduces postaxial polydactyly.
  - target: Neuroblastoma
    description: >-
      MYCN is the canonical neuroblastoma oncogene and Thr58Met recurs as a
      somatic mutation in neuroblastoma, so a germline stabilizing variant is a
      plausible predisposing lesion. The causal link is inferred from that
      oncogenic role and from two of three patients developing infantile
      neuroblastoma; it has not been tested experimentally in this syndrome.
    evidence:
    - reference: PMID:37710961
      reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "the variant is often identified as a somatic mutation in malignant tumors, such as neuroblastoma, astrocytoma, and mesonephric carcinoma"
      explanation: >-
        The same Thr58Met change acts as a somatic tumor driver, which supports
        the inference that the germline variant predisposes to neuroblastoma.
- name: Prolonged Cyclin D1 and D2 Expression in Neural Progenitors
  description: >-
    MYCN-T58M induced and prolonged expression of the G1 cyclins CCND1 and CCND2
    in cultured neuronal progenitor and stem cells. CCND2 is itself the gene
    whose stabilizing variants cause
    megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome 3, which
    shares megalencephaly and postaxial polydactyly with this disorder. The cyclin D link has been shown in vitro
    only; it was not measured in the knock-in mouse.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CCND1
    term:
      id: hgnc:1582
      label: CCND1
  - preferred_term: CCND2
    term:
      id: hgnc:1583
      label: CCND2
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: MYCN-driven transcription of cyclin D genes
    modifier: INCREASED
    term:
      id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
  evidence:
  - reference: PMID:30573562
    reference_title: MYCN de novo gain-of-function mutation in a patient with a novel megalencephaly syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "leading to prolonged CCND1 and CCND2 expression"
    explanation: The index study concludes that MYCN stabilization prolongs CCND1 and CCND2 expression.
  downstream:
  - target: Excess Proliferation of Intermediate Neural Precursors
    description: >-
      Sustained cyclin D expression is the proposed driver of delayed cell-cycle
      exit and over-proliferation of cortical progenitors. This step is a
      hypothesis of the authors rather than a tested result.
    evidence:
    - reference: PMID:30573562
      reference_title: MYCN de novo gain-of-function mutation in a patient with a novel megalencephaly syndrome.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "This may promote neurogenesis in the developing cerebral cortex, leading to megalencephaly."
      explanation: The authors propose, without testing it directly, that prolonged cyclin D expression promotes cortical neurogenesis.
- name: Excess Proliferation of Intermediate Neural Precursors
  description: >-
    In the embryonic cortex of Mycn T58M heterozygous mice, Tbr2-positive
    intermediate neural precursors are increased in number while Pax6-positive
    radial glia are unchanged, and labelled progenitors leave the germinal zone
    late. The authors identify this over-proliferation as the cause of
    megalencephaly.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: intermediate neural precursor
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: neural precursor cell proliferation
    modifier: INCREASED
    term:
      id: GO:0061351
      label: neural precursor cell proliferation
  evidence:
  - reference: PMID:37710961
    reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the number of IPCs increased significantly, while the number of Pax6+ radial glia did not change"
    explanation: Quantifies the expansion of intermediate progenitors, but not radial glia, in the knock-in embryonic cortex.
  downstream:
  - target: Delayed Cortical Neuronal Migration
    description: Delayed cell-cycle exit of over-proliferating progenitors delays their migration out of the germinal zone.
    evidence:
    - reference: PMID:37710961
      reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the number of EdU-labeled cells migrating to the intermediate zone was significantly lower in T58M/WT mice"
      explanation: Pulse-labelled progenitors in knock-in embryos reach the intermediate zone in reduced numbers.
  - target: Increased Cortical Neuron Number and Cortical Thickening
    description: Over-proliferation of intermediate progenitors yields more cortical neurons.
    evidence:
    - reference: PMID:37710961
      reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "a gain of Mycn function and subsequent protein accumulation may cause excessive proliferation of IPCs and an ensuing delayed neuronal migration, leading to postnatal megalencephaly with an increased number of neurons"
      explanation: The authors' synthesis of the knock-in data links intermediate progenitor over-proliferation to the increased neuron number.
- name: Delayed Cortical Neuronal Migration
  description: >-
    Mycn overexpression mimicking Thr58Met in utero, and the Mycn T58M knock-in,
    both delay the migration of newborn neurons during corticogenesis. No
    neuronal migration malformation has been described on patient imaging,
    which showed no polymicrogyria.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neuron migration
    modifier: ABNORMAL
    term:
      id: GO:0001764
      label: neuron migration
  evidence:
  - reference: PMID:30573562
    reference_title: MYCN de novo gain-of-function mutation in a patient with a novel megalencephaly syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "affected neuronal cell migration during corticogenesis in mouse embryos"
    explanation: In utero Mycn overexpression mimicking the patient variant perturbs cortical neuronal migration.
- name: Increased Cortical Neuron Number and Cortical Thickening
  description: >-
    Knock-in mice have heavier brains from birth, a thicker cerebral cortex with
    more Satb2-positive and Tbr1-positive neurons, and an enlarged cerebellar
    vermis. The brain overgrowth is fixed before birth.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: cerebral cortex development
    modifier: ABNORMAL
    term:
      id: GO:0021987
      label: cerebral cortex development
  evidence:
  - reference: PMID:37710961
    reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the number of neurons in cortex layers II–IV, labeled with Satb2, and the number at layer VI, labeled with Tbr1, were significantly larger in T58M/WT mice"
    explanation: Counts of layer-specific neurons are increased in the perinatal knock-in cortex.
  downstream:
  - target: Megalencephaly
    description: More neurons and a thicker cortex produce an enlarged brain.
    evidence:
    - reference: PMID:37710961
      reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "indicating that the fate had been determined toward megalencephaly before birth"
      explanation: Ties the perinatal increase in cortical neurons to the megalencephaly seen later in the knock-in mouse.
phenotypes:
- name: Megalencephaly
  category: Neurological
  description: >-
    Enlarged brain, present in all three reported patients and detectable
    prenatally: the fetus with p.Pro60Leu had a brain weight above the 95th
    percentile at autopsy.
  phenotype_term:
    preferred_term: Megalencephaly
    term:
      id: HP:0001355
      label: Megalencephaly
  evidence:
  - reference: PMID:37710961
    reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients, a fetus subjected to termination of pregnancy and an 8-month-old boy, exhibited overlapping phenotypes with those observed in the previous case, including megalencephaly, ventriculomegaly, and postaxial polydactyly."
    explanation: Megalencephaly was present in both new patients as in the index case.
  - reference: PMID:37710961
    reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "brain weights were significantly lower in FS/WT, and higher in T58M/WT mice, compared with WT/WT mice at P56"
    explanation: The knock-in mouse recapitulates the enlarged brain, and the haploinsufficient mouse shows the opposite Feingold-like change.
- name: Ventriculomegaly
  category: Neurological
  description: >-
    Enlarged lateral ventricles in all three patients, without hydrocephalus.
    Absent hydrocephalus and polymicrogyria help distinguish the disorder from
    CCND2-related megalencephaly-polymicrogyria-polydactyly-hydrocephalus
    syndrome. No mechanism for the ventricular enlargement has been studied.
  phenotype_term:
    preferred_term: Ventriculomegaly
    term:
      id: HP:0002119
      label: Ventriculomegaly
  evidence:
  - reference: PMID:30573562
    reference_title: MYCN de novo gain-of-function mutation in a patient with a novel megalencephaly syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an undiagnosed neurodevelopmental disorder with megalencephaly, ventriculomegaly, hypoplastic corpus callosum, intellectual disability, polydactyly and neuroblastoma"
    explanation: The index patient had ventriculomegaly.
  - reference: PMID:37710961
    reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI showed an enlarged ventricle and hypoplastic corpus callosum"
    explanation: Patient 2 also had ventricular enlargement on MRI.
- name: Postaxial polydactyly
  category: Musculoskeletal
  description: >-
    Postaxial polydactyly was present in all three patients; the fetus had it
    on both hands. It is the digital mirror of the hypoplastic phalanges of
    Feingold syndrome.
  phenotype_term:
    preferred_term: Postaxial polydactyly
    term:
      id: HP:0100259
      label: Postaxial polydactyly
  evidence:
  - reference: PMID:37710961
    reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He showed post-axial polydactyly of both hands"
    explanation: Bilateral postaxial hand polydactyly in the fetus with p.Pro60Leu.
  - reference: PMID:37710961
    reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The boy exhibited megalencephaly, postaxial polydactyly, and dysmorphic facial gestalt"
    explanation: Postaxial polydactyly in patient 2 with p.Thr58Met.
- name: Hypoplasia of the corpus callosum
  category: Neurological
  description: >-
    Hypoplastic corpus callosum in the index patient and in patient 2. The
    source is internally inconsistent about the fetus: its Table 1 marks the
    feature as not found in patient 1, while its Discussion says all three
    cases had a hypoplastic corpus callosum. The entry follows the table. The
    thin callosum contrasts with the thick or large corpus callosum of
    CCND2-related megalencephaly syndrome.
  phenotype_term:
    preferred_term: Hypoplasia of the corpus callosum
    term:
      id: HP:0002079
      label: Hypoplasia of the corpus callosum
  evidence:
  - reference: PMID:37710961
    reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI showed an enlarged ventricle and hypoplastic corpus callosum"
    explanation: Patient 2 had a hypoplastic corpus callosum on MRI.
  - reference: PMID:30573562
    reference_title: MYCN de novo gain-of-function mutation in a patient with a novel megalencephaly syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an undiagnosed neurodevelopmental disorder with megalencephaly, ventriculomegaly, hypoplastic corpus callosum, intellectual disability, polydactyly and neuroblastoma"
    explanation: The index patient had a hypoplastic corpus callosum.
  - reference: PMID:37710961
    reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all three cases with MYCN gain-of-function variants showed a hypoplastic corpus callosum despite a megalencephalic cerebrum"
    explanation: >-
      The Discussion reports the feature in all three cases. Table 1 of the same
      paper marks it as not found in the fetus, which is the count this entry
      follows.
- name: Intellectual disability
  category: Neurological
  description: >-
    Severe intellectual disability in the index patient, a 15-year-old boy, and

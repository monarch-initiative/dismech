  notes: >-
    ClinGen rates the relationship Moderate rather than Definitive or Strong;
    five probands are counted. CAUSATIVE records the kind of relationship the
    disease concept is defined by (one heterozygous stabilizing MYCN variant
    suffices), and the validity tier is carried separately in
    gene_disease_validity. ClinGen also counts p.Pro44Thr and p.Pro60Ser from

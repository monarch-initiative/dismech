    snippet: "MYCN | HGNC:7559 | megalencephaly-polydactyly syndrome | MONDO:0958279 | AD | Moderate"
    explanation: ClinGen classifies MYCN as the gene for this disease.
  - reference: PMID:37710961
    reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of the clinical and functional data confirms MYCN gain-of-function variants as the cause of this megalencephaly-polydactyly syndrome"
    explanation: The second report establishes MYCN gain of function as the cause of the syndrome.
  variants:
  - name: MYCN p.Thr58Met
    description: >-
      NM_005378.6:c.173C>T, de novo and heterozygous in two unrelated patients
      (the index patient and patient 2), both of whom developed neuroblastoma.
      Removes the GSK3B phosphorylation site of the phosphodegron.
    evidence:
    - reference: PMID:30573562
      reference_title: MYCN de novo gain-of-function mutation in a patient with a novel megalencephaly syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a heterozygous missense mutation (c.173C>T; p.Thr58Met) in the MYCN gene"
      explanation: Identifies Thr58Met in the index patient.
    - reference: PMID:37710961
      reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified the same variant as in our previously reported patient, a de novo missense variant [NM_005378.6:c.173C>T; p.Thr58Met (T58M)]"
      explanation: Recurrence of the same de novo variant in an unrelated second patient.
  - name: MYCN p.Pro60Leu
    description: >-
      NM_005378.6:c.179C>T, de novo and heterozygous in a male fetus terminated
      at 31 weeks. Absent from gnomAD; reduces Thr58 phosphorylation and
      stabilizes MYCN in cells.
    evidence:
    - reference: PMID:37710961
      reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we report two unrelated megalencephalic patients with polydactyly harboring MYCN variants of p.Pro60Leu and Thr58Met"
      explanation: Identifies Pro60Leu as one of the two variants in the second report; trio sequencing showed it was de novo in patient 1.

animal_models:
- name: Mycn T58M knock-in mouse
  species: Mouse
  genotype: Mycn T58M/WT heterozygous knock-in (CRISPR/Cas9), C57BL/6NCr background
  publication: PMID:37710961
  description: >-
    Heterozygous knock-in of the patient Thr58Met variant. Mice are born at a
    Mendelian ratio and show Mycn protein accumulation in the embryonic cortex,
    postaxial polydactyly in more than 90%, larger brains with a thicker cortex
    and more neurons, enlarged kidneys with dilated tubules, and in females
    hydrometra with vaginal atresia. Both sexes fail to breed naturally.
  genes:
  - preferred_term: MYCN
    term:
      id: hgnc:7559
      label: MYCN
  associated_phenotypes:
  - Megalencephaly
  - Postaxial polydactyly
  - Enlarged kidneys with dilated renal tubules
  - Hydrometra and vaginal atresia
  - Infertility
  evidence:
  - reference: PMID:37710961
    reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The gain-of-function mouse model recapitulated the human phenotypes of megalencephaly and polydactyly"
    explanation: The knock-in reproduces the two defining human features.
  modeled_mechanisms:
  - target: MYCN Protein Accumulation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: Carries the patient variant at the endogenous locus and shows reduced Thr58 phosphorylation with Mycn accumulation.
    evidence:
    - reference: PMID:37710961
      reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We validated the decreased phosphorylation at T58 and subsequent accumulation of Mycn protein in T58M/WT mice"
      explanation: Confirms the molecular lesion in the model.
  - target: Excess Proliferation of Intermediate Neural Precursors
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Shows expanded Tbr2-positive intermediate progenitors in the embryonic cortex.
    limitations: >-
      Mouse cortex lacks the expanded outer subventricular zone of the human
      cortex, so the model cannot show whether outer radial glia, the major
      human basal progenitor population, are also over-proliferating.
    evidence:
    - reference: PMID:37710961
      reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "brain analyses revealed excess proliferation of intermediate neural precursors during neurogenesis, which we determined to be the pathomechanism underlying megalencephaly"
      explanation: The authors identify progenitor over-proliferation in the model as the mechanism of megalencephaly.
discussions:
- discussion_id: mps_renal_genital_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Mouse
  - phenotypes#Pyeloureteral dilatation
  prompt: >-
    The Mycn T58M knock-in mouse has enlarged kidneys with dilated tubules and,
    in females, vaginal atresia with hydrometra, but no kidney or genital
    malformation has been recognized in the three reported patients beyond one
    fetus with left pyeloureteral dilatation. Do patients have renal or
    reproductive tract anomalies that small numbers and young age have hidden,
    or is this a mouse-specific effect?
  rationale: >-
    The answer decides whether renal imaging and later gynecological assessment
    belong in the care of patients. All three reported patients are male, so the
    female reproductive phenotype could not have been observed.
  evidence:
  - reference: PMID:37710961
    reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Interestingly, the kidney and female reproductive tract exhibited overt morphological anomalies, possibly as a result of excess proliferation during organogenesis."
    explanation: States the extra-cerebral anomalies seen in the mouse.
- discussion_id: mps_neuroblastoma_risk
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Neuroblastoma
  prompt: >-
    What is the neuroblastoma risk with a germline stabilizing MYCN variant, and
    should affected infants receive tumor surveillance?
  rationale: >-
    Two of three patients developed neuroblastoma in infancy, but three patients
    cannot give a risk estimate, and no surveillance protocol has been proposed
    for this syndrome. The knock-in mouse study does not report tumors.
notes: >-
  The published literature consists of two case reports from one group (three
  patients) and that group's review; ClinGen additionally counts ClinVar
  probands with p.Pro44Thr and p.Pro60Ser whose clinical details are not
  published. Phenotype frequencies are therefore not recorded. OMIM catalogues
  the disorder as entry 620748.

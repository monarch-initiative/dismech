differential_diagnoses:
- name: Feingold syndrome type 1
  disease_term:
    preferred_term: Feingold syndrome type 1
    term:
      id: MONDO:0008115
      label: Feingold syndrome type 1
  description: >-
    Allelic disorder caused by MYCN loss of function (curated in
    Feingold_Syndrome). It presents as the mirror image of this syndrome:
    microcephaly instead of megalencephaly, hypoplastic phalanges and toe
    syndactyly instead of polydactyly, and gastrointestinal atresia.
  distinguishing_features:
  - Microcephaly rather than megalencephaly
  - Brachymesophalangy and toe syndactyly rather than postaxial polydactyly
  - Esophageal or duodenal atresia
  evidence:
  - reference: PMID:37710961
    reference_title: Gain-of-function MYCN causes a megalencephaly-polydactyly syndrome manifesting mirror phenotypes of Feingold syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Characteristic features of Feingold syndrome consist of microcephaly, intellectual disability, esophageal and duodenal atresia, and limb malformation, such as absent/hypoplastic phalanx."
    explanation: Describes the opposite-direction features of the loss-of-function MYCN disorder.
- name: Megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome 3
  disease_term:
    preferred_term: megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome 3
    term:
      id: MONDO:0014408
      label: megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome 3
  description: >-
    Caused by stabilizing variants in CCND2, a MYCN target gene, and shares

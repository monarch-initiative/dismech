notes: >-
  Why this entry exists. Kashin-Beck disease is the knowledge base's clearest
  case of a disease with a settled clinical picture and an unsettled cause. The
  lesion, the tissue and the natural history are not in dispute; the
  environmental agent has been argued for seventy years. Rather than pick a
  winner, the entry curates the compound reading as CANONICAL and the four
  single-factor hypotheses as ALTERNATIVE, and tags causal edges with the
  hypothesis groups they belong to, so a reader can see which parts of the chain
  depend on which etiology. All four single-factor groups now tag at least one
  edge; `compound_etiology` tags the two initiating exposures it combines.

  On the deep-research report. It needed heavy discounting: its own validation
  recorded four of six checked quotes as absent from the papers they were
  attributed to, three unresolved references, and nine mislabelled ontology
  terms - among them `CL:0000605` offered for "articular chondrocyte" when it is
  *fungal asexual spore*, `UBERON:0000004` for "ankle joint region" when it is
  *nose*, and `UBERON:0001415` for "interphalangeal joint" when it is *skin of
  pelvis*. None of the nine is bound anywhere in this entry. Two CURIEs the
  report flagged with hedged labels were checked and are correct as identifiers
  - `GO:0097707` (ferroptosis) and `CL:0000743` (hypertrophic chondrocyte) - and
  are used here under their real ontology labels. Every snippet in this entry
  was copied from a reference cache fetched and read directly rather than from
  the report; three of the papers cited here (PMID:35304334, PMID:31490368 and
  PMID:41342918) do also appear in the report, and two snippets used here appear
  in it as quoted text - the four-hypotheses sentence at report line 620 and the
  prevention-ranking sentence at report line 969 - so "found independently"
  would be too strong a claim for those and is not made. Both of the report's
  versions are truncated or mis-transcribed relative to the cached source, which
  is why the snippets here were taken from the cache instead.

  Negative and refuting results are curated on purpose, because in this disease
  they carry most of the information. The selenoprotein meta-analysis found
  GPX1, GPX4, SEPP1 and TrxR2 *not* associated with susceptibility, and a
  Tibetan replication found no single-SNP association at all. The randomised
  Tibetan supplementation trial found selenium had no effect on established
  disease once iodine was corrected. The network meta-analysis reports vitamin C
  and aspirin as effective for radiographic structure and, in the same abstract,
  as not established. The workhorse rat model explicitly fails to reproduce the
  human growth-plate lesion. Each of these is recorded as a REFUTE item against
  the claim it bears on, next to the positive evidence, rather than omitted.

  Deliberate non-bindings, so they are not re-litigated. Both the selenium and
  iodine `exposure_term`s are unbound because every ECTO selenium and iodine term
  denotes the element being present, which is the opposite of the exposure; the note
  on the selenium entry records `ECTO:0400019` "exposure to decreased protein in food"
  as the template a new-term request should follow. All three histopathology
  `finding_term`s are unbound because each is a multi-part post-composition and NCIT's
  closest term, `NCIT:C36184` (Necrosis), names one component of three. Two GO
  bindings are deliberately broader than the claim they carry - `GO:0002062`
  (chondrocyte differentiation) for the terminal step alone, and `GO:0022900`
  (electron transport chain) for the mitochondrial respiratory chain - and each says so
  in a note beside it, with the specificity carried in `preferred_term`.

  On the Chinese national clinical grading. Degrees I to III are the operative
  severity scale in this literature and the axis the burden data are stratified by, and
  they are deliberately not modelled as `stages:`. `progression:` holds the two-phase
  natural history, which is a different axis - a phase of the disease, not a severity
  tier - and `diagnosis:` holds the radiographic grading schemes. The grading's own
  definitional content sits in WS/T 207-2010, whose text was not obtained here, so a
  `stages:` block would be three names with no criteria behind them. It is recorded as
  an open item rather than filled in badly.

  Not curated, and why. A further 24 references were fetched and read during
  this session and are not cited here: gut-microbiome and faecal-metabolomic
  profiling (PMID:34711812, PMID:37960304), SIRT3 and WISP1 work
  (PMID:42559309, PMID:38003226), p-ATF2 and Zip6 expression studies, spatial
  and health-loss epidemiology (PMID:33375039, PMID:41255597, PMID:41984302,
  PMID:42205027), and three deep-learning radiographic classifiers. These were
  read and judged out of scope for a first entry rather than left unverified:
  the omics work is association-level and would need a mechanism node this entry
  cannot yet support, and the imaging-classifier papers describe tools rather
  than disease mechanism. Their caches are deliberately not committed with this
  entry, so every `references_cache` file in this changeset is one this entry
  actually cites. PMID:41425094 is the exception in the other direction: its
  cache is committed because the entry links it as the `publication` of
  `geo:GSE311894`, but the entry quotes nothing from it - what it quotes for that
  series is the GEO record itself, including the hedged "may contribute to
  elucidating" sentence, graded `NO_EVIDENCE`.

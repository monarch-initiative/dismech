    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The X-ray grading of adult KBD ankles was conducted using the Kellgren-Lawrence grading as a reference."
    explanation: >-
      That the adult disease is graded on the standard osteoarthritis scale is
      the evidence for treating this as a degenerative arthropathy.


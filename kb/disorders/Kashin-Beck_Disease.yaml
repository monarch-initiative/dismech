- name: Symmetric Growth Arrest and Joint Deformity
  description: >-
    Because the growth plates fail while the child is still growing, the
    shortening is symmetric and affects the most actively growing bones. The
    clinical result is the triad the disease is recognised by: enlarged finger
    joints, shortened fingers, and short stature.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:31335683
    reference_title: "Conservative tibiotalocalcaneal fusion for partial talar avascular necrosis in conjunction with ankle and subtalar joint osteoarthritis in Kashin-Beck disease: A case report."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Kashin-Beck disease (KBD) is known for some typical characters like finger joint enlargement, shortened fingers, and dwarfism."
    explanation: >-
      The clinical triad this node produces. Graded OTHER: the sentence is a
      case report's framing of the disease rather than a study result.
  - reference: PMID:23701828
    reference_title: "An animal model of Kashin-Beck disease induced by a low-nutrition diet and exposure to T-2 toxin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A rat model of KBD induced by a low-nutrition diet and T-2 toxin exposure demonstrated radiographic and histopathological abnormalities of the proximal epiphyseal plate and the tibial metaphysis that are very similar to the bone changes found in patients with KBD."
    explanation: >-
      The model's own account of the same outcome - plate and metaphyseal
      changes matching those in patients.

- name: Secondary Degenerative Arthropathy
  description: >-
    The articular cartilage damage does not stop when growth does. Adults carry
    a deforming arthropathy with pain and restricted movement, graded
    radiographically much as primary osteoarthritis is - which is also why the
    disease is easy to mistake for it outside endemic areas.
  biological_scale: ORGANISM
  locations:
  - preferred_term: articular cartilage
    term:
      id: UBERON:0010996
      label: articular cartilage of joint
  evidence:
  - reference: PMID:41342918

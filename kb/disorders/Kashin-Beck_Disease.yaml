- name: Endochondral Ossification Failure at the Growth Plate
  description: >-
    Where the chondrocytes die, the growth plate cannot convert cartilage to
    bone, and ossification becomes irregular. The oldest histology of the
    disease describes the same failure from a different
    angle: the proximal cartilage end plate of the phalanx is unvascularised,
    with epiphyseal bone formation altered around it.
  biological_scale: TISSUE
  locations:
  - preferred_term: epiphyseal plate
    term:
      id: UBERON:0002516
      label: epiphyseal plate
  biological_processes:
  - preferred_term: ossification
    modifier: DECREASED

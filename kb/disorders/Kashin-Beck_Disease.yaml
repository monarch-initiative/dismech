- category: Musculoskeletal
  name: Sarcopenia Risk
  description: >-
    Adults with the disease screen positive for sarcopenia risk more often than
    propensity-matched non-affected residents of the same endemic area, and the
    disease remains an independent risk factor in multivariate analysis.
  phenotype_term:
    preferred_term: reduced skeletal muscle mass and strength
    term:
      id: HP:0003202
      label: Skeletal muscle atrophy
  reports_on:
  - target: Secondary Degenerative Arthropathy
    relationship: READOUT_OF
  evidence:
  - reference: PMID:39770964
    reference_title: "Kashin-Beck Disease: A Risk Factor for Sarcopenia and Its Interaction with Selenium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KBD as an independent risk factor increased the risk of sarcopenia for patients."
    explanation: >-
      The independent association this record names, after propensity-score
      matching within the endemic area.
  notes: >-
    Bound to the closest available HP term. `HP:0003202` names muscle atrophy;
    what was measured is a SARC-F screening score, which is a risk instrument
    rather than a confirmed diagnosis, and `preferred_term` carries that
    distinction.

- category: Neuropsychiatric
  name: Depression
  description: >-
    Depressive symptoms are common in adults with the disease, and are
    associated with pain severity and with comorbid chronic disease.
  phenotype_term:
    preferred_term: Depression
    term:
      id: HP:0000716
      label: Depression
  evidence:
  - reference: PMID:40963707
    reference_title: "Prevalence and Risk Factors of Depression in Patients With Endemic Osteoarthritis Kashin-Beck Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Depression was present in 53.2% of patients in our KBD samples."
    explanation: >-
      The measured prevalence on PHQ-9 in a field survey of 440 subjects in
      endemic areas of northwest China.
  - reference: PMID:40963707
    reference_title: "Prevalence and Risk Factors of Depression in Patients With Endemic Osteoarthritis Kashin-Beck Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Being male (odds ratio [OR]: 0.296, 95% confidence interval [CI]: 0.180-0.486, p < 0.001) was an independent protective factor for depression, while the presence of comorbid chronic diseases (OR: 4.701, 95% CI: 2.292-9.640, p < 0.001), and a higher visual analog scale (VAS) pain level (OR: 5.275, 95% CI: 1.326-20.978, p=0.018) were independent risk factors for depression in KBD patients."
    explanation: The associated factors this record names, from the same logistic regression.

histopathology:
- name: Deep-Zone Acellular Areas with Surrounding Chondrocyte Clusters
  description: >-
    The characteristic cartilage picture: patches in the deep zone emptied of
    chondrocytes, ringed by clusters of surviving cells, with the remaining
    cells staining palely. The clustering is the cartilage's attempt to
    repopulate what the necrosis removed.
  finding_term:
    preferred_term: deep-zone chondronecrosis with peripheral chondrocyte clustering
  diagnostic: true
  notes: >-
    `finding_term` is left unbound. NCIT was searched under the Morphologic Finding
    branch and the closest term is `NCIT:C36184` (Necrosis), which names only one
    component of a three-part post-composition - the zone, the acellular patches and
    the compensatory clustering are all lost by it. Binding the bare necrosis term
    would make the record look grounded while discarding what identifies it. No term
    beats a bad one.
  evidence:
  - reference: PMID:30680829
    reference_title: "Death of chondrocytes in Kashin-Beck disease: Apoptosis, necrosis or necroptosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In KBD cartilage chondrocyte death was characterized by paler staining of the cells. Multiple chondral cell clusters surrounded the areas lacking cells in the deep zone."
    explanation: The finding this record names, in patient cartilage.

- name: Zone-Dependent Cell Death Markers
  description: >-
    TUNEL and RIP3 positivity concentrate in the middle zone while frank
    necrotic ultrastructure sits in the deep zone - the histological basis for
    this entry treating chondrocyte death as mixed-mode and zone-sorted rather
    than uniform.
  finding_term:
    preferred_term: middle-zone TUNEL and RIP3 positivity with deep-zone necrosis
  notes: >-
    Unbound for the same reason as the record above: this is a post-composition of two
    immunostain readouts and an ultrastructural finding across two cartilage zones, and
    NCIT has no single term for it.
  evidence:
  - reference: PMID:30680829
    reference_title: "Death of chondrocytes in Kashin-Beck disease: Apoptosis, necrosis or necroptosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The per cent of TUNEL-positive and RIP3-positive chondrocytes were higher in the middle zones of KBD samples"
    explanation: The zonal distribution of the death markers.
  - reference: PMID:30680829
    reference_title: "Death of chondrocytes in Kashin-Beck disease: Apoptosis, necrosis or necroptosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ultrastructural analysis of chondrocyte from deep cartilage revealed abnormal cells with numerous morphological changes, such as plasma membrane breakdown, generalized swelling of the cytoplasm and loss of identifiable organelles."
    explanation: >-
      The deep-zone ultrastructure, which is a different picture from the middle
      zone. The cached full text places the transmission electron microscopy in
      cartilage from affected children (Figure 5), not in the rat arm.

- name: Absent Vascularisation of the Phalangeal Cartilage End Plate
  description: >-
    In supernumerary fingers removed from affected children and in
    intra-articular bodies from advanced cases, the proximal cartilage end plate
    of the phalanx carries no vascularisation, and epiphyseal bone formation
    around it is altered.
  finding_term:
    preferred_term: unvascularised proximal cartilage end plate of the phalanx
  notes: >-
    Unbound: NCIT's Morphologic Finding branch has no term for absent vascularisation of
    a named cartilage structure.
  evidence:
  - reference: PMID:11482529
    reference_title: "Histology of Kashin-Beck lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevailing characteristic of the samples is the absence of vascularisation within the proximal cartilage end plate of the phalanx associated with an alteration of the epiphyseal bone formation."
    explanation: >-
      The finding this record names, and the observation behind the
      angiogenesis-failure reading discussed under `kbd_vascular_direction`.

environmental:
- name: Habitual consumption of grain contaminated with Fusarium T-2 trichothecene mycotoxin
  description: >-
    Grain grown and stored in endemic highland areas carries T-2 toxin from
    Fusarium species. The toxin is directly chondrotoxic, and replacing the
    grain supply is the single most effective preventive measure tested - which
    is the strongest practical argument that this exposure is doing real causal
    work rather than travelling with something else.
  exposure_term:
    preferred_term: dietary exposure to Fusarium T-2 trichothecene mycotoxin in stored grain
    term:
      id: ECTO:0000524
      label: exposure to mycotoxin
  exposure_classifications:
    hazard_agent_type:
    - classification_value: BIOLOGICAL
      notes: >-
        Classified biological because the agent is a fungal secondary
        metabolite, on the same reasoning that makes `Byssinosis` BIOLOGICAL for
        bacterial endotoxin, rather than CHEMICAL as for the mineral-dust
        entries.
    exposure_route:
    - classification_value: ORAL
    exposure_duration:
    - classification_value: CHRONIC
    exposome_domain:
    - classification_value: SPECIFIC_EXTERNAL
  influences_mechanisms:
  - target: Dietary T-2 Toxin Exposure
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Ingested T-2 toxin is the exposure this initiating node describes.
    evidence:
    - reference: PMID:42103195
      reference_title: "Deferoxamine alleviates T-2 toxin-induced articular chondrocyte ferroptosis via the Nrf2/xCT/GPX4 axis: Implications for Kashin-Beck disease pathology."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "T-2 toxin exposure induced severe articular cartilage degradation, accompanied by intracellular iron overload lipid peroxidation, oxidative stress and distinctive mitochondrial damage characteristic of ferroptosis."
      explanation: The controlled demonstration that the toxin alone damages articular cartilage.
  notes: >-
    No IARC group is recorded: IARC has not classified T-2 toxin in a group this
    entry would be entitled to assert, and Kashin-Beck disease is not a
    neoplastic outcome.
  evidence:
  - reference: PMID:35304334
    reference_title: "Animal models of Kashin-Beck disease exposed to environmental risk factors: Methods and comparisons."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Gradually, four etiological hypotheses have been formed, including water of organic poisoning hypothesis represented by fulvic acid (FA), biogeochemical hypothesis represented by selenium (Se) deficiency, food mycotoxin poisoning hypothesis represented by T-2 toxin poisoning and compound etiology theory hypothesis."
    explanation: Names the food mycotoxin hypothesis and its representative agent.
  - reference: PMID:41272335
    reference_title: "Investigation of Selenium and T-2 Toxin Exposure Levels in the Internal and External Environments of Key Areas of Kashin Beck Disease in China."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although Kashin-Beck disease (KBD) in China has been effectively controlled through comprehensive measures such as selenium supplementation and grain replacement, the underlying environmental risk factors may still persist."
    explanation: >-
      Establishes that the exposure is monitored as a live risk rather than a
      historical one, which is why it is curated as a current exposure. Graded
      OTHER for consistency with the other background sentences quoted here.

- name: Residence on selenium-poor soil with correspondingly low dietary selenium
  description: >-
    Endemic areas sit on soils low in selenium, and the population eats what
    grows there. This is an exposure by absence, which is why it is curated
    separately from the mycotoxin rather than folded into a single "endemic
    diet" entry - the interventions that address it, selenium salt and
    supplementation, are different interventions.
  exposure_term:
    preferred_term: low dietary selenium intake from selenium-poor soil
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
      notes: >-
        Recorded CHEMICAL because the agent is an element, though the hazard is
        its absence rather than its presence - a case the vocabulary does not
        distinguish.
    exposure_route:
    - classification_value: ORAL
    exposure_duration:
    - classification_value: CHRONIC
    exposome_domain:
    - classification_value: GENERAL_EXTERNAL
      notes: >-
        Recorded GENERAL_EXTERNAL rather than SPECIFIC_EXTERNAL because the
        determinant is the regional geochemistry of the food supply, not a
        discrete personal exposure.
  influences_mechanisms:
  - target: Chronic Dietary Selenium Deficiency
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Recorded PREDISPOSES rather than TRIGGERS: low selenium sets the
      susceptible state, and the best-characterised animal model needs the toxin
      on top of it to produce the deep-zone lesion that resembles the human
      disease.
    evidence:
    - reference: PMID:22258458
      reference_title: "Histopathology of chondronecrosis development in knee articular cartilage in a rat model of Kashin-Beck disease using T-2 toxin and selenium deficiency conditions."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Chondronecrosis in deep zone of articular cartilage of knee joints was seen in both the low and high T-2 toxin plus selenium-deficient diet groups, these chondronecrotic lesions being very similar to chondronecrosis observed in human KBD."
      explanation: >-
        The lesion that matches human cartilage appears only in the groups given
        both the toxin and the selenium-deficient diet, which is the evidence
        for the predisposing rather than triggering role.
  notes: >-
    `exposure_term` is left unbound. ECTO was searched for a selenium-deficiency
    exposure and has none: `ECTO:0900038` (exposure to selenium via ingestion),
    `ECTO:9000950` (exposure to selenium) and `ECTO:9000192` (exposure to
    selenium ion) all denote the presence of the element, which is the opposite
    of the exposure here. ECTO does carry the pattern this needs elsewhere -
    `ECTO:0400019` is "exposure to decreased protein in food" - so an
    "exposure to decreased selenium in food" term is the natural new-term
    request, and that template is recorded here so the next curator does not
    have to rediscover it. A wrong binding would be worse than none.
  evidence:
  - reference: PMID:35304334
    reference_title: "Animal models of Kashin-Beck disease exposed to environmental risk factors: Methods and comparisons."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Gradually, four etiological hypotheses have been formed, including water of organic poisoning hypothesis represented by fulvic acid (FA), biogeochemical hypothesis represented by selenium (Se) deficiency, food mycotoxin poisoning hypothesis represented by T-2 toxin poisoning and compound etiology theory hypothesis."
    explanation: Names the biogeochemical selenium-deficiency hypothesis.
  - reference: PMID:41272335
    reference_title: "Investigation of Selenium and T-2 Toxin Exposure Levels in the Internal and External Environments of Key Areas of Kashin Beck Disease in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results showed that the average soil selenium content in both endemic and non-endemic villages across the six provinces was below 0.2 mg/kg."
    explanation: >-
      Curated because it complicates the exposure rather than confirming it:
      soil selenium was low in endemic *and* non-endemic villages alike, so
      soil selenium by itself does not mark out where the disease occurs.

- name: Residence in an iodine-deficient highland area
  description: >-
    In the Tibetan endemic area iodine deficiency is severe and near-universal,
    and it is the deficiency that survives multivariate adjustment against the
    disease where serum selenium does not. Curated as a separate exposure
    because it has its own intervention - iodised oil - with its own measured
    effect on growth.
  exposure_term:
    preferred_term: low dietary iodine intake in an iodine-deficient highland area
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
      notes: >-
        Recorded CHEMICAL on the same reasoning as the selenium entry: the agent
        is an element and the hazard is its absence.
    exposure_route:
    - classification_value: ORAL
    exposure_duration:
    - classification_value: CHRONIC
    exposome_domain:
    - classification_value: GENERAL_EXTERNAL
  influences_mechanisms:
  - target: Iodine Deficiency and Hypothyroidism
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      The dietary exposure behind the biochemical state this node records.
    evidence:
    - reference: PMID:9770558
      reference_title: "Kashin-Beck osteoarthropathy in rural Tibet in relation to selenium and iodine status."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "When age and sex were controlled for in a multivariate analysis, low urinary iodine, high serum thyrotropin, and low serum thyroxine-binding globulin values were associated with an increased risk of Kashin-Beck disease, but a low serum selenium concentration was not."
      explanation: >-
        Low urinary iodine as an independently associated exposure, with the
        thyroid markers that go with it.
  notes: >-
    `exposure_term` is unbound for the same reason as the selenium entry:
    `ECTO:9000084` is "exposure to iodine", which denotes the presence of the
    element rather than its absence, and no decreased-iodine term exists.
  evidence:
  - reference: PMID:9770558
    reference_title: "Kashin-Beck osteoarthropathy in rural Tibet in relation to selenium and iodine status."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In areas where severe selenium deficiency is endemic, iodine deficiency is a risk factor for Kashin-Beck disease."
    explanation: The study's conclusion naming iodine deficiency as a risk factor for the disease.
  - reference: PMID:11482536
    reference_title: "Kashin-Beck disease: from etiology to prevention or from prevention to etiology?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Four factors have been convincingly associated with the disease: selenium deficiency, iodine deficiency, grain contamination with mycotoxin-producing fungi, and water pollution with organic material and fulvic acid."
    explanation: Lists iodine deficiency among the four convincingly associated factors.

- name: Fluoride exposure modifying T-2 toxin detoxification
  description: >-
    Fluoride suppresses carboxylesterase 1, the enzyme that hydrolyses T-2 toxin
    to its less toxic metabolites. Where fluoride exposure is high, the same
    dietary toxin dose reaches chondrocytes in its most toxic form. Curated as a
    modifying exposure rather than an initiating one: nothing here says fluoride
    alone causes the disease.
  exposure_term:
    preferred_term: exposure to fluoride
    term:
      id: ECTO:9000423
      label: exposure to fluoride
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
    exposure_route:
    - classification_value: ORAL
    exposure_duration:
    - classification_value: CHRONIC
    exposome_domain:
    - classification_value: SPECIFIC_EXTERNAL
  influences_mechanisms:
  - target: Dietary T-2 Toxin Exposure
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Acts on the toxin exposure node by blocking its detoxification rather than
      by adding to the dose.
    evidence:
    - reference: PMID:35990316
      reference_title: "Fluorine impairs carboxylesterase 1-mediated hydrolysis of T-2 toxin and increases its chondrocyte toxicity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We identified that recombinant human CES1 was involved in T-2 toxin hydrolysis to generate HT-2 toxin, but not NEO, and NaF repressed the formation of HT-2 toxin."
      explanation: >-
        The biochemical result: recombinant CES1 hydrolyses the toxin and sodium
        fluoride represses that hydrolysis.
  evidence:
  - reference: PMID:35990316
    reference_title: "Fluorine impairs carboxylesterase 1-mediated hydrolysis of T-2 toxin and increases its chondrocyte toxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This study reveals that CES1 is responsible for the hydrolysis of T-2 toxin, and that fluoride impairs CES1-mediated T-2 toxin detoxification to increase its chondrocyte toxicity."
    explanation: >-
      The authors' conclusion across the enzymology and the chondrocyte
      toxicity assays. Graded OTHER as a conclusion drawn across both.

genetic:
- name: SELENOS susceptibility variant
  gene_term:
    preferred_term: SELENOS
    term:
      id: hgnc:30396
      label: SELENOS
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  frequency: pooled allele-model odds ratio 2.47 (1.85-3.29) in the meta-analysis
  notes: >-
    SEPS1 in the older literature. Curated as susceptibility, not causation -
    none of these variants produces the disease outside an endemic area.
  evidence:
  - reference: PMID:33844169
    reference_title: "Meta-analysis of Association Studies of Selenoprotein Gene Polymorphism and Kashin-Beck Disease: an Updated Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that the DIO2 (rs225014), SEPS1 (-105G>A), and Sep15 (rs5859) gene polymorphism are associated with susceptibility to KBD."
    explanation: The meta-analysis conclusion naming this locus among the three associated ones.
  - reference: PMID:33844169
    reference_title: "Meta-analysis of Association Studies of Selenoprotein Gene Polymorphism and Kashin-Beck Disease: an Updated Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The OR and 95%CI for SEPS1 (-105G>A) were 2.47 (1.85, 3.29), 9.36 (4.58, 19.12), 2.17 (1.53, 3.08), and 8.60 (4.25, 17.38) in the allele, homozygote, dominant, and recessive models, respectively."
    explanation: The pooled effect estimates this record's `frequency` reports.
  - reference: PMID:33844169
    reference_title: "Meta-analysis of Association Studies of Selenoprotein Gene Polymorphism and Kashin-Beck Disease: an Updated Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were a total of eight included case-control studies covering 2025 KBD patients and 1962 controls."
    explanation: The size of the pooled sample behind those estimates.

- name: SELENOF susceptibility variant
  gene_term:
    preferred_term: SELENOF
    term:
      id: hgnc:17705
      label: SELENOF
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  frequency: pooled allele-model odds ratio 2.05 (1.06-3.96) in the meta-analysis
  notes: >-
    Sep15 in the older literature. Split into its own record so the three
    associated selenoprotein loci are individually queryable rather than hidden
    behind one gene binding.
  evidence:
  - reference: PMID:33844169
    reference_title: "Meta-analysis of Association Studies of Selenoprotein Gene Polymorphism and Kashin-Beck Disease: an Updated Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that the DIO2 (rs225014), SEPS1 (-105G>A), and Sep15 (rs5859) gene polymorphism are associated with susceptibility to KBD."
    explanation: The meta-analysis conclusion naming this locus among the three associated ones.
  - reference: PMID:33844169
    reference_title: "Meta-analysis of Association Studies of Selenoprotein Gene Polymorphism and Kashin-Beck Disease: an Updated Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, the OR and 95%CI for Sep15 (rs5859) were 2.05 (1.06, 3.96) in the allele model."
    explanation: >-
      The pooled estimate, and the one with the widest interval of the three -
      it only just clears 1.

- name: DIO2 variant
  gene_term:
    preferred_term: DIO2
    term:
      id: hgnc:2884
      label: DIO2
  relationship_type: PROTECTIVE
  variant_origin: GERMLINE
  frequency: pooled allele-model odds ratio 0.69 (0.52-0.91) - the association runs in the protective direction
  notes: >-
    Recorded PROTECTIVE rather than SUSCEPTIBILITY because the pooled
    association runs below 1, and because DIO2 encodes the deiodinase that activates
    thyroid hormone - which puts it on the iodine arm of the etiology as much as
    the selenium one. A Tibetan replication study found no single-SNP
    association for rs225014, so the effect is not established across
    populations.
  evidence:
  - reference: PMID:33844169
    reference_title: "Meta-analysis of Association Studies of Selenoprotein Gene Polymorphism and Kashin-Beck Disease: an Updated Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that the DIO2 (rs225014), SEPS1 (-105G>A), and Sep15 (rs5859) gene polymorphism are associated with susceptibility to KBD."
    explanation: >-
      The meta-analysis conclusion naming this locus among the three associated ones.
      Read with the numbers, not the wording: the sentence says "susceptibility" for all
      three loci together, while all three of its pooled DIO2 estimates run below 1. This
      record follows the estimates, which is why it is PROTECTIVE rather than
      SUSCEPTIBILITY.
  - reference: PMID:33844169
    reference_title: "Meta-analysis of Association Studies of Selenoprotein Gene Polymorphism and Kashin-Beck Disease: an Updated Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meta-analysis results show that the pooled odds ratios (OR) and 95% confidence intervals (CI) for DIO2 (rs225014) were 0.69 (0.52, 0.91), 0.69 (0.50, 0.96), and 0.72 (0.52, 0.99) in the allele, heterozygote, and dominant models, respectively."
    explanation: >-
      The pooled estimates, all three below 1, which is what makes this record
      PROTECTIVE rather than SUSCEPTIBILITY.
  - reference: PMID:24058403
    reference_title: "Association study of polymorphisms in selenoprotein genes and Kashin-Beck disease and serum selenium/iodine concentration in a Tibetan population."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we showed that single SNPs in the genes GPX1 (rs1050450, rs1800668 and rs3811699), TrxR2 (rs5748469), and DIO2 (rs225014) may not be significantly associated with KBD in a Tibetan population."
    explanation: >-
      The replication failure in a Tibetan population, which is why this record
      says the effect is not established rather than reporting the pooled
      estimate alone.
  - reference: PMID:25072641
    reference_title: "Gene expression analysis suggests bone development-related genes GDF5 and DIO2 are involved in the development of Kashin-Beck disease in children rather than adults."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, bone development-related genes GDF5 (expression ratio = 2.14±0.02) and DIO2 (expression ratio = 0.11±0.05) may contribute to the development of KBD in children rather than in adults."
    explanation: >-
      Graded INDIRECT: an expression difference in patient blood cells is not an
      allelic association, but it is independent evidence that this gene is
      involved, and it is specific to affected children.

- name: ADAM12 susceptibility variants
  gene_term:
    preferred_term: ADAM12
    term:
      id: hgnc:190
      label: ADAM12
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  frequency: rs1278300 reached p = 9.25e-9 in the discovery scan and replicated at p = 0.007
  notes: >-
    ADAM12 is a matrix metalloproteinase-family gene, not a selenoprotein, and
    it carries the strongest single association curated in this entry. It is
    recorded here because an earlier draft of this entry claimed that
    susceptibility maps to selenoprotein genes rather than to cartilage
    structural genes; that claim was drawn from a meta-analysis whose search
    strategy was the two terms "selenoprotein" and "Kashin-Beck disease", so it
    could not have found a cartilage gene had one existed. This is the
    counterexample.
  evidence:
  - reference: PMID:27545300
    reference_title: "A bivariate genome-wide association study identifies ADAM12 as a novel susceptibility gene for Kashin-Beck disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the BGWAS, ADAM12 gene achieved the most significant association (rs1278300 p-value = 9.25 × 10(-9)) with the KBD."
    explanation: The discovery association from a two-stage bivariate genome-wide scan in 2,417 subjects.
  - reference: PMID:27545300
    reference_title: "A bivariate genome-wide association study identifies ADAM12 as a novel susceptibility gene for Kashin-Beck disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemistry revealed significantly decreased expression level of ADAM12 protein in the KBD articular cartilage (average positive chondrocyte rate = 47.59 ± 7.79%) compared to healthy articular cartilage (average positive chondrocyte rate = 64.73 ± 5.05%)."
    explanation: >-
      The protein-level follow-up in patient cartilage, which is what makes this
      a mechanistic lead rather than a bare association signal.
  - reference: PMID:33844169
    reference_title: "Meta-analysis of Association Studies of Selenoprotein Gene Polymorphism and Kashin-Beck Disease: an Updated Systematic Review."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "PubMed, Google Scholar, Cochrane library, and Chinese National Knowledge Infrastructure (CNKI) were electronically searched using the terms \"selenoprotein\" and \"Kashin-Beck disease\" or \"KBD\" with a search time from the establishment of the database to January 2021."
    explanation: >-
      Graded NO_EVIDENCE and curated here on purpose: the selenoprotein
      meta-analysis searched on the two terms "selenoprotein" and "Kashin-Beck
      disease", so it bears on this gene not at all and could not have found it.
      That is the reason the retracted claim about selenoprotein genes versus
      cartilage genes was never supportable from it.

- name: Selenoprotein loci tested and not associated
  gene_term:
    preferred_term: GPX1
    term:
      id: hgnc:4553
      label: GPX1
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  notes: >-
    A negative record, kept on purpose, and recorded DISPUTED because that is
    the only value in the vocabulary that does not assert an association. GPX1,
    GPX4, SEPP1 and TrxR2 are exactly
    the selenoproteins a reader would expect to be implicated in a
    selenium-deficiency disease, and the meta-analysis found none of them
    associated. `gene_term` carries GPX1 as the representative locus; the others
    are named in the quoted result.
  evidence:
  - reference: PMID:33844169
    reference_title: "Meta-analysis of Association Studies of Selenoprotein Gene Polymorphism and Kashin-Beck Disease: an Updated Systematic Review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "For GPX1 (rs1050450, rs1800668, rs3811699), DIO2 (rs225014, rs1352815, rs1388382), TrxR2 (rs1139793, rs5746841), GPX4 (rs713041, rs4807542), and SEPP1 (rs7579, 25191g/a), there was no significant statistical difference between the KBD and control groups (P>0.05)."
    explanation: >-
      Graded REFUTE against this record's own claim, which is the claim that
      these loci confer susceptibility. The meta-analysis tested them and found
      no difference between cases and controls.
  - reference: PMID:24058403
    reference_title: "Association study of polymorphisms in selenoprotein genes and Kashin-Beck disease and serum selenium/iodine concentration in a Tibetan population."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we showed that single SNPs in the genes GPX1 (rs1050450, rs1800668 and rs3811699), TrxR2 (rs5748469), and DIO2 (rs225014) may not be significantly associated with KBD in a Tibetan population."
    explanation: The same negative result in an independent Tibetan population.

diagnosis:
- name: Hand Radiography in Children
  description: >-
    Hand radiography is the primary screening measure in endemic areas, and its
    weak point is specificity: a large survey of 3,193 children found several
    normal-variant and developmental signs that are read as positive, the
    commonest being closure reaction of the metaphysis-epiphysis at 14%.
  evidence:
  - reference: PMID:29459762
    reference_title: "The characteristics of positive and confusing hand X-ray signs in diagnosing Kashin-Beck Disease in children in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When screening for Kashin-Beck disease (KBD) in children, hand X-ray examination is the most important measure."
    explanation: States the role of hand radiography in screening, which is what this record describes.
  - reference: PMID:29459762
    reference_title: "The characteristics of positive and confusing hand X-ray signs in diagnosing Kashin-Beck Disease in children in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, there is high rate of misdiagnosis because of confusing X-ray signs."
    explanation: The misdiagnosis problem this record records as the method's limitation.
  - reference: PMID:29459762
    reference_title: "The characteristics of positive and confusing hand X-ray signs in diagnosing Kashin-Beck Disease in children in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The confusing X-ray signs included closure reaction of metaphysis-epiphysis (CRME, 14.28%), thumb variation (0.22%), little finger variation (8.89%), the second metacarpal-phalangeal variation (0.13%) and cystic change (3.85%)."
    explanation: The specific confusing signs and their frequencies in the surveyed children.
  - reference: PMID:29459762
    reference_title: "The characteristics of positive and confusing hand X-ray signs in diagnosing Kashin-Beck Disease in children in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Images from 3,193 children were valid."
    explanation: The size of the screened population those frequencies are drawn from.

- name: Radiographic Grading of the Adult Ankle
  description: >-
    In adults the ankle is graded radiographically against the Kellgren-Lawrence
    scale used for primary osteoarthritis. The grading correlates well with
    ankle pain and only weakly with the clinical finger grading, so the two
    scales are not interchangeable.
  evidence:
  - reference: PMID:41342918
    reference_title: "Study on radiographic grading of ankle joint in adult patients with Kashin-Beck disease in Shaanxi and Gansu Province, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The study involved 160 adult KBD patients (a total of 320 ankles) as the case group and 170 matched healthy subjects (a total of 340 ankles) as the control group."
    explanation: The case-control design behind the ankle grading scheme.
  - reference: PMID:41342918
    reference_title: "Study on radiographic grading of ankle joint in adult patients with Kashin-Beck disease in Shaanxi and Gansu Province, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The X-ray grading of adult KBD ankles was conducted using the Kellgren-Lawrence grading as a reference."
    explanation: >-
      The grading standard, and incidentally the reason the adult disease is
      mistaken for primary osteoarthritis outside endemic areas.
  notes: >-
    The same paper reports that ankle radiographic grade correlates only weakly
    with the clinical grading of the fingers, and that ankle pain and finger
    grading are essentially uncorrelated. That is recorded here rather than in
    the description because it qualifies the method rather than describing it.

- name: National Diagnostic Standard WS/T 207-2010
  description: >-
    China publishes a national diagnostic standard for the disease, and
    contemporary field studies recruit against it rather than against
    study-specific criteria.
  evidence:
  - reference: PMID:39770964
    reference_title: "Kashin-Beck Disease: A Risk Factor for Sarcopenia and Its Interaction with Selenium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with KBD were enrolled in the KBD group based on a diagnosis of national criteria WS/T 207-2010."
    explanation: >-
      Names the standard and shows it in use as the recruitment criterion.
  notes: >-
    The standard's own content is not curated here - the text of WS/T 207-2010
    was not obtained, and this record cites only the fact of its use. The
    clinical grading it defines is referred to as degrees I to III in the
    burden and quality-of-life literature quoted elsewhere in this entry.

differential_diagnoses:
- name: Primary Osteoarthritis
  description: >-
    In an adult presenting outside an endemic area, the joint findings are hard
    to separate from primary osteoarthritis - the same radiographic scale
    grades both. The discriminators are the childhood onset, the symmetry, the
    short stature and brachydactyly, and the endemic-area residence history.
  evidence:
  - reference: PMID:41342918
    reference_title: "Study on radiographic grading of ankle joint in adult patients with Kashin-Beck disease in Shaanxi and Gansu Province, China."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The X-ray grading of adult KBD ankles was conducted using the Kellgren-Lawrence grading as a reference."
    explanation: >-
      Graded INDIRECT: that the standard osteoarthritis scale applies is the
      basis for the confusion, but the sentence does not itself compare the two
      diagnoses.
  - reference: PMID:42000119
    reference_title: "A self-perpetuating cycle of Type H vessel proliferation and T-2 induced inflammation drives KBD pathogenesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Kashin-Beck disease (KBD) primarily impairs the epiphyseal plate in children and adolescents, resulting in enlarged bone ends and short stature."
    explanation: >-
      The discriminating half: a growth-plate disease of childhood, which
      primary osteoarthritis is not.

- name: Normal Metaphyseal-Epiphyseal Variants on Hand Radiography
  description: >-
    The practical differential in children is not another disease but normal
    variation. Closure reaction of the metaphysis-epiphysis, little-finger and
    thumb variation, and cystic change are all read as positive for the disease
    in population screening, and the commonest of them occurs in one child in
    seven.
  evidence:
  - reference: PMID:29459762
    reference_title: "The characteristics of positive and confusing hand X-ray signs in diagnosing Kashin-Beck Disease in children in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The confusing X-ray signs included closure reaction of metaphysis-epiphysis (CRME, 14.28%), thumb variation (0.22%), little finger variation (8.89%), the second metacarpal-phalangeal variation (0.13%) and cystic change (3.85%)."
    explanation: The confusing signs and their frequencies, from a survey of 3,193 children.
  - reference: PMID:29459762
    reference_title: "The characteristics of positive and confusing hand X-ray signs in diagnosing Kashin-Beck Disease in children in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, there is high rate of misdiagnosis because of confusing X-ray signs."
    explanation: Why they matter - they are the stated cause of the high misdiagnosis rate.

treatments:
- name: Grain Replacement
  description: >-
    Replacing the locally grown, mycotoxin-contaminated staple grain with grain
    from outside the endemic area. Tied with comprehensive multi-component
    programmes as the most effective primary prevention tested, at a pooled odds
    ratio of 0.15 for new incidence in healthy children.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: replacement of the contaminated staple grain supply
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  target_mechanisms:
  - target: Dietary T-2 Toxin Exposure
    description: >-
      Acts on the toxin exposure directly by removing the contaminated food
      source.
  notes: >-
    `therapeutic_modality: BEHAVIORAL` deliberately, where `Drinking Water Improvement`
    below is `OTHER`: the enum's `BEHAVIORAL` description explicitly covers dietary
    intervention, and what the household eats changes here. Replacing a village water
    supply changes nothing about what anyone does.
  evidence:
  - reference: PMID:31490368
    reference_title: "Prevention and control strategies for children Kashin-Beck disease in China: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled odds ratios (ORs) and confidence intervals (95% CIs) for primary prevention new incidence in healthy children following interventions to comprehensive measures, change of grain, salt-rich selenium, and improvements of water were 0.15 (0.02, 0.95), 0.15 (0.03, 0.70), 0.19 (0.09, 0.38), and 0.20 (0.09, 0.42), respectively."
    explanation: >-
      The pooled effect estimates for all four interventions in one sentence -
      grain change at OR 0.15 for new incidence.
  - reference: PMID:31490368
    reference_title: "Prevention and control strategies for children Kashin-Beck disease in China: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Comprehensive measures and change of grain were the most effective measures in preventing new case, whereas improvement of water and salt-rich selenium resulted in clinical improvements in children KBD."
    explanation: >-
      The meta-analysis' own ranking, and the useful distinction it draws:
      grain change prevents new cases, while water and selenium improve
      existing ones.

- name: Selenium Supplementation
  description: >-
    Selenium-enriched salt and other selenium supplementation. The evidence
    pulls in two directions and both halves are curated here: two meta-analyses
    find it prevents new cases and improves radiographic structure in children,
    while the one randomised trial done in Tibet found it did nothing for
    established disease, growth or thyroid function once iodine deficiency was
    corrected. That last result is a real constraint on reading selenium
    deficiency as the whole story.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: selenium supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: selenium
      term:
        id: CHEBI:27568
        label: selenium atom
  target_mechanisms:
  - target: Selenoenzyme Antioxidant Capacity Deficit
    description: >-
      Restoring selenium restores the substrate for selenoprotein synthesis,
      which is the node this treatment targets.
  evidence:
  - reference: PMID:31490368
    reference_title: "Prevention and control strategies for children Kashin-Beck disease in China: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled odds ratios (ORs) and confidence intervals (95% CIs) for primary prevention new incidence in healthy children following interventions to comprehensive measures, change of grain, salt-rich selenium, and improvements of water were 0.15 (0.02, 0.95), 0.15 (0.03, 0.70), 0.19 (0.09, 0.38), and 0.20 (0.09, 0.42), respectively."
    explanation: The primary-prevention estimate for selenium-rich salt, OR 0.19.
  - reference: PMID:18693119
    reference_title: "Selenium for preventing Kashin-Beck osteoarthropathy in children: a meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled Peto-OR and NNT favoring selenium supplement was 0.13 (95% CI: 0.04-0.47) and 21 in RCTs, and 0.16 (95% CI: 0.09-0.30) and 26 in non-RCTs."
    explanation: >-
      An independent meta-analysis of the preventive effect, with a number
      needed to treat of 21 in the randomised trials.
  - reference: PMID:31376086
    reference_title: "The effectiveness of treatments for Kashin-Beck disease: a systematic review and network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In children or adolescents, selenium (risk ratio 1.88, 95% confidence interval (CI) 1.51-2.33), vitamin C (2.03, 1.40-2.95) and aspirin (2.14, 1.12-4.08) were effective for radiographic structure improvement."
    explanation: >-
      The network meta-analysis result for radiographic structure improvement in
      children, alongside vitamin C and aspirin.
  - reference: PMID:29511006
    reference_title: "Effects of five types of selenium supplementation for treatment of Kashin-Beck disease in children: a systematic review and network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NMAs showed that all five kinds of selenium supplementation had higher metaphysis X-ray improvement which were superior to placebo."
    explanation: >-
      All five formulations beat placebo on metaphyseal X-ray improvement; the
      same review is explicit that the evidence quality is too low to rank them.
  - reference: PMID:12816783
    reference_title: "Selenium and iodine supplementation of rural Tibetan children affected by Kashin-Beck osteoarthropathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "However, selenium supplementation had no effect on established Kashin-Beck disease, growth, or thyroid function once iodine deficiency was corrected."
    explanation: >-
      The negative randomised result in established disease, once iodine was
      replaced. Curated as REFUTE against the treatment claim rather than
      omitted, because it is the only individual randomised trial curated here
      - the other treatment references are meta-analyses.

- name: Drinking Water Improvement
  description: >-
    Replacing shallow-well water with a cleaner supply. It works - and it is the
    intervention the food-borne hypotheses do not predict, which is why the
    water-organic-poisoning hypothesis is curated as ALTERNATIVE rather than
    retired.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: improvement of the drinking water supply
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  target_mechanisms:
  - target: Fulvic Acid Free-Radical Generation in Cartilage
    description: >-
      Curated against the fulvic-acid node, which is the mechanism the
      intervention is supposed to interrupt. The link is hypothesised rather
      than demonstrated: replacing a water supply changes more than its organic
      content.
  evidence:
  - reference: PMID:31490368
    reference_title: "Prevention and control strategies for children Kashin-Beck disease in China: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled odds ratios (ORs) and confidence intervals (95% CIs) for primary prevention new incidence in healthy children following interventions to comprehensive measures, change of grain, salt-rich selenium, and improvements of water were 0.15 (0.02, 0.95), 0.15 (0.03, 0.70), 0.19 (0.09, 0.38), and 0.20 (0.09, 0.42), respectively."
    explanation: The primary-prevention estimate for water improvement, OR 0.20.
  - reference: PMID:31490368
    reference_title: "Prevention and control strategies for children Kashin-Beck disease in China: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Comprehensive measures and change of grain were the most effective measures in preventing new case, whereas improvement of water and salt-rich selenium resulted in clinical improvements in children KBD."
    explanation: Places water improvement among the measures that improve existing disease.
  notes: >-
    `therapeutic_modality` is OTHER rather than BEHAVIORAL. Replacing a village
    water supply is public-works engineering; nothing about the patient's
    behaviour changes.

- name: Iodine Replacement
  description: >-
    Iodised oil in the Tibetan endemic area. The one intervention in this entry
    that produced a measured growth response: children who received iodine
    recovered height-for-age, and unsupplemented controls did not.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: iodine supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: iodine
      term:
        id: CHEBI:24859
        label: iodine atom
  target_mechanisms:
  - target: Iodine Deficiency and Hypothyroidism
    description: Corrects the deficiency this node describes.
  evidence:
  - reference: PMID:12816783
    reference_title: "Selenium and iodine supplementation of rural Tibetan children affected by Kashin-Beck osteoarthropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Height-for-age z scores increased significantly in the subjects who received placebo and iodine or selenium and iodine. In contrast, unsupplemented control subjects did not recover from growth retardation."
    explanation: >-
      The growth response, and its control arm. Note the trial was not designed
      to test iodine against no iodine - every supplemented arm received it -
      so the comparison is with unsupplemented controls.
  - reference: PMID:9770558
    reference_title: "Kashin-Beck osteoarthropathy in rural Tibet in relation to selenium and iodine status."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In areas where severe selenium deficiency is endemic, iodine deficiency is a risk factor for Kashin-Beck disease."
    explanation: >-
      Graded INDIRECT: the observational study establishes the risk factor this
      treatment addresses, not the treatment's effect.

- name: Chondroitin and Glucosamine
  description: >-
    The best-performing symptomatic treatment for adults in the network
    meta-analysis of KBD treatments, on a standardised mean difference of 1.46
    for pain against placebo. An earlier draft of this entry recorded no adult
    treatment at all, which was wrong.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: chondroitin sulfate
      term:
        id: CHEBI:37397
        label: chondroitin sulfate
    - preferred_term: glucosamine
      term:
        id: CHEBI:5417
        label: glucosamine
  target_mechanisms:
  - target: Secondary Degenerative Arthropathy
    treatment_effect: MODULATES
    description: >-
      Symptomatic: it treats the adult arthropathy without acting on any
      upstream node in this graph.
  evidence:
  - reference: PMID:31376086
    reference_title: "The effectiveness of treatments for Kashin-Beck disease: a systematic review and network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In adults, chondroitin plus glucosamine was the best for pain (standardised mean difference 1.46, 95% CI 1.07-1.85), followed by intra-articular injection of hyaluronic acid (IAH) (1.09, 0.70-1.48), chondroitin (0.84, 0.47-1.21), diclofenac (0.63, 1.18-1.08), naproxen (0.55, 0.12-0.98), meloxicam (0.52, 0.03-1.01) and glucosamine (0.40, 0.13-0.67) compared to placebo"
    explanation: The ranked effect estimates, with this combination at the top.
  - reference: PMID:31376086
    reference_title: "The effectiveness of treatments for Kashin-Beck disease: a systematic review and network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chondroitin, glucosamine, IAH and nonsteroid anti-inflammatory drugs are effective for symptom improvements of KBD in adults."
    explanation: The review's own conclusion for adult symptomatic treatment.
  notes: >-
    The same review is explicit that "the strength of most evidence was limited
    by the small number of trials with low to moderate quality", and this record
    should be read with that caveat.

- name: Intra-Articular Hyaluronic Acid
  description: >-
    Ranked second for adult pain in the network meta-analysis, at a standardised
    mean difference of 1.09 against placebo.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: intra-articular hyaluronic acid injection
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hyaluronic acid
      term:
        id: CHEBI:16336
        label: hyaluronic acid
  target_mechanisms:
  - target: Secondary Degenerative Arthropathy
    treatment_effect: MODULATES
    description: Symptomatic treatment of the adult joint, delivered into the joint itself.
  evidence:
  - reference: PMID:31376086
    reference_title: "The effectiveness of treatments for Kashin-Beck disease: a systematic review and network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In adults, chondroitin plus glucosamine was the best for pain (standardised mean difference 1.46, 95% CI 1.07-1.85), followed by intra-articular injection of hyaluronic acid (IAH) (1.09, 0.70-1.48), chondroitin (0.84, 0.47-1.21), diclofenac (0.63, 1.18-1.08), naproxen (0.55, 0.12-0.98), meloxicam (0.52, 0.03-1.01) and glucosamine (0.40, 0.13-0.67) compared to placebo"
    explanation: The ranked effect estimates, with intra-articular hyaluronic acid second.

- name: Nonsteroidal Anti-Inflammatory Drugs
  description: >-
    Diclofenac, naproxen and meloxicam all beat placebo for adult pain in the
    network meta-analysis, with smaller effects than the nutraceuticals above.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nonsteroidal anti-inflammatory drug
      term:
        id: NCIT:C257
        label: Nonsteroidal Antiinflammatory Drug
    - preferred_term: diclofenac
      term:
        id: CHEBI:47381
        label: diclofenac
    - preferred_term: naproxen
      term:
        id: CHEBI:7476
        label: naproxen
    - preferred_term: meloxicam
      term:
        id: CHEBI:6741
        label: meloxicam
  target_mechanisms:
  - target: Secondary Degenerative Arthropathy
    treatment_effect: MODULATES
    description: Symptomatic analgesia for the adult arthropathy.
  evidence:
  - reference: PMID:31376086
    reference_title: "The effectiveness of treatments for Kashin-Beck disease: a systematic review and network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In adults, chondroitin plus glucosamine was the best for pain (standardised mean difference 1.46, 95% CI 1.07-1.85), followed by intra-articular injection of hyaluronic acid (IAH) (1.09, 0.70-1.48), chondroitin (0.84, 0.47-1.21), diclofenac (0.63, 1.18-1.08), naproxen (0.55, 0.12-0.98), meloxicam (0.52, 0.03-1.01) and glucosamine (0.40, 0.13-0.67) compared to placebo"
    explanation: The three individual agents and their effect estimates against placebo.
  - reference: PMID:31376086
    reference_title: "The effectiveness of treatments for Kashin-Beck disease: a systematic review and network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chondroitin, glucosamine, IAH and nonsteroid anti-inflammatory drugs are effective for symptom improvements of KBD in adults."
    explanation: The review's conclusion grouping them with the nutraceuticals as effective for adult symptoms.

- name: Vitamin C and Aspirin for Radiographic Structure in Children
  description: >-
    Both improved radiographic structure in children in the network
    meta-analysis, and the same review says the evidence for both is not
    established. Curated with that contradiction visible rather than resolved.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vitamin C
      term:
        id: CHEBI:22652
        label: ascorbic acid
    - preferred_term: aspirin
      term:
        id: CHEBI:15365
        label: acetylsalicylic acid
  target_mechanisms:
  - target: Endochondral Ossification Failure at the Growth Plate
    treatment_effect: MODULATES
    description: >-
      Radiographic structure improvement is a readout of the growth-plate
      lesion, which is the node this points at. No mechanism is proposed for
      either agent here.
  evidence:
  - reference: PMID:31376086
    reference_title: "The effectiveness of treatments for Kashin-Beck disease: a systematic review and network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In children or adolescents, selenium (risk ratio 1.88, 95% confidence interval (CI) 1.51-2.33), vitamin C (2.03, 1.40-2.95) and aspirin (2.14, 1.12-4.08) were effective for radiographic structure improvement."
    explanation: The effect estimates for both agents on radiographic structure in children.
  - reference: PMID:31376086
    reference_title: "The effectiveness of treatments for Kashin-Beck disease: a systematic review and network meta-analysis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Evidence of surgical and complementary treatments for symptoms and aspirin and vitamin C for structure has yet to be established."
    explanation: >-
      The same review's key-points list says the efficacy of aspirin and vitamin
      C has not been established. Graded REFUTE against this record's own claim
      and curated alongside the positive estimate, because a reader who saw only
      one of the two sentences would be misled.

- name: Arthrodesis and Reconstructive Surgery of the Damaged Joint
  description: >-
    Surgical salvage of an end-stage joint. The curated case is a conservative
    tibiotalocalcaneal fusion for talar avascular necrosis with ankle and subtalar
    arthritis in a 50-year-old patient, achieving bony union and a plantigrade foot
    at four months. Recorded because a disease whose adult burden is fixed joint
    deformity has a surgical arm, and this entry previously had none.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: tibiotalocalcaneal arthrodesis
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_mechanisms:
  - target: Secondary Degenerative Arthropathy
    treatment_effect: BYPASSES
    description: >-
      Recorded BYPASSES rather than INHIBITS: fusing the joint removes the painful
      articulation instead of acting on the cartilage degeneration that destroyed it.
  evidence:
  - reference: PMID:31335683
    reference_title: "Conservative tibiotalocalcaneal fusion for partial talar avascular necrosis in conjunction with ankle and subtalar joint osteoarthritis in Kashin-Beck disease: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A conservative tibiotalocalcaneal fusion attempting to preserve as much viable talar body as possible was performed using a humeral locking plate and 2 cannulated compression screws."
    explanation: The procedure this record names, as performed.
  - reference: PMID:31335683
    reference_title: "Conservative tibiotalocalcaneal fusion for partial talar avascular necrosis in conjunction with ankle and subtalar joint osteoarthritis in Kashin-Beck disease: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone union proved by CT scan and a good alignment of the left limb were achieved at 4-month follow-up postoperatively."
    explanation: The reported outcome, at four months.
  - reference: PMID:31376086
    reference_title: "The effectiveness of treatments for Kashin-Beck disease: a systematic review and network meta-analysis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Evidence of surgical and complementary treatments for symptoms and aspirin and vitamin C for structure has yet to be established."
    explanation: >-
      Graded REFUTE against the strength of this record, not against its existence.
      The network meta-analysis of 44 randomised trials says the efficacy of surgical
      treatment for this disease has not been established, so what is curated above is
      a single case report of a technique in use, not evidence that it works.
  notes: >-
    This is one patient. The evidence base for surgery in this disease is a case
    literature, which is exactly what the network meta-analysis says, and both are
    recorded here rather than only the encouraging half. The case is also unusual on
    its own terms - its authors note talar avascular necrosis is rarely reported in
    this disease - so it should not be read as the typical surgical indication.

- name: Conservative Orthotic Management and Activity Restriction
  description: >-
    Non-operative management of the painful end-stage joint with a rigid orthosis and
    reduced loading. Curated with the result it produced in the one case recorded
    here, which was failure - it is the step that preceded surgery rather than an
    alternative to it.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: rigid orthosis and activity restriction
    term:
      id: NCIT:C15315
      label: Rehabilitation
  target_mechanisms:
  - target: Secondary Degenerative Arthropathy
    treatment_effect: MODULATES
    description: >-
      Aimed at the pain and loading of the degenerate joint; no mechanism upstream of
      it is addressed.
  evidence:
  - reference: PMID:31335683
    reference_title: "Conservative tibiotalocalcaneal fusion for partial talar avascular necrosis in conjunction with ankle and subtalar joint osteoarthritis in Kashin-Beck disease: A case report."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Conservative treatment with rigid orthosis and activity restriction could not help reduce the pain in the left foot."
    explanation: >-
      Graded REFUTE: in the one case curated here the conservative approach did not
      relieve the pain, which is why the record exists at all. A single case cannot
      establish that orthotic management is generally ineffective, and this record does
      not claim it does.
  - reference: PMID:31335683
    reference_title: "Conservative tibiotalocalcaneal fusion for partial talar avascular necrosis in conjunction with ankle and subtalar joint osteoarthritis in Kashin-Beck disease: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 50-year-old woman presented with severe pain and limited range of motion in her left ankle and subtalar joint while walking for 2 years."
    explanation: The presentation the conservative measures were applied to.
  notes: >-
    `therapeutic_modality: DEVICE` for the orthosis, bound to the closest NCIT clinical
    *action* term (`NCIT:C15315` Rehabilitation) rather than to a device term, per the
    `CLAUDE.md` rule that `TreatmentTerm` is rooted at Clinical Intervention or
    Procedure and cannot take an equipment term. No suitable NCIT orthosis-device term
    was found to attach as a `qualifiers` value.

prevalence:
- population: China, national surveillance
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 180.0
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    The 2015 national figure of 0.18%, the end point of a twenty-five-year
    decline from 22.1% in 1990. 0.18% is 180 per 100,000, which is the
    ABOVE_1_IN_1000 band. The source calls this an incidence, and it is recorded
    as one: it is a detection rate among the at-risk population under
    surveillance, so `rate_denominator` is POPULATION_PER_YEAR rather than
    person-years. Any single year is a snapshot of a disease being actively
    eliminated.
  evidence:
  - reference: PMID:31548049
    reference_title: "Endemic Kashin-Beck disease: A food-sourced osteoarthropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "National incidences were 22.1% in 1990, 16.0% in 1995, 12.3% in 2000, 5.5% in 2005, 0.38% in 2010, and 0.18 in 2015, respectively."
    explanation: The full national series, which is more informative than any one year of it.

- population: Endemic areas of China, 2016
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 2548.0
  rate_denominator: POPULATION
  notes: >-
    574,925 prevalent patients among the 22,567,600 inhabitants of endemic
    areas, which is 2,548 per 100,000 or about 2.5%. The denominator is the
    endemic-area population, not the national one. This is the residual burden
    and it is the point: incidence has collapsed while the people already
    damaged remain.
  evidence:
  - reference: PMID:31548049
    reference_title: "Endemic Kashin-Beck disease: A food-sourced osteoarthropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although new patients were annually decreased, it still affected 22,567,600 inhabitants and there were 574,925 patients in 2016."
    explanation: The residual prevalent burden against the at-risk denominator.

clinical_burden:
  burden_level: HIGH
  rationale: >-
    The skeletal deformity is permanent and acquired in childhood, and the
    adult treatment literature is symptomatic throughout - nothing curated here
    modifies the underlying lesion. Measured quality of life is lower than in osteoarthritis on every domain but
    economics; depression is present in half of patients; and the national
    economic burden is quantified. The burden is high on functional impact and
    duration rather than on mortality.
  evidence:
  - reference: PMID:37143055
    reference_title: "Health-related quality of life in patients with Kashin-Beck disease is lower than in those with osteoarthritis: a cross-sectional study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The QOL of KBD patients was significantly lower than that of OA patients and healthy people."
    explanation: The comparison this assessment rests on - worse than osteoarthritis, in the same region.
  - reference: PMID:37143055
    reference_title: "Health-related quality of life in patients with Kashin-Beck disease is lower than in those with osteoarthritis: a cross-sectional study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The average scores for physical functions, activity limitations, support of society, mental health and general health were significantly lower in KBD patients than that in OA patients and healthy people except for economics."
    explanation: The domain-by-domain result, including the one domain that did not differ.
  - reference: PMID:40963707
    reference_title: "Prevalence and Risk Factors of Depression in Patients With Endemic Osteoarthritis Kashin-Beck Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Depression was present in 53.2% of patients in our KBD samples."
    explanation: The mental-health component of the burden.
  - reference: PMID:38250701
    reference_title: "Disease and Economic Burden of Kashin-Beck Disease - China, 2021‎."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most substantial reduction in healthy life expectancy was observed among patients with degree II severity and those aged 60 years and older, resulting in a total indirect economic burden of 112.74 million Chinese Yuan (CNY)."
    explanation: >-
      The national economic burden and the demographic where healthy life
      expectancy is lost fastest.
  - reference: PMID:31376086
    reference_title: "The effectiveness of treatments for Kashin-Beck disease: a systematic review and network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chondroitin, glucosamine, IAH and nonsteroid anti-inflammatory drugs are effective for symptom improvements of KBD in adults."
    explanation: >-
      The management burden half of the assessment: the treatments with
      established adult efficacy are symptomatic ones.

biochemical:
- name: Serum selenium
  presence: Decreased
  biomarker_term:
    preferred_term: serum selenium concentration
    term:
      id: NCIT:C825
      label: Selenium
  notes: >-
    The marker the biogeochemical hypothesis is named for, and the one whose
    association does not survive adjustment. Both facts are curated here.
  readouts:
  - target: Chronic Dietary Selenium Deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Low serum selenium reports the dietary deficiency directly. It does not
      discriminate affected from unaffected residents of the same endemic area.
    evidence:
    - reference: PMID:9770558
      reference_title: "Kashin-Beck osteoarthropathy in rural Tibet in relation to selenium and iodine status."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Severe selenium deficiency was documented in all villages; 38 percent of subjects had serum concentrations of less than 5 ng per milliliter (64 nmol per liter; normal, 60 to 105 ng per milliliter [762 to 1334 nmol per liter])."
      explanation: >-
        The deficiency measured directly, with the reference interval it is measured
        against - 38% of children below 5 ng/mL against a normal 60-105 ng/mL.
    - reference: PMID:9770558
      reference_title: "Kashin-Beck osteoarthropathy in rural Tibet in relation to selenium and iodine status."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "When age and sex were controlled for in a multivariate analysis, low urinary iodine, high serum thyrotropin, and low serum thyroxine-binding globulin values were associated with an increased risk of Kashin-Beck disease, but a low serum selenium concentration was not."
      explanation: >-
        Graded REFUTE against this marker as a diagnostic readout for the disease
        rather than for the deficiency: in multivariate analysis a low serum selenium
        was *not* associated with the disease, while the iodine and thyroid markers
        were. This is the load-bearing negative behind curating an iodine arm at all.
  evidence:
  - reference: PMID:9770558
    reference_title: "Kashin-Beck osteoarthropathy in rural Tibet in relation to selenium and iodine status."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe selenium deficiency was documented in all villages; 38 percent of subjects had serum concentrations of less than 5 ng per milliliter (64 nmol per liter; normal, 60 to 105 ng per milliliter [762 to 1334 nmol per liter])."
    explanation: The measurement, its threshold, and the reference range.

- name: Hair selenium
  presence: Decreased
  biomarker_term:
    preferred_term: hair selenium concentration
    term:
      id: NCIT:C825
      label: Selenium
  notes: >-
    Recorded separately from serum selenium because it is a different specimen with a
    different time constant - hair integrates months of intake - and because it is the
    marker current Chinese surveillance actually uses for population monitoring.
  readouts:
  - target: Chronic Dietary Selenium Deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: MONITORING
    interpretation: >-
      Used to monitor whether the exposure is returning in areas where the disease was
      controlled. Note it separated endemic from non-endemic villages in only one of
      six provinces surveyed.
    evidence:
    - reference: PMID:41272335
      reference_title: "Investigation of Selenium and T-2 Toxin Exposure Levels in the Internal and External Environments of Key Areas of Kashin Beck Disease in China."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "To dynamically assess the selenium exposure levels in humans (using children’s hair selenium as a biomarker) and the selenium status in the external environment (soil selenium and grain selenium) in historical severe endemic areas and adjacent non-endemic areas in China"
      explanation: >-
        States the surveillance use this readout records - children's hair selenium as
        the human exposure biomarker.
    - reference: PMID:41272335
      reference_title: "Investigation of Selenium and T-2 Toxin Exposure Levels in the Internal and External Environments of Key Areas of Kashin Beck Disease in China."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "The overall selenium status in children was at a moderate level; however, hair selenium levels in endemic villages of Sichuan were significantly lower than those in non-endemic villages."
      explanation: >-
        Graded INDIRECT and curated for what it complicates: hair selenium was lower in
        endemic than non-endemic villages in Sichuan alone, so it tracks the exposure
        without cleanly marking out where the disease occurs.
  evidence:
  - reference: PMID:41272335
    reference_title: "Investigation of Selenium and T-2 Toxin Exposure Levels in the Internal and External Environments of Key Areas of Kashin Beck Disease in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Particularly in Tibet and Sichuan, grain selenium levels remain critically low"
    explanation: >-
      The dietary source the hair measurement integrates - grain selenium still
      critically low in Tibet and Sichuan.

- name: Urinary iodine
  presence: Decreased
  biomarker_term:
    preferred_term: urinary iodine concentration
    term:
      id: NCIT:C594
      label: Iodine
  notes: >-
    The one biochemical marker in this entry that survived multivariate adjustment
    against the disease. Curated because that result, not the selenium result, is what
    the iodine arm of the etiology rests on.
  readouts:
  - target: Iodine Deficiency and Hypothyroidism
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Low urinary iodine reports the deficiency and, unlike serum selenium, remained
      associated with the disease after adjustment for age and sex.
    evidence:
    - reference: PMID:9770558
      reference_title: "Kashin-Beck osteoarthropathy in rural Tibet in relation to selenium and iodine status."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "When age and sex were controlled for in a multivariate analysis, low urinary iodine, high serum thyrotropin, and low serum thyroxine-binding globulin values were associated with an increased risk of Kashin-Beck disease, but a low serum selenium concentration was not."
      explanation: The multivariate result this readout rests on.
    - reference: PMID:9770558
      reference_title: "Kashin-Beck osteoarthropathy in rural Tibet in relation to selenium and iodine status."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "hypothyroidism was more frequent (23 percent vs. 4 percent, P=0.01)."
      explanation: >-
        The clinical consequence measured alongside it - hypothyroidism nearly six
        times as frequent in affected children as in controls.
  evidence:
  - reference: PMID:9770558
    reference_title: "Kashin-Beck osteoarthropathy in rural Tibet in relation to selenium and iodine status."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 557 subjects in whom urinary iodine was measured, 66 percent had a urinary iodine concentration of less than 2 microg per deciliter (157 nmol per liter; normal, 5 to 25 microg per deciliter [394 to 1968 nmol per liter])."
    explanation: >-
      The population distribution and the reference interval - two thirds of children
      below 2 microg/dL against a normal 5-25.

- name: Serum thyrotropin
  presence: Increased
  biomarker_term:
    preferred_term: serum thyroid-stimulating hormone
    term:
      id: NCIT:C2280
      label: Thyroid-Stimulating Hormone
  notes: >-
    Raised thyrotropin is the functional consequence of the iodine deficiency above,
    and is curated as its own marker because it, and not the iodine level alone, is
    what the multivariate model retained.
  readouts:
  - target: Iodine Deficiency and Hypothyroidism
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      High serum thyrotropin reports the hypothyroid state this node describes and was
      independently associated with the disease.
    evidence:
    - reference: PMID:9770558
      reference_title: "Kashin-Beck osteoarthropathy in rural Tibet in relation to selenium and iodine status."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "When age and sex were controlled for in a multivariate analysis, low urinary iodine, high serum thyrotropin, and low serum thyroxine-binding globulin values were associated with an increased risk of Kashin-Beck disease, but a low serum selenium concentration was not."
      explanation: Names high serum thyrotropin among the independently associated markers.
  evidence:
  - reference: PMID:9770558
    reference_title: "Kashin-Beck osteoarthropathy in rural Tibet in relation to selenium and iodine status."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "hypothyroidism was more frequent (23 percent vs. 4 percent, P=0.01)."
    explanation: >-
      Graded INDIRECT: the sentence reports the hypothyroidism rate rather than the
      thyrotropin value, and a raised thyrotropin is what defines hypothyroidism here.

- name: Serum thyroxine-binding globulin
  presence: Decreased
  biomarker_term:
    preferred_term: serum thyroxine-binding globulin
    term:
      id: NCIT:C106005
      label: Thyroxine-Binding Globulin
  notes: >-
    The third thyroid marker retained by the multivariate model. Curated for
    completeness of that result rather than because a mechanism is proposed for it -
    nothing in this entry explains why a low binding globulin should accompany the
    disease.
  readouts:
  - target: Iodine Deficiency and Hypothyroidism
    relationship: CORRELATES_WITH
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Recorded CORRELATES_WITH rather than READOUT_OF: it was independently associated
      with the disease in the same model, but this entry curates no account of what it
      is measuring here.
    evidence:
    - reference: PMID:9770558
      reference_title: "Kashin-Beck osteoarthropathy in rural Tibet in relation to selenium and iodine status."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "When age and sex were controlled for in a multivariate analysis, low urinary iodine, high serum thyrotropin, and low serum thyroxine-binding globulin values were associated with an increased risk of Kashin-Beck disease, but a low serum selenium concentration was not."
      explanation: Names low serum thyroxine-binding globulin among the independently associated markers.
  evidence:
  - reference: PMID:9770558
    reference_title: "Kashin-Beck osteoarthropathy in rural Tibet in relation to selenium and iodine status."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When age and sex were controlled for in a multivariate analysis, low urinary iodine, high serum thyrotropin, and low serum thyroxine-binding globulin values were associated with an increased risk of Kashin-Beck disease, but a low serum selenium concentration was not."
    explanation: The multivariate result, which is the only evidence this entry has for this marker.

epidemiology:
- name: Early-Onset Endemic Distribution with Family Aggregation
  description: >-
    The disease starts in childhood, usually between three and twelve years of
    age, affects both sexes equally, clusters in agricultural areas and within
    families, and fluctuates year to year. The family clustering is a
    gene-environment ambiguity rather than a genetic finding: families share
    genes and also share grain stores and wells.
  evidence:
  - reference: PMID:31548049
    reference_title: "Endemic Kashin-Beck disease: A food-sourced osteoarthropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epidemiology of the KBD was characterized by early-onset, gender equality, agricultural area, regional discrepancy, family aggregation, annual fluctuation, etc."
    explanation: The epidemiological signature this record names, in the source's own list.
  - reference: PMID:40963707
    reference_title: "Prevalence and Risk Factors of Depression in Patients With Endemic Osteoarthritis Kashin-Beck Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Kashin-Beck disease (KBD) is an endemic osteoarthropathy, which occurs in children aged 3-12, with similarity to osteoarthritis (OA)."
    explanation: >-
      The onset window. Graded OTHER: a background sentence rather than the
      study's own result.

progression:
- phase: Childhood Growth-Plate Phase
  notes: >-
    While the growth plates are open, the disease produces its defining
    lesions - brachydactyly, enlarged joints, short stature. This is the phase
    intervention can prevent, and the phase in which selenium and water measures
    show clinical improvement.
  evidence:
  - reference: PMID:31490368
    reference_title: "Prevention and control strategies for children Kashin-Beck disease in China: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Comprehensive measures and change of grain were the most effective measures in preventing new case, whereas improvement of water and salt-rich selenium resulted in clinical improvements in children KBD."
    explanation: >-
      That the intervention literature is entirely about children is the
      evidence for treating this as the modifiable phase.
  - reference: PMID:40963707
    reference_title: "Prevalence and Risk Factors of Depression in Patients With Endemic Osteoarthritis Kashin-Beck Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Kashin-Beck disease (KBD) is an endemic osteoarthropathy, which occurs in children aged 3-12, with similarity to osteoarthritis (OA)."
    explanation: The age window this phase covers.

- phase: Adult Degenerative Phase
  notes: >-
    After growth stops the skeletal deformity is fixed and what continues is
    joint degeneration - pain, stiffness, and radiographic change graded like
    osteoarthritis. Adult management is symptomatic: chondroitin, glucosamine,
    intra-articular hyaluronic acid and NSAIDs relieve symptoms, and every adult
    treatment curated here targets the arthropathy node rather than anything
    upstream of it.
  evidence:
  - reference: PMID:41342918
    reference_title: "Study on radiographic grading of ankle joint in adult patients with Kashin-Beck disease in Shaanxi and Gansu Province, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This paper aims to establish an X-ray imaging grading for assessing ankle joints in adult Kashin-Beck disease (KBD) and investigate its correlation with clinical grading of finger and ankle pain."
    explanation: The adult phase as its own clinical problem, with its own grading need.
  - reference: PMID:31376086
    reference_title: "The effectiveness of treatments for Kashin-Beck disease: a systematic review and network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chondroitin, glucosamine, IAH and nonsteroid anti-inflammatory drugs are effective for symptom improvements of KBD in adults."
    explanation: >-
      The adult treatment literature is symptomatic throughout - this is the
      evidence for the claim in the notes, which an earlier draft asserted
      without one.

animal_models:
- name: T-2 toxin plus selenium-deficient diet rat
  species: Rat
  genotype: Wild type
  description: >-
    Sprague-Dawley rats fed a selenium-deficient diet for four weeks and then
    exposed to T-2 toxin for four more. The field's workhorse model, and the one
    that makes the compound-etiology hypothesis tractable: the deep-zone lesion
    that resembles the human disease appears only in the groups given both.
  publication: PMID:22258458
  modeled_mechanisms:
  - target: Mixed-Mode Chondrocyte Death in Deep and Middle Cartilage Zones
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Apoptosis and necroptosis co-exist in the middle zone of the model's
      cartilage, as they do in children with the disease, and the deep-zone
      chondronecrosis is described as very similar to the human lesion.
    limitations: >-
      A four-week rodent exposure is not a childhood in an endemic village, and
      the model delivers a fixed toxin dose rather than the variable, seasonal
      contamination of a real grain store. It also cannot address the
      fulvic-acid or iodine hypotheses, since neither water composition nor
      iodine status is a variable in it.
    divergences:
    - divergence_type: TEMPORAL_SCOPE
      materiality: QUALIFYING
      description: >-
        Weeks of controlled feeding stand in for years of intermittent childhood
        exposure during active growth; the model compresses the timescale the
        disease is defined on.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Drinking-water composition and iodine status are outside the model, so
        it cannot speak to two of the four hypotheses this entry curates.
    evidence:
    - reference: PMID:30680829
      reference_title: "Death of chondrocytes in Kashin-Beck disease: Apoptosis, necrosis or necroptosis?"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Apoptosis and necroptosis co-existed in the middle zone in this rat KBD model."
      explanation: >-
        The specific correspondence between model and human cartilage - the same
        two death modes in the same zone.
    - reference: PMID:22258458
      reference_title: "Histopathology of chondronecrosis development in knee articular cartilage in a rat model of Kashin-Beck disease using T-2 toxin and selenium deficiency conditions."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Chondronecrosis in deep zone of articular cartilage of knee joints was seen in both the low and high T-2 toxin plus selenium-deficient diet groups, these chondronecrotic lesions being very similar to chondronecrosis observed in human KBD."
      explanation: >-
        The primary report of the deep-zone lesion, and the dose design that
        shows both exposures are needed for it.
  - target: Endochondral Ossification Failure at the Growth Plate
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      The rat's growth-plate chondronecrosis is explicitly not similar to the
      human lesion, which is the failure this entry records rather than smooths
      over. The primary report attributes it to the rat's growth plates never
      closing.
    limitations: >-
      The rat does not close its growth plates, so the epiphyseal closure that
      defines the human childhood disease cannot occur. Any inference from this
      model to the growth-plate node is therefore unsafe, and the model's value
      is at the articular cartilage instead.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: INVALIDATING
      description: >-
        Rat epiphyseal growth plates remain open through life. The human disease
        is defined by damage to a plate that then closes early, and the model
        has no counterpart to that event.
    evidence:
    - reference: PMID:22258458
      reference_title: "Histopathology of chondronecrosis development in knee articular cartilage in a rat model of Kashin-Beck disease using T-2 toxin and selenium deficiency conditions."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "However, the chondronecrosis observed in the rat epiphyseal growth plates of animals treated with T-2 toxin alone or T-2 toxin plus selenium-deficient diets were not similar to that found in human KBD."
      explanation: >-
        The negative result stated by the model's own authors, in both the
        toxin-alone and the combined groups.
    - reference: PMID:22258458
      reference_title: "Histopathology of chondronecrosis development in knee articular cartilage in a rat model of Kashin-Beck disease using T-2 toxin and selenium deficiency conditions."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "However, those changes seen in epiphyseal growth plate differ from those seen in human KBD probably because of the absence of growth plate closure in the rat."
      explanation: The authors' explanation for the failure, which is the species divergence recorded above.
  - target: Selenoenzyme Antioxidant Capacity Deficit
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      The model reproduces the biochemical deficit directly: antioxidant enzyme
      activity and mRNA down, lipid peroxidation up, in both serum and
      cartilage.
    limitations: >-
      The measurements are of the model's own biochemistry; no matching serum or
      cartilage antioxidant panel from patients is curated in this entry, so the
      correspondence to human tissue is assumed rather than shown here.
    evidence:
    - reference: PMID:22294316
      reference_title: "Oxidant damage in Kashin-Beck disease and a rat Kashin-Beck disease model by employing T-2 toxin treatment under selenium deficient conditions."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The levels of thiobarbituric acid reactive substances (TBARS), indicative of lipid peroxidation in serum and cartilage, were significantly increased in all experimental groups compared to the normal diet group, while the levels of antioxidants, measured as total antioxidant capacity (T-AOC), catalase (CAT), superoxide dismutase (SOD), and glutathione peroxidases (GPX), in serum and cartilage were significantly lower than that in the normal diet group."
      explanation: The antioxidant and lipid-peroxidation measurements this link rests on.
  evidence:
  - reference: PMID:35304334
    reference_title: "Animal models of Kashin-Beck disease exposed to environmental risk factors: Methods and comparisons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In conclusion, the rhesus monkeys administrated endemic water and grain were susceptible animals to replicate KBD. The rats treated with T-2 toxin combined with Se/nutrition deficiency could be a suitable and widely used animal model."
    explanation: The review's assessment of this model as the suitable and widely used one.

- name: Low-nutrition diet plus T-2 toxin rat
  species: Rat
  genotype: Wild type
  description: >-
    A variant of the workhorse model in which the deficient diet is low in
    protein, iodine and selenium together rather than in selenium alone - which
    makes it the only model in this entry that includes the iodine arm.
  publication: PMID:23701828
  modeled_mechanisms:
  - target: Endochondral Ossification Failure at the Growth Plate
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Blurred, thin and irregular epiphyseal plates with chondrocyte necrosis
      and shortened tibias, which the authors read as closely matching the human
      bone changes.
    limitations: >-
      Recorded PARTIALLY_RECAPITULATES rather than RECAPITULATES because the
      companion model above found rat growth-plate chondronecrosis explicitly
      unlike the human lesion, and this study does not address that objection.
      The diet also varies three nutrients at once, so it cannot separate the
      iodine, protein and selenium contributions it bundles.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        As with the selenium-deficient model, the rat growth plate does not
        close, so the human disease's defining endpoint has no counterpart.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Three dietary deficiencies are applied together and no arm varies them
        independently, so the model cannot attribute its effect to any one.
    evidence:
    - reference: PMID:23701828
      reference_title: "An animal model of Kashin-Beck disease induced by a low-nutrition diet and exposure to T-2 toxin."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In group D, all epiphyseal plates were blurred, thin, and irregular."
      explanation: The radiographic plate finding in the combined group.
    - reference: PMID:23701828
      reference_title: "An animal model of Kashin-Beck disease induced by a low-nutrition diet and exposure to T-2 toxin."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A rat model of KBD induced by a low-nutrition diet and T-2 toxin exposure demonstrated radiographic and histopathological abnormalities of the proximal epiphyseal plate and the tibial metaphysis that are very similar to the bone changes found in patients with KBD."
      explanation: The authors' own assessment of the correspondence to patients.

- name: Rhesus monkey fed endemic water and grain
  species: Rhesus monkey
  genotype: Wild type
  description: >-
    Monkeys given the actual water and grain from endemic villages, rather than
    isolated candidate agents. Assessed as the most susceptible species for
    replicating the disease - and the design is the point: it tests the endemic
    environment as a whole instead of pre-judging which constituent matters.
  publication: PMID:35304334
  modeled_mechanisms:
  - target: Dietary T-2 Toxin Exposure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the disease using the endemic exposure itself rather than a
      reconstructed one.
    limitations: >-
      Because it delivers the whole environment, it cannot say which constituent
      is responsible - the same strength and weakness. The only source curated
      for it here is a methods review; the primary reports of the original
      monkey experiments were not obtained, so the experimental detail is not
      curated.
    divergences:
    - divergence_type: CONTESTED_ASSUMPTION
      materiality: QUALIFYING
      description: >-
        The model assumes the causative agent is present in the endemic water
        and grain. That is the hypothesis under test, so a positive result
        supports the compound etiology without discriminating among its parts.
    evidence:
    - reference: PMID:35304334
      reference_title: "Animal models of Kashin-Beck disease exposed to environmental risk factors: Methods and comparisons."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In conclusion, the rhesus monkeys administrated endemic water and grain were susceptible animals to replicate KBD. The rats treated with T-2 toxin combined with Se/nutrition deficiency could be a suitable and widely used animal model."
      explanation: The review's assessment of the rhesus monkey as the susceptible species.

discussions:
- discussion_id: kbd_etiology_unresolved
  kind: CONTROVERSY
  prompt: >-
    Which environmental factor - selenium deficiency, iodine deficiency, T-2
    toxin, a water constituent, or an obligate combination - actually causes
    Kashin-Beck disease?
  rationale: >-
    Seventy years of work has produced four standing single-factor hypotheses
    and no resolution, which is why this entry curates all of them alongside the
    compound reading rather than asserting one. Recorded as a CONTROVERSY rather
    than a knowledge gap: the positions are published and in live disagreement,
    not merely absent. Each has real support and a real problem. Selenium
    deficiency has the selenoprotein association data and the preventive trials
    - but soil selenium is as low in non-endemic villages, and a randomised
    trial found selenium useless for established disease once iodine was
    replaced. Iodine deficiency survives multivariate adjustment where selenium
    does not, and its replacement restored growth - but no cartilage-level
    mechanism connects it to the lesion. T-2 toxin has the best animal model and
    the most effective intervention - but the model needs a deficient diet
    alongside it, and the growth-plate lesion it produces is explicitly unlike
    the human one. Fulvic acid has the water-improvement result and a 1999
    free-radical mechanism, and almost nothing since. The gap matters because
    the disease is being eliminated by measures that address all of them at
    once, so the natural experiment that would separate them is closing.
  attaches_to:
  - pathophysiology#Chronic Dietary Selenium Deficiency
  - pathophysiology#Dietary T-2 Toxin Exposure
  - pathophysiology#Iodine Deficiency and Hypothyroidism
  - pathophysiology#Fulvic Acid Free-Radical Generation in Cartilage
  - mechanistic_hypotheses#compound_etiology
  evidence:
  - reference: PMID:11482536
    reference_title: "Kashin-Beck disease: from etiology to prevention or from prevention to etiology?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although none of the competing theories prevails when they are compared using a predefined and standard set of causality criteria (temporality, strength of the association, biological gradient, experimental evidence, biological plausibility, coherence, specificity and analogy), none should be discounted."
    explanation: The causality review's verdict, which is the state this discussion records.
  - reference: PMID:11482536
    reference_title: "Kashin-Beck disease: from etiology to prevention or from prevention to etiology?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Well-conducted randomised intervention should be the priority of researchers as well as public health professionals to demonstrate what works and what does not."
    explanation: >-
      And its recommendation, which is why the entry curates the preventive
      trial evidence in as much detail as the mechanistic evidence.

- discussion_id: kbd_death_mode
  kind: INTERPRETATION
  prompt: >-
    Is the chondrocyte death in Kashin-Beck disease apoptosis, necrosis,
    necroptosis, or ferroptosis?
  rationale: >-
    The answer appears to be "several, sorted by cartilage zone", which is
    unusual enough to be worth stating rather than smoothing. Caspase-3 is not
    raised in patient cartilage, so classic apoptosis is not the main event;
    RIP3 positivity puts necroptosis in the middle zone; ultrastructure shows
    frank necrosis in the deep zone; mitochondrial dysfunction with cytochrome c
    release and caspase-9 activation is measurable in cultured patient
    chondrocytes; and the ferroptosis work adds a further mode driven
    specifically by the toxin. The Smad2/Smad3 result supplies a mechanism for
    the split - the two proteins are lost together under oxidative stress and
    each loss produces a different death. This entry therefore curates one node
    for mixed-mode death plus separate ferroptosis and mitochondrial nodes,
    rather than choosing a mode.
  attaches_to:
  - pathophysiology#Mixed-Mode Chondrocyte Death in Deep and Middle Cartilage Zones
  - pathophysiology#Ferroptotic Chondrocyte Death
  - pathophysiology#Chondrocyte Mitochondrial Dysfunction
  - pathophysiology#Smad2 and Smad3 Depletion

- discussion_id: kbd_vascular_direction
  kind: INTERPRETATION
  prompt: >-
    Is the epiphyseal plate in Kashin-Beck disease under-vascularised or
    over-vascularised?
  rationale: >-
    Two curated observations point opposite ways, and this entry records both
    rather than choosing. The 2001 histology of phalanges from affected children
    found the proximal cartilage end plate unvascularised, and proposed that the
    disease develops from a failure of metaphyseal angiogenesis. The 2026 type H
    vessel work found the opposite in the rat - vessels proliferating at the
    epiphyseal plate, delivering more toxin, with the loop demonstrated
    pharmacologically in both directions. They are not necessarily in conflict:
    different species, different bones, different stages, and "vascularisation
    of the cartilage end plate" and "type H vessel density at the plate" are not
    the same measurement. But nothing curated here reconciles them, and the
    pathograph currently carries only the proliferative reading as an edge.
  attaches_to:
  - pathophysiology#Type H Vessel Proliferation at the Epiphyseal Plate
  - pathophysiology#Endochondral Ossification Failure at the Growth Plate
  evidence:
  - reference: PMID:11482529
    reference_title: "Histology of Kashin-Beck lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These observations suggest that Kashin-Beck disease could develop from an alteration of the angiogenesis of the metaphyseal cartilage resulting in degeneration with consequent joint dysplasia, which may be associated with a decrease in growth of the diaphyseal bones."
    explanation: The angiogenesis-failure reading, from human phalangeal histology.
  - reference: PMID:42000119
    reference_title: "A self-perpetuating cycle of Type H vessel proliferation and T-2 induced inflammation drives KBD pathogenesis."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Conversely, HF reduced type H vessel proliferation (MD: -3.70, 95%CI: -6.67, -0.73), decreased T-2 toxin levels and suppressed inflammation (MD: -0.17, 95%CI: -0.23, -0.11), while preserving proteoglycan content and cartilage morphology."
    explanation: >-
      Graded REFUTE against the angiogenesis-failure reading: suppressing vessel
      proliferation protected the cartilage, which is the opposite of what a
      model of insufficient vascularisation predicts.


    reference_title: "Abnormal expression of TSG-6 disturbs extracellular matrix homeostasis in chondrocytes from endemic osteoarthritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TSG-6 was upregulated in KBD chondrocytes at the mRNA level and upregulated in the superficial, middle, and deep zones of KBD cartilage."
    explanation: The expression finding in patient cartilage, zone by zone.
  - reference: PMID:36468025
    reference_title: "Abnormal expression of TSG-6 disturbs extracellular matrix homeostasis in chondrocytes from endemic osteoarthritis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Compared with the blank control group, the expression of MMPs was increased in the intervention group of HT-2 toxin, while the expression of proteoglycan and COL2A1 decreased (p < 0.05)."
    explanation: >-
      The toxin metabolite reproducing the matrix picture in chondrocyte
      culture - metalloproteinases up, collagen and proteoglycan down.
  - reference: PMID:36468025
    reference_title: "Abnormal expression of TSG-6 disturbs extracellular matrix homeostasis in chondrocytes from endemic osteoarthritis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "After TSG-6 silencing, the expression of MMP1, MMP3, MMP13, and proteoglycan was significantly decreased while COL2A1 expression was significantly increased, which was reversed after the overexpression of TSG-6 induced by TNF-α (p < 0.05)."
    explanation: >-
      The silencing and rescue experiment, which is what makes TSG-6 a driver of

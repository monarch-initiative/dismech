mechanistic_hypotheses:
- hypothesis_group_id: compound_etiology
  hypothesis_label: Compound etiology - no single sufficient cause
  status: CANONICAL
  description: >-
    The position that the disease requires a combination - most often low
    selenium plus mycotoxin exposure plus a nutritionally marginal diet - and
    that no single factor is sufficient. Curated as the CANONICAL reading
    because it is the one the reproducible animal models and the multivariate
    epidemiology both land on, and because the four single-factor hypotheses
    below are best understood as its components rather than as its rivals.
    Its weakness is the obvious one: it fits everything and predicts least.
  evidence:
  - reference: PMID:35304334
    reference_title: "Animal models of Kashin-Beck disease exposed to environmental risk factors: Methods and comparisons."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Gradually, four etiological hypotheses have been formed, including water of organic poisoning hypothesis represented by fulvic acid (FA), biogeochemical hypothesis represented by selenium (Se) deficiency, food mycotoxin poisoning hypothesis represented by T-2 toxin poisoning and compound etiology theory hypothesis."
    explanation: Names the compound hypothesis as a standing position in its own right.
  - reference: PMID:11482536
    reference_title: "Kashin-Beck disease: from etiology to prevention or from prevention to etiology?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This is an indication that a comprehensive and unifying theory is most likely to be multifactorial."
    explanation: >-
      The review's own conclusion after scoring every competing theory against
      a standard set of causality criteria.
  - reference: PMID:11482536
    reference_title: "Kashin-Beck disease: from etiology to prevention or from prevention to etiology?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although none of the competing theories prevails when they are compared using a predefined and standard set of causality criteria (temporality, strength of the association, biological gradient, experimental evidence, biological plausibility, coherence, specificity and analogy), none should be discounted."
    explanation: >-
      Why the single-factor hypotheses below are curated as ALTERNATIVE rather
      than retired: none prevails, and none is discountable.
  - reference: PMID:31548049
    reference_title: "Endemic Kashin-Beck disease: A food-sourced osteoarthropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multivariate regression analysis suggested that etiology of the KBD was food-related factors such as fungal contamination of grains, selenium deficiency, imbalance of protein intake, etc."
    explanation: >-
      The epidemiological analysis behind it - several food-related factors
      emerging together rather than one dominating.
  - reference: PMID:35304334
    reference_title: "Animal models of Kashin-Beck disease exposed to environmental risk factors: Methods and comparisons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In conclusion, the rhesus monkeys administrated endemic water and grain were susceptible animals to replicate KBD. The rats treated with T-2 toxin combined with Se/nutrition deficiency could be a suitable and widely used animal model."
    explanation: >-
      The two most successful models are both compound - endemic water plus
      endemic grain in monkeys, and T-2 plus selenium deficiency in rats.

- hypothesis_group_id: selenium_deficiency
  hypothesis_label: Biogeochemical selenium deficiency
  status: ALTERNATIVE
  description: >-
    Endemic areas sit on selenium-poor soils, and low selenium starves the
    selenoenzymes - glutathione peroxidases, thioredoxin reductases,
    selenoprotein S - that defend chondrocytes against oxidative injury.
    Curated ALTERNATIVE rather than CANONICAL because it is a component of the
    compound reading above, not a competitor to it. Its own weaknesses are
    specific: soil selenium is as low in non-endemic villages as in endemic
    ones, and a randomised trial in Tibet found selenium had no effect on
    established disease once iodine deficiency was corrected.
  evidence:
  - reference: PMID:35304334
    reference_title: "Animal models of Kashin-Beck disease exposed to environmental risk factors: Methods and comparisons."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Gradually, four etiological hypotheses have been formed, including water of organic poisoning hypothesis represented by fulvic acid (FA), biogeochemical hypothesis represented by selenium (Se) deficiency, food mycotoxin poisoning hypothesis represented by T-2 toxin poisoning and compound etiology theory hypothesis."
    explanation: Names this hypothesis and the three it competes with.
  - reference: PMID:42275919
    reference_title: "Selenoprotein S deficiency activates Wnt/β-catenin signaling causing impaired terminal chondrocyte differentiation in Kashin-Beck disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "SelS deficiency activates Wnt/β-catenin, impairing terminal differentiation and contributing to selenium-deficiency cartilage injury."
    explanation: >-
      A specific selenoprotein loss producing a specific cartilage lesion, which
      is what turns "low selenium" from a correlation into a mechanism.
  - reference: PMID:12816783
    reference_title: "Selenium and iodine supplementation of rural Tibetan children affected by Kashin-Beck osteoarthropathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "However, selenium supplementation had no effect on established Kashin-Beck disease, growth, or thyroid function once iodine deficiency was corrected."
    explanation: >-
      Graded REFUTE against the strong form of this hypothesis: in a randomised
      trial in Tibetan children, selenium did nothing for established disease,
      growth or thyroid function once iodine was replaced. It does not refute a
      preventive role, which the same paper is explicit about.

- hypothesis_group_id: t2_mycotoxin
  hypothesis_label: Food mycotoxin poisoning by Fusarium T-2 toxin
  status: ALTERNATIVE
  description: >-
    T-2 toxin, a trichothecene produced by Fusarium species growing on grain
    stored damp, is directly chondrotoxic. It is the arm with the most
    tractable experimental model and the most effective intervention - grain
    replacement. Curated ALTERNATIVE for the same reason as the selenium arm:
    the workhorse rat model needs a selenium-deficient or low-nutrition diet
    alongside the toxin, which is the compound reading rather than this one.
  evidence:
  - reference: PMID:35304334
    reference_title: "Animal models of Kashin-Beck disease exposed to environmental risk factors: Methods and comparisons."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Gradually, four etiological hypotheses have been formed, including water of organic poisoning hypothesis represented by fulvic acid (FA), biogeochemical hypothesis represented by selenium (Se) deficiency, food mycotoxin poisoning hypothesis represented by T-2 toxin poisoning and compound etiology theory hypothesis."
    explanation: Names this hypothesis alongside the others.
  - reference: PMID:42103195
    reference_title: "Deferoxamine alleviates T-2 toxin-induced articular chondrocyte ferroptosis via the Nrf2/xCT/GPX4 axis: Implications for Kashin-Beck disease pathology."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "T-2 toxin exposure induced severe articular cartilage degradation, accompanied by intracellular iron overload lipid peroxidation, oxidative stress and distinctive mitochondrial damage characteristic of ferroptosis."
    explanation: >-
      Direct chondrotoxicity of the toxin in a controlled animal experiment in
      which T-2 toxin was given without a selenium-deficient arm.

- hypothesis_group_id: iodine_deficiency
  hypothesis_label: Iodine deficiency and hypothyroidism
  status: ALTERNATIVE
  description: >-
    The Tibetan arm of the etiology, and the one this entry previously omitted.
    Endemic areas around Lhasa are iodine-deficient as well as selenium-poor,
    and low urinary iodine - not low serum selenium - is the exposure that
    survived multivariate adjustment in the Tibetan survey. Correcting iodine, not
    selenium, was what let growth-retarded children recover height. Curated
    ALTERNATIVE: the epidemiological association is strong and replicated in an
    intervention, but no cartilage-level mechanism linking thyroid status to
    the growth-plate lesion is curated here.
  evidence:
  - reference: PMID:9770558
    reference_title: "Kashin-Beck osteoarthropathy in rural Tibet in relation to selenium and iodine status."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In areas where severe selenium deficiency is endemic, iodine deficiency is a risk factor for Kashin-Beck disease."
    explanation: The study's own conclusion, and the clearest statement of this hypothesis.
  - reference: PMID:9770558
    reference_title: "Kashin-Beck osteoarthropathy in rural Tibet in relation to selenium and iodine status."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When age and sex were controlled for in a multivariate analysis, low urinary iodine, high serum thyrotropin, and low serum thyroxine-binding globulin values were associated with an increased risk of Kashin-Beck disease, but a low serum selenium concentration was not."
    explanation: >-
      The multivariate result that separates the two deficiencies: iodine and
      thyroid markers survived adjustment and serum selenium did not.
  - reference: PMID:11482536
    reference_title: "Kashin-Beck disease: from etiology to prevention or from prevention to etiology?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Four factors have been convincingly associated with the disease: selenium deficiency, iodine deficiency, grain contamination with mycotoxin-producing fungi, and water pollution with organic material and fulvic acid."
    explanation: >-
      The causality review's list of the four convincingly associated factors,
      which includes iodine deficiency alongside the three this entry already
      curated.

- hypothesis_group_id: fulvic_acid_water
  hypothesis_label: Organic drinking-water poisoning by fulvic acid
  status: ALTERNATIVE
  description: >-
    Humic and fulvic acids in shallow well water are proposed to generate free
    radicals that damage cartilage. The mechanistic work is old but real: fulvic
    acid enhances lipid peroxidation in cartilage cell culture, accumulates in
    bone and cartilage, and its toxicity falls when its hydroxy group is
    blocked. The intervention data keep it alive too - improving the water
    supply measurably reduces incidence, which a purely food-borne model does
    not predict.
  evidence:
  - reference: PMID:35304334
    reference_title: "Animal models of Kashin-Beck disease exposed to environmental risk factors: Methods and comparisons."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Gradually, four etiological hypotheses have been formed, including water of organic poisoning hypothesis represented by fulvic acid (FA), biogeochemical hypothesis represented by selenium (Se) deficiency, food mycotoxin poisoning hypothesis represented by T-2 toxin poisoning and compound etiology theory hypothesis."
    explanation: Names the water organic-poisoning hypothesis and its representative agent.
  - reference: PMID:10090708
    reference_title: "The role of humic substances in drinking water in Kashin-Beck disease in China."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We hypothesized that FA in drinking water is an etiological factor of Kashin-Beck disease and that the mechanism of action involves the oxy and hydroxy groups in FA for the generation of free radicals."
    explanation: The hypothesis as its authors stated it, with the chemistry they proposed for it.
  - reference: PMID:31490368
    reference_title: "Prevention and control strategies for children Kashin-Beck disease in China: A systematic review and meta-analysis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled odds ratios (ORs) and confidence intervals (95% CIs) for primary prevention new incidence in healthy children following interventions to comprehensive measures, change of grain, salt-rich selenium, and improvements of water were 0.15 (0.02, 0.95), 0.15 (0.03, 0.70), 0.19 (0.09, 0.38), and 0.20 (0.09, 0.42), respectively."
    explanation: >-
      Graded INDIRECT: water improvement reducing incidence is consistent with a
      waterborne agent but does not identify one, since changing the water
      supply changes more than its fulvic acid content.

pathophysiology:
- name: Chronic Dietary Selenium Deficiency
  description: >-
    A child in an endemic area eats grain grown on selenium-poor soil, and
    circulating and cartilage selenium stay low through the years the growth
    plates are open. Curated as its own node rather than bundled with the
    toxin exposure, because the two have different exposure routes, different
    interventions, and different edges out of this graph.
  biological_scale: ORGANISM
  downstream:
  - target: Selenoenzyme Antioxidant Capacity Deficit
    causal_link_type: DIRECT
    hypothesis_groups:
    - selenium_deficiency
    - compound_etiology
  - target: Selenoprotein S Loss and Wnt Derepression
    causal_link_type: DIRECT
    hypothesis_groups:
    - selenium_deficiency
  evidence:
  - reference: PMID:31548049
    reference_title: "Endemic Kashin-Beck disease: A food-sourced osteoarthropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multivariate regression analysis suggested that etiology of the KBD was food-related factors such as fungal contamination of grains, selenium deficiency, imbalance of protein intake, etc."
    explanation: The multivariate epidemiological result naming selenium deficiency among the food-related factors.
  - reference: PMID:41272335
    reference_title: "Investigation of Selenium and T-2 Toxin Exposure Levels in the Internal and External Environments of Key Areas of Kashin Beck Disease in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results showed that the average soil selenium content in both endemic and non-endemic villages across the six provinces was below 0.2 mg/kg."
    explanation: >-
      Curated because it complicates the exposure rather than confirming it:
      soil selenium was low in endemic and non-endemic villages alike.

- name: Dietary T-2 Toxin Exposure
  description: >-
    The other half of the initiating state: T-2 toxin from Fusarium growing on
    damp-stored grain, ingested over years. Separated from the selenium node
    because the experimental evidence separates them - T-2 toxin alone degrades
    articular cartilage in the rat, and the deep-zone lesion that actually
    resembles the human disease is the one that needs both.
  biological_scale: ORGANISM
  downstream:
  - target: Chondrocyte Oxidative Stress
    causal_link_type: DIRECT
    hypothesis_groups:
    - t2_mycotoxin
    - compound_etiology
  - target: Ferroptotic Chondrocyte Death
    causal_link_type: DIRECT
    hypothesis_groups:
    - t2_mycotoxin
    description: >-
      The toxin reaches ferroptosis without going through the selenium arm,
      which is why the two hypotheses can each stand alone and also combine.
  evidence:
  - reference: PMID:35304334
    reference_title: "Animal models of Kashin-Beck disease exposed to environmental risk factors: Methods and comparisons."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The main etiological mechanism for Kashin-Beck disease (KBD) is deep chondrocyte necrosis induced by environmental risk factors (ERFs)."
    explanation: >-
      States the field's summary of what initiates the disease - environmental
      risk factors producing deep chondrocyte necrosis.
  - reference: PMID:42103195
    reference_title: "Deferoxamine alleviates T-2 toxin-induced articular chondrocyte ferroptosis via the Nrf2/xCT/GPX4 axis: Implications for Kashin-Beck disease pathology."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "T-2 toxin exposure induced severe articular cartilage degradation, accompanied by intracellular iron overload lipid peroxidation, oxidative stress and distinctive mitochondrial damage characteristic of ferroptosis."
    explanation: The toxin alone degrading articular cartilage in a controlled experiment.

- name: Iodine Deficiency and Hypothyroidism
  description: >-
    In the Tibetan endemic area iodine deficiency is severe enough to produce
    goitre in nearly half of children and biochemical hypothyroidism in a
    quarter of those with the disease, and it is the exposure that survives
    multivariate adjustment where serum selenium does not. Curated as an
    initiating node because the interventional evidence points the same way -
    growth-retarded children recovered height when iodine was replaced, whether
    or not they also received selenium.
  biological_scale: ORGANISM
  downstream:
  - target: Symmetric Growth Arrest and Joint Deformity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - iodine_deficiency
    description: >-
      Recorded INDIRECT_UNKNOWN_INTERMEDIATES on purpose. Thyroid hormone is
      required for growth-plate maturation, but this entry curates no cartilage
      -level evidence connecting the two in this disease; what it has is an
      epidemiological association and a growth response to iodine replacement.
    evidence:
    - reference: PMID:12816783
      reference_title: "Selenium and iodine supplementation of rural Tibetan children affected by Kashin-Beck osteoarthropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Height-for-age z scores increased significantly in the subjects who received placebo and iodine or selenium and iodine. In contrast, unsupplemented control subjects did not recover from growth retardation."
      explanation: >-
        The growth response tracks iodine, not selenium: every arm that received
        iodine gained height and the unsupplemented controls did not.
  evidence:
  - reference: PMID:9770558
    reference_title: "Kashin-Beck osteoarthropathy in rural Tibet in relation to selenium and iodine status."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 575 subjects, 280 (49 percent) had Kashin-Beck disease, 267 (46 percent) had goiter"
    explanation: The co-occurrence of the disease and goitre in the same survey population.
  - reference: PMID:9770558
    reference_title: "Kashin-Beck osteoarthropathy in rural Tibet in relation to selenium and iodine status."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When age and sex were controlled for in a multivariate analysis, low urinary iodine, high serum thyrotropin, and low serum thyroxine-binding globulin values were associated with an increased risk of Kashin-Beck disease, but a low serum selenium concentration was not."
    explanation: >-
      The result this node rests on - low urinary iodine associated with the
      disease after adjustment, low serum selenium not.

- name: Fulvic Acid Free-Radical Generation in Cartilage
  description: >-
    The mechanism proposed for the water-organic-poisoning hypothesis: oxy and
    hydroxy groups on fulvic acid interact with the chondrocyte membrane and
    drive lipid peroxidation, and fulvic acid concentrates in the two tissues
    selenium does not reach. Curated as a node so the ALTERNATIVE hypothesis
    tags a real edge rather than standing outside the graph, and because the
    water-improvement intervention now has somewhere to point.
  biological_scale: MOLECULAR
  downstream:
  - target: Chondrocyte Oxidative Stress
    causal_link_type: DIRECT
    hypothesis_groups:
    - fulvic_acid_water
  evidence:
  - reference: PMID:10090708
    reference_title: "The role of humic substances in drinking water in Kashin-Beck disease in China."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cartilage cell culture experiments indicated that the oxy or hydroxy functional groups in FA may interfere with the cell membrane and result in enhancement of lipid peroxidation."
    explanation: The cartilage cell-culture result behind the free-radical mechanism.
  - reference: PMID:10090708
    reference_title: "The role of humic substances in drinking water in Kashin-Beck disease in China."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "FA accumulated in bone and cartilage, where selenium rarely concentrates."
    explanation: >-
      The tissue distribution that makes the proposal specific to this disease -
      fulvic acid reaches bone and cartilage, where selenium does not.
  notes: >-
    The supporting work is from 1999 and has not been replicated with modern
    methods, which is why the hypothesis it serves is curated ALTERNATIVE. It is
    recorded here rather than omitted because the alternative - a hypothesis
    group that tags no edge - hides the disagreement this entry exists to show.

- name: Selenoenzyme Antioxidant Capacity Deficit
  description: >-
    Without selenium the selenoproteins cannot be made, and chondrocytes lose
    the antioxidant capacity they rely on. Measured directly in the rat model as
    reduced total antioxidant capacity, catalase, superoxide dismutase and
    glutathione peroxidase in serum and cartilage, at both activity and mRNA
    level, and in patient cartilage as loss of GPx6 from the deep zone.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: cellular oxidant detoxification
    modifier: DECREASED
    term:
      id: GO:0098869
      label: cellular oxidant detoxification
  molecular_functions:
  - preferred_term: glutathione peroxidase activity
    modifier: DECREASED
    term:
      id: GO:0004602
      label: glutathione peroxidase activity
  genes:
  - preferred_term: GPX6
    term:
      id: hgnc:4558
      label: GPX6
  downstream:
  - target: Chondrocyte Oxidative Stress
    causal_link_type: DIRECT
    hypothesis_groups:
    - selenium_deficiency
  evidence:
  - reference: PMID:22294316
    reference_title: "Oxidant damage in Kashin-Beck disease and a rat Kashin-Beck disease model by employing T-2 toxin treatment under selenium deficient conditions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The levels of thiobarbituric acid reactive substances (TBARS), indicative of lipid peroxidation in serum and cartilage, were significantly increased in all experimental groups compared to the normal diet group, while the levels of antioxidants, measured as total antioxidant capacity (T-AOC), catalase (CAT), superoxide dismutase (SOD), and glutathione peroxidases (GPX), in serum and cartilage were significantly lower than that in the normal diet group."
    explanation: >-
      The measurement this node is named for - antioxidant capacity down and
      lipid peroxidation up in serum and cartilage of the model.
  - reference: PMID:22294316
    reference_title: "Oxidant damage in Kashin-Beck disease and a rat Kashin-Beck disease model by employing T-2 toxin treatment under selenium deficient conditions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The mRNA expression of those antioxidants in cartilage tissue was significantly reduced by T-2 toxin alone or by selenium-deficient diet plus T-2 toxin treatment."
    explanation: >-
      The loss is transcriptional as well as functional, and the toxin alone is
      enough to produce it.
  - reference: PMID:42384133
    reference_title: "GPx6 downregulation drives ferroptosis in Kashin-Beck disease chondrocytes via the SLC7A11/GPx4 axis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In articular cartilage from children with KBD, GPx6 expression was markedly reduced"
    explanation: >-
      The same deficit in patient cartilage, and zone-matched to where the
      chondrocytes die.

- name: Selenoprotein S Loss and Wnt Derepression
  description: >-
    Selenoprotein S loss de-represses Wnt/beta-catenin signalling and derails
    terminal chondrocyte differentiation. Curated as its own node rather than
    folded into the antioxidant deficit above, because it is a different lesion
    with a different route out of the graph: it reaches the growth plate through
    failed differentiation rather than through oxidant damage.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    modifier: INCREASED
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
  - preferred_term: terminal chondrocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0002062
      label: chondrocyte differentiation
  genes:
  - preferred_term: SELENOS
    term:
      id: hgnc:30396
      label: SELENOS
  downstream:
  - target: Endochondral Ossification Failure at the Growth Plate
    causal_link_type: DIRECT
    hypothesis_groups:
    - selenium_deficiency
  evidence:
  - reference: PMID:42275919
    reference_title: "Selenoprotein S deficiency activates Wnt/β-catenin signaling causing impaired terminal chondrocyte differentiation in Kashin-Beck disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "SelS deficiency activates Wnt/β-catenin, impairing terminal differentiation and contributing to selenium-deficiency cartilage injury."
    explanation: >-
      Establishes the selenoprotein-to-cartilage link with a knockout, and names
      the specific pathway it runs through.
  notes: >-
    `GO:0002062` (chondrocyte differentiation) is broader than the claim - GO has no
    term for the terminal, hypertrophic step alone - so the specificity is carried in
    `preferred_term` rather than manufactured in the binding.

- name: Chondrocyte Oxidative Stress
  description: >-
    The convergence point of every arm of the etiology. Oxidant load rises in
    chondrocytes because their selenoenzyme defences are depleted, because the
    toxin generates radicals, because fulvic acid drives membrane lipid
    peroxidation, or in some combination.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: response to oxidative stress
    modifier: INCREASED
    term:
      id: GO:0006979
      label: response to oxidative stress
  downstream:
  - target: Smad2 and Smad3 Depletion
    causal_link_type: DIRECT
  - target: Chondrocyte Mitochondrial Dysfunction
    causal_link_type: DIRECT
  - target: Ferroptotic Chondrocyte Death
    causal_link_type: DIRECT
    hypothesis_groups:
    - t2_mycotoxin
  evidence:
  - reference: PMID:33769459
    reference_title: "Reduction of Smad2 caused by oxidative stress leads to necrotic death of hypertrophic chondrocytes associated with an endemic osteoarthritis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The occurrence and development of an endemic OA, Kashin-Beck disease (KBD), is closely related to oxidative stress induced by free radicals."
    explanation: >-
      The framing the paper opens with. Graded OTHER: it states the field's
      position rather than the study's own measurement.
  - reference: PMID:33769459
    reference_title: "Reduction of Smad2 caused by oxidative stress leads to necrotic death of hypertrophic chondrocytes associated with an endemic osteoarthritis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These studies reveal that oxidative stress causes necrosis of hypertrophic chondrocytes by downregulating Smad2 protein, which increases the pathogenesis of KBD cartilage."
    explanation: >-
      The paper's conclusion, which is the edge from this node to the next one.
      Graded OTHER because the conclusion rests on in vitro and in vivo results
      together and no single evidence source describes it.
  - reference: PMID:22294316
    reference_title: "Oxidant damage in Kashin-Beck disease and a rat Kashin-Beck disease model by employing T-2 toxin treatment under selenium deficient conditions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The levels of thiobarbituric acid reactive substances (TBARS), indicative of lipid peroxidation in serum and cartilage, were significantly increased in all experimental groups compared to the normal diet group, while the levels of antioxidants, measured as total antioxidant capacity (T-AOC), catalase (CAT), superoxide dismutase (SOD), and glutathione peroxidases (GPX), in serum and cartilage were significantly lower than that in the normal diet group."
    explanation: The oxidant load measured directly in cartilage of the compound rat model.

- name: Chondrocyte Mitochondrial Dysfunction
  description: >-
    Respiratory chain complexes II to V run at reduced activity in chondrocytes
    taken from adult patients, ATP falls, membrane potential collapses and
    cytochrome c is released with caspase-9 and caspase-3 activation. This is
    the intrinsic apoptotic route into the mixed cell death below, and the one
    measured in human cells rather than inferred from a model.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: mitochondrial electron transport chain activity
    modifier: DECREASED
    term:
      id: GO:0022900
      label: electron transport chain
  downstream:
  - target: Mixed-Mode Chondrocyte Death in Deep and Middle Cartilage Zones
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:20650322
    reference_title: "Mitochondrial function is altered in articular chondrocytes of an endemic osteoarthritis, Kashin-Beck disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Activities of complexes II, III, IV and V were reduced in KBD articular chondrocytes compared with cells from normal controls."
    explanation: >-
      The respiratory-chain measurement this node records, in chondrocytes
      cultured from patients.
  - reference: PMID:20650322
    reference_title: "Mitochondrial function is altered in articular chondrocytes of an endemic osteoarthritis, Kashin-Beck disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cultured KBD chondrocytes had a reduction of cellular ATP levels and contained a higher proportion of cells with de-energized mitochondria."
    explanation: The functional consequence - less ATP, and more de-energized mitochondria.
  - reference: PMID:20650322
    reference_title: "Mitochondrial function is altered in articular chondrocytes of an endemic osteoarthritis, Kashin-Beck disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mitochondrial cytochrome c release and activation of caspase-9 and 3 were also observed."
    explanation: >-
      The intrinsic apoptotic route out of this node, which is the edge to the
      mixed-mode death below.
  - reference: PMID:20650322
    reference_title: "Mitochondrial function is altered in articular chondrocytes of an endemic osteoarthritis, Kashin-Beck disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These findings suggest the involvement of mitochondrial function and apoptotic cell death in the pathophysiology of KBD."
    explanation: >-
      The authors' own placement of the finding in the disease. Graded OTHER as
      an interpretation rather than a measurement.
  notes: >-
    `GO:0022900` (electron transport chain) is not mitochondrion-specific and is
    therefore broader than the claim; the measurement is of respiratory complexes II-V
    in chondrocyte mitochondria, and that specificity is carried in `preferred_term`.

- name: Smad2 and Smad3 Depletion
  description: >-
    Oxidative stress strips Smad2 and Smad3 from hypertrophic chondrocytes, and
    the two losses produce different deaths - Smad2 loss necrosis, Smad3 loss
    apoptosis. This is the cleanest molecular account of why the cell death in
    this disease is mixed rather than of one type.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: hypertrophic chondrocyte
    term:
      id: CL:0000743
      label: hypertrophic chondrocyte
  downstream:
  - target: Mixed-Mode Chondrocyte Death in Deep and Middle Cartilage Zones
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33769459
    reference_title: "Reduction of Smad2 caused by oxidative stress leads to necrotic death of hypertrophic chondrocytes associated with an endemic osteoarthritis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Reduction of Smad2 protein induced necrotic death of hypertrophic chondrocytes, while reduction of Smad3 protein induced apoptosis."
    explanation: >-
      The dissociation this node records: two related proteins, two different
      modes of death.
  - reference: PMID:33769459
    reference_title: "Reduction of Smad2 caused by oxidative stress leads to necrotic death of hypertrophic chondrocytes associated with an endemic osteoarthritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the cartilage of KBD patients, the expression of Smad2 and Smad3 proteins in the middle and deep zone was significantly decreased with an observed full deletion in the deep zone of some samples."
    explanation: >-
      The same depletion in patient cartilage, zone by zone, which is what makes
      the in vitro result relevant to the human disease.

- name: Ferroptotic Chondrocyte Death
  description: >-
    T-2 toxin drives iron overload and lipid peroxidation in articular
    chondrocytes by suppressing the Nrf2/xCT/GPX4 axis, and loss of GPx6 sits
    upstream of the same axis in patient cartilage. Curated as its own node
    because it is pharmacologically separable: an iron chelator reverses it.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: ferroptosis
    modifier: INCREASED
    term:
      id: GO:0097707
      label: ferroptosis
  downstream:
  - target: Mixed-Mode Chondrocyte Death in Deep and Middle Cartilage Zones
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:42103195
    reference_title: "Deferoxamine alleviates T-2 toxin-induced articular chondrocyte ferroptosis via the Nrf2/xCT/GPX4 axis: Implications for Kashin-Beck disease pathology."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our findings demonstrate that T-2 toxin induces ferroptosis in articular chondrocytes, at least partially, through the suppression of the Nrf2/xCT/GPX4 axis."
    explanation: The mechanism and the axis it runs through.
  - reference: PMID:42103195
    reference_title: "Deferoxamine alleviates T-2 toxin-induced articular chondrocyte ferroptosis via the Nrf2/xCT/GPX4 axis: Implications for Kashin-Beck disease pathology."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "T-2 toxin exposure induced severe articular cartilage degradation, accompanied by intracellular iron overload lipid peroxidation, oxidative stress and distinctive mitochondrial damage characteristic of ferroptosis."
    explanation: The phenotype, including the mitochondrial morphology that identifies ferroptosis.
  - reference: PMID:42384133
    reference_title: "GPx6 downregulation drives ferroptosis in Kashin-Beck disease chondrocytes via the SLC7A11/GPx4 axis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Gpx6 knockout mice exhibited signs of ECM degradation in articular cartilage, along with an enhanced susceptibility to T-2 toxin exposure."
    explanation: >-
      A knockout of the selenoenzyme that sits upstream of the axis reproduces
      matrix degradation and sensitises the animal to the toxin, which links the
      selenium arm to this toxin-driven node.

- name: Mixed-Mode Chondrocyte Death in Deep and Middle Cartilage Zones
  description: >-
    Chondrocytes die by several mechanisms at once and the mechanisms sort by
    cartilage zone: necroptosis dominates the middle zone in children, frank
    necrosis the deep zone. Caspase-3 is not raised, so classic apoptosis is not
    the whole story. This entry does not force a single mode.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: necroptotic process
    modifier: INCREASED
    term:
      id: GO:0070266
      label: necroptotic process
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  downstream:
  - target: Endochondral Ossification Failure at the Growth Plate
    causal_link_type: DIRECT
  - target: Articular Cartilage Matrix Degradation
    causal_link_type: DIRECT
  - target: Type H Vessel Proliferation at the Epiphyseal Plate
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The inflammation accompanying chondrocyte injury upregulates IL-6 and
      SELE, which drives the vascular response.
  evidence:
  - reference: PMID:30680829
    reference_title: "Death of chondrocytes in Kashin-Beck disease: Apoptosis, necrosis or necroptosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemistry failed to detect significant differences in caspase-3 levels in KBD children compared to controls, suggesting that beside apoptosis necroptosis dominates as a cell death mechanism in the middle zone of cartilage from KBD children."
    explanation: >-
      The negative caspase-3 result and the RIP3 positivity together, which is
      what makes this node "mixed-mode" rather than apoptotic.
  - reference: PMID:30680829
    reference_title: "Death of chondrocytes in Kashin-Beck disease: Apoptosis, necrosis or necroptosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ultrastructural analysis of chondrocyte from deep cartilage revealed abnormal cells with numerous morphological changes, such as plasma membrane breakdown, generalized swelling of the cytoplasm and loss of identifiable organelles."
    explanation: >-
      The ultrastructural necrosis in the deep zone, distinct from the
      middle-zone picture. The cached full text places this analysis in the
      children's cartilage (Figure 5), not in the rat arm the abstract describes
      immediately before it.
  - reference: PMID:30680829
    reference_title: "Death of chondrocytes in Kashin-Beck disease: Apoptosis, necrosis or necroptosis?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Chondrocyte death plays a key role in either the initiation or the progression of KBD pathogenesis."
    explanation: >-
      Places this node at the centre of the disease rather than downstream of
      it. Graded OTHER: the sentence is the paper's closing interpretation
      rather than one of its measurements.

- name: Type H Vessel Proliferation at the Epiphyseal Plate
  description: >-
    Type H vessels multiply in the growing epiphyseal plate and carry more T-2
    toxin to it, so the vascular response feeds the injury that provoked it.
    The loop is demonstrated in both directions pharmacologically, which is
    unusually strong for a feedback claim.
  biological_scale: TISSUE
  locations:
  - preferred_term: epiphyseal plate
    term:
      id: UBERON:0002516
      label: epiphyseal plate
  downstream:
  - target: Mixed-Mode Chondrocyte Death in Deep and Middle Cartilage Zones
    causal_link_type: DIRECT
    description: >-
      The amplifying limb: more vessels, more toxin delivered to the plate, more
      chondrocyte death.
    evidence:
    - reference: PMID:42000119
      reference_title: "A self-perpetuating cycle of Type H vessel proliferation and T-2 induced inflammation drives KBD pathogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Roxadustat increased type H vessel density (Mean Difference (MD): 4.11, 95%CI: 0.19, 8.04), amplified T-2 toxin accumulation near the epiphyseal plate (MD: 0.16, 95%CI: 0.062, 0.25) and exacerbated chondrocyte apoptosis and necrosis."
      explanation: >-
        Promoting the vessels worsened toxin accumulation and cell death -
        the forward half of the loop, shown by intervention rather than
        correlation.
  evidence:
  - reference: PMID:42000119
    reference_title: "A self-perpetuating cycle of Type H vessel proliferation and T-2 induced inflammation drives KBD pathogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Conversely, HF reduced type H vessel proliferation (MD: -3.70, 95%CI: -6.67, -0.73), decreased T-2 toxin levels and suppressed inflammation (MD: -0.17, 95%CI: -0.23, -0.11), while preserving proteoglycan content and cartilage morphology."
    explanation: >-
      The mirror-image experiment: inhibiting the vessels reduced toxin,
      inflammation and cartilage damage. Two-directional pharmacology is what
      makes this node causal rather than associated.
  - reference: PMID:42000119
    reference_title: "A self-perpetuating cycle of Type H vessel proliferation and T-2 induced inflammation drives KBD pathogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Single-cell RNA sequencing, qPCR and explants revealed that T-2 toxin-induced inflammation upregulated IL-6 and SELE, promoting type H vessels proliferation."
    explanation: The signalling route from chondrocyte injury to the vascular response.

- name: Articular Cartilage Matrix Degradation
  description: >-
    Alongside the growth-plate lesion, the articular matrix itself is degraded:
    matrix metalloproteinases rise, type II collagen and proteoglycan fall.
    TSG-6 is over-expressed through all three cartilage zones in patients and,
    when silenced, takes the metalloproteinases down with it - so it is a
    driver of the degradation rather than a marker of it.
  biological_scale: TISSUE
  locations:
  - preferred_term: articular cartilage
    term:
      id: UBERON:0010996
      label: articular cartilage of joint
  biological_processes:
  - preferred_term: extracellular matrix disassembly
    modifier: INCREASED
    term:
      id: GO:0022617
      label: extracellular matrix disassembly
  genes:
  - preferred_term: TSG-6
    term:
      id: hgnc:11898
      label: TNFAIP6
  downstream:
  - target: Secondary Degenerative Arthropathy
    causal_link_type: DIRECT
  evidence:

name: Kashin-Beck Disease
creation_date: "2026-09-07T00:00:00Z"
category: Environmental Osteochondropathy
parents:
- Osteochondropathy
- Environmental Disease
disease_term:
  preferred_term: Kashin-Beck disease
  term:
    id: MONDO:0005610
    label: Kashin-Beck disease
synonyms:
- KBD
- Endemic osteoarthropathy
- Big bone disease
description: >-
  Kashin-Beck disease is an endemic osteochondropathy of children and
  adolescents in a narrow belt running from Siberia through northern and
  western China into Tibet. Chondrocytes die in the deep and middle zones of
  the growth plate and articular cartilage; endochondral ossification fails
  where they die, and the result is symmetric shortening of the fingers and
  limbs, enlarged joints, and a degenerative arthropathy that persists for
  life. Onset is in childhood, usually between three and twelve years of age.
  The cause is environmental and, after seventy years, still unsettled: the
  factors most consistently associated with the disease are selenium
  deficiency, iodine deficiency, grain contaminated by the Fusarium
  trichothecene T-2 toxin, and organic matter - chiefly fulvic acid - in
  drinking water, and no single one of them has been shown to be sufficient.
  What is not disputed is that the disease is preventable: changing the grain
  supply, supplementing selenium and improving the water supply each cut
  incidence sharply, and China's national incidence fell from 22.1% in 1990 to
  0.18% in 2015.


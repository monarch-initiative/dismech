  frequency: FREQUENT
  diagnostic: true
  notes: >-
    Core feature: spontaneous, delirium-like alterations in cognition,
    attention and arousal occurring on a second-to-second basis. Of lesser
    amplitude in the prodromal phase, and most diagnostic when present early,
    since fluctuations also occur in advanced stages of other dementias. HPO has
    no term for fluctuating cognition; Fluctuations in consciousness (changes in
    awareness and responsiveness) is the closest.
  evidence:
  - reference: PMID:28592453
    reference_title: "Diagnosis and management of dementia with Lewy bodies: Fourth consensus report of the DLB Consortium."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "DLB fluctuations have been described in detail previously1,2 and are typically delirium-like,e5 occurring as spontaneous alterations in cognition, attention, and arousal."
    explanation: Defines DLB fluctuations.
  - reference: PMID:28592453
    reference_title: "Diagnosis and management of dementia with Lewy bodies: Fourth consensus report of the DLB Consortium."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Fluctuations may also occur in advanced stages of other dementias, so they best predict DLB when they are present early."
    explanation: Fluctuations are most diagnostic early in the course.
  - reference: PMID:32241955
    reference_title: "Research criteria for the diagnosis of prodromal dementia with Lewy bodies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cognitive fluctuations may be of lesser amplitude or frequency than in more severe disease."
    explanation: Fluctuations are milder in the prodromal phase.
  - reference: PMID:10762503
    reference_title: "Quantifying fluctuation in dementia with Lewy bodies, Alzheimer's disease, and vascular dementia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with DLB had a greater prevalence and severity of FC than did patients with AD or VaD rated using clinical, attentional, and EEG measures. The 90-second cognitive and EEG trials demonstrated that FC occurs on a second-to-second basis in patients with DLB."
    explanation: Fluctuations are more frequent and severe in DLB and occur second to second.
  phenotype_term:
    preferred_term: Fluctuating cognition and alertness
    term:
      id: HP:0007159
      label: Fluctuations in consciousness

    evidence_source: HUMAN_CLINICAL
    snippet: "Mean midfrontal ChAT activity was markedly reduced in diseases with LB (LBV: 53.3 +/- 39.0; PD: 54.8 +/- 35.7; DLBD: 41.3 +/- 24.8) compared to NC (255.4 +/- 134.6; p < 0.001) and AD (122.6 +/- 78.9; p < 0.05)."
    explanation: Neocortical ChAT is lower in Lewy body diseases than in AD.
  - reference: PMID:12365882
    reference_title: "Early and widespread cholinergic losses differentiate dementia with Lewy bodies from Alzheimer disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although cholinergic deficits are seen in both AD and LBV, loss of ChAT activity is less severe and occurs later in the clinical course of AD. Conversely, in LBV, loss of ChAT activity is already prominent in the earliest stages of the illness"
    explanation: The cholinergic deficit is present from the earliest clinical stage, which places it upstream of the early cognitive and perceptual features.
  - reference: PMID:19474411
    reference_title: "Mapping of brain acetylcholinesterase alterations in Lewy body disease by PET."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with PDD/DLB, however, had even lower AChE activity in the cerebral cortex (% reduction = -27%) (p < 0.01)."
    explanation: In vivo PET shows reduced cortical acetylcholinesterase in PDD and DLB.
- name: Thalamocortical Arousal Network Dysfunction
  biological_scale: TISSUE
  role: proposed effector of fluctuations
  description: >-
    Altered thalamic microstructure and cholinergic signalling with unstable
    thalamocortical rhythms, seen as posterior EEG slowing and moment-to-moment
    variability of the dominant frequency. This is the proposed substrate of
    fluctuating cognition and alertness; regional Lewy body density does not
    explain fluctuations.
  locations:
  - preferred_term: thalamus
    term:
      id: UBERON:0001897
      label: dorsal plus ventral thalamus
  downstream:
  - target: Fluctuating Cognition and Alertness
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - cholinergic_fluctuation_hypothesis
    description: >-
      Thalamic and electrophysiological measures track fluctuation severity.
    evidence:
    - reference: PMID:25260701
      reference_title: "Thalamic Involvement in Fluctuating Cognition in Dementia with Lewy Bodies: Magnetic Resonance Evidences."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "tCho/tCr increase was found within right thalamus of DLB patients as compared with AD. This increase correlated with severity and frequency of flCog."
      explanation: The thalamic choline signal correlates with fluctuation severity and frequency.
    - reference: PMID:18202105
      reference_title: "EEG comparisons in early Alzheimer's disease, dementia with Lewy bodies and Parkinson's disease with dementia patients with a 2-year follow-up."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "in those with DLB and PDD, the degree to which residual alpha and 5.6-7.9 bands appeared was related to the presence and severity of cognitive fluctuations."
      explanation: Posterior EEG rhythm abnormalities scale with fluctuation severity.
  - target: Posterior EEG Slowing
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29656189
      reference_title: "Quantitative electroencephalography as a marker of cognitive fluctuations in dementia with Lewy bodies and an aid to differential diagnosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In DLB patients only, greater DFV and EEG slowing were correlated with CFs, measured by the clinician assessment of fluctuations (CAF) scale."
      explanation: EEG slowing and dominant-frequency variability are the measurable output of the unstable thalamocortical rhythm.
  evidence:
  - reference: PMID:11844739
    reference_title: "Visual hallucinations in Lewy body disease relate to Lewy bodies in the temporal lobe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no association across groups between any neuropathological variable and the presence or absence of fluctuating cognition."
    explanation: Fluctuations are not explained by regional Lewy body density, which is why a network-level node is used.
  - reference: PMID:11044778
    reference_title: "Quantification and characterization of fluctuating cognition in dementia with Lewy bodies and Alzheimer's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DLB patients had significantly more severe FC and more severe variability in attentional and slow electrocortical measures than either AD patients or normal controls in all time frames. Attentional and EEG variability also correlated significantly with independent clinical ratings of FC."
    explanation: EEG and attentional variability track clinical fluctuations in DLB.
- name: Limbic Lewy Pathology
  biological_scale: TISSUE
  role: early-to-mid-stage lesion
  description: >-
    Lewy bodies in the amygdala, parahippocampal gyrus and inferior temporal
    cortex (the transitional or limbic stage). High temporal-lobe Lewy body
    density relates to well-formed visual hallucinations, and early
    hallucinations to parahippocampal and inferior temporal density. Limbic and
    paralimbic dysfunction is also the correlate of misidentification
    delusions. It is reached from the brainstem in the caudo-rostral route and
    from the olfactory bulb and amygdala in the brain-first route.
  locations:
  - preferred_term: amygdala
    term:
      id: UBERON:0001876
      label: amygdala
  - preferred_term: parahippocampal gyrus
    term:
      id: UBERON:0002973
      label: parahippocampal gyrus
  - preferred_term: inferior temporal gyrus
    term:
      id: UBERON:0002751
      label: inferior temporal gyrus
  biological_processes:
  - preferred_term: inclusion body assembly
    term:
      id: GO:0070841
      label: inclusion body assembly
    modifier: INCREASED
  downstream:
  - target: Visual Hallucinations
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11844739
      reference_title: "Visual hallucinations in Lewy body disease relate to Lewy bodies in the temporal lobe."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cases with well-formed visual hallucinations had high densities of LB in the amygdala and parahippocampus, with early hallucinations relating to higher densities in parahippocampal and inferior temporal cortices."
      explanation: Temporal-lobe Lewy body density relates to well-formed and early visual hallucinations.
  - target: Delusional Misidentification
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Misidentification syndromes map to limbic and paralimbic hypoperfusion.
      The evidence is perfusion imaging rather than histopathology.
    evidence:
    - reference: PMID:19920063
      reference_title: "Neural correlates of psychotic symptoms in dementia with Lewy bodies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Factor 1 symptoms (Capgras syndrome, phantom boarder, reduplication of person and place and misidentification of person) represented misidentifications, and were significantly related to hypoperfusion in the left hippocampus, insula, ventral striatum and bilateral inferior frontal gyri."
      explanation: Misidentification symptoms correlate with limbic and paralimbic hypoperfusion on SPECT.
  - target: Neocortical Lewy Pathology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Progression from the limbic (transitional) to the diffuse neocortical
      stage, which carries a shorter illness.
    evidence:
    - reference: PMID:19399512
      reference_title: "Unified staging system for Lewy body disorders: correlation with nigrostriatal degeneration, cognitive impairment and motor dysfunction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All subjects were classifiable into one of the following stages: I. Olfactory Bulb Only; IIa Brainstem Predominant; IIb Limbic Predominant; III Brainstem and Limbic; IV Neocortical."
      explanation: The unified staging places neocortical involvement after limbic involvement.
  evidence:
  - reference: PMID:11844739
    reference_title: "Visual hallucinations in Lewy body disease relate to Lewy bodies in the temporal lobe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cases with well-formed visual hallucinations had high densities of LB in the amygdala and parahippocampus, with early hallucinations relating to higher densities in parahippocampal and inferior temporal cortices."
    explanation: Temporal-limbic Lewy pathology in a clinicopathological series of Lewy body disease.
- name: Neocortical Lewy Pathology
  biological_scale: TISSUE
  role: late-stage lesion
  description: >-
    Diffuse neocortical Lewy bodies and neurites, the stage at which the full
    DLB syndrome is most reliably expressed. Clinical recognition of DLB rises
    with the extent of Lewy pathology, the diffuse stage carries a shorter
    illness than the limbic stage, and posterior and occipital association
    cortex dysfunction accompanies it.
  locations:
  - preferred_term: neocortex
    term:
      id: UBERON:0001950
      label: neocortex
  biological_processes:
  - preferred_term: inclusion body assembly
    term:
      id: GO:0070841
      label: inclusion body assembly
    modifier: INCREASED
  downstream:
  - target: Occipital and Parietal Association Cortex Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Occipital hypometabolism on FDG-PET correlates with visual cortex
      neuropathology. Whether the hypometabolism is primarily synaptic or
      cholinergic is unresolved.
    evidence:
    - reference: PMID:28592453
      reference_title: "Diagnosis and management of dementia with Lewy bodies: Fourth consensus report of the DLB Consortium."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "FDG-PET occipital hypometabolism correlates with visual cortex neuropathology in DLB33 and a small, autopsy-confirmed study suggested this could distinguish DLB from AD with high accuracy."
      explanation: The consensus report links occipital hypometabolism to visual cortex neuropathology.
  - target: Neuronal Death
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Alpha-synuclein burden independently predicts a shorter illness,
      consistent with neocortical Lewy pathology driving neurodegeneration.
    evidence:
    - reference: PMID:29100980
      reference_title: "The limbic and neocortical contribution of α-synuclein, tau, and amyloid β to disease duration in dementia with Lewy bodies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In DLB, α-synuclein is an important predictor of disease duration, both independently and synergistically with tau and Aβ."
      explanation: Alpha-synuclein burden predicts disease duration independently of AD pathology.
  - target: Dementia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:25552579
      reference_title: "Clinicians' ability to diagnose dementia with Lewy bodies is not affected by β-amyloid load."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The likelihood of occurrence of the DLB clinical syndrome is positively related to the extent of Lewy body pathology and negatively related to the severity of Alzheimer neuritic pathology, while β-amyloid load has no effect."
      explanation: The full DLB dementia syndrome scales with the extent of Lewy pathology.
    - reference: PMID:10822429
      reference_title: "Alpha-synuclein cortical Lewy bodies correlate with dementia in Parkinson's disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "CLBs positive for alpha-synuclein are highly sensitive (91%) and specific (90%) neuropathologic markers of dementia in PD and slightly more sensitive than ubiquitin-positive CLBs."
      explanation: Cortical Lewy bodies mark dementia in Parkinson disease, an indirect parallel for DLB.
  evidence:
  - reference: PMID:29100980
    reference_title: "The limbic and neocortical contribution of α-synuclein, tau, and amyloid β to disease duration in dementia with Lewy bodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with diffuse Lewy body disease had more severe pathology of each type and a shorter duration of illness than individuals with transitional Lewy body disease."
    explanation: The diffuse neocortical stage carries a shorter illness than the transitional (limbic) stage.
  - reference: PMID:28592453
    reference_title: "Diagnosis and management of dementia with Lewy bodies: Fourth consensus report of the DLB Consortium."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Further efforts are required to develop better interrater reliability59 for Lewy-related disease subtypes (olfactory bulb only, amygdala predominant, brainstem, limbic ... , and diffuse neocortical)."
    explanation: The consensus pathology categories, of which diffuse neocortical is the most extensive.
- name: Occipital and Parietal Association Cortex Dysfunction
  biological_scale: TISSUE
  role: mid-stage effector
  description: >-
    Hypometabolism and hypoperfusion of the visual association and parietal
    cortex, most pronounced in the visual association cortex relative to AD,
    with relative sparing of the posterior cingulate (the cingulate island
    sign) when tangle stage is low. It accompanies the visuoperceptual and
    visuospatial deficits and is one of the substrates of visual
    hallucinations.
  locations:
  - preferred_term: visual association cortex

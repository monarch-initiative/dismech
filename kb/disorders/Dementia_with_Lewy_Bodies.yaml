- category: Neurological
  name: Visual Hallucinations
  frequency: VERY_FREQUENT
  diagnostic: true
  notes: >-
    Core feature: recurrent, well-formed visual hallucinations, typically of
    people or animals, in up to 80% of patients. In men they usually develop
    after the other core features; in women they appear earlier, alongside
    fluctuations and parkinsonism. They are less frequent when AD tangle
    pathology is high, and their development predicts shorter survival.
  evidence:
  - reference: PMID:29222591
    reference_title: "Dementia with Lewy bodies and Parkinson's disease-dementia: current concepts and controversies."
    supports: SUPPORT
    snippet: "The clinical features of DLB and PDD include cognitive impairment, parkinsonism, visual hallucinations, and fluctuating attention."
    explanation: This confirms that visual hallucinations are a core clinical feature of dementia with Lewy bodies.
  - reference: PMID:28592453
    reference_title: "Diagnosis and management of dementia with Lewy bodies: Fourth consensus report of the DLB Consortium."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Recurrent, complex visual hallucinations occur in up to 80% of patients with DLB and are a frequent clinical signpost to diagnosis."
    explanation: Gives the frequency of visual hallucinations.
  - reference: PMID:34761850
    reference_title: "The temporal onset of the core features in dementia with Lewy bodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Visual hallucinations developed after the other core features in men, but in women, they appeared earlier and concurrently with fluctuations and parkinsonism."
    explanation: Hallucinations come late in the core-feature sequence in men and earlier in women.
  - reference: PMID:41066723
    reference_title: "Core Clinical Features Associated With Survival in Patients With Dementia With Lewy Bodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Shorter survival was associated with the development of VHs (hazard ratio [HR] 3.25, 95% CI 2.46-4.29) and parkinsonism (HR 2.28, 95% CI 1.54-3.39) during the disease course and VHs at the time of DLB diagnosis (HR 1.60, 95% CI 1.18-2.16)."
    explanation: Developing hallucinations predicts shorter survival.
  phenotype_term:
    preferred_term: Visual hallucination
    term:
      id: HP:0002367
      label: Visual hallucination
- category: Psychiatric
  name: Delusions
  frequency: FREQUENT
  notes: >-
    Systematized delusions are more frequent than in AD and can be the

- name: Reduced Neocortical Hypocretin Signalling
  biological_scale: CELLULAR
  role: proposed contributor to hypersomnolence
  description: >-
    Reduced hypocretin (orexin) immunoreactivity in the DLB neocortex at
    autopsy, correlating with hypersomnolence and with alpha-synuclein levels.
    The measurement is neocortical: the source reports hypocretin-immunoreactive
    fibers and neurons in cortex, and notes these may represent uptake from
    projecting fibers rather than local production. Whether the hypothalamic
    hypocretin neuron population is itself depleted in DLB was not examined,
    so no neuronal loss is asserted here and the contribution is proposed
    rather than established.
  cell_types:
  - preferred_term: hypocretin-secreting neuron
    term:
      id: CL:0011109
      label: hypocretin-secreting neuron
  downstream:

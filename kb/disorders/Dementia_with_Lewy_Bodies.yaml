- category: Psychiatric
  name: Apathy
  frequency: FREQUENT
  notes: >-
    A common prodromal neuropsychiatric symptom that responds to cholinesterase
    inhibitors.
  evidence:
  - reference: PMID:34114509
    reference_title: "Prodromal Dementia With Lewy Bodies: Evolution of Symptoms and Predictors of Dementia Onset."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Apathy, depression, and anxiety were common prodromal neuropsychiatric symptoms."
    explanation: Apathy is common before a DLB diagnosis.
  phenotype_term:
    preferred_term: Apathy
    term:
      id: HP:0000741
      label: Apathy
- category: Neurological
  name: Dementia
  frequency: OBLIGATE
  diagnostic: true
  notes: >-
    Progressive cognitive decline sufficient to interfere with daily function.
    The profile is attention-, executive- and visuospatial-predominant with
    relatively spared early memory. MMSE declines about 2.1 points a year, and
    survival from diagnosis is about 1.6 years shorter than in AD.
  evidence:
  - reference: PMID:29222591
    reference_title: "Dementia with Lewy bodies and Parkinson's disease-dementia: current concepts and controversies."
    supports: SUPPORT
    snippet: "The clinical features of DLB and PDD include cognitive impairment, parkinsonism, visual hallucinations, and fluctuating attention."
    explanation: This confirms that cognitive impairment is a core feature of dementia with Lewy bodies.
  - reference: PMID:28304294
    reference_title: "Long-Term Cognitive Decline in Dementia with Lewy Bodies in a Large Multicenter, International Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean annual decline in MMSE score was 2.1 points in DLB, compared to 1.6 in AD (p = 0.07 compared to DLB) and 1.8 in PDD (p = 0.19)."
    explanation: Rate of cognitive decline in established DLB.
  - reference: PMID:30625375
    reference_title: "Survival time and differences between dementia with Lewy bodies and Alzheimer's disease following diagnosis: A meta-analysis of longitudinal studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Average survival time in DLB from diagnosis was 4.11 years (SD ± 4.10) and in AD 5.66 (SD ± 5.32) years, equating to a 1.60 (95% CI: -2.44 to -0.77) years shorter survival in DLB (p < 0.01)."
    explanation: Survival from diagnosis is shorter than in AD.
  phenotype_term:
    preferred_term: Dementia
    term:
      id: HP:0000726
      label: Dementia
- category: Neurological
  name: Memory Impairment
  frequency: FREQUENT
  notes: >-
    Later, or earlier with AD co-pathology. Recognition memory is relatively
    spared at the MCI-LB stage; episodic memory decline best distinguishes
    dementia-first from parkinsonism-first phenoconversion in isolated RBD.
    Prominent amnestic decline is associated with concomitant AD pathology.
  evidence:
  - reference: PMID:32241955
    reference_title: "Research criteria for the diagnosis of prodromal dementia with Lewy bodies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In summary, the performance pattern of MCI-LB is best characterized as single- or multidomain nonamnestic MCI, or as multidomain amnestic MCI, whereas single-domain amnestic MCI is more likely to represent MCI-AD."
    explanation: Memory is not the leading deficit at the MCI-LB stage.
  - reference: PMID:15985574
    reference_title: "Cognitive differences in dementia patients with autopsy-verified AD, Lewy body pathology, or both."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with Alzheimer disease (AD) alone and AD/Lewy body pathology (LBP) had more severe memory impairment than patients with LBP."
    explanation: Memory impairment is milder in pure Lewy body pathology than with AD co-pathology.
  phenotype_term:
    preferred_term: Memory impairment
    term:
      id: HP:0002354
      label: Memory impairment
- category: Neurological
  name: Parkinsonism
  frequency: VERY_FREQUENT
  diagnostic: true
  notes: >-
    Core feature: bradykinesia, rest tremor or rigidity, any one of which
    suffices. Often absent or subtle at presentation (motor slowing is common
    in the three years before diagnosis), then accumulating so that it
    eventually occurs in more than 85% of patients. It is dominated by
    postural instability and gait difficulty, worsens faster than in
    Parkinson disease, and responds less well to levodopa. Dementia usually
    precedes or accompanies parkinsonism, the arbitrary distinction from
    Parkinson disease dementia.
  evidence:
  - reference: PMID:29222591
    reference_title: "Dementia with Lewy bodies and Parkinson's disease-dementia: current concepts and controversies."
    supports: SUPPORT
    snippet: "Despite considerable clinical overlap, their diagnosis is based on an arbitrary distinction between the time of onset of motor and cognitive symptoms: dementia often preceding parkinsonism in DLB."
    explanation: This confirms that parkinsonism is a core feature of DLB, with the temporal relationship to cognitive symptoms distinguishing it from Parkinson's disease dementia.
  - reference: PMID:28592453
    reference_title: "Diagnosis and management of dementia with Lewy bodies: Fourth consensus report of the DLB Consortium."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Spontaneous parkinsonian features, not due to antidopaminergic medications or stroke, are common in DLB, eventually occurring in over 85%."
    explanation: Parkinsonism accumulates to over 85% over the course.
  - reference: PMID:34114509
    reference_title: "Prodromal Dementia With Lewy Bodies: Evolution of Symptoms and Predictors of Dementia Onset."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Motor slowing was present in approximately 70% of participants 3 years prior to DLB diagnosis."
    explanation: Subtle motor slowing precedes diagnosis.
  - reference: PMID:10867448
    reference_title: "One year follow-up of parkinsonism in dementia with Lewy bodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DLB patients with established parkinsonism had an annual increase in severity of 9%, but progression was more rapid (49% in 1 year) in patients with early parkinsonism."
    explanation: Parkinsonism progresses, fastest in its early phase.
  - reference: PMID:16614017
    reference_title: "Motor subtype and cognitive decline in Parkinson's disease, Parkinson's disease with dementia, and dementia with Lewy bodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mean UPDRS III scores deteriorated over the two year follow up in all patient groups, with decline in the PDD and DLB being more rapid (mean decline; controls = 1.6, PD = 5.1, PDD = 9.7 and DLB = 11.3 points, one way analysis of variance; F = 4.1, p = 0.008)."
    explanation: Motor scores worsen faster in DLB than in Parkinson disease.
  - reference: PMID:12889077
    reference_title: "Extrapyramidal features in Parkinson's disease with and without dementia and dementia with Lewy bodies: A cross-sectional comparative study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The PIGD-subtype was more common in PDD (88% of cases) and DLB (69% of cases) groups compared with the PD group (38% of cases), in which TD and PIGD sub-types were more equally represented (P < 0.001)."
    explanation: The postural-instability-gait subtype predominates in DLB.
  phenotype_term:
    preferred_term: Parkinsonism
    term:
      id: HP:0001300
      label: Parkinsonism
  sequelae:
  - target: Frequent Falls
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Parkinsonism is the main clinical risk factor for the recurrent falls of
      DLB.
    evidence:
    - reference: PMID:10026382
      reference_title: "The prevalence, assessment and associations of falls in dementia with Lewy bodies and Alzheimer's disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Multiple falls were associated with DLB, parkinsonism, previous falls, greater impairment of activities of daily living and older age."
      explanation: Multiple falls are associated with parkinsonism in DLB.
    - reference: PMID:19182481
      reference_title: "Risk factors for falls in community-dwelling patients with Alzheimer's disease and dementia with Lewy bodies: walking with visuocognitive impairment may cause a fall."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Parkinsonism was a major risk factor for falls."
      explanation: Parkinsonism is a major fall risk factor.
- category: Neurological
  name: Bradykinesia
  frequency: FREQUENT
  notes: >-
    Body bradykinesia is more severe in DLB than in Parkinson disease of
    similar stage.
  evidence:
  - reference: PMID:11514644
    reference_title: "Comparison of extrapyramidal signs in dementia with Lewy bodies and Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 58 DLB patients with complete data had more severe action tremor, body bradykinesia, difficulty arising from a chair, and facial expression, gait, and rigidity symptoms than PD patients (all P<0.001). Abnormal posture and tremor at rest did not differ."
    explanation: Bradykinesia is more severe than in Parkinson disease; rest tremor does not differ.
  phenotype_term:
    preferred_term: Bradykinesia
    term:
      id: HP:0002067
      label: Bradykinesia
- category: Neurological
  name: Rigidity
  frequency: FREQUENT
  notes: >-
    Present in about 70% in the prodromal phase.
  evidence:
  - reference: PMID:34114509
    reference_title: "Prodromal Dementia With Lewy Bodies: Evolution of Symptoms and Predictors of Dementia Onset."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the prodromal phase, 50% of DLB participants demonstrated gait disorder, 70% had rigidity, 20% endorsed visual hallucinations, and over 50% of participants endorsed REM sleep behavior disorder."
    explanation: Rigidity is common already in the prodromal phase.
  - reference: PMID:11514644
    reference_title: "Comparison of extrapyramidal signs in dementia with Lewy bodies and Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 58 DLB patients with complete data had more severe action tremor, body bradykinesia, difficulty arising from a chair, and facial expression, gait, and rigidity symptoms than PD patients (all P<0.001). Abnormal posture and tremor at rest did not differ."
    explanation: Rigidity is more severe than in Parkinson disease.
  phenotype_term:
    preferred_term: Rigidity
    term:
      id: HP:0002063
      label: Rigidity
- category: Neurological
  name: Postural Instability
  frequency: FREQUENT
  notes: >-
    Postural instability and gait difficulty dominate the motor syndrome.
    Gait disorder is present in about half of patients in the prodromal phase.
  evidence:
  - reference: PMID:16614017
    reference_title: "Motor subtype and cognitive decline in Parkinson's disease, Parkinson's disease with dementia, and dementia with Lewy bodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The PIGD motor subtype was significantly over-represented in the PDD (83% of all patients) and DLB (73%) groups compared with the PD group (40%)"
    explanation: The postural-instability-gait subtype is over-represented in DLB.
  phenotype_term:
    preferred_term: Postural instability
    term:
      id: HP:0002172
      label: Postural instability
  sequelae:
  - target: Frequent Falls
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Slower gait raises fall risk in DLB.
    evidence:
    - reference: PMID:41069430
      reference_title: "Gait characteristics and factors associated with fall risk in patients with dementia with Lewy bodies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Logistic regression analysis revealed that for each 1 standard deviation decrease in gait speed, fall risk increased by 33% (p = 0.001)."
      explanation: Gait slowing predicts falls in a cross-sectional DLB cohort.
- category: Neurological
  name: Frequent Falls
  frequency: FREQUENT
  notes: >-
    Late. Repeated falls are a supportive feature, often injurious, and a
    contributor to death.
  evidence:
  - reference: PMID:10026382
    reference_title: "The prevalence, assessment and associations of falls in dementia with Lewy bodies and Alzheimer's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple falls (>5) occurred in 37% of DLB patients and 6% of those with AD, often resulting in injury."
    explanation: Recurrent falls are far more common than in AD.
  - reference: PMID:19436724
    reference_title: "Incidence and prediction of falls in dementia: a prospective study in older people."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In dementia, significant univariate predictors of sustaining at least one fall included diagnosis of Lewy body disorder (proportional hazard ratio (HR) adjusted for age and sex: 3.33, 2.11-5.26)"
    explanation: A Lewy body diagnosis triples fall risk among people with dementia (DLB and PDD pooled).
  phenotype_term:
    preferred_term: Frequent falls
    term:
      id: HP:0002359
      label: Frequent falls
- category: Neurological
  name: Severe Antipsychotic Sensitivity
  frequency: FREQUENT
  notes: >-
    Supportive feature: severe, sometimes fatal reactions (sedation, rigidity,
    confusion, autonomic instability) to D2-blocking antipsychotics, reported
    in about half of exposed patients and associated with increased mortality.
    Antipsychotics should be avoided where possible. HPO has no phenotype term
    for drug sensitivity of this kind; the modifier Triggered by neuroleptic
    medication (HP:0034551) applies to a sign rather than naming one, so no
    phenotype_term is bound.
  evidence:
  - reference: PMID:1356550
    reference_title: "Neuroleptic sensitivity in patients with senile dementia of Lewy body type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "16 (80%) patients with Lewy body type dementia received neuroleptics, 13 (81%) of whom reacted adversely; in seven (54%) the reactions were severe."
    explanation: Adverse and severe neuroleptic reactions in an autopsy-confirmed series.
  - reference: PMID:1356550
    reference_title: "Neuroleptic sensitivity in patients with senile dementia of Lewy body type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Survival analysis showed an increased mortality in the year after presentation to psychiatric services compared with patients with mild or no neuroleptic sensitivity"
    explanation: Severe sensitivity carries increased mortality.
  - reference: PMID:28592453
    reference_title: "Diagnosis and management of dementia with Lewy bodies: Fourth consensus report of the DLB Consortium."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Severe antipsychotic sensitivity is now listed as supportive, because reduced prescribing of D2 receptor blocking antipsychotics in DLB limits its diagnostic usefulness."
    explanation: Antipsychotic sensitivity is a supportive feature.
- category: Gastrointestinal
  name: Dysphagia
  frequency: FREQUENT
  notes: >-
    Late. Mostly pharyngeal-phase dysfunction on videofluoroscopy; swallowing
    complaints exceed those in AD. The lesion responsible (dorsal vagal or
    brainstem swallowing network, nigrostriatal loss, or cognitive decline) is
    not established, so dysphagia is not wired to a mechanism node.
  evidence:
  - reference: PMID:24099488
    reference_title: "Dysphagia in Lewy body dementia - a clinical observational study of swallowing function by videofluoroscopic examination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-six patients (32%) reported symptoms of dysphagia such as swallowing difficulties or coughing. Twenty-four (92%) of these had a documented swallowing dysfunction on VFSE. Eighty-eight percent suffered from pharyngeal dysfunction."
    explanation: Dysphagia is common and mostly pharyngeal in a mixed DLB and PDD cohort.
  - reference: PMID:19257916
    reference_title: "Characteristics of eating and swallowing problems in patients who have dementia with Lewy bodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'DLB patients showed significantly higher scores than AD patients for "difficulty in swallowing foods," "difficulty in swallowing liquids," "coughing or choking when swallowing,"'
    explanation: Swallowing problems are more frequent than in AD.
  phenotype_term:
    preferred_term: Dysphagia
    term:
      id: HP:0002015
      label: Dysphagia
  sequelae:
  - target: Aspiration Pneumonia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24099488
      reference_title: "Dysphagia in Lewy body dementia - a clinical observational study of swallowing function by videofluoroscopic examination."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "During follow-up, 12 of the 26 patients with reported dysphagia had died, and at least 9 of them died from pneumonia, probably aspiration pneumonia."
      explanation: Patients with dysphagia died mostly of probable aspiration pneumonia.
- category: Respiratory
  name: Aspiration Pneumonia
  frequency: FREQUENT
  notes: >-
    Late. Pneumonia or aspiration is the second most common cause of death
    after failure to thrive.
  evidence:
  - reference: PMID:36226332
    reference_title: "Survival and causes of death among people with clinically diagnosed dementia with Lewy bodies: A multicenter cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Failure to thrive (stopped eating, drinking) or multiple organ dysfunction syndrome (MODS) maybe the most common cause of death (41.7%), followed by pneumonia or aspiration (29.2%)."
    explanation: Pneumonia or aspiration causes about a third of deaths.
  - reference: PMID:30291740
    reference_title: "Cause of Death and End-of-Life Experiences in Individuals with Dementia with Lewy Bodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Failure to thrive was the most common cause of death (65%), followed by pneumonia and swallowing difficulties (23%), other medical conditions (19%), and complications from falling (10%) (multiple causes allowed)."
    explanation: Pneumonia and swallowing difficulties follow failure to thrive as causes of death.
  - reference: PMID:26510708
    reference_title: "Influence of pneumonia complications on the prognosis of patients with autopsy-confirmed Alzheimer's disease, dementia with Lewy bodies, and vascular dementia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pneumonia complication was observed with high incidence in each subtype of dementia, especially in DLB (90.5%)."
    explanation: Pneumonia complicates most autopsy-confirmed DLB.
  phenotype_term:
    preferred_term: Aspiration pneumonia
    term:
      id: HP:0011951
      label: Aspiration pneumonia
progression:
- phase: Prodromal (isolated RBD, hyposmia, autonomic and psychiatric symptoms)
  duration: Years to decades before dementia
  notes: >-
    RBD, hyposmia, constipation, orthostatic intolerance, urinary symptoms,
    late-onset depression or anxiety, and subtle motor slowing appear before
    cognitive impairment. Isolated RBD converts to an overt synucleinopathy at
    about 6% a year, and a large share of converters develop dementia first.
    In the pathograph these features hang from the peripheral autonomic and
    lower brainstem, olfactory bulb and pontine REM-atonia nodes. Delirium-onset
    and psychiatric-onset prodromal presentations are also described.
  evidence:
  - reference: PMID:30789229
    reference_title: "Risk and predictors of dementia and parkinsonism in idiopathic REM sleep behaviour disorder: a multicentre study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall conversion rate from iRBD to an overt neurodegenerative syndrome was 6.3% per year, with 73.5% converting after 12-year follow-up."
    explanation: Conversion rate from isolated RBD in 1,280 patients.
  - reference: PMID:30789229
    reference_title: "Risk and predictors of dementia and parkinsonism in idiopathic REM sleep behaviour disorder: a multicentre study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With regards to disease classifications, 199 (56.5%) developed parkinsonism as the first disease manifestation [of whom 16 (4.5%) were diagnosed with probable MSA], and 153 (43.5%) developed dementia first."
    explanation: 43.5% of converters developed dementia first, the DLB-type route.
  - reference: PMID:24587002
    reference_title: "Neurodegenerative disorder risk in idiopathic REM sleep behavior disorder: study in 174 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Emerging diagnoses (37.4%) were dementia with Lewy bodies (DLB) in 29 subjects, Parkinson disease (PD) in 22, multiple system atrophy (MSA) in two, and mild cognitive impairment (MCI) in 12."
    explanation: DLB was the most frequent outcome of isolated RBD in the Barcelona cohort.
  - reference: PMID:23909972
    reference_title: "Dementia with Lewy bodies: early diagnostic challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LB-related symptoms were present in 79 of 90 patients (87.8%) with probable DLB before or at the time of memory loss onset. These symptoms preceded the onset of memory loss between 1.2 and 9.3 years."
    explanation: Lewy-body-related symptoms precede memory loss by 1.2 to 9.3 years in most patients.
  - reference: PMID:32241955
    reference_title: "Research criteria for the diagnosis of prodromal dementia with Lewy bodies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Based on such observations, 3 prototypic prodromal DLB syndromes have been proposed13 as (1) mild cognitive impairment (MCI), (2) delirium-onset, or (3) psychiatric-onset."
    explanation: Names the three prodromal presentations.
  - reference: PMID:23722989
    reference_title: "History of a suspected delirium is more common in dementia with Lewy bodies than Alzheimer's disease: a retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, 25% of DLB cases had at least one reported episode of suspected delirium as compared to 7% of AD cases (p = 0.001)."
    explanation: Suspected delirium before diagnosis supports a delirium-onset presentation.
- phase: Mild cognitive impairment with Lewy bodies (MCI-LB)
  duration: Cognitive decline begins up to about 10 years before phenoconversion
  notes: >-
    Non-amnestic or multidomain MCI with attention, executive and visuospatial
    deficits, relatively spared recognition memory, and partial or milder core
    features (smaller fluctuations, passage and presence phenomena before
    well-formed hallucinations, subtle parkinsonism, daytime sleepiness). In the
    pathograph this phase corresponds to the basal forebrain cholinergic and
    early cortical cholinergic nodes.
  evidence:
  - reference: PMID:24212390
    reference_title: "Nonamnestic mild cognitive impairment progresses to dementia with Lewy bodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among nonamnestic MCI, progression rate to probable DLB was 20 events per 100 person-years and to probable AD was 1.6 per 100 person-years."
    explanation: Non-amnestic MCI progresses to DLB at a high rate.
  - reference: PMID:37096339
    reference_title: "Research diagnostic criteria for mild cognitive impairment with Lewy bodies: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The four core clinical features were more common in MCI-LB than MCI-AD/stable MCI. Neuropsychiatric and autonomic features were also more common in MCI-LB."
    explanation: Core, neuropsychiatric and autonomic features are already more common at the MCI-LB stage.
  - reference: PMID:37461299
    reference_title: "Prodromal dementia with Lewy bodies in REM sleep behavior disorder: A multicenter study."
    supports: SUPPORT
    snippet: "Cognitive decline in iRBD begins up to 10 years prior to phenoconversion. Attention and executive dysfunction are the strongest predictors of dementia in iRBD."
    explanation: Gives the duration of the cognitive prodrome.
- phase: Established dementia with core features
  notes: >-
    Fluctuations, visual hallucinations, RBD and parkinsonism accumulate on top
    of the attention-visuospatial dementia. At first presentation only a
    minority of autopsy-confirmed cases have hallucinations or parkinsonism.
    Time to a recognisable DLB syndrome is shorter in men, with RBD, and
    without neocortical tangles; with neocortical tangles the syndrome may
    take more than six years to emerge or never be recognised. In the
    pathograph this phase corresponds to the nigrostriatal, limbic and
    occipital-parietal nodes.
  evidence:
  - reference: PMID:16401618
    reference_title: "What best differentiates Lewy body from Alzheimer's disease in early-stage dementia?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, only a minority of DLB cases had either VH (22%), EPS (26%) or both (13%). In contrast, although not a core feature, visuospatial/constructional impairment was observed in most of the DLB cases (74%)."
    explanation: Hallucinations and parkinsonism are minority findings at first presentation.
  - reference: PMID:34761850
    reference_title: "The temporal onset of the core features in dementia with Lewy bodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An earlier latency to probable DLB was associated with men, RBD, and Lewy body disease without neocortical tangles."
    explanation: Factors that bring the full syndrome forward.
  - reference: PMID:32561678
    reference_title: "Subtypes of dementia with Lewy bodies are associated with α-synuclein and tau distribution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In TLBD and DLBD without neocortical tangles, diagnostic sensitivity was strong for probable DLB (87% TLBD, 96% DLBD) and the DLB syndrome (97% TLBD, 98% DLBD) with median latencies <1 year from cognitive onset, and worse baseline attention-visual processing but better memory-naming scores than AD."
    explanation: Without neocortical tangles the full syndrome is recognisable within a year of cognitive onset.
- phase: Advanced disease
  duration: Median survival about 4 years from diagnosis
  notes: >-
    Worsening parkinsonism with falls, dysphagia and aspiration, and earlier
    admission to residential care than in AD. Failure to thrive and pneumonia
    are the leading causes of death. In the pathograph these features are
    reached through the phenotype sequelae from parkinsonism, postural
    instability and dysphagia.
  evidence:
  - reference: PMID:30625375
    reference_title: "Survival time and differences between dementia with Lewy bodies and Alzheimer's disease following diagnosis: A meta-analysis of longitudinal studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Average survival time in DLB from diagnosis was 4.11 years (SD ± 4.10) and in AD 5.66 (SD ± 5.32) years, equating to a 1.60 (95% CI: -2.44 to -0.77) years shorter survival in DLB (p < 0.01)."
    explanation: Survival after diagnosis.
  - reference: PMID:23943275
    reference_title: "Time until nursing home admission in people with mild dementia: comparison of dementia with Lewy bodies and Alzheimer's dementia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In DLB median time until NHA was 663 days ... ) as compared with 1336 days (1068, 1606) in AD, p < 0.0005."
    explanation: Residential care comes about two years earlier than in AD.
  - reference: PMID:36226332
    reference_title: "Survival and causes of death among people with clinically diagnosed dementia with Lewy bodies: A multicenter cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Failure to thrive (stopped eating, drinking) or multiple organ dysfunction syndrome (MODS) maybe the most common cause of death (41.7%), followed by pneumonia or aspiration (29.2%)."
    explanation: Causes of death in late disease.
genetic:
- name: APOE
  gene_term:
    preferred_term: APOE
    term:
      id: hgnc:613
      label: APOE
  relationship_type: SUSCEPTIBILITY
  association: APOE ε4 allele is a major genetic risk factor for DLB
  notes: The APOE ε4 allele increases risk for DLB and is associated with more pronounced cortical Lewy pathology and higher prevalence of concomitant Alzheimer pathology. APOE represents a shared genetic risk factor between DLB and Alzheimer's disease.
  evidence:
  - reference: PMID:30097731
    reference_title: "The Genetics of Dementia with Lewy Bodies: Current Understanding and Future Directions."
    supports: SUPPORT
    snippet: "DLB shares risk loci with AD, in the APOE E4 allele, and with PD, in variation at GBA and SNCA."
    explanation: This confirms that the APOE ε4 allele is a shared genetic risk locus between DLB and Alzheimer's disease.
  - reference: PMID:29222591
    reference_title: "Dementia with Lewy bodies and Parkinson's disease-dementia: current concepts and controversies."
    supports: SUPPORT
    snippet: "Intravitam PET and post-mortem studies revealed more pronounced cortical atrophy, elevated cortical and limbic Lewy pathologies (with APOE ε4)."
    explanation: This demonstrates that APOE ε4 is associated with more pronounced Lewy pathology in DLB.
- name: GBA
  gene_term:
    preferred_term: GBA1
    term:
      id: hgnc:4177
      label: GBA
  relationship_type: SUSCEPTIBILITY
  association: GBA gene variants significantly increase risk for DLB
  notes: Variants in the glucocerebrosidase (GBA) gene are important genetic risk factors for DLB. GBA mutation carriers have earlier age of onset, more severe cognitive impairment, and more rapid symptom progression. Specific variants including N370S, E326K, and L444P are strongly associated with DLB.
  evidence:
  - reference: PMID:35332438
    reference_title: "Effect of GBA gene variants on clinical characteristics of dementia with Lewy bodies: a review and meta-analyses."
    supports: SUPPORT
    snippet: "GBA variants increased the risk of DLB, especially N370S, E326K, and L444P which are strongly associated with DLB, but T369M was not. Patients harbouring GBA variants have an earlier age of onset, more severe cognitive impairment, and rapid symptom progression."
    explanation: This meta-analysis confirms that specific GBA variants are strongly associated with DLB and correlate with earlier onset and more severe clinical presentation.
  - reference: PMID:28734699
    reference_title: "An update on the genetics of dementia with Lewy bodies."
    supports: SUPPORT
    snippet: "More recently, association and exome sequencing studies in larger groups have been conducted, and have shown that several variants in GBA and the APOE ε4 allele are important genetic risk factors for DLB."
    explanation: This review confirms that GBA variants are important genetic risk factors for dementia with Lewy bodies.
  - reference: PMID:30097731
    reference_title: "The Genetics of Dementia with Lewy Bodies: Current Understanding and Future Directions."
    supports: SUPPORT
    snippet: "DLB shares risk loci with AD, in the APOE E4 allele, and with PD, in variation at GBA and SNCA."
    explanation: This confirms that GBA represents a shared genetic risk locus between DLB and Parkinson's disease.
- name: SNCA
  gene_term:
    preferred_term: SNCA
    term:
      id: hgnc:11138
      label: SNCA
  relationship_type: SUSCEPTIBILITY
  association: SNCA gene variants associated with DLB risk
  notes: The SNCA gene encoding alpha-synuclein shows genetic association with DLB, representing a shared genetic risk factor with Parkinson's disease. Variation at SNCA influences risk for developing Lewy body pathology.
  evidence:
  - reference: PMID:30097731
    reference_title: "The Genetics of Dementia with Lewy Bodies: Current Understanding and Future Directions."
    supports: SUPPORT
    snippet: "DLB shares risk loci with AD, in the APOE E4 allele, and with PD, in variation at GBA and SNCA."
    explanation: This confirms that SNCA represents a shared genetic risk locus between DLB and Parkinson's disease.
environmental:
- name: Caffeine Consumption
  exposure_term:
    preferred_term: exposure to caffeine
    term:
      id: ECTO:9000205
      label: exposure to caffeine
  influences_mechanisms:
  - target: Alpha-Synuclein Aggregation and Lewy Body Formation
    environmental_effect: PROTECTS_AGAINST
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cases were markedly less likely than matched controls to use caffeine,
      with the strongest inverse association reported for any exposure in this
      disease. Pointed at the defining Lewy body pathology with intermediates
      unknown, because the study is a retrospective case-control risk-factor
      analysis and measures no mechanistic endpoint. The effect size is larger
      than the corresponding caffeine association in Parkinson disease, and
      reverse causation is a stronger objection here than there: caffeine intake
      falls in the prodromal period, and exposure was ascertained from records
      and informants after diagnosis.
    evidence:
    - reference: PMID:23892702
      reference_title: "Risk factors for dementia with Lewy bodies: a case-control study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "but less likely to have had cancer (0.44; 0.27-0.70; p = 0.0006) or use caffeine (0.29; 0.14-0.57; p < 0.0001)"
      explanation: >-
        The caffeine odds ratio, quoted with the cancer result that precedes it
        in the same clause because the two cannot be separated without breaking
        the sentence. Case-control study of 147 patients against two matched
        controls each.
  notes: >-
    This disease's exposure profile is not that of Parkinson disease and not
    that of Alzheimer disease, which is the finding the study itself reports.
    Low caffeine intake and depression raise risk here more strongly than in
    either, while smoking and education, which act in opposite directions in
    the other two diseases, do nothing. The non-exposure risk factors the same
    study reports, including anxiety, depression, stroke, family history of
    Parkinson disease and APOE genotype, are not environmental exposures and
    are not curated in this section.
  evidence:
  - reference: PMID:23892702
    reference_title: "Risk factors for dementia with Lewy bodies: a case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CONCLUSION: DLB risk factors are an amalgam of those for AD and PD."
    explanation: >-
      The study's own summary, quoted because it is the reason this section
      exists separately rather than inheriting the Parkinson disease exposures.
- name: Cigarette Smoking
  exposure_term:
    preferred_term: exposure to cigarette smoking
    term:
      id: ECTO:0100003
      label: exposure to cigarette smoking
  notes: >-
    Left without a mechanism link because the finding is null. Smoking is not a
    risk factor for this disease, which is a genuine negative result rather than
    an absence of study: the same analysis found smoking null here while it is
    inversely associated with Parkinson disease and positively associated with
    Alzheimer disease, and the authors single it out for that reason. It is
    curated as content so the entry distinguishes an exposure examined and found
    null from one never examined, and so that the protective smoking association
    curated on the Parkinson disease entry is not read as applying across the
    synucleinopathies. The direction reverses again in isolated REM sleep
    behaviour disorder, where smoking is a risk factor.
  evidence:
  - reference: PMID:23892702
    reference_title: "Risk factors for dementia with Lewy bodies: a case-control study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Smoking and education, which have opposing risk effects on AD and PD, are not risk factors for DLB"
    explanation: >-
      The null result for smoking, stated by the authors alongside the
      observation that it acts in opposite directions in the two diseases this
      one is most often compared with. Graded REFUTE against the claim that
      smoking is a risk factor for this disease, and equally against the claim
      that it is protective.
diagnosis:
- name: Montreal Cognitive Assessment
  description: >-
    Brief cognitive screening instrument. In a Taiwanese cohort it separated
    dementia with Lewy bodies from participants without dementia with higher
    sensitivity than the MMSE. Its value as a severity outcome in this disease is
    weaker: in a chart review of Alzheimer's disease and DLB patients it showed
    greater stage-wide impairment in Alzheimer's disease than in DLB, which the
    authors read as a lack of sensitivity as a trial outcome for DLB.
  notes: >-
    Copyright © Tina Brosseau for Center for Diagnosis & Research on Alzheimer's disease (CEDRA). Used with permission.
    The instrument is bound at its LOINC panel code and the cut-off at its
    total-score code. The instrument's items are not reproduced in this entry;
    only published thresholds are recorded.
  measurements:
  - preferred_term: MoCA
    term:
      id: LOINC:72133-2
      label: Montreal Cognitive Assessment [MoCA]
  reference_ranges:
  - loinc_term:
      id: LOINC:72172-0
      label: Total score [MoCA]
    unit: '{score}'
    population: >-
      Taiwanese cohort of 36 patients with mild-to-moderate dementia with Lewy
      bodies, 67 with Alzheimer's disease and 62 healthy participants without
      dementia, aged 60 to 90 (DLB versus controls)
    notes: >-
      The abstract states "the cut-off point for DLB was 22/23"; the bands read
      the x/y notation as 22 or below positive and 23 or above negative, which
      the abstract does not spell out. The cut-off is from a single cohort and
      differs from the 21/22 the same study reports for Alzheimer's disease.
    evidence:
    - reference: PMID:23919950
      reference_title: "Montreal Cognitive Assessment and Mini-Mental State Examination performance in patients with mild-to-moderate dementia with Lewy bodies, Alzheimer's disease, and normal participants in Taiwan."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "the cut-off point for DLB was 22/23 with a sensitivity of 91.7% and a specificity of 80.6% (AUC: 0.932)"
      explanation: States the MoCA cut-off separating dementia with Lewy bodies from controls in this cohort.
    interpretation_bands:
    - name: At or below 22 (screen positive for DLB)
      upper_bound: 23
      unit: '{score}'
      abnormal_flag: LOW
    - name: 23 or above
      lower_bound: 23
      unit: '{score}'
      abnormal_flag: NORMAL
  evidence:
  - reference: PMID:23919950
    reference_title: "Montreal Cognitive Assessment and Mini-Mental State Examination performance in patients with mild-to-moderate dementia with Lewy bodies, Alzheimer's disease, and normal participants in Taiwan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The MoCA is a more sensitive instrument than the MMSE to screen AD or DLB patients from non-dementia cases."
    explanation: Supports the MoCA as a screening instrument for dementia with Lewy bodies.
  - reference: PMID:40971142
    reference_title: "Testing the Clinical Dementia Rating Sum of Boxes as an Outcome for Dementia with Lewy Bodies Clinical Trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The Montreal Cognitive Assessment showed greater stage-wide impairment in AD than in DLB patients, suggesting lack of sensitivity as an outcome measure for DLB clinical trials."
    explanation: Records the limitation of the MoCA as a severity outcome in dementia with Lewy bodies.
- name: Mini-Mental State Examination
  description: >-
    Widely used cognitive screening instrument. In the same Taiwanese cohort the
    MMSE separated dementia with Lewy bodies from participants without dementia
    at the same cut-off as Alzheimer's disease, with lower sensitivity for DLB
    than the MoCA.
  notes: >-
    Copyright © Vicki King for Psychological Assessment Resources. Used with permission.
    The instrument is bound at its LOINC panel code and the cut-off at its
    total-score code. The instrument's items are not reproduced in this entry;

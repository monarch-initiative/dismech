name: Dementia with Lewy Bodies
creation_date: '2025-12-24T16:57:05Z'
description: >
  Dementia with Lewy Bodies (DLB) is a progressive neurodegenerative disorder
  characterized by cognitive decline, visual hallucinations, parkinsonism, and
  fluctuating cognition. It is pathologically defined by the presence of Lewy
  bodies containing aggregated alpha-synuclein protein in the brain. DLB is the
  second most common cause of neurodegenerative dementia after Alzheimer's disease.
category: Complex
notes: "Synonyms are MONDO:0007488's oboInOwl:hasExactSynonym set, read from OLS, with one omission. MONDO also files \"lewy body dementia, susceptibility to\" as an exact synonym; it is an OMIM title form naming a susceptibility concept rather than the disease, so it is left out here. MONDO's one hasRelatedSynonym, \"dementia, Lewy body\", is likewise omitted as not exact."
synonyms:
- dementia with Lewy bodies
- Lewy body dementia
- DLB
- Lewy body disease
- cortical Lewy body disease
disease_term:
  preferred_term: Lewy body dementia
  term:
    id: MONDO:0007488
    label: Lewy body dementia
parents:
- Dementia
- Neurodegenerative Disease
- Synucleinopathy
mechanistic_hypotheses:
- hypothesis_group_id: body_first_caudo_rostral_spread
  hypothesis_label: Body-first caudo-rostral Lewy pathology spread
  status: CANONICAL
  description: >-
    Lewy pathology begins in the peripheral autonomic nervous system and lower
    brainstem and ascends through the pontine tegmentum and midbrain to limbic
    and neocortical regions. This ordering places autonomic failure, RBD and
    constipation years before cognitive and motor onset. The caudo-rostral
    sequence fits most Lewy body disease autopsy cases, but the body-first and
    brain-first subtype model was built mainly in Lewy body disease in general,
    and its application to DLB specifically is not settled.
  evidence:
  - reference: PMID:20187227
    reference_title: "Evidence in favor of Braak staging of Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proportion of cases that fit the PD staging scheme was 67% for incidental LBs; 86% for PSP with LBs; 86% for pure LBD; and 84% for LBD with AD"
    explanation: >-
      The caudo-rostral Braak ordering fits 86% of pure Lewy body disease and
      84% of Lewy body disease with AD in a large autopsy series.
  - reference: PMID:36450732
    reference_title: "A postmortem study suggests a revision of the dual-hit hypothesis of Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that cases with α-synuclein pathology restricted to the peripheral autonomic nervous system and/or lower brainstem (early body-first LBD cases) very rarely had any OB pathology, suggesting that Lewy pathology commonly arises in the ENS without concomitant involvement of the OB."
    explanation: >-
      Early body-first cases carry pathology only in the peripheral autonomic
      nervous system and lower brainstem, the entry point of this hypothesis.
- hypothesis_group_id: brain_first_amygdala_centred_spread
  hypothesis_label: Brain-first amygdala-centred Lewy pathology spread
  status: ALTERNATIVE
  description: >-
    Lewy pathology begins in the olfactory bulb or amygdala and spreads through
    limbic connections before reaching the brainstem and peripheral autonomic
    nervous system, so that autonomic and sleep features appear late or not at
    all. Whether a DLB patient follows this or the body-first route is not
    determined by any validated clinical test.
  evidence:
  - reference: PMID:36450732
    reference_title: "A postmortem study suggests a revision of the dual-hit hypothesis of Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, cases with mild amygdala-predominant Lewy pathology (early brain-first LBD cases) nearly always showed OB pathology."
    explanation: >-
      Early amygdala-predominant cases nearly always carry olfactory bulb
      pathology, supporting a central olfactory-limbic origin for this subtype.
  - reference: PMID:34763110
    reference_title: "Neuropathological evidence of body-first vs. brain-first Lewy body disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'and an amygdala-centered pattern with the most abundant pathology in the "center of the brain", including the amygdala, entorhinal cortex, and substantia nigra, and relatively less pathology in the lower brainstem and spinal autonomic nuclei.'
    explanation: >-
      Post-mortem clustering identifies an amygdala-centred pattern with
      relatively spared lower brainstem and autonomic nuclei.
  - reference: PMID:42463844
    reference_title: "Brain-first and body-first subtypes of Lewy body disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "First, some individuals develop autonomic dysfunction and sleep disorders years before diagnosis, whereas other individuals experience these symptoms only after diagnosis."
    explanation: >-
      The two subtypes differ in when autonomic and sleep features appear,
      which is the clinical prediction that separates the two spread routes.
- hypothesis_group_id: cholinergic_fluctuation_hypothesis
  hypothesis_label: Cholinergic and thalamocortical basis of cognitive fluctuations
  status: EMERGING
  description: >-
    Fluctuating cognition and alertness are proposed to arise from cortical and
    thalamic cholinergic imbalance acting on thalamocortical arousal networks.
    Posterior EEG slowing and dominant-frequency variability track fluctuation
    severity, but cortical ChAT activity and regional Lewy body density do not
    differ between patients with and without fluctuations, so the cholinergic
    link is unproven.
  evidence:
  - reference: PMID:25260701
    reference_title: "Thalamic Involvement in Fluctuating Cognition in Dementia with Lewy Bodies: Magnetic Resonance Evidences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "tCho/tCr increase was found within right thalamus of DLB patients as compared with AD. This increase correlated with severity and frequency of flCog."
    explanation: >-
      A thalamic choline-signal increase tracks fluctuation severity. The tCho
      signal reflects membrane turnover rather than cholinergic transmission
      directly, so this supports thalamic involvement more than a cholinergic
      mechanism.
  - reference: PMID:12435378
    reference_title: "Disturbances of consciousness in dementia with Lewy bodies associated with alteration in nicotinic receptor binding in the temporal cortex."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The were no differences between DLB patients with or without DOC in 125I-labeled alpha-bungaratoxin binding to the low-affinity nicotinic receptor, ... pirenzepine binding to the muscarinic M1 receptor, or in choline acetyltransferase activity."
    explanation: >-
      Cortical ChAT activity does not separate DLB patients with and without
      disturbed consciousness, which argues against a simple cortical
      cholinergic-deficit account of fluctuations.
pathophysiology:
- name: Autophagy-Lysosome Dysfunction
  conforms_to: "disabled_macroautophagy#Failure of Cytoplasmic Quality Control"
  biological_scale: CELLULAR
  role: upstream susceptibility mechanism
  description: >
    Impaired autophagy and lysosomal functions are central to DLB pathogenesis.
    Neurons are particularly vulnerable to autophagy-lysosomal defects due to their
    postmitotic nature and polarized morphologies. Mutations in genes regulating
    autophagy and lysosomal functions, particularly GBA, contribute to impaired
    clearance of alpha-synuclein aggregates and damaged organelles. This dysfunction
    creates a vicious cycle where accumulating protein aggregates further impair
    the autophagic-lysosomal system.
  biological_processes:
  - preferred_term: autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: DECREASED
  molecular_functions:
  - preferred_term: glucocerebrosidase (GCase) activity
    term:
      id: GO:0004348
      label: glucosylceramidase activity
    modifier: DECREASED
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  genes:
  - preferred_term: GBA1
    term:
      id: hgnc:4177
      label: GBA
  downstream:
  - target: Alpha-Synuclein Aggregation and Lewy Body Formation
  evidence:
  - reference: PMID:39107446
    reference_title: "Mechanisms of autophagy-lysosome dysfunction in neurodegenerative diseases."
    supports: SUPPORT
    snippet: "Autophagy is a lysosome-based degradative process used to recycle obsolete cellular constituents and eliminate damaged organelles and aggregate-prone proteins. Their postmitotic nature and extremely polarized morphologies make neurons particularly vulnerable to disruptions caused by autophagy-lysosomal defects, especially as the brain ages."
    explanation: This establishes that autophagy-lysosome dysfunction is a fundamental mechanism in neurodegenerative diseases including Parkinson disease and related Lewy body disorders.
  - reference: PMID:40598239
    reference_title: "Current strategies in the management of dementia with lewy bodies and future directions based on disease pathophysiology."
    supports: SUPPORT
    snippet: "In particular, we highlight antibody-based therapies to attenuate protein aggregation, compounds that enhance the generation of cellular energy and autophagy-enhancing agents as particular areas of promise."
    explanation: This confirms that autophagy dysfunction is a key therapeutic target in DLB, with autophagy-enhancing agents being developed as potential disease-modifying therapies.
  - reference: PMID:30097731
    reference_title: "The Genetics of Dementia with Lewy Bodies: Current Understanding and Future Directions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mutations in GBA reduce activity of its lysosomal enzyme, β-glucocerebrosidase (Gcase)"
    explanation: >-
      Supports the decreased glucosylceramidase activity bound on this node: GBA
      variants lower the activity of the lysosomal enzyme they encode. The same
      review notes that most GCase measurements come from Parkinson disease, with
      one small study reporting reduced GCase in DLB CSF.
- name: Alpha-Synuclein Aggregation and Lewy Body Formation
  conforms_to: "parkinsonism_dopaminergic_degeneration#Alpha-Synuclein Aggregation and Lewy Pathology"
  biological_scale: MOLECULAR
  role: central effector
  description: >
    DLB is characterized morphologically by widespread cortical and subcortical
    alpha-synuclein aggregation forming Lewy bodies and Lewy neurites. The
    aggregation process runs for years before the full clinical syndrome, and
    the regions it reaches first determine which features appear first. In this
    pathograph the aggregation hub feeds the anatomical spread stages
    (peripheral autonomic and lower brainstem, olfactory bulb, then midbrain and
    basal forebrain, then limbic and neocortical), each of which carries the
    phenotypes of its phase.
  biological_processes:
  - preferred_term: inclusion body assembly
    term:
      id: GO:0070841
      label: inclusion body assembly
    modifier: INCREASED
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Peripheral Autonomic and Lower Brainstem Lewy Pathology
    causal_link_type: DIRECT
    hypothesis_groups:
    - body_first_caudo_rostral_spread
    description: >-
      In the body-first route the first aggregates appear in peripheral
      autonomic neurons and lower brainstem nuclei.
    evidence:
    - reference: PMID:20306269
      reference_title: "Multi-organ distribution of phosphorylated alpha-synuclein histopathology in subjects with Lewy body disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Spinal cord and peripheral PASH was most common in subjects with PD and DLB, where it appears likely that it is universally widespread."
      explanation: Peripheral and spinal phosphorylated alpha-synuclein is near-universal in DLB at autopsy.
  - target: Olfactory Bulb Lewy Pathology
    causal_link_type: DIRECT
    hypothesis_groups:
    - brain_first_amygdala_centred_spread
    description: >-
      The olfactory bulb is the most frequent single site of Lewy pathology and
      the earliest stage in the unified staging scheme.
    evidence:
    - reference: PMID:19399512
      reference_title: "Unified staging system for Lewy body disorders: correlation with nigrostriatal degeneration, cognitive impairment and motor dysfunction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "As the olfactory bulb is the most frequently involved brain region, and the most frequent region to be solely involved, Stage I is defined as cases with pathology only in the olfactory bulb."
      explanation: Olfactory bulb involvement defines the earliest stage of Lewy body disease.
  - target: Basal Forebrain Cholinergic Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Lewy body diseases degenerate the basal forebrain cholinergic neurons
      themselves. Loss is early in DLB and starts in the posterior cell groups.
    evidence:
    - reference: PMID:8347330
      reference_title: "Cholinergic transmitter and neurotrophic activities in Lewy body dementia: similarity to Parkinson's and distinction from Alzheimer disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These observations indicate that although AD is primarily associated with dysfunction of cholinergic axonal input to the cortex, LBD and PD are more likely to involve degeneration of the basal forebrain cholinergic system."
      explanation: Autopsy evidence that Lewy body dementia degenerates the basal forebrain cholinergic neurons rather than only their cortical axons.
  - target: Concomitant Alzheimer Disease Co-Pathology
    causal_link_type: UNKNOWN
    description: >-
      Lewy and Alzheimer pathologies co-occur and interact. Higher AD
      neuropathology goes with higher cerebral alpha-synuclein scores; the
      direction of causation between the two is not established.
    evidence:
    - reference: PMID:27979356
      reference_title: "Neuropathological and genetic correlates of survival and dementia onset in synucleinopathies: a retrospective analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "As levels of Alzheimer's disease neuropathology increased, cerebral α-synuclein scores were higher, and the interval between onset of motor and dementia symptoms and disease duration was shorter (p<0·0001 for all comparisons)."
      explanation: >-
        Alpha-synuclein and AD pathology rise together in a mixed PD, PDD and
        DLB autopsy cohort. The association is cross-sectional, so the edge is
        typed UNKNOWN.
  evidence:
  - reference: PMID:29222591
    reference_title: "Dementia with Lewy bodies and Parkinson's disease-dementia: current concepts and controversies."
    supports: SUPPORT
    snippet: "Both are characterized morphologically by widespread cortical and subcortical α-synuclein/Lewy body plus β-amyloid and tau pathologies."
    explanation: This confirms that alpha-synuclein aggregation forming Lewy bodies is the central pathological feature of DLB, distributed throughout cortical and subcortical regions.
  - reference: PMID:32241955
    reference_title: "Research criteria for the diagnosis of prodromal dementia with Lewy bodies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "There is a variable progression of α-synuclein aggregation many years before the full DLB syndrome develops,e1 which likely determines the pattern of early clinical changes."
    explanation: >-
      Aggregation precedes the full syndrome by years and its distribution sets
      the early clinical picture, which is why the pathograph routes phenotypes
      through anatomical spread stages.
- name: Peripheral Autonomic and Lower Brainstem Lewy Pathology
  biological_scale: TISSUE
  role: prodromal-stage lesion
  description: >-
    Phosphorylated alpha-synuclein in the spinal cord, paraspinal sympathetic
    ganglia, vagus nerve, gastrointestinal tract and lower brainstem. In the
    body-first route this is the earliest stage, and it underlies the autonomic
    features (constipation, orthostatic intolerance, urinary symptoms) that 25%
    to 50% of DLB patients already report at first clinic attendance.
  cell_types:
  - preferred_term: sympathetic neuron
    term:
      id: CL:0011103
      label: sympathetic neuron
  - preferred_term: enteric neuron
    term:
      id: CL:0007011
      label: enteric neuron
  locations:
  - preferred_term: enteric nervous system
    term:
      id: UBERON:0002005
      label: enteric nervous system
  - preferred_term: vagus nerve
    term:
      id: UBERON:0001759
      label: vagus nerve
  - preferred_term: dorsal motor nucleus of vagus nerve
    term:
      id: UBERON:0002870
      label: dorsal motor nucleus of vagus nerve
  biological_processes:
  - preferred_term: inclusion body assembly
    term:
      id: GO:0070841
      label: inclusion body assembly
    modifier: INCREASED
  downstream:
  - target: Cardiac Sympathetic Noradrenergic Denervation
    causal_link_type: DIRECT
    description: >-
      Lewy pathology in postganglionic sympathetic axons leads to their
      distal-first degeneration in the heart.
    evidence:
    - reference: PMID:15933869
      reference_title: "Cardiac sympathetic denervation precedes neuronal loss in the sympathetic ganglia in Lewy body disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "TH-immunoreactive nerve fibers in the hearts had almost entirely disappeared in nearly all the patients with PD, DLB and DLB/AD, whereas they were well preserved in all the patients with PSP and pure AD as well as in all except for one patient with MSA."
      explanation: Cardiac sympathetic fibres are lost in DLB but preserved in AD and PSP at autopsy.
  - target: Constipation
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - body_first_caudo_rostral_spread
    description: >-
      Enteric and vagal Lewy pathology is the proposed substrate of early
      constipation. The lesions are documented in DLB, but no DLB study relates
      lesion burden to constipation, and immobility and anticholinergic
      medication are competing causes.
    evidence:
    - reference: PMID:20306269
      reference_title: "Multi-organ distribution of phosphorylated alpha-synuclein histopathology in subjects with Lewy body disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "The greatest densities and frequencies of PASH occurred in the spinal cord, followed by the paraspinal sympathetic ganglia, the vagus nerve, the gastrointestinal tract and endocrine organs."
      explanation: >-
        Documents the vagal and gastrointestinal lesion. The step from lesion to
        constipation is inferred, not measured.
  - target: Urinary Urgency and Incontinence
    causal_link_type: UNKNOWN
    description: >-
      Detrusor overactivity is nearly universal in DLB, but whether it comes
      from autonomic, pontine or frontal Lewy pathology has not been tested.
    evidence:
    - reference: PMID:18209204
      reference_title: "Lower urinary tract symptoms in dementia with Lewy bodies, Parkinson disease, and Alzheimer disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "detrusor overactivity in 92% of the patients with DLB"
      explanation: >-
        Establishes the urodynamic phenotype only. The lesion responsible is not
        identified, so the edge is typed UNKNOWN.
  - target: Pontine REM-Atonia Circuit Lewy Pathology
    causal_link_type: DIRECT
    hypothesis_groups:
    - body_first_caudo_rostral_spread
    description: >-
      Ascending from the medulla, Lewy pathology reaches the pontine tegmentum
      ahead of the substantia nigra and cortex.
    evidence:
    - reference: PMID:20187227
      reference_title: "Evidence in favor of Braak staging of Parkinson's disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "involvement of anterior olfactory nucleus, medulla, and pontine tegmentum occur earlier"
      explanation: Medullary and pontine tegmental involvement precedes nigral and cortical involvement in the autopsy sequence.
  evidence:
  - reference: PMID:20306269
    reference_title: "Multi-organ distribution of phosphorylated alpha-synuclein histopathology in subjects with Lewy body disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The greatest densities and frequencies of PASH occurred in the spinal cord, followed by the paraspinal sympathetic ganglia, the vagus nerve, the gastrointestinal tract and endocrine organs."
    explanation: Autopsy distribution of peripheral and spinal Lewy pathology in Lewy body disorders including DLB.
  - reference: PMID:32241955
    reference_title: "Research criteria for the diagnosis of prodromal dementia with Lewy bodies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients with DLB frequently report a history of autonomic dysfunction at first clinic attendance, with 25%–50% complaining of one of more among constipation, orthostatic dizziness, urinary incontinence, erectile dysfunction, increased sweating, or increased saliva."
    explanation: Autonomic features are already present at first presentation, placing this lesion stage early in the course.
- name: Cardiac Sympathetic Noradrenergic Denervation
  biological_scale: TISSUE
  role: prodromal-stage lesion
  description: >-
    Loss of postganglionic cardiac sympathetic axons, distal-first, ahead of
    neuronal loss in the sympathetic ganglia. It is measured as reduced cardiac
    123I-MIBG uptake, which is already reduced in mild DLB. Together with wider
    sympathetic failure it underlies orthostatic hypotension.
  cell_types:
  - preferred_term: postganglionic sympathetic noradrenergic neuron
    term:
      id: CL:3000002
      label: sympathetic noradrenergic neuron
    modifier: DECREASED
  locations:
  - preferred_term: cardiac nerve plexus
    term:
      id: UBERON:0002008
      label: cardiac nerve plexus
  downstream:
  - target: Orthostatic Hypotension
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - failure of baroreflex-mediated sympathetic vasoconstriction
    description: >-
      Sympathetic noradrenergic failure removes the vasoconstrictor response to
      standing. Cardiac denervation is the measurable marker of this wider
      sympathetic failure; orthostatic hypotension in DLB is intermediate in
      severity between Parkinson disease and multiple system atrophy.
    evidence:
    - reference: PMID:15159482
      reference_title: "Autonomic dysfunction in dementia with Lewy bodies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Autonomic dysfunction is frequent in dementia with Lewy bodies and the severity is intermediate between that of multiple system atrophy and Parkinson disease."
      explanation: Formal autonomic testing documents sympathetic failure in DLB.
  evidence:
  - reference: PMID:15933869
    reference_title: "Cardiac sympathetic denervation precedes neuronal loss in the sympathetic ganglia in Lewy body disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Decreased cardiac uptake of MIBG in Lewy body disease reflects actual cardiac sympathetic denervation, which precedes the neuronal loss in the sympathetic ganglia."
    explanation: >-
      Reduced MIBG uptake reflects real cardiac sympathetic denervation. The
      ganglion-sparing sequence was shown in Parkinson disease ganglia.
  - reference: PMID:25935891
    reference_title: "Quantitative correlation between cardiac MIBG uptake and remaining axons in the cardiac sympathetic nerve in Lewy body disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tight quantitative correlation between cardiac (123)I-MIBG uptake and corresponding loss of sympathetic axons in LBD, as established for the first time by this study"
    explanation: MIBG uptake tracks the number of surviving cardiac sympathetic axons in Lewy body disease.
  - reference: PMID:25793585
    reference_title: "Diagnostic accuracy of 123I-meta-iodobenzylguanidine myocardial scintigraphy in dementia with Lewy bodies: a multicenter study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a subpopulation of patients with mild dementia (MMSE ≥ 22, n = 47), the sensitivity and specificity were 77.4% and 93.8%, respectively, with the delayed heart-to-mediastinum ratio"
    explanation: MIBG is reduced, and most discriminating, at the mild-dementia stage, so denervation is an early lesion.
- name: Olfactory Bulb Lewy Pathology
  biological_scale: TISSUE
  role: prodromal-stage lesion
  description: >-
    Lewy-type alpha-synucleinopathy of the olfactory bulb, present in nearly all
    DLB cases at autopsy. It is the earliest stage of the unified staging scheme
    and the proposed entry point of the brain-first route, which continues into
    the amygdala and limbic lobe.
  locations:
  - preferred_term: olfactory bulb
    term:
      id: UBERON:0002264
      label: olfactory bulb
  biological_processes:
  - preferred_term: inclusion body assembly
    term:
      id: GO:0070841
      label: inclusion body assembly
    modifier: INCREASED
  - preferred_term: sensory perception of smell
    term:
      id: GO:0007608
      label: sensory perception of smell
    modifier: DECREASED
  downstream:
  - target: Hyposmia
    causal_link_type: DIRECT
    description: >-
      Olfactory bulb pathology impairs smell identification, which is more
      severe in DLB than in AD and appears earlier.
    evidence:
    - reference: PMID:32320406
      reference_title: "Severe hyposmia distinguishes neuropathologically confirmed dementia with Lewy bodies from Alzheimer's disease dementia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "The subjects with DLB, PDD+AD and PDD-AD all had lower (one-way ANOVA p < 0.0001, pairwise Bonferroni p < 0.05) first and mean UPSIT scores than the ADD, ADLB or control groups."
      explanation: >-
        In autopsy-confirmed cases, smell scores are lowest in the groups with
        the most olfactory Lewy pathology. The lesion-to-score link is inferred
        from the group comparison rather than measured per patient.
  - target: Limbic Lewy Pathology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - brain_first_amygdala_centred_spread
    description: >-
      In the brain-first route, pathology spreads from the olfactory bulb into
      the amygdala and connected limbic regions.
    evidence:
    - reference: PMID:36450732
      reference_title: "A postmortem study suggests a revision of the dual-hit hypothesis of Parkinson's disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In contrast, cases with mild amygdala-predominant Lewy pathology (early brain-first LBD cases) nearly always showed OB pathology."
      explanation: Amygdala-predominant early cases nearly always carry olfactory bulb pathology, linking the two stages.
  evidence:
  - reference: PMID:18982334
    reference_title: "Olfactory bulb alpha-synucleinopathy has high specificity and sensitivity for Lewy body disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "97 and 91% for DLB versus elderly control"
    explanation: Olfactory bulb synucleinopathy has 97% sensitivity and 91% specificity for DLB against elderly controls at autopsy.
  - reference: PMID:28592453
    reference_title: "Diagnosis and management of dementia with Lewy bodies: Fourth consensus report of the DLB Consortium."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "adds previously omitted categories of Lewy-related pathology including olfactory bulb only56 and amygdala predominant.57,58 Both of these are considered to be low-likelihood DLB but may in the future be useful in assessing prodromal disease."
    explanation: Olfactory bulb only and amygdala-predominant pathology are recognized as categories that may represent prodromal disease.

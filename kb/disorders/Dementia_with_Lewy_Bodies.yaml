    evidence:
    - reference: PMID:23919950
      reference_title: "Montreal Cognitive Assessment and Mini-Mental State Examination performance in patients with mild-to-moderate dementia with Lewy bodies, Alzheimer's disease, and normal participants in Taiwan."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "a sensitivity of 77.8% and a specificity of 85.5% for DLB (AUC: 0.895)"
      explanation: Reports the MMSE's accuracy for dementia with Lewy bodies at the 24/25 cut-off stated earlier in the same sentence.
    - reference: PMID:23919950
      reference_title: "Montreal Cognitive Assessment and Mini-Mental State Examination performance in patients with mild-to-moderate dementia with Lewy bodies, Alzheimer's disease, and normal participants in Taiwan."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "For the MMSE, the cut-off points for AD and for DLB from NC were all 24/25"
      explanation: States the MMSE cut-off separating dementia with Lewy bodies from controls.
    interpretation_bands:
    - name: At or below 24 (screen positive for DLB)
      upper_bound: 25
      unit: '{score}'
      abnormal_flag: LOW

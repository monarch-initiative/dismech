      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "In dementia with Lewy bodies (DLB) mild extrapyramidal symptoms are associated with moderate reductions in substantia nigra neuron density and concentration of striatal dopamine."

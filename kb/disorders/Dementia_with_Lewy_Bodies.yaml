    evidence_source: OTHER
    snippet: "Symptoms include hallucinations in visual and in other modalities and systematized delusions including Capgras syndrome,55 apathy, anxiety, and depression."
    explanation: Capgras syndrome is a feature of psychiatric-onset prodromal DLB.
  - reference: PMID:10401449
    reference_title: "Psychiatric morbidity in dementia with Lewy bodies: a prospective clinical and neuropathological comparative study with Alzheimer's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hallucinations, depression, delusions, and delusional misidentification were all significantly higher for patients with dementia with Lewy bodies."
    explanation: Delusional misidentification is more frequent in DLB than AD.

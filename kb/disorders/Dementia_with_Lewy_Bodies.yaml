    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data suggest that abnormal daytime sleepiness is a unique feature of DLB that does not depend on nighttime sleep fragmentation or the presence of the four cardinal DLB features."

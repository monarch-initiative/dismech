- name: Nigrostriatal Dopaminergic Degeneration
  conforms_to: "parkinsonism_dopaminergic_degeneration#Nigrostriatal Dopaminergic Neurodegeneration"
  biological_scale: CELLULAR
  role: mid-stage lesion
  description: >-
    Loss of substantia nigra pars compacta dopaminergic neurons (about half at
    autopsy) with loss of striatal dopamine and dopamine transporter sites. It
    can be minimal at presentation, when parkinsonism is absent and DAT imaging
    may be normal, and it accumulates over the course so that parkinsonism
    eventually occurs in more than 85% of patients.
  cell_types:
  - preferred_term: substantia nigra dopaminergic neuron
    term:
      id: CL:4042025
      label: substantia nigra dopaminergic neuron
    modifier: DECREASED
  locations:
  - preferred_term: substantia nigra pars compacta
    term:
      id: UBERON:0001965
      label: substantia nigra pars compacta
  downstream:
  - target: Striatal Dopamine Deficiency Without D2 Receptor Compensation
    causal_link_type: DIRECT
    description: >-
      Nigral neuron loss removes dopaminergic input to the putamen. Striatal DAT
      binding on imaging tracks nigral neuron density rather than Lewy, tau or
      amyloid burden.
    evidence:
    - reference: PMID:22961551
      reference_title: "Neuropathological correlates of dopaminergic imaging in Alzheimer's disease and Lewy body dementias."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In all striatal regions, image uptake was associated with nigral dopaminergic neuronal density (P ≤ 0.04) but not α-synuclein (P ≥ 0.46), tau (P ≥ 0.18) or amyloid β (P ≥ 0.22) burden."
      explanation: Striatal dopamine transporter signal is determined by surviving nigral neurons.
  evidence:
  - reference: PMID:10430831
    reference_title: "Striatal dopaminergic markers in dementia with Lewy bodies, Alzheimer's and Parkinson's diseases: rostrocaudal distribution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The homovanillic acid : dopamine ratio, a metabolic index, indicated compensatory increased turnover in Parkinson's disease, which was absent in DLB despite the loss of substantia nigra neurons (49%), dopamine and uptake sites."
    explanation: Post-mortem loss of nigral neurons, striatal dopamine and uptake sites in DLB, without the compensatory turnover seen in PD.
  - reference: PMID:27940650
    reference_title: "Autopsy validation of 123I-FP-CIT dopaminergic neuroimaging for the diagnosis of DLB."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While an abnormal 123I-FP-CIT scan strongly supports Lewy body disease, a normal scan does not exclude DLB with minimal brainstem involvement."
    explanation: Nigrostriatal loss can be minimal in some DLB, consistent with it being a variable and later-accumulating lesion.
  - reference: PMID:28592453
    reference_title: "Diagnosis and management of dementia with Lewy bodies: Fourth consensus report of the DLB Consortium."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Table 2 also includes an assessment of substantia nigra neuronal loss (none, mild, moderate, and severe) in order to subclassify cases into those likely or not to have parkinsonism (DLB-P and DLB-no P)."
    explanation: The consensus pathology criteria use nigral neuron loss to predict whether parkinsonism is present.
- name: Striatal Dopamine Deficiency Without D2 Receptor Compensation
  conforms_to: "parkinsonism_dopaminergic_degeneration#Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction"
  biological_scale: TISSUE
  role: mid-stage effector
  description: >-
    Putaminal dopamine falls by about 72% in DLB, but unlike Parkinson disease

- name: Basal Forebrain Cholinergic Degeneration
  biological_scale: CELLULAR
  role: early-stage lesion
  description: >-
    Degeneration of the cholinergic neurons of the nucleus basalis of Meynert.
    It is already present early in DLB, begins in the posterior basal forebrain
    cell groups, and in vivo nucleus basalis atrophy is comparable to that in
    AD. Neuronal depletion here is also associated with excessive daytime
    sleepiness.
  cell_types:
  - preferred_term: basal forebrain cholinergic neuron
    term:
      id: CL:0000108
      label: cholinergic neuron
    modifier: DECREASED
  locations:
  - preferred_term: nucleus basalis of Meynert
    term:
      id: UBERON:0010010
      label: basal nucleus of telencephalon
  downstream:
  - target: Cortical Cholinergic Deficit
    causal_link_type: DIRECT
    description: >-
      Loss of basal forebrain neurons removes cholinergic terminals across
      cortex, limbic system and thalamus.
    evidence:
    - reference: PMID:37279796
      reference_title: "Severe cholinergic terminal loss in newly diagnosed dementia with Lewy bodies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients with dementia showed spatially distinct reductions in cholinergic terminals across the cerebral cortex, limbic system, thalamus and brainstem. Also, cholinergic terminal binding in cortical and limbic regions correlated quantitatively and spatially with atrophy of the basal forebrain."
      explanation: FEOBV PET in newly diagnosed DLB ties cortical and limbic cholinergic terminal loss to basal forebrain atrophy.
  - target: Excessive Daytime Somnolence
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Depletion of nucleus basalis neurons is associated with daytime
      sleepiness that is independent of night-time sleep fragmentation.
    evidence:
    - reference: PMID:29429645
      reference_title: "Daytime sleepiness in dementia with Lewy bodies is associated with neuronal depletion of the nucleus basalis of Meynert."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sleepiness was present in 58% of the DLB group and those with daytime sleepiness had significantly lower neuron counts in the nucleus basalis of Meynert than their non-sleepy counterparts (p = 0.001)."
      explanation: Autopsy neuron counts link nucleus basalis depletion to daytime sleepiness in DLB.
  evidence:
  - reference: PMID:25059393
    reference_title: "Atrophy of the cholinergic basal forebrain in dementia with Lewy bodies and Alzheimer's disease dementia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The DLB group demonstrated pronounced and subregion-specific atrophy of the BF which was comparable to BF atrophy in AD: volume of the nucleus basalis Meynert was significantly reduced by 20-25%, whereas rostral BF nuclei were only marginally affected."
    explanation: In vivo MRI shows nucleus basalis atrophy in DLB.
  - reference: PMID:34605858
    reference_title: "Cholinergic white matter pathways in dementia with Lewy bodies and Alzheimer's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients who have dementia with Lewy bodies and Alzheimer's disease show early degeneration of the cholinergic nucleus basalis of Meynert."
    explanation: Nucleus basalis degeneration is early in DLB.
  - reference: PMID:38437860
    reference_title: "Cholinergic changes in Lewy body disease: implications for presentation, progression and subtypes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This implies that posterior cholinergic cell groups in the basal forebrain are affected in the early stages of Lewy body disorders, while more anterior regions are typically affected later in the disease progression."
    explanation: Basal forebrain loss progresses from posterior to anterior groups over the disease course.
- name: Cortical Cholinergic Deficit
  biological_scale: TISSUE
  role: early-stage effector
  description: >-
    Loss of neocortical choline acetyltransferase activity, more severe and
    earlier than in AD and independent of coexisting AD pathology, together
    with reduced cortical acetylcholinesterase and alpha7 nicotinic receptor
    binding. It is the best-supported substrate of visual hallucinations and of
    the attentional deficit, and the target of cholinesterase inhibitors.
  biological_processes:
  - preferred_term: cholinergic synaptic transmission
    term:
      id: GO:0007271
      label: synaptic transmission, cholinergic
    modifier: DECREASED
  locations:
  - preferred_term: neocortex
    term:
      id: UBERON:0001950
      label: neocortex
  downstream:
  - target: Visual Hallucinations
    causal_link_type: DIRECT
    description: >-
      Cortical ChAT loss is greater in hallucinating patients, and loss of
      alpha7 nicotinic binding in temporal cortex goes with hallucinations.
      Cholinesterase inhibitors reduce hallucinations, the interventional
      support for this edge.
    evidence:
    - reference: PMID:2357341
      reference_title: "Cholinergic and dopaminergic activities in senile dementia of Lewy body type."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Reductions in the cortical cholinergic enzyme choline acetyltransferase were more pronounced in individuals with (80%) compared to those without (50%) hallucinations and correlated strongly with mental test scores in the group as a whole."
      explanation: Autopsy ChAT loss is greater in patients who hallucinated.
    - reference: PMID:11796155
      reference_title: "Visual hallucinations are associated with lower alpha bungarotoxin binding in dementia with Lewy bodies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Visual hallucinations and delusional misidentification were associated with lower ... alpha bungarotoxin binding in areas 36 and 20 (P<.05), but not with changes in ... epibatidine binding."
      explanation: Loss of temporal cortex alpha7 nicotinic receptors goes with visual hallucinations in prospectively assessed cases.
    - reference: PMID:11145488
      reference_title: "Efficacy of rivastigmine in dementia with Lewy bodies: a randomised, double-blind, placebo-controlled international study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Patients taking rivastigmine were significantly less apathetic and anxious, and had fewer delusions and hallucinations while on treatment than controls."
      explanation: Restoring cholinergic tone reduces hallucinations in a randomised trial, interventional support for the edge.
  - target: Impaired Attention and Executive Function
    causal_link_type: DIRECT
    description: >-
      The midfrontal cholinergic deficit, more than a hippocampal one,
      distinguishes Lewy body dementia from AD, and cholinesterase inhibition
      improves attention-heavy tasks.
    evidence:
    - reference: PMID:10668703
      reference_title: "Cholinergic dysfunction in diseases with Lewy bodies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Marked losses in midfrontal ChAT activity occur in diseases with LB, independent of coexistent AD changes."
      explanation: Frontal cholinergic loss is a feature of Lewy body disease in its own right.
    - reference: PMID:11145488
      reference_title: "Efficacy of rivastigmine in dementia with Lewy bodies: a randomised, double-blind, placebo-controlled international study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "In the computerised cognitive assessment system and the neuropsychological tests, patients were significantly faster and better than those on placebo, particularly on tasks with a substantial attentional component."
      explanation: Cholinesterase inhibition improves attention most, supporting a cholinergic basis for the attentional deficit.
  - target: Delusions
    causal_link_type: UNKNOWN
    description: >-
      Cholinesterase inhibitors reduce delusions, but no lesion study ties a
      cholinergic measure to delusions specifically.
    evidence:
    - reference: PMID:28592453
      reference_title: "Diagnosis and management of dementia with Lewy bodies: Fourth consensus report of the DLB Consortium."
      supports: SUPPORT
      evidence_source: OTHER
      directness: INDIRECT
      snippet: "CHEIs may produce substantial reduction in apathy and improve visual hallucinations and delusions in DLB."
      explanation: Treatment response is the only evidence for this edge.
  - target: Apathy
    causal_link_type: UNKNOWN
    description: >-
      Apathy improves on cholinesterase inhibitors, a secondary trial endpoint.

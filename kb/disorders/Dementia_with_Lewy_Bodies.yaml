    explanation: >-
      The source's own statement of what was unknown when it was written, and
      the basis for this node asserting a neocortical signalling change rather
      than loss of the hypothalamic neurons. The 60% hypothalamic hypocretin
      neuron reduction the paper cites is from Parkinson disease, not DLB.
- name: Concomitant Alzheimer Disease Co-Pathology
  biological_scale: TISSUE
  role: disease modifier
  description: >-
    Neocortical neurofibrillary tangles and neuritic plaques, present in many
    DLB cases. Tangle burden shifts the phenotype toward AD: the DLB syndrome
    emerges later or not at all, hallucinations are less frequent, memory is
    more impaired, and decline and death come sooner. DLB with RBD carries less
    of it.
  locations:
  - preferred_term: neocortex
    term:
      id: UBERON:0001950
      label: neocortex
  downstream:
  - target: Memory Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Medial temporal tangle pathology produces the amnestic deficit that is
      relatively mild in pure Lewy body disease.
    evidence:
    - reference: PMID:15985574
      reference_title: "Cognitive differences in dementia patients with autopsy-verified AD, Lewy body pathology, or both."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "patients with Alzheimer disease (AD) alone and AD/Lewy body pathology (LBP) had more severe memory impairment than patients with LBP."
      explanation: Adding AD pathology to Lewy pathology worsens memory.
  - target: Neuronal Death
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      AD co-pathology accelerates decline and shortens survival.
    evidence:
    - reference: PMID:32561678
      reference_title: "Subtypes of dementia with Lewy bodies are associated with α-synuclein and tau distribution."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Dementia trajectory was slowest for TLBD without neocortical tangles, and fastest for DLBD with neocortical tangles."
      explanation: Neocortical tangles accelerate the dementia trajectory in autopsy-confirmed Lewy body disease.
  evidence:
  - reference: PMID:12771246
    reference_title: "Influence of Alzheimer pathology on clinical diagnostic accuracy in dementia with Lewy bodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The low Braak stage (0 to 2, n = 24) subjects had a higher frequency of visual hallucinations (65%) than did subjects with DLB with higher (3 to 6, n = 66) Braak stages (33%, p = 0.008), and showed a slightly greater but not significant degree of EPS."
    explanation: >-
      Supports this node's claim that tangle burden shifts the phenotype away
      from the DLB syndrome: hallucinations are about half as frequent at high
      Braak stage. Carried as node evidence rather than as an edge to Visual
      Hallucinations, because the finding is an attenuation and an edge renders
      as an ordinary causal arrow.
  - reference: PMID:32561678
    reference_title: "Subtypes of dementia with Lewy bodies are associated with α-synuclein and tau distribution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TLBD with neocortical tangles had 48% diagnostic sensitivity for probable DLB and 52% for the DLB syndrome, with median latencies >6 years from cognitive onset, and were cognitively similar to AD."
    explanation: With neocortical tangles the DLB syndrome is recognised in only half of cases, more than six years after cognitive onset, and the profile resembles AD.
  - reference: PMID:27979356
    reference_title: "Neuropathological and genetic correlates of survival and dementia onset in synucleinopathies: a retrospective analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alzheimer's disease neuropathology is common in synucleinopathies and confers a worse prognosis for each increasing level of neuropathological change."
    explanation: AD co-pathology worsens prognosis in a dose-dependent way.
  - reference: PMID:22038951
    reference_title: "Rapid eye movement sleep behavior disorder and subtypes in autopsy-confirmed dementia with Lewy bodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients also had a lower Braak neurofibrillary tangle stage (stage IV vs stage VI) and lower neuritic plaque scores (18% vs 85% frequency), but no difference in Lewy body distribution."
    explanation: DLB with RBD carries less AD co-pathology.
- name: Neuronal Death
  biological_scale: CELLULAR
  role: late-stage outcome
  description: >
    Progressive loss of neurons due to alpha-synuclein pathology and associated
    proteinopathies, leading to brain atrophy particularly in cortical and limbic
    regions. The neurodegeneration underlies the progressive cognitive decline and
    other clinical features of DLB.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Dementia
  evidence:
  - reference: PMID:29222591
    reference_title: "Dementia with Lewy bodies and Parkinson's disease-dementia: current concepts and controversies."
    supports: SUPPORT
    snippet: "Intravitam PET and post-mortem studies revealed more pronounced cortical atrophy, elevated cortical and limbic Lewy pathologies."
    explanation: This demonstrates that the alpha-synuclein pathology leads to cortical atrophy through neuronal loss, particularly pronounced in cortical and limbic regions.
phenotypes:
- category: Neurological
  name: REM Sleep Behavior Disorder
  frequency: VERY_FREQUENT
  diagnostic: true
  notes: >-
    Prodromal. Usually the first core feature to appear, often a decade or more
    before cognitive, motor or autonomic onset, and it may become less vigorous
    or quiescent later in the course. Attention and executive decline in
    isolated RBD begins up to 10 years before phenoconversion.
  evidence:
  - reference: PMID:37461299
    reference_title: "Prodromal dementia with Lewy bodies in REM sleep behavior disorder: A multicenter study."
    supports: SUPPORT
    snippet: "Isolated/idiopathic rapid eye movement sleep behavior disorder (iRBD) is a powerful early predictor of dementia with Lewy bodies (DLB) and Parkinson's disease (PD)."
    explanation: This establishes that RBD is a prodromal marker for DLB, occurring years before dementia onset.
  - reference: PMID:37461299
    reference_title: "Prodromal dementia with Lewy bodies in REM sleep behavior disorder: A multicenter study."
    supports: SUPPORT
    snippet: "Cognitive decline in iRBD begins up to 10 years prior to phenoconversion. Attention and executive dysfunction are the strongest predictors of dementia in iRBD."
    explanation: This demonstrates the temporal relationship between RBD and DLB, with attention/executive deficits predicting dementia phenoconversion.
  - reference: PMID:28592453
    reference_title: "Diagnosis and management of dementia with Lewy bodies: Fourth consensus report of the DLB Consortium."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "RBD is now included as a core clinical feature because it occurs frequently in autopsy-confirmed cases compared with non-DLB (76% vs 4%)."
    explanation: RBD occurs in 76% of autopsy-confirmed DLB.
  - reference: PMID:28592453
    reference_title: "Diagnosis and management of dementia with Lewy bodies: Fourth consensus report of the DLB Consortium."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It often begins many years before other symptoms, may become less vigorous or even quiescent over time"
    explanation: The consensus report states that RBD often begins many years before other symptoms and may wane later in the course.
  - reference: PMID:34761850
    reference_title: "The temporal onset of the core features in dementia with Lewy bodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "REM sleep behavior disorder (RBD) developed before the other core features in men and women."
    explanation: In 488 patients, RBD was the first core feature in both sexes.
  - reference: PMID:23474058
    reference_title: "Clinicopathologic correlations in 172 cases of rapid eye movement sleep behavior disorder with or without a coexisting neurologic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RBD preceded the onset of cognitive impairment, parkinsonism, or autonomic dysfunction in 87 (51%) patients by 10±12 (range, 1-61) years."
    explanation: RBD precedes the other features by about a decade in a clinicopathological series.
  - reference: PMID:21849645
    reference_title: "Inclusion of RBD improves the diagnostic classification of dementia with Lewy bodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each of the 3 core features increased the odds of autopsy-confirmed DLB up to 2-fold, and RBD increased the odds by 6-fold."
    explanation: RBD is the most diagnostic core feature for autopsy-confirmed DLB.
  phenotype_term:
    preferred_term: REM sleep behavior disorder
    term:
      id: HP:5200291
      label: REM sleep behavior disorder

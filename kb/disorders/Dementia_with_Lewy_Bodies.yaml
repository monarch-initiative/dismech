    evidence:
    - reference: PMID:11145488
      reference_title: "Efficacy of rivastigmine in dementia with Lewy bodies: a randomised, double-blind, placebo-controlled international study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Patients taking rivastigmine were significantly less apathetic and anxious, and had fewer delusions and hallucinations while on treatment than controls."
      explanation: Apathy responds to cholinesterase inhibition, an indirect pointer to a cholinergic contribution.
  - target: Postural Instability
    causal_link_type: UNKNOWN
    description: >-
      Postural instability and gait difficulty dominate the DLB motor syndrome
      more than in Parkinson disease, and a cholinergic contribution is

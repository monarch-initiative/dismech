datasets:
- accession: geo:GSE272947
  title: Methylation profiling by array for Dementia with Lewy Bodies using brain tissue
  description: "Synucleinopathies encompass Parkinson's disease (PD), dementia with Lewy bodies (DLB), and Parkinson's disease dementia (PDD) and are recognized for presenting a range of cognitive, neuropsychiatric, sleep-related, motor, and autonomic symptoms. DLB manifests with early-onset dementia when Lewy bodies develop in the brainstem and cerebral cortex. We profiled the DNA methylation using the post-mortem brain tissue from the parietal cortex, specifically Brodmann area 7 and compared them with age-, and sex-matched controls. Through the integration of multi-omics approaches, we anticipate the identification of notable alterations in these well-defined samples."
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: METHYLATION
  sample_count: 31
  publication: PMID:39736077
  notes: Identified by GEO DataSets index search for Dementia with Lewy Bodies (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE190348
  title: Dementia with Lewy bodies post-mortem brains reveal differentially methylated CpG sites with biomarker potential
  description: Dementia with Lewy bodies (DLB) is a common form of dementia with known genetic and environmental interactions. However, the underlying epigenetic mechanisms which reflect these gene-environment interactions are poorly studied. Herein, we measured genome-wide DNA methylation profiles of post-mortem brain tissue (Broadmann area 7) from 15 pathologically confirmed DLB brains and compared them with 16 cognitively normal controls using Illumina MethylationEPIC arrays. We identified 17 significantly differentially methylated CpGs (DMCs) and 17 differentially methylated regions (DMRs) between the groups. The DMCs are mainly located at the CpG islands, promoter and first exon regions.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: METHYLATION
  sample_count: 31
  publication: PMID:36418427
  notes: Identified by GEO DataSets index search for Dementia with Lewy Bodies (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE141578
  title: CD4+ T cells contribute to neurodegeneration in Lewy body dementia [CSF_and_PBMCs_Healthy and LBD]
  description: Recent studies indicate that the adaptive immune system plays a role in Lewy body dementia (LBD). However, the mechanism regulating T cell brain homing in LBD is unknown. Here, we observed T cells adjacent to Lewy bodies and dopaminergic neurons in post-mortem LBD brains. Single-cell RNA sequencing of cerebrospinal fluid (CSF) identified upregulated expression of C-X-C Motif Chemokine Receptor 4 (CXCR4) in CD4+ T cells in LBD. CSF protein levels of the CXCR4 ligand, C-X-C Motif Chemokine Ligand 12 (CXCL12) were associated with neuroaxonal damage in LBD.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: SINGLE_CELL_RNA_SEQ
  sample_count: 35
  publication: PMID:34648304
  notes: Identified by GEO DataSets index search for Dementia with Lewy Bodies (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.
discussions:
- discussion_id: dlb_unwired_phenotypes
  prompt: >-
    Which lesions produce depression, anxiety, urinary urgency and dysphagia in
    dementia with Lewy bodies?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Depression
  - phenotypes#Anxiety
  - phenotypes#Dysphagia
  - phenotypes#Urinary Urgency and Incontinence
  rationale: >-
    These features are well documented in DLB, several of them in the
    prodromal phase, but no study relates them to a specific lesion in DLB.
    Locus coeruleus and raphe involvement are the usual candidates for
    depression and anxiety, the dorsal vagal and brainstem swallowing network
    for dysphagia, and pontine, frontal or dopaminergic control of micturition
    for detrusor overactivity, but the supporting work is in Parkinson disease
    or is absent. Depression, anxiety and dysphagia are therefore left without
    a causal edge, and urinary urgency carries only an UNKNOWN-typed one.
  evidence:
  - reference: PMID:24099488
    reference_title: "Dysphagia in Lewy body dementia - a clinical observational study of swallowing function by videofluoroscopic examination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-six patients (32%) reported symptoms of dysphagia such as swallowing difficulties or coughing. Twenty-four (92%) of these had a documented swallowing dysfunction on VFSE. Eighty-eight percent suffered from pharyngeal dysfunction."
    explanation: Documents the dysphagia phenotype whose lesion is unknown.

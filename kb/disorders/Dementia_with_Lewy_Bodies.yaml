    reference_title: "Neural correlates of psychotic symptoms in dementia with Lewy bodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "misidentifications were related to dysfunction of the limbic-paralimbic structures and delusions were related to dysfunction of the frontal cortices"

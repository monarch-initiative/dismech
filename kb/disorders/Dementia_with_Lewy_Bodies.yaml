      unit: '{score}'
      abnormal_flag: NORMAL
  evidence:
  - reference: PMID:23919950
    reference_title: "Montreal Cognitive Assessment and Mini-Mental State Examination performance in patients with mild-to-moderate dementia with Lewy bodies, Alzheimer's disease, and normal participants in Taiwan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The MoCA is a more sensitive instrument than the MMSE to screen AD or DLB patients from non-dementia cases."
    explanation: The MMSE was evaluated as a screening instrument for dementia with Lewy bodies and found less sensitive than the MoCA.
- name: Clinical Dementia Rating
  description: >-
    Global dementia staging instrument developed for Alzheimer's disease. In a
    chart review of patients with Alzheimer's disease and DLB, the CDR and its
    sum of boxes characterized differences between the two diseases across
    stages from mild cognitive impairment (CDR 0.5) to moderate-severe dementia
    (CDR 2); the authors judged that the sum of boxes could work as a DLB trial
    outcome but that a DLB-specific global rating instrument is needed. The
    change in sum of boxes was the primary outcome of the neflamapimod trial
    recorded in this entry's clinical trials.
  notes: >-
    Copyright © Washington University Charles F. and Joanne Knight Alzheimer's Disease Research Center (Knight ADRC). Used with permission.
    LOINC carries the CDR only as a panel. A search of the LOINC 2.83 table
    (the Tuva Project extract pinned in data/loinc/MANIFEST.yaml) for "CDR",
    "dementia rating" and "sum of boxes", and of the Monarch KG for "Clinical
    Dementia Rating", "CDR global", "Sum of boxes score [CDR]" and "Total score
    [CDR]", found no global-score or sum-of-boxes code, so no stage bands are
    recorded. The same search of the LOINC table for "Lewy" found no
    DLB-specific instrument. The instrument's items are not reproduced in this
    entry.
  measurements:
  - preferred_term: CDR
    term:
      id: LOINC:72088-8
      label: Clinical Dementia Rating scale [CDR]
  evidence:
  - reference: PMID:40971142
    reference_title: "Testing the Clinical Dementia Rating Sum of Boxes as an Outcome for Dementia with Lewy Bodies Clinical Trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The CDR and CDR-SB characterize important differences between AD and DLB across different cross-sectional stages of disease severity, with the greatest differences seen at the CDR 0.5 stage."
    explanation: The CDR stages dementia with Lewy bodies as well as Alzheimer's disease.
  - reference: PMID:40971142
    reference_title: "Testing the Clinical Dementia Rating Sum of Boxes as an Outcome for Dementia with Lewy Bodies Clinical Trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "While the CDR-SB could work on a DLB clinical trial, the field would be most advanced by the development of a DLB-specific global rating instrument."
    explanation: Supports the CDR sum of boxes as a usable, though not disease-specific, DLB outcome.
treatments:
- name: Cholinesterase Inhibitors
  description: >-
    Rivastigmine and donepezil are used for cognitive and neuropsychiatric
    symptoms. Randomised trials show benefit on attention-heavy cognition,
    hallucinations, delusions and apathy, but the confirmatory phase 3
    donepezil trial did not meet its co-primary endpoints, and benefits fade on
    discontinuation.
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:29222591
    reference_title: "Dementia with Lewy bodies and Parkinson's disease-dementia: current concepts and controversies."
    supports: SUPPORT
    snippet: "Clinical management of both disorders includes cholinesterase inhibitors, other pharmacologic and nonpharmacologic strategies, but these have only a mild symptomatic effect."
    explanation: This confirms that cholinesterase inhibitors are part of standard clinical management for DLB, though they provide only mild symptomatic benefit.
  - reference: PMID:28592453
    reference_title: "Diagnosis and management of dementia with Lewy bodies: Fourth consensus report of the DLB Consortium."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Meta-analyses of Class I clinical trials of rivastigmine and donepezil support the use of cholinesterase inhibitors (CHEIs) in DLB for improving cognition, global function, and activities of living"
    explanation: Consensus recommendation based on meta-analyses of randomised trials.
  - reference: PMID:11145488
    reference_title: "Efficacy of rivastigmine in dementia with Lewy bodies: a randomised, double-blind, placebo-controlled international study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients taking rivastigmine were significantly less apathetic and anxious, and had fewer delusions and hallucinations while on treatment than controls."
    explanation: Rivastigmine reduced neuropsychiatric symptoms in a randomised trial.
  - reference: PMID:22829268
    reference_title: "Donepezil for dementia with Lewy bodies: a randomized, placebo-controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Donepezil at 5 and 10mg/day produces significant cognitive, behavioral, and global improvements that last at least 12 weeks in DLB patients, reducing caregiver burden at the highest dose."
    explanation: Donepezil improved cognition, behaviour and global function in the phase 2 trial.
  - reference: PMID:25713599
    reference_title: "Donepezil for dementia with Lewy bodies: a randomized, placebo-controlled, confirmatory phase III trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The co-primary endpoints were not achieved in this trial."
    explanation: The confirmatory phase 3 donepezil trial did not meet its co-primary endpoints.
  treatment_term:
    preferred_term: cholinesterase inhibitor therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rivastigmine
      term:
        id: CHEBI:8874
        label: rivastigmine
    - preferred_term: donepezil
      term:
        id: CHEBI:53289
        label: donepezil
  target_mechanisms:
  - target: Cortical Cholinergic Deficit
    treatment_effect: RESTORES
    description: >-
      Inhibiting acetylcholinesterase raises synaptic acetylcholine and partly
      offsets the cortical cholinergic deficit left by basal forebrain
      degeneration.
    evidence:
    - reference: PMID:11145488
      reference_title: "Efficacy of rivastigmine in dementia with Lewy bodies: a randomised, double-blind, placebo-controlled international study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In the computerised cognitive assessment system and the neuropsychological tests, patients were significantly faster and better than those on placebo, particularly on tasks with a substantial attentional component."
      explanation: The attentional benefit is what a restored cholinergic tone predicts.
- name: Levodopa
  description: >-
    Levodopa can be tried for parkinsonism, but the motor response is smaller
    than in Parkinson disease, is seen in only a third to a half of patients,
    wanes faster, and carries a risk of worsening hallucinations and psychosis.
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:16107351
    reference_title: "The role of levodopa in the management of dementia with Lewy bodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "L-dopa was generally well tolerated in DLB but produced a significant motor response in only about one third of patients."
    explanation: Only about a third of DLB patients have a significant motor response.
  - reference: PMID:20615745
    reference_title: "Levodopa response in dementia with lewy bodies: a 1-year follow-up study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Positive response to the acute levodopa test was observed in 55% of DLB patients (acute DLB responders), and in 90% of PD patients (acute PD responders)."
    explanation: Acute levodopa response is less frequent than in Parkinson disease.
  - reference: PMID:18823039
    reference_title: "Effects of dopaminergic medications on psychosis and motor function in dementia with Lewy bodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that dopaminergic medications have limited benefit in DLB because of the low likelihood of motor improvement and the risk of psychosis exacerbation."
    explanation: Limited motor benefit and a risk of worsening psychosis.
  treatment_term:
    preferred_term: dopaminergic pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levodopa
      term:
        id: CHEBI:15765
        label: L-dopa
  target_mechanisms:
  - target: Striatal Dopamine Deficiency Without D2 Receptor Compensation
    treatment_effect: RESTORES
    description: >-
      Levodopa replaces striatal dopamine, but with reduced D2 receptors and no
      compensatory turnover the response is smaller than in Parkinson disease.
    evidence:
    - reference: PMID:16107351
      reference_title: "The role of levodopa in the management of dementia with Lewy bodies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Acute L-dopa challenge in 14 DLB patients yielded a mean 13.8% (p = 0.02) improvement in UPDRS III score, compared with 20.5% in PD (n = 28, p < 0.0001) and 23% in PDD (n = 30, p<0.0001) respectively."
      explanation: The levodopa response is smaller than in Parkinson disease.
- name: Symptomatic Management
  description: No disease-modifying treatments currently available. Management focuses on symptomatic treatment of cognitive, motor, and psychiatric symptoms. Includes both pharmacological approaches (cautious use of antipsychotics due to sensitivity, dopaminergic therapy for parkinsonism) and non-pharmacological strategies including behavioral interventions and caregiver support.
  evidence:
  - reference: PMID:29222591
    reference_title: "Dementia with Lewy bodies and Parkinson's disease-dementia: current concepts and controversies."
    supports: SUPPORT
    snippet: "Currently, no disease-modifying therapies are available."
    explanation: This confirms that no disease-modifying therapies are currently available for DLB, with treatment limited to symptomatic management.
  - reference: PMID:28592453
    reference_title: "Diagnosis and management of dementia with Lewy bodies: Fourth consensus report of the DLB Consortium."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "particularly in the case of DLB they should be avoided whenever possible, given the increased risk of a serious sensitivity reaction."
    explanation: Antipsychotics should be avoided where possible because of severe sensitivity.
  treatment_term:
    preferred_term: Symptomatic Therapy
    term:
      id: NCIT:C170740
      label: Symptomatic Therapy
clinical_trials:
- name: NCT05869669
  phase: PHASE_II
  status: COMPLETED
  description: >-
    Phase 2b randomized controlled trial of neflamapimod, an oral p38α inhibitor,
    in 159 patients with probable DLB. The trial was enriched for patients without
    Alzheimer disease co-pathology (plasma ptau181<27.2 pg/mL). Although the primary
    outcome (change in CDR-SB at 16 weeks) was not significantly different between
    treatment and placebo arms, exploratory analyses showed potential benefit in
    patients with low plasma ptau181 levels. Structural MRI sub-study (n=18) showed
    improvement in right basal forebrain volume with neflamapimod compared to placebo.
    Biomarker analyses (GFAP, neurofilament light chain) showed no significant differences.
  target_phenotypes:
  - preferred_term: Dementia
    term:
      id: HP:0000726
      label: Dementia
  - preferred_term: Parkinsonism
    term:
      id: HP:0001300
      label: Parkinsonism
  evidence:
  - reference: clinicaltrials:NCT05869669
    reference_title: "A Phase 2b Clinical Study of the P38 Alpha Kinase Inhibitor Neflamapimod in Patients With Dementia With Lewy Bodies"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The purpose of this study is to determine whether neflamapimod can improve learning skills, problem solving skills, and memory loss in people diagnosed with DLB."
    explanation: ClinicalTrials.gov registration record establishing the trial's identity, confirming it is the correctly-numbered registration referenced by the preprint (which itself misprints the identifier as NCT0586966).
  - reference: PPR:PPR1298352
    reference_title: "A Phase 2b randomized clinical trial of the oral p38α inhibitor neflamapimod in dementia with Lewy bodies (DLB)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "16-week randomized, placebo-controlled clinical trial, with a 32-week open label extension, conducted at 43 centers in the US, UK and Netherlands. 159 participants with probable DLB by consensus criteria, screened to enrich for patients without AD co-pathology (plasma ptau181≥27.2 pg/mL excluded), randomized between August 2023 and June 2024 to neflamapimod 40mg (80 participants) or matching placebo (79 participants) capsules, TID."
    explanation: This preprint reports the trial design and patient enrollment for the phase 2b neflamapimod study in DLB.
  - reference: PPR:PPR1298352
    reference_title: "A Phase 2b randomized clinical trial of the oral p38α inhibitor neflamapimod in dementia with Lewy bodies (DLB)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: "There was no significant difference between neflamapimod and placebo on the primary outcome measure, change in CDR-SB."
    explanation: Reports the trial's headline negative result on its pre-specified primary endpoint.
  - reference: PPR:PPR1298352
    reference_title: "A Phase 2b randomized clinical trial of the oral p38α inhibitor neflamapimod in dementia with Lewy bodies (DLB)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In exploratory analyses, the treatment group difference in change in CDR-SB favored neflamapimod compared to placebo among participants with low (<21 pg/mL) screening plasma p-tau181."
    explanation: Exploratory analysis in ptau181-stratified subgroup showing potential cognitive benefit with neflamapimod.
  - reference: PPR:PPR1298352
    reference_title: "A Phase 2b randomized clinical trial of the oral p38α inhibitor neflamapimod in dementia with Lewy bodies (DLB)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "improvement relative to placebo was seen with neflamapimod on change in right basal forebrain volume from baseline to week 16."
    explanation: Structural MRI biomarker showing improvement in basal forebrain volume with neflamapimod treatment.
  notes: >-
    Results are reported in a preprint (PPR:PPR1298352, Research Square,
    DOI:10.21203/rs.3.rs-10623740/v1) that has not yet completed peer review;
    the exploratory ptau181-stratified subgroup finding and the basal-forebrain
    MRI sub-study result should be weighed accordingly. The registration
    identifier is corrected here to NCT05869669 — the preprint's own abstract
    misprints it as NCT0586966.

  phenotype_term:
    preferred_term: Self-mutilation
    term:
      id: HP:0000742
      label: Self-mutilation
  evidence:
  - reference: PMID:8696348
    reference_title: "Mutations in the TRKA/NGF receptor gene in patients with congenital insensitivity to pain with anhidrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "absence of reaction to noxious stimuli, self-mutilating behaviour and mental retardation."
    explanation: Documents self-mutilating behavior as a feature of HSAN4 (CIPA).

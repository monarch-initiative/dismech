diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Diagnosis of each HSAN subtype is established in a proband with suggestive
    clinical findings (sensory-predominant neuropathy ± autonomic involvement) by
    identifying the subtype-specific pathogenic variant(s) on molecular genetic
    testing — biallelic for the recessive forms (e.g. NTRK1 in HSAN4/CIPA), a
    heterozygous variant for dominant HSAN1 (SPTLC1).
  notes: Molecular confirmation of the causal gene is the diagnostic standard across HSAN subtypes.
  evidence:
  - reference: PMID:20301726
    reference_title: "NTRK1 Congenital Insensitivity to Pain with Anhidrosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of NTRK1-CIPA is established in a proband with suggestive clinical findings and biallelic pathogenic variants in NTRK1 identified by molecular genetic testing."
    explanation: GeneReviews (NTRK1-CIPA / HSAN4) states the molecular-genetic diagnostic criterion — the model for confirmatory diagnosis across the HSAN subtypes.
treatments:
- name: Wound and Skin Care
  description: >-
    Meticulous foot and skin care, protective footwear, and early treatment of
    injuries to prevent the acral ulceration and mutilation that follow
    unperceived trauma.
  treatment_term:
    preferred_term: supportive care
    term:

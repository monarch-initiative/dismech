    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The autosomal dominant peripheral sensory neuropathy HSAN1 results from mutations in the LCB1 subunit of serine palmitoyltransferase (SPT)."
    explanation: Documents autosomal dominant inheritance of HSAN1.
- name: Autosomal Recessive
  description: >-
    The congenital / early-onset HSAN forms — HSAN2 (WNK1/HSN2), HSAN3 (ELP1),
    HSAN4 (NTRK1), and HSAN5 (NGF) — are inherited in an autosomal recessive
    manner.
  inheritance_term:

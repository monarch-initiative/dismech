name: Hereditary Sensory and Autonomic Neuropathy
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
description: >-
  Hereditary sensory and autonomic neuropathy (HSAN), also called hereditary
  sensory neuropathy (HSN), is a genetically heterogeneous group of inherited
  peripheral neuropathies in which the primary lesion is degeneration or
  developmental failure of the sensory (dorsal root ganglion) and autonomic
  neurons, with relative sparing of the motor system. This is the sensory /
  autonomic counterpart of the motor-predominant Charcot-Marie-Tooth
  neuropathies: instead of distal motor weakness, the cardinal features are loss
  of pain, temperature, and touch sensation — frequently complicated by painless
  injuries, acral ulceration, and mutilation — together with autonomic
  dysfunction. HSAN is classified into numbered types by inheritance, age of
  onset, and gene. The forms curated here span the four principal mechanistic
  themes: neurotoxic deoxysphingolipid formation from gain-of-function serine
  palmitoyltransferase mutations (HSAN1 / SPTLC1, autosomal dominant, adult
  onset); failure of NGF-TrkA neurotrophic signaling that normally supports the
  development and survival of nociceptive and autonomic neurons (HSAN4 / NTRK1,
  the classic congenital insensitivity to pain with anhidrosis, and HSAN5 / NGF);
  deficiency of the Elongator complex from a tissue-specific splicing defect
  (HSAN3 / ELP1, familial dysautonomia / Riley-Day); and loss of the
  HSN2-dependent sensory-neuron maintenance function of WNK1 (HSAN2). Unlike the
  CMT compartments, HSAN is not modeled here as a length-dependent dying-back
  axonopathy conforming to the peripheral_axonal_degeneration module, because
  several forms arise from developmental neurotrophic failure and sensory /
  autonomic neuronopathy rather than distal axonal die-back.
disease_term:
  preferred_term: Hereditary sensory and autonomic neuropathy (HSAN)
  term:
    id: MONDO:0015364
    label: hereditary sensory and autonomic neuropathy
parents:
- Peripheral Neuropathy
has_subtypes:
- name: HSAN1
  display_name: HSAN1 (SPTLC1, autosomal dominant)
  description: >-
    The most common autosomal dominant HSAN, adult-onset, caused by
    gain-of-function mutations in SPTLC1 (the LCB1 subunit of serine
    palmitoyltransferase) that generate neurotoxic 1-deoxysphingolipids.
    Distal sensory loss with painless ulcers and variable motor involvement.
  evidence:
  - reference: PMID:20504773
    reference_title: "A disease-causing mutation in the active site of serine palmitoyltransferase causes catalytic promiscuity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The autosomal dominant peripheral sensory neuropathy HSAN1 results from mutations in the LCB1 subunit of serine palmitoyltransferase (SPT)."
    explanation: Establishes SPTLC1 (LCB1 of serine palmitoyltransferase) mutations as the cause of autosomal dominant HSAN1.
- name: HSAN2
  display_name: HSAN2 (WNK1 / HSN2, autosomal recessive)
  description: >-
    Autosomal recessive, early-onset HSAN with impairment of pain, temperature,
    and touch from reduction or loss of peripheral sensory neurons, caused by
    truncating mutations in HSN2 — a nervous-system-specific exon within the
    WNK1 gene.
  evidence:
  - reference: PMID:15060842
    reference_title: "Identification of a novel gene (HSN2) causing hereditary sensory and autonomic neuropathy type II through the Study of Canadian Genetic Isolates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereditary sensory and autonomic neuropathy (HSAN) type II is an autosomal recessive disorder characterized by impairment of pain, temperature, and touch sensation owing to reduction or absence of peripheral sensory neurons."
    explanation: Establishes HSAN2 as an autosomal recessive sensory neuropathy; the HSN2 gene is a nervous-system-specific exon of WNK1.
- name: HSAN3
  display_name: HSAN3 / Familial Dysautonomia (ELP1 / IKBKAP, autosomal recessive)
  description: >-
    Familial dysautonomia (Riley-Day syndrome), an autosomal recessive HSAN
    prevalent in the Ashkenazi Jewish population, caused by a tissue-specific
    splicing mutation in ELP1 (IKBKAP / IKAP), a subunit of the Elongator
    complex. Prominent autonomic dysfunction with sensory loss.
  evidence:
  - reference: PMID:11179021
    reference_title: "Familial dysautonomia is caused by mutations of the IKAP gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings demonstrate that mutations in the gene encoding IKAP are responsible for FD."
    explanation: Establishes ELP1 (IKBKAP / IKAP) mutations as the cause of familial dysautonomia (HSAN3).
- name: HSAN4
  display_name: HSAN4 / CIPA (NTRK1, autosomal recessive)
  description: >-
    Congenital insensitivity to pain with anhidrosis (CIPA), an autosomal
    recessive HSAN caused by mutations in NTRK1 (TrkA, the high-affinity NGF
    receptor). Absence of pain perception, anhidrosis, recurrent fever,
    self-mutilation, and intellectual disability.
  evidence:
  - reference: PMID:8696348
    reference_title: "Mutations in the TRKA/NGF receptor gene in patients with congenital insensitivity to pain with anhidrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings strongly suggest that defects in TRKA cause CIPA and that the NGF-TRKA system has a crucial role in the development and function of the nociceptive reception as well as establishment of thermoregulation via sweating in humans."
    explanation: Establishes NTRK1 (TRKA) mutations as the cause of CIPA (HSAN4).
- name: HSAN5
  display_name: HSAN5 (NGF / NGFB, autosomal recessive)
  description: >-
    Autosomal recessive HSAN caused by mutation in NGF (NGFB), the ligand of
    TrkA, producing loss of deep pain perception with severe reduction of
    unmyelinated small nerve fibers but largely preserved cognition.
  evidence:
  - reference: PMID:14976160
    reference_title: "A mutation in the nerve growth factor beta gene (NGFB) causes loss of pain perception."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "revealed a mutation in the coding region of the nerve growth-factor beta (NGFB) gene specific for the disease haplotype."
    explanation: Establishes an NGF (NGFB) coding mutation as the cause of loss of pain perception (HSAN5).
pathophysiology:
- name: Neurotoxic Deoxysphingolipid Formation
  description: >-
    Gain-of-function mutations in SPTLC1 (HSAN1), the LCB1 subunit of serine
    palmitoyltransferase, shift the enzyme's substrate specificity so that it
    condenses alanine (instead of serine) with palmitoyl-CoA, generating atypical
    1-deoxysphingolipids that are neurotoxic to sensory neurons and accumulate in
    patient serum.
  cell_types:
  - preferred_term: Sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  biological_processes:
  - preferred_term: Sphingolipid biosynthetic process
    term:
      id: GO:0030148
      label: sphingolipid biosynthetic process
    modifier: ABNORMAL
  genes:
  - preferred_term: SPTLC1
    term:
      id: hgnc:11277
      label: SPTLC1
  downstream:
  - target: Sensory and Autonomic Neuron Degeneration
    description: >-
      Neurotoxic 1-deoxysphingolipids drive degeneration of sensory neurons in
      HSAN1.
  evidence:
  - reference: PMID:20504773
    reference_title: "A disease-causing mutation in the active site of serine palmitoyltransferase causes catalytic promiscuity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum from patients and transgenic mice expressing a disease-causing mutation (C133W) contain elevated levels of 1-deoxysphinganine (1-deoxySa), which presumably arise from inappropriate condensation of alanine with palmitoyl-CoA."
    explanation: Demonstrates accumulation of neurotoxic 1-deoxysphinganine from the SPTLC1 mutation, the HSAN1 mechanism.
- name: Impaired NGF-TrkA Neurotrophic Signaling
  description: >-
    Loss of signaling through the NGF-TrkA axis — from NTRK1 (TrkA receptor,
    HSAN4 / CIPA) or NGF (its ligand, HSAN5) mutations — removes the
    neurotrophic support that NGF provides for the development and survival of
    nociceptive sensory neurons and sympathetic (autonomic) neurons, so these
    populations fail to develop or are lost.
  cell_types:
  - preferred_term: Sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  - preferred_term: Autonomic neuron
    term:
      id: CL:0000107
      label: autonomic neuron
  biological_processes:
  - preferred_term: Neurotrophin TRK receptor signaling pathway
    term:
      id: GO:0048011
      label: neurotrophin TRK receptor signaling pathway
    modifier: DECREASED
  genes:
  - preferred_term: NTRK1
    term:
      id: hgnc:8031
      label: NTRK1
  - preferred_term: NGF
    term:
      id: hgnc:7808
      label: NGF
  downstream:
  - target: Sensory and Autonomic Neuron Degeneration
    description: >-
      Failure of NGF-TrkA neurotrophic support causes loss of nociceptive and
      autonomic neurons in HSAN4 and HSAN5.
  evidence:
  - reference: PMID:8696348
    reference_title: "Mutations in the TRKA/NGF receptor gene in patients with congenital insensitivity to pain with anhidrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nerve growth factor (NGF) induces neurite outgrowth and promotes survival of embryonic sensory and sympathetic neurons."
    explanation: Establishes the NGF-TrkA neurotrophic role in sensory and sympathetic neuron survival that fails in HSAN4 / HSAN5.
  - reference: PMID:14976160
    reference_title: "A mutation in the nerve growth factor beta gene (NGFB) causes loss of pain perception."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A severe reduction of unmyelinated nerve fibers and a moderate loss of thin myelinated nerve fibers are observed in the patients."
    explanation: Documents loss of small sensory fibers resulting from defective NGF signaling in HSAN5.
- name: Elongator Complex Deficiency
  description: >-
    In familial dysautonomia (HSAN3), a tissue-specific splice-site mutation in
    ELP1 (IKBKAP / IKAP) causes skipping of exon 20 and a truncated protein,
    reducing functional ELP1 — a subunit of the Elongator complex required for
    tRNA wobble-uridine modification — most severely in neural tissue, impairing
    development and maintenance of sensory and autonomic neurons.
  cell_types:
  - preferred_term: Sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  - preferred_term: Autonomic neuron
    term:
      id: CL:0000107
      label: autonomic neuron
  biological_processes:
  - preferred_term: tRNA wobble uridine modification
    term:
      id: GO:0002098
      label: tRNA wobble uridine modification
    modifier: DECREASED
  genes:
  - preferred_term: ELP1
    term:
      id: hgnc:5959
      label: ELP1
  downstream:
  - target: Sensory and Autonomic Neuron Degeneration
    description: >-
      Neural-tissue-specific ELP1 deficiency impairs sensory and autonomic
      neuron development and maintenance in familial dysautonomia.
  evidence:
  - reference: PMID:11179021
    reference_title: "Familial dysautonomia is caused by mutations of the IKAP gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the RNA encoding the IkappaB kinase complex-associated protein (IKAP) lacks exon 20 and, as a result of a frameshift, encodes a truncated protein."
    explanation: Establishes the tissue-specific splicing defect that reduces functional ELP1 (IKAP) in familial dysautonomia (HSAN3).
- name: HSN2-Dependent Sensory Neuron Maintenance Failure
  description: >-
    In HSAN2, truncating mutations in HSN2 — a single exon within the WNK1 gene,
    transcribed as a nervous-system-specific isoform — impair the development
    and/or maintenance of peripheral sensory neurons and their supporting Schwann
    cells, producing early-onset loss of pain, temperature, and touch.
  cell_types:
  - preferred_term: Sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  biological_processes:
  - preferred_term: Neuron development
    term:
      id: GO:0048666
      label: neuron development
    modifier: ABNORMAL
  genes:
  - preferred_term: WNK1
    term:
      id: hgnc:14540
      label: WNK1
  downstream:
  - target: Sensory and Autonomic Neuron Degeneration
    description: >-
      Loss of HSN2/WNK1 sensory-neuron maintenance leads to reduction or absence
      of peripheral sensory neurons in HSAN2.
  evidence:
  - reference: PMID:15060842
    reference_title: "Identification of a novel gene (HSN2) causing hereditary sensory and autonomic neuropathy type II through the Study of Canadian Genetic Isolates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The HSN2 protein may play a role in the development and/or maintenance of peripheral sensory neurons or their supporting Schwann cells."
    explanation: Establishes the HSN2 (WNK1) role in sensory-neuron maintenance whose loss causes HSAN2.
- name: Sensory and Autonomic Neuron Degeneration
  description: >-
    The shared terminal node of HSAN. The diverse upstream lesions (deoxysphingolipid
    toxicity, NGF-TrkA neurotrophic failure, Elongator deficiency, HSN2/WNK1
    maintenance loss) converge on reduction, loss, or developmental failure of
    peripheral sensory (dorsal root ganglion) and autonomic neurons — with
    prominent small-fiber involvement. The resulting deficit is sensory- and
    autonomic-predominant: impaired pain, temperature, and touch sensation
    (frequently with painless injuries and acral mutilation) and autonomic
    dysfunction, in contrast to the motor-predominant CMT compartments.
  cell_types:
  - preferred_term: Sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  - preferred_term: Autonomic neuron
    term:
      id: CL:0000107
      label: autonomic neuron
  biological_processes:
  - preferred_term: Neuron development
    term:
      id: GO:0048666
      label: neuron development
    modifier: ABNORMAL
  downstream:
  - target: Pain Insensitivity
  - target: Distal Sensory Loss
  - target: Acral Ulceration
  - target: Autonomic Dysfunction
  - target: Self-Mutilation
  evidence:
  - reference: PMID:15060842
    reference_title: "Identification of a novel gene (HSN2) causing hereditary sensory and autonomic neuropathy type II through the Study of Canadian Genetic Isolates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "impairment of pain, temperature, and touch sensation owing to reduction or absence of peripheral sensory neurons."
    explanation: Supports the convergent sensory deficit from reduction or absence of peripheral sensory neurons in HSAN.
phenotypes:
- category: Neurologic
  name: Pain Insensitivity
  diagnostic: true
  description: >-
    Reduced or absent perception of noxious (painful) stimuli, the cardinal
    feature of HSAN, leading to painless injuries.
  phenotype_term:
    preferred_term: Pain insensitivity
    term:
      id: HP:0007021
      label: Pain insensitivity
  evidence:
  - reference: PMID:8696348
    reference_title: "Mutations in the TRKA/NGF receptor gene in patients with congenital insensitivity to pain with anhidrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital insensitivity to pain with anhidrosis (CIPA; MIM 256800) is an autosomal-recessive disorder characterized by recurrent episodes of unexplained fever, anhidrosis (absence of sweating) and absence of reaction to noxious stimuli, self-mutilating behaviour and mental retardation."
    explanation: Establishes absence of reaction to noxious stimuli (pain insensitivity) as a cardinal HSAN4 (CIPA) feature.
- category: Neurologic
  name: Distal Sensory Loss
  phenotype_term:
    preferred_term: Distal sensory impairment
    term:
      id: HP:0002936
      label: Distal sensory impairment
  evidence:
  - reference: PMID:15060842
    reference_title: "Identification of a novel gene (HSN2) causing hereditary sensory and autonomic neuropathy type II through the Study of Canadian Genetic Isolates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "impairment of pain, temperature, and touch sensation owing to reduction or absence of peripheral sensory neurons."
    explanation: Supports impairment of pain, temperature, and touch sensation as the core sensory deficit of HSAN.
- category: Integumentary
  name: Acral Ulceration
  description: >-
    Painless ulcers of the feet and hands resulting from unperceived repetitive
    injury, a common and disabling complication of the sensory loss in HSAN.
  phenotype_term:
    preferred_term: Skin ulcer
    term:
      id: HP:0200042
      label: Skin ulcer
  evidence:
  - reference: PMID:20301564
    reference_title: "SPTLC1-Related Hereditary Sensory Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss of sensation can lead to painless injuries, which, if unrecognized, result in slow wound healing and subsequent osteomyelitis requiring distal amputations."
    explanation: GeneReviews (SPTLC1-HSN1) documents painless injuries progressing to non-healing ulcers, osteomyelitis, and amputation — the acral-ulceration complication of HSAN sensory loss.
- category: Neurologic
  name: Autonomic Dysfunction
  description: >-
    Dysregulation of autonomic function (e.g., abnormal sweating, blood-pressure
    and gastrointestinal control, and autonomic crises), most prominent in
    familial dysautonomia (HSAN3).
  phenotype_term:
    preferred_term: Abnormality of the autonomic nervous system
    term:
      id: HP:0002270
      label: Abnormality of the autonomic nervous system
  evidence:
  - reference: PMID:20301359
    reference_title: "Familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals have gastrointestinal dysfunction, autonomic crises (i.e., hypertensive vomiting attacks), recurrent pneumonia, altered pain sensitivity, altered temperature perception, and blood pressure instability."
    explanation: GeneReviews (Familial Dysautonomia / HSAN3) enumerates the autonomic dysfunction — GI dysmotility, autonomic crises, blood-pressure instability, and thermoregulatory disturbance.
- category: Integumentary
  name: Anhidrosis
  subtype: HSAN4
  description: >-
    Absence of sweating, a defining feature of HSAN4 (CIPA) reflecting the loss
    of NGF-TrkA-dependent sympathetic innervation of sweat glands.
  phenotype_term:
    preferred_term: Anhidrosis
    term:
      id: HP:0000970
      label: Anhidrosis
  evidence:
  - reference: PMID:8696348
    reference_title: "Mutations in the TRKA/NGF receptor gene in patients with congenital insensitivity to pain with anhidrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings strongly suggest that defects in TRKA cause CIPA and that the NGF-TRKA system has a crucial role in the development and function of the nociceptive reception as well as establishment of thermoregulation via sweating in humans."
    explanation: Links NGF-TRKA defects to impaired sweating (anhidrosis) in HSAN4 (CIPA).
- category: Neurologic
  name: Self-Mutilation
  description: >-
    Self-injurious behavior and acral mutilation arising from the absence of

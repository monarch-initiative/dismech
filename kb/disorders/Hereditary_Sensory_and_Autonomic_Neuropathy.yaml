inheritance:
- name: Autosomal Dominant
  description: >-
    HSAN1 (SPTLC1) is inherited in an autosomal dominant manner, typically with
    adult onset.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20504773

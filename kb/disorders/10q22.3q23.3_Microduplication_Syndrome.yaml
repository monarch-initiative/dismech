inheritance:
- name: Autosomal dominant with reduced penetrance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The duplication arises de novo or is inherited. Penetrance is variable: the same
    duplication has been identified in clinically healthy family members of affected
    probands, so carrier status does not predict phenotype.
  evidence:
  - reference: PMID:21248748
    reference_title: "The phenotype of recurrent 10q22q23 deletions and duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the phenotypic spectrum is broad, and duplications have also been found in healthy family members of a proband."
    explanation: Documents transmission from clinically unaffected carriers, establishing reduced penetrance.
pathophysiology:
- name: NAHR Between LCR3 and LCR4
  biological_scale: MOLECULAR
  description: >-
    The 10q22.3q23.3 region carries two directly oriented low-copy repeats, LCR3 and
    LCR4. Non-allelic homologous recombination between them produces reciprocal
    deletion and duplication products, which is why the two syndromes share
    breakpoints. Rearrangements with unique breakpoints also occur in the region.
  evidence:
  - reference: PMID:21248748
    reference_title: "The phenotype of recurrent 10q22q23 deletions and duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The genomic architecture of the 10q22q23 region is characterised by two low-copy repeats (LCRs3 and 4), and deletions in this region appear to be rare."
    explanation: Establishes the LCR3/LCR4 genomic architecture that underlies the recurrent rearrangement.
  - reference: PMID:26383923
    reference_title: "Duplication of 10q22.3-q23.3 encompassing BMPR1A and NGR3 associated with congenital heart disease, microcephaly, and mild intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chromosome region 10q22.3-q23.3 contains several low copy repeats (LCRs) and is prone to recombination."
    explanation: Independently confirms the recombination-prone architecture of the interval.
  downstream:
  - target: Increased Dosage of the 10q22.3q23.3 Interval
    causal_link_type: DIRECT
    description: >-
      The duplication product carries an extra copy of the sequence between the
      repeats.
    evidence:
    - reference: PMID:26383923
      reference_title: "Duplication of 10q22.3-q23.3 encompassing BMPR1A and NGR3 associated with congenital heart disease, microcephaly, and mild intellectual disability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a de novo interstitial 8.2-Mb duplication of 10q22.3-q23.3, including BMPR1A and NGR3, was identified by Illumina SNP array platform"
      explanation: Documents the extra copy of the interval and the genes it contains in an affected individual.
- name: Increased Dosage of the 10q22.3q23.3 Interval
  biological_scale: MOLECULAR
  description: >-
    Three copies of the interval raise expression of the genes it contains. BMPR1A,
    GRID1 and NRG3 are the named candidates; BMPR1A and GRID1 were proposed for the
    cardiac phenotype on the basis of their roles in cardiac structure and function.
    No single interval gene has been shown to account for the duplication phenotype,
    so the dosage change is modelled at the level of the interval.
  evidence:
  - reference: PMID:21248748
    reference_title: "The phenotype of recurrent 10q22q23 deletions and duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For cardiac defects, BMPR1A and GRID1 are putative candidate genes because of their association with cardiac structure and function."
    explanation: Names the candidate dosage-sensitive genes proposed for the cardiac phenotype in this interval.
  - reference: PMID:26383923
    reference_title: "Duplication of 10q22.3-q23.3 encompassing BMPR1A and NGR3 associated with congenital heart disease, microcephaly, and mild intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study is consistent with the hypothesis that the BMPR1A is a plausible candidate gene for congenital heart disease (CHD)"
    explanation: Supports BMPR1A dosage as a candidate mechanism for the cardiac phenotype, while stating it as a hypothesis rather than an established fact.
  downstream:
  - target: Delayed speech and language development
    causal_link_type: DIRECT
  - target: Motor delay
    causal_link_type: DIRECT
  - target: Distinctive facial appearance
    causal_link_type: DIRECT
  - target: Abnormal heart morphology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Mild intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

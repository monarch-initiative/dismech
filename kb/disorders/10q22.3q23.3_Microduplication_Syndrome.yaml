inheritance:
- name: Autosomal dominant with reduced penetrance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The duplication arises de novo or is inherited. Penetrance is variable: the same
    duplication has been identified in clinically healthy family members of affected
    probands, so carrier status does not predict phenotype.
  evidence:
  - reference: PMID:21248748
    reference_title: The phenotype of recurrent 10q22q23 deletions and duplications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sibpair patients 10 and 11 inherited this duplication from their healthy mother.
    explanation: The Discussion directly documents maternal transmission of the recurrent duplication to two affected children.
  - reference: PMID:21248748
    reference_title: "The phenotype of recurrent 10q22q23 deletions and duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the phenotypic spectrum is broad, and duplications have also been found in healthy family members of a proband."
    explanation: Documents transmission from clinically unaffected carriers, establishing reduced penetrance.
pathophysiology:
- name: NAHR Between LCR3 and LCR4
  biological_scale: MOLECULAR
  description: >-
    The homologous LCR3 and LCR4 sequences provide a substrate for non-allelic
    homologous recombination. This is the proposed formation mechanism for the
    recurrent duplication. It does not explain every overlapping duplication,
    because rearrangements with unique breakpoints also occur.
  evidence:
  - reference: PMID:21248748
    reference_title: The phenotype of recurrent 10q22q23 deletions and duplications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The 10q22.3q23.2 region is characterised by a complex set of low-copy repeats (LCRs), which can give rise to various genomic changes mediated by non-allelic homologous recombination (NAHR).
    explanation: The Introduction describes the regional NAHR mechanism; the recurrent duplication breakpoint data support applying it to the LCR3-LCR4 gain.
    quote_role: BACKGROUND
  - reference: PMID:21248748
    reference_title: "The phenotype of recurrent 10q22q23 deletions and duplications."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five deletions and three duplications occur between LCRs3 and 4, whereas three deletions and three duplications have unique breakpoints."
    explanation: >-
      Recurrent LCR-bounded rearrangements support an NAHR mechanism by inference
      from breakpoint architecture; the study also identifies nonrecurrent events.
  downstream:
  - target: Increased Dosage of the 10q22.3q23.3 Interval
    causal_link_type: DIRECT
    description: >-
      Recombination between the repeats can produce the recurrent interval gain.
    evidence:
    - reference: PMID:21248748
      reference_title: "The phenotype of recurrent 10q22q23 deletions and duplications."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Five deletions and three duplications occur between LCRs3 and 4, whereas three deletions and three duplications have unique breakpoints."
      explanation: The recurrent duplication breakpoints support LCR-mediated formation.
- name: Increased Dosage of the 10q22.3q23.3 Interval
  biological_scale: MOLECULAR
  description: >-
    The duplication adds a copy of the affected chromosomal interval. This is a
    DNA dosage change, not a demonstration that every interval gene is
    overexpressed. The specific molecular and cellular intermediates linking the
    gain to developmental manifestations remain unresolved, and penetrance is
    incomplete.
  evidence:
  - reference: PMID:26383923
    reference_title: "Duplication of 10q22.3-q23.3 encompassing BMPR1A and NGR3 associated with congenital heart disease, microcephaly, and mild intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a de novo interstitial 8.2-Mb duplication of 10q22.3-q23.3, including BMPR1A and NGR3, was identified by Illumina SNP array platform"
    explanation: Directly establishes increased DNA copy number in an affected individual.

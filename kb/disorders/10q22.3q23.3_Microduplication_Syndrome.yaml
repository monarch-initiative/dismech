name: 10q22.3q23.3 Microduplication Syndrome
creation_date: "2026-09-02T00:00:00Z"
description: >-
  10q22.3q23.3 microduplication syndrome is a variably expressed chromosomal
  copy-number disorder. The recurrent duplication is flanked by low-copy repeats
  LCR3 and LCR4 and is described as 10q22.3q23.2 in the primary literature.
  Overlapping duplications with different breakpoints are also reported; their
  gene content and clinical effects require separate interpretation.

  Reported manifestations include speech and motor developmental delay,
  intellectual disability and variable facial dysmorphism. Strabismus,
  hypotelorism and anteverted nares were documented in two siblings with the
  recurrent duplication. Microcephaly and congenital heart disease were reported
  in a separate individual with an overlapping duplication. Clinically unaffected
  relatives can carry the recurrent duplication, indicating incomplete penetrance.

  Increased DNA copy number is established, but altered expression of individual
  genes and the intervening developmental mechanisms are not established by
  the evidence curated here. BMPR1A has been proposed as a candidate for
  congenital heart disease in a duplication carrier. The GRID1 cardiac and NRG3
  breast-development proposals in the 2011 series concern the reciprocal deletion
  and do not establish those genes as duplication susceptibility genes.
category: Genetic
synonyms:
- trisomy 10q22.3q23.3
- dup(10)(q22.3q23.3)
- 10q22.3q23.2 microduplication
- recurrent LCR3-LCR4 10q duplication
parents:
- Partial duplication of the long arm of chromosome 10

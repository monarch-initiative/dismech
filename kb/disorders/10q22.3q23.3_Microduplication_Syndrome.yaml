name: 10q22.3q23.3 Microduplication Syndrome
creation_date: "2026-09-02T00:00:00Z"
description: >-
  10q22.3q23.3 microduplication syndrome is the recurrent copy-number gain of the
  interval on the long arm of chromosome 10 flanked by the low-copy repeats LCR3 and
  LCR4. Non-allelic homologous recombination between those repeats generates a
  deletion on one product and a duplication on the other, so this entity and the
  better-characterised reciprocal 10q22.3q23.3 microdeletion syndrome arise from the
  same rearrangement mechanism. Non-recurrent duplications with unique breakpoints in
  the same region are also reported.

  The duplication is considerably less well characterised than the deletion, and the
  distinction matters clinically. Duplication probands have had speech and motor
  delay with a recognisable facial appearance - broad forehead, deep-set eyes,
  upslanting palpebral fissures, a smooth philtrum and a thin upper lip - and
  individual cases have added microcephaly, a cardiac defect and mild intellectual
  disability. Against that, the same duplication has been found in healthy relatives
  of probands, so penetrance is variable and the phenotype should be described as a
  susceptibility-conferring dosage change rather than a fully penetrant syndrome.

  BMPR1A, GRID1 and NRG3 lie within the interval and are the candidate
  dosage-sensitive genes; BMPR1A and GRID1 have been proposed for the cardiac
  phenotype and NRG3 for the breast developmental phenotype seen on the deletion
  side. None has
  been established as the sole driver of the duplication phenotype, so the mechanism
  is best modelled at present as a whole-interval dosage effect with named candidate
  genes rather than as a monogenic disorder.

  Two naming conventions are in circulation for overlapping intervals here. The
  recurrent LCR3-LCR4 rearrangement is described as 10q22.3q23.2 in some primary
  reports and as 10q22.3q23.3 in the ontology label and in the wider clinical
  literature; the entity is the same. The monogenic WAPL disorder, curated
  separately, sits inside the reciprocal deletion interval and is not this entry.
category: Genetic
synonyms:
- trisomy 10q22.3q23.3
- dup(10)(q22.3q23.3)
- 10q22.3q23.2 microduplication
- recurrent LCR3-LCR4 10q duplication

genetic:
- name: BMPR1A
  gene_term:
    preferred_term: BMPR1A
    term:
      id: hgnc:1076
      label: BMPR1A
  association: Candidate dosage-sensitive gene within the duplicated interval
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Proposed for the cardiac phenotype. Note the two proposals come from different
    arms: van Bon et al. named BMPR1A and GRID1 as candidates while describing the
    deletion cohort, whereas Tang et al. proposed BMPR1A independently on the
    duplication side. That independent duplication-side proposal is what makes the
    attribution credible here rather than borrowed from the reciprocal deletion.
    Typed SUSCEPTIBILITY because candidacy has not been upgraded to a demonstrated
    mechanism in either report.
  evidence:
  - reference: PMID:21248748
    reference_title: "The phenotype of recurrent 10q22q23 deletions and duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For cardiac defects, BMPR1A and GRID1 are putative candidate genes because of their association with cardiac structure and function."
    explanation: The candidate-gene proposal, stated by its authors as putative.
  - reference: PMID:26383923
    reference_title: "Duplication of 10q22.3-q23.3 encompassing BMPR1A and NGR3 associated with congenital heart disease, microcephaly, and mild intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study is consistent with the hypothesis that the BMPR1A is a plausible candidate gene for congenital heart disease (CHD)"
    explanation: The independent proposal made on the duplication side, in the source's own hypothetical terms.
- name: GRID1
  gene_term:
    preferred_term: GRID1
    term:
      id: hgnc:4575
      label: GRID1
  association: Candidate dosage-sensitive gene within the duplicated interval
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Proposed alongside BMPR1A for the cardiac phenotype, from the deletion cohort.
    No duplication-side evidence names it independently.
  evidence:
  - reference: PMID:21248748
    reference_title: "The phenotype of recurrent 10q22q23 deletions and duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For cardiac defects, BMPR1A and GRID1 are putative candidate genes because of their association with cardiac structure and function."
    explanation: The candidate-gene proposal, stated by its authors as putative.
- name: NRG3
  gene_term:
    preferred_term: NRG3
    term:
      id: hgnc:7999
      label: NRG3
  association: Candidate dosage-sensitive gene within the duplicated interval
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Proposed for congenital breast aplasia, which is a feature of the reciprocal
    deletion and not of the duplication. Recorded here because NRG3 lies in the
    duplicated interval and is the one interval gene with a named developmental role,
    but the phenotype it was proposed for is on the other side of the rearrangement.
  evidence:
  - reference: PMID:21248748
    reference_title: "The phenotype of recurrent 10q22q23 deletions and duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "known to be involved in early mammary gland development in mice, is a putative candidate gene"
    explanation: The NRG3 candidacy proposal. Quoted from mid-sentence because the cached full text runs the gene symbol into the surrounding words.
notes: >-
  PTEN also lies within this interval. Cancer surveillance protocols designed for
  PTEN and BMPR1A loss-of-function syndromes must not be applied to duplication
  carriers on the strength of those genes being duplicated: the mechanisms are
  opposite in direction. No cached source addresses this directly, so it is recorded
  as prose rather than as an evidenced claim.

  Siggberg et al. 2010 (DOI:10.1002/ajmg.a.33402) reports a third independent
  duplication case whose breakpoints disrupted no known gene, which would support the
  whole-interval dosage model curated here. It is cached with this PR but not cited:
  the cached record is the generic 150-patient cohort abstract, and the 10q
  case detail is full-text only, so nothing disease-specific is quotable from it.

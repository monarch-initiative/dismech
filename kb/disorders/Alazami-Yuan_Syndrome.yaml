- reference: PMID:40321225
  title: "The phenotypic spectrum of the Cornelia de Lange-like \"Alazami-Yuan syndrome\": A case report of the 7th diagnosed individual and review of the literature."

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Disease requires biallelic TAF6 variants: homozygous alleles in the
    consanguineous Turkish and Saudi founding families, and compound
    heterozygous alleles in later non-consanguineous probands. Heterozygous
    carrier parents are unaffected.
  evidence:
  - reference: PMID:25574841
    reference_title: "Global transcriptional disturbances underlie Cornelia de Lange syndrome and related phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consistent with recessive Mendelian inheritance, the unaffected siblings were WT reference, while the parents were both heterozygous carriers"
    explanation: Segregation in the Saudi multiplex family shows affected homozygotes and unaffected heterozygous parents.
  - reference: PMID:35317131
    reference_title: "Novel compound heterozygous variants in the TAF6 gene in a patient with Alazami-Yuan syndrome: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation of c.1052delT was from his mother and the mutation of c.76A>T was from his father."
    explanation: A compound heterozygous proband with one allele inherited from each unaffected parent, consistent with recessive inheritance outside consanguinity.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >
    No population estimate exists. A 2025 review counted seven published
    individuals from five families; two further single probands (a Taiwanese
    compound heterozygote in a whole-exome series and a Jordanian homozygote
    with drug-resistant epilepsy) have been reported since, so fewer than ten
    molecularly confirmed individuals are known.
  evidence:
  - reference: PMID:40321225
    reference_title: "The phenotypic spectrum of the Cornelia de Lange-like \"Alazami-Yuan syndrome\": A case report of the 7th diagnosed individual and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alazami‐Yuan syndrome was first reported in 2015, and there are six individuals with this syndrome from four families reported in literature to date. This individual represents the seventh case of AYS"
    explanation: Gives the count of published cases, which is the only available occurrence measure.

pathophysiology:
- name: TAF6 Biallelic Variants
  role: trigger
  biological_scale: MOLECULAR
  description: >
    Biallelic germline TAF6 variants are the initiating lesion. The two
    founding missense alleles, p.Arg46Cys and p.Ile71Thr, both fall in the
    N-terminal histone-fold domain through which TAF6 assembles into the TFIID
    core. Later probands carry a missense allele in trans with a frameshift
    (c.1052delT, c.1863dup) or a homozygous frameshift (c.610_611delGC). The
    founding missense alleles retain enough function to support viability: they
    caused only a slight growth reduction when tested in a yeast taf6
    temperature-sensitive strain, which the authors read as compatible with
    survival of homozygous patients. Whether every allele is hypomorphic, or
    some combinations are near-null, is not established.
  genes:
  - preferred_term: TAF6
    term:
      id: hgnc:11540
      label: TAF6
  evidence:
  - reference: PMID:25574841
    reference_title: "Global transcriptional disturbances underlie Cornelia de Lange syndrome and related phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in families from 2 separate world populations segregating an autosomal-recessive disorder with CdLS-like features, we identified homozygous mutations in TAF6"
    explanation: The founding report establishing biallelic TAF6 variants as the cause of the syndrome.
  - reference: PMID:25558065
    reference_title: "Accelerating novel candidate gene discovery in neurogenetic disorders via whole-exome sequencing of prescreened multiplex consanguineous families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This prescreening step led to the identification of 69 recessive genes not previously associated with disease, of which 33 are here described (SPDL1, TUBA3E, INO80, NID1, TSEN15, DMBX1, CLHC1, C12orf4, WDR93, ST7, MATN4, SEC24D, PCDHB4, PTPN23, TAF6, TBCK, FAM177A1, KIAA1109, MTSS1L, XIRP1, KCTD3, CHAF1B, ARV1, ISCA2, PTRH2, GEMIN4, MYOCD, PDPR, DPH1, NUP107, TMEM92, EPB41L4A, and FAM120AOS)."
    explanation: The simultaneous Saudi consanguineous-family study naming TAF6 as a novel recessive neurogenetic disease gene; together with the Yuan report it gives the syndrome its name.
  - reference: PMID:25574841
    reference_title: "Global transcriptional disturbances underlie Cornelia de Lange syndrome and related phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Given that both mutations locate in the histone fold of the N-terminal region"
    explanation: Places both founding missense alleles in the TAF6 histone-fold domain.
  - reference: PMID:25574841
    reference_title: "Global transcriptional disturbances underlie Cornelia de Lange syndrome and related phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "There was a slight but not obvious reduction in the growth patterns in mutant transformants"
    explanation: Yeast complementation shows the patient-equivalent taf6 alleles are largely functional for growth, consistent with partial rather than complete loss of function.
  downstream:
  - target: Disrupted TAF6 Binding to TFIID Subunits
    causal_link_type: DIRECT
    description: >
      Both founding missense alleles, introduced into the TAF6 N-terminal
      region, reduce co-immunoprecipitation of TAF6 with TFIID subunits.
    evidence:
    - reference: PMID:25574841
      reference_title: "Global transcriptional disturbances underlie Cornelia de Lange syndrome and related phenotypes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Coimmunoprecipitation (co-IP) experiments revealed that the binding affinities between mutated hTAF6N and TFIID components were reduced"
      explanation: The patient variants themselves were tested, so the variant-to-binding step is measured rather than inferred.

- name: Disrupted TAF6 Binding to TFIID Subunits
  role: intermediate
  biological_scale: MOLECULAR
  description: >
    In Drosophila S2 cells depleted of endogenous TAF6, human TAF6 N-terminal
    fragments carrying p.Arg46Cys or p.Ile71Thr co-precipitate less of the
    TFIID subunits TAF1, TAF4, TAF9 and TBP. p.Ile71Thr reduces binding to all
    four; p.Arg46Cys reduces it moderately; both lose binding to TBP. The assay
    uses a truncated human fragment in insect cells and has not been repeated
    in patient cells, and the frameshift alleles found in later probands have
    not been tested.
  protein_complexes:
  - preferred_term: TFIID complex
    term:
      id: GO:0005669
      label: transcription factor TFIID complex
  evidence:
  - reference: PMID:25574841
    reference_title: "Global transcriptional disturbances underlie Cornelia de Lange syndrome and related phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "hTAF6NR46C moderately lost its interaction with most of the components we tested, while hTAF6NI71T largely reduced the binding ability with all the components. Nevertheless, both hTAF6N mutants lost their interaction with dTBP."
    explanation: Grades the binding defect per allele and shows the shared loss of TBP interaction.
  downstream:
  - target: Impaired TFIID-Dependent Transcription Initiation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      TAF6 stabilizes the core promoter-recognition TFIID complex, so reduced
      TAF6 binding to its partners is proposed to destabilize TFIID. Complex
      stability and promoter function were not measured, so this step rests on
      TAF6's known normal role.
    evidence:
    - reference: PMID:25574841
      reference_title: "Global transcriptional disturbances underlie Cornelia de Lange syndrome and related phenotypes."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Therefore, these 2 mutations disrupted the interactions between TAF6 and other TFIID components, which may lead to the instability of this complex"
      explanation: The authors' own inference from the binding data to TFIID instability; instability itself was not measured.
    - reference: PMID:30405110
      reference_title: "Molecular structure of promoter-bound yeast TFIID."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "The compact tri lobed architecture is stabilized by a topologically closed Taf5-Taf6 tetramer."
      explanation: The promoter-bound TFIID structure shows that Taf6 is an architectural subunit holding the complex together, which is why loss of TAF6 partner binding is expected to destabilize TFIID. Yeast structure, not the patient alleles.

- name: Impaired TFIID-Dependent Transcription Initiation
  role: intermediate
  biological_scale: MOLECULAR
  description: >
    TFIID, built from TBP and the TBP-associated factors with TAF6 in its
    core, is required for RNA polymerase II transcription initiation. A
    destabilized TFIID is proposed to perturb transcription initiation broadly,
    which is the basis for grouping Alazami-Yuan syndrome with the TAFopathies
    and with the Cornelia de Lange-like "transcriptomopathies". No study has
    measured TFIID assembly, promoter occupancy, or the transcriptome in
    patient material, and why a defect in a ubiquitous general transcription
    factor yields a tissue-restricted developmental phenotype is unexplained.
  biological_processes:
  - preferred_term: RNA polymerase II preinitiation complex assembly
    term:
      id: GO:0051123
      label: RNA polymerase II preinitiation complex assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:25574841
    reference_title: "Global transcriptional disturbances underlie Cornelia de Lange syndrome and related phenotypes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TFIID is a megadalton-sized multiprotein complex necessary for RNA Pol II–initiated transcription, which reads epigenetic markers or interacts with transcriptional activators. It consists of TBP and TAFs (54), which include TAF6 as a major component."
    explanation: States the normal role of TFIID and TAF6 within it; graded OTHER because this is the paper's background framing rather than its own measurement.
  - reference: PMID:25574841
    reference_title: "Global transcriptional disturbances underlie Cornelia de Lange syndrome and related phenotypes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The defects in TAF6 may result in perturbed transcriptions initiation by RNA Pol II."
    explanation: The founding paper's proposed consequence of the TAF6 variants for transcription initiation, stated as a possibility.
  - reference: PMID:29485702
    reference_title: "Mutational analysis of TAF6 revealed the essential requirement of the histone-fold domain and the HEAT repeat domain for transcriptional activation."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The TAF6 mutants were highly defective for transcriptional activation by the Gcn4 and Gal4 activators. CHIP assays showed that the TAF6-HFD and the TAF6-HEAT domain mutations independently abrogated the promoter occupancy of TFIID and SAGA complex in vivo."
    explanation: In yeast, substitutions in the TAF6 histone-fold domain, the domain carrying the founding human alleles, abolish TFIID promoter occupancy and activated transcription. INDIRECT because these are not the patient alleles and yeast TAF6 also serves SAGA.
  downstream:
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - tafopathy_transcriptomopathy
    description: >
      Proposed route from global transcriptional disturbance to the
      neurodevelopmental phenotype; the intervening developmental steps are
      unknown.
    evidence:
    - reference: PMID:40321225
      reference_title: "The phenotypic spectrum of the Cornelia de Lange-like \"Alazami-Yuan syndrome\": A case report of the 7th diagnosed individual and review of the literature."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "Her clinical course further supports that loss of function of TAF6 leads to symptoms similar to, but ultimately distinct from CdLS, with this similarity likely driven by transcription dysregulation that occurs in both conditions."
      explanation: Attributes the CdLS-overlapping phenotype, of which intellectual disability is a core feature, to transcriptional dysregulation; the authors' interpretation rather than a measured link.
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - tafopathy_transcriptomopathy
  - target: Highly arched eyebrow
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - tafopathy_transcriptomopathy
  - target: Synophrys
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - tafopathy_transcriptomopathy
  - target: Long eyelashes
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - tafopathy_transcriptomopathy
  - target: Low anterior hairline
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

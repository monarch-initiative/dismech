name: Alazami-Yuan Syndrome
creation_date: "2026-10-30T23:00:06Z"
category: Mendelian
disease_term:
  preferred_term: Alazami-Yuan syndrome
  term:
    id: MONDO:0014931
    label: Alazami-Yuan syndrome
parents:
- syndromic intellectual disability
- Cornelia de Lange-like disorder
- TAFopathy
synonyms:
- ALYUS
- AYS
- TAF6-related Alazami-Yuan syndrome
description: >
  Alazami-Yuan syndrome (ALYUS) is an ultra-rare autosomal recessive
  neurodevelopmental syndrome caused by biallelic variants in TAF6, which
  encodes a core histone-fold subunit of the general transcription factor
  TFIID. Affected individuals show developmental delay and intellectual
  disability with a Cornelia de Lange-like facial gestalt (highly arched
  eyebrows, long eyelashes, synophrys, low anterior hairline, prominent nasal
  bridge, thin upper lip), hypertrichosis, growth restriction, microcephaly,
  and broad halluces with 2-3 toe syndactyly. Sensorineural hearing loss,
  congenital cataract, scoliosis, cryptorchidism and, in single reports,
  drug-resistant epilepsy and complete atrioventricular block extend the
  spectrum. No affected individual has met the clinical criteria for classic
  Cornelia de Lange syndrome. The two founding missense alleles lie in the
  TAF6 N-terminal histone fold and reduce binding of TAF6 to other TFIID
  subunits, which is thought to destabilize TFIID and perturb RNA polymerase
  II transcription initiation; the disorder is accordingly grouped with the
  TAFopathies and the CdLS-like "transcriptomopathies". Fewer than ten
  molecularly confirmed individuals have been published.

references:
- reference: PMID:25574841

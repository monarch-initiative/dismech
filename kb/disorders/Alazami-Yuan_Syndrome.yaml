experimental_models:
- name: Drosophila S2 cell TAF6 replacement co-immunoprecipitation assay
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: Drosophila melanogaster
    term:
      id: NCBITaxon:7227
      label: Drosophila melanogaster
  cell_source: Drosophila S2 cells with dsRNA knockdown of endogenous dTaf6 C-terminal region
  publication: PMID:25574841
  description: >
    FLAG-tagged human TAF6 N-terminal fragments (wild type, p.Arg46Cys,
    p.Ile71Thr) were expressed in S2 cells depleted of endogenous dTAF6 and
    co-immunoprecipitated with dTAF1, dTAF4, dTAF9 and dTBP.
  modeled_mechanisms:
  - target: Disrupted TAF6 Binding to TFIID Subunits
    relationship: MEASURES
    fidelity: LOW
    model_scale: MOLECULAR
    description: >
      Measures the binding defect of the patient histone-fold alleles toward
      TFIID partners.
    limitations: >
      Uses a truncated human TAF6 fragment overexpressed in insect cells
      against fly TFIID partners, not full-length TAF6 at endogenous level in
      human or patient cells; TFIID stability and transcription were not
      measured.
    readouts:
    - name: Co-immunoprecipitation of TFIID subunits with mutant TAF6N
      target: Disrupted TAF6 Binding to TFIID Subunits
      direction: DECREASED
      interpretation: Both patient alleles reduce TAF6 binding to TFIID subunits, and both lose TBP binding.
      evidence:
      - reference: PMID:25574841
        reference_title: "Global transcriptional disturbances underlie Cornelia de Lange syndrome and related phenotypes."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Nevertheless, both hTAF6N mutants lost their interaction with dTBP."
        explanation: Reports the shared loss of TBP binding.
    evidence:
    - reference: PMID:25574841
      reference_title: "Global transcriptional disturbances underlie Cornelia de Lange syndrome and related phenotypes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In addition, the N-terminal region of TAF6 (TAF6N) is sufficient for TFIID stability in S2 cells (34)."
      explanation: Justifies using the N-terminal fragment in S2 cells as a readout of TFIID-relevant TAF6 function.

differential_diagnoses:
- name: Cornelia de Lange syndrome
  description: >
    Classic CdLS shares the arched eyebrows, synophrys, long eyelashes,
    hypertrichosis, growth restriction and intellectual disability, and several
    AYS individuals carried a clinical CdLS diagnosis before molecular testing.
    No AYS individual has met the clinical score for classic CdLS.
  distinguishing_features:
  - Prominent nasal bridge and low hairline in AYS, versus a short nose with concave nasal ridge in CdLS
  - Absence in AYS of oligodactyly, other hand anomalies and congenital diaphragmatic hernia
  - Autosomal recessive TAF6 variants rather than cohesin-pathway variants (NIPBL, SMC1A, SMC3, RAD21, HDAC8)
  evidence:
  - reference: PMID:40321225
    reference_title: "The phenotypic spectrum of the Cornelia de Lange-like \"Alazami-Yuan syndrome\": A case report of the 7th diagnosed individual and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, no individuals with AYS had a short nose with a concave nasal ridge, hand anomalies, or congenital diaphragmatic hernia that are more specific features of CdLS."
    explanation: Gives the features that separate AYS from CdLS.
  - reference: PMID:40321225
    reference_title: "The phenotypic spectrum of the Cornelia de Lange-like \"Alazami-Yuan syndrome\": A case report of the 7th diagnosed individual and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Table 2 demonstrates that all AYS indiviuals have enough symptoms to merit CdLS testing, though none meet enough criteria for a clinical diagnosis of classic CdLS."
    explanation: Clinical CdLS scoring places AYS as CdLS-like but not classic CdLS.
- name: Other TAFopathies
  description: >
    Variants in other TFIID subunits, including TBP, TAF1 (X-linked TAF1
    intellectual disability syndrome, curated separately) and TAF2, produce
    overlapping syndromic intellectual disability with craniofacial anomalies,
    so the differential is resolved by sequencing.
  distinguishing_features:
  - Which TFIID subunit carries the variant
  - TAF1 disease is X-linked whereas Alazami-Yuan syndrome is autosomal recessive
  evidence:
  - reference: PMID:37746814
    reference_title: "Deletion of taf1 and taf5 in zebrafish capitulate cardiac and craniofacial abnormalities associated with TAFopathies through perturbations in metabolism."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This syndrome has been termed as a TAFopathy and includes mutations in TATA binding protein (TBP), TAF1, TAF2, and TAF6."
    explanation: Names the TAFopathy group and its member genes; graded OTHER because it is the zebrafish study's background framing.

mechanistic_hypotheses:
- hypothesis_group_id: tafopathy_transcriptomopathy
  hypothesis_label: Global transcriptional disturbance from TFIID destabilization drives the CdLS-like phenotype
  status: EMERGING
  description: >
    The founding report proposed that CdLS and the clinically related
    syndromes form a class of "transcriptomopathies", in which a disturbance
    of the transcription machinery rather than of cohesin per se produces the
    shared phenotype, and placed TAF6 in that class through its role in
    TFIID. The edges from impaired TFIID-dependent transcription to individual
    phenotypes belong to this group. No patient-derived transcriptome, TFIID
    assembly assay, or animal model of the human alleles has been reported,
    and how a ubiquitous general transcription factor defect yields tissue-
    restricted features is unexplained.
  evidence:
  - reference: PMID:25574841
    reference_title: "Global transcriptional disturbances underlie Cornelia de Lange syndrome and related phenotypes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "As the cohesin may participate in the same pathway as the genes involved in transcriptional regulation, the identification of deleterious mutations in TAF6 strongly supports the hypothesis that defects of genes involved in the transcription machinery, such as complexes with function of chromatin structure remodeling and transcriptional regulation, may result in a spectrum of disorders resembling CdLS."
    explanation: The founding statement of the hypothesis as it applies to TAF6.
  - reference: PMID:25574841
    reference_title: "Global transcriptional disturbances underlie Cornelia de Lange syndrome and related phenotypes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is not immediately apparent why perturbation of a component of a ubiquitously expressed general transcription factor complex may result in a tissue-specific phenotype, such as CdLS."
    explanation: The same paper records the unexplained tissue specificity that keeps this hypothesis EMERGING.

discussions:
- discussion_id: taf6_no_patient_cell_transcription_data
  kind: KNOWLEDGE_GAP
  prompt: >
    Do TAF6 patient alleles actually destabilize TFIID and alter RNA
    polymerase II transcription in human cells, and which genes mediate the
    craniofacial, neurodevelopmental and growth phenotypes?
  attaches_to:
  - pathophysiology#Impaired TFIID-Dependent Transcription Initiation
  - mechanistic_hypotheses#tafopathy_transcriptomopathy
  rationale: >
    The only functional data are co-immunoprecipitation of a truncated human
    TAF6 fragment in Drosophila cells and a yeast growth assay in which the
    patient-equivalent alleles had little effect. TFIID assembly, promoter
    occupancy, and the transcriptome have not been measured in patient cells,
    and the frameshift alleles found in later probands have not been tested at
    all. Every causal step past the binding defect is therefore inferred from
    TAF6's normal role.
  evidence:
  - reference: PMID:25574841
    reference_title: "Global transcriptional disturbances underlie Cornelia de Lange syndrome and related phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus, this yeast growth assay may not be an optimal and conclusive approach to studying the downstream effects of these 2 perhaps more subtle mutations."
    explanation: The authors themselves note that the available organismal assay cannot resolve the downstream effects of the patient alleles.
- discussion_id: taf6_genotype_phenotype_variability
  kind: KNOWLEDGE_GAP
  prompt: >
    Why do some biallelic TAF6 genotypes cause severe developmental delay,
    epilepsy and heart block while another causes CdLS-like facial features
    with normal intelligence?
  attaches_to:
  - genetic#TAF6
  - phenotypes#Intellectual disability
  - phenotypes#Seizure
  rationale: >
    The phenotype ranges from normal intelligence (c.1052delT / c.76A>T) to
    drug-resistant epileptic encephalopathy with complete heart block
    (homozygous c.610_611delGC). With fewer than ten published individuals,
    including one c.76A>T allele of uncertain significance, it is unknown
    whether this reflects residual TAF6 function, allele position (histone fold
    versus C-terminal HEAT domain), or ascertainment.
  evidence:
  - reference: PMID:35317131
    reference_title: "Novel compound heterozygous variants in the TAF6 gene in a patient with Alazami-Yuan syndrome: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main clinical manifestations were rapid development of puberty, typical facial features of Cornelia de Lange syndrome, and normal intelligence."
    explanation: The mild end of the spectrum.
  - reference: PMID:42923476
    reference_title: "Transcutaneous Auricular Vagus Nerve Stimulation in a Pacemaker-Dependent Child with Syndromic Drug-Resistant Epilepsy: A Case Report with Prospective 9-Month Follow-Up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a 6-year-old boy with genetically confirmed TAF6-related Alazami-Yuan syndrome, severe developmental impairment, complete atrioventricular block requiring permanent epicardial VVIR pacing, and syndromic DRE refractory to multiple antiseizure medications (ASMs)."
    explanation: The severe end of the spectrum.

notes: >
  No GeneReviews chapter exists for Alazami-Yuan syndrome; the phenotype
  baseline is the 2025 seven-case literature review (PMID:40321225) plus two
  later single-case reports. Phenotype frequency bands are taken from that
  review's seven individuals and should be read as small-number estimates.

  Phenotypes deliberately left without an incoming causal edge: Hypotonia,
  Seizure, 2-3 toe syndactyly, Scoliosis, Accelerated skeletal maturation,
  Developmental cataract, Third degree atrioventricular block and
  Cryptorchidism. The edges that do exist come from the source's own list of
  features AYS shares with CdLS, which it attributes to transcriptional
  dysregulation; the features above are outside that list, mostly reported in
  one or two individuals, and no source proposes a mechanism for them. The
  review's authors raise TFIID-mediated transcription as a possible link to
  congenital cataract but describe it as not yet described.

  The seventh reported individual also had palindromic rheumatism with
  anti-SS-B antibodies; the authors could not tell whether autoimmunity is a
  feature of AYS or a comorbidity, so it is not curated as a phenotype here.
  The Tuc et al. 2020 letter (PMID:32030742, the third family) has no
  retrievable abstract or full text in the reference cache and is not cited.

  No `conforms_to` module was declared, for the same reason recorded in the
  TAF1 entry (Intellectual_Disability_X-linked_Syndromic_33): no TFIID or
  general-transcription-machinery module exists in `kb/modules/`, and the
  chromatin-machinery module excludes general transcription factors.

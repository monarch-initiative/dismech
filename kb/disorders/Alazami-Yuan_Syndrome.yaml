phenotypes:
- category: Neurological
  name: Intellectual disability
  frequency: VERY_FREQUENT
  description: >
    Intellectual disability is present in nearly all reported individuals
    (6 of 7 in the 2025 review). One compound heterozygous boy (c.1052delT /
    c.76A>T) had normal intelligence, so cognitive outcome is variable.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:25574841
    reference_title: "Global transcriptional disturbances underlie Cornelia de Lange syndrome and related phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "were referred for evaluation because of ID and dysmorphic features"
    explanation: The three affected Saudi siblings presented with intellectual disability.
  - reference: PMID:40321225
    reference_title: "The phenotypic spectrum of the Cornelia de Lange-like \"Alazami-Yuan syndrome\": A case report of the 7th diagnosed individual and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Arched eyebrows and long eyelashes were the only universal findings among AYS individuals, though a low hairline, synophrys, prominent nasal bridge, thin upper lip, hypertrichosis, DD/ID, and prenatal growth failure were frequently seen."
    explanation: Literature review of seven individuals lists DD/ID among the frequent findings.
  - reference: PMID:35317131
    reference_title: "Novel compound heterozygous variants in the TAF6 gene in a patient with Alazami-Yuan syndrome: A case report."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The main clinical manifestations were rapid development of puberty, typical facial features of Cornelia de Lange syndrome, and normal intelligence."
    explanation: One compound heterozygous proband had normal intelligence, so intellectual disability is not universal.


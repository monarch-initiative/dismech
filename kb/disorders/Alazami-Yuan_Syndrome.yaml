genetic:
- name: TAF6
  gene_term:
    preferred_term: TAF6
    term:
      id: hgnc:11540
      label: TAF6
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:25574841
      reference_title: "Global transcriptional disturbances underlie Cornelia de Lange syndrome and related phenotypes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Consistent with recessive Mendelian inheritance, the unaffected siblings were WT reference, while the parents were both heterozygous carriers"
      explanation: Recessive segregation of the TAF6 variant in the Saudi family.
  notes: >
    TAF6 maps to 7q22.1 and encodes a histone H4-like TFIID subunit. The
    p.Ile71Thr allele recurs: homozygous in the Saudi family and in a Turkish
    proband, and in trans with c.1863dup in the seventh reported individual.
    Variant descriptions follow NM_005641; the seventh-case report also gives
    NM_001190415.1 coordinates (c.323T>C, c.1974dup) for the same alleles. The
    c.76A>T p.(Met26Leu) allele was classified as of uncertain significance by
    its reporters. No ClinGen gene-disease validity assertion for TAF6 was
    found in the committed caches.
  evidence:
  - reference: PMID:40321225
    reference_title: "The phenotypic spectrum of the Cornelia de Lange-like \"Alazami-Yuan syndrome\": A case report of the 7th diagnosed individual and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alazami‐Yuan syndrome (AYS) is an autosomal recessive Cornelia de Lange‐like syndrome caused by loss of function variants in TAF6."
    explanation: States the gene-disease relationship and recessive mode.
  variants:
  - name: TAF6 c.136C>T p.(Arg46Cys)
    description: >
      Homozygous histone-fold missense variant in a Turkish proband (CdLS-4)
      born to consanguineous parents; reduces TAF6 binding to TFIID subunits
      in co-immunoprecipitation.
    evidence:
    - reference: PMID:25574841
      reference_title: "Global transcriptional disturbances underlie Cornelia de Lange syndrome and related phenotypes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In 1 patient (CdLS-4), we identified a deleterious homozygous variant (Chr7: g.99711697 G>A ... c.C136T, p.Arg46Cys) in TAF6"
      explanation: Reports the variant and its homozygous state.
  - name: TAF6 c.212T>C p.(Ile71Thr)
    description: >
      Recurrent histone-fold missense variant, homozygous in three affected
      Saudi siblings and in a Turkish proband, and compound heterozygous with
      c.1863dup in the seventh reported individual.
    evidence:
    - reference: PMID:25574841
      reference_title: "Global transcriptional disturbances underlie Cornelia de Lange syndrome and related phenotypes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Independently, a variant in TAF6 (Chr7: g.99711522 A>G ... c.T212C, p.Ile71Thr) was identified in a cohort of multiplex consanguineous Saudi families with syndromic ID."
      explanation: Reports the variant in the Saudi family.
    - reference: PMID:40321225
      reference_title: "The phenotypic spectrum of the Cornelia de Lange-like \"Alazami-Yuan syndrome\": A case report of the 7th diagnosed individual and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The likely pathogenic c.212T>C p. (Ile71Thr) variant identified in this individual has been previously reported in a homozygous state in four individuals from two families with AYS and segregated with the disease"
      explanation: Establishes recurrence of the allele across families.
  - name: TAF6 c.1863dup p.(Thr622HisfsTer?)
    description: >
      Last-exon duplication predicted to replace the final 56 codons with an
      extended reading frame. Blood RNA showed no reduction in transcript level,
      so the allele is not thought to trigger nonsense-mediated decay.
    evidence:
    - reference: PMID:40321225
      reference_title: "The phenotypic spectrum of the Cornelia de Lange-like \"Alazami-Yuan syndrome\": A case report of the 7th diagnosed individual and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This suggests the variant does not trigger mRNA decay and its effect is more likely at the protein translation initiation, protein stability, or protein function level."
      explanation: Transcriptome analysis argues against mRNA decay for this allele.
  - name: TAF6 c.1052delT p.(Ile351ThrfsTer40)
    description: >
      Maternally inherited frameshift in trans with paternal c.76A>T
      p.(Met26Leu) in a Chinese boy with normal intelligence.
    evidence:
    - reference: PMID:35317131
      reference_title: "Novel compound heterozygous variants in the TAF6 gene in a patient with Alazami-Yuan syndrome: A case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "one of which was an unreported frameshift mutation c.1052delT (p.I351Tfs*40), which may lead to the loss of gene function"
      explanation: Reports the frameshift allele.
  - name: TAF6 c.610_611delGC p.(Ala204fs)
    description: >
      Homozygous exon 7 frameshift in a Jordanian boy with severe developmental
      delay, drug-resistant epilepsy and complete heart block; an older brother
      with similar features died in adolescence untested.
    evidence:
    - reference: PMID:42923476
      reference_title: "Transcutaneous Auricular Vagus Nerve Stimulation in a Pacemaker-Dependent Child with Syndromic Drug-Resistant Epilepsy: A Case Report with Prospective 9-Month Follow-Up."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic testing identified a homozygous pathogenic TAF6 mutation (exon 7 c.610_611delGC, p.Ala204fs), consistent with Alazami-Yuan syndrome."
      explanation: Reports the homozygous frameshift allele.


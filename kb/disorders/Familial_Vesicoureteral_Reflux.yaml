- name: VUR7
  display_name: Vesicoureteral reflux 7 (VUR7, 12p11-q13, recessive)
  subtype_term:
    preferred_term: vesicoureteral reflux 7
    term:
      id: MONDO:0014161
      label: vesicoureteral reflux 7
  description: >
    Recessively inherited primary VUR mapping to chromosome 12p11-q13. Unlike
    the other loci, it emerged only when a recessive model was tested, and it
    contributed across pedigrees of several ancestries, suggesting a relatively
    common recessive risk allele.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:19443636
      reference_title: "A recessive gene for primary vesicoureteral reflux maps to chromosome 12p11-q13."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Analysis under the dominant model yielded no signals across the entire genome."
      explanation: >
        The VUR7 locus is invisible under a dominant model and appears only
        under a recessive one, defining this subtype's mode of inheritance.
  evidence:
  - reference: PMID:19443636
    reference_title: "A recessive gene for primary vesicoureteral reflux maps to chromosome 12p11-q13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The linkage signal on chromosome 12p11-q13 originated from pedigrees of varying ethnicity, suggesting that recessive inheritance of a high frequency risk allele occurs in pVUR kindreds from many different populations."
    explanation: >
      Defines the recessive VUR7 locus and its cross-population contribution.
- name: VUR8
  display_name: Vesicoureteral reflux 8 (VUR8, TNXB)
  subtype_term:
    preferred_term: vesicoureteral reflux 8
    term:
      id: MONDO:0014422
      label: vesicoureteral reflux 8
  description: >
    VUR caused by heterozygous missense variants in TNXB (tenascin XB, 6p21.3),
    an extracellular matrix glycoprotein expressed in the developing
    ureterovesical junction. Affected individuals frequently also have joint
    hypermobility, reflecting the connective-tissue role of tenascin X. TNXB
    carriers in a Chinese registry had a higher hazard of progression to kidney
    failure, although that estimate rests on only three carriers and the
    confidence interval is correspondingly wide (HR 20.3, 95% CI 2.4-168.7).
    TNXB is the most common identified cause of autosomal dominant familial
    primary VUR, found in about 9% of families in the largest sequenced cohort.
  subtype_frequency: about 9% of familial primary VUR families
  genes:
  - preferred_term: TNXB
    term:
      id: hgnc:11976
      label: TNXB
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:23620400
      reference_title: "TNXB mutations can cause vesicoureteral reflux."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This mutation segregated with disease in the affected family as well as with a pathogenic G1331R change in another family."
      explanation: >
        Heterozygous TNXB missense variants segregating with disease in two
        families support dominant transmission of VUR8.
  evidence:
  - reference: PMID:23620400
    reference_title: "TNXB mutations can cause vesicoureteral reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We obtained a significant multipoint parametric logarithm of odds score of 3.3 on chromosome 6p, and whole-exome sequencing identified a deleterious heterozygous mutation (T3257I) in the gene encoding tenascin XB (TNXB in 6p21.3)."
    explanation: >
      Establishes TNXB as the VUR8 gene by linkage plus exome sequencing in a
      hereditary VUR family.
  - reference: PMID:26408188
    reference_title: "Rare variants in tenascin genes in a cohort of children with primary vesicoureteric reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all the individuals with the TNXB variants who had joint mobility examination done have significant joint hypermobility as assessed by Beighton score"
    explanation: >
      Documents the connective-tissue (joint hypermobility) feature that
      accompanies TNXB-related familial VUR.
- name: VURX
  display_name: Vesicoureteral reflux, X-linked (VURX)
  subtype_term:
    preferred_term: vesicoureteral reflux, X-linked
    term:
      id: MONDO:0010755
      label: vesicoureteral reflux, X-linked
  description: >
    A rare X-linked form of familial vesicoureteral reflux recognised as a
    distinct OMIM entry (314550) outside the autosomal VUR1-VUR8 series, based
    on isolated pedigrees in which only male relatives connected through
    unaffected females are affected. No causal gene has been identified, and the
    overall evidence for X linkage in VUR is weak: male-to-male transmission and
    the female predominance of VUR argue against it, so this subtype is retained
    for completeness of the nosology rather than as an established molecular
    entity.
  inheritance:
  - name: X-linked
    inheritance_term:
      preferred_term: X-linked inheritance
      term:
        id: HP:0001417
        label: X-linked inheritance
    evidence:
    - reference: PMID:1142496
      reference_title: "Sex-linked familial reflux."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A family is described in which all 3 brothers and the maternal grandfather had vesicoureteral reflux, whereas the father, mother and 3 daughters were urologically normal."
      explanation: >
        The classic pedigree underlying the X-linked VUR designation.
    - reference: PMID:1142496
      supports: PARTIAL
      reference_title: "Sex-linked familial reflux."
      evidence_source: HUMAN_CLINICAL
      snippet: "Nevertheless, available evidence indicates that familial reflux is usually transmitted by multifactorial polygenic inheritance."
      explanation: >
        The same report cautions that X linkage is the exception, not the rule,
        in familial VUR.
  evidence:
  - reference: PMID:1142496
    reference_title: "Sex-linked familial reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This pedigree strongly suggests and X-linked mode of genetic transmission."
    explanation: >
      Original description of an apparently X-linked familial VUR pedigree
      (quoted verbatim, including the typographical error in the abstract).
  - reference: PMID:21981614
    reference_title: "Genome gender diversity in affected sib-pairs with familial vesico-ureteric reflux identified by single nucleotide polymorphism linkage analysis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "On the other hand male-to-male transmission and a higher ratio of females to males argued against X-linked inheritance."
    explanation: >
      Counter-evidence: the epidemiology of familial VUR as a whole is
      inconsistent with X-linked inheritance, so VURX remains a contested,
      pedigree-level designation.

prevalence:
- population: Newborns (all-cause vesicoureteral reflux, general population)
  measure_type: BIRTH_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1000.0
  notes: >
    Approximately 1% of newborns; older white-population estimates give 1-2%.
    This is the prevalence of primary VUR overall; the fraction of that total
    that is familial is not established, so the number should be read as an
    upper bound on the prevalence of familial VUR rather than an estimate of
    it.
  evidence:
  - reference: PMID:33085409
    reference_title: "Vesicoureteral Reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "VUR is the most prevalent urological abnormality in neonates, occurring in approximately 1% of all newborns."
    explanation: Population prevalence of VUR in newborns.
  - reference: PMID:10739767
    reference_title: "Primary, nonsyndromic vesicoureteric reflux and its nephropathy is genetically heterogeneous, with a locus on chromosome 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary vesicoureteric reflux (VUR) affects 1%-2% of whites, and reflux nephropathy (RN) causes up to 15% of end-stage renal failure in children and adults."
    explanation: Independent estimate of 1-2% in white populations.
- population: Siblings of an index case
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 30000.0
  rate_low: 27000.0
  rate_high: 46000.0
  notes: >
    Sibling recurrence risk is roughly 30% (reported range 27-46%, highest in
    children aged 3 years or younger) — the core epidemiological evidence for a
    strong genetic contribution.
  evidence:
  - reference: PMID:33085409
    reference_title: "Vesicoureteral Reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Baseline ultrasound imaging for siblings of patients with VUR is recommended, as their incidence of VUR is reported to be between 27% and 46%, particularly in those children aged 3 or younger."
    explanation: Quantifies the sibling recurrence range.
  - reference: PMID:21441121
    reference_title: "Primary, nonsyndromic vesicoureteric reflux and nephropathy in sibling pairs: a United Kingdom cohort for a DNA bank."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "VUR appears to be an inherited condition and is reported in approximately one third of siblings of index cases."
    explanation: Independent estimate of the sibling recurrence risk.
- population: Offspring of an affected parent
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 50000.0
  rate_high: 66000.0
  notes: >
    Vertical transmission approaches 50% in the largest family series, with
    reports of up to two-thirds among children of affected mothers; the central
    estimate is set at the ~50% transmission rate and the two-thirds figure is
    recorded as the upper bound.
  evidence:
  - reference: PMID:29097723
    reference_title: "Genome-wide linkage and association study implicates the 10q26 region as a major genetic contributor to primary nonsyndromic vesicoureteric reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary VUR is familial, with transmission rate and sibling risk both approaching 50%, and appears highly genetically heterogeneous."
    explanation: >
      Source of the central ~50% parent-to-child transmission estimate, from the
      largest genetic study of VUR.
  - reference: PMID:33085409
    reference_title: "Vesicoureteral Reflux."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "A genetic predisposition for the disorder exists, as up to two-thirds of children born to women with primary VUR will also exhibit the condition."
    explanation: >
      Supports the upper bound only; the source states "up to" two-thirds, so it
      cannot be read as a point estimate.

pathophysiology:
- name: SLIT2-ROBO2 Signaling Loss
  biological_scale: MOLECULAR
  role: trigger
  description: >
    Loss or dominant-negative disruption of the ROBO2 receptor abolishes
    repulsive SLIT2-ROBO2 signalling at the caudal nephric duct. In the intact
    system this signal restricts the field in which GDNF can induce a bud, so
    its loss permits ectopic and supernumerary ureteric bud outgrowth. This is
    the proximal molecular lesion of VUR2.
  molecular_functions:
  - preferred_term: transmembrane signaling receptor activity
    term:
      id: GO:0004888
      label: transmembrane signaling receptor activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: Roundabout signaling pathway
    term:
      id: GO:0035385
      label: Roundabout signaling pathway
    modifier: DECREASED
  genes:

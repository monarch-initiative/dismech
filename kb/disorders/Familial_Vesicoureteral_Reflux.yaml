  description: >
    The combined congenital (hypodysplastic) and acquired (post-pyelonephritic
    scarring) lesions reduce functioning nephron mass. Reflux nephropathy is a
    leading cause of childhood hypertension and contributes roughly 10-15% of
    kidney failure requiring dialysis or transplantation in children and young
    adults.
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  evidence:
  - reference: PMID:19959718
    reference_title: "Whole-genome linkage and association scan in primary, nonsyndromic vesicoureteric reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary vesicoureteric reflux accounts for approximately 10% of kidney failure requiring dialysis or transplantation, and sibling studies suggest a large genetic component."
    explanation: >
      Quantifies the contribution of primary VUR to kidney failure.
  - reference: PMID:17357069
    reference_title: "Disruption of ROBO2 is associated with urinary tract anomalies and confers risk of vesicoureteral reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "VUR is a complex, genetically heterogeneous developmental disorder characterized by the retrograde flow of urine from the bladder into the ureter and is associated with reflux nephropathy, the cause of 15% of end-stage renal disease in children and young adults."
    explanation: >
      Independent estimate of the share of ESRD attributable to reflux
      nephropathy.
  - reference: PMID:34059960
    reference_title: "Responsible genes in children with primary vesicoureteral reflux: findings from the Chinese Children Genetic Kidney Disease Database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eighty-eight patient (23.2%) exhibited impaired renal function at their last visit, and 18 of them (20.5%) developed ESRD at the median age of 7.0 (IQR 0.9-11.4) years."
    explanation: >
      Registry data on the frequency and timing of kidney failure in primary
      VUR.
  notes: >
    The classical textbook account of progression beyond this point — surviving
    nephrons hyperfiltering, producing proteinuria and secondary focal
    segmental glomerulosclerosis with renin-angiotensin activation and a
    self-sustaining GFR decline that continues after the reflux itself has
    resolved — is the general remnant-nephron model rather than a
    VUR-specific finding, and is recorded here as a note because no
    VUR-specific citation with a verifiable quote has been curated for it.

phenotypes:
- category: Renal
  name: Primary Vesicoureteral Reflux
  description: >
    Retrograde flow of urine from the bladder into the ureter, and in dilating
    grades into the renal pelvis and calyces, in the absence of bladder outlet
    obstruction or a neuropathic bladder. This is the defining phenotype.
  phenotype_term:
    preferred_term: Primary vesicoureteral reflux
    term:
      id: HP:0033738
      label: Primary vesicoureteral reflux
  frequency: OBLIGATE
  diagnostic: true
  evidence:
  - reference: PMID:33085409
    reference_title: "Vesicoureteral Reflux."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Vesicoureteral reflux (VUR) is the retrograde urine flow from the urinary bladder to the upper urinary tract, usually during voiding."
    explanation: Defines the cardinal phenotype.
- category: Renal
  name: High-Grade (Dilating) Vesicoureteral Reflux
  description: >
    Grades III-V reflux with ureteric and pyelocalyceal dilation. High-grade
    reflux carries the greatest risk of urinary tract infection and renal
    scarring and the lowest likelihood of spontaneous resolution.
  phenotype_term:
    preferred_term: High-grade vesicoureteral reflux
    term:
      id: HP:0033734
      label: High-grade vesicoureteral reflux
  evidence:
  - reference: PMID:33085409
    reference_title: "Vesicoureteral Reflux."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Grades III to V are considered dilating or high-grade VUR and are associated with an increased risk of UTIs and renal scarring, especially grades IV and V."
    explanation: >
      Defines dilating grades and their risk profile. Frequency is deliberately
      omitted because grade distribution varies markedly with ascertainment
      (antenatal vs. post-UTI vs. sibling screening).
- category: Renal
  name: Intrarenal Reflux
  description: >
    Entry of refluxed urine into the collecting ducts through gaping orifices on
    compound papillae, predominantly at the renal poles; the anatomical
    prerequisite for pyelonephritic scarring.
  phenotype_term:
    preferred_term: Intrarenal reflux
    term:
      id: HP:0033742
      label: Intrarenal reflux
  evidence:
  - reference: PMID:3153345
    reference_title: "Vesico-uretero-renal reflux and the kidney."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Primarily, only gaping collecting duct orifices, confined to compound papillae and mainly situated at the kidney poles, allow intrarenal reflux."
    explanation: Documents intrarenal reflux and its anatomical basis.
- category: Infectious
  name: Recurrent Urinary Tract Infections
  description: >
    Recurrent, often febrile, urinary tract infections are the commonest
    presentation of familial VUR outside antenatal detection.
  phenotype_term:
    preferred_term: Recurrent urinary tract infections
    term:
      id: HP:0000010
      label: Recurrent urinary tract infections
  frequency: FREQUENT
  evidence:
  - reference: PMID:21441121
    reference_title: "Primary, nonsyndromic vesicoureteric reflux and nephropathy in sibling pairs: a United Kingdom cohort for a DNA bank."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical presentation was established in 122; 92 had urinary tract infections and 16 had abnormal antenatal renal scans."
    explanation: >
      Derived-count basis for the FREQUENT band, with both denominators stated:
      92 of the 122 patients whose mode of presentation was recorded (75%)
      presented with urinary tract infection, which is 92/407 (23%) of the full
      sibling-pair cohort. Presentation with UTI is not identical to the
      "recurrent" qualifier of HP:0000010, so the band is supported as an
      estimate of symptomatic urinary infection burden rather than as a direct
      count of recurrence.
- category: Infectious
  name: Acute Pyelonephritis
  description: >
    Febrile upper urinary tract infection resulting from reflux of infected
    bladder urine into the renal pelvis and parenchyma.
  phenotype_term:
    preferred_term: Recurrent acute pyelonephritis
    term:
      id: HP:0012787
      label: Recurrent pyelonephritis
    temporality: RECURRENT
  evidence:
  - reference: PMID:3153345
    reference_title: "Vesico-uretero-renal reflux and the kidney."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The frequency of acute pyelonephritic attacks decreased significantly after operation."
    explanation: >
      Documents acute pyelonephritis as a recurring event in VUR and its
      reduction after anti-reflux surgery.
- category: Renal
  name: Renal Cortical Scarring
  description: >
    Segmental, typically polar, wedge-shaped loss of cortex with underlying
    tubulointerstitial fibrosis and calyceal clubbing — the acquired lesion of
    reflux nephropathy, detected on DMSA scintigraphy.
  phenotype_term:
    preferred_term: Renal cortical atrophy
    term:
      id: HP:0002048
      label: Renal cortical atrophy
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:24795142
    reference_title: "Antimicrobial prophylaxis for children with vesicoureteral reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The occurrence of renal scarring did not differ significantly between the prophylaxis and placebo groups (11.9% and 10.2%, respectively)."
    explanation: >
      In the RIVUR randomised trial, renal scarring occurred in roughly 10-12%
      of children with VUR over 2 years, supporting the OCCASIONAL band.
- category: Renal
  name: Reflux Nephropathy
  description: >
    The combined congenital hypodysplastic and acquired scarring renal lesion of
    VUR, presenting with reduced renal size and function, proteinuria and
    hypertension.
  phenotype_term:
    preferred_term: Nephropathy
    term:
      id: HP:0000112
      label: Nephropathy
  frequency: FREQUENT
  evidence:
  - reference: PMID:21441121
    reference_title: "Primary, nonsyndromic vesicoureteric reflux and nephropathy in sibling pairs: a United Kingdom cohort for a DNA bank."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RN was radiologically proven in 223 patients."
    explanation: >
      Radiologically proven reflux nephropathy in 223 of the 407 patients (55%)
      in a UK familial-VUR sibling-pair cohort, supporting the FREQUENT band.
      Note that this cohort was ascertained through tertiary paediatric
      nephrology centres and is therefore enriched for nephropathy.
- category: Renal
  name: Renal Hypoplasia and Dysplasia
  description: >
    Small and/or dysplastic kidney present from birth, arising from induction of
    an inappropriate region of metanephric mesenchyme by the misplaced ureteric
    bud rather than from infection.
  phenotype_term:
    preferred_term: Renal hypoplasia/aplasia
    term:
      id: HP:0008678
      label: Renal hypoplasia/aplasia
  evidence:
  - reference: PMID:29097723
    reference_title: "Genome-wide linkage and association study implicates the 10q26 region as a major genetic contributor to primary nonsyndromic vesicoureteric reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite treatment improvements, associated renal lesions - congenital dysplasia, acquired scarring or both - are a common cause of childhood hypertension and renal failure."
    explanation: Documents congenital dysplasia as a component renal lesion.
- category: Renal
  name: Renal Dysplasia
  description: >
    Disorganised, maldifferentiated renal parenchyma (as distinct from a small
    but normally organised kidney), the dysplastic pole of the congenital renal
    lesion in VUR. Curated separately from HP:0008678 because that term covers
    hypoplasia/aplasia but not dysplasia.
  phenotype_term:
    preferred_term: Renal dysplasia
    term:
      id: HP:0000110
      label: Renal dysplasia
  evidence:
  - reference: PMID:16433689
    reference_title: "Vesicoureteric reflux and renal malformations: a developmental problem."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Analysis of data from humans and mice suggests that some of the renal damage associated with VUR is congenital and is due to a kidney malformation."
    explanation: >
      Supports a congenital maldevelopment (dysplastic) component of the renal
      lesion in VUR, as opposed to purely acquired scarring.
- category: Renal
  name: Chronic Kidney Disease
  description: >
    Progressive reduction in GFR from cumulative nephron loss; a minority
    progress to kidney failure requiring dialysis or transplantation, sometimes
    in childhood.
  phenotype_term:
    preferred_term: Chronic kidney disease
    term:
      id: HP:0012622
      label: Chronic kidney disease
    clinical_course: PROGRESSIVE
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:34059960
    reference_title: "Responsible genes in children with primary vesicoureteral reflux: findings from the Chinese Children Genetic Kidney Disease Database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eighty-eight patient (23.2%) exhibited impaired renal function at their last visit, and 18 of them (20.5%) developed ESRD at the median age of 7.0 (IQR 0.9-11.4) years."
    explanation: >
      Registry data: 23.2% of 379 children with primary VUR had impaired renal
      function at last visit.
- category: Renal
  name: Stage 5 Chronic Kidney Disease
  description: >
    Kidney failure requiring dialysis or transplantation. Reflux nephropathy
    accounts for roughly 10-15% of kidney failure in children and young adults
    and about 5% of paediatric kidney transplants.
  phenotype_term:
    preferred_term: Stage 5 chronic kidney disease
    term:
      id: HP:0003774
      label: Stage 5 chronic kidney disease
  frequency: VERY_RARE
  evidence:
  - reference: PMID:33085409
    reference_title: "Vesicoureteral Reflux."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "End-stage renal failure in children due to reflux nephropathy accounts for about 5% of all pediatric renal transplants."
    explanation: >
      Establishes the population-level contribution of reflux nephropathy to
      paediatric kidney failure. This is a population-attributable fraction over
      a transplant denominator and does not by itself give a per-patient risk;
      the frequency band is set from the cohort denominator in the next evidence
      item.
  - reference: PMID:34059960
    reference_title: "Responsible genes in children with primary vesicoureteral reflux: findings from the Chinese Children Genetic Kidney Disease Database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eighty-eight patient (23.2%) exhibited impaired renal function at their last visit, and 18 of them (20.5%) developed ESRD at the median age of 7.0 (IQR 0.9-11.4) years."
    explanation: >
      Derived-count basis for the VERY_RARE band: 18 of the 379 recruited
      children with primary VUR reached ESRD, i.e. 4.7% of the whole cohort.
- category: Cardiovascular
  name: Hypertension
  description: >
    Renin-mediated hypertension arising from scarred, ischaemic renal segments;
    reflux nephropathy is a classical cause of hypertension in children.
  phenotype_term:
    preferred_term: Hypertension
    term:
      id: HP:0000822
      label: Hypertension
  evidence:
  - reference: PMID:29097723
    reference_title: "Genome-wide linkage and association study implicates the 10q26 region as a major genetic contributor to primary nonsyndromic vesicoureteric reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "associated renal lesions - congenital dysplasia, acquired scarring or both - are a common cause of childhood hypertension and renal failure"
    explanation: Links the renal lesions of VUR to childhood hypertension.
- category: Renal
  name: Hydronephrosis
  description: >
    Pelvicalyceal dilation, frequently the antenatal finding that prompts
    postnatal cystography; about 16% of neonates with antenatal hydronephrosis
    prove to have VUR.
  phenotype_term:
    preferred_term: Hydronephrosis
    term:
      id: HP:0000126
      label: Hydronephrosis
  evidence:
  - reference: PMID:33085409
    reference_title: "Vesicoureteral Reflux."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A systematic review of 34 studies indicated that approximately 16% of neonates with ultrasound evidence of hydronephrosis eventually have VUR."
    explanation: Links antenatal hydronephrosis to the detection of VUR.
- category: Renal
  name: Duplicated Collecting System
  description: >
    Complete or partial ureteric duplication, a co-occurring CAKUT phenotype
    expected from an ectopic or duplicated ureteric bud and a negative predictor
    of spontaneous resolution.
  phenotype_term:
    preferred_term: Duplicated collecting system
    term:
      id: HP:0000081
      label: Duplicated collecting system
  evidence:
  - reference: PMID:33085409
    reference_title: "Vesicoureteral Reflux."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Negative predictive factors for spontaneous resolution of VUR include female gender, higher grade reflux (grades IV and V), other ureteral abnormalities, complete renal duplication, periureteral diverticula, bladder or bowel disorders, and renal pelvic filling without bladder contraction."
    explanation: >
      Lists complete renal duplication among co-occurring anatomical features
      that worsen the prognosis.
- category: Urologic
  name: Bladder and Bowel Dysfunction
  description: >
    Detrusor overactivity, urgency, voiding postponement and constipation.
    Modelled here as a co-occurring modifier: it raises infection risk despite
    prophylaxis, roughly halves the spontaneous-resolution rate and lowers
    surgical success.
  phenotype_term:
    preferred_term: Functional abnormality of the bladder
    term:
      id: HP:0000009
      label: Functional abnormality of the bladder
  evidence:
  - reference: PMID:33085409
    reference_title: "Vesicoureteral Reflux."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Patients with VUR with bladder or bowel dysfunction are at a higher risk of developing infections despite continuous prophylaxis and have a much lower rate of spontaneous resolution (31% compared to 61%) and reduced success rates after endoscopic VUR surgical procedures."
    explanation: Quantifies the modifying effect of bladder-bowel dysfunction.
- category: Musculoskeletal
  name: Joint Hypermobility
  description: >
    Generalised joint hypermobility accompanies TNXB-related familial VUR
    (VUR8), reflecting the extracellular-matrix role of tenascin X; it has been
    proposed as a non-invasive clinical clue to a TNXB aetiology.
  phenotype_term:
    preferred_term: Joint hypermobility
    term:
      id: HP:0001382
      label: Joint hypermobility
  subtype: VUR8
  evidence:
  - reference: PMID:26408188
    reference_title: "Rare variants in tenascin genes in a cohort of children with primary vesicoureteric reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all the individuals with the TNXB variants who had joint mobility examination done have significant joint hypermobility as assessed by Beighton score"
    explanation: >
      Documents joint hypermobility in TNXB-variant carriers with primary VUR.

genetic:
- name: ROBO2
  gene_term:
    preferred_term: ROBO2
    term:
      id: hgnc:10250
      label: ROBO2
  relationship_type: CAUSATIVE
  subtype: VUR2
  presence: PRESENT
  notes: >
    ROBO2 encodes the receptor for SLIT ligands; SLIT2-ROBO2 signalling
    restricts the domain of GDNF expression in the metanephric mesenchyme and so
    positions the ureteric bud. Truncating/dominant-negative and intracellular
    missense alleles are reported.
  evidence:
  - reference: PMID:17357069
    reference_title: "Disruption of ROBO2 is associated with urinary tract anomalies and confers risk of vesicoureteral reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, we identified two novel ROBO2 intracellular missense variants that segregate with CAKUT and VUR in two unrelated families."
    explanation: Familial segregation of ROBO2 variants with VUR.
  - reference: PMID:26408188
    reference_title: "Rare variants in tenascin genes in a cohort of children with primary vesicoureteric reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, familial PVUR is due to rare variants in TNXB and ROBO2 in 12% of all families with familial PVUR studied in this cohort."
    explanation: >
      Quantifies the combined TNXB/ROBO2 yield in a familial primary-VUR cohort.
  - reference: PMID:19959718
    reference_title: "Whole-genome linkage and association scan in primary, nonsyndromic vesicoureteric reflux."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We tested for but did not detect association with six candidate genes (AGTR2, HNF1B, PAX2, RET, ROBO2, and UPK3A)."
    explanation: >
      Scope limit: ROBO2 is a rare-variant cause in individual families, but
      common ROBO2 variation showed no association with VUR in a large
      case-control and family-based analysis.
- name: SOX17
  gene_term:
    preferred_term: SOX17
    term:
      id: hgnc:18122
      label: SOX17
  relationship_type: CAUSATIVE
  subtype: VUR3
  presence: PRESENT
  notes: >
    The recurrent p.Y259N allele is not loss-of-function but accumulates,
    producing excessive antagonism of Wnt/beta-catenin signalling during renal
    and urinary tract development. The evidence base is thin — a single 2010
    series of eight CAKUT patients — and a later screen of familial primary-VUR
    families found only one SOX17 variant of uncertain significance, so the
    CAUSATIVE designation reflects the OMIM/MONDO VUR3 series assignment rather
    than a large replicated dataset.
  evidence:
  - reference: PMID:20960469
    reference_title: "Mutations in SOX17 are associated with congenital anomalies of the kidney and the urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One mutation, c.775T>A (p.Y259N), recurred in six patients."
    explanation: Recurrent SOX17 allele in CAKUT/VUR patients.
  - reference: PMID:20960469
    reference_title: "Mutations in SOX17 are associated with congenital anomalies of the kidney and the urinary tract."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transfection studies indicated a 5-10-fold increase in the levels of the mutant protein relative to wild-type SOX17 in transfected kidney cells."
    explanation: >
      Functional data showing the mutant protein accumulates, the proposed
      mechanism of excess Wnt antagonism.
- name: TNXB
  gene_term:
    preferred_term: TNXB
    term:
      id: hgnc:11976
      label: TNXB
  relationship_type: CAUSATIVE
  subtype: VUR8
  presence: PRESENT
  notes: >
    Tenascin XB is a large extracellular matrix glycoprotein expressed in the
    developing ureterovesical junction. Heterozygous rare missense variants
    cluster in the fibronectin III domains. TNXB carriers had an elevated hazard
    of progression to kidney failure in a Chinese national registry, but with
    only three carriers and a very wide confidence interval (HR 20.3, 95% CI
    2.4-168.7) the point estimate should not be taken at face value.
  evidence:
  - reference: PMID:23620400
    reference_title: "TNXB mutations can cause vesicoureteral reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation segregated with disease in the affected family as well as with a pathogenic G1331R change in another family."
    explanation: Segregation of TNXB variants with familial VUR in two families.
  - reference: PMID:34059960
    reference_title: "Responsible genes in children with primary vesicoureteral reflux: findings from the Chinese Children Genetic Kidney Disease Database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PAX2 mutation carriers (HR 5.1, 95% CI 1.3-20.0; P = 0.02) and TNXB mutation carriers (HR 20.3, 95% CI 2.4-168.7; P = 0.01) were associated with increased risk of progression to ESRD."
    explanation: >
      Establishes TNXB genotype as a prognostic factor for kidney failure in
      primary VUR.
- name: SLIT2
  gene_term:
    preferred_term: SLIT2
    term:
      id: hgnc:11086
      label: SLIT2
  relationship_type: CAUSATIVE
  presence: PRESENT
  notes: >
    The ligand partner of ROBO2. Not assigned its own VUR locus number, but
    SLIT2 was among the recurrent monogenic causes in a national primary-VUR
    exome registry, consistent with the SLIT-ROBO budding-position mechanism.
  evidence:
  - reference: PMID:34059960
    reference_title: "Responsible genes in children with primary vesicoureteral reflux: findings from the Chinese Children Genetic Kidney Disease Database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These genes included PAX2 (n = 4), TNXB (n = 3), GATA3 (n = 3), SLIT2 (n = 3), ROBO2 (n = 2), TBX18 (n = 2), and the other 11 genes (one gene for each patient)."
    explanation: >
      SLIT2 among the recurrently mutated genes in an exome-sequenced
      primary-VUR cohort.
- name: Monogenic diagnostic yield in primary VUR
  relationship_type: SUSCEPTIBILITY
  presence: PRESENT
  notes: >
    Even with exome sequencing, a monogenic cause is found in only a small
    minority of primary VUR, and in familial cohorts most families remain
    unexplained. This is the quantitative statement of locus heterogeneity that
    motivates the VUR1-VUR8 linkage series.
  evidence:
  - reference: PMID:34059960
    reference_title: "Responsible genes in children with primary vesicoureteral reflux: findings from the Chinese Children Genetic Kidney Disease Database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A monogenic cause was identified in 28 patients (7.39%)."
    explanation: Diagnostic yield of exome sequencing in unselected primary VUR.
  - reference: PMID:26408188
    reference_title: "Rare variants in tenascin genes in a cohort of children with primary vesicoureteric reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We did not find any possible disease-causing variants in >80% of individuals with familial PVUR, thus further confirming that PVUR is genetically heterogeneous."
    explanation: >
      Most familial primary VUR remains molecularly unexplained even after
      targeted sequencing.

diagnosis:
- name: Voiding Cystourethrography (VCUG)
  description: >
    Direct contrast cystography during voiding is the diagnostic gold standard;
    it demonstrates reflux, allows International Reflux Study grading (I-V), and
    shows associated anatomy (duplication, diverticula, urethral abnormalities).
  diagnosis_term:
    preferred_term: voiding cystourethrography
    term:
      id: NCIT:C38049
      label: Cystography
  evidence:
  - reference: PMID:33085409
    reference_title: "Vesicoureteral Reflux."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the gold standard for evaluating VUR is direct cystography with voiding cystourethrogram (VCUG)"
    explanation: Establishes VCUG as the reference diagnostic test.
- name: Renal Ultrasonography
  description: >
    First-line imaging for renal anatomy, cortical thickness and hydronephrosis;
    it cannot however exclude high-grade reflux.
  diagnosis_term:
    preferred_term: renal ultrasound
    term:
      id: NCIT:C159885
      label: Renal Ultrasound
  evidence:
  - reference: PMID:33085409
    reference_title: "Vesicoureteral Reflux."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Unfortunately, ultrasound lacks high sensitivity or specificity for detecting high-grade VUR."
    explanation: >
      Defines the role and the limitation of ultrasound in the VUR diagnostic
      pathway.
- name: Sibling and Offspring Screening
  description: >
    Because of the high familial recurrence, baseline renal ultrasound is
    recommended for siblings of an affected child, particularly those aged 3 or
    younger, with VCUG reserved for those with an abnormal ultrasound or a UTI.
    Routine screening of asymptomatic siblings with a normal ultrasound is not
    currently recommended.
  diagnosis_term:
    preferred_term: renal ultrasound
    term:
      id: NCIT:C159885
      label: Renal Ultrasound
  evidence:
  - reference: PMID:33085409
    reference_title: "Vesicoureteral Reflux."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Baseline ultrasound imaging for siblings of patients with VUR is recommended, as their incidence of VUR is reported to be between 27% and 46%, particularly in those children aged 3 or younger."
    explanation: >
      Supports the family-screening recommendation that follows from the
      familial nature of the disease.
  - reference: PMID:33085409
    reference_title: "Vesicoureteral Reflux."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Among siblings, the incidence of VUR is about 30%, although routine screening of asymptomatic siblings with normal renal ultrasound examinations is presently not recommended."
    explanation: >
      Documents the limit of the screening recommendation; hence PARTIAL.

progression:
- phase: Spontaneous resolution of low-grade reflux
  age_range: Birth to 5 years
  notes: >
    Primary VUR frequently resolves as the child grows and the intramural
    ureteric tunnel lengthens. About 70-80% of grade I-II reflux resolves by age
    5. This natural history is the reason management is predominantly expectant
    in infancy.
  evidence:
  - reference: PMID:33085409
    reference_title: "Vesicoureteral Reflux."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "About 75% (70% to 80%) of children with grade I and II VUR will spontaneously resolve their VUR by age 5."
    explanation: Quantifies resolution in low-grade reflux.
- phase: Persistent high-grade or bilateral reflux
  age_range: Over 5 years
  notes: >
    Grades III-IV resolve in 60-70% over 5 years when unilateral and discovered
    before age 2, but only 10-20% in children over 5 with bilateral reflux, and
    grade V rarely resolves without surgery. These are the children in whom
    intervention is considered.
  evidence:
  - reference: PMID:33085409
    reference_title: "Vesicoureteral Reflux."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, in children over age 5 with bilateral VUR, the rate of spontaneous resolution drops to only 10% to 20% over 5 years. For patients with grade V disease, spontaneous resolution without surgical intervention is rare."
    explanation: Quantifies the poor resolution of high-grade, bilateral reflux.
- phase: Ongoing renal scar accrual
  notes: >
    New renal scars continue to form beyond 5 years of age and can occur at any
    reflux grade, so surveillance cannot be discontinued simply on the basis of
    age or low grade.
  evidence:
  - reference: PMID:3153345
    reference_title: "Vesico-uretero-renal reflux and the kidney."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Contrary to earlier reports, a recent survey has documented that new scars in children develop with significant frequency beyond 5 years of age."
    explanation: Documents late scar accrual.

treatments:
- name: Continuous Antimicrobial Prophylaxis
  description: >
    Low-dose continuous antibiotic prophylaxis (commonly
    trimethoprim-sulfamethoxazole or nitrofurantoin) while awaiting spontaneous
    resolution. The RIVUR randomised trial showed prophylaxis halves recurrent
    UTI but did NOT reduce renal scarring over 2 years, and it substantially
    increases trimethoprim-sulfamethoxazole resistance among breakthrough
    Escherichia coli isolates — the central trade-off in VUR management.
    Prophylaxis is not indicated in children with a normal urinary tract after a
    UTI.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: continuous antibiotic prophylaxis
    term:
      id: NCIT:C51993
      label: Antibiotic Prophylaxis
    therapeutic_agent:
    - preferred_term: trimethoprim-sulfamethoxazole
      term:
        id: NCIT:C909
        label: Trimethoprim-Sulfamethoxazole
    - preferred_term: nitrofurantoin
      term:
        id: NCIT:C29293
        label: Nitrofurantoin
  target_mechanisms:
  - target: Ascending Infection and Acute Pyelonephritis
    treatment_effect: INHIBITS
  target_phenotypes:
  - preferred_term: Recurrent urinary tract infections
    term:
      id: HP:0000010
      label: Recurrent urinary tract infections
  evidence:
  - reference: PMID:24795142
    reference_title: "Antimicrobial prophylaxis for children with vesicoureteral reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrent urinary tract infection developed in 39 of 302 children who received prophylaxis as compared with 72 of 305 children who received placebo"
    explanation: >
      Randomised evidence that prophylaxis roughly halves recurrent UTI in
      children with VUR (relative risk 0.55).
  - reference: PMID:24795142
    reference_title: "Antimicrobial prophylaxis for children with vesicoureteral reflux."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Among children with vesicoureteral reflux after urinary tract infection, antimicrobial prophylaxis was associated with a substantially reduced risk of recurrence but not of renal scarring."
    explanation: >
      Qualifies the benefit: infection prevention does not translate into
      prevention of the renal lesion, consistent with a substantial congenital
      component of reflux nephropathy.
  - reference: PMID:24795142
    reference_title: "Antimicrobial prophylaxis for children with vesicoureteral reflux."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 87 children with a first recurrence caused by Escherichia coli, the proportion of isolates that were resistant to trimethoprim-sulfamethoxazole was 63% in the prophylaxis group and 19% in the placebo group."
    explanation: >
      Documents the antimicrobial-resistance cost that qualifies the benefit of
      prophylaxis.
- name: Bladder and Bowel Dysfunction Management
  description: >
    Timed voiding, laxative treatment of constipation, pelvic floor therapy,
    behavioural modification and, where indicated, anticholinergics. Addressing
    bladder-bowel dysfunction lowers infection risk and improves spontaneous
    resolution, and should precede any consideration of anti-reflux surgery.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: behavioral counseling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  target_phenotypes:
  - preferred_term: Functional abnormality of the bladder
    term:
      id: HP:0000009
      label: Functional abnormality of the bladder
  evidence:
  - reference: PMID:33085409
    reference_title: "Vesicoureteral Reflux."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Treatment for bladder or bowel dysfunction, including timed voiding, laxatives, pelvic floor therapy and exercises, behavioral modifications, and anticholinergic therapy, effectively reduces voiding symptoms, improves bladder function, and increases spontaneous resolution."
    explanation: >
      Documents the components and the benefit of bladder-bowel dysfunction
      management.
- name: Ureteral Reimplantation (Anti-Reflux Surgery)
  description: >
    Open, laparoscopic or robotic ureteric reimplantation lengthens the
    intramural tunnel and restores the flap valve. It is reserved for
    breakthrough febrile infections, progressive renal damage or persistent
    high-grade reflux, and reduces the frequency of acute pyelonephritic
    episodes, though older comparative studies did not show a lower overall UTI
    recurrence rate than medical management.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: ureteral reimplantation
    term:
      id: NCIT:C101242
      label: Reimplantation
  target_mechanisms:
  - target: Ureterovesical Junction Incompetence
    treatment_effect: RESTORES
  evidence:
  - reference: PMID:3153345
    reference_title: "Vesico-uretero-renal reflux and the kidney."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Prospective studies have not shown different recurrence rates of urinary tract infections in medically managed compared with surgically managed children. The frequency of acute pyelonephritic attacks decreased significantly after operation."
    explanation: >
      Supports a specific benefit of surgery (fewer pyelonephritic attacks)
      while refuting a general reduction in UTI recurrence; hence PARTIAL.
- name: Endoscopic Subureteric Injection
  description: >
    Cystoscopic injection of a bulking agent (dextranomer/hyaluronic acid
    copolymer) under the ureteric orifice to coapt the distal ureter. It is less
    invasive than reimplantation but, per current clinical guidance, offers no
    significant advantage over antibiotic prophylaxis for preventing new UTIs or
    renal scarring in most patients and carries its own procedural risks.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: endoscopic subureteric bulking-agent injection
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    therapeutic_agent:
    - preferred_term: dextranomer/hyaluronic acid copolymer bulking agent
      term:
        id: CHEBI:16336
        label: hyaluronic acid
  evidence:
  - reference: PMID:33085409
    reference_title: "Vesicoureteral Reflux."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "However, endoscopic treatment does not offer significant advantages over antibiotic prophylaxis in preventing new UTIs or renal scarring in most patients."
    explanation: >
      Qualifies the role of endoscopic treatment; it is an option rather than a
      superior therapy.
- name: Surveillance and Expectant Management
  description: >
    Because most primary VUR resolves spontaneously, the default approach in
    infants is close monitoring for UTI, renal growth and kidney damage, with
    escalation only for recurrent infection, progressive damage or inadequate
    renal growth.
  action_category: MONITORING
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:33085409
    reference_title: "Vesicoureteral Reflux."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Generally, the most effective approach to managing VUR in infants involves closely monitoring them for UTIs and kidney damage."
    explanation: Establishes expectant management as the default in infants.
- name: Genetic Counseling and Family Evaluation
  description: >
    Counselling should convey the high familial recurrence (roughly one third of
    siblings, up to two thirds of offspring of an affected mother), the marked
    locus heterogeneity that limits molecular diagnosis, and the resulting role
    of imaging-based rather than gene-based family evaluation.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33085409
    reference_title: "Vesicoureteral Reflux."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A genetic predisposition for the disorder exists, as up to two-thirds of children born to women with primary VUR will also exhibit the condition."
    explanation: The recurrence figure that underpins family counselling.

clinical_trials:
- name: NCT00405704
  phase: PHASE_III
  status: COMPLETED
  description: >
    Randomized Intervention for Children with Vesicoureteral Reflux (RIVUR): a
    2-year, multisite, randomized, placebo-controlled trial of
    trimethoprim-sulfamethoxazole prophylaxis in 607 children with VUR diagnosed
    after a first or second febrile or symptomatic urinary tract infection.
  target_phenotypes:
  - preferred_term: Recurrent urinary tract infections
    term:
      id: HP:0000010
      label: Recurrent urinary tract infections
  - preferred_term: Renal cortical atrophy
    term:
      id: HP:0002048
      label: Renal cortical atrophy
  evidence:
  - reference: PMID:24795142
    reference_title: "Antimicrobial prophylaxis for children with vesicoureteral reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this 2-year, multisite, randomized, placebo-controlled trial involving 607 children with vesicoureteral reflux that was diagnosed after a first or second febrile or symptomatic urinary tract infection, we evaluated the efficacy of trimethoprim-sulfamethoxazole prophylaxis in preventing recurrences (primary outcome)."
    explanation: Describes the RIVUR trial design and population.
  - reference: clinicaltrials:NCT00405704
    reference_title: "Randomized Intervention for Children With Vesicoureteral Reflux (RIVUR)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Secondary outcomes were renal scarring, treatment failure (a composite of recurrences and scarring), and antimicrobial resistance."
    explanation: >
      ClinicalTrials.gov registration confirming the trial identity and its
      pre-specified secondary outcomes, including the renal-scarring endpoint
      that the trial did not meet.

differential_diagnoses:
- name: Secondary vesicoureteral reflux
  description: >
    Reflux caused by elevated intravesical pressure or an anatomically abnormal
    bladder outlet — posterior urethral valves, neurogenic bladder (spina
    bifida), bladder exstrophy, urinary outlet obstruction. Distinguished by the
    presence of the underlying obstructive or neurological lesion on cystography
    and urodynamics.
  evidence:
  - reference: PMID:33085409
    reference_title: "Vesicoureteral Reflux."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "VUR may also be associated with other congenital conditions such as posterior urethral valves, neurogenic bladder, spina bifida, urinary outlet obstruction, bladder overactivity, imperforate anus, ureterocele, and bladder exstrophy."
    explanation: Lists the conditions that produce secondary VUR.
- name: Syndromic CAKUT with vesicoureteral reflux
  description: >
    VUR as one feature of a defined multisystem disorder — renal coloboma
    syndrome (PAX2), branchio-oto-renal syndrome, urofacial (Ochoa) syndrome,
    prune belly syndrome, exstrophy-epispadias complex. Suspected when
    extrarenal features are present; extrarenal manifestations more than double
    the monogenic diagnostic yield.
  evidence:
  - reference: PMID:34059960
    reference_title: "Responsible genes in children with primary vesicoureteral reflux: findings from the Chinese Children Genetic Kidney Disease Database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was a significant difference in the rate of gene mutations between patients with or without extrarenal complications (14.1% vs. 6%, P = 0.035)."
    explanation: >
      Extrarenal features substantially raise the probability of an identifiable
      (often syndromic) monogenic cause.

discussions:
- discussion_id: vur_unidentified_locus_genes
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    What genes underlie the VUR1 (1p13), VUR4 (chromosome 5), VUR5 (chromosome
    13), VUR6 (chromosome 18), VUR7 (12p11-q13) and 10q26 linkage intervals?
  attaches_to:
  - pathophysiology#Abnormal Ureteric Bud Outgrowth Position
  rationale: >
    Six of the mapped familial VUR loci still have no identified gene, and even
    resequencing of the strongest interval (10q26, ~9 Mb, 69 genes) did not
    clearly implicate a single gene. Together with the roughly 7% monogenic
    diagnostic yield of exome sequencing in unselected primary VUR and the
    finding that more than 80% of familial cases have no identifiable variant,
    this means the molecular basis of most familial VUR is unknown. Whether the
    missing signal is non-coding regulatory variation acting on ureteric bud
    positioning, structural variation, or oligogenic combinations is unresolved.
  proposed_experiments:
  - experiment_id: vur_wgs_multiplex_pedigrees
    name: Whole-genome sequencing of large multiplex VUR pedigrees
    description: >
      Sequence whole genomes (not exomes) in multigenerational familial VUR
      kindreds linked to the mapped intervals, to capture non-coding regulatory
      and structural variation missed by exome sequencing.
  - experiment_id: vur_uvj_single_cell_atlas
    name: Single-cell and spatial atlas of the developing human ureterovesical junction
    description: >
      Profile the human nephric duct and forming ureterovesical junction by
      single-cell and spatial transcriptomics to prioritise candidate genes
      expressed at the budding site within each linkage interval.
  evidence:
  - reference: PMID:29097723
    reference_title: "Genome-wide linkage and association study implicates the 10q26 region as a major genetic contributor to primary nonsyndromic vesicoureteric reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ~9Mb region contains 69 genes, including some good biological candidates. Resequencing this region in selected individuals did not clearly implicate any gene but FOXI2, FANK1 and GLRX3 remain candidates for further investigation."
    explanation: >
      Documents the unresolved state of even the strongest familial VUR linkage
      interval.
- discussion_id: vur_congenital_vs_acquired_renal_lesion
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Can any intervention prevent the renal lesion of familial VUR, given that
    halving urinary tract infection does not reduce renal scarring?
  attaches_to:
  - pathophysiology#Renal Cortical Scarring
  - pathophysiology#Congenital Renal Hypodysplasia
  rationale: >
    RIVUR showed that continuous antimicrobial prophylaxis halves recurrent UTI
    without changing the rate of renal scarring, while carrying a clear
    resistance cost. If a substantial fraction of the renal lesion is congenital
    hypodysplasia determined at the time of ureteric bud outgrowth, then no
    postnatal infection-directed strategy can prevent it, and the appropriate
    outcome measure for VUR trials may need to change. The relative contribution
    of congenital versus acquired injury in an individual child cannot currently
    be determined at diagnosis.
  proposed_experiments:
  - experiment_id: vur_neonatal_dmsa_partition
    name: Neonatal DMSA cohort partitioning congenital from acquired renal lesions
    description: >
      Prospectively image children detected antenatally or at first UTI with
      early (neonatal) DMSA plus longitudinal follow-up imaging, to separate
      pre-existing hypodysplasia from newly acquired post-pyelonephritic scars.
  - experiment_id: vur_genotype_stratified_prophylaxis
    name: Genotype-stratified analysis of prophylaxis outcomes
    description: >
      Re-analyse or prospectively stratify prophylaxis trials by molecular
      subtype (e.g. TNXB and PAX2 carriers) to test whether genotype predicts
      response to infection-directed therapy.
  evidence:
  - reference: PMID:24795142
    reference_title: "Antimicrobial prophylaxis for children with vesicoureteral reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The occurrence of renal scarring did not differ significantly between the prophylaxis and placebo groups (11.9% and 10.2%, respectively)."
    explanation: The negative scarring outcome that motivates the gap.
  - reference: PMID:16433689
    reference_title: "Vesicoureteric reflux and renal malformations: a developmental problem."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Despite treatment of affected children for the past 40 years, the incidence of end-stage renal disease secondary to VUR has not decreased."
    explanation: >
      Forty years of infection-directed treatment has not changed the
      population-level renal outcome.
- discussion_id: vur_mek_inhibition_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >
    Does pharmacological MEK/ERK inhibition during ureteric bud outgrowth, which
    prevents CAKUT in Robo2/Gen1 double-heterozygous mice, have any bearing on
    human familial VUR?
  attaches_to:
  - pathophysiology#Abnormal Ureteric Bud Outgrowth Position
  rationale: >
    Intraperitoneal U0126 given to pregnant mice prevents the CAKUT phenotype in
    Robo2(PB/+)Gen1(PB/+) offspring, identifying MAPK/ERK as a convergent
    downstream node of the budding-position defect. This is a striking
    mechanistic result, but its translational validity is unknown: the mouse
    model is engineered and digenic, the intervention is a systemic MEK
    inhibitor given during pregnancy (with obvious developmental-toxicity and
    ethical barriers), and no human VUR has been shown to be MAPK/ERK-driven. It
    is a mechanistic probe of the budding-position model rather than a
    therapeutic lead.
  proposed_experiments:
  - experiment_id: vur_erk_patient_cells
    name: ERK pathway activity in human ROBO2/SLIT2 variant carriers
    description: >
      Test whether patient-derived fibroblasts or urinary-tract organoids from
      human ROBO2 or SLIT2 variant carriers show altered ERK phosphorylation
      comparable to the mouse model.
  - experiment_id: vur_gen1_oligogenic_burden
    name: Oligogenic burden test for GEN1 and ERK-pathway modifiers
    description: >
      Determine whether GEN1 or other ERK-pathway modifier alleles contribute to
      human familial VUR in oligogenic burden analyses of multiplex cohorts.
  evidence:
  - reference: PMID:36870240
    reference_title: "Inhibition of MAPK/ERK pathway activation rescues congenital anomalies of the kidney and urinary tract (CAKUT) in Robo2(PB/+) Gen1(PB/+) mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Intraperitoneal injection of U0126 during pregnancy prevented the development of the CAKUT phenotype in Robo2PB/+Gen1PB/+ mice."
    explanation: >
      The model-system result whose translation to human familial VUR is
      unestablished.

animal_models:
- species: mouse (Mus musculus)
  genotype: Robo2 heterozygous and mosaic loss-of-function mutants
  category: Gene-dosage loss-of-function model
  genes:
  - preferred_term: ROBO2
    term:
      id: hgnc:10250
      label: ROBO2
  description: >
    Reducing Robo2 gene dosage in mice reproduces the human CAKUT-VUR phenotype,
    supplying the in vivo evidence that SLIT-ROBO signalling controls ureteric
    bud position and ureterovesical junction competence. Recapitulates the human
    VUR2 subtype.
  associated_phenotypes:
  - Vesicoureteral reflux
  - Congenital anomalies of the kidney and urinary tract
  evidence:
  - reference: PMID:17357069
    reference_title: "Disruption of ROBO2 is associated with urinary tract anomalies and confers risk of vesicoureteral reflux."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Adult heterozygous and mosaic mutant mice with reduced Robo2 gene dosage also exhibit striking CAKUT-VUR phenotypes."
    explanation: >
      Direct statement of phenotype recapitulation in the Robo2 dosage model.
- species: mouse (Mus musculus)
  genotype: Robo2(PB/+) Gen1(PB/+) digenic piggyBac insertional mutants
  category: Digenic insertional-mutagenesis model
  genes:
  - preferred_term: ROBO2
    term:
      id: hgnc:10250
      label: ROBO2
  description: >
    A digenic model in which Robo2 and Gen1 co-regulate ureteric bud germination
    through MAPK/ERK; prenatal MEK inhibition with U0126 prevents the CAKUT
    phenotype. Limitation: the model is engineered and digenic, the rescue
    requires systemic MEK inhibition during pregnancy, and no human VUR has been
    shown to be MAPK/ERK-driven, so this is a mechanistic probe rather than a
    therapeutic model (see the HUMAN_MODEL_MISMATCH discussion).
  associated_phenotypes:
  - Ectopic ureteric bud outgrowth
  - Congenital anomalies of the kidney and urinary tract
  evidence:
  - reference: PMID:36870240
    reference_title: "Inhibition of MAPK/ERK pathway activation rescues congenital anomalies of the kidney and urinary tract (CAKUT) in Robo2(PB/+) Gen1(PB/+) mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Intraperitoneal injection of U0126 during pregnancy prevented the development of the CAKUT phenotype in Robo2PB/+Gen1PB/+ mice."
    explanation: >
      Defines the model and its pharmacological rescue.
- species: mouse (Mus musculus)
  genotype: C3H/HeOuJ, an immunocompetent inbred strain with native vesicoureteral reflux, transurethrally inoculated with uropathogenic Escherichia coli
  category: Infection model on a refluxing genetic background
  description: >
    The standard experimental model of acquired reflux nephropathy: mice that
    natively have vesicoureteral reflux develop renal mucosal injury,
    tubulointerstitial nephritis and cortical fibrosis after ascending
    uropathogenic E. coli infection, with the degree of fibrosis tracking the
    degree of leukocyte recruitment rather than bacterial burden alone.
  associated_phenotypes:
  - Acute pyelonephritis
  - Tubulointerstitial nephritis
  - Renal cortical fibrosis
  evidence:
  - reference: PMID:27760770
    reference_title: "Inflammation drives renal scarring in experimental pyelonephritis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This murine model recapitulates the cardinal histopathological features observed in humans with acquired renal scarring following pyelonephritis."
    explanation: >
      Explicit statement of phenotype recapitulation against human acquired
      renal scarring.
  - reference: PMID:33148615
    reference_title: "Neutrophil-Macrophage Imbalance Drives the Development of Renal Scarring during Experimental Pyelonephritis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We used a preclinical model of uropathogenic Escherichia coli-induced acute pyelonephritis to determine the contribution of neutrophils and monocytes to resolution of the condition and the subsequent development of kidney fibrosis."
    explanation: >
      Describes the same model used to dissect the leukocyte contribution to
      scarring.


- name: Abnormal Ureteric Bud Outgrowth Position
  biological_scale: TISSUE
  role: trigger
  description: >
    Primary VUR originates during the fifth week of human development, when the
    ureteric bud sprouts from the caudal nephric (Wolffian) duct. Genetic
    perturbation of the signals that fix the budding site — SLIT2-ROBO2
    repulsive guidance, GDNF/RET, and Wnt/beta-catenin (antagonised by SOX17) —
    shifts the bud cranially or laterally, or produces ectopic/duplicated buds.
    Because the bud stalk becomes the ureter and its insertion becomes the
    ureteric orifice, a misplaced bud lands laterally on the developing trigone
    with a short intramural course. The same misplacement means the bud contacts
    an inappropriate region of metanephric mesenchyme, so intrinsic renal
    hypodysplasia is generated at the same time as the refluxing ureter — the
    unified "budding position" explanation for why VUR and congenital renal
    malformation co-segregate.

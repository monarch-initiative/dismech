inheritance:
- name: Autosomal dominant with incomplete penetrance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >
    Many multigenerational VUR kindreds segregate the trait in a pattern
    consistent with autosomal dominant inheritance with reduced penetrance and
    highly variable expressivity (grade, laterality, and presence of reflux
    nephropathy all vary within a pedigree). Dominant-model parametric linkage
    underpins the VUR1 (1p13) and 10q26 signals. A 2q37 dominant locus is also
    reported in the linkage literature but has no OMIM VUR series number and is
    not modelled as a subtype here.
  evidence:
  - reference: PMID:19443636
    reference_title: "A recessive gene for primary vesicoureteral reflux maps to chromosome 12p11-q13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Linkage scans suggest that pVUR is genetically heterogeneous with two loci on chromosomes 1p13 and 2q37 under autosomal dominant inheritance."
    explanation: >
      States that the mapped primary-VUR loci (1p13 and 2q37) were identified
      under an autosomal dominant model. Note this is the background framing of
      prior scans, not a result of this paper, whose own dominant-model analysis
      was negative.
  - reference: PMID:29097723
    reference_title: "Genome-wide linkage and association study implicates the 10q26 region as a major genetic contributor to primary nonsyndromic vesicoureteric reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "parametric linkage analysis of 460 families (1062 affected individuals) under a dominant model identified a single region, on 10q26, that showed strong linkage (HLOD = 4.90; ZLRLOD = 4.39) to VUR"
    explanation: >
      The largest VUR linkage study to date obtained its only significant signal
      under a dominant model, supporting dominant transmission in a subset of
      families.
  - reference: PMID:1623385
    reference_title: "Vesicoureteric reflux in sibships."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis suggests that most instances of familial vesicoureteric reflux arise secondary to expression of autosomal dominant single genes with incomplete penetrance."
    explanation: >
      Direct support for the structured penetrance qualifier: segregation
      analysis of a sibship in which reflux skipped the preceding and succeeding
      generations concluded that dominant alleles with incomplete penetrance
      explain most familial VUR.
- name: Autosomal recessive (VUR7 kindreds)
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Absence of reflux in the parents of many affected children prompted testing
    of a recessive model, which uncovered the chromosome 12p11-q13 (VUR7) locus
    across pedigrees of several ancestries.
  evidence:
  - reference: PMID:19443636
    reference_title: "A recessive gene for primary vesicoureteral reflux maps to chromosome 12p11-q13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, we identified a unique linkage peak under the recessive model on chromosome 12p11-q13 (D12S1048), which we confirmed by fine mapping."
    explanation: >
      Directly documents recessive inheritance of a major primary-VUR locus.
- name: Polygenic and multifactorial contribution
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >
    In most families no single Mendelian locus is identified; sib-pair and
    genome-wide association analyses point to multiple contributing loci of
    small effect superimposed on the familial clustering.
  evidence:
  - reference: PMID:19959718
    reference_title: "Whole-genome linkage and association scan in primary, nonsyndromic vesicoureteric reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results of this study, which is the largest to date investigating the genetics of reflux, suggest that major loci may not exist for this common renal tract malformation within European populations."
    explanation: >
      A large linkage/association scan failed to find major loci, favouring an
      oligogenic/polygenic architecture in most families.
  - reference: PMID:19690587
    reference_title: "A genome scan in affected sib-pairs with familial vesicoureteral reflux identifies a locus on chromosome 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results suggested that multiple genes are likely to contribute to the formation of VUR phenotype."
    explanation: >
      Affected sib-pair analysis identified three independent linkage peaks,
      supporting a multigenic contribution.

has_subtypes:
- name: VUR1
  display_name: Vesicoureteral reflux 1 (VUR1, 1p13 locus)
  subtype_term:
    preferred_term: vesicoureteral reflux 1
    term:
      id: MONDO:0008653
      label: vesicoureteral reflux 1
  description: >
    The first mapped familial VUR locus, on chromosome 1p13, defined by the
    original genome-wide search in seven European families with apparently
    dominant inheritance of VUR and reflux nephropathy. The causal gene has not
    been identified. OMIM 193000 is the index entry of the VUR phenotypic
    series.
  evidence:
  - reference: PMID:10739767
    reference_title: "Primary, nonsyndromic vesicoureteric reflux and its nephropathy is genetically heterogeneous, with a locus on chromosome 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most positive locus spanned 20 cM on 1p13 between GATA176C01 and D1S1653 and had a nonparametric LOD score (NPL) of 5.76 (P=.0002) and a parametric LOD score of 3.16."
    explanation: >
      Defines the VUR1 locus interval on 1p13 with genome-wide significant
      linkage.
  - reference: PMID:19959718
    reference_title: "Whole-genome linkage and association scan in primary, nonsyndromic vesicoureteric reflux."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "We found modest evidence of linkage but no clear overlap with previous studies."
    explanation: >
      Counter-evidence: a much larger whole-genome scan did not replicate the
      earlier VUR linkage peaks, so VUR1 (and by the same argument the
      sib-pair-derived VUR4/VUR5/VUR6 loci) should be read as unreplicated
      mapping results, not as established disease loci.
- name: VUR2
  display_name: Vesicoureteral reflux 2 (VUR2, ROBO2)
  subtype_term:
    preferred_term: vesicoureteral reflux 2
    term:
      id: MONDO:0012573
      label: vesicoureteral reflux 2
  description: >
    VUR caused by disruption of ROBO2 (3p12.3), the receptor for SLIT ligands.
    Identified through a de novo t(Y;3) translocation disrupting ROBO2 in a man
    with severe bilateral VUR and ureterovesical junction defects, with
    segregating intracellular missense variants in two further CAKUT/VUR
    families. Rare ROBO2 variants account for roughly 3% of familial primary
    VUR families in the largest sequenced cohort.
  subtype_frequency: about 3% of familial primary VUR families
  genes:
  - preferred_term: ROBO2
    term:
      id: hgnc:10250
      label: ROBO2
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:17357069
      reference_title: "Disruption of ROBO2 is associated with urinary tract anomalies and confers risk of vesicoureteral reflux."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In addition, we identified two novel ROBO2 intracellular missense variants that segregate with CAKUT and VUR in two unrelated families."
      explanation: >
        Heterozygous ROBO2 variants segregating with disease in two families
        support dominant transmission of VUR2.
  evidence:
  - reference: PMID:17357069
    reference_title: "Disruption of ROBO2 is associated with urinary tract anomalies and confers risk of vesicoureteral reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This translocation disrupts ROBO2, which encodes a transmembrane receptor for SLIT ligand, and produces dominant-negative ROBO2 proteins that abrogate SLIT-ROBO signaling in vitro."
    explanation: >
      Establishes ROBO2 disruption as the lesion underlying this VUR subtype.
- name: VUR3
  display_name: Vesicoureteral reflux 3 (VUR3, SOX17)
  subtype_term:
    preferred_term: vesicoureteral reflux 3
    term:
      id: MONDO:0013356
      label: vesicoureteral reflux 3
  description: >
    VUR associated with mutation of SOX17 (8q11.23), an HMG-box transcription
    factor and Wnt/beta-catenin antagonist. The recurrent p.Y259N allele
    accumulates as protein and produces excessive inhibition of Wnt signalling
    during kidney and urinary tract development.
  genes:
  - preferred_term: SOX17
    term:
      id: hgnc:18122
      label: SOX17
  evidence:
  - reference: PMID:20960469
    reference_title: "Mutations in SOX17 are associated with congenital anomalies of the kidney and the urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified mutations in SOX17, an HMG-box transcription factor and Wnt signaling antagonist, in eight patients with CAKUT (seven vesico-ureteric reflux, one pelvic obstruction)."
    explanation: >
      Documents SOX17 mutation in patients whose predominant CAKUT phenotype is
      vesicoureteric reflux.
- name: VUR4
  display_name: Vesicoureteral reflux 4 (VUR4, chromosome 5 locus)
  subtype_term:
    preferred_term: vesicoureteral reflux 4
    term:
      id: MONDO:0013682
      label: vesicoureteral reflux 4
  description: >
    Susceptibility locus on chromosome 5 identified by affected sib-pair
    analysis of 98 multiplex familial VUR families; the strongest of three peaks
    in that scan (LOD > 4). No causal gene has been identified.
  evidence:
  - reference: PMID:19690587
    reference_title: "A genome scan in affected sib-pairs with familial vesicoureteral reflux identifies a locus on chromosome 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a genome-wide statistically significant linkage peak with an LOD score greater than 4 on chromosome 5 and two linkage peaks with LOD scores greater than 3.6 on chromosomes 13 and 18 were identified in these 98 families"
    explanation: >
      Defines the chromosome 5 locus that OMIM designates VUR4.

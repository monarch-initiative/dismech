- name: Renal Inflammatory Cell Recruitment
  biological_scale: CELLULAR
  role: amplifier
  conforms_to: "fibrotic_response#Inflammatory Recruitment and Amplification"
  description: >
    Bacterial burden in the refluxing renal segment recruits neutrophils and
    monocyte-derived macrophages in proportion to that burden. Neutrophils
    control bacterial ascent, but the macrophage-dominated inflammatory response
    is strong and ineffective, and it is the extent of this inflammation — not
    the infection itself — that best predicts subsequent fibrosis. Experimental
    tipping of the neutrophil-macrophage balance towards macrophages worsens
    scarring, identifying this recruitment step as the amplifier that converts a
    treatable infection into permanent renal damage.

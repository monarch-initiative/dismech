    reference_title: "A genome scan in affected sib-pairs with familial vesicoureteral reflux identifies a locus on chromosome 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two linkage peaks with LOD scores greater than 3.6 on chromosomes 13 and 18 were identified in these 98 families"

- name: Retrograde Urine Flow and Intrarenal Reflux
  biological_scale: ORGANISM
  role: mechanism
  description: >
    Once the flap valve fails, urine flows retrogradely up the ureter during
    voiding. In higher grades the refluxed bolus reaches the renal pelvis and
    then enters the collecting ducts (intrarenal reflux) through gaping duct
    orifices on compound papillae, which are concentrated at the upper and lower
    renal poles. Intrarenal reflux is the step that converts a ureteric problem
    into a parenchymal one, and it defines the polar distribution of the scars
    that follow. Grade (I-V, International Reflux Study) tracks the extent of
    retrograde filling and dilation and is the main determinant of both
    spontaneous resolution and scarring risk.
  locations:
  - preferred_term: renal pelvis
    term:
      id: UBERON:0001224
      label: renal pelvis
  - preferred_term: ureter
    term:

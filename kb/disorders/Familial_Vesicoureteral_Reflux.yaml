- name: Ureterovesical Junction Incompetence
  biological_scale: TISSUE
  role: mechanism
  description: >
    The ureterovesical junction normally acts as a passive flap valve: the
    distal ureter runs obliquely for 1-2 cm within the bladder wall between the
    mucosa and the detrusor, so rising intravesical pressure compresses the
    tunnel shut. In primary VUR the intramural tunnel is too short relative to
    ureteric diameter and the orifice is laterally displaced, so the valve fails
    and urine refluxes during filling and, above all, during voiding.
    Extracellular-matrix competence of the junction also matters: TNXB, mutated
    in VUR8, is expressed in the uroepithelium of the ureterovesical junction at
    the time it forms and is proposed to generate the tensile forces that close
    it, with patient fibroblasts showing defective focal-adhesion turnover.

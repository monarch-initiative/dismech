name: Familial Vesicoureteral Reflux
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: familial vesicoureteral reflux
  term:
    id: MONDO:0017329
    label: familial vesicoureteral reflux
synonyms:
- familial VUR
- hereditary vesicoureteral reflux
- primary nonsyndromic vesicoureteric reflux
- familial primary vesicoureteric reflux
parents:
- hereditary disease
- vesicoureteral reflux
description: >
  Familial vesicoureteral reflux (VUR) is the familial occurrence of primary,
  non-syndromic retrograde flow of urine from the bladder into the ureter and,
  in higher grades, into the renal pelvis and collecting ducts. The proximate
  defect is a congenitally incompetent ureterovesical junction: an abnormally
  positioned, laterally displaced ureteric orifice with a short intramural
  (submucosal) ureteric tunnel that cannot be compressed against the detrusor
  during bladder filling and voiding, so the normal flap-valve fails.
  Developmentally the defect is traced to an abnormal site of ureteric bud
  outgrowth from the nephric (Wolffian) duct, which both misplaces the future
  ureteric orifice and, because the bud then contacts an inappropriate region of
  metanephric mesenchyme, can produce co-existing renal hypodysplasia. This
  explains why the renal lesion in VUR ("reflux nephropathy") is partly
  congenital (dysplasia) and partly acquired (post-pyelonephritic cortical
  scarring), and why renal damage is not fully preventable by controlling
  infection. Familial aggregation is strong — roughly one third of siblings and
  up to two thirds of offspring of an affected mother are affected — and
  transmission in many kindreds resembles autosomal dominant inheritance with
  incomplete penetrance and variable expressivity, though the condition is
  highly locus-heterogeneous and in most families no single gene is found. The
  OMIM phenotypic series (PS193000) recognises eight autosomal loci, VUR1-VUR8,
  of which three have an identified gene: ROBO2 (VUR2), SOX17 (VUR3) and TNXB
  (VUR8); an X-linked form is also described. VUR sits within the spectrum of
  congenital anomalies of the kidney and urinary tract (CAKUT), and reflux
  nephropathy remains a leading cause of childhood hypertension and of kidney
  failure in children and young adults.
notes: >
  Scope: this entry models PRIMARY, non-syndromic, familial VUR. Secondary VUR
  arising from bladder outlet obstruction (posterior urethral valves),
  neurogenic bladder, or as one feature of a defined multisystem syndrome
  (renal coloboma/PAX2, branchio-oto-renal, Ochoa/urofacial, prune belly,
  exstrophy-epispadias, 22q11.2 deletion) is out of scope and is curated on the
  respective syndrome entries. Bladder and bowel dysfunction is modelled here as
  a modifying co-factor rather than as a cause, since in primary VUR it worsens
  infection risk and lowers spontaneous-resolution rates but is not the
  originating lesion. No GeneReviews chapter exists for familial vesicoureteral
  reflux (a PubMed search for "vesicoureteral reflux"[TI] AND GeneReviews
  returned no results on 2026-08-01), so the phenotype baseline here is drawn
  from the primary literature plus a current clinical reference review. A
  claude_code deep-research run was performed
  (research/Familial_Vesicoureteral_Reflux-deep-research-claude_code.md) but
  returned only a short ontology-verification addendum rather than a full
  narrative; every claim in this entry was therefore anchored directly on
  primary literature fetched and snippet-verified against cached abstracts.


  - target: Proposed Clonal Growth Advantage
    description: Loss of the myeloid common deleted region is proposed to help the PIGT-deficient clone expand; the causal relationship remains unproven.
    evidence:
    - &id008
      reference: PMID:31430258
      reference_title: Complement and inflammasome overactivation mediates paroxysmal nocturnal hemoglobinuria with autoinflammation.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: The causal relationship between the myeloid CDR loss in PIGT-PNH and clonal expansion needs to be proven, particularly because boosted lineages under L3MBTL1 and SGK2 loss differ between in vitro study (13) and PIGT-PNH patients, and because platelet and leukocyte counts were not much changed in PIGT-PNH patients (Supplemental Figure 1A).
      explanation: The authors explicitly identify the clonal-advantage explanation as unproven.
      quote_role: BACKGROUND
      directness: DIRECT
- name: Proposed Clonal Growth Advantage

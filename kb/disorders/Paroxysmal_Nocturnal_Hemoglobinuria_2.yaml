    reference_title: Structure of human glycosylphosphatidylinositol transamidase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The PIGK subunit functions as the catalytic component, in which we identified a C206-H164-N58 triad that is critical for the transamination reaction.
    explanation: Structural and functional analysis locates the catalytic machinery in PIGK, distinguishing the complex activity from PIGT subunit loss.
  downstream:
  - target: Failure of GPI Attachment to Proteins
    description: Loss of PIGT disables the attachment step of GPI-protein maturation.
    evidence:
    - reference: PMID:31430258
      reference_title: Complement and inflammasome overactivation mediates paroxysmal nocturnal hemoglobinuria with autoinflammation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Unlike in PIGA-PNH cells, GPI is synthesized in PIGT-PNH cells and, since its attachment to proteins is blocked, free GPI is expressed on the cell surface.
      explanation: PIGT deficiency blocks protein attachment while permitting free GPI synthesis and surface expression.

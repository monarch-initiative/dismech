- name: Loss of Co-deleted Myeloid Region Gene Expression
  description: The somatic 20q deletion can encompass the myeloid common deleted region as well as PIGT. L3MBTL1 and SGK2 transcript loss is observed in affected patient blood cells; these are co-deletion findings, not established independent causal PNH genes.
  evidence:
  - reference: PMID:31430258
    reference_title: Complement and inflammasome overactivation mediates paroxysmal nocturnal hemoglobinuria with autoinflammation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: L3MBTL1 and SGK2 transcripts were undetectable in GPI-AP–defective granulocytes from J1 and extremely low in whole blood cells from G1, whereas they were found in granulocytes from healthy individuals (Figure 2C).
    explanation: Patient blood-cell measurements show loss of transcripts from co-deleted genes.
  biological_scale: MOLECULAR

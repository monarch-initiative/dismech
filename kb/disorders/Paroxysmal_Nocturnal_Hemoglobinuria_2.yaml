      snippet: PIGT, forming a GPI transamidase complex with PIGK, PIGS, PIGU, and GPAA1, acts in the transfer of preassembled GPI to proteins in the ER (Figure 1A, top and ref. 9).
      explanation: Identifies the PIGT-containing complex and its protein-anchor transfer function.
      quote_role: BACKGROUND
- name: PIGT-Dependent GPI Transamidase Dysfunction
  description: Loss of the essential PIGT component disables GPI-anchor transamidase function of the multisubunit complex. The molecular-function binding names the complex activity; it does not assert that PIGT itself contains the catalytic active site. Structural work identifies PIGK as the catalytic component.

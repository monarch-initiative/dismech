  relationship_type: CAUSATIVE
  variant_origin: GERMLINE_AND_SOMATIC
  notes: The somatic chromosome 20q deletion can encompass additional genes. Those co-deleted genes are not automatically asserted as independent PNH causes. Biallelic germline hypomorphic PIGT disease has a different developmental phenotype.

name: Paroxysmal Nocturnal Hemoglobinuria 2
creation_date: '2026-11-20T22:11:31Z'
category: Genetic
synonyms:
- PIGT-related paroxysmal nocturnal hemoglobinuria
- PIGT-PNH
- PNH2
disease_term:
  preferred_term: paroxysmal nocturnal hemoglobinuria 2
  term:
    id: MONDO:0014166
    label: paroxysmal nocturnal hemoglobinuria 2
parents:
- Paroxysmal Nocturnal Hemoglobinuria
description: Paroxysmal nocturnal hemoglobinuria 2 (PIGT-PNH) is an acquired clonal blood disorder caused by a constitutional PIGT variant together with somatic loss of the other allele, usually within a chromosome 20q deletion. PIGT deficiency blocks attachment of glycosylphosphatidylinositol (GPI) anchors to proteins. Loss of cell-surface complement inhibitors permits intravascular hemolysis, while accumulation of unattached GPI provides a distinct inflammatory mechanism with recurrent aseptic meningitis, urticaria and arthralgia. This germline-plus-somatic disease is distinct from biallelic germline PIGT-related developmental GPI-anchor deficiency.
inheritance:
- name: Germline predisposition with somatic second hit
  inheritance_term:
    preferred_term: Typified by somatic mosaicism
    term:
      id: HP:0001442
      label: Typified by somatic mosaicism
  description: A constitutional PIGT lesion is followed by somatic loss of the functional allele in a hematopoietic clone; the clinical disorder is not transmitted as a simple Mendelian PNH phenotype.
  evidence:
  - &id001
    reference: PMID:23733340
    reference_title: A case of paroxysmal nocturnal hemoglobinuria caused by a germline mutation and a somatic mutation in PIGT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified a heterozygous germline splice site mutation in PIGT and a somatic 8-MB deletion in granulocytes affecting the other copy of PIGT.
    explanation: Paired constitutional and clonal lesions inactivate both PIGT copies.
genetic:

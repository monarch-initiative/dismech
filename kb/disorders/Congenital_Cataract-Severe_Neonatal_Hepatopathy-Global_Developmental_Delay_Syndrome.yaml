prevalence:
- population: Published families worldwide
  measure_type: CASES_IN_LITERATURE
  notes: >-
    Two families with the full syndrome (one with several affected relatives) and two
    further families with biallelic variants and isolated congenital cataract have
    been published. No population-based figure exists.
  evidence:
  - reference: PMID:40659633
    reference_title: "CYP51A1 in health and disease: from sterol metabolism to regulated cell death."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Another study investigating 115 cataract-associated genes in 36 unrelated patients with syndromic or nonsyndromic bilateral congenital cataracts found one patient harboring compound heterozygous mutations in CYP51A1 (I312T and Y421X, rs141654764)."
    explanation: The second syndromic patient, from a cataract gene-panel cohort.
  - reference: PMID:27878435
    reference_title: "Novel phenotypes and loci identified through clinical genomics approaches to pediatric cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, our finding of an independent mutation in 16DG0226 (Figure S1) confirm CYP51A1 as a disease gene for the syndrome of cataract and cholestatic liver disease, although it can also be mutated in patients with isolated cataract."
    explanation: An independent syndromic family, and the existence of isolated-cataract families.
pathophysiology:
- name: CYP51A1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic CYP51A1 variants reduce lanosterol 14alpha-demethylase. Reported alleles
    are missense except one stop-gain in compound heterozygosity, consistent with
    complete loss being incompatible with development, as in the knockout mouse. In
    lymphoblastoid cells from a compound heterozygous patient, transcript expression
    and protein abundance were reduced and enzyme function was lost.
  genes:
  - preferred_term: CYP51A1
    term:
      id: hgnc:2649
      label: CYP51A1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: Biallelic (homozygous or compound heterozygous) germline CYP51A1 variants.
  molecular_functions:
  - preferred_term: lanosterol 14alpha-demethylase activity
    term:
      id: GO:0008398
      label: sterol 14-demethylase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:40912167
    reference_title: "Expansion of genotype/phenotype correlation in an individual with compound heterozygous variants in CYP51A1 and congenital cataract."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Molecular analysis of primary lymphoblastoid cells from the proband revealed defects in transcript expression, reduced protein abundance, and a loss of enzymatic function resulting in lanosterol accumulation and increased sensitivity to ferroptosis."
    explanation: Loss of enzyme function in patient cells.
  - reference: PMID:27878435
    reference_title: "Novel phenotypes and loci identified through clinical genomics approaches to pediatric cataract."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "CYP51A1 encodes lanosterol 14α-demethylase, an enzyme that catalyzes a late step in cholesterol synthesis"
    explanation: The normal function of the gene product.
  - reference: PMID:27878435
    reference_title: "Novel phenotypes and loci identified through clinical genomics approaches to pediatric cataract."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Complete deficiency of the murine ortholog is embryonic lethal, which may explain why all the mutations, with the exception of one heterozygous stop-gain, observed thus far in this gene are all missense, rather than truncating"
    explanation: The allele spectrum is hypomorphic, consistent with the lethality of complete loss.
  downstream:
  - target: Lanosterol Accumulation
    description: The enzyme's substrates accumulate behind the block.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40912167
      reference_title: "Expansion of genotype/phenotype correlation in an individual with compound heterozygous variants in CYP51A1 and congenital cataract."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Molecular analysis of primary lymphoblastoid cells from the proband revealed defects in transcript expression, reduced protein abundance, and a loss of enzymatic function resulting in lanosterol accumulation and increased sensitivity to ferroptosis."
      explanation: Loss of function leads to lanosterol accumulation in patient cells.
  - target: Impaired Cholesterol Synthesis
    description: The block removes an obligatory step of post-lanosterol cholesterol synthesis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21705796
      reference_title: "Mouse knockout of the cholesterogenic cytochrome P450 lanosterol 14alpha-demethylase (Cyp51) resembles Antley-Bixler syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cholesterol precursors downstream of the CYP51 enzymatic step were not detected, indicating that the targeting in this study blocked de novo cholesterol synthesis."
      explanation: Complete loss in the mouse abolishes de novo cholesterol synthesis.
  - target: Increased Ferroptosis Sensitivity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:40912167
      reference_title: "Expansion of genotype/phenotype correlation in an individual with compound heterozygous variants in CYP51A1 and congenital cataract."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Molecular analysis of primary lymphoblastoid cells from the proband revealed defects in transcript expression, reduced protein abundance, and a loss of enzymatic function resulting in lanosterol accumulation and increased sensitivity to ferroptosis."
      explanation: Patient cells are more sensitive to ferroptosis.

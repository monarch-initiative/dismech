name: Congenital Cataract-Severe Neonatal Hepatopathy-Global Developmental Delay Syndrome
creation_date: "2026-11-27T14:20:36Z"
category: Mendelian
disease_term:
  preferred_term: congenital cataract-severe neonatal hepatopathy-global developmental delay syndrome
  term:
    id: MONDO:0033853
    label: congenital cataract-severe neonatal hepatopathy-global developmental delay syndrome
synonyms:
- lanosterolosis
description: >-
  Autosomal recessive syndrome of congenital cataract, severe neonatal cholestatic
  liver disease and global developmental delay, attributed to biallelic CYP51A1
  variants. CYP51A1 encodes lanosterol 14alpha-demethylase, the cytochrome P450 of
  cholesterol synthesis that demethylates lanosterol and 24,25-dihydrolanosterol.
  The syndrome rests on two families. In a consanguineous family a homozygous
  p.Leu232Pro variant was found with congenital cataract, neonatal fulminant liver
  failure with giant-cell cholestatic hepatitis, and developmental delay, and
  relatives died in infancy of liver failure or progressive cholestatic jaundice; a
  second child, compound heterozygous for a missense and a stop-gain allele, had
  cataract, developmental delay, spastic hemiparesis and neonatal cirrhosis.
  Biallelic CYP51A1 variants are also reported with isolated congenital cataract,
  and patient cells show reduced CYP51A1 protein, loss of enzyme activity and
  lanosterol accumulation. The presentation resembles galactosemia.
parents:
- syndromic disease
- cholesterol biosynthetic process disease
notes: >-
  Scope: this entry is the CYP51A1 syndrome defined by Orphanet (ORPHA:521432,
  the only cross-reference of MONDO:0033853, which carries no text definition). No
  gene-related name is established in the literature, so the MONDO label is kept
  in title case; lanosterolosis is used for CYP51A1 deficiency in one 2026 report
  (PMID:43038916) and is recorded as a synonym only. The descriptive name also fits
  galactosemia, which the syndrome resembles clinically. Biallelic CYP51A1 variants
  have also been reported with isolated congenital cataract (PMID:22935719,
  PMID:40912167); those reports are cited here for the gene's function and for the
  cataract, but whether isolated cataract and the hepatic syndrome are one
  allelic spectrum or distinct entities is not settled, and MONDO and Orphanet name
  only the syndrome. The evidence for the full syndrome is two families, so the
  CYP51A1 record is typed UNKNOWN rather than CAUSATIVE; ClinGen has not curated
  CYP51A1. No GeneReviews chapter covers this disorder. Earlier reports linking
  heterozygous CYP51A1 variants to Antley-Bixler syndrome are not part of this
  entry.

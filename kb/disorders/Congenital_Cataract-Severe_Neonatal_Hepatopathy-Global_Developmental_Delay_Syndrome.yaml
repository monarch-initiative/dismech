genetic:
- name: CYP51A1
  gene_term:
    preferred_term: CYP51A1
    term:
      id: hgnc:2649
      label: CYP51A1
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    Typed UNKNOWN because the full syndrome rests on two families: a consanguineous
    family with homozygous p.Leu232Pro (c.695T>C), mapped by combining the index
    patient and an affected cousin, and a child compound heterozygous for p.Ile312Thr
    and the stop-gain p.Tyr421Ter. Isolated congenital cataract with biallelic
    variants is reported in two further families: homozygous p.Arg277Cys
    (PMID:22935719), and a compound heterozygous child whose alleles are the only
    CYP51A1 variants with published functional loss (PMID:40912167). ClinGen has not
    curated CYP51A1 and no GenCC classification is recorded here.
  evidence:
  - reference: PMID:27878435
    reference_title: "Novel phenotypes and loci identified through clinical genomics approaches to pediatric cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By combining the index and his affected cousin, we were able to map this phenotype to a locus on Chr7: 80,350,364-105,103,372 where exome sequencing revealed a mutation in CYP51A1 (NM_000786.3:c.695T>C;p.(Leu232Pro))."
    explanation: Linkage and exome sequencing in the index family.
  - reference: PMID:27878435
    reference_title: "Novel phenotypes and loci identified through clinical genomics approaches to pediatric cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, our finding of an independent mutation in 16DG0226 (Figure S1) confirm CYP51A1 as a disease gene for the syndrome of cataract and cholestatic liver disease, although it can also be mutated in patients with isolated cataract."
    explanation: Independent mutation supporting CYP51A1 as the syndrome gene.
  - reference: PMID:40912167
    reference_title: "Expansion of genotype/phenotype correlation in an individual with compound heterozygous variants in CYP51A1 and congenital cataract."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies were performed to resolve the impact of these variants, demonstrating effects at the both the transcript and protein level, and clear evidence of pathogenicity."
    explanation: Functional evidence for pathogenicity of two further alleles.
  - reference: PMID:22935719
    reference_title: "Genomic analysis of pediatric cataract in Saudi Arabia reveals novel candidate disease genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identified novel candidate genes require independent confirmation in future studies."
    explanation: The first report regarded CYP51A1 as a candidate needing confirmation.
  variants:
  - name: p.Leu232Pro (c.695T>C)
    description: >-
      Homozygous in the index consanguineous family with cataract, neonatal fulminant
      hepatic failure and developmental delay.
    evidence:
    - reference: PMID:27878435
      reference_title: "Novel phenotypes and loci identified through clinical genomics approaches to pediatric cataract."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Congenital cataract, neonatal fulminant hepatic failure and global developmental delay | Yes | AR | 2 | Variant found in a novel candidate gene | CYP51A1 | NM_000786.3:c.695T>C;p.(Leu232Pro) | Homo"
      explanation: Genotype and phenotype of the index patient.
  - name: p.Ile312Thr and p.Tyr421Ter
    description: >-
      Compound heterozygous missense and stop-gain alleles in a child with cataract,
      developmental delay, spastic hemiparesis and neonatal cirrhosis.
    evidence:
    - reference: PMID:40659633
      reference_title: "CYP51A1 in health and disease: from sterol metabolism to regulated cell death."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Another study investigating 115 cataract-associated genes in 36 unrelated patients with syndromic or nonsyndromic bilateral congenital cataracts found one patient harboring compound heterozygous mutations in CYP51A1 (I312T and Y421X, rs141654764)."
      explanation: Genotype of the second syndromic patient.
  - name: p.Arg277Cys (c.829C>T)
    description: >-
      Homozygous in a family with apparently isolated congenital cataract and
      pseudodominant transmission.
    evidence:
    - reference: PMID:27878435
      reference_title: "Novel phenotypes and loci identified through clinical genomics approaches to pediatric cataract."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Congenital cataract | No | Pseudodominant (AR) | 2 | Variant found in a novel candidate gene | CYP51A1 | NM_000786.3:c.829C>T;p.(Arg277Cys) | Homo"
      explanation: Genotype of the isolated-cataract family.
progression:
- phase: Neonatal onset
  notes: >-
    Cataract and cholestatic jaundice are present in the first week of life; liver
    failure followed in the neonatal period, and affected relatives died at two months
    or in the neonatal period. Long-term outcome of survivors is not described.
  evidence:
  - reference: PMID:27878435
    reference_title: "Novel phenotypes and loci identified through clinical genomics approaches to pediatric cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Another recognizable syndrome was observed in 16DG0226 who was found at 1 week of age to have cholestatic jaundice and cataract, and was referred to our center for further evaluation."
    explanation: Neonatal onset.
  - reference: PMID:27878435
    reference_title: "Novel phenotypes and loci identified through clinical genomics approaches to pediatric cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Parents are consanguineous and there is history of one sister who died at age of 2 months with liver failure."
    explanation: Early death from liver failure in a sib.
diagnosis:
- name: Exome or gene-panel sequencing
  description: >-
    Biallelic CYP51A1 variants identified by exome or cataract gene-panel
    sequencing; reported variants are mostly missense and may need functional study.
    The clinical picture resembles galactosemia, which is excluded biochemically.
  evidence:
  - reference: PMID:27878435
    reference_title: "Novel phenotypes and loci identified through clinical genomics approaches to pediatric cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also highlight a recognizable syndrome that resembles galactosemia (a fulminant infantile liver disease with cataract) caused by biallelic mutations in CYP51A1."
    explanation: Galactosemia-like presentation identified by genomic testing.
  - reference: PMID:40912167
    reference_title: "Expansion of genotype/phenotype correlation in an individual with compound heterozygous variants in CYP51A1 and congenital cataract."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies were performed to resolve the impact of these variants, demonstrating effects at the both the transcript and protein level, and clear evidence of pathogenicity."
    explanation: Functional testing resolved variants of uncertain significance.
- name: Plasma sterol analysis
  description: >-
    Blood sterols have been measured in a patient with CYP51A1 variants. Long-term
    itraconazole, which inhibits the same enzyme, raises plasma lanosterol and mimics
    an inherited sterol disorder, so the medication history must be reviewed.
  evidence:
  - reference: PMID:43038916
    reference_title: "Itraconazole-induced lanosterol accumulation mimicking genetic sterol disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest that long-term itraconazole use is associated with lanosterol accumulation, biochemically mimicking an inherited sterol disorder."
    explanation: Drug-induced lanosterol accumulation is a biochemical mimic.
  - reference: PMID:43038916
    reference_title: "Itraconazole-induced lanosterol accumulation mimicking genetic sterol disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings highlight the importance of reviewing medication history to avoid misdiagnosis and unnecessary testing."
    explanation: Medication history should be reviewed before attributing raised lanosterol to a genetic cause.
differential_diagnoses:
- name: Classic galactosemia
  description: >-
    Neonatal liver disease with cataract; the CYP51A1 syndrome was recognised because
    it resembles galactosemia. Galactosemia is excluded by testing for reducing
    substances, which were negative in the index patient.
  evidence:
  - reference: PMID:27878435
    reference_title: "Novel phenotypes and loci identified through clinical genomics approaches to pediatric cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also highlight a recognizable syndrome that resembles galactosemia (a fulminant infantile liver disease with cataract) caused by biallelic mutations in CYP51A1."
    explanation: Clinical resemblance to galactosemia.
  - reference: PMID:27878435
    reference_title: "Novel phenotypes and loci identified through clinical genomics approaches to pediatric cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Urine was negative for succinylacetone and reducing substances, and blood had normal isoelectric focusing of transferring."
    explanation: Galactosemia, tyrosinemia and glycosylation-disorder screens were negative in the index patient.
- name: Drug-induced lanosterol accumulation
  description: >-
    Long-term itraconazole raises plasma lanosterol and can mimic an inherited sterol
    disorder biochemically.
  evidence:
  - reference: PMID:43038916
    reference_title: "Itraconazole-induced lanosterol accumulation mimicking genetic sterol disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest that long-term itraconazole use is associated with lanosterol accumulation, biochemically mimicking an inherited sterol disorder."
    explanation: Acquired biochemical mimic.
experimental_models:
- name: CYP51A1-knockout HepG2 cell line
  experimental_model_type: CELL_LINE
  description: >-
    CRISPR-Cas9 knockout in a human hepatoma line, made alongside DHCR24 and SC5D
    knockouts to compare the effects of different accumulating sterols.
  publication: PMID:39262789
  modeled_mechanisms:
  - target: Lanosterol Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Reproduces accumulation of both CYP51A1 substrates in a hepatocyte background.
    limitations: >-
      A transformed hepatoma line with complete loss of the enzyme, whereas patients
      carry hypomorphic alleles, and the cells cannot model the lens or the neonatal
      liver.
    evidence:
    - reference: PMID:39262789
      reference_title: "Knockouts of CYP51A1, DHCR24, or SC5D from cholesterol synthesis reveal pathways modulated by sterol intermediates."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The most striking was the phenotype of CYP51 KO with highly elevated lanosterol and 24,25-dihydrolanosterol, significant increase in G2+M phase and enhanced cancer and cell cycle pathways."
      explanation: Substrate accumulation in the knockout cells.
animal_models:
- name: Cyp51 knockout mouse
  species: Mouse
  genotype: Cyp51 -/-
  publication: PMID:21705796
  description: >-
    Complete knockout: embryonic lethal at embryonic day 15 with heart and other
    Antley-Bixler-like defects, accumulation of lanosterol and 24,25-dihydrolanosterol,
    and no de novo cholesterol synthesis.
  modeled_mechanisms:
  - target: Lanosterol Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Reproduces substrate accumulation in vivo.
    limitations: >-
      Complete loss is embryonic lethal, whereas patients carry hypomorphic alleles and
      survive to birth; the knockout does not model the cataract or the neonatal
      liver disease.
    evidence:
    - reference: PMID:21705796
      reference_title: "Mouse knockout of the cholesterogenic cytochrome P450 lanosterol 14alpha-demethylase (Cyp51) resembles Antley-Bixler syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The two CYP51 enzyme substrates (lanosterol and 24,25-dihydrolanosterol) were markedly accumulated."
      explanation: Substrate accumulation in the knockout.
  - target: Impaired Cholesterol Synthesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Complete block of de novo cholesterol synthesis.
    limitations: >-
      Shows the consequence of complete loss only; residual activity in patients is
      unknown.
    evidence:
    - reference: PMID:21705796
      reference_title: "Mouse knockout of the cholesterogenic cytochrome P450 lanosterol 14alpha-demethylase (Cyp51) resembles Antley-Bixler syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cholesterol precursors downstream of the CYP51 enzymatic step were not detected, indicating that the targeting in this study blocked de novo cholesterol synthesis."
      explanation: Synthesis block in the knockout.
discussions:
- discussion_id: cyp51a1-syndrome-evidence-base
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is CYP51A1 deficiency one disease spanning isolated cataract to fatal neonatal
    liver failure, and what determines whether the liver is involved?
  attaches_to:
  - genetic#CYP51A1
  - pathophysiology#Cholestatic Liver Injury
  rationale: >-
    Only two families with the hepatic syndrome and two with isolated cataract are
    published, functional data exist for one patient's alleles, and no plasma sterol
    profiles of syndromic patients have been reported. Genotype-phenotype
    correlation, the contribution of lanosterol accumulation versus cholesterol
    shortage, and the natural history of survivors are all unknown.

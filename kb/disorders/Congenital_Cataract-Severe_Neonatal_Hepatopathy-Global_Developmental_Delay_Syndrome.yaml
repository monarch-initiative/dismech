    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic variants in CYP51A1 have been associated with congenital cataracts and variable liver disease but an appreciation of genotype/phenotype correlation is lacking due to the limited number of patients described."

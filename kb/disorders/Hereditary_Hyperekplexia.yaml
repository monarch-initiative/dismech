- name: Thorase-Dependent AMPA Receptor Trafficking Failure
  description: >-
    The one route into this entry that does not pass through the glycinergic
    synapse. ATAD1 encodes Thorase, an AAA+ ATPase that disassembles the complex
    between the AMPA-receptor-binding protein GRIP1 and the AMPA receptor subunit
    GluA2 and thereby controls postsynaptic internalisation of excitatory AMPA
    receptors. The reported biallelic allele locks Thorase in its oligomeric
    state, disassembly of the GluA2 complex is impaired, and knockout neurons
    expressing the mutant carry less GluA2 at the cell surface. The node is kept
    separate from the glycine receptor and glycine transporter nodes because the
    lesion is at the excitatory synapse, which is also why the clinical
    delineation study reads the resulting disorder as distinct from hyperekplexia.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ATAD1
    term:
      id: hgnc:25903
      label: ATAD1
  biological_processes:
  - preferred_term: regulation of postsynaptic AMPA receptor internalisation
    term:
      id: GO:0099149
      label: regulation of postsynaptic neurotransmitter receptor internalization
    modifier: ABNORMAL
  - preferred_term: disassembly of the GRIP1-GluA2 complex
    term:
      id: GO:0032984
      label: protein-containing complex disassembly
    modifier: DECREASED
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:29390050
    reference_title: A homozygous ATAD1 mutation impairs postsynaptic AMPA receptor trafficking and causes a lethal encephalopathy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Postsynaptically, Thorase controls the internalization of excitatory, glutamatergic AMPA receptors by disassembling complexes between the AMPA receptor-binding protein, GRIP1, and the AMPA receptor subunit GluA2."
    explanation: >-
      States the normal function this node records as failing, and locates it at
      the excitatory rather than the glycinergic synapse.
  - reference: PMID:29390050
    reference_title: A homozygous ATAD1 mutation impairs postsynaptic AMPA receptor trafficking and causes a lethal encephalopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biochemical and cellular analyses show that the C-terminal end of Thorase mutant gained a novel function that strongly impacts its oligomeric state, reduces stability or expression of a set of Golgi, peroxisomal and mitochondrial proteins and affects disassembly of GluA2 and Thorase oligomer complexes."
    explanation: >-
      The measurement behind the impaired complex disassembly recorded on this
      node.
  - reference: PMID:29390050
    reference_title: A homozygous ATAD1 mutation impairs postsynaptic AMPA receptor trafficking and causes a lethal encephalopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "reduced amount of GluA2 at the cell surface suggesting that the Thorase mutant may inhibit the recycling back and/or reinsertion of AMPA receptors to the plasma membrane"
    explanation: >-
      Neuronal readout of the trafficking failure, and the authors' own reading of
      which step is blocked.
  downstream:
  - target: Muscle Stiffness
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The reported patients present with congenital limb stiffness, but no step
      between the AMPA-receptor trafficking defect and the motor phenotype has
      been shown, so the edge is carried as indirect with the intermediates
      unknown.
    evidence:
    - reference: PMID:33134516
      reference_title: Congenital immobility and stiffness related to biallelic ATAD1 variants.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients 1 and 2 had a similar distinctive phenotype comprising congenital stiffness of limbs, absent spontaneous movements, weak sucking, and hypoventilation."
      explanation: >-
        Reports the stiffness phenotype in biallelic ATAD1 patients that this edge
        connects to the trafficking defect.

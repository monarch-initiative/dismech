- name: GPHN Pathogenic Variants
  association: Pathogenic Variants
  gene_term:
    preferred_term: GPHN
    term:
      id: hgnc:15465
      label: GPHN
  features: >-
    GPHN encodes gephyrin, the postsynaptic scaffolding protein that clusters
    inhibitory glycine and GABA-A receptors, so the gene sits squarely in the
    pathway this disease disrupts. Its status as a hyperekplexia gene is weak
    rather than established: the one mutation screen to report a candidate found
    a single missense allele in a single patient, and the accompanying functional
    test showed that allele did not disrupt glycine-receptor binding to gephyrin
    or collybistin-induced surface clustering. The row is retained as a
    gene-level association because Orphanet lists it, with the contradicting
    functional result recorded beside it.
  notes: >-
    No MONDO class denotes a GPHN form of hyperekplexia. Searched
    synonym-inclusive with `runoak -i ols:mondo search "GPHN"` (one hit,
    MONDO:0044792 large congenital melanocytic nevus, unrelated) and
    `runoak -i ols:mondo search "gephyrin"` (no hits), so this gene has no
    subtype row and no `subtype_term` to bind.
  evidence:
  - reference: ORPHA:3197
    reference_title: "Hereditary hyperekplexia"
    supports: SUPPORT
    snippet: "GPHN | gephyrin | hgnc:15465 | Disease-causing germline mutation(s) in"
    explanation: Orphanet lists GPHN as a disease-causing gene for hereditary hyperekplexia.
  - reference: PMID:12684523
    reference_title: "Isoform heterogeneity of the human gephyrin gene (GPHN), binding domains to the glycine receptor, and mutation analysis in hyperekplexia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation analysis of GPHN exons in hyperekplexia patients revealed a missense mutation (A28T) in one patient causing an amino acid substitution (N10Y)."
    explanation: >-
      The only reported GPHN candidate allele in a hyperekplexia patient, and the
      basis of the gene's listing. A single patient is the whole genetic evidence.
  - reference: PMID:12684523
    reference_title: "Isoform heterogeneity of the human gephyrin gene (GPHN), binding domains to the glycine receptor, and mutation analysis in hyperekplexia."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Functional testing demonstrated that GPHNN10Y does not disrupt GlyR-gephyrin interactions or collybistininduced cell-surface clustering."
    explanation: >-
      Refutes pathogenicity of that one allele by the mechanism it would have to
      act through. Quoted verbatim, including the two word-joins the cached text
      carries where the source set GPHN-N10Y and collybistin-induced with
      formatting this extraction dropped.
- name: ATAD1 Pathogenic Variants
  association: Pathogenic Variants
  subtype: HPX4
  gene_term:
    preferred_term: ATAD1
    term:
      id: hgnc:25903
      label: ATAD1
  features: >-
    ATAD1 encodes Thorase, an AAA+ ATPase that disassembles GRIP1-GluA2 complexes
    and so controls internalisation of excitatory AMPA receptors. Biallelic
    variants cause the congenital stiffness and immobility syndrome numbered
    hyperekplexia 4, which is the one gene in this entry whose lesion is not in
    the glycinergic synapse; the delineation study of all eight reported patients
    concludes the entity is distinct from hyperekplexia.
  evidence:
  - reference: ORPHA:3197
    reference_title: "Hereditary hyperekplexia"
    supports: SUPPORT
    snippet: "ATAD1 | ATPase family AAA domain containing 1 | hgnc:25903 | Disease-causing germline mutation(s) in"
    explanation: Orphanet lists ATAD1 as a disease-causing gene for hereditary hyperekplexia.

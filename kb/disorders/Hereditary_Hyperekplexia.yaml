- name: HPX4
  display_name: Hyperekplexia 4 (ATAD1)
  subtype_term:
    preferred_term: hyperekplexia 4
    term:
      id: MONDO:0044330
      label: hyperekplexia 4
  genes:
  - preferred_term: ATAD1
    term:
      id: hgnc:25903
      label: ATAD1
  description: >-
    Biallelic ATAD1 variants cause a congenital syndrome of limb stiffness,
    absent spontaneous movement and hypoventilation that OMIM and MONDO number
    as hyperekplexia 4. Its molecular lesion is not glycinergic: ATAD1 encodes
    Thorase, an AAA+ ATPase that disassembles GRIP1-GluA2 complexes and so
    controls internalisation of excitatory AMPA receptors. The clinical
    delineation study that assembled all eight reported patients concludes that
    the entity is a distinct congenital encephalopathy rather than a form of
    hyperekplexia, so the subtype is carried here under the ontology's numbering
    with that divergence recorded rather than asserted as settled.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:33134516
    reference_title: Congenital immobility and stiffness related to biallelic ATAD1 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients 1 and 2 had a similar distinctive phenotype comprising congenital stiffness of limbs, absent spontaneous movements, weak sucking, and hypoventilation."
    explanation: >-
      Supports biallelic ATAD1 variants as the cause of this congenital
      stiffness syndrome, and describes the phenotype recorded in this row.
  - reference: PMID:33134516
    reference_title: Congenital immobility and stiffness related to biallelic ATAD1 variants.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of the phenotypes of these 2 patients and of the 6 previous cases showed that biallelic ATAD1 mutations are responsible for a unique congenital encephalopathy likely comprising absent BEAR, different from hyperekplexia and other conditions with neonatal hypertonia."
    explanation: >-
      Refutes the placement of this entity under hereditary hyperekplexia. The
      authors reviewed all eight reported patients and concluded the disorder is
      distinct from hyperekplexia, against the OMIM and MONDO numbering this row
      follows.
  - reference: PMID:29390050
    reference_title: A homozygous ATAD1 mutation impairs postsynaptic AMPA receptor trafficking and causes a lethal encephalopathy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Postsynaptically, Thorase controls the internalization of excitatory, glutamatergic AMPA receptors by disassembling complexes between the AMPA receptor-binding protein, GRIP1, and the AMPA receptor subunit GluA2."
    explanation: >-
      States the molecular role of the ATAD1 product, which is at the excitatory
      synapse rather than the glycinergic one, and so is why this subtype is
      wired to its own pathophysiology node.

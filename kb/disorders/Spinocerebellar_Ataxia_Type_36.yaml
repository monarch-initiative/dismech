imaging_findings:
- name: Cerebellar vermis atrophy
  modality: MRI
  description: >-
    Atrophy of the superior cerebellar vermis is the earliest structural
    abnormality, appearing early in the ataxic stage; MRI is normal in
    asymptomatic and preataxic carriers and there is no significant cerebellar
    atrophy before age 50.
  imaging_finding_term:
    preferred_term: Cerebellar vermis atrophy
    term:
      id: HP:0006855
      label: Cerebellar vermis atrophy
  evidence:
  - reference: PMID:27862279
    reference_title: "PET and MRI detection of early and progressive neurodegeneration in spinocerebellar ataxia type 36."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI was normal in asymptomatic and preataxic individuals and showed superior cerebellar vermis atrophy early in the ataxic stage, diffuse cerebellar atrophy some years into the disease course, and a pattern of olivopontocerebellar atrophy in the oldest patients."
    explanation: >-
      Volumetric MRI study establishing vermian atrophy as the earliest
      structural change.
  - reference: PMID:27862279
    reference_title: "PET and MRI detection of early and progressive neurodegeneration in spinocerebellar ataxia type 36."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

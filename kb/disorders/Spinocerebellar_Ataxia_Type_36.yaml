    evidence_source: OTHER
    snippet: "These findings were not able to support the haploinsufficiency hypothesis."
    explanation: >-
      The reason this node carries HYPOTHETICAL confidence and no causal edge:
      the dosage branch was tested in patient cells and not supported.

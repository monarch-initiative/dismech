name: Spinocerebellar Ataxia Type 36
creation_date: "2026-09-02T13:15:15Z"
description: >-
  Spinocerebellar ataxia type 36 (SCA36, nicknamed "Asidan") is a late-adult-onset,
  slowly progressive autosomal dominant cerebellar ataxia caused by expansion of a
  GGCCTG hexanucleotide repeat in the first intron of NOP56. It is distinguished
  from most other dominant ataxias by progressive motor neuron involvement —
  tongue fasciculation and atrophy, limb and truncal fasciculation, and
  hyperreflexia — and by frequent sensorineural hearing loss, so that it is
  often described as standing at the crossroads of spinocerebellar ataxia and
  motor neuron disease. Founder haplotypes cluster the disorder in western Japan
  (the Asida river area of the Chugoku region) and in Galicia, Spain (Costa da
  Morte), with further founder clusters in Han Chinese pedigrees; a British
  series has since shown it also occurs where hearing loss and tongue
  fasciculation are largely absent. NOP56 expression is not appreciably reduced
  in patient cells, so the disorder is attributed to RNA gain of function: the
  expanded repeat is retained in intron 1, forms nuclear GGCCUG RNA foci that
  bind the splicing factor SRSF2, and is translated into dipeptide repeat
  proteins by canonical AUG-mediated and repeat-associated non-AUG translation.
  Downregulation of the adjacent miRNA MIR1292 is reproducible across cohorts
  but its causal contribution is unresolved.
category: Mendelian

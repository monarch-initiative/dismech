histopathology:
- name: Purkinje cell loss with lower motor neuron loss
  description: >-
    Autopsy shows marked cerebellar Purkinje cell degeneration together with
    loss of lower motor neurons, the two-compartment pathology that defines
    SCA36.
  evidence:
  - reference: PMID:22744658
    reference_title: "Clinical features of SCA36: a novel spinocerebellar ataxia with motor neuron involvement (Asidan)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The neuropathologic study revealed significant cerebellar Purkinje cell degeneration with obvious loss of lower motor neurons."
    explanation: >-
      Primary neuropathological description of the combined lesion.
- name: Ubiquitin- and p62-positive cytoplasmic inclusions in the inferior olivary nucleus
  description: >-
    The first SCA36 autopsy demonstrated ubiquitin- and p62-positive cytoplasmic
    inclusions in the inferior olivary nucleus, alongside repeat RNA foci in
    neuronal nuclei at several levels of the neuraxis.
  evidence:
  - reference: PMID:24985895
    reference_title: "Characteristic RNA foci of the abnormal hexanucleotide GGCCUG repeat expansion in spinocerebellar ataxia type 36 (Asidan)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ubiquitin- and p62-positive inclusions in the cytoplasm of the inferior olivary nucleus of the Asidan patient"
    explanation: >-
      Reports the inclusion type and anatomical location recorded here.
- name: Absence of NOP56, TDP-43 and ataxin-2 inclusions
  description: >-
    NOP56 immunostaining is nuclear and normal in distribution, and no
    cytoplasmic or intranuclear inclusions of NOP56, TDP-43 or ataxin-2 are
    seen. The absence of TDP-43 pathology is a key contrast with C9orf72
    disease, which is driven by a structurally similar hexanucleotide repeat.
  evidence:
  - reference: PMID:22744658
    reference_title: "Clinical features of SCA36: a novel spinocerebellar ataxia with motor neuron involvement (Asidan)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cytoplasmic or intranuclear inclusion staining of NOP56, TDP-43, and ataxin-2 was not observed in the remaining neurons."
    explanation: >-
      Direct negative finding on protein inclusion pathology in SCA36 neurons.
  - reference: PMID:32375063
    reference_title: "Chimeric Peptide Species Contribute to Divergent Dipeptide Repeat Pathology in c9ALS/FTD and SCA36."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, in SCA36 patient tissue, poly(GP) exists as a soluble species, and no TDP-43 pathology is present."
    explanation: >-
      Independent confirmation that TDP-43 pathology is absent, in the
      comparison with C9orf72 disease this finding is usually framed against.
genetic:
- name: NOP56
  gene_term:
    preferred_term: NOP56
    term:
      id: hgnc:15911
      label: NOP56
  association: GGCCTG hexanucleotide repeat expansion in intron 1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Positive
  notes: >-
    NOP56 encodes a core scaffold protein of the box C/D small nucleolar
    ribonucleoprotein complex, which directs 2'-O-methylation of ribosomal RNA.
    The pathogenic allele is a heterozygous GGCCTG expansion in intron 1.
    Neither NOP56 mRNA nor NOP56 protein levels were appreciably reduced in
    patient lymphoblastoid cells, so haploinsufficiency is not the favored
    mechanism. Repeat length is somatically unstable, which is why Southern
    blotting of an expanded allele gives a smeared rather than a discrete band.
  variants:
  - name: NOP56 intron 1 GGCCTG hexanucleotide repeat expansion
    description: >-
      Non-coding hexanucleotide repeat expansion in intron 1 of NOP56. Normal
      alleles carry 3-14 repeats. Typical pathogenic alleles carry roughly 650
      or more, up to about 2500, but three affected individuals in a multicentre
      cohort carried only 25, 30 and 31 repeats with clinical features
      indistinguishable from carriers of long expansions, so a short expansion
      does not exclude the diagnosis.
    gene:
      preferred_term: NOP56
      term:
        id: hgnc:15911
        label: NOP56
    clinical_significance: PATHOGENIC
    type: hexanucleotide_repeat_expansion
    evidence:
    - reference: PMID:25476002
      reference_title: "Spinocerebellar ataxia type 36 exists in diverse populations and can be caused by a short hexanucleotide GGCCTG repeat expansion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "three affected individuals harboured small hexanucleotide expansions of 25, 30 and 31 hexanucleotide repeat-units, demonstrating that such a small expansion could cause the disease"
      explanation: >-
        Establishes that short expansions are pathogenic, the clinically
        important caveat recorded in this variant description.
    - reference: PMID:37810464
      reference_title: "Repeat expansions in NOP56 are a cause of spinocerebellar ataxia Type 36 in the British population."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The normal alleles contain 3–14 hexanucleotide repeats, while the expanded alleles range from 30 to 2500 repeats (mostly between 650 and 2500 repeats)."
      explanation: >-
        Defines the normal and expanded repeat ranges quoted here.
    - reference: PMID:25101480
      reference_title: "Spinocerebellar Ataxia Type 36 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Affected individuals typically have alleles with 650 or more repeats."
      explanation: >-
        GeneReviews gives the conventional diagnostic threshold for a typical
        expanded allele.
  evidence:
  - reference: PMID:21683323
    reference_title: "Expansion of intronic GGCCTG hexanucleotide repeat in NOP56 causes SCA36, a type of spinocerebellar ataxia accompanied by motor neuron involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we sequenced 33 of these and observed a large expansion of an intronic GGCCTG hexanucleotide repeat in NOP56"
    explanation: >-
      Identifies NOP56 as the SCA36 gene and the expansion as the causal allele.
  - reference: PMID:37810464
    reference_title: "Repeat expansions in NOP56 are a cause of spinocerebellar ataxia Type 36 in the British population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NOP56 encodes a ubiquitously expressed core scaffolding protein that stabilizes the box C/D small nucleolar ribonuclear protein complex."
    explanation: >-
      Supports the gene-function statement in the notes for this block.
  - reference: PMID:35309140
    reference_title: "Spinocerebellar Ataxia 36: From Mutations Toward Therapies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These findings were not able to support the haploinsufficiency hypothesis."
    explanation: >-
      Supports the note that loss of NOP56 dosage is not the favored mechanism.
      Evidence source is OTHER because this is a narrative review.
  - reference: PMID:27123487
    reference_title: "Spinocerebellar ataxia type 36 in the Han Chinese."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 3 pedigrees share a common haplotype spanning 5.3 kb flanking the NOP56 repeat expansions, suggesting a founder effect of spinocerebellar ataxia type 36 (SCA36) in the Han Chinese."
    explanation: >-
      Documents a third founder haplotype, independent of the Galician and
      Japanese ones, supporting recurrent founder effects at this locus.
diagnosis:
- name: Repeat-primed PCR for the NOP56 GGCCTG expansion
  description: >-
    Molecular confirmation rests on detecting the expansion, since the clinical
    picture overlaps other late-onset dominant ataxias. Repeat-primed PCR gives
    the characteristic sawtooth trace; Southern blotting sizes the expansion,
    though somatic instability produces a smeared band. Repeat expansions can
    also be called from whole-genome sequencing with dedicated bioinformatic
    tools, which is how the British cohort was identified.
  evidence:
  - reference: PMID:25101480
    reference_title: "Spinocerebellar Ataxia Type 36 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Confirmation of the diagnosis relies on detection of an abnormal hexanucleotide GGCCTG repeat expansion in NOP56."
    explanation: >-
      GeneReviews states that molecular detection of the expansion is the
      diagnostic standard.
  - reference: PMID:28918022
    reference_title: "Antisense Oligonucleotides Reduce RNA Foci in Spinocerebellar Ataxia 36 Patient iPSCs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A typical saw-tooth pattern by repeat expansion is observed in SCA36 patient iPSCs, but not in healthy control iPSCs."
    explanation: >-
      Illustrates the repeat-primed PCR sawtooth signature described here.
  - reference: PMID:37810464
    reference_title: "Repeat expansions in NOP56 are a cause of spinocerebellar ataxia Type 36 in the British population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Leveraging novel bioinformatic tools to detect repeat expansions from whole-genome sequencing, we analyse the NOP56 repeat in 1257 British patients with hereditary ataxia and in 7506 unrelated controls."
    explanation: >-
      Supports the whole-genome-sequencing route to diagnosis added in this
      description.
  - reference: PMID:35245110
    reference_title: "Comprehensive genetic diagnosis of tandem repeat expansion disorders with programmable targeted nanopore sequencing."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We describe the use of programmable targeted long-read sequencing with Oxford Nanopore's ReadUntil function for parallel genotyping of all known neuropathogenic STRs in a single assay."
    explanation: >-
      Supports the long-read route as a single-assay alternative to
      locus-specific repeat-primed PCR. Evidence source is OTHER because the
      paper reports assay development and validation rather than a clinical,
      animal, cell or computational study of the disease.
differential_diagnoses:
- name: Amyotrophic lateral sclerosis
  description: >-
    The tongue and limb fasciculation, atrophy and hyperreflexia of SCA36 raise
    motor neuron disease, but SCA36 lacks the widespread muscle involvement and
    rapid course of classical ALS, motor neuron involvement is largely confined
    to lower motor neurons of the caudal brainstem, and TDP-43 pathology is
    absent. Screening ALS cohorts for the NOP56 expansion has been negative.
  evidence:
  - reference: PMID:22492559
    reference_title: "'Costa da Morte' ataxia is spinocerebellar ataxia 36: clinical and genetic characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were signs of denervation in the tongue, as well as mild pyramidal signs, but otherwise no signs of classical amyotrophic lateral sclerosis."
    explanation: >-
      Explicitly separates the SCA36 motor phenotype from classical ALS.
  - reference: PMID:27123487
    reference_title: "Spinocerebellar ataxia type 36 in the Han Chinese."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NOP56 repeat expansion was not detected in controls or patients with sporadic ataxic syndromes or ALS."
    explanation: >-
      Supports the statement that ALS cohort screening has been negative.
- name: Other late-onset autosomal dominant spinocerebellar ataxias
  description: >-
    SCA36 presents as a slowly progressive late-onset cerebellar syndrome
    indistinguishable at first from other dominant SCAs; sensorineural hearing
    loss and tongue fasciculation are the discriminating clinical clues, and
    audiometry separates SCA36 from other degenerative ataxias statistically.
    Neither clue is required, so the diagnosis should still be considered in
    late-onset slowly progressive ataxia without them.
  evidence:
  - reference: PMID:23140984
    reference_title: "Acoustic impairment is a distinguishable clinical feature of Asidan/SCA36."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PTA was significantly decreased in Asidan/SCA36 in comparison to normal control and other ataxic groups, but not significant within other ataxic groups and normal control."
    explanation: >-
      Provides the quantitative basis for using hearing as a discriminator
      against other degenerative ataxias.
  - reference: PMID:37810464
    reference_title: "Repeat expansions in NOP56 are a cause of spinocerebellar ataxia Type 36 in the British population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "spinocerebellar ataxia 36 can be suspected in patients with a late-onset, slowly progressive ataxia, even without the findings of hearing loss and tongue fasciculation"
    explanation: >-
      Supports the caveat that the two discriminating clues are not required for
      the diagnosis.
animal_models:
- name: AAV-delivered (TG3C2)62 repeat-expressing mouse
  species: Mouse
  genotype: >-
    Wild-type C57BL/6 mice given intracerebroventricular AAV9-NOP56-(TG3C2)62 at
    postnatal day 0; AAV9-NOP56-(TG3C2)6 as the control construct
  background: C57BL/6
  category: Somatic brain transgenesis
  description: >-
    The only in vivo demonstration that the SCA36 repeat itself is sufficient to
    kill Purkinje cells. Expressing a 62-unit TG3C2 repeat throughout the mouse
    CNS reproduces the SCA36 pattern of selective vulnerability — Purkinje cell
    loss and locomotor impairment — while the near-identical C9orf72 G4C2 repeat
    in the same paradigm instead produces cortical loss and pTDP-43 pathology.
    The contrast is the point: the two repeats differ by one nucleotide, so the
    divergence localizes the pathomechanism to the repeat sequence rather than
    to its host gene.
  genes:
  - preferred_term: NOP56
    term:
      id: hgnc:15911
      label: NOP56
  publication: PMID:32375043
  modeled_mechanisms:
  - target: Purkinje Cell Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Repeat-expressing mice lose cerebellar Purkinje cells and show the
      dendritic and locomotor consequences of that loss, matching the central
      effector node of this entry.
    limitations: >-
      The construct carries 62 repeats against the 650-2500 of a typical patient
      allele, and is delivered from an AAV vector rather than expressed from the
      endogenous NOP56 locus, so dosage and regulation both differ from the human
      disease. The study assessed cerebellar and cortical outcomes and does not
      address the lower motor neuron involvement or the sensorineural hearing
      loss that distinguish SCA36 clinically, so it models the cerebellar arm of
      the disease only.
    readouts:
    - name: Cerebellar Purkinje cell number
      target: Purkinje Cell Degeneration
      direction: DECREASED
      interpretation: >-
        Direct cell-count correlate of the degeneration node in this model.
      evidence:
      - reference: PMID:32375043
        reference_title: "Hexanucleotide Repeat Expansions in c9FTD/ALS and SCA36 Confer Selective Patterns of Neurodegeneration In Vivo."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we found that (TG3C2)62 mice show a dramatic loss of cerebellar Purkinje cells"
        explanation: >-
          Reports the directional measurement this readout records.
    - name: Purkinje dendritic arborization and molecular layer width
      target: Purkinje Cell Degeneration
      direction: DECREASED
      interpretation: >-
        Structural correlate showing the loss is not only of cell bodies but of
        the dendritic network they support.
      evidence:
      - reference: PMID:32375043
        reference_title: "Hexanucleotide Repeat Expansions in c9FTD/ALS and SCA36 Confer Selective Patterns of Neurodegeneration In Vivo."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We used the Purkinje cell marker calbindin to look at the dendritic arborization of these neurons and observed not only a reduction in the number of cell bodies, but also a narrowing of the molecular cell layer in the cerebellum of (TG3C2)62 mice"
        explanation: >-
          Reports both measurements this readout records.
    - name: Rotating rod and hanging wire performance
      target: Purkinje Cell Degeneration
      direction: DECREASED
      interpretation: >-
        Functional correlate of the cerebellar lesion, the model's analogue of
        the ataxia that Purkinje loss produces in patients.
      evidence:
      - reference: PMID:32375043
        reference_title: "Hexanucleotide Repeat Expansions in c9FTD/ALS and SCA36 Confer Selective Patterns of Neurodegeneration In Vivo."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "(TG3C2)62 mice showed a pronounced locomotor defect compared with controls, as evidenced by impaired performance in the rotating rod test"
        explanation: >-
          Reports the behavioural measurement this readout records.
    evidence:
    - reference: PMID:32375043
      reference_title: "Hexanucleotide Repeat Expansions in c9FTD/ALS and SCA36 Confer Selective Patterns of Neurodegeneration In Vivo."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Instead, these mice show a robust loss of cerebellar Purkinje cells, as well as pronounced locomotor defects, phenotypes highly reminiscent of SCA36."
      explanation: >-
        The authors' own statement that the model reproduces the SCA36 pattern,
        which is what makes it informative for this node.
  - target: Dipeptide Repeat Protein Production from the Expanded Repeat
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mouse reproduces the specific DPR biology curated at this node,
      including the feature that distinguishes SCA36 from C9orf72 disease:
      poly(GP) is produced but stays soluble rather than forming inclusions.
    limitations: >-
      Poly(PR), detected in human SCA36 granule cells, was not robustly
      reproduced in this model, so the antisense RAN-translation arm of the node
      is not covered by it.
    readouts:
    - name: Diffuse poly(GP) immunoreactivity in Purkinje cells
      target: Dipeptide Repeat Protein Production from the Expanded Repeat
      direction: INCREASED
      interpretation: >-
        Confirms DPR production in vivo and, by its diffuse distribution,
        reproduces the solubility that separates SCA36 from C9orf72 disease.
      evidence:
      - reference: PMID:32375043
        reference_title: "Hexanucleotide Repeat Expansions in c9FTD/ALS and SCA36 Confer Selective Patterns of Neurodegeneration In Vivo."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Although we detected poly(GP) in our SCA36 mice, intriguingly it does not form inclusions and instead remains diffuse."
        explanation: >-
          Reports both the presence and the solubility this readout records.
    evidence:
    - reference: PMID:32375043
      reference_title: "Hexanucleotide Repeat Expansions in c9FTD/ALS and SCA36 Confer Selective Patterns of Neurodegeneration In Vivo."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, because the RNA foci and RAN translation we observe in the cerebellum of our mice are in the Purkinje cells, we suspect that this degeneration is at least in part cell autonomous."
      explanation: >-
        Places RAN translation in the same cells that degenerate, which is what
        makes the model informative for the DPR node.
  notes: >-
    The model is also an informative negative for the C9orf72 comparison this
    entry draws in histopathology: no pTDP-43 inclusions and no persistent stress
    granules were seen at 3-4, 6 or 12 months, matching the absence of TDP-43
    pathology in SCA36 patient tissue.
- name: nop56 loss-of-function zebrafish
  species: Zebrafish
  genotype: nop56sa12582 homozygous loss-of-function
  category: Germline null
  description: >-
    A complete loss-of-function model of the SCA36 host gene, made to ask what
    losing NOP56 actually does — the question the haploinsufficiency hypothesis
    turns on, and one no repeat-expansion model can answer. The answer is that it
    is not SCA36: homozygous nulls fail to form a cerebellum at all and die
    before 7 days post-fertilization.
  genes:
  - preferred_term: NOP56
    term:
      id: hgnc:15911
      label: NOP56
  publication: PMID:36009362
  modeled_mechanisms:
  - target: Purkinje Cell Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Complete loss of nop56 does not reproduce the adult-onset, selective
      Purkinje degeneration of SCA36. It produces an embryonic-lethal failure of
      cerebellar development instead — the cerebellum is absent rather than
      degenerating — which is the structural argument against dosage loss being
      the SCA36 mechanism.
    limitations: >-
      The comparison is not like-for-like in three ways at once: a homozygous
      germline null against a heterozygous repeat expansion, zebrafish against
      human, and embryonic development against adult maintenance. The model
      therefore bounds what NOP56 loss can look like; it does not by itself prove
      that dosage plays no part in SCA36, and the patient-cell expression data
      remain the direct evidence for that.
    readouts:
    - name: Cerebellar structure at larval stage
      target: Purkinje Cell Degeneration
      direction: ABOLISHED
      interpretation: >-
        The cerebellum never forms, so there is no Purkinje population to
        degenerate — a developmental failure, not the degenerative phenotype
        this node describes.
      evidence:
      - reference: PMID:36009362
        reference_title: "A nop56 Zebrafish Loss-of-Function Model Exhibits a Severe Neurodegenerative Phenotype."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We observed a severe neurodegenerative phenotype in nop56 mutants, characterized mainly by absence of cerebellum, reduced numbers of spinal cord neurons, high levels of apoptosis in the central nervous system (CNS) and impaired movement, resulting in death before 7 days post-fertilization."
        explanation: >-
          Reports the absent cerebellum and the embryonic lethality that make
          this a failure to recapitulate rather than a partial match.
    evidence:
    - reference: PMID:36009362
      reference_title: "A nop56 Zebrafish Loss-of-Function Model Exhibits a Severe Neurodegenerative Phenotype."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Although vertebrate animal models were created for the intronic expansion, none was studied for the loss of function of NOP56."
      explanation: >-
        States why this model exists and what it is testing. The phenotype it
        reports is incompatible with the late-onset selective degeneration of
        SCA36, so it argues against dosage loss as that disease's mechanism.
  - target: Impaired NOP56 Box C/D snoRNP Function
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      The model is the direct experimental perturbation of the hypothetical
      dosage branch: it removes nop56 function outright and measures what
      follows, including expression of box C/D complex genes.
    readouts:
    - name: Expression of box C/D complex and CNS development genes
      target: Impaired NOP56 Box C/D snoRNP Function
      direction: DECREASED
      interpretation: >-
        Confirms that losing nop56 does disrupt the box C/D programme, which is
        what the dosage hypothesis predicts — while the organism-level phenotype
        shows that disruption does not produce SCA36.
      evidence:
      - reference: PMID:36009362
        reference_title: "A nop56 Zebrafish Loss-of-Function Model Exhibits a Severe Neurodegenerative Phenotype."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Gene expression of genes related to C/D box complex, balance and CNS development was impaired in nop56 mutants."
        explanation: >-
          Reports the expression measurement this readout records.
    evidence:
    - reference: PMID:36009362

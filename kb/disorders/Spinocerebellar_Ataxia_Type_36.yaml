inheritance:
- name: Autosomal dominant inheritance
  description: >-
    SCA36 segregates as an autosomal dominant trait in multiplex Japanese,
    Galician, Han Chinese and British kindreds carrying founder-associated
    GGCCTG expansions. GeneReviews describes penetrance as complete but
    age dependent, consistent with a mean onset in the fifth decade. Repeat
    size was observed to grow on paternal and to contract on maternal
    transmission in the Galician kindreds, though a general parent-of-origin
    rule has not been established across cohorts.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: COMPLETE
  parent_of_origin_effect: >-
    Repeat size increased on paternal transmission and contracted on maternal
    transmission in the Galician kindreds; not established as a general rule.
  evidence:
  - reference: PMID:21683323
    reference_title: "Expansion of intronic GGCCTG hexanucleotide repeat in NOP56 causes SCA36, a type of spinocerebellar ataxia accompanied by motor neuron involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The expansion showed complete segregation with the SCA phenotype in family studies"
    explanation: >-
      Complete segregation of the expansion with disease in the original
      families supports a dominant, fully penetrant gene-disease relationship.
  - reference: PMID:25101480
    reference_title: "Spinocerebellar Ataxia Type 36 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Penetrance is complete, although age-dependent."
    explanation: >-
      GeneReviews states the penetrance value recorded in this block.
  - reference: PMID:22492559
    reference_title: "'Costa da Morte' ataxia is spinocerebellar ataxia 36: clinical and genetic characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further expansion of repeat size was frequent, especially upon paternal transmission, while instances of allele contraction were observed in maternal transmissions."
    explanation: >-
      Documents the parent-of-origin effect on repeat size recorded here, in
      the single cohort where it was observed.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    No population-based prevalence estimate exists. The multicentre survey that
    screened 676 unrelated SCA index cases across France, Germany and Japan
    describes the disorder as rare with a worldwide distribution.
  evidence:
  - reference: PMID:25476002
    reference_title: "Spinocerebellar ataxia type 36 exists in diverse populations and can be caused by a short hexanucleotide GGCCTG repeat expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SCA36 is rare with a worldwide distribution."
    explanation: >-
      Direct statement of the coarse rarity band from the largest multicentre
      screen.
- population: Galician ataxia families (Costa da Morte founder region, Spain)
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    A relative frequency among ataxia families, not a population rate: 10 of 160
    Galician spinocerebellar ataxia families carried the expansion, making SCA36
    the most frequent dominant SCA in that region. The founder mutation there is
    estimated to be roughly 1275 years old.
  evidence:
  - reference: PMID:22492559
    reference_title: "'Costa da Morte' ataxia is spinocerebellar ataxia 36: clinical and genetic characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Out of 160 Galician families with spinocerebellar ataxia, 10 (6.3%) were found to have spinocerebellar ataxia 36"
    explanation: >-
      Quantifies the Galician founder cluster as a fraction of screened ataxia
      families.
- population: Japanese ataxia cohort
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    A relative frequency among ataxia patients, not a population rate: nine of
    251 molecularly undiagnosed Japanese SCA patients carried the expansion, all
    on a shared founder haplotype.
  evidence:
  - reference: PMID:21683323
    reference_title: "Expansion of intronic GGCCTG hexanucleotide repeat in NOP56 causes SCA36, a type of spinocerebellar ataxia accompanied by motor neuron involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total, nine unrelated cases were found in 251 cohort SCA patients (3.6%). A founder haplotype was confirmed in these cases."
    explanation: >-
      Quantifies the Japanese founder cluster within the screened SCA cohort.
- population: Han Chinese ataxia pedigrees (Taiwan)
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    A relative frequency among ataxia pedigrees, not a population rate: three of
    512 SCA pedigrees, sharing a 5.3 kb founder haplotype. The expansion was
    absent from controls and from sporadic ataxia and ALS patients in the same
    study.
  evidence:
  - reference: PMID:27123487
    reference_title: "Spinocerebellar ataxia type 36 in the Han Chinese."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SCA36 is an uncommon subtype, which accounted for 0.6% (3/512) of SCA cases in the Han Chinese population."
    explanation: >-
      Quantifies the Han Chinese cluster as a fraction of screened SCA
      pedigrees.
- population: British hereditary ataxia patients
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    A relative frequency among ataxia patients, not a population rate: five
    families (seven patients) among 1,257 British patients with hereditary
    ataxia, the first White British cohort reported. SCA36 had previously been
    thought absent from the British population. The 87 kb block shared by these
    families was also found in several controls, so it reads as a permissive
    haplotype rather than a founder chromosome, unlike the Galician, Japanese
    and Han Chinese clusters.
  evidence:
  - reference: PMID:37810464
    reference_title: "Repeat expansions in NOP56 are a cause of spinocerebellar ataxia Type 36 in the British population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identify pathogenic repeat expansions in five families (seven patients), representing the first cohort of White British descent patients with spinocerebellar ataxia 36."
    explanation: >-
      Quantifies the British cluster within the screened hereditary-ataxia
      cohort.
  - reference: PMID:37810464
    reference_title: "Repeat expansions in NOP56 are a cause of spinocerebellar ataxia Type 36 in the British population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found an 87 kb shared haplotype in among the affected individuals from five families around the NOP56 repeat region, although this block was also shared between several controls, suggesting that the repeat arises on a permissive haplotype"
    explanation: >-
      Supports the permissive-haplotype reading recorded in the notes, which is
      what distinguishes this cluster from the founder populations.
progression:
- phase: Presymptomatic expansion carrier
  age_range: under 50 years
  evidence:
  - reference: PMID:27862279
    reference_title: "PET and MRI detection of early and progressive neurodegeneration in spinocerebellar ataxia type 36."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results revealed neuronal dysfunctions in the vermis and right cerebellar hemisphere as soon as a decade before the onset of motor symptoms."
    explanation: >-
      Establishes a measurable presymptomatic phase, detectable by FDG-PET
      about a decade before motor onset.
  notes: >-
    MRI is normal at this stage; only cerebellar glucose hypometabolism is
    detectable.
- phase: Ataxic onset
  age_range: fourth to seventh decade, mean onset around 53 years
  evidence:
  - reference: PMID:22744658
    reference_title: "Clinical features of SCA36: a novel spinocerebellar ataxia with motor neuron involvement (Asidan)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The age at onset of ataxia was 53.1 ± 3.4 years, with the most frequent symptoms being truncal ataxia (100% of patients), ataxic dysarthria (100%), limb ataxia (93%), and hyperreflexia (79%)."
    explanation: >-
      Gives the mean age at onset and the presenting cerebellar syndrome for
      this phase.
  - reference: PMID:25476002
    reference_title: "Spinocerebellar ataxia type 36 exists in diverse populations and can be caused by a short hexanucleotide GGCCTG repeat expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with the age at onset ranging between 39 and 65 years"
    explanation: >-
      Gives the observed onset range across the multicentre cohort.
- phase: Established disease with motor neuron involvement
  age_range: typically more than a decade after onset
  evidence:
  - reference: PMID:22744658
    reference_title: "Clinical features of SCA36: a novel spinocerebellar ataxia with motor neuron involvement (Asidan)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tongue fasciculation and subsequent atrophy were found in 71% of cases, particularly in those of long duration."
    explanation: >-
      Ties the bulbar motor neuron features to longer disease duration, which is
      what defines this later phase.
  - reference: PMID:27123487
    reference_title: "Spinocerebellar ataxia type 36 in the Han Chinese."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evidence of lower motor neuron involvement, including atrophy and fasciculation in the limb muscles and tongue, was mostly found in patients with prolonged disease duration."
    explanation: >-
      Independent replication in a second population that motor neuron signs are
      a late-phase feature.
  notes: >-
    Cerebellar atrophy becomes diffuse and eventually shows an
    olivopontocerebellar pattern; frontal-executive and affective changes
    accumulate.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    SCA36 is a progressive, incurable neurodegenerative disorder. Gait and
    speech deteriorate over more than a decade, hearing loss compounds
    communication difficulty, and bulbar motor neuron involvement adds
    dysphagia and aspiration risk. Management is entirely supportive.
  evidence:
  - reference: PMID:25101480
    reference_title: "Spinocerebellar Ataxia Type 36 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dietary assessment and feeding therapy programs can improve dysphagia and reduce the risk of aspiration."
    explanation: >-
      GeneReviews identifies dysphagia and aspiration as complications requiring
      active prevention, which is part of the burden recorded here.
pathophysiology:
- name: Intronic GGCCTG Repeat Expansion in NOP56
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cerebellar_purkinje_degeneration#Cerebellar Neuron Insult"
  description: >-
    The initiating lesion is a heterozygous expansion of a GGCCTG hexanucleotide
    repeat in intron 1 of NOP56, which encodes a core scaffold protein of the
    box C/D small nucleolar ribonucleoprotein complex. Normal alleles carry
    3-14 repeats; typical pathogenic alleles carry roughly 650-2500, although
    expansions as short as 25-31 repeats have been shown to cause the disease.
    This is the disorder-specific molecular insult substituted for the generic
    trigger node of the Purkinje degeneration module.
  genes:
  - preferred_term: NOP56
    term:
      id: hgnc:15911
      label: NOP56
  evidence:
  - reference: PMID:21683323
    reference_title: "Expansion of intronic GGCCTG hexanucleotide repeat in NOP56 causes SCA36, a type of spinocerebellar ataxia accompanied by motor neuron involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we sequenced 33 of these and observed a large expansion of an intronic GGCCTG hexanucleotide repeat in NOP56"
    explanation: >-
      Identifies the causal repeat expansion as the initiating molecular lesion
      of SCA36.
  - reference: PMID:37810464
    reference_title: "Repeat expansions in NOP56 are a cause of spinocerebellar ataxia Type 36 in the British population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The normal alleles contain 3–14 hexanucleotide repeats, while the expanded alleles range from 30 to 2500 repeats (mostly between 650 and 2500 repeats)."
    explanation: >-
      Establishes the normal and pathogenic repeat ranges quoted in this node.
  downstream:
  - target: NOP56 Intron 1 Retention and Nuclear GGCCUG RNA Foci
    causal_link_type: DIRECT
    description: >-
      The expanded repeat is transcribed and retained rather than efficiently
      spliced out, so repeat RNA accumulates in the nucleus.
    evidence:
    - reference: PMID:32375063
      reference_title: "Chimeric Peptide Species Contribute to Divergent Dipeptide Repeat Pathology in c9ALS/FTD and SCA36."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we demonstrate that expanded TG3C2 repeats in SCA36 impair splicing of NOP56 and result in retention of the repeat-containing intron 1"
      explanation: >-
        Directly links the expansion to impaired splicing and intron 1
        retention, which is the step this edge asserts.
  - target: MIR1292 Downregulation
    causal_link_type: UNKNOWN
    description: >-
      Transcription of MIR1292, whose gene lies 19 bp downstream of the repeat,
      is reduced in cells from expansion carriers. Whether this is a cis
      consequence of the expansion and whether it contributes to
      neurodegeneration is unresolved.
    evidence:
    - reference: PMID:21683323
      reference_title: "Expansion of intronic GGCCTG hexanucleotide repeat in NOP56 causes SCA36, a type of spinocerebellar ataxia accompanied by motor neuron involvement."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "transcription of MIR1292, a neighboring miRNA, was significantly decreased in lymphoblastoid cells of SCA patients"
      explanation: >-
        Establishes the association between carrier status and reduced MIR1292
        transcription; the causal direction is left open by the UNKNOWN link
        type on this edge.
  - target: Cochlear and Peripheral Auditory Dysfunction
    causal_link_type: UNKNOWN
    description: >-
      Sensorineural hearing loss is a genotype-associated feature of SCA36, but
      no molecular intermediate between the repeat expansion and auditory
      involvement has been established.
    evidence:
    - reference: PMID:25101480
      reference_title: "Spinocerebellar Ataxia Type 36 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Spinocerebellar ataxia type 36 (SCA36) is characterized by a late-onset, slowly progressive cerebellar syndrome typically associated with sensorineural hearing loss."
      explanation: >-
        Establishes that hearing loss is part of the expansion-defined
        phenotype, which is all this UNKNOWN-mechanism edge claims.
- name: NOP56 Intron 1 Retention and Nuclear GGCCUG RNA Foci
  biological_scale: MOLECULAR
  description: >-
    Retained (GGCCUG)n repeat RNA accumulates as discrete nuclear foci. Foci
    are demonstrable by fluorescence in situ hybridization in patient
    lymphoblastoid cells, patient iPSCs and iPSC-derived neurons, and in
    autopsied brain, where sense but not antisense foci are found. In autopsy
    tissue the foci occur in neuronal nuclei of cerebrum, cerebellum, inferior
    olive, spinal cord and temporal muscle, and include giant foci nearly 10
    micrometres across in Purkinje cells and spinal motor neurons.
  biological_processes:
  - preferred_term: mRNA splicing, via spliceosome
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: ABNORMAL
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  - preferred_term: spinal motor neuron
    term:
      id: CL:0011001
      label: spinal cord motor neuron
  evidence:
  - reference: PMID:21683323
    reference_title: "Expansion of intronic GGCCTG hexanucleotide repeat in NOP56 causes SCA36, a type of spinocerebellar ataxia accompanied by motor neuron involvement."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RNA foci formation was detected in lymphoblastoid cells from affected subjects by fluorescence in situ hybridization."
    explanation: >-
      First demonstration that the expanded repeat forms RNA foci in cells from
      affected individuals.
  - reference: PMID:24985895
    reference_title: "Characteristic RNA foci of the abnormal hexanucleotide GGCCUG repeat expansion in spinocerebellar ataxia type 36 (Asidan)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of interest is that the giant RNA foci, nearly 10 μm in diameter, that were detected in Purkinje cells, spinal motor neurons and most frequently in the inferior olivary nucleus, may be responsible for pivotal clinical symptoms of Asidan."
    explanation: >-
      Establishes the presence and cellular distribution of repeat RNA foci in
      human SCA36 autopsy tissue, including the two cell populations this node
      lists.
  - reference: PMID:30610877
    reference_title: "Suppression of the yeast elongation factor Spt4 ortholog reduces expanded SCA36 GGCCUG repeat aggregation and cytotoxicity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Sense (GGCCUG)exp but not antisense (CAGGCC)exp RNA foci were detected in the cells, consistent with observations in autopsied brains of patients with SCA36."
    explanation: >-
      Supports the sense-strand specificity of foci formation recorded in this
      node.
  downstream:
  - target: SRSF2 Sequestration by GGCCUG Repeat RNA
    causal_link_type: DIRECT
    description: >-
      The repeat RNA binds the SR-family splicing factor SRSF2, the proposed
      route by which foci become toxic.
    evidence:
    - reference: PMID:21683323
      reference_title: "Expansion of intronic GGCCTG hexanucleotide repeat in NOP56 causes SCA36, a type of spinocerebellar ataxia accompanied by motor neuron involvement."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Double staining and gel-shift assay showed that (GGCCUG)n binds the RNA-binding protein SRSF2 but that (CUG)(6) does not."
      explanation: >-
        Binding assays establish the specific repeat-protein interaction this
        edge asserts.
  - target: Dipeptide Repeat Protein Production from the Expanded Repeat
    causal_link_type: DIRECT
    description: >-
      Intron-retained repeat transcripts are translated, producing dipeptide
      repeat proteins.
    evidence:
    - reference: PMID:32375063
      reference_title: "Chimeric Peptide Species Contribute to Divergent Dipeptide Repeat Pathology in c9ALS/FTD and SCA36."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We demonstrate that poly(GP) is more abundant in SCA36 compared to c9ALS/FTD patient tissue due to canonical AUG-mediated translation from intron-retained GGCCTG repeat RNAs."
      explanation: >-
        Attributes DPR production specifically to the intron-retained transcript
        described by the upstream node.
- name: SRSF2 Sequestration by GGCCUG Repeat RNA
  biological_scale: MOLECULAR
  description: >-
    Expanded (GGCCUG)n RNA binds SRSF2 specifically, and the resulting
    sequestration of an essential splicing factor into nuclear foci is the
    canonical RNA gain-of-function model for SCA36, by analogy with the
    MBNL-sequestration mechanism of myotonic dystrophy. NOP56 mRNA and protein
    levels and Cajal body number are not appreciably reduced in patient
    lymphoblastoid cells, which is why haploinsufficiency of NOP56 itself is not
    the favored explanation.
  molecular_functions:
  - preferred_term: mRNA binding
    term:
      id: GO:0003729
      label: mRNA binding
    modifier: ABNORMAL
  evidence:
  - reference: PMID:35309140
    reference_title: "Spinocerebellar Ataxia 36: From Mutations Toward Therapies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It seemed to be clear that these expanded repeat-containing RNAs did form such foci and could sequester RNA-binding proteins like SRSF2 and other proteins"
    explanation: >-
      Review synthesis of the sequestration model; evidence source is OTHER
      because this is a narrative minireview rather than primary data.
  - reference: PMID:35309140
    reference_title: "Spinocerebellar Ataxia 36: From Mutations Toward Therapies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These findings were not able to support the haploinsufficiency hypothesis."
    explanation: >-
      Supports the statement that NOP56 haploinsufficiency is not the favored
      mechanism, which is why this node is framed as RNA gain of function.
  downstream:
  - target: Purkinje Cell Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The steps between splicing-factor sequestration and neuronal death have
      not been resolved; the original report frames the disorder overall as RNA
      gain of function.
    evidence:
    - reference: PMID:21683323
      reference_title: "Expansion of intronic GGCCTG hexanucleotide repeat in NOP56 causes SCA36, a type of spinocerebellar ataxia accompanied by motor neuron involvement."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our finding suggests that SCA36 is caused by hexanucleotide repeat expansions through RNA gain of function."
      explanation: >-
        Supports RNA gain of function as the route from the expansion to
        neurodegeneration, with intermediates left unspecified as the edge type
        records.
  - target: Lower Motor Neuron Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same RNA gain-of-function mechanism is invoked for the motor neuron
      arm of the disease, and foci are present in spinal motor neurons, but the
      causal relationship between foci and degeneration has not been shown.
    evidence:
    - reference: PMID:24985895
      reference_title: "Characteristic RNA foci of the abnormal hexanucleotide GGCCUG repeat expansion in spinocerebellar ataxia type 36 (Asidan)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The relationships between the giant RNA foci and neurodegeneration have yet to be studied."
      explanation: >-
        Quoted because it states the limitation directly: foci are present in
        the affected motor neurons, but the causal relationship to their
        degeneration is not established, which is why this edge is typed as
        having unknown intermediates.
- name: Dipeptide Repeat Protein Production from the Expanded Repeat
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    The intron-retained GGCCTG repeat transcript is translated into dipeptide
    repeat proteins. In patient tissue poly(GP) is produced abundantly by
    canonical AUG-mediated translation reading through the retained intron,
    while the antisense product poly(PR) indicates that repeat-associated
    non-AUG (RAN) translation also occurs. Unlike in C9orf72 disease, SCA36
    poly(GP) remains soluble and TDP-43 pathology is absent. Whether the DPRs
    are pathogenic in SCA36 or a comparatively inert byproduct is not settled —
    a Neuro2A model found RAN-derived DPR formation from expanded GGCCTG to be
    rare.
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:32375063
    reference_title: "Chimeric Peptide Species Contribute to Divergent Dipeptide Repeat Pathology in c9ALS/FTD and SCA36."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we show the similar intronic GGCCTG HREs that causes spinocerebellar ataxia type 36 (SCA36) is also translated into DPRs, including poly(GP) and poly(PR)."
    explanation: >-
      Establishes that the SCA36 repeat is translated and names the two DPR
      species this node records.
  - reference: PMID:32375063
    reference_title: "Chimeric Peptide Species Contribute to Divergent Dipeptide Repeat Pathology in c9ALS/FTD and SCA36."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, in SCA36 patient tissue, poly(GP) exists as a soluble species, and no TDP-43 pathology is present."
    explanation: >-
      Supports the solubility and absent-TDP-43 statements that distinguish
      SCA36 DPR biology from C9orf72 disease.
  - reference: PMID:30610877
    reference_title: "Suppression of the yeast elongation factor Spt4 ortholog reduces expanded SCA36 GGCCUG repeat aggregation and cytotoxicity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Glycine-proline dipeptide repeat (DPR) formation due to repeat-associated non-ATG translation rarely occurred in cells expressing expanded GGCCTG repeats; in contrast, cells harboring expanded c9orf72 GGGGCC/GGCCCC repeats robustly expressed DPR proteins."
    explanation: >-
      A cell model reporting only rare RAN-derived poly(GP), which is the
      qualification this node makes and why its mechanism confidence is
      PROVISIONAL rather than ESTABLISHED.
  downstream:
  - target: Purkinje Cell Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      DPR toxicity is proposed as a contributor to neurodegeneration in SCA36
      by analogy with C9orf72 disease, but has not been shown to cause Purkinje
      cell loss in SCA36 itself. This edge is deliberately left uncited; see the
      dpr_pathogenicity discussion.
- name: MIR1292 Downregulation
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The MIR1292 gene lies 19 bp downstream of the repeat, and its transcription
    is reduced in lymphoblastoid cells from expansion carriers in two
    independent cohorts. In the Han Chinese cohort, four of seven predicted
    targets were unchanged and three were unmeasurable in lymphoblastoid cells,
    and the authors raised the possibility that reduced MIR1292 is an

discussions:
- discussion_id: mir1292_contribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does reduced MIR1292 transcription contribute to neurodegeneration in
    SCA36, and through which targets?
  attaches_to:
  - pathophysiology#MIR1292 Downregulation
  rationale: >-
    Reduced MIR1292 transcription is reproducible: it was found in the original
    Japanese patients and replicated in Han Chinese patients. But both
    observations are in lymphoblastoid cells, a peripheral cell type that does
    not degenerate, and the one attempt to test predicted targets found four
    unchanged and three unmeasurable in that cell type, prompting the authors to
    raise the possibility of an epiphenomenon. No downstream target has been
    demonstrated in cerebellar or motor neuron tissue, so the node is left with
    no outgoing causal edge rather than being connected on the strength of
    adjacency. Resolving this would require measuring MIR1292 and its candidate
    targets in patient cerebellum or in expansion-carrying neurons.
  evidence:
  - reference: PMID:27123487
    reference_title: "Spinocerebellar ataxia type 36 in the Han Chinese."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Arguably, LCLs may not be an appropriate platform to study SCA36 pathogenesis because such cell lines might not faithfully recapitulate the pathologic phenotypes of Purkinje cells."
    explanation: >-
      States the cell-type limitation that makes this a gap rather than a
      settled negative result.
- discussion_id: dpr_pathogenicity
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Are dipeptide repeat proteins pathogenic in SCA36, or a comparatively inert
    byproduct of repeat translation?
  attaches_to:
  - pathophysiology#Dipeptide Repeat Protein Production from the Expanded Repeat
  rationale: >-
    Human tissue work reports abundant poly(GP), mostly from canonical
    AUG-mediated translation of the intron-retained transcript, plus antisense
    poly(PR) indicating RAN translation. But SCA36 poly(GP) is soluble and there
    is no TDP-43 pathology, unlike C9orf72 disease, and a Neuro2A model found
    RAN-derived DPR formation to be rare. The DPR arm of the mechanism is
    therefore recorded as PROVISIONAL and its edge to Purkinje degeneration is
    left uncited.
  evidence:
  - reference: PMID:32375063
    reference_title: "Chimeric Peptide Species Contribute to Divergent Dipeptide Repeat Pathology in c9ALS/FTD and SCA36."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, in SCA36 patient tissue, poly(GP) exists as a soluble species, and no TDP-43 pathology is present."
    explanation: >-
      The solubility and absent TDP-43 pathology are the reasons the DPR arm
      cannot simply be carried over from C9orf72 disease.
  - reference: PMID:30610877
    reference_title: "Suppression of the yeast elongation factor Spt4 ortholog reduces expanded SCA36 GGCCUG repeat aggregation and cytotoxicity."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Glycine-proline dipeptide repeat (DPR) formation due to repeat-associated non-ATG translation rarely occurred in cells expressing expanded GGCCTG repeats; in contrast, cells harboring expanded c9orf72 GGGGCC/GGCCCC repeats robustly expressed DPR proteins."
    explanation: >-
      A cell-model result arguing against abundant RAN-driven DPR production
      from the SCA36 repeat, which is the substance of the disagreement.
- discussion_id: nop56_dosage_branch
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does reduced NOP56 dosage, and consequent box C/D snoRNP and rRNA-processing
    impairment, contribute to SCA36 at all?
  attaches_to:
  - pathophysiology#Impaired NOP56 Box C/D snoRNP Function
  rationale: >-
    This is the main alternative to the RNA gain-of-function account, and it is
    argued against rather than untested. NOP56 mRNA and protein were measured in
    patient lymphoblastoid cells and were not appreciably reduced, and Cajal body
    number was unchanged. The zebrafish nop56 null then showed what complete loss
    of the gene produces — absent cerebellum and death within a week — which is
    not the disease. Neither result is decisive: the patient measurements are in
    a peripheral cell type, as with MIR1292, and a homozygous zebrafish null is
    several steps removed from a heterozygous human repeat expansion, so a
    partial or cell-type-restricted dosage effect in neurons is not excluded.
    Measuring NOP56 and rRNA 2'-O-methylation in patient cerebellum, or in
    expansion-carrying neurons, is what would settle it.
  evidence:
  - reference: PMID:36009362
    reference_title: "A nop56 Zebrafish Loss-of-Function Model Exhibits a Severe Neurodegenerative Phenotype."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "We observed a severe neurodegenerative phenotype in nop56 mutants, characterized mainly by absence of cerebellum, reduced numbers of spinal cord neurons, high levels of apoptosis in the central nervous system (CNS) and impaired movement, resulting in death before 7 days post-fertilization."
    explanation: >-
      The phenotype of complete nop56 loss is incompatible with the late-onset
      selective degeneration of SCA36, which is the substance of the argument
      against the dosage branch.
- discussion_id: auditory_mechanism_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what mechanism does the NOP56 repeat expansion produce sensorineural
    hearing loss, and which cochlear or auditory-nerve cell population is
    affected?
  attaches_to:
  - pathophysiology#Cochlear and Peripheral Auditory Dysfunction
  rationale: >-
    Hearing loss is one of the most distinctive features of SCA36 and correlates
    with ataxia severity, and BAEPs point to a peripheral rather than central
    lesion. But no cochlear tissue has been examined for repeat RNA foci or DPRs
    in SCA36, and the British cohort's low rate of hearing loss shows the
    feature is not obligate, so the edge from the expansion to auditory
    dysfunction is typed UNKNOWN. Temporal bone pathology, or an
    auditory-competent model, would resolve it.
- discussion_id: cohort_phenotype_variation
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Why do the two discriminating features of SCA36 — sensorineural hearing loss
    and tongue fasciculation — vary so widely between cohorts?
  attaches_to:
  - phenotypes#Sensorineural hearing loss
  - phenotypes#Tongue fasciculations
  rationale: >-
    Tongue atrophy and fasciculation were reported in 12% of French patients
    against 63% of Japanese patients, and the British series found a low rate of
    hearing loss. Ascertainment differences, disease duration at examination,
    somatic repeat instability, and modifier background are all candidate
    explanations, and none has been tested. The practical consequence is already
    recorded in the differential diagnosis: absence of these features does not
    exclude SCA36.
  evidence:
  - reference: PMID:27123487
    reference_title: "Spinocerebellar ataxia type 36 in the Han Chinese."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "atrophy and fasciculation of the tongue and limb muscles are present in 12% of French patients in contrast to 63% of Japanese patients"
    explanation: >-
      Quantifies the between-cohort discrepancy that this question is about.
notes: >-
  The GeneReviews SCA36 chapter (PMID:25101480) has been retired and the cached
  record is the archival version. It remains the only expert-curated clinical
  synthesis for this disorder and is used here as the phenotype and management
  baseline, with primary cohort reports cited alongside it wherever they cover
  the same claim.

  A generic Fasciculations phenotype was considered and dropped: Tongue
  fasciculations and Skeletal muscle fasciculation and atrophy already carry the
  finding with cohort frequencies attached, and the generic term added no
  queryable information the two specific ones do not.

  NCT06467175 (ALICA) is deliberately not curated as a clinical trial. It is a
  long-read sequencing diagnostic study rather than a trial of an intervention
  in SCA36, and the diagnosis section already records the long-read and
  whole-genome-sequencing routes to detecting the expansion.

  SCA36 is also represented at the group level: the NOP56 genetic block in
  Autosomal_Dominant_Cerebellar_Ataxia_Type_I describes this disorder in its
  ADCA-I context, and the Cerebellar_Ataxias grouping collects the ataxias.
  This dedicated entry coexists with both, following the pattern already used
  for SCA2, SCA17 and SCA23.

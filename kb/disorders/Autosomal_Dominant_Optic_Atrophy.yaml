- name: Energetic Vulnerability of the Unmyelinated Prelaminar Axon
  biological_scale: TISSUE
  description: Unmyelinated RGC axons require continuous rather than saltatory action-potential propagation, and mitochondria are enriched in the retina and prelaminar nerve. In six 5-month-old delTTAG heterozygous mice versus six wild-type mice, ultrastructural fragmentation, mitophagy clusters and protein aggregates were prominent in these regions before overt symptoms. Astrocytic mitochondria appeared normal. This supports regional vulnerability, but ATP expenditure and axonal transport were not directly measured, and neither the identity nor causal role of the aggregates was established.

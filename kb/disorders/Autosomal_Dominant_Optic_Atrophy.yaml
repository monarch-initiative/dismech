- name: STK-002 experimental OPA1 splice modulation
  description: STK-002 is an investigational antisense oligonucleotide that suppresses inclusion of a naturally occurring nonproductive OPA1 exon, increasing productive expression. In three haploinsufficient patient fibroblast lines it increased OPA1 and respiratory reserve. Single intravitreal doses increased total retinal OPA1 in healthy cynomolgus monkeys; a rabbit-specific surrogate ST-1102 was used in rabbits. These are target-engagement and cellular rescue data, not evidence of restored human vision. The target exon is not conserved in rodents.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  oligonucleotide_details:
    oligonucleotide_mechanism: SPLICE_MODULATION_EXON_SKIPPING
    oligonucleotide_chemistry: TWO_PRIME_O_METHOXYETHYL
    target_gene:
      preferred_term: OPA1
      term:
        id: hgnc:8140
        label: OPA1
    target_exon: Naturally occurring nonproductive OPA1 exon X between exon 5 or 5b and exon 6
  delivery_system:
    delivery_platform: UNFORMULATED
    targeting_ligand: UNCONJUGATED
  target_mechanisms:
  - target: OPA1 Haploinsufficiency
    description: Increases productive transcript and protein from available OPA1 alleles by reducing nonproductive splicing.
    evidence:
    - reference: PMID:39264859
      reference_title: Antisense Oligonucleotide STK-002 Increases OPA1 in Retina and Improves Mitochondrial Function in Autosomal Dominant Optic Atrophy Cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The reduction of nonproductive mRNA led to an increase in OPA1 protein
      explanation: Target engagement and protein augmentation in HEK293 cells.
  evidence:
  - reference: PMID:39264859
    reference_title: Antisense Oligonucleotide STK-002 Increases OPA1 in Retina and Improves Mitochondrial Function in Autosomal Dominant Optic Atrophy Cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: STK-002 increased maximal respiration and spare respiratory capacity in all three patient fibroblast cells.
    explanation: Patient fibroblast respiratory rescue; basal and ATP-linked respiration improved in only two of the three lines.
  - reference: PMID:39264859
    reference_title: Antisense Oligonucleotide STK-002 Increases OPA1 in Retina and Improves Mitochondrial Function in Autosomal Dominant Optic Atrophy Cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: These studies limited us to the demonstration of a pharmacodynamic rather than a therapeutic effect.
    explanation: Wild-type animal studies establish exposure and protein modulation, not rescue of optic atrophy.
  - reference: PMID:39264859
    reference_title: Antisense Oligonucleotide STK-002 Increases OPA1 in Retina and Improves Mitochondrial Function in Autosomal Dominant Optic Atrophy Cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: results of attempted quantitation of the immunofluorescence intensity showed an increasing trend but were not statistically significantly different from Vehicle
    explanation: Total retinal protein increased, while quantitative RGC immunofluorescence did not reach significance.
  notes: The uniform 2′-O-methoxyethyl phosphorothioate ASO was delivered intravitreally without a claimed receptor-targeting ligand. The unformulated delivery annotation describes the intravitreal animal studies; some cell experiments used Lipofectamine transfection. In monkeys, retinal OPA1 rose 31–47% at week 4; week-8 cohorts had two animals per dose and no concurrent vehicle group or inferential statistics. Rabbit ST-1102 is a surrogate, not STK-002. The nonproductive exon is a normal regulatory event, not a newly asserted disease-causing variant. Benefit for dominant-negative alleles is not established.
animal_models:
- name: Opa1 delTTAG knock-in mouse
  species: Mouse
  genotype: Opa1 c.2708_2711delTTAG heterozygous (Opa1+/delTTAG)
  background: C57BL/6
  publication: PMID:23250881
  description: The heterozygous delTTAG knock-in carries a recurrent human allele. At five months, six mutant and six control mice were examined for mitochondrial ultrastructure along the optic nerve. Fragmentation, mitophagy clusters and aggregates were concentrated in retinal/prelaminar axons. The broader model develops multisystem disease and therefore is not a purely ocular phenocopy.
  modeled_mechanisms:
  - target: Energetic Vulnerability of the Unmyelinated Prelaminar Axon
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Pre-symptomatic Opa1+/- mice show mitochondrial fragmentation and increased mitophagy concentrated in the unmyelinated portion of retinal ganglion cell axons, before any neuronal loss.
    limitations: The readout is mitochondrial ultrastructure and mitophagy in a segment of axon, observed at the cellular scale, while the node it is cited for is a tissue-scale claim about the differential vulnerability of a fibre population. The inference from "mitochondria change here first" to "this is why these fibres die" is not made by the experiment. The mouse optic nerve also differs from the human in the extent of the unmyelinated prelaminar segment and in lacking a true collagenous lamina cribrosa.
    readouts:
    - name: Mitochondrial density, area and circularity by electron microscopy across retina, prelaminar, laminar and retrolaminar zones
      target: Energetic Vulnerability of the Unmyelinated Prelaminar Axon
      direction: ALTERED
      interpretation: Regional mitochondrial fragmentation identifies the unmyelinated prelaminar segment as the site of earliest change.
      evidence:
      - reference: PMID:39659974
        reference_title: Opa1 and MT-Nd6 mutations induce early mitochondrial changes in the retina and prelaminar optic nerve of hereditary optic neuropathy mouse models.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Our results show significant mitochondrial fragmentation and increased mitophagy in Opa1+/- mice, indicating early mitochondrial changes prior to neuronal loss.
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:39659974
      reference_title: Opa1 and MT-Nd6 mutations induce early mitochondrial changes in the retina and prelaminar optic nerve of hereditary optic neuropathy mouse models.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: These pre-symptomatic mitochondrial changes were mainly observed in the unmyelinated portion of the retinal ganglion cell axons, where the transmission of the visual information requires high energy expenditure, constituting the specific point of vulnerability in hereditary optic neuropathies.
      explanation: Supports treating this model as informative for the prelaminar-vulnerability node.
  - target: OPA1 Haploinsufficiency
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: Cochlear Opa1 mRNA was reduced by more than 40%, supporting a dosage contribution. This does not by itself exclude residual mutant-protein effects.
    limitations: The transcript measurement was made in cochlea rather than in retina or optic nerve, so the dosage reduction is inferred to hold in the tissue this entry is about rather than measured there.
    evidence:
    - reference: PMID:38334784
      reference_title: The human OPA1(delTTAG) mutation induces adult onset and progressive auditory neuropathy in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Molecular assessment of cochlea demonstrated a reduction of Opa1 mRNA level by greater than 40%, supporting haploinsufficiency as the disease mechanism.
      explanation: Supports this model as an informative read on the dosage mechanism.
  evidence:
  - reference: PMID:23250881
    reference_title: The human OPA1delTTAG mutation induces premature age-related systemic neurodegeneration in mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We generated an Opa1 mouse model carrying the recurrent Opa1(delTTAG) mutation, which is found in 30% of all patients with dominant optic atrophy.
    explanation: Establishes the provenance and allelic relevance of the model.
  notes: 'The allele assignment was confirmed in the 2024 full methods: c.2708_2711delTTAG, not Q285STOP. Mice lack the human macula and papillomacular bundle, limiting direct modeling of the characteristic human fiber selectivity.'
- name: Zebrafish opa1 crispant and germline knockout larvae
  species: Zebrafish
  genotype: CRISPR mosaic opa1 disruption or homozygous 932-bp deletion spanning exons 8–9
  publication: PMID:40202868
  description: Larvae under 131 hours postfertilization showed impaired optokinetic responses, preserved gross locomotor responses and abnormal RGC-axon mitochondria. Homozygous germline mutants survived the tested larval stage but were absent at two months. Whole-larva respiration was assayed in crispants; basal and ATP-linked output were unchanged, while maximal respiration decreased. The knockout/mosaic perturbations differ from human heterozygous disease.
  modeled_mechanisms:
  - target: Cristae Disorganization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: RGC-axon mitochondria in homozygous mutants had reduced cristae density and abnormal morphology.
    limitations: Homozygous larval loss and species anatomy limit transfer to dominant adult disease; photoreceptor mitochondrial abnormalities also occurred.
    evidence:
    - reference: PMID:40202868
      reference_title: Novel in vivo models of autosomal optic atrophy reveal conserved pathological changes in neuronal mitochondrial structure and function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: mitochondrial fragmentation and disordered cristae organization were observed in neuronal axons in both models
      explanation: Conserved mitochondrial abnormalities in zebrafish and fly axons.
  - target: Retinal Ganglion Cell Degeneration and Optic Nerve Atrophy
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Early visual dysfunction occurred without detectable RGC loss at the sampled stage.
    limitations: The study does not establish when later RGC degeneration begins.
    evidence:
    - reference: PMID:40202868
      reference_title: Novel in vivo models of autosomal optic atrophy reveal conserved pathological changes in neuronal mitochondrial structure and function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: the number of ganglion cell nuclei was not significantly altered
      explanation: Visual and mitochondrial abnormalities at the sampled larval stage preceded detectable RGC loss.
  evidence:
  - reference: PMID:40202868
    reference_title: Novel in vivo models of autosomal optic atrophy reveal conserved pathological changes in neuronal mitochondrial structure and function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: DNA sequencing confirmed these opa1 CRISPR mutants possessed a deletion of 932 bp spanning exons 8 and 9 of the endogenous opa1 gene
    explanation: Germline model genotype, distinct from the mosaic crispant experiments.
- name: Drosophila neuronal Opa1 CRISPR knockout
  species: Drosophila
  genotype: Neuron-restricted Cas9/sgRNA disruption of Opa1
  publication: PMID:40202868
  description: Neuronal knockout flies had severe motor abnormalities and median survival of two days after eclosion. Motor-neuron axons showed smaller, rounder mitochondria. Adult-head proteomics reflects broad neuronal disease rather than isolated RGC pathology.
  modeled_mechanisms:
  - target: Impaired Mitochondrial Inner-Membrane Fusion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Smaller, rounder axonal mitochondria support disturbed dynamics but are not a direct fusion-flux assay.
    limitations: Motor neurons and the fly visual system differ substantially from human retinal ganglion cells.
    evidence:
    - reference: PMID:40202868
      reference_title: Novel in vivo models of autosomal optic atrophy reveal conserved pathological changes in neuronal mitochondrial structure and function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: mitochondria within Opa1 KO motor neuron axons were significantly smaller (Figure 7B) and more circular (Figure 7C) than those in controls
      explanation: Directly reports the axonal mitochondrial morphology underlying this partial model correspondence, without measuring fusion flux.
  evidence:
  - reference: PMID:40202868
    reference_title: Novel in vivo models of autosomal optic atrophy reveal conserved pathological changes in neuronal mitochondrial structure and function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: median survival of just 2 days post‐eclosion, compared to 65 days in control flies
    explanation: Severe systemic neuronal-model limitation.

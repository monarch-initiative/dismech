- name: Optical Coherence Tomography of the Retinal Ganglion Cell Complex
  description: OCT quantifies peripapillary RNFL and macular ganglion cell/inner plexiform layer thinning. In a 2026 retrospective OPA1 cohort of 108 people, these structural measures correlated with visual function; 23 patients had longitudinal macular scans, with mean mGCL loss of 0.26 ± 0.10 micrometers/year over median six-year follow-up. The cohort included DOA-plus cases, and these observations do not establish a validated treatment-response surrogate. The 2025 review found no OCT natural-history data through its May 2024 search date.

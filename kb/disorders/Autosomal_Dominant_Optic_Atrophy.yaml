- name: Patient-derived primary skin fibroblasts with heterozygous OPA1 mutations
  description: 'Four primary skin fibroblast lines carrying different heterozygous OPA1 mutations — nonsense and missense, in the GTPase and the C-terminal coiled-coil domains — analysed in parallel and quantitatively, which was the point of the study: earlier fibroblast reports had been mutually inconsistent. The panel shows defective fusion on pharmacological challenge, abnormal fragmentation under glycolysis shortage or oxidative stress, reduced complex IV activity, and distorted cristae, with a physical OPA1-oxidative-phosphorylation interaction on reciprocal immunoprecipitation. It is the human in vitro counterweight to the study of isolated patient mitochondria that found electron transport unaltered.'
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:22800932
  modeled_mechanisms:
  - target: Cristae Disorganization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Altered cristae structure is present in patient fibroblasts carrying heterozygous OPA1 mutations.
    limitations: 'Skin fibroblasts are not the affected cell type, and the paper says so itself: whether these alterations are present in retinal ganglion cells, and which of them drives degeneration, is left as an open goal. The fusion defect also required pharmacological challenge to become apparent, so the unstressed phenotype is mild.'
    evidence:
    - reference: PMID:22800932
      reference_title: Defective mitochondrial fusion, altered respiratory function, and distorted cristae structure in skin fibroblasts with heterozygous OPA1 mutations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Altered cristae structure coexisted with normal response to pro-apoptotic stimuli and expression of Bax or Bcl2 proteins.
      explanation: Documents the cristae abnormality in patient cells, and in the same sentence the absence of an apoptotic-response abnormality — relevant because it does not reproduce the lowered apoptotic threshold that cultured OPA1-knockdown cells show.
  - target: Impaired Mitochondrial Inner-Membrane Fusion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Fusion was defective during pharmacological challenge with the protonophore CCCP, and fragmentation appeared under glycolysis shortage or exogenous oxidative stress.
    limitations: The fusion defect is conditional on a stressor rather than constitutive, and baseline mitochondria were significantly elongated rather than fragmented, so the phenotype is not a simple loss of fusion.
    evidence:
    - reference: PMID:22800932
      reference_title: Defective mitochondrial fusion, altered respiratory function, and distorted cristae structure in skin fibroblasts with heterozygous OPA1 mutations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: defective mitochondrial fusion during pharmacological challenge with the protonophore carbonyl cyanide m-chlorophenyl hydrazone, significant mitochondrial elongation with decreased OPA1 and DRP1 proteins, and abnormal mitochondrial fragmentation during glycolysis shortage or exogenous oxidative stress
      explanation: Reports the conditional fusion and fragmentation phenotypes this link describes.
  evidence:
  - reference: PMID:22800932
    reference_title: Defective mitochondrial fusion, altered respiratory function, and distorted cristae structure in skin fibroblasts with heterozygous OPA1 mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Skin fibroblasts with heterozygous OPA1 mutations thus share significant mitochondrial remodeling, and may therefore be useful for analyzing disease pathophysiology.
    explanation: The authors' own statement of the model's usefulness, which is what this entry relies on in citing it.
  notes: 'The paper''s closing sentence is the caveat that should travel with every use of it: "Identifying whether the observed alterations are also present in ganglion retinal cells, and which of them underlies their degeneration process remains however an essential goal for therapeutic strategy."'
- name: Purified neonatal Opa1 Q285STOP mouse retinal ganglion cells
  description: RGCs purified from postnatal day 6–7 mice were examined in culture. Mitochondrial imaging at day 8 showed shorter, more mobile mitochondria, while day-3 Seahorse assays showed reduced basal, ATP-linked and maximal respiration. Enhanced motility was proposed as compensation, not demonstrated restoration of fusion.

  description: Autosomal dominant transmission with incomplete penetrance and variable expressivity. Each child of a heterozygous carrier has a 50% chance of inheriting the variant; this is not a 50% probability of a particular clinical severity. The recurrent delTTAG allele had estimated penetrance of 43% and 62% in two families in the 2001 study; these are family-specific estimates, not a population penetrance.

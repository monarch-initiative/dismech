      label: autosomal dominant optic atrophy
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: 'MONDO:0020250 is the MONDO parent grouping of this entry''s anchor MONDO:0008134 and also subsumes the syndromic DOA plus concepts curated in Autosomal_Dominant_Optic_Atrophy_Plus. broadMatch, not exactMatch: the parent is a union of the classic and the syndromic forms, so it must not retire either concept from the curation queue.

      '
notes: 'The entry follows the classic-form MONDO anchor and focuses on OPA1-related optic atrophy. Other genetic causes of clinically dominant optic atrophy are differential diagnoses. The separate DOA-plus entry describes extraocular manifestations, not a mutually exclusive allele or mitochondrial-DNA mechanism. In PMID:20157015, both pure DOA and DOA-plus occurred within 11 of 32 evaluable pedigrees; all mutation classes could produce syndromic disease. Missense/GTPase variants were enriched in DOA-plus, but that association does not prove a dominant-negative mechanism for every variant. Multiple mtDNA deletions and COX-deficient muscle fibers occurred in both clinical groups, and neither muscle nor the studied iPSC-RGCs showed generalized mtDNA depletion.

  The retired Optic Atrophy Type 1 GeneReviews chapter is an archival source for clinical presentation, diagnosis, supportive care and inheritance. Its full text was retrieved and reviewed; its historical care recommendations are identified as such, and its old treatment pipeline and prevalence estimates are not used as current evidence. No quantitative OPA1-specific exposure effect is asserted. Trial rationale alone does not establish plasma nicotinamide deficiency. No verified human optic-nerve histopathology series is added. The full GeneReviews URL and PMID:20301426 are the same publication, not independent evidence; the URL is retained because the PMID cache lacks the full chapter.'

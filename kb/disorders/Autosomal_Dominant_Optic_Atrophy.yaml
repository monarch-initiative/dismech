    snippet: peripapillary retinal nerve fiber layer (pRNFL) and macular ganglion cell layer (mGCL) thicknesses impacted visual function, with an average deterioration of 0.1 logMAR per 3.2 µm mGCL reduction (P < 0.001)
    explanation: Retinal thickness was associated with visual function in the mixed classic/plus cohort; this observational association does not establish treatment responsiveness.
treatments:
- name: Idebenone
  description: 'Off-label idebenone has limited human evidence in OPA1-related optic atrophy. A 2020 retrospective comparison of 50 treated and 37 untreated patients found stabilization/recovery of the better-seeing eye in 92% versus 75.7%, with adjusted odds ratio 4.37 (95% CI 1.01–18.9). A 2023 uncontrolled prospective phase 2 study treated 16 patients for 12 months and reported a small improvement in its best-recovery endpoint. Neither design establishes efficacy: selection bias, prolonged natural stability, measurement variation and placebo effects remain relevant. Animal studies measured different endpoints and did not show consistent rescue.'
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: idebenone
      term:
        id: CHEBI:31687
        label: idebenone
  target_mechanisms:
  - target: Oxidative Phosphorylation Deficiency
    description: Idebenone is used as an alternative electron carrier intended to bypass the respiratory-chain deficit downstream of the OPA1 lesion.
  target_phenotypes:
  - preferred_term: Reduced visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
  evidence:
  - reference: PMID:32243103
    reference_title: Idebenone increases chance of stabilization/recovery of visual acuity in OPA1-dominant optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We found a significant difference between the last visit and baseline VA in favor of stabilization/recovery in idebenone-treated as compared to untreated patients. This effect was retained after controlling for confounders.
    explanation: The cohort result supporting a visual-acuity benefit, with the observational design stated in the treatment description.
  - reference: PMID:26820596
    reference_title: A randomized, placebo-controlled trial of the benzoquinone idebenone in a mouse model of OPA1-related dominant optic atrophy reveals a limited therapeutic effect on retinal ganglion cell dendropathy and visual function.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: Idebenone appears largely ineffective in protecting Opa1 heterozygous RGCs from dendropathy.
    explanation: The Q285STOP mouse experiment found little dendritic rescue, despite a transient optokinetic improvement. This limits translational confidence but does not directly refute the human acuity association.
  - reference: PMID:26820596
    reference_title: A randomized, placebo-controlled trial of the benzoquinone idebenone in a mouse model of OPA1-related dominant optic atrophy reveals a limited therapeutic effect on retinal ganglion cell dendropathy and visual function.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: in the liver there was an 80.35% (p=0.011) increase in oxidative damage
    explanation: A harm signal rather than an efficacy failure, and recorded because it is the opposite of the drug's intended antioxidant effect. The same trial also found visual function impaired in idebenone-treated wildtype mice, which the authors say had not been observed before and raises concerns.
  - reference: PMID:38130806
    reference_title: 'Idebenone Treatment in Patients with OPA1-Dominant Optic Atrophy: A Prospective Phase 2 Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sixteen patients with genetically confirmed OPA1-DOA were treated with 900 mg idebenone daily for 12 months.
    explanation: Prospective open-label study without a randomized comparator.
  - reference: PMID:38130806
    reference_title: 'Idebenone Treatment in Patients with OPA1-Dominant Optic Atrophy: A Prospective Phase 2 Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Whether this effect is due to idebenone treatment, the placebo effect, or is explainable by the natural progression of DOA, remains unclear.
    explanation: The authors explicitly limit causal attribution despite improvement in the best-recovery endpoint.
  notes: The 2020 study combined stability and recovery and used the better-seeing eye; the median acuity change was zero in both groups, while the continuous change comparison was not significant (P=0.08). Dosage and observation time varied. The 2023 study is distinct from the registered Australian placebo-controlled study ACTRN12621000826842, whose current status and results were not established from its stale ICTRP record. The mouse abstract reports 2000 mg/kg/day; this animal regimen is not a human dose or an established cross-species therapeutic threshold. The 2025 zebrafish/fly paper also reports no idebenone rescue, but supplies no underlying treatment data.
- name: Low-Vision Rehabilitation and Visual Aids
  description: Supportive management includes low-vision aids and rehabilitation. The archival GeneReviews chapter advises annual ophthalmologic assessment including visual acuity, fields and OCT, as well as hearing surveillance for extraocular involvement. Monitoring should be adapted to clinical circumstances.

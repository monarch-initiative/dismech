  description: Two-dimensional human iPSC-RGC cultures compare an engineered heterozygous OPA1-null line, a classic delTTAG patient line, a DOA-plus R445H patient line and two gene-corrected DOA-plus clones. They permit allele- and assay-specific comparisons without establishing a strict mechanistic partition between clinical forms.

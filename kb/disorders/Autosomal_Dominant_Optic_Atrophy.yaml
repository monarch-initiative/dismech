- name: Oxidative Phosphorylation Deficiency
  biological_scale: MOLECULAR
  description: Bioenergetic impairment is measured in several OPA1 disease models but is not uniform across assays and cell types. The 2022 iPSC-RGC study found reduced basal respiration and ATP-linked output in engineered-null, classic delTTAG and DOA-plus R445H lines. Maximal respiration was reduced in knockout and DOA-plus cultures but not significantly in the classic patient line. Cultured Q285STOP mouse RGCs also had impaired respiratory parameters. In contrast, isolated lymphoblast mitochondria from six OPA1-positive patients showed no significant respiratory or electron-transport defect. Fusion, cristae and genome-maintenance abnormalities are candidate contributors; cytochrome c release forms a parallel apoptotic pathway.

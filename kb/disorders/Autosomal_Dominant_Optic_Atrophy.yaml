- name: Cristae Disorganization
  biological_scale: CELLULAR
  description: 'OPA1 regulates mitochondrial cristae architecture as well as fusion. Knockdown experiments show cristae disorganization, and patient fibroblasts with heterozygous variants show altered cristae. Experiments distinguish OPA1 control of cristae remodeling during apoptosis from its fusion function. Altered structure does not invariably imply increased apoptosis: the studied patient fibroblasts retained normal responses to pro-apoptotic stimuli.'

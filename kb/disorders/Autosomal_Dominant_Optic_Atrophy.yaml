diagnosis:
- name: OPA1 Molecular Genetic Testing
  description: 'The diagnosis rests on a combination of clinical findings, electrophysiologic studies and family history, and/or on identifying a heterozygous pathogenic OPA1 variant by molecular genetic testing. Two practical points follow from the cohort data curated in the genetic block: the detection rate depends strongly on family history (57.6% in probands with an affected relative versus 14.0% in singletons), and sequencing alone misses large-scale rearrangements, so an OPA1-negative result after coding sequencing is not a negative OPA1 result. A variant of uncertain significance does not establish or exclude the diagnosis. Negative coding-sequence testing may require deletion/duplication analysis or broader genetic assessment.'
  diagnosis_term:
    preferred_term: OPA1 molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: Heterozygous pathogenic OPA1 variant

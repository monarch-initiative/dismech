genetic:
- name: OPA1
  gene_term:
    preferred_term: OPA1
    term:
      id: hgnc:8140
      label: OPA1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal dominant
  notes: >-
    OPA1 is the only gene established for the classic non-syndromic form; more
    than 60% of genetically confirmed DOA carries an OPA1 variant, and OPA1
    accounted for 67% of all molecular diagnoses in a 980-patient hereditary
    optic neuropathy screen. The allele spectrum is dominated by null variants,
    which is the basis of the haploinsufficiency mechanism and of the split
    from the DOA plus entry. Detection rate is strongly family-history
    dependent — 57.6% in probands with a positive family history versus 14.0%
    in singletons — yet OPA1 variants were still found in 40% of apparently
    sporadic optic atrophy in a large referral series, so a negative family
    history does not exclude the gene. Within OPA1-positive patients, missense
    alleles predict a worse visual outcome than other mutational subtypes.
  case_fractions:
  - population: Genetically confirmed DOA (review estimate)
    case_fraction_percent: 60.0
    notes: >-
      Stated as "more than 60%" and recorded as the lower bound; a review's
      summary figure, not a single-cohort measurement.
    evidence:
    - reference: PMID:35652445
      reference_title: Modelling autosomal dominant optic atrophy associated with OPA1 variants in iPSC-derived retinal ganglion cells.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "More than 60% of genetically confirmed patients with DOA carry variants in the nuclear OPA1 gene"
      explanation: Source for the OPA1 share of genetically confirmed DOA. Evidence source is OTHER because this is a consensus figure quoted in the paper's introduction rather than its own cohort measurement.
  - population: Molecular diagnoses among 980 patients screened for suspected hereditary optic neuropathy
    case_fraction_percent: 67.0
    cohort_size: 980
    notes: >-
      295 of the 440 patients in whom any molecular defect was identified had an
      OPA1 mutation. The denominator is solved cases within a mixed
      LHON/ADOA referral cohort, not DOA cases, so this is not directly
      comparable with the review figure above.
    evidence:
    - reference: PMID:19319978
      reference_title: Molecular screening of 980 cases of suspected hereditary optic neuropathy with a report on 77 novel OPA1 mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Among these, 295 patients (67%) had an OPA1 mutation, 131 patients (30%) had an mtDNA mutation, and 14 patients (3%), belonging to three unrelated families, had an OPA3 mutation."
      explanation: Gives the OPA1 share of molecular diagnoses in a large hereditary optic neuropathy screen.
  evidence:
  - reference: PMID:11017079
    reference_title: "Nuclear gene OPA1, encoding a mitochondrial dynamin-related protein, is mutated in dominant optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe here a nuclear gene, OPA1, that maps within the candidate region and encodes a dynamin-related protein localized to mitochondria."
    explanation: The original identification of OPA1 as the gene for optic atrophy type 1.
  - reference: PMID:11017079
    reference_title: "Nuclear gene OPA1, encoding a mitochondrial dynamin-related protein, is mutated in dominant optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found four different OPA1 mutations, including frameshift and missense mutations, to segregate with the disease, demonstrating a role for mitochondria in retinal ganglion cell pathophysiology."
    explanation: Establishes cosegregation of OPA1 variants with the disease and the mitochondrial basis of retinal ganglion cell pathology.
  - reference: PMID:20417570
    reference_title: The prevalence and natural history of dominant optic atrophy due to OPA1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The detection rate of OPA1 mutations was 57.6% among probands with a positive family history of optic atrophy (19/33) and 14.0% among singleton cases (6/43)."
    explanation: Quantifies the family-history dependence of the OPA1 detection rate.
  - reference: PMID:19319978
    reference_title: Molecular screening of 980 cases of suspected hereditary optic neuropathy with a report on 77 novel OPA1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OPA1 mutations were found in 157 (40%) of the 392 apparently sporadic cases of optic atrophy"
    explanation: Shows that a negative family history does not exclude OPA1, which matters for the incomplete penetrance of this disease.
  - reference: PMID:20417570
    reference_title: The prevalence and natural history of dominant optic atrophy due to OPA1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OPA1 missense mutations were associated with a significantly worse visual outcome compared with other mutational subtypes (P=0.0001)"
    explanation: Genotype-phenotype evidence that missense alleles behave differently from the null alleles that predominate in the classic form — the same axis that separates this entry from the DOA plus entry.
  - reference: PMID:20157015
    reference_title: Multi-system neurological disease is common in patients with OPA1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there was an increased risk with missense mutations [odds \nratio = 3.06, 95% confidence interval = 1.44-6.49; P = 0.0027], and mutations \nlocated within the guanosine triphosphate-ase region (odds ratio = 2.29, \n95% confidence interval = 1.08-4.82; P = 0.0271)"
    explanation: Quantifies the allele-class skew away from the classic form and towards the multi-system phenotype, the evidence underpinning this entry's separation from Autosomal_Dominant_Optic_Atrophy_Plus.

diagnosis:
- name: OPA1 Molecular Genetic Testing
  description: >-
    The diagnosis rests on a combination of clinical findings,
    electrophysiologic studies and family history, and/or on identifying a
    heterozygous pathogenic OPA1 variant by molecular genetic testing. Two
    practical points follow from the cohort data curated in the genetic block:
    the detection rate depends strongly on family history (57.6% in probands
    with an affected relative versus 14.0% in singletons), and sequencing alone
    misses large-scale rearrangements, so an OPA1-negative result after coding
    sequencing is not a negative OPA1 result.
  diagnosis_term:
    preferred_term: OPA1 molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: Heterozygous pathogenic OPA1 variant
  evidence:
  - reference: PMID:20301426
    reference_title: "Optic Atrophy Type 1 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of OPA1 is made based on a combination of clinical \nfindings, electrophysiologic studies, and family history and/or by the \nidentification of a heterozygous pathogenic variant in OPA1, the only gene known \nto be associated with OPA1, by molecular genetic testing."
    explanation: States the diagnostic basis of the entity and that OPA1 is the only gene known to be associated with it.
  - reference: PMID:20417570
    reference_title: The prevalence and natural history of dominant optic atrophy due to OPA1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OPA1-negative cases were then screened for large-scale OPA1 rearrangements and OPA3 mutations."
    explanation: Documents the second-tier rearrangement screen that a coding-sequence-only strategy would miss.
  notes: >-
    Bound to the general NCIT Genetic Testing action. NCIT:C153598 DNA
    Sequencing would name the technique but not the clinical act, and there is
    no NCIT clinical-action term for OPA1 testing specifically, so the
    specificity is carried in preferred_term per the Ontology Term Contract.

- name: Optical Coherence Tomography of the Retinal Ganglion Cell Complex
  description: >-
    Optical coherence tomography quantifies the structural loss, showing
    thinning of both the peripapillary retinal nerve fibre layer and the
    macular ganglion cell-inner plexiform layer. It is the candidate objective
    endpoint for trials, although the meta-analysis of longitudinal biomarkers
    found no pooled longitudinal data for it — visual acuity was the only
    biomarker with any. See the Progressive visual loss phenotype for that
    tension.
  diagnosis_term:
    preferred_term: optical coherence tomography of the retinal ganglion cell complex
    term:
      id: NCIT:C20828
      label: Optical Coherence Tomography
  markers: Peripapillary retinal nerve fibre layer thickness; macular ganglion cell-inner plexiform layer thickness
  evidence:
  - reference: PMID:30649972
    reference_title: "Optical Coherence Tomography of the Retinal Ganglion Cell Complex in Leber's Hereditary Optic Neuropathy and Dominant Optic Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study suggests the usefulness of the RGCC as a potential in vivo biomarker for assessing disease in patients with LHON and DOA."
    explanation: Supports the retinal ganglion cell complex on OCT as an in vivo biomarker in this disease.
  - reference: PMID:20301426
    reference_title: "Optic Atrophy Type 1 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surveillance: Annual ophthalmologic evaluations (including measurement \nof visual acuity, visual fields, and optical coherence tomography) and hearing \nevaluations."
    explanation: Places optical coherence tomography within the recommended surveillance schedule alongside visual acuity and visual fields.

treatments:
- name: Idebenone
  description: >-
    Off-label idebenone, a short-chain quinone used as an alternative electron
    carrier, has been given to OPA1-DOA patients on the rationale shared with
    Leber hereditary optic neuropathy. In a cohort study comparing treated with
    untreated patients, treatment was associated with stabilization or recovery
    of visual acuity, and the association survived adjustment for confounders.
    This is observational, not a randomized result, and it is the strongest
    pharmacological evidence located for this disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: idebenone
      term:
        id: CHEBI:31687
        label: idebenone
  target_mechanisms:
  - target: Oxidative Phosphorylation Deficiency
    description: >-
      Idebenone is used as an alternative electron carrier intended to bypass
      the respiratory-chain deficit downstream of the OPA1 lesion.
  target_phenotypes:
  - preferred_term: Reduced visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
  evidence:
  - reference: PMID:32243103
    reference_title: Idebenone increases chance of stabilization/recovery of visual acuity in OPA1-dominant optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a significant difference between the last visit and baseline VA in favor of stabilization/recovery in idebenone-treated as compared to untreated patients. This effect was retained after controlling for confounders."
    explanation: The cohort result supporting a visual-acuity benefit, with the observational design stated in the treatment description.
  - reference: PMID:26820596
    reference_title: "A randomized, placebo-controlled trial of the benzoquinone idebenone in a mouse model of OPA1-related dominant optic atrophy reveals a limited therapeutic effect on retinal ganglion cell dendropathy and visual function."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Idebenone appears largely ineffective in protecting Opa1 heterozygous RGCs from dendropathy."
    explanation: >-
      The randomized, placebo-controlled test of this treatment in an Opa1
      mutant mouse found it largely ineffective at the cellular endpoint. It is
      the only randomized evidence on idebenone in this disease in either
      species, and it cuts against the human cohort association above.
  - reference: PMID:26820596
    reference_title: "A randomized, placebo-controlled trial of the benzoquinone idebenone in a mouse model of OPA1-related dominant optic atrophy reveals a limited therapeutic effect on retinal ganglion cell dendropathy and visual function."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "in the liver there was an 80.35% (p=0.011) increase in oxidative damage"
    explanation: >-
      A harm signal rather than an efficacy failure, and recorded because it is
      the opposite of the drug's intended antioxidant effect. The same trial also
      found visual function impaired in idebenone-treated wildtype mice, which
      the authors say had not been observed before and raises concerns.
  notes: >-
    The evidence on idebenone points both ways and neither item should be read
    without the other. The human signal is an observational cohort comparison of
    treated with untreated patients (PMID:32243103), with the selection bias that
    implies. The only randomized, placebo-controlled test is in the
    B6;C3-Opa1(Q285STOP) mouse (PMID:26820596), and it found no substantive
    retinal ganglion cell rescue, an 80% rise in hepatic oxidative damage, and
    impaired vision in treated wildtype animals. The mouse result is not
    dispositive for humans — different species, a supratherapeutic 2000
    mg/kg/day dose, and a dendritic-morphology endpoint rather than acuity — but
    it is the stronger design, and the entry does not claim idebenone works.

- name: Low-Vision Rehabilitation and Visual Aids
  description: >-
    Low-vision aids for decreased visual acuity, with annual ophthalmologic
    evaluation including visual acuity, visual fields, and optical coherence
    tomography. This is the mainstay of management, since no disease-modifying
    therapy is licensed.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: low-vision rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  evidence:
  - reference: PMID:20301426
    reference_title: "Optic Atrophy Type 1 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of manifestations: Low-vision aids for decreased visual \nacuity."
    explanation: Source for low-vision aids as the recommended management of the visual deficit.
  - reference: PMID:20301426
    reference_title: "Optic Atrophy Type 1 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surveillance: Annual ophthalmologic evaluations (including measurement \nof visual acuity, visual fields, and optical coherence tomography) and hearing \nevaluations."
    explanation: Source for the annual surveillance schedule asserted in this treatment's description — visual acuity, visual fields, optical coherence tomography, and hearing evaluation.
  notes: >-
    treatment_term is bound to the general NCIT Rehabilitation action because
    NCIT has no clinical-action term for low-vision rehabilitation or for
    visual-aid provision that is reachable from NCIT:C25218; the specificity is
    carried in preferred_term, per the Ontology Term Contract.

- name: Avoidance of Mitochondrial Toxins
  description: >-
    Carriers are advised to avoid smoking, excessive alcohol intake, and
    medications — antibiotics and antivirals are the examples given — that
    interfere with mitochondrial metabolism. This is curated as a management
    action, which is what the source files it as, and not as an environmental
    causal edge: "clinicians advise avoiding X" is a weaker and differently
    grounded claim than "X causes retinal ganglion cell loss in this disease",
    and no source was located that quantifies an exposure effect in OPA1-related
    optic atrophy. The rationale is plausible and unmeasured — these exposures
    are mitochondrial stressors acting on a cell population already at a
    bioenergetic margin — and the advice is cheap, which is presumably why it is
    given.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: avoidance of mitochondrial toxins and mitochondriotoxic medication
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301426
    reference_title: "Optic Atrophy Type 1 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Smoking, excessive alcohol intake, \nmedications (antibiotics, antivirals) that interfere with mitochondrial \nmetabolism."
    explanation: Source for the specific agents and circumstances carriers are advised to avoid, filed under management in the cited chapter.
  notes: >-
    Bound to the general NCIT Supportive Care action because NCIT has no
    clinical-action term reachable from NCIT:C25218 for exposure avoidance or
    risk counselling; the specificity is in preferred_term. A reader looking for
    the causal question rather than the management one should note that this
    entry carries no environmental block, and why — see entry notes.

- name: Genetic Counseling
  description: >-
    Autosomal dominant transmission with a 50% recurrence risk per child, but
    counselling is complicated by incomplete penetrance and by markedly
    variable inter- and intrafamilial expressivity, so an at-risk relative
    cannot be given a reliable severity prediction from the genotype alone.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301426
    reference_title: "Optic Atrophy Type 1 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "genetic counseling remains \ncomplicated by the incomplete penetrance and the markedly variable inter- and \nintrafamilial expressivity of the disease."
    explanation: Source for the counselling difficulty created by reduced penetrance and variable expressivity.

animal_models:
- name: Opa1 delTTAG knock-in mouse
  species: Mouse
  genotype: Opa1 c.2708_2711delTTAG heterozygous (Opa1+/delTTAG)
  background: C57BL/6
  publication: PMID:23250881
  description: >-
    A mouse carrying the recurrent human OPA1 c.2708_2711delTTAG allele, which
    is found in roughly 30% of DOA patients. It reproduces the selective
    retinal ganglion cell vulnerability and, in a pre-symptomatic analysis,
    localizes the earliest mitochondrial abnormality to the unmyelinated
    prelaminar axon segment. Its limitation for this entry is that it is
    multi-systemic — the published phenotype includes deafness,
    encephalomyopathy, peripheral neuropathy, ataxia and cardiomyopathy — so it
    models the DOA plus spectrum at least as well as the non-syndromic form it
    was derived from.
  modeled_mechanisms:
  - target: Energetic Vulnerability of the Unmyelinated Prelaminar Axon
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Pre-symptomatic Opa1+/- mice show mitochondrial fragmentation and
      increased mitophagy concentrated in the unmyelinated portion of retinal
      ganglion cell axons, before any neuronal loss.
    limitations: >-
      The readout is mitochondrial ultrastructure and mitophagy in a segment of
      axon, observed at the cellular scale, while the node it is cited for is a
      tissue-scale claim about the differential vulnerability of a fibre
      population. The inference from "mitochondria change here first" to "this
      is why these fibres die" is not made by the experiment. The mouse optic
      nerve also differs from the human in the extent of the unmyelinated
      prelaminar segment and in lacking a true collagenous lamina cribrosa.
    readouts:
    - name: Mitochondrial density, area and circularity by electron microscopy across retina, prelaminar, laminar and retrolaminar zones
      target: Energetic Vulnerability of the Unmyelinated Prelaminar Axon
      direction: ALTERED
      interpretation: >-
        Regional mitochondrial fragmentation identifies the unmyelinated
        prelaminar segment as the site of earliest change.
      evidence:
      - reference: PMID:39659974
        reference_title: Opa1 and MT-Nd6 mutations induce early mitochondrial changes in the retina and prelaminar optic nerve of hereditary optic neuropathy mouse models.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Our results show significant mitochondrial fragmentation and increased mitophagy in Opa1+/- mice, indicating early mitochondrial changes prior to neuronal loss."
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:39659974
      reference_title: Opa1 and MT-Nd6 mutations induce early mitochondrial changes in the retina and prelaminar optic nerve of hereditary optic neuropathy mouse models.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These pre-symptomatic mitochondrial changes were mainly observed in the unmyelinated portion of the retinal ganglion cell axons, where the transmission of the visual information requires high energy expenditure, constituting the specific point of vulnerability in hereditary optic neuropathies."
      explanation: Supports treating this model as informative for the prelaminar-vulnerability node.
  - target: OPA1 Haploinsufficiency
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      The knock-in allele reduces Opa1 transcript by more than 40% in cochlea,
      confirming that the recurrent human delTTAG allele acts by dosage
      reduction rather than by a dominant-negative product.
    limitations: >-
      The transcript measurement was made in cochlea rather than in retina or
      optic nerve, so the dosage reduction is inferred to hold in the tissue
      this entry is about rather than measured there.
    evidence:
    - reference: PMID:38334784
      reference_title: The human OPA1(delTTAG) mutation induces adult onset and progressive auditory neuropathy in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Molecular assessment of cochlea demonstrated a reduction of Opa1 mRNA level by greater than 40%, supporting haploinsufficiency as the disease mechanism."
      explanation: Supports this model as an informative read on the dosage mechanism.
  evidence:
  - reference: PMID:23250881
    reference_title: The human OPA1delTTAG mutation induces premature age-related systemic neurodegeneration in mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We generated an Opa1 mouse model carrying the recurrent Opa1(delTTAG) mutation, which is found in 30% of all patients with dominant optic atrophy."
    explanation: Establishes the provenance and allelic relevance of the model.
  notes: >-
    The same paper reports a multi-systemic poly-degenerative phenotype
    including deafness, encephalomyopathy, peripheral neuropathy, ataxia and
    cardiomyopathy. Those features belong to the DOA plus entry, not here; they
    are the reason fidelity for the non-syndromic disease is recorded as
    MODERATE rather than HIGH and the reason no FAILS_TO_RECAPITULATE link is
    asserted in either direction without a study designed to test it.

experimental_models:
- name: OPA1 patient-derived and isogenic OPA1-null iPSC-derived retinal ganglion cells
  description: >-
    Human induced pluripotent stem cells comprising an isogenic heterozygous
    OPA1-null line made by CRISPR/Cas9 editing of a control, a patient line
    carrying the recurrent c.2708_2711delTTAG null allele, a DOA plus patient
    line carrying the c.1334G>A (p.R445H) missense allele, and CRISPR-corrected
    controls, differentiated in two dimensions to retinal ganglion cells. This
    is the disease-relevant human cell type, and the line panel is the reason
    it matters here: it puts a classic-form null allele and a plus-form
    missense allele in the same dish, which is the comparison the lump/split
    argument turns on.
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: Retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  culture_system: Two-dimensional directed differentiation to retinal ganglion cells
  publication: PMID:35652445
  modeled_mechanisms:
  - target: Oxidative Phosphorylation Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      OPA1+/- and OPA1-variant iPSC-RGCs show reduced bioenergetic output.
    limitations: >-
      iPSC-derived retinal ganglion cells in two-dimensional culture have no
      unmyelinated prelaminar axon segment, no lamina cribrosa, and no
      long-range axonal compartment, so the system can report the bioenergetic
      deficit but structurally cannot test the selectivity mechanism this entry
      proposes. Differentiation was unimpaired in all mutant lines, so the
      model captures a functional deficit in surviving cells rather than cell
      loss.
    readouts:
    - name: Mitochondrial bioenergetic output
      target: Oxidative Phosphorylation Deficiency
      direction: DECREASED
      interpretation: Reduced bioenergetic output in mutant iPSC-RGCs relative to isogenic and corrected controls.
      evidence:
      - reference: PMID:35652445
        reference_title: Modelling autosomal dominant optic atrophy associated with OPA1 variants in iPSC-derived retinal ganglion cells.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "OPA1+/- and OPA1 variant iPSC-RGCs exhibited impaired mitochondrial homeostasis, with reduced bioenergetic output"
        explanation: Reports the bioenergetic measurement behind this readout.
  - target: Impaired Mitochondrial DNA Maintenance
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      The same lines show compromised mitochondrial DNA maintenance.
    limitations: >-
      The abstract reports compromised mtDNA maintenance without separating
      copy number from deletion burden, so it does not by itself distinguish
      the classic-form mtDNA phenotype from the DOA-plus one.
    evidence:
    - reference: PMID:35652445
      reference_title: Modelling autosomal dominant optic atrophy associated with OPA1 variants in iPSC-derived retinal ganglion cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "OPA1+/- and OPA1 variant iPSC-RGCs exhibited impaired mitochondrial homeostasis, with reduced bioenergetic output and compromised mitochondrial DNA maintenance."
      explanation: Supports this model as informative for the mtDNA-maintenance node.
  evidence:
  - reference: PMID:35652445
    reference_title: Modelling autosomal dominant optic atrophy associated with OPA1 variants in iPSC-derived retinal ganglion cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we describe the generation of isogenic, heterozygous OPA1 null induced pluripotent stem cell (iPSC) (OPA1+/-) through clustered regularly interspaced short palindromic repeats (CRISPR)/Cas9 gene editing of a control cell line"
    explanation: Establishes the isogenic design that makes this model informative.

- name: Patient-derived primary skin fibroblasts with heterozygous OPA1 mutations
  description: >-
    Four primary skin fibroblast lines carrying different heterozygous OPA1
    mutations — nonsense and missense, in the GTPase and the C-terminal
    coiled-coil domains — analysed in parallel and quantitatively, which was the
    point of the study: earlier fibroblast reports had been mutually
    inconsistent. The panel shows defective fusion on pharmacological challenge,
    abnormal fragmentation under glycolysis shortage or oxidative stress,
    reduced complex IV activity, and distorted cristae, with a physical
    OPA1-oxidative-phosphorylation interaction on reciprocal
    immunoprecipitation. It is the human in vitro counterweight to the study of
    isolated patient mitochondria that found electron transport unaltered.
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:22800932
  modeled_mechanisms:
  - target: Cristae Disorganization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Altered cristae structure is present in patient fibroblasts carrying
      heterozygous OPA1 mutations.
    limitations: >-
      Skin fibroblasts are not the affected cell type, and the paper says so
      itself: whether these alterations are present in retinal ganglion cells,
      and which of them drives degeneration, is left as an open goal. The fusion
      defect also required pharmacological challenge to become apparent, so the
      unstressed phenotype is mild.
    evidence:
    - reference: PMID:22800932
      reference_title: "Defective mitochondrial fusion, altered respiratory function, and distorted cristae structure in skin fibroblasts with heterozygous OPA1 mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Altered cristae structure coexisted with normal response to pro-apoptotic stimuli and expression of Bax or Bcl2 proteins."
      explanation: >-
        Documents the cristae abnormality in patient cells, and in the same
        sentence the absence of an apoptotic-response abnormality — relevant
        because it does not reproduce the lowered apoptotic threshold that
        cultured OPA1-knockdown cells show.
  - target: Impaired Mitochondrial Inner-Membrane Fusion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Fusion was defective during pharmacological challenge with the
      protonophore CCCP, and fragmentation appeared under glycolysis shortage or
      exogenous oxidative stress.
    limitations: >-
      The fusion defect is conditional on a stressor rather than constitutive,
      and baseline mitochondria were significantly elongated rather than
      fragmented, so the phenotype is not a simple loss of fusion.
    evidence:
    - reference: PMID:22800932
      reference_title: "Defective mitochondrial fusion, altered respiratory function, and distorted cristae structure in skin fibroblasts with heterozygous OPA1 mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "defective mitochondrial fusion during pharmacological challenge with the protonophore carbonyl cyanide m-chlorophenyl hydrazone, significant mitochondrial elongation with decreased OPA1 and DRP1 proteins, and abnormal mitochondrial fragmentation during glycolysis shortage or exogenous oxidative stress"
      explanation: Reports the conditional fusion and fragmentation phenotypes this link describes.
  evidence:
  - reference: PMID:22800932
    reference_title: "Defective mitochondrial fusion, altered respiratory function, and distorted cristae structure in skin fibroblasts with heterozygous OPA1 mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Skin fibroblasts with heterozygous OPA1 mutations thus share significant mitochondrial remodeling, and may therefore be useful for analyzing disease pathophysiology."
    explanation: The authors' own statement of the model's usefulness, which is what this entry relies on in citing it.
  notes: >-
    The paper's closing sentence is the caveat that should travel with every use
    of it: "Identifying whether the observed alterations are also present in
    ganglion retinal cells, and which of them underlies their degeneration
    process remains however an essential goal for therapeutic strategy."

clinical_trials:
- name: NCT06007391
  phase: PHASE_II
  status: ACTIVE_NOT_RECRUITING
  description: >-
    Pilot study of the tolerance and efficacy of nicotinamide (vitamin B3) in
    DOA and DOA plus, on the rationale that plasma metabolomics in DOA shows a
    relative nicotinamide deficiency and that nicotinamide is neuroprotective
    for the optic nerve. Registered as phase 2/phase 3; recorded here as
    PHASE_II because the enum is single-valued and the registration describes a
    pilot tolerance-and-efficacy study.
  target_phenotypes:
  - preferred_term: Reduced visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
  evidence:
  - reference: clinicaltrials:NCT06007391
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The objective of this pilot study is to test the tolerance and efficacy of nicotinamide in DOA and DOA+ patients."
    explanation: Registration record establishing the trial's objective and population. Graded OTHER because a registration is a protocol document, not study evidence.

- name: NCT06970106
  phase: PHASE_I
  status: RECRUITING
  description: >-
    Phase 1b open-label, randomized single- and repeat-dose study of
    intravitreally administered PYC-001 in participants with confirmed
    OPA1-mutation-associated DOA, enrolling roughly 18 participants across
    Australia, New Zealand and other APAC countries. Recorded as PHASE_I
    because the registration describes it as phase 1b. No treatments entry is
    created for PYC-001: the registration gives the route and dose schedule but
    not the molecular mechanism, and asserting a therapeutic_modality would
    mean supplying the drug class from memory.
  evidence:
  - reference: clinicaltrials:NCT06970106
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This study aims to gather safety data and determine the optimal dosing regimen for PYC-001 in participants with confirmed OPA1 mutation-associated ADOA."
    explanation: Registration record establishing the trial's objective and population. Graded OTHER because a registration is a protocol document, not study evidence.

differential_diagnoses:
- name: Autosomal Dominant Optic Atrophy Plus
  description: >-
    The syndromic form of the same gene's disease, curated separately at
    MONDO:0014720. It shares the optic neuropathy but adds sensorineural
    deafness, chronic progressive external ophthalmoplegia, myopathy, ataxia
    and peripheral neuropathy, and is enriched for dominant-negative missense
    alleles in the GTPase domain with secondary multiple mtDNA deletions and
    COX-negative muscle fibres. The boundary is clinical rather than genetic and
    is not sharp: extra-ocular features affect up to about 20% of OPA1 carriers,
    and subclinical auditory neuropathy is detectable in carriers who are
    otherwise non-syndromic.
- name: Leber Hereditary Optic Neuropathy
  description: >-
    The other common mitochondrial optic neuropathy, and the most important
    differential. It shares the papillomacular small-fibre topography and the
    final common pathway of retinal ganglion cell loss, but is maternally
    inherited through mtDNA complex I subunit variants, and is subacute and
    sequentially bilateral rather than insidious and congenital-to-infantile in
    onset. The two are genetically distinct: screening 28 LHON patients who were
    negative for the three primary mtDNA variants found no OPA1 mutations.
- name: ACO2-related dominant optic atrophy
  description: >-
    Heterozygous variants in ACO2, encoding mitochondrial aconitase, are
    reported as one of the most frequent causes of dominant optic atrophy, so
    this is a first-tier alternative rather than a rarity once OPA1 is excluded.
    It keeps the disease inside mitochondrial metabolism but moves the lesion
    from inner-membrane dynamics to the tricarboxylic acid cycle, which is a
    different mechanism reaching the same retinal ganglion cell population. The
    relative frequency of ACO2 and OPA1 is not settled here — the source is a
    2026 retrospective series assembled from 13 referral centres, and referral
    series overstate what their centres test for.
  evidence:
  - reference: PMID:41954904
    reference_title: Clinical and Genetic Spectrum of ACO2-Linked Dominant Optic Atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aconitase 2 (ACO2) gene variants are one of the most frequent causes of dominant optic atrophy (DOA)."
    explanation: Source for ACO2 as a frequent alternative cause of dominant optic atrophy, justifying its place in this differential.

- name: OPA3-related dominant optic atrophy with cataract
  description: >-
    Heterozygous OPA3 variants cause bilateral optic atrophy with premature
    cataract, a more benign picture than the autosomal recessive OPA3 disease
    (3-methylglutaconic aciduria type III, Costeff syndrome). OPA3 is a
    reasonable second-tier test but is rare — no OPA3 mutations were found in
    either a 76-proband population cohort or, beyond three families, in a
    980-patient screen.

discussions:
- discussion_id: rgc_selectivity_of_a_ubiquitous_gene
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does halving the dose of OPA1 — a gene expressed ubiquitously, and
    expressed highly in brain and auditory neurons — produce a disease that is
    essentially confined to retinal ganglion cells, and within that population
    to the smallest-calibre papillomacular fibres?
  attaches_to:
  - pathophysiology#Energetic Vulnerability of the Unmyelinated Prelaminar Axon
  - pathophysiology#Selective Loss of Small-Calibre Papillomacular Bundle Fibres
  rationale: >-
    The leading explanation is curated here as mechanism rather than omitted:
    the unmyelinated prelaminar axon segment has a high per-unit-length
    conduction cost, mitochondria are distributed asymmetrically across the
    lamina cribrosa accordingly, and the earliest mitochondrial changes in
    pre-symptomatic Opa1+/- mice are found in exactly that segment. But the
    argument is not closed, and the gap is specific rather than a general plea
    for more research. First, the explanation is an energy-budget argument about
    a segment of axon, whereas the clinical selectivity is a claim about a fibre
    subpopulation — nothing yet connects smallest calibre to earliest failure
    quantitatively. Second, the same reasoning ought to predict disease in other
    high-demand unmyelinated neural compartments, and does not obviously do so.
    Third, the argument cannot be the whole story, because the identical
    anatomical substrate is shared with Leber hereditary optic neuropathy, which
    has a completely different natural history (subacute, sequentially
    bilateral, partial spontaneous recovery) from the same fibre population.
    Fourth, it does not explain the reduced penetrance: an anatomical
    vulnerability that every carrier shares cannot by itself account for 43-62%
    penetrance within a single family carrying one allele. A review of the human
    iPSC-RGC work states the gap plainly.
  evidence:
  - reference: PMID:35652445
    reference_title: Modelling autosomal dominant optic atrophy associated with OPA1 variants in iPSC-derived retinal ganglion cells.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the specific sensitivity of RGCs to OPA1 mutations, especially given the high levels of gene expression within other neuronal tissues, such as the brain and auditory neurons (10), remains unclear"
    explanation: States that the retinal ganglion cell selectivity of OPA1 disease is unexplained despite high expression elsewhere, which is the gap recorded here. Evidence source is OTHER because this is an expert statement of what the field does not know rather than data.
  - reference: PMID:35652445
    reference_title: Modelling autosomal dominant optic atrophy associated with OPA1 variants in iPSC-derived retinal ganglion cells.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the disease mechanisms driving RGC degeneration are poorly understood"
    explanation: Independent statement in the same source that the mechanism of retinal ganglion cell degeneration is not settled. Evidence source is OTHER because this is an expert statement about the state of knowledge rather than data.
  - reference: PMID:39659974
    reference_title: Opa1 and MT-Nd6 mutations induce early mitochondrial changes in the retina and prelaminar optic nerve of hereditary optic neuropathy mouse models.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Identifying the susceptibility of RGCs to such mutations in Opa1 or mitochondrial DNA is therefore essential to a fundamental understanding of these diseases."
    explanation: The authors of the leading mechanistic study frame retinal ganglion cell susceptibility as still requiring explanation.
  - reference: PMID:21112411
    reference_title: Mitochondrial optic neuropathies - disease mechanisms and therapeutic strategies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the trigger for RGC loss is much more complex than a simple bioenergetic crisis and other important disease mechanisms have emerged relating to mitochondrial network dynamics, mtDNA maintenance, axonal transport, and the involvement of the cytoskeleton in maintaining a differential mitochondrial gradient at sites such as the lamina cribosa"
    explanation: >-
      States directly that an energy-budget account is insufficient, and names
      the additional mechanisms in play. This is the clearest statement located
      that the selectivity question is open rather than answered by the
      prelaminar-energetics argument alone. Evidence source is OTHER because it
      is a review. Quoted verbatim including the source's spelling of "cribosa".
  - reference: PMID:18783614
    reference_title: Mitochondrial oxidative phosphorylation in autosomal dominant optic atrophy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "While OPA1 is critical for optic nerve function, the mechanism by which OPA1 mutations lead to blindness is unknown"
    explanation: Independent statement that the mechanism linking OPA1 loss to the optic neuropathy is unknown.
  notes: >-
    Not tagged HUMAN_MODEL_MISMATCH. The distinction matters: the mouse data do
    not conflict with the human disease, they simply do not reach the level of
    the claim. The open question is the mechanism itself, not the translational
    validity of a model that addresses it.

- discussion_id: reduced_penetrance_modifiers
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What determines whether a heterozygous OPA1 null allele carrier develops
    optic atrophy at all, given family-level penetrance as low as 43%?
  attaches_to:
  - inheritance#Autosomal dominant
  - pathophysiology#OPA1 Haploinsufficiency
  rationale: >-
    Penetrance recalculated within two families carrying the recurrent
    c.2708_2711delTTAG allele was 43% and 62%, against a previously reported
    98%. Because the allele is identical within each family, allele identity
    cannot explain the difference, and the original authors argued that if
    haploinsufficiency is the mechanism then reduced penetrance should not be
    allele-specific at all. The corollary is that something other than the OPA1
    genotype sets the threshold — a modifier locus, mtDNA background, or an
    environmental or stochastic contribution to the bioenergetic margin — and
    this entry records no candidate because none was sourced. The practical
    consequence is already visible in ascertainment: OPA1 variants were found in
    40% of apparently sporadic optic atrophy cases in a large referral series,
    so unaffected transmitting carriers are common.
  evidence:
  - reference: PMID:11440989
    reference_title: "Spectrum, frequency and penetrance of OPA1 mutations in dominant optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation screening in this study also identified a number of asymptomatic individuals with OPA1 mutations."
    explanation: Documents asymptomatic carriers, the observation that defines this gap.
  - reference: PMID:19319978
    reference_title: Molecular screening of 980 cases of suspected hereditary optic neuropathy with a report on 77 novel OPA1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OPA1 mutations were found in 157 (40%) of the 392 apparently sporadic cases of optic atrophy"
    explanation: Shows the ascertainment consequence of reduced penetrance — a large share of OPA1 disease presents without a family history.
  - reference: PMID:16617242
    reference_title: OPA1 mutations and mitochondrial DNA haplotypes in autosomal dominant optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggest that mtDNA genetic background may influence disease expression in a subset of cases"
    explanation: >-
      The one sourced candidate modifier: the authors' conclusion that the
      inherited mtDNA background may modify expression. See this gap's notes for
      why the study's headline haplogroup result does not itself support an
      OPA1-penetrance modifier.
  notes: >-
    One lead was checked and downgraded rather than adopted. A deep-research
    report offered mitochondrial haplogroup J as a penetrance modifier in this
    disease, citing PMID:16617242. Reading the source, the three-fold
    over-representation of haplogroup J is reported in OPA1-NEGATIVE patients,
    so it is evidence about the genetic architecture of OPA1-negative dominant
    optic atrophy and not about whether an OPA1 carrier manifests. The same
    paper's broader conclusion — that mtDNA background may influence expression
    in a subset of cases — is what is cited above, and it is a suggestion in a
    29-patient haplotype comparison, not a demonstrated modifier effect. No
    cybrid or segregation experiment establishing causality was located.

- discussion_id: developmental_versus_degenerative_rgc_loss
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How much of the retinal ganglion cell deficit in classic autosomal dominant
    optic atrophy is a developmental failure that has already happened by the
    time vision is first measured, and how much is ongoing degeneration that a
    therapy started in adulthood could still prevent?
  attaches_to:
  - pathophysiology#Retinal Ganglion Cell Degeneration and Optic Nerve Atrophy
  - pathophysiology#Selective Loss of Small-Calibre Papillomacular Bundle Fibres
  - clinical_trials#NCT06970106
  rationale: >-
    The entry models the disease as degeneration, because that is how the
    phenotype reads — insidious loss from the first decade, slow progression over
    decades. But OPA1 is required for mitochondrial fusion and cristae
    organization during development too, and a recent review states that the
    disease also involves a developmental component and draws the therapeutic
    consequence explicitly. The two accounts predict the same cross-sectional
    picture and different things about treatment: if a substantial share of the
    deficit is developmental, a therapy that restores OPA1 dosage in an adult
    retina cannot recover it, and the trials now recruiting — NCT06970106 doses
    adults intravitreally — would be testing prevention of future loss in
    patients who have already sustained most of theirs. Nothing located here
    partitions the deficit between the two. The experiment implied is
    conditional or inducible Opa1 knockdown at defined postnatal ages, which
    would separate a developmental from an adult-onset contribution; in humans
    the nearest approach is longitudinal structural imaging from the earliest
    age at which it can be obtained, and the same review notes early diagnosis
    is itself difficult.
  evidence:
  - reference: PMID:42101483
    reference_title: "Targeting the OPA1 pathway in Autosomal Dominant Optic Atrophy (ADOA): 25 years from gene discovery to therapeutic strategy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ADOA also involves a developmental component consistent with OPA1's essential role in mitochondrial fusion, cristae organization, and quality control."
    explanation: States the developmental contribution that this gap asks to be quantified. Evidence source is OTHER because this is a review.
  - reference: PMID:42101483
    reference_title: "Targeting the OPA1 pathway in Autosomal Dominant Optic Atrophy (ADOA): 25 years from gene discovery to therapeutic strategy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "developmental RGC loss may limit therapeutic efficacy of late-stage interventions-a challenge compounded by the difficulty of early diagnosis"
    explanation: >-
      States the therapeutic consequence that makes this gap consequential rather
      than academic. Evidence source is OTHER because this is a review, and note
      the author's own hedge — "may limit" — which is why this is a gap and not
      a curated mechanism. Quoted verbatim including the source's hyphen where a
      dash was intended.
  notes: >-
    Tagged KNOWLEDGE_GAP rather than HUMAN_MODEL_MISMATCH. The reviewer offered
    either. HUMAN_MODEL_MISMATCH would fit if a model system showed something
    whose translation to human biology were the open question, but here the open
    question is the timing of the deficit in the human disease itself, and no
    model result is in conflict with a human observation — the relevant human
    observation has not been made. The distinction CLAUDE.md draws is that
    KNOWLEDGE_GAP means the evidence is absent, which is the case.

- discussion_id: oma1_stress_processing_switch_untested_in_doa
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does stress-activated OMA1 cleavage of long OPA1 act as the amplifier that
    converts a tolerable 50% OPA1 dosage reduction into retinal ganglion cell
    loss, and does it explain why the same allele manifests in one carrier and
    not another?
  attaches_to:
  - pathophysiology#Impaired Mitochondrial Inner-Membrane Fusion
  - pathophysiology#OPA1 Haploinsufficiency
  rationale: >-
    Long OPA1 is constitutively cleaved by YME1L and OMA1 at two sites, and the
    balanced accumulation of long and short forms maintains fusion; under
    mitochondrial stress OMA1 converts OPA1 entirely to short isoforms,
    inhibiting fusion and triggering fragmentation. That is a switch, and a
    switch is the kind of thing that could turn a graded dosage deficit into a
    threshold event — which is what reduced penetrance and the decades-long
    latency of this disease both look like. It is recorded as a gap rather than
    as a pathophysiology node because nothing located here tests it in OPA1
    haploinsufficient retinal ganglion cells, in patient tissue, or in an ADOA
    model: the supporting work is mouse embryonic fibroblast genetics on
    OPA1 processing generally, and it is unconnected to the disease. The
    experiment implied is OMA1 loss or inhibition in an Opa1+/- retina. Note the
    same source complicates the picture, since deleting Oma1 restored
    tubulation, cristae morphogenesis and apoptotic resistance in YME1L-null
    cells and long OPA1 alone sufficed for fusion — so processing is not
    required for fusion, and the switch is about quality control rather than
    about fusion capacity per se.
  evidence:
  - reference: PMID:24616225
    reference_title: The i-AAA protease YME1L and OMA1 cleave OPA1 to balance mitochondrial fusion and fission.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Stress-induced OPA1 processing by OMA1 converts OPA1 completely into short isoforms, inhibits fusion, and triggers mitochondrial fragmentation."
    explanation: Describes the stress-gated proteolytic switch that this gap asks about.
  - reference: PMID:24616225
    reference_title: The i-AAA protease YME1L and OMA1 cleave OPA1 to balance mitochondrial fusion and fission.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "deletion of Oma1 restored mitochondrial tubulation, cristae morphogenesis, and apoptotic resistance in cells lacking YME1L"
    explanation: >-
      The experimental result showing that removing OMA1 rescues cristae and
      apoptotic phenotypes, which is what makes OMA1 a candidate target — and
      also what shows the switch is not simply a fusion-capacity mechanism.
  notes: >-
    Sourced from a deep-research report lead and checked against the primary
    paper before recording. No claim is made that this mechanism operates in
    autosomal dominant optic atrophy; the gap exists because it has not been
    asked.


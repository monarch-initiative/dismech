- name: Impaired Mitochondrial DNA Maintenance
  biological_scale: MOLECULAR
  description: OPA1 perturbation can affect mitochondrial genome maintenance, but the findings depend on tissue and assay. Exon-4b isoform silencing reduced mtDNA replication and copy number in an experimental system. In patient-derived classic delTTAG and DOA-plus R445H iPSC-RGCs, qPCR showed a reduced wild-type mtDNA fraction, compatible with minor deletions or mutations within the amplified region; long-range PCR found no large rearrangements and total copy number was unchanged. The engineered heterozygous-null line did not show a significant wild-type-fraction reduction. Muscle biopsies showed multiple mtDNA deletions in both isolated DOA and DOA-plus, without depletion. Muscle findings do not establish the mechanism in retinal ganglion cells.

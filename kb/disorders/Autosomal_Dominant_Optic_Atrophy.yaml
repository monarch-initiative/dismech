name: Autosomal Dominant Optic Atrophy
creation_date: "2026-09-10T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: autosomal dominant optic atrophy, classic form
  term:
    id: MONDO:0008134
    label: autosomal dominant optic atrophy, classic form
synonyms:
- Kjer optic atrophy
- Kjer-type optic atrophy
- optic atrophy type 1
- OPA1
- autosomal dominant optic atrophy, Kjer type
- juvenile optic atrophy
description: >
  Classic (non-syndromic) autosomal dominant optic atrophy — Kjer optic atrophy,
  optic atrophy type 1 — is the commonest inherited optic neuropathy. In the
  majority of genetically solved cases it is caused by a heterozygous
  loss-of-function variant in OPA1, which encodes a dynamin-related GTPase
  anchored to the mitochondrial inner membrane. Insidious, bilateral, broadly
  symmetric visual loss begins in the first decade, with temporal or diffuse
  optic disc pallor, a centrocecal or central scotoma, and an acquired
  blue-yellow (tritan) colour vision defect. Penetrance is incomplete and
  expressivity varies markedly within and between families.

  The entry is deliberately restricted to the non-syndromic phenotype. OPA1
  is a multifunctional protein, and the mechanism is curated as four separable
  consequences of reduced OPA1 dosage — failure of inner-membrane fusion,
  disorganization of cristae, impaired maintenance of the mitochondrial genome,
  and loss of cytochrome c sequestration — which converge on an oxidative
  phosphorylation deficit. The selectivity of the disease is modelled as a
  property of the target tissue rather than of the lesion: retinal ganglion
  cell axons are unmyelinated between the cell body and the lamina cribrosa,
  carry a correspondingly high energy cost, and the smallest-calibre fibres of
  the papillomacular bundle fail first. Why a ubiquitously expressed gene
  produces an essentially eye-restricted disease is not settled, and is
  recorded as a knowledge gap rather than asserted.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0020250
      label: autosomal dominant optic atrophy
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >
      MONDO:0020250 is the MONDO parent grouping of this entry's anchor
      MONDO:0008134 and also subsumes the syndromic DOA plus concepts curated in
      Autosomal_Dominant_Optic_Atrophy_Plus. broadMatch, not exactMatch: the
      parent is a union of the classic and the syndromic forms, so it must not
      retire either concept from the curation queue.

notes: >-
  Lump/split decision: curated as a separate Disease entry from
  Autosomal_Dominant_Optic_Atrophy_Plus (MONDO:0014720) rather than as a
  has_subtypes entry on it. The deciding observation is that the two forms
  differ on the genotype axis and not only in the number of organs involved:
  the classic non-syndromic form is predominantly OPA1 haploinsufficiency from
  null alleles (premature termination codons, frameshifts, splice defects,
  whole-gene deletions), whereas the syndromic form is enriched for missense
  alleles in the GTPase domain acting by a dominant-negative mechanism. That
  claim was checked against primary sources rather than assumed: Toomes 2001
  (PMID:11440989) found the mutation spectrum in classic DOA to be
  "predominantly null mutations generating truncated proteins"; Yu-Wai-Man 2010
  (PMID:20157015) quantified the skew in the other direction, with missense
  alleles carrying OR 3.06 and GTPase-region alleles OR 2.29 for the
  multi-system phenotype; and Sladen 2022 (PMID:35652445) states the two halves
  together. The corollary modelled here is mechanistic, not just clinical — a
  dominant-negative allele poisons the OPA1 oligomer and destabilizes the
  mitochondrial genome, which is why secondary multiple mtDNA deletions and
  COX-negative muscle fibres are a DOA-plus finding rather than a classic-form
  one, and why this entry's mtDNA node is about copy number and replication
  rather than about deletion burden.

  The split is not clean at the edges and should not be read as one. Both forms
  arise in OPA1, the allele classes overlap rather than partition, a single
  missense allele can segregate with classic DOA in one family and with plus
  features in another, and subclinical auditory neuropathy is detectable in
  carriers who are clinically non-syndromic. Sensorineural hearing loss is
  therefore deliberately NOT curated as a phenotype here even though the
  retired GeneReviews chapter lists subclinical auditory neuropathy under optic
  atrophy type 1; it is modelled on the DOA-plus entry, and the boundary is
  recorded in differential_diagnoses instead.

  Omissions recorded deliberately. (1) No biochemical: block — plasma
  nicotinamide is reported as relatively deficient in DOA, but the only source
  found for it in this session is the rationale text of a trial registration
  (NCT06007391), which is not a measurement report, so the claim is left to the
  clinical_trials entry that carries it. (2) No datasets: block — no
  disease-relevant accession was triaged in this session, and an untriaged
  accession that merely resolves is the Named Entity Confusion failure mode
  CLAUDE.md warns about. (3) No environmental: block, but the avoidance advice
  IS curated — as a treatment. This was revised in review round 1 and the
  distinction is deliberate. The source files smoking, excessive alcohol and
  mitochondria-toxic antibiotics and antivirals under management, and
  "clinicians advise avoiding X" is a management action, not the causal claim
  "X causes retinal ganglion cell loss in this disease". The first is recorded
  in the Avoidance of Mitochondrial Toxins treatment, quoting the source's own
  sentence; the second is still declined, because no source quantifying an
  exposure effect in OPA1-related optic atrophy was located and a retired
  chapter is weak ground for a causal edge. So the content is present and only
  the causal assertion is withheld. (4) No histopathology: block — human optic nerve histology in
  Kjer disease is old and was not obtained in full text here. (5) PYC-001 is
  curated only as a clinical trial, not as a treatment with a
  therapeutic_modality: the registration record describes intravitreal dosing
  but does not state the molecular mechanism, and the oligonucleotide class
  would have had to be supplied from memory.

  On the retired GeneReviews citation. PMID:20301426 (Optic Atrophy Type 1) has
  been retired and its archival version carries an explicit warning that the
  information may be out of date. It is cited here for the stable clinical and
  care-pathway description of the classic phenotype — onset age, field defect,
  colour defect, electrophysiology, disc appearance, the diagnostic basis,
  low-vision management, the annual surveillance schedule, the agents carriers
  are advised to avoid, and the 50% per-child transmission risk with the
  counselling consequences of reduced penetrance — none of which is the kind of
  claim a chapter revision would be expected to overturn. Review round 1 asked
  for the Diagnosis, Management and Genetic Counseling sections of the abstract
  to be mined as well as Clinical Characteristics, on the reasoning that every
  section present in the abstract should carry backing evidence; that was done,
  and the retirement caveat applies equally to all of it. Every mechanistic,
  epidemiological and genotype-phenotype claim in this entry is cited to
  primary literature instead. A curator who finds a current review covering the
  same clinical ground should move those citations to it.

prevalence:
- population: North of England
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 2.87
  rate_low: 2.54
  rate_high: 3.20
  rate_denominator: POPULATION
  notes: >-
    Population-based ascertainment of clinically diagnosed DOA; the authors
    express the same figure as at least 1 in 35,000 of the general population.
    Restricting to molecularly confirmed OPA1-positive cases lowers it to 2.09
    per 100,000 (95% CI 1.95-2.23), so this record is the clinical-diagnosis
    denominator and is an explicit minimum.
  evidence:
  - reference: PMID:20417570
    reference_title: The prevalence and natural history of dominant optic atrophy due to OPA1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The minimum point prevalence of DOA in the north of England was 2.87 per 100,000 (95% confidence interval [CI], 2.54-3.20)"
    explanation: Reports the population-based minimum point prevalence curated in this record.
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 4.0
  rate_denominator: POPULATION
  notes: >-
    Estimated minimum prevalence of 1 in 25,000 quoted in a 2022 review;
    normalized as 100000/25000 = 4.0 per 100,000. Note this is a review's
    summary figure rather than a fresh ascertainment, and it disagrees with the
    older 1 in 50,000 figure given when OPA1 was identified (PMID:11017079) and
    with the 1 in 20,000 quoted elsewhere — the spread reflects ascertainment,
    not a change in the disease.
  evidence:
  - reference: PMID:35652445
    reference_title: Modelling autosomal dominant optic atrophy associated with OPA1 variants in iPSC-derived retinal ganglion cells.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Autosomal dominant optic atrophy (DOA) is the most common ION, with an estimated minimum prevalence of 1 in 25 000"
    explanation: Source for the 1 in 25,000 minimum-prevalence figure normalized in this record. Evidence source is OTHER because the sentence is background prose in the paper's introduction restating a consensus figure rather than a measurement this paper made.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  penetrance_percentage: "43"
  expressivity: VARIABLE
  description: >-
    Heterozygous OPA1 variants are transmitted in an autosomal dominant manner
    with incomplete penetrance. Penetrance recalculated within families
    segregating the recurrent c.2708_2711delTTAG allele was as low as 43% and
    62%, far below the ~98% previously reported, and the authors argue that if
    haploinsufficiency is the mechanism then reduced penetrance should not be
    allele-specific. The penetrance_percentage slot records the lower of the two
    family-level figures; it is a single-study family estimate, not a
    population penetrance.
  evidence:
  - reference: PMID:11440989
    reference_title: "Spectrum, frequency and penetrance of OPA1 mutations in dominant optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A re-calculation of the penetrance of this disorder within two of our families indicates figures as low as 43 and 62% associated with the 2708del(TTAG) mutation."
    explanation: Source for the reduced-penetrance figures recorded here.
  - reference: PMID:11440989
    reference_title: "Spectrum, frequency and penetrance of OPA1 mutations in dominant optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If haploinsufficiency is the mechanism underlying DOA it is unlikely that this figure will be mutation-specific, indicating that the penetrance in DOA is much lower than the 98% reported previously."
    explanation: Supports treating reduced penetrance as a general property of the haploinsufficiency mechanism rather than of one allele.
  - reference: PMID:20301426
    reference_title: "Optic Atrophy Type 1 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of an individual with OPA1 \nhas a 50% chance of inheriting the pathogenic variant."
    explanation: Source for the 50% per-child transmission risk that the Genetic Counseling treatment entry states.
  - reference: PMID:20301426
    reference_title: "Optic Atrophy Type 1 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most \nindividuals diagnosed with OPA1 have an affected parent; however, de novo \npathogenic variants have been reported."
    explanation: Establishes that transmission is usually from an affected parent while de novo variants occur, which is why no de_novo_rate is recorded — the source gives no figure.

pathophysiology:
- name: OPA1 Haploinsufficiency
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A heterozygous OPA1 null allele — premature termination codon, frameshift,
    splice-site defect, or large-scale rearrangement — halves the dose of
    functional OPA1 protein. This, rather than a poisoned oligomer, is the
    predominant mechanism of the classic non-syndromic form: the mutation
    spectrum is weighted towards truncating alleles, and a mouse carrying the
    recurrent human c.2708_2711delTTAG allele shows a greater than 40% reduction
    in Opa1 mRNA, which the authors read as supporting haploinsufficiency.
    Missense alleles in the GTPase domain, which act dominant-negatively, are
    instead enriched in the syndromic DOA plus form curated separately.
  gene:
    preferred_term: OPA1
    term:
      id: hgnc:8140
      label: OPA1
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous germline loss-of-function OPA1 alleles. Null alleles
      (nonsense, frameshift, splice, whole-gene deletion) predominate in the
      classic form.
  evidence:
  - reference: PMID:11440989
    reference_title: "Spectrum, frequency and penetrance of OPA1 mutations in dominant optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These are predominantly null mutations generating truncated proteins, strongly suggesting that the mechanism underlying DOA is haploinsufficiency."
    explanation: Establishes haploinsufficiency from null alleles as the mechanism of the classic form, the basis of this node.
  - reference: PMID:35652445
    reference_title: Modelling autosomal dominant optic atrophy associated with OPA1 variants in iPSC-derived retinal ganglion cells.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The majority of variants are thought to generate null alleles, causing premature termination codons (PTC) or loss of function variants that result in haploinsufficiency"
    explanation: Independently states that most OPA1 variants are null alleles producing haploinsufficiency. Evidence source is OTHER because the sentence summarizes the field in this paper's introduction rather than reporting its own result.
  - reference: PMID:38334784
    reference_title: The human OPA1(delTTAG) mutation induces adult onset and progressive auditory neuropathy in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Molecular assessment of cochlea demonstrated a reduction of Opa1 mRNA level by greater than 40%, supporting haploinsufficiency as the disease mechanism."
    explanation: Measures the reduction in Opa1 transcript in a knock-in mouse carrying the recurrent human delTTAG allele, corroborating the dosage mechanism (model-organism support, not the sole basis for the human claim).
  - reference: PMID:27860320
    reference_title: OPA1 analysis in an international series of probands with bilateral optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "76% of pathogenic mutations observed in 30 (71%) of 42 probands were evaluated to lead to unstable transcripts resulting in haploinsufficiency."
    explanation: Quantifies the haploinsufficiency share of pathogenic OPA1 alleles in an international bilateral-optic-atrophy cohort, putting a number on the qualitative "predominantly null" claim above.
  - reference: PMID:16617242
    reference_title: OPA1 mutations and mitochondrial DNA haplotypes in autosomal dominant optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our results support haploinsufficiency as a genetic mechanism in OPA1-positive cases"
    explanation: A third independent cohort concluding in favour of haploinsufficiency in OPA1-positive autosomal dominant optic atrophy.
  downstream:
  - target: Impaired Mitochondrial Inner-Membrane Fusion
    description: >-
      Reduced OPA1 dosage directly lowers the amount of the inner-membrane
      profusion dynamin available to drive fusion.
    causal_link_type: DIRECT
  - target: Cristae Disorganization
    description: >-
      OPA1 homo-oligomers structure the cristae; loss of half the protein
      disorganizes that architecture.
    causal_link_type: DIRECT
  - target: Impaired Mitochondrial DNA Maintenance
    description: >-
      The exon 4b-containing OPA1 isoforms tether mtDNA nucleoids to the inner
      membrane and promote replication, so reduced OPA1 impairs mtDNA copy
      number and distribution.
    causal_link_type: DIRECT
  - target: Loss of Cytochrome c Sequestration
    description: >-
      OPA1 oligomers hold cristae junctions tight and retain cytochrome c;
      reduced OPA1 lowers the threshold for its release.
    causal_link_type: DIRECT

- name: Impaired Mitochondrial Inner-Membrane Fusion
  biological_scale: CELLULAR
  description: >-
    OPA1 is a profusion dynamin-related protein of the mitochondrial inner
    membrane. Lowering it fragments the mitochondrial network and dissipates
    the inner-membrane potential. This is the canonical OPA1 function, and it
    is separable from the cristae-remodelling function below — genetic and
    molecular dissection places the two in distinct arms.
  cell_types:
  - preferred_term: Retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  biological_processes:
  - preferred_term: Mitochondrial fusion
    term:
      id: GO:0008053
      label: mitochondrial fusion
    modifier: DECREASED
  - preferred_term: Inner mitochondrial membrane organization
    term:
      id: GO:0007007
      label: inner mitochondrial membrane organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:12509422
    reference_title: "Loss of OPA1 perturbates the mitochondrial inner membrane structure and integrity, leading to cytochrome c release and apoptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "down-regulation of OPA1 in HeLa cells using specific small interfering RNA (siRNA) leads to fragmentation of the mitochondrial network concomitantly to the dissipation of the mitochondrial membrane potential"
    explanation: Shows directly that reducing OPA1 fragments the mitochondrial network and collapses the membrane potential.
  - reference: PMID:16839885
    reference_title: OPA1 controls apoptotic cristae remodeling independently from mitochondrial fusion.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Optic Atrophy 1 (OPA1), a profusion dynamin-related protein of the inner mitochondrial membrane mutated in dominant optic atrophy"
    explanation: Identifies OPA1 as the inner-membrane profusion dynamin whose reduction this node describes.
  downstream:
  - target: Oxidative Phosphorylation Deficiency
    description: >-
      Network fragmentation and loss of inner-membrane potential impair
      oxidative phosphorylation and ATP synthesis.
    causal_link_type: DIRECT

- name: Cristae Disorganization
  biological_scale: CELLULAR
  description: >-
    OPA1 is a major organizer of the mitochondrial inner membrane; cristae
    integrity depends on it. Reducing OPA1 drastically disorganizes the
    cristae. Critically, this function is genetically and molecularly distinct
    from fusion — OPA1 keeps cristae junctions tight through oligomers of its
    soluble intermembrane-space and integral inner-membrane forms, and does so
    independently of its profusion activity. Curating it as its own node rather
    than folding it into the fusion node is the point: a cristae defect alone is
    sufficient to compromise respiratory-complex organization and cytochrome c
    retention.
  biological_processes:
  - preferred_term: Cristae formation
    term:
      id: GO:0042407
      label: cristae formation
    modifier: DECREASED
  evidence:
  - reference: PMID:12509422
    reference_title: "Loss of OPA1 perturbates the mitochondrial inner membrane structure and integrity, leading to cytochrome c release and apoptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "OPA1 is a major organizer of the mitochondrial inner membrane from which the maintenance of the cristae integrity depends"
    explanation: Establishes cristae integrity as dependent on OPA1, the claim of this node.
  - reference: PMID:16839885
    reference_title: OPA1 controls apoptotic cristae remodeling independently from mitochondrial fusion.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, OPA1 has genetically and molecularly distinct functions in mitochondrial fusion and in cristae remodeling during apoptosis."
    explanation: The source of the separability claim that justifies modelling cristae remodelling as a node distinct from fusion.
  downstream:
  - target: Oxidative Phosphorylation Deficiency
    description: >-
      Deranged cristae architecture destabilizes respiratory-chain complex
      organization and lowers oxidative phosphorylation efficiency.
    causal_link_type: DIRECT
  - target: Loss of Cytochrome c Sequestration
    description: >-
      Widening of cristae junctions releases the cytochrome c pool held within
      the cristae lumen.
    causal_link_type: DIRECT

- name: Impaired Mitochondrial DNA Maintenance
  biological_scale: MOLECULAR
  description: >-
    OPA1 is a direct actor in maintenance of the mitochondrial genome, not only
    a shaper of membranes. Silencing the OPA1 variants that include the
    alternately spliced exon 4b depletes mtDNA by inhibiting replication and
    disorganizes the distribution of nucleoids through the network; a small
    hydrophobic peptide cleaved from the exon 4b isoform is embedded in the
    inner membrane and co-immunoprecipitates with nucleoid components. The
    consequence in classic DOA is reduced mtDNA copy number and mislocalized
    nucleoids — which is a different claim from the secondary multiple mtDNA
    deletions and COX-negative muscle fibres that characterize DOA plus, where
    a dominant-negative allele destabilizes the genome more severely.
  biological_processes:
  - preferred_term: Mitochondrial DNA replication
    term:
      id: GO:0006264
      label: mitochondrial DNA replication
    modifier: DECREASED
  - preferred_term: Mitochondrial DNA maintenance
    term:
      id: GO:0032042
      label: mitochondrial DNA metabolic process
    modifier: ABNORMAL
  evidence:
  - reference: PMID:20974897
    reference_title: OPA1 links human mitochondrial genome maintenance to mtDNA replication and distribution.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "silencing of the OPA1 variants including exon 4b leads to mtDNA depletion, secondary to inhibition of mtDNA replication, and to marked alteration of mtDNA distribution in nucleoid and nucleoid distribution throughout the mitochondrial network"
    explanation: Directly demonstrates the mtDNA replication and nucleoid-distribution defect that defines this node.
  - reference: PMID:20974897
    reference_title: OPA1 links human mitochondrial genome maintenance to mtDNA replication and distribution.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "this study places OPA1 as a direct actor in the maintenance of mitochondrial genome integrity"
    explanation: Supports treating mtDNA maintenance as a function of OPA1 in its own right rather than a downstream consequence of the fusion defect.
  - reference: PMID:35652445
    reference_title: Modelling autosomal dominant optic atrophy associated with OPA1 variants in iPSC-derived retinal ganglion cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "OPA1+/- and OPA1 variant iPSC-RGCs exhibited impaired mitochondrial homeostasis, with reduced bioenergetic output and compromised mitochondrial DNA maintenance."
    explanation: Shows the mtDNA-maintenance defect in the disease-relevant cell type, human iPSC-derived retinal ganglion cells carrying OPA1 null and patient alleles.
  downstream:
  - target: Oxidative Phosphorylation Deficiency
    description: >-
      Reduced mtDNA copy number limits the supply of mtDNA-encoded
      respiratory-chain subunits.
    causal_link_type: DIRECT

- name: Loss of Cytochrome c Sequestration
  biological_scale: MOLECULAR
  description: >-
    OPA1 oligomers keep cristae junctions tight during apoptosis and so retain
    the intracristal cytochrome c pool. This is a protective function exerted
    independently of fusion: OPA1 does not interfere with activation of BAX and
    BAK, but the proapoptotic BH3 protein BID, which widens cristae junctions,
    disrupts OPA1 oligomers. Losing it lowers the threshold for cytochrome c
    release, and in cultured cells reducing OPA1 commits the cell to apoptosis
    with no other stimulus applied.
  biological_processes:
  - preferred_term: Release of cytochrome c from mitochondria
    term:
      id: GO:0001836
      label: release of cytochrome c from mitochondria
    modifier: INCREASED
  evidence:
  - reference: PMID:16839885
    reference_title: OPA1 controls apoptotic cristae remodeling independently from mitochondrial fusion.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "it controls the shape of mitochondrial cristae, keeping their junctions tight during apoptosis"
    explanation: Identifies the cristae-junction-tightening mechanism by which OPA1 sequesters cytochrome c.
  - reference: PMID:12509422
    reference_title: "Loss of OPA1 perturbates the mitochondrial inner membrane structure and integrity, leading to cytochrome c release and apoptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "As loss of OPA1 commits cells to apoptosis without any other stimulus, we propose that OPA1 is involved in the cytochrome c sequestration"
    explanation: Shows that OPA1 loss alone is sufficient to trigger the apoptotic program, supporting a lowered apoptotic threshold.
  downstream:
  - target: Retinal Ganglion Cell Degeneration and Optic Nerve Atrophy
    description: >-
      A lowered apoptotic threshold converts a chronic bioenergetic deficit
      into retinal ganglion cell death.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

- name: Oxidative Phosphorylation Deficiency
  biological_scale: MOLECULAR
  conforms_to: "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress"
  description: >-
    The four upstream arms converge here. Defective fusion and cristae
    derangement together yield defective oxidative phosphorylation with reduced
    ATP synthesis driven by complex I substrates, and the mtDNA defect limits
    the supply of respiratory-chain subunits. The deficit is measurable in the
    disease-relevant cell type: human iPSC-derived retinal ganglion cells
    carrying OPA1 null or patient alleles show reduced bioenergetic output.
    This node is the point of conformance with the mitochondrial_dysfunction
    module, where it plays the central-effector role that disease-specific
    mitochondrial lesions converge upon.
  biological_processes:
  - preferred_term: Oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  - preferred_term: ATP biosynthetic process
    term:
      id: GO:0006754
      label: ATP biosynthetic process
    modifier: DECREASED
  - preferred_term: Reactive oxygen species metabolism
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:32243103
    reference_title: Idebenone increases chance of stabilization/recovery of visual acuity in OPA1-dominant optic atrophy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "OPA1‐linked DOA is characterized by defective mitochondrial fusion and cristae derangement, which in turn lead to defective oxidative phosphorylation with reduced ATP synthesis driven by complex I substrates"
    explanation: >-
      States the convergence of the fusion and cristae arms on an oxidative
      phosphorylation and ATP-synthesis deficit. Evidence source is OTHER under
      the rule this entry applies throughout, which was tightened in review
      round 1. evidence_source classifies the evidence the cited publication
      presents; an introduction restating established consensus presents no
      evidence of its own, so it is graded OTHER regardless of what kind of
      study the paper is. Each paper's own results keep the grade matching its
      design, which is why PMID:35652445 and PMID:38334784 appear in this entry
      under OTHER for their background prose and under IN_VITRO and
      MODEL_ORGANISM for their experiments. This also makes the entry
      internally consistent with the review citations PMID:11850115 and
      PMID:21112411, which were already OTHER.
  - reference: PMID:35652445
    reference_title: Modelling autosomal dominant optic atrophy associated with OPA1 variants in iPSC-derived retinal ganglion cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "reduced bioenergetic output and compromised mitochondrial DNA maintenance"
    explanation: Measures reduced bioenergetic output in OPA1-null and OPA1-variant human iPSC-derived retinal ganglion cells.
  - reference: PMID:22800932
    reference_title: "Defective mitochondrial fusion, altered respiratory function, and distorted cristae structure in skin fibroblasts with heterozygous OPA1 mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Respiratory complex IV activity and subunits steady-state were decreased without alteration of the mitochondrial deoxyribonucleic acid size, amount or transcription."
    explanation: Measures a specific respiratory-chain deficit (complex IV) in primary fibroblasts from patients with heterozygous OPA1 mutations, and reports a physical OPA1-oxidative-phosphorylation interaction by reciprocal immunoprecipitation.
  - reference: PMID:18783614
    reference_title: Mitochondrial oxidative phosphorylation in autosomal dominant optic atrophy.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "We conclude that the pathophysiology of ADOA likely stems from the role of OPA1 in mitochondrial structure or fusion and not from OPA1 support of oxidative phosphorylation."
    explanation: >-
      Direct contradiction of this node, and curated as such rather than
      smoothed over. Mitochondria isolated from six ADOA patients with OPA1
      mutations showed no alteration of electron transport, and the authors
      conclude against an oxidative phosphorylation mechanism. Read alongside
      the supporting items: the measurements were made on isolated mitochondria
      from non-neuronal patient tissue with n=6, which is exactly the setting in
      which a deficit confined to an energetically marginal axon segment would
      be invisible. The honest reading is that a global respiratory block is not
      established, while a local one remains the working model.
  - reference: PMID:18783614
    reference_title: Mitochondrial oxidative phosphorylation in autosomal dominant optic atrophy.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Results suggest that the nuclear DNA mutations that give rise to ADOA in our patient population do not alter mitochondrial electron transport."
    explanation: The primary negative result itself — no measurable electron-transport defect in patient mitochondria — stated separately from the authors' interpretation of it.
  notes: >-
    The evidence on this node does not point one way, and the disagreement is
    the substantive point rather than a gap. Patient fibroblasts show reduced
    complex IV activity (PMID:22800932) and patient iPSC-derived retinal
    ganglion cells show reduced bioenergetic output (PMID:35652445), while
    isolated mitochondria from ADOA patients show unaltered electron transport
    (PMID:18783614). The reconciliation this entry adopts is positional: the
    deficit is localized to cristae architecture, apoptotic priming, and the
    energetically marginal prelaminar axon rather than being a whole-organism
    respiratory block. That reconciliation is an inference, not a measurement,
    and the conforms_to link to the mitochondrial_dysfunction module should be
    read with it in mind.
  downstream:
  - target: Energetic Vulnerability of the Unmyelinated Prelaminar Axon
    description: >-
      A ubiquitous ATP shortfall is first exposed where the per-unit-length
      energy cost of conduction is highest.
    causal_link_type: DIRECT

- name: Energetic Vulnerability of the Unmyelinated Prelaminar Axon
  biological_scale: TISSUE
  description: >-
    This node carries the selectivity argument, and it is a claim about the
    target tissue rather than about the lesion. Retinal ganglion cell axons are
    unmyelinated from the cell body until they cross the lamina cribrosa, so
    conduction there is non-saltatory and costly; after the lamina they are
    myelinated and propagate saltatorily at much lower cost. Mitochondria are
    distributed accordingly, densely in the prelaminar nerve and sparsely
    behind it. In pre-symptomatic Opa1+/- mice, mitochondrial fragmentation and
    increased mitophagy are found mainly in that unmyelinated segment, before
    any neuronal loss — identifying it as the specific point of vulnerability.
    The asymmetric myelination pattern and an associated impairment of
    mitochondrial axonal transport were proposed as the common explanation for
    this pattern across the mitochondrial optic neuropathies well before the
    mouse data.
  locations:
  - preferred_term: optic nerve
    term:
      id: UBERON:0000941
      label: cranial nerve II
  cell_types:
  - preferred_term: Retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  biological_processes:
  - preferred_term: Axonal transport of mitochondrion
    term:
      id: GO:0019896
      label: axonal transport of mitochondrion
    modifier: ABNORMAL
  evidence:
  - reference: PMID:39659974
    reference_title: Opa1 and MT-Nd6 mutations induce early mitochondrial changes in the retina and prelaminar optic nerve of hereditary optic neuropathy mouse models.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These pre-symptomatic mitochondrial changes were mainly observed in the unmyelinated portion of the retinal ganglion cell axons, where the transmission of the visual information requires high energy expenditure, constituting the specific point of vulnerability in hereditary optic neuropathies."
    explanation: Localizes the earliest mitochondrial abnormality in an Opa1+/- mouse to the unmyelinated prelaminar axon segment and names it the point of vulnerability. Model-organism evidence; the human correlate is the clinical pattern of fibre loss curated in the next node.
  - reference: PMID:39659974
    reference_title: Opa1 and MT-Nd6 mutations induce early mitochondrial changes in the retina and prelaminar optic nerve of hereditary optic neuropathy mouse models.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "since RGC axons are not myelinated in the eye, high energy expenditure is required to ensure optimal non-saltatory transduction of action potentials"
    explanation: States the anatomical and biophysical basis of the energy asymmetry this node depends on.
  - reference: PMID:11850115
    reference_title: "Optic nerve degeneration and mitochondrial dysfunction: genetic and acquired optic neuropathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Anatomical peculiarities of optic nerve axons, such as the asymmetric pattern of myelination, may have functional implications on energy dependence and distribution of mitochondrial populations in the different sections of the nerve."
    explanation: The earlier statement of the asymmetric-myelination explanation, proposed as a shared mechanism across the mitochondrial optic neuropathies. Evidence source is OTHER because it is a review.
  downstream:
  - target: Selective Loss of Small-Calibre Papillomacular Bundle Fibres
    description: >-
      Within the vulnerable prelaminar population, the fibres with the least
      favourable surface-to-volume and mitochondrial reserve fail first.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Selective Loss of Small-Calibre Papillomacular Bundle Fibres
  biological_scale: TISSUE
  description: >-
    Degeneration is not uniform across the retinal ganglion cell population.
    The smallest-calibre fibres, which make up the papillomacular bundle
    serving central vision, are affected first and most severely. That
    topography explains the clinical triad directly: temporal pallor of the
    optic disc, a central or centrocecal field defect, and early loss of
    central acuity and colour discrimination. The same pattern recurs across a
    large number of optic neuropathies of mitochondrial origin, including
    Leber hereditary optic neuropathy and the toxic and nutritional optic
    neuropathies, which is why it is modelled here as a property of the fibre
    population rather than as something specific to OPA1.
  locations:
  - preferred_term: nerve fiber layer of retina
    term:
      id: UBERON:0001793
      label: nerve fiber layer of retina
  - preferred_term: optic disc
    term:
      id: UBERON:0001783
      label: optic disc
  cell_types:
  - preferred_term: Retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  evidence:
  - reference: PMID:11850115
    reference_title: "Optic nerve degeneration and mitochondrial dysfunction: genetic and acquired optic neuropathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Selective degeneration of the smallest fibers (papillo-macular bundle) of the human optic nerve occurs in a large number of optic neuropathies characterized primarily by loss of central vision."
    explanation: Establishes the small-fibre, papillomacular topography of degeneration in the human optic nerve. Evidence source is OTHER because it is a review.
  - reference: PMID:32243103
    reference_title: Idebenone increases chance of stabilization/recovery of visual acuity in OPA1-dominant optic atrophy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the small axons of the papillomacular bundle are affected first and more severely, leading to the temporal pallor of the optic disc at fundus examination, central scotoma at visual fields and loss of central vision with a consistent drop in visual acuity"
    explanation: Connects the small-axon papillomacular topography to each of the three clinical findings this node is upstream of. Evidence source is OTHER because the statement is review-style framing rather than the cohort study's own result.
  - reference: PMID:35652445
    reference_title: Modelling autosomal dominant optic atrophy associated with OPA1 variants in iPSC-derived retinal ganglion cells.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "bilateral central scotomas and optic disc pallor caused by the loss of RGCs within the papillomacular bundle"
    explanation: Independently attributes the central scotoma and disc pallor of DOA to papillomacular bundle RGC loss. Evidence source is OTHER because this is introductory clinical background rather than a finding of the iPSC study.
  downstream:
  - target: Retinal Ganglion Cell Degeneration and Optic Nerve Atrophy
    description: >-
      Cumulative loss of the small central fibres is the substrate of the optic
      nerve atrophy.
    causal_link_type: DIRECT
  - target: Optic disc pallor
    description: >-
      Loss of the temporally entering papillomacular fibres produces temporal,
      and later diffuse, disc pallor.
    causal_link_type: DIRECT
  - target: Centrocecal scotoma
    description: >-
      The papillomacular bundle subserves the central field, so its loss
      produces a centrocecal or central scotoma.
    causal_link_type: DIRECT
  - target: Acquired blue-yellow dyschromatopsia
    description: >-
      Loss of the central fibre population degrades colour discrimination,
      classically in a blue-yellow (tritan) pattern.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormal retinal nerve fiber layer morphology
    description: >-
      Fibre loss thins the peripapillary retinal nerve fibre layer and the
      macular ganglion cell-inner plexiform layer on optical coherence
      tomography.
    causal_link_type: DIRECT

- name: Retinal Ganglion Cell Degeneration and Optic Nerve Atrophy
  biological_scale: TISSUE
  description: >-
    The end state of the mechanism: progressive, selective loss of retinal
    ganglion cells and their axons, with consequent optic nerve degeneration.
    DOA was described from the outset as a non-syndromic loss of visual acuity
    of insidious onset in early childhood caused by progressive and selective
    retinal ganglion cell loss, and that selectivity — rather than any
    systemic mitochondrial failure — is what defines the classic form.
  cell_types:
  - preferred_term: Retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  locations:
  - preferred_term: optic nerve
    term:
      id: UBERON:0000941
      label: cranial nerve II
  biological_processes:
  - preferred_term: Neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:38334784
    reference_title: The human OPA1(delTTAG) mutation induces adult onset and progressive auditory neuropathy in mice.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "DOA has been initially described as a non-syndromic moderate to severe loss of visual acuity with an insidious onset in early childhood, caused by a progressive and selective loss of retinal ganglion cells"
    explanation: States the defining clinical-pathological claim of the classic form. Evidence source is OTHER because the sentence is the paper's introductory restatement of the established clinical description rather than its own mouse experiment or an observation it made on patients.
  - reference: PMID:20417570
    reference_title: The prevalence and natural history of dominant optic atrophy due to OPA1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the primary pathological process selectively targets retinal ganglion cells (RGCs) resulting in optic nerve degeneration"
    explanation: Independently states selective retinal ganglion cell targeting with resulting optic nerve degeneration.
  downstream:
  - target: Optic atrophy
    description: Retinal ganglion cell and axonal loss is seen clinically as bilateral optic atrophy.
    causal_link_type: DIRECT
  - target: Reduced visual acuity
    description: Loss of central fibres reduces visual acuity.
    causal_link_type: DIRECT
  - target: Progressive visual loss
    description: Continued fibre loss produces slow progression of visual impairment over decades.
    causal_link_type: DIRECT
  - target: Abnormality of visual evoked potentials
    description: >-
      Loss and dysfunction of conducting retinal ganglion cell axons delays or
      abolishes the cortical visual evoked response.
    causal_link_type: DIRECT

phenotypes:
- category: Phenotypic abnormality
  name: Optic atrophy
  description: >-
    Bilateral and broadly symmetric optic nerve pallor with insidious onset,
    the obligate and usually sole feature of the classic form.
  phenotype_term:
    preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:20301426
    reference_title: "Optic Atrophy Type 1 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Optic atrophy type 1 (OPA1, or Kjer type optic atrophy) is characterized by bilateral and symmetric optic nerve pallor"
    explanation: Describes the bilateral symmetric optic nerve pallor defining the entity. Cited from a GeneReviews chapter that has since been retired; see the entry-level references note.

- category: Phenotypic abnormality
  name: Optic disc pallor
  description: >-
    Temporal or diffuse pallor of the optic disc on ophthalmoscopy, sometimes
    with disc excavation and a temporal pigmentary grey crescent. The temporal
    predominance reflects the papillomacular fibres' entry point.
  phenotype_term:
    preferred_term: Temporal optic disc pallor
    term:
      id: HP:0000543
      label: Optic disc pallor
  diagnostic: true
  evidence:
  - reference: PMID:20301426
    reference_title: "Optic Atrophy Type 1 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ophthalmoscopic \nexamination discloses temporal or diffuse pallor of the optic discs, sometimes \nassociated with optic disc excavation."
    explanation: Documents the temporal or diffuse disc pallor and associated excavation.

- category: Phenotypic abnormality
  name: Reduced visual acuity
  description: >-
    Insidious decrease in visual acuity, usually noticed between ages 4 and 6
    years. Impairment is usually moderate but spans the full range from
    insignificant to legal blindness, including within one family. Measured
    acuity in a molecularly confirmed cohort averaged 20/173 with a range from
    20/20 to hand movements.
  phenotype_term:
    preferred_term: Reduced visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
  evidence:
  - reference: PMID:20301426
    reference_title: "Optic Atrophy Type 1 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "insidious decrease in visual acuity (usually between ages 4 and \n6 years)"
    explanation: Source for the insidious onset in the first decade.
  - reference: PMID:20417570
    reference_title: The prevalence and natural history of dominant optic atrophy due to OPA1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Snellen visual acuity varied markedly between OPA1-positive cases with a mean of 20/173 (range 20/20 to hand movements)"
    explanation: Quantifies acuity and its spread in a molecularly confirmed OPA1 cohort.

- category: Phenotypic abnormality
  name: Progressive visual loss
  description: >-
    Slow progression over decades rather than a subacute event. In a
    population-based cohort, visual function worsened in 67.4% of patients
    during follow-up, at a mean rate of 0.032 logMAR per year, though some
    declined up to five times faster.
  phenotype_term:
    preferred_term: Progressive visual loss
    term:
      id: HP:0000529
      label: Progressive visual loss
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:20417570
    reference_title: The prevalence and natural history of dominant optic atrophy due to OPA1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "visual function worsened in 67.4% of patients during follow-up"
    explanation: Quantifies the proportion progressing in longitudinal follow-up.
  - reference: PMID:20417570
    reference_title: The prevalence and natural history of dominant optic atrophy due to OPA1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean rate of visual loss was 0.032 logarithm of the minimum angle of resolution per year, but some patients experienced faster visual decline (range = 0-0.171 logarithm of the minimum angle of resolution/year)"
    explanation: Gives the rate of progression and its variability.
  - reference: PMID:40329928
    reference_title: "Longitudinal Visual Biomarkers in Dominant Optic Atrophy: A Systematic Review and Meta-Analysis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "the rate of yearly visual acuity decline (0.022 LogMAR/year., 95% CI: -0.008 to 0.052) was not significantly different from zero (Z = 1.4, p = 0.155)"
    explanation: >-
      Pooling the longitudinal literature, visual acuity decline in DOA is not
      statistically distinguishable from no decline. This cuts against
      progression as a measurable property of visual acuity rather than against
      progression of the disease, and the distinction matters for trial design —
      the same review reports visual acuity as the only biomarker with any
      longitudinal data at all. It is recorded as REFUTE because it contradicts
      the claim this phenotype makes as stated, not because the disease is
      thought to be static.
  notes: >-
    The two evidence items here disagree and are both kept. A single
    population-based cohort found visual function worsening in 67.4% of patients
    at 0.032 logMAR/year (PMID:20417570); a later meta-analysis pooling seven
    studies found 0.022 logMAR/year with a confidence interval crossing zero
    (PMID:40329928). The point estimates are close, so the disagreement is about
    statistical power and the insensitivity of Snellen acuity over short
    follow-up, not about the direction of change. Structural measures
    (peripapillary retinal nerve fibre layer, macular ganglion cell-inner
    plexiform layer) are the candidates for a sensitive endpoint, but the
    meta-analysis found no longitudinal data for them to pool.

- category: Phenotypic abnormality
  name: Centrocecal scotoma
  description: >-
    The characteristic visual field defect, corresponding to the lost
    papillomacular bundle. It is typically centrocecal, central, or
    paracentral, and is often large in those with severe disease.
  phenotype_term:
    preferred_term: Centrocecal scotoma
    term:
      id: HP:0000576
      label: Centrocecal scotoma
  diagnostic: true
  evidence:
  - reference: PMID:20301426
    reference_title: "Optic Atrophy Type 1 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The visual field defect is typically \ncentrocecal, central, or paracentral; it is often large in those with severe \ndisease."
    explanation: Documents the centrocecal/central field defect and its relation to severity.

- category: Phenotypic abnormality
  name: Acquired blue-yellow dyschromatopsia
  description: >-
    An acquired colour vision defect, classically a blue-yellow (tritan) loss,
    though more diffuse non-specific dyschromatopsia is also common. The
    binding is to the general HP term Dyschromatopsia rather than to
    HP:0000552 Tritanomaly: HPO defines tritanomaly as difficulty
    distinguishing yellow and blue possibly related to dysfunction of the S
    photopigment, which is a cone-level claim, whereas the defect here is a
    consequence of retinal ganglion cell loss. The tritan pattern is carried in
    preferred_term instead of manufacturing a narrower ontology match.
  phenotype_term:
    preferred_term: Acquired blue-yellow (tritan) dyschromatopsia
    term:
      id: HP:0007641
      label: Dyschromatopsia
  evidence:
  - reference: PMID:20301426
    reference_title: "Optic Atrophy Type 1 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The color vision defect is often described as acquired blue-yellow loss \n(tritanopia)."
    explanation: Source for the acquired blue-yellow character of the colour defect.
  - reference: PMID:20301426
    reference_title: "Optic Atrophy Type 1 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tritanopia is the classic feature of color vision defect, but \nmore diffuse nonspecific dyschromatopsia is not uncommon."
    explanation: Supports recording the defect at the general Dyschromatopsia level while noting the classic tritan pattern.

- category: Phenotypic abnormality
  name: Abnormality of visual evoked potentials
  description: >-
    Visual evoked potentials are typically absent or delayed, reflecting loss
    and dysfunction of conducting retinal ganglion cell axons.
  phenotype_term:

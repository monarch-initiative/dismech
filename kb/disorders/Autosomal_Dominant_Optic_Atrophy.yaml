  - target: Loss of Cytochrome c Sequestration
    description: Experimental OPA1 loss alters cristae-junction control of cytochrome c release. Whether typical heterozygous patient RGCs exhibit the same apoptotic priming remains unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Selective Loss of Small-Calibre Papillomacular Bundle Fibres
  biological_scale: TISSUE
  description: 'Degeneration is not uniform across the retinal ganglion cell population. The smallest-calibre fibres, which make up the papillomacular bundle serving central vision, are affected first and most severely. That topography explains the clinical triad directly: temporal pallor of the optic disc, a central or centrocecal field defect, and early loss of central acuity and colour discrimination. The same pattern recurs across a large number of optic neuropathies of mitochondrial origin, including Leber hereditary optic neuropathy and the toxic and nutritional optic neuropathies, which is why it is modelled here as a property of the fibre population rather than as something specific to OPA1.'

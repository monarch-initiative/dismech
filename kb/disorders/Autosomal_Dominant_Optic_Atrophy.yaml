- name: Avoidance of Mitochondrial Toxins
  description: The archival GeneReviews chapter advises avoiding smoking, moderating alcohol intake and reviewing medications with mitochondrial toxicity. This does not apply to every antibiotic or antiviral. The entry records historical supportive-care advice; it does not establish an OPA1-specific quantitative exposure risk or a proven visual benefit from avoidance.

differential_diagnoses:
- name: Autosomal Dominant Optic Atrophy Plus
  description: DOA-plus adds extraocular manifestations such as sensorineural hearing impairment, ophthalmoplegia, myopathy, ataxia and neuropathy. All variant classes can occur, and the same OPA1 allele can produce classic or plus phenotypes within a family. Missense/GTPase enrichment is probabilistic; mtDNA deletions and COX-deficient muscle fibers are not exclusive to this group.
- name: Leber Hereditary Optic Neuropathy
  description: LHON is typically maternally inherited through mitochondrial-DNA variants and often presents with subacute sequential central visual loss. OPA1-related disease more often begins insidiously in childhood, but atypical timing and recovery occur. Molecular testing distinguishes the overlapping optic-neuropathy phenotypes.
- name: ACO2-related dominant optic atrophy
  description: ACO2-related dominant optic atrophy is an alternative genetic diagnosis involving mitochondrial aconitase and the tricarboxylic-acid cycle. A 2026 multicenter referral series characterizes the phenotype but does not establish its frequency among all OPA1-negative patients.
  evidence:
  - reference: PMID:41954904
    reference_title: Clinical and Genetic Spectrum of ACO2-Linked Dominant Optic Atrophy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Aconitase 2 (ACO2) gene variants are one of the most frequent causes of dominant optic atrophy (DOA).
    explanation: The relative-frequency statement is introductory context, not a prevalence estimate generated by the referral cohort.
    quote_role: BACKGROUND
- name: OPA3-related dominant optic atrophy with cataract
  description: Heterozygous OPA3 variants cause bilateral optic atrophy with premature cataract, a more benign picture than the autosomal recessive OPA3 disease (3-methylglutaconic aciduria type III, Costeff syndrome). OPA3 is a reasonable second-tier test but is rare — no OPA3 mutations were found in either a 76-proband population cohort or, beyond three families, in a 980-patient screen.
- name: Behr Syndrome
  disease_term:
    preferred_term: Behr syndrome
    term:
      id: MONDO:0008858
      label: Behr syndrome
  description: Biallelic OPA1-related Behr-like disease presents with severe early-onset optic atrophy and neurological involvement. A reported child carried a maternally inherited frameshift allele and a paternally inherited p.Ile437Met allele considered hypomorphic; this illustrates a second-allele effect, not an established modifier of all heterozygous OPA1 disease. The broader Behr phenotype is genetically heterogeneous.
  evidence:
  - reference: PMID:35741767
    reference_title: Biallelic Optic Atrophy 1 (OPA1) Related Disorder-Case Report and Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: He presented with congenital nystagmus, progressive vision loss, and optic atrophy, as well as progressive ataxia, and was found to have two likely pathogenic variants in his OPA1 gene
    explanation: The proband illustrates the biallelic differential; the report also reviews earlier cases.
discussions:
- discussion_id: rgc_selectivity_of_a_ubiquitous_gene
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Why does halving the dose of OPA1 — a gene expressed ubiquitously, and expressed highly in brain and auditory neurons — produce a disease that is essentially confined to retinal ganglion cells, and within that population to the smallest-calibre papillomacular fibres?
  attaches_to:
  - pathophysiology#Energetic Vulnerability of the Unmyelinated Prelaminar Axon
  - pathophysiology#Selective Loss of Small-Calibre Papillomacular Bundle Fibres
  rationale: 'The leading explanation is curated here as mechanism rather than omitted: the unmyelinated prelaminar axon segment has a high per-unit-length conduction cost, mitochondria are distributed asymmetrically across the lamina cribrosa accordingly, and the earliest mitochondrial changes in pre-symptomatic Opa1+/- mice are found in exactly that segment. But the argument is not closed, and the gap is specific rather than a general plea for more research. First, the explanation is an energy-budget argument about a segment of axon, whereas the clinical selectivity is a claim about a fibre subpopulation — nothing yet connects smallest calibre to earliest failure quantitatively. Second, the same reasoning ought to predict disease in other high-demand unmyelinated neural compartments, and does not obviously do so. Third, the argument cannot be the whole story, because the identical anatomical substrate is shared with Leber hereditary optic neuropathy, which has a completely different natural history (subacute, sequentially bilateral, partial spontaneous recovery) from the same fibre population. Fourth, it does not explain the reduced penetrance: an anatomical vulnerability that every
    carrier shares cannot by itself account for 43% and 62% penetrance in two families carrying the same recurrent allele. The iPSC-RGC paper states the gap explicitly.'
  evidence:
  - reference: PMID:35652445
    reference_title: Modelling autosomal dominant optic atrophy associated with OPA1 variants in iPSC-derived retinal ganglion cells.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: the specific sensitivity of RGCs to OPA1 mutations, especially given the high levels of gene expression within other neuronal tissues, such as the brain and auditory neurons (10), remains unclear
    explanation: States that the retinal ganglion cell selectivity of OPA1 disease is unexplained despite high expression elsewhere, which is the gap recorded here. Evidence source is OTHER because this is an expert statement of what the field does not know rather than data.
  - reference: PMID:35652445
    reference_title: Modelling autosomal dominant optic atrophy associated with OPA1 variants in iPSC-derived retinal ganglion cells.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: the disease mechanisms driving RGC degeneration are poorly understood
    explanation: Independent statement in the same source that the mechanism of retinal ganglion cell degeneration is not settled. Evidence source is OTHER because this is an expert statement about the state of knowledge rather than data.
  - reference: PMID:39659974
    reference_title: Opa1 and MT-Nd6 mutations induce early mitochondrial changes in the retina and prelaminar optic nerve of hereditary optic neuropathy mouse models.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Identifying the susceptibility of RGCs to such mutations in Opa1 or mitochondrial DNA is therefore essential to a fundamental understanding of these diseases.
    explanation: The authors of the leading mechanistic study frame retinal ganglion cell susceptibility as still requiring explanation.
    quote_role: BACKGROUND
  - reference: PMID:21112411
    reference_title: Mitochondrial optic neuropathies - disease mechanisms and therapeutic strategies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: the trigger for RGC loss is much more complex than a simple bioenergetic crisis and other important disease mechanisms have emerged relating to mitochondrial network dynamics, mtDNA maintenance, axonal transport, and the involvement of the cytoskeleton in maintaining a differential mitochondrial gradient at sites such as the lamina cribosa
    explanation: States directly that an energy-budget account is insufficient, and names the additional mechanisms in play. This is the clearest statement located that the selectivity question is open rather than answered by the prelaminar-energetics argument alone. Evidence source is OTHER because it is a review. Quoted verbatim including the source's spelling of "cribosa".
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:18783614
    reference_title: Mitochondrial oxidative phosphorylation in autosomal dominant optic atrophy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: While OPA1 is critical for optic nerve function, the mechanism by which OPA1 mutations lead to blindness is unknown
    explanation: Independent statement that the mechanism linking OPA1 loss to the optic neuropathy is unknown.
    quote_role: BACKGROUND
  notes: 'Not tagged HUMAN_MODEL_MISMATCH. The distinction matters: the mouse data do not conflict with the human disease, they simply do not reach the level of the claim. The open question is the mechanism itself, not the translational validity of a model that addresses it.'
- discussion_id: reduced_penetrance_modifiers
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: What determines whether a heterozygous OPA1 null allele carrier develops optic atrophy at all, given family-level penetrance as low as 43%?
  attaches_to:
  - inheritance#Autosomal dominant
  - pathophysiology#OPA1 Haploinsufficiency
  rationale: 'Family-specific penetrance estimates of 43% and 62% for the recurrent delTTAG allele show that carrying the variant does not determine clinical expression. Genetic background, age, ascertainment, environmental exposures and stochastic effects remain candidate contributors. OPA1-positive sporadic cases do not by themselves prove unaffected transmitting parents: de novo variation and unrecognized disease are alternatives. Haplogroup J enrichment in the cited 2006 study occurred in OPA1-negative patients and does not establish a modifier in this entry.'
  evidence:
  - reference: PMID:11440989
    reference_title: Spectrum, frequency and penetrance of OPA1 mutations in dominant optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The mutation screening in this study also identified a number of asymptomatic individuals with OPA1 mutations.
    explanation: Documents asymptomatic carriers, the observation that defines this gap.
  - reference: PMID:19319978
    reference_title: Molecular screening of 980 cases of suspected hereditary optic neuropathy with a report on 77 novel OPA1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: OPA1 mutations were found in 157 (40%) of the 392 apparently sporadic cases of optic atrophy
    explanation: Negative family history does not exclude OPA1; this case fraction cannot distinguish reduced penetrance from other explanations.
  notes: The 2026 retinal cohort found exploratory parent-of-origin differences in central-field intergenerational variation, but it did not identify a causal mitochondrial modifier. No specific mtDNA haplogroup is established here as an OPA1 penetrance modifier.
- discussion_id: developmental_versus_degenerative_rgc_loss
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How much of the retinal ganglion cell deficit in classic autosomal dominant optic atrophy is a developmental failure that has already happened by the time vision is first measured, and how much is ongoing degeneration that a therapy started in adulthood could still prevent?
  attaches_to:
  - pathophysiology#Retinal Ganglion Cell Degeneration and Optic Nerve Atrophy
  - pathophysiology#Selective Loss of Small-Calibre Papillomacular Bundle Fibres
  - clinical_trials#NCT06970106
  rationale: Developmental and ongoing degenerative contributions remain unquantified. The 2022 iPSC-RGC protocol supported differentiation despite OPA1 variants, whereas other protocols have differed. Functional mitochondrial abnormalities can precede overt neuronal loss in models. These observations do not determine how many patient RGCs are lost before diagnosis or predict failure of adult intervention. Longitudinal human structural/functional measurements and temporally controlled model perturbation or rescue could separate prevention of cell loss from recovery of dysfunctional surviving cells.
  evidence:
  - reference: PMID:42101483
    reference_title: 'Targeting the OPA1 pathway in Autosomal Dominant Optic Atrophy (ADOA): 25 years from gene discovery to therapeutic strategy.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: ADOA also involves a developmental component consistent with OPA1's essential role in mitochondrial fusion, cristae organization, and quality control.
    explanation: States the developmental contribution that this gap asks to be quantified. Evidence source is OTHER because this is a review.
    quote_role: BACKGROUND
  - reference: PMID:42101483
    reference_title: 'Targeting the OPA1 pathway in Autosomal Dominant Optic Atrophy (ADOA): 25 years from gene discovery to therapeutic strategy.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: developmental RGC loss may limit therapeutic efficacy of late-stage interventions-a challenge compounded by the difficulty of early diagnosis
    explanation: States the therapeutic consequence that makes this gap consequential rather than academic. Evidence source is OTHER because this is a review, and note the author's own hedge — "may limit" — which is why this is a gap and not a curated mechanism. Quoted verbatim including the source's hyphen where a dash was intended.
    quote_role: REVIEW_SYNTHESIS
  notes: A knowledge gap about timing and therapeutic reversibility, not proof that adult participants have already lost most recoverable function.
- discussion_id: oma1_stress_processing_switch_untested_in_doa
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Does stress-activated OMA1 cleavage of long OPA1 act as the amplifier that converts a tolerable 50% OPA1 dosage reduction into retinal ganglion cell loss, and does it explain why the same allele manifests in one carrier and not another?
  attaches_to:
  - pathophysiology#Impaired Mitochondrial Inner-Membrane Fusion
  - pathophysiology#OPA1 Haploinsufficiency
  rationale: Protease-deficient fibroblast experiments show that OMA1/YME1L-dependent OPA1 processing alters mitochondrial morphology and apoptotic susceptibility. Long OPA1 alone supported fusion in double-knockout cells, so both forms are not universally required. Whether manipulating this pathway benefits OPA1 haploinsufficient retinal neurons remains a separate question. The 2025 zebrafish/fly proteomics found no altered OMA1 or YME1L ortholog abundance, which does not measure protease activation.
  evidence:
  - reference: PMID:24616225
    reference_title: The i-AAA protease YME1L and OMA1 cleave OPA1 to balance mitochondrial fusion and fission.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Stress-induced OPA1 processing by OMA1 converts OPA1 completely into short isoforms, inhibits fusion, and triggers mitochondrial fragmentation.
    explanation: Describes the stress-gated proteolytic switch that this gap asks about.
  - reference: PMID:24616225
    reference_title: The i-AAA protease YME1L and OMA1 cleave OPA1 to balance mitochondrial fusion and fission.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: deletion of Oma1 restored mitochondrial tubulation, cristae morphogenesis, and apoptotic resistance in cells lacking YME1L
    explanation: The experimental result showing that removing OMA1 rescues cristae and apoptotic phenotypes, which is what makes OMA1 a candidate target — and also what shows the switch is not simply a fusion-capacity mechanism.
  notes: The cited experiments establish general OPA1 processing biology; they do not establish an OMA1 disease-modifying treatment for this disorder.

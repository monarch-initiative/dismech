  notes: Differences among lymphoblast organelles, stressed fibroblasts and retinal cultures may reflect assay conditions, cell type, allele or statistical power. The available studies do not resolve those contributions. A specific prelaminar respiratory deficit should not be treated as established merely because prelaminar ultrastructural changes are observed.
  downstream:

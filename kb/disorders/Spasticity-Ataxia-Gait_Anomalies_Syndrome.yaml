notes: >-
  Disease term corrected. This entry previously bound MONDO:0014803
  "spasticity-ataxia-gait anomalies syndrome", on the reading - recorded in an
  earlier version of this note, from a Falcon deep-research report - that the
  label was not a standard clinical disease name and could therefore be treated
  as a descriptive syndrome heading. That reading was wrong. MONDO:0014803 is a
  single-gene leaf class with no children: its synonyms are SPAHGC,
  "childhood-onset spasticity with variant non-ketotic hyperglycinemia" and
  "spasticity, childhood-onset, with hyperglycinemia"; it cross-references
  OMIM:616859 and Orphanet:401866; and MONDO records GLRX5 (hgnc:20134) as its
  causal gene. The string MONDO uses as the primary label is Orphanet's label
  for that GLRX5 disease. The entry is therefore now bound to MONDO:0017845
  "spastic ataxia" (synonym SPAX), the OMIM phenotypic-series grouping term
  under which the ARSACS, SPG7 and SPAX5 content on this page actually belongs.
  Searches run: OLS4 MONDO term lookup on MONDO:0014803 and MONDO:0017845, and
  synonym-inclusive OLS4 MONDO searches for "spastic ataxia" and
  "spasticity ataxia gait".
  GLRX5 is not curated here. GLRX5 deficiency causes two published phenotypes -
  sideroblastic anaemia, and a variant non-ketotic hyperglycinemia with
  childhood-onset spastic paraparesis and axonal polyneuropathy - through
  impaired mitochondrial iron-sulfur cluster biogenesis, a mechanism unrelated
  to the m-AAA protease and sacsin defects modelled on this page. It belongs to
  a separate entry on MONDO:0014803, which dismech does not currently have.
  Note also that no published GLRX5 series describes cerebellar ataxia, so the
  Orphanet label that MONDO carries does not match that disease's own reported
  phenotype either.
  Outstanding. Two follow-ups are deliberately left for a maintainer rather than
  taken in a genetics pass. First, the file is still named
  Spasticity-Ataxia-Gait_Anomalies_Syndrome.yaml, after the retired binding.
  Second, the ARSACS and SPG7 rows in has_subtypes duplicate standalone entries
  that already exist in this knowledge base (Charlevoix-Saguenay_spastic_ataxia
  on MONDO:0010041 and Hereditary_Spastic_Paraplegia_7 on MONDO:0011803), and
  MONDO:0017845 carries the ordo_group_of_disorders subset, so this entry is a
  candidate for conversion to a kb/groupings/ record.

- name: Chemotherapy for Hodgkin lymphoma
  therapeutic_modality: OTHER
  description: >-
    Standard lymphoma chemotherapy protocols are used for the EBV-positive
    Hodgkin lymphoma that is the most common malignant outcome. Chemotherapy
    can achieve remission but is not reliably durable, as progressive T-cell
    decline continues and most patients ultimately require allogeneic HSCT.
  treatment_term:
    preferred_term: Chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  target_mechanisms:
  - target: Hodgkin lymphoma
    treatment_effect: INHIBITS
    description: >-
      Chemotherapy treats the EBV-driven Hodgkin lymphoma; durable remission on
      chemotherapy alone is reported in only a minority.
    evidence:
    - reference: PMID:29867957
      reference_title: "Interleukin-2-Inducible T-Cell Kinase Deficiency-New Patients, New Insight?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Six patients died due to lymphoproliferation, while only two patients
        remained in remission after chemotherapy for HL.
      explanation: >-
        Quantifies the limited durability of chemotherapy for the Hodgkin
        lymphoma of ITK deficiency.
  evidence:
  - reference: PMID:25339095
    reference_title: "Interleukin-2-inducible T-cell kinase (ITK) deficiency - clinical and molecular aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Successfully treated according to standard chemotherapy protocol, T cells
      unfortunately were continuously declining and the girl died from
      respiratory failure after acquiring pneumocystis pneumonia at the age of
      10 ½ years.
    explanation: >-
      An index patient's Hodgkin lymphoma was treated with a standard
      chemotherapy protocol; it documents both the use of chemotherapy and that
      it did not prevent the fatal course.
diagnosis:
- name: ITK molecular genetic testing
  description: >-
    ITK is included on combined-immunodeficiency gene panels; whole-exome
    sequencing or a primary immunodeficiency panel confirms biallelic variants.
    All patients with EBV-associated lymphoproliferative disorders negative for
    SH2D1A and XIAP should be analyzed for ITK mutations.
  evidence:
  - reference: PMID:22487848
    reference_title: "IL-2-inducible T-cell kinase deficiency with pulmonary manifestations due to disseminated Epstein-Barr virus infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients with EBV-associated lymphoproliferative disorders should be
      analyzed for mutations in ITK.
    explanation: Recommendation to test ITK in the relevant clinical setting.
- name: Lymphocyte subset and iNKT-cell immunophenotyping
  description: >-
    Flow cytometry shows low CD4 counts, reduced naive CD45RA+CD4+ cells, and
    absent or severely reduced invariant NKT cells (TCR Valpha24+/Vbeta11+).
  evidence:
  - reference: PMID:25061172
    reference_title: "Identification of ITK deficiency as a novel genetic cause of idiopathic CD4+ T-cell lymphopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The index patient shows complete absence of TCRVα24+/TCRVβ11+ iNKT-cells.
    explanation: iNKT-cell absence is a diagnostically useful hallmark on flow cytometry.
discussions:
- discussion_id: ebv_independent_disease
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Do lymphoma, hypogammaglobulinemia and immune dysregulation in ITK
    deficiency require EBV infection, or can they arise independently of it?
  attaches_to:
  - pathophysiology#Impaired T-Cell Control of EBV
  rationale: >-
    No symptomatic EBV-seronegative lymphoproliferation patient had been
    reported, suggesting EBV is necessary for the lymphoproliferative arm. Yet
    an EBV-naive patient had combined immunodeficiency with CD4 lymphopenia and
    absent iNKT cells as the predominant manifestation, and other EBV-naive
    patients developed severe tuberculosis, showing that some phenotypes are
    EBV-independent. Whether the malignant and antibody phenotypes can occur
    without EBV is unsettled.
  evidence:
  - reference: PMID:25061172
    reference_title: "Identification of ITK deficiency as a novel genetic cause of idiopathic CD4+ T-cell lymphopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we here had the unique opportunity to dissect EBV-dependent and
      EBV-independent ITK deficiency phenotypes.
    explanation: The EBV-naive patient allows separation of EBV-dependent from EBV-independent features.
- discussion_id: murine_ebv_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does any available animal model reproduce the EBV-driven lymphoproliferation
    that defines human ITK deficiency?
  attaches_to:
  - pathophysiology#Impaired T-Cell Control of EBV
  rationale: >-
    Itk-/- mice recapitulate the iNKT-cell deficiency, CD4 lymphopenia and the
    TCR calcium/IFN-gamma signalling defects, but EBV does not infect mice.
    In preliminary MHV-68 (the closest murine EBV surrogate) experiments the
    authors saw no difference in lung or splenic viral load between Itk-/- and
    wild-type mice, so the central human phenotype — failure to control the
    gammaherpesvirus — is not demonstrated in the mouse.
  evidence:
  - reference: PMID:29867957
    reference_title: "Interleukin-2-Inducible T-Cell Kinase Deficiency-New Patients, New Insight?"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      There was no difference in the lytic viral tire in lungs between B6 and
      itk−/− infected mice; furthermore, there was no difference in the splenic
      genomic viral load between B6 and itk−/− mice at day 17.
    explanation: >-
      The murine MHV-68 surrogate does not reproduce the defective
      gammaherpesvirus control seen in patients.
animal_models:
- name: Itk-knockout mouse (Itk-/-)
  species: Mus musculus
  genotype: Itk null
  description: >-
    Itk-/- mice reproduce several features of human ITK deficiency — reduced,
    immature and dysfunctional NKT cells, decreased thymic and peripheral CD4 T
    cells, and impaired TCR-induced calcium release and effector cytokine
    production — but they do not model EBV, which does not infect mice.
  evidence:
  - reference: PMID:18292523
    reference_title: "The Tec kinases Itk and Rlk regulate NKT cell maturation, cytokine production, and survival."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Itk-/- mice have reduced numbers of NKT cells with a predominantly
      immature phenotype.
    explanation: Establishes the NKT-cell phenotype of the knockout.
  modeled_mechanisms:
  - target: Invariant NKT Cell Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: The knockout reproduces the reduced and immature NKT-cell compartment seen in patients.
    limitations: >-
      Residual NKT cells differ in degree from the near-complete human iNKT
      absence, and the mouse does not capture the EBV context in which the
      human deficit is observed.
    evidence:
    - reference: PMID:18292523
      reference_title: "The Tec kinases Itk and Rlk regulate NKT cell maturation, cytokine production, and survival."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Itk-/- mice have reduced numbers of NKT cells with a predominantly
        immature phenotype.
      explanation: The model's NKT phenotype corresponds to the human iNKT deficiency node.
  - target: Defective TCR-Induced Calcium Mobilization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Itk-/- T cells show reduced TCR-induced calcium release, the defect rescued by wild-type ITK.
    limitations: >-
      Mouse T cells retain more residual TCR signalling than some human alleles,
      and RLK (TXK) partially compensates in mice.
    evidence:
    - reference: PMID:22289921
      reference_title: "Loss-of-function mutations within the IL-2 inducible kinase ITK in patients with EBV-associated lymphoproliferative diseases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Human wild-type (wt) ITK, but none of the mutants, was able to rescue
        defective calcium flux in murine Itk(-/-) T cells.
      explanation: The murine Itk-/- calcium defect is the assay used to establish human allele loss of function.
notes: >-
  Boundary with other EBV-susceptibility inborn errors: ITK deficiency is kept
  as a distinct entry from SH2D1A/XLP1, XIAP/XLP2, CD27 and CD70 deficiency,
  MAGT1/XMEN disease and LAT deficiency, each curated or to be curated
  separately. ITK is also one etiology of Mendelian susceptibility to
  mycobacterial disease via its IFN-gamma defect; the tuberculosis arm is
  recorded here because PMID:36326697 reports it in ITK-deficient patients, and
  the overlapping MSMD framing is noted in Immunodeficiency_88. EBV infection
  is the trigger for the lymphoproliferative arm but is not yet an
  environmental[] node; the matching ECTO class is ECTO:3000273 'exposure to
  human gammaherpesvirus 4' (ols:ecto search l~gammaherpesvirus, 2026-10-14).

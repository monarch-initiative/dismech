- name: Impaired T-Cell IFN-gamma Production
  biological_scale: CELLULAR
  description: >-
    In three EBV-naive patients with complete ITK deficiency, CD4, CD8,
    double-negative alpha-beta, Vdelta2+ gamma-delta and MAIT cells produced
    little IFN-gamma in response to BCG. These patients had CD4 alpha-beta T
    lymphocytopenia with expansion of double-negative alpha-beta and
    Vdelta2-negative gamma-delta T cells.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: type II interferon production
    term:
      id: GO:0032609
      label: type II interferon production
    modifier: DECREASED
  evidence:
  - reference: PMID:36326697
    reference_title: "Inherited human ITK deficiency impairs IFN-γ immunity and underlies tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Finally, the patients' total lymphocytes secrete small amounts of IFN-γ,
      and CD4+, CD8+, DN αβ T, Vδ2+ γδ T, and MAIT cells display impaired IFN-γ
      production in response to BCG.
    explanation: Ex vivo measurement of the IFN-gamma defect across T-cell subsets.
  downstream:
  - target: Tuberculosis infection
    causal_link_type: DIRECT
    description: Deficient IFN-gamma immunity underlies severe tuberculosis in EBV-naive patients.
    evidence:
    - reference: PMID:36326697
      reference_title: "Inherited human ITK deficiency impairs IFN-γ immunity and underlies tuberculosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Inherited ITK deficiency undermines the development and function of
        various IFN-γ-producing T cell subsets, thereby underlying TB.
      explanation: The authors' conclusion linking the IFN-gamma defect to tuberculosis.
- name: Defective TCR-Driven Fas Ligand Upregulation
  biological_scale: CELLULAR
  description: >-
    In one patient with a homozygous kinase-domain variant (p.Pro521Leu) who
    presented with autoimmune lymphoproliferative syndrome, T cells failed to
    upregulate Fas ligand after CD3/CD28 stimulation but responded normally to
    PMA plus ionomycin, which bypasses the TCR. The authors propose failure of
    Fas-mediated activation-induced cell death as a mechanism for the T-cell
    lymphoproliferation; activation-induced cell death itself could not be
    measured in the patient.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: activation-induced cell death of T cells
    term:
      id: GO:0006924
      label: activation-induced cell death of T cells
  evidence:
  - reference: PMID:32628964
    reference_title: "ITK deficiency presenting as autoimmune lymphoproliferative syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FasL upregulation was significantly reduced in the patient’s T cells
      compared to control following anti-CD3+anti-CD28 activation, but not
      PMA/IO stimulation (Fig 1K).
    explanation: The FasL defect is confined to TCR-initiated signalling, placing it downstream of ITK.
  downstream:
  - target: Autoimmunity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired removal of activated T cells is proposed to underlie the
      autoimmune manifestations seen in some patients.
    evidence:
    - reference: PMID:32628964
      reference_title: "ITK deficiency presenting as autoimmune lymphoproliferative syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        failure to upregulate TCR-driven FasL expression likely contributed to
        the development ALPS in our patient.
      explanation: The authors attribute the ALPS-like autoimmune phenotype to the FasL defect.

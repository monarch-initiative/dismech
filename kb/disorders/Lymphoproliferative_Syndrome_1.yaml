    evidence_source: HUMAN_CLINICAL
    snippet: >-
      eight patients underwent hematopoietic SCT. Two patients died after HSCT.
    explanation: >-
      Outcome data showing HSCT is the definitive route but carries
      transplant-related mortality.
- name: Rituximab
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    Anti-CD20 therapy is used for EBV-driven B-cell proliferation and can bridge
    to definitive transplant; responses are partial in some patients.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  evidence:
  - reference: PMID:22487848
    reference_title: "IL-2-inducible T-cell kinase deficiency with pulmonary manifestations due to disseminated Epstein-Barr virus infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with rituximab (anti-CD20 mab) resulted in complete clinical
      remission with resolution of pulmonary lesions and a negative EBV titer
      in serum.
    explanation: Documented rituximab response in a patient with disseminated EBV disease.
- name: Immunoglobulin replacement therapy
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    IgG substitution partially ameliorates hypogammaglobulinemia and immune
    dysregulation but confers only temporary benefit.
  treatment_term:
    preferred_term: Immunoglobulin Therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  evidence:
  - reference: PMID:29867957
    reference_title: "Interleukin-2-Inducible T-Cell Kinase Deficiency-New Patients, New Insight?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IgG substitution has conferred only temporary benefit, especially to
      partially ameliorate immune dysregulation manifesting as

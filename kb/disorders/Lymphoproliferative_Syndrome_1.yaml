  notes: >-
    Reported alleles span the PH, SH2 and kinase domains and include missense,
    nonsense and frameshift variants, among them R335W (SH2 domain, index
    family), R29H (PH domain), Q17X, Y588X, W209X and c.468delT. In
    patient-derived T-cell lines most alleles left ITK mRNA largely unchanged
    but shortened protein half-life (PMID:25339095).
  evidence:
  - reference: PMID:19425169
    reference_title: "Girls homozygous for an IL-2-inducible T cell kinase mutation that leads to protein deficiency develop fatal EBV-associated lymphoproliferation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both girls harbored a homozygous missense mutation that led to
      substitution of a highly conserved residue (R335W) in the SH2 domain of
      ITK.
    explanation: Identification of the first disease-causing ITK allele by linkage in the index family.
  - reference: PMID:22289921
    reference_title: "Loss-of-function mutations within the IL-2 inducible kinase ITK in patients with EBV-associated lymphoproliferative diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ITK mutations are distributed over the entire protein and include
      missense, nonsense and indel mutations
    explanation: >-
      Additional patients from an EBV-LPD cohort negative for SH2D1A and XIAP
      mutations extend the allelic spectrum.
  - reference: PMID:22289921
    reference_title: "Loss-of-function mutations within the IL-2 inducible kinase ITK in patients with EBV-associated lymphoproliferative diseases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Pulse-chase experiments showed that ITK mutations lead to varying
      reductions of protein half-life from 25 to 69% as compared with wt ITK
      (107 min).
    explanation: Patient alleles reduce ITK protein stability, consistent with loss of function.
pathophysiology:
- name: Biallelic ITK Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Germline biallelic ITK variants abolish or destabilize the IL-2-inducible
    T-cell kinase, a Tec-family non-receptor tyrosine kinase expressed in T
    cells, NK cells, invariant NKT cells and mast cells. The index R335W allele
    is predicted to destabilize the SH2 domain and the mutant protein is
    nearly undetectable when expressed; other alleles truncate the protein or
    shorten its half-life.

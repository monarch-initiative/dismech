    term:
      id: GO:0004715
      label: non-membrane spanning protein tyrosine kinase activity
    modifier: DECREASED
  genetic_context:
    description: >-
      Germline biallelic ITK alleles, homozygous in consanguineous families
      and compound heterozygous in one patient.
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:32628964
    reference_title: "ITK deficiency presenting as autoimmune lymphoproliferative syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interleukin-2-inducible T cell kinase (ITK) is a member of the TEC family
      of non-receptor protein tyrosine kinases expressed in T lymphocytes, NK
      cells, invariant NKT cells (iNKT), and mast cells2.
    explanation: >-
      States the molecular function bound here (non-receptor tyrosine kinase)
      and the cell types that express ITK.
  - reference: PMID:19425169
    reference_title: "Girls homozygous for an IL-2-inducible T cell kinase mutation that leads to protein deficiency develop fatal EBV-associated lymphoproliferation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Additionally, Western blot analysis revealed that, unlike wild-type ITK,
      the R335W mutant was nearly undetectable when expressed in 293 T cells.
    explanation: The index allele yields almost no ITK protein, i.e. a protein-deficiency mechanism.
  - reference: PMID:25061172
    reference_title: "Identification of ITK deficiency as a novel genetic cause of idiopathic CD4+ T-cell lymphopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified a homozygous nonsense mutation located within the first exon
      of the Interleukin-2-inducible T-cell kinase (ITK) gene (c.C49T:p.Q17X)
      likely leading to nonsense-mediated decay of the corresponding gene
      product.
    explanation: A truncating allele in exon 1 supports complete loss of ITK as the disease mechanism.
  downstream:
  - target: Defective TCR-Induced Calcium Mobilization
    causal_link_type: DIRECT
    description: >-
      ITK phosphorylates PLC-gamma-1 downstream of the T-cell receptor; without
      it, IP3 generation and calcium release from intracellular stores fail.
    evidence:
    - reference: PMID:22289921
      reference_title: "Loss-of-function mutations within the IL-2 inducible kinase ITK in patients with EBV-associated lymphoproliferative diseases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Human wild-type (wt) ITK, but none of the mutants, was able to rescue
        defective calcium flux in murine Itk(-/-) T cells.
      explanation: >-
        Complementation assay showing that patient alleles cannot restore TCR
        calcium flux, directly linking ITK loss to the signalling defect.
- name: Defective TCR-Induced Calcium Mobilization
  biological_scale: CELLULAR
  description: >-
    After TCR engagement, ITK is recruited to the LAT-SLP76 complex and
    activates PLC-gamma-1, which generates IP3 and diacylglycerol; IP3 releases
    calcium from the endoplasmic reticulum and drives NFAT nuclear
    translocation. Patient T-cell lines show reduced or nearly absent
    TCR-induced cytosolic calcium release.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: T cell receptor signaling pathway
    term:
      id: GO:0050852
      label: T cell receptor signaling pathway
    modifier: DECREASED
  - preferred_term: release of sequestered calcium ion into cytosol
    term:
      id: GO:0051209
      label: release of sequestered calcium ion into cytosol
    modifier: DECREASED
  evidence:
  - reference: PMID:25339095
    reference_title: "Interleukin-2-inducible T-cell kinase (ITK) deficiency - clinical and molecular aspects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Calcium response was assayed by flux studies in transformed HVS patient T
      lymphocytes after CD3 antibody dependent TCR stimulation showing clearly
      reduced or nearly absent cytosolic release of calcium ions in most
      patients.
    explanation: Direct measurement of the TCR calcium defect in patient-derived T cells.
  - reference: PMID:29867957
    reference_title: "Interleukin-2-Inducible T-Cell Kinase Deficiency-New Patients, New Insight?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ITK activates PLCγ1, generating inositol 1,4,5-trisphosphate (IP3), which
      leads to intracellular calcium release and diacylglycerol
    explanation: Review statement of the signalling step ITK performs in the TCR pathway.
  downstream:
  - target: Invariant NKT Cell Deficiency
    causal_link_type: DIRECT
    description: Invariant NKT-cell development and maturation require ITK-dependent TCR signalling.
    evidence:
    - reference: PMID:25061172
      reference_title: "Identification of ITK deficiency as a novel genetic cause of idiopathic CD4+ T-cell lymphopenia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Consistent with previous findings in mouse7 and human,8-11 flow
        cytometry indicated an absence of iNKT-cells (Figure 1D), illustrating
        that the absence of iNKT-cells is a primary phenotype of ITK deficiency.
      explanation: >-
        iNKT cells are absent in an EBV-seronegative patient without
        lymphoproliferation, so the loss is not secondary to EBV disease.
    - reference: PMID:18292523
      reference_title: "The Tec kinases Itk and Rlk regulate NKT cell maturation, cytokine production, and survival."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We find, as has been reported previously, that Itk-/- mice have reduced
        numbers of NKT cells with a predominantly immature phenotype.
      explanation: The Itk knockout mouse reproduces the NKT-cell deficit.
  - target: Decreased CD4+ T cell count
    causal_link_type: DIRECT
    description: >-
      ITK-dependent TCR signalling supports thymic selection and peripheral
      maintenance of CD4 T cells; its loss produces progressive CD4
      lymphopenia.
    evidence:
    - reference: PMID:25339095
      reference_title: "Interleukin-2-inducible T-cell kinase (ITK) deficiency - clinical and molecular aspects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Itk −/− mice have decreased CD4 T cell numbers in the thymus and
        periphery [26].
      explanation: Review of the mouse knockout showing that Itk loss reduces CD4 T cells.
    - reference: PMID:25061172
      reference_title: "Identification of ITK deficiency as a novel genetic cause of idiopathic CD4+ T-cell lymphopenia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Although CD4 lymphopenia has already been described in other
        ITK-deficient patients suffering from lymphoproliferative disease,9,11
        we here show that combined immunodeficiency with CD4 deficiency can be
        the predominant disease manifestation.
      explanation: CD4 lymphopenia occurs in ITK deficiency even without EBV lymphoproliferation.
  - target: Impaired T-Cell Control of EBV
    causal_link_type: DIRECT
    description: Defective TCR signalling impairs the antiviral T-cell response that keeps EBV-infected B cells in check.
    evidence:
    - reference: PMID:26056787
      reference_title: "Atypical Clinical Course in Pediatric Hodgkin Lymphoma: Association With Germline Mutations in Interleukin-2-inducible T-Cell Kinase."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        ITK-mutated T cells cause a defective antiviral immune response and the
        resulting immune dysregulation can lead to EBV-associated polyclonal
        hyperplasia with subsequent outgrowth of neoplastic B-cell clones
      explanation: Case-report authors' conclusion linking the T-cell defect to failed EBV control.
  - target: Impaired T-Cell IFN-gamma Production
    causal_link_type: DIRECT
    description: Patient T cells secrete little IFN-gamma after TCR stimulation.
    evidence:
    - reference: PMID:36326697
      reference_title: "Inherited human ITK deficiency impairs IFN-γ immunity and underlies tuberculosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Moreover, the patients' T lymphocytes secrete small amounts of IFN-γ in
        response to TCR crosslinking, mitogens, or forced synapse formation with
        autologous B lymphocytes.
      explanation: Ex vivo patient T cells show reduced TCR-driven IFN-gamma secretion.
  - target: Defective TCR-Driven Fas Ligand Upregulation
    causal_link_type: DIRECT
    description: >-
      Patient T cells fail to upregulate Fas ligand after CD3/CD28 stimulation
      but respond normally when PMA and ionomycin bypass the TCR.
    evidence:
    - reference: PMID:32628964
      reference_title: "ITK deficiency presenting as autoimmune lymphoproliferative syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        FasL upregulation was significantly reduced in the patient’s T cells
        compared to control following anti-CD3+anti-CD28 activation, but not
        PMA/IO stimulation (Fig 1K).
      explanation: The defect is confined to TCR-initiated signalling, placing it downstream of ITK.

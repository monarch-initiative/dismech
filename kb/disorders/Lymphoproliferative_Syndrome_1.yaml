name: Lymphoproliferative Syndrome 1
creation_date: "2026-10-13T23:55:47Z"
category: Mendelian
synonyms:
- ITK deficiency
- LPFS1
- interleukin-2-inducible T-cell kinase deficiency
- combined immunodeficiency due to ITK deficiency
- autosomal recessive lymphoproliferative disease due to ITK deficiency
disease_term:
  preferred_term: lymphoproliferative syndrome 1
  term:
    id: MONDO:0013081
    label: lymphoproliferative syndrome 1
parents:
- Primary Immunodeficiency
- Combined Immunodeficiency
description: >-
  Lymphoproliferative syndrome 1 (ITK deficiency) is an autosomal recessive
  combined immunodeficiency caused by biallelic loss-of-function variants in
  ITK, the IL-2-inducible T-cell kinase, a Tec-family tyrosine kinase that
  couples the T-cell receptor to PLC-gamma-1 activation and calcium release.
  Loss of ITK depletes invariant NKT cells, causes progressive CD4 T-cell
  lymphopenia and hypogammaglobulinemia, and leaves Epstein-Barr virus poorly
  controlled. After EBV infection, children develop EBV-positive polymorphic
  B-cell lymphoproliferation, classic Hodgkin lymphoma and other B-cell
  lymphomas, with pulmonary nodules, hemophagocytic lymphohistiocytosis and
  autoimmune cytopenias in some. Reported onset ranges from infancy to
  adolescence, and mortality without hematopoietic stem cell transplantation is
  high. EBV-naive patients have presented instead with CD4 lymphopenia and
  recurrent pulmonary infection, or with severe tuberculosis. The lymphomas are
  modelled here as phenotypes of the germline syndrome, not as separate tumor
  entries.

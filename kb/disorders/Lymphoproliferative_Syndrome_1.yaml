inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Patients are homozygous for ITK loss-of-function variants, mostly from
    consanguineous families; one compound heterozygous patient of Greek-Italian
    descent has been reported.
  evidence:
  - reference: PMID:19425169
    reference_title: "Girls homozygous for an IL-2-inducible T cell kinase mutation that leads to protein deficiency develop fatal EBV-associated lymphoproliferation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study we describe 2 girls from a consanguineous Turkish family who
      died after developing severe immune dysregulation and therapy-resistant
      EBV-positive B cell proliferation following EBV infection.
    explanation: >-
      The index family is consanguineous and both affected sisters carry the
      same homozygous variant, the basis of the recessive classification.
  - reference: PMID:29867957
    reference_title: "Interleukin-2-Inducible T-Cell Kinase Deficiency-New Patients, New Insight?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients demonstrated an autosomal-recessive trait, while in one
      individual a compound-heterozygous inheritance from two different
      ethnicities (Greek–Italian) was revealed (5).
    explanation: >-
      Review of the reported patients confirming recessive inheritance,
      including one compound heterozygote.
  - reference: CGGV:assertion_63552229-5e8c-4a94-b428-ec9a56a0aa5f-2019-11-21T193148.945Z
    reference_title: "ITK / lymphoproliferative syndrome 1 (Definitive)"
    supports: SUPPORT

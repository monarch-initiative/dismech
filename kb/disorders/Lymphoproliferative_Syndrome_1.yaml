    - reference: PMID:29867957
      reference_title: "Interleukin-2-Inducible T-Cell Kinase Deficiency-New Patients, New Insight?"
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Furthermore, there are disorders with a global lack of NKT cells, in

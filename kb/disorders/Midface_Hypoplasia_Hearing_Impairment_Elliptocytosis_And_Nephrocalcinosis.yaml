name: Midface Hypoplasia, Hearing Impairment, Elliptocytosis, and Nephrocalcinosis
category: Mendelian
creation_date: "2026-09-04T00:00:00Z"
synonyms:
- MFHIEN
- MHEN
- AMMECR1-related syndrome
- AMMECR1 nuclear protein 1-related X-linked syndrome
description: >-
  This is the disease that was left over when a contiguous-gene deletion syndrome was taken
  apart. AMME - Alport syndrome, intellectual disability, midface hypoplasia and elliptocytosis -
  was described in 1998 as an Xq22.3 microdeletion spanning COL4A5 and its neighbours. COL4A5
  explained the Alport syndrome and nothing else, so the remaining features had to belong to a
  neighbouring gene. AMMECR1 was cloned out of the deleted interval the following year and named
  for the syndrome, with no known function.

  Two decades later the assignment was confirmed from the other direction: point mutations and
  microdeletions that hit AMMECR1 but spare COL4A5 reproduce the non-renal AMME features and not
  Alport syndrome. What is left is this entity - midface hypoplasia, sensorineural hearing loss,
  elliptocytosis and nephrocalcinosis, usually with short stature and developmental delay, and in
  the larger series with cardiac and skeletal abnormalities as well.

  The mechanism is genuinely open, and the entry says so rather than dressing it up. AMMECR1 is a
  nuclear protein with a nucleic-acid-binding RAGNYA fold that dimerizes with its paralog
  AMMECR1L; it is coexpressed with cell-cycle genes, several of which have their own growth and
  bone phenotypes, and its authors put this no more strongly than "potentially involved in cell
  cycle control". The one functional handle on a patient allele is localisation: the p.G177D
  missense protein distributes abnormally within the nucleus. How any of that produces midface
  hypoplasia or renal calcification is not known.

  One negative result deserves to survive from the original 1998 report, because it rules out the
  obvious explanation for the blood finding. The elliptocytosis here is not hereditary
  elliptocytosis: red cell membrane proteins were normal, and membrane stability and rigidity
  were normal on ektacytometry. Whatever deforms the red cells, it is not the spectrin-actin
  membrane skeleton defect that carries that name in haematology.
disease_term:
  preferred_term: midface hypoplasia, hearing impairment, elliptocytosis, and nephrocalcinosis
  term:
    id: MONDO:0010516
    label: midface hypoplasia, hearing impairment, elliptocytosis, and nephrocalcinosis
parents:
- X-linked Mendelian disease
notes: >-
  Identifiers. OMIM #300990 (MFHIEN) and OMIM 300195 (AMMECR1); the parent contiguous-gene
  syndrome AMME is OMIM 300194. Recorded in prose because the schema's `mappings` block carries
  `mondo_mappings` only and has no OMIM slot.

  Relationship to AMME and to Alport syndrome. This entry is the AMMECR1-attributable part of the
  AMME phenotype, and deliberately not AMME itself. AMME is a contiguous-gene deletion syndrome
  whose renal component comes from COL4A5; a patient whose deletion removes both genes has
  Alport syndrome as well, and that belongs to the Alport entries in this KB rather than here.
  The nephrocalcinosis curated below is a separate finding from Alport nephropathy and is
  reported in patients whose COL4A5 is intact.

  Why no phenotype carries a frequency band. The published experience is roughly a dozen affected
  males spread across six reports, and no two reports ascertain the same way: one is a
  nephrocalcinosis-led pair of half-brothers, one a growth-and-bone series, one a pair of
  array-CGH microdeletions, one a family reported for elliptocytosis, one a single missense case.
  There is no cohort and therefore no denominator, so every phenotype below records which reports
  observed it in `notes` instead of carrying a manufactured band. Assigning bands across
  incommensurable case reports would produce numbers that look like frequencies and are not.

  Evidence base. Six PMIDs: the founding contiguous-gene description (PMID:9598718), the cloning
  of AMMECR1 out of the deleted interval (PMID:10049589), the first point mutation with
  functional work (PMID:27811305), a second family reported as X-linked elliptocytosis with
  impaired growth (PMID:28089922), the five-individual loss-of-function series with the zebrafish
  knockdown (PMID:29193635), two AMMECR1-only microdeletions (PMID:30737907), the female-carrier
  report with fetal cochlear immunohistochemistry (PMID:35084080), and the second missense case
  (PMID:42386221).

  A corrigendum to PMID:28089922 was published as PMID:29174631. It has no fetchable abstract, so
  nothing is cited from it and no claim here rests on it; it is named so a reader checking that
  paper knows the correction exists.

  What is not asserted. No mechanism is claimed between AMMECR1 loss and any individual
  phenotype: the causal edges below are typed as having unknown intermediates and say so in their
  descriptions. No genotype-phenotype correlation is asserted - the most recent report states
  that additional cases and functional studies are needed to establish one. No treatment section
  is present, because none of the sources read here describes a disease-specific intervention;
  an empty gesture at supportive care would not be curation.

  Deep research. A Falcon deep-research report is committed alongside this entry. It passed
  `just preflight-dr` against MONDO:0010516 with AMMECR1 mentioned 41 times, the correct OMIM
  number recovered independently, and COL4A5 a distant second at 9 - which for this disease is
  the right shape, since COL4A5 is the neighbouring gene the entity had to be separated from.
  Reference validation resolved 4 of 4 citations with a confabulation rate of 0, and term
  validation resolved 29 of 30 with none unresolved. The report was used as a lead source only -
  every snippet below is anchored to a PMID fetched into `references_cache/` and read directly.
inheritance:
- name: X-linked recessive
  description: >-
    Affected individuals are males hemizygous for an AMMECR1 point mutation or microdeletion,
    typically inherited from an unaffected or mildly affected mother; de novo variants are also
    reported.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: PMID:28089922
    reference_title: X-linked elliptocytosis with impaired growth is related to mutated AMMECR1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we report a family with X-linked recessive syndrome caused by mutated AMMECR1 and characterized by elliptocytosis with or without anemia, midface hypoplasia, proportionate short stature and hearing loss."
    explanation: States the inheritance pattern and the core phenotype in one sentence.
  - reference: PMID:29193635
    reference_title: Inactivation of AMMECR1 is associated with growth, bone, and heart alterations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report five individuals with loss-of-function of the X-linked AMMECR1: a girl with a balanced X-autosome translocation and inactivation of the normal X-chromosome; two boys with maternally inherited and de novo nonsense variants; and two half-brothers with maternally inherited microdeletion variants."
    explanation: >-
      The allelic and inheritance spectrum across five individuals, including maternal
      transmission, a de novo variant, and the X-autosome translocation case.
- name: X-linked, with a partial phenotype in female carriers
  description: >-
    Carrier females are not uniformly unaffected. Three female relatives of a male fetus carrying
    an intragenic AMMECR1 deletion all reported hearing loss, with mild to moderate sensorineural
    loss on audiometry, and one had a soft cleft palate and hip dysplasia. This is recorded as a
    separate inheritance entry rather than folded into the recessive one, because it changes what
    a carrier should be told.
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  evidence:
  - reference: PMID:35084080
    reference_title: Hearing loss, cleft palate, and congenital hip dysplasia in female carriers of an intragenic deletion of AMMECR1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three women reported hearing loss and one was born with a soft cleft palate and hip dysplasia."
    explanation: The carrier findings themselves.
  - reference: PMID:35084080
    reference_title: Hearing loss, cleft palate, and congenital hip dysplasia in female carriers of an intragenic deletion of AMMECR1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we suggest that female carriers may display a partial phenotype in this X-linked condition"
    explanation: >-
      The authors' own conclusion, stated as a suggestion rather than an established rule, which
      is how it is recorded here.
pathophysiology:
- name: AMMECR1 Loss of Function
  description: >-
    The initiating lesion. Reported alleles span the range: microdeletions removing AMMECR1 alone
    or with its immediate neighbours TMEM164 and SNORD96B, nonsense variants, an X-autosome
    translocation with skewed inactivation of the normal X, and missense changes. AMMECR1 sits in
    the Xq22.3 interval deleted in AMME, and the disease-defining observation is that variants
    hitting AMMECR1 while sparing COL4A5 reproduce the non-renal AMME features without Alport
    syndrome.

    The gene encodes a 35.5 kDa protein from six exons with a ubiquitous transcript, conserved
    from yeast and nematode upward. When it was cloned, its function was unknown; a conserved
    six-amino-acid domain in exon 2 was noted with function unknown then, and it remains
    substantially unknown now.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: AMMECR1
    term:
      id: hgnc:467
      label: AMMECR1
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    description: >-
      Hemizygous in affected males - microdeletion, nonsense or missense. The functional impact
      is recorded as loss of function because the microdeletion and nonsense alleles are
      unambiguous and produce the same phenotype as the missense ones; whether every missense
      allele acts by simple loss of function is not established.
  downstream:
  - target: Loss of Nuclear AMMECR1 Function
    description: >-
      Deleting the gene removes the protein outright; the studied missense allele leaves the
      protein present but abnormally distributed within the nucleus. Both routes converge on the
      absence of normal nuclear AMMECR1 activity.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27811305
    reference_title: "AMMECR1: a single point mutation causes developmental delay, midface hypoplasia and elliptocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the affected half-brothers, we identified a hemizygous novel non-synonymous variant of unknown significance in AMMECR1 (c.G530A; p.G177D), a gene residing in the AMME disease locus."
    explanation: >-
      The first point mutation in the gene, in the family that separated AMMECR1's contribution
      from the rest of the AMME deletion.
  - reference: PMID:30737907
    reference_title: "Xq22.3q23 microdeletion harboring TMEM164 and AMMECR1 genes: Two case reports confirming a recognizable phenotype with short stature, midface hypoplasia, intellectual delay, and elliptocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These original cases further confirm that most specific AMME features are ascribed to AMMECR1 haploinsufficiency."
    explanation: >-
      Independent confirmation from the deletion side that this gene, not its neighbours, carries
      the non-renal phenotype.
  - reference: PMID:10049589
    reference_title: "Identification and characterization of a highly conserved protein absent in the Alport syndrome (A), mental retardation (M), midface hypoplasia (M), and elliptocytosis (E) contiguous gene deletion syndrome (AMME)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "AMMECR1 is composed of six exons, shows a ubiquitous 6.5-kb transcript, and codes for a protein with a molecular mass of 35.5 kDa."
    explanation: >-
      The gene's basic architecture, from the report that cloned it out of the AMME deletion
      interval. Graded OTHER because this is molecular cloning and sequence analysis rather than
      any of the study types the other values name.
- name: Loss of Nuclear AMMECR1 Function
  description: >-
    AMMECR1 and its paralog AMMECR1L dimerize and localize to the nucleus, which their
    nucleic-acid-binding RAGNYA folds would predict. The one patient allele examined functionally,
    p.G177D, is not absent from the nucleus but distributed abnormally within it - and the second
    reported missense allele is described the same way, as altered intranuclear distribution with
    reduced expression.

    What the protein does there is unresolved. The strongest statement its investigators make is
    that it is potentially involved in cell cycle control, inferred from coexpression rather than
    from an assay of AMMECR1 itself. This node therefore records a demonstrated molecular
    abnormality with an undetermined downstream function, which is the honest shape of the
    evidence.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: nucleus
    term:
      id: GO:0005634
      label: nucleus
  molecular_functions:
  - preferred_term: nucleic acid binding, predicted from the RAGNYA fold
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0003676
      label: nucleic acid binding
  downstream:
  - target: Disturbed Cell-Cycle-Associated Program in Developing Tissues
    description: >-
      The proposed consequence, and the weakest link in this chain. It rests on AMMECR1's
      coexpression with cell-cycle genes and on the zebrafish knockdown phenotype, not on any
      measurement of cell-cycle progression in patient cells.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Elliptocytosis Without a Membrane Skeleton Defect
    description: >-
      Drawn separately from the developmental branch because the original family's red cells were
      shown *not* to have the membrane defect that ordinarily causes elliptocytosis, so this is
      not a downstream consequence of any established mechanism. The edge records that the blood
      phenotype tracks AMMECR1 loss; its intermediates are unknown.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:29193635
    reference_title: Inactivation of AMMECR1 is associated with growth, bone, and heart alterations.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: INDIRECT
    snippet: "AMMECR1 and AMMECR1L proteins dimerize and localize to the nucleus as suggested by their nucleic acid-binding RAGNYA folds."
    explanation: >-
      The structural and localisation account of the normal protein. Graded COMPUTATIONAL because
      the nucleic-acid-binding function is a fold-based prediction, and INDIRECT because it
      describes the wild-type protein rather than a patient allele.
  - reference: PMID:27811305
    reference_title: "AMMECR1: a single point mutation causes developmental delay, midface hypoplasia and elliptocytosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "Transfected cell lines with the p.G177D mutation showed aberrant nuclear localisation patterns when compared with the wild type."
    explanation: >-
      The only direct functional demonstration for a patient allele: the mutant protein
      mislocalises within the nucleus in transfected cells.
  - reference: PMID:42386221
    reference_title: "A Second Report of a Missense Variant in AMMECR1 Causing Midface Hypoplasia, Hearing Impairment, Elliptocytosis, and Nephrocalcinosis: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Comparative review of the literature highlights that while previously reported missense variants in AMMECR1 demonstrated altered intranuclear protein distribution and reduced expression in functional assays, clinical evidence supporting pathogenicity of non-truncating variants remains limited."
    explanation: >-
      Confirms the intranuclear-distribution finding generalises across the reported missense
      alleles, and carries the authors' caveat about how thin the clinical evidence for
      non-truncating variants still is.
- name: Disturbed Cell-Cycle-Associated Program in Developing Tissues
  description: >-
    The proposed bridge between a nuclear protein of unknown function and a multisystem
    developmental phenotype. AMMECR1 is coexpressed with genes implicated in cell cycle
    regulation, five of which already have growth and bone phenotypes of their own, and knocking
    down the zebrafish orthologue produces features reminiscent of the patients'. That is the
    entire basis; no cell-cycle measurement has been made in patient material, and the proposal
    is stated by its authors as a possibility.

    Recorded as a node anyway, because the alternative is a graph in which a gene deletion
    connects directly to seven unrelated clinical findings with nothing in between, which would
    misrepresent the literature in the opposite direction.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: cell cycle control, proposed rather than demonstrated
    modifier: DYSREGULATED
    term:
      id: GO:0007049
      label: cell cycle
  mechanism_confidence: HYPOTHETICAL
  downstream:
  - target: Midface Hypoplasia
    description: >-
      The facial phenotype that named the syndrome. No mechanism connecting AMMECR1 to midfacial
      growth has been proposed in any source read here.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Sensorineural Hearing Impairment
    description: >-
      The one phenotype with a tissue-level foothold: AMMECR1 protein is expressed in the human
      fetal cochlea, so the gene is present where the deficit appears. Expression is not
      mechanism, and nothing further is claimed.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Short Stature
    description: >-
      Proportionate short stature is one of the most consistent features across reports, and the
      growth phenotype is what led to the cell-cycle coexpression hypothesis in the first place.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Developmental Delay and Intellectual Disability
    description: >-
      The "mental retardation" of the original AMME acronym, now attributed to AMMECR1 rather
      than to COL4A5 or the wider deletion.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormal Heart Morphology
    description: >-
      Cardiac abnormalities appear in the five-individual loss-of-function series and are not
      reported in the earlier families, which is why they are curated as part of the spectrum
      rather than as a core feature.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Cleft Palate
    description: >-
      Midline palatal defects - a submucous cleft with bifid uvula in the first point-mutation
      family, a soft cleft palate in a female carrier - alongside the midface hypoplasia, which is
      what makes the facial phenotype a midline developmental one rather than isolated retrusion.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Congenital Hip Dysplasia
    description: >-
      Part of the skeletal component, reported both in affected males and in a carrier female.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Nephrocalcinosis
    description: >-
      The renal finding that is *not* Alport syndrome. It was the presenting problem in the first
      point-mutation family and recurs in the most recent missense case, but its investigators put
      the attribution no more strongly than that AMMECR1 may play a role in it.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:29193635
    reference_title: Inactivation of AMMECR1 is associated with growth, bone, and heart alterations.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: INDIRECT
    snippet: "AMMECR1 is coexpressed with genes implicated in cell cycle regulation, five of which were previously associated with growth and bone alterations."
    explanation: >-
      The coexpression analysis that generated the hypothesis. COMPUTATIONAL and INDIRECT: it is
      a transcriptomic association, and the inference to cell-cycle involvement is one step
      beyond what it measures.
  - reference: PMID:29193635
    reference_title: Inactivation of AMMECR1 is associated with growth, bone, and heart alterations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Our knockdown of the zebrafish orthologous gene resulted in phenotypes reminiscent of patients' features."
    explanation: >-
      The animal evidence that the gene is required for normal development. "Reminiscent" is the
      authors' word and is not upgraded here.
  - reference: PMID:29193635
    reference_title: Inactivation of AMMECR1 is associated with growth, bone, and heart alterations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that AMMECR1 is potentially involved in cell cycle control and linked to a new syndrome with growth, bone, heart, and kidney alterations with or without elliptocytosis."
    explanation: >-
      The authors' summary claim, at the strength they state it - "potentially involved" - which
      is why this node's `mechanism_confidence` is LOW.
- name: Elliptocytosis Without a Membrane Skeleton Defect
  description: >-
    Elliptical red cells on the blood film, sometimes with anaemia. The important thing about this
    finding is what it is not: in the original AMME family the elliptocytosis was not accompanied
    by any detectable abnormality of red cell membrane proteins, and membrane stability and
    rigidity were normal on ektacytometry - the assay that is abnormal in hereditary
    elliptocytosis. So the shared name with hereditary elliptocytosis is a morphological
    coincidence, not a shared mechanism, and no mechanism has since been proposed.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  mechanism_confidence: HYPOTHETICAL
  downstream:
  - target: Elliptocytosis
    description: The morphological finding itself, as seen on the peripheral blood smear.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:9598718
    reference_title: "Alport syndrome, mental retardation, midface hypoplasia, and elliptocytosis: a new X linked contiguous gene deletion syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The elliptocytosis was not associated with any detectable abnormalities in red cell membrane proteins; red cell membrane stability and rigidity was normal on ektacytometry."
    explanation: >-
      The negative result that defines this node: the membrane-skeleton mechanism of hereditary
      elliptocytosis was looked for in these patients and was not there.
  - reference: PMID:27811305
    reference_title: "AMMECR1: a single point mutation causes developmental delay, midface hypoplasia and elliptocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blood films revealed the presence of elliptocytes in the older brother."
    explanation: >-
      The finding in an AMMECR1 point-mutation patient with COL4A5 intact, which is what ties it
      to this gene rather than to the wider deletion. Note it was present in one brother and not
      the other, which is where the variable expressivity of this feature shows.
phenotypes:
- name: Midface Hypoplasia
  category: Craniofacial
  description: >-
    Underdevelopment of the midface, the feature that supplies the first M of AMME and the first
    words of this entity's name.
  phenotype_term:
    preferred_term: Midface hypoplasia
    term:
      id: HP:0011800
      label: Midface retrusion
  notes: >-
    No frequency band; see the entry `notes` for why. Observed in: the original AMME family
    (PMID:9598718), the first point-mutation half-brothers (PMID:27811305), the X-linked
    elliptocytosis family (PMID:28089922), the two array-CGH microdeletion patients
    (PMID:30737907) and the second missense case (PMID:42386221).
  evidence:
  - reference: PMID:27811305
    reference_title: "AMMECR1: a single point mutation causes developmental delay, midface hypoplasia and elliptocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study shows that a single missense mutation in AMMECR1 causes a phenotype of midface hypoplasia, mild intellectual disability and the presence of elliptocytes, previously reported as part of a contiguous gene deletion syndrome."
    explanation: >-
      Attributes midface hypoplasia to AMMECR1 specifically rather than to the contiguous
      deletion.
  - reference: PMID:9598718
    reference_title: "Alport syndrome, mental retardation, midface hypoplasia, and elliptocytosis: a new X linked contiguous gene deletion syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The two males presented with additional features including mental retardation, dysmorphic facies with marked midface hypoplasia, and elliptocytosis."
    explanation: The original description, in the family that defined the phenotype.
- name: Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    Sensorineural hearing loss, mild to moderate where audiograms are reported, with a variable
    pattern of affected frequencies. It is one of the few features with any tissue-level support:
    AMMECR1 is expressed in the human fetal inner ear.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  notes: >-
    No frequency band; see the entry `notes`. Observed in the loss-of-function series
    (PMID:29193635), the microdeletion pair (PMID:30737907), the X-linked elliptocytosis family
    (PMID:28089922), the second missense case as partial hearing impairment (PMID:42386221), and
    in all three carrier females (PMID:35084080). The audiometric detail comes from the carrier
    report, so it describes carriers rather than affected males.
  evidence:
  - reference: PMID:30737907
    reference_title: "Xq22.3q23 microdeletion harboring TMEM164 and AMMECR1 genes: Two case reports confirming a recognizable phenotype with short stature, midface hypoplasia, intellectual delay, and elliptocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this article, we present two unrelated male patients with short stature, mild intellectual disability or neurodevelopmental delay, sensorineural hearing loss, and elliptocytosis harboring small microdeletions identified by array-CGH involving TMEM164 and AMMECR1 genes and SNORD96B small nucleolar RNA for one patient, inherited from their mothers."
    explanation: Sensorineural hearing loss in two independent AMMECR1-deletion patients.
  - reference: PMID:35084080
    reference_title: Hearing loss, cleft palate, and congenital hip dysplasia in female carriers of an intragenic deletion of AMMECR1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The audiograms showed mild to moderate SNHL with a variable pattern of the affected frequencies."
    explanation: The audiometric characterisation, obtained in carrier females.
  - reference: PMID:35084080
    reference_title: Hearing loss, cleft palate, and congenital hip dysplasia in female carriers of an intragenic deletion of AMMECR1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Immunohistochemical analysis of fetal cochlea was performed confirming the expression of AMMECR1 in the human inner ear."
    explanation: >-
      Places the gene product in the affected tissue. INDIRECT because expression in the cochlea
      does not by itself establish that its loss causes the hearing loss.
- name: Elliptocytosis
  category: Hematologic
  description: >-
    Elliptical red cells on the peripheral smear, with or without anaemia, and without the
    membrane-protein defect of hereditary elliptocytosis. Expressivity is variable even within a
    sibship - it was present in one of the two point-mutation half-brothers.
  phenotype_term:
    preferred_term: Elliptocytosis
    term:
      id: HP:0004445
      label: Elliptocytosis
  notes: >-
    No frequency band; see the entry `notes`. Observed in the original AMME family
    (PMID:9598718), one of two point-mutation half-brothers (PMID:27811305), the X-linked
    elliptocytosis family where it was the presenting feature (PMID:28089922), the microdeletion
    pair (PMID:30737907) and the second missense case (PMID:42386221). The five-individual series
    explicitly describes the syndrome as occurring with *or without* elliptocytosis, so it is not
    obligate.
  evidence:
  - reference: PMID:28089922
    reference_title: X-linked elliptocytosis with impaired growth is related to mutated AMMECR1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we report a family with X-linked recessive syndrome caused by mutated AMMECR1 and characterized by elliptocytosis with or without anemia, midface hypoplasia, proportionate short stature and hearing loss."
    explanation: >-
      The family in which elliptocytosis was the presenting feature, and the source for the
      "with or without anaemia" qualification.
  - reference: PMID:29193635
    reference_title: Inactivation of AMMECR1 is associated with growth, bone, and heart alterations.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that AMMECR1 is potentially involved in cell cycle control and linked to a new syndrome with growth, bone, heart, and kidney alterations with or without elliptocytosis."
    explanation: >-
      Refutes elliptocytosis as an obligate feature. Recorded here rather than omitted because
      the disease name lists it, and a reader could otherwise take its absence as excluding the
      diagnosis.
- name: Nephrocalcinosis
  category: Renal
  description: >-
    Calcium deposition in the renal parenchyma. This is the renal finding that belongs to
    AMMECR1; it is distinct from the Alport nephropathy of the contiguous-gene AMME deletion,
    which comes from COL4A5 and is not part of this entity.
  phenotype_term:
    preferred_term: Nephrocalcinosis
    term:
      id: HP:0000121
      label: Nephrocalcinosis
  notes: >-
    No frequency band; see the entry `notes`. Observed in the point-mutation half-brothers, where
    it was the presenting problem (PMID:27811305), and in the second missense case
    (PMID:42386221). The first-report authors state the attribution cautiously, as AMMECR1
    possibly playing a role, and that hedge is preserved here.
  evidence:
  - reference: PMID:27811305
    reference_title: "AMMECR1: a single point mutation causes developmental delay, midface hypoplasia and elliptocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sought to discover a genetic cause for two half-brothers presenting with nephrocalcinosis, early speech and language delay and midface hypoplasia with submucous cleft palate and bifid uvula."
    explanation: Nephrocalcinosis as the presenting feature in the first AMMECR1 point-mutation family.
  - reference: PMID:42386221
    reference_title: "A Second Report of a Missense Variant in AMMECR1 Causing Midface Hypoplasia, Hearing Impairment, Elliptocytosis, and Nephrocalcinosis: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a patient with a heterozygous de novo AMMECR1 missense variant, NM_015365.3:c.649G>A p.(Val217Met) presenting with clinical features consistent with MFHIEN, including midface hypoplasia, partial hearing impairment, nephrocalcinosis, and elliptocytosis identified on peripheral blood smear."
    explanation: Independent recurrence of nephrocalcinosis with a second missense allele.
- name: Short Stature
  category: Growth
  description: >-
    Proportionate short stature, one of the most consistent features across the reported families
    and the observation that motivated the growth-and-bone framing of the disease.
  phenotype_term:
    preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  notes: >-
    No frequency band; see the entry `notes`. Observed in the five-individual loss-of-function
    series (PMID:29193635), the microdeletion pair (PMID:30737907) and the X-linked
    elliptocytosis family, where it is specified as proportionate (PMID:28089922).
  evidence:
  - reference: PMID:29193635
    reference_title: Inactivation of AMMECR1 is associated with growth, bone, and heart alterations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They present with short stature, cardiac and skeletal abnormalities, and hearing loss."
    explanation: The core phenotype of the largest reported series.
- name: Developmental Delay and Intellectual Disability
  category: Neurological
  description: >-
    Developmental delay, usually mild intellectual disability, with early speech and language
    delay and infantile hypotonia described in the first point-mutation family. This is the
    "mental retardation" of the 1998 AMME acronym, reassigned from the deletion as a whole to
    AMMECR1.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  notes: >-
    No frequency band; see the entry `notes`. Observed in the original AMME family
    (PMID:9598718), the point-mutation half-brothers as speech and language delay
    (PMID:27811305) and the microdeletion pair as mild intellectual disability or
    neurodevelopmental delay (PMID:30737907). The bound term is the developmental-delay term
    rather than the intellectual-disability term because several reports describe delay in young
    children rather than an established cognitive outcome.
  evidence:
  - reference: PMID:30737907
    reference_title: "Xq22.3q23 microdeletion harboring TMEM164 and AMMECR1 genes: Two case reports confirming a recognizable phenotype with short stature, midface hypoplasia, intellectual delay, and elliptocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this article, we present two unrelated male patients with short stature, mild intellectual disability or neurodevelopmental delay, sensorineural hearing loss, and elliptocytosis harboring small microdeletions identified by array-CGH involving TMEM164 and AMMECR1 genes and SNORD96B small nucleolar RNA for one patient, inherited from their mothers."
    explanation: Records both the delay and its mildness in two independent deletion patients.
  - reference: PMID:27811305
    reference_title: "AMMECR1: a single point mutation causes developmental delay, midface hypoplasia and elliptocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that AMMECR1 is a critical gene in the pathogenesis of AMME, causing midface hypoplasia and elliptocytosis and contributing to early speech and language delay, infantile hypotonia and hearing loss, and may play a role in dysmorphism, nephrocalcinosis and submucous cleft palate."
    explanation: >-
      The authors' graded attribution across features - "causing" for two, "contributing to" for
      three, "may play a role" for three more - which is the source of the hedging used
      throughout this entry.
- name: Abnormal Heart Morphology
  category: Cardiovascular
  description: >-
    Cardiac abnormalities, reported in the five-individual loss-of-function series. They are not
    described in the earlier point-mutation families, so they are curated as part of the spectrum
    rather than as a defining feature.
  phenotype_term:
    preferred_term: Abnormal heart morphology
    term:
      id: HP:0001627
      label: Abnormal heart morphology
  notes: >-
    No frequency band; see the entry `notes`. The source describes "cardiac and skeletal
    abnormalities" collectively across five individuals without specifying lesions, so the bound
    term is deliberately the general abnormal-heart-morphology term and nothing narrower is
    claimed.
  evidence:
  - reference: PMID:29193635
    reference_title: Inactivation of AMMECR1 is associated with growth, bone, and heart alterations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They present with short stature, cardiac and skeletal abnormalities, and hearing loss."
    explanation: >-
      The only source for cardiac involvement, and the reason the entry claims no specific
      cardiac lesion.
- name: Cleft Palate
  category: Craniofacial
  description: >-
    Midline palatal defects: a submucous cleft palate with bifid uvula in the first
    point-mutation family, and a soft cleft palate in one carrier female.
  phenotype_term:
    preferred_term: Cleft palate
    term:
      id: HP:0000175
      label: Cleft palate
  notes: >-
    No frequency band; see the entry `notes`. Observed in the point-mutation half-brothers as a
    submucous cleft with bifid uvula (PMID:27811305) and in one carrier female as a soft cleft
    palate (PMID:35084080). The bound term is the general cleft-palate term; `HP:0000176` for a
    submucous cleft would fit the first family but not the carrier, and the entry does not split
    a two-patient observation across two terms.
  evidence:
  - reference: PMID:27811305
    reference_title: "AMMECR1: a single point mutation causes developmental delay, midface hypoplasia and elliptocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sought to discover a genetic cause for two half-brothers presenting with nephrocalcinosis, early speech and language delay and midface hypoplasia with submucous cleft palate and bifid uvula."
    explanation: The palatal finding in the first AMMECR1 point-mutation family.
  - reference: PMID:35084080
    reference_title: Hearing loss, cleft palate, and congenital hip dysplasia in female carriers of an intragenic deletion of AMMECR1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three women reported hearing loss and one was born with a soft cleft palate and hip dysplasia."
    explanation: The same midline defect in a carrier female.
- name: Congenital Hip Dysplasia
  category: Skeletal
  description: >-
    Congenital hip dysplasia, part of the skeletal component of the phenotype and, like the
    palatal defect, reported in a carrier female as well as in affected males.
  phenotype_term:
    preferred_term: Congenital hip dysplasia
    term:
      id: HP:0001374
      label: Congenital hip dislocation
  notes: >-
    No frequency band; see the entry `notes`. The carrier report names hip dysplasia in one of
    three women and states that it had been reported before in male AMMECR1 point-mutation
    carriers. The bound HP term is `Congenital hip dislocation`, which is HPO's label for this
    concept; `preferred_term` keeps the clinical wording used in the source.
  evidence:
  - reference: PMID:35084080
    reference_title: Hearing loss, cleft palate, and congenital hip dysplasia in female carriers of an intragenic deletion of AMMECR1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously, mutations in the AMMECR1 gene have been described in six males with developmental delay, sensorineural hearing loss (SNHL) and/or congenital abnormalities, including fetal nuchal edema, fetal pericardial effusion, talipes, congenital hip dysplasia, elliptocytosis and cleft palate."
    explanation: >-
      Places hip dysplasia among the previously reported male findings, and incidentally lists
      the fetal findings - nuchal edema, pericardial effusion, talipes - that are part of the
      wider spectrum but are not separately curated here.
genetic:
- name: AMMECR1
  notes: >-
    Encodes a 35.5 kDa nuclear protein of six exons with a ubiquitous transcript, conserved from
    yeast and Caenorhabditis elegans upward, carrying a nucleic-acid-binding RAGNYA fold and
    dimerizing with its paralog AMMECR1L. It was cloned specifically because it lay inside the
    AMME deletion interval and was named after that syndrome; its function was unknown then and
    is still not established.

    The gene's position is the whole story of this disease. It sits telomeric to COL4A5 in Xq22.3,
    inside the interval whose deletion produces AMME. Because COL4A5 accounts for the Alport
    syndrome and nothing else, the remaining features had to belong to a neighbour, and both
    point mutations and AMMECR1-sparing-COL4A5 microdeletions have since confirmed the assignment
    from opposite directions.

    Allelic spectrum: microdeletions (including small ones covering only TMEM164, AMMECR1 and
    SNORD96B), nonsense variants, an X-autosome translocation with inactivation of the normal X,
    and at least two missense alleles - p.G177D and p.Val217Met - both associated with altered
    intranuclear distribution. No genotype-phenotype correlation has been established.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: AMMECR1
    term:
      id: hgnc:467
      label: AMMECR1
  evidence:
  - reference: PMID:10049589
    reference_title: "Identification and characterization of a highly conserved protein absent in the Alport syndrome (A), mental retardation (M), midface hypoplasia (M), and elliptocytosis (E) contiguous gene deletion syndrome (AMME)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Exon 2 of AMMECR1 encodes a domain consisting of six amino acids identically conserved throughout the course of evolution and whose function is as yet unknown."
    explanation: >-
      The deep conservation that made the gene a plausible candidate, together with the statement
      that its function was unknown - which has not since been resolved.
  - reference: PMID:30737907
    reference_title: "Xq22.3q23 microdeletion harboring TMEM164 and AMMECR1 genes: Two case reports confirming a recognizable phenotype with short stature, midface hypoplasia, intellectual delay, and elliptocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In these cases, AMMECR1 gene appears to be responsible for most of the clinical features of the AMME syndrome except for Alport syndrome."
    explanation: >-
      The gene-disease assignment stated exactly: AMMECR1 carries the AMME phenotype minus its
      renal component.
  - reference: PMID:42386221
    reference_title: "A Second Report of a Missense Variant in AMMECR1 Causing Midface Hypoplasia, Hearing Impairment, Elliptocytosis, and Nephrocalcinosis: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional cases and functional studies are needed to clarify genotype-phenotype correlations and underlying disease mechanisms."
    explanation: >-
      The current state of the gene-disease relationship in its authors' words, and the reason
      this entry asserts no correlation between allele type and phenotype.
prevalence:
- population: Cases reported in the literature worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Roughly a dozen affected males across six reports as of 2026, plus three carrier females. The
    carrier report counts six males with point mutations described previously and ten with a
    deletion including AMMECR1. No population prevalence has been published and none is estimated
    here.
  evidence:
  - reference: PMID:35084080
    reference_title: Hearing loss, cleft palate, and congenital hip dysplasia in female carriers of an intragenic deletion of AMMECR1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously, mutations in the AMMECR1 gene have been described in six males with developmental delay, sensorineural hearing loss (SNHL) and/or congenital abnormalities, including fetal nuchal edema, fetal pericardial effusion, talipes, congenital hip dysplasia, elliptocytosis and cleft palate."
    explanation: The published count of point-mutation males as of that report.
  - reference: PMID:35084080
    reference_title: Hearing loss, cleft palate, and congenital hip dysplasia in female carriers of an intragenic deletion of AMMECR1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Until now, 10 male patients with a deletion including AMMECR1 have been described"
    explanation: The published count of deletion males as of that report.
diagnosis:
- name: Peripheral blood smear for elliptocytes
  description: >-
    Examination of the blood film is the step most likely to be skipped, and it is the one that
    turns a nonspecific dysmorphic-and-delayed presentation into a recognisable syndrome. The
    most recent case report makes exactly this point: the elliptocytosis was found on smear and
    the authors argue for pairing detailed phenotyping, haematology included, with the genomic
    data. Note the smear can be normal - one of the two point-mutation half-brothers had
    elliptocytes and the other did not.
  diagnosis_term:
    preferred_term: peripheral blood smear examination
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: Elliptocytes on the peripheral film, with or without anaemia; a normal smear does not exclude the diagnosis.
  evidence:
  - reference: PMID:42386221
    reference_title: "A Second Report of a Missense Variant in AMMECR1 Causing Midface Hypoplasia, Hearing Impairment, Elliptocytosis, and Nephrocalcinosis: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "emphasize the importance of integrating detailed phenotyping, including hematologic evaluation, with genomic data in the diagnosis of rare multisystem disorders"
    explanation: The authors' explicit diagnostic recommendation, naming haematology.
  notes: >-
    The bound NCIT term is the general Clinical Evaluation term. NCIT's `Blood Smear` term
    (NCIT:C79903) names the specimen rather than a clinical action and is not reachable from
    NCIT:C25218, so it cannot sit in this slot; `preferred_term` carries the specificity instead.
- name: Audiometry
  description: >-
    Hearing loss is sensorineural, mild to moderate where audiograms are reported, and the
    affected frequencies vary between individuals - so a normal impression on casual testing is
    not sufficient, and carriers should be tested too rather than asked.
  diagnosis_term:
    preferred_term: audiometric assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: Mild to moderate sensorineural hearing loss with a variable pattern of affected frequencies.
  evidence:
  - reference: PMID:35084080
    reference_title: Hearing loss, cleft palate, and congenital hip dysplasia in female carriers of an intragenic deletion of AMMECR1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The audiograms showed mild to moderate SNHL with a variable pattern of the affected frequencies."
    explanation: The audiometric findings, and the basis for the variability caveat.
- name: Molecular testing for AMMECR1 variants and Xq22.3 copy number
  description: >-
    Two testing modalities are needed rather than one, because the reported lesions split between
    sequence variants and copy number. Exome sequencing found the point mutations; array-CGH found
    the microdeletions, including small ones covering only TMEM164, AMMECR1 and SNORD96B. A
    sequencing-only workup would miss the deletion patients, and a copy-number-only workup would
    miss the missense ones. Where a deletion is found, its extent relative to COL4A5 is what
    decides whether the patient also has Alport syndrome.
  diagnosis_term:
    preferred_term: molecular analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: A hemizygous AMMECR1 sequence variant, or a deletion involving AMMECR1, with maternal carrier testing where informative.
  evidence:
  - reference: PMID:27811305
    reference_title: "AMMECR1: a single point mutation causes developmental delay, midface hypoplasia and elliptocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing was undertaken on maternal half-siblings."
    explanation: The sequencing route, in the family where the first point mutation was found.
  - reference: PMID:30737907
    reference_title: "Xq22.3q23 microdeletion harboring TMEM164 and AMMECR1 genes: Two case reports confirming a recognizable phenotype with short stature, midface hypoplasia, intellectual delay, and elliptocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this article, we present two unrelated male patients with short stature, mild intellectual disability or neurodevelopmental delay, sensorineural hearing loss, and elliptocytosis harboring small microdeletions identified by array-CGH involving TMEM164 and AMMECR1 genes and SNORD96B small nucleolar RNA for one patient, inherited from their mothers."
    explanation: >-
      The copy-number route, and the source for the claim that the deletions can be small enough
      to escape a sequencing-only workup.
animal_models:
- name: Zebrafish ammecr1 morphant
  species: Zebrafish
  genotype: knockdown of the zebrafish AMMECR1 orthologue
  publication: PMID:29193635
  description: >-
    The only animal work on this gene in the sources read here. Knocking down the zebrafish
    orthologue produced phenotypes the authors describe as reminiscent of the patients' features -
    which is a similarity claim, not a phenotype-by-phenotype recapitulation, and is treated as
    such below.
  modeled_mechanisms:
  - target: Disturbed Cell-Cycle-Associated Program in Developing Tissues
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Establishes that the gene is required for normal development in a vertebrate, which is the
      main thing this node needs and nearly the only thing the model supplies.
    limitations: >-
      The phenotypes are characterised only as "reminiscent" of the human features, with no
      individual correspondence reported; knockdown is not the same lesion as the human
      microdeletions and point mutations; and no cell-cycle measurement was made in the fish, so
      the model does not test the mechanism this node proposes. Zebrafish also have no midface in
      the sense the human phenotype uses, so the syndrome's defining feature cannot be assessed
      in it at all.
    evidence:
    - reference: PMID:29193635
      reference_title: Inactivation of AMMECR1 is associated with growth, bone, and heart alterations.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our knockdown of the zebrafish orthologous gene resulted in phenotypes reminiscent of patients' features."
      explanation: >-
        The whole of the reported animal result, quoted at the strength it is stated.
discussions:
- discussion_id: mhen_mechanism_entirely_unknown
  kind: KNOWLEDGE_GAP
  prompt: >-
    What does AMMECR1 actually do in the nucleus, and by what route does losing it produce midface
    hypoplasia, hearing loss, nephrocalcinosis and elliptocytosis?
  attaches_to:
  - pathophysiology#Disturbed Cell-Cycle-Associated Program in Developing Tissues
  rationale: >-
    Twenty-seven years after the syndrome was described and twenty-six after the gene was cloned,
    the function of AMMECR1 is stated in the literature as unknown or, at its strongest, as
    "potentially involved in cell cycle control" on the basis of coexpression. There is no assay
    of AMMECR1 activity, no cell-cycle measurement in patient material, and no proposed route from
    the gene to any one of the four features in the disease name. This is not a gap in one branch
    of an otherwise worked-out mechanism - it is the whole mechanism, and the entry's causal edges
    are typed with unknown intermediates for that reason. The tractable next steps are the
    obvious ones: a conditional mouse or a patient-derived cell model with an actual readout, and
    a molecular function for the RAGNYA fold beyond the sequence prediction.
- discussion_id: mhen_elliptocytosis_not_membrane_defect
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do the red cells become elliptical when the membrane skeleton is intact?
  attaches_to:
  - pathophysiology#Elliptocytosis Without a Membrane Skeleton Defect
  rationale: >-
    Hereditary elliptocytosis is a disease of the spectrin-actin membrane skeleton, and the
    obvious hypothesis for an inherited elliptocytosis is that the same machinery is affected.
    That hypothesis was tested in the original AMME family and failed: red cell membrane proteins
    were normal and ektacytometry showed normal membrane stability and rigidity. So the
    morphology is produced some other way - plausibly during erythropoiesis rather than in the
    mature cell, given a nuclear protein with a proposed cell-cycle role - and nobody has looked.
    A negative result this clean, left unfollowed for a quarter century, is unusually good value
    for a small experiment.
- discussion_id: mhen_female_carrier_phenotype
  kind: KNOWLEDGE_GAP
  prompt: >-
    How often, and how severely, are female AMMECR1 carriers affected?
  attaches_to:
  - inheritance#X-linked, with a partial phenotype in female carriers
  rationale: >-
    All three carrier females in the one report that examined them had hearing loss, and one had
    a cleft palate and hip dysplasia - and separately, one of the five patients in the
    loss-of-function series is a girl, affected because a balanced X-autosome translocation
    inactivated her normal X. So the "recessive" label is doing less work than it appears to.
    Three women is not a denominator, no other report audiometrically examines carriers, and the
    counselling consequence is direct: a carrier mother currently gets a recurrence risk without
    any statement of her own risk. Resolving it needs systematic audiometry in obligate carriers
    across the reported families, with X-inactivation studies alongside.

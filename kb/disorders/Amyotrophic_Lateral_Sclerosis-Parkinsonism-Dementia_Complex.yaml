    reference_title: Parkinsonism-dementia complex on Guam - overview of clinical aspects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In PDC, rigidity is so marked that postural deformities such as a generally
      flexed posture become rather prominent.
    explanation: Directly documents marked rigidity in Guam PDC.
- category: Neurological
  name: Gait Disturbance

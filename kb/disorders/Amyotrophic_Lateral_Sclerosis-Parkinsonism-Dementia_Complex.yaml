phenotypes:
- category: Neurological
  name: Atypical Parkinsonism
  description: >-
    A severe rigido-akinetic parkinsonian syndrome is a defining component of
    Guam PDC and may occur with dementia or motor-neuron manifestations.
  phenotype_term:
    preferred_term: Parkinsonism
    term:
      id: HP:0001300
      label: Parkinsonism
  evidence:
  - reference: PMID:10525998
    reference_title: Parkinsonism-dementia complex on Guam - overview of clinical aspects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Important diagnostic indicators of the illness include rigido-akinetic type
      Parkinsonism and severe dementia.
    explanation: Directly identifies the rigido-akinetic parkinsonian component of Guam PDC.
- category: Neurological
  name: Dementia
  description: >-
    Progressive global cognitive decline, memory impairment, disorientation,
    and behavioral or personality change characterize the dementia component.
  phenotype_term:
    preferred_term: Dementia
    term:
      id: HP:0000726
      label: Dementia
  evidence:
  - reference: PMID:10525998
    reference_title: Parkinsonism-dementia complex on Guam - overview of clinical aspects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dementia in PDC is characterized by a progressive dulling of all
      intellectual faculties, recent memory deﬁcits, disorien- tation in time,
      place and then person, as well as personality and behavioral changes.
    explanation: Directly describes progressive dementia in Guam PDC.
- category: Neurological
  name: Motor Neuron Disease (ALS)
  description: >-
    An ALS-predominant form is part of the Guam ALS-PDC spectrum; the PDC form
    may also show upper- and lower-motor-neuron involvement.
  phenotype_term:
    preferred_term: Amyotrophic lateral sclerosis
    term:
      id: HP:0007354
      label: Amyotrophic lateral sclerosis
  evidence:
  - reference: PMID:18843496
    reference_title: Enduring involvement of tau, beta-amyloid, alpha-synuclein, ubiquitin and TDP-43 pathology in the amyotrophic lateral sclerosis/parkinsonism-dementia complex of Guam (ALS/PDC).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tau and TDP-43 positive neuronal, oligodendroglial and astrocytic inclusions
      involving multiple nerve fiber tracts occurred in both the ALS and PDC types,
      reinforcing the concept that these forms are part of the same disorder.
    explanation: Supports ALS and PDC as clinical-pathologic forms of the same Guam disorder.
- category: Neurological
  name: Rigidity
  description: >-
    Marked axial and limb rigidity contributes to a flexed posture and severe
    movement impairment in the PDC-predominant form.
  phenotype_term:

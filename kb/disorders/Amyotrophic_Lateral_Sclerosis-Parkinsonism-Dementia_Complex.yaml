    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The biomagnification of BMAA through the Guam ecosystem fits a classic
      triangle of increasing concentrations of toxic compounds up the food chain.
    explanation: Supports environmental bioaccumulation but does not establish a causal human exposure dose.
  - reference: PMID:28598725
    reference_title: A critical review of the postulated role of the non-essential amino acid, β-N-methylamino-L-alanine, in neurodegenerative disease in humans.
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      The relationship of BMAA and ALS/PDC has never been proven, and the
      neurotoxic effects of BMAA seen in animals have only been noted after large
      doses that would involve unrealistic human exposures.

- name: L-BMAA Neurotoxic Exposure
  description: >-
    Dietary L-BMAA is retained as the trigger of an alternative cycad-toxin
    hypothesis. Guam ecosystem measurements and experimental systems make the
    route biologically plausible, but neither those observations nor this node
    establish that human exposure caused Guam ALS-PDC.
  role: trigger
  mechanism_confidence: HYPOTHETICAL
  biological_scale: ORGANISM
  chemical_entities:
  - preferred_term: L-BMAA
    term:
      id: CHEBI:73169
      label: L-BMAA
  evidence:
  - reference: PMID:14612559
    reference_title: Biomagnification of cyanobacterial neurotoxins and neurodegenerative disease among the Chamorro people of Guam.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The biomagnification of BMAA through the Guam ecosystem fits a classic
      triangle of increasing concentrations of toxic compounds up the food chain.
    explanation: Supports environmental bioaccumulation but does not establish a causal human exposure dose.
  - reference: PMID:28598725
    reference_title: A critical review of the postulated role of the non-essential amino acid, β-N-methylamino-L-alanine, in neurodegenerative disease in humans.
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      The relationship of BMAA and ALS/PDC has never been proven, and the
      neurotoxic effects of BMAA seen in animals have only been noted after large
      doses that would involve unrealistic human exposures.
    explanation: The critical review directly limits causal extrapolation from experimental exposure to Guam disease.
  downstream:

    PET demonstrates reduced presynaptic striatal fluorodopa uptake in Guam PDC,
    with intermediate reductions in Guam ALS and reductions in some clinically
    normal Guamanians. This is a living-subject readout of nigrostriatal injury,
    not a disease-specific diagnostic signature.

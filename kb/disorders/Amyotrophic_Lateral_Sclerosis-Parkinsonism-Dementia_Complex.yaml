  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  review_notes: >-
    Candidate association only. It is not represented as a causative Mendelian
    allele, and no supported causal path from TRPM7 to the observed neuropathology
    is asserted.
  evidence:
  - reference: PMID:16051700
    reference_title: A TRPM7 variant shows altered sensitivity to magnesium that may contribute to the pathogenesis of two Guamanian neurodegenerative disorders.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found a TRPM7 variant in a subset of ALS-G and PD-G patients that
      produces a protein with a missense mutation, T1482I.
    explanation: Supports a variant in a subset rather than a disease-defining causal gene.
  - reference: PMID:16051700
    reference_title: A TRPM7 variant shows altered sensitivity to magnesium that may contribute to the pathogenesis of two Guamanian neurodegenerative disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, heterologously expressed T1482I TRPM7 produces functional channels
      that show an increased sensitivity to inhibition by intracellular Mg2+.
    explanation: Directly supports the altered channel property in a heterologous system.
- name: Chromosome 12p D12S1617 susceptibility locus
  association: >-
    Candidate linkage and allelic-association signal from a large, genetically
    isolated Guam sample; not a resolved causal gene or independently replicated
    disease mechanism.
  relationship_type: SUSCEPTIBILITY
  review_notes: >-
    Kept at locus level because the study did not identify a causal gene. The
    complex pedigree and isolate structure limit generalization.
  evidence:
  - reference: PMID:19567404
    reference_title: "Identification of novel susceptibility loci for Guam neurodegenerative disease: challenges of genome scans in genetic isolates."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      D12S1617 on 12p gave the strongest evidence of linkage (maximum LOD score,
      Z(max) = 4.03) in our initial scan, with additional support in the complete
      case-control sample in the form of evidence of allelic association at this
      marker and another nearby marker.
    explanation: >-
      Supports a candidate linkage/association locus in the sampled isolate, not
      a causal variant or gene.
- name: MAPT-region susceptibility signal
  gene_term:
    preferred_term: MAPT
    term:
      id: hgnc:6893
      label: MAPT
  association: Supportive, non-causal linkage evidence at the chromosome 17 MAPT region.
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  review_notes: >-
    The cited genome scan calls the evidence supportive rather than significant;
    this entry does not equate the signal with a causative MAPT allele.
  evidence:
  - reference: PMID:19567404
    reference_title: "Identification of novel susceptibility loci for Guam neurodegenerative disease: challenges of genome scans in genetic isolates."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found significant evidence for two regions with novel ALS/PDC loci on
      chromosome 12 and supportive evidence for the involvement of the MAPT region
      on chromosome 17.
    explanation: >-
      Directly supports only a regional susceptibility signal, with no causal
      MAPT variant established.
- name: C9orf72 repeat-expansion hypothesis
  gene_term:
    preferred_term: C9orf72
    term:
      id: hgnc:28337
      label: C9orf72
  presence: Not detected as a cause in the studied Chamorro series
  association: Pathogenic repeat expansion tested and refuted as a cause of Chamorro Guam ALS-PDC.
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:23588498
    reference_title: C9orf72 hexanucleotide repeat expansion and Guam amyotrophic lateral sclerosis-Parkinsonism-dementia complex.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All Chamorro participants with ALS and PDC and control subjects had normal
      repeats, ranging from 2 to 17 copies.
    explanation: >-
      Refutes pathogenic C9orf72 repeat expansion in the 24 ALS cases, 22 PDC
      cases, and 43 controls studied; it is not a claim about every possible case.
- name: LRRK2 mutation hypothesis
  gene_term:
    preferred_term: LRRK2
    term:
      id: hgnc:18618
      label: LRRK2
  presence: No pathogenic mutation found in the studied Guam series
  association: Pathogenic point mutations tested and refuted as a cause in the sampled population.
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:23588498
    reference_title: C9orf72 hexanucleotide repeat expansion and Guam amyotrophic lateral sclerosis-Parkinsonism-dementia complex.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: No pathogenic LRRK2 mutations were found.
    explanation: >-
      Refutes pathogenic LRRK2 point mutations in the study series without
      asserting exhaustive exclusion of every possible LRRK2 variant.
environmental:
- name: Cycad-Ecosystem L-BMAA Ingestion (Candidate)
  description: >-
    Ingestion of L-BMAA through cycad-associated foods, including proposed
    trophic transfer through flying foxes, is a historically important exposure
    hypothesis. Ecosystem biomagnification was reported, but a causal human dose
    and a causal relationship to Guam ALS-PDC have not been established.
  exposure_term:
    preferred_term: L-BMAA dietary exposure
    term:
      id: ECTO:0000231
      label: exposure to chemical
  chemicals:
  - L-BMAA
  effect: Candidate neurotoxic trigger; human causality remains unresolved.
  review_notes: >-
    Retained only as the environmental exposure corresponding to the alternative
    BMAA hypothesis. The ingestion route is ExO:0000056 (ingestion), recorded
    here in free text because that route term is outside the ExposureTerm schema
    root and therefore cannot be bound in exposure_term.
  evidence:
  - reference: PMID:14612559
    reference_title: Biomagnification of cyanobacterial neurotoxins and neurodegenerative disease among the Chamorro people of Guam.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Flying foxes are a prized food item of the indigenous Chamorro people who
      boil them in coconut cream and eat them whole.
    explanation: Supports a proposed ingestion route but not a causal or sufficient human exposure dose.
  - reference: PMID:28598725
    reference_title: A critical review of the postulated role of the non-essential amino acid, β-N-methylamino-L-alanine, in neurodegenerative disease in humans.
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      The review concludes that the hypothesis of a causal BMAA neurodegenerative
      disease relationship is not supported by existing data.
    explanation: Directly records the critical review's conclusion against a demonstrated causal relationship.
  - reference: PMID:36952379
    reference_title: Guam ALS-PDC is a distinct double-prion disorder featuring both tau and Aβ prions.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Extensive studies of genetic or environmental factors have failed to
      identify a cause of ALS-PDC.
    explanation: Confirms that environmental causation remains unresolved.
diagnosis:
- name: Neurological Physical Examination
  description: >-
    Examination identifies the combined rigido-akinetic, pyramidal,
    lower-motor-neuron, gait, and cognitive syndrome and helps assign a clinical
    form. The findings are syndromic rather than etiologically confirmatory.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  results: Rigido-akinetic parkinsonism, rigidity, gait disturbance, hyperreflexia, distal amyotrophy, or an ALS syndrome in the appropriate Guam context.
  evidence:
  - reference: PMID:10525998
    reference_title: Parkinsonism-dementia complex on Guam - overview of clinical aspects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Important diagnostic indicators of the illness include rigido-akinetic type
      Parkinsonism and severe dementia.
    explanation: Establishes key examination indicators of the PDC-predominant form.
- name: Cognitive Assessment
  description: >-
    Cognitive assessment characterizes the progressive global dementia component
    but does not distinguish Guam ALS-PDC from other neurodegenerative diseases.
  diagnosis_term:
    preferred_term: cognitive assessment
    term:
      id: NCIT:C165543
      label: Neuropsychological Assessment
  results: Progressive global intellectual decline with memory, orientation, personality, and behavioral change.
  evidence:
  - reference: PMID:10525998
    reference_title: Parkinsonism-dementia complex on Guam - overview of clinical aspects.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dementia in PDC is characterized by a progressive dulling of all
      intellectual faculties, recent memory deﬁcits, disorien- tation in time,
      place and then person, as well as personality and behavioral changes.
    explanation: Supports the cognitive domains requiring assessment without validating a specific test instrument.
- name: Striatal Fluorodopa PET
  description: >-
    18F-6-fluorodopa PET can demonstrate presynaptic nigrostriatal dysfunction,
    but reduced uptake also occurred in Guam ALS and clinically normal Guam
    subjects and therefore is not confirmatory.
  diagnosis_term:
    preferred_term: positron emission tomography procedure
    term:
      id: NCIT:C17007
      label: Positron Emission Tomography
  results: Reduced striatal 18F-6-fluorodopa uptake, with the strongest reduction in clinically parkinsonian subjects.
  evidence:
  - reference: PMID:2375693
    reference_title: Positron emission tomographic scanning demonstrates a presynaptic dopaminergic lesion in Lytico-Bodig. The amyotrophic lateral sclerosis-parkinsonism-dementia complex of Guam.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The nigrostriatal lesions in the subjects with amyotrophic lateral sclerosis
      and the Guamanian normal subjects are examples of subclinical neuronal damage
      demonstrable in living subjects with positron emission tomography.
    explanation: Supports PET detection of living-subject neuronal damage while demonstrating limited diagnostic specificity.
- name: Postmortem Neuropathologic Examination
  description: >-
    A 2011 review reported that Guam and Kii ALS/PDC could then be confirmed only
    by postmortem examination. This is retained as historical diagnostic context,
    not a timeless claim that no premortem biomarker can ever be available.
  diagnosis_term:
    preferred_term: autopsy procedure
    term:
      id: NCIT:C25153
      label: Autopsy
  results: Widespread mixed 3R/4R tau neurofibrillary pathology with associated protein lesions in a compatible clinicogeographic syndrome.
  evidence:
  - reference: PMID:21527311
    reference_title: "The ALS/PDC syndrome of Guam: potential biomarkers for an enigmatic disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      At present, ALS/PDC of Guam and the Kii Peninsula can be confirmed only by
      postmortem examination.
    explanation: Records the review's 2011 confirmation standard with explicit temporal scope.
- name: Ocular Motor Examination
  description: >-
    Examination can identify supranuclear ocular and eyelid motor abnormalities,
    but the evidence is a single 37-patient series and does not validate a
    stand-alone diagnostic test.
  diagnosis_term:
    preferred_term: eye examination
    term:
      id: NCIT:C38060
      label: Eye Examination
  results: Heterogeneous supranuclear ocular or lid motor abnormalities.
  evidence:
  - reference: PMID:3194062
    reference_title: Supranuclear disturbances of ocular motility in Lytico-Bodig.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found abnormal supranuclear ocular or lid motility in all of 37 patients
      with Lytico-Bodig (amyotrophic lateral sclerosis/parkinsonism-dementia
      complex).
    explanation: >-
      Supports examination yield in the reported series, not specificity or a
      validated diagnostic threshold.
- name: Retinal Examination for Linear Pigment Epitheliopathy
  description: >-
    Retinal examination may identify the associated linear pigment epitheliopathy.
    Its prospective association makes it a candidate risk marker, not a
    confirmatory test for ALS-PDC.
  diagnosis_term:
    preferred_term: eye examination
    term:
      id: NCIT:C38060
      label: Eye Examination
  results: Presence or absence of linear retinal pigment epitheliopathy.
  evidence:
  - reference: PMID:26153661
    reference_title: A unique retinal epitheliopathy is associated with amyotrophic lateral sclerosis/Parkinsonism-Dementia complex of Guam.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The epitheliopathy was present in 59.7% (117 of 196) patients with
      amyotrophic lateral sclerosis/parkinsonism-dementia complex, but in only
      24.7% (178 of 722) of subjects who were neurologically asymptomatic
    explanation: >-
      Supports association and incomplete sensitivity/specificity, which is why
      the examination is not represented as confirmatory.
differential_diagnoses:
- name: Parkinson disease
  disease_term:
    preferred_term: Parkinson disease
    term:
      id: MONDO:0005180
      label: Parkinson disease
  description: >-
    Parkinson disease overlaps with the bradykinetic-rigid presentation of Guam
    PDC. Dementia, motor-neuron signs, rapid progression, and the Mariana
    clinicogeographic context favor ALS-PDC, but no single premortem discriminator
    has been validated.
  distinguishing_features:
  - Guam PDC progresses relatively rapidly compared with Parkinson disease.
  - Coexisting dementia and upper- or lower-motor-neuron signs favor the Guam spectrum.
  evidence:
  - reference: PMID:10525998
    reference_title: Parkinsonism-dementia complex on Guam - overview of clinical aspects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PDC must be diagnosed so as to differentiate it from other disorders such as
      Parkinson’s disease, Alzheimer’s disease, progressive supranuclear palsy
      (PSP),
    explanation: Directly identifies Parkinson disease as a clinical differential.
- name: Alzheimer disease
  disease_term:
    preferred_term: Alzheimer disease
    term:
      id: MONDO:0004975
      label: Alzheimer disease
  description: >-
    Alzheimer disease overlaps through dementia, tau tangles, and variable Aβ
    pathology. Guam ALS-PDC adds a characteristic motor spectrum and a molecular
    tau/Aβ-prion signature that differed from sporadic Alzheimer disease in one
    postmortem bioassay cohort.
  distinguishing_features:
  - Guam ALS-PDC may include atypical parkinsonism and upper- or lower-motor-neuron disease.
  - Postmortem molecular signature differed from sporadic Alzheimer disease in the cited study.
  evidence:
  - reference: PMID:36952379
    reference_title: Guam ALS-PDC is a distinct double-prion disorder featuring both tau and Aβ prions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Applying partial least squares regression to all biochemical and prion
      infectivity measurements, we demonstrated that the ALS-PDC cohort has a
      unique molecular signature distinguishable from AD.
    explanation: >-
      Supports a postmortem biochemical distinction in the sampled cohorts, not
      a validated premortem differential test.
- name: Progressive supranuclear palsy
  disease_term:
    preferred_term: progressive supranuclear palsy
    term:
      id: MONDO:0019037
      label: progressive supranuclear palsy
  description: >-
    Progressive supranuclear palsy overlaps through atypical parkinsonism,
    rigidity, gait impairment, supranuclear ocular motor dysfunction, and
    tauopathy. Guam ALS-PDC may additionally show dementia and motor-neuron
    involvement in its characteristic geographic and familial setting.
  distinguishing_features:
  - Motor-neuron disease within the ALS-PDC spectrum is not a defining PSP feature.
  - Historical Guam or Rota ancestry and epidemiologic context support ALS-PDC but are not independently diagnostic.
  evidence:
  - reference: PMID:10525998
    reference_title: Parkinsonism-dementia complex on Guam - overview of clinical aspects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PDC must be diagnosed so as to differentiate it from other disorders such as
      Parkinson’s disease, Alzheimer’s disease, progressive supranuclear palsy
      (PSP),
    explanation: Directly identifies progressive supranuclear palsy as a clinical differential.
- name: Corticobasal degeneration
  disease_term:
    preferred_term: corticobasal degeneration disorder
    term:
      id: MONDO:0022308
      label: corticobasal degeneration disorder
  description: >-
    Corticobasal degeneration overlaps through atypical parkinsonism, cortical
    dysfunction, and tauopathy. Motor-neuron involvement and the Mariana
    clinicogeographic context may support Guam ALS-PDC but are not independently
    diagnostic.
  distinguishing_features:
  - Motor-neuron disease within the ALS-PDC spectrum is not a defining feature of corticobasal degeneration.
  - Historical Guam or Rota ancestry and epidemiologic context support ALS-PDC but are not independently diagnostic.
  evidence:
  - reference: PMID:10525998
    reference_title: Parkinsonism-dementia complex on Guam - overview of clinical aspects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: progressive supranuclear palsy (PSP), corticobasal degenera- tion (CBD),
    explanation: Directly identifies corticobasal degeneration as a clinical differential.
- name: Dementia with Lewy bodies
  disease_term:
    preferred_term: Lewy body dementia
    term:
      id: MONDO:0007488
      label: Lewy body dementia
  description: >-
    Dementia with Lewy bodies overlaps through dementia and parkinsonism. The
    Guam spectrum may additionally include motor-neuron disease and a distinct
    historical Mariana epidemiologic context, but no single premortem discriminator
    has been validated.
  distinguishing_features:
  - Motor-neuron disease within the ALS-PDC spectrum is not a defining feature of Lewy body dementia.
  - Historical Guam or Rota ancestry and epidemiologic context support ALS-PDC but are not independently diagnostic.
  evidence:
  - reference: PMID:10525998
    reference_title: Parkinsonism-dementia complex on Guam - overview of clinical aspects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: dementia with Lewy bodies (DLB).
    explanation: Directly identifies dementia with Lewy bodies as a clinical differential.
treatments:
- name: Levodopa for Early Parkinsonian Symptoms
  description: >-
    Some early-stage cases were reported to respond to levodopa. This is limited
    symptomatic evidence from a clinical overview, not evidence of durable benefit,
    disease modification, or efficacy across the ALS-PDC spectrum.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: L-dopa
      term:
        id: CHEBI:15765
        label: L-dopa
  target_phenotypes:
  - preferred_term: Parkinsonism
    term:
      id: HP:0001300
      label: Parkinsonism
  evidence:
  - reference: PMID:10525998
    reference_title: Parkinsonism-dementia complex on Guam - overview of clinical aspects.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These cases occasionally present with the same clinical picture and response
      to levodopa in the early stage.
    explanation: >-
      Supports only occasional early symptomatic response; no controlled or
      disease-modifying treatment inference is made.
animal_models:
- species: Mouse (Mus musculus)
  background: Adult male CD-1 mice fed washed cycad-flour pellets
  category: Exposure model
  description: >-
    Washed cycad flour produced progressive motor and cognitive dysfunction and
    neurodegeneration in cortex, hippocampus, substantia nigra, olfactory bulb,
    and spinal cord. The study detected little of several previously proposed
    toxins and identified BSSG as the most toxic isolated component; this is a
    partial phenocopy, not proof of human causation.
  associated_phenotypes:
  - Progressive motor dysfunction
  - Cognitive dysfunction
  - Regionally distributed neurodegeneration
  evidence:
  - reference: PMID:12095162
    reference_title: Behavioral and neurological correlates of ALS-parkinsonism dementia complex in adult mice fed washed cycad flour.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cycad-fed animals showed early evidence of progressive motor and cognitive
      dysfunctions. Neurodegeneration measured using TUNEL and caspase-3 labeling
      was found in neocortex, various hippocampal fields, substantia nigra,
      olfactory bulb, and spinal cord.
    explanation: Directly supports the model's behavioral and anatomic findings.
- species: Mouse (Mus musculus)
  background: Adult CD-1 and C57BL/6 mice chronically fed beta-sitosterol beta-D-glucoside (BSSG)
  category: Exposure model
  description: >-
    Dietary BSSG produced motor deficits, spinal motor-neuron loss, altered
    glutamate-transporter labeling, gliosis, and nigrostriatal changes. Different
    exposure schedules and backgrounds were used, and the model does not establish
    BSSG exposure or dose in human Guam ALS-PDC.
  associated_phenotypes:
  - Motor deficits
  - Spinal motor neuron loss
  - Nigrostriatal pathology
  evidence:
  - reference: PMID:18196479
    reference_title: Chronic exposure to dietary sterol glucosides is neurotoxic to motor neurons and induces an ALS-PDC phenotype.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      C57BL/6 mice fed BSSG-treated pellets for 10 weeks exhibited progressive
      loss of motor neurons in the lumbar spinal cord that continued to worsen
      even after the BSSG exposure ended.
    explanation: >-
      Directly supports progressive post-exposure motor-neuron loss in one of the
      two reported mouse backgrounds.
- species: Vervet monkey (Chlorocebus sabaeus)
  background: Chronic dietary BMAA exposure, with an L-serine co-treatment arm
  category: Exposure model
  description: >-
    Chronic BMAA exposure induced neurofibrillary tangles and amyloid deposits in
    vervets; L-serine reduced tangle density in the model. The experiment supports
    a preclinical hypothesis but does not establish comparable human exposure,
    therapeutic efficacy, or BMAA causation in Guam ALS-PDC.
  associated_phenotypes:
  - Neurofibrillary tangles
  - Amyloid deposits
  evidence:
  - reference: PMID:26791617
    reference_title: Dietary exposure to an environmental toxin triggers neurofibrillary tangles and amyloid deposits in the brain.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In replicated experiments, we found that chronic dietary exposure to a
      cyanobacterial toxin present in the traditional Chamorro diet,
      β-N-methylamino-l-alanine (BMAA), triggers the formation of both NFT and
      β-amyloid deposits similar in structure and density to those found in
      brain tissues of Chamorros who died with ALS/PDC.
    explanation: >-
      Supports neuropathologic similarity in a primate exposure model, not human
      disease causation.
experimental_models:
- name: Guam PDC patient-derived iPSC neural-cell resource
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: >-
    iPSCs from one PDC-affected Guamanian Chamorro woman and one age- and
    sex-matched healthy Chamorro resident of Saipan
  culture_system: >-
    iPSC-derived human neural progenitor cells, neurons, astrocyte progenitors,

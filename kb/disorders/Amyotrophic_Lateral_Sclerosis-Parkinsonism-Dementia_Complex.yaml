  conditions:
  - Guam PDC patient-derived line
  - Unaffected Chamorro comparison line
  evidence:
  - reference: PMID:41332773
    reference_title: Development of Patient-Derived Neuroprogenitor Cells (hNPCs), Neurons and Astrocytes to Explore the Etiology of Guam Parkinsonism-Dementia Complex (PDC).
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Development of these patient-derived iPSCs provides a human model for
      evaluating the role of environmental (e.g., cycad toxins) and genetic factors
      in ALS-PDC and possibly other related neurodegenerative diseases.
    explanation: >-
      Supports the system as a hypothesis-testing resource, not as a validated
      phenocopy of ALS-PDC.
  notes: Preprint indexed in PubMed; no disease-specific cellular abnormality was claimed in the available abstract.

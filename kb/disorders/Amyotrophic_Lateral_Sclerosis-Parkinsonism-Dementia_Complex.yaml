biochemical: []
histopathology:
- name: Widespread Mixed 3R/4R Tau Neurofibrillary Tangles
  description: >-
    Widespread neurofibrillary tangles expressing both 3R and 4R tau are the
    most prominent postmortem hallmark. The finding is characteristic but was
    not reported as pathognomonic relative to other degenerative disorders.
  diagnostic: false
  evidence:
  - reference: PMID:21527311
    reference_title: "The ALS/PDC syndrome of Guam: potential biomarkers for an enigmatic disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most prominent pathological hallmark is the widespread occurrence of
      neurofibrillary tangles which express the same balance of 3R and 4R tau
      that is found in Alzheimer disease.
    explanation: Directly establishes the principal mixed-isoform tau finding.
- name: TDP-43-Positive Neuronal and Glial Inclusions
  description: >-
    TDP-43-positive inclusions occur in neurons, oligodendroglia, and astrocytes
    across both ALS and PDC forms; the cited source does not specify cytoplasmic
    localization in its available text.
  diagnostic: false
  evidence:
  - reference: PMID:18843496
    reference_title: Enduring involvement of tau, beta-amyloid, alpha-synuclein, ubiquitin and TDP-43 pathology in the amyotrophic lateral sclerosis/parkinsonism-dementia complex of Guam (ALS/PDC).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tau and TDP-43 positive neuronal, oligodendroglial and astrocytic inclusions
      involving multiple nerve fiber tracts occurred in both the ALS and PDC types,
      reinforcing the concept that these forms are part of the same disorder.
    explanation: Direct autopsy evidence for TDP-43-positive neuronal and glial inclusions.
- name: Variable Amyloid-Beta Plaques and Alpha-Synuclein Lewy Bodies
  description: >-
    Sparse Aβ plaques and occasional α-synuclein Lewy bodies are variable
    co-pathologies. Histologic α-synuclein deposits are distinct from
    α-synuclein prion activity, which was not detected in the sampled cohorts.
  diagnostic: false
  evidence:
  - reference: PMID:36952379
    reference_title: Guam ALS-PDC is a distinct double-prion disorder featuring both tau and Aβ prions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The amyotrophic lateral sclerosis-parkinsonism dementia complex (ALS-PDC)
      of Guam is an endemic neurodegenerative disease that features widespread
      tau tangles, occasional α-synuclein Lewy bodies, and sparse β-amyloid (Aβ)
      plaques distributed in the central nervous system.
    explanation: Directly establishes occasional Lewy bodies and sparse amyloid plaques.
  - reference: PMID:36952379
    reference_title: Guam ALS-PDC is a distinct double-prion disorder featuring both tau and Aβ prions.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In ALS-PDC brain samples, we detected high titers of tau and Aβ prions, but
      we did not detect α-synuclein prions in either cohort.
    explanation: Prevents conflation of occasional Lewy bodies with detectable α-synuclein prion activity.
imaging_findings:
- name: Reduced Striatal 18F-6-Fluorodopa Uptake on PET
  modality: PET
  imaging_finding_term:
    preferred_term: reduced striatal 18F-6-fluorodopa uptake
  description: >-
    PET demonstrates reduced striatal presynaptic fluorodopa uptake in Guam
    parkinsonism. Intermediate or reduced uptake also occurred in ALS and some
    clinically normal Guamanians, so the finding is not disease-specific.
  located_in:
    preferred_term: striatum
    term:
      id: UBERON:0002435
      label: striatum
  diagnostic: false
  notes: >-
    A functional correlate of nigrostriatal damage, not a confirmatory biomarker;
    subclinical abnormalities occurred outside clinically parkinsonian subjects.
  evidence:
  - reference: PMID:2375693
    reference_title: Positron emission tomographic scanning demonstrates a presynaptic dopaminergic lesion in Lytico-Bodig. The amyotrophic lateral sclerosis-parkinsonism-dementia complex of Guam.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The parkinsonian subjects all had significantly reduced striatal
      18F-6-fluorodopa uptake. The group with amyotrophic lateral sclerosis had
      significantly reduced uptake that was intermediate between that of the
      control group and the parkinsonian group. Two Guamanian normal subjects
      had reduced striatal 18F-6-fluorodopa uptake.
    explanation: Directly documents the finding and its limited specificity.
genetic:
- name: TRPM7
  gene_term:
    preferred_term: TRPM7
    term:
      id: hgnc:17994
      label: TRPM7
  association: Candidate T1482I gene-environment susceptibility allele in a proposed low-calcium, low-magnesium context.
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  review_notes: >-
    Candidate association only. It is not represented as a causative Mendelian
    allele, and no supported causal path from TRPM7 to the observed neuropathology
    is asserted.
  evidence:
  - reference: PMID:16051700
    reference_title: A TRPM7 variant shows altered sensitivity to magnesium that may contribute to the pathogenesis of two Guamanian neurodegenerative disorders.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found a TRPM7 variant in a subset of ALS-G and PD-G patients that
      produces a protein with a missense mutation, T1482I.
    explanation: Supports a variant in a subset rather than a disease-defining causal gene.
  - reference: PMID:16051700
    reference_title: A TRPM7 variant shows altered sensitivity to magnesium that may contribute to the pathogenesis of two Guamanian neurodegenerative disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, heterologously expressed T1482I TRPM7 produces functional channels
      that show an increased sensitivity to inhibition by intracellular Mg2+.
    explanation: Directly supports the altered channel property in a heterologous system.
environmental:
- name: Cycad-Ecosystem L-BMAA Ingestion (Candidate)
  description: >-
    Ingestion of L-BMAA through cycad-associated foods, including proposed
    trophic transfer through flying foxes, is a historically important exposure
    hypothesis. Ecosystem biomagnification was reported, but a causal human dose
    and a causal relationship to Guam ALS-PDC have not been established.
  exposure_term:
    preferred_term: L-BMAA dietary exposure
    term:
      id: ECTO:0000231
      label: exposure to chemical
  chemicals:
  - L-BMAA
  effect: Candidate neurotoxic trigger; human causality remains unresolved.
  review_notes: >-
    Retained only as the environmental exposure corresponding to the alternative
    BMAA hypothesis. The ingestion route is ExO:0000056 (ingestion), recorded
    here in free text because that route term is outside the ExposureTerm schema
    root and therefore cannot be bound in exposure_term.
  evidence:
  - reference: PMID:14612559
    reference_title: Biomagnification of cyanobacterial neurotoxins and neurodegenerative disease among the Chamorro people of Guam.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Flying foxes are a prized food item of the indigenous Chamorro people who
      boil them in coconut cream and eat them whole.
    explanation: Supports a proposed ingestion route but not a causal or sufficient human exposure dose.
  - reference: PMID:28598725
    reference_title: A critical review of the postulated role of the non-essential amino acid, β-N-methylamino-L-alanine, in neurodegenerative disease in humans.
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      The review concludes that the hypothesis of a causal BMAA neurodegenerative
      disease relationship is not supported by existing data.
    explanation: Directly records the critical review's conclusion against a demonstrated causal relationship.
  - reference: PMID:36952379
    reference_title: Guam ALS-PDC is a distinct double-prion disorder featuring both tau and Aβ prions.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extensive studies of genetic or environmental factors have failed to
      identify a cause of ALS-PDC.
    explanation: Confirms that environmental causation remains unresolved.
diagnosis:
- name: Neurological Physical Examination
  description: >-
    Examination identifies the combined rigido-akinetic, pyramidal,
    lower-motor-neuron, gait, and cognitive syndrome and helps assign a clinical
    form. The findings are syndromic rather than etiologically confirmatory.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: MAXO:0000527
      label: physical examination
  results: Rigido-akinetic parkinsonism, rigidity, gait disturbance, hyperreflexia, distal amyotrophy, or an ALS syndrome in the appropriate Guam context.
  evidence:
  - reference: PMID:10525998
    reference_title: Parkinsonism-dementia complex on Guam - overview of clinical aspects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Important diagnostic indicators of the illness include rigido-akinetic type
      Parkinsonism and severe dementia.
    explanation: Establishes key examination indicators of the PDC-predominant form.
- name: Cognitive Assessment
  description: >-
    Cognitive assessment characterizes the progressive global dementia component
    but does not distinguish Guam ALS-PDC from other neurodegenerative diseases.
  diagnosis_term:
    preferred_term: cognitive assessment
    term:
      id: MAXO:0009017
      label: cognitive assessment
  results: Progressive global intellectual decline with memory, orientation, personality, and behavioral change.
  evidence:
  - reference: PMID:10525998
    reference_title: Parkinsonism-dementia complex on Guam - overview of clinical aspects.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dementia in PDC is characterized by a progressive dulling of all
      intellectual faculties, recent memory deﬁcits, disorien- tation in time,
      place and then person, as well as personality and behavioral changes.
    explanation: Supports the cognitive domains requiring assessment without validating a specific test instrument.
- name: Striatal Fluorodopa PET
  description: >-
    18F-6-fluorodopa PET can demonstrate presynaptic nigrostriatal dysfunction,
    but reduced uptake also occurred in Guam ALS and clinically normal Guam
    subjects and therefore is not confirmatory.
  diagnosis_term:
    preferred_term: positron emission tomography procedure
    term:
      id: MAXO:0000137
      label: positron emission tomography procedure
  results: Reduced striatal 18F-6-fluorodopa uptake, with the strongest reduction in clinically parkinsonian subjects.
  evidence:
  - reference: PMID:2375693
    reference_title: Positron emission tomographic scanning demonstrates a presynaptic dopaminergic lesion in Lytico-Bodig. The amyotrophic lateral sclerosis-parkinsonism-dementia complex of Guam.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The nigrostriatal lesions in the subjects with amyotrophic lateral sclerosis
      and the Guamanian normal subjects are examples of subclinical neuronal damage
      demonstrable in living subjects with positron emission tomography.
    explanation: Supports PET detection of living-subject neuronal damage while demonstrating limited diagnostic specificity.
- name: Postmortem Neuropathologic Examination
  description: >-
    A 2011 review reported that Guam and Kii ALS/PDC could then be confirmed only
    by postmortem examination. This is retained as historical diagnostic context,
    not a timeless claim that no premortem biomarker can ever be available.
  diagnosis_term:
    preferred_term: autopsy procedure
    term:
      id: MAXO:0000139
      label: autopsy procedure
  results: Widespread mixed 3R/4R tau neurofibrillary pathology with associated protein lesions in a compatible clinicogeographic syndrome.
  evidence:
  - reference: PMID:21527311
    reference_title: "The ALS/PDC syndrome of Guam: potential biomarkers for an enigmatic disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      At present, ALS/PDC of Guam and the Kii Peninsula can be confirmed only by
      postmortem examination.
    explanation: Records the review's 2011 confirmation standard with explicit temporal scope.

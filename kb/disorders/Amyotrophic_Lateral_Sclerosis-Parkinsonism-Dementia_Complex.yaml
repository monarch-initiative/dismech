- category: Neurological
  name: Abnormal Eye Movement
  description: >-
    A 37-patient Lytico-Bodig series found supranuclear eye or lid motor
    abnormalities in every examined patient, with heterogeneous pursuit, gaze,
    vestibulo-ocular, convergence, fixation, nystagmus, and eyelid findings. A
    separate clinical review described ocular motility as usually intact and
    vertical gaze impairment as rare, so population frequency remains uncertain.
  review_notes: >-
    Deliberately left outside the causal pathograph because the series establishes
    the examination finding but not which Guam ALS-PDC mechanism produces it. The
    all-37 examination series conflicts directly with the lower frequency described
    in PMID:10525998; neither estimate is generalized beyond its source.
  phenotype_term:
    preferred_term: Abnormality of eye movement
    term:
      id: HP:0000496
      label: Abnormality of eye movement
  evidence:
  - reference: PMID:3194062
    reference_title: Supranuclear disturbances of ocular motility in Lytico-Bodig.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found abnormal supranuclear ocular or lid motility in all of 37 patients
      with Lytico-Bodig (amyotrophic lateral sclerosis/parkinsonism-dementia
      complex).
    explanation: >-
      Supports the phenotype in the examined series while preserving the cohort
      denominator and avoiding a universal disease-level frequency claim.
  - reference: PMID:10525998
    reference_title: Parkinsonism-dementia complex on Guam - overview of clinical aspects.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ocular motility usually remains intact, although in rare cases vertical gaze,
      especially upward, ultimately becomes impaired.
    explanation: >-
      Supports rare vertical-gaze impairment while conflicting with the all-patient
      frequency reported in the separate 37-patient ocular-motor series.
- category: Ophthalmologic
  name: Linear Retinal Pigment Epitheliopathy
  description: >-
    Linear retinal pigment epitheliopathy was associated with prevalent Guam
    ALS-PDC and predicted incident neurologic disease in a longitudinal subset.
    It is a risk marker rather than a specific or confirmatory diagnostic finding.
  phenotype_term:
    preferred_term: Linear retinal pigment epitheliopathy
  review_notes: >-
    No exact HP term for the linear Guam lesion was identified; a broader retinal
    pigment epithelial mottling or atrophy term was not substituted.
  evidence:
  - reference: PMID:26153661
    reference_title: A unique retinal epitheliopathy is associated with amyotrophic lateral sclerosis/Parkinsonism-Dementia complex of Guam.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prospectively, 15 of 50 cases with epitheliopathy developed amyotrophic
      lateral sclerosis/parkinsonism-dementia complex, compared to 4 of 189 cases
      without epitheliopathy (age- and sex-adjusted hazard ratio: 13.1; 95% CI:
      4.0-43.1; P < 0.0001).
    explanation: >-
      Directly supports prospective association in the reported cohort without
      asserting etiologic causation or diagnostic specificity.

epidemiology:
- name: Historical Guam hyperendemicity
  description: >-
    Mid-twentieth-century Guam surveys reported ALS incidence, prevalence, and
    mortality roughly 50-100 times rates reported elsewhere.
  evidence:
  - reference: PMID:10525998
    reference_title: Parkinsonism-dementia complex on Guam - overview of clinical aspects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical and epidemiologic studies from 1949 to 1954 demonstrated a
      phenomenal frequency of ALS (Lytico) on Guam; its incidence, prevalence,
      and mortality rates were estimated to be about 50-100 times as high as
      those reported elsewhere.
    explanation: Documents the historical relative excess without inventing an absolute rate.
- name: Declining Guam prevalence
  description: >-
    Later Guam autopsy series were assembled against a background of declining
    disease prevalence; the decline motivates environmental hypotheses but does
    not establish a specific exposure as causal.
  evidence:
  - reference: PMID:18843496
    reference_title: "Enduring involvement of tau, beta-amyloid, alpha-synuclein, ubiquitin and TDP-43 pathology in the amyotrophic lateral sclerosis/parkinsonism-dementia complex of Guam (ALS/PDC)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since the prevalence is declining, we examined brain tissue from 35
      clinically diagnosed Chamorro patients with ALS/PDC and two Chamorro
      controls autopsied between 1946 and 2006, to determine if distinct
      variations in the pathology could be identified up to this time.
    explanation: Directly documents declining prevalence in the Guam cohort context.
- name: Divergent late-century incidence trajectories
  description: >-
    Case-registration data from 1940-1999 showed a sustained decline in Guam ALS
    incidence, whereas PDC incidence declined until the late 1980s and then rose
    slightly over 1980-1999. The authors considered the rapid change inconsistent
    with a purely genetic explanation, but the study did not identify a specific
    causal exposure.
  evidence:
  - reference: PMID:12522022
    reference_title: "Amyotrophic lateral sclerosis and parkinsonism-dementia complex of Guam: changing incidence rates during the past 60 years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results of this study confirmed that the incidence of ALS declined
      steadily during the past 40 years. The incidence of PDC also declined until
      the late 1980s but, unlike ALS, showed a slight increase from 1980 to 1999.
    explanation: >-
      Directly supports the distinct ALS and PDC incidence trajectories without
      treating incidence as prevalence or inferring a particular exposure.
- name: Guam and Rota geographic focus
  description: >-
    The historical Mariana syndrome affected Chamorros on Guam and Rota; this
    record does not merge the distinct Kii and West Papua foci into the MONDO
    Guam disease identity.
  evidence:
  - reference: PMID:28598725
    reference_title: "A critical review of the postulated role of the non-essential amino acid, β-N-methylamino-L-alanine, in neurodegenerative disease in humans."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A neurodegenerative disease with a spectrum of symptoms that affected
      Chamorros in Guam, Rota, and other Mariana Islands was initially described
      in a 1936 case history of a patient exhibiting symptoms of both Parkinsonism
      and dementia.
    explanation: Supports the bounded Guam/Rota Mariana scope used for this entry.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_guam_multiple_proteinopathy
  hypothesis_label: Observed Guam Multiple-Proteinopathy and Regional Neurodegeneration
  status: CANONICAL
  description: >-
    The default disease model is etiology-agnostic: observed tau-dominant
    neurofibrillary pathology and TDP-43 inclusions accompany degeneration of
    motor and nigrostriatal systems and neuronal pathology accompanying cognitive
    manifestations. Human studies establish the
    lesions and clinical spectrum but do not establish which protein lesion is
    primary or the direction of causation between them.
  applies_to_subtypes:
  - ALS-predominant
  - PDC-predominant
  - Mixed ALS-PDC
  evidence:
  - reference: PMID:18843496
    reference_title: "Enduring involvement of tau, beta-amyloid, alpha-synuclein, ubiquitin and TDP-43 pathology in the amyotrophic lateral sclerosis/parkinsonism-dementia complex of Guam (ALS/PDC)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tau and TDP-43 positive neuronal, oligodendroglial and astrocytic inclusions
      involving multiple nerve fiber tracts occurred in both the ALS and PDC types,
      reinforcing the concept that these forms are part of the same disorder.
    explanation: Guam autopsy evidence supports the shared mixed-proteinopathy spectrum.
  - reference: PMID:36952379
    reference_title: Guam ALS-PDC is a distinct double-prion disorder featuring both tau and Aβ prions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In ALS-PDC brain samples, we detected high titers of tau and Aβ prions,
      but we did not detect α-synuclein prions in either cohort.
    explanation: Cellular bioassays of human brain extracts establish tau and amyloid-beta prion activity while distinguishing it from alpha-synuclein prion activity.
- hypothesis_group_id: cycad_bmaa_neurotoxicity_model
  hypothesis_label: Cycad-Derived L-BMAA Neurotoxicity Model
  status: ALTERNATIVE
  description: >-
    Chronic dietary L-BMAA exposure through traditional cycad-associated foods is
    proposed to cause glutamate-receptor-mediated motor-neuron injury and, based
    on a primate model, tau and amyloid-beta pathology. The mechanistic steps are
    experimentally supported in cells and vervets, but human Guam causation is
    not established and a critical review found the causal hypothesis unsupported.
  evidence:
  - reference: PMID:26791617
    reference_title: Dietary exposure to an environmental toxin triggers neurofibrillary tangles and amyloid deposits in the brain.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In replicated experiments, we found that chronic dietary exposure to a
      cyanobacterial toxin present in the traditional Chamorro diet,
      β-N-methylamino-l-alanine (BMAA), triggers the formation of both NFT and
      β-amyloid deposits similar in structure and density to those found in
      brain tissues of Chamorros who died with ALS/PDC.
    explanation: Vervet experiments support the model but cannot establish human Guam causation.
  - reference: PMID:28598725
    reference_title: "A critical review of the postulated role of the non-essential amino acid, β-N-methylamino-L-alanine, in neurodegenerative disease in humans."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      The review concludes that the hypothesis of a causal BMAA neurodegenerative
      disease relationship is not supported by existing data.
    explanation: A critical review directly challenges the human causal interpretation.
pathophysiology:
- name: Tau-Dominant Neurofibrillary Pathology
  description: >-
    Widespread neuronal tau tangles are the dominant, consistently observed
    postmortem lesion in Guam ALS-PDC. Human bioassays also detect abundant tau
    prion activity. These observations establish the pathology but not its
    initiating cause or whether tau is the sole driver of regional neuronal loss.
  role: central_effector
  mechanism_confidence: ESTABLISHED
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: inclusion body assembly
    term:
      id: GO:0070841
      label: inclusion body assembly
    modifier: INCREASED
  evidence:
  - reference: PMID:36952379
    reference_title: Guam ALS-PDC is a distinct double-prion disorder featuring both tau and Aβ prions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The amyotrophic lateral sclerosis-parkinsonism dementia complex (ALS-PDC)
      of Guam is an endemic neurodegenerative disease that features widespread
      tau tangles, occasional α-synuclein Lewy bodies, and sparse β-amyloid (Aβ)
      plaques distributed in the central nervous system.
    explanation: Directly establishes widespread tau tangles in Guam ALS-PDC.
  - reference: PMID:21527311
    reference_title: "The ALS/PDC syndrome of Guam: potential biomarkers for an enigmatic disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most prominent pathological hallmark is the widespread occurrence of
      neurofibrillary tangles which express the same balance of 3R and 4R tau
      that is found in Alzheimer disease.
    explanation: The Guam review identifies widespread mixed 3R/4R tangles as the principal pathologic hallmark.
  - reference: PMID:38100415
    reference_title: Tau filaments from amyotrophic lateral sclerosis/parkinsonism-dementia complex adopt the CTE fold.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we used electron cryo-microscopy to determine the structures of tau
      filaments from the cerebral cortex of three cases of ALS/PDC from Guam and
      eight cases from Kii, as well as from the spinal cord of two of the Guam cases.
      Tau filaments had the chronic traumatic encephalopathy (CTE) fold, with
      variable amounts of Type I and Type II filaments.
    explanation: >-
      Establishes the filament fold in the three sampled Guam cortices and two
      sampled Guam spinal cords; it does not establish why that fold formed.
  - reference: PMID:41509476
    reference_title: Guam amyotrophic lateral sclerosis/parkinsonism-dementia complex (ALS/PDC) features CTE-like tau seeds in brain and spinal cord.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      First, we confirmed the detection of tau seeding activity in ALS/PDC brain
      samples in tau biosensor cells. Notably, we could also detect potent tau
      seeding activity in spinal cord.
    explanation: >-
      This PubMed-indexed bioRxiv preprint supports tau-seeding activity in sampled
      Guam brain and spinal-cord extracts; it remains pending peer review and does
      not establish the initiating cause.
  downstream:
  - target: Dementia-Associated Neuronal Dysfunction
    description: >-
      Neocortical tau pathology accompanies the dementia-bearing disease, but
      the human evidence does not resolve the causal intermediates or establish
      tau as the sole cause of cognitive decline.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - canonical_guam_multiple_proteinopathy
    evidence:
    - reference: PMID:36952379
      reference_title: Guam ALS-PDC is a distinct double-prion disorder featuring both tau and Aβ prions.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        We found that all of the neocortical brain samples from 20 donors with
        ALS-PDC contained tau prions, but none of the samples had detectable
        α-synuclein prions.
      explanation: >-
        Human neocortical tissue supports regional tau involvement, while the
        direction from tau pathology to cognitive dysfunction remains inferential.
  - target: Nigrostriatal Dopaminergic Dysfunction
    description: >-
      Tau pathology and presynaptic dopaminergic dysfunction coexist in the PDC
      form; a direct tau-to-nigrostriatal causal route has not been demonstrated.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - canonical_guam_multiple_proteinopathy
    evidence:
    - reference: PMID:18843496
      reference_title: "Enduring involvement of tau, beta-amyloid, alpha-synuclein, ubiquitin and TDP-43 pathology in the amyotrophic lateral sclerosis/parkinsonism-dementia complex of Guam (ALS/PDC)."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Guam ALS/PDC is a severe tangle forming disorder endemic to Guam with
        features overlapping such neurodegenerative disorders as Alzheimer
        disease (AD), Parkinson disease (PD), progressive supranuclear palsy
        (PSP), ALS, corticobasal degeneration (CBD) and pallido-ponto-nigral
        degeneration (PPND).
      explanation: Connects the Guam tangle disorder to its parkinsonian clinical-pathologic context without proving causality.
    - reference: PMID:2375693
      reference_title: Positron emission tomographic scanning demonstrates a presynaptic dopaminergic lesion in Lytico-Bodig. The amyotrophic lateral sclerosis-parkinsonism-dementia complex of Guam.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: The parkinsonian subjects all had significantly reduced striatal 18F-6-fluorodopa uptake.
      explanation: Independently establishes the nigrostriatal dopaminergic lesion in living Guam PDC subjects.
- name: TDP-43-Positive Cellular Inclusions

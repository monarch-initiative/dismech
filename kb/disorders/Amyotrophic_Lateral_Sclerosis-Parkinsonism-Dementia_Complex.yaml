discussions:
- discussion_id: gap_guam_alspdc_etiology
  prompt: What initiates Guam ALS-PDC, and how do genetic susceptibility and historical environmental change interact?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Tau-Dominant Neurofibrillary Pathology
  - pathophysiology#TDP-43-Positive Cellular Inclusions
  rationale: >-
    Human studies establish a mixed proteinopathy and changing incidence, but no
    genetic variant, dietary toxin, mineral exposure, or other environmental factor
    has been shown to be necessary or sufficient. The rapid temporal change argues
    against a purely genetic cause without identifying the responsible exposure.
  evidence:
  - reference: PMID:36952379
    reference_title: Guam ALS-PDC is a distinct double-prion disorder featuring both tau and Aβ prions.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Extensive studies of genetic or environmental factors have failed to
      identify a cause of ALS-PDC.
    explanation: Directly states the unresolved etiologic gap.
  - reference: PMID:12522022
    reference_title: "Amyotrophic lateral sclerosis and parkinsonism-dementia complex of Guam: changing incidence rates during the past 60 years."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The rapid decrease in incidence is not likely to be due to genetic factors.
    explanation: >-
      Constrains a purely genetic explanation but does not identify an alternative cause.
- discussion_id: gap_cycad_model_to_human_translation
  prompt: Do BMAA, sterol glucosides, or another cycad constituent reproduce the initiating human exposure and mechanism of Guam ALS-PDC?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#L-BMAA Neurotoxic Exposure
  - pathophysiology#AMPA/Kainate Receptor Overactivation and Calcium Overload
  rationale: >-
    Mouse and vervet exposure models reproduce selected motor, cognitive, tau,
    amyloid, or motor-neuron readouts, but exposure identity and dose in affected
    people remain unresolved. The sterol-glucoside and L-BMAA models must not be
    collapsed into one exposure, and partial phenocopy does not demonstrate human
    causation.
  evidence:
  - reference: PMID:12095162
    reference_title: Behavioral and neurological correlates of ALS-parkinsonism dementia complex in adult mice fed washed cycad flour.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: These data are consistent with a number of major features of ALS-PDC in humans.
    explanation: The authors claim consistency with selected features, not complete model fidelity.
  - reference: PMID:28598725
    reference_title: "A critical review of the postulated role of the non-essential amino acid, β-N-methylamino-L-alanine, in neurodegenerative disease in humans."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      The review concludes that the hypothesis of a causal BMAA neurodegenerative
      disease relationship is not supported by existing data.
    explanation: Directly records the gap between experimental BMAA findings and demonstrated human causation.
- discussion_id: gap_premortem_case_definition_and_biomarkers
  prompt: Which premortem biomarker combination can distinguish Guam ALS-PDC from overlapping neurodegenerative disorders?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - diagnosis#Postmortem Neuropathologic Examination
  rationale: >-
    Clinical examination, ocular findings, retinal epitheliopathy, and fluorodopa
    PET are informative but individually nonspecific. No contemporary validated
    premortem case definition or biomarker panel was identified in the reviewed
    literature.
  evidence:
  - reference: PMID:21527311
    reference_title: "The ALS/PDC syndrome of Guam: potential biomarkers for an enigmatic disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There are as yet no identified pathological features that will clearly
      distinguish the Guam or Kii ALS/PDC syndrome from other degenerative
      neurological disorders.
    explanation: Directly supports the differential-diagnostic biomarker gap as assessed in 2011.
- discussion_id: gap_disease_modifying_treatment_and_trials
  prompt: Which interventions alter progression or survival in Guam ALS-PDC rather than only treating symptoms?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    The retained literature supports only occasional early levodopa response.
    Searches of the disease literature and ClinicalTrials.gov through 2026-08-04
    identified no Guam ALS-PDC-specific controlled therapeutic trial or established
    disease-modifying intervention. Trials in sporadic ALS, Parkinson disease, or
    progressive supranuclear palsy were not generalized to this complex.
  evidence:
  - reference: PMID:10525998
    reference_title: Parkinsonism-dementia complex on Guam - overview of clinical aspects.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These cases occasionally present with the same clinical picture and response

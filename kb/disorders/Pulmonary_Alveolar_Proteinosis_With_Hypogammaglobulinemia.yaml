- name: Alveolar Macrophage Dysfunction
  description: >-
    Alveolar macrophages clear secreted surfactant. In this disease they are
    small and non-foamy and show impaired maturation, phagocytosis and GM-CSF
    responsiveness, unlike the large foamy macrophages of autoimmune PAP.
    GM-CSF receptor expression and GM-CSF-induced STAT5 phosphorylation are
    reduced in patient blood monocytes, the precursors of alveolar
    macrophages; that this impairs the GM-CSF-dependent surfactant-catabolism
    program in the alveolar macrophages themselves is inferred, not measured.

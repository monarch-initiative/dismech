name: Pulmonary Alveolar Proteinosis With Hypogammaglobulinemia
creation_date: "2026-10-01T20:22:03Z"
category: Mendelian
description: >-
  Pulmonary alveolar proteinosis with hypogammaglobulinemia (PAPHG), also
  described as OAS1-associated polymorphic autoinflammatory immunodeficiency
  (OPAID), is an ultra-rare autosomal dominant inborn error of immunity caused
  by heterozygous, mostly de novo, gain-of-function missense variants in OAS1.
  Affected infants are well at birth and develop pulmonary alveolar proteinosis
  with progressive respiratory insufficiency in the first months of life, often
  after a viral-like respiratory illness, together with hypogammaglobulinemia,
  leukocytosis, splenomegaly, and flares of recurrent fever, ulcerative skin
  rash and diarrhea. Variant OAS1 synthesizes 2'-5'-oligoadenylate without its
  double-stranded RNA trigger once interferon induces its expression, activating
  RNase L, which degrades cellular RNA, arrests translation, and drives apoptosis
  and dysfunction of monocytes, alveolar macrophages and differentiating B cells.
  Defective alveolar macrophage clearance of surfactant produces the proteinosis,
  and B-cell loss produces the antibody deficiency. Mortality from respiratory
  failure in infancy and childhood is high; allogeneic hematopoietic stem cell
  transplantation is curative, while whole lung lavage and immunoglobulin
  replacement are bridging measures.
synonyms:
- PAPHG
- OAS1-associated polymorphic autoinflammatory immunodeficiency
- OPAID
- immunodeficiency (due to OAS1 gain-of-function variant) with pulmonary alveolar proteinosis and hypogammaglobulinemia
- infantile-onset pulmonary alveolar proteinosis-hypogammaglobulinemia
disease_term:
  preferred_term: pulmonary alveolar proteinosis with hypogammaglobulinemia
  term:

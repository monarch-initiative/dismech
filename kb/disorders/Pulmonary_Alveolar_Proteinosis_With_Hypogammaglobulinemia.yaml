inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous OAS1 gain-of-function variants act dominantly. Most cases are
    sporadic and arise de novo; one sibship of three inherited the variant from
    a mother with low-level (3.81%) somatic mosaicism in blood.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:29455859
    reference_title: "Heterozygous Mutations in OAS1 Cause Infantile-Onset Pulmonary Alveolar Proteinosis with Hypogammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deep sequence analysis with next-generation sequencing indicated 3.81% mosaicism of this variant in DNA from their mother's peripheral blood leukocytes, suggesting that PAP observed in this family could be inherited as an autosomal-dominant trait from the mother."
    explanation: >-
      Transmission of a heterozygous OAS1 variant from a mosaic mother to three
      affected siblings supports dominant inheritance.
  - reference: PMID:34145065
    reference_title: "Heterozygous OAS1 gain-of-function variants cause an autoinflammatory immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All reported pathogenic OAS1 variants are de novo, absent from genomic databases and cause highly lethal early-onset OPAID"
    explanation: >-
      The six-patient series found every pathogenic variant to be de novo.
genetic:
- name: OAS1
  gene_term:
    preferred_term: OAS1
    term:
      id: hgnc:8086
      label: OAS1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    Four recurrent heterozygous missense variants are reported (NM_016816.3):
    c.227C>T p.Ala76Val, c.326G>A p.Cys109Tyr, p.Val121Gly and c.592C>G
    p.Leu198Val. The first series predicted them as tolerated or benign by
    several in-silico tools, so pathogenicity rests on segregation, de novo
    occurrence and the functional gain-of-function assays. The 2026 review
    writes p.Ala76Val as A72V in one sentence; the primary reports give A76V.
    No ClinGen gene-disease validity record for OAS1 was found in the local
    reference cache.
  evidence:
  - reference: PMID:29455859
    reference_title: "Heterozygous Mutations in OAS1 Cause Infantile-Onset Pulmonary Alveolar Proteinosis with Hypogammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified two additional de novo heterozygous missense variations of OAS1 in two unrelated simplex individuals also manifesting infantile-onset PAP with hypogammaglobulinemia."
    explanation: >-
      De novo OAS1 variants in two unrelated affected infants, in addition to
      the familial variant, establish OAS1 as the disease gene.
  - reference: PMID:34145065
    reference_title: "Heterozygous OAS1 gain-of-function variants cause an autoinflammatory immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified four de novo heterozygous OAS1 missense variants (OAS1-A76V, OAS1-C109Y, OAS1-V121G, OAS1-L198V) and excluded hematopoietic mosaicism"
    explanation: >-
      An independent six-patient series identifies four de novo heterozygous
      OAS1 missense variants.
pathophysiology:
- name: Interferon-Induced Variant OAS1 Expression
  description: >-
    OAS1 is an interferon-stimulated gene. Type I interferon released during
    common, often viral, respiratory infections raises expression of the variant
    protein, which is the point at which its abnormal activity becomes
    consequential. The hypogammaglobulinemia is already present in the neonatal
    period, before natural virus exposure, so infection is a trigger of flares
    and of PAP onset rather than a requirement for every feature.
  conforms_to: "innate_antiviral_interferon_response#Type I and III Interferon Induction and JAK-STAT Signaling"
  biological_scale: CELLULAR
  genes:

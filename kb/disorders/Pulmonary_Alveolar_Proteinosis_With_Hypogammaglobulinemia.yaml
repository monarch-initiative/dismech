- name: Myeloid-Driven Systemic Autoinflammation
  description: >-
    Dysfunctional and dying monocytes and macrophages release pro-inflammatory
    damage-associated molecular patterns, and selective RNase L-mediated decay
    spares innate-immunity messages while arresting housekeeping translation,
    creating a self-sustaining inflammatory loop that drives recurrent fever,
    dermatitis and inflammatory bowel disease.
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:34145065
    reference_title: "Heterozygous OAS1 gain-of-function variants cause an autoinflammatory immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The resulting selective transcription and translation of innate immunity mRNAs and proteins combined with a translational arrest of metabolic and housekeeping genes may create a positive feedback loop that builds up an inflammatory immune response"
    explanation: >-
      Describes the self-sustaining inflammatory loop driving the systemic
      autoinflammatory features.
  downstream:
  - target: Recurrent fever
    causal_link_type: DIRECT
  - target: Inflammatory skin rash
    causal_link_type: DIRECT
  - target: Gastrointestinal inflammation
    causal_link_type: DIRECT

treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    Allogeneic HSCT replaces the OAS1-variant hematopoietic compartment,
    including monocyte-derived alveolar macrophages and B cells, and is the only
    reported curative treatment; several transplanted patients recovered
    completely from PAP.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C46089
      label: Allogeneic Hematopoietic Stem Cell Transplantation
  target_mechanisms:
  - target: Alveolar Macrophage Dysfunction
    description: >-
      Donor-derived macrophages restore alveolar surfactant clearance.
    evidence:
    - reference: PMID:29455859
      reference_title: "Heterozygous Mutations in OAS1 Cause Infantile-Onset Pulmonary Alveolar Proteinosis with Hypogammaglobulinemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "two affected individuals (B-II-1 and C-II-1) received successful HSCT and recovered completely from PAP"
      explanation: >-
        Replacing the hematopoietic compartment corrects the macrophage defect
        and resolves the proteinosis.
  evidence:
  - reference: PMID:34145065
    reference_title: "Heterozygous OAS1 gain-of-function variants cause an autoinflammatory immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RNase L inhibition with curcumin modulated and allogeneic hematopoietic cell transplantation cured the disorder."
    explanation: >-
      The six-patient series reports allogeneic HCT as curative.
- name: Whole Lung Lavage
  description: >-
    Repeated large-volume saline lavage physically removes accumulated alveolar
    surfactant and stabilizes the respiratory course as a bridge until a
    definitive diagnosis and HSCT.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: whole lung lavage
    term:
      id: NCIT:C38068
      label: Lavage
  target_mechanisms:
  - target: Alveolar Surfactant Accumulation
    description: >-
      Lavage mechanically clears the accumulated surfactant.
    evidence:
    - reference: PMID:34647697
      reference_title: "Pulmonary alveolar proteinosis due to heterozygous mutation in OAS1: Whole lung lavages for long-term bridging to hematopoietic stem cell transplantation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "monthly WLLs were started, which stabilized the clinical course for over 2 years until a disease-causing OAS1 variant was diagnosed and the patient was successfully treated by hematopoietic stem cell transplantation (HSCT)"
      explanation: >-
        Whole lung lavage stabilized a patient for over two years as a bridge to
        HSCT.
- name: Immunoglobulin Replacement
  description: >-
    Intravenous immunoglobulin replaces the deficient antibody and transiently
    improved respiratory symptoms and systemic inflammation, but did not correct
    alveolar macrophage dysfunction or halt PAP progression.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
  target_phenotypes:
  - preferred_term: Hypogammaglobulinemia
    term:
      id: HP:0004313
      label: Decreased circulating immunoglobulin concentration
  evidence:
  - reference: PMID:29455859
    reference_title: "Heterozygous Mutations in OAS1 Cause Infantile-Onset Pulmonary Alveolar Proteinosis with Hypogammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exogenous IgG improved respiratory symptoms and decreased systemic inflammatory responses in A-II-4, B-II-1, and C-II-1."
    explanation: >-
      Immunoglobulin replacement improved symptoms and inflammation without
      curing the disease.

notes: >-
  No GeneReviews chapter covers this disease; just check-genereviews against the
  committed Bookshelf index returned no chapter for the entry name or its synonyms.
  The MONDO record cross-references OMIM:618042 and Orphanet ORPHA:572428. The
  2026 review cited here counts 10 cases from eight pedigrees, so the phenotype
  frequencies below rest on very small numbers and are given only where the two
  primary series agree. Proteinuria and terminal glomerulosclerosis were reported
  in single patients of the first series, and the authors could not separate a
  disease effect from transplant-related injury, so they are not curated as
  phenotypes here.

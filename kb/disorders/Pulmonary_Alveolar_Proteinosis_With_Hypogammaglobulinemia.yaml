    quote_role: REVIEW_SYNTHESIS
    evidence_source: IN_VITRO
    snippet: "Basal levels of OAS1 expression are particularly high in monocytes/macrophages and B cells, and are further induced by IFNs, potentially accounting for the lineage-specific dysfunctions underlying the characteristic symptoms"
    explanation: >-
      OAS1 is highly expressed and interferon-inducible in the two lineages the
      disease damages.
  - reference: PMID:41512080
    reference_title: "The OAS-RNase L pathway: Insights from experiments of nature."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Intriguingly, hypogammaglobulinemia in OAS1-GOF patients occurred during the neonatal period, before any natural exposure to viruses."
    explanation: >-
      Qualifies the infection-triggered model: antibody deficiency precedes
      natural virus exposure.

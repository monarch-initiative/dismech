diagnosis:
- name: Exome Sequencing
  description: >-
    Exome or targeted sequencing identifies the heterozygous OAS1 missense
    variant, usually de novo, after the known genetic PAP genes have been
    excluded. Parental testing should include deep sequencing, because
    low-level parental mosaicism can be missed by Sanger sequencing.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:29455859
    reference_title: "Heterozygous Mutations in OAS1 Cause Infantile-Onset Pulmonary Alveolar Proteinosis with Hypogammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed whole-exome sequence analysis in a family affected by infantile-onset PAP with hypogammaglobulinemia without causative mutations in genes associated with PAP: SFTPB, SFTPC, ABCA3, CSF2RA, CSF2RB, and GATA2."
    explanation: >-
      Exome sequencing, after exclusion of the established PAP genes, found
      the OAS1 variant.
  - reference: PMID:29455859
    reference_title: "Heterozygous Mutations in OAS1 Cause Infantile-Onset Pulmonary Alveolar Proteinosis with Hypogammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deep sequence analysis with next-generation sequencing indicated 3.81% mosaicism of this variant in DNA from their mother's peripheral blood leukocytes"
    explanation: >-
      Deep sequencing detected low-level maternal mosaicism, which bears on
      recurrence risk.
- name: Bronchoalveolar Lavage
  description: >-
    Lavage fluid shows the proteinaceous material of PAP together with small,
    non-foamy alveolar macrophages, unlike the large foamy macrophages of
    autoimmune PAP. PAP was diagnosed by lavage in four of the five patients
    of the first series.

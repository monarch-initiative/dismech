  - reference: PMID:30349415
    reference_title: 'Evans syndrome: clinical perspectives, biological insights and treatment modalities.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'CTLA-4 or CD152 is an inhibitory transmembrane receptor at the surface of regulatory
      T-cells that bind with a high affinity to CD80/CD86 molecules in antigen-presenting cells with
      subsequent endocytosis and downregulation contributing to immune homeostasis.'
    explanation: Gives the molecular function whose loss produces the phenotype.
- name: LRBA
  gene_term:
    preferred_term: LRBA
    term:
      id: hgnc:1742
      label: LRBA
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Deficiency causing secondary loss of CTLA-4 protein
  notes: >-
    LRBA deficiency phenocopies CTLA-4 haploinsufficiency by a different route:
    LRBA rescues endocytosed CTLA-4 from degradation, so losing it depletes the
    same brake without touching the CTLA4 gene. The two therefore belong together
    in this entry rather than as independent findings.
  evidence:
  - reference: PMID:30349415
    reference_title: 'Evans syndrome: clinical perspectives, biological insights and treatment modalities.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'LRBA is an intracellular protein that binds to CTLA-4 cytoplasmic fraction in
      regulatory T-cells following its endocytosis, avoiding its degradation.'
    explanation: States the mechanistic relationship between LRBA and CTLA-4 that makes the two
      deficiencies converge.
  - reference: PMID:30349415
    reference_title: 'Evans syndrome: clinical perspectives, biological insights and treatment modalities.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'CTLA-4, LRBA, KRAS, STAT3 gain-of-function mutations are associated with ES secondary
      to a loss of T-cell homeostasis.'
    explanation: Names LRBA among the associated genes in a paediatric cohort.
- name: TPP2
  gene_term:
    preferred_term: TPP2
    term:
      id: hgnc:12016
      label: TPP2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Deficiency with immunosenescence and autoantibody excess
  notes: >-
    A distinct route to the same endpoint. Rather than removing a regulatory
    brake, TPP2 deficiency drives premature immunosenescence, with age-associated
    B cells and raised autoantibody levels.
  evidence:
  - reference: PMID:30349415
    reference_title: 'Evans syndrome: clinical perspectives, biological insights and treatment modalities.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Recent molecular theories explaining the physiopathology of ES include deficiencies of
      CTLA-4, LRBA, TPP2 and a decreased CD4/CD8 ratio.'
    explanation: Names TPP2 among the molecular explanations advanced for the syndrome.
- name: STAT3
  gene_term:
    preferred_term: STAT3
    term:
      id: hgnc:11364
      label: STAT3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Gain-of-function variants with early-onset autoimmunity
  notes: >-
    Gain-of-function rather than loss, which is the opposite direction from the
    CTLA-4 and LRBA lesions and a reminder that the syndrome is a convergent
    endpoint rather than a single pathway.
  evidence:
  - reference: PMID:30349415
    reference_title: 'Evans syndrome: clinical perspectives, biological insights and treatment modalities.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'CTLA-4, LRBA, KRAS, STAT3 gain-of-function mutations are associated with ES secondary
      to a loss of T-cell homeostasis.'
    explanation: Names STAT3 and specifies gain-of-function.
- name: FAS
  gene_term:
    preferred_term: FAS
    term:
      id: hgnc:11920
      label: FAS
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Defective lymphocyte apoptosis in autoimmune lymphoproliferative syndrome
  notes: >-
    The classic route, and the one with a treatment attached to it. FAS variants
    cause autoimmune lymphoproliferative syndrome, in which failure of lymphocyte
    apoptosis permits autoreactive clones to persist. Children with that
    underlying diagnosis are directed to sirolimus rather than rituximab.
  evidence:
  - reference: PMID:41560547
    reference_title: Investigating Biomarkers for Inborn Errors of Immunity in a Prospective Study of Patients With Autoimmune Cytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Among 104 AIC patients, 53 (51%) showed evidence of IEI, including 27 (26%) with
      monogenic disorders-most commonly partial DiGeorge syndrome (pDGS), followed by variants in
      NFKB1, CTLA4, and FAS.'
    explanation: Names FAS among the commonest monogenic causes in a prospective autoimmune
      cytopenia cohort, alongside CTLA4 which is curated separately here.
- name: KRAS
  gene_term:
    preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  association: Activating variants in RAS-associated autoimmune leukoproliferative disease
  notes: >-
    Grouped with the germline lesions in the source, but the KRAS variants in this
    setting are somatic. The distinction matters for testing, since a germline
    panel on blood may still detect a somatic clone but a negative result does not
    exclude one.
  evidence:
  - reference: PMID:30349415
    reference_title: 'Evans syndrome: clinical perspectives, biological insights and treatment modalities.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'CTLA-4, LRBA, KRAS, STAT3 gain-of-function mutations are associated with ES secondary
      to a loss of T-cell homeostasis.'
    explanation: Names KRAS among the associated genes in the paediatric cohort.
diagnosis:
- name: Extensive workup for an underlying disorder
  presence: PRESENT
  description: >-
    The adult consensus recommends bone marrow evaluation and CT imaging in every
    patient, not to confirm the cytopenias but to find the disorder underneath
    them. That is a direct consequence of the prognosis: secondary disease has a
    5-year survival of 38 percent, so the search changes what happens next.
  evidence:
  - reference: PMID:38968944
    reference_title: 'Diagnosis and management of Evans syndrome in adults: first consensus recommendations.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The panellists recommended extensive clinical and laboratory diagnostic tests,
      including bone marrow evaluation and CT scan, and an aggressive front-line therapy with
      prednisone (with or without intravenous immunoglobulins), with different treatment durations
      and tapering for immune thrombocytopenia and autoimmune haemolytic anaemias (AIHAs).'
    explanation: States the recommended diagnostic scope and, in the same sentence, the front-line
      therapy that follows it.
- name: Genetic evaluation in paediatric-onset disease
  presence: PRESENT
  description: >-
    In children the syndrome is increasingly treated as a presenting sign of an
    inborn error of immunity rather than a diagnosis in itself, and the point of
    finding the variant is that it changes the treatment from broad immune
    suppression to a targeted agent or transplant.
  evidence:
  - reference: PMID:37735545
    reference_title: 'Paediatric-onset Evans syndrome: Breaking away from refractory immune thrombocytopenia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'This paper presents a new view of ES based on recent advances in genomics which begin
      to classify patients based on their underlying molecular variants in previously described
      primary immune disorders.'
    explanation: States the reclassification of paediatric cases by underlying molecular variant.
  - reference: PMID:38302222
    reference_title: 'Diagnostic evaluation of paediatric autoimmune lymphoproliferative immunodeficiencies
      (ALPID): a prospective cohort study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'After biomarker and genetic assessments, autoimmune lymphoproliferative syndrome was
      diagnosed in 71 (16%) patients.'
    explanation: Gives the yield for the classic diagnosis in a prospective cohort referred for
      exactly this evaluation, which bounds how often the search succeeds.
  - reference: PMID:41560547
    reference_title: Investigating Biomarkers for Inborn Errors of Immunity in a Prospective Study of Patients With Autoimmune Cytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Among 104 AIC patients, 53 (51%) showed evidence of IEI, including 27 (26%) with
      monogenic disorders-most commonly partial DiGeorge syndrome (pDGS), followed by variants in
      NFKB1, CTLA4, and FAS.'
    explanation: A prospective cohort in which half of all autoimmune cytopenia patients showed
      evidence of an inborn error of immunity and a quarter had a monogenic cause, which is the
      strongest case for making this evaluation routine.
  - reference: PMID:37792884
    reference_title: Evaluating the prevalence of inborn errors of immunity in adults with chronic immune thrombocytopenia or Evans syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: 'No cases of IEI were identified despite a high representation of subjects with a
      personal history of autoimmunity'
    explanation: Carried as REFUTE because it argues against extending this recommendation to
      adults. An adult cohort screened on a broad inborn-errors panel found no fully penetrant
      case, which is why the diagnosis entry is scoped to paediatric-onset disease.
treatments:
- name: Corticosteroid Therapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Prednisone is first-line for both cytopenias, with different durations and
    tapering schedules for the thrombocytopenia and the haemolytic anaemia. It
    works in about 80 percent of children initially, which is the problem: initial
    response is not the difficulty in this disease, durability is.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
  target_mechanisms:
  - target: Autoreactive B Cell Activation and Multi-Lineage Autoantibody Production
    treatment_effect: INHIBITS
    description: Broad suppression of lymphocyte activation and antibody production rather than
      action on any lineage-specific step, which is why one agent covers both cytopenias.
    evidence:
    - reference: PMID:30349415
      reference_title: 'Evans syndrome: clinical perspectives, biological insights and treatment modalities.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'As in other autoimmune cytopenias, there is no established evidence-based treatment
        and steroids are the first-line therapy, with intravenous immunoglobulin administered as a
        life-saving resource in cases of severe immune thrombocytopenic purpura manifestations.'
      explanation: Places steroids as first-line for the syndrome as a whole rather than for one
        cytopenia.
  evidence:
  - reference: PMID:26625877
    reference_title: How I manage Evans Syndrome and AIHA cases in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Steroids, the first-choice therapy, are successful in about 80% of cases.'
    explanation: Gives the initial response rate in children, which is the number that makes
      relapse rather than response the clinical problem.
  - reference: PMID:19638626
    reference_title: 'The spectrum of Evans syndrome in adults: new insight into the disease based on the analysis
      of 68 cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'All patients were given corticosteroids, but 50 of them (73%) required at least one
      "second-line" treatment, including splenectomy(n = 19) and rituximab (n = 11).'
    explanation: Supports corticosteroids as universal first-line practice while recording that 73
      percent still needed a second line, which is the limit on their durability.
- name: Intravenous Immunoglobulin
  therapeutic_modality: OTHER
  description: >-
    Used alongside steroids as a rescue measure in severe thrombocytopenic
    bleeding rather than as maintenance. Modality is OTHER because pooled
    polyclonal immunoglobulin is neither a small molecule nor a monoclonal
    antibody nor replacement of a protein the patient cannot make.
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
  target_mechanisms:
  - target: Antibody-Mediated Platelet Destruction
    treatment_effect: INHIBITS
    description: Acts on the clearance of opsonised platelets rather than on the autoantibody that
      opsonises them, which is why the effect is rapid and short-lived.
    evidence:
    - reference: PMID:30349415
      reference_title: 'Evans syndrome: clinical perspectives, biological insights and treatment modalities.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'As in other autoimmune cytopenias, there is no established evidence-based treatment
        and steroids are the first-line therapy, with intravenous immunoglobulin administered as a
        life-saving resource in cases of severe immune thrombocytopenic purpura manifestations.'
      explanation: Restricts the indication to severe thrombocytopenic manifestations, which is why
        this treatment targets the platelet arm and not the erythrocyte arm.
  evidence:
  - reference: PMID:38968944
    reference_title: 'Diagnosis and management of Evans syndrome in adults: first consensus recommendations.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The panellists recommended extensive clinical and laboratory diagnostic tests,
      including bone marrow evaluation and CT scan, and an aggressive front-line therapy with
      prednisone (with or without intravenous immunoglobulins), with different treatment durations
      and tapering for immune thrombocytopenia and autoimmune haemolytic anaemias (AIHAs).'
    explanation: Places immunoglobulin as an optional addition to front-line prednisone in the
      adult consensus.
- name: Rituximab
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    An anti-CD20 antibody that depletes the B cells producing the autoantibodies,
    so it acts one node upstream of the steroids. It has largely displaced
    splenectomy as second-line therapy. The adult consensus discourages it in
    patients with immunodeficiency or severe infection, which matters here
    specifically because immunodeficiency is one of the commonest underlying
    disorders in this syndrome.
  treatment_term:
    preferred_term: biological therapy
    term:
      id: NCIT:C15187
      label: Biological Therapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: Autoreactive B Cell Activation and Multi-Lineage Autoantibody Production
    treatment_effect: INHIBITS
    description: Depletes CD20-positive B cells, removing the source of the autoantibodies against
      all affected lineages at once.
    evidence:
    - reference: PMID:30349415
      reference_title: 'Evans syndrome: clinical perspectives, biological insights and treatment modalities.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Rituximab is a chimeric anti-CD20 targeted drug that has been increasingly used as
        the second-line treatment in steroid-refractory or relapsing ES.'
      explanation: Names the target and the line of therapy.
  evidence:
  - reference: PMID:30349415
    reference_title: 'Evans syndrome: clinical perspectives, biological insights and treatment modalities.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Recently, splenectomy has been replaced by rituximab due to the risks of the surgical
      procedure.'
    explanation: Records the displacement of splenectomy, which is the main change in second-line
      practice.
  - reference: PMID:28444729
    reference_title: 'Benefits of rituximab as a second-line treatment for autoimmune haemolytic anaemia in children: a prospective French cohort study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Forty-six patients responded (75%) and the 6-year relapse-free survival (RFS) was
      48%.'
    explanation: The pattern this whole entry turns on, stated in one sentence. Three quarters
      respond and under half are still in remission at six years.
  - reference: PMID:38968944
    reference_title: 'Diagnosis and management of Evans syndrome in adults: first consensus recommendations.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: 'However, rituximab was discouraged for patients with immunodeficiency or severe
      infections, with the same applying to splenectomy.'
    explanation: Carried as REFUTE because it is a recommendation against this treatment in a
      defined group, and that group - patients with immunodeficiency - overlaps heavily with the
      secondary Evans syndrome population.
- name: Sirolimus
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    An mTOR inhibitor, singled out for children whose Evans syndrome sits on
    autoimmune lymphoproliferative syndrome. That is the clearest example in this
    entry of the genetic diagnosis changing the treatment rather than merely
    labelling it.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
  target_mechanisms:
  - target: Skewed T Cell Compartment
    treatment_effect: MODULATES
    description: Acts on the T cell compartment rather than on antibody production, which is why
      it is preferred where the underlying lesion is lymphoproliferative rather than humoral.
    evidence:
    - reference: PMID:26625877
      reference_title: How I manage Evans Syndrome and AIHA cases in children.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'For children who are resistant, relapse or become steroid-dependent, rituximab is
        considered a valid second-line treatment, with the exception of those with an underlying
        diagnosis of autoimmune lymphoproliferative syndrome who may benefit from other options such
        as mycophenolate mofetil and sirolimus.'
      explanation: Makes the choice between rituximab and sirolimus turn on the underlying
        diagnosis, which is what places sirolimus on the T cell node rather than the B cell node.
  evidence:
  - reference: PMID:26504182
    reference_title: 'Sirolimus is effective in relapsed/refractory autoimmune cytopenias: results of a prospective multi-institutional trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We also treated 12 patients with multilineage cytopenias secondary to common variable
      immunodeficiency (CVID), Evans syndrome (ES), or systemic lupus erythematosus (SLE), and most
      achieved a CR (N = 8), although the time to CR was often slower than was seen in ALPS.'
    explanation: Prospective trial data in this syndrome specifically, with the important
      qualification that the response is slower than in the lymphoproliferative group where
      sirolimus works best.
  - reference: PMID:26504182
    reference_title: 'Sirolimus is effective in relapsed/refractory autoimmune cytopenias: results of a prospective multi-institutional trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'All children (N = 12) with autoimmune lymphoproliferative syndrome (ALPS) achieved a
      durable complete response (CR), including rapid improvement in autoimmune disease,
      lymphadenopathy, and splenomegaly within 1 to 3 months of starting sirolimus.'
    explanation: The contrast that justifies directing children with a lymphoproliferative
      diagnosis to this agent rather than to rituximab.
  - reference: PMID:30349415
    reference_title: 'Evans syndrome: clinical perspectives, biological insights and treatment modalities.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Second-line treatment for refractory ES includes rituximab, mofetil mycophenolate,
      cyclosporine, vincristine, azathioprine, sirolimus and thrombopoietin receptor agonists.'
    explanation: Places sirolimus among the second-line options for refractory disease.
- name: Mycophenolate Mofetil
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    An antiproliferative immunosuppressant, named alongside sirolimus as the
    preferred option in children with underlying autoimmune lymphoproliferative
    syndrome. The adult consensus has moved the immunosuppressive agents as a
    class to third line or later.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mycophenolate mofetil
      term:
        id: CHEBI:8764
        label: mycophenolate mofetil
  target_mechanisms:
  - target: Autoreactive B Cell Activation and Multi-Lineage Autoantibody Production
    treatment_effect: INHIBITS
    description: Blocks lymphocyte proliferation, reducing the expansion of the autoreactive clones
      rather than depleting those already present.
    evidence:
    - reference: PMID:26625877
      reference_title: How I manage Evans Syndrome and AIHA cases in children.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'For children who are resistant, relapse or become steroid-dependent, rituximab is
        considered a valid second-line treatment, with the exception of those with an underlying
        diagnosis of autoimmune lymphoproliferative syndrome who may benefit from other options such
        as mycophenolate mofetil and sirolimus.'
      explanation: Names mycophenolate mofetil as a preferred option in the lymphoproliferative
        subgroup.
  evidence:
  - reference: PMID:30349415
    reference_title: 'Evans syndrome: clinical perspectives, biological insights and treatment modalities.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Second-line treatment for refractory ES includes rituximab, mofetil mycophenolate,
      cyclosporine, vincristine, azathioprine, sirolimus and thrombopoietin receptor agonists.'
    explanation: Lists mycophenolate mofetil among the second-line options.
- name: Thrombopoietin Receptor Agonist Therapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Recommended for chronic thrombocytopenia and specifically where previous
    severe infection makes further immunosuppression unattractive. It is the one
    treatment here that does not suppress immunity at all: it raises platelet
    production instead of reducing platelet destruction, which is why it is the
    option when infection is the limiting problem.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: eltrombopag
      term:
        id: NCIT:C62501
        label: Eltrombopag Olamine
  target_mechanisms:
  - target: Thrombocytopenia
    treatment_effect: MODULATES
    description: Increases platelet production to outpace destruction. It does nothing to the
      autoantibody or to the clearance mechanism, so it treats the count rather than the disease.
    evidence:
    - reference: PMID:38968944
      reference_title: 'Diagnosis and management of Evans syndrome in adults: first consensus recommendations.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Thrombopoietin receptor agonists were recommended for chronic immune thrombocytopenia
        and in the case of previous grade 4 infection.'
      explanation: Gives both indications, the second of which is what makes this the non-suppressive
        alternative.
  evidence:
  - reference: PMID:30349415
    reference_title: 'Evans syndrome: clinical perspectives, biological insights and treatment modalities.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Second-line treatment for refractory ES includes rituximab, mofetil mycophenolate,
      cyclosporine, vincristine, azathioprine, sirolimus and thrombopoietin receptor agonists.'
    explanation: Lists the class among second-line options for refractory disease.
- name: Fostamatinib
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    A spleen tyrosine kinase inhibitor, placed third line or later by the adult
    consensus but suggested earlier in patients with previous thrombotic events.
    It acts on the phagocyte rather than on the lymphocyte, blocking the signalling
    that follows Fc receptor engagement of an opsonised cell.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fostamatinib
      term:
        id: NCIT:C95222
        label: Fostamatinib
  target_mechanisms:
  - target: Antibody-Mediated Platelet Destruction
    treatment_effect: INHIBITS
    description: Blocks the intracellular signal that follows Fc receptor engagement on the
      phagocyte, so the opsonised platelet is not ingested. The antibody remains.
    evidence:
    - reference: PMID:38968944
      reference_title: 'Diagnosis and management of Evans syndrome in adults: first consensus recommendations.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Fostamatinib was recommended as third-line or further-line treatment and suggested as
        second-line therapy for patients with previous thrombotic events.'
      explanation: Gives the line of therapy and the exception, which is the whole of what the
        cached sources say about this agent in this disease.
  evidence:
  - reference: PMID:38968944
    reference_title: 'Diagnosis and management of Evans syndrome in adults: first consensus recommendations.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Evans syndrome is a rare disease marked by a severe clinical course, high relapse rate,
      infectious and thrombotic complications, and sometimes fatal outcome.'
    explanation: Establishes the thrombotic complications that define the subgroup in which this
      agent is moved earlier.
- name: Splenectomy
  therapeutic_modality: SURGERY
  description: >-
    Removal of the principal site of clearance of opsonised cells. Historically
    second-line, now largely displaced by rituximab. The Evans-specific data are
    what make this interesting: the initial response matches that of isolated
    immune thrombocytopenia, but the durability does not, and the failure is
    lineage-specific.
  treatment_term:
    preferred_term: splenectomy
    term:
      id: NCIT:C15328
      label: Splenectomy
  target_mechanisms:
  - target: Antibody-Mediated Platelet Destruction
    treatment_effect: INHIBITS
    description: Removes the site where opsonised platelets are cleared. It does not touch the
      autoantibody, which is the likeliest reason the response is not durable.
    evidence:
    - reference: PMID:31594025
      reference_title: 'Long-term remission rates after splenectomy in adults with Evans syndrome compared to
        immune thrombocytopenia: A single-center retrospective study.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'In the Evans cohort, splenectomy led to an 85.7% initial response rate with a 42.8%
        rate of relapse within one year and a long-term (one-year) response rate of 42.8%.'
      explanation: Supports an effect on platelet clearance, and in the same numbers bounds it - 85.7
        percent initially, 42.8 percent at one year.
  evidence:
  - reference: PMID:31594025
    reference_title: 'Long-term remission rates after splenectomy in adults with Evans syndrome compared to
      immune thrombocytopenia: A single-center retrospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Our data suggest that long-term remission rates after splenectomy are lower in adults
      with Evans syndrome compared to those with ITP, although splenectomy may still be an acceptable
      treatment for certain patients with Evans syndrome.'
    explanation: The authors keep splenectomy as an acceptable option while stating that remission is
      less durable here than in isolated immune thrombocytopenia. The cohort was seven patients, so
      the estimate is imprecise.
  - reference: PMID:30349415
    reference_title: 'Evans syndrome: clinical perspectives, biological insights and treatment modalities.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Splenectomy was the only option in refractory relapsing patients before the introduction
      of rituximab, being classically considered as a second-line treatment in patients with autoimmune
      cytopenias, achieving a response of 60%–75% in AIHA and ITP,101 while in ES, the responses are
      documented to be considerably heterogeneous, between 0% and 66%.'
    explanation: An independent source giving a response range for this syndrome that starts at zero
      and tops out below the range reported for the isolated cytopenias.
progression:
- phase: Established disease, adults
  notes: >-
    Median survival of 7.2 years in a nationwide adult cohort, and 1.7 years where
    the syndrome is secondary. This is the single most important number in the
    entry, because it is the one that separates Evans syndrome from the diseases
    it combines.
  evidence:
  - reference: PMID:31292991
    reference_title: Evans syndrome in adults - incidence, prevalence, and survival in a nationwide cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The median survival with Evans syndrome was 7.2 years (primary Evans syndrome: 10.9
      years; secondary Evans syndrome: 1.7 years).'
    explanation: Gives overall and stratified median survival from a national registry.
  - reference: PMID:31292991
    reference_title: Evans syndrome in adults - incidence, prevalence, and survival in a nationwide cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Secondary Evans syndrome was associated with higher mortality rates than any of the
      other cohorts, with a 5-year survival of 38%.'
    explanation: The comparison groups are isolated immune thrombocytopenia, isolated haemolytic
      anaemia and the general population, which is what makes the figure interpretable.
- phase: After initial treatment response
  notes: >-
    Initial response rates match those of the isolated cytopenias. What differs is
    what happens afterwards, and that pattern holds across steroids, splenectomy
    and the syndrome as a whole.
  evidence:
  - reference: PMID:40717001
    reference_title: Evans syndrome revisited.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Observational studies suggest that although initial response rates to standard
      therapies are similar, long-term outcomes and mortality in ES are worse than in AIHA and ITP.'
    explanation: States the dissociation between initial response and long-term outcome directly.
  - reference: PMID:19638626
    reference_title: 'The spectrum of Evans syndrome in adults: new insight into the disease based on the analysis
      of 68 cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'At time of analysis, after a mean follow-up of 4.8 years, only 22 patients (32%) were
      in remission off treatment; 16 (24%) had died.'
    explanation: Quantifies both ends of the outcome distribution in the largest adult series.
- phase: Ten to twenty years after paediatric onset
  notes: >-
    The French national cohort followed paediatric-onset patients for a median of
    11.3 years and separates two things that are usually conflated: the cytopenias
    largely remit, and the disease does not. Immunopathological manifestations
    accumulate with age on a rising curve, and survival at fifteen years is 84
    percent.
  evidence:
  - reference: PMID:33440924
    reference_title: 'Long term follow-up of pediatric-onset Evans syndrome: broad immunopathological manifestations and high treatment burden.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'At 10 years, ITP and AIHA were in sustained complete remission in 54.5% and 78.4% of
      patients, respectively.'
    explanation: The cytopenias themselves largely remit, and the haemolytic component remits more
      often than the thrombocytopenia. That asymmetry matches the lineage-specific splenectomy
      finding recorded elsewhere in this entry.
  - reference: PMID:33440924
    reference_title: 'Long term follow-up of pediatric-onset Evans syndrome: broad immunopathological manifestations and high treatment burden.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The frequency and number of clinical and biological IM increased with age: at the
      age of 20 years, 74% had at least one clinical IM (cIM).'
    explanation: The immunopathology accumulates while the cytopenias are remitting, which is the
      basis for treating paediatric Evans syndrome as an ongoing immune disease rather than a
      resolved haematological one.
  - reference: PMID:33440924
    reference_title: 'Long term follow-up of pediatric-onset Evans syndrome: broad immunopathological manifestations and high treatment burden.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Survival at 15 years after diagnosis was 84%.'
    explanation: Gives paediatric survival directly, which is otherwise inferable only from hazard
      ratios.
  - reference: PMID:26484337
    reference_title: 'Evans Syndrome in Children: Long-Term Outcome in a Prospective French National Observational Cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Overall, 69% of children required one or more second-line immune treatments'
    explanation: Quantifies the treatment burden in children, matching the 73 percent figure
      recorded for adults and showing the pattern is not age-specific.
- phase: Adulthood after paediatric onset
  notes: >-
    Resolution of the blood counts does not mean resolution of the disease.
    Paediatric patients continue to declare immune manifestations into adulthood,
    which is the argument for transition programmes rather than discharge.
  evidence:
  - reference: PMID:37735545
    reference_title: 'Paediatric-onset Evans syndrome: Breaking away from refractory immune thrombocytopenia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Importantly, recent studies of the full lifespan of ES suggest that at least 80% of
      those paediatric patients will progress to various clinical or biological immunopathological
      manifestations with age despite the resolution of their cytopenias.'
    explanation: Gives the proportion and makes explicit that it happens despite the cytopenias
      resolving.
- phase: Childhood
  notes: >-
    The Danish paediatric cohort finds reduced long-term survival and more
    splenectomy than in comparison groups, so the poor prognosis is not confined
    to older adults with secondary disease.
  evidence:
  - reference: PMID:32271826
    reference_title: Evans syndrome in children below 13 years of age - A nationwide population-based cohort study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We found that ES in children below 13 years of age is associated with reduced long term
      survival and increased rate of splenectomy.'
    explanation: States both findings for the paediatric population from a national registry.
  - reference: PMID:32271826
    reference_title: Evans syndrome in children below 13 years of age - A nationwide population-based cohort study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Hazard ratio for death was 22 fold higher for children with ES compared to matched
      children from general population, and was also elevated compared to children with autoimmune
      haemolytic anaemia or immune thrombocytopenia.'
    explanation: Gives the magnitude relative to two reference groups. The comparison with the
      isolated cytopenias is what shows the excess is specific to the syndrome and not to autoimmune
      cytopenia generally.
mechanistic_hypotheses:
- hypothesis_group_id: cd4-cd8-ratio-direction
  hypothesis_label: The CD4 to CD8 ratio as cause versus consequence
  status: ALTERNATIVE
  description: >-
    A reduced CD4 to CD8 ratio is reported consistently in this syndrome, and the
    literature groups it with the molecular deficiencies as an explanation of
    pathophysiology. But an alternative reading is available and is not excluded by
    any cached source: chronic destruction of blood cells is itself a chronic
    antigenic stimulus, and an expanded cytotoxic compartment is what that would
    produce. The observation would look the same either way. This is recorded as
    ALTERNATIVE rather than folded into the main pathograph because the entry should
    not present a correlation as a direction.
  evidence:
  - reference: PMID:30349415
    reference_title: 'Evans syndrome: clinical perspectives, biological insights and treatment modalities.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Recent molecular theories explaining the physiopathology of ES include deficiencies of
      CTLA-4, LRBA, TPP2 and a decreased CD4/CD8 ratio.'
    explanation: The source calls these theories, and lists a cell-ratio observation alongside
      molecular deficiencies as though they were the same kind of claim. They are not, which is what
      this hypothesis records.
- hypothesis_group_id: es-as-iei-presentation
  hypothesis_label: Evans syndrome as a presenting phenotype of an inborn error of immunity
  status: EMERGING
  description: >-
    On this view Evans syndrome in a child is not a diagnosis but a presentation,
    and the real diagnosis is a named inborn error of immunity. It is EMERGING
    rather than CANONICAL because the yield is partial: in a prospective cohort
    referred specifically for this evaluation, the classic autoimmune
    lymphoproliferative syndrome was confirmed in 16 percent, leaving most patients
    without that label even after biomarker and genetic assessment.
  evidence:
  - reference: PMID:37735545
    reference_title: 'Paediatric-onset Evans syndrome: Breaking away from refractory immune thrombocytopenia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'This has opened up new avenues of targeted therapy or bone marrow transplant at rather
      than broad long-term immune suppression or splenectomy.'
    explanation: States the therapeutic consequence that makes the reclassification worth making.
  - reference: PMID:38302222
    reference_title: 'Diagnostic evaluation of paediatric autoimmune lymphoproliferative immunodeficiencies
      (ALPID): a prospective cohort study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'After biomarker and genetic assessments, autoimmune lymphoproliferative syndrome was
      diagnosed in 71 (16%) patients.'
    explanation: Supports the approach while bounding its yield at 16 percent, which is why the
      hypothesis is EMERGING rather than CANONICAL.
  - reference: PMID:30349415
    reference_title: 'Evans syndrome: clinical perspectives, biological insights and treatment modalities.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Interestingly, an association between ALPS and ES has been documented only in children.'
    explanation: Restricts the association to children, which is why this hypothesis is about
      paediatric-onset disease specifically.

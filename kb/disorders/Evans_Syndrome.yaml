disease_term:
  preferred_term: Evans syndrome
  term:
    id: MONDO:0016030
    label: Evans syndrome
notes: >-
  The definitional problem, and why it shapes the whole entry. Evans syndrome is
  defined by a combination of findings rather than by a mechanism: any two of
  immune thrombocytopenia, autoimmune haemolytic anaemia and autoimmune
  neutropenia. That is a diagnosis of co-occurrence, and it raises the question of
  whether the syndrome is one disease or two that happen to share a patient. The
  pathograph here takes a position on that. It puts a single root - loss of
  lymphocyte self-tolerance - above two separate destruction pathways, one per
  lineage, each with its own antibody. The claim is that the tolerance failure is
  shared and the effector mechanisms are not.

  That structure makes a prediction, and the splenectomy data test it. After
  splenectomy in a small Evans cohort, thrombocytopenia recurred in 42.8 percent
  while autoimmune anaemia recurred in none. If one process were destroying both
  lineages, removing the clearance organ should affect both the same way. It did
  not. The cohort is seven patients and the observation should not be
  over-read, but it is the only lineage-resolved evidence in the cached sources
  and it is recorded on the platelet destruction node for that reason.

  What actually distinguishes this syndrome from its components is not the
  response to treatment but what follows it. Steroids work initially in about 80
  percent of children. Splenectomy produces an 85.7 percent initial response,
  statistically indistinguishable from the 90.9 percent in isolated immune
  thrombocytopenia in the same series. Then the curves separate: median survival
  of 7.2 years overall, 1.7 years where the disease is secondary, a 5-year
  survival of 38 percent in that group, and 24 percent dead at a mean follow-up of
  4.8 years in the largest adult series. Initial response is not the problem.

  A caution about the CD4 to CD8 ratio, recorded as an ALTERNATIVE hypothesis
  rather than buried. The literature lists a decreased ratio alongside CTLA-4,
  LRBA and TPP2 deficiency as "molecular theories explaining the physiopathology".
  Those are not the same kind of claim. A germline deficiency in a regulatory
  protein is a candidate cause; a shifted cell ratio in patients with ongoing
  cell destruction is an observation that chronic antigenic stimulation would also
  produce. The node for the skewed T cell compartment is marked PROVISIONAL for
  the same reason.

  The genetic section groups five genes that reach the same endpoint by different
  routes, and the differences are worth keeping visible. CTLA-4 haploinsufficiency
  removes a regulatory brake directly; LRBA deficiency removes the same brake
  indirectly, by failing to rescue endocytosed CTLA-4 from degradation, so the
  two converge without sharing a gene. STAT3 acts by gain of function, the
  opposite direction. TPP2 deficiency works through immunosenescence rather than
  through regulatory failure at all. KRAS is grouped with the germline lesions in
  the source but its variants in this setting are somatic, which changes what a
  negative germline panel means. The syndrome is a convergent endpoint, not a
  pathway.

  Why the entry has no subtypes. MONDO:0016030 has an empty subclass tree, and the
  distinctions that matter clinically - primary versus secondary, paediatric
  versus adult onset - are strata rather than ontology subtypes. They are carried
  in epidemiology, progression and the hypotheses instead of being invented as
  has_subtypes entries.

  Two treatments are recorded with recommendations against them as well as for
  them. Rituximab and splenectomy are both discouraged by the adult consensus in
  patients with immunodeficiency or severe infection. That caveat matters more here
  than it would in isolated immune thrombocytopenia, because common variable
  immunodeficiency is one of the three commonest disorders underlying secondary
  Evans syndrome. The REFUTE item on rituximab records that directly rather than
  leaving it in prose.

  What the deep-research job contributed, and what it did not. The job returned
  nine findings across seventeen citations, and seven of its PMIDs were not in the
  draft. Each was verified against PubMed and then fetched before use; two of its
  quoted sentences did not match the cached text and were replaced with the real
  wording rather than trusted. Its most useful contribution was the progression to
  systemic lupus, which no source in the original draft mentioned: in the French
  national cohort, 45 percent of antinuclear-antibody-positive paediatric Evans
  syndrome went on to lupus, against 20 percent for chronic immune
  thrombocytopenia and 19 percent for isolated haemolytic anaemia, and no
  ANA-negative patient did. That is a stratified risk, so it is banded for the
  ANA-positive subgroup and the description says so.

  The job also supplied the long-term paediatric outcome data, which separate two
  things usually run together: the cytopenias remit while the disease does not. At
  ten years, sustained complete remission was 54.5 percent for the
  thrombocytopenia and 78.4 percent for the haemolytic anaemia; by age twenty, 74
  percent had at least one clinical immunopathological manifestation. Survival at
  fifteen years was 84 percent.

  A note on the asymmetry, because it appears three times independently. The
  haemolytic component remits more often than the thrombocytopenia at ten years;
  thrombocytopenia recurs after splenectomy while the anaemia does not; and
  rituximab relapse-free survival is higher in isolated haemolytic anaemia than in
  Evans syndrome. None of these is decisive alone. Together they are the reason
  this entry models two separate destruction pathways under a shared root rather
  than one process acting on two cell types.

  On the yield of genetic evaluation, which the entry deliberately scopes by age.
  A prospective paediatric cohort found evidence of an inborn error of immunity in
  half of all autoimmune cytopenia patients and a monogenic cause in a quarter. An
  adult cohort screened on a broad inborn-errors panel found no fully penetrant
  case. That negative is carried as REFUTE evidence on the diagnosis entry rather
  than omitted, because it is what keeps the recommendation from being extended to
  adults on the strength of the paediatric data.

  Known extension points: thrombotic complications, which the adult consensus
  names but which no cached source quantifies in this syndrome; haematopoietic
  stem cell transplantation, mentioned as an option in refractory paediatric
  disease without outcome data in these sources; the specific antibody targets on
  each lineage; abatacept for the CTLA-4 and LRBA forms, which the research report
  raises as genotype-directed therapy but which no cached source documents in this
  syndrome; the natural canine disease and the Fas-lpr mouse, both of which the
  report surfaced without a fetchable primary source in these caches; and partial
  DiGeorge syndrome and NFKB1, named in the same cohort sentence as CTLA4 and FAS
  but without enough detail here to curate as their own genetic entries.

  Provenance. Curated from PubMed with a five-iteration OpenScientist
  deep-research job as a cross-check, which ran for 908 seconds and returned 17
  citations. Content_type was checked on every cache before writing. Seven of the
  seventeen references are full text, and for those the Results sections were read
  rather than the abstracts alone.

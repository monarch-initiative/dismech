name: Evans Syndrome
creation_date: '2026-09-10T00:20:00Z'
description: >-
  An acquired autoimmune disease defined by at least two of the three autoimmune
  cytopenias - immune thrombocytopenia, autoimmune haemolytic anaemia and
  autoimmune neutropenia - occurring simultaneously or sequentially in the same
  patient. The definition is deliberately combinatorial rather than mechanistic,
  which is the central difficulty of the entry: what unites the cytopenias is not
  a shared autoantigen but a shared failure of lymphocyte self-tolerance, with
  each lineage destroyed by its own antibody. That framing is what explains the
  clinical observations that set Evans syndrome apart from its component
  diseases. Initial response rates to standard therapy match those of isolated
  immune thrombocytopenia and haemolytic anaemia, but relapse is more frequent,
  splenectomy is less durable, and survival is worse. In children the syndrome is
  increasingly a presenting sign of an inborn error of immunity rather than a
  diagnosis in itself.
categories:
- Autoimmune Disease
- Hematologic Disease
- Immune Dysregulation Syndrome
parents:
- autoimmune hematologic disease
synonyms:
- ES
- Evans' syndrome
- autoimmune hemolytic anemia and autoimmune thrombocytopenia
- immune pancytopenia
epidemiology:
- name: Rarity relative to its component cytopenias
  description: >-
    Evans syndrome is an order of magnitude rarer than either of the diseases it
    combines, which is why most of what is known comes from small retrospective
    series rather than trials.
  evidence:
  - reference: PMID:40717001
    reference_title: Evans syndrome revisited.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'At an incidence of approximately 10 to 30 times lower than AIHA and ITP, respectively,
      ES has been historically overlooked'
    explanation: Quantifies the rarity relative to the two component diseases, which is the reason
      the evidence base is thin.
- name: Simultaneous versus sequential onset
  description: >-
    The two cytopenias appear together in about half of adult cases and
    sequentially in the rest, so a patient presenting with one cytopenia may
    declare the syndrome years later.
  evidence:
  - reference: PMID:19638626
    reference_title: 'The spectrum of Evans syndrome in adults: new insight into the disease based on the analysis
      of 68 cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'both cytopenias occurred simultaneously in 37 cases (54.5%)'
    explanation: Gives the proportion presenting simultaneously in the largest adult series, which
      is what makes sequential presentation the other half rather than an exception.
- name: Primary versus secondary
  description: >-
    Half of adult cases sit on an identifiable underlying disorder. The
    distinction is prognostic rather than descriptive, since secondary disease
    carries markedly worse survival.
  evidence:
  - reference: PMID:19638626
    reference_title: 'The spectrum of Evans syndrome in adults: new insight into the disease based on the analysis
      of 68 cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'ES was considered as "primary" in 34 patients (50%) but was associated with an underlying
      disorder in half of the cases, including mainly systemic lupus, lymphoproliferative disorders,
      and common variable immunodeficiency.'
    explanation: Names the three commonest associated disorders and gives the primary-secondary
      split in the largest adult series.
- name: Age and sex at diagnosis in a nationwide adult cohort
  description: >-
    A Danish nationwide registry cohort gives the demographic profile without the
    referral bias that affects tertiary-centre series.
  evidence:
  - reference: PMID:31292991
    reference_title: Evans syndrome in adults - incidence, prevalence, and survival in a nationwide cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: '51.2% were women, and 27.3% were classified as secondary Evans syndrome.'
    explanation: Population-level sex distribution and secondary proportion. The secondary
      proportion is lower than in the referral series above, which is what a registry denominator
      would predict.
prevalence:
- population: Denmark, adults
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 2.13
  notes: 21.3 per million persons in 2016, from a nationwide registry cohort of patients aged 13
    and over. Incidence in the same year was 1.8 per million person-years. Both rose significantly
    across the study period.
  evidence:
  - reference: PMID:31292991
    reference_title: Evans syndrome in adults - incidence, prevalence, and survival in a nationwide cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The annual Evans syndrome incidence and prevalence rose significantly during the study
      period, to 1.8 per million person-years and 21.3 per million persons, respectively, in 2016.'
    explanation: Gives both the incidence and the prevalence with the year, from a nationwide
      denominator rather than a case series.
- population: Denmark, children under 13
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.12
  notes: 0.5 to 1.2 per 1,000,000 person-years across 1981 to 2015, rising over the period. The
    band is recorded on the incidence measure rather than as a prevalence.
  evidence:
  - reference: PMID:32271826
    reference_title: Evans syndrome in children below 13 years of age - A nationwide population-based cohort study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The incidence of Evans syndrome ranged between 0.5 and 1.2/1,000,000 person-years.'
    explanation: Gives the childhood incidence range directly, from the same national registry
      system as the adult figures.
pathophysiology:
- name: Loss of Lymphocyte Self-Tolerance
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The unifying lesion, and the reason the syndrome is one disease rather than
    two coincident ones. Tolerance fails broadly enough that autoantibodies arise
    against more than one blood lineage. In children this failure increasingly has
    a named molecular cause in an inborn error of immunity; in adults it more often
    sits on lupus, a lymphoproliferative disorder or common variable
    immunodeficiency, and in half of cases no cause is found at all.
  cell_types:
  - preferred_term: regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: T cell homeostasis
    modifier: ABNORMAL
    term:
      id: GO:0043029
      label: T cell homeostasis
  evidence:
  - reference: PMID:30349415
    reference_title: 'Evans syndrome: clinical perspectives, biological insights and treatment modalities.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Several authors have proposed different disease pathways, summarized by the presence
      of immune dysregulation with antibodies against erythrocytes, platelets and/or granulocytes17
      and decreased CD4:CD8 ratio.'
    explanation: States the two components of the unifying lesion together - multi-lineage
      autoantibodies and a disturbed T cell compartment.
  - reference: PMID:30349415
    reference_title: 'Evans syndrome: clinical perspectives, biological insights and treatment modalities.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'CTLA-4, LRBA, KRAS, STAT3 gain-of-function mutations are associated with ES secondary
      to a loss of T-cell homeostasis.'
    explanation: Names the molecular lesions found in paediatric cases and attributes them to loss
      of T cell homeostasis specifically, which is what this node represents.
  downstream:
  - target: Skewed T Cell Compartment
    causal_link_type: DIRECT
    description: The measurable cellular signature of the tolerance failure.
    evidence:
    - reference: PMID:30349415
      reference_title: 'Evans syndrome: clinical perspectives, biological insights and treatment modalities.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Abnormalities of immune regulation have been demonstrated in ES patients with a
        decreased level of T helper and increased T cytotoxic cells with a low CD4:CD8 ratio compared
        with healthy controls.'
      explanation: Gives the direction of the shift against healthy controls.
  - target: Systemic Lupus Erythematosus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: In children whose cytopenia is antinuclear antibody positive, the same tolerance
      failure declares itself later as systemic lupus. No cached source traces the steps between
      the cytopenia and the lupus, so the intermediates are left unstated; what the sources
      establish is the association and its restriction to the ANA-positive subgroup.
    evidence:
    - reference: PMID:38227934
      reference_title: Antinuclear antibody-associated autoimmune cytopenia in childhood is a risk factor for systemic lupus erythematosus.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'None of the patients with ANA-negative test developed SLE.'
      explanation: The absolute restriction to the ANA-positive subgroup is what makes this a
        stratified link rather than a general property of the syndrome.
  - target: Autoreactive B Cell Activation and Multi-Lineage Autoantibody Production
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Loss of regulatory constraint permits autoreactive B cells to mature and secrete
      antibody. The intermediate is the disturbed T cell compartment, which is curated separately.
    evidence:
    - reference: PMID:30349415
      reference_title: 'Evans syndrome: clinical perspectives, biological insights and treatment modalities.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'CTLA-4 or CD152 is an inhibitory transmembrane receptor at the surface of regulatory
        T-cells that bind with a high affinity to CD80/CD86 molecules in antigen-presenting cells with
        subsequent endocytosis and downregulation contributing to immune homeostasis.'
      explanation: Describes the regulatory brake whose loss is the named mechanism in the CTLA-4
        and LRBA forms, which is what makes the intermediate known rather than assumed.
- name: Skewed T Cell Compartment
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    A reduced CD4 to CD8 ratio, with fewer T helper and more cytotoxic T cells
    than in healthy controls. Recorded as PROVISIONAL because the observation is
    consistent across series but its causal position is not established: it may
    be the mechanism, a marker of it, or a consequence of chronic antigen
    exposure from ongoing cell destruction.

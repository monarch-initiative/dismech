pathophysiology:
- name: FBXO7 Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The root lesion is biallelic loss of FBXO7, which encodes F-box only
    protein 7, the substrate-recognition subunit of an SCF (SKP1-CUL1-F-box)
    E3 ubiquitin-ligase complex. Pathogenic alleles include a homozygous
    truncating variant (Arg498Stop), a homozygous missense variant (Arg378Gly)
    and compound-heterozygous splice and missense variants, all consistent with
    loss of function; in patient cells the nuclear FBXO7 isoform 1 is depleted
    and mutant proteins are destabilised.
  genes:
  - preferred_term: FBXO7
    term:
      id: hgnc:13586
      label: FBXO7
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic deleterious FBXO7 variants - homozygous truncating or missense
      in consanguineous families and compound heterozygous (splice-site plus
      missense) in others.
  molecular_functions:
  - preferred_term: SCF(FBXO7) ubiquitin-protein transferase activity
    term:
      id: GO:0004842
      label: ubiquitin-protein transferase activity
    modifier: DECREASED

    snippet: "We conclusively show that recessive FBXO7 mutations cause progressive neurodegeneration with extrapyramidal and pyramidal system involvement, delineating a novel genetically defined entity that we propose to designate as PARK15."
    explanation: The recessive inheritance that genetic counseling addresses.
differential_diagnoses:
- name: PRKN and PINK1 Early-Onset Parkinson Disease
  description: >-
    The common recessive early-onset parkinsonisms and FBXO7's closest
    mechanistic siblings: all three sit on the PINK1/Parkin
    mitochondrial-quality-control axis. PRKN and PINK1 disease is typically
    more levodopa-responsive and lacks the prominent pyramidal signs of PARK15.
- name: DNAJC6 and SYNJ1 Early-Onset Parkinsonism
  description: >-
    The presynaptic, endocytic recessive parkinsonisms (PARK19 and PARK20),
    which act through synaptic-vesicle endocytosis rather than proteostasis or
    mitophagy; like FBXO7 they are atypical, early-onset and often incompletely
    levodopa-responsive.
- name: ATP13A2-Related Juvenile Parkinsonism (PARK9)
  description: >-
    Kufor-Rakeb syndrome: a recessive juvenile dystonia-parkinsonism with
    pyramidal signs and additional neurologic features that overlaps the
    parkinsonian-pyramidal presentation of PARK15; both are MDSGene
    atypical-parkinsonism genes.

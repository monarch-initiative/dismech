name: FBXO7-Related Parkinsonian-Pyramidal Syndrome
creation_date: "2026-11-19T04:30:00Z"
category: Mendelian
description: >-
  FBXO7-related parkinsonian-pyramidal syndrome (PARK15; OMIM #260300) is an
  autosomal-recessive, early-onset neurodegenerative disorder caused by
  biallelic variants in FBXO7, the gene encoding F-box only protein 7, the
  substrate-recognition subunit of an SCF-type E3 ubiquitin-ligase complex.
  Its defining clinical feature is the combination of early-onset, progressive
  parkinsonism with pyramidal (corticospinal) tract signs - the
  pallido-pyramidal or parkinsonian-pyramidal syndrome first described by
  Davison in 1954. FBXO7 sits on the mitochondrial-quality-control arm of Parkinson
  biology alongside PRKN and PINK1, but its disease mechanism is still being
  resolved. The best-supported in-vivo route is proteasomal: FBXO7-SCF
  ubiquitinates the proteasome subunit PSMA2 and is needed for proteasome
  assembly, and FBXO7-knockout mice have reduced proteasome activity with
  motor deficits. A dopamine-neuron-specific knockout produces early striatal
  dopamine loss and slow nigral degeneration through an RPL23-MDM2-p53
  pro-apoptotic axis. An earlier-proposed role in PINK1/Parkin-mediated
  mitophagy is contested - reported in FBXO7-knockdown cells but not reproduced
  in clean FBXO7 knockouts - so it is modelled here as a provisional branch.
  All routes converge on nigrostriatal dopaminergic degeneration and
  variably levodopa-responsive parkinsonism, with concurrent pyramidal
  involvement.
parents:
- Movement Disorder
- Autosomal Recessive Early-Onset Parkinsonism
synonyms:

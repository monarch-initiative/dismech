    evidence:
    - reference: PMID:31144295
      reference_title: "Loss of FBXO7 results in a Parkinson's-like dopaminergic degeneration via an RPL23-MDM2-TP53 pathway."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we report that conditional deletion of Fbxo7 in the midbrain dopamine neurons results in an early reduction in striatal dopamine levels, together with a slow, progressive loss of midbrain dopamine neurons and onset of locomotor defects."
      explanation: The early striatal dopamine reduction this link represents.

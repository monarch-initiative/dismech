diagnosis:
- name: Molecular genetic diagnosis
  notes: >-
    Diagnosis rests on the parkinsonian-pyramidal phenotype plus biallelic
    pathogenic FBXO7 variants on molecular genetic testing, typically via an
    early-onset-parkinsonism gene panel or exome/genome sequencing.
  evidence:
  - reference: PMID:19038853
    reference_title: "FBXO7 mutations cause autosomal recessive, early-onset parkinsonian-pyramidal syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An FBXO7 homozygous truncating mutation (Arg498Stop) was found in an Italian family, while compound heterozygous mutations (a splice-site IVS7 + 1G/T mutation and a missense Thr22Met mutation) were present in a Dutch family."
    explanation: The biallelic FBXO7 genotypes on which the molecular diagnosis rests.
  - reference: PMID:20669327
    reference_title: "Early-onset L-dopa-responsive parkinsonism with pyramidal signs due to ATP13A2, PLA2G6, FBXO7 and spatacsin mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data suggest that these four genes account for many cases of Levodopa responsive parkinsonism with pyramidal signs cases formerly categorized clinically as pallido-pyramidal syndrome."
    explanation: FBXO7 is one of four genes behind the pallido-pyramidal presentation, supporting multigene-panel genetic testing.
genetic:
- name: FBXO7
  gene_term:
    preferred_term: FBXO7
    term:
      id: hgnc:13586
      label: FBXO7
  association: Causative
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:19038853
      reference_title: "FBXO7 mutations cause autosomal recessive, early-onset parkinsonian-pyramidal syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We conclusively show that recessive FBXO7 mutations cause progressive neurodegeneration with extrapyramidal and pyramidal system involvement, delineating a novel genetically defined entity that we propose to designate as PARK15."
      explanation: Establishes recessive (biallelic) inheritance for the entity.
  notes: >-
    FBXO7 encodes F-box only protein 7, the substrate-recognition subunit of an
    SCF-type E3 ubiquitin-ligase complex. The PARK15 locus was first mapped in
    a consanguineous Iranian parkinsonian-pyramidal-syndrome pedigree (R378G),
    then confirmed and named by the Italian/Dutch families. FBXO7 is one of the
    atypical-parkinsonism genes in the MDSGene systematic review. The cached
    ClinGen Gene-Disease Validity export carries no FBXO7 assertion (checked
    2026-11-19 via just list-gene-validity), so no gene_disease_validity row is
    recorded. There is no dedicated FBXO7 GeneReviews chapter; the only
    GeneReviews coverage is the Monogenic Parkinson Disease Overview (NBK1223),
    an overview without clinical-characteristics sections, so the phenotype
    baseline here is drawn from the primary literature and the MDSGene review.
  evidence:
  - reference: PMID:18513678
    reference_title: "Genome-wide linkage analysis of a Parkinsonian-pyramidal syndrome pedigree by 500 K SNP arrays."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The analysis was done on a large pedigree affected with Parkinsonian-pyramidal syndrome (PPS), and the results showed linkage to chromosome 22. Sequencing of candidate genes revealed a disease-associated homozygous variation (R378G) in FBXO7."
    explanation: The first mapping of the PARK15 locus and the R378G founding variant.
  - reference: PMID:19038853
    reference_title: "FBXO7 mutations cause autosomal recessive, early-onset parkinsonian-pyramidal syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclusively show that recessive FBXO7 mutations cause progressive neurodegeneration with extrapyramidal and pyramidal system involvement, delineating a novel genetically defined entity that we propose to designate as PARK15."
    explanation: Confirmation of FBXO7 as the cause and the PARK15 designation.
  - reference: PMID:34396589
    reference_title: "Genotype-Phenotype Relations for the Atypical Parkinsonism Genes: MDSGene Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "This Movement Disorder Society Genetic mutation database Systematic Review focuses on monogenic atypical parkinsonism with mutations in the ATP13A2, DCTN1, DNAJC6, FBXO7, SYNJ1, and VPS13C genes."
    explanation: FBXO7 is one of the MDSGene atypical-parkinsonism genes, the genotype-phenotype dataset for the disease.
  variants:
  - name: p.Arg378Gly
    description: >-
      A homozygous missense FBXO7 variant (R378G) identified in a large
      consanguineous Iranian parkinsonian-pyramidal-syndrome pedigree by the
      first PARK15 linkage study; the mutant protein is destabilised.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:18513678
      reference_title: "Genome-wide linkage analysis of a Parkinsonian-pyramidal syndrome pedigree by 500 K SNP arrays."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The analysis was done on a large pedigree affected with Parkinsonian-pyramidal syndrome (PPS), and the results showed linkage to chromosome 22. Sequencing of candidate genes revealed a disease-associated homozygous variation (R378G) in FBXO7."
      explanation: The homozygous R378G genotype in the Iranian pedigree.
    - reference: PMID:21347293
      reference_title: "Loss of nuclear activity of the FBXO7 protein in patients with parkinsonian-pyramidal syndrome (PARK15)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our data also suggest that overexpressed mutant FBXO7 proteins (T22M, R378G and R498X) have decreased stability compared to their wild type counterpart."
      explanation: The R378G protein is destabilised, consistent with loss of function.
  - name: p.Arg498Ter
    description: >-
      A homozygous truncating FBXO7 variant (Arg498Stop) reported in an Italian
      PARK15 family; predicted loss of function and destabilised in cells.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:19038853
      reference_title: "FBXO7 mutations cause autosomal recessive, early-onset parkinsonian-pyramidal syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "An FBXO7 homozygous truncating mutation (Arg498Stop) was found in an Italian family, while compound heterozygous mutations (a splice-site IVS7 + 1G/T mutation and a missense Thr22Met mutation) were present in a Dutch family."
      explanation: Reports the homozygous truncating genotype in the Italian family.
  - name: p.Thr22Met
    description: >-
      A missense FBXO7 variant found in compound heterozygosity (with a
      splice-site IVS7+1G/T variant) in a Dutch PARK15 family; the Thr22Met
      change prevents FBXO7 from interacting with Parkin in functional assays.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:19038853
      reference_title: "FBXO7 mutations cause autosomal recessive, early-onset parkinsonian-pyramidal syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "An FBXO7 homozygous truncating mutation (Arg498Stop) was found in an Italian family, while compound heterozygous mutations (a splice-site IVS7 + 1G/T mutation and a missense Thr22Met mutation) were present in a Dutch family."
      explanation: Reports the compound-heterozygous Thr22Met genotype in the Dutch family.
    - reference: PMID:23933751
      reference_title: "The Parkinson's disease-linked proteins Fbxo7 and Parkin interact to mediate mitophagy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The T22M mutation was found to prevent the interaction of Fbxo7 with Parkin, and was consequently unable to rescue Parkin translocation to the mitochondria."
      explanation: Functional consequence of the Thr22Met variant on FBXO7-Parkin interaction.
animal_models:
- name: FBXO7 knockout mouse
  species: Mouse
  genotype: Constitutive Fbxo7 knockout, plus NEX-Cre forebrain-neuron and TH-neuron conditional deletions
  publication: PMID:27497298
  description: >-
    Constitutive and neuron-specific FBXO7-knockout mice that show reduced
    proteasome activity and early-onset motor deficits, establishing FBXO7's
    neuronal role in proteasome function and modelling a parkinsonism-like
    phenotype.
  modeled_mechanisms:
  - target: Impaired Proteasome Assembly and Proteostasis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reduced proteasome activity in FBXO7-knockout mice, the in-vivo correlate of the proteostasis node.
    limitations: >-
      The constitutive knockout is a full null with premature death, whereas
      PARK15 patients carry hypomorphic biallelic point variants; proteasome
      activity is read out at the tissue level.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's quantity is complete absence of FBXO7 (a constitutive null
        with premature death); the disease's quantity is the reduced, residual
        activity of destabilising biallelic point variants, so the null stands
        in for a hypomorphic allele rather than reproducing it.
    readouts:
    - name: Proteasome activity in FBXO7-knockout brain
      target: Impaired Proteasome Assembly and Proteostasis
      direction: DECREASED
      interpretation: Reduced proteasome activity, the structural correlate of the proteostasis node.
      evidence:
      - reference: PMID:27497298
        reference_title: "Loss of FBXO7 (PARK15) results in reduced proteasome activity and models a parkinsonism-like phenotype in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In FBXO7 knockout mice, we find reduced proteasome activity and early-onset motor deficits together with premature death."
        explanation: Quantifies the reduced proteasome activity this readout represents.
    evidence:
    - reference: PMID:27497298
      reference_title: "Loss of FBXO7 (PARK15) results in reduced proteasome activity and models a parkinsonism-like phenotype in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In FBXO7 knockout mice, we find reduced proteasome activity and early-onset motor deficits together with premature death."
      explanation: Establishes the knockout as a model informative for the proteasome/proteostasis defect.
  - target: Parkinsonian-Pyramidal Motor Syndrome
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Neuron-specific FBXO7 deletion produces motor defects reminiscent of the PARK15 phenotype.
    limitations: >-
      The mouse reproduces motor deficits but not the specific
      parkinsonian-plus-pyramidal clinical dyad or its levodopa pharmacology.
    divergences:
    - divergence_type: INCOMPLETE_PHENOTYPE
      materiality: QUALIFYING
      description: >-
        The knockout shows motor deficits but not the full
        parkinsonian-pyramidal clinical dyad or its levodopa pharmacology, so
        it reproduces part of the syndrome and not the rest.
    evidence:
    - reference: PMID:27497298
      reference_title: "Loss of FBXO7 (PARK15) results in reduced proteasome activity and models a parkinsonism-like phenotype in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "NEX (neuronal helix-loop-helix protein-1)-Cre-induced deletion of the FBXO7 gene in forebrain neurons or the loss of FBXO7 in tyrosine hydroxylase (TH)-positive neurons results in motor defects, reminiscent of the phenotype in PARK15 patients."
      explanation: The neuron-specific deletions produce a PARK15-reminiscent motor phenotype.
- name: Midbrain dopamine-neuron Fbxo7 conditional knockout mouse
  species: Mouse
  genotype: Dopamine-neuron-specific (midbrain) conditional Fbxo7 deletion
  publication: PMID:31144295
  description: >-
    A conditional knockout deleting Fbxo7 in midbrain dopamine neurons, which
    reproduces early striatal dopamine loss and slow, progressive nigral
    dopaminergic degeneration driven by an RPL23-MDM2-p53 pro-apoptotic axis.
  modeled_mechanisms:
  - target: Nigrostriatal Dopaminergic Neurodegeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Slow, progressive loss of midbrain dopamine neurons after dopamine-neuron-specific Fbxo7 deletion.
    limitations: >-
      The model is a cell-type-specific conditional knockout rather than the
      patients' germline biallelic point variants, and the pyramidal component
      of the human disease is not modelled.
    divergences:
    - divergence_type: INCOMPLETE_PHENOTYPE
      materiality: QUALIFYING
      description: >-
        The model reproduces the nigrostriatal dopaminergic degeneration but
        not the pyramidal (corticospinal) component of the human disease, which
        lies outside a dopamine-neuron-specific conditional knockout.
    readouts:
    - name: Midbrain dopamine neuron count
      target: Nigrostriatal Dopaminergic Neurodegeneration
      direction: DECREASED
      interpretation: Progressive nigral dopaminergic neuron loss, the correlate of the degeneration node.
      evidence:
      - reference: PMID:31144295
        reference_title: "Loss of FBXO7 results in a Parkinson's-like dopaminergic degeneration via an RPL23-MDM2-TP53 pathway."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Here we report that conditional deletion of Fbxo7 in the midbrain dopamine neurons results in an early reduction in striatal dopamine levels, together with a slow, progressive loss of midbrain dopamine neurons and onset of locomotor defects."
        explanation: Quantifies the progressive dopaminergic neuron loss this readout represents.
    evidence:
    - reference: PMID:31144295
      reference_title: "Loss of FBXO7 results in a Parkinson's-like dopaminergic degeneration via an RPL23-MDM2-TP53 pathway."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we report that conditional deletion of Fbxo7 in the midbrain dopamine neurons results in an early reduction in striatal dopamine levels, together with a slow, progressive loss of midbrain dopamine neurons and onset of locomotor defects."
      explanation: Establishes the conditional knockout as a model of nigrostriatal degeneration.
  - target: Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Early reduction in striatal dopamine levels after dopamine-neuron-specific Fbxo7 deletion.
    limitations: >-
      Striatal dopamine is measured in a mouse conditional knockout; levodopa
      pharmacology was not the focus.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: IMMATERIAL
      description: >-
        The striatal dopamine deficit is measured in mouse striatum, but is

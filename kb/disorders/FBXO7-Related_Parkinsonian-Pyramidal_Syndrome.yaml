- name: Impaired PINK1/Parkin-Mediated Mitophagy
  conforms_to: "mitochondrial_dysfunction#Impaired Mitophagy and Quality Control"
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    A contested branch. FBXO7 was reported to be required for Parkin
    recruitment to depolarised mitochondria, mitofusin-1 ubiquitination and
    PINK1/Parkin-mediated mitophagy in FBXO7-knockdown cells; a later
    systematic study of clean FBXO7 knockouts in HeLa cells and iNeurons found
    no defect in Parkin recruitment, mitophagic flux or mitochondrial
    clearance, arguing against a general role. The node is therefore
    provisional and carries both the supporting and refuting evidence. It
    conforms to the mitochondrial-dysfunction module's mitophagy anchor.
  biological_processes:
  - preferred_term: autophagy of mitochondrion
    term:
      id: GO:0000422
      label: autophagy of mitochondrion
    modifier: DECREASED
  cell_types:
  - preferred_term: dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  evidence:
  - reference: PMID:23933751
    reference_title: "The Parkinson's disease-linked proteins Fbxo7 and Parkin interact to mediate mitophagy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cells with reduced Fbxo7 expression showed deficiencies in translocation of Parkin to mitochondria, ubiquitination of mitofusin 1 and mitophagy."
    explanation: The original report of impaired Parkin translocation and mitophagy on FBXO7 knockdown.
  - reference: PMID:37334901
    reference_title: "PARK15/FBXO7 is dispensable for PINK1/Parkin mitophagy in iNeurons and HeLa cell systems."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "We find that FBXO7-/- cells have no demonstrable defect in: (i) kinetics of pUb accumulation, (ii) pUb puncta on mitochondria by super-resolution imaging, (iii) recruitment of Parkin and autophagy machinery to damaged mitochondria, (iv) mitophagic flux, and (v) mitochondrial clearance as quantified by global proteomics."
    explanation: Clean FBXO7 knockouts show no mitophagy defect, refuting a general role for FBXO7 in PINK1/Parkin mitophagy.
  downstream:
  - target: Nigrostriatal Dopaminergic Neurodegeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      If operative, failure of mitophagy would allow damaged mitochondria to
      accumulate and contribute to dopaminergic degeneration; the branch is
      contested, so the link is provisional.
    evidence:
    - reference: PMID:23933751
      reference_title: "The Parkinson's disease-linked proteins Fbxo7 and Parkin interact to mediate mitophagy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Parkinson's disease-causing mutations in Fbxo7 interfered with this process, emphasizing the importance of mitochondrial dysfunction in Parkinson's disease pathogenesis."
      explanation: FBXO7 disease mutations disrupt the reported mitophagy function, the proposed (contested) tie to neurodegeneration.
- name: Nigrostriatal Dopaminergic Neurodegeneration
  conforms_to: "parkinsonism_dopaminergic_degeneration#Nigrostriatal Dopaminergic Neurodegeneration"
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Degeneration of substantia nigra pars compacta dopaminergic neurons, the
    shared downstream convergence point of the monogenic parkinsonisms. A
    dopamine-neuron-specific Fbxo7 knockout produces a slow, progressive loss
    of midbrain dopamine neurons, driven mechanistically by increased RPL23
    (a ribosomal-stress sensor) that inhibits MDM2 and so activates a
    pro-apoptotic p53 programme. The node conforms to the module's
    nigrostriatal-degeneration anchor; the neuron-apoptotic-process term
    follows that anchor.

  evidence:
  - reference: PMID:19038853
    reference_title: "FBXO7 mutations cause autosomal recessive, early-onset parkinsonian-pyramidal syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclusively show that recessive FBXO7 mutations cause progressive neurodegeneration with extrapyramidal and pyramidal system involvement, delineating a novel genetically defined entity that we propose to designate as PARK15."
    explanation: Establishes biallelic FBXO7 loss as the cause of the PARK15 parkinsonian-pyramidal entity.
  - reference: PMID:21347293
    reference_title: "Loss of nuclear activity of the FBXO7 protein in patients with parkinsonian-pyramidal syndrome (PARK15)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the common cellular abnormality found in the PARK15 patients from the Dutch and Italian families is the depletion of the FBXO7 isoform 1, which normally localizes in the cell nucleus."
    explanation: The loss-of-function cellular consequence of PARK15 variants in patient cell lines - depletion of nuclear FBXO7 isoform 1.
  downstream:
  - target: Impaired Proteasome Assembly and Proteostasis
    causal_link_type: DIRECT
    description: Loss of FBXO7-SCF ligase activity impairs proteasome assembly and ubiquitin-dependent protein degradation.
    evidence:
    - reference: PMID:27497298
      reference_title: "Loss of FBXO7 (PARK15) results in reduced proteasome activity and models a parkinsonism-like phenotype in mice."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here, we report that the E3 ligase FBXO7-SCF binds to and ubiquitinates the proteasomal subunit PSMA2. In addition, we show that FBXO7 is a proteasome-associated protein involved in proteasome assembly."
      explanation: FBXO7-SCF ubiquitinates PSMA2 and participates in proteasome assembly, the step lost downstream of FBXO7 loss.
  - target: Impaired PINK1/Parkin-Mediated Mitophagy
    causal_link_type: DIRECT
    description: >-
      FBXO7 was proposed to be required for PINK1/Parkin-mediated mitophagy;
      this branch is contested (see the node's refuting evidence).
    evidence:
    - reference: PMID:23933751
      reference_title: "The Parkinson's disease-linked proteins Fbxo7 and Parkin interact to mediate mitophagy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here we show that Fbxo7 participates in mitochondrial maintenance through direct interaction with PINK1 and Parkin and acts in Parkin-mediated mitophagy."
      explanation: The reported direct interaction with PINK1 and Parkin, the basis for the (contested) mitophagy branch.
  - target: Pyramidal System Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      FBXO7 loss also produces corticospinal (pyramidal) tract degeneration,
      which with the parkinsonism constitutes the parkinsonian-pyramidal
      syndrome; the mechanism linking FBXO7 loss to pyramidal involvement is
      not established.
    evidence:
    - reference: PMID:19038853
      reference_title: "FBXO7 mutations cause autosomal recessive, early-onset parkinsonian-pyramidal syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We conclusively show that recessive FBXO7 mutations cause progressive neurodegeneration with extrapyramidal and pyramidal system involvement, delineating a novel genetically defined entity that we propose to designate as PARK15."
      explanation: The discovery study documents pyramidal-system involvement alongside the extrapyramidal (parkinsonian) degeneration.

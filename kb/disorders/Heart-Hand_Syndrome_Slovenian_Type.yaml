discussions:
- discussion_id: hhs_slovenian_skeletal_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does a nuclear lamina defect produce brachydactyly, and why does the
    shortening fall disproportionately on the distal phalanges?
  rationale: >-
    This is the unexplained half of the disease and the reason it is a separate
    entity rather than a cardiac stratum. No molecular link between lamin A/C
    and digit or metatarsal patterning has been established, and the only
    published proposal is a comparative inference from acro-osteolysis in other
    LMNA disorders to a general susceptibility of distal limb elements to LMNA
    dosage. That proposal does not explain why one family's feet were severely
    affected with normal hands in the other, nor why a congenital static
    malformation and an adult-onset degenerative cardiac disease arise from one
    allele. Testable starting points exist - lamin A/C is expressed in
    chondrocytes, and limb-restricted Lmna models could be examined for digital
    patterning - but nobody has reported them.
  attaches_to:
  - pathophysiology#Disturbed Distal Limb Element Patterning
  - phenotypes#Brachydactyly
- discussion_id: hhs_slovenian_limb_penetrance
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the limb phenotype under-ascertained in LMNA cardiomyopathy generally,
    rather than specific to two families?
  rationale: >-
    The second family's allele, p.Arg335Trp, had already been published in
    patients with LMNA cardiac disease in whom limb anomalies were not reported,
    and one of those patients had acro-osteolysis. Hands are not usually
    radiographed in a cardiomyopathy clinic, and the brachydactyly here was only
    characterised by metacarpophalangeal pattern profile analysis, which is not
    a routine measurement. So the apparent rarity of heart-hand syndrome type IV
    may partly reflect which body part gets imaged. Settling this would change
    whether this is a distinct syndrome or a recognised-when-looked-for feature
    of LMNA disease, which is the same question as whether this entry should
    exist separately.
  attaches_to:
  - genetic#LMNA
  - phenotypes#Brachydactyly
- discussion_id: hhs_slovenian_microtubule_inference
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does microtubule-driven nuclear damage, demonstrated in lamin A/C-deficient
    cardiomyocytes, apply to a truncated or missense lamin A/C protein as found
    in this disease?
  rationale: >-
    The microtubule-force mechanism is the best-supported account of how a
    fragile nucleus becomes a failing heart, and it comes with a rescue
    experiment. But it was established in lamin A/C deficiency - a loss of
    protein - whereas this disease's alleles produce an abnormal protein that is
    present. A truncated lamin that incorporates into the meshwork and
    destabilises it is not obviously equivalent to an absent one, and the
    direction of the difference matters for whether microtubule-directed therapy
    would help here. No study has tested either of this disease's alleles in
    that assay.
  attaches_to:
  - pathophysiology#Microtubule-Driven Nuclear Damage in Cardiomyocytes

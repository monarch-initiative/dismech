treatments:
- name: Implantable Cardioverter-Defibrillator
  description: >-
    Device therapy for sudden-death prevention. The genotype matters for timing:
    LMNA is among the DCM genotypes carrying the highest arrhythmic risk, which
    supports genotype-guided implantation rather than waiting for the ejection
    fraction threshold used in unselected non-ischaemic cardiomyopathy. For this
    disease specifically there is a further consideration - the original
    kindred's allele is a splice-site variant, and splice-site mutations were
    an independent predictor of sudden cardiac death in the largest
    cardiolaminopathy follow-up series.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  evidence:
  - reference: PMID:23946316
    reference_title: "The need to modify patient selection to improve the benefits of implantable cardioverter-defibrillator for primary prevention of sudden death in non-ischaemic dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mutations in some known disease genes, including LMNA, have been associated
      with a high risk of SD
    explanation: >-
      Supports genotype-guided device selection by naming LMNA as a high
      sudden-death-risk genotype.
  - reference: PMID:18926329
    reference_title: "Long-term outcome and risk stratification in dilated cardiolaminopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By a bivariable Cox model, splice site mutations and competitive sport
      predicted sudden cardiac death.
    explanation: >-
      Identifies splice-site mutations as a sudden-death predictor, which is the
      allele class carried by this disease's original kindred.
- name: Avoidance of Competitive Athletic Activity
  description: >-
    The one modifiable risk factor identified in cardiolaminopathy. Sustained
    highly dynamic competitive sport over ten years or more was an independent
    predictor of events, and predicted sudden cardiac death alongside
    splice-site genotype. Note the evidence is from LMNA dilated cardiomyopathy
    cohorts generally, not from either heart-hand family.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: activity restriction counselling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  evidence:
  - reference: PMID:18926329
    reference_title: "Long-term outcome and risk stratification in dilated cardiolaminopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By multivariable analysis, New York Heart Association functional class III
      to IV and highly dynamic competitive sports for >or=10 years were
      independent predictors of total events.
    explanation: >-
      Establishes prolonged competitive sport as an independent predictor of
      events, which is what makes activity counselling an intervention rather
      than general advice.
- name: Genetic Counseling and Cascade Testing
  description: >-
    Because carriers are at risk of sudden death before any symptom, identifying
    the familial LMNA variant and testing relatives is the intervention with the
    largest effect on outcome. Penetrance is high but incomplete and
    age-dependent: in a 27-family cardiolaminopathy series 64% of carriers were
    phenotypically affected, so a genotype-positive, phenotype-negative relative
    needs surveillance rather than reassurance.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:18611980
    reference_title: "Heart-hand syndrome of Slovenian type: a new kind of laminopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      their relatives are at risk for developing sudden cardiac death and should
      beneficiate from appropriate LMNA genetic diagnosis
    explanation: Names LMNA genetic diagnosis of relatives as the indicated action.
  - reference: PMID:18926329
    reference_title: "Long-term outcome and risk stratification in dilated cardiolaminopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixty of 94 (64%) were phenotypically affected whereas 34 were only
      genotypically affected, including 5 with pre-clinical signs.
    explanation: >-
      Quantifies incomplete penetrance, which is why a genotype-positive
      relative requires surveillance.
- name: p38 MAPK Inhibition
  description: >-
    An investigational disease-modifying approach targeting the MAPK arm of the
    signalling cascade downstream of nuclear damage. The oral selective p38
    inhibitor ARRY-371797 was studied in a phase 2 open-label trial in
    LMNA-related dilated cardiomyopathy. Included here because it is the first
    therapy aimed at the mechanism rather than its consequences, and because it
    illustrates that the signalling arm of this pathograph is the druggable one;
    it is not established therapy, and no patient with this heart-hand syndrome
    has been reported on it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:36515663
    reference_title: "Efficacy and Safety of ARRY-371797 in LMNA-Related Dilated Cardiomyopathy: A Phase 2 Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This phase 2 study assessed the effects of the oral selective p38
      mitogen-activated protein kinase inhibitor ARRY-371797 on functional
      capacity and cardiac function in patients with LMNA-related dilated
      cardiomyopathy.
    explanation: >-
      Identifies the agent, its target and the population studied. The trial was
      in LMNA-related dilated cardiomyopathy broadly, not in this syndrome.
  target_mechanisms:
  - target: MAPK Pathway Hyperactivation
    description: >-
      p38 inhibition acts on the MAPK arm specifically, which is why the drug
      targets that node rather than the WNT arm or the lamina lesion itself.
      Pointing it at a combined signalling node would have asserted that the
      drug acts on reduced WNT signalling, which is not its mechanism.

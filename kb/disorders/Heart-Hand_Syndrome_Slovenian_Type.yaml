review_notes: >-
  Lump/split decision, recorded because this is where the entry is most open to
  challenge. LMNA is already extensively curated in this knowledge base, and the
  cardiac features here are not distinguishable from those of
  `Dilated_Cardiomyopathy_1A` or `Familial_Sick_Sinus_Syndrome`. The case for a
  separate Disease entry rather than a `has_subtypes` row on
  `Dilated_Cardiomyopathy_1A` rests entirely on the skeletal arm: brachydactyly
  is not part of the DCM1A pathograph, is not explicable by any node in it, and
  is not a severity stratum of cardiac disease. A subtype row would have to
  assert that this is cardiomyopathy-with-a-modifier, which misdescribes a
  pleiotropic two-organ syndrome with its own MONDO term, its own OMIM entry and
  its own position in the heart-hand nosology. The cardiac nodes here therefore
  duplicate content that exists elsewhere, which is the explicit dismech
  convention for conformance rather than inheritance.
  The opposite reading is defensible and should be raised if a curator thinks the
  distinct limb phenotype is better captured as a `has_subtypes` entry carrying
  its own phenotypes; nothing in the data settles it, only the question of what
  an entry is for.
notes: >-
  No GeneReviews chapter names this disease. Verified with `just
  check-genereviews --online` against the committed Bookshelf index snapshot of
  2026-09-10 plus a live PubMed title search, with the entry's four synonyms in
  place: NO_CHAPTER for both GeneReviews and StatPearls. GeneReviews does carry
  a chapter on LMNA-related dilated cardiomyopathy, which covers the cardiac arm
  of this disease but not the skeletal arm and does not name this entity, so it
  is not this entry's baseline. The baseline is the two published family
  reports and the gene identification between them.
inheritance:
- name: Autosomal Dominant
  description: >-
    Heterozygous LMNA variants transmitted through four generations in the
    original kindred and through at least three in the second family. Carriers
    are at risk of sudden cardiac death, which makes cascade testing of
    relatives the practical consequence of the diagnosis.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:15996213
    reference_title: "Familial progressive sinoatrial and atrioventricular conduction disease of adult onset with sudden death, dilated cardiomyopathy, and brachydactyly. A new type of heart-hand syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a family with 10 affected members in four generations
      suffering from adult-onset progressive sinoatrial and atrioventricular
      conduction disease, sudden death due to ventricular tachyarrhythmia,
      dilated cardiomyopathy, and a unique type of brachydactyly
    explanation: >-
      Four generations of affected members in one kindred, with the full
      two-organ phenotype, which is the dominant transmission pattern.
  - reference: PMID:18611980
    reference_title: "Heart-hand syndrome of Slovenian type: a new kind of laminopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As part of laminopathies with heart involvement, patients presenting with
      this phenotype and their relatives are at risk for developing sudden
      cardiac death and should beneficiate from appropriate LMNA genetic
      diagnosis.
    explanation: >-
      States the clinical consequence of dominant transmission - at-risk
      relatives warranting LMNA testing.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Two published families. The original Slovenian kindred (ten affected
    members) and a second family of German and Irish ancestry in which eleven
    individuals were classified for both the cardiac and hand phenotypes.
  evidence:
  - reference: PMID:27723096
    reference_title: "Heart-hand syndrome IV: a second family with LMNA-related cardiomyopathy and brachydactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a second HHS IV family due to a previously reported LMNA
      mutation (p.Arg335Trp).
    explanation: Establishes that only a second family was known at the time of this report.
genetic:
- name: LMNA
  gene_term:
    preferred_term: LMNA
    term:
      id: hgnc:6636
      label: LMNA
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    The two families carry mechanistically different alleles - a cryptic
    splice-site change producing a truncated lamin A/C, and a missense change in
    exon 6 - yet both produce brachydactyly with LMNA cardiac disease. That
    argues the limb phenotype is not specific to the truncating mechanism. The
    second family's allele, p.Arg335Trp, had been reported before in patients
    with cardiac disease in whom limb anomalies were not described, so
    penetrance or ascertainment of the skeletal arm is unresolved.
    `gene_disease_validity` is absent: ClinGen classifies LMNA for dilated
    cardiomyopathy and other phenotypes, but a tier assigned for a different
    MONDO disease is a different gene-disease pair and must not be copied onto
    this entry.
  evidence:
  - reference: PMID:18611980
    reference_title: "Heart-hand syndrome of Slovenian type: a new kind of laminopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This LMNA mutation segregates with a new type of heart-hand syndrome in a
      previously reported family suffering from adult onset progressive
      conduction system disease, atrial and ventricular tachyarrhythmias, sudden
      death, dilated cardiomyopathy, and brachydactyly with predominant foot
      involvement.
    explanation: >-
      The gene identification, with segregation in the originally described
      family.
  - reference: PMID:27723096
    reference_title: "Heart-hand syndrome IV: a second family with LMNA-related cardiomyopathy and brachydactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a heterozygous C>T missense variant in exon 6 as the primary mutation for
      both the cardiac and limb phenotypes
    explanation: >-
      Independent confirmation in a second family with a different allele,
      attributed by co-segregation analysis to both the cardiac and the limb
      phenotype. The quote starts after the RefSeq accession in square brackets,
      which the reference validator strips; the allele is named in the variant
      below.
  variants:
  - name: c.1609-12T>G (IVS9-12T>G)
    description: >-
      Intronic change creating a cryptic splice acceptor, so that 11 intronic
      nucleotides are retained in the mRNA and the resulting frameshift yields a
      truncated lamin A/C protein. This was the allele in the original Slovenian
      kindred, and the first demonstration of a truncated lamin A/C protein in
      patient cells.
    clinical_significance: PATHOGENIC
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:18611980
      reference_title: "Heart-hand syndrome of Slovenian type: a new kind of laminopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We report a new LMNA mutation (c.1609-12T>G, IVS9-12 T>G) that creates a
        new cryptic splicing site with the retention of 11 intronic nucleotides
        in the mRNA.
      explanation: Reports the allele and its splicing consequence.
    - reference: PMID:18611980
      reference_title: "Heart-hand syndrome of Slovenian type: a new kind of laminopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Analysis of the fibroblasts of two affected family members identified for
        the first time a truncated lamin A/C protein resulting from the frame
        shift created by the new splicing site, together with nuclear envelope
        abnormalities confirming that this LMNA mutation is pathogenic.
      explanation: >-
        Demonstrates the predicted truncated protein and the cellular phenotype
        in patient fibroblasts, which is the functional evidence for
        pathogenicity.
  - name: c.1003C>T (p.Arg335Trp)
    description: >-
      Heterozygous missense variant in exon 6, segregating with both the cardiac
      and the limb phenotype in the second family. Previously published in
      patients with LMNA cardiac disease in whom limb anomalies were not
      reported, including one with acro-osteolysis.
    clinical_significance: PATHOGENIC
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:27723096
      reference_title: "Heart-hand syndrome IV: a second family with LMNA-related cardiomyopathy and brachydactyly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients with LMNA c.1003C>T (p.Arg335Trp) and cardiac disease have been
        published; however, limb anomalies were not reported
      explanation: >-
        Records that the same allele has been seen without a reported limb
        phenotype, which is the ascertainment caveat on this variant.
pathophysiology:
- name: LMNA Variant Producing Structurally Abnormal Lamin A/C
  description: >-
    A heterozygous LMNA variant yielding an abnormal lamin A/C protein. The two
    published families reach this node by different routes: a cryptic
    splice-site change producing a frameshifted, truncated protein demonstrated
    in patient fibroblasts, and an exon 6 missense change. Lamin A/C is a type
    V intermediate filament protein forming the meshwork that underlies the
    inner nuclear membrane.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  genes:
  - preferred_term: LMNA
    term:
      id: hgnc:6636
      label: LMNA
  molecular_functions:
  - preferred_term: structural constituent of nuclear lamina
    modifier: DECREASED
    term:
      id: GO:0160123
      label: structural constituent of nuclear lamina
  downstream:
  - target: Weakened Nuclear Lamina
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18611980
      reference_title: "Heart-hand syndrome of Slovenian type: a new kind of laminopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        a truncated lamin A/C protein resulting from the frame shift created by
        the new splicing site, together with nuclear envelope abnormalities
      explanation: >-
        Shows the truncated protein and the nuclear envelope abnormality
        together in cells from affected members of this family, which is the
        patient-specific support for this edge.
- name: Weakened Nuclear Lamina
  description: >-
    The lamina meshwork is weakened and the nuclear envelope structurally
    abnormal, which is demonstrated in fibroblasts from this disease's own
    patients rather than only inferred from LMNA biology generally. This is the
    shared upstream lesion for both the cardiac and the skeletal arm, and the
    point at which they diverge.
  biological_scale: CELLULAR
  cellular_components:
  - preferred_term: nuclear lamina
    term:
      id: GO:0005652
      label: nuclear lamina
  biological_processes:
  - preferred_term: nuclear envelope organization
    modifier: DECREASED
    term:
      id: GO:0006998
      label: nuclear envelope organization
  downstream:
  - target: Microtubule-Driven Nuclear Damage in Cardiomyocytes
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41073815
      reference_title: "Microtubule forces drive nuclear damage in LMNA cardiomyopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: >-
        Mutations in LMNA, which encodes lamin A/C, weaken the nuclear lamina,
        leading to nuclear damage and muscle disease.
      explanation: >-
        States the step from a weakened lamina to nuclear damage and muscle
        disease, which is this edge. Quoted from the abstract's opening framing
        of established LMNA biology rather than from this study's own results.
  - target: Disturbed Distal Limb Element Patterning
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The intermediates are genuinely unknown. No molecular link between lamin
      A/C and digital or metatarsal patterning has been established, and this
      edge is recorded as the open question it is rather than left out.
  evidence:
  - reference: PMID:18611980
    reference_title: "Heart-hand syndrome of Slovenian type: a new kind of laminopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      nuclear envelope abnormalities confirming that this LMNA mutation is
      pathogenic
    explanation: Documents the nuclear envelope abnormality in this disease's own patient cells.
- name: Microtubule-Driven Nuclear Damage in Cardiomyocytes
  description: >-
    In contracting cardiomyocytes the fragile nucleus is damaged, and the force
    that damages it comes from the microtubule cage encircling the nucleus
    rather than from contractile strain transmitted through the LINC complex.
    That distinction is experimentally established and is counterintuitive:
    disrupting the LINC complex helps not by uncoupling contraction from the
    nucleus but by eliminating the microtubule cage. The work was done in
    lamin A/C-deficient models, not in this disease's variant, so the step is
    inferred for this entity.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  cellular_components:
  - preferred_term: perinuclear microtubule cage
    term:
      id: GO:0015630
      label: microtubule cytoskeleton
  downstream:
  - target: MAPK Pathway Hyperactivation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Reduced WNT/beta-catenin Signalling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:41073815
    reference_title: "Microtubule forces drive nuclear damage in LMNA cardiomyopathy."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Computational modeling revealed that microtubule forces create local stress
      concentrations that damage lamin A/C-deficient nuclei.
    explanation: >-
      Identifies microtubule force as the mechanical driver of nuclear damage.
      This is an in silico result, so it is graded COMPUTATIONAL; the
      experimental arms of the same study are graded separately above and below.
  - reference: PMID:41073815
    reference_title: "Microtubule forces drive nuclear damage in LMNA cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Microtubule disruption prevented nuclear damage and preserved cardiac
      function in lamin A/C deficiency.
    explanation: >-
      The rescue experiment, which is what makes microtubule force causal here
      rather than merely present.
  - reference: PMID:41073815
    reference_title: "Microtubule forces drive nuclear damage in LMNA cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The LINC complex was mostly dispensable for transferring contractile strain
      to the nucleus, and its disruption did not rescue elevated nuclear strain
      in lamin A/C-deficient cardiomyocytes.
    explanation: >-
      Excludes the LINC-transmitted contractile-strain route, which is why this
      node names microtubules specifically.
- name: MAPK Pathway Hyperactivation
  description: >-
    Nuclear damage is translated into myocardial dysfunction partly through MAPK
    hyperactivation, with the ERK, JNK and p38 branches all raised in the
    Lmna H222P mouse. This arm is separated from the WNT arm below because the
    two move in opposite directions - MAPK up, WNT down - and a single node
    cannot carry one `modifier`. It is also the arm with a drug: the p38
    inhibitor in trials targets this node, not the WNT one.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: MAPK cascade
    modifier: INCREASED
    term:
      id: GO:0000165
      label: MAPK cascade
  downstream:
  - target: Conduction System Degeneration and Myocardial Fibrosis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36515663
    reference_title: "Efficacy and Safety of ARRY-371797 in LMNA-Related Dilated Cardiomyopathy: A Phase 2 Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      p38 MAPK pathway activation has also been demonstrated in biopsies from
      the hearts of adult patients with LMNA-related DCM
    explanation: >-
      Establishes p38 MAPK activation in human LMNA-related cardiac tissue
      rather than only in the mouse, which is what makes this node a human
      claim. Quoted from the trial report's introduction summarising prior work.
  - reference: PMID:30319452
    reference_title: "Role of Lamin A/C Gene Mutations in the Signaling Defects Leading to Cardiomyopathies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The mechanisms by which expression of LmnaH222P leads to ERK1/2 signaling
      hyperactivation are under investigation.
    explanation: >-
      Records ERK1/2 hyperactivation in the mouse model and, in the same
      sentence, that how the variant produces it is unresolved - so the node
      asserts the activation, not its proximate cause.
- name: Reduced WNT/beta-catenin Signalling
  description: >-
    The arm most directly relevant to this disease's defining conduction
    phenotype. WNT/beta-catenin is reduced in LMNA cardiomyopathy with reduced
    connexin 43, the gap junction the conduction phenotype runs through, and
    pharmacological reactivation improves both contractility and
    intraventricular conduction in the mouse model. Separated from the MAPK node
    above because the two arms move in opposite directions.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Wnt signaling pathway
    modifier: DECREASED
    term:
      id: GO:0016055
      label: Wnt signaling pathway
  downstream:
  - target: Conduction System Degeneration and Myocardial Fibrosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28069793
      reference_title: "Decreased WNT/beta-catenin signalling contributes to the pathogenesis of dilated cardiomyopathy caused by mutations in the lamin a/C gene."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Activation of WNT/β-catenin activity with 6-bromoindirubin-3'-oxime
        improved cardiac contractility and ameliorated intraventricular
        conduction defects in LmnaH222P/H222P mice, which was associated with
        increased expression of myocardial connexin 43
      explanation: >-
        A rescue experiment tying this signalling arm specifically to conduction
        defects and to connexin 43, which is the gap junction the conduction
        phenotype runs through.
  evidence:
  - reference: PMID:28069793
    reference_title: "Decreased WNT/beta-catenin signalling contributes to the pathogenesis of dilated cardiomyopathy caused by mutations in the lamin a/C gene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Hearts of LmnaH222P/H222P mice also demonstrated lowered expression of the
      gap junction connexin 43.
    explanation: Documents the reduced connexin 43 that this node asserts.
- name: Conduction System Degeneration and Myocardial Fibrosis
  description: >-
    Progressive loss of sinoatrial and atrioventricular conduction tissue with
    myocardial fibrosis and contractile failure. The clinical course is
    characteristically adult-onset and progressive, running from sinus node
    disease and AV block through atrial and ventricular tachyarrhythmia to
    dilated cardiomyopathy and sudden death.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: cardiac conduction
    modifier: DECREASED
    term:
      id: GO:0061337
      label: cardiac conduction
  downstream:
  - target: Sick sinus syndrome
    causal_link_type: DIRECT
  - target: Atrioventricular block
    causal_link_type: DIRECT
  - target: Dilated cardiomyopathy
    causal_link_type: DIRECT
  - target: Ventricular tachycardia
    causal_link_type: DIRECT
  - target: Supraventricular tachycardia
    causal_link_type: DIRECT
  - target: Sudden cardiac death
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:15996213
    reference_title: "Familial progressive sinoatrial and atrioventricular conduction disease of adult onset with sudden death, dilated cardiomyopathy, and brachydactyly. A new type of heart-hand syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      adult-onset progressive sinoatrial and atrioventricular conduction
      disease, sudden death due to ventricular tachyarrhythmia, dilated
      cardiomyopathy
    explanation: Names the cardiac sequence this node produces, as observed in the original kindred.
- name: Disturbed Distal Limb Element Patterning
  description: >-
    Shortening of the tubular bones of the hands and feet, with a
    characteristic wavy metacarpophalangeal pattern profile and disproportionate
    involvement of the distal phalanges. How a nuclear lamina defect produces
    this is unknown, and it is the genuinely novel part of the phenotype. The
    one available clue is comparative: acro-osteolysis occurs in other LMNA
    disorders, and the distal-predominant shortening in both heart-hand families
    points the same way, suggesting the distal limb elements are the ones
    sensitive to LMNA dosage. The foot-versus-hand difference between the two
    families is unexplained.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: limb development
    modifier: DECREASED
    term:
      id: GO:0060173
      label: limb development
  - preferred_term: embryonic digit morphogenesis
    modifier: DECREASED
    term:
      id: GO:0042733
      label: embryonic digit morphogenesis
  mechanism_confidence: HYPOTHETICAL
  downstream:
  - target: Brachydactyly
    causal_link_type: DIRECT
  - target: Short distal phalanx of finger
    causal_link_type: DIRECT
  - target: Clinodactyly
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27723096
    reference_title: "Heart-hand syndrome IV: a second family with LMNA-related cardiomyopathy and brachydactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The more severe involvement of the distal phalanges seen in both families
      and acro-osteolysis seen in other LMNA patients suggests an increased
      susceptibility of the distal limb elements to disturbances in LMNA dosage.
    explanation: >-
      The only published mechanistic proposal for the skeletal arm, stated by
      its authors as a suggestion, which is why this node is marked
      HYPOTHETICAL.

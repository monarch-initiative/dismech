name: Heart-Hand Syndrome, Slovenian Type
creation_date: "2026-10-27T00:00:00Z"
category: Mendelian
description: >-
  An autosomal dominant laminopathy pairing LMNA-related cardiac disease with a
  distinctive brachydactyly, also designated heart-hand syndrome type IV. The
  cardiac arm is the familiar LMNA picture: adult-onset progressive sinoatrial
  and atrioventricular conduction disease, atrial and ventricular
  tachyarrhythmia, dilated cardiomyopathy, and sudden death. The skeletal arm is
  what makes it a distinct syndrome: brachydactyly affecting all the tubular
  bones, with a characteristic wavy metacarpophalangeal pattern profile and
  disproportionate shortening of the distal phalanges.
  Two families are published. In the original Slovenian kindred, ten affected
  members across four generations, the foot involvement was the more severe
  (short or absent middle phalanges, short metatarsals, terminal symphalangism,
  syndactyly) and cardiac presentation came in the fourth to fifth decade. In
  the second family, carrying LMNA p.Arg335Trp, the hands were affected with
  normal feet and the cardiac disease declared itself much earlier - syncope at
  12, cardiogenic shock at 27, sudden death at 23. Neither family showed
  myopathy or lipodystrophy, which separates this entity clinically from the
  other LMNA phenotypes.
  Heart-hand syndrome is a clinical grouping of several unrelated disorders, not
  a mechanism: HHS I is Holt-Oram syndrome (TBX5), HHS II Tabatznik syndrome and
  HHS III the Spanish type. Only Holt-Oram and this entity have an identified
  gene, and they are different genes.
synonyms:
- heart-hand syndrome type IV
- HHS IV
- atriodigital dysplasia, Slovenian type
- cardiac conduction disease-dilated cardiomyopathy-brachydactyly syndrome

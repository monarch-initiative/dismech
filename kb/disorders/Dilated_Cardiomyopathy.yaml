  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Dilated Cardiomyopathy"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS50000000049
  title: NGS on cardiac samples in Hungarian patients of dilated cardiomyopathy
  description: Heterozygous (HET) truncating mutations in the TTN gene (TTNtv) encoding the giant titin protein are the most common genetic cause of dilated cardiomyopathy (DCM). We investigated 127 clinically identified DCM human cardiac samples with targeted sequencing using the TruSight Cardio panel on an Illumina MiSeq system with a special focus on TTNtvs.

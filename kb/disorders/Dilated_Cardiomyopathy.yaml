- accession: geo:GSE312730
  title: ' Simtuzumab Attenuates Loxl2-Mediated Extracellular Matrix Remodeling and Preserves Cardiac Function in LMNA Mutation-Induced Dilated Cardiomyopathy'
  description: Background | Dilated cardiomyopathy (DCM) caused by LMNA mutations is a severe cardiac condition marked by arrhythmias, contractile dysfunction, and excessive myocardial fibrosis, which collectively impair left ventricular function and increase the risk of heart failure. While the disease has been well characterized, a lack of insight into the pathogenesis has impeded the development of therapies. Methods | Here, we employed induced pluripotent stem cells (hiPSCs) derived from a patient carrying a LMNA point mutation (c.665A>C, p.His222Pro), alongside a murine model carrying the same mutation, to investigate the functional and molecular abnormalities driving DCM.

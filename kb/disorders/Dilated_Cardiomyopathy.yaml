name: Dilated Cardiomyopathy
creation_date: '2026-03-06T00:00:00Z'
synonyms:
- DCM
- dilated cardiomyopathy
- congestive cardiomyopathy
- IDC
- idiopathic dilated cardiomyopathy
description: >-
  Dilated cardiomyopathy (DCM) is a disease of the heart muscle defined by left
  ventricular (or biventricular) dilation and impaired systolic contraction in
  the absence of abnormal loading conditions or coronary disease sufficient to
  explain it. Causes include sarcomere and cytoskeletal gene mutations,
  myocarditis, alcohol and other toxins, and the peripartum state. Progressive
  ventricular remodeling leads to heart failure, arrhythmia, and sudden death.
notes: >-
  Parent anchor. MONDO:0005021 "dilated cardiomyopathy" is the right term for
  this entry: it is the umbrella concept, not a gene-named leaf standing in
  for one. Its three direct MONDO children are viral, familial and
  non-familial dilated cardiomyopathy, which is the same clinical and
  etiologic axis the has_subtypes rows here use. No anchor change was needed.

  Why the numbered loci are not has_subtypes rows here. The numbered CMD and
  DCM designations sit two MONDO levels below this entry, as children of
  familial dilated cardiomyopathy (MONDO:0016333) or familial isolated dilated
  cardiomyopathy (MONDO:0700335), not as children of MONDO:0005021. This
  knowledge base already curates that level as standalone Disease entries: 32
  of them exist, and 13 more are queued in stubs/. Adding some of the same
  concepts as subtype rows on this umbrella would put a gene-locus axis and a
  clinical-etiology axis in one flat list and would duplicate entries that
  already carry the MONDO bindings. So the ruling for this entry is that the
  numbered loci stay standalone, and what belongs here is the gene panel with
  each gene wired to the mechanism it acts through.

  Genes added and genes dispositioned. Four genes that had no binding on this
  entry were added, each wired to a node: C10orf71, CAP2, PPCS and EMD. Two
  were not added, for reasons recorded rather than assumed.

  CSRP3. The committed ClinGen cache carries one CSRP3 gene validity
  assertion, and it is Definitive for hypertrophic cardiomyopathy, not for
  dilated cardiomyopathy; no CSRP3 to dilated cardiomyopathy assertion is
  present in that cache. The 2008 study that established CSRP3 as a
  hypertrophic cardiomyopathy gene states that earlier work had associated
  CSRP3 missense mutations with either dilated cardiomyopathy or hypertrophic
  cardiomyopathy without comprehensive genetic evidence for a causative role.
  CSRP3 is bound in this knowledge base only on Hypertrophic_Cardiomyopathy,
  which is where its high-evidence relationship is, and it is left there. The
  dilated designation CMD1M (MONDO:0011840) has an open stub.

  RAF1. RAF1's Definitive ClinGen relationship in the committed cache is with
  Noonan syndrome, and the dilated cardiomyopathy concept MONDO points at,
  dilated cardiomyopathy 1NN (MONDO:0014396), already has its own curated
  entry, Dilated_Cardiomyopathy_1NN, where RAF1 is bound. RAF1 is a RASopathy
  gene whose cardiomyopathy is part of that syndromic spectrum, so it is not
  added to this nonsyndromic panel.

  EMD was added despite being an Emery-Dreifuss muscular dystrophy gene,
  because a cardiac-only emerinopathy is a documented separate phenotype; the
  evidence item on that record carries the authors' own statement that the
  evidence had been insufficient before their study, so it is recorded as
  emerging rather than established.

  Mechanism nodes added. Before this pass, 33 of the 48 genes on this entry
  reached a pathophysiology node; the other 15 were listed with a ClinGen
  validity assertion and nothing else. Five nodes were added so that each
  reaches the step it acts at rather than a single sarcomeric list: calcium
  release dysregulation (JPH2, RYR2), excitability and conduction instability
  (SCN5A, ABCC9, TNNI3K), proteostasis (BAG5, FBXO32, GET3, PLEKHM2, RPL3L),
  transcriptional and developmental program (TBX20, PRDM16, GATAD1, MIB1), and
  coenzyme A biosynthesis (PPCS). Calcium release and membrane excitability are
  separate steps with separate consequences - the calcium genes are argued to
  systolic dysfunction and the channel and kinase genes to arrhythmia - so they
  are two nodes rather than one.

  CTF1 is the one gene left unwired, deliberately. ClinGen classifies CTF1 to
  dilated cardiomyopathy as Limited. Cardiotrophin-1 is an interleukin-6
  family cytokine signalling through gp130, so the nearest node here is IL-11
  signalling in cardiac fibroblasts, which is scoped to IL-11 in fibroblasts
  specifically and not to the cytokine family; the neurohormonal node
  describes renin-angiotensin and sympathetic activation, which a cytokine
  gene does not cause. Two PubMed searches were run to check for a mechanism
  to attach the gene to. "(CTF1[Title/Abstract] OR
  cardiotrophin-1[Title/Abstract]) AND (dilated cardiomyopathy[Title/Abstract])"
  returns ten records, of which one is a human genetic study: a 2000 report of
  promoter and coding variants in patients (PMID:11058912). The other nine
  measure cardiotrophin-1 expression, plasma level or downstream signalling
  rather than the consequence of a CTF1 variant. "cardiotrophin-1 AND dilated
  cardiomyopathy AND (mutation OR variant OR polymorphism)" returns that same
  single record. So no source was found tying a CTF1 variant to a specific
  myocardial mechanism. Rather than attach the gene to a node
  its evidence does not reach, it is left listed and this is recorded.

  ClinGen disagrees with its own publication on JPH2. The committed ClinGen
  gene validity snapshot, pinned in data/clingen/MANIFEST.yaml at 2026-08-13,
  carries two JPH2 assertions for dilated cardiomyopathy from the Dilated
  Cardiomyopathy Gene Curation Expert Panel, both dated 2025-01-24: autosomal
  recessive Strong and autosomal dominant Limited. The same panel's 2026 publication reports the pair the
  other way round, as autosomal dominant Strong and autosomal recessive
  Limited. The two JPH2 evidence items on this entry quote the cached rows
  exactly and were left as they are; the discrepancy is recorded here rather
  than resolved, because nothing in this repository can settle which direction
  is correct.

  NEXN has two numbered classes. MONDO attributes NEXN to both dilated
  cardiomyopathy 1CC (MONDO:0013147, OMIM:613122) and cardiomyopathy, dilated,
  2M (MONDO:0979243, OMIM:621261). These are two separate OMIM entries, so
  this is not a duplicate MONDO term pair. What distinguishes them was not
  established here, and neither is curated as a row on this entry under the
  ruling above.

  GeneReviews baseline. The Dilated Cardiomyopathy Overview chapter
  (PMID:20301486) is tagged in the references block. Its cached record is the
  chapter's purpose statement only, four numbered aims and no clinical or
  genetic content, so no evidence was mined from it. The LMNA-Related Dilated
  Cardiomyopathy chapter (PMID:20301717) also matches this entry's name by
  substring. It is tagged in the references block as the GeneReviews chapter
  it is, but it is a gene-specific chapter whose subject is the LMNA locus -
  curated in this knowledge base as Dilated_Cardiomyopathy_1A, which cites it
  throughout - so it is not this umbrella's baseline chapter and nothing is
  mined from it here.

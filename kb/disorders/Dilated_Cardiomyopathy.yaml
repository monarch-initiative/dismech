  evidence:
  - reference: PMID:37962957
    reference_title: "Truncated titin is structurally integrated into the human dilated cardiomyopathic sarcomere."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Heterozygous (HET) truncating variant mutations in the TTN gene (TTNtvs), encoding the giant titin protein, are the most common genetic cause of dilated cardiomyopathy (DCM).
    explanation: Confirms TTN truncating variants as the most common genetic cause of DCM.
  - reference: PMID:37962957
    reference_title: "Truncated titin is structurally integrated into the human dilated cardiomyopathic sarcomere."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The occurrence of TTNtv was found to be 15% in the DCM cohort.
    explanation: Provides the 15% frequency of TTNtv in a DCM cohort.
  - reference: PMID:37788487
    reference_title: "Genetics of Dilated Cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Many gene mutations have been identified that contribute to phenotypically significant cardiomyopathy. DCM genes can affect a variety of cardiomyocyte functions, and particular genes whose function affects the cell-cell junction and cytoskeleton are associated with increased risk of arrhythmias and sudden cardiac death.
    explanation: Confirms that DCM genes affect cardiomyocyte functions including cytoskeletal integrity.
  - reference: PMID:22517884
    reference_title: "Patient-specific induced pluripotent stem cells as a model for familial dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "cardiomyocytes derived from iPSCs from DCM patients exhibited altered regulation of calcium ion (Ca(2+)), decreased contractility, and abnormal distribution of sarcomeric α-actinin."
    explanation: >
      New Approach Methodology (NAM) "disease-in-a-dish" model: patient-specific
      iPSC-derived cardiomyocytes from a family carrying the sarcomeric TNNT2 R173W
      mutation recapitulate this node's sarcomeric-dysfunction to impaired-contractility
      mechanism in vitro, without an animal model.
- name: Neurohormonal Activation
  description: >
    Reduced cardiac output activates the renin-angiotensin-aldosterone system
    and sympathetic nervous system, causing vasoconstriction, sodium and water
    retention, and further myocardial stress. Chronic neurohormonal activation
    promotes adverse cardiac remodeling.
  biological_processes:
  - preferred_term: renin-angiotensin regulation of aldosterone production
    term:
      id: GO:0002018
      label: renin-angiotensin regulation of aldosterone production
  evidence:
  - reference: PMID:37254024
    reference_title: "Guideline-Directed Medical Therapy for the Treatment of Heart Failure with Reduced Ejection Fraction."
    supports: SUPPORT
    snippet: "renin-angiotensin system inhibitors, evidence-based β-blockers, mineralocorticoid inhibitors and sodium glucose cotransporter 2 inhibitors"
    explanation: Establishes that the four foundational HFrEF drug classes act by blocking the renin-angiotensin and sympathetic systems. Note this is therapeutic rather than direct mechanistic evidence - it shows the pathway is druggable, not that it is activated.
    evidence_source: HUMAN_CLINICAL
  - reference: PMID:33250269
    reference_title: "New treatment for myocardial diseases."
    supports: SUPPORT
    snippet: "Treatment of myocardial diseases with renin-angiotensin system inhibitors and β-blockers has greatly contributed to improving prognosis."
    explanation: Confirms the therapeutic importance of targeting neurohormonal activation in myocardial diseases including DCM.
    evidence_source: HUMAN_CLINICAL
  downstream:
  - target: IL-11 Signalling in Cardiac Fibroblasts
    description: >-
      Neurohormonal (angiotensin II) activation drives cardiac fibroblast IL-11
      induction, placing IL-11 receptor signalling downstream of the
      neurohormonal stress that promotes adverse remodeling.
    evidence:
    - reference: PMID:29160304
      reference_title: "IL-11 is a crucial determinant of cardiovascular fibrosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        established stimuli for cardiac fibrosis (endothelin-1 (END1),
        angiotensin II (AngII) and PDGF)
      explanation: >-
        Identifies angiotensin II - the effector of neurohormonal activation -
        among the established cardiac-fibrosis stimuli tested for IL-11
        induction in cardiac fibroblasts. Evidence source is IN_VITRO (primary
        human cardiac fibroblasts).
    - reference: PMID:29160304
      reference_title: "IL-11 is a crucial determinant of cardiovascular fibrosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        All pro-fibrotic stimuli that were tested induced changes in IL-11
        protein levels but not mRNA
      explanation: >-
        Shows the tested pro-fibrotic stimuli, angiotensin II among them, induce
        cardiac fibroblast IL-11 protein, supporting this neurohormonal-to-IL-11
        edge. Evidence source is IN_VITRO (primary human cardiac fibroblasts).
- name: IL-11 Signalling in Cardiac Fibroblasts
  conforms_to: "il11_erk_ampk_mtor_aging#IL-11 Receptor Signalling Activation"
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    Profibrotic stress upregulates IL-11 and IL11RA in cardiac fibroblasts,
    driving ERK-dependent (non-canonical) autocrine signalling that promotes
    their fibroblast-to-myofibroblast transformation and ECM gene expression.
    This IL-11 receptor-signalling arm is an organ-specific instance of the
    conserved IL-11 signalling module and feeds myocardial fibrosis; neutralizing
    anti-IL-11 or anti-IL11RA antibodies reduce cardiac fibrosis and ERK
    activation without affecting hypertrophy.
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  cell_types:
  - preferred_term: cardiac fibroblast
    term:
      id: CL:0002548
      label: fibroblast of cardiac tissue
  biological_processes:
  - preferred_term: Interleukin-11-mediated signaling pathway
    term:
      id: GO:0038154
      label: interleukin-11-mediated signaling pathway
    modifier: INCREASED
  - preferred_term: ERK1 and ERK2 cascade
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
    modifier: INCREASED
  evidence:
  - reference: PMID:33462828
    reference_title: "Antibody-mediated neutralization of IL11 signalling reduces ERK activation and cardiac fibrosis in a mouse model of severe pressure overload."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Inhibition of IL11 signalling reduced AAC-induced cardiac fibrosis and ECM
      gene expression as well as ERK1/2 phosphorylation but had no effect on
      cardiac hypertrophy.
    explanation: >-
      Directly evidences that anti-IL-11 reduces cardiac fibrosis and ERK1/2
      phosphorylation in a cardiac-fibroblast-driven model, grounding this node.
      Evidence source is MODEL_ORGANISM (mouse ascending aortic constriction).
  - reference: PMID:33462828
    reference_title: "Antibody-mediated neutralization of IL11 signalling reduces ERK activation and cardiac fibrosis in a mouse model of severe pressure overload."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      blocking IL11 signalling reduces cardiac fibrosis due to severe pressure
      overload and suggests ERK, but not STAT3, activity as the relevant
      underlying signalling pathway
    explanation: >-
      Identifies the non-canonical ERK arm (not canonical STAT3) as the
      fibrosis-relevant IL-11 pathway in the heart, consistent with the module's
      receptor-signalling node and its canonical-vs-non-canonical knowledge gap.
      Evidence source is MODEL_ORGANISM (mouse pressure-overload model plus
      cardiac fibroblasts).
  - reference: PMID:29160304
    reference_title: "IL-11 is a crucial determinant of cardiovascular fibrosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In mice, fibroblast-specific Il11 transgene expression or Il-11 injection
      causes heart and kidney fibrosis and organ failure, whereas genetic
      deletion of Il11ra1 protects against disease.
    explanation: >-
      Shows fibroblast IL-11 is sufficient to cause heart fibrosis and organ
      failure and that receptor deletion is protective. Evidence source is
      MODEL_ORGANISM (transgenic and Il11ra1-knockout mice).
  - reference: PMID:29160304
    reference_title: "IL-11 is a crucial determinant of cardiovascular fibrosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      IL-11 and its receptor (IL11RA) are expressed specifically in fibroblasts,
      in which they drive non-canonical, ERK-dependent autocrine signalling that
      is required for fibrogenic protein synthesis.
    explanation: >-
      Establishes the ERK-dependent autocrine IL-11 receptor-signalling arm in
      fibroblasts modeled by this node. Evidence source is IN_VITRO (primary
      human cardiac fibroblasts).
  downstream:
  - target: Myocardial Fibrosis

- name: Myocardial Fibrosis
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  description: >
    Progressive replacement and interstitial fibrosis within the ventricular
    myocardium impairs diastolic filling, increases myocardial stiffness, and
    creates substrates for re-entrant arrhythmias. Late gadolinium enhancement
    on cardiac MRI is a strong predictor of adverse outcomes.

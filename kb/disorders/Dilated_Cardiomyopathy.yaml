  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from metabolomics_workbench. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Dilated Cardiomyopathy"). Retrieved 2026-08-02.
- accession: massive:MSV000095560
  title: Lipid Supplements Protect Dilated Cardiomyopathy
  description: Lipid (Plasmalogen) levels can be modulated via a dietary supplement called alkylglycerols (AG) which has demonstrated benefits in some disease settings. However, its therapeutic potential in cardiomyopathy remains unknown. This study explored an optimized AG supplement in restoring plasmalogen levels and attenuate cardiac dysfunction/pathology. Here, we placed a cardiac-specific transgenic cardiomyopathy mouse model, with cardiac function and molecular landscape assessed.

- name: C10orf71
  gene_term:
    preferred_term: C10orf71
    term:
      id: hgnc:26973
      label: C10orf71
  association: >-
    Autosomal dominant causal pathogenic variant. C10orf71 encodes an
    intrinsically disordered, cardiomyocyte-specific protein also reported as
    the z-disc protein CEFIP. Frameshift variants were identified in a large
    family with eight affected members and in four further loss-of-function
    carriers across two sporadic DCM cohorts. Null cardiomyocytes lose
    contractile function while sarcomere structure stays intact, so the lesion
    is contractile rather than structural.
  evidence:
  - reference: PMID:38950288
    reference_title: "Frameshift variants in C10orf71 cause dilated cardiomyopathy in human, mouse, and organoid models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We identified candidate DCM causal gene, C10orf71, in a large family
      with 8 patients with DCM by whole-exome sequencing. Four
      loss-of-function variants of C10orf71 were subsequently identified in an
      additional group of492 patients with sporadic DCM from 2 independent
      cohorts. C10orf71 was found to be an intrinsically disordered protein
      specifically expressed in cardiomyocytes.
    explanation: >-
      Establishes C10orf71 as a DCM gene from a large family plus two
      independent sporadic cohorts, and states its cardiomyocyte-specific
      expression.
  - reference: PMID:38950288
    reference_title: "Frameshift variants in C10orf71 cause dilated cardiomyopathy in human, mouse, and organoid models."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      C10orf71-null cardiomyocytes exhibited impaired contractile function
      with unaffected sarcomere structure. Cardiomyocytes and heart organoids
      derived from human induced pluripotent stem cells with C10orf71
      frameshift variants also had contractile defects with normal
      electrophysiological activity. A rescue study using a cardiac myosin
      activator, omecamtiv mecarbil, restored contractile function in
      C10orf71-KO mice. These data support C10orf71 as a causal gene for DCM
      by contributing to the contractile function of cardiomyocytes.
    explanation: >-
      Supports the contractile rather than structural nature of the lesion, in
      knockout mouse, null cardiomyocyte and human iPSC-derived organoid
      models.
  - reference: PMID:28717008
    reference_title: "The novel cardiac z-disc protein CEFIP regulates cardiomyocyte hypertrophy by modulating calcineurin signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Importantly, CEFIP was located at the z-disc and was up-regulated in
      several models of cardiomyopathy.
    explanation: >-
      Locates the C10orf71 product, CEFIP, at the cardiac z-disc, which is why
      this gene is wired to the sarcomeric and cytoskeletal node.
- name: CAP2
  gene_term:
    preferred_term: CAP2
    term:
      id: hgnc:20039
      label: CAP2
  association: >-
    Autosomal recessive causal pathogenic variant. CAP2 encodes a
    cyclase-associated actin cytoskeleton regulatory protein required for the
    kinetics of actin filament repolymerization; a homozygous splice-consensus
    variant in a consanguineous Bedouin family caused DCM with
    supraventricular tachycardia, and patient fibroblasts showed altered actin
    repolymerization kinetics.
  evidence:
  - reference: PMID:30518548
    reference_title: "CAP2 mutation leads to impaired actin dynamics and associates with supraventricular tachycardia and dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      This is the first report of a recessive deleterious mutation in CAP2 and
      its association with DCM in humans. The clinical phenotype recapitulates
      the damaging effects on the heart observed in Cap2 knockout mice
      including DCM and cardiac conduction disease, but not the other effects
      on growth, viability, wound healing and eye development. Our data
      underscore the importance of the proper kinetics of actin polymerization
      for normal function of the human heart.
    explanation: >-
      Reports the first recessive CAP2 variant associated with human DCM and
      ties it to actin polymerization kinetics.
- name: PPCS
  gene_term:
    preferred_term: PPCS
    term:
      id: hgnc:25686
      label: PPCS
  association: >-
    Autosomal recessive causal pathogenic variant. PPCS catalyses the second
    step of de novo coenzyme A biosynthesis from vitamin B5. Biallelic
    variants were found in five individuals from two unrelated families
    presenting with dilated cardiomyopathy, with reduced CoA levels in
    fibroblasts. This is a cofactor-biosynthesis lesion rather than a
    sarcomeric or cytoskeletal one, and CoA can be made from pantethine
    independently of PPCS, which is why pantethine was proposed as a targeted
    treatment.
  evidence:
  - reference: PMID:29754768
    reference_title: "Mutations in PPCS, Encoding Phosphopantothenoylcysteine Synthetase, Cause Autosomal-Recessive Dilated Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Exome sequencing in five individuals from two unrelated families
      presenting with dilated cardiomyopathy revealed biallelic mutations in
      PPCS, linking CoA synthesis with a cardiac phenotype. Studies in yeast
      and fruit flies confirmed the pathogenicity of identified mutations.
      Biochemical analysis revealed a decrease in CoA levels in fibroblasts of
      all affected individuals.
    explanation: >-
      Reports biallelic PPCS variants in five individuals from two families
      with DCM and the reduced fibroblast CoA levels that make this a coenzyme
      A biosynthesis lesion.
- name: EMD
  gene_term:
    preferred_term: EMD
    term:
      id: hgnc:3331
      label: EMD
  association: >-
    X-linked causal pathogenic variant. EMD encodes emerin, an inner nuclear
    membrane protein whose loss classically causes Emery-Dreifuss muscular
    dystrophy type 1, curated separately in this knowledge base. A distinct
    cardiac-only phenotype exists: the c.23C>G p.Ser8Trp missense variant
    co-segregated with DCM in six hemizygous males aged 36 to 50 with no
    muscular dystrophy, with greatly reduced myocardial emerin. The authors of
    that study note that before it the evidence for isolated DCM as an EMD
    phenotype was insufficient, so this gene is recorded here as an emerging
    rather than an established nonsyndromic DCM gene.
  evidence:
  - reference: PMID:40065010
    reference_title: "EMD missense variant causes X-linked isolated dilated cardiomyopathy with myocardial emerin deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We concluded that the EMD c.23C>G missense variant is associated with
      DCM in the absence of muscular dystrophy, thereby providing new evidence
      of isolated DCM as a distinct cardiac EMD-phenotype, separate from
      EDMD1.
    explanation: >-
      Supports isolated DCM as an EMD phenotype distinct from Emery-Dreifuss
      muscular dystrophy type 1.
  - reference: PMID:40065010
    reference_title: "EMD missense variant causes X-linked isolated dilated cardiomyopathy with myocardial emerin deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Although an association with isolated dilated cardiomyopathy (DCM) has
      been suggested, evidence is currently insufficient to verify the
      gene-disease association.
    explanation: >-
      Records the authors' own statement that, before their family study, the
      evidence for the EMD to isolated DCM gene-disease association was
      insufficient. Kept as the caveat on this record.
treatments:
- name: ACE Inhibitors / ARBs
  description: First-line neurohormonal blockade to reduce afterload and prevent adverse remodeling.
  treatment_term:
    preferred_term: ACE inhibitor therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
  target_mechanisms:
  - target: Neurohormonal Activation
    treatment_effect: INHIBITS
    description: >-
      ACE inhibitors and ARBs block the renin-angiotensin-aldosterone axis,
      reducing angiotensin II-mediated vasoconstriction, aldosterone-driven
      fluid retention, and downstream adverse cardiac remodeling.
- name: Beta-Blockers
  description: Reduce heart rate and neurohormonal activation, improving survival in heart failure with reduced ejection fraction.
  treatment_term:
    preferred_term: beta-blocker therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Neurohormonal Activation
    treatment_effect: INHIBITS
    description: >-
      Beta-blockers block cardiac adrenergic receptors, attenuating sympathetic
      neurohormonal activation, reducing heart rate, and reversing catecholamine-driven
      adverse remodeling in DCM.
- name: SGLT2 Inhibitors
  description: Newer therapy shown to reduce heart failure hospitalization and cardiovascular death in HFrEF regardless of diabetes status.
  treatment_term:
    preferred_term: SGLT2 inhibitor therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Mitochondrial Dysfunction
    treatment_effect: MODULATES
    description: >-
      SGLT2 inhibitors promote ketone utilization as a more oxygen-efficient
      myocardial fuel and improve mitochondrial bioenergetics in cardiomyocytes,
      partially reversing the mitochondrial dysfunction that contributes to
      DCM progression.
- name: Cardiac Resynchronization Therapy
  description: Biventricular pacing for patients with wide QRS and reduced LVEF to improve synchrony and outcomes.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cardiac resynchronization therapy
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Sarcomeric and Cytoskeletal Dysfunction
    treatment_effect: MODULATES
    description: >-
      Biventricular pacing restores electromechanical synchrony, reducing
      dyssynchrony-driven regional wall stress and the sarcomeric and
      cytoskeletal maladaptation that worsens ventricular dysfunction in DCM.
- name: Heart Transplantation
  description: Definitive therapy for end-stage DCM refractory to medical and device therapy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: heart transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
- name: Implantable Cardioverter-Defibrillator
  description: Indicated for primary prevention of sudden cardiac death in patients with LVEF <=35% despite optimal medical therapy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C15329
      label: Surgical Procedure
- name: Genetic Counseling
  description: Recommended for patients with familial or genetic DCM to guide cascade screening and family management.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37788487
    reference_title: "Genetics of Dilated Cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Through advancements in next-generation sequencing and cardiac imaging, identification of genetic DCM has improved over the past couple decades, and precision medicine is now at the forefront of treatment for these patients and their families.
    explanation: Confirms the importance of genetic identification and precision medicine in DCM management.
  - reference: PMID:39519012
    reference_title: "Dilated Cardiomyopathy: A Genetic Journey from Past to Future."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Current guidelines recommend genetic counseling and screening, as well as endorsing a handful of genotype-specific therapies
    explanation: Guidelines explicitly recommend genetic counseling and screening for DCM.
experimental_models:
- name: Patient-specific TNNT2 R173W iPSC-derived cardiomyocytes (Clinical Trials in a Dish)
  description: >-
    Cardiomyocytes differentiated from induced pluripotent stem cells reprogrammed from
    skin fibroblasts of a three-generation family carrying the autosomal dominant
    sarcomeric TNNT2 R173W mutation, with mutation-negative relatives from the same
    family serving as isogenic-adjacent controls. A non-animal New Approach Methodology
    that puts the patient's own genotype into a dish and supports both disease
    modelling and pharmacological rescue testing.
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  tissue_term:
    preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  cell_types:
  - preferred_term: iPSC-derived cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  conditions:
  - familial dilated cardiomyopathy with the TNNT2 R173W sarcomeric mutation
  - beta-adrenergic agonist stress with norepinephrine
  - beta-blocker and SERCA2a rescue
  cell_source: >-
    Patient-derived: iPSC lines reprogrammed from skin fibroblasts of four TNNT2 R173W
    carriers and three mutation-negative relatives in one family cohort
  culture_system: >-
    Embryoid-body cardiac differentiation followed by dissociated beating clusters and
    single cardiomyocytes, assayed by immunocytochemistry, transmission electron
    microscopy, calcium transient imaging, microelectrode arrays and atomic force
    microscopy
  publication: PMID:22517884
  modeled_mechanisms:
  - target: Sarcomeric and Cytoskeletal Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Cardiomyocytes carrying the patient's TNNT2 R173W allele reproduce the sarcomeric
      disorganisation and contractile failure of this node in human cells, and the
      phenotype is reversed by beta-blockade or SERCA2a overexpression.
    limitations: >-
      The authors themselves qualify the model as recapitulating the disease phenotype
      only to some extent. The cardiomyocytes are developmentally immature, with
      mitochondria and sarcoplasmic reticulum still immature at the assay stage, and the
      sarcomeric defect was most pronounced in single cells and at cluster edges rather
      than in well-coupled tissue. The cohort is a single family and a single TNNT2
      allele, so the finding does not generalise across this node's other sarcomeric and
      cytoskeletal genes, and no chamber-level dilatation can be observed in a dish.
    readouts:
    - name: Punctate sarcomeric alpha-actinin distribution
      target: Sarcomeric and Cytoskeletal Dysfunction
      direction: INCREASED
      interpretation: >-
        A higher proportion of patient cardiomyocytes showed disrupted sarcomeric
        alpha-actinin organisation than mutation-negative family controls, which is the
        structural correlate of this node.
      evidence:
      - reference: PMID:22517884
        reference_title: "Patient-specific induced pluripotent stem cells as a model for familial dilated cardiomyopathy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: a significant higher percentage of DCM iPSC-CMs (n=391) showed a punctate distribution of sarcomeric α-actinin over one fourth of the total cellular area
        explanation: >-
          Quantifies the sarcomeric disorganisation measurement behind this readout
          against within-family controls.
    - name: Contractility of patient cardiomyocytes
      target: Sarcomeric and Cytoskeletal Dysfunction
      direction: DECREASED
      interpretation: >-
        Force production fell in mutation-carrying cardiomyocytes, linking the structural
        sarcomeric defect to functional impairment.
      evidence:
      - reference: PMID:22517884
        reference_title: "Patient-specific induced pluripotent stem cells as a model for familial dilated cardiomyopathy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: cardiomyocytes derived from iPSCs from DCM patients exhibited altered regulation of calcium ion (Ca(2+)), decreased contractility, and abnormal distribution of sarcomeric α-actinin
        explanation: >-
          Reports the contractility and calcium-handling measurements made in this model.
    - name: Function after beta-blockade or SERCA2a overexpression
      target: Sarcomeric and Cytoskeletal Dysfunction
      direction: RESTORED
      interpretation: >-
        The model supports a rescue arm: both a beta-blocker and SERCA2a overexpression
        improved cardiomyocyte function, so the phenotype is pharmacologically reversible
        in vitro rather than a fixed differentiation artefact.
      evidence:
      - reference: PMID:22517884
        reference_title: "Patient-specific induced pluripotent stem cells as a model for familial dilated cardiomyopathy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Treatment with β-adrenergic blockers or overexpression of sarcoplasmic reticulum Ca(2+) adenosine triphosphatase (Serca2a) improved the function of iPSC-derived cardiomyocytes from DCM patients
        explanation: >-
          Reports the rescue measurement, in the improving direction, behind this readout.
    evidence:
    - reference: PMID:22517884
      reference_title: "Patient-specific induced pluripotent stem cells as a model for familial dilated cardiomyopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: iPSC-derived cardiomyocytes from DCM patients recapitulate to some extent the morphological and functional phenotypes of DCM
      explanation: >-
        Supports treating this model as informative for the node, with the authors' own
        partial-recapitulation qualifier carried through to the link relationship.
  - target: Neurohormonal Activation
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      Exposing the cardiomyocytes to a beta-adrenergic agonist applies the catecholamine
      arm of this node directly to the cells and unmasks a genotype-dependent
      vulnerability that is not apparent at baseline.
    limitations: >-
      This is an acute pharmacological stimulus applied to isolated cardiomyocytes. It
      reproduces the receptor-level consequence of sympathetic drive but not neurohormonal
      activation as a disease process: there is no sympathetic nervous system, no
      renin-angiotensin-aldosterone axis, no natriuretic peptide counter-regulation and no
      feedback loop between cardiac output and neurohormonal tone.
    readouts:
    - name: Contractile function under beta-adrenergic agonist stress
      target: Neurohormonal Activation
      direction: DECREASED
      interpretation: >-
        Under adrenergic stimulation patient cardiomyocytes slowed and lost contractile
        function, showing that catecholamine exposure degrades pump function in cells
        already carrying the sarcomeric lesion.
      evidence:
      - reference: PMID:22517884
        reference_title: "Patient-specific induced pluripotent stem cells as a model for familial dilated cardiomyopathy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: When stimulated with a β-adrenergic agonist, DCM iPSC-derived cardiomyocytes showed characteristics of cellular stress such as reduced beating rates, compromised contraction, and a greater number of cells with abnormal sarcomeric α-actinin distribution
        explanation: >-
          Reports the beating-rate and contraction measurements made under the adrenergic
          perturbation behind this readout.
    - name: Sarcomeric disorganisation under beta-adrenergic agonist stress
      target: Neurohormonal Activation
      direction: INCREASED
      interpretation: >-
        The same adrenergic exposure spread sarcomeric disorganisation to more cells, so
        catecholamine stress aggravates the structural lesion and not only the functional
        one.
      evidence:
      - reference: PMID:22517884
        reference_title: "Patient-specific induced pluripotent stem cells as a model for familial dilated cardiomyopathy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: When stimulated with a β-adrenergic agonist, DCM iPSC-derived cardiomyocytes showed characteristics of cellular stress such as reduced beating rates, compromised contraction, and a greater number of cells with abnormal sarcomeric α-actinin distribution
        explanation: >-
          The same sentence reports the rise in cells with abnormal sarcomeric
          α-actinin distribution that this readout records.
    evidence:
    - reference: PMID:22517884
      reference_title: "Patient-specific induced pluripotent stem cells as a model for familial dilated cardiomyopathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: When stimulated with a β-adrenergic agonist, DCM iPSC-derived cardiomyocytes showed characteristics of cellular stress such as reduced beating rates, compromised contraction, and a greater number of cells with abnormal sarcomeric α-actinin distribution
      explanation: >-
        Supports the model as informative for the adrenergic component of this node, while
        the systemic neurohormonal axes remain outside what a dish can represent.
  notes: >-
    Curated from the NAMeRS 2026 symposium New Approach Methodology tracker
    (monarch-initiative/dismech#4873), Panel 1 Clinical Trials in a Dish case study.
    No `namo_type` is recorded. NAMO defines no iPSC-derived model class (checked
    against its 56 classes) and its CellularSystem parent is abstract, so the choice
    was among the concrete culture-format siblings, and none of the three describes
    this system: CellLineModel is scoped to immortalized lines; ThreeDCellCulture fits
    the embryoid-body differentiation stage but not cells assayed after dissociation;
    TwoDCellCulture fits the single cardiomyocytes on atomic force microscopy and
    microelectrode arrays but not the 3D stage that produced them. The system spans two
    formats and NAMO has no value for the derivation that actually distinguishes it, so
    the slot is left absent rather than made to pick a half. `experimental_model_type:
    IPSC_DERIVED_MODEL` carries the distinction instead, and the upstream gap is
    monarch-initiative/namo#24. An earlier revision of this record used a coined
    InducedPluripotentStemCellDerivedModel CURIE (written here without its prefix so
    that prefix censuses over `kb/` do not match this file), which does not exist in
    NAMO; nothing validates `namo_type`, so it passed every gate. The adrenergic-stress
    readouts are split by direction because the source sentence reports both a fall in
    beating rate and contraction and a rise in cells with abnormal sarcomeric
    alpha-actinin, and `direction` is single-valued. The underlying evidence item was
    already cited on the Sarcomeric and Cytoskeletal Dysfunction node; this section adds
    the structured model record, its pathograph links and the rescue and
    adrenergic-stress readouts.
datasets:
- accession: geo:GSE245825
  title: 'Cardiac Fibrosis in Dilated Cardiomyopathy: Transcriptomics Insights, Histological Correlations, and Organoid Model Verifications [RNA-seq I]'
  description: Dilated cardiomyopathy (DCM) represents a leading cause of heart failure among younger adults. Despite endomyocardial biopsy (EMB) transcriptome enriching our understanding of DCM, the link between its gene expression and phenotype remains unclear. RNA-seq analysis of 58 DCM samples and 12 publicly available control samples unveiled about 25,000 transcripts. A principal component analysis highlighted a distinct DCM-control separation. WGCNA revealed four transcriptome modules strongly associated with DCM. The purple module, which is the DCM-related module, was enriched with fibrosis-related genes and showed FSTL3 as a pivotal DCM-associated gene.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 58
  publication: PMID:40934809
  notes: Identified by GEO DataSets index search for Dilated Cardiomyopathy (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE146621
  title: Distinct cardiac transcriptomic clustering in titin and lamin a/c-associated dilated cardiomyopathy patients
  description: RNA profiles strongly differ in TTNtv and LMNA-mutated DCM patients, despite clinical similarities as other pathogenic variant carriers such as RBM20 and MYH7, suggesting a specific genetic effect on the cardiac transcriptome in addition to the effect of the clinical component.

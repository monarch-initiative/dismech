- reference: PMID:42708185
  title: "An Updated Evidence Assessment of the Genetic Causes of Dilated Cardiomyopathy."
  findings:
  - statement: >-
      The 2026 ClinGen Dilated Cardiomyopathy Gene Curation Expert Panel
      reassessment reports JPH2 as autosomal dominant Strong and autosomal
      recessive Limited, the opposite way round from the committed ClinGen
      gene validity snapshot. The discrepancy is recorded in this entry's
      notes and not resolved here.
    evidence:
    - reference: PMID:42708185
      reference_title: "An Updated Evidence Assessment of the Genetic Causes of Dilated Cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Four previously evaluated genes were curated for both AD and AR MOIs:
        JPH2 (AD-Strong, AR-Limited), LDB3 (AD-Limited, AR-Strong), MYBPC3
        (AD-Limited, AR-Limited), and TNNI3 (AD- and AR- Strong).
      explanation: >-
        Carries the published JPH2 mode-of-inheritance classifications that
        disagree with the cached ClinGen assertion rows quoted on the JPH2
        genetic record.
- reference: PMID:18505755
  title: "Beyond the sarcomere: CSRP3 mutations cause hypertrophic cardiomyopathy."
  findings:
  - statement: >-
      CSRP3 is confirmed as a hypertrophic cardiomyopathy gene, and the
      earlier association of CSRP3 missense mutations with dilated
      cardiomyopathy was judged to lack comprehensive genetic evidence for a
      causative role. This is the basis for not adding CSRP3 to this entry's
      gene panel.
    evidence:
    - reference: PMID:18505755
      reference_title: "Beyond the sarcomere: CSRP3 mutations cause hypertrophic cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Previous studies have shown an association between CSRP3 missense
        mutations and either dilated cardiomyopathy (DCM) or HCM, but all
        these studies were unable to provide comprehensive genetic evidence
        for a causative role of CSRP3 mutations.
      explanation: >-
        States that the earlier CSRP3 to dilated cardiomyopathy association
        lacked comprehensive genetic evidence for causation.
    - reference: PMID:18505755
      reference_title: "Beyond the sarcomere: CSRP3 mutations cause hypertrophic cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        We used linkage analysis and identified a CSRP3 missense mutation in a
        large German family affected by HCM. We confirmed CSRP3 as an HCM
        disease gene.
      explanation: >-
        Reports the linkage study that established CSRP3 as a hypertrophic
        cardiomyopathy gene, which is where this knowledge base binds it.
- reference: PMID:8864356
  title: "Cardiotrophin-1: a multifunctional cytokine that signals via LIF receptor-gp 130 dependent pathways."
  findings:
  - statement: >-
      Cardiotrophin-1, the CTF1 product, is an interleukin-6 family cytokine
      acting through the shared gp130 signalling subunit. This is the basis
      for the note explaining why CTF1 is left unwired rather than attached to
      this entry's IL-11 fibroblast node.
    evidence:
    - reference: PMID:8864356
      reference_title: "Cardiotrophin-1: a multifunctional cytokine that signals via LIF receptor-gp 130 dependent pathways."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        CT-1 is a new member of the IL-6 family of cytokines that induce their
        biological effects through the shared signaling subunit, gp 130.
      explanation: >-
        Identifies cardiotrophin-1 as an IL-6 family cytokine signalling
        through gp130.

  notes: Identified by GEO DataSets index search for Dilated Cardiomyopathy (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.
- accession: ega:EGAS00001002454
  title: Natural genetic variation of the cardiac transcriptome in non-diseased donors and patients with dilated cardiomyopathy
  description: 'Background: Genetic variation is an important determinant of RNA transcription and splicing, which in turn contributes to variation in human traits including cardiovascular diseases.Results: Here we report the first in-depth survey of heart transcriptome variation using RNA-sequencing in 149 (97)* patients with dilated cardiomyopathy and 113 (108)* non-diseased controls. We reveal extensive differences of gene expression and splicing between dilated cardiomyopathy patients and controls, affecting known as well as novel dilated cardiomyopathy genes. Moreover, we show a widespread effect of genetic variation on the regulation of transcription, isoform usage and allele specific expression.'
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:28903782
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Dilated Cardiomyopathy"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001003435
  title: Trio exome sequencing identified null mutations in ITPA as the cause of Martsolf syndrome with a lethal dilated cardiomyopathy presenting in infancy
  description: Typical Martsolf syndrome is characterized by congenital cataracts, postnatal microcephaly, developmental delay, hypotonia, short stature and biallelic hypomorphic mutations in either RAB3GAP1 or RAB3GAP2. Genetic analysis of 85 unrelated “mutation negative” probands with Martsolf or Martsolf-like syndromes identified two individuals with different homozygous null mutations in ITPA, the gene encoding inosine triphosphate pyrophosphatase (ITPase). Both probands were from multiplex families with a consistent, lethal and highly distinctive disorder; a Martsolf-like syndrome with infantile-onset dilated cardiomyopathy.
  organism:

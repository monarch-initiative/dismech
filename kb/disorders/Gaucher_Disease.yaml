        Experimental evidence supports a C5aR1-dependent substrate-synthesis amplification mechanism.
    intermediate_mechanisms:
    - synthesis exceeds residual lysosomal clearance
    hypothesis_groups:
    - complement_amplification
- name: Lysolipid-Reactive B-Cell Stimulation
  description: >-
    Lysolipid-reactive clonal immunoglobulin and substrate-responsive murine gammopathy support antigen-driven B-cell/plasma-cell stimulation. Additional changes required for malignant transformation remain unresolved.
  evidence:
  - reference: PMID:26863356
    reference_title: Clonal Immunoglobulin against Lysolipids in the Origin of Myeloma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Substrate reduction ameliorates Gaucher's disease-associated gammopathy in mice.
    explanation: >-
      Experimental reduction of substrate supports a lipid-dependent contribution to gammopathy; it does not establish prevention of human myeloma.
  downstream:

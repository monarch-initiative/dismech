name: Gaucher Disease
creation_date: '2026-01-07T17:31:51Z'
description: >-
  Gaucher disease is an autosomal recessive lysosomal storage disorder caused by biallelic pathogenic variants in GBA1 that result in deficient glucocerebrosidase (acid beta-glucosidase) activity. Impaired catabolism of glucocerebroside leads to its accumulation within tissue macrophages, which become lipid-laden Gaucher cells that infiltrate the spleen, liver, and bone marrow. Clinical features include hepatosplenomegaly, thrombocytopenia, anemia, and skeletal disease, with neuronopathic forms (types 2 and 3) adding progressive central nervous system involvement; GBA1 pathogenic variants are also major genetic risk factors for Parkinsonism.
category: Genetic
parents:
- Lysosomal Storage Disorder
- Sphingolipidosis
classifications:
  lysosomal_storage_category:
    classification_value: sphingolipidosis
    notes: >-
      Gaucher disease is a sphingolipidosis — lysosomal accumulation of the
      sphingolipid glucosylceramide (glucocerebroside). Complements the ICIMD
      complex-molecule-degradation axis below.
  icimd_category:
  - classification_value: sphingolipid_degradation
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Sphingolipid
      degradation" under category "Disorders of complex molecule degradation"
      (the classical lysosomal disorders). Gaucher is glucocerebrosidase
      deficiency with glucosylceramide accumulation.

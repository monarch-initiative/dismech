has_subtypes:
- name: Type 1
  display_name: Type 1 (Non-neuronopathic)
  subtype_term:
    preferred_term: Gaucher disease type I
    term:
      id: MONDO:0009265
      label: Gaucher disease type I
  description: >-
    Non-neuronopathic form, comprising about 90% of diagnosed cases in Europe and the USA but a smaller fraction in some other regions. Visceral, hematologic, and skeletal severity varies greatly; absence of primary childhood CNS disease does not exclude later Parkinson disease risk.
  evidence:
  - reference: PMID:28218669
    reference_title: "A Review of Gaucher Disease Pathophysiology, Clinical Presentation and Treatments."
    supports: SUPPORT
    snippet: "Type-1 Gaucher disease, which affects the majority of patients (90% in Europe and USA, but less in other regions), is characterized by effects on the viscera"
    explanation: Review confirms Type 1 is the most common form with visceral manifestations.
- name: Type 2
  display_name: Type 2 (Acute neuronopathic)
  subtype_term:
    preferred_term: Gaucher disease type II
    term:
      id: MONDO:0009266
      label: Gaucher disease type II
  description: >-
    Acute neuronopathic form with primary CNS disease beginning before age two years, limited psychomotor development, and rapid progression. Death commonly occurs by age two to four years; systemic ERT does not correct the CNS disease.
  evidence:
  - reference: PMID:20301446
    reference_title: Gaucher Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Type 2 GD is characterized by primary central nervous system disease with onset before age two years, limited psychomotor development, and a rapidly progressive course with death by age two to four years.
    explanation: >-
      GeneReviews defines the broader onset and survival range; onset before six months and death by two years are not universal.
- name: Type 3
  display_name: Type 3 (Chronic neuronopathic)
  subtype_term:
    preferred_term: Gaucher disease type III
    term:
      id: MONDO:0009267
      label: Gaucher disease type III
  description: >
    Chronic neuronopathic form with both systemic and neurological involvement.
    Onset in childhood with slower neurological progression than Type 2.
    Hallmark feature is horizontal supranuclear gaze palsy. May also
    develop myoclonic epilepsy and cognitive decline. Survival into adulthood.
  evidence:
  - reference: PMID:28218669
    reference_title: "A Review of Gaucher Disease Pathophysiology, Clinical Presentation and Treatments."
    supports: SUPPORT
    snippet: "types 2 and 3 are also associated with neurological impairment, either severe in type 2 or variable in type 3"
    explanation: Review confirms Type 3 has variable neurological involvement distinct from severe Type 2.
- name: Perinatal lethal
  description: >-
    Perinatal presentation with skin-barrier disease and/or nonimmune hydrops fetalis.
  evidence:
  - reference: PMID:20301446
    reference_title: Gaucher Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The perinatal-lethal form is associated with ichthyosiform or collodion skin abnormalities or with nonimmune hydrops fetalis.
    explanation: >-
      GeneReviews recognizes this clinical form in addition to types 1–3.
  subtype_term:
    preferred_term: Gaucher disease perinatal lethal
    term:
      id: MONDO:0011945
      label: Gaucher disease perinatal lethal
- name: Cardiovascular
  description: >-
    Cardiovascular form, often associated with p.Asp448His (legacy D409H), featuring valvular calcification, corneal opacity, and supranuclear ophthalmoplegia.
  evidence:
  - reference: PMID:20301446
    reference_title: Gaucher Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The cardiovascular form is characterized by calcification of the aortic and mitral valves, mild splenomegaly, corneal opacities, and supranuclear ophthalmoplegia.
    explanation: >-
      GeneReviews recognizes this clinical form in addition to types 1–3.
  subtype_term:
    preferred_term: Gaucher disease-ophthalmoplegia-cardiovascular calcification syndrome
    term:
      id: MONDO:0009268
      label: Gaucher disease-ophthalmoplegia-cardiovascular calcification syndrome
mechanistic_hypotheses:
- hypothesis_group_id: canonical_gba1_glucocerebroside_lysosomal_storage_model
  hypothesis_label: Canonical GBA1 Glucocerebroside Lysosomal Storage Model
  status: CANONICAL
  description: >-
    Biallelic GBA1 pathogenic variants reduce lysosomal glucocerebrosidase activity and impair glucosylceramide and glucosylsphingosine degradation. Macrophage lipid storage, inflammatory amplification, and altered skeletal remodeling contribute to visceral, hematologic, and skeletal disease. Neuronopathic forms additionally involve neuronal and glial lipid homeostasis and injury; their CNS biology is not explained by macrophage infiltration alone. ERT and substrate reduction strongly support the systemic storage pathway, while individual toxic intermediates and CNS mechanisms require separate evidence.
  notes: >-
    The OpenScientist report is assessed in assessments/openscientist-assessment-by-codex.yaml beside the report. Retain CANONICAL for the GBA1 enzyme/substrate axis. Glucosylsphingosine, complement signaling, bone-cell interactions, and lipid-reactive gammopathy refine that axis. Biomarker association does not prove that glucosylsphingosine is the dominant toxin, and therapy response does not identify every intervening mechanism. GBA1-associated Parkinson disease is a risk branch distinct from acute/chronic neuronopathic Gaucher disease. ER stress predominance and comparative CNS treatment efficacy remain unresolved.
  evidence:
  - reference: PMID:10464619
    reference_title: "Gaucher disease: gene frequencies and genotype/phenotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the presence of a single N370S allele is diagnostic of the type 1 or nonneuronopathic"
    explanation: >
      Canonical mechanism review used as the seed reference for the
      hypothesis-search deep-research run.
  - reference: PMID:36739645
    reference_title: Plasma glucosylsphingosine correlations with baseline disease burden and response to eliglustat in two clinical trials of previously untreated adults with Gaucher disease type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Organ volumes and hematologic parameters improved in parallel with reductions in plasma glucosylsphingosine during eliglustat treatment in both trials.
    explanation: >-
      Treatment-linked substrate and clinical responses support the canonical pathway without proving mediator-specific causation.
    directness: INDIRECT
- hypothesis_group_id: complement_amplification
  hypothesis_label: Complement amplification of lipid storage
  status: EMERGING
  description: >-
    A C5a/C5aR1-dependent inflammatory and substrate-synthesis feedback circuit extends the canonical storage mechanism. Intervention support comes from experimental systems, and therapeutic benefit in Gaucher patients remains unestablished.
  evidence:
  - reference: PMID:28225753
    reference_title: Complement drives glucosylceramide accumulation and tissue inflammation in Gaucher disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Marked local and systemic complement activation occurred in GCase-deficient mice or after pharmacological inhibition of GCase and was associated with GC storage, tissue inflammation and proinflammatory cytokine production.
    explanation: >-
      Both genetic and pharmacological mouse systems support complement activation; this does not demonstrate clinical efficacy of complement inhibition.
- hypothesis_group_id: stored_lipid_immune_activation
  hypothesis_label: Innate immune activation by stored glucosylceramide
  status: EMERGING
  description: >-
    Stored or released glucosylceramide can activate Mincle-dependent myeloid inflammation. Experimental receptor and ligand results support a mechanism beyond passive storage, without establishing human clinical effect sizes.
  evidence:
  - reference: PMID:28373578
    reference_title: Intracellular metabolite β-glucosylceramide is an endogenous Mincle ligand possessing immunostimulatory activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Synthetic β-GlcCer activated myeloid cells and induced production of inflammatory cytokines; this production was abrogated in Mincle-deficient cells.
    explanation: >-
      Ligand and receptor-loss assays support Mincle-dependent cytokine induction; human Gaucher contribution is not established.
pathophysiology:
- name: GBA1 Mutation
  description: >
    Biallelic GBA1 pathogenic variants reduce lysosomal glucocerebrosidase
    activity through catalytic loss, protein misfolding, or impaired delivery
    to the lysosome. Genotype severity helps shape the clinical path: at least
    one N370S allele is associated with non-neuronopathic disease, while L444P
    homozygosity is strongly associated with neuronopathic disease.
  genes:
  - preferred_term: GBA1
    term:
      id: hgnc:4177
      label: GBA
  downstream:
  - target: Glucocerebrosidase Deficiency
    description: GBA1 mutations reduce or abolish glucocerebrosidase enzyme activity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28218669
      reference_title: "A Review of Gaucher Disease Pathophysiology, Clinical Presentation and Treatments."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutations in the GBA1 gene lead to a marked decrease in GCase activity."
      explanation: This review directly links pathogenic GBA1 mutations to reduced glucocerebrosidase activity.
  evidence:
  - reference: PMID:10464619
    reference_title: "Gaucher disease: gene frequencies and genotype/phenotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the presence of a single N370S allele is diagnostic of the type 1 or nonneuronopathic variant, whereas the L444P/L444P genotype is highly associated with neuronopathic variants in the Caucasian population."
    explanation: This genotype-phenotype review supports the mutation severity branch used in the pathograph.
- name: Glucocerebrosidase Deficiency
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency"
  description: >
    Deficient beta-glucocerebrosidase (glucosylceramidase) enzyme activity
    resulting from GBA1 mutations.
  genes:
  - preferred_term: GBA1
    term:
      id: hgnc:4177
      label: GBA
  molecular_functions:
  - preferred_term: glucocerebrosidase activity
    term:
      id: GO:0004348
      label: glucosylceramidase activity
    modifier: DECREASED
  downstream:
  - target: Impaired Sphingolipid Catabolism
    description: Loss of glucocerebrosidase activity impairs lysosomal degradation of glucosylceramide.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28218669
      reference_title: "A Review of Gaucher Disease Pathophysiology, Clinical Presentation and Treatments."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This leads to a markedly decreased activity of the lysosomal enzyme, glucocerebrosidase (GCase, also called glucosylceramidase or acid β-glucosidase, EC: 4.2.1.25), which hydrolyzes glucosylceramide (GlcCer) into ceramide and glucose"
      explanation: The review describes the normal GCase reaction and therefore supports impaired glucosylceramide catabolism when the enzyme is deficient.
  - target: Neuronal Glycosphingolipid Accumulation
    description: Very low residual GCase activity in severe genotypes permits neuronal glycosphingolipid storage.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - low residual GCase activity in neuronopathic genotypes
    - neuronal glucosylceramide and glucosylsphingosine accumulation
    evidence:
    - reference: PMID:28218669
      reference_title: "A Review of Gaucher Disease Pathophysiology, Clinical Presentation and Treatments."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "GlcCer turnover in neurons is low and its accumulation is only significant when residual GCase activity is drastically decreased, i.e., only with some types of GBA1 mutations"
      explanation: This supports the severe-genotype branch from GCase deficiency to neuronal lipid accumulation.
  - target: GBA1-Associated Alpha-Synuclein Proteostasis
    description: >-
      Reduced GCase activity impairs lysosomal protein degradation and increases alpha-synuclein in experimental neuronal systems; this supports a possible Parkinson-risk mechanism rather than universal neuronopathic Gaucher pathology.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - reduced lysosomal GCase activity
    - impaired autophagic turnover of alpha-synuclein
    evidence:
    - reference: PMID:21700325
      reference_title: Gaucher disease glucocerebrosidase and α-synuclein form a bidirectional pathogenic loop in synucleinopathies.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: functional loss of GD-linked glucocerebrosidase (GCase) in primary cultures or human iPS neurons compromises lysosomal protein degradation, causes accumulation of α-synuclein (α-syn), and results in neurotoxicity through aggregation-dependent mechanisms.
      explanation: >-
        Primary neuronal cultures and human iPS neurons support this mechanistic branch; clinical penetrance remains incomplete.
  - target: Stromal Inflammatory Secretome
    description: >-
      GCase-deficient stromal cells show lipid accumulation and altered mediator secretion in vitro.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:19587377
      reference_title: Characterization of Gaucher disease bone marrow mesenchymal stromal cells reveals an altered inflammatory secretome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In conclusion, Gaucher disease MSCs display an altered secretome that could contribute to skeletal disease and immune disease manifestations in a manner distinct and additive to Gaucher macrophages themselves.
      explanation: >-
        The source identifies a distinct stromal inflammatory contribution, with uncertainty about clinical magnitude.
    intermediate_mechanisms:
    - stromal glucosylceramide accumulation
  evidence:
  - reference: PMID:28218669
    reference_title: "A Review of Gaucher Disease Pathophysiology, Clinical Presentation and Treatments."
    supports: SUPPORT
    snippet: "It is caused by a deficiency of the lysosomal enzyme, glucocerebrosidase, which leads to an accumulation of its substrate, glucosylceramide, in macrophages."
    explanation: Review confirms glucocerebrosidase deficiency causes glucosylceramide accumulation in macrophages.

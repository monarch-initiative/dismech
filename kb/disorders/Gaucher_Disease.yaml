  - target: Gaucher Skeletal Remodeling and Bone Infarction
    description: Inflammatory mediators stimulate bone resorption and contribute to skeletal disease.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - osteoclast stimulation
    - osteoblast inhibition
    evidence:
    - reference: PMID:28218669
      reference_title: "A Review of Gaucher Disease Pathophysiology, Clinical Presentation and Treatments."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Osteoporosis may be linked to IL-10, which inhibits osteoblast activity, but also to IL-1β, IL-6 and M-CSF, MIP-1α and MIP-1β, which stimulate bone resorption by increasing osteoclast activity"
      explanation: This supports inflammatory mediator effects as part of the skeletal disease branch.
    - reference: PMID:24076352
      reference_title: "Uncoupling of osteoblast-osteoclast regulation in a chemical murine model of Gaucher disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Addition of both conditioned media (CM) from S-CBE and PM-CBE induced the differentiation of osteoclasts precursors from bone marrow to mature and functional osteoclasts."
      explanation: >
        Cell-free conditioned medium from GCase-inhibited macrophages is
        sufficient to drive osteoclast maturation, substantiating the osteoclast
        stimulation intermediate recorded on this edge. The model is chemical
        GCase inhibition of cells from normal mice, not a genetic Gaucher model.
    - reference: PMID:24076352
      reference_title: "Uncoupling of osteoblast-osteoclast regulation in a chemical murine model of Gaucher disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "addition of CM to an osteoblast cell culture resulted in a reduction in expression of alkaline phosphatase and mineralization process"
      explanation: >
        The same secretome suppresses osteoblast differentiation markers and
        mineralization, substantiating the osteoblast inhibition intermediate
        and showing the two arms of remodeling are uncoupled rather than a
        single resorptive shift.

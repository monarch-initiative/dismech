- name: Bone Infarction
  description: >-
    Focal bone ischemia and infarction underlie osteonecrotic complications. The relative roles of marrow infiltration, vascular compromise, and inflammatory/lipid factors remain incompletely established.
  evidence:
  - reference: PMID:20301446
    reference_title: Gaucher Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Type 1 GD is characterized by the presence of clinical or radiographic evidence of bone disease (osteopenia, focal lytic or sclerotic lesions, and osteonecrosis), hepatosplenomegaly, anemia, thrombocytopenia, lung disease, and the absence of primary central nervous system disease.
    explanation: >-
      GeneReviews supplies the Type 1 clinical baseline.
  downstream:
  - target: Osteonecrosis
    description: >-
      Infarcted bone may become necrotic.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

      explanation: >-
        GeneReviews supplies the Type 1 clinical baseline.
  - target: Bone Pain
    description: >-
      Bone infarction can produce severe bone crises.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:2013590
      reference_title: Bone scans in the diagnosis of bone crisis in patients who have Gaucher disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Of thirty-four occurrences of bone pain in seventeen children and young adults who had type-I Gaucher disease, twenty-five were finally diagnosed as bone crises.
      explanation: >-
        Primary series anchors painful bone crises; associated reduced radionuclide uptake supports an ischemic component without proving one vascular mechanism.
    - reference: PMID:2013590
      reference_title: Bone scans in the diagnosis of bone crisis in patients who have Gaucher disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: At the onset of a crisis, the bone scan typically showed decreased uptake of radionuclide at the involved site.
      explanation: >-

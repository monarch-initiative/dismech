  - target: Complement C5a-C5aR1 Amplification Loop
    description: Stored glucosylceramide elicits complement-activating glucosylceramide-specific IgG autoantibodies, generating C5a.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28225753
      reference_title: "Complement drives glucosylceramide accumulation and tissue inflammation in Gaucher disease."

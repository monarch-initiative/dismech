- accession: massive:MSV000080786
  title: Identification of a biomarker in cerebrospinal fluid for neuronopathic forms of Gaucher disease
  description: Gaucher disease, a recessive inherited metabolic disorder caused by defects in the gene encoding glucosylceramidase (GlcCerase), can be divided into three subtypes according to the appearance of symptoms associated with central nervous system involvement. We now identify a protein, glycoprotein non-metastatic B (GPNMB), that acts as an authentic marker of brain pathology in neurological forms of Gaucher disease.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Gaucher Disease"). Retrieved 2026-08-02.
- accession: massive:MSV000092415
  title: Proteomics analysis of the brain from a Gaucher disease mouse identifies pathological pathways including a possible role for transglutaminase 1
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  data_type: PROTEOMICS
  description: Gaucher disease (GD) is caused by the defective activity of acid beta-glucosidase (GCase) which results from mutations in GBA1. Neurological forms of GD (nGD) can be generated in mice by intra-peritoneal injection of conduritol B-epoxide (CBE) which irreversibly inhibits GCase. Using this approach, a number of pathological pathways have been identified in mouse brain by RNAseq analysis. However, unlike transcriptomics, proteomics gives information about protein expression which is more likely to provide insight into which cellular pathways may be impacted in disease.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Gaucher Disease"). Retrieved 2026-08-02.
diagnosis:
- name: Glucocerebrosidase activity and GBA1 testing
  description: >-
    Confirm deficient GCase activity in leukocytes or other nucleated cells and/or biallelic pathogenic GBA1 variants. Dried-blood-spot screening requires appropriate confirmatory evaluation; GBA1 testing must account for its homologous pseudogene and recombinant alleles.
  evidence:
  - reference: PMID:20301446
    reference_title: Gaucher Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The diagnosis of GD relies on demonstration of deficient glucocerebrosidase (glucosylceramidase) enzyme activity in peripheral blood leukocytes or other nucleated cells, or by the identification of biallelic pathogenic variants in GBA1 on molecular genetic testing.
    explanation: >-
      Authoritative diagnostic confirmation strategy.
discussions:
- kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Glucosylsphingosine Accumulation
  - phenotypes#Multiple Myeloma
  - phenotypes#Lung Disease
  - has_subtypes#Perinatal lethal
  - has_subtypes#Cardiovascular
  prompt: Which lipid-dependent and secondary processes determine neuronal, vascular, skin, and malignant complications?
  rationale: >-
    The canonical substrate defect is established, but circulating GlcSph associations do not prove dominant tissue toxicity. Gammopathy and cancer associations do not establish the entire malignant-transformation chain. Perinatal skin/hydrops, valvular calcification, and pulmonary vascular versus infiltrative disease are represented clinically without unsupported mechanistic arrows. Prospective substrate-guided skeletal studies, lipid/ER-stress measurements in cell-resolved models, and longitudinal B-cell clonality studies would discriminate candidate explanations.
  evidence:
  - reference: PMID:37249220
    reference_title: 'Osteonecrosis in Gaucher disease in the era of multiple therapies: Biomarker set for risk stratification from a tertiary referral center.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There was a significant correlation between GlcSph levels and AVN.
    explanation: >-
      Correlation motivates mechanistic and prospective testing, rather than proving direct mediation.
  - reference: PMID:36054609
    reference_title: Cancer risk and gammopathies in 2123 adults with Gaucher disease type 1 in the International Gaucher Group Gaucher Registry.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The 10-year cumulative incidence of MM after diagnosis of MGUS was 7.9%, comparable to the general population.
    explanation: >-
      Increased gammopathy prevalence is distinguishable from an increased MGUS-to-myeloma progression rate.
  discussion_id: unresolved_tissue_injury
- discussion_id: selected_alps_like_immune_phenotype
  kind: KNOWLEDGE_GAP
  prompt: How does lipid storage relate to the ALPS-like lymphocyte/apoptosis phenotype in a subset of patients?
  attaches_to:
  - pathophysiology#Lysolipid-Reactive B-Cell Stimulation
  - pathophysiology#Macrophage Inflammatory Mediator Release
  rationale: >-
    In a 41-patient cohort, 10 had ALPS-like immune features and seven of those ten showed defective FAS-induced apoptosis. This selected subgroup supports an additional immune phenotype but does not establish universal FAS dysfunction or the missing lipid-to-apoptosis mechanism.
  evidence:
  - reference: PMID:32702516
    reference_title: Defective FAS-Mediated Apoptosis and Immune Dysregulation in Gaucher Disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: FAS-induced apoptosis and caspase activation were further evaluated in these 10 patients and were found to be defective in 7 of them.
    explanation: >-
      The measured apoptosis defect is conditional on the selected ALPS-like subgroup.

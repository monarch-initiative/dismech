    explanation: Review confirms growth retardation in 30% of Type 2 patients, sometimes with cachexia.
- name: Parkinsonism
  category: Neurologic
  subtype: Type 1
  notes: >
    GBA1 mutations increase Parkinson disease risk in Type 1 Gaucher disease
    patients and carriers, although penetrance is incomplete.
  phenotype_term:
    preferred_term: Parkinsonism
    term:
      id: HP:0001300
      label: Parkinsonism
  evidence:
  - reference: PMID:30315684
    reference_title: "Neurological effects of glucocerebrosidase gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations of the GBA allele are the most significant genetic risk factor for idiopathic PD, found in 5%-20% of idiopathic PD cases depending on ethnicity."
    explanation: This review supports GBA1 mutation-associated Parkinson disease risk.
  - reference: PMID:28218669
    reference_title: "A Review of Gaucher Disease Pathophysiology, Clinical Presentation and Treatments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with type-1 GD-but also carriers of GBA1 mutation-have been found to be predisposed to developing Parkinson's disease"
    explanation: This Gaucher disease review specifically links Type 1 Gaucher disease and GBA1 carrier status to Parkinson disease predisposition.
- name: Monoclonal Gammopathy
  category: Hematologic
  subtype: Type 1
  frequency: OCCASIONAL
  notes: >
    Gammopathy was reported in 11% of type 1 patients with gammopathy data in
    the ICGG Registry, half of them monoclonal gammopathy of undetermined
    significance. It is also one of the seven major presenting signs of type 1
    disease in the GED-C consensus already cited under skeletal management.
    Progression from monoclonal gammopathy of undetermined significance to
    multiple myeloma runs at about the general-population rate, so the excess
    myeloma risk appears to arise from a higher and earlier gammopathy
    incidence rather than from faster progression once it is present.
  phenotype_term:
    preferred_term: Monoclonal gammopathy
    term:
      id: HP:0031047
      label: Paraproteinemia
  evidence:
  - reference: PMID:36054609
    reference_title: "Cancer risk and gammopathies in 2123 adults with Gaucher disease type 1 in the International Gaucher Group Gaucher Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 2080 patients with gammopathy data (yes/no response), 223 (11%) reported gammopathy."
    explanation: Registry frequency of gammopathy among adults with type 1 Gaucher disease.
  - reference: PMID:36054609
    reference_title: "Cancer risk and gammopathies in 2123 adults with Gaucher disease type 1 in the International Gaucher Group Gaucher Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Age-specific incidence rates of MGUS were unexpectedly high among younger patients. The 10-year cumulative incidence of MM after diagnosis of MGUS was 7.9%, comparable to the general population."
    explanation: >
      Separates the two components of the myeloma excess: gammopathy arises
      unusually early, while its rate of progression to myeloma does not differ
      from the general population.
biochemical:
- name: Beta-glucocerebrosidase Activity
  presence: Decreased
  context: Enzyme activity in leukocytes typically less than 15% of normal
  evidence:
  - reference: PMID:28218669
    reference_title: "A Review of Gaucher Disease Pathophysiology, Clinical Presentation and Treatments."
    supports: SUPPORT
    snippet: "A diagnosis of GD can be confirmed by demonstrating the deficiency of acid glucocerebrosidase activity in leukocytes."
    explanation: Review confirms diagnosis via enzyme activity measurement in leukocytes.
- name: Chitotriosidase
  presence: Elevated
  context: Biomarker elevated in untreated Gaucher disease; reflects macrophage burden
  evidence:
  - reference: PMID:28218669
    reference_title: "A Review of Gaucher Disease Pathophysiology, Clinical Presentation and Treatments."
    supports: SUPPORT
    snippet: "This is the case for chitotriosidase and CCL18, which thus constitute quite specific disease biomarkers"
    explanation: Review confirms chitotriosidase as a specific biomarker expressed by Gaucher cells.
  - reference: PMID:25755533
    reference_title: "Gaucher disease."
    supports: SUPPORT
    snippet: "Monitoring of patients on ERT involves evaluation of growth, blood counts, liver and spleen size and biomarkers such as chitotriosidase which reflect the disease burden."
    explanation: Review confirms chitotriosidase is used for monitoring disease burden during ERT.
- name: Glucosylsphingosine (Lyso-Gb1)
  presence: Elevated
  context: Sensitive biomarker for diagnosis and monitoring; superior to chitotriosidase
  evidence:
  - reference: PMID:28218669
    reference_title: "A Review of Gaucher Disease Pathophysiology, Clinical Presentation and Treatments."
    supports: SUPPORT
    snippet: "Glucosylsphingosine is a novel biomarker whose sensitivity and specificity are superior to those of chitotriosidase and CCL18"
    explanation: Review confirms glucosylsphingosine as superior biomarker to chitotriosidase for GD monitoring.
  - reference: PMID:39499245
    reference_title: "Biomarker testing for lysosomal diseases: A technical standard of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "glucosylsphingosine (lyso-Gb1), galactosylsphingosine (psychosine), and glucose tetrasaccharide (Glca1-6Glca1-4Glca1-4Glc, Glc4) are biomarkers associated with Fabry, Gaucher, Krabbe, and Pompe disease, respectively"
    explanation: ACMG technical standard establishes glucosylsphingosine (lyso-Gb1) as the disease-specific biomarker for Gaucher disease.
  - reference: PMID:36544230
    reference_title: "Patient centered guidelines for the laboratory diagnosis of Gaucher disease type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "chitotriosidase activity, PARC/CCL18 or GlcSph concentrations can be used as a first line test"
    explanation: IWGGD laboratory-diagnosis guideline recommends GlcSph (lyso-Gb1) among first-line biomarker tests when Gaucher disease is suspected.

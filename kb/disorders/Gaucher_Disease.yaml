- name: Stromal Inflammatory Secretome
  description: >-
    Bone marrow stromal cells from one patient showed an altered inflammatory secretome despite preserved osteogenic differentiation. Its contribution to human skeletal disease remains a model-supported possibility.
  evidence:
  - reference: PMID:19587377
    reference_title: Characterization of Gaucher disease bone marrow mesenchymal stromal cells reveals an altered inflammatory secretome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In conclusion, Gaucher disease MSCs display an altered secretome that could contribute to skeletal disease and immune disease manifestations in a manner distinct and additive to Gaucher macrophages themselves.
    explanation: >-
      The source identifies a distinct stromal inflammatory contribution, with uncertainty about clinical magnitude.
  biological_scale: CELLULAR
  downstream:
  - target: Bone Remodeling Imbalance
    description: >-
      Stromal inflammatory mediators may influence local bone-cell homeostasis.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

    description: Chronic macrophage activation and sustained B-cell stimulation are the proposed route to the excess gammopathy and plasma-cell malignancy of type 1 disease.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:

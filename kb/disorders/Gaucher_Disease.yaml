treatments:
- name: Enzyme Replacement Therapy
  description: >-
    Imiglucerase, velaglucerase alfa, or taliglucerase alfa restore enzyme activity in systemic tissues. ERT improves hematovisceral manifestations in GD1 and GD3, with variable skeletal response, but does not adequately cross the blood-brain barrier or correct neuronopathic disease.
  treatment_term:
    preferred_term: enzyme replacement therapy
    term:
      id: NCIT:C16221
      label: Protein Replacement Therapy
    therapeutic_agent:
    - preferred_term: imiglucerase
    - preferred_term: velaglucerase alfa
    - preferred_term: taliglucerase alfa
  target_mechanisms:
  - target: Glucocerebrosidase Deficiency
    treatment_effect: RESTORES
    description: Recombinant enzyme replacement restores systemic glucocerebrosidase activity upstream of macrophage storage.
    evidence:
    - reference: PMID:19047232
      reference_title: "Eight-year clinical outcomes of long-term enzyme replacement therapy for 884 children with Gaucher disease type 1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Within 8 years of enzyme replacement therapy, most clinical parameters studied became normal or nearly normal."
      explanation: Clinical response to enzyme replacement supports correction of the upstream systemic enzyme-deficiency pathway.
  evidence:
  - reference: PMID:19047232
    reference_title: "Eight-year clinical outcomes of long-term enzyme replacement therapy for 884 children with Gaucher disease type 1."
    supports: SUPPORT
    snippet: "Within 8 years of enzyme replacement therapy, most clinical parameters studied became normal or nearly normal."
    explanation: Long-term study demonstrates effectiveness of enzyme replacement therapy in children with Gaucher disease.
  - reference: PMID:25755533
    reference_title: "Gaucher disease."
    supports: SUPPORT
    snippet: "ERT is of no benefit in type 2 disease."
    explanation: Review confirms ERT does not help neurological disease in Type 2 due to BBB.
  - reference: PMID:41821052
    reference_title: 'The global impact of imiglucerase therapy in children with Gaucher disease types 1 and 3: a real-world analysis from the International Collaborative Gaucher Group Gaucher Registry.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Despite complex disease burden in GD3, imiglucerase therapy led to marked hematovisceral disease reversal and meaningful growth improvements, closely paralleling responses in GD1.
    explanation: >-
      Large pediatric registry distinguishes systemic efficacy in GD3 from absent proof of CNS rescue.
  therapeutic_modality: PROTEIN_REPLACEMENT
- name: Substrate Reduction Therapy
  description: >-
    Eliglustat and miglustat reduce glucosylceramide synthesis in selected patients with GD1. Eliglustat selection depends on CYP2D6 metabolism, interactions, and clinical suitability. Miglustat can cross the BBB but has not established neurological efficacy in neuronopathic Gaucher disease.
  treatment_term:
    preferred_term: substrate reduction therapy
    term:
      id: NCIT:C85876
      label: Substrate Deprivation Therapy
    therapeutic_agent:
    - preferred_term: eliglustat
    - preferred_term: miglustat
  target_mechanisms:
  - target: Glucocerebroside Accumulation in Macrophages
    treatment_effect: INHIBITS
    description: Glucosylceramide synthase inhibition reduces substrate supply upstream of macrophage storage.
    evidence:
    - reference: PMID:25688781
      reference_title: "Effect of oral eliglustat on splenomegaly in patients with Gaucher disease type 1: the ENGAGE randomized clinical trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "treatment with eliglustat compared with placebo for 9 months resulted in significant improvements in spleen volume, hemoglobin level, liver volume, and platelet count."
      explanation: Clinical response to eliglustat supports substrate reduction acting upstream of visceral and hematologic manifestations.
  evidence:
  - reference: PMID:25688781
    reference_title: "Effect of oral eliglustat on splenomegaly in patients with Gaucher disease type 1: the ENGAGE randomized clinical trial."
    supports: SUPPORT
    snippet: "treatment with eliglustat compared with placebo for 9 months resulted in significant improvements in spleen volume, hemoglobin level, liver volume, and platelet count."
    explanation: Phase 3 ENGAGE trial demonstrates eliglustat substrate reduction therapy effectively improves clinical manifestations in Gaucher disease.
  - reference: PMID:19067373
    reference_title: Randomized, controlled trial of miglustat in Gaucher's disease type 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No significant between-group differences in vertical saccadic eye movement velocity or in the other neurological or neuropsychological evaluations were observed.
    explanation: >-
      Randomized GD3 comparison found no established neurological benefit from adjunctive miglustat.
  therapeutic_modality: SMALL_MOLECULE
- name: Supportive Care
  description: Pain management, orthopedic interventions, transfusions as needed.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301446
    reference_title: Gaucher Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: orthopedic management of bone disease; analgesics for bone pain; joint replacement surgery for relief from chronic pain and restoration of function;
    explanation: >-
      GeneReviews supports symptomatic orthopedic and pain care.
- name: Orthopedic Management of Skeletal Disease
  description: >
    Management of Gaucher-related bone disease, including avascular necrosis
    (osteonecrosis) of the femoral and humeral heads. Early diagnosis enables
    joint-preserving surgical intervention, while advanced osteonecrosis with
    articular collapse may require total joint arthroplasty.
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  evidence:
  - reference: PMID:36436966
    reference_title: "ACR Appropriateness Criteria® Osteonecrosis: 2022 Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Risk factors for osteonecrosis are numerous and include trauma, corticosteroid therapy, alcohol use, HIV, lymphoma/leukemia, blood dyscrasias, chemotherapy, radiation therapy, Gaucher disease, and Caisson disease"
    explanation: ACR guideline identifies Gaucher disease as an established risk factor for osteonecrosis warranting imaging-guided orthopedic management.
  - reference: PMID:36436966
    reference_title: "ACR Appropriateness Criteria® Osteonecrosis: 2022 Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "to allow for possible early surgical prevention to prevent articular collapse and need for joint replacements"
    explanation: ACR guideline supports early surgical intervention in osteonecrosis to prevent articular collapse and the need for joint replacement.
  - reference: PMID:30414226
    reference_title: "Presenting signs and patient co-variables in Gaucher disease: outcome of the Gaucher Earlier Diagnosis Consensus (GED-C) Delphi initiative."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For type 1 disease, seven major signs (splenomegaly, thrombocytopenia, bone-related manifestations, anaemia, hyperferritinaemia, hepatomegaly and gammopathy)"
    explanation: GED-C consensus identifies bone-related manifestations as a major presenting sign of type 1 Gaucher disease, underpinning the need for skeletal disease management.
- name: Genetic Counseling
  description: Family screening, prenatal diagnosis available.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301446
    reference_title: Gaucher Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Once the GBA1 pathogenic variants have been identified in an affected family member, molecular genetic carrier testing for at-risk family members, preimplantation genetic testing, and prenatal testing for GD are possible.
    explanation: >-
      GeneReviews supports familial and reproductive testing.
- name: Lentiviral Gene Therapy
  description: >
    Autologous transplant of CD34+ hematopoietic stem cells transduced with
    lentiviral vector carrying functional GBA1 gene. Restores glucocerebrosidase
    production from transduced cells. First-in-human case demonstrates sustained
    therapeutic response with maintained enzyme levels, reduced biomarkers
    (lyso-GB1), and organ volume improvement at 5-year follow-up without need
    for additional enzyme replacement or substrate reduction therapy.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  therapeutic_modality: GENE_THERAPY
  notes: >-
    Investigational. Evidence to date is a single first-in-human case report
    (n=1), in contrast to the established enzyme replacement and substrate
    reduction therapies; not an approved therapy.
  target_mechanisms:
  - target: Glucocerebrosidase Deficiency
    treatment_effect: RESTORES
    description: Transduced CD34+ cells produce functional glucocerebrosidase, restoring systemic enzyme activity.
    evidence:
    - reference: PMID:42324119
      reference_title: "Gaucher Disease Treated With Lentiviral-Mediated Gene Therapy: First Case."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "At 5 years of follow-up, dried blood spot GCase enzyme levels have remained in the normal range"
      explanation: Case demonstrates sustained restoration of enzyme activity to normal levels following gene therapy.
  evidence:
  - reference: PMID:42324119
    reference_title: "Gaucher Disease Treated With Lentiviral-Mediated Gene Therapy: First Case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case shows a sustained response to a single dose of lentiviral gene therapy for Gaucher disease."
    explanation: Case report demonstrates durable long-term efficacy of lentiviral gene therapy approach in Gaucher disease.
- name: Surveillance and Treatment Precautions
  description: >-
    Assess progression at least every six months across hematologic, skeletal, pulmonary, cardiac, psychiatric, and neurologic domains; image liver and spleen periodically. Avoid NSAIDs with moderate-to-severe thrombocytopenia and, if possible, eliglustat during pregnancy.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301446
    reference_title: Gaucher Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinical assessment of disease progression at least every six months to include hematologic, orthopedic, pulmonary, cardiac, psychiatric, and neurologic assessment;
    explanation: >-
      GeneReviews provides the surveillance baseline.
  - reference: PMID:20301446
    reference_title: Gaucher Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Nonsteroidal anti-inflammatory drugs in individuals with moderate-to-severe thrombocytopenia.
    explanation: >-
      Identifies the medication precaution.
  - reference: PMID:20301446
    reference_title: Gaucher Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The lack of studies on the safety of eliglustat use during pregnancy and lactation has led to the recommendation that this medication be avoided during pregnancy, if possible.
    explanation: >-
      Records the reproductive treatment precaution.
- name: Ambroxol Chaperone Therapy
  description: >-
    Investigational pharmacologic enhancement of residual mutant GCase stability and activity. A 28-patient uncontrolled series found variable systemic improvement and two nonresponders; it does not establish comparative efficacy or a neurological cure. A separate 13-patient GD3 study on stable ERT reported improvement in selected neurologic symptoms; absence of a concurrent control limits inference.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ambroxol
  evidence:
  - reference: PMID:37342037
    reference_title: Use of Ambroxol as Therapy for Gaucher Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Two patients with severe symptoms at baseline experienced deterioration of hematologic parameters and biomarkers and were deemed nonresponders; clinical response was observed in the other 26 patients.
    explanation: >-

      snippet: "In mice and humans, GCase deficiency was associated with strong formation of complement-activating GC-specific IgG autoantibodies, leading to complement activation and C5a generation."
      explanation: >
        Identifies stored glucosylceramide as the antigen that triggers the
        complement arm, establishing this edge from substrate accumulation into
        the amplification loop.
- name: Complement C5a-C5aR1 Amplification Loop
  description: >
    Stored glucosylceramide is not an inert deposit. It elicits
    complement-activating glucosylceramide-specific IgG autoantibodies, and the
    C5a so generated acts through C5aR1 to raise UDP-glucose ceramide
    glucosyltransferase output, tipping the balance between glucosylceramide
    formation and degradation. Complement activation therefore feeds back onto
    the primary metabolic defect while simultaneously recruiting and activating
    innate and adaptive immune cells, which is how a partial enzyme deficiency
    can generate disproportionate tissue inflammation.
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: complement activation
    term:
      id: GO:0006956
      label: complement activation
    modifier: INCREASED
  - preferred_term: complement component C5a signaling pathway
    term:
      id: GO:0038178
      label: complement component C5a signaling pathway
    modifier: INCREASED
  downstream:
  - target: Glucocerebroside Accumulation in Macrophages
    description: C5aR1 signaling raises glucosylceramide synthase output, closing a feed-forward loop onto substrate accumulation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28225753
      reference_title: "Complement drives glucosylceramide accumulation and tissue inflammation in Gaucher disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Subsequent C5aR1 activation controlled UDP-glucose ceramide glucosyltransferase production, thereby tipping the balance between GC formation and degradation."
      explanation: >
        Places control of the glucosylceramide synthase step downstream of
        C5aR1, which is what makes this a feed-forward loop rather than a
        parallel inflammatory branch.
  - target: Macrophage Inflammatory Mediator Release
    description: C5a-C5aR1 signaling drives proinflammatory cytokine production and immune cell recruitment around stored substrate.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28225753
      reference_title: "Complement drives glucosylceramide accumulation and tissue inflammation in Gaucher disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Marked local and systemic complement activation occurred in GCase-deficient mice or after pharmacological inhibition of GCase and was associated with GC storage, tissue inflammation and proinflammatory cytokine production."
      explanation: >
        Ties complement activation to the inflammatory mediator output already
        modeled in this entry, in both genetic and pharmacological models of
        GCase deficiency.
  notes: >-
    Added from the 2026 openscientist hypothesis-search report for
    canonical_gba1_glucocerebroside_lysosomal_storage_model. The supporting
    evidence is a mouse study with human autoantibody confirmation; no
    complement-directed therapy has been tested in Gaucher disease patients, so
    the loop's contribution to human disease severity is inferred from the
    rescue of double-deficient animals rather than demonstrated clinically.
  evidence:
  - reference: PMID:28225753
    reference_title: "Complement drives glucosylceramide accumulation and tissue inflammation in Gaucher disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Whereas all GCase-inhibited mice died within 4-5 weeks, mice deficient in both GCase and C5aR1, and wild-type mice in which GCase and C5aR were pharmacologically inhibited, were protected from these adverse effects and consequently survived."
    explanation: >
      Genetic and pharmacological removal of C5aR1 rescues an otherwise lethal
      GCase-deficient phenotype, which is the perturbation result establishing
      that this loop is required for full disease severity rather than merely
      accompanying it.

    term:
      id: hgnc:4177
      label: GBA
  association: Risk Factor
  notes: >
    GBA1 mutations (both homozygous and heterozygous) are the most significant genetic risk factor for Parkinson disease. OR 5.43 across centers. Found in 5-20% of idiopathic PD cases depending on ethnicity.

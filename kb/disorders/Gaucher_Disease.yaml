- accession: geo:GSE150266
  title: Use of mice defective in interferon signaling to distinguish between primary and secondary pathological pathways in a mouse model of neuronal forms of Gaucher disease
  description: The type 1 interferon (IFN) response is part of the innate immune response and best known for its role in viral and bacterial infection. However, this pathway is also induced in sterile inflammation such as occurs in a number of neurodegenerative diseases, including neuronopathic Gaucher disease (nGD), a lysosomal storage disorder (LSD) caused by mutations in Gba1. Mice were injected with conduritol B-epoxide, an irreversible inhibitor of acid-beta glucosidase, the enzyme defective in nGD. Quadrat deficient MyTrMaSt mice, where four adaptors of pathogen recognition receptors (PRRs) are deficient, were used to determine the role of the IFN pathway in nGD pathology.

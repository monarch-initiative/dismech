- name: Mincle-Dependent Lipid Sensing
  mechanism_confidence: PROVISIONAL
  description: >-
    Mincle recognizes glucosylceramide and stimulates inflammatory myeloid-cell responses in ligand assays and mouse genetic systems. This is a preclinical extension; the magnitude of its contribution to human Gaucher disease remains unknown.
  evidence:
  - reference: PMID:28373578
    reference_title: Intracellular metabolite β-glucosylceramide is an endogenous Mincle ligand possessing immunostimulatory activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Synthetic β-GlcCer activated myeloid cells and induced production of inflammatory cytokines; this production was abrogated in Mincle-deficient cells.
    explanation: >-
      Ligand and receptor-loss assays support Mincle-dependent cytokine induction; human Gaucher contribution is not established.
  biological_scale: CELLULAR
  downstream:
  - target: Macrophage Inflammatory Mediator Release
    description: >-
      Mincle-dependent myeloid signaling induces inflammatory cytokine production in vitro.
    causal_link_type: DIRECT

  title: Identification of a biomarker in cerebrospinal fluid for neuronopathic forms of Gaucher disease
  description: Gaucher disease, a recessive inherited metabolic disorder caused by defects in the gene encoding glucosylceramidase (GlcCerase), can be divided into three subtypes according to the appearance of symptoms associated with central nervous system involvement. We now identify a protein, glycoprotein non-metastatic B (GPNMB), that acts as an authentic marker of brain pathology in neurological forms of Gaucher disease.

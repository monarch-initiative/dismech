    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The most frequent neurological abnormalities at onset were psychomotor retardation (14/19) and extrinsic muscle disorders (11/19), including oculomotor apraxia, supranuclear palsy, and strabismus.
    explanation: >-
      The GD3 cohort explicitly reports oculomotor apraxia; the combined 11/19 proportion is not an apraxia-specific frequency.

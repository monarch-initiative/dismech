- accession: geo:GSE250051
  title: Gene expression profiling of brain tissue from neuronopathic Gaucher disease mouse model of PG9VN, PG9V and wild type mice
  description: To understand the intrinsic link between PGRN and Gba D409V mutation dosage in regulating lysosomal function and disease pathogenesis, we generated nGD model of GbaD409V/D409V and loss of PGRN (Grn-/-), termed PG9V that displayed typical neuronopathic GD (nGD). With decreasing the dose of Gba D409V, i.e., D409V/Null, in Grn KO mice (Grn-/-;GbaD409V/Null, PG9VN) led to much earlier onset and more severe neurodegenerative nGD than PG9V mice.

discussions:
- discussion_id: gap_gd_brain_substrate_in_gba1_parkinson
  prompt: >-
    Does glucosylceramide or glucosylsphingosine actually accumulate in the
    brains of people with GBA1-associated Parkinson disease, or is that branch
    driven by misfolded GCase protein independently of substrate storage?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#GBA1-Associated Alpha-Synuclein Proteostasis
  - pathophysiology#Neuronal Glycosphingolipid Accumulation
  rationale: >-
    This entry models the Parkinson disease branch as flowing from reduced GCase
    activity through impaired alpha-synuclein turnover, in parallel with the
    substrate accumulation that drives every other branch. Reviewers of the
    GBA1-Parkinson literature report that substrate accumulation has not been
    convincingly demonstrated in GBA1-Parkinson brains, and propose instead that
    misfolded GCase induces endoplasmic reticulum stress and an unfolded protein
    response that impairs the autophagy-lysosomal pathway. If that is right, the
    branch is a gain-of-function toxicity operating alongside rather than
    downstream of the storage chain, and it predicts different therapeutic
    priorities: chaperone stabilization over substrate reduction. The absence is
    scoped to GBA1-Parkinson brains and does not transfer to neuronopathic types
    2 and 3, where neuronal glucosylsphingosine accumulation is documented.
  proposed_experiments:
  - experiment_id: exp_gd_gba1pd_brain_lipidomics
    name: Region-resolved brain lipidomics in GBA1-associated Parkinson disease
    description: >-
      Mass spectrometry imaging of glucosylceramide and glucosylsphingosine in
      post-mortem GBA1-Parkinson brain, stratified by variant severity, region
      (substantia nigra, cortex, cerebellum) and disease stage, with paired
      endoplasmic reticulum stress markers and cell-type-resolved measurement
      separating neurons from glia.
    would_support:
    - pathophysiology#Neuronal Glycosphingolipid Accumulation
    would_refute:
    - pathophysiology#GBA1-Associated Alpha-Synuclein Proteostasis
    supporting_outcome:
    - >-
        Glucosylceramide and glucosylsphingosine are elevated in affected regions
        and track alpha-synuclein pathology, placing the branch downstream of
        substrate accumulation as the canonical model predicts.
    refuting_outcome:
    - >-
        Lipids are normal or minimally raised while endoplasmic reticulum stress
        markers are elevated, indicating a protein-misfolding gain-of-function
        mechanism that the storage chain does not explain.
  evidence:
  - reference: PMID:37080432
    reference_title: "Targeting the GBA1 pathway to slow Parkinson disease: Insights into clinical aspects, pathogenic mechanisms and new therapeutic avenues."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Preclinical evidence also shows that products of GCase activity can promote accumulation of α-synuclein, however there is no convincing evidence of substrate accumulation in GBA1-PD brains."
    explanation: States the absence directly, and sets it against the preclinical evidence that would predict the opposite.
  - reference: PMID:37080432
    reference_title: "Targeting the GBA1 pathway to slow Parkinson disease: Insights into clinical aspects, pathogenic mechanisms and new therapeutic avenues."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Misfolded GCase proteins induce endoplasmic reticulum stress and subsequent unfolded protein response and impair the autophagy-lysosomal pathway."
    explanation: Names the competing gain-of-function mechanism that would explain the branch without substrate storage.
  posed_date: "2026-09-02T00:00:00Z"
- discussion_id: gap_gd_gammopathy_malignancy_mechanism
  prompt: >-
    By what mechanism does glucosylceramide or glucosylsphingosine accumulation
    lead to the early monoclonal gammopathy and the excess plasma-cell and
    lymphoid malignancy of type 1 Gaucher disease?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Monoclonal Gammopathy
  - pathophysiology#Macrophage Inflammatory Mediator Release
  rationale: >-
    The epidemiology is settled. In 2,123 registry adults, hematological
    malignancy risk was more than four times expected, multiple myeloma about
    nine times and non-Hodgkin lymphoma about three times, with gammopathy
    reported in 11 percent and unexpectedly high monoclonal gammopathy incidence
    among younger patients. The connecting biology is not. Because progression
    from monoclonal gammopathy to myeloma runs at the general-population rate,
    the excess must arise upstream, in whatever makes gammopathy appear early
    and often. This entry therefore records the edge from macrophage
    inflammatory mediator release with unknown intermediates. Resolving it
    determines whether monitoring is the right response or whether earlier
    treatment changes the trajectory.
  proposed_experiments:
  - experiment_id: exp_gd_bcell_clonality_longitudinal
    name: Longitudinal B-cell clonality against substrate burden
    description: >-
      Serial tracking of M-protein, B-cell and plasma-cell clonality, and plasma
      glucosylsphingosine in treated and untreated type 1 cohorts, paired with
      in vitro exposure of B cells to glucosylceramide and glucosylsphingosine
      at cohort-observed concentrations to test effects on survival and
      proliferation.
    would_support:
    - phenotypes#Monoclonal Gammopathy
    supporting_outcome:
    - >-
        Clonal expansion tracks substrate burden and falls with substrate
        reduction, and the lipids drive B-cell survival or proliferation directly,
        identifying the missing intermediates.
    refuting_outcome:
    - >-
        Clonality is independent of substrate burden and unaffected by treatment,
        pointing to a shared upstream susceptibility rather than a
        substrate-driven chain.
  evidence:
  - reference: PMID:36054609
    reference_title: "Cancer risk and gammopathies in 2123 adults with Gaucher disease type 1 in the International Gaucher Group Gaucher Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Risk for hematological malignancies was more than four times higher than expected compared to the general population: non-Hodgkin lymphoma was approximately three times higher; MM was approximately nine times higher."
    explanation: Quantifies the association whose mechanism this gap concerns, against a SEER general-population comparator.
  posed_date: "2026-09-02T00:00:00Z"

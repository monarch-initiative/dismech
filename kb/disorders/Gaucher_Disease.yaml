datasets:
- accession: geo:GSE303993
  title: Developing Midbrain-like Organoid of Gaucher Disease as A Platform for Drug Assessment
  description: Gaucher disease (GD) is a lysosomal storage disorder caused by GBA1 mutations, leading to defective acid β-glucosidase (GCase) and accumulation of glucosylsphingolipids, causing inflammation and neurodegeneration. We developed midbrain-like organoids (MLOs) from induced pluripotent stem cells (iPSCs) of nGD patients with GBA1L444P/P415R and GBA1L444P/RecNcil mutations to model nGD brain pathogenesis. These nGD MLOs exhibited GCase deficiencies, reduced enzyme activities, lipids accumulation, transcriptomic alterations, and impaired dopaminergic neuron differentiation, mirroring nGD pathology.

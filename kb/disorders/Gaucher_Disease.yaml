      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings help advance care of patients with GD1 by supporting recommendations for individualized monitoring for malignancies and antecedents such as MGUS for MM and provoke important questions of the role of glucosylceramide and related sphingolipids in cancer biology."
      explanation: >
        The registry establishes the association and its monitoring
        consequences, while its authors leave the connecting biology open. That
        is why this edge is recorded with unknown intermediates rather than as a
        direct link; the open mechanism is recorded as a knowledge gap in
        discussions.
- name: Glucosylsphingosine Accumulation
  description: >
    GCase deficiency favors formation and accumulation of glucosylsphingosine
    (Lyso-Gb1), a soluble bioactive sphingolipid that contributes to neuronopathic
    toxicity and may also affect bone.
  biological_processes:
  - preferred_term: Sphingolipid Catabolism

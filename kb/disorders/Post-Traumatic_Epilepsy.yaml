name: Post-Traumatic Epilepsy
creation_date: "2026-08-05T00:00:00Z"
category: Complex
description: >-
  Post-traumatic epilepsy is recurrent unprovoked seizures caused by traumatic
  brain injury. It is the archetypal acquired epilepsy and the one place in
  epileptology where the initiating insult is dated to the day, which makes it
  the natural testbed for antiepileptogenesis. A latent period of weeks to years
  separates the injury from the first spontaneous seizure, and during that
  interval blood-brain barrier breakdown, inflammasome-driven neuroinflammation,
  reactive astrogliosis with impaired glutamate handling, GABAergic interneuron
  loss, and aberrant synaptic plasticity together convert normal cortex into an
  epileptic network. Risk scales steeply with injury severity. Short-term
  antiseizure prophylaxis suppresses early provoked seizures but has never been
  shown to prevent the epilepsy itself.
parents:
  - Epilepsy
  - Neurological Disease
synonyms:
  - PTE
  - epilepsies, post-traumatic
  - traumatic epilepsy
disease_term:
  preferred_term: post-traumatic epilepsy
  term:
    id: MONDO:0043264
    label: post-traumatic epilepsy
mappings:
  mondo_mappings:
    - term:
        id: MONDO:0043264
        label: post-traumatic epilepsy
      mapping_predicate: skos:exactMatch
      mapping_source: MONDO
      mapping_justification: >-
        MONDO:0043264 is the post-traumatic epilepsy concept, defined as
        recurrent seizures causally related to craniocerebral trauma.
references:
  - reference: PMID:35302046
    title: >-
      Post-Traumatic Epilepsy and Comorbidities: Advanced Models, Molecular
      Mechanisms, Biomarkers, and Novel Therapeutic Interventions.
  - reference: PMID:41187576
    title: >-
      The path to post-traumatic epilepsy: A review of emerging biomarkers and
      therapeutic targets.
notes: >-
  Scope and terminology note. The clinically important distinction in this
  disorder is between early provoked seizures, occurring within the first seven
  days after injury and treated as acute symptomatic events, and late unprovoked
  seizures, which constitute post-traumatic epilepsy proper. This entry models
  the latter. The distinction is not pedantic: the one intervention that works in
  this disorder works only on the former, which is the central tension the
  discussions record. Concussive convulsions occurring immediately at impact are
  non-epileptic phenomena and are out of scope.

  Drug resistance is modelled on the terminal pathophysiology node and on a
  dedicated Refractory drug response phenotype rather than by reusing the
  focal-seizure term with a severity qualifier.

  Scope note on breadth. This entry concentrates on the epileptogenesis
  mechanism and the early-versus-late seizure dissociation. Dimensions that
  remain uncurated are flagged here rather than silently omitted: structural
  sequelae such as gliosis and hippocampal atrophy, surgical and neuromodulatory
  options for drug-resistant cases, mortality outcomes, and candidate genetic
  modifiers such as IL1B. These are follow-up work, not judgements that they are
  unimportant.
pathophysiology:
  - name: Traumatic Brain Injury
    biological_scale: TISSUE
    description: >-
      Mechanical injury to the brain is the initiating and dated event. Risk of
      subsequent epilepsy scales steeply with severity: after mild injury the
      excess risk is small and disappears within five years, whereas after severe
      injury with contusion, subdural haematoma, skull fracture, or prolonged
      loss of consciousness it rises many-fold and persists for decades.
    downstream:
      - target: Early Provoked Seizures
        causal_link_type: DIRECT
        description: >-
          A branch that leads to acute symptomatic seizures rather than to
          epilepsy. It is modelled explicitly because the entry's central
          argument is that this branch and the epileptogenesis branch dissociate
          pharmacologically.
        evidence:
          - reference: PMID:2115976
            reference_title: >-
              A randomized, double-blind study of phenytoin for the prevention of
              post-traumatic seizures.
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              Between drug loading and day 7, 3.6 percent of the patients
              assigned to phenytoin had seizures, as compared with 14.2 percent
              of patients assigned to placebo
            explanation: >-
              Establishes that early seizures follow the injury and are
              pharmacologically suppressible, which is what distinguishes this
              branch from the epileptogenesis branch.
      - target: Blood-Brain Barrier Disruption and Albumin Extravasation
        causal_link_type: DIRECT
        evidence:
          - reference: PMID:41187576
            reference_title: >-
              The path to post-traumatic epilepsy: A review of emerging
              biomarkers and therapeutic targets.
            supports: SUPPORT
            evidence_source: OTHER
            snippet: >-
              involving chronic neuroinflammation (e.g., IL-1β, NLRP3 pathways),
              blood-brain barrier dysfunction, maladaptive gliosis with glutamate
              dysregulation, and aberrant plasticity
            explanation: >-
              Places blood-brain barrier dysfunction downstream of the injury as
              a component of post-traumatic epileptogenesis.
      - target: Neuroinflammation and Inflammasome Activation
        causal_link_type: DIRECT
      - target: GABAergic Interneuron Loss
        causal_link_type: DIRECT
        evidence:
          - reference: PMID:39826185
            reference_title: >-
              Post-traumatic epilepsy: Insights from human cortical contused
              tissue.
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              We analyzed alterations in interneuron populations, specifically
              subtypes expressing the calcium-binding proteins parvalbumin,
              calretinin, and calbindin, and their association with an increased
              risk of epileptogenesis after TBI.
            explanation: >-
              Links interneuron alterations directly to traumatic brain injury
              and to subsequent epileptogenesis risk, which is this edge.
    evidence:
      - reference: PMID:9414327
        reference_title: >-
          A population-based study of seizures after traumatic brain injuries.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The standardized incidence ratio was 1.5 (95 percent confidence
          interval, 1.0 to 2.2) after mild injuries but with no increase over the
          expected number after five years, 2.9 (95 percent confidence interval,
          1.9 to 4.1) after moderate injuries, and 17.0 (95 percent confidence
          interval, 12.3 to 23.6) after severe injuries.
        explanation: >-
          The population-based cohort that quantifies the severity-graded dose
          response between the injury and later unprovoked seizures, which is the
          causal claim this node makes.
      - reference: PMID:9414327
        reference_title: >-
          A population-based study of seizures after traumatic brain injuries.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          significant risk factors for later seizures were brain contusion with
          subdural hematoma, skull fracture, loss of consciousness or amnesia for
          more than one day, and an age of 65 years or older
        explanation: >-
          Identifies the specific injury features that carry risk, supporting the
          structural-damage reading of this node rather than a generic concussion
          effect.
  - name: Early Provoked Seizures
    biological_scale: ORGANISM
    description: >-
      Acute symptomatic seizures in the first seven days after injury. This is a
      terminal node, not a step toward epilepsy, and that is the point: it is
      modelled as a separate branch off the injury rather than upstream of
      epileptogenesis, because abolishing it pharmacologically leaves late
      epilepsy unchanged. Whether it contributes causally at all, or is purely a
      marker of injury severity, is recorded as a discussion.
    evidence:
      - reference: PMID:41187576
        reference_title: >-
          The path to post-traumatic epilepsy: A review of emerging biomarkers
          and therapeutic targets.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Short-term antiseizure prophylaxis reduces early provoked seizures, but
          no interventions prevent late unprovoked seizures or PTE.
        explanation: >-
          States the dissociation between this node and the epileptogenesis
          branch, which is the reason it is modelled separately.
      - reference: PMID:41187576
        reference_title: >-
          The path to post-traumatic epilepsy: A review of emerging biomarkers
          and therapeutic targets.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          PTE develops via epileptogenesis-a latent, multifactorial process
          distinct from acute seizure triggers
        explanation: >-
          Explicitly separates acute seizure triggering from epileptogenesis,
          which is the modelling decision this node encodes.
  - name: Blood-Brain Barrier Disruption and Albumin Extravasation
    biological_scale: CELLULAR
    description: >-
      Trauma breaches the blood-brain barrier, allowing serum albumin into the
      neuropil where it is taken up by astrocytes and triggers TGF-beta receptor
      signalling. The downstream consequence is loss of astrocytic potassium and
      glutamate buffering capacity, which lowers the seizure threshold of the
      surrounding tissue. Barrier dysfunction after trauma is long-lasting rather
      than transient, which is what makes it a plausible driver of a process
      unfolding over months.
    biological_processes:
      - preferred_term: maintenance of blood-brain barrier
        term:
          id: GO:0035633
          label: maintenance of blood-brain barrier
        modifier: DECREASED
    downstream:
      - target: Reactive Astrogliosis and Impaired Glutamate Homeostasis
        causal_link_type: DIRECT
    evidence:
      - reference: PMID:41187576
        reference_title: >-
          The path to post-traumatic epilepsy: A review of emerging biomarkers
          and therapeutic targets.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          involving chronic neuroinflammation (e.g., IL-1β, NLRP3 pathways),
          blood-brain barrier dysfunction, maladaptive gliosis with glutamate
          dysregulation, and aberrant plasticity
        explanation: >-
          Names blood-brain barrier dysfunction as a component of post-traumatic
          epileptogenesis alongside the other nodes modelled here.
      - reference: PMID:17121744
        reference_title: >-
          TGF-beta receptor-mediated albumin uptake into astrocytes is involved
          in neocortical epileptogenesis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We demonstrate that direct brain exposure to serum albumin is
          associated with albumin uptake into astrocytes, which is mediated by
          transforming growth factor beta receptors (TGF-betaRs). This uptake is
          followed by down regulation of inward-rectifying potassium (Kir 4.1)
          channels in astrocytes, resulting in reduced buffering of extracellular
          potassium.
        explanation: >-
          The direct evidence for the albumin-to-astrocyte-TGF-beta-receptor
          chain and the loss of potassium buffering asserted in this node's
          description. It supplies each step: uptake into astrocytes, receptor
          mediation, Kir4.1 downregulation, and the resulting failure of
          extracellular potassium buffering.
      - reference: PMID:17121744
        reference_title: >-
          TGF-beta receptor-mediated albumin uptake into astrocytes is involved
          in neocortical epileptogenesis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Blocking TGF-betaR in vivo reduces the likelihood of epileptogenesis in
          albumin-exposed brains to 29.3%
        explanation: >-
          Interventional evidence running the other way: blocking the receptor
          reduces epileptogenesis, which supports a causal rather than merely
          associative reading of this node.
      - reference: PMID:25836421
        reference_title: >-
          Albumin induces excitatory synaptogenesis through astrocytic
          TGF-beta/ALK5 signaling in a model of acquired epilepsy following
          blood-brain barrier dysfunction.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Here we demonstrate in vitro and in vivo that activation of the
          astrocytic ALK5/TGF-β-pathway induces excitatory, but not inhibitory,
          synaptogenesis that precedes the appearance of seizures.
        explanation: >-
          Extends the mechanism past potassium buffering to excitatory
          synaptogenesis, the structural change that could sustain a chronically
          epileptic network rather than a transient threshold shift. The finding
          is established in both cultured cells and live animals, and the
          synaptogenesis precedes seizure onset, which places it inside the
          latent period rather than after it.
      - reference: PMID:32919030
        reference_title: >-
          Long-lasting blood-brain barrier dysfunction and neuroinflammation
          after traumatic brain injury.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Analysis of human autopsy tissue indicated that similar to the animal
          model, chronic BBB dysfunction was also evident in the perilesional
          cortex and thalamus of patients with PTE, characterized by presence of
          albumin, iron deposits and calcifications as well as markers of
          neuroinflammation, including reactive astrocytes, microglia and
          monocytes.
        explanation: >-
          Human autopsy tissue from post-traumatic epilepsy patients showing
          chronic barrier dysfunction with albumin extravasation and
          neuroinflammation, which is precisely the mechanism this node asserts
          and anchors it in human material rather than in the rat model alone.
      - reference: PMID:32919030
        reference_title: >-
          Long-lasting blood-brain barrier dysfunction and neuroinflammation
          after traumatic brain injury.
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Unlike expected, we did not find any association between increased
          Gd-leakage or neuroinflammation with seizure susceptibility at 11
          months post-TBI.
        explanation: >-
          Carried deliberately as disconfirming evidence. In the same rat study
          that established the barrier dysfunction is long-lasting, the degree of
          leakage did not correlate with seizure susceptibility. This node is
          therefore modelled as a persistent post-traumatic change plausibly
          contributing to epileptogenesis, not as a quantitatively sufficient
          driver of it.
  - name: Neuroinflammation and Inflammasome Activation
    biological_scale: CELLULAR
    description: >-
      Injury activates inflammasome signalling, with IL-1 beta and the NLRP3
      pathway as the best-characterized axis. The resulting chronic inflammatory
      state is one of the leading candidate links between the acute injury and
      the later emergence of seizures, and it is the target of the most-discussed
      repurposing candidate, the IL-1 receptor antagonist anakinra.
    biological_processes:
      - preferred_term: inflammasome-mediated signaling pathway
        term:
          id: GO:0141084
          label: inflammasome-mediated signaling pathway
        modifier: INCREASED
    downstream:
      - target: Reactive Astrogliosis and Impaired Glutamate Homeostasis
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
      - target: Epileptogenesis During the Latent Period
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: >-
          Inflammasome signalling is consistently associated with
          epileptogenesis, but the causal chain from a cytokine signal to a
          reorganized epileptic network is not resolved, so the edge is recorded
          as indirect with unknown intermediates.
    evidence:
      - reference: PMID:39014496
        reference_title: >-
          Inflammasomes at the crossroads of traumatic brain injury and
          post-traumatic epilepsy.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Inflammasome signaling is one of the major components of the
          neuroinflammatory response, which is increasingly being explored for
          its contribution to the epileptogenic mechanisms and a novel
          therapeutic target against epilepsy.
        explanation: >-
          Establishes inflammasome signalling as a candidate epileptogenic
          mechanism and therapeutic target, which is what this node asserts.
      - reference: PMID:41187576
        reference_title: >-
          The path to post-traumatic epilepsy: A review of emerging biomarkers
          and therapeutic targets.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Promising repurposed agents include IL-1 receptor antagonists
          (anakinra), mTOR inhibitors (rapamycin), and glutamate modulators
          (ceftriaxone), with preclinical data showing reduced seizure burden.
        explanation: >-
          Identifies the IL-1 axis as a druggable node, supporting its
          mechanistic role while making clear the supporting data are preclinical.
  - name: Reactive Astrogliosis and Impaired Glutamate Homeostasis
    biological_scale: CELLULAR
    description: >-
      Astrocytes become reactive, upregulating glial fibrillary acidic protein
      and crystallin alpha-B, and their normal housekeeping fails: glutamate
      clearance is impaired and calcium signalling becomes aberrant. Because
      astrocytes are what keep extracellular glutamate low between synapses,
      losing that function shifts the tissue toward excitation independently of
      any change in the neurons themselves. These changes have been identified in
      contused human tissue, not only in animal models.
    cell_types:
      - preferred_term: astrocyte
        term:
          id: CL:0000127
          label: astrocyte
        modifier: ABNORMAL
    biological_processes:
      - preferred_term: astrocyte activation
        term:
          id: GO:0048143
          label: astrocyte activation
        modifier: INCREASED
    downstream:
      - target: Epileptogenesis During the Latent Period
        causal_link_type: DIRECT
        evidence:
          - reference: PMID:39826185
            reference_title: >-
              Post-traumatic epilepsy: Insights from human cortical contused
              tissue.
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              This review discusses the critical role of GABAergic interneurons
              and reactive astrogliosis in the pathophysiology of post-traumatic
              epilepsy, integrating findings from our research group within the
              traumatic brain injury context with recent literature to highlight
              the impact of excitation-inhibition imbalance.
            explanation: >-
              Places both the interneuron and astroglial arms upstream of the
              excitation-inhibition imbalance that constitutes epileptogenesis,
              supporting these convergent edges.
    evidence:
      - reference: PMID:39826185
        reference_title: >-
          Post-traumatic epilepsy: Insights from human cortical contused tissue.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Increased expression of glial fibrillary acidic protein and crystallin
          alpha-B in reactive astrocytes identified in contused human tissue
          suggests their involvement in exacerbating epileptogenic circuits.
        explanation: >-
          Human contused cortical tissue evidence for reactive astrogliosis in
          post-traumatic epileptogenesis, which anchors this node in human
          material rather than in animal models alone.
      - reference: PMID:39826185
        reference_title: >-
          Post-traumatic epilepsy: Insights from human cortical contused tissue.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          we detail the role of reactive astrogliosis, elucidating how
          dysregulated astrocytic functions, including impaired glutamate
          homeostasis and aberrant calcium signaling, contribute to an
          environment conducive to seizure activity
        explanation: >-
          States the specific astrocytic dysfunctions, impaired glutamate
          handling and aberrant calcium signalling, that this node models.
  - name: GABAergic Interneuron Loss
    biological_scale: CELLULAR
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
    description: >-
      Inhibitory interneurons are selectively vulnerable after trauma. Loss of
      subpopulations defined by the calcium-binding proteins parvalbumin,
      calretinin, and calbindin removes feed-forward and feedback inhibition from
      the surviving circuit, producing an excitation-inhibition imbalance that
      does not require any increase in excitatory drive to be epileptogenic.
    cell_types:
      - preferred_term: GABAergic interneuron
        term:
          id: CL:0000617
          label: GABAergic neuron
        modifier: DECREASED
    biological_processes:
      - preferred_term: gamma-aminobutyric acid signaling pathway
        term:
          id: GO:0007214
          label: gamma-aminobutyric acid signaling pathway
        modifier: DECREASED
    downstream:
      - target: Epileptogenesis During the Latent Period
        causal_link_type: DIRECT
        evidence:
          - reference: PMID:39826185
            reference_title: >-
              Post-traumatic epilepsy: Insights from human cortical contused
              tissue.
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              This review discusses the critical role of GABAergic interneurons
              and reactive astrogliosis in the pathophysiology of post-traumatic
              epilepsy, integrating findings from our research group within the
              traumatic brain injury context with recent literature to highlight
              the impact of excitation-inhibition imbalance.
            explanation: >-
              Places both the interneuron and astroglial arms upstream of the
              excitation-inhibition imbalance that constitutes epileptogenesis,
              supporting these convergent edges.
    evidence:
      - reference: PMID:39826185
        reference_title: >-
          Post-traumatic epilepsy: Insights from human cortical contused tissue.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We analyzed alterations in interneuron populations, specifically
          subtypes expressing the calcium-binding proteins parvalbumin,
          calretinin, and calbindin, and their association with an increased risk
          of epileptogenesis after TBI.
        explanation: >-
          Names the specific interneuron subpopulations whose loss is associated
          with post-traumatic epileptogenesis, which is the claim of this node.
  - name: Epileptogenesis During the Latent Period
    biological_scale: TISSUE
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Seizure Generation and Epileptogenesis"
    description: >-
      The convergence node. Over weeks to years the injured network reorganizes:
      aberrant plasticity, including mTOR-dependent circuit remodelling, combines
      with the inflammatory, glial, and inhibitory changes upstream to convert a
      normal brain into one that generates spontaneous hypersynchronous activity.
      This is the process, not the seizures, and it is the only therapeutic
      window in which the disease could in principle be prevented rather than
      suppressed. No treatment is currently known to act on it.
    downstream:
      - target: Late Unprovoked Seizures
        causal_link_type: DIRECT
    evidence:
      - reference: PMID:35302046
        reference_title: >-
          Post-Traumatic Epilepsy and Comorbidities: Advanced Models, Molecular
          Mechanisms, Biomarkers, and Novel Therapeutic Interventions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Post-traumatic epileptogenesis is an enduring process by which a normal
          brain exhibits hypersynchronous excitability after a head injury
          incident.
        explanation: >-
          Defines post-traumatic epileptogenesis as an enduring process converting
          normal brain to hypersynchronous, which is exactly what this node
          represents.
      - reference: PMID:41187576
        reference_title: >-
          The path to post-traumatic epilepsy: A review of emerging biomarkers
          and therapeutic targets.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          PTE develops via epileptogenesis-a latent, multifactorial process
          distinct from acute seizure triggers
        explanation: >-
          States that epileptogenesis is a latent process distinct from acute
          seizure triggering, which is the separation this entry is built around.
  - name: Late Unprovoked Seizures
    biological_scale: ORGANISM
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
    description: >-
      Recurrent spontaneous seizures, usually focal in onset and correlating with
      the site of injury, constituting post-traumatic epilepsy proper. They are
      frequently drug-resistant.
    evidence:
      - reference: PMID:39014496
        reference_title: >-
          Inflammasomes at the crossroads of traumatic brain injury and
          post-traumatic epilepsy.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Post-traumatic epilepsy (PTE) is one of the most debilitating
          consequences of traumatic brain injury (TBI) and is one of the most
          drug-resistant forms of epilepsy.
        explanation: >-
          Establishes the clinical character of the terminal node, including its
          characteristic drug resistance.
phenotypes:
  - name: Late Unprovoked Focal Seizures
    category: Neurologic
    description: >-
      Recurrent unprovoked seizures beginning more than seven days after the
      injury. These define the disorder, as distinct from the early provoked
      seizures of the first week, and they are frequently refractory to
      antiseizure medication.

      The focal-onset binding rests on the disease definition rather than on a
      measured series: MONDO:0043264, following its MeSH source, states that the
      majority of seizures have a focal onset correlating clinically with the
      site of brain injury. None of the sources cited in this entry reports
      seizure semiology, so no proportion is asserted and no frequency band is
      given.
    phenotype_term:
      preferred_term: Focal-onset seizure
      term:
        id: HP:0007359
        label: Focal-onset seizure
    evidence:
      - reference: PMID:9414327
        reference_title: >-
          A population-based study of seizures after traumatic brain injuries.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The increased risk of seizures after traumatic brain injury varies
          greatly according to the severity of the injury and the time since the
          injury.
        explanation: >-
          Supports that unprovoked seizures follow traumatic brain injury and
          that the risk is severity- and time-dependent. Marked PARTIAL because
          this cohort counted unprovoked seizures without reporting semiology, so
          it does not itself support the focal-onset binding; see the description
          for the basis of that. No frequency band is asserted, because no cited
          source quantifies what proportion of post-traumatic seizures are
          focal in onset.
      - reference: PMID:35302046
        reference_title: >-
          Post-Traumatic Epilepsy and Comorbidities: Advanced Models, Molecular
          Mechanisms, Biomarkers, and Novel Therapeutic Interventions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          many cases of PTE are refractory to antiseizure medications
        explanation: >-
          Supports the drug-resistance characterization included in this
          phenotype description.
  - name: Drug-Resistant Epilepsy
    category: Neurologic
    description: >-
      A substantial fraction of established post-traumatic epilepsy responds
      poorly to antiseizure medication, which is a major driver of long-term
      disability and the reason the field's stated goal is prevention rather
      than suppression.
    phenotype_term:
      preferred_term: Refractory drug response
      term:
        id: HP:0020174
        label: Refractory drug response
    evidence:
      - reference: PMID:39014496
        reference_title: >-
          Inflammasomes at the crossroads of traumatic brain injury and
          post-traumatic epilepsy.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Post-traumatic epilepsy (PTE) is one of the most debilitating
          consequences of traumatic brain injury (TBI) and is one of the most
          drug-resistant forms of epilepsy.
        explanation: >-
          States the drug resistance directly. No frequency band is asserted
          because the sources characterize the resistance qualitatively rather
          than reporting a proportion.
environmental:
  - name: Traumatic Brain Injury
    presence: PRESENT
    description: >-
      Head trauma is the necessary environmental cause of this disorder, and it
      is what makes post-traumatic epilepsy unusual among epilepsies: the
      exposure is discrete, dated, and in principle preventable. Risk is graded by
      severity rather than binary. Mild injury confers only a small excess risk
      that disappears within five years; moderate injury roughly triples it; and
      severe injury, defined by loss of consciousness or amnesia beyond 24 hours,
      subdural haematoma, or brain contusion, raises it seventeen-fold and keeps
      it elevated for decades. Age over 65 at the time of injury is an
      independent risk factor. Penetrating injury is conventionally held to carry
      higher risk than closed head injury, but no source cited here demonstrates
      that, so it is not asserted as a modelled risk factor.
    effect: >-
      Increases risk of later unprovoked seizures in proportion to injury
      severity, with the excess risk persisting for decades after severe injury.
    evidence:
      - reference: PMID:9414327
        reference_title: >-
          A population-based study of seizures after traumatic brain injuries.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Injuries were classified as mild (loss of consciousness or amnesia
          lasting less than 30 minutes), moderate (loss of consciousness for 30
          minutes to 24 hours or a skull fracture), or severe (loss of
          consciousness or amnesia for more than 24 hours, subdural hematoma, or
          brain contusion).
        explanation: >-
          Gives the operational severity definitions on which the graded exposure
          response in this entry rests.
      - reference: PMID:9414327
        reference_title: >-
          A population-based study of seizures after traumatic brain injuries.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The increased risk of seizures after traumatic brain injury varies
          greatly according to the severity of the injury and the time since the
          injury.
        explanation: >-
          States the severity dependence and time dependence of the exposure
          effect, which is the substance of this environmental record.
prevalence:
  - population: Olmsted County, Minnesota population-based TBI cohort (1935-1984)
    measure_type: UNKNOWN
    prevalence_class: UNKNOWN
    notes: >-
      This record captures relative rather than absolute occurrence. The
      population-based cohort reports a standardized incidence ratio of 3.1 for
      unprovoked seizures across all traumatic brain injury severities, rising to
      17.0 after severe injury. Because these are ratios against expected
      population rates rather than a rate in the general population, no
      rate_per_100000 and no prevalence class are asserted here; the absolute
      burden depends entirely on the background incidence of head injury in the
      population of interest.
    evidence:
      - reference: PMID:9414327
        reference_title: >-
          A population-based study of seizures after traumatic brain injuries.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The overall standardized incidence ratio was 3.1 (95 percent confidence
          interval, 2.5 to 3.8).
        explanation: >-
          Gives the overall standardized incidence ratio for unprovoked seizures
          after traumatic brain injury in a defined population.
progression:
  - phase: Early provoked seizures
    age_range: First seven days after injury
    notes: >-
      Acute symptomatic seizures occurring within the first week. These are
      provoked events, not epilepsy, and they are the only part of the disorder
      that responds to prophylaxis. Whether they are themselves epileptogenic or
      merely a marker of severe injury is unresolved and is recorded as a
      discussion.
    evidence:
      - reference: PMID:2115976
        reference_title: >-
          A randomized, double-blind study of phenytoin for the prevention of
          post-traumatic seizures.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Between drug loading and day 7, 3.6 percent of the patients assigned to
          phenytoin had seizures, as compared with 14.2 percent of patients
          assigned to placebo
        explanation: >-
          Quantifies the early-seizure phase and demonstrates that it is
          pharmacologically suppressible, which is what distinguishes it from the
          late phase.
  - phase: Latent period
    age_range: Weeks to years after injury
    notes: >-
      A clinically silent interval during which epileptogenesis proceeds. Its
      length is highly variable, and the absence of a validated biomarker to
      confirm that epileptogenesis is underway in a given patient is the
      principal obstacle to running a prevention trial.
    evidence:
      - reference: PMID:41187576
        reference_title: >-
          The path to post-traumatic epilepsy: A review of emerging biomarkers
          and therapeutic targets.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Predictive biomarkers (neuroimaging, EEG, cytokines, microRNAs) are
          essential for risk stratification in prophylactic trials.
        explanation: >-
          States the biomarker requirement that defines the practical problem of
          this phase.
  - phase: Established post-traumatic epilepsy
    age_range: Months to decades after injury
    notes: >-
      Chronic recurrent unprovoked seizures, frequently drug-resistant, with
      substantial neuropsychiatric comorbidity. Risk after severe injury remains
      elevated for decades rather than resolving.
    evidence:
      - reference: PMID:35302046
        reference_title: >-
          Post-Traumatic Epilepsy and Comorbidities: Advanced Models, Molecular
          Mechanisms, Biomarkers, and Novel Therapeutic Interventions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The goal of epilepsy research is to identify new therapeutic strategies
          that can prevent PTE development or interrupt the epileptogenic process
          and relieve associated neuropsychiatric comorbidities.
        explanation: >-
          Evidences the neuropsychiatric comorbidity asserted in this phase, and
          shows that relieving it is treated as a goal of the field alongside
          preventing the epilepsy itself rather than as an incidental concern.
      - reference: PMID:9414327
        reference_title: >-
          A population-based study of seizures after traumatic brain injuries.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The increased risk of seizures after traumatic brain injury varies
          greatly according to the severity of the injury and the time since the
          injury.
        explanation: >-
          Supports the time-varying, severity-dependent character of the chronic
          phase.
treatments:
  - name: Short-Term Antiseizure Prophylaxis
    description: >-
      Phenytoin or, in current practice, levetiracetam given for approximately
      seven days after severe traumatic brain injury. This reliably reduces early
      provoked seizures. It does not reduce late unprovoked seizures, and in the
      pivotal randomized trial the late-seizure rates were numerically higher in
      the treated arm. The correct reading is that this is seizure suppression
      during the acute phase, not disease prevention, and it should not be
      continued in the hope of preventing epilepsy.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: phenytoin
          term:
            id: CHEBI:8107
            label: phenytoin
        - preferred_term: levetiracetam
          term:
            id: CHEBI:6437
            label: levetiracetam
    target_mechanisms:
      - target: Traumatic Brain Injury
        treatment_effect: MODULATES
        description: >-
          Prophylaxis acts on acute seizure expression in the injured brain
          during the first week. It is deliberately NOT modelled as targeting the
          epileptogenesis node, because the pivotal trial showed no effect on
          late seizures.
    evidence:
      - reference: PMID:2115976
        reference_title: >-
          A randomized, double-blind study of phenytoin for the prevention of
          post-traumatic seizures.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Between drug loading and day 7, 3.6 percent of the patients assigned to
          phenytoin had seizures, as compared with 14.2 percent of patients
          assigned to placebo
        explanation: >-
          Establishes efficacy against early provoked seizures, the one benefit
          this treatment has.
      - reference: PMID:2115976
        reference_title: >-
          A randomized, double-blind study of phenytoin for the prevention of
          post-traumatic seizures.
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Between day 8 and the end of year 1, 21.5 percent of the phenytoin
          group and 15.7 percent of the placebo group had seizures; at the end of
          year 2, the rates were 27.5 percent and 21.1 percent, respectively
        explanation: >-
          Recorded as REFUTE for the disease-prevention claim. Late seizure rates
          were if anything higher on phenytoin, which is why prophylaxis must not
          be presented as antiepileptogenic.
      - reference: PMID:38316735
        reference_title: >-
          Guidelines for Seizure Prophylaxis in Adults Hospitalized with
          Moderate-Severe Traumatic Brain Injury: A Clinical Practice Guideline
          for Health Care Professionals from the Neurocritical Care Society.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          If used, we suggest LEV over PHT/fPHT (weak recommendation, very low
          quality of evidence) for a short duration
        explanation: >-
          The current guideline basis for using levetiracetam rather than
          phenytoin, and for keeping the course short. Marked PARTIAL because the
          recommendation is explicitly weak and rests on very low-quality
          evidence.
      - reference: PMID:38316735
        reference_title: >-
          Guidelines for Seizure Prophylaxis in Adults Hospitalized with
          Moderate-Severe Traumatic Brain Injury: A Clinical Practice Guideline
          for Health Care Professionals from the Neurocritical Care Society.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          There were no significant differences in early or late seizures with
          longer versus shorter ASM use, though cognitive outcomes and adverse
          events appear worse with protracted use.
        explanation: >-
          Directly supports this entry's central thesis from the treatment side:
          extending prophylaxis buys no additional seizure protection, early or
          late, and costs cognition and tolerability. Prolonging the drug in hope
          of preventing epilepsy is therefore harm without benefit.
  - name: Antiseizure Medication for Established Post-Traumatic Epilepsy
    description: >-
      Once late unprovoked seizures are established, treatment follows standard
      focal-epilepsy practice. Response is often poor, and post-traumatic
      epilepsy is among the more drug-resistant focal epilepsies.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: levetiracetam
          term:
            id: CHEBI:6437
            label: levetiracetam
    target_mechanisms:
      - target: Late Unprovoked Seizures
        treatment_effect: INHIBITS
        description: >-
          Symptomatic suppression of the terminal seizure phenotype, targeting
          seizure expression rather than any upstream mechanism node.
    evidence:
      - reference: PMID:35302046
        reference_title: >-
          Post-Traumatic Epilepsy and Comorbidities: Advanced Models, Molecular
          Mechanisms, Biomarkers, and Novel Therapeutic Interventions.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          many cases of PTE are refractory to antiseizure medications
        explanation: >-
          Records the limited efficacy of symptomatic treatment. Marked PARTIAL
          because it qualifies rather than endorses the intervention.
diagnosis:
  - name: Electroencephalography
    description: >-
      EEG is used both acutely, to detect non-convulsive seizures in a sedated or
      unconscious patient after severe injury, and later to characterize an
      established epilepsy. Its role in the latent period is aspirational rather
      than established: EEG signatures are among the candidate biomarkers of
      ongoing epileptogenesis but none is validated for that purpose, which is
      the subject of one of this entry's discussions.
    diagnosis_term:
      preferred_term: Electroencephalography
      term:
        id: NCIT:C38054
        label: Electroencephalography
    results: >-
      Focal epileptiform abnormality corresponding to the injury site in
      established post-traumatic epilepsy; no validated latent-period signature.
    evidence:
      - reference: PMID:41187576
        reference_title: >-
          The path to post-traumatic epilepsy: A review of emerging biomarkers
          and therapeutic targets.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          Predictive biomarkers (neuroimaging, EEG, cytokines, microRNAs) are
          essential for risk stratification in prophylactic trials.
        explanation: >-
          Names EEG among the candidate predictive modalities. Marked PARTIAL
          because it establishes EEG as a candidate rather than a validated
          diagnostic for epileptogenesis.
  - name: Brain imaging
    description: >-
      Imaging establishes the structural substrate and, critically, the injury
      features that carry epilepsy risk: contusion, subdural haematoma, and skull
      fracture. It is therefore doing risk stratification as much as diagnosis.
      Contrast-enhanced imaging can also demonstrate the blood-brain barrier
      leakage modelled upstream, which persisted for months in the animal and
      human work cited here.
    diagnosis_term:
      preferred_term: Magnetic Resonance Imaging
      term:
        id: NCIT:C16809
        label: Magnetic Resonance Imaging
    results: >-
      Contusion, subdural haematoma, or other structural injury; persistent
      barrier leakage on contrast-enhanced sequences.
    evidence:
      - reference: PMID:9414327
        reference_title: >-
          A population-based study of seizures after traumatic brain injuries.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          significant risk factors for later seizures were brain contusion with
          subdural hematoma, skull fracture, loss of consciousness or amnesia for
          more than one day, and an age of 65 years or older
        explanation: >-
          Establishes that the imaging findings themselves carry the risk
          information, which is why imaging is a risk-stratification step here
          and not only a structural survey.
      - reference: PMID:32919030
        reference_title: >-
          Long-lasting blood-brain barrier dysfunction and neuroinflammation
          after traumatic brain injury.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          MRI indicated persistent Gd leakage in the impacted cortex and thalamus
          of variable severity in all rats with TBI which correlated with
          fluorescein extravasation.
        explanation: >-
          Demonstrates that contrast-enhanced MRI can detect the persistent
          barrier leakage modelled in the pathophysiology section. Rat data; the
          same study confirmed chronic barrier dysfunction in human PTE autopsy
          tissue.
clinical_trials:
  - name: NCT01463033
    description: >-
      A pilot study of levetiracetam given acutely after traumatic brain injury,
      designed to establish safety, tolerability, pharmacokinetics, and
      feasibility, with two-year follow-up for pilot data on post-traumatic
      epilepsy. It is the empirical expression of the hope that a newer agent
      with preclinical antiepileptogenic activity might succeed where phenytoin
      failed.
    target_phenotypes:
      - preferred_term: Focal-onset seizure
        term:
          id: HP:0007359
          label: Focal-onset seizure
    evidence:
      - reference: clinicaltrials:NCT01463033
        reference_title: "Pilot: Levetiracetam to Prevent Post-Traumatic Epilepsy"
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Past attempts at preventing epilepsy by treatment with older
          antiepileptic drugs have been unsuccessful.
        explanation: >-
          The trial's own stated premise, which is this entry's prophylaxis
          paradox restated as a rationale for further study.
      - reference: clinicaltrials:NCT01463033
        reference_title: "Pilot: Levetiracetam to Prevent Post-Traumatic Epilepsy"
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Levetiracetam is a novel AED with potent antiepileptogenic properties
          in animal models of epilepsy.
        explanation: >-
          Records the preclinical rationale. Marked PARTIAL because
          antiepileptogenic activity in animal models is precisely the claim that
          this entry's human-model mismatch discussion treats as unestablished
          for humans.
  - name: NCT01048138
    status: COMPLETED
    description: >-
      A placebo-controlled randomized double-blind trial of biperiden, a
      muscarinic antagonist, as a disease-modifying agent after traumatic brain
      injury. It targets a mechanism rather than seizure threshold, which is the
      strategy this entry's prophylaxis discussion argues is required, and it is
      therefore the closest thing to a direct test of that argument.

      It completed, and it was negative. Analysis showed no evidence of benefit
      for either the incidence of post-traumatic epilepsy or mortality.

      The paper also reports more late post-traumatic seizures in the biperiden
      arm. The figure is a count-regression coefficient on the log scale, a
      difference in the logs of expected counts of 2.03 with a 95 percent
      confidence interval of 0.912 to 3.1597; the null for such a coefficient is
      zero, not one, so the interval excludes it and the reported p below 0.001
      is consistent. The estimate also survives adjustment for the on-scene
      Glasgow Coma Scale score, falling only to 1.857.

      The reason not to read that as drug harm is allocation imbalance, and the
      authors say so themselves: the biperiden arm tended toward more severe
      injuries by on-scene GCS and had more frequent bilateral brain lesions,
      both established risk factors for post-traumatic epilepsy. Their own
      conclusion names the unbalanced distribution of those variables as the
      reason larger studies are needed. The trial was additionally halted early
      for the COVID-19 pandemic and under-enrolled against its planned 132
      participants. Taken together it is a mechanism-targeted intervention,
      tested as the prophylaxis discussion prescribes, that failed to show
      benefit in an underpowered and imbalanced sample.
    target_phenotypes:
      - preferred_term: Focal-onset seizure
        term:
          id: HP:0007359
          label: Focal-onset seizure
    evidence:
      - reference: clinicaltrials:NCT01048138
        reference_title: "Use of Biperiden as a Disease Modifying Agent After Traumatic Brain Injury: a Placebo Controlled, Randomized, Double Blind Study"
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          There is no AED or medication that has been demonstrated to affect the
          development of post-traumatic epilepsy.
        explanation: >-
          States the absence of any established antiepileptogenic agent, which is
          the gap this entry's discussions are built around, from a trial
          registration rather than a review.
      - reference: PMID:39175759
        reference_title: >-
          Initial clinical evidence on biperiden as antiepileptogenic after
          traumatic brain injury-a randomized clinical trial.
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Data analysis indicated lack of evidence of biperiden for either, the
          incidence of post-traumatic epilepsy (2.6, 95%CI, 0.65-10.57; p =
          0.170) or the mortality rate (1.57, 95%CI, 0.73-3.38; p = 0.248).
        explanation: >-
          The published negative result. Recorded as REFUTE so the entry states
          plainly that the mechanism-targeted strategy has been tried in humans
          and did not work, rather than presenting the trial as a live prospect.
      - reference: PMID:39175759
        reference_title: >-
          Initial clinical evidence on biperiden as antiepileptogenic after
          traumatic brain injury-a randomized clinical trial.
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The frequency of late post-traumatic seizures was higher for biperiden
          group (2.03, 95%CI = 0.912-3.1597; p <0.001).
        explanation: >-
          A statistically significant excess of late seizures in the biperiden
          arm. The 2.03 is a difference in the logs of expected counts, so the
          relevant null is zero rather than one and the interval excludes it; the
          estimate holds at 1.857 after adjustment for the on-scene Glasgow Coma
          Scale score. It is recorded as a real finding but not as demonstrated
          drug harm, because the arms were imbalanced on injury severity in the
          direction that would produce exactly this result.
      - reference: PMID:39175759
        reference_title: >-
          Initial clinical evidence on biperiden as antiepileptogenic after
          traumatic brain injury-a randomized clinical trial.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The trial began in January 2018 and was halted by researchers on March
          2020 (and terminated in December 2022) in the face of the global
          COVID-19 pandemic.
        explanation: >-
          The first interpretive caveat: the trial stopped early and
          under-enrolled against its planned 132 participants, so the negative
          primary result is underpowered and should not be read as a definitive
          refutation of anticholinergic antiepileptogenesis.
      - reference: PMID:39175759
        reference_title: >-
          Initial clinical evidence on biperiden as antiepileptogenic after
          traumatic brain injury-a randomized clinical trial.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          patients treated with biperiden tended to show more severe injuries as
          demonstrated by lower score at GCSoS than patients treated with
          placebo. Also, bilateral brain lesions were more frequent in the
          biperiden group. Both characteristics, severe and bilateral lesions,
          were already described as risk factors for PTE
        explanation: >-
          The second and more consequential caveat, and the reason the excess of
          late seizures should not be read as drug harm. The arm that had more
          seizures was also the arm with more severe and more often bilateral
          injury, and both are established risk factors for post-traumatic
          epilepsy, so the imbalance runs in exactly the direction needed to
          produce this result without any drug effect.
      - reference: PMID:39175759
        reference_title: >-
          Initial clinical evidence on biperiden as antiepileptogenic after
          traumatic brain injury-a randomized clinical trial.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The combined effect of variables known to have an impact on the
          likelihood of developing late post-traumatic seizures and its
          unbalanced frequency in the different groups is an aspect to be
          considered and underpins the need for larger studies.
        explanation: >-
          The authors' own reading of that imbalance, and their conclusion that
          it is why larger studies are needed. Carried so the entry's caveat is
          the one the source actually gives rather than an inference of its own.
differential_diagnoses:
  - name: Early Provoked Post-Traumatic Seizures
    description: >-
      Acute symptomatic seizures within seven days of injury. These are not
      epilepsy and do not by themselves establish the diagnosis, but they are
      routinely conflated with it, including in older literature. Distinguishing
      them matters because only these respond to prophylaxis.
    distinguishing_features:
      - Onset within the first seven days after the injury.
      - Provoked by the acute injury rather than by an established epileptic network.
      - Suppressible by short-term antiseizure prophylaxis.
    evidence:
      - reference: PMID:41187576
        reference_title: >-
          The path to post-traumatic epilepsy: A review of emerging biomarkers
          and therapeutic targets.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Short-term antiseizure prophylaxis reduces early provoked seizures, but
          no interventions prevent late unprovoked seizures or PTE.
        explanation: >-
          States the pharmacological dissociation that is the practical basis for
          separating these two entities.
  - name: Psychogenic Non-Epileptic Seizures
    description: >-
      Common after traumatic brain injury and frequently comorbid with genuine
      post-traumatic epilepsy, which makes the distinction a recurring clinical
      problem rather than an academic one. Video-EEG is required to separate them.
    distinguishing_features:
      - No ictal EEG correlate during a captured typical event.
      - Semiology that does not conform to a recognized seizure pattern.
  - name: Chronic Traumatic Encephalopathy
    description: >-
      Also a delayed consequence of head trauma, but a neurodegenerative
      tauopathy associated with repetitive impacts, defined neuropathologically
      and presenting with cognitive and behavioural decline rather than with
      recurrent seizures as the cardinal feature. dismech carries a separate
      entry.
    distinguishing_features:
      - Repetitive rather than single severe head impacts.
      - Progressive cognitive and behavioural decline as the leading feature.
      - Neuropathological diagnosis based on perivascular tau pathology.
discussions:
  - discussion_id: pte_prophylaxis_does_not_prevent_epileptogenesis
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      Antiseizure prophylaxis after head injury abolishes early seizures but does
      nothing to the late epilepsy. Why does suppressing seizure expression during
      the acute phase leave epileptogenesis untouched, and what does that tell us
      about which node the drug is actually acting on?
    attaches_to:
      - pathophysiology#Epileptogenesis During the Latent Period
      - pathophysiology#Traumatic Brain Injury
    rationale: >-
      This is the central negative result of the field and it has a clean
      mechanistic reading that the entry encodes structurally. The pivotal
      randomized trial showed phenytoin cutting first-week seizures from 14.2 to
      3.6 percent, then no benefit at all from day eight onward, with late rates
      numerically higher on drug at both one and two years. That dissociation is
      why this entry attaches prophylaxis to the injury node with MODULATES
      rather than to the epileptogenesis node: the drug raises seizure threshold
      in an acutely injured brain, and seizure threshold is simply not the same
      variable as the network reorganization that produces epilepsy. Three
      implications follow. First, an anticonvulsant screen will never find an
      antiepileptogenic drug, because the two are different endpoints. Second,
      the finding argues against early seizures being a major causal driver of
      epileptogenesis, since abolishing them changes nothing downstream, though it
      does not exclude a small effect. Third, any genuine prevention trial has to
      target one of the mechanism nodes upstream, the inflammasome, barrier,
      glial, or plasticity arms, rather than seizure expression. The gap is that
      no such trial has succeeded, so the causal sufficiency of any single
      upstream node remains unestablished in humans.
    proposed_experiments:
      - experiment_id: exp_pte_mechanism_targeted_prevention_trial
        name: Mechanism-targeted post-traumatic epilepsy prevention trial
        description: >-
          A randomized prevention trial in high-risk traumatic brain injury
          patients using an agent directed at an upstream mechanism node rather
          than at seizure threshold, such as an IL-1 receptor antagonist or an
          mTOR inhibitor, with late unprovoked seizures over at least two years as
          the primary endpoint.
        decision_criterion: >-
          A reduction in late unprovoked seizures without a corresponding
          anticonvulsant effect would establish that the targeted node is causally
          necessary for epileptogenesis in humans and would separate
          antiepileptogenesis from anticonvulsant action as endpoints.
      - experiment_id: exp_pte_early_seizure_causal_contribution
        name: Test whether early seizures causally contribute to later epilepsy
        description: >-
          Pooled or individual-participant analysis of prophylaxis trials asking
          whether patients whose early seizures were successfully suppressed
          differ in late epilepsy risk from those who had breakthrough early
          seizures, adjusted for injury severity.
        decision_criterion: >-
          Equivalent late risk regardless of early-seizure suppression would
          confirm early seizures as a severity marker rather than a causal step
          and would justify removing them from causal models entirely.
    evidence:
      - reference: PMID:2115976
        reference_title: >-
          A randomized, double-blind study of phenytoin for the prevention of
          post-traumatic seizures.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Between day 8 and the end of year 1, 21.5 percent of the phenytoin
          group and 15.7 percent of the placebo group had seizures; at the end of
          year 2, the rates were 27.5 percent and 21.1 percent, respectively
        explanation: >-
          The primary negative finding this discussion is built on: no late
          benefit despite a large early effect in the same trial and population.
      - reference: PMID:2115976
        reference_title: >-
          A randomized, double-blind study of phenytoin for the prevention of
          post-traumatic seizures.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          This lack of a late effect could not be attributed to differential
          mortality, low phenytoin levels, or treatment of some early
        explanation: >-
          The trialists explicitly excluded the obvious artefactual explanations,
          which is what makes the negative result mechanistically informative
          rather than merely inconclusive.
      - reference: PMID:41187576
        reference_title: >-
          The path to post-traumatic epilepsy: A review of emerging biomarkers
          and therapeutic targets.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Short-term antiseizure prophylaxis reduces early provoked seizures, but
          no interventions prevent late unprovoked seizures or PTE.
        explanation: >-
          Confirms that the dissociation still stands in current practice and is
          not an artefact of one older trial.
      - reference: PMID:39175759
        reference_title: >-
          Initial clinical evidence on biperiden as antiepileptogenic after
          traumatic brain injury-a randomized clinical trial.
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Data analysis indicated lack of evidence of biperiden for either, the
          incidence of post-traumatic epilepsy (2.6, 95%CI, 0.65-10.57; p =
          0.170) or the mortality rate (1.57, 95%CI, 0.73-3.38; p = 0.248).
        explanation: >-
          The one published human test of the strategy this discussion proposes,
          a mechanism-targeted agent rather than an anticonvulsant, and it was
          negative. Recorded as REFUTE against the proposed resolution rather
          than hidden, though the trial stopped early and was underpowered, so it
          weakens rather than closes the argument.
      - reference: PMID:39175759
        reference_title: >-
          Initial clinical evidence on biperiden as antiepileptogenic after
          traumatic brain injury-a randomized clinical trial.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The frequency of late post-traumatic seizures was higher for biperiden
          group (2.03, 95%CI = 0.912-3.1597; p <0.001).
        explanation: >-
          Retained as a hypothesis to test, not as an observed pattern. Both
          trials produced estimates in the direction of more late seizures rather
          than fewer, but the phenytoin difference (27.5 versus 21.1 percent) was
          non-significant, and the biperiden excess, though statistically robust,
          arose in a trial whose treated arm was more severely and more often
          bilaterally injured. So one arm of the apparent cross-trial signal is
          underpowered and the other is confounded. It is worth recording only
          because the direction is the opposite of what either drug was given
          for, and a prospective test would be cheap to specify.
  - discussion_id: pte_no_validated_epileptogenesis_biomarker
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      Post-traumatic epilepsy has the one thing every other epilepsy lacks, a
      dated initiating insult and an identifiable at-risk population, yet no
      prevention trial has succeeded. Is the missing ingredient a biomarker that
      identifies who is actually undergoing epileptogenesis?
    attaches_to:
      - pathophysiology#Epileptogenesis During the Latent Period
    rationale: >-
      Most patients with traumatic brain injury never develop epilepsy, so a
      prevention trial enrolling on injury severity alone dilutes any true effect
      into a population that was mostly never going to convert. Even after severe
      injury the standardized incidence ratio of 17 corresponds to a minority of
      patients converting. That forces either impractically large trials or long
      follow-up, and it means a genuinely effective agent could fail for
      statistical rather than biological reasons. Candidate enrichment markers
      exist across several modalities, including neuroimaging, EEG signatures,
      circulating cytokines, and microRNAs, but none is validated for the
      purpose. There is a second, subtler problem: the latent period is defined
      by the absence of seizures, so it is currently a diagnosis of exclusion made
      retrospectively once seizures appear. Without a positive marker there is no
      way to confirm that a treated patient was ever undergoing epileptogenesis,
      which makes a negative trial uninterpretable.
    proposed_experiments:
      - experiment_id: exp_pte_prospective_biomarker_validation
        name: Prospective multimodal biomarker validation cohort
        description: >-
          A prospective cohort of patients with moderate to severe traumatic brain
          injury with serial imaging, EEG, and blood sampling from the acute phase
          onward, followed for at least five years, testing whether any single or
          combined marker predicts conversion to late unprovoked seizures with
          enough discrimination to enrich a trial.
        decision_criterion: >-
          A marker or panel achieving sufficient positive predictive value to
          reduce required trial size by a meaningful factor would unblock
          prevention trials; failure of all candidates would indicate that
          enrichment must come from injury phenotyping instead.
      - experiment_id: exp_pte_latent_period_positive_marker
        name: Search for a positive marker of ongoing epileptogenesis
        description: >-
          Test whether any candidate marker changes dynamically during the latent
          period in converters but not non-converters, so that epileptogenesis can
          be identified while it is happening rather than inferred after the first
          seizure.
        decision_criterion: >-
          A marker that tracks the process rather than the eventual outcome would
          make the latent period a positively defined state and would allow
          treatment response to be measured before seizures occur.
    evidence:
      - reference: PMID:41187576
        reference_title: >-
          The path to post-traumatic epilepsy: A review of emerging biomarkers
          and therapeutic targets.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Predictive biomarkers (neuroimaging, EEG, cytokines, microRNAs) are
          essential for risk stratification in prophylactic trials.
        explanation: >-
          States the biomarker requirement and enumerates the candidate
          modalities, none of which is yet validated.
      - reference: PMID:9414327
        reference_title: >-
          A population-based study of seizures after traumatic brain injuries.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The standardized incidence ratio was 1.5 (95 percent confidence
          interval, 1.0 to 2.2) after mild injuries but with no increase over the
          expected number after five years, 2.9 (95 percent confidence interval,
          1.9 to 4.1) after moderate injuries, and 17.0 (95 percent confidence
          interval, 12.3 to 23.6) after severe injuries.
        explanation: >-
          Quantifies why enrichment is necessary: even the highest-risk severity
          stratum converts at a rate that leaves most enrolled patients unable to
          contribute an event.
  - discussion_id: pte_preclinical_to_human_translation_failure
    kind: HUMAN_MODEL_MISMATCH
    status: OPEN
    prompt: >-
      Several agents reduce seizure burden in rodent models of post-traumatic
      epilepsy, yet none has prevented epilepsy in humans. Is that a failure of
      the compounds, of trial design, or of the models themselves?
    attaches_to:
      - pathophysiology#Neuroinflammation and Inflammasome Activation
      - pathophysiology#Epileptogenesis During the Latent Period
    rationale: >-
      The candidate antiepileptogenic agents most often named, IL-1 receptor
      antagonists, mTOR inhibitors, and glutamate modulators such as ceftriaxone,
      rest on preclinical data showing reduced seizure burden. The mismatch is
      recorded as a human-model problem rather than a knowledge gap because the
      evidence exists and is positive; what is unestablished is whether it
      transfers. Several structural differences are candidates. Rodent models
      compress a latent period that in humans can run for years into weeks, so a
      treatment window that looks adequate in a mouse may be wrong by an order of
      magnitude in a patient. Model injuries are stereotyped and delivered to
      young healthy animals, whereas human traumatic brain injury is
      heterogeneous in mechanism, location, and severity, and its highest-risk
      group includes patients over 65. Most importantly, preclinical endpoints are
      usually seizure burden or frequency, which is an anticonvulsant readout, not
      the binary conversion-to-epilepsy endpoint a human prevention trial must
      use. Given that the field already knows anticonvulsant action dissociates
      from antiepileptogenesis in this disorder, a preclinical seizure-burden
      reduction may be measuring precisely the wrong thing.
    proposed_experiments:
      - experiment_id: exp_pte_model_endpoint_alignment
        name: Realign preclinical endpoints to conversion rather than burden
        description: >-
          Evaluate candidate antiepileptogenic agents in animal models using
          proportion of animals developing spontaneous recurrent seizures as the
          primary endpoint, with treatment withdrawn well before assessment so
          that residual anticonvulsant action cannot mask the result.
        decision_criterion: >-
          Agents that reduce conversion rate after washout are genuinely
          antiepileptogenic candidates; agents that only reduce seizure burden on
          drug are anticonvulsants and should not enter prevention trials.
      - experiment_id: exp_pte_model_human_injury_correspondence
        name: Correspondence of model injury to high-risk human injury phenotypes
        description: >-
          Systematic comparison of the histopathological and imaging features of
          standard rodent post-traumatic epilepsy models against the human injury
          features that actually carry risk, namely contusion with subdural
          haematoma, penetrating injury, and older age.
        decision_criterion: >-
          Poor correspondence, particularly on the lesion types that dominate
          human risk, would indicate the models are testing a different disease
          and would justify developing models built around those features.
    evidence:
      - reference: PMID:41187576
        reference_title: >-
          The path to post-traumatic epilepsy: A review of emerging biomarkers
          and therapeutic targets.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          Promising repurposed agents include IL-1 receptor antagonists
          (anakinra), mTOR inhibitors (rapamycin), and glutamate modulators
          (ceftriaxone), with preclinical data showing reduced seizure burden.
        explanation: >-
          Names the candidate agents and, critically, identifies the supporting
          evidence as preclinical and the endpoint as seizure burden, which is the
          mismatch this discussion records.
      - reference: PMID:35302046
        reference_title: >-
          Post-Traumatic Epilepsy and Comorbidities: Advanced Models, Molecular
          Mechanisms, Biomarkers, and Novel Therapeutic Interventions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Differences in injury patterns, latency period, and biomarkers are
          outlined in the context of animal model validation
        explanation: >-
          Identifies injury pattern and latency differences as explicit model
          validation concerns, which are two of the structural mismatches named in
          the rationale.
      - reference: PMID:35302046
        reference_title: >-
          Post-Traumatic Epilepsy and Comorbidities: Advanced Models, Molecular
          Mechanisms, Biomarkers, and Novel Therapeutic Interventions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          There is currently no approved treatment that can prevent onset of
          spontaneous seizures associated with brain injury
        explanation: >-
          Confirms the human-side half of the mismatch, that no preventive
          treatment has translated despite the preclinical signal.

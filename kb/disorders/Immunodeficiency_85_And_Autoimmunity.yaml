      evolved to lymphocytic interstitial pneumonitis
    explanation: >-
      Names the specific pneumonitis and its evolution from the lung disease of infancy.

- category: Gastrointestinal
  name: Autoimmune Enteropathy
  description: >-
    Diagnosed in the severely affected patient during the evaluation for failure to thrive
    at six months of age, making it one of the two presenting features of his disease.


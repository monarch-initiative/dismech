genetic:

- name: TOM1
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: TOM1
    term:
      id: hgnc:11982
      label: TOM1
  association: >-
    A heterozygous missense variant, p.Gly307Asp, in the GAT domain. Typed CAUSATIVE
    because OMIM has assigned the phenotype a number (619510) and the 2025 functional work
    resolves the variant's effect to a specific molecular step, but the caveat belongs in
    the same breath: p.Gly307Asp itself has been reported in one family only, and the
    discovery paper says in its own abstract that unrelated cases are needed before the
    genotype-phenotype relationship is firm.

    The gene is better supported than the variant. An unrelated child with a severe
    IPEX-like phenotype was subsequently found to carry a different TOM1 lesion - a splice
    variant yielding a stable product lacking the vesicular trafficking domain, and so
    likely dominant negative - in a cohort study of FOXP3-negative IPEX-like disease. That
    second family raises confidence that TOM1 is a disease gene without adding anything to
    the case for this variant, which is the distinction the knowledge gap below turns on.
  evidence:
  - reference: PMID:31263572
    reference_title: "Dominant TOM1 mutation associated with combined immunodeficiency and autoimmune disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In sum, we report here an identification of a novel gene, TOM1, associating with
      early-onset autoimmunity, antibody deficiency, and features of combined
      immunodeficiency.
    explanation: >-
      The gene-disease claim, quoted in the source's own careful register - "associating
      with" rather than "causing".

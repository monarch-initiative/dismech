- category: Respiratory
  name: Lymphocytic Interstitial Pneumonitis
  description: >-
    The form the lung disease took as it evolved in the severely affected patient, from
    the lung disease diagnosed alongside his enteropathy in infancy. Curated separately
    from the general interstitial phenotype because only his disease is described this

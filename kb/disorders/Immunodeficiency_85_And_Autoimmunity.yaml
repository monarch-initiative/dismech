    reference_title: "Dominant TOM1 mutation associated with combined immunodeficiency and autoimmune disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intravenous immunoglobulin replacement was initiated but soon discontinued due to
      adverse effects.
    explanation: >-
      The index patient's course on replacement therapy, including the intolerance that

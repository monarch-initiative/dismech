discussions:

- discussion_id: gap_single_family_causality
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is TOM1 p.Gly307Asp causative of this syndrome, or is it a rare variant that
    co-segregated with the phenotype in the one family it has been reported in?
  attaches_to:
  - genetic#TOM1
  - pathophysiology#TOM1 GAT-Domain Variant
  rationale: >-
    Two claims are entangled here and have different amounts of evidence behind them, so
    the gap is about separating them rather than about a shortage of patients as such.

    TOM1 as a disease gene now has two unrelated families: the mother and son with
    p.Gly307Asp, and a subsequently reported child with a severe IPEX-like phenotype
    carrying a different, likely dominant-negative TOM1 splice variant. Two families with
    concordant immune dysregulation and different lesions in the same gene is a
    meaningfully stronger position than one.

    TOM1 p.Gly307Asp as *this* disease still rests on the original two related patients.
    Every functional experiment curated here was done on their cells, and the 2025
    follow-up deepens that characterisation rather than adding cases. The functional work
    establishes that the variant has a specific, reproducible molecular effect - loss of
    the TOLLIP interaction, failure to restrain TOLLIP phosphoinositide binding, reduced
    myosin VI binding, autophagosome accumulation, excess inflammatory signalling. That is
    strong evidence the variant does something. It is weaker evidence that what it does is
    this disease, because a mother and son share far more than one variant, and the
    severity difference between them is itself attributed to unidentified modifiers.

    The 2025 authors state both halves in their own limitations paragraph, and this entry
    follows them: the second family is reported there, and so is the call for a larger
    cohort in the next sentence.

    The practical consequence is for variant interpretation. A GAT-domain TOM1 variant found
    in a new patient can now be read against a gene with two supporting families, but not
    against a case series for any particular allele, because there is none.
  proposed_experiments:
  - experiment_id: unrelated_tom1_cohort
    name: Targeted TOM1 screening in unexplained combined immunodeficiency with autoimmunity
    description: >-
      Screen TOM1 in existing cohorts of genetically unsolved inborn errors of immunity
      presenting with combined immunodeficiency and early-onset autoimmunity, and
      functionally test any GAT-domain variants for the TOLLIP-interaction and myosin VI
      binding defects that characterise p.Gly307Asp. The IPEX-like cohort that found the
      second family shows the approach works; what it did not do is test that patient's
      variant functionally, so a concordant functional phenotype in a third, unrelated
      carrier is what would settle this.
  evidence:
  - reference: PMID:40936361
    reference_title: "A TOM1 variant impairs interaction with TOLLIP, autophagosome-lysosome fusion and regulation of innate immunity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, since the initial report of these patients (Keskitalo et al., 2019), an
      unrelated child carrying a pathogenic TOM1 variant has been reported (Baxter et al.,
      2022), with a clinical phenotype resembling that of the TOM1 patients discussed here.
    explanation: >-
      The second family, reported by the same paper that states the single-family
      limitation. This is the sentence that fixes the size of the gap.
  - reference: PMID:33864888
    reference_title: "Molecular diagnosis of childhood immune dysregulation, polyendocrinopathy, and enteropathy, and implications for clinical management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient S15, with a severe IPE phenotype, is heterozygous for a TOM1 splice mutation
      that produces a stable product lacking the vesicular trafficking domain, so likely
      yielding a dominant negative effect
    explanation: >-
      The second family at first hand: a different TOM1 lesion, an unrelated patient, and
      an immune-dysregulation phenotype - which supports the gene while leaving
      p.Gly307Asp itself unreplicated.

- discussion_id: gap_why_hsct_failed
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why did haematopoietic stem cell transplantation fail, and is the non-haematopoietic
    compartment the reason?
  attaches_to:
  - treatments#Hematopoietic Stem Cell Transplantation
  - pathophysiology#Impaired Lymphocyte Effector Function
  rationale: >-
    HSCT replaces the haematopoietic compartment and nothing else. It is the standard
    curative approach for inborn errors of immunity precisely because most of them are
    diseases of haematopoietic lineages.

    The 2025 authors advance a specific answer, and it is worth stating as theirs rather
    than as this entry's reasoning. TOM1 is a ubiquitous trafficking adaptor rather than an
    immune-restricted gene; the signalling deficit in these patients was demonstrated in
    fibroblasts, a lineage a transplant does not replace; and they propose that persistent
    poorly-controlled innate signalling in those resident cells kept stimulating the
    replaced immune cells in a self-reinforcing loop, which they offer as a plausible
    explanation for the fatal lung disease. They state it at that strength - "potentially
    account for", "plausible explanation" - so it is a hypothesis with a mechanism, not a
    finding.

    What keeps it open is that three other explanations are live and the evidence does not
    separate them. The discovery paper records that the patient *rejected the allograft*
    within six months and the disease returned, which is a sufficient explanation for
    relapse on its own and is documented rather than inferred. Post-transplant pulmonary
    fibrosis is a recognised complication in its own right. And the fatal organ was already
    diseased before transplant, so its progression need not indicate anything about the
    graft at all. One patient cannot distinguish these, and the fibroblast finding shows
    the variant acts outside blood without showing that the lung disease is cell-autonomous.

    The stakes are practical: if the stromal contribution is real, transplant cannot be
    curative here and the caution the authors extend to other innate-immunity IEIs follows;
    if rejection is the whole story, it says nothing about the approach.
  evidence:
  - reference: PMID:40936361
    reference_title: "A TOM1 variant impairs interaction with TOLLIP, autophagosome-lysosome fusion and regulation of innate immunity."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      the patient's fibroblasts have severely impaired regulation of innate immunity
      pathways, and although immune effector cells can be replaced by healthy ones with
      HSCT, cells in other tissues cannot
    explanation: >-
      The authors' proposed explanation, and the reason it is PARTIAL - it supplies a
      mechanism for why transplant would not be curative without testing it. Tagged OTHER
      because it is inference from their fibroblast data rather than a measurement in the
      transplanted patient.
  - reference: PMID:40936361
    reference_title: "A TOM1 variant impairs interaction with TOLLIP, autophagosome-lysosome fusion and regulation of innate immunity."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Impaired inhibition of these pathways in TOM1 G307D patient fibroblasts likely caused
      a vicious circle, offering a plausible explanation for the severe lung inflammation
      and fibrosis to which the patient eventually succumbed.
    explanation: >-
      The same hypothesis at its strongest statement, quoted with its own hedges intact -
      "likely", "plausible explanation".
  - reference: PMID:31263572
    reference_title: "Dominant TOM1 mutation associated with combined immunodeficiency and autoimmune disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Within 6 months, however, he rejected the allograft and the disease returned.
    explanation: >-
      The competing explanation, and the only one that is documented rather than proposed.
      A rejected graft accounts for the return of disease without requiring any
      tissue-autonomous contribution.
  proposed_experiments:
  - experiment_id: tom1_lineage_restricted_models
    name: Lineage-restricted TOM1 models to separate haematopoietic from stromal contribution
    description: >-
      Generate haematopoietic-restricted and mesenchymal-restricted TOM1 G307D models and
      compare lung and gut pathology, to test whether disease in those organs requires the
      variant in the resident tissue or is driven entirely by transplantable immune cells.
      A stromal requirement would explain the transplant outcome and change the therapeutic
      target. Note that the rejection observed in the index case cannot be modelled this
      way and would need separating from it clinically, in any future transplanted patient,
      by documenting chimerism alongside organ disease.

notes: >-
  Scope and naming. This entry curates the OMIM 619510 / MONDO:0030428 entity, defined by
  TOM1 p.Gly307Asp in a single family. The numbered IMD name is an OMIM serialisation
  rather than a clinical term, so the entry leads with the mechanism. A second, unrelated
  TOM1 patient carrying a different variant is cited on the gene entry and in the causality
  discussion; whether that patient falls inside this MONDO term or beside it is not settled
  by anything cited, and the entry does not decide it.

  Where the two sources disagree. The 2019 discovery paper says the transplanted patient
  died one year after transplant; the 2025 paper says six months post-HSCT. Both are quoted
  on the transplant entry and neither is silently preferred. The 2019 paper is the one that
  describes the clinical course in detail and the only one that records graft rejection.

  Why the two arms are curated from one effector. Immunodeficiency and autoimmunity in the
  same patient is common enough in inborn errors of immunity to have its own literature,
  but the usual explanation runs through a lymphocyte-intrinsic pathway - FOXP3, the STATs,
  actin regulators. Here the shared upstream lesion is a housekeeping trafficking function,
  and the entry curates a single central effector with two downstream arms rather than two
  parallel chains, because the sources locate both in degradative flux. That is a
  structural claim and it could be wrong; the edge to the immunodeficiency arm is marked
  INDIRECT_UNKNOWN_INTERMEDIATES precisely because the connecting steps are not shown.

  Deep research. A claude_code provider run (research/Immunodeficiency_85_And_Autoimmunity-deep-research-claude_code.md,
  8 web searches, 13 turns) was performed after the entry was drafted from the two cached
  full texts. Its own reference validation reports 6 of 6 identifiers resolved and none
  unresolved; 6 were weighed for topical relevance, 5 scored on topic and none off topic,
  so one is undecided rather than cleared. NEC preflight returns SKIP - MONDO records no
  causal gene for this term, so the automated gene check cannot discriminate - and the
  manual fallback passes on both remaining anchors: the report's OMIM identifier (619510)
  matches the MONDO xref, and TOM1 dominates its gene mentions at 47 against 10 for TOLLIP.
  It is corroborative rather than additive: it reaches the same
  causal chain, the same treatment history, and independently records the graft rejection
  and the one-year interval to death. Two things it did not do are worth recording, because
  they bound how much weight a DR report should carry here. It did not surface the second,
  unrelated TOM1 family - the report states the disease is confined to one family, which is
  what the entry originally said and what the 2025 paper contradicts in its own limitations
  paragraph. And it cited only three PMIDs, two of which were already curated. Its useful
  contribution was pointing at a negative result in the 2019 paper (normal CTLA4, IL-1R and
  IL-6R expression) that is now curated on the trafficking node.

  No GeneReviews baseline. A PubMed All Fields search for GeneReviews coverage returned
  chapters on Temple syndrome, GLI3-related Pallister-Hall syndrome, sepiapterin reductase
  deficiency and AIP familial isolated pituitary adenomas - none of them this disease. No
  chapter exists, which is expected for a disorder first described in 2019.

  Evidence tiers. The clinical description is HUMAN_CLINICAL from the two patients of the
  index family, plus one cohort-study patient with a different variant. The
  mechanism is IN_VITRO throughout, in patient-derived cells rather than a model organism -
  which is a strength for relevance and a limit on generalisability, since the cells all
  come from the same two people. The prior TOM1/TOLLIP regulatory work cited on the
  inflammatory node is tagged OTHER because it is review framing of mouse and in vitro work
  rather than a measurement in these patients.

  Two treatments are curated as failures. HSCT and everolimus both appear with supports:
  REFUTE, which in neither case is a statement about the modality in inborn errors of
  immunity generally - each is the outcome in the single reported instance in this disease.
  An entry that recorded either attempt without its outcome would be worse than one that
  omitted it.

  The everolimus failure is the more informative of the two, because it has a mechanism.
  The rationale for giving it was sound on the 2019 model of the disease, which located the
  defect in autophagosome *formation*; the 2025 relocation of the defect to
  autophagosome-lysosome *fusion* is what makes an autophagy inducer predictably useless
  and plausibly harmful. That is a case of a mechanism model changing a therapeutic
  prediction, which is the kind of thing this knowledge base exists to make visible - so
  the drug is wired to the fusion node with treatment_effect: MODULATES rather than left in
  prose.

  Author-proposed therapies are curated as proposals. The IL-1 antagonism and JAK
  inhibition entry carries supports: PARTIAL and says in its own description that no
  patient has received either. Given that the last mechanistically reasoned therapy here
  harmed the patient, the distinction between a proposal and a treatment is not pedantry.


name: Immunodeficiency 85 and Autoimmunity
creation_date: "2026-08-22T04:00:00Z"
category: Immunological
disease_term:
  preferred_term: immunodeficiency 85 and autoimmunity
  term:
    id: MONDO:0030428
    label: immunodeficiency 85 and autoimmunity
description: >-
  An inborn error of immunity caused by a heterozygous missense variant in TOM1, an
  endosomal adaptor protein with no classical immunological function. The name records
  what makes it interesting: the same lesion produces immunodeficiency and autoimmunity
  together, in one patient, rather than one or the other.

  That combination is the entry's organising claim. TOM1 does not sit in a lymphocyte
  signalling pathway - it moves ubiquitinated cargo through the endolysosomal system and
  helps autophagosomes fuse with lysosomes. Losing that function starves immune effector
  responses of something they need while simultaneously removing a brake on inflammatory
  signalling, so the immune system is at once underpowered against infection and
  overactive against self.

  The evidence base is narrow, and in a specific way. Two related patients - a mother with
  relatively mild disease and her son, whose disease was aggressive and fatal - carry TOM1
  p.Gly307Asp, and every functional experiment curated here was performed on their cells.
  A second, unrelated child with a different TOM1 variant (a splice change predicted to be
  dominant negative) has since been reported in an IPEX-like cohort, so the gene now has
  two families behind it while the variant still has one. The discovery paper's own caveat
  that unrelated cases are needed is curated on the gene entry rather than left in notes.

parents:
- Inborn Errors of Immunity
- Combined Immunodeficiency

pathophysiology:

- name: TOM1 GAT-Domain Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The variant p.Gly307Asp lies in the GAT domain of TOM1, the domain through which TOM1
    binds TOLLIP and ubiquitin. It is at a locus conserved across species and absent from
    gnomAD, and it does not abolish expression - wild-type and mutant TOM1 are expressed
    equally, so the lesion acts through protein-protein interactions rather than through
    absence of protein.

    Two interactions are measurably weakened, and they reach the same downstream failure by
    different routes: TOLLIP, which is the route this entry curates in detail, and myosin
    VI, which acts on autophagosome maturation directly. The node is kept to the variant
    itself so that both routes can hang off it.
  evidence:
  - reference: PMID:31263572
    reference_title: "Dominant TOM1 mutation associated with combined immunodeficiency and autoimmune disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report here a heterozygous TOM1 p.G307D missense mutation, detected by
      whole-exome sequencing, in two related patients presenting with early-onset
      autoimmunity, antibody deficiency, and features of combined immunodeficiency.
    explanation: >-
      The variant, its zygosity, how it was found, and the phenotype it was found in.
  - reference: PMID:31263572
    reference_title: "Dominant TOM1 mutation associated with combined immunodeficiency and autoimmune disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutant TOM1 failed to interact with TOLLIP, a protein required for IL-1
      recycling, PAMP signaling and autophagosome maturation, further strengthening the
      link between the candidate mutation and patient pathophysiology.
    explanation: >-
      The molecular consequence of the variant, and the three TOLLIP functions that make
      it immunologically consequential.
  - reference: PMID:40936361
    reference_title: "A TOM1 variant impairs interaction with TOLLIP, autophagosome-lysosome fusion and regulation of innate immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The G307D variant impairs the ability of TOM1 to reduce TOLLIP phosphatidylinositol
      3-phosphate binding, an important regulatory mechanism for cargo trafficking
      commitment for both proteins.
    explanation: >-
      Resolves the interaction defect to a specific regulatory step, which is what makes
      this node a mechanism rather than an association.
  - reference: PMID:40936361
    reference_title: "A TOM1 variant impairs interaction with TOLLIP, autophagosome-lysosome fusion and regulation of innate immunity."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The variant is in the GAT domain of TOM1, in a locus highly conserved among species,
      and absent from databases including gnomAD.
    explanation: >-
      The variant-level evidence for pathogenicity - domain, conservation, population
      absence. Tagged COMPUTATIONAL because it is database and alignment evidence rather
      than an experiment.
  - reference: PMID:31263572
    reference_title: "Dominant TOM1 mutation associated with combined immunodeficiency and autoimmune disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The expression of WT and mutant TOM1 were identical
    explanation: >-
      Establishes that the variant acts through protein-protein interactions rather than by
      reducing the amount of TOM1, which is what makes the two interaction defects below
      the mechanism rather than a correlate of it.
  - reference: PMID:40936361
    reference_title: "A TOM1 variant impairs interaction with TOLLIP, autophagosome-lysosome fusion and regulation of innate immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we observed that TOM1 G307 interaction with myosin VI was reduced compared to that
      for TOM1 WT, which likely also contributes to the impairment in autophagy seen in
      patient cells
    explanation: >-
      The second interaction defect, and the source's own hedged attribution of an
      additional contribution to the autophagy phenotype - which is why the myosin VI edge
      is curated as a parallel input rather than as the main route.
  downstream:
  - target: Loss of TOM1 Restraint on TOLLIP Phosphoinositide Binding
    causal_link_type: DIRECT
    description: >-
      The proximal biochemical consequence of the variant, measured in lipid-overlay and
      liposome-sedimentation assays with purified protein.
  - target: Autophagosome-Lysosome Fusion Failure
    causal_link_type: DIRECT
    description: >-
      A second, TOLLIP-independent route from the same variant. TOM1 and myosin VI act
      together in the last steps of autophagy, and loss of either causes autophagosomes to
      accumulate without maturing; the G307D variant binds myosin VI less well than
      wild-type TOM1. Curated as a parallel input rather than folded into the TOLLIP arm
      because the source treats it as an additional contributor, not a consequence of the
      TOLLIP defect.

- name: Loss of TOM1 Restraint on TOLLIP Phosphoinositide Binding
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    The regulatory step the 2025 work resolves, and the reason this disease is a failure of
    one adaptor to regulate another rather than a simple loss of function.

    The phosphoinositide binding here is TOLLIP's, not TOM1's - a distinction worth stating
    because it is easy to attribute to the wrong protein. Purified TOM1 does not bind
    PtdIns3P-containing liposomes at all. What wild-type TOM1 does is *reduce* TOLLIP's
    affinity for PtdIns3P, releasing TOLLIP from the endosomal membrane and committing both
    proteins to cargo trafficking. TOM1 G307D is significantly less efficient at that
    inhibition, so TOLLIP remains committed to membrane PtdIns3P - which is why the
    molecular function below is annotated INCREASED rather than lost.
  molecular_functions:
  - preferred_term: TOLLIP binding to phosphatidylinositol 3-phosphate, no longer restrained by TOM1
    term:
      id: GO:0032266
      label: phosphatidylinositol-3-phosphate binding
    modifier: INCREASED
  evidence:
  - reference: PMID:40936361
    reference_title: "A TOM1 variant impairs interaction with TOLLIP, autophagosome-lysosome fusion and regulation of innate immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, TOM1 G307D was significantly less efficient in inhibiting TOLLIP
      phosphoinositide association (Fig. 2C), suggesting that some TOLLIP remains committed
      to membrane PtdIns3P.
    explanation: >-
      The measurement this node rests on, and the direction of the effect - TOLLIP's
      PtdIns3P association is retained rather than released.
  - reference: PMID:40936361
    reference_title: "A TOM1 variant impairs interaction with TOLLIP, autophagosome-lysosome fusion and regulation of innate immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Neither TOM1 nor TOM1 G307 were able to bind PtdIns3P-containing liposomes
    explanation: >-
      The negative control that fixes the attribution: the phosphoinositide binding
      annotated on this node belongs to TOLLIP, not to TOM1.
  - reference: PMID:40936361
    reference_title: "A TOM1 variant impairs interaction with TOLLIP, autophagosome-lysosome fusion and regulation of innate immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In cells overexpressing TOM1 WT, colocalization of TOLLIP and EEA1 was significantly
      reduced, in keeping with previous data showing that TOM1 reduces TOLLIP binding to
      PtdIns3P. However, in cells overexpressing the G307D variant, TOLLIP and EEA1
      colocalization was not reduced
    explanation: >-
      The same effect confirmed in cells rather than with purified protein, using early
      endosome colocalisation as the readout.
  downstream:
  - target: Defective Endosomal Cargo Trafficking
    causal_link_type: DIRECT
    description: >-
      TOM1 and TOLLIP together commit ubiquitinated cargo to the endolysosomal route;
      TOLLIP retained on the endosomal membrane is where that commitment breaks.

- name: Defective Endosomal Cargo Trafficking
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    TOM1 is a multimodular adaptor that, with TOLLIP, clathrin and myosin VI, routes
    ubiquitinated proteins through endosomes to lysosomal degradation. This is the step at
    which a housekeeping function becomes an immunological one: the cargo includes immune
    receptors, and their recycling and disposal set the duration of the signals they carry.
  biological_processes:
  - preferred_term: endosomal transport
    term:
      id: GO:0016197
      label: endosomal transport
    modifier: DECREASED
  evidence:
  - reference: PMID:40936361
    reference_title: "A TOM1 variant impairs interaction with TOLLIP, autophagosome-lysosome fusion and regulation of innate immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we show that the variant causes a defect in the interaction between TOM1 and TOLLIP,
      another adaptor protein involved in cargo trafficking and regulation of innate
      immunity.
    explanation: >-
      Names cargo trafficking and innate-immune regulation as the two things this adaptor
      pair does, which is the pairing this node models.
  - reference: PMID:31263572
    reference_title: "Dominant TOM1 mutation associated with combined immunodeficiency and autoimmune disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The pathogenesis is linked to increased endoplasmic reticulum stress, inefficient
      autophagy, and impaired recycling of immune receptors.
    explanation: >-
      The general mechanism by which endolysosomal defects cause monogenic autoimmune
      disease, into which this disorder is placed. Tagged OTHER because it is the review
      framing rather than a measurement in these patients.
  - reference: PMID:31263572
    reference_title: "Dominant TOM1 mutation associated with combined immunodeficiency and autoimmune disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      as increased IL-6 signaling and impaired CTLA-4 expression give monogenic autoimmune
      phenotypes similar to our patients.6,22 All tests were normal
    explanation: >-
      A negative result that constrains this node rather than supporting it directly. The
      obvious alternative explanation for the phenotype - a receptor the trafficking defect
      fails to put on the surface - was tested for CTLA4 and the IL-1 and IL-6 receptors
      and was not found. Curated because ruling that out is what leaves the defect at the
      level of degradative flux rather than of receptor display. The inline citation markers
      are part of the source sentence and are quoted as they appear.
  downstream:
  - target: Autophagosome-Lysosome Fusion Failure
    causal_link_type: DIRECT
    description: >-
      Autophagosome maturation depends on the same adaptor machinery, so the trafficking
      defect surfaces as a fusion defect.

- name: Autophagosome-Lysosome Fusion Failure
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    The rate-limiting lesion, and the one measured directly in patient cells.
    Autophagosomes accumulate because they cannot fuse with lysosomes, and the cells
    respond abnormally to amino acid starvation - the stimulus that should drive autophagy
    hardest.

    Curating this as the central effector rather than as one consequence among several is
    a claim about direction: both arms below it are downstream of a single failure of
    degradative flux, which is what makes one variant produce two opposite-looking immune
    phenotypes.
  biological_processes:
  - preferred_term: autophagosome-lysosome fusion
    term:
      id: GO:0061909
      label: autophagosome-lysosome fusion
    modifier: DECREASED
  - preferred_term: autophagosome maturation
    term:
      id: GO:0097352
      label: autophagosome maturation
    modifier: DECREASED
  evidence:
  - reference: PMID:40936361
    reference_title: "A TOM1 variant impairs interaction with TOLLIP, autophagosome-lysosome fusion and regulation of innate immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our experiments using TOM1 G307D patient cells suggested that the variant affects
      autophagy, seen as an aggravated response to amino acid starvation and accumulation
      of autophagosomes due to autophagosome-lysosome fusion defect.
    explanation: >-
      The measurement this node rests on, in patient-derived cells rather than a model
      system.
  - reference: PMID:31263572
    reference_title: "Dominant TOM1 mutation associated with combined immunodeficiency and autoimmune disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Consistent with previous knowledge on TOM1 protein function, we detected impaired
      autophagy and enhanced susceptibility to apoptosis in patient-derived cells.
    explanation: >-
      Independent confirmation of impaired autophagy in patient cells, from the discovery
      study six years earlier, plus the apoptosis susceptibility that accompanies it.
  - reference: PMID:31263572
    reference_title: "Dominant TOM1 mutation associated with combined immunodeficiency and autoimmune disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TOM1 is an adaptor protein needed for the maturation of autophagosomes and their
      fusion with lysosomes.
    explanation: >-
      The normal function whose loss this node describes.
  downstream:
  - target: Excessive Inflammatory Pathway Activation
    causal_link_type: DIRECT
    description: >-
      Degradative flux terminates inflammatory signalling; when it fails, signalling
      persists. This is the autoimmune arm.
  - target: Impaired Lymphocyte Effector Function
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The immunodeficiency arm. Curated with unknown intermediates because the cited work
      establishes both the autophagy defect and the effector deficits in these patients
      but does not demonstrate the steps connecting them - which is exactly the part of
      this disease that is least understood.

- name: Excessive Inflammatory Pathway Activation
  role: consequence
  biological_scale: CELLULAR
  description: >-
    Inflammatory pathways are excessively activated in patient cells. TOM1 and TOLLIP both
    normally restrain interleukin-1 receptor and NF-kB signalling, so losing the
    interaction removes a brake rather than pressing an accelerator - the autoimmunity here
    is disinhibition, not stimulation.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:40936361
    reference_title: "A TOM1 variant impairs interaction with TOLLIP, autophagosome-lysosome fusion and regulation of innate immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In addition, inflammatory pathways showed excessive activation in TOM1 G307D patient
      cells.
    explanation: >-
      The direct measurement in patient cells.
  - reference: PMID:40936361
    reference_title: "A TOM1 variant impairs interaction with TOLLIP, autophagosome-lysosome fusion and regulation of innate immunity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Previous experiments in mice and in vitro have shown that both TOM1 and its binding
      partner TOLLIP regulate the interleukin-1 receptor (IL-1R) and nuclear factor kappa B
      (NF-κB) signaling pathways, key mediators of inflammation and innate immunity, and
      that ablating TOM1 enhances the overall proinflammatory milieu
    explanation: >-
      The prior work establishing that these adaptors restrain rather than drive
      inflammatory signalling, which is what licenses the disinhibition reading in this
      node's description.
  downstream:
  - target: Psoriasiform Dermatitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      One of the organ-specific autoimmune manifestations. Indirect because no cited work
      traces the pathway from the cellular inflammatory phenotype to skin.
  - target: Oligoarthritis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The presenting autoimmune feature in the index patient.
  - target: Interstitial Lung Disease
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The lung arm, which is also the arm that ultimately killed the more severely
      affected patient - after transplant, as pulmonary fibrosis.
  - target: Lymphocytic Interstitial Pneumonitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The specific form the lung disease took as it evolved in the severely affected
      patient. Curated separately from the general interstitial phenotype because only the
      son's disease is described as lymphocytic interstitial pneumonitis.
  - target: Autoimmune Enteropathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The gut arm, and the presenting manifestation in the severely affected patient at
      six months of age.
  - target: Chronic Diarrhea
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The clinical expression of the enteropathy.
  - target: Growth Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Curated as downstream of the inflammatory arm because it accompanied autoimmune
      enteropathy in the severely affected patient, but no cited source establishes the
      mechanism, and chronic inflammation and enteropathic malabsorption are not
      distinguished by anything curated here.

- name: Impaired Lymphocyte Effector Function
  role: consequence
  biological_scale: CELLULAR
  description: >-
    The immunodeficiency arm. T cells secrete IFN-gamma and IL-17 poorly, patient
    fibroblasts show diminished STAT and ERK1/2 signalling, and the patients are
    hypogammaglobulinaemic with low dendritic cell, natural killer cell and switched memory
    B cell counts.

    The signalling deficit is worth noting for what it is not: it was measured in
    fibroblasts, a non-immune lineage. That the same variant blunts signalling outside the
    haematopoietic compartment is a fact this entry treats as load-bearing rather than
    incidental, for the reason set out in the transplant discussion below.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  evidence:
  - reference: PMID:31263572
    reference_title: "Dominant TOM1 mutation associated with combined immunodeficiency and autoimmune disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In addition, we noted diminished STAT and ERK1/2 signaling in patient fibroblasts, as
      well as poor IFN-γ and IL-17 secretion in T cells.
    explanation: >-
      Both halves of this node, and the fibroblast observation the description flags.
  - reference: PMID:40936361
    reference_title: "A TOM1 variant impairs interaction with TOLLIP, autophagosome-lysosome fusion and regulation of innate immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Organ-specific symptoms were accompanied by hypogammaglobulinemia and low counts of
      dendritic, natural killer and switched memory B cells.
    explanation: >-
      The cellular and humoral deficits, which is what makes this a combined
      immunodeficiency rather than an isolated antibody defect.
  downstream:
  - target: Recurrent Respiratory Infections
    causal_link_type: DIRECT
    description: >-
      The clinical expression of the antibody and cellular deficit.
  - target: Hypogammaglobulinemia
    causal_link_type: DIRECT
    description: >-
      The laboratory expression of the same deficit.
  - target: Reduced Natural Killer Cell Count
    causal_link_type: DIRECT
    description: >-
      One of the three cell-population deficits reported in both patients.
  - target: Decreased Dendritic Cell Count
    causal_link_type: DIRECT
    description: >-
      A second population deficit, and the one that reaches furthest upstream of the
      others - dendritic cells prime the responses the other lineages carry out.
  - target: Decreased Class-Switched Memory B Cells
    causal_link_type: DIRECT
    description: >-
      The B-cell-compartment correlate of the antibody deficiency.
  - target: Impaired Regulatory T Cell Function
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      A regulatory rather than effector deficit, curated on this node because the source
      attributes it to the same MAPK and JAK-STAT signalling lesion. The known intermediate
      is that signalling defect; the edge is not direct.
  - target: Persistent EBV Viremia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Failure to clear a virus whose control depends on the T and NK compartments this node
      describes. Marked with unknown intermediates because no cited work tests that link in
      these patients.

phenotypes:

- category: Immunological
  name: Recurrent Respiratory Infections
  description: >-
    The presenting infectious susceptibility, from early teens in the index patient.
  phenotype_term:
    preferred_term: Recurrent respiratory infections
    term:
      id: HP:0002205
      label: Recurrent respiratory infections
  evidence:
  - reference: PMID:31263572
    reference_title: "Dominant TOM1 mutation associated with combined immunodeficiency and autoimmune disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The index patient suffered from recurrent respiratory tract infections and
      oligoarthritis since early teens, and later developed persistent low-copy EBV-viremia,
      as well as an antibody deficiency.
    explanation: >-
      The index patient's course, naming this phenotype alongside the arthritis and the
      antibody deficiency.

- category: Immunological
  name: Hypogammaglobulinemia
  description: >-
    Low immunoglobulin in both patients. In the index case IgG was 3.0 g/l with IgA 0.15
    and IgM 0.17 at age 16; immunoglobulin replacement was started, stopped for adverse
    effects, and later restarted subcutaneously.
  phenotype_term:
    preferred_term: Decreased circulating immunoglobulin concentration
    term:
      id: HP:0004313
      label: Decreased circulating immunoglobulin concentration
  evidence:
  - reference: PMID:40936361
    reference_title: "A TOM1 variant impairs interaction with TOLLIP, autophagosome-lysosome fusion and regulation of innate immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Organ-specific symptoms were accompanied by hypogammaglobulinemia and low counts of
      dendritic, natural killer and switched memory B cells.
    explanation: >-
      The phenotype in both patients, with the accompanying cellular deficits.

- category: Musculoskeletal
  name: Oligoarthritis
  description: >-
    Seronegative oligoarthritis, diagnosed at 16 in the index patient. Seronegativity is
    worth recording: the autoimmunity here is not defined by a classical autoantibody.
  phenotype_term:
    preferred_term: Oligoarthritis
    term:
      id: HP:0040313
      label: Oligoarthritis
  evidence:
  - reference: PMID:31263572
    reference_title: "Dominant TOM1 mutation associated with combined immunodeficiency and autoimmune disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The index patient suffered from recurrent respiratory tract infections and
      oligoarthritis since early teens, and later developed persistent low-copy EBV-viremia,
      as well as an antibody deficiency.
    explanation: >-
      Names the arthritis and its onset.

- category: Dermatological
  name: Psoriasiform Dermatitis
  description: >-
    Treatment-resistant psoriasis vulgaris in the severely affected patient. The
    treatment-resistance is the notable part and recurs across this disease's
    manifestations.
  phenotype_term:
    preferred_term: Psoriasiform dermatitis
    term:
      id: HP:0003765
      label: Psoriasiform dermatitis
  evidence:
  - reference: PMID:31263572
    reference_title: "Dominant TOM1 mutation associated with combined immunodeficiency and autoimmune disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Her infant son developed hypogammaglobulinemia, autoimmune enteropathy, interstitial
      lung disease, profound growth failure, and treatment-resistant psoriasis vulgaris.

genetic:

- name: TOM1
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: TOM1
    term:
      id: hgnc:11982
      label: TOM1
  association: >-
    A heterozygous missense variant, p.Gly307Asp, in the GAT domain. Typed CAUSATIVE
    because OMIM has assigned the phenotype a number (619510) and the 2025 functional work
    resolves the variant's effect to a specific molecular step, but the caveat belongs in
    the same breath: the evidence is two related patients from one family, and the
    discovery paper says in its own abstract that unrelated cases are needed before the
    genotype-phenotype relationship is firm. See the knowledge gap below.
  evidence:
  - reference: PMID:31263572
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In sum, we report here an identification of a novel gene, TOM1, associating with
      early-onset autoimmunity, antibody deficiency, and features of combined
      immunodeficiency.
    explanation: >-
      The gene-disease claim, quoted in the source's own careful register - "associating
      with" rather than "causing".
  - reference: PMID:31263572
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other patient cases from unrelated families are needed to firmly establish a causal
      relationship between the genotype and the phenotype.
    explanation: >-
      PARTIAL because it is the source qualifying its own gene-disease claim. Curated here
      rather than only in notes, so the limitation travels with the gene entry.

inheritance:

- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A heterozygous variant transmitted from an affected mother to an affected son. The
    marked difference in severity between them - relatively mild disease in the mother,
    aggressive and fatal in the child - is what the discovery paper reads as evidence for
    additional genetic modifiers, and it means severity cannot be predicted from genotype
    in this disease.
  evidence:
  - reference: PMID:31263572
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinically, the index patient presents with a relatively mild disease, whereas in the
      child the condition is aggressive and fatal.
    explanation: >-
      The intrafamilial severity difference on which the modifier reading rests.

treatments:

- name: Hematopoietic Stem Cell Transplantation
  description: >-
    Attempted in the severely affected patient after several immunomodulating drugs failed.
    He died six months after transplant, of lung fibrosis.

    Curated because a failed treatment is a finding, not an absence of one. The 2025 paper
    frames its own contribution partly in these terms - as insight into the caveats of
    immunomodulatory and stem cell therapy in this disease - and an entry that listed HSCT
    without its outcome would mislead in the direction that matters most.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:40936361
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Attempts to alleviate the severe autoimmunity with several immunomodulating drugs
      failed, and the younger patient, with a more severe phenotype, underwent
      hematopoietic stem cell transplantation (HSCT) but died 6 months post-HSCT owing to
      lung fibrosis.
    explanation: >-
      REFUTE because this is evidence against the treatment in this disease, in the only
      patient in whom it has been reported. It also records the failure of
      immunomodulation that preceded it.
  - reference: PMID:40936361
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Our study also provides insights into the caveats of immunomodulatory and stem cell
      therapies in patients with TOM1 pathogenic variants.
    explanation: >-
      The authors' own framing of the therapeutic implication, which is why this treatment
      is curated with its caveat rather than omitted.

discussions:

- discussion_id: gap_single_family_causality
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is TOM1 p.Gly307Asp causative of this syndrome, or is it a rare variant that
    co-segregated with the phenotype in one family?
  attaches_to:
  - genetic#TOM1
  - pathophysiology#TOM1 GAT-Domain Variant and Loss of TOLLIP Interaction
  rationale: >-
    Everything in this entry rests on two related patients. The discovery paper states the
    limitation itself, and no unrelated family has been reported since - the 2025 follow-up
    studies the same variant in the same patients' cells rather than adding cases.

    What the functional work does and does not settle is worth separating. It establishes
    that p.Gly307Asp has a specific, reproducible molecular effect: loss of the TOLLIP
    interaction, failure to restrain TOLLIP phosphoinositide binding, autophagosome
    accumulation, excess inflammatory signalling. That is strong evidence the variant does
    something. It is weaker evidence that what it does is this disease, because a mother
    and son share far more than one variant, and the severity difference between them is
    itself attributed to unidentified modifiers.

    The practical consequence is for diagnosis rather than mechanism: a TOM1 variant found
    in a patient with immune dysregulation cannot currently be interpreted against a case
    series, because there is none.
  proposed_experiments:
  - experiment_id: unrelated_tom1_cohort
    name: Targeted TOM1 screening in unexplained combined immunodeficiency with autoimmunity
    description: >-
      Screen TOM1 in existing cohorts of genetically unsolved inborn errors of immunity
      presenting with combined immunodeficiency and early-onset autoimmunity, and
      functionally test any GAT-domain variants for the TOLLIP-interaction defect that
      characterises p.Gly307Asp. A second unrelated family with a concordant functional
      phenotype would settle this; continued absence across large cohorts would argue the
      other way.

- discussion_id: gap_why_hsct_failed
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why did haematopoietic stem cell transplantation fail, and is the non-haematopoietic
    compartment the reason?
  attaches_to:
  - treatments#Hematopoietic Stem Cell Transplantation
  - pathophysiology#Impaired Lymphocyte Effector Function and Antibody Production
  rationale: >-
    HSCT replaces the haematopoietic compartment and nothing else. It is the standard
    curative approach for inborn errors of immunity precisely because most of them are
    diseases of haematopoietic lineages.

    Two facts curated here sit awkwardly with that. TOM1 is a ubiquitous trafficking
    adaptor rather than an immune-restricted gene, and the signalling deficit in these
    patients was demonstrated in fibroblasts - a non-haematopoietic lineage that a
    transplant does not replace. The patient died of lung fibrosis, in an organ that had
    been affected before transplant.

    A tissue-autonomous non-haematopoietic contribution would explain all of that, and it
    would predict that transplant cannot be curative in this disease. But nothing cited
    here establishes it: post-transplant fibrosis is a recognised complication in its own
    right, one patient is not a series, and the fibroblast finding shows the variant acts
    outside blood without showing that the lung disease is cell-autonomous. The
    possibilities are not distinguished by the evidence, and the entry does not pick one.
  proposed_experiments:
  - experiment_id: tom1_lineage_restricted_models
    name: Lineage-restricted TOM1 models to separate haematopoietic from stromal contribution
    description: >-
      Generate haematopoietic-restricted and mesenchymal-restricted TOM1 G307D models and
      compare lung and gut pathology, to test whether disease in those organs requires the
      variant in the resident tissue or is driven entirely by transplantable immune cells.
      A stromal requirement would explain the transplant outcome and change the therapeutic
      target.

notes: >-
  Scope and naming. This entry curates the OMIM 619510 / MONDO:0030428 entity, which is
  defined by TOM1 p.Gly307Asp in one family. The numbered IMD name is an OMIM
  serialisation rather than a clinical term, so the entry leads with the mechanism.

  Why the two arms are curated from one effector. Immunodeficiency and autoimmunity in the
  same patient is common enough in inborn errors of immunity to have its own literature,
  but the usual explanation runs through a lymphocyte-intrinsic pathway - FOXP3, the STATs,
  actin regulators. Here the shared upstream lesion is a housekeeping trafficking function,
  and the entry curates a single central effector with two downstream arms rather than two
  parallel chains, because the sources locate both in degradative flux. That is a
  structural claim and it could be wrong; the edge to the immunodeficiency arm is marked
  INDIRECT_UNKNOWN_INTERMEDIATES precisely because the connecting steps are not shown.

  No GeneReviews baseline. A PubMed All Fields search for GeneReviews coverage returned
  chapters on Temple syndrome, GLI3-related Pallister-Hall syndrome, sepiapterin reductase
  deficiency and AIP familial isolated pituitary adenomas - none of them this disease. No
  chapter exists, which is expected for a disorder described in one family in 2019.

  Evidence tiers. The clinical description is HUMAN_CLINICAL from two patients. The
  mechanism is IN_VITRO throughout, in patient-derived cells rather than a model organism -
  which is a strength for relevance and a limit on generalisability, since the cells all
  come from the same two people. The prior TOM1/TOLLIP regulatory work cited on the
  inflammatory node is tagged OTHER because it is review framing of mouse and in vitro work
  rather than a measurement in these patients.

  The treatment is curated as a failure. HSCT appears with supports: REFUTE, which is not a
  statement that transplant is contraindicated in inborn errors of immunity generally - it
  is the outcome in the single reported case in this disease. An entry that recorded the
  attempt without the outcome would be worse than one that omitted it.

references:
- reference: PMID:31263572
  title: "Dominant TOM1 mutation associated with combined immunodeficiency and autoimmune disease."
- reference: PMID:40936361
  title: "A TOM1 variant impairs interaction with TOLLIP, autophagosome-lysosome fusion and regulation of innate immunity."

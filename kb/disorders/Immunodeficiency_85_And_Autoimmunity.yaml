treatments:

- name: mTOR Inhibitor Therapy
  description: >-
    Everolimus was given to the severely affected patient on an explicit mechanistic
    rationale: rapalogs induce autophagy, and this is a disease of impaired autophagy. It
    made him worse, with flares of eczema and respiratory distress that settled once the
    drug was stopped.

    The 2025 work supplies the reason, and it turns the failure into a mechanistic result
    rather than an idiosyncratic reaction. The block in this disease is at
    autophagosome-lysosome *fusion*, not at autophagosome *formation*. An mTOR inhibitor
    pushes harder on formation, upstream of a step that cannot clear, so autophagosomes
    accumulate further and flux does not improve. The corresponding in vitro observation is
    that rapamycin failed to raise autophagosome numbers in patient lymphocytes at all.

    The authors state the clinical implication as caution rather than contraindication, and
    this entry does not strengthen it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: everolimus
      term:
        id: CHEBI:68478
        label: everolimus
  target_mechanisms:
  - target: Autophagosome-Lysosome Fusion Failure
    treatment_effect: MODULATES
    description: >-
      MODULATES rather than ACTIVATES or RESTORES, deliberately. The drug does not act on
      fusion; it acts on autophagy induction upstream of the fusion block, and the observed
      consequence at this node was aggravation rather than correction. Curating it as
      ACTIVATES would assert a therapeutic effect on this node that the sources say did not
      occur.
    evidence:
    - reference: PMID:40936361
      reference_title: "A TOM1 variant impairs interaction with TOLLIP, autophagosome-lysosome fusion and regulation of innate immunity."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        it is reasonable to assume that treatment with an mTOR inhibitor led to the
        exacerbation of symptoms by further increasing autophagosome formation without
        alleviating the defect in autophagosome-lysosome fusion and thus aggravating
        accumulation of autophagosomes
      explanation: >-
        The mechanistic link between the drug and this node, in the authors' own hedged
        register - "it is reasonable to assume", which is why this is a proposed
        explanation rather than a measured drug effect. Tagged OTHER for that reason.
  evidence:
  - reference: PMID:31263572
    reference_title: "Dominant TOM1 mutation associated with combined immunodeficiency and autoimmune disease."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rapamycin and other rapalogs are potent inducers of autophagy, and in an attempt to
      control autoimmunity we treated patient 2 with everolimus. Contrary to our
      expectations, this led to flares of eczema and respiratory distress, symptoms that
      quickly stabilized once the drug was stopped.
    explanation: >-
      REFUTE because it is evidence against the treatment in this disease. The rationale,
      the outcome, and the dechallenge are all in one sentence, which is what makes the
      harm attributable to the drug rather than to the disease course.
  - reference: PMID:31263572
    reference_title: "Dominant TOM1 mutation associated with combined immunodeficiency and autoimmune disease."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      In vitro, rapamycin treatment on patient lymphocytes failed to increase the number of
      autophagosomes
    explanation: >-
      The corresponding negative result in patient cells: the drug did not do the thing it
      was given to do.
  - reference: PMID:40936361
    reference_title: "A TOM1 variant impairs interaction with TOLLIP, autophagosome-lysosome fusion and regulation of innate immunity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      our data suggesting a disturbance in autophagosome-lysosome fusion warrants caution
      in using mTOR inhibitors in the treatment of patients with TOM1 variants
    explanation: >-
      The authors' own statement of the clinical implication, at the strength they state
      it - caution, not contraindication.

- name: Proposed Targeted Immunomodulation (IL-1 Antagonism or JAK Inhibition)
  description: >-
    Suggested by the 2025 authors on the strength of the mechanism they describe: the
    inflammatory arm of this disease runs through IL-1 receptor and NF-kB signalling that
    TOM1 and TOLLIP normally restrain, and the signalling deficits measured in patient
    cells involve the JAK-STAT pathway.

    No patient has received either. This entry curates the proposal, not a treatment
    effect, and the distinction matters more than usual here: the last mechanistically
    reasoned therapy in this disease made the patient worse.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: interleukin-1 beta antagonist
    - preferred_term: JAK inhibitor
      term:
        id: NCIT:C172200
        label: JAK Inhibitor
  evidence:
  - reference: PMID:40936361
    reference_title: "A TOM1 variant impairs interaction with TOLLIP, autophagosome-lysosome fusion and regulation of innate immunity."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      With our current understanding of the TOM1 G307D variant, either IL-1β antagonists or
      JAK inhibitors could be potential treatment options.
    explanation: >-
      PARTIAL because the source supports these being candidate options and nothing more -
      there is no administration, no outcome, and no trial. Tagged OTHER because it is an
      author inference from mechanism rather than clinical or experimental evidence.

- name: Hematopoietic Stem Cell Transplantation
  description: >-
    Attempted in the severely affected patient after several immunomodulating drugs failed.
    He rejected the allograft within six months, the disease returned, and he died of
    progressive pulmonary fibrosis.

    The two sources give different intervals for the death and the entry does not silently
    pick one. The 2019 discovery paper, which describes the clinical course in detail, says
    he died one year after the transplant; the 2025 paper says six months post-HSCT. Both
    are quoted below.

    Curated because a failed treatment is a finding, not an absence of one. The 2025 paper
    frames its own contribution partly in these terms - as insight into the caveats of
    immunomodulatory and stem cell therapy in this disease - and an entry that listed HSCT
    without its outcome would mislead in the direction that matters most.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:40936361
    reference_title: "A TOM1 variant impairs interaction with TOLLIP, autophagosome-lysosome fusion and regulation of innate immunity."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Attempts to alleviate the severe autoimmunity with several immunomodulating drugs
      failed, and the younger patient, with a more severe phenotype, underwent
      hematopoietic stem cell transplantation (HSCT) but died 6 months post-HSCT owing to
      lung fibrosis.
    explanation: >-
      REFUTE because this is evidence against the treatment in this disease, in the only
      patient in whom it has been reported. It also records the failure of
      immunomodulation that preceded it.
  - reference: PMID:40936361
    reference_title: "A TOM1 variant impairs interaction with TOLLIP, autophagosome-lysosome fusion and regulation of innate immunity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Our study also provides insights into the caveats of immunomodulatory and stem cell
      therapies in patients with TOM1 pathogenic variants.
    explanation: >-
      The authors' own framing of the therapeutic implication, which is why this treatment
      is curated with its caveat rather than omitted.
  - reference: PMID:31263572
    reference_title: "Dominant TOM1 mutation associated with combined immunodeficiency and autoimmune disease."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      recently underwent allogeneic stem cell transplant, with a temporary resolution of
      autoimmune symptoms. Within 6 months, however, he rejected the allograft and the
      disease returned. He died one year after the transplant for progressive pulmonary
      fibrosis.
    explanation: >-
      The discovery paper's account of the same transplant, and the only source that
      records graft rejection. It also gives a different interval to death - one year,
      against the 2025 paper's six months - which is why the description names both.

- name: Immunoglobulin Replacement Therapy
  description: >-
    Both patients received immunoglobulin replacement for the antibody deficiency. In the
    index patient the intravenous route was started at diagnosis and discontinued for
    adverse effects, and she is now on the subcutaneous route; her son received it from

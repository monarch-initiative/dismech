    Curated as supportive rather than disease-modifying: it replaces the product of the
    failing compartment and does not act on any mechanism node, so it carries no
    target_mechanisms.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:

discussions:
- discussion_id: ame_renal_calcification_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which mechanisms produce nephrocalcinosis and chronic renal injury in AME?
  attaches_to:
  - phenotypes#Nephrocalcinosis
  - phenotypes#Renal insufficiency
  - pathophysiology#Renal Potassium Wasting
  rationale: Chronic hypokalemia, urinary calcium handling and renal injury are proposed contributors, but nephrocalcinosis can occur without documented hypercalciuria and may persist after potassium correction. The Chinese case series speculates about fibrosis without biopsy evidence. No necessary hypercalciuria-to-fibrosis-to-calcification chain is established.
  evidence:
  - reference: PMID:38652803
    reference_title: 'Apparent mineralocorticoid excess in Israel: a case series and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: While all patients developed nephrocalcinosis, only 1 showed hypercalciuria.
    explanation: Observed discordance limits a universal hypercalciuria-mediated route.
  - reference: PMID:29229831
    reference_title: Clinical, genetic, and structural basis of apparent mineralocorticoid excess due to 11β-hydroxysteroid dehydrogenase type 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Another notable clinical feature was nephrocalcinosis, which persisted in eight of nine patients at 4.1–14.5 y follow-up, despite treatment of hypokalemia.
    explanation: Persistence limits inference that potassium normalization necessarily reverses calcification.
- discussion_id: ame_variable_genotype_and_treatment_outcomes
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How do residual enzyme function and clinical context predict long-term treatment response?
  attaches_to:
  - genetic#HSD11B2
  - pathophysiology#Reduced 11-Beta-HSD2 Activity
  - treatments#Mineralocorticoid receptor antagonists
  rationale: Milder residual-function alleles, delayed recognition, different co-treatments and treatment-associated hyperkalemia complicate prediction from genotype or initial blood-pressure response. Computational structural interpretation is not a validated prognostic assay. Prospective natural-history data with standardized measurements are needed.
  evidence:
  - reference: PMID:38652803
    reference_title: 'Apparent mineralocorticoid excess in Israel: a case series and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Nevertheless, despite early diagnosis and management, AME is commonly associated with serious complications of the disease or its treatment.
    explanation: Longitudinal observations show remaining outcome uncertainty.
  - *id020
- discussion_id: ame_nonclassic_construct_scope
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How does the proposed nonclassic AME construct overlap with milder biallelic HSD11B2 disease?
  attaches_to:
  - genetic#HSD11B2
  - pathophysiology#Reduced 11-Beta-HSD2 Activity
  rationale: The 2020 review describes a broader partial-enzyme-deficiency construct involving genetic, epigenetic, environmental and inhibitor effects. This should not automatically be equated with genetically confirmed mild recessive AME. Its 7.1% estimate comes from a particular screening population and is not the prevalence of biallelic HSD11B2 disease. The screening construct used high serum cortisol/cortisone together with low cortisone in a selected Chilean population including normotensive and hypertensive people. Renin-guided outcome benefit is extrapolated from primary aldosteronism, not demonstrated prospectively in nonclassic AME.
  evidence:
  - reference: PMID:31909799
    reference_title: Classic and Nonclassic Apparent Mineralocorticoid Excess Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Nonclassic AME (NC-AME) is mainly related to partial 11βHSD2 deficiency associated with genetic variations and epigenetic modifications (first hit) and potential additive actions of endogenous or exogenous inhibitors (ie, glycyrrhetinic acid-like factors [GALFS]) and other factors (ie, age, high sodium intake) (second hit).
    explanation: The review defines a broader proposed multifactorial construct, distinct from a confirmed biallelic genotype series.
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/5691192
    reference_title: https://oup.silverchair-cdn.com/article-minimal/5691192
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: identified 9 subjects with suggestive NC-AME phenotype, of whom 2 had the previously described heterozygous pathogenic variant R213C (p.Arg213Cys), which impairs the activity and stability of 11βHSD2
    explanation: The screened phenotype is suggestive and does not constitute nine molecularly confirmed recessive cases.
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/5691192
    reference_title: https://oup.silverchair-cdn.com/article-minimal/5691192
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Despite that there is no prospective data in NC-AME, inference from PA studies support the concept of improved renin levels as a proxy of MR inactivation
    explanation: The review explicitly identifies absent prospective evidence and extrapolation from primary aldosteronism.

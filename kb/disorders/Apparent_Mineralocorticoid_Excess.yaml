  evidence:
  - reference: PMID:36329487
    reference_title: "Apparent mineralocorticoid excess: comprehensive overview of molecular genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is caused by defects in the HSD11B2 gene, encoding the enzyme 11β-hydroxysteroid dehydrogenase type 2 (11β-HSD2), which is primarily involved in the peripheral conversion of cortisol to cortisone.
    explanation: >-
      Directly supports HSD11B2/11-beta-HSD2 as the deficient enzyme catalyzing
      cortisol-to-cortisone conversion.
  - reference: PMID:15761540
    reference_title: "Apparent mineralocorticoid excess syndrome: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This enzyme is co-expressed with the mineralocorticoid receptor (MR) in the kidney and converts cortisol (F) to its inactive metabolite cortisone (E).
    explanation: >-
      Confirms renal co-expression of 11-beta-HSD2 with the mineralocorticoid
      receptor and its role converting cortisol to cortisone.
  downstream:
  - target: Cortisol-mediated mineralocorticoid receptor activation
    description: >-
      Accumulating cortisol binds and illicitly activates the mineralocorticoid
      receptor in the distal nephron.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15761540
      reference_title: "Apparent mineralocorticoid excess syndrome: an overview."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Its deficiency allows the unmetabolized cortisol to bind to the MR inducing sodium retention, hypokalemia, suppression of PRA and hypertension.
      explanation: >-
        Directly links loss of 11-beta-HSD2 to cortisol binding the
        mineralocorticoid receptor.
- name: Cortisol-mediated mineralocorticoid receptor activation
  description: >-
    Because the mineralocorticoid receptor binds cortisol and aldosterone with
    similar affinity, unmetabolized cortisol illicitly activates the receptor,
    reproducing a mineralocorticoid-excess state despite suppressed aldosterone.
  evidence:
  - reference: PMID:31909799
    reference_title: "Classic and Nonclassic Apparent Mineralocorticoid Excess Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subtypes of essential hypertension characterized by low renin levels allowed the identification of 2 different clinical entities: aldosterone-mediated mineralocorticoid receptor (MR) activation and cortisol-mediated MR activation.
    explanation: >-
      Identifies cortisol-mediated mineralocorticoid receptor activation as the
      mechanism distinguishing AME from aldosterone-driven hypertension.
  downstream:

  phase: NOT_APPLICABLE
  status: COMPLETED
  description: Completed observational natural-history and genetics protocol for AME and family members, rather than an interventional drug trial. The official registry lists 130 total enrolled participants including relatives; it does not establish 130 affected patients or treatment efficacy.
  notes: Official full registry JSON was read on 2026-09-21. Actual completion was in November 2013, with a December 2015 last update and no posted results. Prospective observational, nonprobability sampling limits generalization.

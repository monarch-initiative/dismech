progression:
- phase: Early severe or later milder presentation
  notes: Classic disease often presents in infancy or childhood with growth impairment and low-renin hypertension. In the selected 36-person cohort, median diagnosis age was 4.6 years, with range 0.1–15. Residual-function biallelic disease can be recognized in adulthood. This clinical continuum should not be conflated with every proposed multifactorial nonclassic low-renin hypertensive phenotype.
  evidence:
  - reference: PMID:29229831
    reference_title: Clinical, genetic, and structural basis of apparent mineralocorticoid excess due to 11β-hydroxysteroid dehydrogenase type 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'The median age of AME diagnosis was 4.6 y (range: 0.1–15) and the cohort was distributed equally for either sex.'
    explanation: Selected cohort age at diagnosis, not a universal onset interval.
  - reference: PMID:9683587
    reference_title: Molecular basis for hypertension in the "type II variant" of apparent mineralocorticoid excess.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: AME represents a spectrum of mineralocorticoid hypertension with severity reflecting the underlying genetic defect in the 11beta-HSD2 gene; classification into distinct subtypes is inappropriate.
    explanation: The family study argues for variable severity within inherited AME.
- phase: Long-term target-organ complications
  notes: The 2017 report follows a previously published severe subgroup rather than all 36 patients uniformly. It describes three cardiac deaths, persistent hypertrophy in 12/13 imaged survivors, persistent nephrocalcinosis in 8/9 assessed patients and four cases of renal insufficiency more than ten years after diagnosis. Treatment response and prognosis vary; a later seven-patient series also records serious disease and treatment complications despite early diagnosis.
  evidence:
  - reference: PMID:29229831
    reference_title: Clinical, genetic, and structural basis of apparent mineralocorticoid excess due to 11β-hydroxysteroid dehydrogenase type 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Of the 16 patients we have reported preliminarily (6, 8, 27–29), follow-up data were available on 8 males and 6 females (6–26 y of age).
    explanation: Defines the available follow-up population.
  - reference: PMID:29229831
    reference_title: Clinical, genetic, and structural basis of apparent mineralocorticoid excess due to 11β-hydroxysteroid dehydrogenase type 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Another notable clinical feature was nephrocalcinosis, which persisted in eight of nine patients at 4.1–14.5 y follow-up, despite treatment of hypokalemia.
    explanation: Persistence is reported in a selected imaging subset.
  - reference: PMID:38652803
    reference_title: 'Apparent mineralocorticoid excess in Israel: a case series and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Nevertheless, despite early diagnosis and management, AME is commonly associated with serious complications of the disease or its treatment.
    explanation: The cohort does not support guaranteed prevention by early care.
- phase: Pregnancy in affected adults
  notes: Three women conceived spontaneously in the historical cohort; outcomes ranged from term deliveries to severe hypertension, renal deterioration or early preeclampsia with a nonviable fetus. This small series supports individualized specialist planning and monitoring, without estimating pregnancy risk or proving comparative safety of a drug regimen.

    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: HSD2 inhibitors such as licorice and azole antifun - gals results in MR induced hypertension; thus, taking a detailed personal and pharmacological history is benefi - cial when identifying acquired forms of AME [21–23].
    explanation: The review describes acquired inhibitors producing a similar phenotype.
- name: Other monogenic low-renin hypertensive disorders
  description: Liddle syndrome and glucocorticoid-resistance syndromes can overlap clinically. Hormone and steroid profiles, exposure history and gene-specific findings distinguish the cause; low renin alone is not specific for AME.
  evidence:
  - reference: PMID:36329487
    reference_title: 'Apparent mineralocorticoid excess: comprehensive overview of molecular genetics.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Traditional laboratory evalua - tion findings have been shown to be ambiguous in terms of ruling out other monogenic disorders with similar clinical and hormonal patterns, such as Liddle syndrome, Batter syndrome and primary glucocorticoid resistance [10, 74, 75].
    explanation: The review explicitly notes overlapping clinical and hormonal patterns.

name: apparent mineralocorticoid excess
creation_date: "2026-07-24T00:00:00Z"
description: >-
  Apparent mineralocorticoid excess is a rare autosomal recessive form of
  monogenic low-renin hypertension caused by biallelic loss-of-function variants
  in HSD11B2. Deficiency of renal 11-beta-hydroxysteroid dehydrogenase type 2
  allows cortisol to escape inactivation to cortisone and illicitly activate the
  mineralocorticoid receptor, producing severe early-onset hypertension,
  hypokalemic metabolic alkalosis, suppressed renin and aldosterone, and an
  elevated urinary cortisol-to-cortisone metabolite ratio.
category: Mendelian
parents:
- hereditary disease

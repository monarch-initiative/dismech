differential_diagnoses:
- name: Acquired impairment of cortisol inactivation
  description: Licorice and some azole antifungals can inhibit 11-beta-HSD2 and cause an AME-like low-renin phenotype without biallelic inherited HSD11B2 disease. Review exposures before attributing an abnormal steroid profile to a Mendelian disorder.
  evidence:

    reference_title: 'Apparent mineralocorticoid excess: comprehensive overview of molecular genetics.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: patients with AME have normal serum cortisol concentration and don’t present with clin- ical features of Cushing’s syndrome or Addison’s disease
    explanation: Normal circulating cortisol is compatible with inherited AME.
genetic:
- name: HSD11B2
  gene_term:
    preferred_term: HSD11B2
    term:
      id: hgnc:5209
      label: HSD11B2
  relationship_type: CAUSATIVE
  notes: Biallelic pathogenic variants include missense, truncating, splice and insertion/deletion alleles. Homozygous and compound-heterozygous genotypes occur; residual-function variants can produce milder disease. In the 2025 three-child series, p.Val217Ala remained a VUS with no new enzyme assay, while the other two children carried variants classified likely pathogenic. The 2026 child carried homozygous p.Arg208Cys; a single heterozygous UBE3B variant was incidental. Structural proposals in the 2017 study derive from homology modeling and molecular dynamics, not direct measurements of each patient variant. Genotype alone does not provide a validated individual severity prediction.
  evidence:
  - reference: PMID:36329487
    reference_title: 'Apparent mineralocorticoid excess: comprehensive overview of molecular genetics.'

name: apparent mineralocorticoid excess
creation_date: '2026-07-24T00:00:00Z'
description: Apparent mineralocorticoid excess (AME) is an autosomal recessive disorder caused by biallelic pathogenic HSD11B2 variants. Reduced 11-beta-HSD2 activity impairs cortisol inactivation at renal mineralocorticoid receptors, producing salt-sensitive low-renin hypertension with variably severe hypokalemic alkalosis and low aldosterone. Circulating cortisol can remain normal. Early growth impairment, nephrocalcinosis and cardiovascular or renal complications characterize many severe cases; residual-function alleles can cause milder, later presentations.
category: Mendelian
parents:
- hereditary disease
disease_term:
  preferred_term: apparent mineralocorticoid excess
  term:
    id: MONDO:0009025
    label: apparent mineralocorticoid excess
synonyms:
- AME
- apparent mineralocorticoid excess syndrome
- 11-beta-hydroxysteroid dehydrogenase type 2 deficiency
- cortisol 11-beta-ketoreductase deficiency
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: Inherited AME is autosomal recessive. Consanguinity is common in selected reported cohorts but is not required; confirmed compound-heterozygous cases occur in unrelated parents. Clinical severity varies with residual function and other influences.
  evidence:
  - reference: PMID:36329487
    reference_title: 'Apparent mineralocorticoid excess: comprehensive overview of molecular genetics.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Apparent mineralocorticoid excess is an autosomal recessive form of monogenic disease characterized by juvenile resistant low-renin hypertension, marked hypokalemic alkalosis, low aldosterone levels, and high ratios of cortisol to cortisone metabolites.
    explanation: This molecular-genetics review states that AME is an autosomal recessive monogenic disease.
    quote_role: REVIEW_SYNTHESIS
pathophysiology:
- name: Biallelic HSD11B2 Dysfunction
  biological_scale: MOLECULAR
  description: Inherited pathogenic variants in both HSD11B2 alleles impair enzyme function. Missense, truncating and other variants can differ in their residual function; a reported variant of uncertain significance does not become established pathogenic merely because a patient has a compatible phenotype.
  evidence:
  - reference: PMID:36329487
    reference_title: 'Apparent mineralocorticoid excess: comprehensive overview of molecular genetics.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: It is caused by defects in the HSD11B2 gene, encoding the enzyme 11β-hydroxysteroid dehydrogenase type 2 (11β-HSD2)
    explanation: The review identifies the causal gene and encoded enzyme.
  genes:

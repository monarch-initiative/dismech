name: apparent mineralocorticoid excess
creation_date: "2026-07-24T00:00:00Z"
updated_date: "2026-07-24T00:00:00Z"
description: >-
  Apparent mineralocorticoid excess is a rare autosomal recessive form of
  monogenic low-renin hypertension caused by biallelic loss-of-function variants
  in HSD11B2. Deficiency of renal 11-beta-hydroxysteroid dehydrogenase type 2
  allows cortisol to escape inactivation to cortisone and illicitly activate the
  mineralocorticoid receptor, producing severe early-onset hypertension,
  hypokalemia, metabolic alkalosis, and suppressed renin and aldosterone.
category: Mendelian
parents:
- hereditary disease
disease_term:
  preferred_term: apparent mineralocorticoid excess
  term:
    id: MONDO:0009025
    label: apparent mineralocorticoid excess
synonyms:
- AME
- cortisol 11-beta-ketoreductase deficiency
- 11-beta-hydroxysteroid dehydrogenase deficiency
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Apparent mineralocorticoid excess is caused by biallelic loss-of-function
    variants in HSD11B2 and follows autosomal recessive inheritance.
pathophysiology:
- name: 11-beta-HSD2 deficiency and cortisol-mediated mineralocorticoid receptor activation
  description: >-
    Loss of 11-beta-hydroxysteroid dehydrogenase type 2 activity in
    mineralocorticoid target tissues fails to inactivate cortisol to cortisone.
    Locally accumulating cortisol, which binds the mineralocorticoid receptor
    with affinity similar to aldosterone, illicitly activates the receptor in the
    distal nephron.
  genes:
  - preferred_term: HSD11B2
    term:
      id: hgnc:5209
      label: HSD11B2
  biological_processes:
  - preferred_term: glucocorticoid metabolic process
    term:
      id: GO:0008211
      label: glucocorticoid metabolic process
    modifier: DECREASED
  molecular_functions:
  - preferred_term: 11-beta-hydroxysteroid dehydrogenase (NAD+) activity
    term:
      id: GO:0070524
      label: 11-beta-hydroxysteroid dehydrogenase (NAD+) activity
    modifier: DECREASED
  chemical_entities:
  - preferred_term: cortisol
    term:
      id: CHEBI:17650
      label: cortisol
    modifier: INCREASED
  - preferred_term: cortisone
    term:
      id: CHEBI:16962
      label: cortisone
    modifier: DECREASED
  downstream:
  - target: Distal nephron sodium retention and volume expansion
    description: >-
      Cortisol-driven mineralocorticoid receptor activation increases epithelial
      sodium channel activity, causing sodium and water retention.
    causal_link_type: DIRECT
- name: Sodium retention, volume expansion, and hypertension
  description: >-
    Illicit mineralocorticoid receptor activation increases distal nephron sodium
    reabsorption, expanding extracellular volume and raising blood pressure while
    driving renal potassium and hydrogen ion loss.
  biological_processes:
  - preferred_term: sodium ion transport
    term:
      id: GO:0006814
      label: sodium ion transport
    modifier: INCREASED
  downstream:
  - target: Hypertension
    description: Volume expansion from sodium retention causes severe hypertension.
    causal_link_type: DIRECT
  - target: Hypokalemia
    description: Enhanced distal potassium secretion causes hypokalemia.
    causal_link_type: DIRECT
  - target: Metabolic alkalosis
    description: Enhanced distal hydrogen ion secretion causes metabolic alkalosis.
    causal_link_type: DIRECT
  - target: Suppressed renin and aldosterone
    description: >-
      Volume expansion and hypertension suppress the renin-angiotensin-aldosterone
      axis.
    causal_link_type: DIRECT
phenotypes:
- name: Hypertension
  category: Cardiovascular
  description: >-
    Severe, often early-onset low-renin hypertension is the cardinal feature.
  phenotype_term:
    preferred_term: Hypertension
    term:
      id: HP:0000822
      label: Hypertension
- name: Hypokalemia
  category: Metabolic
  description: >-
    Renal potassium wasting from mineralocorticoid receptor overactivation causes
    hypokalemia.
  phenotype_term:
    preferred_term: Hypokalemia
    term:
      id: HP:0002900
      label: Hypokalemia
- name: Metabolic alkalosis
  category: Metabolic
  description: >-
    Enhanced distal hydrogen ion secretion produces hypokalemic metabolic
    alkalosis.
  phenotype_term:
    preferred_term: Metabolic alkalosis
    term:
      id: HP:0001948
      label: Metabolic alkalosis
- name: Low birth weight
  category: Growth
  description: >-
    Affected neonates are frequently small for gestational age with low birth
    weight.
  phenotype_term:
    preferred_term: Small for gestational age
    term:
      id: HP:0001518
      label: Small for gestational age
- name: Failure to thrive
  category: Growth
  description: >-
    Poor postnatal growth and failure to thrive are common in infancy.
  phenotype_term:
    preferred_term: Failure to thrive
    term:
      id: HP:0001508
      label: Failure to thrive
- name: Nephrocalcinosis
  category: Renal
  description: >-
    Hypercalciuria associated with the disorder predisposes to nephrocalcinosis.
  phenotype_term:
    preferred_term: Nephrocalcinosis
    term:
      id: HP:0000121
      label: Nephrocalcinosis
- name: Polyuria
  category: Renal
  description: >-
    Renal concentrating defects related to hypokalemia cause polyuria and
    polydipsia.
  phenotype_term:
    preferred_term: Polyuria
    term:
      id: HP:0000103
      label: Polyuria
- name: Left ventricular hypertrophy
  category: Cardiovascular
  description: >-
    Chronic hypertension leads to left ventricular hypertrophy and
    end-organ damage.
  phenotype_term:
    preferred_term: Left ventricular hypertrophy
    term:
      id: HP:0001712
      label: Left ventricular hypertrophy
biochemical:
- name: Urinary cortisol-to-cortisone metabolite ratio
  presence: INCREASED
  context: >-
    An elevated ratio of cortisol to cortisone metabolites in urine
    ((THF+alloTHF)/THE) is the biochemical hallmark, reflecting impaired 11-beta-HSD2
    conversion of cortisol to cortisone.
  biomarker_term:
    preferred_term: cortisol
    term:
      id: CHEBI:17650
      label: cortisol
- name: Plasma renin activity
  presence: DECREASED
  context: >-
    Renin is suppressed by volume expansion and hypertension.
  biomarker_term:
    preferred_term: cortisol
    term:
      id: CHEBI:17650
      label: cortisol
genetic:
- name: HSD11B2
  association: Loss of function mutation
  gene_term:
    preferred_term: HSD11B2
    term:
      id: hgnc:5209
      label: HSD11B2
treatments:
- name: Mineralocorticoid receptor antagonists
  description: >-
    Mineralocorticoid receptor antagonists such as spironolactone or eplerenone,
    and the epithelial sodium channel blocker amiloride, counter illicit receptor
    activation, lower blood pressure, and correct hypokalemia.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: spironolactone
      term:
        id: CHEBI:9241
        label: spironolactone
  target_phenotypes:
  - preferred_term: Hypertension
    term:
      id: HP:0000822
      label: Hypertension
- name: Dietary sodium restriction and potassium supplementation
  description: >-
    Low-sodium diet reduces substrate for sodium retention, and potassium
    supplementation corrects hypokalemia.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: MAXO:0000088
      label: dietary intervention
  target_phenotypes:
  - preferred_term: Hypokalemia
    term:
      id: HP:0002900
      label: Hypokalemia
differential_diagnoses: []
clinical_trials: []
datasets: []

  preferred_term: apparent mineralocorticoid excess
  term:
    id: MONDO:0009025
    label: apparent mineralocorticoid excess
synonyms:
- AME
- apparent mineralocorticoid excess syndrome
- 11-beta-hydroxysteroid dehydrogenase type 2 deficiency
- cortisol 11-beta-ketoreductase deficiency
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Classic apparent mineralocorticoid excess is caused by biallelic
    loss-of-function variants in HSD11B2 and is inherited in an autosomal
    recessive manner.
  evidence:
  - reference: PMID:36329487
    reference_title: "Apparent mineralocorticoid excess: comprehensive overview of molecular genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Apparent mineralocorticoid excess is an autosomal recessive form of monogenic disease characterized by juvenile resistant low-renin hypertension, marked hypokalemic alkalosis, low aldosterone levels, and high ratios of cortisol to cortisone metabolites.
    explanation: >-
      This molecular-genetics review states that AME is an autosomal recessive
      monogenic disease.
  - reference: PMID:39931437
    reference_title: "Case report: Clinical characteristics and Genetical analysis of HSD11B2 in three Chinese children with apparent mineralocorticoid excess: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analysis revealed biallelic recessive variations in the HSD11B2 gene in all three patients.
    explanation: >-
      Pediatric case series confirms biallelic (recessive) HSD11B2 variants in
      affected children.
pathophysiology:
- name: 11-beta-HSD2 deficiency and impaired cortisol inactivation
  description: >-
    Loss of renal 11-beta-hydroxysteroid dehydrogenase type 2 activity, encoded
    by HSD11B2, fails to convert active cortisol to inactive cortisone in
    mineralocorticoid target tissues, allowing cortisol to accumulate at the
    mineralocorticoid receptor.

      snippet: Expression of the 11beta-HSD2 mutant cDNA resulted in an enzyme with reduced maximum velocity, but similar substrate affinity, compared with activity of the wild-type cDNA.
      explanation: The R279C expression experiment supports reduced catalytic capacity with preserved apparent substrate affinity; this cache is abstract-limited.

review_notes: The original references, genuine deep-research narrative, available full scientific bodies and tables were reviewed. Primary long-term follow-up denominators replace percentages misattributed to all 36 patients by a later review. Detailed Chinese case narratives take precedence over contradictory abstract claims of universal spironolactone success. One reported Val217Ala genotype remains a VUS, and single-case dysmorphic findings have no inferred disease-wide frequency or demonstrated causal route. The 2026 child report ends at discharge and does not demonstrate growth catch-up or long-term renal protection. The 2004 review is historical care context; newer AME reviews and primary clinical observations qualify its dexamethasone-first framing. No dedicated AME GeneReviews chapter was identified; applicable clinical, diagnostic, management and counseling domains are supplied by AME-specific sources. The recovered full 2020 review was read through the scientific body, tables and figure legends. Its proposed nonclassic construct, screening denominator and primary-aldosteronism extrapolations remain distinct from confirmed recessive AME and AME-specific outcome evidence. Chemical
  annotations identify cortisol/cortisone substrates and sodium without asserting a universal circulating concentration change; increased transport is annotated separately.

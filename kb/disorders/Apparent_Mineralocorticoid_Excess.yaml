biochemical:
- name: Urinary cortisol-metabolite to cortisone-metabolite ratio
  presence: INCREASED
  context: Urinary (THF + allo-THF)/THE is often elevated. In 29 members of the selected 36-person cohort, the mean was 19 (range 3–55; source normal approximately 1). The reduced metabolites reflect hepatic as well as renal steroid handling, so this is not a direct quantitative assay of kidney 11-beta-HSD2 or a universal diagnostic cutoff.
  evidence:
  - reference: PMID:29229831
    reference_title: Clinical, genetic, and structural basis of apparent mineralocorticoid excess due to 11β-hydroxysteroid dehydrogenase type 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'In a subset of 29 patients, the average (THF + alloTHF)/THE ratio, representing the major urinary metabolites of cortisol and cortisone, was significantly elevated at 19 (range: 3–55, normal: 1.0) (Fig. 1G).'
    explanation: Reports the measured subset and source comparator.
  - &id012
    reference: PMID:15761540
    reference_title: 'Apparent mineralocorticoid excess syndrome: an overview.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: whereas the reduced fraction THF, allo-THF and THE are products of the hepatic metabolism of F (38).
    explanation: Reduced urinary steroid metabolites include hepatic metabolism, so their ratio is not a kidney-specific enzyme activity assay.
- name: Urinary free cortisol to free cortisone ratio
  presence: INCREASED
  context: The UFF/UFE ratio more closely reflects renal cortisol inactivation than the reduced-metabolite ratio, but it is also altered by acquired enzyme inhibition and extreme cortisol exposure. A ratio is not the concentration of cortisol alone, and no single-metabolite ontology binding is assigned.
  evidence:
  - reference: PMID:15761540
    reference_title: 'Apparent mineralocorticoid excess syndrome: an overview.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: In AME, however, UFE excretion is virtually undetectable (16) resulting in a high UFF/UFE ratio.
    explanation: Historical clinical synthesis of the free-steroid pattern, without modern assay sensitivity or specificity.
  readouts:
  - target: Reduced 11-Beta-HSD2 Activity
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: A higher ratio is consistent with reduced inactivation, interpreted with exposure history and molecular findings.
- name: Circulating cortisol
  context: Serum cortisol can remain normal because feedback reduces secretion as clearance slows. The disease mechanism is impaired local ligand inactivation, not obligatory systemic hypercortisolism.
  biomarker_term:

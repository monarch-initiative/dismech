- name: Enhanced UBF-rDNA Binding and Impaired Pol I Preinitiation Complex Assembly
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The lysine run increases UBF binding to the negatively charged rDNA promoter
    and the 5' external transcribed spacer. Rather than simply enhancing
    transcription, the altered UBF disturbs assembly of the RNA polymerase I
    preinitiation complex; a knock-in study found reduced cooperative
    UBTF1-SL1 recruitment at the promoter, so the net effect on transcription is
    not a straightforward increase.
  molecular_functions:
  - preferred_term: RNA polymerase I general transcription initiation factor activity
    term:
      id: GO:0001181
      label: RNA polymerase I general transcription initiation factor activity
    modifier: ABNORMAL
  downstream:
  - target: rDNA Chromatin Dysregulation and rRNA Overexpression
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:28777933
    reference_title: Heterozygous De Novo UBTF Gain-of-Function Variant Is Associated
      with Neurodegeneration in Childhood.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the variant conferred gain of function to UBF, manifesting by markedly
      increased UBF binding to the rDNA promoter and to the 5'- external
      transcribed spacer.
    explanation: >-
      Demonstrates increased UBF-rDNA binding in cells of an affected
      individual.
  - reference: PMID:35139074
    reference_title: Ribosomal DNA promoter recognition is determined in vivo by cooperation
      between UBTF1 and SL1 and is compromised in the UBTF-E210K neuroregression syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      E210K knock-in cells show enhanced levels of the UBTF1 splice variant and
      a concomitant increase in active rDNA copies. In contrast, they also
      display reduced rDNA transcription and promoter recruitment of SL1.
    explanation: >-
      Shows the variant impairs cooperative UBTF1-SL1 preinitiation complex
      recruitment at the rDNA promoter.
- name: rDNA Chromatin Dysregulation and rRNA Overexpression

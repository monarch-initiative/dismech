animal_models:
- name: Drosophila pan-neuronal human UBTF1-E210K
  species: Drosophila melanogaster
  genotype: c155-GAL4 > UAS-UBTF1-E210K (human mutant UBTF1)
  publication: PMID:29300972
  description: >-
    Pan-neuronal expression of human mutant UBTF1-E210K in Drosophila is lethal,
    whereas wild-type UBTF1 expression is not, establishing the variant's
    neuronal toxicity in vivo. The model recapitulates neuronal toxicity but not
    the progressive human regression phenotype.
  modeled_mechanisms:
  - target: Cell-Cycle Arrest and Neuronal Apoptosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Neuronal expression of the mutant protein is lethal, supporting its
      cell-level toxicity.
    limitations: >-
      An invertebrate overexpression model scored by lethality; it does not
      reproduce the progressive cerebral/cerebellar neurodegeneration or the
      regression phenotype. With the pan-neuronal c155-GAL4 driver, wild-type
      UBTF1 was not lethal (only E210K was); wild-type UBTF1 overexpression was
      toxic only with the eye driver (Eye3.5-GAL4), causing a small-eye
      phenotype and semi-lethality, so overexpression toxicity is not
      E210K-specific in every tissue.
    evidence:
    - reference: PMID:29300972
      reference_title: A recurrent de novo missense mutation in UBTF causes developmental
        neuroregression.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "indicating that neuronal expression of UBTF-E210K is lethal in Drosophila."
      explanation: Establishes the neuronal lethality of the mutant protein in vivo.
- name: Ubtf heterozygous knockout mouse
  species: Mus musculus
  genotype: Ubtf+/- (germline heterozygous loss of function)
  publication: PMID:29300972
  description: >-
    Heterozygous Ubtf loss-of-function mice show only mild motor and behavioral
    abnormalities and increased DNA damage in MEFs, but not the severe human
    neurodegeneration. Because the human variant acts by gain of function, this
    haploinsufficiency model addresses a different mechanism.
  modeled_mechanisms:
  - target: Progressive Cerebral and Cerebellar Neurodegeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Germline Ubtf haploinsufficiency does not reproduce the progressive
      neurodegeneration of the human syndrome.
    limitations: >-
      Models Ubtf loss of function rather than the human gain-of-function E210K
      allele, and produces only modest motor/behavioral signs without overt
      neurodegeneration.
    evidence:
    - reference: PMID:29300972
      reference_title: A recurrent de novo missense mutation in UBTF causes developmental
        neuroregression.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "heterozygous germline loss of Ubtf was associated with only modest neurological abnormalities in young adult mice"
      explanation: >-
        Shows the haploinsufficiency mouse does not reproduce the severe human
        phenotype.
    - reference: PMID:29300972
      reference_title: A recurrent de novo missense mutation in UBTF causes developmental
        neuroregression.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Comet assays showed clear evidence of increased DNA breaks in UBTF E210K fibroblasts and Ubtf+/- MEFs"
      explanation: >-
        Substantiates the increased DNA damage in cultured Ubtf+/- MEFs noted in
        the model description, by alkaline comet assay.
- name: Ubtf E210K knock-in model
  species: Mus musculus
  genotype: UbtfE210K/E210K (homozygous E210K knock-in)
  publication: PMID:35139074
  description: >-
    Homozygous UbtfE210K/E210K mice are viable but develop behavioral
    abnormalities that worsen with increasing postnatal age (the detailed
    organismal phenotype is reported elsewhere). The molecular readouts curated
    here come from cultured UbtfE210K/E210K mouse embryonic fibroblasts (MEFs),
    which show enhanced UBTF1 splice variant and more active rDNA copies but
    reduced rDNA transcription and reduced SL1 promoter recruitment, interpreted
    as a loss-of-function contribution partly compensated by enhanced rDNA
    activation. This informs the molecular mechanism at the
    preinitiation-complex node.
  modeled_mechanisms:
  - target: Enhanced UBF-rDNA Binding and Impaired Pol I Preinitiation Complex Assembly
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Recapitulates the impaired cooperative UBTF1-SL1 recruitment and altered
      rDNA transcription attributed to the variant.
    limitations: >-
      Cell-level readouts from cultured MEFs; the mice do show age-progressive
      behavioral abnormalities, but the readouts curated here do not capture the
      cerebral/cerebellar neuroregression of the human disease. Crucially, this
      is a homozygous (UbtfE210K/E210K) model, so it does not test the
      heterozygous, single-allele de novo gain-of-function hypothesis on which
      the human disease rests, and the loss-of-function contribution it points
      to is in apparent tension with the gain-of-function data from patient
      fibroblasts.
    evidence:
    - reference: PMID:35139074
      reference_title: Ribosomal DNA promoter recognition is determined in vivo by
        cooperation between UBTF1 and SL1 and is compromised in the UBTF-E210K neuroregression
        syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        E210K knock-in cells show enhanced levels of the UBTF1 splice variant
        and a concomitant increase in active rDNA copies. In contrast, they also
        display reduced rDNA transcription and promoter recruitment of SL1.
      explanation: >-
        Characterizes the molecular effect of the variant on Pol I preinitiation
        complex recruitment in a knock-in model.
discussions:
- discussion_id: ubtf_gof_vs_lof
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does UBTF E210K cause disease through gain of function (as in patient
    fibroblasts) or through impaired preinitiation-complex assembly / loss of
    function (as in the knock-in model), and which mechanism drives neuronal
    death?
  attaches_to:
  - pathophysiology#Enhanced UBF-rDNA Binding and Impaired Pol I Preinitiation Complex
    Assembly
  rationale: >-
    Patient fibroblasts show increased UBF-rDNA binding and rRNA overexpression,
    taken as gain of function, and neuronal expression of the mutant protein is
    lethal in Drosophila. In contrast, E210K knock-in cells show reduced rDNA
    transcription and reduced SL1 recruitment, and Ubtf+/- haploinsufficiency
    mice show only mild signs. The models therefore disagree on whether the net
    effect on rRNA transcription is up or down, and no human neuropathology is
    available to adjudicate how either translates into neuronal loss. A further
    caveat is that the knock-in readouts come from homozygous UbtfE210K/E210K
    cells, whereas the human disease is caused by a single de novo allele; a
    homozygous model therefore does not test the heterozygous gain-of-function
    hypothesis directly and may exaggerate any loss-of-function component.
  evidence:
  - reference: PMID:35139074
    reference_title: Ribosomal DNA promoter recognition is determined in vivo by cooperation
      between UBTF1 and SL1 and is compromised in the UBTF-E210K neuroregression syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We suggest the underlying cause of the UBTF-E210K syndrome is therefore a
      reduction in cooperative UBTF1-SL1 promoter recruitment that may be
      partially compensated by enhanced rDNA activation.
    explanation: >-
      States the loss-of-function interpretation that stands in tension with the
      gain-of-function fibroblast data.
- discussion_id: ubtf_neuronal_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does a defect in ubiquitous ribosomal RNA transcription produce
    selective, progressive neuronal loss with a relatively precise childhood
    onset?
  attaches_to:
  - pathophysiology#Cell-Cycle Arrest and Neuronal Apoptosis
  rationale: >-
    The cellular phenotype (nucleolar stress, DNA breaks, cell-cycle arrest,
    apoptosis) was demonstrated in patient fibroblasts, but how it selectively
    drives cerebral and cerebellar neuronal loss, and why onset clusters around
    2.5-3 years, is not established; no human neuropathology has been reported.

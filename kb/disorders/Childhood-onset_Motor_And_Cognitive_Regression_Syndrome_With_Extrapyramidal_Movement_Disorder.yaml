name: childhood-onset motor and cognitive regression syndrome with extrapyramidal movement disorder
category: Mendelian
synonyms:
- UBTF neuroregression syndrome
- UBTF E210K neuroregression syndrome
- UBTF-related neurodegeneration with brain atrophy
- childhood-onset neurodegeneration with brain atrophy
- CONDBA
description: >-
  Childhood-onset motor and cognitive regression syndrome with extrapyramidal
  movement disorder (UBTF neuroregression syndrome; childhood-onset
  neurodegeneration with brain atrophy, CONDBA) is a rare autosomal dominant
  neurodegenerative disorder of childhood. In almost all reported cases it is
  caused by the same recurrent de novo missense variant in UBTF, c.628G>A
  (p.Glu210Lys, "E210K"), which lies in the second HMG-box of the upstream
  binding transcription factor (UBF), an RNA polymerase I transcription factor
  for ribosomal DNA. After a period of normal or mildly delayed early
  development, affected children regress in motor, speech, cognitive and
  behavioral skills beginning at roughly 2.5-7 years of age, and develop a
  movement disorder (dystonia, chorea), spasticity, gait ataxia and dysarthria.
  Brain MRI shows progressive cerebral and cerebellar atrophy with a thin corpus
  callosum, and speech and ambulation are typically lost by the early teens.
  The variant acts through dysregulation of ribosomal RNA transcription with
  nucleolar stress and genomic DNA damage; the precise gain- versus
  loss-of-function balance remains unsettled.

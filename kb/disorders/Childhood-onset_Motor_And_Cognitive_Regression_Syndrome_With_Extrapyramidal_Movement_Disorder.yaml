- name: UBTF E210K Gain-of-Function Variant
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  role: trigger
  description: >-
    The recurrent de novo c.628G>A (p.Glu210Lys) variant lies in the second
    HMG-box of UBF and creates a run of three lysines in the DNA-binding domain.
    Patient fibroblast and biochemical studies indicate it acts as a molecular
    gain of function on this RNA polymerase I transcription factor rather than
    by simple haploinsufficiency.

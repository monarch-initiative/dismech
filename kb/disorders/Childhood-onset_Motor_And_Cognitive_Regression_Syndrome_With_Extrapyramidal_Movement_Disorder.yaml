notes: >-
  No GeneReviews chapter covers UBTF or CONDBA; the phenotype baseline for this
  entry is the Toro et al. 2018 four-patient cohort (PMID:29300972) together with
  the 2024 UBTF Neuroregression Syndrome review (PMID:38391753).

  Scope and lump/split: this is a single-gene leaf disease anchored on the
  recurrent de novo UBTF E210K variant, and MONDO:0044701 has no descendant
  terms. A different de novo UBTF missense variant, c.608A>G p.(Gln203Arg), was
  reported in one proband with a more severe, early-onset and divergent
  neurodevelopmental phenotype (PMID:36106513); truncating and structural
  (deletion/duplication) UBTF variants are associated with other
  neurodevelopmental phenotypes. These are not pooled with the E210K syndrome
  here.

  No disease-modifying therapy and no registered clinical trials were found for
  this disorder; management in the reported cases was symptomatic and supportive.
  Stimulant and psychotropic trials for behavioral symptoms gave minimal benefit
  in individual Toro et al. patients and are not curated as treatments.

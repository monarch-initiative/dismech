- name: Luspatercept
  description: >-
    Luspatercept is a recombinant fusion protein (erythroid maturation agent)
    that reduces anemia and red-cell transfusion dependence in lower-risk MDS,
    both in ESA-naive transfusion-dependent patients (COMMANDS) and in
    ring-sideroblast lower-risk MDS refractory to erythropoiesis-stimulating
    agents (MEDALIST).
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: luspatercept
      term:
        id: NCIT:C104012
        label: Luspatercept
  evidence:
  - reference: PMID:31914241
    reference_title: "Luspatercept in Patients with Lower-Risk Myelodysplastic Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transfusion independence for 8 weeks or longer was
      observed in 38% of the patients in the luspatercept group, as compared with 13%
      of those in the placebo group
    explanation: >-
      The MEDALIST trial demonstrated luspatercept improves transfusion
      independence in lower-risk MDS with ring sideroblasts.
  - reference: PMID:37311468
    reference_title: >-
      Efficacy and safety of luspatercept versus epoetin alfa in erythropoiesis-stimulating agent-naive, transfusion-dependent, lower-risk myelodysplastic syndromes (COMMANDS): interim analysis of a phase 3, open-label, randomised controlled trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In this interim analysis, luspatercept improved the rate at which red blood cell transfusion independence and increased haemoglobin were achieved compared with epoetin alfa in ESA-naive patients with lower-risk myelodysplastic syndromes.
    explanation: >-
      The Phase III COMMANDS trial demonstrated superior frontline transfusion
      independence and hemoglobin response with luspatercept versus epoetin alfa
      in lower-risk MDS.
  target_mechanisms:
  - target: Ineffective Hematopoiesis and Cytopenias
    treatment_effect: MODULATES
    description: >-
      Luspatercept sequesters TGF-beta superfamily ligands to reduce SMAD2/SMAD3
      signaling and restore late-stage erythroid maturation.
    evidence:
    - reference: PMID:31914241
      reference_title: "Luspatercept in Patients with Lower-Risk Myelodysplastic Syndromes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Luspatercept, a recombinant fusion protein that binds transforming growth factor β superfamily ligands to reduce SMAD2 and SMAD3 signaling, showed promising results in a phase 2 study.
      explanation: >-
        Explains how luspatercept targets SMAD2/3-mediated ineffective
        erythropoiesis in lower-risk MDS.
- name: Imetelstat
  description: >-
    Imetelstat is a competitive oligonucleotide telomerase inhibitor approved
    for red-cell transfusion-dependent lower-risk MDS relapsed, refractory, or
    ineligible for erythropoiesis-stimulating agents, achieving durable
    transfusion independence in the Phase III IMerge trial.
  therapeutic_modality: OTHER
  notes: >-
    Imetelstat is a 13-mer lipid-conjugated N3'->P5' thiophosphoramidate
    oligonucleotide competitive telomerase template antagonist binding the
    template region of TERC rather than an mRNA-degrading or splice-modulating
    antisense oligonucleotide or small molecule, so therapeutic_modality is
    recorded as OTHER.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: imetelstat
      term:
        id: CHEBI:752899
        label: imetelstat
  evidence:
  - reference: PMID:38048786
    reference_title: >-
      Imetelstat in patients with lower-risk myelodysplastic syndromes who have relapsed or are refractory to erythropoiesis-stimulating agents (IMerge): a multinational, randomised, double-blind, placebo-controlled, phase 3 trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In the imetelstat group, 47 (40% [95% CI 30·9-49·3]) patients had an RBC-TI of at least 8 weeks versus nine (15% [7·1-26·6]) in the placebo group
    explanation: >-
      The Phase III IMerge trial demonstrated significantly higher >=8-week red
      blood cell transfusion independence with imetelstat versus placebo (40% vs
      15%) in ESA-relapsed/refractory lower-risk MDS.
  target_mechanisms:
  - target: Clonal Hematopoietic Stem Cell Transformation
    treatment_effect: INHIBITS
    description: >-
      Competitive telomerase inhibition targets neoplastic MDS clones with
      elevated telomerase activity, conferring disease-modifying suppression of
      transfusion-dependent lower-risk MDS clones.
    evidence:
    - reference: PMID:38048786
      reference_title: >-
        Imetelstat in patients with lower-risk myelodysplastic syndromes who have relapsed or are refractory to erythropoiesis-stimulating agents (IMerge): a multinational, randomised, double-blind, placebo-controlled, phase 3 trial.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Imetelstat offers a novel mechanism of action with durable transfusion independence (approximately 1 year) and disease-modifying activity for heavily transfused patients with LR-MDS who are not responding to or are ineligible for ESAs.
      explanation: >-
        Supports disease-modifying clonal targeting by competitive telomerase
        inhibition in lower-risk MDS.

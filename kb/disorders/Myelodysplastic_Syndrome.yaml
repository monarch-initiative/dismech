datasets:
- accession: ega:EGAS00001002550
  title: High frequency of RUNX1 mutation in myelodysplastic syndrome patients with whole-arm translocation of der(1;7)(q10;p10).
  description: The der(1;7)(q10;p10) is a recurrent chromosomal abnormality in MDS, resulting in trisomy 1q and monosomy 7q. There is some controversy over the prognosis of the der(1;7)(q10;p10). The genetic basis of MDS patients with der(1;7)(q10;p10) remains poorly defined. In this study, we have documented the disease features and the mutational landscape of a series of patients with der(1;7)(q10;p10). We observed that MDS patients with der(1;7)(q10;p10) present male predominance and have a better outcome than the -7/del(7q) group. Our findings revealed that the mutatome of patients with der(1;7)(q10;p10) is different from that of MDS with -7/del(7q).
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Myelodysplastic Syndrome"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001003547
  title: Germline variants collaborate with somatic mutations and initiate and/or drive disease in primary myelodysplastic syndrome (MDS) and therapy-related myeloid neoplasms (t-MN)
  description: Therapy-related myeloid neoplasms (T-MN) are poorly characterized secondary hematological malignancies following chemotherapy/radiotherapy exposure. We compared the clinical and mutational characteristics of T-MN (n=129) and primary myelodysplastic syndrome (P-MDS, n=108) patients. Although the somatic mutation frequency was similar between T-MN and P-MDS patients (93% in both groups), the pattern was distinct.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Myelodysplastic Syndrome"); description-level mentions were not accepted. EGA study_type: Cancer Genomics. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001004113
  title: Lenalidomide Resistance in del(5q) Myelodysplastic Syndrome Follows Loss of RUNX1/TP53-mediated Megakaryocytic Differentiation
  description: Interstitial deletion of the long arm of chromosome 5 (del(5q)) is the commonest structural genomic variant in myelodysplastic syndromes (MDS). Lenalidomide (LEN) is the treatment of choice for patients with del(5q) MDS, but half of the responding patients become resistant within two years. TP53 mutations are detected in ~20% of patients who become resistant to LEN. Our data show that patients who become resistant to LEN harbor either TP53 or RUNX1 mutations or loss of RUNX1 expression.
  organism:
    preferred_term: human

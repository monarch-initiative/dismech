    explanation: >-
      Documents the markedly elevated annual incidence of MDS among older adults.
pathophysiology:
- name: Somatic SF3B1 Spliceosome Mutation
  description: >-
    Somatic founder mutations in the core 3'-splice site recognition factor
    SF3B1 alter branchpoint and 3'-splice site selection during pre-mRNA
    processing in hematopoietic stem cells, driving aberrant splicing,
    mitochondrial iron accumulation in erythroblasts (ring sideroblasts), and
    ineffective erythropoiesis.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  genes:
  - preferred_term: SF3B1
    term:
      id: hgnc:10768
      label: SF3B1
  molecular_functions:
  - preferred_term: RNA binding
    modifier: ABNORMAL
    term:
      id: GO:0003723
      label: RNA binding
  biological_processes:
  - preferred_term: mRNA splicing, via spliceosome
    modifier: ABNORMAL
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
  downstream:
  - target: Clonal Hematopoietic Stem Cell Transformation
    causal_link_type: DIRECT
    description: >-
      Early somatic SF3B1 mutations establish a founder hematopoietic stem cell
      clone in MDS.
    evidence:
    - reference: PMID:24030381
      reference_title: >-
        Clinical and biological implications of driver mutations in myelodysplastic
        syndromes.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        early driver mutations,
        typically affecting genes involved in RNA splicing, dictate future trajectories
        of disease evolution with distinct clinical phenotypes.
      explanation: >-
        Establishes early RNA-splicing driver mutations as founder clonal events
        in MDS.
  - target: Aberrant Pre-mRNA Splicing
    causal_link_type: DIRECT
    description: >-
      Mutant SF3B1 alters 3'-splice site recognition and induces widespread
      aberrant pre-mRNA splicing.
    evidence:
    - reference: PMID:21909114
      reference_title: >-
        Frequent pathway mutations of splicing machinery in myelodysplasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        most of the mutations, which occurred in a mutually exclusive
        manner, affected genes involved in the 3'-splice site recognition during
        pre-mRNA processing, inducing abnormal RNA splicing and compromised
        haematopoiesis.
      explanation: >-
        Links 3'-splice site factor mutations directly to abnormal pre-mRNA
        splicing.
  - target: Elevated Bone Marrow Ring Sideroblast Count
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      SF3B1 spliceosome mutations specifically drive perinuclear mitochondrial
      iron accumulation in erythroblasts (ring sideroblasts).
    evidence:
    - reference: PMID:32347921
      reference_title: >-
        SF3B1-mutant MDS as a distinct disease subtype: a proposal from the
        International Working Group for the Prognosis of MDS.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        SF3B1
        mutation identifies a condition characterized by ring sideroblasts (RS),
        ineffective erythropoiesis, and indolent clinical course.
      explanation: >-
        Links somatic SF3B1 mutation specifically to the ring-sideroblast marrow
        phenotype.
  evidence:
  - reference: PMID:32347921
    reference_title: >-
      SF3B1-mutant MDS as a distinct disease subtype: a proposal from the
      International Working Group for the Prognosis of MDS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately half of MDS patients carry somatic mutations
      in spliceosome genes, with SF3B1 being the most commonly mutated one.
    explanation: >-
      Identifies SF3B1 as the most frequently mutated spliceosome founder gene
      in MDS.
  - reference: PMID:21909114
    reference_title: >-
      Frequent pathway mutations of splicing machinery in myelodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report whole-exome sequencing of 29 myelodysplasia specimens, which unexpectedly revealed novel pathway mutations involving multiple components of the RNA splicing machinery, including U2AF35, ZRSR2, SRSF2 and SF3B1.
    explanation: >-
      Establishes recurrent somatic SF3B1 splicing-machinery mutations in
      myelodysplasia.
- name: Somatic SRSF2 and U2AF1 Spliceosome Mutations
  description: >-
    Mutually exclusive somatic mutations in the 3'-splice site recognition

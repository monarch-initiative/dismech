classifications:
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    evidence:
    - reference: PMID:24030381
      reference_title: >-
        Clinical and biological implications of driver mutations in myelodysplastic
        syndromes.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Myelodysplastic syndromes (MDS) are a heterogeneous group of chronic
        hematological malignancies characterized by dysplasia, ineffective hematopoiesis
        and a variable risk of progression to acute myeloid leukemia.
      explanation: >-
        Establishes MDS as a chronic hematologic malignancy within oncology and
        hematology.
  icdo_morphology:
    classification_value: Myelodysplastic Syndrome
    notes: >-
      Bound to NCIT:C3247 (Myelodysplastic Syndrome, ICD-O-3 9989/3). MDS is a
      myeloid neoplasm distinguished from the myeloproliferative neoplasms by
      ineffective rather than effective haematopoiesis, and from acute
      leukaemia by blast count, so neither Leukemia nor Myeloproliferative
      Neoplasm holds it correctly.

      label: Cytogenetic Analysis
  evidence:
  - reference: PMID:36718105
    reference_title: >-
      Myelodysplastic Syndromes: New Methods of Diagnosis, Prognostication, and Treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The gold standard of diagnosis is cytomorphology of the blood and bone marrow, supplemented by banding cytogenetics, histomorphology, and somatic mutation analyses.
    explanation: >-
      Establishes banding cytogenetics of the bone marrow as a core diagnostic
      component of the standard MDS workup.
  - reference: PMID:22740453
    reference_title: Revised international prognostic scoring system for myelodysplastic syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bone marrow cytogenetics, marrow blast percentage, and cytopenias remained the basis of the new system. Novel components of the current analysis included: 5 rather than 3 cytogenetic prognostic subgroups with specific and new classifications of a number of less common cytogenetic subsets, splitting the low marrow blast percentage value, and depth of cytopenias.
    explanation: >-
      Demonstrates that bone marrow cytogenetics across five cytogenetic
      prognostic subgroups anchors IPSS-R risk stratification in MDS.
- name: Targeted Myeloid Next-Generation Sequencing Panel
  description: >-
    Somatic sequencing of recurrent myeloid driver genes (including SF3B1,
    TP53, TET2, DNMT3A, ASXL1, SRSF2, and U2AF1) establishes clonality, defines
    genetically anchored MDS subtypes, and refines prognostic risk.
  diagnosis_term:
    preferred_term: Next Generation Sequencing
    term:
      id: NCIT:C101293
      label: Next Generation Sequencing
  evidence:
  - reference: PMID:24030381
    reference_title: >-
      Clinical and biological implications of driver mutations in myelodysplastic
      syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing of MDS genomes has identified mutations in genes implicated in RNA splicing, DNA modification, chromatin regulation, and cell signaling.
    explanation: >-
      Somatic mutation profiling across splicing, epigenetic, and signaling
      genes underpins molecular diagnosis and classification of MDS.
- name: Complete Blood Count and Peripheral Cytopenia Evaluation
  description: >-
    Complete blood count documents persistent unexplained anemia, neutropenia,
    or thrombocytopenia and enumerates circulating blasts (<20%).
  diagnosis_term:
    preferred_term: Blood Cell Count
    term:
      id: NCIT:C28133
      label: Blood Cell Count
  evidence:
  - reference: PMID:36066514
    reference_title: >-
      Diagnosis and Treatment of Myelodysplastic Syndromes: A Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      MDS are characterized by reduced numbers of peripheral blood cells, an increased risk of acute myeloid leukemia transformation, and reduced survival.
    explanation: >-
      Peripheral blood cytopenia quantification is the initial laboratory step
      in MDS diagnosis.
differential_diagnoses:
- name: Acute myeloid leukemia
  description: >-
    Clonal myeloid malignancy that shares myeloid dysplasia and somatic driver
    mutations with MDS and represents the leukemic progression endpoint of
    higher-risk MDS.
  distinguishing_features:
  - Defined morphologically by >=20% bone marrow or peripheral blood myeloblasts (or AML-defining genetic abnormalities), whereas MDS has <20% blasts.
  disease_term:
    preferred_term: acute myeloid leukemia
    term:
      id: MONDO:0018874
      label: acute myeloid leukemia
  evidence:
  - reference: PMID:19230772
    reference_title: >-
      Efficacy of azacitidine compared with that of conventional care regimens
      in the treatment of higher-risk myelodysplastic syndromes: a randomised,
      open-label, phase III study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      According to the WHO classification, 113 patients (32%) fulfilled criteria for acute myeloid leukaemia (marrow-blast percentage 20% or greater).
    explanation: >-
      Establishes the 20% marrow-blast threshold separating AML from MDS under
      WHO criteria.
- name: Chronic myelomonocytic leukemia
  description: >-
    Myelodysplastic/myeloproliferative overlap neoplasm sharing marrow dysplasia
    and splicing/epigenetic mutations (especially SRSF2, TET2, and ASXL1) with
    MDS.
  distinguishing_features:
  - Characterized by sustained (>3 months) peripheral blood monocytosis (>=0.5 x 10^9/L and >=10% of leukocytes) alongside bone marrow dysplasia rather than isolated cytopenias alone.
  disease_term:
    preferred_term: chronic myelomonocytic leukemia
    term:
      id: MONDO:0020311
      label: chronic myelomonocytic leukemia
  evidence:
  - reference: PMID:38450850
    reference_title: >-
      Chronic myelomonocytic leukemia: 2024 update on diagnosis, risk stratification and management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Newly revised diagnostic criteria include sustained (>3 months) peripheral blood (PB) monocytosis (≥0.5 × 109/L; monocytes ≥10% of leukocyte count), consistent bone marrow (BM) morphology, <20% BM or PB blasts (including promonocytes), and cytogenetic or molecular evidence of clonality.
    explanation: >-
      Directly establishes the sustained peripheral blood monocytosis diagnostic
      threshold separating CMML from MDS.
  - reference: PMID:24030381
    reference_title: >-
      Clinical and biological implications of driver mutations in myelodysplastic
      syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We sequenced 111 genes across 738 patients with MDS or closely related neoplasms (including chronic myelomonocytic leukemia and MDS-myeloproliferative neoplasms) to explore the role of acquired mutations in MDS biology and clinical phenotype.
    explanation: >-
      Identifies chronic myelomonocytic leukemia and MDS/MPN overlap neoplasms
      as closely related clonal myeloid disorders in the differential diagnosis.
clinical_trials:
- name: NCT03682536
  phase: PHASE_III
  status: ACTIVE_NOT_RECRUITING
  description: >-
    COMMANDS open-label randomized phase III trial comparing frontline
    luspatercept versus epoetin alfa in ESA-naive, red-cell transfusion-dependent
    IPSS-R very-low-, low-, or intermediate-risk MDS; luspatercept achieved the
    12-week transfusion-independence plus >=1.5 g/dL hemoglobin endpoint in 59%
    versus 31% of patients.
  target_phenotypes:
  - preferred_term: Anemia
    term:
      id: HP:0001903
      label: Anemia
  evidence:
  - reference: clinicaltrials:NCT03682536
    reference_title: >-
      A Phase 3, Open-label, Randomized Study to Compare the Efficacy and Safety of Luspatercept (ACE-536) Versus Epoetin Alpha for the Treatment of Anemia Due to IPSS-R Very Low, Low or Intermediate Risk Due to Myelodysplastic Syndrome (MDS) in ESA Naïve Subjects Who Require Red Blood Cell Transfusions
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The purpose of this study is to determine the effectiveness of luspatercept (ACE-536) compared to epoetin alfa on red blood cell (RBC) transfusion independence (for at least 12 weeks) with a concurrent hemoglobin increase of at least 1.5 g/dL in participants with anemia due to revised international prognostic scoring system (IPSS-R) very low, low, or intermediate risk myelodysplastic syndromes (MDS) who require RBC transfusions and have never been exposed to erythropoiesis stimulating agent (ESA).
    explanation: >-
      ClinicalTrials.gov registration for the Phase III COMMANDS frontline
      trial in lower-risk transfusion-dependent MDS.
  - reference: PMID:37311468
    reference_title: >-
      Efficacy and safety of luspatercept versus epoetin alfa in erythropoiesis-stimulating agent-naive, transfusion-dependent, lower-risk myelodysplastic syndromes (COMMANDS): interim analysis of a phase 3, open-label, randomised controlled trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      86 (59%) of 147 patients in the luspatercept group and 48 (31%) of 154 patients in the epoetin alfa group reached the primary endpoint (common risk difference on response rate 26·6; 95% CI 15·8-37·4; p<0·0001).
    explanation: >-
      Published interim analysis demonstrating superiority of frontline
      luspatercept over epoetin alfa in COMMANDS.
- name: NCT02598661
  phase: PHASE_III
  status: ACTIVE_NOT_RECRUITING
  description: >-
    IMerge randomized double-blind placebo-controlled phase 2/3 trial evaluating
    intravenous imetelstat in red-cell transfusion-dependent IPSS low- or
    intermediate-1-risk MDS relapsed or refractory to erythropoiesis-stimulating
    agents; phase III met its >=8-week transfusion-independence primary endpoint

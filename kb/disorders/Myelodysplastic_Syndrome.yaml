    explanation: >-
      TP53 allelic state stratifies MDS, with biallelic (multi-hit) inactivation
      defining a distinct high-risk subtype.
  notes: >-
    Biallelic (multi-hit) TP53 inactivation, not monoallelic mutation, drives
    the high-risk complex-karyotype TP53 MDS subtype.
treatments:
- name: Supportive Care and Red Cell Transfusion
  description: >-
    Best supportive care, including red-cell transfusions and antimicrobial
    management of neutropenic infection, remains a foundation of MDS
    management, especially in lower-risk disease driven by anemia.
  therapeutic_modality: OTHER
  notes: >-
    Multi-component supportive management combining blood product transfusions
    and infection prophylaxis does not map to a single pharmacologic or
    procedural modality, so therapeutic_modality is recorded as OTHER.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:36066514
    reference_title: >-
      Diagnosis and Treatment of Myelodysplastic Syndromes: A Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Management focuses on treating symptoms and reducing the number of required
      transfusions in patients with low-risk disease.
    explanation: >-
      Supports symptom-directed supportive care and transfusion management in
      lower-risk MDS.
  - reference: PMID:19230772
    reference_title: >-
      Efficacy of azacitidine compared with that of conventional care regimens
      in the treatment of higher-risk myelodysplastic syndromes: a randomised,
      open-label, phase III study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      best supportive care only (including blood product transfusions and antibiotics with granulocyte-colony-stimulating factor for neutro penic infection)
    explanation: >-
      Defines standard best supportive care components in MDS clinical practice.
  target_mechanisms:
  - target: Ineffective Hematopoiesis and Cytopenias
    treatment_effect: MODULATES
    description: >-
      Blood product transfusions and infection prophylaxis mitigate the clinical
      consequences of ineffective hematopoiesis and cytopenias.
    evidence:
    - reference: PMID:36066514
      reference_title: >-
        Diagnosis and Treatment of Myelodysplastic Syndromes: A Review.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Treatments are tailored to the patient's disease characteristics and comorbidities and range from supportive care with or without erythropoiesis-stimulating agents for patients with low-risk MDS to hypomethylating agents, such as azacitidine or decitabine, for patients with higher-risk MDS.
      explanation: >-
        Links supportive care and erythropoiesis support to management of
        cytopenia-predominant lower-risk MDS.

      Mutations in TP53, EZH2, ETV6, RUNX1, and ASXL1 are predictors of poor overall survival in patients with myelodysplastic syndromes, independently of established risk factors.
    explanation: >-
      Establishes somatic ASXL1 mutation as an independent predictor of adverse
      overall survival in MDS.
  - reference: PMID:24218140
    reference_title: Deletion of Asxl1 results in myelodysplasia and severe developmental defects in vivo.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Somatic Addition of Sex Combs Like 1 (ASXL1) mutations occur in 10-30% of patients with myeloid malignancies, most commonly in myelodysplastic syndromes (MDSs), and are associated with adverse outcome.
    explanation: >-
      Documents somatic ASXL1 mutations as frequent chromatin-regulator driver
      lesions in MDS.

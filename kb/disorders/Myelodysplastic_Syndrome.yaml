  target_mechanisms:
  - target: Aberrant DNA Methylation and Chromatin Dysregulation
    treatment_effect: INHIBITS
    description: >-
      Decitabine depletes methylcytosine and reverses promoter DNA
      hypermethylation in clonal MDS cells.
    evidence:
    - reference: PMID:16532500
      reference_title: >-
        Decitabine improves patient outcomes in myelodysplastic syndromes: results
        of a phase III randomized study.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-

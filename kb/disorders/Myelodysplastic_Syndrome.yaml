diagnosis:
- name: Bone Marrow Aspirate and Biopsy Morphologic Assessment
  description: >-
    Bone marrow aspirate and trephine biopsy establish morphologic dysplasia in
    one or more myeloid lineages, ring sideroblast percentage, and blast
    enumeration (<20% blasts).
  diagnosis_term:
    preferred_term: Bone Marrow Aspiration and Biopsy
    term:
      id: NCIT:C92958
      label: Bone Marrow Aspiration and Biopsy
  evidence:
  - reference: PMID:32347921
    reference_title: >-
      SF3B1-mutant MDS as a distinct disease subtype: a proposal from the
      International Working Group for the Prognosis of MDS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on the findings of our analyses, we propose the following diagnostic criteria for SF3B1-mutant MDS: (1) cytopenia as defined by standard hematologic values, (2) somatic SF3B1 mutation, (3) morphologic dysplasia (with or without RS), and (4) bone marrow blasts <5% and peripheral blood blasts <1%.
    explanation: >-
      Illustrates bone marrow dysplasia, ring sideroblast evaluation, and blast
      quantification as core diagnostic pillars of MDS.

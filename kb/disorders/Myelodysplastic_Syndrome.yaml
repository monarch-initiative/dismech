- name: Decitabine
  description: >-
    Decitabine (5-aza-2'-deoxycytidine) is a hypomethylating agent used in
    higher-risk MDS, reversing aberrant DNA methylation to restore myeloid
    differentiation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

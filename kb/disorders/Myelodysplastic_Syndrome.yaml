    reference_title: >-
      Efficacy and safety of luspatercept versus epoetin alfa in erythropoiesis-stimulating agent-naive, transfusion-dependent, lower-risk myelodysplastic syndromes (COMMANDS): interim analysis of a phase 3, open-label, randomised controlled trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Erythropoiesis-stimulating agents (ESAs) are the standard-of-care treatment for anaemia in most patients with lower-risk myelodysplastic syndromes but responses are limited and transient.
    explanation: >-
      Establishes erythropoiesis-stimulating agents as standard first-line
      therapy for anemia in lower-risk MDS.
  - reference: PMID:37311468
    reference_title: >-
      Efficacy and safety of luspatercept versus epoetin alfa in erythropoiesis-stimulating agent-naive, transfusion-dependent, lower-risk myelodysplastic syndromes (COMMANDS): interim analysis of a phase 3, open-label, randomised controlled trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      86 (59%) of 147 patients in the luspatercept group and 48 (31%) of 154 patients in the epoetin alfa group reached the primary endpoint (common risk difference on response rate 26·6; 95% CI 15·8-37·4; p<0·0001).
    explanation: >-
      Phase III COMMANDS trial quantifies the 31% 12-week transfusion-independence
      plus hemoglobin-response rate with epoetin alfa in ESA-naive lower-risk MDS.
  target_mechanisms:
  - target: Ineffective Hematopoiesis and Cytopenias

- name: Podocyte Injury and Foot Process Effacement
  biological_scale: CELLULAR
  conforms_to: "nephrotic_podocyte_injury#Foot Process Effacement and Slit Diaphragm Disruption"
  description: >-
    Podocytes lacking MTX2 adhere, migrate and endocytose less, detach more,
    and show a small rise in apoptosis. Podocyte-specific Mtx2 knockout mice
    develop foot process fusion and effacement, exposed basement membrane and
    mesangial hyperplasia from 8 weeks, with microalbuminuria. The actin
    cytoskeleton is not altered.

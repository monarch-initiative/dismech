animal_models:
- name: C. elegans mtx-2 knockout and RNAi
  species: Caenorhabditis elegans
  genotype: mtx-2(gk444) knockout; mtx-2 RNAi
  publication: PMID:32917887
  modeled_mechanisms:
  - target: Mitochondrial Network Fragmentation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Most knockout worms have fragmented or disordered body-wall muscle mitochondria.
    limitations: Observed in worm body-wall muscle, not in the fibroblasts or podocytes studied in human and mouse.
    evidence:
    - reference: PMID:32917887
      reference_title: Loss of MTX2 causes mandibuloacral dysplasia and links mitochondrial dysfunction to altered nuclear morphology.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the majority of mtx-2 KO individuals expressing mitogfp displayed abnormal mitochondrial morphology"
      explanation: 74% of 68 knockout animals.
  - target: Secondary Nuclear Envelope Dysmorphology
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: RNAi produces nuclear lamin aggregates that increase with age.
    limitations: Worms have a single B-type lamin and no prelamin A processing pathway, so the comparison with human lamin A/C morphology is indirect.
    evidence:
    - reference: PMID:32917887
      reference_title: Loss of MTX2 causes mandibuloacral dysplasia and links mitochondrial dysfunction to altered nuclear morphology.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "mtx-2 downregulation by siRNA led to nuclear morphological abnormalities together with Ce-lamin-GFP nuclear aggregates that increased with the worm’s age"
      explanation: Age-dependent nuclear defect in the worm.
  - target: Respiratory Chain Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Knockout worms have reduced respiratory capacity, a rougher and less elastic cuticle that worsens with age, and transcriptomic changes in ageing, TOR and WNT pathways.
    limitations: The cuticle is a loose analogue of human skin, and the worm has no bone, fat depot, kidney or blood pressure.
    evidence:
    - reference: PMID:39462037
      reference_title: Validation of metaxin-2 deficient C. elegans as a model for MandibuloAcral Dysplasia associated to mtx-2 (MADaM) syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "mtx-2 C. elegans displayed slightly delayed development, decreased pharyngeal pumping, significantly reduced mitochondrial respiratory capacities, and transcriptomic analysis identified perturbations in the aging, TOR, and WNT-signaling pathways."
      explanation: Whole-worm respirometry and transcriptomics.
- name: Drosophila Mtx2 (CG8004) null
  species: Drosophila melanogaster
  genotype: Mtx2 (CG8004) null
  publication: PMID:42296340
  modeled_mechanisms:
  - target: Respiratory Chain Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Null flies die before adulthood with abnormal muscle mitochondria and
      impaired myofibril assembly; human MTX2 rescues lethality, and Myc
      overexpression partly rescues it.
    limitations: >-
      The critical tissue in the fly is muscle, and a myopathy is not part of
      the reported human phenotype beyond hypotonia; the human respiratory
      defect was measured in fibroblasts and podocytes.
    evidence:
    - reference: PMID:42296340
      reference_title: Drosophila Myc ameliorates defects in mitochondrial homeostasis and muscle maturation caused by Metaxin-2 deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of dMtx2 impairs myofibril assembly and induces structural and functional abnormalities in muscle mitochondria."
      explanation: Muscle mitochondrial phenotype.
    - reference: PMID:42296340
      reference_title: Drosophila Myc ameliorates defects in mitochondrial homeostasis and muscle maturation caused by Metaxin-2 deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mtx2 null mutants are lethal at a preadult stage, and this phenotype can be rescued by expression of either Drosophila Mtx2 (dMtx2) or its human ortholog, demonstrating functional conservation across species."
      explanation: Human MTX2 rescues the fly null.
- name: Xenopus mtx2 knockdown
  species: Xenopus laevis
  genotype: mtx2 knockdown
  publication: PMID:40967033
  modeled_mechanisms:
  - target: Mandibular Hypoplasia
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Knockdown reduces head size and cranial cartilage, with disrupted neural crest and chondrogenic markers.
    limitations: >-
      An embryonic cartilage defect in an amphibian; the human mandibular
      hypoplasia accompanies progressive postnatal bone resorption, which the
      embryo model cannot test.
    evidence:
    - reference: PMID:40967033
      reference_title: Mtx2 requirement for craniofacial morphogenesis with implications for mandibuloacral dysplasia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Knockdown of mtx2 led to reduced head size and hypoplastic cranial cartilage, along with disrupted expression of neural crest and chondrogenic markers."
      explanation: Craniofacial phenotype in the frog embryo.
- name: Podocyte-specific Mtx2 knockout mouse
  species: Mouse
  genotype: Podocin-Cre conditional Mtx2 knockout (Pod-Mtx2-KO)
  publication: PMID:38250156
  modeled_mechanisms:
  - target: Podocyte Injury and Foot Process Effacement
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Microalbuminuria, foot process fusion and effacement, and mesangial hyperplasia from 8 weeks.
    limitations: >-
      Mtx2 protein in glomerular cells was reduced to about 30% rather than
      absent, the mice did not develop glomerulosclerosis or renal failure over
      40 weeks, and deletion was confined to podocytes, so hypertension and
      extrarenal features are not modelled.
    evidence:
    - reference: PMID:38250156
      reference_title: Loss of MTX2 causes mitochondrial dysfunction, podocyte injury, nephrotic proteinuria and glomerulopathy in mice and patients.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Conditional podocyte-specific Mtx2 knockout (Pod-Mtx2-KO) mice present a series of podocyte and glomerular abnormalities from 8 weeks to old age, including microalbuminuria, glomerular mesangial hyperplasia, fusion and effacement of foot process."
      explanation: The only mammalian model.
discussions:
- discussion_id: madam_nuclear_defect_role
  prompt: >-
    Does the secondary nuclear envelope defect in MTX2-deficient cells drive any
    of the laminopathy-like clinical features, or is it a bystander of the
    mitochondrial lesion?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Secondary Nuclear Envelope Dysmorphology
  rationale: >-
    The clinical overlap with LMNA and ZMPSTE24 disease is the reason MADaM is
    grouped with the progeroid laminopathies, yet prelamin A does not
    accumulate. If the nuclear defect matters, lamin-directed approaches could
    be relevant; if not, the overlap is convergent at the tissue level.
  evidence:
  - reference: PMID:32917887
    reference_title: Loss of MTX2 causes mandibuloacral dysplasia and links mitochondrial dysfunction to altered nuclear morphology.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "furthermore, it secondarily impacts nuclear morphology in a fashion that resembles HGPS and other progeroid laminopathies, probably underlying common clinical features"
    explanation: The authors propose the link as probable without testing it.
- discussion_id: madam_cell_type_apoptosis
  prompt: >-
    Why do MTX2-deficient fibroblasts resist apoptosis while MTX2-deficient
    podocytes undergo more of it?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Resistance to Induced Apoptosis
  - pathophysiology#Podocyte Injury and Foot Process Effacement
  rationale: >-
    The two studies used different cells, triggers and models (patient
    fibroblasts versus a knockdown podocyte line). Which direction holds in
    bone, fat and vessel wall decides whether the progeroid features come from
    cell loss or from accumulation of senescent cells.
  evidence:
  - reference: PMID:38250156
    reference_title: Loss of MTX2 causes mitochondrial dysfunction, podocyte injury, nephrotic proteinuria and glomerulopathy in mice and patients.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In the present study, MTX2 deficiency resulted in increased apoptosis in podocytes."
    explanation: The podocyte result that contrasts with the fibroblast data.
- discussion_id: madam_extrarenal_mechanism
  prompt: >-
    How does MTX2 loss cause the skeletal, adipose and arterial features, for
    which no tissue study or mammalian model exists?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Arterial Calcification
  - phenotypes#Generalized Lipodystrophy
  - phenotypes#Distal Acro-osteolysis
  rationale: >-
    The only mammalian model deletes Mtx2 in podocytes. The discovery paper
    suggests the arterial disease could arise through vascular smooth muscle
    senescence and osteoblastic transdifferentiation as in HGPS, but this has
    not been tested.
  evidence:
  - reference: PMID:32917887
    reference_title: Loss of MTX2 causes mandibuloacral dysplasia and links mitochondrial dysfunction to altered nuclear morphology.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "which may underlie MADaM arterial disease, as in HGPS"
    explanation: Speculative mechanism from the discussion of the discovery paper.
- discussion_id: madam_therapeutic_leads
  prompt: >-
    Are the Myc/ribosome-biogenesis and TOR leads from invertebrate models
    worth testing in patient cells?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Respiratory Chain Deficiency
  - treatments#
  rationale: >-
    There is no disease-specific treatment. Myc overexpression rescues the
    Drosophila null, and the worm transcriptome implicates TOR signalling, but
    neither has been tested in human cells or mammals.
  evidence:
  - reference: PMID:42296340
    reference_title: Drosophila Myc ameliorates defects in mitochondrial homeostasis and muscle maturation caused by Metaxin-2 deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Overexpression of Drosophila Myc, a master regulator of ribosome biogenesis and cell growth, successfully rescues the preadult lethality caused by dMtx2 deficiency, and partially restores sarcomere and mitochondrial defects."
    explanation: Fly rescue only.
notes: >-
  Phenotype frequencies are from the case review in PMID:38544690, which pools
  the seven patients reported before it (five families in PMID:32917887 and one
  in PMID:36269149); its own patient and the two children in PMID:38250156 are
  not in those denominators. Cognitive development was normal in every
  discovery-cohort patient (PMID:32917887), although one child in PMID:38250156
  had paucity of speech. No GeneReviews chapter covers this disease (Bookshelf
  index searched by disease name and MTX2). The entry name follows the
  original authors' name for the disease, which is also the Orphanet preferred
  label and a MONDO exact synonym; the MONDO label, mandibuloacral dysplasia
  progeroid syndrome, could equally describe the LMNA and ZMPSTE24 progeroid
  forms. The c.378+1G>A allele occurs in both Chinese reports (PMID:38544690,
  PMID:38250156).

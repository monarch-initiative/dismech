- name: Secondary Nuclear Envelope Dysmorphology
  biological_scale: CELLULAR
  description: >-
    Lamin A/C staining shows nuclear blebs and herniations in patient
    fibroblasts, resembling HGPS, but lamin A/C levels are normal, progerin is
    absent and prelamin A does not accumulate. This separates MADaM from the
    LMNA and ZMPSTE24 forms of mandibuloacral dysplasia, where prelamin A
    accumulation is the primary lesion. The mitochondrial network also fails
    to reach the nuclear rim.
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  biological_processes:
  - preferred_term: nuclear envelope organization
    modifier: ABNORMAL
    term:
      id: GO:0006998
      label: nuclear envelope organization
  cellular_components:
  - preferred_term: nuclear envelope
    term:
      id: GO:0005635
      label: nuclear envelope
  evidence:
  - reference: PMID:32917887
    reference_title: Loss of MTX2 causes mandibuloacral dysplasia and links mitochondrial dysfunction to altered nuclear morphology.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Nonetheless, Lamin A/C immunofluorescence analyses revealed profound nuclear morphological abnormalities in MTX2-deficient fibroblasts, including blebs and herniations"
    explanation: Patient fibroblasts.
  - reference: PMID:32917887
    reference_title: Loss of MTX2 causes mandibuloacral dysplasia and links mitochondrial dysfunction to altered nuclear morphology.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In addition, no prelamin A accumulation was detected in patients’ cells by immunoblot nor indirect immuofluorescence"
    explanation: The nuclear defect arises without prelamin A accumulation.

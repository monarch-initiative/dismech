  - reference: PMID:32917887
    reference_title: Loss of MTX2 causes mandibuloacral dysplasia and links mitochondrial dysfunction to altered nuclear morphology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report five homozygous null mutations in MTX2, encoding Metaxin-2 (MTX2), an outer mitochondrial membrane protein, in patients presenting with a severe laminopathy-like mandibuloacral dysplasia"
    explanation: Gene discovery; all five alleles were predicted null.
  - reference: PMID:32917887
    reference_title: Loss of MTX2 causes mandibuloacral dysplasia and links mitochondrial dysfunction to altered nuclear morphology.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Consistent with the possible instability of the truncated MTX2 proteins, we failed to detect the corresponding ~30 kDa band corresponding to endogenous MTX2 by western blot"
    explanation: Protein absence in patient fibroblasts.
  - reference: PMID:36269149
    reference_title: A novel MTX2 gene splice site variant resulting in exon skipping, causing the recently described mandibuloacral dysplasia progeroid syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing from cDNA showed that exon 8 of MTX2 was skipped."
    explanation: A further splice allele shown to cause exon skipping in patient RNA.

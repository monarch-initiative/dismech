prevalence:
- population: Molecularly confirmed patients in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Seven patients from five families in the gene-discovery report (2020) and
    one Turkish patient (2023) made the seven cases counted by the 2024 Chinese
    case report, which added an eighth. A separate 2024 report described two
    further Chinese children. Orphanet gives the class <1 / 1 000 000.
  evidence:
  - reference: PMID:38544690
    reference_title: "Case report: A novel splice-site mutation of MTX2 gene caused mandibuloacral dysplasia progeroid syndrome: the first report from China and literature review."

name: Mandibuloacral Dysplasia Associated to MTX2
creation_date: "2026-11-10T14:12:25Z"
category: Mendelian
description: >-
  Mandibuloacral dysplasia associated to MTX2 (MADaM; OMIM 619127; MONDO label
  mandibuloacral dysplasia progeroid syndrome, MDPS) is an ultra-rare autosomal
  recessive progeroid syndrome caused by biallelic loss-of-function variants in
  MTX2, which encodes metaxin-2, a protein on the cytosolic face of the
  mitochondrial outer membrane that partners metaxin-1 in the sorting and
  assembly machinery. Children present from infancy with severe postnatal growth
  retardation, generalized lipodystrophy, a progeroid face with prominent eyes,
  a long pinched nose and mandibular hypoplasia, clavicular hypoplasia, distal
  acro-osteolysis, femoral head dysplasia, atrophic wrinkled skin with
  pigmentary change, and hypotonia. Unlike the lamin A processing forms of
  mandibuloacral dysplasia, MADaM involves internal organs early: severe
  hypertension, proteinuric glomerulopathy including focal segmental
  glomerulosclerosis, left ventricular hypertrophy, arterial calcification and
  hepatosplenic involvement. Cognition has been normal in reported patients.

  Mechanistically it is a mitochondrial disease that phenocopies the progeroid
  laminopathies. Loss of metaxin-2 depletes metaxin-1, fragments the
  mitochondrial network and reduces respiratory chain content and oxidative
  phosphorylation. Patient fibroblasts resist induced apoptosis and show
  increased mitophagy, senescence and slowed proliferation, together with
  lamin A/C-stained nuclear blebs and herniations, but without the prelamin A
  accumulation that defines the LMNA and ZMPSTE24 forms. In podocytes, MTX2
  loss destabilizes the Sam50-CHCHD3-Mitofilin axis of the mitochondrial
  intermembrane space bridging complex, disorganizes cristae and causes
  podocyte injury with proteinuria in a podocyte-specific knockout mouse. How
  the mitochondrial lesion produces the skeletal, adipose and vascular
  features is not established.

  Curation scope: kept as its own entry rather than a subtype of
  mandibuloacral dysplasia, because the causal mechanism (an outer
  mitochondrial membrane defect without prelamin A accumulation) differs from
  the LMNA (type A) and ZMPSTE24 (type B, Mandibuloacral_Dysplasia_Type_B)
  forms.

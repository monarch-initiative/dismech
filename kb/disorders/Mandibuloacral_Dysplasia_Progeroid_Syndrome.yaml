      evidence_source: IN_VITRO
      snippet: "Obviously, the reduced MTX2 led to the instability of Sam50-CHCHD3-Mitofilin axis, which primarily mediates the connection between SAM and MICOS complexes to assemble MIB supercomplex for maintaining mitochondrial cristae morphology."
      explanation: Mouse podocyte cell line with MTX2 knockdown.
  - target: Mitochondrial Network Fragmentation
    causal_link_type: DIRECT
    description: Patient fibroblasts show a fragmented mitochondrial network.
    evidence:
    - reference: PMID:32917887
      reference_title: Loss of MTX2 causes mandibuloacral dysplasia and links mitochondrial dysfunction to altered nuclear morphology.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Loss of MTX2 in patients' primary fibroblasts leads to loss of Metaxin-1 (MTX1) and mitochondrial dysfunction, including network fragmentation and oxidative phosphorylation impairment."
      explanation: Patient fibroblast finding; the study cannot separate the effect of MTX2 loss from that of the secondary MTX1 loss.
  - target: Resistance to Induced Apoptosis

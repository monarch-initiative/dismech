    reference_title: "Mandibuloacral dysplasia associated to MTX2"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "<1 / 1 000 000 | Worldwide | Point prevalence | PMID:32917887"
    explanation: Orphanet point-prevalence class.
pathophysiology:
- name: MTX2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic start-loss, splice-site, frameshift and nonsense variants remove
    metaxin-2, an outer mitochondrial membrane protein that partners metaxin-1
    in the sorting and assembly machinery. Endogenous MTX2 is undetectable in
    patient fibroblasts.

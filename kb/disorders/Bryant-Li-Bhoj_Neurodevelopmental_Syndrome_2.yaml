- name: Abnormal Brain Development and Progressive Neurologic Dysfunction
  biological_scale: ORGANISM
  description: >-
    The organism-level endpoint is a malformed, hypomyelinated brain with a
    characteristic imaging signature — small posterior fossa, dysgenesis of the
    corpus callosum (especially the splenium), cortical developmental abnormalities
    such as dysgyria and hypoplastic temporal poles, and deformity of the lateral
    ventricles — accompanied by developmental delay/intellectual disability,
    abnormal muscle tone, epilepsy and oculomotor dysfunction. Unlike a purely
    static encephalopathy, a subset of individuals show a progressive course with
    loss of milestones, worsening gait, spasticity and camptocormia, which is why
    BLBS was first described as a neurodegenerative disorder.
  evidence:
  - reference: PMID:35772801
    reference_title: "Brain Abnormalities in Patients with Germline Variants in H3F3: Novel Imaging Findings and Neurologic Symptoms Beyond Somatic Variants and Brain Tumor Development"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Imaging phenotypes in germline H3F3-affected individuals are related to brain features, including a small posterior fossa as well as dysgenesis of the corpus callosum, cortical developmental abnormalities, and deformity of lateral ventricles."
    explanation: >-
      Defines the structural brain phenotype that this endpoint node represents.

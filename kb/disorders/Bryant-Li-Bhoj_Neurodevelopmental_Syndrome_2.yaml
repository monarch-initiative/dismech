  downstream:
  - target: Disrupted Nucleosome Assembly and Chaperone Interaction
    description: >-
      The altered residue sits at an interface with DNA, a partner histone, or an
      H3.3-specific chaperone, so the first consequence is a defect in how H3.3 is
      handled and incorporated into the nucleosome.
- name: Disrupted Nucleosome Assembly and Chaperone Interaction
  biological_scale: MOLECULAR
  description: >-
    Molecular modelling of the full BLBS variant set shows that the substituted
    residues disrupt contacts with DNA, with the other core histones, and with
    histone chaperones. Residues essential for H3.3-specific recognition (for
    example p.G90, required for DAXX/UBN1 binding, and p.S31, required for
    ZMYND11 recognition) are mutated in patients, and some alleles change how much
    H3.3 protein is present or how tightly it binds its chaperone: several
    constructs reduce H3.3 protein levels, one (p.R41C) accumulates above
    wild-type, and p.R129H binds the chaperone DAXX more strongly than wild-type.
    The common consequence is that the formation, deposition and stability of
    H3.3-containing nucleosomes is altered.

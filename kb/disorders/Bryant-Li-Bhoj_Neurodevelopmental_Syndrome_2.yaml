      dominant inheritance observed in human BLBS.
discussions:
- discussion_id: blbs2_paralog_basis
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do variants in H3-3B produce a nosologically separate disorder (BLBS2) from
    variants in H3-3A (BLBS1) when the two genes encode an identical protein?
  attaches_to:
  - pathophysiology#De Novo H3-3B Variant Altering Histone H3.3
  rationale: >-
    The two BLBS entities exist because two genes are involved, not because two
    proteins are. The only known differences are in untranslated and coding
    sequence, which alter expression pattern and level. Cohort data show
    gene-dependent frequency differences (seizures 59% vs 45%; genital anomalies 28%
    vs 17%; delayed walking 65% vs 85%), so the paralogs are not interchangeable,
    but the mechanism converting a paralog-level expression difference into these
    phenotype shifts is unknown. Resolving it determines whether BLBS1 and BLBS2
    should remain separate entities or be lumped.
  proposed_experiments:
  - experiment_id: exp_blbs2_paralog_expression_atlas
    name: Paralog-resolved H3-3A/H3-3B expression atlas across human brain development
    description: >-
      Quantify H3-3A and H3-3B transcript and protein abundance across human
      developmental brain stages and cell types to test whether the paralogs differ
      in the windows and lineages relevant to the divergent phenotypes.
    supporting_outcome:
    - "Paralog-specific expression differences in neural lineages would explain why an identical protein product yields two clinical entities."
    refuting_outcome:
    - "Indistinguishable paralog expression across all relevant stages and cell types would argue that the BLBS1/BLBS2 split is nosological rather than biological."
  - experiment_id: exp_blbs2_isogenic_paralog_swap
    name: Isogenic paralog-matched substitution series in iPSC-derived neurons
    description: >-
      Generate isogenic iPSC lines carrying the same amino-acid substitution
      introduced into H3-3A versus H3-3B, then compare chromatin accessibility,
      transcriptome and neuronal electrophysiology between the matched pairs.
    supporting_outcome:
    - "Divergent chromatin or electrophysiological phenotypes from the same substitution in the two paralogs would establish a paralog-intrinsic effect."
    refuting_outcome:
    - "Identical phenotypes from matched substitutions would locate the difference in mutational opportunity or ascertainment rather than paralog biology."
  evidence:
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since these variables do not account for all BLBS phenotypic variability, these findings suggest that additional factors may play a role in modifying the phenotypes of affected individuals."
    explanation: >-
      The authors explicitly state that gene, variant location and sex leave BLBS
      phenotypic variability unexplained.
- discussion_id: blbs2_variant_heterogeneity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do all BLBS2 alleles act through a single mechanism (H3.3 hyper-deposition), or
    do tail, core and stop-loss variants act through distinct local mechanisms?
  attaches_to:
  - pathophysiology#Disrupted Nucleosome Assembly and Chaperone Interaction
  rationale: >-
    Functional data point in different directions: some constructs reduce H3.3
    protein levels while another accumulates above wild-type; one increases
    chaperone binding; and the one allele studied in a human neural model (p.L48R)
    increases H3-3B expression and nucleosomal H3.3. Whether these are variations on
    one theme or genuinely different mechanisms determines whether a single
    therapeutic strategy could serve the whole disorder.
  proposed_experiments:
  - experiment_id: exp_blbs2_allelic_series_multiomic
    name: Multi-omic iPSC allelic series across tail, core and stop-loss BLBS2 variants
    description: >-
      Apply the p.L48R iPSC pipeline to a panel of BLBS2 alleles spanning the histone
      tail, the histone core and stop-loss classes, quantifying nucleosomal H3.3
      occupancy genome-wide alongside transcriptome and chromatin accessibility.
    supporting_outcome:
    - "Shared hyper-deposition across allele classes would establish a single unifying mechanism and a single therapeutic target."
    refuting_outcome:
    - "Opposite-direction deposition changes across allele classes would confirm mechanistic heterogeneity and argue against a one-size-fits-all therapy."
  evidence:
  - reference: PMID:34876591
    reference_title: "De novo variants in H3-3A and H3-3B are associated with neurodevelopmental delay, dysmorphic features, and structural brain abnormalities"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Three variant constructs (p.R129H, p.M121I, and p.I52N) showed significant decrease in protein expression, while one variant (p.R41C) accumulated at greater levels than wild-type control."
    explanation: >-
      Demonstrates opposite-direction effects on H3.3 abundance among BLBS alleles,
      which is the substance of this gap.
- discussion_id: blbs2_proliferation_no_cancer
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do germline H3-3B variant carriers show increased cellular proliferation yet
    no excess of malignancy, including at residues (p.G34) that are oncogenic when
    mutated somatically?
  attaches_to:
  - pathophysiology#Deregulated Cell Proliferation
  rationale: >-
    Patient fibroblasts, including H3F3B p.G34V lines, proliferate faster than
    controls and up-regulate mitosis genes, yet the founding 46-patient cohort had
    congenital anomalies without malignancies and the community-wide cancer
    incidence across germline histonopathies sits at 1%. Somatic p.G34V is oncogenic
    only in combination with ATRX/DAXX and TP53 lesions, suggesting the germline
    context lacks the required cooperating hits, or that developmental timing and
    cell of origin gate transformation.
  proposed_experiments:
  - experiment_id: exp_blbs2_cancer_incidence_followup
    name: Longitudinal cancer-incidence follow-up of the international BLBS cohort
    description: >-
      Prospectively track tumour incidence in the registry cohort with standardised
      ascertainment, extending the community-wide incidence estimate and testing it
      against the 5% threshold used to justify routine surveillance.
    supporting_outcome:
    - "An incidence rising above the surveillance threshold would establish BLBS2 as a cancer-predisposition syndrome."
    refuting_outcome:
    - "A stable incidence at or below population background would confirm that no tumour surveillance is warranted."
  - experiment_id: exp_blbs2_cooperating_hit_transformation
    name: Cooperating-lesion transformation assay in germline H3.3-variant cells
    description: >-
      Test whether germline H3.3-variant cells acquire transformation potential when
      ATRX/DAXX or TP53 are additionally disrupted, and compare the chromatin state
      of germline-variant glial precursors with K27M/G34-mutant glioma cells.
    supporting_outcome:
    - "Transformation only in the presence of cooperating lesions would explain the germline proliferation-without-malignancy paradox."
    refuting_outcome:
    - "Failure to transform under any cooperating lesion would point instead to cell of origin or developmental timing as the gate."
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data suggest that the mechanism of germline mutations are distinct from cancer-associated somatic histone mutations but may converge on control of cell proliferation."
    explanation: >-
      States the unresolved convergence between germline and somatic H3.3 mechanisms
      that motivates this gap.
  - reference: PMID:40241305
    reference_title: "Coupling deep phenotypic quantification with next-generation phenotyping for 192 individuals with germline histonopathies"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the value of ongoing translational work to address the outstanding question of cancer predisposition for individuals living with germline histonopathies"
    explanation: >-
      The pan-histonopathy cohort names cancer predisposition as an explicitly
      outstanding question.
- discussion_id: blbs2_neurodegeneration_extent
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is BLBS2 genuinely neurodegenerative, or is the apparent regression a
    developmental plateau with musculoskeletal decline?
  attaches_to:
  - pathophysiology#Abnormal Brain Development and Progressive Neurologic Dysfunction
  rationale: >-
    BLBS was first described as a progressive neurodegenerative syndrome, and
    GeneReviews lists loss of milestones, worsening gait, spasticity and
    camptocormia. But the expanded cohort reframed the disorder as primarily
    neurodevelopmental, and some individuals show resolving rather than progressive
    hypotonia. No longitudinal imaging or biomarker study has established whether
    neuronal loss actually occurs. The answer changes both prognostic counselling
    and trial endpoint selection.
  proposed_experiments:
  - experiment_id: exp_blbs2_longitudinal_imaging_biomarker
    name: Prospective longitudinal MRI volumetry with neuroaxonal injury biomarkers
    description: >-
      Follow a BLBS2 cohort with serial MRI volumetry, standardised developmental
      assessment and serial neurofilament light chain measurement to distinguish
      genuine neuronal loss from a developmental plateau.
    supporting_outcome:
    - "Progressive volume loss with rising neurofilament light chain would confirm a true neurodegenerative component."
    refuting_outcome:
    - "Stable volumes and biomarkers alongside a developmental plateau would reframe the apparent regression as non-degenerative."
  evidence:
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BLBS was initially categorized as a progressive neurodegenerative syndrome caused by de novo heterozygous variants in either H3-3A or H3-3B"
    explanation: >-
      Documents the initial neurodegenerative framing that the expanded
      neurodevelopmental characterisation now sits alongside.
  - reference: PMID:40241305
    reference_title: "Coupling deep phenotypic quantification with next-generation phenotyping for 192 individuals with germline histonopathies"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "histonopathy-associated phenotypes change throughout the lifespan, necessitating longitudinal re-evaluation"
    explanation: >-
      Independent argument that the natural history is not yet settled and requires
      longitudinal study.
- discussion_id: blbs2_human_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the available zebrafish evidence for BLBS reflect BLBS2 biology, given that
    it models the h3f3a paralog rather than h3f3b?
  attaches_to:
  - pathophysiology#Neural Crest and Craniofacial Developmental Defect
  rationale: >-
    The craniofacial and glial arms of the mechanism rest substantially on a
    zebrafish h3f3a model (dominant p.D123N and homozygous db1092 alleles). Since
    the whole basis for splitting BLBS1 from BLBS2 is a paralog-level difference in
    expression rather than protein sequence, a model built on the other paralog
    cannot by construction test paralog-specific effects, and zebrafish h3f3
    gene-family structure differs from the human two-gene arrangement. The
    craniofacial phenotype may therefore be attributable to total H3.3 dosage rather
    than to anything specific to H3-3B.
  proposed_experiments:
  - experiment_id: exp_blbs2_h3f3b_orthologue_models
    name: Orthologous h3f3b animal models for the craniofacial and glial arms
    description: >-
      Generate zebrafish and mouse models of orthologous h3f3b alleles, compare
      craniofacial and glial phenotypes with the existing h3f3a models, and quantify
      paralog-specific expression in neural crest across species.
    supporting_outcome:
    - "Reproduction of the craniofacial and foxd3-glia phenotypes by h3f3b alleles would license the existing model evidence for BLBS2."
    refuting_outcome:
    - "Absence of the phenotype in h3f3b models would confine the current model evidence to total H3.3 dosage rather than to BLBS2."
  - experiment_id: exp_blbs2_ipsc_neural_crest
    name: Human iPSC-derived neural crest test of the foxd3-glia phenotype
    description: >-
      Differentiate BLBS2-allele iPSCs to neural crest and crest-derived glia to test
      whether the zebrafish foxd3-positive glial deficit reproduces in human cells.
    supporting_outcome:
    - "A crest-derived glial deficit in human BLBS2 cells would bridge the cross-species gap."
    refuting_outcome:
    - "Normal human crest-derived glia would leave the zebrafish glial phenotype unconfirmed for human disease."
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A dominant zebrafish model (p.D123N) derived from a forward genetic screen has been previously reported with craniofacial abnormalities, which were replicated in our patient cohort"
    explanation: >-
      Confirms that the craniofacial model evidence comes from the h3f3a paralog,
      which is the substance of the translational mismatch.
references:
- reference: PMID:37782742
  title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome"
  tags:
  - GeneReviews
  findings:
  - statement: >-
      Expert-curated clinical description, diagnostic criteria, management and
      surveillance recommendations, and genetic counselling guidance for BLBS
      (covering both the H3-3A and H3-3B entities).
    supporting_text: "The diagnosis of BRYLIB is established in a proband with suggestive findings and a heterozygous pathogenic variant in either H3-3A (H3F3A) or H3-3B (H3F3B) identified by molecular genetic testing."
- reference: PMID:33268356
  title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients"
  findings:
  - statement: >-
      Founding 46-patient cohort defining the disorder, with molecular modelling of
      37 variants, patient histone PTM profiling, patient-cell RNA-seq and
      proliferation assays, and a zebrafish craniofacial/neural-crest-glia model.
    supporting_text: "We analyze 46 patients bearing de novo germline mutations in histone 3 family 3A (H3F3A) or H3F3B with progressive neurologic dysfunction and congenital anomalies without malignancies."
- reference: PMID:38678163
  title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals"
  findings:
  - statement: >-
      Combined 96-person cohort supplying the quantitative phenotype table used
      throughout this entry, plus the gene-stratified (H3-3A versus H3-3B) and
      variant-location analyses.
    supporting_text: "In this larger cohort of 96 people, we identify causative missense, synonymous, and stop-loss variants."
- reference: PMID:34876591
  title: "De novo variants in H3-3A and H3-3B are associated with neurodevelopmental delay, dysmorphic features, and structural brain abnormalities"
  findings:
  - statement: >-
      Independent cohort of twelve de novo variants (six in H3-3B) with functional
      characterisation of protein expression and DAXX chaperone binding.
    supporting_text: "Here we report eleven de novo missense variants and one de novo stop-loss variant in H3-3A (n = 6) and H3-3B (n = 6)"
- reference: PMID:41689096
  title: "A novel iPSC model of Bryant-Li-Bhoj neurodevelopmental/neurodegenerative syndrome demonstrates the role of histone H3.3 in chromatin dynamics, neuronal differentiation, and maturation"
  findings:
  - statement: >-
      First human-derived mechanistic model, built on the H3-3B p.L48R allele, with
      multi-omic and electrophysiological characterisation supporting the
      hyper-deposition model.
    supporting_text: "These data provide the first mechanistic insights into the pathogenesis of BLBS from a human-derived model of neurodevelopment"
- reference: PMID:35772801
  title: "Brain Abnormalities in Patients with Germline Variants in H3F3: Novel Imaging Findings and Neurologic Symptoms Beyond Somatic Variants and Brain Tumors."
  findings:
  - statement: >-
      Dedicated neuroradiology series of 18 individuals defining the BLBS imaging
      signature.
    supporting_text: "Eighteen individuals (10 males, 56%) with H3F3 germline variants were included."
- reference: PMID:36867246
  title: "Histone 3.3-related chromatinopathy: missense variants throughout H3-3A and H3-3B cause a range of functional consequences across species"
  findings:
  - statement: >-
      Review collating cross-species functional data on H3.3 missense variants and
      articulating the gain-of-function/dominant-negative model.
    supporting_text: "Most of the causative variants are private and scattered throughout the protein, but all seem to have either a gain-of-function or dominant negative effect on protein function."
- reference: PMID:40241305
  title: "Coupling deep phenotypic quantification with next-generation phenotyping for 192 individuals with germline histonopathies"
  findings:
  - statement: >-
      Pan-histonopathy cohort of 192 individuals; establishes the 1% community-wide
      cancer incidence that argues against routine tumour surveillance, and finds
      weaker support for several non-core BLBS features.
    supporting_text: "the community-wide cancer incidence is currently 1%, which falls below the recommended 5% cut off for routine surveillance"
- reference: PMID:40696776
  title: "Paroxysmal Dyskinesia with a Novel Variant in the Histone 3 Family 3B (H3-3B) Gene"
  findings:
  - statement: >-
      Single-case report extending the BLBS2 movement-disorder phenotype.
    supporting_text: "Paroxysmal Dyskinesia with a Novel Variant in the Histone 3 Family 3B (H3-3B) Gene."
notes: >-
  Entity scope: this entry covers BLBS2 (H3-3B / OMIM 619721) only. Much of the
  published evidence is reported for the combined BLBS cohort across both genes,
  because the two paralogs encode an identical protein and were ascertained
  together. Where the sources report gene-stratified figures, the H3-3B-specific
  number is quoted; where they do not, the combined-cohort figure is used and
  labelled as such. The H3-3A-specific counterpart (BLBS1, MONDO:0030606) is
  recorded as a differential diagnosis rather than folded in here. No prevalence
  estimate is recorded because none has been published for BLBS overall or for
  BLBS2 specifically; roughly 100 individuals have been reported across both
  genes.

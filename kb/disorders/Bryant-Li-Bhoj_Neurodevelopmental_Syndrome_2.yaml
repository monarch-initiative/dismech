- name: Neural Crest and Craniofacial Developmental Defect
  biological_scale: TISSUE
  description: >-
    H3.3 is required for the neural crest program that builds the craniofacial
    skeleton. In zebrafish, a dominant h3f3a p.D123N allele — two residues from a
    patient variant — reproduces craniofacial anomalies, and homozygous h3f3a
    mutants lose neural-crest-derived jaw cartilage entirely and show reduced
    foxd3-positive neural-crest-derived glia along with melanocyte and xanthophore
    loss. The glial defect is proposed to underlie the hypomyelination seen on
    patient neuroimaging, making this node a shared origin for the facial
    dysmorphism and part of the white-matter phenotype.

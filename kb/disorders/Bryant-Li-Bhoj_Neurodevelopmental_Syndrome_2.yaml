      static developmental encephalopathy.
mechanistic_hypotheses:
- hypothesis_group_id: h33_hyperdeposition_model
  hypothesis_label: H3.3 hyper-deposition model of BLBS2
  status: EMERGING
  description: >-
    Proposes that the H3-3B disease allele acts by increasing H3-3B expression and
    driving excess incorporation of H3.3 into nucleosomes, so that the primary
    lesion is too much variant histone in chromatin rather than a loss of histone
    function. Demonstrated so far for a single allele (p.Leu48Arg) in one isogenic
    iPSC series; whether it generalises to tail-domain, core-domain and stop-loss
    BLBS2 alleles is untested, and it sits alongside the alternative view that
    different variants act through heterogeneous local mechanisms (impaired
    chaperone binding, altered protein stability, disrupted DNA contact).
  evidence:
  - reference: PMID:41689096
    reference_title: "A novel iPSC model of Bryant-Li-Bhoj neurodevelopmental/neurodegenerative syndrome demonstrates the role of histone H3.3 in chromatin dynamics, neuronal differentiation, and maturation"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These data provide the first mechanistic insights into the pathogenesis of BLBS from a human-derived model of neurodevelopment"
    explanation: >-
      The hyper-deposition model rests on a single human-derived model system, which
      is why it is recorded as emerging rather than canonical.
phenotypes:
- category: Neurologic
  name: Developmental Delay and Intellectual Disability
  description: >-
    Essentially universal in BLBS. Ninety-nine percent of the 96-person combined
    BLBS cohort had developmental delay/intellectual disability, typically in the
    severe range. The single reported exception carried an H3-3B
    synonymous/stop-loss allele and still had delayed speech and abnormal
    neuroimaging.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Developmental delay/intellectual disability 94/95 (99%)"
    explanation: >-
      Quantifies the frequency (94/95, 99%) supporting the VERY_FREQUENT band.
  - reference: PMID:37782742
    reference_title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by developmental delay / intellectual disability (typically in the severe range) and nonspecific craniofacial abnormalities"
    explanation: >-
      GeneReviews states that developmental delay/intellectual disability is a
      defining feature and typically severe.
- category: Neurologic
  name: Severe Intellectual Disability
  description: >-
    Where intellectual disability is graded, it is typically severe; many affected
    individuals never achieve independent sitting, walking or speech.
  phenotype_term:
    preferred_term: Severe intellectual disability
    term:
      id: HP:0010864
      label: Severe intellectual disability
  evidence:
  - reference: PMID:37782742
    reference_title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Many affected individuals do not achieve independent sitting, walking, or speaking, although there is a range of developmental outcomes."
    explanation: >-
      Describes the severity of the cognitive/motor outcome that supports the severe
      intellectual disability annotation.
- category: Neurologic
  name: Seizures
  description: >-
    Seizures occur in about half of individuals with BLBS overall and are reported
    more frequently with H3-3B variants (59%) than with H3-3A variants (45%),
    making epilepsy one of the few features that appears enriched in BLBS2
    specifically. Roughly one in five of those with seizures had febrile seizures.
    A 2025 pan-histonopathy deep-phenotyping analysis found weaker support for
    seizures as a consistent syndrome-defining feature, so the frequency band here
    should be read as cohort-derived rather than settled.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  frequency: FREQUENT
  evidence:
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures were more frequently reported in individuals harboring variants in H3-3B (59%) than those harboring variants in H3-3A (45%)."
    explanation: >-
      Gene-specific frequency: 59% in H3-3B (BLBS2) carriers, within the FREQUENT
      band and higher than in BLBS1.
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Developmental delay/intellectual disability 94/95 (99%) Seizures 45/91 (49%)"
    explanation: >-
      Cohort-wide denominator for seizures (45/91, 49%) in the combined BLBS series.

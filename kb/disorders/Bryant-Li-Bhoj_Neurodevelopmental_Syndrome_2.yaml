genetic:
- name: H3-3B
  gene_term:
    preferred_term: H3-3B
    term:
      id: hgnc:4765
      label: H3-3B
  association: De novo heterozygous pathogenic variants
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    H3-3B (formerly H3F3B) is the sole cause of BLBS2. It encodes the
    replication-independent histone variant H3.3, a protein identical to that
    encoded by H3-3A; the two genes differ in untranslated and coding sequence,
    giving different expression patterns and levels, and both are expressed
    ubiquitously with relatively high levels in brain, testes, ovaries and uterus.
    Both genes are strongly missense-constrained (gnomAD missense Z = 2.95 for
    H3F3B), and cohort variants were essentially absent from 138,632 gnomAD
    controls. Reported BLBS2 alleles include missense changes in both the histone
    tail and the histone core (for example p.A29P, p.G34V, p.L48R, p.M121I,
    p.P121R, p.R129H), a synonymous variant that alters an alternate-transcript
    stop codon (p.V117V/p.S146X), and stop-loss variants; p.P121R was recurrent in
    the founding cohort. Variant location within the protein — and the identity of
    the gene (H3-3A versus H3-3B) — contributes more to phenotypic severity than
    sex, but no definitive genotype-phenotype correlation has been established, and
    individuals with the same variant can differ markedly.
  evidence:
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bryant-Li-Bhoj syndrome (BLBS), which became OMIM-classified in 2022 (OMIM: 619720, 619721), is caused by germline variants in the two genes that encode histone H3.3 (H3-3A/H3F3A and H3-3B/H3F3B)"
    explanation: >-
      Establishes H3-3B as one of the two BLBS genes and ties it to the OMIM
      entities, of which 619721 is BLBS2.
  - reference: PMID:34876591
    reference_title: "De novo variants in H3-3A and H3-3B are associated with neurodevelopmental delay, dysmorphic features, and structural brain abnormalities"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report eleven de novo missense variants and one de novo stop-loss variant in H3-3A (n = 6) and H3-3B (n = 6)"
    explanation: >-
      Documents six independent de novo H3-3B variants, giving direct BLBS2-specific
      genetic evidence.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the gnomAD missense Z score is 3.21 for H3F3A and 2.95 for H3F3B (>2 is significant)"
    explanation: >-
      Establishes strong missense constraint on H3F3B, supporting pathogenicity of de
      novo missense alleles in this gene.
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the results presented here suggest that the location of the variants within the H3.3 protein and the affected gene (H3-3A or H3-3B) contribute more to the severity of distinct phenotypes than sex"
    explanation: >-
      Establishes gene identity and variant position, not sex, as the main identified
      modifiers of severity.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Both H3F3B and H3F3A are expressed ubiquitously, during development and throughout life, with relatively high levels of expression in the brain, testes, ovaries, and uterus"
    explanation: >-
      Expression pattern of H3-3B matching the neurologic and genitourinary organ
      involvement of BLBS2.
variants:
- name: H3-3B p.Leu48Arg
  description: >-
    The BLBS2 allele modelled in the isogenic iPSC system. It increases H3-3B
    expression and drives hyper-deposition of H3.3 into nucleosomes, with
    downstream changes in chromatin accessibility, neuronal fate, adhesion,
    neurotransmission and excitatory/inhibitory balance. Bryant et al. classify
    p.L48R structurally as a variant that may alter the interaction of H3.3 with
    other nucleosomal histones.
  gene:
    preferred_term: H3-3B
    term:
      id: hgnc:4765
      label: H3-3B
  evidence:
  - reference: PMID:41689096
    reference_title: "A novel iPSC model of Bryant-Li-Bhoj neurodevelopmental/neurodegenerative syndrome demonstrates the role of histone H3.3 in chromatin dynamics, neuronal differentiation, and maturation"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we investigate how one BLBS-causative variant, H3-3B p.Leu48Arg (L48R), affects neurodevelopment"
    explanation: >-
      Identifies p.Leu48Arg as a BLBS-causative H3-3B allele and the subject of the
      mechanistic model.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "they may alter the interaction of H3.3 with other nucleosomal histones (e.g., p.L48R)"
    explanation: >-
      Structural interpretation of p.L48R as a variant disrupting histone-histone
      contacts within the nucleosome.
- name: H3-3B p.Gly34Val
  description: >-
    A germline BLBS2 allele at a residue that is also mutated somatically in
    pediatric high-grade glioma. In the somatic setting p.G34V drives oncogenesis
    only in combination with ATRX/DAXX and TP53 lesions; in the germline setting
    carriers develop BLBS without malignancy, and patient fibroblasts show
    increased proliferation. This allele is the clearest illustration of the
    germline-versus-somatic mechanistic divergence in H3.3 disease.
  gene:
    preferred_term: H3-3B
    term:
      id: hgnc:4765
      label: H3-3B
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The only other variant in our cohort that is similar to a cancer-linked variant is the p.G34V mutation in H3F3B."
    explanation: >-
      Identifies the germline H3F3B p.G34V allele and its relationship to the
      cancer-associated substitution at the same residue.
- name: H3-3B p.Pro121Arg
  description: >-
    A recurrent BLBS2 allele, found in two unrelated individuals with H3-3B
    variants in the founding cohort (and in one further individual as the
    corresponding H3-3A change). Patient lymphoblasts carrying this allele were
    among those used to demonstrate the local histone PTM disturbance.
  gene:
    preferred_term: H3-3B
    term:
      id: hgnc:4765
      label: H3-3B
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "p.Q125R was found in H3F3A in three individuals and in a different individual in H3F3B, while p.P121R was found in H3F3A in one individual and in H3F3B in two other individuals."
    explanation: >-
      Documents p.P121R as recurrent in H3F3B, one of the few non-private BLBS2

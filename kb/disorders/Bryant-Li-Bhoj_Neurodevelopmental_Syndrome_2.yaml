- name: Altered Chromatin Accessibility and Transcriptional Dysregulation
  biological_scale: CELLULAR
  description: >-
    The convergent cellular lesion is a remodelled chromatin landscape with
    coordinated transcriptional dysregulation. In an isogenic iPSC model of the
    H3-3B p.Leu48Arg allele, the variant increases H3-3B expression and drives
    hyper-deposition of H3.3 into nucleosomes; multi-omic profiling of the derived
    neural progenitors and forebrain neurons shows paired changes in chromatin
    accessibility and gene expression affecting neuronal fate, cell adhesion,
    neurotransmission and excitatory/inhibitory balance. In patient fibroblasts
    the transcriptional signature is dominated by up-regulated mitosis and
    cell-division genes.

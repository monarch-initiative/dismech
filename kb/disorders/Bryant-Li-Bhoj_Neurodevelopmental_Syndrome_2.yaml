- name: Aberrant Local Histone Post-Translational Modification
  biological_scale: MOLECULAR
  description: >-
    Mass-spectrometric profiling of histones from BLBS patient cells — including
    lymphoblasts carrying the H3F3B p.A29P and p.P121R alleles — shows aberrant
    post-translational modification patterns that are local rather than global.
    This is a mechanistically important contrast with the somatic oncohistone
    lysine substitutions (H3.3 K27M, K36M), which poison methyltransferases in
    trans and cause genome-wide PTM collapse. In BLBS the epigenetic disturbance
    is restricted to the neighbourhood of the variant nucleosome, which helps
    explain why germline H3.3 variants cause a developmental syndrome without the
    malignancy risk of the oncohistones.

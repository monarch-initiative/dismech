diagnosis:
- name: Molecular genetic testing
  description: >-
    The diagnosis of BLBS2 is established in a proband with suggestive clinical
    findings and a heterozygous pathogenic variant in H3-3B identified by molecular
    genetic testing. Because the clinical presentation is nonspecific and the
    causative alleles are largely private, exome or genome sequencing (or a broad
    neurodevelopmental panel including H3-3A and H3-3B) is the practical diagnostic
    route; the two BLBS entities cannot be distinguished clinically and are
    separated only by which gene carries the variant.
  evidence:
  - reference: PMID:37782742
    reference_title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of BRYLIB is established in a proband with suggestive findings and a heterozygous pathogenic variant in either H3-3A (H3F3A) or H3-3B (H3F3B) identified by molecular genetic testing."
    explanation: >-
      States the diagnostic criterion; for BLBS2 the qualifying gene is H3-3B.
- name: Brain magnetic resonance imaging
  description: >-
    Brain MRI supports the diagnosis and characterises the structural phenotype.
    The recognisable pattern comprises a small posterior fossa, dysgenesis of the
    corpus callosum (especially the splenium), cortical developmental abnormalities
    (dysgyria, hypoplastic temporal poles), deformity of the lateral ventricles
    with reduced internally rotated caudate heads, and delayed myelination. MRI is
    abnormal in roughly 58% of imaged individuals, so a normal scan does not
    exclude the diagnosis.
  evidence:
  - reference: PMID:35772801
    reference_title: "Brain Abnormalities in Patients with Germline Variants in H3F3: Novel Imaging Findings and Neurologic Symptoms Beyond Somatic Variants and Brain Tumor Development"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Imaging phenotypes in germline H3F3-affected individuals are related to brain features, including a small posterior fossa as well as dysgenesis of the corpus callosum, cortical developmental abnormalities, and deformity of lateral ventricles."
    explanation: >-
      Defines the imaging pattern that supports a clinical suspicion of BLBS.

pathophysiology:
- name: De Novo H3-3B Variant Altering Histone H3.3
  biological_scale: MOLECULAR
  description: >-
    BLBS2 begins with a de novo heterozygous variant in H3-3B, one of the two
    genes encoding the replication-independent histone variant H3.3. H3-3A and
    H3-3B produce an identical 135-amino-acid protein but differ in their
    regulatory and coding sequences, giving different expression patterns and
    levels — the only basis on which the two BLBS entities are separated. Unlike
    the recurrent oncohistone substitutions of pediatric glioma, BLBS alleles are
    largely private and distributed across the whole protein (tail and core), and
    include missense, synonymous/transcript-dependent and stop-loss changes. They
    act through gain-of-function or dominant-negative mechanisms, not
    haploinsufficiency, which is why a single altered allele of a highly
    constrained histone gene produces disease.
  genes:
  - preferred_term: H3-3B
    term:
      id: hgnc:4765
      label: H3-3B
  molecular_functions:
  - preferred_term: structural constituent of chromatin
    term:
      id: GO:0030527
      label: structural constituent of chromatin

- name: Impaired Neuronal Differentiation and Maturation
  biological_scale: CELLULAR
  description: >-
    In dorsal forebrain organoids carrying the H3-3B p.Leu48Arg allele the
    proportions of radial glia and mature neuronal populations are shifted, and
    whole-cell patch clamp shows that the neurons that do form are
    electrophysiologically immature, with decreased electrical activity relative to
    isogenic controls. This couples the chromatin lesion to a concrete
    neurodevelopmental deficit: fewer properly specified, properly maturing,
    properly firing cortical neurons.

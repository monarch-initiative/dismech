name: Bryant-Li-Bhoj Neurodevelopmental Syndrome 2
creation_date: "2026-08-01T00:00:00Z"
description: >-
  Bryant-Li-Bhoj neurodevelopmental syndrome 2 (BLBS2, BRYLIB2) is an autosomal
  dominant neurodevelopmental and neurodegenerative disorder caused by de novo
  heterozygous variants in H3-3B (H3F3B). It is one of the very few Mendelian
  diseases caused by variants in a histone protein itself rather than in a
  histone-modifying enzyme or chaperone — a germline histonopathy rather than a
  chromatin-regulator chromatinopathy. H3-3B and its paralog H3-3A encode an
  identical protein, the replication-independent histone variant H3.3, but differ
  in their untranslated and coding sequences and therefore in expression pattern
  and level; this paralog-level difference, not a difference in protein product,
  is why BLBS is split into two OMIM entities (BLBS1 for H3-3A, BLBS2 for H3-3B).
  Nearly all affected individuals have developmental delay/intellectual
  disability, and most have craniofacial dysmorphism, abnormal muscle tone and
  abnormal neuroimaging; seizures are reported more often with H3-3B than with
  H3-3A variants. The causative alleles are private, scattered across the whole
  protein, and act by gain-of-function or dominant-negative mechanisms rather
  than haploinsufficiency, which distinguishes them from the recurrent
  oncohistone substitutions (K27M, G34R/V) that drive pediatric glioma.
category: Mendelian
parents:
- syndromic disease
- neurodevelopmental disorder
- hereditary disease
synonyms:
- BLBS2
- BRYLIB2
- Bryant-Li-Bhoj syndrome 2
- H3-3B-related neurodevelopmental syndrome
- H3F3B-related neurodevelopmental disorder

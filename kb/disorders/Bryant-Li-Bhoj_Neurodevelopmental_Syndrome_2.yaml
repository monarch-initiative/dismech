inheritance:
- name: Autosomal dominant inheritance
  description: >-
    BLBS2 is inherited in an autosomal dominant manner and is typically caused by
    a de novo heterozygous H3-3B variant, so recurrence risk to siblings is low.
    No biallelic or recessive form has been described; the disease alleles are
    missense, synonymous (transcript-dependent) and stop-loss changes acting
    through gain-of-function or dominant-negative effects rather than loss of one
    copy.

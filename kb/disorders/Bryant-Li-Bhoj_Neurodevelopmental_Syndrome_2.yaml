- name: Deregulated Cell Proliferation
  biological_scale: CELLULAR
  description: >-
    Patient fibroblast lines carrying germline H3.3 variants — including the H3F3B
    p.G34V and H3F3B p.V117V/p.S146X alleles — proliferate faster than matched
    controls, matching the mitosis/cell-division transcriptional signature. This is
    proposed as the point of convergence between germline BLBS variants and the
    somatic oncohistone mutations. Importantly, the convergence is at the level of
    proliferative control only: germline carriers do not show the malignancy that
    follows somatic H3.3 substitution, and the community-wide cancer incidence in
    germline histonopathies (1%) falls below the threshold used to justify routine
    tumour surveillance.

differential_diagnoses:
- name: Bryant-Li-Bhoj neurodevelopmental syndrome 1
  description: >-
    The H3-3A-related counterpart of this disorder. The two are clinically
    indistinguishable at the level of an individual patient — the protein product
    is identical — and are separated only by which paralog carries the variant.
    Cohort-level differences favour BLBS1 for delayed walking (85% vs 65%) and
    dysmorphism, and BLBS2 for seizures (59% vs 45%) and genital anomalies (28% vs
    17%), but these are group trends, not diagnostic discriminators.
  disease_term:
    preferred_term: Bryant-Li-Bhoj neurodevelopmental syndrome 1
    term:
      id: MONDO:0030606
      label: Bryant-Li-Bhoj neurodevelopmental syndrome 1
  distinguishing_features:
  - "Determined solely by molecular testing: a pathogenic variant in H3-3A rather than H3-3B"
  - Cohort-level trend toward more frequent delayed walking and dysmorphism than in BLBS2
  - Cohort-level trend toward fewer seizures and fewer genital anomalies than in BLBS2
  evidence:
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While specific genotype-phenotype correlations have not been conclusively delineated"
    explanation: >-
      Confirms that no established genotype-phenotype rule separates the two entities
      clinically.
- name: Diffuse midline glioma, H3 K27-altered
  description: >-
    The somatic counterpart of H3.3 disease. Recurrent somatic H3.3 substitutions
    (K27M, G34R/V) in glial precursors drive pediatric high-grade glioma with
    genome-wide collapse of histone post-translational modifications. Germline BLBS
    variants are private, scattered, cause only local PTM changes, and are not
    associated with malignancy — the 46-patient founding cohort had congenital
    anomalies without tumours.
  distinguishing_features:
  - Somatic and tumour-restricted rather than germline and constitutional
  - Recurrent hotspot substitutions (K27M, G34R/V) rather than private protein-wide variants
  - Global histone PTM dysregulation rather than local in-cis PTM change
  - Malignancy as the presenting problem rather than a congenital neurodevelopmental syndrome
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient histone posttranslational modifications (PTMs) analysis revealed notably aberrant local PTM patterns distinct from the somatic lysine mutations that cause global PTM dysregulation."
    explanation: >-
      Contrasts the germline (local) and somatic (global) epigenetic mechanisms that
      separate BLBS from the oncohistone diseases.
experimental_models:
- name: H3-3B p.Leu48Arg iPSC-derived neural model
  description: >-
    Induced pluripotent stem cells carrying the BLBS2 allele H3-3B p.Leu48Arg,
    differentiated into 2D neural progenitor cells, 2D forebrain neurons and 3D
    dorsal forebrain organoids, with paired transcriptomic and
    chromatin-accessibility profiling, immunofluorescence cell-identity mapping and
    whole-cell patch clamp. This is the first human-derived mechanistic model of
    BLBS and the principal BLBS2-specific model system available.
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  publication: PMID:41689096
  findings:
  - statement: >-
      Paired chromatin-accessibility and transcriptomic changes affect neuronal
      fate, cell adhesion, neurotransmission and excitatory/inhibitory balance.
    supporting_text: "In the 2D systems, we found dysregulated gene expression and chromatin accessibility affecting neuronal fate, adhesion, neurotransmission, and excitatory/inhibitory balance."
  - statement: >-
      Organoids show altered proportions of radial glia and mature neurons, and the
      neurons that form are electrophysiologically immature.
    supporting_text: "Patch clamp recordings revealed decreased electrical activity in neurons from L48R DFBOs compared to control DFBOs."
  - statement: >-
      The proposed proximal mechanism is increased H3-3B expression driving
      hyper-deposition of H3.3 into the nucleosome.
    supporting_text: "H3.3 L48R increases H3-3B expression, resulting in the hyper-deposition of H3.3 into the nucleosome, which underlies changes in gene expression and chromatin accessibility"
  evidence:
  - reference: PMID:41689096
    reference_title: "A novel iPSC model of Bryant-Li-Bhoj neurodevelopmental/neurodegenerative syndrome demonstrates the role of histone H3.3 in chromatin dynamics, neuronal differentiation, and maturation"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These data provide the first mechanistic insights into the pathogenesis of BLBS from a human-derived model of neurodevelopment"
    explanation: >-
      Establishes the model's standing as the first human-derived mechanistic system
      for BLBS.
animal_models:
- species: Danio rerio
  genotype: h3f3a p.D123N dominant allele; h3f3a db1092 homozygous null
  description: >-
    A dominant zebrafish h3f3a p.D123N allele from a forward genetic screen sits two
    residues from a patient variant (p.Q125R) and reproduces the dominant
    inheritance and craniofacial anomalies of BLBS. Homozygous h3f3a db1092 mutants
    completely lose neural-crest-derived jaw cartilage and show reduced
    foxd3-positive neural-crest-derived glia, melanocytes and xanthophores. The
    model uses the h3f3a paralog rather than an h3f3b orthologue, so it is
    informative for the shared H3.3 mechanism rather than for BLBS2 specifically.
  associated_phenotypes:
  - Craniofacial anomalies
  - Loss of neural-crest-derived jaw cartilage
  - Reduced foxd3-positive neural-crest-derived glia
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A zebrafish model showed craniofacial anomalies and a defect in Foxd3-derived glia."
    explanation: >-
      Summarises the zebrafish phenotype recapitulating the craniofacial and glial
      components of BLBS.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This heterozygous missense variant replicates the dominant inheritance observed in humans and is only two amino acids away from a mutation identified in an affected patient (p.Q125R)."
    explanation: >-

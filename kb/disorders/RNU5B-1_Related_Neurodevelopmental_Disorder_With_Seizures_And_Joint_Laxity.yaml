notes: >-
  No GeneReviews chapter names this disorder. Joint laxity is in the MONDO and
  OMIM (#621302) name but is not documented for RNU5B-1 in the primary reports:
  Nava et al. tabulate joint hyperlaxity only for RNU4-2 patients, and the single
  RNU5B-1 patient in PMID:42502410 did not have it. It is therefore not curated as
  a phenotype here. No disease-specific treatment has been reported; care is
  supportive.

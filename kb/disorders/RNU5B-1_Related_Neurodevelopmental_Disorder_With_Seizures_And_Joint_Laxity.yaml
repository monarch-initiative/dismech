- name: Perturbed U5 Loop I Exon Alignment
  description: >-
    U5 loop I base-pairs with the last nucleotides of the upstream exon,
    contributing to 5' splice-site selection, and holds both exons in register for
    exon ligation. A variant U5 snRNA
    incorporated into spliceosomes is expected to change which exon-boundary
    sequences pair well with loop I. Whether the mutant snRNA acts by dominant
    negative or altered-function effect, rather than by loss of function, has not
    been tested.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: U5 loop I exon recognition and alignment during splicing
    term:

    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "U5 aligns exons by binding the 5′ and 3′ splice sites, ensuring precise ligation"
    explanation: States the normal function of U5 that the variants perturb.
  - reference: PMID:39809319
    reference_title: "RNA splicing: a split consensus reveals two major 5' splice site classes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Later, related approaches demonstrated that loop 1 of U5 snRNA base paired to exon sequence upstream of the 5′ splice site and that this was important for 5′ splice site selection"
    explanation: >-
      Loop I pairing with the upstream exon contributes to 5' splice site choice,
      so changing loop I sequence would be expected to shift splice-site selection.
  downstream:
  - target: Variant-Specific Altered Splice Site Usage
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39809319
      reference_title: "RNA splicing: a split consensus reveals two major 5' splice site classes."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Indeed, the two classes can be defined by a preferential base-pairing interaction potential with either U5 snRNA loop 1 (AG//GUNNN) or the U6 snRNA ACAGA box (NN//GURAG)"
      explanation: >-
        A class of human 5' splice sites depends on pairing with U5 loop 1, so a
        loop I variant would be expected to shift usage within that class. This is a
        model from normal spliceosome biology, not a measurement in patients.
- name: Variant-Specific Altered Splice Site Usage
  conforms_to: "spliceosome_component_dysfunction#Mis-Splicing of a Sensitive Transcript Subset"
  description: >-
    In cultured lymphocytes from six individuals with U5 variants (four RNU5B-1),
    the variants did not reproduce the 5' splice-site signature of ReNU syndrome
    and shared no common 5' or 3' splice-site signature with each other. Analysed
    one at a time, RNU5B-1 n.39C>G possibly altered mainly 5' splice-site usage and
    n.44A>G mainly 3' splice-site usage; the authors call these possible
    variant-specific effects. The affected genes, and which events matter in brain,
    are not known.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: mRNA 5'-splice site recognition
    term:
      id: GO:0000395
      label: mRNA 5'-splice site recognition
    modifier: ABNORMAL
  - preferred_term: mRNA 3'-splice site recognition
    term:
      id: GO:0000389
      label: mRNA 3'-splice site recognition
    modifier: ABNORMAL

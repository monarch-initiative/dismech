- name: Reduced or Aberrant U5B snRNP Pool
  description: >-
    Alternative to target-specific mis-splicing. Cellular quality-control
    pathways degrade defective snRNAs, including disease-mutant snRNAs, before
    they assemble into spliceosomes; when that control fails, defective snRNAs
    form aberrant spliceosomes that alter splicing. Applied to RNU5B-1, a loop I
    variant could either lower the amount of functional U5B snRNP or, if it
    escapes degradation, impair spliceosomes broadly rather than redirect them
    to a defined target set. This has been shown for U4-2 mutants, not for U5
    variants, and neither the level nor the spliceosome incorporation of mutant
    U5B-1 has been measured.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: U5 snRNP
    term:
      id: GO:0005682
      label: U5 snRNP
  evidence:
  - reference: PMID:42562572
    reference_title: "Multiple quality control checkpoints safeguard small nuclear RNA biogenesis and prevent assembly of aberrant spliceosomes."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "These pathways also repress mutant snRNAs associated with human developmental disorders."
    explanation: >-
      Disease-mutant snRNAs are targeted by quality control. The mutants tested
      were U4-2, not U5, so this applies to RNU5B-1 by analogy.
  - reference: PMID:42562572
    reference_title: "Multiple quality control checkpoints safeguard small nuclear RNA biogenesis and prevent assembly of aberrant spliceosomes."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Impeding snRNA quality control causes formation of aberrant spliceosomes and altered pre-mRNA splicing."
    explanation: >-
      A stabilized defective snRNA can poison spliceosomes, the dominant-negative
      branch of this alternative.
  downstream:
  - target: Abnormal Brain Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - rnu5b1_snrna_qc_loss_or_poisoning
mechanistic_hypotheses:
- hypothesis_group_id: rnu5b1_missplicing_drives_brain_phenotype
  hypothesis_label: Variant-specific mis-splicing of neurodevelopmental transcripts
  status: EMERGING
  description: >-
    The phenotype is caused by altered splice-site usage in a set of transcripts
    needed for brain development, with the set differing by variant according to
    which exon-boundary sequences pair with the mutant loop I. The loop I pairing
    part is an inference from normal spliceosome biology (PMID:39809319), not a
    model the disease papers propose. No such transcript has been identified, and
    the splicing data come from cultured lymphocytes of four RNU5B-1 carriers.
  evidence:
  - reference: PMID:40379786
    reference_title: "Dominant variants in major spliceosome U4 and U5 small nuclear RNA genes cause neurodevelopmental disorders through splicing disruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results, although obtained from a limited number of patients, may underline the clinical variability observed for patients with RNU5 variants."
    explanation: >-
      The authors propose that the variant-specific splicing effects explain the
      clinical variability, while stating the data are limited.
- hypothesis_group_id: rnu5b1_snrna_qc_loss_or_poisoning
  hypothesis_label: Loss of functional U5B snRNP or broad spliceosome poisoning
  status: ALTERNATIVE
  description: >-
    The phenotype follows from too little functional U5B snRNP, because the
    mutant snRNA is degraded by quality control, or from mutant U5B snRNP that
    assembles and impairs splicing broadly. Either predicts diffuse splicing
    disruption rather than a variant-specific target set. The evidence is from
    U4-2 mutants in cultured cells; a pure loss-of-function reading must also
    explain why heterozygous loss of one of several brain-expressed U5 genes
    would cause disease.
  evidence:
  - reference: PMID:42562572
    reference_title: "Multiple quality control checkpoints safeguard small nuclear RNA biogenesis and prevent assembly of aberrant spliceosomes."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Here, we identify multiple checkpoints in snRNA biogenesis monitored by quality control machineries that subject defective snRNAs to degradation and prevent their assembly into spliceosomes."
    explanation: >-
      Establishes the degradation route that would lower the functional U5B pool
      if mutant U5B-1 is recognized as defective.

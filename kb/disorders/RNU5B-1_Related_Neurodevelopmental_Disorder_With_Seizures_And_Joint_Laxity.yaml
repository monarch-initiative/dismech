pathophysiology:
- name: RNU5B-1 Loop I Variant
  conforms_to: "spliceosome_component_dysfunction#Germline Spliceosome Component Variant"
  description: >-
    A heterozygous de novo single-nucleotide substitution or small insertion in a
    roughly 8-nucleotide stretch (about n.37 to n.44) of RNU5B-1 that encodes the
    invariant 5' loop I of U5 snRNA. The stretch is depleted of variation in gnomAD
    and UK Biobank but not variant-free: a different substitution, n.39C>T, is
    present in three gnomADv4 individuals. Recurrent variants are n.39C>G,
    n.42_43insA and n.44A>G. RNU5B-1 and RNU5A-1 are the main U5 genes expressed
    in brain.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: RNU5B-1
    term:
      id: hgnc:10212
      label: RNU5B-1
  evidence:
  - reference: PMID:40379786
    reference_title: "Dominant variants in major spliceosome U4 and U5 small nuclear RNA genes cause neurodevelopmental disorders through splicing disruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven of these variants (14 patients) clustered within a small region spanning chr15(hg38): 65,304,713–65,304,720, corresponding to the highly conserved U5 5′ loop I"
    explanation: Localizes the pathogenic variants to U5 loop I.
  - reference: PMID:40379786
    reference_title: "Dominant variants in major spliceosome U4 and U5 small nuclear RNA genes cause neurodevelopmental disorders through splicing disruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three variants (n.39C>G, n.42_43insA and n.44AG) were recurrent, identified in six, three and four patients, respectively."
    explanation: Names the recurrent variants.
  - reference: PMID:40442284
    reference_title: "Analysis of R-loop forming regions identifies RNU2-2 and RNU5B-1 as neurodevelopmental disorder genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For RNU5B-1, we found three DN variants in a constrained region (from 30 to 50 bp; ENST00000363286.1:n.37G>C, n.42_43insA and n.44A>G) in four individuals"
    explanation: >-
      Places de novo variants in the same constrained region. This 100,000 Genomes
      Project cohort overlaps the Genomics England arm of Nava et al.
  - reference: PMID:40442284
    reference_title: "Analysis of R-loop forming regions identifies RNU2-2 and RNU5B-1 as neurodevelopmental disorder genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, a different substitution in the constrained region, n.39C>T, is observed in three individuals in gnomADv4."
    explanation: Shows the constrained region is not variant-free in the general population.
  - reference: PMID:40379786
    reference_title: "Dominant variants in major spliceosome U4 and U5 small nuclear RNA genes cause neurodevelopmental disorders through splicing disruption."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "As RNU5A-1 and RNU5B-1 are the main genes encoding U5 in the brain"
    explanation: >-
      RNU5B-1 is one of the two U5 genes predominantly expressed in brain; Nava et

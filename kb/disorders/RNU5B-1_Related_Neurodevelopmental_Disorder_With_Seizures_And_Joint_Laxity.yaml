name: RNU5B-1 Related Neurodevelopmental Disorder With Seizures And Joint Laxity
creation_date: "2026-10-15T00:00:00Z"
category: Mendelian
description: >-
  A dominant neurodevelopmental disorder caused by heterozygous, usually de novo
  variants in RNU5B-1, one of the genes encoding U5 small nuclear RNA of the major
  spliceosome. Pathogenic variants cluster in the invariant 5' loop I of U5, the
  element that base-pairs with exon sequence at the splice junction and holds the
  two exons in register for ligation. Affected individuals have global
  developmental delay, hypotonia, failure to thrive, seizures, eye anomalies and
  a variable set of congenital malformations. Head size varies: two carriers of
  n.39C>G had macrocephaly and three carriers of n.44A>G had acquired
  microcephaly. Variants are invisible to
  standard exome capture and are found by genome sequencing. Which of the splicing
  changes caused by these variants produce the neurodevelopmental phenotype is not
  known.

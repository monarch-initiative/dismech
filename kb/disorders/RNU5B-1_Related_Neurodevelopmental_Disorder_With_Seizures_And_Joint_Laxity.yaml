diagnosis:
- name: Genome sequencing
  description: >-
    RNU5B-1 is a short noncoding gene not captured by standard exome designs, so
    variants are found by genome sequencing or by exome designs extended to snRNA
    loci.
  evidence:
  - reference: PMID:42502410
    reference_title: "Whole-genome discovery of pathogenic snRNA variants and efficient extended-exome screening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in small nuclear RNA (snRNA) genes have recently emerged as a major cause of Mendelian disorders, particularly neurodevelopmental disorders, yet they remain difficult to detect in routine diagnostics because conventional whole-exome sequencing (WES) does not capture snRNA loci."
    explanation: Explains why genome or snRNA-extended exome sequencing is required.
discussions:
- discussion_id: rnu5b1_which_splicing_errors_cause_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Variant-Specific Altered Splice Site Usage
  - pathophysiology#Reduced or Aberrant U5B snRNP Pool
  - pathophysiology#Abnormal Brain Development
  prompt: >-
    Which splicing errors caused by RNU5B-1 loop I variants produce the
    neurodevelopmental phenotype?
  rationale: >-
    The only patient splicing data come from cultured lymphocytes of four RNU5B-1
    carriers. These
    showed no shared 5' or 3' splice-site signature, unlike ReNU syndrome, and the
    two recurrent variants appeared to act differently: n.39C>G mainly on 5' splice
    sites, n.44A>G mainly on 3' splice sites. No affected transcript has been tied
    to a neurodevelopmental gene, there are no neural RNA data, and the clinical
    picture may differ by variant (macrocephaly in two n.39C>G carriers, acquired
    microcephaly in three n.44A>G carriers). Whether the mutant U5 acts by dominant negative or
    altered-function effect has not been tested. A loop I model predicts that each
    variant re-weights splice sites whose upstream-exon sequence pairs with the
    mutant loop, which would make the target set variant-specific and could explain
    the clinical heterogeneity; that prediction is untested. A competing model
    holds that quality control degrades the mutant snRNA or that a stabilized
    mutant poisons spliceosomes broadly, which predicts diffuse rather than
    variant-specific disruption; measuring the level and spliceosome
    incorporation of mutant U5B-1 separates the two.
  evidence:
  - reference: PMID:40379786
    reference_title: "Dominant variants in major spliceosome U4 and U5 small nuclear RNA genes cause neurodevelopmental disorders through splicing disruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results, although obtained from a limited number of patients, may underline the clinical variability observed for patients with RNU5 variants."
    explanation: The authors state that the splicing data are limited.
  proposed_experiments:
  - experiment_id: rnu5b1_neuronal_splicing_by_variant
    name: Splicing profiles of RNU5B-1 variants in human neural cells
    description: >-
      Introduce n.39C>G, n.42_43insA, n.44A>G and n.37G>C, each heterozygous, into an
      isogenic human iPSC line, differentiate to neural progenitors and cortical
      neurons, and profile splicing by deep RNA-seq with and without NMD inhibition.
      Compare each variant against the isogenic control and against each other, and
      test whether altered 5' splice sites are enriched for upstream-exon sequences
      predicted to pair differently with the mutant loop I. Because U5 is encoded by
      several genes, first confirm by allele-specific small RNA-seq that the
      mutant U5B-1 is expressed in neurons and incorporated into spliceosomes.
    would_support:
    - mechanistic_hypotheses#rnu5b1_missplicing_drives_brain_phenotype
    would_refute:
    - mechanistic_hypotheses#rnu5b1_missplicing_drives_brain_phenotype
    supporting_outcome:
    - >-
      Each variant produces a reproducible, variant-specific set of altered splice
      sites in neural cells, enriched for loop I pairing changes and for genes with
      established roles in brain development.
    refuting_outcome:
    - >-
      No reproducible splicing change beyond control variability in neural cells,
      or changes unrelated to loop I pairing, which would point to another
      mechanism such as altered snRNP biogenesis.
    evidence:
    - reference: PMID:42856368
      reference_title: "A cross-tissue splicing signature as a quantitative biomarker for ReNU syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In a patient-derived induced pluripotent stem cell (iPSC) model of the recurrent RNU4-2 n.64_64insT variant, the splicing signature was fully recapitulated across all stages of differentiation into cortical neuron-like cells."
      explanation: >-
        Shows the design is feasible in the sibling disorder: a blood splicing
        signature carried over to iPSC-derived cortical neurons. Preprint, and
        about RNU4-2, not RNU5B-1.
  - experiment_id: rnu5b1_mutant_u5_fate
    name: Level and spliceosome incorporation of mutant U5B-1
    description: >-
      In patient lymphoblastoid cells and in the isogenic iPSC-derived neurons
      above, measure mature U5B-1 by allele-specific small RNA-seq or primer
      extension, compare with RNU5A-1 and total U5, and test whether mutant
      U5B-1 is found in U5 snRNP, tri-snRNP and spliceosome fractions by
      affinity purification or glycerol-gradient fractionation followed by
      allele-specific sequencing. Repeat with quality-control factors such as
      the NEXT-exosome or TUT4/7 depleted to see whether mutant U5B-1 is being
      degraded.
    would_support:
    - mechanistic_hypotheses#rnu5b1_snrna_qc_loss_or_poisoning
    would_refute:
    - mechanistic_hypotheses#rnu5b1_snrna_qc_loss_or_poisoning
    supporting_outcome:
    - >-
      Mutant U5B-1 is depleted relative to the wild-type allele and recovers when
      quality control is inhibited, or it is incorporated but splicing changes
      are broad rather than variant-specific.
    refuting_outcome:
    - >-
      Mutant U5B-1 accumulates at wild-type levels and is incorporated into
      spliceosomes, which leaves altered splice-site selection by the mutant
      loop as the more likely mechanism.
    evidence:
    - reference: PMID:42562572
      reference_title: "Multiple quality control checkpoints safeguard small nuclear RNA biogenesis and prevent assembly of aberrant spliceosomes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These pathways also repress mutant snRNAs associated with human developmental disorders."
      explanation: >-
        Motivates measuring mutant U5B-1 stability directly, since disease-mutant
        snRNAs can be degraded by these pathways.

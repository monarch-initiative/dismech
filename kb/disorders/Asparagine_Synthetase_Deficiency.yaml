    reference_title: Worsening of Seizures After Asparagine Supplementation in a Child with Asparagine Synthetase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "experienced worsening seizures, requiring discontinuation of the asparagine supplements"
    explanation: The first documented treatment attempt showed clinically important worsening.

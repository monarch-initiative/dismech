      label: L-asparagine
  presence: DECREASED
  frequency: VERY_FREQUENT
  context: >-
    CSF asparagine is typically low or undetectable, but a normal result does
    not exclude ASNSD. In a 13-family Saudi cohort, proposed CSF biochemical
    analysis had 83% sensitivity and 98% specificity.
  readouts:
  - target: Reduced De Novo Asparagine Synthesis

pathophysiology:
- name: ASNS Loss of Function
  description: >-
    Biallelic ASNS pathogenic variants (missense changes that reduce protein
    abundance or catalytic performance) abolish or diminish asparagine synthetase
    activity. ASNS is the glutamine-dependent enzyme (EC 6.3.5.4) that transfers
    ammonia from glutamine to aspartate to synthesize asparagine; loss of this
    activity is the initiating molecular lesion in ASNSD.
  genes:
  - preferred_term: ASNS
    term:
      id: hgnc:753
      label: ASNS
  molecular_functions:
  - preferred_term: asparagine synthase (glutamine-hydrolyzing) activity
    term:
      id: GO:0004066
      label: asparagine synthase (glutamine-hydrolyzing) activity
    modifier: DECREASED
  evidence:
  - reference: PMID:24139043
    reference_title: "Deficiency of asparagine synthetase causes congenital microcephaly and a progressive form of encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ASNS encodes the glutamine-dependent asparagine synthetase enzyme (EC 6.3.5.4), which catalyzes ammonia transfer from glutamine to aspartic acid via a β-aspartyl-AMP intermediate."
    explanation: Defines the asparagine synthetase catalytic activity lost in ASNSD.
  downstream:
  - target: Cerebral Asparagine Deficiency
    description: Loss of asparagine synthetase activity impairs de novo asparagine synthesis, which is critical in the brain.
    causal_link_type: DIRECT

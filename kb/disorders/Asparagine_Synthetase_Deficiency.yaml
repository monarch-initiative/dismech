    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "accumulation of aspartate/glutamate leading to enhanced excitability and"
    explanation: States the substrate-accumulation excitotoxicity hypothesis for the neuronal damage.
  - reference: PMID:27522229
    reference_title: "Epileptic Phenotype of Two Siblings with Asparagine Synthesis Deficiency Mimics Neonatal Pyridoxine-Dependent Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cytotoxic glutamate accumulation"
    explanation: Links ASNSD pathophysiology to cytotoxic glutamate accumulation shared with pyridoxine-dependent epilepsy.
  downstream:
  - target: Epileptic Encephalopathy and Progressive Cerebral Atrophy
    description: Excitotoxic and developmental injury drives intractable seizures with progressive neuronal loss and cerebral atrophy.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Excitatory-amino-acid neurotoxicity.
    - Diffuse neuronal loss and astrocytic gliosis.
    evidence:
    - reference: PMID:25227173
      reference_title: "Asparagine synthetase deficiency detected by whole exome sequencing causes congenital microcephaly, epileptic encephalopathy and psychomotor delay."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This condition is characterized by congenital microcephaly, severely delayed psychomotor development, progressive encephalopathy, and cortical atrophy"
      explanation: Ties the pathophysiology to epileptic encephalopathy and cortical atrophy.
- name: Epileptic Encephalopathy and Progressive Cerebral Atrophy
  description: >-
    The convergent endpoint of ASNSD is a severe epileptic encephalopathy with
    early-onset intractable seizures, status epilepticus, and myoclonus,
    accompanied by progressive cerebral atrophy with diffuse neuronal loss and
    astrocytic gliosis.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:24139043
    reference_title: "Deficiency of asparagine synthetase causes congenital microcephaly and a progressive form of encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their clinical course was characterized by profound developmental delay and, in a majority of cases, early-onset intractable seizures"
    explanation: Documents intractable seizures and profound developmental delay as the clinical endpoint.
mechanistic_hypotheses:
- hypothesis_group_id: asn_depletion

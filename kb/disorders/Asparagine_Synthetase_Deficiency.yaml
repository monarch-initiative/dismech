    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is particularly enriched in the cortical plate where the neurons reside"
    explanation: Localizes ASNS expression to cortical neurons and progenitor zones during development.
  - reference: PMID:24139043
    reference_title: "Deficiency of asparagine synthetase causes congenital microcephaly and a progressive form of encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that the cortical thickness and area of the Asns−/− brains were on average, ~14% thinner and ~5% smaller than their control littermates, respectively."
    explanation: Hypomorphic Asns mouse recapitulates reduced cortical thickness supporting a cortical-development role.
  downstream:
  - target: Progressive microcephaly
    description: Impaired cortical neurogenesis and brain growth produce microcephaly present at birth and worsening thereafter.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24139043
      reference_title: "Deficiency of asparagine synthetase causes congenital microcephaly and a progressive form of encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These children were born with a small head circumference and showed progressive microcephaly"
      explanation: Directly links the cortical-development defect to congenital and progressive microcephaly.
- name: Aspartate and Glutamate Excitotoxicity
  description: >-
    An alternative, non-exclusive mechanistic hypothesis: with asparagine
    synthesis blocked, the substrates aspartate and glutamate accumulate, and the
    resulting excitatory-amino-acid excess is proposed to cause enhanced neuronal
    excitability and excitotoxic damage. This overlaps mechanistically with
    pyridoxine-dependent epilepsy, where cytotoxic glutamate accumulation is
    implicated, and helps explain the severe epileptic encephalopathy.
  chemical_entities:
  - preferred_term: L-glutamic acid
    term:
      id: CHEBI:16015
      label: L-glutamic acid
    modifier: INCREASED
  - preferred_term: L-aspartic acid

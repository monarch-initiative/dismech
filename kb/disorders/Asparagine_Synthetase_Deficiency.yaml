      id: hgnc:753
      label: ASNS
  relationship_type: CAUSATIVE
  notes: >-
    Pathogenic alleles include missense, truncating, splice-altering, and rare
    copy-number variants. Functional severity varies; the entry therefore does
    not label every disease-associated allele as a complete null.
  evidence:
  - reference: PMID:24139043
    reference_title: Deficiency of asparagine synthetase causes congenital microcephaly and a progressive form of encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Critically, in all four families there is complete cosegregation of the identified ASNS mutations/genotypes with disease"

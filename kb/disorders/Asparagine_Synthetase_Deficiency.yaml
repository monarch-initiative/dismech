review_notes: >-
  A targeted 2026-07-20 review did not identify ASNSD-specific human, animal,
  or cell evidence for S-adenosylmethionine as a treatment; it was therefore
  not added. This avoids conflating ASNSD with methionine
  S-adenosyltransferase deficiency. The excitatory amino-acid branch and both
  dietary interventions are deliberately qualified at their observed evidence
  levels.

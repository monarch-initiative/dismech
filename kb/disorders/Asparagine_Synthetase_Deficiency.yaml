- name: Impaired Cortical Development
  description: >-
    ASNS is enriched in cortical-plate neurons and in the ventricular and
    subventricular-zone neural progenitors of the developing cerebral cortex.
    Deficient asparagine synthesis in these cells impairs cortical neurogenesis
    and brain growth, in a pattern resembling other microcephaly genes, producing
    congenital and progressive microcephaly. A hypomorphic Asns mouse model shows
    reduced cortical thickness and enlarged ventricles.
  cell_types:
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
    modifier: ABNORMAL
  biological_processes:
  - preferred_term: cerebral cortex development
    term:
      id: GO:0021987
      label: cerebral cortex development
    modifier: DECREASED

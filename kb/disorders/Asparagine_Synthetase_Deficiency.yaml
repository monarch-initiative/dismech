      snippet: "the levels of asparagine were decreased in at least two affected individuals"
      explanation: Reduced asparagine synthetase activity lowers asparagine levels in affected individuals.
- name: Cerebral Asparagine Deficiency
  description: >-
    Because asparagine crosses the blood-brain barrier poorly and ASNS is highly
    expressed in the brain, loss of enzyme activity produces a functional
    cerebral asparagine deficiency with a concomitant rise in the unused
    substrates glutamine and aspartate. Although asparagine is a non-essential
    amino acid systemically, its endogenous synthesis is required for normal
    brain development and function.
  biological_processes:

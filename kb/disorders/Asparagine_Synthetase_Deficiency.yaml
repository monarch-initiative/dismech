treatments:
- name: Supportive and symptomatic care
  description: >-
    No disease-modifying therapy is established for ASNSD; management is
    supportive, including antiseizure medication for the epileptic
    encephalopathy, nutritional/feeding support, and respiratory support.
    Dietary asparagine supplementation has been attempted but is limited by poor
    blood-brain-barrier penetration of asparagine.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care

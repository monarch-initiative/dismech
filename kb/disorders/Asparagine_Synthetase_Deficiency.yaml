name: Asparagine synthetase deficiency
creation_date: "2026-07-11T00:00:00Z"
category: Mendelian
synonyms:
- ASNSD
- ASNS deficiency
- Asparagine synthetase deficiency, ASNSD
- Congenital microcephaly - severe encephalopathy - progressive cerebral atrophy syndrome
description: >-
  Asparagine synthetase deficiency (ASNSD) is a very rare autosomal recessive
  inborn error of amino acid biosynthesis caused by biallelic loss-of-function
  variants in ASNS, which encodes the glutamine-dependent asparagine synthetase
  enzyme that catalyzes the synthesis of asparagine from aspartate and glutamine.
  Although asparagine is a non-essential amino acid, ASNS is highly expressed in
  the developing and adult brain, so its deficiency produces a severe,
  brain-restricted phenotype rather than a systemic metabolic crisis. Affected
  neonates present with congenital, progressive microcephaly, profound
  developmental delay, intractable epileptic encephalopathy, axial hypotonia
  with appendicular spasticity, a hyperekplexia-like exaggerated startle, and
  progressive cerebral atrophy. The neurological damage is attributed either to
  cerebral asparagine depletion impairing cortical development, or to
  accumulation of the substrates aspartate and glutamate producing
  excitotoxicity; most severely affected children die in infancy.

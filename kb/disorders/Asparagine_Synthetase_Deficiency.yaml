name: Asparagine synthetase deficiency
creation_date: "2026-07-11T00:00:00Z"
category: Mendelian
synonyms:
- ASNSD
- ASNS deficiency
- Congenital microcephaly-severe encephalopathy-progressive cerebral atrophy syndrome
description: >-
  Asparagine synthetase deficiency (ASNSD) is an ultra-rare autosomal
  recessive neurometabolic disorder caused by biallelic pathogenic variants in
  ASNS. ASNS catalyzes ATP-dependent synthesis of asparagine from aspartate,
  using glutamine as the nitrogen donor. The severe end of the spectrum
  presents congenitally or neonatally with progressive microcephaly, profound
  developmental impairment, axial hypotonia followed by spastic quadriplegia,
  early seizures, and cerebral atrophy; later-onset, milder disease is also
  documented. Plasma and cerebrospinal-fluid asparagine can be low but are not
  invariably abnormal, so molecular testing is central to diagnosis. Impaired
  cellular adaptation to limited extracellular asparagine is supported by
  patient-derived cells. A proposed contribution from cerebral
  aspartate/glutamate accumulation remains hypothetical and is not treated as
  an established mechanism.

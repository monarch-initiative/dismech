- name: Oral L-asparagine supplementation, experimental
  action_category: THERAPEUTIC
  description: >-
    Oral L-asparagine is not an established treatment. One child developed
    irritability, sleep disturbance, and worsening seizures that required
    discontinuation; two siblings later tolerated 24 months without seizure
    improvement and with only limited developmental observations. These
    uncontrolled and conflicting reports do not establish efficacy and document
    potential harm.
  treatment_term:
    preferred_term: amino acid supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
  evidence:

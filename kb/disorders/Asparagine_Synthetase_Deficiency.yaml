progression:
- phase: Severe congenital or neonatal presentation
  age_range: Prenatal development through early infancy
  notes: >-
    Congenital microcephaly can be followed within days or months by seizures,
    profound developmental impairment, worsening spasticity, feeding and
    respiratory complications, and progressive cerebral atrophy. Published
    mortality is high, but ascertainment of the most severe cases may inflate
    the apparent first-year mortality.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK525916/
    reference_title: Asparagine Synthetase Deficiency - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "median age of onset: 1 day; range: 1 day to 9 months"
    explanation: Current GeneReviews summarizes the early age-of-onset distribution.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK525916/
    reference_title: Asparagine Synthetase Deficiency - GeneReviews® - NCBI Bookshelf
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "because fewer than 100 affected individuals have been reported, it is possible that this represents the more severe end"
    explanation: The prognosis summary explicitly cautions about severe-spectrum ascertainment.
- phase: Later-onset or attenuated presentation
  age_range: Infancy through childhood
  notes: >-
    Some individuals have a period of apparently normal early development
    before seizures and regression, and may retain motor or cognitive skills
    not seen at the severe end of the spectrum.
  evidence:
  - reference: PMID:29279279
    reference_title: Characterization of a novel variant in siblings with Asparagine Synthetase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both siblings had a period of normal development before onset of seizures, and development regression."
    explanation: Two siblings with p.Arg49Gln expand the phenotype to later-onset disease.
mechanistic_hypotheses:
- hypothesis_group_id: asparagine_insufficiency_model
  hypothesis_label: Context-dependent cellular asparagine insufficiency model
  status: CANONICAL
  description: >-
    Reduced ASNS activity limits de novo asparagine synthesis. Cells in
    environments with limited extracellular asparagine, especially within the
    developing nervous system, cannot fully compensate, impairing proliferation
    and broader metabolism and contributing to abnormal brain growth.
  evidence:
  - reference: PMID:26318253
    reference_title: Asparagine Synthetase Deficiency causes reduced proliferation of cells under conditions of limited asparagine.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "there is markedly reduced proliferation of patient fibroblasts when cultured in asparagine-limited growth medium"
    explanation: Patient fibroblasts directly demonstrate context-dependent cellular vulnerability.
  - reference: PMID:37111157
    reference_title: Metabolomic Profiling of Asparagine Deprivation in Asparagine Synthetase Deficiency Patient-Derived Cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "significant decrements in TCA cycle intermediates and anaplerotic substrates in ASNS-deficient cells challenged with Asn deprivation"
    explanation: Independent patient-derived cell models show wider metabolic consequences during asparagine deprivation.
- hypothesis_group_id: excitatory_amino_acid_model
  hypothesis_label: Proposed cerebral excitatory amino-acid imbalance model
  status: ALTERNATIVE
  description: >-
    Aspartate and/or glutamate accumulation has been proposed to enhance
    excitability and neuronal injury. The observation is neither consistent
    across patients nor directly demonstrated in affected human brain, and
    glutamate is a reaction product rather than an unused substrate. This model
    is therefore retained as an alternative hypothesis only.
  evidence:
  - reference: PMID:24139043
    reference_title: Deficiency of asparagine synthetase causes congenital microcephaly and a progressive form of encephalopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These features suggest a mechanism that is consistent with the accumulation of aspartate/glutamate in the brain"
    explanation: The original report explicitly presents accumulation as a suggested mechanism.
  - reference: PMID:27522229
    reference_title: Epileptic Phenotype of Two Siblings with Asparagine Synthesis Deficiency Mimics Neonatal Pyridoxine-Dependent Epilepsy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "possibly related to cytotoxic glutamate accumulation"
    explanation: A two-sibling neuropathology report also frames glutamate accumulation as possible, not established.
pathophysiology:
- name: Biallelic ASNS Functional Deficiency
  description: >-
    Biallelic pathogenic ASNS variants reduce protein abundance, catalytic
    performance, or both. The initiating lesion is deficient
    glutamine-dependent asparagine synthetase activity rather than a uniform
    complete absence of enzyme in every genotype.
  mechanism_confidence: ESTABLISHED
  biological_scale: MOLECULAR

name: Osteofibrous Dysplasia
creation_date: "2026-10-13T00:00:00Z"
category: Mendelian
synonyms:
- Kempson-Campanacci lesion
- OFD
- ossifying fibroma of long bones
- cortical fibrous dysplasia
- osteofibrous dysplasia of bone
disease_term:
  preferred_term: osteofibrous dysplasia
  term:
    id: MONDO:0011806
    label: osteofibrous dysplasia
parents:
- skeletal dysplasia
notes: >-
  Scope, and why this is a Disease rather than a subtype of adamantinoma. OFD,
  OFD-like adamantinoma and classic adamantinoma have long been treated as one
  controversial spectrum, and Adamantinoma.yaml (MONDO:0002422) already carries OFD
  in its differential_diagnoses block with an open KNOWLEDGE_GAP discussion
  (adam_ofd_progression_sequence) asking whether they lie on a single histogenetic
  continuum. Three things support curating OFD separately. MONDO gives it a leaf
  term whose only parent is skeletal dysplasia, not a neoplasm branch. Its cause is
  known and specific - germline MET mutations abolishing splice inclusion of exon 14
  - where classic adamantinoma has no established driver. And a 2026 genomic study
  of all three entities concludes that classic adamantinoma and OFD might be
  genetically distinct, with the adamantinomas carrying arm-level copy-number gains
  that the OFDs lacked. That evidence is curated below and bears directly on the
  question the adamantinoma entry leaves open; it is an argument, not a settlement,
  and the discussion there should stay open.

  OFD is a RASopathy, and that is newly established rather than long known. The
  METΔJMD receptor signals through MAPK, MEK inhibition restores osteogenic
  differentiation in both mouse and patient-derived cells, and a treated patient
  achieved fracture union. kb/groupings/RASopathies.yaml exists and OFD is a
  candidate member on this evidence.

  Treated as a developmental disorder rather than a neoplasm, and that is a
  curation decision rather than a finding. MONDO's definition calls it a benign,
  usually self-limited fibro-osseous lesion, the familial lesion is germline, and
  the entry is categorised Mendelian, so the cancer granularity ladder in design
  decisions section 3a does not apply. The decision is contestable and the contrary
  evidence is curated rather than omitted: the same MONDO definition ends by noting
  that progression to adamantinoma has been reported in some cases, and clonal
  chromosomal abnormalities have been argued to indicate a clonal and possibly
  neoplastic origin. Both are recorded in the discussions entry above, the second
  as a REFUTE against this framing.
discussions:
- discussion_id: ofd_adamantinoma_progression_sequence
  prompt: >-
    Does osteofibrous dysplasia progress through an OFD-like adamantinoma
    intermediate to classic adamantinoma along a single histogenetic continuum, or
    are these diagnostically overlapping but biologically separate entities?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Osteogenic Differentiation of Skeletal Progenitors
  - histopathology#Scattered keratin-immunoreactive cells
  - differential_diagnoses#Classic adamantinoma
  rationale: >-
    The same question is recorded from the other side as
    adam_ofd_progression_sequence in Adamantinoma.yaml, and it is restated here so
    the gap is visible from both entries rather than only from the neoplasm.

    Evidence points both ways, and this entry's scoping decision rests on the
    weaker-committing reading, so the counter-position is stated rather than
    omitted. For separation: a genomic study of all three entities found arm-level
    copy-number gains in the classic adamantinomas and none in the OFDs, and
    concluded they might be genetically distinct; and a 19-case series saw no
    progression over a median 51 months. For a continuum: OFD contains scattered
    keratin-immunoreactive cells, pan-keratin is positive in roughly 95% of both
    lesions, clonal chromosomal abnormalities including trisomies 7, 8, 12 and 22
    have been reported in OFD and argued to indicate a clonal and possibly
    neoplastic origin, with trisomy 7 and 12 also reported in a clonally aberrant
    adamantinoma; and MONDO's own definition of this term ends by noting that
    progression to adamantinoma has been reported in some cases.
  evidence:
  - reference: PMID:8156503
    reference_title: Clonal chromosomal abnormalities in osteofibrous dysplasia. Implications for histopathogenesis and its relationship with adamantinoma.
    supports: REFUTE
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "these findings demonstrate a clonal and possibly neoplastic origin for osteofibrous dysplasia of long bone"
    explanation: >-
      Recorded as REFUTE against this entry's framing of OFD as a developmental
      disorder rather than a neoplasm. Graded INDIRECT because clonality is
      evidence from which neoplastic origin is inferred, and the authors say
      "possibly". This is the strongest cited argument against the scoping
      decision and is curated rather than left out.
  - reference: PMID:42379271
    reference_title: Genomic Characterization of Classic Adamantinoma, Osteofibrous Dysplasia, and Osteofibrous Dysplasia-like Adamantinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, classic adamantinomas and OFD might be genetically distinct."
    explanation: >-
      The argument for separation, in the authors' own hedged wording.
description: >-
  Osteofibrous dysplasia is a benign, usually self-limited fibro-osseous lesion of
  the cortical bone immediately beneath the periosteum of the tibia and fibula,
  presenting in infancy or childhood with swelling or painless bowing. It is a
  disorder of periosteal osteogenesis rather than a tumour of it. Germline MET
  mutations that abolish splice inclusion of exon 14 yield a receptor lacking the
  cytoplasmic juxtamembrane domain; because that domain carries the signal for
  ubiquitin-mediated degradation, the mature receptor is stabilised and acquires a
  ligand-dependent gain of function. The resulting MAPK signalling inhibits
  osteogenic differentiation of skeletal progenitor cells and impairs cortical bone
  development, which is why the lesion sits in cortex under periosteum and why its
  defining complication is a fracture that will not heal. Inheritance is autosomal
  dominant in the familial form, and somatic exon 14 mutations occur in unilateral
  disease. Management has historically been conservative, since surgery carries a
  high recurrence rate and lesions can regress spontaneously; the recognition that
  OFD is a skeletal RASopathy has produced a targeted treatment, with a
  MEK inhibitor achieving union in a patient with three years of pseudarthrosis.
pathophysiology:
- name: MET Exon 14 Splice Exclusion
  biological_scale: MOLECULAR
  description: >-
    The causal lesion. Mutations abolish splice inclusion of MET exon 14, so the
    translated receptor lacks the cytoplasmic juxtamembrane domain. Exclusion of
    this exon occurs during normal embryonic development, so the mutation does not
    create a novel protein but makes a developmentally transient isoform permanent.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
  genes:
  - preferred_term: MET
    term:
      id: hgnc:7029
      label: MET
  biological_processes:
  - preferred_term: regulated inclusion of MET exon 14, abolished by the mutation
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0000381
      label: regulation of alternative mRNA splicing, via spliceosome
  downstream:
  - target: Stabilised METdeltaJMD Receptor with Ligand-Dependent Gain of Function
    causal_link_type: DIRECT
    description: >-
      The juxtamembrane domain carries the degradation signal, so losing it
      stabilises the mature receptor.
  evidence:
  - reference: PMID:26637977
    reference_title: Mutations Preventing Regulated Exon Skipping in MET Cause Osteofibrous Dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations identified in all families with dominant inheritance and in the one simplex subject with bilateral disease abolished the splice inclusion of exon 14 in MET transcripts, which resulted in a MET receptor (MET(Δ14)) lacking a cytoplasmic juxtamembrane domain."
    explanation: >-
      The causal lesion and its immediate protein consequence, in the study that
      identified the gene.
  - reference: PMID:26637977
    reference_title: Mutations Preventing Regulated Exon Skipping in MET Cause Osteofibrous Dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified germline mutations in MET, encoding a receptor tyrosine kinase, that segregate with an autosomal-dominant form of OFD in three families and a mutation in a fourth affected subject from a simplex family and with bilateral disease."
    explanation: >-
      Establishes the gene, the germline origin and the autosomal-dominant
      segregation that this node's genetic_context records.
- name: Stabilised METdeltaJMD Receptor with Ligand-Dependent Gain of Function
  biological_scale: MOLECULAR
  description: >-
    The juxtamembrane domain carries the signal for ubiquitin-mediated degradation.
    Without it the receptor escapes turnover, accumulates, and acquires a
    ligand-dependent gain of function. A somatic exon 14 mutation in unilateral
    disease substitutes a tyrosine residue critical for receptor turnover and has
    the same stabilising effect, which is what ties the two variant origins to one
    mechanism.
  genes:
  - preferred_term: MET
    term:
      id: hgnc:7029
      label: MET
  molecular_functions:
  - preferred_term: MET receptor tyrosine kinase activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0004714
      label: transmembrane receptor protein tyrosine kinase activity
  downstream:
  - target: MAPK Pathway Activation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41746735
    reference_title: MEK inhibitor mirdametinib promotes fracture healing in osteofibrous dysplasia RASopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MET gene mutations reducing ubiquitin-mediated protein degradation via loss of the juxtamembrane domain (METΔJMD) were previously identified in patients with OFD, resulting in ligand-dependent gain of function."
    explanation: >-
      States the mechanism this node asserts: loss of the domain reduces
      ubiquitin-mediated degradation, and the consequence is a ligand-dependent
      gain of function rather than constitutive activity.
  - reference: PMID:26637977
    reference_title: Mutations Preventing Regulated Exon Skipping in MET Cause Osteofibrous Dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In an additional subject with unilateral OFD, we identified a somatic MET mutation, also affecting exon 14, that substituted a tyrosine residue critical for MET receptor turnover and, as in the case of the MET(Δ14) mutations, had a stabilizing effect on the mature protein."
    explanation: >-
      The somatic route to the same stabilised receptor, which is why unilateral
      disease is included in this entry rather than treated separately.
- name: MAPK Pathway Activation
  biological_scale: CELLULAR
  description: >-
    Signalling downstream of the stabilised receptor runs through MAPK. This is the
    step that makes OFD a skeletal RASopathy, and it is the step MEK inhibition
    acts on.
  biological_processes:
  - preferred_term: MAPK signalling downstream of METdeltaJMD
    modifier: INCREASED
    term:
      id: GO:0000165
      label: MAPK cascade
  downstream:
  - target: Impaired Osteogenic Differentiation of Skeletal Progenitors
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41746735
    reference_title: MEK inhibitor mirdametinib promotes fracture healing in osteofibrous dysplasia RASopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inhibition of MAPK signaling with MEK inhibitors restored osteogenic differentiation of mouse MetΔJMD skeletal progenitor cells and promoted the activation of transcriptional signatures associated with skeletal development and osteoblast differentiation in pseudarthrosis-derived primary cells from patients with OFD."
    explanation: >-
      Establishes MAPK as the operative pathway by rescuing the downstream defect
      when it is inhibited, in both mouse and patient-derived cells.
  - reference: PMID:41746735
    reference_title: MEK inhibitor mirdametinib promotes fracture healing in osteofibrous dysplasia RASopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Osteofibrous dysplasia (OFD) is a skeletal RASopathy presenting with periosteal bone lesions that may progress to fracture and delayed healing (pseudarthrosis)."
    explanation: >-
      Sources the RASopathy characterisation that this node and the entry's notes
      rest on.
- name: Impaired Osteogenic Differentiation of Skeletal Progenitors
  biological_scale: CELLULAR
  description: >-
    The functional consequence. Forced exon exclusion retards osteoblastic
    differentiation and inhibits bone-matrix mineralization in vitro, and METΔJMD
    expression inhibits osteogenic differentiation of skeletal progenitor cells.
    MET's role here is bidirectional: deleting Met instead enhances osteogenic
    differentiation of periosteal progenitors.
  cell_types:
  - preferred_term: skeletal progenitor cell of the periosteum
    term:
      id: CL:0007001
      label: skeletogenic cell
  biological_processes:
  - preferred_term: osteoblast differentiation
    modifier: DECREASED
    term:
      id: GO:0001649
      label: osteoblast differentiation
  downstream:
  - target: Impaired Cortical Bone Development
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26637977
    reference_title: Mutations Preventing Regulated Exon Skipping in MET Cause Osteofibrous Dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Splice exclusion of this domain occurs during normal embryonic development, and forced induction of this exon-exclusion event retarded osteoblastic differentiation in vitro and inhibited bone-matrix mineralization."
    explanation: >-
      The in vitro demonstration that the exon-exclusion event itself causes the
      differentiation defect.
  - reference: PMID:41746735
    reference_title: MEK inhibitor mirdametinib promotes fracture healing in osteofibrous dysplasia RASopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, conditional deletion of Met enhanced osteogenic differentiation of periosteal progenitor cells."
    explanation: >-
      The opposite-direction result that establishes MET as a bidirectional
      regulator here, and that locates the relevant cells in the periosteum.
- name: Impaired Cortical Bone Development
  biological_scale: TISSUE
  description: >-
    The lesion is cortical and subperiosteal because that is where the affected
    progenitors live. METΔJMD expression impairs cortical bone development and
    reduces bone stiffness, which is the substrate for bowing and for fracture that
    will not unite.
  locations:
  - preferred_term: tibial diaphysis
    term:
      id: UBERON:0013280
      label: diaphysis of tibia
  - preferred_term: periosteum
    term:
      id: UBERON:0002515
      label: periosteum
  downstream:
  - target: Intracortical radiolucent lesion
    causal_link_type: DIRECT
    description: >-
      The radiolucent lesion is the radiographic appearance of cortex that failed
      to form: fibro-osseous tissue occupies the subperiosteal cortical bone the
      affected progenitors did not build.
    evidence:
    - reference: PMID:26637977
      reference_title: Mutations Preventing Regulated Exon Skipping in MET Cause Osteofibrous Dysplasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Osteofibrous dysplasia (OFD) is a congenital disorder of osteogenesis and is typically sporadic and characterized by radiolucent lesions affecting the cortical bone immediately under the periosteum of the tibia and fibula."
      explanation: >-
        Names OFD as a disorder of osteogenesis and, in the same sentence, gives
        the radiolucent cortical lesion as what characterizes it. That is this
        edge: the failure of cortical osteogenesis presenting as the lesion.
  - target: Tibial bowing
    causal_link_type: DIRECT
  - target: Pathologic fracture
    causal_link_type: DIRECT
    description: >-
      Reduced cortical stiffness is what the fracture happens through, which is why
      fracture is an event of the growing tibia rather than of trauma alone.
    evidence:
    - reference: PMID:41746735
      reference_title: MEK inhibitor mirdametinib promotes fracture healing in osteofibrous dysplasia RASopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We engineered MetΔJMD mice and showed that MetΔJMD expression inhibited osteogenic differentiation of skeletal progenitor cells in vitro and impaired cortical bone development and reduced bone stiffness in vivo."
      explanation: >-
        Reduced bone stiffness is the measured property that makes the cortex liable
        to fracture, which is what this edge asserts.
  - target: Tibial pseudarthrosis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41746735
    reference_title: MEK inhibitor mirdametinib promotes fracture healing in osteofibrous dysplasia RASopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We engineered MetΔJMD mice and showed that MetΔJMD expression inhibited osteogenic differentiation of skeletal progenitor cells in vitro and impaired cortical bone development and reduced bone stiffness in vivo."
    explanation: >-
      Ties the cellular defect to the cortical bone phenotype and to reduced
      stiffness, which is the tissue-level claim here.
phenotypes:
- category: Skeletal
  name: Intracortical radiolucent lesion
  description: >-
    The defining finding: a radiolucent fibro-osseous lesion of the cortical bone
    immediately beneath the periosteum of the tibia and fibula. Soft tissue
    extension is absent and medullary involvement unusual, which is part of what
    separates it radiologically from adamantinoma.
  phenotype_term:
    preferred_term: radiolucent intracortical lesion of the tibial diaphysis
    term:
      id: HP:0003103
      label: Abnormal cortical bone morphology
    coarse_binding_basis: NO_HPO_TERM
  evidence:
  - reference: PMID:26637977
    reference_title: Mutations Preventing Regulated Exon Skipping in MET Cause Osteofibrous Dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Osteofibrous dysplasia (OFD) is a congenital disorder of osteogenesis and is typically sporadic and characterized by radiolucent lesions affecting the cortical bone immediately under the periosteum of the tibia and fibula."
    explanation: >-
      The definitional description of the lesion, its cortical and subperiosteal
      location, and the tibia-and-fibula distribution.
  - reference: PMID:38539216
    reference_title: "Osteofibrous dysplasia: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Soft tissue extension is not present, and intramedullary involvement is unusual"
    explanation: >-
      The radiological features that distinguish the lesion from adamantinoma.
  sequelae:
  - target: Bone pain
    causal_link_type: DIRECT
    description: >-
      The lesion is what hurts when the disease is symptomatic, though a large
      minority of lesions are painless and found incidentally.
    evidence:
    - reference: PMID:38539216
      reference_title: "Osteofibrous dysplasia: a narrative review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "OFD can present with asymptomatic, mass, pain, swelling, deformity (anterior bowing of the tibia), and even pathological fracture"
      explanation: >-
        Gives pain as one of the presentations of the lesion, alongside the
        asymptomatic one.
- category: Skeletal
  name: Bone pain
  description: >-
    Pain over the lesion, reported in about 31% of patients and the commonest
    presenting complaint. A substantial minority are asymptomatic and come to
    attention only on imaging taken for some other reason.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: pain over the tibial lesion
    term:
      id: HP:0002653
      label: Bone pain
  evidence:
  - reference: PMID:38539216
    reference_title: "Osteofibrous dysplasia: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with OFD about 31% had pain, 13% experienced tibial bowing, 19% suffered pathologic fracture"
    explanation: >-
      Gives the 31% figure for pain, the highest of the presenting features in
      this series.
  - reference: PMID:38539216
    reference_title: "Osteofibrous dysplasia: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OFD can present with asymptomatic, mass, pain, swelling, deformity (anterior bowing of the tibia), and even pathological fracture"
    explanation: >-
      Lists pain among the ways the lesion presents, and records that presentation
      may equally be asymptomatic.
- category: Skeletal
  name: Pathologic fracture
  description: >-
    Fracture through the weakened cortex, reported in about 19% of patients. It is
    the event preceding the pseudarthrosis this entry treats as its defining
    complication, and one of the indications for surgery before puberty.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: pathological fracture through the cortical lesion
    term:
      id: HP:0002756
      label: Pathologic fracture
  sequelae:
  - target: Tibial pseudarthrosis
    causal_link_type: DIRECT
    description: >-
      Healing across the fracture is delayed and may fail outright, leaving an
      established pseudarthrosis.
    evidence:
    - reference: PMID:41746735
      reference_title: MEK inhibitor mirdametinib promotes fracture healing in osteofibrous dysplasia RASopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Osteofibrous dysplasia (OFD) is a skeletal RASopathy presenting with periosteal bone lesions that may progress to fracture and delayed healing (pseudarthrosis)."
      explanation: >-
        States the fracture-to-pseudarthrosis progression this edge records.
  evidence:
  - reference: PMID:38539216
    reference_title: "Osteofibrous dysplasia: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with OFD about 31% had pain, 13% experienced tibial bowing, 19% suffered pathologic fracture"
    explanation: >-
      Gives the 19% figure for pathologic fracture in a reviewed patient series.
- category: Skeletal
  name: Tibial bowing
  description: >-
    Anterior bowing of the tibia, reported in about 13% of patients. It follows
    from the reduced stiffness of the affected cortex, and it is one of the
    deformities that brings a child to surgery before puberty.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: anterior tibial bowing
    term:
      id: HP:0002982
      label: Tibial bowing
  evidence:
  - reference: PMID:38539216
    reference_title: "Osteofibrous dysplasia: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with OFD about 31% had pain, 13% experienced tibial bowing, 19% suffered pathologic fracture"
    explanation: >-
      Gives the 13% figure for bowing in a reviewed patient series, which is the
      frequency recorded here.
  - reference: PMID:39042586
    reference_title: A genetic mouse model mimicking MET related human osteofibrous dysplasia is characterized by delays in fracture repair and defective osteogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Tibial involvement leads to bowing and predisposes to the development of a fracture which exhibit significantly delayed healing processes, leading to prolonged morbidity."
    explanation: >-
      States bowing as the consequence of tibial involvement, and bowing as what
      predisposes to the poorly healing fracture. The sentence describes the human
      clinical picture in the introduction of a mouse-model paper, so it is graded
      HUMAN_CLINICAL with quote_role BACKGROUND.
- category: Skeletal
  name: Tibial pseudarthrosis
  description: >-
    The defining complication. Fracture through the lesion heals poorly and may
    become an established pseudarthrosis, which is the problem targeted therapy was
    first used for.
  phenotype_term:
    preferred_term: pseudarthrosis after fracture through the lesion
    term:
      id: HP:0009736
      label: Tibial pseudarthrosis
  evidence:
  - reference: PMID:41746735
    reference_title: MEK inhibitor mirdametinib promotes fracture healing in osteofibrous dysplasia RASopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Osteofibrous dysplasia (OFD) is a skeletal RASopathy presenting with periosteal bone lesions that may progress to fracture and delayed healing (pseudarthrosis)."
    explanation: >-
      Names pseudarthrosis as the progression this phenotype records.
diagnosis:
- name: Plain radiography of the affected bone
  description: >-
    Radiography is the primary modality. Anteroposterior and lateral views of the
    affected segment show the intracortical lytic lesion, and also show the two
    things that change management: anterior bowing and fracture.
  evidence:
  - reference: PMID:38539216
    reference_title: "Osteofibrous dysplasia: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "anterior bowing deformity, even pathological fracture, could also be detected on the tibial x-rays"
    explanation: >-
      Radiography detects the deformity and the fracture, which is what makes it
      the first-line study here.
- name: Computed tomography for cortical extent
  description: >-
    CT is the better study for how far the lesion runs through the cortex and for
    periosteal reaction and fracture. It complements MRI rather than replacing it.
  diagnosis_term:
    preferred_term: computed tomography of the affected bone
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:38539216
    reference_title: "Osteofibrous dysplasia: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Computed tomography (CT) is better than MRI in evaluating cortical involvement, periosteal reaction, matrix mineralization, as well as pathological fractures"
    explanation: >-
      States what CT is better than MRI for, which is the indication recorded here.
- name: Adequate-volume biopsy to exclude adamantinoma
  description: >-
    The diagnostic risk that matters is sampling. A small or percutaneous biopsy can
    return osteofibrous dysplasia from a lesion that is adamantinoma elsewhere in
    its volume, so a large specimen is recommended whenever the two are in question.
    This is the practical counterpart of the differential this entry argues.
  evidence:
  - reference: PMID:38539216
    reference_title: "Osteofibrous dysplasia: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "percutaneous or other limited biopsy specimens might lead to sampling errors that should be considered, and a large tissue specimen is recommended for differentiation"
    explanation: >-
      Names the sampling error and the recommendation that follows from it.

inheritance:
- name: Autosomal dominant
  description: >-
    Familial OFD segregates as an autosomal-dominant trait. Somatic MET exon 14
    mutation accounts for at least some unilateral disease, so the entry covers both
    origins.
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:26637977
    reference_title: Mutations Preventing Regulated Exon Skipping in MET Cause Osteofibrous Dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified germline mutations in MET, encoding a receptor tyrosine kinase, that segregate with an autosomal-dominant form of OFD in three families and a mutation in a fourth affected subject from a simplex family and with bilateral disease."
    explanation: Segregation in three families establishes the inheritance pattern.
genetic:
- name: MET
  notes: >-
    The causal gene. Mutations act by abolishing splice inclusion of exon 14, which
    removes the juxtamembrane degradation signal; both germline and somatic exon 14
    events converge on the same stabilised receptor.
  gene_term:
    preferred_term: MET
    term:
      id: hgnc:7029
      label: MET
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:26637977
    reference_title: Mutations Preventing Regulated Exon Skipping in MET Cause Osteofibrous Dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Taken together, these data show that aberrant MET regulation via the juxtamembrane domain subverts core MET receptor functions that regulate osteogenesis within cortical diaphyseal bone."
    explanation: >-
      The authors' summary of the gene-to-mechanism link, naming the domain, the
      subverted function and the tissue.
  - reference: PMID:36875508
    reference_title: A case of neonatal osteofibrous dysplasia with novel CDK12 and DDR2 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "no other genetic aberrations have been identified"
    explanation: >-
      Recorded against overreading the MET association. Outside the familial MET
      cases no other genetic cause is established, and the paper that identified
      MET itself describes OFD as typically sporadic, so MET explains the familial
      and bilateral minority rather than the disease in general. The same report
      describes novel CDK12 and DDR2 variants in a neonate, and PMID:42379271
      found single-case KMT2A, KMT2D, PHOX2B and RIF1 changes across five OFDs;
      none is curated as causal here.
differential_diagnoses:
- name: Classic adamantinoma
  description: >-
    The central differential, and the reason this entry exists alongside
    Adamantinoma.yaml. The two are radiologically and histologically similar, and
    whether OFD progresses to adamantinoma is an open question recorded in that
    entry's discussions. Genomic evidence now suggests they are distinct entities.
  disease_term:
    preferred_term: adamantinoma
    term:
      id: MONDO:0002422
      label: adamantinoma
  distinguishing_features:
  - Known causal gene (MET exon 14) in OFD, against no established driver in classic adamantinoma
  - Arm-level copy-number gains present in classic adamantinoma and absent in OFD
  - Younger age at presentation
  evidence:
  - reference: PMID:42379271
    reference_title: Genomic Characterization of Classic Adamantinoma, Osteofibrous Dysplasia, and Osteofibrous Dysplasia-like Adamantinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, classic adamantinomas and OFD might be genetically distinct."
    explanation: >-
      The genomic argument for separating the two, which is what this entry's scope
      note rests on. Stated by the authors as a possibility rather than a
      settlement, and quoted as such.
  - reference: PMID:42379271
    reference_title: Genomic Characterization of Classic Adamantinoma, Osteofibrous Dysplasia, and Osteofibrous Dysplasia-like Adamantinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 3 classic adamantinomas harbored multiple copy number gains involving chromosome 7, 8, 10, 12, and/or 19."
    explanation: >-
      The specific finding behind the distinction: copy-number gains in the
      adamantinomas that the OFDs in the same cohort did not carry.
  - reference: PMID:41653544
    reference_title: "Clinicopathological analysis of osteofibrous dysplasia and adamantinoma: A single institution experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "median age for OFD (10 years) was lower than that of adamantinoma (25 years)."
    explanation: >-
      Sources the age difference listed among the distinguishing features above,
      which previously had no evidence item of its own.
- name: Fibrous dysplasia
  description: >-
    The differential most likely to be confused in practice, and the one this
    entry's own synonym "cortical fibrous dysplasia" invites. A 58-tumour review
    revised four lesions diagnosed as OFD to fibrous dysplasia. The discriminator
    is histological: osteoblastic rimming is present in OFD and conspicuously
    absent in fibrous dysplasia, which is GNAS-driven and typically medullary.
  distinguishing_features:
  - Osteoblastic rimming of woven trabeculae present in OFD, absent in fibrous dysplasia
  - Fibrous dysplasia is GNAS-driven; OFD is MET-associated in its familial form
  - OFD is intracortical and subperiosteal; fibrous dysplasia is typically medullary
  evidence:
  - reference: PMID:41653544
    reference_title: "Clinicopathological analysis of osteofibrous dysplasia and adamantinoma: A single institution experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "4 OFDs revised to FDs"
    explanation: >-
      Documents the misclassification rate in practice, which is why this
      differential is recorded rather than assumed obvious.
- name: Osteofibrous dysplasia-like adamantinoma
  description: >-
    The genuinely hard differential: a lesion with OFD architecture containing
    epithelial nests. Adamantinoma.yaml models it as a histopathology pattern
    rather than a separate entry.
  evidence:
  - reference: PMID:42379271
    reference_title: Genomic Characterization of Classic Adamantinoma, Osteofibrous Dysplasia, and Osteofibrous Dysplasia-like Adamantinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using genomics as the benchmark, OFD-like adamantinomas might be better delineated by light microscopy or p40 than by cytokeratin immunohistochemistry."
    explanation: >-
      States how the intermediate lesion is best distinguished, and by implication
      that cytokeratin is not the right tool.
histopathology:
- name: Storiform fibrovascular stroma with osteoblastic rimming
  description: >-
    The diagnostic histology: a loose storiform fibrovascular stroma containing
    woven bony trabeculae rimmed by osteoblasts. The rimming is what separates OFD
    from fibrous dysplasia, where it is conspicuously absent.
  evidence:
  - reference: PMID:38539216
    reference_title: "Osteofibrous dysplasia: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A loose storiform, fibrovascular stroma, and woven bony trabeculae with osteoblastic rimming"
    explanation: The defining histological appearance.
  - reference: PMID:38539216
    reference_title: "Osteofibrous dysplasia: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A key feature is the conspicuous absence of osteoblastic rimming"
    explanation: >-
      The contrasting feature in fibrous dysplasia, which is why rimming is the
      discriminator rather than an incidental observation.
- name: Scattered keratin-immunoreactive cells
  description: >-
    Individual keratin-positive cells occur in OFD, which is part of why the
    relationship to adamantinoma is contested. Keratin does not discriminate the
    two, being positive in roughly 95% of both; p40 and p63 are the useful markers
    for adamantinoma.
  evidence:
  - reference: PMID:38539216
    reference_title: "Osteofibrous dysplasia: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "individual keratin-immunoreactive cells can be detected"
    explanation: >-
      Records the epithelial cells found in OFD, the histological basis of the
      proposed continuum with adamantinoma.
  - reference: PMID:41653544
    reference_title: "Clinicopathological analysis of osteofibrous dysplasia and adamantinoma: A single institution experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "P40 (5/5, 100%) and p63 (6/8, 75%) were useful in the diagnosis of adamantinoma"
    explanation: >-
      The markers that do discriminate. Recorded because the same series found
      pan-keratin positive in roughly 95% of both lesions, so keratin positivity
      alone does not support a diagnosis of adamantinoma.
prevalence:
- population: Among primary bone tumors
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    About 0.2% of all primary bone tumors. Recorded as UNKNOWN measure_type because
    the source states a share of another tumour population rather than a population
    prevalence or incidence, and no numeric rate is entered for the same reason.
  evidence:
  - reference: PMID:38539216
    reference_title: "Osteofibrous dysplasia: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "accounting for approximately 0.2% of all primary bone tumors"
    explanation: Source for the rarity figure and its denominator.
progression:
- phase: Course through skeletal growth
  notes: >-
    The lesion is usually self-limited. Progression halts at skeletal maturity, and
    regression has been reported in a newborn within weeks of a minor fracture. A
    19-case series followed for a median of 51 months saw no progression to
    adamantinoma.
  evidence:
  - reference: PMID:38539216
    reference_title: "Osteofibrous dysplasia: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "progression stops with the reaching of skeletal maturity"
    explanation: The natural-history endpoint that makes the lesion self-limited.
  - reference: PMID:41653544
    reference_title: "Clinicopathological analysis of osteofibrous dysplasia and adamantinoma: A single institution experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the OFDs progressed to an adamantinoma during a median follow-up of 51.15 months"
    explanation: >-
      Observed absence of progression over a defined follow-up, which bears on the
      question recorded in discussions.
treatments:
- name: Conservative Management
  description: >-
    The historical standard, and still the default for an uncomplicated lesion.
    Surgery in childhood carries a high recurrence rate, and lesions can remodel and
    regress spontaneously, including after a minor fracture in a newborn.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: observation with radiographic follow-up
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:23774157
    reference_title: "Congenital osteofibrous dysplasia Campanacci: spontaneous postbioptic regression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgical intervention in this tumor entity at childhood age has been shown to have a high recurrence rate but due to lack of experience with newborns, guidelines do not exist."
    explanation: >-
      The argument against operating, and an explicit statement that guidelines do
      not exist for the youngest patients.
  - reference: PMID:23774157
    reference_title: "Congenital osteofibrous dysplasia Campanacci: spontaneous postbioptic regression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After a small open biopsy and spontaneous minor fracture, the lesion rapidly remodeled within 1½ months and almost completely regressed with restutio ad integrum."
    explanation: >-
      Documents spontaneous regression, which is why the lesion is described as
      usually self-limited and why observation is reasonable.
- name: Surgical Treatment of Progressive or Fractured Lesions
  description: >-
    Curettage, extraperiosteal excision and corrective osteotomy are the standard
    interventions, reserved for children with pathological fracture, deformity or an
    extensive lesion before puberty. Recurrence after curettage or excision is about
    25%, which is the reason an uncomplicated lesion is watched instead.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: curettage, extraperiosteal excision, or corrective osteotomy
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Pathologic fracture
    description: >-
      Surgery addresses the fracture and the deformity rather than the MET lesion
      upstream of them, which is why it does not prevent recurrence.
    evidence:
    - reference: PMID:38539216
      reference_title: "Osteofibrous dysplasia: a narrative review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Surgical intervention is an alternative for children with pathological fractures, deforming, and extensive lesions before puberty"
      explanation: >-
        The indication, which names pathological fracture first and is what this
        link points at.
  evidence:
  - reference: PMID:38539216
    reference_title: "Osteofibrous dysplasia: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Local curettage and excision have 25% recurrence postoperatively"
    explanation: >-
      The recurrence figure, which is the counterweight to operating and the reason
      conservative management remains the default.
- name: MEK Inhibition for Established Pseudarthrosis
  description: >-
    A targeted treatment, and a direct consequence of recognising OFD as a skeletal
    RASopathy. MEK inhibition restored osteogenic differentiation in
    MetΔJMD mouse progenitors and in pseudarthrosis-derived cells from patients, and
    mirdametinib achieved union in a child with three years of persistent
    pseudarthrosis. This is a single treated patient with preclinical support, not a
    trial result.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: MEK inhibitor therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mirdametinib
      term:
        id: NCIT:C52195
        label: Mirdametinib
  target_mechanisms:
  - target: MAPK Pathway Activation
    description: >-
      Inhibits the pathway downstream of the stabilised receptor, which is the step
      the rescue experiments act on.
    evidence:
    - reference: PMID:41746735
      reference_title: MEK inhibitor mirdametinib promotes fracture healing in osteofibrous dysplasia RASopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Inhibition of MAPK signaling with MEK inhibitors restored osteogenic differentiation of mouse MetΔJMD skeletal progenitor cells and promoted the activation of transcriptional signatures associated with skeletal development and osteoblast differentiation in pseudarthrosis-derived primary cells from patients with OFD."
      explanation: >-
        The mechanistic rescue that justifies pointing this treatment at the MAPK
        node rather than at the receptor or the lesion.
  evidence:
  - reference: PMID:41746735
    reference_title: MEK inhibitor mirdametinib promotes fracture healing in osteofibrous dysplasia RASopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With this preclinical support, we treated with the MEK inhibitor mirdametinib a pediatric patient with OFD who had a 3-year history of persistent pseudarthrosis, resulting in fracture union."
    explanation: >-
      The clinical result, quoted with its own framing as a single patient treated
      on preclinical support.
animal_models:
- name: MetΔJMD mouse
  species: Mouse
  genotype: MetΔJMD (juxtamembrane domain deleted)
  publication: PMID:41746735
  description: >-
    Engineered to express the juxtamembrane-deleted receptor found in patients, and
    the model in which MEK rescue was demonstrated before the patient was treated.
  modeled_mechanisms:
  - target: Impaired Osteogenic Differentiation of Skeletal Progenitors
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Reproduces the differentiation defect and, on MEK inhibition, its rescue.
    evidence:
    - reference: PMID:41746735
      reference_title: MEK inhibitor mirdametinib promotes fracture healing in osteofibrous dysplasia RASopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We engineered MetΔJMD mice and showed that MetΔJMD expression inhibited osteogenic differentiation of skeletal progenitor cells in vitro and impaired cortical bone development and reduced bone stiffness in vivo."
      explanation: Directly measures the cellular and tissue consequences this node asserts.
- name: Met exon 15 skipping mouse
  species: Mouse
  genotype: MetΔ15-HET (heterozygous Met exon 15 skipping)
  publication: PMID:39042586
  description: >-
    Heterozygous exon-skipping mouse built, in the authors' words, to imitate the
    human OFD mutation. The paper states no exon-number correspondence between
    mouse and human, so none is asserted here.
  modeled_mechanisms:
  - target: Tibial pseudarthrosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the delayed fracture repair that underlies pseudarthrosis, with
      decreased bone formation two weeks after fracture.
    limitations: >-
      The mouse develops no gross skeletal defect, so it does not reproduce the
      lesion itself or the bowing - only the repair failure downstream of it. The
      model therefore speaks to the fracture complication and not to lesion
      formation.
    evidence:
    - reference: PMID:39042586
      reference_title: A genetic mouse model mimicking MET related human osteofibrous dysplasia is characterized by delays in fracture repair and defective osteogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Although no gross skeletal defects were identified in the mice, fracture repair was delayed in MetΔ15-HET mice, with decreased bone formation observed 2-week postfracture."
      explanation: >-
        States both what the model reproduces and, in the same sentence, what it
        does not, which is the basis for the limitations recorded above.

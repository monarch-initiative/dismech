treatments:
- name: Normobaric high-flow oxygen
  description: >-
    High-concentration oxygen delivered at normal atmospheric pressure is the
    first-line treatment. It accelerates dissociation of CO from hemoglobin,
    shortening the elimination half-life of carboxyhemoglobin from several hours
    on room air to roughly 60-90 minutes. It is usually delivered via a
    non-rebreather mask.
  treatment_term:
    preferred_term: supplemental oxygen therapy
    term:
      id: NCIT:C94624
      label: Oxygen Therapy
  target_mechanisms:
  - target: Carboxyhemoglobin formation
    treatment_effect: INHIBITS
    description: Oxygen competes CO off hemoglobin and speeds carboxyhemoglobin elimination.
    evidence:
    - reference: PMID:26563790
      reference_title: "Carbon monoxide intoxication."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The cornerstone for treatment for CO poisoning is 100% oxygen using a tight-fitting mask for greater than 6 hours."
      explanation: Supports 100% oxygen therapy as the intervention that accelerates carboxyhemoglobin clearance.
  evidence:
  - reference: PMID:34053712
    reference_title: "Carbon Monoxide Poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The primary treatment for patients with carbon monoxide poisoning is supplemental oxygen, usually delivered via a nonrebreather mask."
    explanation: Supports supplemental (normobaric) oxygen as the primary treatment.
  - reference: PMID:26563790
    reference_title: "Carbon monoxide intoxication."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The cornerstone for treatment for CO poisoning is 100% oxygen using a tight-fitting mask for greater than 6 hours."
    explanation: Supports 100% oxygen as the cornerstone of therapy.
- name: Hyperbaric oxygen therapy
  description: >-
    Hyperbaric oxygen delivered at greater than atmospheric pressure further
    accelerates carboxyhemoglobin elimination, increases dissolved plasma oxygen,
    and is proposed to reduce delayed neurological sequelae. It is considered for
    severe poisoning, loss of consciousness, neurological deficits, myocardial
    ischemia, or pregnancy, though its exact indications remain debated.
  treatment_term:
    preferred_term: hyperbaric oxygen therapy
    term:
      id: NCIT:C38065
      label: Hyperbaric Oxygen Therapy
  target_mechanisms:
  - target: Carboxyhemoglobin formation
    treatment_effect: INHIBITS
    description: Hyperbaric pressure maximally accelerates CO displacement from hemoglobin.
    evidence:
    - reference: PMID:26563790
      reference_title: "Carbon monoxide intoxication."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The indications for treatment with hyperbaric oxygen to decrease the half-life of COHb remain controversial."
      explanation: Supports hyperbaric oxygen acting to decrease the carboxyhemoglobin half-life.
  - target: Platelet-neutrophil activation
    treatment_effect: INHIBITS
    description: Hyperbaric oxygen inhibits CD18-mediated neutrophil adhesion, interrupting the oxidative-inflammatory cascade proposed to drive delayed neurological injury.
    evidence:
    - reference: PMID:7710151
      reference_title: "Delayed neuropsychologic sequelae after carbon monoxide poisoning: prevention by treatment with hyperbaric oxygen."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "HBO treatment decreased the incidence of DNS after CO poisoning."
      explanation: Supports hyperbaric oxygen reducing delayed neurological sequelae, the clinical outcome of the neuroinflammatory cascade.
  evidence:
  - reference: PMID:12362006
    reference_title: "Hyperbaric oxygen for acute carbon monoxide poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cognitive sequelae at six weeks were less frequent in the hyperbaric-oxygen group"
    explanation: Randomized-trial evidence that hyperbaric oxygen reduces cognitive sequelae.
  - reference: PMID:7710151
    reference_title: "Delayed neuropsychologic sequelae after carbon monoxide poisoning: prevention by treatment with hyperbaric oxygen."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HBO treatment decreased the incidence of DNS after CO poisoning."
    explanation: Randomized-trial evidence that hyperbaric oxygen reduces delayed neurological sequelae.
  - reference: PMID:34053712
    reference_title: "Carbon Monoxide Poisoning."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Hyperbaric oxygen can also be used, but the exact indications are controversial."
    explanation: Notes that hyperbaric oxygen is used but its indications remain controversial.

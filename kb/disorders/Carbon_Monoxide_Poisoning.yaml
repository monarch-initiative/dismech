definitions:
- name: Clinical case definition for carbon monoxide poisoning
  definition_type: CASE_DEFINITION
  description: >-
    Carbon monoxide poisoning is a toxic-inhalation syndrome in which carbon
    monoxide binds hemoglobin and other heme proteins, producing tissue hypoxia
    and oxidative stress, confirmed by an elevated blood carboxyhemoglobin level
    in a compatible clinical and exposure context.
  scope: Disease-level clinical framing across acute poisoning and delayed sequelae
  evidence:
  - reference: PMID:34053712
    reference_title: "Carbon Monoxide Poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Carbon monoxide binds to hemoglobin and other heme molecules, causing tissue hypoxia and oxidative stress."
    explanation: Supports the core disease framing as heme-protein binding producing tissue hypoxia and oxidative stress.
  - reference: PMID:34053712
    reference_title: "Carbon Monoxide Poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "When there is concern for possible carbon monoxide poisoning, the diagnosis can be made via blood co-oximetry."
    explanation: Supports blood co-oximetry (carboxyhemoglobin measurement) as the confirmatory diagnostic anchor.
parents:

biochemical:
- name: Carboxyhemoglobin
  presence: INCREASED
  notes: >-
    Elevated blood carboxyhemoglobin (COHb), measured by co-oximetry, confirms
    CO exposure. Standard pulse oximetry cannot distinguish oxyhemoglobin from
    carboxyhemoglobin and reads falsely normal. COHb magnitude correlates
    imperfectly with clinical severity.
  evidence:
  - reference: PMID:34053712
    reference_title: "Carbon Monoxide Poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "When there is concern for possible carbon monoxide poisoning, the diagnosis can be made via blood co-oximetry."
    explanation: Supports blood carboxyhemoglobin by co-oximetry as the confirmatory biomarker.
- name: Lactate
  presence: INCREASED
  notes: >-
    Elevated serum lactate reflects impaired oxidative metabolism and metabolic
    acidosis, and is used as a marker of severity.

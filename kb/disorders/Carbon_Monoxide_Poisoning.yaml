name: Carbon Monoxide Poisoning
creation_date: "2026-07-09T00:00:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Environmental Health Disorder
- Gas Poisoning
synonyms:
- CO poisoning
- carbon monoxide toxicity
- carbon monoxide intoxication
description: >-
  Carbon monoxide poisoning is a toxic condition caused by inhalation of carbon
  monoxide (CO), a colorless, odorless gas produced by incomplete combustion of
  carbon-containing fuels. Common sources include faulty furnaces and heaters,
  fire smoke, motor vehicle exhaust, portable generators, indoor charcoal
  burning, and the metabolic conversion of inhaled methylene chloride (paint
  stripper). CO produces tissue hypoxia through several converging mechanisms:
  it binds hemoglobin with roughly 200 times the affinity of oxygen to form
  carboxyhemoglobin, reducing the oxygen-carrying capacity of blood and shifting
  the oxyhemoglobin dissociation curve leftward so that less oxygen is released
  to tissues; it binds and inhibits mitochondrial cytochrome c oxidase, causing
  histotoxic (cellular) hypoxia; and it triggers an oxidative and inflammatory
  cascade of platelet-neutrophil activation, reactive oxygen species, and lipid
  peroxidation that drives delayed neurological injury. The brain and heart, as
  the most oxygen-dependent organs, are most vulnerable. Clinical features range
  from headache, dizziness, nausea, and confusion to syncope, seizures,
  myocardial injury, coma, and death; a subset of survivors develop delayed
  neuropsychiatric sequelae. Treatment centers on high-flow normobaric oxygen
  and, for severe poisoning, hyperbaric oxygen therapy.

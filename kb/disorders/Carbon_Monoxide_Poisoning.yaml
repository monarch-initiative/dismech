prevalence:
- population: United States
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: COMMON
  rate_per_100000: 15.1
  notes: >-
    Approximately 50,000 people affected per year in the United States
    (normalized to the US population as roughly 15 per 100,000 per year).
    Modeled as an annual incidence of acute poisoning, not a chronic point
    prevalence.
  evidence:
  - reference: PMID:27753502
    reference_title: "Carbon Monoxide Poisoning: Pathogenesis, Management, and Future Directions of Therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Carbon monoxide (CO) poisoning affects 50,000 people a year in the United States."
    explanation: Provides the US annual burden used to derive the normalized incidence rate.
has_subtypes:
- name: Acute CO Poisoning
  description: >-
    Acute carbon monoxide poisoning follows a high-level exposure and presents
    with headache, dizziness, altered mental status, syncope, seizures,
    myocardial injury, coma, or death depending on the carboxyhemoglobin level
    and duration of exposure.
  evidence:
  - reference: PMID:35461624
    reference_title: "Carbon Monoxide Toxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinical effects can be diverse and include headache, dizziness, nausea, vomiting, syncope, seizures, coma, dysrhythmias, and cardiac ischemia, and severe toxicity generally affects the nervous and cardiovascular systems."
    explanation: Supports the acute multisystem presentation of carbon monoxide poisoning.
- name: Delayed Neuropsychiatric Sequelae
  display_name: Delayed Neurological Sequelae (DNS)
  description: >-
    A subset of survivors of acute CO poisoning develop delayed neuropsychiatric
    sequelae days to weeks after apparent recovery, including cognitive
    impairment, memory loss, parkinsonism, and behavioral changes, associated
    with demyelination and basal-ganglia (globus pallidus) injury.
  evidence:
  - reference: PMID:26563790
    reference_title: "Carbon monoxide intoxication."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Following resolution of acute symptoms there may be a lucid interval of 2-40 days before the development of delayed neurologic sequelae (DNS), with diffuse demyelination in the brain accompanied by lethargy, behavior changes, forgetfulness, memory loss, and parkinsonian features."
    explanation: Directly supports the delayed neuropsychiatric sequelae subtype and its demyelinating, biphasic character.
pathophysiology:
- name: Carboxyhemoglobin formation
  description: >-
    Inhaled carbon monoxide binds hemoglobin at the same heme iron sites used by
    oxygen, with an affinity roughly 200 times that of oxygen, forming
    carboxyhemoglobin (COHb). This reduces the oxygen-carrying capacity of blood.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  biological_processes:
  - preferred_term: oxygen transport
    modifier: DECREASED
    term:
      id: GO:0015671
      label: oxygen transport
  downstream:
  - target: Impaired tissue oxygen delivery
    description: Reduced oxygen-carrying capacity and leftward-shifted dissociation curve limit oxygen delivery and offloading to tissues.
    evidence:
    - reference: PMID:26563790
      reference_title: "Carbon monoxide intoxication."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Once CO is inhaled it binds with hemoglobin to form carboxyhemoglobin (COHb) with an affinity 200 times greater than oxygen that leads to decreased oxygen-carrying capacity and decreased release of oxygen to tissues leading to tissue hypoxia."
      explanation: Links carboxyhemoglobin formation to reduced oxygen delivery and tissue hypoxia.
  evidence:
  - reference: PMID:26563790
    reference_title: "Carbon monoxide intoxication."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Once CO is inhaled it binds with hemoglobin to form carboxyhemoglobin (COHb) with an affinity 200 times greater than oxygen that leads to decreased oxygen-carrying capacity and decreased release of oxygen to tissues leading to tissue hypoxia."
    explanation: Directly supports carboxyhemoglobin formation with ~200x oxygen affinity and reduced oxygen-carrying capacity.
- name: Leftward shift of the oxyhemoglobin dissociation curve
  description: >-
    Binding of CO to one or more heme sites increases the oxygen affinity of the
    remaining sites on the hemoglobin tetramer, shifting the oxyhemoglobin
    dissociation curve to the left so that bound oxygen is released less readily
    at the tissues, worsening tissue hypoxia beyond what the reduced
    oxygen-carrying capacity alone would cause.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  downstream:
  - target: Impaired tissue oxygen delivery
    description: The impaired oxygen release compounds the hypoxic insult.
  evidence:
  - reference: PMID:26563790
    reference_title: "Carbon monoxide intoxication."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "decreased release of oxygen to tissues leading to tissue hypoxia"
    explanation: Supports impaired oxygen offloading (the functional consequence of the leftward shift) as a driver of tissue hypoxia.
- name: Impaired tissue oxygen delivery
  description: >-
    The combination of reduced carboxyhemoglobin-limited oxygen carriage and
    impaired oxygen offloading produces systemic tissue hypoxia, most severely
    affecting the oxygen-dependent brain and heart.
  biological_processes:
  - preferred_term: cellular response to hypoxia
    modifier: INCREASED
    term:
      id: GO:0071456
      label: cellular response to hypoxia
  downstream:
  - target: Cerebral hypoxic-ischemic injury
    description: Hypoxia in the brain produces neuronal injury and encephalopathy.
  - target: Myocardial ischemic injury
    description: Hypoxia in the heart produces myocardial ischemia and injury.
  evidence:
  - reference: PMID:34053712
    reference_title: "Carbon Monoxide Poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Carbon monoxide binds to hemoglobin and other heme molecules, causing tissue hypoxia and oxidative stress."
    explanation: Supports systemic tissue hypoxia as the central consequence of carbon monoxide binding.
- name: Cytochrome c oxidase inhibition
  description: >-
    Carbon monoxide binds the ferrous iron of mitochondrial cytochrome c oxidase
    (Complex IV of the electron transport chain), directly inhibiting oxidative
    phosphorylation. This produces histotoxic (cellular) hypoxia independent of
    oxygen delivery, impairing ATP generation even where oxygen is present, and
    helps explain the persistence of symptoms after carboxyhemoglobin normalizes.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  - preferred_term: mitochondrial electron transport, cytochrome c to oxygen
    modifier: DECREASED
    term:
      id: GO:0006123
      label: mitochondrial electron transport, cytochrome c to oxygen
  downstream:
  - target: Cellular energy failure
    description: Inhibition of oxidative phosphorylation depletes cellular ATP.
  - target: Oxidative stress and free radical generation
    description: Mitochondrial dysfunction generates reactive oxygen species and free radicals.
  evidence:
  - reference: PMID:9584335
    reference_title: "Mitochondrial cytochrome c oxidase inhibition during acute carbon monoxide poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cytochrome c oxidase (complex IV) activity showed a 76% inhibition compared to controls during acute poisoning (P < 0.01) and 48% at day 3 (P < 0.05)."
    explanation: Direct human evidence of marked cytochrome c oxidase inhibition during acute CO poisoning.
  - reference: PMID:9584335
    reference_title: "Mitochondrial cytochrome c oxidase inhibition during acute carbon monoxide poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that mitochondrial cytochrome c oxidase is also a target site in human acute CO poisoning, and its extended and generalized inhibition could explain the persistence of different symptoms after the normalization of HbCO levels."
    explanation: Supports cytochrome c oxidase as a COHb-independent target explaining persistent symptoms.
- name: Cellular energy failure
  description: >-
    Inhibition of oxidative phosphorylation, together with tissue hypoxia,
    depletes cellular ATP and forces a shift to anaerobic metabolism, producing
    lactic acidosis and cellular energy failure across multiple organs.
  biological_processes:
  - preferred_term: aerobic respiration
    modifier: DECREASED
    term:
      id: GO:0009060
      label: aerobic respiration
  downstream:
  - target: Xanthine oxidase-mediated reactive oxygen species generation
    description: Energy deprivation and purine catabolism drive conversion of xanthine dehydrogenase to reactive-oxygen-species-generating xanthine oxidase.
  evidence:
  - reference: PMID:27753502
    reference_title: "Carbon Monoxide Poisoning: Pathogenesis, Management, and Future Directions of Therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "likely result from the pleiotropic effects of CO on cellular mitochondrial respiration, cellular energy utilization, inflammation, and free radical generation, especially in the brain and heart."
    explanation: Supports impaired cellular energy utilization as a core downstream effect of CO.
- name: Oxidative stress and free radical generation
  description: >-
    Mitochondrial dysfunction and the displacement of nitric oxide from
    hemoproteins generate reactive oxygen species, free radicals, and
    nitric-oxide-derived species, producing oxidative injury across multiple
    organs.
  biological_processes:
  - preferred_term: response to oxidative stress
    modifier: INCREASED
    term:
      id: GO:0006979
      label: response to oxidative stress
  downstream:
  - target: Platelet-neutrophil activation
    description: Nitric-oxide displacement and oxidative changes promote intravascular platelet-neutrophil activation.
  - target: Brain lipid peroxidation
    description: Reactive oxygen species peroxidize brain membrane and myelin lipids.
  evidence:
  - reference: PMID:24773392
    reference_title: "The role of reactive oxygen species and oxidative stress in carbon monoxide toxicity: an in-depth analysis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "One of the current hypotheses with regard to the molecular mechanism of CO poisoning is the oxidative injury induced by reactive oxygen species, free radicals, and neuronal nitric oxide."
    explanation: Supports oxidative injury by reactive oxygen species, free radicals, and nitric oxide as a core molecular mechanism.
- name: Platelet-neutrophil activation
  description: >-
    Acute CO poisoning triggers intravascular platelet-neutrophil aggregation and
    neutrophil activation with myeloperoxidase release, initiating a
    reperfusion-injury-like oxidative cascade in the cerebral microvasculature.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: platelet aggregation
    modifier: INCREASED
    term:
      id: GO:0070527
      label: platelet aggregation
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Xanthine oxidase-mediated reactive oxygen species generation
    description: Neutrophil adherence to the cerebral microvasculature drives conversion of xanthine dehydrogenase to xanthine oxidase.
    evidence:
    - reference: PMID:8248931
      reference_title: "Leukocytes in carbon monoxide-mediated brain oxidative injury."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Neither of these groups of animals exhibited the biochemical changes observed in the brains of sham-treated rats: conversion of xanthine dehydrogenase (XD) to sulfhydryl-irreversible xanthine oxidase (XO), and lipid peroxidation, at 90 min following CO poisoning."
      explanation: Blocking leukocyte adherence prevents the xanthine oxidase conversion and lipid peroxidation, linking neutrophil activation to the oxidative cascade.
  evidence:
  - reference: PMID:16931637
    reference_title: "Intravascular neutrophil activation due to carbon monoxide poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acute CO poisoning causes intravascular neutrophil activation due to interactions with platelets."
    explanation: Directly supports platelet-driven intravascular neutrophil activation in CO poisoning.
  - reference: PMID:16931637
    reference_title: "Intravascular neutrophil activation due to carbon monoxide poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelet-neutrophil aggregates were detected and plasma myeloperoxidase (MPO) concentration was significantly elevated in those with confirmed CO poisoning."
    explanation: Human patient data confirm platelet-neutrophil aggregates and myeloperoxidase release in confirmed CO poisoning.
- name: Xanthine oxidase-mediated reactive oxygen species generation
  description: >-
    Energy deprivation and neutrophil-driven signaling convert xanthine
    dehydrogenase to xanthine oxidase, which generates reactive oxygen species
    and drives a postischemic reperfusion-like oxidative injury in the brain.
  biological_processes:
  - preferred_term: reactive oxygen species metabolic process
    modifier: INCREASED
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
  downstream:
  - target: Brain lipid peroxidation
    description: Xanthine oxidase-derived reactive oxygen species peroxidize brain lipids.
    evidence:
    - reference: PMID:1447108
      reference_title: "Dehydrogenase conversion to oxidase and lipid peroxidation in brain after carbon monoxide poisoning."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results are consistent with the view that CO-mediated brain injury is a type of postischemic reperfusion phenomenon and indicate that xanthine oxidase-derived reactive oxygen species are responsible for lipid peroxidation."
      explanation: Rat data link xanthine oxidase-derived reactive oxygen species to brain lipid peroxidation.
  evidence:
  - reference: PMID:1447108
    reference_title: "Dehydrogenase conversion to oxidase and lipid peroxidation in brain after carbon monoxide poisoning."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The conversion of xanthine dehydrogenase to xanthine oxidase and lipid peroxidation were measured in brain from carbon monoxide- (CO) poisoned rats."
    explanation: Supports xanthine dehydrogenase-to-oxidase conversion generating the oxidative injury.
  - reference: PMID:24773392
    reference_title: "The role of reactive oxygen species and oxidative stress in carbon monoxide toxicity: an in-depth analysis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The underlying mechanism of the central nervous system (CNS) injury after acute carbon monoxide (CO) poisoning is interlaced with multiple factors including apoptosis, abnormal inflammatory responses, hypoxia, and ischemia/reperfusion-like problems."
    explanation: Supports the ischemia/reperfusion-like oxidative character of the injury.
- name: Brain lipid peroxidation
  description: >-
    Reactive oxygen species peroxidize brain membrane and myelin lipids.
    Peroxidation products such as malondialdehyde form adducts with myelin basic
    protein, generating the antigenic modification that initiates delayed injury.
  biological_processes:
  - preferred_term: lipid oxidation
    modifier: INCREASED
    term:
      id: GO:0034440
      label: lipid oxidation
  downstream:
  - target: Immune-mediated neuroinflammation
    description: Adducts between peroxidation products and myelin basic protein become antigenic and initiate an immune response.
  evidence:
  - reference: PMID:2341364
    reference_title: "Carbon monoxide-mediated brain lipid peroxidation in the rat."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "brain lipid peroxidation could be documented as a result of exposure to CO at a concentration sufficient to cause unconsciousness."
    explanation: Rat data support brain lipid peroxidation as a downstream consequence of CO exposure.
  - reference: PMID:15342916
    reference_title: "Delayed neuropathology after carbon monoxide poisoning is immune-mediated."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CO poisoning also causes adduct formation between myelin basic protein (MBP) and malonylaldehyde, a reactive product of lipid peroxidation, resulting in an immunological cascade."
    explanation: Supports myelin basic protein adduct formation from lipid peroxidation initiating an immunological cascade.
- name: Immune-mediated neuroinflammation
  description: >-
    Chemically modified myelin basic protein becomes antigenic, provoking an
    adaptive immune response with macrophage and CD4+ lymphocyte influx and
    microglial activation that drives delayed central nervous system injury.
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: adaptive immune response
    modifier: INCREASED
    term:
      id: GO:0002250
      label: adaptive immune response
  downstream:
  - target: Delayed demyelination
    description: The adaptive immune response against modified myelin basic protein drives demyelination.
    evidence:
    - reference: PMID:15342916
      reference_title: "Delayed neuropathology after carbon monoxide poisoning is immune-mediated."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results demonstrate that delayed CO-mediated neuropathology is linked to an adaptive immunological response to chemically modified MBP."
      explanation: Rat data establish the adaptive immune response to modified myelin basic protein as the cause of delayed neuropathology.
  evidence:
  - reference: PMID:15342916
    reference_title: "Delayed neuropathology after carbon monoxide poisoning is immune-mediated."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Immunohistochemical evidence of degraded MBP occurs in brain over days, along with influx of macrophages and CD-4 lymphocytes."
    explanation: Supports progressive immune-mediated myelin degradation with macrophage and CD4 lymphocyte influx.
- name: Cerebral hypoxic-ischemic injury
  description: >-
    Acute hypoxia preferentially injures metabolically demanding regions of the
    brain, including the basal ganglia (especially the globus pallidus) and deep
    white matter, producing acute encephalopathy and a substrate for later
    parkinsonism and cognitive dysfunction.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: positive regulation of neuron apoptotic process
    modifier: INCREASED
    term:
      id: GO:0043525
      label: positive regulation of neuron apoptotic process
  downstream:
  - target: Delayed neuronal injury
    description: Acute ischemic injury and ongoing oxidative-inflammatory injury converge on delayed neuronal injury.
  evidence:
  - reference: PMID:26563790
    reference_title: "Carbon monoxide intoxication."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "White-matter damage in the centrum semiovale and periventricular area and abnormalities in the globus pallidus are most commonly seen on MRI following CO exposure."
    explanation: Supports the characteristic globus pallidus and white-matter localization of CO brain injury.
  - reference: PMID:16537269
    reference_title: "Basal ganglia lesions following carbon monoxide poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Carbon monoxide (CO) is the most common cause of poisoning and may result in basal ganglia lesions."
    explanation: Human cohort/literature review supports basal ganglia lesions as a consequence of CO poisoning.
- name: Delayed demyelination
  description: >-
    Days to weeks after acute poisoning, immune-mediated demyelination of
    cerebral white matter produces the leukoencephalopathy characteristic of
    delayed neurological sequelae.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: myelination
    modifier: ABNORMAL
    term:
      id: GO:0042552
      label: myelination
  downstream:
  - target: Delayed neuronal injury
    description: White-matter demyelination contributes to delayed neuronal dysfunction and injury.
  evidence:
  - reference: PMID:27753502
    reference_title: "Carbon Monoxide Poisoning: Pathogenesis, Management, and Future Directions of Therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Imaging studies reveal cerebral white matter hyperintensities, with delayed posthypoxic leukoencephalopathy or diffuse brain atrophy."
    explanation: Supports delayed white-matter (demyelinating) injury demonstrated on imaging.
- name: Delayed neuronal injury
  description: >-
    Immune-mediated and hypoxic-ischemic injury converge on neuronal loss,
    particularly in basal ganglia and hippocampus, producing the delayed
    neuropsychiatric sequelae of cognitive impairment, memory loss, and
    parkinsonism.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neuron apoptotic process
    modifier: INCREASED
    term:
      id: GO:0051402
      label: neuron apoptotic process
  evidence:
  - reference: PMID:15342916
    reference_title: "Delayed neuropathology after carbon monoxide poisoning is immune-mediated."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CO poisoning causes a decrement in learning that is not observed in immunologically tolerant rats."
    explanation: Rat data link the immune-mediated injury to a functional learning deficit, the model correlate of delayed neuronal injury.
- name: Myocardial ischemic injury
  description: >-
    Reduced oxygen delivery, direct binding of CO to myoglobin, and mitochondrial
    dysfunction impair cardiac oxygen supply and utilization, producing
    myocardial stunning, ischemia, left ventricular dysfunction, and arrhythmia;
    myocardial injury predicts increased short- and long-term mortality.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: cellular response to hypoxia
    modifier: INCREASED
    term:
      id: GO:0071456
      label: cellular response to hypoxia
  evidence:
  - reference: PMID:24518173
    reference_title: "Cardiovascular Abnormalities in Carbon Monoxide Poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cardiovascular complications of CO poisoning has been well reported and include myocardial stunning, left ventricular dysfunction, pulmonary edema, and arrhythmias."
    explanation: Supports the myocardial injury phenotype (stunning, LV dysfunction, arrhythmia) of CO poisoning.
  - reference: PMID:24518173
    reference_title: "Cardiovascular Abnormalities in Carbon Monoxide Poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Myocardial toxicity from CO exposure is associated with increased short-term and long-term mortality."
    explanation: Supports the prognostic significance of CO-related myocardial injury.

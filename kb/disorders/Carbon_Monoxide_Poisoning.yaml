discussions:
- discussion_id: gap_co_hbo_patient_selection
  prompt: >-
    Which carbon monoxide poisoning patients derive a durable neurological
    benefit from hyperbaric oxygen therapy, and by what mechanism?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Hyperbaric oxygen therapy
  - pathophysiology#Delayed neuronal injury
  rationale: >-
    Randomized trials conflict. Thom 1995 and Weaver 2002 found that hyperbaric
    oxygen reduced delayed/cognitive sequelae, whereas Scheinkestel 1999 found
    no benefit and even worse outcomes on some measures, using a different
    protocol and patient mix. The subset of patients who benefit, the optimal
    timing and pressure, and whether the benefit comes from faster CO clearance
    or from interrupting the immune-mediated demyelination cascade remain
    unresolved.
  evidence:
  - reference: PMID:10092916
    reference_title: "Hyperbaric or normobaric oxygen for acute carbon monoxide poisoning: a randomised controlled clinical trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "HBO patients had a worse outcome in the learning test at completion of treatment (P = 0.01 for all patients; P = 0.005 for severely poisoned patients)"
    explanation: Provides the negative-trial evidence that motivates the open question about which patients benefit from hyperbaric oxygen.
- discussion_id: mismatch_co_rodent_mbp_autoimmunity
  prompt: >-
    Does the rodent anti-myelin-basic-protein autoimmune mechanism of delayed
    neuropathology quantitatively explain human delayed neurological sequelae?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Immune-mediated neuroinflammation
  - pathophysiology#Delayed demyelination
  rationale: >-
    The adaptive-immune, anti-MBP mechanism of delayed CO neuropathology is
    established chiefly in rats, where immunological tolerance to MBP before
    poisoning abolishes the learning deficit, demonstrating causation. Its
    quantitative fidelity to human delayed neurological sequelae is not
    established; human delayed encephalopathy is heterogeneous and the
    contribution of MBP autoimmunity relative to hypoxic-ischemic injury in
    people remains an open translational question.
  evidence:
  - reference: PMID:15342916
    reference_title: "Delayed neuropathology after carbon monoxide poisoning is immune-mediated."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results demonstrate that delayed CO-mediated neuropathology is linked to an adaptive immunological response to chemically modified MBP."
    explanation: Establishes the immune-mediated mechanism in the rat model whose translational validity to humans is the open question.
datasets:
- accession: geo:GSE94780
  title: Gene expression in rat striatum following carbon monoxide poisoning and hypoxic hypoxia
  description: We have proposed the existence of a threshold for brain damage, in terms of hydroxyl radical production in rat striatum, between poisoning of carbon monoxide (CO) at 1000 ppm and 3000 ppm, where blood CO-hemoglobin levels reach approximately 50% and over 70%, respectively. To search for factors involved in brain damage, we examined the effects of air, 1000 ppm CO, 3000 ppm CO and 5% O2 (hypoxic conditions comparable with those by 3000 ppm CO) on gene expression in rat striatum, using microarray analysis.
  organism:
    preferred_term: rat
    term:
      id: NCBITaxon:10116
      label: Rattus norvegicus
  data_type: MICROARRAY
  sample_count: 12
  notes: Identified by GEO DataSets index search for Carbon Monoxide Poisoning (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.

  - target: Carboxyhemoglobin formation
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Unlike the combustion sources, no carbon monoxide is inhaled here: the
      inhaled solvent is metabolized by hepatic CYP2E1 to carbon monoxide, so

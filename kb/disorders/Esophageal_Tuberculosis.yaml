    thickened wall or mass with disrupted layers continuous with the nodes.
  biological_scale: TISSUE
  locations:
  - preferred_term: thoracic part of esophagus
    term:
      id: UBERON:0035216
      label: thoracic part of esophagus
  evidence:
  - reference: PMID:28575247
    reference_title: "Endoscopic ultrasound in diagnosis of esophageal tuberculosis: 10-year experience at a tertiary care center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Esophageal wall thickening or mass formation with disruption of the
      adventitia due to infiltration by adjacent mediastinal lymphadenopathy

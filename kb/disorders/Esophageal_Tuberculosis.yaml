  description: >-
    Series define definite disease as granulomas, with or without caseation,
    or acid-fast bacilli in an esophageal biopsy or an aspirate of the
    adjacent mediastinal nodes, together with compatible clinical features
    and a response to antituberculous therapy. Where tissue is repeatedly
    non-diagnostic, a trial of therapy guided by the endoscopic ultrasound
    pattern has been used, with follow-up to confirm the response.

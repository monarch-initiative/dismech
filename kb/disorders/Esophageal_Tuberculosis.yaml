name: Esophageal Tuberculosis
creation_date: "2026-11-27T00:24:22Z"
description: >-
  Esophageal tuberculosis is tuberculosis of the esophagus and one of the
  rarest forms of extrapulmonary and gastrointestinal tuberculosis. Most cases
  are secondary: caseating tuberculous lymph nodes of the mediastinum, usually
  the subcarinal group, compress the mid-esophagus and then rupture into its
  wall, and less often the esophagus is reached by direct extension from the
  lung or a tuberculous spine. Primary disease, with no tuberculous focus
  outside the esophagus, is rare and is attributed to swallowed bacilli.
  Dysphagia is the main symptom, with retrosternal pain, odynophagia and
  constitutional symptoms such as anorexia, weight loss and fever. Endoscopy
  usually shows a mid-esophageal ulcer, an extrinsic bulge with or without an
  ulcer at its summit, or a pseudotumour, and the lesion is often mistaken for
  esophageal carcinoma. Transmural disease can form tracheoesophageal,
  bronchoesophageal or esophagomediastinal fistulas, strictures and traction
  diverticula, and erosion into the aorta can cause fatal hematemesis.
  Diagnosis rests on endoscopic biopsy or endoscopic ultrasound-guided
  aspiration of the adjacent nodes showing granulomas or acid-fast bacilli,
  supported by PCR, culture and chest CT showing mediastinal lymphadenopathy.
  Standard antituberculous chemotherapy cures nearly all patients, including
  most with fistulas; endoscopic closure, stenting and surgery are reserved
  for complications.
category: Infectious Disease
disease_term:
  preferred_term: esophageal tuberculosis
  term:
    id: MONDO:0004189
    label: esophageal tuberculosis
parents:
- Tuberculosis
- Extrapulmonary tuberculosis
- Gastrointestinal tuberculosis
synonyms:
- oesophageal tuberculosis
- tuberculosis of the esophagus
- tuberculous esophagitis
notes: >-
  The literature is retrospective single-centre case series of 4 to 35
  patients, case reports, and reviews, including one systematic review that
  pooled 311 patients from 22 studies. No prospective or controlled study
  exists, and the route by which the bacillus reaches the esophagus is
  inferred from imaging, endoscopic ultrasound and operative findings rather
  than demonstrated. Symptom frequencies differ between series and are set
  only where a cited source quotes a figure; the pooled systematic review is
  preferred where it gives one. The share of patients with HIV infection is
  not reported in any cached abstract, so HIV is recorded as a risk factor
  without a figure. An HPO term for non-spontaneous esophageal perforation was
  searched for in OLS ("esophageal perforation" returns only HP:0005203
  Spontaneous esophageal perforation), so perforation and the
  esophagomediastinal and aortoesophageal fistulas are described in the
  pathophysiology rather than bound as phenotypes. Seeded from PubMed searches
  and `research/Esophageal_Tuberculosis-deep-research-claude_code.md`.
review_notes: >-
  Deliberately lumped. All esophageal tuberculosis is kept in one entry
  regardless of the infecting Mycobacterium tuberculosis complex organism,
  lineage or drug-resistance pattern. PubMed was searched for esophageal and
  oesophageal tuberculosis titles, and the deep-research run searched for
  esophageal disease due to Mycobacterium bovis; every series found identifies
  M. tuberculosis or does not speciate, and none reports an organism stratum
  with its own presentation, diagnostic pathway or first-line therapy. One
  surgical series found a multidrug-resistant isolate in one of six patients,
  which is not enough to define a stratum. The primary and secondary clinical
  forms are recorded as subtypes because they differ in route and in what
  chest imaging shows, not as separate entries.
infectious_agent:
- name: Mycobacterium tuberculosis
  infectious_agent_term:
    preferred_term: Mycobacterium tuberculosis
    term:
      id: NCBITaxon:1773
      label: Mycobacterium tuberculosis
  description: >-
    The acid-fast intracellular bacillus that causes tuberculosis; it reaches
    the esophagus mostly from caseating mediastinal lymph nodes.
  evidence:
  - reference: PMID:34256638
    reference_title: "Esophagomediastinal fistula due to secondary esophageal tuberculosis: report of two cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Esophageal tuberculosis is a granulomatous inflammatory disease of the
      esophageal wall caused by Mycobacterium tuberculosis infection.
    explanation: >-
      A case report's introduction naming M. tuberculosis as the cause.
  - reference: PMID:42049014
    reference_title: Case Series of Primary Esophageal Tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Additionally, molecular detection confirmed the presence of
      Mycobacterium tuberculosis DNA in two cases.
    explanation: >-
      M. tuberculosis DNA detected in esophageal lesions of two of four
      patients with primary disease.
agent_life_cycle:
  description: >-
    M. tuberculosis is transmitted between humans by airborne droplet nuclei
    and establishes pulmonary and thoracic lymph-node infection; the esophagus
    is involved secondarily from those foci, or rarely by swallowed bacilli. No
    non-human reservoir is described in the esophageal tuberculosis literature
    found, and the deep-research run found no esophageal case attributed to
    Mycobacterium bovis.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Airborne Mycobacterium tuberculosis acquisition
  description: >-
    The infection is acquired by inhaling airborne bacilli. Esophageal disease
    develops from the resulting pulmonary, thoracic lymph-node or spinal
    tuberculosis by contiguous spread, and less often by lymphatic or
    hematogenous spread.
  evidence:
  - reference: PMID:42049014
    reference_title: Case Series of Primary Esophageal Tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Secondary MTB infection of the esophagus occurs via multiple routes,
      with the most common being dissemination from TB lesions in adjacent
      tissues, such as the lungs, mediastinum, hilar lymph nodes, and spine.
    explanation: >-
      A case series' discussion restating the routes of secondary esophageal
      involvement.
- name: Swallowed bacilli in sputum or food
  description: >-
    Primary esophageal tuberculosis is attributed to swallowing sputum or food
    containing tubercle bacilli. It is rare because peristalsis, the squamous
    epithelium, saliva, mucus and the lower esophageal sphincter limit contact
    between the bacilli and the mucosa.
  evidence:
  - reference: PMID:36498584
    reference_title: "Role of Endoscopy in Esophageal Tuberculosis: A Narrative Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Primary ET occurs when patients swallow sputum or food contaminated with
      tubercle bacilli.
    explanation: >-
      A narrative review states the proposed route for primary disease.
  - reference: PMID:35298984
    reference_title: A case report of medically managed esophageal fistula due to complicated esophageal tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The quick clearance of contaminated sputum by coordinated peristalsis,
      paired with upright posture and an intact lower esophageal sphincter,
      limits the organism's exposure to the esophagus.
    explanation: >-
      A case report's discussion of why swallowed bacilli rarely infect the
      esophagus.
has_subtypes:
- name: Secondary
  display_name: Secondary esophageal tuberculosis
  classification: clinical_form
  description: >-
    Esophageal tuberculosis arising from tuberculosis in adjacent structures,
    above all mediastinal lymph nodes and less often the lung or spine. It is
    the common form, and chest CT or endoscopic ultrasound shows the adjacent
    nodal or pulmonary disease.
  evidence:
  - reference: PMID:12752007
    reference_title: "Imaging of esophageal tuberculosis: a review of 23 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Twenty-two patients had secondary involvement of esophagus in the form
      of direct extension of mediastinal and pulmonary tuberculosis or spinal
      tuberculosis. Only 1 patient had primary involvement of the esophagus
      with no evidence of disease elsewhere.
    explanation: >-
      22 of 23 patients in an imaging series had secondary disease.
  - reference: PMID:36742928
    reference_title: "Esophageal Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Secondary esophageal tuberculosis is much more common than primary TB.
      The most common source of secondary esophageal involvement is
      tuberculous mediastinal lymphadenitis.
    explanation: >-
      A systematic review of reported cases on the predominance and source of
      secondary disease.
- name: Primary
  display_name: Primary esophageal tuberculosis
  classification: clinical_form
  description: >-
    Esophageal tuberculosis with no tuberculous focus elsewhere in the body.
    It is rare: one Beijing chest hospital found four patients among about
    33,000 tuberculosis inpatients over ten years. Chest imaging is normal or
    shows only the esophageal lesion, which can make the disease harder to
    suspect.
  evidence:
  - reference: PMID:42049014
    reference_title: Case Series of Primary Esophageal Tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The former only involves the esophagus without evidence of TB in any
      other system (as in these cases), and the latter is caused by an
      invasion of TB lesions in other organs and is more common than primary
      ETB.
    explanation: >-
      Defines the primary and secondary forms in a series of four primary
      cases.
  - reference: PMID:42049014
    reference_title: Case Series of Primary Esophageal Tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      the present study indicates that primary ETB accounted for ∼0.012% of
      all TB cases during the same period.
    explanation: >-
      Primary disease was very rare among tuberculosis inpatients.
prevalence:
- population: Patients undergoing endoscopy for persistent dysphagia, tertiary hospital, India, 1995-1999
  measure_type: UNKNOWN
  notes: >-
    Esophageal tuberculosis made up 0.5% of patients endoscoped for persistent
    dysphagia and 1.3% of those with abnormal esophagoscopic findings. This is
    a share of a referral population, not a population prevalence or
    incidence, so no rate or band is asserted.
  evidence:
  - reference: PMID:11866263
    reference_title: "Esophageal tuberculosis: is it so rare? Report of 12 cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      They constituted 0.5% of all patients with persistent dysphagia, and
      1.3% of all patients having abnormal esophagoscopic findings.
    explanation: >-
      Share of esophageal tuberculosis among endoscoped dysphagia patients.
- population: Tuberculosis inpatients, Beijing Chest Hospital, China, 2016-2025
  measure_type: UNKNOWN
  notes: >-
    Primary esophageal tuberculosis was about 0.012% of roughly 33,000
    tuberculosis inpatients. Older autopsy series cited in the case series
    literature found esophageal involvement in about 0.15% of patients dying
    of tuberculosis. These are shares of tuberculosis cases, so no rate or
    band is asserted.
  evidence:
  - reference: PMID:42049014
    reference_title: Case Series of Primary Esophageal Tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      the present study indicates that primary ETB accounted for ∼0.012% of
      all TB cases during the same period.
    explanation: >-
      Share of primary esophageal tuberculosis among tuberculosis inpatients.
  - reference: PMID:30483561
    reference_title: "Esophageal tuberculosis: Uncommon of common."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      In 1913, an autopsy series demonstrated secondary involvement of the
      esophagus in only 25 of 16 489 (0.15%) patients who died of TB.
    explanation: >-
      A case series' discussion restating the historical autopsy figure.
environmental:
- name: HIV infection and other immunosuppression
  description: >-
    Case series describe esophageal tuberculosis in both immunocompetent and
    immunocompromised hosts and attribute part of its recent increase to
    HIV-associated tuberculosis. No cached source gives the share of
    patients with HIV infection; in one Indian series of 19 patients one was
    HIV-positive.
  influences_mechanisms:
  - target: Mediastinal Tuberculous Lymphadenitis
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      HIV-related immunosuppression increases tuberculosis, including the
      thoracic disease from which esophageal involvement arises; the cited
      sources do not establish which step it acts on.
    evidence:
    - reference: PMID:11866263
      reference_title: "Esophageal tuberculosis: is it so rare? Report of 12 cases and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        The upsurge in reported cases of tuberculosis linked to the AIDS
        epidemic has increased the incidence of this infection in developed
        countries also.
      explanation: >-
        A case series' introduction linking the AIDS epidemic to more
        esophageal tuberculosis.
  evidence:
  - reference: PMID:12665778
    reference_title: "Esophageal tuberculosis associated with esophagotracheal or esophagomediastinal fistula: report of 10 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Esophageal tuberculosis is rare but appears to be increasing,
      especially in endemic areas and in immunosuppressed individuals.
    explanation: >-
      A case series' background statement on immunosuppression.
  - reference: PMID:11866263
    reference_title: "Esophageal tuberculosis: is it so rare? Report of 12 cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Tuberculosis as a causative factor for dysphagia should be considered in
      developing countries with high incidences of tuberculosis and in
      immunocompromised hosts.
    explanation: >-
      The series' conclusion names immunocompromised hosts as a group in whom
      to suspect the disease.
  - reference: PMID:30483561
    reference_title: "Esophageal tuberculosis: Uncommon of common."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Human immunodeficiency virus (HIV) serology was positive in one patient,
      and his CD4 count was 368 cells/μL at the time of diagnosis.
    explanation: >-
      One of 19 patients in a series was HIV-positive.
  - reference: PMID:28876623
    reference_title: "HIV post-tuberculous broncho-oesophageal fistulas: A surgical solution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We present a patient with HIV/AIDS with multiple tracheo-oesophageal
      fistulas probably due to previous tuberculosis.
    explanation: >-
      A case of post-tuberculous tracheoesophageal fistulas in HIV/AIDS.
pathophysiology:
- name: Mediastinal Tuberculous Lymphadenitis
  role: trigger
  description: >-
    Caseating tuberculous lymphadenitis of the mediastinal nodes, most often
    the subcarinal and paraesophageal groups, is the usual source of
    esophageal disease. The nodes are enlarged, matted and heterogeneous with
    hypoechoic, necrotic centres, and lie against the mid-esophagus.
  biological_scale: TISSUE
  locations:
  - preferred_term: mediastinal lymph node
    term:
      id: UBERON:0002524
      label: mediastinal lymph node
  evidence:
  - reference: PMID:21777339
    reference_title: "Esophageal tuberculosis: role of endoscopic ultrasound in diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      EUS showed lymph nodes adjacent to esophageal pathology in all cases.
      Subcarinal region was the most common site of lymphadenopathy and they
      were matted, heterogeneous with predominantly hypoechoic center.
    explanation: >-
      Endoscopic ultrasound in 32 patients found adjacent, mostly subcarinal,
      tuberculous nodes in every case.
  - reference: PMID:12665778
    reference_title: "Esophageal tuberculosis associated with esophagotracheal or esophagomediastinal fistula: report of 10 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Esophageal tuberculosis almost always is associated with mediastinal
      lymphadenopathy.
    explanation: >-
      Conclusion of a 10-patient series.
  downstream:
  - target: Mediastinal lymphadenopathy
    causal_link_type: DIRECT
    description: >-
      The tuberculous nodes are seen on CT and endoscopic ultrasound as
      mediastinal lymphadenopathy.
    evidence:
    - reference: PMID:30483561
      reference_title: "Esophageal tuberculosis: Uncommon of common."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        The mediastinal lymphadenopathy was present in all patients, with
        parenchymal lesions seen in three patients.
      explanation: >-
        Mediastinal lymphadenopathy on CT in all 19 patients.
  - target: Extrinsic Nodal Compression of the Mid-Esophagus
    causal_link_type: DIRECT
    description: >-
      Enlarged subcarinal nodes press on the adjacent mid-esophagus.
    evidence:
    - reference: PMID:30483561
      reference_title: "Esophageal tuberculosis: Uncommon of common."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        On CECT, mediastinal lymph nodes compressing the esophageal wall were
        seen in 17 patients.
      explanation: >-
        Nodal compression of the esophageal wall on CT in 17 of 19 patients.
  - target: Nodal Rupture into the Esophageal Wall
    causal_link_type: DIRECT
    description: >-
      Caseating nodes infiltrate and rupture into the adjacent esophageal wall.
    evidence:
    - reference: PMID:36498584
      reference_title: "Role of Endoscopy in Esophageal Tuberculosis: A Narrative Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        In most cases, ET is caused by the rupture of infected mediastinal
        lymph nodes to the esophagus.
      explanation: >-
        A narrative review's statement of the main route.
    - reference: PMID:21777339
      reference_title: "Esophageal tuberculosis: role of endoscopic ultrasound in diagnosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Esophageal tuberculosis does not appear to be a primary disease and is
        most likely secondary to mediastinal nodal tuberculosis.
      explanation: >-
        The authors' conclusion from endoscopic ultrasound in 32 patients.
  - target: Constitutional Inflammatory Response
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Active tuberculous lymphadenitis contributes to the systemic symptoms of
      tuberculosis; the mediators are not studied in esophageal disease.
- name: Adjacent Pulmonary or Spinal Tuberculosis
  role: trigger
  description: >-
    Less often the esophagus is involved by direct extension from pulmonary
    tuberculosis (a consolidation, cavity or lung abscess) or from a
    tuberculous spine, usually together with mediastinal lymphadenopathy.
  biological_scale: TISSUE
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  - preferred_term: vertebral column
    term:
      id: UBERON:0001130
      label: vertebral column
  evidence:
  - reference: PMID:30483561
    reference_title: "Esophageal tuberculosis: Uncommon of common."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Three of our patients had esophageal involvement secondary to
      parenchymal pulmonary involvement, one had lung abscess with esophageal
      fistula, one had consolidation with esophageal fistula, and one had
      esophageal fistulous communication with lung cavity, although all of
      them had additional mediastinal lymphadenopathy.
    explanation: >-
      Three of 19 patients had disease extending from the lung.
  downstream:
  - target: Transmural Caseating Granulomatous Esophagitis
    causal_link_type: DIRECT
    description: >-
      Tuberculosis of the lung or spine extends directly into the esophageal
      wall.
    evidence:
    - reference: PMID:12665778
      reference_title: "Esophageal tuberculosis associated with esophagotracheal or esophagomediastinal fistula: report of 10 cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Esophageal tuberculosis was always associated with spread from
        adjacent structures such as mediastinal or cervical lymph nodes and
        the spine.
      explanation: >-
        Spread from adjacent nodes and spine in all 10 patients.
    - reference: PMID:12752007
      reference_title: "Imaging of esophageal tuberculosis: a review of 23 cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Twenty-two patients had secondary involvement of esophagus in the form
        of direct extension of mediastinal and pulmonary tuberculosis or spinal
        tuberculosis.
      explanation: >-
        Direct extension from mediastinal, pulmonary or spinal disease in 22 of
        23 patients.
- name: Mucosal Seeding by Swallowed Bacilli
  role: trigger
  description: >-
    In primary disease, bacilli swallowed in sputum or food are thought to
    seed the esophageal mucosa directly. Esophageal defences make this rare.
  biological_scale: TISSUE
  locations:
  - preferred_term: esophagus mucosa
    term:
      id: UBERON:0002469
      label: esophagus mucosa
  evidence:
  - reference: PMID:36498584
    reference_title: "Role of Endoscopy in Esophageal Tuberculosis: A Narrative Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, primary ET very rarely occurs due to multiple efficacious
      esophageal protective mechanisms such as stratified squamous epithelium,
      saliva, and mucus
    explanation: >-
      A narrative review on why primary disease is rare.
  downstream:
  - target: Transmural Caseating Granulomatous Esophagitis
    causal_link_type: DIRECT
    description: >-
      Seeded bacilli produce granulomatous inflammation of the esophageal
      wall, with no other tuberculous focus.
    evidence:
    - reference: PMID:42049014
      reference_title: Case Series of Primary Esophageal Tuberculosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        All patients involved underwent pathological examination of their
        esophageal lesions, which revealed granulomas.
      explanation: >-
        Granulomas in the esophageal lesions of four patients with primary
        disease.
- name: Extrinsic Nodal Compression of the Mid-Esophagus
  description: >-
    Enlarged subcarinal or paraesophageal nodes indent the mid-esophagus,
    seen at endoscopy as a submucosal bulge with normal or ulcerated overlying
    mucosa and on barium swallow as extrinsic compression.
  biological_scale: TISSUE
  locations:
  - preferred_term: thoracic part of esophagus
    term:
      id: UBERON:0035216
      label: thoracic part of esophagus
  evidence:
  - reference: PMID:21777339
    reference_title: "Esophageal tuberculosis: role of endoscopic ultrasound in diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      endoscopy showed ulcers in 18/32 (56.25%) and extrinsic bulge in 20/32

      Multi-group mediastinal lymphadenopathy on CT in 14 of 23 patients.
  - reference: PMID:36742928
    reference_title: "Esophageal Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clinical features are same and it is difficult on imaging studies also
      to differentiate the two pathologies.
    explanation: >-
      A systematic review on imaging not separating tuberculosis from
      carcinoma.
- name: Barium Esophagography
  description: >-
    A contrast swallow shows extrinsic compression, traction diverticula,
    strictures, sinus or fistulous tracts, kinking and pseudotumour.
  diagnosis_term:
    preferred_term: barium esophagography
    term:
      id: NCIT:C38112
      label: Esophagography
  evidence:
  - reference: PMID:12752007
    reference_title: "Imaging of esophageal tuberculosis: a review of 23 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Radiological abnormalities seen in barium swallow examination were
      extrinsic compression, traction diverticula, strictures, sinus/fistulous
      tracts, kinking and pseudotumor mass of esophagus in decreasing order
      of frequency.
    explanation: >-
      Barium swallow findings in 23 patients.
- name: Interferon-Gamma Release Assay
  description: >-
    A positive IGRA supports the diagnosis when tissue tests for the bacillus
    are negative, but does not distinguish active from latent infection.
  diagnosis_term:
    preferred_term: interferon-gamma release assay
    term:
      id: NCIT:C128363
      label: Interferon Gamma Release Assay
  evidence:
  - reference: PMID:42049014
    reference_title: Case Series of Primary Esophageal Tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Additionally, the other two cases with negative MTB-DNA results had
      positive IGRA results, and anti-TB therapy yielded a favorable outcome,
      further proving the diagnosis of ETB.
    explanation: >-
      Positive IGRA supported the diagnosis in two patients with negative
      tissue PCR.
differential_diagnoses:
- name: Esophageal carcinoma
  description: >-
    Carcinoma is the commonest cause of dysphagia with a mid-esophageal mass
    or ulcer in adults, and esophageal tuberculosis is often taken for it,
    sometimes leading to unnecessary esophagectomy.
  distinguishing_features:
  - Granulomas or acid-fast bacilli on biopsy or nodal aspirate
  - On endoscopic ultrasound, a lesion invading the wall from outside, continuous with matted heterogeneous nodes, rather than a mass arising from the epithelium
  - Response to antituberculous therapy
  evidence:
  - reference: PMID:1570250
    reference_title: "Oesophageal tuberculosis: a review of eleven cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The main presentation is that of dysphagia whose algorithm of
      investigation should seek to differentiate tuberculosis from carcinoma,
      the more common cause of this symptom.
    explanation: >-
      Carcinoma is the main differential of dysphagia.
  - reference: PMID:16252203
    reference_title: Esophageal tuberculosis mimicking esophageal carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Differential diagnosis may be difficult and may result in an
      unnecessary surgical therapy such as esophagectomy.
    explanation: >-
      A case report on the risk of unnecessary esophagectomy.
  - reference: PMID:36498584
    reference_title: "Role of Endoscopy in Esophageal Tuberculosis: A Narrative Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Nevertheless, esophageal carcinoma is a hypoechoic mass derived from the
      epithelial layer, infiltrating from the inside to the outside
    explanation: >-
      A narrative review on the endoscopic ultrasound difference.
- name: Deep fungal infection of the esophagus
  description: >-
    Fungal esophagitis can produce similar ulcerative lesions and fistula
    tracts.
  distinguishing_features:
  - Fungal elements rather than granulomas with acid-fast bacilli on histology and stains
  evidence:
  - reference: PMID:20568972
    reference_title: Endoscopic findings and clinical features of esophageal tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Similar abnormal lesions of the esophagus may be confused with
      esophageal cancer and deep fungal infections.
    explanation: >-
      Names deep fungal infection as a mimic.
- name: Crohn disease of the esophagus
  description: >-
    Esophageal Crohn disease causes upper or mid-esophageal ulcers and
    granulomas and is hard to separate from tuberculosis on endoscopic
    ultrasound.
  distinguishing_features:
  - Ileocecal longitudinal, discontinuous or cobblestone ulcers
  - Extra-intestinal involvement of joints, skin, eyes or oral mucosa
  evidence:
  - reference: PMID:36498584
    reference_title: "Role of Endoscopy in Esophageal Tuberculosis: A Narrative Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      when ulcerations are observed in the upper or middle esophagus, in
      addition to ET, Crohn's disease and Behçet's disease should also be
      considered.
    explanation: >-
      A narrative review naming Crohn disease and Behcet disease.
- name: Behcet disease
  description: >-
    Behcet disease can cause upper or mid-esophageal ulcers.
  distinguishing_features:
  - Oral, ocular and genital ulcers
  evidence:
  - reference: PMID:36498584
    reference_title: "Role of Endoscopy in Esophageal Tuberculosis: A Narrative Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Behçet's disease causes ulcers in the mouth, eyes, and genitals
    explanation: >-
      A narrative review on the features that separate Behcet disease.
- name: Esophageal submucosal tumour
  description: >-
    A submucosal bulge from tuberculosis can be taken for a leiomyoma or
    another submucosal tumour.
  distinguishing_features:
  - Leiomyoma is a homogeneous hypoechoic lesion of the lamina propria or muscularis mucosae with regular borders and normal mediastinal nodes
  evidence:
  - reference: PMID:36498584
    reference_title: "Role of Endoscopy in Esophageal Tuberculosis: A Narrative Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Benign esophageal submucosal tumors (SMTs) are easily identified from
      ET.
    explanation: >-
      A narrative review on separating submucosal tumours.
  - reference: PMID:42049014
    reference_title: Case Series of Primary Esophageal Tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Esophageal leiomyoma was suspected by clinicians.
    explanation: >-
      One patient with primary disease was first thought to have a leiomyoma.
- name: Sarcoidosis
  description: >-
    Sarcoidosis causes non-caseating granulomas and mediastinal
    lymphadenopathy.
  distinguishing_features:
  - Non-caseating granulomas
  - Nodes described as isoechoic, well margined and clustered on endoscopic ultrasound, although this is disputed
  evidence:
  - reference: PMID:36498584
    reference_title: "Role of Endoscopy in Esophageal Tuberculosis: A Narrative Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Some experts have proposed that sarcoidosis could be easily
      differentiated from ET by using EUS because sarcoidosis-associated
      mediastinal lymph nodes are isoechoic, well margined, and clustered
    explanation: >-
      A narrative review on the proposed EUS distinction.
treatments:
- name: Antituberculous Chemotherapy
  description: >-
    Standard first-line chemotherapy (isoniazid, rifampicin, pyrazinamide and
    ethambutol for two months, then isoniazid and rifampicin) cures nearly
    all patients, including most with fistulas. Reported durations range from
    six to twelve months. Drug-induced hepatotoxicity can force a change of
    regimen, and drug-susceptibility testing matters because multidrug
    resistance occurs.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Transmural Caseating Granulomatous Esophagitis
    treatment_effect: INHIBITS
    description: >-
      Bactericidal therapy kills the bacilli driving the esophageal
      inflammation, and ulcers and fistulas heal.
    evidence:
    - reference: PMID:12665778
      reference_title: "Esophageal tuberculosis associated with esophagotracheal or esophagomediastinal fistula: report of 10 cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Despite these complications, patients can be treated safely with
        antituberculous drugs alone.
      explanation: >-
        Patients with fistulas recovered on drugs alone.
  - target: Mediastinal Tuberculous Lymphadenitis
    treatment_effect: INHIBITS
    description: >-
      The same therapy treats the nodal source of secondary disease.
    evidence:
    - reference: PMID:21777339
      reference_title: "Esophageal tuberculosis: role of endoscopic ultrasound in diagnosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        All patients were treated with antitubercular treatment and showed
        good clinical, endoscopic and endosonographic response.
      explanation: >-
        Endosonographic response, which includes the nodes, in 32 patients.
  evidence:
  - reference: PMID:34482490
    reference_title: "Oesophageal Tuberculosis: A Systematic Review Focusing on Clinical Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Response to antitubercular therapy was excellent; 97.7% patients
      recovered and 2.3% patients died.
    explanation: >-
      Pooled outcome on chemotherapy.
  - reference: PMID:36498584
    reference_title: "Role of Endoscopy in Esophageal Tuberculosis: A Narrative Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A standard nine-month course of treatment consists of four drugs
      (isoniazid, rifampicin, ethambutol, and pyrazinamide) for two months and
      two drugs (isoniazid and rifampicin) for seven months.
    explanation: >-
      The regimen given in a narrative review.
  - reference: PMID:42049014
    reference_title: Case Series of Primary Esophageal Tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      However, the duration of anti-TB treatment varies significantly among
      different studies on ETB, with most studies indicating a duration
      between 6 and 12 months.
    explanation: >-
      A case series' discussion on the range of treatment durations.
  - reference: PMID:42049014
    reference_title: Case Series of Primary Esophageal Tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Additionally, abnormal liver function was found, with an alanine
      aminotransferase level of 185 U/L and an aspartate aminotransferase
      level of 200 U/L.
    explanation: >-
      Hepatotoxicity on four-drug therapy in one patient, whose regimen was
      changed.
- name: Endoscopic Fistula Closure
  description: >-
    A fistula that persists despite chemotherapy, often because it has
    epithelialized, can be closed endoscopically with an over-the-scope clip,
    sometimes after argon plasma coagulation of the tract.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: endoscopic over-the-scope clip closure
    term:
      id: NCIT:C64958
      label: Therapeutic Endoscopic Procedure
  target_mechanisms:
  - target: Transmural Penetration and Fistula Formation
    treatment_effect: INHIBITS
    description: >-
      The clip closes the fistulous opening.
    evidence:
    - reference: PMID:30483561
      reference_title: "Esophageal tuberculosis: Uncommon of common."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        After 4 months of ATT and OTSC placement, the size of the fistula
        decreased with the improvement of symptoms
      explanation: >-
        A persistent fistula shrank after clip placement in one patient.
  evidence:
  - reference: PMID:36498584
    reference_title: "Role of Endoscopy in Esophageal Tuberculosis: A Narrative Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If traditional drug treatment is not effective, endoscopic intervention
      such as the closure of fistula can be performed.
    explanation: >-
      A narrative review on the place of endoscopic closure.
  - reference: PMID:30483561
    reference_title: "Esophageal tuberculosis: Uncommon of common."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The difficult cases are the ones with fistulae, especially if they are
      long standing as they tend to epithelize and become resistant to
      healing.
    explanation: >-
      Why some fistulas persist after chemotherapy.
- name: Esophageal Stenting
  description: >-
    An esophageal stent is placed in a minority of patients, for a
    persistent fistula or an obstructing stricture.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: esophageal stenting
    term:
      id: NCIT:C71316
      label: Stenting
  target_mechanisms:
  - target: Transmural Penetration and Fistula Formation
    treatment_effect: INHIBITS
    description: >-
      A covered stent seals the fistula from the esophageal side.
    evidence:
    - reference: PMID:32275811
      reference_title: Management of children with tuberculous broncho-esophageal fistulae.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        BOF closure was achieved by surgical closure (46%), spontaneous
        closure (26%), fibrin glue (13%), and esophageal stent (13%).
      explanation: >-
        A stent closed the fistula in 13% of 20 children with tuberculous
        bronchoesophageal fistula.
  evidence:
  - reference: PMID:34482490
    reference_title: "Oesophageal Tuberculosis: A Systematic Review Focusing on Clinical Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Surgery (14.5%) and oesophageal stenting (11.4%) were required
      infrequently.
    explanation: >-
      Pooled use of stenting.
- name: Surgery for Complications
  description: >-
    Surgery is reserved for failed medical therapy and complications:
    thoracotomy repair of a perforation or esophagopleural fistula, repair or
    resection for persistent tracheoesophageal or bronchoesophageal fistula,
    and emergency endovascular aortic repair followed by esophageal
    reconstruction for an aortoesophageal fistula. Video-assisted
    thoracoscopic surgery has been used to obtain a diagnosis. Every effort
    should be made to diagnose the disease without surgery, because it is
    medically curable and esophagectomy for presumed carcinoma is avoidable.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical repair
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Erosion into the Thoracic Aorta
    treatment_effect: INHIBITS
    description: >-
      Endovascular aortic repair stops the bleeding, and esophageal
      reconstruction follows once mediastinal inflammation is controlled.
    evidence:
    - reference: PMID:26539019
      reference_title: Two-stage Surgery for an Aortoesophageal Fistula Caused by Tuberculous Esophagitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        he was diagnosed with an AEF and initially underwent thoracic
        endovascular aortic repair. Esophageal reconstruction was performed
        after controlling the mediastinal inflammation.
      explanation: >-
        Two-stage treatment of a tuberculous aortoesophageal fistula in one
        patient.
  - target: Transmural Penetration and Fistula Formation
    treatment_effect: INHIBITS
    description: >-
      Surgical repair closes a fistula or perforation that does not heal.
    evidence:
    - reference: PMID:23991308
      reference_title: "Surgical outcome of esophageal tuberculosis secondary to mediastinal lymphadenitis in adults: experience from single center in China."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Thoracotomy repair is reserved for complications of ET.
      explanation: >-
        The series' conclusion on thoracotomy repair.
  evidence:
  - reference: PMID:36742928
    reference_title: "Esophageal Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The disease is medically curable; therefore, it is essential to make all
      efforts to diagnose the pathology with non-surgical diagnostic
      modalities in suspected cases so as to save patients from the trauma of
      major surgical resection. Surgical intervention is indicated for failed
      medical therapy and complications.
    explanation: >-
      A systematic review on the limited place of surgery.
  - reference: PMID:23991308
    reference_title: "Surgical outcome of esophageal tuberculosis secondary to mediastinal lymphadenitis in adults: experience from single center in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      VATS is useful in improving rate of confirmative diagnosis, and
      relieving symptom of dysphagia.
    explanation: >-
      Thoracoscopic surgery in five of six undiagnosed patients.
  - reference: PMID:28876623
    reference_title: "HIV post-tuberculous broncho-oesophageal fistulas: A surgical solution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Surgical repair of persistent post-tuberculous tracheo-oesophageal
      fistulas may be safely undertaken in selected patients with HIV/ AIDS.
    explanation: >-
      Surgical repair of persistent fistulas in a patient with HIV/AIDS.

clinical_burden:
  burden_level: MODERATE
  rationale: >-
    The disease is curable with chemotherapy, and nearly all patients recover,
    but diagnosis is often delayed, fistulas and strictures can need
    endoscopic or surgical treatment, and bleeding from an aortoesophageal
    fistula can be fatal. The pooled systematic review reports 2.3%
    mortality.
  evidence:
  - reference: PMID:34482490
    reference_title: "Oesophageal Tuberculosis: A Systematic Review Focusing on Clinical Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-

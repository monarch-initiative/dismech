        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Magnetic resonance imaging showed a 50% reduction in both septal and free wall LV contractility in Alpk3 (-/-) mice."
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:21441111
      reference_title: "Cardiomyopathy in α-kinase 3 (ALPK3)-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM

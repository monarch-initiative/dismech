- name: AAV-Delivered Full-Length ALPK3 Gene Replacement
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  description: >-
    Preclinical delivery of full-length human ALPK3 with AAV9 and a cardiac TNNT2 promoter prevented disease after neonatal treatment and reversed established dysfunction and hypertrophy after treatment of six-week-old homozygous W1538X mice. AAV6 delivery also restored force in ALPK3-mutant human cardiac organoids. The 5.8-kb vector exceeds conventional AAV capacity but produced full-length transcript and protein in the tested systems. Human efficacy, long-term safety and response in hearts with substantial pre-existing fibrosis remain unestablished.
  evidence:
  - reference: PMID:42618778
    reference_title: Alpha protein kinase 3 gene therapy restores heart function in mouse and human models of cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: AAV9-TNNT2-ALPK3 delivery in 6-week-old mice was sufficient to fully rescue systolic function back to WT levels at all timepoints after treatment
    explanation: Adult treatment experiment in homozygous W1538X mice, followed to 18 weeks.
  - reference: PMID:42618778
    reference_title: Alpha protein kinase 3 gene therapy restores heart function in mouse and human models of cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: treatment with AAV6-ALPK3 restored active force production to WT levels
    explanation: ALPK3-mutant human cardiac organoids provide a separate in vitro rescue system; these were not treated patients.
  target_mechanisms:
  - target: ALPK3 Loss of Function
    description: Replaces functional ALPK3 protein in deficient myocardium.
    evidence:
    - reference: PMID:42618778
      reference_title: Alpha protein kinase 3 gene therapy restores heart function in mouse and human models of cardiomyopathy.

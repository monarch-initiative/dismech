  - reference: url:https://pure.rug.nl/ws/files/915064722/Contiguous_Gene_Deletion_of_Chromosome_15q25.2q25.3_in_Biallelic_ALPK3-Related_Cardiomyopathy-_Novel_Insights_Into_Phenotypic_Presentation_and_Variant_Spectrum.pdf
    reference_title: https://pure.rug.nl/ws/files/915064722/Contiguous_Gene_Deletion_of_Chromosome_15q25.2q25.3_in_Biallelic_ALPK3-Related_Cardiomyopathy-_Novel_Insights_Into_Phenotypic_Presentation_and_Variant_Spectrum.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A complete gene deletion, as found in our patient, has not been reported previously
    explanation: Full text of Grutters et al. (2023), PMID:37671554. The child had a contiguous deletion and a splice allele in trans. The cardiac presentation supports ALPK3 involvement while the multigene deletion limits attribution of every extracardiac feature.
  - reference: PMID:41437994
    reference_title: "Novel compound heterozygous ALPK3 mutations (c.4234C>T and c.3491G>A), causing hypertrophic cardiomyopathy treated with the liwen procedure: case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: c.3491G > A (p.Arg1164Gln) was classified as a variant of undetermined significance (PM2 + PP3).
    explanation: The primary report explicitly retains uncertain significance for the missense allele despite stronger causal wording in its title and discussion.
  - reference: PMID:34263907
    reference_title: Alpha-protein kinase 3 (ALPK3) truncating variants are a cause of autosomal dominant hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the cumulative percentage of diagnosed carriers increased to >95% among males and 80% among females.
    explanation: Cumulative diagnosis by age 75 in an ascertained cohort; not a population-based penetrance estimate.
  notes: >-
    On re-analysis of sarcomere-negative hypertrophic cardiomyopathy by exome or genome sequencing, ALPK3 protein-truncating variants ranked second or third among newly identified variants in five of seven pooled cohorts, behind cryptic-splice MYBPC3 and, in the French cohort, FLNC. Non-truncating ALPK3 variants make up a substantial share of the observed spectrum - 99 of 268 cohort variants (37%), and at least one non-truncating allele in 13 of 42 curated biallelic patients - but were not significantly enriched over population controls, so their contribution is not modelled as a separate mechanism here. Individual missense variants require separate assessment: Herkert et al. reported mixed prediction results for p.Val812Met and p.Glu199Asp and explicitly requested functional validation of the latter. The lack of class-wide missense enrichment does not establish every missense variant as benign, nor does phenotype resemblance alone prove pathogenicity. The Korean cohort also contained one individual whose MYBPC3 variant, rather than the ALPK3 truncation, segregated with familial HCM; co-occurring variants and segregation remain relevant to individual interpretation. Whole-gene deletion
    is also documented: a child carried a paternal contiguous 15q25.2q25.3 deletion including ALPK3 and a maternal c.4736-1G>A splice variant (NM_020778.4). Because the deletion includes other genes, overlapping developmental and congenital features cannot be assigned solely to ALPK3. In the 2025 Liwen-procedure case report, the truncating p.Arg1412Ter allele was classified as pathogenic, but the trans p.Arg1164Gln missense allele remained a variant of uncertain significance. The case does not independently establish pathogenicity of the missense allele or prove a biallelic dose effect. In the clinically ascertained 2021 cohort, cumulative diagnosis by age 75 exceeded 95% in men and reached 80% in women; these selected-family estimates do not measure population penetrance.
treatments:
- name: Beta-Blocker and Non-Dihydropyridine Calcium Channel Blocker Therapy
  description: >-
    Symptom-directed HCM therapy chosen according to obstruction, symptoms and ventricular function. GeneReviews lists beta-blockers or calcium channel blockers for symptomatic nonobstructive HCM with preserved ejection fraction and beta-blockers as first-line therapy for symptomatic obstruction. Systolic dysfunction instead requires guideline-based heart-failure management; these HCM symptom-control options are not interchangeable across ventricular-function states. ALPK3-specific comparative treatment trials are lacking.
  therapeutic_modality: SMALL_MOLECULE

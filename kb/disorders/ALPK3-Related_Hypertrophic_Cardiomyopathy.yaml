- name: Alpk3 K1420R kinase-dead knock-in mouse
  species: Mouse
  genotype: Alpk3 K1420R/K1420R (invariant catalytic lysine mutated to arginine)
  publication: PMID:38048395
  description: >-
    CRISPR knock-in mice carrying an arginine substitution at the predicted invariant catalytic lysine of the alpha-kinase domain. Homozygotes retain normal cardiac function and survival into adulthood, with unchanged cardiac SQSTM1 T269/S272 phosphorylation relative to total SQSTM1. Together with the negative in vitro kinase assay, these results support the pseudokinase interpretation under the tested conditions.
  evidence:
  - reference: PMID:38048395
    reference_title: "ALPK3 Functions as a Pseudokinase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we utilized CRISPR/Cas9 technology to generate knock-in mice in which the invariant K1420 of ALPK3 is mutated to arginine(R)"
    explanation: Describes the construction of the knock-in model used here.
  modeled_mechanisms:
  - target: Loss of M-Band Scaffolding
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The K1420R substitution does not reproduce the cardiomyopathy of the published null line. This is a negative functional comparison supporting a role for ALPK3 beyond putative kinase activity; M-band scaffold integrity was not directly established by the cardiac readout.
    limitations: >-
      Mutation of the equivalent lysine disables many other kinases, but absence of an ALPK3 kinase signal in the tested assay prevents direct demonstration of activity loss in this protein. Normal cardiac function in this model supports, but does not conclusively settle, the pseudokinase interpretation or resolve the conflicting SQSTM1 phosphorylation report.
    readouts:
    - name: Survival and cardiac function to adulthood
      target: Loss of M-Band Scaffolding
      direction: UNCHANGED
      interpretation: >-
        Homozygotes maintain normal survival and cardiac function into adulthood, in contrast to the previously published null line. The result supports a functional distinction between the K1420R substitution and removal of ALPK3 protein.
      evidence:
      - reference: PMID:38048395
        reference_title: "ALPK3 Functions as a Pseudokinase."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In contrast to the published Alpk3 null mutant mice2, the homozygous Alpk3 KR/KR mice did not exhibit premature mortality and maintained normal cardiac function into adulthood"
        explanation: Reports the survival and cardiac function measurement behind this readout.
    evidence:
    - reference: PMID:38048395
      reference_title: "ALPK3 Functions as a Pseudokinase."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In conclusion, our study presents compelling new evidence from both in vitro and in vivo experiments, supporting that ALPK3 functions as a pseudokinase."
      explanation: The study's conclusion, which is what makes this model informative about the nature of the scaffolding node.
- name: Alpk3 constitutive knockout mouse (C57BL/6N, MRC Harwell line)
  species: Mouse
  genotype: Alpk3-/- (constitutive null, C57BL/6N background, exon 3 deletion)
  publication: PMID:36321451
  description: >-
    A second, independently derived Alpk3-null line, acquired specifically because the earlier C57BL/6J null did not reproduce the human neonatal disease course. These mice are normal at birth and then develop a rapidly progressive cardiomyopathy in the first week with no survivors beyond 14 weeks, recapitulating the rapidly progressive neonatal presentation observed in some biallelic patients.
  evidence:

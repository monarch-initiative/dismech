      explanation: Quantifies the rare heterozygous ALPK3 variant fraction in a Dutch cardiomyopathy cohort.
  evidence:
  - reference: CGGV:assertion_6312d79f-df12-4ec6-8ce6-0f38f19e617d-2022-02-09T170000.000Z
    reference_title: "ALPK3 / hypertrophic cardiomyopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ALPK3 | HGNC:17574 | hypertrophic cardiomyopathy | MONDO:0005045 | AR | Definitive"
    explanation: ClinGen classifies the autosomal recessive ALPK3-hypertrophic cardiomyopathy relationship as Definitive.
  - reference: CGGV:assertion_ace85164-0b70-46a2-ac6b-253088f4514d-2025-01-16T010000.000Z
    reference_title: "ALPK3 / hypertrophic cardiomyopathy (Strong)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ALPK3 | HGNC:17574 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Strong"
    explanation: ClinGen classifies the autosomal dominant ALPK3-hypertrophic cardiomyopathy relationship as Strong.
  - reference: PMID:39036505
    reference_title: "High prevalence of ALPK3 premature terminating variants in Korean hypertrophic cardiomyopathy patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed that monoallelic PTVs in ALPK3 were also significantly enriched in Korean patients with HCMP with an odds ratio score of 10-21."
    explanation: Replicates the truncating-variant enrichment outside European-ancestry cohorts.
  notes: >-
    On re-analysis of sarcomere-negative hypertrophic cardiomyopathy by exome or genome
    sequencing, ALPK3 protein-truncating variants ranked second or third among newly
    identified variants in five of seven pooled cohorts, behind cryptic-splice MYBPC3 and,
    in the French cohort, FLNC. Non-truncating ALPK3 variants make up a substantial share
    of the observed spectrum - 99 of 268 cohort variants (37%), and at least one
    non-truncating allele in 13 of 42 curated biallelic patients - but were not
    significantly enriched over population controls, so their contribution is not modelled
    as a separate mechanism here.
treatments:
- name: Beta-Blocker and Non-Dihydropyridine Calcium Channel Blocker Therapy
  description: >-
    The conventional symptomatic pharmacotherapy of hypertrophic cardiomyopathy, and what
    ALPK3 patients actually receive. It is not ALPK3-specific and no trial has tested it in
    this genotype; it is curated because it is the reported standard of care, not because
    it is known to modify this disease. The same negative-inotropy caution that applies to
    myosin inhibition applies here, since a substantial share of ALPK3 patients are
    hypokinetic rather than obstructed.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic blocker
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
    - preferred_term: non-dihydropyridine calcium channel blocker
      term:
        id: NCIT:C333
        label: Calcium Channel Blocker
  evidence:
  - reference: PMID:41221624
    reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pharmacological treatments commonly employed include beta-blockers and non-dihydropyridine calcium channel blockers."
    explanation: Names the pharmacotherapy in common use for this disease.
- name: Cascade Genetic Testing and Cardiac Surveillance of Variant Carriers
  description: >-
    Because heterozygous ALPK3 truncating variants have incomplete, age-related penetrance,
    relatives who carry one may be unaffected when first tested and develop hypertrophy
    later. Both the paediatric and adult literature therefore recommend identifying carriers
    and putting them under cardiac surveillance rather than discharging them.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:32480058
    reference_title: "Expanding the clinical and genetic spectrum of ALPK3 variants: Phenotypes identified in pediatric cardiomyopathy patients and adults with heterozygous variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adults with ALPK3 LoF variants therefore warrant evaluations for cardiomyopathy."
    explanation: States the surveillance recommendation for carriers identified by cascade testing.
  - reference: PMID:41221624
    reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early genetic diagnosis, genotype-tailored surveillance, and focused development of gene-replacement or editing strategies"
    explanation: Names early genetic diagnosis and genotype-tailored surveillance as the current actionable management.
- name: Implantable Cardioverter-Defibrillator
  description: >-
    Device therapy for sudden cardiac death prevention. Referral for ICD implantation was
    recorded in about a quarter of biallelic patients, including in childhood. No
    ALPK3-specific risk-stratification rule exists; the conventional hypertrophic
    cardiomyopathy risk models were developed on sarcomere-gene cohorts and have not been
    validated in this genotype.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: implantable cardioverter-defibrillator
        term:
          id: NCIT:C93238
          label: Implantable Cardioverter-Defibrillator
  target_mechanisms:
  - target: Ventricular tachycardia
    evidence:
    - reference: PMID:41221624
      reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Ten patients (24%) were referred for implantable cardioverter-defibrillator (ICD) implantation"
      explanation: ICD referral is the recorded clinical response to arrhythmic risk in this disease.
  evidence:
  - reference: PMID:41221624
    reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten patients (24%) were referred for implantable cardioverter-defibrillator (ICD) implantation, including five females, four males, and one of unspecified sex."
    explanation: Records ICD referral as part of the management of biallelic ALPK3 cardiomyopathy.
- name: Heart Transplantation
  description: >-
    Definitive treatment for end-stage ALPK3 cardiomyopathy. Among curated biallelic
    patients, about 12% were referred for transplantation and 4 underwent it, at ages
    ranging from 4 to 33 years.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: heart transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  target_mechanisms:
  - target: Congestive heart failure
    evidence:
    - reference: PMID:41221624
      reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "4 (9.5%) underwent heart transplantation at ages 4, 16, 28, and 33 years"
      explanation: Records transplantation as the intervention taken for end-stage heart failure in this disease.
  evidence:
  - reference: PMID:41221624
    reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "5 (11.9%) were referred for heart transplantation, and 4 (9.5%) underwent heart transplantation at ages 4, 16, 28, and 33 years"
    explanation: Quantifies transplantation in the curated biallelic cohort.
- name: Mavacamten
  description: >-
    Cardiac myosin inhibitor, approved for obstructive hypertrophic cardiomyopathy. In
    ALPK3 disease this is preclinical and phenotype-dependent, not established therapy:
    it corrected sarcomere length, diastolic calcium and relaxation in isolated
    cardiomyocytes from an ALPK3 K201X knock-in mouse, but was tested only ex vivo, and
    its negative inotropy is a hazard in the hypokinetic ALPK3 phenotypes, which are the
    more common ones. Outflow tract obstruction, the approved indication, is uncommon in
    ALPK3 carriers.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mavacamten
  target_mechanisms:
  - target: Abnormal Cardiomyocyte Calcium Handling
    evidence:
    - reference: PMID:41221624
      reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In this setting, mavacamten partially corrected key pathological features, including abnormal sarcomere length, elevated diastolic calcium levels, and delayed relaxation, in both heterozygous and homozygous cells."
      explanation: Records the specific mechanism-level correction achieved by mavacamten in ALPK3-mutant cardiomyocytes.
  evidence:
  - reference: PMID:41221624
    reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Altogether, while ALPK3-deficient cardiomyocytes are pharmacologically responsive to myosin inhibition such as mavacamten at the cellular level in vitro, clinical translation should be strictly phenotype-driven."
    explanation: States both the responsiveness and the limits on translating it, which is why this treatment is recorded as preclinical and conditional.
- name: AAV-Delivered miniALPK3 Gene Replacement
  description: >-
    Preclinical gene replacement. Full-length ALPK3 exceeds AAV packaging capacity, so a
    3.9 kb miniALPK3 construct deleting part of the intrinsically disordered central
    region was built and delivered by MyoAAV under a cardiac-specific promoter to neonatal
    Alpk3 knockout mice. Not yet tested in humans.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: ALPK3 Loss of Function
    evidence:
    - reference: PMID:41221624
      reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Treated mice showed precise restoration of ALPK3 localization to the M-band, normalization of cardiac dimensions and contractility, suppression of pathological fetal gene and fibrosis markers, and significantly improved survival beyond 12 months compared to untreated controls, which experienced early mortality."
      explanation: Restoring ALPK3 protein rescues the phenotype, which is the direct test that the loss-of-function node is the causal lesion.
  evidence:
  - reference: PMID:41221624
    reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Deleting part of this flexible segment produces a 3.9 kb miniALPK3 that preserves all structured domains, including the two immunoglobulin-like repeats and the C-terminal alpha-kinase fold, while fitting comfortably within the AAV packaging limit and enabling efficient, single-vector delivery."
    explanation: Describes the construct design that makes AAV gene replacement feasible for this gene.
animal_models:
- name: Alpk3 constitutive knockout mouse (C57BL/6J, Van Sligtenhorst line)
  species: Mouse
  genotype: Alpk3-/- (constitutive null, C57BL/6J background)
  publication: PMID:21441111
  description: >-
    Constitutive Alpk3-null mice develop a non-progressive cardiomyopathy with mixed
    hypertrophic and dilated features, reduced contractility, and abnormal intercalated
    discs with mild myofibrillar disarray. This is the first published Alpk3-null line and
    is distinct from the C57BL/6N line curated below; a later study judged this line
    inadequate as a model of the human neonatal disease and switched to the C57BL/6N line
    for that reason.
  evidence:
  - reference: PMID:21441111
    reference_title: "Cardiomyopathy in \u03b1-kinase 3 (ALPK3)-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Alpk3 (-/-) mice were produced according to normal Mendelian ratios and appeared normal except for a nonprogressive cardiomyopathy that had features of both hypertrophic and dilated forms of cardiomyopathy."
    explanation: Establishes the model and its mixed hypertrophic/dilated cardiac phenotype.
  modeled_mechanisms:
  - target: Impaired Cardiomyocyte Contractility
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Ventricular contractility falls by about half on cardiac MRI.
    limitations: >-
      A constitutive germline null models the biallelic human genotype, not the
      heterozygous adult-onset disease that accounts for most human cases. The cardiomyopathy
      in this line is explicitly non-progressive and the mice survive; a later study
      reports that this line failed to recapitulate the rapidly progressive, often fatal
      neonatal disease seen in patients, and acquired a different Alpk3-null line instead.
    readouts:
    - name: Left ventricular septal and free wall contractility
      target: Impaired Cardiomyocyte Contractility
      direction: DECREASED
      interpretation: Direct functional correlate of the contractility node in this model.
      evidence:
      - reference: PMID:21441111
        reference_title: "Cardiomyopathy in α-kinase 3 (ALPK3)-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Magnetic resonance imaging showed a 50% reduction in both septal and free wall LV contractility in Alpk3 (-/-) mice."
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:21441111
      reference_title: "Cardiomyopathy in α-kinase 3 (ALPK3)-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cardiomyopathy developed in mice deficient for α-kinase 3 (ALPK3), a nuclear kinase previously implicated in the differentiation of cardiomyocytes."
      explanation: Establishes that loss of Alpk3 in mouse produces cardiomyopathy, so the model is informative for this node.
  - target: Sarcomere and Intercalated Disc Disorganization
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Abnormal intercalated discs with mild myofibrillar disarray on light and electron microscopy.
    limitations: >-
      Disarray in the mouse is described as mild, whereas human adult histopathology shows
      frank myofibrillar disarray.
    evidence:
    - reference: PMID:26846950
      reference_title: "Biallelic Truncating Mutations in ALPK3 Cause Severe Pediatric Cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Consistent with studies in knockout mice, we provide microscopic evidence for intercalated disc remodeling."
      explanation: Human myocardium reproduces the intercalated-disc lesion seen in the mouse, which is what makes the model informative for this node.
    readouts:
    - name: Cardiomyocyte ultrastructure
      target: Sarcomere and Intercalated Disc Disorganization
      direction: ALTERED
      interpretation: Ultrastructural correlate of the disorganization node.
      evidence:
      - reference: PMID:21441111
        reference_title: "Cardiomyopathy in α-kinase 3 (ALPK3)-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "light and electron microscopy revealed altered cardiomyocyte architecture, characterized by reduced numbers of abnormal intercalated discs being associated with mild disarray of myofibrils"
        explanation: Reports the ultrastructural measurement behind this readout.
  - target: Reactive Interstitial Fibrosis
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Interstitial fibrosis, a prominent and prognostically important feature of the human
      disease, does not develop in this model.
    limitations: >-
      Human ALPK3 cardiomyopathy is characterized by extensive myocardial fibrosis on
      imaging and histopathology, and late gadolinium enhancement is a management-relevant
      finding. The constitutive knockout mouse develops neither fibrosis nor inflammation,
      so it cannot be used to study the fibrotic substrate or to test antifibrotic
      strategies for this disease.
    evidence:
    - reference: PMID:21441111
      reference_title: "Cardiomyopathy in α-kinase 3 (ALPK3)-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Interstitial fibrosis and inflammation were notably absent in Alpk3 (-/-) mice"
      explanation: Directly reports the absence of the fibrotic phenotype in this model.
- name: Alpk3 K1420R kinase-dead knock-in mouse
  species: Mouse
  genotype: Alpk3 K1420R/K1420R (invariant catalytic lysine mutated to arginine)
  publication: PMID:38048395
  description: >-
    CRISPR knock-in mice in which the invariant catalytic lysine of the alpha-kinase domain
    is mutated. Unlike the null, these mice are healthy, which is the in vivo evidence that
    ALPK3 acts as a pseudokinase and that disease arises from loss of protein rather than
    loss of catalysis.
  evidence:
  - reference: PMID:38048395
    reference_title: "ALPK3 Functions as a Pseudokinase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we utilized CRISPR/Cas9 technology to generate knock-in mice in which the invariant K1420 of ALPK3 is mutated to arginine(R)"
    explanation: Describes the construction of the knock-in model used here.
  modeled_mechanisms:
  - target: Loss of M-Band Scaffolding
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Abolishing the putative catalytic activity while leaving the protein intact does not
      produce cardiomyopathy. This is a deliberate negative control rather than a failed
      disease model: it dissociates catalysis from the disease mechanism.
    limitations: >-
      The model does not reproduce any disease phenotype and is not a substitute for a
      loss-of-protein model. Its value is exclusionary - it establishes what the mechanism
      is not.
    readouts:
    - name: Survival and cardiac function to adulthood
      target: Loss of M-Band Scaffolding
      direction: UNCHANGED
      interpretation: >-
        Normal survival and function in kinase-dead animals, in contrast to the early
        mortality of the C57BL/6N Alpk3-null line, argues that the scaffolding function
        rather than catalysis is what is lost in disease. The contrast is with that line,
        not with the non-progressive C57BL/6J line also curated here.
      evidence:
      - reference: PMID:38048395
        reference_title: "ALPK3 Functions as a Pseudokinase."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In contrast to the published Alpk3 null mutant mice2, the homozygous Alpk3 KR/KR mice did not exhibit premature mortality and maintained normal cardiac function into adulthood"
        explanation: Reports the survival and cardiac function measurement behind this readout.
    evidence:
    - reference: PMID:38048395
      reference_title: "ALPK3 Functions as a Pseudokinase."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In conclusion, our study presents compelling new evidence from both in vitro and in vivo experiments, supporting that ALPK3 functions as a pseudokinase."
      explanation: The study's conclusion, which is what makes this model informative about the nature of the scaffolding node.
- name: Alpk3 constitutive knockout mouse (C57BL/6N, MRC Harwell line)
  species: Mouse
  genotype: Alpk3-/- (constitutive null, C57BL/6N background, exon 3 deletion)
  publication: PMID:36321451
  description: >-
    A second, independently derived Alpk3-null line, acquired specifically because the
    earlier C57BL/6J null did not reproduce the human neonatal disease course. These mice
    are normal at birth and then develop a rapidly progressive cardiomyopathy in the first
    week with no survivors beyond 14 weeks, which is the closest available model of the
    biallelic human presentation.
  evidence:
  - reference: PMID:36321451
    reference_title: "Pathogenesis of Cardiomyopathy Caused by Variants in ALPK3, an Essential Pseudokinase in the Cardiomyocyte Nucleus and Sarcomere."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A previous Alpk3-/- C57BL/6J mouse model14 failed to recapitulate the rapidly progressive and often fatal neonatal disease that is observed in human patients."
    explanation: States why a second line was needed, and distinguishes it from the C57BL/6J line curated above.
  modeled_mechanisms:
  - target: Ventricular Dilatation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Increased left ventricular cavity dimensions with severely depressed function,
      reproducing the dilated, hypocontractile presentation of biallelic human disease.
    limitations: >-
      A germline null models the biallelic genotype only. The human dilated phase
      characteristically remodels to hypertrophy in survivors; whether this line follows
      that trajectory is not established from the quoted result, and its mice die early.
    readouts:
    - name: Left ventricular cavity dimension and survival
      target: Ventricular Dilatation
      direction: INCREASED
      interpretation: Chamber-level correlate of the dilatation node, with early mortality.
      evidence:
      - reference: PMID:36321451
        reference_title: "Pathogenesis of Cardiomyopathy Caused by Variants in ALPK3, an Essential Pseudokinase in the Cardiomyocyte Nucleus and Sarcomere."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "manifested a rapidly progressive cardiomyopathy in the first week of life that resulted in premature death (no survivors beyond 14 weeks)"
        explanation: Reports the survival measurement behind this readout.
    evidence:
    - reference: PMID:36321451
      reference_title: "Pathogenesis of Cardiomyopathy Caused by Variants in ALPK3, an Essential Pseudokinase in the Cardiomyocyte Nucleus and Sarcomere."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We therefore acquired and studied an alternative model, C57BL/6N Alpk3+/- mice (MRC Harwell Institute), that was created by deleting a region encompassing exon 3"
      explanation: Establishes the identity and derivation of the line, distinguishing it from the C57BL/6J null.
experimental_models:
- name: ALPK3-null human stem cell-derived cardiomyocytes
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Cardiomyocytes differentiated from patient-derived iPSC carrying a homozygous ALPK3
    truncating variant and from gene-edited human ESC lines lacking ALPK3, used to define
    the ultrastructural and electrophysiological consequences of losing the protein in
    human cells.
  publication: PMID:27106955
  evidence:
  - reference: PMID:27106955
    reference_title: "ALPK3-deficient cardiomyocytes generated from patient-derived induced pluripotent stem cells and mutant human embryonic stem cells display abnormal calcium handling and establish that ALPK3 deficiency underlies familial cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that ALPK3-deficient cardiomyocytes derived from pluripotent stem cell models recapitulate the ultrastructural and electrophysiological defects observed in vivo."
    explanation: The authors' own statement that this model system reproduces the in vivo defects, which is what licenses its use here.
  modeled_mechanisms:
  - target: Sarcomere and Intercalated Disc Disorganization
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Disordered sarcomeres and intercalated discs on electron microscopy in both patient-derived and edited lines.
    limitations: >-
      Stem cell-derived cardiomyocytes are immature relative to adult myocardium, and a
      monolayer culture cannot reproduce the chamber-level remodelling that defines the
      clinical phenotype.
    evidence:
    - reference: PMID:27106955
      reference_title: "ALPK3-deficient cardiomyocytes generated from patient-derived induced pluripotent stem cells and mutant human embryonic stem cells display abnormal calcium handling and establish that ALPK3 deficiency underlies familial cardiomyopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Ultra-structural analysis of cardiomyocytes derived from patient-specific and human ESC-derived stem cell lines lacking ALPK3 revealed disordered sarcomeres and intercalated discs."
      explanation: Supports treating this model as informative for the sarcomere and intercalated-disc node.
    readouts:
    - name: Cardiomyocyte ultrastructure by electron microscopy
      target: Sarcomere and Intercalated Disc Disorganization
      direction: ALTERED
      interpretation: Direct ultrastructural correlate of the node in human cells.
      evidence:
      - reference: PMID:27106955
        reference_title: "ALPK3-deficient cardiomyocytes generated from patient-derived induced pluripotent stem cells and mutant human embryonic stem cells display abnormal calcium handling and establish that ALPK3 deficiency underlies familial cardiomyopathy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Ultra-structural analysis of cardiomyocytes derived from patient-specific and human ESC-derived stem cell lines lacking ALPK3 revealed disordered sarcomeres and intercalated discs."
        explanation: Reports the ultrastructural measurement behind this readout.
  - target: Abnormal Cardiomyocyte Calcium Handling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Extended field potential duration and abnormal calcium handling in mutant contractile cultures.
    limitations: >-
      Field potential duration in an immature monolayer is not equivalent to the clinical
      QT interval, so the link to the repolarization phenotype is inferential.
    evidence:
    - reference: PMID:27106955
      reference_title: "ALPK3-deficient cardiomyocytes generated from patient-derived induced pluripotent stem cells and mutant human embryonic stem cells display abnormal calcium handling and establish that ALPK3 deficiency underlies familial cardiomyopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Analysis of differentiated contractile cultures identified abnormal calcium handling as a potential feature of cardiomyocytes lacking ALPK3, providing functional insights into the molecular mechanisms underlying ALPK3-mediated cardiomyopathy."
      explanation: Supports treating this model as informative for the calcium-handling node.
    readouts:
    - name: Field potential duration and intracellular calcium transients
      target: Abnormal Cardiomyocyte Calcium Handling
      direction: ALTERED
      interpretation: Electrophysiological and calcium-handling correlate of the node.
      evidence:
      - reference: PMID:27106955
        reference_title: "ALPK3-deficient cardiomyocytes generated from patient-derived induced pluripotent stem cells and mutant human embryonic stem cells display abnormal calcium handling and establish that ALPK3 deficiency underlies familial cardiomyopathy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Multi-electrode array analysis and calcium imaging demonstrated an extended field potential duration and abnormal calcium handling in mutant contractile cultures."
        explanation: Reports the multi-electrode array and calcium imaging measurements behind this readout.
- name: Isogenic ALPK3 iPSC-derived cardiomyocytes for M-band proteomics
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Isogenic human iPSC-derived cardiomyocyte lines carrying damaging ALPK3 variants, used
    with phosphoproteomics and imaging to establish that ALPK3 is a pseudokinase and that
    its loss mislocalizes myomesins and dysregulates M-band proteostasis proteins.
  publication: PMID:36321451
  evidence:
  - reference: PMID:36321451
    reference_title: "Pathogenesis of Cardiomyopathy Caused by Variants in ALPK3, an Essential Pseudokinase in the Cardiomyocyte Nucleus and Sarcomere."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We explored the putative kinase activity of ALPK3 and the consequences of damaging variants using isogenic human induced pluripotent stem cell-derived cardiomyocytes, mice, and human patient tissues."
    explanation: Describes the isogenic iPSC-cardiomyocyte system used here.
  modeled_mechanisms:
  - target: Myomesin Mislocalization and Impaired Force Buffering
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: ALPK3 loss-of-function variants displaced MYOM1 and MYOM2 from the M-band and nuclear envelope.
    limitations: >-
      Isogenic edited lines isolate the variant effect but remain immature cardiomyocytes;
      the force-buffering consequence is inferred from myomesin biology rather than
      measured directly as force buffering.
    evidence:
    - reference: PMID:36321451
      reference_title: "Pathogenesis of Cardiomyopathy Caused by Variants in ALPK3, an Essential Pseudokinase in the Cardiomyocyte Nucleus and Sarcomere."
      supports: SUPPORT

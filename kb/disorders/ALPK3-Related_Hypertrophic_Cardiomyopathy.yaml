has_subtypes:
- name: Biallelic
  display_name: Biallelic (autosomal recessive, paediatric-onset) ALPK3 cardiomyopathy
  description: >-
    Two damaging ALPK3 alleles, most often two protein-truncating variants. Presents
    prenatally, neonatally, or in the first years of life, frequently as a dilated
    and hypocontractile ventricle that transitions to hypertrophy, and carries a high
    burden of death and transplantation. Extracardiac craniofacial and musculoskeletal
    features are common, and left ventricular outflow tract obstruction is
    characteristically absent.
  evidence:
  - reference: PMID:26846950
    reference_title: "Biallelic Truncating Mutations in ALPK3 Cause Severe Pediatric Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients with biallelic mutations presented with severe hypertrophic and/or dilated cardiomyopathy in utero, at birth, or in early childhood."
    explanation: Establishes the biallelic form as the severe, early-onset end of the ALPK3 spectrum.
  - reference: PMID:41221624
    reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiomyopathy in patients with biallelic ALPK3 variants typically manifested early in life: 4 patients (10%) were diagnosed prenatally, 8 patients (19%) neonatally, and 8 patients (19%) within the first year of birth, highlighting early disease onset."
    explanation: Systematic curation of 42 biallelic patients quantifies the early age at presentation that defines this subtype.
- name: Heterozygous
  display_name: Heterozygous (autosomal dominant, adult-onset) ALPK3 cardiomyopathy
  description: >-
    A single ALPK3 protein-truncating variant. Presents in adulthood as hypertrophic
    cardiomyopathy with incomplete and age-related penetrance, an excess of apical and
    concentric hypertrophy patterns, and extensive myocardial fibrosis. Obligate carrier
    relatives of severely affected children are frequently unaffected.
  evidence:
  - reference: PMID:34263907
    reference_title: "Alpha-protein kinase 3 (ALPK3) truncating variants are a cause of autosomal dominant hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous ALPK3tv are pathogenic and segregate with a characteristic HCM phenotype."
    explanation: Burden testing plus family co-segregation established the heterozygous truncating form as a distinct, pathogenic adult subtype.
  - reference: PMID:36321451
    reference_title: "Pathogenesis of Cardiomyopathy Caused by Variants in ALPK3, an Essential Pseudokinase in the Cardiomyocyte Nucleus and Sarcomere."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These heterozygous variants likely have variable and age-dependent penetrance, because obligate carrier relatives of critically ill infants with recessive ALPK3 cardiomyopathy often have no cardiac disease."
    explanation: States the incomplete, age-related penetrance that distinguishes the heterozygous subtype from the biallelic one.
inheritance:
- name: Autosomal Recessive
  description: >-
    Biallelic damaging ALPK3 variants - homozygous or compound heterozygous, most often
    two protein-truncating alleles - segregate recessively, and the original families
    were consanguineous. ClinGen classifies the autosomal recessive ALPK3-hypertrophic
    cardiomyopathy relationship as Definitive.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:26846950
    reference_title: "Biallelic Truncating Mutations in ALPK3 Cause Severe Pediatric Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The authors performed homozygosity mapping and whole-exome sequencing in 2 consanguineous families with idiopathic pediatric cardiomyopathy."
    explanation: Homozygosity mapping in consanguineous families is the recessive design that identified the gene.
  - reference: CGGV:assertion_6312d79f-df12-4ec6-8ce6-0f38f19e617d-2022-02-09T170000.000Z
    reference_title: "ALPK3 / hypertrophic cardiomyopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ALPK3 | HGNC:17574 | hypertrophic cardiomyopathy | MONDO:0005045 | AR | Definitive"
    explanation: ClinGen classifies the autosomal recessive ALPK3-hypertrophic cardiomyopathy relationship as Definitive.
- name: Autosomal Dominant
  description: >-
    A single ALPK3 protein-truncating variant is transmitted dominantly, with reduced
    and age-dependent penetrance. ClinGen classifies the autosomal dominant relationship
    as Strong. Co-segregation across seven informative families gave a combined LOD
    score of 2.99.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:34263907
    reference_title: "Alpha-protein kinase 3 (ALPK3) truncating variants are a cause of autosomal dominant hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combined logarithm of odds score in seven families with ALPK3tv was 2.99."
    explanation: Family co-segregation evidence for dominant transmission of heterozygous truncating alleles.
  - reference: CGGV:assertion_ace85164-0b70-46a2-ac6b-253088f4514d-2025-01-16T010000.000Z
    reference_title: "ALPK3 / hypertrophic cardiomyopathy (Strong)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ALPK3 | HGNC:17574 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Strong"
    explanation: ClinGen classifies the autosomal dominant ALPK3-hypertrophic cardiomyopathy relationship as Strong.
prevalence:
- population: Adults with hypertrophic cardiomyopathy (pooled sequencing cohorts, North America, Europe and East Asia)
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Not a population prevalence. Reported only as the share of adult hypertrophic
    cardiomyopathy probands carrying an ALPK3 protein-truncating variant, pooled across
    seven cohorts totalling 27,147 probands. The population-level occurrence of
    ALPK3-related cardiomyopathy has never been measured directly, and cannot be
    inferred from this fraction because penetrance is incomplete and age-related.
  evidence:
  - reference: PMID:41221624
    reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This translates to a pooled prevalence of 0.62% for truncations, 0.36% for non-truncations, and an overall variance prevalence of 0.99%."
    explanation: Pooled case fraction of ALPK3 variants across large adult hypertrophic cardiomyopathy sequencing cohorts.
pathophysiology:
- name: ALPK3 Loss of Function
  role: trigger
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    Protein-truncating ALPK3 alleles - nonsense, frameshift and canonical splice-site
    variants - are the dominant disease-causing class. The truncated transcript is
    degraded by nonsense-mediated decay, so the mechanism is loss of protein rather than
    a dominant-negative or gain-of-function effect: biallelic carriers lose essentially
    all ALPK3, heterozygous carriers are haploinsufficient.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: sarcomere organization
    modifier: ABNORMAL
    term:
      id: GO:0045214
      label: sarcomere organization
  genes:
  - preferred_term: ALPK3
    term:
      id: hgnc:17574
      label: ALPK3
  downstream:
  - target: Extracardiac Striated Muscle and Craniofacial Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      ALPK3 is expressed in skeletal muscle as well as myocardium, which is the stated
      rationale for the extracardiac features of biallelic disease. How the loss produces
      the craniofacial and skeletal anomalies specifically is not established.
    evidence:
    - reference: PMID:41221624
      reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This multisystem pattern is biologically plausible, because ALPK3 expression is not confined to the heart: robust expression has been documented in developing and adult skeletal muscle as well as in myocardium, providing a mechanistic rationale for the skeletal-muscle and craniofacial manifestations observed in these patients."
      explanation: States the expression-based rationale connecting ALPK3 loss to the extracardiac branch, and does so as a plausibility argument, which is why the edge is recorded with unknown intermediates.
  - target: Loss of M-Band Scaffolding
    causal_link_type: DIRECT
    description: Absence of the ALPK3 protein removes the scaffold it forms at the M-band and nuclear envelope.
    evidence:
    - reference: PMID:36321451
      reference_title: "Pathogenesis of Cardiomyopathy Caused by Variants in ALPK3, an Essential Pseudokinase in the Cardiomyocyte Nucleus and Sarcomere."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "ALPK3 is an essential cardiac pseudokinase that inserts in the nuclear envelope and the sarcomere M-band."
      explanation: >-
        Ties loss of the ALPK3 protein directly to loss of its sarcomeric localisation. The
        quoted sentence also asserts nuclear-envelope localisation, which this entry does
        not adopt because it is disputed; only the M-band half is relied on here.
  evidence:
  - reference: PMID:27106955
    reference_title: "ALPK3-deficient cardiomyocytes generated from patient-derived induced pluripotent stem cells and mutant human embryonic stem cells display abnormal calcium handling and establish that ALPK3 deficiency underlies familial cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We performed detailed clinical and genetic analyses of a consanguineous family, identifying a new ALPK3 mutation (c.3792G>A, p.W1264X) which undergoes nonsense-mediated decay in ex vivo and in vivo tissues."
    explanation: Demonstrates nonsense-mediated decay of a truncating allele, establishing loss of function as the mechanism.
  - reference: PMID:41221624
    reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of ALPK3 pathogenic variants reveals that over 70% are truncating, strongly supporting haploinsufficiency as the principal disease driver."
    explanation: Establishes truncating loss of function as the predominant allele class across the reported variant spectrum.
- name: Extracardiac Striated Muscle and Craniofacial Involvement
  description: >-
    Biallelic ALPK3 loss produces a cardio-cranio-skeletal picture in about half of
    patients: craniofacial dysmorphism and cleft palate alongside hypotonia, joint
    contractures, pterygia, scoliosis and short stature. This branch is specific to the
    biallelic subtype; heterozygous carriers are not reported to have it.
  biological_scale: ORGANISM
  downstream:
  - target: Abnormal facial shape
  - target: Cleft palate
  - target: Hypotonia
  - target: Flexion contracture
  - target: Pterygium
  - target: Scoliosis
  - target: Short stature
  evidence:
  - reference: PMID:41221624
    reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to cardiomyopathy, extracardiac abnormalities were common (52%; 22 patients) and characteristic in patients with biallelic ALPK3 variants"
    explanation: Quantifies how often the extracardiac branch is present in biallelic disease.
  - reference: PMID:32480058
    reference_title: "Expanding the clinical and genetic spectrum of ALPK3 variants: Phenotypes identified in pediatric cardiomyopathy patients and adults with heterozygous variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of patients had extracardiac phenotypes, including contractures, scoliosis, cleft palate, and facial dysmorphisms."
    explanation: Independent cohort confirming the extracardiac branch and naming its components.
- name: Loss of M-Band Scaffolding
  description: >-
    ALPK3 is an atypical alpha-kinase that sits at the sarcomeric M-band, where it
    organizes myomesins and the machinery that turns over sarcomere proteins, including
    MuRF E3 ubiquitin ligases and SQSTM1/p62. The node is deliberately scoped to the
    M-band. Two further claims are contested and are therefore not asserted here (see the
    discussion alpk3_pseudokinase_controversy): whether ALPK3 has catalytic activity at
    all, and whether it also occupies the nuclear envelope, which one group reports and
    another, using endogenously tagged protein, did not observe. The M-band localization
    and the proteostatic role are agreed on by both sides of that dispute.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: sarcomere M-band
    term:
      id: GO:0031430
      label: M band
  downstream:
  - target: Myomesin Mislocalization and Impaired Force Buffering
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36321451
      reference_title: "Pathogenesis of Cardiomyopathy Caused by Variants in ALPK3, an Essential Pseudokinase in the Cardiomyocyte Nucleus and Sarcomere."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "ALPK3 loss-of-function variants caused myomesin proteins to mislocalize and also dysregulated several additional M-band proteins involved in sarcomere protein turnover, which ultimately impaired cardiomyocyte structure and function."
      explanation: Directly links loss of the ALPK3 scaffold to myomesin mislocalization.
  - target: Impaired Sarcomere Proteostasis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41221624
      reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "ALPK3 lacks catalytic activity and maintains sarcomeric proteostasis by scaffolding MYOMs (myomesins), MuRF (muscle ring-finger protein) E3 ligases, and SQSTM1 (sequestosome-1)/p62."
      explanation: States that the scaffolding function is what maintains sarcomeric proteostasis, so its loss disrupts proteostasis.
  evidence:
  - reference: PMID:36321451
    reference_title: "Pathogenesis of Cardiomyopathy Caused by Variants in ALPK3, an Essential Pseudokinase in the Cardiomyocyte Nucleus and Sarcomere."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Phosphoproteomic evaluation of both ALPK3 kinase domain inhibition and overexpression failed to detect significant changes in catalytic activity, establishing ALPK3 as a pseudokinase."
    explanation: >-
      The phosphoproteomic basis for treating ALPK3 as a scaffold rather than a kinase.
      This is one side of an open dispute, not a settled result - see the discussion
      alpk3_pseudokinase_controversy.
  - reference: PMID:38048395
    reference_title: "ALPK3 Functions as a Pseudokinase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In conclusion, our study presents compelling new evidence from both in vitro and in vivo experiments, supporting that ALPK3 functions as a pseudokinase."
    explanation: Independent in vitro and knock-in mouse confirmation that ALPK3 has no catalytic activity, supporting a scaffolding role.
- name: Myomesin Mislocalization and Impaired Force Buffering
  description: >-
    ALPK3 colocalizes with myomesin-1 and myomesin-2 at the M-band and nuclear envelope.
    When ALPK3 is lost the myomesins are displaced, removing the elastic elements that
    buffer contractile force across the sarcomere M-band.
  biological_scale: MOLECULAR
  downstream:
  - target: Sarcomere and Intercalated Disc Disorganization
    causal_link_type: DIRECT
  - target: Impaired Cardiomyocyte Contractility
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36321451
      reference_title: "Pathogenesis of Cardiomyopathy Caused by Variants in ALPK3, an Essential Pseudokinase in the Cardiomyocyte Nucleus and Sarcomere."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "ALPK3 cardiomyopathy may cause impaired contractility and ventricular dilatation because of mislocalization and dysregulation of myomesin proteins, which are critical for force buffering in cardiomyocytes."
      explanation: >-
        The source's proposed causal step from myomesin mislocalization to impaired
        contractility. Its own wording is "may cause", so this is the paper's mechanistic
        proposal rather than a demonstrated step.
  evidence:
  - reference: PMID:36321451
    reference_title: "Pathogenesis of Cardiomyopathy Caused by Variants in ALPK3, an Essential Pseudokinase in the Cardiomyocyte Nucleus and Sarcomere."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Investigations into alternative functions revealed that ALPK3 colocalized with myomesin proteins (MYOM1, MYOM2) at both the nuclear envelope and the sarcomere M-band."
    explanation: Establishes the ALPK3-myomesin association whose loss underlies this node.
- name: Impaired Sarcomere Proteostasis
  description: >-
    The M-band is the site at which sarcomere proteins are turned over. Loss of ALPK3
    dysregulates the M-band ubiquitin-proteasome and autophagy machinery it scaffolds,
    and thick-filament proteins aggregate rather than being cleared.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: proteasome-mediated turnover of sarcomere proteins
    modifier: DYSREGULATED
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
  downstream:

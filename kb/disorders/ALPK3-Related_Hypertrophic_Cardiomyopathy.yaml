    M-band and defined the ALPK3-dependent phosphoproteome, using human pluripotent stem
    cell-derived cardiomyocytes carrying cardiomyopathic ALPK3 mutations.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 16
  publication: PMID:39196058
  notes: >-
    Surfaced by scripts/discover_datasets.py and selected after manual relevance triage.
    The tool tagged it GENE_ONLY and tagged five other candidates DIRECT, but those five

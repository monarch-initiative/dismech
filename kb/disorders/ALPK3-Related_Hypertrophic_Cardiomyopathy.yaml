has_subtypes:
- name: Biallelic
  display_name: Biallelic (autosomal recessive) ALPK3 cardiomyopathy
  description: >-
    Two damaging ALPK3 alleles, often two protein-truncating variants. Disease commonly presents prenatally or in childhood, but adult diagnoses are reported. Presentation may be hypertrophic, dilated or mixed; some dilated presentations subsequently develop hypertrophy. Craniofacial and musculoskeletal findings are common in clinically ascertained cohorts. Absence of outflow obstruction in reported series is not a diagnostic requirement.
  evidence:
  - reference: PMID:26846950
    reference_title: "Biallelic Truncating Mutations in ALPK3 Cause Severe Pediatric Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients with biallelic mutations presented with severe hypertrophic and/or dilated cardiomyopathy in utero, at birth, or in early childhood."
    explanation: Establishes the biallelic form as the severe, early-onset end of the ALPK3 spectrum.
  - reference: PMID:41221624
    reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiomyopathy in patients with biallelic ALPK3 variants typically manifested early in life: 4 patients (10%) were diagnosed prenatally, 8 patients (19%) neonatally, and 8 patients (19%) within the first year of birth, highlighting early disease onset."
    explanation: Systematic curation of 42 biallelic patients quantifies the early age at presentation that defines this subtype.
    quote_role: REVIEW_SYNTHESIS
- name: Heterozygous
  display_name: Heterozygous (autosomal dominant) ALPK3 cardiomyopathy
  description: >-
    A single pathogenic ALPK3 allele, usually protein-truncating, is associated predominantly with adult-onset HCM, although adolescent diagnoses occur. Penetrance is incomplete and age-related. Apical and concentric patterns and myocardial fibrosis are reported, but morphology and severity vary; currently unaffected relatives require longitudinal assessment.
  evidence:
  - reference: PMID:34263907
    reference_title: "Alpha-protein kinase 3 (ALPK3) truncating variants are a cause of autosomal dominant hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous ALPK3tv are pathogenic and segregate with a characteristic HCM phenotype."
    explanation: Burden testing plus family co-segregation established the heterozygous truncating form as a distinct, pathogenic adult subtype.
  - reference: PMID:36321451
    reference_title: "Pathogenesis of Cardiomyopathy Caused by Variants in ALPK3, an Essential Pseudokinase in the Cardiomyocyte Nucleus and Sarcomere."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These heterozygous variants likely have variable and age-dependent penetrance, because obligate carrier relatives of critically ill infants with recessive ALPK3 cardiomyopathy often have no cardiac disease."
    explanation: States the incomplete, age-related penetrance that distinguishes the heterozygous subtype from the biallelic one.
    quote_role: REVIEW_SYNTHESIS
inheritance:
- name: Autosomal Recessive
  description: >-
    Biallelic damaging ALPK3 variants - homozygous or compound heterozygous, most often two protein-truncating alleles - segregate recessively, and the original families were consanguineous. ClinGen classifies the autosomal recessive ALPK3-hypertrophic cardiomyopathy relationship as Definitive. When both parents carry a causative allele, each pregnancy has a 25% chance of biallelic disease, a 50% chance of heterozygosity and a 25% chance of inheriting neither allele. Heterozygous ALPK3 relatives can themselves develop cardiomyopathy in adulthood.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:26846950
    reference_title: "Biallelic Truncating Mutations in ALPK3 Cause Severe Pediatric Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The authors performed homozygosity mapping and whole-exome sequencing in 2 consanguineous families with idiopathic pediatric cardiomyopathy."
    explanation: Homozygosity mapping in consanguineous families is the recessive design that identified the gene.
  - reference: CGGV:assertion_6312d79f-df12-4ec6-8ce6-0f38f19e617d-2022-02-09T170000.000Z
    reference_title: "ALPK3 / hypertrophic cardiomyopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ALPK3 | HGNC:17574 | hypertrophic cardiomyopathy | MONDO:0005045 | AR | Definitive"
    explanation: ClinGen classifies the autosomal recessive ALPK3-hypertrophic cardiomyopathy relationship as Definitive.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1768/
    reference_title: Nonsyndromic Hypertrophic Cardiomyopathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being heterozygous, and a 25% chance of inheriting neither of the ... HCM-related pathogenic variants.
    explanation: GeneReviews gives recurrence risks when both parents carry an autosomal recessive HCM-related variant; its ALPK3-specific caveat is that heterozygotes can develop adult cardiomyopathy. These are transmission probabilities, not penetrance estimates.
    quote_role: REVIEW_SYNTHESIS
- name: Autosomal Dominant
  description: >-
    A single ALPK3 protein-truncating variant is transmitted dominantly, with reduced and age-dependent penetrance. ClinGen classifies the autosomal dominant relationship as Strong. Co-segregation across seven informative families gave a combined LOD score of 2.99. Each child has a 50% chance of inheriting the familial pathogenic variant; inheritance does not guarantee clinical disease because penetrance is incomplete.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:

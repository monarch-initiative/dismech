discussions:
- discussion_id: alpk3_pseudokinase_controversy
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is ALPK3 a catalytically inactive scaffold, or a genuine kinase that phosphorylates
    SQSTM1 and other M-band proteins?
  attaches_to:
  - pathophysiology#Loss of M-Band Scaffolding
  rationale: >-
    ALPK3 catalytic activity remains disputed. One group reported no relevant activity in biochemical assays and normal adult hearts in mice carrying an invariant catalytic-lysine substitution. Another reported increased phosphorylation after recombinant-domain addition to deficient cardiomyocyte lysates and phosphorylation of SQSTM1; the lysate system does not exclude indirect kinase effects. The studies used different constructs and systems. Nuclear localization is also disputed: tagged overexpression supported a nuclear-envelope pool, whereas endogenous tagging localized ALPK3 to the M band without a nuclear signal. Shared M-band localization and protein-interaction findings support a structural role, but neither catalytic activity nor all downstream causal steps are settled.
  evidence:
  - reference: PMID:38048395
    reference_title: "ALPK3 Functions as a Pseudokinase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Recent studies present conflicting findings on ALPK3's kinase activity2,3."
    explanation: States the existence of the disagreement in the primary literature.
  - reference: PMID:39196058
    reference_title: "Alpha kinase 3 signaling at the M-band maintains sarcomere integrity and proteostasis in striated muscle."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Finally, ALPK3 phosphorylates and is required for the sarcomeric localization of SQSTM1, an important transporter of polyubiquitinated proteins23,24."
    explanation: The claim of catalytic activity on a named substrate, which is the position opposing the pseudokinase conclusion.
  - reference: PMID:38048395
    reference_title: "ALPK3 Functions as a Pseudokinase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we investigated the phosphorylation status of the T269/S272 site of SQSTM1 by western blotting, but we did not observe a significant difference in T269/S272 phosphorylation to total SQSTM1 ratios between the hearts of the control mice and those carrying homozygous ALPK3KR/KR mutation"
    explanation: Directly contests the SQSTM1 substrate claim at the same residues, in vivo, which is the sharpest point of disagreement between the two positions.
- discussion_id: alpk3_risk_model_calibration
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do the conventional hypertrophic cardiomyopathy sudden-death risk models perform
    adequately in ALPK3 truncating variant carriers?
  attaches_to:
  - phenotypes#Ventricular tachycardia
  - phenotypes#Cardiac arrest
  - treatments#Implantable Cardioverter-Defibrillator
  - phenotypes#Sudden cardiac death
  rationale: >-
    ALPK3-specific calibration of conventional HCM sudden-death risk models has not been established. Adult heterozygous cohorts document myocardial fibrosis and nonsustained ventricular tachycardia, but one major cohort observed no appropriate ICD shocks during follow-up. Separately, the biallelic case report by Jorholt et al. documents sudden cardiac death at age 12 despite previous surveillance without ventricular tachycardia or syncope. The pediatric event and adult cohort follow-up answer different questions and should not be combined into an unsupported incidence estimate. A later Swedish apical-HCM series did document an appropriate ICD discharge in an ALPK3 heterozygote. Thus the absence of shocks in the earlier cohort does not establish absence of risk across all heterozygous patients.
  evidence:
  - reference: PMID:34263907
    reference_title: "Alpha-protein kinase 3 (ALPK3) truncating variants are a cause of autosomal dominant hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Age at diagnosis and maximum left ventricular wall thickness were similar to SP- and left ventricular systolic impairment (6%) and non-sustained ventricular tachycardia (31%) at baseline similar to SP+"
    explanation: Documents the dissociation the question turns on - wall thickness like sarcomere-negative patients, arrhythmia burden like sarcomere-positive ones.
  - reference: PMID:34263907
    reference_title: "Alpha-protein kinase 3 (ALPK3) truncating variants are a cause of autosomal dominant hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The absence of arrhythmic events despite of the high proportion of ICD referrals, fibrosis and non-sustained ventricular tachycardia at baseline and follow-up did not allow modelling of SCD risk in patients with this particular genotype."
    explanation: The earlier cohort lacked events sufficient for genotype-specific sudden-death risk modeling. This does not negate the pediatric sudden death or the appropriate ICD therapies reported in other series.
  - reference: PMID:33076350
    reference_title: Two New Cases of Hypertrophic Cardiomyopathy and Skeletal Muscle Features Associated with ALPK3 Homozygous and Compound Heterozygous Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At the age of 12, the patient had no progression of chamber enlargement or reduction of contractility, but died due to sudden cardiac death (SCD) after 30 min of unsuccessful resuscitation.
    explanation: Case 1 had two reported ALPK3 frameshift variants and severe nonobstructive HCM. Sudden death occurred despite prior rhythm monitoring without documented ventricular tachycardia; a single case cannot establish incidence.
  - reference: PMID:40428316
    reference_title: Unravelling the Genotype of the Apical Variant of Hypertrophic Cardiomyopathy in a Swedish Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The female patient with a wall thickness of 16 mm experienced an ICD discharge while running due to sustained VT, and a pathogenic variant in the non-sarcomeric ALPK3 gene was detected.
    explanation: The Swedish apical-HCM series documents an appropriate ICD discharge in the female ALPK3 carrier. The overall cohort event rates and aneurysm prevalence are not ALPK3-specific.
- discussion_id: alpk3_knockout_fibrosis_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does the original constitutive Alpk3 knockout mouse lack fibrosis reported in human ALPK3 cardiomyopathy?
  attaches_to:
  - pathophysiology#Reactive Interstitial Fibrosis
  rationale: >-
    The 2011 constitutive-null mouse reproduces contractile and ultrastructural abnormalities but lacks interstitial fibrosis and inflammation under the reported conditions. Human cohorts document fibrosis on imaging and histopathology, although it is not present in every patient. This limits the original line as a model of the human fibrotic phenotype; the observation should not be generalized to every Alpk3 mutant model.
  evidence:
  - reference: PMID:21441111
    reference_title: "Cardiomyopathy in α-kinase 3 (ALPK3)-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Interstitial fibrosis and inflammation were notably absent in Alpk3 (-/-) mice"
    explanation: The model-side half of the mismatch.
  - reference: PMID:34263907
    reference_title: "Alpha-protein kinase 3 (ALPK3) truncating variants are a cause of autosomal dominant hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Imaging and histopathology showed extensive myocardial fibrosis and myocyte vacuolation."
    explanation: The human-side half of the mismatch.
- discussion_id: alpk3_mavacamten_safety
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the clinical benefit-risk balance of mavacamten in ALPK3 cardiomyopathy, particularly in patients with severe biallelic disease and systolic dysfunction?
  attaches_to:
  - treatments#Mavacamten
  rationale: >-
    The ALPK3-specific mavacamten experiment used isolated K201X mouse cardiomyocytes. Treatment improved relaxation in heterozygous cells but did not rescue homozygous relaxation and reduced fractional shortening. Many ALPK3 patients lack outflow obstruction, and severe biallelic disease can include systolic dysfunction. The balance of benefit and negative inotropy therefore requires clinical study; the ex vivo findings do not establish a genotype-specific treatment recommendation.
  evidence:
  - reference: PMID:41221624
    reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although homozygous animals exhibited contractile dysfunction, they did not develop overt ventricular wall thickening, and treatment was restricted to ex vivo isolated cardiomyocytes."
    explanation: States the two limitations - no overt hypertrophy in the model and ex vivo-only treatment - that leave the question open.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:41221624
    reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In heterozygous ALPK3 PTVs, hypertrophy is typically apical or concentric, LVOT obstruction is uncommon (~4% overall), and systolic function is preserved in most."
    explanation: Documents the mismatch between the ALPK3 phenotype and the approved indication for the drug.
    quote_role: REVIEW_SYNTHESIS
notes: >-
  Term scope: MONDO:0054838 corresponds to OMIM:618052 / CMH27, which some sources name "autosomal recessive familial hypertrophic cardiomyopathy-27". This entry deliberately spans both the biallelic recessive form and the numerically dominant heterozygous adult-onset form, because they are one gene-disease relationship with a zygosity-dependent presentation and the literature treats them together. MONDO's own label carries no inheritance restriction, so the term supports that scope. Note that both ClinGen assertions cited here are curated against MONDO:0005045 (the broad hypertrophic cardiomyopathy term), not against MONDO:0054838; that is ClinGen's practice, not a mismatch introduced here. The March 2025 GeneReviews Nonsyndromic Hypertrophic Cardiomyopathy Overview includes ALPK3 and supplies a general clinical, diagnostic, management and counseling baseline. Clinical frequencies and genotype-specific features are drawn from ALPK3 cohorts rather than transferred from HCM overall.
diagnosis:
- name: Echocardiography and cardiac MRI
  description: >-
    Echocardiography and, when needed, cardiac MRI establish the cardiac phenotype and assess ventricular thickness, function and fibrosis. The GeneReviews HCM criteria are unexplained maximum left ventricular wall thickness of at least 15 mm in adults, or 13–14 mm with a family history; pediatric interpretation uses body-size-adjusted measurements. These general HCM criteria do not exclude ALPK3 disease presenting with ventricular dilatation or systolic dysfunction before hypertrophy.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1768/
    reference_title: Nonsyndromic Hypertrophic Cardiomyopathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of HCM is most often established with noninvasive cardiac imaging, including echocardiography and/or cardiac MRI.
    explanation: General HCM diagnostic baseline, applicable to the hypertrophic presentation of ALPK3 cardiomyopathy.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1768/
    reference_title: Nonsyndromic Hypertrophic Cardiomyopathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: If there is a family history of a clinical or molecular diagnosis of HCM, a maximum LV wall thickness ... 13-14 mm supports the diagnosis.
    explanation: GeneReviews explains the lower imaging threshold in a family with clinical or molecular HCM; this is not an ALPK3-specific criterion.
    quote_role: REVIEW_SYNTHESIS
- name: Molecular diagnosis and family segregation
  description: >-
    Use a cardiomyopathy multigene panel that includes ALPK3 and deletion/duplication analysis, or exome/genome sequencing when appropriate. Interpret the allele class, zygosity and family segregation together: one pathogenic truncating allele can cause dominant disease, whereas two damaging alleles can produce severe recessive disease. A variant of uncertain significance alone does not establish the diagnosis. Periodic reanalysis of unresolved sequencing can be useful when inheritance evidence or transcript annotation changes; segregation can reveal both affected and currently asymptomatic carriers. A contiguous deletion including ALPK3 can coexist with a damaging sequence variant on the other allele; copy-number analysis and sequencing therefore answer complementary questions.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1768/
    reference_title: Nonsyndromic Hypertrophic Cardiomyopathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: that also includes deletion/duplication analysis is recommended.
    explanation: In its molecular-testing section GeneReviews recommends a multigene panel including deletion/duplication analysis; ALPK3 is listed in its HCM gene table.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:41645375
    reference_title: "[Genetic re-analysis of a Chinese pedigree affected with Hypertrophic cardiomyopathy due to a heterozygous truncating variant of ALPK3 gene and literature review]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the mother exhibited severe obstructive HCM, while the brother was asymptomatic, suggesting incomplete or age-dependent penetrance within the family.
    explanation: The reported family was resolved by reanalysis after recognition of dominant ALPK3 disease. Transcript revision changed the original p.Pro720ThrfsTer53 annotation to NM_020778.5 p.Pro518ThrfsTer53; these describe the same reported allele.
  - reference: url:https://pure.rug.nl/ws/files/915064722/Contiguous_Gene_Deletion_of_Chromosome_15q25.2q25.3_in_Biallelic_ALPK3-Related_Cardiomyopathy-_Novel_Insights_Into_Phenotypic_Presentation_and_Variant_Spectrum.pdf
    reference_title: https://pure.rug.nl/ws/files/915064722/Contiguous_Gene_Deletion_of_Chromosome_15q25.2q25.3_in_Biallelic_ALPK3-Related_Cardiomyopathy-_Novel_Insights_Into_Phenotypic_Presentation_and_Variant_Spectrum.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: cardiac screening uncovered severe HCM.
    explanation: Full text of Grutters et al. (2023), PMID:37671554. In this child, cleft palate and contractures prompted genetic evaluation before cardiac symptoms; cardiac screening then identified severe concentric biventricular HCM.
mechanistic_hypotheses:
- hypothesis_group_id: alpk3_myomesin_force_buffering
  hypothesis_label: Myomesin mislocalization impairs force buffering
  status: EMERGING
  description: Myomesin mislocalization may impair sarcomere integrity and force buffering. The cellular localization phenotype is measured; its specific contribution to impaired contractility remains a mechanistic proposal and varies across ALPK3 models.
- hypothesis_group_id: alpk3_proteostasis_hypertrophy
  hypothesis_label: Impaired sarcomere protein turnover promotes hypertrophy
  status: EMERGING
  description: Dysregulated protein clearance is proposed to drive thick-filament accumulation and hypertrophic remodeling. Timing and phenotype vary across germline, adult-induced and truncation models, and direct mediation of hypertrophy by a specific turnover defect remains unresolved.

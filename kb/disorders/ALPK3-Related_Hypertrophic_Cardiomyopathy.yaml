- name: Mavacamten
  description: >-
    In the ALPK3 K201X mouse study, mavacamten was tested in isolated cardiomyocytes, not as systemic treatment. It improved resting sarcomere length and diastolic calcium; relaxation improved in heterozygous cells but not homozygous cells. Fractional shortening decreased with treatment. These experiments establish partial cellular rescue, not clinical efficacy in ALPK3 cardiomyopathy. Negative inotropy is particularly relevant when systolic function is already impaired; most heterozygous clinical cases nevertheless have preserved systolic function.

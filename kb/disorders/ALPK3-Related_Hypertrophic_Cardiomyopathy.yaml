discussions:
- discussion_id: alpk3_pseudokinase_controversy
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is ALPK3 a catalytically inactive scaffold, or a genuine kinase that phosphorylates
    SQSTM1 and other M-band proteins?
  attaches_to:
  - pathophysiology#Loss of M-Band Scaffolding
  rationale: >-
    Two groups reach opposite conclusions from overlapping systems. Agarwal and colleagues
    found no phosphoproteomic change on either inhibition or overexpression of the ALPK3
    kinase domain and called ALPK3 a pseudokinase; a subsequent study found no activity in
    vitro and showed that mice carrying a kinase-dead knock-in of the invariant catalytic
    lysine are healthy into adulthood, which is the strongest in vivo argument for the
    pseudokinase view. McNamara and colleagues report the opposite: recombinant ALPK3
    kinase domain increases phosphorylation in ALPK3-deficient cardiomyocyte lysates, and
    ALPK3 directly phosphorylates SQSTM1 at T269/S272. The same two studies also disagree
    on localization - the pseudokinase work places ALPK3 at both the nuclear envelope and
    the M-band, while endogenously tagged ALPK3 showed no nuclear localization at all.
    This is unresolved and matters therapeutically: a scaffold is addressed by replacing
    the protein, whereas a kinase might be addressed by restoring its downstream
    phosphorylation. Note the two views agree on the M-band localization and on the
    proteostatic role, so the pathograph downstream of this node is not in dispute.
  evidence:
  - reference: PMID:38048395
    reference_title: "ALPK3 Functions as a Pseudokinase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Recent studies present conflicting findings on ALPK3's kinase activity2,3."
    explanation: States the existence of the disagreement in the primary literature.
  - reference: PMID:39196058
    reference_title: "Alpha kinase 3 signaling at the M-band maintains sarcomere integrity and proteostasis in striated muscle."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Finally, ALPK3 phosphorylates and is required for the sarcomeric localization of SQSTM1, an important transporter of polyubiquitinated proteins23,24."
    explanation: The claim of catalytic activity on a named substrate, which is the position opposing the pseudokinase conclusion.
  - reference: PMID:38048395
    reference_title: "ALPK3 Functions as a Pseudokinase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we investigated the phosphorylation status of the T269/S272 site of SQSTM1 by western blotting, but we did not observe a significant difference in T269/S272 phosphorylation to total SQSTM1 ratios between the hearts of the control mice and those carrying homozygous ALPK3KR/KR mutation"
    explanation: Directly contests the SQSTM1 substrate claim at the same residues, in vivo, which is the sharpest point of disagreement between the two positions.
- discussion_id: alpk3_risk_model_calibration
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do the conventional hypertrophic cardiomyopathy sudden-death risk models perform
    adequately in ALPK3 truncating variant carriers?
  attaches_to:
  - phenotypes#Ventricular tachycardia
  - phenotypes#Cardiac arrest
  - treatments#Implantable Cardioverter-Defibrillator
  rationale: >-
    Established risk models were derived largely from sarcomere-gene cohorts and weight
    maximal wall thickness and outflow tract gradient heavily. ALPK3 carriers have wall
    thickness comparable to sarcomere-negative patients, rarely have outflow obstruction,
    and yet carry extensive fibrosis and a rate of non-sustained ventricular tachycardia
    comparable to sarcomere-positive disease. No study has assessed model calibration in
    this genotype, so it is not known whether the models under-call risk here. Note that
    this entry asserts no sudden cardiac death phenotype: across every source curated here
    the only sudden-death language is generic background about hypertrophic cardiomyopathy,
    the recorded deaths are heart-failure deaths, and the largest heterozygous cohort
    reported no appropriate ICD shocks over follow-up and said outright that sudden-death
    risk could not be modelled in this genotype. The arrhythmic endpoint that is evidenced
    is cardiac arrest, in the paediatric biallelic group.
  evidence:
  - reference: PMID:34263907
    reference_title: "Alpha-protein kinase 3 (ALPK3) truncating variants are a cause of autosomal dominant hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Age at diagnosis and maximum left ventricular wall thickness were similar to SP- and left ventricular systolic impairment (6%) and non-sustained ventricular tachycardia (31%) at baseline similar to SP+"
    explanation: Documents the dissociation the question turns on - wall thickness like sarcomere-negative patients, arrhythmia burden like sarcomere-positive ones.
  - reference: PMID:34263907
    reference_title: "Alpha-protein kinase 3 (ALPK3) truncating variants are a cause of autosomal dominant hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The absence of arrhythmic events despite of the high proportion of ICD referrals, fibrosis and non-sustained ventricular tachycardia at baseline and follow-up did not allow modelling of SCD risk in patients with this particular genotype."
    explanation: The authors state directly that sudden-death risk could not be modelled in this genotype, which is why no sudden cardiac death phenotype is asserted in this entry.
- discussion_id: alpk3_knockout_fibrosis_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does the constitutive Alpk3 knockout mouse not develop the myocardial fibrosis
    that dominates the human phenotype?
  attaches_to:
  - pathophysiology#Reactive Interstitial Fibrosis
  rationale: >-
    Extensive myocardial fibrosis is a defining and prognostically important feature of
    human ALPK3 cardiomyopathy, reported both as late gadolinium enhancement on cardiac
    MRI and at histopathology. The constitutive Alpk3-null mouse reproduces the
    contractile and ultrastructural lesions but explicitly lacks interstitial fibrosis and
    inflammation. Until this divergence is explained, the mouse cannot be used to test
    antifibrotic or fibrosis-targeted interventions, and negative fibrosis results in that
    model should not be read back onto human disease.
  evidence:
  - reference: PMID:21441111
    reference_title: "Cardiomyopathy in α-kinase 3 (ALPK3)-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Interstitial fibrosis and inflammation were notably absent in Alpk3 (-/-) mice"
    explanation: The model-side half of the mismatch.
  - reference: PMID:34263907
    reference_title: "Alpha-protein kinase 3 (ALPK3) truncating variants are a cause of autosomal dominant hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Imaging and histopathology showed extensive myocardial fibrosis and myocyte vacuolation."
    explanation: The human-side half of the mismatch.
- discussion_id: alpk3_mavacamten_safety
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is mavacamten safe in ALPK3 cardiomyopathy given that most carriers are
    non-obstructive and a substantial minority are hypokinetic?
  attaches_to:
  - treatments#Mavacamten
  rationale: >-
    The only ALPK3 mavacamten data are ex vivo, from isolated cardiomyocytes of a knock-in
    mouse that does not itself develop overt wall thickening. The drug reduced fractional
    shortening as expected from its mechanism. Because outflow obstruction is uncommon in
    ALPK3 carriers, biallelic disease frequently presents hypokinetic, and about 15% of
    initial hypertrophic cases later burn out to a dilated phenotype, the population in
    which benefit would outweigh negative inotropy has not been defined.
  evidence:
  - reference: PMID:41221624
    reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although homozygous animals exhibited contractile dysfunction, they did not develop overt ventricular wall thickening, and treatment was restricted to ex vivo isolated cardiomyocytes."
    explanation: States the two limitations - no overt hypertrophy in the model and ex vivo-only treatment - that leave the question open.
  - reference: PMID:41221624
    reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In heterozygous ALPK3 PTVs, hypertrophy is typically apical or concentric, LVOT obstruction is uncommon (~4% overall), and systolic function is preserved in most."
    explanation: Documents the mismatch between the ALPK3 phenotype and the approved indication for the drug.
notes: >-
  Term scope: MONDO:0054838 corresponds to OMIM:618052 / CMH27, which some sources name
  "autosomal recessive familial hypertrophic cardiomyopathy-27". This entry deliberately
  spans both the biallelic recessive form and the numerically dominant heterozygous
  adult-onset form, because they are one gene-disease relationship with a zygosity-dependent
  presentation and the literature treats them together. MONDO's own label carries no
  inheritance restriction, so the term supports that scope. Note that both ClinGen
  assertions cited here are curated against MONDO:0005045 (the broad hypertrophic
  cardiomyopathy term), not against MONDO:0054838; that is ClinGen's practice, not a
  mismatch introduced here.

  GeneReviews baseline: there is no ALPK3-specific GeneReviews chapter. The nearest is the
  Nonsyndromic Hypertrophic Cardiomyopathy Overview (PMID:20301725), tagged in the
  top-level references block, but its PubMed record is a book citation with no abstract
  text and it does not mention ALPK3, so it could not be used as a phenotype baseline and
  backs no claim here. The phenotype set was instead built from the systematic variant
  curation in PMID:41221624 and the primary cohorts.

  Entry created after finding that the requested concept, familial hypertrophic
  cardiomyopathy (MONDO:0024573), is already curated as a Grouping whose recorded
  rationale argues against a third Disease entry at that level. CMH27 was curated instead
  as a genuine gap in that grouping's member series.

      reference_title: Alpha protein kinase 3 gene therapy restores heart function in mouse and human models of cardiomyopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: In sum, truncating variants in Alpk3 impair both global and sarcomere-targeted proteostasis, and ALPK3 gene therapy directly rescues this phenotype.

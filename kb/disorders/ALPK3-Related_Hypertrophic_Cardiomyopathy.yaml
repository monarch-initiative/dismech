    ALPK3, on chromosome 15q25.2, encodes a muscle-specific protein with a nuclear localization signal, immunoglobulin-like domains and a C-terminal alpha-kinase domain whose catalytic activity is disputed. Protein-truncating variants dominate the reported pathogenic spectrum. The 2021 HCM discovery and validation cohorts each showed approximately 16-fold enrichment versus population controls; non-truncating variants were not significantly enriched in that analysis.

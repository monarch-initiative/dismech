    snippet: "In human pluripotent stem cell-derived cardiomyocytes modeling cardiomyopathic ALPK3 mutations, sarcomeric organization and M-band localization of SQSTM1 were abnormal suggesting that this mechanism may underly disease pathogenesis."
    explanation: Independently links ALPK3 mutation to displacement of the ubiquitin-binding protein that routes damaged sarcomere proteins for clearance.

      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "ALPK3 cardiomyopathy may cause hypertrophy because of dysregulation of key M-band proteins, which are important for sarcomere protein turnover."
      explanation: >-
        The source's proposed causal step from impaired sarcomere proteostasis to
        hypertrophy. Its own wording is "may cause", so this is the paper's mechanistic
        proposal rather than a demonstrated step.
  evidence:
  - reference: PMID:36321451
    reference_title: "Pathogenesis of Cardiomyopathy Caused by Variants in ALPK3, an Essential Pseudokinase in the Cardiomyocyte Nucleus and Sarcomere."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We conclude that ALPK3 cardiomyopathy induces ventricular dilatation caused by insufficient myomesin-mediated force buffering and hypertrophy by impairment of sarcomere proteostasis."
    explanation: The paper's own two-arm mechanistic conclusion, of which this node is the hypertrophy arm.
  - reference: PMID:39196058

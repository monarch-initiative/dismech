- name: Cascade Genetic Testing and Cardiac Surveillance of Variant Carriers
  description: >-
    Genetic counseling and cascade testing identify relatives who need continued cardiac surveillance, including heterozygous relatives of children with biallelic disease. GeneReviews recommends echocardiography and ECG every one to two years for relatives with a familial HCM-related pathogenic variant; a normal initial evaluation does not exclude later disease. Counseling distinguishes the 25% biallelic recurrence risk for two carrier parents from the 50% transmission risk for a heterozygous parent, while explaining age-dependent penetrance.

- name: ALPK3
  gene_term:
    preferred_term: ALPK3
    term:
      id: hgnc:17574
      label: ALPK3
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  review_notes: >-
    ALPK3, on chromosome 15q25.2, encodes a 201-kD muscle-specific protein with a nuclear
    localization signal, two immunoglobulin-like domains and a C-terminal alpha-kinase
    domain whose catalytic activity is disputed. Protein-truncating variants dominate the
    pathogenic spectrum and are enriched roughly 6- to 10-fold in hypertrophic
    cardiomyopathy probands over population controls; non-truncating variants are not
    significantly enriched.
  case_fractions:
  - population: UK hypertrophic cardiomyopathy discovery cohort (770 probands)
    case_fraction_percent: 1.56
    notes: Heterozygous ALPK3 truncating variants, versus gnomAD (OR 16.11).
    evidence:
    - reference: PMID:34263907
      reference_title: "Alpha-protein kinase 3 (ALPK3) truncating variants are a cause of autosomal dominant hypertrophic cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In a discovery cohort of 770 index patients with HCM, 12 (1.56%) were heterozygous for ALPK3tv"
      explanation: Quantifies the ALPK3 share of cases in the discovery cohort.
  - population: International hypertrophic cardiomyopathy validation cohort (2047 probands)
    case_fraction_percent: 1.56
    notes: Independent replication of the discovery-cohort fraction (OR 16.17).
    evidence:

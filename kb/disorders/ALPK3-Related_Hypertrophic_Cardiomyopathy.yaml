- name: Loss of M-Band Scaffolding
  description: >-
    ALPK3 localizes to the sarcomeric M band and associates with myomesins, MuRF proteins and SQSTM1/p62 in several experimental systems. Loss of this structural role is a proposed proximal explanation for abnormal sarcomere organization and protein homeostasis. Catalytic activity and nuclear-envelope localization remain disputed; individual binding partners and localization defects differ between models.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: sarcomere M-band
    term:
      id: GO:0031430
      label: M band
  downstream:
  - target: Myomesin Mislocalization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36321451
      reference_title: "Pathogenesis of Cardiomyopathy Caused by Variants in ALPK3, an Essential Pseudokinase in the Cardiomyocyte Nucleus and Sarcomere."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "ALPK3 loss-of-function variants caused myomesin proteins to mislocalize and also dysregulated several additional M-band proteins involved in sarcomere protein turnover, which ultimately impaired cardiomyocyte structure and function."
      explanation: Directly links loss of the ALPK3 scaffold to myomesin mislocalization.
  - target: Impaired Sarcomere Proteostasis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:41221624
      reference_title: "ALPK3 Cardiomyopathy: Integrative Review With Systematic Variant Curation, Mechanisms, and Translation."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "ALPK3 lacks catalytic activity and maintains sarcomeric proteostasis by scaffolding MYOMs (myomesins), MuRF (muscle ring-finger protein) E3 ligases, and SQSTM1 (sequestosome-1)/p62."
      explanation: States that the scaffolding function is what maintains sarcomeric proteostasis, so its loss disrupts proteostasis.
      quote_role: REVIEW_SYNTHESIS
    description: ALPK3 loss alters protein homeostasis, but the specific mediators connecting its structural interactions to turnover remain unresolved.
  - target: SQSTM1 Mislocalization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: ALPK3 interacts with SQSTM1 and ALPK3 deficiency disrupts its M-band localization; the precise binding and phosphorylation requirements remain unresolved.

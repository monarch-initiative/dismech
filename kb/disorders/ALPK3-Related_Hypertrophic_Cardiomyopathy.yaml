      reference_title: "Alpha-protein kinase 3 (ALPK3) truncating variants are a cause of autosomal dominant hypertrophic cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In a validation cohort of 2047 HCM probands, 32 (1.56%) carried heterozygous ALPK3tv"
      explanation: Quantifies the ALPK3 share of cases in the independent validation cohort.

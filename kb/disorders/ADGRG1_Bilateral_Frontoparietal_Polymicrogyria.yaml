description: >-
  Bilateral frontoparietal polymicrogyria (BFPP) is an autosomal recessive
  malformation of cortical development caused by biallelic loss-of-function
  variants in
  ADGRG1 (formerly GPR56), which encodes an adhesion G protein-coupled receptor.
  GPR56 is expressed in cortical radial glial progenitors and their basal
  endfeet, where it binds its extracellular-matrix ligand collagen III (COL3A1)
  to maintain the integrity of the pial basement membrane and to restrain
  neuronal migration through Galpha-12/13-RhoA signaling. Loss of GPR56 function
  breaches the pial basement membrane and permits ectopic overmigration of
  neurons beyond the pial limit, producing a frontoparietally predominant
  polymicrogyria that overlaps with the cobblestone (type II lissencephaly)
  malformation spectrum. Clinical severity varies: developmental and motor
  delay, intellectual disability, seizures (refractory in a reported subset),
  cerebellar or pyramidal signs, oculomotor abnormalities, pontocerebellar
  dysplasia and white-matter abnormalities are recurrent. Mouse constitutive and
  conditional studies support a cell-autonomous GPR56 role in oligodendrocyte
  precursors, providing a parallel candidate mechanism for hypomyelination.
  Regional ADGRG1 regulation helps shape the
  classic frontoparietal pattern; a non-coding regulatory deletion produces a
  related perisylvian-predominant phenotype, while atypical diffuse disease has
  also been reported. Biallelic COL3A1 ligand-side disease is a closely related
  but genetically distinct cobblestone-like differential diagnosis.

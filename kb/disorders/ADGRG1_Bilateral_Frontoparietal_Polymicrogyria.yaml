progression:
- phase: Infancy and early childhood
  age_range: Birth through early childhood
  notes: >-
    Hypotonia or a pseudomyopathic presentation may be the first recognized
    feature, followed by delayed motor and cognitive development. Normal muscle
    evaluation helps separate this presentation from congenital muscular
    dystrophy-dystroglycanopathy.
  evidence:
  - reference: PMID:20929962
    reference_title: "GPR56-related bilateral frontoparietal polymicrogyria: further evidence for an overlap with the cobblestone complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a distinctive clinical course characterized by pseudomyopathic behaviour
      at onset that subsequently evolved into severe mental and motor
      retardation
    explanation: >-
      The cohort documents the early pseudomyopathic presentation and later
      neurodevelopmental impairment.
  - reference: PMID:25922261
    reference_title: "GPR56-Related Polymicrogyria: Clinicoradiologic Profile of 4 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinicoradiologic profile resembles congenital muscular dystrophy.
      However, no muscle disease or characteristic eye abnormalities of
      congenial muscular dystrophy are detected in these children.
    explanation: >-
      This four-person series identifies the early muscular-dystrophy-like
      presentation while documenting the absence of muscle disease.
- phase: Childhood epilepsy and evolving neurologic disability
  age_range: Childhood through adulthood
  notes: >-
    Seizures commonly begin in childhood and may include generalized or focal
    seizures, epileptic spasms and, in a selected series, evolution to
    Lennox-Gastaut syndrome. Motor and cognitive outcomes vary, although
    substantial lifelong disability is common.
  evidence:
  - reference: PMID:20929962
    reference_title: "GPR56-related bilateral frontoparietal polymicrogyria: further evidence for an overlap with the cobblestone complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Generalized seizures (12/14) occurred later with onset ranging from 2.5
      to 10 years
    explanation: >-
      Documents childhood seizure onset in the main 14-person cohort.
  - reference: PMID:19016831
    reference_title: "Bilateral frontoparietal polymicrogyria, Lennox-Gastaut syndrome, and GPR56 gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epilepsy, present in all four patients, had started between ages 1 and 8
      years, with infantile spasms in one patient and with de novo Lennox-Gastaut
      syndrome in the remaining three.
    explanation: >-
      A selected four-person series expands the epilepsy spectrum but does not
      establish Lennox-Gastaut syndrome as universal in BFPP.
- phase: Evolution of white-matter imaging abnormalities
  age_range: Infancy through later childhood
  notes: >-
    Severe hypomyelination may be present in infancy and evolve into patchy
    white-matter lesions later in childhood.
  evidence:
  - reference: PMID:20929962
    reference_title: "GPR56-related bilateral frontoparietal polymicrogyria: further evidence for an overlap with the cobblestone complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the white matter abnormalities showed a peculiar evolution from severe
      hypomyelination at 4 months to patchy lesions later in childhood
    explanation: >-
      Serial imaging documents age-dependent evolution of the white-matter
      phenotype.
pathophysiology:
- name: Loss of GPR56 Adhesion GPCR Function
  description: >-
    Recessive loss-of-function mutations in ADGRG1/GPR56, an adhesion-family G
    protein-coupled receptor expressed in cortical radial glial progenitors and
    their basal endfeet, impair receptor function. Missense variants analyzed in
    PMID:21349848 were located in the extracellular region (ectodomain, GPS
    autoproteolysis site and extracellular loops) and affected different
    combinations of surface expression, proteolysis, shedding, ligand
    interaction and membrane distribution. These heterogeneous defects converge
    on reduced GPR56 function as the initiating molecular lesion of BFPP.
  genes:
  - preferred_term: ADGRG1
    term:
      id: hgnc:4512
      label: ADGRG1
  biological_processes:
  - preferred_term: G protein-coupled receptor signaling pathway
    term:
      id: GO:0007186
      label: G protein-coupled receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:15044805
    reference_title: "G protein-coupled receptor-dependent development of human frontal cortex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we show that mutations in GPR56, which encodes an orphan G
      protein-coupled receptor (GPCR) with a large extracellular domain, cause a
      human brain cortical malformation called bilateral frontoparietal
      polymicrogyria (BFPP)
    explanation: >-
      Establishes GPR56/ADGRG1 mutations as the cause of BFPP and identifies the
      gene product as a GPCR with a large extracellular domain.
  - reference: PMID:21349848
    reference_title: Disease-associated GPR56 mutations cause bilateral frontoparietal polymicrogyria via multiple mechanisms.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      individual GPR56 mutants most likely cause BFPP via different combination
      of multiple mechanisms. These include reduced surface receptor
      expression, loss of GPS proteolysis, reduced receptor shedding, inability
      to interact with a novel protein ligand
    explanation: >-
      Details the convergent molecular consequences of disease-associated
      extracellular-region mutations that impair GPR56 function.
  downstream:
  - target: Disrupted GPR56-Collagen III Signaling
    description: >-
      Reduced receptor availability and function diminish the independently
      established collagen III-GPR56 pathway that normally restrains neuronal
      migration.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21768377
      reference_title: "G protein-coupled receptor 56 and collagen III, a receptor-ligand pair, regulates cortical development and lamination."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here we identify collagen, type III, alpha-1 (gene symbol Col3a1) as the
        ligand of GPR56 through an in vitro biotinylation/proteomics approach.
      explanation: >-
        Directly identifies collagen III as the GPR56 ligand; it does not depend
        on the unidentified ligand-binding assay in PMID:21349848.
    - reference: PMID:21349848
      reference_title: Disease-associated GPR56 mutations cause bilateral frontoparietal polymicrogyria via multiple mechanisms.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        individual GPR56 mutants most likely cause BFPP via different combination
        of multiple mechanisms. These include reduced surface receptor
        expression, loss of GPS proteolysis, reduced receptor shedding, inability
        to interact with a novel protein ligand
      explanation: >-
        Variant-specific assays support reduced functional receptor availability
        but did not identify the assayed novel ligand as collagen III; this item
        therefore provides only partial support for the collagen-pathway edge.
  - target: Impaired Oligodendrocyte Precursor Proliferation and Maturation
    description: >-
      Loss of GPR56 in oligodendrocyte-lineage cells reduces active RhoA and OPC
      proliferation, creating a parallel white-matter disease branch.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25607655
      reference_title: The adhesion G protein-coupled receptor GPR56 is a cell-autonomous regulator of oligodendrocyte development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Gpr56-knockout mice manifest with decreased oligodendrocyte precursor
        cell (OPC) proliferation and diminished levels of active RhoA, leading
        to fewer mature oligodendrocytes and a reduced number of myelinated axons
        in the corpus callosum and optic nerves.
      explanation: >-
        Constitutive and conditional mouse experiments establish a
        cell-autonomous oligodendrocyte-lineage branch downstream of GPR56 loss.
  - target: Rostral Cerebellar Granule Cell Adhesion Failure
    description: >-
      GPR56 loss in developing rostral cerebellar granule cells impairs adhesion
      to pial extracellular matrix and disrupts local morphogenesis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19515912
      reference_title: GPR56-regulated granule cell adhesion is essential for rostral cerebellar development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        granule cells from the rostral region of perinatal Gpr56(-/-) cerebella
        show loss of adhesion to extracellular matrix molecules of the pial
        basement membrane.
      explanation: >-
        The knockout and rescue experiments directly link GPR56 loss to impaired
        rostral cerebellar granule-cell adhesion.
  - target: Hypoplasia of the Pons
    description: >-
      Biallelic ADGRG1 loss is associated with pontine hypoplasia, but the
      intervening brainstem developmental mechanism has not been established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34513772
      reference_title: "Case Report: Diffuse Polymicrogyria Associated With a Novel ADGRG1 Variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pathogenic variants of the ADGRG1 gene are associated with bilateral
        frontoparietal polymicrogyria, defined radiologically by polymicrogyria
        with an anterior-posterior gradient, pontine and cerebellar hypoplasia and
        patchy white matter abnormalities.
      explanation: >-
        Human clinicoradiologic evidence links ADGRG1 disease to pontine
        hypoplasia while leaving the intervening mechanism unresolved.
  - target: Hypotonia
    description: >-
      Hypotonia is associated with biallelic ADGRG1 disease, but the relative
      contributions of cortical, cerebellar, brainstem and white-matter pathology
      are unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34513772
      reference_title: "Case Report: Diffuse Polymicrogyria Associated With a Novel ADGRG1 Variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Clinically, BFPP presents as a pseudomyopathic pattern, with hypotonia
        developing in the ﬁrst year of life and occasionally being identiﬁed at
        birth
      explanation: >-
        Human clinical evidence links ADGRG1-related BFPP to early hypotonia but
        does not resolve the intervening neural mechanism.
  - target: Abnormality of Eye Movement
    description: >-
      Eye-movement abnormalities are associated with ADGRG1 disease, but the
      responsible cortical, cerebellar or brainstem circuit has not been
      established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:25922261
      reference_title: "GPR56-Related Polymicrogyria: Clinicoradiologic Profile of 4 Patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Affected patients present with delayed milestones, intellectual
        disability, epilepsy, ataxia, and eye movement abnormalities.
      explanation: >-
        The clinical series links ADGRG1-related polymicrogyria to eye-movement

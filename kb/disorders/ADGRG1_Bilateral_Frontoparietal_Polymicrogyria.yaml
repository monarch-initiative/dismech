- name: Disrupted GPR56-Collagen III Signaling
  description: >-
    Collagen III (COL3A1), a pial extracellular-matrix component produced in the
    meninges, is a ligand of GPR56 in the developing cortex. Engagement of GPR56
    by collagen III couples to the Galpha-12/13 family of G proteins and activates
    RhoA, which restrains neuronal migration. Loss of receptor or ligand removes
    this brake and destabilizes cortical lamination.
  conforms_to: pial_basement_membrane_radial_glial_endfoot_failure#GPR56-COL3A1 Pial ECM Signaling Failure

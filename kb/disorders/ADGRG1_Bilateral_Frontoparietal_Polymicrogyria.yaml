notes: >-
  Entry created from cortical-malformation epic 4098 (issue 4087), seeded from
  Romero, Bahi-Buisson & Francis 2018 (Sem Cell Dev Biol 76:33-75). Modeled as a
  coherent ADGRG1/GPR56 pial basement-membrane / radial glial endfoot
  pathomechanism rather than lumped under generic polymicrogyria. Biallelic
  COL3A1 ligand-side disease (PMID:28258187, PMID:28742248) is represented here
  as a differential diagnosis and shared-axis context; a separate local COL3A1
  brain-malformation entry has not yet been curated. The GPR56-COL3A1, pial
  basement-membrane breach, radial-glial endfoot detachment and neuronal
  overmigration nodes conform to the pial basement membrane / radial glial
  endfoot failure module. The independent oligodendrocyte-lineage and rostral
  cerebellar branches are disease-specific additions.

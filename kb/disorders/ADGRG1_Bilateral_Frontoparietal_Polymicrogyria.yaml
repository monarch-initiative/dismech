discussions:
- discussion_id: gap_adgrg1_human_regional_patterning_model_mismatch
  prompt: >-
    Which human-relevant cis-regulatory, splice-form and gyrencephalic features
    determine whether ADGRG1 disruption produces classic frontoparietal,
    perisylvian or diffuse polymicrogyria, and how can those spatial effects be
    separated from the conserved pial-boundary mechanism reproduced in mice?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Regional Cortical Patterning Dependence on GPR56 Expression
  - pathophysiology#Neuronal Overmigration and Cortical Dyslamination
  rationale: >-
    Gpr56-null and Col3a1-null mice validly reproduce pial basement-membrane
    breach, endfoot failure and neuronal overmigration; the null mouse should not
    be described as a globally unpatterned model. The unresolved mismatch is
    narrower: a naturally lissencephalic mouse cannot model human cortical
    folding, and human-relevant ADGRG1 splice forms and gyrencephalic
    cis-regulatory architecture are not reproduced by mouse. The human
    15-base-pair regulatory deletion
    selectively affects perisylvian cortex, while coding variants usually produce
    classic BFPP but can occasionally produce diffuse disease. A human model is
    therefore needed to test the interaction between allele class, regional
    identity and the corticomeningeal pial boundary.
  evidence:
  - reference: PMID:18509043
    reference_title: GPR56 regulates pial basement membrane integrity and cortical lamination.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This study demonstrates that loss of the mouse Gpr56 gene leads to neuronal
      ectopia in the cerebral cortex, a cobblestone-like cortical malformation.
    explanation: >-
      The knockout supports the conserved cortical-ectopia mechanism; it does not
      justify describing the mouse phenotype as globally unpatterned.
  - reference: PMID:21768377
    reference_title: "G protein-coupled receptor 56 and collagen III, a receptor-ligand pair, regulates cortical development and lamination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mutations in the GPR56 gene cause a malformed cerebral cortex in both humans
      and mice that resembles cobblestone lissencephaly, which is characterized by
      overmigration of neurons beyond the pial basement membrane.
    explanation: >-
      Establishes that mouse models reproduce the conserved overmigration and
      cobblestone arm, isolating human folding and allele-specific regional
      architecture as the translational gap.
  - reference: PMID:24531968
    reference_title: Evolutionarily dynamic alternative splicing of GPR56 regulates regional cerebral cortical patterning.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      GPR56 splice forms are highly variable between mice and humans, and the
      regulatory element of gyrencephalic mammals directs restricted lateral
      cortical expression.
    explanation: >-
      Documents that the splicing and cis-regulatory architecture controlling
      regional GPR56 expression differ between mouse and human and motivates a
      human regional-patterning model.
  proposed_experiments:
  - experiment_id: exp_adgrg1_regionally_patterned_corticomeningeal_organoids
    name: Regionally patterned human corticomeningeal organoid experiment
    description: >-
      Use isogenic human iPSC-derived cortical organoids patterned toward frontal,
      parietal and perisylvian/lateral identities and supplied with a
      meningeal collagen-III compartment adjacent to a laminin/collagen-IV-rich
      pial-like basement membrane. Compare biallelic coding loss of function with
      the 15-base-pair regulatory deletion to test how allele class and regional
      identity interact to alter ADGRG1 expression, pial-boundary integrity,
      radial-glial anchorage and neuronal overmigration.
    experiment_type:
      preferred_term: isogenic regionally patterned corticomeningeal organoid experiment
    model_systems:

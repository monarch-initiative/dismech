diagnosis:
- name: Brain MRI pattern recognition
  description: >-
    Brain MRI is the principal phenotypic test. Bilateral frontoparietally
    predominant polymicrogyria with an anterior-posterior gradient, cerebellar
    dysplasia or cysts, pontine hypoplasia and patchy-to-diffuse white-matter
    abnormalities strongly suggests ADGRG1-related BFPP, while diffuse patterns
    do not exclude it.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: MAXO:0000424
      label: magnetic resonance imaging procedure
  results: >-
    A characteristic bilateral frontoparietal cortical malformation with
    pontocerebellar and white-matter involvement prioritizes ADGRG1 testing.
  evidence:
  - reference: PMID:20929962
    reference_title: "GPR56-related bilateral frontoparietal polymicrogyria: further evidence for an overlap with the cobblestone complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neuroimaging demonstrated a common phenotype with bilateral
      frontoparietally predominant polymicrogyria (13/13), cerebellar dysplasia
      with cysts mainly affecting the superior vermis (11/13) and patchy to
      diffuse myelination abnormalities (13/13).
    explanation: >-
      The cohort defines the combined cortical, white-matter and
      cerebellar MRI pattern.
  - reference: PMID:34513772
    reference_title: "Case Report: Diffuse Polymicrogyria Associated With a Novel ADGRG1 Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants of the ADGRG1 gene are associated with bilateral
      frontoparietal polymicrogyria, defined radiologically by polymicrogyria
      with an anterior-posterior gradient, pontine and cerebellar hypoplasia and
      patchy white matter abnormalities.
    explanation: >-
      This clinicoradiologic summary directly supports the anterior-posterior
      gradient and pontine component included in the diagnostic pattern.
- name: ADGRG1 molecular genetic confirmation
  description: >-
    Diagnosis is confirmed by identifying biallelic pathogenic or likely
    pathogenic ADGRG1 variants in an individual with a compatible MRI and
    clinical phenotype. Once familial variants are known, targeted prenatal
    molecular diagnosis can be offered in an at-risk pregnancy.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: MAXO:0000533
      label: molecular genetic testing
    qualifiers:
    - predicate:
        preferred_term: has participant
        term:
          id: RO:0000057
          label: has participant
      value:
        preferred_term: ADGRG1
        term:
          id: hgnc:4512
          label: ADGRG1
  results: Biallelic pathogenic ADGRG1 variants establish molecular confirmation.
  evidence:
  - reference: PMID:16240336
    reference_title: Genotype-phenotype analysis of human frontoparietal polymicrogyria syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified homozygous GPR56 mutations in all 29 patients with typical BFPP.
    explanation: >-
      Molecular testing detected biallelic variants in all 29 typical cases in
      this diagnostic cohort.
  - reference: PMID:25922261
    reference_title: "GPR56-Related Polymicrogyria: Clinicoradiologic Profile of 4 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Antenatal diagnosis is possible if the index case is genetically confirmed.
    explanation: >-
      The clinical series supports familial prenatal diagnosis once the causal
      variants are established.
differential_diagnoses:
- name: Muscular dystrophy-dystroglycanopathy spectrum
  disease_term:
    preferred_term: dystroglycanopathy
    term:
      id: MONDO:0018276
      label: muscular dystrophy-dystroglycanopathy
  description: >-
    Severe dystroglycanopathies share hypotonia, developmental impairment,
    cobblestone cortical malformation and pontocerebellar abnormalities. The
    pseudomyopathic ADGRG1 presentation can therefore initially resemble a
    congenital muscular dystrophy.
  distinguishing_features:
  - Normal muscle evaluation and absence of characteristic structural eye disease favor ADGRG1-related BFPP.
  - Elevated creatine kinase, muscular dystrophy and major structural eye anomalies favor dystroglycanopathy.
  - Biallelic ADGRG1 variants confirm BFPP; variants in alpha-dystroglycan glycosylation genes support dystroglycanopathy.
  evidence:
  - reference: PMID:25922261
    reference_title: "GPR56-Related Polymicrogyria: Clinicoradiologic Profile of 4 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinicoradiologic profile resembles congenital muscular dystrophy.
      However, no muscle disease or characteristic eye abnormalities of
      congenial muscular dystrophy are detected in these children.
    explanation: >-
      The four-person series directly states both the overlap and the key muscle
      and eye distinctions.
- name: Biallelic COL3A1-related cobblestone-like cortical malformation
  disease_term:
    preferred_term: biallelic COL3A1-related cobblestone-like cortical malformation
  description: >-
    Biallelic COL3A1 disease affects the ligand side of the same GPR56-collagen
    III axis and can closely reproduce the cortical, cerebellar and white-matter
    phenotype. It is not currently represented by a separate local disease entry.
  distinguishing_features:
  - Biallelic COL3A1 rather than ADGRG1 variants establish the ligand-side disorder.
  - Connective-tissue abnormalities or vascular complications support COL3A1 disease, although the brain phenotype can be strikingly similar.
  evidence:
  - reference: PMID:28258187
    reference_title: "Bi-allelic variants in COL3A1 encoding the ligand to GPR56 are associated with cobblestone-like cortical malformation, white matter changes and cerebellar cysts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous or compound heterozygous mutations in COL3A1 are associated with
      cobblestone-like malformation in all three families reported to date.
    explanation: >-
      Human genetic evidence establishes a ligand-side disorder that closely
      overlaps ADGRG1-related BFPP.
  - reference: PMID:28742248
    reference_title: Biallelic COL3A1 mutations result in a clinical spectrum of specific structural brain anomalies and connective tissue abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bilateral frontoparietal polymicrogyria of the cobblestone variant,
      cerebellar microcysts, and abnormalities of the white matter characterize
      this brain phenotype and resemble neurological manifestations in
      individuals with autosomal recessive mutations in GPR56
    explanation: >-
      The second report defines the overlapping imaging pattern.
  - reference: PMID:28742248
    reference_title: Biallelic COL3A1 mutations result in a clinical spectrum of specific structural brain anomalies and connective tissue abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This patient was born with bilateral clubfoot, joint laxity, and dysmorphic
      facial features. At the age of 2 years she developed an aneurysmal brain
      hemorrhage.
    explanation: >-
      Case-level connective-tissue and vascular findings support their use as
      distinguishing clues for biallelic COL3A1 disease, while not implying that
      every affected person has them.
- name: Other bilateral polymicrogyria syndromes and BFPP2
  disease_term:
    preferred_term: other bilateral polymicrogyria syndromes and BFPP2
  description: >-
    Bilateral frontal, perisylvian, generalized or BFPP-like polymicrogyria can
    arise without ADGRG1 variants. Imaging distribution alone is therefore not a
    substitute for molecular confirmation.
  distinguishing_features:
  - A typical BFPP MRI plus biallelic pathogenic ADGRG1 variants favors this disorder.
  - Mutation-negative BFPP-like disease or a different regional polymicrogyria pattern should prompt broader malformation-of-cortical-development testing.
  evidence:
  - reference: PMID:16240336
    reference_title: Genotype-phenotype analysis of human frontoparietal polymicrogyria syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, we analyzed five patients with BFPP who did not show GPR56
      mutation and found that they define a clinically, radiographically, and
      genetically distinct syndrome that we termed BFPP2.
    explanation: >-
      The study establishes a mutation-negative BFPP-like differential.
  - reference: PMID:16240336
    reference_title: Genotype-phenotype analysis of human frontoparietal polymicrogyria syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Finally, we studied seven patients with a variety of other polymicrogyria
      syndromes including bilateral frontal polymicrogyria, bilateral
      perisylvian polymicrogyria, and bilateral generalized polymicrogyria. No
      GPR56 mutation was found in these patients.
    explanation: >-
      Other regional bilateral polymicrogyria syndromes lacked GPR56 variants in
      this cohort and require separate molecular evaluation.
animal_models:
- species: Mouse (Mus musculus)
  genotype: Constitutive Gpr56-null mouse
  category: Knockout
  genes:
  - preferred_term: Gpr56 (Adgrg1)
    term:
      id: hgnc:4512
      label: ADGRG1
  associated_phenotypes:
  - Pial basement-membrane breach
  - Radial-glial endfoot detachment
  - Neuronal overmigration and cobblestone-like cortical ectopia
  - Rostral cerebellar dysplasia
  - Central nervous system hypomyelination
  description: >-
    Constitutive Gpr56-null mice reproduce the core pial-boundary,
    overmigration, rostral cerebellar and early hypomyelination mechanisms. The
    lissencephalic mouse does not model human gyrification, and species-specific
    splice or regulatory architecture limits inference about the human
    perisylvian regulatory allele.
  evidence:
  - reference: PMID:18509043
    reference_title: GPR56 regulates pial basement membrane integrity and cortical lamination.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This study demonstrates that loss of the mouse Gpr56 gene leads to neuronal
      ectopia in the cerebral cortex, a cobblestone-like cortical malformation.
    explanation: >-
      The knockout reproduces cortical ectopia and the cobblestone-like
      overmigration mechanism.
  - reference: PMID:19515912
    reference_title: GPR56-regulated granule cell adhesion is essential for rostral cerebellar development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Gpr56(-/-) mice display a severe malformation of the rostral cerebellum
      that develops perinatally.
    explanation: >-
      The same knockout establishes the region-specific cerebellar phenotype.
  - reference: PMID:25607655
    reference_title: The adhesion G protein-coupled receptor GPR56 is a cell-autonomous regulator of oligodendrocyte development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we demonstrate that loss of Gpr56 leads to hypomyelination of the
      central nervous system in mice.
    explanation: >-
      The model also reproduces the early white-matter phenotype.

    Homozygous coding variants have been identified across multiple populations
    and families. Disease-associated variants converge on reduced receptor
    function through heterogeneous effects on trafficking, proteolysis,
    shedding, ligand interaction and membrane distribution. A 15-base-pair
    regulatory-element deletion causes a related perisylvian-predominant ADGRG1
    phenotype by disrupting regional expression and should not be treated as
    identical to classic BFPP.
  evidence:
  - reference: PMID:15044805
    reference_title: "G protein-coupled receptor-dependent development of human frontal cortex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we show that mutations in GPR56, which encodes an orphan G
      protein-coupled receptor (GPCR) with a large extracellular domain, cause a
      human brain cortical malformation called bilateral frontoparietal
      polymicrogyria (BFPP)
    explanation: >-
      Founding report identifying GPR56/ADGRG1 mutations as the cause of BFPP.
  - reference: PMID:20929962
    reference_title: "GPR56-related bilateral frontoparietal polymicrogyria: further evidence for an overlap with the cobblestone complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified homozygous GPR56 mutations in 14 patients from eight
      consanguineous families with typical bilateral bifrontoparietal
      polymicrogyria
    explanation: >-
      Confirms recessive (homozygous) GPR56 mutations in a multi-family BFPP
      cohort, consistent with autosomal recessive loss of function.
  - reference: PMID:16240336
    reference_title: Genotype-phenotype analysis of human frontoparietal polymicrogyria syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified homozygous GPR56 mutations in all 29 patients with typical BFPP.
    explanation: >-
      A diagnostic cohort independently establishes the biallelic ADGRG1
      association with typical BFPP.
  - reference: PMID:21349848
    reference_title: Disease-associated GPR56 mutations cause bilateral frontoparietal polymicrogyria via multiple mechanisms.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      individual GPR56 mutants most likely cause BFPP via different combination
      of multiple mechanisms. These include reduced surface receptor expression,
      loss of GPS proteolysis, reduced receptor shedding, inability to interact
      with a novel protein ligand, and differential distribution of the 7TM
      moiety in lipid rafts.
    explanation: >-
      Functional assays define multiple variant-level routes that converge on
      loss of receptor function.
  - reference: PMID:24531968
    reference_title: Evolutionarily dynamic alternative splicing of GPR56 regulates regional cerebral cortical patterning.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we describe a 15-base pair deletion mutation in a regulatory element of
      GPR56 that selectively disrupts human cortex surrounding the Sylvian
      fissure bilaterally including "Broca's area," the primary language area,
      by disrupting regional GPR56 expression and blocking RFX transcription
      factor binding
    explanation: >-
      This regulatory allele establishes a distinct region-specific ADGRG1
      phenotype and clarifies its boundary relative to classic BFPP.

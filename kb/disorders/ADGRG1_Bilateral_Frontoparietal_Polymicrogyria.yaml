- name: Regional Cortical Patterning Dependence on GPR56 Expression
  description: >-
    GPR56 is expressed in cortical progenitor cells in a regionally restricted,
    promoter-controlled pattern, and its expression levels regulate progenitor
    proliferation. A 15-base-pair deletion in a region-specific regulatory
    element selectively disrupts lateral/perisylvian cortex and represents a
    related ADGRG1 allelic phenotype, whereas classic BFPP is usually
    frontoparietal or follows an anterior-posterior severity gradient. Regional
    control is important but not absolute: rare coding-variant cases with diffuse
    polymicrogyria without a clear gradient have been reported.

- name: Pial Basement Membrane Breach
  description: >-
    GPR56 signaling at cortical radial-glial basal endfeet maintains the pial
    basement membrane in the developing forebrain. Loss of GPR56 (or its
    collagen III ligand) breaches the cortical glia limitans and creates gaps
    through which neurons can escape the cortical plate; the rostral cerebellar
    context is represented in its separate disease-specific branch.

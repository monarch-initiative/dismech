    explanation: Establishes obesity as a risk factor and notes its effect on treatment.
- name: Early Walking Age
  presence: PRESENT
  description: >-
    Early ambulation loads the physis before it is mechanically mature, and the
    infantile form characteristically worsens once walking begins.
  influences_mechanisms:
  - target: Excess Compressive Load on the Medial Proximal Tibial Physis
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Weight bearing at an earlier developmental stage is proposed to load an immature
      physis, though the timing evidence is observational.
    evidence:
    - reference: PMID:32809758
      reference_title: Blount Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'The infantile or early-onset form is commonly bilateral, typically manifests in
        children between the ages of 1 and 5, and tends to exacerbate after the initiation of
        walking.'
      explanation: The exacerbation after walking begins is the temporal observation supporting
        this link.
  evidence:
  - reference: PMID:32809758
    reference_title: Blount Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Although obesity, early walking, and African-American heritage are recognized as
      risk factors for developing Blount disease, the precise pathophysiology of the condition
      remains unclear.'
    explanation: Names early walking among the recognised risk factors.
mechanistic_hypotheses:
- hypothesis_group_id: mechanical_overload_hypothesis
  hypothesis_label: Mechanical Overload of the Medial Physis
  status: CANONICAL
  description: >-
    The account this entry's pathograph follows. Obesity and early walking raise
    compressive load on the medial proximal tibial physis; sustained compression
    suppresses growth there by the Hueter-Volkmann principle; asymmetric growth
    produces varus; and varus shifts the mechanical axis medially, reinforcing the
    load. It is the best-supported hypothesis and remains unproven.
  evidence:
  - reference: PMID:32809758
    reference_title: Blount Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'This condition develops due to excessive compressive forces on the medial aspect
      of the proximal tibial physis, leading to altered enchondral bone formation.'
    explanation: States the hypothesis directly.
  - reference: PMID:17585254
    reference_title: 'Mechanical behavior of the lamb growth plate in response to asymmetrical loading: a
      model for Blount disease.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'we demonstrate that loading (cyclical or static) on 1 edge of the tibial surface
      results in compression through the physis under the site of pressure.'
    explanation: Direct experimental demonstration in the same bone and the same physis that
      edge-loading compresses the growth plate beneath it, which is the physical premise of this
      hypothesis.
  - reference: PMID:33981863
    reference_title: Blount disease and familial inheritance in Ghana, area cross-sectional study.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: 'The prevalence of overweight and obesity in the American population is much higher,
      respectively, 32% and 17%, compared with the prevalence in sub-Saharan Africa, respectively,
      11% and 3%.'
    explanation: A direct challenge to this hypothesis in its obesity-driven form. Obesity is
      several times less prevalent in sub-Saharan Africa than in the United States, yet Blount
      disease is relatively common there, so load from body mass cannot be the whole explanation.
  notes: >-
    Adopted here because it organises the observations and because the same
    principle is used deliberately in guided-growth surgery. Not because it has
    been demonstrated in this disease. The obesity-prevalence counterevidence is
    attached to this hypothesis rather than to the multifactorial one, because it
    is the body-mass premise specifically that it contradicts.
- hypothesis_group_id: multifactorial_hypothesis
  hypothesis_label: Multifactorial Origin with Genetic and Nutritional Contributions
  status: ALTERNATIVE
  description: >-
    The conclusion of the only systematic review of the aetiology literature.
    Mechanical loading is one contributor among several, alongside genetic and
    racial predisposition and possibly nutrition, and no single hypothesis
    accounts for the disease. The review also grades the entire supporting
    literature as low level of evidence, which is the most important thing anyone
    curating this disease should know.
  evidence:
  - reference: PMID:31651748
    reference_title: 'Insight into the possible aetiologies of Blount''s disease: a systematic review of the
      literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Blount''s disease most likely has a multifactorial origin with influence of genetic
      and racial predisposition, increased mechanical pressure on the growth plate as a consequence
      of obesity or early walking age and possibly also nutrition.'
    explanation: States the multifactorial conclusion and enumerates the contributing factors.
  - reference: PMID:31651748
    reference_title: 'Insight into the possible aetiologies of Blount''s disease: a systematic review of the
      literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Most papers focus only on one hypotheses of Blount''s disease occurrence and all
      are characterized as low level of evidence.'
    explanation: Grades the evidence base, which is why the pathograph nodes here carry
      HYPOTHETICAL and PROVISIONAL confidence rather than being asserted.
  - reference: PMID:33981863
    reference_title: Blount disease and familial inheritance in Ghana, area cross-sectional study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'It is suggested that Blount disease is more common in the African and Afro-American
      population because of the earlier walking age and the greater laxity of the knee ligaments
      compared with the Caucasian population.'
    explanation: Offers earlier walking age and ligamentous laxity as the proposed explanation for
      the ethnic distribution, which are mechanical rather than obesity-mediated.
  notes: >-
    Recorded as ALTERNATIVE rather than CANONICAL only because it does not
    specify a causal chain that can be drawn as a graph. On the evidence it is
    probably the more accurate account. The obesity-prevalence contrast recorded
    against the mechanical hypothesis above is the sharpest single argument for
    preferring this one: obesity is roughly a third to a fifth as prevalent in
    sub-Saharan Africa as in the United States, yet Blount disease is common
    there. Large patient groups in Finland and
    Japan are a further argument against a purely ethnic explanation.
genetic:
- name: No identified Mendelian cause
  relationship_type: UNKNOWN
  variant_origin: UNKNOWN
  association: Familial Clustering Without an Identified Gene
  notes: >-
    Recorded as a negative result rather than omitted, because the absence is
    informative. Familial clustering is strong - 62% of families in a Ghanaian
    series had a positive family history, and two thirds of those in a
    first-degree relative - yet whole exome sequencing in that series found no
    genetic predisposition. Ethnic concentration was striking, with 90% of
    patients from a single tribe, which is consistent with either a shared
    environment or a polygenic background that exome sequencing would not
    resolve. No causal gene is recorded in this entry because none is known.
  evidence:
  - reference: PMID:33981863
    reference_title: Blount disease and familial inheritance in Ghana, area cross-sectional study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'A positive family history was found in 63 families (62%), of which, almost two-third
      had a positive family history in a first-degree family member.'
    explanation: Quantifies the familial clustering that motivates a genetic search.
  - reference: PMID:33981863
    reference_title: Blount disease and familial inheritance in Ghana, area cross-sectional study.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: 'The results of the whole exome sequencing did not show a genetic predisposition.'
    explanation: A negative exome result against the hypothesis of a Mendelian cause, which is
      why no causal gene is asserted here despite the familial pattern.
diagnosis:
- name: Radiographic assessment of tibial alignment
  presence: PRESENT
  description: >-
    Diagnosis is radiographic, and the central problem is separating progressive
    disease from the physiological bowing of toddlers, which resolves. Full
    assessment must cover all three planes, since coronal films alone will miss
    the torsional and procurvatum components.
  evidence:
  - reference: PMID:32809758
    reference_title: Blount Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Radiographic findings are diagnostic, and the Langenskiöld classification system'
    explanation: States directly that radiographs make the diagnosis, and names the staging
      system used to grade it.
  - reference: PMID:29315109
    reference_title: Update on treatment of adolescent Blount disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Treatment is always surgical and, given their complexity, should be preceded by
      a thorough analysis and planning regarding all deformities.'
    explanation: Adds that assessment must cover all deformities before treatment, which is why
      single-plane films are insufficient.
- name: Magnetic resonance imaging of the knee
  presence: PRESENT
  description: >-
    MRI shows the physeal and epiphyseal lesion and, importantly, the secondary
    intra-articular changes: enlarged medial menisci with increased T2 signal and
    abnormal medial femoral epiphyseal cartilage. These are relevant to planning
    because they will not be corrected by realigning bone.
  evidence:
  - reference: PMID:23615630
    reference_title: 'MRI evaluation of the knee in children with infantile Blount disease: tibial and extra-tibial
      findings.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The medial menisci were enlarged with increased T2 signal intensity in all MR
      examinations.'
    explanation: Documents the intra-articular finding, present in every examination in the
      series.
treatments:
- name: Proximal Tibial Osteotomy
  therapeutic_modality: SURGERY
  description: >-
    Realignment osteotomy, and the mainstay. Timing is the key variable: in
    early-onset disease, operating before age four reduces the risk of recurrent
    deformity, which makes early recognition directly consequential.
  treatment_term:
    preferred_term: osteotomy
    term:
      id: NCIT:C51903
      label: Osteotomy
  target_mechanisms:
  - target: Progressive Tibia Vara
    treatment_effect: INHIBITS
    description: Surgical realignment removes the varus and, with it, the medial shift of the
      mechanical axis that drives the feedback loop.
    evidence:
    - reference: PMID:19571101
      reference_title: Blount disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'When a patient has early-onset disease, a realignment tibial osteotomy before
        the age of four years decreases the risk of recurrent deformity.'
      explanation: Realignment reducing recurrence is the clinical evidence that correcting the
        deformity interrupts the process producing it.
  evidence:
  - reference: PMID:19571101
    reference_title: Blount disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'When a patient has early-onset disease, a realignment tibial osteotomy before the
      age of four years decreases the risk of recurrent deformity.'
    explanation: Gives the age threshold at which osteotomy reduces recurrence.
- name: Knee-Ankle-Foot Orthosis
  therapeutic_modality: DEVICE
  description: >-
    Bracing with a knee-ankle-foot orthosis, the non-operative option in young
    children with early disease. Its efficacy is genuinely doubtful: in a natural
    history series of untreated limbs, resolution rates did not differ between
    braced and unbraced patients, and the authors advised no initial treatment
    with six-monthly review. It is recorded here because it is in widespread use
    and because the negative evidence is worth carrying alongside it.
  treatment_term:
    preferred_term: orthotic management
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: knee-ankle-foot orthosis
        term:
          id: NCIT:C86054
          label: Brace
  target_mechanisms:
  - target: Progressive Tibia Vara
    treatment_effect: INHIBITS
    description: A brace is intended to unload the medial compartment and so interrupt the
      feedback loop without surgery. Whether it does so is not established.
    evidence:
    - reference: PMID:11922370
      reference_title: Natural history of infantile tibia vara.
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: 'There was no difference in the rate of resolution of the deformity between those
        patients who had been treated by a brace and those who had received no treatment.'
      explanation: Direct evidence against this link. Braced and untreated limbs resolved at the
        same rate, so bracing was not shown to alter the process.
  evidence:
  - reference: PMID:32809758
    reference_title: Blount Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The treatment of Blount disease varies from bracing to surgical interventions and
      depends on the age and severity at presentation. Treatment options include knee-ankle-foot
      orthoses (KAFOs), corrective proximal tibial osteotomies with either acute or gradual
      fixation, and hemiepiphysiodesis.'
    explanation: Establishes bracing with a KAFO as a recognised treatment option in the
      management spectrum.
  - reference: PMID:11922370
    reference_title: Natural history of infantile tibia vara.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: 'We advise no initial treatment but review at six-monthly inter'
    explanation: The authors' recommendation against initial treatment, which follows from their
      finding that bracing did not change the resolution rate.
- name: Gradual Correction with External Fixation
  therapeutic_modality: DEVICE
  description: >-
    Distraction osteogenesis with a circular or hexapod frame, used for severe and
    multiplanar deformity and especially in late-onset disease. It is the most
    recommended corrective option for adolescent disease, and can address rotation
    and length as well as angulation.
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_mechanisms:
  - target: Progressive Tibia Vara
    treatment_effect: INHIBITS
    description: Gradual multiplanar correction addresses angulation, rotation and length
      together, which a single-plane osteotomy cannot.
    evidence:
    - reference: PMID:19571101
      reference_title: Blount disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Gradual correction with distraction osteogenesis is an effective means of achieving
        an accurate multiplanar correction, especially in patients with late-onset disease.'
      explanation: States the multiplanar capability and the population in which it is preferred.
  evidence:
  - reference: PMID:29315109
    reference_title: Update on treatment of adolescent Blount disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Osteotomies with external fixation (hexapodes) are still the most recommended
      corrective treatment in this condition.'
    explanation: Establishes external fixation as the most recommended option in adolescent
      disease.
- name: Guided Growth
  therapeutic_modality: DEVICE
  description: >-
    Hemiepiphysiodesis, which tethers the lateral physis so the medial side can
    catch up. It uses the same growth-modulation principle the disease itself is
    proposed to exploit, run in reverse. Suited to skeletally immature patients
    with moderate deformity, and it requires a physis still capable of growth,
    which is precisely what medial epiphysiodesis destroys.
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_mechanisms:
  - target: Growth Suppression at the Compressed Physis
    treatment_effect: MODULATES
    description: Applies compression to the lateral physis instead, reversing the asymmetry rather
      than cutting the bone.
    evidence:
    - reference: PMID:29315109
      reference_title: Update on treatment of adolescent Blount disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Guided growth is a good choice for more immature patients with moderate
        deformities.'
      explanation: States the indication, which depends on remaining growth potential and
        therefore on this node still being modifiable.
  evidence:
  - reference: PMID:29315109
    reference_title: Update on treatment of adolescent Blount disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Guided growth is a good choice for more immature patients with moderate
      deformities.'
    explanation: Gives the indication for this technique.
  - reference: PMID:29315109
    reference_title: Update on treatment of adolescent Blount disease.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: 'Recently, semiinvasive techniques (guided growth) have been proposed for mild
      deformities but remain controversial.'
    explanation: Recorded against an unqualified reading of the recommendation above. The same
      review that endorses guided growth for immature patients also calls the technique
      controversial, and both statements should travel together.

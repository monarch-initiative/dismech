animal_models:
- name: Lamb proximal tibial growth plate under asymmetric loading
  species: Sheep
  publication: PMID:17585254
  description: >-
    An ex vivo mechanical model, and the only source here that tests the
    biomechanical premise in the right bone. Ovine proximal tibiae were loaded
    asymmetrically on a servohydraulic frame while displacement was recorded
    across the physis. It gives the graph a model join point it otherwise lacks.
  evidence:
  - reference: PMID:17585254
    reference_title: 'Mechanical behavior of the lamb growth plate in response to asymmetrical loading: a
      model for Blount disease.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'In this study, we evaluate the response of 5 ovine proximal tibial growth plates
      to asymmetrical mechanical loading.'
    explanation: Establishes the model and the tissue it tests.
  modeled_mechanisms:
  - target: Excess Compressive Load on the Medial Proximal Tibial Physis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Demonstrates that loading one edge of the tibial surface produces
      compression through the physis beneath it, with measurable tensile
      displacement on the opposite side. That is the physical premise the
      initiating node asserts.
    limitations: >-
      An ex vivo mechanical preparation, not a living animal, so it shows that the
      load reaches the physis and not that sustained loading produces the disease.
      It also cannot speak to the biological growth response, only to the
      mechanics.
    evidence:
    - reference: PMID:17585254
      reference_title: 'Mechanical behavior of the lamb growth plate in response to asymmetrical loading: a
        model for Blount disease.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 'we demonstrate that loading (cyclical or static) on 1 edge of the tibial surface
        results in compression through the physis under the site of pressure. In addition, we
        record statistically significant tensile displacement opposite the compressed side (P <
        0.001)'
      explanation: Measures both the compression under the load and the tension opposite it,
        which is the asymmetry the disease mechanism requires.
progression:
- phase: Radiographic staging
  notes: >-
    Progression is graded by the Langenskiold classification, which describes six
    radiographic stages of change in the proximal medial tibial metaphysis. The
    staging matters clinically rather than descriptively: in a natural history
    series, limbs not in stages II to III resolved spontaneously without
    treatment, while a subset of those in stages II to III did not improve.
  evidence:
  - reference: PMID:32809758
    reference_title: Blount Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Radiographic findings are diagnostic, and the Langenskiöld classification system'
    explanation: Names the staging system used to grade progression.
  - reference: PMID:11922370
    reference_title: Natural history of infantile tibia vara.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In 22 limbs which were not in Langenskiöld stages II to III the condition resolved
      spontaneously without treatment. Of the remaining 24 which were in stages II to III, in
      18 it resolved spontaneously by the age of six years, but six showed little or no
      improvement at the latest follow-up.'
    explanation: Gives outcome by stage, which is what makes the staging prognostic rather than
      merely descriptive.
- phase: Limits of prediction
  notes: >-
    Neither the femorotibial angle nor the metaphyseal-diaphyseal angle
    distinguished which limbs would resolve before age four, so the staging
    grades severity without reliably predicting the individual course.
  evidence:
  - reference: PMID:11922370
    reference_title: Natural history of infantile tibia vara.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'It was impossible to differentiate by measuring the FTA or MDA whether spontaneous
      resolution could be expected before the age of four years.'
    explanation: States the predictive failure directly, which qualifies how the staging should
      be used.
disease_term:
  preferred_term: Blount disease
  term:
    id: MONDO:0017194
    label: Blount disease
notes: >-
  What kind of entry this is. Almost every disease in this knowledge base has a
  molecular initiating lesion. This one does not. There is no known causal gene,
  the aetiology is formally unknown, and the pathograph here models a
  biomechanical hypothesis. That is stated in the node confidences rather than
  only in prose: the initiating load node is HYPOTHETICAL, the growth-suppression
  node PROVISIONAL, and only the histological lesion and its downstream
  consequences are asserted plainly.

  The evidence grading is the point. The only systematic review of the aetiology
  literature concludes that every supporting paper is low level of evidence and
  that the origin is multifactorial. That review is recorded as an ALTERNATIVE
  mechanistic hypothesis, with a note saying that on the evidence it is probably
  the more accurate account and is listed as the alternative only because it does
  not specify a chain that can be drawn as a graph. A reader should not take the
  canonical status of the mechanical hypothesis as a claim that it is
  established.

  Why the graph contains a cycle. Tibia vara feeds back onto the medial load that
  produced it, because varus shifts the limb's mechanical axis medially. This is
  the standard explanation for why the deformity is self-perpetuating rather than
  self-limiting, and it is why treatment is realignment: interrupting the loop
  matters more than any biological intervention. The edge is graded
  INDIRECT_UNKNOWN_INTERMEDIATES because it is inferred from the deformity's
  clinical behaviour rather than measured.

  Guided growth is the disease mechanism run backwards. Hemiepiphysiodesis
  deliberately compresses the lateral physis to let the medial side catch up,
  using the same growth-modulation principle the disease is proposed to exploit.
  That is the strongest practical argument that the mechanism is real, and it is
  also why medial epiphysiodesis is modelled as its own node: once the physis
  closes, the modulation route is gone and treatment becomes reconstructive.

  The pathograph has no root, deliberately. Because tibia vara feeds back onto
  the medial load, every pathophysiology node has an incoming edge and a
  root-finding check returns empty. The entry points into the cycle are the two
  environmental factors, obesity and early walking age, which declare
  influences_mechanisms onto the load node. This is expected for a
  self-reinforcing mechanical process and is not a modelling error. The Obesity
  phenotype is likewise left without an incoming causal edge on purpose: it is a
  risk factor recorded for completeness, not a consequence of the disease, and
  parenting it to any node would invert the causality.

  A disagreement that dissolved on closer reading, recorded because the first
  draft got it wrong. This entry initially stated that sources disagree on the
  age cut-off separating early from late-onset disease, two giving four years and
  one giving ten, and declined to reconcile them. That was a misreading. The
  classification is three-way, not two-way: infantile onset before four years,
  juvenile between four and ten, adolescent after ten. The two cut-offs are the
  two boundaries of the same scheme, and sources quoting one or the other are
  describing different edges of it rather than contradicting each other. The
  juvenile form is recognised by some authors and not others, which is the real
  variation. Recorded here rather than silently corrected, because the error came
  from reading two abstracts and inferring a conflict instead of reading the full
  text that lays the scheme out.

  Corrections, review round 1. Three things were wrong and are recorded rather
  than silently fixed. First, the obesity-prevalence counterevidence was attached
  to the multifactorial hypothesis while its own explanation argued that it
  challenges the mechanical one. The supports value and the explanation
  contradicted each other; the item now sits on the mechanical hypothesis, where
  the body-mass premise it contradicts actually lives. That error was introduced
  during a self-review, which is a reminder that self-review catches mechanical
  defects more reliably than it catches reasoning ones. Second, the radiographic
  diagnosis node asserted that imaging separates progressive disease from
  physiological bowing but was evidenced by a sentence about surgical planning;
  it now leads with a sentence stating that radiographic findings are diagnostic.
  Third, limb length discrepancy was missing from phenotypes despite being
  quotable from two references already cited here.

  Ontology notes. The Hueter-Volkmann edge now leads with PMID:17585254, an ovine
  proximal tibial preparation explicitly framed as a Blount model, which is the
  same bone and the same physis. The finite-element scoliosis study is retained
  on the growth-suppression node, still graded COMPUTATIONAL and still flagged in
  its own explanation as supporting the general principle rather than its
  operation here. Bracing is modelled using the documented device-qualifier
  pattern: the action binds NCIT:C49236 Therapeutic Procedure and the device is
  carried as a qualifier with NCIT:C16830 Medical Device as predicate and
  NCIT:C86054 Brace as value. The earlier note claiming no suitable term existed
  was wrong about the pattern, not about the terms - NCIT:C86054 is genuinely not
  under the TreatmentActionTerm root, which is exactly why it belongs in the
  qualifier slot rather than the action slot.

  The genetic record uses relationship_type UNKNOWN rather than DISPUTED. The
  record asserts that no gene is known, which is different from a specific
  gene-disease relationship being contested.

  A negative genetic result, recorded rather than omitted. Familial clustering is
  strong, yet whole exome sequencing in the series that documented it found no
  predisposition. That absence is more informative than silence would be, so the
  genetic section exists precisely to say no gene is known, with the negative
  result carried as REFUTE evidence against a Mendelian cause.

  How the deep-research report changed this entry. It ran at five iterations and
  contributed three things the initial draft lacked. First, that negative exome
  result. Second, a quantitative natural history - 64% of varus legs resolved over
  time in a large series, with severe bowing persisting in 9% - which qualifies
  the "relentlessly progressive" framing taken from the review literature and
  matters for deciding whom to operate on. Third, direct measurement of vitamin D
  status showing only 16% of patients deplete, which downgrades hypovitaminosis D
  from a listed extension point to a qualified negative. Each was verified against
  the cited paper before use rather than taken from the report.

  Known extension points: prevalence and incidence, for which no quotable figure
  was found; a progression section, which the age-staged natural history and the
  Langenskiold staging system would support well; the metaphyseal-diaphyseal
  (Drennan) angle as a structured diagnostic threshold; and the surgical outcome
  literature, which is substantial and would justify structured outcome records.

    The dominant modifiable risk factor. It is proposed to act mechanically by
    raising compressive load across the medial physis, and it also worsens
    surgical outcomes independently.
  influences_mechanisms:
  - target: Excess Compressive Load on the Medial Proximal Tibial Physis
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Increased body mass is proposed to raise medial compartment loading. The link is
      epidemiological; no source here measures physeal load in affected children.
    evidence:
    - reference: PMID:19571101
      reference_title: Blount disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Although the etiology of Blount disease may be multifactorial, the strong association
        with childhood obesity suggests a mechanical basis.'
      explanation: The association is the evidence, and the source presents it as suggestive
        rather than demonstrative.
  evidence:
  - reference: PMID:23818028

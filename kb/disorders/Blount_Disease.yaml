name: Blount Disease
creation_date: '2026-09-08T10:00:00Z'
description: >-
  An acquired, progressive varus deformity of the tibia in children, arising from
  disordered growth at the medial side of the proximal tibial physis. It is
  unusual among entries here in being biomechanical rather than molecular: no
  causal gene is known, and the leading account is that excess compressive load
  on the medial physis suppresses growth there, by the same growth-modulation
  principle exploited therapeutically in scoliosis. That account is a hypothesis
  rather than an established mechanism. A systematic review of the aetiology
  literature concluded the origin is multifactorial and that every supporting
  paper is low level of evidence. What makes the deformity progressive is a
  feedback loop: varus shifts the limb's mechanical axis further medially, which
  increases the medial load that caused it.
categories:
- Pediatric Orthopedic Disorder
- Growth Plate Disorder
- Acquired Skeletal Deformity
parents:
- osteochondrodysplasia
synonyms:
- tibia vara
- osteochondrosis deformans tibiae
- Blount-Barber syndrome
- Erlacher-Blount syndrome
epidemiology:
- name: Risk factor profile
  description: >-
    Obesity, early walking age and African ancestry are the recognised risk
    factors. The obesity association is strong but not universal, and it is the
    main reason a mechanical mechanism is suspected.
  evidence:
  - reference: PMID:32809758
    reference_title: Blount Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Although obesity, early walking, and African-American heritage are recognized as
      risk factors for developing Blount disease, the precise pathophysiology of the condition
      remains unclear.'
    explanation: Names the three recognised risk factors and states plainly that the
      pathophysiology is unclear.
- name: Geographic variation in severity
  description: >-
    In the Americas and the Caribbean the disease chiefly affects Black obese
    children and often runs a severe course. Elsewhere both the associations and
    the severity are less pronounced, which is itself an argument that the
    condition is not a single uniform entity.
  evidence:
  - reference: PMID:29481866
    reference_title: Blount disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In the Americas and Caribbean, Blount disease chiefly affects black obese children.
      Without treatment, the prognosis is often severe, particularly in the infantile form due
      to the development of medial tibial epiphysiodesis at about 6 to 8 years of age. In other
      parts of the world, the associations with black ethnicity and obesity are less obvious
      and the prognosis is often less severe.'
    explanation: Documents the geographic difference in both risk association and prognosis.
- name: Spontaneous resolution
  description: >-
    A large cross-sectional series found that most varus legs resolved over time,
    with severe bowing persisting in only a minority. This qualifies the
    description of the disease as relentlessly progressive, and it matters for
    treatment decisions: the natural history is not uniformly bad.
  evidence:
  - reference: PMID:33981863
    reference_title: Blount disease and familial inheritance in Ghana, area cross-sectional study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In most of the cases (64%), the varus legs resolved over time. In 9%, severe bowing
      remained ''just like the patient''.'
    explanation: Gives the proportion resolving spontaneously against the proportion left with
      severe deformity.
- name: Vitamin D status
  description: >-
    Hypovitaminosis D has been proposed as a contributing factor, but when
    measured directly only a minority of patients were deplete, and the same study
    states that obesity is the only causative factor proven to be associated with
    the disease.
  evidence:
  - reference: PMID:27276637
    reference_title: Vitamin D Status in Blount Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Eight (16%) patients were found to be vitamin D deplete (25(OH)D levels <50
      nmol/L).'
    explanation: Quantifies vitamin D depletion in a screened cohort, which is lower than the
      proposed aetiological role would suggest.
  - reference: PMID:27276637
    reference_title: Vitamin D Status in Blount Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Obesity is the only causative factor proven to be associated with Blount disease.'
    explanation: States that obesity is the sole proven association, which is the evidential
      basis for privileging the mechanical hypothesis over the others.
has_subtypes:
- name: Early-onset
  display_name: Early-onset (infantile)
  description: >-
    Presents in early childhood, commonly bilateral, and tends to worsen after
    walking begins. The infantile form is the one that progresses to medial
    tibial epiphysiodesis around age six to eight.
  evidence:
  - reference: PMID:32809758
    reference_title: Blount Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The infantile or early-onset form is commonly bilateral, typically manifests in
      children between the ages of 1 and 5, and tends to exacerbate after the initiation of
      walking.'
    explanation: Gives the age range, laterality and the relationship to walking onset.
- name: Late-onset
  display_name: Late-onset (adolescent)
  description: >-
    Presents later, may be unilateral or bilateral, and commonly carries an
    additional distal femoral varus component that the infantile form does not.
  evidence:
  - reference: PMID:19571101
    reference_title: Blount disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'A comprehensive analysis of multiplanar deformities in the lower extremity reveals
      tibial varus, procurvatum, and internal torsion along with limb shortening. Additionally,
      distal femoral varus is commonly noted in the late-onset form.'
    explanation: Describes the multiplanar deformity and identifies distal femoral varus as
      characteristic of this form.
pathophysiology:
- name: Excess Compressive Load on the Medial Proximal Tibial Physis
  biological_scale: ORGANISM
  description: >-
    The proposed initiating step. Body mass and, in the infantile form, early
    ambulation concentrate compressive force on the medial side of the proximal
    tibial growth plate. This is where the evidence is weakest and the inference
    strongest: the association with obesity is epidemiological, and no study in
    these sources measures the load itself in affected children.
  mechanism_confidence: HYPOTHETICAL
  locations:
  - preferred_term: proximal epiphysis of tibia
    term:
      id: UBERON:0008772
      label: proximal epiphysis of tibia
  biological_processes:
  - preferred_term: response to mechanical stimulus
    modifier: INCREASED
    term:
      id: GO:0009612
      label: response to mechanical stimulus
  evidence:
  - reference: PMID:32809758
    reference_title: Blount Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'This condition develops due to excessive compressive forces on the medial aspect
      of the proximal tibial physis, leading to altered enchondral bone formation.'
    explanation: States the mechanical hypothesis in its clearest form, which is the claim this
      node makes.
  - reference: PMID:19571101
    reference_title: Blount disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Although the etiology of Blount disease may be multifactorial, the strong association
      with childhood obesity suggests a mechanical basis.'
    explanation: Shows the reasoning is inferential - the mechanical basis is suggested by an
      epidemiological association rather than demonstrated directly.
  downstream:
  - target: Growth Suppression at the Compressed Physis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Sustained compression across a growth plate slows longitudinal growth there,
      the Hueter-Volkmann growth-modulation principle.
    evidence:
    - reference: PMID:25584943
      reference_title: Biomechanical simulation and analysis of scoliosis correction using a fusionless intravertebral
        epiphyseal device.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: 'A validated algorithm allowed simulating the growth (0.8-1.1 mm/yr/vertebra) and
        growth modulation process (Hueter-Volkmann principle) during a period of 2 years.'
      explanation: Establishes the growth-modulation principle this edge depends on. Note that
        this is a finite-element study of spinal deformity, not of the tibia, so it supports the
        general principle rather than its operation in this disease.
- name: Growth Suppression at the Compressed Physis
  biological_scale: TISSUE
  description: >-
    Longitudinal growth slows on the loaded medial side while the lateral side
    continues, so the physis grows asymmetrically. The mechanism is the same one
    exploited deliberately in guided-growth surgery, which is the strongest
    practical argument that it is real.
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  locations:
  - preferred_term: epiphyseal plate
    term:
      id: UBERON:0002516
      label: epiphyseal plate
  biological_processes:
  - preferred_term: endochondral bone growth
    modifier: DECREASED
    term:
      id: GO:0003416
      label: endochondral bone growth
  evidence:
  - reference: PMID:25584943
    reference_title: Biomechanical simulation and analysis of scoliosis correction using a fusionless intravertebral
      epiphyseal device.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: 'A new fusionless growth sparing instrumentation device (hemistaple), which locally
      compresses the growth plate without spanning the disc, was previously developed and
      successively tested on different animal models.'
    explanation: Compression applied deliberately to a growth plate is an accepted therapeutic
      device, which is indirect but concrete support that compression modulates growth.
  downstream:
  - target: Disordered Endochondral Ossification at the Medial Physis
    causal_link_type: DIRECT
    description: The suppressed medial physis shows histological disorganisation of bone and
      cartilage rather than orderly columnar growth.
    evidence:
    - reference: PMID:31651748
      reference_title: 'Insight into the possible aetiologies of Blount''s disease: a systematic review of the
        literature.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Histological research has shown that a disorganization of bone and cartilage
        structures on the medial side of the proximal tibial physis is present in patients with
        Blount''s disease.'
      explanation: Human histological evidence of the disorganisation this edge terminates in,
        localised to the medial side.
- name: Disordered Endochondral Ossification at the Medial Physis
  biological_scale: TISSUE
  description: >-
    The pathological lesion, and the one finding in this disease with direct human
    histological support. Endochondral ossification becomes disorganised on the
    medial aspect of the proximal tibial physis. On MRI the medial compartment
    bears the brunt, with a posteromedial down-sloping configuration and secondary
    changes in the meniscus and femoral epiphyseal cartilage.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: growth plate cartilage development
    modifier: ABNORMAL
    term:
      id: GO:0003417
      label: growth plate cartilage development
  evidence:
  - reference: PMID:23615630
    reference_title: 'MRI evaluation of the knee in children with infantile Blount disease: tibial and extra-tibial
      findings.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Infantile Blount disease is a developmental condition characterized by disorganized
      endochondral ossification in the medial aspect of the proximal tibial physis.'
    explanation: Defines the lesion in exactly the terms this node uses.
  - reference: PMID:23615630
    reference_title: 'MRI evaluation of the knee in children with infantile Blount disease: tibial and extra-tibial
      findings.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Most severe abnormalities of infantile Blount disease occur in the medial compartment
      of the knee, especially at the medial tibial physis and epiphysis.'
    explanation: Localises the severity to the medial compartment, which is what makes the
      deformity asymmetric.
  downstream:
  - target: Progressive Tibia Vara
    causal_link_type: DIRECT
    description: Asymmetric growth tilts the proximal tibia into varus, which is the deformity
      that defines the disease.
    evidence:
    - reference: PMID:29481866
      reference_title: Blount disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Blount disease is an asymmetrical disorder of proximal tibial growth that produces
        a three-dimensional deformity. Tibia vara is the main component of the deformity.'
      explanation: States that asymmetric proximal tibial growth produces the deformity, with
        tibia vara as its principal component.
- name: Progressive Tibia Vara
  biological_scale: ORGANISM
  description: >-
    Varus angulation of the tibia, accompanied by procurvatum, internal torsion
    and limb shortening, so the deformity is three-dimensional rather than a
    simple bow. This node feeds back onto the load that produced it.
  evidence:
  - reference: PMID:19571101
    reference_title: Blount disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'A comprehensive analysis of multiplanar deformities in the lower extremity reveals
      tibial varus, procurvatum, and internal torsion along with limb shortening.'
    explanation: Enumerates the components of the three-dimensional deformity.
  downstream:
  - target: Genu Varum
    causal_link_type: DIRECT
    description: The varus deformity as observed clinically at the knee.
    evidence:
    - reference: PMID:32809758
      reference_title: Blount Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Blount disease, also known as tibia vara, is an acquired genu varus deformity in
        children caused by disrupted normal cartilage growth at the proximal medial metaphysis
        of the tibia.'
      explanation: Identifies the clinical deformity produced by the physeal lesion.
  - target: Tibial Bowing
    causal_link_type: DIRECT
    description: Varus angulation with procurvatum in the tibia itself.
    evidence:
    - reference: PMID:19571101
      reference_title: Blount disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'A comprehensive analysis of multiplanar deformities in the lower extremity reveals
        tibial varus, procurvatum, and internal torsion along with limb shortening.'
      explanation: Names tibial varus and procurvatum as components of the deformity.
  - target: Internal Tibial Torsion
    causal_link_type: DIRECT
    description: The rotational component, which accompanies the angular deformity rather than
      following from it separately.
    evidence:
    - reference: PMID:19571101
      reference_title: Blount disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'A comprehensive analysis of multiplanar deformities in the lower extremity reveals
        tibial varus, procurvatum, and internal torsion along with limb shortening.'
      explanation: Names internal torsion among the deformity components.
  - target: Lower Limb Asymmetry
    causal_link_type: DIRECT
    description: Suppressed growth on the affected side shortens the limb relative to the other.
    evidence:
    - reference: PMID:32809758
      reference_title: Blount Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'The severity varies from articular cartilage irregularities to limb length
        discrepancies.'
      explanation: Identifies limb length discrepancy as a consequence of the disease process.
  - target: Abnormal Tibial Metaphysis Morphology
    causal_link_type: DIRECT
    description: Metaphyseal change at the proximal medial tibia, seen as posteromedial
      down-sloping.
    evidence:
    - reference: PMID:23615630
      reference_title: 'MRI evaluation of the knee in children with infantile Blount disease: tibial and extra-tibial
        findings.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Angular measurements of the proximal tibia demonstrated posteromedial down-sloping
        configuration.'
      explanation: Gives the measured metaphyseal morphology.
  - target: Excess Compressive Load on the Medial Proximal Tibial Physis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The feedback arm. Varus displaces the limb's mechanical axis medially, which
      increases medial compartment load and so reinforces the process that generated it. This
      is the standard explanation for why the deformity is self-perpetuating rather than
      self-limiting, but it is inferred from the deformity's behaviour rather than measured, so
      it is graded accordingly.
    evidence:
    - reference: PMID:23818028
      reference_title: Blount disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'If the condition remains unresolved, it can lead to progressive varus deformity,
        with or without associated deformities of the distal femur and/or tibia; leg length
        inequality; and significant articular distortion, leading to premature osteoarthritis
        of the knee.'
      explanation: Documents relentless progression when untreated, which is the observation the
        feedback loop is proposed to explain.
  - target: Medial Tibial Epiphysiodesis
    causal_link_type: DIRECT
    description: In the infantile form the medial physis eventually closes prematurely, converting
      a modifiable growth disturbance into a fixed bony bar.
    evidence:
    - reference: PMID:29481866
      reference_title: Blount disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Without treatment, the prognosis is often severe, particularly in the infantile
        form due to the development of medial tibial epiphysiodesis at about 6 to 8 years of
        age.'
      explanation: Gives the timing of physeal closure and identifies it as the reason the
        untreated infantile form does badly.
- name: Medial Tibial Epiphysiodesis
  biological_scale: TISSUE
  description: >-
    Premature closure of the medial proximal tibial physis, around age six to
    eight in the untreated infantile form. This is the point of no return: once a
    bony bar forms, growth modulation can no longer correct the deformity and
    treatment becomes reconstructive rather than corrective.
  evidence:
  - reference: PMID:29481866
    reference_title: Blount disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'once medial tibial epiphysiodesis has developed, both a complementary epiphysiodesis
      and gradual external fixator correction of the other alignment abnormalities, rotational
      deformity, and limb length are required.'
    explanation: Shows that the presence of epiphysiodesis changes the operation required, which
      is what makes this a distinct node rather than a degree of severity.
  downstream:
  - target: Joint Distortion and Premature Osteoarthritis
    causal_link_type: DIRECT
    description: Fixed deformity with articular incongruity loads the knee abnormally for
      decades.
    evidence:
    - reference: PMID:23818028
      reference_title: Blount disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'If the condition remains unresolved, it can lead to progressive varus deformity,
        with or without associated deformities of the distal femur and/or tibia; leg length
        inequality; and significant articular distortion, leading to premature osteoarthritis of
        the knee.'
      explanation: Names the articular endpoint this edge terminates in.
- name: Joint Distortion and Premature Osteoarthritis
  biological_scale: ORGANISM
  description: >-
    The long-term outcome, and the reason the condition is treated aggressively in
    childhood. Articular distortion and limb length inequality culminate in early
    knee osteoarthritis.
  evidence:
  - reference: PMID:23818028
    reference_title: Blount disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'If the condition remains unresolved, it can lead to progressive varus deformity,
      with or without associated deformities of the distal femur and/or tibia; leg length
      inequality; and significant articular distortion, leading to premature osteoarthritis
      of the knee.'
    explanation: States the untreated trajectory to premature knee osteoarthritis.
  downstream:
  - target: Premature Osteoarthritis
    causal_link_type: DIRECT
    description: The articular consequence expressed as the clinical phenotype.
    evidence:
    - reference: PMID:23818028
      reference_title: Blount disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'If the condition remains unresolved, it can lead to progressive varus deformity,
        with or without associated deformities of the distal femur and/or tibia; leg length
        inequality; and significant articular distortion, leading to premature osteoarthritis of
        the knee.'
      explanation: Names premature knee osteoarthritis as the endpoint.

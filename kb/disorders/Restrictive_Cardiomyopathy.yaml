has_subtypes:
- name: RCM1
  display_name: Cardiomyopathy, familial restrictive, 1 (TNNI3)
  description: >-
    The prototype and by far the most common molecularly defined familial RCM:
    heterozygous missense variants in cardiac troponin I, in conserved and
    functionally important domains of the gene. It was the locus at which
    idiopathic RCM was first shown to be a sarcomeric disease, in a family
    segregating both RCM and hypertrophic cardiomyopathy, and TNNI3 remains the
    single gene most often returned by pediatric RCM sequencing. De novo
    variants occur, so an absent family history does not exclude it.
  subtype_term:
    preferred_term: cardiomyopathy, familial restrictive, 1
    term:
      id: MONDO:0007270
      label: cardiomyopathy, familial restrictive, 1
  genes:
  - preferred_term: TNNI3
    term:
      id: hgnc:11947
      label: TNNI3
  evidence:
  - reference: PMID:12531876
    reference_title: Idiopathic restrictive cardiomyopathy is part of the clinical expression of cardiac troponin I mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TNNI3 mutations were identified in six of these nine RCM patients
    explanation: >-
      Establishes TNNI3 as a cause of idiopathic restrictive cardiomyopathy in
      unrelated patients selected on restrictive physiology, which is the
      gene-disease relationship this subtype names.
  - reference: PMID:12531876
    reference_title: Idiopathic restrictive cardiomyopathy is part of the clinical expression of cardiac troponin I mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two of the mutations identified in young individuals were de novo mutations.
    explanation: >-
      Records the de novo occurrence noted in this subtype's description, which
      is why an absent family history does not exclude TNNI3 disease.
- name: RCM3
  display_name: Cardiomyopathy, familial restrictive, 3 (TNNT2)
  description: >-
    Familial restrictive cardiomyopathy caused by variants in cardiac troponin
    T, the other thin-filament regulatory subunit. Curated as a distinct
    numbered entity because MONDO and OMIM separate it from RCM1, but the
    clinical presentation is not separable from TNNI3 disease at the bedside;
    the pediatric series that established sarcomeric causation found TNNT2 and
    TNNI3 variants side by side in the same cohort.
  subtype_term:

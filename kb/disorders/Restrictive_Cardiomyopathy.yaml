- name: Restrictive Filling Physiology
  biological_scale: ORGANISM
  role: effector
  description: >-
    The stiff, fibrotic, poorly relaxing ventricle produces the hemodynamic
    signature of RCM: severely impaired diastolic filling with preserved systolic
    function and non-dilated ventricles, so that atrial pressures rise and the
    atria enlarge markedly to maintain filling. This restrictive filling pattern is
    the defining physiology that separates RCM from the dilated and hypertrophic
    patterns.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Heart Contraction
    term:
      id: GO:0060047
      label: heart contraction
    modifier: ABNORMAL
  evidence:
  - reference: PMID:24221941
    reference_title: "A Drosophila melanogaster model of diastolic dysfunction and cardiomyopathy based on impaired troponin-T function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "prolongs systole and restricts diastolic dimensions of the heart"
    explanation: >-
      Demonstrates restriction of diastolic filling — the defining physiology of
      RCM — in a sarcomeric model.
  downstream:
  - target: Diastolic Heart Failure and Arrhythmic Risk
    causal_link_type: DIRECT
- name: Diastolic Heart Failure and Arrhythmic Risk
  biological_scale: ORGANISM
  role: consequence
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure"
  description: >-
    Restrictive filling with elevated atrial and pulmonary pressures produces heart
    failure with preserved ejection fraction — dyspnea, congestion, and exercise
    intolerance — together with a high burden of atrial arrhythmia and
    thromboembolism from the dilated atria, and a risk of sudden death. RCM carries
    a poor prognosis and is frequently an indication for heart transplantation,
    including in patients whose systolic function is preserved.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Heart Contraction
    term:
      id: GO:0060047
      label: heart contraction
    modifier: ABNORMAL
  evidence:
  - reference: PMID:28371863
    reference_title: "Hypercontractile mutant of ventricular myosin essential light chain leads to disruption of sarcomeric structure and function and results in restrictive cardiomyopathy in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the hearts of RCM mice model exhibited cardiac dysfunction, stiff ventricles"
    explanation: >-
      Ties the stiff-ventricle restrictive remodeling to overt cardiac
      dysfunction, the clinical endpoint of the disease.

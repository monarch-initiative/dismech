  notes: >-
    RCM is the rarest of the three classic cardiomyopathy patterns; no precise
    population rate is established for the primary/genetic form.
pathophysiology:
- name: Sarcomeric or Cytoskeletal Variant with Increased Myofilament Tension
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    The initiating lesion in primary RCM is a variant in a sarcomeric thin-filament
    or myosin gene (or the cytoskeletal protein desmin) that raises myofilament
    tension. Two evidenced archetypes illustrate the mechanism: a cardiac
    troponin-T variant that increases the number of actively cycling myosin
    cross-bridges, and a myosin essential light chain variant (MYL3 E143K) that
    produces myosin hypercontractility (increased duty ratio, actin-binding
    affinity, and actin-activated ATPase). The mutant protein is incorporated into
    the sarcomere and shifts the myocyte toward a hypercontractile, poorly relaxing
    state.
  genes:
  - preferred_term: TNNI3
    term:
      id: hgnc:11947
      label: TNNI3
  - preferred_term: TNNT2
    term:
      id: hgnc:11949

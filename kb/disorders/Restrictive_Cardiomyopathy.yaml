- name: Restrictive Filling Physiology
  biological_scale: ORGANISM
  role: effector
  description: >-
    The stiff, fibrotic, poorly relaxing ventricle produces the hemodynamic
    signature of RCM: severely impaired diastolic filling with preserved systolic
    function and non-dilated ventricles, so that atrial pressures rise and the
    atria enlarge markedly to maintain filling. This restrictive filling pattern is
    the defining physiology that separates RCM from the dilated and hypertrophic
    patterns.
  cell_types:

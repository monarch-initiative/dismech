    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ultrastructural defects and fibrosis that progressively worsened in senescent animals"
    explanation: >-
      Documents progressive myocardial fibrosis and ultrastructural remodeling in

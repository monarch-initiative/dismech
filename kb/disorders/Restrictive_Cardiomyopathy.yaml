name: Restrictive Cardiomyopathy
creation_date: "2026-08-22T00:00:00Z"
synonyms:
- RCM
- restrictive cardiomyopathy
- familial restrictive cardiomyopathy
- primary restrictive cardiomyopathy
description: >-
  Restrictive cardiomyopathy (RCM) is the least common of the three classic
  cardiomyopathy patterns, defined by restrictive ventricular filling — a stiff,
  non-compliant ventricle with impaired diastolic relaxation but preserved (or only
  mildly reduced) systolic function and non-dilated, non-hypertrophied chambers,
  producing marked biatrial enlargement and elevated filling pressures. This entry
  is scoped to the primary/heritable form, in which the restrictive physiology is
  the final common pathway of a sarcomeric or cytoskeletal defect: pathogenic
  variants in thin-filament and myosin genes — most characteristically the
  troponins (TNNI3, TNNT2), alpha-cardiac actin (ACTC1), beta-myosin heavy chain
  (MYH7), and the myosin light chains (MYL3), as well as the intermediate-filament
  protein desmin (DES) — increase myofilament tension and resting myocardial
  stiffness. RCM overlaps genetically and mechanistically with
  hypertrophic cardiomyopathy (the same genes and often the same alleles can produce
  either pattern), and thin-filament HCM shades into restrictive physiology.
  Infiltrative causes of a restrictive phenotype (cardiac amyloidosis, storage
  disease) are curated under their own entries; this entry models the primary
  sarcomeric/cytoskeletal mechanism.
category: Genetic
classifications:
  harrisons_chapter:

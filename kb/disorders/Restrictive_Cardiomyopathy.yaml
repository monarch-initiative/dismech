- name: Diastolic Heart Failure and Arrhythmic Risk
  biological_scale: ORGANISM
  role: consequence
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure"
  description: >-
    Restrictive filling with elevated atrial and pulmonary pressures produces heart
    failure with preserved ejection fraction — dyspnea, congestion, and exercise
    intolerance — together with a high burden of atrial arrhythmia and
    thromboembolism from the dilated atria, and a risk of sudden death. RCM carries
    a poor prognosis and is frequently an indication for heart transplantation,
    including in patients whose systolic function is preserved.
  cell_types:

    reference_title: Idiopathic restrictive cardiomyopathy in children is caused by mutations in cardiac sarcomere protein genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sarcomere protein gene mutations were identified in four patients (33%): 2 in the cardiac troponin I gene (TNNI3) and 1 each in the troponin T (TNNT2) and alpha-cardiac actin (ACTC) genes.

    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "prolongs systole and restricts diastolic dimensions of the heart"
    explanation: >-
      Demonstrates restriction of diastolic filling — the defining physiology of
      RCM — in a sarcomeric model.
  downstream:

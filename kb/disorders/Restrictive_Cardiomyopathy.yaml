    explanation: >-
      A troponin-T RCM model showing that the thin-filament variant increases
      cross-bridge cycling, prolonging systole and restricting diastolic filling.
  downstream:
  - target: Increased Resting Myocardial Stiffness and Impaired Relaxation
    causal_link_type: DIRECT
    description: >-
      Hypercontractility and increased passive tension raise resting myocardial
      stiffness and impair diastolic relaxation.

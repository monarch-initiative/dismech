    reference_title: "Hypercontractile mutant of ventricular myosin essential light chain leads to disruption of sarcomeric structure and function and results in restrictive cardiomyopathy in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the myosin essential light chain has been associated with restrictive cardiomyopathy (RCM) in humans"
    explanation: >-
      Establishes a sarcomeric myosin light chain (MYL3 E143K) variant as a human
      cause of restrictive cardiomyopathy, modeled in transgenic mice.
  - reference: PMID:28371863
    reference_title: "Hypercontractile mutant of ventricular myosin essential light chain leads to disruption of sarcomeric structure and function and results in restrictive cardiomyopathy in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "E143K-myosin had increased duty ratio and binding affinity to actin compared with WT-myosin"
    explanation: >-
      Identifies myosin hypercontractility (increased duty ratio and actin-binding
      affinity) as the molecular consequence of the RCM light-chain variant.
  - reference: PMID:24221941
    reference_title: "A Drosophila melanogaster model of diastolic dysfunction and cardiomyopathy based on impaired troponin-T function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "prolongs systole and restricts diastolic dimensions of the heart"
    explanation: >-
      A troponin-T RCM model showing that the thin-filament variant increases

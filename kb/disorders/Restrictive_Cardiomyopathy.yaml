    evidence_source: MODEL_ORGANISM
    snippet: >-
      prolongs systole and restricts diastolic dimensions of the heart
    explanation: >-
      Model-organism evidence for the troponin-T restrictive mechanism. Kept
      PARTIAL: the measurement is in Drosophila, so it supports the mechanism
      rather than the human gene-disease relationship, which the Kaski cohort
      quote above now supplies.
  notes: >-
    The human evidence carried here is a single TNNT2 proband within a
    twelve-patient pediatric series, so the gene-disease relationship is
    established for the restrictive pattern but not quantified; no
    restrictive-cardiomyopathy case fraction for TNNT2 has been reported.

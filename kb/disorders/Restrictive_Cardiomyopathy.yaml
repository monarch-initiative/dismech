    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the hearts of RCM mice model exhibited cardiac dysfunction, stiff ventricles"
    explanation: >-
      Ties the stiff-ventricle restrictive remodeling to overt cardiac
      dysfunction, the clinical endpoint of the disease.

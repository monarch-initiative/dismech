    modifier: ABNORMAL
  evidence:
  - reference: PMID:24221941
    reference_title: "A Drosophila melanogaster model of diastolic dysfunction and cardiomyopathy based on impaired troponin-T function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Elevated resting myocardial stiffness, consistent with upheld(101) diastolic dysfunction, was confirmed by an atomic force microscopy-based nanoindentation approach"
    explanation: >-
      Direct measurement of elevated resting myocardial stiffness in a
      troponin-T RCM model, the cellular correlate of diastolic dysfunction.
  - reference: PMID:28371863
    reference_title: "Hypercontractile mutant of ventricular myosin essential light chain leads to disruption of sarcomeric structure and function and results in restrictive cardiomyopathy in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "augmented active and passive tension measured in skinned papillary muscle fibres compared with wild-type (WT)-generated force"
    explanation: >-
      Shows augmented passive (resting) tension in an RCM myosin light chain model,

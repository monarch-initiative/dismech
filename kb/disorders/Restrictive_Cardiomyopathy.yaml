inheritance:
- name: Autosomal dominant
  description: >-
    Familial RCM is most often inherited as an autosomal dominant trait caused by
    a sarcomeric or cytoskeletal gene variant, frequently the same genes implicated
    in hypertrophic cardiomyopathy; de novo variants and recessive/desmin-related
    forms also occur. Penetrance and the hypertrophic-versus-restrictive expression
    of a given allele are variable.
  inheritance_term:

- name: Myocardial Fibrosis and Ventricular Remodeling
  biological_scale: TISSUE
  role: central_effector
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  description: >-
    Chronic sarcomeric stress drives interstitial fibrosis and ventricular
    remodeling. In the MYL3 RCM model, hearts developed ultrastructural defects and

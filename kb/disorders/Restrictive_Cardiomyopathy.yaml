    reference_title: "Hypercontractile mutant of ventricular myosin essential light chain leads to disruption of sarcomeric structure and function and results in restrictive cardiomyopathy in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the myosin essential light chain has been associated with restrictive cardiomyopathy (RCM) in humans"
    explanation: >-
      Establishes a sarcomeric myosin light chain (MYL3 E143K) variant as a human
      cause of restrictive cardiomyopathy, modeled in transgenic mice.
  - reference: PMID:28371863
    reference_title: "Hypercontractile mutant of ventricular myosin essential light chain leads to disruption of sarcomeric structure and function and results in restrictive cardiomyopathy in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "E143K-myosin had increased duty ratio and binding affinity to actin compared with WT-myosin"
    explanation: >-
      Identifies myosin hypercontractility (increased duty ratio and actin-binding
      affinity) as the molecular consequence of the RCM light-chain variant.
  - reference: PMID:24221941
    reference_title: "A Drosophila melanogaster model of diastolic dysfunction and cardiomyopathy based on impaired troponin-T function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "prolongs systole and restricts diastolic dimensions of the heart"
    explanation: >-
      A troponin-T RCM model showing that the thin-filament variant increases
      cross-bridge cycling, prolonging systole and restricting diastolic filling.
  downstream:
  - target: Increased Resting Myocardial Stiffness and Impaired Relaxation
    causal_link_type: DIRECT
    description: >-
      Hypercontractility and increased passive tension raise resting myocardial
      stiffness and impair diastolic relaxation.
  - target: Myocardial Fibrosis and Ventricular Remodeling
    causal_link_type: DIRECT
    description: >-
      Chronic sarcomeric stress drives fibrotic remodeling of the myocardium.
- name: Increased Resting Myocardial Stiffness and Impaired Relaxation
  biological_scale: CELLULAR
  role: effector
  description: >-
    The hypercontractile, tension-loaded sarcomere raises the resting (passive)
    tension of the myocyte and impairs relaxation. In an RCM troponin-T model,
    elevated resting myocardial stiffness was measured directly; in the MYL3 RCM
    model, both active and passive tension of papillary muscle were augmented.
    Increased resting stiffness is the cellular basis of the restrictive filling
    that defines the disease.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Regulation of Cardiac Muscle Contraction
    term:
      id: GO:0055117
      label: regulation of cardiac muscle contraction
    modifier: ABNORMAL
  evidence:
  - reference: PMID:24221941
    reference_title: "A Drosophila melanogaster model of diastolic dysfunction and cardiomyopathy based on impaired troponin-T function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Elevated resting myocardial stiffness, consistent with upheld(101) diastolic dysfunction, was confirmed by an atomic force microscopy-based nanoindentation approach"
    explanation: >-
      Direct measurement of elevated resting myocardial stiffness in a
      troponin-T RCM model, the cellular correlate of diastolic dysfunction.
  - reference: PMID:28371863
    reference_title: "Hypercontractile mutant of ventricular myosin essential light chain leads to disruption of sarcomeric structure and function and results in restrictive cardiomyopathy in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "augmented active and passive tension measured in skinned papillary muscle fibres compared with wild-type (WT)-generated force"
    explanation: >-
      Shows augmented passive (resting) tension in an RCM myosin light chain model,
      the mechanical basis of increased myocardial stiffness.
  downstream:
  - target: Restrictive Filling Physiology
    causal_link_type: DIRECT
    description: >-
      A stiff, poorly relaxing ventricle cannot fill normally in diastole.
- name: Myocardial Fibrosis and Ventricular Remodeling
  biological_scale: TISSUE
  role: central_effector
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  description: >-
    Chronic sarcomeric stress drives interstitial fibrosis and ventricular
    remodeling. In the MYL3 RCM model, hearts developed ultrastructural defects and
    fibrosis that progressively worsened with age, with upregulation of
    stress-response and collagen genes. Unlike dilated or hypertrophic remodeling,
    the chambers remain non-dilated and non-hypertrophied, but the fibrotic,
    stiffened wall is the structural substrate of restrictive physiology.

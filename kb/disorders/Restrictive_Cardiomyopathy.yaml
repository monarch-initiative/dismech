      Chronic sarcomeric stress drives fibrotic remodeling of the myocardium.
- name: Increased Resting Myocardial Stiffness and Impaired Relaxation
  biological_scale: CELLULAR
  role: effector
  description: >-
    The hypercontractile, tension-loaded sarcomere raises the resting (passive)
    tension of the myocyte and impairs relaxation. In an RCM troponin-T model,
    elevated resting myocardial stiffness was measured directly; in the MYL3 RCM
    model, both active and passive tension of papillary muscle were augmented. The
    same pair of quantities has since been measured in human cells: engineered
    cardiac tissue built from the cardiomyocytes of an FLNC restrictive
    cardiomyopathy patient shows increased passive tension and impaired relaxation
    velocity against a CRISPR-corrected isogenic control. Increased resting
    stiffness is the cellular basis of the restrictive filling that defines the
    disease.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Regulation of Cardiac Muscle Contraction
    term:
      id: GO:0055117
      label: regulation of cardiac muscle contraction
    modifier: ABNORMAL
  evidence:
  - reference: PMID:24221941
    reference_title: "A Drosophila melanogaster model of diastolic dysfunction and cardiomyopathy based on impaired troponin-T function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Elevated resting myocardial stiffness, consistent with upheld(101) diastolic dysfunction, was confirmed by an atomic force microscopy-based nanoindentation approach"
    explanation: >-
      Direct measurement of elevated resting myocardial stiffness in a
      troponin-T RCM model, the cellular correlate of diastolic dysfunction.
  - reference: PMID:28371863
    reference_title: "Hypercontractile mutant of ventricular myosin essential light chain leads to disruption of sarcomeric structure and function and results in restrictive cardiomyopathy in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "augmented active and passive tension measured in skinned papillary muscle fibres compared with wild-type (WT)-generated force"
    explanation: >-
      Shows augmented passive (resting) tension in an RCM myosin light chain model,
      the mechanical basis of increased myocardial stiffness.
  - reference: PMID:36921598
    reference_title: "Engineered cardiac tissue model of restrictive cardiomyopathy for drug discovery."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      mutant engineered cardiac tissues (ECTs) demonstrate increased passive tension and impaired relaxation velocity compared with isogenic controls
    explanation: >-
      The same two quantities - increased passive tension and impaired relaxation
      - measured in human patient-derived tissue rather than in an animal, against
      a CRISPR-corrected isogenic control. This is the closest thing this entry
      carries to a human measurement of the node, and is why the
      HUMAN_MODEL_MISMATCH discussion is narrowed rather than left as first
      written.
  downstream:
  - target: Restrictive Filling Physiology
    causal_link_type: DIRECT
    description: >-
      A stiff, poorly relaxing ventricle cannot fill normally in diastole.
- name: Cardiac Fibroblast Stiffening and Fibroblast-Cardiomyocyte Crosstalk
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    A second, non-myocyte contribution to the stiff ventricle, and the arm that
    matters most for the majority of patients in whom no sarcomere variant is
    found. Cardiac fibroblasts explanted from children with idiopathic RCM are
    themselves mechanically abnormal - measured by atomic force microscopy they
    are stiffer and more viscous, and less fluid, than control fibroblasts -
    with a transcriptional signature of altered cytoskeletal signalling
    (cytoskeletal actin-associated genes up, several tubulin genes down). Because
    fibroblasts restrain cardiomyocyte relaxation through humoral factors and
    direct cell-cell contact, a stiffened fibroblast population acts on diastolic
    function independently of the myofilament, which is why this node is curated
    as a parallel amplifier of myocardial stiffness rather than as a step
    downstream of the sarcomeric lesion.
  cell_types:
  - preferred_term: Cardiac Fibroblast
    term:
      id: CL:0002548
      label: fibroblast of cardiac tissue
  biological_processes:
  - preferred_term: Actin Cytoskeleton Organization
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:36174041
    reference_title: Atomic force microscopy identifies the alteration of rheological properties of the cardiac fibroblasts in idiopathic restrictive cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RCM-derived CFs showed significantly higher stiffness and viscosity and lower fluidity compared to healthy control CFs.
    explanation: >-
      The direct measurement behind this node, made on fibroblasts from human
      RCM patients rather than on an animal model.
  - reference: PMID:36174041
    reference_title: Atomic force microscopy identifies the alteration of rheological properties of the cardiac fibroblasts in idiopathic restrictive cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Various sarcomere gene variants are known to cause RCM; however, more than a half of patients do not harbor such pathogenic variants.
    explanation: >-
      States the gap this node addresses: the sarcomeric trigger accounts for a
      minority of patients, so a genotype-independent route to myocardial
      stiffness is required.
  - reference: PMID:36174041
    reference_title: Atomic force microscopy identifies the alteration of rheological properties of the cardiac fibroblasts in idiopathic restrictive cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      cardiac fibroblasts (CFs) play important roles in inhibiting the diastolic function of cardiomyocytes via humoral factors and direct cell-cell contact regardless of sarcomere gene mutations
    explanation: >-
      Supplies the crosstalk step that lets a fibroblast-intrinsic mechanical
      change act on cardiomyocyte relaxation.
  downstream:
  - target: Increased Resting Myocardial Stiffness and Impaired Relaxation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - >-
      Fibroblast-derived humoral factors restraining cardiomyocyte relaxation
    - >-
      Direct fibroblast-cardiomyocyte contact
    description: >-
      Mechanically abnormal fibroblasts contribute to the stiffness of the
      myocardium as a tissue and restrain cardiomyocyte relaxation.
  - target: Myocardial Fibrosis and Ventricular Remodeling
    causal_link_type: DIRECT
    description: >-
      An activated, cytoskeletally altered fibroblast population is the cell
      that lays down the interstitial matrix of the remodelled ventricle.
- name: Myocardial Fibrosis and Ventricular Remodeling
  biological_scale: TISSUE
  role: central_effector
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  description: >-
    Chronic sarcomeric stress drives interstitial fibrosis and ventricular
    remodeling. In the MYL3 RCM model, hearts developed ultrastructural defects and
    fibrosis that progressively worsened with age, with upregulation of
    stress-response and collagen genes. Unlike dilated or hypertrophic remodeling,
    the chambers remain non-dilated and non-hypertrophied, but the fibrotic,
    stiffened wall is the structural substrate of restrictive physiology.

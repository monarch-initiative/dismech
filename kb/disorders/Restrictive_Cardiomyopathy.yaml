    Rare. Alpha-cardiac actin, the thin filament's structural core; a single
    proband in the founding pediatric series, reported there as the first ACTC1
    variant in familial restrictive cardiomyopathy.
  evidence:
  - reference: PMID:18467357
    reference_title: Idiopathic restrictive cardiomyopathy in children is caused by mutations in cardiac sarcomere protein genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe the first mutation in ACTC in familial RCM.
    explanation: >-
      Establishes ACTC1 as a cause of the familial restrictive pattern, which
      is why the thin-filament arm of this entry's trigger node is not limited
      to the troponins.
- name: DES
  gene_term:
    preferred_term: DES
    term:
      id: hgnc:2770
      label: DES
  relationship_type: CAUSATIVE
  frequency: >-
    Rare. The cytoskeletal rather than sarcomeric route to the restrictive
    pattern, and the reason this entry's trigger node is titled sarcomeric *or
    cytoskeletal*. Desmin variants more often produce dilated, arrhythmogenic
    or hypertrophic disease; restrictive presentations are the uncommon end of
    that spectrum and are characteristically accompanied by conduction disease
    and, in much of the spectrum, a skeletal myopathy.
  evidence:
  - reference: PMID:31718026
    reference_title: "Restrictive Cardiomyopathy is Caused by a Novel Homozygous Desmin (DES) Mutation p.Y122H Leading to a Severe Filament Assembly Defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the index patient received a diagnosis of restrictive cardiomyopathy (RCM) in combination with atrioventricular (AV) block
    explanation: >-
      The human presentation curated here: restrictive cardiomyopathy with
      atrioventricular block, the conduction-disease accompaniment that
      distinguishes the desmin route from the thin-filament routes.
  - reference: PMID:31718026
    reference_title: "Restrictive Cardiomyopathy is Caused by a Novel Homozygous Desmin (DES) Mutation p.Y122H Leading to a Severe Filament Assembly Defect."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Confocal microscopy revealed a severe filament assembly defect of mutant desmin
    explanation: >-
      The molecular consequence of the variant - failure of intermediate
      filament assembly - which is a different lesion in kind from the
      increased-myofilament-tension mechanism of the sarcomeric genes. Tagged
      IN_VITRO because the measurement is in transfected iPSC-derived
      cardiomyocytes and HT-1080 cells.
  notes: >-
    The cited family is consanguineous and the variant is homozygous, which the
    authors read as pointing to recessive inheritance for this allele. That does
    not generalise: most pathogenic DES alleles are heterozygous missense or
    small in-frame deletions acting through a poison-protein mechanism, so this
    record should not be taken as evidence that desmin RCM is recessive in
    general.
- name: FLNC
  gene_term:
    preferred_term: FLNC
    term:
      id: hgnc:3756
      label: FLNC
  relationship_type: CAUSATIVE
  frequency: >-
    Rare. Filamin C, the Z-disc actin cross-linker; the second cytoskeletal route
    to the restrictive pattern alongside desmin, and the gene behind the numbered
    entity RCM5.
  evidence:
  - reference: PMID:26666891
    reference_title: Mutations in FLNC are Associated with Familial Restrictive Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Familial forms are mainly caused by mutations in sarcomere proteins and
      demonstrate a common genetic etiology with other inherited cardiomyopathies.
    explanation: >-
      The report that added FLNC to the familial restrictive gene set, and its
      framing of the shared genetic architecture between the restrictive pattern
      and the other inherited cardiomyopathies.
  - reference: PMID:36921598
    reference_title: "Engineered cardiac tissue model of restrictive cardiomyopathy for drug discovery."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Human variants in filamin C (FLNC) are linked to a variety of cardiomyopathies, and in this study, we investigate an in-frame deletion (c.7416_7418delGAA, p.Glu2472_Asn2473delinAsp) in a patient with RCM.
    explanation: >-
      Identifies a specific FLNC in-frame deletion in a patient ascertained with
      restrictive cardiomyopathy, the allele modeled in this entry's engineered
      cardiac tissue system.
  notes: >-
    MONDO carries "restrictive cardiomyopathy 5" as a synonym of the FLNC
    hypertrophic entity CMH26, and the FLNC hypertrophic/restrictive spectrum is
    curated in full in `Hypertrophic_Cardiomyopathy_26`. FLNC is listed here as a
    gene reaching the restrictive pattern, not as a duplicate of that entry; the
    hypertrophic-versus-restrictive label for a given FLNC family is partly
    nosological rather than biological.
- name: MYPN
  gene_term:
    preferred_term: MYPN
    term:
      id: hgnc:23246
      label: MYPN
  relationship_type: CAUSATIVE
  frequency: >-
    Rare. Myopalladin, a Z-disc protein - the sarcomere's anchoring apparatus
    rather than its contractile stroke. MONDO codes the MYPN entity as
    dilated cardiomyopathy 1KK (MONDO:0014100) while carrying
    "cardiomyopathy, familial restrictive, 4" as one of its synonyms, so the
    restrictive presentation is allelic within a gene that more commonly
    produces dilated or hypertrophic disease.
  evidence:
  - reference: PMID:22286171

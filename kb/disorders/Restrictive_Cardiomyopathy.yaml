progression:
- phase: Progressive diastolic heart failure to transplantation or death
  notes: >-
    RCM does not plateau. In the largest reported pediatric cohort the median
    time from diagnosis to a major adverse cardiovascular event - cardiac death,
    transplantation, or equivalent - was about two years, and roughly five in
    eight children reached such an event during follow-up. Reported
    transplant-free survival at five years is about 30%. Significant heart
    failure is the presenting feature rather than a late complication, which is
    why listing decisions are made early and why risk models for this disease
    are built around timing of transplantation rather than around drug therapy.
  evidence:
  - reference: PMID:41219744
    reference_title: "Clinical-genetic profiles and risk prediction model in childhood restrictive cardiomyopathy: a national cohort study of China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During the follow-up period, 114 patients (62%) experienced MACE, with the median MACE-free survival time for the entire cohort being 2.1 years post-diagnosis
    explanation: >-
      Quantifies the event rate and the time course this progression record
      asserts, in a 185-child multicentre cohort.
  - reference: PMID:41219744
    reference_title: "Clinical-genetic profiles and risk prediction model in childhood restrictive cardiomyopathy: a national cohort study of China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      often resulting in heart failure, arrhythmias, and sudden cardiac death, with a 5-year transplant-free survival rate of about 30%
    explanation: >-
      Source for the five-year transplant-free survival figure and for the
      three endpoints named in this record.
differential_diagnoses:
- name: Cardiac amyloidosis (ATTR and AL)
  description: >-
    The most important acquired mimic, and the reason this entry's boundary has
    to be stated rather than assumed. Amyloid infiltration produces the same
    restrictive filling, biatrial enlargement and preserved ejection fraction,
    but by extracellular deposition of a misfolded precursor rather than by a
    heritable defect of the contractile apparatus - so it is curated on its own
    entries and conforms to `amyloidogenesis`, not here. Hereditary ATTR is
    itself inherited, which means "familial" does not separate the two; the
    separating question is whether the myocardium is infiltrated. No
    `disease_term` is bound here because MONDO has no single class covering both
    the transthyretin and the light-chain routes to cardiac amyloidosis; the two
    are curated as `ATTR_Amyloidosis` and `AL_Amyloidosis`.
  distinguishing_features:
  - Increased wall thickness on echocardiography, whereas primary RCM has normal or near-normal wall thickness.
  - Bone-avid tracer uptake on scintigraphy (ATTR) or a monoclonal protein on serum/urine immunofixation and free light chains (AL).
  - Extracardiac features - polyneuropathy, carpal tunnel syndrome, macroglossia, nephrotic-range proteinuria - that a sarcomeric cardiomyopathy does not produce.
  - Congo red-positive, apple-green birefringent deposits on endomyocardial biopsy.
  evidence:
  - reference: PMID:12531876
    reference_title: Idiopathic restrictive cardiomyopathy is part of the clinical expression of cardiac troponin I mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease may be associated with systemic disease but is most often idiopathic.
    explanation: >-
      States the split this differential turns on - restrictive physiology
      secondary to a systemic (here, infiltrative) disease versus the idiopathic
      or primary form this entry curates.
- name: Storage and infiltrative cardiomyopathies other than amyloid
  description: >-
    Lysosomal storage disease (Fabry, Gaucher, glycogen storage disease II),
    haemochromatosis and sarcoidosis all reach restrictive physiology by loading
    or replacing the myocardium. MONDO asserts several of these under
    MONDO:0016340 because they are both inherited and restrictive; this entry
    keeps them out because the mechanism is deposition, not myofilament tension,
    and each has its own mechanism module.
  distinguishing_features:
  - Extracardiac storage phenotype (organomegaly, renal, ophthalmological, or neurological involvement).
  - Enzyme assay or genotype for the specific storage disorder.
  - A disease-modifying therapy directed at the stored substrate exists, which is not true of primary sarcomeric RCM.
- name: Endomyocardial fibrosis
  description: >-
    Obliterative fibrosis of the ventricular apex and subvalvular apparatus,
    endemic in parts of the tropics and elsewhere associated with
    hypereosinophilia. Restrictive physiology arises from an obliterated
    ventricular cavity rather than from a stiff myocardium, and it is curated
    separately.
  distinguishing_features:
  - Apical cavity obliteration and thrombus on imaging.
  - Eosinophilia, or residence in an endemic region.
  - Atrioventricular valve regurgitation from involvement of the subvalvular apparatus.
  disease_term:
    preferred_term: endomyocardial fibrosis
    term:
      id: MONDO:0006746
      label: endomyocardial fibrosis
- name: Constrictive pericarditis
  description: >-
    Not a cardiomyopathy at all, but the classic haemodynamic imitator: a
    thickened, non-compliant pericardium limits filling with a normal
    myocardium underneath. It matters because it is surgically curable, so the
    distinction changes management more than any other on this list.
  distinguishing_features:
  - Ventricular interdependence with respirophasic septal shift on echocardiography and at catheterisation.
  - Pericardial thickening or calcification on CT or CMR.
  - Normal or increased mitral annular e-prime (annulus reversus), whereas RCM reduces it.
  disease_term:
    preferred_term: constrictive pericarditis
    term:
      id: MONDO:0006711
      label: constrictive pericarditis
treatments:
- name: Heart Failure Pharmacotherapy and Supportive Care
  description: >-
    Management targets congestion and filling pressures; because output is
    filling-limited, therapy is largely supportive (diuretics for congestion, rate
    and rhythm control, anticoagulation for atrial arrhythmia).
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: diuretic
      term:
        id: NCIT:C448
        label: Diuretic
- name: Heart Transplantation
  description: >-
    RCM has a poor prognosis and is frequently an indication for heart
    transplantation, including in patients with preserved systolic function.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: organ transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
- name: Implantable Cardioverter-Defibrillator
  description: >-
    Considered for prevention of sudden cardiac death in selected high-risk
    patients.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
- name: PDE3 Inhibition (Trequinsin) - preclinical lead only
  description: >-
    NOT a treatment for this disease. Recorded because it is the only
    mechanism-directed therapeutic lead this entry has, and because the absence
    of any disease-modifying therapy is itself a curated fact: management is
    otherwise entirely congestion control and transplantation. Trequinsin
    emerged from a high-throughput screen of small molecules run on the FLNC
    patient-derived engineered cardiac tissue system described under
    `experimental_models`, where it improved cardiomyocyte relaxation. The
    evidence is a single in vitro screen in one genotype; there is no animal
    efficacy study, no trial, and no human exposure in restrictive
    cardiomyopathy. Do not read this record as a clinical recommendation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: trequinsin
      term:
        id: CHEBI:748124
        label: trequinsin
  target_mechanisms:
  - target: Increased Resting Myocardial Stiffness and Impaired Relaxation
    treatment_effect: INHIBITS
    description: >-
      The screen was scored on cardiomyocyte relaxation, so the node this lead
      addresses is the impaired-relaxation half of the stiffness node rather
      than the upstream sarcomeric lesion or the downstream fibrosis.
    evidence:
    - reference: PMID:36921598
      reference_title: "Engineered cardiac tissue model of restrictive cardiomyopathy for drug discovery."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        High-throughput small-molecule screening identifies phosphodiesterase 3 (PDE3) inhibition by trequinsin as a potential therapy to improve cardiomyocyte relaxation in this genotype.
      explanation: >-
        Curated PARTIAL, and deliberately: the authors themselves say "potential
        therapy" and "in this genotype". The quote supports a screening hit
        against the relaxation node, not efficacy in patients.
experimental_models:
- name: FLNC RCM patient iPSC-derived cardiomyocytes and 3D engineered cardiac tissue
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Induced pluripotent stem cells reprogrammed from a patient carrying the FLNC
    in-frame deletion c.7416_7418delGAA, differentiated to cardiomyocytes and
    assembled into three-dimensional engineered cardiac tissues, each compared
    against a CRISPR-Cas9-corrected isogenic line. The isogenic correction is
    what makes this model informative: it removes genetic background as an
    explanation for the mechanical difference. The 3D format exists because the
    defining property of RCM - passive tension and relaxation of a contracting
    tissue - cannot be measured in cells attached to a plastic substrate, which
    the authors give as the reason no iPSC model of RCM existed before.
  cell_source: Patient-derived iPSC, with a CRISPR-Cas9-corrected isogenic control line
  culture_system: Two-dimensional iPSC-cardiomyocyte monolayer and three-dimensional engineered cardiac tissue
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  publication: PMID:36921598
  evidence:
  - reference: PMID:36921598
    reference_title: "Engineered cardiac tissue model of restrictive cardiomyopathy for drug discovery."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Together, these data demonstrate an engineered cardiac tissue model of RCM and establish the translational potential of this precision medicine approach to identify therapeutics targeting myocardial relaxation.
    explanation: >-
      The authors' own statement of what the system is for, which is the claim
      this model entry makes: a human-cell platform for the relaxation defect.
  modeled_mechanisms:
  - target: Increased Resting Myocardial Stiffness and Impaired Relaxation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Mutant engineered tissues reproduce both halves of the node - raised
      passive tension and slowed relaxation - in human cells, against an
      isogenic control.
    limitations: >-
      Engineered cardiac tissue is immature relative to adult ventricular
      myocardium, lacks the fibroblast, vascular and neurohormonal context in
      which the human ventricle stiffens, and here represents a single patient
      and a single FLNC allele. It is a human-cell surrogate for the mechanism,
      not a measurement made in human myocardium.
    readouts:
    - name: Passive tension of engineered cardiac tissue
      target: Increased Resting Myocardial Stiffness and Impaired Relaxation
      direction: INCREASED
      interpretation: >-
        The mechanical correlate of increased resting myocardial stiffness,
        measured in mutant versus isogenic-control tissue.
      evidence:
      - reference: PMID:36921598
        reference_title: "Engineered cardiac tissue model of restrictive cardiomyopathy for drug discovery."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          mutant engineered cardiac tissues (ECTs) demonstrate increased passive tension and impaired relaxation velocity compared with isogenic controls
        explanation: >-
          Reports the passive-tension measurement behind this readout.
    - name: Cardiomyocyte relaxation and calcium kinetics in 2D culture
      target: Increased Resting Myocardial Stiffness and Impaired Relaxation
      direction: DECREASED
      interpretation: >-
        Impaired relaxation and reduced calcium kinetics in the monolayer
        format, showing the defect is present at the cardiomyocyte level and not
        only a property of the assembled tissue.
      evidence:
      - reference: PMID:36921598
        reference_title: "Engineered cardiac tissue model of restrictive cardiomyopathy for drug discovery."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Induced pluripotent stem cell-derived cardiomyocytes (iPSC-CMs) with this variant display impaired relaxation and reduced calcium kinetics in 2D culture when compared with a CRISPR-Cas9-corrected isogenic control line.
        explanation: >-
          Reports the monolayer relaxation and calcium measurements behind this
          readout.
discussions:
- discussion_id: rcm_mechanism_is_model_organism_weighted
  prompt: >-
    Does the Drosophila upheld/troponin-T and mouse MYL3 E143K mechanism — increased
    myofilament tension producing elevated resting stiffness and restrictive filling —
    hold in human restrictive cardiomyopathy myocardium, where it has not been
    functionally confirmed?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Sarcomeric or Cytoskeletal Variant with Increased Myofilament Tension
  - pathophysiology#Increased Resting Myocardial Stiffness and Impaired Relaxation
  - pathophysiology#Restrictive Filling Physiology
  rationale: >-
    The animal-derived core of this chain is unchanged: the tension, fibrosis,
    filling, and heart-failure nodes still rest on a Drosophila troponin-T model
    and a transgenic mouse carrying the myosin essential light chain E143K
    substitution. Two human-cell measurements have since been added and narrow the
    question without closing it. Patient-derived engineered cardiac tissue carrying
    an FLNC in-frame deletion shows increased passive tension and impaired
    relaxation against a CRISPR-corrected isogenic control (PMID:36921598), and
    cardiac fibroblasts explanted from children with idiopathic RCM are themselves
    stiffer and more viscous than control fibroblasts (PMID:36174041). Both are
    human cells, and the isogenic comparison in the first removes genetic
    background as an explanation - so the mechanism is no longer purely a
    cross-species inference. But neither is a measurement in human myocardium:
    engineered tissue is immature and lacks the vascular and neurohormonal context
    of the ventricle, the fibroblast work is a single non-myocyte cell type in
    culture, and the FLNC result is one patient and one allele. The question the
    proposed experiment below asks - do genotyped human RCM myocardial fibres show
    raised passive tension and stiffness - is therefore still open, and it is still
    a question of translational validity rather than absent evidence,
    which is why it is a HUMAN_MODEL_MISMATCH and not a KNOWLEDGE_GAP. The fidelity
    concern is specific rather than generic: Drosophila indirect flight muscle differs
    from mammalian myocardium in sarcomere regulation and has no comparable
    neurohormonal or fibrotic context, and the mouse line reports a supraphysiological
    single-allele substitution whose duty-ratio effect need not scale to the human
    ventricle. If the mechanism does not transfer, the direction of therapy implied by
    this pathograph — lowering myofilament tension rather than treating congestion —
    would be wrong for patients.
  evidence:
  - reference: PMID:28371863
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      E143K-myosin had increased duty ratio and binding affinity to actin compared with
      WT-myosin
    explanation: >-
      The core tension mechanism curated here is a mouse transgenic measurement, which
      is the model-side half of the mismatch.
  - reference: PMID:24221941
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Elevated resting myocardial stiffness, consistent with upheld(101) diastolic
      dysfunction, was confirmed by an atomic force microscopy-based nanoindentation
      approach
    explanation: >-
      The stiffness node's only quantitative support is a Drosophila nanoindentation
      measurement, not a human one.
  proposed_experiments:
  - experiment_id: exp_rcm_human_myocardium_tension_and_stiffness
    name: Human RCM myocardial mechanics in genotyped explants
    description: >-
      In skinned myocardial fibres from explanted or biopsy tissue of genotyped
      sarcomeric RCM patients, measure active and passive tension, calcium sensitivity,
      and passive stiffness against non-failing donor myocardium matched for age and
      region. A human increase in resting tension and passive stiffness tracking
      genotype would carry the model result into human disease; equivalence with donor
      myocardium would show the restrictive physiology is driven by something other
      than the myofilament step this pathograph asserts.
    would_support:
    - pathophysiology#Increased Resting Myocardial Stiffness and Impaired Relaxation
    supporting_outcome:
    - >-
      Genotype-positive human RCM myocardium shows significantly higher passive
      stiffness and resting tension than matched non-failing donor myocardium.
    would_refute:
    - pathophysiology#Sarcomeric or Cytoskeletal Variant with Increased Myofilament Tension
    refuting_outcome:
    - >-
      Human RCM myocardium shows passive stiffness and resting tension
      indistinguishable from matched donor myocardium.
- discussion_id: rcm_tnni3_myh7_restrictive_evidence_absent
  prompt: >-
    Is there direct human evidence that MYH7 variants cause the restrictive pattern
    specifically, as opposed to the hypertrophic pattern with restrictive physiology
    already curated in the sibling HCM entries?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#MYH7
  rationale: >-
    MYH7 is named in this entry's trigger node and carried in its genetic section,
    but the record still carries no evidence item, because nothing quoted in this
    file speaks to MYH7 in restrictive cardiomyopathy specifically. The MYH7
    relationships evidenced elsewhere in this repository are hypertrophic
    (Hypertrophic Cardiomyopathy 1) and dilated (Dilated Cardiomyopathy 1S), and
    neither can be carried across to this pattern. This is a KNOWLEDGE_GAP rather
    than a HUMAN_MODEL_MISMATCH because the evidence is absent rather than
    model-bound - a distinct problem from the model-organism weighting of the
    pathophysiology chain, and one closed by a human cohort rather than by a better
    model. Until it is closed, this gene record should not be treated as
    independently established for the restrictive pattern.
  notes: >-
    The TNNI3 and TNNT2 halves of this gap are now closed and the discussion has
    been narrowed accordingly rather than retitled: TNNI3 carries the Mogensen
    linkage and mutation-screening result (PMID:12531876) plus a pediatric case
    fraction (PMID:41219744), and TNNT2 carries a proband from the Kaski series
    (PMID:18467357). The discussion_id is deliberately left unchanged so that
    references to it from outside this file still resolve.
notes: >-
  Scope. This entry fills the gap of a dedicated restrictive cardiomyopathy entity
  (the third classic cardiomyopathy pattern, previously represented in the KB only
  as restrictive physiology noted inside HCM7/TNNI3). It is curated as the
  primary/heritable sarcomeric-cytoskeletal RCM, whose restrictive filling is the
  final common pathway of increased myofilament tension and myocardial stiffness,
  and it conforms to the shared cardiomyopathy_maladaptive_remodeling module.
  RCM overlaps genetically with hypertrophic cardiomyopathy — the same sarcomere
  genes (TNNI3, TNNT2, MYH7, ACTC1, MYL3) and often the same alleles can produce
  either pattern — which is why several thin-filament HCM entries (notably
  HCM7/TNNI3) carry restrictive features. Infiltrative causes of a restrictive
  phenotype (cardiac amyloidosis, storage diseases such as Fabry) are curated under
  their own entries and are deliberately out of scope here, and are named in
  `differential_diagnoses` so the boundary is stated rather than assumed.

  Familial restrictive cardiomyopathy (MONDO:0016340). The heritable subset is
  curated here rather than as a separate entry or a Grouping, and is recorded as a
  `skos:narrowMatch` in `mappings.mondo_mappings` with its reasoning; the two
  molecularly defined members that this entry evidences, RCM1 (TNNI3) and RCM3
  (TNNT2), are carried as `has_subtypes`. The remaining gene arms are curated in
  `genetic:` rather than as further subtypes, each for a stated reason: FLNC's
  numbered entity RCM5 is a MONDO synonym of CMH26 and is already curated in full
  as `Hypertrophic_Cardiomyopathy_26`; MYPN's RCM4 is a synonym of MONDO:0014100,
  which is an open nomination as a *dilated* cardiomyopathy in
  `stubs/Dilated_Cardiomyopathy_1KK.yaml`; ACTC1 and DES have no numbered MONDO
  entity to bind a `subtype_term` to; and RCM2 and RCM6 are left uncurated because
  nothing cached in this repository names their causal genes, which is a better
  outcome than guessing one. MONDO:0016340 is a `disease_grouping`
  term whose asserted descendants mix the numbered RCM series with deposition and
  infiltration diseases (Gaucher disease type I, glycogen storage disease II,
  ATTRV122I amyloidosis) and with atrial standstill; this entry follows the
  mechanistic boundary rather than that descendant set.

  Evidence weighting. The pathophysiology chain remains weighted towards model
  organisms (Drosophila troponin-T and mouse MYL3 E143K), but two human-cell
  measurements now sit alongside them — patient-derived engineered cardiac tissue
  against a CRISPR-corrected isogenic control (PMID:36921598) and atomic-force
  rheology of patient cardiac fibroblasts (PMID:36174041) — so the
  HUMAN_MODEL_MISMATCH discussion `rcm_mechanism_is_model_organism_weighted` is
  narrowed rather than closed: neither is a measurement in human myocardium. The
  companion KNOWLEDGE_GAP `rcm_tnni3_myh7_restrictive_evidence_absent` is likewise
  narrowed; its TNNI3 and TNNT2 halves are closed by human cohort evidence and
  only the MYH7 half remains open.

  GeneReviews scope. No GeneReviews chapter covering this entity is cached in
  this repository, so none is tagged in `references`; the two cardiomyopathy
  overviews used elsewhere in this series (PMID:20301725, PMID:20301486) address
  the hypertrophic and dilated phenotypes rather than this one. The
  clinical-characteristics baseline for this entry is therefore built entirely
  from the primary literature cited throughout, principally PMID:28371863,
  PMID:24221941.

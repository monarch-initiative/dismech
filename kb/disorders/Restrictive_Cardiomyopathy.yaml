mappings:
  mondo_mappings:
  - term:
      id: MONDO:0016340
      label: familial restrictive cardiomyopathy
    mapping_predicate: skos:narrowMatch
    mapping_source: dismech curation
    mapping_justification: >-
      MONDO:0016340 is_a the MONDO:0005201 anchor of this entry and denotes the
      inherited subset of restrictive cardiomyopathy. It is narrower than the
      anchor - which by its own MONDO definition also covers scarring,
      infiltrative and deposition causes - but it is precisely the scope this
      entry curates: the primary/heritable sarcomeric and cytoskeletal disease.
      The anchor is retained as `disease_term` because MONDO:0005201 carries
      "familial restrictive cardiomyopathy" as a synonym, so the two labels are
      not cleanly separable at the term level, and because the acquired causes
      have to be nameable here to be excluded. No Grouping was created for
      MONDO:0016340 - unlike the sibling MONDO classes behind
      `Familial_Hypertrophic_Cardiomyopathy` and `Familial_Dilated_Cardiomyopathy`,
      none of its numbered members (RCM1-RCM6) is a curated DisMech Disease
      entry, so a union over them would have no members to unite.
    consistency:
    - reference: MONDO
      consistent: CONSISTENT
      notes: >-
        MONDO's asserted descendant set for MONDO:0016340 mixes the numbered
        RCM series with systemic diseases that reach a restrictive phenotype by
        deposition or infiltration (Gaucher disease type I, glycogen storage
        disease II, ATTRV122I amyloidosis) and with atrial standstill. This
        entry follows the mechanistic boundary rather than that descendant set:
        the infiltrative and storage routes are curated on their own entries
        (`ATTR_Amyloidosis`, `AL_Amyloidosis`, `Endomyocardial_Fibrosis`) and
        recorded here as differential diagnoses, not as members of this concept.

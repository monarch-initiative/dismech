    description: >-
      Chronic sarcomeric stress drives fibrotic remodeling of the myocardium.
- name: Increased Resting Myocardial Stiffness and Impaired Relaxation
  biological_scale: CELLULAR
  role: effector
  description: >-
    The hypercontractile, tension-loaded sarcomere raises the resting (passive)
    tension of the myocyte and impairs relaxation. In an RCM troponin-T model,
    elevated resting myocardial stiffness was measured directly; in the MYL3 RCM
    model, both active and passive tension of papillary muscle were augmented.
    Increased resting stiffness is the cellular basis of the restrictive filling
    that defines the disease.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Regulation of Cardiac Muscle Contraction

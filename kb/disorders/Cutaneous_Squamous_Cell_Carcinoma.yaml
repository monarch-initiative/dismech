- accession: ega:EGAS00001001892
  title: Inactivation of TGFβ receptors in stem cells drives cutaneous squamous cell carcinoma - 30 whole exomes
  description: Melanoma patients treated with oncogenic BRAF inhibitors can develop cutaneous squamous cell carcinoma (cSCC) within weeks of treatment, driven by paradoxical RAS/RAF/MAPK pathway activation. Here, we identify frequent TGFBR1 and TGFBR2 mutations in human vemurafenib-induced skin lesions and in sporadic cSCC. Functional analysis reveals these mutations ablate canonical TGFβ Smad signaling which is localised to bulge stem cells in both normal human and murine skin. MAPK pathway hyperactivation (through BrafV600E or KrasG12D knockin) and TGFβ signaling ablation (through Tgfbr1 deletion) in LGR5+ve stem cells enables rapid cSCC development in the mouse.

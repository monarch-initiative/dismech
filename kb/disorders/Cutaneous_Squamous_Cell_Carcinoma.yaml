- accession: ega:EGAS00001002612
  title: The genomic landscape of cutaneous squamous cell carcinoma from immunosuppressed and immunocompetent patients reveals common drivers and a novel mutational signature associated with chronic azathioprine exposure
  description: Cutaneous squamous cell carcinoma (cSCC) has a high tumour mutational burden (50 mutations per megabase DNA pair). Combining whole exome analyses from 40 primary cSCC tumours, comprising 20 well differentiated and 20 moderately/poorly differentiated tumours, with accompanying clinical data from a longitudinal study of immunosuppressed and immunocompetent patients, coupled with integration of independent gene expression studies has allowed the identification of commonly mutated genes and altered pathways and processes.

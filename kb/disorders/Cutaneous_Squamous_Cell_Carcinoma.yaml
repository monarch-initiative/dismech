- accession: dbgap:phs000785
  title: Sequencing Analysis of Cutaneous Squamous Cell Carcinoma
  description:  The Exome Sequencing Analysis of Cutaneous Squamous Cell Carcinoma (SCC) study is a single-center cohort study. To identify recurrent genomic aberrations that might underlie the development of this malignancy, we performed whole exome sequencing on a series of SCC-normal pairs to distill a list of 336 candidate genes that were subsequently re-sequenced in 100 SCC-normal pairs with an average depth >1200X. This study also included whole-genome copy number analysis on 5 primary SCC with KNSTRN p.Ser24Phe and 5 histologically matched SCC with wild-type KNSTRN.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from dbgap. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Cutaneous Squamous Cell Carcinoma"). Retrieved 2026-08-02.

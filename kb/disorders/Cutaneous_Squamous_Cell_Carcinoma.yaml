- accession: ega:EGAS00001002670
  title: We performed whole-exome sequencing of 20 samples (10 actinic keratosis and 10 cutaneous squamous cell carcinoma) to investigate a potential relationship between DNA methylation-based subtypes and genetic mutation patterns (Rodriguez-Paredes et al., Nat Commun 2017)
  description: Cutaneous squamous cell carcinoma (cSCC) is the second most common skin cancer type and arises from keratinocytes. Most cSCC progress from a UV-induced precancerous lesion termed actinic keratosis (AK). Despite various efforts to characterize these lesions molecularly, the etiology of AK and its progression to cSCC remain only partially understood. Here we have used Infinium MethylationEPIC BeadChips to interrogate the DNA methylation status of about 850.000 CpGs in epidermal preparations from healthy skin, AK and cSCC. Importantly, we found that the premalignant AK samples displayed classical features of cancer methylomes and were highly similar to cSCC methylomes.

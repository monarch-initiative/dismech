  notes: >-
    Some cases of familial/isolated d-TGA are caused by mutations in laterality
    genes (e.g., ZIC3, NODAL, FOXH1, CFC1, GDF1) and cardiac transcription
    factors such as NKX2-5, placing TGA within the same disease spectrum as
    heterotaxy and arguing for oligogenic/complex inheritance. Most d-TGA,
    however, is sporadic with multifactorial pathogenesis.
  evidence:
  - reference: PMID:19933292
    reference_title: "Familial transposition of the great arteries caused by multiple mutations in laterality genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present study provides evidence that some cases of familial TGA are
      caused by mutations in laterality genes and therefore are part of the same
      disease spectrum of heterotaxy syndrome, and argues for an oligogenic or
      complex mode of inheritance in these pedigrees.
    explanation: >-
      Directly supports laterality-gene mutations as a cause of familial TGA and
      the oligogenic/complex inheritance model.
  - reference: PMID:19933292
    reference_title: "Familial transposition of the great arteries caused by multiple mutations in laterality genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Probands of seven families with isolated TGA and a family history of
      concordant or discordant congenital heart disease were screened for
      mutations in the ZIC3, ACVR2B, LEFTYA, CFC1, NODAL, FOXH1, GDF1, CRELD1,
      GATA4 and NKX2.5 genes.
    explanation: >-
      Identifies the specific laterality/transcription-factor genes screened and
      implicated in familial TGA.
- name: Common-variant polygenic susceptibility (WNT5A locus)
  association: Polygenic susceptibility
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Beyond rare developmental-gene variants, a genome-wide association study in
    1,237 d-TGA patients identified a common-variant susceptibility locus at
    3p14.3 near WNT5A (a Wnt-family gene with a known role in cardiac outflow-tract
    development), with SNP-based heritability indicating that a substantial
    fraction of d-TGA susceptibility is attributable to common variation. This
    supports a polygenic architecture in addition to monogenic/oligogenic causes.
  evidence:
  - reference: PMID:34886679
    reference_title: "Common Genetic Variants Contribute to Risk of Transposition of the Great Arteries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This work provides support for a polygenic architecture in D-TGA and
      identifies a susceptibility locus on chromosome 3p14.3 near WNT5A.
    explanation: >-
      Directly establishes a common-variant susceptibility locus at 3p14.3 near
      WNT5A and a polygenic architecture for d-TGA.
  - reference: PMID:34886679
    reference_title: "Common Genetic Variants Contribute to Risk of Transposition of the Great Arteries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SNP-based heritability analysis showed that 25% of variance in
      susceptibility to D-TGA may be explained by common variants.
    explanation: >-
      Quantifies the contribution of common genetic variation to d-TGA
      susceptibility, supporting the polygenic model.
  - reference: PMID:34886679
    reference_title: "Common Genetic Variants Contribute to Risk of Transposition of the Great Arteries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The genome-wide significant locus (3p14.3) co-localizes with a putative
      regulatory element that interacts with the promoter of WNT5A, which encodes
      the Wnt Family Member 5A protein known for its role in cardiac development in
      mice.
    explanation: >-
      Links the susceptibility locus to WNT5A and Wnt signaling in cardiac
      development, connecting common-variant genetics to outflow-tract morphogenesis.
environmental:
- name: Maternal pregestational diabetes
  description: >-
    Maternal type 1 diabetes is strongly associated with congenital heart defects
    in offspring, with transposition of the great arteries showing one of the
    highest risk estimates among CHD subgroups (OR 7.39), supporting a
    hyperglycemia-mediated teratogenic contribution to embryonic cardiogenesis.
  disease_effect: PREDISPOSES
  causal_role: RISK_FACTOR
  evidence:
  - reference: PMID:38180757
    reference_title: "Maternal Diabetes and Overweight and Congenital Heart Defects in Offspring."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Maternal T1D was associated with increased odds of having a child with any
      CHD (OR, 3.77 [95% CI, 3.26-4.36]) and 6 of 9 CHD subgroups (OR range,
      3.28 [95% CI, 1.55-6.95] for other septal defects to 7.39 [95% CI,
      3.00-18.21] for transposition of great arteries) compared with no maternal
      diabetes.
    explanation: >-
      Nationwide birth-cohort register study quantifying a 7.39-fold increased
      odds of transposition of the great arteries in offspring of mothers with
      pregestational type 1 diabetes.
  influences_mechanisms:
  - target: Abnormal conotruncal septation and cardiac looping
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In utero maternal hyperglycemia perturbs embryonic cardiac morphogenesis
      through oxidative stress and genetic/epigenetic dysregulation during
      outflow-tract development.
    evidence:
    - reference: DOI:10.3390/ijms242216258
      reference_title: "Maternal Pre-Existing Diabetes: A Non-Inherited Risk Factor for Congenital Cardiopathies"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        According to current hypotheses, hyperglycemia is the main teratogenic
        agent in diabetic pregnancies. It is thought to induce cell damage,
        directly through genetic and epigenetic dysregulations and/or indirectly
        through production of reactive oxygen species (ROS).
      explanation: >-
        Summarizes the teratogenic pathways linking maternal pregestational
        hyperglycemia to disrupted embryonic cardiac development.
diagnosis:
- name: Fetal echocardiography
  description: >-
    Targeted prenatal fetal echocardiography evaluating the ventricular outflow
    tracts and three-vessel-trachea view enables in utero identification of
    parallel great arteries and planned perinatal management at a tertiary
    cardiac center.
  diagnosis_term:
    preferred_term: Fetal echocardiography
    term:
      id: NCIT:C114079
      label: Fetal Echocardiography Test
  results: Discordant ventriculoarterial connections with parallel great arteries arising from the right and left ventricles in utero.
  evidence:
  - reference: DOI:10.3390/children11060626
    reference_title: "Complete Transposition of the Great Arteries in the Pediatric Field: A Multimodality Imaging Approach"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Fetal echocardiography plays a pivotal role in prenatal detection, enabling early intervention strategies."
    explanation: Establishes fetal echocardiography as the primary prenatal diagnostic modality for complete d-TGA.
- name: Transthoracic echocardiography
  description: >-
    Postnatal transthoracic echocardiography with Doppler is the definitive
    first-line diagnostic test to confirm ventriculoarterial discordance,
    characterize atrial/ventricular/ductal mixing sites, assess ventricular
    function and left ventricular outflow tract obstruction, and evaluate
    coronary anatomy before surgery.
  diagnosis_term:
    preferred_term: Transthoracic echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  results: Aorta arising from the morphologic right ventricle and pulmonary artery arising from the morphologic left ventricle with characterization of PFO, PDA, VSD, LVOTO, and coronary origins.
  evidence:
  - reference: DOI:10.3390/children11060626
    reference_title: "Complete Transposition of the Great Arteries in the Pediatric Field: A Multimodality Imaging Approach"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      TTE remains the cornerstone for initial diagnosis, surgical preparation,
      and postoperative evaluation, providing essential information on cardiac
      anatomy, ventricular function, and the presence of associated defects.
    explanation: Confirms transthoracic echocardiography as the cornerstone diagnostic test for d-TGA.
- name: Cardiovascular magnetic resonance
  description: >-
    Adjunctive radiation-free cross-sectional imaging with cardiovascular
    magnetic resonance (CMR) provides detailed anatomical and functional
    evaluation of great-vessel relationships, ventricular volumes, and
    postoperative sequelae from fetal life into adulthood.
  diagnosis_term:
    preferred_term: Cardiac magnetic resonance imaging
    term:
      id: NCIT:C137915
      label: Magnetic Resonance Imaging of the Heart
  results: Radiation-free three-dimensional anatomical and functional delineation of great-artery alignment, ventricular volumes, and postoperative neoaortic or pulmonary artery outcomes.
  evidence:
  - reference: DOI:10.3390/children11060626
    reference_title: "Complete Transposition of the Great Arteries in the Pediatric Field: A Multimodality Imaging Approach"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      CMR, free from ionizing radiation, provides detailed anatomical and
      functional insights from fetal life into adulthood, becoming increasingly
      important in evaluating complex cardiac structures and post-surgical
      outcomes.
    explanation: Documents the diagnostic role of cardiovascular magnetic resonance in anatomical, functional, and post-surgical evaluation of d-TGA.
- name: Cardiac computed tomography
  description: >-
    High-resolution cardiac computed tomography (CCT) delineates coronary artery
    origins and courses as well as great-vessel and branch pulmonary artery
    anatomy, particularly when echocardiography or cardiovascular magnetic
    resonance is contraindicated or inconclusive.
  diagnosis_term:
    preferred_term: Cardiac computed tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  results: High-resolution delineation of coronary artery origins/courses and great-vessel anatomy.
  notes: >-
    NCIT contains no dedicated cardiac computed tomography concept (`ncit` search
    for `cardiac computed tomography` returns 0 hits); bound to general
    `NCIT:C17204` (`Computed Tomography`) with `preferred_term` preserving the
    cardiac scope.
  evidence:
  - reference: DOI:10.3390/children11060626
    reference_title: "Complete Transposition of the Great Arteries in the Pediatric Field: A Multimodality Imaging Approach"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      CCT, with its high-resolution imaging, is indispensable in
      delineating coronary anatomy and vascular structures, particularly when
      CMR is contraindicated or inconclusive.
    explanation: Documents the diagnostic role of cardiac computed tomography in coronary and vascular delineation in d-TGA.
treatments:
- name: Prostaglandin E1
  description: >-
    Intravenous prostaglandin E1 maintains patency of the ductus arteriosus after
    birth, preserving intercirculatory mixing and improving oxygenation as a
    bridge to definitive repair in d-TGA.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prostaglandin E1
      term:
        id: CHEBI:15544
        label: prostaglandin E1
  target_mechanisms:
  - target: Mixing-dependent neonatal cyanosis
    treatment_effect: MODULATES
    description: Maintains ductus arteriosus patency to preserve intercirculatory blood mixing and systemic/cerebral oxygenation.
    evidence:
    - reference: DOI:10.3390/biomedicines12092018
      reference_title: Effects of Prostaglandin E1 and Balloon Atrial Septostomy on Cerebral Blood Flow and Oxygenation in Newborns Diagnosed with Transposition of the Great Arteries
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        PGE1 treatment and BAS are lifesaving interventions that may improve
        cerebral perfusion and oxygenation in newborns with D-TGA during the
        transition period, as reflected by increasing SpO2 and crSO2.
      explanation: >-
        Observational neonatal cohort in which transitional arterial (SpO2) and
        cerebral (crSO2) oxygenation rose under PGE1 with or without balloon
        atrial septostomy, indirectly mitigating mixing-dependent cyanosis.
  target_phenotypes:
  - preferred_term: Cyanosis
    term:
      id: HP:0000961
      label: Cyanosis
  evidence:
  - reference: PMID:30860704
    reference_title: "Transposition of the Great Arteries."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Completely parallel circulatory circuits are incompatible with life and
      require a patent ductus arteriosus (PDA) or an atrial (ASD) or ventricular
      septal defect (VSD) to allow the mixing of oxygenated and deoxygenated blood
    explanation: >-
      Maintaining ductal patency with prostaglandin E1 preserves the PDA-mediated
      mixing that this source identifies as necessary for survival.
  - reference: DOI:10.3390/biomedicines12092018
    reference_title: Effects of Prostaglandin E1 and Balloon Atrial Septostomy on Cerebral Blood Flow and Oxygenation in Newborns Diagnosed with Transposition of the Great Arteries
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 83 D-TGA newborns received PGE1 within two hours after delivery, of whom 46 (55.42%) underwent BAS."
    explanation: Clinical cohort documenting universal early neonatal PGE1 administration after delivery in d-TGA.
- name: Balloon atrial septostomy
  description: >-
    A catheter-based palliative procedure (Rashkind procedure) that enlarges the
    interatrial communication to improve atrial-level mixing and stabilize the
    neonate before the arterial switch operation.
  therapeutic_modality: SURGERY
  notes: >-
    Balloon atrial septostomy is a percutaneous catheter-based cardiac
    intervention classified under `SURGERY` in the absence of a dedicated
    catheter-intervention value in `TherapeuticModalityEnum`.
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Mixing-dependent neonatal cyanosis
    treatment_effect: MODULATES
    description: Enlarges the interatrial communication to augment mixing between parallel systemic and pulmonary circulations.
    evidence:
    - reference: DOI:10.3390/biomedicines12092018
      reference_title: Effects of Prostaglandin E1 and Balloon Atrial Septostomy on Cerebral Blood Flow and Oxygenation in Newborns Diagnosed with Transposition of the Great Arteries
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The BAS procedure resulted in a significant increase in crSO2 from 42% to 51% at 24 h of life in the PGE1 + BAS group."
      explanation: Demonstrates improved neonatal oxygenation after balloon atrial septostomy in d-TGA newborns with restrictive mixing.
  target_phenotypes:
  - preferred_term: Cyanosis
    term:
      id: HP:0000961
      label: Cyanosis
  evidence:
  - reference: PMID:39200964
    reference_title: "Pathogenesis and Surgical Treatment of Dextro-Transposition of the Great Arteries (D-TGA): Part II."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Balloon atrial septostomy (BAS) is necessary prior to the operation.
    explanation: >-
      Identifies balloon atrial septostomy as a standard pre-operative
      stabilizing procedure in d-TGA.
- name: Arterial switch operation
  description: >-
    The arterial switch operation is the preferred definitive anatomic repair,
    restoring concordant ventriculoarterial connections by transecting and
    reimplanting the great arteries with coronary transfer, typically performed in
    the neonatal period.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Ventriculoarterial discordance and parallel circulation
    treatment_effect: RESTORES
    description: Surgically restores concordant series ventriculoarterial connections with coronary artery transfer.
    evidence:
    - reference: PMID:39200964
      reference_title: "Pathogenesis and Surgical Treatment of Dextro-Transposition of the Great Arteries (D-TGA): Part II."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The recommended surgical correction methods include arterial switch
        operation (ASO) and atrial switch operation (AtrSR), as well as the Rastelli
        and Nikaidoh procedures.
      explanation: Identifies the arterial switch operation as the recommended surgical repair correcting ventriculoarterial discordance.
  target_phenotypes:
  - preferred_term: Dextrotransposition of the great arteries
    term:
      id: HP:0031348
      label: Dextrotransposition of the great arteries
  - preferred_term: Cyanosis
    term:
      id: HP:0000961
      label: Cyanosis
  evidence:
  - reference: PMID:39200964
    reference_title: "Pathogenesis and Surgical Treatment of Dextro-Transposition of the Great Arteries (D-TGA): Part II."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Correction of the defect during infancy is the preferred treatment for
      D-TGA.
    explanation: >-
      Supports surgical correction in infancy as the preferred definitive
      treatment for d-TGA.
  - reference: PMID:39200964
    reference_title: "Pathogenesis and Surgical Treatment of Dextro-Transposition of the Great Arteries (D-TGA): Part II."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The recommended surgical correction methods include arterial switch
      operation (ASO) and atrial switch operation (AtrSR), as well as the Rastelli
      and Nikaidoh procedures.
    explanation: >-
      Identifies the arterial switch operation (and alternatives) as recommended
      surgical corrections for d-TGA.

name: Silicotuberculosis
creation_date: "2026-11-26T15:45:00Z"
category: Infectious Disease
disease_term:
  preferred_term: silicotuberculosis
  term:
    id: MONDO:0021804
    label: silicotuberculosis
parents:
- Tuberculosis
- Silicosis
- Pulmonary tuberculosis
synonyms:
- silico-tuberculosis
- silicotuberculoses
- silicosis with tuberculosis
description: >-
  Silicotuberculosis is active tuberculosis, usually pulmonary, caused by
  Mycobacterium tuberculosis in a person with silicosis, the fibrotic
  pneumoconiosis caused by inhaling respirable crystalline silica. Silica dust
  is inhaled in hard-rock and gold mining, quarrying, tunnelling and caisson
  work, stone cutting and engineered-stone fabrication, sandblasting and
  foundry work. Silica particles phagocytosed by alveolar macrophages cannot be
  digested; they damage the phagolysosome, activate the NLRP3 inflammasome and
  drive the fibrotic silicotic nodule, and they also leave the macrophage less
  able to control M. tuberculosis, with a shift towards necrotic cell death and
  a type 2-skewed lung immune response in experimental models. Silicosis raises
  the risk of tuberculosis about fourfold, with a steep gradient by radiological
  severity and a further excess with progressive massive fibrosis, and silica
  exposure raises the risk even without radiological silicosis. HIV infection
  multiplies the risk, which is why South African gold miners carry some of the
  highest tuberculosis rates recorded. Tuberculosis is hard to recognise against
  the nodules and conglomerate masses of silicosis on imaging, and cavitation in
  a conglomerate mass is an important clue. Treatment is standard combination
  antituberculous chemotherapy, extended to at least 8 months on the evidence of
  a Hong Kong trial in which 6 months gave more relapses, although other cohorts
  found short-course therapy adequate. Tuberculosis preventive therapy for
  latent infection in people with silicosis roughly halves the risk, and dust
  control is the primary prevention.
notes: >-
  Scope. MONDO:0021804 is defined as tuberculosis caused by M. tuberculosis in
  patients with silicosis, and sits under silicosis (MONDO:0005960), pulmonary
  tuberculosis (MONDO:0006052) and respiratory tract infectious disorder. This
  entry covers the combined disease: what silica does to antimycobacterial
  defence, the epidemiological gradient, the diagnostic overlap and the
  treatment and preventive-therapy evidence specific to people with silicosis.
  The silicosis cascade itself is curated in Silicosis.yaml and general
  tuberculosis biology in Tuberculosis.yaml; nodes here repeat only the steps
  needed to connect silica exposure to tuberculosis. MeSH D012830 also admits
  non-tuberculous mycobacterial infection in silicosis, but the MONDO
  definition does not, so M. kansasii and other non-tuberculous mycobacteria are
  not modelled. The often-repeated claim that fibrotic silicotic nodules
  sequester bacilli and impair drug penetration was searched for and no cached
  source states it, so it is not curated as a node; the longer-treatment
  recommendation is recorded only on the trial evidence. No source documented
  Mycobacterium bovis or another non-human reservoir for this entity, so only
  the human host is recorded. Most epidemiology comes from South African gold
  miners and the Hong Kong silicosis cohort, almost entirely men; the treatment
  trials date from 1984 to 1996 and used regimens (thrice-weekly streptomycin,
  rifampicin-pyrazinamide preventive therapy) no longer standard. Symptom
  phenotypes rest on case reports, so no frequency is recorded for them. Seeded
  from research/Silicotuberculosis-deep-research-claude_code.md, used as leads
  only; every claim is supported by an evidence item quoting a cached abstract
  or full text.
review_notes: >-
  Deliberately lumped. No has_subtypes rows are declared. MONDO:0021804 has no
  MONDO children. The candidate strata in the literature were checked against
  the infectious-disease granularity ladder: tuberculosis on chronic,
  accelerated or acute silicosis; HIV-positive versus HIV-negative miners;
  gold-mining, Hong Kong caisson and quarry, Indian sandstone and agate, and
  engineered-stone exposure settings; and silica exposure without radiological
  silicosis. They differ in risk magnitude but share the organism, the
  mechanism, the diagnostic problem and the treatment approach, so they are
  recorded as risk gradients, environmental factors and progression phases
  rather than as subtypes. Non-tuberculous mycobacterial disease in silicosis is
  outside the MONDO definition and is not a stratum here.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
  ilo_disease_category:
  - classification_value: silicotuberculosis
    notes: >-
      ILO List of Occupational Diseases (revised 2010), item 2.1.2
      "Silicotuberculosis", listed separately from the pneumoconioses item
      2.1.1.
  eu_occupational_category:
  - classification_value: silicosis_combined_pulmonary_tuberculosis
    notes: >-
      European schedule of occupational diseases, Annex I item 301.12
      "Silicosis combined with pulmonary tuberculosis".
infectious_agent:
- name: Mycobacterium tuberculosis
  infectious_agent_term:
    preferred_term: Mycobacterium tuberculosis
    term:
      id: NCBITaxon:1773
      label: Mycobacterium tuberculosis
  description: >-
    The acid-fast intracellular bacillus that causes tuberculosis. In
    silicotuberculosis it infects a lung whose alveolar macrophages are already
    loaded with silica.
  evidence:
  - reference: PMID:39694587
    reference_title: "Silicotuberculosis: a critical narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Silicotuberculosis, the combination of silicosis and pulmonary
      tuberculosis (TB), remains a substantial clinical and public health
      problem in high TB burden countries with silica-exposed workforces.
    explanation: >-
      Defines the entity as tuberculosis combined with silicosis.
agent_life_cycle:
  description: >-
    M. tuberculosis passes between humans as airborne droplet nuclei. Mine
    hostels, transport and underground work are congregate settings, and
    contact with a tuberculosis patient was a risk factor for active disease in
    a Chinese silicosis cohort. No non-human reservoir was documented for this
    entity.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
transmission:
- name: Airborne Mycobacterium tuberculosis acquisition
  description: >-
    The person with silicosis acquires M. tuberculosis by inhaling airborne
    bacilli from an infectious case, or reactivates a latent infection acquired
    earlier. Silica does not transmit the organism; it lowers the host's
    defence against it.
  evidence:
  - reference: PMID:36453892
    reference_title: "Mycobacterium tuberculosis Infection among 1,659 Silicosis Patients in Zhejiang Province, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      having a history of exposure to TB patients (OR = 4.329, 95% CI = 1.992
      to 9.434, P < 0.001) were associated with ATB
    explanation: >-
      Contact with tuberculosis patients was associated with active tuberculosis
      among 1,659 silicosis patients, consistent with person-to-person
      transmission.
  - reference: PMID:11125895
    reference_title: "HIV infection and silicosis: the impact of two potent risk factors on the incidence of mycobacterial disease in South African miners."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The increasing impact of HIV over time may indicate epidemic TB
      transmission with rapid disease development in HIV-infected miners.
    explanation: >-
      The authors read the rising HIV-associated tuberculosis incidence in gold
      miners as ongoing epidemic transmission; this is their interpretation, not
      a measured transmission chain.
prevalence:
- population: South African gold miners with silicosis, 7-year surveillance cohort
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 2707.0
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    Annual tuberculosis incidence of 2,707/100,000 in 818 older gold miners with
    silicosis, against 981/100,000 in 335 without silicosis. This is incidence
    of tuberculosis among people with silicosis, not a population rate of
    silicotuberculosis.
  evidence:
  - reference: PMID:7952577
    reference_title: "The epidemiology of tuberculosis in gold miners with silicosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The annual incidence of tuberculosis was 981/100,000 in the 335 men
      without silicosis and 2,707/100,000 in the 818 men with silicosis.
    explanation: >-
      Incidence of tuberculosis in miners with and without silicosis.
- population: Silicosis patients screened in Zhejiang Province, China
  measure_type: POINT_PREVALENCE
  prevalence_class: UNKNOWN
  notes: >-
    Active tuberculosis in 6.34% and latent infection in 50.6% of 1,659 screened
    silicosis patients. A prevalence within the silicosis population, not in
    the general population, so no band is asserted.
  evidence:
  - reference: PMID:36453892
    reference_title: "Mycobacterium tuberculosis Infection among 1,659 Silicosis Patients in Zhejiang Province, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The prevalence of active tuberculosis (ATB) was 6,340/100,000 (6.34%)
      people; the proportion of patients with latent tuberculosis infection
      (LTBI) was 50.6%.
    explanation: >-
      Burden of active and latent tuberculosis in a provincial silicosis
      screening programme.
- population: Workers with silicosis on chest radiographs, sandstone mines of Rajasthan, India
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Sixty-one radiographically silicotic stone-mine workers had pulmonary
    tuberculosis; the source reports this as 12.4%. A proportion in a selected
    series of workers with respiratory morbidity, so no rate is asserted.
  evidence:
  - reference: PMID:34041062
    reference_title: "Silicosis, progressive massive fibrosis and silico-tuberculosis among workers with occupational exposure to silica dusts in sandstone mines of Rajasthan state: An urgent need for initiating national silicosis control programme in India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Sixty-one (12.4%) subjects with silicosis also had associated pulmonary
      tuberculosis, termed as silico-tuberculosis.
    explanation: >-
      Silicotuberculosis among stone-mine workers with silicosis.
environmental:
- name: Occupational respirable crystalline silica exposure
  exposure_term:
    preferred_term: exposure to respirable crystalline silica
    term:
      id: ECTO:7000030
      label: exposure to silica dust
  notes: >-
    Occupations named in the cited sources include gold and other hard-rock
    mining, artisanal and small-scale mining, quarrying and sandstone mining,
    caisson work, granite and stone cutting, sandblasting, glass manufacture,
    foundry and pottery work, and dry processing of engineered stone. Silica
    exposure raises tuberculosis risk even without radiological silicosis
    (pooled relative risk 1.92, low certainty) and the excess persists after
    exposure ends.
  evidence:
  - reference: PMID:34016067
    reference_title: "The association between silica exposure, silicosis and tuberculosis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Meta-analysis of five studies of silica exposure controlling for or
      excluding silicosis yielded a pooled relative risk of 1.92 (95% CI 1.36,
      2.73).
    explanation: >-
      Pooled human cohort and case-control data: silica exposure raises
      tuberculosis risk independently of radiological silicosis.
  - reference: PMID:34016067
    reference_title: "The association between silica exposure, silicosis and tuberculosis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The effect estimate is more uncertain for silica exposure without
      radiological silicosis.
    explanation: >-
      The authors' own caveat on the exposure-only estimate.
  - reference: PMID:9816385
    reference_title: "Risk of pulmonary tuberculosis relative to silicosis and exposure to silica dust in South African gold miners."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Exposure to silica dust is a risk factor for the development of PTB in
      the absence of silicosis, even after exposure to silica dust ends.
    explanation: >-
      Cohort of 2,255 gold miners followed to 1995.
  - reference: PMID:20811560
    reference_title: "Cavitated conglomerate mass in silicosis indicating associated tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The principal sources of industrial exposure to free silica are mining,
      quarrying, and tunneling; stonecutting, polishing, and cleaning
      monumental masonry; sandblasting and glass manufacturing
    explanation: >-
      Case report background listing the occupations that expose workers to
      free silica.
  - reference: PMID:39134395
    reference_title: "Autoimmune diseases, autoantibody status and silicosis in a cohort of 1238 workers from the artificial stone benchtop industry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A modern epidemic of silicosis is emerging internationally, associated
      with dry processing of engineered stone with high (>90%) RCS content.
    explanation: >-
      Engineered-stone fabrication as a current source of high respirable
      crystalline silica exposure.
  influences_mechanisms:
  - target: Alveolar Macrophage Uptake of Respirable Silica
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Inhaled respirable silica deposits in the distal lung and is taken up by
      alveolar macrophages.
    evidence:
    - reference: PMID:30687311
      reference_title: "Immunity to the Dual Threat of Silica Exposure and Mycobacterium tuberculosis."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Silicosis results from the deposition of respirable silica particles in
        the lower respiratory tract, causing inflammation, collagen deposition,
        and fibrotic lesions.
      explanation: >-
        Deposition of inhaled respirable silica in the lower respiratory tract
        is the starting point of the cascade.
  - target: Progression to Active Tuberculous Granulomatous Disease
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Cumulative dust exposure raises the risk of active tuberculosis in a
      dose-dependent way, including in miners without radiological silicosis.
    evidence:
    - reference: PMID:9816385
      reference_title: "Risk of pulmonary tuberculosis relative to silicosis and exposure to silica dust in South African gold miners."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        The risk of PTB increases with the presence of silicosis, and in miners
        without radiological silicosis, with quartiles of exposure to dust.
      explanation: >-
        Exposure-response gradient for tuberculosis by cumulative dust
        exposure.
- name: HIV infection
  description: >-
    HIV infection and silicosis combine multiplicatively in raising
    tuberculosis risk in South African gold miners, so that HIV-positive men
    with silicosis reach the highest incidence recorded in the cited cohort.
    No ECTO exposure class fits a chronic viral infection, so no exposure_term
    is bound.
  evidence:
  - reference: PMID:11125895
    reference_title: "HIV infection and silicosis: the impact of two potent risk factors on the incidence of mycobacterial disease in South African miners."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The incidence of HIV-associated TB increased significantly during the
      study, with no corresponding change in HIV-negative rates, to reach 16.1
      per 100 person-years among HIV-positive silicotics.
    explanation: >-
      Tuberculosis incidence in HIV-positive miners with silicosis.
  - reference: PMID:17439668
    reference_title: "Silica, silicosis and tuberculosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The prevalence of silica-related TB is exacerbated by the human
      immunodeficiency virus (HIV) epidemic in low-income countries.
    explanation: >-
      Review naming HIV as the co-factor driving silica-related tuberculosis.
  influences_mechanisms:
  - target: Progression to Active Tuberculous Granulomatous Disease
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      HIV and silicosis risks multiply rather than add.
    evidence:
    - reference: PMID:11125895
      reference_title: "HIV infection and silicosis: the impact of two potent risk factors on the incidence of mycobacterial disease in South African miners."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        The data were consistent with the risks of silicosis and HIV combining
        multiplicatively, but did not fit an additive model.
      explanation: >-
        Retrospective cohort of 1,374 HIV-positive and 2,648 HIV-negative
        miners.
- name: Contact with infectious tuberculosis patients
  description: >-
    Exposure to people with tuberculosis was the strongest factor associated
    with active disease in a Chinese silicosis screening cohort; being
    underweight was also associated.
  evidence:
  - reference: PMID:36453892
    reference_title: "Mycobacterium tuberculosis Infection among 1,659 Silicosis Patients in Zhejiang Province, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      being underweight (OR = 2.320, 95% CI = 1.057 to 5.089, P = 0.036)
    explanation: >-
      Underweight as a further risk factor for active tuberculosis in the same
      cohort.
  influences_mechanisms:
  - target: Progression to Active Tuberculous Granulomatous Disease
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Contact supplies new infection to a host with impaired defence.
    evidence:
    - reference: PMID:36453892
      reference_title: "Mycobacterium tuberculosis Infection among 1,659 Silicosis Patients in Zhejiang Province, China."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        having a history of exposure to TB patients (OR = 4.329, 95% CI = 1.992
        to 9.434, P < 0.001) were associated with ATB
      explanation: >-
        Association of contact with active tuberculosis among 1,659 silicosis
        patients.
pathophysiology:
- name: Alveolar Macrophage Uptake of Respirable Silica
  description: >-
    Respirable crystalline silica reaching the alveoli is phagocytosed by
    alveolar macrophages, which cannot digest it, so the particles persist
    inside the cell.
  role: trigger
  biological_scale: CELLULAR
  locations:
  - preferred_term: pulmonary alveolus
    term:
      id: UBERON:0002299
      label: alveolus of lung
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: phagocytosis
    term:
      id: GO:0006909
      label: phagocytosis
    modifier: INCREASED
  evidence:
  - reference: PMID:30687311
    reference_title: "Immunity to the Dual Threat of Silica Exposure and Mycobacterium tuberculosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Owing to the poor capability of the cell in eliminating the particle by
      standard lysosomal proteolytic enzymes, silica particles remain in the
      cell and initiate a cascade of pro- and anti-inflammatory processes,
      leading to a number of pathological modifications in the immune
      response.
    explanation: >-
      Ingested silica is not degraded and persists in the macrophage.
  downstream:
  - target: Silica-Induced Phagolysosomal Damage
    description: >-
      Phagocytosed crystals damage and rupture the lysosome.
    evidence:
    - reference: PMID:18604214
      reference_title: "Silica crystals and aluminum salts activate the NALP3 inflammasome through phagosomal destabilization."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        NALP3 activation required phagocytosis of crystals, and this uptake
        subsequently led to lysosomal damage and rupture.
      explanation: >-
        Macrophage experiments linking crystal uptake to lysosomal rupture.
  - target: Impaired Alveolar Macrophage Control of Mycobacterium tuberculosis
    description: >-
      Silica-loaded macrophages control M. tuberculosis poorly.
    evidence:
    - reference: PMID:24278357
      reference_title: "Pre-exposure of Mycobacterium tuberculosis-infected macrophages to crystalline silica impairs control of bacterial growth by deregulating the balance between apoptosis and necrosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Our results show that exposure to CS limits macrophage ability to
        control Mtb growth.
      explanation: >-
        Macrophages pre-exposed to crystalline silica, then infected.
  - target: Type 2-Skewed Antimycobacterial Immunity
    description: >-
      Silica-induced lung damage releases self-DNA that primes STING.
    evidence:
    - reference: PMID:31141689
      reference_title: "Sterile Lung Inflammation Induced by Silica Exacerbates Mycobacterium tuberculosis Infection via STING-Dependent Type 2 Immunity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Silica induces lung damage that prompts extracellular self-DNA release
        and activates STING.
      explanation: >-
        Mouse silica plus M. tuberculosis model.
- name: Silica-Induced Phagolysosomal Damage
  description: >-
    The silica surface destabilises and ruptures the phagolysosomal membrane,
    releasing cathepsin B into the cytosol, a danger signal for the NLRP3
    inflammasome.
  role: driver
  biological_scale: CELLULAR
  conforms_to: "nlrp3_inflammasome_activation#Activating Danger Signal"
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  evidence:
  - reference: PMID:18604214
    reference_title: "Silica crystals and aluminum salts activate the NALP3 inflammasome through phagosomal destabilization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      inhibition of either phagosomal acidification or cathepsin B activity
      impaired NALP3 activation.
    explanation: >-
      Places phagolysosomal acidification and released cathepsin B between
      crystal uptake and inflammasome activation.
  downstream:
  - target: NLRP3 Inflammasome Activation
    description: >-
      Lysosomal damage activates NLRP3.
    evidence:
    - reference: PMID:18604214
      reference_title: "Silica crystals and aluminum salts activate the NALP3 inflammasome through phagosomal destabilization."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        silica and aluminum salt crystals activated inflammasomes formed by the
        cytoplasmic receptor NALP3.
      explanation: >-
        Silica crystals activate the NLRP3 (NALP3) inflammasome.
- name: NLRP3 Inflammasome Activation
  description: >-
    NLRP3, ASC and caspase-1 assemble in silica-laden macrophages and release
    IL-1beta and IL-18, sustaining the inflammation that leads to fibrosis.
  role: driver
  biological_scale: MOLECULAR
  conforms_to: "nlrp3_inflammasome_activation#NLRP3 Inflammasome Assembly and Caspase-1 Activation"
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: NLRP3 inflammasome complex assembly
    term:
      id: GO:0044546
      label: NLRP3 inflammasome complex assembly
    modifier: INCREASED
  evidence:
  - reference: PMID:22534002
    reference_title: "Silicosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Phagocytosis of crystalline silica in the lung causes lysosomal damage,
      activating the NALP3 inflammasome and triggering the inflammatory cascade
      with subsequent fibrosis.
    explanation: >-
      Review placing inflammasome activation between lysosomal damage and
      fibrosis.
  downstream:
  - target: Silicotic Nodule Fibrosis
    description: >-
      The inflammasome-driven inflammatory cascade ends in fibrosis.
    evidence:
    - reference: PMID:22534002
      reference_title: "Silicosis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Phagocytosis of crystalline silica in the lung causes lysosomal damage,
        activating the NALP3 inflammasome and triggering the inflammatory
        cascade with subsequent fibrosis.
      explanation: >-
        The same review sentence names fibrosis as the outcome of the cascade.
- name: Silicotic Nodule Fibrosis
  description: >-
    Myofibroblasts lay down collagen in whorled silicotic nodules that, in
    complicated silicosis, coalesce into conglomerate masses (progressive
    massive fibrosis). Tuberculosis risk rises with radiological silicosis
    grade and is highest with progressive massive fibrosis.
  role: effector
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Excessive ECM Deposition"
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  cell_types:
  - preferred_term: myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  biological_processes:
  - preferred_term: collagen biosynthetic process
    term:
      id: GO:0032964
      label: collagen biosynthetic process
    modifier: INCREASED
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  evidence:
  - reference: PMID:30687311
    reference_title: "Immunity to the Dual Threat of Silica Exposure and Mycobacterium tuberculosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Silicosis results from the deposition of respirable silica particles in
      the lower respiratory tract, causing inflammation, collagen deposition,
      and fibrotic lesions.
    explanation: >-
      Collagen deposition and fibrotic lesions as the tissue outcome.
  downstream:
  - target: Pulmonary fibrosis
    description: >-
      Coalescent nodules form the conglomerate masses of progressive massive
      fibrosis.
    evidence:
    - reference: PMID:34041062
      reference_title: "Silicosis, progressive massive fibrosis and silico-tuberculosis among workers with occupational exposure to silica dusts in sandstone mines of Rajasthan state: An urgent need for initiating national silicosis control programme in India."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Of them, 40 (7.5%) subjects showed large opacities suggestive of
        progressive massive fibrosis.
      explanation: >-
        Progressive massive fibrosis among stone-mine workers with silicosis.
  - target: Progression to Active Tuberculous Granulomatous Disease
    description: >-
      Tuberculosis risk climbs with silicosis grade and with progressive
      massive fibrosis.
    evidence:
    - reference: PMID:7952577
      reference_title: "The epidemiology of tuberculosis in gold miners with silicosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        The incidence of tuberculosis increased from 1% per annum (pa) for the
        men without silicosis to 2.2% pa for the men with silicosis with
        Category 1 nodule profusion, 2.9% pa for those with Category 2, and
        6.3% pa for those with Category 3 silicosis.
      explanation: >-
        Severity gradient by ILO nodule profusion category in gold miners.

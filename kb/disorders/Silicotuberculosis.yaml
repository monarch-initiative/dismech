- name: Impaired Alveolar Macrophage Control of Mycobacterium tuberculosis
  description: >-
    Macrophages pre-exposed to silica restrict M. tuberculosis growth less well,
    express less TLR2 and the anti-apoptotic proteins Bcl-2 and Mcl-1, and in

- name: Tuberculosis preventive therapy for latent infection
  description: >-
    Treatment of latent tuberculosis infection in people with silicosis.
    Isoniazid, or isoniazid plus rifampicin, roughly halved the proportion
    developing tuberculosis in a Hong Kong placebo-controlled trial, though
    substantial residual risk remained; WHO strongly recommends systematic
    testing and treatment of latent infection in people with silicosis.
    Rifampicin plus pyrazinamide carried more hepatotoxicity than isoniazid.
    Mass community preventive therapy in gold miners did not reduce tuberculosis
    at the population level once treatment ended.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
  target_mechanisms:
  - target: Progression to Active Tuberculous Granulomatous Disease
    treatment_effect: INHIBITS
    description: >-
      Preventive therapy lowers the chance that latent infection progresses to
      active disease.
  evidence:
  - reference: PMID:1731596
    reference_title: "A double-blind placebo-controlled clinical trial of three antituberculosis chemoprophylaxis regimens in patients with silicosis in Hong Kong. Hong Kong Chest Service/Tuberculosis Research Centre, Madras/British Medical Research Council."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Thus, although chemoprophylaxis halved the proportion of patients in whom
      tuberculosis developed, this proportion was still substantial.
    explanation: >-
      Placebo-controlled trial of preventive therapy in silicosis patients.
  - reference: PMID:26405286
    reference_title: "Management of latent Mycobacterium tuberculosis infection: WHO guidelines for low tuberculosis burden countries."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The guidelines strongly recommend systematic testing and treatment of
      LTBI in people living with HIV, adult and child contacts of pulmonary TB
      cases, patients initiating anti-tumour necrosis factor treatment, patients
      receiving dialysis, patients preparing for organ or haematological
      transplantation, and patients with silicosis.
    explanation: >-
      WHO lists silicosis among the groups for which latent-infection treatment
      is strongly recommended.
  - reference: PMID:14665488
    reference_title: "Initial experience on rifampin and pyrazinamide vs isoniazid in the treatment of latent tuberculosis infection among patients with silicosis in Hong Kong."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A higher incidence of hepatotoxicity was associated with rifampin plus
      pyrazinamide than isoniazid in the treatment of latent tuberculosis
      infection among patients with silicosis in Hong Kong.
    explanation: >-
      Contraindication-relevant caveat: rifampicin-pyrazinamide was more
      hepatotoxic than isoniazid in silicosis patients.
  - reference: PMID:24450889
    reference_title: "A trial of mass isoniazid preventive therapy for tuberculosis control."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Mass screening and treatment for latent tuberculosis had no significant
      effect on tuberculosis control in South African gold mines, despite the
      successful use of isoniazid in preventing tuberculosis during treatment.
    explanation: >-
      Community-level caveat: mass preventive therapy did not control
      tuberculosis at the population level after treatment ended.
- name: Silica dust control and removal from exposure
  description: >-
    Primary prevention by engineering controls, dust suppression, substitution,
    respiratory protection and regulation, together with removal of the worker
    from further exposure. Reducing respirable silica is the intervention with
    the largest potential to lower both silicosis and tuberculosis, though it is
    hard to achieve in practice.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: occupational exposure control
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37733799
    reference_title: "Silicosis, tuberculosis and silica exposure among artisanal and small-scale miners: A systematic review and modelling paper."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Our modelling demonstrated decreases in cumulative RCS are associated
      with reductions in silicosis and tuberculosis, with greater reductions at
      higher mean exposures.
    explanation: >-
      Lowering respirable crystalline silica reduces both silicosis and
      tuberculosis.
  - reference: PMID:17439668
    reference_title: "Silica, silicosis and tuberculosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Prevention of disease, in the form of dust control, remains the focus of
      the World Health Organization and International Labour Office Global
      Elimination of Silicosis Campaign.
    explanation: >-
      Dust control is the primary preventive strategy.

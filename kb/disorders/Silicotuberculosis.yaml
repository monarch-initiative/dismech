- name: Mixed silicotic nodules and caseating tuberculous granulomas
  description: >-
    Resected or autopsy lung in silicotuberculosis shows silicotic nodules
    alongside well-formed granulomas with central caseous necrosis, and
    M. tuberculosis complex DNA can be demonstrated in the lesions.
  evidence:
  - reference: PMID:37685266
    reference_title: "A Complex Case of Pulmonary Silico-Tuberculosis and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Several lesions showed the characteristic features of silicotic nodules.
      There were also adjacent well-formed granulomas, some with central
      caseous necrosis.
    explanation: >-
      Coexisting silicotic nodules and caseating granulomas in a resected mass.
progression:
- phase: Silicosis and latent tuberculosis infection
  notes: >-
    The person has silicosis, often with latent M. tuberculosis infection; about
    half of screened silicosis patients were latently infected. This is the
    stage at which preventive therapy is offered.
  evidence:
  - reference: PMID:36453892
    reference_title: "Mycobacterium tuberculosis Infection among 1,659 Silicosis Patients in Zhejiang Province, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      the proportion of patients with latent tuberculosis infection (LTBI) was
      50.6%.
    explanation: >-
      Latent infection in half of screened silicosis patients.
- phase: Active silicotuberculosis
  notes: >-
    Active tuberculosis develops, usually pulmonary, with the diagnostic
    challenge of distinguishing new disease from silicotic change. Tuberculosis
    tends to be diagnosed years after silicosis is established, on average 7.6
    years after dust exposure ended in one necropsy cohort.
  evidence:
  - reference: PMID:9816385
    reference_title: "Risk of pulmonary tuberculosis relative to silicosis and exposure to silica dust in South African gold miners."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The onset of radiological silicosis preceded the diagnosis of PTB in
      90.2% of the cases with PTB who had silicosis.
    explanation: >-
      Silicosis typically precedes the active tuberculosis.
- phase: Post-tuberculous lung disease
  notes: >-
    After treatment, structural damage and lost lung function persist, adding to
    the fixed deficit of silicosis; a recent review proposes including
    post-tuberculous lung disease in the definition.
  evidence:
  - reference: PMID:39694587
    reference_title: "Silicotuberculosis: a critical narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The objectives of this narrative review are to propose a definition of
      silicotuberculosis which includes post-tuberculous lung disease
    explanation: >-
      Post-tuberculous lung disease proposed as part of the disease spectrum.

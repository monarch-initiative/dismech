transmission:
- name: Cat-flea-associated transmission
  description: >-
    R. felis is primarily associated with the ubiquitous cat flea
    Ctenocephalides felis, although the organism has been molecularly detected
    in many arthropods and vertebrates and its definitive vertebrate reservoir
    is not established.
  evidence:
  - reference: PMID:33574726
    reference_title: "Manifestations and Management of Flea-Borne Rickettsioses."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Since the discovery of R. felis infecting a cat flea colony in California
      in 1990,77 it has been increasingly found within a diverse variety of
      vertebrate and invertebrate species throughout the world.3 Its primary
      recognized invertebrate host and reservoir is C. felis.
    explanation: >-
      Supports C. felis as the principal recognized invertebrate host and
      reservoir for R. felis.


diagnosis:
- name: Paired-serum indirect immunofluorescence assay
  description: >-
    Serologic confirmation of a rickettsial illness is retrospective, using
    paired acute and convalescent sera to show seroconversion or a fourfold
    antibody-titer rise; antibodies to R. felis cross-react more strongly with
    spotted-fever-group antigen than with typhus-group antigen.
  diagnosis_term:
    preferred_term: indirect immunofluorescence assay
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: Seroconversion or a fourfold rise in spotted-fever-group antibody titer supports infection.
  evidence:
  - reference: PMID:33574726
    reference_title: "Manifestations and Management of Flea-Borne Rickettsioses."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The serologic confirmation of diagnosis is therefore retrospective –
      requiring demonstration of seroconversion or 4-fold increase in antibody
      titer from acute- and convalescent-phase specimens.
    explanation: >-
      The review describes the paired-serum criterion used to confirm a
      rickettsial illness.
  - reference: PMID:33574726
    reference_title: "Manifestations and Management of Flea-Borne Rickettsioses."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Antibodies against R. felis have been shown to be more cross reactive to
      spotted fever group antigen than to typhus group antigen.
    explanation: The review supports use of spotted-fever-group serology for R. felis infection.
- name: Skin-biopsy Rickettsia qPCR
  description: >-
    Real-time PCR on skin-biopsy material can support an acute spotted-fever or
    typhus-group rickettsiosis diagnosis while first-serum serology is still
    negative; skin-biopsy qPCR is substantially more often positive than
    whole-blood qPCR because circulating organisms are few.
  diagnosis_term:
    preferred_term: polymerase chain reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  results: A positive pan-rickettsial or group-specific qPCR supports acute rickettsial infection.
  evidence:
  - reference: PMID:25706392
    reference_title: >-
      Comparison of two quantitative real time PCR assays for Rickettsia
      detection in patients from Tunisia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Among 44 skin biopsies obtained from patients with confirmed diagnosis,
      the first duplex was positive in 24 samples (54.5%), with three patients
      positive by Rtt qPCR.
    explanation: >-
      The Tunisian rickettsiosis series shows that direct molecular testing of
      skin material can detect Rickettsia DNA in acute human rickettsioses.

treatments:
- name: Doxycycline
  description: >-
    Preferred empiric tetracycline therapy for flea-borne rickettsioses; because
    early serology is often negative, treatment is started when the syndrome is
    suspected rather than waiting for retrospective seroconversion.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Rickettsia felis Ribosomal Translation
    description: Doxycycline inhibits bacterial ribosomal protein synthesis.
  evidence:

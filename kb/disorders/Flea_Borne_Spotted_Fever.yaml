    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Doxycycline is the preferred agent for the treatment of flea-borne rickettsioses.
    explanation: The review identifies doxycycline as the preferred treatment.

references:
- reference: PMID:33574726
  title: "Manifestations and Management of Flea-Borne Rickettsioses."
  findings:
  - statement: >-
      Review defining murine typhus and flea-borne spotted fever as flea-borne
      infections caused by Rickettsia typhi and Rickettsia felis, respectively,
      and summarizing R. felis uncertainty, symptoms, serology, and doxycycline
      treatment.
    supporting_text: >-
      Murine typhus and flea-borne spotted fever are undifferentiated febrile
      illnesses caused by Rickettsia typhi and Rickettsia felis, respectively.
- reference: PMID:31253864
  title: >-
    A new role for host annexin A2 in establishing bacterial adhesion to
    vascular endothelial cells: lines of evidence from atomic force microscopy
    and an in vivo study.
  found_in:
  - Flea_Borne_Spotted_Fever-deep-research-openscientist.md
  findings:
  - statement: >-
      Endothelial ANXA2 functions as a luminal-surface rickettsial adherence
      receptor, with OmpB as the bacterial ligand.
    supporting_text: >-
      We found that deletion of ANXA2 impeded rickettsial attachment to the ECs
      in vitro and blocked rickettsial adherence to the blood vessel luminal
      surface in vivo.
- reference: PMID:28806774
  title: >-
    Fibroblast growth factor receptor-1 mediates internalization of pathogenic
    spotted fever rickettsiae into host endothelium.
  found_in:
  - Flea_Borne_Spotted_Fever-deep-research-openscientist.md
  findings:
  - statement: >-
      FGFR1/heparan-sulfate signaling contributes to pathogenic spotted-fever
      rickettsial internalization into human microvascular endothelial cells.
    supporting_text: >-
      Inhibition of HSPGs by heparinase and FGFRs by AZD4547 (a selective
      small-molecule inhibitor) results in significant reduction in rickettsial
      internalization into cultured human microvascular endothelial cells (ECs),
      which represent the primary targets of pathogenic rickettsiae during human
      infections.
- reference: PMID:29736763
  title: "Serum cytokine responses in Rickettsia felis infected febrile children, Ghana."
  found_in:
  - Flea_Borne_Spotted_Fever-deep-research-openscientist.md
  findings:
  - statement: >-
      Human R. felis mono-infection is associated with increased serum IL-8,
      IP-10, MCP-1, MIP-1-alpha, and VEGF in febrile Ghanaian children.
    supporting_text: >-
      Levels of IL-8 (interleukin-8), IP-10 (interferon-γ-induced protein-10),
      MCP-1 (monocyte chemotactic protein-1), MIP-1α (macrophage inflammatory
      protein-1α) and VEGF (vascular endothelial growth factor) were
      significantly elevated in R. felis mono-infection
- reference: PMID:12860594
  title: Pathogenic mechanisms of diseases caused by Rickettsia.
  found_in:
  - Flea_Borne_Spotted_Fever-deep-research-openscientist.md
  findings:
  - statement: >-
      Review supporting the shared typhus/spotted-fever sequence from dermal
      rickettsial entry to endothelial dissemination, permeability, edema, and
      cytotoxic/NK-cell immunity.
    supporting_text: >-
      The pathogenetic sequence includes rickettsial entry into the dermis,
      hematogenous dissemination to vascular endothelial cells
- reference: PMID:24336183
  title: Ribosome-targeting antibiotics and mechanisms of bacterial resistance.
  findings:
  - statement: Review establishing the bacterial ribosome as a major antibiotic target.
    supporting_text: The ribosome is one of the main antibiotic targets in the bacterial cell.
- reference: PMID:18611821
  title: Intracellular organisms.
  findings:
  - statement: >-
      Review supporting intracellular bacterial niches as a reason that
      poorly cell-penetrant agents can be ineffective.
    supporting_text: >-
      The intracellular location of some microorganisms allow them to resist
      antibiotics with poor ability to penetrate eukaryotic cell membranes, such
      as the beta-lactam compounds.


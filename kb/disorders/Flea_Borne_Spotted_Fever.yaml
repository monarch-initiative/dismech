pathophysiology:
- name: Rickettsia felis Ribosomal Translation
  description: >-
    R. felis, like other bacteria, depends on 70S-ribosome translation of its
    mRNA. Doxycycline targets this conserved bacterial translation machinery,
    explaining why a tetracycline is the preferred treatment for flea-borne
    rickettsioses.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    reference_title: Ribosome-targeting antibiotics and mechanisms of bacterial resistance.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      The review establishes the conserved bacterial ribosome target represented
      by this R. felis translation node.
- name: Obligate Intracellular Rickettsia felis Niche
  description: >-
    R. felis is an obligately intracellular Gram-negative coccobacillus.
    Occupancy of a eukaryotic cytosolic niche makes the organism intrinsically
    difficult to treat with antimicrobials that do not penetrate host cells.
  role: intrinsic_resistance
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:33574726

name: Flea-Borne Spotted Fever
creation_date: "2026-09-28T13:09:20Z"
category: Infectious Disease
description: >-
  Flea-borne spotted fever is a febrile rickettsiosis attributed to the
  obligately intracellular Gram-negative bacterium Rickettsia felis. R. felis is
  carried by cat fleas, and reported human disease presents as an
  undifferentiated fever that can include headache, myalgia, maculopapular rash,
  and occasional eschar. The causal role of R. felis in every PCR-positive
  febrile illness is less settled than the R. typhi-murine typhus relationship,
  because R. felis DNA has also been detected in afebrile controls and on skin
  swabs; curated mechanisms therefore focus on rickettsial processes directly
  supported for R. felis or shared across flea-borne rickettsiae.

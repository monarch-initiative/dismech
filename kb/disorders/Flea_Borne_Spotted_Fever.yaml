    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Flea-borne rickettsiae are small (~1.3 X 0.4 µm) gram-negative
      coccobacilli.
    explanation: The review characterizes flea-borne rickettsiae as Gram-negative coccobacilli.
  - reference: PMID:33574726

    endothelial surfaces, rickettsial OmpB can use ANXA2 for adherence, while
    pathogenic spotted-fever rickettsiae also use an FGFR1/HSPG entry program
    to internalize into microvascular endothelial cells. Systemic endothelial
    infection and inflammatory injury then increase vascular permeability.

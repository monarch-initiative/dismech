notes: >-
  KY-related neuromyopathy is curated here as a KY gene-defined disease
  (MONDO:1010194) spanning three documented presentations: myofibrillar myopathy
  7 / congenital myopathy with core-targetoid defects, and hereditary spastic
  paraplegia. The phenotype-based MONDO class myofibrillar myopathy 7
  (MONDO:0014922) is a child of MONDO:1010194 and is already curated as a KY
  subtype of the separate Myofibrillar_Myopathy grouping entry; to avoid two
  entries holding the same disease_term, MONDO:0014922 is deliberately not
  re-bound on the MFM7 subtype row here. The two entries cut the same gene along
  different axes (a gene-defined disease versus a phenotype-based myofibrillar
  grouping), like other cross-cutting pairs in the KB. PR #14853 reviewed this
  stub and left it for curation because the KY spastic-paraplegia presentation
  was uncurated.

  KY's predicted transglutaminase catalytic activity has never been demonstrated
  on an endogenous substrate, and a 2026 study showed the muscle-fiber-size
  function is independent of the predicted catalytic triad, so the molecular node
  binds the demonstrated filamin-binding (Z-disc scaffolding) role rather than a
  peptidase activity.

  No current GeneReviews chapter covers KY-related neuromyopathy: the only
  Bookshelf match is the retired "Myofibrillar Myopathy" overview (NBK1499),
  which is withdrawn and not KY-specific, and no KY gene-scoped chapter exists.

genetic:
- name: KY
  gene_term:
    preferred_term: KY
    term:
      id: hgnc:26576
      label: KY
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    KY (kyphoscoliosis peptidase, chromosome 3q22.2) encodes a transglutaminase-like
    Z-disc protein. Biallelic loss-of-function variants cause the disease; reported
    alleles include the frameshift c.1071delG (p.Thr358Leufs*3), nonsense variants
    p.Tyr135Ter and p.Arg139Ter, a complex frameshift p.Val18TyrfsTer56 in the
    spastic-paraplegia kindred, and missense/splice variants (e.g. p.Cys243Arg,
    p.Ile416Asn) that reduce protein abundance. The predicted catalytic triad is
    dispensable for KY's muscle-fiber-size function, consistent with a structural
    rather than enzymatic loss of function.
  variants:
  - name: c.1071delG (p.Thr358Leufs*3)
    description: Homozygous truncating frameshift in the Swedish index case; the mutant transcript is expressed in skeletal muscle, consistent with loss of function.
    evidence:
    - reference: PMID:27485408
      reference_title: "A new early-onset neuromuscular disorder associated with kyphoscoliosis peptidase (KY) deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole-exome sequencing revealed a homozygous one-base deletion (c.1071delG, p.(Thr358Leufs*3)) in KY, predicted to result in a truncated protein."
      explanation: Reports the index frameshift allele.
  - name: c.51_52ins(28) (p.Val18fs56*)
    description: Homozygous complex insertion/frameshift in the Bedouin hereditary-spastic-paraplegia kindred; truncating loss of function.
    evidence:
    - reference: PMID:28488683
      reference_title: "Progressive hereditary spastic paraplegia caused by a homozygous KY mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole-exome sequencing identified a single homozygous variant within this locus, c.51_52ins(28); p.(V18fs56*) in KY, segregating in the family as expected and not found in 190 Bedouin controls."
      explanation: Reports the frameshift allele underlying the spastic presentation.
  evidence:
  - reference: PMID:35752288
    reference_title: "Genotypic and phenotypic spectrum of Myofibrillar Myopathy 7 as a result of Kyphoscoliosis Peptidase deficiency: The first description of a missense mutation in KY and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in KY cause Myofibrillar Myopathy-7 (MFM-7) and Hereditary Spastic Paraplegia (HSP)."
    explanation: Establishes KY as causative across the myopathic and spastic presentations.

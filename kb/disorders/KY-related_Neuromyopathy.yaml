name: KY-related Neuromyopathy
creation_date: "2026-11-06T15:00:00Z"
category: Mendelian
synonyms:
- KY-related myopathy
- myofibrillar myopathy 7
- MFM7
- kyphoscoliosis peptidase deficiency
disease_term:
  preferred_term: KY-related neuromyopathy
  term:
    id: MONDO:1010194
    label: KY-related neuromyopathy
parents:
- hereditary neuromuscular disease
inheritance:
- name: Autosomal recessive
  description: >-
    All reported families carry biallelic (homozygous or compound heterozygous)
    KY variants, typically in consanguineous pedigrees.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:35752288
    reference_title: "Genotypic and phenotypic spectrum of Myofibrillar Myopathy 7 as a result of Kyphoscoliosis Peptidase deficiency: The first description of a missense mutation in KY and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MFM-7 is an early onset muscle disorder with an autosomal recessive inheritance marked by progressive muscle weakness and joint contractures."
    explanation: States the autosomal recessive inheritance of KY-related MFM7.
has_subtypes:
- name: Myofibrillar myopathy 7
  display_name: Myofibrillar myopathy 7 / congenital myopathy (MFM7)
  description: >-
    The myopathic presentation: early-onset, slowly progressive, lower-limb
    predominant muscle weakness with myofibrillar/congenital-myopathy histology
    (thickened Z-discs, nemaline rods, core-targetoid defects, filamin-C-positive
    inclusions). The phenotype-focused MONDO class myofibrillar myopathy 7
    (MONDO:0014922) is deliberately not re-bound here; it is already curated as a
    KY subtype of the phenotype-based Myofibrillar_Myopathy grouping entry, and
    re-binding it would make two entries hold the same term (see notes).
- name: Hereditary spastic paraplegia
  display_name: KY-related hereditary spastic paraplegia
  description: >-
    An upper-motor-neuron-predominant presentation reported in a consanguineous
    Bedouin kindred: progressive lower-limb spasticity, hyperreflexia and
    equinus, with lateral tongue atrophy, from a homozygous KY frameshift.
pathophysiology:
- name: KY Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in KY abolish or severely reduce
    kyphoscoliosis peptidase, a transglutaminase-like Z-disc protein. Although it
    carries a predicted catalytic triad, no endogenous enzymatic activity is
    established; its demonstrated role is binding its partner filamin C at the
    Z-disc, and that scaffolding function is lost.
  genes:
  - preferred_term: KY
    term:
      id: hgnc:26576
      label: KY
  molecular_functions:
  - preferred_term: filamin binding
    modifier: DECREASED
    term:
      id: GO:0031005
      label: filamin binding
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:27485408
    reference_title: "A new early-onset neuromuscular disorder associated with kyphoscoliosis peptidase (KY) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a new early-onset neuromuscular disorder due to a homozygous loss-of-function variant in the kyphoscoliosis peptidase gene (KY)."
    explanation: Establishes biallelic KY loss of function as the cause.
  - reference: PMID:35752288
    reference_title: "Genotypic and phenotypic spectrum of Myofibrillar Myopathy 7 as a result of Kyphoscoliosis Peptidase deficiency: The first description of a missense mutation in KY and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KY is primarily involved in the formation and stabilization of neuromuscular intersections making it essential for the development of the musculoskeletal system."
    explanation: Identifies KY as the affected muscle protein.
  downstream:
  - target: Z-disc Protein Mislocalization and Myofibrillar Disorganization
    causal_link_type: DIRECT
    description: Loss of KY scaffolding leaves filamin C and Xin mislocalized, destabilizing the Z-disc.
    evidence:
    - reference: PMID:27485408
      reference_title: "A new early-onset neuromuscular disorder associated with kyphoscoliosis peptidase (KY) deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The abnormal distribution of Xin and Ky-binding partner filamin C in the muscle fibers of our patient was highly similar to their altered localization in ky/ky mouse muscle fibers."
      explanation: Links KY loss directly to mislocalization of its Z-disc partners in patient muscle.
- name: Z-disc Protein Mislocalization and Myofibrillar Disorganization
  biological_scale: CELLULAR
  description: >-
    With filamin C and Xin mislocalized, the sarcomeric Z-disc loses integrity:
    muscle fibers show thickened Z-discs, small nemaline rods, core-targetoid
    defects and myofibrillar disorganization.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: sarcomere organization
    modifier: DECREASED
    term:
      id: GO:0045214
      label: sarcomere organization
  evidence:
  - reference: PMID:27485408
    reference_title: "A new early-onset neuromuscular disorder associated with kyphoscoliosis peptidase (KY) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some small fibers showed abnormal sarcomeres with thickened Z-discs and small nemaline rods."
    explanation: Documents the Z-disc and myofibrillar pathology in patient muscle.
  downstream:
  - target: Impaired Filamin C Turnover
    causal_link_type: DIRECT
    description: Mislocalized filamin C triggers compensatory chaperone-assisted selective autophagy.
  - target: Deficient Muscle Growth and Hypertrophic Response
    causal_link_type: DIRECT
    description: Z-disc instability prevents translation of mechanical load into muscle growth.
  - target: Lower limb muscle weakness
    causal_link_type: DIRECT
    description: Progressive myofibrillar disorganization weakens the fiber.
- name: Impaired Filamin C Turnover
  biological_scale: MOLECULAR
  description: >-
    Filamin C is a client of the tension-induced, BAG3-dependent chaperone-assisted
    selective autophagy (CASA) pathway. In KY-deficient cell, zebrafish and mouse
    models, CASA factors (BAG3, HSPB8, filamin C) are transcriptionally upregulated,
    an early molecular hallmark interpreted as a compensatory response to defective
    filamin C handling.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: chaperone-mediated autophagy
    modifier: INCREASED
    term:
      id: GO:0061684
      label: chaperone-mediated autophagy
  evidence:
  - reference: PMID:29914939
    reference_title: "Transcriptional upregulation of Bag3, a chaperone-assisted selective autophagy factor, in animal models of KY-deficient hereditary myopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "upregulation of CASA factors appears to be an early and primary molecular hallmark of KY deficiency."
    explanation: Reports CASA upregulation as an early molecular hallmark in KY-deficient models.
- name: Deficient Muscle Growth and Hypertrophic Response
  biological_scale: CELLULAR
  description: >-
    KY is required to translate increased mechanical tension into muscle growth;
    without it, muscle fails to mount a hypertrophic response to demand even as
    adaptive fiber-type shifts still occur, so postural muscles degenerate.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: muscle hypertrophy
    modifier: DECREASED
    term:
      id: GO:0014896
      label: muscle hypertrophy
  evidence:
  - reference: PMID:11136708
    reference_title: "The kyphoscoliosis (ky) mouse is deficient in hypertrophic responses and is caused by a mutation in a novel muscle-specific protein."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Muscle hypertrophy in response to increasing demand is deficient in the ky mutant, whereas adaptive fibre type shifts take place."
    explanation: Shows KY loss causes deficient hypertrophic response in the mouse model.
  downstream:
  - target: Lower limb muscle weakness
    causal_link_type: DIRECT
    description: Failure of muscle growth and maintenance manifests as progressive weakness.
- name: Neuromuscular Junction Maturation Defect
  biological_scale: CELLULAR
  description: >-
    KY is required for maturation and stabilization of the neuromuscular junction;
    its loss leaves NMJs irregular, which together with KY expression in the CNS
    is proposed to contribute to the mixed myopathic-neurogenic features and the
    spastic presentation.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: neuromuscular junction development
    modifier: DECREASED
    term:
      id: GO:0007528
      label: neuromuscular junction development
  evidence:
  - reference: PMID:11136708
    reference_title: "The kyphoscoliosis (ky) mouse is deficient in hypertrophic responses and is caused by a mutation in a novel muscle-specific protein."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The histopathology of the ky mutant suggests that Ky protein activity is crucial for normal muscle growth and function as well as the maturation and stabilization of the neuromuscular junction."
    explanation: Implicates KY in NMJ maturation and stabilization.
  downstream:
  - target: Lower limb muscle weakness
    causal_link_type: DIRECT
    description: NMJ immaturity contributes to weakness.
  - target: Spastic paraplegia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      KY expression in the CNS is proposed to underlie the upper-motor-neuron
      features seen in the spastic-paraplegia presentation.
    evidence:
    - reference: PMID:28488683
      reference_title: "Progressive hereditary spastic paraplegia caused by a homozygous KY mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "KY transcription in CNS tissues may imply that it also has a role in neuromotor function, in line with the irregularity of neuromuscular junction in Ky null mutant mice."
      explanation: Proposes a CNS/neuromotor role of KY behind the spastic presentation.

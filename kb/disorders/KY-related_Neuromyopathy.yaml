      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The ky mouse mutant exhibits a primary degenerative myopathy preceding chronic thoraco-lumbar kyphoscoliosis."
      explanation: Supports the mouse as a model of KY-deficient myopathy.

- name: NCT02436655
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: AVATAR randomized 157 low-risk patients with severe stenosis, preserved ejection fraction and a negative exercise test. At median 63 months, the death/MI/stroke/HF-hospitalization composite was 18/78 versus 37/79 with early surgery versus surveillance (HR 0.42). Secondary mortality and HF findings were exploratory without multiplicity adjustment. CV death and sudden death were not statistically clearly reduced. Open-label adjudication, small size and COVID-era follow-up constrain generalization.
  notes: Status and phase checked on 2026-09-21. Published analysis size is distinguished from registry planned enrollment and subsequent extension.

name: Aortic Valve Stenosis
creation_date: '2026-08-10T13:40:00Z'
disease_term:
  preferred_term: aortic valve stenosis
  term:
    id: MONDO:0042981
    label: aortic valve stenosis
category: Cardiovascular Disease
description: Aortic valve stenosis is obstruction of left ventricular outflow at the valve. Adult calcific disease involves leaflet lipid accumulation, inflammation, fibrosis and mineralization; congenital valve morphology and rheumatic commissural fusion provide other routes to obstruction. Ventricular pressure overload can lead to hypertrophy, fibrosis, impaired filling, myocardial ischemia and heart failure. Symptoms and valve severity, ventricular consequences, anatomy, procedural risk and patient preferences guide intervention. Mechanistic evidence from tissue associations and experimental models does not establish one obligatory sequence in every patient.
synonyms:
- aortic stenosis
- valvular aortic stenosis
notes: This entry covers valvular obstruction, with most molecular evidence concerning adult calcific disease. Calcific aortic valve disease also includes sclerosis without important obstruction and is not an exact synonym for every form of aortic stenosis. Subvalvular and supravalvular stenosis are anatomically distinct. No applicable GeneReviews chapter was identified; the StatPearls aortic stenosis chapter (PMID:32491560; NBK557628) provides a clinical baseline, while intervention timing and mode use the 2025 ESC/EACTS guideline. Older categorical age, survival and procedure claims are not adopted. The valve fibrosa does not satisfy the arterial-intima boundary of the atherogenesis module; lipid and inflammatory similarities alone do not justify conformance. Live Cell Ontology lookup identified CL:4030032 valve interstitial cell and CL:4030033 valve endothelial cell, replacing the previous claimed ontology gap. URL full-text records identify the 2025 ESC/EACTS guideline (PMID:40878295, DOI:10.1093/eurheartj/ehaf194), AVATAR follow-up (PMID:39217448, DOI:10.1093/eurheartj/ehae585), EARLY TAVR (PMID:39466903, DOI:10.1056/NEJMoa2405880), and RECOVERY ten-year follow-up (PMID:41880613,
  DOI:10.1056/NEJMoa2511920). Each paper uses one evidence identity because canonical PMID retrieval did not recover its full body.
has_subtypes:
- name: Calcific stenosis of a tricuspid aortic valve
  description: Age-associated leaflet fibrosis and calcification are a common adult presentation; the molecular and genetic association studies largely address this spectrum.
  review_notes: Etiologic grouping; live MONDO searches did not identify an exact acquired calcific or rheumatic subtype. Congenital stenosis MONDO:0017735 does not cover every later acquired stenosis on congenital anatomy.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557628/
    reference_title: Aortic Stenosis - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Etiologies include congenital (bicuspid/unicuspid), calcific, and rheumatic disease.
    explanation: Clinical etiologic synthesis; no subtype frequency is inferred.
- name: Congenital valve-associated stenosis
  description: Bicuspid or unicuspid anatomy can cause valvular obstruction and predispose to later calcification. Bicuspid valves may coexist with aortopathy; only a minority of familial disease is explained by recognized NOTCH1 variants.
  review_notes: Etiologic grouping; live MONDO searches did not identify an exact acquired calcific or rheumatic subtype. Congenital stenosis MONDO:0017735 does not cover every later acquired stenosis on congenital anatomy.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557628/
    reference_title: Aortic Stenosis - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Etiologies include congenital (bicuspid/unicuspid), calcific, and rheumatic disease.
    explanation: Clinical etiologic synthesis; no subtype frequency is inferred.
- name: Rheumatic aortic stenosis
  description: Post-rheumatic commissural fusion narrows the valve. This route is distinct from the dominant adult calcific mechanism and often accompanies other rheumatic valve disease.
  review_notes: Etiologic grouping; live MONDO searches did not identify an exact acquired calcific or rheumatic subtype. Congenital stenosis MONDO:0017735 does not cover every later acquired stenosis on congenital anatomy.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557628/
    reference_title: Aortic Stenosis - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The commissures of the leaflets fuse to leave a small central orifice.
    explanation: Clinical etiologic synthesis; no subtype frequency is inferred.
inheritance:
- name: Autosomal dominant NOTCH1-related aortic valve disease
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: Some NOTCH1-related aortic valve disease follows autosomal dominant inheritance with variable expressivity and incomplete penetrance. This mode does not describe all bicuspid valves or acquired calcific stenosis, which also has common-variant susceptibility.
  evidence:
  - reference: PMID:16025100
    reference_title: Mutations in NOTCH1 cause aortic valve disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we show that mutations in the signalling and transcriptional regulator NOTCH1 cause a spectrum of developmental aortic valve anomalies and severe valve calcification in non-syndromic autosomal-dominant human pedigrees.
    explanation: States the autosomal-dominant, non-syndromic pedigree transmission that this block records, and confines it to the NOTCH1 arm.
    quote_role: PRIMARY_RESULT
genetic:
- name: LPA
  gene_term:
    preferred_term: LPA
    term:
      id: hgnc:6667
      label: LPA
  relationship_type: SUSCEPTIBILITY
  notes: LPA rs10455872 was associated with CT-detected aortic valve calcium in a 6,942-person European-ancestry discovery analysis, with separate prospective clinical-stenosis associations. Replication was positive in several ancestry groups but not significant in the small Chinese-American analysis. Mendelian randomization supports a causal contribution of circulating Lp(a) under instrument assumptions; it does not demonstrate drug efficacy or a resolved molecular pathway.
  evidence:
  - reference: PMID:23388002
    reference_title: Genetic associations with valvular calcification and aortic stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: One SNP in the lipoprotein(a) (LPA) locus (rs10455872) reached genomewide significance for the presence of aortic-valve calcification
    explanation: Genome-wide significant association of the LPA locus with aortic valve calcification.
    quote_role: PRIMARY_RESULT
- name: NOTCH1
  gene_term:
    preferred_term: NOTCH1
    term:
      id: hgnc:7881
      label: NOTCH1
  relationship_type: CAUSATIVE
  notes: Rare loss-of-function variants cause familial aortic valve developmental anomalies and calcification. A 2022 sequencing/systematic study found a pathogenic variant in one of eight recruited pedigrees and none in 381 sporadic BAV patients. Its approximately 2% familial and <0.1% sporadic literature estimates use heterogeneous congenital-heart-disease denominators, mainly of White ancestry; they are not population fractions of all aortic stenosis. Incomplete penetrance and uncertain variants remain important.
  evidence:
  - reference: PMID:16025100
    reference_title: Mutations in NOTCH1 cause aortic valve disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: mutations in the signalling and transcriptional regulator NOTCH1 cause a spectrum of developmental aortic valve anomalies and severe valve calcification in non-syndromic autosomal-dominant human pedigrees.
    explanation: Establishes NOTCH1 as a causal gene for human aortic valve disease.
    quote_role: PRIMARY_RESULT
  - reference: PMID:35288444
    reference_title: Contribution of NOTCH1 genetic variants to bicuspid aortic valve and other congenital lesions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: No pathogenic or likely pathogenic NOTCH1 variants were identified in 381 sporadic patients.
    explanation: Primary sporadic BAV sequencing result, not proof that NOTCH1 can never cause sporadic disease.
- name: PRRX1
  gene_term:
    preferred_term: PRRX1
    term:
      id: hgnc:9142
      label: PRRX1
  relationship_type: SUSCEPTIBILITY
  notes: Candidate expression-mediated susceptibility from 2024 GWAS, valve eQTL, colocalization and Mendelian randomization. The study associated higher valve expression with risk; this is statistical nomination, not a patient pathogenic-variant series or gene perturbation/rescue. The GWAS included 14,819 cases and 927,044 European-ancestry controls; 484 selected surgical/transplant valve samples passed expression QC. Bulk tissue, ancestry restriction and instrument assumptions limit interpretation.
  evidence:
  - reference: PMID:38494474
    reference_title: Integrative genomic analyses identify candidate causal genes for calcific aortic valve stenosis involving tissue-specific regulation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: After removing genes with a low probability for colocalization of the GWAS and eQTL signals (PP4 < 0.75, n = 20), with no MR instrument (n = 3) or with high heterogeneity of the instrument (n = 2), ten genes remained (PALMD, NAV1, PRRX1, ATP13A3, BCL10, TWIST1, RAD9A, NRBP1, FES and AFAP1).
    explanation: Ten prioritized genes retained after statistical filtering; causal molecular intermediates require complementary experiments.
    directness: INDIRECT

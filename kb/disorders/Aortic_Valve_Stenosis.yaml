      label: Magnetic Resonance Imaging
- name: Bleeding and acquired von Willebrand evaluation
  description: In a patient with severe stenosis and bleeding, assess ordinary gastrointestinal and hemostatic causes as well as acquired vWF dysfunction. Specialized multimer, collagen-binding and high-shear platelet-function assays characterized the clinical syndrome; the cited study is not a recommendation to screen every asymptomatic patient.
  evidence:
  - reference: PMID:12878741
    reference_title: Acquired von Willebrand syndrome in aortic stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Platelet function under conditions of high shear stress, von Willebrand factor collagen-binding activity and antigen levels, and the multimeric structure of von Willebrand factor were assessed at base line and one day, seven days, and six months postoperatively.
    explanation: Assays used in the consecutive clinical cohort.
- name: Distinguishing valvular from other outflow obstruction
  description: Aortic sclerosis without important obstruction, subvalvular stenosis, hypertrophic cardiomyopathy and supravalvular stenosis are differential diagnoses. Coronary disease and pulmonary disease can independently explain angina or dyspnea.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557628/
    reference_title: Aortic Stenosis - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Other causes of ... with or without LV outflow obstruction include hypertrophic cardiomyopathy, aortic sclerosis, and subvalvular stenosis.
    explanation: Anatomical and clinical differential diagnosis.
treatments:
- name: Surgical aortic valve replacement
  description: Replacement relieves severe valvular obstruction. In the 2025 ESC/EACTS adult framework, SAVR is recommended for patients younger than 70 years at low surgical risk and remains the principal approach for many young patients with bicuspid stenosis, associated aortopathy or unfavorable transcatheter anatomy. Prosthesis choice incorporates anticoagulation, durability, future interventions and patient preferences; correction of the valve does not guarantee complete myocardial recovery.
  evidence:
  - reference: url:https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf

- name: Relief of congestion
  description: Diuretics can relieve volume overload while definitive valve evaluation proceeds. Dosing must account for hemodynamics and renal function; symptomatic treatment does not remove fixed obstruction.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557628/
    reference_title: Aortic Stenosis - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: AVR is indicated in patients with heart failure and volume overload, but diuretics can help decrease congestion and provide symptomatic relief before surgery.
    explanation: Symptom relief while addressing severe valve disease.
  treatment_term:

diagnosis:
- name: Transthoracic echocardiography
  description: First-line assessment of valve morphology, peak jet velocity, mean gradient, valve area, flow and ventricular response. High-gradient severe stenosis is generally characterized by mean gradient ≥40 mmHg, peak velocity ≥4 m/s and valve area ≤1 cm², interpreted together. Discordant measurements require technical and hemodynamic review.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557628/
    reference_title: Aortic Stenosis - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Echocardiography remains the standard approach method to evaluate and follow-up patients with aortic stenosis and stratify them for surgery.
    explanation: Clinical diagnostic synthesis.
  diagnosis_term:
    preferred_term: Echocardiography Test
    term:
      id: NCIT:C16525
      label: Echocardiography Test
- name: Assessment of low-flow and discordant-gradient stenosis
  description: A low gradient does not exclude severe stenosis. Stroke-volume index, ejection fraction, blood pressure, Doppler quality and alternative high- or low-flow causes should be integrated. Low-dose dobutamine stress echocardiography and CT calcium scoring can help distinguish true severe from pseudo-severe disease, particularly with reduced ejection fraction.
  evidence:
  - reference: url:https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    reference_title: https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Intervention is recommended in symptomatic patients with low-flow (SVi ≤35 mL/m 2 ), low-gradient (<40 mmHg) AS with reduced LVEF (<50%) after careful confirmation that AS is severe. I B
    explanation: The 2025 recommendation requires careful confirmation of severity; it is not an instruction to treat every small calculated area.
  diagnosis_term:
    preferred_term: Echocardiography Test
    term:
      id: NCIT:C16525
      label: Echocardiography Test
- name: CT valve calcium and procedural anatomy
  description: CT calcium scoring helps adjudicate discordant stenosis; sex-specific thresholds are supportive rather than universal. Bicuspid, amyloid-associated, post-rheumatic or radiation-related fibrotic disease may be severe with relatively little calcium. CT also evaluates annulus, coronary obstruction risk and access anatomy before TAVI.
  evidence:
  - reference: url:https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    reference_title: https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The need for a meticulous CT-based anatomical analysis is para- mount in patients with an estimated life expectancy exceeding the assumed valve durability to anticipate future risks at the time of the index valve intervention.
    explanation: CT informs procedural and lifetime planning.
- name: Exercise stress testing in apparently asymptomatic disease
  description: Supervised testing can reveal symptoms or an abnormal blood-pressure response in patients reporting no symptoms. It should not be used to provoke symptoms in already symptomatic severe disease. The 2026 EARLY TAVR screening registry found 146 positive tests among 962 eligible tested patients, but positivity included hypotension and only 105 consented to registry follow-up; this is not a population symptom frequency.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557628/
    reference_title: Aortic Stenosis - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Exercise testing helps in unmasking symptoms in asymptomatic patients, but it should be avoided in symptomatic patients.
    explanation: Clinical indication and safety boundary.
  - reference: PMID:42485012
    reference_title: 'Treadmill Stress Test in Patients With Asymptomatic Severe Aortic Stenosis: A Prespecified Registry-Based Follow-Up of the EARLY TAVR Randomized Clinical Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Of these, 816 (84.8%) had a normal TST result and 146 (15.2%) had a positive TST result.
    explanation: Selected eligible screening denominator; a positive test is not synonymous with newly elicited symptoms.
  diagnosis_term:
    preferred_term: Exercise Cardiac Stress Test
    term:
      id: NCIT:C168192
      label: Exercise Cardiac Stress Test

- name: Cardiovascular lipid management
  description: Use lipid-lowering therapy for established cardiovascular indications. SALTIRE and SEAS did not demonstrate slowing of established valve disease with the tested statin-based regimens. This does not refute lipid involvement in initiation, prove an autonomous osteogenic switch, or establish the efficacy of selective Lp(a) lowering.
  evidence:
  - reference: PMID:15944423
    reference_title: A randomized trial of intensive lipid-lowering therapy in calcific aortic stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Intensive lipid-lowering therapy does not halt the progression of calcific aortic stenosis or induce its regression.
    explanation: SALTIRE tested atorvastatin in established calcific stenosis; it could not exclude smaller effects.
  - reference: PMID:18765433
    reference_title: Intensive lipid lowering with simvastatin and ezetimibe in aortic stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Simvastatin and ezetimibe did not reduce the composite outcome of combined aortic-valve events and ischemic events in patients with aortic stenosis.
    explanation: SEAS did not improve its primary composite or valve outcomes, despite a separate reduction in ischemic events.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: HMG-CoA Reductase Inhibitor
      term:
        id: NCIT:C1655

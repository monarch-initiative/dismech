epidemiology:
- name: Etiologic and age-related heterogeneity
  description: Calcific disease becomes more common with age; congenital anatomy can produce earlier stenosis, and the contribution of rheumatic disease varies geographically. These groups should not share an assumed single prevalence or mechanism.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557628/
    reference_title: Aortic Stenosis - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The causes of aortic stenosis vary geographically as calcific stenosis is more common in North America and Europe, while rheumatic valve disease is more common in developing countries.
    explanation: Broad clinical epidemiologic synthesis; no precise regional rate inferred.
progression:
- phase: Variable asymptomatic progression
  notes: Symptoms, valve hemodynamics and ventricular consequences can evolve at different rates. The historical128-person cohort used death or symptom-triggered valve replacement as a composite event; its event-free survival is not a mortality estimate. New randomized evidence informs individualized earlier intervention, rather than a fixed universal asymptomatic duration.
  evidence:
  - reference: PMID:10965007
    reference_title: Predictors of outcome in severe, asymptomatic aortic stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The rate of progression of stenosis, as reflected by the aortic-jet velocity, was significantly higher in patients who had cardiac events
    explanation: Historical prospective cohort association; event definition included intervention.

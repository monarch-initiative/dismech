phenotypes:
- category: Cardiovascular
  name: Aortic Valve Stenosis
  description: Restricted valvular opening produces outflow obstruction. Severity and flow state vary; symptoms are not required for diagnosis.
  phenotype_term:
    preferred_term: Aortic valve stenosis
    term:
      id: HP:0001650
      label: Aortic valve stenosis
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:10965007
    reference_title: Predictors of outcome in severe, asymptomatic aortic stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we identified 128 consecutive patients with asymptomatic, severe aortic stenosis
    explanation: Identifies the defining lesion in a prospectively assembled clinical cohort.
    quote_role: PRIMARY_RESULT
  notes: No disease-wide frequency band is inferred from selected clinical cohorts or narrative descriptions.
- category: Cardiovascular
  name: Aortic Valve Calcification
  description: Leaflet calcification characterizes calcific stenosis but is less dominant in some congenital, rheumatic or radiation-associated fibrotic lesions.
  phenotype_term:
    preferred_term: Aortic valve calcification
    term:
      id: HP:0004380
      label: Aortic valve calcification
  evidence:
  - reference: PMID:12719282
    reference_title: Human aortic valve calcification is associated with an osteoblast phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Microradiography and micro-computerized tomography confirmed the presence of calcification in the valve.
    explanation: Directly documents leaflet calcification in surgically explanted human valves.
    quote_role: PRIMARY_RESULT
  notes: No disease-wide frequency band is inferred from selected clinical cohorts or narrative descriptions.
- category: Cardiovascular
  name: Bicuspid Aortic Valve
  description: A congenital substrate in a subset of patients, rather than a consequence or universal feature of aortic stenosis.
  phenotype_term:
    preferred_term: Bicuspid aortic valve
    term:
      id: HP:0001647
      label: Bicuspid aortic valve
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557628/
    reference_title: Aortic Stenosis - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Etiologies include congenital (bicuspid/unicuspid), calcific, and rheumatic disease.
    explanation: Bicuspid morphology is an etiologic substrate in a subset, not an acquired consequence.
  notes: No disease-wide frequency band is inferred from selected clinical cohorts or narrative descriptions.
- category: Cardiovascular
  name: Left Ventricular Hypertrophy
  description: Ventricular hypertrophy is an adaptive response to pressure loading; its extent varies with loading conditions and other disease.
  phenotype_term:
    preferred_term: Left ventricular hypertrophy
    term:
      id: HP:0001712
      label: Left ventricular hypertrophy
  evidence:
  - reference: PMID:28017384
    reference_title: Myocardial Fibrosis and Cardiac Decompensation in Aortic Stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There was evidence of increasing hypertrophy, myocardial injury, diastolic dysfunction, and longitudinal systolic dysfunction
    explanation: Documents hypertrophy in a phenotyped aortic stenosis cohort.
    quote_role: PRIMARY_RESULT
  notes: No disease-wide frequency band is inferred from selected clinical cohorts or narrative descriptions.
- category: Cardiovascular
  name: Myocardial Fibrosis
  description: Diffuse extracellular expansion and focal replacement fibrosis may accompany ventricular remodeling. The 2017 CMR cohort is cross-sectional at baseline and does not establish inevitable serial conversion or independently adjusted mortality prediction.
  phenotype_term:
    preferred_term: Myocardial fibrosis
    term:
      id: HP:0001685
      label: Myocardial fibrosis
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:28017384
    reference_title: Myocardial Fibrosis and Cardiac Decompensation in Aortic Stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Diffuse fibrosis is associated with extracellular volume expansion that is detectable by T1 mapping, whereas late gadolinium enhancement (LGE) detects replacement fibrosis.
    explanation: Clinical imaging background; extracellular expansion is not specific for collagen alone.
  notes: No disease-wide frequency band is inferred from selected clinical cohorts or narrative descriptions.
- category: Cardiovascular
  name: Exertional Dyspnea
  description: Exertional breathlessness can reflect increased filling pressures and limited cardiac reserve; competing pulmonary or cardiac causes should be considered.
  phenotype_term:
    preferred_term: Exertional dyspnea
    term:
      id: HP:0002875
      label: Exertional dyspnea
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557628/
    reference_title: Aortic Stenosis - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Patients progressively experience a gradual decrease in exercise tolerance, dyspnea on exertion, and fatigue.
    explanation: The review directly names exertional breathlessness.
  notes: No disease-wide frequency band is inferred from selected clinical cohorts or narrative descriptions.
- category: Cardiovascular
  name: Angina Pectoris
  description: Angina can accompany myocardial oxygen supply-demand imbalance even without obstructive epicardial coronary disease.
  phenotype_term:
    preferred_term: Angina pectoris
    term:
      id: HP:0001681
      label: Angina pectoris
  evidence:
  - reference: PMID:24104373
    reference_title: 'Asymptomatic aortic stenosis in the elderly: a clinical review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Angina, exertional syncope, and heart failure are key symptoms indicating a need for intervention.
    explanation: Names angina among the symptoms whose appearance indicates a need for intervention.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:12732812
    reference_title: Pathophysiology of valvular aortic stenosis in the elderly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Eventually, symptoms of angina, non-Q wave myocardial infarction, exertional syncope, and heart failure occur.
    explanation: The review names angina in the clinical course; the accompanying infarction term does not establish its coronary mechanism.
    quote_role: REVIEW_SYNTHESIS
  notes: No disease-wide frequency band is inferred from selected clinical cohorts or narrative descriptions.
- category: Cardiovascular
  name: Syncope
  description: Exertional cerebral hypoperfusion can occur when output fails to meet vasodilatory demand; other causes of syncope remain possible.
  phenotype_term:

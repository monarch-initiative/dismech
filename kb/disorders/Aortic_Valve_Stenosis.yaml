  rate_high: 181.0
  notes: Age-standardized model estimate with 95% uncertainty interval, not a crude population proportion or screened cohort. Estimated prevalent count 13,320,896 (UI 11,422,539–15,249,411). The GBD disease category is not all congenital/rheumatic aortic stenosis; the article uses a broad I35–I35.9 code range. The magnitude band describes this age-standardized rate, not a crude population case fraction.

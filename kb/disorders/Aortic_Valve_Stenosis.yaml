name: Aortic Valve Stenosis
creation_date: "2026-08-10T13:40:00Z"
category: Acquired
disease_term:
  preferred_term: aortic valve stenosis
  term:
    id: MONDO:0042981
    label: aortic valve stenosis
description: >
  Progressive obstruction of left ventricular outflow caused by thickening,
  fibrosis, and calcification of the aortic valve leaflets. The dominant form in
  adults - calcific aortic valve disease - was long described as a passive
  "degenerative" wearing-out of the valve, but it is neither passive nor simply
  degenerative. It begins with an injury that looks like early atherosclerosis:
  endothelial disruption on the aortic side of the leaflet, subendothelial
  retention of apolipoprotein-B-containing lipoproteins, and a macrophage and
  T-cell infiltrate. It then becomes something atherosclerosis never becomes.
  Valve interstitial cells commit to an osteoblast-like transcriptional program -
  RUNX2/Cbfa1, osteopontin, osteocalcin, bone sialoprotein - and the leaflet
  actively mineralizes. That commitment is the pivot of the disease, and it
  explains the single most instructive negative result in the field: lipid
  lowering that demonstrably reduces ischemic events in the very same patients
  does nothing at all to the valve.
  Once the orifice narrows, the disease relocates. The valve sets the afterload,
  but survival is determined by what the left ventricle does about it -
  concentric hypertrophy, then diffuse interstitial and replacement myocardial
  fibrosis, then decompensation. Myocardial fibrosis burden, not valve gradient,
  tracks mortality. Valve replacement relieves the obstruction; it does not
  reverse established replacement fibrosis, which is why the timing question in
  asymptomatic severe stenosis remains genuinely unsettled rather than merely
  under-studied.
synonyms:
- calcific aortic valve disease
- calcific aortic stenosis
- aortic stenosis
notes: >
  Deliberate non-conformance to the `atherogenesis` module. The temptation is
  strong: the early valve lesion carries retained lipid, oxidized lipoprotein,
  foam-cell macrophages, and T cells (PMID:7519131), and the strongest common
  genetic signal is at LPA, a lipoprotein locus (PMID:23388002). But the
  module's own curation boundary requires "retention of apoB-containing
  lipoprotein in the arterial intima" and explicitly excludes "foam cells outside
  arterial atheroma" and "nonatherosclerotic stenosis". The aortic valve
  fibrosa is not arterial intima, the terminal lesion is a mineralized leaflet
  rather than an atheroma at UBERON:0001637 artery, and no conforming node here
  would reach the module's required smooth-muscle-cell fibrofatty-plaque stage.
  Declaring conformance at the initiation node alone would assert an arterial
  site the disorder does not have.
  The negative trial evidence makes the same point from the therapeutic side and
  is the reason this decision is recorded rather than assumed. Otto's own
  conclusion in the founding histology paper was that the early lesion has "some
  similarities ... and some dissimilarities to atherosclerosis" - a claim of
  partial resemblance, which is exactly what a module conformance is not.

  No CL term exists for the valve interstitial cell, the central effector cell of
  this disease. CL:0000057 (fibroblast) is used with a specific `preferred_term`
  throughout; the osteogenic end state is represented separately by CL:0000062
  (osteoblast), which the literature describes as a phenotype the interstitial
  cell acquires rather than a distinct lineage. This is an ontology gap, not a
  curation shortcut.

  Ross and Braunwald's 1968 natural-history study - the source of the classic
  angina/syncope/heart-failure survival figures - has no abstract in PubMed and
  therefore cannot be quoted under this project's evidence rules. The symptom
  and outcome claims here are anchored on PMID:10965007 instead, which reports
  prospectively collected event-free survival.
pathophysiology:
- name: Valve Endothelial Injury and Subendothelial Lipoprotein Retention
  biological_scale: TISSUE
  role: trigger
  description: >
    Mechanical and shear stress concentrated on the aortic side of the leaflet
    disrupts the valvular endothelium and its basement membrane, permitting
    apolipoprotein-B-containing lipoproteins - including lipoprotein(a) and its
    cargo of oxidized phospholipids - to enter and be retained in the
    subendothelial fibrosa. Retained lipid is oxidatively modified and becomes a
    standing pro-inflammatory stimulus. This is the initiating lesion of calcific
    aortic valve disease and is the stage at which the disease most resembles
    early atherosclerosis.
  locations:
  - preferred_term: aortic valve
    term:
      id: UBERON:0002137
      label: aortic valve
  cell_types:
  - preferred_term: valvular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: response to fluid shear stress
    term:
      id: GO:0034405
      label: response to fluid shear stress
    modifier: ABNORMAL
  evidence:
  - reference: PMID:7519131
    reference_title: "Characterization of the early lesion of 'degenerative' valvular aortic stenosis. Histological and immunohistochemical studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Focal areas of thickening ("early lesions") were characterized by (1)
      subendothelial thickening on the aortic side of the leaflet, between the
      basement membrane
    explanation: >-
      Localizes the initiating lesion to the subendothelial space on the aortic
      side of the leaflet, the anatomic claim of this node.
  - reference: PMID:7519131
    reference_title: "Characterization of the early lesion of 'degenerative' valvular aortic stenosis. Histological and immunohistochemical studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      extracellular neutral lipids (oil red O) and fine, stippled mineralization
      (von Kossa), and (3) disruption of the basement membrane overlying the
      lesion.
    explanation: >-
      Documents retained extracellular lipid together with basement-membrane
      disruption in the early lesion, the lipoprotein-retention claim.
  downstream:
  - target: Chronic Valvular Inflammation
    causal_link_type: DIRECT
    description: >-
      Retained and oxidatively modified lipoprotein is the antigenic and
      pro-inflammatory stimulus that recruits the leukocyte infiltrate.
- name: Lipoprotein(a) Burden
  biological_scale: ORGANISM
  role: trigger
  description: >
    Genetically determined circulating lipoprotein(a) concentration is a causal
    driver of aortic valve calcification and of incident clinical aortic
    stenosis. The LPA locus is the only variant to reach genome-wide significance
    for aortic valve calcification, the association replicates across white
    European, African-American, and Hispanic-American cohorts, and genetically
    predicted Lp(a) levels - which are not confounded by reverse causation -
    carry the same association. This is the strongest evidence that a lipoprotein
    species is causal in this disease, and it stands in deliberate tension with
    the failure of LDL lowering to modify valve progression.
  genes:
  - preferred_term: LPA
    term:
      id: hgnc:6667
      label: LPA
  evidence:
  - reference: PMID:23388002
    reference_title: "Genetic associations with valvular calcification and aortic stenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic variation in the LPA locus, mediated by Lp(a) levels, is associated
      with aortic-valve calcification across multiple ethnic groups and with
      incident clinical aortic stenosis.
    explanation: >-
      Establishes an Lp(a)-mediated genetic contribution to both valve
      calcification and incident clinical stenosis.
  - reference: PMID:23388002
    reference_title: "Genetic associations with valvular calcification and aortic stenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetically determined Lp(a) levels, as predicted by LPA genotype, were
      also associated with aortic-valve calcification, supporting a causal role
      for Lp(a).
    explanation: >-
      Supplies the causal-inference step: genotype-predicted Lp(a) carries the
      association, which is what distinguishes causation from confounded
      correlation here.
  downstream:
  - target: Valve Endothelial Injury and Subendothelial Lipoprotein Retention
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Elevated circulating Lp(a) increases the pool of retainable lipoprotein
      bearing oxidized phospholipids available to the injured leaflet.
    hypothesis_groups:
    - lipoprotein_a_specific_pathway
  - target: Valvular Calcification and Leaflet Mineralization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The genetic association is with valve calcification itself, an endpoint
      several steps downstream of retention; whether Lp(a) acts only through
      retention or also acts directly on the interstitial cell is unresolved.
    hypothesis_groups:
    - lipoprotein_a_specific_pathway
- name: Chronic Valvular Inflammation
  biological_scale: CELLULAR
  description: >
    The early lesion is not acellular debris. It contains an active inflammatory
    infiltrate of non-foam-cell and foam-cell macrophages with occasional T
    lymphocytes, absent from normal leaflets. Chronic inflammation sustains
    oxidative modification of retained lipid and supplies the cytokine
    environment in which resident interstitial cells adopt an osteogenic program.
  cell_types:
  - preferred_term: valvular foam-cell macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: infiltrating T lymphocyte
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:7519131
    reference_title: "Characterization of the early lesion of 'degenerative' valvular aortic stenosis. Histological and immunohistochemical studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      early lesions were characterized by the presence of an inflammatory
      infiltrate composed of non-foam cell and foam cell macrophages, occasional
      T cells, and rare alpha-actin-positive cells.
    explanation: >-
      Directly characterizes the cellular composition asserted by this node.
  - reference: PMID:7519131
    reference_title: "Characterization of the early lesion of 'degenerative' valvular aortic stenosis. Histological and immunohistochemical studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The early lesion of "degenerative" aortic stenosis is an active
      inflammatory process
    explanation: >-
      States the central reframing this node encodes - an active inflammatory
      process rather than passive degeneration.
  downstream:
  - target: Valve Interstitial Cell Osteogenic Transdifferentiation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Inflammatory and oxidative signaling in the fibrosa drives resident
      interstitial cells toward an osteoblast-like phenotype.
- name: Bicuspid Aortic Valve Morphology
  biological_scale: TISSUE
  role: trigger
  description: >
    A two-leaflet rather than three-leaflet aortic valve is present in 1-2% of
    the population and imposes abnormal leaflet stress and turbulent
    transvalvular flow from birth. It is the commonest congenital substrate for
    calcific stenosis and shifts presentation decades earlier.
    NOTCH1 loss-of-function links the two halves of the phenotype
    mechanistically: it produces
    the developmental leaflet anomaly, and because NOTCH1 signaling represses
    RUNX2, it also de-represses the osteogenic program that later calcifies the
    valve. The same lesion therefore both malforms the valve and removes a brake
    on its mineralization.
  locations:
  - preferred_term: aortic valve
    term:
      id: UBERON:0002137
      label: aortic valve
  genes:
  - preferred_term: NOTCH1
    term:
      id: hgnc:7881
      label: NOTCH1
  evidence:
  - reference: PMID:16025100
    reference_title: "Mutations in NOTCH1 cause aortic valve disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we show that mutations in the signalling and transcriptional regulator
      NOTCH1 cause a spectrum of developmental aortic valve anomalies and severe
      valve calcification in non-syndromic autosomal-dominant human pedigrees.
    explanation: >-
      Establishes NOTCH1 as causal for both the developmental valve anomaly and
      the later severe calcification in human pedigrees.
  - reference: PMID:16025100
    reference_title: "Mutations in NOTCH1 cause aortic valve disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence increases with age, and it is often associated with a
      bicuspid aortic valve present in 1-2% of the population.
    explanation: >-
      Supports the population frequency of the bicuspid substrate stated here.
  downstream:
  - target: Valve Endothelial Injury and Subendothelial Lipoprotein Retention
    causal_link_type: DIRECT
    description: >-
      Abnormal leaflet geometry concentrates mechanical and shear stress,
      accelerating endothelial injury.
  - target: Valve Interstitial Cell Osteogenic Transdifferentiation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      NOTCH1 haploinsufficiency de-represses RUNX2, lowering the threshold for
      osteogenic commitment independently of the flow abnormality.
- name: Valve Interstitial Cell Osteogenic Transdifferentiation
  biological_scale: CELLULAR
  description: >
    The pivot of the disease. Resident valve interstitial cells - fibroblast-like
    cells of the leaflet - switch to an osteoblast-like transcriptional program.
    Calcified human valves show increased expression of osteopontin, bone
    sialoprotein, osteocalcin, and the osteoblast master transcription factor
    RUNX2/Cbfa1 relative to normal valves. This is the step that separates
    calcific aortic valve disease from atherosclerosis: the tissue does not merely
    accumulate lipid and mineral debris, it executes a bone-formation program.
    NOTCH1 signaling normally represses RUNX2, which is why NOTCH1 loss both
    malforms and calcifies the valve.
  cell_types:
  - preferred_term: valve interstitial cell
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: osteoblast-like valve interstitial cell
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: osteoblast differentiation
    term:
      id: GO:0001649
      label: osteoblast differentiation
    modifier: INCREASED
  genes:
  - preferred_term: RUNX2
    term:
      id: hgnc:10472
      label: RUNX2
  evidence:
  - reference: PMID:12719282
    reference_title: "Human aortic valve calcification is associated with an osteoblast phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Reverse transcriptase-polymerase chain reaction revealed increased mRNA
      levels of osteopontin, bone sialoprotein, osteocalcin, and Cbfa1 in the
      calcified valves.
    explanation: >-
      Provides the direct molecular evidence for an osteoblast transcriptional
      program in human calcified valves compared with normal valves.
  - reference: PMID:12719282
    reference_title: "Human aortic valve calcification is associated with an osteoblast phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings support the concept that aortic valve calcification is not a
      random degenerative process but an active regulated process associated with
      an osteoblast-like phenotype.
    explanation: >-
      States the reframing this node encodes - an actively regulated osteogenic
      process rather than passive degeneration.
  - reference: PMID:16025100
    reference_title: "Mutations in NOTCH1 cause aortic valve disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Notch1 repressed the activity of Runx2, a central transcriptional regulator
      of osteoblast cell fate.
    explanation: >-
      Supplies the molecular mechanism linking NOTCH1 loss to de-repression of
      the osteogenic program. Evidence source is IN_VITRO because the repression
      was demonstrated in cell-based transcriptional assays.
  downstream:
  - target: Valvular Calcification and Leaflet Mineralization
    causal_link_type: DIRECT
    description: >-
      The osteoblast-like program deposits mineral within the leaflet.
    hypothesis_groups:
    - osteogenic_autonomy
- name: Valvular Calcification and Leaflet Mineralization
  biological_scale: TISSUE
  description: >
    Calcium-phosphate mineral is laid down within the leaflet with the
    ultrastructure and composition of bone - hydroxyapatite, elemental calcium
    phosphate on energy-dispersive spectroscopy, mineralization borders on von
    Kossa staining. Mineralization stiffens the leaflet and further increases
    local mechanical stress, so the lesion is self-reinforcing. The extent of
    valvular calcification, not the patient's age, sex, or coronary or metabolic
    risk factors, is the independent predictor of clinical outcome in
    asymptomatic disease.
  locations:
  - preferred_term: aortic valve
    term:
      id: UBERON:0002137
      label: aortic valve
  biological_processes:
  - preferred_term: bone mineralization
    term:
      id: GO:0030282
      label: bone mineralization
    modifier: INCREASED
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:12719282
    reference_title: "Human aortic valve calcification is associated with an osteoblast phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Special stains for hydroxyapatite and CaPO4 were positive in calcification
      margins. Electron microscopy identified mineralization, whereas
      energy-dispersive spectroscopy confirmed the presence of elemental CaPO4.
    explanation: >-
      Confirms that the deposited mineral is bone-type calcium phosphate rather
      than nonspecific debris.
  - reference: PMID:10965007
    reference_title: "Predictors of outcome in severe, asymptomatic aortic stenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      According to multivariate analysis, only the extent of aortic-valve
      calcification was an independent predictor of outcome, whereas age, sex,
      and the presence or absence of coronary artery disease, hypertension,
      diabetes, and hypercholesterolemia were not.
    explanation: >-
      Establishes leaflet calcification as the independent outcome determinant,
      and by exclusion shows that atherosclerotic risk factors are not.
  downstream:
  - target: Progressive Left Ventricular Outflow Obstruction
    causal_link_type: DIRECT
    description: >-
      Leaflet stiffening restricts systolic excursion and narrows the effective
      orifice area.
  - target: Valve Interstitial Cell Osteogenic Transdifferentiation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Mineral deposition raises local leaflet stiffness and mechanical strain,
      which further promotes osteogenic commitment - the feed-forward loop that
      makes established disease self-sustaining.
    hypothesis_groups:
    - osteogenic_autonomy
- name: Progressive Left Ventricular Outflow Obstruction
  biological_scale: TISSUE
  description: >
    The stiffened, mineralized valve narrows the outflow orifice, raising
    transvalvular velocity and the systolic pressure gradient the ventricle must
    generate. Progression is not uniform: the rate of increase in aortic-jet
    velocity varies widely between patients and is itself prognostic, separating
    those who will have events within a year or two from those who will not.
    This is why the disease is staged by progression rate as well as by severity.
  locations:
  - preferred_term: aortic valve
    term:
      id: UBERON:0002137
      label: aortic valve
  evidence:
  - reference: PMID:10965007
    reference_title: "Predictors of outcome in severe, asymptomatic aortic stenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The rate of progression of stenosis, as reflected by the aortic-jet
      velocity, was significantly higher in patients who had cardiac events
    explanation: >-
      Supports both progressive obstruction and the prognostic weight of its
      rate rather than its instantaneous severity.
  downstream:
  - target: Left Ventricular Pressure Overload and Concentric Hypertrophy
    causal_link_type: DIRECT
    description: >-
      A sustained systolic pressure gradient is the afterload stimulus for
      hypertrophic remodeling.
- name: Left Ventricular Pressure Overload and Concentric Hypertrophy
  biological_scale: TISSUE
  description: >
    The ventricle compensates for the fixed outflow obstruction by concentric
    hypertrophy, normalizing wall stress at the cost of a thicker, stiffer,
    less compliant chamber with a higher oxygen demand and a compressed
    subendocardial perfusion reserve. Hypertrophy is adaptive in the short term
    and the substrate for decompensation in the long term. Angina in aortic
    stenosis frequently occurs with unobstructed epicardial coronary arteries,
    reflecting this supply-demand mismatch rather than coexisting coronary
    disease.
  locations:
  - preferred_term: heart left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:28017384
    reference_title: "Myocardial Fibrosis and Cardiac Decompensation in Aortic Stenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progressive myocardial fibrosis drives the transition from hypertrophy to
      heart failure in aortic stenosis.
    explanation: >-
      Places hypertrophy as the compensated stage preceding the fibrotic
      transition modeled downstream.
  downstream:
  - target: Myocardial Interstitial and Replacement Fibrosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Sustained pressure overload and the resulting myocardial injury drive
      expansion of the extracellular compartment and focal replacement fibrosis.
- name: Myocardial Interstitial and Replacement Fibrosis
  biological_scale: TISSUE
  description: >
    Pressure-overloaded myocardium accumulates two distinguishable kinds of
    fibrosis. Diffuse interstitial fibrosis expands the myocardial extracellular
    volume and is at least partly reversible after the load is relieved.
    Replacement fibrosis - focal midwall scar following cardiomyocyte death,
    detected as late gadolinium enhancement - is not. Patients sort into a
    stepwise mortality gradient across normal myocardium, extracellular
    expansion, and replacement fibrosis, and in asymptomatic severe stenosis
    midwall fibrosis burden carries measurable additional risk. This is the
    node at which the disease stops being about the valve.
  locations:
  - preferred_term: heart left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  cell_types:
  - preferred_term: cardiac fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  evidence:
  - reference: PMID:28017384
    reference_title: "Myocardial Fibrosis and Cardiac Decompensation in Aortic Stenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diffuse fibrosis is associated with extracellular volume expansion that is
      detectable by T1 mapping, whereas late gadolinium enhancement (LGE) detects
      replacement fibrosis.
    explanation: >-
      Establishes the two-compartment distinction between diffuse interstitial
      and focal replacement fibrosis that this node asserts.
  - reference: PMID:28017384
    reference_title: "Myocardial Fibrosis and Cardiac Decompensation in Aortic Stenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      this categorization was of prognostic value with stepwise increases in

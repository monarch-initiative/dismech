      Disease data.
  - reference: PMID:42129826
    reference_title: "Global, regional, and national burden of non-rheumatic calcific aortic valve disease from 1990 to 2021, with projections of incidence to 2050: a systematic analysis of the global burden of disease study 2021 and Mendelian randomization analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aging and population growth drove the increase in DALYs, while body mass
      index was identified as a causal risk factor.
    explanation: >-
      Attributes the rising burden to demography and identifies body mass index
      as causal by Mendelian randomization.
- name: Event-free survival in asymptomatic severe aortic stenosis
  description: >
    Event-free survival in prospectively followed asymptomatic severe stenosis
    falls steeply, and the extent of valvular calcification stratifies it
    sharply.
  evidence:
  - reference: PMID:10965007
    reference_title: "Predictors of outcome in severe, asymptomatic aortic stenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Event-free survival for patients with no or mild valvular calcification was
      92+/-5 percent at one year
    explanation: >-
      Quantifies outcome in the low-calcification stratum of a prospective
      asymptomatic cohort.
genetic:
- name: LPA
  gene_term:
    preferred_term: LPA
    term:
      id: hgnc:6667
      label: LPA
  relationship_type: SUSCEPTIBILITY
  notes: >
    Common variation at the LPA locus, acting through circulating lipoprotein(a)
    concentration, is associated with aortic valve calcification and with
    incident clinical aortic stenosis across multiple ancestries.
  evidence:
  - reference: PMID:23388002
    reference_title: "Genetic associations with valvular calcification and aortic stenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One SNP in the lipoprotein(a) (LPA) locus (rs10455872) reached genomewide
      significance for the presence of aortic-valve calcification
    explanation: >-
      Genome-wide significant association of the LPA locus with aortic valve
      calcification.
- name: NOTCH1
  gene_term:
    preferred_term: NOTCH1
    term:
      id: hgnc:7881
      label: NOTCH1
  relationship_type: CAUSATIVE
  notes: >
    Loss-of-function mutations in NOTCH1 cause autosomal-dominant aortic valve
    disease combining developmental leaflet anomalies with severe calcification,
    mechanistically through de-repression of RUNX2.
  evidence:
  - reference: PMID:16025100
    reference_title: "Mutations in NOTCH1 cause aortic valve disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mutations in the signalling and transcriptional regulator NOTCH1 cause a
      spectrum of developmental aortic valve anomalies and severe valve
      calcification in non-syndromic autosomal-dominant human pedigrees.
    explanation: >-
      Establishes NOTCH1 as a causal gene for human aortic valve disease.

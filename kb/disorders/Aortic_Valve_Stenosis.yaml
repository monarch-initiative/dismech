  - reference: PMID:41984459
    reference_title: "Myocardial Fibrosis and Early Intervention in Asymptomatic Patients With Severe Aortic Stenosis: Insights From the EVOLVED Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in asymptomatic patients with severe aortic stenosis, higher midwall

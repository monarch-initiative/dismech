mechanistic_hypotheses:
- hypothesis_group_id: osteogenic_autonomy
  hypothesis_label: Autonomous osteogenic program
  status: CANONICAL
  description: >
    Once valve interstitial cells commit to an osteoblast-like program, leaflet
    mineralization becomes an actively regulated, self-reinforcing process that
    no longer depends on continued lipoprotein exposure. Deposited mineral raises
    local leaflet stiffness and strain, which further promotes osteogenic
    commitment. The prediction is that interventions upstream of the commitment
    step - lipid lowering in particular - will fail to modify progression of
    established disease, which is what randomized trials found.
  evidence:
  - reference: PMID:12719282
    reference_title: "Human aortic valve calcification is associated with an osteoblast phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      aortic valve calcification is not a random degenerative process but an
      active regulated process associated with an osteoblast-like phenotype.
    explanation: >-
      Supplies the core claim of an actively regulated osteogenic program in
      human calcified valves.
- hypothesis_group_id: lipid_driven_progression
  hypothesis_label: Lipid-driven atherosclerosis-like progression
  status: DEPRECATED
  description: >
    The historical model held that calcific aortic stenosis is an
    atherosclerosis-like, lipid-driven process throughout its course, predicting
    that LDL lowering would slow or halt valve progression. Two randomized trials
    tested this directly and refuted it for established disease. The model is
    retained here rather than deleted because its failure is what motivates the
    osteogenic-autonomy account, and because it remains partially correct about
    initiation - the LPA genetic evidence shows a lipoprotein species is causal
    at the start.
  evidence:
  - reference: PMID:15944423
    reference_title: "A randomized trial of intensive lipid-lowering therapy in calcific aortic stenosis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intensive lipid-lowering therapy does not halt the progression of calcific
      aortic stenosis or induce its regression.
    explanation: >-
      Directly refutes the prediction that lipid lowering modifies progression of
      established calcific aortic stenosis.
  - reference: PMID:18765433
    reference_title: "Intensive lipid lowering with simvastatin and ezetimibe in aortic stenosis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Simvastatin and ezetimibe did not reduce the composite outcome of combined
      aortic-valve events and ischemic events in patients with aortic stenosis.
    explanation: >-
      A second randomized trial refuting a lipid-lowering effect on aortic valve
      events.
- hypothesis_group_id: lipoprotein_a_specific_pathway
  hypothesis_label: Lipoprotein(a)-specific causal pathway
  status: EMERGING
  description: >
    Lp(a), rather than LDL cholesterol generally, may be the lipoprotein species
    that matters for the valve - plausibly through the oxidized phospholipids it
    carries. This reconciles the causal genetic association at LPA with the
    failure of statin and ezetimibe therapy, neither of which meaningfully lowers
    Lp(a). The prediction is that selective Lp(a) lowering would slow valve
    disease where LDL lowering did not; this has not yet been tested against a
    valve endpoint, so the hypothesis is genuinely open rather than merely
    unfashionable.
  evidence:
  - reference: PMID:23388002
    reference_title: "Genetic associations with valvular calcification and aortic stenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One SNP in the lipoprotein(a) (LPA) locus (rs10455872) reached genomewide
      significance for the presence of aortic-valve calcification
    explanation: >-
      Supplies the genome-wide genetic anchor that singles out the Lp(a) locus
      among lipid loci.
  - reference: PMID:23388002
    reference_title: "Genetic associations with valvular calcification and aortic stenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Currently, there are no treatments that prevent or slow the progression of
      valve disease.
    explanation: >-
      Records the therapeutic vacuum this hypothesis proposes to fill, stated by
      the same authors who established the genetic association.
treatments:
- name: Surgical Aortic Valve Replacement
  description: >
    Open surgical excision of the diseased valve and implantation of a mechanical
    or bioprosthetic replacement. Relieves the outflow obstruction and permits
    regression of hypertrophy and of diffuse interstitial fibrosis, but does not
    reverse established replacement fibrosis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: aortic valve replacement
    term:
      id: NCIT:C50815
      label: Aortic Valve Replacement
  target_mechanisms:
  - target: Progressive Left Ventricular Outflow Obstruction
    treatment_effect: INHIBITS
    description: >-
      Replacing the leaflets eliminates the fixed obstruction and the pressure
      gradient driving ventricular remodeling.
  evidence:
  - reference: PMID:10965007
    reference_title: "Predictors of outcome in severe, asymptomatic aortic stenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These patients should be considered for early valve replacement rather than
      have surgery delayed until symptoms develop.
    explanation: >-
      Supports valve replacement as the definitive intervention and identifies
      the high-risk subgroup in whom earlier operation was recommended.
- name: Transcatheter Aortic Valve Replacement
  description: >
    Catheter-delivered implantation of a bioprosthetic valve within the diseased
    native valve, avoiding sternotomy and cardiopulmonary bypass. Now used across
    the surgical risk spectrum.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: transcatheter aortic valve replacement
    term:
      id: NCIT:C158018
      label: Transcatheter Aortic Valve Replacement
  target_mechanisms:
  - target: Progressive Left Ventricular Outflow Obstruction
    treatment_effect: INHIBITS
    description: >-
      The implanted prosthesis displaces the calcified native leaflets and
      restores an unobstructed outflow orifice.
  evidence:
  - reference: PMID:41984459
    reference_title: "Myocardial Fibrosis and Early Intervention in Asymptomatic Patients With Severe Aortic Stenosis: Insights From the EVOLVED Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early intervention with transcatheter or surgical aortic valve replacement.
    explanation: >-
      Identifies transcatheter replacement alongside surgery as the intervention
      randomized in contemporary trials.
- name: Lipid-Lowering Therapy
  description: >
    Statin and ezetimibe therapy, historically expected to slow valve progression
    on the atherosclerosis analogy. Randomized trials refute this for the valve.
    Recorded here because the negative result is mechanistically informative
    rather than merely absent: in SEAS the same intervention in the same patients
    reduced ischemic events while leaving valve events untouched, dissociating the
    arterial from the valvular disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Valve Endothelial Injury and Subendothelial Lipoprotein Retention
    treatment_effect: INHIBITS
    description: >-
      Intended to reduce the retainable apoB-lipoprotein pool at the initiating
      lesion. The intended effect on valve progression was not observed.
  evidence:
  - reference: PMID:15944423
    reference_title: "A randomized trial of intensive lipid-lowering therapy in calcific aortic stenosis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intensive lipid-lowering therapy does not halt the progression of calcific
      aortic stenosis or induce its regression.
    explanation: >-
      Refutes a disease-modifying effect of lipid lowering on the valve lesion.
  - reference: PMID:18765433
    reference_title: "Intensive lipid lowering with simvastatin and ezetimibe in aortic stenosis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Simvastatin and ezetimibe did not reduce the composite outcome of combined
      aortic-valve events and ischemic events in patients with aortic stenosis.
    explanation: >-
      Second randomized refutation, on the primary composite endpoint.
  - reference: PMID:18765433
    reference_title: "Intensive lipid lowering with simvastatin and ezetimibe in aortic stenosis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aortic-valve replacement was performed in 267 patients (28.3%) in the
      simvastatin-ezetimibe group and in 278 patients (29.9%) in the placebo
      group (hazard ratio, 1.00; 95%
    explanation: >-
      The valve-specific null quantified: a hazard ratio of exactly 1.00 for
      aortic-valve replacement.
  - reference: PMID:18765433
    reference_title: "Intensive lipid lowering with simvastatin and ezetimibe in aortic stenosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Such therapy reduced the incidence of ischemic cardiovascular events but
      not events related to aortic-valve stenosis.
    explanation: >-
      The dissociation itself: the same drug in the same patients modified the
      arterial disease and not the valve disease. This supports the mechanistic
      separation of the two, not the treatment.
discussions:
- discussion_id: as_fibrosis_prognostic_vs_treatment_selection
  kind: CONTROVERSY
  attaches_to:
  - "pathophysiology#Myocardial Interstitial and Replacement Fibrosis"
  prompt: >
    Does myocardial fibrosis burden identify asymptomatic patients who benefit
    from early valve replacement, or is it only a marker of risk?
  rationale: >
    The two questions are routinely conflated. Fibrosis burden is robustly
    prognostic - it predicts death and unplanned hospitalization in asymptomatic
    severe stenosis, and it grades mortality stepwise in symptomatic cohorts. It
    does not follow that intervening earlier in high-fibrosis patients helps.
    EVOLVED tested exactly this and found no interaction between fibrosis burden
    and treatment effect for the primary endpoint, although the
    hospitalization component did favor early intervention in the high-fibrosis
    group. A prognostic marker becomes a treatment-selection marker only when an
    interaction is demonstrated, and that demonstration has not been made.
  evidence:
  - reference: PMID:41984459
    reference_title: "Myocardial Fibrosis and Early Intervention in Asymptomatic Patients With Severe Aortic Stenosis: Insights From the EVOLVED Randomized Clinical Trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was no demonstrable heterogeneity by the degree of midwall fibrosis
      for the treatment effects of early surgical or transcatheter aortic valve
      replacement compared to clinical surveillance.
    explanation: >-
      Directly refutes the treatment-selection interpretation of fibrosis burden
      on the trial's primary analysis.
  - reference: PMID:41984459
    reference_title: "Myocardial Fibrosis and Early Intervention in Asymptomatic Patients With Severe Aortic Stenosis: Insights From the EVOLVED Randomized Clinical Trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      unplanned aortic stenosis-related hospitalization in 4 (7%) and 13 (25%)
      patients respectively
    explanation: >-
      The component result that keeps the question open: hospitalizations
      differed substantially in the high-fibrosis group even though the primary
      endpoint showed no interaction.
- discussion_id: as_osteogenic_commitment_reversibility
  kind: KNOWLEDGE_GAP
  attaches_to:
  - "pathophysiology#Valve Interstitial Cell Osteogenic Transdifferentiation"
  prompt: >
    Is the osteogenic commitment of valve interstitial cells reversible in vivo,
    and if so before what point?
  rationale: >
    The whole therapeutic logic of this disease turns on this question. If
    commitment is a switch, the only useful window for medical therapy is before
    it is thrown, and every trial that enrolled established stenosis was
    destined to be negative for reasons unrelated to the drug. If it is a
    gradient sustained by ongoing signaling, established disease remains
    addressable. No human study has tested reversal of the osteogenic program,
    and the negative lipid-lowering trials cannot distinguish the two
    possibilities because they did not target the program itself.
  proposed_experiments:
  - experiment_id: exp_as_osteogenic_activity_reversal
    name: Serial molecular imaging of valvular osteogenic activity during and after targeted intervention
    description: >-
      Track valvular osteogenic activity by serial molecular imaging in patients
      receiving, then withdrawing, a targeted anti-osteogenic intervention. If
      activity falls with treatment and returns only slowly, commitment is
      signal-dependent and established disease is addressable; if activity is
      unchanged throughout, commitment is autonomous.
  - experiment_id: exp_as_lpa_lowering_valve_endpoint
    name: Randomized selective Lp(a) lowering with a valve-calcification endpoint in early disease
    description: >-
      Randomize patients with early calcific aortic valve disease to selective
      Lp(a) lowering versus placebo with progression of valve calcification as
      the primary endpoint. Intervening upstream of osteogenic commitment
      separates the initiation hypothesis from the autonomy hypothesis in a way
      the completed statin trials could not, because those enrolled established
      stenosis.
- discussion_id: as_valve_interstitial_cell_ontology_gap
  kind: OPEN_QUESTION
  attaches_to:
  - "pathophysiology#Valve Interstitial Cell Osteogenic Transdifferentiation"
  prompt: >
    Should the valve interstitial cell have its own Cell Ontology term?
  rationale: >
    The valve interstitial cell is the central effector cell of the commonest
    valve disease in the developed world, has a distinctive
    quiescent-to-activated-to-osteogenic phenotypic repertoire, and is not
    adequately
    represented by CL:0000057 (fibroblast), which is what this entry uses. The
    osteoblast-like state is likewise curated here as CL:0000062 (osteoblast),
    which asserts more lineage identity than the literature supports - the
    sources describe an acquired phenotype, not a lineage conversion. Both
    bindings are approximations recorded openly rather than silently.
inheritance:
- name: Autosomal dominant NOTCH1-related aortic valve disease
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Scoped deliberately to the NOTCH1 arm. Calcific aortic valve disease as a
    whole is an acquired, non-Mendelian condition of ageing, and no inheritance
    mode applies to it. But NOTCH1 loss of function segregates in
    autosomal-dominant pedigrees producing developmental leaflet anomalies with
    severe calcification, so that specific route into the disease does have a
    Mendelian mode. Recording it without this scoping would misdescribe the
    disease; omitting it entirely would lose the only inherited form.
  evidence:
  - reference: PMID:16025100
    reference_title: "Mutations in NOTCH1 cause aortic valve disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we show that mutations in the signalling and transcriptional regulator
      NOTCH1 cause a spectrum of developmental aortic valve anomalies and severe
      valve calcification in non-syndromic autosomal-dominant human pedigrees.
    explanation: >-
      States the autosomal-dominant, non-syndromic pedigree transmission that
      this block records, and confines it to the NOTCH1 arm.
diagnosis:
- name: Transthoracic Echocardiography
  description: >
    The diagnostic and staging modality. Echocardiography establishes leaflet
    calcification and restriction and quantifies severity by transvalvular peak
    velocity, mean gradient, and effective orifice area. It is also what defines
    disease progression in this entry, since the prognostic rate-of-change data
    are expressed as change in aortic-jet velocity per year.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:10965007
    reference_title: "Predictors of outcome in severe, asymptomatic aortic stenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The rate of progression of stenosis, as reflected by the aortic-jet
      velocity, was significantly higher in patients who had cardiac events
    explanation: >-
      Documents the echocardiographic measurement (aortic-jet velocity) used to
      stage severity and track progression, and its prognostic weight.
- name: Exercise Stress Testing
  description: >
    Used to unmask symptoms in patients who report none, which matters because
    the whole management algorithm pivots on symptom status and patients
    routinely under-report by limiting their own activity. In the EARLY TAVR
    screening cohort, standardized treadmill testing of apparently asymptomatic
    patients with severe stenosis was positive in 15.2% - meaning roughly one in
    seven "asymptomatic" patients was not. It is safe in this population and
    nonetheless infrequently used.
  diagnosis_term:
    preferred_term: exercise cardiac stress test
    term:
      id: NCIT:C168192
      label: Exercise Cardiac Stress Test
  evidence:
  - reference: PMID:42485012
    reference_title: "Treadmill Stress Test in Patients With Asymptomatic Severe Aortic Stenosis: A Prespecified Registry-Based Follow-Up of the EARLY TAVR Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with asymptomatic severe aortic stenosis (AS), exercise stress
      testing is recommended to unmask symptoms and guide the timing of
      intervention, yet it is infrequently used in clinical practice.
    explanation: >-
      States both the indication and the practice gap this entry records.
  - reference: PMID:42485012
    reference_title: "Treadmill Stress Test in Patients With Asymptomatic Severe Aortic Stenosis: A Prespecified Registry-Based Follow-Up of the EARLY TAVR Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of these, 816 (84.8%) had a normal TST result and 146 (15.2%) had a
      positive TST result.
    explanation: >-
      Quantifies how often apparently asymptomatic severe stenosis is unmasked
      by testing, which is what makes symptom status a measured rather than a
      reported variable.
  - reference: PMID:42485012
    reference_title: "Treadmill Stress Test in Patients With Asymptomatic Severe Aortic Stenosis: A Prespecified Registry-Based Follow-Up of the EARLY TAVR Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TST was found to be safe, with no reported deaths, syncope, or
      cardioversions.
    explanation: >-
      Addresses the historical safety concern about exercising patients with
      severe outflow obstruction.
- name: Cardiac Magnetic Resonance with Late Gadolinium Enhancement
  description: >
    Not needed to diagnose the valve lesion, but the only way to see the
    ventricular disease that determines survival. T1 mapping quantifies
    extracellular volume expansion (diffuse interstitial fibrosis) and late
    gadolinium enhancement detects focal replacement fibrosis; the two together
    stratify mortality stepwise, and midwall fibrosis burden is prognostic even
    in patients whose valve does not yet meet intervention criteria.
  diagnosis_term:
    preferred_term: cardiac magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:28017384
    reference_title: "Myocardial Fibrosis and Cardiac Decompensation in Aortic Stenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diffuse fibrosis is associated with extracellular volume expansion that is
      detectable by T1 mapping, whereas late gadolinium enhancement (LGE) detects
      replacement fibrosis.
    explanation: >-
      Establishes the two cardiac magnetic resonance measurements and what each
      detects.
  - reference: PMID:28017384
    reference_title: "Myocardial Fibrosis and Cardiac Decompensation in Aortic Stenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CMR detects ventricular decompensation in aortic stenosis through the
      identification of myocardial extracellular expansion and replacement
      fibrosis.
    explanation: >-
      States the diagnostic claim: cardiac magnetic resonance is how ventricular
      decompensation is detected in this disease.

clinical_trials:
- name: NCT03042104
  phase: NOT_APPLICABLE
  status: ACTIVE_NOT_RECRUITING
  description: EARLY TAVR randomized 901 selected adults aged ≥65 years with transfemoral-compatible asymptomatic severe stenosis to early balloon-expandable TAVR or surveillance. The primary death/stroke/unplanned cardiovascular hospitalization composite was lower (122/455 versus 202/446; HR 0.50), without an established individual mortality or stroke benefit. The hospitalization definition included early surveillance-arm conversion within six months; 87% eventually underwent replacement. The open-label trial had unblinded event adjudication and predominantly White participants; longer follow-up continues.
  notes: Status and phase checked on 2026-09-21. Published analysis size is distinguished from registry planned enrollment and subsequent extension.
  evidence:
  - reference: clinicaltrials:NCT03042104
    reference_title: Evaluation of Transcatheter Aortic Valve Replacement Compared to Surveillance for Patients With Asymptomatic Severe Aortic Stenosis
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: This study will evaluate the safety and effectiveness of the Edwards SAPIEN 3/SAPIEN 3 Ultra Transcatheter Heart Valve (THV) compared with clinical surveillance (CS) in asymptomatic patients with severe, calcific aortic stenosis.
    explanation: Registry study identity/design; status and phase independently checked through the live ClinicalTrials.gov API on 2026-09-21.

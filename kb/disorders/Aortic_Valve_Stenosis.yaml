    snippet: The primary end point occurred in 20 of 113 patients (18%) in the early intervention group and 25 of 111 patients (23%) in the guideline-directed conservative management group (hazard ratio, 0.79 [95% CI, 0.44-1.43]; P = .44; between-group difference, -4.82% [95% CI, -15.31% to 5.66%]).
    explanation: The primary comparison was nonsignificant with a wide confidence interval, not proof of equivalence.

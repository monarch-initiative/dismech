- name: Post-replacement surveillance and rehabilitation
  description: Obtain a baseline echocardiogram within the first weeks after replacement and continue annual clinical/echocardiographic review of bioprostheses, with earlier evaluation for symptoms or suspected dysfunction. Rehabilitation may improve functional recovery. Mechanical prostheses require lifelong anticoagulation; the antithrombotic regimen for other prostheses depends on valve type and concurrent indications.
  evidence:
  - reference: url:https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    reference_title: https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: After valve intervention, an early echocardiographic examination within the first weeks after valve replacement is recommended to document base- line prosthetic valve function.
    explanation: Post-intervention baseline assessment.
  - reference: url:https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    reference_title: https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Cardiological evaluations and echocardio- graphic examinations are recommended annually in patients with a bioprosthesis, and whenever changes in clinical symptoms or signs sug- gestive of valve dysfunction are noted.
    explanation: Longitudinal prosthesis surveillance.
- name: Palliative care when intervention offers insufficient benefit
  description: For advanced valve disease unsuitable for surgical or transcatheter treatment, coordinate symptom-directed heart-failure treatment and multidisciplinary palliative care with the patient and family. The decision is based on expected benefit and goals, rather than age alone.
  evidence:
  - reference: url:https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    reference_title: https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: In some patients with advanced VHD not qualifying for surgical or transcatheter therapies, medical HF treatment remains the only, and sometimes best, available option.
    explanation: Guideline care for advanced disease without a feasible beneficial valve intervention.
- name: Secondary rheumatic-fever prevention
  description: Patients with established rheumatic heart disease may require long-term penicillin prophylaxis to prevent recurrent rheumatic fever. This is specific to the rheumatic subtype and does not treat calcific stenosis or mechanically reopen fused commissures.
  evidence:
  - reference: url:https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    reference_title: https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: In patients with established RHD, secondary long-term prophylaxis with benzathine benzyl penicillin 1.2 million international units (IU) every 3–4 weeks over 10 years is recom- mended to prevent recurrent episodes, especially in children and ado- lescents.
    explanation: Etiology-specific recurrent-rheumatic-fever prevention.
  treatment_term:
    preferred_term: Pharmacotherapy

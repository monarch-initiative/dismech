- name: Timing intervention in symptomatic severe disease
  description: Intervention is recommended for symptomatic severe high-gradient stenosis, and for confirmed severe low-flow low-gradient disease with reduced ejection fraction. With preserved ejection fraction and low flow/gradient, severity confirmation and exclusion of competing explanations are essential. Expected benefit, life expectancy and procedural feasibility determine whether intervention is appropriate.
  evidence:
  - reference: url:https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    reference_title: https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Intervention is recommended in symptomatic patients with severe, high-gradient AS
    explanation: Class I, level B recommendation; the complete clinical and hemodynamic context is required.
  treatment_term: *id018
- name: Early intervention in selected asymptomatic severe disease
  description: The 2025 guideline supports intervention as an alternative to close surveillance in asymptomatic severe high-gradient stenosis with ejection fraction ≥50% and low procedural risk (Class IIa, A). Ejection fraction <50% without another cause is a Class I indication. Very severe hemodynamics, rapid progression with heavy calcification, markedly elevated natriuretic peptides or abnormal exercise blood pressure strengthen selection. Trials differ in age, valve anatomy, fibrosis enrichment, procedures and outcome definitions; there is no uniform mortality benefit across all asymptomatic populations.
  evidence:
  - reference: url:https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    reference_title: https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Intervention should be considered in asymptomatic patients (confirmed by a normal exercise test, if feasible) with severe, high-gradient AS and LVEF ≥50%, as an alternative to close active surveillance, if the procedural risk is low. IIa A
    explanation: The 2025 conditional early-intervention recommendation, not a mandate to replace every asymptomatic valve.
  - reference: url:https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    reference_title: https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Intervention is recommended in asymptomatic patients with severe AS and LVEF <50% without another cause.
    explanation: Class I, level B ventricular-function indication.
  treatment_term: *id018
- name: Active surveillance and symptom education
  description: For patients managed without immediate intervention, educate patients and caregivers to report symptoms promptly and reassess severity and ventricular function. The 2025 guideline recommends at least six-monthly follow-up for asymptomatic severe disease, annual reassessment for moderate degenerative stenosis, and potentially two- to three-year intervals for younger patients with mild disease and little leaflet calcium. New symptoms prompt earlier reassessment.
  evidence:
  - reference: url:https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    reference_title: https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Asymptomatic pa- tients with severe AS should be followed up at least every 6 months to allow detection of early symptoms
    explanation: Regular clinical and echocardiographic surveillance in the guideline.
- name: Balloon aortic valvotomy as a bridge
  description: In the adult severe-stenosis guideline, balloon valvotomy may be considered as a temporary bridge to SAVR or TAVI in hemodynamic instability or urgent high-risk noncardiac surgery (Class IIb, C). Benefits are limited and severe regurgitation is a risk; it is not a durable substitute for replacement in calcific adult disease. Pediatric congenital-valve decisions require their own clinical context.
  evidence:
  - reference: url:https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    reference_title: https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Balloon aortic valvotomy may be considered as a bridge to SAVR or TAVI in haemodynamically unstable patients, and (if feasible) in those with severe AS who require urgent high-risk NCS.
    explanation: Explicit bridge indication in the adult 2025 guideline.

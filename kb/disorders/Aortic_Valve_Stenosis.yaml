  description: T1 mapping estimates extracellular expansion and LGE detects focal scar patterns. These complement valve assessment; extracellular volume is not specific for collagen, and the 2017 cohort had insufficient deaths for adjusted survival analysis. Fibrosis-guided early intervention did not significantly improve the EVOLVED primary composite, so CMR fibrosis alone is not a validated universal intervention trigger.

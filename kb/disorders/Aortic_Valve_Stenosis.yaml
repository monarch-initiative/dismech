- name: Transcatheter aortic valve implantation
  description: The 2025 ESC/EACTS guideline recommends TAVI for patients aged at least 70 years with tricuspid stenosis and suitable anatomy. Transfemoral access, coronary obstruction risk, annular anatomy and lifetime reintervention planning matter. Other candidates require individual Heart Team assessment; TAVI for bicuspid stenosis is a weaker recommendation in selected patients at increased surgical risk. Vascular injury, paravalvular leak and pacemaker risk differ from surgical risks.
  evidence:
  - reference: url:https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    reference_title: https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: TAVI is recommended in patients ≥70 years of age with tricuspid AV stenosis, if the anatomy is suitable.
    explanation: Class I, level A in the 2025 adult guideline; this is not an age-only rule.
  - reference: url:https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf

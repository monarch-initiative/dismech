discussions:
- discussion_id: as_calcification_function_mediation
  prompt: Which processes mediate valve dysfunction in experimental anti-calcification interventions?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Aortic Leaflet Calcification
  - animal_models#Osteoprotegerin-treated Western-diet LA mouse
  - animal_models#Notch1-haploinsufficient mouse with Htr2b perturbation
  rationale: OPG reduces calcification and partly preserves older-mouse valve function without reducing fibrosis, lipids or superoxide. This coresponse does not isolate calcification as the mediator. Htr2b deletion improves hemodynamics without significant measured fibrosis or osteogenic-marker changes, while its tested antagonist regimen is negative. Cell-specific and temporally controlled perturbations with mechanical and tissue readouts are needed before assigning one necessary pathway.
  evidence:
  - reference: PMID:23762316
    reference_title: Osteoprotegerin inhibits aortic valve calcification and preserves valve function in hypercholesterolemic mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Thus, the association between attenuation of valve calcification and protection of aortic valve function by OPG may not necessarily indicate mechanistic linkage between the two findings.
    explanation: The authors explicitly distinguish associated intervention responses from demonstrated mediation.
  - *id023
- discussion_id: as_medical_modification
  prompt: Why have mechanistically motivated medical therapies not yet modified established valve disease in trials?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Valvular Lipid Accumulation
  - pathophysiology#Valvular Osteogenic Program
  - clinical_trials#NCT02132026
  rationale: Null statin-based trials in established stenosis do not prove that lipids are irrelevant to initiation or that osteogenic commitment makes the lesion autonomous. SALTIRE2 did not show imaging benefit from denosumab or alendronic acid in its mostly mild/moderate cohort despite lower bone-turnover markers. Its interventions, species context and disease timing differ from the OPG mouse experiment. Selective Lp(a) lowering remains under prospective evaluation; genetic evidence alone does not establish efficacy.
  evidence:
  - reference: PMID:15944423
    reference_title: A randomized trial of intensive lipid-lowering therapy in calcific aortic stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Intensive lipid-lowering therapy does not halt the progression of calcific aortic stenosis or induce its regression.
    explanation: Null tested regimen in established disease, not a test of every lipid mechanism.
  - reference: PMID:33913339
    reference_title: 'Effect of Denosumab or Alendronic Acid on the Progression of Aortic Stenosis: A Double-Blind Randomized Controlled Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: There were no differences in 24-month change in aortic valve calcium score between denosumab and placebo
    explanation: The randomized imaging comparison was negative within the tested population and detectable effect size.
  - *id002
- discussion_id: as_fibrosis_treatment_selection
  prompt: Does fibrosis burden identify patients who derive greater benefit from early intervention?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Diffuse Myocardial Fibrosis
  - pathophysiology#Replacement Myocardial Fibrosis
  - clinical_trials#NCT03094143
  rationale: 'The 2017 baseline CMR study associates extracellular expansion and LGE with clinical status but lacks enough deaths for multivariable mortality analysis and does not establish serial fibrosis transitions. EVOLVED did not significantly improve its primary outcome. The subsequent fibrosis-burden analysis is available here only as an abstract/repository duplicate: greater burden was associated with composite events and hospitalization, but no randomization-arm interaction was demonstrated. Prognostic association therefore does not establish a treatment-selection threshold or irreversible injury.'
  evidence:
  - reference: PMID:28017384
    reference_title: Myocardial Fibrosis and Cardiac Decompensation in Aortic Stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: There were insufficient deaths to perform multivariate analysis.
    explanation: Limits the original mortality comparison.
  - reference: PMID:41984459
    reference_title: 'Myocardial Fibrosis and Early Intervention in Asymptomatic Patients With Severe Aortic Stenosis: Insights From the EVOLVED Randomized Clinical Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: There were no interactions between randomization arm and the midwall fibrosis burden for the primary (P for interaction = .39) or secondary end points.
    explanation: The post hoc abstract does not demonstrate differential treatment benefit by fibrosis burden.
  - reference: PMID:39466640
    reference_title: 'Early Intervention in Patients With Asymptomatic Severe Aortic Stenosis and Myocardial Fibrosis: The EVOLVED Randomized Clinical Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The primary end point occurred in 20 of 113 patients (18%) in the early intervention group and 25 of 111 patients (23%) in the guideline-directed conservative management group (hazard ratio, 0.79 [95% CI, 0.44-1.43]; P = .44; between-group difference, -4.82% [95% CI, -15.31% to 5.66%]).
    explanation: The primary comparison was nonsignificant with a wide confidence interval, not proof of equivalence.
- discussion_id: as_gwas_candidates
  prompt: Which statistically nominated susceptibility genes are causal in valve cells?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#TWIST1
  - genetic#PALMD
  - genetic#NAV1
  rationale: European-ancestry GWAS, valve eQTL, colocalization and Mendelian randomization prioritize expression candidates, but selected surgical bulk tissue and instrumental-variable assumptions limit mechanistic inference. TWIST1 genotype-stratified RNA sequencing compared already severe-stenosis cases, rather than perturbing TWIST1 or measuring endothelial-to-mesenchymal conversion. Candidate genes require cell-specific functional validation; neither genetic overlap nor pathway enrichment proves a causal comorbidity.
  evidence:
  - reference: PMID:38494474
    reference_title: Integrative genomic analyses identify candidate causal genes for calcific aortic valve stenosis involving tissue-specific regulation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: After removing genes with a low probability for colocalization of the GWAS and eQTL signals (PP4 < 0.75, n = 20), with no MR instrument (n = 3) or with high heterogeneity of the instrument (n = 2), ten genes remained (PALMD, NAV1, PRRX1, ATP13A3, BCL10, TWIST1, RAD9A, NRBP1, FES and AFAP1).
    explanation: Statistical prioritization of ten expression candidates; no corresponding gene-rescue experiment is reported.
    directness: INDIRECT
biochemical:
- name: BNP and NT-proBNP
  notes: Natriuretic peptides can inform cardiac-stress and symptom assessment. Markedly elevated repeated values relative to age- and sex-adjusted normal ranges are one guideline risk feature; renal function, rhythm and other cardiac disease affect interpretation. They do not independently define valve severity.
  evidence:
  - reference: url:https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    reference_title: https://arrhythmiaclinic.org/wp-content/uploads/2025/08/2025-ESC-Guideline-Valvular-Heart-Disease.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Natriuretic peptides can be used to arbitrate the sources of symp- toms in patients with multiple potential causes and help to identify those with high-risk asymptomatic AS who may benefit from early intervention.
    explanation: Guideline synthesis supports adjunctive risk assessment, not a stand-alone diagnosis or a universally causal biomarker.
- name: von Willebrand factor multimer and collagen-binding abnormalities
  notes: Loss of large multimers and impaired collagen binding/high-shear platelet function occurred in a selected consecutive severe-AS cohort. The 67–92% range refers to different laboratory abnormalities, not the prevalence of gastrointestinal bleeding. Correction after replacement and recurrence with mismatch support a shear-related acquired syndrome.
  evidence:
  - *id016
- name: Lipoprotein(a)
  notes: A heritable exposure associated with valve calcium and clinical stenosis, rather than a stand-alone diagnostic marker. Genetic-instrument evidence does not establish a universal threshold, direct cellular mediator or treatment-response biomarker.
  evidence:
  - *id026
  - *id002
mechanistic_hypotheses:
- hypothesis_group_id: calcific_inflammatory_osteogenic_model
  hypothesis_label: Inflammatory and osteogenic contribution to calcific valve disease
  status: EMERGING
  description: Surface lesions, lipid accumulation, inflammatory cells and osteogenic markers support a proposed interacting disease process. Human cross-sectional histology does not establish a required temporal order, a single indispensable cytokine or a self-sustaining lipid-independent commitment switch.
  evidence:
  - reference: PMID:7519131
    reference_title: Characterization of the early lesion of 'degenerative' valvular aortic stenosis. Histological and immunohistochemical studies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: disruption of the basement membrane overlying the lesion.
    explanation: Cross-sectional autopsy histology documents a surface lesion; it does not establish the temporal initiating injury.
    directness: INDIRECT
  - reference: PMID:7519131
    reference_title: Characterization of the early lesion of 'degenerative' valvular aortic stenosis. Histological and immunohistochemical studies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: early lesions were characterized by the presence of an inflammatory infiltrate composed of non-foam cell and foam cell macrophages, occasional T cells, and rare alpha-actin-positive cells.
    explanation: Macrophages were also scattered in normal valves; the lesion-associated infiltrate is a quantitative and contextual change.
    directness: INDIRECT
  - *id003
- hypothesis_group_id: notch_runx2_restraint
  hypothesis_label: Reduced NOTCH-dependent RUNX2 restraint
  status: EMERGING
  description: Rare familial NOTCH1 disease and experimental Hrt–RUNX2 repression support a molecular route to calcification. Loss of this restraint in patient valve cells is inferred; penetrance and the complete developmental sequence remain unresolved.
  evidence:
  - *id027
  - *id001
- hypothesis_group_id: lipoprotein_a_specific_pathway
  hypothesis_label: Lipoprotein(a)-related valve disease susceptibility
  status: EMERGING
  description: Genetic associations and Mendelian randomization support a causal contribution under instrument assumptions. The biochemical route and benefit from selective lowering remain under investigation. Failure of statin-based regimens does not directly test selective Lp(a) lowering.
  evidence:
  - *id026
  - *id002

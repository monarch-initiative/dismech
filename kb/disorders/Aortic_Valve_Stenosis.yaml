- name: Notch1-haploinsufficient mouse with Htr2b perturbation
  species: Mouse
  genotype: Notch1+/− with Htr2b+/+, Htr2b+/− or Htr2b−/−; separate antagonist arm
  publication: PMID:33237915
  description: Complete Htr2b deletion improved valve hemodynamics on the Notch1-haploinsufficient high-cholesterol background. A separate antagonist regimen did not reproduce the improvement. The tissue mechanism remains unresolved.
  notes: Notch1-haploinsufficient mice received a 1% cholesterol diet from 2.5 to 6 months. The separate drug arm used SB204741 1 mg/kg/day from 4 to 6 months. Heterozygous Htr2b loss produced only nonsignificant improvement. Collagen density, leaflet thickness, alpha-SMA and Runx2 did not significantly change, and calcification was limited. Neither an antifibrotic nor an anticalcific mediator was established; left ventricular mass and ejection fraction were unchanged.

    explanation: The primary comparison was nonsignificant with a wide confidence interval, not proof of equivalence.
- name: NCT01161732
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: RECOVERY randomized 145 selected relatively young, low-risk patients with very severe stenosis, predominantly bicuspid valves, to early surgery or conservative care. At extended follow-up (overall median 12 years), operative/CV deaths were 2/73 versus 17/72; ten-year cumulative incidence was 1% versus 19%. Results support early surgery in this selected population, not all older severe-AS patients or transcatheter devices. Exercise testing was not routine, and few primary events limit precision.
  notes: Status and phase checked on 2026-09-21. Published analysis size is distinguished from registry planned enrollment and subsequent extension.
  evidence:
  - reference: clinicaltrials:NCT01161732
    reference_title: Randomized Comparison of Early Surgery Versus Conventional Treatment in Very Severe Aortic Stenosis
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: The optimal timing of surgical intervention remains controversial in asymptomatic patients with very severe aortic stenosis.
    explanation: Registry study identity/design; status and phase independently checked through the live ClinicalTrials.gov API on 2026-09-21.

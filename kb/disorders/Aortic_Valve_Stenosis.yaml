- name: NCT03094143
  phase: NOT_APPLICABLE
  status: ACTIVE_NOT_RECRUITING
  description: EVOLVED analyzed 224 fibrosis-enriched asymptomatic severe-AS patients of 356 planned. Early intervention versus guideline-directed care did not significantly reduce the primary death/AS-hospitalization composite (20/113 versus 25/111; HR 0.79, 95% CI 0.44–1.43). Median intervention timing was 5 versus 20.2 months. Hospitalization and symptom secondary findings were unadjusted for multiplicity and remain hypothesis-generating; the trial does not establish equivalence or a fibrosis-selection threshold. The registry remains active for longer follow-up.
  notes: Status and phase checked on 2026-09-21. Published analysis size is distinguished from registry planned enrollment and subsequent extension.
  evidence:
  - reference: clinicaltrials:NCT03094143
    reference_title: Early Valve Replacement Guided by Biomarkers of Left Ventricular Decompensation in Asymptomatic Patients With Severe Aortic Stenosis
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: Aortic stenosis is the most common valvular disease in the Western world.
    explanation: Registry study identity/design; status and phase independently checked through the live ClinicalTrials.gov API on 2026-09-21.

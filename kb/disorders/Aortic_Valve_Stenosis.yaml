- name: Treatment of hypertension
  description: Treat coexisting hypertension with careful titration, commonly using renin-angiotensin-system therapy. Blood-pressure management addresses comorbidity and additional ventricular load; it has not been established to reverse the valve lesion and must not delay indicated replacement.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557628/
    reference_title: Aortic Stenosis - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Angiotensin-converting enzyme inhibitors and angiotensin receptor blockers are preferentially considered.
    explanation: Clinical hypertension management in aortic stenosis.

- name: Combined metabolic-diet LA mouse
  species: Mouse
  genotype: Ldlr-null; Apob100/100
  publication: PMID:29539583
  description: A diabetogenic and procalcific diet increased valve jet velocities and lesion burden compared with normal chow in a hyperlipidemic male-mouse background. This model addresses a selected metabolic context of calcific valve disease.
  notes: The combined diet changes glycemia, lipids, minerals and body weight; it does not isolate glucose as the in-vivo cause. Fibrosis occurred with both diets. Whole-group ejection fraction and fractional shortening differences were nonsignificant; a post hoc stenosis subgroup showed larger functional differences. No neoangiogenesis, large calcified nodules or bone metaplasia was observed.

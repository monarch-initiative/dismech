    snippet: The findings that early intervention was associated with a lower incidence of unplanned aortic stenosis–related hospitalization and improved symptom burden should be considered hypothesis-generating given that the study did not meet the primary end point and was not adjusted for multiple comparisons.
    explanation: Published study finding; see description for selected population, endpoint and uncertainty.
  - reference: PMID:39466640

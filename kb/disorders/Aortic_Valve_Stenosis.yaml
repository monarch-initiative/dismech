  downstream:
  - target: Left Ventricular Decompensation and Symptom Onset
    causal_link_type: DIRECT
    description: >-
      Fibrosis produces the diastolic and longitudinal systolic dysfunction that
      manifests as symptoms and drives events.
- name: Left Ventricular Decompensation and Symptom Onset
  biological_scale: ORGANISM
  description: >
    Diastolic dysfunction, longitudinal systolic dysfunction, and myocardial
    injury accumulate across the fibrosis stages until the compensated ventricle
    fails, producing exertional dyspnea, angina, syncope, and ultimately heart
    failure. Symptom onset is the classical trigger for intervention, and in
    prospectively followed asymptomatic patients almost all cardiac deaths were
    preceded by symptoms - which is what makes watchful waiting defensible, and
    also what makes the residual sudden-death risk so difficult to quantify.
  locations:
  - preferred_term: heart left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  evidence:
  - reference: PMID:28017384
    reference_title: "Myocardial Fibrosis and Cardiac Decompensation in Aortic Stenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was evidence of increasing hypertrophy, myocardial injury, diastolic
      dysfunction, and longitudinal systolic dysfunction consistent with
      progressive left ventricular decompensation
    explanation: >-
      Documents the physiological components of decompensation tracking with
      fibrosis stage.
  - reference: PMID:10965007
    reference_title: "Predictors of outcome in severe, asymptomatic aortic stenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five of the six deaths from cardiac disease were preceded by symptoms.
    explanation: >-
      Supports symptom onset as the near-universal antecedent of cardiac death in
      this cohort, the observation on which watchful waiting rests.

  - reference: PMID:28017384
    reference_title: "Myocardial Fibrosis and Cardiac Decompensation in Aortic Stenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      iECV demonstrated a good correlation with diffuse histological fibrosis on

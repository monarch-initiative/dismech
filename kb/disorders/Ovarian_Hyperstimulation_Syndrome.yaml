- name: Ovarian Renin-Angiotensin System Activation
  biological_scale: MOLECULAR
  role: modifier
  mechanism_confidence: PROVISIONAL
  description: >-
    A second proposed route from the stimulated ovary to VEGF, running in
    parallel with the direct hCG-driven secretion rather than replacing it. The
    stimulated ovary contains its own renin-angiotensin system: prorenin and
    renin were reported in the follicular fluid of gonadotropin-stimulated
    ovaries at significantly higher levels than in unstimulated ovaries as far
    back as 1987. Renin secretion is cyclic-AMP-stimulated, and the resulting
    angiotensin signalling is proposed to raise VEGF expression in human
    luteinized granulosa cells.

    Its practical importance is that it is the only mechanistic account of why
    intravenous calcium - the agent that ranks ABOVE cabergoline in both network
    meta-analyses of OHSS prophylaxis - should work at all: calcium is proposed
    to inhibit cAMP-stimulated renin secretion and so reduce VEGF.

    Curated as PROVISIONAL and as a modifier rather than a required step. The
    sources are review statements of a proposed mechanism, hedged in their own
    wording ("could be by inhibiting"), and no primary demonstration in an OHSS
    cohort is cited. It is included because a therapy this effective should not
    sit in the entry with its mechanism marked unavailable.

  - reference: PMID:28638367
    reference_title: "GnRH Agonist Trigger and LH Activity Luteal Phase Support versus hCG Trigger and Conventional Luteal Phase Support in Fresh Embryo Transfer IVF/ICSI Cycles-A Systematic PRISMA Review and Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The use of GnRH agonist (GnRHa) for final oocyte maturation trigger in
      oocyte donation and elective frozen embryo transfer cycles is well
      established due to lower ovarian hyperstimulation syndrome (OHSS) rates as
      compared to hCG trigger.
    explanation: >-
      Replacing the luteinizing stimulus lowers OHSS rates, which is the
      interventional evidence that this node is a required step.
  downstream:
  - target: EGR1-TIE1 Amplification of Granulosa VEGF Output
    causal_link_type: DIRECT
    description: >-
      The luteinized granulosa cells are the cells in which hCG raises EGR1 and
      Tie1; without that expanded luteinized compartment there is nothing for
      the proposed amplifier to act in.
  - target: Ovarian Renin-Angiotensin System Activation
    causal_link_type: DIRECT
    description: >-
      Gonadotropin stimulation raises prorenin and renin in follicular fluid, so
      the expanded stimulated follicular compartment is where the intra-ovarian

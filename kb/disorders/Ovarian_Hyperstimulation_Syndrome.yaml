diagnosis:
- name: Pelvic Ultrasonography
  description: >-
    Transvaginal or transabdominal ultrasound demonstrating enlarged multicystic
    ovaries and free peritoneal fluid is the primary diagnostic study, and in
    the severe form also shows pleural fluid. It is available at the bedside,
    which matters in a syndrome that can deteriorate over hours.
  evidence:
  - reference: PMID:26506672
    reference_title: "Non-invasive ventilation for the treatment of acute respiratory failure following ovarian hyperstimulation syndrome: report of two cases and a brief review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of severe OHSS was made, largely based on bedside
      ultrasonography showing increased ovarian size, mild ascites and bilateral
      pleural effusions.
    explanation: >-
      Documents bedside ultrasound as the basis on which the severe diagnosis
      was made.
- name: FSHR Sequencing in Recurrent Spontaneous OHSS
  description: >-
    Sequencing FSHR is what separates the familial gestational form from a
    sporadic spontaneous case, and the distinction is prognostic rather than
    academic: an activating allele predicts recurrence in every subsequent
    pregnancy, and family members may carry it. Before sequencing, the
    differential of an enlarged multicystic ovarian mass in pregnancy —
    malignancy, pregnancy luteoma, hyperreactio luteinalis — has to be excluded.
  evidence:
  - reference: PMID:23941020
    reference_title: "Spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the differential diagnosis, malignancy, pregnancy luteoma and
      hyperreactio luteinalis would have to be excluded.
    explanation: >-
      States the differential diagnosis that has to be settled before a
      spontaneous OHSS diagnosis is accepted.
  - reference: PMID:15080154
    reference_title: "A mutation in the follicle-stimulating hormone receptor as a cause of familial spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this report, we describe a new familial case of recurrent OHSS.
    explanation: >-
      Documents that the familial form presents as recurrent disease, which is
      what makes identifying the allele worthwhile.
discussions:
- discussion_id: ohss_hcg_not_obligate
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is human chorionic gonadotropin actually necessary for OHSS to develop, and
    if not, what supplies the VEGF stimulus in the cases that occur without it?
  attaches_to:
  - "pathophysiology#Ovarian VEGF Hypersecretion"
  - "pathophysiology#hCG-Driven Luteinization of the Recruited Cohort"
  rationale: >-
    The whole preventive strategy of modern assisted reproduction — substituting
    a GnRH agonist trigger for hCG, freezing all embryos to avoid endogenous
    pregnancy hCG — is built on hCG being the obligatory driver of the VEGF
    surge. A 2016 review states that recent case reports have shown OHSS
    occurring without it. If that is right, then either the luteinized ovary can
    reach the VEGF threshold on LH activity alone in some women, or a second
    stimulus exists that current protocols do not remove, and the residual OHSS
    seen in agonist-trigger cycles is explained rather than anomalous. The
    entry's causal chain is drawn with hCG as the principal but not the sole
    stimulus for that reason.
  proposed_experiments:
  - experiment_id: ohss_vegf_in_agonist_trigger_cases
    name: Serial serum VEGF in agonist-trigger cycles complicated by OHSS
    description: >-
      Measure circulating VEGF serially in women who develop OHSS after a GnRH
      agonist trigger with no hCG exposure, comparing against hCG-triggered
      cases matched for follicle count, to establish whether the VEGF surge
      occurs at comparable magnitude without hCG.
  evidence:
  - reference: PMID:27273307
    reference_title: "Pathophysiology, treatment and prevention of ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Human chorionic gonadotropin was previously thought to be necessary for
      OHSS to occur; however, recent case reports have proven otherwise.
    explanation: >-
      States directly that the assumed obligate role of hCG has been
      contradicted by case reports.
- discussion_id: ohss_tie1_human_relevance
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the EGR1-Tie1 axis that is required for hCG-induced VEGF in a
    granulosa-lutein cell line and in the rat model operate in intact human
    ovarian tissue, and is Tie1 therefore a usable therapeutic target?
  attaches_to:
  - "pathophysiology#EGR1-TIE1 Amplification of Granulosa VEGF Output"
  rationale: >-
    The Tie1 result is unusually well constructed for a mechanism at this stage:
    an association in granulosa cells taken from actual OHSS patients, a
    loss-of-function experiment abolishing the hCG-VEGF link in a human
    granulosa-lutein line, attenuation of the syndrome in rats, and an identified
    transcriptional route via EGR1. What it does not have is any demonstration in
    intact human ovary or any clinical exposure. The mismatch is mechanistically
    meaningful because the therapeutic argument for targeting Tie1 rests entirely
    on it sitting upstream of VEGF: an agent acting there would in principle
    spare the VEGFR-2-dependent luteal angiogenesis that a direct VEGFR-2
    antagonist destroys, which is the specific reason SU5416 was abandoned. If
    the axis turns out to be a cell-line and rodent phenomenon, that argument
    disappears and the field is back to dose-separating a dopamine agonist. The
    reporting authors say as much themselves.
  proposed_experiments:
  - experiment_id: ohss_tie1_egr1_human_ovarian_tissue
    name: Tie1 and EGR1 expression in human ovarian tissue across OHSS risk strata
    description: >-
      Quantify Tie1 and EGR1 in ovarian tissue or aspirated granulosa cells from
      women stratified by OHSS risk and by trigger type (hCG versus GnRH
      agonist), testing whether the induction predicted by the cell-line work is
      present in vivo and whether it tracks trigger exposure.
  evidence:
  - reference: PMID:35079118
    reference_title: "Tie1 contributes to the development of ovarian hyperstimulation syndrome under the regulation of EGR1 in granulosa cells."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Taken together, our results indicate that Tie1 may be a therapeutic target
      in cases of moderate-to-severe OHSS. Further studies are needed to address
      its clinical relevance.
    explanation: >-
      The authors state the translational gap explicitly.
- discussion_id: ohss_established_disease_evidence_base
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is there any intervention that shortens or attenuates established OHSS,
    rather than preventing it?
  attaches_to:
  - "pathophysiology#Third-Space Fluid Shift and Intravascular Volume Depletion"
  rationale: >-
    Almost the entire evidence base for this syndrome sits on the preventive
    side of the hCG trigger — protocol choice, trigger substitution, freeze-all,
    prophylactic cabergoline. Once the capillary leak is established, management
    is supportive and, by the reviewing authors' own account, based on consensus
    rather than evidence. That asymmetry is defensible while prevention keeps
    working, but it leaves the women who develop severe disease anyway with no
    treatment aimed at the mechanism. Whether the VEGFR-2 node remains
    modifiable after the leak has started — that is, whether cabergoline has any
    therapeutic as opposed to prophylactic effect — is the specific unanswered
    question, and the cabergoline evidence cited here is prophylactic only.
  proposed_experiments:
  - experiment_id: ohss_cabergoline_established_disease_rct
    name: Randomised trial of cabergoline in established moderate-to-severe OHSS
    description: >-
      Randomise women hospitalised with established moderate-to-severe OHSS to
      cabergoline or placebo on top of standard supportive care, with time to
      resolution of ascites, haematocrit trajectory and length of stay as
      outcomes, to test whether the VEGFR-2 node is still modifiable once the
      leak is established.
  evidence:
  - reference: PMID:27273307
    reference_title: "Pathophysiology, treatment and prevention of ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment is largely supportive and is based mainly on consensus
      statements rather than evidence.
    explanation: >-
      States the evidence gap on the treatment side of established disease.
datasets:
- accession: geo:GSE183346
  title: High throughput sequencing data of ovarian hyperstimulation syndrome (OHSS) mouse model
  description: >-
    RNA sequencing of ovaries from an established mouse OHSS model, reported as
    showing strengthened cell junctions between ovarian vessels after drug
    treatment - the transcriptional counterpart of the inter-endothelial
    junction loosening that this entry curates as the VEGFR-2-mediated
    permeability node.
  organism:
    preferred_term: house mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  data_type: BULK_RNA_SEQ
  sample_count: 6
  publication: PMID:35221672
  notes: >-
    Identified by GEO DataSets index search (scripts/discover_datasets.py) and
    verified against NCBI E-utilities on 2026-08-25; title, sample count and
    organism are GEO's own values. Relevance triaged manually: this is the OHSS
    syndrome itself in a disease model, not merely a superovulation protocol.
    Two other DIRECT-scored candidates were rejected on that same triage -
    GSE229048 (ovine caruncular endometrium after FSH superovulation) studies
    the uterus after a stimulation protocol rather than the hyperstimulation
    syndrome, and GSE39402 is an epithelial ovarian tumour model. Both would
    have resolved perfectly while being about something else.

notes: >-
  On the scope of MONDO:0011972 and why this is one entry with two subtypes.
  The MONDO term is internally conflated: its textual definition is the MeSH
  definition of the iatrogenic complication of ovulation induction, while its
  OMIM xref (608115) and its FSHR gene association and hereditary-disease parent
  all belong to the rare familial gestational spontaneous form. Rather than pick
  one and discard the other, this entry curates the concept as MONDO scopes it —
  a single disease with a shared final common pathway (multifollicular
  luteinization, ovarian VEGF hypersecretion, VEGFR-2-mediated capillary leak)
  reached by an iatrogenic and a hereditary route, modelled as two subtypes. A
  third, non-genetic and non-iatrogenic route — promiscuous activation of the
  wild-type receptor by very high hCG or TSH — is curated as its own trigger
  node because it belongs to neither subtype.

  The non-VEGF mediators. An earlier revision of this note claimed the
  anti-Mullerian-hormone / dendritic-cell / interleukin arm was omitted because
  no quotable source existed. That was wrong, and the correction is recorded
  here rather than silently made: PMID:27273307 - already cited several times in
  this entry - states it directly, and that sentence is now curated as PARTIAL
  evidence on the `Increased Systemic Vascular Permeability` node, where it
  qualifies the claim that the leak is a pure VEGF effect. It is deliberately
  not given its own pathophysiology node: the source describes it as "explored
  recently as contributors", which supports a hedge on an existing node but not
  a separate causal chain.

  The ovarian renin-angiotensin arm: a second correction, of the same kind and in
  the same place. An earlier revision said no verifiable source for it existed.
  That was wrong, and worse, it was wrong about two references added in the very
  commit that said it - PMID:26752241 and PMID:35154015 both state the
  renin-angiotensin-to-VEGF link explicitly. The arm is now curated as its own
  PROVISIONAL modifier node, wired from the luteinization node and into VEGF
  hypersecretion, and it carries the mechanistic rationale for intravenous
  calcium, which ranks above cabergoline in both meta-analyses. The recurrence of
  this defect class - asserting an absence of evidence without re-checking the
  references in hand - is why both corrections are left visible here rather than
  quietly edited away.

  Still not curated: IL-6/IL-8 as named cytokines, and the arm mediated by
  platelet-activating factor. These appear in review literature reachable only
  through the deep-research report's internal citation keys, and no source in
  this entry's reference set states them. That claim was checked against every cached
  reference before being written this time. The angiopoietin/TIE arm IS curated,
  because a primary functional study (PMID:35079118) exists for it.

  Prevalence figures are all cycle-based; there is no meaningful
  general-population denominator for a syndrome that requires gonadotropin
  exposure or pregnancy to occur.

  On LHCGR. The lutropin/choriogonadotropin receptor is the receptor hCG is
  actually specific for, and the entry's pathograph depends on hCG receptor
  signalling at the luteinization node. It is therefore recorded as a `genes:`
  annotation ON that node rather than as a `genetic:` entry: no LHCGR variant
  causes this disease, and a `genetic:` block with `relationship_type: UNKNOWN`
  and no LHCGR-specific evidence was signalling that it did not belong there. The
  mechanistic contrast it exists to mark is worth restating: in iatrogenic OHSS
  hCG acts on its own receptor, whereas in the familial spontaneous form the
  whole point is that hCG acts on a mutant FSHR whose ligand specificity is lost.

  On hepatic involvement. Severe OHSS is reported with hepatic involvement, and
  review literature commonly cites transaminase elevation in roughly 30% of
  severe cases. The phenotype here is bound to the broad `HP:0031865 Abnormal
  liver physiology` rather than to `HP:0002910 Elevated circulating hepatic
  transaminase concentration`, because no source cited on this entry states the
  transaminase finding - only that severe forms are accompanied by hepatic
  involvement. The more specific binding would assert a laboratory abnormality
  the evidence does not carry.

  On the two network meta-analyses. Both were originally cited by DOI, then
  re-resolved to PMID:35154015 and PMID:26752241. This is worth recording as a
  mechanical point: `DOI:` is listed under `skip_prefixes` in
  `conf/reference_validator_config.yaml`, so nine snippets quoted from those two
  papers were silently NOT snippet-checked while they carried DOI references
  (`just count-verified-snippets` reported "9 skipped by prefix"). Re-keying them
  to PMIDs moved all nine into the checked set. Prefer PMIDs wherever a DOI
  resolves to one.

clinical_burden:
  burden_level: MODERATE
  rationale: >
    Most disease is mild and self-limiting, but the severe form is potentially
    fatal and its thrombotic complications - venous thromboses of the upper
    limbs and neck, and arterial events that are mainly intracerebral - occur in
    otherwise healthy young women undergoing an elective procedure. Burden is
    recorded as MODERATE rather than HIGH because the syndrome is self-limiting
    in the great majority of cases and its incidence has fallen with protocol
    change, while acknowledging that individual severe cases carry high
    morbidity.
  evidence:
  - reference: PMID:21082501
    reference_title: "Ovarian hyperstimulation syndrome: definition, incidence, and classification."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although considered uncommon, the severe form is potentially fatal.
    explanation: >-
      Establishes the severity ceiling of the syndrome.
  - reference: PMID:25014487
    reference_title: "Thrombosis following ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thromboses are mostly venous (67-75%) involving upper limbs and neck, then
      arterial (25-33%) which are mainly intracerebral.
    explanation: >-
      Characterises the distribution of the most dangerous complication.
pathophysiology:
- name: Supraphysiological Multifollicular Recruitment
  biological_scale: TISSUE
  role: trigger
  description: >
    Exogenous gonadotropin given for controlled ovarian stimulation rescues the
    whole antral cohort from atresia instead of a single dominant follicle,
    leaving the ovary carrying many simultaneously mature granulosa-cell
    populations. This is the substrate on which the later hCG signal acts: the
    quantity of steroidogenically active granulosa tissue, not the hCG dose
    alone, sets the size of the subsequent VEGF response. Polycystic ovary
    syndrome, young age, and a previous episode are the recognised markers of an
    ovary that will over-recruit.
  biological_processes:
  - preferred_term: cellular response to follicle-stimulating hormone stimulus
    term:
      id: GO:0071372
      label: cellular response to follicle-stimulating hormone stimulus
    modifier: INCREASED
  - preferred_term: ovarian follicle development
    term:
      id: GO:0001541
      label: ovarian follicle development
    modifier: INCREASED
  cell_types:
  - preferred_term: granulosa cell
    term:
      id: CL:0000501
      label: granulosa cell
  evidence:
  - reference: PMID:31097257
    reference_title: "Ovarian hyperstimulation syndrome: A review for emergency clinicians."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Risk factors for the development of OHSS include age < 35, history of
      polycystic ovarian syndrome or previous OHSS, and pregnancy.
    explanation: >-
      Names the host factors that predict an exaggerated recruitment response at
      this node.
  - reference: PMID:21082501
    reference_title: "Ovarian hyperstimulation syndrome: definition, incidence, and classification."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Several risk factors for OHSS have been identified; some are considered
      major risk factors such as polycystic ovary syndrome
    explanation: >-
      Independently identifies polycystic ovary syndrome as the major risk
      factor operating at this node.
  downstream:
  - target: hCG-Driven Luteinization of the Enlarged Follicle Cohort
    causal_link_type: DIRECT
    description: >
      The enlarged cohort is the tissue that the subsequent hCG signal
      luteinizes; without it the same hCG exposure produces no syndrome.

- name: Promiscuous FSH Receptor Activation by hCG or Thyrotropin
  biological_scale: MOLECULAR
  role: trigger
  description: >
    The entry point for spontaneous OHSS, which reaches the same cascade without
    any exogenous gonadotropin. The FSH receptor is a glycoprotein-hormone
    receptor that shares an activation architecture with the LH/CG and TSH
    receptors, so it can be driven by the wrong ligand under two circumstances:
    a wild-type receptor exposed to very high hCG (multiple pregnancy,
    hydatidiform mole) or TSH (severe hypothyroidism), or a germline-mutant
    receptor whose activation barrier is lowered. The two mutant classes are
    mechanistically distinct - transmembrane-helix mutants show constitutive
    activity and respond to both hCG and TSH, whereas the single reported
    extracellular-domain mutant gains hCG affinity without constitutive activity
    or TSH responsiveness - so this node is deliberately named for the shared
    outcome rather than for one molecular route.
  molecular_functions:
  - preferred_term: follicle-stimulating hormone receptor activity
    term:
      id: GO:0004963
      label: follicle-stimulating hormone receptor activity
    modifier: GAIN_OF_FUNCTION
  - preferred_term: choriogonadotropin hormone binding
    term:
      id: GO:0038106
      label: choriogonadotropin hormone binding
    modifier: INCREASED
  genes:
  - preferred_term: FSHR
    term:
      id: hgnc:3969
      label: FSHR
  evidence:
  - reference: PMID:23941020
    reference_title: "Spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      High levels of these hormones are able to stimulate by natural promiscuous
      activation the wild-type FSHr, resulting in sporadic presentations of the
      syndrome.
    explanation: >-
      Establishes the wild-type promiscuous-activation route for sporadic
      spontaneous disease.
  - reference: PMID:17721928
    reference_title: "Identification of the first germline mutation in the extracellular domain of the follitropin receptor responsible for spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      When tested functionally, all mutants were abnormally sensitive to both
      hCG and thyrotropin (TSH) while displaying constitutive activity.
    explanation: >-
      Functional characterisation of the transmembrane mutant class underlying
      this node.
  - reference: PMID:17721928
    reference_title: "Identification of the first germline mutation in the extracellular domain of the follitropin receptor responsible for spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Contrary to the mutations described previously, the p.Ser128Tyr FSHR
      mutant displayed increase in affinity and sensitivity toward hCG and did
      not show any constitutive activity, nor promiscuous activation by TSH.
    explanation: >-
      Documents the second, mechanistically distinct mutant class the node
      description keeps separate.
  notes: >-
    The modifier is GAIN_OF_FUNCTION rather than INCREASED because the claim is
    qualitative - the receptor responds to ligands it should not respond to at
    all - not that normal FSH signalling is running above its usual level.
  downstream:
  - target: Supraphysiological Multifollicular Recruitment
    causal_link_type: DIRECT
    description: >
      Inappropriate FSH-receptor signalling drives the same multifollicular
      recruitment that exogenous gonadotropin produces in the iatrogenic form.

- name: hCG-Driven Luteinization of the Enlarged Follicle Cohort
  biological_scale: CELLULAR
  description: >
    Human chorionic gonadotropin - given as the ovulation trigger, or arriving
    endogenously from an implanting pregnancy - acts on the LH/CG receptor of
    the primed granulosa cohort and luteinizes all of it at once. hCG rather
    than LH is the operative ligand because its much longer half-life sustains
    receptor occupancy for days rather than hours, which is why substituting a
    GnRH agonist trigger (which releases endogenous LH) attenuates the
    syndrome. This node is the convergence point of the iatrogenic and
    spontaneous routes and the point at which the disease becomes committed.
  biological_processes:
  - preferred_term: luteinization
    term:
      id: GO:0001553
      label: luteinization
    modifier: INCREASED
  - preferred_term: response to luteinizing hormone
    term:
      id: GO:0034699
      label: response to luteinizing hormone
    modifier: INCREASED
  cell_types:

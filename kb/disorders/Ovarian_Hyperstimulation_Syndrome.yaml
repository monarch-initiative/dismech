  - preferred_term: positive regulation of vascular permeability
    term:
      id: GO:0043117
      label: positive regulation of vascular permeability
    modifier: INCREASED
  evidence:
  - reference: PMID:21082502
    reference_title: "Physiology and pathology of ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The ultimate pathophysiological step underlying this clinical picture is
      increased vascular permeability (VP).
    explanation: >-
      Names this node as the single physiological lesion of the syndrome.
  - reference: PMID:24623949
    reference_title: "VEGF antagonist for the prevention of ovarian hyperstimulation syndrome: Current status."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      is a self-limiting disorder with a broad spectrum of clinical
      manifestations related to increased capillary permeability and fluid
      retention brought about by many biochemical mediators especially vascular
      endothelium growth factor (VEGF), playing a pivotal role in its
      pathophysiology
    explanation: >-
      Independently attributes the whole clinical spectrum to this node and
      names VEGF as its pivotal mediator.
  downstream:
  - target: Third-Space Fluid Shift and Serous Effusions
    causal_link_type: DIRECT
    description: >
      Protein-rich plasma moves down its now-unopposed gradient into the
      peritoneal and pleural cavities.

- name: Third-Space Fluid Shift and Serous Effusions
  biological_scale: ORGANISM
  description: >
    Protein-rich fluid accumulates in the peritoneal cavity as ascites and, less
    often, in the pleural and pericardial spaces. The accumulation is
    simultaneously the source of the abdominal and respiratory symptoms and the
    reason the intravascular compartment empties, so it is the node at which
    therapeutic paracentesis acts.
  locations:
  - preferred_term: peritoneal cavity
    term:
      id: UBERON:0001179
      label: peritoneal cavity
  - preferred_term: pleural cavity
    term:
      id: UBERON:0002402
      label: pleural cavity
  evidence:
  - reference: PMID:31097257
    reference_title: "Ovarian hyperstimulation syndrome: A review for emergency clinicians."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Emergency physicians will be faced with several complications including
      ascites, abdominal compartment syndrome, renal dysfunction, acute
      respiratory distress syndrome, thromboembolic disease, and hemodynamic
      instability.
    explanation: >-
      Enumerates the compartment-level consequences that follow from fluid
      accumulation at this node.
  downstream:
  - target: Intravascular Volume Depletion and Hemoconcentration
    causal_link_type: DIRECT
    description: >
      Fluid sequestered in the third space is fluid subtracted from the
      circulating volume.
  - target: Abdominal and Thoracic Compartment Compromise
    causal_link_type: DIRECT
    description: >
      Accumulated ascites and effusions raise intra-abdominal pressure and
      restrict ventilation.

- name: Abdominal and Thoracic Compartment Compromise
  biological_scale: ORGANISM
  description: >
    Tense ascites raises intra-abdominal pressure to the point of abdominal
    compartment syndrome, splints the diaphragm, and together with pleural
    effusion produces hypoxaemia and respiratory distress. In the most severe
    cases the respiratory picture progresses to acute respiratory distress
    syndrome. This arm is separated from the renal arm because it is relieved by
    a different intervention - drainage rather than volume replacement.
  evidence:
  - reference: PMID:31097257
    reference_title: "Ovarian hyperstimulation syndrome: A review for emergency clinicians."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Emergency physicians will be faced with several complications including
      ascites, abdominal compartment syndrome, renal dysfunction, acute
      respiratory distress syndrome, thromboembolic disease, and hemodynamic
      instability.
    explanation: >-
      Names abdominal compartment syndrome and acute respiratory distress
      syndrome as recognised complications at this node.

- name: Intravascular Volume Depletion and Hemoconcentration
  biological_scale: ORGANISM
  conforms_to: "thrombogenesis#Virchow-Triad Prothrombotic Context"
  description: >
    Loss of plasma into the third space contracts the circulating volume, raises
    the haematocrit, and leaves the patient hypovolaemic despite obvious total-
    body fluid overload. This is the central paradox of managing the syndrome:
    the treatment for the ascites and the treatment for the hypovolaemia pull in
    opposite directions. Hemoconcentration is also the prothrombotic context
    from which the thrombotic complications arise, which is why this node
    declares conformance to the Virchow-triad node of the thrombogenesis module
    rather than to a coagulation-activation node.
  biological_processes:
  - preferred_term: regulation of blood volume by renin-angiotensin
    term:
      id: GO:0002016
      label: regulation of blood volume by renin-angiotensin
    modifier: INCREASED
  evidence:
  - reference: PMID:25014487
    reference_title: "Thrombosis following ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Different changes in haemostatic markers have been found to create a state
      of hypercoagulability, but no single standard test is available to
      estimate the state of thrombosis.
    explanation: >-
      Establishes the hypercoagulable state at this node while recording that it
      is not measurable by any single assay.
  - reference: PMID:8671471
    reference_title: "Plasma inflammatory cytokines correlate to the ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A statistically significant correlation was found between plasma cytokine
      concentrations and certain biological characteristics of the syndrome such
      as leukocytosis, increased haematocrit, and elevated plasma
      17-beta-oestradiol concentrations.
    explanation: >-
      Documents increased haematocrit as a measured characteristic of severe
      disease.
  notes: >-
    Conformance is claimed only at the Virchow-triad node of `thrombogenesis`.
    The module's coagulation-cascade node is deliberately not claimed: the
    cited review states that no single standard test estimates the thrombotic
    state and that the role of thrombophilia markers is controversial, so a
    thrombin/fibrin-level mechanism is not evidenced here.
  downstream:
  - target: Renal Hypoperfusion and Acute Kidney Injury
    causal_link_type: DIRECT
    description: >
      A contracted circulating volume reduces renal perfusion pressure.
  - target: Thromboembolism
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >
      Hemoconcentration, stasis and altered haemostatic markers together create
      the prothrombotic state from which clinical thromboses arise; the
      intervening coagulation steps are not resolved to a single assayable
      mechanism.

- name: Renal Hypoperfusion and Acute Kidney Injury
  biological_scale: ORGANISM
  description: >
    Reduced renal perfusion produces oliguria, rising creatinine and, in severe
    disease, frank acute kidney injury with electrolyte disturbance -
    characteristically hyponatraemia and hyperkalaemia. It is the arm that most
    often determines whether a patient is managed as an outpatient or admitted.
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  evidence:
  - reference: PMID:31097257
    reference_title: "Ovarian hyperstimulation syndrome: A review for emergency clinicians."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Emergency physicians will be faced with several complications including
      ascites, abdominal compartment syndrome, renal dysfunction, acute
      respiratory distress syndrome, thromboembolic disease, and hemodynamic
      instability.
    explanation: >-
      Identifies renal dysfunction as a recognised complication downstream of
      volume depletion.

- name: Thromboembolism
  biological_scale: ORGANISM
  conforms_to: "thrombogenesis#Pathological Fibrin-Platelet Thrombus Formation"
  description: >
    The most dangerous complication, and the one that dissociates most sharply
    from apparent severity: thromboses occur in young, otherwise healthy women
    and can present weeks after the ovarian picture has settled. Their anatomy
    is unusual - predominantly venous and predominantly in the upper limbs and
    neck rather than the legs, with a substantial arterial minority that is
    mainly intracerebral.
  biological_processes:
  - preferred_term: positive regulation of blood coagulation
    term:
      id: GO:0030194
      label: positive regulation of blood coagulation
    modifier: INCREASED
  evidence:
  - reference: PMID:25014487
    reference_title: "Thrombosis following ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although the incidence of thrombosis varies from 0.2% among in vitro
      fertilization (IVF) cycles and up to 10% for severe cases of the syndrome,
      it represents the most dangerous complication of OHSS.
    explanation: >-
      Quantifies the frequency of the complication modelled at this node and
      states its clinical weight.
  - reference: PMID:25014487
    reference_title: "Thrombosis following ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thromboses are mostly venous (67-75%) involving upper limbs and neck, then
      arterial (25-33%) which are mainly intracerebral.
    explanation: >-
      Gives the distinctive anatomical distribution curated in the node
      description.

- name: Inflammatory Cytokine Amplification
  biological_scale: ORGANISM
  description: >
    Interleukin-6, interleukin-1 and TNF-alpha are elevated in the plasma of
    women admitted with severe disease and fall as it resolves, and ascitic
    fluid is rich in IL-6 and IL-8. Whether this is a parallel driver of
    permeability or a consequence of it is unresolved: the primary studies
    report correlation with severity and a temporal course that tracks recovery,
    but no interventional evidence. The node is retained because the cytokine
    hypothesis predates and partly motivated the VEGF account, and because it is
    the arm that would be targeted if anti-VEGF prevention proves insufficient.
  biological_processes:
  - preferred_term: cytokine-mediated signaling pathway
    term:
      id: GO:0019221
      label: cytokine-mediated signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:8671471
    reference_title: "Plasma inflammatory cytokines correlate to the ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High concentrations of IL-1, IL-6 and TNF-alpha were detected in all
      individuals upon admission for severe OHSS.
    explanation: >-
      Direct human measurement of the cytokines curated at this node.
  - reference: PMID:8671471
    reference_title: "Plasma inflammatory cytokines correlate to the ovarian hyperstimulation syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results suggest close association between inflammatory cytokines and
      the pathophysiology of the ovarian hyperstimulation syndrome.
    explanation: >-
      Recorded as PARTIAL because the authors claim association, not causation -
      which is exactly the limitation the node description preserves.
  - reference: PMID:8224268
    reference_title: "Elevated levels of interleukin-6 in ascites and serum from women with ovarian hyperstimulation syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Increased production of IL-6, released into the peritoneal cavity and the
      circulation, may mediate OHSS.
    explanation: >-
      The authors' own hedged causal claim; PARTIAL rather than SUPPORT because
      "may mediate" is the strongest statement the data license.
  downstream:
  - target: Increased Systemic Vascular Permeability
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - inflammatory_cytokine_mediation
    description: >
      Proposed contribution of circulating and intraperitoneal cytokines to the
      permeability lesion. Typed UNKNOWN because the human evidence is
      correlative and no interventional study has tested the edge.
mechanistic_hypotheses:
- hypothesis_group_id: vegf_vegfr2_permeability
  hypothesis_label: hCG-induced ovarian VEGF-A acting through VEGFR-2 as the cause of increased vascular permeability
  status: CANONICAL
  description: >
    The accepted account, and the one this entry's main chain encodes. It is
    unusually well supported for a syndrome-level mechanism because each step
    has a distinct line of evidence: expression timing (VEGF/VEGFR-2 mRNA peaks
    with permeability), localisation (protein in granulosa-lutein and
    endothelial cells), source (ovariectomy abolishes the response), and
    sufficiency-by-blockade (a VEGFR-2 inhibitor reverses it). The caveat is
    that the causal steps are established in the rat, not in women.
  evidence:
  - reference: PMID:27273307
    reference_title: "Pathophysiology, treatment and prevention of ovarian hyperstimulation syndrome."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The pathophysiology is still not completely understood; however, vascular
      endothelial growth factor is likely to be an important mediator.
    explanation: >-
      A recent review's own calibration of how strongly the canonical mechanism
      should be asserted - "likely to be an important mediator", not settled.

- hypothesis_group_id: inflammatory_cytokine_mediation
  hypothesis_label: Inflammatory cytokines as parallel mediators of the permeability lesion
  status: ALTERNATIVE
  description: >
    IL-6, IL-1 and TNF-alpha rise with severe disease and fall with recovery,
    and ascitic fluid is rich in IL-6 and IL-8. The hypothesis is that these
    contribute to permeability alongside VEGF rather than merely marking
    severity. It remains correlative: no interventional human or animal study
    has tested cytokine blockade against the permeability endpoint, so the
    corresponding causal edge is typed UNKNOWN.
  evidence:
  - reference: PMID:8224268
    reference_title: "Elevated levels of interleukin-6 in ascites and serum from women with ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, both serum and ascitic fluid from women with OHSS contained
      significantly greater levels of IL-6 than control serum and PF.
    explanation: >-
      The measurement on which the alternative hypothesis rests.

- hypothesis_group_id: ovarian_renin_angiotensin
  hypothesis_label: Ovarian renin-angiotensin system activation as a contributor
  status: ALTERNATIVE
  description: >
    An older account in which the hyperstimulated ovary's local
    renin-angiotensin system contributes to the vasoactive response. It is
    retained here as a named alternative because it is still listed among the
    mediators discussed in the pathophysiology literature, and because
    renin-angiotensin blockade was among the prevention strategies trialled.
    No node in this entry asserts a renin-angiotensin causal edge; the
    hypothesis is recorded rather than modelled.
  evidence:
  - reference: PMID:20140640
    reference_title: "Ovarian hyperstimulation syndrome: pathophysiology and prevention."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The role of estradiol, luteinizing hormone, human chorionic gonadotropin
      (hCG), inflammatory mediators, the renin-angiotensin system and vascular
      endothelial growth factor is discussed in the pathophysiology of OHSS.
    explanation: >-
      Places the renin-angiotensin system among the discussed mediators;
      PARTIAL because the review lists it rather than demonstrating a role.

has_subtypes:
- name: Iatrogenic OHSS
  display_name: Iatrogenic OHSS (complication of controlled ovarian stimulation)
  description: >-
    The common form, and effectively the whole clinical burden of the syndrome.
    Exogenous gonadotropins given for assisted reproduction recruit a large
    cohort of follicles, and the hCG used to trigger final oocyte maturation —
    or the endogenous hCG of an implanting pregnancy — drives the VEGF surge
    that produces the capillary leak. Because both the stimulation and the
    trigger are under the clinician's control, this form is substantially
    preventable.
  evidence:
  - reference: PMID:15080154
    reference_title: "A mutation in the follicle-stimulating hormone receptor as a cause of familial spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ovarian hyperstimulation syndrome (OHSS) occurs mainly after excessive
      stimulation of the ovaries by exogenous gonadotropins administrated in
      the context of in vitro fertilization procedures (iatrogenic OHSS).
    explanation: >-
      Defines the iatrogenic subtype and states that it accounts for most cases.
- name: Familial Spontaneous OHSS
  display_name: Familial gestational spontaneous OHSS (FSHR-activating)
  description: >-
    A rare autosomal dominant form in which activating germline FSHR variants
    make the FSH receptor respond to hormones it should ignore. Affected women
    develop OHSS during spontaneous pregnancy, typically in the first
    trimester, with no fertility drug involved, and the syndrome recurs in
    successive pregnancies. This is the arm that gives MONDO:0011972 its
    hereditary-disease parent and its FSHR gene association.
  evidence:
  - reference: PMID:23941020
    reference_title: "Spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since 2003, only six different activating FSHr gene mutations have been
      reported in cases of familial or habitual sOHSS.
    explanation: >-
      Establishes the familial, FSHR-mutation-defined subtype as a distinct and
      rare entity.
  - reference: PMID:23941020
    reference_title: "Spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spontaneous forms of the ovarian hyperstimulation syndrome (sOHSS) are
      nearly always reported between 8 and 14 weeks of pregnancy
    explanation: >-
      Records the gestational timing that defines the spontaneous presentation.

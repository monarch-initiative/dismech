  - reference: PMID:26506672
    reference_title: "Non-invasive ventilation for the treatment of acute respiratory failure following ovarian hyperstimulation syndrome: report of two cases and a brief review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are only a few studies in English that describe severe respiratory
      failure treated with non-invasive ventilation, but all of them have had
      good outcomes.
    explanation: >-
      Supports the respiratory arm of drainage-plus-ventilation while flagging
      the thinness of the evidence base.
- name: Supportive Care of Established OHSS
  description: >-
    The surrounding management: rehydration to correct the intravascular deficit
    rather than the total-body excess - fluid resuscitation, not diuresis -
    monitoring of fluid balance, oxygen, and non-invasive ventilation when
    hypoxaemia is severe. Most cases are managed as outpatients; hospitalisation
    is reserved for the severe and critical end.

    The candid limitation, stated by the reviews themselves, is that this rests
    on consensus rather than trial evidence. The syndrome is self-limiting once
    the hCG stimulus falls, so the aim is to support the patient across that
    interval - which is also why the evidence base has never been built.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Third-Space Fluid Shift and Intravascular Volume Depletion
    treatment_effect: MODULATES
    description: >-
      Rehydration and fluid-balance monitoring are directed at the intravascular
      depletion side of the third-spacing paradox, not at the fluid overload that
      accompanies it.
    evidence:
    - reference: PMID:34644798
      reference_title: "Ovarian Hyperstimulation: Diagnosis, Prevention, and Management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Only if severe/critical cases are diagnosed hospitalization is necessary
        for appropriate rehydration, monitoring of fluid balance and eventual
        drainage of ascitic fluid.
      explanation: >-
        Names rehydration and fluid-balance monitoring as the interventions
        directed at this node.
  evidence:
  - reference: PMID:27273307
    reference_title: "Pathophysiology, treatment and prevention of ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment is largely supportive and is based mainly on consensus
      statements rather than evidence.
    explanation: >-
      States plainly that established-disease management rests on consensus, not
      trial evidence - an important limit on any treatment claim here.
  - reference: PMID:34644798
    reference_title: "Ovarian Hyperstimulation: Diagnosis, Prevention, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When OHSS occurs, it can usually be managed as outpatient care.
    explanation: >-
      Establishes that most established disease does not require admission,
      which is what the supportive strategy is scaled against.
- name: Risk Stratification Before Ovarian Stimulation
  description: >-
    Not a treatment of the syndrome but the intervention with the largest effect
    on it, and the reason it is included: the identified risk factors — young
    age, polycystic ovary syndrome, a previous hyper-response — and the
    quantitative markers anti-Mullerian hormone and antral follicle count are
    what let the clinician choose a milder protocol, an agonist trigger, or a
    freeze-all strategy before any stimulation begins. It is deliberately not
    linked to a pathophysiology node: identifying a susceptible woman does not
    itself act on any step of the causal chain.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Preventive Intervention
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  notes: >-
    Bound to Preventive Intervention rather than Supportive Care. Supportive Care
    (NCIT:C15747) is symptom-directed care of an established illness; this is
    risk assessment before any stimulation has begun, so that term would validate
    while being misleading - worse than no term. Health Risk Assessment
    (NCIT:C15367) would be the exact concept but is not reachable from
    NCIT:C25218 and so fails the TreatmentTerm enum.
  evidence:
  - reference: PMID:24848075
    reference_title: "Ovarian stimulation in patients in risk of OHSS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some well-established risk factors that could rise the risk of OHSS
      include young age, polycystic ovary syndrome, prior hyper-response/OHSS.
    explanation: >-
      Names the established clinical risk factors used for stratification.
  - reference: PMID:24848075
    reference_title: "Ovarian stimulation in patients in risk of OHSS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In recent years research has focus on identifying biomarkers/hormonal
      markers that could represent potential predictors of OHSS
      (anti-Mullerian hormone and antral follicle count).
    explanation: >-
      Records the two quantitative predictors used to grade ovarian reserve
      before stimulation.
  - reference: PMID:38099867
    reference_title: "Prevention of moderate and severe ovarian hyperstimulation syndrome: a guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This systematic review aims to identify who is at high risk for developing
      ovarian hyperstimulation syndrome, along with evidence-based strategies to
      prevent it and replaces the document of the same name last published in
      2016.
    explanation: >-
      Establishes that risk identification plus prevention is the subject of the
      current professional-society guideline.
experimental_models:
- name: SVOG human granulosa-lutein cell line with Tie1 silencing
  description: >-
    A non-tumorigenic human granulosa-lutein cell line in which acute hCG raises
    Tie1 and VEGF, and in which silencing Tie1 abolishes the hCG-induced VEGF
    rise. This is the loss-of-function experiment the entry's EGR1-TIE1 node
    actually rests on, and recording it structurally means the PROVISIONAL status
    of that node is traceable to a named system with stated limits rather than
    asserted in prose.
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: Granulosa-lutein cell
    term:
      id: CL:0000501
      label: granulosa cell
  publication: PMID:35079118
  modeled_mechanisms:
  - target: EGR1-TIE1 Amplification of Granulosa VEGF Output
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Tie1 knockdown removes the hCG-to-VEGF link in a human granulosa-lutein
      background, which is what makes Tie1 a candidate required step rather than
      a correlate.
    limitations: >-
      An immortalised cell line, not primary patient granulosa cells and not an
      ovary. Acute high-dose hCG in culture compresses a stimulus that acts over
      days in vivo, and a cell line cannot reproduce the paracrine and vascular
      context in which the VEGF surge matters. The reporting authors state that
      clinical relevance is not yet addressed.
    readouts:
    - name: hCG-induced VEGF level after Tie1 silencing
      target: EGR1-TIE1 Amplification of Granulosa VEGF Output
      direction: ABOLISHED
      interpretation: >-
        The hCG-driven VEGF rise does not occur without Tie1, placing Tie1
        between the hCG signal and VEGF output.
      evidence:
      - reference: PMID:35079118
        reference_title: "Tie1 contributes to the development of ovarian hyperstimulation syndrome under the regulation of EGR1 in granulosa cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Tie1 silencing abolished the hCG-induced VEGF level in SVOG cells
        explanation: >-
          The knockdown readout in the human granulosa-lutein line, quoted apart
          from the rat clause of the same sentence.
    - name: EGR1 binding at the Tie1 promoter
      target: EGR1-TIE1 Amplification of Granulosa VEGF Output
      direction: INCREASED
      interpretation: >-
        Identifies the transcriptional route by which hCG raises Tie1, rather
        than leaving the induction unexplained.
      evidence:
      - reference: PMID:35079118
        reference_title: "Tie1 contributes to the development of ovarian hyperstimulation syndrome under the regulation of EGR1 in granulosa cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          We also report that early growth response protein 1 (EGR1), whose
          expression was also upregulated by hCG, bound directly to the Tie1
          promoter and activated its transcription.
        explanation: >-
          The promoter-binding readout.
    evidence:
    - reference: PMID:35079118
      reference_title: "Tie1 contributes to the development of ovarian hyperstimulation syndrome under the regulation of EGR1 in granulosa cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Further studies in SVOG cells revealed that the hCG-induced upregulation
        of Tie1 expression involved the phosphoinositide 3-kinase/protein kinase
        B signaling pathway.
      explanation: >-
        The signalling route established in this cell line - correctly tagged
        IN_VITRO, SVOG being a human granulosa-lutein line rather than an animal
        system.
    - reference: PMID:35079118
      reference_title: "Tie1 contributes to the development of ovarian hyperstimulation syndrome under the regulation of EGR1 in granulosa cells."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        Taken together, our results indicate that Tie1 may be a therapeutic
        target in cases of moderate-to-severe OHSS. Further studies are needed to
        address its clinical relevance.
      explanation: >-
        The authors' own statement of the translational gap, which is why this
        model supports a PROVISIONAL node rather than an established one.
animal_models:
- name: Induced-OHSS rat with ovarian Tie1 knockdown
  species: Rat
  genotype: Wild type with shRNA-mediated ovarian Tie1 knockdown
  publication: PMID:35079118
  description: >-
    An experimentally established OHSS rat model in which ovaries show raised
    Tie1 and VEGF relative to controls, and in which knocking Tie1 down
    attenuates the syndrome histologically. It is the in vivo half of the
    evidence for the EGR1-TIE1 node - the cell line shows the molecular link, the
    rat shows that interrupting it changes the disease.
  modeled_mechanisms:
  - target: EGR1-TIE1 Amplification of Granulosa VEGF Output
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Tie1 knockdown attenuates OHSS progression in the rat model, which is the
      whole-organism counterpart of the abolished VEGF rise seen in the cell
      line.
    limitations: >-
      Rat ovarian physiology differs from human in cycle length and in the
      relative roles of FSH and hCG, and an experimentally induced OHSS model
      compresses the stimulus into a schedule no patient experiences. The
      histological attenuation is also a structural rather than a functional
      readout: no measurement of vascular permeability or third-space fluid in
      the treated animals is reported.
    readouts:
    - name: Ovarian Tie1 and VEGF expression in induced OHSS
      target: EGR1-TIE1 Amplification of Granulosa VEGF Output
      direction: INCREASED
      interpretation: >-
        Both rise together in the model, matching the association seen in
        patient-derived granulosa cells.
      evidence:
      - reference: PMID:35079118
        reference_title: "Tie1 contributes to the development of ovarian hyperstimulation syndrome under the regulation of EGR1 in granulosa cells."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          as well as ovaries from rats with experimentally established OHSS,
          compared to controls
        explanation: >-
          The rat half of the expression result, quoted separately from the
          patient-cell half so this MODEL_ORGANISM item does not also carry an
          in vitro claim.
    - name: Histological progression of OHSS after Tie1 knockdown
      target: EGR1-TIE1 Amplification of Granulosa VEGF Output
      direction: DECREASED
      interpretation: >-
        Interrupting the proposed amplifier attenuates the disease in vivo, which
        is the strongest claim available for this node.
      evidence:
      - reference: PMID:35079118
        reference_title: "Tie1 contributes to the development of ovarian hyperstimulation syndrome under the regulation of EGR1 in granulosa cells."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          attenuated the progression of OHSS in rats, as determined by
          histological analysis.
        explanation: >-
          The in vivo attenuation readout and the method behind it, quoted apart
          from the cell-line clause of the same sentence.
    evidence:
    - reference: PMID:35079118
      reference_title: "Tie1 contributes to the development of ovarian hyperstimulation syndrome under the regulation of EGR1 in granulosa cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ovaries harvested from control and experimentally induced OHSS rats, as
        well as those from OHSS rats subjected to Tie1 or nontargeting silencing,
        were used for histological analysis.
      explanation: >-
        Describes the rat model and its knockdown arm directly, which is the
        claim link-level evidence should make: that THIS model is informative for
        the target node. (The previous snippet here quoted an SVOG cell-line
        result, which is neither rat nor in vivo; it is now curated on the SVOG
        experimental model where it belongs.)
    - reference: PMID:35079118
      reference_title: "Tie1 contributes to the development of ovarian hyperstimulation syndrome under the regulation of EGR1 in granulosa cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Tie1 silencing attenuates the progression of experimentally induced OHSS
        in rats.
      explanation: >-
        States the in vivo result the model is curated for.
- name: Prolactin-supplemented OHSS rat model of VEGFR-2-dependent permeability
  species: Rat
  background: Wistar
  genotype: Wild type, gonadotropin-induced OHSS with prolactin supplementation
  publication: PMID:16901966
  description: >-
    The well-established rodent OHSS model in which the causal role of VEGFR-2 in
    the permeability rise was demonstrated, first by blockade with the antagonist
    SU5416 and then by dose-separating the receptor's permeability and angiogenic
    functions with low-dose cabergoline. Almost everything the entry asserts
    about VEGFR-2 being the modifiable node comes from this system, so it is
    recorded structurally rather than left implicit in the treatment description.
  modeled_mechanisms:
  - target: VEGFR-2 Activation on Vascular Endothelium
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Pharmacological manipulation of VEGFR-2 in this model - blockade with
      SU5416, partial dephosphorylation with low-dose cabergoline - is what
      establishes the receptor as necessary for the permeability rise and as
      separable from luteal angiogenesis.
    limitations: >-
      Rat, and a prolactin-supplemented model at that, because the dopamine-agonist
      arm requires a prolactin-responsive background that human OHSS does not
      have. The dose that separates permeability from angiogenesis was found in
      this species; the human prophylactic dose was chosen by extrapolation, and
      the clinical result reported alongside it is an uncontrolled comparison in
      oocyte donors rather than a randomised trial.
    readouts:
    - name: Vascular permeability after VEGFR-2 blockade
      target: VEGFR-2 Activation on Vascular Endothelium
      direction: ABOLISHED
      interpretation: >-
        Removing VEGFR-2 activity prevents the permeability rise, establishing
        necessity rather than association.
      evidence:
      - reference: PMID:16901966
        reference_title: "Low-dose dopamine agonist administration blocks vascular endothelial growth factor (VEGF)-mediated vascular hyperpermeability without altering VEGF receptor 2-dependent luteal angiogenesis in a rat ovarian hyperstimulation model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We previously demonstrated in an OHSS rodent model that increased VP
          was prevented by inactivating VEGFR-2 with a receptor antagonist
          (SU5416).
        explanation: >-
          The blockade readout.
    - name: Ovarian VEGFR-2 phosphorylation under low-dose cabergoline
      target: VEGFR-2 Activation on Vascular Endothelium
      direction: DECREASED
      interpretation: >-
        Partial dephosphorylation is enough to abolish the permeability response
        while sparing luteal angiogenesis, which is the dose-separation result
        the whole therapeutic strategy depends on.
      evidence:
      - reference: PMID:16901966
        reference_title: "Low-dose dopamine agonist administration blocks vascular endothelial growth factor (VEGF)-mediated vascular hyperpermeability without altering VEGF receptor 2-dependent luteal angiogenesis in a rat ovarian hyperstimulation model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          A 100 microg/kg low-dose Dp-r2 agonist cabergoline reversed
          VEGFR-2-dependent VP without affecting luteal angiogenesis through
          partial inhibition of ovarian VEGFR-2 phosphorylation levels.
        explanation: >-
          The dose-separation readout.
    - name: Serum progesterone and luteal apoptosis under cabergoline
      target: VEGFR-2 Activation on Vascular Endothelium
      direction: UNCHANGED
      interpretation: >-
        A deliberate negative result: the corpus luteum is not damaged at the
        effective dose, which is what makes the intervention compatible with an
        ongoing pregnancy.
      evidence:
      - reference: PMID:16901966
        reference_title: "Low-dose dopamine agonist administration blocks vascular endothelial growth factor (VEGF)-mediated vascular hyperpermeability without altering VEGF receptor 2-dependent luteal angiogenesis in a rat ovarian hyperstimulation model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          No luteolytic effects (serum progesterone levels and luteal apoptosis
          unaffected) were observed.
        explanation: >-
          The negative readout establishing luteal safety at the effective dose.
    evidence:
    - reference: PMID:16901966
      reference_title: "Low-dose dopamine agonist administration blocks vascular endothelial growth factor (VEGF)-mediated vascular hyperpermeability without altering VEGF receptor 2-dependent luteal angiogenesis in a rat ovarian hyperstimulation model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        To test whether VEGFR-2-dependent VP and angiogenesis could be segregated
        in a dose-dependent fashion with the Dp-r2 agonist cabergoline, a
        well-established OHSS rat model supplemented with prolactin was used.
      explanation: >-
        Names the model and the question it was built to answer.


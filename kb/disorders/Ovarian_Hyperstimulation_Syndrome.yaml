- name: Promiscuous Activation of the Wild-Type FSH Receptor
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    A third, non-genetic and non-iatrogenic entry point that the same receptor
    biology predicts. The wild-type FSH receptor is not perfectly specific
    either; it is simply that the physiological concentrations of hCG and TSH
    never reach the threshold at which cross-activation matters. When they do —
    the very high hCG of a multiple or hydatidiform-molar pregnancy, the very
    high TSH of untreated hypothyroidism, or autonomous FSH secretion from a
    pituitary adenoma — the syndrome can occur sporadically in a woman with a
    normal FSHR. This is why an FSHR variant should not be assumed in every
    spontaneous case.
  biological_processes:
  - preferred_term: follicle-stimulating hormone signaling pathway
    modifier: INCREASED
    term:
      id: GO:0042699
      label: follicle-stimulating hormone signaling pathway
  evidence:
  - reference: PMID:23941020
    reference_title: "Spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The syndrome has been previously reported in rare instances of increased
      production of human chorionic gonadotrophin (hCG) such as multiple
      pregnancies, hydatiforme mole, polycystic ovary disease and elevated
      concentrations of thyroid-stimulating hormone (TSH) in hypothyreoidism.
    explanation: >-
      Enumerates the clinical settings in which excess hCG or TSH precipitates
      the syndrome without a fertility drug.
  - reference: PMID:23941020
    reference_title: "Spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High levels of these hormones are able to stimulate by natural
      promiscuous activation the wild-type FSHr, resulting in sporadic
      presentations of the syndrome.
    explanation: >-
      States explicitly that a normal FSH receptor can be cross-activated when
      ligand concentrations are high enough.
  downstream:
  - target: Multifollicular Recruitment and Luteinization
    causal_link_type: DIRECT
    description: >-
      Cross-activation of the normal receptor drives the same follicular
      response as the mutant receptor does.
- name: Multifollicular Recruitment and Luteinization
  biological_scale: TISSUE
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Whichever route opened it, sustained FSH receptor signalling rescues a large
    cohort of antral follicles from atresia and then, on exposure to the LH-like
    signal of hCG, luteinizes them together. The result is an ovary containing
    many simultaneously luteinized follicles rather than one corpus luteum. That
    expanded mass of luteinized granulosa tissue is the secretory organ of the
    syndrome — the amount of VEGF released downstream scales with how much of it
    there is, which is why follicle number and oestradiol level predict risk.
  biological_processes:
  - preferred_term: ovarian follicle development
    modifier: INCREASED
    term:
      id: GO:0001541
      label: ovarian follicle development
  - preferred_term: luteinization
    modifier: INCREASED
    term:
      id: GO:0001553
      label: luteinization
  cell_types:

  - reference: PMID:17721928
    reference_title: "Identification of the first germline mutation in the extracellular domain of the follitropin receptor responsible for spontaneous ovarian hyperstimulation syndrome."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Contrary to the mutations described previously, the p.Ser128Tyr FSHR

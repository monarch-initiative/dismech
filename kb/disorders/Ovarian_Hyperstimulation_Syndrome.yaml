- name: VEGFR-2 Activation on Vascular Endothelium
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The receptor-level step, and the point every effective therapy acts on.
    Circulating VEGF-A binds VEGF receptor 2 on vascular endothelium and
    triggers its phosphorylation. Two experiments in the rodent model make this
    causal rather than correlative: blocking VEGFR-2 with the antagonist SU5416
    prevents the downstream permeability rise, and a low dose of the dopamine
    agonist cabergoline reverses it by partially dephosphorylating ovarian
    VEGFR-2.

    The therapeutic problem lives entirely at this node rather than downstream
    of it, which is why it is worth separating: the same receptor also drives
    the luteal angiogenesis a pregnancy needs, so the task is dose-separating
    two functions of one receptor, not blocking it.

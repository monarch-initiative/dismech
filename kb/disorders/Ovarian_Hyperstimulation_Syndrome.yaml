- name: Third-Space Fluid Shift and Intravascular Volume Depletion
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    The systemic pivot of the illness. Protein-rich fluid leaving the permeable
    vasculature accumulates as ascites and pleural effusion while the
    intravascular compartment is simultaneously depleted, so the patient is
    fluid-overloaded and hypovolaemic at once. That paradox is the whole
    management problem: the visible fluid must not be treated as excess. The
    accompanying picture is rapid weight gain, haemoconcentration,
    leukocytosis, hyponatraemia and hyperkalaemia.
  evidence:
  - reference: PMID:26506672
    reference_title: "Non-invasive ventilation for the treatment of acute respiratory failure following ovarian hyperstimulation syndrome: report of two cases and a brief review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical signs may include any or all of the following: rapid weight
      gain, ascites, oliguria, hemoconcentration, leukocytosis, along with
      intravascular hypovolemia, hyponatremia, and hyperkalemia.
    explanation: >-
      Enumerates the third-spacing syndrome, including the simultaneous ascites
      and intravascular hypovolaemia that define it.
  downstream:
  - target: Hypercoagulability and Thromboembolism
    causal_link_type: DIRECT
    description: >-
      Haemoconcentration and reduced flow in a depleted intravascular
      compartment favour thrombus formation.
    evidence:
    - reference: PMID:26506672
      reference_title: "Non-invasive ventilation for the treatment of acute respiratory failure following ovarian hyperstimulation syndrome: report of two cases and a brief review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        If the patient is not diagnosed early, ascites, pleural and more rarely
        pericardial effusions, severe respiratory failure and ARDS,
        hypercoagulability with tromboembolism and multiple organ system failure
        can occur.
      explanation: >-
        Places hypercoagulability downstream of the ascitic/third-spacing phase
        in the clinical sequence.
  - target: Renal Hypoperfusion and Oliguria
    causal_link_type: DIRECT
    description: >-
      Reduced effective circulating volume lowers renal perfusion.
  - target: Pleural Effusion and Respiratory Failure
    causal_link_type: DIRECT
    description: >-
      Fluid entering the pleural space, together with a splinted diaphragm from
      tense ascites, compromises gas exchange.
- name: Hypercoagulability and Thromboembolism
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    One of the two complications that kill in this syndrome. Haemoconcentration
    from plasma loss into the third space, combined with reduced venous return
    and the prothrombotic state of the high-oestrogen luteal phase or early
    pregnancy, produces venous and occasionally arterial thrombosis. It is the
    reason thromboprophylaxis is a standing part of managing severe disease
    rather than a response to a clot that has already happened.
  evidence:
  - reference: PMID:26506672
    reference_title: "Non-invasive ventilation for the treatment of acute respiratory failure following ovarian hyperstimulation syndrome: report of two cases and a brief review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If the patient is not diagnosed early, ascites, pleural and more rarely
      pericardial effusions, severe respiratory failure and ARDS,
      hypercoagulability with tromboembolism and multiple organ system failure
      can occur.
    explanation: >-
      Places hypercoagulability and thromboembolism among the severe
      consequences of untreated third-spacing.
- name: Renal Hypoperfusion and Oliguria
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    Falling effective circulating volume reduces renal perfusion, producing
    oliguria and, at the severe end, acute kidney injury requiring intensive
    care. The kidney here is a bystander reporting the intravascular volume
    state, which is why urine output is used as the bedside index of severity.
  evidence:
  - reference: PMID:26506672
    reference_title: "Non-invasive ventilation for the treatment of acute respiratory failure following ovarian hyperstimulation syndrome: report of two cases and a brief review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The severe form of OHSS varies between 0.5% and 5%, depending on the
      population studied: intensive care may be required for management of
      tromboembolic complications, renal failure and severe respiratory
      failure.
    explanation: >-
      Identifies renal failure as one of the intensive-care-level complications
      of the severe syndrome.
- name: Pleural Effusion and Respiratory Failure
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    The other lethal arm. Fluid crossing into the pleural space, with the
    diaphragm splinted by tense ascites, produces hypoxaemic respiratory
    failure that can reach ARDS. In the two reported cases managed with
    non-invasive ventilation the impairment was severe by objective criteria
    (PaO2/FiO2 below 200), which is the level at which the illness stops being
    a gynaecological complication and becomes a respiratory one.
  evidence:
  - reference: PMID:26506672
    reference_title: "Non-invasive ventilation for the treatment of acute respiratory failure following ovarian hyperstimulation syndrome: report of two cases and a brief review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe two cases of women with extremely severe OHSS presenting
      bilateral pleural effusions, and severe respiratory failure (paO2/FiO2 <
      200) treated with non-invasive ventilation (NIV).
    explanation: >-
      Documents pleural effusion with objectively severe hypoxaemic respiratory
      failure as a presentation of the syndrome.
  - reference: PMID:26506672
    reference_title: "Non-invasive ventilation for the treatment of acute respiratory failure following ovarian hyperstimulation syndrome: report of two cases and a brief review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Due to the increased use of therapeutic strategies for infertility
      (particularly those using human chorionic gonadotropin), the systemic,
      particularly the pulmonary, complications of this syndrome must be
      identified early to allow appropriate diagnosis and management.
    explanation: >-
      Connects the pulmonary complication back to hCG-based fertility treatment
      as its driver.

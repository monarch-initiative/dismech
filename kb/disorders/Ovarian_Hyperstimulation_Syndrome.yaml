    intravascular compartment is simultaneously depleted, so the patient is
    fluid-overloaded and hypovolaemic at once. That paradox is the whole
    management problem: the visible fluid must not be treated as excess. The
    accompanying picture is rapid weight gain, haemoconcentration,
    leukocytosis, hyponatraemia and hyperkalaemia.

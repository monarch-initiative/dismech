genetic:
- name: FSHR
  gene_term:
    preferred_term: FSHR
    term:
      id: hgnc:3969
      label: FSHR
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  subtype: Familial Spontaneous OHSS
  notes: >-
    FSHR (2p16.3) encodes the follitropin receptor, one of the three
    glycoprotein hormone receptors. Activating germline missense variants cause
    the familial gestational spontaneous form, and this is the gene MONDO
    records as causally associated with MONDO:0011972. Two structurally
    distinct mutation classes have been reported: transmembrane-helix variants
    (p.Thr449Ile, p.Thr449Ala, p.Asp567Asn, p.Asp567Gly, p.Ile545Thr) that
    lower the receptor's intramolecular activation barrier, giving hCG and TSH
    responsiveness plus constitutive activity; and a single extracellular-domain
    variant (c.383C>A, p.Ser128Tyr) that instead raises hCG binding affinity
    with no constitutive activity and no TSH cross-reactivity. Both classes are
    heterozygous in the reported families. Note that FSHR variants explain the
    *familial* spontaneous cases only — sporadic spontaneous OHSS occurs with a
    normal receptor when hCG or TSH is high enough.
  evidence:
  - reference: PMID:23941020
    reference_title: "Spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition to five mutations which have been found in the transmembrane
      helices (Asp567Asn, Asp567Gly, Thr449Ile, Thr449Ala, Ile545Thr), the
      first germline mutation (c.383C > A, p. Ser 128 Tyr) in the extracelullar
      domain was identified.
    explanation: >-
      Enumerates the reported activating FSHR alleles and their two structural
      classes.
  - reference: PMID:23941020
    reference_title: "Spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All five mutants were abnormally activated by TSH and normal levels of
      hCG while displaying constitutive activity.
    explanation: >-
      Gives the shared functional signature of the transmembrane-helix class.
  - reference: PMID:15080154
    reference_title: "A mutation in the follicle-stimulating hormone receptor as a cause of familial spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Together with the two previous studies, this report shows that
      inappropriate stimulation of the FSHr by hCG is a cause of spontaneous
      OHSS.
    explanation: >-
      States the causal conclusion drawn across three independent families.
treatments:
- name: Cabergoline
  description: >-
    A dopamine D2 receptor agonist given prophylactically to women identified as
    high risk. Its mechanism in this setting is specific and dose-dependent: at
    low dose it partially dephosphorylates ovarian VEGFR-2, which is enough to
    abolish the permeability response while leaving the VEGFR-2-dependent luteal
    angiogenesis a pregnancy requires intact. That separation is the reason a
    dopamine agonist is usable here where a direct VEGFR-2 antagonist such as
    SU5416 is not — SU5416 prevented the leak in the rodent model but is
    thromboembolic and disrupts angiogenesis needed for pregnancy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cabergoline
      term:
        id: CHEBI:3286
        label: cabergoline
  target_mechanisms:
  - target: VEGFR-2 Activation on Vascular Endothelium
    treatment_effect: INHIBITS
    description: >-
      Low-dose cabergoline partially inhibits ovarian VEGFR-2 phosphorylation,
      reversing the VEGFR-2-dependent rise in vascular permeability without
      blocking luteal angiogenesis.
    evidence:
    - reference: PMID:16901966
      reference_title: "Low-dose dopamine agonist administration blocks vascular endothelial growth factor (VEGF)-mediated vascular hyperpermeability without altering VEGF receptor 2-dependent luteal angiogenesis in a rat ovarian hyperstimulation model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        A 100 microg/kg low-dose Dp-r2 agonist cabergoline reversed
        VEGFR-2-dependent VP without affecting luteal angiogenesis through
        partial inhibition of ovarian VEGFR-2 phosphorylation levels.
      explanation: >-
        Identifies VEGFR-2 phosphorylation as the molecular target of the drug
        at the node it is linked to.
  evidence:
  - reference: PMID:16901966
    reference_title: "Low-dose dopamine agonist administration blocks vascular endothelial growth factor (VEGF)-mediated vascular hyperpermeability without altering VEGF receptor 2-dependent luteal angiogenesis in a rat ovarian hyperstimulation model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prophylactic administration of cabergoline (5-10 microg/kg x d) decreased
      the occurrence of OHSS from 65% (controls) to 25% (treatment).
    explanation: >-
      Quantifies the clinical prophylactic effect in high-risk oocyte donors.
  - reference: PMID:16901966
    reference_title: "Low-dose dopamine agonist administration blocks vascular endothelial growth factor (VEGF)-mediated vascular hyperpermeability without altering VEGF receptor 2-dependent luteal angiogenesis in a rat ovarian hyperstimulation model."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, due to its toxicity (thromboembolism) and disruption of
      VEGFR-2-dependent angiogenic processes critical for pregnancy, this kind
      of compound cannot be used clinically to prevent OHSS.
    explanation: >-
      Records why direct VEGFR-2 antagonism was abandoned, which is the
      rationale for choosing a dopamine agonist instead.
- name: GnRH Agonist Trigger in a GnRH Antagonist Cycle
  description: >-
    The single most effective preventive change to the stimulation protocol.
    Substituting a GnRH agonist for hCG to trigger final oocyte maturation
    removes the long-acting hCG stimulus that drives ovarian VEGF secretion,
    replacing it with a short endogenous LH surge. The trade-off is a deficient
    luteal phase, which is why the strategy is paired with luteal support or
    with elective freezing of all embryos; a meta-analysis of five randomised
    trials found live birth rates comparable to an hCG trigger when LH activity
    luteal support was individualised.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: hCG-Driven Luteinization of the Recruited Cohort
    treatment_effect: INHIBITS
    description: >-
      The substitution acts on luteinization, not on recruitment: the follicles
      are still recruited, but a short endogenous LH surge replaces the
      long-acting hCG stimulus that luteinizes the whole cohort and drives the
      downstream VEGF surge.
    evidence:
    - reference: PMID:28638367
      reference_title: "GnRH Agonist Trigger and LH Activity Luteal Phase Support versus hCG Trigger and Conventional Luteal Phase Support in Fresh Embryo Transfer IVF/ICSI Cycles-A Systematic PRISMA Review and Meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The use of GnRH agonist (GnRHa) for final oocyte maturation trigger in
        oocyte donation and elective frozen embryo transfer cycles is well
        established due to lower ovarian hyperstimulation syndrome (OHSS) rates
        as compared to hCG trigger.
      explanation: >-
        Establishes that replacing the hCG trigger lowers OHSS rates, the
        clinical read-out of suppressing the VEGF surge.
  evidence:
  - reference: PMID:28638367
    reference_title: "GnRH Agonist Trigger and LH Activity Luteal Phase Support versus hCG Trigger and Conventional Luteal Phase Support in Fresh Embryo Transfer IVF/ICSI Cycles-A Systematic PRISMA Review and Meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      OHSS was reported in a total of 4/413 cases in the GnRHa group compared to
      7/413 in the hCG group (OR 0.48, 95% CI 0.15, 1.60).
    explanation: >-
      Gives the effect estimate in fresh-transfer cycles specifically, where the
      confidence interval crosses unity — the benefit is established in donor
      and freeze-all cycles, not demonstrated in this subgroup.
  - reference: PMID:28638367
    reference_title: "GnRH Agonist Trigger and LH Activity Luteal Phase Support versus hCG Trigger and Conventional Luteal Phase Support in Fresh Embryo Transfer IVF/ICSI Cycles-A Systematic PRISMA Review and Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GnRHa trigger with LH activity LPS resulted in comparable LBRs compared to
      hCG trigger.
    explanation: >-
      Records that the preventive substitution need not cost live births when
      luteal support is individualised.
  - reference: PMID:27273307
    reference_title: "Pathophysiology, treatment and prevention of ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, it is important to prevent this condition by identifying women
      at risk, allowing the clinician to implement preventive strategies,
      including the use of GnRH antagonist cycles with agonist triggers.
    explanation: >-
      States the antagonist-cycle-plus-agonist-trigger strategy as the
      recommended preventive approach.
- name: Intravenous Calcium for OHSS Prophylaxis
  description: >-
    Intravenous calcium given around oocyte retrieval, and on the current network
    meta-analytic evidence the most effective prophylaxis available - ranked
    above cabergoline in both published network meta-analyses, with a risk ratio
    of 0.14 for moderate-to-severe OHSS at high GRADE and a SUCRA of 92.4%.

    Its proposed mechanism is now curated as a node rather than waved at: calcium
    is thought to inhibit cyclic-AMP-stimulated renin secretion, damping the
    intra-ovarian renin-angiotensin system that gonadotropin stimulation
    activates, and so lowering VEGF expression in luteinized granulosa cells. An
    earlier revision of this entry claimed no verifiable source for that arm
    existed; that was wrong, and both network meta-analyses cited here state it.

    The caveat that remains is about strength, not existence. Both sources hedge
    ("could be by inhibiting"), neither cites a primary demonstration in an OHSS
    cohort, and the node is curated PROVISIONAL for that reason. This is still
    the entry's clearest example of a therapy whose efficacy evidence outruns its
    mechanistic evidence - it just is not a therapy with no mechanism on record.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: calcium
      term:
        id: CHEBI:29108
        label: calcium(2+)
  target_mechanisms:
  - target: Ovarian Renin-Angiotensin System Activation
    treatment_effect: INHIBITS
    description: >-
      Calcium is proposed to inhibit cyclic-AMP-stimulated renin secretion,
      damping the intra-ovarian renin-angiotensin arm and so reducing VEGF
      expression in luteinized granulosa cells.
    evidence:
    - reference: PMID:35154015
      reference_title: "Comparison of the Effectiveness of Various Medicines in the Prevention of Ovarian Hyperstimulation Syndrome: A Network Meta-Analysis of Randomized Controlled Trials."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The possible underlying mechanism of calcium preventing OHSS could be by
        inhibiting cyclic adenosine monophosphate-stimulated renin secretion,
        which reduces the production of angiotensin-converting enzyme II
      explanation: >-
        States the proposed target of the drug at this node, with the authors'
        own hedge intact.
    - reference: PMID:26752241
      reference_title: "Pharmacologic Interventions in Preventing Ovarian Hyperstimulation Syndrome: A Systematic Review and Network Meta-Analysis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        IV calcium is a relatively new method for preventing severe OHSS from
        occurring by inhibiting the renin-angiotensin system (RAS) and,
        consequently, reducing VEGF concentration.
      explanation: >-
        Independent statement of the same proposed mechanism of action.
  evidence:
  - reference: PMID:35154015
    reference_title: "Comparison of the Effectiveness of Various Medicines in the Prevention of Ovarian Hyperstimulation Syndrome: A Network Meta-Analysis of Randomized Controlled Trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of moderate-to-severe OHSS was significantly reduced by
      calcium administration (risk ratios [RR] 0.14, 95% confidence interval
      [CI]: 0.04, 0.46) (grade: high), HES (RR 0.25, 95% CI 0.07, 0.73) (grade:
      high), and cabergoline (RR 0.43, 95% CI 0.24, 0.71) (grade: moderate).
    explanation: >-
      Gives the effect estimate and GRADE rating for calcium, alongside the two
      comparators, from a network meta-analysis of randomized trials.
  - reference: PMID:35154015
    reference_title: "Comparison of the Effectiveness of Various Medicines in the Prevention of Ovarian Hyperstimulation Syndrome: A Network Meta-Analysis of Randomized Controlled Trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The surface under the cumulative ranking curve (SUCRA) indicated that
      calcium (SUCRA, 92.4%) was the most effective intervention for preventing
      moderate-to-severe OHSS.
    explanation: >-
      Ranks calcium above every other prophylactic agent assessed, including
      cabergoline.
  - reference: PMID:26752241
    reference_title: "Pharmacologic Interventions in Preventing Ovarian Hyperstimulation Syndrome: A Systematic Review and Network Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The rank probability demonstrated aspirin (Rank 1: 36%) and IV calcium
      (Rank 1: 35%) to be the most efficacious.
    explanation: >-
      An independent network meta-analysis reaching a concordant ranking for
      intravenous calcium.
- name: Hydroxyethyl Starch for OHSS Prophylaxis
  description: >-
    Intravenous hydroxyethyl starch, a plasma volume expander given around
    retrieval. Both network meta-analyses find it effective (RR 0.25 and RR 0.26)
    and one grades the evidence high. Its rationale is the one intervention on
    this entry that acts on the consequence rather than the cause: it counters the
    intravascular volume depletion produced by the capillary leak instead of
    reducing the leak itself, which is why it is linked to the third-space node
    and not to a VEGF node.

    A note on the binding: NCIT's own "Hydroxyethyl Starch" concept
    (NCIT:C102744) is retired and is not reachable from Pharmacologic Substance,
    so `just validate-terms` rejects it. The live term is NCIT:C559 Hetastarch,
    which is what the agent is bound to; `preferred_term` keeps the name the
    trials use.

    Curators should note the context this evidence sits in: hydroxyethyl starch
    carries regulatory restrictions in critical care for renal and mortality
    concerns, and the cited meta-analyses assess OHSS outcomes only. This entry
    records the OHSS efficacy finding, not a recommendation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxyethyl starch
      term:
        id: NCIT:C559
        label: Hetastarch
  target_mechanisms:
  - target: Third-Space Fluid Shift and Intravascular Volume Depletion
    treatment_effect: MODULATES
    description: >-
      A colloid volume expander opposes the fall in effective circulating volume
      caused by the leak; it does not act on the permeability lesion upstream.
    evidence:

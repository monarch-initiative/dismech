  description: >-
    The iatrogenic entry point. Controlled ovarian stimulation delivers
    gonadotropin at doses far above the physiological mid-follicular range, so
    the FSH receptor on granulosa cells is occupied well beyond what a natural
    cycle achieves and the normal selection of a single dominant follicle is
    overridden. Nothing about the receptor is abnormal here — the ligand supply
    is.

        Gokman et al. 10 demonstrated that the administration of albumin and
        hydroxyethyl starch (HES) might prevent moderate to severe OHSS in
        high-risk patients.
      explanation: >-
        Records the colloid rationale and the outcome it is credited with.
  evidence:
  - reference: PMID:35154015
    reference_title: "Comparison of the Effectiveness of Various Medicines in the Prevention of Ovarian Hyperstimulation Syndrome: A Network Meta-Analysis of Randomized Controlled Trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Calcium, HES, and cabergoline could effectively and safely prevent
      moderate-to-severe OHSS, with calcium as the most effective intervention.
    explanation: >-
      The meta-analysis conclusion naming HES among the three effective agents.
- name: Metformin for OHSS Prophylaxis
  description: >-
    Metformin given to women at risk, principally those with polycystic ovary
    syndrome, where it is already indicated for the underlying insulin
    resistance. One network meta-analysis finds a risk ratio of 0.20; the other
    did not assess it as effective, and it does not appear among the three agents
    that meta-analysis concludes for. It is curated because a Phase II-plus
    evidence base exists and because the discordance between the two analyses is
    itself worth recording, not because the case is settled.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

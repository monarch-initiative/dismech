    explanation: >-
      The later meta-analysis assessed metformin but does not include it among
      the effective agents - the discordance this treatment's description
      records.
- name: Albumin for OHSS Prophylaxis
  description: >-
    Intravenous albumin around oocyte retrieval, curated here specifically
    BECAUSE the signal is unfavourable rather than despite it. Albumin has been
    widely used on the colloid rationale, but the earlier network meta-analysis
    found it associated with a lower pregnancy rate than placebo (RR 0.85, 95% CI
    0.74-0.97), and the later one does not include it among the effective
    preventive agents.

    A prophylaxis that may cost the pregnancy the whole treatment cycle exists to
    achieve is a different kind of intervention from one that merely fails, and
    an entry that curated only the drugs that work would misrepresent the
    decision a clinician is actually making.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:26752241
    reference_title: "Pharmacologic Interventions in Preventing Ovarian Hyperstimulation Syndrome: A Systematic Review and Network Meta-Analysis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, albumin might decrease the pregnancy rate when compared with
      placebo [RR 0.85, 95% CI 0.74-0.97, p < 0.05].
    explanation: >-
      The negative signal: albumin prophylaxis was associated with a lower
      pregnancy rate, which is why this treatment is recorded with REFUTE
      evidence rather than as an endorsed option.
  - reference: PMID:26752241
    reference_title: "Pharmacologic Interventions in Preventing Ovarian Hyperstimulation Syndrome: A Systematic Review and Network Meta-Analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although no available pharmacologic intervention fully prevents the
      development of OHSS, adjuvant drug therapy can still be adopted to limit
      the incidence and improve the management of moderate to severe OHSS.
    explanation: >-
      The overall bound on pharmacological prophylaxis, which applies to every
      drug curated on this entry: none of them fully prevents the syndrome.
- name: Secondary Prevention by Coasting or Cycle Cancellation
  description: >-
    Two of the manoeuvres available once a cycle is already over-responding, both
    of which work by denying the recruited follicular cohort its luteinizing
    stimulus rather than by treating the leak. Coasting withholds further
    gonadotropin while continuing pituitary suppression, allowing the smaller
    follicles to undergo atresia before the trigger. Cycle cancellation withholds
    the trigger altogether.

    They are grouped because they are one decision made at one point in the
    cycle, graded by how much of the cycle the clinician is willing to sacrifice.
    The third manoeuvre named in the same source - elective cryopreservation of
    all oocytes or embryos - is curated as its own treatment rather than folded
    in here, because it acts at a different time and on a different arm: it
    permits the trigger and the retrieval, and prevents only the LATE form driven
    by the endogenous hCG of an implanting pregnancy. All of these are distinct
    from primary prevention, which is the choice of stimulation protocol before
    the response is known.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Preventive Intervention
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  target_mechanisms:
  - target: hCG-Driven Luteinization of the Recruited Cohort
    treatment_effect: INHIBITS
    description: >-
      Coasting and cancellation withhold the luteinizing stimulus from the
      recruited cohort; freeze-all removes the endogenous pregnancy hCG that
      would sustain luteinization into the late phase.
    evidence:
    - reference: PMID:24848075
      reference_title: "Ovarian stimulation in patients in risk of OHSS."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Secondary prevention includes all strategies directed to counteract an
        excessive ovarian response (cycle cancellation, coasting, trigger
        ovulation by low doses of hCG or by alternative agents, cryopreservation
        of oocytes/embryos, adequate luteal phase support).
      explanation: >-
        Names all three manoeuvres as the strategies directed at an excessive
        ovarian response, which is the node this link targets.
  evidence:
  - reference: PMID:24848075
    reference_title: "Ovarian stimulation in patients in risk of OHSS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Secondary prevention includes all strategies directed to counteract an
      excessive ovarian response (cycle cancellation, coasting, trigger
      ovulation by low doses of hCG or by alternative agents, cryopreservation
      of oocytes/embryos, adequate luteal phase support).
    explanation: >-
      The source enumeration of the secondary prevention strategies curated
      here.
  - reference: PMID:34644798
    reference_title: "Ovarian Hyperstimulation: Diagnosis, Prevention, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nowadays OHSS can easily be avoided by several prevention methods, ranging
      from identification of high-risk patients, choice of a correct protocol
      stimulation, trigger with gonadotropin-releasing hormone (GnRH) agonists
      or, finally, the freeze-all strategy.
    explanation: >-
      Places freeze-all as the last line of the prevention sequence and states
      the overall preventability of the syndrome.
  notes: >-
    The same source distinguishes primary prevention - "personalized stimulation
    protocols in order to suit patients' characteristics (individually tailored
    COS, use of GnRH antagonist stimulation protocols, in vitro maturation)" -
    which happens before the ovarian response is known and is therefore a
    different decision from the three curated here.
- name: Elective Embryo or Oocyte Cryopreservation (Freeze-All)
  description: >-
    Curated separately from the grouped secondary-prevention entry because it is
    the only one of the three that is a distinct laboratory procedure with its
    own NCIT identity, and because its mechanism is specifically temporal: it
    does not prevent early OHSS at all, since the trigger is still given and the
    oocytes still retrieved. What it prevents is the late form, by removing the
    implanting pregnancy whose endogenous hCG would otherwise sustain the
    luteinizing stimulus for weeks. It is the reason the GnRH-agonist trigger is
    so effective in donor and freeze-all cycles specifically and less clearly so
    in fresh-transfer cycles.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Cryopreservation
    term:
      id: NCIT:C16475
      label: Cryopreservation
  target_mechanisms:
  - target: hCG-Driven Luteinization of the Recruited Cohort
    treatment_effect: INHIBITS
    description: >-
      Deferring transfer removes the endogenous pregnancy hCG that would sustain
      luteinization of the recruited cohort into the late phase.
    evidence:
    - reference: PMID:34644798
      reference_title: "Ovarian Hyperstimulation: Diagnosis, Prevention, and Management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Nowadays OHSS can easily be avoided by several prevention methods,
        ranging from identification of high-risk patients, choice of a correct
        protocol stimulation, trigger with gonadotropin-releasing hormone (GnRH)
        agonists or, finally, the freeze-all strategy.
      explanation: >-
        Names freeze-all as a prevention method acting alongside the trigger
        choice on the same luteinizing stimulus.
  evidence:
  - reference: PMID:28638367
    reference_title: "GnRH Agonist Trigger and LH Activity Luteal Phase Support versus hCG Trigger and Conventional Luteal Phase Support in Fresh Embryo Transfer IVF/ICSI Cycles-A Systematic PRISMA Review and Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The use of GnRH agonist (GnRHa) for final oocyte maturation trigger in
      oocyte donation and elective frozen embryo transfer cycles is well
      established due to lower ovarian hyperstimulation syndrome (OHSS) rates as
      compared to hCG trigger.
    explanation: >-
      Records that the agonist-trigger benefit is established specifically in
      elective frozen-transfer and donor cycles - that is, in combination with
      this strategy.
- name: Thromboprophylaxis
  description: >-
    Anticoagulant prophylaxis in severe OHSS, aimed at the haemoconcentrated,
    stasis-prone state rather than at the capillary leak that produces it. It is
    described as cost-effective and widely used, and is one of the few
    interventions in established disease with any claim to a benefit.

    The size of the risk it addresses is worth stating precisely, because it is
    smaller and less certain than the syndrome's reputation suggests. A
    systematic review of thromboembolism after assisted reproduction found the
    frequency of venous thromboembolism specifically related to OHSS to be
    under 0.001%, and the increase in risk conferred by OHSS on top of ART did
    not reach statistical significance, with a confidence interval spanning two
    orders of magnitude. The practice is therefore standard on the basis of
    consequence severity and low cost, not on a demonstrated effect size. Low
    dose aspirin, by contrast, remains contested.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Anticoagulation Therapy
    term:
      id: NCIT:C63341
      label: Anticoagulation Therapy
  target_mechanisms:
  - target: Hypercoagulability and Thromboembolism
    treatment_effect: INHIBITS
    description: >-
      Anticoagulant prophylaxis is directed at the thrombotic consequence of
      haemoconcentration and stasis, not at the permeability lesion upstream of
      it.
    evidence:
    - reference: PMID:34644798
      reference_title: "Ovarian Hyperstimulation: Diagnosis, Prevention, and Management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        One of the most dangerous complications of OHSS is venous
        thromboembolism (VTE). Thromboprophylaxis has shown to be cost effective
        and widely used, while there are controversies regarding the usage of
        low dose aspirin (LDA) as a preventive measure.
      explanation: >-
        States the intervention, its target complication, and the separate
        controversy over aspirin.
  evidence:
  - reference: PMID:36588288
    reference_title: "Venous Thromboembolism Associated with Assisted Reproductive Technology: A Systematic Review and Meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The risk of VTE after ART complicated by OHSS, as compared to ART without
      OHSS, was higher but not statistically significant (RR: 14.83; 95% CI:
      0.86-255.62).
    explanation: >-
      Quantifies the incremental risk this prophylaxis addresses and shows it is
      not statistically established - the reason the treatment prose is hedged
      rather than asserted.
  - reference: PMID:36588288
    reference_title: "Venous Thromboembolism Associated with Assisted Reproductive Technology: A Systematic Review and Meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall frequency of VTE specifically related to OHSS was <0.001%.
    explanation: >-
      Gives the absolute frequency of the complication, which is very low.
  - reference: PMID:36588288
    reference_title: "Venous Thromboembolism Associated with Assisted Reproductive Technology: A Systematic Review and Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further large prospective studies on risk factors of VTE in women
      undergoing ART are needed in order to optimize thromboprophylaxis in this
      context.
    explanation: >-
      The reviewing authors' own statement that the evidence base for
      thromboprophylaxis in this setting is not yet adequate.
- name: Therapeutic Paracentesis and Thoracentesis
  description: >-
    Drainage of tense ascites, and of pleural fluid when the respiratory arm
    dominates. It is the one manoeuvre in established disease with an immediate,
    mechanically obvious effect: removing the fluid relieves the intra-abdominal
    pressure and the diaphragmatic splinting, which is why breathlessness often
    improves within minutes of a paracentesis that has changed nothing about the
    underlying leak.

    Curated separately from general supportive care because it is a procedure
    with its own NCIT identity and its own mechanistic target, whereas supportive
    care is the surrounding fluid and monitoring strategy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Paracentesis
    term:
      id: NCIT:C15310
      label: Paracentesis
  target_mechanisms:
  - target: Third-Space Fluid Shift and Intravascular Volume Depletion
    treatment_effect: MODULATES
    description: >-
      Drainage removes accumulated third-space fluid and relieves the mechanical
      consequences of tense ascites; it treats the accumulated fluid, not the
      permeability lesion that produced it.
    evidence:
    - reference: PMID:26506672
      reference_title: "Non-invasive ventilation for the treatment of acute respiratory failure following ovarian hyperstimulation syndrome: report of two cases and a brief review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pulmonary intensive care may involve thoracentesis, oxygen
        supplementation and in more severe cases assisted ventilation.
      explanation: >-
        Documents drainage of third-space fluid as the intervention directed at
        this node.
  evidence:
  - reference: PMID:34644798
    reference_title: "Ovarian Hyperstimulation: Diagnosis, Prevention, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only if severe/critical cases are diagnosed hospitalization is necessary
      for appropriate rehydration, monitoring of fluid balance and eventual
      drainage of ascitic fluid.
    explanation: >-
      Places drainage of ascitic fluid among the interventions reserved for

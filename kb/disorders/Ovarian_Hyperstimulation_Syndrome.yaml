- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    In the reported families the affected women were heterozygous for a single
    activating FSHR allele, and the phenotype segregated through successive
    pregnancies in more than one family member — the pattern of a dominant
    gain-of-function receptor variant rather than a recessive loss of function.
  evidence:
  - reference: PMID:15080154
    reference_title: "A mutation in the follicle-stimulating hormone receptor as a cause of familial spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The affected women were heterozygous for a different mutation involving
      codon 449, where an alanine was substituted for threonine.
    explanation: >-
      Documents heterozygosity of the causal allele in the affected women of a
      familial recurrent-OHSS pedigree.

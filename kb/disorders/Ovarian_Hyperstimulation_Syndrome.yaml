- name: VEGFR-2 Activation and Increased Vascular Permeability
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The rate-limiting step of the whole syndrome, and the point every effective
    therapy acts on. VEGF-A binding to VEGFR-2 on vascular endothelium loosens
    inter-endothelial junctions and raises permeability to protein and water.
    Two experiments in the rodent model make this causal rather than
    correlative: blocking VEGFR-2 with the antagonist SU5416 prevents the
    permeability rise, and a low dose of the dopamine agonist cabergoline
    reverses it by partially dephosphorylating ovarian VEGFR-2. That the same
    receptor also drives the luteal angiogenesis a pregnancy needs is what
    makes dose selection, rather than simple blockade, the therapeutic problem.
  biological_processes:
  - preferred_term: vascular endothelial growth factor receptor-2 signaling pathway
    modifier: INCREASED
    term:
      id: GO:0036324
      label: vascular endothelial growth factor receptor-2 signaling pathway
  - preferred_term: positive regulation of vascular permeability
    modifier: INCREASED
    term:
      id: GO:0043117
      label: positive regulation of vascular permeability
  cell_types:
  - preferred_term: Vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  evidence:
  - reference: PMID:16901966
    reference_title: "Low-dose dopamine agonist administration blocks vascular endothelial growth factor (VEGF)-mediated vascular hyperpermeability without altering VEGF receptor 2-dependent luteal angiogenesis in a rat ovarian hyperstimulation model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We previously demonstrated in an OHSS rodent model that increased VP was
      prevented by inactivating VEGFR-2 with a receptor antagonist (SU5416).
    explanation: >-
      Loss-of-function evidence that VEGFR-2 activation is required for the
      permeability rise, not merely associated with it.
  - reference: PMID:16901966
    reference_title: "Low-dose dopamine agonist administration blocks vascular endothelial growth factor (VEGF)-mediated vascular hyperpermeability without altering VEGF receptor 2-dependent luteal angiogenesis in a rat ovarian hyperstimulation model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A 100 microg/kg low-dose Dp-r2 agonist cabergoline reversed
      VEGFR-2-dependent VP without affecting luteal angiogenesis through
      partial inhibition of ovarian VEGFR-2 phosphorylation levels.
    explanation: >-
      Identifies VEGFR-2 phosphorylation as the modifiable node and shows the

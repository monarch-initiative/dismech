has_subtypes:
- name: Iatrogenic OHSS
  display_name: Iatrogenic OHSS (following controlled ovarian stimulation)
  description: >
    The common form, arising after controlled ovarian stimulation for assisted
    reproduction. Conventionally split by timing relative to the trigger:
    early OHSS is precipitated by the exogenous hCG ovulation trigger, whereas
    late OHSS is sustained by endogenous hCG from an implanting pregnancy. The
    distinction is therapeutically load-bearing because deferring embryo
    transfer removes the endogenous hCG source and so prevents late but not
    early disease.
  evidence:
  - reference: PMID:31097257
    reference_title: "Ovarian hyperstimulation syndrome: A review for emergency clinicians."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      OHSS is an iatrogenic complication caused by an excessive response to
      controlled ovarian stimulation during assisted reproductive cycles (ART).
    explanation: >-
      Establishes the iatrogenic form as a response to controlled ovarian
      stimulation.
  - reference: PMID:24623949
    reference_title: "VEGF antagonist for the prevention of ovarian hyperstimulation syndrome: Current status."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Delaying embryo transfer with embryo cryopreservation definitely reduces
      the incidence of OHSS but not the early OHSS.
    explanation: >-
      Supports the early/late split by showing that removing the endogenous hCG
      source prevents only one of the two.
- name: Spontaneous OHSS
  display_name: Spontaneous OHSS (in the absence of ovulation induction)
  description: >
    A rare form occurring without any ovulation-induction treatment, almost
    always in the first trimester of pregnancy. It arises when the FSH receptor
    is activated by a ligand it does not normally respond to: either a
    wild-type receptor exposed to very high hCG or TSH concentrations
    (multiple pregnancy, hydatidiform mole, severe hypothyroidism), or a
    germline-mutant receptor that has lost ligand specificity. Familial and
    recurrent cases are the ones in which FSHR mutations have been found.
  evidence:
  - reference: PMID:17721928
    reference_title: "Identification of the first germline mutation in the extracellular domain of the follitropin receptor responsible for spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spontaneous ovarian hyperstimulation syndrome (sOHSS) is a rare genetic
      condition in which human chorionic gonadotropin (hCG) promiscuously
      stimulates the FSHR during the first trimester of pregnancy.
    explanation: >-
      Defines the spontaneous form and its promiscuous-activation mechanism.
  - reference: PMID:23941020
    reference_title: "Spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Spontaneous forms of the ovarian hyperstimulation syndrome (sOHSS) are
      nearly always reported between 8 and 14 weeks of pregnancy and also with
      follicle-stimulating hormone (FSH) producing pituitary adenoma.
    explanation: >-
      Gives the gestational timing and the pituitary-adenoma variant of the
      spontaneous form.

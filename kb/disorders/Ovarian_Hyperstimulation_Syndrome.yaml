    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ovarian hyperstimulation syndrome (OHSS) occurs mainly after excessive
      stimulation of the ovaries by exogenous gonadotropins administrated in
      the context of in vitro fertilization procedures (iatrogenic OHSS).
    explanation: >-

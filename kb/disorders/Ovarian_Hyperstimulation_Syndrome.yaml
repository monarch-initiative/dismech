    term:
      id: CL:0000501
      label: granulosa cell
  - preferred_term: luteal cell
    term:
      id: CL:0000175
      label: luteal cell
  genes:
  - preferred_term: LHCGR
    term:
      id: hgnc:6585
      label: LHCGR
  evidence:
  - reference: PMID:21082502
    reference_title: "Physiology and pathology of ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ovarian hyperstimulation syndrome (OHSS) occurs when ovaries primed with
      follicle-stimulating hormone/leuteinizing hormone (LH) are subsequently
      exposed to human chorionic gonadotropin (hCG).
    explanation: >-
      States the two-hit priming-then-hCG structure that this node encodes.
  - reference: PMID:22336848
    reference_title: "Cabergoline for preventing ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ovarian hyperstimulation syndrome (OHSS) is a complication resulting from
      administration of human chorionic gonadotrophin (hCG) in assisted
      reproduction technology (ART) treatment.
    explanation: >-
      Independent statement that hCG administration is the proximate cause of
      the iatrogenic form.
  downstream:
  - target: Ovarian VEGF-A Hypersecretion
    causal_link_type: DIRECT
    description: >
      hCG exposure raises VEGF and VEGFR-2 expression in the luteinized ovary,
      peaking together with peak vascular permeability.

- name: Ovarian VEGF-A Hypersecretion
  biological_scale: MOLECULAR
  description: >
    The luteinized ovary is the source of the vasoactive mediator. After hCG,
    VEGF and VEGFR-2 mRNA rise together to a maximum that coincides with peak
    vascular permeability, and the protein is localised to granulosa-lutein and
    endothelial cells throughout the corpus luteum. The ovarian origin is not
    inferred from co-localisation alone: in the rat model, gonadotropin
    treatment of ovariectomised animals produces no permeability change at all,
    which is the experiment that makes this node causal rather than
    correlative.
  biological_processes:
  - preferred_term: positive regulation of vascular endothelial growth factor production
    term:
      id: GO:0010575
      label: positive regulation of vascular endothelial growth factor production
    modifier: INCREASED
  cell_types:
  - preferred_term: granulosa-lutein cell
    term:
      id: CL:0000175
      label: luteal cell
  - preferred_term: granulosa cell
    term:
      id: CL:0000501
      label: granulosa cell
  genes:
  - preferred_term: VEGFA
    term:
      id: hgnc:12680
      label: VEGFA
  evidence:
  - reference: PMID:21082502
    reference_title: "Physiology and pathology of ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      With the administration of hCG, the expression vascular endothelial growth
      factor (VEGF) and VEGF receptor 2 (VEGFR-2) mRNA increases significantly
      rising to a maximum coinciding with peaked VP.
    explanation: >-
      Ties the expression rise at this node temporally to the permeability
      change downstream.
  - reference: PMID:21082502
    reference_title: "Physiology and pathology of ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Immunohistochemistry shows the presence of VEGF and VEGFR-2 proteins in
      the granulosa-lutein and endothelial cells of the entire corpus luteum.
    explanation: >-
      Localises the ligand and receptor to the cell types curated on this node.
  - reference: PMID:12399430
    reference_title: "Vascular endothelial growth factor receptor-2 activation induces vascular permeability in hyperstimulated rats, and this effect is prevented by receptor blockade."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To further prove the ovarian origin of VEGF, we showed that VP was not
      altered when ovariectomized rats were treated with gonadotropins.
    explanation: >-
      The ovariectomy control that establishes the ovary, not the systemic
      vasculature, as the source.
  downstream:
  - target: VEGFR-2 Activation on Vascular Endothelium
    causal_link_type: DIRECT
    description: >
      Ovary-derived VEGF-A isoforms reach and activate VEGFR-2 on endothelium
      outside the ovary.

- name: VEGFR-2 Activation on Vascular Endothelium
  biological_scale: MOLECULAR
  description: >
    The single druggable step of the syndrome. Ovary-derived VEGF-A acts through
    VEGFR-2 (KDR) on endothelium to open the barrier; blocking the receptor in
    the rat model reverses the permeability change, and partial inhibition of
    receptor phosphorylation by a dopamine D2 agonist is the mechanism by which
    cabergoline works clinically. The receptor is shared with luteal
    angiogenesis, which is why complete blockade is not a usable therapy and
    the clinical strategy is deliberately partial.
  biological_processes:
  - preferred_term: vascular endothelial growth factor receptor-2 signaling pathway
    term:
      id: GO:0036324
      label: vascular endothelial growth factor receptor-2 signaling pathway
    modifier: INCREASED
  molecular_functions:
  - preferred_term: VEGF-activated receptor activity
    term:
      id: GO:0005021
      label: vascular endothelial growth factor receptor activity
    modifier: INCREASED
  cell_types:

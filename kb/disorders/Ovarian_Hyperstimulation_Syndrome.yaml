name: Ovarian Hyperstimulation Syndrome
creation_date: "2026-08-25T00:00:00Z"
description: >-
  Ovarian hyperstimulation syndrome (OHSS) is a systemic capillary-leak illness
  that follows excessive stimulation of the ovarian follicle. Its defining
  lesion is not the ovary itself but what the hyperstimulated ovary secretes:
  luteinized granulosa cells hypersecrete vascular endothelial growth factor,
  which activates VEGF receptor 2 on vascular endothelium and raises vascular
  permeability throughout the body. Fluid moves from the intravascular
  compartment into the peritoneum and pleura, producing the characteristic
  combination of grossly enlarged multicystic ovaries, ascites, pleural
  effusion, haemoconcentration and intravascular volume depletion, with
  thromboembolism, oliguric renal failure and respiratory failure as the
  dangerous end of the spectrum.

  The syndrome reaches that common pathway by two routes, which is why one
  entry covers both. In the overwhelmingly commoner iatrogenic form it is a
  complication of controlled ovarian stimulation for assisted reproduction:
  exogenous gonadotropins recruit far more follicles than a natural cycle, and
  the human chorionic gonadotropin given to trigger final oocyte maturation
  (or produced by an early pregnancy) drives the VEGF surge. In the rare
  familial gestational spontaneous form, no drug is involved at all —
  activating germline variants in FSHR lower the receptor's ligand specificity
  so that the hCG of a normal first trimester, and in most reported mutants
  also TSH, stimulate the FSH receptor promiscuously. The same promiscuous
  activation of a *wild-type* FSH receptor explains the sporadic spontaneous
  cases seen with multiple or molar pregnancy, hypothyroidism and
  FSH-secreting pituitary adenoma. The distinction matters clinically because
  the iatrogenic form is largely preventable by changing the stimulation
  protocol, whereas the familial form recurs in every pregnancy.
category: Complex

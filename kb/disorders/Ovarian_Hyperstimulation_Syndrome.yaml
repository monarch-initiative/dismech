- name: Increased Systemic Vascular Permeability
  biological_scale: TISSUE
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The endothelial-barrier consequence: capillary beds throughout the body,
    not only in the ovary, become permeable to protein and water. That the
    permeability is systemic rather than local is the whole reason an ovarian
    problem produces pleural effusion, renal hypoperfusion and thrombosis, and
    it is why the syndrome is a capillary-leak illness rather than a
    gynaecological one.

    The mediator is not regarded as settled. VEGF is the leading candidate and
    the only one with interventional evidence, but a clinical review is explicit
    that the pathophysiology is incompletely understood, and an
    anti-Mullerian-hormone/dendritic-cell/interleukin arm has been proposed
    alongside it.

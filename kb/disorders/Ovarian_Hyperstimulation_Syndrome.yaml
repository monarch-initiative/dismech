- name: Increased Systemic Vascular Permeability
  biological_scale: ORGANISM
  description: >
    The convergence point and, in the words of the mechanism literature, the
    ultimate pathophysiological step of the syndrome. Every clinical feature
    below this node is a consequence of protein-rich fluid leaving the
    intravascular compartment; nothing further in the cascade is specific to the
    ovary.

- name: Promiscuous FSH Receptor Activation by hCG or TSH
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  subtypes:
  - Familial Spontaneous OHSS
  description: >-
    The hereditary entry point, and the reason MONDO:0011972 carries an FSHR
    gene association. The glycoprotein hormone receptors share a common
    architecture, and their ligand specificity is maintained by an
    intramolecular activation barrier rather than by binding affinity alone.
    Activating germline FSHR variants lower that barrier: the receptor becomes
    abnormally sensitive to hCG, in most reported mutants also to TSH, and
    shows ligand-independent basal activity. The consequence is that the hCG of
    an ordinary first trimester stimulates the FSH receptor as though it were
    FSH. The p.Ser128Tyr allele in the extracellular domain is the mechanistic
    exception that proves the rule — it raises hCG affinity without conferring
    constitutive activity or TSH responsiveness, so more than one molecular
    route reaches the same phenotype.
  genes:
  - preferred_term: FSHR
    term:
      id: hgnc:3969
      label: FSHR
  genetic_context:
    functional_impact_category: GAIN_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous germline missense variants in FSHR. Reported alleles include
      p.Thr449Ile, p.Thr449Ala, p.Asp567Asn, p.Asp567Gly and p.Ile545Thr in the
      transmembrane helices, and p.Ser128Tyr in the extracellular domain.
  biological_processes:
  - preferred_term: follicle-stimulating hormone signaling pathway
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0042699
      label: follicle-stimulating hormone signaling pathway
  evidence:
  - reference: PMID:15080154
    reference_title: "A mutation in the follicle-stimulating hormone receptor as a cause of familial spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The two mutant FSHr (T449I, D567N) harbor aminoacid substitutions in the
      serpentine portion of the receptor and display abnormally high
      sensitivity to the pregnancy hormone hCG, thus providing a satisfactory
      explanation to the phenotype.
    explanation: >-
      Demonstrates in transfected cells that the causal variants confer
      abnormal hCG sensitivity, the mechanism of the spontaneous form.
  - reference: PMID:15080154
    reference_title: "A mutation in the follicle-stimulating hormone receptor as a cause of familial spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Similar to D567N, the T449A FSHr mutant shows an increase of its
      sensitivity to both hCG and TSH, together with an increase in basal
      activity.
    explanation: >-
      Records the additional TSH cross-reactivity and constitutive activity of
      the serpentine-domain mutants.
  - reference: PMID:17721928
    reference_title: "Identification of the first germline mutation in the extracellular domain of the follitropin receptor responsible for spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This loss of ligand specificity was attributed to the lowering of an
      intramolecular barrier of activation rather than to an increase of
      binding affinity.
    explanation: >-
      Gives the biophysical mechanism by which the serpentine-domain variants
      abolish ligand specificity.
  - reference: PMID:17721928
    reference_title: "Identification of the first germline mutation in the extracellular domain of the follitropin receptor responsible for spontaneous ovarian hyperstimulation syndrome."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Contrary to the mutations described previously, the p.Ser128Tyr FSHR
      mutant displayed increase in affinity and sensitivity toward hCG and did
      not show any constitutive activity, nor promiscuous activation by TSH.
    explanation: >-
      Qualifies the node: one causal allele acts by raised hCG affinity alone,
      so neither constitutive activity nor TSH responsiveness is required.
  - reference: PMID:23941020
    reference_title: "Spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Accordingly, the mutated FSHrs, may be hyperstimulated by the
      pregnancy-derived hCG or TSH, inducing the occurrence of the syndrome.
    explanation: >-
      Links the receptor lesion to the gestational trigger that precipitates
      the clinical syndrome.
  downstream:
  - target: Multifollicular Recruitment
    causal_link_type: DIRECT
    description: >-
      hCG or TSH acting on the mutant FSH receptor reproduces the follicular
      recruitment that exogenous gonadotropin produces in the iatrogenic form.
    evidence:
    - reference: PMID:15080154
      reference_title: "A mutation in the follicle-stimulating hormone receptor as a cause of familial spontaneous ovarian hyperstimulation syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Together with the two previous studies, this report shows that
        inappropriate stimulation of the FSHr by hCG is a cause of spontaneous
        OHSS.
      explanation: >-
        States that inappropriate FSH receptor stimulation by hCG is causal for
        the syndrome, which is the claim of this edge.
- name: Promiscuous Activation of the Wild-Type FSH Receptor
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    A third, non-genetic and non-iatrogenic entry point that the same receptor
    biology predicts. The wild-type FSH receptor is not perfectly specific
    either; it is simply that the physiological concentrations of hCG and TSH
    never reach the threshold at which cross-activation matters. When they do —
    the very high hCG of a multiple or hydatidiform-molar pregnancy, the very
    high TSH of untreated hypothyroidism, or autonomous FSH secretion from a
    pituitary adenoma — the syndrome can occur sporadically in a woman with a
    normal FSHR. This is why an FSHR variant should not be assumed in every
    spontaneous case.
  biological_processes:
  - preferred_term: follicle-stimulating hormone signaling pathway
    modifier: INCREASED
    term:
      id: GO:0042699
      label: follicle-stimulating hormone signaling pathway
  evidence:
  - reference: PMID:23941020
    reference_title: "Spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The syndrome has been previously reported in rare instances of increased
      production of human chorionic gonadotrophin (hCG) such as multiple
      pregnancies, hydatiforme mole, polycystic ovary disease and elevated
      concentrations of thyroid-stimulating hormone (TSH) in hypothyreoidism.
    explanation: >-
      Enumerates the clinical settings in which excess hCG or TSH precipitates
      the syndrome without a fertility drug.
  - reference: PMID:23941020
    reference_title: "Spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High levels of these hormones are able to stimulate by natural
      promiscuous activation the wild-type FSHr, resulting in sporadic
      presentations of the syndrome.
    explanation: >-
      States explicitly that a normal FSH receptor can be cross-activated when
      ligand concentrations are high enough.
  downstream:
  - target: Multifollicular Recruitment
    causal_link_type: DIRECT
    description: >-
      Cross-activation of the normal receptor drives the same follicular
      response as the mutant receptor does.
- name: Multifollicular Recruitment
  biological_scale: TISSUE
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The FSH-driven half of the ovarian response, and the step that sets the size
    of the problem. Sustained FSH receptor signalling rescues from atresia a
    large cohort of antral follicles that a natural cycle would have discarded
    in favour of one dominant follicle. Nothing pathological has happened yet -
    this is the intended effect of controlled ovarian stimulation, and an
    exaggerated version of it in the spontaneous forms. Follicle number and
    oestradiol level predict OHSS risk precisely because they measure this node,
    which is why it and not the later steps is what protocol individualisation,
    anti-Mullerian hormone and antral follicle count are aimed at.
  biological_processes:
  - preferred_term: ovarian follicle development
    modifier: INCREASED
    term:
      id: GO:0001541
      label: ovarian follicle development
  cell_types:
  - preferred_term: Granulosa cell
    term:
      id: CL:0000501
      label: granulosa cell
  evidence:
  - reference: PMID:24848075
    reference_title: "Ovarian stimulation in patients in risk of OHSS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ovarian hyperstimulation syndrome (OHSS) represents an exaggerated
      response to controlled ovarian stimulation (COS) that in some cases could
      be life-threatening.
    explanation: >-
      Frames the follicular response as an exaggerated version of the intended
      one rather than a qualitatively different process.
  - reference: PMID:24848075
    reference_title: "Ovarian stimulation in patients in risk of OHSS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In recent years research has focus on identifying biomarkers/hormonal
      markers that could represent potential predictors of OHSS
      (anti-Mullerian hormone and antral follicle count).
    explanation: >-
      Records that the predictive markers used clinically are measurements of
      the recruitable follicle pool - that is, of this node.
  downstream:
  - target: hCG-Driven Luteinization of the Recruited Cohort
    causal_link_type: DIRECT
    description: >-
      The recruited cohort is the substrate the LH-like signal acts on; without
      multifollicular recruitment there is nothing to luteinize en masse.
  - target: Ovarian Enlargement and Multicystic Change
    causal_link_type: DIRECT
    description: >-
      Many simultaneously recruited follicles enlarge the ovary mechanically.
- name: hCG-Driven Luteinization of the Recruited Cohort
  biological_scale: TISSUE
  role: central_effector
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: LHCGR
    term:
      id: hgnc:6585
      label: LHCGR
  description: >-
    The hCG-dependent half, separated from recruitment because the two have
    different triggers, different timing and different therapeutic handles.
    Exposure to an LH-like signal - the hCG trigger, or the endogenous hCG of an
    implanting pregnancy - luteinizes the whole recruited cohort at once, so the
    ovary comes to contain many simultaneously luteinized follicles instead of
    one corpus luteum. That expanded mass of luteinized granulosa tissue is the
    secretory organ of the syndrome.

    This node, not recruitment, is what the preventive substitution of a GnRH
    agonist for hCG removes: the follicles are still recruited, but the
    long-acting luteinizing stimulus is replaced by a short endogenous LH surge.
    Keeping it distinct is what lets that treatment be linked where it actually
    acts.
  biological_processes:
  - preferred_term: luteinization
    modifier: INCREASED
    term:
      id: GO:0001553
      label: luteinization
  cell_types:

- name: Ovarian Enlargement and Multicystic Change
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    The ovarian finding that names the syndrome and is what bedside ultrasound
    sees. Many simultaneously luteinized follicles and their retained fluid
    enlarge the ovaries, sometimes to many times normal volume. The clinical
    hazard of this node is mechanical rather than haemodynamic: a heavy,
    enlarged ovary can undergo adnexal torsion and infarct, which has been
    reported even outside pregnancy in a woman carrying an activating FSHR
    variant.
  evidence:
  - reference: PMID:26506672
    reference_title: "Non-invasive ventilation for the treatment of acute respiratory failure following ovarian hyperstimulation syndrome: report of two cases and a brief review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of severe OHSS was made, largely based on bedside
      ultrasonography showing increased ovarian size, mild ascites and
      bilateral pleural effusions.
    explanation: >-
      Documents ovarian enlargement as an imaging feature used to make the
      diagnosis.
  - reference: PMID:25495063
    reference_title: "A case of ovarian torsion in a patient carrier of a FSH receptor gene mutation previously affected by spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In few days, she developed severe pelvic pain and ultrasonographic
      evidence of increased ovarian volume.
    explanation: >-
      Records ovarian enlargement preceding the torsion complication in an FSHR
      variant carrier.
  downstream:
  - target: Adnexal Torsion and Ovarian Infarction
    causal_link_type: DIRECT
    description: >-
      An enlarged, heavy ovary is mechanically predisposed to twist on its
      vascular pedicle.
- name: Adnexal Torsion and Ovarian Infarction
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: PROVISIONAL
  description: >-
    A surgical complication of the enlarged ovary, distinct from the
    capillary-leak arm of the disease and not dependent on it. It is presented
    here as provisional because the direct evidence is a single reported case
    in an FSHR variant carrier rather than a series; the general association
    between ovarian enlargement and torsion is not in dispute, but its
    frequency in OHSS specifically is not quantified in the cited literature.
    The case is instructive for a second reason: it occurred while the woman
    was neither pregnant nor receiving fertility treatment, showing that the
    ovarian risk of an activating FSHR allele is not confined to gestation.
  evidence:
  - reference: PMID:25495063
    reference_title: "A case of ovarian torsion in a patient carrier of a FSH receptor gene mutation previously affected by spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She underwent laparoscopy with unilateral adnexectomy for ovarian
      ischemic necrosis due to adnexal torsion.
    explanation: >-

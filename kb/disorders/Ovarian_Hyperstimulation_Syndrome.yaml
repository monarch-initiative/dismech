- name: Hypercoagulability and Thromboembolism
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    The complication with the worst reputation in this syndrome, and one worth
    stating carefully. Haemoconcentration from plasma loss into the third space,
    combined with reduced venous return and the prothrombotic state of the
    high-oestrogen luteal phase or early pregnancy, produces venous and
    occasionally arterial thrombosis.

    Thromboprophylaxis is curated as a treatment acting on this node. Note
    though that the risk it addresses is small in absolute terms - venous
    thromboembolism specifically attributable to OHSS has been estimated at
    under 0.001% - and that the increment OHSS adds on top of assisted
    reproduction did not reach statistical significance in a systematic review.
    The practice rests on the severity of the consequence and the low cost of
    the intervention rather than on a demonstrated effect size.

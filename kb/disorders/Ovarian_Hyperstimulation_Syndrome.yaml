- name: Ovarian VEGF Hypersecretion
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Luteinized granulosa cells secrete vascular endothelial growth factor, and
    hCG is the strongest stimulus for that secretion — which is why the
    syndrome follows the trigger injection or the rise of endogenous hCG rather
    than the stimulation itself, and why it has an early and a late phase. In a
    hyperstimulated ovary the output is large enough to raise circulating VEGF,
    so a local ovarian signal becomes a systemic one. Serum VEGF measured
    serially in a woman hospitalised with severe OHSS rose and fell with her
    symptoms.
  biological_processes:
  - preferred_term: vascular endothelial growth factor production
    modifier: INCREASED
    term:
      id: GO:0010573
      label: vascular endothelial growth factor production
  cell_types:
  - preferred_term: Luteal cell
    term:
      id: CL:0000175
      label: luteal cell
  evidence:
  - reference: PMID:16901966
    reference_title: "Low-dose dopamine agonist administration blocks vascular endothelial growth factor (VEGF)-mediated vascular hyperpermeability without altering VEGF receptor 2-dependent luteal angiogenesis in a rat ovarian hyperstimulation model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      OHSS is caused by increased vascular permeability (VP) through ovarian
      hypersecretion of vascular endothelial growth factor (VEGF)-activating
      VEGF receptor 2 (VEGFR-2).
    explanation: >-
      States the ovarian hypersecretion step and its receptor target in a
      single sentence; this is the canonical mechanistic statement for the
      syndrome.
  - reference: PMID:9240261
    reference_title: "Vascular endothelial growth factor levels in serum and follicular fluid of patients undergoing in vitro fertilization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is a significant ovarian contribution to circulating VEGF levels

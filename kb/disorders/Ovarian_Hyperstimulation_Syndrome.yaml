  - reference: PMID:38487201
    reference_title: "The Incidence of Moderate and Severe Ovarian Hyperstimulation Syndrome in Hospitalized Patients in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We extracted 18,022 eligible patients with moderate or severe OHSS and
      1,581,703 OPU cycles.
    explanation: >-
      Records the numerator and denominator behind the rate.
- population: >-
    Severe OHSS as a proportion of stimulated populations (range across studies)
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_low: 500.0
  rate_high: 5000.0
  notes: >-
    Reported severe-OHSS rates span an order of magnitude between series, which
    reflects genuinely different case definitions and stimulation eras rather
    than measurement error. Recorded as a range for that reason.
  evidence:
  - reference: PMID:26506672
    reference_title: "Non-invasive ventilation for the treatment of acute respiratory failure following ovarian hyperstimulation syndrome: report of two cases and a brief review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The severe form of OHSS varies between 0.5% and 5%, depending on the
      population studied
    explanation: >-
      Gives the reported range and attributes its width to the population

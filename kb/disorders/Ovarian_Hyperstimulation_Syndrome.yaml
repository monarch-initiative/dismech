name: Ovarian Hyperstimulation Syndrome
creation_date: "2026-08-13T00:00:00Z"
category: Iatrogenic
synonyms:
- OHSS
- Ovarian hyperstimulation
- Hyperstimulation syndrome
description: >
  Ovarian hyperstimulation syndrome (OHSS) is an iatrogenic complication of
  controlled ovarian stimulation in which ovaries primed with exogenous
  gonadotropins are subsequently exposed to human chorionic gonadotropin and
  respond by hypersecreting vascular endothelial growth factor. The disease is
  unusual among dismech entries in that the initiating exposure is a therapy,
  the causal ligand-receptor step is identified, and the resulting single
  physiological lesion - increased systemic vascular permeability driven by
  VEGF-A acting on VEGFR-2 - accounts for the entire downstream clinical
  picture. Protein-rich fluid leaves the intravascular compartment into the
  peritoneal and pleural spaces, producing ascites and effusions while the
  circulating volume falls; hemoconcentration then drives renal hypoperfusion,
  oliguria and a hypercoagulable state whose thrombotic complications are the
  most dangerous feature of the syndrome. A rare spontaneous form arises
  without any ovulation-induction treatment, when pregnancy-derived hCG or
  thyrotropin promiscuously activates the FSH receptor - either a wild-type
  receptor exposed to very high ligand concentrations, or a germline-mutant
  receptor that has lost ligand specificity. Because the initiating step is a
  clinical decision, OHSS is also one of the few diseases whose incidence has
  been reduced by changing the drug protocol rather than by treating the
  patient: replacing the hCG trigger with a GnRH agonist and stimulating under
  GnRH antagonist cover both act upstream of VEGF hypersecretion.

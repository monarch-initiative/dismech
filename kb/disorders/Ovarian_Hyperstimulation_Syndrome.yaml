progression:
- phase: Early OHSS
  notes: >-
    Early OHSS begins in the days after the hCG trigger and oocyte retrieval and
    reflects the preovulatory response to stimulation - it is the arm that peak
    oestradiol and oocyte number predict, and the arm that protocol choice,
    coasting and trigger substitution can pre-empt. Women with early OHSS have
    significantly higher serum oestradiol and lower gonadotropin requirements
    than either late-OHSS or unaffected women, which is the signature of an
    ovary that responded excessively to a modest dose.
  evidence:
  - reference: PMID:10785214
    reference_title: "Distinction between early and late ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early OHSS relates to "excessive" preovulatory response to stimulation,
      whereas late OHSS depends on the occurrence of pregnancy, is likelier to
      be severe, and is only poorly related to preovulatory events.
    explanation: >-
      The defining statement of the two-phase distinction and of what each phase
      depends on.
  - reference: PMID:10785214
    reference_title: "Distinction between early and late ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Women with early OHSS had significantly higher serum E(2) levels and lower
      gonadotropin requirements than did the other groups.
    explanation: >-
      Gives the biochemical signature that separates early OHSS from the late
      form and from unaffected cycles.
- phase: Late OHSS
  notes: >-
    Late OHSS begins later and depends on pregnancy: the endogenous hCG of an
    implanting conceptus sustains the luteinizing stimulus for weeks rather than
    days. Three consequences follow and all are clinically important. It is
    likelier to be severe than the early form. It cannot be predicted from
    preovulatory measurements - serum oestradiol and oocyte number, which work
    for early OHSS, do not identify who will develop it. And it is the arm that
    freeze-all abolishes, since deferring transfer removes the pregnancy
    entirely. In one series clinical pregnancies occurred in every late-OHSS
    cycle, and in another 77.8% of late-onset cases had a concurrent positive
    pregnancy test.
  evidence:
  - reference: PMID:10785214
    reference_title: "Distinction between early and late ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum E(2) and oocyte numbers did not accurately predict the risk of
      developing late OHSS.
    explanation: >-
      Establishes that the predictors used for early OHSS fail for the late
      form, which is why prevention of late OHSS is structural (freeze-all)
      rather than predictive.
  - reference: PMID:10785214
    reference_title: "Distinction between early and late ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical pregnancies occurred in all cycles with late OHSS, and multiple
      pregnancies were significantly more frequent in the late OHSS group than
      in the other groups.
    explanation: >-
      Ties the late form to pregnancy, and to multiple pregnancy in particular -
      the higher-hCG case.
  - reference: PMID:10785214
    reference_title: "Distinction between early and late ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Late OHSS was more likely than early OHSS to be severe.
    explanation: >-
      Records the severity difference between the two phases.
  - reference: PMID:18956797
    reference_title: "Are pregnancy rates compromised following embryo freezing to prevent OHSS?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two distinct incidence peaks of OHSS were identified--early and late.
      77.77% of women who suffered from late onset OHSS had a concurrent
      positive pregnancy test.
    explanation: >-
      Independent confirmation of the bimodal timing and of the pregnancy
      association in the late peak.


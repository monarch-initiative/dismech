      term:
        id: CHEBI:6801
        label: metformin
  evidence:
  - reference: PMID:26752241
    reference_title: "Pharmacologic Interventions in Preventing Ovarian Hyperstimulation Syndrome: A Systematic Review and Network Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      metformin [RR 0.20, 95% CrI 0.07-0.59, p < 0.05] and IV hydroxyethyl
      starch (HES) [RR 0.26, 95% CrI 0.05-0.99, p < 0.05]
    explanation: >-

genetic:
- name: FSHR
  gene_term:
    preferred_term: FSHR
    term:
      id: hgnc:3969
      label: FSHR
  relationship_type: CAUSATIVE
  subtype: Spontaneous OHSS
  variant_origin: GERMLINE
  frequency: >-
    Rare; only a handful of activating variants reported, in familial or
    recurrent spontaneous cases.
  notes: >
    Germline FSHR variants cause the familial and recurrent forms of spontaneous
    OHSS by removing the receptor's ligand specificity. Two mechanistically
    distinct classes are described: transmembrane-helix variants (Asp567Asn,
    Asp567Gly, Thr449Ile, Thr449Ala, Ile545Thr) that are constitutively active
    and abnormally responsive to both hCG and TSH, and a single
    extracellular-domain variant (p.Ser128Tyr) that gains hCG affinity without
    constitutive activity or TSH responsiveness. FSHR variants are causative
    only for the spontaneous subtype; they are not implicated in iatrogenic
    OHSS.
  evidence:
  - reference: PMID:23941020
    reference_title: "Spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Since 2003, only six different activating FSHr gene mutations have been
      reported in cases of familial or habitual sOHSS.
    explanation: >-
      Establishes the small number of causative variants and restricts them to
      familial/recurrent spontaneous disease.
  - reference: PMID:23941020
    reference_title: "Spontaneous ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In addition to five mutations which have been found in the transmembrane
      helices (Asp567Asn, Asp567Gly, Thr449Ile, Thr449Ala, Ile545Thr), the first
      germline mutation (c.383C > A, p. Ser 128 Tyr) in the extracelullar domain
      was identified.
    explanation: >-
      Enumerates the specific variants named in the description.
  - reference: PMID:23561021
    reference_title: "Spontaneous ovarian hyperstimulation syndrome: case report, pathophysiological classification and diagnostic algorithm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report an affected mother and her daughter with a previously reported
      heterozygous activating mutation in the FSHR gene.
    explanation: >-
      Mother-daughter transmission of a heterozygous activating variant, the
      observation behind the autosomal dominant inheritance recorded here.
  - reference: PMID:30410807
    reference_title: "Spontaneous Ovarian Hyperstimulation Syndrome with FSH Receptor Gene Mutation: Two Rare Case Reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In recent years, some follicle-stimulating hormone (FSH) receptor (FSHR)
      gene mutations have been described in patients with OHSS in the first
      trimester with normal hCG levels.
    explanation: >-
      Independent case series confirming FSHR variants in spontaneous disease
      with normal hCG - the observation that separates the mutant route from the
      high-ligand route.

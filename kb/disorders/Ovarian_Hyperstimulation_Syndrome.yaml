animal_models:
- name: PMSG/hCG-hyperstimulated Wistar rat
  species: Rat
  genotype: Wild-type
  background: Wistar
  category: Induced
  description: >
    The reference OHSS model: immature or adult rats hyperstimulated with
    pregnant mare's serum gonadotropin followed by hCG, with vascular
    permeability measured directly. This one model carries almost the entire
    causal weight of the canonical mechanism - it supplied the expression
    time-course, the ovariectomy source control, and the receptor-blockade
    reversal - and it is also the model in which cabergoline's separation of
    permeability from angiogenesis was demonstrated before the drug was given
    to women.
  publication: PMID:12399430
  modeled_mechanisms:
  - target: Increased Systemic Vascular Permeability
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >
      Gonadotropin priming followed by hCG reproduces the defining physiological
      lesion of the human syndrome, with the same temporal relationship to
      ovarian VEGF expression.
    limitations: >-
      The rat does not develop the clinical syndrome - no ascites-driven
      compartment syndrome, no thromboembolism, and no pregnancy-sustained late
      form. Permeability is an assayed endpoint here, whereas in women it is
      inferred from its consequences. The model also uses PMSG rather than the
      recombinant FSH used clinically.
    readouts:
    - name: Mesenteric and ovarian vascular permeability
      target: Increased Systemic Vascular Permeability
      direction: INCREASED
      interpretation: >
        Direct measurement of the node's defining lesion, peaking 48 h after
        stimulation together with ovarian VEGF mRNA.
      evidence:
      - reference: PMID:12399430
        reference_title: "Vascular endothelial growth factor receptor-2 activation induces vascular permeability in hyperstimulated rats, and this effect is prevented by receptor blockade."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          VP and ovarian mRNA VEGF expression increased to peak values after 48
          h.
        explanation: >-
          Reports the permeability measurement and its timing.
    - name: Vascular permeability under VEGFR-2 blockade (SU5416)
      target: Increased Systemic Vascular Permeability
      direction: RESTORED
      interpretation: >
        Pharmacological rescue: blocking the receptor returns permeability
        toward baseline, which is the experiment that makes the VEGFR-2 step
        causal rather than correlative.
      evidence:
      - reference: PMID:12399430
        reference_title: "Vascular endothelial growth factor receptor-2 activation induces vascular permeability in hyperstimulated rats, and this effect is prevented by receptor blockade."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Increased VP was reversed when SU5416 was administered every 48 h or
          two injections after hCG.
        explanation: >-
          Reports the rescue and its dosing schedule.
    evidence:
    - reference: PMID:12399430
      reference_title: "Vascular endothelial growth factor receptor-2 activation induces vascular permeability in hyperstimulated rats, and this effect is prevented by receptor blockade."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results show that the ovary is the main source of VEGF(120) and
        VEGF(164), which act through the VEGF receptor-2 to increase VP, and
        provide new insights into the prevention of OHSS.
      explanation: >-
        Supports treating this model as informative for the human permeability
        node, including the source and receptor claims.
  - target: VEGFR-2 Activation on Vascular Endothelium
    relationship: MEASURES
    fidelity: MODERATE
    description: >
      The same model was used to show that a low-dose dopamine D2 agonist
      partially inhibits ovarian VEGFR-2 phosphorylation, separating the
      permeability arm of receptor signalling from the luteal angiogenesis arm.
    limitations: >-
      Receptor phosphorylation was measured in ovarian tissue, not in the
      systemic endothelium where the permeability lesion is expressed, so the
      compartment in which the drug acts is inferred rather than shown. The
      dose separation demonstrated in the rat has not been reproduced as a
      pharmacodynamic measurement in women.
    readouts:
    - name: Ovarian VEGFR-2 phosphorylation under low-dose cabergoline
      target: VEGFR-2 Activation on Vascular Endothelium
      direction: DECREASED
      interpretation: >
        Partial inhibition of receptor phosphorylation is the proposed molecular
        action of cabergoline in this disease.
      evidence:
      - reference: PMID:16901966
        reference_title: "Low-dose dopamine agonist administration blocks vascular endothelial growth factor (VEGF)-mediated vascular hyperpermeability without altering VEGF receptor 2-dependent luteal angiogenesis in a rat ovarian hyperstimulation model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          A 100 microg/kg low-dose Dp-r2 agonist cabergoline reversed
          VEGFR-2-dependent VP without affecting luteal angiogenesis through
          partial inhibition of ovarian VEGFR-2 phosphorylation levels.
        explanation: >-
          Reports the phosphorylation measurement and the dose at which
          permeability and angiogenesis separate.
    - name: Ovarian VEGF and VEGFR-2 mRNA under cabergoline
      target: VEGFR-2 Activation on Vascular Endothelium
      direction: UNCHANGED
      interpretation: >
        A negative result that localises the drug's action to receptor
        phosphorylation rather than to ligand or receptor expression.
      evidence:
      - reference: PMID:16901966
        reference_title: "Low-dose dopamine agonist administration blocks vascular endothelial growth factor (VEGF)-mediated vascular hyperpermeability without altering VEGF receptor 2-dependent luteal angiogenesis in a rat ovarian hyperstimulation model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Cabergoline administration also did not affect VEGF/VEGFR-2 ovarian
          mRNA levels.
        explanation: >-
          The explicit negative expression result behind this readout.
    evidence:
    - reference: PMID:16901966
      reference_title: "Low-dose dopamine agonist administration blocks vascular endothelial growth factor (VEGF)-mediated vascular hyperpermeability without altering VEGF receptor 2-dependent luteal angiogenesis in a rat ovarian hyperstimulation model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        To test whether VEGFR-2-dependent VP and angiogenesis could be
        segregated in a dose-dependent fashion with the Dp-r2 agonist
        cabergoline, a well-established OHSS rat model supplemented with
        prolactin was used.
      explanation: >-
        States the model and the specific question it was used to answer at this
        node.
  notes: >-
    The cabergoline experiments used a prolactin-supplemented variant of the
    model, an additional departure from the human setting that is recorded here
    rather than in the limitations of a single link.
treatments:
- name: Cabergoline
  description: >
    A dopamine D2 receptor agonist given prophylactically to women at high risk.
    It is the only pharmacological prevention that acts on the identified causal
    step: partial inhibition of VEGFR-2 phosphorylation, chosen because it
    blunts the permeability arm of receptor signalling at a dose that leaves
    luteal angiogenesis - and therefore implantation - intact.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cabergoline
      term:
        id: CHEBI:3286
        label: cabergoline
  target_mechanisms:
  - target: VEGFR-2 Activation on Vascular Endothelium
    treatment_effect: INHIBITS
    description: >
      Partial inhibition of VEGFR-2 phosphorylation, deliberately incomplete so
      that VEGFR-2-dependent luteal angiogenesis is preserved.
    evidence:
    - reference: PMID:21082502
      reference_title: "Physiology and pathology of ovarian hyperstimulation syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Also, coadministration of a dopamine agonist inhibits phosphorylation of
        the receptor VEGFR-2.
      explanation: >-
        States the molecular action of the drug on the targeted node.
  evidence:
  - reference: PMID:22336848
    reference_title: "Cabergoline for preventing ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A statistically significant reduction in OHSS was observed in the
      cabergoline treated group (OR 0.40, 95% CI 0.20 to 0.77; 2 RCTs, 230
      women) with a number needed to treat (NTT) of 7.
    explanation: >-
      Randomised-trial meta-analytic effect estimate for the intervention.
  - reference: PMID:22336848
    reference_title: "Cabergoline for preventing ovarian hyperstimulation syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was a statistically significant difference in the incidence of
      moderate OHSS, favouring cabergoline (OR 0.38, 95% CI 0.19 to 0.78; 2
      RCTs, 230 women) but not in severe OHSS (OR 0.77, 95% CI 0.24 to 2.45; 2
      RCTs, 230 women).
    explanation: >-
      Recorded as PARTIAL because the benefit is demonstrated for moderate but
      not severe disease - the limitation curated in the associated discussion.
  - reference: PMID:16901966
    reference_title: "Low-dose dopamine agonist administration blocks vascular endothelial growth factor (VEGF)-mediated vascular hyperpermeability without altering VEGF receptor 2-dependent luteal angiogenesis in a rat ovarian hyperstimulation model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prophylactic administration of cabergoline (5-10 microg/kg x d) decreased
      the occurrence of OHSS from 65% (controls) to 25% (treatment).
    explanation: >-
      The oocyte-donor cohort reported in the same paper as the animal work;
      tagged HUMAN_CLINICAL because this specific result is the human arm.
  notes: >-
    Benefit is reported only in non-pregnant high-risk women; dopamine-agonist
    prevention has not been shown to help once pregnancy is established.

- name: GnRH Agonist Trigger Replacing hCG
  description: >
    Substituting a GnRH agonist for hCG as the ovulation trigger in an
    antagonist cycle. The agonist releases a short endogenous LH surge instead
    of delivering a long-half-life hCG signal, so the luteinized cohort is not
    driven for days. This is the single protocol change that has most reduced
    the incidence of the syndrome, and it acts one step upstream of the drug
    target.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: gonadotropin-releasing hormone analogue
      term:
        id: NCIT:C1910
        label: Gonadotropin-releasing Hormone Analog
  target_mechanisms:
  - target: hCG-Driven Luteinization of the Enlarged Follicle Cohort
    treatment_effect: INHIBITS
    description: >
      Removes the sustained hCG signal that commits the primed cohort to the
      cascade.
    evidence:
    - reference: PMID:29544639
      reference_title: "The Ovarian Hyperstimulation Syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        In the last decade, the substitution of the human chorionic gonadotropin
        trigger with the gonadotropin-releasing hormone agonist trigger has
        decreased the incidence of this syndrome but did not eliminate it
        completely.
      explanation: >-
        States both the effect of removing the hCG signal and its incompleteness.
  evidence:
  - reference: PMID:20140640
    reference_title: "Ovarian hyperstimulation syndrome: pathophysiology and prevention."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Among the many prevention strategies that have been discussed, the current
      evidence points to the replacement of hCG by GnRH agonists in antagonist
      cycles and the performance of IVM procedures as the safest approaches.
    explanation: >-
      Identifies trigger replacement as the preferred prevention strategy.
  - reference: PMID:17169172
    reference_title: "GnRH agonist to induce oocyte maturation during IVF in patients at high risk of OHSS."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was one case of moderate ovarian hyperstimulation syndrome (OHSS) in
      the control group and none in the study group.
    explanation: >-
      Recorded as PARTIAL: a retrospective comparison with a single event, which
      the authors themselves say requires randomised confirmation.

- name: GnRH Antagonist Stimulation Protocol
  description: >
    Using a GnRH antagonist rather than a long GnRH agonist protocol for
    pituitary suppression during stimulation. It reduces the size and
    oestrogenic drive of the recruited cohort and, uniquely among preventive
    measures, is supported by a large randomised evidence base showing OHSS
    reduction without loss of live birth.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: gonadotropin-releasing hormone analogue
      term:
        id: NCIT:C1910
        label: Gonadotropin-releasing Hormone Analog
  target_mechanisms:
  - target: Supraphysiological Multifollicular Recruitment
    treatment_effect: MODULATES
    description: >
      Alters the pattern and duration of gonadotropin exposure during
      recruitment rather than blocking any single receptor in the cascade.
    evidence:
    - reference: PMID:35292717
      reference_title: "Conventional GnRH antagonist protocols versus long GnRH agonist protocol in IVF/ICSI cycles of polycystic ovary syndrome women: a systematic review and meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        and lower number of retrieved oocytes
      explanation: >-
        Demonstrates that the protocol change acts at the recruitment step: the
        antagonist protocol yields a measurably smaller recruited cohort.
  evidence:
  - reference: PMID:27126581
    reference_title: "Gonadotrophin-releasing hormone antagonists for assisted reproductive technology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GnRH antagonist was associated with lower incidence of any grade of OHSS
      than GnRH agonist (OR 0.61, 95% C 0.51 to 0.72; 36 RCTs, n = 7944, I(2) =
      31%, moderate quality evidence).
    explanation: >-
      The pooled randomised estimate across 36 trials.
  - reference: PMID:27126581
    reference_title: "Gonadotrophin-releasing hormone antagonists for assisted reproductive technology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is moderate quality evidence that the use of GnRH antagonist
      compared with long-course GnRH agonist protocols is associated with a
      substantial reduction in OHSS without reducing the likelihood of achieving
      live birth.
    explanation: >-
      The reviewers' summary of both the benefit and the absence of an efficacy
      penalty.
  - reference: PMID:35292717
    reference_title: "Conventional GnRH antagonist protocols versus long GnRH agonist protocol in IVF/ICSI cycles of polycystic ovary syndrome women: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using GnRH antagonist protocols led to a significantly lower OHSS rate
    explanation: >-
      Confirms the effect in the polycystic-ovary-syndrome stratum, the group at
      highest risk.

- name: Elective Embryo Cryopreservation (Freeze-All)
  description: >
    Cryopreserving all embryos and deferring transfer removes the endogenous hCG
    of an implanting pregnancy. It therefore prevents the late form specifically
    and has no effect on early disease already triggered by the exogenous hCG -
    a clean illustration of the two hCG sources being separable interventions on
    the same node.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: hCG-Driven Luteinization of the Enlarged Follicle Cohort
    treatment_effect: INHIBITS
    description: >
      Removes the endogenous hCG source that would otherwise sustain
      luteinization into the second week after transfer.
    evidence:
    - reference: PMID:24623949
      reference_title: "VEGF antagonist for the prevention of ovarian hyperstimulation syndrome: Current status."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Delaying embryo transfer with embryo cryopreservation definitely reduces
        the incidence of OHSS but not the early OHSS.
      explanation: >-
        States both the effect and its restriction to the late form, which is
        what identifies the endogenous hCG source as the target.

- name: Therapeutic Paracentesis
  description: >
    Drainage of tense ascites. It does not touch the causal cascade; it relieves
    the mechanical consequence, lowering intra-abdominal pressure and improving
    ventilation and renal perfusion. Ascitic fluid drained this way is what
    demonstrated the intraperitoneal cytokine excess.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: paracentesis
    term:
      id: NCIT:C15310
      label: Paracentesis
  target_mechanisms:
  - target: Abdominal and Thoracic Compartment Compromise
    treatment_effect: INHIBITS
    description: >
      Mechanically removes the accumulated fluid causing the raised
      intra-abdominal pressure.
    evidence:
    - reference: PMID:8224268
      reference_title: "Elevated levels of interleukin-6 in ascites and serum from women with ovarian hyperstimulation syndrome."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Therapeutic paracentesis was performed on four patients with OHSS.
      explanation: >-
        Documents therapeutic paracentesis as the intervention used in clinical
        management; PARTIAL because the study measured cytokines rather than the
        procedure's effect on compartment pressure.

- name: Heparin Thromboprophylaxis and Anticoagulation
  description: >
    Prophylactic and therapeutic heparin, directed at the complication that
    causes most of the syndrome's deaths. It is the one treatment aimed at a
    node that is not relieved by resolution of the ascites, since thromboses can
    present after the ovarian picture has settled.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: heparin
      term:
        id: CHEBI:28304
        label: heparin
  target_mechanisms:
  - target: Thromboembolism
    treatment_effect: INHIBITS
    description: >
      Anticoagulation directed at the thrombotic complication rather than at the
      permeability lesion that generates the prothrombotic state.
    evidence:
    - reference: PMID:25014487
      reference_title: "Thrombosis following ovarian hyperstimulation syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Once early diagnosis is established, it is crucial to use an
        anticoagulant treatment with heparin proceeded with thromboprophylaxis.
      explanation: >-
        States the recommended anticoagulant strategy for this node.
  evidence:
  - reference: PMID:25014487
    reference_title: "Thrombosis following ovarian hyperstimulation syndrome."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      However, identification of patients at risk and preventive measures of
      OHSS are the best means in reducing the risk of thrombosis after ovarian
      stimulation.
    explanation: >-
      Recorded as PARTIAL because the same review ranks upstream prevention
      above anticoagulation as the means of reducing thrombotic risk.

- name: Supportive Care and Fluid Management
  description: >
    Volume replacement, symptom control and monitoring. It is the mainstay of
    treatment for established disease and it is explicitly consensus-based
    rather than trial-based - the honest reason this entry's therapeutic weight
    sits on prevention rather than on treatment.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Intravascular Volume Depletion and Hemoconcentration
    treatment_effect: MODULATES
    description: >
      Replaces circulating volume without addressing the permeability lesion
      that keeps redistributing it.
  evidence:
  - reference: PMID:27273307
    reference_title: "Pathophysiology, treatment and prevention of ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment is largely supportive and is based mainly on consensus
      statements rather than evidence.
    explanation: >-
      States both that supportive care is the mainstay and that its evidence
      base is consensus rather than trial data.
discussions:
- discussion_id: ohss_causal_chain_rests_on_the_rat
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    The VEGF-A/VEGFR-2 causal chain is established by expression timing,
    ovariectomy source control and receptor blockade - all in the
    hyperstimulated rat. Does the human evidence go beyond association?
  attaches_to:
  - pathophysiology#Ovarian VEGF-A Hypersecretion
  - pathophysiology#VEGFR-2 Activation on Vascular Endothelium
  - pathophysiology#Increased Systemic Vascular Permeability
  rationale: >-
    In women the mechanism is supported by correlation (VEGF levels, expression
    in luteinized tissue) and by the clinical effect of cabergoline, whose
    proposed target is inferred from the same rat work. The decisive
    experiment - abolishing VEGFR-2 signalling and watching the syndrome
    disappear - cannot be done in women, because the specific receptor
    inhibitor that produced it in the rat is itself thromboembolic and
    disrupts the angiogenesis a pregnancy needs. The mechanism is recorded as
    CANONICAL because no competing account explains the ovariectomy and
    blockade results, but the human link is pharmacological and partial.
  proposed_experiments:
  - experiment_id: ohss_cabergoline_pd_confirmation
    name: Pharmacodynamic confirmation of the cabergoline target in women
    description: >
      Measure circulating VEGF-A and a VEGFR-2 pathway activity marker before
      and after prophylactic cabergoline in high-risk women, with vascular
      permeability estimated by a validated surrogate, to establish whether the
      clinical benefit tracks the proposed molecular target.
  evidence:
  - reference: PMID:16901966
    reference_title: "Low-dose dopamine agonist administration blocks vascular endothelial growth factor (VEGF)-mediated vascular hyperpermeability without altering VEGF receptor 2-dependent luteal angiogenesis in a rat ovarian hyperstimulation model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, due to its toxicity (thromboembolism) and disruption of
      VEGFR-2-dependent angiogenic processes critical for pregnancy, this kind
      of compound cannot be used clinically to prevent OHSS.
    explanation: >-
      States exactly why the decisive rat experiment cannot be repeated in
      women, which is the substance of this mismatch.

- discussion_id: ohss_hcg_not_necessary
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    If hCG is no longer considered necessary for OHSS to occur, what does the
    hCG-driven luteinization node actually represent - a required step or the
    usual one?
  attaches_to:
  - pathophysiology#hCG-Driven Luteinization of the Enlarged Follicle Cohort
  rationale: >-
    This entry models hCG exposure as the committing step, following the
    priming-then-hCG account that the mechanism literature states directly.
    A recent review reports that case reports have overturned the assumption
    that hCG is necessary. Those cases are not characterised well enough to
    model an alternative entry route, so the node is retained as written and
    the gap recorded rather than papered over: what remains unknown is which
    signal substitutes for hCG in hCG-independent cases, and whether it
    converges on the same VEGF node.
  evidence:
  - reference: PMID:27273307
    reference_title: "Pathophysiology, treatment and prevention of ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Human chorionic gonadotropin was previously thought to be necessary for
      OHSS to occur; however, recent case reports have proven otherwise.
    explanation: >-
      The statement that opens this gap against the node as curated.

- discussion_id: ohss_cabergoline_severe_disease
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does cabergoline prevent the disease that matters? The randomised evidence
    shows a reduction in moderate but not severe OHSS.
  attaches_to:
  - pathophysiology#VEGFR-2 Activation on Vascular Endothelium
  rationale: >-
    The Cochrane review found a significant reduction in moderate OHSS
    (OR 0.38) and no significant effect on severe OHSS (OR 0.77, CI crossing 1)
    across only two trials and 230 women. Two readings are available and the
    data do not separate them: the trials may simply be underpowered for the
    rarer severe endpoint, or partial VEGFR-2 inhibition may be sufficient for
    the moderate but not the severe phenotype. The distinction matters because
    severe disease is where the mortality is, and because the second reading
    would be evidence that the permeability lesion is not the whole story at
    the severe end.
  evidence:
  - reference: PMID:22336848
    reference_title: "Cabergoline for preventing ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only two trials involving 230 women met the inclusion criteria.
    explanation: >-
      The size of the evidence base, which is what makes the two readings
      indistinguishable.
  - reference: PMID:22336848
    reference_title: "Cabergoline for preventing ovarian hyperstimulation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cabergoline appears to reduce the risk of OHSS in high-risk women,
      especially for moderate OHSS.
    explanation: >-
      The reviewers' own hedged conclusion, restricted to moderate disease.

- discussion_id: ohss_cytokines_cause_or_consequence
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Are the elevated inflammatory cytokines of severe OHSS drivers of vascular
    permeability, or markers of the severity that permeability has already
    produced?
  attaches_to:
  - pathophysiology#Inflammatory Cytokine Amplification
  rationale: >-
    Human data are consistent with either reading: cytokines correlate with
    haematocrit, leukocytosis and oestradiol, rise and fall with the clinical
    course, and are concentrated in ascitic fluid - all of which a downstream
    marker would also do. No interventional study has tested cytokine blockade
    against a permeability endpoint in this disease, which is why the
    corresponding causal edge is typed UNKNOWN rather than being given a
    direction it has not earned.
  proposed_experiments:
  - experiment_id: ohss_cytokine_permeability_timing
    name: Temporal separation of cytokine rise from permeability onset
    description: >
      Serial sampling from the trigger onward in high-risk women, measuring
      IL-6 alongside a permeability surrogate, to establish whether the
      cytokine rise precedes or follows the onset of fluid shift.
notes: >-
  Curated from primary literature and reviews retrieved directly from PubMed;
  no deep-research provider report was generated or consumed for this entry, so
  none is cited and none exists under `research/`.

  Two deliberate omissions. Severity grading (mild / moderate / severe /
  critical) is described in the cited literature but the cached abstracts do
  not carry the threshold values, so no `stages` block was invented; the
  classification is referenced in prose only. And no `biochemical` block was
  added: haematocrit, oestradiol and IL-6 appear as `phenotypes` because the
  available snippets report them as characteristics of the syndrome rather
  than with reference intervals or assay detail.

  Module conformance was considered for `thrombogenesis` and claimed at two
  nodes only - Virchow-triad context and thrombus formation - with the
  coagulation-cascade node deliberately not claimed. The reasoning is recorded
  in the `notes:` of the hemoconcentration node rather than left implicit.

  The `Increased Systemic Vascular Permeability` node is the natural
  conformance target for a future permeability/capillary-leak module, which
  does not yet exist in `kb/modules/`; the same VEGF-A/VEGFR-2 chain recurs in
  systemic capillary leak syndrome and in anti-VEGF-responsive oedema, so such
  a module would have conformers beyond this entry.

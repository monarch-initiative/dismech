- name: EGR1-TIE1 Amplification of Granulosa VEGF Output
  biological_scale: MOLECULAR
  role: modifier
  mechanism_confidence: PROVISIONAL
  description: >-
    A proposed amplifier sitting between the hCG signal and the VEGF surge,
    and the most substantial recent addition to the mechanism. Tie1 is an
    endothelial receptor tyrosine kinase, but it is also expressed in granulosa
    cells, where hCG raises it through PI3K/AKT signalling and through EGR1
    binding directly to the Tie1 promoter. The functional claim is the
    informative one: silencing Tie1 abolished the hCG-induced rise in VEGF in a
    human granulosa-lutein cell line and attenuated OHSS in rats. If that holds
    in humans it identifies a target upstream of VEGF itself, which would avoid
    the problem that blocking VEGFR-2 also blocks the angiogenesis a pregnancy
    needs. It is curated as PROVISIONAL and as a modifier rather than a
    required step because the evidence is entirely from patient-derived
    cultured cells, a granulosa-lutein cell line and a rat model; the authors
    state explicitly that clinical relevance is not yet addressed.

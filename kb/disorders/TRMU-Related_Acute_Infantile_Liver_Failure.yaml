    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two homoplasmic mitochondrial tRNA mutations (m.14674T>C/G in mt-tRNA(Glu)) have been reported to cause severe infantile mitochondrial myopathy in the first months of life."
    explanation: Describes the parallel reversible entity and its distinct genetic cause and target organ.
treatments:
- name: L-Cysteine Supplementation
  description: >-
    The disease-targeted therapy, and an unusually direct one - it supplies the
    sulfur donor the deficient enzyme is short of, during the window in which the
    infant cannot supply it endogenously. Guidance is to start as soon as the
    diagnosis is suspected rather than waiting for confirmation, and two infants
    treated before becoming symptomatic had a milder course than their affected
    relatives.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: L-cysteine
      term:
        id: CHEBI:17561
        label: L-cysteine
    - preferred_term: N-acetyl-L-cysteine
      term:
        id: CHEBI:28939
        label: N-acetyl-L-cysteine
  target_mechanisms:
  - target: Developmental Cysteine Limitation
    description: >-
      Acts directly on the substrate-limitation node, which is the only node in
      this entry that a treatment currently reaches.
    evidence:
    - reference: PMID:37184193
      reference_title: "TRMU Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "L-cysteine, with or without N-acetylcysteine (NAC), should be initiated as soon as a diagnosis of TRMU deficiency is suspected."
      explanation: States the intervention and the urgency with which it is recommended.
  evidence:
  - reference: PMID:36305855
    reference_title: "Genotypic and phenotypic spectrum of infantile liver failure due to pathogenic TRMU variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Supplementation with at least 1 cysteine source, typically N-acetylcysteine, improved survival significantly."
    explanation: >-
      The strongest efficacy evidence available: a survival benefit across an
      international series of 62 patients. Retrospective and unrandomised, but far
      beyond the case-level evidence that preceded it.
  - reference: PMID:37184193
    reference_title: "TRMU Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, two infants treated presymptomatically overall had a milder clinical course than their affected relatives."
    explanation: >-
      A separate and narrower claim, kept because it is the only evidence bearing
      on treatment started *before* symptoms rather than after. Two patients
      against family controls.
  - reference: PMID:33485800
    reference_title: "TRMU deficiency: A broad clinical spectrum responsive to cysteine supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "combined N-acetylcysteine and L-cysteine supplementation should be considered prior to molecular diagnosis, as this is a low-risk approach that may increase survival"
    explanation: >-
      Supports treating before genetic confirmation, which is the practical
      corollary of a substrate-limited window that closes on its own schedule.

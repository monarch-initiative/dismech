animal_models:
- name: Liver-specific Mtu1 knockout mouse
  species: Mouse
  genotype: Liver-specific conditional Mtu1 knockout
  publication: PMID:27689697
  description: >-
    The model that established TRMU loss as a primary cause of the liver injury
    rather than a correlate, and the only model that isolates the affected tissue.
    A germline knockout is embryonic lethal, which is why the conditional was
    needed.
  modeled_mechanisms:
  - target: Hepatocyte Energy Failure and Death
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Hepatic inflammation with raised plasma lactate and AST, on a background of
      lost 2-thiolation and impaired mitochondrial translation.
    limitations: >-
      A conditional knockout is a complete loss in the target tissue, while most
      human alleles are partial. That difference matters here more than usual,
      because the whole clinical picture turns on residual activity interacting
      with a transient substrate shortage - and a mouse with no enzyme at all
      cannot model a window that opens and closes.
    readouts:
    - name: Plasma lactate and AST
      target: Hepatocyte Energy Failure and Death
      direction: INCREASED
      interpretation: Biochemical correlate of the hepatocyte injury node.
      evidence:
      - reference: PMID:27689697
        reference_title: "Mtu1-Mediated Thiouridine Formation of Mitochondrial tRNAs Is Required for Mitochondrial Translation and Is Involved in Reversible Infantile Liver Injury."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "mice, which exhibited symptoms of liver injury characterized by hepatic inflammation and elevated levels of plasma lactate and AST."
        explanation: Reports the measurements behind this readout.
    evidence:
    - reference: PMID:27689697
      reference_title: "Mtu1-Mediated Thiouridine Formation of Mitochondrial tRNAs Is Required for Mitochondrial Translation and Is Involved in Reversible Infantile Liver Injury."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The present study demonstrates that Mtu1-dependent 2-thiolation of mt-tRNA is indispensable for mitochondrial translation and that Mtu1 deficiency is a primary cause of RILF."
      explanation: The authors' own statement that the model establishes causation for this disease.
  - target: Combined Respiratory Chain Deficiency
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Broad decrease in respiratory complex activities in hepatocytes, with loss
      of mitochondrial membrane integrity.
    limitations: >-
      The mouse data are reported as a broad decrease across complexes rather than
      with the complex II sparing that is diagnostically characteristic in
      patients, so the model supports the deficiency without reproducing its
      diagnostic signature.
    readouts:
    - name: Respiratory complex activities in hepatocytes
      target: Combined Respiratory Chain Deficiency
      direction: DECREASED
      interpretation: Enzymatic correlate of the respiratory chain node.
      evidence:
      - reference: PMID:27689697
        reference_title: "Mtu1-Mediated Thiouridine Formation of Mitochondrial tRNAs Is Required for Mitochondrial Translation and Is Involved in Reversible Infantile Liver Injury."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "a broad decrease in respiratory complex activities in the hepatocytes"
        explanation: Reports the enzymatic measurement.
diagnosis:
- name: TRMU sequencing
  description: >-
    Biallelic pathogenic TRMU variants on molecular genetic testing establish the
    diagnosis in a proband with suggestive findings. Diagnosis matters urgently
    rather than academically, because it changes treatment.
  evidence:
  - reference: PMID:37184193
    reference_title: "TRMU Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of TRMU deficiency is established in a proband with suggestive findings and biallelic pathogenic (or likely pathogenic) variants in TRMU identified by molecular genetic testing."
    explanation: States the diagnostic criterion.
- name: Respiratory chain enzymology with mtDNA quantification
  description: >-
    A combined complex deficiency with normal mtDNA copy number is the pattern
    that distinguishes a mitochondrial translation defect from the far commoner
    mtDNA-depletion hepatopathies. Complex II is characteristically spared.
  evidence:
  - reference: PMID:23625533
    reference_title: "Mitochondrial Infantile Liver Disease due to TRMU Gene Mutations: Three New Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is characterized by a combined defect of respiratory chain complexes without mitochondrial DNA depletion."
    explanation: Names the discriminating biochemical pattern.
differential_diagnoses:
- name: mtDNA depletion syndrome hepatopathies
  description: >-
    POLG, DGUOK and MPV17 disease present the same way in the same age group -
    infantile liver failure with a combined respiratory chain deficiency - and are
    much commoner. They are also not reversible, so distinguishing them changes
    both prognosis and management.
  distinguishing_features:
  - mtDNA copy number is reduced in the depletion syndromes and normal in TRMU deficiency.
  - Spontaneous recovery is characteristic of TRMU deficiency and not of the depletion syndromes.
  evidence:
  - reference: PMID:23625533
    reference_title: "Mitochondrial Infantile Liver Disease due to TRMU Gene Mutations: Three New Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitochondrial DNA depletions, induced by mutations of the nuclear genes POLG, DGUOK, and MPV17, are the major causes of these combined deficiencies."
    explanation: Names the commoner alternatives that share the biochemical phenotype.
  - reference: PMID:23625533
    reference_title: "Mitochondrial Infantile Liver Disease due to TRMU Gene Mutations: Three New Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spontaneous remission is a rare feature in mitochondrial liver diseases, and early identification of TRMU mutations could impact on clinical management."
    explanation: States why the distinction changes management.
- name: Reversible infantile mitochondrial myopathy
  description: >-
    The other well-described reversible mitochondrial disease of infancy, caused by
    homoplasmic m.14674T>C/G in mt-tRNA-Glu. It shares the striking natural
    history - severe illness in the first months, then recovery if supported - but
    the target organ is muscle rather than liver.
  distinguishing_features:
  - Presents as severe infantile myopathy rather than liver failure.
  - Caused by a homoplasmic mitochondrial tRNA variant, not a nuclear gene defect.
  evidence:
  - reference: PMID:25407320
    reference_title: "Reversible infantile mitochondrial diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two homoplasmic mitochondrial tRNA mutations (m.14674T>C/G in mt-tRNA(Glu)) have been reported to cause severe infantile mitochondrial myopathy in the first months of life."
    explanation: Describes the parallel reversible entity and its distinct genetic cause and target organ.
treatments:
- name: L-Cysteine Supplementation
  description: >-
    The disease-targeted therapy, and an unusually direct one - it supplies the
    sulfur donor the deficient enzyme is short of, during the window in which the
    infant cannot supply it endogenously. Guidance is to start as soon as the
    diagnosis is suspected rather than waiting for confirmation, and two infants
    treated before becoming symptomatic had a milder course than their affected
    relatives.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

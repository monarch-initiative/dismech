differential_diagnoses:
- name: mtDNA depletion syndrome hepatopathies
  description: >-
    POLG, DGUOK and MPV17 disease present the same way in the same age group -
    infantile liver failure with a combined respiratory chain deficiency - and are
    much commoner. They are also not reversible, so distinguishing them changes
    both prognosis and management.
  distinguishing_features:
  - mtDNA copy number is reduced in the depletion syndromes and normal in TRMU deficiency.
  - Spontaneous recovery is characteristic of TRMU deficiency and not of the depletion syndromes.
  evidence:
  - reference: PMID:23625533
    reference_title: "Mitochondrial Infantile Liver Disease due to TRMU Gene Mutations: Three New Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitochondrial DNA depletions, induced by mutations of the nuclear genes POLG, DGUOK, and MPV17, are the major causes of these combined deficiencies."
    explanation: Names the commoner alternatives that share the biochemical phenotype.
  - reference: PMID:23625533
    reference_title: "Mitochondrial Infantile Liver Disease due to TRMU Gene Mutations: Three New Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spontaneous remission is a rare feature in mitochondrial liver diseases, and early identification of TRMU mutations could impact on clinical management."
    explanation: States why the distinction changes management.
- name: Reversible infantile mitochondrial myopathy
  description: >-
    The other well-described reversible mitochondrial disease of infancy, caused by
    homoplasmic m.14674T>C/G in mt-tRNA-Glu. It shares the striking natural
    history - severe illness in the first months, then recovery if supported - but
    the target organ is muscle rather than liver.
  distinguishing_features:
  - Presents as severe infantile myopathy rather than liver failure.
  - Caused by a homoplasmic mitochondrial tRNA variant, not a nuclear gene defect.

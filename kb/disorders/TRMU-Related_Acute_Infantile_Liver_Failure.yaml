      evidence_source: HUMAN_CLINICAL
      snippet: "L-cysteine, with or without N-acetylcysteine (NAC), should be initiated as soon as a diagnosis of TRMU deficiency is suspected."
      explanation: States the intervention and the urgency with which it is recommended.
  evidence:
  - reference: PMID:37184193
    reference_title: "TRMU Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, two infants treated presymptomatically overall had a milder clinical course than their affected relatives."
    explanation: >-

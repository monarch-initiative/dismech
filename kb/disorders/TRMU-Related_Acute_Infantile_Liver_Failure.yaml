- name: Avoidance of Mitochondrial Stressors
  description: >-
    An explicit list of things not to do: drugs that raise metabolic demand such
    as corticosteroids, drugs that inhibit mitochondrial activity such as valproic
    acid and prolonged propofol infusion, and fasting. Acetaminophen is to be
    considered avoidable during episodes of liver dysfunction. This is management
    that follows from the mechanism rather than from empirical outcome data.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37184193
    reference_title: "TRMU Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Avoid medications that increase metabolic demand (such as corticosteroids) or inhibit mitochondrial activity (such as valproic acid and prolonged propofol infusion) and fasting, as it increases metabolic demand and may exacerbate hypoglycemia."
    explanation: The agents-to-avoid guidance, quoted from the GeneReviews management section.
- name: Surveillance of Survivors
  description: >-
    Routine follow-up to monitor the response to cysteine and to catch the
    manifestations that emerge after the hepatic phase - persistent
    neurodevelopmental delay, new seizures, cardiomyopathy. This is the operational
    consequence of the third progression phase: surviving the crisis is the point
    at which surveillance starts, not the point at which it stops.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Acute Infantile Liver Failure
    description: >-
      Detects late-emerging disease rather than acting on a mechanism.
  evidence:
  - reference: PMID:37184193
    reference_title: "TRMU Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Routine follow up is recommended to monitor response to L-cysteine and NAC supplementation, to evaluate response to supportive interventions, and to identify emergence of new findings or concerns regarding developmental/educational progress"
    explanation: States the surveillance recommendation and what it is looking for.
- name: Genetic Counseling and Presymptomatic Sibling Supplementation
  description: >-
    Autosomal recessive, so each sib has a 25 percent risk. What makes counselling
    here more than risk arithmetic is the action attached to it: an at-risk newborn
    sibling should be offered cysteine supplementation until testing for the
    family variants is complete, because waiting for the result can mean waiting
    past the window. Prenatal testing has been used once to inform maternal
    supplementation.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  target_mechanisms:
  - target: Developmental Cysteine Limitation
    description: >-
      Identifies at-risk infants early enough for substrate supply to be restored
      before the window opens.
  evidence:
  - reference: PMID:37184193
    reference_title: "TRMU Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If prenatal testing has not been performed on a pregnancy at risk, supplementation with L-cysteine (and possibly N-acetylcysteine) of an at-risk newborn sib should be offered until molecular genetic testing for the family-specific TRMU pathogenic variants has been completed."
    explanation: The specific recommendation to treat before the diagnosis is confirmed in a sibling.
  - reference: PMID:37184193
    reference_title: "TRMU Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "each sib of an affected individual has at conception a 25% chance of being affected"
    explanation: The recurrence risk that counselling conveys.
discussions:
- discussion_id: trmu_cysteine_window_untested
  kind: KNOWLEDGE_GAP
  prompt: >-
    Has the cysteine-limitation window ever been measured, rather than inferred
    from the age at which infants present?
  rationale: >-
    The substrate-limitation model is the organising idea of this disease. It
    explains the onset, the offset, and the treatment, and it is stated as a
    proposal by the authors who introduced it - "we propose that there is a window
    of time". What is missing is a measurement: nobody has shown hepatic cysteine
    availability tracking mt-tRNA thiolation in a TRMU-deficient infant, or
    demonstrated that thiolation actually rises as the transsulfuration pathway
    matures. The clinical evidence that acting on the model works is now
    substantial - cysteine supplementation improved survival significantly across
    62 patients - but that is a retrospective, unrandomised comparison, and it
    demonstrates that supplying cysteine helps rather than that endogenous
    cysteine shortage is what opens the window in the first place. The narrower
    presymptomatic evidence is still two infants against family controls. The question is not academic: if something
    other than cysteine supply closes the window, then cysteine supplementation is
    treating a correlate, and the timing of when it can be safely stopped is
    unknown.
  attaches_to:

- name: Avoidance of Mitochondrial Stressors
  description: >-
    An explicit list of things not to do: drugs that raise metabolic demand such
    as corticosteroids, drugs that inhibit mitochondrial activity such as valproic
    acid and prolonged propofol infusion, and fasting. Acetaminophen is to be
    considered avoidable during episodes of liver dysfunction. This is management
    that follows from the mechanism rather than from empirical outcome data.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37184193
    reference_title: "TRMU Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Avoid medications that increase metabolic demand (such as corticosteroids) or inhibit mitochondrial activity (such as valproic acid and prolonged propofol infusion) and fasting, as it increases metabolic demand and may exacerbate hypoglycemia."
    explanation: The agents-to-avoid guidance, quoted from the GeneReviews management section.
discussions:
- discussion_id: trmu_cysteine_window_untested
  kind: KNOWLEDGE_GAP
  prompt: >-
    Has the cysteine-limitation window ever been measured, rather than inferred
    from the age at which infants present?
  rationale: >-
    The substrate-limitation model is the organising idea of this disease. It
    explains the onset, the offset, and the treatment, and it is stated as a
    proposal by the authors who introduced it - "we propose that there is a window
    of time". What is missing is a measurement: nobody has shown hepatic cysteine
    availability tracking mt-tRNA thiolation in a TRMU-deficient infant, or
    demonstrated that thiolation actually rises as the transsulfuration pathway
    matures. The clinical evidence that the model works is two presymptomatically
    treated infants who did better than their relatives, which is encouraging and
    is not a controlled comparison. The question is not academic: if something
    other than cysteine supply closes the window, then cysteine supplementation is
    treating a correlate, and the timing of when it can be safely stopped is
    unknown.
  attaches_to:
  - pathophysiology#Developmental Cysteine Limitation
  - treatments#L-Cysteine Supplementation
  evidence:
  - reference: PMID:19732863
    reference_title: "Acute infantile liver failure due to mutations in the TRMU gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we propose that there is a window of time whereby patients with TRMU mutations are at increased risk of developing liver failure"
    explanation: The claim is framed by its own authors as a proposal, which is the point of this gap.
  - reference: PMID:37184193
    reference_title: "TRMU Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, two infants treated presymptomatically overall had a milder clinical course than their affected relatives."
    explanation: The full extent of the human efficacy evidence for acting on the model.
- discussion_id: trmu_proteostress_arm_is_from_sister_enzyme
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the cytosolic proteostress mechanism shown for Mto1 deficiency also
    operate in TRMU deficiency, and does it operate in human liver?
  rationale: >-
    The proteostress arm is attractive because it would explain damage beyond
    simple energy failure and because chemical chaperones rescued it - a
    therapeutic lead that does not exist elsewhere in this disease. But the
    evidence comes from Mto1-deficient cells and mice, not Trmu-deficient ones.
    Mto1 adds the taurine group and TRMU adds the sulfur, at the same wobble
    position of the same three mt-tRNAs, and both losses impair mitochondrial
    translation - so the inference is reasonable. It is still an inference across
    enzymes, and it has a second gap on top: the Trmu liver-specific mouse, which
    is the right enzyme in the right tissue, reports cytoprotective and
    mitochondrial-proliferation responses rather than a cytotoxic unfolded protein
    response. Those are not the same picture, and nobody has looked for either in
    human TRMU-deficient liver. Until they are reconciled, the proteostress node
    should not be treated as a target.
  attaches_to:
  - pathophysiology#Cytosolic Proteostress from Mistargeted Mitochondrial Proteins
  evidence:
  - reference: PMID:29320742
    reference_title: "Defective Mitochondrial tRNA Taurine Modification Activates Global Proteostress and Leads to Mitochondrial Disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we showed that taurine modification is catalyzed by mitochondrial optimization 1 (Mto1) in mammals."
    explanation: Establishes that the proteostress work concerns Mto1, the sister enzyme, and not TRMU.
  - reference: PMID:27689697
    reference_title: "Mtu1-Mediated Thiouridine Formation of Mitochondrial tRNAs Is Required for Mitochondrial Translation and Is Involved in Reversible Infantile Liver Injury."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mitochondrial dysfunction induced signaling pathways related to mitochondrial proliferation and the suppression of oxidative stress"
    explanation: >-
      The right-enzyme model reports a compensatory rather than a cytotoxic stress
      response, which is the tension this discussion records.
- discussion_id: trmu_reversibility_versus_leigh_presentation
  kind: KNOWLEDGE_GAP
  prompt: >-
    What separates the infants who recover completely from those who die, or who
    present with Leigh-like brain lesions?
  rationale: >-
    The disease is named for its reversibility, but four of thirteen infants in
    the founding cohort died in the acute episode, one of three in a later series
    died, and both reported patients with Leigh-like neuroimaging died - one at 25
    days and one at six months. Residual 2-thiolation correlates with prognosis in
    cell-line work, which is the best available answer and is a laboratory
    measurement not available at the bedside. Whether the Leigh-like presentation
    is simply the severe end of one spectrum, or a distinct route in which the
    brain is affected primarily rather than secondarily, is unresolved, and the
    two published patients are too few to tell. This matters for counselling: a
    family told the disease is reversible is being told something true of
    survivors.
  attaches_to:
  - pathophysiology#Acute Infantile Liver Failure
  - phenotypes#Leigh-Like Brain Lesions
  evidence:
  - reference: PMID:19732863
    reference_title: "Acute infantile liver failure due to mutations in the TRMU gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four died during the acute episodes, and the survivors never had a recurrence."
    explanation: Quantifies the mortality that the label "reversible" does not convey.
  - reference: PMID:38113276
    reference_title: "Pathological mutations promote proteolysis of mitochondrial tRNA-specific 2-thiouridylase 1 (MTU1) via mitochondrial caseinolytic peptidase (CLPP)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "clinical data analysis underscores a significant correlation between patient prognosis and residual 2-thiolation levels, which is partially consistent with the AlphaMissense predictions"
    explanation: The best current predictor of outcome, and the reason to think severity is graded rather than categorical.

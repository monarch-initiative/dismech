name: TRMU-Related Acute Infantile Liver Failure
category: Mendelian
creation_date: "2026-08-29T19:15:00Z"
synonyms:
- TRMU deficiency
- MTU1 deficiency
- reversible infantile liver failure
- transient infantile liver failure
- LFIT
- acute infantile liver failure due to synthesis defect of mtDNA-encoded proteins
description: >-
  A mitochondrial hepatopathy that is often survivable and, in survivors,
  non-recurrent - which is close to unique among mitochondrial diseases. TRMU
  (also called MTU1) adds a sulfur atom to the wobble uridine of three
  mitochondrial tRNAs, and without that modification mitochondrial translation
  fails and the respiratory chain complexes that depend on mtDNA-encoded subunits
  cannot be built. The reason the disease has a beginning and an end is that TRMU
  needs cysteine as its sulfur donor, and cysteine supply is low in the first
  months of life because the transsulfuration pathway matures after birth. A
  hypomorphic TRMU allele is therefore only limiting inside that window. Infants
  typically decompensate between two and four months with liver failure and lactic
  acidosis; those who are supported through the crisis can recover essentially
  normal liver function and not relapse. That mechanism is also the treatment:
  L-cysteine, with or without N-acetylcysteine, supplies the missing substrate.
  It is not benign - a substantial minority die in the acute episode, and
  neurological, cardiac and respiratory features can persist or emerge later.
disease_term:
  preferred_term: TRMU-related acute infantile liver failure
  term:
    id: MONDO:0013111
    label: acute infantile liver failure due to synthesis defect of mtDNA-encoded proteins
parents:
- Mitochondrial disease
- Infantile liver failure
inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic TRMU variants. Most reported patients are compound heterozygotes,
    and most disease-associated missense alleles retain partial activity - which
    matters, because residual thiolation is what correlates with survival.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:37184193
    reference_title: "TRMU Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TRMU deficiency is inherited in an autosomal recessive manner."
    explanation: States the inheritance mode.
  - reference: PMID:38113276
    reference_title: "Pathological mutations promote proteolysis of mitochondrial tRNA-specific 2-thiouridylase 1 (MTU1) via mitochondrial caseinolytic peptidase (CLPP)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "our results showed that most disease-related mutations are partial loss-of-function mutations, with three mutations being particularly severe"
    explanation: Establishes that most alleles are hypomorphic rather than null, which is what makes a substrate-limited window relevant.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than 30 patients had been published as of 2020. No population-based
    estimate exists. The count is almost certainly an undercount: an infant who
    survives an unexplained episode of liver failure and then recovers completely
    is not obviously a candidate for mitochondrial gene testing.
  evidence:
  - reference: PMID:33365252
    reference_title: "Leigh syndrome associated with TRMU gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TRMU deficiency causes an early onset potentially reversible acute liver failure, so far reported in less than 30 patients."
    explanation: Gives the published case count.
pathophysiology:
- name: Biallelic TRMU Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    TRMU, also called MTU1, is the nuclear-encoded mitochondrial 2-thiouridylase.
    Biallelic variants reduce its activity. Most disease alleles are partial
    rather than complete losses, and the residual activity is prognostic rather
    than incidental - patient outcome correlates with how much 2-thiolation the
    mutant enzyme still manages.
  gene:
    preferred_term: TRMU
    description: >-
      Mitochondrial tRNA-specific 2-thiouridylase 1, carrying biallelic
      loss-of-function variants.
    modifier: LOSS_OF_FUNCTION
    term:
      id: hgnc:25481
      label: TRMU
  evidence:
  - reference: PMID:19732863
    reference_title: "Acute infantile liver failure due to mutations in the TRMU gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Using homozygosity mapping, we identified mutations in the TRMU gene, which encodes a mitochondria-specific tRNA-modifying enzyme, tRNA 5-methylaminomethyl-2-thiouridylate methyltransferase."
    explanation: The gene assignment in the founding cohort.
  - reference: PMID:38113276
    reference_title: "Pathological mutations promote proteolysis of mitochondrial tRNA-specific 2-thiouridylase 1 (MTU1) via mitochondrial caseinolytic peptidase (CLPP)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "clinical data analysis underscores a significant correlation between patient prognosis and residual 2-thiolation levels"
    explanation: >-
      Makes residual enzyme activity a prognostic quantity, which is the basis for
      treating the deficit as graded rather than all-or-nothing.
  downstream:
  - target: Loss of mt-tRNA 2-Thiouridylation
    causal_link_type: DIRECT
  - target: CLPP-Mediated Degradation of Mutant MTU1
    causal_link_type: DIRECT
    description: >-
      A second route from the same variants: the mutant protein is not only less
      active, it is less abundant.

- name: CLPP-Mediated Degradation of Mutant MTU1
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Missense-mutant MTU1 is recognised and rapidly degraded by the mitochondrial
    matrix protease CLPP, working through its chaperone partner CLPX. So a
    hypomorphic allele loses activity twice over - the enzyme is impaired and then
    thrown away. Knocking down CLPP restores both mutant MTU1 protein levels and
    mt-tRNA 2-thiolation, which makes this the only currently identified
    druggable node upstream of the thiolation defect. PROVISIONAL because the
    work is entirely in engineered cell lines; no patient has been shown to have
    accelerated MTU1 turnover in vivo, and no CLPP inhibitor has been tried.
  evidence:
  - reference: PMID:38113276
    reference_title: "Pathological mutations promote proteolysis of mitochondrial tRNA-specific 2-thiouridylase 1 (MTU1) via mitochondrial caseinolytic peptidase (CLPP)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "Mutant MTU1 is rapidly degraded by mitochondrial caseinolytic peptidase (CLPP) through a direct interaction with its chaperone protein CLPX."
    explanation: Establishes the degradation route and the protease responsible.
  - reference: PMID:38113276
    reference_title: "Pathological mutations promote proteolysis of mitochondrial tRNA-specific 2-thiouridylase 1 (MTU1) via mitochondrial caseinolytic peptidase (CLPP)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "knockdown of CLPP significantly increased mutant MTU1 protein expression and mt-tRNA 2-thiolation, suggesting that accelerated proteolysis of mutant MTU1 plays a role in disease pathogenesis"
    explanation: >-
      The rescue experiment: removing the protease restores the downstream
      modification, which is what makes this a node rather than an observation.
  downstream:
  - target: Loss of mt-tRNA 2-Thiouridylation
    causal_link_type: DIRECT

- name: Developmental Cysteine Limitation
  biological_scale: ORGANISM
  role: trigger
  mechanism_confidence: PROVISIONAL
  description: >-
    The node that makes this disease time-limited. TRMU uses sulfur from cysteine,
    and endogenous cysteine supply is low in the first months of life. A partially
    active enzyme that has enough substrate later does not have enough now, which
    is why the disease has an onset at two to four months and an offset in
    survivors, and why the treatment is to supply the substrate. It is
    PROVISIONAL rather than established because it was proposed as an inference
    from the timing in the founding cohort and has not been demonstrated by
    measuring hepatic cysteine against thiolation in patients; the strongest
    support for it is that acting on it works.
  evidence:
  - reference: PMID:19732863
    reference_title: "Acute infantile liver failure due to mutations in the TRMU gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Given that sulfur is a TRMU substrate and its availability is limited during the neonatal period, we propose that there is a window of time whereby patients with TRMU mutations are at increased risk of developing liver failure."
    explanation: >-
      The originating hypothesis, stated as a proposal by its authors. Graded
      INDIRECT because it is an inference from the age distribution rather than a
      measurement of substrate limitation.
  - reference: PMID:37184193
    reference_title: "TRMU Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Because the endogenous supply of cysteine is normally low in the first few months of life and because the enzyme TRMU requires adequate amounts of cysteine to enable the essential function of thiolating mitochondrial transfer RNAs, the initial manifestations of TRMU deficiency (primarily hepatopathy) may be reversed, ameliorated, or in some cases prevented by exogenous oral cysteine supplementation in infants with TRMU deficiency."
    explanation: >-
      States the substrate-limitation model and its therapeutic corollary as
      current expert guidance.
  downstream:
  - target: Loss of mt-tRNA 2-Thiouridylation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Acts as a co-requirement rather than an independent cause: it limits the
      residual enzyme, and only matters because the enzyme is already impaired.

- name: Loss of mt-tRNA 2-Thiouridylation
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The wobble uridine at position 34 of mt-tRNA-Lys, mt-tRNA-Gln and mt-tRNA-Glu
    normally carries a 2-thio group. Thiolation constrains base pairing so the
    anticodon reads its codons accurately; without it, decoding degrades. The
    modification was measured directly in the founding cohort and found markedly
    reduced.
  biological_processes:
  - preferred_term: mitochondrial tRNA wobble position uridine thiolation
    term:
      id: GO:1990799
      label: mitochondrial tRNA wobble position uridine thiolation
    modifier: DECREASED
  evidence:
  - reference: PMID:19732863
    reference_title: "Acute infantile liver failure due to mutations in the TRMU gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Accordingly, the 2-thiouridylation levels of the mitochondrial tRNAs were markedly reduced."
    explanation: Direct measurement of the modification deficit in patients.
  - reference: PMID:38113276
    reference_title: "Pathological mutations promote proteolysis of mitochondrial tRNA-specific 2-thiouridylase 1 (MTU1) via mitochondrial caseinolytic peptidase (CLPP)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "The 2-thiolation of U34 facilitates U-A and U-G base pairing while inhibiting U-U and U-C base pairing (10), which enables precise codon recognition and ensures accurate decoding."
    explanation: Explains why losing the modification degrades decoding rather than merely destabilising the tRNA.
  downstream:
  - target: Impaired Mitochondrial Translation
    causal_link_type: DIRECT

- name: Impaired Mitochondrial Translation
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Only 13 proteins are made inside the mitochondrion, and all of them are
    respiratory chain subunits. Degrading the accuracy of mitochondrial decoding
    therefore hits the respiratory chain and nothing else directly - which is why
    the biochemical signature is a combined complex deficiency with normal mtDNA
    copy number, the finding that separates this disease from the mtDNA-depletion
    hepatopathies caused by POLG, DGUOK and MPV17.
  biological_processes:
  - preferred_term: mitochondrial translation
    term:
      id: GO:0032543
      label: mitochondrial translation
    modifier: DECREASED
  evidence:
  - reference: PMID:27689697
    reference_title: "Mtu1-Mediated Thiouridine Formation of Mitochondrial tRNAs Is Required for Mitochondrial Translation and Is Involved in Reversible Infantile Liver Injury."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "Mtu1 deficiency resulted in a loss of 2-thiolation in mt-tRNAs, which led to a marked impairment of mitochondrial translation."
    explanation: Links the modification loss to the translation defect in a liver-specific knockout.
  - reference: PMID:19732863
    reference_title: "Acute infantile liver failure due to mutations in the TRMU gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "We report on 13 unrelated infants who presented with acute liver failure and lactic acidemia with normal mtDNA content."
    explanation: >-
      Normal mtDNA content with a respiratory chain defect points to a translation
      rather than a template problem. Graded INDIRECT because it excludes the
      alternative rather than measuring translation.
  downstream:
  - target: Combined Respiratory Chain Deficiency
    causal_link_type: DIRECT
  - target: Cytosolic Proteostress from Mistargeted Mitochondrial Proteins
    causal_link_type: DIRECT

- name: Combined Respiratory Chain Deficiency
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Complexes I, III and IV all contain mtDNA-encoded subunits and all fall
    together; complex II, which is entirely nuclear-encoded, is spared. That
    sparing is diagnostically useful and is reported repeatedly in patient muscle
    biopsies.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  evidence:
  - reference: PMID:27689697
    reference_title: "Mtu1-Mediated Thiouridine Formation of Mitochondrial tRNAs Is Required for Mitochondrial Translation and Is Involved in Reversible Infantile Liver Injury."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "Mtu1LKO mice exhibited severe disruption of mitochondrial membrane integrity and a broad decrease in respiratory complex activities in the hepatocytes."
    explanation: Measures the combined complex deficiency in the tissue that fails clinically.
  - reference: PMID:23625533
    reference_title: "Mitochondrial Infantile Liver Disease due to TRMU Gene Mutations: Three New Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "It is characterized by a combined defect of respiratory chain complexes without mitochondrial DNA depletion."
    explanation: The human biochemical signature, including the absence of mtDNA depletion.
  - reference: PMID:33365252
    reference_title: "Leigh syndrome associated with TRMU gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "The respiratory chain complex activities in muscle biopsy were decreased except for normal CII, and increased citrate synthase activity."
    explanation: >-
      Shows the pattern with complex II spared, which is what a defect confined to
      mtDNA-encoded subunits predicts.
  downstream:
  - target: Hepatocyte Energy Failure and Death
    causal_link_type: DIRECT

- name: Cytosolic Proteostress from Mistargeted Mitochondrial Proteins
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  description: >-
    A second consequence of failed mitochondrial translation, additive to simple
    energy failure. When the organelle cannot translate, nuclear-encoded
    mitochondrial proteins including OPA1 are mistrafficked and aggregate in the
    cytoplasm, triggering a cytotoxic unfolded protein response; chemical
    chaperones suppress the cytotoxicity. The important caveat is that this was
    shown for Mto1, the enzyme that adds the taurine group at the same wobble
    position, not for Trmu, which adds the sulfur. The two modifications sit on
    the same nucleotide of the same three tRNAs and both losses impair
    mitochondrial translation, so the inference is reasonable - but it is an
    inference from a sister enzyme, which is why this node is PROVISIONAL and not
    given a treatment.
  cell_types:
  - preferred_term: Hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: response to unfolded protein
    term:
      id: GO:0006986
      label: response to unfolded protein
    modifier: INCREASED
  evidence:
  - reference: PMID:29320742
    reference_title: "Defective Mitochondrial tRNA Taurine Modification Activates Global Proteostress and Leads to Mitochondrial Disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Mto1-deficient cells exhibited abnormal mitochondrial morphology owing to aberrant trafficking of nuclear DNA-encoded mitochondrial proteins, including Opa1. The mistargeted proteins were aggregated and misfolded in the cytoplasm, which induced cytotoxic unfolded protein response."
    explanation: >-
      The mechanism this node describes. Graded INDIRECT because it was
      established in Mto1-deficient rather than Trmu-deficient cells.
  - reference: PMID:29320742
    reference_title: "Defective Mitochondrial tRNA Taurine Modification Activates Global Proteostress and Leads to Mitochondrial Disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "application of chemical chaperones successfully suppressed cytotoxicity by reducing protein misfolding and increasing functional mitochondrial proteins in Mto1-deficient cells and mice"
    explanation: >-
      A rescue that makes the proteostress causal rather than epiphenomenal in
      that system, and would be the reason to test the same in TRMU deficiency.

- name: Hepatocyte Energy Failure and Death
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    Hepatocytes die, and macrophages infiltrate in response. The liver-specific
    knockout mouse reproduces this, and the same model shows something important
    about the recovery: the injured liver simultaneously turns on mitochondrial
    proliferation and oxidative-stress-suppressing pathways, which the authors
    propose is what prevents catastrophic failure and assists recovery. If that is
    right, reversibility is not only the cysteine window - the tissue is also
    actively compensating.
  cell_types:
  - preferred_term: Hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:27689697
    reference_title: "Mtu1-Mediated Thiouridine Formation of Mitochondrial tRNAs Is Required for Mitochondrial Translation and Is Involved in Reversible Infantile Liver Injury."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "mice, which exhibited symptoms of liver injury characterized by hepatic inflammation and elevated levels of plasma lactate and AST."
    explanation: The tissue injury and its biochemical correlates in the liver-specific model.
  - reference: PMID:27689697
    reference_title: "Mtu1-Mediated Thiouridine Formation of Mitochondrial tRNAs Is Required for Mitochondrial Translation and Is Involved in Reversible Infantile Liver Injury."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Mtu1 deficiency is associated with multiple cytoprotective pathways that might prevent catastrophic liver failure and assist in the recovery from liver injury."
    explanation: >-
      The compensatory arm. Graded INDIRECT because the authors state it as a
      possible contribution to recovery, not a demonstrated one.
  downstream:
  - target: Acute Infantile Liver Failure
    causal_link_type: DIRECT

- name: Acute Infantile Liver Failure
  biological_scale: ORGANISM
  role: outcome
  mechanism_confidence: ESTABLISHED
  description: >-
    Decompensation between two and four months of age with transaminitis,
    coagulopathy, hepatomegaly, lactic acidosis, hypoglycaemia and hyperammonaemia.
    The outcome splits sharply: a substantial minority die during the acute
    episode, while survivors normalise and, in the founding cohort followed for up
    to fourteen years, never relapsed.
  evidence:
  - reference: PMID:19732863
    reference_title: "Acute infantile liver failure due to mutations in the TRMU gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Four died during the acute episodes, and the survivors never had a recurrence. The longest follow-up period was 14 years."
    explanation: Establishes both the mortality of the acute phase and the durability of recovery in survivors.
  - reference: PMID:37184193
    reference_title: "TRMU Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Infants with untreated TRMU deficiency, a mitochondrial disorder, typically become symptomatic between ages two and four months with transient acute liver dysfunction (including elevated transaminases, abnormal synthetic functions, and/or hepatomegaly), metabolic derangements (severe persistent lactic acidosis, hypoglycemia, hyperammonemia), and poor weight gain."
    explanation: The clinical presentation and its timing, from the expert-curated baseline.
progression:
- phase: Acute decompensation
  notes: >-
    Onset at two to four months with liver failure, lactic acidosis, hypoglycaemia
    and hyperammonaemia. This is the phase in which patients die, and it is the
    only phase in which the disease looks like a fulminant hepatopathy.
  evidence:
  - reference: PMID:37184193
    reference_title: "TRMU Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "typically become symptomatic between ages two and four months with transient acute liver dysfunction"
    explanation: Defines the timing and character of the acute phase.
- phase: Hepatic recovery
  notes: >-
    With supportive care alone, liver findings including coagulopathy improve or
    normalise and the metabolic derangements settle. Recovery is not attributed to
    any disease-targeted therapy in the historical cohorts.
  evidence:
  - reference: PMID:37184193
    reference_title: "TRMU Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With proper supportive treatment (but not disease-targeted therapy), abnormal liver findings (including coagulopathy) improve or normalize."
    explanation: States that recovery occurs on supportive care, which is what makes the disease reversible rather than treated.
- phase: Post-hepatic residual and late-emerging disease
  notes: >-
    The phase that makes "reversible" a partly misleading label. Persistent lactic
    acidosis, developmental delay or intellectual disability, seizures,
    cardiomyopathy and respiratory failure may persist or appear later, so
    surviving the hepatic crisis is not the same as being cured.
  evidence:
  - reference: PMID:37184193
    reference_title: "TRMU Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, other manifestations typical of a mitochondrial disorder such as persistent lactic acidosis, neurologic dysfunction (including developmental delay / intellectual disability and seizures), cardiomyopathy, and respiratory failure may persist or develop or over time."
    explanation: Documents the late-emerging manifestations that qualify the reversibility.

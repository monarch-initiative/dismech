    reference_title: "TRMU Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of TRMU deficiency is established in a proband with suggestive findings and biallelic pathogenic (or likely pathogenic) variants in TRMU identified by molecular genetic testing."
    explanation: States the diagnostic criterion.
- name: Respiratory chain enzymology with mtDNA quantification
  description: >-
    A combined complex deficiency with normal mtDNA copy number is the pattern

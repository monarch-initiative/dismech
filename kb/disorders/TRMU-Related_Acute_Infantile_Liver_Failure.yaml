histopathology:
- name: Hepatic injury on biopsy
  description: >-
    Biopsies taken several months after onset showed oncocytic hepatocyte change,
    focal steatosis, focal cytoplasmic ballooning, micronodular cirrhosis,
    canalicular cholestasis, fibrosis and macrovesicular steatosis. The pointed
    finding is the last clause of the sentence: no normal biopsy was reported.
    Clinical recovery in this disease is not the same as histological recovery,
    and a curated entry that says "reversible" without saying that is misleading.
  evidence:
  - reference: PMID:33365252
    reference_title: "Leigh syndrome associated with TRMU gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver biopsies (9/23) showed signs of mild to severe hepatic involvement in biopsies taken several months after onset: oncocytic changes in the hepatocytes, focal steatosis and focal ballooning of cytoplasm, micronodular cirrhosis, canalicular cholestasis to patent signs of fibrosis, irregular cirrhosis with nodulation and macrovesicular steatosis."
    explanation: The full histological description, including that the biopsies postdate the acute episode.
  - reference: PMID:33365252
    reference_title: "Leigh syndrome associated with TRMU gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No normal hepatic biopsies were reported."
    explanation: >-
      The finding that qualifies the reversibility: every biopsied liver showed
      residual abnormality, months after the clinical episode had resolved.

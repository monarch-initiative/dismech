review_notes: >-
  Ten references are cited. Two of them, PMID:36305855 and PMID:33485800, were
  cached by the deep-research citation pass and initially left uncited, which was
  a mistake: PMID:36305855 is a 62-patient international series and is now the
  basis for the cysteine efficacy claim, the genotype-survival correlation, the
  survival denominator, and the acute liver failure frequency band. Two statements
  in the first version of this entry were wrong because it was not read - the
  efficacy evidence was described as two presymptomatically treated infants, and
  residual 2-thiolation was described as the best available prognostic marker when
  a bedside-readable genotype correlation exists. The remaining uncited files come
  from the same citation pass, and DOI_10.1093_nar_gkad1197.md is the same paper
  as the cited PMID:38113276, kept only because the report cites it in DOI form.

  Two snippets failed exact matching on first validation and were corrected
  against the cached text rather than reworded to fit. The first had been
  reconstructed as "Mtu1LKO mice exhibited symptoms of liver injury" where the
  source reads "(Mtu1LKO) mice, which exhibited"; the second carried a bracketed
  citation marker that the validator strips before matching. Both are recorded
  here because the failure mode - a snippet that is nearly right and reads
  perfectly - is the one worth being able to find later.
notes: >-
  Scope and modelling decisions.

  TRMU appears in three existing entries but never as the causal gene of its own
  disease: Aminoglycoside-Induced_Hearing_Loss, where it is a nuclear modifier of
  the m.1555A>G allele, MTO1_Deficiency, and
  Reversible_Infantile_Cytochrome_c_Oxidase_Deficiency. This entry does not
  duplicate any of them. Infantile_Liver_Failure_Syndrome_1 is LARS1, a different
  gene and a different entity, and is not a subtype of this.

  The modifier role is deliberately not curated here. TRMU variants modify
  penetrance of mitochondrial deafness, which is a different phenotype with a
  different mechanism, and folding it in would misrepresent one gene's two
  distinct disease roles as one.

  No environmental section, despite the disease being substrate-limited. Dietary
  cysteine is not an ECTO-style exposure acting on a mechanism node; it is the
  treatment, and it is curated as one. The developmental cysteine shortage is a
  property of infant physiology rather than of the environment, so it is modelled
  as a pathophysiology node.

  No conforms_to. No module in kb/modules covers mitochondrial translation
  failure or tRNA modification; a mitochondrial_translation_failure module would
  be a reasonable follow-up, since MTO1_Deficiency, GTPBP3 disease and this entry
  would all conform to it, but creating one is out of scope for a single curation.

  No clinical trials. Nothing is registered for TRMU deficiency; cysteine
  supplementation entered practice through case reports and expert consensus, not
  a trial, which is worth knowing when reading the treatment section.

animal_models:
- name: Liver-specific Mtu1 knockout mouse
  species: Mouse
  genotype: Liver-specific conditional Mtu1 knockout
  publication: PMID:27689697
  description: >-
    The model that established TRMU loss as a primary cause of the liver injury
    rather than a correlate, and the only model that isolates the affected tissue.
    A germline knockout is embryonic lethal, which is why the conditional was
    needed.
  modeled_mechanisms:
  - target: Hepatocyte Energy Failure and Death
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Hepatic inflammation with raised plasma lactate and AST, on a background of
      lost 2-thiolation and impaired mitochondrial translation.
    limitations: >-
      A conditional knockout is a complete loss in the target tissue, while most
      human alleles are partial. That difference matters here more than usual,
      because the whole clinical picture turns on residual activity interacting
      with a transient substrate shortage - and a mouse with no enzyme at all
      cannot model a window that opens and closes.
    readouts:
    - name: Plasma lactate and AST
      target: Hepatocyte Energy Failure and Death
      direction: INCREASED
      interpretation: Biochemical correlate of the hepatocyte injury node.
      evidence:
      - reference: PMID:27689697
        reference_title: "Mtu1-Mediated Thiouridine Formation of Mitochondrial tRNAs Is Required for Mitochondrial Translation and Is Involved in Reversible Infantile Liver Injury."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "mice, which exhibited symptoms of liver injury characterized by hepatic inflammation and elevated levels of plasma lactate and AST."
        explanation: Reports the measurements behind this readout.
    evidence:
    - reference: PMID:27689697
      reference_title: "Mtu1-Mediated Thiouridine Formation of Mitochondrial tRNAs Is Required for Mitochondrial Translation and Is Involved in Reversible Infantile Liver Injury."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The present study demonstrates that Mtu1-dependent 2-thiolation of mt-tRNA is indispensable for mitochondrial translation and that Mtu1 deficiency is a primary cause of RILF."
      explanation: The authors' own statement that the model establishes causation for this disease.
  - target: Combined Respiratory Chain Deficiency
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Broad decrease in respiratory complex activities in hepatocytes, with loss
      of mitochondrial membrane integrity.
    limitations: >-
      The mouse data are reported as a broad decrease across complexes rather than
      with the complex II sparing that is diagnostically characteristic in
      patients, so the model supports the deficiency without reproducing its
      diagnostic signature.
    readouts:
    - name: Respiratory complex activities in hepatocytes
      target: Combined Respiratory Chain Deficiency
      direction: DECREASED
      interpretation: Enzymatic correlate of the respiratory chain node.
      evidence:
      - reference: PMID:27689697
        reference_title: "Mtu1-Mediated Thiouridine Formation of Mitochondrial tRNAs Is Required for Mitochondrial Translation and Is Involved in Reversible Infantile Liver Injury."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "a broad decrease in respiratory complex activities in the hepatocytes"
        explanation: Reports the enzymatic measurement.
diagnosis:
- name: TRMU sequencing
  description: >-
    Biallelic pathogenic TRMU variants on molecular genetic testing establish the

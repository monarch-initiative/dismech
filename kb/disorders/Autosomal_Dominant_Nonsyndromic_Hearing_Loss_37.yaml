    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals presented with early-onset progressive mild hearing impairment with a fairly flat, gently downsloping or U-shaped audiogram configuration."
    explanation: Describes the progressive course and audiogram configuration in the mapping family.

pathophysiology:
- name: COL11A1 Canonical Splice-Site Disruption
  description: The heterozygous intronic substitutions c.652-2A>C and c.652-1G>C alter the intron 4 acceptor; c.4338+2T>C alters a donor site (NM_080629.2 notation). The donor variant is c.4302+2T>C on NM_001854.4 in ClinGen. Their splice effects were tested in minigenes. The two acceptor substitutions produce different transcript products. These are the splice-site cases, not the complete DFNA37 variant spectrum. A coding missense annotation alone neither proves nor excludes an effect on splicing.
  biological_scale: MOLECULAR
  downstream:
  - target: Aberrant Collagen XI Alpha-1 Transcript Processing
    causal_link_type: DIRECT
    description: A disrupted canonical splice site is the direct cause of mis-splicing of the transcript.
    evidence:
    - &id001
      reference: PMID:30245514
      reference_title: Splice-altering variant in COL11A1 as a cause of nonsyndromic hearing loss DFNA37.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In contrast, cells transfected with the mutant vector yielded two bands; one at 372 bp corresponding to the wild-type allele and the second at 234 bp lacking exon 5.
      explanation: The mutant minigene produced both exon-retaining and exon-skipped products in COS7 and HEK293 cells. This is an RNA assay, not a measurement of collagen quantity or matrix assembly.
      quote_role: PRIMARY_RESULT
      directness: DIRECT

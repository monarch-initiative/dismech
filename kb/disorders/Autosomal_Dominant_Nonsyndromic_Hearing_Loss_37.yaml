    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - collagen_xi_matrix_mechanism
    description: Altered transcripts predict changed collagen polypeptides, but the effects on folding, secretion and extracellular assembly remain untested in DFNA37. Residual normal RNA is not proof of preserved protein function or of haploinsufficiency.

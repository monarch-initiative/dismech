      explanation: Establishes the gene-to-deafness link; the edge is typed as having unknown intermediates because the cochlear steps between matrix deficiency and impairment are not demonstrated.
  evidence:
  - reference: PMID:33169910
    reference_title: "Aberrant COL11A1 splicing causes prelingual autosomal dominant nonsyndromic hearing loss in the DFNA37 locus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alpha-chain collagen molecules encoded by genes that include COL11A1 are essential for skeletal, ocular, and auditory function."
    explanation: The basis for treating collagen XI as required in the auditory system; the cochlear localisation of the deficit is inferred rather than shown in patient tissue.
mechanistic_hypotheses:
- hypothesis_group_id: splice_specific_nonsyndromic_restriction
  hypothesis_label: A splice-altering mechanism, not COL11A1 loss of function generally, restricts DFNA37 to a nonsyndromic phenotype
  status: EMERGING
  description: >-
    COL11A1 variants otherwise cause Marshall and Stickler syndromes, in which
    hearing loss is accompanied by ocular, orofacial and skeletal disease. In
    DFNA37 the same gene produces isolated deafness, with syndromic features
    explicitly excluded on detailed examination. Every reported DFNA37 lesion
    to date is splice-altering, and two independent families carry variants at
    the identical intron 4 acceptor site as the index kindred, so the
    restriction to a nonsyndromic phenotype looks tied to the splicing
    mechanism rather than to a general reduction in COL11A1 function.

    No mechanism explaining the separation has been demonstrated. Plausible
    accounts - a transcript consequence tolerated by cartilage and vitreous but
    not by cochlear matrix, or tissue-specific isoform usage - are not tested
    in any published work, and the observation that two variants at the same
    canonical site elicit different splicing outcomes means the transcript
    consequence cannot even be read off the variant position. An alternative
    reading, that syndromic features are mild or late and were missed in small
    families, is not excluded, although the index family's examination was
    detailed and its pedigree large. Recorded as EMERGING accordingly.
  evidence:
  - reference: PMID:30245514
    reference_title: "Splice-altering variant in COL11A1 as a cause of nonsyndromic hearing loss DFNA37."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously, COL11A1 was solely associated with Marshall and Stickler syndromes. This study expands its phenotypic spectrum to include nonsyndromic deafness."
    explanation: States the phenotypic separation this hypothesis is about.
  - reference: PMID:30245514
    reference_title: "Splice-altering variant in COL11A1 as a cause of nonsyndromic hearing loss DFNA37."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Detailed clinical examination excluded any additional symptoms."
    explanation: The exclusion of syndromic features, which is what makes the separation a finding rather than incomplete phenotyping.
  - reference: PMID:33169910
    reference_title: "Aberrant COL11A1 splicing causes prelingual autosomal dominant nonsyndromic hearing loss in the DFNA37 locus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the c.652-1G>C variant affects the same intron 4 canonical splice site originally reported in the DFNA37 family (c.652-2A>C) but elicits a different splicing outcome"
    explanation: The same-site, different-outcome observation that prevents reading the transcript consequence off the variant position.

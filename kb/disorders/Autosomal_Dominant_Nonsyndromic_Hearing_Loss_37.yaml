pathophysiology:
- name: COL11A1 Canonical Splice-Site Disruption
  description: >-
    The reported DFNA37 variants sit on canonical splice sites of COL11A1 -
    c.652-2A>C and c.652-1G>C at the intron 4 acceptor, and c.4338+2T>C at a
    donor site. They are not missense changes in the triple-helical domain but
    lesions in the splicing signal itself, and the effect on RNA splicing was
    confirmed in vitro rather than predicted. Notably, the two intron 4
    variants strike the same canonical site yet elicit different splicing
    outcomes, so the transcript consequence is not fixed by the position alone.
  biological_scale: MOLECULAR
  downstream:
  - target: Aberrant Collagen XI Alpha-1 Transcript Processing
    causal_link_type: DIRECT
    description: >-
      A disrupted canonical splice site is the direct cause of mis-splicing of
      the transcript.
    evidence:
    - reference: PMID:30245514
      reference_title: "Splice-altering variant in COL11A1 as a cause of nonsyndromic hearing loss DFNA37."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The c.652-2A>C variant is novel, highly conserved, and confirmed in vitro to alter RNA splicing."
      explanation: In vitro confirmation that the canonical-site variant actually alters splicing, rather than being predicted to.
  evidence:
  - reference: PMID:30245514
    reference_title: "Splice-altering variant in COL11A1 as a cause of nonsyndromic hearing loss DFNA37."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing identified a novel canonical acceptor splice-site variant c.652-2A>C in the COL11A1 gene within the DFNA37 locus."
    explanation: Identifies the canonical splice-site lesion that defines this node.
  - reference: PMID:33169910
    reference_title: "Aberrant COL11A1 splicing causes prelingual autosomal dominant nonsyndromic hearing loss in the DFNA37 locus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two German families presenting prelingual autosomal dominant nonsyndromic hearing loss with novel COL11A1 heterozygous splice-altering variants (c.652-1G>C and c.4338+2T>C) that were molecularly characterized"
    explanation: Two further families confirm that the recurrent lesion class is splice-altering.
- name: Aberrant Collagen XI Alpha-1 Transcript Processing
  description: >-
    Mis-splicing of COL11A1 yields transcripts that cannot contribute a normal
    alpha-1 chain to the collagen XI heterotrimer. The outcome differs by
    variant - the two intron 4 acceptor-site lesions produce different splicing
    products despite hitting the same site - so this node describes a shared
    consequence reached by more than one transcript route rather than a single
    defined aberrant species.
  biological_scale: MOLECULAR
  downstream:
  - target: Deficient Collagen XI in the Cochlear Extracellular Matrix
    causal_link_type: DIRECT
    description: >-
      Fewer functional alpha-1 chains means less assembled collagen XI
      available to the matrix.
    evidence:
    - reference: PMID:33169910
      reference_title: "Aberrant COL11A1 splicing causes prelingual autosomal dominant nonsyndromic hearing loss in the DFNA37 locus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Alpha-chain collagen molecules encoded by genes that include COL11A1 are essential for skeletal, ocular, and auditory function."
      explanation: States the requirement for the alpha-chain product in auditory function, which is what a mis-spliced transcript fails to supply.
  evidence:
  - reference: PMID:33169910
    reference_title: "Aberrant COL11A1 splicing causes prelingual autosomal dominant nonsyndromic hearing loss in the DFNA37 locus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the c.652-1G>C variant affects the same intron 4 canonical splice site originally reported in the DFNA37 family (c.652-2A>C) but elicits a different splicing outcome"
    explanation: Establishes that distinct splicing outcomes converge on the same disease, which is what this node represents.
- name: Deficient Collagen XI in the Cochlear Extracellular Matrix
  description: >-
    Collagen XI is a structural constituent of the cochlear extracellular
    matrix, including the tectorial membrane whose mechanical properties set
    how hair-cell stereocilia are deflected. A shortfall of normal alpha-1
    chains is the proposed route from the transcript defect to impaired
    mechanotransduction. This step is inferred from the established role of
    collagen XI in auditory function rather than demonstrated in DFNA37 cochlear
    tissue, which is not available.
  biological_scale: TISSUE
  cellular_components:

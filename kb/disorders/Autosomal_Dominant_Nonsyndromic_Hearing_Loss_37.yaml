notes: The reviewed literature supports family-specific clinical and RNA findings, with unresolved protein mechanisms. ClinGen Moderate validity and individual variant classifications are distinct. No DFNA37-specific drug or gene therapy, interventional trial or genotype-specific outcome estimate was identified in the reviewed sources. A reported intervention in a VUS carrier is not efficacy evidence.

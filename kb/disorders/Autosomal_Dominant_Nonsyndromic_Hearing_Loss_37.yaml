      label: COL11A1
  notes: Linkage in the original family mapped 1p21 with LOD 8.29; c.652-2A>C segregated among 48 genotyped relatives. The three functionally studied splice variants have distinct RNA outcomes. ClinGen's 2025 curation also includes three frameshift and two missense variants. The Czech c.1560delC observation is a frameshift, not an experimentally demonstrated splice defect. The Italian p.His165Leu (c.494A>T) family showed segregation in four sequenced affected relatives and absence in tested unaffected relatives, but no functional assay. The later p.Pro1077Thr case was classified VUS; the mother was unavailable and a de novo origin was not established. The two Hao newborn frameshift carriers had abnormal screening but no diagnostic audiometry result in Table S2. These observations must not all be treated as equally confirmed molecular diagnoses.
  evidence:
  - reference: PMID:30245514
    reference_title: Splice-altering variant in COL11A1 as a cause of nonsyndromic hearing loss DFNA37.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Linkage analysis detected an interval on chromosome 1p21 with a logarithm of the odds (LOD) score of 8.29: designated locus DFNA37.'
    explanation: Establishes the locus by linkage with a decisive LOD score, independent of the sequencing result.

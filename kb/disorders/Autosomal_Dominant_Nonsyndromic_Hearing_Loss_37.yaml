- name: Proposed Alteration of Cochlear Collagen XI Organization
  description: Altered collagen XI structure or interactions could disturb tectorial-membrane organization and cochlear mechanics. Patient matrix deficiency, fibril disorganization and impaired mechanotransduction have not been demonstrated. The exon-5 deletion is predicted to remove residues 218–260; the heparan-sulfate binding motif discussed in the original paper lies at 147–152 and is not literally within that deleted interval. Altered binding is a hypothesis. Normal hearing in heterozygous functional-null mice argues against treating reduced gene dosage as an established explanation.

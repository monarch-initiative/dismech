genetic:
- name: COL11A1
  association: Causal
  gene_term:
    preferred_term: COL11A1
    term:
      id: hgnc:2186
      label: COL11A1
  notes: >-
    Heterozygous splice-altering COL11A1 variants cause DFNA37: c.652-2A>C at
    the intron 4 acceptor in the mapping family (Booth et al), c.652-1G>C at
    the same canonical site and the de novo donor variant c.4338+2T>C in two
    German families. The DFNA37 locus was mapped to chromosome 1p21 with a LOD
    score of 8.29. The same gene causes Marshall and Stickler syndromes through
    other variant classes, so a COL11A1 result requires the variant's effect on
    splicing to be considered before a nonsyndromic prognosis is given.
  evidence:
  - reference: PMID:30245514
    reference_title: "Splice-altering variant in COL11A1 as a cause of nonsyndromic hearing loss DFNA37."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Linkage analysis detected an interval on chromosome 1p21 with a logarithm of the odds (LOD) score of 8.29: designated locus DFNA37."
    explanation: Establishes the locus by linkage with a decisive LOD score, independent of the sequencing result.
  - reference: PMID:33169910
    reference_title: "Aberrant COL11A1 splicing causes prelingual autosomal dominant nonsyndromic hearing loss in the DFNA37 locus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We provide clinical and molecular genetic evidence to unambiguously confirm that COL11A1 splice-altering variants cause DFNA37 hearing loss"
    explanation: Independent confirmation of the gene-disease relationship in additional families.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Reported in a single large multigenerational family, two German families,
    and an isolated case report. DFNA37 is a rare cause of autosomal dominant
    nonsyndromic hearing loss; no population-based estimate exists.
treatments:
- name: Genetic Testing Including COL11A1
  description: >-
    The practical consequence of the DFNA37 discovery is that COL11A1 belongs
    on nonsyndromic deafness gene panels, where it was previously absent
    because the gene was considered syndromic. A COL11A1 finding in a
    nonsyndromic proband should not by itself prompt a syndromic prognosis, but
    it does warrant ophthalmological and skeletal assessment, since the same
    gene causes Marshall and Stickler syndromes.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:33169910
    reference_title: "Aberrant COL11A1 splicing causes prelingual autosomal dominant nonsyndromic hearing loss in the DFNA37 locus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "affirm that COL11A1 be included in the genetic testing of patients with nonsyndromic deafness"
    explanation: The authors' explicit recommendation that COL11A1 be added to nonsyndromic deafness panels.
- name: Genetic Counseling
  description: >-
    Counseling covers autosomal dominant inheritance with a 50% recurrence
    risk, the possibility of a de novo variant, and the variable severity seen
    across reported families. The relationship of the family's specific variant
    to the Marshall/Stickler spectrum should be addressed explicitly, since
    that is the question a COL11A1 result raises for most families.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:30245514
    reference_title: "Splice-altering variant in COL11A1 as a cause of nonsyndromic hearing loss DFNA37."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The implications of this discovery are valuable in the clinical diagnosis, prognosis, and treatment of patients with COL11A1 pathogenic variants."
    explanation: States that the nonsyndromic-versus-syndromic distinction bears directly on prognosis and counseling.
notes: >-
  Audiological management (hearing aids, and cochlear implantation where
  thresholds warrant it) follows general practice for autosomal dominant
  nonsyndromic sensorineural hearing loss and is not curated here as
  DFNA37-specific; no outcome data specific to this genotype were found.

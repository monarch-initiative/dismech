name: Autosomal Dominant Nonsyndromic Hearing Loss 37
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
synonyms:
- DFNA37
- deafness, autosomal dominant 37
- hearing loss, autosomal dominant 37
- COL11A1-related nonsyndromic hearing loss
description: >-
  DFNA37 is autosomal dominant nonsyndromic sensorineural hearing loss caused
  by heterozygous splice-altering variants in COL11A1. What makes it notable is
  not the audiological picture, which is unremarkable, but the gene: COL11A1
  was previously associated only with Marshall and Stickler syndromes, in which
  hearing loss comes packaged with ocular, orofacial and skeletal disease.
  DFNA37 is the nonsyndromic end of that allelic spectrum, and detailed
  clinical examination in the mapping family excluded any additional syndromic
  feature.

  Collagen XI is a heterotrimer whose alpha-1 chain COL11A1 encodes. In the
  cochlea it is a structural constituent of the extracellular matrix,
  including the tectorial membrane, so a quantitative shortfall of normal
  alpha-1 chains is the proposed route from splice disruption to sensorineural
  impairment.

  The reported variants cluster on canonical splice sites rather than being
  distributed across the gene, and two independent families carry lesions at
  the very same intron 4 acceptor site as the original DFNA37 kindred while
  producing different splicing outcomes. That pattern is the entry's central
  open question, recorded as a hypothesis: it is the reason a specifically
  splice-altering mechanism, rather than COL11A1 haploinsufficiency in
  general, is thought to separate nonsyndromic DFNA37 from syndromic
  Marshall/Stickler disease. A mechanism that would explain the separation has
  not been demonstrated.

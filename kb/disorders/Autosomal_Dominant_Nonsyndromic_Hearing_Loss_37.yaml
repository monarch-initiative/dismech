- category: Auditory
  name: Progressive sensorineural hearing impairment
  description: >-
    Hearing loss is progressive and, in the index family, mild in degree, with a
    flat, gently downsloping or U-shaped audiogram. A later case report
    described bilateral moderate-to-severe down-sloping loss, so severity across
    reported families is not uniform.
  phenotype_term:
    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment

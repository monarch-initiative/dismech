mechanistic_hypotheses:
- hypothesis_group_id: collagen_xi_matrix_mechanism
  hypothesis_label: Altered collagen XI organization may connect variant-specific RNA defects to hearing loss
  status: EMERGING
  description: Splicing assays demonstrate RNA changes, but protein quantity and fibril assembly remain untested. Altered folding, extracellular interactions or residual function may contribute. The normal auditory responses of cho/+ mice limit a simple haploinsufficiency explanation; they do not prove dominant negativity for human DFNA37 alleles. Domain position and transcript outcome may influence the nonsyndromic presentation. Splice-site class alone cannot explain it, because syndromic COL11A1 disease also commonly involves splice alterations. Missense family segregation and screening frameshifts require variant-level evaluation rather than automatic mechanistic unification.
  evidence:
  - *id002
  - *id003
  - reference: PMID:30245514
    reference_title: Splice-altering variant in COL11A1 as a cause of nonsyndromic hearing loss DFNA37.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The majority of pathogenic variants in COL11A1 are splice-altering located in the triple-helical domain and thought to exert their effect via a dominant–negative mechanism.
    explanation: The paper reviews syndromic splice variants, limiting a splice-class-specific explanation of nonsyndromic restriction. The dominant-negative interpretation is not a DFNA37 experiment.
    quote_role: BACKGROUND
    directness: INDIRECT

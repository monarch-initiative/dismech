name: Autosomal Dominant Nonsyndromic Hearing Loss 37
creation_date: '2026-09-04T00:00:00Z'
category: Mendelian
synonyms:
- DFNA37
- deafness, autosomal dominant 37
- hearing loss, autosomal dominant 37
- COL11A1-related nonsyndromic hearing loss
description: 'DFNA37 is autosomal dominant nonsyndromic sensorineural hearing loss associated with heterozygous COL11A1 variants. The original splice-site family had slowly progressive, predominantly postlingual mild-to-moderate loss; additional families extend onset to the prelingual period and include stable moderate-to-severe presentations. Audiogram configuration and severity vary. ClinGen classified the gene–disease relationship as Moderate on 2025-06-18.

  COL11A1 encodes the alpha-1 chain of collagen XI and also causes syndromic collagenopathies. Minigene assays demonstrate variant-specific aberrant splicing, including residual normal splicing for c.652-2A>C. The consequent protein and cochlear matrix changes remain proposed. Neither reduced collagen abundance nor a dominant-negative mechanism has been established for DFNA37. Reported frameshift and missense observations have heterogeneous evidence; a COL11A1 variant alone does not establish a nonsyndromic diagnosis or prognosis.'

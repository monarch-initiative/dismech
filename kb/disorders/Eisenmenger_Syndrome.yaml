name: Eisenmenger Syndrome
creation_date: '2026-08-09T00:00:00Z'
category: Complex
description: >
  Eisenmenger syndrome is the terminal stage of an uncorrected congenital
  systemic-to-pulmonary shunt and the most advanced form of pulmonary arterial
  hypertension associated with congenital heart disease. A large, non-restrictive
  communication at atrial, ventricular, or aortopulmonary level exposes the pulmonary
  circulation to decades of high flow and, in post-tricuspid lesions, systemic pressure.
  Shear stress on the pulmonary endothelium is the leading proposed trigger for
  progressive obstructive pulmonary vascular remodeling, which raises pulmonary vascular
  resistance until it equals or exceeds systemic resistance and the shunt reverses to
  right-to-left or bidirectional. That reversal is the defining moment of Eisenmenger
  physiology and produces chronic arterial hypoxaemia, secondary erythrocytosis, and a
  multisystem disease with haematologic, neurologic, renal, and rheumatologic
  manifestations. A counterintuitive consequence follows: the same shunt that caused the
  disease now decompresses the pressure-loaded right ventricle, which is why patients
  survive longer than those with idiopathic pulmonary arterial hypertension at comparable
  haemodynamics, and why closing the defect once Eisenmenger physiology is established is
  contraindicated rather than curative.
disease_term:
  preferred_term: Eisenmenger syndrome
  term:
    id: MONDO:0019944
    label: Eisenmenger syndrome
parents:
- Congenital heart defect
- Pulmonary arterial hypertension
synonyms:
- Eisenmenger complex
- Eisenmenger reaction
- Eisenmenger physiology
- Pulmonary arterial hypertension associated with congenital heart disease
pathophysiology:
- name: Uncorrected non-restrictive systemic-to-pulmonary shunt
  description: >
    The initiating lesion is a large congenital communication at the atrial, ventricular,
    or aortopulmonary level that is never closed, or is closed too late. Shunt level
    governs risk: post-tricuspid defects (ventricular septal defect, patent ductus
    arteriosus, atrioventricular septal defect, truncus arteriosus) transmit systemic
    pressure as well as flow to the pulmonary bed and carry much the higher risk, whereas
    pre-tricuspid atrial-level defects transmit volume alone and progress far less often
    and far later. Trisomy 21 with a post-tricuspid lesion accelerates the whole sequence.
  biological_scale: ORGANISM
  role: trigger
  locations:
  - preferred_term: Heart
    term:
      id: UBERON:0000948
      label: heart
  downstream:
  - target: Shear-stress-mediated pulmonary endothelial dysfunction
    causal_link_type: DIRECT
    description: >
      Chronic high pulmonary blood flow imposes abnormal shear stress on the pulmonary
      arterial endothelium.
    evidence:
    - reference: PMID:39711759
      reference_title: "Update on Eisenmenger syndrome - Review of pathophysiology and recent progress in risk assessment and management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The biological mechanisms are not fully understood, but a leading hypothesis is that increased shear stress on the pulmonary endothelium triggers pulmonary vascular remodeling, eventually resulting in irreversible pulmonary vascular disease"
      explanation: States the shear-stress trigger explicitly, and flags it as the leading hypothesis rather than settled mechanism.
  evidence:
  - reference: PMID:39711759
    reference_title: "Update on Eisenmenger syndrome - Review of pathophysiology and recent progress in risk assessment and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It develops in the presence of a non-restrictive communication at the aortopulmonary, ventricular, or atrial level."
    explanation: Defines the anatomic substrate and the three levels at which the communication may sit.
  - reference: PMID:27325590
    reference_title: "Eisenmenger syndrome and long-term survival in patients with Down syndrome and congenital heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The likelihood of being treated interventionally or surgically before the age of 1 year increased significantly over time. In parallel, the likelihood of developing ES decreased over time (53% birth cohort during 1950s/1960s vs 0.5% birth cohort during 2000-2009, p<0.0001)."
    explanation: German National Register data in 894 Down syndrome patients with post-tricuspid shunts, showing that leaving the shunt uncorrected is what produces the syndrome, and that early repair all but abolishes it.
- name: Shear-stress-mediated pulmonary endothelial dysfunction
  description: >
    Pulmonary arterial endothelial cells exposed to sustained abnormal shear stress lose
    homeostatic function, shifting the balance from vasodilation toward vasoconstriction
    and proliferation. Nitric oxide and prostacyclin production fall while endothelin-1
    rises. This is the same endothelial lesion that initiates idiopathic and heritable
    pulmonary arterial hypertension, reached here by a mechanical rather than a genetic
    route, which is why the three endothelium-directed drug classes developed for those
    diseases also work in Eisenmenger syndrome.
  biological_scale: CELLULAR
  conforms_to: "pulmonary_vascular_remodeling#Pulmonary Endothelial Dysfunction and Impaired BMP Signaling"
  locations:
  - preferred_term: Pulmonary artery
    term:
      id: UBERON:0002012
      label: pulmonary artery
  cell_types:
  - preferred_term: Pulmonary artery endothelial cell
    term:
      id: CL:1001568
      label: pulmonary artery endothelial cell
  biological_processes:
  - preferred_term: nitric oxide biosynthetic process
    term:
      id: GO:0006809
      label: nitric oxide biosynthetic process
    modifier: DECREASED
  downstream:
  - target: Pulmonary artery smooth muscle proliferation and vasoconstriction
    causal_link_type: DIRECT
    description: >
      Loss of endothelial vasodilator tone and excess endothelin-1 drive medial smooth
      muscle proliferation and sustained vasoconstriction.
    evidence:
    - reference: PMID:16801459
      reference_title: "Bosentan therapy in patients with Eisenmenger syndrome: a multicenter, double-blind, randomized, placebo-controlled study."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Because Eisenmenger syndrome is associated with increased endothelin expression, patients may benefit from endothelin receptor antagonism."
      explanation: Endothelial endothelin excess is the signal proposed to act on the medial compartment; the abstract states the association and therapeutic rationale rather than demonstrating the cellular step, hence PARTIAL.
  evidence:
  - reference: PMID:16801459
    reference_title: "Bosentan therapy in patients with Eisenmenger syndrome: a multicenter, double-blind, randomized, placebo-controlled study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because Eisenmenger syndrome is associated with increased endothelin expression, patients may benefit from endothelin receptor antagonism."
    explanation: Establishes increased endothelin expression as a feature of the syndrome, which is the rationale on which the endothelin-antagonist trial was built.
  - reference: PMID:19245962
    reference_title: "Eisenmenger syndrome a clinical perspective in a new therapeutic era of pulmonary arterial hypertension."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Although ES shares similar morphological findings with idiopathic PAH, clinical differences exist between the 2 etiologies."
    explanation: Supports the shared pulmonary vascular lesion that underlies module conformance, while flagging that the two diseases are not clinically equivalent.
- name: Pulmonary artery smooth muscle proliferation and vasoconstriction
  description: >
    Paracrine signals from the dysfunctional endothelium drive a pro-proliferative,
    anti-apoptotic switch in pulmonary artery smooth muscle cells together with sustained
    vasoconstriction, increasing medial cellularity. This is the amplifying step shared
    with all forms of pulmonary arterial hypertension.
  biological_scale: CELLULAR
  conforms_to: "pulmonary_vascular_remodeling#Pulmonary Artery Smooth Muscle Cell Proliferation and Vasoconstriction"
  cell_types:
  - preferred_term: Pulmonary artery smooth muscle cell
    term:
      id: CL:0002591
      label: smooth muscle cell of the pulmonary artery
  biological_processes:
  - preferred_term: smooth muscle cell proliferation
    term:
      id: GO:0048659
      label: smooth muscle cell proliferation
    modifier: INCREASED
  downstream:
  - target: Obstructive pulmonary vascular remodeling
    causal_link_type: DIRECT
    description: >
      Sustained medial proliferation progresses to fixed structural obstruction of the
      small pulmonary arteries.
    evidence:
    - reference: PMID:39711759
      reference_title: "Update on Eisenmenger syndrome - Review of pathophysiology and recent progress in risk assessment and management."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Longstanding left-to-right shunting associated with congenital heart disease (CHD) can ultimately lead to pulmonary vascular remodeling, pulmonary arterial hypertension, and shunt reversal, the hallmark feature of Eisenmenger Syndrome (ES)."
      explanation: Places pulmonary vascular remodeling in the causal chain downstream of chronic shunt flow; the cellular step from medial proliferation to fixed obstruction is inferred from the module rather than stated in this source.
  evidence:
  - reference: PMID:16801459
    reference_title: "Bosentan therapy in patients with Eisenmenger syndrome: a multicenter, double-blind, randomized, placebo-controlled study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared with placebo, bosentan reduced pulmonary vascular resistance index (-472.0 dyne.s.cm(-5); P=0.0383)."
    explanation: Pharmacologic reversal of part of the resistance by blocking endothelin signalling implies a component of ongoing endothelin-driven vasoconstriction and proliferation rather than purely fixed obstruction.
- name: Obstructive pulmonary vascular remodeling
  description: >
    Progressive structural obliteration of the small pulmonary arteries: medial
    hypertrophy, then intimal cellular proliferation and concentric fibrosis, then
    plexiform arteriopathy, the sequence graded histologically by Heath and Edwards. In
    situ thrombosis compounds the luminal loss. Once advanced, the lesion is irreversible,
    which is what converts a correctable congenital defect into an inoperable one.
  biological_scale: TISSUE
  conforms_to: "pulmonary_vascular_remodeling#Obstructive Pulmonary Vascular Remodeling"
  locations:
  - preferred_term: Pulmonary artery
    term:
      id: UBERON:0002012
      label: pulmonary artery
  biological_processes:
  - preferred_term: blood vessel remodeling
    term:
      id: GO:0001974
      label: blood vessel remodeling
    modifier: DYSREGULATED
  downstream:
  - target: Increased pulmonary vascular resistance
    causal_link_type: DIRECT
    description: >
      Loss of cross-sectional area in the small pulmonary arteries raises the resistance
      the right ventricle pumps against.
    evidence:
    - reference: PMID:39711759
      reference_title: "Update on Eisenmenger syndrome - Review of pathophysiology and recent progress in risk assessment and management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Longstanding left-to-right shunting associated with congenital heart disease (CHD) can ultimately lead to pulmonary vascular remodeling, pulmonary arterial hypertension, and shunt reversal, the hallmark feature of Eisenmenger Syndrome (ES)."
      explanation: States the progression from pulmonary vascular remodeling to pulmonary arterial hypertension, the haemodynamic expression of raised resistance.
  evidence:
  - reference: PMID:39711759
    reference_title: "Update on Eisenmenger syndrome - Review of pathophysiology and recent progress in risk assessment and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Longstanding left-to-right shunting associated with congenital heart disease (CHD) can ultimately lead to pulmonary vascular remodeling, pulmonary arterial hypertension, and shunt reversal, the hallmark feature of Eisenmenger Syndrome (ES)."
    explanation: States the remodeling step and its position in the causal chain between the shunt and shunt reversal.
- name: Increased pulmonary vascular resistance
  description: >
    Fixed structural obstruction plus a residual vasoconstrictive component raise pulmonary
    vascular resistance toward and beyond systemic levels. The degree of elevation and its
    reversibility on vasoreactivity testing are what determine whether any operability
    window remains.
  biological_scale: ORGANISM
  conforms_to: "pulmonary_vascular_remodeling#Increased Pulmonary Vascular Resistance"
  downstream:
  - target: Shunt reversal to right-to-left or bidirectional flow
    causal_link_type: DIRECT
    description: >
      When pulmonary vascular resistance equals or exceeds systemic vascular resistance,
      the pressure gradient across the defect inverts.
    evidence:
    - reference: PMID:31120797
      reference_title: "Eisenmenger syndrome and other types of pulmonary arterial hypertension related to adult congenital heart disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It is characterised by a severe rise in pulmonary vascular resistance resulting in shunt reversal and cyanosis."
      explanation: States the causal step from rising pulmonary vascular resistance to shunt reversal explicitly.
  - target: Pulmonary arterial hypertension with right ventricular pressure overload
    causal_link_type: DIRECT
    description: >
      The right ventricle faces a chronically elevated afterload.
    evidence:
    - reference: PMID:39711759
      reference_title: "Update on Eisenmenger syndrome - Review of pathophysiology and recent progress in risk assessment and management."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "in contemporary series, the most common cause of mortality remains right heart failure, unchanged from the pre-DTT era"
      explanation: Right heart failure dominating mortality is the clinical consequence of the chronic pressure overload; the source reports the outcome rather than measuring the afterload step, hence PARTIAL.
  evidence:
  - reference: PMID:31120797
    reference_title: "Eisenmenger syndrome and other types of pulmonary arterial hypertension related to adult congenital heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is characterised by a severe rise in pulmonary vascular resistance resulting in shunt reversal and cyanosis."
    explanation: Places the rise in pulmonary vascular resistance immediately upstream of shunt reversal and cyanosis.
- name: Shunt reversal to right-to-left or bidirectional flow
  description: >
    The defining event. Once pulmonary vascular resistance matches or exceeds systemic
    resistance, deoxygenated blood crosses the defect into the systemic circulation
    instead of the reverse, producing chronic arterial hypoxaemia and central cyanosis.
    This node is what distinguishes Eisenmenger syndrome from every other form of
    pulmonary arterial hypertension and from earlier, still-operable stages of
    pulmonary arterial hypertension associated with congenital heart disease; it is
    deliberately not mapped onto the `pulmonary_vascular_remodeling` module, which has no
    counterpart for it.
  biological_scale: ORGANISM
  downstream:
  - target: Chronic hypoxaemia and secondary erythrocytosis
    causal_link_type: DIRECT
    description: >
      Systemic delivery of deoxygenated blood lowers arterial oxygen saturation.
    evidence:
    - reference: PMID:32690623
      reference_title: "Eisenmenger syndrome: diagnosis, prognosis and clinical management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Central cyanosis is the primary clinical manifestation leading to secondary erythrocytosis and various multiorgan complications that increase morbidity and affect quality of life."
      explanation: States the causal step from the cyanosis produced by shunt reversal to secondary erythrocytosis.
  - target: Right-to-left shunt as a protective right ventricular pop-off
    causal_link_type: DIRECT
    description: >
      The same reversed shunt that causes the hypoxaemia also unloads the pressurised
      right ventricle.
    evidence:
    - reference: PMID:19245962
      reference_title: "Eisenmenger syndrome a clinical perspective in a new therapeutic era of pulmonary arterial hypertension."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Adults with ES exhibit increased survival and more favorable hemodynamics than those with idiopathic PAH."
      explanation: The more favourable haemodynamics relative to idiopathic disease, which lacks any shunt, is the observable signature of the decompressing effect.
  - target: Loss of pulmonary filtration of venous emboli
    causal_link_type: DIRECT
    description: >
      Venous thrombi and septic emboli bypass the pulmonary capillary bed and enter the
      systemic arterial circulation directly.
    evidence:
    - reference: PMID:9556469
      reference_title: "The Eisenmenger syndrome in adults."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The hemostatic changes associated with the syndrome may lead to thromboembolic events, cerebrovascular complications, or the hyperviscosity syndrome."
      explanation: Documents thromboembolic and cerebrovascular events in the syndrome; the specific attribution to loss of pulmonary filtration is mechanistic inference, hence PARTIAL.
  evidence:
  - reference: PMID:39711759
    reference_title: "Update on Eisenmenger syndrome - Review of pathophysiology and recent progress in risk assessment and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eisenmenger syndrome (ES) is defined as pulmonary hypertension due to a high pulmonary vascular resistance with reversed or bidirectional shunt"
    explanation: The operational definition of the syndrome, making shunt reversal the defining node rather than an incidental consequence.
  - reference: PMID:32690623
    reference_title: "Eisenmenger syndrome: diagnosis, prognosis and clinical management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Central cyanosis is the primary clinical manifestation leading to secondary erythrocytosis and various multiorgan complications that increase morbidity and affect quality of life."
    explanation: Connects the reversed shunt to cyanosis and onward to the multiorgan complication burden.
- name: Right-to-left shunt as a protective right ventricular pop-off
  description: >
    A genuinely counterintuitive node, and the reason management differs from every other
    severe pulmonary arterial hypertension. By venting the pressure-loaded right ventricle
    into the systemic circulation, the reversed shunt preserves cardiac output and defers
    right ventricular failure, so patients with Eisenmenger syndrome survive longer and
    have more favourable haemodynamics than adults with idiopathic pulmonary arterial
    hypertension at comparable pulmonary pressures. The therapeutic corollary is that
    closing the defect once the physiology is established removes the pop-off and
    precipitates right heart failure, which is why shunt closure is contraindicated rather
    than curative at this stage.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:19245962
    reference_title: "Eisenmenger syndrome a clinical perspective in a new therapeutic era of pulmonary arterial hypertension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adults with ES exhibit increased survival and more favorable hemodynamics than those with idiopathic PAH."
    explanation: The comparative survival advantage over idiopathic pulmonary arterial hypertension, which is the observable consequence of the decompressing shunt.
  - reference: PMID:33853494
    reference_title: "Preventing disease progression in Eisenmenger syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once Eisenmenger syndrome develops, shunt closure should be avoided."
    explanation: The management corollary stated directly, namely that the defect must be left open once the physiology is established.
- name: Pulmonary arterial hypertension with right ventricular pressure overload
  description: >
    Sustained elevation of pulmonary arterial pressure imposes chronic pressure overload
    on the right ventricle, driving hypertrophy and ultimately maladaptive remodeling and
    failure. Right heart failure remains the leading cause of death in the modern
    drug-therapy era, unchanged from before it.
  biological_scale: ORGANISM
  conforms_to: "pulmonary_vascular_remodeling#Pulmonary Arterial Hypertension"
  locations:
  - preferred_term: Right ventricle
    term:
      id: UBERON:0002080
      label: heart right ventricle
  biological_processes:
  - preferred_term: cardiac muscle hypertrophy
    term:
      id: GO:0003300
      label: cardiac muscle hypertrophy
    modifier: INCREASED
  downstream:
  - target: Atrial arrhythmia and conduction system disease
    causal_link_type: DIRECT
    description: >
      Chronic right-sided pressure overload and atrial stretch create the arrhythmic and
      conduction-system substrate.
    evidence:
    - reference: PMID:32174228
      reference_title: "Determinants of Sudden Cardiac Death in Adult Patients With Eisenmenger Syndrome."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Age, atrial fibrillation, prolonged QRS duration, complete heart block, right atrial enlargement, right bundle branch block, increased right atrial pressure, impaired biventricular function, and the presence of a pacemaker were associated with increased risk of SCD"
      explanation: Right atrial enlargement, raised right atrial pressure, and impaired ventricular function cluster with the arrhythmias in the same risk set, consistent with pressure overload generating the substrate; the association is cross-sectional, hence PARTIAL.
  evidence:
  - reference: PMID:39711759
    reference_title: "Update on Eisenmenger syndrome - Review of pathophysiology and recent progress in risk assessment and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in contemporary series, the most common cause of mortality remains right heart failure, unchanged from the pre-DTT era"
    explanation: Establishes right heart failure as the dominant terminal event, and that modern drug therapy has not displaced it.
- name: Atrial arrhythmia and conduction system disease
  description: >
    Chronic right atrial stretch and right ventricular pressure overload generate an
    arrhythmic substrate: atrial fibrillation, prolonged QRS duration, complete heart
    block, and right bundle branch block are all associated with sudden cardiac death in
    this population, and atrial fibrillation is by some margin the strongest independent
    predictor. This is the proximate route to the sudden deaths that make up a large share
    of mortality, and it is separable from the progressive pump failure that kills the
    rest. Notably, advanced pulmonary vasodilator therapy was strongly protective against
    sudden death in the same analysis.
  biological_scale: ORGANISM
  locations:
  - preferred_term: Right atrium
    term:
      id: UBERON:0002078
      label: right cardiac atrium
  evidence:
  - reference: PMID:32174228
    reference_title: "Determinants of Sudden Cardiac Death in Adult Patients With Eisenmenger Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Atrial fibrillation (11.45-fold increased risk; P<0.001) and QRS duration ≥120 ms (2.06-fold increased risk; P=0.034) remained significant predictors of SCD in the multivariate analysis, whereas advanced pulmonary hypertension therapies were strongly protective against SCD (P<0.001)."
    explanation: Two-centre study of 246 patients identifying atrial fibrillation as the dominant independent predictor of sudden cardiac death, with pulmonary vasodilator therapy protective.
  - reference: PMID:32174228
    reference_title: "Determinants of Sudden Cardiac Death in Adult Patients With Eisenmenger Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Atrial arrhythmias, impaired ventricular function, and conduction system disease were associated with increased risk of SCD in this cohort of patients with Eisenmenger syndrome"
    explanation: Names the three associated domains curated in this node.
  - reference: PMID:32174228
    reference_title: "Determinants of Sudden Cardiac Death in Adult Patients With Eisenmenger Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical heart failure symptoms (New York Heart Association class ≥II) were predictive of increased mortality but not of SCD, suggesting a potential arrhythmic cause behind SCD."
    explanation: Supports separating the arrhythmic route to sudden death from the heart-failure route to overall mortality; the inference is the authors' own and is stated as a suggestion, hence PARTIAL.
  downstream:
  - target: Sudden cardiac death
    causal_link_type: DIRECT
    description: >
      Atrial fibrillation and conduction system disease are the arrhythmic substrate
      through which this disease produces sudden death, as distinct from the progressive
      pump failure that produces the rest of its mortality.
    evidence:
    - reference: PMID:32174228
      reference_title: "Determinants of Sudden Cardiac Death in Adult Patients With Eisenmenger Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Atrial arrhythmias, impaired ventricular function, and conduction system disease were associated with increased risk of SCD in this cohort of patients with Eisenmenger syndrome, providing an opportunity for early risk stratification and potential intervention."
      explanation: Directly links the arrhythmic and conduction-system substrate to sudden cardiac death risk in this disease.
- name: Chronic hypoxaemia and secondary erythrocytosis
  description: >
    Sustained arterial desaturation drives renal erythropoietin release and an appropriate
    compensatory rise in red cell mass. The rise is adaptive, not pathological in itself,
    and the historical practice of routine venesection to lower it is now recognised as
    harmful because it induces iron deficiency. Iron-deficient erythrocytes are less
    deformable, and iron deficiency, not haematocrit, is what tracks with symptoms and
    stroke risk.
  biological_scale: ORGANISM
  downstream:
  - target: Hyperviscosity and haemostatic derangement
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >
      Raised red cell mass increases whole-blood viscosity, though the correlation with
      symptoms is weaker than historically assumed.
    evidence:
    - reference: PMID:39711759
      reference_title: "Update on Eisenmenger syndrome - Review of pathophysiology and recent progress in risk assessment and management."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "While this does occur in the context of cyanosis and secondary erythrocytosis, there is a tenuous correlation between hematocrit and viscosity, iron deficiency, or a patient's severity or frequency of symptoms"
      explanation: Confirms hyperviscosity occurs on the background of secondary erythrocytosis while explicitly weakening the quantitative link, which is why the edge is curated PARTIAL and as indirect.
  evidence:
  - reference: PMID:39711759
    reference_title: "Update on Eisenmenger syndrome - Review of pathophysiology and recent progress in risk assessment and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While this does occur in the context of cyanosis and secondary erythrocytosis, there is a tenuous correlation between hematocrit and viscosity, iron deficiency, or a patient's severity or frequency of symptoms"
    explanation: Records the weak link between haematocrit and symptoms, which is the evidence base for abandoning haematocrit-triggered venesection.
  - reference: PMID:9556469
    reference_title: "The Eisenmenger syndrome in adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Erythrocytosis is present in most patients, but excessive phlebotomy may cause microcytosis and exacerbate the symptoms of hyperviscosity."
    explanation: States both that erythrocytosis is near-universal and that over-treating it with phlebotomy is counterproductive.
- name: Hyperviscosity and haemostatic derangement
  description: >
    The haematologic consequence is bidirectional and awkward to manage: patients carry
    both a thrombotic tendency (in situ pulmonary artery thrombosis, paradoxical embolism)
    and a bleeding diathesis (haemoptysis, mucosal bleeding, perioperative haemorrhage).
    Pulmonary artery thrombosis in this disease tracks with biventricular dysfunction and
    slow pulmonary flow rather than with haematocrit or clotting-factor abnormalities,
    which argues for stasis rather than hypercoagulability as its proximate cause.
  biological_scale: ORGANISM
  downstream:
  - target: Multisystem complications of chronic cyanosis
    causal_link_type: DIRECT
    description: >
      The combined thrombotic and haemorrhagic tendency contributes to stroke, haemoptysis,
      and bleeding complications.
    evidence:
    - reference: PMID:9556469
      reference_title: "The Eisenmenger syndrome in adults."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The hemostatic changes associated with the syndrome may lead to thromboembolic events, cerebrovascular complications, or the hyperviscosity syndrome."
      explanation: Links the haemostatic derangement directly to thromboembolic and cerebrovascular complications.
  evidence:
  - reference: PMID:9556469
    reference_title: "The Eisenmenger syndrome in adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The hemostatic changes associated with the syndrome may lead to thromboembolic events, cerebrovascular complications, or the hyperviscosity syndrome."
    explanation: Establishes the haemostatic derangement and its thromboembolic and cerebrovascular consequences.
  - reference: PMID:17692749
    reference_title: "Pulmonary arterial thrombosis in eisenmenger syndrome is associated with biventricular dysfunction and decreased pulmonary flow velocity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients were older (p = 0.032), but did not differ in oxygen saturation, hemoglobin, or hematocrit from those without thrombus."
    explanation: Argues against erythrocytosis as the driver of pulmonary artery thrombosis, since thrombus-positive and thrombus-negative patients had indistinguishable haemoglobin and haematocrit.
  - reference: PMID:17692749
    reference_title: "Pulmonary arterial thrombosis in eisenmenger syndrome is associated with biventricular dysfunction and decreased pulmonary flow velocity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Those with thrombus also had a larger main pulmonary artery diameter (48 +/- 14 mm vs. 38 +/- 9 mm, p = 0.007) and a lower peak systolic velocity in the pulmonary artery (p = 0.003)."
    explanation: Identifies a dilated main pulmonary artery and slow pulmonary arterial flow, rather than a clotting abnormality, as the correlates of thrombus.
- name: Loss of pulmonary filtration of venous emboli
  description: >
    With a right-to-left shunt the pulmonary capillary bed no longer filters the venous
    return, so thrombi and septic emboli pass directly into the systemic arterial
    circulation. This is the mechanism behind paradoxical embolic stroke and behind
    cerebral abscess, and it is why meticulous air-filtering of intravenous lines and
    endocarditis prophylaxis matter more here than in an acyanotic patient.
  biological_scale: ORGANISM
  downstream:
  - target: Multisystem complications of chronic cyanosis
    causal_link_type: DIRECT
    description: >
      Unfiltered emboli reaching the systemic circulation produce stroke and brain abscess.
    evidence:
    - reference: PMID:35331414

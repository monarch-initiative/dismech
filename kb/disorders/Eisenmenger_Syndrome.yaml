- name: Multisystem complications of chronic cyanosis
  description: >
    Beyond the heart and lungs, sustained cyanosis and high red cell turnover produce a
    recognisable multiorgan burden: hyperuricaemia and gout, pigment cholelithiasis from
    chronic hyperbilirubinaemia, renal impairment with proteinuria, hypertrophic
    osteoarthropathy, and neurologic events. These are what make Eisenmenger syndrome a
    systemic disease rather than a cardiopulmonary one.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:9556469
    reference_title: "The Eisenmenger syndrome in adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

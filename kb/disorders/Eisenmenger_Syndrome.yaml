    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several risk factors have been identified as independent predictors in Eisenmenger syndrome, including the 6-minute walk distance, echocardiographic markers and serum brain natriuretic peptide."
    explanation: Names serum brain natriuretic peptide among the independent prognostic predictors.
  - reference: PMID:32690623
    reference_title: "Eisenmenger syndrome: diagnosis, prognosis and clinical management."
    supports: SUPPORT

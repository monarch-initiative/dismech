progression:
- phase: Latent left-to-right shunt phase
  notes: >
    An initially asymptomatic or minimally symptomatic period during which the shunt is
    left-to-right and pulmonary vascular resistance is normal or only mildly elevated.
    Repair during this window prevents the syndrome entirely, and the practical target is
    intervention within the first year or two of life. Post-tricuspid lesions may traverse
    this phase within infancy; pre-tricuspid atrial defects may take three or four decades.
  evidence:
  - reference: PMID:27325590
    reference_title: "Eisenmenger syndrome and long-term survival in patients with Down syndrome and congenital heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The likelihood of being treated interventionally or surgically before the age of 1 year increased significantly over time. In parallel, the likelihood of developing ES decreased over time (53% birth cohort during 1950s/1960s vs 0.5% birth cohort during 2000-2009, p<0.0001)."
    explanation: Demonstrates that operating within the first year of life during the latent phase reduces progression from 53% to 0.5%.
- phase: Established Eisenmenger physiology
  notes: >
    Once pulmonary vascular resistance is fixed and the shunt has reversed, the disease is
    chronic and progressive, punctuated by complications rather than following a smooth
    decline. Defect closure is now contraindicated. Survival is substantially reduced:
    10-year survival is 57% overall and 34% among patients never given pulmonary
    vasodilator therapy, and the leading terminal event is right heart failure.
  evidence:
  - reference: PMID:39711759
    reference_title: "Update on Eisenmenger syndrome - Review of pathophysiology and recent progress in risk assessment and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once these biases were accounted for, 10-year survival for contemporary patients with ES was 57 % in the overall cohort and 34 % in patients naïve to disease targeting therapy (DTT)"
    explanation: Gives the contemporary 10-year survival figures, corrected for the survivorship bias that inflated earlier estimates.
  - reference: PMID:25099652
    reference_title: "Survival prospects of treatment naïve patients with Eisenmenger: a systematic review of the literature and report of own experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After accounting for this effect we found high standardised mortality ratios, a 10-year mortality rate approaching 30-40% and no evidence of superior survival prospects of current era patients compared with those seen in the 1970s, 1980s and 1990s."
    explanation: Systematic review of 1131 patients correcting for immortal time bias, and finding no survival improvement in treatment-naive patients across four decades.
diagnosis:
- name: Transthoracic echocardiography
  description: >
    The mainstay non-invasive test. It identifies the underlying defect, demonstrates the
    direction of shunting on colour Doppler (right-to-left or bidirectional), estimates
    pulmonary artery pressure, and assesses right ventricular size and function. A
    diagnostic pitfall worth knowing: the murmur may be quiet or absent, because equalised
    ventricular pressures abolish the turbulent gradient across the defect.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:27002414
    reference_title: "BMPR2 mutation is a potential predisposing genetic risk factor for congenital heart disease associated pulmonary vascular disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "PAH was diagnosed by heart catheterization at rest after CHD was first recognized by echocardiography."
    explanation: Documents the standard diagnostic sequence, in which echocardiography identifies the congenital defect and catheterisation then confirms the pulmonary hypertension.
- name: Right heart catheterisation
  description: >
    The confirmatory gold standard, giving direct measurement of pulmonary artery pressure,
    pulmonary vascular resistance, and oximetry at each chamber, and where relevant
    vasoreactivity testing to judge whether any operability remains. It is the test that
    distinguishes still-correctable pulmonary arterial hypertension associated with
    congenital heart disease from established, inoperable Eisenmenger physiology.
  diagnosis_term:
    preferred_term: right heart catheterization
    term:
      id: NCIT:C80411
      label: Right Heart Catheterization
  evidence:
  - reference: PMID:27002414
    reference_title: "BMPR2 mutation is a potential predisposing genetic risk factor for congenital heart disease associated pulmonary vascular disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PVD was defined as a pulmonary vascular resistance (PVR) more than 3 Wood units."
    explanation: Shows catheter-measured pulmonary vascular resistance being used as the defining diagnostic criterion for pulmonary vascular disease in congenital heart disease.
  - reference: PMID:16801459
    reference_title: "Bosentan therapy in patients with Eisenmenger syndrome: a multicenter, double-blind, randomized, placebo-controlled study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemodynamics were assessed by right- and left-heart catheterization."
    explanation: Catheterisation used as the reference haemodynamic assessment in the pivotal Eisenmenger trial.
- name: Pulse oximetry
  description: >
    Resting and exertional oxygen saturation quantifies the right-to-left shunt burden and
    is itself prognostic. Because pulmonary vasodilators could in principle worsen shunting
    by dropping systemic resistance, saturation is also the key safety measurement when
    starting these drugs.
  diagnosis_term:
    preferred_term: pulse oximetry
    term:
      id: NCIT:C38085
      label: Pulse Oximetry
  evidence:
  - reference: PMID:16801459
    reference_title: "Bosentan therapy in patients with Eisenmenger syndrome: a multicenter, double-blind, randomized, placebo-controlled study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The placebo-corrected effect on systemic pulse oximetry was 1.0% (95% confidence interval, -0.7 to 2.8), demonstrating that bosentan did not worsen oxygen saturation."
    explanation: Pulse oximetry used as the primary safety endpoint, testing the theoretical concern that a vasodilator might worsen right-to-left shunting.
- name: Iron studies and full blood count
  description: >
    Haemoglobin, haematocrit, ferritin, and transferrin saturation characterise the
    secondary erythrocytosis and, more importantly, detect the iron deficiency that is
    treatable and functionally consequential. Interpreting haemoglobin without iron indices
    is what historically led to inappropriate venesection.
  diagnosis_term:
    preferred_term: blood cell count
    term:
      id: NCIT:C28133
      label: Blood Cell Count
  evidence:
  - reference: PMID:20580108
    reference_title: "Replacement therapy for iron deficiency improves exercise capacity and quality of life in patients with cyanotic congenital heart disease and/or the Eisenmenger syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After 3 months of treatment, hemoglobin (19.0 ± 2.9 g/dL to 20.4 ± 2.7 g/dL, p<0.001), ferritin (13.3 ± 4.7 μg/L to 54.1 ± 24.2 μg/L, p<0.001) and transferrin saturation (17.8 ± 9.6% to 34.8 ± 23.4%, p<0.001) significantly increased."
    explanation: Shows ferritin and transferrin saturation being used to identify and track the iron deficiency that a haemoglobin measurement alone would conceal.
treatments:
- name: Endothelin receptor antagonist therapy
  description: >
    Bosentan is the first-line pulmonary vasodilator and the only agent tested against
    placebo in a dedicated Eisenmenger randomised trial. BREATHE-5 showed it lowered
    pulmonary vascular resistance and mean pulmonary artery pressure and increased walk
    distance without worsening systemic oxygen saturation, which had been the theoretical
    safety concern, and the open-label extension showed the gain was sustained to 40 weeks.
  context: Symptomatic Eisenmenger syndrome, typically WHO functional class III
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bosentan
      term:
        id: CHEBI:51450
        label: bosentan
  target_phenotypes:
  - preferred_term: Pulmonary arterial hypertension
    term:
      id: HP:0002092
      label: Pulmonary arterial hypertension
  - preferred_term: Exercise intolerance
    term:
      id: HP:0003546
      label: Exercise intolerance
  target_mechanisms:
  - target: Increased pulmonary vascular resistance
    treatment_effect: INHIBITS
    description: >
      Blocking endothelin receptors relieves the endothelin-driven component of
      vasoconstriction and proliferation, lowering pulmonary vascular resistance.
    evidence:
    - reference: PMID:16801459
      reference_title: "Bosentan therapy in patients with Eisenmenger syndrome: a multicenter, double-blind, randomized, placebo-controlled study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Compared with placebo, bosentan reduced pulmonary vascular resistance index (-472.0 dyne.s.cm(-5); P=0.0383). The mean pulmonary arterial pressure decreased (-5.5 mm Hg; P=0.0363), and the exercise capacity increased (53.1 m; P=0.0079)."
      explanation: Placebo-controlled demonstration that endothelin blockade lowers pulmonary vascular resistance in this disease.
  evidence:
  - reference: PMID:16801459
    reference_title: "Bosentan therapy in patients with Eisenmenger syndrome: a multicenter, double-blind, randomized, placebo-controlled study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this first placebo-controlled trial in patients with Eisenmenger syndrome, bosentan was well tolerated and improved exercise capacity and hemodynamics without compromising peripheral oxygen saturation."
    explanation: The pivotal randomised trial conclusion, addressing both efficacy and the shunt-worsening safety concern.
  - reference: PMID:17658633
    reference_title: "Longer-term bosentan therapy improves functional capacity in Eisenmenger syndrome: results of the BREATHE-5 open-label extension study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At week 24, the 6-minute walk distance (mean+/-SE) increased from OLE baseline for the ex-placebo (+33.2+/-23.9 m) and ex-bosentan group (+6.7+/-10.0 m)."
    explanation: Open-label extension showing the walk-distance gain is maintained and extended out to 40 weeks of exposure.
  - reference: PMID:27054605
    reference_title: "Advanced Therapy in Eisenmenger Syndrome: A Systematic Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Advanced therapy with pulmonary vasodilators has become part of the standard treatment, offering long-term benefits on exercise capacity, clinical symptoms, and possibly survival."
    explanation: Systematic review establishing pulmonary vasodilators as standard treatment, while hedging the survival claim as only possible, which is why survival benefit is not asserted here.
  - reference: PMID:27054605
    reference_title: "Advanced Therapy in Eisenmenger Syndrome: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, there are currently only few studies to guide the use of advanced therapies in this population, and important questions such as indications for initiation or escalation of advanced therapy and valid effect parameters and treatment goals remain unanswered."
    explanation: Records that the evidence base does not settle when to start or escalate these drugs, which is the honest limit on how prescriptive this entry can be.
- name: Phosphodiesterase-5 inhibitor therapy
  description: >
    Sildenafil and tadalafil potentiate nitric-oxide-mediated pulmonary vasodilation, the
    arm of endothelial function that is depressed in this disease. Used as add-on to an
    endothelin antagonist or, in some settings, as monotherapy. Added to bosentan,
    sildenafil did not further improve walk distance but did raise resting oxygen
    saturation, an honest split result worth recording.
  context: Symptomatic disease, as add-on to an endothelin receptor antagonist or as monotherapy
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sildenafil
      term:
        id: CHEBI:9139
        label: sildenafil
  target_phenotypes:
  - preferred_term: Pulmonary arterial hypertension
    term:
      id: HP:0002092
      label: Pulmonary arterial hypertension
  target_mechanisms:
  - target: Shear-stress-mediated pulmonary endothelial dysfunction
    treatment_effect: RESTORES
    description: >
      Inhibiting phosphodiesterase-5 preserves cyclic GMP downstream of nitric oxide,
      compensating pharmacologically for the depressed endothelial nitric oxide arm.
    evidence:
    - reference: PMID:20202971
      reference_title: "Combination therapy with bosentan and sildenafil in Eisenmenger syndrome: a randomized, placebo-controlled, double-blinded trial."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Adding sildenafil to bosentan did not improve the 6 MWD significantly (21 vs. 8 m, P = 0.48), but increased saturation at rest (2.9 vs. -1.8%, P < 0.01)."
      explanation: The saturation gain is consistent with improved pulmonary vasodilation, but the absence of a walk-distance effect means the mechanism claim is supported only partially.
  evidence:
  - reference: PMID:20202971
    reference_title: "Combination therapy with bosentan and sildenafil in Eisenmenger syndrome: a randomized, placebo-controlled, double-blinded trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In Eisenmenger syndrome, treatment with bosentan significantly improved walking distance, pulmonary blood flow, and PVR. Adding sildenafil to bosentan did not significantly improve walking distance but did increase saturation at rest."
    explanation: Randomised cross-over trial in 21 patients giving a mixed result for add-on sildenafil, which is why the entry does not claim unqualified benefit.
  - reference: PMID:20304507
    reference_title: "Quality of life and functional capacity can be improved in patients with Eisenmenger syndrome with oral sildenafil therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Quality of life and functional capacity can be improved in patients with Eisenmenger syndrome with oral sildenafil therapy"
    explanation: Independent report of functional and quality-of-life benefit from sildenafil in this population.
- name: Prostanoid therapy
  description: >
    Inhaled iloprost and parenteral prostacyclin analogues replace the deficient
    prostacyclin arm of endothelial signalling. In the EIGER study inhaled iloprost improved
    walk distance, quality of life, and right ventricular performance, notably without
    changing pulmonary artery pressure or resistance, which suggests the functional gain
    is not purely haemodynamic.
  context: Symptomatic disease, often in functional class III-IV or after inadequate response to oral agents
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: iloprost
      term:
        id: CHEBI:63916
        label: iloprost
  target_phenotypes:
  - preferred_term: Exercise intolerance
    term:
      id: HP:0003546
      label: Exercise intolerance
  notes: >
    The dissociation between improved symptoms and unchanged pulmonary haemodynamics is
    recorded deliberately: it means walk distance and quality of life in this disease are
    not simple read-outs of pulmonary vascular resistance, and a drug can help without
    measurably remodelling the pulmonary bed.
  evidence:
  - reference: PMID:24012036
    reference_title: "Effects of inhaled iloprost on exercise capacity, quality of life, and cardiac function in patients with pulmonary arterial hypertension secondary to congenital heart disease (the Eisenmenger syndrome) (from the EIGER Study)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After 24 weeks of iloprost therapy, 6-minute walk test distance significantly increased (289.1 ± 76.9 to 369.5 ± 93.4 m, p = 0.032)"
    explanation: Prospective study showing a substantial walk-distance gain with inhaled iloprost.
  - reference: PMID:24012036
    reference_title: "Effects of inhaled iloprost on exercise capacity, quality of life, and cardiac function in patients with pulmonary arterial hypertension secondary to congenital heart disease (the Eisenmenger syndrome) (from the EIGER Study)."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Pulmonary arterial pressure and pulmonary vascular resistance did not improve with iloprost therapy."
    explanation: Argues against a haemodynamic mechanism for the observed functional benefit, and is curated so the treatment is not presented as resistance-lowering.
- name: Iron replacement therapy
  description: >
    Oral or intravenous iron corrects the iron deficiency that is common in cyanotic
    congenital heart disease, improving exercise capacity and quality of life. It is the
    modern replacement for the discredited practice of routine venesection, and it raises
    rather than lowers haemoglobin.
  context: Documented iron deficiency, identified on ferritin and transferrin saturation rather than haemoglobin alone
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: iron(2+)
      term:
        id: CHEBI:29033
        label: iron(2+)
  target_phenotypes:
  - preferred_term: Iron deficiency anemia
    term:
      id: HP:0001891
      label: Iron deficiency anemia
  - preferred_term: Exercise intolerance
    term:
      id: HP:0003546
      label: Exercise intolerance
  notes: >
    The counterpart caution belongs with it: routine phlebotomy to lower haematocrit is
    not indicated and is actively harmful, because it induces the very iron deficiency
    this treatment corrects.
  evidence:
  - reference: PMID:20580108
    reference_title: "Replacement therapy for iron deficiency improves exercise capacity and quality of life in patients with cyanotic congenital heart disease and/or the Eisenmenger syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant improvements were also detected in the total CAMPHOR score (20.7 ± 10.9 to 16.2 ± 10.4, p=0.001) and 6MWT distance (371.7 ± 84.7 m to 402.8.0±74.9m, p=0.001)."
    explanation: Prospective study showing quality-of-life and walk-distance gains from iron replacement.
  - reference: PMID:9556469
    reference_title: "The Eisenmenger syndrome in adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Erythrocytosis is present in most patients, but excessive phlebotomy may cause microcytosis and exacerbate the symptoms of hyperviscosity."
    explanation: Supports the accompanying caution against venesection, which causes the microcytosis that iron replacement is given to reverse.
- name: Heart-lung or bilateral lung transplantation
  description: >
    The only intervention that alters the underlying disease rather than its symptoms.
    Strategy depends on the defect: for atrial septal defects, bilateral lung
    transplantation with concurrent defect repair gives outcomes at least as good as
    combined heart-lung transplantation, whereas ventricular septal defect disease has
    historically favoured heart-lung. Perioperative bleeding risk is elevated by the
    haemostatic derangement.
  context: Advanced disease refractory to pulmonary vasodilator therapy
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: organ transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_phenotypes:
  - preferred_term: Right ventricular failure
    term:
      id: HP:0001708
      label: Right ventricular failure
  evidence:
  - reference: PMID:34112578
    reference_title: "Waitlist and post-transplant outcomes for eisenmenger syndrome: A comparison of transplant strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LTx shows superior survival outcomes in the current era for ES ASD patients, and equivalent outcomes for ES-VSD."
    explanation: ISHLT and OPTN registry analysis establishing that the optimal transplant strategy differs by underlying defect.
  - reference: PMID:34112578
    reference_title: "Waitlist and post-transplant outcomes for eisenmenger syndrome: A comparison of transplant strategies."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared to LTx for other indications, the odds of transplantation were significantly less for both ES-ASD"
    explanation: Records that Eisenmenger patients are markedly less likely to actually reach transplantation than other lung transplant candidates, which qualifies how available this option is in practice.
  - reference: PMID:32565271
    reference_title: "Not All Septal Defects Are Equal: Outcomes of Bilateral Lung Transplant With Cardiac Defect Repair vs Combined Heart-Lung Transplant in Patients With Eisenmenger Syndrome in the United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During the study period, 442 adults with ES underwent thoracic transplantation (316 HLTs and 126 BLTs). Following BLT, overall survival 1, 5, and 10 years' posttransplant was 63.1%, 38.5%, and 30.2%, respectively."
    explanation: United Network for Organ Sharing analysis of 442 Eisenmenger transplants giving absolute survival figures for the bilateral lung strategy, and independently addressing which strategy suits which defect.
  - reference: PMID:32565271
    reference_title: "Not All Septal Defects Are Equal: Outcomes of Bilateral Lung Transplant With Cardiac Defect Repair vs Combined Heart-Lung Transplant in Patients With Eisenmenger Syndrome in the United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thoracic transplantation is considered for patients with Eisenmenger syndrome (ES) who have refractory right ventricular failure despite optimal therapy for pulmonary arterial hypertension."
    explanation: States the indication curated in this treatment's context field, namely refractory right ventricular failure despite optimal pulmonary vasodilator therapy.
genetic:
- name: BMPR2
  gene_term:
    preferred_term: BMPR2
    term:
      id: hgnc:1078
      label: BMPR2
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >
    BMPR2 is the canonical heritable pulmonary arterial hypertension gene, and variants are
    enriched in congenital heart disease patients who go on to develop pulmonary vascular
    disease relative to those who do not. It is best understood as a susceptibility factor
    that lowers the haemodynamic threshold for irreversible remodeling, not as a cause of
    Eisenmenger syndrome, which requires the anatomic shunt. The enrichment is most marked
    in patients whose defect was repaired yet who still developed pulmonary vascular
    disease, exactly the group in whom haemodynamics alone fail to explain the outcome.
  case_fractions:
  - population: Chinese cohort of congenital heart disease with pulmonary vascular disease
    case_fraction_percent: 7.5
    cohort_size: 294
    notes: 22 of 294 CHD-PVD patients carried a BMPR2 mutation, versus 2 of 161 (1.2%) CHD patients without pulmonary vascular disease.
    evidence:
    - reference: PMID:27002414
      reference_title: "BMPR2 mutation is a potential predisposing genetic risk factor for congenital heart disease associated pulmonary vascular disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A total of 24 mutations were identified, accounting for 22 of the 294 patients with CHD-PVD (7.5%) and 2 of the 161 CHD patients without PVD (1.2%, P=0.004)."
      explanation: Quantifies the BMPR2 enrichment in congenital heart disease with pulmonary vascular disease against a congenital heart disease control group.
  evidence:
  - reference: PMID:27002414
    reference_title: "BMPR2 mutation is a potential predisposing genetic risk factor for congenital heart disease associated pulmonary vascular disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic predisposing factor may be an important component in the process of development of PVD in CHD patients."
    explanation: The study's own conclusion, framed as predisposition rather than causation.
  - reference: PMID:27002414
    reference_title: "BMPR2 mutation is a potential predisposing genetic risk factor for congenital heart disease associated pulmonary vascular disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A significant higher BMPR2 mutation rate (12.6%) was found in repaired CHD-PVD (P=0.010). BMPR2 mutations in CHD-PVD patients were identified in different clinical phenotypes. Missense mutation of BMPR2 is the dominant mutation type."
    explanation: Shows the enrichment concentrating in repaired patients, and identifies missense as the dominant variant class.
- name: ACVRL1
  gene_term:
    preferred_term: ACVRL1
    term:
      id: hgnc:175
      label: ACVRL1
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  notes: >
    ACVRL1 (ALK1) encodes a BMP9/10 co-receptor, is an established heritable pulmonary
    arterial hypertension gene, and appears alongside BMPR2 on the clinical gene panel
    used when heritable pulmonary arterial hypertension is suspected in this setting. Its
    relationship to Eisenmenger syndrome specifically is UNKNOWN rather than
    SUSCEPTIBILITY or DISPUTED: nothing contests the gene's role in pulmonary arterial
    hypertension, but unlike BMPR2 no cohort has shown it enriched in congenital heart
    disease with pulmonary vascular disease relative to congenital heart disease without
    it. Panel membership is the only support, which is absence of Eisenmenger-specific
    evidence rather than contested evidence. No evidence item is attached, because no
    cached source makes a claim about this gene in this disease; the argument lives here
    per the evidence SOP.
- name: ENG
  gene_term:
    preferred_term: ENG
    term:
      id: hgnc:3349
      label: ENG
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  notes: >
    ENG (endoglin) encodes the other BMP9/10 co-receptor component and sits on the same
    heritable pulmonary arterial hypertension gene panel as ACVRL1 and BMPR2. It carries
    the same UNKNOWN relationship for the same reason, and for the same reason no evidence
    item is attached. It is curated as its own record rather than bundled with ACVRL1 so
    that each gene carries its own binding.
- name: Trisomy 21
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  notes: >
    Trisomy 21 is the principal chromosomal risk factor. Children with Down syndrome and a
    post-tricuspid shunt progress to Eisenmenger physiology at higher rates and younger
    ages than other children with comparable lesions, and historically over half of them
    did so. The risk is not fixed biology: it fell to under 1% once early surgical repair
    became routine, which makes trisomy 21 a modifier of the timeline rather than an
    independent path to the syndrome.
  evidence:
  - reference: PMID:27325590
    reference_title: "Eisenmenger syndrome and long-term survival in patients with Down syndrome and congenital heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the likelihood of developing ES decreased over time (53% birth cohort during 1950s/1960s vs 0.5% birth cohort during 2000-2009, p<0.0001)"
    explanation: German National Register data on 894 Down syndrome patients with post-tricuspid shunts.
  - reference: PMID:27325590
    reference_title: "Eisenmenger syndrome and long-term survival in patients with Down syndrome and congenital heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with ES had a significantly worse survival compared with those without ES (HR 18.1; 95% CI 7.2 to 45.4; p<0.0001)."
    explanation: Quantifies the survival cost of developing Eisenmenger syndrome within the Down syndrome congenital heart disease population.
biochemical:
- name: Brain natriuretic peptide
  presence: INCREASED
  biomarker_term:
    preferred_term: brain natriuretic peptide
    term:
      id: NCIT:C88523
      label: Brain Natriuretic Peptide 32
  notes: >
    Serum brain natriuretic peptide is an independent prognostic predictor in Eisenmenger
    syndrome, rising with right ventricular dysfunction. It is a risk marker rather than a
    diagnostic test, and no externally validated risk score incorporating it yet exists
    for this disease. Note the analyte: both cited sources say "brain natriuretic peptide"
    (BNP), so the term bound here is BNP itself and not the N-terminal fragment
    (NT-proBNP) that sibling pulmonary arterial hypertension entries curate. The two are
    different molecules measured by different assays and should not be conflated.
  evidence:
  - reference: PMID:40204597

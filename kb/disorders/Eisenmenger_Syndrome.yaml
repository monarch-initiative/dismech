    snippet: "Impaired exercise tolerance, decreased arterial oxygen saturation, iron deficiency, pre-tricuspid shunts, arrhythmias, increased brain natriuretic peptide, echocardiographic indices of right ventricular dysfunction and hospitalisation for heart failure predict mortality."
    explanation: Independent listing of raised brain natriuretic peptide among the mortality predictors, alongside the arrhythmia and iron-deficiency features curated elsewhere in this entry.

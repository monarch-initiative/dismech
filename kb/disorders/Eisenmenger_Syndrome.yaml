prevalence:
- population: Adults with congenital heart disease, contemporary registries in high-resource settings
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  notes: >
    Between 1% and 5.7% of contemporary congenital heart disease registry populations,
    down from the 17.5% Paul Wood described in 1958. The denominator here is patients with
    congenital heart disease, not the general population, so the prevalence class reflects
    frequency within that population rather than population prevalence. The decline is
    attributable to early surgical repair and is not seen in regions with limited access
    to paediatric cardiac surgery.
  evidence:
  - reference: PMID:39711759
    reference_title: "Update on Eisenmenger syndrome - Review of pathophysiology and recent progress in risk assessment and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "to between 1 and 5.7 % in more contemporary registries"
    explanation: Gives the contemporary registry range. The same sentence records the historical 17.5% figure Paul Wood described in 1958, but that clause carries an inline citation marker that the reference validator strips, so the quoted portion is the bracket-free tail.
  - reference: PMID:39711759
    reference_title: "Update on Eisenmenger syndrome - Review of pathophysiology and recent progress in risk assessment and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, a similar trend may not be seen in patients from regions with less robust access to medical resources"
    explanation: Records that the decline is confined to high-resource settings, so the contemporary figure should not be generalised globally.
- population: Down syndrome with a post-tricuspid shunt lesion, German National Register
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  notes: >
    53% of the 1950s-1960s birth cohort developed Eisenmenger syndrome, versus 0.5% of the
    2000-2009 birth cohort, in 894 patients with Down syndrome and a post-tricuspid shunt.
    The two figures are the same population separated only by access to early surgery.
  evidence:
  - reference: PMID:27325590
    reference_title: "Eisenmenger syndrome and long-term survival in patients with Down syndrome and congenital heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Out of 1549 patients with DS with congenital heart disease in the National Register for Congenital Heart Defects, 894 patients (55% female, mean age 17.5 years) had a post-tricuspid shunt lesion"
    explanation: Defines the register cohort from which the birth-cohort progression rates are drawn.
differential_diagnoses:
- name: Idiopathic pulmonary arterial hypertension
  description: >
    Shares the pulmonary vascular lesion but has no structural shunt. The distinction is
    not academic: without a decompressing shunt the right ventricle bears the full
    afterload, so idiopathic disease carries worse haemodynamics and shorter survival at
    equivalent pulmonary pressures, and the treatment goal is unequivocally to lower
    pulmonary vascular resistance rather than to preserve a protective shunt.
  disease_term:
    preferred_term: idiopathic pulmonary arterial hypertension
    term:
      id: MONDO:0001999
      label: idiopathic pulmonary arterial hypertension
  distinguishing_features:
  - No structural intracardiac or aortopulmonary communication
  - No right-to-left shunt, so no central cyanosis from shunting and no secondary erythrocytosis
  - Worse haemodynamics and survival at comparable pulmonary artery pressures
  - Defect closure is not a consideration; there is no shunt to preserve or close
  evidence:
  - reference: PMID:19245962
    reference_title: "Eisenmenger syndrome a clinical perspective in a new therapeutic era of pulmonary arterial hypertension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although ES shares similar morphological findings with idiopathic PAH, clinical differences exist between the 2 etiologies. Adults with ES exhibit increased survival and more favorable hemodynamics than those with idiopathic PAH."
    explanation: States both the shared pulmonary vascular morphology and the divergent clinical course that separates the two entities.
- name: Operable pulmonary arterial hypertension associated with congenital heart disease
  description: >
    The same disease at an earlier point on its trajectory, before pulmonary vascular
    resistance becomes fixed and the shunt reverses. This is the single most consequential
    distinction in the entry, because the two are managed in opposite directions: the
    operable patient should have the defect closed, and the Eisenmenger patient must not.
    Right heart catheterisation with vasoreactivity testing is what separates them.
  distinguishing_features:
  - Shunt still predominantly left-to-right, without resting cyanosis
  - Pulmonary vascular resistance not yet fixed, and may fall on vasoreactivity testing
  - Defect closure indicated rather than contraindicated
  - Secondary erythrocytosis and the multisystem cyanotic complications are absent
  evidence:
  - reference: PMID:33853494
    reference_title: "Preventing disease progression in Eisenmenger syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once Eisenmenger syndrome develops, shunt closure should be avoided."
    explanation: States the management divergence that makes this differential decisive.
  - reference: PMID:31120797
    reference_title: "Eisenmenger syndrome and other types of pulmonary arterial hypertension related to adult congenital heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PAH-CHD describes a wide spectrum of conditions, of which ES is the archetype."
    explanation: Positions Eisenmenger syndrome as the severe end of a spectrum, the earlier parts of which remain operable.
clinical_burden:
  burden_level: HIGH
  rationale: >
    A lifelong, progressive, multisystem disease with 10-year survival of 57% overall and
    34% without pulmonary vasodilator therapy, no curative option short of transplantation,
    and an absolute contraindication to pregnancy in a population that reaches childbearing
    age. Exercise capacity and quality of life are worse than in other complex cyanotic
    congenital heart disease.
  notes: >
    Right heart failure is the leading cause of death, with sudden cardiac death and
    infection next. Pregnancy carries very high maternal mortality and is contraindicated.
    Non-cardiac surgery is also high-risk. Pulmonary vasodilator therapy has improved
    functional capacity and quality of life, but a systematic review correcting for
    immortal time bias found no improvement in survival among treatment-naive patients
    across four decades, so the burden should not be read as historical.
  evidence:
  - reference: PMID:39711759
    reference_title: "Update on Eisenmenger syndrome - Review of pathophysiology and recent progress in risk assessment and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once these biases were accounted for, 10-year survival for contemporary patients with ES was 57 % in the overall cohort and 34 % in patients naïve to disease targeting therapy (DTT)"
    explanation: Contemporary bias-corrected survival figures.
  - reference: PMID:9556469
    reference_title: "The Eisenmenger syndrome in adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pregnancy or noncardiac surgery is associated with a high mortality rate in patients with the Eisenmenger syndrome."
    explanation: Establishes both pregnancy and non-cardiac surgery as high-mortality exposures.
  - reference: PMID:34616573
    reference_title: "High Maternal Neonatal Mortality and Morbidity in Pregnancy with Eisenmenger Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pregnancy complications found include preterm birth (78%), low birthweight (94%), intrauterine growth restriction (55%), oligohydramnios (16%), severe preeclampsia (33%), and placenta previa (5.5%)."
    explanation: Retrospective cohort of 18 pregnancies quantifying the obstetric complication burden.
  - reference: PMID:20439122
    reference_title: "Exercise performance and quality of life is more impaired in Eisenmenger syndrome than in complex cyanotic congenital heart disease with pulmonary stenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exercise performance and quality of life is more impaired in Eisenmenger syndrome than in complex cyanotic congenital heart disease with pulmonary stenosis"
    explanation: Comparative evidence that the functional burden exceeds that of other complex cyanotic congenital heart disease.
  - reference: PMID:11923814
    reference_title: "Poor prognosis and related factors in adults with Eisenmenger syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Survival rate was 98% at 1 year, 77% at 5 years, and 58% at 10 years, with the Kaplan-Meier method. Elevated right atrial pressure (>7 mm Hg) and reduced systemic blood flow (<2.9 L/min) were independently associated with increased mortality rate of adults with Eisenmenger syndrome."
    explanation: Cohort of 106 adults diagnosed in adulthood giving survival figures and two independent haemodynamic mortality predictors.
  - reference: PMID:40204597
    reference_title: "Risk stratification in Eisenmenger syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The only multivariable death risk-stratification model based on non-invasive predictors (age, shunt location, resting oxygen saturation, sinus rhythm and pericardial effusion) proposed thus far in Eisenmenger syndrome is awaiting external validation."
    explanation: Records that no externally validated risk score exists for this disease, so the prognostic markers curated here should be read as associations rather than as a usable score.
  - reference: PMID:40204597
    reference_title: "Risk stratification in Eisenmenger syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several risk factors have been identified as independent predictors in Eisenmenger syndrome, including the 6-minute walk distance, echocardiographic markers and serum brain natriuretic peptide."
    explanation: Names the independent prognostic predictors, including the natriuretic peptide curated under biochemical.
discussions:
- discussion_id: treat_and_repair_strategy
  prompt: >
    Can aggressive pulmonary vasodilator therapy render an inoperable Eisenmenger patient
    operable, and should the defect then be closed?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Right-to-left shunt as a protective right ventricular pop-off
  rationale: >
    The established position is that shunt closure must be avoided once Eisenmenger
    physiology exists, because the shunt is decompressing the right ventricle. The
    treat-and-repair strategy proposes that pulmonary vasodilators can lower pulmonary
    vascular resistance enough in selected responders to make closure safe again. Case
    series report good short- and medium-term outcomes, but there is no randomised
    evidence, no long-term follow-up, and no agreed haemodynamic threshold for
    eligibility. The stakes are asymmetric: closing the defect in a patient whose
    resistance does not stay down removes the pop-off irreversibly.
  proposed_experiments:
  - experiment_id: exp_es_treat_and_repair_registry
    name: Prospective multicentre registry of treat-and-repair with predefined haemodynamic eligibility
    description: >-
      Enrol patients with pulmonary arterial hypertension associated with congenital heart
      disease who meet a predefined post-treatment haemodynamic threshold, record whether
      closure was performed, and follow right ventricular function, functional class, and
      survival for at least five years against a matched non-closed comparison group.
    decision_criterion: >-
      Sustained right ventricular function and survival at five years in closed patients,
      relative to matched unclosed controls, would justify a threshold-based
      recommendation; deterioration would confirm the current avoid-closure default.
  evidence:
  - reference: PMID:33853494
    reference_title: "Preventing disease progression in Eisenmenger syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once Eisenmenger syndrome develops, shunt closure should be avoided."
    explanation: States the default position that the treat-and-repair strategy proposes to qualify.
notes: >
  No GeneReviews chapter exists for Eisenmenger syndrome; a PubMed search for
  "Eisenmenger GeneReviews[All Fields]" returned no results, which is expected because the
  syndrome is an acquired physiologic end-state of a congenital lesion rather than a
  Mendelian disorder. Genetic content here is confined to susceptibility (BMPR2) and
  chromosomal risk (trisomy 21), both curated as modifiers of progression rather than
  causes.


  No `has_subtypes` block is curated, deliberately. Risk of progression is strongly
  lesion-dependent — nearly all unrepaired truncus arteriosus, roughly half of large
  ventricular septal defects, and under a tenth of large atrial septal defects — but that
  variation is a property of the *underlying congenital defect*, not of Eisenmenger
  syndrome itself. Once the physiology is established the entity is the same regardless
  of which defect produced it, so splitting by lesion would model the antecedent rather
  than the disease. The one place lesion identity does change management, transplant
  strategy selection, is curated on the transplantation treatment instead. Shunt level
  (pre- versus post-tricuspid) is carried in the trigger node description.


  One reference fetched during curation is deliberately left uncited: PMID:28566473
  (declining incidence and prevalence of Eisenmenger syndrome) is a Heart editorial
  comment whose PubMed record carries no abstract text, so no verifiable snippet can be
  quoted from it. The same epidemiological decline is curated from PMID:39711759 instead,
  which states it in quotable form.
datasets:
- accession: geo:GSE126322
  title: Remodeling of active endothelial enhancers is associated with aberrant gene-regulatory networks in pulmonary arterial hypertension [ChIP-seq]
  description: >-
    Chromatin profiling (H3K27ac, H3K4me1, H3K4me3 ChIP-seq) of pulmonary arterial
    endothelial cells extracted from the lungs of 10 patients with pulmonary arterial
    hypertension and 9 controls, showing large-scale remodeling of the active enhancer
    landscape while promoters and gene expression were unchanged.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: CHIP_SEQ
  sample_count: 55
  conditions:
  - pulmonary arterial hypertension
  - control
  platform: ChIP-seq of H3K27ac, H3K4me1 and H3K4me3
  publication: PMID:32245974
  genes:
  - preferred_term: BMPR2
    term:
      id: hgnc:1078
      label: BMPR2
  notes: >-
    Relevance triage, stated plainly: this dataset contains NO Eisenmenger syndrome and no
    congenital heart disease samples. Its cohort is pulmonary arterial hypertension
    generally. It is included solely because this entry declares `conforms_to` against
    `pulmonary_vascular_remodeling#Pulmonary Endothelial Dysfunction and Impaired BMP
    Signaling`, and this is primary human pulmonary artery endothelial cell data for
    exactly that conformed node; it cannot support any Eisenmenger-specific claim, and no
    evidence item cites it. No Eisenmenger-specific transcriptomic, epigenomic, or
    proteomic dataset exists in GEO. All 12 candidates surfaced by dataset discovery were
    gene-only matches on BMPR2 with no congenital-heart-disease content, so this is the
    closest mechanistically relevant primary dataset rather than a disease match.


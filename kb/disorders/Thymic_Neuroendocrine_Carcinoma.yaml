  downstream:
  - target: Ectopic Corticotropin and CRH Secretion
    description: >-
      The expanded neuroendocrine clone retains and amplifies the ACTH/CRH
      secretory program of its thymic cell of origin.
  - target: Somatostatin Receptor Expression
    description: >-
      Neuroendocrine differentiation includes surface somatostatin receptor
      expression, the substrate for SSTR imaging and SSTR-directed therapy.
  - target: Mediastinal Mass Effect and Local Invasion
    description: >-
      Clonal expansion produces a prevascular mediastinal mass that compresses and
      invades adjacent thoracic structures.
  - target: Nodal and Distant Metastatic Dissemination
    description: >-
      Proliferating tumor cells disseminate via lymphatics and blood to nodes,
      bone, lung and pleura.
  - target: Thymic neuroendocrine tumor
    description: >-
      The expanded clone constitutes the defining lesion, a neuroendocrine neoplasm
      of the thymus.
- name: Ectopic Corticotropin and CRH Secretion
  biological_scale: CELLULAR
  role: consequence
  description: >-
    The normal thymus contains scattered ACTH- and CRH-immunoreactive cells, and
    thymic neuroendocrine tumors are correspondingly immunoreactive for both
    hormones; tumors from patients with Cushing syndrome stain more strongly for
    both than those without. Autonomous, non-pituitary secretion of ACTH (with a
    probable contribution from tumoral CRH) drives bilateral adrenocortical
    stimulation and ACTH-dependent hypercortisolism. This is the signature
    functional paraneoplastic syndrome of the thymic neuroendocrine family and
    frequently brings the tumor to attention before it is otherwise symptomatic.
  biological_processes:
  - preferred_term: corticotropin secretion
    term:
      id: GO:0051458
      label: corticotropin secretion
    modifier: INCREASED
  - preferred_term: peptide hormone secretion
    term:
      id: GO:0030072
      label: peptide hormone secretion
    modifier: INCREASED
  cell_types:
  - preferred_term: thymic neuroendocrine tumor cell
    term:
      id: CL:0000165
      label: neuroendocrine cell
  evidence:
  - reference: PMID:30502716
    reference_title: "Carcinoid tumors of the thymus and Cushing's syndrome: Clinicopathologic features and current best evidence regarding the cell of origin of these unusual neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten NET were CRH immunoreactive and 6 were ACTH immunoreactive. Thymic NET
      with CS exhibited stronger immunoreactivity for ACTH and CRH than those
      without CS.
    explanation: >-
      Directly links tumoral ACTH and CRH production to the presence of Cushing
      syndrome in thymic neuroendocrine tumors.
  - reference: PMID:30502716
    reference_title: "Carcinoid tumors of the thymus and Cushing's syndrome: Clinicopathologic features and current best evidence regarding the cell of origin of these unusual neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The thymus contains CRH and ACTH immunoreactive cells that are probably the
      origin of thymic NET.
    explanation: >-
      Supports a normal thymic ACTH/CRH-immunoreactive cell as the proposed cell of
      origin, explaining why the ectopic-ACTH syndrome is characteristic of this
      tumor family.
  - reference: PMID:37409236
    reference_title: "Expressions of Cushing's syndrome in multiple endocrine neoplasia type 1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ectopic tumoral ACTH secretion has also been observed in MEN1, almost
      exclusively originating from thymic neuroendocrine tumors.
    explanation: >-
      Review establishing that within MEN1, ectopic ACTH secretion comes almost
      exclusively from thymic neuroendocrine tumors, underscoring how
      characteristic this mechanism is of the entity. Evidence source is OTHER
      because this is a narrative review.
  downstream:
  - target: ACTH-Dependent Hypercortisolism
    description: >-
      Autonomous tumoral ACTH secretion escapes pituitary negative feedback and
      drives sustained adrenocortical cortisol output.
- name: ACTH-Dependent Hypercortisolism
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Sustained non-pituitary ACTH stimulation of the adrenal cortex produces
    ACTH-dependent (secondary) hypercortisolism with the ectopic Cushing syndrome
    phenotype - hypertension, hypokalaemic metabolic alkalosis, hyperglycaemia,
    proximal myopathy, osteoporosis and immunosuppression with opportunistic
    infection. In thymic neuroendocrine tumors this hormonal morbidity is a
    substantial and sometimes dominant contributor to mortality independent of
    tumor bulk, and its control is an urgent management priority.
  evidence:
  - reference: PMID:40328381
    reference_title: "Characterization, Prognosis, and Treatment of Patients With Locally Advanced or Metastatic Thymic Neuroendocrine Tumor: A Retrospective Study of the French GTE, ENDOCAN RENATEN, and RYTHMIC Networks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      11 patients (15%) with ectopic Cushing syndrome
    explanation: >-
      Quantifies ectopic Cushing syndrome in 15% of a 74-patient advanced thymic
      NET cohort.
  downstream:
  - target: Ectopic ACTH-dependent Cushing syndrome
    description: >-
      Sustained ACTH-driven cortisol excess manifests clinically as ectopic Cushing
      syndrome.
  - target: Hypertension
    description: >-
      Cortisol excess cross-activates the mineralocorticoid receptor, raising blood
      pressure.
  - target: Hypokalemia
    description: >-
      Cortisol overwhelms renal 11-beta-HSD2, driving mineralocorticoid-like
      kaliuresis and hypokalaemic alkalosis.
- name: Somatostatin Receptor Expression
  biological_scale: MOLECULAR
  role: consequence
  description: >-
    A substantial fraction of thymic neuroendocrine neoplasms express membranous
    somatostatin receptor 2 (SSTR2). SSTR2 expression is the molecular substrate
    for somatostatin-receptor functional imaging (68Ga-DOTATATE PET) and for
    SSTR-directed therapy with somatostatin analogues and peptide receptor
    radionuclide therapy, and expression level tracks with imaging avidity. In
    advanced thymic NET, somatostatin-receptor imaging is positive in roughly
    three-quarters of cases.
  biological_processes:
  - preferred_term: somatostatin receptor signaling pathway
    term:
      id: GO:0038169
      label: somatostatin receptor signaling pathway
    modifier: ABNORMAL
  cell_types:
  - preferred_term: thymic neuroendocrine tumor cell
    term:
      id: CL:0000165
      label: neuroendocrine cell
  evidence:
  - reference: PMID:35198446
    reference_title: "Correlation of Somatostatin Receptor 2 Expression, 68Ga-DOTATATE PET Scan and Octreotide Treatment in Thymic Epithelial Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      68Ga-DOTATATE PET scans correlated with SSTR2 expression in TET in most
      patients and appeared to be useful to identify patients with TET who may be
      amenable to treatment with somatostatin analogues.
    explanation: >-
      Supports SSTR2 expression as the basis of DOTATATE imaging avidity and of
      somatostatin-analogue treatment selection in thymic epithelial tumors,
      including atypical carcinoid and small cell carcinoma.
  - reference: PMID:40328381
    reference_title: "Characterization, Prognosis, and Treatment of Patients With Locally Advanced or Metastatic Thymic Neuroendocrine Tumor: A Retrospective Study of the French GTE, ENDOCAN RENATEN, and RYTHMIC Networks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Positive results for 18F-FDG or somatostain receptor imaging was found in 88%
      or 74% of cases, respectively.
    explanation: >-
      Quantifies somatostatin-receptor imaging positivity in 74% of advanced thymic
      NET, supporting SSTR expression as a common tumor feature.
- name: Mediastinal Mass Effect and Local Invasion
  biological_scale: TISSUE
  role: consequence
  description: >-
    The tumor grows as a prevascular (anterior) mediastinal mass and invades
    mediastinal fat, pleura, pericardium, lung and great vessels, producing chest
    pain, cough, dyspnoea and occasionally superior vena caval obstruction. Most
    patients with advanced disease present with locally advanced rather than
    synchronously metastatic tumor, and completeness of resection is the single
    strongest modifiable prognostic factor.
  locations:
  - preferred_term: anterior mediastinum
    term:
      id: UBERON:0008820
      label: anterior mediastinum
  evidence:
  - reference: PMID:40328381
    reference_title: "Characterization, Prognosis, and Treatment of Patients With Locally Advanced or Metastatic Thymic Neuroendocrine Tumor: A Retrospective Study of the French GTE, ENDOCAN RENATEN, and RYTHMIC Networks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 64 patients (87%) had locally advanced Thy-NET and eight (11%) had
      synchronous metastases, at diagnosis.
    explanation: >-
      Supports locally advanced mediastinal disease as the dominant presentation
      pattern of advanced thymic NET.
  - reference: PMID:29049806
    reference_title: "Results of treatment for thymic neuroendocrine tumours: multicentre clinicopathological study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall survival was significantly better in patients who underwent
      macroscopic complete resection (P = 0.010).
    explanation: >-
      Supports resectability of the local mediastinal tumor as the key determinant
      of survival.
  downstream:
  - target: Anterior mediastinal mass
    description: >-
      The expanding tumor is detected radiologically as a prevascular mediastinal
      mass.
  - target: Chest pain
    description: >-
      Invasion of pleura, pericardium and chest wall produces chest pain.
  - target: Dyspnea
    description: >-
      Compression or invasion of airway, lung and great vessels causes
      breathlessness.
  - target: Cough
    description: >-
      Airway irritation and compression by the mediastinal mass produces cough.
- name: Nodal and Distant Metastatic Dissemination
  biological_scale: ORGANISM
  role: outcome
  description: >-
    Thymic neuroendocrine carcinoma disseminates to regional mediastinal lymph
    nodes and then to bone, lung, pleura, liver and brain. Metastasis is frequently
    metachronous - appearing years after an apparently complete resection - which
    is why prolonged surveillance is required even for well-differentiated tumors.
    Pleural spread appears to be almost exclusively metachronous and may reflect
    perioperative dissemination. In MEN1-associated disease the
    metachronous-metastasis rate is very high.
  evidence:
  - reference: PMID:40328381
    reference_title: "Characterization, Prognosis, and Treatment of Patients With Locally Advanced or Metastatic Thymic Neuroendocrine Tumor: A Retrospective Study of the French GTE, ENDOCAN RENATEN, and RYTHMIC Networks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metastatic sites were as follows: lymph nodes (54 patients, 73%), bone (42
      patients, 65%), lung (31 patients, 42%), and pleura (31 patients, 42%).
    explanation: >-
      Enumerates the metastatic site distribution of advanced thymic NET.
  - reference: PMID:27311764
    reference_title: "Clinical Features, Treatments, and Outcomes of Patients with Thymic Carcinoids and Multiple Endocrine Neoplasia Type 1 Syndrome at MD Anderson Cancer Center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eighty nine percent of patients developed a metachronous metastasis from the
      thymic carcinoid.
    explanation: >-
      Supports the predominance of metachronous (late) metastasis in
      MEN1-associated thymic carcinoid.
  - reference: PMID:40328381
    reference_title: "Characterization, Prognosis, and Treatment of Patients With Locally Advanced or Metastatic Thymic Neuroendocrine Tumor: A Retrospective Study of the French GTE, ENDOCAN RENATEN, and RYTHMIC Networks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pleural metastases were almost exclusively metachronous.
    explanation: >-
      Supports the distinctive metachronous timing of pleural spread; the same
      cohort's discussion raises perioperative dissemination as the suspected
      explanation.
  downstream:
  - target: Mediastinal lymphadenopathy
    description: >-
      Regional nodal spread presents as mediastinal lymphadenopathy, the commonest
      metastatic site.
  - target: Bone metastasis
    description: >-
      Haematogenous spread to the skeleton produces bone metastases and bone pain.
  - target: Pulmonary metastasis
    description: >-
      Haematogenous spread seeds the lung, one of the commonest distant sites.
  - target: Pleural metastasis
    description: >-
      Pleural seeding, almost always metachronous, follows local and perioperative
      dissemination.
  - target: Hepatic metastasis
    description: >-
      Haematogenous spread seeds the liver, a common distant site.
  - target: Cerebral metastasis
    description: >-
      Haematogenous spread seeds the brain, a recognised distant site that alters
      surveillance imaging and systemic-therapy choice.
  - target: Weight loss
    description: >-
      Advanced metastatic tumor burden produces constitutional weight loss.
phenotypes:
- category: Neoplasm
  name: Thymic neuroendocrine tumor
  frequency: OBLIGATE
  diagnostic: true
  description: >-
    The defining lesion - a neuroendocrine neoplasm of the thymus. Historically
    labelled thymic carcinoid, it is a malignant thymic epithelial tumor with
    neuroendocrine morphology and marker expression.
  phenotype_term:
    preferred_term: Thymic neuroendocrine neoplasm
    term:
      id: HP:0100521
      label: Neoplasm of the thymus
  notes: >-
    Term choice. HP:0034954 Thymic carcinoid tumor ("A primary thymic
    neuroendocrine tumor") reads as the obvious match on its label, but under
    the 2021 WHO scheme "carcinoid" denotes only the well- and
    moderately-differentiated grades. This entry deliberately spans all four
    grades including large cell neuroendocrine carcinoma and small cell
    carcinoma, which are not carcinoids, so HP:0034954 is narrower than the
    disease it would be annotating. HP:0100521 Neoplasm of the thymus is used
    instead as the nearest term that covers the whole graded spectrum; the
    neuroendocrine qualification is carried by preferred_term and by the
    subtype-level MONDO terms. An HPO NTR for a grade-agnostic "thymic
    neuroendocrine neoplasm" class would resolve this properly.
  evidence:
  - reference: PMID:40068632
    reference_title: "A Review for the Clinician: Classifications, Genetics, and Treatment for Neuroendocrine Neoplasms of the Thymus (Thymic Carcinoids)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thymic carcinoids or neuroendocrine neoplasms (t-NEN) are a rare entity with
      a dismal prognosis.
    explanation: >-
      Review establishing the entity and its poor prognosis. Evidence source is
      OTHER because this is a narrative review.
  - reference: ORPHA:99869
    reference_title: "Thymic neuroendocrine carcinoma"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thymic neuroendocrine carcinoma is a type of thymic epithelial neoplasm
      displaying evidence of neuroendocrine differentiation.
    explanation: >-
      Orphanet definition of the entity curated here.
- category: Thoracic
  name: Anterior mediastinal mass
  frequency: OBLIGATE
  diagnostic: true
  description: >-
    The tumor presents as a mass in the prevascular (anterior) mediastinum, often
    large and locally invasive at diagnosis.
  phenotype_term:
    preferred_term: Anterior mediastinal mass
    term:
      id: HP:0033827
      label: Anterior mediastinal mass
  evidence:
  - reference: ORPHA:99869
    reference_title: "Thymic neuroendocrine carcinoma"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thymic neuroendocrine carcinoma is a type of thymic epithelial neoplasm
      displaying evidence of neuroendocrine differentiation.
    explanation: >-
      A thymic epithelial neoplasm is by definition a prevascular (anterior)
      mediastinal mass, which is why the phenotype is OBLIGATE.
  - reference: PMID:40328381
    reference_title: "Characterization, Prognosis, and Treatment of Patients With Locally Advanced or Metastatic Thymic Neuroendocrine Tumor: A Retrospective Study of the French GTE, ENDOCAN RENATEN, and RYTHMIC Networks."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 64 patients (87%) had locally advanced Thy-NET and eight (11%) had
      synchronous metastases, at diagnosis.
    explanation: >-
      Characterises the mediastinal primary as usually locally advanced at diagnosis.
      Marked PARTIAL because it speaks to stage rather than to the presence of the
      mass.
- category: Endocrine
  name: Ectopic ACTH-dependent Cushing syndrome
  frequency: OCCASIONAL
  description: >-
    Autonomous tumoral ACTH (and CRH) secretion produces ACTH-dependent
    hypercortisolism - the signature functional paraneoplastic syndrome of thymic
    neuroendocrine neoplasms. Reported in 15% of an advanced-disease national
    cohort and in 3 of 21 (14%) of a surgical series, and strongly enriched in
    atypical carcinoid. It is frequently the presenting manifestation and is a
    major independent source of morbidity and mortality. The OCCASIONAL band is
    anchored on those two unselected surgical/registry series; a Cushing-focused
    pathology series reports a much higher 36.4%, but that denominator is
    ascertainment-biased by design and is not used to set the band.
  phenotype_term:
    preferred_term: ACTH-dependent hypercortisolism (ectopic Cushing syndrome)
    term:
      id: HP:0011744
      label: Secondary hypercortisolism
  evidence:
  - reference: PMID:40328381
    reference_title: "Characterization, Prognosis, and Treatment of Patients With Locally Advanced or Metastatic Thymic Neuroendocrine Tumor: A Retrospective Study of the French GTE, ENDOCAN RENATEN, and RYTHMIC Networks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      11 patients (15%) with ectopic Cushing syndrome
    explanation: >-
      Direct quantitative support for the OCCASIONAL (5-29%) frequency band in a
      74-patient national-network cohort.
  - reference: PMID:23110006
    reference_title: "Clinicopathological analysis of 21 thymic neuroendocrine tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three cases of atypical carcinoid (AC) were associated with ectopic Cushing's
      syndrome.
    explanation: >-
      Independent surgical series documenting ectopic Cushing syndrome in 3 of 21
      thymic neuroendocrine tumors (14%), consistent with the OCCASIONAL band.
- category: Cardiovascular
  name: Hypertension
  context: Ectopic Cushing syndrome subset
  description: >-
    A cardinal manifestation of the ectopic-ACTH hypercortisolism seen in
    functional thymic neuroendocrine tumors, driven by cortisol's
    mineralocorticoid-receptor cross-activation. Occurs only in the functional
    subset; no thymic-NET-specific frequency is published, so none is asserted.
  phenotype_term:
    preferred_term: Hypertension
    term:
      id: HP:0000822
      label: Hypertension
  evidence:
  - reference: PMID:35690804
    reference_title: "Successful resolution of ectopic Cushing syndrome by minimally invasive thoracoscopic resection of the neuroendocrine tumor of the thymus: a rare case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Physical examination revealed hypertension (blood pressure: 141/100 mmHg). A
      mediastinal tumor was discovered to be the cause of the patient's chronic
      hypokalemia and hypercortisolemia.
    explanation: >-
      Case report of a thymic carcinoid with ectopic ACTH-dependent Cushing
      syndrome documenting hypertension attributable to the tumor.
- category: Metabolic
  name: Hypokalemia
  context: Ectopic Cushing syndrome subset
  description: >-
    Hypokalaemic metabolic alkalosis is characteristic of severe ectopic-ACTH
    hypercortisolism, where very high cortisol overwhelms renal 11-beta-HSD2 and
    activates mineralocorticoid receptors. Occurs only in the functional subset;
    no thymic-NET-specific frequency is published, so none is asserted.
  phenotype_term:
    preferred_term: Hypokalemia
    term:
      id: HP:0002900
      label: Hypokalemia
  evidence:
  - reference: PMID:35690804
    reference_title: "Successful resolution of ectopic Cushing syndrome by minimally invasive thoracoscopic resection of the neuroendocrine tumor of the thymus: a rare case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of hypertension, hypokalemia, and alkalinity suggested Cushing's
      syndrome, which was proven to be ACTH-dependent ECS by a dexamethasone
      suppression test.
    explanation: >-
      Documents the hypertension-hypokalaemia-alkalosis triad of ACTH-dependent
      ectopic Cushing syndrome arising from a thymic neuroendocrine tumor.
- category: Thoracic
  name: Chest pain
  description: >-
    Local invasion of mediastinal structures, pleura and chest wall produces chest
    pain, one of the commonest local symptoms in symptomatic thymic neuroendocrine
    carcinoma. No cohort quantifies its frequency, so no frequency band is

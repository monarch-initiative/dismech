notes: >-
  Scope and boundary. This entry covers only the neuroendocrine arm of thymic
  epithelial neoplasia. Conventional (non-neuroendocrine) thymic carcinoma -
  overwhelmingly thymic squamous cell carcinoma, with its CD5/CD117
  immunophenotype and CDKN2A/TP53-dominant genomics - is curated in
  kb/disorders/Thymic_Carcinoma.yaml, which retains a "Neuroendocrine" subtype
  facet for taxonomic completeness only; the mechanistic content lives here.
  Thymoma, an organotypic thymic epithelial tumor with a distinct autoimmune
  paraneoplastic profile (myasthenia gravis, pure red cell aplasia, Good
  syndrome), is curated in kb/disorders/Thymoma.yaml. Both are modeled here as
  differential diagnoses rather than being duplicated.

  Terminology caveat. The literature uses "thymic neuroendocrine carcinoma",
  "thymic neuroendocrine neoplasm/tumor" and "thymic carcinoid" close to
  interchangeably, and MONDO:0020516 sits over the whole graded family (MONDO
  places both the well-differentiated carcinoids and the poorly differentiated
  small cell / large cell forms beneath it). Evidence in this entry is therefore
  drawn from series reported under all of those labels; where a finding is
  specific to one grade the subtype is named in the record.

  Deep research provenance. Curated with an Edison/Falcon deep-research report
  (research/Thymic_Neuroendocrine_Carcinoma-deep-research-falcon.md) used as
  leads only. That report returned no usable primary PMIDs and proposed several
  incorrect ontology identifiers (HP:0002664 offered for "Cushing syndrome" is
  actually Neoplasm; HP:0000846 offered for "hypercortisolism" is actually
  Adrenal insufficiency; UBERON:0003406 offered for "mediastinum" is actually
  cartilage of respiratory system). Every term used here was independently
  verified with OAK and every snippet against the cached abstract.
has_subtypes:
- name: Typical carcinoid
  display_name: Thymic typical carcinoid (well-differentiated, NET G1)
  subtype_term:
    preferred_term: well-differentiated thymic neuroendocrine carcinoma
    term:
      id: MONDO:0016976
      label: well-differentiated thymic neuroendocrine carcinoma
  description: >-
    Well-differentiated thymic neuroendocrine neoplasm with organoid architecture,
    low mitotic count and no necrosis. It is the rarest grade in the thymus -
    unlike the lung, where typical carcinoid predominates, the vast majority of
    thymic carcinoids are atypical. Clinically the most indolent grade, but late
    recurrence still occurs.
  locations:
  - preferred_term: thymus
    term:
      id: UBERON:0002370
      label: thymus
  evidence:
  - reference: PMID:23110006
    reference_title: "Clinicopathological analysis of 21 thymic neuroendocrine tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Regarding the tumor classification, our results showed that a vast majority
      of carcinoids in the thymus correspond to ACs. In addition, our results also
      indicate that typical carcinoid is a very rare entity.
    explanation: >-
      Surgical series supports typical carcinoid as the rarest grade of thymic
      neuroendocrine neoplasm, in contrast to the pulmonary distribution.
- name: Atypical carcinoid
  display_name: Thymic atypical carcinoid (moderately differentiated, NET G2/G3)
  subtype_term:
    preferred_term: moderately-differentiated thymic neuroendocrine carcinoma
    term:
      id: MONDO:0016977
      label: moderately-differentiated thymic neuroendocrine carcinoma
  description: >-
    The dominant grade of thymic neuroendocrine neoplasm. Retains carcinoid
    (organoid) architecture but shows an elevated mitotic count and/or punctate
    necrosis. In contemporary practice a subset with high proliferation is further
    separated as "NET G3 highly proliferative atypical carcinoid". Atypical
    carcinoids present at higher stage than typical carcinoids and account for
    most ectopic-Cushing and most MEN1-associated thymic disease.
  locations:
  - preferred_term: thymus
    term:
      id: UBERON:0002370
      label: thymus
  evidence:
  - reference: PMID:30502716
    reference_title: "Carcinoid tumors of the thymus and Cushing's syndrome: Clinicopathologic features and current best evidence regarding the cell of origin of these unusual neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of Masaoka stage IV was higher (p < 0.0001) in patients with
      ATC than TC.
    explanation: >-
      Directly supports higher-stage presentation of atypical carcinoid relative
      to typical carcinoid in a thymic carcinoid series.
  - reference: PMID:40328381
    reference_title: "Characterization, Prognosis, and Treatment of Patients With Locally Advanced or Metastatic Thymic Neuroendocrine Tumor: A Retrospective Study of the French GTE, ENDOCAN RENATEN, and RYTHMIC Networks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NET G2 atypical carcinoids in 31 patients (48%), 20 patients (31%) with NET
      G3 highly proliferative atypical carcinoids
    explanation: >-
      The French national-network series shows atypical carcinoid (G2 plus highly
      proliferative G3) accounting for about 79% of advanced thymic NET.
- name: LCNEC
  display_name: Thymic large cell neuroendocrine carcinoma
  subtype_term:
    preferred_term: thymic large cell neuroendocrine carcinoma
    term:
      id: MONDO:0003047
      label: thymic large cell neuroendocrine carcinoma
  description: >-
    Poorly differentiated, non-small-cell high-grade thymic neuroendocrine
    carcinoma with a high mitotic rate and almost invariable necrosis. Behaves
    aggressively; can arise in MEN1 as well as sporadically.
  locations:
  - preferred_term: thymus
    term:
      id: UBERON:0002370
      label: thymus
  evidence:
  - reference: PMID:23110006
    reference_title: "Clinicopathological analysis of 21 thymic neuroendocrine tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All the patients (3/3) with large cell NEC (3/3) and 16.7% (3/18) of those
      with AC died of tumor progression.
    explanation: >-
      Supports the markedly worse outcome of thymic large cell neuroendocrine
      carcinoma relative to atypical carcinoid in the same series.
  - reference: PMID:35696052
    reference_title: "Thymic neuroendocrine tumors in patients with multiple endocrine neoplasia type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One patient had a largely necrotic main tumor with very few mitoses and
      another nodule with 25 mitoses per 2 mm2, qualifying for the 2021 WHO
      diagnosis of large cell neuroendocrine carcinoma (LCNEC).
    explanation: >-
      Documents LCNEC occurring within a MEN1 thymic neuroendocrine tumor cohort.
- name: Small cell carcinoma

discussions:
- discussion_id: gap_tnec_population_incidence_by_grade
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the actual population incidence of thymic neuroendocrine carcinoma,
    separated from thymoma and conventional thymic carcinoma and stratified by WHO
    grade?
  rationale: >-
    Registry analyses report thymic "cancer" incidence per 100,000 but do not break
    out the neuroendocrine arm, and the largest dedicated series accrue only tens to
    low hundreds of patients across multi-decade windows. Without a grade-stratified
    denominator the prevalence block cannot carry a defensible general-population
    rate, and survival estimates that pool typical carcinoid with high-grade
    neuroendocrine carcinoma are systematically misleading - the published 5-year
    figures in this entry range from 53% to 85% largely because of differing grade
    mixes.
  attaches_to:
  - pathophysiology#Neuroendocrine Clonal Expansion in the Thymus
  proposed_experiments:
  - experiment_id: exp_tnec_multiregistry_incidence
    name: Pooled multi-registry grade-stratified incidence analysis
    description: >-
      Pool SEER with national thymic/NET networks (RYTHMIC, ENDOCAN-RENATEN and
      equivalents) under central pathology review, reporting age-standardised
      incidence separately for typical carcinoid, atypical carcinoid, large cell
      neuroendocrine carcinoma and small cell carcinoma of the thymus.
    supporting_outcome:
    - >-
      A grade-stratified per-100,000 incidence that can populate the
      general-population prevalence record with numeric bounds.
    decision_criterion: >-
      Sufficient centrally reviewed cases per grade to estimate incidence with
      confidence intervals excluding zero.
- discussion_id: gap_tnec_cell_of_origin_and_menin_sufficiency
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the thymic neuroendocrine cell of origin proposed on immunohistochemical
    grounds - a normal thymic ACTH/CRH-immunoreactive cell - actually give rise to
    thymic neuroendocrine carcinoma, and is menin loss in that cell sufficient for
    transformation?
  rationale: >-
    The cell-of-origin claim currently rests on the observation that non-neoplastic
    thymus contains scattered ACTH- and CRH-immunoreactive cells and that tumors
    from Cushing patients stain more strongly for both. That is a correlational
    immunohistochemical inference, not lineage tracing. No validated mouse model,
    organoid, patient-derived xenograft or canonical cell line for thymic
    neuroendocrine carcinoma was identified in the deep-research sweep, so neither
    the cell of origin nor the sufficiency of menin loss has been tested
    experimentally.
  attaches_to:
  - pathophysiology#Menin Tumor Suppressor Loss
  - pathophysiology#Ectopic Corticotropin and CRH Secretion
  evidence:
  - reference: PMID:30502716
    reference_title: "Carcinoid tumors of the thymus and Cushing's syndrome: Clinicopathologic features and current best evidence regarding the cell of origin of these unusual neoplasms."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The thymus contains CRH and ACTH immunoreactive cells that are probably the
      origin of thymic NET.
    explanation: >-
      The hedged wording ("probably the origin") is itself the evidence that the
      cell of origin remains an inference rather than an established fact.
  proposed_experiments:
  - experiment_id: exp_tnec_thymic_ne_precursor_atlas
    name: Single-cell and spatial atlas of the putative thymic neuroendocrine precursor
    description: >-
      Profile non-neoplastic human thymus by single-cell and spatial transcriptomics
      to define the putative neuroendocrine precursor population, and match its
      signature against thymic neuroendocrine carcinoma tumor transcriptomes.
    supporting_outcome:
    - >-
      A transcriptional lineage relationship between a defined normal thymic
      neuroendocrine population and the tumor.
  - experiment_id: exp_tnec_conditional_men1_mouse
    name: Thymic-epithelial-restricted conditional Men1 inactivation
    description: >-
      Conditionally inactivate Men1 in a thymic-epithelial-lineage-restricted mouse
      model to test whether menin loss alone is sufficient to generate thymic
      neuroendocrine tumors.
    supporting_outcome:
    - >-
      Menin loss as a sufficient initiating lesion in the thymic epithelial lineage.
    refuting_outcome:
    - >-
      Absence of thymic tumors would indicate that additional cooperating lesions
      (for example RB-axis loss) are required.
- discussion_id: gap_tnec_systemic_therapy_extrapolation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is any systemic therapy for advanced thymic neuroendocrine carcinoma supported
    by thymus-specific prospective evidence rather than extrapolation from pulmonary
    and gastroenteropancreatic neuroendocrine neoplasms?
  rationale: >-
    Every systemic option curated in this entry - platinum-etoposide, everolimus,
    temozolomide/CAPTEM, somatostatin analogues, PRRT - is recommended by
    extrapolation. The one prospective study identified (NCT06121271) enrols thymic
    NET only as one of several unlicensed indications. Because thymic neuroendocrine
    neoplasms carry a mutational profile distinct from both thymic carcinoma and
    pulmonary NET (MEN1/MLL2/APC/RB1/TSC2 rather than CDKN2A/TP53), and because they
    are PD-L1-negative unlike the rest of the thymic epithelial family, the
    assumption that efficacy transfers is not safe.
  attaches_to:
  - pathophysiology#RB-Axis Tumor Suppressor Loss
  - pathophysiology#Somatostatin Receptor Expression
  proposed_experiments:
  - experiment_id: exp_tnec_registry_embedded_prospective_cohorts
    name: Registry-embedded prospective systemic-therapy cohorts
    description: >-
      Basket or registry-embedded prospective cohorts within national thymic/NET
      networks reporting objective response and progression-free survival separately
      by WHO grade for platinum-etoposide, everolimus, CAPTEM, somatostatin
      analogues and PRRT.
    supporting_outcome:
    - >-
      Grade-specific thymus-native efficacy estimates that would replace the current
      extrapolated recommendations.

- name: Control of hypercortisolism
  therapeutic_modality: OTHER
  action_category: THERAPEUTIC
  context: Ectopic Cushing syndrome subset
  target_mechanisms:
  - target: ACTH-Dependent Hypercortisolism
    treatment_effect: INHIBITS
    description: >-
      Steroidogenesis inhibition, glucocorticoid-receptor blockade or bilateral
      adrenalectomy interrupts the cortisol arm downstream of tumoral ACTH, and
      resection of the primary removes the ACTH source itself.
  description: >-
    In the functional (ectopic-ACTH) subset, urgent control of hypercortisolism is
    a management priority independent of tumor-directed therapy, because severe
    hypercortisolism causes hypokalaemia, hyperglycaemia, thromboembolism and
    life-threatening opportunistic infection. Options include steroidogenesis
    inhibitors, glucocorticoid-receptor blockade and, where the tumor is not
    controllable, bilateral adrenalectomy. Resection of the thymic primary resolves
    the syndrome when the tumor is resectable.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:30502716
    reference_title: "Carcinoid tumors of the thymus and Cushing's syndrome: Clinicopathologic features and current best evidence regarding the cell of origin of these unusual neoplasms."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four (36.4%) of the 11 patients had CS.
    explanation: >-
      Establishes the frequency of the Cushing syndrome that this supportive
      management addresses. Marked PARTIAL because the source characterises the
      syndrome rather than evaluating its treatment.
  - reference: PMID:35690804
    reference_title: "Successful resolution of ectopic Cushing syndrome by minimally invasive thoracoscopic resection of the neuroendocrine tumor of the thymus: a rare case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      following surgery, her blood pressure returned to normal, and the
      hypernatremia/hypopotassemia resolved
    explanation: >-
      Documents resolution of the hypercortisolism-driven hypertension and
      hypokalaemia after resection of the thymic neuroendocrine primary, supporting
      tumor removal as the definitive control of the hormonal syndrome.

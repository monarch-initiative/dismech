name: Thymic Neuroendocrine Carcinoma
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Thymic neuroendocrine carcinoma (thymic neuroendocrine neoplasm, historically
  "thymic carcinoid") is an ultra-rare thymic epithelial malignancy of the
  prevascular (anterior) mediastinum that shows neuroendocrine morphology and
  expresses neuroendocrine markers (chromogranin A, synaptophysin). It spans a
  graded spectrum from well-differentiated typical carcinoid through atypical
  carcinoid to poorly differentiated large cell neuroendocrine carcinoma and
  small cell carcinoma of the thymus. Three features distinguish it from the two
  other thymic epithelial tumor families curated separately in dismech: (1) a
  strong association with germline MEN1 loss - roughly a quarter to a third of
  cases arise in multiple endocrine neoplasia type 1, where thymic disease is a
  leading cause of syndrome-related mortality; (2) functional endocrine
  paraneoplasia, most characteristically ectopic ACTH/CRH secretion producing
  Cushing syndrome; and (3) a marked male predominance. Unlike thymoma, it does
  not carry the classic thymoma autoimmune syndromes (myasthenia gravis, pure
  red cell aplasia); and unlike thymic squamous cell carcinoma it lacks the
  CDKN2A/TP53-dominant mutational profile, being instead enriched for MEN1, MLL2
  (KMT2D), APC, RB1 and TSC2 alterations. Behaviour is aggressive relative to thymoma, with frequent
  nodal, osseous, pulmonary and pleural metastasis and late recurrence even after
  complete resection.

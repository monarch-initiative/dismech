- name: Ki-67 proliferation index
  biomarker_term:
    preferred_term: Ki-67 Labeling Index
    term:
      id: NCIT:C157250
      label: Ki-67 Labeling Index
  presence: present
  notes: >-
    Ki-67 labeling index quantifies proliferative activity and is used alongside
    mitotic count for grading. In thymic carcinoid even a low Ki-67 threshold has
    prognostic weight.
  evidence:
  - reference: PMID:33243039
    reference_title: "Typical and Atypical Carcinoid Tumors of the Mediastinum: A Biomarker Analysis of 27 Cases With Clinical Correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ki-67 expression ≥1% associated with DoD (P = .003) and death within 5 years
      (P = .031).
    explanation: >-
      Supports Ki-67 labeling index as a prognostic biomarker in thymic carcinoid.
- name: Plasma adrenocorticotropic hormone
  biomarker_term:
    preferred_term: Adrenocorticotropic Hormone Measurement
    term:
      id: NCIT:C74780
      label: Adrenocorticotropic Hormone Measurement
  presence: elevated
  context: Ectopic Cushing syndrome subset
  notes: >-
    In the functional subset, plasma ACTH is inappropriately normal or elevated in
    the face of hypercortisolism (ACTH-dependent Cushing syndrome). Localising the
    source to an ectopic thymic tumor rather than a pituitary corticotroph adenoma
    requires dynamic testing (high-dose dexamethasone suppression, CRH stimulation,
    inferior petrosal sinus sampling) plus cross-sectional and
    somatostatin-receptor imaging of the mediastinum. No thymic-NET-specific
    reference interval exists, so none is curated.
  evidence:
  - reference: PMID:30502716
    reference_title: "Carcinoid tumors of the thymus and Cushing's syndrome: Clinicopathologic features and current best evidence regarding the cell of origin of these unusual neoplasms."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thymic NET with CS exhibited stronger immunoreactivity for ACTH and CRH than
      those without CS.
    explanation: >-
      Supports tumoral ACTH production as the source of the ACTH-dependent
      syndrome. Marked PARTIAL because the study measures tumor immunoreactivity
      rather than plasma ACTH concentration.
  - reference: PMID:35690804
    reference_title: "Successful resolution of ectopic Cushing syndrome by minimally invasive thoracoscopic resection of the neuroendocrine tumor of the thymus: a rare case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The levels of the hormones ACTH, aldosterone, and renin were determined to be
      281 pg/mL, 3.0 ng/dL, and 2.1 pg/mL, respectively.
    explanation: >-
      Reports the markedly elevated plasma ACTH concentration in a patient with a
      thymic carcinoid causing ectopic ACTH-dependent Cushing syndrome.
- name: Serum cortisol
  biomarker_term:
    preferred_term: Cortisol Measurement
    term:
      id: NCIT:C74781
      label: Cortisol Measurement
  presence: elevated
  context: Ectopic Cushing syndrome subset
  notes: >-
    Hypercortisolism is confirmed biochemically before localisation (elevated
    late-night salivary cortisol, elevated 24-hour urinary free cortisol, failure of
    low-dose dexamethasone suppression). Reference intervals are deliberately not
    curated here because cortisol assays are strongly method- and
    time-of-day-dependent and no thymic-NET-specific interval exists.
  evidence:
  - reference: PMID:40328381
    reference_title: "Characterization, Prognosis, and Treatment of Patients With Locally Advanced or Metastatic Thymic Neuroendocrine Tumor: A Retrospective Study of the French GTE, ENDOCAN RENATEN, and RYTHMIC Networks."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      11 patients (15%) with ectopic Cushing syndrome
    explanation: >-
      Establishes the clinical hypercortisolism syndrome in 15% of advanced thymic
      NET. Marked PARTIAL because the cohort reports the syndrome rather than
      cortisol concentrations.
  - reference: PMID:35690804
    reference_title: "Successful resolution of ectopic Cushing syndrome by minimally invasive thoracoscopic resection of the neuroendocrine tumor of the thymus: a rare case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cortisol levels increased in the morning, reaching 47.7 ug/dL.
    explanation: >-
      Reports the elevated morning serum cortisol in a thymic carcinoid causing
      ectopic ACTH-dependent Cushing syndrome.
- name: Somatostatin receptor 2 expression
  biomarker_term:
    preferred_term: Somatostatin Receptor Type 2
    term:
      id: NCIT:C17922
      label: Somatostatin Receptor Type 2
  presence: variable
  specificity: >-
    Predictive rather than diagnostic - membranous SSTR2 expression determines
    DOTATATE imaging avidity and eligibility for somatostatin-analogue therapy and
    peptide receptor radionuclide therapy.
  notes: >-
    Expression is present in a minority-to-majority of thymic epithelial tumors
    depending on histology, and high-level expression associates with shorter
    recurrence/metastasis-free survival.
  evidence:
  - reference: PMID:35198446
    reference_title: "Correlation of Somatostatin Receptor 2 Expression, 68Ga-DOTATATE PET Scan and Octreotide Treatment in Thymic Epithelial Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SSTR2 expression was identified in 29 (of 80, 36.3%) TET including 2/2 (100%)
      small cell carcinomas, 2/5 (40.0%) atypical carcinoid tumors
    explanation: >-
      Quantifies SSTR2 expression across thymic epithelial tumor histologies
      including the neuroendocrine subtypes.
environmental:
- name: Tobacco smoking
  presence: risk factor
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  description: >-
    Smoking is the only environmental exposure with an asserted link to carcinoid
    risk in the MEN1 setting, and it is the stated basis for targeting prophylactic
    thymectomy at male smokers. The association is not firmly quantified for thymic
    neuroendocrine carcinoma specifically, and it is contested: a referral-centre
    MEN1 thymic-carcinoid series found that two thirds of its patients were
    non-smokers. It is therefore curated as a probable but unsettled risk factor,
    and it is a plausible partial confounder of the male predominance recorded in
    the epidemiology section rather than a proven one.
  effect: Increased risk of carcinoid tumor development
  evidence:
  - reference: PMID:20301710
    reference_title: "Multiple Endocrine Neoplasia Type 1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Smoking increases the risk of carcinoid tumors.
    explanation: >-
      GeneReviews Agents/Circumstances to Avoid guidance for MEN1 names smoking as a
      carcinoid risk factor. Evidence source is OTHER because GeneReviews is an
      expert-curated review.
  - reference: PMID:27311764
    reference_title: "Clinical Features, Treatments, and Outcomes of Patients with Thymic Carcinoids and Multiple Endocrine Neoplasia Type 1 Syndrome at MD Anderson Cancer Center."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The few published reports associate these tumors with male sex and smoking.
    explanation: >-
      Records the historical male-sex-and-smoking association. Marked PARTIAL because
      the same paper immediately qualifies it (see the refuting item below).
  - reference: PMID:27311764
    reference_title: "Clinical Features, Treatments, and Outcomes of Patients with Thymic Carcinoids and Multiple Endocrine Neoplasia Type 1 Syndrome at MD Anderson Cancer Center."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six patients were non-smokers (67 %).
    explanation: >-
      In a 9-patient MEN1 thymic-carcinoid series two thirds of patients were
      non-smokers, arguing against smoking as a necessary or dominant risk factor
      and against using smoking status to gate surveillance.
genetic:
- name: MEN1 (germline)
  gene_term:
    preferred_term: MEN1
    term:
      id: hgnc:7010
      label: MEN1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Germline loss-of-function variants in MEN1 cause multiple endocrine neoplasia
    type 1, in which thymic neuroendocrine tumors are an uncommon but
    disproportionately lethal manifestation. Thymic carcinoids occur in 1-5% of
    MEN1 patients; conversely a quarter to a third of thymic neuroendocrine
    neoplasms arise on a MEN1 background.
  features: >-
    Both truncating point variants and whole-exon copy-number variants are
    represented; no thymic-specific genotype-phenotype correlation has been
    established.
  case_fractions:
  - population: French national advanced thymic NET cohort (GTE / ENDOCAN RENATEN / RYTHMIC)
    case_fraction_percent: 34.0
    cohort_size: 74
    notes: >-
      Proportion of patients with locally advanced or metastatic thymic NET who
      carried the MEN1 inherited syndrome.
    evidence:
    - reference: PMID:40328381
      reference_title: "Characterization, Prognosis, and Treatment of Patients With Locally Advanced or Metastatic Thymic Neuroendocrine Tumor: A Retrospective Study of the French GTE, ENDOCAN RENATEN, and RYTHMIC Networks."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        multiple endocrine neoplasia type 1 inherited syndrome in 25 patients (34%)
      explanation: >-
        Directly quantifies the MEN1 share of an advanced thymic NET cohort.
  inheritance:
  - name: MEN1 autosomal dominant predisposition
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      MEN1 syndrome is inherited in an autosomal dominant manner; the thymic tumor
      itself arises after somatic loss of the second allele.
  evidence:
  - reference: PMID:27311764
    reference_title: "Clinical Features, Treatments, and Outcomes of Patients with Thymic Carcinoids and Multiple Endocrine Neoplasia Type 1 Syndrome at MD Anderson Cancer Center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thymic carcinoids are rare neuroendocrine tumors that occur in 1-5 % of
      patients with multiple endocrine neoplasia type 1 (MEN1) and are a major
      cause of morbidity and mortality.
    explanation: >-
      Establishes the MEN1-thymic carcinoid association and its mortality impact.
  - reference: PMID:27311764
    reference_title: "Clinical Features, Treatments, and Outcomes of Patients with Thymic Carcinoids and Multiple Endocrine Neoplasia Type 1 Syndrome at MD Anderson Cancer Center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five patients had MEN1 genetic testing, and the genotypes of affected
      individuals were p.W341X, c.275_286delGCTTCACCGCCC, p.R98X,
      c.1350+(1_11)del11, and partial duplication of exons 9 and 10.
    explanation: >-
      Documents the germline MEN1 variant spectrum in patients with thymic
      carcinoid, spanning nonsense, frameshift, splice and copy-number variants.
  - reference: PMID:20301710
    reference_title: "Multiple Endocrine Neoplasia Type 1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The molecular diagnosis can be established by identification of a
      heterozygous pathogenic variant in MEN1 on molecular genetic testing.
    explanation: >-
      GeneReviews establishes germline MEN1 testing as the molecular basis of MEN1
      diagnosis, the predisposition context for thymic neuroendocrine tumors.
      Evidence source is OTHER because GeneReviews is an expert-curated review.
- name: MEN1 (somatic)
  gene_term:

- name: Somatostatin analogue therapy
  therapeutic_modality: PEPTIDE
  action_category: THERAPEUTIC
  target_mechanisms:
  - target: Somatostatin Receptor Expression
    treatment_effect: ACTIVATES
    description: >-
      Octreotide and lanreotide are SSTR2 agonists: they engage the receptor the
      tumor expresses, suppressing hormone secretion and exerting an
      antiproliferative effect.
  - target: Ectopic Corticotropin and CRH Secretion
    treatment_effect: INHIBITS
    description: >-
      SSTR2 agonism suppresses the autonomous peptide-hormone secretion driving the
      paraneoplastic syndrome.
  description: >-
    Long-acting somatostatin analogues (octreotide LAR, lanreotide) are used in
    SSTR2-expressing, DOTATATE-avid thymic neuroendocrine tumors both to control
    hormone hypersecretion and for antiproliferative effect. Patient selection is
    driven by SSTR2 immunohistochemistry and somatostatin-receptor PET, which
    correlate well with one another in thymic epithelial tumors.

pathophysiology:
- name: Menin Tumor Suppressor Loss
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Biallelic inactivation of MEN1, which encodes the chromatin-adaptor tumor
    suppressor menin, is the best-established initiating lesion of thymic
    neuroendocrine neoplasia. In multiple endocrine neoplasia type 1 a germline
    loss-of-function MEN1 variant is followed by somatic loss of the remaining
    allele in the thymic precursor; MEN1 is also the top-ranked somatically
    altered gene in thymic neuroendocrine neoplasms overall. Roughly a quarter to
    a third of thymic neuroendocrine neoplasms arise on a MEN1 background, and
    thymic disease is a disproportionate contributor to MEN1 mortality.
  genes:
  - preferred_term: MEN1
    term:
      id: hgnc:7010
      label: MEN1
  locations:
  - preferred_term: thymus
    term:
      id: UBERON:0002370
      label: thymus
  cell_types:
  - preferred_term: thymic epithelial cell with neuroendocrine differentiation
    term:
      id: CL:0002293
      label: epithelial cell of thymus
  evidence:
  - reference: PMID:40068632
    reference_title: "A Review for the Clinician: Classifications, Genetics, and Treatment for Neuroendocrine Neoplasms of the Thymus (Thymic Carcinoids)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      About 25% of the tumors are related to multiple endocrine neoplasia type I
      (MEN-1), where they contribute significantly to mortality.
    explanation: >-
      Clinical review quantifying the MEN1 fraction of thymic neuroendocrine
      neoplasms and its mortality impact. Evidence source is OTHER because this is
      a narrative review.
  - reference: PMID:37749819
    reference_title: "Genetic insights into thymic carcinomas and thymic neuroendocrine neoplasms denote prognosis signatures and pathways."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      those in TNENs were in MEN1, MLL2, APC, RB1
    explanation: >-
      Targeted panel sequencing of 15 thymic neuroendocrine neoplasms ranks MEN1
      as the most frequently altered gene, supporting menin loss as the dominant
      molecular lesion of this tumor family.
  downstream:
  - target: Neuroendocrine Clonal Expansion in the Thymus
    description: >-
      Loss of menin-dependent transcriptional restraint permits clonal outgrowth
      of a thymic epithelial cell with neuroendocrine differentiation.
- name: RB-Axis Tumor Suppressor Loss
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "evading_growth_suppressors#Tumor Suppressor Inactivation"
  description: >-
    RB1 is among the top-ranked somatically altered genes in thymic neuroendocrine
    neoplasms. Loss of the RB axis removes the antiproliferative brake that gates
    G1/S transit - the conserved hallmark route modeled in the
    evading_growth_suppressors module. This node is the entry point for the
    high-grade (large cell neuroendocrine carcinoma and small cell) end of the
    spectrum, where the classic poorly differentiated neuroendocrine RB1/TP53-loss
    biology applies.
  genes:
  - preferred_term: RB1
    term:
      id: hgnc:9884
      label: RB1
  biological_processes:
  - preferred_term: regulation of cell cycle
    term:
      id: GO:0051726
      label: regulation of cell cycle
    modifier: ABNORMAL
  evidence:
  - reference: PMID:37749819
    reference_title: "Genetic insights into thymic carcinomas and thymic neuroendocrine neoplasms denote prognosis signatures and pathways."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      those in TNENs were in MEN1, MLL2, APC, RB1 , and TSC2 .
    explanation: >-
      Panel sequencing of 15 thymic neuroendocrine neoplasms ranks this gene among
      the top clinically relevant genomic alterations in the tumor family.
  - reference: PMID:37749819
    reference_title: "Genetic insights into thymic carcinomas and thymic neuroendocrine neoplasms denote prognosis signatures and pathways."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further investigation found that the prognosis-related genes were focused on
      signal pathways of cell cycle control, chromatin remodeling/DNA methylation
    explanation: >-
      Supports cell-cycle control as one of the pathways in which the
      prognostically important thymic malignancy lesions concentrate.
  notes: >-
    Conformance caveat. The conforms_to link is asserted at the module's trigger
    node on the strength of thymus-specific panel-sequencing data showing recurrent
    RB1 alteration - RB1 is squarely inside the module's RB/p53-axis scope. The
    other recurrently altered thymic neuroendocrine tumor suppressors (KMT2D, APC,
    TSC2) are deliberately modeled as separate nodes because they are not RB/p53
    axis lesions. Downstream checkpoint-loss mechanics in thymic neuroendocrine
    carcinoma specifically have not been dissected experimentally and are
    extrapolated from pulmonary and extrapulmonary high-grade neuroendocrine
    carcinoma; the disease-specific edge is therefore not asserted beyond the
    proliferation node.
  downstream:
  - target: Neuroendocrine Clonal Expansion in the Thymus
    description: >-
      Loss of cell-cycle-checkpoint control permits unrestrained proliferation of
      the transformed thymic neuroendocrine clone.
- name: Chromatin Regulator Loss
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    MLL2 (KMT2D), a histone H3K4 methyltransferase, and APC are recurrently
    altered in thymic neuroendocrine neoplasms, and the prognostically important
    lesions in thymic malignancy concentrate in chromatin-remodelling/DNA-methylation
    pathways. This is mechanistically congruent with the chromatin-adaptor function
    of menin, and is modeled separately from the RB axis because H3K4-methylation
    and Wnt lesions are not RB/p53-axis tumor-suppressor inactivation.

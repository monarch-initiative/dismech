histopathology:
- name: Neuroendocrine architecture with neuroendocrine marker expression
  finding_term:
    preferred_term: neuroendocrine differentiation on immunohistochemistry
    term:
      id: NCIT:C43574
      label: Neuroendocrine Differentiation
  frequency: OBLIGATE
  diagnostic: true
  description: >-
    Diagnosis requires neuroendocrine morphology (organoid nesting, trabeculae,
    rosettes; or sheets with high-grade cytology) together with
    immunohistochemical confirmation of neuroendocrine differentiation.
    Chromogranin A and synaptophysin are positive in the large majority of cases,
    and pancytokeratin positivity confirms the epithelial lineage that separates
    thymic neuroendocrine carcinoma from mediastinal paraganglioma.
  evidence:
  - reference: PMID:25294372
    reference_title: "Thymic neuroendocrine tumors (paraganglioma and carcinoid tumors): a comparative immunohistochemical study of 46 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chromogranin A and synaptophysin were expressed in 92% and 88% of cases,
      respectively, and TTF-1 in 4 (17%) of 24 cases.
    explanation: >-
      Quantifies neuroendocrine marker expression across 24 thymic neuroendocrine
      carcinomas.
- name: Mitotic count and necrosis grading
  finding_term:
    preferred_term: WHO neuroendocrine tumor grade (mitotic count and necrosis)
    term:
      id: NCIT:C177567
      label: WHO Neuroendocrine Tumor Grade
  diagnostic: true
  description: >-
    Grade is assigned from mitotic count per 2 mm2 and the presence of necrosis -
    typical carcinoid (low mitotic count, no necrosis), atypical carcinoid
    (intermediate mitotic count and/or punctate necrosis), and the poorly
    differentiated large cell neuroendocrine carcinoma and small cell carcinoma
    (high mitotic count, extensive necrosis). Mitotic count of 4 or more per 2 mm2
    and tumor size of 5 cm or more are associated with death of disease.
  evidence:
  - reference: PMID:33243039
    reference_title: "Typical and Atypical Carcinoid Tumors of the Mediastinum: A Biomarker Analysis of 27 Cases With Clinical Correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mitotic counts ≥4 per 2 mm2 and tumor size ≥5 cm, associated with death of
      disease (DoD; P = .010 and .016).
    explanation: >-
      Supports mitotic count and tumor size as histopathologic determinants of
      outcome in thymic carcinoid.
  - reference: PMID:35696052
    reference_title: "Thymic neuroendocrine tumors in patients with multiple endocrine neoplasia type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      another nodule with 25 mitoses per 2 mm2, qualifying for the 2021 WHO
      diagnosis of large cell neuroendocrine carcinoma (LCNEC)
    explanation: >-
      Illustrates the mitotic-count threshold that separates high-grade LCNEC from
      atypical carcinoid under the 2021 WHO scheme.
- name: Absent PD-L1 expression
  finding_term:
    preferred_term: lack of expression of PD-L1
    term:
      id: NCIT:C122809
      label: Lack of Expression of PD-L1
  description: >-
    In contrast to thymoma and thymic squamous cell carcinoma, which typically
    show a PD-L1-high phenotype, PD-L1 staining was absent in a series of 27
    thymic typical and atypical carcinoids. This is a mechanistic argument against
    reflexive extrapolation of checkpoint-inhibitor strategies from other thymic
    epithelial tumors to the neuroendocrine arm.
  evidence:
  - reference: PMID:33243039
    reference_title: "Typical and Atypical Carcinoid Tumors of the Mediastinum: A Biomarker Analysis of 27 Cases With Clinical Correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biomarkers stained tumor cases as follows: PDL-1 = 0%, PAX-5 = 0%, MET = 7.4%
    explanation: >-
      Directly supports absent PD-L1 staining across 27 mediastinal (thymic)
      carcinoids.
  - reference: PMID:34695605
    reference_title: "The 2021 WHO Classification of Tumors of the Thymus and Mediastinum: What Is New in Thymic Epithelial, Germ Cell, and Mesenchymal Tumors?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      thymomas and most thymic carcinomas lack currently targetable mutations, have
      an extraordinarily low tumor mutational burden, but typically have a
      programmed death-ligand 1high phenotype
    explanation: >-
      WHO classification overview establishing the PD-L1-high phenotype of thymoma
      and most thymic carcinomas, the contrast against which the PD-L1-negative
      neuroendocrine arm stands out. Evidence source is OTHER because this is a
      classification review.
biochemical:
- name: Chromogranin A expression
  biomarker_term:
    preferred_term: Chromogranin-A
    term:
      id: NCIT:C17284
      label: Chromogranin-A
  presence: present
  specificity: >-
    Sensitive marker of neuroendocrine differentiation in tissue; serum
    chromogranin A is non-specific and is not diagnostic on its own.
  notes: >-
    Immunohistochemical chromogranin A positivity is one of the two conventional
    neuroendocrine markers used to establish neuroendocrine differentiation in a
    thymic epithelial tumor.
  cell_types:
  - preferred_term: thymic neuroendocrine tumor cell
    term:
      id: CL:0000165
      label: neuroendocrine cell
  evidence:
  - reference: PMID:25294372
    reference_title: "Thymic neuroendocrine tumors (paraganglioma and carcinoid tumors): a comparative immunohistochemical study of 46 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chromogranin A and synaptophysin were expressed in 92% and 88% of cases,
      respectively
    explanation: >-
      Quantifies chromogranin A positivity in 92% of thymic neuroendocrine
      carcinomas.
- name: Synaptophysin expression
  biomarker_term:
    preferred_term: Synaptophysin
    term:

    general-population rate.
  evidence:
  - reference: PMID:27311764
    reference_title: "Clinical Features, Treatments, and Outcomes of Patients with Thymic Carcinoids and Multiple Endocrine Neoplasia Type 1 Syndrome at MD Anderson Cancer Center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thymic carcinoids are rare neuroendocrine tumors that occur in 1-5 % of
      patients with multiple endocrine neoplasia type 1 (MEN1)
    explanation: >-
      Source for the 1-5% within-MEN1 lifetime occurrence figure.
- population: Finnish MEN1 patients (three university hospitals, 1985-2019)
  measure_type: LIFETIME_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 3300.0
  notes: >-
    6 of 183 MEN1 patients (3.3%) developed a thymic neuroendocrine tumor;
    converted to 3300 per 100,000 of the MEN1 population. Numerically consistent
    with the 1-5% referral-centre estimate, but NOT an independent confirmation of
    it: five of the six affected patients shared one Finnish founder MEN1 variant
    and descended from a single pedigree, so the rate is inflated by relatedness
    and is not generalisable.
  evidence:
  - reference: PMID:35696052
    reference_title: "Thymic neuroendocrine tumors in patients with multiple endocrine neoplasia type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were six patients (3.3%) with MEN1 and TNET.
    explanation: >-
      Population-based Finnish MEN1 cohort quantifying the within-syndrome
      occurrence of thymic neuroendocrine tumor.
  - reference: PMID:35696052
    reference_title: "Thymic neuroendocrine tumors in patients with multiple endocrine neoplasia type 1."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five of them had the same common gene mutation occurring in Finland. They
      originated from common ancestors encompassing two pairs of brothers from
      sequential generations.
    explanation: >-
      Establishes that five of the six cases derive from one founder pedigree, which
      is why this 3.3% figure must not be treated as an independent population
      estimate. Marked PARTIAL because it qualifies rather than supports the rate.
- population: Worldwide (general population)
  measure_type: POINT_PREVALENCE
  prevalence_class: ULTRA_RARE
  notes: >-
    No reliable general-population incidence or prevalence rate for thymic
    neuroendocrine carcinoma alone was identified. Registry analyses report thymic
    "cancer" incidence per 100,000 without breaking out the neuroendocrine arm, and
    the largest dedicated series accrue only tens to low hundreds of patients over
    multi-decade windows. Orphanet lists no prevalence class for ORPHA:99869. The
    numeric slots are therefore deliberately left empty rather than fabricated.
  evidence:
  - reference: PMID:40068632
    reference_title: "A Review for the Clinician: Classifications, Genetics, and Treatment for Neuroendocrine Neoplasms of the Thymus (Thymic Carcinoids)."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Thymic carcinoids or neuroendocrine neoplasms (t-NEN) are a rare entity with
      a dismal prognosis.
    explanation: >-
      Supports the qualitative rarity band only; the review provides no numeric
      population rate. Evidence source is OTHER because this is a narrative review.
epidemiology:
- name: Male predominance
  description: >-
    Thymic neuroendocrine carcinoma shows a consistent and marked male predominance
    across independent series and registries - approximately 2.7:1 in a French
    national advanced-disease cohort, 25:5 in a Japanese multicentre surgical
    series, 15:6 in a Korean surgical series, and 20:4 in a US immunohistochemical
    series. The excess appears less pronounced in MEN1-associated disease, where
    the underlying autosomal dominant predisposition is sex-neutral.
  evidence:
  - reference: PMID:40328381
    reference_title: "Characterization, Prognosis, and Treatment of Patients With Locally Advanced or Metastatic Thymic Neuroendocrine Tumor: A Retrospective Study of the French GTE, ENDOCAN RENATEN, and RYTHMIC Networks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Main characteristics were as follows: male over female ratio of 2.7
    explanation: >-
      Directly quantifies the male:female ratio in a 74-patient national cohort.
  - reference: PMID:23110006
    reference_title: "Clinicopathological analysis of 21 thymic neuroendocrine tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It showed male predominance (male/female ratio, 15/6) with wide age range
      from 20 to 72 years (mean age, 49 years).
    explanation: >-
      Independent surgical series confirming male predominance and giving the age
      distribution.
  - reference: PMID:20485130
    reference_title: "Thymic neuroendocrine tumors: a SEER database analysis of 160 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      According to our results, thymic NETs afflict males and whites primarily.
    explanation: >-
      Population-based SEER analysis of 160 patients confirming male predominance.
  - reference: PMID:29049806
    reference_title: "Results of treatment for thymic neuroendocrine tumours: multicentre clinicopathological study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirty patients (25 men and 5 women)
    explanation: >-
      Japanese multicentre surgical series with a 5:1 male:female ratio.
  - reference: PMID:27311764
    reference_title: "Clinical Features, Treatments, and Outcomes of Patients with Thymic Carcinoids and Multiple Endocrine Neoplasia Type 1 Syndrome at MD Anderson Cancer Center."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A higher percentage of MEN1-related thymic carcinoids can occur in women and
      in non-smokers than previously reported.
    explanation: >-
      Supports the qualifier that the male excess is attenuated in MEN1-associated
      disease. Marked PARTIAL because the cohort is small (9 patients).
- name: Elevated second-malignancy risk
  description: >-
    Patients with thymic neuroendocrine tumor carry a significantly increased risk
    of a second primary malignancy relative to the general population - an
    age-adjusted second-cancer incidence of 4178.46 per 100,000 persons in the SEER
    thymic NET cohort (19 of 263 patients from 2000-2018), higher than the
    corresponding figure for thymic carcinoma. Age at diagnosis is a significant
    risk factor, and the risk is not attributable to any particular treatment
    modality. This is the epidemiological basis for extending follow-up beyond
    recurrence surveillance to include age-appropriate second-cancer screening.
  evidence:
  - reference: PMID:38227201
    reference_title: "Incidence of second malignancies in patients with thymic carcinoma and thymic neuroendocrine tumor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      1130 patients with thymic carcinoma (73 patients had second malignancies) and
      263 patients with thymic NET (19 patients had second malignancies) from 2000
      to 2018 are included.
    explanation: >-
      Gives the SEER thymic NET denominator and the number developing a second
      malignancy.
  - reference: PMID:38227201
    reference_title: "Incidence of second malignancies in patients with thymic carcinoma and thymic neuroendocrine tumor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The age-adjusted cancer incidence of second malignancies in patients with
      thymic carcinoma is 3058.48 per 100,000 persons (4178.46 per 100,000 persons
      in patients with thymic NET). Age at diagnosis is a significant risk factor
      for the development of second malignancies.
    explanation: >-
      Quantifies the age-adjusted second-cancer incidence in thymic NET and
      identifies age at diagnosis as a risk factor.
  - reference: PMID:38227201
    reference_title: "Incidence of second malignancies in patients with thymic carcinoma and thymic neuroendocrine tumor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The standardized incidence ratio (SIR) and the age-adjusted cancer incidence
      of the thymic carcinoma and thymic NET patients with second malignancies were
      retrospectively calculated by using the Surveillance, Epidemiology, and End
      Results (SEER) database.
    explanation: >-
      Establishes the SEER standardized-incidence-ratio methodology behind the
      second-malignancy risk estimate.
  - reference: PMID:38227201
    reference_title: "Incidence of second malignancies in patients with thymic carcinoma and thymic neuroendocrine tumor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of second malignancies in patients with thymic carcinoma and
      thymic NET is significantly higher than the patients in the normal
      population. The occurrence of second malignancies is not related to the use
      of different treatments.
    explanation: >-
      Supports both the elevated second-malignancy risk and the finding that it is
      not treatment-attributable.
- name: Adult onset with a wide age range
  description: >-
    Presentation is in adulthood, typically in the fourth to fifth decade, with a
    wide reported age range (roughly 20 to 78 years). MEN1-associated cases tend to
    present somewhat earlier than sporadic disease.
  evidence:
  - reference: PMID:23110006
    reference_title: "Clinicopathological analysis of 21 thymic neuroendocrine tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      wide age range from 20 to 72 years (mean age, 49 years)
    explanation: >-
      Gives the age distribution of a thymic neuroendocrine tumor surgical series.
  - reference: PMID:35696052
    reference_title: "Thymic neuroendocrine tumors in patients with multiple endocrine neoplasia type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean age at presentation of TNET was 44.7 ± 11.9 years.
    explanation: >-
      Gives mean age at presentation in the MEN1-associated subset.
progression:
- age_range: adulthood
  notes: >-
    Behaviour is graded. Reported 5- and 10-year overall survival in surgical
    series is 77% and 35% (Japanese multicentre, all grades) and 53% and 18% (a
    mediastinal typical/atypical carcinoid biomarker series). In a modern French
    national cohort restricted to locally advanced or metastatic disease the 5-year
    overall survival was 85%, better than historically reported. Prognosis is
    markedly worse for the poorly differentiated grades - in one series all 3
    patients with large cell neuroendocrine carcinoma died of tumor progression
    versus 17% of atypical carcinoid patients. MEN1-associated disease is
    aggressive, with 5- and 10-year survival of 62.5% and 31.3% in a Finnish cohort
    and 10-year overall survival of 45% at a US referral centre. Late metachronous
    recurrence is characteristic, so surveillance must be prolonged.
  evidence:
  - reference: PMID:29049806
    reference_title: "Results of treatment for thymic neuroendocrine tumours: multicentre clinicopathological study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall survival was 77% after 5 years and 35% after 10 years, whereas
      relapse-free survival was 48% and 29%, and cancer-specific survival was 90%
      and 48%, respectively.
    explanation: >-
      Provides multicentre 5- and 10-year survival for resected thymic
      neuroendocrine tumors.
  - reference: PMID:33243039
    reference_title: "Typical and Atypical Carcinoid Tumors of the Mediastinum: A Biomarker Analysis of 27 Cases With Clinical Correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five- and 10-year-survival rates were 53% and 18%, respectively.
    explanation: >-
      Independent survival estimate for mediastinal typical/atypical carcinoid.
  - reference: PMID:40328381
    reference_title: "Characterization, Prognosis, and Treatment of Patients With Locally Advanced or Metastatic Thymic Neuroendocrine Tumor: A Retrospective Study of the French GTE, ENDOCAN RENATEN, and RYTHMIC Networks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 5-year overall survival was 85%.
    explanation: >-
      Contemporary survival estimate in advanced disease, better than historical
      series.
  - reference: PMID:35696052
    reference_title: "Thymic neuroendocrine tumors in patients with multiple endocrine neoplasia type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our patients, the 5-year survival of the TNET patients was 62.5% and
      10-year survival 31.3%.
    explanation: >-
      Survival in the MEN1-associated subset.
  - reference: PMID:27311764
    reference_title: "Clinical Features, Treatments, and Outcomes of Patients with Thymic Carcinoids and Multiple Endocrine Neoplasia Type 1 Syndrome at MD Anderson Cancer Center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 10-year overall survival rate was 45 %
    explanation: >-
      Referral-centre 10-year overall survival in MEN1-associated thymic carcinoid.
  - reference: PMID:40328381
    reference_title: "Characterization, Prognosis, and Treatment of Patients With Locally Advanced or Metastatic Thymic Neuroendocrine Tumor: A Retrospective Study of the French GTE, ENDOCAN RENATEN, and RYTHMIC Networks."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Univariate analysis on overall survival reveals a trend toward worse prognosis
      in case of female gender and bone metastases and better prognosis for patients
      with multiple endocrine neoplasia type 1.
    explanation: >-
      Counterweight to the historical framing of MEN1-associated thymic disease as
      uniformly more aggressive: in the largest modern advanced-disease cohort MEN1
      status trended toward BETTER overall survival, plausibly reflecting earlier
      detection through syndrome surveillance. Marked PARTIAL because this is an
      unadjusted univariate trend, not a confirmed prognostic effect.
diagnosis:
- name: Contrast-enhanced chest CT
  description: >-
    Cross-sectional imaging of the chest is the primary anatomical study, defining
    the prevascular mediastinal mass, its relationship to great vessels and
    pericardium, and nodal involvement. MRI adds value for vascular, cardiac or
    spinal invasion.
- name: Somatostatin receptor PET/CT (68Ga-DOTATATE) and 18F-FDG PET/CT
  description: >-
    Functional somatostatin-receptor imaging is positive in about three-quarters of
    advanced thymic NET and is used both for staging and to select patients for
    somatostatin-analogue therapy or peptide receptor radionuclide therapy. 18F-FDG
    PET is complementary and is positive in a higher fraction, reflecting the
    proliferative high-grade component.
  evidence:
  - reference: PMID:40328381
    reference_title: "Characterization, Prognosis, and Treatment of Patients With Locally Advanced or Metastatic Thymic Neuroendocrine Tumor: A Retrospective Study of the French GTE, ENDOCAN RENATEN, and RYTHMIC Networks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Positive results for 18F-FDG or somatostain receptor imaging was found in 88%
      or 74% of cases, respectively.
    explanation: >-
      Quantifies the diagnostic yield of both functional imaging modalities in
      advanced thymic NET.
- name: Histopathology with neuroendocrine immunohistochemical panel
  description: >-
    Tissue diagnosis is mandatory. The panel comprises pancytokeratin (epithelial
    lineage), chromogranin A and synaptophysin (neuroendocrine differentiation) and
    Ki-67 (proliferation); GATA-3 and TTF-1 help exclude paraganglioma and
    pulmonary origin respectively. Mitotic count per 2 mm2 and necrosis assign
    grade.
  evidence:
  - reference: PMID:25294372
    reference_title: "Thymic neuroendocrine tumors (paraganglioma and carcinoid tumors): a comparative immunohistochemical study of 46 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we recommend that the workup of neuroendocrine tumors should include not only
      the conventional neuroendocrine markers and pancytokeratin but also other
      markers such as GATA-3 and TTF-1 in order to arrive at a better
      interpretation.
    explanation: >-
      Directly recommends the immunohistochemical panel used to diagnose thymic
      neuroendocrine carcinoma and exclude its mimics.
- name: Germline MEN1 testing and endocrine syndrome screening
  description: >-
    Because a quarter to a third of cases are MEN1-associated, a new diagnosis of
    thymic neuroendocrine carcinoma should prompt germline MEN1 sequencing with
    deletion/duplication analysis plus biochemical screening for
    hyperparathyroidism and pituitary and gastroenteropancreatic tumors -
    especially in younger patients, those with other endocrine tumors, or those
    with a suggestive family history.
  evidence:
  - reference: PMID:20301710
    reference_title: "Multiple Endocrine Neoplasia Type 1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The molecular diagnosis can be established by identification of a
      heterozygous pathogenic variant in MEN1 on molecular genetic testing.
    explanation: >-
      GeneReviews basis for germline MEN1 testing. Evidence source is OTHER because
      GeneReviews is an expert-curated review.
differential_diagnoses:
- name: Thymoma
  disease_term:
    preferred_term: thymoma
    term:
      id: MONDO:0006456
      label: thymoma
  description: >-
    The other major thymic epithelial tumor family and the principal
    anterior-mediastinal differential. Curated separately in
    kb/disorders/Thymoma.yaml; deliberately not duplicated here.
  distinguishing_features:
  - >-
    Thymoma is organotypic and contains immature TdT-positive thymocytes; thymic
    neuroendocrine carcinoma does not.
  - >-
    Thymoma carries the classic autoimmune paraneoplastic syndromes (myasthenia
    gravis, pure red cell aplasia, Good syndrome); thymic neuroendocrine carcinoma
    instead carries the ectopic ACTH/Cushing endocrine syndrome.
  - >-
    Thymoma lacks chromogranin A / synaptophysin neuroendocrine marker expression.
  - >-
    Thymoma typically shows a PD-L1-high phenotype, whereas PD-L1 staining was
    absent across a series of thymic carcinoids.
  evidence:
  - reference: PMID:34695605
    reference_title: "The 2021 WHO Classification of Tumors of the Thymus and Mediastinum: What Is New in Thymic Epithelial, Germ Cell, and Mesenchymal Tumors?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      thymomas and most thymic carcinomas lack currently targetable mutations, have
      an extraordinarily low tumor mutational burden, but typically have a
      programmed death-ligand 1high phenotype
    explanation: >-
      Establishes the PD-L1-high phenotype of thymoma, which distinguishes it from
      the PD-L1-negative thymic carcinoid. Evidence source is OTHER because this is
      a classification review.
- name: Thymic carcinoma (non-neuroendocrine)
  disease_term:
    preferred_term: thymic carcinoma
    term:
      id: MONDO:0006451
      label: thymic carcinoma
  description: >-
    Overtly malignant, non-organotypic thymic epithelial carcinoma, predominantly
    squamous cell type. Curated separately in kb/disorders/Thymic_Carcinoma.yaml;
    deliberately not duplicated here. Note that MONDO places thymic neuroendocrine
    carcinoma beneath thymic carcinoma, so this is a parent entity as well as a
    practical differential.
  distinguishing_features:
  - >-
    Thymic squamous cell carcinoma characteristically coexpresses CD5 and CD117
    (KIT). CD5 is not a feature of the neuroendocrine arm; CD117/KIT is less
    discriminating, since a proportion of neuroendocrine tumors are also
    KIT-positive, so this marker pair should not be used alone.
  - >-
    Genomics differ - conventional thymic carcinoma is dominated by CDKN2A, TP53,
    ASXL1 and CDKN2B alterations, whereas thymic neuroendocrine neoplasms are
    dominated by MEN1, MLL2, APC, RB1 and TSC2.
  - >-
    Neuroendocrine marker expression (chromogranin A, synaptophysin) is required
    for the neuroendocrine designation.
  evidence:
  - reference: PMID:37749819
    reference_title: "Genetic insights into thymic carcinomas and thymic neuroendocrine neoplasms denote prognosis signatures and pathways."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutational profiles between TCs and TNENs were diverse.
    explanation: >-
      Panel sequencing establishing that thymic carcinoma and thymic neuroendocrine
      neoplasms have distinct mutational profiles, supporting their separation as
      entities.
  - reference: PMID:37749819
    reference_title: "Genetic insights into thymic carcinomas and thymic neuroendocrine neoplasms denote prognosis signatures and pathways."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The genetic alterations that ranked highest in TCs were in CDKN2A, TP53,
      ASXL1, CDKN2B, PIK3C2G, PTCH1, and ROS1
    explanation: >-
      Gives the thymic carcinoma gene ranking that contrasts with the
      MEN1/MLL2/APC/RB1 ranking of thymic neuroendocrine neoplasms.
- name: Mediastinal paraganglioma
  disease_term:
    preferred_term: paraganglioma
    term:
      id: MONDO:0000448
      label: paraganglioma
  description: >-
    A neuroendocrine mediastinal neoplasm that mimics thymic carcinoid
    morphologically but is of neural crest rather than epithelial origin.
  distinguishing_features:
  - >-
    Paraganglioma is pancytokeratin-negative and frequently GATA-3-positive;
    thymic neuroendocrine carcinoma is universally pancytokeratin-positive and
    GATA-3-negative.
  evidence:
  - reference: PMID:25294372
    reference_title: "Thymic neuroendocrine tumors (paraganglioma and carcinoid tumors): a comparative immunohistochemical study of 46 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All paragangliomas were universally positive for chromogranin A and
      synaptophysin, but negative for pancytokeratin, TTF-1, and napsin A. GATA-3
      was expressed in 12 (55%) of 22 tumors.
    explanation: >-
      Directly supports the pancytokeratin/GATA-3 immunophenotype that separates
      paraganglioma from thymic neuroendocrine carcinoma.
- name: Metastatic or directly invading pulmonary neuroendocrine carcinoma
  disease_term:
    preferred_term: lung neuroendocrine neoplasm
    term:
      id: MONDO:0005454
      label: lung neuroendocrine neoplasm
  description: >-
    Small cell and large cell neuroendocrine carcinoma of the lung can involve the
    anterior mediastinum by direct extension or nodal metastasis, and is far
    commoner than a primary thymic neuroendocrine carcinoma.
  distinguishing_features:
  - >-
    TTF-1 positivity favours a pulmonary primary; only a minority (about 17%) of
    thymic neuroendocrine carcinomas are TTF-1 positive.
  - >-
    Radiological demonstration of a dominant pulmonary lesion, and absence of a
    thymus-centred prevascular mass, favours pulmonary origin.
  evidence:
  - reference: PMID:25294372
    reference_title: "Thymic neuroendocrine tumors (paraganglioma and carcinoid tumors): a comparative immunohistochemical study of 46 cases."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TTF-1 in 4 (17%) of 24 cases
    explanation: >-
      Quantifies TTF-1 positivity in thymic neuroendocrine carcinoma, which limits
      but does not eliminate TTF-1 as a discriminator from pulmonary primaries.
treatments:
- name: Complete surgical resection (thymectomy)
  therapeutic_modality: SURGERY
  action_category: THERAPEUTIC
  target_mechanisms:
  - target: Mediastinal Mass Effect and Local Invasion
    treatment_effect: INHIBITS
    description: >-
      En-bloc resection removes the primary tumor and its locally invasive front,
      the only intervention that can interrupt the pathograph at its anatomical
      source.
  description: >-
    Macroscopically complete en-bloc resection of the thymus and tumor, with
    resection of involved adjacent structures and systematic mediastinal lymph node
    dissection, is the mainstay of treatment and the only potentially curative
    modality. Complete resection is associated with significantly better overall
    survival.
  treatment_term:
    preferred_term: Thymectomy
    term:
      id: NCIT:C29894
      label: Thymectomy
  evidence:
  - reference: PMID:29049806
    reference_title: "Results of treatment for thymic neuroendocrine tumours: multicentre clinicopathological study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall survival was significantly better in patients who underwent
      macroscopic complete resection (P = 0.010).
    explanation: >-
      Multicentre surgical series supporting complete resection as the key
      determinant of survival.
  - reference: PMID:40068632
    reference_title: "A Review for the Clinician: Classifications, Genetics, and Treatment for Neuroendocrine Neoplasms of the Thymus (Thymic Carcinoids)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mainstay of therapy is surgical resection as it is associated with
      significantly improved long-term survival.
    explanation: >-
      Review confirming surgery as the mainstay of therapy. Evidence source is
      OTHER because this is a narrative review.
- name: Adjuvant radiotherapy after resection
  therapeutic_modality: RADIOTHERAPY
  action_category: THERAPEUTIC
  description: >-
    Postoperative radiotherapy is used selectively for incomplete margins or
    locally advanced disease. The evidence is mixed and weak - in a multicentre
    surgical series receipt of adjuvant therapy was associated with better
    relapse-free survival, but a SEER analysis of 160 patients found no survival
    benefit for radiation delivered as part of primary therapy. Both sides of the
    evidence are curated here so the uncertainty is explicit.
  treatment_term:
    preferred_term: Radiation Therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  evidence:
  - reference: PMID:29049806
    reference_title: "Results of treatment for thymic neuroendocrine tumours: multicentre clinicopathological study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As for relapse-free survival patients, TNM Stage I or II (P = 0.011) and
      received adjuvant therapy patients (P = 0.042) showed good survival rates.
    explanation: >-
      Supports a relapse-free survival association with adjuvant therapy. Marked
      PARTIAL because this is an unadjusted association in a small retrospective
      series and covers adjuvant therapy generally rather than radiotherapy
      specifically.
  - reference: PMID:20485130
    reference_title: "Thymic neuroendocrine tumors: a SEER database analysis of 160 patients."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We did not observe any survival benefit for radiation delivered as a part of
      primary therapy.
    explanation: >-
      SEER analysis finding no survival benefit for primary radiotherapy, the
      counterweight to the single-series adjuvant association above.
- name: Platinum-etoposide chemotherapy
  therapeutic_modality: SMALL_MOLECULE
  action_category: THERAPEUTIC
  target_mechanisms:
  - target: Neuroendocrine Clonal Expansion in the Thymus
    treatment_effect: INHIBITS
    description: >-
      Platinum DNA crosslinking plus topoisomerase II poisoning kills the rapidly
      cycling high-grade neuroendocrine clone, which is why response is best in the
      most proliferative (small cell and large cell) grades.
  description: >-
    For poorly differentiated (small cell and large cell) thymic neuroendocrine
    carcinoma, platinum plus etoposide is the preferred systemic regimen, adopted
    by extrapolation from pulmonary and extrapulmonary high-grade neuroendocrine
    carcinoma. In the French advanced-disease cohort, partial responses were seen
    most often with cytotoxic chemotherapy. No thymus-specific randomised
    comparison exists.
  treatment_term:
    preferred_term: Chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
    - preferred_term: carboplatin
      term:
        id: CHEBI:31355
        label: carboplatin
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
  evidence:
  - reference: PMID:40068632
    reference_title: "A Review for the Clinician: Classifications, Genetics, and Treatment for Neuroendocrine Neoplasms of the Thymus (Thymic Carcinoids)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      for non-resectable and recurring disease, platinum-based chemotherapies are
      preferred in neuroendocrine carcinoma, while everolimus and temozolomide are
      recommended in thymic neuroendocrine tumors.
    explanation: >-
      Review recommending platinum-based chemotherapy for the neuroendocrine
      carcinoma (high-grade) arm. Evidence source is OTHER because this is a
      narrative review.
  - reference: PMID:40328381
    reference_title: "Characterization, Prognosis, and Treatment of Patients With Locally Advanced or Metastatic Thymic Neuroendocrine Tumor: A Retrospective Study of the French GTE, ENDOCAN RENATEN, and RYTHMIC Networks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Partial responses were more frequently observed in patients treated with
      cytotoxic chemotherapy.
    explanation: >-
      National-network cohort reporting cytotoxic chemotherapy as the modality most
      often producing partial responses in advanced thymic NET.
- name: Everolimus
  therapeutic_modality: SMALL_MOLECULE
  action_category: THERAPEUTIC
  target_mechanisms:
  - target: mTOR Pathway Restraint Loss
    treatment_effect: INHIBITS
    description: >-
      Everolimus inhibits mTORC1, restoring the growth-signalling restraint lost
      when TSC2 (tuberin) is inactivated.
  description: >-
    The mTOR inhibitor everolimus is recommended for well-differentiated thymic
    neuroendocrine tumors (as opposed to high-grade neuroendocrine carcinoma), by
    extrapolation from randomised evidence in lung and gastroenteropancreatic NET.
    The recurrent TSC2 alterations found in thymic neuroendocrine neoplasms provide
    a mechanistic rationale for mTOR-pathway targeting in this tumor family.
  treatment_term:

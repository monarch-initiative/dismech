prevalence:
- population: Patients with multiple endocrine neoplasia type 1 (tertiary referral centre)
  measure_type: LIFETIME_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 3000.0
  rate_low: 1000.0
  rate_high: 5000.0
  notes: >-
    1-5% of MEN1 patients develop a thymic carcinoid; converted to 1000-5000 per

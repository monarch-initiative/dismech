- name: Prophylactic transcervical thymectomy in MEN1
  therapeutic_modality: SURGERY
  action_category: THERAPEUTIC
  description: >-
    Routine transcervical thymectomy performed at the time of parathyroidectomy has
    been proposed as prophylaxis against thymic carcinoid in MEN1. It is plausible
    and low-cost when the neck is already open, but the supporting evidence
    consists only of observational studies and case reports and does not establish
    that the procedure prevents thymic carcinoid - transcervical thymectomy often
    leaves residual mediastinal thymic tissue. Curated as a syndrome-specific
    expert strategy, not proven prevention.

    explanation: >-
      Immunohistochemical series of 24 thymic neuroendocrine carcinomas supports
      an epithelial cell of origin with neuroendocrine marker expression.
  - reference: PMID:33243039
    reference_title: "Typical and Atypical Carcinoid Tumors of the Mediastinum: A Biomarker Analysis of 27 Cases With Clinical Correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ki-67 expression ≥1% associated with DoD (P = .003) and death within 5 years

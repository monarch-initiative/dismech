    reference_title: "Results of treatment for thymic neuroendocrine tumours: multicentre clinicopathological study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The examined tumours were classified as typical carcinoid in 7 patients,
      atypical carcinoid in 11 patients, large-cell neuroendocrine carcinoma in 3

    explanation: >-
      Supports proliferative activity (Ki-67 index) as associated with death of
      disease in thymic carcinoid.
  - reference: PMID:33243039
    reference_title: "Typical and Atypical Carcinoid Tumors of the Mediastinum: A Biomarker Analysis of 27 Cases With Clinical Correlation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall ± staining did not associate with survival or grade.

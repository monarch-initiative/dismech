- name: mTOR Pathway Restraint Loss
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    TSC2 is among the recurrently altered genes in thymic neuroendocrine
    neoplasms. TSC2 encodes tuberin, which with hamartin restrains RHEB and hence
    mTORC1; its loss releases that restraint and drives constitutive TOR
    signalling. This node - not the RB axis - is the mechanistic rationale for
    mTOR-inhibitor (everolimus) therapy in this tumor family.
  genes:
  - preferred_term: TSC2
    term:
      id: hgnc:12363
      label: TSC2
  biological_processes:

  notes: >-
    HP:0030692 Brain neoplasm is defined as "A benign or malignant neoplasm that
    arises from or metastasizes to the brain", so it does cover metastatic
    deposits, but it does not distinguish them from a primary brain neoplasm.
    The preferred_term carries the intended specificity.
  evidence:
  - reference: PMID:23110006
    reference_title: "Clinicopathological analysis of 21 thymic neuroendocrine tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common sites of metastasis included lung, lymph node, brain, lumbar spine,
      mediastinum, bone, and liver.
    explanation: >-
      Surgical series listing the brain among the common metastatic sites in
      thymic neuroendocrine tumors.
- category: Constitutional
  name: Weight loss
  description: >-
    Constitutional weight loss occurs as a systemic manifestation of advanced or
    metastatic disease. No thymic-NET-specific frequency is published, so none is
    asserted.
  phenotype_term:
    preferred_term: Weight loss
    term:
      id: HP:0001824
      label: Weight loss
  evidence:
  - reference: PMID:23110006
    reference_title: "Clinicopathological analysis of 21 thymic neuroendocrine tumors."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common sites of metastasis included lung, lymph node, brain, lumbar spine,
      mediastinum, bone, and liver.
    explanation: >-
      Documents the multi-organ metastatic burden that underlies constitutional

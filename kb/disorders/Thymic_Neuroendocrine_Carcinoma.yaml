    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      those in TNENs were in MEN1, MLL2, APC, RB1 , and TSC2 .
    explanation: >-
      Panel sequencing of 15 thymic neuroendocrine neoplasms ranks this gene among
      the top clinically relevant genomic alterations in the tumor family.
  downstream:
  - target: Neuroendocrine Clonal Expansion in the Thymus
    description: >-
      Unrestrained mTORC1 signalling drives the growth and proliferation of the
      transformed thymic neuroendocrine clone.
- name: Neuroendocrine Clonal Expansion in the Thymus
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    A thymic epithelial cell acquires or retains neuroendocrine differentiation
    and expands clonally in the prevascular mediastinum. The resulting neoplastic
    cells are pancytokeratin-positive (confirming epithelial lineage, and
    distinguishing them from paraganglioma) while co-expressing the neuroendocrine
    markers chromogranin A and synaptophysin. Proliferative activity - mitotic
    count and Ki-67 index - grades the lesion and is the marker most consistently
    associated with outcome, although in the same series overall staining for the
    wider biomarker panel did not associate with survival or grade.
  cell_types:
  - preferred_term: thymic neuroendocrine tumor cell
    term:
      id: CL:0000165
      label: neuroendocrine cell
  biological_processes:
  - preferred_term: neuroendocrine cell differentiation
    term:
      id: GO:0061101
      label: neuroendocrine cell differentiation
    modifier: ABNORMAL
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  locations:
  - preferred_term: anterior mediastinum
    term:
      id: UBERON:0008820
      label: anterior mediastinum
  evidence:
  - reference: PMID:25294372
    reference_title: "Thymic neuroendocrine tumors (paraganglioma and carcinoid tumors): a comparative immunohistochemical study of 46 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The thymic neuroendocrine carcinomas (carcinoid tumors) were universally
      positive for pancytokeratin, but negative for GATA-3 and napsin A.
      Chromogranin A and synaptophysin were expressed in 92% and 88% of cases,

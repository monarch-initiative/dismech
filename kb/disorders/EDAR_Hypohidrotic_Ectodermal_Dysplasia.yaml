progression:
- phase: Infancy
  age_range: 0-2 years
  notes: >-
    Physical features of classic HED become obvious during childhood, and
    before environmental temperature modifications are established, affected
    infants and young children experience episodes of hyperthermia due to
    greatly deficient sweating.
  evidence:
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cardinal features of classic HED become obvious during childhood.
    explanation: >-
      Indicates that the cardinal physical features of classic HED typically
      become obvious during childhood rather than at birth.
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sweating, although present, is greatly deficient, leading to episodes of
      hyperthermia until the affected individual or family acquires experience
      with environmental modifications to control temperature.
    explanation: >-
      Documents early-life hyperthermia episodes prior to recognition and
      environmental temperature control.
- phase: Childhood to Adulthood
  age_range: 2 years to adulthood
  notes: >-
    Physical growth and psychomotor development are within normal limits.
    Hypohidrosis, hypotrichosis, and hypodontia persist lifelong, requiring
    staged dental rehabilitation (early dental treatment, bonding of conical
    teeth, replacement of dental prostheses often every 2.5 years during growth,
    and dental implants in older children and adults).
  evidence:
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Physical growth and psychomotor development are otherwise within normal
      limits.
    explanation: >-
      Establishes normal physical growth and psychomotor development in HED.
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early dental treatment; bonding of conical teeth; orthodontics as
      necessary; dental implants in the anterior portion of the mandibular arch
      in older children; replacement of dental prostheses as needed, often
      every 2.5 years; dental implants in adults;
    explanation: >-
      Outlines the longitudinal dental management trajectory across childhood
      and adulthood.
pathophysiology:
- name: EDAR Loss-of-Function Disrupts NF-kB Signaling
  conforms_to: "eda_edar_nfkb_ectodermal_appendage#EDA-EDAR-EDARADD Canonical NF-kappaB Signaling Failure"
  description: >-
    EDAR is a type I transmembrane receptor of the TNF receptor superfamily that
    binds ectodysplasin A (EDA). Upon ligand binding, EDAR recruits the adaptor
    protein EDARADD via its intracellular death domain, which activates the
    NF-kB signaling cascade. Biallelic loss-of-function EDAR mutations (AR)
    prevent ligand binding or adaptor recruitment, abolishing downstream NF-kB
    activation required for ectodermal appendage initiation and morphogenesis.

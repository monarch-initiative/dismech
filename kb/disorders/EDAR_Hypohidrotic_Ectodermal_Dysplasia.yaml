diagnosis:
- name: Clinical Evaluation of Ectodermal Triad
  description: >-
    Clinical recognition after infancy based on the classic ectodermal triad of
    hypotrichosis (sparse scalp and body hair), hypohidrosis (reduced ability to
    sweat with heat intolerance or unexplained febrile episodes), and hypodontia
    or oligodontia with conical teeth, accompanied by characteristic craniofacial
    features (frontal bossing, depressed nasal bridge, periorbital hyperpigmentation).
  diagnosis_term:
    preferred_term: Physical Examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  results: >-
    Demonstration of sparse scalp/body hair, reduced or absent sweating, and
    congenitally missing and conical-crowned teeth.
  evidence:
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classic HED can be diagnosed after infancy based on physical features in
      most affected individuals.
    explanation: >-
      GeneReviews confirms that classic HED is diagnosed clinically after
      infancy based on characteristic physical findings.
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypohidrotic ectodermal dysplasia (HED) is characterized by
      hypotrichosis (sparseness of scalp and body hair), hypohidrosis (reduced
      ability to sweat), and hypodontia (congenital absence of teeth).
    explanation: >-
      Defines the cardinal diagnostic triad evaluated during clinical
      examination.
- name: EDAR Molecular Genetic Testing
  description: >-
    Targeted sequencing or multigene ectodermal dysplasia panel testing (including
    EDA, EDAR, EDARADD, and WNT10A) or exome sequencing to identify biallelic
    pathogenic variants (autosomal recessive HED) or a heterozygous pathogenic
    variant (autosomal dominant HED) in EDAR, which is required to distinguish
    EDAR-related HED from clinically indistinguishable EDA- and EDARADD-related
    forms and to establish the mode of inheritance.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Identification of biallelic pathogenic variants in EDAR (confirming autosomal
    recessive HED2) or a heterozygous pathogenic EDAR variant (confirming autosomal
    dominant HED).
  evidence:
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of a hemizygous EDA pathogenic variant in an affected male
      or biallelic EDAR, EDARADD, or WNT10A pathogenic variants in an affected
      male or female confirms the diagnosis. The diagnosis of mild HED is
      established in a female by identification of a heterozygous EDA, EDAR,
      EDARADD, or WNT10A pathogenic variant. The diagnosis of mild HED is
      established in a male by identification of a heterozygous EDAR, EDARADD,
      or WNT10A pathogenic variant.
    explanation: >-
      Establishes the molecular diagnostic criteria for biallelic and
      heterozygous EDAR pathogenic variants in males and females.
  - reference: PMID:39244550
    reference_title: "Genetic profiling and diagnostic strategies for patients with ectodermal dysplasias in Korea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When conducting molecular diagnostics for ED, opting for targeted
      sequencing of EDA/EDAR mutations is advisable for cases with classical
      symptoms, while WES is deemed an effective strategy for cases in which
      these symptoms are absent.
    explanation: >-
      Supports targeted sequencing of EDA and EDAR as the primary molecular
      diagnostic strategy for patients presenting with classic HED symptoms.
differential_diagnoses:
- name: X-linked Hypohidrotic Ectodermal Dysplasia (EDA-Related)
  description: >-
    Caused by hemizygous (in males) or heterozygous (in females) pathogenic
    variants in EDA (Xq12-q13.1), accounting for 58%-85% of all HED cases.
    Classic autosomal recessive EDAR-related HED produces a pathomorphologic
    phenotype clinically indistinguishable from X-linked EDA-related HED in
    affected males.
  distinguishing_features:
  - X-linked inheritance with full expression in hemizygous males and variable or mosaic expression along Blaschko lines in heterozygous females, whereas autosomal recessive EDAR-related HED affects males and females with equal severity
  - Pathogenic variant in EDA rather than EDAR on molecular genetic testing
  disease_term:
    preferred_term: X-linked hypohidrotic ectodermal dysplasia
    term:
      id: MONDO:0010585
      label: X-linked hypohidrotic ectodermal dysplasia
  evidence:
  - reference: PMID:16435307
    reference_title: "Mutations in EDAR account for one-quarter of non-ED1-related hypohidrotic ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The X-linked form of the disease, caused by mutations in the ED1 gene,
      represents the majority of HED cases. Autosomal-dominant and -recessive
      forms occur occasionally and result from mutations in at least two genes:
      EDAR and EDARADD. These different forms are phenotypically
      indistinguishable.
    explanation: >-
      Demonstrates that EDAR-related HED is clinically indistinguishable from
      X-linked EDA (ED1)-related HED, making it the primary differential
      diagnosis differentiated by inheritance pattern and genetic testing.
- name: EDARADD-Related Hypohidrotic Ectodermal Dysplasia
  description: >-
    Caused by biallelic (autosomal recessive, ED11B; bound here as MONDO:0013983)
    or heterozygous (autosomal dominant, ED11A) pathogenic variants in EDARADD,
    which encodes the intracellular death domain adaptor of EDAR. Shares an
    identical downstream NF-kB signaling defect and clinical triad with
    EDAR-related HED.
  distinguishing_features:
  - Pathogenic variant identified in EDARADD rather than EDAR on molecular genetic testing
  disease_term:
    preferred_term: EDARADD-related hypohidrotic ectodermal dysplasia
    term:
      id: MONDO:0013983
      label: ectodermal dysplasia 11B, hypohidrotic/hair/tooth type, autosomal recessive
  evidence:
  - reference: PMID:16435307
    reference_title: "Mutations in EDAR account for one-quarter of non-ED1-related hypohidrotic ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal-dominant and -recessive forms occur occasionally and result
      from mutations in at least two genes: EDAR and EDARADD. These different
      forms are phenotypically indistinguishable.
    explanation: >-
      Documents that EDARADD mutations cause both autosomal recessive and
      autosomal dominant HED that are phenotypically indistinguishable from
      EDAR-related HED.
  - reference: PMID:20979233
    reference_title: "Only four genes (EDA1, EDAR, EDARADD, and WNT10A) account for 90% of hypohidrotic/anhidrotic ectodermal dysplasia cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although no clinical differences between patients carrying EDA1, EDAR, or
      EDARADD mutations could be identified, patients harboring WNT10A
      mutations displayed distinctive clinical features (marked dental
      phenotype, no facial dysmorphism), helping to decide which gene should be
      first investigated in HED/EDA.
    explanation: >-
      Confirms that EDARADD-related HED cannot be distinguished clinically from
      EDAR-related HED and requires molecular genetic testing for differentiation.
- name: WNT10A-Related Ectodermal Dysplasia (Odonto-Onycho-Dermal Dysplasia)
  description: >-
    Caused by pathogenic variants in WNT10A, which account for 8.8% of
    genetically solved HED probands in the Russian cohort and 16% of HED/EDA
    cases in the French four-gene cohort. WNT10A variants cause a spectrum of
    ectodermal dysplasias—including autosomal recessive odonto-onycho-dermal
    dysplasia (OODD, bound here as MONDO:0009773) and Schöpf-Schulz-Passarge
    syndrome—presenting with overlapping hypodontia/oligodontia, hypohidrosis,
    and hypotrichosis.
  distinguishing_features:
  - Marked dental phenotype (severe oligodontia of permanent dentition) with absence of classic HED craniofacial dysmorphism (frontal bossing, depressed nasal bridge)
  - Pathogenic variants in WNT10A on molecular genetic testing

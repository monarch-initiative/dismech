has_subtypes:
- name: AR
  display_name: Autosomal Recessive HED (HED2)
  description: >-
    Classic autosomal recessive form caused by biallelic loss-of-function
    mutations in EDAR. Phenotype closely resembles X-linked HED (EDA mutations)
    with severe hypohidrosis, oligodontia, and sparse hair. Homozygous or
    compound heterozygous mutations completely abolish EDAR signaling.
  subtype_term:
    preferred_term: autosomal recessive hypohidrotic ectodermal dysplasia
    term:
      id: MONDO:0016619
      label: autosomal recessive hypohidrotic ectodermal dysplasia
- name: AD
  display_name: Autosomal Dominant HED
  description: >-
    Autosomal dominant form caused by heterozygous EDAR mutations, often with
    dominant-negative effects. Phenotype is typically milder than the recessive
    form, with variable expressivity. Dominant mutations cluster in the death
    domain (exon 12) and interfere with EDARADD recruitment.
  subtype_term:
    preferred_term: autosomal dominant hypohidrotic ectodermal dysplasia
    term:
      id: MONDO:0015884
      label: autosomal dominant hypohidrotic ectodermal dysplasia
inheritance:
- name: Autosomal Recessive
  description: >-
    Biallelic loss-of-function variants in EDAR cause autosomal recessive
    hypohidrotic ectodermal dysplasia (HED2), producing a severe classic triad
    indistinguishable from X-linked EDA-related disease. When both parents are
    heterozygous carriers, each sibling of an affected individual has at
    conception a 25% chance of being affected, a 50% chance of being an
    asymptomatic heterozygote, and a 25% chance of inheriting neither familial
    pathogenic variant.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:10431241
    reference_title: "Mutations in the human homologue of mouse dl cause autosomal recessive and dominant hypohidrotic ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We isolated and characterized its human DL homologue, and identified
      mutations in three families displaying recessive inheritance and two
      with dominant inheritance.
    explanation: >-
      Establishes autosomal recessive inheritance of EDAR-related hypohidrotic
      ectodermal dysplasia in human families.
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EDA-related HED is inherited in an X-linked manner. EDAR-, EDARADD-, and
      WNT10A-related HED are inherited in an autosomal recessive or an
      autosomal dominant manner.
    explanation: >-
      GeneReviews confirms autosomal recessive inheritance for EDAR-related HED.
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If both parents are known to be heterozygous for a pathogenic variant,
      each sib of an affected individual has at conception a 25% chance of
      being affected, a 50% chance of being heterozygous, and a 25% chance of
      inheriting neither of the familial pathogenic variants.
    explanation: >-
      GeneReviews genetic counseling section specifies the 25% sibling
      recurrence risk and 50% carrier probability in autosomal recessive HED.
- name: Autosomal Dominant
  description: >-
    Heterozygous pathogenic variants in EDAR, most commonly dominant-negative
    missense or truncating variants in the exon 12 death domain, cause
    autosomal dominant hypohidrotic ectodermal dysplasia with variable,
    typically milder expressivity. Each child of an individual with autosomal
    dominant HED has a 50% chance of inheriting the pathogenic variant.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance

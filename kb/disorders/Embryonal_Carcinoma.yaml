has_subtypes:
- name: Testicular EC
  display_name: Testicular embryonal carcinoma
  subtype_term:
    preferred_term: testicular embryonal carcinoma
    term:
      id: MONDO:0006446
      label: testicular embryonal carcinoma
  description: >-
    Embryonal carcinoma arising in the testis, by far the commonest site. It is a
    GCNIS-derived (type II) germ cell tumour and is usually one component of a mixed
    non-seminomatous germ cell tumour rather than a pure tumour. Diagnosis rests on
    high-grade embryonal-carcinoma-like nuclear morphology supported by an
    OCT3/4-positive, SOX2-positive, CD30-positive, SOX17-negative immunophenotype.
    Management follows non-seminoma pathways: radical inguinal orchiectomy, then
    surveillance, retroperitoneal lymph node dissection or cisplatin-based chemotherapy
    according to stage and risk.
  evidence:
  - reference: PMID:38922953
    reference_title: "Pathogenesis and pathobiology of testicular germ cell tumours: a view from a developmental biological perspective with guidelines for pathological diagnostics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Type II GCT include seminoma, embryonal carcinoma, choriocarcinoma,
      postpubertal-type teratoma and postpubertal-type YST.
    explanation: >-
      Places testicular embryonal carcinoma within the GCNIS-derived type II group of
      testicular germ cell tumours.
- name: Ovarian EC
  display_name: Ovarian embryonal carcinoma
  subtype_term:
    preferred_term: ovarian embryonal carcinoma
    term:
      id: MONDO:0003581
      label: ovarian embryonal carcinoma
  description: >-
    Embryonal carcinoma arising in the ovary. It is one of the rarest malignant ovarian
    germ cell tumours, occurring in girls and young women, and is more often a component
    of a malignant mixed germ cell tumour than a pure tumour. It typically presents as a
    large unilateral solid adnexal mass with beta-hCG and/or AFP elevation.
  evidence:
  - reference: PMID:33142349
    reference_title: "Imaging in gynecological disease (22): clinical and ultrasound characteristics of ovarian embryonal carcinomas, non-gestational choriocarcinomas and malignant mixed germ cell tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      From the International Ovarian Tumor Analysis (IOTA) database, we identified
      patients with a histological diagnosis of ovarian embryonal carcinoma,
      non-gestational choriocarcinoma or malignant mixed germ cell tumor
    explanation: >-
      Establishes ovarian embryonal carcinoma as a distinct, separately diagnosed rare
      malignant ovarian germ cell tumour entity.
- name: CNS EC
  display_name: Embryonal carcinoma of the central nervous system
  subtype_term:
    preferred_term: embryonal carcinoma of the central nervous system
    term:
      id: MONDO:0018843
      label: embryonal carcinoma of the central nervous system
  description: >-
    Intracranial embryonal carcinoma, one of the non-germinomatous germ cell tumour
    (NGGCT) histologies. Intracranial germ cell tumours arise predominantly in the pineal
    and suprasellar regions of children and adolescents and present with raised
    intracranial pressure, visual disturbance and endocrine failure rather than a mass
    lesion at a gonadal site. Unlike germinoma, NGGCT requires intensive chemotherapy,
    resection of residual tumour and high-dose radiotherapy, and its prognosis is more
    guarded.
  evidence:
  - reference: PMID:42115464
    reference_title: "Germinomas and Non-germinomatous Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NGGCTs include embryonal carcinoma, yolk sac tumor, choriocarcinoma, and teratomas
      and often secrete tumor markers like alpha-fetoprotein (AFP) and beta-hCG, which
      guide diagnosis and treatment without biopsy.
    explanation: >-
      Places embryonal carcinoma among the intracranial non-germinomatous germ cell
      tumour histologies and describes their marker-driven diagnosis.
- name: Non-CNS-localized EC
  display_name: Non-central nervous system-localized embryonal carcinoma
  subtype_term:
    preferred_term: non-central nervous system-localized embryonal carcinoma
    term:
      id: MONDO:0017328
      label: non-central nervous system-localized embryonal carcinoma
  description: >-
    Embryonal carcinoma at any site other than the central nervous system. This
    Orphanet-derived concept is defined purely by exclusion of the CNS, so it does not
    partition cleanly against its sibling subtypes here: it properly subsumes both
    Testicular EC (MONDO:0006446) and Ovarian EC (MONDO:0003581), which are the great
    majority of non-CNS disease. What it uniquely adds beyond those two gonadal subtypes
    are the extragonadal midline presentations outside the CNS - most importantly the
    anterior mediastinum, and less often the retroperitoneum and sacrococcygeal region -
    which are thought to arise from primordial germ cells misrouted during embryonic
    migration. Mediastinal disease in particular carries a higher rate of TP53 mutation
    and a worse prognosis than gonadal disease.
  evidence:
  - reference: PMID:26191277
    reference_title: "Extragonadal malignant germ cell tumors: a clinicopathological and immunohistochemical analysis of 48 cases at a single Chinese institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary extragonadal malignant germ cell tumors (EMGCTs) are rare and characterized
      by the location in the midline of the body, including mediastinum, CNS,
      retroperitoneum and coccyx.
    explanation: >-
      Documents the extragonadal midline sites, of which the non-CNS ones define this
      subtype.
prevalence:
- population: Pure embryonal carcinoma among testicular germ cell tumours
  measure_type: POINT_PREVALENCE
  prevalence_class: RARE
  notes: >-
    Pure embryonal carcinoma is uncommon; EC is encountered far more often as a component
    of a post-pubertal mixed germ cell tumour, where it is the most common
    non-seminomatous element. No numeric rate is given here because the published figures
    are component-frequency proportions within surgical series rather than population
    rates.
- population: Children and adolescents with intracranial germ cell tumours
  measure_type: POINT_PREVALENCE
  prevalence_class: RARE
  notes: >-
    Intracranial embryonal carcinoma is a histology within the intracranial NGGCT group;
    intracranial germ cell tumours as a whole are rare and account for up to 20% of
    paediatric germ cell tumours, with a higher incidence in East Asian populations.
  evidence:
  - reference: PMID:42115464
    reference_title: "Germinomas and Non-germinomatous Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intracranial germ cell tumors (iGCTs) are rare neoplasms that predominantly affect
      children and adolescents, accounting for up to 20% of pediatric germ cell tumors
      and showing higher incidence in East Asian populations.
    explanation: >-
      Supports the rarity of the intracranial germ cell tumour group that contains
      intracranial embryonal carcinoma.
pathophysiology:
- name: GCNIS-Derived Germ Cell Transformation
  description: >-
    Post-pubertal embryonal carcinoma is a type II germ cell tumour: it develops from
    germ cell neoplasia in situ (GCNIS), a non-invasive intratubular lesion of arrested
    fetal germ cells that retains embryonic pluripotency factors. Progression from GCNIS
    to an invasive tumour is the initiating event, and the same precursor gives rise to
    seminoma, embryonal carcinoma, choriocarcinoma, yolk sac tumour and post-pubertal
    teratoma - which is why these histologies co-occur in mixed tumours.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: primordial germ cell
    term:
      id: CL:0000670
      label: primordial germ cell
  biological_processes:
  - preferred_term: cell differentiation
    modifier: ABNORMAL
    term:
      id: GO:0030154
      label: cell differentiation
  locations:
  - preferred_term: testis
    term:
      id: UBERON:0000473
      label: testis
  evidence:
  - reference: PMID:38922953
    reference_title: "Pathogenesis and pathobiology of testicular germ cell tumours: a view from a developmental biological perspective with guidelines for pathological diagnostics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Type II GCT develop from a non-invasive germ cell neoplasia in situ (GCNIS) and
      show an isochromosome 12p (i12p) or gain of 12p material as a common and
      characteristic molecular alteration.
    explanation: >-
      Establishes GCNIS as the precursor lesion for the type II germ cell tumours that
      include embryonal carcinoma, and links progression to 12p gain.
  downstream:
  - target: Isochromosome 12p Formation and 12p Gain
    description: >-
      Acquisition of i(12p) or other 12p gain accompanies progression from intratubular
      GCNIS to invasive tumour.
- name: Isochromosome 12p Formation and 12p Gain
  description: >-
    Gain of the short arm of chromosome 12, most often as an isochromosome, is the
    near-universal cytogenetic lesion of GCNIS-derived germ cell tumours including
    embryonal carcinoma. It is thought to be acquired during progression from GCNIS to
    invasive disease and is diagnostically useful for confirming germ cell origin in
    primary and metastatic lesions. 12p carries NANOG, KRAS, CCND2 and LDHB, so the gain
    simultaneously raises the dosage of a pluripotency factor, a mitogenic GTPase, a G1
    cyclin and a glycolytic enzyme. Embryonal carcinoma otherwise has a strikingly quiet
    point-mutation landscape; its genomic instability is chromosomal (aneuploidy) rather
    than a mutator phenotype.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: chromosome organization
    modifier: ABNORMAL
    term:
      id: GO:0051276
      label: chromosome organization

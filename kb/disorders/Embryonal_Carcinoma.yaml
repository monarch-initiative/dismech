- name: Unrestrained Primitive Epithelial Proliferation
  description: >-
    Embryonal carcinoma grows as sheets, glands and pseudopapillae of large, primitive,
    epithelial-appearing cells with amphophilic cytoplasm, indistinct borders,
    overlapping vesicular nuclei with prominent nucleoli, and a very high mitotic rate.
    Areas of geographic (coagulative) necrosis reflect the mismatch between growth rate
    and blood supply.

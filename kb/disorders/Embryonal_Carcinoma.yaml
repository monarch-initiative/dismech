- name: Multilineage Differentiation Into Other Germ Cell Tumour Histologies
  description: >-
    Because EC retains pluripotency it can differentiate along somatic (teratoma) and
    extraembryonic (yolk sac tumour, choriocarcinoma) lineages. This is the mechanistic
    reason EC is the most common component of post-pubertal mixed germ cell tumours and
    only rarely occurs in pure form, and why a mixed tumour's serum marker profile (AFP
    from yolk sac elements, beta-hCG from trophoblastic elements) often reflects
    differentiated progeny rather than the EC component itself.
  biological_scale: CELLULAR

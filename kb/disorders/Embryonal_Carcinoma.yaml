- name: Epigenetic Regulation of the Pluripotency Driver Genes
  description: >-
    Which pluripotency driver panel a GCNIS-derived tumour expresses is set epigenetically
    rather than by mutation of the driver genes themselves. Cytosine methylation of DNA
    and methylation/acetylation of histone 3 lysines regulate expression of these drivers
    between the TGCT subtypes, and this is the layer at which embryonal carcinoma's
    OCT4/SOX2/LIN28/NANOG panel diverges from the OCT4/SOX17/KLF4/MYC panel of seminoma.
    It is therefore the upstream determinant of the SOX2-positive, SOX17-negative
    immunophenotype the entry uses diagnostically, and of the switch in panel that
    accompanies the seminoma-to-EC distinction.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: epigenetic regulation of gene expression
    modifier: ABNORMAL
    term:
      id: GO:0040029
      label: epigenetic regulation of gene expression
  evidence:
  - reference: PMID:36835562
    reference_title: "Epigenetic Regulation of Driver Genes in Testicular Tumorigenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epigenetic mechanisms, such as methylations of cytosines on the DNA string and
      methylations and acetylations of histone 3 lysines, regulate expression of these
      driver genes between the TGCT subtypes.
    explanation: >-
      States directly that epigenetic mechanisms regulate the pluripotency driver genes
      across testicular germ cell tumour subtypes, which is the claim of this node.
  - reference: PMID:36835562
    reference_title: "Epigenetic Regulation of Driver Genes in Testicular Tumorigenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a seminoma subtype expresses an induced pluripotent stem cell (iPSC) panel with four
      upregulated genes, OCT4/POU5F1, SOX17, KLF4, and MYC, and embryonal carcinoma (EC)
      has four upregulated genes, OCT4/POU5F1, SOX2, LIN28, and NANOG
    explanation: >-
      Documents the specific EC-versus-seminoma driver panel difference that the
      epigenetic layer modelled here regulates.
  downstream:
  - target: Retained Embryonic Pluripotency Program
    description: >-
      Epigenetic derepression of the OCT4/SOX2/LIN28/NANOG panel is what establishes and
      maintains the embryonal carcinoma pluripotency state.
- name: Retained Embryonic Pluripotency Program
  description: >-
    The defining molecular feature of embryonal carcinoma is retention of an
    embryonic-stem-cell-like transcriptional programme. EC cells co-express OCT3/4
    (POU5F1), SOX2, NANOG and LIN28; this quartet is sufficient to reprogramme somatic
    cells to induced pluripotency, and EC itself behaves as a malignant pluripotent stem
    cell. The SOX2-positive, SOX17-negative pattern is what distinguishes EC from
    seminoma/germinoma, which shares OCT3/4 but expresses SOX17 instead.
  biological_scale: MOLECULAR
  cell_types:

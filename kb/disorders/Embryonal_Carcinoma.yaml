genetic:
- name: 12p gain (isochromosome 12p)
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    Not a gene-level association: the lesion is arm-level gain of 12p, most often as an
    isochromosome. It is recorded here because it is the defining somatic alteration of
    embryonal carcinoma and is used diagnostically. The 12p genes implicated in its
    effect (NANOG, KRAS, CCND2, LDHB) are attached to the corresponding pathophysiology
    node.
  evidence:
  - reference: PMID:36030288
    reference_title: "Molecular correlates of male germ cell tumors with overgrowth of components resembling somatic malignancies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gains in the short arm of chromosome 12 were seen in 91% of cases, likely
      reflecting the presence of isochromosome 12p.
    explanation: >-
      Quantifies 12p gain in a molecularly profiled male germ cell tumour cohort.
- name: TP53
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  relationship_type: MODIFIER
  variant_origin: SOMATIC
  notes: >-
    TP53 is characteristically wild-type in germ cell tumours, and that is the basis of
    their platinum sensitivity. Somatic TP53 mutation is therefore recorded as a
    resistance modifier rather than a driver, and it is strongly enriched in mediastinal
    (extragonadal) disease.
  evidence:
  - reference: PMID:36030288
    reference_title: "Molecular correlates of male germ cell tumors with overgrowth of components resembling somatic malignancies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KRAS and TP53 mutations were identified by DNA sequencing in 28% of cases each,
      with enrichment of TP53 mutations in mediastinal tumors (86%).
    explanation: >-
      Documents somatic TP53 mutation frequency and its mediastinal enrichment in germ
      cell tumours with somatic-type malignancy.
treatments:
- name: Radical Inguinal Orchiectomy
  description: >-
    Removal of the affected testis and spermatic cord through an inguinal incision is
    both the diagnostic and the initial therapeutic procedure for testicular embryonal
    carcinoma, and it supplies the orchiectomy specimen on which the risk-defining
    features (percentage embryonal carcinoma, lymphovascular invasion) are assessed.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orchiectomy
    term:
      id: NCIT:C15288
      label: Orchiectomy
  target_mechanisms:
  - target: Unrestrained Primitive Epithelial Proliferation
    treatment_effect: INHIBITS
    description: >-
      Excision physically removes the proliferating primitive epithelial population at
      the primary site.
  evidence:
  - reference: PMID:24679874
    reference_title: "Risk stratification of pubertal children and postpubertal adolescents with clinical stage I testicular nonseminomatous germ cell tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We tested the hypothesis that lymphovascular invasion, or 40% or greater embryonal
      carcinoma in the orchiectomy specimen, would increase the risk of occult metastases
    explanation: >-
      Confirms orchiectomy as the procedure that both treats the primary and provides the
      specimen used for risk stratification.
- name: Cisplatin-Based Combination Chemotherapy (BEP)
  description: >-
    Bleomycin, etoposide and cisplatin is the standard regimen for metastatic and
    high-risk non-seminomatous germ cell tumours including embryonal carcinoma. Its
    efficacy rests on the tumour's retained wild-type TP53, low apoptotic threshold and
    limited DNA repair capacity, which together convert platinum adducts into
    overwhelming apoptosis; cure rates exceed 80% even with metastatic disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
  regimen_term:
    preferred_term: BEP regimen
    term:
      id: NCIT:C63488
      label: BEP Regimen
  target_mechanisms:
  - target: Intact Apoptotic Apparatus with Limited DNA Repair Capacity
    treatment_effect: ACTIVATES
    description: >-
      Cisplatin does not correct a lesion here; it exploits the tumour's intact apoptotic
      apparatus, driving both the death-receptor and mitochondrial pathways.
  evidence:
  - reference: PMID:37891379
    reference_title: "Strong apoptotic response of testis tumor cells following cisplatin treatment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      metastatic testicular germ cell tumors (TGCT) are cured in over 80% of patients
      using cisplatin-based combination therapy
    explanation: >-
      Quantifies the cure rate achieved by cisplatin-based combination therapy in
      metastatic germ cell tumours.
- name: Retroperitoneal Lymph Node Dissection
  description: >-
    Primary or post-chemotherapy retroperitoneal lymph node dissection removes the
    principal landing zone for testicular germ cell tumour metastases. It is used in
    clinical stage I non-seminoma with high-risk pathology - embryonal carcinoma
    predominance or lymphovascular invasion - where roughly half of patients harbour
    occult nodal disease.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: retroperitoneal lymph node dissection
    term:
      id: NCIT:C48184
      label: Retroperitoneal Lymph Node Dissection
  target_mechanisms:
  - target: Lymphovascular Invasion and Early Metastatic Dissemination
    treatment_effect: INHIBITS
    description: >-
      Removes occult nodal deposits in the retroperitoneal landing zone before they
      progress.
  evidence:
  - reference: PMID:24679874
    reference_title: "Risk stratification of pubertal children and postpubertal adolescents with clinical stage I testicular nonseminomatous germ cell tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of these patients 14 (60.9%) were on surveillance, 9 (39.1%) underwent primary
      retroperitoneal lymph node dissection and none received initial chemotherapy.
    explanation: >-
      Documents primary retroperitoneal lymph node dissection as one of the management
      options in clinical stage I non-seminoma.
- name: Radiotherapy for Intracranial NGGCT
  description: >-
    Intracranial non-germinomatous germ cell tumours, including embryonal carcinoma,
    require high-dose radiotherapy after induction chemotherapy, together with resection
    of residual tumour. Field selection matters: focal radiotherapy alone has been
    associated with metastatic (ventricular and spinal) failure, so craniospinal or
    whole-ventricular fields are generally preferred.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  context: CNS EC
  evidence:
  - reference: PMID:42115464
    reference_title: "Germinomas and Non-germinomatous Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NGGCTs require intensive chemotherapy, surgical resection of residual tumor, and
      high-dose radiotherapy.
    explanation: >-
      Establishes high-dose radiotherapy as part of standard intracranial NGGCT
      management.
  - reference: PMID:29380526
    reference_title: "Early outcomes and patterns of failure following proton therapy for nonmetastatic intracranial nongerminomatous germ cell tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This pattern of failure data adds to growing evidence suggesting chemotherapy
      followed by focal radiotherapy alone is inadequate in controlling localized NGGCT.
    explanation: >-
      Supports the field-selection caveat that focal radiotherapy alone is insufficient
      for intracranial NGGCT.
diagnosis:
- name: Immunohistochemical Distinction of Embryonal Carcinoma from Seminoma
  description: >-
    The core diagnostic problem for embryonal carcinoma is separating it from
    seminoma/germinoma, because that distinction changes management. Morphology
    (high-grade overlapping nuclei, glandular and pseudopapillary architecture) is
    supported by immunohistochemistry: both are OCT3/4-positive, but embryonal carcinoma
    is SOX2-positive, CD30-positive, cytokeratin-positive and SOX17-negative, whereas
    seminoma is the reverse.
  evidence:
  - reference: PMID:32205480
    reference_title: "Report From the International Society of Urological Pathology (ISUP) Consultation Conference on Molecular Pathology of Urogenital Cancers: IV: Current and Future Utilization of Molecular-Genetic Tests for Testicular Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemical staining is optional in the following scenarios: identification
      of GCNIS, distinguishing embryonal carcinoma from seminoma, confirming presence of
      yolk sac tumor and/or choriocarcinoma
    explanation: >-
      ISUP consensus naming the embryonal-carcinoma-versus-seminoma distinction as a
      recognised indication for immunohistochemistry.
differential_diagnoses:
- name: Seminoma / germinoma
  description: >-
    Shares OCT3/4 positivity and germ cell origin. Distinguished by SOX17 positivity,
    SOX2 negativity and CD30 negativity, plus lower-grade nuclei and a lymphocytic
    infiltrate.
- name: Yolk sac tumour
  description: >-
    Also a non-seminomatous histology, but AFP-producing, GDF3-positive and negative for
    CD30.
- name: Somatic carcinoma metastatic to the gonad or midline
  description: >-
    Cytokeratin positivity can mislead. Detection of 12p gain establishes germ cell
    origin and is the recommended tie-breaker in primary and metastatic lesions.
discussions:
- discussion_id: ec_chemosensitivity_no_matching_module
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Should the intact-apoptotic-machinery route to exceptional platinum chemosensitivity
    seen in embryonal carcinoma be factored out into a reusable mechanism module, and if
    so, is it a module in its own right or the negative pole of the existing
    resisting_cell_death module?
  attaches_to:
  - pathophysiology#Intact Apoptotic Apparatus with Limited DNA Repair Capacity
  - pathophysiology#Exceptional Cisplatin Chemosensitivity
  rationale: >-
    This entry deliberately declares no conforms_to links. The candidate hallmark modules
    do not honestly fit. resisting_cell_death models a BCL-2-family rheostat shifted
    toward survival; embryonal carcinoma is its mechanistic inverse - wild-type TP53, a
    low apoptotic threshold, and strong Bax/Noxa-driven death - so conformance would
    assert the opposite of the curated biology. genome_instability_mutation requires a
    genome-maintenance defect producing a mutator phenotype; germ cell tumours have
    arm-level aneuploidy (12p gain) on a strikingly quiet point-mutation background and a
    DNA-damage response that kills rather than mutates, so that module's central claim
    does not hold either. sustaining_proliferative_signaling was also considered and
    rejected: KRAS is gained by dosage on 12p, but activating KRAS and KIT mutations are
    concentrated in seminoma and targetable lesions are rare, so a constitutive mitogenic
    pathway activation node is not evidenced here. A dedicated module (provisional shape:
    therapy-exploitable apoptotic priming) would be a better home for this chain and
    would immediately gain the sibling germ cell tumour entries as conformers.
  notes: >-
    Raised while curating this entry against issue 8738, whose triage comment made the
    same observation independently.
notes: >-
  Scope. This entry models embryonal carcinoma as an entity, across the four MONDO
  subclasses. The site-specific disease entries remain separate and are not superseded:
  Testicular_Germ_Cell_Tumor, Mixed_Germ_Cell_Tumor,
  Malignant_Non_Dysgerminomatous_Germ_Cell_Tumor_Of_Ovary and
  Central_Nervous_System_Germ_Cell_Tumor each retain an embryonal carcinoma component
  block, now bound where possible to the appropriate MONDO term.

  Pure versus component. Embryonal carcinoma is far more often a component of a mixed
  germ cell tumour than a pure tumour. The issue that requested this entry suggested a
  component-of-mixed-germ-cell-tumour subtype; that was not created, because it has no
  MONDO identifier and cross-cuts the four site subclasses rather than sitting alongside
  them. The component role is captured in the pathophysiology (multilineage
  differentiation) and in the Mixed_Germ_Cell_Tumor entry instead.

  Serum markers. Neither AFP nor beta-hCG is produced by embryonal carcinoma itself; the
  phenotype entries record them because they are how an NGGCT containing an EC component
  is diagnosed and monitored, and the descriptions say so explicitly rather than implying
  EC secretes them.

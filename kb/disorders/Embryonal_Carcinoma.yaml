    reference_title: "Imaging in gynecological disease (22): clinical and ultrasound characteristics of ovarian embryonal carcinomas, non-gestational choriocarcinomas and malignant mixed germ cell tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A unilateral, large solid tumor with inhomogeneous echogenicity of the solid tissue
      and with dispersed small cystic areas in a young woman should raise the suspicion
      of a rare malignant germ cell tumor.
    explanation: >-
      Describes the presenting adnexal mass phenotype for the rare malignant ovarian germ
      cell tumours studied, which included embryonal carcinoma.
- category: Neoplastic
  name: Intracranial Tumour
  description: >-
    Intracranial embryonal carcinoma presents as a pineal or suprasellar mass, sometimes
    bifocal, in a child or adolescent.
  phenotype_term:
    preferred_term: Brain neoplasm
    term:
      id: HP:0030692
      label: Brain neoplasm
  subtype: CNS EC
  evidence:
  - reference: PMID:42115464
    reference_title: "Germinomas and Non-germinomatous Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These tumors commonly arise in the pineal and suprasellar regions, with a subset
      presenting as bifocal lesions.
    explanation: >-
      Establishes the intracranial locations at which the NGGCT group, including
      embryonal carcinoma, presents.
- category: Clinical
  name: Raised Intracranial Pressure
  description: >-
    Headache, visual disturbance and signs of raised intracranial pressure are the

name: Embryonal Carcinoma
creation_date: "2026-08-17T00:00:00Z"
categories:
- Germ Cell Neoplasm
- Solid Tumor
description: >-
  Embryonal carcinoma (EC) is a malignant germ cell tumor defined by a retained
  embryonic pluripotency program rather than by one anatomic site. EC cells are
  the pluripotent stem-cell compartment of non-seminomatous germ cell tumors: they
  co-express the core pluripotency transcription factors OCT3/4 (POU5F1), SOX2 and
  NANOG together with membranous CD30, and they retain the capacity to differentiate
  along somatic (teratoma) and extraembryonic (yolk sac tumor, choriocarcinoma)
  lineages. In the post-pubertal testis EC is a GCNIS-derived "type II" germ cell
  tumor and, like its sibling histologies, carries near-universal gain of the short
  arm of chromosome 12 (commonly as isochromosome 12p). Two features dominate its
  clinical behaviour and pull in opposite directions. EC is the most aggressive
  non-seminomatous component - its predominance in an orchiectomy specimen, together
  with lymphovascular invasion, identifies clinical stage I patients at high risk of
  occult metastatic disease and early relapse. Yet EC is also the paradigm of a
  curable solid tumor, because its pluripotent, wild-type-TP53 cellular context primes
  it for rapid p53/NOXA-dependent apoptosis and its interstrand-crosslink repair
  capacity is low, together producing an exceptional degree of cisplatin sensitivity
  that has no counterpart in most other solid malignancies. EC also occurs in the
  ovary, where it is essentially always a component of a malignant mixed germ cell
  tumor, and at extragonadal midline sites (mediastinum, retroperitoneum, CNS).
synonyms:
- embryonal cell carcinoma
- malignant embryonal carcinoma
parents:
- nonseminomatous germ cell tumor
- germ cell tumor
disease_term:
  preferred_term: embryonal carcinoma
  term:
    id: MONDO:0005440
    label: embryonal carcinoma
classifications:
  icdo_morphology:
    classification_value: Embryonal Neoplasm
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
notes: >-
  Scope guardrail. This entry describes the embryonal carcinoma histology across
  sites and contexts, not a single anatomic disease. Pure EC and the far more common
  "EC component of a mixed germ cell tumor" are not interchangeable, and a claim
  established for a whole mixed non-seminomatous tumor is not automatically a claim
  about its EC component. Where a cited study measured the whole tumor rather than
  the component, the evidence item is marked PARTIAL and the limitation is stated.
  Prepubertal-type testicular germ cell tumors (type I, GCNIS-unrelated, usually
  without 12p gain) are out of scope: post-pubertal EC is a type II, GCNIS-derived
  tumor, and the 12p and GCNIS content here should not be carried over to the
  prepubertal setting.

  Module conformance was assessed deliberately rather than by pattern-matching to
  the cancer-hallmark set. Only genome_instability_mutation is declared, and only at
  its chromosomal-instability arm (see the 12p node). Three others were considered
  and rejected. dna_repair_synthetic_lethality is NOT declared: EC's platinum
  sensitivity is not BRCA/FA-driven synthetic lethality - there is no HRR/FA
  caretaker lesion, the rate-limiting defect is low ERCC1-XPF interstrand-crosslink
  processing, and the dominant mechanism is apoptotic priming on a wild-type TP53
  background, so conforming would misdescribe both the trigger and the vulnerability.
  resisting_cell_death is NOT declared because EC shows the opposite phenotype - a
  hypersensitive rather than a blocked apoptotic response.
  enabling_replicative_immortality is NOT declared because the available EC-specific
  telomerase data do not support a simple "telomere maintenance reactivation drives
  the tumor" reading: low rather than high hTERT protein marked the more aggressive
  EC in the cited series.

has_subtypes:
- name: EC Component of Mixed GCT
  display_name: Embryonal carcinoma component of a mixed germ cell tumor
  subtype_term:
    preferred_term: Testicular Embryonal Carcinoma
    term:
      id: NCIT:C6341
      label: Testicular Embryonal Carcinoma
  description: >-
    The most frequent context in which EC is encountered. EC is the pluripotent
    compartment of a post-pubertal mixed non-seminomatous tumor and coexists with
    yolk sac tumor, teratoma, choriocarcinoma and/or seminoma. Quantifying the
    percentage of EC in the specimen is a required reporting element because
    EC predominance carries prognostic weight.
  evidence:
  - reference: PMID:41988850
    reference_title: >-
      Immunophenotypic assessment of pure embryonal carcinoma and yolk sac tumour
      suggests that reprogramming to non-seminoma occurs outside the spermatogonial
      niche.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most non-seminomas show mixed histology, often including components of seminoma.
      A small subset presents as pure non-seminomatous germ cell tumors.
    explanation: >-
      Establishes the mixed-histology context as the usual one and pure
      non-seminoma as the minority, which is why this subtype is listed first.
- name: Pure Testicular EC
  display_name: Pure testicular embryonal carcinoma
  description: >-
    A minority of post-pubertal testicular tumors are pure EC without an invasive
    seminomatous or other non-seminomatous component. In such tumors the adjacent
    GCNIS is OCT4+/SOX17+/NANOG+ but CD30- and SOX2-, whereas the invasive EC is
    OCT4+/NANOG+/SOX17-/SOX2+/CD30+, which has been read as evidence that
    reprogramming to the EC phenotype occurs after the cells leave the
    spermatogonial niche.
  evidence:
  - reference: PMID:41988850
    reference_title: >-
      Immunophenotypic assessment of pure embryonal carcinoma and yolk sac tumour
      suggests that reprogramming to non-seminoma occurs outside the spermatogonial
      niche.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adjacent invasive EC (62/67 cases) and intratubular EC (19/67) showed the
      classic EC immunophenotype: OCT4+/NANOG+/SOX17-/SOX2+/CD30+.
    explanation: >-
      A 63-case pure-EC series establishes both that pure testicular EC exists as a
      curated context and its defining immunophenotype.
- name: Ovarian EC
  display_name: Ovarian embryonal carcinoma
  description: >-
    EC involving the ovary. In the largest reported morphologic series no pure
    ovarian EC was identified: every tumor with an EC component was a malignant
    mixed germ cell tumor, most often admixed with yolk sac tumor and immature
    teratoma. Purported "pure" ovarian EC is usually an undersampled mixed tumor
    or a mimic. This is the same entity referenced as the unbound
    Embryonal Carcinoma subtype of
    Malignant_Non_Dysgerminomatous_Germ_Cell_Tumor_Of_Ovary.
  evidence:
  - reference: PMID:41887253
    reference_title: >-
      Embryonal Carcinoma Involving the Ovary: A Morphologic Study of 55 Tumors
      Almost Never Pure, But Common Within Malignant Mixed Germ Cell Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all cases, the ECA was a component of a malignant mixed germ cell tumor
      (MMGCT) and represented less than 15% in 22 tumors (40%), 16% to 50% in 22
      (40%), 51% to 75% in 6 (11%), and greater than 75% in 5 (9%).
    explanation: >-
      A 55-tumor ovarian series directly establishes that ovarian EC occurs as a
      mixed-tumor component and quantifies its proportion.
  - reference: PMID:41887253
    reference_title: >-
      Embryonal Carcinoma Involving the Ovary: A Morphologic Study of 55 Tumors
      Almost Never Pure, But Common Within Malignant Mixed Germ Cell Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pure ovarian ECA is rare; none were identified in our series.
    explanation: >-
      Directly supports the guardrail that a diagnosis of pure ovarian EC should
      prompt re-examination for an undersampled mixed tumor.
- name: Extragonadal EC
  display_name: Extragonadal (mediastinal/retroperitoneal) embryonal carcinoma
  description: >-
    EC arising at an extragonadal midline site, attributed to germ cells misrouted
    during their embryonic migration. The anterior mediastinum is the characteristic
    location. Mediastinal non-seminomatous germ cell tumors, including those with an
    EC component, have the worst survival of any germ cell tumor presentation, and
    Klinefelter syndrome is strongly over-represented among them.
  evidence:
  - reference: PMID:36831022
    reference_title: "Primary Mediastinal Germ Cell Tumors: A Thorough Literature Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non-seminoma PMGCTs have the shortest 5-year overall survival and the poorest
      prognosis among all of the germ cell tumor presentations, while seminomas share
      the same survival and prognosis as their testicular counterparts.
    explanation: >-
      Supports the adverse prognosis of the extragonadal non-seminomatous context.
      Marked PARTIAL because the review reports outcomes for mediastinal non-seminoma
      as a group, not for its EC component specifically.
- name: CNS EC
  display_name: Central nervous system embryonal carcinoma
  description: >-
    EC arising in the pineal or suprasellar region as a component of an intracranial
    non-germinomatous germ cell tumor. Cross-referenced to the
    Central_Nervous_System_Germ_Cell_Tumor entry, which is the primary home for
    CNS-specific staging and management.
  evidence:
  - reference: PMID:19820689
    reference_title: >-
      "Diagnostic utility of SALL4 in primary germ cell tumors of the central nervous
      system: a study of 77 cases."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study we analyzed the diagnostic utility of a novel marker, SALL4, in
      77 such tumors (59 pure and 18 mixed) consisting of the following tumors/tumor
      components: 49 germinomas, 7 embryonal carcinomas, 27 yolk sac tumors, 3
      choriocarcinomas, and 14 teratomas.
    explanation: >-
      A 77-tumor CNS germ cell tumor series counts 7 embryonal carcinomas, directly
      documenting the CNS as a site where this histology occurs and its relative
      rarity there. Marked PARTIAL because the study is a marker study and does not
      clinically characterize CNS embryonal carcinoma.

pathophysiology:
- name: Gonocyte Arrest and Germ Cell Neoplasia In Situ
  biological_scale: CELLULAR
  role: trigger
  description: >-
    Post-pubertal (type II) germ cell tumors, including embryonal carcinoma, arise
    from germ cell neoplasia in situ (GCNIS): an intratubular population of arrested
    fetal-type gonocytes that failed the normal gonocyte-to-spermatogonium transition
    and persist with a primordial-germ-cell-like pluripotency program. GCNIS cells
    are OCT4-, SOX17- and NANOG-positive but are not yet invasive and, importantly,
    do not yet show 12p gain.
  cell_types:
  - preferred_term: arrested fetal-type gonocyte (GCNIS cell)
    term:
      id: CL:0000670
      label: primordial germ cell
  biological_processes:
  - preferred_term: stem cell population maintenance
    term:
      id: GO:0019827
      label: stem cell population maintenance
    modifier: INCREASED
  evidence:
  - reference: PMID:38922953
    reference_title: >-
      Pathogenesis and pathobiology of testicular germ cell tumours: a view from a
      developmental biological perspective with guidelines for pathological
      diagnostics.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Type II GCT develop from a non-invasive germ cell neoplasia in situ (GCNIS) and
      show an isochromosome 12p (i12p) or gain of 12p material as a common and
      characteristic molecular alteration.
    explanation: >-
      Establishes GCNIS as the non-invasive precursor of the type II germ cell tumors,
      the group that contains embryonal carcinoma.
  - reference: PMID:15982323
    reference_title: >-
      Stem cell pluripotency factor NANOG is expressed in human fetal gonocytes,
      testicular carcinoma in situ and germ cell tumours.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We provide evidence for the fetal origin of testicular cancer as we detected
      strong expression of NANOG in fetal gonocytes up to gestational week 20, with
      subsequent down-regulation occurring earlier than for OCT-4.
    explanation: >-
      Ties the precursor lesion's pluripotency program to a fetal gonocyte origin.
  downstream:
  - target: Chromosome 12p Gain and Invasive Transformation
    causal_link_type: DIRECT
    description: >-
      Acquisition of 12p material is the change that accompanies the step from
      intratubular GCNIS to invasive germ cell tumor.
    evidence:
    - reference: PMID:30533005
      reference_title: "Testicular Germ Cell Tumors: A Cytogenomic Update."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        This might be the key step that allows the lesion to progress from a germ cell
        neoplasia in situ (GCNIS), which is a microscopic finding preceding the TGCT
        and without gain in 12p, to a TGCT.
      explanation: >-
        Directly states the proposed causal role of 12p gain in the GCNIS-to-invasive
        transition. The source hedges ("might be"), and that hedge is preserved here.

- name: Chromosome 12p Gain and Invasive Transformation
  biological_scale: MOLECULAR
  role: amplifier
  conforms_to: "genome_instability_mutation#Mutator Phenotype and Chromosomal Instability"
  description: >-
    Gain of material from the short arm of chromosome 12 - most often as an
    isochromosome i(12p), sometimes as a more restricted 12p amplicon - is the
    single most consistent genomic feature of post-pubertal germ cell tumors and is
    present in close to all cases. Candidate dosage-sensitive genes on 12p include
    NANOG, cyclin D2 and KRAS, linking the copy-number gain back to the pluripotency
    and proliferative programs. Conformance to the genome-instability module is
    declared only at its chromosomal-instability/aneuploidy arm: germ cell tumors are
    characteristically aneuploid, but they are not hypermutated and do not display a
    point-mutation mutator phenotype, so the module's hypermutation arm does not apply.
  biological_processes:
  - preferred_term: DNA repair
    term:
      id: GO:0006281
      label: DNA repair
    modifier: DECREASED
  evidence:
  - reference: PMID:30533005
    reference_title: "Testicular Germ Cell Tumors: A Cytogenomic Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      One of the most consistent features of TGCTs is the gain of material in the
      short arm of chromosome 12, that occurs in almost 100% of TGCT cases; 80% of
      them involve the formation of an isochromosome of the short arm i(12p).
    explanation: >-
      Quantifies both the near-universal 12p gain and the proportion realised as
      i(12p).
  - reference: PMID:30533005
    reference_title: "Testicular Germ Cell Tumors: A Cytogenomic Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanism that associates the gain of 12p and the development of
      invasiveness is not yet well understood but it is believed a number of genes are
      involved, including DPPA3/STELLA, SOX5, PHC2, ATF7IP and proto-oncogenes Cyclin
      D2 and KRAS.
    explanation: >-
      Names the candidate 12p genes and simultaneously records that the mechanism
      linking 12p gain to invasiveness remains unresolved.
  downstream:
  - target: Retained Pluripotency Program
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      12p carries pluripotency-associated genes including NANOG, so 12p gain is
      thought to reinforce the pluripotent state of the invasive tumor. The
      intermediates are not established.
    evidence:
    - reference: PMID:38922953
      reference_title: >-
        Pathogenesis and pathobiology of testicular germ cell tumours: a view from a
        developmental biological perspective with guidelines for pathological
        diagnostics.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Furthermore, different pluripotency associated factors (e.g. OCT3/4, SOX2,
        SOX17) play a crucial role in GCT development and can be used as
        immunohistochemical markers
      explanation: >-
        Supports the pluripotency program being central to germ cell tumor
        development. Marked PARTIAL because the review does not establish that 12p
        gain is what drives that program, which is why this edge is typed with
        unknown intermediates.

- name: Retained Pluripotency Program
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    The defining feature of embryonal carcinoma. EC cells occupy the pluripotent
    stem-cell compartment of a non-seminomatous germ cell tumor, co-expressing the
    core embryonic transcription factors OCT3/4 (POU5F1), SOX2 and NANOG while
    lacking the seminoma-associated factor SOX17. This is the node from which both
    EC's differentiation capacity and its distinctive drug response follow.
  cell_types:
  - preferred_term: embryonal carcinoma cell (pluripotent tumor stem cell)
    term:
      id: CL:0002248
      label: pluripotent stem cell
  biological_processes:
  - preferred_term: stem cell population maintenance
    term:
      id: GO:0019827
      label: stem cell population maintenance
    modifier: INCREASED
  evidence:
  - reference: PMID:23302226
    reference_title: >-
      Cisplatin hypersensitivity of testicular germ cell tumors is determined by high
      constitutive Noxa levels mediated by Oct-4.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Embryonal carcinoma cells represent the pluripotent entity of TGCTs and are
      characterized by expression of Oct-4, a key regulator of pluripotency and a
      determinant of their inherent hypersensitivity to cisplatin.
    explanation: >-
      Directly identifies EC as the pluripotent compartment of germ cell tumors and
      links that identity to Oct-4.
  - reference: PMID:41988850
    reference_title: >-
      Immunophenotypic assessment of pure embryonal carcinoma and yolk sac tumour
      suggests that reprogramming to non-seminoma occurs outside the spermatogonial
      niche.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adjacent invasive EC (62/67 cases) and intratubular EC (19/67) showed the
      classic EC immunophenotype: OCT4+/NANOG+/SOX17-/SOX2+/CD30+.
    explanation: >-
      Provides the full transcription-factor immunophenotype of invasive EC in a
      63-case pure-EC cohort.
  - reference: PMID:17117392
    reference_title: >-
      "OCT4: biological functions and clinical applications as a marker of germ cell
      neoplasia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      OCT4 immunostaining has been shown to be a sensitive and specific marker for
      seminomatous/(dys)germinomatous tumours and in embryonal carcinoma variants of
      non-seminomatous GCTs, whether in primary gonadal or extragonadal sites or in
      metastatic lesions.
    explanation: >-
      Establishes OCT4 as a sensitive and specific pluripotency marker for EC across
      gonadal, extragonadal and metastatic sites.
  downstream:
  - target: CD30 Surface Expression
    causal_link_type: DIRECT
    description: >-
      The EC phenotype includes membranous CD30, which is acquired with the EC state
      and is absent from the GCNIS precursor.
    evidence:
    - reference: PMID:41988850
      reference_title: >-
        Immunophenotypic assessment of pure embryonal carcinoma and yolk sac tumour
        suggests that reprogramming to non-seminoma occurs outside the spermatogonial
        niche.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In all cases, GCNIS expressed OCT4, SOX17, and NANOG. GCNIS associated with EC
        was consistently negative for CD30 and SOX2
      explanation: >-
        The precursor-versus-tumor contrast shows CD30 is acquired with the embryonal
        carcinoma state rather than inherited from GCNIS, which is the direction this
        edge asserts.
  - target: Multilineage Differentiation Capacity
    causal_link_type: DIRECT
    description: >-
      Pluripotency is what gives EC the capacity to generate the somatic and
      extraembryonic components of a mixed germ cell tumor.
    evidence:
    - reference: PMID:21532991
      reference_title: >-
        p53 hypersensitivity is the predominant mechanism of the unique responsiveness
        of testicular germ cell tumor (TGCT) cells to cisplatin.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        EC cells represent the pluripotent stem cell compartment in these tumors and
        retain their capability for self-renewal as well as differentiation
        into multiple cell types.
      explanation: >-
        States pluripotency and multilineage differentiation capacity as properties of
        the same cells, supporting the edge from one to the other.
  - target: Apoptotic Priming by Constitutive NOXA
    causal_link_type: DIRECT
    description: >-
      Oct-4 sustains the high constitutive Noxa levels that prime EC cells for
      apoptosis.
    evidence:
    - reference: PMID:23302226
      reference_title: >-
        Cisplatin hypersensitivity of testicular germ cell tumors is determined by high
        constitutive Noxa levels mediated by Oct-4.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Furthermore, RNA interference-mediated knockdown of Oct-4 resulted in reduced
        Noxa transcript, in an almost complete loss of constitutive Noxa protein and
        decreased cisplatin hypersensitivity to a similar extent as did Noxa depletion.
      explanation: >-
        A knockdown experiment establishes the direction of the Oct-4-to-Noxa edge
        rather than mere co-occurrence.

- name: CD30 Surface Expression
  biological_scale: MOLECULAR
  role: biomarker
  description: >-
    Membranous CD30 (TNFRSF8) is expressed by the great majority of testicular
    embryonal carcinomas and is the single most useful positive marker separating EC
    from seminoma, which is instead CD117/KIT-positive and CD30-negative. CD30 is not
    a stable target across the disease course: it is frequently lost in
    post-chemotherapy metastatic EC, which is why OCT4 supersedes it in that setting.
  gene_products:
  - preferred_term: CD30 (TNFRSF8)
    term:
      id: NCIT:C38906
      label: Tumor Necrosis Factor Receptor Superfamily Member 8
  evidence:
  - reference: PMID:11799147
    reference_title: >-
      CD30 and CD117 (c-kit) used in combination are useful for distinguishing
      embryonal carcinoma from seminoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed that 27/35 seminomas were CD117+/CD30-; none of the seminoma was
      CD117-/CD30+. Conversely, 11/14 ECs were CD30+/CD117- and none was CD30-/CD117+.
    explanation: >-
      Reports the actual discriminating counts rather than the general claim, in the
      study that established the CD30/CD117 pairing.
  - reference: PMID:34031784
    reference_title: "Phase II trial of brentuximab vedotin in relapsed/refractory germ cell tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CD30 is expressed on the surface of 93%-98% of testicular embryonal carcinoma,
      with positive staining present in > 50% of tumor cells.
    explanation: >-
      Quantifies the proportion of testicular EC expressing CD30 and the extent of
      staining.
  - reference: PMID:16733205
    reference_title: >-
      OCT4 is superior to CD30 in the diagnosis of metastatic embryonal carcinomas
      after chemotherapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      OCT4 is a useful diagnostic marker to identify metastatic embryonal carcinomas
      after chemotherapy, with a better sensitivity than CD30.
    explanation: >-
      Establishes the post-chemotherapy caveat: CD30 is not reliable in that setting
      and OCT4 should be preferred.

- name: Multilineage Differentiation Capacity
  biological_scale: CELLULAR
  role: consequence
  description: >-
    Because EC retains pluripotency, it can differentiate along somatic lineages to
    produce post-pubertal-type teratoma and along extraembryonic lineages to produce
    yolk sac tumor and choriocarcinoma. This is why EC is the usual pluripotent
    partner in a mixed germ cell tumor, and why an EC-derived tumor can show
    marker-secreting components (AFP, beta-hCG) that EC itself need not produce.
  biological_processes:
  - preferred_term: multilineage differentiation of the tumor stem cell compartment
    term:
      id: GO:0030154
      label: cell differentiation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:41887253
    reference_title: >-
      Embryonal Carcinoma Involving the Ovary: A Morphologic Study of 55 Tumors
      Almost Never Pure, But Common Within Malignant Mixed Germ Cell Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Components admixed with the ECA included yolk sac tumor (n = 49; 89%), immature
      teratoma (n = 34; 62%), dysgerminoma (n = 20; 36%), and choriocarcinoma (n = 5;
      9%).
    explanation: >-
      Enumerates the differentiated lineages actually found alongside EC in a
      55-tumor series, supporting the multilineage-partner claim empirically.
  - reference: PMID:21532991
    reference_title: >-
      p53 hypersensitivity is the predominant mechanism of the unique responsiveness
      of testicular germ cell tumor (TGCT) cells to cisplatin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      EC cells represent the pluripotent stem cell compartment in these tumors and
      retain their capability for self-renewal as well as differentiation
      into multiple cell types.
    explanation: >-
      States the self-renewal-plus-multilineage-differentiation property directly.

- name: Aggressive Invasion and Early Lymphovascular Spread
  biological_scale: TISSUE
  role: consequence
  description: >-
    EC is the most clinically aggressive non-seminomatous component. In clinical
    stage I non-seminoma - disease that appears confined to the testis on imaging -
    predominance of EC together with lymphovascular invasion identifies patients with
    a much higher and faster relapse rate, which is the basis for offering adjuvant
    chemotherapy or retroperitoneal lymph node dissection rather than surveillance.
    Systematic review supports the presence of EC (not necessarily predominance) as a
    subordinate prognostic factor alongside the better-validated lymphovascular
    invasion.
  evidence:
  - reference: PMID:25888612
    reference_title: >-
      A refined risk stratification scheme for clinical stage 1 NSGCT based on
      evaluation of both embryonal predominance and lymphovascular invasion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Relapse rates (%) and median time-to-relapse (months) were 25%/8.5 months,
      41%/6.8 months and 78%/3.8 months for RF0, RF1 and RF2, respectively.
    explanation: >-
      Quantifies the graded relapse risk when embryonal predominance and
      lymphovascular invasion are scored together in a 266-patient surveillance cohort.
  - reference: PMID:35906286
    reference_title: >-
      Prognostic factors in patients with clinical stage I nonseminoma-beyond
      lymphovascular invasion: a systematic review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five out of eight studies found a significant association of embryonal carcinoma
      (EC) in the primary tumor with relapse.
    explanation: >-
      A systematic review gives the strength and consistency of the EC-relapse
      association across studies, rather than resting on a single cohort.
  - reference: PMID:35906286
    reference_title: >-
      Prognostic factors in patients with clinical stage I nonseminoma-beyond
      lymphovascular invasion: a systematic review.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of EC might serve as a second, subordinate prognostic factor for
      clinical use as the data situation is less abundant than the one of LVI.
    explanation: >-
      Records the reviewers' own hedge: EC is a subordinate, less well-evidenced
      factor than lymphovascular invasion, and is curated here at that strength.

- name: Deficient Interstrand Crosslink Repair
  biological_scale: MOLECULAR
  role: modifier
  description: >-
    Germ cell tumor cells repair cisplatin-induced interstrand crosslinks poorly.
    The rate-limiting factor is low expression of the nucleotide-excision-repair
    endonuclease complex ERCC1-XPF, which processes crosslinks: forcing ERCC1-XPF
    expression up restores crosslink repair and makes the cells more cisplatin
    resistant. This is a repair-capacity deficit specific to the ICL pathway - it is
    not a BRCA/FA caretaker lesion, and intrastrand-crosslink repair is comparable to
    that of resistant tumor cells.
  biological_processes:
  - preferred_term: interstrand cross-link repair
    term:
      id: GO:0036297
      label: interstrand cross-link repair
    modifier: DECREASED
  evidence:
  - reference: PMID:20846399
    reference_title: >-
      Cisplatin sensitivity of testis tumour cells is due to deficiency in
      interstrand-crosslink repair and low ERCC1-XPF expression.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We observed that repair of intrastrand crosslinks is similar in cisplatin
      sensitive TTC and resistant bladder cancer cells, whereas repair of ICLs was
      significantly reduced in TTC.
    explanation: >-
      Isolates the defect to interstrand rather than intrastrand crosslink repair,
      which is the distinction that makes the mechanism specific.
  - reference: PMID:20846399
    reference_title: >-
      Cisplatin sensitivity of testis tumour cells is due to deficiency in
      interstrand-crosslink repair and low ERCC1-XPF expression.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Over-expression increased ICL repair and rendered TTC more resistant to
      cisplatin, which suggests that ERCC1-XPF is rate-limiting for repair of ICLs
      resulting in the observed cisplatin hypersensitivity of TTC.
    explanation: >-
      A gain-of-function rescue experiment establishes ERCC1-XPF as causally
      rate-limiting rather than merely correlated.
  downstream:
  - target: Exceptional Cisplatin Chemosensitivity
    causal_link_type: DIRECT
    description: >-
      Unrepaired interstrand crosslinks are the persistent lesion that drives the
      apoptotic response to cisplatin.
    evidence:
    - reference: PMID:20846399
      reference_title: >-
        Cisplatin sensitivity of testis tumour cells is due to deficiency in
        interstrand-crosslink repair and low ERCC1-XPF expression.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        H2AX formation, which serves as a marker of DNA breaks formed in response to
        ICLs, persisted in cisplatin-treated TTC and correlated with sustained
        phosphorylation of Chk2 and enhanced PARP-1 cleavage.
      explanation: >-
        Traces the unrepaired-crosslink lesion through persistent DNA breaks to PARP-1
        cleavage, an apoptotic readout, which is the mechanism this edge asserts.

- name: Apoptotic Priming by Constitutive NOXA
  biological_scale: MOLECULAR
  role: modifier
  description: >-
    Germ cell tumors, unlike most solid tumors, usually retain wild-type TP53, and
    in the specific cellular context of pluripotent EC cells p53 function is skewed
    almost entirely toward apoptosis rather than cell-cycle arrest. The BH3-only
    protein NOXA (PMAIP1) is the pivot: Oct-4-dependent high constitutive NOXA levels
    prime the mitochondrial apoptotic machinery so that p53 activation produces rapid,
    massive apoptosis. Silencing p53 abolishes the hypersensitivity entirely, and this
    apoptotic bias is lost when the cells differentiate.
  biological_processes:
  - preferred_term: intrinsic apoptotic signaling pathway in response to DNA damage by p53 class mediator
    term:
      id: GO:0042771
      label: intrinsic apoptotic signaling pathway in response to DNA damage by p53 class mediator
    modifier: INCREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:21532991
    reference_title: >-
      p53 hypersensitivity is the predominant mechanism of the unique responsiveness
      of testicular germ cell tumor (TGCT) cells to cisplatin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that siRNA-mediated silencing of p53 is sufficient to completely
      abrogate hypersensitivity not only to Cisplatin but also to non-genotoxic
      inducers of p53 such as the Mdm2 antagonist Nutlin-3 and the proteasome inhibitor
      Bortezomib.
    explanation: >-
      A loss-of-function experiment establishes p53 as necessary for the
      hypersensitive phenotype, and the non-genotoxic inducers show the effect is
      about p53 sensitivity rather than DNA damage per se.
  - reference: PMID:21532991
    reference_title: >-
      p53 hypersensitivity is the predominant mechanism of the unique responsiveness
      of testicular germ cell tumor (TGCT) cells to cisplatin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, in the very specific cellular context of germ cell-derived
      pluripotent EC cells, p53 function appears to be limited to induction of
      apoptosis.
    explanation: >-
      States the arrest-versus-apoptosis skew that distinguishes EC's p53 response
      from that of other wild-type-TP53 tumors.
  - reference: PMID:23302226
    reference_title: >-
      Cisplatin hypersensitivity of testicular germ cell tumors is determined by high
      constitutive Noxa levels mediated by Oct-4.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Oct-4-dependent high constitutive levels of this BH3-only protein prime
      embryonal carcinoma cells to undergo rapid and massive apoptosis in response to
      p53 activation.
    explanation: >-
      Names the priming mechanism (constitutive NOXA under Oct-4 control) that
      converts p53 activation into apoptosis.
  downstream:
  - target: Exceptional Cisplatin Chemosensitivity
    causal_link_type: DIRECT
    description: >-
      A primed mitochondrial apoptotic apparatus converts modest DNA damage into
      tumor-cell death.
    evidence:
    - reference: PMID:23302226
      reference_title: >-
        Cisplatin hypersensitivity of testicular germ cell tumors is determined by high
        constitutive Noxa levels mediated by Oct-4.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In conclusion, our study indicates that Noxa is a central determinant of
        hypersensitivity to cisplatin.
      explanation: >-
        The study's own conclusion states the priming-to-hypersensitivity direction
        this edge encodes.

- name: Exceptional Cisplatin Chemosensitivity
  biological_scale: ORGANISM
  role: therapeutic_vulnerability
  description: >-
    The convergence of poor interstrand-crosslink repair and a hair-trigger
    p53/NOXA apoptotic response makes embryonal carcinoma and the germ cell tumors
    that contain it curable with platinum-based combination chemotherapy even when
    widely metastatic - an outcome essentially unique among adult solid tumors. This
    is the node that platinum-based treatment targets.
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:20846399
    reference_title: >-
      Cisplatin sensitivity of testis tumour cells is due to deficiency in
      interstrand-crosslink repair and low ERCC1-XPF expression.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cisplatin based chemotherapy cures over 80% of metastatic testicular germ cell
      tumours (TGCT). In contrast, almost all other solid cancers in adults are
      incurable once they have spread beyond the primary site.
    explanation: >-
      Quantifies the cure rate and makes the contrast with other metastatic solid
      tumors explicit.
  downstream:
  - target: Acquired Cisplatin Resistance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A minority of tumors escape this vulnerability, and those are the patients who
      relapse and die of germ cell tumor. The selection route is not established.
    evidence:
    - reference: PMID:25546083
      reference_title: "Cisplatin resistance in germ cell tumours: models and mechanisms."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Targeted therapy based on mechanistic insights holds the promise to turn
        cisplatin-resistant GCT into a curable disease.
      explanation: >-
        Establishes that a cisplatin-resistant, non-curable subset exists downstream of
        the otherwise curable phenotype. Marked PARTIAL because the review does not
        establish the selection route from sensitivity to resistance, which is why
        this edge carries unknown intermediates.

- name: Acquired Cisplatin Resistance
  biological_scale: CELLULAR
  role: consequence
  description: >-
    The small refractory fraction is where germ cell tumor mortality is concentrated.
    Proposed escape routes include loss of Oct-4 with failure to induce the
    pro-apoptotic effectors PUMA and NOXA, elevated MDM2 restraining p53,
    cytoplasmic sequestration of p21, altered microRNA expression, and activation of
    the PDGFR-beta/PI3K/AKT axis. These are curated as candidate mechanisms rather
    than an established clinical resistance pathway.
  biological_processes:
  - preferred_term: intrinsic apoptotic signaling pathway in response to DNA damage by p53 class mediator
    term:
      id: GO:0042771
      label: intrinsic apoptotic signaling pathway in response to DNA damage by p53 class mediator
    modifier: DECREASED
  evidence:
  - reference: PMID:25546083
    reference_title: "Cisplatin resistance in germ cell tumours: models and mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mechanisms involved in cisplatin resistance are as follows: down-regulation of
      Oct4 (e.g. as a result of hypoxia, treatment with retinoic acid or exposure to
      cisplatin) and failure to induce Puma and Noxa; changes in the expression levels
      of micro-RNAs such as miR-17/-106b, miR-302a, or miR-371 to -373; elevated levels
      of MDM2 and cytoplasmic translocation of p21 by phosphorylation; and activation
      of the PDGFR
    explanation: >-
      Enumerates the candidate resistance mechanisms directly; the review presents
      these as postulated mechanisms, which is the strength curated here.

phenotypes:
- category: Clinical
  name: Testicular mass
  description: >-
    The usual presentation of testicular embryonal carcinoma is a testicular mass.
    Radical inguinal orchiectomy is both the diagnostic procedure and, for most
    localized tumors, the definitive local treatment.
  phenotype_term:
    preferred_term: Testicular mass
    term:
      id: HP:0032404
      label: Testicular mass
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inguinal orchiectomy is the main diagnostic procedure, and is also curative for
      most localized tumors
    explanation: >-
      Supports orchiectomy as the diagnostic and definitive local procedure for a
      testicular germ cell tumor. Marked PARTIAL because the guideline addresses
      testicular germ cell tumors as a group rather than embryonal carcinoma alone.
- category: Clinical
  name: Testicular neoplasm
  description: >-
    Embryonal carcinoma is a malignant neoplasm of the testis; the same histology
    arising in the ovary or at an extragonadal site is captured by the corresponding
    subtypes.
  phenotype_term:
    preferred_term: Testicular neoplasm
    term:
      id: HP:0010788
      label: Testicular neoplasm
  evidence:
  - reference: PMID:41988850
    reference_title: >-
      Immunophenotypic assessment of pure embryonal carcinoma and yolk sac tumour
      suggests that reprogramming to non-seminoma occurs outside the spermatogonial
      niche.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixty-seven pure non-seminomas (63 EC, 4 YST) were evaluated.
    explanation: >-
      A 63-case series of pure testicular embryonal carcinoma establishes the tumor
      as a testicular neoplasm.
- category: Clinical
  name: Ovarian neoplasm
  description: >-
    In the ovary, embryonal carcinoma presents as a large, predominantly solid and
    cystic mass with haemorrhagic necrosis, essentially always as a component of a
    malignant mixed germ cell tumor.
  subtype: Ovarian EC
  phenotype_term:
    preferred_term: Ovarian neoplasm
    term:
      id: HP:0100615
      label: Ovarian neoplasm
  evidence:
  - reference: PMID:41887253
    reference_title: >-
      Embryonal Carcinoma Involving the Ovary: A Morphologic Study of 55 Tumors
      Almost Never Pure, But Common Within Malignant Mixed Germ Cell Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The tumors ranged from 2.5 cm to 31 cm (average, 15.4 cm), being predominantly
      solid and cystic with hemorrhagic necrosis.
    explanation: >-
      Characterizes the gross appearance of the ovarian tumor in a 55-tumor series.
- category: Clinical
  name: Anterior mediastinal mass
  description: >-
    Extragonadal embryonal carcinoma most characteristically presents as an anterior
    mediastinal mass in a young man, a presentation with a distinctly worse prognosis
    than its testicular counterpart and a strong association with Klinefelter syndrome.
  subtype: Extragonadal EC
  phenotype_term:
    preferred_term: Anterior mediastinal mass
    term:
      id: HP:0033827
      label: Anterior mediastinal mass
  evidence:
  - reference: PMID:41789737
    reference_title: Incidence of Gonadal and Extragonadal Germ Cell Tumours in Patients With Klinefelter Syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      several reports have noted a striking association between KS and extragonadal
      germ cell tumours (EGCTs), especially in the mediastinum
    explanation: >-
      Supports the mediastinum as the characteristic extragonadal site and its
      association with Klinefelter syndrome. Marked PARTIAL because the cohort reports
      extragonadal germ cell tumors as a group, not the EC component specifically.
- category: Laboratory
  name: Elevated serum beta-hCG
  description: >-
    Beta-hCG may be elevated in embryonal-carcinoma-containing tumors, typically from
    syncytiotrophoblastic elements. Marker interpretation is a known trap: hCG is
    neither specific to one histology nor uniformly elevated, and it enters the
    IGCCCG prognostic classification alongside AFP and LDH.
  phenotype_term:
    preferred_term: Elevated circulating beta chorionic gonadotropin concentration
    term:
      id: HP:6000485
      label: Elevated circulating beta chorionic gonadotropin concentration
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with persistent markers after orchiectomy or advanced disease at
      diagnosis should be staged and classified according to the IGCCCG prognostic
      classification.
    explanation: >-
      Supports serum markers, of which beta-hCG is one, driving prognostic
      classification. Marked PARTIAL because the guideline speaks to markers as a
      group rather than beta-hCG in embryonal carcinoma specifically.
- category: Laboratory
  name: Elevated serum alpha-fetoprotein
  description: >-
    AFP elevation in an embryonal-carcinoma-containing tumor generally reflects a
    yolk-sac-tumor component derived from the EC compartment rather than EC itself.
    A raised AFP excludes pure seminoma and mandates non-seminomatous management.
  phenotype_term:
    preferred_term: Elevated circulating alpha-fetoprotein concentration
    term:
      id: HP:0006254
      label: Elevated circulating alpha-fetoprotein concentration
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Insufficient marker decline after each cycle is associated with poor prognosis.
    explanation: >-
      Supports serial serum marker kinetics as prognostically meaningful in germ cell
      tumor management. Marked PARTIAL because the guideline speaks to markers as a
      group rather than AFP in embryonal carcinoma specifically.

histopathology:
- name: Solid, Glandular and Papillary Growth Patterns
  description: >-
    Embryonal carcinoma grows in sheets of large, primitive epithelioid cells with
    overlapping vesicular nuclei and prominent nucleoli, arranged in solid, glandular
    (pseudoglandular) and papillary patterns. In the ovarian series the glandular
    pattern was the most common.
  finding_term:
    preferred_term: solid growth pattern
    term:
      id: NCIT:C36182
      label: Solid Growth Pattern
  evidence:
  - reference: PMID:41887253
    reference_title: >-
      Embryonal Carcinoma Involving the Ovary: A Morphologic Study of 55 Tumors
      Almost Never Pure, But Common Within Malignant Mixed Germ Cell Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common microscopic patterns of the ECA were glandular (n = 24; 45%),
      solid (n = 19; 35%), papillary (n = 5; 9%), and micropapillary (n = 1; 2%).
    explanation: >-
      Gives the observed frequency of each architectural pattern in a 55-tumor series
      rather than an unranked list.
- name: Papillary Growth Pattern
  description: >-
    Papillary and micropapillary architecture is part of the embryonal carcinoma
    spectrum but is much less frequent than glandular or solid growth.
  finding_term:
    preferred_term: papillary growth pattern
    term:
      id: NCIT:C35911
      label: Papillary Growth Pattern
  evidence:
  - reference: PMID:41887253
    reference_title: >-
      Embryonal Carcinoma Involving the Ovary: A Morphologic Study of 55 Tumors
      Almost Never Pure, But Common Within Malignant Mixed Germ Cell Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      papillary (n = 5; 9%), and micropapillary (n = 1; 2%)
    explanation: >-
      Directly quantifies the papillary and micropapillary patterns as a minority of
      cases.
- name: Embryoid Bodies
  description: >-
    Embryoid bodies - structures recapitulating early embryonic organisation - or
    their remnants are a characteristic but not universal finding, present in
    roughly a quarter of ovarian tumors with an EC component; a diffuse embryoma
    pattern is less common still.
  evidence:
  - reference: PMID:41887253
    reference_title: >-
      Embryonal Carcinoma Involving the Ovary: A Morphologic Study of 55 Tumors
      Almost Never Pure, But Common Within Malignant Mixed Germ Cell Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Embryoid bodies, or remnants thereof, were present in 16 tumors (29%), and 6
      (11%) had a diffuse embryoma pattern.
    explanation: >-
      Quantifies embryoid bodies as present in a minority of cases, which is why they
      are curated as characteristic-when-present rather than diagnostic.
- name: Tumor Cell Necrosis
  description: >-
    Geographic necrosis and haemorrhage are typical of embryonal carcinoma and
    contribute to its heterogeneous imaging appearance and to acute presentations
    from intratumoral haemorrhage.
  finding_term:
    preferred_term: tumor cell necrosis
    term:
      id: NCIT:C35957
      label: Tumor Cell Necrosis
  evidence:
  - reference: PMID:41887253
    reference_title: >-
      Embryonal Carcinoma Involving the Ovary: A Morphologic Study of 55 Tumors
      Almost Never Pure, But Common Within Malignant Mixed Germ Cell Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      being predominantly solid and cystic with hemorrhagic necrosis
    explanation: >-
      Directly documents haemorrhagic necrosis as a gross and microscopic feature.
- name: OCT4/SOX2/CD30-Positive, SOX17-Negative Immunophenotype
  description: >-
    The diagnostic immunophenotype of invasive embryonal carcinoma is
    OCT4+/NANOG+/SOX2+/CD30+/SOX17-. The paired negatives matter as much as the
    positives: SOX17 positivity points to seminoma/GCNIS and CD117 positivity with
    CD30 negativity points to seminoma.
  diagnostic: true
  evidence:
  - reference: PMID:41988850
    reference_title: >-
      Immunophenotypic assessment of pure embryonal carcinoma and yolk sac tumour
      suggests that reprogramming to non-seminoma occurs outside the spermatogonial
      niche.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GCNIS associated with EC was consistently negative for CD30 and SOX2, and GCNIS
      associated with YST was consistently negative for FOXA2.
    explanation: >-
      Establishes that CD30 and SOX2 are acquired with the invasive EC phenotype and
      are absent from its own precursor lesion.
  - reference: PMID:11799147
    reference_title: >-
      CD30 and CD117 (c-kit) used in combination are useful for distinguishing
      embryonal carcinoma from seminoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings suggest that CD117 and CD30 immunohistochemistry used in
      combination represents a valuable tool for distinguishing seminoma from EC.
    explanation: >-
      Supports the paired-marker logic used in routine diagnostic practice.

genetic:
- name: Chromosome 12p gain / isochromosome 12p
  notes: >-
    Gain of 12p material, most commonly as isochromosome 12p, is the characteristic
    somatic cytogenetic alteration of post-pubertal (type II) germ cell tumors
    including embryonal carcinoma. It is a somatic, acquired change, not a heritable
    variant, and its presence distinguishes type II tumors from prepubertal-type
    (type I) tumors and from spermatocytic tumors. No single gene is bound here
    because the lesion is a whole-arm copy-number gain.
  relationship_type: SOMATIC_DRIVER
  evidence:
  - reference: PMID:38922953
    reference_title: >-
      Pathogenesis and pathobiology of testicular germ cell tumours: a view from a
      developmental biological perspective with guidelines for pathological
      diagnostics.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Types I and II GCT both show similar morphology, but are separated from each
      other by the detection of a GCNIS and an i12p in type II GCT.
    explanation: >-
      Establishes i(12p) as the discriminator between the prepubertal and
      post-pubertal germ cell tumor types, which is the boundary this entry's scope
      note draws.
- name: TP53
  notes: >-
    Unusually for a malignant solid tumor, treatment-naive germ cell tumors including
    embryonal carcinoma generally retain wild-type TP53, and the tumor cells express
    the protein at higher than normal levels. This is a permissive rather than a
    driver observation: it is the precondition for the p53/NOXA apoptotic
    hypersensitivity that makes the tumor curable.
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  relationship_type: MODIFIER
  evidence:
  - reference: PMID:21532991
    reference_title: >-
      p53 hypersensitivity is the predominant mechanism of the unique responsiveness
      of testicular germ cell tumor (TGCT) cells to cisplatin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast to many other solid tumors, most TGCTs not only harbor wild type
      (wt) p53 but also express this tumor suppressor protein in higher than normal
      levels.
    explanation: >-
      Directly states the wild-type-and-overexpressed TP53 status that underpins the
      chemosensitivity node.
- name: POU5F1
  notes: >-
    OCT3/4, encoded by POU5F1, is the master pluripotency transcription factor whose
    expression defines the embryonal carcinoma phenotype, sustains constitutive NOXA
    levels, and serves as the most reliable diagnostic marker in the
    post-chemotherapy setting. Its expression is a tumor-cell state, not a germline
    or somatic sequence variant.
  gene_term:
    preferred_term: POU5F1
    term:
      id: hgnc:9221
      label: POU5F1
  relationship_type: MODIFIER
  evidence:
  - reference: PMID:23302226
    reference_title: >-
      Cisplatin hypersensitivity of testicular germ cell tumors is determined by high
      constitutive Noxa levels mediated by Oct-4.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We identified Noxa as the only Bcl-2 family protein to be highly correlated with
      Oct-4 status and cisplatin sensitivity.
    explanation: >-
      Links OCT3/4 status to the specific effector (NOXA) through which it acts on
      chemosensitivity.
- name: NANOG
  notes: >-
    NANOG is abundantly expressed in GCNIS and in the GCNIS-derived tumors, strongly
    in both embryonal carcinoma and seminoma, and is absent from the differentiated
    somatic elements of teratoma. NANOG also lies on 12p, connecting the pluripotency
    program to the characteristic copy-number gain.
  gene_term:
    preferred_term: NANOG
    term:
      id: hgnc:20857
      label: NANOG
  relationship_type: MODIFIER
  evidence:
  - reference: PMID:15982323
    reference_title: >-
      Stem cell pluripotency factor NANOG is expressed in human fetal gonocytes,
      testicular carcinoma in situ and germ cell tumours.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We detected abundant expression of NANOG in CIS and in CIS-derived testicular
      tumours with marked differences; seminoma and embryonal carcinoma were strongly
      positive, differentiated somatic elements of teratoma were negative.
    explanation: >-
      Gives the differential expression pattern across the histologies, which is what
      makes NANOG informative rather than merely present.
- name: KITLG
  notes: >-
    KITLG is the most-studied common susceptibility locus for testicular germ cell
    tumor, one of a large set of loci identified by genome-wide association studies
    that together account for a substantial share of the disease's heritability. Two
    caveats are curated deliberately. First, susceptibility is measured at the level
    of germ cell tumor as a whole, not the embryonal carcinoma histology. Second, the
    KITLG signal is not uniform across variants: meta-analysis supported rs995030
    while finding the data insufficient to confirm rs4474514. No single-gene germline
    test is part of the routine diagnostic workup.
  gene_term:
    preferred_term: KITLG
    term:
      id: hgnc:6343
      label: KITLG
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:31612386
    reference_title: >-
      Association between KITLG Gene Polymorphisms and Testicular Germ Cell Tumors: A
      Systematic Review and Meta-analysis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with adenine (A), KITLG rs995030 guanine (G) might be associated with
      increased risk of TGCT. There are insufficient data to fully confirm the
      association between KITLG rs4474514 and TGCT susceptibility.
    explanation: >-
      A systematic review and meta-analysis states both the supported KITLG variant
      association and its own limits. Marked PARTIAL because the association is with
      testicular germ cell tumor overall rather than the embryonal carcinoma
      histology, and because the authors hedge the effect.
  - reference: PMID:34301922
    reference_title: Identification of 22 susceptibility loci associated with testicular germ cell tumors.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This meta-analysis identifies 22 TGCT susceptibility loci, bringing the total to
      78, which account for 44% of disease heritability.
    explanation: >-
      Quantifies the polygenic susceptibility landscape into which KITLG falls.
      Marked PARTIAL because the meta-analysis reports loci for testicular germ cell
      tumor as a whole and does not resolve them to the embryonal carcinoma histology.

prevalence:
- population: Klinefelter syndrome cohort, UK dedicated clinic, 2019-2025
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: UNKNOWN
  rate_per_100000: 12.0
  notes: >-
    Extragonadal (mediastinal) germ cell tumor incidence in a 233-patient Klinefelter
    cohort over 8311 person-years, against roughly 0.04 per 100,000 in the general
    population. This is an occurrence figure for extragonadal germ cell tumor as a
    group in a high-risk population, not for embryonal carcinoma specifically; it is
    retained as the quantitative anchor for the Klinefelter/extragonadal association
    rather than as an EC rate.
  evidence:
  - reference: PMID:41789737
    reference_title: Incidence of Gonadal and Extragonadal Germ Cell Tumours in Patients With Klinefelter Syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the incidence of mediastinal EGCT in KS was 12.0 per 100,000 patient-years
    explanation: >-
      Quantifies the mediastinal extragonadal germ cell tumor rate in Klinefelter
      syndrome. PARTIAL because the histology of the single observed case is not
      resolved to embryonal carcinoma.

treatments:
- name: Radical Inguinal Orchiectomy
  description: >-
    Removal of the testis through an inguinal approach is simultaneously the
    diagnostic procedure that establishes the histology and, for most testis-confined
    tumors, the curative local treatment.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: radical inguinal orchiectomy
    term:
      id: NCIT:C15288
      label: Orchiectomy
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inguinal orchiectomy is the main diagnostic procedure, and is also curative for
      most localized tumors, while patients with unfavorable risk factors for recur
    explanation: >-
      A national society guideline states both the diagnostic and curative roles of
      orchiectomy and introduces the risk-factor-driven trigger for adjuvant treatment.
- name: BEP Combination Chemotherapy
  description: >-
    Bleomycin, etoposide and cisplatin is the standard combination regimen. It
    exploits the exceptional platinum sensitivity conferred by embryonal carcinoma's
    poor interstrand-crosslink repair and primed p53/NOXA apoptotic response. Cycle
    number is set by IGCCCG risk group; EP or VIP substitute where bleomycin must be
    avoided; TIP and high-dose chemotherapy are salvage options.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
    - preferred_term: bleomycin
      term:
        id: CHEBI:22907
        label: bleomycin
  regimen_term:
    preferred_term: BEP regimen
    term:
      id: NCIT:C63488
      label: BEP Regimen
  target_mechanisms:
  - target: Exceptional Cisplatin Chemosensitivity
    treatment_effect: ACTIVATES
    description: >-
      Platinum-based chemotherapy converts embryonal carcinoma's crosslink-repair
      deficit and apoptotic priming into tumor-cell death, activating the apoptotic
      response that the pluripotent cellular context has primed.
    evidence:
    - reference: PMID:20846399
      reference_title: >-
        Cisplatin sensitivity of testis tumour cells is due to deficiency in
        interstrand-crosslink repair and low ERCC1-XPF expression.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Our data indicate for the first time that the exceptional sensitivity of TTC
        and, therefore, very likely the curability of TGCT rests on their limited ICL
        repair due to low level of expression of ERCC1-XPF.
      explanation: >-
        Connects the molecular vulnerability node to the clinical curability that
        platinum chemotherapy delivers.
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BEP is the most recommended chemotherapy, but other schedules such as EP or VIP
      may be used to avoid bleomycin in some patients.
    explanation: >-
      Establishes BEP as the guideline-recommended regimen and names the accepted
      alternatives.
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Salvage treatment for these patients includes conventional-dose chemotherapy
      (TIP) and/or high-dose chemotherapy, although the best regimen and strategy for
      each subgroup of patients is not yet well established.
    explanation: >-
      Records the salvage options together with the guideline's own statement that the
      optimal salvage strategy remains unsettled.
- name: Retroperitoneal Lymph Node Dissection
  description: >-
    Retroperitoneal lymphadenectomy is used for nodal disease, as a risk-adapted
    alternative to adjuvant chemotherapy in high-risk clinical stage I non-seminoma,
    and to resect residual masses after chemotherapy - the last because residual
    teratoma is chemoresistant and must be removed surgically.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: retroperitoneal lymph node dissection
    term:
      id: NCIT:C15275
      label: Lymphadenectomy
  evidence:
  - reference: PMID:35906286
    reference_title: >-
      Prognostic factors in patients with clinical stage I nonseminoma-beyond
      lymphovascular invasion: a systematic review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Established adjuvant treatment options to reduce the risk of relapse are
      adjuvant chemotherapy with one cycle of bleomycin, etoposide and cisplatin (BEP)
      or nerve-sparing modified retroperitoneal lymphadenectomy (nsRPLND).
    explanation: >-
      Names retroperitoneal lymphadenectomy as one of the two established adjuvant
      options in clinical stage I non-seminoma.
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management of residual masses after chemotherapy differs between patients with
      seminoma and non-seminoma tumors.
    explanation: >-
      Supports distinct post-chemotherapy residual-mass management for non-seminoma.
      Marked PARTIAL because the quoted sentence states the difference without
      specifying the surgical procedure.
- name: Surveillance After Orchiectomy
  description: >-
    Active surveillance rather than immediate adjuvant treatment is offered to
    clinical stage I patients without adverse pathology. Because embryonal-carcinoma
    predominance and lymphovascular invasion raise both the rate and the speed of
    relapse, this is precisely the decision that the EC percentage in the orchiectomy
    specimen informs.
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:25888612
    reference_title: >-
      A refined risk stratification scheme for clinical stage 1 NSGCT based on
      evaluation of both embryonal predominance and lymphovascular invasion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Active surveillance is an increasingly accepted approach for managing patients
      with germ-cell tumors (GCTs) after an orchiectomy.
    explanation: >-
      Establishes surveillance as an accepted post-orchiectomy management strategy.
  - reference: PMID:25888612
    reference_title: >-
      A refined risk stratification scheme for clinical stage 1 NSGCT based on
      evaluation of both embryonal predominance and lymphovascular invasion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NSGCT patients grouped by a risk score system based on EmbP and LVI yielded
      three groups with distinct relapse patterns
    explanation: >-
      Supports using the embryonal-predominance/lymphovascular-invasion score to
      stratify who is a reasonable surveillance candidate.
- name: Brentuximab Vedotin (CD30-Directed Antibody-Drug Conjugate)
  description: >-
    Embryonal carcinoma's near-uniform CD30 expression made the CD30-directed
    antibody-drug conjugate brentuximab vedotin a rational targeted candidate. It
    did not work. A dedicated phase II trial in relapsed/refractory germ cell tumor
    produced no partial or complete responses, in CD30-positive or CD30-negative
    patients. This treatment is retained as a curated negative result: a
    well-motivated biomarker-to-target inference that failed clinically, and it should
    not be presented as an available therapy.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:34031784
    reference_title: "Phase II trial of brentuximab vedotin in relapsed/refractory germ cell tumors."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were two grade 3 treatment-related adverse events. No partial or complete
      responses were observed.
    explanation: >-
      The trial's primary efficacy result directly refutes single-agent activity of
      the CD30-directed agent in this setting.
  - reference: PMID:34031784
    reference_title: "Phase II trial of brentuximab vedotin in relapsed/refractory germ cell tumors."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brentuximab vedotin does not appear to have clinically meaningful single-agent
      activity in patients with refractory GCT.
    explanation: >-
      The authors' own conclusion, quoted so the negative result is not softened in
      curation.

diagnosis:
- name: Integrated Morphology and Immunohistochemistry
  description: >-
    Diagnosis rests on architecture and cytology confirmed by an immunohistochemical
    panel. The informative panel is a set of paired positives and negatives:
    OCT4/NANOG establish a pluripotent germ cell tumor; SOX2 and CD30 select embryonal
    carcinoma within that group; SOX17 or CD117 positivity with CD30 negativity points
    instead to seminoma. In post-chemotherapy metastatic specimens CD30 is unreliable
    and OCT4 should be used.
  diagnosis_term:
    preferred_term: Histopathologic Examination
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  evidence:
  - reference: PMID:41988850
    reference_title: >-
      Immunophenotypic assessment of pure embryonal carcinoma and yolk sac tumour
      suggests that reprogramming to non-seminoma occurs outside the spermatogonial
      niche.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GCNIS associated with pure testicular YST and EC was assessed using OCT4, FOXA2
      (only YST), CD30 (only EC), SOX2 (only EC), SOX17, and NANOG immunohistochemistry.
    explanation: >-
      Names the panel members and which are EC-selective, which is the structure of
      the diagnostic algorithm.
  - reference: PMID:16733205
    reference_title: >-
      OCT4 is superior to CD30 in the diagnosis of metastatic embryonal carcinomas
      after chemotherapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nineteen (76%) of 25 cases revealed diffuse, moderate to strong nuclear OCT4
      staining in postchemotherapy embryonal carcinomas.
    explanation: >-
      Gives the measured post-chemotherapy sensitivity of OCT4 that justifies
      preferring it over CD30 in that setting.
- name: Serum Tumor Markers and IGCCCG Risk Classification
  description: >-
    AFP, beta-hCG and LDH are measured before orchiectomy and monitored serially.
    Their degree of elevation, together with primary site and the presence of
    non-pulmonary visceral metastases, assigns metastatic non-seminoma to an IGCCCG
    prognostic group that determines treatment intensity. Insufficient marker decline
    on treatment is itself an adverse prognostic signal.
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with persistent markers after orchiectomy or advanced disease at
      diagnosis should be staged and classified according to the IGCCCG prognostic
      classification.
    explanation: >-
      Establishes the marker-driven trigger for IGCCCG classification in guideline
      practice.

differential_diagnoses:
- name: Seminoma
  description: >-
    Solid-pattern embryonal carcinoma is the classic mimic of seminoma on light
    microscopy, and the distinction changes both treatment and prognosis. It is
    resolved by immunohistochemistry rather than by morphology alone.
  distinguishing_features:
  - Embryonal carcinoma is CD30-positive and CD117-negative; seminoma is the converse.
  - SOX2 is expressed by embryonal carcinoma; SOX17 marks seminoma and GCNIS.
  - Both are OCT4- and NANOG-positive, so the pluripotency markers do not separate them.
  evidence:
  - reference: PMID:11799147
    reference_title: >-
      CD30 and CD117 (c-kit) used in combination are useful for distinguishing
      embryonal carcinoma from seminoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In light microscopic examination, seminoma may sometimes be difficult to
      distinguish from the solid pattern of embryonal carcinoma (EC).
    explanation: >-
      States the morphologic difficulty that makes this the primary differential.
- name: Yolk sac tumor
  description: >-
    Yolk sac tumor is the histology most often admixed with embryonal carcinoma and
    is also a differential in its own right, particularly for glandular and papillary
    EC patterns.
  distinguishing_features:
  - Yolk sac tumor is OCT4- and NANOG-negative and SOX17/FOXA2-positive.
  - Embryonal carcinoma is OCT4- and NANOG-positive and FOXA2-negative.
  evidence:
  - reference: PMID:41988850
    reference_title: >-
      Immunophenotypic assessment of pure embryonal carcinoma and yolk sac tumour
      suggests that reprogramming to non-seminoma occurs outside the spermatogonial
      niche.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similarly, invasive YST adjacent to GCNIS was OCT4-/NANOG-/SOX17+/FOXA2+.
    explanation: >-
      Gives the yolk sac tumor immunophenotype that separates it from the EC
      phenotype quoted elsewhere in this entry.
- name: Undersampled malignant mixed germ cell tumor
  description: >-
    In the ovary especially, an apparently pure embryonal carcinoma is more often an
    inadequately sampled mixed germ cell tumor, or a non-germ-cell mimic. This is a
    sampling differential rather than a morphologic one and is resolved by additional
    blocks.
  distinguishing_features:
  - No pure ovarian embryonal carcinoma was found in the largest reported series.
  - Named mimics include yolk sac tumor, poorly fixed dysgerminoma, small cell carcinoma of hypercalcemic type, juvenile granulosa cell tumor, and high-grade surface epithelial carcinoma.
  evidence:
  - reference: PMID:41887253
    reference_title: >-
      Embryonal Carcinoma Involving the Ovary: A Morphologic Study of 55 Tumors
      Almost Never Pure, But Common Within Malignant Mixed Germ Cell Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many purported pure examples are likely undersampled MMGCTs or other tumor types
    explanation: >-
      Directly names the sampling pitfall that makes this a required differential.

discussions:
- discussion_id: ec_reprogramming_site
  kind: KNOWLEDGE_GAP
  prompt: >-
    Where and when does the reprogramming from the GCNIS/seminoma-like state to the
    embryonal carcinoma phenotype occur, and what triggers it?
  attaches_to:
  - "pathophysiology#Retained Pluripotency Program"
  rationale: >-
    In pure embryonal carcinoma the adjacent GCNIS uniformly lacks CD30 and SOX2 while
    the invasive and intratubular tumor uniformly expresses them. The authors read this
    as reprogramming occurring outside the spermatogonial niche, but the observation is
    a static immunophenotypic snapshot of adjacent compartments; it constrains where
    reprogramming has already happened without establishing when or by what mechanism.
    The trigger that converts a SOX17-positive GCNIS cell into a SOX2/CD30-positive EC
    cell is not identified.
  evidence:
  - reference: PMID:41988850
    reference_title: >-
      Immunophenotypic assessment of pure embryonal carcinoma and yolk sac tumour
      suggests that reprogramming to non-seminoma occurs outside the spermatogonial
      niche.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Assessment of transcription factors involved in the induction and maintenance of
      EC and YST phenotypes suggests that, in pure non-seminomas, reprogramming occurs
      outside the spermatogonial niche.
    explanation: >-
      The authors' conclusion is framed as a suggestion, and the gap is that the
      mechanism and timing remain unresolved.
- discussion_id: ec_12p_invasion_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what mechanism does the near-universal 12p gain drive the transition from GCNIS
    to invasive germ cell tumor?
  attaches_to:
  - "pathophysiology#Chromosome 12p Gain and Invasive Transformation"
  rationale: >-
    12p gain is the most reproducible genomic finding in post-pubertal germ cell
    tumors and marks the in-situ-to-invasive step, yet the mechanism connecting the
    copy-number gain to invasiveness is unresolved. Several candidate dosage-sensitive
    genes are proposed but none has been established as the effector. This matters for
    curation because the causal edge from the 12p node is asserted at the strength the
    literature supports, not as a settled mechanism.
  evidence:
  - reference: PMID:30533005
    reference_title: "Testicular Germ Cell Tumors: A Cytogenomic Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanism that associates the gain of 12p and the development of
      invasiveness is not yet well understood
    explanation: >-
      An explicit statement of the open question by a review of the cytogenomics.
- discussion_id: ec_telomerase_direction
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does telomerase reactivation function as a replicative-immortality mechanism in
    embryonal carcinoma, and why is low hTERT associated with worse behaviour?
  attaches_to:
  - "pathophysiology#Retained Pluripotency Program"
  rationale: >-
    Most cancers upregulate telomerase, and the cancer-hallmark framing would predict
    high hTERT marking aggressive embryonal carcinoma. The one EC-specific tissue
    microarray study found the opposite direction: low hTERT protein was associated
    with advanced pT stage, tunica vaginalis invasion, and worse disease-specific and
    progression-free survival. Until this is reconciled, this entry does not declare
    conformance to the enabling_replicative_immortality module.
  evidence:
  - reference: PMID:32681293
    reference_title: >-
      Low level expression of human telomerase reverse transcriptase predicts
      cancer-related death and progression in embryonal carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In embryonal carcinoma, low level expression of hTERT protein was significantly
      associated with advanced pT stage (P = 0.023) as well as tunica vaginalis
      invasion (P = 0.043).
    explanation: >-
      Reports the direction of the hTERT-aggressiveness association in embryonal
      carcinoma specifically, which is the basis for withholding module conformance.


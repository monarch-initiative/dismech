biochemical:
- name: OCT3/4 Nuclear Expression
  biomarker_term:
    preferred_term: POU Domain, Class 5, Transcription Factor 1
    term:
      id: NCIT:C61142
      label: POU Domain, Class 5, Transcription Factor 1
  notes: >-

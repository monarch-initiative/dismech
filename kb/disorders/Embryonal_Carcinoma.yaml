- name: Intact Apoptotic Apparatus with Limited DNA Repair Capacity
  description: >-
    Unlike most solid tumours, embryonal carcinoma and its sibling germ cell tumour
    histologies retain wild-type TP53 and an unusually low apoptotic threshold, while
    having limited capacity to repair platinum-induced DNA adducts. Cisplatin therefore
    produces persistent DNA damage in a cell that is primed to die, and both the death
    receptor (FAS/FASL) and the mitochondrial (Bax/Noxa versus Bcl-2) apoptotic pathways
    are strongly engaged. Experimentally, p53 levels move inversely to OCT4, SOX2 and
    NANOG on cisplatin exposure, tying the chemosensitivity directly to the pluripotency
    state rather than to a separate lesion.
  biological_scale: MOLECULAR
  biological_processes:

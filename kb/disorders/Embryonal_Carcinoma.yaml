    reflecting obstruction of CSF pathways at the pineal region.
  phenotype_term:
    preferred_term: Increased intracranial pressure
    term:
      id: HP:0002516
      label: Increased intracranial pressure
  subtype: CNS EC
  evidence:
  - reference: PMID:26191277
    reference_title: "Extragonadal malignant germ cell tumors: a clinicopathological and immunohistochemical analysis of 48 cases at a single Chinese institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Headache, visual disturbances, endocrine abnormalities, and signs of increased
      intracranial pressure were common clinical symptoms in CNS MGCTs.
    explanation: >-
      Documents raised intracranial pressure as a common presentation of CNS malignant

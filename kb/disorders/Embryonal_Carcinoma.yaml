- name: Exceptional Cisplatin Chemosensitivity
  description: >-
    The practical consequence of the preceding node: even metastatic germ cell tumours,
    including embryonal carcinoma, are cured in the great majority of patients with
    cisplatin-based combination chemotherapy. This is the mechanistic inverse of the
    apoptosis evasion that characterises most solid tumours, and it is the reason
    chemotherapy - rather than a targeted agent - remains the backbone of treatment
    despite the near-universal 12p and KRAS dosage lesion.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: cellular response to cisplatin
    term:
      id: GO:0072719
      label: cellular response to cisplatin
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:37175579
    reference_title: "Breaking the Mold: Epigenetics and Genomics Approaches Addressing Novel Treatments and Chemoresponse in TGCT Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Testicular germ-cell tumors (TGCT) have been widely recognized for their
      outstanding survival rates, commonly attributed to their high sensitivity to
      cisplatin-based therapies
    explanation: >-
      Confirms the clinical outcome that this node asserts follows from the intact
      apoptotic apparatus.
  downstream:
  - target: Acquired Cisplatin Resistance
    description: >-
      A minority of tumours escape this sensitivity through TP53 pathway inactivation or
      somatic-type transformation.
- name: Acquired Cisplatin Resistance
  description: >-
    The escape branch. A minority of germ cell tumours become platinum-refractory, and
    the alterations associated with that transition are the ones that break the intact
    p53/apoptosis axis: TP53 mutation, MDM2 amplification, and epigenetic reprogramming,
    frequently in the setting of somatic-type malignant transformation. TP53 mutation is
    markedly enriched in mediastinal (extragonadal) tumours, matching their worse
    prognosis.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  biological_processes:
  - preferred_term: intrinsic apoptotic signaling pathway in response to DNA damage
    modifier: DECREASED
    term:
      id: GO:0008630
      label: intrinsic apoptotic signaling pathway in response to DNA damage
  evidence:
  - reference: PMID:41384700
    reference_title: "Molecular pathology of testicular germ cell tumours: an update for practicing pathologists."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alterations associated with the formation of a somatic-type malignancy and/or the
      development of cisplatin resistance include TP53 mutations or MDM2 gene
      amplifications as well as epigenetic alterations.
    explanation: >-
      Names the specific alterations that underlie loss of the platinum sensitivity
      modelled upstream.
  - reference: PMID:36030288
    reference_title: "Molecular correlates of male germ cell tumors with overgrowth of components resembling somatic malignancies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KRAS and TP53 mutations were identified by DNA sequencing in 28% of cases each,
      with enrichment of TP53 mutations in mediastinal tumors (86%).
    explanation: >-
      Quantifies TP53 mutation in germ cell tumours with somatic-type malignancy and its
      mediastinal enrichment.
histopathology:
- name: Glandular and Solid Growth Pattern
  finding_term:
    preferred_term: Glandular Pattern
    term:
      id: NCIT:C35929
      label: Glandular Pattern
  description: >-
    Embryonal carcinoma grows in solid sheets and in glandular (pseudoglandular)
    formations of primitive epithelial-appearing cells.
- name: Pseudopapillary Architecture
  finding_term:
    preferred_term: Pseudopapillary Pattern
    term:
      id: NCIT:C35912
      label: Pseudopapillary Pattern
  description: >-
    Pseudopapillary structures, formed where tumour cells drape over stromal cores or
    around necrotic centres, are part of the architectural repertoire named in the NCI
    Thesaurus definition of embryonal carcinoma that MONDO adopts.
- name: Geographic Coagulative Necrosis
  finding_term:
    preferred_term: Coagulative Necrosis
    term:
      id: NCIT:C39608
      label: Coagulative Necrosis
  description: >-
    Broad confluent zones of coagulative (geographic) necrosis are characteristic and
    reflect the tumour outgrowing its blood supply.
- name: High Mitotic Rate
  finding_term:
    preferred_term: Increased Mitotic Activity
    term:
      id: NCIT:C163732
      label: Increased Mitotic Activity
  description: >-
    Brisk mitotic activity, including atypical mitoses, is a constant feature and part of
    the high-grade nuclear picture that defines the diagnosis.
- name: OCT3/4-Positive, SOX2-Positive, CD30-Positive Immunophenotype
  diagnostic: true
  frequency: VERY_FREQUENT
  description: >-
    The diagnostic immunoprofile. OCT3/4 is shared with seminoma/germinoma and GCNIS;
    SOX2 and CD30 are what mark the tumour as embryonal carcinoma rather than seminoma,
    and SOX17 is negative in EC while positive in seminoma. Cytokeratin and EMA are also
    positive, unlike in seminoma.
  evidence:
  - reference: PMID:19396148
    reference_title: "Testicular mixed germ cell tumors: a morphological and immunohistochemical study using stem cell markers, OCT3/4, SOX2 and GDF3, with emphasis on morphologically difficult-to-classify areas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SOX2 is expressed in embryonal carcinoma and primitive neuroectoderm of teratoma,
      and unlike OCT3/4, not in intra-tubular germ cell neoplasia and seminoma
    explanation: >-
      Establishes SOX2 as the discriminating marker between embryonal carcinoma and
      seminoma/GCNIS.
  - reference: PMID:26191277
    reference_title: "Extragonadal malignant germ cell tumors: a clinicopathological and immunohistochemical analysis of 48 cases at a single Chinese institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CD30, EMA and CK AE1/3 staining were positive in embryonal carcinoma.
    explanation: >-
      Documents the CD30, EMA and cytokeratin positivity of embryonal carcinoma in an
      extragonadal series.
  - reference: PMID:32205480
    reference_title: "Report From the International Society of Urological Pathology (ISUP) Consultation Conference on Molecular Pathology of Urogenital Cancers: IV: Current and Future Utilization of Molecular-Genetic Tests for Testicular Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the most commonly used immunomarker panel includes OCT3/4, placental alkaline
      phosphate, D2-40, SALL4, CD117, and CD30 for GCTs and the documentation of germ
      cell neoplasia in situ (GCNIS)
    explanation: >-
      Consensus statement placing OCT3/4 and CD30 in the routine germ cell tumour
      immunopanel.
phenotypes:
- category: Neoplastic
  name: Testicular Mass
  description: >-
    A painless or mildly tender testicular mass is the usual presentation of testicular
    embryonal carcinoma, most often within a mixed non-seminomatous germ cell tumour.
  phenotype_term:
    preferred_term: Testicular neoplasm
    term:
      id: HP:0010788
      label: Testicular neoplasm
  subtype: Testicular EC
  evidence:
  - reference: PMID:38922953
    reference_title: "Pathogenesis and pathobiology of testicular germ cell tumours: a view from a developmental biological perspective with guidelines for pathological diagnostics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Type II GCT include seminoma, embryonal carcinoma, choriocarcinoma,
      postpubertal-type teratoma and postpubertal-type YST.
    explanation: >-
      Supports embryonal carcinoma as a testicular germ cell tumour histology presenting
      as a testicular neoplasm.
- category: Neoplastic
  name: Ovarian Mass
  description: >-
    Ovarian embryonal carcinoma presents as a large, unilateral, predominantly solid
    adnexal mass with inhomogeneous echogenicity and abundant vascularity on ultrasound,
    typically in a girl or young woman.
  phenotype_term:
    preferred_term: Ovarian neoplasm
    term:
      id: HP:0100615
      label: Ovarian neoplasm
  subtype: Ovarian EC
  evidence:

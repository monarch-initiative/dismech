name: Embryonal Carcinoma
creation_date: "2026-08-18T00:00:00Z"
description: >-
  Embryonal carcinoma (EC) is a malignant, non-seminomatous germ cell tumour composed of
  primitive epithelial-appearing cells growing in solid, glandular and pseudopapillary
  patterns with high-grade nuclei, brisk mitotic activity and geographic necrosis. It is
  the least differentiated and most pluripotent of the germ cell tumour histologies: EC
  cells retain an embryonic-stem-cell-like transcriptional programme (OCT3/4/POU5F1,
  SOX2, NANOG, LIN28) and can differentiate into the other germ cell tumour lineages,
  which is why EC is the most common component of post-pubertal mixed germ cell tumours
  and is only rarely encountered in pure form. Like other GCNIS-derived (type II) germ
  cell tumours it carries isochromosome 12p or another form of 12p gain as its
  near-universal cytogenetic lesion. EC arises most often in the testis, less commonly in
  the ovary, and at extragonadal midline sites including the central nervous system and
  mediastinum. Its immunophenotype (OCT3/4-positive, SOX2-positive, CD30-positive,
  SOX17-negative) is what separates it from seminoma/germinoma. Clinically EC is
  aggressive - a high proportion of EC in an orchiectomy specimen predicts occult
  metastatic disease - yet it is also exceptionally curable, because retained wild-type
  TP53, limited DNA repair capacity and an intact apoptotic apparatus make it profoundly
  sensitive to cisplatin-based combination chemotherapy.

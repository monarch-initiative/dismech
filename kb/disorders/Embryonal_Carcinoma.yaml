- name: Lymphovascular Invasion and Early Metastatic Dissemination
  description: >-
    Embryonal carcinoma is the most aggressive of the ordinary non-seminomatous
    histologies with respect to early spread. In clinical stage I non-seminoma, either
    lymphovascular invasion or a high proportion of embryonal carcinoma in the
    orchiectomy specimen identifies patients who harbour occult retroperitoneal or
    haematogenous metastases despite negative staging, and these two features are the
    basis of risk-adapted management (surveillance versus retroperitoneal lymph node
    dissection versus adjuvant chemotherapy).
  biological_scale: TISSUE

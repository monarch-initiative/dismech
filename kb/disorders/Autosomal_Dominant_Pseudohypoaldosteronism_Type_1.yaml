    snippet: "NR3C2 | nuclear receptor subfamily 3 group C member 2 | hgnc:7979 | Disease-causing germline mutation(s) (loss of function) in"
    explanation: Orphanet lists germline loss-of-function NR3C2 variants as disease-causing.
  - reference: PMID:28804203
    reference_title: "Clinical features and molecular basis of pseudohypoaldosteronism type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mutations are found in all exons and there is no mutation hot spot. Nonsense and frameshift mutations leading to premature stop codon are the most frequent."
    explanation: Review summary of the NR3C2 allelic spectrum.

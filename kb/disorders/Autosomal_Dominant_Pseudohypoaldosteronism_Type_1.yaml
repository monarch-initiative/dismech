      snippet: "These findings indicate that the increased MR expression with advancing age may compensate for the haploinsufficiency of MR caused by NR3C2 mutations."
      explanation: Review proposes that rising MR expression with age explains remission; stated as a hypothesis.
- name: Renal Mineralocorticoid Resistance
  description: >-
    With reduced MR dosage, principal cells of the aldosterone-sensitive
    distal nephron and collecting duct respond poorly to aldosterone. The
    resistance is limited to the kidney, unlike the systemic resistance of
    ENaC-related PHA1.

    - reference: CGGV:assertion_8c78e824-d77d-4635-a181-6139b8e9c028-2021-07-15T023000.000Z
      reference_title: "NR3C2 / autosomal dominant pseudohypoaldosteronism type 1 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "NR3C2 | HGNC:7979 | autosomal dominant pseudohypoaldosteronism type 1 | MONDO:0008329 | AD | Definitive"
      explanation: ClinGen Tubulopathy GCEP classifies NR3C2 for this disease as Definitive, autosomal dominant.
  notes: >-
    Variants occur throughout the gene with no hot spot; nonsense and
    frameshift alleles are the most common, with fewer missense alleles in the
    DNA-binding and ligand-binding domains. Intragenic and larger deletions
    account for a minority and are missed by sequencing, so deletion or
    duplication testing is needed when sequencing is negative. A
    gain-of-function NR3C2 allele causes a different disease (early-onset
    hypertension exacerbated in pregnancy), which ClinGen curates separately.
  evidence:
  - reference: PMID:9662404
    reference_title: "Mutations in the mineralocorticoid receptor gene cause autosomal dominant pseudohypoaldosteronism type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we have screened the mineralocorticoid receptor gene (MLR) for variants and have identified heterozygous mutations in one sporadic and four dominant kindreds."
    explanation: Gene discovery report for NR3C2 in dominant and sporadic PHA1.
  - reference: PMID:16972228
    reference_title: "Mineralocorticoid receptor mutations are the principal cause of renal type 1 pseudohypoaldosteronism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 22 MR gene abnormalities were found in 33 patients."
    explanation: Comprehensive screening including large deletions found MR abnormalities in most renal PHA1 patients.
  - reference: ORPHA:171871
    reference_title: "Renal pseudohypoaldosteronism type 1"
    supports: SUPPORT

classifications:
  harrisons_chapter:
  - classification_value: KIDNEY_URINARY_TRACT
    notes: >-
      Kidney-restricted distal nephron mineralocorticoid resistance presenting
      with neonatal renal salt wasting, hyponatremia, hyperkalemia, and
      metabolic acidosis.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      Primary hormone-receptor resistance disorder of aldosterone/MR signaling
      with compensatory lifelong hyperaldosteronism and HPA-axis feedback
      alteration.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Mendelian autosomal dominant disorder caused by heterozygous germline
      NR3C2 loss-of-function variants.
notes: >-
  The name keeps the MONDO label. No NR3C2-related form of the name appears
  among the MONDO synonyms, the ClinGen label or a GeneReviews title. No
  GeneReviews chapter covers PHA1 or NR3C2; the only Bookshelf hit for
  pseudohypoaldosteronism is the Type II chapter, which is a different
  disease. The phenotype baseline is therefore Orphanet ORPHA:171871, the
  ClinGen curation summary, the gene-discovery and cohort papers, and case
  reports. Neonatal hyperbilirubinemia, reported as the presenting sign in a
  single 2026 case (PMID:42146936), is not recorded as a phenotype from one
  report.
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Heterozygous NR3C2 variants. Many are inherited from a parent who is
    asymptomatic or was only mildly affected, and a substantial minority arise
    de novo, so a negative family history does not exclude the diagnosis.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:9662404
    reference_title: "Mutations in the mineralocorticoid receptor gene cause autosomal dominant pseudohypoaldosteronism type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations segregate with PHA1 and are not found in unaffected subjects."
    explanation: Heterozygous NR3C2 mutations segregate with disease in dominant kindreds.
  - reference: PMID:38493321
    reference_title: "NR3C2 microdeletions-an underrecognized cause of pseudohypoaldosteronism type 1A: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Transmission modality frequency was familial (65%), de novo (20%), or unknown (15%)."
    explanation: In 40 individuals with NR3C2 microdeletions most were familial and a fifth de novo.
  - reference: PMID:16611713
    reference_title: "Autosomal dominant pseudohypoaldosteronism type 1: mechanisms, evidence for neonatal lethality, and phenotypic expression in adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein are described six novel adPHA1-causing MR mutations (four de novo)"
    explanation: De novo NR3C2 mutations are frequent among affected individuals.

diagnosis:
- name: Biochemical and hormonal profile
  description: >-
    Neonatal hyponatremia, hyperkalemia and metabolic acidosis with very high
    plasma renin and aldosterone suggest PHA1, once adrenal causes are
    excluded with cortisol, 17-hydroxyprogesterone and a urinary steroid
    profile, and secondary PHA1 with urine culture and renal ultrasound.
  diagnosis_term:
    preferred_term: Electrolyte Measurement
    term:
      id: NCIT:C74946
      label: Electrolyte Measurement
  evidence:
  - reference: PMID:24616761
    reference_title: "Pseudohypoaldosteronism type 1: clinical features and management in infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with type 1 PHA are likely to present in the neonatal period with hyponatraemia, hyperkalaemia and metabolic acidosis and can be diagnosed by the significantly elevated plasma renin activity and aldosterone levels."
    explanation: Raised renin and aldosterone with the electrolyte pattern establish PHA1.
- name: NR3C2 molecular testing
  description: >-
    Sequencing of NR3C2 detects most variants; deletion/duplication analysis
    (MLPA or microarray) is required when sequencing is negative. Early
    genetic testing is advised because renal and systemic PHA1 cannot be told
    apart at presentation.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:38493321
    reference_title: "NR3C2 microdeletions-an underrecognized cause of pseudohypoaldosteronism type 1A: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Initial testing for PHA1A should rely on sequencing to detect the most common genetic alterations. Deletion/duplication analysis should be performed when initial testing is nondiagnostic."
    explanation: Recommended order of NR3C2 testing.
  - reference: PMID:31301676
    reference_title: "Phenotypic diversity and correlation with the genotypes of pseudohypoaldosteronism type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We advocate early genetic testing in patients with presumed PHA1, given the challenges in differentiating between patients with PHA1a and PHA1b."
    explanation: UK survey supports early genetic testing.
treatments:
- name: Sodium chloride supplementation
  description: >-
    Oral (or initially intravenous) sodium chloride replaces renal sodium
    losses and corrects the electrolyte disturbance. Requirements fall with
    age and supplementation can usually be stopped in early childhood.
    Starting salt from day 1 after a prenatal molecular diagnosis prevented
    the salt-wasting presentation in one infant.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium chloride
      term:
        id: CHEBI:26710
        label: sodium chloride
  target_mechanisms:
  - target: Extracellular Volume Depletion
    treatment_effect: RESTORES
    description: Replaces renal sodium and water losses.
    evidence:
    - reference: PMID:24616761
      reference_title: "Pseudohypoaldosteronism type 1: clinical features and management in infancy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Management of renal PHA type 1 is with sodium supplementation, and requirements often decrease with age."
      explanation: >-
        Sodium supplementation restores volume and sodium balance in renal
        PHA1.
  evidence:
  - reference: PMID:24616761
    reference_title: "Pseudohypoaldosteronism type 1: clinical features and management in infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Management of renal PHA type 1 is with sodium supplementation, and requirements often decrease with age."
    explanation: Sodium supplementation is the treatment of renal PHA1.
  - reference: PMID:16611713
    reference_title: "Autosomal dominant pseudohypoaldosteronism type 1: mechanisms, evidence for neonatal lethality, and phenotypic expression in adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "affected children's symptoms respond promptly to salt therapy, and treatment is not required after childhood."
    explanation: Prompt response to salt, and no treatment needed after childhood.
  - reference: PMID:40875734
    reference_title: "Prenatal Diagnosis of Autosomal Dominant Pseudohypoaldosteronism due to NR3C2 Gene Mutation: Immediate Postnatal Oral Saline Therapy Prevents the Clinical Manifestations Resulting from Impaired Salt Balance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prenatal genetic diagnosis and prompt salt supplementation after birth prevent the clinical manifestations resulting from salt wasting."
    explanation: Single case in which salt from birth prevented the salt-wasting presentation.
- name: Genetic counseling and family testing
  description: >-
    Because most variants are inherited from a mildly affected or
    asymptomatic parent, testing relatives (by NR3C2 analysis or by
    aldosterone level) identifies at-risk infants so salt can be started
    early.
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:38493321
    reference_title: "NR3C2 microdeletions-an underrecognized cause of pseudohypoaldosteronism type 1A: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Most NR3C2 microdeletions are parentally transmitted, thus highlighting the importance of familial genetic testing and counseling."
    explanation: Parental transmission makes family testing and counseling important.
  - reference: PMID:33017655
    reference_title: "Renin-aldosterone system evaluation over four decades in an extended family with autosomal dominant pseudohypoaldosteronism due to a deletion in the NR3C2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of the proposita led to early diagnosis and therapy in other affected family members, significantly mitigating the clinical course."
    explanation: Family diagnosis allowed early treatment of relatives.
differential_diagnoses:
- name: Systemic pseudohypoaldosteronism type 1
  description: >-
    Autosomal recessive PHA1 from biallelic SCNN1A, SCNN1B or SCNN1G variants
    gives the same neonatal picture but involves sweat glands, colon and
    airway, and persists through life.
  distinguishing_features:
  - Raised sweat sodium and chloride in systemic PHA1
  - Persistent, harder-to-control salt wasting in systemic PHA1
  evidence:
  - reference: PMID:9662404
    reference_title: "Mutations in the mineralocorticoid receptor gene cause autosomal dominant pseudohypoaldosteronism type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal dominant or sporadic PHA1 is a milder disease that remits with age."
    explanation: Contrasts the remitting dominant form with the severe recessive form.
  - reference: PMID:31301676
    reference_title: "Phenotypic diversity and correlation with the genotypes of pseudohypoaldosteronism type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It was impossible to differentiate between types of PHA1 from early clinical presentation or the biochemical and hormonal profile."
    explanation: The two forms cannot be separated at presentation.
- name: Secondary (transient) pseudohypoaldosteronism type 1
  description: >-
    Transient aldosterone resistance in young infants with urinary tract
    infection and/or urinary tract malformation. An NR3C2 deletion has been
    found in an infant first thought to have secondary PHA1, so a urinary
    trigger does not exclude the genetic form.
  distinguishing_features:
  - Urinary tract infection or malformation with resolution after its treatment
  - Normal aldosterone after recovery and in parents
  evidence:
  - reference: PMID:28804203
    reference_title: "Clinical features and molecular basis of pseudohypoaldosteronism type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The third type is the secondary PHA1, which is strongly associated with urinary tract infections and/or urinary tract malformations."
    explanation: Secondary PHA1 is associated with urinary infection or malformation.
  - reference: PMID:24455331
    reference_title: "Autosomal dominant pseudohypoaldosteronism type 1 in an infant with salt wasting crisis associated with urinary tract infection and obstructive uropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our case raises the possibility that some patients with secondary PHA1 attributed to UTI and/or UTM may instead have primary autosomal dominant PHA1, for which genetic testing should be considered to identify the cause, determine future recurrence risk, and possibly prevent the life-threatening salt wasting in a subsequent family member."
    explanation: Genetic PHA1A can masquerade as secondary PHA1.
- name: Congenital adrenal hyperplasia and other adrenal causes
  description: >-
    Salt-wasting congenital adrenal hyperplasia and adrenal hypoplasia give
    the same neonatal electrolyte pattern but with low aldosterone or abnormal
    cortisol and adrenal steroid results.
  distinguishing_features:
  - High rather than low aldosterone in PHA1
  - Normal cortisol and 17-hydroxyprogesterone in PHA1
  evidence:
  - reference: PMID:24616761
    reference_title: "Pseudohypoaldosteronism type 1: clinical features and management in infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The differential diagnosis of type 1 PHA includes adrenal disorders such as adrenal hypoplasia and congenital adrenal hyperplasia; thus, adrenal function including cortisol levels, 17-hydroxyprogesterone and a urinary steroid profile are required."
    explanation: Adrenal disorders must be excluded before PHA1 is diagnosed.
animal_models:
- name: Mineralocorticoid receptor knockout mouse
  species: Mouse
  genotype: Nr3c2-/- (germline targeted disruption)
  publication: PMID:9689096
  description: >-
    MR-null mice develop normally before birth, then in the first week
    develop hyperkalemia, hyponatremia, very high renin, angiotensin II and
    aldosterone, and die around day 10 from renal sodium and water loss.
  modeled_mechanisms:
  - target: Impaired Distal Nephron Sodium Reabsorption
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reproduces neonatal renal salt wasting with compensatory renin-aldosterone activation.
    limitations: >-
      The model is homozygous null and lethal, whereas the human disease is
      heterozygous and usually remits with salt. It therefore models complete
      MR loss rather than the haploinsufficiency that causes PHA1A.
    evidence:
    - reference: PMID:9689096
      reference_title: "Mineralocorticoid receptor knockout mice: pathophysiology of Na+ metabolism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "At day 8, -/- mice showed hyperkalemia, hyponatremia, and a strong increase in renin, angiotensin II, and aldosterone plasma concentrations."
      explanation: MR-null neonates show the electrolyte and hormone pattern of PHA1.

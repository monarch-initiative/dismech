    explanation: NR3C2 microdeletions need deletion/duplication testing to be found.
pathophysiology:
- name: NR3C2 Haploinsufficiency
  description: >-
    Heterozygous truncating, splice-site, deletion and missense NR3C2 variants
    remove or inactivate one copy of the mineralocorticoid receptor. Mutant
    receptors fail to bind aldosterone, to translocate to the nucleus or to
    activate transcription, or are rapidly degraded. Most tested mutants have
    no dominant-negative effect, so the disease is attributed to reduced
    receptor dosage.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: NR3C2
    term:
      id: hgnc:7979
      label: NR3C2
  molecular_functions:
  - preferred_term: mineralocorticoid receptor nuclear receptor activity
    modifier: DECREASED
    term:
      id: GO:0004879
      label: nuclear receptor activity
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:16611713
    reference_title: "Autosomal dominant pseudohypoaldosteronism type 1: mechanisms, evidence for neonatal lethality, and phenotypic expression in adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "evidence that haploinsufficiency of MR is sufficient to cause adPHA1"
    explanation: Human genetic and functional data show reduced MR dosage alone causes the disease.
  - reference: PMID:16954160
    reference_title: "Elucidating the underlying molecular pathogenesis of NR3C2 mutants causing autosomal dominant pseudohypoaldosteronism type 1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "S818L does not bind aldosterone or activate transcription or translocate into the nucleus."
    explanation: A PHA1A missense mutant abolishes aldosterone binding, nuclear translocation and transactivation.
  - reference: PMID:27725360
    reference_title: "A novel frameshift mutation in NR3C2 leads to decreased expression of mineralocorticoid receptor: a family with renal pseudohypoaldosteronism type 1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutation decreased the expression of MR, but not NR3C2 mRNA, and led to decreased MR function, with no dominant negative effect."
    explanation: A C-terminal frameshift lowers MR protein and function without a dominant-negative effect.
  downstream:
  - target: Renal Mineralocorticoid Resistance
    causal_link_type: DIRECT
  - target: Hypothalamic-Pituitary-Adrenal Axis Activation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24712576
      reference_title: "Activation of the hypothalamic-pituitary-adrenal axis in adults with mineralocorticoid receptor haploinsufficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Haploinsufficiency of MR in PHA1 causes HPA axis activation, providing genetic evidence that MR contributes to negative feedback in the human HPA axis."
      explanation: Case-control study of 12 adult NR3C2 carriers links MR haploinsufficiency to HPA activation.
- name: Low Neonatal Renal Mineralocorticoid Receptor Expression
  description: >-
    Healthy newborns have physiologically low renal MR expression despite
    high aldosterone, and expression rises after birth. This developmental
    window is the proposed reason that loss of one NR3C2 copy causes salt
    wasting in early infancy but is compensated later.
  biological_scale: TISSUE
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  evidence:
  - reference: PMID:19477942
    reference_title: "Low renal mineralocorticoid receptor expression at birth contributes to partial aldosterone resistance in neonates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study provides the first evidence for a low renal MR expression level at birth, despite high aldosterone levels, which could account for compromised postnatal sodium handling."
    explanation: Human and mouse developmental study showing low renal MR at birth.
  downstream:
  - target: Renal Mineralocorticoid Resistance
    causal_link_type: UNKNOWN

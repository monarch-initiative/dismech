progression:
- phase: Neonatal salt-wasting presentation
  age_range: First weeks of life
  notes: >-
    Presentation is usually in the neonatal period with weight loss, failure
    to thrive, vomiting and dehydration, together with hyponatremia,
    hyperkalemia, metabolic acidosis and high renin and aldosterone. Severity
    varies widely: some carriers never have symptoms, while infant deaths have
    been reported in affected kindreds.
  evidence:
  - reference: ORPHA:171871
    reference_title: "Renal pseudohypoaldosteronism type 1"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Typical presentation is in the neonatal period with weight loss, failure to thrive, vomiting and dehydration in association with hyponatremia, hyperkalemia and metabolic acidosis as well as elevated aldosterone and renin levels."
    explanation: Orphanet describes the neonatal salt-wasting presentation.
  - reference: PMID:33017655
    reference_title: "Renin-aldosterone system evaluation over four decades in an extended family with autosomal dominant pseudohypoaldosteronism due to a deletion in the NR3C2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease manifestations could be severe in infancy but improve after the age of 1-3 years. Some affected members are asymptomatic and remain so life-long."
    explanation: Severe infantile disease and lifelong asymptomatic carriers occur in one family.
  - reference: PMID:16611713
    reference_title: "Autosomal dominant pseudohypoaldosteronism type 1: mechanisms, evidence for neonatal lethality, and phenotypic expression in adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A number of cases of neonatal mortality in infants who were at risk for adPHA1 were identified"
    explanation: Neonatal deaths among at-risk infants in adPHA1 kindreds.
- phase: Clinical remission in early childhood
  age_range: 1-3 years
  notes: >-
    Salt supplementation usually becomes unnecessary by 1-3 years of age.
    Low renal MR expression at birth, rising afterwards, is the proposed
    reason the neonatal period is when one NR3C2 copy is not enough.
  evidence:
  - reference: PMID:28804203
    reference_title: "Clinical features and molecular basis of pseudohypoaldosteronism type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In the renal form of PHA1, salt supplementation generally becomes unnecessary by 1-3 yr of age."
    explanation: Review statement of the usual age at which treatment ends.
  - reference: PMID:16611713
    reference_title: "Autosomal dominant pseudohypoaldosteronism type 1: mechanisms, evidence for neonatal lethality, and phenotypic expression in adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "affected children's symptoms respond promptly to salt therapy, and treatment is not required after childhood."
    explanation: Treatment is not needed after childhood.
- phase: Adult biochemical compensation
  age_range: Adulthood
  notes: >-
    Adults are clinically indistinguishable from unaffected relatives, apart
    from lifelong raised aldosterone (renin falls with age) and, in case-control
    studies, increased salt appetite and raised cortisol. No adverse
    cardiovascular outcome was found despite the aldosterone excess.
  evidence:
  - reference: PMID:16611713
    reference_title: "Autosomal dominant pseudohypoaldosteronism type 1: mechanisms, evidence for neonatal lethality, and phenotypic expression in adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "adult patients with adPHA1 are clinically indistinguishable from their wild-type relatives except for presumably lifelong elevation of renin, angiotensin II, and aldosterone levels."
    explanation: Adult phenotype is limited to raised renin-angiotensin-aldosterone levels.
  - reference: PMID:23852419
    reference_title: "Cardiovascular effects of aldosterone: insight from adult carriers of mineralocorticoid receptor mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite life-long increase in plasma aldosterone and renin levels, no adverse cardiovascular outcome occurred in pseudohypoaldosteronism type 1, but rather an improved diastolic left ventricular function."
    explanation: Case-control study of 39 adult carriers found no adverse cardiovascular outcome.

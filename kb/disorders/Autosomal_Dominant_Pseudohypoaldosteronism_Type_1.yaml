name: Autosomal Dominant Pseudohypoaldosteronism Type 1
category: Mendelian
creation_date: "2026-11-06T13:09:10Z"
synonyms:
- PHA1A
- Renal pseudohypoaldosteronism type 1
- Renal PHA1
- Pseudohypoaldosteronism type I, autosomal dominant
- Autosomal dominant pseudohypoaldosteronism type 1
description: >-
  Autosomal dominant pseudohypoaldosteronism type 1 (PHA1A, renal PHA1) is a
  kidney-limited form of primary mineralocorticoid resistance caused by
  heterozygous loss-of-function variants in NR3C2, which encodes the
  mineralocorticoid receptor (MR). Most alleles truncate the receptor or delete
  part of the gene, and one working copy of NR3C2 is not enough for the
  aldosterone-sensitive distal nephron to reabsorb sodium normally in early
  life. Affected newborns present in the first weeks with vomiting, poor
  feeding, weight loss, dehydration, hyponatremia, hyperkalemia and metabolic
  acidosis, while plasma renin and aldosterone are very high. Sodium chloride
  supplementation corrects the disorder, and the need for it usually ends by
  1-3 years of age. Adults are usually asymptomatic but keep a raised
  aldosterone level for life, which identifies affected relatives. Variants
  are inherited or arise de novo, and expressivity varies within families,
  from neonatal death to lifelong absence of symptoms.

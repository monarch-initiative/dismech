animal_models:
- species: Mouse (Mus musculus)
  genotype: Bckdk knockout (Bckdk−/−)
  category: Knockout
  associated_phenotypes:
  - Reduced circulating and brain BCAAs
  - Growth retardation
  - Tremor, seizures, and hindlimb clasping
  - Impaired motor coordination during protein restriction
  description: >-
    Constitutive Bckdk-null mice reproduce the biochemical depletion and a
    reversible neurologic phenotype. Recent isotope-tracing work adds impaired
    BCAA-derived nitrogen delivery to brain and nutrient-stress-dependent motor
    dysfunction, while also showing relative skeletal-muscle resilience.
  evidence:
  - reference: PMID:22956686
    reference_title: Mutations in BCKD-kinase lead to a potentially treatable form of autism with epilepsy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Adults developed neurological abnormalities, such as tremors, epileptic
      seizures, and hindlimb clasping phenotypes observed in some other mouse
      models of autism spectrum disorders
    explanation: Documents the core neurologic phenotype of the knockout mouse.
  - reference: PMID:41587643
    reference_title: A metabolic basis for motor deficits in mice lacking BCKDK.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Bckdk KO showed normal grip strength but poor beam traversal and reduced
      wheel running during protein restriction.
    explanation: Establishes coordination and activity deficits under nutrient stress.
- species: Rat (Rattus norvegicus)
  genotype: Homozygous spontaneous Bckdk p.Gly369Glu frogleg allele
  category: Missense loss-of-function model
  associated_phenotypes:
  - Hindlimb splaying and neuromuscular dysfunction
  - Reduced brain weight and ventricular dilation
  - Seizures
  - Reduced circulating BCAAs
  description: >-
    The autosomal recessive frogleg rat carries a damaging kinase-domain Bckdk
    missense allele, loses BCKDH Ser293 phosphorylation, and develops central
    and peripheral nervous-system abnormalities with marked BCAA depletion.
  evidence:
  - reference: PMID:27472223
    reference_title: A Spontaneous Missense Mutation in Branched Chain Keto Acid Dehydrogenase Kinase in the Rat Affects Both the Central and Peripheral Nervous Systems.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      circulating levels of the BCAAs are reduced by 70-80% in animals
      homozygous for the mutation.
    explanation: Directly quantifies the model's systemic biochemical lesion.
  - reference: PMID:27472223
    reference_title: A Spontaneous Missense Mutation in Branched Chain Keto Acid Dehydrogenase Kinase in the Rat Affects Both the Central and Peripheral Nervous Systems.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The frogleg phenotype shares important characteristics with a previously
      described Bckdk knockout mouse and with human subjects with Bckdk
      mutations.
    explanation: Supports translational correspondence across rat, mouse, and human disease.
- species: Mouse (Mus musculus)
  genotype: Bckdk deficiency with Dbt haploinsufficiency
  category: Genetic rescue model
  associated_phenotypes:
  - Partial biochemical rescue
  - Partial behavioral rescue
  description: >-
    Reducing dosage of the downstream BCKDH E2 component Dbt partially
    re-regulates excessive BCAA catabolism in Bckdk-deficient mice. The result
    supports catabolic-flux suppression as a preclinical strategy rather than
    establishing a human treatment.
  evidence:
  - reference: PMID:38770403
    reference_title: Partial suppression of BCAA catabolism as a potential therapy for BCKDK deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      genetic re-regulation of BCAA catabolism, through Dbt
      haploinsufficiency, partially rescued biochemical and behavioral
      phenotypes in BCKDK deficient mice.
    explanation: Directly demonstrates partial genetic rescue of biochemical and behavioral phenotypes.

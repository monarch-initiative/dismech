discussions:
- discussion_id: gap_bckdk_newborn_screening_and_early_treatment
  prompt: >-
    Does population newborn screening followed by presymptomatic dietary
    treatment prevent autism, epilepsy, and developmental disability?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - diagnosis#Candidate newborn dried-blood-spot screening
  - treatments#BCAA-enriched high-protein dietary supplementation
  rationale: >-
    Retrospective dried-blood-spot values support biochemical detectability, and
    three children treated before age two had favorable autism outcomes, but the
    cohort is small and uncontrolled. Prospective screening performance,
    cutoffs, false-positive burden, and neurodevelopmental efficacy remain
    unestablished.
  evidence:
  - reference: PMID:36729635
    reference_title: "BCKDK deficiency: a treatable neurodevelopmental disease amenable to newborn screening."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among cases with follow-up data, none of the three patients starting
      treatment before 2 years of age developed autism at follow-up.
    explanation: Suggests an early-treatment benefit but is based on only three nonrandomized cases.
  - reference: PMID:36729635
    reference_title: "BCKDK deficiency: a treatable neurodevelopmental disease amenable to newborn screening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NBS in DBS identified BCAA levels significantly lower than those of the
      normal population.
    explanation: Supports newborn biochemical detectability without establishing program-level screening performance.
- discussion_id: mismatch_human_and_mouse_bcaa_supplementation
  prompt: >-
    Why do reported human cohorts improve with BCAA-rich dietary treatment while
    enteral supplementation worsens neurodevelopmental deficits in one mouse
    model?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - treatments#BCAA-enriched high-protein dietary supplementation
  - pathophysiology#Aberrant catabolic flux beyond simple BCAA insufficiency
  rationale: >-
    Human evidence comes from uncontrolled observational cohorts receiving a
    combined high-protein and BCAA regimen, whereas the mouse experiment tests a
    defined model and enteral supplementation. Species, developmental timing,
    dosing, diet composition, brain delivery, and residual genotype effects may
    explain the divergence.
  evidence:
  - reference: PMID:36729635
    reference_title: "BCKDK deficiency: a treatable neurodevelopmental disease amenable to newborn screening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After treatment with a high-protein diet (≥ 2 g/kg/day) and BCAA
      supplementation (100-250 mg/kg/day), plasma BCAA increased significantly
      (P < 0.001), motor functions and head circumference stabilized/improved in
      13/13 and in 11/15 patients, respectively.
    explanation: Summarizes the reported human biochemical and clinical response.
  - reference: PMID:38770403
    reference_title: Partial suppression of BCAA catabolism as a potential therapy for BCKDK deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      BCAA supplementation exacerbated neurodevelopmental deficits and did not
      correct biochemical abnormalities despite increasing systemic BCAA
      levels.
    explanation: Establishes the opposite outcome in the mouse intervention experiment.
- discussion_id: gap_brain_delivery_and_catabolic_flux
  prompt: >-
    Which mechanism most directly drives human neurodevelopmental disease:
    systemic depletion, impaired BCAA-derived nitrogen delivery, brain
    nutrient-stress signaling, or abnormal downstream catabolic flux?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced BCAA-derived nitrogen delivery and brain nutrient-stress response
  - pathophysiology#Aberrant catabolic flux beyond simple BCAA insufficiency
  rationale: >-
    New mouse results bridge systemic depletion to brain metabolism, while
    genetic rescue indicates that excess pathway flux matters independently of
    the measured BCAA concentration. Human tissue-level evidence remains absent,
    and patient-derived neurons did not reproduce a major cell-autonomous
    phenotype.
  evidence:
  - reference: PMID:41587643
    reference_title: A metabolic basis for motor deficits in mice lacking BCKDK.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, in the non-growing adult constitutive BCKDH activation limits
      BCAA-derived nitrogen delivery to brain and alters AA transporters as part
      of an adaptive ISR during nutrient scarcity.
    explanation: Demonstrates impaired BCAA-derived nitrogen delivery in vivo.
  - reference: PMID:38770403
    reference_title: Partial suppression of BCAA catabolism as a potential therapy for BCKDK deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data suggest that aberrant flux through the BCAA catabolic pathway,
      not just BCAA insufficiency, may contribute to disease pathology.
    explanation: Establishes the competing or complementary catabolic-flux mechanism.
review_notes: >-
  Full re-review completed 2026-07-23. The modeled disease is specifically
  autosomal recessive BCKDK loss of function with low BCAAs; the proposed
  heterozygous p.Thr372Arg gain-of-function, high-BCAA/alloisoleucine phenotype
  is retained only as an allelic differential and scope boundary. Baby Detect
  and Simons Searchlight are observational studies, not BCKDK therapeutic
  trials. Newborn screening remains a candidate strategy. Dietary benefit in
  uncontrolled human cohorts is presented alongside, but not invalidated by,
  the discordant 2024 mouse supplementation experiment.

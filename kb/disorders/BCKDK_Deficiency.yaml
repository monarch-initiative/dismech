    term:
      id: GO:0009083
      label: branched-chain amino acid catabolic process
    modifier: INCREASED
  - preferred_term: protein dephosphorylation of BCKDH E1-alpha
    term:
      id: GO:0006470
      label: protein dephosphorylation
    modifier: INCREASED
  locations:

    Fibroblast-derived iPSCs from two affected sisters and an unaffected brother,
    differentiated through neural progenitor cells into mature neurons
  description: >-
    Patient and control cells were compared across reduced extracellular BCAA
    concentrations. The cultured neural cells showed no major genotype-dependent
    survival, proliferation, morphologic, transcriptional, or metabolic
    phenotype, defining an important negative result and favoring a
    non-cell-autonomous systemic mechanism.
  findings:

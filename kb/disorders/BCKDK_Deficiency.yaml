    Completed observational newborn-screening program in the Wallonia-Brussels
    Federation using targeted sequencing from neonatal dried blood spots.
    BCKDK deficiency is included among the program's treatable early-onset
    conditions; this is a screening implementation study, not a therapeutic
    efficacy trial.

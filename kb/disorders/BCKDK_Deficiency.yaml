- name: Reduced BCAA-derived nitrogen delivery and brain nutrient-stress response
  description: >-
    Constitutive peripheral BCAA oxidation limits the circulating precursor pool
    and reduces incorporation of BCAA-derived nitrogen into brain glutamate.
    During fasting, Bckdk-null brain activates the integrated stress response,
    increases Atf4 targets including Slc7a5, and reduces protein synthesis,
    whereas skeletal muscle is comparatively resilient. This supplies a
    mechanistic bridge between systemic amino-acid depletion and neurologic
    vulnerability but does not yet explain every human developmental feature.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:41587643
    reference_title: A metabolic basis for motor deficits in mice lacking BCKDK.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast, Bckdk KO brains exhibited ISR activation during fasting, and
      up-regulation of Atf4 and its target genes, including Slc7a5 mRNA.
    explanation: Demonstrates a brain-selective nutrient-stress response in the knockout model.
  - reference: PMID:41587643
    reference_title: A metabolic basis for motor deficits in mice lacking BCKDK.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This creates a vulnerability in brain not observed in skeletal muscle.
    explanation: Supports tissue-selective brain vulnerability.
  downstream:
  - target: Neurodevelopmental and epileptic phenotype

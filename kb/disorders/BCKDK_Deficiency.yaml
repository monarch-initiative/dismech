definitions:
- name: Recessive BCKDK loss-of-function deficiency
  definition_type: OTHER
  description: >-
    A treatable autosomal recessive aminoacidopathy in which biallelic
    loss-of-function BCKDK variants remove inhibitory phosphorylation of BCKDH,
    causing excessive BCAA oxidation, low plasma and CSF BCAAs, and a
    neurodevelopmental disorder.
  evidence:
  - reference: PMID:35216372
    reference_title: Novel Loss of Function Variant in BCKDK Causes a Treatable Developmental and Epileptic Encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hyperactivity of BCKDH and over-consumption of BCAA were demonstrated by
      functional tests in cells transfected with the mutant BCKDK.
    explanation: Defines the loss-of-inhibition biochemical mechanism.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease-causing BCKDK deficiency results from biallelic loss-of-function
    variants. This is distinct from the proposed heterozygous gain-of-function
    BCKDK biochemical phenotype with elevated BCAAs.
  evidence:
  - reference: PMID:22956686
    reference_title: Mutations in BCKD-kinase lead to a potentially treatable form of autism with epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We focused on the identification of homozygous variants predicted to
      result in loss of protein function, consistent with the presumed mode of
      recessive inheritance.
    explanation: Directly supports recessive inheritance for BCKDK loss-of-function disease.
progression:
- phase: Birth and presymptomatic interval
  age_range: Newborn period through infancy
  notes: >-
    Congenital microcephaly is not typical in the largest cohort. Low BCAAs can
    already be detected retrospectively in newborn dried blood spots, creating
    an opportunity for diagnosis before the neurodevelopmental phenotype is
    established.
  evidence:
  - reference: PMID:36729635
    reference_title: "BCKDK deficiency: a treatable neurodevelopmental disease amenable to newborn screening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No microcephaly was observed at birth, but 17/20 developed microcephaly
      during follow-up.
    explanation: Establishes the predominantly postnatal evolution of microcephaly.
  - reference: PMID:36729635
    reference_title: "BCKDK deficiency: a treatable neurodevelopmental disease amenable to newborn screening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NBS in DBS identified BCAA levels significantly lower than those of the
      normal population.
    explanation: Shows that the biochemical signature can precede clinical diagnosis.
- phase: Untreated neurodevelopmental disease
  age_range: Infancy through childhood
  notes: >-
    Developmental and language impairment, autism, motor dysfunction, epilepsy,
    postnatal microcephaly, and occasional regression accumulate over childhood.
    The cohort was diagnosed from 8 months to 16 years, demonstrating a wide
    diagnostic delay.
  evidence:
  - reference: PMID:36729635
    reference_title: "BCKDK deficiency: a treatable neurodevelopmental disease amenable to newborn screening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients were diagnosed between 8 months and 16 years (mean: 5.8 years,
      43% female).
    explanation: Defines the observed diagnostic age range.
  - reference: PMID:36729635
    reference_title: "BCKDK deficiency: a treatable neurodevelopmental disease amenable to newborn screening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regression was reported in six patients."
    explanation: Documents that loss of previously acquired function can occur.
- phase: Diet-treated follow-up
  age_range: After biochemical and molecular diagnosis
  notes: >-
    Plasma BCAAs generally rise with high-protein intake and BCAA
    supplementation. Motor function, head growth, seizures, speech, and
    psychomotor development may stabilize or improve, with the most favorable
    reports after early treatment. Existing cohorts are small and uncontrolled,
    so treatment cannot be assumed to reverse established disability.
  evidence:
  - reference: PMID:36729635
    reference_title: "BCKDK deficiency: a treatable neurodevelopmental disease amenable to newborn screening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      motor functions and head circumference stabilized/improved in 13/13 and
      in 11/15 patients, respectively.
    explanation: Quantifies motor and head-growth outcomes in treated patients with follow-up data.
  - reference: PMID:40851941
    reference_title: "BCKDK gene mutations as a rare condition responsible for comorbid neurodevelopmental delay, autism, and epilepsy: a case series of four patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By initiating a BCAAs-rich regimen, the patients had significant
      improvements in psychomotor and speech development.
    explanation: Adds 2025 case-series evidence for developmental improvement after dietary therapy.
pathophysiology:
- name: BCKDK loss of function
  description: >
    Biallelic loss-of-function variants in BCKDK (frameshift, nonsense, missense,
    or in-frame deletion) reduce or abolish the mitochondrial branched-chain
    ketoacid dehydrogenase kinase. Patient cells show reduced BCKDK mRNA
    (consistent with nonsense-mediated decay), undetectable BCKDK protein, and
    loss of the phospho-E1-alpha (Ser293) signal that normally inactivates BCKDH.

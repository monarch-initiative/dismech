differential_diagnoses:
- name: Maple syrup urine disease
  disease_term:
    preferred_term: maple syrup urine disease
    term:
      id: MONDO:0009563
      label: maple syrup urine disease
  description: >-
    Classic BCKD-complex deficiency produces the biochemical opposite of
    recessive BCKDK deficiency: BCAAs accumulate rather than fall, and
    alloisoleucine is the pathognomonic biochemical discriminator.
  distinguishing_features:
  - Elevated BCAAs and alloisoleucine in maple syrup urine disease
  - Low plasma and CSF BCAAs in recessive BCKDK deficiency
  evidence:
  - reference: PMID:38736638
    reference_title: Computational structural genomics and clinical evidence suggest BCKDK gain-of-function may cause a potentially asymptomatic maple syrup urine disease phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biochemical evidence for MSUD includes elevated branched-chain amino acids
      (BCAA) and the pathognomonic presence of alloisoleucine.
    explanation: Directly states the biochemical pattern that distinguishes MSUD from BCKDK deficiency.
- name: Heterozygous BCKDK gain-of-function biochemical phenotype
  description: >-
    A proposed heterozygous p.Thr372Arg gain-of-function allele produces
    autosomal dominant elevation of BCAAs and alloisoleucine with a mild or
    asymptomatic MSUD-like course. It is a distinct allelic condition and must
    not be merged with biallelic loss-of-function BCKDK deficiency.
  distinguishing_features:
  - Heterozygous rather than biallelic BCKDK variation
  - Elevated rather than depleted BCAAs
  - Detectable alloisoleucine and often benign clinical course
  evidence:
  - reference: PMID:38736638
    reference_title: Computational structural genomics and clinical evidence suggest BCKDK gain-of-function may cause a potentially asymptomatic maple syrup urine disease phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The BCKDK variant modeling indicated a gain-of-function which leads to
      impaired BCAA catabolism consistent with the biochemical evidence in this
      cohort.
    explanation: Supports the mechanistically opposite gain-of-function allelic phenotype.
- name: Other genetic neurodevelopmental disorders
  description: >-
    Autism, developmental delay, epilepsy, and microcephaly are nonspecific.
    Concordant low plasma BCAAs followed by biallelic BCKDK findings separates
    this treatable aminoacidopathy from phenotypically overlapping genetic
    neurodevelopmental disorders.
  distinguishing_features:
  - Low leucine, isoleucine, and valine
  - Biallelic pathogenic BCKDK variants
  evidence:
  - reference: PMID:40851941
    reference_title: "BCKDK gene mutations as a rare condition responsible for comorbid neurodevelopmental delay, autism, and epilepsy: a case series of four patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neuroimaging assessments revealed negligible findings; thus, metabolic
      tests were sent, in which BCAAs were lower than normal limits.
    explanation: Shows how metabolic testing distinguished BCKDK deficiency in children with nonspecific NDD and autism.
- name: Dietary protein insufficiency
  description: >-
    Inadequate protein intake can lower circulating essential amino acids, but
    the discovery cohort did not have protein-deficient diets and retained
    normal fasting concentrations of other essential amino acids.
  distinguishing_features:
  - Dietary history and broader essential-amino-acid pattern
  - Persistent selective BCAA depletion despite adequate protein intake
  - Biallelic pathogenic BCKDK variants
  evidence:
  - reference: PMID:22956686
    reference_title: Mutations in BCKD-kinase lead to a potentially treatable form of autism with epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the affected individuals was known to eat a diet deficient in
      protein, as evidenced by their normal fasting plasma levels of the other
      essential amino acids
    explanation: Excludes simple dietary protein deficiency in the original affected families.
treatments:
- name: BCAA-enriched high-protein dietary supplementation
  description: >-
    The principal reported disease-directed intervention is a dietitian-directed
    high-protein diet plus oral leucine, isoleucine, and valine. In the largest
    human cohort, reported intake was at least 2 g protein/kg/day with total BCAA
    supplementation of 100–250 mg/kg/day; plasma BCAAs rose and motor function
    and head growth commonly stabilized or improved. Earlier reports found
    strong seizure control with less complete developmental response. These
    uncontrolled human observations should be interpreted separately from a
    2024 mouse study in which enteral BCAAs raised systemic concentrations but
    worsened neurodevelopmental deficits and failed to correct the modeled
    pathway abnormality.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: amino acid supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:
    - preferred_term: leucine

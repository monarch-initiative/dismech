genetic:
- name: NRROS
  gene_term:
    preferred_term: NRROS
    term:
      id: hgnc:24613
      label: NRROS
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Most pathogenic variants are truncating (nonsense or frameshift). Four
    missense variants have been reported (p.Leu10Pro, p.Leu62Pro, p.Leu86Pro,
    p.Asn408His); in overexpression studies they alter NRROS subcellular
    distribution, and are predicted to disrupt signal-peptide cleavage,
    folding or N-glycosylation. The frameshift c.1981delC
    (p.Leu661Serfs*97) recurs in two families, probably as a founder allele.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_ebf06969-1af8-411f-bc64-7f1563851363-2023-09-15T160000.000Z
    evidence:
    - reference: CGGV:assertion_ebf06969-1af8-411f-bc64-7f1563851363-2023-09-15T160000.000Z
      reference_title: "NRROS / seizures, early-onset, with neurodegeneration and brain calcifications (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "NRROS | HGNC:24613 | seizures, early-onset, with neurodegeneration and brain calcifications | MONDO:0030033 | AR | Definitive"
      explanation: ClinGen classifies the NRROS-SENEBAC relationship as Definitive (AR).
  evidence:
  - reference: PMID:32100099
    reference_title: "Biallelic mutations in NRROS cause an early onset lethal microgliopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing identified homozygous NRROS variants in the affected children from both families"
    explanation: Homozygous NRROS variants in affected children.
  - reference: PMID:42806633
    reference_title: "A homozygous missense variant in NRROS gene is associated with intracranial calcifications, neurodegeneration, and severe infantile epilepsy syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutational spectrum of NRROS disorder is characterized primarily by loss-of-function variants, with only four missense variants identified in affected individuals to date p.(Leu10Pro), p.(Leu62Pro), p.(Leu86Pro), and p.(Asn408His)."
    explanation: Summarizes the mutational spectrum across reported families.
  - reference: PMID:35716448
    reference_title: "Delineating the epilepsy phenotype of NRROS-related microgliopathy: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common reported genetic variation was c.1981delC; (p.Leu661Serfs*97) observed in two families (likely due to a founder effect)."
    explanation: Identifies the recurrent, probably founder, frameshift allele.
animal_models:
- name: Nrros knockout mouse
  species: Mouse
  genotype: Nrros-/-
  publication: PMID:28459434
  description: >-
    Germline Nrros-deficient mice develop motor defects and die before 6
    months of age; normal microglia are absent and perivascular
    macrophage-like myeloid cells populate the CNS.
  modeled_mechanisms:
  - target: Failure of Homeostatic Microglial Identity
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Loss of the microglial identity programme in the absence of NRROS.
    readouts:
    - name: Microglial identity gene expression (Sall1)
      target: Failure of Homeostatic Microglial Identity
      direction: DECREASED
      interpretation: Microglia fail to express the identity transcription factor Sall1.
      evidence:
      - reference: PMID:28459434
        reference_title: "Mice deficient in NRROS show abnormal microglial development and neurological disorders."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "NRROS is required for normal expression of Sall1 and other microglial genes that are important for microglial development and function."
        explanation: Reports the loss of microglial identity gene expression.
    evidence:
    - reference: PMID:28459434
      reference_title: "Mice deficient in NRROS show abnormal microglial development and neurological disorders."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Nrros-/- mice display astrogliosis and lack normal CD11bhiCD45lo microglia"
      explanation: The knockout lacks normal microglia.
  - target: Neuronal Loss and Reactive Gliosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Astrogliosis is present, but this knockout showed no neuronal loss.
    limitations: >-
      The original Nrros-/- report found astrogliosis without detectable
      demyelination or neuronal loss, whereas patients show widespread
      neuronal loss; the mice also do not develop seizures or brain
      calcification as described in that report.
    evidence:
    - reference: PMID:28459434
      reference_title: "Mice deficient in NRROS show abnormal microglial development and neurological disorders."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Nrros-/- mice display astrogliosis and lack normal CD11bhiCD45lo microglia, but they show no detectable demyelination or neuronal loss."
      explanation: Astrogliosis without neuronal loss in this model.
- name: Lrrc33 knockout mouse
  species: Mouse
  genotype: Lrrc33-/-
  publication: PMID:29909984
  description: >-
    Lrrc33-deficient mice have reactive microglia, develop ascending
    paraparesis after 2 months with loss of neurons, myelin and axons, and
    die by 5 months. Whole bone marrow transplantation repopulates the brain
    with wild-type microglia and halts progression.
  modeled_mechanisms:
  - target: Loss of Microglial Autocrine TGF-beta1 Activation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Microglia lacking LRRC33 lose TGF-beta signalling.
    evidence:
    - reference: PMID:29909984
      reference_title: "A Milieu Molecule for TGF-β Required for Microglia Function in the Nervous System."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "GSEA thus provided independent, hypothesis-free support for the requirement of LRRC33 for TGF-β signaling in microglia and for the reactive phenotype of Lrrc33−/− microglia."
      explanation: Transcriptomic evidence of lost TGF-beta signalling in microglia.
  - target: Deep White Matter Myelin Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Myelin and axon loss in the spinal cord, brainstem and corticospinal tract.
    limitations: >-
      The mouse presents as an ascending paraparesis with spinal cord
      involvement, whereas children present with drug-resistant epilepsy,
      regression and cerebral calcification.
    readouts:
    - name: Spinal cord and brainstem myelin and axon content
      target: Deep White Matter Myelin Loss
      direction: DECREASED
      interpretation: Histological correlate of the white matter degeneration node.
      evidence:
      - reference: PMID:29909984
        reference_title: "A Milieu Molecule for TGF-β Required for Microglia Function in the Nervous System."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Progressive paraparesis was associated with loss of myelin and axons in the spinal cord and brainstem."
        explanation: Reports myelin and axon loss.
    evidence:
    - reference: PMID:29909984
      reference_title: "A Milieu Molecule for TGF-β Required for Microglia Function in the Nervous System."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Lrrc33−/− mice appear normal up to 2 months of age, but then develop ascending paraparesis that is characterized by demyelination, loss of axons, loss of neurons in the somatomotor cortex and spinal cord, and death by 5 months."
      explanation: Establishes the model as informative for white matter degeneration.
  - target: Failure of Homeostatic Microglial Identity
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Whole bone marrow transplantation replaces Lrrc33-deficient microglia
      with wild-type cells and halts disease progression.
    limitations: >-
      Shown only in mice after lethal irradiation; no transplantation or
      microglial replacement has been reported in a patient.
    evidence:
    - reference: PMID:29909984
      reference_title: "A Milieu Molecule for TGF-β Required for Microglia Function in the Nervous System."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Whole bone marrow transplantation results in selective repopulation of Lrrc33-/- brains with WT microglia and halts disease progression."
      explanation: Mouse rescue by replacing NRROS-deficient microglia.
discussions:
- discussion_id: nrros_microglial_replacement
  prompt: >-
    Could haematopoietic cell transplantation or another microglial
    replacement strategy halt disease in children with NRROS-related
    microgliopathy if given before neurodegeneration is advanced?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of Homeostatic Microglial Identity
  - animal_models#Lrrc33 knockout mouse
  rationale: >-
    In Lrrc33-deficient mice, wild-type bone marrow repopulates the brain with
    wild-type microglia and halts progression. Because the defect is cell
    autonomous to NRROS-deficient myeloid cells, replacement is a mechanistic
    rationale for transplantation, but no human outcome has been reported and
    the children in published series were diagnosed after regression had
    begun.
  evidence:
  - reference: PMID:29909984
    reference_title: "A Milieu Molecule for TGF-β Required for Microglia Function in the Nervous System."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Whole bone marrow transplantation results in selective repopulation of Lrrc33-/- brains with WT microglia and halts disease progression."
    explanation: Preclinical rescue that motivates the question.
- discussion_id: nrros_tgfb_versus_nox2
  prompt: >-
    Does the human disease follow from loss of microglial TGF-beta1 activation
    alone, or does loss of NRROS-mediated restraint of NOX2 and reactive
    oxygen species production also contribute?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#NRROS Loss of Function
  - pathophysiology#Perivascular Foamy Macrophage Accumulation
  rationale: >-
    NRROS was first described as a negative regulator of NOX2 in phagocytes,
    and the foamy macrophages in patient brain are p22phox-positive. The
    phenotype of the knockouts, rescue by wild-type marrow, and the overlap
    with human TGF-beta1 deficiency point to the TGF-beta axis, but no study
    has separated the two functions in the CNS disease.
  evidence:
  - reference: PMID:24739962
    reference_title: "NRROS negatively regulates reactive oxygen species during host defence and autoimmunity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "NRROS is localized to the endoplasmic reticulum, where it directly interacts with nascent NOX2 (also known as gp91(phox) and encoded by Cybb) monomer, one of the membrane-bound subunits of the NADPH oxidase complex, and facilitates the degradation of NOX2 through the endoplasmic-reticulum-associated degradation pathway"
    explanation: Establishes the second, NOX2-regulating function of NRROS.
  - reference: PMID:32197075
    reference_title: "Bi-allelic LoF NRROS Variants Impairing Active TGF-β1 Delivery Cause a Severe Infantile-Onset Neurodegenerative Condition with Intracranial Calcification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotypic features in affected individuals are consistent with those observed in the Nrros knockout mouse, and they overlap with those seen in the human condition associated with TGF-β1 deficiency."
    explanation: Clinical overlap with TGF-beta1 deficiency favours the TGF-beta axis.
  - reference: PMID:29483653
    reference_title: "Human TGF-β1 deficiency causes severe inflammatory bowel disease and encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "biallelic loss-of-function mutations in the TGFB1 gene who presented with severe infantile inflammatory bowel disease (IBD) and central nervous system (CNS) disease associated with epilepsy, brain atrophy and posterior leukoencephalopathy"
    explanation: >-
      Human TGF-beta1 deficiency produces epilepsy, brain atrophy and
      leukoencephalopathy, the CNS features shared with NRROS deficiency.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathological examination revealed both extensive grey and white matter involvement, dystrophic calcifications, and infiltration of foamy macrophages."
    explanation: The calcification is characterized as dystrophic at autopsy.
  downstream:
  - target: Intracranial calcification

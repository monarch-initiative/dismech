    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Losses of neurons, myelin and axons in Lrrc33−/− mice provide a cellular mechanistic basis for impaired motor coordination and ascending paraparesis."
    explanation: Neuronal loss in the Lrrc33-deficient mouse.
  - reference: PMID:35099671

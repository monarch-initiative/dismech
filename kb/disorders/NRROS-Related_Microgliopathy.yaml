    Seizures are treated with standard antiseizure medications, but they are
    drug-resistant in every reported child. In one case focal seizures were
    initially controlled with levetiracetam, then failed to respond to
    valproic acid, clobazam and topiramate. No disease-modifying therapy has
    been reported; care is otherwise supportive.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:

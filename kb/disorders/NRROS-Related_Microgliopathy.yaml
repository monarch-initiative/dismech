name: NRROS-Related Microgliopathy
creation_date: "2026-11-04T00:00:00Z"
category: Mendelian
synonyms:
- seizures, early-onset, with neurodegeneration and brain calcifications
- SENEBAC
- NRROS-related SENEBAC syndrome
disease_term:
  preferred_term: Seizures, early-onset, with neurodegeneration and brain calcifications
  term:
    id: MONDO:0030033
    label: seizures, early-onset, with neurodegeneration and brain calcifications
parents:
- microgliopathy
- neurodegenerative disease
description: >-
  NRROS-related microgliopathy (seizures, early-onset, with neurodegeneration
  and brain calcifications; SENEBAC, MIM 618875) is an autosomal recessive,
  usually lethal infantile neurodegenerative disorder caused by biallelic
  loss-of-function variants in NRROS (negative regulator of reactive oxygen
  species, also called LRRC33). NRROS is a leucine-rich repeat transmembrane
  protein expressed by microglia and CNS perivascular macrophages that binds
  latent TGF-beta1 and presents it at the cell surface, where integrin
  alpha-v beta-8 releases the active cytokine to signal locally on the
  presenting microglial cell. Without NRROS, microglia lose this autocrine
  TGF-beta1 signal and do not acquire or maintain their homeostatic identity.
  Development is usually normal or mildly delayed until seizures begin in the
  first two years of life. Seizures are drug-resistant, and children then lose
  developmental skills, develop acquired microcephaly, and show progressive
  cerebral atrophy, white matter loss and punctate or serpiginous
  calcification at the grey-white matter junction. Most reported children have
  died by about three years of age.
notes: >-
  The entry name follows recurring literature use of "NRROS-related
  microgliopathy" (PMID:35716448, PMID:40463927); the MONDO and OMIM label is
  kept as a synonym. No GeneReviews chapter covers this disease (Bookshelf
  index snapshot 2026-09-10).
pathophysiology:
- name: NRROS Loss of Function
  description: >-
    Biallelic truncating or destabilising variants in NRROS abolish the
    protein's ability to anchor latent TGF-beta1 at the surface of microglia
    and perivascular macrophages.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: NRROS
    term:
      id: hgnc:24613
      label: NRROS
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  evidence:
  - reference: PMID:32197075
    reference_title: "Bi-allelic LoF NRROS Variants Impairing Active TGF-β1 Delivery Cause a Severe Infantile-Onset Neurodegenerative Condition with Intracranial Calcification."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we show that our mutant NRROS proteins fail to anchor latent TGF-β1 at the cell surface in comparison to wild-type NRROS"
    explanation: >-
      Disease-associated NRROS variants lose the latent TGF-beta1 anchoring
      function in a cell assay.
  downstream:
  - target: Loss of Microglial Autocrine TGF-beta1 Activation
    causal_link_type: DIRECT
- name: Loss of Microglial Autocrine TGF-beta1 Activation
  description: >-
    NRROS is the milieu molecule that presents latent TGF-beta1 on the
    microglial surface for integrin alpha-v beta-8-dependent activation. The
    activated cytokine acts on the presenting cell and its immediate
    neighbours, so loss of NRROS removes TGF-beta signalling from microglia.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: TGF-beta receptor signaling in microglia
    modifier: DECREASED
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  evidence:
  - reference: PMID:29909984
    reference_title: "A Milieu Molecule for TGF-β Required for Microglia Function in the Nervous System."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "LRRC33 on the surface of microglia functions as a milieu molecule and enables highly localized, integrin-αVβ8-dependent TGF-β activation"
    explanation: >-
      Establishes NRROS/LRRC33 as the microglial surface presenter of latent
      TGF-beta for local integrin-dependent activation.
  downstream:
  - target: Failure of Homeostatic Microglial Identity
    causal_link_type: DIRECT
- name: Failure of Homeostatic Microglial Identity
  description: >-
    Without NRROS-dependent TGF-beta1 signalling, microglia do not express the
    homeostatic microglial signature (Sall1 in the mouse; P2Y12 and TMEM119 in
    human brain) and adopt a reactive phenotype. In the one autopsied child
    with truncating variants, the accumulating foamy myeloid cells lacked the
    homeostatic microglial markers P2Y12 and TMEM119.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: microglia development
    modifier: DECREASED
    term:
      id: GO:0014005
      label: microglia development
  - preferred_term: microglial cell activation
    modifier: INCREASED
    term:
      id: GO:0001774
      label: microglial cell activation
  evidence:
  - reference: PMID:28459434
    reference_title: "Mice deficient in NRROS show abnormal microglial development and neurological disorders."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "NRROS is required for normal expression of Sall1 and other microglial genes that are important for microglial development and function."
    explanation: >-
      Nrros-deficient mice fail to express the microglial identity genes.
  - reference: PMID:29909984
    reference_title: "A Milieu Molecule for TGF-β Required for Microglia Function in the Nervous System."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "GSEA thus provided independent, hypothesis-free support for the requirement of LRRC33 for TGF-β signaling in microglia and for the reactive phenotype of Lrrc33−/− microglia."
    explanation: >-
      Links the loss of microglial TGF-beta signalling to the reactive
      microglial state in Lrrc33-deficient mice.
  - reference: PMID:32100099
    reference_title: "Biallelic mutations in NRROS cause an early onset lethal microgliopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "did not immunoreact with CD163, Iba1, NRROS, CD3, P2Y12, or TMEM119"
    explanation: >-
      In patient post-mortem brain the accumulating myeloid cells lacked the
      homeostatic microglial markers P2Y12 and TMEM119.
  downstream:
  - target: Perivascular Foamy Macrophage Accumulation
  - target: Neuronal Loss and Reactive Gliosis
  - target: Deep White Matter Myelin Loss
- name: Perivascular Foamy Macrophage Accumulation
  description: >-
    CD68-positive, MHC class II-positive foamy macrophages accumulate, mostly
    around vessels, throughout the cerebral and cerebellar white matter and
    the descending corticospinal tracts. In Nrros-deficient mice, perivascular
    macrophage-like myeloid cells take the place of normal microglia. The
    foamy cells are p22phox-positive, which is relevant to the separate NRROS
    role as a negative regulator of NOX2.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: perivascular macrophage
    term:
      id: CL:0000881
      label: perivascular macrophage
  - preferred_term: foamy macrophage
    term:
      id: CL:0000517
      label: macrophage derived foam cell
  evidence:
  - reference: PMID:32100099
    reference_title: "Biallelic mutations in NRROS cause an early onset lethal microgliopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most striking pathological finding was the accumulation of foamy macrophages, predominantly in a perivascular distribution, throughout the white matter"
    explanation: Post-mortem neuropathology of an affected child.
  - reference: PMID:35099671
    reference_title: "Novel biallelic variants in NRROS associated with a lethal microgliopathy, brain calcifications, and neurodegeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathological examination revealed both extensive grey and white matter involvement, dystrophic calcifications, and infiltration of foamy macrophages."
    explanation: Independent autopsy finding of foamy macrophage infiltration.
  - reference: PMID:28459434
    reference_title: "Mice deficient in NRROS show abnormal microglial development and neurological disorders."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Instead, perivascular macrophage-like myeloid cells populate the Nrros-/- CNS."
    explanation: Mouse knockout shows the replacement of microglia by perivascular macrophage-like cells.
- name: Neuronal Loss and Reactive Gliosis
  description: >-
    Widespread neuronal loss with reactive gliosis in cortical and deep grey
    matter, cerebellum and brainstem, producing the progressive cerebral
    atrophy seen on serial imaging. One autopsy also found abnormal
    mitochondrial ultrastructure on electron microscopy.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neuron
    term:

    explanation: The founding families were diagnosed by exome sequencing.
  - reference: PMID:40463927
    reference_title: "Neurodegeneration, Intracranial Calcifications, Microcephaly and Drug-Resistant Epilepsy Caused by a Novel Homozygous Missense Variant in the NRROS Gene: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case underscores the importance of considering NRROS-related microgliopathy in children with early-onset neurodegeneration, drug-resistant epilepsy, and intracranial calcifications, enabling targeted genetic testing, diagnosis, and counseling."
    explanation: States the clinical triad that should prompt NRROS testing.
- name: Neuroimaging Signature of Calcification and Atrophy
  description: >-
    CT shows punctate or linear calcification in the deep and subcortical
    white matter and at the grey-white matter junction; serial MRI shows
    progressive cerebral atrophy, white matter volume loss and delayed
    myelination. Together with acquired microcephaly, the pattern is a
    diagnostic clue.
  diagnosis_term:
    preferred_term: computed tomography of the head
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:35716448
    reference_title: "Delineating the epilepsy phenotype of NRROS-related microgliopathy: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Punctate or serpiginous calcifications at the grey-white matter junction and acquired microcephaly are further clues towards the diagnosis."
    explanation: Names the diagnostic imaging and growth clues.
  - reference: PMID:35099671
    reference_title: "Novel biallelic variants in NRROS associated with a lethal microgliopathy, brain calcifications, and neurodegeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Computed tomography (CT) at 18 months confirmed calcifications in the subcortical and deep white matter"
    explanation: CT is the modality that confirms the calcification.
treatments:

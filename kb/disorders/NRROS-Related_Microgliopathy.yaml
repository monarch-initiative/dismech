- name: Dystrophic Brain Calcification
  description: >-
    Punctate and linear calcification of the neuropil, typically in the deep
    and subcortical white matter and at the grey-white junction, which
    increases as the disease progresses. Neuropathology describes it as
    dystrophic, i.e. secondary to tissue damage; how loss of NRROS leads to
    calcification has not been directly studied.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:32100099
    reference_title: "Biallelic mutations in NRROS cause an early onset lethal microgliopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Focal calcification was noted in the neuropil."
    explanation: Post-mortem confirmation of parenchymal calcification.
  - reference: PMID:35099671

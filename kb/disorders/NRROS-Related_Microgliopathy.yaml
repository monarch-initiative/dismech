diagnosis:
- name: Exome Sequencing for Biallelic NRROS Variants
  description: >-
    The diagnosis is molecular: every reported family was ascertained by exome
    sequencing, which identified biallelic NRROS variants. Testing is suggested
    by infantile drug-resistant epilepsy with regression and the imaging
    signature below.
  presence: Biallelic (homozygous or compound heterozygous) pathogenic NRROS variants

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: in a patient with anemia and Leigh Syndrome, and in a patient with anemia, sensorineural deafness and fatal infantile hypertrophic cardiomyopathy.
      explanation: The rescued patient-cell defect came from an infant with hypertrophic cardiomyopathy.
  - target: Renal tubular dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Mitochondrial dysfunction can affect renal tubular function.
    evidence:

genetic:
- name: COX10 pathogenic alleles and uncertain variants
  gene_term:
    preferred_term: COX10
    term:
      id: hgnc:2260
      label: COX10
  inheritance:
  - name: Autosomal recessive
  features: 'Established disease-associated alleles include missense variants, a homozygous initiation-codon alteration and a partial COX10 deletion in trans with p.Pro295Leu. The adult p.Asp336Val/p.Arg339Trp combination demonstrates that severe yeast respiratory defects do not imply inevitable infantile death. The 2024 p.Thr377Ile/p.Thr14Ile report remains uncertain: both substitutions were homozygous and classified as VUS, with functional studies proposed rather than performed. No specific modifier gene is established.'
  evidence:
  - reference: PMID:12928484
    reference_title: Mutations in COX10 result in a defect in mitochondrial heme A biosynthesis and account for multiple, early-onset clinical phenotypes associated with isolated COX deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mutation analysis of COX10 identified four different missense alleles, predicting amino acid substitutions at evolutionarily conserved residues.
    explanation: The founding functional series included missense alleles.
  - reference: PMID:15455402
    reference_title: Cytochrome c oxidase biogenesis in a patient with a mutation in COX10 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report a cytochrome c oxidase (COX)-deficient patient, clinically affected with Leigh-like disease, with a homozygous mutation in the COX10 start codon.
    explanation: Start-codon alteration is supported by complementation.
  - reference: PMID:36176336
    reference_title: Biallelic COX10 Mutations and PMP22 Deletion in a Family With Leigh Syndrome and Hereditary Neuropathy With Liability to Pressure Palsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: most likely caused by biallelic COX10 mutations composed of novel missense mutation and partial deletion
    explanation: The deletion affects part of COX10, not necessarily the entire gene.
  - reference: PMID:24100867
    reference_title: COX10 mutations resulting in complex multisystem mitochondrial disease that remains stable into adulthood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Whole-exome sequencing detected 1 known pathogenic and 1 novel COX10 mutation: c.1007A>T; p.Asp336Val, previously associated with fatal infantile COX deficiency, and c.1015C>T; p.Arg339Trp.'
    explanation: The adult case expands the genotype-phenotype spectrum.
  - reference: PMID:38846886
    reference_title: 'Complex mitochondrial disease caused by the mutation of COX10 in a toddler: a case-report study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Based on American College of Medical Genetics (ACMG) classification, this variant is considered a variant of uncertain significance (VUS) leaning pathogenic variant.
    explanation: The authors retain VUS status for Thr377Ile.
  - reference: PMID:38846886
    reference_title: 'Complex mitochondrial disease caused by the mutation of COX10 in a toddler: a case-report study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: another homozygous missense variant with a lower pathogenicity score was found in this patient’s data (COX10:c.41C>T; p.Thr14Ile). According to ACMG classification, this variant is a VUS.
    explanation: Thr14Ile is also a VUS; it is not an established modifier.
diagnosis:

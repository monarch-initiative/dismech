  description: Muscle or fibroblast enzymology, COX histochemistry and assembly studies can support pathogenicity, especially when variants remain uncertain. Reduced COX staining without ragged-red fibers is compatible with disease. A VUS pair alone does not confirm COX10 deficiency.

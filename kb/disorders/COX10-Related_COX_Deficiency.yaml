  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK320989/
    reference_title: Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: Anticongestive therapy or antiarrhythmic therapy may be required ... treatment should be managed by a cardiologist.
    explanation: General nuclear Leigh-spectrum guidance for cardiomyopathy applies to the cardiac phenotype, without COX10-specific efficacy data.
experimental_models:
- name: Patient Fibroblast COX10 Complementation
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:15455402
  description: Patient-derived fibroblasts permit assessment of the complex IV assembly defect and rescue by wild-type COX10 expression. Complementation establishes gene causality in this model; it is not a clinical gene-therapy result.
  modeled_mechanisms:
  - target: Reduced Complex IV Assembly
    relationship: RECAPITULATES
    model_scale: MOLECULAR
    fidelity: HIGH
    description: The patient-derived cellular system has reduced mature COX without accumulating assembly intermediates.
    limitations: Fibroblasts do not model the full brain, heart, renal or auditory phenotype.
    evidence:
    - reference: PMID:15455402
      reference_title: Cytochrome c oxidase biogenesis in a patient with a mutation in COX10 gene.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Two-dimensional gel electrophoresis showed a decrease of fully assembled COX without the accumulation of partially assembled COX subcomplexes.
      explanation: Direct measurement of the assembly defect.
  evidence:
  - reference: PMID:15455402
    reference_title: Cytochrome c oxidase biogenesis in a patient with a mutation in COX10 gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Overexpression of the COX10 protein in the patient's fibroblasts proved that the detected mutation was indeed the disease cause.
    explanation: Restoration with COX10 demonstrates causality in patient cells.
  - reference: PMID:12928484
    reference_title: Mutations in COX10 result in a defect in mitochondrial heme A biosynthesis and account for multiple, early-onset clinical phenotypes associated with isolated COX deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: expression of COX10 from a retroviral vector complements the COX deficiency
    explanation: Earlier patient fibroblasts were also complemented with COX10.
- name: Human COX10 Alleles in Yeast
  experimental_model_type: OTHER
  publication: PMID:39152498
  description: Human reference COX10 and 25 variants were expressed in Saccharomyces cerevisiae lacking endogenous COX10. Eleven variants supported approximately half or more of reference COX activity and robust growth on a nonfermentable substrate; others had low activity and failed respiratory growth. Results inform variant function but do not by themselves classify human pathogenicity or prognosis.
  modeled_mechanisms:
  - target: Reduced Terminal Electron Transfer
    relationship: RECAPITULATES
    model_scale: MOLECULAR
    fidelity: MODERATE
    description: Variant-dependent COX enzyme activity and respiratory growth measure the consequences of COX10 dysfunction.
    limitations: Species context can alter activity. Asp336Val and Arg339Trp were nonfunctional in yeast despite the survival of a patient with that combination into adulthood.
    evidence:
    - reference: PMID:39152498
      reference_title: Phenotypic assessment of Cox10 variants and their implications for Leigh Syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 11 of these Cox10 variants supported approximately half or more the cytochrome c oxidase activity compared to the reference sequence. All of the strains containing those 11 variants also grew robustly using a nonfermentable carbon source.
      explanation: The measured activity and growth outcomes.
  evidence:
  - reference: PMID:39152498
    reference_title: Phenotypic assessment of Cox10 variants and their implications for Leigh Syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Despite the strong evolutionary conservation in oxidative phosphorylation mechanisms, it is possible that these variants will have a different level of activity in humans compared to yeast cells.
    explanation: The authors explicitly identify the translational limitation.
discussions:
- evidence:
  - reference: PMID:24100867
    reference_title: COX10 mutations resulting in complex multisystem mitochondrial disease that remains stable into adulthood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These findings establish that COX10 mutations cause adult mitochondrial disease.
    explanation: Clinical outcome extends beyond the early lethal presentations.
  - reference: PMID:39152498
    reference_title: Phenotypic assessment of Cox10 variants and their implications for Leigh Syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We thought that using more sensitive enzyme assays might reveal partial activity from one or both proteins but found that both are fully nonfunctional
    explanation: The follow-up did not find residual activity for these alleles in yeast.
  discussion_id: cox10_clinical_variability
  kind: INTERPRETATION
  prompt: Does severe biochemical deficiency determine clinical severity?
  rationale: Severe biochemical or yeast respiratory defects do not imply an inevitable infantile outcome. The adult Asp336Val/Arg339Trp case and the yeast follow-up leave the determinants of organ involvement and survival unresolved; proposed modifier genes remain hypotheses.
- evidence:
  - reference: PMID:38846886
    reference_title: 'Complex mitochondrial disease caused by the mutation of COX10 in a toddler: a case-report study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Functional studies might elucidate the impact of these variants on the produced protein by the COX10 gene.
    explanation: The case report calls for functional studies rather than reporting them.
  - reference: PMID:39152498
    reference_title: Phenotypic assessment of Cox10 variants and their implications for Leigh Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The second variant is highly similar to the T380I variant that we found to be nonfunctional
    explanation: Thr377Ile is discussed by analogy to a different tested variant.
    quote_role: BACKGROUND
  discussion_id: cox10_uncertain_toddler_variants
  kind: INTERPRETATION
  prompt: Do the reported toddler variants establish COX10 deficiency?
  rationale: The Thr377Ile and Thr14Ile substitutions were reported as VUS, not proven pathogenic alleles. The later yeast paper tested Thr380Ile and discussed Thr377Ile by positional analogy; that is not direct functional testing of Thr377Ile. Clinical observations and supplement exposure from the toddler report therefore remain provisional disease-association evidence.
notes: COX10 disease is a variable heme A biosynthesis/complex IV biogenesis disorder, not primary coenzyme Q10 deficiency. Genetically confirmed myopathic adult and Leigh-spectrum presentations are retained within one entry. Phenotype frequencies and penetrance cannot be inferred from the small, selected reports. The nuclear Leigh-spectrum GeneReviews overview supplies general care and counseling context; its pooled frequencies and therapies for other genes are not COX10-specific evidence.

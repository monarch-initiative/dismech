  description: 'Establish biallelic pathogenic COX10 variants in a compatible phenotype, using a mitochondrial-disease panel or genomic sequencing and segregation studies. Include copy-number analysis: a COX10 partial deletion can be missed by sequence-only interpretation, particularly when PMP22-associated neuropathy coexists.'

      explanation: Observed in a reported COX10 candidate case with two VUS; attribution is provisional.
      directness: INDIRECT
- name: White Matter Injury
  biological_scale: TISSUE
  description: COX10-associated Leigh disease can involve diffuse white-matter degeneration with myelin and axonal loss, neuropil vacuolation and gliosis. These tissue findings do not establish a specific primary oligodendrocyte defect.
  evidence:
  - reference: PMID:36176336
    reference_title: Biallelic COX10 Mutations and PMP22 Deletion in a Family With Leigh Syndrome and Hereditary Neuropathy With Liability to Pressure Palsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The brain showed diffuse and severe white matter degeneration
    explanation: Postmortem pathology in an affected member of the COX10/PMP22 family.
  - reference: PMID:36176336
    reference_title: Biallelic COX10 Mutations and PMP22 Deletion in a Family With Leigh Syndrome and Hereditary Neuropathy With Liability to Pressure Palsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The loss of myelin and axons appeared to be similar in extent in the degenerated white matter
    explanation: Both myelin and axons were affected; this does not prove that one lesion initiates the other.
  downstream:
  - target: Leukodystrophy
    causal_link_type: DIRECT
    description: White-matter degeneration underlies the leukodystrophic presentation.
  - target: Encephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Diffuse CNS injury contributes to progressive neurologic dysfunction.
  - target: Spastic paraplegia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: White-matter tract injury can contribute to pyramidal motor dysfunction.
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: CNS involvement can impair cognition and development.
  - target: Cerebellar ataxia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Cerebellar and connecting white-matter injury can contribute to ataxia.

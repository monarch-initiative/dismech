      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We describe an adult patient with isolated COX deficiency associated with a relatively mild clinical phenotype comprising myopathy; demyelinating neuropathy; premature ovarian failure; short stature; hearing loss; pigmentary maculopathy; and renal tubular dysfunction.
      explanation: Myopathy accompanies confirmed COX10-associated biochemical deficiency.
  - target: Hypertrophic cardiomyopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

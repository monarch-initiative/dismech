name: COX10-Related COX Deficiency
category: Mendelian
creation_date: '2026-05-30T00:00:00Z'
synonyms:
- COX10 deficiency
- Mitochondrial complex IV deficiency, nuclear type 3
- MC4DN3
- COX10-related cytochrome c oxidase deficiency
disease_term:
  preferred_term: COX10-related COX deficiency (MC4DN3)
  term:
    id: MONDO:0033635
    label: mitochondrial complex IV deficiency, nuclear type 3
parents:
- Mitochondrial Disease
- Inborn Error of Metabolism
description: COX10-related cytochrome c oxidase deficiency is an autosomal recessive mitochondrial disorder caused by biallelic pathogenic COX10 variants. COX10 is heme O synthase, an enzyme required for heme A biosynthesis and complex IV biogenesis, rather than a structural subunit of mature complex IV. Reported disease ranges from infantile Leigh syndrome or cardiomyopathy with anemia to childhood white-matter disease and a multisystem phenotype compatible with survival into adulthood. The severity of biochemical deficiency does not reliably predict clinical severity.
pathophysiology:
- name: COX10 Dysfunction
  biological_scale: MOLECULAR
  description: Biallelic pathogenic missense, initiation-codon or partial-deletion alleles impair COX10 function. Different variants require individual evaluation; sequence prediction alone does not establish loss of function.
  genes:
  - preferred_term: COX10
    term:
      id: hgnc:2260
      label: COX10
  evidence:
  - reference: PMID:10767350
    reference_title: A mutation in the human heme A:farnesyltransferase gene (COX10 ) causes cytochrome c oxidase deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Mutation analysis followed by a complementation study in yeast permitted us to ascribe the COX deficiency to a homozygous missense mutation in the COX10 gene.
    explanation: Human segregation and yeast complementation established the causal gene.
  - reference: PMID:15455402
    reference_title: Cytochrome c oxidase biogenesis in a patient with a mutation in COX10 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report a cytochrome c oxidase (COX)-deficient patient, clinically affected with Leigh-like disease, with a homozygous mutation in the COX10 start codon.
    explanation: Initiation-codon disruption is another established allelic class.
  downstream:
  - target: Deficient Heme A Biosynthesis
    causal_link_type: DIRECT
    description: Impaired heme O synthase reduces production of the precursor required for heme A.
    evidence:
    - reference: PMID:12928484
      reference_title: Mutations in COX10 result in a defect in mitochondrial heme A biosynthesis and account for multiple, early-onset clinical phenotypes associated with isolated COX deficiency.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: COX10 functions in the first step of the mitochondrial heme A biosynthetic pathway, catalyzing the conversion of protoheme (heme B) to heme O via the farnesylation of a vinyl group at position C2.
      explanation: COX10 catalyzes the first biosynthetic step.
      quote_role: BACKGROUND
  molecular_functions:
  - preferred_term: protoheme IX farnesyltransferase activity
    term:
      id: GO:0008495
      label: protoheme IX farnesyltransferase activity
    modifier: DECREASED
- name: Deficient Heme A Biosynthesis
  biological_scale: MOLECULAR
  description: Deficient conversion of heme B to heme O limits heme A availability. Reduced heme A was measured in patient muscle and fibroblast mitochondria.
  biological_processes:
  - preferred_term: heme A biosynthetic process
    term:
      id: GO:0006784
      label: heme A biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:12928484
    reference_title: Mutations in COX10 result in a defect in mitochondrial heme A biosynthesis and account for multiple, early-onset clinical phenotypes associated with isolated COX deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Heme A content was reduced in mitochondria from patient muscle and fibroblasts in proportion to the reduction in COX enzyme activity and the amount of fully assembled enzyme.
    explanation: Heme A depletion tracks the biochemical COX defect in patient tissue and cultures.
  downstream:
  - target: Reduced Complex IV Assembly
    causal_link_type: DIRECT
    description: Limited heme A availability impairs maturation of the heme-containing COX complex.
    evidence:
    - reference: PMID:12928484
      reference_title: Mutations in COX10 result in a defect in mitochondrial heme A biosynthesis and account for multiple, early-onset clinical phenotypes associated with isolated COX deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Heme A content was reduced in mitochondria from patient muscle and fibroblasts in proportion to the reduction in COX enzyme activity and the amount of fully assembled enzyme.
      explanation: The study links lower heme A with less assembled COX.
- name: Reduced Complex IV Assembly
  biological_scale: MOLECULAR
  conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
  description: Patients have reduced fully assembled cytochrome c oxidase and reduced core subunits. The start-codon case and the adult missense case lacked accumulation of the partially assembled intermediates seen with some other COX assembly defects.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex IV assembly
    term:
      id: GO:0033617
      label: mitochondrial respiratory chain complex IV assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:15455402
    reference_title: Cytochrome c oxidase biogenesis in a patient with a mutation in COX10 gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Two-dimensional gel electrophoresis showed a decrease of fully assembled COX without the accumulation of partially assembled COX subcomplexes.
    explanation: The assembly defect is demonstrated directly.
  - reference: PMID:24100867
    reference_title: COX10 mutations resulting in complex multisystem mitochondrial disease that remains stable into adulthood.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Muscle COX holoenzyme and subassemblies were undetectable on immunoblots of blue-native gels, whereas denaturing gels and immunocytochemistry showed reduced core subunit MTCO1.
    explanation: The adult phenotype also has an early COX assembly defect.
  downstream:
  - target: Reduced Terminal Electron Transfer
    causal_link_type: DIRECT
    description: Reduced functional COX lowers capacity for electron transfer from cytochrome c to oxygen.
    evidence:
    - reference: PMID:12928484
      reference_title: Mutations in COX10 result in a defect in mitochondrial heme A biosynthesis and account for multiple, early-onset clinical phenotypes associated with isolated COX deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Heme A content was reduced in mitochondria from patient muscle and fibroblasts in proportion to the reduction in COX enzyme activity and the amount of fully assembled enzyme.
      explanation: Less assembled enzyme accompanies lower enzyme activity.
- name: Reduced Terminal Electron Transfer
  biological_scale: MOLECULAR
  description: Reduced complex IV activity limits terminal respiratory-chain capacity. This is a reduction in respiratory reserve, not evidence that electron transfer or ATP generation is completely absent in every patient.
  biological_processes:
  - preferred_term: mitochondrial electron transport, cytochrome c to oxygen
    term:
      id: GO:0006123
      label: mitochondrial electron transport, cytochrome c to oxygen
    modifier: DECREASED
  evidence:
  - reference: PMID:36176336
    reference_title: Biallelic COX10 Mutations and PMP22 Deletion in a Family With Leigh Syndrome and Hereditary Neuropathy With Liability to Pressure Palsy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The enzyme activity in fibroblast revealed a selective decrease in complex IV
    explanation: Patient fibroblasts show an isolated complex IV defect.
  - reference: PMID:39152498
    reference_title: Phenotypic assessment of Cox10 variants and their implications for Leigh Syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Cells expressing the other variants showed low cytochrome c oxidase activity and failed to grow on nonfermentable media.
    explanation: Human COX10 variants can reduce COX activity and respiratory growth in yeast.
  downstream:
  - target: Impaired Oxidative Energy Production
    causal_link_type: DIRECT
    description: Reduced COX-dependent proton translocation can restrict oxidative ATP production.
    evidence:
    - reference: PMID:38846886
      reference_title: 'Complex mitochondrial disease caused by the mutation of COX10 in a toddler: a case-report study.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: This electron transfer process is coupled with the movement of protons across the inner membrane, which ultimately contributes to the creation of a proton gradient.
      explanation: General biochemical background, not a measured ATP deficit in this uncertain-genotype child.
      quote_role: BACKGROUND
- name: Impaired Oxidative Energy Production
  biological_scale: CELLULAR
  description: Reduced respiratory capacity can limit oxidative energy generation and increase vulnerability to metabolic stress. The clinical expression is variable; neither uniform ATP collapse nor an invariant sequence of organ injury has been established.
  biological_processes:
  - preferred_term: mitochondrial ATP synthesis coupled electron transport
    term:
      id: GO:0042775
      label: mitochondrial ATP synthesis coupled electron transport
    modifier: DECREASED
  evidence:
  - reference: PMID:38846886
    reference_title: 'Complex mitochondrial disease caused by the mutation of COX10 in a toddler: a case-report study.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: This proton gradient is then utilized by adenosine triphosphate (ATP) synthase to generate ATP through the process of ATP synthesis
    explanation: General bioenergetic basis for the downstream effect of respiratory-chain dysfunction.
    quote_role: BACKGROUND
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK320989/
    reference_title: Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: a continuum of progressive neurodegenerative disorders caused by abnormalities of mitochondrial energy generation
    explanation: General Leigh-spectrum mechanism applicable to the COX10-associated encephalopathic presentation.
    quote_role: BACKGROUND
  downstream:
  - target: White Matter Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Mitochondrial dysfunction is associated with destructive white-matter lesions in COX10-associated Leigh disease; the intervening cellular sequence is unresolved.
  - target: Myopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Respiratory-chain dysfunction contributes to muscle disease.
    evidence:
    - reference: PMID:24100867

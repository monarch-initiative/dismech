    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data demonstrate a strong association between WT1 germline variants and somatic 11p15.5 copy neutral LOH events (paternal uniparental disomy) that encompass both the 11p15.5 and WT1/11p13 loci, resulting in biallelic expression of IGF2 and biallelic inactivation of WT1"
    explanation: >-
      Direct observation in tumors from germline carriers: one somatic paternal
      uniparental disomy event inactivates the second WT1 allele and makes IGF2
      biallelically expressed.
  - reference: PMID:42105606
    reference_title: "Novel truncating WT1 germline variant in a case of familial Wilms tumor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel germline truncating heterozygous WT1 variant (c.634G>T, p.(Glu212Ter)) in exon 1 was identified in blood and a second WT1 hit was identified in the tumor (c.856C>T, p.(Gln286Ter)) in exon 3 using whole genome sequencing."
    explanation: >-
      A second intragenic truncating hit as the alternative second-hit route in a
      familial case.
  - reference: PMID:20106868
    reference_title: "Wilms tumor cells with WT1 mutations have characteristic features of mesenchymal stem cells and express molecular markers of paraxial mesoderm."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Four of the five Wilms cell lines had a stable normal karyotype for at least 25 passages, and four lines showed loss of heterozygosity of chromosome 11p due to mitotic recombination in 11p11."
    explanation: >-
      Cell lines derived from WT1-mutant tumors carry 11p loss of heterozygosity by
      mitotic recombination. The paper does not separate germline from somatic
      WT1 mutations in these lines.

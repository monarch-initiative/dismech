name: WT1-Related Wilms Tumor Predisposition
creation_date: "2026-10-13T19:38:14Z"
description: >-
  WT1-related Wilms tumor predisposition (Wilms tumor 1) is autosomal dominant
  predisposition to Wilms tumor caused by heterozygous constitutional
  loss-of-function variants in WT1, mostly nonsense and frameshift, many of them
  arising de novo. ClinGen grades WT1 to this condition as Definitive and curates
  it separately from the WT1 congenital malformation syndromes (Denys-Drash,
  Frasier, Meacham, nephrotic syndrome type 4) on the basis of lesion class:
  truncating loss of function here, dominant-negative zinc finger missense in
  Denys-Drash. Carriers develop Wilms tumor in infancy, at a median of 12.5 months
  against 36 months in children without a germline WT1 alteration, often in both
  kidneys and sometimes metachronously. The tumors are typically
  stromal-predominant with rhabdomyogenic differentiation and arise from
  intralobar nephrogenic rests. The wild-type allele is lost in the tumor, most
  often by somatic paternal uniparental disomy of 11p that also produces biallelic
  IGF2 expression, and activating CTNNB1 mutations follow as a later event in
  nearly every WT1-mutant tumor. Germline WT1 variants are found in 2.1 per cent of
  nonsyndromic Wilms tumor and 14.8 per cent of synchronous bilateral Wilms tumor.
  Cryptorchidism and hypospadias occur, mainly in 46,XY carriers, and a minority
  of truncating-variant carriers develop chronic kidney disease, including kidney
  failure in adulthood. Carriers are offered renal ultrasound every three months
  until the seventh birthday, nephron-sparing surgery where feasible, and
  lifelong monitoring of kidney function.
category: Mendelian
parents:
- hereditary Wilms tumor
synonyms:
- Wilms tumor 1
- WT1-related Wilms tumor predisposition
- Wilms tumor type 1

  - target: Somatic Paternal Uniparental Disomy of 11p
    causal_link_type: DIRECT
    description: >-
      The constitutional allele is present in every nephrogenic cell, so a single
      somatic recombination event on 11p in a susceptible cell can make the mutant
      allele homozygous.
  - target: Constitutional WT1 Haploinsufficiency in Gonadal and Glomerular Development

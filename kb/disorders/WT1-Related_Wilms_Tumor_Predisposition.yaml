phenotypes:
- category: Neoplastic
  name: Early-Onset Wilms Tumor
  description: >-
    Wilms tumor presenting in infancy, at a median of 12.5 months in germline WT1
    carriers against 36 months without a germline WT1 alteration in a pooled
    series of 282 patients, with the earliest onset in truncating variants.
    Tumors are usually stromal-predominant with favorable histology. Tumors up to
    age 8 have been reported. Wilms tumor is the only manifestation in some
    carriers, most of them girls in the Dutch national cohort.
  phenotype_term:
    preferred_term: Early-onset nephroblastoma
    term:
      id: HP:0002667
      label: Nephroblastoma
    onset:
      onset_category: INFANTILE
  evidence:
  - reference: PMID:15150775
    reference_title: "Twenty-four new cases of WT1 germline mutations and review of the literature: genotype/phenotype correlations for Wilms tumor development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using this information we have determined the median age of tumor-onset for patients with (12.5 months) and without WT1 gene alterations (36 months). The earliest onset was in patients with truncation (12 mo, 66 patients), followed by missense mutations (18 mo, 30 patients) and deletions (22 mo, 21 patients)."
    explanation: >-
      Source for the median onset ages and for the earliest onset in truncating
      variants, in a pooled series of 282 patients.
  - reference: PMID:15483024
    reference_title: "Frequency and heritability of WT1 mutations in nonsyndromic Wilms' tumor patients: a UK Children's Cancer Study Group Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The WT1 mutation group had a young median age at diagnosis of 13.8 months, compared with 34.9 months in the group in whom no WT1 mutations were found"
    explanation: >-
      Independent unselected nonsyndromic series with the same infantile onset.
  - reference: PMID:28674120

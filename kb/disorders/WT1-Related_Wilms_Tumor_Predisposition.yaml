animal_models:
- name: Wt1 mosaic ablation with Igf2 upregulation mouse
  species: Mouse
  genotype: Mosaic somatic Wt1 ablation on a constitutional Igf2 upregulation background
  publication: PMID:21123950
  modeled_mechanisms:
  - target: Biallelic WT1 Loss in Nephron Progenitors
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Somatic Wt1 ablation blocks mesenchymal differentiation in the developing
      kidney, and combined with Igf2 upregulation produces early-onset Wilms
      tumors.
    limitations: >-
      Wt1 is deleted in a mosaic pattern rather than carried as a constitutional
      heterozygous truncating allele with a clonal second hit, and Igf2 is
      upregulated constitutionally rather than by uniparental disomy in the
      Wt1-null clone. No Ctnnb1 mutation is engineered.
    evidence:
    - reference: PMID:21123950
      reference_title: Wt1 ablation and Igf2 upregulation in mice result in Wilms tumors with elevated ERK1/2 phosphorylation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we engineered mice to sustain mosaic, somatic ablation of Wt1 and constitutional Igf2 upregulation, mimicking a subset of human tumors. Mice with this combination of genetic alterations developed tumors at an early age."
      explanation: >-
        Wt1 loss with Igf2 upregulation gives Wilms tumors in mice.
  - target: Biallelic IGF2 Expression
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Igf2 is upregulated throughout the animal, standing in for the clonal
      biallelic IGF2 expression produced by 11p paternal uniparental disomy.
    limitations: >-
      Constitutional rather than clonal Igf2 excess, and not produced by the same
      event that removes Wt1.
    evidence:
    - reference: PMID:21123950
      reference_title: Wt1 ablation and Igf2 upregulation in mice result in Wilms tumors with elevated ERK1/2 phosphorylation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mechanistically, Wt1 ablation blocked mesenchyme differentiation, and increased Igf2 expression upregulated ERK1/2 phosphorylation."
      explanation: >-
        Igf2 upregulation in the model acts through ERK1/2 phosphorylation.
treatments:
- name: Renal Ultrasound Surveillance
  description: >-
    Children with a germline WT1 variant are offered renal ultrasound every three
    months from birth or diagnosis until the seventh birthday, the schedule given
    in the GeneReviews WT1 Disorder chapter and the AACR consensus and its 2024
    update. The 2006 UK recommendations stopped at age 5 for WT1-associated
    conditions.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: renal ultrasound surveillance
    term:
      id: NCIT:C159885
      label: Renal Ultrasound
  target_mechanisms:
  - target: Early-Onset Wilms Tumor
    description: >-
      Surveillance detects tumors early; it does not prevent initiation.
  - target: Bilateral Wilms Tumor
    description: >-
      Both kidneys are imaged at each examination, so a contralateral or
      metachronous tumor can be detected early.
  evidence:
  - reference: PMID:32352694
    reference_title: WT1 Disorder.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Wilms tumor every three months until age seven years"
    explanation: >-
      GeneReviews surveillance schedule for Wilms tumor in germline WT1 carriers.
  - reference: PMID:28674120
    reference_title: Surveillance Recommendations for Children with Overgrowth Syndromes and Predisposition to Wilms Tumors and Hepatoblastoma.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "For WT, starting at birth (or the time of diagnosis of the specific syndrome) we recommend renal ultrasound screening including the adrenal glands, every 3 months through the child’s seventh birthday."
    explanation: >-
      AACR Childhood Cancer Predisposition Workshop recommendation, which covers
      the WT1-related syndromes.
  - reference: PMID:39320341
    reference_title: Update on Surveillance for Wilms Tumor and Hepatoblastoma in Beckwith-Wiedemann Syndrome and Other Predisposition Syndromes.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "When these syndromes are initially recognized, often through nephrology evaluation, surveillance should be initiated with abdominal ultrasound every three months through age seven as for other predisposition syndromes with risk of WT."
    explanation: >-
      The 2024 AACR update applies the same schedule to the WT1-related tumor
      predisposition syndromes.
  - reference: PMID:16857697
    reference_title: "Surveillance for Wilms tumour in at-risk children: pragmatic recommendations for best practice."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "For the WT1‐associated syndromes, mosaic‐variegated aneuploidy, Fanconi anaemia D1 and Perlman syndrome, virtually all tumours occur before 5 years and thus surveillance is not recommended beyond this age."
    explanation: >-
      The earlier UK recommendation ended surveillance at age 5, the source of the
      differing end ages recorded in the surveillance discussion.
- name: Nephron-Sparing Surgery and Standard Wilms Tumor Therapy
  description: >-
    Tumors are treated on standard Wilms tumor protocols, with nephron-sparing
    surgery when applicable, because carriers are at risk of contralateral or
    metachronous tumors and of later chronic kidney disease.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: nephron-sparing surgery
    term:
      id: NCIT:C51928
      label: Partial Nephrectomy
  target_mechanisms:
  - target: Early-Onset Wilms Tumor
  evidence:
  - reference: PMID:32352694
    reference_title: WT1 Disorder.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Treat Wilms tumor with standard oncology protocols and, when applicable, nephron-sparing surgery."
    explanation: >-
      GeneReviews management recommendation for Wilms tumor in germline WT1
      carriers.
- name: Lifelong Kidney Function Monitoring
  description: >-
    Kidney function is monitored for life, including in carriers ascertained
    through Wilms tumor alone, because truncating-variant carriers can develop
    chronic kidney disease and kidney failure in adulthood.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: kidney function monitoring
    term:
      id: NCIT:C74972
      label: Renal Function Test
  target_mechanisms:
  - target: Chronic Kidney Disease
  evidence:
  - reference: PMID:39698353
    reference_title: Clinical Characterization of a National Cohort of Patients With Germline WT1 Variants Including Late-Onset Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although childhood-onset CKD was more common in patients with missense variants in the DNA-binding/Zinc-finger domain, other patients may develop CKD and kidney failure later in life. Therefore, life-long surveillance of kidney function is recommended."
    explanation: >-
      Recommendation from the Dutch national cohort, which included adult kidney
      failure in truncating-variant carriers.
- name: Genetic Counseling and Cascade Testing
  description: >-
    Identifying the germline variant allows testing of at-risk relatives, so that
    carriers can start tumor and kidney surveillance. Recurrence risk to sibs of an
    apparently de novo case is above population risk because of possible parental
    gonadal mosaicism.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:32352694
    reference_title: WT1 Disorder.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "It is appropriate to clarify the genetic status of apparently asymptomatic older and younger at-risk relatives of an individual with WT1 disorder in order to identify as early as possible those who would benefit from prompt initiation of treatment and surveillance for glomerulopathy and Wilms tumor."
    explanation: >-
      GeneReviews recommendation for cascade testing.
  - reference: PMID:32352694
    reference_title: WT1 Disorder.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "If the WT1 pathogenic variant identified in the proband cannot be detected in the leukocyte DNA of either parent, the recurrence risk to sibs is slightly greater than that of the general population because of the possibility of parental gonadal mosaicism."
    explanation: >-
      Recurrence risk counselling for an apparently de novo variant.
diagnosis:
- name: Germline WT1 genetic testing
  diagnosis_term:
    preferred_term: germline WT1 genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Testing of WT1 in constitutional DNA. Features that raise the likelihood of a
    germline variant in a child with Wilms tumor are early onset,
    stromal-predominant histology, bilateral tumors, genitourinary anomalies and
    early nephrotic syndrome; girls with Wilms tumor alone are the group most
    often missed. Testing outside the exon 8 and 9 hotspot is needed, since many
    truncating variants found in Wilms tumor lie outside it.
  results: >-
    A heterozygous pathogenic WT1 variant in constitutional DNA establishes the
    diagnosis.
  evidence:
  - reference: PMID:15150775
    reference_title: "Twenty-four new cases of WT1 germline mutations and review of the literature: genotype/phenotype correlations for Wilms tumor development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to genital tract anomalies (GU), early onset nephrotic syndrome with diffuse mesangial sclerosis and stromal-predominant histology, tumor bilaterality, and early age of onset can now be added to the list of risk factors for carrying a germline WT1 mutation."
    explanation: >-
      Clinical features that indicate germline WT1 testing.
  - reference: PMID:32352694
    reference_title: WT1 Disorder.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of WT1 disorder is established in a proband with suggestive clinical findings and a heterozygous pathogenic variant in WT1 identified by molecular genetic testing."
    explanation: >-
      GeneReviews diagnostic criterion, which applies across the germline WT1
      continuum including this entry.
  - reference: PMID:39698353
    reference_title: Clinical Characterization of a National Cohort of Patients With Germline WT1 Variants Including Late-Onset Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Being alert about WT1 variants is especially important for girls with Wilms tumor who often miss additional phenotypes."
    explanation: >-
      Girls with Wilms tumor alone are the carriers most easily missed.
  - reference: PMID:39698353
    reference_title: Clinical Characterization of a National Cohort of Patients With Germline WT1 Variants Including Late-Onset Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Many WT1 variants that are identified in patients with Wilms tumor only are truncating variants located outside the hotspot region, in contrast to the variants that were identified earlier in patients with Denys-Drash syndrome or severe, early-onset glomerulopathy."
    explanation: >-
      Supports testing the whole gene rather than the exon 8 and 9 hotspot.
discussions:
- discussion_id: wt1_predisposition_surveillance_end_age
  kind: KNOWLEDGE_GAP
  status: UNDER_DISCUSSION
  prompt: >-
    When should renal tumor surveillance stop in a germline WT1 carrier, given
    that metachronous second tumors have been reported years after the age at
    which surveillance guidelines stop?
  attaches_to:
  - treatments#Renal Ultrasound Surveillance
  - phenotypes#Bilateral Wilms Tumor
  rationale: >-
    The consensus schedules end ultrasound at the seventh birthday (AACR and
    GeneReviews) or at age 5 (the 2006 UK recommendations), based on the age
    distribution of first tumors. The SIOP 9 long-term follow-up reported second
    tumors in germline carriers 3 and 11 years after the first, arising in kidneys
    with nephrogenic rests, and its authors concluded that surveillance until
    adulthood should be considered. No study of the yield of continued
    surveillance after a first tumor, or after age 7 in carriers without one, was
    found among the sources cited here.
  evidence:
  - reference: PMID:18618575
    reference_title: "Clinical relevance of mutations in the Wilms tumor suppressor 1 gene WT1 and the cadherin-associated protein beta1 gene CTNNB1 for patients with Wilms tumors: results of long-term surveillance of 71 patients from International Society of Pediatric Oncology Study 9/Society for Pediatric Oncology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with WT1 germline mutations had an increased risk for bilateral disease and second tumor events. Therefore, the authors concluded that tumor surveillance until adulthood should be considered."
    explanation: >-
      The study whose second-tumor observations conflict with the age-limited
      consensus schedules.
  - reference: PMID:28674120
    reference_title: Surveillance Recommendations for Children with Overgrowth Syndromes and Predisposition to Wilms Tumors and Hepatoblastoma.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "There have been reports of children with WT1 mutations developing WT up to 8 years of age (53)."
    explanation: >-
      First tumors in WT1 carriers have been reported past the seventh birthday.
- discussion_id: wt1_predisposition_unbiased_penetrance
  kind: KNOWLEDGE_GAP
  status: UNDER_DISCUSSION
  prompt: >-
    What is the Wilms tumor penetrance of a heterozygous truncating WT1 variant in
    a carrier who was not ascertained through a tumor?
  attaches_to:
  - inheritance#Autosomal dominant inheritance
  - phenotypes#Early-Onset Wilms Tumor
  rationale: >-
    Published figures come from carriers found through a Wilms tumor or a
    syndromic presentation, which inflates penetrance: Wilms tumor in 18 of 19
    truncating-variant carriers in the Dutch national cohort, and a risk of at
    least 50 per cent in the 2006 UK recommendations. Unaffected carriers occur in
    families. The figure matters for counselling relatives found by cascade
    testing and for the cost-benefit of surveillance, and would need a cohort of
    carriers identified by cascade or population sequencing.
  evidence:
  - reference: PMID:16857697
    reference_title: "Surveillance for Wilms tumour in at-risk children: pragmatic recommendations for best practice."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The Wilms tumour risk in children with truncating WT1 mutations or missense mutations in the zinc finger domains, including children with Denys–Drash syndrome and other WT1‐associated phenotypes, is at least 50%."
    explanation: >-
      The consensus risk estimate, a lower bound from ascertained patients rather
      than a cohort penetrance.

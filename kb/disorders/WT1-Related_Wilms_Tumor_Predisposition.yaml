- name: Somatic Paternal Uniparental Disomy of 11p
  conforms_to: "germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type Allele"
  biological_scale: MOLECULAR
  description: >-
    In tumors from germline carriers, the wild-type WT1 allele is usually lost by
    copy-neutral loss of heterozygosity of 11p (paternal uniparental disomy) that
    spans both 11p13 and 11p15.5. The one event therefore makes the germline WT1
    allele homozygous and gives biallelic expression of the paternally expressed
    IGF2. A second intragenic WT1 mutation is a less common route.

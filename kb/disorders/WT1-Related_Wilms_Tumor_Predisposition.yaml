notes: >-
  Scope. This entry is the constitutional predisposition; the somatic tumor,
  including tumors with only somatic WT1 inactivation, is curated on Wilms_Tumor,
  under design decision 3a. MONDO's synonym list for this class includes "Wilms
  tumor, somatic", inherited from the OMIM entry that also lists somatic WT1
  mutations; that somatic usage is not curated here. The boundary with the other
  WT1 entries follows the ClinGen lumping and splitting ruling quoted on the
  genetic record: the dominant-negative zinc finger missense, intron 9 splice and
  11p13 contiguous-deletion conditions (Denys-Drash, Frasier, WAGR, Meacham) have
  their own entries, and this entry covers heterozygous loss-of-function WT1
  variants presenting with Wilms tumor, with or without genitourinary anomalies.
  The boundary is not clean on the gonadal side: the son in the exon 1 nonsense
  family cited under inheritance had gonadal dysgenesis with gonadoblastoma foci,
  so this lesion class can also produce gonadal dysgenesis. Gonadal dysgenesis and
  gonadoblastoma are not curated as phenotypes here because they are the defining
  features of the 46,XY presentations curated in the other WT1 entries.
  The GeneReviews WT1 Disorder chapter and the 2024 AACR surveillance update both
  describe all germline WT1 conditions as one continuum; the split here is the
  ClinGen one, and the overlap is real at the edges, since truncating-variant
  carriers can also develop chronic kidney disease and genitourinary anomalies.
  The file is named for the gene rather than the MONDO numbered label, matching
  the sibling entry TRIM28-Related_Wilms_Tumor_Predisposition; the MONDO label
  is kept as a synonym. Penetrance is not recorded as a value: the published
  estimates (at least 50 per cent for truncating variants in the 2006 UK
  recommendations; Wilms tumor in 18 of 19 truncating-variant carriers in the
  Dutch national cohort) come from carriers ascertained largely through a tumor.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous constitutional WT1 loss-of-function variants, most often de novo.
    Vertical transmission occurs, with marked intrafamilial variability: a mother
    with infantile Wilms tumor transmitted an exon 1 nonsense variant to a son who
    had genitourinary anomalies and gonadal dysgenesis but no Wilms tumor by age 6.
  evidence:
  - reference: CGGV:assertion_65010002-ff97-4dc0-a89f-6c77abf0982a-2020-07-30T205501.047Z
    reference_title: "WT1 / Wilms tumor 1 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In summary, loss of function variants in WT1 are definitively associated with autosomal dominant Wilms tumor type 1."
    explanation: >-
      ClinGen's summary assigns the autosomal dominant mode of inheritance to this
      MONDO class.
  - reference: PMID:32352694
    reference_title: WT1 Disorder.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "WT1 disorder is inherited in an autosomal dominant manner."
    explanation: >-
      GeneReviews states autosomal dominant inheritance. The chapter covers the
      whole germline WT1 continuum, of which this entry is the loss-of-function
      Wilms tumor presentation split out by ClinGen.
  - reference: PMID:32352694
    reference_title: WT1 Disorder.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Most individuals diagnosed with WT1 disorder have the disorder as the result of an apparent de novo WT1 pathogenic variant"
    explanation: >-
      Supports the predominance of de novo variants, stated across the whole
      germline WT1 continuum rather than for truncating variants alone.
  - reference: PMID:15483024
    reference_title: "Frequency and heritability of WT1 mutations in nonsyndromic Wilms' tumor patients: a UK Children's Cancer Study Group Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in four patients were confirmed to be de novo, and all five mutations are predicted to produce truncated protein."
    explanation: >-
      Most constitutional WT1 variants in unselected nonsyndromic Wilms tumor
      arose de novo.
  - reference: PMID:18688870
    reference_title: "Vertical transmission of a mutation in exon 1 of the WT1 gene: lessons for genetic counseling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present a vertical transmission of a nonsense mutation in exon 1 of the Wilms' tumor WT1 gene, from a mother who had Wilms' tumor in infancy and decreased fertility at adulthood, to her son who displayed genitourinary (GU) anomalies, gonadal dysgenesis with gonadoblastoma foci, and intra-abdominal Mullerian derivatives."
    explanation: >-
      Documents parent-to-child transmission of a truncating variant with
      different phenotypes in the two carriers.
  - reference: PMID:18688870
    reference_title: "Vertical transmission of a mutation in exon 1 of the WT1 gene: lessons for genetic counseling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No Wilms' tumor was detected up to the age of 6 years in the son."
    explanation: >-
      The son is a carrier without Wilms tumor by age 6, an instance of
      non-penetrance for the tumor within a family.

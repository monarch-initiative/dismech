- name: RPGR Glutamylation Failure
  description: >-
    The X-linked arm operates through a post-translational modification defect
    rather than the cGMP node. TTLL5 glutamylates RPGR-ORF15 in its glutamate-
    and glycine-rich repeat region, and loss of that modification causes
    photoreceptor degeneration with early mislocalisation of cone opsins. Distal
    truncating ORF15 variants that impair glutamylation associate with a
    cone-dominated phenotype.
  cell_types:

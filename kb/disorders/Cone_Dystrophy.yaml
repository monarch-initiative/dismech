name: Cone Dystrophy
creation_date: '2026-08-27T21:30:00Z'
synonyms:
- cone-rod dystrophy
- progressive cone dystrophy
- COD
- CORD
description: >-
  Cone dystrophy is a genetically heterogeneous inherited retinal dystrophy
  defined by primary dysfunction and progressive degeneration of the cone
  photoreceptors that populate the fovea and macula. Patients present with
  declining central visual acuity, colour vision loss, photophobia and, in
  early-onset forms, nystagmus. When rod photoreceptors become secondarily
  involved the disorder is termed cone-rod dystrophy, which adds night blindness
  and peripheral field loss. It is among the more common inherited retinal
  diseases after retinitis pigmentosa, with cone-rod dystrophy prevalence around
  1 in 14,000 in a nationwide cohort. Mechanistically a large fraction of cases
  converge on dysregulation of the cGMP/calcium phototransduction node in cone
  outer segments: dominant gain-of-function alleles of GUCA1A and GUCY2D cause
  aberrantly sustained cGMP synthesis, while recessive loss of PDE6C or of the
  CNGA3/CNGB3 cone channel disrupts the same node from the opposite direction.
  Other forms act through ciliary trafficking and post-translational modification
  defects (RPGR, TTLL5), visual-cycle dysfunction (ABCA4), or transcriptional
  dysregulation (CRX). Diagnosis rests on a photopic-selective electroretinogram
  deficit with relatively preserved scotopic responses, combined with optical
  coherence tomography and gene-panel sequencing. No approved cure exists;
  management is supportive, and AAV gene supplementation is the most advanced
  experimental therapy.
categories:
- Inherited Retinal Dystrophy
- Photoreceptor Degeneration
- Mendelian
parents:

  description: >-
    Full-field electroretinography is the decisive test. Cone dystrophy shows a
    photopic-selective deficit with markedly reduced light-adapted single-flash
    and near-extinguished 30 Hz flicker responses, while scotopic rod responses
    remain relatively preserved.
  diagnosis_term:
    preferred_term: electroretinography
    term:
      id: NCIT:C156778
      label: Vision Assessment
  evidence:
  - reference: PMID:42525358
    reference_title: Progressive cone dystrophy in PDE6C-associated achromatopsia with a
      likely pathogenic variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ffERG showed severe cone dysfunction, characterized by markedly reduced light-adapted
      single-flash responses and near-extinguished 30 Hz flicker responses, with relatively
      preserved rod-mediated scotopic responses.
    explanation: States the photopic-selective electroretinographic pattern that establishes
      the diagnosis.
- name: Molecular genetic testing
  description: >-
    Gene-panel or exome sequencing establishes the molecular diagnosis and is
    required for eligibility for genotype-directed therapy. Diagnostic yield is
    comparatively low in this phenotype, reflecting extensive genetic
    heterogeneity and variants such as those in the repetitive RPGR-ORF15 region
    that are hard to detect with short-read sequencing.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:40571344
    reference_title: Characterisation and prevalence of inherited retinal diseases in the
      Finnish population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The lowest rates of causative variant identification were observed in cone or
      cone-rod dystrophy and macular dystrophy.
    explanation: Documents the comparatively low molecular diagnostic yield in this phenotype.
treatments:
- name: Supportive Low-Vision Management
  description: >-
    No approved cure exists. Management is supportive: tinted and edge-filter
    lenses for photophobia, refractive correction, low-vision aids, and genetic
    counselling.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Progressive Central Vision Loss
    treatment_effect: MODULATES
    description: >-
      Optical and low-vision measures mitigate the functional consequences of
      central cone loss without altering the degeneration itself.
    evidence:
    - reference: PMID:40736814
      reference_title: Progressive Cone Dystrophy and Cone-Rod Dystrophy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: light intolerance (photophobia)
      explanation: Photophobia is the symptom that tinted and edge-filter lenses address.
  evidence:
  - reference: PMID:40736814
    reference_title: Progressive Cone Dystrophy and Cone-Rod Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Visual acuity deteriorates to 20/200 or even counting fingers.
    explanation: The degree of acuity loss that makes low-vision rehabilitation the mainstay
      of management.
- name: AAV Gene Supplementation
  description: >-
    Experimental, and the most advanced therapeutic frontier. Subretinal AAV
    delivery of the wild-type gene restored cone function and day vision in canine
    CNGB3 achromatopsia, providing the proof of concept for recessive
    loss-of-function cone disease. Dominant gain-of-function GUCY2D disease is not
    addressable by supplementation alone and requires editing approaches.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Cone Phototransduction Hydrolysis and Channel Failure
    treatment_effect: RESTORES
    description: >-
      Supplying a functional copy of the lost channel or enzyme gene restores cone
      phototransduction in recessive disease.
    evidence:
    - reference: PMID:20378608
      reference_title: Gene therapy rescues cone function in congenital achromatopsia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: restoration of cone function and day vision in two canine models of CNGB3
        achromatopsia
      explanation: Demonstrates restoration of the failed cone pathway by gene supplementation.
  evidence:
  - reference: PMID:20378608
    reference_title: Gene therapy rescues cone function in congenital achromatopsia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: rAAV-mediated gene replacement therapy with different forms of the human red
      cone opsin promoter led to the restoration of cone function and day vision in two canine
      models of CNGB3 achromatopsia
    explanation: Documents the AAV construct and the functional rescue achieved.
progression:
- phase: Onset and diagnosis
  age_range: First to third decade in most progressive forms
  notes: >-
    Presentation is usually with declining central acuity, colour vision loss and
    photophobia; nystagmus appears in early-onset disease. Diagnosis follows the
    photopic-selective electroretinogram.
  evidence:
  - reference: PMID:42525358
    reference_title: Progressive cone dystrophy in PDE6C-associated achromatopsia with a
      likely pathogenic variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: severe cone dysfunction, characterized by markedly reduced light-adapted single-flash
      responses
    explanation: Characterises the functional deficit present at diagnosis.
- phase: Progressive central sensitivity loss
  notes: >-
    Central retinal sensitivity declines faster in the cone-rod phenotype than in
    rod-cone disease, giving a shorter interval to total central sensitivity loss.
    The disease is lifelong and legally blinding but not directly life-limiting.
  evidence:
  - reference: PMID:41237986
    reference_title: Central Retinal Sensitivity Decline in RPGR-Related Retinal Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The median survival age to total loss of sensitivity for MS16 was 25.1 years
      in CORD and 33.1 years in rod-cone
    explanation: Gives the interval to total central sensitivity loss, the long-term
      functional endpoint.
disease_term:
  preferred_term: cone dystrophy
  term:
    id: MONDO:0000455
    label: cone dystrophy
notes: >-
  Scope: this entry covers progressive cone dystrophy and, where rods become
  secondarily involved, cone-rod dystrophy, which MONDO and the clinical
  literature treat as a continuum rather than separate diseases. It is distinct
  from Achromatopsia, already curated, which is congenital and stationary rather
  than progressive.

  The pathograph is organised around the convergent cGMP/calcium node rather than
  by gene, because dominant GUCA1A and GUCY2D gain-of-function alleles and
  recessive PDE6C and CNGA3/CNGB3 loss-of-function alleles reach the same
  biochemical lesion from opposite directions. The X-linked RPGR arm is modelled
  separately because it acts through a glutamylation and trafficking defect, not
  through cGMP.

  Known extension points: a datasets section; clinical_trials, including the AAV
  CNGA3 and CNGB3 gene therapy trials; the calpain/PARP execution cascade
  downstream of calcium overload, which the research report describes as a
  genotype-agnostic neuroprotective target but for which no directly quotable
  cached source was located; ABCA4, CRX, KCNV2 and CNGA3/CNGB3 as additional
  genetic entries; and the KCNV2 supernormal-rod electroretinogram, which is
  pathognomonic for cone dystrophy with supernormal rod response.

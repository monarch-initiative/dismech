- name: Cone Phototransduction Hydrolysis and Channel Failure
  description: >-
    The recessive arm reaches the same node from the opposite direction. PDE6C
    encodes the cone cGMP phosphodiesterase that degrades cGMP, and CNGA3/CNGB3
    encode the cone cyclic nucleotide-gated channel through which the cGMP signal
    is read. Biallelic loss of either disrupts cone phototransduction and produces
    progressive cone degeneration.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:

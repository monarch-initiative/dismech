pathophysiology:
- name: Sustained Guanylate Cyclase Activation
  description: >-
    In dominant disease, GCAP1 (GUCA1A) mutations in the EF-hand calcium-binding
    motifs lower calcium affinity so that GCAP1 fails to switch off retinal
    guanylate cyclase at the high calcium concentrations of the dark-adapted
    photoreceptor. GUCY2D dimerization-domain alleles act equivalently by raising
    the calcium set-point at which the cyclase remains GCAP1-stimulated. Both
    leave the cyclase inappropriately active.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell

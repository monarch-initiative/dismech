- name: Cone Photoreceptor Degeneration
  description: >-
    Convergent cellular outcome. Cones of the fovea and macula are lost first,
    producing the central-vision phenotype; when the process extends to rods the
    disorder becomes cone-rod dystrophy. Structural loss is measurable as
    contraction of the subfoveal ellipsoid zone on optical coherence tomography.

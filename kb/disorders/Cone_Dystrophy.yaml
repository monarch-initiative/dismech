- name: Progressive Central Vision Loss
  description: >-
    Clinical endpoint. Central sensitivity declines faster in cone-rod dystrophy
    than in rod-cone disease, and the course is lifelong, progressive and
    legally blinding without being directly life-limiting.
  locations:
  - preferred_term: macula lutea
    term:
      id: UBERON:0000053
      label: macula lutea
  evidence:
  - reference: PMID:41237986
    reference_title: Central Retinal Sensitivity Decline in RPGR-Related Retinal Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CORD patients exhibited significantly faster rates of central retinal sensitivity
      decline. The annual MS16 decline rate was 10.8% (95% CI: 6.6, 14.8) in CORD vs 5.1%
      (95% CI: 2.9, 7.1) in rod-cone patients (P = .02).
    explanation: Quantifies the faster central sensitivity decline in the cone-rod phenotype
      relative to rod-cone disease.

      likely pathogenic variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: severe cone dysfunction, characterized by markedly reduced light-adapted single-flash
      responses
    explanation: Documents the cone dysfunction that follows loss of the cone phosphodiesterase.
  downstream:
  - target: Cone Outer Segment cGMP Elevation
    description: Loss of the hydrolysing phosphodiesterase raises cGMP just as an overactive
      cyclase does.
    evidence:
    - reference: PMID:42525358
      reference_title: Progressive cone dystrophy in PDE6C-associated achromatopsia with
        a likely pathogenic variant.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: severe cone dysfunction, characterized by markedly reduced light-adapted single-flash
        responses
      explanation: PDE6C loss produces the cone dysfunction this convergent node describes.
- name: Cone Outer Segment cGMP Elevation
  description: >-
    The convergent biochemical lesion. Elevated cGMP in the cone outer segment
    holds cyclic nucleotide-gated channels open, admitting sodium and calcium and
    producing calcium overload. This node is genotype-agnostic, which is why it is
    an attractive neuroprotective target across otherwise unrelated genotypes.

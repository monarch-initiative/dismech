inheritance:
- name: Autosomal Dominant
  description: >-
    Dominant disease is typically caused by gain-of-function alleles of GUCA1A or
    GUCY2D that leave retinal guanylate cyclase inappropriately active.
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:

has_subtypes:
- name: AR complete
  display_name: Autosomal recessive complete IFN-gammaR1 deficiency
  classification: molecular
  description: >-
    No IFN-gamma response, with or without receptor at the cell surface. Fully
    penetrant, with onset in early childhood, disseminated infection and
    lepromatous-like granulomas; fatal without haematopoietic stem cell
    transplantation. Recombinant IFN-gamma has no receptor to act on.
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0020530
        label: Mendelian susceptibility to mycobacterial diseases due to complete IFNgammaR1 deficiency
      mapping_predicate: skos:exactMatch
      mapping_source: MONDO
      mapping_justification: >-
        MONDO's own term for the complete form. Recorded as a mapping because
        subtype_term binds DiseaseOrSubtypeTerm, whose MONDO root is
        MONDO:0000001 disease, and this term sits only under MONDO:0020573
        inherited disease susceptibility.
  evidence:
  - reference: PMID:10811850
    reference_title: "In a novel form of IFN-gamma receptor 1 deficiency, cell surface receptors fail to bind IFN-gamma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected children invariably die of mycobacterial infection, unless bone marrow transplantation is undertaken."
    explanation: States the prognosis that defines the complete form.
  - reference: PMID:32025907
    reference_title: "Mendelian susceptibility to mycobacterial disease: recent discoveries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Indeed, the only four genetic etiologies shown to date to be fully penetrant (i.e. Mendelian) in childhood and always lethal before the third decade of life in the absence of hematopoietic stem cell transplantation (HSCT) are complete IFN-γR1 and IFN-γR2 deficiencies (7)."
    explanation: Full penetrance and lethality without transplantation in complete IFN-gammaR1 deficiency.
- name: AR partial
  display_name: Autosomal recessive partial IFN-gammaR1 deficiency
  classification: molecular
  description: >-
    Residual IFN-gamma response, through a surface-expressed hyporesponsive
    receptor (I87T and V63G founder alleles) or through low-level expression of
    normal receptor (M1K). Onset is later and the course milder, granulomas are
    tuberculoid, and infection is controlled by antimycobacterial drugs with
    recombinant IFN-gamma; transplantation is not indicated. The M1K form is an
    exception, nearly as severe as complete deficiency.
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0017901
        label: autosomal recessive Mendelian susceptibility to mycobacterial diseases due to partial IFNgammaR1 deficiency
      mapping_predicate: skos:exactMatch
      mapping_source: MONDO
      mapping_justification: >-
        MONDO's own term for the partial recessive form. Recorded as a mapping
        for the same enum-root reason as the complete subtype.
  evidence:
  - reference: PMID:21266457
    reference_title: "Partial recessive IFN-γR1 deficiency: genetic, immunological and clinical features of 14 patients from 11 kindreds."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The I87T mutation was found in nine homozygous patients from Chile, Portugal and Poland, and the V63G mutation was found in five homozygous patients from the Canary Islands."
    explanation: The two founder alleles of the partial recessive form.
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "HSCT is not indicated, given the relatively mild infectious phenotype."
    explanation: Distinguishes management of the partial form from the complete form.
  - reference: PMID:19880857
    reference_title: A novel form of cell type-specific partial IFN-gammaR1 deficiency caused by a germ line mutation of the IFNGR1 initiation codon.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here a novel form of partial and recessive Interferon gamma receptor 1 (IFN-gammaR1) deficiency, which is almost as severe as complete deficiency."
    explanation: The M1K exception within the partial subtype.
- name: AD partial
  display_name: Autosomal dominant partial IFN-gammaR1 deficiency (immunodeficiency 27B)
  classification: molecular
  curated_in: Autosomal_Dominant_Mendelian_Susceptibility_To_Mycobacterial_Diseases_Due_To_Partial_IFNgammaR1_Deficiency
  description: >-
    Pointer to the separately curated dominant form. Heterozygous truncations
    in exon 6 produce receptors that accumulate at the cell surface and act as
    dominant negatives, a different lesion from the recessive loss of receptor
    function curated here.
diagnosis:
- name: IFN-gammaR1 cell-surface expression by flow cytometry
  description: >-
    Absent surface IFN-gammaR1 on monocytes or granulocytes supports complete
    deficiency. A normal result does not exclude it, because the
    surface-expressed complete form and the I87T and V63G partial forms all
    display receptor; expression must be read with a functional assay.
  markers: IFN-gammaR1 (CD119) surface expression on monocytes or granulocytes
  evidence:
  - reference: PMID:26931784
    reference_title: Deletion of the entire interferon-γ receptor 1 gene causing complete deficiency in three related patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no expression of the IFN-γR1 on the monocytes."
    explanation: The flow cytometric finding in non-expressing complete deficiency.
  - reference: PMID:10811850
    reference_title: "In a novel form of IFN-gamma receptor 1 deficiency, cell surface receptors fail to bind IFN-gamma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The detection of surface IFNgammaR1 molecules by specific antibodies, including blocking antibodies, does not exclude a diagnosis of complete IFNgammaR1 deficiency."
    explanation: Why a normal surface-expression result is not reassuring.
- name: Functional IFN-gamma responsiveness of patient cells
  description: >-
    Stimulation of patient blood, EBV-B cells or fibroblasts with graded IFN-gamma
    concentrations, reading out STAT1 activation, HLA class II or CD64
    induction, or IL-12 and TNF-alpha production. No response at any dose
    indicates complete deficiency; a response only at high doses indicates
    partial deficiency.
  markers: IFN-gamma-induced STAT1 activation, HLA-II or CD64 induction, IL-12p40/TNF-alpha production
  evidence:
  - reference: PMID:9389728
    reference_title: Partial interferon-gamma receptor 1 deficiency in a child with tuberculoid bacillus Calmette-Guérin infection and a sibling with clinical tuberculosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Impaired response to IFN-gamma was documented in B cells by signal transducer and activator of transcription 1 nuclear translocation, in fibroblasts by cell surface HLA class II induction, and in monocytes by cell surface CD64 induction and TNF-alpha secretion."
    explanation: The assay readouts used across three patient cell types.
- name: IFNGR1 sequencing and copy-number analysis
  description: >-
    Molecular confirmation by sequencing, with copy-number analysis because
    whole-gene deletions and compound heterozygosity for a copy-number variant
    are reported and are missed by sequencing alone.
  evidence:
  - reference: PMID:32714620
    reference_title: Disseminated Mycobacterium Avium Infection in a Child with Complete Interferon-γ Receptor 1 Deficiency due to Compound Heterozygosis of IFNGR1 for a Subpolymorphic Copy Number Variation and a Novel Splice-Site Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein we describe the clinical presentation, diagnosis, and successful treatment with hematopoietic stem cell transplantation of a child with disseminated Mycobacterium avium infection due to compound heterozygosity for a subpolymorphic copy number variation and a novel splice-site variant."
    explanation: A case requiring copy-number analysis to complete the genotype.
- name: Plasma interferon-gamma concentration
  description: >-
    High plasma IFN-gamma in a child with mycobacterial disease points to a
    receptor-level defect and away from an IFN-gamma production defect, which
    decides whether recombinant IFN-gamma can help.
  markers: Plasma IFN-gamma
  evidence:
  - reference: PMID:19880857
    reference_title: A novel form of cell type-specific partial IFN-gammaR1 deficiency caused by a germ line mutation of the IFNGR1 initiation codon.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma IFN-γ concentration was very high (370 ng/ml, undetectable in controls, data not shown), as reported in patients with complete IFN-γR1 or IFN-γR2 deficiency (35)."
    explanation: The measurement and its interpretation as a marker of receptor deficiency.
genetic:
- name: IFNGR1
  gene_term:
    preferred_term: IFNGR1
    term:
      id: hgnc:5439
      label: IFNGR1
  relationship_type: CAUSATIVE
  notes: >-
    Encodes the ligand-binding (alpha) chain of the IFN-gamma receptor.
    Biallelic loss-of-function variants cause this entry; heterozygous exon 6
    truncations cause the separately curated dominant form.
  evidence:
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Thirty-one patients from 26 families and 25 different mutations (deletions n=10, insertions n=4, nonsense n=2, missense n=5 and splice site n=4) have been described to date"
    explanation: Allelic spectrum of recessive complete IFNGR1 deficiency.
  - reference: PMID:8960473
    reference_title: A mutation in the interferon-gamma-receptor gene and susceptibility to mycobacterial infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four children with severe mycobacterial infections had a mutation in the gene for interferon-gamma receptor 1 that leads to the absence of receptors on cell surfaces and a functional defect in the up-regulation of tumor necrosis factor alpha by macrophages in response to interferon-gamma."
    explanation: The founding identification of IFNGR1 as the causal gene.
inheritance:
- name: Autosomal Recessive
  description: >-
    Biallelic IFNGR1 variants, usually homozygous; founder effects account for
    the recurrent partial alleles.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:10811850
    reference_title: "In a novel form of IFN-gamma receptor 1 deficiency, cell surface receptors fail to bind IFN-gamma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete IFN-gamma receptor ligand-binding chain (IFNgammaR1) deficiency is a life-threatening autosomal recessive immune disorder."
    explanation: States recessive inheritance for complete deficiency.
  - reference: PMID:21266457
    reference_title: "Partial recessive IFN-γR1 deficiency: genetic, immunological and clinical features of 14 patients from 11 kindreds."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Founder effects accounted for the recurrence of both mutations."
    explanation: Founder effects behind the homozygous partial alleles.
treatments:
- name: Haematopoietic Stem Cell Transplantation
  description: >-
    The only curative treatment for complete deficiency. Graft rejection and
    delayed engraftment are common, even with HLA-identical donors, and are
    attributed to high plasma IFN-gamma; outcomes are better when infection is
    controlled and IFN-gamma has normalised before transplant. Not indicated in
    the milder partial forms; the one patient with the severe M1K partial form
    was transplanted.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Loss of IFN-gamma-Induced STAT1 Signalling
    description: >-
      Replaces the haematopoietic compartment with donor monocytes and
      macrophages that carry functional receptor.
  evidence:
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, a high rate of graft rejection, even for transplants from an HLA-identical relative, has been observed"
    explanation: Qualifies the curative claim with the rejection risk specific to this disease.
  - reference: PMID:26173802
    reference_title: Diagnostic and therapeutic challenges in a child with complete interferon-γ receptor 1 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although hematopoietic stem cell transplantation (HSCT) remains the only curative treatment, outcomes are heterogeneous; delayed engraftment and/or graft rejection being commonly observed."
    explanation: Transplantation as the only curative option, with heterogeneous outcomes.
  - reference: PMID:26173802
    reference_title: Diagnostic and therapeutic challenges in a child with complete interferon-γ receptor 1 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ideal transplant conditions include control of mycobacterial infection, normalized IFN-γ levels, myeloablative conditioning and a non-T-cell-depleted graft with high number of nucleated cells obtained from an HLA matched sibling."
    explanation: Conditions associated with successful transplantation.
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The severe immunological and clinical status of this patient led to treatment by HSCT together with antibiotics"
    explanation: The M1K partial-deficiency patient, the exception to HSCT not being indicated in the partial form.
- name: Recombinant Interferon-Gamma
  description: >-
    Used with antimycobacterial drugs in partial recessive deficiency, where
    the residual receptor response can be driven by high doses. Not indicated in
    complete deficiency, where there is no receptor to act on. The two evidence
    directions below are subtype-specific and both hold.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: recombinant interferon gamma
      term:
        id: NCIT:C583
        label: Recombinant Interferon Gamma
  target_mechanisms:
  - target: Defective Macrophage Activation
    description: >-
      Supplies supraphysiological ligand to the residual receptor in partial
      deficiency, restoring macrophage activation; ineffective in complete
      deficiency.
  evidence:
  - reference: PMID:16195661
    reference_title: Disseminated Mycobacterium avium infection in a 20-year-old female with partial recessive IFNgammaR1 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mycobacteriosis progressed in spite of treatment with antituberculous drugs and was controlled only after addition of interferon-gamma subcutaneously."
    explanation: Response to added IFN-gamma in partial recessive deficiency.
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Treatment with antibiotics and IFN-γ for several years is necessary to contain and eventually control the infection"
    explanation: IFN-gamma as part of standard management of the partial recessive form.
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Treatment with IFN-γ is not indicated, owing to the lack of specific receptors."
    explanation: Refutes IFN-gamma therapy in complete deficiency.
- name: Interferon-Alpha Therapy
  description: >-
    Tried in complete deficiency because IFN-alpha signals through STAT1 via
    its own receptor, bypassing the missing IFN-gamma receptor. Responses were
    variable, and later evidence suggests exogenous IFN-alpha may worsen
    mycobacterial disease, so it is not an established treatment.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: recombinant interferon alfa
      term:
        id: NCIT:C225
        label: Recombinant Interferon Alfa
  evidence:
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Treatment with IFN-α has been reported, but with variable clinical responses"
    explanation: Reported use in complete deficiency, with inconsistent benefit.
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "recent evidence suggests that exogenous IFN-α treatment may aggravate mycobacterial disease"
    explanation: Argues against IFN-alpha as a treatment for the mycobacterial disease.
- name: Prolonged Antimycobacterial Therapy
  description: >-
    Multi-drug antimycobacterial treatment for each episode, continued
    long-term in complete deficiency. In partial recessive deficiency episodes
    respond to treatment and prophylactic antibiotics are not required. It acts
    on the organism rather than the host defect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Uncontrolled Intracellular Mycobacterial Replication
    description: >-
      Lowers the mycobacterial burden that inactivated macrophages cannot
      clear.
  evidence:
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Antibiotic treatment should not be stopped."
    explanation: Continuous antibiotic treatment in complete IFN-gammaR1 deficiency.
  - reference: PMID:9389728
    reference_title: Partial interferon-gamma receptor 1 deficiency in a child with tuberculoid bacillus Calmette-Guérin infection and a sibling with clinical tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both responded to antimicrobials and are currently well without prophylactic therapy."
    explanation: Response to antimicrobials in partial recessive deficiency.
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Prophylactic antibiotics are not required"
    explanation: Antibiotics are given per episode, not as prophylaxis, in partial recessive deficiency.
prevalence:
- population: Worldwide, AR complete IFN-gammaR1 deficiency
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Thirty-one patients from 26 families with complete recessive deficiency
    and about fifteen with partial recessive deficiency were counted in a 2014
    review. No rate is recorded: the only published rate is about 1 in 50,000
    for MSMD as a whole, of which this genotype is a small fraction.
  evidence:
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The overall prognosis is poor, with 17 deaths reported for the 31 known patients (58%) patients, including four deaths after HSCT."
    explanation: Case count and mortality for complete deficiency.
  - reference: PMID:32025907
    reference_title: "Mendelian susceptibility to mycobacterial disease: recent discoveries."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "MSMD affects about 1/50,000 individuals worldwide (6)."
    explanation: Syndrome-wide figure, kept as an upper bound in the notes rather than as a rate for this genotype.
- population: Worldwide, AR partial IFN-gammaR1 deficiency
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: Fifteen patients counted in a 2014 review, with one death.
  evidence:
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Only one of the 15 patients reported to date died (6.6%)"
    explanation: Case count and mortality for the partial recessive form.
differential_diagnoses:
- name: Immunodeficiency 28
  description: >-
    Recessive IFN-gammaR2 deficiency gives the same clinical and cellular
    picture with the same complete and partial series; IFN-gammaR1 surface
    staining and sequencing separate them.
- name: Mendelian Susceptibility To Mycobacterial Diseases Due To Complete IL12RB1 Deficiency
  description: >-
    The commonest MSMD aetiology, a defect of IFN-gamma production rather than
    response. Patient cells respond to IFN-gamma, plasma IFN-gamma is not
    elevated, and recombinant IFN-gamma is effective.
- name: Chronic Granulomatous Disease
  description: >-
    Also presents with BCG and mycobacterial disease, but with an abnormal
    neutrophil oxidative burst; the dihydrorhodamine test excludes it.
review_notes: >-
  Lump/split. One entry for MONDO:0008856 (OMIM:209950) covering both
  recessive forms as has_subtypes, with a curated_in pointer to the dominant
  form's own entry. The two recessive forms share one pathograph and differ in
  residual IFN-gamma signalling, which PMID:9389728 measures as a shifted
  dose-response; this is the same structure Immunodeficiency_28 uses for
  IFNGR2. The dominant form stays separate because its lesion is different
  (surface accumulation of truncated receptor acting as a dominant negative).
  The MONDO:0017901 stub is resolved as a subtype of this entry.

  Subtype MONDO terms are recorded under each subtype's mondo_mappings as
  skos:exactMatch instead of subtype_term. subtype_term binds the
  DiseaseOrSubtypeTerm enum, whose MONDO roots are MONDO:0000001 disease and
  MONDO:0021178 injury; MONDO:0020530 and MONDO:0017901 sit only under
  MONDO:0020573 inherited disease susceptibility, which the entry-level
  DiseaseTerm enum includes and DiseaseOrSubtypeTerm does not.

  Not curated. Disseminated dimorphic fungal infection (Histoplasma,
  Coccidioides): PMID:25453225 attributes these to the dominant partial form,
  and no cached source here reports them in a recessive patient. Viral
  infections (CMV, HHV8, RSV, VZV) and Listeria are listed for complete
  deficiency by PMID:25453225, but without frequencies or an attributed
  mechanism, so no viral phenotype node was added. The EBV-driven
  lymphadenopathy in the whole-gene-deletion family (PMID:26931784) is not used
  as evidence for mycobacterial lymphadenopathy.

  GeneReviews has no chapter for IFNGR1 deficiency or MSMD; the committed
  Bookshelf index (cache/bookshelf/genereviews.csv) has no title containing
  "mycobact", "interferon" or "IFNGR".

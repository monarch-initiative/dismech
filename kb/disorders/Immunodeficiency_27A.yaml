    causal_link_type: DIRECT
  evidence:
  - reference: PMID:28744922
    reference_title: "IFN-γR1 defects: Mutation update and description of the IFNGR1 variation database."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "IFN-γR1 is the ligand-binding chain of the interferon-γ receptor and IFN-γR2 is the signal-transducing chain of the IFN-γ receptor"
    explanation: Identifies ligand binding as the function of the chain lost at this node.
  - reference: PMID:8960473
    reference_title: A mutation in the interferon-gamma-receptor gene and susceptibility to mycobacterial infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunofluorescence studies showed that the receptor was absent on leukocytes from the affected children."
    explanation: Absence of surface receptor in the founding complete-deficiency kindred.
  - reference: PMID:10811850
    reference_title: "In a novel form of IFN-gamma receptor 1 deficiency, cell surface receptors fail to bind IFN-gamma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations therefore cause complete IFNgammaR1 deficiency by disrupting the IFN-gamma-binding site without affecting surface expression."
    explanation: The surface-expressed complete form - receptor present but unable to bind ligand.
  - reference: PMID:19880857
    reference_title: A novel form of cell type-specific partial IFN-gammaR1 deficiency caused by a germ line mutation of the IFNGR1 initiation codon.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mechanism underlying this weak expression involves leaky translation initiation at both non-AUG codons and the third AUG codon at position 19."
    explanation: The quantitative route to partial deficiency, in which normal receptor is made in small amounts.
- name: Loss of IFN-gamma-Induced STAT1 Signalling
  biological_scale: CELLULAR
  description: >-
    With no ligand-bound receptor, IFN-gamma does not activate STAT1 and the
    IFN-gamma transcriptional programme is not induced in monocytes,
    macrophages, B cells or fibroblasts. The defect is absolute in complete
    deficiency and dose-dependent in partial deficiency, where cells respond
    only at high IFN-gamma concentrations.

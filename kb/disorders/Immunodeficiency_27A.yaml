  - target: Hepatosplenomegaly
    causal_link_type: DIRECT
  - target: Fever
    causal_link_type: DIRECT
  - target: Tuberculosis
    causal_link_type: DIRECT
  - target: Sustained IFN-gamma Production Without Receptor Response
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Persisting mycobacterial burden keeps the IL-12 to IFN-gamma circuit
      running. Infected phagocytes release IL-12, which induces IFN-gamma from
      T and NK cells; that arm is intact here, so IFN-gamma accumulates with no
      receptor to act on it.
    evidence:
    - reference: PMID:25453225
      reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "IL-12 binds to its receptors, IL-12Rβ1 and IL-12Rβ2, on T lymphocytes and NK cells and is a potent inducer of IFN-γ."
      explanation: Names the intact production arm that keeps IFN-gamma rising while the receptor is absent.
  evidence:
  - reference: PMID:8960473
    reference_title: A mutation in the interferon-gamma-receptor gene and susceptibility to mycobacterial infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The interferon-gamma pathway is important in the response to intracellular pathogens such as mycobacteria."
    explanation: States the role of IFN-gamma signalling in controlling intracellular mycobacteria, the function lost here.
  - reference: PMID:10811850
    reference_title: "In a novel form of IFN-gamma receptor 1 deficiency, cell surface receptors fail to bind IFN-gamma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected children invariably develop disseminated bacille Calmette-Guérin (BCG) infection shortly after inoculation with live BCG vaccine (3–6)."
    explanation: Uncontained spread of a weakly virulent mycobacterium in complete deficiency.
- name: Lepromatous-like Granuloma Formation
  biological_scale: TISSUE
  description: >-
    Specific to complete deficiency (subtype AR complete). Without
    IFN-gamma-activated macrophages, granulomas are poorly delimited, lack
    epithelioid and multinucleated giant cells, and are multibacillary
    (lepromatous-like). Partial recessive deficiency instead forms mature
    tuberculoid granulomas, and the severe M1K partial form shows no
    granulomatous reaction at all. Failure to wall off the infection is part
    of why disease disseminates in the complete form.
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: Disseminated Mycobacterial Disease
    causal_link_type: DIRECT
    description: >-
      Granulomas that do not contain the bacilli fail to restrict their
      spread, and lepromatous-like granulomas go with the very severe outcome
      of complete deficiency.
    evidence:
    - reference: PMID:10811850
      reference_title: "In a novel form of IFN-gamma receptor 1 deficiency, cell surface receptors fail to bind IFN-gamma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutations causing complete IFNγR1 deficiency (irrespective of the presence of surface receptors) are associated with lepromatous-like BCG granulomas and a very severe clinical outcome, contrasting with the tuberculoid granulomas and much better prognosis associated with mild mutations and partial IFNγR1 deficiency."
      explanation: Associates lepromatous-like granulomas with the severe disseminated course of complete deficiency.
  evidence:
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Granuloma lesions are poorly delineated and lepromatous-like; they contain multiple acid-fast bacilli and few, if any giant cells"
    explanation: Granuloma histology in complete IFN-gammaR1 deficiency.
  - reference: PMID:10811850
    reference_title: "In a novel form of IFN-gamma receptor 1 deficiency, cell surface receptors fail to bind IFN-gamma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biopsies were taken and multibacillary, poorly delimited, and poorly differentiated tissue granulomas were found in all patients (type II; ref."
    explanation: Granuloma type in every patient of the complete-deficiency kindred.
  - reference: PMID:9389728
    reference_title: Partial interferon-gamma receptor 1 deficiency in a child with tuberculoid bacillus Calmette-Guérin infection and a sibling with clinical tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, whereas complete IFNgammaR1 deficiency in previously identified kindreds caused fatal lepromatoid BCG infection and disseminated NTM infection, partial IFNgammaR1 deficiency in this kindred caused curable tuberculoid BCG infection and clinical tuberculosis."
    explanation: Confines the lepromatoid granuloma to the complete form; partial deficiency forms tuberculoid granulomas.
- name: Sustained IFN-gamma Production Without Receptor Response
  biological_scale: ORGANISM
  description: >-
    Circulating IFN-gamma is high in complete deficiency and in the severe M1K
    partial form, because production continues while the receptor that would
    consume and respond to it is absent. High plasma IFN-gamma is also thought
    to contribute to the delayed engraftment and graft rejection seen after
    transplantation.
  cell_types:
  - preferred_term: T-helper 1 cell
    term:
      id: CL:0000545
      label: T-helper 1 cell
  - preferred_term: Natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  downstream:
  - target: Elevated Plasma Interferon-Gamma
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Plasma from patients contains high levels of IFN-γ"
    explanation: High plasma IFN-gamma in complete IFN-gammaR1 deficiency.
  - reference: PMID:19880857
    reference_title: A novel form of cell type-specific partial IFN-gammaR1 deficiency caused by a germ line mutation of the IFNGR1 initiation codon.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Like patients with the complete IFN-γR1 deficiency and unlike other patients with partial IFN-γR1 deficiency, this patient had a high plasma concentration of IFN-γ and showed no granulomatous reaction."
    explanation: The same finding in the severe M1K partial form, and its absence from the milder partial forms.
phenotypes:
- category: Infectious
  name: Disseminated Mycobacterial Disease
  description: >-
    Disseminated disease caused by environmental (nontuberculous) mycobacteria,
    including Mycobacterium avium complex and rapidly growing species such as
    M. chelonae and M. fortuitum. In complete deficiency it begins before about
    three years of age and is fatal without transplantation; in partial
    recessive deficiency the age at first episode is widely spread across
    childhood and adulthood.
  phenotype_term:
    preferred_term: Disseminated nontuberculous mycobacterial infection
    term:
      id: HP:0032283
      label: Disseminated nontuberculous mycobacterial infection
    onset:
      onset_category: INFANTILE
      notes: >-
        Applies to complete deficiency. Mean age at first environmental
        mycobacterial disease was 3.1 years in the recessive complete series
        and 11.25 years in the partial recessive series.
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:15589309
    reference_title: Clinical features of dominant and recessive interferon gamma receptor 1 deficiencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In recessive patients, 17 (77%) had environmental mycobacterial disease and all nine BCG-vaccinated patients had BCG disease."
    explanation: Frequency of environmental mycobacterial disease in 22 patients with recessive complete deficiency.
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Infections typically begin in early childhood, before three years of age"
    explanation: Age at onset in complete deficiency.
  - reference: PMID:21266457
    reference_title: "Partial recessive IFN-γR1 deficiency: genetic, immunological and clinical features of 14 patients from 11 kindreds."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Age at onset of the first environmental mycobacterial disease differed widely between patients, with a mean value of 11.25 ± 9.13 years."
    explanation: Later and more variable onset in partial recessive deficiency.
- category: Infectious

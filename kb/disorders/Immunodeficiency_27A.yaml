    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In recessive patients, 17 (77%) had environmental mycobacterial disease and all nine BCG-vaccinated patients had BCG disease."
    explanation: All nine vaccinated patients with recessive complete deficiency developed BCG disease.
  - reference: PMID:9389728
    reference_title: Partial interferon-gamma receptor 1 deficiency in a child with tuberculoid bacillus Calmette-Guérin infection and a sibling with clinical tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, whereas complete IFNgammaR1 deficiency in previously identified kindreds caused fatal lepromatoid BCG infection and disseminated NTM infection, partial IFNgammaR1 deficiency in this kindred caused curable tuberculoid BCG infection and clinical tuberculosis."
    explanation: BCG disease in both recessive forms, fatal in complete and curable in partial deficiency.

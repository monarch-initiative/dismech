    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "The cellular phenotype of AR complete IFN-γR1 deficiency is characterized by a lack of response to IFN-γ in vitro, in terms of IL-12p70 production by leukocytes, gamma-activating factor (GAF: STAT1 homodimers) DNA-binding activity in Epstein-Barr virus-transformed lymphoblastic (EBV-B) cell lines, or HLA-II induction in fibroblasts"
    explanation: Summarises the absent STAT1-dependent response across leukocytes, EBV-B cells and fibroblasts in complete deficiency.
  - reference: PMID:9389728
    reference_title: Partial interferon-gamma receptor 1 deficiency in a child with tuberculoid bacillus Calmette-Guérin infection and a sibling with clinical tuberculosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Whereas cells from healthy children responded to even low IFN-gamma concentrations (10 IU/ml), and cells from a child with complete IFNgammaR1 deficiency did not respond to even high IFN-gamma concentrations (10,000 IU/ml), cells from the two siblings did not respond to low or intermediate concentrations, yet responded to high IFN-gamma concentrations."
    explanation: Dose-response comparison in patient cells showing the absolute block in complete deficiency and the shifted response in partial deficiency.
- name: Defective Macrophage Activation
  biological_scale: CELLULAR
  description: >-
    IFN-gamma is the signal that activates macrophages to kill intracellular
    mycobacteria. Without it macrophages fail to up-regulate TNF-alpha and do
    not acquire mycobactericidal activity. How far this step fails tracks the
    residual IFN-gamma response, which is why the complete and partial forms
    differ in severity.
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: macrophage activation
    term:
      id: GO:0042116
      label: macrophage activation
    modifier: DECREASED
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
    modifier: DECREASED
  downstream:
  - target: Uncontrolled Intracellular Mycobacterial Replication
    causal_link_type: DIRECT
  - target: Lepromatous-like Granuloma Formation
    causal_link_type: DIRECT
    description: >-
      Inactivated macrophages do not mature into the epithelioid and giant
      cells of an organised granuloma; this applies to complete deficiency.
  - target: Salmonella Infection
    causal_link_type: DIRECT
    description: >-
      Macrophages that cannot be activated by IFN-gamma also fail to control
      intracellular Salmonella, but this is far less frequent in IFN-gammaR1
      deficiency than mycobacterial disease.
    evidence:
    - reference: PMID:25453225
      reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "MSMD designation does not recapitulate all the clinical features, as patients are also prone to salmonellosis, candidiasis and tuberculosis, and more rarely to infections with other intramacrophagic bacteria, fungi, or parasites"
      explanation: Places salmonellosis among the intramacrophagic infections of the IFN-gamma defects; the link to this entry is by inference from that class.
  evidence:
  - reference: PMID:8960473
    reference_title: A mutation in the interferon-gamma-receptor gene and susceptibility to mycobacterial infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four children with severe mycobacterial infections had a mutation in the gene for interferon-gamma receptor 1 that leads to the absence of receptors on cell surfaces and a functional defect in the up-regulation of tumor necrosis factor alpha by macrophages in response to interferon-gamma."
    explanation: Direct observation that patient macrophages fail to respond to IFN-gamma.
  - reference: PMID:32025907
    reference_title: "Mendelian susceptibility to mycobacterial disease: recent discoveries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Strikingly, the severity and penetrance of MSMD are inversely correlated with the residual levels of IFN-γ."
    explanation: Ties severity to residual IFN-gamma activity, the principle that separates the two subtypes.
- name: Uncontrolled Intracellular Mycobacterial Replication
  biological_scale: CELLULAR
  description: >-
    Macrophages that are not activated by IFN-gamma cannot clear ingested
    mycobacteria, so weakly virulent environmental species and BCG replicate
    inside them and disseminate to lymph nodes, liver, spleen, bone and other
    organs. The burden is highest in complete deficiency, where lesions are
    multibacillary; residual receptor function in the partial form limits it.
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: Disseminated Mycobacterial Disease
    causal_link_type: DIRECT
  - target: BCG Vaccine Disease
    causal_link_type: DIRECT
  - target: Mycobacterial Osteomyelitis
    causal_link_type: DIRECT
  - target: Lymphadenopathy

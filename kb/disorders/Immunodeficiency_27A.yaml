pathophysiology:
- name: Biallelic IFNGR1 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Germline biallelic IFNGR1 variants of several molecular classes. Most
    complete-deficiency alleles are nonsense, frameshift or splice variants that
    introduce a premature stop codon upstream of the transmembrane segment;
    in-frame deletions and missense variants in the extracellular domain,
    whole-gene deletions and compound heterozygosity for a copy-number variant
    are rarer. The partial recessive alleles are the I87T and V63G missense
    founder variants and the M1K initiation-codon variant.
  gene:
    preferred_term: IFNGR1
    term:
      id: hgnc:5439
      label: IFNGR1
  genetic_context:
    gene:
      preferred_term: IFNGR1
      term:
        id: hgnc:5439
        label: IFNGR1
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Absent or Non-Ligand-Binding IFN-gamma Receptor 1
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:8960473
      reference_title: A mutation in the interferon-gamma-receptor gene and susceptibility to mycobacterial infection.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sequence analysis of complementary DNA for the gene for interferon-gamma receptor 1 revealed a point mutation at nucleotide 395 that introduces a stop codon and results in a truncated protein that lacks the transmembrane and cytoplasmic domains."
      explanation: The founding recessive allele truncates the receptor before its membrane anchor, which is the edge from variant to absent receptor.
  evidence:
  - reference: PMID:28744922
    reference_title: "IFN-γR1 defects: Mutation update and description of the IFNGR1 variation database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Forty unique IFNGR1 mutations have been reported and they exert either an autosomal dominant or an autosomal recessive effect."
    explanation: Establishes germline IFNGR1 variants as the lesion and that a subset act recessively.
  - reference: PMID:32714620
    reference_title: Disseminated Mycobacterium Avium Infection in a Child with Complete Interferon-γ Receptor 1 Deficiency due to Compound Heterozygosis of IFNGR1 for a Subpolymorphic Copy Number Variation and a Novel Splice-Site Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the autosomal recessive IFNGR1 mutations are homozygous loss-of-function single-nucleotide variants, whereas large genomic deletions and compound heterozygosity have been very rarely reported."
    explanation: Describes the usual and the rarer allele classes this node covers.
  - reference: PMID:26931784
    reference_title: Deletion of the entire interferon-γ receptor 1 gene causing complete deficiency in three related patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 119.227 nt homozygous deletion on chromosome 6q23.3 was identified, removing the IFNGR1 gene completely and ending 117 nt upstream of the transcription start of the IL22RA2 gene."
    explanation: A whole-gene deletion as one of the allele classes, which sequencing alone does not detect.
- name: Absent or Non-Ligand-Binding IFN-gamma Receptor 1
  biological_scale: MOLECULAR
  description: >-
    IFN-gammaR1 is the ligand-binding chain of the receptor. In most cases of
    complete deficiency no receptor is detectable at the cell surface; in the
    surface-expressed complete form the receptor is present in normal amounts
    but its IFN-gamma-binding site is disrupted. Either way the receptor binds
    no ligand. In partial recessive deficiency the receptor is expressed but
    responds only to high IFN-gamma concentrations, and with the M1K allele
    normal receptor is made at low levels by leaky translation initiation.
  gene:
    preferred_term: IFNGR1
    term:
      id: hgnc:5439
      label: IFNGR1
  molecular_functions:

disease_term:
  preferred_term: immunodeficiency 27A
  term:
    id: MONDO:0008856
    label: immunodeficiency 27A
parents:
- Mendelian Susceptibility to Mycobacterial Disease
- Inborn Error of Immunity
description: >-
  Immunodeficiency 27A is the autosomal recessive form of interferon-gamma
  receptor 1 (IFN-gammaR1) deficiency, the first genetic cause of Mendelian
  susceptibility to mycobacterial disease (MSMD) to be identified. IFN-gammaR1
  is the ligand-binding chain of the IFN-gamma receptor. Biallelic IFNGR1
  variants leave macrophages unable to respond to IFN-gamma, so weakly virulent
  mycobacteria - BCG vaccine strains and environmental (nontuberculous)
  mycobacteria - are not cleared and disseminate, while resistance to most other
  pathogens is preserved.

  The recessive alleles form a series defined by how much IFN-gamma signalling
  is left. In complete deficiency there is none: most alleles truncate the
  receptor before its transmembrane domain so that no receptor reaches the cell
  surface, while a minority leave a normal amount of receptor at the surface
  that cannot bind IFN-gamma. Complete deficiency presents in early childhood
  with disseminated infection and poorly formed, lepromatous-like granulomas,
  is fully penetrant, and is fatal without haematopoietic stem cell
  transplantation. In partial recessive deficiency (founder alleles I87T and
  V63G, and the initiation-codon variant M1K) cells respond to high but not low
  IFN-gamma concentrations; onset is later and milder, granulomas are
  tuberculoid, and recombinant IFN-gamma together with antimycobacterial drugs
  controls infection. Because the two recessive forms share one mechanism and
  differ only in residual signalling, this entry carries both as subtypes; the
  autosomal dominant, dominant-negative form (immunodeficiency 27B) is curated
  separately.

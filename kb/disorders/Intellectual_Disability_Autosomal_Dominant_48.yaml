- name: Abnormal Neuronal Morphology from Excess Actin Branching
  biological_scale: CELLULAR
  subtypes:
  - Normocephalic
  description: >-
    Activating variants shorten axons, increase filopodia, disorganise axon
    tracts and over-branch dendrites with loss of self-avoidance in Drosophila
    neurons. Knocking down the WAVE regulatory complex component Cyfip rescues
    these defects, implicating the WAVE/Arp2/3 pathway.
  biological_processes:
  - preferred_term: neuron projection morphogenesis
    term:
      id: GO:0048812
      label: neuron projection morphogenesis
    modifier: ABNORMAL
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed link from abnormal neuronal morphology to intellectual
      disability, inferred from Drosophila neurons.
    evidence:
    - reference: PMID:35139179
      reference_title: "Activating RAC1 variants in the switch II region cause a developmental syndrome and alter neuronal morphology."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Our findings reveal that these variants cause altered downstream signalling, resulting in abnormal neuronal morphology and reveal the WAVE regulatory complex/Arp2/3 pathway as a possible therapeutic target for activating RAC1 variants."
      explanation: >-
        Links the activating variants to abnormal neuronal morphology; the step
        to cognition is inferred.
  - target: Polymicrogyria
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed: altered neuronal morphology and migration are a plausible
      route to cortical malformation, but this has not been tested.
  evidence:
  - reference: PMID:35139179
    reference_title: "Activating RAC1 variants in the switch II region cause a developmental syndrome and alter neuronal morphology."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "RNAi knock down of the WAVE regulatory complex component Cyfip significantly rescues these morphological defects."
    explanation: >-
      Reducing WAVE regulatory complex activity rescues the defects, placing it
      downstream of activated RAC1.
  - reference: PMID:42120539
    reference_title: "Distinct sub-clusters of developmental disorder-associated variants in the switch II region of RAC1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In a Drosophila model, we observe divergent effects on neuronal morphology, with switch II N-terminal variants increasing the complexity of dendritic arbors, while switch II C-terminal variants reduce dendritic complexity."
    explanation: >-
      Activating and dominant-negative switch II variants have opposite
      effects on dendritic complexity.
- name: Disturbed Neural Crest-Derived Tissue Development
  biological_scale: TISSUE
  description: >-
    Proposed explanation for the cardiac and craniofacial features: Rac1 loss
    in neural crest cells disrupts craniofacial and cardiac outflow tract
    development in conditional knockout mice. Not shown with patient variants,
    and heart defects occur with both dominant-negative and activating
    variants, so this node has no upstream edge from either signalling
    branch.
  cell_types:
  - preferred_term: neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  downstream:
  - target: Congenital Heart Defects
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred from neural crest-targeted Rac1 knockout mice.
    evidence:
    - reference: PMID:37059841
      reference_title: "Clinical profiling of MRD48 and functional characterization of two novel pathogenic RAC1 variants."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "Notably, the perturbed development of neural crest cell (NCC)-derived tissues documented in NCC-targeted Rac1 conditional KO mice may explain both craniofacial and cardiac features recurring in affected individuals"
      explanation: >-
        The authors propose neural crest dysfunction as the route to the
        cardiac and craniofacial features, citing mouse models.

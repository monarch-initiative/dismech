name: Intellectual Disability, Autosomal Dominant 48
creation_date: "2026-10-01T14:00:00Z"
category: Mendelian
synonyms:
- MRD48
- RAC1-related intellectual developmental disorder
- mental retardation, autosomal dominant 48
- autosomal dominant intellectual disability 48
- autosomal dominant mental retardation 48
description: >-
  Intellectual disability, autosomal dominant 48 (MRD48) is a syndromic
  neurodevelopmental disorder caused by heterozygous, de novo missense variants
  in RAC1, a Rho-family GTPase that cycles between GDP- and GTP-bound states
  and, when active, drives actin cytoskeleton remodelling through effectors such
  as PAK1 and the WAVE regulatory complex. All reported individuals have
  developmental delay and intellectual disability, usually with speech delay
  and brain malformations (corpus callosum and cerebellar vermis hypoplasia,
  polymicrogyria, white matter changes); hypotonia, feeding difficulties,
  behavioural problems, congenital heart defects, epilepsy, eczematous or
  ichthyosiform skin changes and a recognisable but evolving facial gestalt are
  common. The disorder splits by variant mechanism. Dominant-negative or
  presumed dominant-negative variants (for example p.Cys18Tyr, p.Asn39Ser and
  variants in the C-terminal part of switch II, P69-Q74) reduce RAC1 signalling
  and cause microcephaly; activating variants, mostly in the N-terminal part of
  switch II (Q61-R68) but also p.Ala159Thr in the G5 box, over-activate PAK and
  the WAVE regulatory complex and cause normocephaly or milder head-size
  changes; and two variants at Val51 cause macrocephaly by an unresolved
  mechanism. Head circumference across the reported variants spans about 10
  standard deviations.
parents:
- hereditary disease
- intellectual disability
disease_term:
  preferred_term: intellectual disability, autosomal dominant 48
  term:
    id: MONDO:0030913
    label: intellectual disability, autosomal dominant 48
has_subtypes:
- name: Microcephalic
  display_name: Microcephalic MRD48 (dominant-negative RAC1 variants)
  description: >-
    Microcephaly (about -2.5 to -5 SD) with dominant-negative or presumed
    dominant-negative variants. p.Cys18Tyr, p.Asn39Ser, p.Glu31Gly and variants
    in the C-terminal part of switch II (P69-Q74) are dominant-negative in
    functional assays; p.Pro73Leu and p.Cys157Tyr showed at most a modest effect
    in fibroblast assays and are grouped here by phenotype.
  evidence:
  - reference: PMID:42120539
    reference_title: "Distinct sub-clusters of developmental disorder-associated variants in the switch II region of RAC1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By contrast, individuals with variants in the C-terminal part of switch II exhibited microcephaly."
    explanation: >-
      Microcephaly in individuals with C-terminal switch II variants.
- name: Normocephalic
  display_name: Normocephalic MRD48 (activating RAC1 variants)
  description: >-
    Normal head size, or milder micro- or macrocephaly, with activating
    variants: those in the N-terminal part of switch II (Q61-R68), including
    p.Tyr64Asp and p.Glu62Lys, and p.Ala159Thr in the G5 box.
  evidence:
  - reference: PMID:42120539
    reference_title: "Distinct sub-clusters of developmental disorder-associated variants in the switch II region of RAC1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consistent with our previous study, individuals with variants in the N-terminal part of switch II were normocephalic."
    explanation: >-
      Normocephaly in individuals with N-terminal switch II variants.
  - reference: PMID:37059841
    reference_title: "Clinical profiling of MRD48 and functional characterization of two novel pathogenic RAC1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe two additional individuals with previously unreported de novo missense variants in RAC1 and a NDD characterized by normal OFC, facial dysmorphisms, mild/moderate DD/ID and a variable range of additional signs"
    explanation: >-
      Normal head size with the activating p.Ala159Thr and p.Glu62Lys variants.
- name: Macrocephalic
  display_name: Macrocephalic MRD48 (Val51 variants)
  description: >-
    Macrocephaly (+4.2 and +4.5 SD) in two individuals with p.Val51Met and
    p.Val51Leu; the functional effect of these variants is unresolved.
  evidence:
  - reference: PMID:28886345
    reference_title: "RAC1 Missense Mutations in Developmental Disorders with Diverse Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, two individuals with c.151G>A (p.Val51Met) and c.151G>C (p.Val51Leu) alleles were macrocephalic with head circumferences of +4.16 and +4.5 SD."
    explanation: >-
      Macrocephaly in both individuals with Val51 variants.
  - reference: PMID:37059841
    reference_title: "Clinical profiling of MRD48 and functional characterization of two novel pathogenic RAC1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A relatively homogenous presentation in the absence of any obvious genotype-phenotype correlation was apparent, except for macrocrania in two individuals carrying pathogenic variants involving the residue V51."
    explanation: >-
      Head size at Val51 is the one clear genotype-phenotype correlation in the 2023 review.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous missense variants, de novo in all reported individuals.
  evidence:
  - reference: PMID:28886345
    reference_title: "RAC1 Missense Mutations in Developmental Disorders with Diverse Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report seven individuals with distinct de novo missense RAC1 mutations and varying degrees of developmental delay, brain malformations, and additional phenotypes."
    explanation: >-
      De novo heterozygous variants in the founding series.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Several dozen individuals have been reported across case series since
    2017 (7 in the founding series, 8 with activating switch II variants, 15
    further switch II individuals in 2026, and smaller reports); no
    population prevalence estimate exists.
  evidence:
  - reference: PMID:42120539
    reference_title: "Distinct sub-clusters of developmental disorder-associated variants in the switch II region of RAC1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report 15 new individuals with variants in switch II of RAC1."
    explanation: >-
      The largest single series to date.
pathophysiology:
- name: De Novo RAC1 Missense Variant Altering the GTPase Switch
  biological_scale: MOLECULAR
  description: >-
    Heterozygous de novo missense variants cluster in and around the guanine
    nucleotide-binding site and the switch I and switch II regions, which
    control GDP/GTP exchange and effector binding. They act either as
    dominant-negative alleles or as activating alleles, rather than by
    haploinsufficiency; RAC1 is highly constrained against missense variation
    and constitutive Rac1 knockout is embryonic lethal in mice.
  genetic_context:
    gene:
      preferred_term: RAC1
      term:
        id: hgnc:9801
        label: RAC1
    variant_origin: GERMLINE
  molecular_functions:
  - preferred_term: RAC1 GTPase activity
    term:
      id: GO:0003924
      label: GTPase activity
    modifier: ABNORMAL
  downstream:
  - target: Reduced RAC1 Effector Signalling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42120539
      reference_title: "Distinct sub-clusters of developmental disorder-associated variants in the switch II region of RAC1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cell-based assays revealed that N- and C-terminal variants affect RAC1 function differently: N-terminal variants are activating, while C-terminal variants are dominant-negative."
      explanation: >-
        C-terminal switch II variants are dominant-negative in cell-based
        assays.
    - reference: PMID:39307291
      reference_title: "Pathophysiological significance of the p.E31G variant in RAC1 responsible for a neurodevelopmental disorder with microcephaly."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In transient expression analyses using COS7 cells, RAC1-E31G exhibited minimal interaction with the downstream effector PAK1, even in its GTP-bound state."
      explanation: >-
        A microcephaly-associated variant fails to engage PAK1.
    - reference: PMID:28886345
      reference_title: "RAC1 Missense Mutations in Developmental Disorders with Diverse Phenotypes."
      supports: REFUTE
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Cells expressing p.Val51Met, p.Pro73Leu, and p.Cys157Tyr all showed a tendency toward increased filopodia and reduced lamellipodia but did not result in a significant change in circularity index relative to cells expressing wild-type Rac, suggesting at most a modest impact on Rac function in these assays"
      explanation: >-
        For the microcephaly-associated p.Pro73Leu and p.Cys157Tyr, a
        dominant-negative effect was not clearly shown.
  - target: RAC1 Over-Activation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35139179
      reference_title: "Activating RAC1 variants in the switch II region cause a developmental syndrome and alter neuronal morphology."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Collectively, these data suggest that all the patient variants studied here increase the proportion of cellular RAC1 in an active GTP-bound state, increase RAC1 activity in cellular conditions and alter cell morphology."
      explanation: >-
        N-terminal switch II variants raise active GTP-bound RAC1 in cells.
    - reference: PMID:37059841
      reference_title: "Clinical profiling of MRD48 and functional characterization of two novel pathogenic RAC1 variants."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we observed that RAC1E62K behaved as a weakly constitutively activated GTPase, while RAC1A159T showed a full CA behavior, similar to that characterizing RAC1A159V and RAC1G12V (Fig. 1D)"
      explanation: >-
        p.Glu62Lys and p.Ala159Thr are activating.
  - target: Macrocephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The Val51 variants are predicted to destabilise RAC1, but their effect on
      signalling has not been resolved, so the route to macrocephaly is
      unknown.
    evidence:
    - reference: PMID:28886345
      reference_title: "RAC1 Missense Mutations in Developmental Disorders with Diverse Phenotypes."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: COMPUTATIONAL
      snippet: "Free energy calculations by FoldX (in the SNPeffect 4.0 server)29 revealed a reduction of protein stability for these two substitutions"
      explanation: >-
        The only functional prediction for the Val51 variants is reduced
        protein stability; how this leads to macrocephaly is unknown.
  evidence:
  - reference: PMID:28886345
    reference_title: "RAC1 Missense Mutations in Developmental Disorders with Diverse Phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The genetic data and in silico modeling suggested that the phenotypes are unlikely to result from haploinsufficiency."
    explanation: >-
      The variants are thought to act by altered function rather than loss of
      one copy.
  - reference: PMID:28886345
    reference_title: "RAC1 Missense Mutations in Developmental Disorders with Diverse Phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "In mouse studies, Rac1 is required for the formation of three germ layers during gastrulation, with Rac1-knockout mice being embryonic lethal."
    explanation: >-
      Complete loss of Rac1 is incompatible with development.
- name: Reduced RAC1 Effector Signalling
  biological_scale: CELLULAR
  subtypes:
  - Microcephalic
  description: >-
    Dominant-negative variants block activation of RAC1 effectors such as PAK1,
    reducing actin polymerisation and lamellipodia formation. The p.Cys18Tyr
    variant is predicted to occlude the GTP-binding pocket.
  biological_processes:
  - preferred_term: Rac protein signal transduction
    term:
      id: GO:0016601
      label: Rac protein signal transduction
    modifier: DECREASED
  downstream:
  - target: Reduced Neural Progenitor Proliferation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28886345
      reference_title: "RAC1 Missense Mutations in Developmental Disorders with Diverse Phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In silico modeling, mouse fibroblasts spreading assays, and in vivo overexpression assays using zebrafish as a surrogate model demonstrated that the p.Cys18Tyr and p.Asn39Ser RAC1 variants function as dominant-negative alleles and result in microcephaly, reduced neuronal proliferation, and cerebellar abnormalities in vivo."
      explanation: >-
        Expressing the dominant-negative variants in zebrafish reduces
        neuronal proliferation and head size.
  - target: Impaired Neuronal Morphogenesis and Synaptic Plasticity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39307291
      reference_title: "Pathophysiological significance of the p.E31G variant in RAC1 responsible for a neurodevelopmental disorder with microcephaly."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Moreover, in vivo studies employing in utero electroporation revealed that acute expression of RAC1-E31G resulted in impairments in axonal elongation and dendritic arborization in the young adult stage."
      explanation: >-
        A dominant-negative variant impairs axon and dendrite growth in mouse
        cortex.
    - reference: PMID:30042656
      reference_title: "An Intellectual Disability-Related Missense Mutation in Rac1 Prevents LTP Induction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Indeed, we find that this de novo mutation prevents Rac1 function and results in a selective reduction in synaptic AMPA receptor function."
      explanation: >-
        p.Cys18Tyr reduces synaptic AMPA receptor function in rat hippocampal
        slice cultures.
  evidence:
  - reference: PMID:30042656
    reference_title: "An Intellectual Disability-Related Missense Mutation in Rac1 Prevents LTP Induction."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Our modeling predicts that this mutation will strongly inhibit Rac1 activation by occluding Rac1's GTP binding pocket."
    explanation: >-
      Structural modelling of p.Cys18Tyr.
  - reference: PMID:37328543
    reference_title: "A missense variant at the RAC1-PAK1 binding site of RAC1 inactivates downstream signaling in VACTERL association."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RAC1-p.Tyr40His interacted minimally with PAK1, and did not enable PAK1 activation."
    explanation: >-
      A variant at the PAK1-binding site fails to activate PAK1.
- name: RAC1 Over-Activation
  biological_scale: CELLULAR
  subtypes:
  - Normocephalic
  description: >-
    Activating variants raise the fraction of GTP-bound RAC1 and over-activate
    PAK1/2/3 and the WAVE regulatory complex, which drives Arp2/3-dependent
    actin branching.
  biological_processes:
  - preferred_term: Rac protein signal transduction
    term:
      id: GO:0016601
      label: Rac protein signal transduction
    modifier: INCREASED
  downstream:
  - target: Abnormal Neuronal Morphology from Excess Actin Branching
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35139179
      reference_title: "Activating RAC1 variants in the switch II region cause a developmental syndrome and alter neuronal morphology."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Axons of neurons isolated from Drosophila embryos expressing the most common of the activating variants are significantly shorter, with an increased density of filopodial protrusions."
      explanation: >-
        An activating variant distorts axon morphology in Drosophila neurons.
  evidence:
  - reference: PMID:35139179
    reference_title: "Activating RAC1 variants in the switch II region cause a developmental syndrome and alter neuronal morphology."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Pulldown assays, NIH3T3 fibroblast spreading assays and staining for activated PAK1/2/3 and WAVE2 suggest that these variants increase RAC1 activity and over-activate downstream signalling targets."
    explanation: >-
      Activating variants over-activate PAK and WAVE2 in cells.
- name: Reduced Neural Progenitor Proliferation
  biological_scale: CELLULAR
  subtypes:
  - Microcephalic
  description: >-
    Reduced proliferation of neural progenitors, the proposed basis of
    microcephaly with dominant-negative variants. Shown in zebrafish expressing
    patient variants and in forebrain-specific Rac1 knockout mice; not measured
    in human tissue.
  biological_processes:
  - preferred_term: neural precursor cell proliferation
    term:
      id: GO:0061351
      label: neural precursor cell proliferation
    modifier: DECREASED
  cell_types:

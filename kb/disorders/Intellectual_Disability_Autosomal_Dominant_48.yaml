    term:
      id: CL:0011020
      label: neural progenitor cell
  downstream:
  - target: Microcephaly
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28886345
      reference_title: "RAC1 Missense Mutations in Developmental Disorders with Diverse Phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "Conditional forebrain-specific Rac1-knockout mice display impaired neuronal migration, abnormal dendritic growth and remodelling, disruption of lamellipodia formation, reduced neuronal proliferation, premature differentiation, and microcephaly."
      explanation: >-
        Forebrain Rac1 loss reduces neuronal proliferation and causes
        microcephaly in mice.

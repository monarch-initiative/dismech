    evidence:
    - reference: PMID:30042656
      reference_title: "An Intellectual Disability-Related Missense Mutation in Rac1 Prevents LTP Induction."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Together, our findings strongly suggest that this mutation contributes to the development of ID in this individual."
      explanation: >-

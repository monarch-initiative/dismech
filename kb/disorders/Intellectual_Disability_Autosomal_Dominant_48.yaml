discussions:
- discussion_id: mrd48_variant_class_split
  kind: KNOWLEDGE_GAP
  attaches_to:
  - has_subtypes#Microcephalic
  - has_subtypes#Normocephalic
  - has_subtypes#Macrocephalic
  prompt: >-
    How do dominant-negative and activating RAC1 variants converge on
    intellectual disability, and why do Val51 variants cause macrocephaly?
  rationale: >-
    Opposite effects on RAC1 signalling produce microcephaly or normocephaly
    yet similar intellectual disability, brain malformations and heart
    defects. The Val51 variants have not been assigned a mechanism, although
    the head-size split mirrors TRIO, where reduced RAC1 activation gives
    microcephaly and increased activation gives macrocephaly. Functional
    testing of the Val51 variants and knock-in models of each class would
    show where the pathways diverge and converge.
- discussion_id: mrd48_wave_therapeutic_target
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Abnormal Neuronal Morphology from Excess Actin Branching
  prompt: >-
    Could inhibiting the WAVE regulatory complex or Arp2/3 treat MRD48 caused
    by activating variants?
  rationale: >-
    Cyfip knockdown rescues neuronal defects from an activating variant in
    Drosophila, and the authors propose the WAVE/Arp2/3 pathway as a
    therapeutic target. No such approach has been tested in a vertebrate
    model, and it would be expected to worsen the dominant-negative class.
notes: >-
  One individual with sensorineural hearing loss in the 2023 review also
  carried a paternally inherited pathogenic GRHL2 nonsense variant (DFNA28),
  so hearing loss is not curated as a feature of MRD48.

  The macrocephalic subtype rests on two individuals, both with Val51
  variants. A severe, lethal VACTERL-like presentation has been reported
  with p.Tyr40His in a single neonate and is recorded under variants rather
  than as a general phenotype.

  No GeneReviews chapter covers MRD48. No disease-specific treatment exists.

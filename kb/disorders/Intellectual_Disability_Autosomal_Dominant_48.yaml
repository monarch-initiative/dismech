genetic:
- name: RAC1
  gene_term:
    preferred_term: RAC1
    term:
      id: hgnc:9801
      label: RAC1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Heterozygous de novo missense variants cause MRD48. Dominant-negative and
    activating variants produce overlapping but distinguishable phenotypes,
    most clearly in head size.
  evidence:
  - reference: PMID:28886345
    reference_title: "RAC1 Missense Mutations in Developmental Disorders with Diverse Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Collectively, we observed an extraordinary spread of ∼10 SD of head circumferences orchestrated by distinct mutations in the same gene."
    explanation: >-
      Different variants in the same gene produce opposite head-size effects.
  - reference: PMID:42120539
    reference_title: "Distinct sub-clusters of developmental disorder-associated variants in the switch II region of RAC1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that variants affecting N- and C-terminal parts of RAC1 switch II cause phenotypically and mechanistically distinct disorders."
    explanation: >-
      The variant classes behave as distinct disorders.
variants:
- name: RAC1 p.Cys18Tyr
  description: >-
    c.53G>A (NM_006908), dominant-negative; microcephaly. Predicted to occlude
    the GTP-binding pocket and blocks long-term potentiation in rat hippocampal
    neurons.
  evidence:
  - reference: PMID:28886345
    reference_title: "RAC1 Missense Mutations in Developmental Disorders with Diverse Phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In silico modeling, mouse fibroblasts spreading assays, and in vivo overexpression assays using zebrafish as a surrogate model demonstrated that the p.Cys18Tyr and p.Asn39Ser RAC1 variants function as dominant-negative alleles and result in microcephaly, reduced neuronal proliferation, and cerebellar abnormalities in vivo."
    explanation: >-
      Dominant-negative effect of p.Cys18Tyr.
- name: RAC1 p.Asn39Ser
  description: >-
    c.116A>G, in switch I; dominant-negative; microcephaly.
  evidence:
  - reference: PMID:28886345
    reference_title: "RAC1 Missense Mutations in Developmental Disorders with Diverse Phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In silico modeling, mouse fibroblasts spreading assays, and in vivo overexpression assays using zebrafish as a surrogate model demonstrated that the p.Cys18Tyr and p.Asn39Ser RAC1 variants function as dominant-negative alleles and result in microcephaly, reduced neuronal proliferation, and cerebellar abnormalities in vivo."
    explanation: >-
      Dominant-negative effect of p.Asn39Ser.
- name: RAC1 p.Tyr64Asp
  description: >-
    c.190T>G, in switch II; constitutively active. Head size was +1 SD in the
    founding report and +3.06 SD (mild macrocephaly) at 14 years in a later
    report.
  evidence:
  - reference: PMID:28886345
    reference_title: "RAC1 Missense Mutations in Developmental Disorders with Diverse Phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Conversely, the p.Tyr64Asp substitution is constitutively active."
    explanation: >-
      Activating effect of p.Tyr64Asp.
  - reference: PMID:35139179
    reference_title: "Activating RAC1 variants in the switch II region cause a developmental syndrome and alter neuronal morphology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One boy with a Y64D variant had mild macrocephaly of +3.06 at 14 years of age."
    explanation: >-
      Head size with p.Tyr64Asp in adolescence.
- name: RAC1 p.Glu62Lys and p.Ala159Thr
  description: >-
    c.184G>A (switch II, weakly activating) and c.475G>A (G5 box, fully
    activating); both de novo, with normal head size.
  evidence:
  - reference: PMID:37059841
    reference_title: "Clinical profiling of MRD48 and functional characterization of two novel pathogenic RAC1 variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we observed that RAC1E62K behaved as a weakly constitutively activated GTPase, while RAC1A159T showed a full CA behavior, similar to that characterizing RAC1A159V and RAC1G12V (Fig. 1D)"
    explanation: >-
      Both variants are activating.
- name: RAC1 p.Val51Met and p.Val51Leu
  description: >-
    c.151G>A and c.151G>C; macrocephaly; mechanism unresolved.
  evidence:
  - reference: PMID:28886345
    reference_title: "RAC1 Missense Mutations in Developmental Disorders with Diverse Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, two individuals with c.151G>A (p.Val51Met) and c.151G>C (p.Val51Leu) alleles were macrocephalic with head circumferences of +4.16 and +4.5 SD."
    explanation: >-
      The Val51 variants and their phenotype.
- name: RAC1 p.Glu31Gly
  description: >-
    c.92A>G (NM_006908.5), dominant-negative toward PAK1 signalling; acquired
    microcephaly.
  evidence:
  - reference: PMID:39307291
    reference_title: "Pathophysiological significance of the p.E31G variant in RAC1 responsible for a neurodevelopmental disorder with microcephaly."
    supports: SUPPORT

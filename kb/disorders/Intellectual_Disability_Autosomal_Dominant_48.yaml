differential_diagnoses:
- name: RAC3-related neurodevelopmental disorder (NEDBAF)
  description: >-
    Activating variants in the paralog RAC3 cause a similar disorder, with more
    frequent corpus callosum, brainstem and cerebellar malformations than
    MRD48.
  evidence:
  - reference: PMID:37059841
    reference_title: "Clinical profiling of MRD48 and functional characterization of two novel pathogenic RAC1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, specific MRI anomalies (i.e., hypoplasia/aplasia of corpus callosum, brainstem and cerebellar hypo/dysplasia) seem much more frequent in NEDBAF with respect to MRD48"
    explanation: >-
      Imaging differences between the RAC3 and RAC1 disorders.
- name: TRIO-related neurodevelopmental disorder
  description: >-
    Variants in the RAC1 activator TRIO cause intellectual disability with
    microcephaly (reduced RAC1 activation) or macrocephaly (increased RAC1
    activation), mirroring the RAC1 head-size split. Curated separately as
    TRIO-Related_Neurodevelopmental_Disorder; distinguished by sequencing.
  evidence:
  - reference: PMID:35139179
    reference_title: "Activating RAC1 variants in the switch II region cause a developmental syndrome and alter neuronal morphology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "increased or decreased RAC1 activation has also been detected in neurodevelopmental disorders caused by variants in TRIO"
    explanation: >-
      TRIO disorders also involve altered RAC1 activation in either
      direction.
diagnosis:
- name: Exome or genome sequencing
  description: >-
    Diagnosis is by exome or genome sequencing, ideally as a trio to confirm
    de novo status. Variant position (switch I, switch II N- versus C-terminal,
    nucleotide-binding site) helps predict mechanism and head-size phenotype.
  evidence:
  - reference: PMID:28886345
    reference_title: "RAC1 Missense Mutations in Developmental Disorders with Diverse Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

  title: 'Molecular landscape of respiratory infection: A large-scale, multi-centre blood transcriptome dataset'
  description: Respiratory infections pose significant challenges to global health, impacting millions of individuals annually. Understanding the molecular mechanisms underlying the pathogenicity of these infections is crucial for developing effective interventions. RNA sequencing provides insights into a patient’s global transcriptome changes, facilitating the identification of host gene signatures in response to infection and potential therapeutic targets.
  organism:
    preferred_term: human

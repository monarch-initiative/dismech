diagnosis:
- name: Multiplex Respiratory Viral RT-PCR Panel
  presence: PRESENT
  description: >-
    Etiologic diagnosis is established on nasal or nasopharyngeal swabs using
    multiplex reverse-transcription polymerase chain reaction (RT-PCR)
    respiratory pathogen panels that detect and type HCoV-229E, HCoV-NL63,
    HCoV-OC43, and HCoV-HKU1.
  diagnosis_term:
    preferred_term: multiplex RT-PCR respiratory panel
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:36350773
    reference_title: "Household Transmission Dynamics of Seasonal Human Coronaviruses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Swabs were tested using a multiplex RT-PCR respiratory panel Genmarks
      RVP-RUO panel (Genmark Diagnostics, Carlsbad, CA) on the eSensor Xt-8
      instrument (Luminex, Austin, TX). Specimens were tested for respiratory
      pathogens, including 4 human coronavirus subtypes (HCoV 229E, NL63, HKU1,
      and OC43).
    explanation: >-
      Demonstrates molecular detection and species typing of all four seasonal
      human coronaviruses using a multiplex respiratory RT-PCR swab panel.
treatments:
- name: Supportive Care
  therapeutic_modality: OTHER
  description: >-
    Clinical management is supportive (hydration, antipyretics, and respiratory
    support for complicated lower airway disease), as no licensed seasonal
    coronavirus vaccine or specific antiviral agent is currently approved.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Upper Respiratory Mucosal Antiviral and Inflammatory Response
    treatment_effect: MODULATES
    description: >-
      Symptomatic supportive measures alleviate upper respiratory mucosal and
      febrile symptoms during self-limited viral clearance.
  evidence:
  - reference: PMID:33186086
    reference_title: "Complicating Infections Associated with Common Endemic Human Respiratory Coronaviruses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Given the potential disease among humans, it is justified to search for
      effective antiviral chemotherapy for these viruses and to consider uses in
      niche situations should effective therapy be defined.
    explanation: >-
      Confirms that effective specific antiviral chemotherapy for endemic human
      coronaviruses has not yet been established, leaving clinical management
      supportive.
  - reference: PMID:41295541
    reference_title: "Current Status and Challenges of Vaccine Development for Seasonal Human Coronaviruses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      no vaccine has yet been approved for the prevention of seasonal HCoVs.
    explanation: >-
      Confirms the absence of approved preventive vaccines for seasonal human
      coronaviruses.
progression:
- phase: Early childhood primary exposure with lifelong seasonal reinfections
  notes: >-
    Primary infection typically occurs before age 5, seroconversion to all four
    endemic species is commonly acquired by age 20, and waning mucosal immunity
    permits recurrent acute self-limited reinfections throughout adulthood, with
    severe lower respiratory progression concentrated in infants, older adults,
    and immunocompromised hosts.
  evidence:
  - reference: PMID:36350773
    reference_title: "Household Transmission Dynamics of Seasonal Human Coronaviruses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On average, individuals are infected by their first HCoV by age 5 and have
      evidence of infection with all 4 strains by age 20
    explanation: >-
      Establishes the age of initial acquisition and universal exposure across
      all four seasonal human coronavirus species.
  - reference: PMID:36350773
    reference_title: "Household Transmission Dynamics of Seasonal Human Coronaviruses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals are reinfected throughout their lifetime, as observed in
      longitudinal seroprevalence and virological studies
    explanation: >-
      Establishes lifelong recurrent reinfection as a hallmark of seasonal human
      coronavirus natural history.
notes: >-
  No usable active MONDO term currently represents seasonal/endemic human
  coronavirus infection specifically without conflating pandemic betacoronaviruses
  or obsolete sensitivity terms, so disease_term is intentionally omitted pending
  an upstream ontology term.

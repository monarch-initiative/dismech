      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 377
  publication: PMID:40640204
  notes: Identified by GEO DataSets index search for Seasonal Coronavirus Infection (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.

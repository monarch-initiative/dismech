name: Seasonal Coronavirus Infection
creation_date: "2026-06-28T00:00:00Z"
description: >-
  Seasonal (endemic) coronavirus infection is an acute viral respiratory tract
  infection caused by the four globally endemic human coronaviruses: the
  alphacoronaviruses HCoV-229E and HCoV-NL63 and the betacoronaviruses
  HCoV-OC43 and HCoV-HKU1. Circulating in winter-predominant epidemic waves with
  frequent lifetime reinfections, these viruses enter upper airway epithelial
  cells via species-specific host receptors (aminopeptidase N for HCoV-229E,
  ACE2 for HCoV-NL63, and 9-O-acetylated sialic acid glycoconjugates for
  HCoV-OC43 and HCoV-HKU1, with TMPRSS2 serving as a functional receptor for
  HCoV-HKU1), typically causing self-limited upper respiratory illness
  (rhinorrhea, nasal congestion, pharyngitis, cough, headache, and fever) while
  occasionally causing gastroenteritis or progressing to bronchiolitis,
  pneumonia, asthma exacerbations, or otitis media in infants, older adults,
  and immunocompromised hosts.
category: Infectious Disease
parents:
- Viral Respiratory Infection
synonyms:
- Endemic human coronavirus infection
- Common cold coronavirus infection
- Seasonal human coronavirus infection
- HCoV-229E/NL63/OC43/HKU1 infection
review_notes: >-
  Deliberately lumped. The four endemic human respiratory coronaviruses
  (HCoV-229E, HCoV-NL63, HCoV-OC43, and HCoV-HKU1) produce clinically
  indistinguishable acute upper respiratory tract common-cold syndromes and
  overlapping lower respiratory tract complications, are detected simultaneously
  on routine multiplex respiratory RT-PCR panels, and share identical supportive
  clinical management, while species-specific entry receptor usage is explicitly
  captured at the receptor-mediated viral entry node.

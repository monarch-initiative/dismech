transmission:
- name: Household and community transmission between close contacts
  description: >-
    Seasonal human coronaviruses spread from person to person via respiratory
    secretions and close contact within households and the wider community,
    driving recurrent winter-dominant epidemics and frequent reinfections.
  evidence:
  - reference: PMID:36350773
    reference_title: Household Transmission Dynamics of Seasonal Human Coronaviruses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The estimated weekly household transmission probability was 9% (95% CrI,
      6-13) and weekly community acquisition probability was 7% (95% CrI, 5-10).
    explanation: >-
      Prospective surveillance of 223 households quantifies person-to-person
      household and community transmission probabilities of endemic HCoVs.
  - reference: PMID:36350773
    reference_title: Household Transmission Dynamics of Seasonal Human Coronaviruses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Household transmission studies inform how viruses spread among close
      contacts, but few characterize household transmission of endemic
      coronaviruses.
    explanation: >-
      Establishes close-contact household spread as a primary transmission
      setting for endemic coronaviruses.
pathophysiology:
- name: Receptor-Mediated Upper Airway Epithelial Entry and Replication
  biological_scale: CELLULAR
  description: >-
    Spike glycoproteins of the four seasonal coronaviruses engage distinct
    apical host-cell receptors on nasal and nasopharyngeal ciliated respiratory
    epithelium (hAPN for HCoV-229E, hACE2 for HCoV-NL63, and 9-O-acetylated
    sialic acid-conjugated glycoproteins for HCoV-OC43 and HCoV-HKU1, with
    TMPRSS2 serving as a functional receptor for HCoV-HKU1) to mediate viral
    entry and positive-sense RNA genome replication; by homology with related
    embecoviruses (MHV and BCoV), HCoV-OC43 accessory protein NS2 likely
    antagonizes the host OAS-RNase L innate antiviral pathway.
  cell_types:
  - preferred_term: ciliated cell
    term:
      id: CL:0000064
      label: ciliated cell
  - preferred_term: respiratory tract epithelial cell
    term:
      id: CL:0002368
      label: respiratory tract epithelial cell
  biological_processes:
  - preferred_term: symbiont entry into host cell
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  - preferred_term: viral genome replication
    term:
      id: GO:0019079
      label: viral genome replication
  locations:
  - preferred_term: nasal cavity mucosa
    term:
      id: UBERON:0001826
      label: nasal cavity mucosa
  - preferred_term: nasopharynx
    term:
      id: UBERON:0001728
      label: nasopharynx
  evidence:
  - reference: PMID:41295541
    reference_title: "Current Status and Challenges of Vaccine Development for Seasonal Human Coronaviruses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      HCoV-229E and HCoV-NL63 utilize hAPN and hACE2 as cellular receptors,
      respectively, while both HCoV-OC43 and HCoV-HKU1 enter host cells by
      binding to 9-O-Ac-Sia-conjugated glycoproteins. Recent studies have
      further demonstrated that TMPRSS2 serves as a functional receptor for
      HCoV-HKU1.
    explanation: >-
      Details the species-specific host-cell attachment and entry receptors used
      by the four seasonal human coronaviruses.
  - reference: PMID:41295541
    reference_title: "Current Status and Challenges of Vaccine Development for Seasonal Human Coronaviruses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therefore, HCoV-OC43 NS2 likely antagonizes the innate immune response by
      interfering with the OAS-RNase L pathway.
    explanation: >-
      Documents the hedged OAS-RNase L innate immune antagonism inferred for
      HCoV-OC43 NS2 by homology with related betacoronaviruses.
  downstream:
  - target: Upper Respiratory Mucosal Antiviral and Inflammatory Response
    causal_link_type: DIRECT
    description: >-
      Seasonal coronavirus RNA replication in upper airway epithelium engages
      host innate antiviral defenses (including the OAS-RNase L pathway) and
      acute mucosal inflammation.
    evidence:
    - reference: PMID:41295541
      reference_title: "Current Status and Challenges of Vaccine Development for Seasonal Human Coronaviruses."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        MHV/BCoV NS2 is a 2′,5′-phosphodiesterase (PDE) that degrades 2′-5′
        oligoadenylates (2-5A), preventing RNase L activation and protecting
        viral RNA from degradation ... Therefore, HCoV-OC43 NS2 likely
        antagonizes the innate immune response by interfering with the OAS-RNase
        L pathway.
      explanation: >-
        Supports activation of the host innate antiviral OAS-RNase L response
        during seasonal coronavirus replication, which viral accessory protein
        NS2 likely counteracts.
    - reference: PMID:41295541
      reference_title: "Current Status and Challenges of Vaccine Development for Seasonal Human Coronaviruses."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        HCoV-229E, HCoV-OC43, HCoV-NL63, and HCoV-HKU1 typically cause mild
        symptoms such as nasal congestion, rhinorrhea, sore or scratchy throat,
        cough, sneezing, and low-grade fever in epidemic patterns [8].
      explanation: >-
        Indirectly connects upper airway seasonal coronavirus infection to acute
        symptomatic mucosal inflammation.
  - target: Lower Respiratory and Complicated Infection
    causal_link_type: DIRECT
    description: >-
      In infants, older adults, and immunocompromised or comorbid hosts, high
      viral loads and descending airway viral replication extend infection into
      the bronchi, bronchioles, and lung parenchyma.
    evidence:
    - reference: PMID:41295541
      reference_title: "Current Status and Challenges of Vaccine Development for Seasonal Human Coronaviruses."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        High HCoV-NL63 viral loads are associated with severe lower respiratory
        tract symptoms, including bronchitis, bronchiolitis, and pneumonia
        [108].
      explanation: >-
        Links high viral replication burden directly to extension into lower
        respiratory tract disease.
  - target: Gastroenteritis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Seasonal coronavirus infection is occasionally accompanied through
      incompletely characterized enteric or systemic intermediates by acute
      gastrointestinal symptoms and gastroenteritis.
    evidence:
    - reference: PMID:33186086
      reference_title: "Complicating Infections Associated with Common Endemic Human Respiratory Coronaviruses."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        They also may cause simple and complicated lower respiratory infections,
        otitis media, asthma exacerbations, gastroenteritis, and a few systemic
        complications.
      explanation: >-
        Documents gastroenteritis as a recognized extra-respiratory complication
        of seasonal human coronavirus infection.

- name: Fasting Hepatic Glucose Output Deficit
  biological_scale: ORGANISM
  description: >-
    With glycogenolysis blocked, fasting blood glucose depends on
    gluconeogenesis alone. Gluconeogenesis is intact in GSD IX, which is the
    decisive physiological difference from GSD I: hypoglycaemia is usually
    milder and lactate and urate are typically normal rather than raised.
  biological_processes:
  - preferred_term: glucose homeostasis
    term:
      id: GO:0042593
      label: glucose homeostasis
    modifier: DECREASED
  - preferred_term: gluconeogenesis
    term:
      id: GO:0006094
      label: gluconeogenesis
  evidence:
  - reference: PMID:30659246
    reference_title: "Diagnosis and management of glycogen storage diseases type VI and IX: a clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Unlike GSD I, gluconeogenesis is intact in individuals with GSDs VI and IX.
    explanation: Establishes the intact gluconeogenic arm that limits the severity of hypoglycaemia.
  - reference: PMID:30659246
    reference_title: "Diagnosis and management of glycogen storage diseases type VI and IX: a clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Unlike GSD I, lactic acid and uric acid concentrations are usually normal
    explanation: Records the normal lactate and urate that distinguish GSD IX from GSD I biochemically.
  - reference: PMID:41732189
    reference_title: "Glycogen storage disease type IX: Long-term follow-up of 52 patients from three European countries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Severe hypoglycemic episodes were uncommon, and no clear genotype-phenotype correlation emerged.
    explanation: Confirms in a modern cohort that severe hypoglycaemia is the exception.
  downstream:
  - target: Ketotic hypoglycemia
    description: Fasting glucose falls when gluconeogenesis cannot fully compensate for the glycogenolytic block.
    causal_link_type: DIRECT
    evidence:

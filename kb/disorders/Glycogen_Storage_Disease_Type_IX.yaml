  - target: Hepatocellular Injury and Progressive Liver Fibrosis
    description: >-
      Chronic hepatocellular glycogen overload is followed in a substantial
      minority of patients by steatosis, inflammation and fibrosis, but the
      steps between storage and fibrogenesis are not established in GSD IX.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

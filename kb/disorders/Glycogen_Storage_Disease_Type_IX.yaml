      snippet: >-
        Ketotic hypoglycemia, if present, varies from occasional (only occurring
        after long fasts or during times of reduced intake when ill) to recurrent
        in some cases.
      explanation: Names ketotic hypoglycaemia as the fasting consequence and records its variability.
  - target: Compensatory Fatty Acid Oxidation and Ketogenesis
    description: Energy shortfall during fasting drives fatty acid oxidation and ketone production.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30659246
      reference_title: "Diagnosis and management of glycogen storage diseases type VI and IX: a clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Ketosis is usually a prominent metabolic feature in both GSD VI and GSD IX
      explanation: States that ketosis, not lactic acidosis, is the prominent metabolic response.
  - target: Growth delay
    description: >-
      Chronic fasting intolerance and metabolic derangement impair linear growth,
      through intermediates that are not defined in GSD IX.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:41732189
      reference_title: "Glycogen storage disease type IX: Long-term follow-up of 52 patients from three European countries."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Nutritional intervention was associated with improved growth (height SD
        score - 0.8 ± 1.3 vs -0.2 ± 1.65; p = 0.031) and fewer documented fasting
        hypoglycemia episodes (20/44 vs 9/44; p = 0.012), although hepatomegaly
        frequently persisted
      explanation: >-
        The same nutritional intervention that reduced fasting hypoglycaemia also
        improved height SD score in this cohort, linking fasting control to growth.

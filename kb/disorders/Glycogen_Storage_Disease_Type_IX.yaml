    explanation: Confirms hepatomegaly as the dominant feature in a 52-patient cohort.
  downstream:
  - target: Hepatomegaly
    description: Glycogen-laden hepatocytes expand the liver.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12930917

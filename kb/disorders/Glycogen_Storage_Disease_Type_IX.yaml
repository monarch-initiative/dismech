progression:
- phase: Early-childhood hepatic presentation
  age_range: First one to two years of life
  notes: >-
    Affected children typically come to attention in infancy or early childhood
    with hepatomegaly, growth deceleration, raised transaminases and
    hyperlipidaemia.
  evidence:
  - reference: PMID:41732189
    reference_title: "Glycogen storage disease type IX: Long-term follow-up of 52 patients from three European countries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The median age at symptom onset was 1.6 years, and the mean age at diagnosis was 2.0 years.
    explanation: Dates symptom onset and diagnosis in a 52-patient multicentre cohort.
  - reference: PMID:12930917
    reference_title: Severe phenotype of phosphorylase kinase-deficient liver glycogenosis with mutations in the PHKG2 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phosphorylase kinase-deficient liver glycogenosis manifests in infancy with
      hepatomegaly, growth retardation, and elevated plasma aminotransferases and
      lipids.
    explanation: Describes the infantile presenting picture.
- phase: Attenuation of biochemical abnormalities through adolescence
  age_range: Childhood to puberty
  notes: >-
    Symptoms and laboratory abnormalities of the liver forms tend to improve with
    age, and were historically described as resolving at puberty. This is the
    basis of the older "benign" framing that later hepatic follow-up qualified.
  evidence:
  - reference: PMID:30659246
    reference_title: "Diagnosis and management of glycogen storage diseases type VI and IX: a clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The clinical symptoms and laboratory abnormalities tend to improve with age.
    explanation: States the age-related attenuation of the hepatic phenotype.
  - reference: PMID:12930917
    reference_title: Severe phenotype of phosphorylase kinase-deficient liver glycogenosis with mutations in the PHKG2 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It is usually a benign condition, often with complete resolution of symptoms during puberty.
    explanation: Records the classical benign course with resolution at puberty.
- phase: Long-term hepatic complications
  age_range: Childhood through adulthood
  notes: >-
    Improvement in symptoms does not guarantee hepatic safety: fibrosis and
    cirrhosis are now recognised long-term outcomes requiring surveillance, and
    cirrhosis may appear in the first years of life in PHKG2-related disease.
  evidence:
  - reference: PMID:21634085
    reference_title: Phosphorylase Kinase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While symptoms and biochemical abnormalities of liver PhK deficiency were
      thought to improve with age, it is becoming evident that affected
      individuals need to be monitored for long-term complications such as liver
      fibrosis and cirrhosis.
    explanation: States the revision of the benign framing and the need for hepatic surveillance.
  - reference: PMID:30659246
    reference_title: "Diagnosis and management of glycogen storage diseases type VI and IX: a clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: GSD IX has been diagnosed in adults who were being evaluated for hepatic cirrhosis.
    explanation: Documents adult ascertainment of GSD IX through cirrhosis workup.
pathophysiology:
- name: Phosphorylase Kinase Subunit Deficiency
  biological_scale: MOLECULAR
  description: >-
    Pathogenic variants in a gene encoding one of the phosphorylase kinase (PhK)
    subunits reduce or abolish holoenzyme activity. PhK is a heterotetramer of
    four copies each of an alpha, beta, gamma and delta subunit; the gamma
    subunit carries the catalytic site and the alpha, beta and delta
    (calmodulin) subunits regulate it. Tissue-specific isoforms mean the
    resulting deficiency is confined to liver, to muscle, or to both, depending
    on which subunit gene is affected.
  genes:
  - preferred_term: PHKA2
    term:
      id: hgnc:8926
      label: PHKA2
  - preferred_term: PHKB
    term:
      id: hgnc:8927
      label: PHKB
  - preferred_term: PHKG2
    term:
      id: hgnc:8931
      label: PHKG2
  - preferred_term: PHKA1
    term:
      id: hgnc:8925
      label: PHKA1
  molecular_functions:
  - preferred_term: phosphorylase kinase activity
    term:
      id: GO:0004689
      label: phosphorylase kinase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:17689125
    reference_title: "Glycogen storage disease type IX: High variability in clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phosphorylase kinase holoenzyme is made up of four copies of each of
      four subunits (alpha, beta, gamma and delta). The liver isoforms of the
      alpha-, beta- and gamma-subunits are encoded by PHKA2, PHKB and PHKG2,
      respectively.
    explanation: Gives the holoenzyme composition and the liver subunit gene assignments.
  - reference: PMID:30659246
    reference_title: "Diagnosis and management of glycogen storage diseases type VI and IX: a clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Its activity is regulated by the phosphorylation state of the regulatory α
      and β subunits, and by the δ subunit (calmodulin) via calcium levels.
    explanation: Establishes that the non-catalytic subunits are regulatory, so variants in them impair holoenzyme activity.
  - reference: PMID:21634085
    reference_title: Phosphorylase Kinase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PHKA1, encoding subunit α, cause the rare X-linked disorder muscle PhK
      deficiency; PHKA2, also encoding subunit α, cause the most common form,
      liver PhK deficiency (X-linked liver glycogenosis); PHKB, encoding subunit
      β, cause autosomal recessive PhK deficiency in both liver and muscle;
      PHKG2, encoding subunit γ, cause autosomal recessive liver PhK deficiency.
    explanation: Maps each subunit gene to the tissue distribution of the resulting deficiency.
  downstream:
  - target: Failure to Activate Hepatic Glycogen Phosphorylase
    description: >-
      Loss of PhK activity in liver removes the kinase step that converts
      phosphorylase b to phosphorylase a.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30659246
      reference_title: "Diagnosis and management of glycogen storage diseases type VI and IX: a clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        PhK is a protein kinase that phosphorylates the inactive form of glycogen
        phosphorylase, phosphorylase b, to produce the active form, phosphorylase
        a.
      explanation: Identifies the exact reaction that PhK deficiency removes.
  - target: Impaired Skeletal Muscle Glycogenolysis
    description: >-
      Variants in the muscle alpha isoform PHKA1, and in the widely expressed
      PHKB, place the same PhK block in skeletal muscle.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:7874115
      reference_title: Human muscle glycogenosis due to phosphorylase kinase deficiency associated with a nonsense mutation in the muscle isoform of the alpha subunit.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Whereas the latter two sequences were found to be normal, we identified a
        nonsense mutation in alpha M.
      explanation: >-
        The first reported human PhK deficiency mutation, in the muscle alpha
        isoform of a patient with muscle-specific disease.
    - reference: PMID:30659246
      reference_title: "Diagnosis and management of glycogen storage diseases type VI and IX: a clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Isolated muscle PhK deficiency that is caused by pathogenic variants in
        PHKA1 and has also been known as GSD IXd, has also been described
      explanation: Attributes isolated muscle PhK deficiency (GSD IXd) to PHKA1.
- name: Failure to Activate Hepatic Glycogen Phosphorylase
  biological_scale: MOLECULAR
  description: >-
    Without PhK-mediated phosphorylation, hepatic glycogen phosphorylase remains
    in the inactive b form. The defect is therefore regulatory rather than
    catalytic: the phosphorylase enzyme itself is intact but cannot be switched
    on, which is what makes GSD IX clinically almost indistinguishable from GSD
    VI, where phosphorylase itself is deficient.
  cell_types:
  - preferred_term: Hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  molecular_functions:
  - preferred_term: glycogen phosphorylase activity
    term:
      id: GO:0008184
      label: glycogen phosphorylase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:21634085
    reference_title: Phosphorylase Kinase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Phosphorylase kinase (PhK) deficiency causing glycogen storage disease type
      IX (GSD IX) results from deficiency of the enzyme phosphorylase b kinase,
      which has a major regulatory role in the breakdown of glycogen.
    explanation: States the regulatory nature of the lesion in glycogen breakdown.
  - reference: PMID:25266922
    reference_title: "The natural history of glycogen storage disease types VI and IX: Long-term outcome from the largest metabolic center in Canada."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Glycogen storage disease (GSD) types VI and IX are caused by phosphorylase system deficiencies.
    explanation: Groups GSD VI and IX as lesions of the same phosphorylase system, the basis for their clinical overlap.
  downstream:
  - target: Impaired Hepatic Glycogenolysis
    description: Phosphorylase held in its inactive form cannot cleave glucose-1-phosphate from hepatic glycogen.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17689125
      reference_title: "Glycogen storage disease type IX: High variability in clinical phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Glycogen storage disease type IX (GSD type IX) results from a deficiency
        of hepatic phosphorylase kinase activity.
      explanation: Anchors the hepatic PhK deficiency as the cause of the disease.
- name: Impaired Hepatic Glycogenolysis
  biological_scale: CELLULAR
  description: >-
    The committed step of hepatic glycogen breakdown is blocked, so stored
    glycogen cannot be mobilised to glucose during fasting and accumulates
    within the hepatocyte.
  cell_types:
  - preferred_term: Hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: glycogen catabolic process
    term:
      id: GO:0005980
      label: glycogen catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:30659246
    reference_title: "Diagnosis and management of glycogen storage diseases type VI and IX: a clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The prominent clinical effects of impaired glycogenolysis include hepatomegaly
    explanation: Names impaired glycogenolysis as the proximate lesion behind the clinical picture.
  - reference: PMID:9384616
    reference_title: "Liver glycogenosis due to phosphorylase kinase deficiency: PHKG2 gene structure and mutations associated with cirrhosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in three different genes of phosphorylase kinase (Phk) subunits,
      PHKA2, PHKB and PHKG2, can give rise to glycogen storage disease of the
      liver.
    explanation: Confirms that all three liver subunit genes converge on hepatic glycogen storage disease.
  downstream:
  - target: Hepatocellular Glycogen Accumulation
    description: Glycogen that cannot be degraded accumulates in hepatocytes.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21634085
      reference_title: Phosphorylase Kinase Deficiency.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The two types of PhK deficiency are liver PhK deficiency (characterized
        by early childhood onset of hepatomegaly and growth restriction, and
        often, but not always, fasting ketosis and hypoglycemia) and muscle PhK
        deficiency, which is considerably rarer (characterized by any of the
        following: exercise intolerance, myalgia, muscle cramps, myoglobinuria,
        and progressive muscle weakness).
      explanation: >-
        Links the hepatic PhK block to hepatomegaly, the clinical signature of
        hepatocellular glycogen accumulation.
  - target: Fasting Hepatic Glucose Output Deficit
    description: >-
      Loss of glycogenolysis removes the liver's first-line source of glucose
      for the fasting circulation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30659246
      reference_title: "Diagnosis and management of glycogen storage diseases type VI and IX: a clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Ketotic hypoglycemia, if present, varies from occasional (only occurring
        after long fasts or during times of reduced intake when ill) to recurrent
        in some cases.
      explanation: Ties the glucose deficit to fasting, the physiological state in which glycogenolysis is required.
- name: Hepatocellular Glycogen Accumulation
  biological_scale: CELLULAR
  description: >-
    Undegraded glycogen accumulates within hepatocytes, expanding the liver and
    providing the substrate load behind hepatomegaly and, over time,
    hepatocellular stress.

has_subtypes:
- name: IXa1
  display_name: GSD IXa1 (PHKA2-related; PhK deficient in liver and erythrocytes)
  subtype_term:
    preferred_term: glycogen storage disease IXa1
    term:
      id: MONDO:0010598
      label: glycogen storage disease IXa1
  description: >-
    X-linked liver glycogenosis caused by hemizygous PHKA2 variants (OMIM:306000),
    with demonstrable PhK deficiency in both liver and blood cells. PHKA2 is the
    commonest cause of liver GSD IX. Historically also called GSD VIII and XLG
    type I.
  genes:
  - preferred_term: PHKA2
    term:
      id: hgnc:8926
      label: PHKA2
  inheritance:
  - name: X-linked recessive
  evidence:
  - reference: PMID:30659246
    reference_title: "Diagnosis and management of glycogen storage diseases type VI and IX: a clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pathogenic variants in the PHKA2 gene (OMIM 300798; Xp22.2-p22.1) are the
      most common cause of the liver form of GSD IX, accounting for about 75% of
      cases.
    explanation: Establishes PHKA2 as the commonest liver subtype.
  - reference: PMID:9835437
    reference_title: "Clinical, biochemical and molecular findings in a patient with X-linked liver glycogenosis followed for 40 years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      XLG type I patients have a clear-cut PHK deficiency in liver and blood
      cells, whereas XLG type II patients have a normal or residual activity.
    explanation: Defines the enzymatic criterion that separates IXa1 from IXa2.
- name: IXa2
  display_name: GSD IXa2 (PHKA2-related; PhK deficient in liver, normal in erythrocytes)
  subtype_term:
    preferred_term: glycogen storage disease IXa2
    term:
      id: MONDO:0100439
      label: glycogen storage disease IXa2
  description: >-
    The same PHKA2 gene, but PhK activity is normal or residual in erythrocytes
    while deficient in liver. The distinction matters diagnostically rather than
    clinically: a blood-cell assay is normal, so the diagnosis is missed unless
    liver enzymology or molecular testing is performed. Historically XLG type II.
  genes:
  - preferred_term: PHKA2
    term:
      id: hgnc:8926
      label: PHKA2
  inheritance:
  - name: X-linked recessive
  evidence:
  - reference: PMID:9835437
    reference_title: "Clinical, biochemical and molecular findings in a patient with X-linked liver glycogenosis followed for 40 years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we present clinical, biochemical and molecular findings on a liver
      glycogenosis patient in whom the diagnosis XLG II only became clear after
      enzyme assays in the liver and identification of the disease-causing
      mutation.
    explanation: Shows that the IXa2 diagnosis required liver enzymology plus molecular testing.
  - reference: PMID:9835437
    reference_title: "Clinical, biochemical and molecular findings in a patient with X-linked liver glycogenosis followed for 40 years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A missense mutation replacing arginine at amino acid position 186 by
      histidine (R186H) was identified in the PHKA2 gene.
    explanation: Records a recurrent PHKA2 variant found in this subtype.
- name: IXb
  display_name: GSD IXb (PHKB-related; liver and muscle PhK deficiency)
  subtype_term:
    preferred_term: glycogen storage disease IXb
    term:
      id: MONDO:0009868
      label: glycogen storage disease IXb
  description: >-
    Autosomal recessive disease from biallelic PHKB variants (OMIM:261750).
    Because PHKB is widely expressed, enzyme activity is reduced in muscle as
    well as liver, yet muscle symptoms are mild or absent and the subtype cannot
    be told apart from the other liver forms on clinical grounds. The phenotype
    is generally the mildest of the liver subtypes.
  genes:
  - preferred_term: PHKB
    term:
      id: hgnc:8927

diagnosis:
- name: Molecular genetic testing of the PhK subunit genes
  description: >-
    Sequencing of PHKA2, PHKB, PHKG2 and PHKA1 (typically as a panel) is the
    definitive test. It resolves cases in which enzymology is uninformative and,
    unlike enzyme assay, establishes the mode of inheritance for counselling.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: A hemizygous PHKA1 or PHKA2 variant, or biallelic PHKB or PHKG2 variants.
  evidence:
  - reference: PMID:17689125
    reference_title: "Glycogen storage disease type IX: High variability in clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular analysis allows accurate diagnosis where enzymology is
      uninformative and identifies the pattern of inheritance permitting
      counselling and family studies.
    explanation: States the two advantages of molecular over enzymatic diagnosis.
  - reference: PMID:21634085
    reference_title: Phosphorylase Kinase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of PhK deficiency is established in a proband with the
      characteristic clinical findings, a family history of suspected storage
      disease, and/or a hemizygous pathogenic variant in PHKA1 or PHKA2 or
      biallelic pathogenic variants in PHKB or PHKG2 identified by molecular
      genetic testing.
    explanation: Gives the formal molecular diagnostic criterion.
- name: Phosphorylase kinase enzyme activity assay
  description: >-
    PhK activity can be measured in erythrocytes, leukocytes, liver or muscle.
    It is unreliable as a sole test: activity varies by tissue and subtype, and
    in the IXa2 pattern erythrocyte activity is normal while liver activity is
    deficient, so a normal blood assay does not exclude the diagnosis.
  results: Reduced PhK activity in the affected tissue; may be normal in blood cells in IXa2.
  evidence:
  - reference: PMID:17689125
    reference_title: "Glycogen storage disease type IX: High variability in clinical phenotype."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Accurate diagnosis had been hampered by enzymology not being diagnostic in five cases.
    explanation: >-
      Quantifies the failure rate of enzymology in a 15-patient series, which is
      why this test is curated with its limitation stated.
  - reference: PMID:9326319
    reference_title: "Autosomal recessive phosphorylase kinase deficiency in liver, caused by mutations in the gene encoding the beta subunit (PHKB)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband had a severe deficiency of phosphorylase kinase in liver, while
      the phosphorylase kinase activity in erythrocytes was only slightly
      diminished. She had no symptoms of muscle involvement.
    explanation: Shows the tissue discordance that makes a blood assay an unreliable screen.

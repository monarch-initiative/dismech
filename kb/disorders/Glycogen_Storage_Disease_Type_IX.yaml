discussions:
- discussion_id: gap_gsd9_genotype_phenotype
  prompt: >-
    Why does liver GSD IX range from an almost asymptomatic course to recurrent
    hypoglycaemia with childhood cirrhosis, when the largest modern cohort found
    no clear genotype-phenotype correlation and even individuals carrying the
    same variant differ?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Hepatic Glycogenolysis
  - pathophysiology#Hepatocellular Injury and Progressive Liver Fibrosis
  rationale: >-
    Subtype assignment carries real prognostic weight at the group level —
    PHKG2 confers the fibrosis and cirrhosis risk, PHKB is mildest — yet it does
    not predict an individual course. A 52-patient European cohort found no
    clear genotype-phenotype correlation, and the ACMG resource states plainly
    that the basis of the clinical variation is not understood. The one
    relationship that did hold in that cohort was genotype to residual enzyme
    activity, not genotype to clinical severity, which suggests the determinants
    of hepatic outcome lie downstream of enzyme activity.
  proposed_experiments:
  - experiment_id: exp_gsd9_hepatic_outcome_modifiers
    name: Prospective genotype-stratified hepatic outcome cohort in GSD IX
    description: >-
      Follow a molecularly confirmed GSD IX cohort with standardised, serial
      non-invasive fibrosis assessment (elastography plus serum panels), residual
      PhK activity where available, and recorded dietary adherence, and test
      whether variant class, residual activity, or metabolic control predicts
      progression to fibrosis independently of subtype.
  evidence:
  - reference: PMID:41732189
    reference_title: "Glycogen storage disease type IX: Long-term follow-up of 52 patients from three European countries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Severe hypoglycemic episodes were uncommon, and no clear genotype-phenotype correlation emerged.
    explanation: Establishes the absence of a genotype-phenotype correlation in the largest modern cohort.
  - reference: PMID:30659246
    reference_title: "Diagnosis and management of glycogen storage diseases type VI and IX: a clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The basis of this clinical variation is not well understood
    explanation: The guideline's own statement that the source of clinical variability is unexplained.
- discussion_id: gap_gsd9_diet_prevents_hepatic_complications
  prompt: >-
    Do uncooked cornstarch and a high-protein diet prevent the long-term hepatic
    complications of GSD IX, or only the acute metabolic ones?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Hepatocellular Injury and Progressive Liver Fibrosis
  rationale: >-
    Nutritional therapy has demonstrated effects on the acute axis: in the
    52-patient cohort it improved growth and reduced fasting hypoglycaemia
    episodes. Its effect on the hepatic axis is unproven, and the same cohort
    reported that hepatomegaly frequently persisted despite intervention. The
    natural-history study that first documented fibrosis in this group named
    this explicitly as an unanswered question. The distinction matters because
    hepatic complications are now the main long-term risk, and the treatments
    curated here are all justified against the acute axis.
  proposed_experiments:
  - experiment_id: exp_gsd9_diet_fibrosis_endpoint
    name: Nutritional therapy trial with a hepatic fibrosis endpoint
    description: >-
      Run a multicentre prospective study of standardised cornstarch plus
      high-protein therapy in GSD IX using serial liver elastography and imaging
      as the primary endpoint rather than glucose and ketone control, powered to
      detect a difference in fibrosis progression.
  evidence:
  - reference: PMID:25266922
    reference_title: "The natural history of glycogen storage disease types VI and IX: Long-term outcome from the largest metabolic center in Canada."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is a need for future studies if uncooked cornstarch and high protein
      diet would be able to prevent long-term complications of GSD-VI and -IX.
    explanation: The authors state this gap directly.
  - reference: PMID:41732189
    reference_title: "Glycogen storage disease type IX: Long-term follow-up of 52 patients from three European countries."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      fewer documented fasting hypoglycemia episodes (20/44 vs 9/44; p = 0.012),
      although hepatomegaly frequently persisted
    explanation: >-
      Shows the split: the acute metabolic axis responded to nutritional therapy
      while the hepatic axis did not fully resolve.

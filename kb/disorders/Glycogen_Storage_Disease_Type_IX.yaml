- name: Hepatocellular Injury and Progressive Liver Fibrosis
  biological_scale: TISSUE
  description: >-
    Chronic hepatocellular stress raises transaminases and, in a substantial
    minority, progresses through steatosis and fibrosis to cirrhosis. The risk
    is not uniform across the subtypes: it is concentrated in PHKG2-related
    disease, where cirrhosis may appear in the first years of life.
  cell_types:
  - preferred_term: Hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:41732189
    reference_title: "Glycogen storage disease type IX: Long-term follow-up of 52 patients from three European countries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Liver biopsies showed steatosis, fibrosis, and/or chronic hepatitis in 52% of examined cases.
    explanation: Quantifies histological liver involvement in a modern cohort.
  - reference: PMID:30659246
    reference_title: "Diagnosis and management of glycogen storage diseases type VI and IX: a clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pathogenic variants in the PHKG2 gene are associated with more severe
      clinical and biochemical abnormalities including increased risk for liver
      fibrosis and cirrhosis.
    explanation: Assigns the elevated fibrosis and cirrhosis risk specifically to PHKG2.
  downstream:
  - target: Elevated hepatic transaminases
    description: Ongoing hepatocellular injury releases transaminases into serum.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41732189
      reference_title: "Glycogen storage disease type IX: Long-term follow-up of 52 patients from three European countries."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Predominant manifestations included hepatomegaly (82%), elevated
        aminotransferases (81%), hypertriglyceridemia (71%), hypercholesterolemia
        (67%), hypoglycemia (46%), hyperlactatemia (38%), and short stature (30%).
      explanation: Reports elevated aminotransferases in 81% of a 52-patient cohort.
  - target: Hepatic steatosis
    description: Steatosis is a common histological finding on liver biopsy.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41732189
      reference_title: "Glycogen storage disease type IX: Long-term follow-up of 52 patients from three European countries."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Liver biopsies showed steatosis, fibrosis, and/or chronic hepatitis in 52% of examined cases.
      explanation: Reports steatosis among the biopsy findings.
  - target: Hepatic fibrosis
    description: Sustained hepatocellular injury drives fibrogenesis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25266922
      reference_title: "The natural history of glycogen storage disease types VI and IX: Long-term outcome from the largest metabolic center in Canada."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We report for the first time likely liver adenoma on liver ultrasound and
        liver fibrosis on liver biopsy specimens in patients with GSD-VI and mild
        cardiomyopathy on echocardiography in patients with GSD-VI and -IXb.
      explanation: Reports biopsy-proven liver fibrosis in this patient group.
  - target: Cirrhosis
    description: >-
      Fibrosis can progress to cirrhosis, most often in PHKG2-related disease and
      occasionally within the first years of life.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - progressive hepatic fibrosis with architectural remodelling
    evidence:
    - reference: PMID:30659246
      reference_title: "Diagnosis and management of glycogen storage diseases type VI and IX: a clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Liver cirrhosis can develop as early as the first few years of life.
      explanation: Records the early-childhood timing of cirrhosis in the severe subtype.
    - reference: PMID:9384616
      reference_title: "Liver glycogenosis due to phosphorylase kinase deficiency: PHKG2 gene structure and mutations associated with cirrhosis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        As liver Phk deficiency is generally a benign condition and progression to
        cirrhosis is very rare, this finding suggests that PHKG2 mutations are
        associated with an increased cirrhosis risk.
      explanation: >-
        Kept as PARTIAL: it establishes the PHKG2 cirrhosis association while
        stating that progression to cirrhosis is very rare overall, so this edge
        must not be read as a general outcome of GSD IX.
- name: Impaired Skeletal Muscle Glycogenolysis
  biological_scale: CELLULAR
  description: >-
    In the muscle arm of the disease, PhK deficiency in skeletal muscle blocks
    activation of muscle glycogen phosphorylase, so muscle cannot mobilise its
    own glycogen during exertion. This arm is much rarer than the hepatic forms
    and is caused chiefly by PHKA1 variants. Note that PHKB variants also reduce
    muscle PhK activity, yet muscle symptoms in PHKB-related disease are
    typically mild or absent, so reduced muscle enzyme activity and clinical
    myopathy are not equivalent here.
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: glycogen catabolic process
    term:
      id: GO:0005980
      label: glycogen catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:7874115
    reference_title: Human muscle glycogenosis due to phosphorylase kinase deficiency associated with a nonsense mutation in the muscle isoform of the alpha subunit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the present study, we have investigated a case of muscle-specific,
      adult-onset Phk deficiency.
    explanation: >-
      The first molecularly characterised human case of isolated muscle
      phosphorylase kinase deficiency.
  - reference: PMID:30659246
    reference_title: "Diagnosis and management of glycogen storage diseases type VI and IX: a clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      PHKB-related GSD IX is characterized by deficiency of PhK activity in muscle
      in addition to liver, but this subtype cannot be distinguished from other
      liver GSD IX subtypes based on clinical symptoms alone.
    explanation: >-
      Supports muscle enzyme deficiency in PHKB-related disease while recording
      that it does not produce a clinically distinguishable myopathy.
  downstream:
  - target: Exercise intolerance
    description: Muscle unable to mobilise glycogen fatigues on exertion.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21634085
      reference_title: Phosphorylase Kinase Deficiency.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        muscle PhK deficiency, which is considerably rarer (characterized by any
        of the following: exercise intolerance, myalgia, muscle cramps,
        myoglobinuria, and progressive muscle weakness)
      explanation: Lists exercise intolerance among the defining features of muscle PhK deficiency.
  - target: Muscle cramps
    description: Exertional energy failure in glycogen-dependent fibres produces cramping.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21634085
      reference_title: Phosphorylase Kinase Deficiency.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        muscle PhK deficiency, which is considerably rarer (characterized by any
        of the following: exercise intolerance, myalgia, muscle cramps,
        myoglobinuria, and progressive muscle weakness)
      explanation: Lists muscle cramps among the defining features of muscle PhK deficiency.
  - target: Myoglobinuria
    description: Exertional muscle-fibre injury releases myoglobin into the urine.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - exertional muscle-fibre injury releasing myoglobin into the circulation
    evidence:

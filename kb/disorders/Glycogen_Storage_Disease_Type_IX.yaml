biochemical:
- name: Aberrant Apolipoprotein C-III Glycosylation
  biomarker_term:
    preferred_term: apolipoprotein C-III sialylation pattern
    term:
      id: NCIT:C117099
      label: Apolipoprotein C-III
  presence: Present
  frequency: FREQUENT
  context: Isoelectric focusing of serum apolipoprotein C-III
  subtype: IXa1
  notes: >-
    A secondary, not primary, glycosylation defect: the O-glycan on
    apolipoprotein C-III is undersialylated (monosialo ApoC-III1 up, disialo
    ApoC-III2 down), which is the serum pattern a congenital disorder of
    glycosylation screen looks for. It is therefore a diagnostic trap as much as
    a marker — an abnormal ApoC-III isoform profile in a child with hepatomegaly
    does not establish a CDG. The cohort authors attribute it to reduced
    availability of nucleotide sugars for glycosylation rather than to a lesion
    in the glycosylation machinery itself, which places it downstream of the
    entry's carbohydrate-flux nodes.


    Frequency band. 31/39 = 79.5% sits one half-point below the VERY_FREQUENT
    floor, so FREQUENT is taken from the reported denominator rather than from
    the abstract's rounded "80%". The measurement was made only in males with
    GSD IXa, so `subtype: IXa1` records the population it was established in; it
    has not been shown for the PHKB, PHKG2 or PHKA1 subtypes.
  evidence:
  - reference: PMID:41732189
    reference_title: "Glycogen storage disease type IX: Long-term follow-up of 52 patients from three European countries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aberrant apolipoprotein C-III glycosylation, characterized by increased
      monosialoapolipoprotein C-III (ApoC-III1) and decreased
      disialoapolipoprotein C-III (ApoC-III2), was detected in 31 of 39 analyzed
      samples (79.5%) from 19 males with GSD IXa from 16 families
    explanation: >-
      States the direction of the isoform shift, the proportion affected, and
      the subtype and sex of the patients it was measured in.
  - reference: PMID:41732189
    reference_title: "Glycogen storage disease type IX: Long-term follow-up of 52 patients from three European countries."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We previously hypothesized that ApoC-III hypoglycosylation in GSD IX may
      result from reduced availability of nucleotide monosaccharides,
      particularly UDP-GalNAc, for glycosylation reactions
    explanation: >-
      PARTIAL because the UDP-GalNAc mechanism is the authors' stated hypothesis,
      not a measured result; it is recorded to keep the marker's secondary status
      explicit rather than implying a primary glycosylation lesion.

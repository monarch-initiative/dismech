- name: Subclinical Herpesvirus Viremia
  description: >-
    Epstein-Barr virus and cytomegalovirus are detectable at increased levels in
    blood, but without clinical manifestations. This node captures the single
    concept of the laboratory-only herpesvirus finding, and is a sibling of the
    skin disease rather than a step toward it.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:34242561
    reference_title: "Immunological lessons from CD28 deficiency in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These patients exhibit clinical symptoms due to human papillomavirus-2 and
      -4 infections, show increased levels of Epstein-Barr virus and
      cytomegalovirus in the blood, and respond poorly to vaccines.
    explanation: >-
      Records the herpesvirus viremia alongside the vaccine finding and the
      clinically symptomatic HPV disease.
  - reference: PMID:34214472
    reference_title: "Humans with inherited T cell CD28 deficiency are susceptible to skin papillomaviruses but are otherwise healthy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surprisingly, human CD28-dependent T cell responses are largely redundant
      for protective immunity.
    explanation: >-
      The conclusion that keeps this node a laboratory finding rather than a
      disease manifestation: outside the skin, CD28-dependent responses turn out
      to be dispensable.
  - reference: PMID:34843682
    reference_title: "Recalcitrant Warts, Epidermodysplasia Verruciformis, and the Tree-Man Syndrome: Phenotypic Spectrum of Cutaneous Human Papillomavirus Infections at the Intersection of Genetic Variability of Viral and Human Genomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the patients with CD28 deficiency, besides the cutaneous HPV infection, were otherwise healthy, indicating that human CD28 is largely dispensable for protective immunity against other pathogens."
    explanation: >-
      States directly that the patients are otherwise healthy, which is what makes
      the herpesvirus viremia a laboratory finding rather than an infection.
- name: Reduced Antibody Response to Vaccination
  description: >-
    The antibody response to vaccination is variably decreased, in patients who

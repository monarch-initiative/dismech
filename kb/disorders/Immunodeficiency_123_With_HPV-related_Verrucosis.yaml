name: Immunodeficiency 123 With HPV-related Verrucosis
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: immunodeficiency 123 with HPV-related verrucosis
  term:
    id: MONDO:0971177
    label: immunodeficiency 123 with HPV-related verrucosis
synonyms:
- IMD123
- immunodeficiency-123 with HPV-related verrucosis
- CD28 deficiency
- inherited T cell CD28 deficiency
description: >-
  Immunodeficiency 123 (IMD123) is autosomal recessive human CD28 deficiency. It
  is defined by one homozygous missense variant in one extended consanguineous
  family - three affected individuals, one of whom has the HPV-2-driven
  "tree-man" phenotype of giant cutaneous horns and two of whom have unusually
  severe HPV-4-driven warts.

  What makes the entry worth curating is not the rarity but the negative result.
  CD28 is the canonical second signal of T cell activation, the co-stimulatory
  receptor that, engaged by CD80 or CD86 on antigen-presenting cells, amplifies
  T cell receptor signalling. Textbook immunology predicts that losing it should
  produce a broad combined immunodeficiency. It does not. T cell development is
  barely affected, and the patients are susceptible to skin papillomaviruses and
  are otherwise healthy - they carry Epstein-Barr virus and cytomegalovirus in the
  blood without becoming ill from either. (The OMIM clinical description adds that
  peripheral blood leukocytes and immunoglobulins are essentially normal. That is
  recorded in the entry `notes:` rather than as a claim here, because OMIM is not
  a citable reference type in this repository and the statement therefore cannot
  carry a verifiable snippet.) So the disease-defining claim of this entry is a claim about
  redundancy: CD28 co-stimulation is required to control HPV-2 and HPV-4 in
  keratinocytes and is largely dispensable for protective immunity generally.

  The pathograph therefore runs from biallelic CD28 loss of function through
  absent surface CD28 and failed co-stimulation to a specific hole in the CD4+
  T cell response against these papillomaviruses, and from there to uncontrolled
  viral replication in keratinocytes and the wart phenotype. Two things are
  deliberately kept off that main chain. Subclinical EBV and CMV viremia and the
  reduced vaccine antibody response are curated as separate consequences of the
  co-stimulation defect rather than as steps toward the skin disease, because
  they are laboratory findings that do not produce illness in these patients.
  And the antibody arm is a genuine dissociation rather than an omission: the
  patients have no detectable HPV-2- or HPV-4-reactive CD4+ T cells in vitro yet
  make antibodies against both viruses in vivo.

  Two further caveats are recorded rather than resolved. The HPV-2 lesions are
  described as a multifocal benign epithelial tumour overexpressing viral
  oncogenes in the epidermal basal layer, but the viral types involved are
  low-risk and whether tree-man lesions have malignant potential is explicitly
  unknown, so this entry does not declare conformance to the viral-oncogenesis
  module. And the CD28-knockout mouse is susceptible to mouse papillomavirus but
  its warts regress spontaneously, which is the opposite of the chronic human
  course.
parents:
- Inborn error of immunity
- Primary immunodeficiency

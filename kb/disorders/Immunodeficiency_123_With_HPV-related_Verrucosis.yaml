- name: HPV-2-Driven Tree-Man Phenotype
  description: >-
    In one patient the HPV-2 infection progressed to the "tree-man" phenotype:
    giant cutaneous horns forming a multifocal benign epithelial tumour that
    overexpresses viral oncogenes in the epidermal basal layer. This node captures
    the single concept of the tree-man outcome. It is deliberately not linked to
    the viral-oncogenesis module - the lesion is benign, the viral types are
    low-risk, and whether such lesions carry malignant potential is explicitly
    unresolved in the literature.

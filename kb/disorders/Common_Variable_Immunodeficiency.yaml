    modifier: DECREASED
    term:
      id: GO:0033209
      label: tumor necrosis factor-mediated signaling pathway
  evidence:
  - reference: PMID:19666484
    reference_title: "B-cell activating factor receptor deficiency is associated with an adult-onset antibody deficiency syndrome in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Without BAFF-R, B-cell development is arrested at the stage of transitional B cells and the numbers of all subsequent B-cell stages are severely reduced.
    explanation: >-
      The developmental consequence of losing this signalling axis in humans,
      and the direct basis for the downstream edge below.
  - reference: PMID:16007086
    reference_title: "TACI is mutant in common variable immunodeficiency and IgA deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that 4 of 19 unrelated individuals with common variable immunodeficiency (CVID) and 1 of 16 individuals with IgA deficiency (IgAD) had a missense mutation in one allele of TNFRSF13B (encoding TACI).
    explanation: >-
      Places TACI on this node, in the heterozygous form in which it is usually
      found - which is why the gene is typed as susceptibility in this entry.
  downstream:
  - target: Defective B Cell Differentiation and Class-Switch Recombination
    causal_link_type: DIRECT
    description: >-
      Loss of BAFF/APRIL survival and costimulatory signalling arrests B-cell
      maturation before the switched memory and plasma-cell stages.
- name: NF-kB Pathway Signaling Deficiency
  biological_scale: MOLECULAR
  description: >-
    Two CVID subtypes sit on the two arms of NF-kB signalling. NFKB1
    haploinsufficiency reduces the canonical p50 subunit and is reported as the
    commonest monogenic cause of CVID in Europeans; NFKB2 C-terminal truncating
    variants leave the non-canonical precursor p100 unprocessable, so the
    mature p52 subunit is not made. The two are grouped on one node because
    both converge on impaired B-cell differentiation, and separated in the
    bound processes because the pathways themselves are distinct.

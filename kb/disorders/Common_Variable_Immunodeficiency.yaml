      label: immunodeficiency, common variable, 2
  genes:
  - preferred_term: TNFRSF13B
    term:
      id: hgnc:18153
      label: TNFRSF13B
  description: >-
    The TACI form, and the one that most resists a simple subtype reading. The
    common heterozygous alleles C104R and A181E occur in healthy relatives and
    in the general population and are modelled in this entry as susceptibility,
    while ClinGen's Definitive classification for this MONDO term is recorded
    against biallelic, autosomal recessive genotypes.
  evidence:
  - reference: PMID:16007086
    reference_title: "TACI is mutant in common variable immunodeficiency and IgA deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that 4 of 19 unrelated individuals with common variable immunodeficiency (CVID) and 1 of 16 individuals with IgA deficiency (IgAD) had a missense mutation in one allele of TNFRSF13B (encoding TACI).
    explanation: >-
      The original cohort finding behind this subtype, and the reason the
      dismech typing is susceptibility: the reported variants are heterozygous.

- name: Early B Cell Lymphopoiesis Failure
  biological_scale: CELLULAR
  description: >-
    A lesion upstream of, and distinct from, the germinal-centre failure the
    node above describes. IKAROS is a lymphoid transcription factor, and the six
    reported mutations all fall in its DNA-binding domain, producing a
    progressive loss of circulating B cells with markedly reduced early B-cell
    precursors in marrow. Plasma cells were still present
    in the marrow of the reported patients, which is why this is modelled as its
    own node rather than added to the differentiation-and-class-switch node: the
    hypogammaglobulinemia follows from having too few B cells rather than from
    B cells that cannot finish differentiating.
  genes:
  - preferred_term: IKZF1
    term:
      id: hgnc:13176
      label: IKZF1
  cell_types:
  - preferred_term: precursor B cell
    term:
      id: CL:0000817
      label: precursor B cell
  biological_processes:
  - preferred_term: B cell differentiation
    modifier: DECREASED
    term:
      id: GO:0030183
      label: B cell differentiation
  evidence:
  - reference: PMID:26981933
    reference_title: Loss of B Cells in Patients with Heterozygous Mutations in IKAROS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous mutations in the transcription factor IKAROS caused an autosomal dominant form of CVID that is associated with a striking decrease in B-cell numbers.
    explanation: >-
      The conclusion of the 29-person, six-family series: the CVID phenotype
      attributable to IKZF1 is defined by loss of B cells, which is what this
      node asserts.
  - reference: PMID:26981933
    reference_title: Loss of B Cells in Patients with Heterozygous Mutations in IKAROS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bone marrow aspirates in two patients had markedly decreased early B-cell precursors, but plasma cells were present.
    explanation: >-
      The marrow finding that locates the lesion at early B-cell development
      rather than at plasma-cell differentiation, and so the reason this is a
      separate node.
  - reference: PMID:26981933
    reference_title: Loss of B Cells in Patients with Heterozygous Mutations in IKAROS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Studies in family members showed progressive loss of B cells and serum immunoglobulins.
    explanation: >-
      Pairs the B-cell loss with the fall in serum immunoglobulins, which is the

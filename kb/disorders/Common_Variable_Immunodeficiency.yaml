- name: BAFF-R (TNFRSF13C) Mutations
  association: Predisposing
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: TNFRSF13C
    term:
      id: hgnc:17755
      label: TNFRSF13C
  notes: >-
    Biallelic TNFRSF13C (BAFF-R) deficiency was identified by screening a CVID
    cohort and arrests B-cell development at the transitional stage, but the
    original siblings show a characteristic immunological phenotype without
    obligate clinical immunodeficiency (only one of the two had recurrent
    infections). Typed as SUSCEPTIBILITY rather than CAUSATIVE for that reason:
    the reduced penetrance means the gene-disease relationship does not reach
    the strength the previous `CAUSATIVE` typing implied.
  evidence:
  - reference: PMID:19666484
    reference_title: "B-cell activating factor receptor deficiency is associated with an adult-onset antibody deficiency syndrome in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analyzing BAFF-R expression and BAFF-binding to B cells in common variable immunodeficiency (CVID) patients, we identified two siblings carrying a homozygous deletion in the BAFF-R gene."
    explanation: >-
      Establishes the gene-disease link: biallelic TNFRSF13C deletion was found
      by screening a CVID patient cohort, with arrest of B-cell development at
      the transitional B-cell stage and reduced IgG and IgM.
  - reference: PMID:19666484
    reference_title: "B-cell activating factor receptor deficiency is associated with an adult-onset antibody deficiency syndrome in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, deletion of the BAFF-R gene in humans causes a characteristic immunological phenotype but it does not necessarily lead to a clinically manifest immunodeficiency."
    explanation: >-
      Supports the SUSCEPTIBILITY rather than CAUSATIVE typing. The authors
      explicitly state that BAFF-R deletion does not necessarily produce
      clinically manifest immunodeficiency, so this locus predisposes to the
      CVID phenotype rather than determining it.

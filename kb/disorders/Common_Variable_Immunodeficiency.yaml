treatments:
- name: Immunoglobulin Replacement Therapy
  description: >-
    Lifelong intravenous (IVIG) or subcutaneous (SCIG) immunoglobulin
    replacement is the cornerstone of CVID treatment, reducing the frequency
    and severity of infections. It does not address the non-infectious
    (autoimmune, granulomatous, lymphoproliferative) manifestations, which now
    pose the greatest therapeutic challenge.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Defective B Cell Differentiation and Class-Switch Recombination
    treatment_effect: BYPASSES
    description: >-
      Passive polyclonal IgG substitutes for the antibody the defective B-cell
      compartment cannot make; it bypasses rather than corrects the underlying
      differentiation defect, which is why non-infectious complications
      persist on treatment.
  evidence:
  - reference: DOI:10.3390/jcm13061717
    reference_title: "The Scope and Impact of Viral Infections in Common Variable Immunodeficiency (CVID) and CVID-like Disorders: A Literature Review"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It assesses the efficacy of prophylactic measures for COVID-19, including
      vaccination and immunoglobulin replacement therapy, as well as trialled
      therapies.
    explanation: >-
      Establishes that immunoglobulin replacement is used in CVID, but only in
      the narrow context of COVID-19 prophylaxis. It does NOT support the
      broader claim that lifelong IgG replacement is the cornerstone of CVID
      management, for which this item was previously cited as SUPPORT; that
      claim is carried by the general CVID review below.
  - reference: PMID:41045774
    reference_title: "Common variable immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infections usually improve significantly after the initiation of immunoglobulin replacement therapy and other preventive measures, with non-infectious manifestations now posing the greatest therapeutic challenge."
    explanation: >-
      A general CVID review carrying the core management claim: initiating
      immunoglobulin replacement significantly improves the infectious burden,
      which is why it is the cornerstone of CVID treatment. The review also
      frames the residual therapeutic problem as the non-infectious
      manifestations, i.e. those that IgG replacement does not address.
- name: Antibiotic Prophylaxis and Treatment
  description: >-
    Prophylactic and therapeutic antibiotics are used to manage recurrent
    bacterial infections, particularly sinopulmonary infections.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
- name: Immunosuppressive Therapy for Autoimmune Complications
  description: >-
    Corticosteroids, rituximab, and other immunosuppressants are used
    to manage autoimmune cytopenias and granulomatous disease. Treatment
    selection is increasingly aligned to biological mechanisms: rituximab
    for B cell hyperplasia and sirolimus for mTOR/Th1 programs.
  treatment_term:
    preferred_term: immunosuppressive therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: DOI:10.1097/aci.0000000000001032
    reference_title: "The biological basis for current treatment strategies for granulomatous disease in common variable immunodeficiency"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therapeutic regimens include glucocorticoids, DMARDs, and biologicals
      like rituximab.
    explanation: >-
      Confirms the use of glucocorticoids, DMARDs, and rituximab for
      granulomatous disease in CVID.
- name: Abatacept
  description: >-
    Abatacept is a CTLA-4-Ig fusion protein used as targeted immunomodulation
    for CVID subsets with CTLA4/LRBA-driven immune dysregulation, particularly
    enteropathy, autoimmunity, and GLILD.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: abatacept
      term:
        id: NCIT:C28898
        label: Abatacept
  evidence:
  - reference: DOI:10.1097/aci.0000000000000947
    reference_title: "Monogenic forms of common variable immunodeficiency and implications on target therapeutic approaches"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abatacept, a soluble cytotoxic T lymphocyte antigen 4 (CTLA-4) fusion
      protein that acts as a costimulation modulator, has been widely
      implemented for affected patients with good results as bridge treatment.
    explanation: >-
      Supports abatacept as a mechanistically targeted therapy for
      CTLA4/LRBA-associated CVID-like immune dysregulation.
diagnosis:
- name: Quantitative immunoglobulins with functional antibody assessment (ESID criteria)
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Per the ESID registry criteria, the laboratory diagnosis requires low IgG
    together with low IgA or IgM, plus at least one of a poor antibody
    response to vaccines or low switched memory B cells. The diagnosis can be
    made after the fourth year of life, although symptoms may begin earlier.
    Secondary causes of hypogammaglobulinemia must be excluded.
  markers: Serum IgG, IgA, IgM; vaccine antibody responses; switched memory B cells
  results: Low IgG with low IgA or IgM, plus impaired vaccine response or low switched memory B cells
  evidence:
  - reference: PMID:40079712
    reference_title: "Monogenic Common Variable Immunodeficiency (Mo-CVID) Score for Optimizing the Genetic Diagnosis in Pediatric CVID Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      laboratory criteria are low IgG and IgA or IgM and at least one between poor
      antibody vaccine response or low switched memory B cells
    explanation: >-
      States the ESID registry laboratory criteria recorded in this item.
  - reference: PMID:40079712
    reference_title: "Monogenic Common Variable Immunodeficiency (Mo-CVID) Score for Optimizing the Genetic Diagnosis in Pediatric CVID Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of CVID can be made after the 4th year of life
    explanation: >-
      Supports the minimum-age criterion for the CVID diagnosis.
- name: Genetic testing for monogenic causes
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Exome-based genetic testing identifies a monogenic cause in a minority of
    CVID patients (2-30% across cohorts, enriched in early-onset, familial,
    autoimmune and lymphoproliferative presentations). A genetic diagnosis
    reclassifies the patient — often to an IEI in a different IUIS table —
    and carries prognostic, therapeutic, and genetic-counseling implications.
  results: Monogenic cause identified in a minority; reclassification when found
  evidence:
  - reference: PMID:40079712
    reference_title: "Monogenic Common Variable Immunodeficiency (Mo-CVID) Score for Optimizing the Genetic Diagnosis in Pediatric CVID Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      allowing the identification of monogenic genetic variants from 2% to 30%
      of CVID patients in different cohorts
    explanation: >-
      Quantifies the monogenic yield of genetic testing across CVID cohorts.
  - reference: PMID:41045774
    reference_title: "Common variable immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identifying a genetic cause allows for the reclassification of
      patients, it has prognostic and therapeutic implications, and enables genetic
      counseling for family members.
    explanation: >-
      States the clinical consequences of finding a genetic cause.
  - reference: PMID:40079712
    reference_title: "Monogenic Common Variable Immunodeficiency (Mo-CVID) Score for Optimizing the Genetic Diagnosis in Pediatric CVID Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The evaluation of a patient with suspected IEIs is neither complete nor
      accurate without the inclusion of genetic testing.
    explanation: >-
      Supports genetic testing as a standard component of the CVID diagnostic
      work-up.
- name: Multidisciplinary organ assessment and diagnostic delay
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Because CVID affects multiple organ systems, patients should undergo
    extensive immunological evaluation and regular multi-organ assessment by
    multidisciplinary immunodeficiency teams. Diagnosis is typically delayed
    by years after symptom onset — a median of 9 years in a nationwide Greek
    antibody-deficiency cohort.
  evidence:
  - reference: PMID:41045774
    reference_title: "Common variable immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with CVID should undergo extensive
      immunological evaluations and regular assessment of the multiple organs that may
      be affected, ideally by multidisciplinary teams specialized in
      immunodeficiencies.
    explanation: >-
      The review's recommendation for multidisciplinary organ surveillance.
  - reference: PMID:38792965
    reference_title: "A Nationwide Study of the Delayed Diagnosis and the Clinical Manifestations of Predominantly Antibody Deficiencies and CTLA4-Mediated Immune Dysregulation Syndrome in Greece."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrated a remarkable delay
      in PAD diagnosis, several years after the onset of related symptoms (median: 9.0
      years, range: 0-43.0).
    explanation: >-
      Quantifies the diagnostic delay in a predominantly-CVID national cohort.
progression:
- phase: Onset and diagnosis, typically in adulthood
  age_range: Most diagnoses in the second to fourth decade; pediatric onset occurs
  notes: >-
    Recurrent infection is the usual presenting problem. In the New York
    cohort, males were diagnosed at a median age of 30 years and females at
    33.5 years.
  evidence:
  - reference: PMID:22180439
    reference_title: "Morbidity and mortality in common variable immune deficiency over 4 decades."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Males were diagnosed earlier (median age, 30 years) than females (median age,
      33.5 years
    explanation: >-
      Cohort medians for age at diagnosis.
- phase: Chronic course dominated by non-infectious complications
  notes: >-
    On immunoglobulin replacement the infectious burden falls substantially,
    and the long-term course is instead shaped by the non-infectious
    complications — autoimmunity, chronic lung disease and bronchiectasis,
    gastrointestinal inflammatory disease, granulomatous disease, liver
    disease, and lymphoid malignancy — which develop in about two-thirds of
    patients and drive most mortality.
  evidence:
  - reference: PMID:22180439
    reference_title: "Morbidity and mortality in common variable immune deficiency over 4 decades."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ninety-four percent of patients had a history of infections; 68% also had
      noninfectious complications
    explanation: >-
      Two-thirds of the cohort developed non-infectious complications.
  - reference: PMID:41045774
    reference_title: "Common variable immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infections usually improve significantly after the
      initiation of immunoglobulin replacement therapy and other preventive measures,
      with non-infectious manifestations now posing the greatest therapeutic
      challenge.
    explanation: >-
      Frames the treated disease course: infections controlled, non-infectious
      manifestations dominant.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Lifelong immunoglobulin replacement with multidisciplinary organ
    surveillance is required, and survival remains significantly reduced:
    19.6% of the four-decade New York cohort died, with an 11-fold higher risk
    of death in the majority subgroup with non-infectious complications.
    Mortality is driven by lymphoma, hepatitis, structural or functional lung
    impairment, and gastrointestinal disease rather than by acute infection.
  evidence:
  - reference: PMID:22180439
    reference_title: "Morbidity and mortality in common variable immune deficiency over 4 decades."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      19.6% of patients died, a significantly shorter survival than age- and
      sex-matched population controls
    explanation: >-
      Documents the reduced survival relative to population controls.
  - reference: PMID:22180439
    reference_title: "Morbidity and mortality in common variable immune deficiency over 4 decades."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The risk of death was 11 times higher for patients with noninfectious
      complications
    explanation: >-
      Identifies non-infectious complications as the dominant mortality
      driver, the basis for the HIGH burden level.
differential_diagnoses:
- name: Congenital agammaglobulinemia (XLA and autosomal forms)
  description: >-
    The agammaglobulinemias share hypogammaglobulinemia and recurrent
    sinopulmonary infection, but the developmental block leaves essentially no
    circulating B cells, whereas B cells are present in CVID. Curated
    separately in dismech as X-linked_Agammaglobulinemia and
    Autosomal_Agammaglobulinemia.
  disease_term:
    preferred_term: agammaglobulinemia
    term:
      id: MONDO:0015977
      label: agammaglobulinemia
  distinguishing_features:
  - CD19+ B cells are absent or below 1-2% of lymphocytes, versus present (usually normal numbers) in CVID
  - Onset in infancy after maternal IgG wanes, versus typical adult diagnosis in CVID
  - IgM is absent along with IgG and IgA, and a causative single-gene variant (BTK or a pre-BCR gene) is identifiable
- name: Secondary hypogammaglobulinemia
  description: >-
    Hypogammaglobulinemia acquired from B-cell-depleting therapy (rituximab
    and other anti-CD20 agents), other immunosuppressants, protein loss, or
    lymphoid malignancy can reproduce the CVID laboratory phenotype and must
    be excluded before CVID is diagnosed.
  distinguishing_features:
  - History of B-cell depletion immunotherapy, immunosuppression, protein-losing state, or hematologic malignancy
  - Onset after a documented period of normal immunoglobulin levels
  - No requirement for a primary immune defect; immunoglobulins may recover after the cause is removed
  evidence:
  - reference: PMID:38792965
    reference_title: "A Nationwide Study of the Delayed Diagnosis and the Clinical Manifestations of Predominantly Antibody Deficiencies and CTLA4-Mediated Immune Dysregulation Syndrome in Greece."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      12 patients with "secondary" hypogammaglobulinemia due to a previous
      B-cell depletion immunotherapy for autoimmune or malignant disease several
      years ago
    explanation: >-
      The Greek nationwide cohort separated a secondary-hypogammaglobulinemia
      group with a typical CVID phenotype from true CVID, demonstrating the
      need for this exclusion.
- name: Monogenic inborn errors of immunity presenting as CVID
  description: >-
    Genetic work-up reassigns a subset of clinically diagnosed CVID patients
    to distinct IEIs classified in other IUIS tables — for example activated
    PI3K-delta syndrome, LRBA deficiency, and CTLA4 haploinsufficiency — with
    different prognoses and targeted treatments. See also the
    cvid_umbrella_cuts_across_the_iuis_tables discussion in the
    Predominantly Antibody Deficiencies IEIs grouping.
  distinguishing_features:
  - Early onset, positive family history, marked autoimmunity or lymphoproliferation raise the prior for a monogenic cause
  - A pathogenic variant in a non-CVID IUIS gene reclassifies the diagnosis
  - Targeted therapy may be available (e.g. abatacept for CTLA4/LRBA disease, PI3K-delta inhibitors for APDS)
  evidence:
  - reference: PMID:40079712
    reference_title: "Monogenic Common Variable Immunodeficiency (Mo-CVID) Score for Optimizing the Genetic Diagnosis in Pediatric CVID Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This discovery led us to consider a possible metamorphosis of CVID, which,
      once studied from a genetic perspective, actually reveals very different IEIs.
    explanation: >-
      States that genetically resolved CVID frequently proves to be a
      different IEI, the premise of this differential.
datasets:
- accession: geo:GSE299706
  title: Transcriptome regulation in T-cells and monocytes in patients with Common Variable Immunodeficiency
  description: A large subgroup of Common Variable Immunodeficiency (CVID) patients has autoimmune and inflammatory complications, associated with T cell and monocyte pathology, but the molecular mechanism for this CVID-subgroup is still elusive. To identify novel molecular pathways impacted in CVID T cells and monocytes, we examined the transcriptomic profiles in these cells from healthy control and the CVID patients in the subgroup with inflammatory complications.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 20
  publication: PMID:41991796
  notes: Identified by GEO DataSets index search for Common Variable Immunodeficiency (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE330223
  title: Convergence of cytokine dysregulation and antibody deficiency in common variable immunodeficiency with inflammatory complications
  description: 'Background: Noninfectious complications are the greatest cause of morbidity and mortality in common variable immunodeficiency (CVID), but their pathogenesis remains poorly defined. Objective: Using high-throughput approaches, we aimed to identify, correlate, and determine the significance of immunologic features of CVID with noninfectious complications (CVIDc). Methods: We simultaneously applied proteomics, RNA sequencing, and mass cytometry to a large cohort with primary antibody deficiency. Results: CVIDc is differentiated from uncomplicated CVID, other forms of primary antibody deficiency, and healthy controls by a distinct plasma proteomic profile.'

    reference_title: Early-onset inflammatory bowel disease and common variable immunodeficiency-like disease caused by IL-21 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deficiency of IL-21 resulted in reduced numbers of circulating CD19(+) B cells, including IgM(+) naive and class-switched IgG memory B cells, with a concomitant increase in transitional B-cell numbers.
    explanation: >-
      The B-cell consequence of losing this T-cell-derived signal, and the basis
      for the downstream edge below.
  downstream:
  - target: Defective B Cell Differentiation and Class-Switch Recombination
    causal_link_type: DIRECT
    description: >-
      Loss of follicular helper T-cell signalling - ICOS costimulation or IL-21
      - leaves B cells without the help that germinal-centre differentiation and
      class switching require. In both the ICOS-deficient and IL21-deficient
      patients, switched memory B cells were reduced while T-cell subsets were
      preserved.
- name: Immune Dysregulation and Autoimmunity
  description: >-
    Approximately 25-50% of CVID patients develop autoimmune complications,
    most commonly autoimmune cytopenias (immune thrombocytopenia and autoimmune
    hemolytic anemia). This reflects a breakdown of peripheral tolerance and
    defective regulatory T cell function, particularly through the CTLA-4/LRBA
    checkpoint axis. Expansion of autoreactive CD21low B cells contributes
    to antibody-mediated autoimmunity. IKZF1 (IKAROS) is bound here as a second
    placement, not as its primary mechanism: its CVID lesion is the loss of the
    B-cell compartment modelled on the Early B Cell Lymphopoiesis Failure node,
    and it appears again here because autoimmune cytopenias are a recurrent part
    of the IKAROS phenotype rather than an incidental feature of one case.
  genes:

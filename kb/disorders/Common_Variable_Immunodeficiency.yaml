      label: immune response
  evidence:
  - reference: PMID:25213377
    reference_title: "Immune dysregulation in human subjects with heterozygous germline mutations in CTLA4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      human CTLA4 haploinsufficiency caused dysregulation of FoxP3(+) regulatory
      T (Treg) cells, hyperactivation of effector T cells, and lymphocytic
      infiltration of target organs. Patients also exhibited progressive loss of
      circulating B cells, associated with an increase of predominantly
      autoreactive CD21(lo) B cells and accumulation of B cells in nonlymphoid
      organs.
    explanation: >-
      Shows that CTLA4 haploinsufficiency, found in a subset of CVID patients,
      causes Treg dysfunction, expansion of autoreactive CD21low B cells, and
      immune dysregulation, explaining autoimmune manifestations in CVID.
  - reference: DOI:10.1097/aci.0000000000000947
    reference_title: "Monogenic forms of common variable immunodeficiency and implications on target therapeutic approaches"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On the other hand, patients with defects in CTLA-4 or LRBA gene present
      with life-threatening immune dysregulation, autoimmunity and lymphocytic
      infiltration of multiple organs.
    explanation: >-
      Places LRBA alongside CTLA4 on this node: the two produce the same
      dysregulation and lymphocytic infiltration phenotype.
  - reference: PMID:33122583
    reference_title: "Common Variable Immunodeficiency, Autoimmune Hemolytic Anemia, and Pancytopenia Associated With a Defect in IKAROS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical features of a 3-month-old male infant who underwent hematopoietic stem cell transplantation because of an IKZF1 mutation-associated common variable immunodeficiency, AIHA, and pancytopenia are described.
    explanation: >-
      Places IKZF1 on this node: the reported CVID case carried autoimmune
      haemolytic anaemia, one of the autoimmune cytopenias this node explains.

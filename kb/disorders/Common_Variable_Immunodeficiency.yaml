has_subtypes:
- name: CVID1
  display_name: Common variable immunodeficiency 1 (ICOS)
  subtype_term:
    preferred_term: immunodeficiency, common variable, 1
    term:
      id: MONDO:0011864
      label: immunodeficiency, common variable, 1
  genes:
  - preferred_term: ICOS
    term:
      id: hgnc:5351
      label: ICOS
  description: >-
    Homozygous ICOS deletion. With CVID11 it is one of the two subtypes here
    whose primary lesion is in follicular helper T-cell function rather than in
    the B cell itself: loss of the inducible costimulator removes the T-cell
    signal that drives germinal-centre B-cell help, while T-cell subsets,
    activation, cytokine production and proliferation are preserved.
  evidence:
  - reference: PMID:12577056
    reference_title: "Homozygous loss of ICOS is associated with adult-onset common variable immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we found four of 32 patients to lack ICOS, the "inducible costimulator" on activated T cells, due to an inherited homozygous deletion in the ICOS gene.
    explanation: >-
      The four patients with homozygous ICOS deletion who define this subtype.
- name: CVID2
  display_name: Common variable immunodeficiency 2 (TNFRSF13B/TACI)
  subtype_term:
    preferred_term: immunodeficiency, common variable, 2
    term:

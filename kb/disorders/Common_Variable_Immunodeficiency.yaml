- name: B Cell Coreceptor Complex Failure
  biological_scale: MOLECULAR
  description: >-
    Three of the numbered CVID subtypes disable the same structure: the B-cell
    coreceptor complex of CD19, CD21 (CR2), CD81 and CD225, which lowers the
    activation threshold of the B-cell antigen receptor. CD19 carries the
    signalling function, CD81 is required for CD19 to reach the surface, and
    CD21 supplies the C3d costimulus. MS4A1 (CD20) is not a subunit of that
    complex; it is grouped on this node because ClinGen's assessment records
    that CD20 regulates signalling through the B-cell receptor, and because the
    reported patient's defect was in antibody formation rather than in B-cell
    development. Across these subtypes B-cell development is largely preserved
    and what fails is the response to antigen, which is why they present as
    CVID rather than as agammaglobulinemia.
  genes:
  - preferred_term: CD19
    term:
      id: hgnc:1633
      label: CD19
  - preferred_term: CD81

  - reference: PMID:16672701
    reference_title: An antibody-deficiency syndrome due to mutations in the CD19 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The CD19 protein forms a complex with CD21, CD81, and CD225 in the membrane of mature B cells. Together with the B-cell antigen receptor, this complex signals the B cell to decrease its threshold for activation by the antigen.
    explanation: >-
      Defines the complex this node is about and the function it serves. Taken
      from the study's background section rather than from its own results,
      hence the BACKGROUND quote role.
  - reference: PMID:16672701
    reference_title: An antibody-deficiency syndrome due to mutations in the CD19 gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The response of the patients' B cells to in vitro stimulation through the B-cell receptor was impaired
    explanation: >-
      The bound GO process measured directly: patient B cells stimulated through
      the B-cell receptor in culture respond poorly.
  - reference: PMID:16672701
    reference_title: An antibody-deficiency syndrome due to mutations in the CD19 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in all four patients, the antibody response to rabies vaccination was poor
    explanation: >-
      The clinical counterpart of the same defect in the same four patients,
      split from the in-vitro measurement so each item carries one evidence type.
  - reference: PMID:20237408
    reference_title: CD81 gene defect in humans disrupts CD19 complex formation and leads to antibody deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Retroviral transduction and glycosylation experiments on EBV-transformed B cells from the patient revealed that CD19 membrane expression critically depended on CD81.
    explanation: >-
      Places CD81 on this node: CD19 cannot reach the B-cell membrane without
      it, so the two genes disable one complex.
  - reference: PMID:20038800
    reference_title: CD20 deficiency in humans results in impaired T cell-independent antibody responses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Key evidence to support this conclusion was provided by the observation that although antigen-independent B cells developed normally in the absence of CD20 expression, antibody formation, particularly after vaccination with TI antigens, was strongly impaired in the patient.
    explanation: >-
      Places MS4A1 on this node, and states the limit on that placement: normal
      B-cell development with a defect confined to T cell-independent antibody
      formation.

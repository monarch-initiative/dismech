        autoimmune thrombocytopenia, pulmonary nodules, and cerebral infiltrative
        lesions.
      explanation: The CTLA4-haploinsufficiency CVID case documents autoimmune hemolytic anemia.
  - target: Autoimmune Thrombocytopenia

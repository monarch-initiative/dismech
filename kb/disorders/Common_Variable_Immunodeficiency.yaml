- name: BAFF/APRIL Receptor Signaling Deficiency
  biological_scale: MOLECULAR
  description: >-
    The TNF-family survival axis of the B-cell compartment, represented here by
    the two receptors BAFF-R (TNFRSF13C) and TACI (TNFRSF13B) and by the ligand
    TNFSF13, which MONDO names APRIL in the subtype term it defines. Loss of
    BAFF-R arrests B-cell development at the transitional stage; TACI variants
    were found in 4 of 19 unrelated CVID patients in the original report, in
    heterozygous form, and are modelled in this entry as risk alleles rather
    than determinants. TNFSF12 is deliberately not placed on this node: this
    entry has no source connecting it to either receptor, and grouping it here
    on family membership alone would assert a relationship it cannot support.
  genes:

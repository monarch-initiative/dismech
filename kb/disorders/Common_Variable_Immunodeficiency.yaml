      The most frequent autoimmune manifestations were cytopenia (autoimmune
      thrombocytopenia followed by hemolytic anemia)
    explanation: >-
      Confirms autoimmune thrombocytopenia as the most frequent autoimmune
      cytopenia in a CVID cohort.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TBC1D8B was recently discovered as a novel disease-causing gene for X-linked NPHS. With only a few reported cases,
      the clinical manifestations associated with variants of this gene need to be further examined.
    explanation: States that only a few cases have been reported.
inheritance:
- name: X-linked
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    Affected males are hemizygous, often with the variant inherited from an unaffected mother. Heterozygous females in the
    Kampf families had only mild proteinuria, while one heterozygous woman developed nephrotic syndrome with FSGS at 49,
    so the generic X-linked term is used rather than X-linked recessive.

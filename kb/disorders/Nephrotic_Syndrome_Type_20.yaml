diagnosis:
- name: Genetic testing
  description: >-
    All reported diagnoses came from exome sequencing, usually trio exome, with Sanger confirmation. TBC1D8B is on
    genetic SRNS panels; GeneReviews lists it as the cause of under 1% of genetic SRNS.
  evidence:
  - reference: PMID:39468641
    reference_title: Novel TBC1D8B variant causes neonatal nephrotic syndrome combined with acute kidney injury.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      tested the potential genetic cause of the disease through trio-whole exome sequencing and Sanger sequencing
    explanation: Diagnostic route in a reported case.
treatments:
- name: Glucocorticoid Therapy
  description: >-
    Most patients do not respond. A 6-month-old with p.His906Arg reached remission on glucocorticoids and then relapsed
    twice on tapering, and a 19-year-old man responded to prednisone with cyclosporine and relapsed on tapering.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

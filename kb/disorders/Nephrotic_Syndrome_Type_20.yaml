name: Nephrotic Syndrome Type 20
description: >-
  X-linked podocytopathy caused by loss-of-function variants in TBC1D8B, which encodes a Rab GTPase-activating protein
  that binds active RAB11 and the slit-diaphragm protein nephrin. Affected males are hemizygous; heterozygous females are
  usually unaffected or have mild proteinuria, although a woman with adult-onset FSGS has been reported. Onset ranges from
  the first month of life to adulthood. Most patients have steroid-resistant nephrotic syndrome with focal segmental
  glomerulosclerosis and podocyte foot process effacement, but steroid-sensitive and steroid-dependent courses are
  documented. Loss of TBC1D8B impairs endocytosis and recycling in patient podocytes and fibroblasts, and in Drosophila
  nephrocytes it disturbs endosomal maturation and nephrin trafficking. Zebrafish tbc1d8b knockdown or knockout causes
  proteinuria that wild-type but not patient-mutant human mRNA rescues. ClinGen classifies the gene-disease relationship
  as Moderate.

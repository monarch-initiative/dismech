  notes: >-
    Two families in the first report (PMID:30661770), five in the second (PMID:31732614), and single case reports since
    (PMID:34858901, PMID:35970429, PMID:39468641, PMID:39664988). GeneReviews lists TBC1D8B as the cause of under 1% of
    genetic SRNS. No population prevalence estimate exists.

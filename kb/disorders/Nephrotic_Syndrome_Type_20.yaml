animal_models:
- name: Zebrafish tbc1d8b knockdown and knockout
  species: Zebrafish
  genotype: tbc1d8b morpholino knockdown and knockout
  publication: PMID:30661770
  modeled_mechanisms:
  - target: Glomerular Filtration Barrier Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Loss of the single zebrafish ortholog causes proteinuria, rescued by wild-type but not patient-mutant human mRNA.
    limitations: >-
      The larval zebrafish pronephros is a simplified glomerular filter, and FSGS-type lesions and progression to kidney
      failure cannot be assessed in this model.
    evidence:
    - reference: PMID:30661770
      reference_title: TBC1D8B Loss-of-Function Mutations Lead to X-Linked Nephrotic Syndrome via Defective Trafficking Pathways.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In zebrafish we demonstrated that both knockdown and knockout of the unique TBC1D8B ortholog-induced proteinuria and
        that this phenotype was rescued by human TBC1D8B mRNA injection, but not by either of the two mutated mRNAs.
      explanation: Proteinuria with allele-specific rescue.
- name: Drosophila Tbc1d8b null nephrocytes
  species: Fruit fly
  genotype: Tbc1d8b deletion (null) and nephrocyte RNAi
  publication: PMID:36137753
  modeled_mechanisms:
  - target: Nephrin Mistrafficking
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Nephrocyte-restricted mislocalization of the nephrin ortholog Sns.
    limitations: >-
      Nephrocytes form slit diaphragms but are not glomerular podocytes, and the fly has no glomerular filtration or
      proteinuria readout comparable to the human disease.
    evidence:
    - reference: PMID:36137753
      reference_title: Nephrotic Syndrome Gene TBC1D8B Is Required for Endosomal Maturation and Nephrin Endocytosis in Drosophila.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        A null allele of Drosophila TBC1D8B exhibited a nephrocyte-restricted phenotype of nephrin mislocalization, similar
        to patients with isolated nephrotic syndrome who have variants in the gene.
      explanation: Null allele phenotype.
  - target: Defective Endosomal Maturation
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: Endosomal maturation and cargo degradation are disturbed in the null nephrocytes.
    limitations: Whether endosomal maturation is defective in human podocytes has not been tested.
    evidence:
    - reference: PMID:36137753
      reference_title: Nephrotic Syndrome Gene TBC1D8B Is Required for Endosomal Maturation and Nephrin Endocytosis in Drosophila.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Tbc1d8b was required for endocytic cargo processing and degradation.
      explanation: Endosomal phenotype of the null.
notes: >-
  The entry keeps the MONDO serial name. GeneReviews calls the disease TBC1D8B-related SRNS and ClinGen suggests
  "Nephrotic syndrome - TBC1D8B", but the disease also includes steroid-sensitive and steroid-dependent patients, so a
  name restricted to SRNS would be narrower than the entry; both are kept as synonyms. A neonate with a nonsense variant
  had coma, seizures and a transient splenial DWI lesion alongside nephrotic syndrome and stage 3 acute kidney injury
  (PMID:39468641); with one case and severe systemic illness, this is not recorded as a disease phenotype. No mouse
  model has been published. No GeneReviews chapter is specific to TBC1D8B; the Genetic SRNS Overview covers it.

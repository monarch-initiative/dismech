    explanation: Founding families with X-linked transmission.
  - reference: PMID:34858901
    reference_title: "Novel TBC1D8B Variant in a 6-Month-Old Boy With Steroid-Sensitive Nephrotic Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The boys developed NS, but the girls only had mild proteinuria.

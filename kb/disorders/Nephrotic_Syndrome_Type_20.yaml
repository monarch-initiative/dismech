pathophysiology:
- name: TBC1D8B Loss of Function
  description: >-
    Hemizygous missense, nonsense and frameshift variants reduce or abolish TBC1D8B, a Rab GTPase-activating protein with
    GRAM and TBC domains. Patient-derived missense forms bind active RAB11 and nephrin less well, and in zebrafish they fail
    to rescue loss of the endogenous gene.
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: TBC1D8B
      term:
        id: hgnc:24715
        label: TBC1D8B
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: TBC1D8B
    term:
      id: hgnc:24715
      label: TBC1D8B
  molecular_functions:
  - preferred_term: Rab GTPase activator activity
    modifier: DECREASED
    term:
      id: GO:0005096
      label: GTPase activator activity
  evidence:
  - reference: PMID:31732614
    reference_title: TBC1D8B Mutations Implicate RAB11-Dependent Vesicular Trafficking in the Pathogenesis of Nephrotic Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Overexpressed murine Tbc1d8b with patient-derived mutations had lower affinity for endogenous RAB11 and nephrin
      compared with wild-type Tbc1d8b protein.
    explanation: Patient variants weaken binding to RAB11 and nephrin.
  - reference: PMID:30661770
    reference_title: TBC1D8B Loss-of-Function Mutations Lead to X-Linked Nephrotic Syndrome via Defective Trafficking Pathways.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      this phenotype was rescued by human TBC1D8B mRNA injection, but not by either of the two mutated mRNAs
    explanation: Patient alleles lack the activity of wild-type TBC1D8B in vivo.
  downstream:
  - target: Impaired Podocyte Endocytosis and Recycling
    description: Loss of the RAB11 GAP leaves RAB11-dependent recycling unregulated.
    evidence:
    - reference: PMID:31732614
      reference_title: TBC1D8B Mutations Implicate RAB11-Dependent Vesicular Trafficking in the Pathogenesis of Nephrotic Syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Silencing TBC1D8B in HEK293T cells increased basal autophagy and exocytosis, two cellular functions that are
        independently regulated by RAB11. This suggests that TBC1D8B plays a regulatory role by inhibiting endogenous RAB11.
      explanation: Loss of TBC1D8B releases RAB11-regulated functions.
  - target: Defective Endosomal Maturation
    description: TBC1D8B sits on maturing endosomes and is needed for cargo processing.
    evidence:
    - reference: PMID:36137753
      reference_title: Nephrotic Syndrome Gene TBC1D8B Is Required for Endosomal Maturation and Nephrin Endocytosis in Drosophila.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The protein expressed from the Tbc1d8b locus bearing the edited tag predominantly localized to mature early and late
        endosomes. Tbc1d8b was required for endocytic cargo processing and degradation.
      explanation: Localizes TBC1D8B to maturing endosomes and shows the cargo-processing requirement.
- name: Impaired Podocyte Endocytosis and Recycling
  description: >-
    Podocytes and fibroblasts from affected individuals show markedly reduced internalization and recycling, and the
    podocytes show architectural changes with migration defects of the kind seen in FSGS.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  biological_processes:
  - preferred_term: endocytic recycling
    modifier: DECREASED
    term:
      id: GO:0032456
      label: endocytic recycling
  evidence:
  - reference: PMID:30661770
    reference_title: TBC1D8B Loss-of-Function Mutations Lead to X-Linked Nephrotic Syndrome via Defective Trafficking Pathways.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      both internalization and recycling processes were dramatically decreased in affected individuals' podocytes and
      fibroblasts
    explanation: Direct measurement in patient-derived cells.
  downstream:
  - target: Nephrin Mistrafficking
    description: Nephrin is delivered to and recycled from the slit diaphragm through RAB11 endosomes.
    evidence:
    - reference: PMID:31732614
      reference_title: TBC1D8B Mutations Implicate RAB11-Dependent Vesicular Trafficking in the Pathogenesis of Nephrotic Syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Expression of Rab11 RNAi in nephrocytes entailed defective delivery of slit diaphragm protein to the membrane,
        whereas RAB11 overexpression revealed a partial phenotypic overlap to Tbc1d8b loss of function.
      explanation: Ties RAB11 activity to slit-diaphragm protein delivery in nephrocytes.
- name: Defective Endosomal Maturation
  description: >-
    In Drosophila nephrocytes a null Tbc1d8b allele disturbs endosomal maturation and degradation, and silencing the
    maturation regulator Hrs reproduces the defect. This step is shown only in the fly.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: early endosome to late endosome transport
    modifier: DECREASED
    term:
      id: GO:0045022
      label: early endosome to late endosome transport
  evidence:
  - reference: PMID:36137753
    reference_title: Nephrotic Syndrome Gene TBC1D8B Is Required for Endosomal Maturation and Nephrin Endocytosis in Drosophila.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Silencing Hrs, a regulator of endosomal maturation, phenocopied loss of Tbc1d8b.
    explanation: Places the Tbc1d8b defect at endosomal maturation.
  downstream:
  - target: Nephrin Mistrafficking
    description: Nephrin turnover depends on endocytosis through maturing endosomes.
    evidence:
    - reference: PMID:36137753
      reference_title: Nephrotic Syndrome Gene TBC1D8B Is Required for Endosomal Maturation and Nephrin Endocytosis in Drosophila.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The protein was required for rapid nephrin turnover in nephrocytes and for endocytosis of nephrin induced by
        excessive Rab5 activity.
      explanation: Links the endosomal role of Tbc1d8b to nephrin turnover.
- name: Nephrin Mistrafficking
  description: >-
    TBC1D8B binds nephrin, and its loss mislocalizes nephrin (Sns in Drosophila) away from the slit diaphragm. The human
    evidence is the nephrin interaction in cell lines; the mislocalization itself is shown in nephrocytes.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  biological_processes:
  - preferred_term: nephrin localization to the slit diaphragm
    modifier: DECREASED
    term:
      id: GO:1902414
      label: protein localization to cell junction
  evidence:
  - reference: PMID:31732614
    reference_title: TBC1D8B Mutations Implicate RAB11-Dependent Vesicular Trafficking in the Pathogenesis of Nephrotic Syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Knockdown of Tbc1d8b in Drosophila impaired function of the podocyte-like nephrocytes, and caused mistrafficking of
      Sns, the Drosophila ortholog of nephrin.
    explanation: Nephrin-ortholog mistrafficking on Tbc1d8b knockdown.
  - reference: PMID:36137753
    reference_title: Nephrotic Syndrome Gene TBC1D8B Is Required for Endosomal Maturation and Nephrin Endocytosis in Drosophila.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A null allele of Drosophila TBC1D8B exhibited a nephrocyte-restricted phenotype of nephrin mislocalization, similar
      to patients with isolated nephrotic syndrome who have variants in the gene.
    explanation: Null-allele confirmation of nephrin mislocalization.
  downstream:
  - target: Glomerular Filtration Barrier Failure
    description: Loss of correctly placed nephrin undermines the slit diaphragm and the podocyte foot processes.
    evidence:
    - reference: PMID:35970429
      reference_title: "Adult-Onset Focal Segmental Glomerulosclerosis With Steroid-Dependent Nephrotic Syndrome Caused by a Novel TBC1D8B Variant: A Case Report and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        variants in the TBC1D8B gene on the X chromosome can lead to early-onset focal segmental glomerulosclerosis and
        steroid-resistant nephrotic syndrome by affecting endocytosis and recycling of nephrin
      explanation: Background statement of the nephrin-trafficking model of disease.

classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      The clinical burden is overwhelmingly neurodevelopmental and behavioural:
      intellectual disability, speech delay, microcephaly, aggression, autistic
      traits and stereotypies.
    evidence:
    - reference: PMID:42226002
      reference_title: "PUS7 Deficiency: Phenotypical Expansion of PUS7-Related Neurodevelopmental Disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pathogenic variants in PUS7, encoding pseudouridine synthase 7, cause a
        rare neurodevelopmental disorder marked by intellectual disability,
        microcephaly, short stature, and behavioral disturbances.
      explanation: >-
        The 2026 review states in one sentence that the disorder is defined by
        neurological and behavioural features, supporting a neurologic chapter
        assignment.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A monogenic autosomal recessive Mendelian disorder identified and diagnosed
      by exome or genome sequencing.
    evidence:
    - reference: PMID:33100873
      reference_title: "Next generation sequencing reveals novel homozygous frameshift in PUS7 and splice acceptor variants in AASS gene leading to intellectual disability, developmental delay, dysmorphic feature and microcephaly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Intellectual developmental disorder with abnormal behavior, microcephaly
        and short stature (IDDABS), (OMIM# 618342) is an autosomal recessive
        condition
      explanation: >-
        Names the OMIM entity that MONDO:0032687 cross-references and states its
        autosomal recessive Mendelian basis.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic PUS7 variants. Every family reported to date has
    been homozygous, and most have been consanguineous; heterozygous carrier
    parents are unaffected. Recurrence risk for siblings of an affected proband is
    25 percent, and carrier testing plus genetic counselling are indicated for
    at-risk relatives.
  evidence:
  - reference: PMID:33100873
    reference_title: "Next generation sequencing reveals novel homozygous frameshift in PUS7 and splice acceptor variants in AASS gene leading to intellectual disability, developmental delay, dysmorphic feature and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intellectual developmental disorder with abnormal behavior, microcephaly and
      short stature (IDDABS) is an autosomal recessive disorder is caused by
      homozygous mutation in the PUS7 gene (616261) that is located on chromosome
      7q22.
    explanation: >-
      States the autosomal recessive mode and the biallelic (homozygous)
      requirement at the PUS7 locus.
  - reference: PMID:30778726
    reference_title: "PUS7 mutations impair pseudouridylation in humans and cause intellectual disability and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe two families in which two different homozygous PUS7 mutations
      (missense and frameshift deletion) segregate with a phenotype comprising
      intellectual disability and progressive microcephaly.
    explanation: >-
      Documents segregation of homozygous alleles with the phenotype in two
      independent consanguineous families.
prevalence:
- population: Worldwide reported literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence study exists. The published case count is the
    only defensible measure. PMID:42226002 (2026) states that only 16 patients had
    been described since the first report in 2018 and reviews 17 cases including
    its own; PMID:42249560 (2026) adds 13 further patients carrying 15 new
    variants. The cumulative published total is therefore about 30 individuals
    worldwide, which places the disorder in the ultra-rare band. No Orphanet
    prevalence class is adopted, because no Orphanet entity for this disorder
    exists to adopt one from. An earlier revision of this note asserted
    "Orphanet codes the disorder as ORPHA:544510"; that identifier was unsourced
    and is retracted here. It appears nowhere in the deep-research report or its
    citations sidecar, and MONDO:0032687 carries no ORPHA xref at all - its
    cross-references are DOID:0081265, GARD:0018516, MEDGEN:1675423, OMIM:618342
    and UMLS:C5193039. This matches the entry-level notes, which record that an
    OLS4 search of ORDO for PUS7 returns zero hits. Because the claim sat in
    prose rather than in a snippet, the reference validator could not have
    caught it.
  evidence:
  - reference: PMID:42226002
    reference_title: "PUS7 Deficiency: Phenotypical Expansion of PUS7-Related Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since the first report in 2018, only 16 patients have been described.
    explanation: >-
      Gives the published worldwide case count as of the 2026 review, supporting
      an ultra-rare classification based on cases in the literature.
  - reference: PMID:42249560
    reference_title: "Novel Variants in PUS7 Associated With Intellectual Disability and Growth Retardation: Expanding the Clinical Spectrum in 13 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, we report 13 new cases carrying 15 new variants.
    explanation: >-
      Supplies the second component of the cumulative published case count.
pathophysiology:
- name: Biallelic PUS7 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    The disorder is initiated by inheritance of two damaging PUS7 alleles. The
    reported allelic spectrum includes frameshift alleles, nonsense alleles, a
    deletion of the penultimate exon that escapes nonsense-mediated decay but
    removes the C-terminal catalytic region, and missense alleles. Missense
    alleles appear to behave as hypomorphs, producing a milder phenotype without
    microcephaly or short stature.
  genes:
  - preferred_term: PUS7
    term:
      id: hgnc:26033
      label: PUS7
  evidence:
  - reference: PMID:30526862
    reference_title: "Variants in PUS7 Cause Intellectual Disability with Speech Delay, Microcephaly, Short Stature, and Aggressive Behavior."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe six persons from three families with three homozygous protein
      truncating variants in PUS7
    explanation: >-
      Establishes biallelic protein-truncating PUS7 alleles as the initiating
      lesion in the founding cohort.
  - reference: PMID:31583274
    reference_title: "A novel PUS7 mutation causes intellectual disability with autistic and aggressive behaviors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The absence of highly extreme phenotypes such as short stature or
      microcephaly in this family might reflect genotype–phenotype correlation,
      since this family presented with a PUS7 missense mutation that may be
      hypomorphic, while previously reported families carried nonsense or
      frameshift mutations that may cause loss of function.
    explanation: >-
      Documents the allelic spectrum and the proposed hypomorph-versus-null
      genotype-phenotype gradient.
  downstream:
  - target: Loss of Pseudouridine Synthase 7 Catalytic Activity
    description: >-
      Damaging biallelic alleles remove or inactivate the TruD-family
      pseudouridine synthase encoded by PUS7.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30526862
      reference_title: "Variants in PUS7 Cause Intellectual Disability with Speech Delay, Microcephaly, Short Stature, and Aggressive Behavior."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We show that the disease-related variants lead to abolishment of PUS7
        activity on both tRNA and mRNA substrates.
      explanation: >-
        Directly links the patient alleles to abolished enzymatic activity.
- name: Loss of Pseudouridine Synthase 7 Catalytic Activity
  biological_scale: MOLECULAR
  description: >-
    PUS7 is an RNA-independent (stand-alone) pseudouridine synthase of the TruD
    family that isomerises uridine to 5-ribosyluracil without a guide snoRNA. Loss
    of its activity removes pseudouridine from every class of PUS7 substrate at
    once: cytosolic tRNAs, a defined set of mRNAs, and tRNA-derived small
    fragments.
  molecular_functions:
  - preferred_term: pseudouridine synthase activity
    term:
      id: GO:0009982
      label: pseudouridine synthase activity
    modifier: DECREASED
  - preferred_term: tRNA pseudouridine synthase activity
    term:
      id: GO:0106029
      label: tRNA pseudouridine synthase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: pseudouridine synthesis
    term:
      id: GO:0001522
      label: pseudouridine synthesis
    modifier: DECREASED
  evidence:
  - reference: PMID:30526862
    reference_title: "Variants in PUS7 Cause Intellectual Disability with Speech Delay, Microcephaly, Short Stature, and Aggressive Behavior."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PUS7 encodes the RNA-independent pseudouridylate synthase 7.
    explanation: >-
      Identifies the gene product whose activity is lost, and its RNA-independent
      (guide-RNA-free) mode of substrate recognition.
  - reference: PMID:30778726
    reference_title: "PUS7 mutations impair pseudouridylation in humans and cause intellectual disability and microcephaly."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, the missense variant of the S. cerevisiae ortholog failed to
      complement the growth defect of S. cerevisiae pus7Δ trm8Δ mutants.
    explanation: >-
      Yeast complementation shows that a patient missense allele is a complete
      loss-of-function at the level of enzyme activity, not merely a
      destabilising substitution.
  downstream:
  - target: Depletion of tRNA Pseudouridine at Position 13
    description: >-
      Loss of the enzyme removes the position-13 pseudouridine it normally
      installs in cytosolic tRNAs.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30778726
      reference_title: "PUS7 mutations impair pseudouridylation in humans and cause intellectual disability and microcephaly."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Functional characterization of the two mutations confirmed that both
        result in decreased levels of Ψ13 in tRNAs.
      explanation: >-
        Patient-derived lymphoblastoid cells show the specific loss of the
        PUS7-dependent tRNA modification.
  - target: Loss of PUS7-Dependent mRNA Pseudouridylation
    description: >-
      The same catalytic loss removes pseudouridine from PUS7-dependent mRNA
      substrates.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33100873
      reference_title: "Next generation sequencing reveals novel homozygous frameshift in PUS7 and splice acceptor variants in AASS gene leading to intellectual disability, developmental delay, dysmorphic feature and microcephaly."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Pseudouridylation of mRNA was also decreased, but the functional
        significance of this observation was unclear.
      explanation: >-
        Documents the mRNA arm of the substrate loss and, honestly, its uncertain
        functional weight.
  - target: Loss of Pseudouridylation and Activation of tRNA-Derived Fragments
    description: >-
      PUS7 also pseudouridylates and thereby activates a network of tRNA-derived
      small fragments; loss of the enzyme leaves these fragments unmodified and
      inactive.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29628141
      reference_title: "Pseudouridylation of tRNA-Derived Fragments Steers Translational Control in Stem Cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Mechanistically, the Ψ "writer" PUS7 modifies and activates a novel
        network of tRNA-derived small fragments (tRFs) targeting the translation
        initiation complex.
      explanation: >-
        Establishes tRNA-derived fragments as a distinct PUS7 substrate class
        whose activation depends on the modification.
  - target: Loss of 7SK snRNA Pseudouridylation and Enhanced Pol II Elongation
    description: >-
      PUS7 also pseudouridylates the 7SK small nuclear RNA, which restrains RNA
      polymerase II promoter-proximal pausing. Whether this arm contributes to
      the human disorder is untested, so the edge belongs to an emerging rather
      than the canonical mechanism model.
    causal_link_type: DIRECT
    hypothesis_groups:
    - pus7_non_translational_arms
    evidence:
    - reference: PMID:41168165
      reference_title: "Pseudouridylation of 7SK by PUS7 regulates Pol II transcription elongation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here, we report that pseudouridine synthase 7 (PUS7) can mediate
        pseudouridylation of 7SK small nuclear RNA (snRNA), a regulator of RNA
        polymerase II (Pol II) promoter-proximal pausing.
      explanation: >-
        Establishes 7SK snRNA as a fourth PUS7 substrate class, distinct from
        tRNA, mRNA and tRNA-derived fragments.
- name: Loss of 7SK snRNA Pseudouridylation and Enhanced Pol II Elongation
  biological_scale: MOLECULAR
  description: >-
    Loss of PUS7 leaves 7SK snRNA hypo-pseudouridylated, which releases the
    positive transcription elongation factor b complex from 7SK, raises serine-2
    phosphorylation of the RNA polymerase II C-terminal domain, and enhances
    transcription elongation. This is a transcription-level rather than a
    translation-level consequence of the same enzymatic deficit. It is included
    because it is mechanistically established for PUS7 loss, but its relevance
    to the neurodevelopmental phenotype is entirely untested: the work was done
    in colorectal cancer cells, and no patient tissue has been examined.
  biological_processes:
  - preferred_term: regulation of transcription elongation by RNA polymerase II
    term:
      id: GO:0034243
      label: regulation of transcription elongation by RNA polymerase II
    modifier: INCREASED
  evidence:
  - reference: PMID:41168165
    reference_title: "Pseudouridylation of 7SK by PUS7 regulates Pol II transcription elongation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      PUS7 loss leads to hypo-pseudouridylation of 7SK, which promotes
      dissociation of the positive transcription elongation factor b (P-TEFb)
      complex from 7SK. The release of P-TEFb from 7SK increases serine 2
      phosphorylation (Ser2P) in the RNA Pol II C-terminal domain and enhances
      transcription elongation.
    explanation: >-
      The full molecular chain from PUS7 loss to enhanced Pol II elongation,
      demonstrated in cell lines.
- name: Depletion of tRNA Pseudouridine at Position 13
  biological_scale: MOLECULAR
  description: >-
    Patient cells lose pseudouridine specifically at position 13 of at least ten
    different cytosolic tRNAs, with other pseudouridine positions in the same
    tRNAs preserved. The defect is therefore a clean, position-specific ablation
    of one modification rather than a general collapse of tRNA maturation.
  biological_processes:
  - preferred_term: tRNA pseudouridine synthesis
    term:
      id: GO:0031119
      label: tRNA pseudouridine synthesis
    modifier: DECREASED
  - preferred_term: tRNA modification
    term:
      id: GO:0006400
      label: tRNA modification
    modifier: DECREASED
  evidence:
  - reference: PMID:33100873
    reference_title: "Next generation sequencing reveals novel homozygous frameshift in PUS7 and splice acceptor variants in AASS gene leading to intellectual disability, developmental delay, dysmorphic feature and microcephaly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Patient-derived cells showed decreased pseudouridylation signals
      specifically for PUS7 substrates at position 13 of at least 10 different
      cytosolic tRNAs, but not at other positions.
    explanation: >-
      States both the breadth (at least ten tRNAs) and the specificity (position
      13 only) of the modification loss in patient cells.
  - reference: PMID:31583274
    reference_title: "A novel PUS7 mutation causes intellectual disability with autistic and aggressive behaviors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All identified PUS7 variants resulted in aberrant pseudouridylation of at
      least 10 cytosolic tRNAs at position 13.
    explanation: >-
      Independent confirmation that the position-13 defect is common to the whole
      reported allelic series.
  downstream:
  - target: Deregulated Global Protein Synthesis
    description: >-
      Loss of a conserved tRNA body modification perturbs the translational
      apparatus. The authors of the founding cohorts attribute the disease to a
      deleterious effect on protein synthesis, but the quantitative step from
      missing Psi-13 to altered translation output has not been measured
      directly in neurons.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30778726
      reference_title: "PUS7 mutations impair pseudouridylation in humans and cause intellectual disability and microcephaly."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We and others have previously emphasized the predilection of Mendelian
        diseases caused by tRNA modification genes to CNS involvement and how this
        suggests the vulnerability of the brain to any perturbation of tRNA
        modification, presumably through its deleterious effect on protein
        synthesis
      explanation: >-
        The authors state this link as an inference ("presumably"), so the edge is
        curated as INDIRECT with PARTIAL support rather than as a demonstrated
        mechanism.
  - target: Loss of Codon-Specific Translational Control
    description: >-
      PUS7-dependent tRNA pseudouridine is required for codon-biased regulation
      of translation, so losing it releases codon-specific control over which
      transcripts are efficiently translated.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35121864
      reference_title: "Targeting PUS7 suppresses tRNA pseudouridylation and glioblastoma tumorigenesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Mechanistically, we identify PUS7 targets in GSCs through small RNA
        pseudouridine sequencing and show that pseudouridylation of
        PUS7-regulated transfer RNA is critical for codon-specific translational
        control of key regulators of GSCs.
      explanation: >-
        Establishes that the tRNA pseudouridine PUS7 installs governs
        codon-specific translation. The experimental system is glioblastoma stem
        cells rather than neurons, so the substrate-level claim is imported but
        no oncologic claim is.
- name: Loss of Codon-Specific Translational Control
  biological_scale: MOLECULAR
  description: >-
    PUS7-dependent tRNA pseudouridylation biases translation toward or away from
    particular codons, so its loss changes which transcripts are efficiently
    decoded. This is the most satisfying available answer to the central puzzle
    of the disorder: how the loss of a broadly expressed housekeeping RNA writer
    produces a selective, largely neurological phenotype rather than uniform
    cellular failure. The mapping was performed in glioblastoma stem cells, and
    the equivalent codon-level analysis has never been done in neurons or neural
    progenitors.
  biological_processes:
  - preferred_term: regulation of translation
    term:
      id: GO:0006417
      label: regulation of translation
    modifier: DECREASED
  evidence:
  - reference: PMID:35121864
    reference_title: "Targeting PUS7 suppresses tRNA pseudouridylation and glioblastoma tumorigenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mechanistically, we identify PUS7 targets in GSCs through small RNA
      pseudouridine sequencing and show that pseudouridylation of PUS7-regulated
      transfer RNA is critical for codon-specific translational control of key
      regulators of GSCs.
    explanation: >-
      The direct demonstration that PUS7-dependent tRNA pseudouridine controls
      translation in a codon-specific rather than a global manner.
  downstream:
  - target: Deregulated Global Protein Synthesis
    description: >-
      Loss of codon-level control contributes to the overall derangement of
      translational output.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:

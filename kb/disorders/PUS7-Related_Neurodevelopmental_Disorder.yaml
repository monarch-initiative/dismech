- name: Failure of tRF-Mediated Restraint of Translation Initiation
  biological_scale: CELLULAR
  description: >-
    PUS7-modified tRFs act as brakes on the translation initiation complex. The
    best-resolved arm is the mini-tRF carrying a 5-prime terminal oligoguanine
    (mTOG): its pseudouridine engages the RNA-recognition-motif domains of
    PABPC1, which blocks recruitment of the translational co-activator PAIP1 and
    represses translation of transcripts carrying pyrimidine-enriched and
    5-prime terminal oligopyrimidine sequences, many of which encode components
    of the protein-synthesis machinery itself. Removing the brake therefore
    releases initiation from its normal ceiling, and does so in a feed-forward
    way because the derepressed transcripts build more translational machinery.

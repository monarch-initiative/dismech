      id: HP:0000407
      label: Sensorineural hearing impairment
  notes: >-
    NCIT:C183182 (Hearing Aid) is a device concept and is not reachable from
    NCIT:C25218, so it cannot be used in the TreatmentTerm slot; the generic
    Supportive Care action term is bound and the specific action is carried in
    preferred_term with therapeutic_modality DEVICE.
  evidence:
  - reference: PMID:30778726
    reference_title: "PUS7 mutations impair pseudouridylation in humans and cause intellectual disability and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further, he developed severe sensorineural hearing loss and hearing aid was
      used.
    explanation: >-
      Documents hearing-aid use in an affected proband with progressive
      sensorineural hearing loss.
- name: Allopurinol for Hyperuricemia
  description: >-
    Where hyperuricaemia is present it is treatable and its complications (urate
    nephropathy, nephrolithiasis, gout) are preventable, which makes measuring
    serum urate one of the few actionable investigations in this disorder. The
    two siblings in whom hyperuricaemia was documented were treated with
    allopurinol.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: allopurinol
      term:
        id: CHEBI:40279
        label: allopurinol
  target_phenotypes:
  - preferred_term: Hyperuricemia
    term:
      id: HP:0002149
      label: Hyperuricemia
  notes: >-
    Evidence limitation, stated precisely. The statement that these patients
    required allopurinol is in the PMC full text of PMID:35144859, not in its
    abstract. The cached record references_cache/PMID_35144859.md is
    abstract-only (content_type abstract_only), and `grep -c
    "allopurinol\|Allopurinol" references_cache/PMID_35144859.md` returns 0, so
    no verbatim snippet for the allopurinol statement itself can be taken from
    the cache in this working tree. The snippet cited below therefore supports
    the indication (hyperuricaemia in PUS7 deficiency), not the prescription.
    Retrieving the PMC full text and quoting the treatment sentence directly is
    the right way to close this gap in a follow-up pass. Applies only to the
    minority of patients with documented hyperuricaemia; urate has not been
    measured in most published cases. Standard allopurinol hypersensitivity
    risk applies, including the HLA-B*58:01-associated severe cutaneous adverse
    reaction covered by the dismech Allopurinol_Induced_SJS_TEN entry.
  evidence:
  - reference: PMID:35144859
    reference_title: "PUS7 deficiency in human patients causes profound neurodevelopmental phenotype by dysregulating protein translation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both patients also had features of Lesch-Nyhan syndrome, including
      hyperuricemia and self-injurious behavior, but without pathogenic variants in
      HPRT1.
    explanation: >-
      Establishes the treatable indication. Support is PARTIAL because the cached
      abstract documents the hyperuricaemia but not the allopurinol prescription
      or its outcome.
- name: Genetic Counselling and Carrier Testing
  description: >-
    Because inheritance is autosomal recessive and most reported families are
    consanguineous, carrier testing and counselling with a 25 percent sibling
    recurrence risk follow directly from a molecular diagnosis. The diagnostic
    testing itself is modelled in the diagnosis: section rather than here.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:42226002
    reference_title: "PUS7 Deficiency: Phenotypical Expansion of PUS7-Related Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We recommend looking for PUS7 pathological variants when performing whole
      exome sequencing in children with this constellation of neurodevelopmental
      and behavioral signs.
    explanation: >-
      An explicit diagnostic recommendation from the most recent review of the
      disorder.
differential_diagnoses:
- name: PUS3-related intellectual disability and microcephaly syndrome
  disease_term:
    preferred_term: PUS3-related intellectual disability syndrome (MRT55)
    term:
      id: MONDO:0014886
      label: severe growth deficiency-strabismus-extensive dermal melanocytosis-intellectual disability syndrome
  description: >-
    The single most confusable entity. PUS3 (hgnc:25461) is another stand-alone
    pseudouridine synthase whose loss causes an autosomal recessive intellectual
    disability and microcephaly syndrome (MONDO:0014886, OMIM:617051, also known
    as MRT55). Both disorders are described in the literature as caused by
    "impaired pseudouridylation" and both were characterised by overlapping author
    groups, so gene-agnostic reading of that phrase will merge them.
  distinguishing_features:
  - >-
    Molecular: PUS3 (hgnc:25461) versus PUS7 (hgnc:26033). Different genes,
    different MONDO entities, different OMIM numbers (617051 versus 618342).
  - >-
    Substrate position: PUS3 isomerises uridine at tRNA positions 38 and 39,
    whereas PUS7 acts at position 13 (and at position 35 of pre-tRNA-Tyr). A
    tRNA modification assay therefore distinguishes them biochemically, and this
    is the cleanest functional discriminator.
  - >-
    Clinical: the PUS3 MONDO entity carries severe growth deficiency, strabismus
    and extensive dermal melanocytosis as label-level features. Dermal
    melanocytosis has never been reported in PUS7 deficiency, and the PUS7
    behavioural signature of very-early-onset aggression is not part of the PUS3
    label.
  evidence:
  - reference: PMID:27055666
    reference_title: "A homozygous truncating mutation in PUS3 expands the role of tRNA modification in normal cognition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consistent with the known role of Pus3 in isomerizing uracil to pseudouridine
      at positions 38 and 39 in tRNA, we found a significant reduction in this
      post-transcriptional modification of tRNA in patient cells.
    explanation: >-
      Establishes the position-38/39 substrate specificity that biochemically
      separates PUS3 disease from the position-13 defect of PUS7 disease.
  - reference: PMID:30778726
    reference_title: "PUS7 mutations impair pseudouridylation in humans and cause intellectual disability and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 2016, we described a novel intellectual disability and microcephaly
      syndrome in three affected siblings who all shared a homozygous truncating
      variant in PUS3 (Shaheen et al. 2016).
    explanation: >-
      The PUS7 paper itself distinguishes the PUS3 syndrome as a separate entity,
      in the same authors' words.
- name: PUS1-related myopathy, lactic acidosis and sideroblastic anaemia (MLASA1)
  disease_term:
    preferred_term: MLASA1 (PUS1-related)
    term:
      id: MONDO:0024553
      label: myopathy, lactic acidosis, and sideroblastic anemia 1
  description: >-
    The first pseudouridine synthase disease described in humans, caused by
    biallelic PUS1 variants (hgnc:15508). Despite sharing the "deficient
    pseudouridylation" mechanism language with PUS7 disease, the phenotype is
    almost disjoint: a mitochondrial oxidative-phosphorylation disorder restricted
    to skeletal muscle and bone marrow.
  distinguishing_features:
  - >-
    Molecular: PUS1 (hgnc:15508) versus PUS7 (hgnc:26033); MONDO:0024553 versus
    MONDO:0032687.
  - >-
    Compartment: PUS1 deficiency is proposed to act through deficient
    pseudouridylation of MITOCHONDRIAL tRNAs, whereas PUS7 acts on cytosolic tRNAs,
    mRNAs and tRNA-derived fragments. This is the mechanistic reason the two
    phenotypes barely overlap.
  - >-
    Clinical: MLASA1 presents with exercise intolerance, myopathy, lactic acidosis
    and sideroblastic anaemia. Intellectual disability, microcephaly and aggression
    are not part of it, and conversely myopathy, lactic acidosis and sideroblastic
    anaemia have never been reported in PUS7 deficiency. A patient with anaemia and
    a raised lactate is not a PUS7 candidate.
  evidence:
  - reference: PMID:15108122
    reference_title: "Missense mutation in pseudouridine synthase 1 (PUS1) causes mitochondrial myopathy and sideroblastic anemia (MLASA)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mitochondrial myopathy and sideroblastic anemia (MLASA) is a rare, autosomal
      recessive oxidative phosphorylation disorder specific to skeletal muscle and
      bone marrow.
    explanation: >-
      Defines the MLASA phenotype as tissue-restricted to muscle and marrow, which
      is the clinical discriminator from the CNS-dominated PUS7 disorder.
  - reference: PMID:15108122
    reference_title: "Missense mutation in pseudouridine synthase 1 (PUS1) causes mitochondrial myopathy and sideroblastic anemia (MLASA)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We propose deficient pseudouridylation of mitochondrial tRNAs as an etiology
      of MLASA.
    explanation: >-
      States the mitochondrial-tRNA compartment that separates the PUS1 mechanism
      from the cytosolic PUS7 mechanism, while showing exactly why the shared
      "deficient pseudouridylation" phrasing is a confusion hazard.
- name: PUS7L-related neurodevelopmental disorder
  description: >-
    PUS7L (hgnc:25276) is the paralogue of PUS7 and is a separate gene. A patient
    with severe global developmental delay and epilepsy carrying a homozygous
    truncating PUS7L variant was noted in passing by the same group that
    characterised PUS7 disease. Because the gene symbols differ by a single
    trailing character, this is a high-risk symbol-level confusion, distinct from
    the mechanism-level confusion posed by PUS1 and PUS3.
  distinguishing_features:
  - >-
    Molecular: PUS7L is hgnc:25276, PUS7 is hgnc:26033. They are distinct
    paralogous genes at distinct loci, and PUS7L has its own tRNA targets, mapped
    in PMID:41136621.
  - >-
    Clinical: the reported PUS7L phenotype prominently included epilepsy, whereas
    PMID:30778726 positively asserts the LACK of epilepsy as a consistent feature
    of PUS7 deficiency. Seizures should therefore push a differential toward
    PUS7L, not PUS7.
  notes: >-
    Deliberately left UNBOUND. `runoak -i sqlite:obo:mondo relationships
    --direction down HGNC:25276` returns no rows, and a MONDO label search for
    PUS7L returns nothing, so there is no MONDO disease term for a PUS7L-related
    disorder to bind to. Binding a generic neurodevelopmental-disorder term here
    would assert an entity that does not exist in the ontology. The gene identity
    is instead carried in the description and distinguishing features. When MONDO
    mints a PUS7L disease class this record should be bound.
  evidence:
  - reference: PMID:30778726
    reference_title: "PUS7 mutations impair pseudouridylation in humans and cause intellectual disability and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, we recently encountered a patient with severe global
      developmental delay and epilepsy with a homozygous truncating variant in
      PUS7L (manuscript under review).
    explanation: >-
      The only clinical description of a PUS7L patient in the cited literature,
      written by the PUS7 authors themselves, and the source of the
      epilepsy-versus-no-epilepsy discriminator.
  - reference: PMID:41136621
    reference_title: "A comprehensive tRNA pseudouridine map uncovers targets dependent on human stand-alone pseudouridine synthases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Through this approach, we uncovered previously unknown targets of several PUS
      enzymes, including RPUSD1, RPUSD2, PUS3, PUSL1 and PUS7L.
    explanation: >-
      Confirms PUS7L as an enzymatically distinct family member with its own
      substrate set, not a synonym or isoform of PUS7.
- name: Lesch-Nyhan syndrome
  disease_term:
    preferred_term: Lesch-Nyhan syndrome
    term:
      id: MONDO:0010298
      label: Lesch-Nyhan syndrome
  description: >-
    An X-linked disorder of purine metabolism caused by HPRT deficiency, presenting
    with hyperuricaemia, intellectual disability and severe self-injurious
    behaviour. Two PUS7-deficient siblings were investigated for Lesch-Nyhan
    syndrome because they had exactly this combination, and no HPRT1 variant was
    found. This is therefore a real, documented diagnostic trap, not a theoretical
    one.
  distinguishing_features:
  - >-
    Molecular: Lesch-Nyhan is X-linked and caused by HPRT1 variants; PUS7 disease
    is autosomal recessive with biallelic PUS7 variants and a NORMAL HPRT1
    sequence. Sequencing resolves it.
  - >-
    Biochemical nuance: HPRT1 protein was mildly REDUCED in the PUS7 siblings
    despite a normal HPRT1 gene, attributed to deregulated translation. A
    protein-level or enzyme-activity assay may therefore be mildly abnormal in PUS7
    disease and should not be read as confirming Lesch-Nyhan.
  - >-
    Clinical: microcephaly, short stature and early-onset aggression point to PUS7;
    the dystonia, choreoathetosis and gouty arthropathy of classic Lesch-Nyhan have
    not been reported in PUS7 deficiency.
  evidence:
  - reference: PMID:35144859
    reference_title: "PUS7 deficiency in human patients causes profound neurodevelopmental phenotype by dysregulating protein translation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both patients also had features of Lesch-Nyhan syndrome, including
      hyperuricemia and self-injurious behavior, but without pathogenic variants in
      HPRT1.
    explanation: >-
      Documents the actual clinical confusion and its genetic resolution.
  - reference: PMID:35144859
    reference_title: "PUS7 deficiency in human patients causes profound neurodevelopmental phenotype by dysregulating protein translation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Interestingly, the dysregulation of protein translation also resulted in
      mildly decreased levels of HPRT1 protein suggesting an association between
      dysregulated protein translation and the LNS-like phenotypic findings.
    explanation: >-
      Explains why an HPRT1 protein assay can be misleading in PUS7 deficiency.
- name: Hyperlysinaemia type I (AASS-related)
  disease_term:
    preferred_term: hyperlysinemia
    term:
      id: MONDO:0009388
      label: hyperlysinemia
  description: >-
    Not a phenotypic mimic so much as a documented co-occurring second diagnosis.
    The two Saudi brothers reported in PMID:33100873 carry both a homozygous PUS7
    frameshift and a splice-acceptor variant in AASS, the hyperlysinaemia type I
    gene (OMIM:238700, the OMIM xref of MONDO:0009388). Any curator importing that
    paper's phenotype list must decide which findings belong to which locus.
  distinguishing_features:
  - >-
    Attribution, not exclusion: the two diagnoses coexist in the same children, so
    finding one does not exclude the other. That paper itself states that
    hyperlysinaemia type I presents with nonspecific seizure, hypotonia and mildly
    delayed psychomotor development, all of which are also recorded for those
    brothers.
  - >-
    Biochemical: hyperlysinaemia is confirmed by elevated plasma lysine and
    saccharopinuria, which are not features of PUS7 deficiency and have never been
    measured in any other PUS7 cohort.
  notes: >-
    Cross-reference: the Seizure and Hypotonia phenotypes in this entry both derive
    from these two brothers, both carry supports PARTIAL, and both name this record
    in their attribution notes. PMID:30778726 separately and positively asserts the
    absence of epilepsy in PUS7 deficiency, which is curated as a REFUTE evidence
    item on the Seizure phenotype.
  evidence:
  - reference: PMID:33100873
    reference_title: "Next generation sequencing reveals novel homozygous frameshift in PUS7 and splice acceptor variants in AASS gene leading to intellectual disability, developmental delay, dysmorphic feature and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient with hyperlysinemia Type 1 (OMIM# 238700) having nonspecific seizure,
      hypotonia, mildly delayed psychomotor development, while patients with
      Saccharopinuria (OMIM# 268700) show mild developmental delay, hyperactivity
      and speech delay.
    explanation: >-
      The dual-locus paper's own statement that the AASS phenotype includes
      seizure, hypotonia and psychomotor delay, which is exactly why those findings
      in its probands cannot be attributed to PUS7 alone.
- name: Smith-Magenis syndrome
  disease_term:
    preferred_term: Smith-Magenis syndrome
    term:
      id: MONDO:0008434
      label: Smith-Magenis syndrome
  description: >-
    The closest non-genetic-family phenocopy on behavioural grounds. Smith-Magenis
    syndrome, caused by the recurrent 17p11.2 deletion or by intragenic RAI1
    variants, combines intellectual disability, sleep disturbance, aggression,
    self-injurious behaviour, motor stereotypies and short stature. That is a
    near-complete overlap with the "less common but more peculiar" cluster that
    PMID:42226002 proposes as the discriminating signature of PUS7 deficiency,
    which means the very features that are supposed to raise suspicion of PUS7
    disease also describe Smith-Magenis. This differential exists because the
    behavioural gestalt collides, not because the genes or mechanisms are related.
  distinguishing_features:
  - >-
    Molecular: a 17p11.2 microdeletion or heterozygous RAI1 variant, autosomal
    dominant and usually de novo, versus biallelic recessive PUS7. Chromosomal
    microarray detects the common deletion and will be normal in PUS7 disease.
  - >-
    Sleep: Smith-Magenis has a characteristic inverted circadian melatonin rhythm
    with the classic phenotype of daytime sleepiness and night waking. The sleep
    disturbance reported in PUS7 deficiency is a single-case observation with no
    described circadian signature.
  - >-
    Head size: progressive postnatal microcephaly is a core PUS7 feature and is
    not characteristic of Smith-Magenis, so serial head-circumference plotting is
    a cheap discriminator.
  - >-
    Visceral involvement: Smith-Magenis includes craniofacial, skeletal and
    visceral anomalies. PUS7 deficiency has mild non-specific facial dysmorphism
    and no visceral anomalies.
  evidence:
  - reference: PMID:20932317
    reference_title: "Frameshift mutation hotspot identified in Smith-Magenis syndrome: case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Smith-Magenis syndrome (SMS) is a complex syndrome involving intellectual
      disabilities, sleep disturbance, behavioural problems, and a variety of
      craniofacial, skeletal, and visceral anomalies.
    explanation: >-
      States the overlapping triad of intellectual disability, sleep disturbance
      and behavioural problems that makes this a genuine clinical differential,
      and the visceral involvement that separates it.
  - reference: PMID:20932317
    reference_title: "Frameshift mutation hotspot identified in Smith-Magenis syndrome: case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While the majority of SMS cases harbor an ~3.5 Mb common deletion on 17p11.2
      that encompasses the retinoic acid induced-1 (RAI1) gene, some patients carry
      small intragenic deletions or point mutations in RAI1.
    explanation: >-
      Gives the molecular discriminator and, importantly, the reason a normal
      microarray does not exclude Smith-Magenis; RAI1 sequencing is still needed.
- name: Other tRNA-modification intellectual disability syndromes
  disease_term:
    preferred_term: ADAT3-related intellectual disability-strabismus syndrome
    term:
      id: MONDO:0014119
      label: intellectual disability-strabismus syndrome
  description: >-
    PUS7 disease sits inside a growing class of autosomal recessive intellectual
    disability syndromes caused by loss of a single tRNA modification, all of which
    share intellectual disability with variable microcephaly and short stature and
    are therefore clinically indistinguishable without sequencing. The record is
    bound to the ADAT3 entity (MONDO:0014119, adenosine-to-inosine editing at
    wobble position 34), which is the most common cause of autosomal recessive
    intellectual disability in Arabia and is therefore the highest-prior
    alternative in the very populations where PUS7 families have been ascertained.
  distinguishing_features:
  - >-
    Molecular: ADAT3 (hgnc:25151) wobble-position inosine editing, NSUN2
    (hgnc:25994, MONDO:0012613) 5-methylcytosine, TRMT10A 1-methylguanosine at
    position 9, WDR4 7-methylguanosine at position 46, THUMPD1 tRNA acetylation.
    None of these is a pseudouridine synthase, and none produces a position-13
    pseudouridine defect.
  - >-
    Assay: the discriminating test is which modification is missing. PUS7 disease
    shows loss of pseudouridine at tRNA position 13 with other pseudouridine
    positions in the same tRNAs intact.
  - >-
    Clinical: strabismus is a label-level feature of the ADAT3 entity and is not
    reported in PUS7 deficiency; conversely very-early-onset aggression is the PUS7
    signature.
  notes: >-
    One record is used for the class rather than one per gene, because the shared
    diagnostic logic (sequence the child; identify which tRNA modification is
    absent) is identical for all of them and duplicating it per gene would add
    length without adding discrimination. The bound term is the ADAT3 entity;
    NSUN2 disease is MONDO:0012613, and dismech already carries a separate entry
    for the THUMPD1-related disorder. The class-level point is supported by the
    quoted sentences, which name the class explicitly.
  evidence:
  - reference: PMID:27055666
    reference_title: "A homozygous truncating mutation in PUS3 expands the role of tRNA modification in normal cognition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For example, the most common form of autosomal recessive ID in Arabia was
      found to be due to mutation of ADAT3, which edits adenosine to inosine at the
      wobble position 34 of mature tRNA
    explanation: >-
      Establishes ADAT3 disease as the highest-prior alternative diagnosis in the
      populations where PUS7 families have been ascertained, and names its distinct
      modification chemistry.
  - reference: PMID:30778726
    reference_title: "PUS7 mutations impair pseudouridylation in humans and cause intellectual disability and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional Mendelian disorders include TRM10A- and NSUN2-related syndromes of
      intellectual disability, microcephaly and short stature
    explanation: >-
      Names two further tRNA-modification syndromes whose stated triad
      (intellectual disability, microcephaly, short stature) is the same as this
      disorder's, which is precisely why sequencing rather than phenotyping is the
      discriminator.
mechanistic_hypotheses:
- hypothesis_group_id: pus7_translational_control
  hypothesis_label: Loss of PUS7-dependent translational restraint as the disease mechanism
  status: CANONICAL
  description: >-
    The default explanatory model. Loss of PUS7 removes pseudouridine from
    cytosolic tRNAs, from PUS7-dependent mRNAs, and from the tRNA-derived
    fragments that hold the translation initiation complex in check. The
    convergent consequence is loss of translational homeostasis, demonstrated
    directly in PUS7-deficient patient fibroblasts, and the developing brain is
    the tissue least able to tolerate it. Every edge in this entry that is not
    explicitly assigned to another hypothesis group belongs to this model.
  evidence:
  - reference: PMID:35144859
    reference_title: "PUS7 deficiency in human patients causes profound neurodevelopmental phenotype by dysregulating protein translation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Patient fibroblasts demonstrated upregulation of protein synthesis,
      including elevated MYC protein, but did not exhibit increased rates of cell
      proliferation.
    explanation: >-
      The human-cell demonstration on which the canonical translational model
      rests.
- hypothesis_group_id: pus7_non_translational_arms
  hypothesis_label: Contribution of the transcription-elongation and splicing arms of PUS7
  status: EMERGING
  description: >-
    PUS7 also pseudouridylates 7SK snRNA, controlling RNA polymerase II
    promoter-proximal pausing, and has reported effects on pre-mRNA splicing via
    U2 snRNA. Both are established for PUS7 loss in cell lines. Neither has been
    connected to the human neurodevelopmental phenotype in any way: no patient
    tissue has been assayed for 7SK pseudouridine, Pol II serine-2
    phosphorylation, or splicing abnormalities. Edges opting into this group are
    curated because the enzymology is real, not because the disease relevance is
    established.
  evidence:
  - reference: PMID:41168165
    reference_title: "Pseudouridylation of 7SK by PUS7 regulates Pol II transcription elongation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Whether and how Ψ may regulate transcription have not been adequately
      studied.
    explanation: >-
      The authors' own framing of the transcription arm as newly opened rather
      than settled, which is why the hypothesis group status is EMERGING.
discussions:
- discussion_id: pus7_no_mouse_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does germline Pus7 loss in the mouse reproduce the human neurodevelopmental
    phenotype at all, and if not, why?
  attaches_to:
  - pathophysiology#Impaired Neuronal Development and Function
  rationale: >-
    The only in vivo evidence that PUS7 loss produces the behavioural phenotype
    comes from Drosophila, and the only mammalian in vivo evidence is a
    region-specific adult knockdown in mouse infralimbic prefrontal cortex, which
    models plasticity rather than development. No published Pus7-null mouse has
    been characterised for brain size, growth, or behaviour, even though mouse
    alleles exist. The mismatch matters because the two headline human features,
    progressive microcephaly and growth retardation, have no described animal
    counterpart at all: Drosophila cannot model them, and the mouse has not been
    asked. Without a mammalian germline model the causal step from deregulated
    translation to failed postnatal brain growth remains an inference.
  proposed_experiments:
  - experiment_id: exp_pus7_germline_mouse_phenotyping
    name: Deep phenotyping of a germline Pus7-null mouse
    description: >-
      Characterise a germline Pus7-null mouse for serial head and brain volume,
      body growth, cortical progenitor dynamics, and home-cage aggression, rather
      than relying on the existing high-throughput phenotyping-pipeline summary,
      which reports systems that do not obviously map onto the human phenotype.
  - experiment_id: exp_pus7_conditional_neural_deletion
    name: Conditional Pus7 deletion to test neuron autonomy of brain growth failure
    description: >-
      Delete Pus7 conditionally in neural progenitors versus post-mitotic neurons
      and compare brain-growth outcomes, to determine whether any mammalian
      brain-size phenotype is neuron-autonomous or secondary to systemic growth
      failure.
  evidence:
  - reference: PMID:41094471
    reference_title: "PUS7-dependent Ψ reshapes specific synaptic gene exons to facilitate fear extinction memory formation."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Crucially, PUS7 knockdown in the ILPFC selectively impaired fear extinction
      memory formation without altering baseline fear expression, establishing a
      causal link between Ψ-dependent RNA processing and activity-dependent
      synaptic structural remodeling in this microcircuit.
    explanation: >-
      The best available mammalian in vivo evidence, and simultaneously the
      demonstration of the gap: it is an adult, region-restricted knockdown, not a
      germline developmental model.
- discussion_id: pus7_haematopoietic_discrepancy
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why do PUS7-depleted human haematopoietic stem and progenitor cells show a
    severe commitment defect while PUS7-deficient patients have no reported
    haematological disease?
  attaches_to:
  - pathophysiology#Failure of tRF-Mediated Restraint of Translation Initiation
  rationale: >-
    The tRF arm of PUS7 biology was discovered in haematopoiesis, and PUS7
    depletion impairs stem cell commitment and is implicated in aggressive
    myelodysplastic syndrome. Yet no PUS7-deficient patient has been reported with
    cytopenia, marrow failure, or a myeloid neoplasm. Either the human requirement
    is dosage- or context-dependent in a way the depletion experiments do not
    capture, or the haematological phenotype exists and has never been looked for
    because the patients present to neurology and clinical genetics. Resolving
    this affects how much weight the tRF arm should carry in the disease model.
  proposed_experiments:
  - experiment_id: exp_pus7_haematology_ascertainment
    name: Systematic haematological assessment of published PUS7 cohorts
    description: >-
      Report full blood counts and, where justified, marrow morphology across the
      existing PUS7 patient cohorts. This distinguishes a genuine absence of
      haematological phenotype from an absence of ascertainment, which is the
      first thing that must be settled before the discrepancy can be interpreted.
  - experiment_id: exp_pus7_tissue_specific_trf_compensation
    name: Tissue-specific comparison of tRF pseudouridylation and TOP mRNA translation
    description: >-
      Compare tRNA-derived-fragment pseudouridine levels and translation of
      5-prime terminal oligopyrimidine mRNAs between patient-derived
      haematopoietic cells and patient fibroblasts, to test whether the
      haematopoietic compartment compensates for PUS7 loss in a way that
      fibroblasts do not.
  evidence:
  - reference: PMID:29628141
    reference_title: "Pseudouridylation of tRNA-Derived Fragments Steers Translational Control in Stem Cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Remarkably, dysregulation of this posttranscriptional regulatory circuitry
      impairs hematopoietic stem cell commitment and is common to aggressive
      subtypes of human myelodysplastic syndromes.
    explanation: >-
      States the haematopoietic requirement that patients do not appear to
      manifest.
- discussion_id: pus7_microcephaly_causal_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what cellular route does deregulated translation reduce postnatal brain
    growth in PUS7 deficiency?
  attaches_to:
  - pathophysiology#Impaired Postnatal Brain Growth
  rationale: >-
    The molecular defect and the clinical endpoint are both well established, but
    the step between them is entirely inferred. There is no evidence in any human
    or model system for neural progenitor pool depletion, altered cell cycle exit,
    increased apoptosis, or reduced neuronal arborisation in PUS7 deficiency. The
    published framing of the link is explicitly hedged, using the word
    "presumably". Because brain MRI architecture is normal in most patients, the
    deficit is one of growth rather than malformation, which narrows the candidate
    mechanisms but does not identify them. No iPSC-derived neural or organoid
    model of PUS7 deficiency exists.
  proposed_experiments:
  - experiment_id: exp_pus7_ipsc_neural_organoid
    name: PUS7-null iPSC-derived neural progenitors and cortical organoids
    description: >-
      Generate PUS7-null induced pluripotent stem cell lines and differentiate
      them to neural progenitors and cortical organoids, measuring progenitor
      proliferation, cell-cycle exit, apoptosis, and organoid size against
      isogenic controls. No such model currently exists, and it is the most direct
      test of whether the microcephaly reflects progenitor pool depletion.
  - experiment_id: exp_pus7_neural_ribosome_profiling
    name: Ribosome profiling in PUS7-null neural progenitors
    description: >-
      Perform ribosome profiling in PUS7-null neural progenitors to identify which
      transcripts change translational efficiency, and test specifically whether
      any are established microcephaly genes. This would convert the inferred
      translation-to-brain-growth link into a named set of effectors.
  evidence:
  - reference: PMID:30778726
    reference_title: "PUS7 mutations impair pseudouridylation in humans and cause intellectual disability and microcephaly."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We and others have previously emphasized the predilection of Mendelian
      diseases caused by tRNA modification genes to CNS involvement and how this
      suggests the vulnerability of the brain to any perturbation of tRNA
      modification, presumably through its deleterious effect on protein synthesis
    explanation: >-
      The hedged wording is itself the evidence for the gap: the field states the
      link as a presumption, not a finding.
- discussion_id: pus7_no_adult_natural_history
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the adult course, life expectancy, and adult morbidity profile of
    PUS7-related neurodevelopmental disorder?
  attaches_to:
  - pathophysiology#Cognitive and Behavioural Dysfunction
  rationale: >-
    Roughly 30 patients have been published and the oldest are adolescents; one
    cohort states its patients ranged from 2 to 18 years. No adult patient has
    been described, no natural-history study or registry exists, and no deaths
    have been reported. Two features are documented as progressive into
    adolescence, head circumference and hearing, and behaviour worsens over the
    same period, so extrapolating a stable adult course from paediatric
    cross-sections is not safe. Families cannot currently be given prognostic
    information beyond childhood.
  proposed_experiments:
  - experiment_id: exp_pus7_natural_history_registry
    name: International PUS7 natural-history registry
    description: >-
      Establish a prospective international registry collecting longitudinal head
      circumference, growth, audiometry, behavioural, and adaptive-function
      measures on genotype-confirmed individuals, with the explicit aim of
      extending observation past adolescence.
  - experiment_id: exp_pus7_family_recontact
    name: Recontact of previously published PUS7 families
    description: >-
      Recontact the published families, several of which were reported five or
      more years ago, to obtain adolescent and adult follow-up. This is the
      fastest available route to any adult data at all and requires no new
      ascertainment.
  evidence:
  - reference: PMID:33100873
    reference_title: "Next generation sequencing reveals novel homozygous frameshift in PUS7 and splice acceptor variants in AASS gene leading to intellectual disability, developmental delay, dysmorphic feature and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      nine patients ranged in age from 2 to 18 years old
    explanation: >-
      Documents the paediatric ceiling of the published age range.
- discussion_id: pus7_genotype_phenotype_unresolved
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Do PUS7 missense alleles behave as hypomorphs that spare growth and head
    circumference, or as complete loss of function indistinguishable from
    truncating alleles?
  attaches_to:
  - pathophysiology#Biallelic PUS7 Loss-of-Function Variants
  rationale: >-
    Two published positions conflict. Darvish and colleagues propose that their
    missense family's milder phenotype, without microcephaly or short stature,
    reflects a hypomorphic allele in contrast to the null truncating alleles.
    Against that, the missense allele in the Shaheen cohort produced severe
    microcephaly and behaved as a complete loss of function in yeast
    complementation. A truncating-versus-missense severity rule therefore cannot
    currently be given to families. The 13-patient, 15-variant cohort of
    PMID:42249560 is framed by its own authors as improving genotype-phenotype
    correlation and is the priority source for resolving this, but its full text
    was not accessible during this curation pass.
  proposed_experiments:
  - experiment_id: exp_pus7_uniform_missense_functional_assay
    name: Uniform functional assay of all reported PUS7 missense alleles
    description: >-
      Assay every reported PUS7 missense allele in the same yeast complementation
      and tRNA pseudouridine-13 systems, so that residual catalytic activity is
      measured on one scale rather than being inferred backwards from clinical
      severity. This is the only way to test the hypomorph hypothesis
      independently of the phenotype it is meant to explain.
  - experiment_id: exp_pus7_pooled_genotype_phenotype_analysis
    name: Pooled genotype-phenotype analysis including the 2026 cohort
    description: >-
      Extract per-variant phenotype data from the 13-patient, 15-variant cohort of
      PMID:42249560 once full text is accessible, pool it with the earlier
      cohorts, and test the missense-versus-truncating severity hypothesis across
      the combined series.
  evidence:
  - reference: PMID:31583274
    reference_title: "A novel PUS7 mutation causes intellectual disability with autistic and aggressive behaviors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The absence of highly extreme phenotypes such as short stature or
      microcephaly in this family might reflect genotype–phenotype correlation,
      since this family presented with a PUS7 missense mutation that may be
      hypomorphic, while previously reported families carried nonsense or
      frameshift mutations that may cause loss of function.
    explanation: >-
      One side of the controversy: the hypomorphic-missense proposal.
  - reference: PMID:30778726
    reference_title: "PUS7 mutations impair pseudouridylation in humans and cause intellectual disability and microcephaly."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, the missense variant of the S. cerevisiae ortholog failed to
      complement the growth defect of S. cerevisiae pus7Δ trm8Δ mutants.
    explanation: >-
      The other side: a patient missense allele that is a complete loss of
      function in a functional assay, in patients who did have severe

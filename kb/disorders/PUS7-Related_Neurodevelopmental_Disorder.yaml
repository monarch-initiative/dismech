- name: Hearing Amplification
  description: >-
    Sensorineural hearing loss can be progressive and severe, and can be masked
    early on by coexisting middle-ear effusion. Formal audiological assessment is
    warranted in every affected child, and hearing aids have been fitted in at
    least one reported patient.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid provision
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:

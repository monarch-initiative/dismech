name: PUS7-Related Neurodevelopmental Disorder
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
description: >-
  PUS7-related neurodevelopmental disorder (intellectual developmental disorder
  with abnormal behavior, microcephaly, and short stature; IDDABS, MIM 618342) is
  an ultra-rare autosomal recessive disorder caused by biallelic variants in PUS7,
  which encodes the RNA-independent pseudouridine synthase 7. The core clinical
  picture is moderate to severe intellectual disability with delayed or absent
  speech, postnatal and often progressive microcephaly, poor somatic growth with
  short stature, and behavioural disturbance dominated by aggression that begins
  unusually early. Less common but more distinctive findings include sensorineural
  hearing loss, autistic traits, self-injurious behaviour, motor stereotypies and
  sleep disturbance. Mechanistically, disease alleles abolish PUS7 catalytic
  activity, removing pseudouridine from position 13 of at least ten cytosolic
  tRNAs and from PUS7-dependent mRNA and tRNA-derived-fragment substrates.
  Because PUS7-modified tRNA-derived fragments normally restrain translation
  initiation, loss of the enzyme deregulates global protein synthesis, and the
  developing brain appears to be the tissue least able to tolerate that
  perturbation.
notes: >-
  Named-entity-confusion guardrail. This entry is anchored strictly on
  MONDO:0032687 / OMIM:618342 / PUS7 (HGNC:26033); the anchor was confirmed by
  running `runoak -i sqlite:obo:mondo info MONDO:0032687 -O obo` and reading the
  `relationship: RO:0004003 HGNC:26033 ! PUS7` line before any curation began.
  The pseudouridine synthase family is a high-risk named-entity-confusion class
  because several of its members cause independent Mendelian diseases and the
  literature routinely uses the shared phrase "impaired pseudouridylation" for
  all of them. Three sibling entities are deliberately kept separate here and are
  recorded in `differential_diagnoses`: PUS1 (hgnc:15508) causes myopathy, lactic
  acidosis and sideroblastic anaemia 1 (MONDO:0024553), a mitochondrial
  muscle/marrow disease with no intellectual disability; PUS3 (hgnc:25461) causes
  MONDO:0014886, a distinct autosomal recessive intellectual disability and
  microcephaly syndrome acting at tRNA positions 38 and 39 rather than position
  13; and PUS7L (hgnc:25276) is a separate paralogous gene. Every citation used
  in this entry was checked to name PUS7 specifically, and the several dozen
  PUS7 PubMed hits that are cancer-biology or epitranscriptomic-methodology
  papers were excluded from all clinical claims.

  Blended-phenotype and attribution discipline. Two of the reported cohorts carry
  a confounding second locus or a second diagnosis. (1) In PMID:33100873 the two
  affected Saudi brothers carry, in addition to the homozygous PUS7 frameshift, a
  splice-acceptor variant in AASS, the hyperlysinaemia type I gene; that paper
  itself states that hyperlysinaemia type I patients have "nonspecific seizure,
  hypotonia, mildly delayed psychomotor development". The seizure and hypotonia
  observed in those brothers are therefore curated with `supports: PARTIAL` and
  are explicitly flagged as unattributable to PUS7 alone, and hyperlysinaemia is
  listed as a differential. (2) In PMID:35144859 the two NIH Undiagnosed Diseases
  Program siblings have Lesch-Nyhan-like hyperuricaemia and self-injurious
  behaviour but no HPRT1 variant; the authors propose a secondary,
  translation-mediated reduction in HPRT1 protein as the explanation, which is
  curated as a mechanism node and as a Lesch-Nyhan differential.

  Frequency discipline. Bands are derived only from published individual-level
  denominators and the arithmetic is recorded in each phenotype's `notes:`. The
  usable cohorts are PMID:30526862 (6 individuals), PMID:30778726 (3
  individuals), PMID:31583274 (2 siblings), PMID:33100873 (2 brothers),
  PMID:35144859 (2 siblings) and PMID:37067188 (1 individual). Where only a
  qualitative statement exists (for example the PMID:42226002 review's list of
  "the most frequent features" across 17 cases, with no per-feature counts) the
  band is omitted rather than guessed; the sole exception is the group of
  features that review explicitly calls "less common", which is mapped to
  OCCASIONAL and is stated as such in the relevant notes. The 13-patient cohort
  in PMID:42249560 reports no per-feature counts in its abstract, so it
  contributes to the case-count prevalence estimate but not to any frequency
  band.

  GeneReviews. No GeneReviews chapter exists for this disorder. Two PubMed
  E-utilities searches were run and both returned zero results: `PUS7
  GeneReviews[All Fields]` and `pseudouridine synthase GeneReviews[TI]`. A
  `grep -rl "PUS7" references_cache/` at curation time returned only the primary
  papers cited below plus PMID:39091849 (a tRNA-acetylation paper that cites
  PMID:30526862 in its bibliography), confirming no cached GeneReviews text was
  overlooked.

  Structured-source citations unavailable, and in this case largely unavailable
  upstream too. Two things were checked rather than assumed. (1) Orphanet: an
  EBI OLS4 search of ORDO for `PUS7` returns 0 hits, and the deep-research run
  independently reported that no PUS7-specific ORPHA entity exists. There is
  therefore no ORPHA code to cite, not merely an uncachable one. (2) ClinGen:
  the deep-research run reports zero gene-disease validity, dosage, and
  actionability assertions for PUS7, so there is no `CGGV:` or `CGDS:` assertion
  to cite either. Independently of that, `data/orphadata/`, `data/clingen/` and
  `data/clingen-dosage/` in this working tree contain only MANIFEST.yaml stubs
  with no bulk data, and those pins are stale and un-refreshable pending #7622,
  so no structured-source record could have been generated regardless. The
  gene-disease relationship is supported here entirely by primary literature.
  Gene2Phenotype does carry PUS7 on the DD panel (G2P02633, biallelic,
  loss of function, confidence Strong) but dismech has no G2P reference prefix.

  Deep research provenance. `just research-disorder claude_code
  PUS7-Related_Neurodevelopmental_Disorder` was run on 2026-08-01 (17.5 minutes,
  12 web searches, 95 turns, 47 citations, models claude-haiku-4-5 and
  claude-opus-5[1m]); the report is at
  research/PUS7-Related_Neurodevelopmental_Disorder-deep-research-claude_code.md.
  Its NEC preflight independently reached the same conclusion recorded above.
  Every PMID it suggested that is cited here was fetched with
  `just fetch-reference` and every snippet was taken from the resulting cache
  file, not from the report.

  Oncology-literature guardrail. Roughly half of the PUS7 PubMed record set is
  cancer biology in which PUS7 is OVEREXPRESSED and its INHIBITION is the
  proposed therapy - the mechanistic opposite of this recessive
  loss-of-function disorder. The PUS7 inhibitors developed for glioblastoma (C4
  and C17/NSC107512, PMID:35121864) are therefore conceptually contraindicated
  here and are deliberately not curated as treatments. PMID:35121864 and
  PMID:35292784 are cited in this entry only for the substrate-level mechanisms
  they establish (codon-specific translational control via tRNA pseudouridine,
  and the mTOG-PABPC1 translational brake), never for their prognostic or
  therapeutic claims.

  Full-text versus abstract snippets. PMID:30778726 and PMID:27055666 are cached
  as PubMed Central full text, so several snippets in this entry are taken from
  their bodies rather than their abstracts (the individual patient descriptions,
  the PUS1/PUS3/PUS7L paragraph, and the treatment sentences). All other snippets
  are from abstracts.

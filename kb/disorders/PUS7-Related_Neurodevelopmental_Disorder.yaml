  evidence:
  - reference: PMID:33100873
    reference_title: "Next generation sequencing reveals novel homozygous frameshift in PUS7 and splice acceptor variants in AASS gene leading to intellectual disability, developmental delay, dysmorphic feature and microcephaly."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He was also reported difficulties in swallowing with nonspecific seizure,
      hypotonia, mildly delayed psychomotor development.
    explanation: >-
      The only individual-level seizure report in the PUS7 literature, in a proband
      who also carries an AASS splice-acceptor variant, hence PARTIAL.
  - reference: PMID:30778726
    reference_title: "PUS7 mutations impair pseudouridylation in humans and cause intellectual disability and microcephaly."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While the phenotype we present in the three study patients supports the
      consistent involvement of cognition and postnatal brain growth and lack of
      epilepsy in PUS7 deficiency, it also suggests that other aspects are more
      variable.
    explanation: >-
      Positively asserts the absence of epilepsy as a consistent feature of PUS7
      deficiency, refuting seizures as a core phenotype.
genetic:
- name: PUS7
  gene_term:
    preferred_term: PUS7
    term:
      id: hgnc:26033
      label: PUS7
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    PUS7 (7q22.3, MIM 616261) encodes the RNA-independent pseudouridine synthase
    7, a stand-alone TruD-family enzyme that isomerises uridine to pseudouridine
    without a guide RNA. The protein contains an N-terminal R3H domain and a
    C-terminal TruD (PseudoU_synth_ScPUS7) catalytic domain spanning approximately
    residues 370 to 580. All reported disease alleles are biallelic and either
    truncate the protein before the catalytic domain, delete the C-terminus, or
    substitute conserved residues within or near the TruD domain. Inheritance is
    autosomal recessive; the structured Inheritance record is at disease level.

    Gene identity was verified against the MONDO gene-association relation
    (`RO:0004003 HGNC:26033 ! PUS7`) and against the HGNC record
    (`hgnc:26033`, omim:616261). This is deliberately distinct from the paralogue
    PUS7L (hgnc:25276) and from the family members PUS1 (hgnc:15508) and PUS3
    (hgnc:25461), each of which causes a separate disease; see
    differential_diagnoses. Note that MIM 616261 is the PUS7 GENE entry, whereas
    MIM 618342 is the DISEASE entry (IDDABS) that MONDO:0032687 cross-references;
    PMID:33100873 quotes both numbers.
  evidence:
  - reference: PMID:30778726
    reference_title: "PUS7 mutations impair pseudouridylation in humans and cause intellectual disability and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results confirm that PUS7 is a bona fide Mendelian disease gene and
      expand the list of human diseases caused by impaired pseudouridylation.
    explanation: >-
      Independent replication establishing PUS7 as a definitive Mendelian disease
      gene.
  - reference: PMID:31583274
    reference_title: "A novel PUS7 mutation causes intellectual disability with autistic and aggressive behaviors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PUS7 encodes for a pseudouridine synthase 7 that catalyzes the isomerization
      of RNA uridine to RNA pseudouridine (Psi), which is the most abundant
      modified nucleotide found in all cellular RNAs and which may function as an
      RNA chaperone.
    explanation: >-
      Describes the gene product and its enzymatic function.
  variants:
  - name: c.89_90del (p.Thr30Lysfs*20)
    type: FRAMESHIFT
    clinical_significance: PATHOGENIC
    description: >-
      Homozygous frameshift in one of the three founding families; triggers
      nonsense-mediated decay.
    evidence:
    - reference: PMID:31583274
      reference_title: "A novel PUS7 mutation causes intellectual disability with autistic and aggressive behaviors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Two homozygous mutations c.89_90del (p.Thr30Lysfs20*) and c.1348C>T
        (p.Arg450*) resulted in nonsense-mediated mRNA decay
      explanation: >-
        Names the allele and its nonsense-mediated-decay consequence.
  - name: c.1348C>T (p.Arg450*)
    type: NONSENSE
    clinical_significance: PATHOGENIC
    description: >-
      Homozygous nonsense allele in a founding family; triggers nonsense-mediated
      decay.
    evidence:
    - reference: PMID:31583274
      reference_title: "A novel PUS7 mutation causes intellectual disability with autistic and aggressive behaviors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Two homozygous mutations c.89_90del (p.Thr30Lysfs20*) and c.1348C>T
        (p.Arg450*) resulted in nonsense-mediated mRNA decay
      explanation: >-
        Names the allele and its nonsense-mediated-decay consequence.
  - name: Deletion of the penultimate exon 15
    type: DELETION
    clinical_significance: PATHOGENIC
    description: >-
      A homozygous deletion of the penultimate exon that escapes nonsense-mediated
      decay and produces a protein lacking the C-terminal TruD catalytic domain.
    evidence:
    - reference: PMID:31583274
      reference_title: "A novel PUS7 mutation causes intellectual disability with autistic and aggressive behaviors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        while the third mutation, consisting of a homozygous deletion encompassing
        the penultimate exon 15, escaped the nonsense-mediated mRNA decay to encode
        a mutant protein missing the C terminus including the TruD catalytic domain
      explanation: >-
        Describes the allele's escape from decay and the resulting catalytically
        dead protein.
  - name: c.1507G>T (p.Asp503Tyr)
    type: MISSENSE
    clinical_significance: PATHOGENIC
    description: >-
      A homozygous missense allele within the TRUD catalytic domain. Its yeast
      equivalent (pus7-D478Y) fails to complement a pus7 growth defect, showing it
      is a complete loss of function rather than a partial one.
    evidence:
    - reference: PMID:30778726
      reference_title: "PUS7 mutations impair pseudouridylation in humans and cause intellectual disability and microcephaly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the missense variant p. (Asp503Tyr) is located within the TRUD domain (the
        pseudouridine catalytic domain of PUS7), predicted to be probably damaging
        (1) by Polyphen-2, deleterious by SIFT (0), "disease causing" by
        MutationTaster and has a CADD_phred of 29.4
      explanation: >-
        Localises the allele to the catalytic domain and summarises the in silico
        pathogenicity evidence.
  - name: c.329_332delCTGA (p.Thr110Argfs*4)
    type: FRAMESHIFT
    clinical_significance: PATHOGENIC
    description: >-
      A recurrent homozygous frameshift reported independently in a Saudi girl and
      in an Italian male infant with self-injurious behaviour, sleep disturbance
      and motor stereotypies.
    evidence:
    - reference: PMID:37067188
      reference_title: "A PUS7 gene pathogenic variant causing self-injurious behavior, sleep disturbances, and developmental delay: A case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We describe the case of a male infant with a homozygous truncating
        pathogenic variant in the PUS7 gene (c.329_332delCTGA; p.Thr110Argfs*4)
      explanation: >-
        Names the allele in the Italian proband.
  - name: c.606_607delGA (p.Ser282CysfsTer9)
    type: FRAMESHIFT
    clinical_significance: PATHOGENIC
    description: >-
      A homozygous frameshift identified in two Saudi brothers who also carry an
      AASS splice-acceptor variant.
    evidence:
    - reference: PMID:33100873
      reference_title: "Next generation sequencing reveals novel homozygous frameshift in PUS7 and splice acceptor variants in AASS gene leading to intellectual disability, developmental delay, dysmorphic feature and microcephaly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We detected two mutations one homozygous frameshift mutation
        c.606_607delGA, p.Ser282CysfsTer9 in the PUS7 gene and other splice
        acceptor variants c.1767-1 G > A in the AASS gene in the analysis.
      explanation: >-
        Names the PUS7 allele and, in the same sentence, the confounding AASS
        allele that requires the attribution caveats recorded elsewhere in this
        entry.
  - name: c.382G>A (p.Gly128Arg)
    type: MISSENSE
    clinical_significance: PATHOGENIC
    description: >-
      A homozygous missense allele in a consanguineous Afghani family with a milder
      presentation lacking microcephaly and short stature; proposed to be
      hypomorphic.
    evidence:
    - reference: PMID:31583274
      reference_title: "A novel PUS7 mutation causes intellectual disability with autistic and aggressive behaviors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We report a novel PUS7 homozygous mutation resulting in p.Gly128Arg
        amino-acid translation in a consanguineous Afghani family presenting with
        similar but milder clinical features without microcephaly and short stature
      explanation: >-
        Names the allele and documents its milder genotype-phenotype correlation.
diagnosis:
- name: Molecular diagnosis by exome or genome sequencing
  description: >-
    Biallelic PUS7 variants are identified by exome or genome sequencing. There
    is no clinically distinctive gestalt, so molecular testing establishes the
    diagnosis rather than confirming a clinical suspicion.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:30778726
    reference_title: "Biallelic PUS7 mutations cause intellectual disability, microcephaly, delayed development, and speech impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "exome/genome sequencing of children with intellectual disability will incorporate it in their annotation"
    explanation: >-
      The authors state that PUS7 variants will be encountered through exome or
      genome sequencing of children with intellectual disability, which is the
      diagnostic route this entry describes.
  - reference: PMID:30778726
    reference_title: "Biallelic PUS7 mutations cause intellectual disability, microcephaly, delayed development, and speech impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome capture was performed using the TruSeq Exome Enrichment kit"
    explanation: >-
      Documents that exome sequencing was the method actually applied to the
      affected individuals in the founding series.
- name: tRNA pseudouridine-13 assay for variant interpretation
  description: >-
    Loss of pseudouridine at position 13 in patient-derived tRNA is the direct
    functional readout of PUS7 deficiency, and is the assay that distinguishes a
    pathogenic PUS7 variant from a variant of uncertain significance.
  diagnosis_term:
    preferred_term: molecular analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:30778726
    reference_title: "Biallelic PUS7 mutations cause intellectual disability, microcephaly, delayed development, and speech impairment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "this may also serve as a very helpful assay for the proper classification of variants of unknown significance"
    explanation: >-
      The authors state directly that the pseudouridylation assay can be used to
      classify variants of unknown significance in PUS7.
  - reference: PMID:30778726
    reference_title: "Biallelic PUS7 mutations cause intellectual disability, microcephaly, delayed development, and speech impairment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both variants were associated with a specific reduction of Ψ13 in their tRNAs."
    explanation: >-
      Establishes reduced tRNA pseudouridine-13 in patient-derived cells as the
      functional readout the assay measures.
- name: Neuroimaging and EEG as exclusionary investigations
  description: >-
    Brain MRI and EEG are typically normal in this disorder. Their value is
    exclusionary - normal structural imaging and a normal EEG argue against the
    structural brain malformations and epileptic encephalopathies that otherwise
    sit in the differential.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:30778726
    reference_title: "Biallelic PUS7 mutations cause intellectual disability, microcephaly, delayed development, and speech impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EEG recording was normal. Brain MRI showed normal brain architecture."
    explanation: >-
      Documents normal EEG and normal brain architecture in an affected
      individual, supporting both investigations as exclusionary rather than
      confirmatory.
- name: Audiometric assessment for sensorineural hearing loss
  description: >-
    Formal audiometry is warranted because the sensorineural hearing loss in this
    disorder can be misattributed to a coincidental conductive cause. In the
    founding series the hearing loss was first ascribed to chronic middle ear
    effusion and was only recognised as sensorineural after ventilation tubes
    failed to help, so a poor response to conductive management should prompt
    re-evaluation rather than reassurance.
  diagnosis_term:
    preferred_term: audiometry
    term:
      id: NCIT:C38036
      label: Audiometric Test
  evidence:
  - reference: PMID:30778726
    reference_title: "Biallelic PUS7 mutations cause intellectual disability, microcephaly, delayed development, and speech impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hearing loss was suspected due to chronic middle ear effusion but her poor response to ventilation tubes prompted re-evaluation and sensorineural hearing loss was confirmed."
    explanation: >-
      Documents the initial misattribution to middle ear effusion and the
      re-evaluation that confirmed sensorineural hearing loss.
treatments:
- name: Special Education and Developmental Support
  description: >-
    There is no disease-modifying therapy. Management is entirely supportive and
    is built around structured special education, which affected children in the
    published cohorts have received.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: special education
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  notes: >-
    NCIT:C159269 (Special Education) exists but is not reachable from
    NCIT:C25218, the clinical-intervention root that the TreatmentTerm dynamic
    enum is constrained to, so the more general Supportive Care term is bound
    here and the specific action is carried in preferred_term.
  evidence:
  - reference: PMID:30778726
    reference_title: "PUS7 mutations impair pseudouridylation in humans and cause intellectual disability and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He was admitted in a school for special education.
    explanation: >-
      Documents special-education placement as the management actually applied to
      an affected proband.
- name: Speech and Language Therapy
  description: >-
    Speech delay is near-universal and is often the presenting complaint, so
    speech and language therapy is a core component of supportive management.
    Expressive vocabulary can remain very limited into adolescence, and
    augmentative communication should be considered where speech is absent.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Speech Language Therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_phenotypes:
  - preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  notes: >-
    This is a standard-of-care inference from the documented severity of the
    speech deficit rather than a therapy whose efficacy has been tested in PUS7
    deficiency; no trial or outcome data exist for this disorder. The cited
    snippet establishes the indication, not the outcome.
  evidence:
  - reference: PMID:30778726
    reference_title: "PUS7 mutations impair pseudouridylation in humans and cause intellectual disability and microcephaly."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He showed a severe speech delay and his expressive vocabulary was limited to
      about 30 words.
    explanation: >-
      Establishes the indication for speech and language therapy; no efficacy data
      exist, so support is PARTIAL.
- name: Risperidone for Aggressive Behavior
  description: >-
    Aggression is the most burdensome behavioural feature and has been managed
    pharmacologically. Risperidone was introduced in a 16-year-old proband who
    presented with aggressive behaviour.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: risperidone

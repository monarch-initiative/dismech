        id: CHEBI:8871
        label: risperidone
  target_phenotypes:
  - preferred_term: Aggressive behavior
    term:
      id: HP:0000718
      label: Aggressive behavior
  notes: >-
    This is a single-patient observation of treatment initiation, with no reported
    outcome. It is recorded because it is the only pharmacological intervention
    documented anywhere in the PUS7 literature, and evidence is set to PARTIAL to

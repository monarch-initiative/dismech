pathophysiology:
- name: Cathepsin A (PPCA) Deficiency and Secondary Combined NEU1/GLB1 Deficiency
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency"
  description: >-
    Biallelic CTSA variants abolish protective protein/cathepsin A (PPCA), an indispensable
    lysosomal chaperone/transport protein and serine carboxypeptidase required to assemble,
    stabilize, and catalytically activate the lysosomal multienzyme complex containing
    neuraminidase-1 (NEU1) and beta-galactosidase (GLB1). Loss of PPCA causes rapid degradation of
    GLB1 and complete loss of NEU1 catalytic activity.

differential_diagnoses:
- name: Juvenile sialidosis type 2
  description: >-
    Primary NEU1 deficiency (sialidosis type II) shares dysostosis multiplex, coarse facies,
    hepatosplenomegaly, cherry-red spots, and myoclonus with galactosialidosis, but results from
    biallelic NEU1 variants with isolated neuraminidase deficiency and normal GLB1 and PPCA
    activity.
  disease_term:
    preferred_term: juvenile sialidosis type 2
    term:
      id: MONDO:0019681
      label: juvenile sialidosis type 2
  distinguishing_features:
  - Primary NEU1 deficiency without secondary beta-galactosidase or cathepsin A deficiency, versus the combined NEU1/GLB1 deficiency and primary PPCA defect of galactosialidosis.
  evidence:
  - reference: PMID:23915561
    reference_title: "Galactosialidosis: review and analysis of CTSA gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the secondary deficiency of β-galactosidase\n(GLB1) and neuraminidase 1 (NEU1)"
    explanation: "Galactosialidosis has combined NEU1 and GLB1 deficiency, unlike isolated NEU1-deficient sialidosis."
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Patients with sialidosis and those with GS share clinical and biochemical features that are attributed at least in part to the loss of NEU1 function in both diseases"
    explanation: "Shared loss of NEU1 function explains the close clinical and biochemical overlap between sialidosis and galactosialidosis."
- name: Congenital sialidosis type 2
  description: >-
    Severe congenital/hydropic sialidosis type II presents in utero or at birth with fetal hydrops,
    ascites, hepatosplenomegaly, and skeletal dysplasia closely mimicking early-infantile
    galactosialidosis.
  disease_term:
    preferred_term: congenital sialidosis type 2
    term:
      id: MONDO:0019682
      label: congenital sialidosis type 2
  distinguishing_features:
  - Isolated primary NEU1 deficiency due to biallelic NEU1 variants with preserved beta-galactosidase and cathepsin A activities.
  evidence:
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The severe, early onset forms of the disease develop a systemic condition associated with fetal hydrops, skeletal dysplasia, visceromegaly, renal and cardiac failure, variable neurological involvement and early death."
    explanation: "Congenital type II sialidosis and early-infantile galactosialidosis share the severe fetal hydrops and visceromegaly presentation, requiring enzymatic and molecular differentiation."
- name: Sialidosis type 1
  description: >-
    Late-onset cherry-red spot myoclonus syndrome (sialidosis type I) overlaps with juvenile/adult
    galactosialidosis in presenting with macular cherry-red spots, myoclonus, and cerebellar
    ataxia.
  disease_term:
    preferred_term: sialidosis type 1
    term:
      id: MONDO:0019346
      label: sialidosis type 1
  distinguishing_features:
  - Isolated NEU1 deficiency with absence of dysostosis multiplex, coarse facies, or beta-galactosidase/PPCA deficiency.
  evidence:
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Severely reduced or deficient NEU1 activity secondary to a primary defect of the lysosomal serine carboxypeptidase, protective protein cathepsin A (PPCA) is characteristic of galactosialidosis (GS)"
    explanation: "Galactosialidosis is distinguished from primary NEU1 deficiency by the primary defect in PPCA (CTSA) and secondary GLB1 deficiency."
- name: GM1 gangliosidosis type 1
  description: >-
    Primary acid beta-galactosidase (GLB1) deficiency presents with infantile neurodegeneration,
    macular cherry-red spot, hepatosplenomegaly, coarse facies, and dysostosis multiplex overlapping
    galactosialidosis.
  disease_term:
    preferred_term: GM1 gangliosidosis type 1
    term:
      id: MONDO:0009260
      label: GM1 gangliosidosis type 1
  distinguishing_features:
  - Primary GLB1 mutations cause isolated acid beta-galactosidase deficiency with normal neuraminidase-1 (NEU1) and cathepsin A (PPCA) activities.
  evidence:
  - reference: PMID:12559848
    reference_title: "Imbalanced substrate specificity of mutant beta-galactosidase in patients with Morquio B disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "G(M1)-gangliosidosis and Morquio B disease are distinct in clinical and biochemical features, but both disorders are caused by genetic defects of the same enzyme, acid beta-galactosidase (beta-Gal)."
    explanation: "GM1 gangliosidosis is caused by primary genetic defects in GLB1 (acid beta-galactosidase), whereas beta-galactosidase deficiency in galactosialidosis is secondary to CTSA/PPCA loss."
- name: Mucopolysaccharidosis type 4B (Morquio B disease)
  description: >-
    Allelic GLB1 disorder presenting with spondyloepiphyseal dysplasia, vertebral deformities, and
    corneal clouding that overlap the skeletal and ocular manifestations of galactosialidosis.
  distinguishing_features:
  - Primary GLB1 variants with keratan sulfate storage and preserved NEU1 and PPCA activity, without the sialyloligosacchariduria or NEU1 deficiency of galactosialidosis.
  evidence:
  - reference: PMID:12559848
    reference_title: "Imbalanced substrate specificity of mutant beta-galactosidase in patients with Morquio B disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Five skin fibroblast lines from patients with G(M1)-gangliosidosis (2 cases; R201C/R201C and I51T/I51T), Morquio B disease (2 cases; W273L/W273L and Y83H/R482C), and galactosialidosis (1 case; Y395C/S90L) were used as enzyme sources."
    explanation: "Biochemical comparison of GM1 gangliosidosis, Morquio B disease, and galactosialidosis fibroblasts distinguishes primary GLB1 defects from secondary beta-galactosidase deficiency in galactosialidosis."
treatments:
- name: Supportive Care
  description: >-
    No approved disease-modifying therapy is in routine clinical use; multidisciplinary management
    is supportive and symptom-directed across neurologic (anticonvulsants for seizures and
    myoclonus), orthopedic, ophthalmic, audiologic, cardiac, and renal manifestations.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: clinicaltrials:NCT01891422
    reference_title: "Longitudinal Studies of the Glycoproteinoses"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Longitudinal studies of these conditions are needed in order to better define how common the diseases are, identify clinical features which could contribute to early diagnoses, detail progression of the diseases, assess the supportive therapies currently used, and identify potential treatments."
    explanation: Natural-history investigation of the glycoproteinoses (including galactosialidosis) confirms that current clinical management relies on supportive therapies while disease-modifying treatments remain under investigation.
- name: AAV-PPCA Gene Therapy (Preclinical)
  description: >-
    Preclinical adeno-associated virus (AAV)-mediated delivery of human CTSA/PPCA restores PPCA,
    NEU1, and GLB1 activities and corrects visceral, skeletal, and cerebellar pathology in Ppca-/-
    mice, providing proof-of-concept for translational gene therapy.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Cathepsin A (PPCA) Deficiency and Secondary Combined NEU1/GLB1 Deficiency
    treatment_effect: RESTORES
    description: AAV-mediated delivery of functional PPCA restores the protective protein required to stabilize and activate NEU1 and GLB1 in lysosomes.
    evidence:
    - reference: PMID:26949572
      reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The same vector was used successfully for a comprehensive, preclinical gene therapy trial in the Ppca−/− mice, the mouse model of GS"
      explanation: Preclinical AAV-PPCA gene therapy successfully rescued the Ppca-/- mouse model of galactosialidosis.
  evidence:
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In this regard, the AAV-PPCA–mediated gene therapy that will be applied for the treatment of patients with galactosialidosis could become suitable also for type I sialidosis."
    explanation: Review highlights AAV-PPCA gene therapy developed for galactosialidosis.
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The same vector was used successfully for a comprehensive, preclinical gene therapy trial in the Ppca−/− mice, the mouse model of GS"
    explanation: Preclinical AAV-PPCA trial in Ppca-/- mice established proof-of-concept efficacy in the animal model of galactosialidosis.
clinical_trials:
- name: NCT01891422
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    Multicenter observational longitudinal natural-history study of the glycoproteinoses conducted
    by the Greenwood Genetic Center and Rare Diseases Clinical Research Network, explicitly
    enrolling patients with galactosialidosis alongside sialidosis and related oligosaccharidoses.
  evidence:
  - reference: clinicaltrials:NCT01891422
    reference_title: "Longitudinal Studies of the Glycoproteinoses"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Longitudinal studies of these conditions are needed in order to better define how common the diseases are, identify clinical features which could contribute to early diagnoses, detail progression of the diseases, assess the supportive therapies currently used, and identify potential treatments."
    explanation: ClinicalTrials.gov record establishes the longitudinal natural-history study objectives across the glycoproteinoses including galactosialidosis.
- name: NCT04221451
  phase: PHASE_III
  status: TERMINATED
  description: >-
    Multicenter AMETHIST trial of oral venglustat (glucosylceramide synthase inhibitor) in
    late-onset GM2 gangliosidosis that included a secondary open-label basket cohort open to
    juvenile/adult galactosialidosis and sialidosis type 1 to evaluate pharmacodynamic biomarker
    response and safety over 104 weeks.
  evidence:
  - reference: clinicaltrials:NCT04221451
    reference_title: "A Multicenter, Multinational, Randomized, Double-blind, Placebo-controlled Study to Assess the Efficacy, Pharmacodynamics, Pharmacokinetics, Safety, and Tolerability of Venglustat in Late-onset GM2 Gangliosidosis (Tay-Sachs Disease and Sandhoff Disease) Together With a Separate Basket for Juvenile/Adolescent Late-onset GM2 Gangliosidosis and Ultra-rare Diseases Within the Same and Similar Glucosylceramide-based Sphingolipid Pathway"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Secondary population (participants with juvenile/adolescent late-onset GM2 gangliosidosis, GM1 gangliosidosis, saposin C deficiency, sialidosis type 1 or juvenile/adult galactosialidosis): To assess PD response (plasma and CSF GL-1 biomarker and disease specific biomarkers) of venglustat when administered once daily over a 104-week period"
    explanation: ClinicalTrials.gov record documents inclusion of juvenile/adult galactosialidosis in the secondary basket population evaluating oral venglustat.
animal_models:
- name: Ppca-/- knockout mouse
  species: Mouse
  genotype: Ctsa (Ppca) homozygous null (Ppca-/-)
  publication: PMID:26949572
  description: >-
    Homozygous Ppca-/- knockout mouse model of galactosialidosis that recapitulates combined
    secondary NEU1 deficiency, systemic oligosaccharide storage, excessive lysosomal exocytosis,
    and progressive cerebellar ataxia with regional Purkinje cell degeneration, and serves as the
    standard preclinical model for AAV-PPCA gene therapy.
  modeled_mechanisms:
  - target: Progressive Multisystem and Neurodegenerative Disease
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: Recapitulates systemic storage and acute progressive cerebellar ataxia driven by regional Purkinje cell loss.
    evidence:
    - reference: PMID:26949572
      reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The most overt difference is seen in the cerebellum; early in life Ppca−/− mice acquire acute and progressive ataxia that is associated with regional loss of cerebellar Purkinje cells and impaired motor coordination"
      explanation: Ppca-/- mice closely model the cerebellar Purkinje cell loss and progressive ataxia of galactosialidosis.
  evidence:
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The same vector was used successfully for a comprehensive, preclinical gene therapy trial in the Ppca−/− mice, the mouse model of GS"
    explanation: Identifies Ppca-/- mice as the established mouse model of galactosialidosis used in preclinical gene therapy studies.
definitions:
- name: Clinical case definition of galactosialidosis
  definition_type: CASE_DEFINITION
  description: >-
    Galactosialidosis is defined by biallelic CTSA variants abolishing protective
    protein/cathepsin A, with secondary combined deficiency of neuraminidase-1 and
    beta-galactosidase and lysosomal accumulation of sialyloligosaccharides.
  scope: Disease-level case definition for CTSA/PPCA-related galactosialidosis.
  evidence:
  - reference: PMID:23915561
    reference_title: "Galactosialidosis: review and analysis of CTSA gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the CTSA gene, that encodes the protective\nprotein/cathepsin A or PPCA, lead to the secondary deficiency of β-galactosidase\n(GLB1) and neuraminidase 1 (NEU1), causing the lysosomal storage disorder\ngalactosialidosis (GS)."
    explanation: "Anchors the case definition in CTSA/PPCA deficiency with combined NEU1/GLB1 loss."

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutations in the CTSA gene, that encodes the protective\nprotein/cathepsin A or PPCA, lead to the secondary deficiency of β-galactosidase\n(GLB1) and neuraminidase 1 (NEU1), causing the lysosomal storage disorder\ngalactosialidosis (GS)."
      explanation: Biallelic germline CTSA mutations establish galactosialidosis as an inherited Mendelian genetic disorder.
  lysosomal_storage_category:
    classification_value: glycoproteinosis
    notes: >-
      Combined secondary deficiency of neuraminidase-1 (NEU1) and
      beta-galactosidase (GLB1) due to primary protective protein/cathepsin A
      (CTSA/PPCA) deficiency places galactosialidosis among the lysosomal
      glycoproteinoses (oligosaccharidoses).
    evidence:
    - reference: clinicaltrials:NCT01891422
      reference_title: "Longitudinal Studies of the Glycoproteinoses"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The glycoproteinoses are among the most rare and least researched of the lysosomal diseases. The diseases include aspartylglucosaminuria, fucosidosis, galactosialidosis, alpha-mannosidosis, beta-mannosidosis, mucolipidosis II, mucolipidosis III, Schindler disease, and sialidosis."
      explanation: The Longitudinal Studies of the Glycoproteinoses natural-history cohort explicitly includes galactosialidosis within the lysosomal glycoproteinoses.
  icimd_category:
  - classification_value: glycoprotein_degradation
    notes: >-
      ICIMD International Classification of Inherited Metabolic Disorders
      (Ferreira et al. 2021, PMID:33340416), category "Disorders of complex
      molecule degradation", group "Disorders of glycoprotein degradation".
    evidence:
    - reference: PMID:26949572
      reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Severely reduced or deficient NEU1 activity secondary to a primary defect of the lysosomal serine carboxypeptidase, protective protein cathepsin A (PPCA) is characteristic of galactosialidosis (GS)"
      explanation: Galactosialidosis is a disorder of lysosomal glycoprotein degradation driven by primary PPCA deficiency and secondary NEU1/GLB1 deficiency.
  isds_skeletal_category:
  - classification_value: lysosomal_storage_with_skeletal_involvement
    notes: >-

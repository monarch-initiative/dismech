  downstream:
  - target: Sialyloligosaccharide Lysosomal Accumulation
    description: Combined deficiency of alpha-neuraminidase and beta-galactosidase blocks terminal sialic acid and galactose cleavage on glycoproteins and oligosaccharides, causing intralysosomal sialyloligosaccharide accumulation and urinary excretion.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32272755
      reference_title: "Mechanism of Secondary Ganglioside and Lipid Accumulation in Lysosomal Disease."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The deficiency of these enzymes leads to an accumulation of sialyloligosaccharides in lysosomes and in excreted body fluids. Furthermore, juvenile and adult galactosialidosis patients featured an accumulation of GM1, GD1a, GM2, and GM3 in sympathetic and spinal ganglia and in gray matter of the spinal cord [149,150]."
      explanation: Deficiency of NEU1 and GLB1 directly causes accumulation of sialyloligosaccharides in lysosomes and excreted body fluids, alongside secondary ganglioside accumulation in juvenile/adult neural tissue.
  - target: LAMP1 Oversialylation and Excessive Lysosomal Exocytosis
    description: Secondary loss of NEU1 catalytic activity prevents normal desialylation of lysosomal membrane protein LAMP1, driving excessive lysosomal exocytosis (characterized primarily in NEU1-deficient sialidosis models and shared via secondary NEU1 deficiency in galactosialidosis).
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26949572
      reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
      supports: SUPPORT
      evidence_source: OTHER
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      snippet: "Defective or deficient NEU1 activity results in the impaired processing of the sialic acids on LAMP1, which consequently accumulates in an oversialylated state, and has a prolonged half-life."
      explanation: Secondary NEU1 deficiency directly impairs sialic acid cleavage from LAMP1 at the lysosomal membrane (extrapolated from NEU1-deficiency pathogenesis to secondary NEU1 loss in galactosialidosis).

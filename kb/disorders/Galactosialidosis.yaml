has_subtypes:
- name: Early Infantile
  display_name: Early-infantile galactosialidosis
  description: >-
    Severe neonatal/early-infantile form presenting in utero or in the first months of life with
    fetal hydrops, edema, hepatosplenomegaly, skeletal dysplasia, renal and cardiac failure,
    variable neurological involvement, and early lethality.
  evidence:
  - reference: ORPHA:351
    reference_title: "Galactosialidosis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinical presentation can be heterogenous ranging from a severe, early-onset, rapidly progressive infantile form to late onset, slowly progressive juvenile/adult form."
    explanation: Orphanet defines the severe, early-onset, rapidly progressive infantile form at the severe end of the galactosialidosis clinical spectrum.
  - reference: PMID:23915561
    reference_title: "Galactosialidosis: review and analysis of CTSA gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, the in silico functional predictions of all reported missense\nmutations allowed us to closely predict the early infantile, late infantile and\njuvenile phenotypes, also disclosing different degrees of severity in the\njuvenile phenotype."
    explanation: Genotype-phenotype analysis of CTSA missense variants distinguishes early infantile, late infantile, and juvenile/adult subtypes.
- name: Late Infantile
  display_name: Late-infantile galactosialidosis
  description: >-
    Later-infantile form presenting in the first years of life with coarse facial features,
    hepatosplenomegaly, dysostosis multiplex, vertebral deformities, cardiac and hearing
    involvement, and milder or absent early neurodegenerative progression compared with the
    early-infantile subtype.
  evidence:
  - reference: PMID:23915561
    reference_title: "Galactosialidosis: review and analysis of CTSA gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, the in silico functional predictions of all reported missense\nmutations allowed us to closely predict the early infantile, late infantile and\njuvenile phenotypes, also disclosing different degrees of severity in the\njuvenile phenotype."
    explanation: Genotype-phenotype analysis of CTSA variants supports the distinct late-infantile clinical subtype.
- name: Juvenile/Adult
  display_name: Juvenile/adult galactosialidosis
  description: >-
    Most common clinical form, accounting for the majority of reported cases (particularly in
    Japanese cohorts), characterized by late childhood to adult onset of macular cherry-red spots,
    angiokeratoma, myoclonus, cerebellar ataxia, hearing impairment, vertebral changes, and
    variable cognitive impairment with prolonged survival.
  evidence:
  - reference: PMID:23915561
    reference_title: "Galactosialidosis: review and analysis of CTSA gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Few clinical cases of GS have been reported in the literature, the majority\nof them belonging to the juvenile/adult group of patients."
    explanation: Literature review confirms that the juvenile/adult subtype accounts for the majority of reported galactosialidosis cases.
  - reference: ORPHA:351
    reference_title: "Galactosialidosis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinical presentation can be heterogenous ranging from a severe, early-onset, rapidly progressive infantile form to late onset, slowly progressive juvenile/adult form."
    explanation: Orphanet characterizes the juvenile/adult subtype as a late-onset, slowly progressive form.

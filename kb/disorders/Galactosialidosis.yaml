biochemical:
- name: Protective protein/cathepsin A (PPCA) activity
  presence: DECREASED
  context: Primary lysosomal serine carboxypeptidase and chaperone deficiency in leukocytes and cultured fibroblasts
  readouts:
  - target: Cathepsin A (PPCA) Deficiency and Secondary Combined NEU1/GLB1 Deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    interpretation: Deficient cathepsin A esterase/carboxypeptidase activity directly reflects the primary CTSA defect and distinguishes galactosialidosis from isolated sialidosis or GM1 gangliosidosis.
    evidence:
    - reference: PMID:26949572
      reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Severely reduced or deficient NEU1 activity secondary to a primary defect of the lysosomal serine carboxypeptidase, protective protein cathepsin A (PPCA) is characteristic of galactosialidosis (GS)"
      explanation: Primary deficiency of the lysosomal serine carboxypeptidase PPCA defines galactosialidosis.
  evidence:
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Severely reduced or deficient NEU1 activity secondary to a primary defect of the lysosomal serine carboxypeptidase, protective protein cathepsin A (PPCA) is characteristic of galactosialidosis (GS)"
    explanation: Primary PPCA deficiency is the defining biochemical defect in galactosialidosis.
- name: Combined neuraminidase-1 (NEU1) and beta-galactosidase (GLB1) activity
  presence: DECREASED
  context: Secondary combined deficiency in patient fibroblasts and leukocytes due to loss of PPCA multienzyme complex stabilization
  readouts:
  - target: Cathepsin A (PPCA) Deficiency and Secondary Combined NEU1/GLB1 Deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    interpretation: Concurrent reduction of both NEU1 and GLB1 enzymatic activities in cells is the hallmark secondary biochemical signature of galactosialidosis.
    evidence:
    - reference: PMID:23915561
      reference_title: "Galactosialidosis: review and analysis of CTSA gene mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutations in the CTSA gene, that encodes the protective\nprotein/cathepsin A or PPCA, lead to the secondary deficiency of β-galactosidase\n(GLB1) and neuraminidase 1 (NEU1), causing the lysosomal storage disorder\ngalactosialidosis (GS)."
      explanation: CTSA mutations produce combined secondary deficiency of GLB1 and NEU1.
  evidence:
  - reference: PMID:23915561
    reference_title: "Galactosialidosis: review and analysis of CTSA gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the CTSA gene, that encodes the protective\nprotein/cathepsin A or PPCA, lead to the secondary deficiency of β-galactosidase\n(GLB1) and neuraminidase 1 (NEU1), causing the lysosomal storage disorder\ngalactosialidosis (GS)."
    explanation: Combined secondary deficiency of beta-galactosidase and neuraminidase-1 is diagnostic of galactosialidosis.
  - reference: PMID:12559848
    reference_title: "Imbalanced substrate specificity of mutant beta-galactosidase in patients with Morquio B disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Five skin fibroblast lines from patients with G(M1)-gangliosidosis (2 cases; R201C/R201C and I51T/I51T), Morquio B disease (2 cases; W273L/W273L and Y83H/R482C), and galactosialidosis (1 case; Y395C/S90L) were used as enzyme sources."
    explanation: Patient skin fibroblasts serve as a standard cellular enzyme source for assaying beta-galactosidase deficiency in galactosialidosis alongside GM1 gangliosidosis and Morquio B disease.

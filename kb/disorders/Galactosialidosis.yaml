pathophysiology:
- name: Protective Protein/Cathepsin A (PPCA) Deficiency
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency"
  description: >-
    Biallelic CTSA variants abolish or destabilize protective protein/cathepsin A (PPCA), a
    multifunctional lysosomal serine carboxypeptidase and protective protein that associates in a
    lysosomal multienzyme complex with alpha-neuraminidase (NEU1) and acid beta-galactosidase
    (GLB1) to protect both glycosidases from premature intralysosomal proteolysis and enable
    NEU1 catalytic activation.

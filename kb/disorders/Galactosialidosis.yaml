      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The deficiency of these enzymes leads to an accumulation of sialyloligosaccharides in lysosomes and in excreted body fluids."
      explanation: Excretion of sialyloligosaccharides in body fluids directly reflects lysosomal sialyloligosaccharide accumulation in galactosialidosis.
  evidence:
  - reference: PMID:32272755

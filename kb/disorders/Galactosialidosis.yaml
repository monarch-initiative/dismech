name: Galactosialidosis
creation_date: "2026-06-13T00:00:00Z"
description: >-
  Galactosialidosis is an autosomal recessive lysosomal storage disorder caused by biallelic
  CTSA variants that abolish protective protein/cathepsin A (PPCA), which normally stabilizes and
  activates a lysosomal multienzyme complex containing neuraminidase-1 (NEU1) and
  beta-galactosidase (GLB1). PPCA deficiency therefore produces a secondary combined deficiency of
  NEU1 and GLB1, causing intralysosomal accumulation and urinary excretion of sialylated
  oligosaccharides as well as secondary ganglioside storage in neural tissues. It presents in
  early-infantile, late-infantile, or juvenile/adult forms with coarse facial features, dysostosis
  multiplex, skeletal and vertebral dysplasia, a macular cherry-red spot, corneal opacity, hearing
  impairment, seizures, intellectual disability, and in severe early-onset disease hydrops fetalis,
  visceromegaly, and renal and cardiac failure.
notes: >-
  Clinical case series of juvenile/adult and longer-surviving infantile galactosialidosis also
  describe action and stimulus-sensitive myoclonus (HP:0001336), angiokeratoma corporis diffusum
  (HP:0001014), and cerebellar ataxia (HP:0001251) (e.g., Caciotti et al. 2013, PMID:23915561 full
  text). Those three human phenotype entries are omitted from the structured phenotypes list until
  full-text clinical case-series sources are cached in references_cache/, because the currently
  cached review (PMID:26949572) discusses myoclonus and angiokeratoma in its type II sialidosis
  section and cerebellar Purkinje cell ataxia in the Ppca-/- mouse section.

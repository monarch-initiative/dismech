inheritance:
- name: Autosomal recessive
  description: >-
    Galactosialidosis is inherited in an autosomal recessive manner caused by biallelic pathogenic
    germline variants in CTSA.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: ORPHA:351
    reference_title: "Galactosialidosis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Autosomal recessive"
    explanation: Orphanet directly lists autosomal recessive inheritance for galactosialidosis.
  - reference: PMID:23915561
    reference_title: "Galactosialidosis: review and analysis of CTSA gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the CTSA gene, that encodes the protective\nprotein/cathepsin A or PPCA, lead to the secondary deficiency of β-galactosidase\n(GLB1) and neuraminidase 1 (NEU1), causing the lysosomal storage disorder\ngalactosialidosis (GS)."
    explanation: Biallelic CTSA mutations cause autosomal recessive galactosialidosis.

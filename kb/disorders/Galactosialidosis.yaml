    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The deficiency of these enzymes leads to an accumulation of sialyloligosaccharides in lysosomes and in excreted body fluids."
    explanation: Galactosialidosis patients accumulate sialyloligosaccharides in lysosomes and excrete them in body fluids.

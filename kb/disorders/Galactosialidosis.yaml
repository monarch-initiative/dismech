    snippet: "Mutations in the CTSA gene, that encodes the protective\nprotein/cathepsin A or PPCA, lead to the secondary deficiency of β-galactosidase\n(GLB1) and neuraminidase 1 (NEU1), causing the lysosomal storage disorder\ngalactosialidosis (GS)."
    explanation: "Combined enzyme deficiency produces the lysosomal storage disorder galactosialidosis."
  downstream:
  - target: Progressive Multisystem and Neurodegenerative Disease
    description: Lysosomal sialyloligosaccharide and secondary ganglioside storage drives progressive multisystem and neurological disease.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Glycoprotein and glycolipid catabolic failure with tissue storage.
    evidence:
    - reference: PMID:32272755
      reference_title: "Mechanism of Secondary Ganglioside and Lipid Accumulation in Lysosomal Disease."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The deficiency of these enzymes leads to an accumulation of sialyloligosaccharides in lysosomes and in excreted body fluids. Furthermore, juvenile and adult galactosialidosis patients featured an accumulation of GM1, GD1a, GM2, and GM3 in sympathetic and spinal ganglia and in gray matter of the spinal cord [149,150]."
      explanation: Sialyloligosaccharide and secondary ganglioside accumulation in neural and systemic tissues underlies progressive disease manifestations in galactosialidosis.
    - reference: PMID:26949572
      reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Patients with sialidosis and those with GS share clinical and biochemical features that are attributed at least in part to the loss of NEU1 function in both diseases"
      explanation: Review evidence links the combined NEU1/GLB1 storage biochemistry to the shared multisystem clinical phenotype.
- name: LAMP1 Oversialylation and Excessive Lysosomal Exocytosis
  description: >-
    Deficient NEU1 activity leaves lysosomal membrane protein LAMP1 oversialylated with a prolonged
    half-life, increasing the pool of lysosomes docked at the plasma membrane and triggering
    excessive extracellular release of lysosomal luminal contents across connective, muscular, and
    neural tissues. Because this cascade has been dissected primarily in NEU1-deficient sialidosis
    models, it is included here as an indirect mechanistic consequence of secondary NEU1 loss in
    galactosialidosis.
  cellular_components:
  - preferred_term: lysosome

  evidence:
  - reference: PMID:32272755
    reference_title: "Mechanism of Secondary Ganglioside and Lipid Accumulation in Lysosomal Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Galactosialidosis is a glycoprotein storage disease caused by an inherited deficiency of the lysosomal protective protein/cathepsin A (PPCA) which is associated in a complex with both, α-neuraminidase (sialidase, NEU1, EC 3.2.1.18) and acid β-galatosidase (β-Gal, EC 3.2.1.23). PPCA is a multifunctional enzyme which binds and protects these two glycosidases from premature proteolysis. Therefore, the loss of PPCA results in a deficiency of α-neuraminidase and β-galactosidase activities [148]."
    explanation: "Review synthesis directly establishes that inherited PPCA deficiency impairs lysosomal multienzyme complex protection of NEU1 and GLB1 from premature proteolysis."
  - reference: PMID:23915561
    reference_title: "Galactosialidosis: review and analysis of CTSA gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Mutations in the CTSA gene, that encodes the protective\nprotein/cathepsin A or PPCA, lead to the secondary deficiency of β-galactosidase\n(GLB1) and neuraminidase 1 (NEU1), causing the lysosomal storage disorder\ngalactosialidosis (GS)."
    explanation: "CTSA mutations abolish protective protein/cathepsin A (PPCA), the primary genetic defect in galactosialidosis."
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "By virtue of their association with PPCA, NEU1 and β-GAL acquire their active and stable conformation in lysosomes. Only a fraction of PPCA and β-GAL activities is found in the NEU1-PPCA-β-GAL complex, which instead contains all of the NEU1 catalytic activity"
    explanation: "PPCA association within the lysosomal multienzyme complex is required for active and stable conformations of both NEU1 and beta-galactosidase."
  downstream:
  - target: Secondary Combined NEU1 and GLB1 Deficiency
    description: Loss of PPCA protective binding and multienzyme complex assembly exposes GLB1 to premature intralysosomal proteolysis and prevents NEU1 catalytic activation, causing combined secondary deficiency of both glycosidases.
    causal_link_type: DIRECT
    evidence:

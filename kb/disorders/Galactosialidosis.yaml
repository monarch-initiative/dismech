differential_diagnoses:
- name: Juvenile sialidosis type 2
  description: >-
    Primary NEU1 deficiency (sialidosis type II) shares dysostosis multiplex, coarse facies,
    hepatosplenomegaly, cherry-red spots, and myoclonus with galactosialidosis, but results from
    biallelic NEU1 variants with isolated neuraminidase deficiency and normal GLB1 and PPCA
    activity.
  disease_term:
    preferred_term: juvenile sialidosis type 2
    term:
      id: MONDO:0019681
      label: juvenile sialidosis type 2
  distinguishing_features:
  - Primary NEU1 deficiency without secondary beta-galactosidase or cathepsin A deficiency, versus the combined NEU1/GLB1 deficiency and primary PPCA defect of galactosialidosis.
  evidence:
  - reference: PMID:23915561
    reference_title: "Galactosialidosis: review and analysis of CTSA gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Mutations in the CTSA gene, that encodes the protective\nprotein/cathepsin A or PPCA, lead to the secondary deficiency of β-galactosidase\n(GLB1) and neuraminidase 1 (NEU1), causing the lysosomal storage disorder\ngalactosialidosis (GS)."
    explanation: "Galactosialidosis has combined NEU1 and GLB1 deficiency caused by CTSA mutations, unlike isolated NEU1-deficient sialidosis."
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients with sialidosis and those with GS share clinical and biochemical features that are attributed at least in part to the loss of NEU1 function in both diseases"
    explanation: "Shared loss of NEU1 function explains the close clinical and biochemical overlap between sialidosis and galactosialidosis."
- name: Congenital sialidosis type 2
  description: >-
    Severe congenital/early-infantile sialidosis type II presents with fetal hydrops,
    visceromegaly, skeletal dysplasia, renal and cardiac failure, and early death closely mimicking
    early-infantile galactosialidosis.
  disease_term:
    preferred_term: congenital sialidosis type 2
    term:
      id: MONDO:0019682
      label: congenital sialidosis type 2
  distinguishing_features:
  - Isolated primary NEU1 deficiency due to biallelic NEU1 variants with preserved beta-galactosidase and cathepsin A activities.
  evidence:
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The severe, early onset forms of the disease develop a systemic condition associated with fetal hydrops, skeletal dysplasia, visceromegaly, renal and cardiac failure, variable neurological involvement and early death. These phenotypic aberrations are shared with patients with the early infantile, neurodegenerative form of sialidosis, which is fatal in early childhood."
    explanation: "Review explicitly states that the severe early-onset systemic phenotype of galactosialidosis is shared with early-infantile neurodegenerative sialidosis."
- name: Sialidosis type 1
  description: >-
    Late-onset cherry-red spot myoclonus syndrome (sialidosis type I) overlaps with juvenile/adult
    galactosialidosis in presenting with macular cherry-red spots, myoclonus, and cerebellar
    ataxia.
  disease_term:
    preferred_term: sialidosis type 1
    term:
      id: MONDO:0019346
      label: sialidosis type 1
  distinguishing_features:
  - Isolated NEU1 deficiency with absence of dysostosis multiplex, coarse facies, or beta-galactosidase/PPCA deficiency.
  evidence:
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Severely reduced or deficient NEU1 activity secondary to a primary defect of the lysosomal serine carboxypeptidase, protective protein cathepsin A (PPCA) is characteristic of galactosialidosis (GS)"
    explanation: "Galactosialidosis is distinguished from primary NEU1 deficiency by the primary defect in PPCA (CTSA) and secondary GLB1 deficiency."
- name: GM1 gangliosidosis type 1
  description: >-
    Primary acid beta-galactosidase (GLB1) deficiency presents with infantile neurodegeneration,
    macular cherry-red spot, hepatosplenomegaly, coarse facies, and dysostosis multiplex overlapping
    galactosialidosis.
  disease_term:
    preferred_term: GM1 gangliosidosis type 1
    term:
      id: MONDO:0009260
      label: GM1 gangliosidosis type 1
  distinguishing_features:
  - Primary GLB1 mutations cause isolated acid beta-galactosidase deficiency with normal neuraminidase-1 (NEU1) and cathepsin A (PPCA) activities.
  evidence:
  - reference: PMID:12559848
    reference_title: "Imbalanced substrate specificity of mutant beta-galactosidase in patients with Morquio B disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "G(M1)-gangliosidosis and Morquio B disease are distinct in clinical and biochemical features, but both disorders are caused by genetic defects of the same enzyme, acid beta-galactosidase (beta-Gal)."
    explanation: "GM1 gangliosidosis is caused by primary genetic defects in GLB1 (acid beta-galactosidase), whereas beta-galactosidase deficiency in galactosialidosis is secondary to CTSA/PPCA loss."
- name: Mucopolysaccharidosis type 4B (Morquio B disease)
  description: >-
    Allelic GLB1 disorder caused by specific beta-galactosidase mutations that alter substrate
    specificity toward keratan sulfate, presenting with skeletal involvement overlapping the
    skeletal dysplasia of galactosialidosis while sparing neurological development.
  distinguishing_features:
  - Primary GLB1 variants causing altered beta-galactosidase substrate specificity with urinary keratan sulfate excretion, normal neurological development, and normal leukocyte NEU1 activity, in contrast to the combined NEU1/GLB1 deficiency and sialyloligosacchariduria of galactosialidosis.
  evidence:
  - reference: PMID:32272755
    reference_title: "Mechanism of Secondary Ganglioside and Lipid Accumulation in Lysosomal Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Another disease caused by mutations in the β-galactosidase gene GBL1 is mucopolysaccharidosis type IVB called Morquio type B disease. These mutations are different from those of GM1 gangliosidosis, and lead to a changed substrate specificity of the enzyme, thereby resulting in major accumulation of galactose containing keratan sulfate and oligosaccharides [5,25]."
    explanation: "Establishes that Morquio B disease (MPS IVB) is caused by primary GLB1 mutations that alter substrate specificity and lead to keratan sulfate and oligosaccharide accumulation."
  - reference: PMID:21497194
    reference_title: "GM1 gangliosidosis and Morquio B disease: an update on genetic alterations and clinical findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients here reported with the Morquio B phenotype showed classical features of the disease, i.e. skeletal involvement, normal neurological development and keratan sulphate urinary excretion [17]."
    explanation: "Demonstrates the clinical and biochemical phenotype of Morquio B disease: skeletal involvement, normal neurological development, and urinary keratan sulfate excretion."
  - reference: PMID:21497194
    reference_title: "GM1 gangliosidosis and Morquio B disease: an update on genetic alterations and clinical findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, 4 Morquio B patients are described (Table 2). The lysosomal neuraminidase (NEU1) enzyme activity, assayed in leukocytes, was within the normal range in all patients."
    explanation: "Confirms that leukocyte NEU1 enzyme activity is normal in Morquio B disease, directly distinguishing it from the combined NEU1/GLB1 deficiency of galactosialidosis."
treatments:
- name: Supportive Care
  description: >-
    No approved disease-modifying therapy is in routine clinical use; management is supportive and
    symptom-directed across neurologic, orthopedic, ophthalmic, audiologic, cardiac, and renal
    manifestations while natural-history studies evaluate current supportive therapies and
    candidate interventions.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: clinicaltrials:NCT01891422
    reference_title: "Longitudinal Studies of the Glycoproteinoses"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Longitudinal studies of these conditions are needed in order to better define how common the diseases are, identify clinical features which could contribute to early diagnoses, detail progression of the diseases, assess the supportive therapies currently used, and identify potential treatments."
    explanation: Natural-history investigation of the glycoproteinoses (including galactosialidosis) confirms that current clinical management relies on supportive therapies while potential disease-modifying treatments are investigated.
- name: AAV-PPCA Gene Therapy (Preclinical)
  description: >-
    Preclinical adeno-associated virus (AAV)-mediated delivery of human CTSA/PPCA has been
    evaluated in a comprehensive preclinical gene therapy trial in Ppca-/- mice, the mouse model
    of galactosialidosis, providing proof-of-concept for translational gene therapy.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Protective Protein/Cathepsin A (PPCA) Deficiency
    treatment_effect: RESTORES
    description: AAV-mediated delivery of functional PPCA replaces the deficient protective protein in the Ppca-/- mouse model of galactosialidosis.
    evidence:
    - reference: PMID:26949572
      reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "The same vector was used successfully for a comprehensive, preclinical gene therapy trial in the Ppca−/− mice, the mouse model of GS"
      explanation: Preclinical AAV-PPCA gene therapy was used successfully in the Ppca-/- mouse model of galactosialidosis.
  evidence:
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "The same vector was used successfully for a comprehensive, preclinical gene therapy trial in the Ppca−/− mice, the mouse model of GS"
    explanation: Preclinical AAV-PPCA trial in Ppca-/- mice established proof-of-concept efficacy in the animal model of galactosialidosis.
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In this regard, the AAV-PPCA–mediated gene therapy that will be applied for the treatment of patients with galactosialidosis could become suitable also for type I sialidosis."
    explanation: Review synthesis notes the translational development of AAV-PPCA gene therapy for patients with galactosialidosis.

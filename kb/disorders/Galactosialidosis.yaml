      quote_role: BACKGROUND
      snippet: "Mutations in the CTSA gene, that encodes the protective\nprotein/cathepsin A or PPCA, lead to the secondary deficiency of β-galactosidase\n(GLB1) and neuraminidase 1 (NEU1), causing the lysosomal storage disorder\ngalactosialidosis (GS)."
      explanation: CTSA/PPCA deficiency directly leads to secondary combined GLB1 and NEU1 deficiency.
- name: Secondary Combined NEU1 and GLB1 Deficiency
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency"
  description: >-
    In the absence of functional PPCA, alpha-neuraminidase (NEU1) fails to acquire its catalytically
    active lysosomal conformation and acid beta-galactosidase (GLB1) undergoes premature
    intralysosomal proteolysis instead of assembling into its stable oligomeric complex with PPCA,
    resulting in concurrent deficiency of both exo-alpha-sialidase and beta-galactosidase activities.

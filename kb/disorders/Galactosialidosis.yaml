biochemical:
- name: Protective protein/cathepsin A (PPCA) activity
  presence: DECREASED
  context: Primary lysosomal serine carboxypeptidase and protective protein deficiency in leukocytes and cultured fibroblasts
  readouts:
  - target: Protective Protein/Cathepsin A (PPCA) Deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    interpretation: Deficient cathepsin A esterase/carboxypeptidase activity directly reflects the primary CTSA defect and distinguishes galactosialidosis from isolated sialidosis or GM1 gangliosidosis.
    evidence:
    - reference: PMID:26949572
      reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Severely reduced or deficient NEU1 activity secondary to a primary defect of the lysosomal serine carboxypeptidase, protective protein cathepsin A (PPCA) is characteristic of galactosialidosis (GS)"
      explanation: Primary deficiency of the lysosomal serine carboxypeptidase PPCA defines galactosialidosis.
  evidence:
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Severely reduced or deficient NEU1 activity secondary to a primary defect of the lysosomal serine carboxypeptidase, protective protein cathepsin A (PPCA) is characteristic of galactosialidosis (GS)"
    explanation: Primary PPCA deficiency is the defining biochemical defect in galactosialidosis.
- name: Combined neuraminidase-1 (NEU1) and beta-galactosidase (GLB1) activity
  presence: DECREASED
  context: Secondary combined deficiency in patient fibroblasts and leukocytes due to loss of PPCA multienzyme complex protection
  readouts:
  - target: Secondary Combined NEU1 and GLB1 Deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    interpretation: Concurrent reduction of both NEU1 and GLB1 enzymatic activities in cells is the hallmark secondary biochemical signature of galactosialidosis.
    evidence:
    - reference: PMID:32272755
      reference_title: "Mechanism of Secondary Ganglioside and Lipid Accumulation in Lysosomal Disease."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "PPCA is a multifunctional enzyme which binds and protects these two glycosidases from premature proteolysis. Therefore, the loss of PPCA results in a deficiency of α-neuraminidase and β-galactosidase activities [148]."
      explanation: Loss of PPCA directly causes combined deficiency of alpha-neuraminidase (NEU1) and beta-galactosidase (GLB1) activities.
  evidence:
  - reference: PMID:32272755
    reference_title: "Mechanism of Secondary Ganglioside and Lipid Accumulation in Lysosomal Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Galactosialidosis is a glycoprotein storage disease caused by an inherited deficiency of the lysosomal protective protein/cathepsin A (PPCA) which is associated in a complex with both, α-neuraminidase (sialidase, NEU1, EC 3.2.1.18) and acid β-galatosidase (β-Gal, EC 3.2.1.23). PPCA is a multifunctional enzyme which binds and protects these two glycosidases from premature proteolysis. Therefore, the loss of PPCA results in a deficiency of α-neuraminidase and β-galactosidase activities [148]."
    explanation: Combined secondary deficiency of alpha-neuraminidase and acid beta-galactosidase activities due to loss of PPCA protection is diagnostic of galactosialidosis.
  - reference: PMID:23915561
    reference_title: "Galactosialidosis: review and analysis of CTSA gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Mutations in the CTSA gene, that encodes the protective\nprotein/cathepsin A or PPCA, lead to the secondary deficiency of β-galactosidase\n(GLB1) and neuraminidase 1 (NEU1), causing the lysosomal storage disorder\ngalactosialidosis (GS)."
    explanation: CTSA mutations produce combined secondary deficiency of GLB1 and NEU1.
- name: Urinary sialylated oligosaccharides and glycopeptides
  presence: INCREASED
  context: Sialyloligosaccharides excreted in body fluids and urine due to impaired glycoprotein degradation
  readouts:
  - target: Sialyloligosaccharide Lysosomal Accumulation
    relationship: READOUT_OF
    direction: POSITIVE
    interpretation: Elevated sialyloligosaccharides in excreted body fluids provide a non-invasive biochemical readout of systemic lysosomal sialyloligosaccharide storage in galactosialidosis.
    evidence:
    - reference: PMID:32272755
      reference_title: "Mechanism of Secondary Ganglioside and Lipid Accumulation in Lysosomal Disease."

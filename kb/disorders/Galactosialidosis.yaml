  evidence:
  - reference: PMID:23915561
    reference_title: "Galactosialidosis: review and analysis of CTSA gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the CTSA gene, that encodes the protective\nprotein/cathepsin A or PPCA, lead to the secondary deficiency of β-galactosidase\n(GLB1) and neuraminidase 1 (NEU1), causing the lysosomal storage disorder\ngalactosialidosis (GS)."
    explanation: "CTSA mutations cause secondary combined NEU1 and GLB1 deficiency, producing galactosialidosis."
  - reference: PMID:37205763
    reference_title: "Structure of the immunoregulatory sialidase NEU1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Genetic defects in NEU1 or in its protective protein cathepsin A (PPCA, CTSA) cause the lysosomal storage diseases sialidosis and galactosialidosis"
    explanation: "Independent confirmation that CTSA (PPCA) defects, via NEU1, cause galactosialidosis."
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "By virtue of their association with PPCA, NEU1 and β-GAL acquire their active and stable conformation in lysosomes. Only a fraction of PPCA and β-GAL activities is found in the NEU1-PPCA-β-GAL complex, which instead contains all of the NEU1 catalytic activity"
    explanation: "PPCA association within the lysosomal multienzyme complex is required for active and stable conformations of both NEU1 and beta-galactosidase."
  downstream:
  - target: Sialyloligosaccharide Lysosomal Accumulation
    description: Combined NEU1/GLB1 deficiency impairs glycoconjugate degradation, so sialylated oligosaccharides and glycopeptides accumulate in lysosomes.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23915561
      reference_title: "Galactosialidosis: review and analysis of CTSA gene mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "lead to the secondary deficiency of β-galactosidase\n(GLB1) and neuraminidase 1 (NEU1)"
      explanation: CTSA/PPCA deficiency directly causes combined secondary GLB1 and NEU1 deficiency, the biochemical step that drives substrate accumulation.
  - target: LAMP1 Oversialylation and Excessive Lysosomal Exocytosis
    description: Secondary loss of NEU1 catalytic activity prevents normal desialylation of lysosomal membrane protein LAMP1, driving excessive lysosomal exocytosis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26949572
      reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Defective or deficient NEU1 activity results in the impaired processing of the sialic acids on LAMP1, which consequently accumulates in an oversialylated state, and has a prolonged half-life."
      explanation: Secondary NEU1 deficiency directly impairs sialic acid cleavage from LAMP1 at the lysosomal membrane.

        from failed bone formation rather than increased resorption.
- name: Generalized Bone Loss
  biological_scale: TISSUE
  description: >-
    Reduced bone formation across the skeleton underlies the generalized
    osteoporosis of the human disease, the osteopenia of the Mmp14-null mouse
    and the reduced bone mineral density of the mmp14a/b knockout zebrafish.
    Osteoclasts may contribute, but the primary defect is in collagen
    remodelling and osteogenesis.
  biological_processes:
  - preferred_term: ossification
    term:
      id: GO:0001503
      label: ossification
    modifier: DECREASED
  evidence:
  - reference: PMID:10520996
    reference_title: "MT1-MMP-deficient mice develop dwarfism, osteopenia, arthritis, and connective tissue disease due to inadequate collagen turnover."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "MT1-MMP deficiency causes craniofacial dysmorphism, arthritis, osteopenia, dwarfism, and fibrosis of soft tissues due to ablation of a collagenolytic activity that is essential for modeling of skeletal and extraskeletal connective tissues."
    explanation: Osteopenia is a cardinal feature of the knockout mouse.
  - reference: PMID:29741626
    reference_title: "Functional analysis of a hypomorphic allele shows that MMP14 catalytic activity is the prime determinant of the Winchester syndrome phenotype."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The fish accurately reflected key aspects of the WS phenotype including craniofacial malformations, kyphosis, short-stature and reduced bone density owing to defective collagen remodeling."
    explanation: Reduced bone density in the zebrafish model, attributed to defective collagen remodelling.
  downstream:
  - target: Generalized Osteoporosis
    causal_link_type: DIRECT
- name: Growth Plate Dysfunction
  biological_scale: TISSUE
  description: >-
    In Mmp14-null mice, chondrocyte proliferation in the growth plate is
    reduced and vascular invasion of hypertrophic cartilage is defective, which
    enlarges the hypertrophic zone, delays secondary ossification centres and
    shortens the long bones. This is the proposed basis of dwarfism in the
    model and, by analogy, of short stature in the human disease.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: endochondral ossification
    term:
      id: GO:0001958
      label: endochondral ossification
    modifier: DECREASED
  - preferred_term: angiogenesis
    term:
      id: GO:0001525
      label: angiogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:10737763
    reference_title: "Impaired endochondral ossification and angiogenesis in mice deficient in membrane-type matrix metalloproteinase I."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Defective vascular invasion of cartilage leads to enlargement of hypertrophic zones of growth plates and delayed formation of secondary ossification centers in long bones."
    explanation: Describes the growth plate defect of the knockout mouse.
  downstream:
  - target: Short Stature
    causal_link_type: DIRECT
    evidence:

    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The craniofacial, axial, and appendicular skeletons were severely affected, leading to a short and domed skull, marked deceleration of postnatal growth, and death by 3 wk of age."
    explanation: Craniofacial skeletal involvement of the knockout mouse.

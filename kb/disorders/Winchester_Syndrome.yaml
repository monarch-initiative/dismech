      explanation: >-
        States that the growth plate defect causes bone shortening in the
        model; the extension to human short stature is by analogy.
- name: Periarticular Joint Destruction
  biological_scale: TISSUE
  description: >-
    Progressive destruction of small and large joints, with interphalangeal
    erosions that mimic rheumatoid arthritis, eventual loss of function of the
    shoulders, elbows, hips and knees, and ankylosis of the remaining hand
    bones. The Mmp14-null mouse develops arthritis attributed to the same loss
    of collagenolytic remodelling.

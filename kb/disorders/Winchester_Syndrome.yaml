- name: Impaired Pro-MMP2 Activation
  biological_scale: MOLECULAR
  description: >-
    MT1-MMP is a pericellular activator of the gelatinase MMP-2. Fibroblasts
    from the original Winchester proband secrete abundant pro-MMP2 but convert
    little of it to the active enzyme, and tissues from Mmp14-null mice are

- name: Impaired Osteogenic Commitment of Skeletal Stem Cells
  biological_scale: CELLULAR
  description: >-
    Skeletal stem cells use MT1-MMP to remodel their collagen niche, and the
    resulting change in cell shape activates beta1-integrin, RhoGTPase and
    YAP/TAZ signalling that commits them to the osteoblast lineage. Deleting
    Mmp14 in mesenchymal progenitors, but not in committed osteoblasts, diverts
    these cells towards adipocyte and chondrocyte fates and produces
    generalized osteopenia without a change in osteoclast number.

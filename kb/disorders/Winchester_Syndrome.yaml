    snippet: "In 2007, we reported two Dutch brothers with an autosomal recessive disorder consisting of dysmorphic facial features, mitral valve prolapse, severe acne and reduced bone density (1)."
    explanation: Severe acne in the second MMP14 family.
  - reference: PMID:14726867
    reference_title: "Progressive multilayered banded skin in Winchester syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phenotypic heterogeneity of cutaneous features are also reported to date of diffusely thickened leathery skin, hypertrichosis, patches of hyperpigmented, hypertrichotic leathery skin in annular or linear distribution, widespread acne, subcutaneous nodules, and gingival hypertrophy."
    explanation: Widespread acne among the reported cutaneous features.
biochemical:
- name: Reduced fibroblast pro-MMP2 activation
  presence: DECREASED
  notes: >-
    Gelatin zymography of conditioned medium from patient fibroblasts shows
    abundant pro-MMP2 with reduced active MMP-2. MMP2-deficient MONA fibroblasts
    show neither the proenzyme nor the active form, so the pattern separates
    the two diseases.
  evidence:
  - reference: PMID:22922033
    reference_title: "Mutation of membrane type-1 metalloproteinase, MT1-MMP, causes the multicentric osteolysis and arthritis disease Winchester syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Conditioned media from these fibroblasts had abundant levels of MMP-2 proenzyme but reduced MMP-2 activity (Figure 1B)."
    explanation: The zymographic finding in Winchester fibroblasts.
  - reference: PMID:22922033
    reference_title: "Mutation of membrane type-1 metalloproteinase, MT1-MMP, causes the multicentric osteolysis and arthritis disease Winchester syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This is in marked contrast to MONA-derived cell lines, which do not show zymographic activity of either the proenzyme or active forms of MMP-2."
    explanation: The contrasting MONA pattern that makes the test discriminating.
genetic:
- name: MMP14
  gene_term:
    preferred_term: MMP14
    term:
      id: hgnc:7160
      label: MMP14
  relationship_type: CAUSATIVE
  notes: >-
    MMP14 encodes membrane type-1 matrix metalloproteinase (MT1-MMP). Two
    homozygous missense alleles are reported: p.Thr17Arg in the signal peptide
    in the original family, and the hypomorphic p.Arg111His in the pro-domain in
    a milder family.
  evidence:
  - reference: PMID:22922033
    reference_title: "Mutation of membrane type-1 metalloproteinase, MT1-MMP, causes the multicentric osteolysis and arthritis disease Winchester syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using cultured fibroblasts from the proband, we have now identified homozygous mutations in membrane type-1 metalloproteinase (MT1-MMP or MMP14)."
    explanation: Identification of the causal gene in the original Winchester family.
  - reference: PMID:29741626
    reference_title: "Functional analysis of a hypomorphic allele shows that MMP14 catalytic activity is the prime determinant of the Winchester syndrome phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a novel hypomorphic MMP14 p.Arg111His (R111H) allele, associated with a mitigated form of WS."
    explanation: A second, independent MMP14 family.
  variants:
  - name: MMP14 p.(Thr17Arg)
    description: >-
      Homozygous signal-peptide missense variant in the original 1969 sisters,
      reported by the source as n.284C>G in codon 17 of exon 1 (NM_004995.2). It
      destabilises the protein and prevents its membrane localization,
      abolishing pro-MMP2 activation.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:22922033
      reference_title: "Mutation of membrane type-1 metalloproteinase, MT1-MMP, causes the multicentric osteolysis and arthritis disease Winchester syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sequence analysis revealed a homozygous missense mutation, a C>G transversion (n.284C>G) in codon 17 of exon 1, that predicted replacement of a threonine by an arginine (p.Thr17Arg) (Figure 1C)."
      explanation: Defines the variant and its homozygous state.
  - name: MMP14 c.332G>A p.(Arg111His)
    description: >-
      Homozygous hypomorphic pro-domain variant in two Dutch brothers with a
      milder phenotype that did not appreciably worsen over follow-up. The
      protein is processed and reaches the cell membrane but has partially
      reduced proteolytic activity.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:29741626
      reference_title: "Functional analysis of a hypomorphic allele shows that MMP14 catalytic activity is the prime determinant of the Winchester syndrome phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Subsequent homozygosity mapping and next-generation sequencing identified a novel homozygous missense mutation in MMP14, c.332G>A"
      explanation: Identification of the variant.
    - reference: PMID:29741626
      reference_title: "Functional analysis of a hypomorphic allele shows that MMP14 catalytic activity is the prime determinant of the Winchester syndrome phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "However, in the intervening years since diagnosis their phenotype has not appreciably worsened, suggesting that it is intrinsically milder."
      explanation: Documents the milder course associated with this allele.
diagnosis:
- name: Molecular confirmation by MMP14 sequencing
  description: >-
    The diagnosis rests on the clinical and radiographic picture of
    carpal-tarsal osteolysis with arthropathy and is confirmed by biallelic
    MMP14 variants. Because MMP2-related MONA overlaps clinically and was
    historically diagnosed as Winchester syndrome, clinical diagnosis alone
    cannot separate the two; fibroblast zymography also distinguishes them.
  evidence:
  - reference: PMID:22922033
    reference_title: "Mutation of membrane type-1 metalloproteinase, MT1-MMP, causes the multicentric osteolysis and arthritis disease Winchester syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously, and on the basis of an incorrect clinical diagnosis of Winchester syndrome, Winchester syndrome and MONA were presumed to be allelic disorders arising from mutations in the same gene"
    explanation: Shows that clinical diagnosis alone mislabelled MMP2 cases.
  - reference: PMID:22922033
    reference_title: "Mutation of membrane type-1 metalloproteinase, MT1-MMP, causes the multicentric osteolysis and arthritis disease Winchester syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our studies now demonstrate that mutations in MMP2 and MT1-MMP result in related but distinct"
    explanation: Establishes the MMP14 and MMP2 diseases as distinct, so genotyping is needed.
- name: Cardiac evaluation
  description: >-
    A complete cardiac evaluation is recommended for anyone suspected of
    Winchester syndrome or MONA, given the ECG abnormalities in the index
    sisters and reported death from heart failure.
  evidence:
  - reference: PMID:22922033
    reference_title: "Mutation of membrane type-1 metalloproteinase, MT1-MMP, causes the multicentric osteolysis and arthritis disease Winchester syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all individuals suspected to be affected by Winchester syndrome and/or MONA should undergo a complete cardiac evaluation."
    explanation: The gene-discovery authors' recommendation.
  - reference: PMID:29741626
    reference_title: "Functional analysis of a hypomorphic allele shows that MMP14 catalytic activity is the prime determinant of the Winchester syndrome phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Where WS patients reportedly die from heart failure, the mice succumb to wasting"
    explanation: Reported cardiac cause of death in patients.
differential_diagnoses:
- name: Multicentric osteolysis, nodulosis, and arthropathy (MMP2-related)
  description: >-
    The MMP2 disease overlaps closely and several MMP2 families were reported as
    Winchester syndrome. Both belong to the defective collagen-remodelling
    spectrum with Frank-Ter Haar syndrome.
  distinguishing_features:
  - Biallelic MMP2 rather than MMP14 variants.
  - Fibroblasts lack both pro-MMP2 and active MMP-2 on zymography, whereas MMP14-deficient cells secrete pro-MMP2 that is poorly activated.
  disease_term:
    preferred_term: multicentric osteolysis, nodulosis, and arthropathy
    term:
      id: MONDO:0009809
      label: multicentric osteolysis, nodulosis, and arthropathy
  evidence:
  - reference: PMID:22922033
    reference_title: "Mutation of membrane type-1 metalloproteinase, MT1-MMP, causes the multicentric osteolysis and arthritis disease Winchester syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This is in marked contrast to MONA-derived cell lines, which do not show zymographic activity of either the proenzyme or active forms of MMP-2."
    explanation: The laboratory discriminator between the two diseases.
  - reference: PMID:31218820
    reference_title: "Multicentric osteolytic syndromes represent a phenotypic spectrum defined by defective collagen remodeling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "These autosomal recessive syndromes are caused by homozygous mutation or deletion of respectively SH3PXD2B (SH3 and PX Domains 2B), MMP14 (matrix metalloproteinase 14), or MMP2."
    explanation: Assigns each syndrome of the spectrum to its own gene.
treatments:
- name: Bisphosphonate Therapy
  description: >-
    Bisphosphonates have been tried in Winchester syndrome and related
    disorders with limited success. They act mainly on osteoclasts, whereas the
    primary defect is thought to be in collagen remodelling, so the authors of
    the zebrafish model argue that treatment should target that defect instead.
  treatment_term:
    preferred_term: Bisphosphonate therapy
    term:
      id: NCIT:C198585
      label: Bisphosphonate Therapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:29741626
    reference_title: "Functional analysis of a hypomorphic allele shows that MMP14 catalytic activity is the prime determinant of the Winchester syndrome phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Attempts have been made in the past to treat WS and related disorders with bisphosphonates, with limited success (45,46)."
    explanation: Records prior use and limited efficacy of bisphosphonates.
- name: Glucocorticoid and Methotrexate
  description: >-
    One clinically diagnosed, ungenotyped boy with contracture from indurated
    skin had complete improvement of the contracture on oral betamethasone
    pulses with weekly oral methotrexate. This is a single case report.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: betamethasone
      term:
        id: CHEBI:3077
        label: betamethasone
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Flexion contracture
    term:
      id: HP:0001371
      label: Flexion contracture
  evidence:
  - reference: PMID:38291559
    reference_title: "A child with Winchester syndrome responding to oral betamethasone and methotrexate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was complete improvement in joint contracture with oral betamethasone pulse and weekly oral methotrexate."
    explanation: Single case response; the diagnosis was clinical, not molecular.
animal_models:
- name: Mmp14-null mouse
  species: Mouse
  genotype: Mmp14 (MT1-MMP) homozygous null
  publication: PMID:10520996
  description: >-
    Gene-targeted MT1-MMP-deficient mice develop craniofacial dysmorphism,
    arthritis, osteopenia, dwarfism and soft-tissue fibrosis, and die within
    weeks. The human disease parallels this skeletal phenotype in a less severe
    form, plausibly because patient cells retain some active enzyme.
  modeled_mechanisms:
  - target: Defective Pericellular Collagen Remodeling
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: Complete loss of MT1-MMP collagenolysis in vivo.
    limitations: >-
      A complete null is more severe than either human allele, both of which
      retain some activity, and the mice die at an age before most human
      skeletal features develop.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Null mice die by about three weeks with wasting, whereas patients
        survive into adulthood and reportedly die of heart failure, so late
        skeletal and cardiac features of the human disease cannot be read off
        the mouse.
    evidence:
    - reference: PMID:22922033
      reference_title: "Mutation of membrane type-1 metalloproteinase, MT1-MMP, causes the multicentric osteolysis and arthritis disease Winchester syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "an inactivating homoallelic mutation of MT1-MMP in humans results in Winchester syndrome, a rare osteolysis and arthritis disorder whose skeletal phenotype, although not as severe, parallels those previously described for the Mt1-mmp-null mouse."
      explanation: Human-mouse correspondence stated by the gene-discovery paper.
    - reference: PMID:22922033
      reference_title: "Mutation of membrane type-1 metalloproteinase, MT1-MMP, causes the multicentric osteolysis and arthritis disease Winchester syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The low level of active MT1-MMP present at the surface of patient-derived fibroblasts provides evidence of at least partial activity of the enzyme and might explain the differences in skeletal findings and survival between affected humans and engineered Mt1-mmp-null mice."
      explanation: Explains the severity gap between the null mouse and patients.
  - target: Growth Plate Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Growth plate and vascular invasion defects causing bone shortening.
    evidence:
    - reference: PMID:10737763
      reference_title: "Impaired endochondral ossification and angiogenesis in mice deficient in membrane-type matrix metalloproteinase I."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Shortening of bones is a consequence of decreased chondrocyte proliferation in the proliferative zone of the growth plates."
      explanation: Growth plate mechanism of dwarfism in the null mouse.
- name: mmp14a/b double knockout zebrafish
  species: Zebrafish
  genotype: mmp14a and mmp14b frameshift double homozygous (CRISPR/Cas9)
  publication: PMID:29741626
  description: >-
    Zebrafish lacking both mmp14 paralogs develop a progressive phenotype from
    about 30 days post-fertilization with short body length, craniofacial
    malformation, hyperkyphosis, reduced skull bone mineral density and
    persistent disorganized cartilage cores, and die at about 4.5 months.
  modeled_mechanisms:
  - target: Generalized Bone Loss
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reduced bone density attributed to defective collagen remodelling.
    limitations: >-
      Zebrafish carry two mmp14 paralogs and differ in bone morphology and
      ossification, and the fish die of spinal cord impingement, which is not
      seen in patients.
    evidence:
    - reference: PMID:29741626
      reference_title: "Functional analysis of a hypomorphic allele shows that MMP14 catalytic activity is the prime determinant of the Winchester syndrome phenotype."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The fish accurately reflected key aspects of the WS phenotype including craniofacial malformations, kyphosis, short-stature and reduced bone density owing to defective collagen remodeling."
      explanation: Summary of model fidelity.
  - target: Persistence of Unremodeled Cartilage Anlagen
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Enlarged, disorganized cartilage cores with sparse bone matrix in skull bones.
    evidence:
    - reference: PMID:29741626
      reference_title: "Functional analysis of a hypomorphic allele shows that MMP14 catalytic activity is the prime determinant of the Winchester syndrome phenotype."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "It was shown in Mmp14 KO mice that these cartilage templates are not properly replaced, respectively removed, owing to impaired MMP14-dependent collagen remodeling (32,33,41)."
      explanation: The authors relate their cartilage findings to the mouse mechanism.

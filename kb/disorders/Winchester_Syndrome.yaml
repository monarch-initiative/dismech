- name: Persistence of Unremodeled Cartilage Anlagen
  biological_scale: TISSUE
  description: >-
    During skeletal development, unmineralized cartilage templates are normally
    dissolved by MT1-MMP in step with apoptosis of their chondrocytes and
    replaced by bone, tendon or ligament. In MT1-MMP deficiency these cartilages
    persist, and both endochondral and intramembranous ossification are
    impaired; the mmp14a/b knockout zebrafish shows the same enlarged,
    disorganized cartilage cores with sparse bone matrix.
  biological_processes:

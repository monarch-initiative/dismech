- name: Abnormal Craniofacial Skeletal Development
  biological_scale: TISSUE
  description: >-
    Failed remodelling of membranous and endochondral skull bones produces
    craniofacial dysmorphism in the Mmp14-null mouse (a short, domed skull) and
    in the mmp14a/b knockout zebrafish. In the original Winchester proband the
    anterior fontanelle remained open at 18 years.
  evidence:
  - reference: PMID:10737763

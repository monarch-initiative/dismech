pathophysiology:
- name: MMP14 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic MMP14 missense variants reduce the amount or the activity of
    MT1-MMP at the cell surface. The signal-peptide variant p.Thr17Arg impairs
    processing of the nascent protein, so it is rapidly degraded and almost no
    active enzyme reaches the plasma membrane. The milder pro-domain variant
    p.Arg111His is processed and trafficked normally but has reduced
    proteolytic activity, and the milder phenotype it produces suggests that
    residual catalytic activity sets disease severity.

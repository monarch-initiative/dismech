- name: Defective Pericellular Collagen Remodeling
  biological_scale: CELLULAR
  description: >-
    MT1-MMP is the dominant pericellular collagenase of connective tissue
    cells. Without it, fibroblasts, chondrocytes, skeletal progenitors and
    osteocytes cannot cleave the type I collagen that surrounds them, so the
    matrix of developing bone, cartilage and soft connective tissue is not
    turned over. Reviews of the MMP14, MMP2 and SH3PXD2B disorders and their
    animal models identify defective collagen remodelling as the shared central
    lesion of the spectrum. Loss of osteocyte process formation in Mmp14-null
    bone has been attributed to the same failure of collagen cleavage.
  biological_processes:

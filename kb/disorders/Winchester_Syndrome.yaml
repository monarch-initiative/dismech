- name: Defective Subarticular Ossification of Carpal and Tarsal Bones
  biological_scale: TISSUE
  description: >-
    The carpal and tarsal "osteolysis" that defines the syndrome may reflect
    abnormal formation and modelling of these bones rather than excess
    resorption. Carpal and tarsal bones ossify from subarticular cartilage by a
    process distinct from growth-plate endochondral ossification, and osteoclast
    (TRAP) staining is notably absent there at the developmental stage relevant
    to the human disease. This reinterpretation rests on normal mouse
    developmental anatomy and has not been tested in MMP14-deficient carpal
    tissue.

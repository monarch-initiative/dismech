- name: Soft Connective Tissue Fibrosis
  biological_scale: TISSUE
  description: >-
    Collagen that cannot be turned over accumulates in the dermis and other soft
    connective tissues. The Mmp14-null mouse develops soft-tissue fibrosis, and
    dermal fibrosis is listed among the shared features of the defective
    collagen-remodelling spectrum. In clinically diagnosed Winchester patients
    the skin is diffusely thickened and leathery and can bind joints into
    contracture.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast

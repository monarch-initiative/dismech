name: Winchester Syndrome
creation_date: "2026-10-15T01:37:16Z"
category: Mendelian
description: >-
  Winchester syndrome is an ultra-rare autosomal recessive skeletal dysplasia
  caused by biallelic variants in MMP14, which encodes the membrane-anchored
  collagenase MT1-MMP. It presents in childhood with progressive, symmetric
  osteolysis of the carpal and tarsal bones, interphalangeal joint erosions that
  mimic rheumatoid arthritis, generalized osteoporosis, progressive destruction
  and contracture of the large joints, short stature, coarse facial features,
  peripheral corneal opacities and gingival hypertrophy, with thickened,
  hyperpigmented and hypertrichotic skin described in clinically diagnosed
  patients. Loss of MT1-MMP abolishes pericellular cleavage of fibrillar collagen
  and the activation of pro-MMP2, so that skeletal and soft connective tissues
  cannot be remodelled during growth. In the Mmp14-null mouse this produces
  dwarfism, osteopenia, arthritis, craniofacial dysmorphism and soft-tissue
  fibrosis. The disease is now grouped with MMP2-related multicentric
  osteolysis, nodulosis and arthropathy (MONA) and SH3PXD2B-related Frank-Ter
  Haar syndrome in a defective collagen-remodelling spectrum.
disease_term:
  preferred_term: Winchester syndrome
  term:

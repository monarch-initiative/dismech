notes: >-
  The name "Winchester syndrome" has been applied to two genetically distinct
  diseases, and the literature cannot be used without checking which one a
  report describes. The two sisters described by Winchester in 1969 carry a
  homozygous MMP14 p.Thr17Arg variant, and MONDO:0010201 (OMIM 277950) is the
  MMP14 disease. Before that gene was found, several families diagnosed
  clinically as Winchester syndrome were shown to carry biallelic MMP2 variants;
  those patients have MMP2-related MONA (MONDO:0009809), a related but distinct
  disease, and their reports are not used as evidence here. The MMP14-related
  disease is distinguished in the laboratory by patient fibroblasts that secrete
  abundant pro-MMP2 but activate little of it, whereas MMP2-deficient MONA cells
  show neither form.


  Only two MMP14 families are molecularly confirmed in the cited literature: the
  original sisters (p.Thr17Arg) and two Dutch brothers with a milder,
  hypomorphic p.Arg111His allele who were first reported as Borrone
  dermato-cardio-skeletal syndrome. The cutaneous phenotype (thickened leathery
  skin, hyperpigmented and hypertrichotic patches) and several other features
  are documented in reports of clinically diagnosed Winchester syndrome that
  predate or lack genotyping; those items are cited as such and could include
  MMP2-related cases.


  MONDO also lists "nodulosis arthropathy osteolysis syndrome", "NOA syndrome"
  and "Al-Qeel Sewairi syndrome" among the synonyms of this term. Those names
  belong to the MMP2-related MONA phenotype and are not carried here. The
  GeneReviews chapter "Multicentric Osteolysis Nodulosis and Arthropathy"
  defines MONA by biallelic MMP2 variants or reduced MMP2
  activity and is therefore not the clinical baseline for this MMP14 disease;
  no GeneReviews chapter covers MMP14-related Winchester syndrome.

discussions:
- discussion_id: gap_bdd_mechanism_causality
  prompt: >-
    Are altered visual-attention, global-local processing, and
    visual-emotional-network findings developmental causal mechanisms of BDD,
    state effects of persistent preoccupation, or nonspecific correlates?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Aberrant Visual Attention and Global-Local Processing
  - pathophysiology#Persistent Appearance Preoccupation
  rationale: >-
    Most studies are small, cross-sectional, adult, and incompletely replicated.
    Establishing directionality would determine whether perceptual retraining
    addresses a causal mechanism or only a downstream correlate.
  evidence:
  - reference: PMID:39639018
    reference_title: Body dysmorphic disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A few studies suggest functional and structural brain differences
      (compared with controls) in the regions involved in visual and emotional
      processing, although firm conclusions about the pathophysiology of the
      disorder cannot be made at this stage.
    explanation: The primer explicitly states that firm pathophysiologic conclusions are premature.
- discussion_id: gap_bdd_genetic_environmental_causality
  prompt: >-
    Which specific genetic variants and prospectively measured environmental
    exposures contribute causally to clinically diagnosed BDD, after accounting
    for familial and gene-environment correlation confounding?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Partly Heritable and Environmentally Modulated Liability
  - environmental#Peer victimization and childhood trauma
  rationale: >-
    Twin estimates concern self-reported dysmorphic traits, no BDD GWAS was
    available in the primer, and proposed environmental risks derive mainly from
    designs that cannot establish causality.
  evidence:
  - reference: PMID:39639018
    reference_title: Body dysmorphic disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: To date, no genome-wide association studies of BDD diagnoses or symptoms have
    explanation: The primer identifies the absence of BDD genomic association studies.
  - reference: PMID:39639018
    reference_title: Body dysmorphic disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: failure to control for familial or genetic confounding.
    explanation: The primer identifies a key limitation of environmental-risk studies.

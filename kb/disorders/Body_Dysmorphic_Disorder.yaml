review_notes: >-
  Curated from direct review of cached sources, with the Falcon deep-research
  report used only as a discovery aid. BDD is modeled as a multifactorial
  psychiatric disorder without a curated causal gene: twin estimates concern
  self-reported dysmorphic traits, and the 2024 primer reported no BDD GWAS or
  specific causal variants. Cognitive-affective and visual-processing
  mechanisms are explicitly provisional; SSRI efficacy is not treated as proof
  of serotonergic pathophysiology. Anxiety and depressive disorders are common
  comorbidities but were removed from the causal phenotype graph. No validated
  animal model or disease-specific public GEO omics dataset was identified.
  ClinicalTrials.gov was checked on 2026-07-23; BDD-specific trials were retained
  while anorexia, generic body-image, and cosmetic-procedure false positives
  were excluded. Cosmetic procedures are not represented as BDD treatment
  because outcomes are often unpredictable or poor. A Monarch D2P audit on
  2026-07-23 returned no OMIM- or Orphanet-backed BDD phenotype rows and no
  phenotype-completeness issues; direct clinical evidence therefore anchors the
  five curated phenotypes.

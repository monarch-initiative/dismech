    snippet: The disorder typically has its onset before 18 years of age
    explanation: The primer identifies onset before adulthood as typical.
- phase: Persistent untreated disorder
  age_range: Adolescence through adulthood
  notes: >-
    Long-term untreated natural-history cohorts are unavailable. Expert
    consensus considers untreated BDD likely to be chronic, so this phase
    should not be interpreted as a quantified longitudinal trajectory.

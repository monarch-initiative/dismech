differential_diagnoses:
- name: Obsessive-Compulsive Disorder
  description: >-
    OCD and BDD can both involve impairing repetitive thoughts and behaviors,
    but BDD thoughts and corrective responses are specifically focused on
    perceived appearance defects.
  distinguishing_features:
  - BDD thoughts are exclusively appearance-focused; OCD obsessions span broader themes.
  - BDD repetitive acts attempt to inspect, hide, or fix perceived appearance flaws.
  disease_term:
    preferred_term: obsessive-compulsive disorder
    term:
      id: MONDO:0008114
      label: obsessive-compulsive disorder
  evidence:
  - reference: PMID:39639018
    reference_title: Body dysmorphic disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In BDD, the repetitive thoughts are exclusively focused on the appearance,
      whereas in OCD the thoughts may focus on a broader range of obsessions.
    explanation: The primer's differential table directly distinguishes BDD from OCD.
- name: Eating Disorder
  description: >-
    Eating disorders and BDD both involve image-related preoccupation, but
    eating disorders center on body weight or shape and dysfunctional eating.
  distinguishing_features:
  - >-
    Multiple facial, head, or generalized perceived defects favor BDD; intense
    weight-loss focus with restriction, bingeing, or purging favors an eating
    disorder.
  disease_term:
    preferred_term: eating disorder
    term:
      id: MONDO:0005451
      label: eating disorder
  evidence:
  - reference: PMID:39639018
    reference_title: Body dysmorphic disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In eating disorders, the preoccupation is generally focused on body weight
      and body shape, whereas in BDD the appearance preoccupations tend to be
      multiple and mainly focused on facial features/head area or be more
      general
    explanation: >-
      The primer's differential table directly contrasts the focus of eating
      disorders and BDD.
- name: Trichotillomania
  description: >-
    Hair removal can occur in either disorder. In BDD it is an attempt to
    improve a perceived appearance flaw, whereas in trichotillomania it is a
    habitual behavior associated with pleasure or stress relief.
  distinguishing_features:
  - Appearance-correction intent favors BDD.
  - Habitual pulling for pleasure or stress relief favors trichotillomania.
  disease_term:
    preferred_term: trichotillomania
    term:
      id: MONDO:0013189
      label: trichotillomania
  evidence:
  - reference: PMID:39639018
    reference_title: Body dysmorphic disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In BDD, behaviour will correspond to an attempt to improve appearance by
      removing specific hairs that are considered unattractive. This is not the
      case in trichotillomania, where the pulling is a habit that is pleasurable
      or helps with stress relief
    explanation: >-
      The primer's differential table directly distinguishes the motivation for
      hair removal.
- name: Social Anxiety Disorder
  description: >-
    Both disorders can involve fear of negative evaluation and social
    avoidance. In BDD these concerns center on perceived appearance defects and
    provoke appearance-focused repetitive behavior.
  distinguishing_features:
  - >-
    Fear centered on performance or embarrassment without appearance-fixing
    behavior favors social anxiety disorder.
  disease_term:
    preferred_term: social anxiety disorder
    term:
      id: MONDO:0001247
      label: social phobia
  evidence:
  - reference: PMID:39639018
    reference_title: Body dysmorphic disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In BDD, these symptoms are related to the perceived appearance defects,
      whereas in social anxiety, these concerns are not central, but they tend
      to be related with the social performance and a fear of embarrassing
      oneself.
    explanation: >-
      The primer's differential table distinguishes the focus of social fear in
      BDD and social anxiety disorder.
- name: Delusional Disorder
  description: >-
    Absent insight in BDD can resemble delusional belief, but BDD retains its
    appearance-focused preoccupation and repetitive responses and lacks the
    broader positive symptoms expected in a psychotic disorder.
  distinguishing_features:
  - >-
    Disorganized thought or speech, hallucinations, and other positive psychotic
    symptoms favor a psychotic disorder rather than BDD with absent insight.
  disease_term:
    preferred_term: delusional disorder
    term:
      id: MONDO:0004359
      label: delusional disorder
  evidence:
  - reference: PMID:39639018
    reference_title: Body dysmorphic disorder.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite individuals with BDD having absent insight and delusional ideas,
      they will not present disorganized thoughts, disorganized speech,
      hallucinations, or other positive symptoms generally present in psychotic
      disorders
    explanation: >-
      The primer contrasts BDD with psychotic disorders generally; applying the
      distinction specifically to delusional disorder is therefore partial.

name: Body Dysmorphic Disorder
creation_date: "2026-04-28T00:00:00Z"
category: Psychiatric
description: >-
  Body dysmorphic disorder (BDD) is an obsessive-compulsive-related psychiatric
  disorder defined by persistent preoccupation with perceived appearance flaws
  that are not observable or appear slight to others, together with repetitive
  checking, comparison, camouflaging, grooming, or related mental acts. Insight
  is often poor or absent. The disorder commonly begins before adulthood,
  substantially impairs social, educational, and occupational functioning, and
  is associated with considerable self-harm and suicide risk.

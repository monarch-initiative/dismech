clinical_burden:
  burden_level: HIGH
  rationale: >-
    BDD can consume hours each day, disrupt social, educational, and
    occupational functioning, markedly reduce quality of life, and carry major
    self-harm and suicide risk. Poor insight and pursuit of cosmetic procedures
    can delay appropriate care.
  evidence:
  - reference: PMID:39639018
    reference_title: Body dysmorphic disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Quality of life is markedly impaired across multiple domains and suicide risk is considerable.
    explanation: >-
      The disease primer directly supports substantial functional burden and
      suicide risk.
  - reference: PMID:38734199
    reference_title: "Intentional Self-Harm and Death by Suicide in Body Dysmorphic Disorder: A Nationwide Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: BDD was associated with a 3-fold increased risk of intentional self-harm and death by suicide.
    explanation: >-
      A nationwide matched cohort quantifies the serious self-harm and mortality
      burden.
pathophysiology:
- name: Partly Heritable and Environmentally Modulated Liability
  description: >-
    BDD liability is probably multifactorial. Twin estimates for self-reported
    dysmorphic concerns indicate a partly heritable component, while adverse
    experiences and other environmental factors remain putative. No BDD
    diagnosis or symptom GWAS had been reported in the 2024 primer.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:39639018
    reference_title: Body dysmorphic disorder.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Research on the aetiology of BDD is scarce but likely involves an interplay between genetic and environmental factors.
    explanation: >-
      The review supports a multifactorial liability model while emphasizing
      that etiologic evidence remains sparse.
  - reference: PMID:39639018
    reference_title: Body dysmorphic disorder.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: dysmorphic concerns ranges between 37 and 49%
    explanation: >-
      Twin studies estimate heritability of self-reported dysmorphic concerns,
      not a clinically diagnosed BDD genotype.
  downstream:
  - target: Negative Appearance Appraisal and Rumination
    description: >-
      Multifactorial liability is placed upstream of the cognitive-affective
      appraisal branch, but the responsible intermediates are unknown.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39639018
      reference_title: Body dysmorphic disorder.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: Research on the aetiology of BDD is scarce but likely involves an interplay between genetic and environmental factors.
      explanation: >-
        The primer supports broad etiologic liability but does not establish a
        direct route to cognitive appraisal.
  - target: Aberrant Visual Attention and Global-Local Processing
    description: >-
      Multifactorial liability is placed upstream of the perceptual-processing
      branch, with developmental and molecular intermediates unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39639018
      reference_title: Body dysmorphic disorder.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A few studies suggest functional and structural brain differences
        (compared with controls) in the regions involved in visual and emotional
        processing, although firm conclusions about the pathophysiology of the
        disorder cannot be made at this stage.
      explanation: >-
        Human studies support a provisional perceptual-processing branch, not a
        resolved causal path from liability.

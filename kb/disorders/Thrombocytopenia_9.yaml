discussions:
- discussion_id: thc9_platelet_size_discrepancy
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Increased mean platelet volume
  prompt: >-
    Is platelet size increased in monoallelic THPO thrombocytopenia, or
    normal?
  rationale: >-
    The defining cohort of six carriers had an increased mean platelet volume
    and some large platelets on film, while a later report describes the
    disorder as having normal platelet size. A larger series measured on the
    same analyzer would settle which is typical, and whether size differs by
    allele.
- discussion_id: thc9_myeloid_malignancy_predisposition
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#THPO
  prompt: >-
    Do monoallelic THPO loss-of-function variants predispose to myeloid
    malignancy?
  rationale: >-
    A single family report proposed a monoallelic THPO deletion as a germline
    predisposition to myeloid malignancy. One family cannot separate a causal
    effect from chance, and no cohort data address it.
  evidence:
  - reference: PMID:36534659
    reference_title: "Novel THPO variant in hereditary thrombocytopenia: A potential candidate variant for predisposition to myeloid neoplasm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that the monoallelic deletion of THPO is a potential candidate for germline predisposition to myeloid malignancy."
    explanation: The proposal and its single-family basis.

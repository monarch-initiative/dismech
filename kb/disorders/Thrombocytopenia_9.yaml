    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A third thrombocytopenic case carrying a rare heterozygous THPO variant was identified in the ThromboGenomics collection of cases with undiagnosed bleeding and platelet disorders"
    explanation: >-
      One index case was diagnosed through a high-throughput sequencing panel
      for undiagnosed bleeding and platelet disorders.
- name: Serum thrombopoietin measurement
  description: >-
    Serum thrombopoietin that is low for the platelet count supports the
    diagnosis and separates THC9 from thrombocytopenias with a normal ligand,
    in which thrombopoietin rises as platelets fall.
  diagnosis_term:

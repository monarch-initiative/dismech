diagnosis:
- name: Genetic testing
  description: >-
    The diagnosis rests on finding a heterozygous loss-of-function THPO variant,
    usually on a high-throughput sequencing panel for inherited thrombocytopenia
    or bleeding disorders, with segregation in affected relatives.
  diagnosis_term:

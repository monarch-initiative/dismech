      platelet count.
treatments:
- name: Platelet Transfusion
  description: >-
    Most hereditary thrombocytopenias have no specific treatment, and platelet
    transfusion is used for bleeding or before procedures with a bleeding risk.
    Carriers of THC9 are usually mildly affected and often need no treatment.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: platelet transfusion
    term:
      id: NCIT:C15366
      label: Platelet Transfusion
  evidence:
  - reference: PMID:29956472
    reference_title: "Thrombopoietin receptor agonists in hereditary thrombocytopenias."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Most HTPs do not have effective treatments, except for platelet transfusion when bleeding occurs and in preparation for procedures associated with a risk of bleeding."
    explanation: >-
      Review statement about hereditary thrombocytopenias as a group, not
      THC9 specifically.
- name: Thrombopoietin Receptor Agonist
  description: >-
    Thrombopoietin receptor agonists replace the missing ligand at MPL and are
    the mechanistically matched therapy for THPO-related thrombocytopenia. All
    reported responses are in biallelic THPO disease (romiplostim, eltrombopag);
    no treated patient with monoallelic THC9 has been reported, and the mild
    phenotype rarely calls for treatment.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: romiplostim
      term:
        id: NCIT:C52183
        label: Romiplostim
    - preferred_term: eltrombopag
      term:
        id: CHEBI:85010
        label: eltrombopag
  notes: >-
    therapeutic_modality is OTHER because the class spans a peptide-Fc fusion
    (romiplostim) and a small molecule (eltrombopag).
  target_mechanisms:
  - target: Reduced Thrombopoietin-MPL Signaling
  evidence:
  - reference: PMID:29956472
    reference_title: "Thrombopoietin receptor agonists in hereditary thrombocytopenias."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "We believe that TPO-RAs will play a major role in the treatment of HTPs, particularly myosin heavy chain 9-related disease, Wiskott-Aldrich syndrome, X-linked thrombocytopenia, and thrombocytopenia caused by THPO mutations."
    explanation: >-
      Review naming THPO-related thrombocytopenia as a target for
      thrombopoietin receptor agonists.
  - reference: PMID:29191945
    reference_title: "Thrombopoietin mutation in congenital amegakaryocytic thrombocytopenia treatable with romiplostim."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all the three affected children, treatment with the THPO-mimetic romiplostim induced trilineage hematological responses, remission of bleeding and infections, and transfusion independence"
    explanation: >-
      Response to romiplostim in biallelic THPO disease supports the ligand
      replacement rationale; these patients did not have THC9.
differential_diagnoses:
- name: Congenital amegakaryocytic thrombocytopenia 2
  description: >-
    Biallelic loss of function of the same gene. Thrombocytopenia is severe and
    progresses to trilineage bone marrow failure that does not respond to
    hematopoietic stem cell transplantation, because the defect is in the
    ligand rather than in the marrow.
  distinguishing_features:
  - Severe thrombocytopenia progressing to trilineage marrow failure.
  - Undetectable serum thrombopoietin.
  - Two pathogenic THPO alleles.
  disease_term:
    preferred_term: amegakaryocytic thrombocytopenia, congenital, 2
    term:
      id: MONDO:0957575
      label: amegakaryocytic thrombocytopenia, congenital, 2
  evidence:
  - reference: PMID:28559357
    reference_title: "Bone marrow failure unresponsive to bone marrow transplant is caused by mutations in thrombopoietin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both mutations result in a lack of THPO in the patients' serum."
    explanation: Biallelic THPO disease leaves no detectable serum thrombopoietin.
  - reference: PMID:32150607
    reference_title: "Monoallelic loss-of-function THPO variants cause heritable thrombocytopenia."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, biallelic loss-of-function THPO variants result in a severe reduction in the platelet count and multilineage bone marrow failure."
    explanation: Contrasts biallelic with monoallelic THPO disease.
- name: Thrombocythemia 1
  description: >-
    Gain-of-function THPO variants increase thrombopoietin production and
    raise, rather than lower, the platelet count.
  distinguishing_features:
  - Elevated platelet count.
  disease_term:
    preferred_term: thrombocythemia 1
    term:
      id: MONDO:0008554
      label: thrombocythemia 1
  evidence:
  - reference: PMID:32150607
    reference_title: "Monoallelic loss-of-function THPO variants cause heritable thrombocytopenia."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Increased TPO production caused by gain-of-function THPO variants results in the myeloproliferative disorder thrombocythemia-1"
    explanation: The gain-of-function allelic disorder.
animal_models:
- name: Thpo knockout mouse
  species: Mouse
  genotype: Thpo-/- and Thpo+/-
  publication: PMID:8627177
  description: >-
    Homozygous knockouts lose more than 80% of platelets and megakaryocytes
    with other lineages normal in blood; heterozygotes show a gene dosage
    effect on circulating thrombopoietin. Knockouts also have fewer myeloid,
    erythroid and multilineage progenitors in the marrow.
  modeled_mechanisms:
  - target: Reduced Megakaryopoiesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      The informative phenotype comes from homozygous knockouts, which model
      biallelic disease; heterozygotes were characterized mainly by their
      thrombopoietin dosage.
    evidence:
    - reference: PMID:8627177
      reference_title: "Physiological regulation of early and late stages of megakaryocytopoiesis by thrombopoietin."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "TPO-/- mice have a >80% decrease in their platelets and megakaryocytes but have normal levels of all the other hematopoietic cell types."
      explanation: Thrombopoietin loss depletes megakaryocytes and platelets.
  - target: Reduced Thrombopoietin Secretion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      A null allele lowers thrombopoietin by gene dosage; it does not model the
      mistrafficking of a variant protein.
    evidence:
    - reference: PMID:8627177
      reference_title: "Physiological regulation of early and late stages of megakaryocytopoiesis by thrombopoietin."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM

name: Thrombocytopenia 9
creation_date: "2026-10-22T00:00:00Z"
category: Mendelian
synonyms:
- THC9
- THPO-related thrombocytopenia
disease_term:
  preferred_term: thrombocytopenia 9
  term:
    id: MONDO:0957572
    label: thrombocytopenia 9
parents:
- Inherited thrombocytopenia
description: >-
  Thrombocytopenia 9 (THC9, OMIM 620478) is a mild autosomal dominant inherited
  thrombocytopenia caused by monoallelic loss-of-function variants in THPO, the
  gene for thrombopoietin, the hepatocyte-derived cytokine that drives
  megakaryocyte development through its receptor MPL. The defining report
  identified frameshift and missense THPO variants that impair intracellular
  trafficking and secretion of thrombopoietin; carriers had a modestly reduced
  platelet count (about 100 to 145 x 10^9/L), platelet anisocytosis with some
  large platelets, occasional mild mucocutaneous bleeding, and a serum
  thrombopoietin level lower than expected for the platelet count, with no
  abnormality of other blood lineages. Heterozygous parents and siblings of
  patients with biallelic THPO disease show the same mild thrombocytopenia, but
  penetrance is incomplete and some carriers have normal counts. THC9 is one
  end of an allelic series: biallelic THPO loss of function causes congenital
  amegakaryocytic thrombocytopenia 2 with trilineage marrow failure, and
  gain-of-function THPO variants cause thrombocythemia 1.
notes: >-
  Platelet size is reported inconsistently: the defining cohort had an
  increased mean platelet volume (PMID:32150607), whereas a later report
  characterizes monoallelic THPO thrombocytopenia as having normal platelet
  size (PMID:36226497). Both are recorded; see the discussion. A single family
  report proposes monoallelic THPO deletion as a predisposition to myeloid
  malignancy (PMID:36534659); this is not recorded as a phenotype.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    A single loss-of-function THPO allele is sufficient to lower the platelet
    count. Some heterozygous relatives of patients with biallelic THPO disease
    have normal platelet counts, so penetrance is incomplete.
  evidence:
  - reference: PMID:32150607
    reference_title: "Monoallelic loss-of-function THPO variants cause heritable thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected cases have autosomal-dominant thrombocytopenia but no other hematological features."
    explanation: >-
      The defining report establishes dominant inheritance.
  - reference: PMID:36226497
    reference_title: "Defective binding of ETS1 and STAT4 due to a mutation in the promoter region of THPO as a novel mechanism of congenital amegakaryocytic thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cause a dominant form of thrombocytopenia with incomplete penetrance characterized by mild reduction in platelet count and normal platelet size."
    explanation: >-
      Describes the monoallelic disorder as dominant with incomplete
      penetrance.
  - reference: PMID:39479124
    reference_title: "A Rare THPO Gene Mutation in a Saudi Female Child: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both of the patient’s parents were healthy with normal platelet counts but were found to be heterozygous carriers of this deletion."
    explanation: >-
      Heterozygous carriers with normal platelet counts illustrate incomplete
      penetrance.
genetic:
- name: THPO
  gene_term:
    preferred_term: THPO
    term:
      id: hgnc:11795
      label: THPO
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Reported monoallelic alleles include c.610dup (p.E204Gfs*123) and c.805dup
    (p.L269Pfs*58), which both replace the glycosylated C-terminal domain and
    truncate the protein after codon 327, and the missense c.295C>T (p.R99W) in
    the receptor-binding domain, found in a single case without segregation
    data. Heterozygous carriers of alleles that cause biallelic disease
    (p.R17C, a promoter variant c.-323C>T) also have mild thrombocytopenia.
  evidence:
  - reference: PMID:32150607
    reference_title: "Monoallelic loss-of-function THPO variants cause heritable thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the remainder, only THPO harbored rare variants with a high probability of pathogenicity that segregated with thrombocytopenia in family members."
    explanation: >-
      A genome-wide association across 105 unrelated thrombocytopenia cases
      singled out THPO, with segregation in families.
  - reference: PMID:24085763
    reference_title: "Exome sequencing reveals a thrombopoietin ligand mutation in a Micronesian family with autosomal recessive aplastic anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, the R17C partial loss-of-function allele results in aplastic anemia in the homozygous state and mild thrombocytopenia in the heterozygous state in our family."
    explanation: >-
      Heterozygous carriers of a recessive THPO allele have mild
      thrombocytopenia, the same phenotype as THC9.
  - reference: PMID:36226497
    reference_title: "Defective binding of ETS1 and STAT4 due to a mutation in the promoter region of THPO as a novel mechanism of congenital amegakaryocytic thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "have asymptomatic mild thrombocytopenia, which is consistent with the slightly reduced platelet count observed in individuals with monoallelic loss-of-function variants of THPO"
    explanation: >-
      Heterozygous carriers of a THPO promoter variant have mild
      thrombocytopenia.
  - reference: PMID:40386912
    reference_title: "THPO promoter mutation: a familial study on congenital amegakaryocytic thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Family segregation analysis shows a significant reduction in platelet counts among carriers of the mutation."
    explanation: >-
      Carriers of a THPO promoter variant have reduced platelet counts.
pathophysiology:
- name: THPO Monoallelic Loss of Function
  description: >-
    One THPO allele carries a frameshift that replaces the glycosylated
    C-terminal domain, or a missense change in the receptor-binding domain.
    Thrombopoietin is made mainly by hepatocytes, and the variant protein is
    mistrafficked inside the cell instead of being secreted.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: THPO
    modifier: DECREASED
    term:
      id: hgnc:11795
      label: THPO
  molecular_functions:
  - preferred_term: cytokine activity
    modifier: DECREASED
    term:
      id: GO:0005125
      label: cytokine activity
  evidence:
  - reference: PMID:32150607
    reference_title: "Monoallelic loss-of-function THPO variants cause heritable thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we present genetic and functional evidence that monoallelic loss-of-function THPO variants also result in reduced platelet count but do not affect other circulating blood cells."
    explanation: >-
      Establishes monoallelic loss of function as the disease mechanism.
  downstream:
  - target: Reduced Thrombopoietin Secretion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32150607
      reference_title: "Monoallelic loss-of-function THPO variants cause heritable thrombocytopenia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "suggests that secretion failure occurs because of mistrafficking and cytoplasmic accumulation of the substituted TPO"
      explanation: >-
        The E204Gfs*123 variant accumulates inside transfected cells instead of
        being secreted.
- name: Reduced Thrombopoietin Secretion
  description: >-
    Cells expressing the variant thrombopoietin secrete less of it, and
    patients have a serum thrombopoietin level lower than expected for their
    platelet count. In mice, heterozygous loss of Thpo lowers circulating
    thrombopoietin in proportion to gene dosage, because the gene is
    constitutively expressed and the level is set by the platelet mass rather
    than by transcriptional feedback. The authors of the defining report
    caution that the cell-line trafficking findings may not transfer exactly to
    endogenous production in patients.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: protein secretion
    modifier: DECREASED
    term:
      id: GO:0009306
      label: protein secretion
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:32150607
    reference_title: "Monoallelic loss-of-function THPO variants cause heritable thrombocytopenia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "FLAG-tagged TPO (FLAG-TPO) concentrations measured by immunoassay were lower in the culture supernatants of the variant-transfected cells compared with WT-transfected controls"
    explanation: >-
      All three variants reduce thrombopoietin secretion from transfected
      cells.
  - reference: PMID:32150607
    reference_title: "Monoallelic loss-of-function THPO variants cause heritable thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median serum TPO concentration in the subjects was 42 pg/mL (range, 17-57; n = 4), which was lower than expected for PLT"
    explanation: >-
      Patients have inappropriately low serum thrombopoietin for their
      platelet count.
  - reference: PMID:8627177
    reference_title: "Physiological regulation of early and late stages of megakaryocytopoiesis by thrombopoietin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A gene dosage effect observed in heterozygous mice suggests that the TPO gene is constitutively expressed and that the circulating TPO level is directly regulated by the platelet mass."
    explanation: >-
      Explains why one functional allele is not compensated: thrombopoietin
      output scales with gene dosage.
  downstream:
  - target: Reduced Thrombopoietin-MPL Signaling
    causal_link_type: DIRECT
  - target: Decreased circulating thrombopoietin concentration
    causal_link_type: DIRECT
- name: Reduced Thrombopoietin-MPL Signaling
  description: >-
    Thrombopoietin acting through MPL is the main regulator of the
    proliferation and differentiation of hematopoietic progenitors into
    megakaryocytes. Less circulating thrombopoietin means less MPL signaling in
    megakaryocyte progenitors. In THC9 the reduction is mild enough that other
    lineages are spared, unlike biallelic THPO loss.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: thrombopoietin-mediated signaling pathway
    modifier: DECREASED
    term:
      id: GO:0038163
      label: thrombopoietin-mediated signaling pathway
  cell_types:
  - preferred_term: megakaryocyte progenitor cell
    term:
      id: CL:0000553
      label: megakaryocyte progenitor cell
  evidence:
  - reference: PMID:32150607
    reference_title: "Monoallelic loss-of-function THPO variants cause heritable thrombocytopenia."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "Thrombopoietin (TPO) is a lineage-specific cytokine that is synthesized predominantly in hepatocytes and is an essential regulator of self-renewal of hematopoietic stem cells and their differentiation into platelet-forming megakaryocytes."
    explanation: >-
      Background on the role of thrombopoietin in megakaryopoiesis.
  downstream:
  - target: Reduced Megakaryopoiesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:8627177
      reference_title: "Physiological regulation of early and late stages of megakaryocytopoiesis by thrombopoietin."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Bone marrow from TPO-/- mice have decreased numbers of megakaryocyte-committed progenitors as well as lower ploidy in the megakaryocytes that are present."
      explanation: >-
        Loss of thrombopoietin reduces megakaryocyte progenitors and ploidy in
        mice.
- name: Reduced Megakaryopoiesis
  description: >-
    Fewer and less mature megakaryocytes in the bone marrow produce fewer
    platelets. In THC9 the deficit is confined to the platelet lineage.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: megakaryocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0030219
      label: megakaryocyte differentiation
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  evidence:
  - reference: PMID:8627177
    reference_title: "Physiological regulation of early and late stages of megakaryocytopoiesis by thrombopoietin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "TPO-/- mice have a >80% decrease in their platelets and megakaryocytes but have normal levels of all the other hematopoietic cell types."
    explanation: >-
      Thrombopoietin loss in mice selectively depletes megakaryocytes and
      platelets.
  - reference: PMID:32150607
    reference_title: "Monoallelic loss-of-function THPO variants cause heritable thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data suggest that monoallelic THPO variants confer a mild clinical phenotype with abnormalities confined to the platelet lineage."
    explanation: >-
      In patients the effect is restricted to the platelet lineage.
  downstream:
  - target: Thrombocytopenia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32150607
      reference_title: "Monoallelic loss-of-function THPO variants cause heritable thrombocytopenia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings strongly support pathogenicity of the observed variants and indicate that thrombocytopenia in the cases results from diminished secretion of TPO."
      explanation: >-
        The authors attribute the thrombocytopenia to reduced thrombopoietin
        secretion.

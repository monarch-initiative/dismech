    term:
      id: UBERON:0002129
      label: cerebellar cortex
  evidence:
  - reference: PMID:9806543
    reference_title: "Progressive ataxia, myoclonic epilepsy and cerebellar apoptosis in cystatin B-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The principal cytopathology appears to be a loss of cerebellar granule
      cells, which frequently display condensed nuclei, fragmented DNA and other
      cellular changes characteristic of apoptosis.
    explanation: >-
      Establishes apoptotic cerebellar granule cell loss as the principal
      cytopathology in the cystatin B-null model.
  - reference: PMID:9806543
    reference_title: "Progressive ataxia, myoclonic epilepsy and cerebellar apoptosis in cystatin B-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      cystatin B, a non-caspase cysteine protease inhibitor, has a role in
      preventing cerebellar apoptosis.
    explanation: >-
      Attributes the cerebellar apoptosis directly to loss of cystatin B's
      protease-inhibitory function.
  - reference: PMID:22538221
    reference_title: "Loss of cortical GABA terminals in Unverricht-Lundborg disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In CSTB knockout mice, a progressive decrease in neocortex thickness was
      found, associated with a prevalent loss of GABA interneurons.
    explanation: >-
      Documents preferential loss of cortical GABAergic interneurons in the model.
  - reference: PMID:22538221
    reference_title: "Loss of cortical GABA terminals in Unverricht-Lundborg disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A marked reduction in VGAT labeling was found in the cortex of both CSTB

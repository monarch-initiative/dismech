name: Unverricht-Lundborg Disease
creation_date: "2026-07-25T00:00:00Z"
description: >-
  Unverricht-Lundborg disease (ULD), also called progressive myoclonic epilepsy
  type 1 (EPM1) or Baltic myoclonus, is an autosomal recessive neurodegenerative
  progressive myoclonus epilepsy caused by biallelic loss-of-function of CSTB,
  the gene encoding cystatin B. Cystatin B is a ubiquitously expressed
  intracellular inhibitor of the cysteine cathepsins (thiol proteases). In the
  great majority of patients the causal lesion is an unstable expansion of a
  dodecamer (12-mer) repeat in the CSTB promoter that reduces CSTB transcription;
  a minority carry point/indel loss-of-function variants, often in compound
  heterozygosity with the repeat expansion. Onset is typically between 6 and 16
  years with stimulus-sensitive (action) myoclonus and generalized tonic-clonic
  seizures; over the following years progressive cerebellar signs (ataxia,
  incoordination, intention tremor, dysarthria) develop, together with emotional
  lability, depression, and a mild decline in cognition, while patients remain
  largely mentally alert. It is one of the most common progressive myoclonus
  epilepsies and is markedly enriched in Finland, the Baltic region, and the
  western Mediterranean through founder effects. EPM1 is distinguished from the
  other classic progressive myoclonus epilepsies (notably Lafora disease) by its
  slower course and relative preservation of cognition. Treatment is symptomatic;
  importantly, phenytoin can aggravate neurologic symptoms and may accelerate
  cerebellar degeneration, while several sodium-channel-blocking, GABAergic, and
  gabapentinoid antiseizure drugs can aggravate myoclonus and are avoided.

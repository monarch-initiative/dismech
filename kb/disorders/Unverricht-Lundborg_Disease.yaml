    modifier: INCREASED
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  evidence:
  - reference: PMID:9806543
    reference_title: "Progressive ataxia, myoclonic epilepsy and cerebellar apoptosis in cystatin B-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      mice lacking cystatin B develop myoclonic seizures and ataxia, similar to
      symptoms seen in the human disease.
    explanation: >-
      Ties cerebellar cystatin B loss to the ataxia component recapitulated in the
      model.
  - reference: PMID:18325013
    reference_title: "Clinical picture of EPM1-Unverricht-Lundborg disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some years after the onset ataxia, incoordination, intentional tremor, and
      dysarthria develop.
    explanation: >-
      Documents the delayed, progressive cerebellar clinical arm in patients.
  downstream:

genetic:
- name: CSTB
  gene_term:
    preferred_term: CSTB
    term:
      id: hgnc:2482
      label: CSTB
  association: Loss-of-Function (dodecamer repeat expansion or point/indel variants)
  presence: Positive
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    CSTB encodes cystatin B, an intracellular cysteine protease (cathepsin)
    inhibitor. The most common pathogenic allele is an unstable dodecamer (12-mer)
    repeat expansion in the promoter that reduces CSTB expression; minority
    alleles are loss-of-function point/indel variants, often compound heterozygous
    with the expansion. Premutation-length alleles are unstable on transmission.
  evidence:
  - reference: PMID:9126745
    reference_title: "Dodecamer repeat expansion in cystatin B gene in progressive myoclonus epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two point mutations in the cysteine proteinase inhibitor gene cystatin B
      (CSTB), proved that this gene is responsible for EPM1
    explanation: >-
      Establishes CSTB (a cysteine proteinase inhibitor gene) as the EPM1 gene.
  - reference: PMID:8596935
    reference_title: "Mutations in the gene encoding cystatin B in progressive myoclonus epilepsy (EPM1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      levels of messenger RNA encoded by this gene were found to be decreased in
      cells from affected individuals.
    explanation: >-
      Documents reduced CSTB expression in patient cells, the loss-of-function
      mechanism.
diagnosis:
- name: CSTB Molecular Diagnosis
  description: >-
    Diagnosis is established in a proband with suggestive clinical findings by
    identifying biallelic CSTB dodecamer repeat expansions, or compound
    heterozygosity for a repeat expansion and a CSTB sequence variant, by
    molecular genetic testing (repeat-primed PCR sizing for the expansion plus
    sequencing).
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
    qualifiers:
    - predicate:
        preferred_term: has participant
        term:
          id: RO:0000057
          label: has participant
      value:
        preferred_term: CSTB
        term:
          id: hgnc:2482
          label: CSTB
  results: >-
    Biallelic CSTB dodecamer repeat expansions (or a repeat expansion in compound
    heterozygosity with a CSTB sequence variant) confirm the diagnosis.
  evidence:
  - reference: PMID:20301321
    reference_title: "Progressive Myoclonic Epilepsy Type 1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      biallelic abnormal CCC-CGC-CCC-GCG dodecamer repeat expansions in CSTB or
      compound heterozygosity for a CSTB dodecamer repeat expansion and a CSTB
      sequence variant
    explanation: >-
      The GeneReviews chapter defines the molecular criteria for establishing the
      diagnosis.
- name: Electroencephalography
  description: >-
    EEG documents generalized epileptiform activity and a photoparoxysmal
    (photosensitive) response supporting the progressive myoclonus epilepsy
    phenotype.
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  results: >-
    Generalized spike- or polyspike-and-wave discharges and a photoparoxysmal
    response support the EPM1 phenotype. Both are common near onset but can
    diminish during long-term follow-up, so their absence later does not exclude
    EPM1.
  evidence:
  - reference: PMID:17158032
    reference_title: "Long-term evolution of EEG in Unverricht-Lundborg disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GSWD were present in 92% of patients at the onset of the disease and
      gradually disappeared during the follow-up with a significant difference
      (p<0.001) after the 15th year of disease. PPR was present in 88% of patients
      at the disease onset and gradually disappeared with a significant difference
      (p<0.001) after the 10th year of disease.
    explanation: >-
      Longitudinal EEG review in 25 patients supports generalized spike/polyspike
      discharges and photoparoxysmal responses near onset while documenting their
      later decline.
differential_diagnoses:
- name: Lafora Disease (EPM2)
  description: >-
    Lafora disease is the other classic autosomal recessive progressive myoclonus
    epilepsy of adolescent onset, caused by EPM2A (laforin) or NHLRC1/EPM2B
    (malin). Lafora bodies may be demonstrated on skin biopsy. It follows a more
    rapidly progressive course with early cognitive decline and dementia, unlike
    the relatively preserved cognition and slower course of EPM1.
  distinguishing_features:
  - Biallelic CSTB variants (dodecamer expansion) favor EPM1.
  - EPM2A/NHLRC1 variants with Lafora bodies and rapid dementia favor Lafora disease.
  evidence:
  - reference: PMID:20301563
    reference_title: "Progressive Myoclonus Epilepsy, Lafora Type."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cognitive decline becomes apparent at or soon after the onset of seizures.
      Dysarthria and ataxia appear early, while spasticity appears late. Emotional
      disturbances and confusion are common in the early stages of the disease
      and are followed by dementia.
    explanation: >-
      GeneReviews supports the early cognitive decline and dementia that help
      distinguish Lafora disease from the generally slower EPM1 course.
  - reference: PMID:20301563
    reference_title: "Progressive Myoclonus Epilepsy, Lafora Type."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of Lafora disease is established in a proband with
      characteristic neurologic findings and/or biallelic pathogenic variants in
      one of the two known causative genes, EPM2A or NHLRC1, identified by molecular
      genetic testing. On rare occasion, a skin biopsy to detect Lafora bodies is
      necessary to confirm the diagnosis.
    explanation: >-
      Supports the causal genes and the diagnostic occurrence of Lafora bodies.
- name: Other progressive myoclonus epilepsies
  description: >-
    Other PMEs (e.g., myoclonic epilepsy with ragged-red fibers/MERRF, the
    neuronal ceroid lipofuscinoses, and sialidosis) overlap through action
    myoclonus, seizures, and progressive neurologic deterioration. Their age of
    onset, associated features, clinical course, inheritance, and targeted
    biochemical, pathologic, or genetic testing help distinguish them.
  distinguishing_features:
  - A biallelic CSTB lesion favors EPM1.
  - A causal variant or storage material specific to another PME favors that diagnosis.
  evidence:
  - reference: PMID:26060909
    reference_title: "Progressive Myoclonus Epilepsies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The progressive myoclonus epilepsies (PMEs) comprise a group of rare and
      heterogeneous disorders defined by the combination of action myoclonus,
      epileptic seizures, and progressive neurologic deterioration.
    explanation: >-
      Defines the core overlapping clinical pattern of the PME differential.
  - reference: PMID:26060909
    reference_title: "Progressive Myoclonus Epilepsies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The specific diseases that cause PME are diagnosed by recognition of their
      age of onset, the associated clinical symptoms, the clinical course, the
      pattern of inheritance, and by special investigations such as enzyme
      measurement, skin/muscle biopsy, or gene testing.
    explanation: >-
      Supports the clinical, biochemical, pathologic, and genetic distinctions
      used to separate EPM1 from other PMEs.
progression:
- phase: Onset (childhood/adolescence)
  notes: >-
    Onset is typically between 6 and 16 years with stimulus-sensitive myoclonus
    and generalized tonic-clonic seizures.
  evidence:
  - reference: PMID:18325013
    reference_title: "Clinical picture of EPM1-Unverricht-Lundborg disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      characterized by age of onset from 6 to 16 years, stimulus-sensitive
      myoclonus, and tonic-clonic epileptic seizures.
    explanation: >-
      Documents the childhood-to-adolescent onset with myoclonus and tonic-clonic
      seizures.
- phase: Progression (young adulthood)
  notes: >-
    Over subsequent years the action myoclonus worsens and becomes the dominant
    disabling feature, while cerebellar signs (ataxia, incoordination, intention
    tremor, dysarthria) develop and cognition declines mildly; tonic-clonic
    seizures are usually well controlled.
  evidence:
  - reference: PMID:18325013
    reference_title: "Clinical picture of EPM1-Unverricht-Lundborg disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Some years after the onset ataxia, incoordination, intentional tremor, and
      dysarthria develop.
    explanation: >-
      Documents the delayed progressive cerebellar arm.
- phase: Long-term disability and survival
  notes: >-
    Course is heterogeneous: approximately 10% of Finnish registry cases remained
    very mild with decades of independence, but disability commonly accumulated
    and survival diverged from matched controls after age 40. Lower respiratory
    tract infection was the immediate cause in 56% of recorded deaths.
  evidence:
  - reference: PMID:32943486
    reference_title: "Unverricht-Lundborg disease (EPM1) in Finland: A nationwide population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The survival rates of the patients were comparable to matched controls up
      to 40 years of age, but poorer during long-term follow-up (cumulative
      survival 26.4% vs 78.0%), with a hazard ratio (HR) for death of 4.61.
    explanation: >-
      The nationwide registry provides matched-control long-term survival data.
  - reference: PMID:32943486
    reference_title: "Unverricht-Lundborg disease (EPM1) in Finland: A nationwide population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The immediate cause of death was a lower respiratory tract infection in 56%
      of deaths.
    explanation: >-
      The registry directly quantifies the leading immediate cause of death.
  - reference: PMID:32943486
    reference_title: "Unverricht-Lundborg disease (EPM1) in Finland: A nationwide population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In approximately 10% of all cases, the disease progression appeared very
      mild; some patients retained functional independence for decades.
    explanation: >-
      This preserves the important mild-course subgroup rather than presenting
      the Finnish prognosis as uniform.

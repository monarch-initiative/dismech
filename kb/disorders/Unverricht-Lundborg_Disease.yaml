  evidence:
  - reference: PMID:22538221
    reference_title: "Loss of cortical GABA terminals in Unverricht-Lundborg disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      loss of cortical GABA input occurs in a relevant animal model and in a case
      of human ULD, leading to a condition of latent hyperexcitability that favors
      myoclonus and seizures.
    explanation: >-
      Directly links loss of cortical GABAergic input to the hyperexcitable state
      that generates myoclonus and seizures.
  - reference: PMID:20301321
    reference_title: "Progressive Myoclonic Epilepsy Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the myoclonic jerks are progressive, action activated, and treatment
      resistant, and can be severely disabling.
    explanation: >-
      Characterizes the action-activated, progressive, treatment-resistant
      myoclonus that is the clinical signature of this hyperexcitable arm.
  downstream:

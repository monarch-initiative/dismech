    - preferred_term: perampanel
      term:
        id: CHEBI:71013
        label: perampanel
  evidence:
  - reference: PMID:18325013
    reference_title: "Clinical picture of EPM1-Unverricht-Lundborg disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clonazepam and high-dose piracetam are used to treat myoclonus, whereas
      levetiracetam seems to be effective for both myoclonus and generalized
      seizures.
    explanation: >-
      Documents clonazepam, high-dose piracetam, and levetiracetam in myoclonus
      management.
  - reference: PMID:20301321
    reference_title: "Progressive Myoclonic Epilepsy Type 1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Topiramate and zonisamide may also be used as add-on therapy.
    explanation: >-
      GeneReviews supplies the clinical-management basis for these two add-on
      agents not named in the older clinical review.
  - reference: PMID:28166365
    reference_title: "Perampanel in 12 patients with Unverricht-Lundborg disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten patients had a clear clinical response of myoclonus, and five were able
      to reduce concomitant therapy. Improvement was noted sometimes as soon as
      with 2 mg/day. Epileptic seizures stopped on PER in the six patients who
      still had experienced generalized tonic-clonic or myoclonic seizures
      (100%).
    explanation: >-
      The small open-label series supports potential efficacy against myoclonus
      and ongoing seizures while not implying randomized-trial certainty.
  - reference: PMID:28166365
    reference_title: "Perampanel in 12 patients with Unverricht-Lundborg disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Psychological and behavioral side-effects were observed in six patients
      (50%) and led to withdrawal of PER in three cases and dose reduction in
      three, with abatement of the problems.
    explanation: >-
      Quantifies the important behavioral tolerability limitation and its clinical
      consequences in the same series.
- name: Avoidance of Aggravating Antiseizure Drugs
  description: >-
    Certain antiseizure drugs worsen EPM1 and are avoided. Phenytoin aggravates
    the neurologic symptoms or even accelerates cerebellar degeneration; sodium
    channel blockers (carbamazepine, oxcarbazepine), GABAergic drugs (tiagabine,
    vigabatrin), and gabapentin and pregabalin may aggravate the myoclonus and
    myoclonic seizures.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301321
    reference_title: "Progressive Myoclonic Epilepsy Type 1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Phenytoin aggravates neurologic symptoms or even accelerates cerebellar
      degeneration; sodium channel blockers (carbamazepine, oxcarbazepine),
      GABAergic drugs (tiagabine, vigabatrin), and gabapentin and pregabalin may
      aggravate myoclonus and myoclonic seizures.
    explanation: >-
      The GeneReviews agents-to-avoid guidance identifies phenytoin and
      sodium-channel-blocking/GABAergic drugs as harmful in EPM1.
  - reference: PMID:18325013

- name: Progressive Cerebellar Degeneration
  description: >-
    Progressive apoptotic loss of cerebellar neurons, together with the cognitive
    consequences of diffuse neurodegeneration, produces the delayed and slowly
    progressive clinical arm of EPM1: cerebellar ataxia, incoordination, intention
    tremor, and dysarthria, with a mild decline in cognition over time while
    patients remain largely mentally alert.
  role: consequence

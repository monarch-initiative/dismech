  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  description: >-
    Loss of cortical GABAergic inhibition shifts the cortical excitation-inhibition
    balance toward excitation, producing latent network hyperexcitability. This
    manifests as the hallmark stimulus-sensitive (action- and reflex-activated)
    myoclonus and as generalized, including photosensitive, seizures.
  role: effector
  cell_types:
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617

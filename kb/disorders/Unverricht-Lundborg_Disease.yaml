discussions:
- discussion_id: gap_epm1_cathepsin_vs_oxidative_primary_driver
  prompt: >-
    Is the primary neurodegenerative driver in EPM1 the dysregulation of lysosomal
    cysteine cathepsins released from cystatin B inhibition, or the loss of
    cystatin B's oxidative-stress/mitochondrial protective function, and how do
    these two arms interact to cause selective neuronal death?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Cathepsin B-Dependent Oxidative Stress Vulnerability
  - pathophysiology#Cerebellar Granule Neuron Death and Degeneration
  rationale: >-
    Cystatin B is defined biochemically as a cathepsin inhibitor, yet cystatin
    B-deficient neurodegeneration is demonstrably coupled to oxidative stress and
    is mediated, at least in part, by cathepsin B. Whether the disease is driven
    primarily by unrestrained cathepsin proteolysis, by failed antioxidant/
    mitochondrial protection, or by an obligate interaction of the two is
    unresolved, and the answer determines whether cathepsin inhibition or
    antioxidant strategies are the more rational disease-modifying target.
  evidence:
  - reference: PMID:19420257
    reference_title: "Cystatin B deficiency sensitizes neurons to oxidative stress in progressive myoclonus epilepsy, EPM1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The Cystatin B deficiency-induced predisposition to oxidative stress in
      neurons is mediated by the lysosomal protease Cathepsin B.
    explanation: >-
      Shows the two candidate arms are mechanistically linked (cathepsin B
      mediates the oxidative-stress vulnerability), framing the primary-driver
      question.
  - reference: PMID:38247861
    reference_title: "The Roles of Cystatin B in the Brain and Pathophysiological Mechanisms of Progressive Myoclonic Epilepsy Type 1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      protection against oxidative stress, likely through regulation of
      mitochondrial function.
    explanation: >-
      Highlights the parallel oxidative/mitochondrial-protective role of cystatin
      B whose loss is the alternative primary driver. Evidence source is OTHER
      because this is a review article.
  proposed_experiments:
  - experiment_id: exp_epm1_cathepsin_vs_antioxidant_rescue
    name: Cathepsin-inhibition versus antioxidant rescue in cystatin B-deficient neurons
    description: >-
      In cystatin B-null cerebellar granule neurons and mice, compare selective
      cathepsin B inhibition, genetic cathepsin B reduction, and antioxidant/
      mitochondrial-protective treatment for their ability to prevent neuronal
      apoptosis, cerebellar degeneration, and myoclonus, to determine which arm is
      the dominant driver.
    experiment_type:
      preferred_term: pharmacologic and genetic rescue experiment
    perturbations:
    - name: Cathepsin B inhibition or knockdown versus antioxidant treatment
      target: pathophysiology#Cathepsin B-Dependent Oxidative Stress Vulnerability
      genes:
      - preferred_term: CSTB
        term:
          id: hgnc:2482
          label: CSTB
      description: >-
        Apply selective cathepsin B inhibition or genetic cathepsin B reduction,
        versus antioxidant/mitochondrial-protective treatment, on the cystatin
        B-deficient background.
    readouts:
    - name: Neuronal apoptosis and cerebellar degeneration
      target: pathophysiology#Cerebellar Granule Neuron Death and Degeneration
      biological_processes:
      - preferred_term: neuron apoptotic process
        term:
          id: GO:0051402
          label: neuron apoptotic process
        modifier: INCREASED
      assays:
      - preferred_term: TUNEL apoptosis assay
      - preferred_term: cerebellar histopathology
      direction: NEGATIVE
    controls:
    - name: Untreated cystatin B-deficient neurons
      description: Cystatin B-deficient neurons/mice receiving vehicle only.
    - name: Wild-type neurons
      description: Cystatin B-sufficient neurons/mice.
    decision_criterion: >-
      The arm whose targeted correction most fully prevents apoptosis, cerebellar
      degeneration, and myoclonus is the dominant driver; comparable partial
      rescue by both, with additivity, supports an obligate interaction.
    would_support:
    - pathophysiology#Cathepsin B-Dependent Oxidative Stress Vulnerability
    - pathophysiology#Cerebellar Granule Neuron Death and Degeneration
- discussion_id: gap_epm1_cstb_mouse_fidelity
  prompt: >-
    Does the cystatin B-null mouse, which shows early and prominent cerebellar
    granule cell apoptosis, faithfully capture the human EPM1 trajectory — in
    which action myoclonus and cortical GABAergic dysfunction dominate and
    cognition is relatively preserved — or does it over-represent cerebellar
    degeneration relative to the human cortical-hyperexcitability phenotype?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Cerebellar Granule Neuron Death and Degeneration
  - pathophysiology#Cortical Hyperexcitability
  rationale: >-
    Model evidence clearly exists: the Cstb-null mouse reproduces myoclonus,
    ataxia, cerebellar granule cell apoptosis, cortical GABAergic interneuron
    loss, and cerebellar oxidative damage. The open translational question is
    fidelity of emphasis — human EPM1 is dominated by disabling,
    treatment-resistant cortical action myoclonus with relatively preserved cognition,
    whereas the mouse phenotype foregrounds cerebellar granule cell death; whether
    the model's cell-type and regional emphasis matches the human disease gates
    its use for preclinical testing of cortically targeted therapies.
  evidence:
  - reference: PMID:9806543
    reference_title: "Progressive ataxia, myoclonic epilepsy and cerebellar apoptosis in cystatin B-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The principal cytopathology appears to be a loss of cerebellar granule
      cells, which frequently display condensed nuclei, fragmented DNA and other
      cellular changes characteristic of apoptosis.
    explanation: >-
      Establishes that the model's principal lesion is cerebellar granule cell
      apoptosis, confirming model evidence exists for the mismatch question.
  - reference: PMID:22538221
    reference_title: "Loss of cortical GABA terminals in Unverricht-Lundborg disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A marked reduction in VGAT labeling was found in the cortex of both CSTB
      knockout mice and an ULD patient.
    explanation: >-
      Documents the cortical GABAergic phenotype in human ULD tissue, the human
      arm whose murine emphasis is the open question.
  proposed_experiments:
  - experiment_id: exp_epm1_cortical_vs_cerebellar_mapping
    name: Cross-species cortical-versus-cerebellar contribution mapping in EPM1
    description: >-
      Quantitatively compare the temporal and regional sequence of cortical
      GABAergic interneuron loss versus cerebellar granule cell apoptosis in
      Cstb-null mice against human EPM1 natural-history imaging/neurophysiology and
      post-mortem tissue, and against EPM1 patient iPSC-derived cortical
      interneuron and cerebellar models, to test whether the mouse over-weights the
      cerebellar arm.
    experiment_type:
      preferred_term: cross-species regional phenotyping experiment
    perturbations:
    - name: Cystatin B loss of function
      target: pathophysiology#Cerebellar Granule Neuron Death and Degeneration
      genes:
      - preferred_term: CSTB
        term:
          id: hgnc:2482
          label: CSTB
      description: >-
        Cstb-null mice and CSTB-deficient human iPSC-derived cortical interneuron
        and cerebellar neuron models compared against controls.
    readouts:
    - name: Regional GABAergic versus cerebellar granule cell loss over time
      target: pathophysiology#Cortical Hyperexcitability
      biological_processes:
      - preferred_term: neuron apoptotic process
        term:
          id: GO:0051402
          label: neuron apoptotic process
        modifier: INCREASED
      assays:
      - preferred_term: quantitative immunohistochemistry
      - preferred_term: electrophysiological recording
      direction: POSITIVE
    controls:
    - name: Wild-type littermates
      description: Age-matched cystatin B-sufficient mice.
    - name: Isogenic-corrected human neurons
      description: Patient iPSC lines with the CSTB lesion corrected.
    decision_criterion: >-
      The mouse is a faithful EPM1 model if the relative timing and magnitude of
      cortical GABAergic versus cerebellar granule cell involvement matches human
      data; a mismatch is supported if the mouse disproportionately foregrounds
      cerebellar granule cell death relative to the human cortical phenotype.
    would_support:
    - pathophysiology#Cerebellar Granule Neuron Death and Degeneration
    - pathophysiology#Cortical Hyperexcitability
review_notes: >-
  The REVIEW separates the experimentally supported cerebellar oxidative-death
  arm from the cortical GABAergic-input arm, adds model-supported early
  microglial and human-organoid neurodevelopmental arms, and attaches
  claim-specific evidence to every retained causal edge. Photosensitive seizures,
  dysarthria, and intention tremor are connected with explicitly PARTIAL evidence;
  cognitive decline, depression, and emotional lability remain unwired because
  the retained sources establish their occurrence but not a specific causal route
  from a curated mechanism node. The two completed brivaracetam trials are
  recorded with their negative primary efficacy result, which takes precedence
  over older narrative guidance suggesting efficacy. PMID:18325013 and
  PMID:20301321 evidence items are classified as OTHER because both sources are
  narrative clinical reviews rather than primary human studies.

pathophysiology:
- name: CSTB Dodecamer Repeat Expansion and Cystatin B Deficiency
  description: >-
    The initiating lesion is biallelic loss-of-function of CSTB. In most patients
    an unstable expansion of a dodecamer (12-mer) repeat in the CSTB promoter
    reduces transcription; a minority carry loss-of-function point/indel variants
    (e.g., a splice-site or nonsense variant), frequently in compound
    heterozygosity with the repeat expansion. The shared consequence is markedly
    reduced cystatin B, an intracellular thiol (cysteine) protease inhibitor.
  role: trigger
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  molecular_functions:
  - preferred_term: cysteine-type endopeptidase inhibitor activity
    term:
      id: GO:0004869
      label: cysteine-type endopeptidase inhibitor activity
    modifier: DECREASED
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:9126745
    reference_title: "Dodecamer repeat expansion in cystatin B gene in progressive myoclonus epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the majority of EPM1 alleles contain expansions of a dodecamer (12-mer)
      repeat located about 70 nucleotides upstream of the transcription start site
    explanation: >-
      Identifies the promoter dodecamer repeat expansion as the predominant EPM1
      lesion.
  - reference: PMID:9126745
    reference_title: "Dodecamer repeat expansion in cystatin B gene in progressive myoclonus epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Normal alleles contain 2 or 3 copies of this repeat whereas mutant alleles
      contain more than 60 such repeats and have reduced levels of CSTB messenger
      RNA in blood but not in cell lines.
    explanation: >-
      Shows the expansion reduces CSTB mRNA, establishing the loss-of-expression
      mechanism.
  - reference: PMID:8596935
    reference_title: "Mutations in the gene encoding cystatin B in progressive myoclonus epilepsy (EPM1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two mutations, a 3' splice site mutation and a stop codon mutation, were
      identified in the gene encoding cystatin B in EPM1 patients
    explanation: >-
      Documents the minority loss-of-function point-variant class of CSTB alleles.
  - reference: PMID:38247861
    reference_title: "The Roles of Cystatin B in the Brain and Pathophysiological Mechanisms of Progressive Myoclonic Epilepsy Type 1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The CSTB protein functions as an intracellular thiol protease inhibitor and
      inhibits Cathepsin function.
    explanation: >-
      Defines cystatin B as an intracellular thiol (cysteine) protease inhibitor
      of cathepsins, whose deficiency is the trigger. Evidence source is OTHER
      because this is a review article.
  downstream:
  - target: Loss of Cathepsin Inhibition and Redox Imbalance
    causal_link_type: DIRECT
- name: Loss of Cathepsin Inhibition and Redox Imbalance
  description: >-
    Cystatin B deficiency removes physiological restraint on lysosomal cysteine
    cathepsins and, in parallel, impairs neuronal defenses against oxidative
    stress. Cystatin B is normally induced by oxidative stress and protects
    neurons; its loss produces impaired redox homeostasis, with the oxidative
    vulnerability shown to be mediated by the lysosomal protease cathepsin B.
  role: amplifier
  cell_types:
  - preferred_term: cerebellar granule cell
    term:
      id: CL:0001031
      label: cerebellar granule cell
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: ABNORMAL
  molecular_functions:
  - preferred_term: cysteine-type peptidase activity
    term:
      id: GO:0008234
      label: cysteine-type peptidase activity
    modifier: INCREASED
  evidence:
  - reference: PMID:19420257
    reference_title: "Cystatin B deficiency sensitizes neurons to oxidative stress in progressive myoclonus epilepsy, EPM1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The Cystatin B deficiency-induced predisposition to oxidative stress in
      neurons is mediated by the lysosomal protease Cathepsin B.
    explanation: >-
      Links loss of cystatin B to oxidative vulnerability through dysregulated
      cathepsin B activity, the coupled cathepsin/redox amplifier step.
  - reference: PMID:19420257
    reference_title: "Cystatin B deficiency sensitizes neurons to oxidative stress in progressive myoclonus epilepsy, EPM1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      increased lipid peroxidation, in the cerebellum of Cystatin B knock-out mice
      in vivo.
    explanation: >-
      Demonstrates in vivo oxidative damage in the cystatin B-deficient
      cerebellum.
  - reference: PMID:38247861
    reference_title: "The Roles of Cystatin B in the Brain and Pathophysiological Mechanisms of Progressive Myoclonic Epilepsy Type 1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      protection against oxidative stress, likely through regulation of
      mitochondrial function.
    explanation: >-
      Establishes cystatin B's normal role in protecting neurons against oxidative
      stress. Evidence source is OTHER because this is a review article.
  downstream:
  - target: Neuronal Apoptosis and Cerebellar/GABAergic Neurodegeneration
    causal_link_type: DIRECT
- name: Neuronal Apoptosis and Cerebellar/GABAergic Neurodegeneration
  description: >-
    The coupled cathepsin/redox derangement drives progressive neuronal
    apoptosis. In the cystatin B-null mouse the principal cytopathology is
    apoptotic loss of cerebellar granule neurons, and there is a preferential
    depletion of cortical GABAergic (inhibitory) interneurons, confirmed in human
    ULD cortex. This is the central effector that connects the molecular lesion to
    the myoclonus/seizure and cerebellar clinical arms.
  role: central_effector
  cell_types:
  - preferred_term: cerebellar granule cell
    term:
      id: CL:0001031
      label: cerebellar granule cell
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron

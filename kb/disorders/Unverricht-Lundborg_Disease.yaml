- name: Myoclonus-Directed Add-On Therapy
  description: >-
    Clonazepam and high-dose piracetam are used to treat myoclonus, while
    levetiracetam is used for both myoclonus and generalized seizures. Topiramate
    and zonisamide may also be used as add-on therapy. An open-label series
    supports perampanel for refractory myoclonus and seizures, but psychological
    or behavioral adverse effects occurred in half of the small cohort and
    required withdrawal or dose reduction. Brivaracetam is excluded from this
    treatment block because two phase III trials did not show a statistically
    significant action-myoclonus benefit.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy

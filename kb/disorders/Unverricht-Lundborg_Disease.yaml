animal_models:
- name: Cstb knockout mouse
  species: Mouse (Mus musculus)
  genotype: Cystatin B (Cstb) knockout
  description: >-
    Cystatin B-null mice develop myoclonic seizures and ataxia resembling the
    human disease, with apoptotic loss of cerebellar granule neurons, progressive
    loss of cortical GABAergic interneurons, and in vivo cerebellar oxidative
    damage, making them a validated EPM1 model.
  modeled_mechanisms:
  - target: Cerebellar Granule Neuron Death and Degeneration
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The knockout reproduces the principal apoptotic cerebellar granule-cell
      cytopathology used in the EPM1 causal graph.
    limitations: >-
      The null genotype models complete loss of Cstb rather than the residual
      expression typical of most human promoter-repeat alleles.
    evidence:
    - reference: PMID:9806543
      reference_title: "Progressive ataxia, myoclonic epilepsy and cerebellar apoptosis in cystatin B-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The principal cytopathology appears to be a loss of cerebellar granule
        cells, which frequently display condensed nuclei, fragmented DNA and
        other cellular changes characteristic of apoptosis.
      explanation: >-
        Directly establishes recapitulation of the graph's cerebellar
        granule-neuron-death mechanism.
  - target: Cortical GABAergic Input Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The knockout reproduces progressive cortical GABA-interneuron loss and
      reduced inhibitory input, a mechanism also observed in one human ULD cortex.
    limitations: >-
      Human tissue confirmation is limited to one post-mortem case, and the null
      mouse genotype is more severe than the common human promoter expansion.
    evidence:
    - reference: PMID:22538221
      reference_title: "Loss of cortical GABA terminals in Unverricht-Lundborg disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In CSTB knockout mice, a progressive decrease in neocortex thickness was
        found, associated with a prevalent loss of GABA interneurons.
      explanation: >-
        Directly supports partial recapitulation of cortical GABAergic input loss
        in the knockout model.
  evidence:
  - reference: PMID:9806543
    reference_title: "Progressive ataxia, myoclonic epilepsy and cerebellar apoptosis in cystatin B-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      mice lacking cystatin B develop myoclonic seizures and ataxia, similar to
      symptoms seen in the human disease.
    explanation: >-
      The cystatin B-null mouse recapitulates the core myoclonus/ataxia phenotype
      and cerebellar apoptosis of EPM1.
  - reference: PMID:19420257
    reference_title: "Cystatin B deficiency sensitizes neurons to oxidative stress in progressive myoclonus epilepsy, EPM1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cystatin B knockout in a mouse model of EPM1 triggers progressive
      degeneration of cerebellar granule neurons.
    explanation: >-
      Confirms progressive cerebellar granule neuron degeneration in the model.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypochondroplasia is an autosomal dominant skeletal dysplasia expressing postnatal onset of short stature with mild rhizomelic shortening of the limbs."
    explanation: >

discussions:
- discussion_id: gap_infigratinib_potency_against_n540k
  prompt: >-
    Is infigratinib actually a potent inhibitor of the FGFR3 p.Asn540Lys receptor
    that causes ~70% of hypochondroplasia, and does the answer depend on the cell
    system and receptor construct used to measure it?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#FGFR3 constitutive activation
  - pathophysiology#MAPK/ERK cascade hyperactivation
  rationale: >-
    This is a live, unresolved disagreement in the 2026 literature with direct
    consequences for a drug already in phase 2/3 trials in hypochondroplasia, so
    it must not be curated as settled in either direction. Ursachi et al.
    (J Bone Miner Res 2026) reported that infigratinib inhibits FGFR3-N540K only
    weakly (IC50 ~514 nM) relative to wild type and to the achondroplasia
    p.Gly380Arg allele, consistent with earlier oncology-derived evidence that
    N540K is a gatekeeper-adjacent resistance substitution. The original authors
    replied that the discrepancy is methodological — that the weak-inhibition
    result was obtained with C-terminally V5-tagged FGFR3 in rat L6 myoblasts,
    a non-cartilage system, whereas their own work used untagged full-length
    FGFR3 in ATDC5 chondrogenic cells and the Fgfr3-N534K mouse, and that
    C-terminal tagging is known to perturb FGFR3 signaling, particularly for
    N540K. Both positions are internally coherent, and the disagreement is about
    which in vitro system is the valid proxy for a chondrocyte, not about the
    data. Crucially, the achondroplasia result cannot be transferred: the phase 3
    infigratinib evidence (PMID:42370681) is entirely in p.Gly380Arg
    achondroplasia, a different allele in a different position in the receptor.
    Until the hypochondroplasia trial reads out, dismech should not curate
    infigratinib as an effective hypochondroplasia treatment, and should not
    curate it as ineffective either. Note also that TYRA-300, an FGFR3-selective
    inhibitor, has separate preclinical activity in the same Fgfr3-N534K
    hypochondroplasia mouse model, so a negative result for infigratinib against
    N540K would not close the receptor-directed strategy.
  evidence:
  - reference: PMID:41593746
    reference_title: 'Response to letter to the editor for "Infigratinib low dose therapy is an effective strategy to treat hypochondroplasia".'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Ursachi et al. evaluated in vitro potency of infigratinib against N540K variant by expressing C-terminally V5-tagged FGFR3 in rat L6 cells (non-disease relevant cell) and concluded that FGFR3-N540K is weakly inhibited by infigratinib (IC50"
    explanation: >-
      States the opposing finding and the methodological objection to it, in the
      original authors' own words.
  - reference: PMID:41593746
    reference_title: "Response to letter to the editor for \\\"Infigratinib low dose therapy is an effective strategy to treat hypochondroplasia\\\"."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In these condition-relevant models, our findings markedly differ from those reported by Ursachi et al. The poor sensitivity of infigratinib to the N540K variant of FGFR3 observed in these other studies is likely due to the specific cell system and receptor construct employed."
    explanation: Confirms the dispute is unresolved and turns on model choice.
  - reference: PMID:41593746
    reference_title: "Response to letter to the editor for \\\"Infigratinib low dose therapy is an effective strategy to treat hypochondroplasia\\\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, infigratinib is being evaluated in a phase 2/3 clinical trial in children with HCH."
    explanation: >-
      Establishes that the question is expected to be settled clinically, which
      is why no mechanism claim should be curated ahead of it.
  proposed_experiments:
  - experiment_id: exp_infigratinib_n540k_head_to_head
    name: Head-to-head potency assay against untagged FGFR3-N540K in chondrogenic cells
    description: >-
      Measure infigratinib IC50 against untagged full-length FGFR3-N540K and
      against C-terminally tagged FGFR3-N540K side by side, in both ATDC5
      chondrogenic cells and a non-cartilage line, in one laboratory with one
      readout. This directly tests the tagging/cell-system explanation the two
      groups disagree about instead of comparing across papers.
  - experiment_id: exp_hch_infigratinib_trial_by_genotype
    name: Readout of the hypochondroplasia infigratinib trial by genotype
    description: >-
      Report growth-velocity response in the phase 2/3 hypochondroplasia trial
      stratified by FGFR3 allele (N540K versus the non-N540K minority), which is
      the only measurement that settles whether the in vitro disagreement matters
      clinically.
- discussion_id: gap_hch_growth_plate_drug_delivery
  prompt: >-
    Can cartilage-targeted delivery overcome the fact that the growth plate is
    avascular and alymphatic, and does that change which molecular targets are
    reachable in hypochondroplasia?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired endochondral ossification
  rationale: >-
    Every systemic therapy for FGFR3 chondrodysplasia has to reach a tissue with
    no blood supply and no lymphatic drainage, which caps achievable
    growth-plate drug concentration and is a plausible contributor to the modest
    effect sizes seen with CNP analogues. A 2026 study addressed this with
    chondrocyte-membrane-coated nanoparticles bearing a collagen-II-binding
    peptide, using them to deliver the Hedgehog agonist purmorphamine to the
    growth plate of a hypochondroplasia mouse and reporting restored ciliogenesis
    and increased bone and body length. This is a mouse result with an engineered
    delivery vehicle and a Hedgehog-pathway payload that bypasses FGFR3
    altogether, so its translational validity is the open question, not its
    internal validity: nanoparticle biodistribution, immunogenicity on repeat
    dosing, and growth-plate penetration all differ substantially between mouse
    and child, and no human data exist.
  evidence:
  - reference: PMID:42338508
    reference_title: "Growth plate cartilage-targeting nanoparticles for pharmacological treatment of hypochondroplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In vivo, CT-CM-NPs effectively delivered the Hedgehog pathway agonist Purmorphamine to the growth plate cartilage in an HCH mouse model, resulting in upregulated Hedgehog signaling, restored impaired ciliogenesis, improved chondrocyte phenotypes, and ultimately increased bone and body length."
    explanation: The mouse result whose human relevance is unestablished.
  - reference: PMID:42338508
    reference_title: "Growth plate cartilage-targeting nanoparticles for pharmacological treatment of hypochondroplasia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pharmacological therapy remains the primary treatment but provides only partial symptomatic relief, as the avascular and alymphatic nature of growth plate cartilage severely limits drug delivery and accumulation."
    explanation: States the delivery barrier that motivates the approach.
  proposed_experiments:
  - experiment_id: exp_growth_plate_carrier_pk_large_animal
    name: Cross-species growth-plate pharmacokinetics of the targeted carrier
    description: >-
      Measure growth-plate tissue concentration and residence time of the
      collagen-II-targeted carrier in a large-animal model with a growth plate
      closer to human scale, since diffusion distance into avascular cartilage
      does not scale linearly from mouse.
notes: >
  Hypochondroplasia represents the mild end of the FGFR3-related skeletal dysplasia
  spectrum. The phenotype can be subtle, and many cases may go undiagnosed. Neurological
  involvement including temporal lobe dysgenesis, seizures, and neurocognitive
  difficulties is increasingly recognized, particularly in patients with the N540K
  mutation. The 2023 mouse model revealed previously underappreciated bone mineralization
  defects that may have implications for osteoporosis risk in aging patients. Vosoritide,
  approved for achondroplasia, showed promising results in a phase 2 trial for HCH.

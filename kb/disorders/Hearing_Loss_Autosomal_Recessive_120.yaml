    evidence_source: HUMAN_CLINICAL
    snippet: "We detected three MINAR2 variants, c.144G > A (p.Trp48*), c.412_419delCGGTTTTG (p.Arg138Valfs*10), and c.393G > T, in 13 individuals with congenital- or prelingual-onset severe-to-profound sensorineural hearing loss (HL)."
    explanation: The founding allelic series and the phenotype it produces.
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The c.393G > T variant is shown to disrupt a splice donor site."
    explanation: >-
      Why the one apparently missense allele belongs in the loss-of-function class; the
      functional consequence is splicing, not amino acid substitution.
  - reference: PMID:41130944
    reference_title: "Biallelic MINAR2 variant is associated with nonsyndromic severe to profound sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This variant introduces an early stop codon and probably results in a loss of function because of the predicted nonsense-mediated decay."
    explanation: The predicted molecular consequence of the 2025 allele, consistent with the earlier ones.
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MINAR2 is a recently annotated gene with limited functional understanding."
    explanation: >-
      The state of knowledge when the disease was defined, which is the honest frame for
      how thin the mechanistic evidence below still is.
- name: Loss of Cholesterol Delivery to the Hair Bundle
  description: >-
    The proposed molecular job of MINAR2. In cultured cells the protein localises mainly to
    lysosomes and recruits cholesterol; in zebrafish hair cells, cholesterol is
    concentrated in the hair bundle membrane and this enrichment is lost in minar2 mutants,
    whose apical lysosomes become enlarged and aggregated. Hair bundles become longer and
    thinner rather than shorter, which is the opposite of what a simple structural-protein
    loss would give and is consistent with a membrane-property defect.

    The causal direction was tested pharmacologically rather than only inferred: lowering
    cholesterol worsens the mutant and raising it rescues hair cell defects and hearing.
    That is the strongest single result in the DFNB120 literature.

    The caveat is species. Every element of this node is zebrafish or cell culture. No
    cholesterol measurement has been made in a mammalian Minar2 hair bundle, so its
    application to human DFNB120 is an extrapolation.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cochlea auditory hair cell
    term:
      id: CL:4023120
      label: cochlea auditory hair cell
  biological_processes:
  - preferred_term: intracellular cholesterol transport
    term:
      id: GO:0032367
      label: intracellular cholesterol transport
    modifier: DECREASED
  downstream:
  - target: Impaired Hair Cell Mechanotransduction
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36317962
    reference_title: "Kiaa1024L/Minar2 is essential for hearing by regulating cholesterol distribution in hair bundles."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Strikingly, cholesterol is highly enriched in the hair bundle membrane, and loss of kiaa1024L/minar2 reduces cholesterol localization to the hair bundles."
    explanation: The central measurement, showing that bundle cholesterol enrichment depends on Minar2.
  - reference: PMID:36317962
    reference_title: "Kiaa1024L/Minar2 is essential for hearing by regulating cholesterol distribution in hair bundles."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Lowering cholesterol levels aggravates, while increasing cholesterol levels rescues the hair cell defects in the kiaa1024L/minar2 mutant."
    explanation: >-
      Bidirectional pharmacological manipulation, which is what makes this causal rather
      than correlative.
  - reference: PMID:36317962
    reference_title: "Kiaa1024L/Minar2 is essential for hearing by regulating cholesterol distribution in hair bundles."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In cultured cells, Kiaa1024L/Minar2 is mainly localized to lysosomes, and its overexpression recruits cholesterol and increases cholesterol labeling."
    explanation: The subcellular localisation and cholesterol-recruiting activity, in cells.
  - reference: PMID:36317962
    reference_title: "Kiaa1024L/Minar2 is essential for hearing by regulating cholesterol distribution in hair bundles."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Defects in mechanotransduction, longer and thinner hair bundles, and enlarged apical lysosomes are observed in hair cells in kiaa1024L/minar2 mutant."
    explanation: >-
      The three structural and functional consequences together, including the enlarged
      apical lysosomes that tie the phenotype back to the protein's location.
  - reference: PMID:36317962
    reference_title: "Kiaa1024L/Minar2 is essential for hearing by regulating cholesterol distribution in hair bundles."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results suggested that the sterol synthesis pathway was activated due to a reduction of the accessible cholesterol pool in the minar2fs139 mutant larvae."
    explanation: >-
      Independent confirmation that the accessible cholesterol pool really is reduced,
      arrived at from the opposite direction: the animal's own sterol-synthesis programme
      is switched on, which is a readout that does not depend on the fluorescent reporter
      used for the primary measurement. Curated as evidence on this node rather than as a
      separate compensatory-response node, because nothing links the compensation itself
      to the hearing phenotype.
  - reference: PMID:36317962
    reference_title: "Kiaa1024L/Minar2 is essential for hearing by regulating cholesterol distribution in hair bundles."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These effects were not due to changes in expression levels of the point mutation construct, since it was expressed at a similar level as the wild-type construct (Figure 7C)."
    explanation: >-
      The controlled version of the binding claim. Mutating the critical aromatic residues
      of the predicted cholesterol-recognition motifs to alanine abolishes cholesterol
      recruitment at equal construct expression, so the effect is attributable to the motif
      rather than to how much protein is present.
  - reference: PMID:36317962
    reference_title: "Kiaa1024L/Minar2 is essential for hearing by regulating cholesterol distribution in hair bundles."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Nevertheless, further biochemical studies are required to demonstrate direct binding between the Kiaa1024L/Minar2 protein and cholesterol."
    explanation: >-
      Graded PARTIAL and curated deliberately: the authors state that direct binding is not
      demonstrated. The motif analysis, the recruitment assay and the docking study are
      consistent with a cholesterol-binding protein without establishing one, and this node
      should not be read as asserting more than that.
- name: Depletion of the Shortest Row of Outer Hair Cell Stereocilia
  description: >-
    The mammalian structural lesion. In Minar2 null mice the shortest row of outer hair
    cell stereocilia is depleted, with fewer and abnormally short stereocilia, while inner
    hair cells are close to normal. This is not secondary to hair cell death: at postnatal
    day 14, when thresholds are already raised, the organ of Corti is organised normally
    and very few bundles are missing, and ribbon synapse numbers are not different from
    controls. Hair cell degeneration appears later.

    The shortest row is where the mechanotransduction channel complexes sit, which is why
    the authors read this as a defect at the top of the hair cell rather than a
    synaptopathy or a neural problem.

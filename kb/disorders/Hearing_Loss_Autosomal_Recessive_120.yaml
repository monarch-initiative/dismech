    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio whole-exome sequencing of the index and his parents revealed a homozygous nonsense variant in MINAR2"
    explanation: Independent replication of the recessive gene-disease relationship in a fifth family.
pathophysiology:
- name: MINAR2 Loss of Function
  description: >-
    Biallelic null or near-null MINAR2 alleles. The reported spectrum is a nonsense
    variant, a frameshift affecting the transmembrane domain, and a variant substituting
    the last nucleotide of exon 2 that abolishes a splice donor site rather than acting as
    the missense change it superficially resembles. A later homozygous nonsense allele is
    predicted to be removed by nonsense-mediated decay. The allelic spectrum is therefore
    uniformly loss of function, which is why this entry does not attempt a
    genotype-phenotype correlation.

    MINAR2 is a small membrane protein with an intrinsically disordered region, named for
    its similarity to MINAR1 rather than for a demonstrated function, and it was still
    formally uncharacterised when the deafness families were sequenced.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MINAR2
    term:
      id: hgnc:33914
      label: MINAR2
  downstream:
  - target: Loss of Cholesterol Delivery to the Hair Bundle
    causal_link_type: DIRECT
  - target: Depletion of the Shortest Row of Outer Hair Cell Stereocilia

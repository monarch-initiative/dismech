    readouts:
    - name: AM1-43 mechanotransduction labelling
      target: Impaired Hair Cell Mechanotransduction
      direction: DECREASED
      interpretation: >-
        Roughly half the wild-type labelling against roughly a fifth fewer hair cells, so

inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic MINAR2 variants. Reported alleles are a nonsense variant, a frameshift
    affecting the transmembrane domain, and a variant at the last nucleotide of exon 2
    that disrupts a splice donor site; a further homozygous nonsense allele was reported
    in 2025. Parents are heterozygous carriers with normal pure tone audiograms.
  inheritance_term:

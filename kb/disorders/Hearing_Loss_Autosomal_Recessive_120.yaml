name: Hearing Loss Autosomal Recessive 120
category: Mendelian
creation_date: "2026-08-28T00:00:00Z"
synonyms:
- DFNB120
- deafness, autosomal recessive 120
- MINAR2-related autosomal recessive hearing loss
- KIAA1024L-related hearing loss
description: >-
  DFNB120 is congenital or prelingual, severe-to-profound, nonsyndromic sensorineural
  hearing loss caused by biallelic loss of MINAR2 (previously the uncharacterised gene
  KIAA1024L). It was defined in 2022 in thirteen individuals from four families, and the
  reported literature is still small enough to read in an afternoon.

  The gene arrived without a function. MINAR2 was named for structural similarity to
  MINAR1 rather than for anything known about what it does, and the human disease and the
  animal work were published essentially together. Two independent mechanisms have since
  been proposed and they are not the same claim. In the mouse, loss of Minar2 depletes the
  shortest row of outer hair cell stereocilia while leaving ribbon synapses and overall
  organ of Corti architecture intact at the age when thresholds are already raised, which
  places the primary defect at the top of the hair cell. In zebrafish, Minar2 sits on
  apical lysosomes and is required to deliver cholesterol to the hair bundle membrane;
  mutants have reduced bundle cholesterol, longer and thinner bundles, enlarged apical
  lysosomes and impaired mechanotransduction, and pharmacologically raising cholesterol
  rescues them while lowering it makes them worse.

  These fit together comfortably as a lipid-delivery defect that destabilises the apical
  hair bundle, but that synthesis is an inference across two species and has not been
  tested in either. Nobody has measured hair bundle cholesterol in a Minar2 mouse, and
  nobody has looked at stereocilia row identity in a minar2 zebrafish.

  The rescue result is the reason this entry is worth curating despite thin evidence.
  Zebrafish hair cell defects and hearing were restored by drugs that raise cholesterol -
  a small-molecule, non-genetic intervention in a monogenic deafness. Whether that is
  meaningful for human DFNB120 is unknown and probably harder than it sounds, since the
  human phenotype is congenital and profound while the fish phenotype is mild and
  larval.

  The gene also has a life outside the ear that human patients do not share. Minar2
  knockout mice develop obesity with hypertrophic adipocytes and impaired glucose
  tolerance through mTORC1 derepression, and a separate study reported parkinsonian motor
  deficits with nigral dopaminergic loss. Affected humans examined between 4 and 80 years
  of age had no additional abnormalities, and none had impaired balance on bedside
  vestibular testing. That dissociation is recorded here as an explicit model mismatch
  rather than being smoothed over.

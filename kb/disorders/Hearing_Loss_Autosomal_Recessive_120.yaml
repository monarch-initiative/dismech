discussions:
- discussion_id: minar2_syndromic_mouse_nonsyndromic_human
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Minar2 knockout mice are obese, glucose intolerant and parkinsonian; humans with
    biallelic MINAR2 loss examined between 4 and 80 years of age have isolated deafness.
    Is DFNB120 genuinely nonsyndromic, or are metabolic and motor phenotypes present and
    simply not looked for in a cohort ascertained through an audiology clinic?
  attaches_to:
  - pathophysiology#Derepression of NOTCH2 and mTORC1 Signalling
  - animal_models#Minar2 knockout mouse metabolic and motor phenotype
  rationale: >-
    The mismatch is stark and it runs in the direction that is easiest to miss. Two
    independent mouse studies of Minar2 nulls report substantial extra-auditory disease,
    one metabolic and one neurodegenerative with nigral cell loss. The human series
    explicitly examined affected individuals neurologically across a wide age range and
    found nothing additional, and bedside vestibular testing was normal. Taken at face
    value this says the mouse over-reports, which would be a species difference in what
    mTORC1 restraint by MINAR2 actually controls.

    But the human ascertainment is not neutral. These families were found by sequencing
    for deafness. Obesity and impaired glucose tolerance are common enough in the general
    population that a handful of affected individuals could carry them without anyone
    connecting the two, and the neurological evaluation reported is a clinical
    examination rather than dopaminergic imaging or structured metabolic phenotyping. The
    oldest reported patient is 80, which does argue against a strongly penetrant
    parkinsonian phenotype, but eight decades of a normal neurological examination is not
    the same measurement as a substantia nigra count.

    What follows practically is that MINAR2 should not yet be described to families as
    causing isolated deafness with the confidence that phrase usually implies. Body mass
    index, fasting glucose and a structured motor assessment in the known cohort would
    settle it cheaply, and would also decide whether the mTORC1 node in this entry belongs
    to the disease or only to the mouse.
  evidence:
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurologic evaluation of affected individuals at ages ranging from 4 to 80 y old does not show additional abnormalities."
    explanation: The human side of the mismatch, with its age range.
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the affected individuals showed impaired balance on tandem walking and Romberg test."
    explanation: >-
      Normal bedside vestibular and balance testing, which also distinguishes DFNB120 from
      the recessive deafness genes that carry vestibular involvement.
  - reference: PMID:37245847
    reference_title: "Inactivation of Minar2 in mice hyperactivates mTOR signaling and results in obesity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Minar2 KO mice on a high-fat diet develop obesity and impaired glucose tolerance and metabolism."
    explanation: The metabolic phenotype absent from the human description.
  - reference: PMID:32954300
    reference_title: "Loss of MINAR2 impairs motor function and causes Parkinson's disease-like symptoms in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We generated major intrinsically disordered NOTCH2-associated receptor 2 knockout mouse and demonstrated that the loss of major intrinsically disordered NOTCH2-associated receptor 2 in mouse results in severe motor deficits such as rigidity and bradykinesia, gait abnormalities, reduced spontaneous locomotor and exploratory behaviour, symptoms that are highly similar to those observed in human Parkinson's spectrum disorders."
    explanation: The motor phenotype absent from the human description.
  - reference: DOI:10.1073/pnas.2211351119
    reference_title: "Emerging complexities of the mouse as a model for human hearing loss"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These motor deficits were not present in even the oldest humans with comparably severe mutations inMINAR2."
    explanation: >-
      An independent commentary drawing the same mismatch, and specifically addressing the
      objection that the humans might simply be too young. Evidence source is OTHER because
      this is a commentary rather than a study. The quote reproduces the cached text
      exactly, including the missing space before the gene symbol.
  - reference: DOI:10.1073/pnas.2211351119
    reference_title: "Emerging complexities of the mouse as a model for human hearing loss"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For eight genes, includingMINAR2, both species have hearing loss, but the mutant mouse demonstrates additional syndromic features not found in humans."
    explanation: >-
      Puts this mismatch in context rather than treating it as a one-off. MINAR2 is one of
      eight genes where the mouse is syndromic and the human is not, which makes the
      pattern a known property of mouse deafness models and weakens the reading that
      something specific to MINAR2 is going on.
  proposed_experiments:
  - experiment_id: exp_dfnb120_systemic_phenotyping_of_known_cohort
    name: Metabolic and motor phenotyping of the known MINAR2 cohort
    description: >-
      Recall the reported MINAR2-biallelic individuals for body mass index, fasting
      glucose and oral glucose tolerance, and a structured motor examination with
      dopaminergic imaging in the older participants, compared against heterozygous
      relatives from the same families. Heterozygous relatives are the right comparator
      because they share household and ancestry while carrying one functional allele.
    would_support:
    - pathophysiology#Derepression of NOTCH2 and mTORC1 Signalling
    supporting_outcome:
    - >-
      Affected individuals show higher body mass index, impaired glucose handling, or
      subclinical motor findings relative to heterozygous relatives, which would make the
      mTORC1 node part of the human disease and reclassify DFNB120 as oligosymptomatic
      rather than nonsyndromic.
    would_refute:
    - pathophysiology#Derepression of NOTCH2 and mTORC1 Signalling
    refuting_outcome:
    - >-
      Affected individuals are metabolically and neurologically indistinguishable from
      heterozygous relatives, which would confine the mTORC1 and NOTCH2 arm to the mouse
      and support removing it from the human pathograph.
- discussion_id: minar2_cholesterol_mechanism_species_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the cholesterol-delivery mechanism established in zebrafish operate in the
    mammalian cochlea, and is the mouse shortest-row stereocilia lesion the same defect
    seen through a different species?
  attaches_to:
  - pathophysiology#Loss of Cholesterol Delivery to the Hair Bundle
  - pathophysiology#Depletion of the Shortest Row of Outer Hair Cell Stereocilia
  rationale: >-
    These two nodes are the whole mechanistic content of DFNB120 and they come from
    different animals, with no experiment joining them. The fish work explains what MINAR2
    does at a molecular level and the mouse work shows what breaks in a mammalian cochlea,
    and the tempting move is to assume the second is caused by the first.

    There is a specific reason to hold back. The two structural phenotypes point in
    opposite directions: fish hair bundles are longer and thinner while mouse stereocilia
    in the affected row are shorter and fewer. A membrane lipid defect could plausibly
    produce either, but a mechanism that produces both in the same way needs to be
    demonstrated, not asserted. There is also no zebrafish equivalent of row identity,
    since fish hair bundles are not organised into the mammalian graded staircase of
    outer hair cells, so the most distinctive feature of the mouse lesion has no
    counterpart in the system where the mechanism was worked out.

    The measurement that would close this is a direct one: cholesterol in mouse cochlear
    hair bundles, wild type against Minar2 null, with the shortest row resolved. If bundle
    cholesterol is reduced and the reduction is greatest where stereocilia are lost, the
    two literatures become one mechanism. If it is not, DFNB120 has two candidate
    mechanisms rather than one, and this entry should be split accordingly.
  evidence:
  - reference: PMID:36317962
    reference_title: "Kiaa1024L/Minar2 is essential for hearing by regulating cholesterol distribution in hair bundles."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Consistent with this model, loss of minar2 markedly reduces cholesterol distribution in the hair bundles, causes longer and thinner hair bundles, and gives rise to enlarged and aggregated apical lysosomes."
    explanation: >-

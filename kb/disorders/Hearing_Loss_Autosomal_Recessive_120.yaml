      evidence:
      - reference: PMID:36317962
        reference_title: "Kiaa1024L/Minar2 is essential for hearing by regulating cholesterol distribution in hair bundles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Because the decreases in hair cell numbers (~18% reduction) are smaller than those reductions of AM1-43 labeling intensities (~50% reduction), these results suggest that loss of minar2 function mainly affects hair cell mechanotransduction in the zebrafish larvae."
        explanation: The quantitative comparison that separates transduction failure from cell loss.
    evidence:
    - reference: PMID:36317962
      reference_title: "Kiaa1024L/Minar2 is essential for hearing by regulating cholesterol distribution in hair bundles."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We conclude that minar2 is required for mechanotransduction in the zebrafish larvae, and loss of minar2 reduces the number of inner ear hair cells in the zebrafish adults."
      explanation: The authors' conclusion for this node, including the adult cell-loss component.
- name: Minar2 knockout mouse metabolic and motor phenotype
  species: Mouse
  genotype: Minar2 knockout, homozygous, exon 2 replaced by lacZ
  publication: PMID:37245847
  description: >-
    The same null line examined outside the ear. Knockouts have three-fold higher adipose
    mass on a chow diet, hypertrophic adipocytes, accelerated weight gain and impaired
    glucose tolerance on a high-fat diet, all without increased food intake, driven by
    mTORC1 derepression through loss of Minar2 binding to Raptor. A separate study on a
    knockout of the same gene reported rigidity, bradykinesia, gait abnormalities and loss
    of tyrosine hydroxylase positive neurons in the substantia nigra pars compacta with
    raised alpha-synuclein.
  genes:
  - preferred_term: MINAR2
    term:
      id: hgnc:33914
      label: MINAR2
  modeled_mechanisms:
  - target: Derepression of NOTCH2 and mTORC1 Signalling
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Establishes in vivo that losing Minar2 derepresses mTORC1, and identifies the
      molecular route through Raptor binding. That is exactly the node, and the model
      supports it well.
    limitations: >-
      The tissue is adipose, not cochlea, and the phenotypes measured are metabolic. The
      model says nothing about whether mTORC1 derepression occurs in hair cells or
      contributes to deafness, which is why this entry draws no edge from that node into
      the auditory phenotypes.
    readouts:
    - name: mTOR Ser2448 phosphorylation in adipocytes
      target: Derepression of NOTCH2 and mTORC1 Signalling
      direction: INCREASED
      interpretation: Loss of Minar2 raises mTOR activating phosphorylation in vivo.
      evidence:

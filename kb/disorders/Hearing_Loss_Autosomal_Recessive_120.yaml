    snippet: "Recently, biallelic variants in MINAR2 have been reported to cause SNHL in four unrelated families with nonsyndromic severe to profound SNHL."
    explanation: The size of the reported literature at the time of the second report.
genetic:
- name: MINAR2
  notes: >-
    MINAR2, on 5p15.31, encodes membrane integral NOTCH2-associated receptor 2, previously
    the uncharacterised protein KIAA1024L and the mouse gene A730017C20Rik. It was named
    for structural similarity to MINAR1 and for binding NOTCH2 in a coimmunoprecipitation
    assay, not for an established cellular role. In the mouse inner ear the protein is
    found in hair cells, spiral ganglia, the spiral limbus and the stria vascularis, which
    is broader than the outer hair cell lesion the mutant shows.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: MINAR2
    term:
      id: hgnc:33914
      label: MINAR2
  evidence:
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that MINAR2 is essential for hearing in humans and mice and its disruption leads to sensorineural HL."
    explanation: The gene-disease conclusion, drawn from human genetics plus a mouse null.

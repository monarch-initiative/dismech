    snippet: "Here we report on DNA variants in MINAR2, encoding membrane integral NOTCH2-associated receptor 2, in four families underlying autosomal recessive nonsyndromic deafness."
    explanation: The founding report and its inheritance mode.
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: SUPPORT

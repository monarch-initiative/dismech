diagnosis:
- name: Gene panel or exome sequencing after a failed newborn screen
  description: >-
    DFNB120 presents as congenital severe-to-profound nonsyndromic sensorineural hearing
    loss with no distinguishing clinical feature, so it is not diagnosable without
    sequencing and is not distinguishable from GJB2-related deafness on phenotype. In
    reported families the route was whole exome sequencing after variants in previously
    recognised deafness genes had been excluded. MINAR2 is recent enough that older
    targeted panels may not contain it.
  evidence:
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After excluding variants in previously recognized deafness genes, in family 1 we filtered shared homozygous coding and splice variants"
    explanation: The diagnostic sequence that identified the founding family.
  - reference: PMID:41130944
    reference_title: "Biallelic MINAR2 variant is associated with nonsyndromic severe to profound sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES revealed a homozygous novel LoF variant in MINAR2 that explains the isolated hearing loss phenotype observed in this patient."
    explanation: Exome sequencing as the diagnostic route in the most recent family.
treatments:
- name: Genetic Counselling and Confirmatory Testing
  description: >-
    Counselling for a recessive condition with a 25 percent sibling recurrence risk, and
    confirmatory testing of at-risk siblings. In the founding series a sibling pair was
    identified in the same family, and in the 2025 report the proband's affected sibling
    had the same phenotype and severity, so the sibling recurrence is not theoretical.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:41130944
    reference_title: "Biallelic MINAR2 variant is associated with nonsyndromic severe to profound sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a patient with bilateral, nonsyndromic severe to profound hearing loss, along with a family history of a sibling presenting with the same phenotype and disease severity."
    explanation: An affected sibling in the most recent family, the recurrence counselling is about.
  - reference: PMID:41130944
    reference_title: "Biallelic MINAR2 variant is associated with nonsyndromic severe to profound sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The parents were carriers of the same variant."
    explanation: Confirmed carrier status in both parents, which is what makes the recurrence risk quantifiable.
  notes: >-
    No DFNB120-specific report of hearing amplification, cochlear implantation or
    speech-language rehabilitation was found in the reviewed literature, so none is
    curated here. Cochlear implantation is standard management for congenital
    severe-to-profound sensorineural hearing loss in general, and its absence from this
    entry reflects the absence of a DFNB120-specific report rather than a judgement that
    it is inappropriate. This is a deliberate scoping decision.
animal_models:
- name: Minar2 tm1b null mouse
  species: Mouse
  genotype: Minar2 tm1b/tm1b, homozygous null
  publication: PMID:35727972
  description: >-
    The mammalian model, produced by the knockout-mouse phenotyping pipeline and
    characterised alongside the human families. Homozygotes have raised auditory brainstem
    response and distortion product otoacoustic emission thresholds from postnatal day 14,
    two days after hearing normally begins, and by four weeks show severe elevation or no
    response. The structural correlate is depletion of the shortest row of outer hair cell
    stereocilia; ribbon synapse numbers and organ of Corti organisation are normal at the
    age when thresholds are already abnormal.
  genes:
  - preferred_term: MINAR2
    term:
      id: hgnc:33914
      label: MINAR2
  modeled_mechanisms:
  - target: Depletion of the Shortest Row of Outer Hair Cell Stereocilia
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      This is the model in which the mammalian lesion is defined. Cochlear stereocilia
      cannot be examined in living patients, so the mouse is not merely corroborating the
      human phenotype - it is the only place the structural mechanism has been observed at
      all.
    limitations: >-
      A complete null, whereas human alleles are nonsense, frameshift and spliceogenic;
      those are predicted null but the prediction rests on transcript consequence rather
      than on measured protein. Onset also differs in kind: mouse thresholds are already
      raised two days after hearing onset and then worsen rapidly, whereas most human
      patients are congenitally profound with only a minority showing progression. The
      mouse therefore models a rapidly progressive course that most patients do not have.
    readouts:
    - name: Outer hair cell shortest-row stereocilia number and length
      target: Depletion of the Shortest Row of Outer Hair Cell Stereocilia
      direction: DECREASED
      interpretation: >-
        Row-selective loss: the shortest row is depleted and shortened while inner hair
        cells are close to normal.
      evidence:
      - reference: PMID:35727972
        reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "However, when we examined the stereocilia bundles of outer hair cells, we saw the shortest row was depleted, with reduced numbers and abnormally short stereocilia"
        explanation: The scanning electron microscopy measurement behind this readout.
    - name: Inner hair cell ribbon synapse count
      target: Depletion of the Shortest Row of Outer Hair Cell Stereocilia
      direction: UNCHANGED
      interpretation: >-
        A real negative result, and the one that makes the stereocilia lesion primary:
        synapse numbers are normal at the age when thresholds are already raised.
      evidence:
      - reference: PMID:35727972
        reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "the number of synapses per inner hair cell in homozygous mutants was not significantly different from numbers in heterozygotes or wild-type controls at P14"
        explanation: The synapse count that excludes synaptopathy as the early mechanism.
    evidence:
    - reference: PMID:35727972
      reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We further showed that homozygous Minar2tm1b mutant mice develop rapidly progressive HL associated with changes in outer hair cell stereocilia."
      explanation: The model's central auditory conclusion, which is the node it supports.
  - target: Impaired Hair Cell Mechanotransduction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mouse shows hair cells that are present, take up transduction-channel dye, and
      still fail to transduce, which is the functional claim of this node.
    limitations: >-
      Mechanotransduction is inferred from threshold measurements and dye uptake rather
      than measured directly by transduction current recording, so the claim is functional
      rather than biophysical.
    readouts:
    - name: Distortion product otoacoustic emission threshold
      target: Impaired Hair Cell Mechanotransduction
      direction: INCREASED
      interpretation: >-
        Thresholds rise, so the direction is INCREASED even though the underlying function
        falls: outer hair cell function is already impaired at two weeks and largely gone
        by four, the mouse counterpart of the absent emissions in patients.
      evidence:
      - reference: PMID:35727972
        reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Otoacoustic emissions can be detected in the mutant mice but at raised thresholds at 2 wk old, and these responses are mostly absent by 4 wk old, implicating outer hair cells in the pathology."
        explanation: The emission time course in the null.
    evidence:
    - reference: PMID:35727972
      reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thresholds for both ABRs and DPOAEs were raised in homozygous mutants compared with wild-type littermates from the earliest age studied, postnatal day (P) 14, only 2 d after the usual onset of hearing"
      explanation: >-
        Establishes that the functional deficit is present essentially from hearing onset,
        which is what makes it comparable to a congenital human phenotype.
  evidence:
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In conclusion, audiological findings both in humans and mice show that loss of MINAR2 function results in early-onset and sensorineural HL that rapidly progresses to severe to profound deafness."
    explanation: The authors' joint human and mouse conclusion, which is the basis for treating the mouse as informative.
- name: minar2 frameshift zebrafish
  species: Zebrafish
  genotype: kiaa1024L/minar2 fs139 and fs140 frameshift, homozygous
  publication: PMID:36317962
  description: >-
    Two frameshift alleles of the zebrafish orthologue. Mutant larvae have reduced auditory
    evoked potentials, reduced mechanotransduction dye labelling, longer and thinner hair
    bundles, disorganised lateral line kinocilia, and enlarged aggregated lysosomes in the
    apical region of hair cells. This is the system in which the cholesterol mechanism was
    established, including the pharmacological rescue.
  genes:
  - preferred_term: MINAR2
    term:
      id: hgnc:33914
      label: MINAR2
  modeled_mechanisms:
  - target: Loss of Cholesterol Delivery to the Hair Bundle
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The only system in which the proposed molecular function of MINAR2 has been tested.
      Bundle cholesterol was measured with a genetically encoded sensor, and the causal
      role established by moving cholesterol in both directions pharmacologically.
    limitations: >-
      Zebrafish, and the correspondence to the mammalian phenotype is imperfect in a way
      the authors state: hearing loss in the mutant larvae is not as severe as in the adult
      knockout mouse. The bundle phenotype also differs in direction - fish bundles are
      longer and thinner, mouse stereocilia are shorter and fewer - so whether the two
      species are showing the same lesion is not established. No cholesterol measurement
      exists in any mammalian Minar2 hair bundle.
    readouts:
    - name: Hair bundle cholesterol reporter intensity
      target: Loss of Cholesterol Delivery to the Hair Bundle
      direction: DECREASED
      interpretation: >-
        Cholesterol available in inner ear stereocilia falls to roughly half of wild type,
        with transgene expression confirmed unchanged.
      evidence:
      - reference: PMID:36317962
        reference_title: "Kiaa1024L/Minar2 is essential for hearing by regulating cholesterol distribution in hair bundles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The results showed the average D4H-mCherry signals of inner ear stereocilia in the minar2fs139 larvae were about half of those in the wild controls"
        explanation: The quantified sensor measurement in mutant stereocilia.
      - reference: PMID:36317962
        reference_title: "Kiaa1024L/Minar2 is essential for hearing by regulating cholesterol distribution in hair bundles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The decreases were not due to changes in transgene expression either"
        explanation: >-
          The control that makes the measurement interpretable: less signal means less
          accessible cholesterol, not less reporter.
    - name: Mechanotransduction dye labelling after cholesterol restoration
      target: Loss of Cholesterol Delivery to the Hair Bundle
      direction: RESTORED
      interpretation: >-
        Raising cholesterol pharmacologically restores both transduction labelling and
        hearing, which is what makes the cholesterol deficit causal rather than incidental.
      evidence:
      - reference: PMID:36317962
        reference_title: "Kiaa1024L/Minar2 is essential for hearing by regulating cholesterol distribution in hair bundles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Thus, both the mechanotransduction (AM1-43 staining) and the hearing were restored after the decreased cholesterol levels were restored by the treatment with efavirenz."
        explanation: The rescue result, with the specific drug and the two readouts it restored.
    evidence:
    - reference: PMID:36317962
      reference_title: "Kiaa1024L/Minar2 is essential for hearing by regulating cholesterol distribution in hair bundles."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Therefore, cholesterol plays an essential role in hair bundles, and Kiaa1024L/Minar2 regulates cholesterol distribution and homeostasis to ensure normal hearing."
      explanation: The study's central conclusion, which is the mechanism this node curates.
  - target: Impaired Hair Cell Mechanotransduction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Transduction is impaired out of proportion to hair cell loss, which is the specific
      claim this node makes.
    limitations: >-
      Larval lateral line and inner ear hair cells, not cochlear outer hair cells; zebrafish
      have no cochlea and no outer hair cell electromotility, so the mechanism is being

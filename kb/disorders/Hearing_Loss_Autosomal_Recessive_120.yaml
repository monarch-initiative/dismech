  evidence:
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice with loss of function of the Minar2 protein (Minar2tm1b/tm1b) present with rapidly progressive sensorineural HL associated with a reduction in outer hair cell stereocilia in the shortest row and degeneration of hair cells at a later age."
    explanation: Places degeneration after the stereocilia lesion in the mouse time course.
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Progressive HL observed in mice and in some affected individuals and as well as relative preservation of hair cells provides an opportunity to interfere with HL using genetic therapies."
    explanation: >-
      Graded PARTIAL because it is the authors' therapeutic inference from the time course
      rather than a demonstrated window; no rescue experiment has been done in this model.
- name: Derepression of NOTCH2 and mTORC1 Signalling
  description: >-
    MINAR2 restrains two signalling systems in cultured cells: overexpression reduces
    NOTCH2 abundance and silencing raises it, and silencing increases mTORC1 activity as
    read out by S6 phosphorylation without affecting mTORC2. In adipose tissue of Minar2
    knockout mice the same derepression is seen, and it is the mechanism proposed for the
    metabolic phenotype.

    This node is deliberately drawn as a consequence of MINAR2 loss with no edge into the
    hearing phenotypes. No experiment has connected NOTCH2 or mTORC1 derepression to any
    cochlear phenotype in any species; the founding authors put it no more strongly than
    that Notch signalling might play a role. Drawing the arrow would state something the
    literature does not.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: TOR signaling
    term:
      id: GO:0031929
      label: TOR signaling
    modifier: INCREASED
  evidence:
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Finally, via in vitro studies we demonstrated that MINAR2 suppresses NOTCH2, suggesting that notch signaling might play a role in pathogenesis."
    explanation: >-
      Graded PARTIAL, matching the authors' own hedge. The suppression is measured; the
      relevance to deafness is speculation.
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Silencing of MINAR2 in PC12 cells, which endogenously express MINAR2, leads to an increase in NOTCH2 and confirms the suppressor effect of MINAR2 on NOTCH2 abundance"
    explanation: The loss-of-function direction of the NOTCH2 effect, which is the disease-relevant one.
  - reference: PMID:37245847
    reference_title: "Inactivation of Minar2 in mice hyperactivates mTOR signaling and results in obesity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mechanistically, Minar2 interacts with Raptor, a specific and essential component of mammalian TOR complex 1 (mTORC1) and inhibits mTOR activation."
    explanation: The molecular basis of the mTORC1 arm, established in mouse tissue and cells.
phenotypes:
- name: Congenital Severe-to-Profound Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    The defining phenotype: bilateral sensorineural hearing loss present at birth or
    prelingual onset, reaching severe to profound levels. Nine of the thirteen individuals
    in the founding series were congenital and four prelingual. At least one was picked up
    by a failed newborn hearing screen.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Congenital severe to profound sensorineural hearing impairment
    term:
      id: HP:0008527
      label: Congenital sensorineural hearing impairment
  evidence:
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We detected three MINAR2 variants, c.144G > A (p.Trp48*), c.412_419delCGGTTTTG (p.Arg138Valfs*10), and c.393G > T, in 13 individuals with congenital- or prelingual-onset severe-to-profound sensorineural hearing loss (HL)."
    explanation: Onset and severity across the founding series.
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individual II:3 in family 1 was diagnosed with profound sensorineural HL after failing the newborn hearing screening test."
    explanation: >-
      Detection by newborn screening, which distinguishes DFNB120 from the progressive
      recessive forms that can pass screening.
  - reference: PMID:41130944
    reference_title: "Biallelic MINAR2 variant is associated with nonsyndromic severe to profound sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a patient with bilateral, nonsyndromic severe to profound hearing loss, along with a family history of a sibling presenting with the same phenotype and disease severity."
    explanation: Independent replication of severity and bilaterality in a later family.
- name: Progressive Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    A progressive component in a minority. Four affected individuals were noted to have
    hearing loss that worsened during childhood to a severe-to-profound degree, and in one
    family the parents described loss that was milder in early childhood and reached
    severe or profound by about age 10. Most patients are already at the floor, so
    progression is only visible in those who start above it.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
  evidence:
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A progressive HL reaching a severe-to-profound degree during childhood was noted in four affected individuals."
    explanation: The size of the progressive subgroup within the founding series.
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Parents of family 1 stated that in individuals II:1 and II:2, HL was milder in younger ages and progressed to a severe or profound degree by around age 10."
    explanation: The reported time course of progression in one family.
- name: Absent Otoacoustic Emissions
  category: Auditory
  description: >-
    Otoacoustic emissions were absent in the three children tested. Combined with the
    abnormal auditory brainstem responses, the authors read this as dysfunction of both
    the outer hair cells and the inner hair cell to auditory nerve pathway, which is
    consistent with the mouse finding that emissions disappear over the first month.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Absent otoacoustic emissions
    term:
      id: HP:6000182
      label: Absent otoacoustic emissions
  evidence:
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to ABR thresholds showing sensorineural HL, otoacoustic emissions were absent in three children tested, suggesting dysfunction of both inner hair cell/acoustic nerve and outer hair cells."
    explanation: The measurement and the interpretation the authors place on it.
  notes: >-
    Frequency is FREQUENT rather than higher because emissions were tested in only three of
    the thirteen affected individuals; the denominator, not the result, is what limits the
    claim.

    term:
      id: GO:0050910
      label: detection of mechanical stimulus involved in sensory perception of sound
    modifier: DECREASED
  downstream:
  - target: Congenital Severe-to-Profound Sensorineural Hearing Impairment
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36317962
    reference_title: "Kiaa1024L/Minar2 is essential for hearing by regulating cholesterol distribution in hair bundles."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Because the decreases in hair cell numbers (~18% reduction) are smaller than those reductions of AM1-43 labeling intensities (~50% reduction), these results suggest that loss of minar2 function mainly affects hair cell mechanotransduction in the zebrafish larvae."
    explanation: >-
      The quantitative argument separating a transduction defect from simple hair cell
      loss.
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "It is notable that although the sensory hair cells are present up to 4 wk old and are able to take up fn1-43 dye through transduction channels, they do not appear to be functioning normally as shown by the raised ABR and DPOAE thresholds."
    explanation: >-
      The mammalian counterpart: hair cells present, channels open to dye, function
      nevertheless lost.
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Otoacoustic emissions can be detected in the mutant mice but at raised thresholds at 2 wk old, and these responses are mostly absent by 4 wk old, implicating outer hair cells in the pathology."
    explanation: The outer hair cell functional readout and its rapid decline.
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ribbon synapses look qualitatively normal at both ages tested, P14 and P30, and the number of synapses per inner hair cell in homozygous mutants was not significantly different from numbers in heterozygotes or wild-type controls at P14, indicating that the raised ABR thresholds observed at that age in mutants are not due to the loss of ribbon synapses"
    explanation: >-
      Excludes synaptopathy, which matters because otoacoustic emissions are also absent in
      human patients and a purely synaptic lesion would have predicted otherwise.
- name: Progressive Hair Cell Degeneration
  description: >-
    A later consequence rather than the initiating event. Hair cell degeneration is
    reported in Minar2 null mice at a later age than the threshold elevation, and the
    relative preservation of hair cells during the interval is what the founding authors
    identify as a therapeutic opportunity.
  biological_scale: TISSUE
  cell_types:

  evidence:
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, when we examined the stereocilia bundles of outer hair cells, we saw the shortest row was depleted, with reduced numbers and abnormally short stereocilia"
    explanation: The row-selective structural measurement in the mouse.
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The reduced number of stereocilia in the shortest row on outer hair cells would be expected to have a severe impact upon the number of transduction channel complexes available and suggests that the primary defect in these mutant mice is located at the top of the hair cell."
    explanation: The authors' localisation of the primary defect and its functional rationale.
  - reference: PMID:35727972
    reference_title: "Mutations in MINAR2 encoding membrane integral NOTCH2-associated receptor 2 cause deafness in humans and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The organization of the organ of Corti appeared normal and there were very few missing stereocilia bundles in mutants, suggesting that hair cell degeneration cannot explain the raised ABR thresholds at this age"
    explanation: >-
      Excludes degeneration as the cause of the early threshold shift, which is what makes
      the stereocilia lesion primary rather than a late consequence.
- name: Impaired Hair Cell Mechanotransduction
  description: >-
    The convergence point of both proposed mechanisms. In zebrafish minar2 mutants,
    mechanotransduction dye labelling falls by about half while hair cell number falls by
    only about a fifth, so the loss of function exceeds the loss of cells. In mice,
    distortion product otoacoustic emissions are raised in threshold at two weeks and
    mostly absent by four weeks, and hair cells still take up transduction-channel dye
    while failing to produce normal responses - present but not working.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  - preferred_term: cochlear inner hair cell
    term:

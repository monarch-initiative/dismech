        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Our results showed a significant increase in Ser2448 phosphorylation of mTOR in Minar2 KO adipocytes"
        explanation: The direct measurement of mTOR activation in knockout tissue.
    evidence:
    - reference: PMID:37245847
      reference_title: "Inactivation of Minar2 in mice hyperactivates mTOR signaling and results in obesity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our findings identified Minar2 as a novel physiological negative regulator of mTORC1 with a key role in obesity and metabolic disorders."
      explanation: The study conclusion establishing Minar2 as an mTORC1 restraint in vivo.
  evidence:
  - reference: PMID:37245847
    reference_title: "Inactivation of Minar2 in mice hyperactivates mTOR signaling and results in obesity."

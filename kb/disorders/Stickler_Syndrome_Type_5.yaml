name: Stickler Syndrome Type 5
creation_date: "2026-09-16T20:30:00Z"
description: >-
  Stickler syndrome type 5 (STL5) is the autosomal recessive Stickler syndrome
  caused by biallelic loss-of-function variants in COL9A2, which encodes the
  alpha-2 chain of collagen IX. Collagen IX is a heterotrimer and all three
  chains are required for a functional molecule, so loss of any one of COL9A1,
  COL9A2 or COL9A3 removes it — which is why the three recessive type IX
  Sticklers are one clinical entity in three genes. Collagen IX decorates the
  surface of collagen II fibrils and regulates fibril spacing in vitreous and
  cartilage, so its absence produces a hypoplastic, architecturally abnormal
  vitreous and, in cartilage, a milder skeletal phenotype than the dominant
  collagen II and XI forms.

  The clinical profile is what distinguishes it from the dominant Sticklers
  rather than what it shares with them. High myopia and abnormal vitreous
  architecture are near-universal, and sensorineural hearing loss is both more
  frequent and more severe than in type 1 or type 2 — around 92% in the largest
  type IX cohort. Cleft palate has not been reported with type IX collagen
  variants at all, and arthropathy is uncommon. Most importantly for management,
  retinal detachment occurs at a far lower rate than in type 1 (roughly 15% in
  the cohort, through horseshoe tears, with no giant retinal tears and no
  bilateral cases), so the prophylactic retinopexy that is standard in type 1
  Stickler syndrome is not transferable here and should be offered case by case.
synonyms:
- STL5
- STICKLER syndrome, type V
- Stickler syndrome, type 5
- COL9A2 autosomal recessive Stickler syndrome
- autosomal recessive Stickler syndrome caused by mutation in COL9A2
- type IX collagen recessive Stickler syndrome

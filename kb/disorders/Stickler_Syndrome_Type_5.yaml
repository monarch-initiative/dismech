genetic:
- name: COL9A2
  gene_term:
    preferred_term: COL9A2
    term:
      id: hgnc:2218
      label: COL9A2
  relationship_type: CAUSATIVE
  notes: >-
    COL9A2 (1p34.2) encodes the alpha-2 chain of collagen IX. Reported STL5
    alleles are loss of function — the founding c.843_846+4del8 removes an
    exon-intron junction, and c.1332del is a frameshift. Because collagen IX is
    an obligate heterotrimer, a null in COL9A2 is functionally equivalent to a
    null in COL9A1 or COL9A3, which is why the three genes produce one clinical
    entity that the nosology splits into STL4, STL5 and STL6.

    Note that heterozygous and other COL9A2 variants have separately been
    associated with multiple epiphyseal dysplasia and with intervertebral disc
    disease. Those are different allelic and dosage contexts and are not this
    disease.
  variants:
  - name: c.843_846+4del8
    description: >-
      Homozygous in the founding family. An eight-base deletion spanning an
      exon-intron boundary, reported as loss of function.
  - name: c.1332del
    description: >-
      Homozygous in two brothers from a consanguineous family with severe ocular
      and auditory disease and minimal orofacial and joint involvement.
  evidence:
  - reference: PMID:21671392
    reference_title: A loss of function mutation in the COL9A2 gene causes autosomal recessive Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected family members were found to have a homozygous loss-of-function
      mutation in COL9A2, c.843_c.846 + 4del8.
    explanation: The founding gene-disease observation.
  - reference: PMID:35885918
    reference_title: Autosomal Recessive Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Usually inherited in a dominant fashion due to heterozygous pathogenic
      variants in the collagen genes COL2A1 and COL11A1, it can rarely be
      inherited in a recessive fashion from variants in COL9A1, COL9A2, and
      COL9A3, COL11A1, as well as the non-collagen genes LRP2, LOXL3 and GZF1.
    explanation: >-
      Places COL9A2 within the full recessive Stickler gene set, which is the
      differential this entry sits inside.
diagnosis:
- name: Molecular genetic testing for biallelic COL9A2 variants
  description: >-
    The confirmatory test. Because the clinical picture overlaps the dominant
    Stickler forms while the management differs, and because type IX disease is
    recessive, the diagnosis rests on finding two pathogenic COL9A2 alleles
    rather than on the ocular phenotype. GeneReviews states the requirement as
    biallelic variants in any of the three collagen IX genes, which is also why
    a heterozygous finding does not make this diagnosis.
  evidence:
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of Stickler syndrome can be established in a proband with
      characteristic clinical features and/or a heterozygous pathogenic variant in
      COL2A1, COL11A1, or COL11A2 or biallelic pathogenic variants in COL9A1,
      COL9A2, or COL9A3 identified by molecular genetic testing.
    explanation: >-
      The diagnostic criterion, naming the biallelic requirement that separates
      the type IX forms from the dominant ones.
- name: Electroretinography in Stickler syndrome
  description: >-
    Full-field and multifocal electroretinography demonstrate reduced rod, cone
    and macular function in COL9A2 patients even where optical coherence
    tomography and fundus autofluorescence show no structural macular
    abnormality. This matters diagnostically because it means reduced acuity in
    these patients should not be attributed solely to refractive error or to a
    past detachment.
  evidence:
  - reference: PMID:33356723
    reference_title: Autosomal recessive Stickler syndrome associated with homozygous mutations in the COL9A2 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FfERG revealed reduced function of both rods and cones and mERG showed
      reduced macular function. No morphological macular changes were found by
      OCT or FAF.
    explanation: >-
      The functional-versus-structural dissociation, which is the point of doing
      the test.
treatments:
- name: Case-by-case prophylactic retinopexy
  description: >-
    Prophylactic cryotherapy or laser retinopexy is standard in type 1 Stickler
    syndrome, where lifetime retinal detachment risk exceeds 50% and giant
    retinal tears dominate. The type IX cohort does not support transferring that
    policy: detachment was less frequent, through horseshoe tears, with no giant
    tears and no bilateral cases. The authors' conclusion is that prophylaxis
    should be offered case by case, specifically for the fellow eye of a patient
    who has already had a giant-tear detachment. This entry records the
    restriction rather than the intervention, because the restriction is the
    finding.

    The restriction is not a claim that prophylaxis does not work. The
    pro-prophylaxis evidence base in Stickler syndrome generally is strong, and
    the review that makes that case names the missing piece itself: the cohort
    comparisons it rests on were done without molecular genetic sub-typing. The
    type IX cohort is what sub-typing looks like when it is done, so the two
    findings are consistent rather than opposed.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: prophylactic retinopexy
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Vitreous Gel Architectural Failure
    description: >-
      Creates a chorioretinal adhesion at the vitreous base to prevent a tear
      progressing to detachment. It does not address the underlying vitreous
      abnormality.
  evidence:
  - reference: PMID:39406934
    reference_title: Retinal detachment in Type IX collagen recessive Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prophylactic retinopexy should only be offered case-by-case for fellow eyes
      of patients presenting with GRT detachments in their first eye.
    explanation: >-
      The cohort's management conclusion, stated as a restriction on a practice
      established in a different Stickler subtype.
  - reference: PMID:39406934
    reference_title: Retinal detachment in Type IX collagen recessive Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ours results do not point to high RD nor GRT incidence in recessive SS,
      although given the rarity, our numbers are small.
    explanation: >-
      The evidential basis for the restriction, including the authors' own caveat
      about cohort size.
  - reference: PMID:35885933
    reference_title: Prevention of Blindness in Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Based on the current body of literature, there is extremely strong evidence
      from cohort comparison studies demonstrating the efficacy and safety of
      prophylactic retinopexy to reduce, but not eliminate, the risk of retinal
      detachment in Stickler syndrome patients.
    explanation: >-
      The pro-prophylaxis case for Stickler syndrome as a whole, which is why the
      type IX restriction is a scoping of an effective intervention rather than a
      rejection of it.
  - reference: PMID:35885933
    reference_title: Prevention of Blindness in Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Variable case selection, absence of molecular genetic sub-typing and
      inconsistent treatment strategies have all contributed to the historic
      uncertainty regarding the safety and efficacy of prophylactic treatment.
    explanation: >-
      Names the absence of molecular sub-typing as a limitation of the historic
      prophylaxis literature, which is precisely what the type IX cohort supplies.
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      laser therapy for prevention of retinal detachment; education on risks and
      symptoms of retinal detachment
    explanation: >-
      The standard Stickler management recommendation that this entry scopes. It
      is written for the syndrome as a whole, not for the type IX forms.
- name: Ophthalmic surveillance and retinal detachment education
  description: >-
    Regular ophthalmic review, with patients and parents warned about the warning
    signs of retinal detachment. This is what replaces routine prophylaxis in the
    type IX forms.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: vitreoretinal surveillance and retinal detachment education
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:35885918
    reference_title: Autosomal Recessive Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the need to warn patients and parents of the warning signs of retinal
      detachment, with regular ophthalmic review
    explanation: >-
      The surveillance recommendation from the recessive Stickler review.
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Annual examination by a vitreoretinal specialist; audiologic evaluations
      annually
    explanation: >-
      Gives the surveillance interval and the specialist, which the recessive
      review leaves as "regular".
- name: Audiological management with amplification
  description: >-
    Hearing loss is severe and near-universal, so audiological assessment and
    amplification are central to management. The literature's emphasis is on
    getting to the diagnosis early, because dual sensory impairment in a child is
    what the delay costs.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid fitting
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  target_mechanisms:
  - target: Cochlear Matrix Dysfunction
    description: >-
      Amplification compensates for the sensorineural deficit downstream of the
      cochlear matrix lesion. It does not act on the collagen defect, so it is
      symptomatic rather than disease-modifying.
  evidence:
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      standard treatment of sensorineural and conductive hearing loss
    explanation: >-
      The management recommendation for the hearing loss, which in this disease is
      the near-universal and more severe manifestation.
  - reference: PMID:31090205
    reference_title: Homozygous Type IX collagen variants (COL9A1, COL9A2, and COL9A3) causing recessive Stickler syndrome-Expanding the phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Although recessive SS is rare, early diagnosis would have a high impact for
      children with potentially dual sensory impairment, as well as identifying
      risk to future children.
    explanation: >-
      Supports the clinical importance of managing the hearing loss. It argues
      for early diagnosis rather than reporting an amplification outcome, so the
      support for this specific treatment is one inference step away.
- name: Genetic counselling and carrier testing
  description: >-
    Recessive inheritance means a 25% recurrence risk for siblings, and most
    reported families are consanguineous. Identifying the variants allows
    counselling of the couple and testing of at-risk relatives.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      each sib of an affected individual has at conception a 25% chance of being
      affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of
      being unaffected and not a carrier
    explanation: >-
      States the recurrence risks this treatment's description asserts. The
      previous citation argued for early diagnosis and named no figure.
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Stickler syndrome caused by pathogenic variants in COL9A1, COL9A2, or COL9A3
      is inherited in an autosomal recessive manner.
    explanation: >-
      Establishes the inheritance mode the recurrence risks follow from, for the
      collagen IX genes specifically rather than for Stickler syndrome generally.
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Carrier testing for at-risk relatives requires prior identification of the
      pathogenic variants in the family.
    explanation: >-
      The precondition for the carrier testing this treatment offers, which is why
      variant identification in the proband comes first.
- name: Avoidance of contact sports
  description: >-
    Activities carrying a risk of ocular trauma are avoided because trauma can
    precipitate retinal detachment in an eye whose vitreous is already abnormal.
    This is the one piece of standard Stickler management that the type IX data
    does not qualify: the argument rests on the vitreous abnormality, which the
    type IX cohort confirms, rather than on the giant-tear risk, which it does
    not.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: avoidance of activities risking ocular trauma
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Vitreous Gel Architectural Failure
    description: >-
      Removes a mechanical precipitant acting on an already abnormal vitreoretinal
      interface. It does not alter the interface itself.
  evidence:
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Activities such as contact sports that may lead to traumatic retinal
      detachment.
    explanation: >-
      The agents-and-circumstances-to-avoid recommendation, given as the reason for
      the restriction.
- name: Retinal detachment repair surgery
  description: >-
    Surgical repair of established detachment, reported in a COL9A2 proband.
    Outcomes in Stickler syndrome are described as notably worse than detachment
    repair in the general population, which is the observation the prophylaxis
    argument is built on — so the poor-outcome figure belongs with the surgery
    rather than only with the prophylaxis debate.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: retinal detachment repair
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Retinal detachment
    description: >-
      Reattaches the retina after detachment has occurred. It is the salvage
      procedure, not a preventive one.
  evidence:
  - reference: PMID:33356723
    reference_title: Autosomal recessive Stickler syndrome associated with homozygous mutations in the COL9A2 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband was operated for retinal detachment and cataract in one eye.
    explanation: >-
      Records that both operations were performed in a genotyped COL9A2 patient.
  - reference: PMID:35885933
    reference_title: Prevention of Blindness in Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Although retinal detachment surgery in the general population has a high
      success rate, outcomes from surgical repair in Stickler syndrome patients are
      notoriously poor, providing a strong argument for prophylactic intervention.
    explanation: >-
      The outcome caveat that makes repair an unsatisfactory fallback, and the
      stated basis for preferring prevention.
- name: Cataract surgery
  description: >-
    Cataract extraction, reported in the same COL9A2 proband. Cataract is a
    curated phenotype here, so the intervention is recorded rather than left
    implicit.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cataract extraction
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Cataract
    description: >-
      Replaces the opacified lens. It addresses the opacity and not the collagen
      defect.
  evidence:
  - reference: PMID:33356723
    reference_title: Autosomal recessive Stickler syndrome associated with homozygous mutations in the COL9A2 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband was operated for retinal detachment and cataract in one eye.
    explanation: >-
      Records that both operations were performed in a genotyped COL9A2 patient.
discussions:
- discussion_id: gap_stl5_collagen_ix_gene_equivalence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are STL4 (COL9A1), STL5 (COL9A2) and STL6 (COL9A3) clinically
    distinguishable, or is the three-way split a nosological artefact of
    gene-by-gene discovery?
  attaches_to:
  - "pathophysiology#Collagen IX Heterotrimer Failure"
  rationale: >-
    The mechanistic argument says they should be indistinguishable: collagen IX
    is an obligate heterotrimer, all three chains are required, and a null in any
    one removes the molecule. Every cohort study to date has accordingly pooled
    them and reported results for "type IX recessive Stickler syndrome" rather
    than per gene — the 13-patient national cohort spans all three, and so does
    the phenotype-expansion series. So there is no published comparison that
    could detect a difference, and the absence of a reported difference is not
    evidence of equivalence. A chain-specific effect is not impossible: the three
    chains differ in their non-collagenous domains, and COL9A2 and COL9A3 have
    separate associations with multiple epiphyseal dysplasia that COL9A1 does
    not. The practical stake is whether dismech should carry three entries or
    one, and whether a clinician seeing a COL9A2 patient can use a COL9A3
    cohort's numbers.
  proposed_experiments:
  - experiment_id: exp_stl5_gene_stratified_reanalysis
    name: Gene-stratified reanalysis of the pooled type IX cohorts
    description: >-
      Reanalyse the published type IX recessive Stickler cases stratified by gene
      rather than pooled, comparing hearing threshold, axial length, retinal
      detachment rate and arthropathy, and report whether the cohorts are large
      enough to exclude a clinically meaningful difference.
- discussion_id: gap_stl5_cochlear_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is sensorineural hearing loss more severe in collagen IX recessive
    Stickler syndrome than in the dominant collagen II and XI forms?
  attaches_to:
  - "pathophysiology#Cochlear Matrix Dysfunction"
  rationale: >-
    The epidemiology is solid and the direction is counterintuitive. Collagen IX
    is a minor, surface-associated FACIT collagen, while collagen II is the bulk
    fibrillar collagen of the same tissues — so one would expect the collagen II
    disease to have the more severe cochlear phenotype, and it does not.
    Candidate explanations include a specific role for collagen IX in the
    tectorial membrane or in the cochlear extracellular matrix that collagen II
    does not cover, or a dose difference between a recessive null and a dominant
    haploinsufficiency that matters more in the ear than in the eye. Nothing
    published separates them, and no human cochlear tissue from a type IX patient
    has been examined.
  proposed_experiments:
  - experiment_id: exp_stl5_cochlear_col9_localization
    name: Collagen IX localisation in the mammalian cochlea
    description: >-
      Map collagen IX chain distribution in the normal mammalian cochlea,
      particularly the tectorial membrane and spiral limbus, and compare with
      collagen II, to establish whether there is a compartment where collagen IX
      is not redundant with collagen II.
notes: >-
  Scope and lump/split. This entry covers biallelic COL9A2 Stickler syndrome.
  Separate per-type entries are the settled shape here — Stickler_Syndrome_Type_1,
  Stickler_Syndrome_Type_2 and Stickler_Syndrome_Type_6 already exist alongside
  the Stickler_Syndrome umbrella — and MONDO:0013666 was bound nowhere in kb/.
  Whether the three type IX genes deserve three entries is genuinely open and is
  curated as a KNOWLEDGE_GAP rather than settled here, since deciding it would
  affect STL4 and STL6 as well and is not this PR's to make.

  Cohort attribution. Almost every published cohort pools COL9A1, COL9A2 and
  COL9A3 as "type IX recessive Stickler syndrome", so most of the quantitative
  claims here — the 91.7% hearing loss, the 15.4% retinal detachment rate, the
  30.8% midfacial hypoplasia — are type IX figures, not COL9A2 figures. The
  descriptions say so rather than silently attributing pooled numbers to this
  gene. The claims that are COL9A2-specific are the two family reports
  (PMID:21671392, PMID:33356723) and the electroretinography finding.

  The clinically important negative. The prophylactic retinopexy protocol that
  is standard in type 1 Stickler syndrome does not transfer here, and the entry
  curates that as a restriction with its evidence rather than omitting the
  treatment. Getting this wrong in the other direction — assuming Stickler
  syndrome means high giant-tear risk — would lead to unnecessary bilateral
  prophylaxis in children.

  The restriction is not an argument against prophylaxis. PMID:35885933, from the
  group that runs the UK national Stickler service, makes the strong case for
  prophylactic retinopexy in Stickler syndrome as a whole — and names the absence
  of molecular genetic sub-typing as one of the reasons the historic evidence was
  uncertain. The type IX cohort is that sub-typing carried out. Both are curated
  on the same treatment so a reader sees the general recommendation and its
  genotype-specific scoping together, rather than only the half that happens to
  match this entry's title.

  Phenotypes left unwired, deliberately. Cataract and Short stature carry no
  causal inlink. No source located states a mechanism connecting either to a node
  in this pathograph: collagen IX is not a lens collagen, and the cohort papers
  list cataract among ocular findings without proposing a route from the vitreous
  lesion. Short stature is reported as a skeletal manifestation with no stated
  growth-plate mechanism. An edge drawn to satisfy the connectivity metric would
  assert a causal claim no paper makes, so both are left floating and the reason
  recorded here.

  Uncited caches. Sixteen references_cache/ files added by this curation are not
  cited by the entry. They are the deep-research screening set — read, assessed,
  and either superseded by a better source or found not to bear on a curated
  claim. PMID:35885933 was the one among them with content the entry needed, and
  it is now cited. The rest are left in place rather than pruned: pruning against
  a cited-reference list is how a cache file the entry does need gets deleted, and
  the cached records are what makes reference validation deterministic in CI.

  What is deliberately absent. No datasets: block — no COL9A2 Stickler-specific
  dataset was identified, and a COL9A2 search surfaces the much larger multiple
  epiphyseal dysplasia and intervertebral disc literature, which is the wrong
  disease. No clinical_trials: block — none found for recessive Stickler
  syndrome. No environmental: block. No experimental_models: block — the canine
  oculoskeletal dysplasia models mentioned in the founding paper are described
  there as resembling Stickler syndrome and co-segregating with COL9A2 and COL9A3
  loci, but no study characterising them as a model of the human disease was
  located, so listing one would overstate what is published.

  GeneReviews. PMID:20301479, Stickler Syndrome, is the baseline chapter, is
  tagged in references:, and is now mined rather than only cited: it supplies the
  diagnostic criterion, the surveillance interval, the hearing-loss management
  recommendation, the contact-sport restriction and the recurrence-risk figures.
  Every one of those is quoted as a REVIEW_SYNTHESIS item, because the chapter is
  an expert synthesis of the Stickler literature and not a study of this
  genotype. It is written around the dominant forms; its Clinical
  Characteristics were cross-checked against the phenotypes here, and the
  features it describes that are specific to the dominant subtypes — cleft
  palate and Pierre Robin sequence, the membranous and beaded vitreous
  phenotypes, the high giant-retinal-tear risk — are deliberately not curated on
  this entry, because the type IX literature reports them as absent or different.
  The Type II Collagen Disorders Overview (PMID:31021589) is a second GeneReviews
  chapter returned by the search; it is not relevant to a collagen IX disease and
  is not cited.

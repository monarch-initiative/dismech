inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    STL5 requires two defective COL9A2 alleles. Reported families are mostly
    consanguineous with homozygous variants; heterozygous parents are
    unaffected, which is the clearest evidence that one functional allele
    suffices.
  evidence:
  - reference: PMID:33356723
    reference_title: Autosomal recessive Stickler syndrome associated with homozygous mutations in the COL9A2 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both subjects were homozygous for the mutation c.1332del in COL9A2. Their
      parents were heterozygous for the same mutation.
    explanation: >-
      Homozygosity in affected brothers with unaffected heterozygous parents,
      which is the segregation argument for recessiveness.
  - reference: PMID:39406934
    reference_title: Retinal detachment in Type IX collagen recessive Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      6/11 families exhibited previously undescribed genetic variants, and 7 had
      consanguineous parents.
    explanation: >-
      Consanguinity in the majority of families in the largest type IX cohort,
      consistent with recessive inheritance and with the rarity of the disease.
prevalence:
- population: Published recessive Stickler syndrome cases across all genes, reviewed to 2022
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Forty patients from 23 families with recessive Stickler syndrome of any
    cause had been published as of the 2022 review. That figure spans COL9A1,
    COL9A2, COL9A3, COL11A1, LRP2, LOXL3 and GZF1, so the COL9A2 share is a
    fraction of it; a COL9A2-specific count has not been published.
  evidence:
  - reference: PMID:35885918
    reference_title: Autosomal Recessive Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      We review the published cases of recessive SS, which comprise 40 patients
      from 23 families.
    explanation: >-
      The published case count for recessive Stickler syndrome as a whole. It is
      a review's tally of other people's cases, not a new series.
- population: NHS England Highly Specialised Stickler Syndrome Service, 2015-2022
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Thirteen type IX recessive Stickler patients from 11 families were
    identified over eight years in the English national referral service, which
    is the largest type IX cohort assembled and gives a sense of how few such
    patients a national service sees.
  evidence:
  - reference: PMID:39406934
    reference_title: Retinal detachment in Type IX collagen recessive Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report 13 cases from 11 families with Type-IX recessive SS, identified
      from the cohort attending the NHS England Highly Specialised Stickler
      Syndrome Service (1/1/15-31/12/22).
    explanation: The cohort size and its ascertainment window, stated together.
progression:
- phase: Congenital ocular and auditory presentation
  notes: >-
    High myopia and abnormal vitreous architecture are present from early life,
    and the hearing loss is congenital or early. This is the argument the
    literature makes for adding the collagen IX genes to congenital hearing loss
    panels: the ear brings the child to attention before the eye does, and dual
    sensory impairment is the thing early diagnosis prevents.
  evidence:
  - reference: PMID:31090205
    reference_title: Homozygous Type IX collagen variants (COL9A1, COL9A2, and COL9A3) causing recessive Stickler syndrome-Expanding the phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients were highly myopic with congenital megalophthalmos and
      abnormal, hypoplastic vitreous gel, and all had sensorineural hearing loss.
    explanation: >-
      Complete penetrance of the ocular and auditory features across six patients
      from four type IX families.
- phase: Later retinal and joint complications
  notes: >-
    Retinal detachment, when it occurs, follows later; in the national cohort it
    occurred in 15.4% of patients through horseshoe tears. Arthropathy is
    uncommon and variable. The published cohorts are young — mean age 11 years in
    the 2022 review — so the lifetime incidence of both complications is likely
    underestimated.
  evidence:
  - reference: PMID:35885918
    reference_title: Autosomal Recessive Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, the mean age of this cohort is 11 years old, so the lifetime
      incidence of both problems may be underestimated.
    explanation: >-
      The authors' own caveat on their retinal detachment and joint pain figures,
      which is what makes those figures usable rather than misleading.
pathophysiology:
- name: COL9A2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants — frameshift, splice-disrupting deletion
    — abolish the alpha-2 chain of collagen IX. Reported alleles include
    c.843_846+4del8, which removes an exon-intron boundary, and c.1332del.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Collagen IX Heterotrimer Failure
    causal_link_type: DIRECT
    description: >-
      Collagen IX is an obligate heterotrimer of alpha-1, alpha-2 and alpha-3
      chains, so losing one chain prevents assembly of the molecule.
    evidence:
    - reference: PMID:21671392
      reference_title: A loss of function mutation in the COL9A2 gene causes autosomal recessive Stickler syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All three collagen IX α chains, α1, α2, and α3, are needed for formation
        of functional collagen IX molecule.
      explanation: >-
        The stoichiometric argument that makes a single-chain null equivalent to
        loss of the whole molecule, and that explains why three genes give one
        disease.
  evidence:
  - reference: PMID:21671392
    reference_title: A loss of function mutation in the COL9A2 gene causes autosomal recessive Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected family members were found to have a homozygous loss-of-function
      mutation in COL9A2, c.843_c.846 + 4del8.
    explanation: The founding COL9A2 allele and its loss-of-function character.
- name: Collagen IX Heterotrimer Failure
  biological_scale: MOLECULAR
  description: >-
    Without the alpha-2 chain, functional collagen IX is not formed. Collagen IX
    is a FACIT collagen that sits on the surface of collagen II fibrils and
    mediates their interaction with the surrounding matrix, so its absence is
    felt wherever a collagen II fibril network has to be spaced and stabilised —
    principally the vitreous gel and hyaline cartilage.
  cellular_components:
  - preferred_term: collagen trimer
    modifier: DECREASED
    term:
      id: GO:0005581
      label: collagen trimer
  downstream:
  - target: Vitreous Gel Architectural Failure
    causal_link_type: DIRECT
  - target: Cartilage and Craniofacial Matrix Disorganization
    causal_link_type: DIRECT
  - target: Cochlear Matrix Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:21671392
    reference_title: A loss of function mutation in the COL9A2 gene causes autosomal recessive Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Together the data from the present study and the previous studies suggest
      that loss-of-function mutations in any of the collagen IX genes can cause
      autosomal recessive Stickler syndrome.
    explanation: >-
      Establishes that the disease follows loss of the heterotrimer rather than
      of a chain-specific function, which is what this node claims.
- name: Vitreous Gel Architectural Failure
  biological_scale: TISSUE
  description: >-
    The vitreous is hypoplastic with abnormal architecture, and the globe is
    enlarged with high axial myopia. Unlike the dominant forms, which each have a
    characteristic membranous or beaded vitreous phenotype, the type IX vitreous
    is described simply as hypoplastic and abnormal. Retinal function is measurably
    reduced on electroretinography even where the macula looks structurally
    normal, which is the finding that explains visual acuity loss in these
    patients without retinal complications.
  biological_processes:
  - preferred_term: collagen fibril organization
    modifier: DECREASED
    term:
      id: GO:0030199
      label: collagen fibril organization
  locations:
  - preferred_term: vitreous humor
    term:
      id: UBERON:0001797
      label: vitreous humor
  downstream:
  - target: High myopia
    causal_link_type: DIRECT
  - target: Abnormal vitreous humor morphology
    causal_link_type: DIRECT
  - target: Retinal detachment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31090205
    reference_title: Homozygous Type IX collagen variants (COL9A1, COL9A2, and COL9A3) causing recessive Stickler syndrome-Expanding the phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients were highly myopic with congenital megalophthalmos and
      abnormal, hypoplastic vitreous gel
    explanation: >-
      The vitreous and globe phenotype, present in every patient of the type IX
      series.
  - reference: PMID:33356723
    reference_title: Autosomal recessive Stickler syndrome associated with homozygous mutations in the COL9A2 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, we demonstrate reduced macular and overall retinal function
      explaining the reduced visual acuity in patients with Stickler syndrome
      also without retinal complications.
    explanation: >-
      Electrophysiological evidence that retinal function is impaired
      independently of detachment, which is a claim about the tissue rather than
      about a complication.
- name: Cartilage and Craniofacial Matrix Disorganization
  biological_scale: TISSUE
  description: >-
    Collagen IX loss in hyaline cartilage produces a markedly milder skeletal and
    orofacial phenotype than the dominant collagen II and XI Sticklers. Midface
    hypoplasia is present in a minority, arthropathy is uncommon and variable,
    and cleft palate — a defining feature of the collagen XI forms — has not been
    reported in a type IX patient at all. Short stature was described in the
    founding family.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  locations:
  - preferred_term: cartilage tissue
    term:
      id: UBERON:0002418
      label: cartilage tissue
  downstream:
  - target: Midface retrusion
    causal_link_type: DIRECT
  - target: Arthralgia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39406934
    reference_title: Retinal detachment in Type IX collagen recessive Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No patients had cleft palate, and 30.8% had midfacial hypoplasia.
    explanation: >-
      The craniofacial phenotype quantified in the national cohort, including the
      negative cleft palate finding.
  - reference: PMID:39406934
    reference_title: Retinal detachment in Type IX collagen recessive Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Arthropathy was uncommon but variable in manifestation.
    explanation: >-
      The joint phenotype in the same cohort, quoted separately because the two
      findings are not adjacent sentences in the source.
  - reference: PMID:35885918
    reference_title: Autosomal Recessive Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cleft palate is associated with type XI collagen variants, as well as the
      non-collagen genes, but is so far unreported with type IX collagen
      variants.
    explanation: >-
      States the gene-specific absence of cleft palate, which is the cleanest
      single discriminator between the type IX and type XI recessive forms.
- name: Cochlear Matrix Dysfunction
  biological_scale: TISSUE
  description: >-
    Sensorineural hearing loss is near-universal and more severe than in the
    dominant forms, typically with a down-sloping high-frequency audiogram. The
    step from collagen IX loss to cochlear dysfunction is not mechanistically
    worked out in humans; what is established is the epidemiology, and it is
    strong enough that the literature recommends adding COL9A1, COL9A2 and
    COL9A3 to congenital hearing loss gene panels.
  downstream:
  - target: Sensorineural hearing impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:39406934
    reference_title: Retinal detachment in Type IX collagen recessive Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hearing loss was more prevalent (91.7%) than in dominant SS.
    explanation: >-
      The quantified comparison with the dominant forms, from the largest type IX
      cohort.
  - reference: PMID:31090205
    reference_title: Homozygous Type IX collagen variants (COL9A1, COL9A2, and COL9A3) causing recessive Stickler syndrome-Expanding the phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest that COL9A1, COL9A2, and COL9A3 be added to genetic screening
      panels for patients with congenital hearing loss.
    explanation: >-
      The practical consequence the authors draw from the hearing phenotype.

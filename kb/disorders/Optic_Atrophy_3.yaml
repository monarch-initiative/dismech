  evidence:
  - reference: PMID:24136862
    reference_title: "A novel heterozygous OPA3 mutation located in the mitochondrial target sequence results in altered steady-state levels and fragmented mitochondrial network."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Detailed functional analysis of mitochondria harbouring this novel mutation
      demonstrates a fragmented mitochondrial network with a decreased
      mitochondrial mass in patient fibroblasts.
    explanation: >-
      The primary functional observation behind this node, made in cells from an
      affected individual rather than in an overexpression system.
  - reference: PMID:24136862
    reference_title: "A novel heterozygous OPA3 mutation located in the mitochondrial target sequence results in altered steady-state levels and fragmented mitochondrial network."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In addition, quantification of the OPA3 protein reveals decreased
      steady-state levels of the mutant protein compared with the native one.
    explanation: >-
      Reduced abundance of the mutant protein, which is what links a
      presequence variant to the morphological defect.
  - reference: PMID:31119193
    reference_title: "Autosomal dominant optic atrophy and cataract \"plus\" phenotype including axonal neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In fibroblasts, mitochondria were frequently enlarged with slightly
      fragmented cristae.
    explanation: >-
      A second family's fibroblast ultrastructure. Cited here because it
      qualifies rather than reinforces the fragmentation claim: the abnormality
      is morphological in both, but enlargement is not fragmentation.
  - reference: PMID:20372962
    reference_title: "Optic atrophy 3 as a protein of the mitochondrial outer membrane induces mitochondrial fragmentation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we identified OPA3 as an integral protein of the mitochondrial outer
      membrane (MOM), with a C-terminus exposed to the cytosol and an N-terminal
      mitochondrial targeting domain.
    explanation: >-
      Establishes the subcellular localisation and topology, which is what makes
      a variant in the N-terminal presequence mechanistically meaningful.
  - reference: PMID:20372962
    reference_title: "Optic atrophy 3 as a protein of the mitochondrial outer membrane induces mitochondrial fragmentation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      By quantitative analysis, we demonstrated that overexpression of OPA3
      significantly induced mitochondrial fragmentation, whereas OPA3 knockdown
      resulted in highly elongated mitochondria.
    explanation: >-
      The bidirectional dose-morphology relationship. It is the reason reduced
      steady-state protein is not by itself an explanation for the fragmented
      network seen in patient cells.
  - reference: PMID:20372962
    reference_title: "Optic atrophy 3 as a protein of the mitochondrial outer membrane induces mitochondrial fragmentation."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, overexpression of a familial OPA3 mutant (G93S) induced
      mitochondrial fragmentation and spontaneous apoptosis, suggesting that
      OPA3 mutations may cause optic atrophy via a gain-of-function mechanism.
    explanation: >-
      The gain-of-function proposal, which would fit the missense enrichment seen
      across dominant alleles. Graded INDIRECT because it rests on transient
      overexpression of one allele in a cell line rather than on patient tissue,
      which is also why the process annotations on this node stay quantitative
      (INCREASED) rather than being written as GAIN_OF_FUNCTION.

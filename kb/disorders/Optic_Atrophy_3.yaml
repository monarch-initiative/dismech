inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous OPA3 variants segregate with disease in a dominant pattern. The
    entity was defined as such in 2004 in two unrelated French families, and
    dominant transmission has since been confirmed repeatedly, including a large
    pedigree in which a novel missense allele segregated with the phenotype and
    a documented de novo case.

    Dominance here is not the whole inheritance story for the gene. Biallelic
    OPA3 variants cause a different, recessive disease (Costeff syndrome), so
    "OPA3 inheritance" is ambiguous unless the allele count is stated. See the
    differential diagnoses and the discussion below.
  evidence:
  - reference: PMID:15924081
    reference_title: "[An OPA3 gene mutation is responsible for the disease associating optic atrophy and cataract with extrapyramidal signs]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A new clinical entity is identified: autosomal dominant optic atrophy and
      cataract, due to a heterozygous mutation of the OPA3 gene, a nuclear gene
      encoding a mitochondrial protein.
    explanation: >-
      States the entity and its heterozygous, nuclear-gene basis in the family
      followed for 40 years that defined it.
  - reference: PMID:39166438
    reference_title: "Novel heterozygous OPA3 variant in a family with congenital cataracts, sensorineural hearing loss and neuropathy, without optic atrophy and comparison of pathogenic and population variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous mutations in the OPA3 gene are associated with autosomal
      dominant optic atrophy-3 (OPA3), whereas biallelic mutations cause
      autosomal recessive 3-methylglutaconic aciduria type III.
    explanation: >-
      The allele-count rule that separates this dominant entity from the
      recessive OPA3 disease.
pathophysiology:
- name: Heterozygous OPA3 Missense Variant
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The dominant phenotype is overwhelmingly associated with heterozygous
    missense variants. c.313C>G p.(Gln105Glu) is recurrent and had been reported
    in four dominant families before a further two were added in 2015; other
    reported alleles include an in-frame insertion in the mitochondrial
    presequence, c.10_11insCGCCCG p.(Val3_Gly4insAla_Pro), a de novo c.235C>G
    p.(Leu79Val), and c.30G>C p.(Lys10Asn).

    The allelic-class asymmetry is the substantive genetic content here.
    Missense variants are enriched in the dominant optic-atrophy phenotype while
    loss-of-function variants are enriched in the recessive
    3-methylglutaconic-aciduria phenotype, which argues that the dominant
    disease is not simple haploinsufficiency.
  genes:
  - preferred_term: OPA3
    term:
      id: hgnc:8142
      label: OPA3
  genetic_context:
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:25159689
    reference_title: "Clinical and molecular genetic findings in autosomal dominant OPA3-related optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals from two families were found to harbour the c.313C > G,
      p.(Gln105Glu) change in heterozygous state; this genetic defect has been
      previously reported in four dominant optic atrophy families.
    explanation: >-
      Establishes the recurrent dominant allele and how much of the reported
      caseload it carries.
  - reference: PMID:39166438
    reference_title: "Novel heterozygous OPA3 variant in a family with congenital cataracts, sensorineural hearing loss and neuropathy, without optic atrophy and comparison of pathogenic and population variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The analysis of all known disease-associated variants in OPA3 revealed an
      enrichment in missense variants in patients with OPA3 phenotype compared
      with loss-of-function variants, which are more likely to be observed in
      individuals with 3-methylglutaconic aciduria type III, supporting different
      mechanisms of disease.
    explanation: >-
      The variant-class asymmetry between the dominant and recessive OPA3
      diseases, assessed across all known alleles rather than in one family.
  downstream:
  - target: pathophysiology#Reduced OPA3 Steady-State Levels and Mitochondrial Network Fragmentation
    causal_link_type: DIRECT
    description: >-
      Patient fibroblasts carrying the presequence insertion show both reduced
      mutant protein and a fragmented network.
- name: Reduced OPA3 Steady-State Levels and Mitochondrial Network Fragmentation
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    In fibroblasts from a patient carrying the presequence-insertion allele the
    mitochondrial network is fragmented and mitochondrial mass is reduced, and
    the mutant protein is present at lower steady-state levels than wild type.
    Ultrastructural work in a separate ADOAC+ family instead found enlarged
    mitochondria with slightly fragmented cristae, so the morphological
    abnormality is consistent in kind - disturbed mitochondrial morphology -
    without being consistent in direction across alleles.

    Where OPA3 sits is better established than what it does. It is an integral
    protein of the mitochondrial outer membrane, with a cytosol-facing C-terminus
    and an N-terminal targeting domain, and its abundance sets network
    morphology bidirectionally: overexpression fragments mitochondria and
    knockdown elongates them. That bidirectionality is what makes the
    presequence allele interpretable - a variant that lowers steady-state
    protein should elongate the network, yet the patient fibroblasts fragment
    it, so reduced abundance alone does not account for the phenotype.

    What is deliberately absent from this node is a normal molecular function.
    OPA3 has no known homolog and no assigned biochemical activity, so this node
    stops at morphology rather than naming the step that the variant breaks.

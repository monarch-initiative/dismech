- name: Retinal Ganglion Cell Degeneration
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Dominant optic atrophy of any genetic cause is a disease of the retinal
    ganglion cell and its axon, and the pattern in OPA3 disease is the one
    typical of mitochondrial optic neuropathy: the papillomacular bundle is
    affected first, producing central acuity loss and colour vision defects,
    with optic disc pallor on fundoscopy. Where OPA3 has been placed against
    OPA1 mechanistically, the claim is that OPA1 variants disturb fusion, energy
    metabolism, apoptosis, calcium handling and mitochondrial genome
    maintenance, whereas OPA3 variants affect energy metabolism and the control
    of apoptosis only.
  biological_processes:
  - preferred_term: neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  cell_types:
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  locations:
  - preferred_term: optic nerve
    term:
      id: UBERON:0000941
      label: cranial nerve II
  evidence:
  - reference: PMID:22776096
    reference_title: "Dominant optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease affects primary the retinal ganglion cells (RGC) and their
      axons forming the optic nerve, which transfer the visual information from
      the photoreceptors to the lateral geniculus in the brain.
    explanation: >-
      Identifies the cell type and the structure that degenerate in dominant
      optic atrophy, the class this disease belongs to.
  - reference: PMID:22776096
    reference_title: "Dominant optic atrophy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      OPA1 mutations affect mitochondrial fusion, energy metabolism, control of
      apoptosis, calcium clearance and maintenance of mitochondrial genome
      integrity. OPA3 mutations only affect the energy metabolism and the control
      of apoptosis.
    explanation: >-
      The review's own contrast between the two genes, and the basis for the
      apoptosis annotation on this node. Graded INDIRECT because it is a review's
      summary claim about the gene rather than a measurement in retinal ganglion
      cells.
  - reference: PMID:25159689
    reference_title: "Clinical and molecular genetic findings in autosomal dominant OPA3-related optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The papillomacular bundle is primarily affected and vision is typically
      worse than 20/40.
    explanation: >-
      The topography of axonal loss in this specific disease, measured in the
      OPA3 families rather than inferred from the disease class.
  downstream:
  - target: phenotypes#Optic Atrophy
    causal_link_type: DIRECT
  - target: phenotypes#Reduced Visual Acuity
    causal_link_type: DIRECT
  - target: phenotypes#Optic Disc Pallor
    causal_link_type: DIRECT
    description: >-
      Disc pallor is the fundoscopic appearance of the axonal loss, described in
      the source as related to the retinal ganglion cell death.
  - target: phenotypes#Colour Vision Defect
    causal_link_type: DIRECT
    description: >-
      Colour vision loss follows from preferential involvement of the
      papillomacular bundle.
- name: Lens Fibre Mitochondrial Dysfunction
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Cortical lens opacity is the feature that names the entity, and it is the
    part of the mechanism that is least worked out. OPA3 is expressed in the
    lens as well as the retina, and mouse work shows that the protein
    accumulates in the lens with age and that a mutant form retains
    mitochondrial localisation while disrupting mitochondrial morphology - so a
    lens-intrinsic mitochondrial defect is plausible. It is graded PROVISIONAL
    because the supporting functional data are from a mouse modelling the
    recessive disease, not the dominant one, and no human lens tissue has been
    examined.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  locations:
  - preferred_term: lens of the eye
    term:
      id: UBERON:0000965
      label: lens of camera-type eye
  evidence:
  - reference: PMID:21613372
    reference_title: "Mitochondrial localization and ocular expression of mutant Opa3 in a mouse model of 3-methylglutaconicaciduria type III."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Opa3 was expressed throughout embryonic development, with high levels of
      expression in the developing brain, retina, optic nerve, and lens.
    explanation: >-
      Lens expression of the gene, which is the precondition for a lens-intrinsic
      mechanism. Graded INDIRECT and MODEL_ORGANISM: mouse expression, in a
      strain modelling the recessive disease.
  - reference: PMID:21613372
    reference_title: "Mitochondrial localization and ocular expression of mutant Opa3 in a mouse model of 3-methylglutaconicaciduria type III."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mutant Opa3 protein retains its mitochondrial localization and induces
      disrupted mitochondrial morphology. Opa3 accumulates in the lens.
    explanation: >-
      Mutant protein accumulating in the lens while disrupting mitochondrial
      morphology - the closest thing to a lens mechanism that exists. Graded
      INDIRECT because the allele studied is the recessive-disease allele, so it
      supports a lens-intrinsic mechanism for the gene rather than for this
      dominant entity.
  downstream:
  - target: phenotypes#Cataract
    causal_link_type: DIRECT
phenotypes:
- category: Ophthalmological
  name: Optic Atrophy
  description: >-
    Bilateral and early, usually within the first decade, and the defining
    feature of the entity - though not an obligate one: a large family with a
    likely pathogenic OPA3 missense allele has been reported with congenital
    cataracts, hearing loss and neuropathy but no optic atrophy.
  phenotype_term:
    preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:25159689
    reference_title: "Clinical and molecular genetic findings in autosomal dominant OPA3-related optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although dominant OPA3 mutations are typically associated with optic
      atrophy and cataracts, the former can be observed in isolation; we report a
      case with no lens opacities at age 38.
    explanation: >-
      Optic atrophy as the typical feature, and the observation that it can occur
      without cataract.
  - reference: PMID:39166438
    reference_title: "Novel heterozygous OPA3 variant in a family with congenital cataracts, sensorineural hearing loss and neuropathy, without optic atrophy and comparison of pathogenic and population variants."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case broadens the clinical and genetic spectrum associated with OPA3
      mutations and highlights that optic atrophy is not an obligate feature of
      OPA3-related disorders.
    explanation: >-
      Refutes optic atrophy as an obligate feature, which is why the frequency
      here is VERY_FREQUENT rather than obligate.
- category: Ophthalmological
  name: Cataract
  description: >-
    Cortical, anterior and/or posterior. Onset is variable: reported from
    congenital and early childhood through to later life, and it is often the
    presenting problem, with the optic neuropathy recognised only when vision
    fails to improve after lens surgery.

    Graded VERY_FREQUENT: cataract is in the name of the entity, seven of eight
    individuals in the ADOAC+ series had early-onset cataracts, and the 2025
    family had congenital cataracts. It is not obligate - one carrier of the
    recurrent p.(Gln105Glu) allele had no lens opacities at age 38 - which is
    why the band is not written as universal.
  phenotype_term:
    preferred_term: Cataract
    term:
      id: HP:0000518
      label: Cataract
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:25159689
    reference_title: "Clinical and molecular genetic findings in autosomal dominant OPA3-related optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Conversely, it is important to consider OPA3-related disease in individuals
      with bilateral infantile-onset cataracts and to assess optic nerve health in
      those whose vision fail to improve following lens surgery.
    explanation: >-
      Infantile-onset cataract as a presenting feature, and the clinical trap of
      attributing all the visual loss to the lens.
  - reference: PMID:31119193
    reference_title: "Autosomal dominant optic atrophy and cataract \"plus\" phenotype including axonal neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main clinical features in one family (n = 7 affected individuals) and
      one sporadic case were early-onset cataracts (n = 7), symptoms of
      gastrointestinal dysmotility (n = 8), and possible/confirmed PN (n = 7).
    explanation: >-
      Counts early-onset cataract in seven of eight individuals in the ADOAC+
      series.
- category: Ophthalmological
  name: Reduced Visual Acuity
  description: >-
    Typically worse than 20/40, but the range is wide within a single genotype -
    one individual carrying the recurrent p.(Gln105Glu) allele retained normal
    acuity into the fifth decade.
  phenotype_term:
    preferred_term: Reduced visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:25159689
    reference_title: "Clinical and molecular genetic findings in autosomal dominant OPA3-related optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, we describe one subject who retained normal acuities into the
      fifth decade of life.
    explanation: >-
      The upper end of expressivity in a carrier of the recurrent allele, which
      is why acuity is described as a range rather than a threshold.
- category: Ophthalmological
  name: Optic Disc Pallor
  phenotype_term:
    preferred_term: Optic disc pallor
    term:
      id: HP:0000543

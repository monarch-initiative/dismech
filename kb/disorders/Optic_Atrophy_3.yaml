animal_models:
- name: Opa3 L122P ENU mouse
  species: Mouse
  genotype: Opa3 c.365T>C p.(L122P), heterozygous and homozygous
  publication: PMID:18222992
  description: >-
    An ENU-induced missense mouse that is the main published in vivo model for
    the gene. It is included here for a negative reason as much as a positive
    one: the heterozygote, which is the genotype that corresponds to this
    dominant human disease, is unaffected, while the homozygote reproduces the
    recessive human disease.
  modeled_mechanisms:
  - target: Retinal Ganglion Cell Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      In the heterozygous state - the state that matches the human dominant
      genotype - the mice appear uncompromised. Retinal ganglion cell loss and
      optic nerve degeneration appear only in homozygotes, which model the
      recessive human disease instead, together with cardiomyopathy,
      extrapyramidal dysfunction and death before four months.
    limitations: >-
      The genotype that models this entity produces no phenotype, so the model
      cannot be used to study dominant OPA3 optic neuropathy. Any retinal or
      optic nerve finding cited from this mouse is a homozygote finding and
      belongs to Costeff syndrome, not here. There is currently no published
      mouse carrying a human dominant OPA3 allele such as p.Q105E.
    evidence:
    - reference: PMID:18222992
      reference_title: "A missense mutation in the murine Opa3 gene models human Costeff syndrome."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In the heterozygous state, the mice appear uncompromised however; in the
        homozygous state mice display some of the features of MGA.
      explanation: >-
        The heterozygous mouse is unaffected, which is what makes this model
        uninformative for the dominant human disease.
    - reference: PMID:18222992
      reference_title: "A missense mutation in the murine Opa3 gene models human Costeff syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Visual function is severely reduced, consistent with significant loss of
        retinal ganglion cells and degeneration of axons in the optic nerve.
      explanation: >-
        The retinal ganglion cell phenotype that does occur - in homozygotes,
        which model the recessive disease.
differential_diagnoses:
- name: Costeff syndrome (3-methylglutaconic aciduria type III)
  description: >-
    The most important entry on this list, because it is caused by the same gene
    and is what a literature search on "OPA3" mostly returns. It is recessive,
    needs biallelic variants that are enriched for loss of function, begins
    before age ten with optic atrophy plus a choreoathetoid movement disorder,
    progresses to spastic paraparesis, and carries a urinary organic-acid marker
    that the dominant disease does not. A founder splice-site allele is prevalent
    in the Iraqi Jewish population.

    Practical separation: allele count and urinary organic acids. Neither
    3-methylglutaconic nor 3-methylglutaric aciduria is a feature of the dominant
    disease.
  evidence:
  - reference: PMID:20301646
    reference_title: "Costeff Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Costeff syndrome is characterized by optic atrophy and/or choreoathetoid
      movement disorder with onset before age ten years.
    explanation: >-
      The recessive phenotype, from its GeneReviews chapter.
  - reference: PMID:20301646
    reference_title: "Costeff Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of Costeff syndrome is established in a proband with
      suggestive findings by identification of biallelic OPA3 pathogenic variants
      on molecular genetic testing.
    explanation: >-
      Biallelic status as the diagnostic requirement, which is the line between
      the two OPA3 diseases.
- name: OPA1-related dominant optic atrophy
  description: >-
    The overwhelmingly more likely diagnosis in a patient presenting with
    dominant optic atrophy, and the one excluded first. OPA1 accounts for about
    75 percent of molecular diagnoses in this class against OPA3's 1 percent.
    Cataract is the discriminating feature clinically; sequencing settles it.
  evidence:
  - reference: PMID:22776096
    reference_title: "Dominant optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular diagnosis is provided by the identification of a mutation in the
      OPA1 gene (75% of DOA patients) or in the OPA3 gene (1% of patients).
    explanation: >-
      The relative frequencies that make OPA1 the first-line test.
- name: Leber hereditary optic neuropathy
  description: >-
    Maternally inherited mitochondrial-DNA optic neuropathy, screened alongside
    OPA1 in every dominant-optic-atrophy workup. The three primary mutations were
    tested and negative in the 188-proband series that also found no OPA3
    defects, which is what leaves an unexplained residue for second-line genes.
  evidence:
  - reference: PMID:21036400
    reference_title: "Genetic screening for OPA1 and OPA3 mutations in patients with suspected inherited optic neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary LHON screen was negative in the patient cohort, and additional
      molecular investigations did not reveal any large-scale OPA1 rearrangements
      or OPA3 genetic defects.
    explanation: >-
      Places the Leber screen in the same diagnostic pathway and records that it
      was negative in that series.
- name: Complex inherited peripheral neuropathy
  description: >-
    Not an optic-nerve differential but the one that matters for the ADOAC+
    phenotype. An adult with an axonal neuropathy, early cataracts and
    gastrointestinal dysmotility may have an OPA3 variant even with no
    clinically apparent optic atrophy, so OPA3 belongs on inherited-neuropathy
    gene panels.
  evidence:
  - reference: PMID:31119193
    reference_title: "Autosomal dominant optic atrophy and cataract \"plus\" phenotype including axonal neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A syndromic form of ADOAC (ADOAC+), in which axonal neuropathy may be a
      major feature, is described.
    explanation: >-
      Names the ADOAC+ phenotype that makes this differential necessary.
discussions:
- discussion_id: opa3_dominant_vs_recessive_evidence_provenance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How much of what is written about "OPA3 disease" is actually about the
    dominant entity, and how would a reader tell?
  attaches_to:
  - "genetic#OPA3"
  - "differential_diagnoses#Costeff syndrome (3-methylglutaconic aciduria type III)"
  rationale: >-
    This is a provenance problem rather than a biology problem, and it is the
    main hazard in curating this entry.

    One gene causes two diseases with different inheritance, different onset,
    different systemic features and different allele classes, and the review
    literature routinely treats them together under the OPA3 heading. Aggregated
    resources compound it: a search for "optic atrophy 3" returns descriptions
    of Costeff syndrome, and a deep-research report generated for this entry was
    titled "OPA3-Associated Optic Atrophy and Organic Aciduria" and interleaved
    the two throughout. Its statements about chorea, spastic paraparesis and
    3-methylglutaconic aciduria are true of the recessive disease and false of
    this one.

    The concrete consequence for curation is that every claim in this entry has
    to be traced to a heterozygous pedigree, and several plausible-sounding
    features were left out for exactly that reason. The one genuinely
    cross-cutting piece of evidence retained here is the mitochondrial-toxin
    avoidance advice, cited from both sources and flagged as gene-level rather
    than entity-level.

    What would resolve it is a phenotype series that reports dominant OPA3
    families separately with structured HPO annotation. The 2019 ADOAC+ series
    and the 2015 series are the closest available, and both are small.
- discussion_id: opa3_no_dominant_animal_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Is there any in vivo model of dominant OPA3 optic neuropathy, given that the
    heterozygous Opa3 mouse is unaffected?
  attaches_to:
  - "animal_models#Opa3 L122P ENU mouse"
  - "pathophysiology#Reduced OPA3 Steady-State Levels and Mitochondrial Network Fragmentation"
  rationale: >-
    The published Opa3 mouse is a model of the recessive disease. Heterozygotes
    appear uncompromised; the retinal ganglion cell loss, optic nerve
    degeneration, cardiomyopathy and early death all require homozygosity for
    p.L122P. So the genotype that corresponds to human dominant disease produces
    no phenotype to study.

    Two readings of that are live and the evidence does not separate them. Either
    the mouse retinal ganglion cell tolerates single-allele OPA3 disturbance that
    the human one does not, in which case the model is simply the wrong species
    for this entity; or the human dominant alleles act by a mechanism that
    p.L122P heterozygosity does not reproduce - which the missense-versus-loss-of-function
    asymmetry across human alleles would predict, and which would mean no dosage
    model can work.

    Either way the practical position is the same: all current mechanistic
    evidence for this entity comes from patient fibroblasts, and there is no in
    vivo system in which a candidate therapy could be tested. A knock-in mouse
    carrying a human dominant allele such as p.Q105E is the missing experiment.
  proposed_experiments:
  - experiment_id: exp_opa3_q105e_knockin
    name: Knock-in mouse carrying the recurrent dominant p.Q105E allele
    description: >-
      Generate a heterozygous Opa3 p.Q105E knock-in and characterise retinal
      ganglion cell counts, optic nerve axon counts, lens opacity and
      mitochondrial morphology against age-matched wild type. A phenotype would
      give the entity its first in vivo model; its absence would be a positive
      result too, pointing the mechanism away from the mouse retinal ganglion
      cell and towards a human-specific vulnerability.
- discussion_id: opa3_lens_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does the lens fail in dominant OPA3 disease, and is it a lens-intrinsic
    defect or secondary?
  attaches_to:
  - "pathophysiology#Lens Fibre Mitochondrial Dysfunction"
  - "phenotypes#Cataract"
  rationale: >-
    Cataract is in the name of the entity and is the feature that distinguishes
    it clinically from OPA1 disease, yet it is the least mechanistically
    explained thing about it. No human lens tissue from an affected individual
    has been examined, and the available functional work on OPA3 in the lens is
    from a mouse modelling the recessive disease.

    The question is not decorative. If the cataract is a lens-intrinsic
    mitochondrial defect it is a separate therapeutic target from the optic
    neuropathy; if it is secondary, lens surgery is the whole of its management
    and nothing further is needed. The observation that lens surgery does not
    restore vision is consistent with both.
notes: >-
  Naming. This entry is filed under the MONDO label "optic atrophy 3", which is
  the OMIM-derived locus name. The clinical literature calls it autosomal
  dominant optic atrophy and cataract (ADOAC), and the extended form with
  neuropathy and dysmotility is written ADOAC+. Both are in the synonyms.

  Curation inputs and what was rejected. One Perplexity deep-research run,
  committed alongside this entry, plus independent PubMed searching. The report
  was used for orientation only: it covers both OPA3 diseases under one heading,
  contains no PMID or DOI citations at all - its reference validation section
  found four resolvable references out of eighteen citations, the rest being
  web pages - and its ontology suggestions include at least one confident
  mislabel, offering HP:0001103 as "optic disc pallor" when HPO calls that term
  Abnormal macular morphology (optic disc pallor is HP:0000543, used here). No
  CURIE and no claim was taken from it without independent confirmation.

  The report did earn its place in one concrete way worth recording, because it
  is not the way the report itself advertises. Resolving its citations pulled
  two papers into the reference cache that the independent PubMed searches had
  missed - PMID:20372962, which localises OPA3 to the mitochondrial outer
  membrane and shows the bidirectional dose-morphology effect, and
  PMID:21613372, which is the lens expression work. Both are now cited in the
  pathophysiology. So the useful yield here came from the citation *resolution*
  step rather than from the prose.

  Extrapyramidal signs: considered, not curated, and here is why. PMID:15924081
  is titled "An OPA3 gene mutation is responsible for the disease associating
  optic atrophy and cataract with extrapyramidal signs" and carries the MeSH
  heading Basal Ganglia Diseases; one of this entry's own synonyms is "Optic
  atrophy, cataract, and neurologic disorder"; and a further dominant family has
  been reported with ataxia and areflexia (PMID:22797356). So the feature is
  real and this entry does not dispute it.

  It is not curated as a structured phenotype because no citable source
  available here contains a quotable sentence for it. The body of PMID:15924081
  offers only "neurological symptoms", which is too vague to bind to a movement
  term; its title carries the specific claim, and a title is not a finding
  (`check-title-snippets` bars quoting one). PMID:22797356 resolves but has no
  abstract or full text in the cache, so its title is likewise unquotable. The
  Orphanet record for this disorder, ORPHA:67036, does list tremor and
  extrapyramidal rigidity and would be the right structured source - but it is
  not among the 347 ORPHA records cached in this repository, and
  `just refresh-orphadata` currently fails on a checksum mismatch against the
  pinned manifest, so it could not be generated here.

  The honest position is therefore: extrapyramidal signs belong in this
  phenotype and are missing for want of a quotable source, not for want of
  evidence. Adding ORPHA:67036 to the cache is the concrete fix, and a curator
  who does that should add tremor and extrapyramidal rigidity here.

  A reference that could not be quoted. PMID:15342707, the 2004 paper that
  established OPA3 as an ADOAC locus, has no abstract or full text available
  through the reference cache. It is listed in the top-level references because
  it is the founding citation, but no evidence item quotes it, and the claims it
  would have supported are sourced from the 2005 Rev Neurol report and later
  series instead.

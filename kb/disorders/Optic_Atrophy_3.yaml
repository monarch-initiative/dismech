diagnosis:
- name: Sequencing OPA3 after OPA1 and LHON have been excluded
  description: >-
    The practical rule is that OPA3 is a second-line gene. A patient with
    bilateral optic atrophy is screened for OPA1 and the primary Leber
    mitochondrial-DNA mutations first; OPA3 is worth sequencing when those are
    negative and the phenotype carries one of the pointers - cortical cataract,
    sensorineural hearing loss, or an axonal peripheral neuropathy.

    Two presentations invert the usual order and are the ones most likely to be
    missed. A child with bilateral infantile cataracts whose vision does not
    improve after lens surgery should have the optic nerve assessed rather than
    the surgery reviewed. And an adult worked up for a complex inherited
    peripheral neuropathy may carry an OPA3 variant even without clinically
    apparent optic atrophy.
  evidence:
  - reference: PMID:31119193
    reference_title: "Autosomal dominant optic atrophy and cataract \"plus\" phenotype including axonal neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      OPA3 mutations should be included in the differential diagnosis of complex
      inherited PN, even in the absence of clinically apparent optic atrophy.
    explanation: >-
      The authors' own recommendation, and the reason a neuropathy workup is a
      route into this diagnosis.
  - reference: PMID:22776096
    reference_title: "Dominant optic atrophy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Optical Coherence Tomography further discloses non-specific thinning of
      retinal nerve fiber layer, but a normal morphology of the photoreceptors
      layers.
    explanation: >-
      The OCT signature that separates an optic neuropathy from a retinal
      dystrophy. Graded INDIRECT because it describes dominant optic atrophy as a
      class.
treatments:
- name: Supportive Care and Low-Vision Rehabilitation
  description: >-
    There is no disease-modifying treatment. Management is low-vision aids,
    educational and occupational accommodation, and hearing and neuropathy care
    where those features are present.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:22776096
    reference_title: "Dominant optic atrophy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, there is no preventative or curative treatment in DOA; severely
      visually impaired patients may benefit from low vision aids.
    explanation: >-
      The absence of disease-modifying therapy and the supportive standard of
      care. Graded INDIRECT: stated for dominant optic atrophy as a class, and no
      OPA3-specific trial exists.
- name: Cataract Extraction
  description: >-
    Lens surgery addresses the lens component of the visual loss and does not
    address the optic neuropathy, so acuity after surgery is limited by the
    optic nerve. Failure of vision to improve after cataract surgery in a child
    is itself a diagnostic pointer.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Cataract Surgery
    term:
      id: NCIT:C157809
      label: Cataract Surgery
  evidence:
  - reference: PMID:25159689
    reference_title: "Clinical and molecular genetic findings in autosomal dominant OPA3-related optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Conversely, it is important to consider OPA3-related disease in individuals
      with bilateral infantile-onset cataracts and to assess optic nerve health in
      those whose vision fail to improve following lens surgery.
    explanation: >-
      Establishes both that lens surgery is done in this disease and that it
      leaves the optic neuropathy untreated.
- name: Avoidance of Mitochondrial Toxins
  description: >-
    Patients with dominant optic atrophy are advised to avoid tobacco and
    alcohol and drugs that interfere with mitochondrial metabolism. This is
    consensus practice across mitochondrial optic neuropathies rather than an
    OPA3-specific trial result, and the same advice appears in the GeneReviews
    chapter for the recessive OPA3 disease.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Preventive Intervention
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  evidence:
  - reference: PMID:22776096
    reference_title: "Dominant optic atrophy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      patients are advised to avoid alcohol and tobacco consumption, as well as
      the use of medications that may interfere with mitochondrial metabolism
    explanation: >-
      The avoidance advice. Graded OTHER rather than HUMAN_CLINICAL because the
      sentence reports expert consensus practice rather than a clinical
      observation, and INDIRECT because it is written for the disease class, not
      measured in OPA3 carriers.
  - reference: PMID:20301646
    reference_title: "Costeff Syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agents/circumstances to avoid: Use of tobacco, alcohol, and medications
      known to impair mitochondrial function.
    explanation: >-
      The same advice in the GeneReviews chapter for the recessive OPA3 disease.
      Graded INDIRECT because it is written for the other OPA3 disease; it is
      cited to show the advice is gene-level, not to import recessive-disease
      content.
- name: Genetic Counselling
  description: >-
    Autosomal dominant transmission with a 50 percent recurrence risk for
    offspring of an affected individual, complicated by wide intrafamilial
    variability in age of onset and severity - within a single family carrying
    one allele, presentations ranged from normal acuity in the fifth decade to
    early severe visual loss.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:25159689
    reference_title: "Clinical and molecular genetic findings in autosomal dominant OPA3-related optic neuropathy."
    supports: SUPPORT

    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ophthalmic examination discloses on fundoscopy isolated optic disc
      pallor or atrophy, related to the RGC death.
    explanation: >-
      The fundoscopic sign. Graded INDIRECT because the source describes dominant
      optic atrophy as a class rather than OPA3-mutant patients specifically.
- category: Ophthalmological
  name: Colour Vision Defect
  phenotype_term:
    preferred_term: Color vision defect
    term:
      id: HP:0000551
      label: Color vision defect
  evidence:

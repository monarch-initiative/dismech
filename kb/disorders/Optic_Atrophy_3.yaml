genetic:
- name: OPA3
  gene_term:
    preferred_term: OPA3
    term:
      id: hgnc:8142
      label: OPA3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    OPA3 is a small nuclear-encoded mitochondrial membrane protein on 19q13. It
    is the only gene implicated in this entity.

    Interpreting a new OPA3 variant means answering two questions in order, and
    the second is the one that is easy to skip. First, is it heterozygous or
    biallelic - that decides which of the two OPA3 diseases is in play. Second,
    is it missense or loss of function - missense alleles are enriched in the
    dominant optic-atrophy phenotype and loss-of-function alleles in the
    recessive aciduria phenotype, so a heterozygous truncating variant found in
    a patient with optic atrophy does not have the class of allele the dominant
    disease usually shows.

    The recurrent c.313C>G p.(Gln105Glu) allele carries a large share of the
    published dominant families; as of the 2015 series only six OPA3 dominant
    families had been reported in total.

    A caution about the founding reference. Reynier et al. 2004 (PMID:15342707)
    is the paper that established OPA3 as an ADOAC locus and is cited in the
    top-level references, but no abstract or full text could be cached for it,
    so nothing in this entry is quoted from it. Its content is instead
    represented through the 2005 Rev Neurol report on the Garcin family and
    through later series.
  evidence:
  - reference: PMID:25159689
    reference_title: "Clinical and molecular genetic findings in autosomal dominant OPA3-related optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only six families with OPA3-associated dominant optic atrophy have
      been reported.
    explanation: >-
      The size of the reported dominant caseload as of 2015, which bounds how
      much any statement about this entity can rest on.
  - reference: PMID:24136862
    reference_title: "A novel heterozygous OPA3 mutation located in the mitochondrial target sequence results in altered steady-state levels and fragmented mitochondrial network."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Besides the known p.Q105E mutation, we observed a novel insertion,
      c.10_11insCGCCCG/p.V3_G4insAP which is located in the mitochondrial
      presequence.
    explanation: >-
      The presequence insertion allele, and confirmation that p.Q105E was already
      the known recurrent variant by 2013.
prevalence:
- population: Patients with dominant optic atrophy
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    OPA3 is a rare cause of an already rare disease. A review of dominant optic
    atrophy attributes about 75 percent of molecular diagnoses to OPA1 and about
    1 percent to OPA3. Two diagnostic series give the practical picture from
    opposite ends: screening 188 probands with bilateral optic atrophy at a
    tertiary laboratory found OPA1 variants in 14.4 percent and no OPA3 defect at
    all, while a cohort of 121 ADOA patients already negative for OPA1 yielded
    four independent OPA3 cases.

    The two numbers are not in conflict and should not be averaged. The
    OPA1-negative cohort is enriched by construction, so four in 121 is a
    diagnostic yield after the common gene has been excluded, not a share of
    dominant optic atrophy. Dominant optic atrophy as a whole has a prevalence of
    roughly 1 in 30,000, falling to about 1 in 10,000 in Denmark through a
    founder effect; no separate prevalence figure exists for the OPA3 subset.
  evidence:
  - reference: PMID:22776096
    reference_title: "Dominant optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular diagnosis is provided by the identification of a mutation in the
      OPA1 gene (75% of DOA patients) or in the OPA3 gene (1% of patients).
    explanation: >-
      The share of dominant optic atrophy attributable to OPA3.
  - reference: PMID:21036400
    reference_title: "Genetic screening for OPA1 and OPA3 mutations in patients with suspected inherited optic neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      OPA1 mutations are the most common genetic defects identified in patients
      with suspected DOA, whereas OPA3 mutations are very rare in isolated optic
      atrophy cases.
    explanation: >-
      An unselected 188-proband series in which no OPA3 defect was found, which
      is the strongest available statement of the gene's rarity.
  - reference: PMID:24136862
    reference_title: "A novel heterozygous OPA3 mutation located in the mitochondrial target sequence results in altered steady-state levels and fragmented mitochondrial network."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified four independent cases (representing families with multiple
      affected members) with OPA3 mutations.
    explanation: >-
      The yield in a cohort of 121 ADOA patients preselected as OPA1-negative -
      the enriched denominator that makes this a yield rather than a prevalence.
- population: Denmark and worldwide (dominant optic atrophy as a class)

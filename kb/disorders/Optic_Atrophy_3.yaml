    reference_title: "Dominant optic atrophy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DOA patients usually suffer of moderate visual loss, associated with central
      or paracentral visual field deficits and color vision defects.
    explanation: >-
      Colour vision loss in dominant optic atrophy. Graded INDIRECT for the same
      reason as optic disc pallor: it is a class-level description.
- category: Audiological
  name: Sensorineural Hearing Impairment
  description: >-
    Reported in a minority. Two affected individuals in the 2015 series and
    three individuals in the 2019 ADOAC+ series had hearing loss, and OPA3 is
    expressed in murine cochlear tissue.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:25159689
    reference_title: "Clinical and molecular genetic findings in autosomal dominant OPA3-related optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The condition can be associated with extraocular clinical features: two
      affected individuals in the present study had sensorineural hearing loss.
    explanation: >-
      Hearing loss in OPA3-mutant individuals rather than in dominant optic
      atrophy generally.
  - reference: PMID:24136862
    reference_title: "A novel heterozygous OPA3 mutation located in the mitochondrial target sequence results in altered steady-state levels and fragmented mitochondrial network."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This finding is supported by expression analysis of OPA3 in murine cochlear
      tissue.
    explanation: >-
      Cochlear expression of the gene, offered as biological plausibility for the
      hearing loss. Graded INDIRECT and MODEL_ORGANISM: expression in mouse
      cochlea does not itself demonstrate that the human hearing loss is caused
      by the variant.
- category: Neurological
  name: Peripheral Axonal Neuropathy
  description: >-
    The defining feature of the ADOAC+ phenotype. Axonal, and variably
    asymptomatic, sensory-predominant or sensorimotor; sural nerve biopsy in one
    individual showed loss of both large and small myelinated fibres.
  phenotype_term:
    preferred_term: Peripheral axonal neuropathy
    term:
      id: HP:0003477
      label: Peripheral axonal neuropathy
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:31119193
    reference_title: "Autosomal dominant optic atrophy and cataract \"plus\" phenotype including axonal neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 5 individuals, the neuropathy was axonal and clinically asymptomatic
      (n = 1), sensory-predominant (n = 2), or motor and sensory (n = 2).
    explanation: >-
      Characterises the neuropathy and its clinical range within the series.
  - reference: PMID:31119193
    reference_title: "Autosomal dominant optic atrophy and cataract \"plus\" phenotype including axonal neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In one patient, nerve biopsy revealed a loss of large and small myelinated
      fibers.
    explanation: >-
      Histological confirmation of axonal loss.
- category: Gastrointestinal

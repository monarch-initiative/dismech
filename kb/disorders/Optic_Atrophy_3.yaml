name: Optic Atrophy 3
creation_date: "2026-08-29T20:15:00Z"
category: Mendelian
disease_term:
  preferred_term: Optic atrophy 3
  term:
    id: MONDO:0008133
    label: optic atrophy 3
description: >-
  Optic atrophy 3 (OPA3), better known clinically as autosomal dominant optic
  atrophy and cataract (ADOAC), is a dominantly inherited mitochondrial optic
  neuropathy caused by heterozygous variants in OPA3, a nuclear gene encoding a
  small mitochondrial membrane protein. Retinal ganglion cells degenerate,
  producing early bilateral optic atrophy with reduced acuity and colour vision;
  cortical lens opacities appear in most affected individuals; and a minority
  develop a wider syndrome that can include sensorineural hearing loss, axonal
  peripheral neuropathy, gastrointestinal dysmotility and lipodystrophy.

  The first thing to establish about this entry is which OPA3 disease it is,
  because the gene causes two. Heterozygous - almost always missense - variants
  cause this dominant optic-atrophy-plus-cataract disorder. Biallelic variants,
  which are enriched for loss of function, cause Costeff syndrome
  (3-methylglutaconic aciduria type III), a recessive infantile neuro-metabolic
  disease whose defining chorea and spastic paraparesis, and whose urinary
  organic-acid signature, are not features of this dominant disease. That is a
  statement about the two syndromes' defining features and not a claim that the
  dominant form is free of movement abnormality - extrapyramidal signs have
  been described in dominant families, and the notes below say what can and
  cannot be cited for them. The two are separate MONDO terms and
  separate entries; the allelic-class asymmetry has been quantified across all
  known OPA3 alleles and is the best current argument that the two phenotypes
  arise by different mechanisms rather than by dosage alone. Literature searches
  on "OPA3" return both, and reviews frequently describe them together, so any
  claim imported into this entry has to be traced back to a dominant pedigree.

  Mechanistically OPA3 sits with OPA1, MFN2 and DNM1L in the group of dominant
  optic atrophies caused by mitochondrial-dynamics genes, and what the functional
  work shows is a fragmented network with reduced mitochondrial mass in patient
  fibroblasts, together with reduced steady-state levels of the mutant protein.
  Beyond that the account is thin: OPA3's normal molecular function is still not
  established, which is why the pathophysiology below stops at network
  morphology and retinal ganglion cell loss rather than naming a biochemical
  step.

  It is a rare cause of a rare disease. OPA1 explains roughly three-quarters of
  dominant optic atrophy and OPA3 about one percent, and a 188-proband
  diagnostic series found no OPA3 defect at all. A single recurrent allele,
  c.313C>G p.(Gln105Glu), accounts for a large share of the reported families.
parents:
- hereditary disease
- Mitochondrial Disease

  downstream:
  - target: Total Anomalous Pulmonary Venous Return
    description: Complete failure of pulmonary venous incorporation into the left atrium manifests anatomically as total anomalous pulmonary venous return.
  - target: Obligatory Interatrial Right-to-Left Shunting
    description: Absence of direct pulmonary venous return to the left atrium makes right-to-left shunting of mixed right atrial blood obligatory to supply the left heart and systemic circulation.
  - target: Right-Heart Volume Overload
    description: Redirection of the entire pulmonary venous return to the right atrium and right ventricle recirculates oxygenated blood back to the lungs, producing severe right-sided chamber volume overload.
  - target: Pulmonary Venous Obstruction
    description: Abnormal anomalous drainage pathways can be narrowed or externally compressed along their course, raising pulmonary venous pressure and worsening postnatal compromise.
- name: Obligatory Interatrial Right-to-Left Shunting
  description: >-
    Because all oxygenated pulmonary venous blood enters the right atrium
    instead of the left atrium, systemic cardiac output and survival depend on
    an obligatory right-to-left shunt (typically across an atrial septal defect
    or patent foramen ovale, or less commonly a patent ductus arteriosus),
    mixing oxygenated pulmonary venous blood with desaturated systemic venous
    blood and delivering mixed blood to the left heart.

  evidence:
  - reference: PMID:35514310
    reference_title: "TBX5 variant with the novel phenotype of mixed‑type total anomalous pulmonary venous return in Holt‑Oram Syndrome and variable intrafamilial heart defects."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The decrease in the number of non‑covalent bonds suggested that the resultant mutant dimer was less stable compared with the wild‑type protein, consequently affecting the protein's ability to bind DNA."
    explanation: >-
      In silico structural modeling indicates that the TBX5 nonsense variant
      destabilizes the transcription factor dimer and impairs DNA binding in
      mixed-type TAPVR.
  - reference: PMID:25625280
    reference_title: TBX20 loss-of-function mutation contributes to double outlet right ventricle.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In another study, using PCR sequencing, Liu et al  (63) screened the exons 2 to 6 of TBX20 (which code for the T-box DNA-binding domain) in 203 unrelated patients with CHD, and discovered 3 non-synonymous mutations of p.A63T, p.I121F and p.T262M in 3 patients atrial septal defect, total anomalous pulmonary venous connection and tetralogy of Fallot, respectively, with a mutational prevalence of approximately 1.48%."
    explanation: >-
      Documents the TBX20 T-box DNA-binding domain missense variant p.I121F
      identified in a patient with total anomalous pulmonary venous connection.
  downstream:
  - target: Anomalous Pulmonary Venous Drainage
    description: Dysregulated T-box transcriptional programs impair fusion of the pulmonary venous confluence with the left atrium and atrial septation.

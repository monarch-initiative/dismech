    description: Increased right-heart preload and heart failure physiology trigger compensatory tachycardia.
  - target: Exertional Dyspnea
    description: Pulmonary overcirculation and elevated right-sided filling pressures cause exertional dyspnea, including during feeding in infants.
  - target: Fatigue
    description: Impaired cardiac output reserve and chronic heart failure physiology result in fatigue.
- name: Pulmonary Venous Obstruction
  description: >-
    Narrowed or externally compressed anomalous venous pathways (most frequent
    in infracardiac TAPVC, up to 78% of cases) or postoperative anastomotic
    stenosis elevate pulmonary venous pressure, worsening cyanosis, pulmonary
    edema, respiratory distress, and pulmonary arterial hypertension.
  cell_types:
  - preferred_term: blood vessel endothelial cell
    term:
      id: CL:0000071
      label: blood vessel endothelial cell
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  locations:
  - preferred_term: pulmonary vein
    term:
      id: UBERON:0002016
      label: pulmonary vein
  evidence:
  - reference: PMID:16638546
    reference_title: Surgical repair of total anomalous pulmonary venous connection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical presentation is different if the pulmonary venous drainage is unobstructed (heart failure, mild cyanosis) or obstructed (respiratory failure, severe heart failure)."
    explanation: >-
      The review distinguishes obstructed from unobstructed TAPVR and links
      obstruction to more severe clinical compromise.
  - reference: PMID:27594934
    reference_title: Computed tomography features of supracardiac total anomalous pulmonary venous connection in an infant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pulmonary venous obstruction may occur in any type, but it is most commonly seen in infracardiac type which may be present in up to 78% of cases [3], [8]."
    explanation: >-
      Documents the high frequency of pulmonary venous obstruction, especially
      in infracardiac TAPVC.
  - reference: PMID:38988666
    reference_title: "Assessing the risk of reoperation for mild pulmonary vein obstruction post-TAPVC repair: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that a pre-discharge echocardiography Doppler velocity threshold of 1.2 m/s could serve as a critical predictor for reoperation, emphasizing the need for targeted follow-up strategies for at-risk patients."
    explanation: >-
      The postoperative cohort supports pulmonary vein obstruction as an
      important post-repair risk marker requiring follow-up.
  downstream:
  - target: Cyanosis
    description: Obstructed pulmonary venous return worsens systemic desaturation and respiratory compromise.
  - target: Respiratory Distress
    description: >-
      Elevated pulmonary venous pressure and interstitial pulmonary edema cause
      acute neonatal respiratory distress and respiratory failure.
  - target: Pulmonary Arterial Hypertension
    description: >-
      Back-pressure from obstructed pulmonary venous drainage and excessive
      pulmonary blood flow drive pulmonary arterial hypertension.
  - target: Congestive Heart Failure
    description: Severe pulmonary venous obstruction precipitates rapid neonatal cardiovascular decompensation and severe heart failure.
  - target: Tachycardia
    description: >-
      Hypoxemia and hemodynamic compromise from obstructed anomalous venous
      return trigger compensatory tachycardia.
  - target: Exertional Dyspnea
    description: >-
      Impaired pulmonary venous drainage and pulmonary vascular congestion
      produce exertional dyspnea, including during feeding in infants.
  - target: Fatigue
    description: >-
      Reduced systemic oxygen delivery and cardiac output limitation result in
      fatigue.
  - target: Paroxysmal Dyspnea
    description: >-
      Episodes of pulmonary venous congestion and pulmonary hypertensive crises
      manifest with paroxysmal dyspnea.
  - target: Right Ventricular Failure
    description: >-
      Severe pulmonary hypertension secondary to pulmonary venous obstruction
      increases right ventricular afterload and leads to right ventricular
      failure.

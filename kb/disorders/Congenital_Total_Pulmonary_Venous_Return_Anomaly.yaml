    snippet: "We identified a homozygous 2 bp deletion in MMP21, encoding matrix metalloproteinase-21, as the sole coding mutation that segregated with the phenotype."
    explanation: >-
      Identifies a homozygous MMP21 frameshift deletion segregating with human

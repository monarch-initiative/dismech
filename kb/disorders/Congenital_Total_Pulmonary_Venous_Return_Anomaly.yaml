pathophysiology:
- name: Altered Cardiac T-Box Transcription Factor Activity
  description: >-
    Pathogenic variants in cardiac T-box transcription factor TBX5 (loss of
    dimer stability and DNA-binding capacity in Holt-Oram syndrome) and
    candidate missense variants in the T-box DNA-binding domain of TBX20
    disrupt transcriptional regulation of pulmonary vein and atrial septation
    morphogenesis.

  - reference: PMID:26429889
    reference_title: "A human laterality disorder caused by a homozygous deleterious mutation in MMP21."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Transient suppression or CRISPR/Cas9-mediated deletion of mmp21 in zebrafish embryos induced cardiac looping defects, with concomitant disruption of laterality markers in the lateral plate mesoderm and disrupted notch signalling in vitro and in vivo."
    explanation: >-
      Demonstrates in zebrafish that mmp21 loss of function causes cardiac
      looping defects and disrupted left-right laterality and Notch signaling.
  - reference: PMID:36123719
    reference_title: "De novo disruptive heterozygous MMP21 variants are potential predisposing genetic risk factors in Chinese Han heterotaxy children."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Two of them (MMP21-G244E and MMP21-K487E) were loss-of-function mutations in both homozygous and heterozygous states based on zebrafish rescue experiments. Our results suggest that these two variants confer susceptibility to abnormal left–right patterning as well as abnormal cardiac development and may be involved in the pathogenesis of HTX."
    explanation: >-
      Shows that MMP21 knockdown causes heart looping defects in zebrafish and
      that patient-derived MMP21 variants fail to rescue cardiac looping.

progression:
- phase: Onset
  age_range: Congenital to Neonatal
  notes: >-
    Embryologic nonfusion of the pulmonary venous confluence with the left
    atrium is present at birth, and approximately 50% of patients develop
    clinical symptoms in the neonatal period with cyanosis, respiratory
    distress, and congestive heart failure.
  evidence:
  - reference: PMID:27594934
    reference_title: Computed tomography features of supracardiac total anomalous pulmonary venous connection in an infant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 50% of patients develop symptoms in neonatal period and the majority may expire during infancy without surgical repair [10]."
    explanation: >-
      Establishes that roughly half of patients become symptomatic in the
      neonatal period.
  - reference: PMID:32285325
    reference_title: "Approach to Cyanotic Congenital Heart Disease in Children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conditions like total anomalous pulmonary venous connection (TAPVC) and transposition of great arteries (TGA) usually present in neonatal period."
    explanation: >-
      Confirms neonatal presentation of TAPVC.
- phase: Progression
  age_range: Infancy to Adulthood
  notes: >-
    Without surgical intervention, TAPVC carries up to 80% mortality during
    infancy, although unobstructed supracardiac cases with large atrial septal
    defects may occasionally survive into adulthood. Postoperatively, mild
    pulmonary venous obstruction (Doppler velocity >= 1.2 m/s) occurs in up to
    31.6% of patients prior to discharge and predicts reoperation within 1 year.
  evidence:
  - reference: PMID:36713670
    reference_title: "Total anomalous pulmonary venous connection in 80 patients: Primary sutureless repair and outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Total anomalous pulmonary venous connection (TAPVC) is a rare but critical cardiac anomaly, in which pulmonary veins are connected to an abnormal location rather than the left atrium. The prognosis can be extremely poor without intervention, with a mortality of 80% during infancy."
    explanation: >-
      Documents 80% infant mortality in untreated TAPVC.
  - reference: PMID:27594934
    reference_title: Computed tomography features of supracardiac total anomalous pulmonary venous connection in an infant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unobstructed type I TAPVC has very similar pathophysiology to a large ASD, so lesions not detected in infancy may be discovered later [4]."
    explanation: >-
      Explains how unobstructed supracardiac TAPVC can present beyond infancy.
  - reference: PMID:38988666
    reference_title: "Assessing the risk of reoperation for mild pulmonary vein obstruction post-TAPVC repair: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings revealed that 31.6% of patients exhibited pre-discharge mild obstruction. During the median follow-up of 10 months, reoperations were notably higher in the mild obstruction group compared to the normal group, with a significant association between pre-discharge mild obstruction and increased risk of reoperation."
    explanation: >-
      Quantifies early postoperative pulmonary venous obstruction incidence and
      increased risk of reoperation.

    reference_title: "Approach to Cyanotic Congenital Heart Disease in Children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conditions like total anomalous pulmonary venous connection (TAPVC) and transposition of great arteries (TGA) usually present in neonatal period. Tetralogy of Fallot (TOF) and related conditions present with squatting, cyanotic spells and silent chest with no evidence of congestive heart failure, whereas transposition physiology presents with congestive heart failure with cyanosis."

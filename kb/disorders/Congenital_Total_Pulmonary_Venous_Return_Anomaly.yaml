inheritance:
- name: Sporadic
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  description: >-
    Most cases of total anomalous pulmonary venous connection occur as isolated
    congenital malformations without a known familial inheritance pattern,
    though higher frequency is observed in heterotaxy syndromes.
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Rare familial and syndromic forms follow autosomal dominant inheritance with
    variable expressivity, including Holt-Oram syndrome caused by TBX5 variants,
    familial candidate KDR variants, and heterozygous de novo disruptive MMP21
    variants causing syndromic visceral heterotaxy with complex congenital heart
    defects including TAPVC.
  evidence:
  - reference: PMID:35514310
    reference_title: "TBX5 variant with the novel phenotype of mixed‑type total anomalous pulmonary venous return in Holt‑Oram Syndrome and variable intrafamilial heart defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A nonsense variant was identified in TBX5 (c.577G>T; p.Gly193*) initially showing co‑segregation with a presumably non‑syndromic presentation of congenital heart disease. Subsequent genetic investigations and more complete phenotyping led to the correct diagnosis of HOS, documenting the novel association of mixed‑type TAPVR with HOS."
    explanation: >-
      Establishes autosomal dominant co-segregation of a TBX5 nonsense variant
      in a Holt-Oram syndrome family presenting with mixed-type TAPVR and
      variable intrafamilial heart defects.
  - reference: PMID:36123719
    reference_title: "De novo disruptive heterozygous MMP21 variants are potential predisposing genetic risk factors in Chinese Han heterotaxy children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three rare heterozygous non-synonymous MMP21 variants (p.G244E, p.L277F, p.K487E) were documented in three unrelated patients with HTX and confirmed to be de novo mutations by Sanger sequencing."
    explanation: >-
      Supports de novo heterozygous disruptive MMP21 mutations in patients with
      syndromic visceral heterotaxy and complex congenital heart defects
      including TAPVC.
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic loss-of-function MMP21 mutations cause autosomal recessive
    syndromic visceral heterotaxy (situs ambiguous) in which total anomalous
    pulmonary venous return occurs as part of the complex congenital heart
    defect spectrum.
  evidence:
  - reference: PMID:26429889
    reference_title: "A human laterality disorder caused by a homozygous deleterious mutation in MMP21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a recessive mutation in MMP21 that causes laterality defects in multiple affected members of a consanguineous family"
    explanation: >-
      Establishes autosomal recessive inheritance of homozygous deleterious
      MMP21 mutations in syndromic visceral heterotaxy with complex congenital
      heart defects.

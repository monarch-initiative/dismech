    reference_title: "De novo disruptive heterozygous MMP21 variants are potential predisposing genetic risk factors in Chinese Han heterotaxy children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three rare heterozygous non-synonymous MMP21 variants (p.G244E, p.L277F, p.K487E) were documented in three unrelated patients with HTX and confirmed to be de novo mutations by Sanger sequencing."
    explanation: >-
      Documents de novo disruptive MMP21 variants in heterotaxy patients with
      complex congenital heart defects including TAPVC.
treatments:
- name: Surgical Repair
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  description: >-
    Surgical redirection of pulmonary venous drainage to the left atrium
    (including conventional anastomosis and primary sutureless repair) is the
    definitive treatment, with urgent repair required when venous obstruction is
    present.
  target_phenotypes:
  - preferred_term: Total anomalous pulmonary venous return
    term:
      id: HP:0005160
      label: Total anomalous pulmonary venous return
  evidence:
  - reference: PMID:16638546
    reference_title: Surgical repair of total anomalous pulmonary venous connection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Obstructed TAPVC requires urgent surgical intervention, whereas unobstructed TAPVC can be dealt with electively; although this is usually operated on once the diagnosis is made."
    explanation: >-
      The review supports surgical repair as definitive management and
      distinguishes urgent management of obstructed TAPVR.
  - reference: PMID:36713670
    reference_title: "Total anomalous pulmonary venous connection in 80 patients: Primary sutureless repair and outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The primary sutureless technique may eliminate the differences between subtypes while decrease the postoperative PVO rate, which makes it applicable in any subtypes of TAPVC."
    explanation: >-
      The 80-patient surgical series supports modern operative repair and
      postoperative obstruction prevention strategies.
diagnosis:
- name: Echocardiography
  diagnosis_term:
    preferred_term: Echocardiography Test
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  description: >-
    First-line noninvasive imaging modality for screening and initial anatomic
    assessment of anomalous pulmonary venous drainage and interatrial shunting,
    though complex or mixed venous courses may be incompletely depicted.
  results: >-
    Demonstrates absence of pulmonary venous entrance into a small left atrium,
    right atrial and right ventricular dilation, and an obligatory right-to-left
    shunt (typically via an atrial septal defect).
  evidence:
  - reference: PMID:27594934
    reference_title: Computed tomography features of supracardiac total anomalous pulmonary venous connection in an infant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Echocardiography as the first and safest imaging modality for cardiovascular abnormalities may fail in complete depiction of some complex feature of TAPVC [3]."
    explanation: >-
      Establishes echocardiography as the first-line diagnostic modality and
      notes its limitations in complex TAPVC anatomy.
- name: Doppler Echocardiography
  diagnosis_term:
    preferred_term: Doppler Echocardiography Test
    term:
      id: NCIT:C38634
      label: Doppler Echocardiography Test
  description: >-
    Used preoperatively and postoperatively to quantify pulmonary venous flow
    velocity and detect pulmonary vein obstruction (PVO).
  results: >-
    A pre-discharge postoperative pulmonary venous Doppler flow velocity
    threshold of >= 1.2 m/s identifies mild PVO and predicts reoperation within
    1 year.
  evidence:
  - reference: PMID:38988666
    reference_title: "Assessing the risk of reoperation for mild pulmonary vein obstruction post-TAPVC repair: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that a pre-discharge echocardiography Doppler velocity threshold of 1.2 m/s could serve as a critical predictor for reoperation, emphasizing the need for targeted follow-up strategies for at-risk patients."
    explanation: >-
      Demonstrates the diagnostic utility of Doppler echocardiography velocity
      thresholds for postoperative PVO surveillance.
- name: Computed Tomography Angiography
  diagnosis_term:
    preferred_term: Computed Tomography Angiography
    term:
      id: NCIT:C202408
      label: Computed Tomography Angiography
  description: >-
    Noninvasive cross-sectional angiography used to map all four pulmonary
    veins, their confluence, vertical vein course, and sites of drainage or
    obstruction without invasive cardiac catheterization.
  results: >-
    Precisely delineates the pulmonary venous confluence behind the small left
    atrium, anomalous vertical or systemic venous drainage, and associated
    septal defects.
  evidence:
  - reference: PMID:27594934
    reference_title: Computed tomography features of supracardiac total anomalous pulmonary venous connection in an infant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CT angiography is then a noninvasive and sensitive choice for mapping the PVs without need for invasive cardiac catheterization [2], [9]."
    explanation: >-
      Supports CT angiography as a sensitive noninvasive modality for mapping
      pulmonary venous connections.
- name: Magnetic Resonance Angiography
  diagnosis_term:
    preferred_term: Magnetic Resonance Angiography
    term:
      id: NCIT:C190557
      label: Magnetic Resonance Angiography
  description: >-
    Radiation-free cross-sectional angiography alternative to CT angiography for
    evaluating anomalous pulmonary venous drainage and differentiating a
    vertical vein from a persistent left superior vena cava.
  evidence:
  - reference: PMID:27594934
    reference_title: Computed tomography features of supracardiac total anomalous pulmonary venous connection in an infant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is the radiation-free alternative for CT angiography but needs general anesthesia in younger children."
    explanation: >-
      Supports contrast-enhanced MR angiography as a radiation-free diagnostic
      alternative for pulmonary venous mapping.
differential_diagnoses:
- name: Persistent Pulmonary Hypertension of the Newborn
  disease_term:
    preferred_term: pulmonary hypertension
    term:
      id: MONDO:0005149
      label: pulmonary hypertension
  description: >-
    Neonatal pulmonary hypertension with severe hypoxemia and right-to-left
    shunting that frequently mimics obstructed TAPVC clinically and on initial
    echocardiography.
  distinguishing_features:
  - Cross-sectional CT/MR angiography or detailed echocardiography in TAPVC demonstrates absence of pulmonary vein connections to the left atrium and an anomalous venous confluence draining to the systemic venous circulation.
  evidence:
  - reference: PMID:27594934
    reference_title: Computed tomography features of supracardiac total anomalous pulmonary venous connection in an infant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TAPVC can occasionally be misdiagnosed as persistent pulmonary hypertension of the newborn and even echocardiographic findings may overlap [7]."
    explanation: >-
      Explicitly identifies persistent pulmonary hypertension of the newborn as
      a key diagnostic mimic of TAPVC.
- name: Dextro-Looped Transposition of the Great Arteries
  disease_term:
    preferred_term: dextro-looped transposition of the great arteries
    term:
      id: MONDO:0019443
      label: dextro-looped transposition of the great arteries
  description: >-
    Major neonatal cyanotic congenital heart defect that, like TAPVC, presents
    in the neonatal period with cyanosis, congestive heart failure, and
    increased pulmonary blood flow.
  distinguishing_features:
  - Transposition of the great arteries shows ventriculoarterial discordance (aorta arising from the right ventricle and pulmonary artery from the left ventricle) with normal pulmonary venous drainage to the left atrium.
  evidence:
  - reference: PMID:32285325
    reference_title: "Approach to Cyanotic Congenital Heart Disease in Children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conditions like total anomalous pulmonary venous connection (TAPVC) and transposition of great arteries (TGA) usually present in neonatal period."
    explanation: >-
      Groups TGA and TAPVC together as the principal neonatal cyanotic heart
      defects.
- name: Tetralogy of Fallot
  disease_term:
    preferred_term: tetralogy of fallot
    term:
      id: MONDO:0008542
      label: tetralogy of fallot
  description: >-
    Common cyanotic congenital heart disease included in the differential
    evaluation of cyanotic infants and children.
  distinguishing_features:
  - Tetralogy of Fallot physiology is characterized by reduced pulmonary blood flow, cyanotic spells, squatting, and a clinically silent chest without congestive heart failure or cardiomegaly, whereas TAPVC presents with pulmonary overcirculation, cardiomegaly, and congestive heart failure.
  evidence:
  - reference: PMID:32285325
    reference_title: "Approach to Cyanotic Congenital Heart Disease in Children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conditions like total anomalous pulmonary venous connection (TAPVC) and transposition of great arteries (TGA) usually present in neonatal period. Tetralogy of Fallot (TOF) and related conditions present with squatting, cyanotic spells and silent chest with no evidence of congestive heart failure, whereas transposition physiology presents with congestive heart failure with cyanosis."
    explanation: >-
      Contrasts Tetralogy of Fallot physiology against neonatal cyanotic
      congenital heart diseases presenting with congestive heart failure and
      cyanosis.
- name: Atrial Septal Defect
  disease_term:
    preferred_term: atrial septal defect
    term:
      id: MONDO:0006664
      label: atrial septal defect
  description: >-
    Isolated large atrial septal defect shares high pulmonary blood flow and
    right heart volume overload physiology with unobstructed supracardiac
    TAPVC.
  distinguishing_features:
  - In isolated atrial septal defect, the pulmonary veins connect normally to the left atrium and systemic arterial saturation is typically normal, whereas TAPVC shows anomalous venous drainage of all four pulmonary veins.
  evidence:
  - reference: PMID:27594934
    reference_title: Computed tomography features of supracardiac total anomalous pulmonary venous connection in an infant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unobstructed type I TAPVC has very similar pathophysiology to a large ASD, so lesions not detected in infancy may be discovered later [4]."
    explanation: >-
      Notes the physiological similarity between unobstructed Type I TAPVC and
      a large atrial septal defect.

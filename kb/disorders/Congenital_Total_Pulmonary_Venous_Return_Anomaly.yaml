- name: MMP21
  gene_term:
    preferred_term: MMP21
    term:
      id: hgnc:14357
      label: MMP21
  association: Associated
  inheritance:
  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  features: >-
    Biallelic loss-of-function and de novo disruptive heterozygous MMP21
    variants cause syndromic visceral heterotaxy (situs ambiguous), in which
    total anomalous pulmonary venous connection occurs as part of the complex
    laterality-associated cardiovascular malformation spectrum rather than as
    isolated non-syndromic TAPVR.
  evidence:
  - reference: PMID:26429889
    reference_title: "A human laterality disorder caused by a homozygous deleterious mutation in MMP21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Perturbation of this asymmetry causes either situs inversus totalis (SIT), an often asymptomatic condition, or situs ambiguous (heterotaxia), leading to complex cardiovascular malformations such as transposition of the great arteries (TGA), double outlet right ventricle, double inlet left ventricle, atrioventricular septal defects and total anomalous pulmonary venous connection."
